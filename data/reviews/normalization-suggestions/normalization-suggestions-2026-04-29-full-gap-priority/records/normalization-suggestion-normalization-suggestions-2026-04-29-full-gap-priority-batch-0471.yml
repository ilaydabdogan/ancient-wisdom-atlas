- Avoid treating symbolic death imagery, fated death, grief-death, and postmortem
  celestial transformation as the same death-return pattern; they serve different
  narrative functions.
- The Wild Hunt death-god label may indicate a missing psychopomp/death-deity role
  group, but source evidence is needed before adding it.
