batch_notes:
- Several labels in this batch cluster around sacred healing, ritual medicine, and
  healer roles. Consider whether a new canonical group such as sacred_healing_medicine
  should be added after reviewing more unmapped healing motifs.
- Use caution with culturally specific Indigenous and Mesoamerican healing labels;
  source evidence should determine whether the item is a narrative motif, ritual practice,
  deity-domain index term, or generated passage artifact.
- Where healing is clearly caused by a god, spirit, or supernatural agent, divine_intervention
  remains a safe broad parent; where medicine or charms are primary, sacred_substance,
  sacred_law, or curse_blessing_speech may be relevant secondary placements.
