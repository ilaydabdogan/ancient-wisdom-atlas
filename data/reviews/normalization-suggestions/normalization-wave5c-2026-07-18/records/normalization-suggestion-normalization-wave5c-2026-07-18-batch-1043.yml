- This batch contains several near-synonymous ritual-healing extraction labels; human
  review should consider folding them as aliases or children under one ritual-healing
  group rather than preserving each as a separate canonical child.
- The proposed group is provisional because healing is currently distributed across
  divine_intervention, sacred_law, sacrifice, sacred_substance, and soul_loss_restoration,
  but none of those groups centers ritual healing as the primary pattern.
