batch_notes:
- Most Native American Southwest labels form a tight cluster around masked or effigy
  personation of sacred beings. Existing theophany is the best provisional parent,
  but a ritual-personation group may preserve important ceremonial mechanism if evidence
  recurs beyond near-duplicate generated labels.
- Several labels are single-occurrence and culturally sensitive; human review should
  check whether they are distinct motifs, duplicate descriptions of one ceremony,
  or source-specific ethnographic notes.
- Avoid treating mask, effigy, procession, plaza, and house-dedication details as
  separate canonical motifs unless source evidence shows recurrent independent functions.
