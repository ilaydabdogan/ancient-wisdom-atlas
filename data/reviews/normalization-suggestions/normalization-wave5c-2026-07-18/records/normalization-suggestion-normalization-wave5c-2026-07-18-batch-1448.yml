batch_notes:
- Several labels concern culturally specific Indigenous song practices. Final placement
  should check source evidence and avoid flattening ceremonial roles into generic
  music motifs.
- Use enchanting_music for song as efficacious sound; use sacred_knowledge for preservation
  or transmission of words; use dream_and_vision when dream acquisition is the defining
  feature.
- Over-specific single-occurrence performance details should remain evidence notes
  unless recurring across sources.
