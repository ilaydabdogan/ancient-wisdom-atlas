  suggested_action: new_group_candidate
  suggested_group_id: ''
  suggested_group_label: Multiple Souls and Composite Personhood
  relationship: child
  confidence: medium
  rationale: The label concerns soul anthropology rather than soul-loss, external
    soul, or afterlife navigation; existing groups do not cleanly cover plural souls
    within one person.
  cautions: Single occurrence and culturally specific Filipino evidence; avoid flattening
    distinct local concepts of soul/personhood into a generic comparative category
    without review.
  suggested_aliases:
  - plural_souls
  - multiple_souls
  - many_souls_associated_with_sacred_number
  suggested_new_group:
    id: multiple_souls_composite_personhood
    label: Multiple Souls and Composite Personhood
    description: A person is understood as having multiple souls, spirits, vital components,
      or life-aspects that may differ in number, function, location, vulnerability,
      or postmortem fate.
    parent_group_ids:
    - death_and_transformation
    - sacred_knowledge
    related_group_ids:
    - external_soul
    - soul_loss_restoration
    - afterlife_passage
    reason_existing_groups_insufficient: External_soul covers separable life-tokens;
      soul_loss_restoration covers lost or recalled souls; afterlife_passage covers
      postmortem travel. None directly covers plural-soul anthropology as the main
      motif.
