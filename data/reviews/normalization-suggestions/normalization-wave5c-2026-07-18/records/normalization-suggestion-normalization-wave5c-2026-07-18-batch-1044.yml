batch_notes:
- 'The seven Native American healing labels appear to form a coherent candidate group:
  ritual_healing_sacred_medicine. Human review should decide whether to add this as
  a canonical normalization group or fold these as children under divine_intervention,
  sacred_law, and sacred_substance.'
- Several healing labels are single-occurrence, procedure-heavy, and culturally specific;
  preserve local details but avoid promoting each technique as its own canonical motif.
- The Confucian hierarchy labels fit sacred_law because their central function is
  ritualized social order, even when expressed through dress, mourning, vessels, or
  seating.
