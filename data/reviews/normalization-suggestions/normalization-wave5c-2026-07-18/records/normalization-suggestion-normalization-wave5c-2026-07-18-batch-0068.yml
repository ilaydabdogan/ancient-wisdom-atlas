- Several labels are single-occurrence mortuary or ritual-practice descriptions; preserve
  local funerary context and avoid promoting them to canonical motifs without recurrence.
- Where labels describe communal mourning, existing lament_and_mourning is sufficient;
  where they describe avoidance, contagion, or protective mortuary regulation, sacred_law
  is the safer broad group.
