batch_notes:
- Several labels in this batch express ritual or interior purification, but the current
  taxonomy lacks a dedicated purification group. Most can provisionally sit under
  sacred_law when framed as ritual purity regulation, or sacred_knowledge/mystical_quest
  when framed as interior transformation.
- Gnostic purification labels require source review because their meaning may be cosmological,
  sacramental, ascetic, or mythic rather than general ritual purity.
- Water and fire imagery should not be mapped automatically to flood_and_renewal or
  world_destroying_fire unless catastrophic world/order destruction and renewal are
  explicit.
