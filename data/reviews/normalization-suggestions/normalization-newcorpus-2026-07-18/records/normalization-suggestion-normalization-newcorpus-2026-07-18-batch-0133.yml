batch_notes:
- Several labels concern spirit agency in Australian Aboriginal and Indigenous American
  contexts; review should preserve local ritual meanings and avoid overgeneralizing
  all spirit activity into afterlife motifs.
- Whirlwind-related spirit labels lack enough functional evidence for confident placement
  and may warrant later review if a weather-spirit or nature-spirit agency group emerges.
- Healing and extraction labels expose a possible gap for ritual healing/spirit affliction,
  currently split across soul_loss_restoration, divine_intervention, sacred_law, and
  sacrifice/ritual_expulsion.
