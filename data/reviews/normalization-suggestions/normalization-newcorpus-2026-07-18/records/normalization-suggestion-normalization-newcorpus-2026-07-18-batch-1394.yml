batch_notes:
- Several labels in this batch cluster around feasts as sites of reconciliation, hospitality,
  betrayal, vulnerability, and mourning. Existing groups can cover most by function,
  but human review should distinguish feast-as-reciprocity from feast-as-treachery
  and feast-as-foreshadowing.
