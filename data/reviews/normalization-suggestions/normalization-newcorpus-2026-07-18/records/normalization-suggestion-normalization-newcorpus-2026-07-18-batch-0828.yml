- These labels form a coherent cluster of animal-trait and animal-behavior etiologies.
  A single new review group is preferable to scattering them under trickster, shapeshifter,
  or cosmic_origin.
- Where a passage explains landscape formation or place names as much as animal traits,
  consider secondary or primary mapping to cosmic_origin.
