  rationale: The label names the broad folklore pattern of life or soul externalized
    from the body and made vulnerable through an object or being.
  cautions: Only one occurrence here, but the batch shows many near-duplicate variants;
    review whether to group as a canonical query group rather than taxonomy motif
    family.
  suggested_aliases:
  - external soul
  - vulnerable soul
  - external life
  - life token
  suggested_new_group:
    id: external_soul_life_token
    label: External Soul and Life Token
    description: A figure's soul, life, death, or vulnerability is kept outside the
      body in an object, animal, container, or hidden place, so harming or controlling
      that external token affects the owner.
