      on trust—financial markets, identity, information—the trickster would twist
      them, forcing us to confront how easily we’re fooled and what that reveals.'
  atlas_grounded: 'The evidence does not support a single modern costume, place, or
    voice for the trickster. Its defining feature is not a fixed form but boundary-work:
    “Trickster At The Boundary” accounts for 2,319 occurrences in 65 traditions, within
    3,278 occurrences across all 68 traditions. In today’s world, it would therefore
    most plausibly appear wherever boundaries are being crossed, disputed, or remade—not
    in one prescribed setting. It might speak in shifting, context-dependent ways
    rather than a stable idiom, because its strongest recurrent companions include
    sacred knowledge (25 traditions), shapeshifting (21), death/transformation (16),
    and exchange (14). Yet no universal portrait can be claimed: although present
    in 68 traditions, it occurs in only 1 of the 24 strongest matched cross-world
    bonds. The modern trickster, by this evidence, would be recognizably liminal but
    structurally unpredictable.'
