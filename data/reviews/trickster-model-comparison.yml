      Coyote in many Native North American traditions steals fire, releases game, bungles creation, and thereby explains why the world is imperfect. Raven among Northwest Coast peoples brings light but through theft and appetite. Anansi in Akan/Ashanti stories wins stories, wisdom, or food by cunning, modeling survival under unequal power. Hermes in Greece steals Apollo’s cattle and becomes patron of exchange, travel, and mediation. Eshu-Elegba in Yoruba religion opens and scrambles communication between gods and humans.

      The trickster breaks order so a new, more livable order can appear.
