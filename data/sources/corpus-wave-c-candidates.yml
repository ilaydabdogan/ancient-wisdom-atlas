collection_id: corpus_wave_c_candidates
title: Corpus Wave C Candidate Sources
created_on: '2026-04-28'
notes: User-suggested high-value expansion wave for creation, afterlife, Daoist, Shinto, Sufi, imaginal, and Indigenous Australian materials. Verify exact edition metadata, source terms, and cultural protocols before ingest.
candidates:
- title: Enuma Elish / The Seven Tablets of Creation
  tradition: mesopotamian
  culture: babylonian
  source_url: https://sacred-texts.com/ane/stc/index.htm
  alternate_source_url: https://wikisource.org/wiki/En%C3%BBma_Eli%C5%A1
  priority: high
  rights_notes: L. W. King's 1902 translation is public domain by age; verify transcription/source terms before ingesting a complete Markdown edition.
  why_it_matters: Babylonian creation epic for chaos battle, world-making from a defeated body, divine kingship, and comparison with Genesis creation patterns.
- title: The Tibetan Book of the Dead / Bardo Thodol
  tradition: buddhist
  culture: tibetan
  source_url: https://en.wikisource.org/wiki/Index:The_Tibetan_Book_of_the_Dead_(1927).djvu
  priority: high
  rights_notes: The 1927 Evans-Wentz edition is marked public domain in the United States on Wikisource but not globally clear; keep jurisdiction notes and prefer scan-backed provenance.
  why_it_matters: Major after-death instruction text for comparing postmortem maps, liminal states, judgment, visionary beings, liberation, and ritual reading with Egyptian afterlife texts.
- title: Chuang Tzu / Zhuangzi
  tradition: daoist
  culture: classical_chinese
  source_url: https://www.gutenberg.org/ebooks/59709
  priority: high
  rights_notes: Project Gutenberg source; verify translator metadata and scope before ingest.
  why_it_matters: Daoist narrative-philosophical source for transformation, dream, perspective reversal, anti-heroic wisdom, uselessness, and freedom from fixed categories.
- title: The Tao Teh King, or the Tao and its Characteristics
  tradition: daoist
  culture: classical_chinese
  source_url: https://www.gutenberg.org/ebooks/216
  priority: already_ingested
  rights_notes: Project Gutenberg catalog records public-domain status in the USA; already present in the corpus as the Legge translation.
  why_it_matters: Existing Daoist base text; use as anchor for comparison with Zhuangzi, Confucian texts, and wisdom motifs.
- title: Kojiki, Chamberlain translation
  tradition: shinto
  culture: ancient_japanese
  source_url: https://en.wikisource.org/wiki/Kojiki_(Chamberlain)
  priority: high
  rights_notes: Chamberlain's 1882 translation is public domain by age; Wikisource transcription terms should be recorded if used.
  why_it_matters: Japanese creation and myth-history source for divine descent, sibling deities, underworld pollution, sun goddess sovereignty, storm god conflict, and imperial origins.
- title: Bird Parliament / Conference of the Birds
  tradition: islamic
  culture: persian_sufi
  source_url: https://www.sacred-texts.com/isl/bp/index.htm
  priority: high
  rights_notes: Edward FitzGerald's 1889 Bird Parliament is public domain by age but abridged; modern complete translations are generally copyrighted.
  why_it_matters: Sufi quest narrative centered on collective pilgrimage, annihilation of ego, world mountain, Simurgh, and death-and-rebirth stages.
- title: Ibn Arabi and the imaginal world
  tradition: islamic
  culture: andalusian_sufi
  source_url: https://www.gutenberg.org/files/77789/77789-h/77789-h.htm
  priority: medium
  rights_notes: Treat as a research/theory lane first; many primary English translations of Ibn Arabi are modern and copyrighted, so use citation-only or public-domain secondary scholarship until a rights-clear primary source is identified.
  why_it_matters: Provides theoretical vocabulary for imaginal realms, visionary experience, ascent, symbolic perception, and the intermediate world between sensory and spiritual reality.
- title: Australian Legendary Tales
  tradition: indigenous_australian
  culture: indigenous_australian_noongahburrah_euahlayi_context
  source_url: https://www.gutenberg.org/ebooks/3833
  priority: ethics_review_required
  rights_notes: Project Gutenberg records public-domain status in the USA, but colonial collection context and living cultural protocols require careful framing, community-specific metadata, and no flattening into generic "Dreamtime" categories.
  why_it_matters: Important Indigenous Australian narrative collection for creation, ancestral beings, landform explanation, law, kinship, and deep-time mythic pattern comparison when handled with cultural care.
