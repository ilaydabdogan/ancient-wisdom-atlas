        - { slug: distraction_in_early_practice, label: Distraction in early practice, basis: Distractions are constant, confidence: high }

    - passage_slug: second_mansion
      section: The Second Mansion — Practice of Prayer Amid Struggle
      summary: Practitioner takes up prayer as discipline; struggle with distraction; prayer is dry, intermittently consoled, often stubborn return.
      motifs:
        - { slug: spiritual_dryness, label: Spiritual dryness, basis: Prayer is dry in early practice, confidence: high }
