- text_id: nde.iands_phenomenology.iands_consensus
  source_path: texts/experiential/nde/iands-phenomenology.md
  tradition: nde
  sub_corpus: nde
  author_attribution: International Association for Near-Death Studies
  passages:

    - passage_slug: sense_of_being_dead
      section: Sense of Being Dead
      summary: Direct, immediate awareness that one has died; sometimes mild surprise, rarely fear.
      motifs:
        - { slug: awareness_of_being_dead, label: Awareness of being dead, basis: Direct claim of recognizing one's death, confidence: high }
        - { slug: self_distinct_from_body, label: Self distinct from body, basis: Person knows themselves no longer the body, confidence: high }

    - passage_slug: peace_and_painlessness
      section: Peace and Painlessness
      summary: Pain absent; profound peace pervades the experience; defining tone of the state.
      motifs:
        - { slug: profound_peace, label: Profound peace, basis: Pervasive peace is the defining tone, confidence: high }
        - { slug: cessation_of_pain, label: Cessation of pain, basis: Pain is absent, confidence: high }
        - { slug: cessation_of_anxiety, label: Cessation of anxiety, basis: Anxieties dissolve, confidence: high }

    - passage_slug: out_of_body
      section: Out-of-Body Experience
      summary: Person perceives themselves above the body, watching the resuscitation; vision is panoramic, clear, unconfined.
      motifs:
        - { slug: out_of_body_experience, label: Out-of-body experience, basis: Direct description of OBE, confidence: high }
        - { slug: viewing_body_from_above, label: Viewing the body from above, basis: Vantage point above the bed, confidence: high }
        - { slug: panoramic_clear_vision, label: Panoramic clear vision, basis: Vision unconfined by walls, confidence: high }
        - { slug: subtle_body, label: Subtle body, basis: Light, weightless body perceived, confidence: high }

