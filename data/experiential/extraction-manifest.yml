        - { slug: raptures, label: Raptures, basis: Direct mention of raptures, confidence: high }
        - { slug: wound_of_love, label: Wound of love, basis: Wound of love is constant, confidence: high }
        - { slug: bodily_stillness_in_rapture, label: Bodily stillness in rapture, basis: Body becomes still during rapture, confidence: medium }
        - { slug: senses_suspended, label: Senses suspended, basis: Senses suspended during rapture, confidence: medium }
        - { slug: public_misunderstanding_of_mystic, label: Public misunderstanding of mystic, basis: Recognition, suspicion, slander accompany state, confidence: medium }
        - { slug: dark_night_of_intense_presence, label: Dark night of intense presence, basis: Intensity ordinary self cannot bear, confidence: medium }

    - passage_slug: seventh_mansion
      section: The Seventh Mansion — Spiritual Marriage and Mystical Union
      summary: Soul united with God in spiritual marriage; longing quiets, replaced by settled continuous presence; faculties continue ordinary work; union holds across action and suffering; quiet rather than ecstatic.
      motifs:
