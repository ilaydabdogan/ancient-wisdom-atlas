- text_id: nde.van_lommel_elements.lancet_2001
  source_path: texts/experiential/nde/van-lommel-elements.md
  tradition: nde
  sub_corpus: nde
  author_attribution: Pim van Lommel and colleagues
  passages:

    - passage_slug: awareness_of_being_dead
      section: Awareness of Being Dead
      summary: A direct, often startled awareness that one has died; recognition is immediate, not inferred.
      motifs:
        - { slug: awareness_of_being_dead, label: Awareness of being dead, basis: Direct recognition of one's death, confidence: high }
        - { slug: self_distinct_from_body, label: Self distinct from body, basis: Person knows themselves not to be the body, confidence: high }

    - passage_slug: positive_emotions
      section: Positive Emotions
      summary: Pervasive well-being, peace, or joy; a positive emotional tone qualitatively unlike ordinary good feeling.
      motifs:
        - { slug: profound_peace, label: Profound peace, basis: Peace is reported as the dominant tone, confidence: high }
        - { slug: bliss_or_joy, label: Bliss or joy, basis: Strong positive feeling described as unlike ordinary good moods, confidence: high }
        - { slug: cessation_of_anxiety, label: Cessation of anxiety, basis: Anxieties of the cardiac event are absent, confidence: high }

    - passage_slug: out_of_body
      section: Out-of-Body Experience
      summary: Patient perceives themselves separated from the physical body, often above the bed, observing the resuscitation; vision is continuous and clear.
      motifs:
        - { slug: out_of_body_experience, label: Out-of-body experience, basis: Direct description of separation from body, confidence: high }
        - { slug: viewing_body_from_above, label: Viewing the body from above, basis: Vantage point above the bed reported, confidence: high }
        - { slug: corroboration_of_perceived_details, label: Corroboration of perceived details, basis: Verifiable details of resuscitation later confirmed, confidence: medium }

    - passage_slug: tunnel
      section: Moving Through a Tunnel
      summary: Sensation of moving through enclosed dark space toward light; motion is smooth and irresistible.
      motifs:
        - { slug: dark_tunnel, label: Dark tunnel, basis: Direct mention of tunnel, corridor, or dark passage, confidence: high }
        - { slug: rapid_smooth_transit, label: Rapid smooth transit, basis: Movement described as smooth and drawing rather than self-propelled, confidence: high }
        - { slug: light_at_end_of_tunnel, label: Light at end of tunnel, basis: Light is visible at end or ahead, confidence: high }

    - passage_slug: communication_with_light
      section: Communication with the Light
      summary: Encounter with a luminous presence experienced as conscious and personal; communication is direct, mind-to-mind, without spoken words.
      motifs:
        - { slug: being_of_light, label: Being of light, basis: Luminous presence is conscious and personal, confidence: high }
        - { slug: direct_mind_to_mind_communication, label: Direct mind-to-mind communication, basis: Communication is described as wordless, confidence: high }
        - { slug: complete_acceptance, label: Complete acceptance, basis: The light's stance is acceptance and complete knowing, confidence: medium }

    - passage_slug: observation_of_colors
      section: Observation of Colours
      summary: Perception of colors unlike any seen in waking life; described as more vivid, saturated, or outside the normal visible spectrum.
      motifs:
        - { slug: saturated_colors, label: Saturated colors, basis: Colors are vivid and saturated beyond ordinary perception, confidence: high }
        - { slug: perception_outside_normal_spectrum, label: Perception outside normal spectrum, basis: Some colors described as not part of ordinary vision, confidence: medium }

    - passage_slug: celestial_landscape
      section: Observation of a Celestial Landscape
      summary: Environment unlike any earthly place — a landscape, garden, or city of unearthly beauty; familiar and entirely new at once.
      motifs:
        - { slug: celestial_landscape, label: Celestial landscape, basis: Otherworldly environment is perceived, confidence: high }
        - { slug: heavenly_garden_or_meadow, label: Heavenly garden or meadow, basis: Common imagery of garden, meadow, or vegetation, confidence: medium }
        - { slug: otherworld_paradoxically_familiar, label: Otherworld paradoxically familiar, basis: Place felt as both new and recognized, confidence: medium }

    - passage_slug: meeting_deceased
      section: Meeting with Deceased Persons
      summary: Encounter with people known to be dead; sometimes a deceased person whose death the patient did not yet know about.
      motifs:
        - { slug: meeting_deceased_relatives, label: Meeting deceased relatives, basis: Recognized deceased persons appear, confidence: high }
        - { slug: meeting_unknown_deceased, label: Meeting deceased the experiencer did not know was dead, basis: Some meet deceased whose death is later confirmed, confidence: medium }
        - { slug: deceased_as_greeters_or_guides, label: Deceased as greeters or guides, basis: They are felt as guides or greeters, confidence: high }

    - passage_slug: life_review
      section: Life Review
      summary: Panoramic re-experiencing of the person's life; events seen all at once or in rapid sequence, sometimes from others' perspectives.
      motifs:
        - { slug: panoramic_life_review, label: Panoramic life review, basis: Entire life seen at once or sequentially, confidence: high }
        - { slug: multiple_perspectives_in_review, label: Multiple perspectives in review, basis: Events viewed from those affected, confidence: medium }
        - { slug: understanding_without_judgment, label: Understanding without judgment, basis: Review is felt as understanding rather than judgment, confidence: medium }

    - passage_slug: border
      section: Presence of a Border
      summary: A boundary or limit beyond which there is no return; experiencer recognizes irreversibility and is turned back.
      motifs:
        - { slug: border_or_limit, label: Border or limit, basis: Direct mention of a boundary, confidence: high }
        - { slug: point_of_no_return, label: Point of no return, basis: Crossing recognized as irrevocable, confidence: high }
        - { slug: forced_or_chosen_return, label: Forced or chosen return, basis: Patient is turned back or returns by decision, confidence: high }

