- text_id: nde.greyson_scale.greyson_1983
  source_path: texts/experiential/nde/greyson-scale.md
  tradition: nde
  sub_corpus: nde
  author_attribution: Bruce Greyson
  passages:

    - passage_slug: time_distortion
      section: Time Distortion
      summary: Subjective time differs from clock time — stopped, expanded into eternal present, or compressed.
      motifs:
        - { slug: time_distortion, label: Time distortion, basis: Direct claim that time passed differently, confidence: high }
        - { slug: experience_of_eternity_or_timelessness, label: Experience of eternity or timelessness, basis: Time may seem to stop or expand to a felt eternity, confidence: high }
        - { slug: simultaneity_of_past_and_present, label: Simultaneity of past and present, basis: Long sequences may happen at once, confidence: medium }

    - passage_slug: thought_acceleration
      section: Thought Acceleration
      summary: Mental operations occur faster than ordinary, with vivid clarity and speed felt as distinctly unlike waking cognition.
      motifs:
        - { slug: thought_acceleration, label: Thought acceleration, basis: Thoughts move faster than usual, confidence: high }
        - { slug: vivid_mental_clarity, label: Vivid mental clarity, basis: Clarity of mental operation is unusual, confidence: high }

    - passage_slug: life_review_panoramic
      section: Life Review (Panoramic Memory)
      summary: Whole or much of life is seen at once or replayed in vivid sequence, sometimes from others' perspectives, with comprehensive understanding.
      motifs:
        - { slug: panoramic_life_review, label: Panoramic life review, basis: Direct description of full-life review, confidence: high }
        - { slug: multiple_perspectives_in_review, label: Multiple perspectives in review, basis: Events sometimes viewed from those affected, confidence: high }
        - { slug: understanding_without_judgment, label: Understanding without judgment, basis: Review accompanied by understanding rather than judgment, confidence: high }

    - passage_slug: sudden_understanding
      section: Sudden Understanding
      summary: Sudden grasp of large or fundamental matters; understanding felt as direct rather than inferred.
      motifs:
        - { slug: noetic_quality, label: Noetic quality, basis: Direct knowing rather than reasoning, confidence: high }
        - { slug: comprehension_of_fundamental_truths, label: Comprehension of fundamental truths, basis: Sudden grasp of large matters, confidence: high }
        - { slug: understanding_larger_than_any_single_insight, label: Understanding larger than any single insight, basis: Felt as larger than discrete insight, confidence: medium }

    - passage_slug: feeling_of_peace
      section: Feeling of Peace
      summary: Pervasive peace and well-being unlike any in ordinary life; tension, fear, and pain dissolve into a felt baseline.
      motifs:
        - { slug: profound_peace, label: Profound peace, basis: Direct description of pervasive peace, confidence: high }
        - { slug: cessation_of_pain, label: Cessation of pain, basis: Pain dissolves, confidence: high }

    - passage_slug: feeling_of_joy
      section: Feeling of Joy
      summary: Profound joy described as bliss or ecstasy; not contingent on circumstance and not followed by loss when remembered.
      motifs:
        - { slug: bliss_or_joy, label: Bliss or joy, basis: Direct description of profound joy or bliss, confidence: high }
        - { slug: noncontingent_positive_state, label: Noncontingent positive state, basis: Joy not dependent on circumstances, confidence: medium }

    - passage_slug: cosmic_unity
      section: Cosmic Unity
      summary: Felt sense of being one with the universe, all life, or everything; boundaries between self and other dissolve.
      motifs:
        - { slug: cosmic_unity, label: Cosmic unity, basis: Direct description of being one with universe, confidence: high }
        - { slug: dissolution_of_self_other_boundary, label: Dissolution of self-other boundary, basis: Boundaries between self and other dissolve, confidence: high }
        - { slug: continuity_with_world, label: Continuity with the world, basis: Experiencer felt continuous rather than separate, confidence: high }

    - passage_slug: brilliant_light
      section: Encounter with Brilliant Light
      summary: Light exceedingly bright but not painful, often felt as conscious and personal; communication is direct.
      motifs:
        - { slug: being_of_light, label: Being of light, basis: Light felt as conscious and personal, confidence: high }
        - { slug: brilliant_light_not_painful, label: Brilliant light not painful to look at, basis: Direct description of intense yet bearable light, confidence: high }
        - { slug: direct_mind_to_mind_communication, label: Direct mind-to-mind communication, basis: Communication with light is direct, confidence: medium }

    - passage_slug: vivid_sensory
      section: Vivid Sensory Experiences
      summary: Sensory perceptions unusually clear, sharp, or saturated; experience felt as more real than ordinary reality.
      motifs:
        - { slug: heightened_perception, label: Heightened perception, basis: Direct description of unusually vivid senses, confidence: high }
        - { slug: more_real_than_ordinary_reality, label: More real than ordinary reality, basis: Experience reported as more real, confidence: high }
        - { slug: saturated_colors, label: Saturated colors, basis: Colors more intense than ordinary, confidence: medium }

    - passage_slug: esp
      section: Apparent Extrasensory Perception
      summary: Knowledge of events at a distance or beyond visual range; knowledge felt as direct.
      motifs:
        - { slug: knowledge_at_a_distance, label: Knowledge at a distance, basis: Reports include knowledge from distant or hidden locations, confidence: medium }
        - { slug: extrasensory_perception, label: Extrasensory perception, basis: Direct description of ESP-type access, confidence: medium }

    - passage_slug: precognitive_vision
      section: Precognitive Vision
      summary: Awareness of future events; visions felt as direct knowledge rather than speculation.
      motifs:
        - { slug: precognition, label: Precognition, basis: Visions of future events, confidence: medium }
        - { slug: direct_knowing_of_future, label: Direct knowing of future, basis: Future events felt as known rather than guessed, confidence: medium }

    - passage_slug: out_of_body
      section: Out-of-Body Experience
      summary: Experiencer perceives themselves outside the physical body, viewing it from above; vision is panoramic and clear.
      motifs:
        - { slug: out_of_body_experience, label: Out-of-body experience, basis: Direct description of being outside the body, confidence: high }
        - { slug: viewing_body_from_above, label: Viewing the body from above, basis: Common vantage point above the body, confidence: high }
        - { slug: panoramic_clear_vision, label: Panoramic clear vision, basis: Vision is sharp and panoramic, confidence: high }

    - passage_slug: otherworldly_environment
      section: Otherworldly Environment
      summary: Environment unlike any earthly place; felt as real, distinct, and somehow more substantial than ordinary settings.
      motifs:
        - { slug: otherworldly_environment, label: Otherworldly environment, basis: Direct description of nonworldly setting, confidence: high }
        - { slug: more_substantial_than_ordinary, label: More substantial than ordinary, basis: Place felt more real than waking environments, confidence: medium }

    - passage_slug: mystical_entity
      section: Mystical Entity
      summary: Encounter with a being recognized as sacred or spiritual; numinous quality.
      motifs:
        - { slug: mystical_presence, label: Mystical presence, basis: Encounter with sacred or spiritual being, confidence: high }
        - { slug: numinous_encounter, label: Numinous encounter, basis: Encounter has numinous quality, confidence: high }
        - { slug: religious_figure_perceived, label: Religious figure perceived, basis: May be identified as angel, guide, or named religious figure, confidence: medium }

    - passage_slug: visible_spirits_of_dead
      section: Visible Spirits of the Dead
      summary: Encounter with deceased persons known to the experiencer; recognized and present to greet, guide, or communicate.
      motifs:
        - { slug: meeting_deceased_relatives, label: Meeting deceased relatives, basis: Recognized deceased persons appear, confidence: high }
        - { slug: deceased_as_greeters_or_guides, label: Deceased as greeters or guides, basis: They greet, guide, or communicate, confidence: high }

    - passage_slug: border
      section: Border or Point of No Return
      summary: Awareness of a limit beyond which return would not be possible; recognized as decisive.
      motifs:
        - { slug: border_or_limit, label: Border or limit, basis: Direct description of boundary, confidence: high }
        - { slug: point_of_no_return, label: Point of no return, basis: Crossing recognized as decisive, confidence: high }
        - { slug: forced_or_chosen_return, label: Forced or chosen return, basis: Experiencer is turned back, told to return, or chooses, confidence: high }

