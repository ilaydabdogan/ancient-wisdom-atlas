      summary: Practitioner has built habits of virtue and discipline; life is ordered and prayerful; quiet recollection of God during the day; danger is subtle complacency.
      motifs:
        - { slug: established_practice, label: Established practice, basis: Habits of virtue and discipline established, confidence: high }
