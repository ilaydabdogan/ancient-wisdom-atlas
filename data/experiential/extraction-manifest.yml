    - passage_slug: fifth_mansion
      section: The Fifth Mansion — The Prayer of Union and Spiritual Betrothal
      summary: Faculties absorbed; soul rests in God; brief but unmistakable union; silkworm-butterfly transformation; orientation toward God irreversible; longing sharp and painful even amid joy.
      motifs:
        - { slug: prayer_of_union, label: Prayer of union, basis: Direct mention of prayer of union, confidence: high }
        - { slug: faculties_absorbed, label: Faculties absorbed, basis: Faculties absorbed in God, confidence: high }
        - { slug: silkworm_butterfly_transformation, label: Silkworm-butterfly transformation, basis: Image of silkworm dying in cocoon and emerging as butterfly, confidence: high }
        - { slug: irreversible_orientation_to_god, label: Irreversible orientation to God, basis: Reorientation no longer reversible, confidence: high }
        - { slug: sharp_longing_amid_joy, label: Sharp longing amid joy, basis: Longing sharp and painful even amid joy, confidence: medium }

    - passage_slug: sixth_mansion
      section: The Sixth Mansion — Visions, Locutions, Raptures, and the Wound of Love
      summary: Intense graces and intense suffering; visions interior, imaginary, rarely corporeal; locutions heard with authority and peace; raptures take soul out of itself; wound of love constant; public misunderstanding accompanies state.
      motifs:
        - { slug: visions, label: Visions, basis: Direct mention of visions, confidence: high }
