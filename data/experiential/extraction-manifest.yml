- text_id: contemplative.bardo_thodol.three_bardos_summary
  source_path: texts/experiential/contemplative/bardo-thodol.md
  tradition: contemplative
  sub_corpus: contemplative
  author_attribution: Bardo Thödol — Tibetan Nyingma terma tradition
  passages:

    - passage_slug: chikhai_clear_light
      section: The Chikhai Bardo — The Moment of Death and the Clear Light
      summary: At death, ordinary consciousness dissolves into a luminous expanse — the Clear Light of pure awareness — vast, unobstructed, self-radiant; ground of awareness ordinarily obscured; if recognized, immediate liberation; sequential dissolution of body's elements and inner signs (mirage, smoke, fireflies, flame, luminous expanse).
      motifs:
        - { slug: clear_light_of_awareness, label: Clear light of awareness, basis: Direct description of the Clear Light, confidence: high }
        - { slug: ground_of_awareness, label: Ground of awareness, basis: Light is the unconditioned ground of awareness itself, confidence: high }
        - { slug: vast_unobstructed_openness, label: Vast unobstructed openness, basis: Direct description of openness of awareness, confidence: high }
        - { slug: dissolution_of_elements, label: Dissolution of the elements, basis: Sequential dissolution of body's elements, confidence: high }
        - { slug: inner_signs_at_death, label: Inner signs at death, basis: Mirage, smoke, fireflies, flame, luminous expanse reported as inner signs, confidence: high }
        - { slug: recognition_yields_liberation, label: Recognition yields liberation, basis: Recognition offers immediate liberation, confidence: high }
        - { slug: failure_to_recognize_own_nature, label: Failure to recognize own nature, basis: Most consciousnesses turn away from the unfamiliar light, confidence: high }
        - { slug: cessation_of_breath, label: Cessation of breath, basis: Direct mention of cessation of breath, confidence: high }

    - passage_slug: chonyid_deities
      section: The Chönyid Bardo — The Bardo of Reality
      summary: Consciousness encounters peaceful deities then wrathful deities — figures of overwhelming numinous quality, intense colors, brilliant lights, accompanying sounds; peaceful figures luminous and compassionate; beside each, a softer dimmer light points back toward conditioned existence; wrathful deities terrifying, dark, fanged, surrounded by flames, ornamented with skulls; figures are projections of own awakened mind; recognition is the path to liberation, flight leads to descent.
      motifs:
        - { slug: peaceful_deities, label: Peaceful deities, basis: Direct description of peaceful deities, confidence: high }
        - { slug: wrathful_deities, label: Wrathful deities, basis: Direct description of wrathful deities, confidence: high }
        - { slug: numinous_encounter, label: Numinous encounter, basis: Overwhelming numinous quality, confidence: high }
        - { slug: brilliant_light_not_painful, label: Brilliant light not painful to look at, basis: Brilliant lights accompany figures, confidence: high }
        - { slug: saturated_colors, label: Saturated colors, basis: Intense colors accompany figures, confidence: high }
        - { slug: deafening_sound, label: Deafening sound, basis: Sounds like thousand-fold thunder, confidence: high }
        - { slug: terror_of_dissolution, label: Terror of dissolution, basis: Wrathful figures evoke terror, confidence: high }
        - { slug: dimmer_light_of_conditioned_existence, label: Dimmer light of conditioned existence, basis: Softer dimmer light pulls back toward conditioned existence, confidence: high }
        - { slug: figures_as_projections_of_mind, label: Figures as projections of mind, basis: Figures recognized as projections of one's own awakened mind, confidence: high }
        - { slug: recognition_yields_liberation, label: Recognition yields liberation, basis: Recognition is path to liberation, confidence: high }
        - { slug: flight_leads_to_further_descent, label: Flight leads to further descent, basis: Fleeing the figures leads to further descent, confidence: high }

    - passage_slug: sidpa_becoming
      section: The Sidpa Bardo — The Bardo of Becoming
      summary: Consciousness has subtle body capable of moving instantly to any place thought of, can pass through walls, except future womb; karmic results visited as visions of judgment, weighed deeds, persecutors, pursuers; cannot be heard by living relatives, food cannot be eaten; perceives realms of possible rebirth as scenes of attraction or repulsion; pulled into womb by karmic affinity, ends with conception.
      motifs:
        - { slug: subtle_body, label: Subtle body, basis: Subtle body capable of instant movement, confidence: high }
        - { slug: passing_through_solid_objects, label: Passing through solid objects, basis: Can pass through walls and mountains, confidence: high }
        - { slug: karmic_judgment_visions, label: Karmic judgment visions, basis: Visions of judgment and weighed deeds, confidence: high }
        - { slug: persecutors_or_pursuers, label: Persecutors or pursuers, basis: Persecutors and pursuers in visions, confidence: high }
        - { slug: buffeted_by_winds, label: Buffeted by winds, basis: Direct description of being buffeted by winds, confidence: high }
        - { slug: illusory_shelter, label: Illusory shelter, basis: Sought shelters are illusory, confidence: medium }
        - { slug: cannot_be_heard_by_living, label: Cannot be heard by the living, basis: Living relatives cannot hear the consciousness, confidence: high }
        - { slug: food_cannot_be_eaten, label: Food cannot be eaten, basis: Food cannot be eaten, confidence: medium }
        - { slug: visions_of_realms_of_rebirth, label: Visions of realms of rebirth, basis: Realms of rebirth perceived as scenes, confidence: high }
        - { slug: drawn_by_karmic_affinity, label: Drawn by karmic affinity, basis: Pulled toward scene matching habits of mind, confidence: high }
        - { slug: entry_into_womb, label: Entry into womb, basis: Pulled into the womb at conception, confidence: high }
        - { slug: forgetting_at_rebirth, label: Forgetting at rebirth, basis: No recollection of bardo unless prepared, confidence: medium }

