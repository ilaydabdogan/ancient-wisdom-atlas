---
# Experiential corpus extraction manifest.
#
# This file is the source of truth for the manual motif extraction performed on
# the 12 experiential corpus texts. It is paired with
# scripts/build_experiential_extraction_records.rb, which expands each passage
# entry into a canonical YAML extraction record under
# extractions/generated/experiential-batch/<text_slug>/.
#
# The manifest is authored manually, by reading each source text and identifying
# the recurring experiential phenomena. Slugified motif IDs are deliberately
# experiential — they are not drawn from the ancient text taxonomy. The mapping
# from these raw motifs into experiential families happens in step 4 (separate
# experiential taxonomy file).
#
# Schema (per text):
#   text_id, source_path, tradition, sub_corpus, author_attribution, passages: [...]
# Schema (per passage):
#   passage_slug   — stable slug, used in record_id and as passage anchor
#   section        — exact ## heading from the source text, used for evidence lookup
#   summary        — short abstract of the passage (used for canonical_text.summary)
#   motifs:
#     - slug       — slugified experiential motif id (lowercase, underscores)
#       label      — human-readable label
#       basis      — short reason for the motif assignment
#       confidence — high | medium | low
#       cautions   — optional, scope/ambiguity notes

generated_by: manual_extraction_2026_05_01
extraction_method: human_reading
notes: |-
  No API model was used. Extraction reflects direct reading of each text by the
  Claude session that produced it on 2026-05-01. Every motif is grounded in the
  passage it is assigned to; evidence quotes are pulled programmatically from
  the source text by the build script.

texts:

# ============================================================================
# NDE — Near-Death Experience
# ============================================================================

- text_id: nde.moody_phenomenology.life_after_life_1975
  source_path: texts/experiential/nde/moody-phenomenology.md
  tradition: nde
  sub_corpus: nde
  author_attribution: Raymond A. Moody Jr.
  passages:

    - passage_slug: ineffability
      section: Ineffability
      summary: The experience is described as fundamentally beyond ordinary language; experiencers report that words are structurally inadequate to convey what was perceived.
      motifs:
        - { slug: ineffability, label: Ineffability, basis: Direct claim that the experience cannot be expressed in words, confidence: high }
        - { slug: inadequacy_of_ordinary_language, label: Inadequacy of ordinary language, basis: Language is described as structurally unfit to the experience, confidence: high }
        - { slug: more_real_than_ordinary_reality, label: More real than ordinary reality, basis: Experience is felt as more real, not less, than waking reality, confidence: medium }

    - passage_slug: hearing_news_of_death
      section: Hearing the News of Death
      summary: The experiencer hears themselves pronounced dead while seemingly unconscious, often with detached interest rather than alarm.
      motifs:
        - { slug: hearing_pronouncement_of_death, label: Hearing pronouncement of death, basis: Hearing oneself declared dead is reported as an opening element, confidence: high }
        - { slug: detached_observation_of_dying_body, label: Detached observation of the dying body, basis: Reports describe surprise and detached interest rather than fear, confidence: high }
        - { slug: nonphysical_hearing, label: Nonphysical hearing, basis: Hearing is described as immediate apprehension rather than sensory hearing, confidence: medium }

    - passage_slug: peace_and_quiet
      section: Feelings of Peace and Quiet
      summary: An extraordinary peace replaces the dying body's pain and struggle.
      motifs:
        - { slug: profound_peace, label: Profound peace, basis: Peace is described as deeper than any in ordinary life, confidence: high }
        - { slug: cessation_of_pain, label: Cessation of pain, basis: Pain is reported as immediately gone, confidence: high }
        - { slug: cessation_of_anxiety, label: Cessation of anxiety, basis: All carried anxieties are reported to drop away, confidence: high }

    - passage_slug: threshold_noise
      section: The Noise
      summary: An unusual sound — buzzing, ringing, roaring, or sublime music — accompanies the transition out of the body.
      motifs:
        - { slug: threshold_sound, label: Threshold sound, basis: Sound marks the transition out of ordinary embodiment, confidence: high }
        - { slug: buzzing_or_ringing, label: Buzzing or ringing, basis: Sounds are variously buzzing, ringing, whirring, or roaring, confidence: high }
        - { slug: celestial_music, label: Celestial music, basis: For some, the sound is bells, choirs, or unearthly harmony, confidence: medium }

    - passage_slug: dark_tunnel
      section: The Dark Tunnel
      summary: Movement through a dark enclosed space with light visible at the far end; the motion is rapid, smooth, and felt as drawing forward.
      motifs:
        - { slug: dark_tunnel, label: Dark tunnel, basis: Direct description of moving through tunnel, valley, void, or corridor, confidence: high }
        - { slug: rapid_smooth_transit, label: Rapid smooth transit, basis: Motion is described as rapid, smooth, and irresistible, confidence: high }
        - { slug: light_at_end_of_tunnel, label: Light at end of tunnel, basis: Light is usually visible at the far end of the dark space, confidence: high }
        - { slug: enclosing_darkness_not_threatening, label: Enclosing darkness not threatening, basis: Darkness is felt as enclosing rather than threatening, confidence: medium }

    - passage_slug: out_of_body
      section: Out of the Body
      summary: The experiencer perceives themselves apart from the physical body, often watching it from above with panoramic clarity.
      motifs:
        - { slug: out_of_body_experience, label: Out-of-body experience, basis: Experiencer is apart from body and sees it from outside, confidence: high }
        - { slug: viewing_body_from_above, label: Viewing the body from above, basis: Common vantage point is above the bed, confidence: high }
        - { slug: panoramic_clear_vision, label: Panoramic clear vision, basis: Vision in the OBE is described as sharp and panoramic, confidence: high }
        - { slug: subtle_body, label: Subtle body, basis: A weightless nonphysical body is perceived, confidence: high }
        - { slug: unable_to_be_heard_by_living, label: Unable to be heard by the living, basis: Attempts to speak to those present fail, confidence: medium }

    - passage_slug: meeting_others
      section: Meeting Others
      summary: Encounter with deceased relatives or spiritual beings who appear as guides or greeters; communication is direct and mind-to-mind.
      motifs:
        - { slug: meeting_deceased_relatives, label: Meeting deceased relatives, basis: Loved ones who have died appear and are recognized, confidence: high }
        - { slug: spiritual_guides, label: Spiritual guides, basis: Spiritual beings appear to help with the transition, confidence: high }
        - { slug: deceased_appear_radiant_or_younger, label: Deceased appear radiant or younger, basis: Recognized loved ones appear in luminous or restored form, confidence: medium }
        - { slug: direct_mind_to_mind_communication, label: Direct mind-to-mind communication, basis: Communication is described as direct, without speech, confidence: high }

    - passage_slug: being_of_light
      section: The Being of Light
      summary: Encounter with a luminous personal presence felt as overwhelmingly loving, knowing, and accepting; identified through the experiencer's religious frame but with consistent core features.
      motifs:
        - { slug: being_of_light, label: Being of light, basis: A luminous presence is perceived as personal and conscious, confidence: high }
        - { slug: brilliant_light_not_painful, label: Brilliant light not painful to look at, basis: Light is more intense than earthly light yet not blinding, confidence: high }
        - { slug: overwhelming_love, label: Overwhelming love, basis: Encounter is suffused with unconditional love, confidence: high }
        - { slug: complete_acceptance, label: Complete acceptance, basis: The being's stance is total acceptance, confidence: high }
        - { slug: being_knows_experiencer_completely, label: Being knows experiencer completely, basis: The being is felt to know the person fully, confidence: high }

    - passage_slug: panoramic_life_review
      section: The Review
      summary: A comprehensive review of the person's life unfolds in the presence of the being of light, often from the perspective of those affected by the experiencer's actions; understanding rather than judgment.
      motifs:
        - { slug: panoramic_life_review, label: Panoramic life review, basis: The whole life is seen at once or in vivid sequence, confidence: high }
        - { slug: multiple_perspectives_in_review, label: Multiple perspectives in review, basis: Events seen from the perspective of others affected, confidence: high }
        - { slug: understanding_without_judgment, label: Understanding without judgment, basis: Review is held in compassion, not condemnation, confidence: high }
        - { slug: significant_moments_stand_out, label: Significant moments stand out, basis: Some events are more vivid than others in the review, confidence: medium }

    - passage_slug: border_or_limit
      section: The Border or Limit
      summary: A boundary appears beyond which return would not be possible; the experiencer often desires to cross but is turned back.
      motifs:
        - { slug: border_or_limit, label: Border or limit, basis: A fence, water, gate, line, or horizon is perceived, confidence: high }
        - { slug: point_of_no_return, label: Point of no return, basis: Crossing is recognized as irrevocable, confidence: high }
        - { slug: desire_to_cross_threshold, label: Desire to cross the threshold, basis: Experiencer often wishes to cross, confidence: medium }

    - passage_slug: coming_back
      section: Coming Back
      summary: Return to the body is sudden; some choose to return for unfinished tasks, others are sent back; ordinary life feels heavy by comparison.
      motifs:
        - { slug: forced_or_chosen_return, label: Forced or chosen return, basis: Some return is decided, some imposed, confidence: high }
        - { slug: reluctance_to_return_to_body, label: Reluctance to return to the body, basis: Body and ordinary life feel heavy and constraining, confidence: high }
        - { slug: return_to_complete_unfinished_task, label: Return to complete an unfinished task, basis: Care for children or unfinished work cited as reason, confidence: medium }

    - passage_slug: telling_others
      section: Telling Others
      summary: Attempts to describe the experience to others meet disbelief or polite incomprehension; experiencers often hold it in silence for years.
      motifs:
        - { slug: difficulty_describing_to_others, label: Difficulty describing to others, basis: Attempts to convey are met with disbelief or dismissal, confidence: high }
        - { slug: isolation_after_experience, label: Isolation after the experience, basis: Cultural absence of frameworks leaves experiencer isolated, confidence: medium }

    - passage_slug: effects_on_lives
      section: Effects on Lives
      summary: The experience produces lasting reorganization of values; status and possessions recede, relationships and acts of care become central.
      motifs:
        - { slug: lasting_value_transformation, label: Lasting value transformation, basis: Values shift; reorganization persists over time, confidence: high }
        - { slug: deprioritization_of_materialism, label: Deprioritization of materialism, basis: Concerns about possessions and status recede, confidence: high }
        - { slug: recentered_on_relationships_and_care, label: Recentered on relationships and care, basis: Relationships and learning become central, confidence: high }

    - passage_slug: new_views_of_death
      section: New Views of Death
      summary: Fear of death is gone or sharply reduced; death is felt as a transition rather than an ending, held as direct knowledge rather than belief.
      motifs:
        - { slug: loss_of_fear_of_death, label: Loss of fear of death, basis: Direct claim that fear is gone or reduced, confidence: high }
        - { slug: death_as_transition_not_ending, label: Death as transition not ending, basis: Death reframed as passage rather than terminus, confidence: high }
        - { slug: certainty_grounded_in_direct_experience, label: Certainty grounded in direct experience, basis: New view held as felt knowing, not doctrine, confidence: medium }

    - passage_slug: corroboration
      section: Corroboration
      summary: Some experiencers report perceiving details inaccessible to the dying body that are later confirmed; treated as evidence the experience was not generated by the brain alone.
      motifs:
        - { slug: corroboration_of_perceived_details, label: Corroboration of perceived details, basis: Distant or hidden details perceived during clinical death are later verified, confidence: medium, cautions: "Reported in some cases; not all NDEs include verifiable elements." }
        - { slug: knowledge_at_a_distance, label: Knowledge at a distance, basis: Conversations or events outside the body's range are perceived, confidence: medium }

