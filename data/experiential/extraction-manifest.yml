- text_id: contemplative.interior_castle.teresa_avila
  source_path: texts/experiential/contemplative/interior-castle.md
  tradition: contemplative
  sub_corpus: contemplative
  author_attribution: Teresa of Ávila
  passages:

    - passage_slug: first_mansion
      section: The First Mansion — Self-Knowledge and Beginning
      summary: Soul enters castle through prayer; first territory is self-knowledge; light from inner mansions reaches dimly; phenomenology is beginnings, distractions constant, world's noise reaches in.
      motifs:
