        - { slug: subtle_complacency, label: Subtle complacency, basis: Conviction that one has arrived, confidence: medium }

    - passage_slug: fourth_mansion
      section: The Fourth Mansion — The Prayer of Quiet and Supernatural Beginnings
      summary: New quality enters prayer — not produced by effort but received; prayer of quiet, will rests in God; inflowing peace, sweetness around heart; spiritual consolations begin.
      motifs:
        - { slug: prayer_of_quiet, label: Prayer of quiet, basis: Direct mention of prayer of quiet, confidence: high }
        - { slug: passive_reception, label: Passive reception, basis: State not produced by practitioner's effort but received, confidence: high }
        - { slug: inflowing_peace, label: Inflowing peace, basis: Inflowing peace described, confidence: high }
