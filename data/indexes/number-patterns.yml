cross_world_verdict: 'NEGATIVE on the Pauli question, with structure. Isolated and connected piles both
  show high absolute agreement (rho=0.845) -- but so does ANY random split of traditions (null mean 0.885):
  the agreement is carried by the shared decay of number use in language, not by shared sacredness. On
  the stricter roundness-matched metric the real iso/con split agrees SIGNIFICANTLY LESS than random splits
  (rho=0.616 vs null 0.736+/-0.048, p_deficit=0.016; strict crown split p_deficit=0.031): the isolated
  world and the connected world favor DIFFERENT numbers. Connected Old World elevates 3 (1.36), 7 (2.13),
  9 (1.43); the isolated Americas/Australia/Arctic pile elevates 4 (2.20 vs con 0.88) and mildly 40 (1.64).
  Robustness: 4>3 in 9/26 isolated vs 5/70 connected traditions (Navajo 326:88, Hopi 245:97, Zuni 77:20);
  7 elevated above mean(6,8) in 49/70 connected vs 9/26 isolated. The one number both worlds elevate is
  12 (iso 2.96, con 3.44), consistent with independent astronomy (12ish lunations per solar year) rather
  than contact.'
