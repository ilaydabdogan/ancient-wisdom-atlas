# Sacred-number patterns across 338 canonical texts (the Pauli question)
# Generated deterministically; see method block. DO NOT hand-edit counts.
generated: '2026-07-19'
question: Do the world's mythologies favor the same numbers beyond what language and chance produce (the
  Pauli/137 question), and do isolated traditions favor the same numbers as the connected Old World?
method:
  extraction: 'Deterministic scan of all 338 canonical texts in texts/public-domain/ (39.4M words, 106
    tradition dirs). Numerals plus spelled-out English forms (cardinals, compounds, threescore/fourscore/dozen,
    twice/thrice/N-fold multiplicatives, ordinals gated on a mythic-noun whitelist). Scripts: scratchpad
    extract_numbers.py, analyze_numbers.py, supplement.py, build_yml.py (session d42cd906; to be reviewed
    into scripts/).'
  filters:
  - frontmatter, headings, all-caps lines, TOC dot-leader lines
  - chapter/verse/page/figure/section reference contexts (5-token lookback)
  - comma-chain propagation of reference drops (sect. 5, 6, 7)
  - bracketed footnote refs, d:d verse refs, d-d ranges
  - line-initial numerals (verse numbering), number-only lines
  - trailing page-number runs (back-of-book index entries)
  - standalone 4-digit 1000-2099 numerals (years)
  - Gutenberg/copyright/URL editorial lines
  - high symbol-density lines (OCR noise)
  - enumeration lines with 3+ 'N.' markers
  - '''one'' preceded by no/any/some/every/each/which/such or followed by ''another'''
  channels:
    primary_spelled: cardinal + multiplicative + ordinal (translator prose; near-zero apparatus contamination)
    sensitivity_all: spelled + numerals (numerals retain residual citation noise)
  prominence_local: observed count / count predicted at n by OLS power-law fit over nearest nonzero neighbors
    (<=4/side, within factor 2.5). Asks 'is 7 special vs 6 and 8', not 'is 7 common'.
  prominence_roundness_matched: same fit but peers share n's count of trailing zeros (40 judged against
    20,30,50..., not 39 and 41), removing the round-number preference of language itself. This is the
    stricter metric.
  iso_con_split: 'crown list (scripts/crown_prep_records.rb ISOLATED) plus post-crown directory variants
    and same-doctrine additions: aboriginal-australian, arctic-inuit, native-american-california, native-american-plateau,
    chaco-amerindian, inca, khoekhoe. Strict crown-only split reported as sensitivity. comparative/ excluded.'
