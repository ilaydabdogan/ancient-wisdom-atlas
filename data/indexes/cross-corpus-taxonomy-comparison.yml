# ----------------------------------------------------------------------------
# Structural observation
# ----------------------------------------------------------------------------

structural_observation: |-
  The two corpora converge most strongly where ancient narrative is itself
  describing a phenomenological state — theophany, otherworld, descent,
  divine judgment, sacred time, mystical union, hero's journey. They diverge
  most clearly along the seam between narrative and phenomenology. The
  ancient corpus surfaces character archetypes, social and cosmological
  structures, and ritual sequences as families because that is what the
  ancient texts emphasize. The experiential corpus surfaces process
  descriptions, inner qualia, and the structure of altered states because
  that is what the experiential texts emphasize. Where both corpora take up
  the same territory — the encounter with light, the meeting of the dead,
  the dissolution of self into something larger, the return transformed —
  the language and structure converge to a degree that becomes harder to
  attribute to common cultural inheritance the more independent the
  derivation has been.

  The strongest convergences cluster around six themes: encounter with
  luminous presence; meeting the deceased; the panoramic review of life;
  death and rebirth; the threshold of return; and the lasting transformation
  of values. These are the points at which the consciousness-bridge layer
  begins to do its work — making visible the structural overlap between
  what humans across thousands of years have said about death and what
  modern survivors of cardiac arrest, deep meditation, and psychedelic
  research describe.
