name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ruby-checks:
    name: Ruby checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Ruby version
        run: ruby --version

      - name: Run quality suite
        run: ruby scripts/check_all.rb
