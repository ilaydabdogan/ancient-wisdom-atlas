  - id: mystical_union_and_unitive_life
    label: Mystical Union and the Unitive Life
    description: |-
      The settled, continuous union with the divine that follows the dark
      night — spiritual marriage, the steady ground in which ordinary life
      becomes the medium of union, action holds rather than disrupts the
      state, the alternation between presence and absence ends. The unitive
      life is described as quiet rather than ecstatic and as productive in
      the world rather than withdrawn from it. Includes the encounter with
      the divine still as Other (illumination) before that encounter is
      replaced by settled presence.
    sub_corpora: [contemplative]
    related: [contemplative_absorption_states, transformation_of_values, overwhelming_love]
    children:
