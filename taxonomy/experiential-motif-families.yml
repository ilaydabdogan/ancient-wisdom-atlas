  - id: transcendence_of_time_and_space
    label: Transcendence of Time and Space
    description: |-
      Suspension or distortion of ordinary time and space. Time may stop,
      expand into eternity, compress, or contain all of itself at once. Space
      may become unbounded, vast without location, everywhere and nowhere,
      or held to its own internal rules different from waking space.
    sub_corpora: [nde, psychedelic, contemplative]
