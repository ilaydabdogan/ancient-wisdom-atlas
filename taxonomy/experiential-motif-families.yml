  - id: noetic_certainty
    label: Noetic Certainty and Direct Knowing
    description: |-
      Knowledge that does not depend on inference: direct apprehension of how
      things really are, sudden grasp of fundamental matters, comprehension
      larger than any single insight. Felt as more real than ordinary
      perception, naked rather than mediated by concepts, and as certainty
      grounded in direct experience rather than belief.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [life_review_and_perspective_taking, sacredness_and_awe, transformation_of_values]
