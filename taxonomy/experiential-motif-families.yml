  - id: transformation_of_values
    label: Lasting Transformation of Values and Orientation
    description: |-
      The lasting reorganization of life that follows the experience: loss
      of fear of death, death reframed as transition, materialism and status
      concerns recede, relationships and contemplation take center, the
      experiencer becomes a comforter of the dying and grieving. Includes the
      sudden conversion of the awakening of self, the irreversible
      orientation to God, the felt vocation, and the productive vocational
      activity of the unitive life.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [noetic_certainty, mystical_union_and_unitive_life, ineffability]
    children:
