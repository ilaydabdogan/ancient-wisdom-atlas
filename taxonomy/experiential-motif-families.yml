  - id: otherworldly_environment
    label: Otherworldly Environment
    description: |-
      Environments unlike any earthly place — celestial landscapes, gardens,
      meadows, paradisical settings, the cosmic egg or starry cosmos, the
      autonomous alternate reality reported in psychedelic experiences (place
      already there, returnable, with its own consistency and inhabitants),
      the visions of realms of rebirth in the bardo, and the architectures of
      light and sacred buildings encountered in deep states.
    sub_corpora: [nde, psychedelic, contemplative]
