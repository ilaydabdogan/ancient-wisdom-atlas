  - id: ego_death_rebirth_struggle
    label: Ego Death, Struggle, and Rebirth
    description: |-
      The violent transition out of conditioned self into liberation —
      titanic struggle, sexual ecstasy and violence combined, sadomasochistic,
      scatological, and demonic imagery, ritual sacrifice and combat — and
      the emergence into rebirth: world reconstituted as new, resurrection
      imagery, opening flowers, divine couple reunion, sacred marriage, the
      silkworm-butterfly transformation. Liberation as the crossing-out of a
      structure of suffering that had been mistaken for life.
    sub_corpora: [psychedelic, contemplative]
    related: [dread_and_engulfment, dissolution_of_self, mystical_union_and_unitive_life]
    children:
