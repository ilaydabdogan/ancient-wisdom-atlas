---
# Experiential corpus taxonomy.
#
# This file is the canonical taxonomy for the experiential layer of the Atlas
# (NDE / psychedelic / contemplative). It is INDEPENDENT of the ancient corpus
# taxonomy at taxonomy/motif-normalization.yml — the families below were
# discovered by reading the 12 experiential source texts and grouping the 321
# raw motif slugs that emerged from extraction. Family names were chosen from
# the experiential vocabulary itself, deliberately not borrowed from the
# ancient text family names.
#
# This separation is methodologically central. The comparison between the two
# taxonomies (step 5) is meaningful only because neither was designed to match
# the other. Mapping motifs from one corpus to the other family list before
# the comparison would destroy the finding before it could be observed.
#
# Each family declares:
#   id           — slugified family id
#   label        — human-readable label
#   description  — phenomenological characterization grounded in the corpus
#   sub_corpora  — which sub-corpora (nde / psychedelic / contemplative) the
#                  family appears in
#   children     — primary raw motif slugs assigned to this family
#   related      — sibling families with phenomenological overlap

generated_on: '2026-05-01'
authored_by: human_reading
source_index: data/indexes/experiential-motif-occurrences.yml
isolation_note: |-
  This taxonomy is for experiential motifs only. It must NOT be merged with or
  mapped onto taxonomy/motif-normalization.yml (the ancient corpus taxonomy).
  The independent comparison is performed in
  data/indexes/cross-corpus-taxonomy-comparison.yml.

experiential_motif_families:

  - id: luminous_presence
    label: Luminous Presence
    description: |-
      Light experienced as conscious, personal, and knowing rather than as an
      impersonal phenomenon. Includes the central being-of-light reported in
      NDEs, the clear light of awareness in the bardo tradition, and the
      luminous companions and surrounding light reported across NDE and
      contemplative frameworks. The light is consistently described as
      brilliant but not painful to look at, and as bearing love or recognition
      directly to the experiencer.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [profound_peace_and_bliss, overwhelming_love, dissolution_of_self]
    children:
      - being_of_light
      - brilliant_light_not_painful
      - clear_light_of_awareness
      - dim_inner_light_at_threshold
      - dimmer_light_of_conditioned_existence
      - golden_or_white_light
      - ground_of_awareness
      - light_at_end_of_tunnel
      - luminous_companions
      - luminous_quiet_state
      - peacock_iridescence
      - saturated_colors
      - vast_unobstructed_openness

  - id: dark_passage_threshold
    label: Dark Passage and Threshold
    description: |-
      The experienced transition through a dark enclosed space — tunnel,
      corridor, valley — toward light or toward another state. Frequently
      accompanied by an unusual sound (buzzing, ringing, music) and by a
      somatic rush. The motion is described as drawing or being-pulled rather
      than self-propelled, and the darkness is felt as enclosing rather than
      threatening.
    sub_corpora: [nde, psychedelic]
    related: [luminous_presence, separation_from_body, threshold_and_return]
    children:
      - dark_tunnel
      - rapid_smooth_transit
      - threshold_sound
      - buzzing_or_ringing
      - celestial_music
      - enclosing_darkness_not_threatening
      - somatic_rush

  - id: separation_from_body
    label: Separation from the Body
    description: |-
      The experiencer perceives themselves as distinct from the physical body
      and often watches the body from outside — typically from above. Includes
      a felt subtle body, panoramic clear vision unconfined by walls, the
      ability to pass through solid objects, and the cessation or
      reorganization of ordinary somatic boundaries (cessation of breath,
      dissolution of elements, inability to be heard by the living, food
      cannot be eaten).
    sub_corpora: [nde, contemplative]
    related: [dark_passage_threshold, dissolution_of_self, threshold_and_return]
    children:
      - awareness_of_being_dead
      - cannot_be_heard_by_living
      - cessation_of_breath
      - detached_observation_of_dying_body
      - dissolution_of_elements
