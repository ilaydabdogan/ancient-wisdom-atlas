  - id: dread_and_engulfment
    label: Dread, Engulfment, and Hellish Content
    description: |-
      The negative ground tone — claustrophobic engulfment, no-exit
      hopelessness, existential despair, absolute meaninglessness, and
      hellish imagery: being swallowed by a monster, sealed in a tomb,
      trapped in hell, suspended in a frozen wasteland. Time may feel like
      eternal suffering. Includes paranoia, the perception of malevolent
      environment, and the persecutory pursuers of the bardo.
    sub_corpora: [psychedelic, contemplative, nde]
    related: [transcendence_of_time_and_space, dissolution_of_self, ego_death_rebirth_struggle]
