  - id: visionary_imagery
    label: Visionary Imagery
    description: |-
      Visual content ranging from elementary geometry (lattices, gratings,
      spirals, kaleidoscopic patterns, cobwebs) through complex three-
      dimensional figurative scenes, mandala-like forms, fractal
      architecture, and the perception of geometry as alive and conscious.
      Includes synesthesia, sound visualized as color, and the changed
      meaning of percepts where ordinary objects appear charged with
      significance.
    sub_corpora: [psychedelic, contemplative, nde]
    related: [otherworldly_environment, sacredness_and_awe, visions_locutions_raptures]
