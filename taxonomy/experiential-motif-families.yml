  - id: profound_peace_and_bliss
    label: Profound Peace and Bliss
    description: |-
      The pervasive emotional ground of the experience: profound peace beyond
      any in ordinary life, with cessation of pain and anxiety, and with bliss
      or joy that does not depend on circumstance. Distinct from awe,
      sacredness, or love (which have their own families) — this is the
      affective tone itself. Often felt as the medium of the entire state.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [overwhelming_love, sacredness_and_awe, contemplative_absorption_states]
    children:
      - bliss_or_joy
