  - id: contemplative_absorption_states
    label: Contemplative Absorption States
    description: |-
      The progressive states of meditative absorption — concentration with
      and without conceptual reasoning, subtle absorption, absorption with
      bliss, absorption resting on the bare sense of "I am", and the
      seedless samadhi where all content falls away and unconditioned
      awareness stands alone. Also includes the Christian-mystical analogues:
      prayer of quiet, prayer of union, and the felt passive reception of
      states that are not produced by the practitioner's effort. The deeper
      end of this family touches dissolution-of-self.
    sub_corpora: [contemplative]
    related: [dissolution_of_self, mystical_union_and_unitive_life, contemplative_practice_stages]
    children:
