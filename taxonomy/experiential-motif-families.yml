  - id: encounter_with_deceased
    label: Encounter with the Deceased
    description: |-
      Recognition of and meeting with deceased persons — typically relatives
      or close friends, occasionally a person whose death the experiencer did
      not yet know about. The deceased are described as recognizable but
      sometimes radiant, younger, or restored, and they appear in roles of
      greeter, guide, or companion. Recognition is direct and immediate.
    sub_corpora: [nde]
    related: [encounter_with_other_beings, threshold_and_return, mind_to_mind_communication]
    children:
      - deceased_appear_radiant_or_younger
      - deceased_as_greeters_or_guides
