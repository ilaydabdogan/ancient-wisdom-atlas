  - id: threshold_and_return
    label: Threshold of Return
    description: |-
      The boundary or limit beyond which return would not be possible —
      perceived as a fence, water, gate, line, or horizon — and the
      experience of being turned back, told to return, or choosing return.
      Includes the reluctance to return to the body, the felt-sense that the
      experience is one's true home, the rapid return from psychedelic
      states, and the decisive crossing into the womb in the sidpa bardo.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [separation_from_body, dread_and_engulfment, transformation_of_values]
