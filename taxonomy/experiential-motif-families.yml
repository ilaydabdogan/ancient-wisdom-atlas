  - id: ineffability
    label: Ineffability and Inadequacy of Language
    description: |-
      The experience cannot be put into words. Ordinary language refers to
      ordinary categories, and what was perceived stands behind or beyond
      those categories. Includes the difficulty of describing the experience
      to others, the social isolation that follows, the public
      misunderstanding of mystics, and the difficulty of remembering the
      content of deep states once one has returned to ordinary consciousness.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [noetic_certainty, transformation_of_values]
    children:
