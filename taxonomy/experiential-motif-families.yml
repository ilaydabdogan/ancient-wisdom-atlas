  - id: visions_locutions_raptures
    label: Visions, Locutions, and Raptures
    description: |-
      The graced contents that arise during contemplative practice — visions
      (interior, imaginary, rarely corporeal), locutions (words received
      rather than spoken, marked by authority, peace, lasting effect), and
      raptures (sudden, irresistible elevations in which the body becomes
      still and the senses suspended). Includes the warning, repeatedly
      sounded across the contemplative literature, not to mistake these
      gifts for the giver.
    sub_corpora: [contemplative]
    related: [visionary_imagery, mind_to_mind_communication, mystical_union_and_unitive_life]
    children:
      - bodily_stillness_in_rapture
      - do_not_mistake_gifts_for_giver
      - raptures
      - senses_suspended
      - visions

  - id: altered_cognition_and_vigilance
    label: Altered Cognition and Vigilance
    description: |-
      Disturbed or restructured thought, attention, and wakefulness —
      thoughts looping or intruding, attention escaping voluntary control,
      mind running as a runaway machine, reduced vigilance shading into
      drowsiness or dream-fragments intruding into waking. Distinct from the
      dissolution-of-self family because here the structural integrity of
      thought-control is disrupted rather than the sense of self being
      dissolved.
    sub_corpora: [psychedelic]
    related: [dread_and_engulfment, dissolution_of_self, dark_passage_threshold]
    children:
      - blurred_sleep_wake_boundary
      - drowsiness_or_dream_intrusion
      - loss_of_attentional_control
      - reduced_efficiency_of_thought
      - reduced_wakefulness
      - runaway_machine_of_mind
      - thought_loops_or_intrusion

  - id: heightened_or_altered_perception
    label: Heightened or Altered Perception
    description: |-
      Perception that is unusually vivid, clear, or distorted — beyond the
      synesthesia and figurative imagery of visionary_imagery. Includes
      saturation of color outside the ordinary spectrum, music carrying
      meaning that ordinary listening had not heard, hallucinatory sounds
      with no external source, and the heightened auditory and visual
      perception that frequently accompanies altered states even when
      figurative content is not present.
    sub_corpora: [nde, psychedelic]
    related: [visionary_imagery, dark_passage_threshold, otherworldly_environment]
    children:
      - hallucinatory_sounds
      - heard_music_without_source
      - heightened_auditory_perception
      - heightened_perception
      - music_carrying_unfamiliar_meaning
      - perception_outside_normal_spectrum

  - id: corroborative_phenomena
    label: Corroborative and Distance-Knowledge Phenomena
    description: |-
      Reports of access to information not available to the dying or
      meditating body — knowledge of conversations or events at a distance,
      verifiable details perceived during clinical death and later confirmed,
      precognitive visions of future events, and apparent extrasensory
      perception. Treated by experiencers as evidence that the experience
      was not generated by the body alone; included here as a recurring
      feature of the corpus, not as a metaphysical claim.
    sub_corpora: [nde]
    related: [separation_from_body, noetic_certainty, life_review_and_perspective_taking]
    children:
      - corroboration_of_perceived_details
      - direct_knowing_of_future
      - extrasensory_perception
      - knowledge_at_a_distance
      - precognition

# ----------------------------------------------------------------------------
# Notes
# ----------------------------------------------------------------------------
# A handful of motif slugs intentionally cross multiple families
# phenomenologically. In this file each motif is assigned to a SINGLE PRIMARY
# family — the one that best characterizes its core. The `related` field on
# each family captures the strongest phenomenological neighbours so the
# multi-family overlap is preserved without breaking the strict 1-to-1 mapping
# required for the comparison step.
