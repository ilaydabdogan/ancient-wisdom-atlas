  - id: dark_night_and_purification
    label: Dark Night and Purification
    description: |-
      The withdrawal of consolation from the contemplative life — the
      apparent absence of God or the divine, prayer dry, despair and doubt,
      the sense of being lost — and the long work of purification through
      ascetic practice, detachment, and continuing practice without reward.
      Includes the early-stage difficulties (distraction in early practice,
      stubborn return, many turn back) as well as the more developed dark
      night that follows illumination. The deepening through loss is the
      structural function of this stage.
    sub_corpora: [contemplative]
    related: [dread_and_engulfment, contemplative_practice_stages, transformation_of_values]
    children:
