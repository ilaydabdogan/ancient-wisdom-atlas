      - terror_of_dissolution
      - transcendence_of_personal_self
      - union_with_greater_than_self

  - id: encounter_with_other_beings
    label: Encounter with Other Beings
    description: |-
      Encounter with conscious, present, other entities — distinct from
      deceased relatives. Includes peaceful and wrathful deities (bardo),
      religious figures and mystical presences (NDE / contemplative), and the
      diverse entity types reported in psychedelic experiences (humanoid,
      mechanical, insectoid, geometric, plant-like). Beings are often felt as
      already in progress when the experiencer arrives, more advanced or
      knowing, and recognizing the experiencer.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [encounter_with_deceased, mind_to_mind_communication, otherworldly_environment]
    children:
      - entity_encounter
      - entities_expecting_visitor
