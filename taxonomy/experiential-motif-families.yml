  - id: overwhelming_love
    label: Overwhelming Love
    description: |-
      Unconditional love directed toward all beings, the world, and being
      itself — distinct from peace or bliss. Includes the felt being-known of
      the encounter with the being of light, the wound of love at the threshold
      of mystical union, and the tears of recognition or gratitude that often
      accompany the state. Love is uniformly distributed and not contingent on
      the qualities of its objects.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [profound_peace_and_bliss, luminous_presence, mystical_union_and_unitive_life]
    children:
