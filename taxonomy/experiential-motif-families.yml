  - id: life_review_and_perspective_taking
    label: Life Review and Perspective-Taking
    description: |-
      A panoramic re-experiencing of one's life — events seen at once or in
      vivid sequence, sometimes from the perspectives of others affected by
      one's actions. The review is comprehensive and held in compassion
      rather than condemnation. Includes the karmic-judgment visions of the
      sidpa bardo, where the consciousness encounters the results of its
      acts as scenes.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [noetic_certainty, transformation_of_values, encounter_with_other_beings]
