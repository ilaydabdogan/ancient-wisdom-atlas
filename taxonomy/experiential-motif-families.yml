  - id: sacredness_and_awe
    label: Sacredness and Awe
    description: |-
      The state and what is encountered are felt as sacred. Reverence, awe,
      and a felt smallness before vastness mark the experience. The world
      appears charged with significance, and ordinary things become eloquent
      with meaning that ordinary perception had been filtering out.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [profound_peace_and_bliss, noetic_certainty, transformation_of_values]
