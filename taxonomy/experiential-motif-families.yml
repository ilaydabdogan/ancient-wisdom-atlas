  - id: contemplative_practice_stages
    label: Contemplative Practice — Preparatory and Structural Stages
    description: |-
      The structural and ethical conditions of practice as enumerated across
      the contemplative texts: ethical restraint and observance (yamas,
      niyamas), bodily preparation (asana, breath regulation, sense
      withdrawal), the early stages of inner attention (turning attention
      inward, self-knowledge, established practice, continuous recollection
      of God), and the danger of subtle complacency at intermediate stages.
      The family captures the disciplines that stabilize the ground for the
      deeper absorption states.
    sub_corpora: [contemplative]
    related: [contemplative_absorption_states, dark_night_and_purification, transformation_of_values]
