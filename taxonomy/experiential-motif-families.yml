      - subtle_body
      - unable_to_be_heard_by_living
      - viewing_body_from_above

  - id: dissolution_of_self
    label: Dissolution of Self and Boundaries
    description: |-
      Dissolution of the boundary between self and what is observed, between
      self and the world, or between self and what is greater than self. Can
      take a positive form (oceanic unity, cosmic continuity) or a frightening
      form (terror of dissolution, ego obliteration). Includes the inward
      collapse of the inner observer (no separate witness to mental contents)
      and the dissolution of the subject-object distinction in deep
      absorption.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [luminous_presence, contemplative_absorption_states, dread_and_engulfment]
    children:
      - continuity_with_world
      - cosmic_unity
