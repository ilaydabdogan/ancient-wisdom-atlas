  - id: mind_to_mind_communication
    label: Mind-to-Mind Communication and Transmission
    description: |-
      Communication described as direct rather than spoken — felt as the
      transmission of meaning from being to being without language, sometimes
      compressed or larger than the experiencer can hold. Includes locutions
      heard as inner words (Christian mystical), the deafening sound of the
      bardo deities, and the bodies of information transmitted in psychedelic
      and contemplative encounters.
    sub_corpora: [nde, psychedelic, contemplative]
    related: [encounter_with_other_beings, encounter_with_deceased, noetic_certainty]
    children:
