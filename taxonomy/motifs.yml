motif_families:
  divine_parent_child:
    label: Divine Parent And Holy Child
    description: A sacred, royal, or supernatural parent protects, nurses, presents, hides, or legitimizes a child with divine destiny.
    related:
      - sacred_birth
      - miraculous_child
      - mother_goddess
      - royal_legitimacy

  hero_descent:
    label: Descent Into The Underworld
    description: A figure enters the realm of death, darkness, dream, cave, sea, or hidden knowledge and returns transformed or fails to return.
    related:
      - death_rebirth
      - initiation
      - stolen_beloved

  dying_and_returning:
    label: Death And Return
    description: A god, hero, vegetation figure, or soul dies, disappears, descends, sleeps, or is dismembered before restoration or renewal.
    related:
      - seasonal_cycle
      - sacrifice
      - resurrection

  flood_and_renewal:
    label: Flood And Renewal
    description: A cosmic or regional flood destroys an old world and creates conditions for a new human order.
    related:
      - divine_judgment
      - ark_vessel
      - survivor_pair

  sacred_tree_axis:
    label: Sacred Tree Or Axis Mundi
    description: A tree, mountain, pillar, ladder, or pole connects underworld, earth, and heaven.
    related:
      - cosmic_mountain
      - world_center
      - ascent

  trickster_boundary:
    label: Trickster At The Boundary
    description: A liminal figure breaks rules, crosses thresholds, steals, jokes, transforms, or reveals hidden order through disorder.
    related:
      - culture_hero
      - sacred_theft
      - shapeshifter

