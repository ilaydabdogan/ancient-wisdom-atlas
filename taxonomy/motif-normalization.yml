---
normalization_version: '1'
updated_on: '2026-04-29'
status: draft
canonical_taxonomy_path: taxonomy/motifs.yml
purpose: 'Review-time normalization guidance for mapping candidate motif labels to
  stable canonical motif families without flattening important conceptual distinctions.

'
review_policy:
  default_action: needs_human_review
  prefer_existing_taxonomy_refs: true
  preserve_local_meaning: true
  allow_new_taxonomy_suggestions: true
  notes:
  - Use canonical_refs for indexing and parent_refs for broader queries.
  - Do not merge related motifs when the passage evidence distinguishes them.
  - Treat over-specific labels as evidence notes unless they recur across sources.
comparison_modes:
  structural: Same arrangement, sequence, role, or narrative function.
  thematic: Same broad concern, image, value, or symbolic field.
  historical_contact: Contact, translation, trade, conquest, migration, or shared
    ritual space is supported by evidence.
  common_inheritance: Descent from an older shared cultural, linguistic, textual,
    or ritual source is plausible.
  independent_emergence: Similar form plausibly arose separately from recurring human
    situations.
  archetypal: Psychological or symbolic interpretation, not proof of origin.
hierarchies:
  death_descent_return:
    label: Death, Descent, And Return Complex
    description: 'Related but distinct patterns where a figure, soul, world, or community
      moves through death, descent, concealment, dissolution, trial, or return.

'
    parent_refs:
    - death_rebirth
    child_refs:
    - hero_descent
    - dying_and_returning
    - resurrection
    - afterlife_journey_map
    distinctions:
      hero_descent: A journey into death, darkness, cave, sea, dream, or hidden realm.
      dying_and_returning: A figure disappears, dies, sleeps, descends, or is dismembered
        and later returns.
      resurrection: A dead figure is restored, raised, vindicated, or transformed
        into a new mode of life.
      death_rebirth: Broader renewal after death, dissolution, concealment, or transformation.
      afterlife_journey_map: A mapped postmortem route through peril, judgment, instruction,
        or liberation.
  sacred_order_judgment:
    label: Sacred Order, Law, Judgment, And Repair
    parent_refs:
    - divine_judgment
    - covenant
    - sacrifice
    child_refs:
    - sacred_exchange
    - wisdom
    distinctions:
      divine_judgment: A sacred order responds to disorder through punishment, purification,
        or renewal.
      covenant: A vow, law, promise, or binding relation organizes divine-human or
        social order.
      sacrifice: A valued life, object, food, vow, or attachment is surrendered or
        set apart.
      sacred_exchange: Giving, offering, feeding, vow-making, or renunciation repairs
        relationship.
  revelation_wisdom_path:
    label: Revelation, Wisdom, And Transformation
    parent_refs:
    - wisdom
    - initiation
    child_refs:
    - mystical_quest
    - annihilation_union
    - ascent
    distinctions:
      wisdom: Sacred, forbidden, practical, prophetic, ancestral, or transformative
        knowledge.
      initiation: A threshold ordeal transforms status, knowledge, or identity.
      mystical_quest: A seeker pursues direct knowledge of sacred reality through
        discipline, guide, love, or unveiling.
      annihilation_union: Ego or separateness dissolves in a larger sacred reality.
  catastrophe_renewal:
    label: Catastrophe And World Renewal
    parent_refs:
    - divine_judgment
    - death_rebirth
    child_refs:
    - flood_and_renewal
    - world_destroying_fire
    - ark_vessel
    - survivor_pair
