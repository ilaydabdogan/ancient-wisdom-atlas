quality_flags:
  over_specific_label: Candidate motif is too bound to one passage detail to support cross-source querying.
  unsupported_taxonomy_ref: Taxonomy ref is absent from taxonomy/motifs.yml and not listed as a normalization alias.
  unsupported_comparison_claim: Comparison claim lacks direct evidence or overstates transmission.
  front_matter_or_commentary: Passage is title page, contents, footnote, editor note, or scholarly commentary rather than primary mythic/ritual text.
  missing_evidence_ref: Motif, figure, symbol, role, scene, or claim references evidence not present in the record.
  weak_locator: Locator cannot be checked against canonical Markdown line ranges.
