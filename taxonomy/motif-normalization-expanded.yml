    mother, the goddess of fertility and death, and the sacred feminine as cosmic
    principle.

'
  children: []
  aliases: []
  related:
  - miraculous_child
  - cosmic_origin
  - death_and_transformation
- id: culture_hero
  label: Culture Hero and Founder
  description: 'The figure who brings civilization, law, fire, agriculture, or sacred
