    relationship: over_specific_label
    review_action: broaden_or_remove
    notes: Preserve as evidence detail; do not promote as a canonical motif unless
      it recurs across sources.
quality_flags:
  over_specific_label: Candidate motif is too bound to one passage detail to support
    cross-source querying.
  unsupported_taxonomy_ref: Taxonomy ref is absent from taxonomy/motifs.yml and not
    listed as a normalization alias.
  unsupported_comparison_claim: Comparison claim lacks direct evidence or overstates
    transmission.
  front_matter_or_commentary: Passage is title page, contents, footnote, editor note,
    or scholarly commentary rather than primary mythic/ritual text.
  missing_evidence_ref: Motif, figure, symbol, role, scene, or claim references evidence
    not present in the record.
  weak_locator: Locator cannot be checked against canonical Markdown line ranges.
canonical_motif_group_policy:
  source: user_desktop_motif_normalization_2026-04-28
  purpose: Broader query groups for Pattern Explorer and review-time placement of
    granular generated motif labels.
  canonical_taxonomy_relationship: Groups may contain existing taxonomy/motifs.yml
    refs, review aliases, or granular generated labels; they do not automatically
    become taxonomy/motifs.yml motif_families.
  meta_group_prefix: _meta
  notes:
  - Use group ids for broad Pattern Explorer facets and parent-level review reasoning.
  - Use aliases.canonical_refs when mapping back to taxonomy/motifs.yml.
  - Do not promote group children into taxonomy/motifs.yml unless review shows they
    recur across sources.
canonical_motif_groups:
- id: cosmic_origin
  label: Cosmic Origin and Creation
  description: 'The emergence of the cosmos from void, water, darkness, word, or primordial
    substance. Includes creation by speech, creation from nothing, and the initial
    separation of elements.

'
  children:
  - chaos
  - world_egg
  - failed_creation
  - waters_divided
  aliases: []
  related:
  - primordial_sacrifice
  - axis_mundi
  - flood_and_renewal
- id: primordial_sacrifice
  label: Primordial Sacrifice and Dismemberment
  description: 'The cosmos created through the death, sacrifice, or dismemberment
    of a primordial being whose body becomes the world.

'
  children:
  - body_as_landscape_shaper
  aliases: []
  related:
  - cosmic_origin
  - sacrifice
  - death_and_transformation
- id: axis_mundi
  label: World Axis and Sacred Center
  description: 'The vertical axis connecting heaven, earth, and underworld. Manifests
    as world tree, sacred mountain, cosmic pillar, temple, ladder, or any structure
    that marks the center of the cosmos and enables communication between levels of
    reality.

'
  children:
  - sacred_tree_axis
  - cosmic_mountain
  - sacred_mountain
  - world_center
  aliases: []
  related:
  - ascent
  - descent
  - theophany
  - sacred_fire
- id: descent
  label: Descent and Underworld Journey
  description: 'The journey downward into the underworld, the land of the dead, or
    the depths of consciousness. Includes the stripping of identity, trials below,
    navigation of the afterlife, and the encounter with death or darkness as a transformative
    passage.

'
  children:
  - hero_descent
  - afterlife_passage
  - underworld_trial
  aliases: []
  related:
  - death_and_transformation
  - initiation
  - axis_mundi
  - threshold_guardian
- id: afterlife_passage
  label: Afterlife Navigation and Passage
  description: 'The dead person''s journey through the afterlife as a navigable landscape
    with stages, gates, guardians, and instructions. Includes knowledge of sacred
    names or words of power as requirements for passage.

'
  children:
  - afterlife_passage_by_names
  aliases: []
  related:
  - descent
  - divine_judgment
  - death_and_transformation
- id: death_and_transformation
  label: Death, Rebirth, and Transformation
  description: 'The pattern of death followed by return, renewal, or transformation
    into a new state. Includes literal resurrection, symbolic rebirth, dying-and-rising
    figures, and metamorphosis through death.

'
  children:
  - resurrection
  - rebirth_through_ingestion
  aliases:
  - death_rebirth
  - dying_and_returning
  related:
  - descent
  - sacrifice
  - initiation
  - flood_and_renewal
- id: ascent
  label: Ascent and Heavenly Journey
  description: 'The upward journey toward the divine # climbing the mountain, ascending
    through heavens, rising to receive revelation or divine knowledge. The complement
    of descent.

'
  children:
  - theophany
  - theophany_of_many_forms
  - cosmic_vision
  aliases: []
  related:
  - axis_mundi
  - sacred_knowledge
  - divine_call
- id: theophany
  label: Theophany and Divine Manifestation
  description: 'The direct manifestation or revelation of the divine to a human witness.
    Includes cosmic visions, burning bushes, universal forms, and overwhelming encounters
    with sacred presence.

'
  children:
  - theophany_of_many_forms
  - cosmic_vision
  aliases: []
  related:
  - ascent
  - sacred_knowledge
  - divine_judgment
- id: sacred_knowledge
  label: Sacred Knowledge and Wisdom
  description: 'The acquisition, transmission, protection, or concealment of sacred
    or transformative knowledge. Includes wisdom teachings, forbidden knowledge, stolen
    fire/knowledge, divine instruction, and the paradox of knowledge that transforms
    the knower.

'
  children:
  - wisdom
  - forbidden_knowledge
  - sacred_theft
  - revelation_as_recitation
  - divine_teaching_by_writing
  - divinely_taught_names
  aliases: []
  related:
  - initiation
  - sacrifice
  - theophany
  - trickster
- id: initiation
  label: Initiation and Transformative Ordeal
  description: 'The passage from one state of being to another through ordeal, instruction,
    or encounter. Includes rites of passage, tests, encounters with death as teacher,
    and the crossing of thresholds that permanently change the initiate.

'
  children:
  - heroic_childhood_signs
  aliases: []
  related:
  - descent
  - sacred_knowledge
  - threshold_guardian
  - mystical_quest
- id: mystical_quest
  label: Mystical Quest and Interior Journey
  description: 'The spiritual seeker''s journey toward union, knowledge, or liberation.
    Includes the Sufi path of stations, the hero''s journey in its contemplative form,
    and quests where the seeker discovers they are what they sought.

'
  children:
  - self_knowledge
  - annihilation_union
  - divine_beloved
  - renunciation
  - sacred_song
  aliases: []
  related:
  - initiation
  - descent
  - death_and_transformation
- id: hero_journey
  label: The Hero's Journey
  description: 'The narrative arc of departure, trial, transformation, and return.
    Includes the call to adventure, threshold crossing, the abyss, the boon, and the
    return with knowledge or power.

'
  children:
  - departure
  - return
  - divine_call
  aliases: []
  related:
  - initiation
  - descent
  - threshold_guardian
  - mystical_quest
- id: sacrifice
  label: Sacrifice and Offering
  description: 'The giving up of something precious # life, status, possession, self
    # to the sacred. Includes burnt offerings, self-sacrifice, the scapegoat, and
    sacrificial death that creates or renews.

'
  children:
  - scapegoat
  - atonement_rite
  - annual_purification
  - ritualized_release
  aliases: []
  related:
  - covenant
  - sacred_exchange
  - death_and_transformation
  - primordial_sacrifice
- id: covenant
  label: Covenant and Sacred Bond
  description: 'A binding agreement between the human and the divine, or between sacred
    parties. Includes conditional and unconditional covenants, covenant renewal, and
    the breaking and restoration of sacred bonds.

'
  children:
  - broken_and_renewed_covenant
  aliases: []
  related:
  - sacrifice
  - sacred_exchange
  - divine_judgment
  - ethical_command
- id: sacred_exchange
  label: Sacred Exchange and Reciprocity
  description: 'The principle of reciprocal giving between humans and the divine,
    or between sacred parties. Includes gift exchange, hospitality obligations, filial
    duty, and the idea that sacred relationship requires mutual offering.

'
  children: []
  aliases: []
  related:
  - sacrifice
  - covenant
- id: divine_judgment
  label: Divine Judgment and Moral Reckoning
  description: 'The weighing, testing, or evaluation of souls, deeds, or peoples by
    divine authority. Includes afterlife judgment, earthly punishment for transgression,
    plagues as retribution, and the moral accounting that follows death.

'
  children:
  - ethical_command
  - holiness_code
  - ritual_prohibition
  - moral_consequence_following_action
  aliases: []
  related:
  - descent
  - afterlife_passage
  - sacrifice
  - covenant
- id: flood_and_renewal
  label: Flood, Fire, and Cosmic Renewal
  description: 'The destruction of the world or the old order by water, fire, or catastrophe,
    followed by renewal and the establishment of a new world. Includes the flood narrative,
    the ark/vessel of survival, and the survivor pair who repopulate or restart.

'
  children:
  - ark_vessel
  - survivor_pair
  aliases: []
  related:
  - cosmic_origin
  - divine_judgment
  - death_and_transformation
  - covenant
- id: trickster
  label: Trickster and Boundary Crosser
  description: 'The figure who violates boundaries, steals from the gods, deceives
    authority, and operates at the edges between order and chaos. Often a culture
    hero who brings gifts through transgression.

'
  children:
  - trickster_boundary
  aliases: []
  related:
  - sacred_knowledge
  - threshold_guardian
  - shapeshifter
- id: threshold_guardian
  label: Threshold Guardian
  description: 'The figure who guards the boundary between worlds, states, or levels
    of reality. Must be confronted, appeased, or outwitted before passage is possible.

'
  children:
  - uncanny_ford_encounter
  aliases: []
  related:
  - descent
  - initiation
  - serpent_guardian
- id: serpent_guardian
  label: Serpent and Serpent Guardian
  description: 'The serpent as guardian of sacred knowledge, threshold between worlds,
    or embodiment of danger-and-wisdom. Includes the serpent at the tree, the serpent
    at the root of the world, and the serpent as both threat and teacher.

'
  children: []
  aliases:
  - serpent
  related:
  - axis_mundi
  - sacred_knowledge
  - threshold_guardian
  - forbidden_knowledge
- id: sacred_twins
  label: Sacred Twins and Sibling Pairs
  description: 'The pair of twins or siblings # often one mortal and one divine, or
    one light and one dark # whose relationship drives the mythic narrative. Includes
    hero twins, divine siblings, and fratricidal pairs.

'
  children:
  - sibling_pair
  aliases: []
  related:
  - duality
  - descent
  - death_and_transformation
- id: miraculous_child
  label: Miraculous Child and Sacred Birth
  description: 'The child born under extraordinary circumstances # virgin birth, divine
