  - beauty_paired_with_pain_sweetness_with_sting
  aliases: []
  related:
  - sacred_love
  - mystical_quest
  - sacred_knowledge
- id: divine_race
  label: Divine Race and Arrival of the Gods
  description: 'A race or people of divine or semi-divine origin who arrive, conquer,
    or settle and bring sacred knowledge, treasures, or civilization. Includes the
    Tuatha De Danann, the Anunnaki, and the devas.

'
