  - cattle_raid_catalyst
  - doom_prophecy_before_raid
  - failed_negotiated_exchange
  - wealth_contest_between_rulers
  - violated_queen_as_trigger_of_vengeance
  - household_reversal
  aliases: []
  related:
  - divine_warrior
  - sacrifice
  - divine_judgment
- id: dream_and_vision
  label: Dream, Vision, and Altered Perception
  description: 'Dreams, visions, and altered states as sources of sacred knowledge,
    prophecy, or revelation. Includes prophetic dreams, the dream-reality boundary,
    opened perception, and the idea that ordinary consciousness conceals a deeper
    reality.

'
  children:
  - opened_perception
  - constrained_oracle
  - dream_imagery_of_animals_foreshadowing_or_associated_with_violent_consumption
  aliases: []
  related:
  - sacred_knowledge
  - theophany
  - descent
- id: death_by_fate
  label: Death Attributed to Fate or Destiny
  description: 'Death understood as fated, destined, or determined by forces beyond
    human control. The warrior who cannot escape the death assigned to them. Includes
    the Norse concept of wyrd, Greek moira, and Islamic qadar.

'
  children:
  - death_attributed_to_non_human_agency_and_to_fate_destiny
  aliases: []
  related:
  - divine_judgment
  - lament_and_mourning
  - sacrifice
- id: beauty_and_paradox
  label: Beauty Paired with Pain and Paradox
  description: 'The aesthetic and spiritual insight that beauty and suffering, sweetness
