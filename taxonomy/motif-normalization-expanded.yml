'
  children:
  - cloud_fire_guidance
  aliases: []
  related:
  - axis_mundi
  - sacrifice
  - theophany
- id: sacred_vessel
  label: Sacred Vessel and Container
  description: 'The sacred container # cauldron, grail, ark, pot, sealed jar # that
    holds life, death, wisdom, or transformative power. Includes vessels of resurrection,
    vessels of preservation, and vessels that must not be opened.

'
  children:
  - sacred_cauldron
  - sealed_spirit_vessel
  - portable_sanctuary
  aliases: []
  related:
  - flood_and_renewal
  - death_and_transformation
  - sacred_knowledge
- id: sacred_treasures
  label: Sacred Treasures and Power Objects
  description: 'Objects of divine origin or power # swords, spears, stones, rings,
    feathers, sandals # that confer authority, protection, or sacred ability on their
    bearer.

'
  children:
  - healing_sign
  - protective_mark
  - idol
  aliases: []
  related:
  - royal_legitimacy
  - sacred_vessel
  - initiation
- id: divine_intervention
  label: Divine Intervention and Guidance
  description: 'The direct action of gods or sacred powers in human affairs # sending
    plagues, parting seas, appearing in dreams, providing animal guides, or redirecting
    events through supernatural means.

'
  children:
  - instrument_of_divine_action
  - prophet_call_under_opposition
  - refused_homage_to_created_human
  aliases: []
  related:
  - divine_judgment
  - theophany
  - covenant
- id: otherworld
  label: Otherworld and Enchanted Realm
  description: 'The other world # fairyland, the Country of the Young, the enchanted
    island, the hidden realm # that exists alongside or beneath ordinary reality.
    Distinguished from the underworld of the dead by its quality of timelessness,
    beauty, or enchantment.

'
  children:
  - otherworld_exchange
  - otherworld_sojourn
  - otherworld_protection_in_small_form
  aliases: []
  related:
  - descent
  - axis_mundi
  - shapeshifter
- id: sacred_time
  label: Sacred Time and Ritual Cycle
  description: 'The ordering of time through sacred rhythm # sabbath, seasonal ceremonies,
    jubilee, annual purification. The distinction between sacred time (cyclical, renewable,
    connected to origins) and profane time (linear, entropic).

'
  children:
  - sabbath_cycle
  - jubilee
  - seasonal_cycle
  aliases: []
  related:
  - covenant
  - sacrifice
  - cosmic_origin
- id: sacred_law
  label: Sacred Law and Social Order
  description: 'The divine origin of law, ethical codes, and social obligations. Includes
    dietary laws, purity codes, social care mandates, and the idea that the moral
    order reflects the cosmic order.

'
  children:
  - social_care
  - blood_as_life
  - reciprocity_as_ethical_command
  aliases: []
  related:
  - covenant
  - divine_judgment
  - royal_legitimacy
- id: storytelling_as_power
  label: Storytelling and Narrative as Sacred Power
  description: 'The act of telling stories as a means of survival, transmission of
    wisdom, or sacred power. Includes frame narratives, stories within stories, and
    oral transmission as a technology of cultural memory.

'
  children:
  - storytelling_as_survival
  - dawn_suspense_reprieve
  - voluntary_bride_intercession
  - liberator_threatened_by_captive
  - wit_overwhelms_supernatural_force
  aliases: []
  related:
  - sacred_knowledge
  - initiation
- id: sacred_waters
  label: Sacred Waters and Passage Through Water
  description: 'Water as boundary, purifier, destroyer, and medium of transformation.
    Includes baptismal waters, parted seas, rivers of the underworld, and the primordial
    waters before creation.

'
  children:
  - passage_through_waters
  aliases: []
  related:
  - flood_and_renewal
  - cosmic_origin
  - descent
- id: sacred_love
  label: Sacred Love and Longing
  description: 'Love as a cosmic or mystical force # the love between divine and human,
    the love that transcends death, the longing for return to source. Includes the
    Sufi divine beloved, sacred marriage, and love as the driving force of the quest.

'
  children:
  - love_as_an_affliction_cured_only_by_the_beloved
  - enduring_love_beyond_bodily_decay
  - perilous_path_of_love_requiring_caution
  - fidelity_in_ornamental_captivity
  aliases: []
  related:
  - mystical_quest
  - death_and_transformation
  - divine_beloved
- id: lament_and_mourning
  label: Lament, Mourning, and Tragic Recognition
  description: 'The expression of grief, loss, and tragic awareness. Includes mourning
    songs, laments for fallen heroes, the recognition of what has been lost, and grief
    as a transformative force.

'
  children:
  - fate_lament
  - prolonged_mourning_without_relief_leading_to_physical_collapse_death
  - mourning_expressed_through_embracing_and_kissing_the_deceased_warrior_s_horse_and_equipment
