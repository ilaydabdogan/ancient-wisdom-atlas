  aliases: []
  related:
  - death_and_transformation
  - sacrifice
  - hero_journey
- id: pride_and_downfall
  label: Pride, Hubris, and Downfall
  description: 'The pattern of overreaching pride followed by destruction or humbling.
    Includes failed towers, punished transgressors, kings brought low, and the moral
    that power without wisdom or humility leads to ruin.

'
  children:
  - pride_as_brief_rule_followed_by_downfall_dissolution
  - pride_humbled_in_divine_containment
  - endurance_of_a_record_contrasted_with_daily_transience
  aliases: []
  related:
  - divine_judgment
  - sacred_knowledge
  - royal_legitimacy
- id: sacred_combat
  label: Sacred Combat and Ritual Warfare
  description: 'Warfare, raiding, or single combat as a sacred or ritually significant
    activity. Includes cattle raids as cosmic catalysts, single combat at fords, and
    battles that determine cosmic order.

'
