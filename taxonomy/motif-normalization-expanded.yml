  - gentle_remonstrance_within_hierarchy
  aliases: []
  related:
  - covenant
  - divine_judgment
  - axis_mundi
- id: duality
  label: Duality and Cosmic Opposition
  description: 'The fundamental pairing of opposites # light/dark, order/chaos, life/death,
    yin/yang, good/evil # as structural principle of the cosmos. Includes Zoroastrian
    dualism, Daoist complementarity, and the tension between opposing forces that
    generates reality.

'
  children:
  - non_action
  - cosmic_witness
  aliases: []
  related:
  - cosmic_origin
  - sacred_twins
  - divine_judgment
- id: sacred_fire
  label: Sacred Fire and Divine Light
  description: 'Fire as divine presence, purifying force, sacrificial medium, or cosmic
