  - sacrifice
  - theophany
  - trickster
- id: initiation
  label: Initiation and Transformative Ordeal
  description: 'The passage from one state of being to another through ordeal, instruction,
    or encounter. Includes rites of passage, tests, encounters with death as teacher,
    and the crossing of thresholds that permanently change the initiate.

'
  children:
  - heroic_childhood_signs
  aliases: []
  related:
  - descent
  - sacred_knowledge
  - threshold_guardian
  - mystical_quest
- id: mystical_quest
  label: Mystical Quest and Interior Journey
