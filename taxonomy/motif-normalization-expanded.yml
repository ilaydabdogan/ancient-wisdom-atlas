quality_flags:
  over_specific_label: Candidate motif is too bound to one passage detail to support
    cross-source querying.
  unsupported_taxonomy_ref: Taxonomy ref is absent from taxonomy/motifs.yml and not
    listed as a normalization alias.
  unsupported_comparison_claim: Comparison claim lacks direct evidence or overstates
    transmission.
  front_matter_or_commentary: Passage is title page, contents, footnote, editor note,
    or scholarly commentary rather than primary mythic/ritual text.
  missing_evidence_ref: Motif, figure, symbol, role, scene, or claim references evidence
    not present in the record.
  weak_locator: Locator cannot be checked against canonical Markdown line ranges.
canonical_motif_group_policy:
  source: user_desktop_motif_normalization_2026-04-28
  purpose: Broader query groups for Pattern Explorer and review-time placement of
    granular generated motif labels.
  canonical_taxonomy_relationship: Groups may contain existing taxonomy/motifs.yml
    refs, review aliases, or granular generated labels; they do not automatically
    become taxonomy/motifs.yml motif_families.
  meta_group_prefix: _meta
  notes:
  - Use group ids for broad Pattern Explorer facets and parent-level review reasoning.
  - Use aliases.canonical_refs when mapping back to taxonomy/motifs.yml.
  - Do not promote group children into taxonomy/motifs.yml unless review shows they
    recur across sources.
canonical_motif_groups:
- id: cosmic_origin
  label: Cosmic Origin and Creation
  description: 'The emergence of the cosmos from void, water, darkness, word, or primordial
    substance. Includes creation by speech, creation from nothing, and the initial
    separation of elements.

'
  children:
  - chaos
  - world_egg
  - failed_creation
  - waters_divided
  aliases: []
  related:
  - primordial_sacrifice
  - axis_mundi
  - flood_and_renewal
- id: primordial_sacrifice
  label: Primordial Sacrifice and Dismemberment
  description: 'The cosmos created through the death, sacrifice, or dismemberment
    of a primordial being whose body becomes the world.

'
  children:
  - body_as_landscape_shaper
  aliases: []
  related:
  - cosmic_origin
  - sacrifice
  - death_and_transformation
- id: axis_mundi
  label: World Axis and Sacred Center
  description: 'The vertical axis connecting heaven, earth, and underworld. Manifests
    as world tree, sacred mountain, cosmic pillar, temple, ladder, or any structure
    that marks the center of the cosmos and enables communication between levels of
    reality.

'
  children:
  - sacred_tree_axis
  - cosmic_mountain
  - sacred_mountain
  - world_center
  aliases: []
  related:
  - ascent
  - descent
  - theophany
  - sacred_fire
- id: descent
  label: Descent and Underworld Journey
  description: 'The journey downward into the underworld, the land of the dead, or
    the depths of consciousness. Includes the stripping of identity, trials below,
    navigation of the afterlife, and the encounter with death or darkness as a transformative
    passage.

'
  children:
  - hero_descent
  - afterlife_passage
  - underworld_trial
  aliases: []
  related:
  - death_and_transformation
  - initiation
  - axis_mundi
  - threshold_guardian
- id: afterlife_passage
  label: Afterlife Navigation and Passage
  description: 'The dead person''s journey through the afterlife as a navigable landscape
    with stages, gates, guardians, and instructions. Includes knowledge of sacred
    names or words of power as requirements for passage.

'
  children:
  - afterlife_passage_by_names
  - funerary_deity_as_administrator_of_death_rites
  aliases: []
  related:
  - descent
  - divine_judgment
  - death_and_transformation
- id: death_and_transformation
  label: Death, Rebirth, and Transformation
  description: 'The pattern of death followed by return, renewal, or transformation
    into a new state. Includes literal resurrection, symbolic rebirth, dying-and-rising
    figures, and metamorphosis through death.

'
  children:
  - resurrection
  - rebirth_through_ingestion
  - birth_or_generation_as_access_to_immortality
  - compelled_gaze_at_death
  - fright_causing_sudden_death
  - life_and_death_dependent_on_human_will
  aliases:
  - death_rebirth
  - dying_and_returning
  related:
  - descent
  - sacrifice
  - initiation
  - flood_and_renewal
- id: ascent
  label: Ascent and Heavenly Journey
  description: 'The upward journey toward the divine # climbing the mountain, ascending
    through heavens, rising to receive revelation or divine knowledge. The complement
    of descent.

'
  children:
  - theophany
  - theophany_of_many_forms
  - cosmic_vision
  aliases: []
  related:
  - axis_mundi
  - sacred_knowledge
  - divine_call
- id: theophany
  label: Theophany and Divine Manifestation
  description: 'The direct manifestation or revelation of the divine to a human witness.
    Includes cosmic visions, burning bushes, universal forms, and overwhelming encounters
    with sacred presence.

'
  children:
  - theophany_of_many_forms
  - cosmic_vision
  - human_mariner_beholds_dancing_sea_spirits
  aliases: []
  related:
  - ascent
  - sacred_knowledge
  - divine_judgment
- id: sacred_knowledge
  label: Sacred Knowledge and Wisdom
  description: 'The acquisition, transmission, protection, or concealment of sacred
    or transformative knowledge. Includes wisdom teachings, forbidden knowledge, stolen
    fire/knowledge, divine instruction, and the paradox of knowledge that transforms
    the knower.

'
  children:
  - wisdom
  - forbidden_knowledge
  - sacred_theft
  - revelation_as_recitation
  - divine_teaching_by_writing
  - divinely_taught_names
  - ancestral_inheritance_overcome_by_conscious_action
  - ideal_realized_in_death_and_misery
  - immortal_soul_as_source_of_motion
