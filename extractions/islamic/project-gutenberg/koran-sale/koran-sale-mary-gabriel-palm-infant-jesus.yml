canonical_text:
  summary: Mary withdraws behind a veil, receives Gabriel's announcement of a holy son, conceives by divine decree, suffers childbirth beside a palm tree, is comforted with water, dates, and a command to keep silence, then returns to her people and lets the infant Jesus speak as servant of God, prophet, and son of Mary.
  language: English
  quote_policy: summarized
literal_observations:
