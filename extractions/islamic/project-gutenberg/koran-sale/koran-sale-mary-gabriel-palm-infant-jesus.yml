    text: Mary retires from her family toward the east and veils herself from them.
    category: setting
    evidence_refs:
      - ev:1
  - id: obs:2
    text: Gabriel appears to Mary in the shape of a perfect man and announces that she will receive a holy son.
    category: speech
    evidence_refs:
      - ev:1
  - id: obs:3
    text: Mary says no man has touched her, and the conception is presented as easy for God, decreed as a sign and mercy.
    category: speech
    evidence_refs:
      - ev:1
  - id: obs:4
    text: After conceiving, Mary withdraws to a distant place, reaches a palm-tree in labor, and hears a comforting voice from beneath her near a rivulet.
    category: action
    evidence_refs:
      - ev:2
  - id: obs:5
    text: Mary is told to shake the palm-tree for ripe dates, eat, drink, calm her mind, and refrain from speaking to people that day.
    category: action
    evidence_refs:
      - ev:3
  - id: obs:6
    text: When Mary brings the child to her people, they accuse her and question how they can speak with an infant in the cradle.
    category: speech
    evidence_refs:
      - ev:4
