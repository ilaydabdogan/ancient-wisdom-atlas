  summary: During Rudabeh's dangerous labor, Zal burns the Simurgh's feather and the bird appears to guide the birth of Rustem. The child shows prodigious size and speed of growth, speaks like a born warrior, and proves his force by killing the escaped white elephant with a single blow.
