canonical_text:
  summary: Public scorn over Zal's white hair leads Sam to expose the infant on Mount Alberz, where the Simurgh pities and rears him. Dreams then rebuke Sam into repentance, and the bird restores Zal with a feather that can summon rescue in future danger.
  language: English
  quote_policy: summarized
literal_observations:
  - id: obs:1
    text: Sam abandons the infant Zal on Mount Alberz because public mockery treats the child's white hair as monstrous and inauspicious.
    category: action
    evidence_refs:
      - ev:1
  - id: obs:2
    text: The Simurgh finds the crying child on the hard rock and carries him to its own habitation instead of devouring him.
    category: sequence
    evidence_refs:
      - ev:1
  - id: obs:3
    text: A supernatural voice tells the Simurgh to foster the mortal because a world champion will spring from his line.
    category: prophecy
    evidence_refs:
      - ev:2
  - id: obs:4
    text: The Simurgh's young also show kindness to Zal while he is nourished and protected for several years.
    category: relationship
    evidence_refs:
      - ev:3
  - id: obs:5
    text: Sam dreams twice, learns that Zal lives, and hears rebuke that white hair is a gift from Heaven rather than a crime.
    category: dream
    evidence_refs:
      - ev:4
  - id: obs:6
    text: Sam climbs Alberz, prays for forgiveness, and asks for his injured son to be restored to his sight.
    category: prayer
    evidence_refs:
      - ev:5
  - id: obs:7
    text: Before parting, the Simurgh says it has named Zal Dustn, taught him language and understanding, and must now restore him to Sam.
    category: speech
    evidence_refs:
      - ev:6
  - id: obs:8
    text: The Simurgh gives Zal a feather to burn in danger and then carries him back to his father.
    category: gift
    evidence_refs:
      - ev:7
