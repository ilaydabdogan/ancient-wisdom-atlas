literal_observations:
  - id: obs:1
    text: Bendigeid Vran offers Matholwch a cauldron whose property is to restore a slain man by the next day, though he will not be able to speak.
    category: object
    evidence_refs:
      - ev:1
  - id: obs:2
    text: Matholwch asks where the cauldron came from, and Bendigeid Vran says he received it from Llassar Llaesgyvnewid.
    category: speech
    evidence_refs:
      - ev:2
  - id: obs:3
    text: Matholwch says he saw a huge yellow-haired man come from the Lake of the Cauldron with a cauldron on his back.
    category: setting
    evidence_refs:
      - ev:3
  - id: obs:4
    text: The huge man and his wife survive an iron house made red hot around them, while their children do not escape.
    category: action
    evidence_refs:
      - ev:4
  - id: obs:5
    text: During battle, the Irish kindle a fire under the cauldron of renovation and cast dead bodies into it until it is full.
    category: action
    evidence_refs:
      - ev:5
  - id: obs:6
    text: The bodies placed in the cauldron rise as fighting men the next day but cannot speak.
    category: sequence
    evidence_refs:
      - ev:5
  - id: obs:7
    text: Evnissyen sees that the men of the Island of the Mighty are not being resuscitated and enters the cauldron among the Irish dead.
    category: action
    evidence_refs:
      - ev:6
  - id: obs:8
    text: Evnissyen stretches himself out in the cauldron and rends it into four pieces.
    category: action
    evidence_refs:
      - ev:6
