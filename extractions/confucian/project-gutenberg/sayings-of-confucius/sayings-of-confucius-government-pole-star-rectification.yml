canonical_text:
  summary: The Master teaches that rule should rest on honesty, charity, and example
    rather than punishment, that public trust outweighs even food and soldiers,
    and that exact language is necessary because political order fails when words
    no longer fit realities.
  language: English
  quote_policy: summarized
literal_observations:
  - id: obs:1
    text: Rule over a state should join honest administration, economy, charity,
      and timely use of the people.
    category: teaching
    evidence_refs:
      - ev:1
  - id: obs:2
    text: A virtuous ruler is compared to the Pole-star, remaining fixed while
      others turn toward it.
    category: comparison
    evidence_refs:
      - ev:2
  - id: obs:3
    text: Government by punishments prevents infractions but does not create moral
      shame, while government by inner self-control does.
    category: contrast
    evidence_refs:
      - ev:3
  - id: obs:4
    text: Good government requires enough food, enough soldiers, and the confidence
      of the people, but public confidence is the indispensable element.
    category: teaching
    evidence_refs:
      - ev:4
  - id: obs:5
    text: >-
      Political order depends on each relation performing its proper role:
      sovereign, subject, father, and son.
    category: role_order
    evidence_refs:
      - ev:5
  - id: obs:6
    text: To govern is described as keeping straight, and the ruler's goodness is
      said to bend the people like grass before wind.
    category: metaphor
    evidence_refs:
      - ev:6
  - id: obs:7
    text: Confucius says political reform must begin by defining terms exactly, because
      disorder in language produces disorder in public action.
    category: speech
    evidence_refs:
      - ev:7
