canonical_text:
  summary: >-
    The Master explains that filial piety is more than material support. It
    requires reverence in service, proper rites in burial and sacrifice, gentle
    remonstrance toward parents, and a broader life shaped by charity, ritual
    simplicity, and steady moral seriousness.
  language: English
  quote_policy: summarized
literal_observations:
  - id: obs:1
    text: Filial piety is defined as serving parents in the proper spirit, burying
      them with the proper rites, and worshipping them with proper sacrifices.
    category: teaching
    evidence_refs:
      - ev:1
  - id: obs:2
    text: Filial care is said to involve sparing parents anxiety and not reducing
      duty to bare maintenance.
    category: teaching
    evidence_refs:
      - ev:2
      - ev:3
  - id: obs:3
    text: Without reverence, material support is no better than feeding dogs and
      horses.
    category: comparison
    evidence_refs:
      - ev:3
  - id: obs:4
    text: Ritual and mourning are judged by inward simplicity and heartfelt sorrow
      rather than display.
    category: ritual_teaching
    evidence_refs:
      - ev:4
  - id: obs:5
    text: The gentleman remains courteous even in rivalry and is marked by charity,
      duty, and a stable path of virtue.
    category: ethical_teaching
    evidence_refs:
      - ev:5
      - ev:6
  - id: obs:6
    text: A son may remonstrate gently with parents, continue respectfully if ignored,
      and keep their age in mind with both joy and alarm.
    category: conduct
    evidence_refs:
      - ev:7
