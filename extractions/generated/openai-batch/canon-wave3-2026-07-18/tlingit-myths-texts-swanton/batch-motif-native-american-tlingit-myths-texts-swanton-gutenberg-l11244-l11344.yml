canonical_text:
  quote: ''
  summary: A Tlingit narrative titled “Mountain Dweller” tells of two high-family
    sisters who run away after the elder is abused for eating between meals. They
    reach Mountain Dweller’s house in the mountains, where the elder marries him.
    After she violates his warning not to look behind a skin curtain, both sisters
    die and are restored by Mountain Dweller’s ritual action. They later return home
    with a transforming food-filled basket that becomes a clan emblem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young women are described as formerly forbidden to eat between meals; two
    high-family sisters eat tallow, and their mother angrily abuses the elder sister.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother says that the elder girl, being fond of eating, should marry Mountain
    Dweller, and the sisters run away into the woods that evening.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people search for the missing sisters, but no one sees them for seven
    days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hungry sisters go farther into the woods and mountains, hear someone chopping
    wood, and meet a red-faced man identified as Mountain Dweller.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mountain Dweller invites the sisters into his grand house, gives them food,
    and warns them not to peep at a bad woman behind a large skin curtain.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the sisters’ home village, relatives mourn them by cutting their hair and
    painting their faces black.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The elder sister is married to Mountain Dweller; when she peeps through a
    hole at the hidden woman, the woman screams and both sisters fall dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mountain Dweller returns from hunting, kills the hidden woman, puts eagle
    down on the sisters’ bodies, walks around them several times shaking his rattle,
    and restores them to life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mountain Dweller prepares meat for his father-in-law and changes a finger-sized
    basket into a large basket and back into a small one with meat, tallow, and grease
    inside.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the sisters return to their father’s house, their little brother recognizes
    them, and their parents and relations rejoice.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The basket is too large for the village people to bring in, but the elder
    sister makes it small, carries it home, and it becomes large again, filling the
    house with meats.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The mother takes too much grease and then drinks very cold water; the passage
    says the grease hardens so that her stomach breaks in two.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage says that hearing Mountain Dweller’s ax or seeing where he chopped
    is now fortunate, and that the basket is called Mother-basket and used by the
    G̣ānᴀxteˊdî as an emblem.
  category: attribute
  evidence_refs:
  - ev:12
