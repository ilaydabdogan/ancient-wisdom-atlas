canonical_text:
  quote: ''
  summary: Black-skin remains quiet while mocked, gains and tests strength after a
    bathing encounter with a short man, and later forces his way into a sea-lion hunting
    canoe. G̣ᴀłwēˊtǃ publicly repeats the tree feats and is praised, but during the
    sea-lion hunt he overreaches against a large sea lion and is smashed on the rocks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Black-skin comes in toward morning happy, keeps thinking of Strength, behaves
    quietly, ignores insults, and performs tasks others ask of him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys try to get Black-skin to wrestle; he pretends that little boys throw
    him, and they mock him for being thrown by a child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Black-skin bathes again, he hears a whistle, sees the same man, grips
    him, and is told that he now has strength and should not go into the water again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Black-skin pulls a limb out of a tree and replaces it, then twists another
    tree to its roots and restores it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After others bathe, G̣ᴀłwēˊtǃ pulls out the limb and twists the tree; the
    village praises him, and people mock Black-skin while he remains in bed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bathing is described as preparation for hunting sea lions; only the strongest
    men are selected because sea-lion meat is scarce and the island is difficult to
    reach.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The elder of the chief’s two wives has pity on Black-skin, secretly favors
    him, and gives him clothing-related items and food after he says he is going on
    the hunt though not asked.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The hunting party tries to keep Black-skin from boarding the canoe, but he
    holds it, endures blows to his fingers, pulls the canoe back with little effort,
    jumps in, and sits where one bails.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the sea-lion island, G̣ᴀłwēˊtǃ jumps ashore, kills a small sea lion, then
    tries to attack a large sea lion; the large sea lion throws him upward and he
    is smashed on the rocks.
  category: action
  evidence_refs:
  - ev:8
