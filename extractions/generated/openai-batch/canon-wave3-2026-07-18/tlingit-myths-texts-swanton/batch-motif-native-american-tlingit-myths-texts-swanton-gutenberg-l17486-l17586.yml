canonical_text:
  quote: He did all things as his spirit directed him.
  summary: An unnamed man asks to be taken to town in midwinter. There he predicts
    a good man's illness, is paid to treat him, performs actions like several animals
    while the town fasts and watches, eats and drinks only what his spirit purifies
    and permits, follows the spirit's instructions, avoids fresh food and marriage,
    and lives very long without his hair whitening.
  language: English with Tlingit interlinear text
  quote_policy: quoted
