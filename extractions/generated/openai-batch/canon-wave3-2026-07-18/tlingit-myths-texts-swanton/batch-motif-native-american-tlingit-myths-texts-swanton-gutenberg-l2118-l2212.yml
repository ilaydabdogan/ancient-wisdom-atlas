canonical_text:
  quote: ''
  summary: A man stays with Wolverine-man on a mountain. Wolverine-man feeds him,
    teaches special terms for dishes and spoons, explains a taboo against eating small
    joint bones, makes him a reliable ground-hog trap, and tells him not to reveal
    where he has been. The man learns the trap, sees Wolverine-man’s tree-related
    deception and purification, returns with skins, teaches the trap to others, and
    becomes wealthy through its use and loan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wolverine-man arrives carrying a pack, invites the man inside, wrings out
    his clothes like a human being, cooks ground-hog bones with hot rocks, and teaches
    the man words for dish and spoon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wolverine-man serves food and warns the guest not to eat the small bones at
    the joint, explaining that swallowing them makes the mountain top foggy and prevents
    successful hunting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wolverine-man sends the man to ground-hog places, then makes him a trap from
    two small limbs and names it Never-lasting-over-night because it is certain to
    catch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The man sets the trap at a ground-hog hole, catches four ground hogs on the
    first day, and afterward increases his catch while Wolverine-man catches little.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wolverine-man climbs into a small bushy sǃᴀx tree, plays in it, falls down,
    and is said to be trying to deceive the trapper; the passage identifies the tree
    as Wolverine-man’s wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the man observes the tree episode and returns home, Wolverine-man is
    ashamed and covers himself with ashes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wolverine-man purifies himself using a urinal full of urine with two white
    rocks in it, then puts grease into the fire, gestures toward his face, blows with
    his mouth, and combs his hair while the man secretly watches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the man leaves, Wolverine-man tells him not to say where he has been,
    but to keep him in remembrance by means of the trap.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The man returns with many skins, distributes them to friends, describes a
    productive place and a never-failing trap, and explains how to set it up.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Coward goes with the man but misunderstands the instructions, thinking that
    ground hogs are caught by whittling sticks near the holes, and is corrected.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The man tries to do the same thing to the tree that he had seen Wolverine-man
    do, falls to the ground, and barely crawls home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Because the trap is new and valuable, people pay much to borrow it, feast
    the man, and he becomes wealthy.
  category: sequence
  evidence_refs:
  - ev:9
