canonical_text:
  quote: ''
  summary: Raven helps Tsᴀˊmaya defeat Wolverine-man by deception and by attacking
    the vulnerable foot; Wolverine-man repeatedly revives until burned, and his bones
    become mosquitoes and gnats. Raven then obtains a monster’s devilfish-arm spear
    through marriage, uses it and song to haul in a floating house containing fish,
    and distributes fish to rivers and creeks. In a later episode, Raven teaches a
    girl fire-drill use and tells her to eat the drilling material; she conceives
    Fire-drill’s son, who grows rapidly after bathing in a special spring. Fire-drill
    appears in dreams to equip the son with a canoe, dog, bow, arrows, and club before
    he departs toward the being that killed his mother’s people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsᴀˊmaya lives alone because his friends have been killed by Wolverine-man,
    and he tells Raven he wants to kill Wolverine-man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven tells Tsᴀˊmaya to put on a bear skin and arrange a spear so that Wolverine-man
    will think he has killed a bear; Tsᴀˊmaya does so, and Wolverine-man carries him
    home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven appears in the form of a common blackbird, says Wolverine-man’s heart
    is in his foot, and gives Tsᴀˊmaya a small spear hidden in Raven’s hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tsᴀˊmaya spears Wolverine-man in the foot; Wolverine-man flees, is killed
    repeatedly, comes to life repeatedly, and is finally burned.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Wolverine-man’s bones speak, ask to be pulverized and blown away, say they
    will remain in the world, and are identified as the source of mosquitoes and gnats.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven reaches a house floating far out at sea, kept by Nās-cᴀˊkî-yēł, with
    all kinds of fish inside.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven meets a monster with a devilfish-arm spear and obtains the spear by
    marrying the monster’s daughter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Raven spears the floating house; the spear becomes long and wraps around it,
    and Raven must sing continuously while towing it toward shore.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Raven stops singing, the floating house returns to its first place; after
    three failures, he succeeds on the fourth attempt.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The house opens, fish come out, and Raven sings directions sending some to
    the Stikine River, some to the Chilkat River, and some to small creeks for poor
    people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Raven finds a woman and a little girl alone; the woman says their people went
    hunting or fishing and never returned.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Raven teaches the girl how to make fire with a fire drill and instructs her
    to eat some of the fine material produced by drilling.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After eating the fire-drill material, the girl becomes pregnant and gives
    birth to a male child named Fire-drill’s son.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Raven tells the mother to bathe the child daily in a cold spring called Water-that-makes-one-grow,
    and the child grows quickly into a skilled man.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: The grown child questions his mother and grandmother about houses and missing
    relatives until his grandmother tells him what happened.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Fire-drill appears to his son in dreams, tells him to hide an old canoe under
    brush, and the next morning the old canoe has become a little canoe with needed
    things in it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Fire-drill makes a little dog from the root of a burned tree, gives the dog
    to his son, and also gives him a bow, arrows, and a powerful club.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: Before leaving, Fire-drill’s son tells his mother to hang the fire drill safely
    overhead because it will fall if he is killed; he then travels by water and sees
    the canoe of the being he believes killed his mother’s friends.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: Fire-drill’s son speaks to his dog, club, bow, and arrows, and these objects
    can understand him.
  category: attribute
  evidence_refs:
  - ev:12
