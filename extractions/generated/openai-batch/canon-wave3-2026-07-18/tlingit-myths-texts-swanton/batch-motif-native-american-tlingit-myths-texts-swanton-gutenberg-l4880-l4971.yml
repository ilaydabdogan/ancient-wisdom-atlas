  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized rather than quoted.
- id: ev:5
  type: summary
  locator: 4913-4922
  quote_or_summary: Raven spears the floating house from a canoe; voices inside sing
    fishing-season songs. The spear lengthens and wraps around the house, and Raven
    must keep singing while towing it ashore; when he stops, the house returns, and
    he succeeds on the fourth attempt.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized rather than quoted.
- id: ev:6
  type: summary
  locator: 4924-4928
  quote_or_summary: The house door opens and fish come out; Raven sings commands sending
    fish to the Stikine River, Chilkat River, and small creeks for poor people, explaining
    how fish came to be all over the world.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized rather than quoted.
- id: ev:7
  type: summary
  locator: 4932-4940
  quote_or_summary: Raven finds a woman and little girl alone; the woman says others
    went hunting or fishing and never returned. Raven asks the girl about making fire,
    teaches her the fire drill, and tells her to eat some of the fine material from
    drilling.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized rather than quoted.
- id: ev:8
  type: summary
  locator: 4941-4947
  quote_or_summary: After eating the fire-drill material, the girl becomes pregnant
    and bears a male child called Fire-drill’s son. Raven instructs that the child
    be bathed daily in a cold spring called Water-that-makes-one-grow, and he grows
    very fast.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized rather than quoted.
- id: ev:9
  type: summary
  locator: 4947-4954
  quote_or_summary: The child grows into a man skilled at many kinds of work, asks
