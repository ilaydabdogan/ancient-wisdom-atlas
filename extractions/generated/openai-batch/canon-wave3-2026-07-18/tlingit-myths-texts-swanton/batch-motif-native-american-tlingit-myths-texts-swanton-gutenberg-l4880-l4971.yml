  cautions: The revival is attributed to Wolverine-man only; the passage does not
    explain its mechanism.
- id: motif:3
  label: origin of pests from destroyed enemy remains
  taxonomy_refs: []
  basis: Wolverine-man’s bones speak, are pulverized and blown away, and the passage
