canonical_text:
  quote: ''
  summary: The passage first recounts Black-skin returning to his town after mistreatment,
    finding some people ashamed and choosing to speak kindly instead of taking revenge.
    It then tells of a monster devilfish that has emptied a village; two men leave
    a boy sheltered, bait the devilfish, kill it with knives, and die with it, after
    which relatives recover the boy and the swallowed dead. The passage ends with
    a chief’s daughter secretly raising a wood worm on oil until it becomes large,
    is discovered by her mother, and is said to be stealing oil.
  language: English
  quote_policy: summarized
