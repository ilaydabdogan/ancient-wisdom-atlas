canonical_text:
  quote: ''
  summary: The passage recounts how Kaka, after being taken south, learns from a woman
    that land otters have saved him and that a land-otter tail sinew placed through
    his ear by his wife caused him to become a land otter. Land otters transport him
    in what appears to be a canoe but is really a skate, warn him not to look up,
    and later are described as becoming his spirits. After a journey involving kelp,
    a bay crossing, fear of a raven at daylight, and a human attempt to prevent his
    transformation by naming him a ground hog, Kaka is heard singing in fog on a drifting
    log while injured and fed on by sea birds. His friend fasts, finds him restored,
    brings him ashore, and Kaka becomes a great shaman with land-otter spirits remaining
    with him.
  language: English
  quote_policy: summarized
