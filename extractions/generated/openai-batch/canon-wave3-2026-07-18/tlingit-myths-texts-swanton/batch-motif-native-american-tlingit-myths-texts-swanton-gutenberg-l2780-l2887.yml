  cautions: The passage gives only a footnote explanation, not the full narrative
    of the marriage.
- id: motif:2
  label: Hunter wounds a chief’s nonhuman dependent and enters a hidden animal-person
    house
  taxonomy_refs:
  - shapeshifter
  basis: The sea-lion-chief’s son is struck and later a sick man with the spear string
    is found in a hidden house; in the second episode, a wounded skate slave belongs
    to the G̣onaqᴀdēˊt’s under-cliff household.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  confidence: medium
  cautions: The text presents nonhuman beings in human-like social houses, but it
    does not explicitly describe a visible transformation process.
