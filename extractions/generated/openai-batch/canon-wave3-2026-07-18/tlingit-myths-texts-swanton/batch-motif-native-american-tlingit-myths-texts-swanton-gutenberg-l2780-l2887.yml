  claim: The two hunting episodes in this passage share a pattern in which unsuccessful
    human hunters harm a marine being connected to a powerful household and then enter
    or are brought into that household.
  claim_level: same_motif
  target: Internal parallel between the sea-lion-chief’s-son episode and the G̣onaqᴀdēˊt
    skate-slave episode
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: 'The outcomes differ: the first episode centers on shamanic healing
    and return, while the second centers on judgment, kinship recognition, and hospitality.'
- id: claim:2
  claim: Both main episodes treat marine animals as members of organized social households
    rather than as ordinary prey only.
  claim_level: same_function
  target: Marine animal-person household pattern within the passage
  evidence_refs:
  - ev:2
