canonical_text:
  quote: ''
  summary: 'The passage includes footnotes, one of which explains a grizzly-bear food
    taboo by a human marriage among grizzly bears. The main text tells two unsuccessful-hunting
    episodes: one hunter wounds the sea-lion-chief’s son and drowns, while his companion
    enters a hidden house, acts as a shaman, heals the wounded being, receives an
    animal stomach or skin for return travel, and reaches home after obeying a thought
    prohibition. In the second episode, canoe hunters spear a skate who is a slave
    of the G̣onaqᴀdēˊt; their canoe is brought into the G̣onaqᴀdēˊt’s house, where
    they are judged but then treated as friends after naming a shared family identity.'
  language: English
  quote_policy: summarized
