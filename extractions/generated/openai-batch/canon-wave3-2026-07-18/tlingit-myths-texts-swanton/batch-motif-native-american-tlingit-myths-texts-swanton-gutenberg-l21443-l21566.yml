canonical_text:
  quote: ''
  summary: 'The passage describes speeches and dances at a Tlingit feast for erecting
    a memorial pole for the dead. A chief mourns at daylight, calls upon opposite-side
    families, and uses the Raven daylight story as a ritual analogy: the world once
    lacked daylight, daylight was held by Raven-at-head-of-Nass, a grandchild obtained
    it from his grandfather and brought it to poor people out of pity. The chief says
    darkness is upon him and asks the families to give him daylight by raising the
    pole. The passage also describes responses by five opposite families, quiet respect,
    dances by clan divisions, song leaders with batons, and notes that such rites
    are for chiefs or high-ranking family members.'
  language: English with Tlingit interlinear text
  quote_policy: summarized
