canonical_text:
  quote: ''
  summary: A boy, identified as the son of the sun’s children, is wished dead by filth
    and is forced outside with his mother. His mother builds a branch house, bathes
    him, and raises him while others throw food leavings on the house and mock him
    as a garbage-man. He asks his mother for bow and arrows, hunts, and repeatedly
    goes near a lake. A red-mouthed thing comes up toward him. His mother tells him
    it is his father’s canoe and instructs him to shoot it in the mouth. He shoots
    it; it cries like a raven, is revealed as a copper canoe with wide seats, breaks
    apart, and he secretly carries it home through the night.
  language: English with Tlingit interlinear transcription
  quote_policy: summarized
