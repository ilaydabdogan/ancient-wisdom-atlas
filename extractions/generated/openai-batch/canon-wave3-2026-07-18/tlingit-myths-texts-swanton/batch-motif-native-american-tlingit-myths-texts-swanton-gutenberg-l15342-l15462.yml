canonical_text:
  quote: "“I am Strength. I come to help you,”"
  summary: After several footnotes from preceding material, the passage gives the
    story of Kāhāˊsǃî, a poor and mocked man among people bathing for war strength.
    He secretly bathes at night, encounters a being named Strength in the water, is
    whipped and helped by him, breaks the strength-testing tree-penis, is taken to
    a sea-lion island, performs feats with two sea lions, and thereafter becomes remembered
    and imitated for his strength.
  language: English translation with Tlingit interlinear text
