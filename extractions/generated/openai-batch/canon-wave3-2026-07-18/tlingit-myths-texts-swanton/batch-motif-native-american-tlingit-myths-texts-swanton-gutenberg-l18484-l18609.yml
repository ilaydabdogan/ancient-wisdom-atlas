canonical_text:
  quote: ''
  summary: The passage describes Athapascans being sent away by the Brush people,
    traveling over a glacier to Sand-hill-town, being caught by the Kāgwantān, and
    entering exchange relations with Tlingit groups. It emphasizes trade in abalones,
    food, seaweed, beaver skins, and the learning of practices such as flat nose rings
    and dancing. It also recounts the Athapascans’ initial misunderstanding of seaweed
    cooking in a hot-stone basket pot.
  language: English with Tlingit interlinear text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Athapascans put their packs over their shoulders quickly after the Brush
    people sent them away because they were afraid.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: As they departed, the Athapascans made the sound “Hēˊyē,” went where they
    had been sent, crossed a glacier, and arrived at Sand-hill-town.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the Kāgwantān learned that Qakēˊqǃᵘtê had left X̣ᴀkᴀnuwūˊ, they caught
    the Athapascans and obtained all of their things.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The G̣ānᴀxteˊdî also came to have dealings with the Athapascans, and the passage
    says that these people still stop among them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Athapascans did not become Tlingit, but they became people with whom one
    could trade.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Athapascans gave goods such as abalones, while the Tlingit gave them foods,
    especially edible seaweed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Athapascans did not know how seaweed was cooked; when hot stones were
    put into a basket pot and it shook, they took up bows and arrows to shoot at it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The people explained that the seaweed was to be eaten after it cooled and
    gave the Athapascans horn spoons.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Athapascans asked where people got the seaweed and were told it came from
    the edge of the water at the lowest tide.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the Athapascans returned home with Qakēˊqǃᵘtê, they told the Tlingit
