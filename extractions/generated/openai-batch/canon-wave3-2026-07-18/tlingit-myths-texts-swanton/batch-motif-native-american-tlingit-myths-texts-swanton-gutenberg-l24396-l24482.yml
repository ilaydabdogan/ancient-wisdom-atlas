candidate_motifs:
- id: motif:1
  label: Raven as world-maker and culture hero
  taxonomy_refs:
  - culture_hero
  basis: Raven is given strength to make the world and obtains or establishes daylight,
    water, fire, fish, tides, weather signs, and feast customs.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  - ev:7
  - ev:12
  confidence: high
  cautions: The passage is an abstract, so individual episodes are compressed.
- id: motif:2
  label: Theft or trick-acquisition of valued resources
  taxonomy_refs:
  - sacred_theft
  basis: Raven obtains celestial lights, fresh water, fire, fish, food, grease, and
    a self-acting club through trickery, theft, or deceptive tactics.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  - ev:11
  confidence: high
  cautions: Not every acquisition is explicitly called theft; some are trickery, coercion,
    or assisted acquisition.
- id: motif:3
  label: Trickster boundary crossing and deceptive transformation
  taxonomy_refs:
  - trickster_boundary
  basis: Raven crosses boundaries between birth, smoke-hole escape, animal and human
    social worlds, disguise, canoe travel, whale interior, and ceremonial gatherings
    while repeatedly deceiving others.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:8
  - ev:11
  - ev:12
  confidence: high
  cautions: The taxonomy label is applied to the pattern of repeated boundary crossing
    and deception rather than to a single explicit statement.
- id: motif:4
  label: Etiological transformations of beings and present conditions
  taxonomy_refs:
  - shapeshifter
  basis: The passage explains Raven’s black color, people becoming animals, the tide
    cycle, fog signs, rough water near Sitka, raven gizzard traits, salmon-egg valuation,
    and brothers turned to stone.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The available taxonomy term 'shapeshifter' only partly fits because many
    changes are transformations caused by Raven rather than Raven changing shape himself.
- id: motif:5
  label: Unusual birth used to obtain celestial powers
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: Raven obtains stars, moon, and daylight by being swallowed by the keeper’s
    daughter and born from her.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The abstract gives little detail about the birth episode, so the motif
    label should be reviewed.
- id: motif:6
  label: Fire acquisition with injured animal helper
  taxonomy_refs:
  - sacred_theft
  basis: Raven obtains fire with chicken hawk’s help, and the helper’s bill is burned
    off; the fire is then placed in cedar and stones.
