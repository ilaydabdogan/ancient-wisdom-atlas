canonical_text:
  quote: ''
  summary: 'The passage summarizes a sequence of Raven episodes: Raven is empowered
    to make the world, obtains celestial light, water, fire, fish, and other resources
    through birth, trickery, theft, and helpers; alters tides, weather signs, animal
    traits, local waters, and human or animal bodies; kills or deceives many beings
    for food; and institutes or explains feasting practices and ceremonial interests.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven is described as the son of Kit-kaˊositiyi-qā, who gives him strength
    to make the world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After making the world, Raven obtains the stars, moon, and daylight from a
    keeper at the head of Nass by being swallowed by the keeper’s daughter and born
    from her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven tricks Petrel, owner of fresh water; smoke-hole spirits catch Raven
    as he flies out, and a fire beneath him changes him from white to black.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven scatters fresh water from his mouth, producing rivers and streams.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When eulachon fishers refuse to take Raven across a river, he releases the
    sun and the people flee into woods or ocean, becoming animals corresponding to
    the skins they wore.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven repeatedly obtains food by deception, including fat, salmon, bait, deer
    fat, and Deer himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bear feeds Raven some of Bear’s own flesh; Raven later kills Bear, prevents
    Cormorant from speaking by pulling out his tongue, and kills Bear’s wife with
    hot stones hidden in halibut bladders.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Raven meets the old woman who controls the tide and forces her to let the
    tide fall and rise as it does in the present.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Petrel uses a fog-hat so that Raven cannot find his way out; Raven then induces
    Petrel to let the hat go into the world as a weather sign.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Raven obtains fire with the help of a chicken hawk, whose bill is burned off;
    Raven places the fire into red cedar and white stones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Raven brings ashore the great house containing all fish, gives a feast for
    his dead mother from part of its contents, and the other fish spread through the
    world.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Raven kills nearly all of the killer whales by substituting sharp sticks for
    canes; in a related episode he steals grease and escapes from a grease box after
    it is kicked from a cliff.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Raven enters a whale, lives on what it swallows and on its insides, cuts out
    its heart, and escapes after people cut an opening through the stranded whale.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Raven makes a formerly calm place near Sitka rough by rocking his canoe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After people remove Raven’s gizzard and use it as a polo ball, he recovers
    it; the passage explains the raven’s gizzard as now large and dirty.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Raven marries the daughter of Fog-on-the-salmon; salmon eggs help him paddle
    in stormy weather, but he later dumps them overboard, explaining why people do
    not value salmon eggs much.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Raven steals a man’s self-acting seal-killing club, but it will not work for
    him and he breaks it.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: Raven turns two brothers who had started to cross the Stikine into stone.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: Raven attempts to trick the ground-hog people into throwing surplus food outdoors,
    fails until spring, and then gives a feast for his mother with the food they discard.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:20
  text: Raven obtains female genital organs from an island and places them where they
    belong.
  category: action
  evidence_refs:
  - ev:12
- id: obs:21
  text: Raven invites everyone in the world to a feast because he wants to see a dance
    hat and Chilkat blanket owned by the G̣onaqᴀdēˊt; the passage links this to people’s
    later liking for feasts.
  category: sequence
  evidence_refs:
  - ev:12
