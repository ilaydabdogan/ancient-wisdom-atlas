canonical_text:
  quote: ''
  summary: The passage contains two crest-origin stories. In the first, a poor Nexᴀ́dî
    man is taken by an eagle to the eagle people, marries an eagle woman, becomes
    an eagle hunter, provides food to his human family through dreams, and is later
    recognized as the missing man; this explains the Nexᴀ́dî claim to the eagle. In
    the second, Natsîłᴀné is abandoned on an island by his brothers-in-law, carves
    killer whales from several kinds of wood, succeeds with yellow cedar, uses the
    animated whales to destroy his brothers-in-law, then commands the whales not to
    harm humans; this explains the Dᴀqʟǃawédî claim to the killer whale and connects
    the whales with spirit canoes for shamans.
  language: English
  quote_policy: summarized
