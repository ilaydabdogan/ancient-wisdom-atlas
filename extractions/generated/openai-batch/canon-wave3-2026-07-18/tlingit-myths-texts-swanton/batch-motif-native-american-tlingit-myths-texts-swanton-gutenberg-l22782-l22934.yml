canonical_text:
  quote: ''
  summary: A sequence of footnotes and song texts gives contexts and translations
    for Tlingit feast, mourning, peace-making, and ritual songs. The songs include
    longing for Raven-related addressees, expectation of feasts, a bird omen of a
    feast, Ravens adrift at sea, a speaker drifting in a river and asking for help
    ashore, a Big-song used at death feasts and in peace-making, mourning images of
    a nailed drifting log and the sun behind clouds, and the start of a song used
    when a slave is to be killed at a feast.
  language: Tlingit with English translation and editorial commentary
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One song is attributed to Cukǃusāˊỵî of the ʟǃenēˊdî and is said to have been
    composed when his people expected others to come with food and give them a feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In that song, the speaker says the addressees are before his face every day,
    that he thinks of them when he sleeps, longs for them, and that thinking about
    the Ravens comes like a sudden sickness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A second song attributed to Cukǃusāˊỵî says that thinking about Raven and
    the ʟǃenēˊdî’s children makes the speaker feel as if shaking.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A third song attributed to Cukǃusāˊỵî says the speaker may die without seeing
    Tǃᴀˊqǃdentān’s children, tries to make himself well by thinking about G̣ānᴀxᴀˊdî’s
    children, and tries to stop crying about them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note says a little bird called people’s-thoughts is seen as a sign that
    a feast is coming.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Kux̣ēˊʟǃ’s song, Raven’s thoughts fly toward a Wolf phratry figure like
    the bird people’s-thoughts, and the song asks who can save the Ravens upset together
    in the seas and floating on the water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Big-song is described as used by all the Kāˊgwᴀntān at feasts after a
    rich man had died, with singers turning around toward the sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The same Big-song is also said to have been sung for the Deer in making peace,
    with a different ending, and to have come originally from Sand-hill town through
    Dātxaguˊttc.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Big-song’s translated words include a collective statement that the singers
    feel higher than all others in the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A feast dance song is used when two of the host’s people dance and singers
    from the invited parties sing for them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the feast dance song, the speaker says he is floating down Killer-whale’s-dorsal-fin
    river, asks the Kāˊgwᴀntān’s children to help him ashore, and says he might drift
    away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A song by Small-lake-underneath concerns a drifting log full of iron nails,
    from which a house was built; the song is used when a feast is about to be given
    for a dead man, while participants wear blankets tied to their waists and carry
    canes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Small-lake-underneath’s song, the speaker compares a brother to a drifting
    log with iron nails that should float ashore on a sandy beach, and compares a
    mother to the sun passing behind clouds, making the world dark.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: A Kāˊgwᴀntān song is described as used at a feast when a slave is to be killed;
    only the opening translated words are present in the passage.
  category: action
  evidence_refs:
  - ev:8
