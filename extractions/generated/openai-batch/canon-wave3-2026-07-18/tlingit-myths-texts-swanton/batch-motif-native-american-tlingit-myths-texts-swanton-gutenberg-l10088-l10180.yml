canonical_text:
  quote: ''
  summary: A jealous high-caste man kills several nephews after fearing that his beautiful
    wife may favor them. He lures two nephews to a giant clam and another to a devilfish
    hole. A youngest nephew is trained by his father and a shaman, receives an eagle-down
    bracelet containing carved devil’s club, learns to turn into a small ball of feathers
    when endangered, and receives a knife with a devil’s-club-shaped handle.
  language: English
