  quote: ''
  summary: 'The passage presents several linked anecdotes: a shamanic consultation
    about missing men leads a strengthened youth into warfare; the youth later gives
    up fighting after recognizing his father''s sister and after retaliatory violence
    destroys his companions. It then describes visitor etiquette at Chilkat and Kᴀqǃᴀnuwūˊ,
