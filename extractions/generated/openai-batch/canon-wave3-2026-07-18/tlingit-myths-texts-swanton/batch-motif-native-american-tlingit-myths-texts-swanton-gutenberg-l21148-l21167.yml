  quote: ''
  summary: The passage names a nephew, Xᴀtgāwḗt, who burns his uncle, takes the uncle’s
    bones and property, and brings the bones to Yakutat. The nephew is said to be
    not different from the uncle; he also seizes the ʟǃếnᴀxx̣ī́dᴀq, catches her while
    going for an ax handle, acts concerning the ʟǃếnᴀxx̣ī́dᴀq better than his uncle,
    and becomes richer than his uncle.
