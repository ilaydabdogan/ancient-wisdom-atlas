canonical_text:
  quote: ''
  summary: Raven travels by canoe, rejects several potential companions, accepts Deer,
    lures him across a fragile moss-covered bridge, and eats him. Raven then encounters
    a cliff-dwelling woman who controls the tides, forces her to make the tides fall
    and rise regularly, assigns sea urchins as Mink's food, briefly mistakes tree
    gum for crying, and later quarrels with Petrel over age. Petrel uses a fog-hat
    and sea water to surround Raven with fog and fine rain; the released fog-hat becomes
    associated with a weather sign.
  language: English
  quote_policy: summarized
