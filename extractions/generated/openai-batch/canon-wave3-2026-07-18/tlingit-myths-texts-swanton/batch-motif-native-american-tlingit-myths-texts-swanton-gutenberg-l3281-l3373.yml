canonical_text:
  quote: ''
  summary: A man held among mountain sheep conveys their complaints and ritual instructions
    to his people. The sheep release him after the people alter their treatment of
    sheep skins and weapons. Properly treated skins are restored with flesh and depart
    as living sheep. The man later receives a spirit from the sheep, becomes a shamanic
    figure, and is associated with ritual objects, a house, and the Great Dipper.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mountain sheep can see when the Indians set out to hunt for the man they
    have taken, and they tell him he may go to his friends if the hunters throw away
    their weapons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man tells his friends that he is being punished because they destroy too
    many mountain sheep and put the heads of killed sheep on sticks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mountain-sheep chief instructs that sheep skins be hung with their heads
    toward the mountain and the rising sun, with eagle feathers placed on them, and
    says sheep heads should not be put on sticks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man cannot be seen or heard unless a person has been specially purified
    by bathing in urine.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The sheep go into the mountain with the man to the place where they have their
    homes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:6
  text: The man is later permitted to talk to his friends from the top of a small
    cliff and tells them that, if they begin a war for him, they should try in autumn
    when the sheep come down below the glacier.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The people prepare to kill the sheep and deliberately place sheep heads toward
    the rising sun and leave skins undried, thinking this will make the mountain sheep
    release their friend.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The mountain-sheep chief says the man will be released because the man’s fathers
    are suffering from not having their skins well dried.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: When dogs meet the flock during the man’s release, the sheep remove his mountain-sheep
    skin and leave him in human form; he then chases the dogs away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The man tells his friends not to kill any more mountain sheep, and the people
    break the shafts of the spears used against the sheep and throw them away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: After returning, the man smells like growth from the tops of cottonwood trees
    and instructs the people to dampen, hang, and thoroughly dry the sheep skins,
    then treat them with red paint and eagle down while speaking to them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the morning the houses shake; flesh is restored to the sheep skins, the
    skins come down from the racks and march away, then become scattered over the
    mountains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage explains that because mountain sheep once saved or captured a
    man, they have beards and resemble human beings in other respects.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The mountain sheep send a spirit called Ỵīx̣âˊ to the rescued man as his strength,
    and people rejoice and sing when the spirit manifests in him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: At the spirit’s command, the people make snowshoes, a shaman’s mask, and bows
    and arrows for the man.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: At Fort-by-small-lake, the people build a large house with inside rooms and
    posts, including middle posts carved to represent the Great Dipper; the shaman
    fasts four days and the Great Dipper appears to him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: When the spirit is about to work in the man, inflated porcupine bladders are
    hung in the house; he puts on his mask and snowshoes, carries bow and arrows,
    runs backward on the inside-room walls, and shoots through a bladder.
  category: action
  evidence_refs:
  - ev:8
