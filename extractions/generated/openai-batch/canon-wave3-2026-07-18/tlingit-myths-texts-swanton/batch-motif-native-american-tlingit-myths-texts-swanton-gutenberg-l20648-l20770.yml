canonical_text:
  quote: ''
  summary: A traveling group crosses a glacier, abandons a dizzy brother near a cliff,
    and survives cold and hunger at a red-cedar house where they make fire. The group
    mocks the youngest brother about his helper and killing ability. Angered, he follows
    the mountain being's directions, is led by a white dog to a winter-holed mountain
    sheep, kills it with a spear, discovers it is the mother of the bears, and brings
    fat and meat back to relieve the group's hunger. Later the abandoned brother is
    said to have been taken by wolf people, and the group returns home.
  language: English with Tlingit interlinear text and glosses
  quote_policy: summarized
