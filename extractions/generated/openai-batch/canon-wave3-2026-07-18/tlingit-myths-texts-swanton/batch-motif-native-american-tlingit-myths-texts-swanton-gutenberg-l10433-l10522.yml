canonical_text:
  quote: ''
  summary: 'The passage first recounts an old woman who is found with abundant drying
    food while people cut up a whale; after she is struck, an eagle described as her
    son carries off and drowns the men, while the old woman sends the whale back to
    sea. It then begins the story of a man married to a brant woman: she rejoins her
    brant kin, her husband follows and lives among them, helps them in war against
    cranes and geese, and is later left alone on a sea rock with food for the winter.'
  language: English
  quote_policy: summarized
