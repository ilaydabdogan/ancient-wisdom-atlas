canonical_text:
  quote: ''
  summary: The passage opens the story “The Mucus Child.” A village is emptied by
    disappearances in the woods until only a woman and her daughter remain. The daughter
    conceives after swallowing a mucus-bubble containing a little man and bears a
    rapidly growing boy. The boy seeks the cause of the disappearances, undergoes
    cold-water and strength tests from a large man later identified as Strength, receives
    special clothing and instructions, destroys a town of wolf people, and is then
    sent to demand a box containing the lives of his uncle and village people from
    another village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men, then women and children, disappear after going into the woods behind
    the village for firewood or to follow their kin; only a woman and her daughter
    remain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger survivor cries, wipes mucus from her nose, throws it near a door,
    and sees it move like a bubble with a little man inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The younger woman swallows the bubble before it disappears, becomes pregnant,
    and soon gives birth to a boy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy grows very fast, receives bow, arrows, and quiver, and asks his mother
    where the former occupants of the houses went.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy secretly travels into the woods and reaches a creek of black water
    running out from under a glacier.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A large man calls the boy grandson and orders him to sit in the cold creek
    up to his neck until told to come out.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The large man repeatedly tests the boy by having him pull up or break trees
    and strike rocks; after repeated visits the boy becomes able to shatter the rock.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The large man gives the boy decorated leggings, shirt, and moccasins, including
    a moccasin with a whetstone sole.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The large man identifies himself as Strength and tells the boy that the wolf
    people in a large town took his people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy goes up the valley and hill, clubs people running from the large town,
    and destroys all of them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Strength sends the boy to another village to demand the lives of his uncle
    and village people, says a box may be handed over, and orders him not to strike
    unless refused.
  category: speech
  evidence_refs:
  - ev:8
