canonical_text:
  quote: ''
  summary: A Haida story tells of a young fugitive who escapes inside a seal skin,
    encounters an eagle who appears as a girl, marries her, receives eagle-skin hunting
    coats from eagle in-laws, uses them to catch large sea animals, and secretly provides
    food for his abandoned mother and eventually his village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A footnote says the expression of the story is unusual and may have been modified
    by white influences, while its main plot is described as native.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The story is identified as something that happened among the Haida and begins
    with a young man who married a fine-looking girl.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man's wife deceived him with the son of the town chief; the husband
    killed the chief's son and fled by canoe with his slave because the dead man was
    high-caste.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fugitive and his slave paddled far out into the ocean; the man landed
    on a distant rock with many seals, killed seals, and then found that his slave
    had deserted him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man carefully skinned the largest seal without cutting through the hide,
    tied the skin tightly around himself so no water could enter, drifted on the ocean,
    and came ashore on a beach.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An eagle landed on the seal skin; the man cut through the skin, seized the
    eagle's legs, and saw a girl instead of an eagle; she invited him to her father's
    house and took him up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the fine house to which the girl took him, an eagle skin hung over every
    bed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young man married the eagle-girl and received eagle-skin coats from eagle
    in-laws, each associated with catching cod, salmon, halibut, seal, or sea lion;
    one instruction says to sit on a tree top and look down at the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Older eagles mocked the young black eagle's sea-lion coat, saying the young
    skin could not catch even the smallest trout.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: People in the man's original town had sent his very old mother away from the
    village to starve, and she was near him without his knowing it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Using the coats, the man caught cod, salmon, halibut, seal, and sea lion;
    some prey appeared small or light to him but proved very large at home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man found his mother living in a little house made of branches and arranged
    for her to find a large salmon and then a seal on the beach.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The man told his mother that he had been captured by the eagles, was living
    comfortably among them, had a good wife, and would always look after her; he then
    arranged for her to find a sea lion.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The man told his mother he would leave a whale on the beach and instructed
    her not to touch it; a canoe from the village found it, carried back the news,
    and the village came down to cut it up.
  category: sequence
  evidence_refs:
  - ev:10
