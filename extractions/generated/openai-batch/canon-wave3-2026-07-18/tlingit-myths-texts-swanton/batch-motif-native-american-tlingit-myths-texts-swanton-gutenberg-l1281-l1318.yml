canonical_text:
  quote: That is why the world is now standing.
  summary: Raven drains a sea-water pond to capture a beaver, uses the beaver's foreleg
    bone as a post under the earth, and the post is tended by Old-woman-underneath,
    whose hunger causes earthquakes relieved by grease placed in fire. Raven then
    kills a whale, has it towed by four canoes of people, commands the tired group
    to turn into stone, and the resulting islands are visible as a whale-shaped island
    with four smaller islands. Raven also names several places and appoints a tree-filled
    mountain hollow as the place from which the sun turns back north.
  language: English
  quote_policy: quoted
