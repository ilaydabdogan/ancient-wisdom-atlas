canonical_text:
  quote: ''
  summary: 'A sequence of Raven episodes: Raven escapes from inside a whale, deceives
    people into abandoning their possessions, creates lasting waves, provokes a gull
    and heron to obtain herring, steals salmon and loses and retrieves his gizzard,
    and marries into a salmon-rich household before discarding salmon eggs and keeping
    dried salmon. Several episodes explicitly explain present-day conditions or practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young fellows hear a voice from the beach asking for a hole to be made on
    top so that the maker can be its friend.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The town people cut a hole above the voice, and Raven flies straight up out
    of the whale until lost to sight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Raven escapes, the people cut up the whale and come to the place where
    Raven had lit a fire to make oil.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven rubs himself on a crumbled dead tree to dry, dresses himself well, and
    goes to the town.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Raven asks the people whether anything was heard in the whale, and one person
    answers that a queer noise was heard inside it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven tells the people that in former times those who stayed after hearing
    a sound inside a whale were destroyed; the people leave their things, and Raven
    takes possession of them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven rocks a canoe with his feet in a calm place, making many waves; the
    passage says many waves remain there and canoes entering the place get lost.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Raven asks a sea gull how it calls the new month, and the gull answers with
    a month name; the passage says this is why people differ and dispute about months.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sea gull brings back a large herring, places it beside Raven, and gulps
    it down when Raven tries to get it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Raven carries insulting statements between the sea gull and the heron and
    urges the heron to kick the sea gull under the stomach.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The heron kicks the sea gull, the herring comes out, and Raven swallows it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Raven takes a large salmon from a canoe where people are sleeping, and the
    people follow the trail where he dragged it away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The pursuers find Raven asleep after eating the salmon, twist off his exposed
    gizzard, and use it as a shinny ball; the passage explains this as why humans
    now have no gizzard.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Raven retrieves his gizzard, washes it in water, fails to remove all the sand,
    and the passage explains this as why a raven's gizzard is large and looks unwashed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Raven marries the daughter of Fog-on-the-Salmon because the man has plenty
