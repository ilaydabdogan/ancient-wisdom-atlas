    eggs.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: During a stormy canoe journey, salmon eggs speak, take the paddles, and help
    reach home; Raven then dumps the salmon eggs overboard but carries up the dried
    salmon.
  category: sequence
  evidence_refs:
  - ev:11
