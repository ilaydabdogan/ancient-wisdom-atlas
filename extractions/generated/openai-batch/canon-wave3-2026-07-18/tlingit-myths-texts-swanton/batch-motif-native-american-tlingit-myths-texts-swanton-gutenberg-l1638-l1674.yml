canonical_text:
  quote: ''
  summary: A man leaves with his wife while a speaking halibut hook directs him. Shark
    people pursue him, and killer whales attack the sharks. Sharks prepare for renewed
    battle by sharpening their teeth and rip open killer whales in combat. A supplementary
    account describes the killer-whale tribe moving north, seals calling them warriors,
    a red leading killer whale named killer-whale-spear, clan emblem associations,
    and a place where first killer whales cut through a cliff and carried canoes across,
    giving rise to a crossing place name.
  language: English
  quote_policy: summarized
