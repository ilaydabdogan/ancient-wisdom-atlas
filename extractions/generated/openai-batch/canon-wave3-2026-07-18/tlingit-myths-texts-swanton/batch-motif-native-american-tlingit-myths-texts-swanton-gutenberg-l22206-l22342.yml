canonical_text:
  quote: ''
  summary: A woman fleeing grizzly bear people uses objects and substances that become
    obstructing hills or barriers, reaches the beach, and is saved by Gonaqadet’s
    son, named Ginacamgetk. A subsequent ceremonial speech applies the woman’s situation
    to a host/addressee, linking raven hats, a frog-cane, ancestral emblems, dead
    relatives, a canoe, dancing Raven families, and eagle feathers with protection
    and salvation. The host answers that his aunts showed him the way to the beach,
    that the frog-cane and ancestral emblems save him, and that his long-dead fathers
    have come ashore and he will stay with them forever.
  language: English with Tlingit text and interlinear English gloss/translation
  quote_policy: summarized
