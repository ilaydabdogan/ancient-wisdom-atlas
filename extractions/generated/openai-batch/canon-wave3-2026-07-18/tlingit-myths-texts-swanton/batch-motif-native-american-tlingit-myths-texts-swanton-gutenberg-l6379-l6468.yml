canonical_text:
  quote: ''
  summary: A woman is warned not to look at her husband's other wife, a dangerous
    giant clam, while it eats. She looks through a blanket, is carried under the clam
    by water, dies, and is restored to life by her husband with eagle feathers. The
    husband later sends her back to her parents with food in a self-moving brown-bear
    canoe. She gives birth to a son who is summoned in fog to his father, receives
    a name, shell and tooth gifts, and a magic club. The son becomes a great hunter
    and kills a gigantic crab in the sea with the club.
  language: English
  quote_policy: summarized
