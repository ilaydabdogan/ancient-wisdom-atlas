canonical_text:
  quote: ''
  summary: A raiding party moves through a sequence of towns and forts by canoe, using
    tides, night approaches, and morning attacks. Captives, defenders, local water
    conditions, clam shells, scalping, enslavement, fort names, and canoe destruction
    shape the sequence of victories, losses, and remembered place names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A captured woman tells the raiders that another town lies up the inlet; the
    raiders travel by tide, pass a tide rip, see the town, land below it, and move
    into the forest to surround it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The raiders make bird-like noises in the woods after dark, descend in the
    morning to fight, and capture everyone at the town while the tidal rapids begin
    roaring as the tide falls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A very old captive woman, after reflecting that death is preferable to enslavement,
    tells the raiders to run the rapids at half tide; two canoe loads go ahead, disappear
    under the water, and she drowns with them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A mark is made with blood at the place where the two canoe loads drowned,
    and the passage says it can still be seen and looks like yellowish paint.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At another fort, a woman who comes out is seized and repeatedly stabbed upward
    with a spear until she dies, and the fort receives a name referring to this killing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that attacks in those days were not made in daytime but
    toward morning when people were sleeping soundly; both sides used wooden helmets
    and spears, and fighting also involved clubs, bows, and arrows.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the clam-filled fort, defenders use clam shells to wound, blind, and repel
    attackers; this keeps the canoes away and makes this the only fort in the passage
    where some people are saved.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Little-bear-man, named from his bear-skin coat, shoots at a fort, rejects
    a warning that the tide runs out from a place he thinks is a freshwater pond,
    then waits by a fire after the tide ebbs before fighting, destroying the people
    there, and burning the fort.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The raiders believe they are defeating the northern people, but the passage
    states that only a few people are left at the forts because most are gathered
    elsewhere.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: After destroying people in four forts, the raiders land on a long sandy beach
    to cut off scalps; the passage states that scalps and slaves are what people fought
    for, and that scalps are dried with hot stones or near fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Jealous-man fort on a high cliff, the jealous resident quarrels verbally
    with the foes; after one enemy canoe strikes a rock and splits, the raiders rescue
    its people and leave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Huna-people’s fort, the passage describes the greatest fight, with many
    raiders killed; afterward the raiders break canoes at forts, carry many slaves,
    and taunt the remaining people that they will not dare to fight again.
  category: sequence
  evidence_refs:
  - ev:9
