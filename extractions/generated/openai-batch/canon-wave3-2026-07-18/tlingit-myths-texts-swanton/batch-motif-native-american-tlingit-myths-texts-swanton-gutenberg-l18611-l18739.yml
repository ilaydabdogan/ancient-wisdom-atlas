canonical_text:
  quote: ''
  summary: The passage describes the construction of a very large feast house called
    Shadow-house from wealth associated with the Athapascans, including the gathering
    of large trees, continual drum beating, eight main timbers, eight songs, and a
    water-soaked stomach named x̣eˊca-hīˊnî. It then describes feast preparations,
    women’s ornaments, the chief’s g̣onaqᴀdēˊt dance hat, the throwing of x̣eˊca-hīˊnî
    among the people before gift distribution, the giving of property, slaves, and
    coppers to the opposite phratry, and closing dances with raven hats.
  language: English translation with Tlingit text and interlinear glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people planned to build a feast house using wealth or things brought by
    the Athapascans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Every morning before eating, the people went to get large trees for house
    timbers, and their chopping tools were stone axes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the house was being completed, the drum was beaten continually.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The owner of the house was named Man-from-himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The house had eight main timbers, was completed in one year, and was danced
    together after the long stringers were added.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: There were always eight songs for the house dance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A stomach named x̣eˊca-hīˊnî was soaked in water after the house was finished.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: The house was named Shadow-house because it was so large that a person before
    it appeared small and a person inside had to speak loudly to be heard across it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Women put fringed ornaments on their ears in preparation for the feast, and
    the passage says that anciently they wore these and had red paint on their heads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the guests were seated, the chief put on the g̣onaqᴀdēˊt dance hat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Just before gifts were distributed, the x̣eˊca-hīˊnî was near the door and
    was thrown among the people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The people gave Athapascan things and other property to the opposite phratry;
    they also called out recipients for slaves and gave out coppers placed around
    the inside of the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the guests had gone out, the hosts danced; the other side also danced
    wearing raven hats, and the feast ended.
  category: sequence
  evidence_refs:
  - ev:7
