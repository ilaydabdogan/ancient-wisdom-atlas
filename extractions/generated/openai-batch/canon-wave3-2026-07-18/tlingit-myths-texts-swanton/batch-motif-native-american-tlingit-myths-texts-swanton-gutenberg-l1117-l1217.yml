canonical_text:
  quote: ''
  summary: A sequence of Raven episodes explains post-flood conditions, Raven’s tricks
    to obtain food or grease, the origin or alteration of humans, food resources,
    fern roots, devilfish, pupils in human eyes, the sculpin’s tail and name, and
    a plant formed from Raven’s blanket.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the sea went down, Raven collected small fish while Cᴀkǃᴀˊkᵘ collected
    large sea creatures and rendered much grease.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven reported a dream of an enemy attack, assembled birds to fulfill the
    dream, and used the distraction to drink Cᴀkǃᴀˊkᵘ’s grease.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cᴀkǃᴀˊkᵘ caught Raven in the grease box, but Raven persuaded him to use straw
    instead of a strong rope and escaped when kicked from a cliff.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a feast, Raven taunted birds until the wren flew into a bear’s anus, pulled
    out its intestines, and killed it; Raven then chased away small birds and ate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Raven was said to never get full because he had eaten the black spots off
    his own toes, and he wandered through the world searching for food.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: After human beings had been destroyed, Raven made new ones out of leaves;
    the passage connects this leaf origin with rapid deaths in autumn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that Raven must have changed first people who survived
    the flood into stones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Raven questioned created things about whether they would hurt human beings
    and rooted up those that answered yes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Raven told people that food would be present when the tide went out and that
    food would be in the woods when the tide came in.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Raven broke a stick over fern roots, after which they became green like the
    stick and were divided into many layers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Devilfish were formerly fat and used for grease, but after Raven asked for
    a piece of a hard thing, their fatness left them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Raven invited little people onto bear skins, shook the skins over the fire,
    and the little people flew into human eyes as pupils.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Raven tried repeatedly to catch and eat a sculpin by its tail; each time the
    tail slipped through his fingers and became smaller, and Raven named it sculpin.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Raven threw away a blanket, later recovered it from the shore, placed it on
    branches, and it became Rebis bracteosum.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Raven’s wife asked him to put ashore some fat from the canoe during rough
    seas, and Raven angrily told her to put ashore her sewing basket.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: After leaving his wife, Raven assembled many young birds and told them to
    go after cātǃkǃ, then used as the term for drinking water.
  category: action
  evidence_refs:
  - ev:14
