- id: motif:2
  label: trickster obtains food by deception
  taxonomy_refs:
  - trickster_boundary
  basis: Raven uses a dream ruse to drink grease, manipulates birds and bears at a
    feast, and is repeatedly portrayed as hungry and seeking food.
  evidence_refs:
