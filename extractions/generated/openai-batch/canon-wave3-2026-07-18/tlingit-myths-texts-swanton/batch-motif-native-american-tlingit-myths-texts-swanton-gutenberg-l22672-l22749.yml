canonical_text:
  quote: ''
  summary: 'The passage gives several song notes and translated song texts: an order
    to throw an unnamed male into a river for Raven people to retrieve; an Athapascan-word
    song received by a shaman from an Athapascan spirit; a ground-hog song performed
    with the animal skin and imitated cry; a post-kill bear rite involving the bear
    head, fire, grease, and speech to the bear; and several cradle songs concerning
    shame, pursuit or marriage of a brother''s wife, and addressed children.'
  language: English with Indigenous-language transcriptions and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male is to be thrown into a river so that he floats downstream,
    where Raven people at the river mouth are to drag him up.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A song with Athapascan words is said to have come to the shaman Cūwusḗn from
    an Athapascan spirit, and the words were unintelligible to the informants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ground-hog song is sung while the singer holds up the ground-hog skin
    with both hands and imitates the animal's cry when it jumps into its hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ground-hog song tells a young man to wake and go up on the cliff, and
    says that because he sleeps before hunting he never kills anything.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a bear has been killed, its head is set by the fire, and people drop
    grease into the fire in front of it while speaking to the bear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bear rite includes words saying that the bear has come out of the body
    among the people and is therefore identified with them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bear song says that fire burns in front of a young man, that the grizzly
    bear is heard to say “Whu, whu, whu,” and that people speak to it in that way.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Kāˊgwᴀntān cradle song is sung over a child, used also at feasts, and presents
    the child as the speaker.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Kāˊgwᴀntān cradle-song speaker says he creeps around the house and town
    after his brother's wife and fears being ashamed if the brother jumps up.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A cradle song for a girl says that if the speaker takes nothing to the party,
    the speaker will be ashamed, and it addresses little girls to listen.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A cradle song for a boy says the speaker is certain to marry his brother's
    wife after the brother dies.
  category: speech
  evidence_refs:
  - ev:7
