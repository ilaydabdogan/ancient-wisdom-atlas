canonical_text:
  quote: ''
  summary: A salmon is placed in a fine-woven basket, treated with eagle down, and
    by morning is found as a large man. Ritual instructions follow for the Kîksᴀ́dî,
    including lowered heads, ingestion and vomiting of salt, devil’s club, and sea
    water. A shaman bathes, receives spirits, bleeds from the mouth, and gains a seagull
    as a spirit. He instructs people about cutting salmon into four pieces and tabus
    called Adēyā. His spirits then direct the tying of a raft at Noisy-waterfall;
    the Kîksᴀ́dî board the Sea-lion raft, he blows on it, and it descends the waterfall
    while one man clings to a tree bough.
  language: English with Tlingit text and interlinear translation
  quote_policy: summarized
