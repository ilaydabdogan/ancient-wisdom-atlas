canonical_text:
  quote: "“Here I am lost and yet I dream I am at home with my people.”"
  summary: A man returns by canoe after a long absence at sea. His people announce
    his return, he asks about his wives and children, describes survival on a distant
    rock and the dangers of being lost at sea, sings a song about dreaming of home,
    and gives valuable skins to those who held a feast for him.
  language: English
  quote_policy: quoted
