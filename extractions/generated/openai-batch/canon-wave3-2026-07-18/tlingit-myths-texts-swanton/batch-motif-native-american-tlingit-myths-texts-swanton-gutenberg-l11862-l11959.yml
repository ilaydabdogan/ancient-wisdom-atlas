canonical_text:
  quote: ''
  summary: 'The passage concludes an episode about Dancer and his eleven nephews:
    the boys hunt birds, receive animal-skin garments, discover signs of Tsimshian
    people, dance for arriving kin, are recognized as the missing children, and Dancer''s
    relatives settle around him while he rejects his wife. It then begins the tale
    of a girl who insults a frog, disappears after meeting a fine-looking man, marries
    a frog, has two frog children, and sends them to her parents'' house, where their
    grandfather eventually recognizes them and food dishes are carried to a lake,
    move into it, sink, and return.'
  language: English
  quote_policy: summarized
