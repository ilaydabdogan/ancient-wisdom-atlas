canonical_text:
  quote: ''
  summary: A youth aided by Little Felon completes sea tasks set by an old woman and
    marries her granddaughter; after later cruelty to his wife, she disappears and
    he is identified with a beach snipe searching for her. In the following origin
    tale, girls playing under a cliff mistreat two poor orphans, the cliff imprisons
    the children, birds peck an escape hole, and one poor girl cut in two becomes
    the fern root and the ground hog.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman promises her granddaughter if the youth catches a sculpin far
    out in the ocean; Little Felon makes the sculpin small, and it becomes an awful
    spined monster when delivered.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman next sends the youth to kill a large dangerous crab; Little
    Felon makes it small, kills it, and brings it back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman sends the youth to retrieve a bracelet lost overboard beyond
    the sculpin place; after clam bait is thrown into the water, a dogfish retrieves
    it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the tasks are completed, the old woman tells her granddaughter that
    the youth is her husband and instructs her to respect him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Little Felon refuses payment and explains that the youth had previously helped
    him by pricking him through a smoke hole; Little Felon is identified as a slender
    fish that swims close to the beach.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man and his wife travel together, quarrel, and he is cruel to her;
    she sits on a point, disappears, and he searches for her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young man is identified as a lonely beach snipe seen hunting on points,
    and Tlingit observers say he is looking for his wife.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Girls play house under a cliff; two poor orphan girls bring only dry salmon
    bone and fern root, which older girls take and throw away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The cliff falls in front of the girls and imprisons them; they rub tallow
    and salmon on the cliff, and trapped birds peck at it until they open a hole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The girls crawl out through the hole, but one poor little girl gets stuck;
    the walls close on her, cut her in two, and her head becomes fern root while her
    body becomes a ground hog.
  category: sequence
  evidence_refs:
  - ev:8
