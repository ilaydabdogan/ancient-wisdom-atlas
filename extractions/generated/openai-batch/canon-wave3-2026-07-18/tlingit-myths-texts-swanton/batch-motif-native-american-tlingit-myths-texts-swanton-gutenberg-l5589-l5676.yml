canonical_text:
  quote: ''
  summary: A chief accepts that his daughter has married a finely dressed man. The
    husband hastily takes her away by canoe, where his fine appearance disappears
    and he is revealed as an old, filthy, poor man. At his town, the wife is neglected
    and the husband is mocked. Her father and brothers later arrive with costly goods
    and slaves, but the poor husband cannot properly host them and is shamed by the
    community's refusal to help.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief’s slaves find the chief’s daughter and a man in the rear bedroom
    and report that she is married; her mother confirms it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief prepares valuable furs for the couple to sit on and is glad when
    he sees the son-in-law’s pleasing appearance and high-caste clothing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief reports that an earlier suitor had a living first wife and that
    Tsᴀgwâˊn warned him the man had been cruel to that wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son-in-law says his father told him to leave that day by canoe, and he
    tells his wife to take only minimal robes because he has many furs at home.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the canoe journey, drops fall on the wife’s face; the husband says
    they are paddle-splashes, but the passage states they are drippings from the eyes
    of an old, filthy man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The husband becomes an old man again and loses his fine clothing before the
    wife sees his face; when she sees that he is altogether different, she cries.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the husband’s town, he asks people to let him bring his wife into one of
    their houses because his own house is not fit for her; they refuse and remind
    him that he wanted her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The husband’s older shabby sister brings the high-caste wife to the house,
    where the bed is described as worse than that of one of the wife’s father’s slaves.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The local people ignore the wife, make the couple eat after everyone else,
    and repeatedly mock the husband with false announcements that his in-laws are
    coming to his grand house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wife’s father-in-law group actually comes with expensive furs and a canoe
    load of slaves decorated with green mallard-drake head feathers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the visiting canoes arrive, the husband asks boys to help clean and carry
    goods, but they refuse; people in the town hide their basket-work pots and buckets.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The husband requests water and a basket for his guests, but the townspeople
    refuse, scold him for marrying a chief’s daughter while poor, and his sister gives
    him a basket unfit for the chief’s slaves.
  category: action
  evidence_refs:
  - ev:8
