canonical_text:
  quote: ''
  summary: Mountain Dweller travels with the returning sisters, suddenly appears changed,
    and shines from within as they reach their father’s town. Their little brother
    announces them to their mother, who first disbelieves him because a mourning feast
    has already been held and a year has passed. After requesting a piece of their
    marten blankets as proof, the mother sees her children and invites them inside.
    The elder girl tells about the baskets; the household cannot move the heavy baskets,
    but Mountain Dweller lifts them on his third finger. The baskets contain mountain
    sheep fat, are too full for the people, and are called World-renowned-baskets.
  language: English with Tlingit interlinear/glosses
  quote_policy: summarized
