canonical_text:
  quote: ''
  summary: A woman is directed toward her father's home, flees grizzly-bear people
    across a mountain to a lake, and is taken by a speaking canoe with a high-crowned
    dance hat up into the sun. The sun's sons marry her after killing and dismembering
    a cannibal over a Tsimshian town, which the narration gives as the origin of many
    cannibals there. The woman, her celestial husbands, and their child return to
    her father's town in an animated grizzly-bear canoe. The husbands appear as moonlight,
    sunbeams, and as if emerging from fog. A fish-hawk quill is used to test water
    brought to them; after the woman's hand is seized at the water and the quill bends
    with slime, the husbands become intangible, disappear, and their canoe runs about
    on the lake.
  language: English with Tlingit interlinear text
  quote_policy: summarized
