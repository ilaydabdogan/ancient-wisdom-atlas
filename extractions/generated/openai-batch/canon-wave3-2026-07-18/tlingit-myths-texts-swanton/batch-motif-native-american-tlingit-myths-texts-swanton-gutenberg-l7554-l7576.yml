canonical_text:
  quote: ''
  summary: People searching for a shaman find him on an unexpected sandy beach surrounded
    by gulls, take him home by canoe, and observe that he is extremely thin. After
    his return, spirits name themselves and people perform their songs. The narrator
    then says this is the last event in the Raven story, after which the material
    concerns spirits and shamans, including succession within the same family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from the village were looking for the absent shaman, and four men in
    a canoe saw something strange far out on the shore with sea gulls flying around
    it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the men came closer, they saw the shaman lying on a long sandy beach
    with gulls around him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men did not know of any sandy bay at that place and said the shaman had
    brought it up there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The men took the shaman into the canoe and brought him home; he was so thin
    that he seemed to have fasted for a long time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the shaman was brought home, spirits began saying their names, including
