canonical_text:
  quote: ''
  summary: A nearby shaman, aided by spirits and accumulated strength, discovers a
    mountain source of flint, after which the people know where to obtain it. The
    passage then tells of Kātsǃ, a Sitka Kāˊgwᴀntān man who is taken into a bear den
    by a bear wife, marries her, has children with her, returns to his people under
    prohibitions, violates one prohibition by lifting a child, and is killed by his
    bear children. Later, what is said to be the last of these children attacks people
    at White Stone Narrows and is killed collectively.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shaman related to the same people lived nearby, and his spirits told him
    of a nearby mountain where flint could be obtained.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman's spirits had enough strength that he went to the mountain and
    broke flint from it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that, in those days, each time a shaman cut an animal's
    tongue he gained more strength, and combined strength could become considerable.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people previously did not have flint, but after the spirit discovered
    it, everyone knew where it was found and obtained it from there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kātsǃ belonged to the Kāˊgwᴀntān and lived at Sitka; while he hunted with
    dogs, the wife of a male bear took him into her den.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bear wife concealed Kātsǃ from her bear husband, married him, and had
    several children by him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that bears take off their skin coats indoors and are then
    just like human beings.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before Kātsǃ returned to his people, the bear wife told him not to smile at
    or touch his Indian wife and not to take up either of his children.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After returning, Kātsǃ hunted seal, sea lions, and other animals and carried
    them to an inlet where his bear wife waited; the cubs hauled the canoe ashore
    and passed the game to their mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kātsǃ pitied one child and took it up; on his next trip to the inlet the cubs
    seized him, threw him from one to another up to their mother, and killed him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After Kātsǃ's death, the cubs scattered over the world and are said to have
    been killed in various places.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At White Stone Narrows, a girl spoke angrily about Kātsǃ's child; it came
    upon the camp, killed nearly all the people except a few canoe escapees, and carried
    the woman off alive in pain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: One man could not cut farther than the creature's hair, but finally all the
    Indians together killed it with spears and knives.
  category: action
  evidence_refs:
  - ev:6
