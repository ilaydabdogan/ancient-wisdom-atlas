canonical_text:
  quote: ''
  summary: In “A Story of the G̣onaqadḗt,” a head chief survives a midnight sea disturbance
    by climbing a dead tree on a cliff, while his nephews are swallowed with the canoe
    by a G̣onaqadḗt. Searchers recover the chief. The village first prepares to kill
    the monster, but the chief instead proposes inviting it to a feast because his
    nephews may still be living with it. Envoys repeat the feast invitation at the
    cliff; the water and foam rise and the cliff opens to a long town. The G̣onaqadḗt
    and its people receive the visitors with dance, tobacco, fasting, fire, feeding,
    and a four-day stay.
  language: English
  quote_policy: summarized
