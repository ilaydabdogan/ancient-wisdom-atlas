canonical_text:
  quote: ''
  summary: A Yakutat chief’s daughter insults frogs at a lake. That night a young
    man asks to marry her and leads her under the raised edge of the lake into the
    frog people’s place, where she remains. Her family mourns her as dead. The next
    spring a hunter sees her among frogs in the lake. Her parents try gifts, then
    her father orders trenches dug to drain the lake. The frog people ask for mercy;
    the water drains and scatters them, and the woman emerges with her frog husband.
    She is recovered but retains frog-like speech, cannot eat, expels black mud she
    had eaten among the frogs, and dies. The ending explains local frog-human understanding
    and Kîksᴀˊdî frog songs, names, and emblem.
  language: English
  quote_policy: summarized
