canonical_text:
  quote: ''
  summary: A sequence of Raven episodes describes the regulation of tides, a flood
    reaching mountain tops, survival in canoes, deaths and stone transformations,
    the sea receding, conflicts over fish grease, a bear feast killing, post-flood
    creation of a new generation from leaves, transformations and etiologies of plants,
    animals, winds, peoples, body parts, and place names, and an account of supporting
    the earth with a beaver foreleg guarded by Old-woman-under-the-earth.
  language: English
  quote_policy: summarized
