canonical_text:
  quote: ''
  summary: A lonely Raven-clan man goes into the forest intending that bears kill
    him, but when grizzlies approach he invites them to a feast. He prepares his house
    and body, hosts the bears, and later learns from a human adopted by the bears
    that the bear chief also mourns lost friends. The episode is given as the origin
    of customs involving painting a cross on a grizzly skin and inviting even enemies
    to feasts to make peace.
  language: English
  quote_policy: summarized
