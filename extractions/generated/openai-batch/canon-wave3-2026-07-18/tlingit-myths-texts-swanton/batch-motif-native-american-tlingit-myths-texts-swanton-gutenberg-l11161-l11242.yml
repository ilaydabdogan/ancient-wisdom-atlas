- id: obs:1
  text: The central man belongs to the Raven clan, lives in a large town, and is alone
    after losing friends and family.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: The man considers leaving by canoe but rejects it because others might suspect
    disgrace; he also does not want to kill himself, so he goes into the forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the mouth of a large salmon creek, he finds a bear trail and lies across
    it hoping bears will find and kill him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A large number of grizzly bears approach, led by the largest bear, whose hair
    tips are white.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When frightened by the leading bear, the man says that he has come to invite
    the bears to a feast and that he is willing to die if they kill him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The leading bear turns back and whines to the following bears, and all of
    them go back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man returns home, replaces old sand around the fireplace with clean sand,
    gathers wood, and paints red stripes on his upper arms, heart, and upper chest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other villagers are frightened by the invitation and later shut themselves
    in their houses when the bears arrive.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The man receives the bears in his house, seats the chief in the middle at
    the rear, places the others around him, and feeds them preserved cranberries in
    grease and other food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bear followers watch the large bear and do what he does while eating.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the meal, the large bear appears to make a long speech, then leaves
    with the other bears.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: As the bears leave, each one licks paint from the host's arm and breast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The next day the smallest bear appears in human form, speaks Tlingit, and
    says he had been a human captured and adopted by the bears.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The adopted human explains that the bear chief said he was in the same condition
