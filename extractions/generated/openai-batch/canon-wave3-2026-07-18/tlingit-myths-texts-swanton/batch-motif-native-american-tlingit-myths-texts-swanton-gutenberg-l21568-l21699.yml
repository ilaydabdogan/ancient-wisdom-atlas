canonical_text:
  quote: "“In the first time took place the flood of Raven-at-head-of-Nass.”"
  summary: A ritual speech after a dance consoles a mourner by comparing mourning
    to the flood of Raven-at-head-of-Nass, recalling Old-woman-underneath making the
    flood subside, and saying that ancestral grandfathers, their dead, words, memorial
    poles, floor planks, and an emblem-fire restore warmth and stability. The chief
    and the man putting up the pole respond with thanks.
  language: English with Tlingit interlinear text
  quote_policy: quoted
