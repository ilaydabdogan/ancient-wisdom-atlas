canonical_text:
  quote: ''
  summary: A Yakutat man named Kāˊyeswūsâˊt fails in a wealth contest at a fort after
    substituting cedar bark for copper plates. A wealthy fort chief and his sister
    respond with a display of goods connected to a dog-salmon emblem. A later episode
    tells of a boy who speaks at birth, grows rapidly, becomes known as a great liar,
    journeys to Chilkat/Klukwan after his mother’s death, receives marvelous provisions,
    collects sweet waterfall water, and gives property and food at a death feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Yakutat man returns to the fort after his copper plates are gone and begins
    using cedar bark; his people tie rocks to the bark pieces and throw them into
    the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fort chief places his canoe on the fort walls and fills it with Indian
    beads, caribou skins, moose skins, and other articles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because the ʟǃenēˊdî have the dog salmon for their emblem, the chief’s sister
    acts like a dog salmon shaking out eggs and pretends to shake out riches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The canoe is thrown over the edge of the fort, causing the goods to spill
    out; the Yakutat man is chased out with riches and told to return with more property.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A later song says the Yakutat man was fooling people with yellow cedar bark,
    which was not real property.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: A boy speaks immediately after birth about the many things that will be for
    the people holding his mother.
  category: speech
  evidence_refs:
