  evidence_refs:
  - ev:2
- id: obs:10
  text: He begins the journey without the property he intended to take, but Indian
    rice hails into his canoe and a large box of grease floats down to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: Near the mouth of Chilkat River he tastes water from a waterfall, finds it
    very sweet, and fills buckets with it to put on the rice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: On the way to Klukwan, he tells his children to blow on the sail, and they
    pass up to Klukwan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: At Klukwan the drums are beaten in the evening as a sign that he is going
