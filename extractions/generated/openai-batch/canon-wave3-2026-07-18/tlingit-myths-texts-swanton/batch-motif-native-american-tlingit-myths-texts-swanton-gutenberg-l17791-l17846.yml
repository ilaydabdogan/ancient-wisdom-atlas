  summary: The excerpt contains several footnotes, then two short Tlingit texts with
    English summaries and interlinear translation. In one, a canoe party camps near
    sea lions at Cape Ommaney, goes to a sea-lion island in the morning, pushes sharpened
    limbs into the animals' noses to make them sneeze, and kills them off. In the
    other, people from Chilkat go to war in a spruce canoe, drift down to Dīˊg̣ātiyᴀ,
    defeat the Stikine people, and afterward make peace.
