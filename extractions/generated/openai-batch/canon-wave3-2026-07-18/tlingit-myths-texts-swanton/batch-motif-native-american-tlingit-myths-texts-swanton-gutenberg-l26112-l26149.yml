canonical_text:
  quote: ''
  summary: 'The passage recounts several Tlingit narrative episodes: six brothers
    and their people obtain a copper plate, purchase a creek at Yakutat, and derive
    a name from Kâckǃ; a neglected brother receives help from a mountain being and
    returns in a canoe that is really a grizzly bear; the brothers lose a canoe at
    a glacier, one is taken by Wolf people, and another finds a mountain sheep that
    is really the mother of bears; Heavy-wings resolves storms caused by North Wind
    by giving him his daughter, then encounters the ʟǃêˊnᴀxx̣īˊdᴀq with fatal consequences
    from wrong words, while his nephew uses the right words and becomes wealthy; a
    separate origin note explains the name “man of the rocks” from the adoption and
    return of a rock man’s son.'
  language: English
  quote_policy: summarized
