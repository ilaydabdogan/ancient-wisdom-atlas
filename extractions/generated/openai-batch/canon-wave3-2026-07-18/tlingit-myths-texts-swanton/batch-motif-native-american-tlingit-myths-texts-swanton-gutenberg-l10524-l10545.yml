canonical_text:
  quote: ''
  summary: An unnamed person lying on a rock hears a loud voice repeatedly. He sees
    a nearby bird called gusǃyadūˊłî, which says it has come to bring him luck and
    tells him to ride on its back with his face hidden in its neck feathers. The bird
    repeatedly warns him not to look up while it flies. After stopping first on a
    drifting seaweed pile far out at sea, the bird carries him onward until he recognizes
    a place close to his own village.
