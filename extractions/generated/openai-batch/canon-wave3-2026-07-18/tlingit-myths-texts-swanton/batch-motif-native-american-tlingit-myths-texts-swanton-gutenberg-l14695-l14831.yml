canonical_text:
  quote: ''
  summary: The passage gives an old story-ending formula, then begins the story titled
    “Mountain Dweller.” A chief stores tallow for strangers. The children’s grandmother
    gives tallow to her grandchildren and says an old shaggy dog took it. When the
    chief invites foreign people, the tallow box is empty and the chief is ashamed.
    The children’s dishes have hair on them; their mother scratches both girls’ cheeks
    because they ate the tallow. That night the girls make a hole under the boards,
    put the hairy dishes in their places, and go into a hollow tree.
  language: English with Tlingit transcription
