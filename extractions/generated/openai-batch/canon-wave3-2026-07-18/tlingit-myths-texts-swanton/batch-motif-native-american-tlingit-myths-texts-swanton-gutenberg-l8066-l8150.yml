canonical_text:
  quote: ''
  summary: Kakēˊqǃᵘtê observes Athapascan ground-hog hunting, introduces slip-noose
    trapping, teaches winter preservation of meat and berries, shows how to harvest
    and prepare hemlock bark, and demonstrates pit cooking with skunk cabbage, heated
    stones, water, earth, and fire. The passage says these practices changed the people
    from immediate consumption and winter scarcity to stored food and greater ease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Athapascans go into valleys for ground hogs, with individual places where
    others are not allowed to intrude, but the village obtains very few ground hogs
    by the existing method.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kakēˊqǃᵘtê asks whether their current method is the only way to get ground-hog
    meat, carves pieces of wood, has women make hide thongs, and makes slip-nooses
    for ground-hog burrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kakēˊqǃᵘtê tells the people to keep away from the traps; the next morning
    each trap contains a ground hog, and he gives every man in the village five.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage describes claimed valleys, special trees on which dried meat is
    hung, and abandoned places where meat remains hanging on tree limbs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Kakēˊqǃᵘtê instructs the people to cook meat well, smoke-dry it on sticks
    high in the house, and put it in oil for winter storage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kakēˊqǃᵘtê observes women eating berries immediately and teaches them to dry
    berries and preserve cooked berries in grease.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage contrasts earlier immediate consumption and winter want with later
    stored food, year-round berries, reduced need to hunt, and fewer starvation conditions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In spring, Kakēˊqǃᵘtê shows the people that hemlock bark can be eaten and
    demonstrates taking it off with a sharpened hemlock limb and mussel shells.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kakēˊqǃᵘtê sharpens bear bones and gives one to each woman to use like the
    shell; husbands or sons strip bark, while women and daughters separate the good
    part.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kakēˊqǃᵘtê gathers skunk cabbage, digs a pit lined with flints, heats the
    rocks with fire, throws water on them, layers skunk cabbage and hemlock bark,
    covers the pit with earth, and keeps fire above it overnight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the pit is uncovered, the cooked bark is described as savory and sweet;
    villagers taste it and then bury bark in the same manner.
  category: sequence
  evidence_refs:
  - ev:6
