canonical_text:
  quote: ''
  summary: A shaman warns that land otters will attack the people and explains sicknesses
    and accidents as effects of their arrows and poisonous shells. He sends men to
    secure two white land otters, who are ritually feathered and treated as guests.
    The land-otter-people arrive with Tūtsǃīdîgūˊʟ, a two-headed figure whose appearance
    makes everyone but the shaman fall as if dead; the shaman counters with poisonous
    water, Tūtsǃīdîgūˊʟ dances, and the people later wake while the land otters have
    vanished. In a following episode, Raven warns people not to leave town for salmon,
    but four boys go; a naked red-painted man prophesies that three will fall from
    the canoe and the stern boy will return with news.
  language: English
  quote_policy: summarized
