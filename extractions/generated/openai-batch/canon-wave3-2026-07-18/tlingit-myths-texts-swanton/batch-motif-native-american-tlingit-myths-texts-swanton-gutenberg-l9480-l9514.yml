canonical_text:
  quote: ''
  summary: A winter famine at a Copper River place leaves many dead. Eight remaining
    men leave along the riverbank; cold kills them one by one until one man remains.
    He follows a calling voice to a great fire, warms himself, and then sees the dead
    villagers and men around it. The fire, named Self-burning Fire, is said to have
    brought them back to life, after which they obtain food easily at the river mouth.
  language: English
