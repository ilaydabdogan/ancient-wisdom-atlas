canonical_text:
  quote: ''
  summary: The G̣onaqᴀdēˊt and his people approach a host village, have rain stopped
    by a shaman, exchange dances and feasts with the village, observe fasting and
    pre-raven-call singing, and receive property. The host chief is sad because his
    nephews have not appeared. The G̣onaqᴀdēˊt has a carved and painted box brought,
    removes ceremonial hats and rattles, and causes the chief’s eldest nephew and
    then twenty youths to stand forth and receive hats, rattles, and songs. The G̣onaqᴀdēˊt’s
    party departs singing into fog. The passage closes with etiological notes about
    avoiding hearing the raven before guests rise, about the origin of a chief’s headdress
    with sea lion bristles, and about Nass people wearing it first.
  language: English
  quote_policy: summarized
