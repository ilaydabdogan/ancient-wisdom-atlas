canonical_text:
  quote: ''
  summary: In the tale titled “The Lǃênaxx̣īdaq,” a man at Auk sees a long-haired
    woman floating on a lake with her little ones and takes one child home. At night
    the child goes through the town removing people’s eyes. A woman who has just borne
    a child confronts the small boy, whose belly is full of eyes, and kills him with
    a cane when he points at her eyes. She then dresses, takes her own child on her
    back, says she is going to become the Lǃênaxx̣īdaq, and wanders while eating mussels,
    nesting their shells, and nursing her child.
  language: English with Tlingit interlinear/glossed text
  quote_policy: summarized
