canonical_text:
  quote: ''
  summary: Footnotes and song texts describe several Tlingit songs connected with
    marital conflict, dreams of a spirit, anticipated killing, near death, intergroup
    violence, and a Kāˊgwᴀntān cremation rite. Recurrent death-related images include
    a Raven going up to ghost country, a Wolf phratry appearing in connection with
    death, a traveler expected to die before reaching Victoria, and a nephew led up
    to a place for people who have been killed where his uncles have made him a house.
  language: English with Tlingit transcriptions
  quote_policy: summarized
