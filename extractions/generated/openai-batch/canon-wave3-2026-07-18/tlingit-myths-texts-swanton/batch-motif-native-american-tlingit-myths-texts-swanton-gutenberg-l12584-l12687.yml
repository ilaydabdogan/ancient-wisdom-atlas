  quote: ''
  summary: The passage contains the end of a tale in which a young man brings back
    his dead wife as a shadow, a jealous listener lifts their curtain, and both return
    as ghosts to Ghost Land; the tale titled “The Sky Country,” in which a man seeks
    his taken wife, survives hostile villagers, and returns from the sky by a spider’s
    web; and the opening of “The Origin of Copper,” in which a chief’s daughter encounters
    a man who leads her toward the woods and under apparent logs that are mountains.
  language: English
