  summary: A man makes a large house out of copper, pounds out copper objects, and
    is mocked with names connected to pounding and garbage. A chief's daughter is
    kept from marriage despite many suitors. The man dresses at night, uses a twisted
    piece of copper to reach her through a hole, calls her outside, brings her to
    his copper house, and marries her there.
