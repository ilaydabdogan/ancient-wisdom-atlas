canonical_text:
  quote: ''
  summary: A boy encounters and kills a one-eyed bad shaman who tries to deceive him
    into trading arrows. He then enters the cliff dwelling of the shaman’s wife, Knife-hand,
    refuses human flesh offered as food, kills her, escapes through a shrinking entrance
    by making himself small, and returns home. He later meets Old-mole-woman, who
    feeds him by transforming a small piece of salmon into a whole salmon and tells
    him that hawks killed his kin. At the hawk nest, young birds show human bones
    and describe their parents arriving in colored clouds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The one-eyed man has a single eye in the middle of his face, is very large,
    lives in a cliff, addresses the boy as nephew, and says winds killed the boy’s
    uncles and his mother’s friends.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The one-eyed man can read the boy’s thoughts, proposes trading arrows, and
    wants the boy’s arrow called Heart-stopper; his own arrow points are fireweed
    seed vessels presented as sea-urchin spines.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy accuses the one-eyed shaman, kills him with help from the dog, removes
    his tongue, and burns his body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy finds a steep cliff beside the water with an aperture marked by red
    paint and a ring of tied devil clubs; the resident is Knife-hand, wife of the
    man he killed.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Knife-hand has a knife on each hand, invites the boy to eat, and is cooking
