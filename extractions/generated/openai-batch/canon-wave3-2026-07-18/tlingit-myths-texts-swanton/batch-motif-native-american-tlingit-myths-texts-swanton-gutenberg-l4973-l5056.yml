    the knife back.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: After killing Knife-hand and cutting out her tongue, the boy sees the entrance
    hole shrinking, makes himself small, enters an ermine skin tied in his hair, and
    runs out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The boy returns home with seal and deer in his canoe, and his mother and grandmother
    are glad because they had been weeping and worrying for him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Old-mole-woman produces food by taking a small piece of salmon from between
