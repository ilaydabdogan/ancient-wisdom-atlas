canonical_text:
  quote: ''
  summary: Qakēqǃᵘtê explains a fish trap among the Athapascans, who learn of it and
    pay him with valued goods in connection with a high-caste marriage. After two
    years they pack his property and accompany him back toward his Tlingit friends.
    At Brush creek the local people refuse to ferry him and the Athapascans across,
    tell them to go elsewhere, and Qakēqǃᵘtê explains that they are being sent away.
    The episode is given as the origin of a later saying about the Brush people sending
    the Athapascans away from the other side.
  language: English with Tlingit transcription and glosses
  quote_policy: summarized
