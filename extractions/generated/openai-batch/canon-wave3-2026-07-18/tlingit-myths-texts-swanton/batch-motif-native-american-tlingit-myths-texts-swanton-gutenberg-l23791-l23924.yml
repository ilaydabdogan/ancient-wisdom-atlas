canonical_text:
  quote: ''
  summary: The passage is a footnote and a sequence of Tlingit mourning-song notes
    and translations. It mentions a special sky realm for those who die violently,
    songs composed after deaths by bear attack, drowning, and illness or bereavement,
    and laments in which speakers seek or imagine routes to dead kin, compare drowned
    brothers to people saved by the Duck tribe, describe the dead as going under the
    earth, and express hope of seeing lost brothers again.
  language: English with transcribed Tlingit and one Haida phrase
  quote_policy: summarized
