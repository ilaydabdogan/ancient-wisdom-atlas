canonical_text:
  quote: ''
  summary: A disliked gambler son-in-law secretly captures and skins a lake monster,
    uses its skin to travel underwater and to the sea, and during famine brings salmon
    and other sea food to the village. His mother-in-law finds the food, attributes
    it to luck or a spirit, and tries to control access to the morning discoveries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is titled as an origin of the G̣onaqadēˊt and begins with a high-caste
    man married to a high-caste woman from a neighboring village, with the mother-in-law
    living in the household.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother-in-law dislikes the son-in-law, describes him as lazy and fond
    of gambling, and orders the fire put out after meals so he will not have food
    there.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the salmon season, the man dries salmon, builds a dry-wood house beside
    a lake, fells a large tree into the lake, and splits it with wedges and crosspieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The man baits a line with salmon to test for a monster in the lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man traps the lake monster’s head when the split halves of the tree spring
    together, and the monster struggles until it dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The monster has sharp, strong teeth and claws described as looking like copper.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man skins the monster with claws and other parts entire, dries the skin,
    gets inside it, and enters the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Inside the monster skin, the man is carried or swims down to the monster’s
    beautiful house under the lake.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: After returning, the man hides the skin in a hole in a dry tree and tells
    no one about what he has discovered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When famine comes in the following spring, the man tells his wife he will
    return each morning before the ravens are awake and says that if she hears a raven
    before he returns, she should no longer look for him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Wearing the monster skin again, the man reaches the sea, catches a king salmon,
    and leaves it on the beach near the houses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mother-in-law finds the salmon, thinks it drifted there, and the village
    cooks and distributes it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The man repeats the action with two salmon and tells his wife that he is obtaining
    them, while instructing her not to speak about it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The mother-in-law complains that people would starve if she did not collect
    dead salmon, while the son-in-law and his wife laugh about her statement.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The man later brings a large halibut, and the mother-in-law interprets the
    repeated finds as luck brought by a spirit.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The mother-in-law falsely claims to have had a bad dream so that the chief
    orders people not to go out early, and the man then brings a seal the next morning.
  category: sequence
  evidence_refs:
  - ev:10
