canonical_text:
  quote: ''
  summary: The passage recounts a sequence of Tlingit clan interactions involving
    invitations to Chilkat, shamanic interpretation of tree and raven-hat omens, competitive
    feasting with property, copper, goods, and slaves, the escalation of rivalry into
    warfare, a tobacco-bearing slave messenger sent between chiefs, and later ritual
    preparations involving bathing and spirit consultation by Big Raven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kā́gwᴀntān, described as wives of the ʟǃūkǃnᴀxᴀ́dî, were invited to Chilkat
    by a chief named Tailless-Raven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before a tree was felled for a totem pole, the shaman Cqēʟ̣aqā́ interviewed
    his spirits and remarked that the chip and the fallen tree went toward Huna.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The spirit named Ānkᴀx̣wā́î was the model for the carved pole, and the shaman's
    spirit said it saw something wrong with the invited people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A raven hat was made, and the spirit in the shaman said that the raven had
    been shot with arrows and that blood was coming from its mouth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: At the feast, the hosts gave the Kā́gwᴀntān much property, including slaves
    and goods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ʟǃūkǃnᴀxᴀ́dî also made a raven, and Qǃonḗ put on a raven hat with copper
    tail, beak, wings, and a copper plate at which it pecked.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The canoe people said the raven had eaten salmon skins at Chilkat, and the
    passage explains that salmon skins meant the furs and hides that had been given
    away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The raven's copper wings and pecking plate were thrown ashore for the Kā́gwᴀntān
    and valued at forty slaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: After news reached Chilkat, the G̣ānᴀxtédî became angry, built Whale house,
    bought slaves from several groups, and gave the slaves away at a feast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: War broke out between the two families; the ʟǃūkǃnᴀxᴀ́dî were badly defeated,
    and another group whose friends had been enslaved also made war on the G̣ānᴀxtédî
    without better result.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Yēł-x̣āk sent a slave with food and tobacco to his father-in-law Big Raven
    and instructed the slave to remember every word Big Raven said.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Big Raven responded after seeing the cottonwood leaves around the tobacco,
    and the slave later repeated his words in a council at Whale house.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: Cādisî́ktc was bathing in order to acquire strength to kill the G̣ānᴀxtédî.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The ʟǃūkǃnᴀxᴀ́dî pounded on Big Raven's house so that his spirits would come
    out, and Big Raven addressed Łᴀ́kua before a spirit spoke about the course and
    the Raven swinging back and forth.
  category: action
  evidence_refs:
  - ev:7
