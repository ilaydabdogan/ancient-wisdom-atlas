literal_observations:
- id: obs:1
  text: A man from the woods predicts that three canoe travelers will drop over at
    intervals and that the man in the stern will die after reaching home and eating;
    the deaths occur as stated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deaths of the canoe travelers and the shaman are accompanied by blood
    flowing or pouring from the mouth.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The shaman asks for his apron, hat, and necklace, dresses as if to doctor
    someone, turns himself around three or four times, and then dies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people of the town become frightened and do not go away; they had heard
    that land otters have death and many sicknesses for bows and arrows.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people begin to starve, and a poor child cries at night from hunger for
    several nights.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A torch-bearing man calls the hungry child, offers to feed it on qǃołkᴀdᴀkêˊx̣,
    and is identified as Man-with-a-burning-hand because his hand is always on fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The substance Man-with-a-burning-hand calls qǃołkᴀdᴀkêˊx̣ is identified as
    ants.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The parents find the child inside an opening under a flat rock at a cliff,
    with ants crawling from its nose, eyes, and ears.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Other children are brought to see the child, and parents use the story to
    warn crying children that Man-with-a-burning-hand will get them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A cliff behind the site of Tᴀˊqdjîk-ān is still called Man-with-a-burning-hand,
    and the story is said to have been known all over Alaska.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Chief G̣ᴀłwēˊtǃ and the village people bathe in the sea for strength; the
    chief also tries to pull or twist limbs from trees in order to become a sea-lion
    killer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Black-skin is regarded as weak, slow, and cowardly, and people tease him by
    pushing him over.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Black-skin is only feigning weakness; at night he secretly bathes for hours
