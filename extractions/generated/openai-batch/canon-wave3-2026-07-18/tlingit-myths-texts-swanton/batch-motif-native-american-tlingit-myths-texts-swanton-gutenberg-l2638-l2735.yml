candidate_motifs:
- id: motif:1
  label: fatal misunderstanding of spoken instruction
  taxonomy_refs: []
  basis: The mother intends the boy to cook a cockle for the crying baby, but he understands
    the instruction as an order to put his sister into the fire and does so.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents the event as a misunderstanding; no broader explanatory
    frame is supplied beyond the resulting place-name.
- id: motif:2
  label: place-name derived from a death event
  taxonomy_refs: []
  basis: After the child is burned, the stream is named Creek-where-a-person-was-burned.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Only this single naming explanation is provided in the passage.
- id: motif:3
  label: revenge directed at an object through a human victim
  taxonomy_refs: []
  basis: Because the board fell during the man's fatal accident, people lay it across
    a slave's neck and kill him to be revenged on the board.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage states the revenge action but does not explain its ritual
    or social logic beyond revenge on the board.
- id: motif:4
  label: water creature seizes canoe into underwater lair
  taxonomy_refs: []
  basis: The devilfish's arms pass over the men while they hide, and the devilfish
    takes their canoe into its hole under water.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The creature is named only as a devilfish; no further origin or supernatural
    status is specified in this passage.
- id: motif:5
  label: substitute log sent to the monster's hole
  taxonomy_refs: []
  basis: After the devilfish takes the canoe, people burn and quench a log, take it
    to the devilfish hole, lower it down, and never see it again.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The stated intention is to drown the log at the devilfish hole; the passage
    does not explicitly state the expected effect on the devilfish.
- id: motif:6
  label: animal-person encounter after a hunted animal is cooked
  taxonomy_refs:
  - shapeshifter
  basis: A big land otter is trapped, carried, skinned, cooked, and eaten; during
    and after this, whistling occurs and a whistling being identified as a land-otter-man
    throws objects from a tree.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage identifies a land-otter-man but does not explicitly narrate
    a transformation from animal to human-like being.
- id: motif:7
  label: fire defeats tree-dwelling hostile being
  taxonomy_refs: []
  basis: The men light a fire under the tree where the land-otter-man is sitting;
    he falls into it and is burned up.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the action sequence but no explicit ritual explanation
    for the fire.
- id: motif:8
  label: place-associated madness after supernatural encounter
  taxonomy_refs: []
  basis: After the land-otter-man is burned, the men act as if crazy, and later visitors
    to the same place behave in the same manner.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage links the behavior to the place temporally, but does not explain
    the mechanism.
- id: motif:9
  label: communal revenge by destroying murderers' house
  taxonomy_refs: []
  basis: People seek the murderers, find their driftwood house, crush and kill the
    occupants, burn the house and contents, and break up the canoe.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage identifies the occupants as murderers but gives no names or
    further genealogy.
