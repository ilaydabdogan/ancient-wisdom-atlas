canonical_text:
  quote: ''
  summary: A sequence of Tlingit narrative episodes recounts a child burned in a campfire
    after a misunderstood instruction, a man killed by a tree-climbing apparatus and
    a retaliatory killing connected with its board, a devilfish taking a canoe into
    an underwater hole, a log burned and lowered into that hole, a land otter and
    land-otter-man encounter ending in burning and place-associated madness, and a
    communal search that destroys murderers in a driftwood house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two women camp near a small inlet with their children and prepare shellfish
    by boiling, skewering, and drying them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mother tells a child to cook a cockle in the fire, but the boy understands
    her to mean that he should put his little sister into a hole in the fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy places his little sister in the fire and covers her over after she
    repeatedly gets up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A stream is afterward named Creek-where-a-person-was-burned.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: A man gathering cedar bark dies when the board of his tree-climber slips and
    the rope holds him by the neck against the tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dead man is identified as a chief's brother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: People place the fallen board across a slave's neck and kill the slave in
    order to be revenged on the board.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The board is kept and exhibited at feasts, and people are called for the death
    feast.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two men in a canoe see two huge devilfish arms moving across the bay, hide
    under a rock, and the devilfish takes the canoe into its underwater hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The men see what appears to be a small halibut in a creek, but closer inspection
    shows it is a white rock.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: People chop a log, start a large fire, partly burn the log, put out the fire
    with hot water, and lower the log into the devilfish hole, after which it is not
    seen again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A hunter finds a big land otter in a trap, twists a tree bough around its
    neck, carries it home, skins it, and cooks it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Whistling is heard while the land otter is being carried and cut up.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A whistling land-otter-man in a tree throws rocks, then exchanges rocks and
    cones with the men during the night.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The men light a fire under the tree, the land-otter-man falls into it, and
    they throw fire over him until he burns up.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the land-otter-man episode, the men wriggle from side to side and act
    as if crazy; later visitors to the place act the same way.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: At Person-petrified, a woman and her child are said to have been lost, and
    the woman had killed a strange man who attacked her using a cedar-bark pole.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: People searching for murderers find a driftwood house, collapse part of its
    structure onto the occupants, kill those who try to escape, burn the house and
    its contents, and break up the occupants' canoe.
  category: sequence
  evidence_refs:
  - ev:11
