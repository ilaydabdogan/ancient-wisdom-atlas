canonical_text:
  quote: ''
  summary: The passage opens the Sitka English version of the Raven narrative. Raven
    is instructed by his father and given strength to make a world; he enters the
    household of a light-holder by becoming a tiny piece of dirt swallowed by the
    man's daughter, is born as her child, obtains the stars, moon, and daylight, tricks
    Petrel to reach a guarded spring, is blackened by smoke, and releases water from
    his mouth to form rivers and salmon creeks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven is first identified as Kit-kaˊositiyi-qā-yīt, the son of Kit-kaˊositiyi-qā,
    who instructs and trains him and says he will give him strength to make a world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At this point in the narrative there is no light in the world, and Raven is
    told that someone far up the Nass keeps light in a large house for himself.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven plans to become very small and drop into water as a small piece of dirt;
    the rich man's daughter swallows it and becomes pregnant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The child is born in a prepared hole after moss is placed inside it, and the
    child's eyes are described as very bright and moving rapidly.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Round bundles of different shapes and sizes hang on the house walls, and the
    child cries while pointing to them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The grandfather gives the child the bag of stars; the child plays with it
    and lets it go through the smoke hole, after which the stars scatter into the
    sky.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The grandfather gives the child the next bundle; the child lets it go through
    the smoke hole, and the big moon appears.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The last remaining object is the box that holds daylight; the child receives
    it, utters the raven cry, and flies out through the smoke hole with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The owner of the objects says that Raven has gotten all of his things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Raven seeks Petrel's everlasting spring because there is no water to drink
    in the world; Petrel keeps the spring covered and sleeps by it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Raven places dog manure on Petrel while he sleeps, tells him he has defecated
    on his clothes, and uses Petrel's departure to uncover the spring and drink nearly
    all the water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Petrel calls on smoke-hole spirits to catch Raven, then burns pitchwood beneath
    him so that smoke turns Raven from white to his present color.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Raven keeps the water and later lets water fall or spits it from his mouth,
    making the Nass, Stikine, Taku, Chilkat, Alsek, other large rivers, and small
    salmon creeks.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
