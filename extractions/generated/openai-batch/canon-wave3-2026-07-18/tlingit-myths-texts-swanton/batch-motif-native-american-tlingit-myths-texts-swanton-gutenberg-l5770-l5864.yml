canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which a woman in fox form is
    killed, recognized by her bracelet and necklace, mourned with ritual fasting,
    and restored to human shape while manifesting named spirits. It then tells how
    Raven turns into a woman, claims high-status parentage, marries a killer whale,
    consumes the killer whales' food, murders her husband, establishes mourning rules
    under false pretenses, and secretly eats the body while planning further killings.
  language: English
