canonical_text:
  quote: ''
  summary: A mother-in-law claims supernatural credit for finding food while her son-in-law
    secretly catches the animals. She obtains shamanic-looking regalia and is believed
    by the village, but mistreats him. He warns his wife that ravens will signal harm
    and tells her what to do if he is found dead in his lucky skin. After catching
    two whales, he dies when the raven calls. The wife identifies the strange monster
    body as her husband and publicly accuses her mother of pretending to have spirits.
  language: English
  quote_policy: summarized
