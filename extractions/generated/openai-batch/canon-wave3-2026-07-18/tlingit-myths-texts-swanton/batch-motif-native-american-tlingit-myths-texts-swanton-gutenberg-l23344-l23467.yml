canonical_text:
  quote: ''
  summary: 'Footnote material identifies one origin note and several song notes: a
    marriage return song involving Other-water and Sǃēłtîˊn, a self-lament about dying
    without seeing Dᴀqʟǃaweˊdî’s children, a praise song connected with gold at Juneau,
    two angry songs against Little Raven, and a Gold Creek song involving punishment,
    lying, and requests for pity.'
  language: English with transcribed Tlingit/Tsimshian song lines
  quote_policy: summarized
