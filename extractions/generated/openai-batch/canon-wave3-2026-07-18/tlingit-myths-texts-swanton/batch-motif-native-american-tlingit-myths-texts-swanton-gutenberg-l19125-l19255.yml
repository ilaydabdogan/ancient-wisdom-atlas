canonical_text:
  quote: ''
  summary: The passage describes people setting out in canoes to bring tree timbers
    for a large house, preparing and distributing tobacco balls in a ceremonial context,
    wearing clan emblems and hats, carving posts, completing and naming Wolf House,
    inviting named groups as guests, and receiving them with drums, dancing, songs,
    water-entry, blankets, and a speech by the house owner.
  language: English with Tlingit transliteration and interlinear glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All the people set off in the morning, and ten canoes went to the tree place
    to bring down timbers for a large house while the opposite phratry paddled across
    singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people stayed one night on the beach near the town, and those towing the
    tree were invited.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mortars were brought out near the door; leaf tobacco was chewed, liquid was
    poured over it, powdered shell was added, and round balls of tobacco were named
    and given.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the tobacco pipe was not known in this setting.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: When people went out, names were called and balls were given to the opposite
    people, identified parenthetically as Eagles; those who chewed the leaf tobacco
    were the ones who were going to dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The house was filled, and some participants wore emblems, including raven
    hats and whale hats.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The opposite people told them to build the house; posts were carved, including
    a wolf post, and the house was finished in one year and named Wolf House.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the house was completed, a man went to Chilkat, Sitka, and Killisnoo
    to invite the G̣ānᴀxteˊdî, Kîksᴀˊdî, Dēˊcitān, and Tǃᴀˊqǃdentān into the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage explains that mutual inviting between people has continued since
    then.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Guests came out to look at the new house; drums made continual loud noise;
    after one night near the town, the guests came ashore quickly, dancing and singing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Inside the town, local people dressed to dance before the guests, went into
    the water wearing Chilkat and marten-skin blankets, and the owner of Wolf House
    made a speech.
  category: sequence
  evidence_refs:
  - ev:7
