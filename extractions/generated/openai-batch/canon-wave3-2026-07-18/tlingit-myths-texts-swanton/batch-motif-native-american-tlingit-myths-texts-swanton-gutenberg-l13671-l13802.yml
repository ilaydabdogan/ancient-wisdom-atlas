canonical_text:
  quote: ''
  summary: A helper-aided man gains abundance, favors a woman who helped him, withholds
    satisfaction from his uncle and hostile uncle's wife so that they die, marries
    the helpful woman, trades helper-obtained food, and hides the helper in a little
    box. Later he sends the helper against a whale, forgets it while people work on
    the whale, and the people are destroyed; killed things return to life and run
    into water and woods. The next tale is introduced by a title about a shaman entering
    fire and Heron's son, then begins with a little boy, his absent friends, and his
    hunter uncle.
  language: English with Tlingit transcription and interlinear gloss
  quote_policy: summarized
