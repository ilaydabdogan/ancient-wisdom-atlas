canonical_text:
  quote: ''
  summary: A slave or fleeing man raises an alarm that a woman has been taken; the
    chief discovers his wife is gone, and the man is seen entering a shark fort. Shark
    people prepare for war, a halibut hook reassures Gᴀmnāˊtckǃî that killer whales
    are coming, and the moving fort decapitates attacking killer whales. The shark
    people advise Gᴀmnāˊtckǃî to stay until danger has passed, then direct him home,
    where he arrives safely.
