canonical_text:
  quote: ''
  summary: The passage first closes an episode in which a brother is sought, saved
    by Wolf people, not found, and the group returns home. It then narrates a journey
    with Heavy-wings toward Auk. A storm and the angered north wind delay the party,
    their food supply dwindles, and Heavy-wings twice dreams of a man identified as
    North Wind or North Man, who demands Heavy-wings' daughter in exchange for seeing
    the destination. Heavy-wings initially doubts the dream, while his wife urges
    belief; after the second dream he orders a nephew to announce that the daughter
    is given.
  language: English with Tlingit interlinear/glosses
  quote_policy: summarized
