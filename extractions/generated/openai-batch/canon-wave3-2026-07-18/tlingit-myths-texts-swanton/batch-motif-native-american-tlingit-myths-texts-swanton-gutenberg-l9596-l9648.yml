canonical_text:
  quote: ''
  summary: In story 46, a Kîksᴀˊdî man survives a canoe wreck near Sitka, is carried
    away by land otters to Rainy-village, meets a drowned aunt married to two land
    otters, is escorted back near Sitka, captured and partially restored by townspeople
    using dog bones, but remains altered in diet and dies after eating cooked halibut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A canoe from Sitka upset, and all aboard drowned except a man of the Kîksᴀˊdî.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The survivor mistook an arriving canoe for one containing his friends, but
    it contained land otters who took him south, collected female land otters at stopping
    places, covered him with a kelp mat, and brought him to Rainy-village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Rainy-village the man met an aunt who had drowned years before and had
    become the wife of two land otters; she said her husbands would save him and that
    she herself could not leave.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The aunt’s land-otter husbands brought the man back in a skate-canoe and turned
    it over him when ashore so he could not get out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The aunt told her husbands not to leave the man where he could be captured
    again and to take him to a good place; they left him close to Sitka.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After his return, the man disturbed people near the town at night, and they
    tried to capture him with a rope, eventually adding dog bones because dog bones
    are described as enemies of land otters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The people captured the land-otter-man after the dog bones tore his hands,
    found him wild, and restored his reason by cutting his head with dog bones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Afterward the man always ate raw meat and fish, was a good halibut fisher,
    resisted eating cooked halibut, and died after finally eating it.
  category: attribute
  evidence_refs:
  - ev:8
