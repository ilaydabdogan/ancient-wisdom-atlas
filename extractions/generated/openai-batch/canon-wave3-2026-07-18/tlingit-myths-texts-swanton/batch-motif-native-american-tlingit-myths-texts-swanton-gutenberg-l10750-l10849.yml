canonical_text:
  quote: ''
  summary: The passage ends a prior episode in which a mother is convinced by a piece
    of a boy's brother's shirt and people gather. In “The Boy and the Giant,” a young
    hunter meets a tree-tall giant, travels in the giant's shirt, encounters a small
    bird that makes him heavy, camps at a beaver lake, helps defeat a larger giant
    with a beaver-skeleton club, and finally returns home by following the direction
    indicated by a falling trimmed tree. The opening of “The Boy with Arrows on His
    Head” describes Wᴀtsǃîhîˊtcî, a child with sharp arrow points on his head who
    kills his mother and becomes a killer in the woods, while his maternal uncle prepares
    defenses.
  language: English
  quote_policy: summarized
