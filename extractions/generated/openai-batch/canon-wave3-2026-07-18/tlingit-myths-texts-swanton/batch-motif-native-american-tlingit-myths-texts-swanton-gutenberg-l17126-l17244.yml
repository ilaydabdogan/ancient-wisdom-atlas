canonical_text:
  quote: ''
  summary: A woman tells the protagonist that the salmon people will start home with
    him. The salmon people travel with him, pass through a feared closing sīt that
    cuts some salmon, meet canoes of herring people, and speak about their food value.
    The salmon gather and name rivers they are going to. At the river mouth they look
    for the 'fort,' explained as a salmon trap. The salmon enter the creek and surround
    the trap. The protagonist, Lively-frog-in-pond, is seen as a salmon by his mother;
    she calls his father, who spears him. When she tries to cut the salmon, she discovers
    the copper ring formerly around her son's neck and says he must have been captured
    by the salmon people. She places feathers around the salmon inside a mat, puts
    the mat on the house, and shaman songs are sung for him.
  language: English with Tlingit interlinear text
  quote_policy: summarized
