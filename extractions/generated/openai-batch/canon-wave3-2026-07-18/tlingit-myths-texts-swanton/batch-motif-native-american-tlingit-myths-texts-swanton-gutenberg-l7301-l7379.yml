canonical_text:
  quote: ''
  summary: Black-skin reveals his strength and high-status identity, kills the sea
    lion that had killed his uncle, and is abandoned by his companions. A black duck
    carries him to the house of the sea lions, where sea lions appear as human-like
    people. Black-skin heals a sea-lion child by removing a hidden spear point and
    receives a wind-bringing box. He uses the box to return ashore and stores it carefully
    on a tree limb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Black-skin puts on a hair ornament and shirt, identifies himself as the one
    who pulled out a limb and twisted a tree, and speaks in a high-caste manner while
    others listen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Black-skin orders the canoe closer to shore and walks forward in it, breaking
    seats and throwing young men aside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people fear that Black-skin will revenge himself on them, but he jumps
    ashore and goes up the cliff where his uncle had gone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Black-skin kills many sea lions, focuses on the large one that had killed
    his uncle, tears it in two, and loads the canoe with sea-lion bodies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Black-skin's companions become ashamed and frightened, paddle away without
    him, and later tell the town that he had pulled out the limb and twisted the tree.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:6
  text: Black-skin dries sea-lion intestines, lacks anything to make fire with, and
    lies down to sleep with his head covered by his blanket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A black duck says it has been sent after Black-skin and tells him to get on
    its back with his eyes closed; after he obeys, he opens his eyes in a fine house.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The fine house is identified as the house of the sea lions, and the narrator
    says the story is used to explain that everything is like a human being and has
    its own way of living.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief's elder wife mourns for her husband and nephew, villagers retrieve
    the husband's body but do not find Black-skin, and shamans say Black-skin is not
    dead and will be seen again.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Black-skin stays among the sea lions; they look to him like human beings,
    though he knows who they really are.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Black-skin sees that a crying sea-lion boy has a barbed spear point in his
    side, denies being a shaman, and removes it, releasing blood and matter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Because the young sea lion belongs to high-caste people, the sea-lion people
