canonical_text:
  quote: ''
  summary: A sequence of Tlingit song notes and translations includes mourning songs
    for drowned or dead kin, imagined locations of the dead such as a spirits’ cave
    and the sun’s trail or sun-world houses, a wordless spirit song connected with
    sending food through fire, a post-missionary prayer to Almighty God, peace songs
    after war, and a ritual performance by a Hummingbird Deer singer.
  language: English with Tlingit transcriptions
  quote_policy: summarized
