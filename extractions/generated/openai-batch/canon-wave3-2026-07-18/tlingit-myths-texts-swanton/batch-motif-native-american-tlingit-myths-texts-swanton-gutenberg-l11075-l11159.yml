candidate_motifs:
- id: motif:1
  label: Aquatic combat against a shelled adversary
  taxonomy_refs: []
  basis: The hīn-taỵīˊcî faces the big crab, identifies the shelled opponent as dangerous,
    cuts off one claw, and is killed by the crab's remaining claw.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family directly names this aquatic combat pattern.
- id: motif:2
  label: Victory procession with enemy body and song
  taxonomy_refs: []
  basis: After the crab kills the hīn-taỵīˊcî, the body is placed on the chief killer
    whale and the crab and killer whales sing as they depart.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports the procession and song but does not explain their
    ritual or social meaning.
- id: motif:3
  label: Rival wind wives and loss of frost clothing in warmth
  taxonomy_refs:
  - seasonal_cycle
  basis: North-wind's daughter is beautiful because of icicle and frost clothing,
    which she loses when it grows cloudy and warm after East-wind's daughter's jealous
    declaration.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The seasonal_cycle reference is functional because frost disappears in
    warmth; the passage does not explicitly describe a recurring annual cycle.
- id: motif:4
  label: Animal-dwelling destruction followed by drowning retribution
  taxonomy_refs: []
  basis: People drain the beaver lake and kill the beavers; afterward they hear a
    song at the broken dam, drown on the way home, and missing bodies are said to
    be captured by the big beaver.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The causal role of the big beaver is stated for the missing bodies, while
    the exact mechanism of the drowning is not fully described.
- id: motif:5
  label: Warning or consequence song before deaths
  taxonomy_refs: []
  basis: A woman sings at the broken dam, and the passage explains that she sings
    because those who destroyed the beavers are to die.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage connects the song with the expected deaths but does not identify
    the woman or specify whether the song causes the deaths.
- id: motif:6
  label: Reciprocal animal trickery by stranding a companion
  taxonomy_refs:
  - trickster_boundary
  basis: Beaver strands Porcupine on a lake stump, and Porcupine later strands Beaver
    at the top of a very high tree.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The trickster_boundary reference is based on reciprocal deception and
    difficult crossings; the passage does not call either animal a trickster.
- id: motif:7
  label: Song transforms water into ice for escape
  taxonomy_refs: []
  basis: Porcupine sings for the lake to become frozen, after which the surface freezes
    and he walks home across it.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain the power or source of the song beyond the
    narrated result.
- id: motif:8
  label: Etiological explanation of tree-bark appearance
  taxonomy_refs: []
  basis: After Beaver climbs down from the high tree, the text says this is what gives
    tree bark its broken appearance.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available motif-family taxonomy item specifically covers etiological
    animal explanations of natural features.
