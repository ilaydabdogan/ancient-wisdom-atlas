canonical_text:
  quote: ''
  summary: The range contains the conclusion of an aquatic combat episode involving
    killer whales, a big crab, and hīn-taỵīˊcî; a tale in which East-wind's daughter
    causes North-wind's daughter to lose frost-and-icicle clothing; a tale in which
    people drain a beaver lake and are later drowned after a big beaver escapes; and
    a tale in which Beaver and Porcupine alternately strand one another, including
    Porcupine's sung freezing of a lake and an explanation of tree bark's broken appearance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Watching people see killer whales approach with a big crab ahead of them;
    the crab's body is underwater, its legs protrude, and the water appears to boil
    as it swims.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hīn-taỵīˊcî comes out, tells the shaman that it expects to be defeated
    by the shelled person, returns to its hole, and is blocked in by the crab at the
    opening.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After asking the crab to stand aside, the hīn-taỵīˊcî cuts off one of the
    crab's claws at a joint, but the crab seizes it with the remaining claw, lifts
    it into the air, and kills it in sight of everyone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The crab places the body on the back of the chief killer whale, and the crab
    and killer whales sing together while leaving close to the water's surface.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A high-caste man marries East-wind's daughter, later leaves her for North-wind's
    daughter, and brings the second wife back to the village of the first wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: East-wind's daughter becomes jealous after hearing that North-wind's daughter
    is beautiful and richly clothed; when the weather becomes cloudy and warm, North-wind's
    daughter loses the icicles and frost that make up her beautiful clothing and beauty.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: People find a forest lake with many beaver houses, dig a trench to drain it,
    break up the houses, and kill beavers swimming down the trench, except for one
    very large beaver that escapes into the woods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people who killed the beavers later hear a woman singing on part of the
    broken dam; on the way back to their village they are drowned, and those whose
    bodies are not found are said to have been captured by the big beaver.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Beaver and Porcupine are described as great friends; Beaver dislikes Porcupine
    visiting his house because Porcupine leaves quills there.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Beaver carries Porcupine on his back but takes him to a stump in the middle
    of the lake, calls it his house, leaves him there, and goes ashore.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Porcupine sings for the lake to become frozen so he can cross to Wolverine-man's
    place; the lake freezes and he walks home on the ice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Later Porcupine carries Beaver on his back to the top of a very high tree
    and leaves him; Beaver finally climbs down, and this is said to account for the
    broken appearance of tree bark.
  category: sequence
  evidence_refs:
  - ev:8
