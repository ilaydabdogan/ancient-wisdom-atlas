canonical_text:
  quote: ''
  summary: 'The passage explains Kᴀkaˊ’s spirits and the origin of belief in shamans’
    spirits and land-otter-men, then recounts Raven’s actions at Taku and Chilkat:
    living with the North Wind in a cliff, imposing river naming rules, surviving
    a killer-whale sweat-house ordeal, teaching Chilkat storehouses, salmon preservation,
    and tobacco preparation. A following episode at Łᴀxaỵîˊk tells how ᴀyāˊỵî’s wife
    discovers severed hands in his box, returns to a murdered village, and her children
    make the first skin canoe from human bodies, using human hair and song.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Birds gathered around Kᴀkaˊ at sea, the wind and waves that upset him, and
    strange things seen when land otters possessed him are identified as his spirits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sea birds sitting on floating logs are described as shamans’ spirits, according
    to what people learned from Kᴀkaˊ.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says belief in land-otter-men among several Alaskan peoples and
    Tlingit belief in shamans’ spirits derive from Kᴀkaˊ’s experience.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Raven lived with the North Wind at a cliff at the mouth of Taku inlet, and
    people avoided speaking against the North Wind because it had spirits or power.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Large cliffs on islands were formerly thought to contain spirits and were
    prayed to because Raven had once lived in the cliff with the North Wind.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven told people not to use the right names of sea animals while among the
    rivers he had created, instructing them to use substitute names to avoid misfortune
    among rapids.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Chilkat, the chief of the killer whales tried to roast Raven in a sweat
