  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Raven’s survival in the sweat house is given as the reason the G̣ānᴀxteˊdî
    claim the raven as an emblem.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Raven revealed the existence of Athapascan Indians to the Chilkat people and
    taught them secret storehouses for keeping salmon frozen over winter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Raven showed the Chilkat people the first seeds of Indian tobacco and taught
    them how to plant, dry, and prepare it with roasted clam shells.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: ᴀyāˊỵî’s wife found a long box full of severed hands and recognized from tattoo
    marks that the hands belonged to her uncles.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After returning near her father’s town, the wife found the village empty except
