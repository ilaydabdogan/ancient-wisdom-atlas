- id: motif:7
  label: ritual imitation of an original solitary performer
  taxonomy_refs:
  - initiation
  basis: The song says the first performer is alone with nobody after him, and the
    passage says later Łuqana are not like him but only imitate him.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The motif is based on the passage's explicit contrast between originator
    and imitators.
- id: motif:8
  label: regional transmission of ritual practice
  taxonomy_refs: []
  basis: The passage says people toward Victoria learned from the boy first, that
    Alaskans have had Łuqana only lately, and that performances use Tsimshian and
    Athapascan dances depending on region.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This is an ethnographic-historical pattern within the passage, not a mythic
    episode by itself.
