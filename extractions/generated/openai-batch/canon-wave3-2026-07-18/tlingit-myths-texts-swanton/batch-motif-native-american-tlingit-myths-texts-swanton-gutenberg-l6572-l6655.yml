canonical_text:
  quote: ''
  summary: A low-status-seeming suitor named Man-that-eats-the-leavings recovers a
    forgotten ancestral copper canoe and creates a splendid copper-lined house, then
    marries a chief's daughter without her father's consent. Her family first prepares
    violence but accepts compensation and gives return gifts. Their son later becomes
    a great hunter, falls from a mountain, receives the Wolf Spirit in an encounter
    with spirit beings, and becomes the first Łuqana, associated with secret society
    initiation and later regional practices. The passage ends by introducing his arrival
    in the Queen Charlotte Islands and a report of dangerous wizards.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Man-that-eats-the-leavings lived in a brush house at a garbage place, but
    he was described as a fine shot.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: He shot a loon on a lake; when struck, it sounded like a bell, came to shore,
    and was found to be a copper canoe identified as his grandfather's forgotten grizzly-bear
    canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: He found and shook a painted house front, after which a grand house appeared,
    and he lined the house interior with copper plates made from the copper canoe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: He married the chief's daughter without her father's consent and took her
    to his house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The chief's daughter was searched for in other places, but not at first in
    the old brush house; when she was seen entering it, her family prepared spears
    to kill her husband.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The girl's mother entered the house, found it shining and filled with fine
    things, confirmed that her daughter was married, put out the fire, and sat in
    the ashes as a customary sign that she wanted property.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The son-in-law gave the mother eight bright copper plates; later the chief
    gave him eight slaves, one for each copper plate received by the chief's wife.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:8
  text: The narrative states that, when a girl runs away with someone and her people
    find he is acceptable, they do all they can for her.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: The chief's daughter's son became a smart great hunter and one time fell from
    the top of a mountain, lost consciousness, and woke to see many men standing in
    a circle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The men wore cedar-bark rings around their heads and necks and asked whether
    he wanted the Raven Spirit or the Wolf Spirit; he chose the Wolf Spirit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: White rocks were held over the youth's head, he became unconscious, and the
    passage says this is how he got the spirit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Afterward he ran screaming, naked except for an apron, while Cliff Spirits
    and Forest Spirits sang and pounded sticks, and his hair was tied like wolf's
    ears.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage identifies this as the origin of the Łuqana secret societies and
    says the first society he started was the Dog-eaters' society.
  category: other
  evidence_refs:
  - ev:5
- id: obs:14
  text: A song attributed to him is described as used by high-caste persons during
    initiation, and later Łuqana are said to imitate him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage describes multiple kinds of Łuqana, arranged injury performances,
    damage payments by the father, appearances at feasts, high-caste attendance, and
    regional links with Victoria, Tsimshian, Athapascan, and Alaskan Tlingit practice.
  category: other
  evidence_refs:
  - ev:6
- id: obs:16
  text: After returning from the woods and showing his people about the Łuqana, the
    youth went to the Queen Charlotte Islands, where people told him about wizards
    who killed men secretly.
  category: sequence
  evidence_refs:
  - ev:7
