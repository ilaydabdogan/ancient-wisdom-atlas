- id: motif:2
  label: ritualized compensation after unauthorized marriage
  taxonomy_refs:
  - sacred_exchange
  basis: The girl's mother performs a customary ashes act meaning she wants property,
    receives eight copper plates, and the chief reciprocates with eight slaves at
    a feast.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage describes a social custom and exchange; the word 'sacred'
