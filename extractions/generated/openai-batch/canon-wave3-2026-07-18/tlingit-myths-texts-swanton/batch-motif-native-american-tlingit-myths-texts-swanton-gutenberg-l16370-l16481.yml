  quote: ''
  summary: A bilingual Tlingit-English passage describes Lively-frog informing the
    salmon tribe, a confrontation and exchange of taunts between salmon and herring
    tribes, the salmon people choosing creeks and naming places, and humans preparing
    sharpened poles at a creek mouth for salmon to jump on, resulting in the first
    successful kill in that scene.
  language: English with Tlingit transcription
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that something leaves scars on the skin of salmon, and
    that Lively-frog let the salmon tribe know how people or beings act toward each
    other.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The salmon tribe traveled up the coast and came against the herring tribe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A member of the salmon tribe stood up in a canoe and challenged the herring
    tribe by asking when their cheek-flesh had ever filled a man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The herring tribe replied that they had fed humans before the salmon, identified
    their eggs as their cheek-flesh, and taunted the salmon about the dirty space
    around their backbone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The salmon tribe moved toward the outside coasts; the salmon chief asked which
    creek they were going to, and the salmon people conferred and named their choices.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The humpbacks said they would go to Saliva creek, while one associated with
    a man named Dax̣ēˊt; the salmon people called that place Right-to-the-town.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the salmon people saw the creek mouth, they named a point Floating point
    and perceived the smoke-house there as a fort.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The salmon called human beings “seal-child’s dog salmon.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the creek mouth, people sharpened pointed poles so salmon would fall on
    them when they jumped.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Boys repeatedly said a formula translated as “Upon my father’s”; then one
    salmon jumped on a pole, where previously none had been killed, and the people
    were very happy.
  category: sequence
  evidence_refs:
  - ev:5
