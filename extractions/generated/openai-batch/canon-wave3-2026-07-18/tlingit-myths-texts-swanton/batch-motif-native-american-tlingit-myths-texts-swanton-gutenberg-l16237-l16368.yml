canonical_text:
  quote: It was Lively-frog-in-pond that let people know what the salmon people do
    to one another.
  summary: A boy associated with the names Moldy-end and Lively-frog-in-pond eats
    heaped eggs and is named; he later reports instructions involving a canoe, Amusement
    Creek, and sand-hill cranes. The salmon people recognize salmon month and return
    upstream with him. The passage explains cohoes coming last, the cohoes emblem
    and slowness of the ʟǃūkǃnᴀxᴀˊdî, and scars on salmon through the sīt and through
    salmon people throwing hot rocks at one another. The boy discloses these practices
    to people.
  language: Tlingit with English interlinear and prose translation
  quote_policy: quoted
