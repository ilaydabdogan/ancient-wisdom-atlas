candidate_motifs:
- id: motif:1
  label: Etiological origin of feast customs
  taxonomy_refs:
  - culture_hero
  basis: Raven's feast behavior is repeatedly presented as the reason later people
    meet guests with weapons, have relations serve, follow dance and song order, and
    distribute property in feast contexts.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy label is broad; the passage specifically concerns ceremonial
    feast etiquette rather than all culture-hero acts.
- id: motif:2
  label: Ceremonial exchange and property distribution
  taxonomy_refs:
  - sacred_exchange
  basis: The feast culminates in distribution of Raven's property, with earlier inviters
    and leading chiefs receiving most of it, within a formal dance and guest-host
    setting.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage describes a feast exchange, but does not explicitly frame
    the property distribution as sacred.
- id: motif:3
  label: Form-changing survivor of death traps
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Raven survives a falling tree because he is made of rock, breaks a closing
    canoe, and changes into rock inside a covered heated kettle.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not use the word trickster here; that label is inferred
    only from Raven's boundary-crossing survival behavior and should be reviewed.
- id: motif:4
  label: Angry supernatural flood and survival at heights
  taxonomy_refs:
  - flood_and_renewal
  basis: Nās-cᴀˊkî-yēł commands world rain and starvation; water rises through the
    world-house and up the mountains, while people climb hills and Raven and his mother
    survive by moving upward and taking bird skins.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage includes flood rise and recession, but this excerpt does not
    narrate a full repopulation or renewal sequence.
- id: motif:5
  label: Ascent to sky followed by descent beneath the ocean
  taxonomy_refs:
  - ascent
  - hero_descent
  basis: Raven flies to the highest cloud and hangs there, then later uses a shark's
    stick as a ladder to descend under the ocean.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage presents spatial ascent and descent but does not state an
    initiatory or afterlife purpose.
- id: motif:6
  label: Food taboo origin from transformed kin
  taxonomy_refs:
  - culture_hero
  basis: The passage explains that Tlingit do not eat cāx because Raven's mother entered
    or became associated with the cāx during the flood.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No specific available taxonomy reference for food taboo is supplied; culture_hero
    is used only because the taboo is explained through Raven's narrative.
- id: motif:7
  label: Removal of a guarded box and release of contained beings
  taxonomy_refs:
  - sacred_theft
  basis: Raven takes down the box containing his mother from Nās-cᴀˊkî-yēł's house
    and liberates flickers kept under her arms; Nās-cᴀˊkî-yēł laments that his pretty
    things are gone.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage shows removal and release from another's house, but the exact
    status as theft or sacred theft is not explicitly stated.
