canonical_text:
  quote: This house we are talking of, although it looked like a house to them, was
    really part of the world.
  summary: The passage explains feast customs through Raven's behavior, describes
    Raven's feast at Alsek, and then narrates his return to Nās-cᴀˊkî-yēł's house,
    rescue of his mother from a box, release of flickers, survival of repeated attempts
    to kill him, a world-covering rain and flood caused by Nās-cᴀˊkî-yēł, Raven and
    his mother's bird-skin survival, Raven's hanging from a sky cloud, and his later
    descent beneath the ocean using a shark's stick as a ladder.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage says present-day feast etiquette is explained by Raven's delayed
    attendance and by the host's need not to favor one guest over the opposite party.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven gives a feast at Alsek river, where his house is identified with a rock
    hollowed like a cave containing other rocks; people would pray to it when they
    saw it.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Raven meets arriving guests with bow and arrows, has his relations wash and
    serve them, prepares chewing tobacco, and is said to have taught later people
    to act the same way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Raven builds a house frame of four uprights and two crosspieces, dances the
    first dance with his friends, and the passage describes funeral songs, masks,
    hats, emblem coats, and property distribution to earlier hosts and leading chiefs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Raven returns to his birthplace and finds the box that had held the sun, moon,
    and stars; it now contains his mother and hangs in Nās-cᴀˊkî-yēł's house.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Raven shoots a whale, observes sea birds on it, shoots a cāx bird and a large
    pretty bird with a copper-colored bill, and later liberates flickers kept under
    his mother's arms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nās-cᴀˊkî-yēł orders Raven to fell a tree, intending the tree to kill him,
    but the falling tree cannot kill Raven because he is made of rock.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nās-cᴀˊkî-yēł orders Raven to clean a canoe that closes on him; Raven extends
    his elbows, breaks the canoe, and smashes it for firewood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Raven is placed in a covered copper kettle filled with water and heated stones,
    but he changes himself into a rock and survives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nās-cᴀˊkî-yēł angrily commands rain over the world and starvation; storms
    prevent food gathering, canoes break, houses collapse, and his jointed dance hat
    pours water from its top.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: As water rises inside a house that is said to be really part of the world,
    Raven and his mother climb successive retaining timbers, while people of the world
    climb hills and mountains.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the water nearly fills the house, Raven's mother enters the cāx skin
