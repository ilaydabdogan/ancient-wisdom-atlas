canonical_text:
  quote: ''
  summary: A sequence of translated song texts and editorial notes addresses relations
    among named Tlingit groups. Speakers express troubled feelings, ask for friendliness,
    report attentive listening, promise not to reject Kāˊgwᴀntān’s children, mention
    Raven’s town and Wolf phratry value, describe Raven in relation to water, a paddle,
    and a Wolf phratry canoe, and say the Wolf phratry wants to enter a fort to sleep
    while Kāˊgwᴀntān’s children become like Raven among the Wolf phratry.
  language: English with Tlingit transcription
  quote_policy: summarized
