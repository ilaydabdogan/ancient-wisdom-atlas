comparison_claims:
- id: claim:1
  claim: 'The passage explicitly uses the devilfish-captive woman story as a functional
    analogy for the addressee’s mourning condition: he is treated as if captured under
    the rock and then ritually recovered, clothed, fed, and warmed by his father’s
    people.'
  claim_level: same_function
  target: devilfish-captive under-rock episode applied to the ritual addressee
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is intrapassage and ceremonial; it does not prove a
    literal equivalence between the woman’s episode and the addressee’s experience.
- id: claim:2
  claim: 'The passage explicitly compares the addressee’s situation to Duktū́ʟǃ’s
    abandonment and rescue: the addressee’s uncles and people are said to have left
    him on the sea-lion island, while his father’s people give Halibut house as the
    sea lions gave Duktū́ʟǃ the box.'
  claim_level: same_function
  target: Duktū́ʟǃ abandoned-on-sea-lion-island and helped-to-return episode applied
    to the ritual addressee
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is explicitly made by the speaker but functions as ritual
    analogy, not as a statement that the events literally happened to the addressee.
- id: claim:3
  claim: Duktū́ʟǃ’s bathing, summons by Strength, wrestling ordeal, and acquisition
    of power support comparison to an initiation pattern centered on ordeal and empowerment.
  claim_level: same_motif
  target: initiation motif family
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage describes an empowerment ordeal but does not itself label
    the episode as initiation.
- id: claim:4
  claim: Duktū́ʟǃ’s island abandonment, animal-people assistance, return to shore,
    and succession to his uncle’s place support comparison to a return pattern after
    isolation.
  claim_level: same_motif
  target: return motif family
