canonical_text:
  quote: ''
  summary: The passage contains Tlingit lines and English ceremonial speeches. A chief
    recounts a story of a high-caste woman captured by devilfishes and found under
    a rock, then applies it to an addressee in mourning as if he had been cold under
    the sea and now warmed and restored by his father’s people. Another chief recounts
    Duktū́ʟǃ, who secretly bathes for strength, wrestles a personified Strength, gains
    power, is abandoned on a sea-lion island, receives a box from sea-lion people,
    returns, and takes his uncle’s place; this story is likewise applied to the addressee,
    who receives strength and Halibut house from his father’s people.
  language: Tlingit and English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening Tlingit gloss says the speaker’s aunts gave him a frog cane and
    a devil’s-club comb, and the speaker says his mind is as if he had been saved.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opening speaker refers to grandfathers’ emblems as two and cliff-like,
    and says he will be saved behind them; he also refers to dead fathers who came
    ashore and to going down to them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief of the Tī hît tān recounts that a young high-caste woman in the
    Tsimshian country was captured by a devilfish and became lost to her people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people searched for the missing woman and could not find her; later young
    devilfish appeared on the doorstep, were thrown down to the beach, returned, and
    climbed into the chief’s lap.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman’s father concluded that his daughter had been captured by devilfish,
    gave food to the devilfishes, and had the leftovers and trays carried to the devilfish
    rock, where he learned his daughter was under the rock.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Tī hît tān speaker applies the devilfish story to the addressee, saying
    it was as if he had been captured by devilfishes and that his father’s people
    have come to ask him to eat with them from under the rock.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same speaker says the addressee’s wet sea-water clothing, which he cannot
    see, will be removed; clothing from skins belonging to his father’s people will
    be given; and a great fire will be made to warm him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In reply, the chief says he has been captured by devilfishes and by trouble,
    has been cold under the rock, and has been in a condition like the tide coming
    over him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief thanks the speakers for saving him from the place where the tide
    came over him and says the fire and the warm words spoken for him will keep him
    warm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chief of the Qā́tcᴀdî recounts that G̣ᴀłwḗtǃ bathed for strength every
    morning and that his nephew Duktū́ʟǃ secretly bathed for strength while proud
    villagers made fun of him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Duktū́ʟǃ hears the voice of his Strength while bathing, goes to it, wrestles
    the little man called Strength, is thrown down the first time, and after a second
    wrestling is declared sufficiently strong.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After receiving strength, Duktū́ʟǃ pulls out a limb, twists a tree to its
    roots, then restores the limb and untwists the tree, causing the proud people
    to be ashamed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Duktū́ʟǃ is left on the sea-lion island by the proud people, but the sea-lion
    people help him by giving him a box with which to get ashore.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Using the box, Duktū́ʟǃ reaches his uncle’s village, takes his uncle’s place,
    and owns the whole village.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Qā́tcᴀdî speaker applies the Duktū́ʟǃ story to the addressee, saying his
    dead father’s people came from the woods, gave him strength, and gave him Halibut
    house as the sea lions gave the box to Duktū́ʟǃ.
  category: speech
  evidence_refs:
  - ev:7
