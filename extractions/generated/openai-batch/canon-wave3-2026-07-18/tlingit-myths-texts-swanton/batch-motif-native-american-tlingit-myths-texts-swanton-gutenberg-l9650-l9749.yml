canonical_text:
  quote: ''
  summary: The passage begins with a footnote stating that supernatural beings died
    after hearing a raven call before reaching land. The main tale tells of Dātg̣āˊs,
    nephew of a chief at Chilkoot, who during a famine receives food from above after
    an unseen voice repeatedly tells him to stretch out his blanket under the smoke
    hole. Small portions of salmon, grease, berries, cranberries, venison, and soapberries
    fill empty storage boxes. The next morning he calls back hungry people whom the
    chief cannot feed and distributes the newly filled stores in a public meal.
  language: English
  quote_policy: summarized
