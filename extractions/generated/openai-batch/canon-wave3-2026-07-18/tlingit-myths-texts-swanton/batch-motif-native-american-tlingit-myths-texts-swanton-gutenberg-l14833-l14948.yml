canonical_text:
  quote: ''
  summary: Two sisters escape from their mother by placing dishes in their beds and
    digging a hole underneath. They flee into the woods, discuss their mother and
    Mountain Dweller, and come to a mouse's hill-house. A grandmotherly host feeds
    them with food taken from between her teeth, questions them, and instructs them
    how to pass fighting dogs, floating kelps, and Crushing-mountain. Using provided
    or named items, the sisters pass the obstacles and reach a camp house door.
  language: English with Tlingit interlinear text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother tells the sisters to get up, but the long dishes move because the
    sisters had put dishes in their places and dug a hole underneath to leave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the escape, the mother comes out; no one knows where the sisters have
    gone; people rush to hunt for them, and the sisters hide.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger sister repeatedly wants to make noise for their mother, but the
    elder sister refuses and refers to their mother's words about Mountain Dweller
    marrying both of them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sisters go far up into the woods, wander aimlessly crying, and the younger
    sister wants to go back, while the elder sister does not want her mother to see
    her there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sisters see a small mouse run across a log and into a little hill; the
    younger sister addresses it as grandmother mouse and says people have seen it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The little mouse asks to be put quickly across the log and says its grandmother
    says to call the sisters into the house; then a door opens and the sisters enter
    and sit down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The host takes dried fish and a cranberry from between her teeth; the dried
    fish becomes a spring salmon, and the sisters eat the food set before them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When asked why they came, the elder sister says her mother said they could
    not marry Mountain Dweller; the host says he is very difficult to get near.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The host tells the sisters about Crushing-mountain, fighting dogs, and kelps
    floating together, and tells them to take a knife and whetstone.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sisters throw dried fish bone to the fighting dogs, moss between the kelps,
    and a whetstone between Crushing-mountain; after passing through, they see the
    camp and come to the house door.
  category: sequence
  evidence_refs:
  - ev:7
