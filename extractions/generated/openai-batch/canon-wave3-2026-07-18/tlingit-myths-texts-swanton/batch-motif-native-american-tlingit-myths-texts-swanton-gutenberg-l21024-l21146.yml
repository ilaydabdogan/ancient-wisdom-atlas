canonical_text:
  quote: ''
  summary: A man pursues an elusive woman at a digging place. His hands pass through
    her until he throws away his earrings and seizes the child on her back. She scratches
    his face. He wishes to become rich, but misspeaks by saying he should burst open
    with riches. In the woods the woman defecates; only foam and long white excrement
    are seen. He stores the foam, his facial scabs are named as a body-rubbing medicine,
    and his possessions multiply so that he becomes rich. Later, on a journey toward
    Yakutat, a pile of his property falls on him and a copper plate cuts open his
    stomach. His nephew Xᴀtgāwēˊt burns the body, gathers bones and property, and
    takes the bones to Yakutat. The nephew later has the same kind of encounter with
    the ʟǃêˊnᴀxx̣īˊdᴀq, handles her better, and becomes richer.
  language: English with Tlingit text and interlinear glosses
  quote_policy: summarized
