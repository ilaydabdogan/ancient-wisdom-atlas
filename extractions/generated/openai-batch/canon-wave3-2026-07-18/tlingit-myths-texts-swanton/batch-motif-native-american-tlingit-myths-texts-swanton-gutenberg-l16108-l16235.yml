canonical_text:
  quote: ''
  summary: A small boy later named Moldy-End complains after receiving a moldy-cornered
    piece of dried salmon. After following a reported sea gull in his snare, he runs
    into the water and is pulled down. The salmon people take him seaward to their
    home, where a salmon chief makes him his son and he stays for a year. In the salmon
    town he eats what he thinks are fish eggs without asking and is named Moldy-End.
    His salmon father later sends him to Amusement Creek, where sand-hill cranes and
    other noisy creatures are present and his bad feelings leave him.
  language: English with Tlingit interlinear text and glosses
  quote_policy: summarized
