canonical_text:
  quote: ''
  summary: Raven interacts with an old woman and Eagle during an extreme ebb tide
    that follows a flood, leaving sea animals available to saved people. Shamans had
    predicted the flood, and prepared people survived. Later Raven deceives Cᴀqǃᵘkǃᵘ
    with a false war alarm and steals boxes of grease. Raven then returns to Nass
    river and later advises warring parties about protective gear. A chief whose village
    is nearly defeated seeks an aged storyteller and receives counsel from Old-man-who-foresees-all-troubles-in-the-world
    about speaking well of enemies.
  language: English
  quote_policy: summarized
