- id: obs:3
  text: An old woman lives alone near the place where Dry-cloud can be seen, and she
    says a big fish killed all of her friends in the town.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fire-drill’s son finds a red cod, says it is good to eat, kills it with bow
    and arrows, removes its skin, and dries the skin with its sharp spines.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fire-drill’s son says the old woman is really Daughter-of-the-calm, marries
