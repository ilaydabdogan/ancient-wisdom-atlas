  text: Fire-drill’s son and his wolf friend go off together after Dry-cloud, despite
    the wolf’s warning that the strange being could take Fire-drill’s son’s life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wolf becomes exhausted during the pursuit, and Fire-drill’s son shakes
    the wolf’s wet tail for him after stream crossings.
  category: action
  evidence_refs:
