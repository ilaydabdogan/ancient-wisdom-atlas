canonical_text:
  quote: ''
  summary: Fire-drill’s son and his wolf companion pursue Dry-cloud, meet an old woman,
    and kill a red cod associated with the deaths of her friends. Fire-drill’s son
    marries the woman, revealed as Daughter-of-the-calm, and their son Łᴀkîtcîneˊ
    later kills his own children with red-cod spines and a stone. Łᴀkîtcîneˊ’s wife
    bears dog-born puppies who grow rapidly, appear in human form when their dog skins
    are set aside, and kill Łᴀkîtcîneˊ with the dog’s help. The grown boys then kill
    or pacify monsters across Alaska and make wolves less harmful.
  language: English
  quote_policy: summarized
