  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Łᴀkîtcîneˊ’s wife has a litter of puppies by the dog; five survive, grow very
    fast, and make noises that sound like children and then like human voices.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The female puppy watches at the door, and the puppies lie on the floor as
    if asleep when their mother comes to stop their noise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The wife makes a decoy with her digging stick, blanket, and hat while Łᴀkîtcîneˊ
    is halibut fishing, then hides and returns to the brush house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wife sees the boys playing in human forms with their dog skins lying nearby,
    grabs the skins, and throws them into the fire; the little dog outside remains
    in its original form.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When Łᴀkîtcîneˊ beats his wife, the children jump on him, fight him with the
    dog’s help, and kill him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After they grow up, the boys kill the monster at Kᴀg̣ēˊtǃ, travel through
