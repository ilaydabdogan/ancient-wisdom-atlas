canonical_text:
  quote: "“Shoot him in the middle of his hand. His heart is there.”"
  summary: A hostile named shaman lives in a cave, sleeps with his back to the fire,
    and has a spirit watching at his door. Unable to overcome him directly, a group
    gives their sister to him in marriage, later plots against him, pulls the sister
    into a canoe, and shoots at him while he pursues them wearing a red-snapper coat.
    The sister eventually reveals that her husband’s heart is in the middle of his
    hand; they kill him near Ring island, take off the coat, and the passage says
    they killed him for it. Afterward Łqǃayāˊkǃ puts on the coat, pursues large animals,
    and chases the named entity Kᴀckǃᴀˊʟkǃ from below far up into the sky, where footprints
    are identified as Łqǃayāˊkǃ’s.
  language: English with Tlingit interlinear text
  quote_policy: quoted
