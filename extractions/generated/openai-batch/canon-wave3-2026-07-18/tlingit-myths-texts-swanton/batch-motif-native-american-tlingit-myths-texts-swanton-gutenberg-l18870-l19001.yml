canonical_text:
  quote: ''
  summary: The passage recounts a Kāgwantān war episode involving a hidden wolf post,
    a dispute over its possession, an encounter with Island people traveling in two
    canoes, a shaman named Wolf-weasel with eight tongues, shamanic destruction of
    a canoe, spirit-assisted flight, and the shaman’s fall into a lake after a menstruant
    woman looks at him. The lake is said to remain red from his blood.
  language: Tlingit with English interlinear translation and English narrative prose
  quote_policy: summarized
