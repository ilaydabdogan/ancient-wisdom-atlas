canonical_text:
  quote: ''
  summary: The passage describes a Tlingit tobacco feast held after the death of a
    Nanỵaāˊỵî woman married into a Kasqǃagueˊdî family. The feast is for mourning
    rather than pleasure. A bereaved man delivers a speech saying the living guests
    are not the ones smoking the tobacco; long-dead kin smoke it. He says the woman
    is not dead but is held and greeted by relatives, and that a dead chief has returned
    to wipe away the mourners’ tears. A host replies that the speaker’s words are
    medicine that have cured the mourners. The dead woman is then addressed and told
    to get up from her husbands’ path. A closing note explains that the dead of both
    phratries are thought to smoke and share the feast while their living friends
    smoke, and that members of the opposite phratry care for the dead and are paid
    for this service.
  language: English with Tlingit text and interlinear glosses
  quote_policy: summarized
