canonical_text:
  quote: ''
  summary: 'A sequence of Raven episodes: Raven sees a man use a concealed animated
    club to retrieve a seal, steals it unsuccessfully, and breaks it; he tries and
    fails to make a bay like Nass and names it Skᴀnᴀ́x; he turns two brothers into
    stones; he obtains food from ground-hog people after announcing a world snow slide
    that later occurs; a bracketed Latin section describes Raven’s sexualized actions
    on an island and his companion Lazy; Raven invites chiefs to a feast to see the
    G̣onaqᴀdḗt’s blanket and many-crowned hat, giving rise to feast customs and grave-post
    carving; Raven creates a woman under the earth to manage tides, raises the ocean
    to travel beneath it, and afterward people, animals, trees, fish, and mountains
    are affected by flood, cold, and petrifying commands.'
  language: English with one bracketed Latin section
  quote_policy: summarized
literal_observations:
