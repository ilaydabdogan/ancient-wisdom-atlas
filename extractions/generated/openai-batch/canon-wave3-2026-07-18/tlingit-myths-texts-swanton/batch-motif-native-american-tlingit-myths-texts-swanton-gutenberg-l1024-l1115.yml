candidate_motifs:
- id: motif:1
  label: Trickster appropriates a hidden magical implement but cannot command it
  taxonomy_refs:
  - trickster_boundary
  basis: Raven secretly takes the owner’s little club and attempts to use it to get
    a seal, but the club does not obey him because it does not know him.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not call the club sacred; the motif is limited to appropriation
    and failed use of an animated implement.
- id: motif:2
  label: Culture hero as etiological place-namer and custom-origin agent
  taxonomy_refs:
  - culture_hero
  basis: Raven names Skᴀnᴀ́x after failing to make it into Nass, and the passage explains
    feast attendance and grave-post hat carving as deriving from Raven’s feast.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The label is functional; the passage does not explicitly use the term
    culture hero.
- id: motif:3
  label: Petrification by spoken command
  taxonomy_refs: []
  basis: Raven commands two brothers, later fish, and persons to become stone, and
    they do so.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: high
  cautions: No supplied taxonomy reference directly corresponds to petrification.
- id: motif:4
  label: Deceptive or prophetic warning produces food from animal people
  taxonomy_refs:
