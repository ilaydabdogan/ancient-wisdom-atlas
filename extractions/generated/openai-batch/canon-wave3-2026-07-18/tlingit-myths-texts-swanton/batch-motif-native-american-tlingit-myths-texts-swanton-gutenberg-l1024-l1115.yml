  text: A man retrieves the seal by commanding a concealed little club, which goes
    out and brings the seal ashore hanging to its neck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven observes where the club is kept, later takes it at night, tries to command
    it, and breaks it against a rock when it will not obey him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Raven tries to make a large bay into Nass, but clam noise drowns his voice
