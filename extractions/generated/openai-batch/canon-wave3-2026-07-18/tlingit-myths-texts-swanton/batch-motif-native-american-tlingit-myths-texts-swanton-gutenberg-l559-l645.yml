canonical_text:
  quote: ''
  summary: 'Raven travels through several places: he releases daylight from a box,
    causing people wearing animal skins to become sea or land animals; tricks boys
    into throwing fat for him to eat; uses a designed jade stone and eagle down to
    lure a spring salmon, then kills it; directs bird servants away so he can eat
    most of the salmon himself; participates in naming and dressing birds; visits
    Bear, who feeds him with grease and flesh from his own body, while Raven fails
    to imitate Bear and then asks about halibut fishing grounds.'
  language: English
  quote_policy: summarized
