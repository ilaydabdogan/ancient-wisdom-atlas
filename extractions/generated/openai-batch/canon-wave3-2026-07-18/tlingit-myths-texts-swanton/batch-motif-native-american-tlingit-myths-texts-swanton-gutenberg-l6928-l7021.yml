canonical_text:
  quote: ''
  summary: A chief's son learns dance and song composition through dance medicine,
    fasting, and woodland practice. His success causes jealousy, and his father publicly
    redirects such name-making dance composition toward poorer people, explaining
    why composers and dancers are numerous and distinguishing common or Haida dance
    from chiefly ceremonial dance. The first dance instructor later overturns in a
    canoe; his wife drowns, and he is captured by land otters, named Tūtsǃīdîgūˊʟ,
    and associated with drownings. In a second episode, four boys hunting ducks are
    drawn out to sea and vanish after their canoe upsets. A shaman traces their spirits
    to land-otter dens; the town burns the dens, but Tūtsǃīdîgūˊʟ escapes into the
    sea with the boys.
  language: English
  quote_policy: summarized
