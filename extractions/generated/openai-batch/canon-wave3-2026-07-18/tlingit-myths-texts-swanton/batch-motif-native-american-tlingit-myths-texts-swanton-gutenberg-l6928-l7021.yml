candidate_motifs:
- id: motif:1
  label: Ritual preparation grants dance and song power
  taxonomy_refs:
  - initiation
  basis: The youth learns through dance medicine, fasting, woodland instruction, and
    solitary practice, after which he immediately composes songs and dances.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage frames this specifically as learning dance and song composition,
    not as a full initiation rite with formal stages beyond fasting, medicine, and
    practice.
- id: motif:2
  label: Etiological charter for distribution of dance by social rank
  taxonomy_refs: []
  basis: The chief's public statement explains why many composers and dancers exist
    among poorer people and why chiefly dance is more restricted and costly.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a social-origin explanation within the passage; no external historical
    claim is made here.
- id: motif:3
  label: Chiefly ceremonial performance under speech taboo and property sanction
  taxonomy_refs: []
  basis: The chief's dance is described as quiet, high-caste, carefully spoken, and
    subject to disgrace through property-giving if mistakes are not corrected.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives performance rules and sanctions but does not present
    a separate mythic episode for this dance type.
- id: motif:4
  label: Drowned persons taken by land otters
  taxonomy_refs:
  - afterlife_journey_map
  basis: After the canoe accident, the first dancer is captured by land otters; later,
    missing boys' spirits are said to take a road to land-otter dens, and drownings
    are attributed to Tūtsǃīdîgūˊʟ.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage gives a road to land-otter dens and a drowning attribution,
    but not a complete afterlife geography.
- id: motif:5
  label: Animal quarry draws hunters into sea danger
  taxonomy_refs: []
  basis: The black ducks keep swimming out to sea, drawing the boys onward until the
    canoe upsets and the boys vanish.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The ducks' intention or supernatural status is not explicitly stated.
- id: motif:6
  label: Shaman sends spirit to locate missing persons
  taxonomy_refs:
  - mystical_quest
  basis: Property is given to Tuxstā, who sends his spirit after the missing boys
    and reports their route to the land-otter dens.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The quest is performed by the shaman's spirit and is briefly reported
    rather than narrated in detail.
- id: motif:7
  label: Burning the dens of dangerous beings
  taxonomy_refs: []
  basis: The town chief orders pitchwood gathered and the people burn land-otter dens,
    killing the land otters as they emerge.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The fire is local and punitive; it is not presented as a cosmic or world-destroying
    fire.
