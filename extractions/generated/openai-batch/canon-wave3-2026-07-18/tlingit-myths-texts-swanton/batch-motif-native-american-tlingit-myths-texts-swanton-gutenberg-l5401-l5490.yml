canonical_text:
  quote: ''
  summary: The passage recounts how the girl's brothers receive or use a spider-web
    pattern for a net, teach an old man to fish and cook, encounter Long-haired-person,
    an Athapascan shaman, and best him in a sweat-house spirit display. The family
    later travels toward the Nass; when the sister looks at the brothers during a
    river crossing despite being covered, the brothers, dog, pack, mother, and sister
    become stone landmarks. Raven comments on Kackalk's inability to restore himself
    and these remarks become proverbial. In a following Raven episode, Raven follows
    a sculpin through the sea door, claims it as his younger brother, makes it principal
    among sculpins, and places it in the sky as the Pleiades.
  language: English
  quote_policy: summarized
