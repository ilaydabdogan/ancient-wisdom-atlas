canonical_text:
  quote: This is said to have been the very oldest war.
  summary: Northern people assemble after a previous conflict, fell an enormous tree,
    hollow it by fire into a giant canoe named Spruce-canoe, and leave a central limb
    as a weapon. They prepare for war through mourning, bathing, whipping, and shamanic
    assistance. A shaman’s attendant, aided by spirits, obtains a gigantic halibut
    to provision the war party. The canoe is launched over the bodies of two killed
    captive women. Northern warriors raid southern camps, kill men, impale or enslave
    women and children, gather information from captives, return with slaves, and
    liberate northern captives. The passage closes by calling this the oldest war.
  language: English
  quote_policy: quoted
