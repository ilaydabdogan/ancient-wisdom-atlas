canonical_text:
  quote: ''
  summary: Kakēˊqǃᵘtê helps a village improve eulachon and salmon harvesting. He teaches
    spear technique, directs communal trap-making, produces abundant catches, distributes
    salmon to poor and wealthy alike, and the village gains enough food to dry and
    store for the year.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The whole village worked with Kakēˊqǃᵘtê to fix traps, cut posts, and place
    the traps at the part of the river reached by the tide.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the tide went down, the traps were full of eulachon, and people who had
    formerly lacked fish now had plenty; old people cut and dried eulachon to make
    oil.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the eulachon traps succeeded, the village was pleased with Kakēˊqǃᵘtê,
    regarded him as high-caste, and did as he told them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: At salmon season, the people had copper-pointed salmon spears, but muddy water
    limited their catches, often to only one or two salmon a day.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kakēˊqǃᵘtê asked whether the people had any other way to catch salmon, and
    they answered that they mainly speared or clubbed them under limited conditions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kakēˊqǃᵘtê took a spear from his brother-in-law, taught him to feel along
    the river for salmon, and caught six salmon in half an hour.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kakēˊqǃᵘtê explained how to feel for salmon with the spear and said he also
    knew how to make a salmon trap.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The next day the whole village made salmon traps from young trees and split
    roots, producing eighteen traps while imitating Kakēˊqǃᵘtê’s actions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women made ropes in the manner Kakēˊqǃᵘtê showed them and came to the traps
    with ropes the next morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Every salmon trap was loaded; as people emptied and strung salmon, more salmon
    entered, making the village happy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Kakēˊqǃᵘtê distributed the salmon because everyone thought it belonged to
    him, and he gave poor people as much as wealthy people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After using the traps, the people had enough salmon to dry for a year and
    stored them in boxes.
  category: sequence
  evidence_refs:
  - ev:6
