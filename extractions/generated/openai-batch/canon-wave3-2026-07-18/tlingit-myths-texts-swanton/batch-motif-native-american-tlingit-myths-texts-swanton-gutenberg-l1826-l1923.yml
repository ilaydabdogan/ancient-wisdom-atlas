canonical_text:
  quote: ''
  summary: During a famine at Sitka, a man and his wife camp at Redoubt Bay and struggle
    to catch halibut. Devilfish mysteriously appear as bait, which the woman identifies
    as help from her drowned son. A whistling land-otter-man appears as their son,
    brings more bait, takes his father fishing before dawn, secretly dives to place
    large halibut on the hooks, spears a seal, and repeatedly supplies food. He avoids
    daylight or a raven's call, eats only raw food, and gradually appears with a round
    mouth and long hair down his back.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A famine occurs at Sitka, and a man and his wife go to the mouth of Redoubt
    Bay, build a bark house, and catch very little halibut over two months.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the couple cooks part of a small halibut and hangs the rest outside,
    two devilfish appear near the brush house without a visible human bringer.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman says her son drowned a year earlier, has not been seen since, and
    must have brought the devilfish because he pities their poverty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person whistles behind the house in the dark; the parents invite him in
    as their son, and he suddenly appears seated opposite them without being seen
    entering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The returned son first communicates by whistling and later speaks; he is identified
    in the passage as a land-otter-man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The land-otter-man brings more devilfish and says that he and his father will
    go out in the morning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before dawn, the land-otter-man wakes his father, enters the canoe with him,
    and the canoe moves quickly to the halibut ground by the son's strength.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The land-otter-man tells his father to put a blanket over himself and not
    watch, but the father observes through a hole in the blanket.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The land-otter-man jumps overboard without moving the canoe, descends the
    fishing line, and puts large halibut on the hooks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the return trip, the land-otter-man uses a spear to kill a large seal and
    adds it to the canoe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When they reach shore near daybreak, the land-otter-man indicates concern
    that a raven might call before he reaches shelter, then runs into the woods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The land-otter-man eats raw halibut quickly with his back turned and is said
    to be able to eat only raw food.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the parents ask him not to go into the woods at night, he stays with
