canonical_text:
  quote: ''
  summary: Story 67 tells of Qāqǃᴀtcgūˊk, a Sitka Kîksᴀˊdî hunter who hears fur seals
    speak, renounces hunting, resumes because his children are hungry, drifts far
    out to sea with companions, survives for months on a remote rock, returns by using
    prepared floats, the sun, and mountains as guides, and is recognized by his mourning
    elder wife after his community has treated him as dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Qāqǃᴀtcgūˊk is introduced as a Sitka Kîksᴀˊdî man, skilled with a spear, with
    two wives and several children for whom he regularly brought home fur seal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: He hears a little fur seal crying and hears another seal tell it to take care
    of and feed the baby because Qāqǃᴀtcgūˊk comes there hunting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After hearing the seals, Qāqǃᴀtcgūˊk becomes frightened, returns, breaks up
    and burns his canoe, paddles, and spears, and says he will never hunt again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When his children look hungrily at others eating fur-seal meat, he asks his
    wife to request her brother's canoe and spears and starts hunting again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: While pursuing a young seal, Qāqǃᴀtcgūˊk and his men are carried farther from
    shore by wind and drift out to sea after becoming tired.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a long time they reach a rock crowded with tame sea lions, fur seals,
    and sea otters; they obtain water from hollow wild celery stalks, build a house
    from dry bushes, cook sea-animal flesh, and live there until August.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: To return home they make sea-lion hide ropes, use four sea-lion stomachs as
    floats, fill another stomach with water, load furs and meat, guide themselves
    by the sun, and anchor daily with hide lines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After many days they see what they first think is a stationary sea gull, then
    recognize it as a mountain, later identifying Mount Edgecumbe and Verstovaia as
    landmarks toward Sitka.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: They reach Sitka after an absence described as about seven months, find the
    village empty, and go on to the salmon creek Dax̣ēˊt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Dax̣ēˊt the village people are drying salmon; Qāqǃᴀtcgūˊk's younger wife
    has remarried, while his elder wife has been crying for him daily, and the people
    have held a death feast, set up a post, and burned food and clothing for him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The elder wife sees a canoe with three men, recognizes one by his paddling
    as her husband, and Qāqǃᴀtcgūˊk recognizes her in turn.
  category: action
  evidence_refs:
  - ev:8
