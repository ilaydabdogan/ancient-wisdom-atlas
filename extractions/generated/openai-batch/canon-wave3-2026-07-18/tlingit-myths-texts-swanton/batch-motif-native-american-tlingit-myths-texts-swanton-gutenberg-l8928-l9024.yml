canonical_text:
  quote: ''
  summary: The passage contains two Tlingit narratives. In “The Thunders,” a girl
    insults a snail, disappears with a youth, is found stuck on a cliff with a giant
    snail coiled around her, and is rescued by her four brothers using yellow-cedar
    wings; the brothers then become the Thunders, explain thunder and lightning, feed
    their starving village with a whale, ascend to the sky, and are claimed by the
    Taqêstînaˊ family. In “Origin of the Screech Owl,” a Sitka woman secretly gathers
    herring with a hemlock and red-cedar apron, selfishly deceives and burns her hungry
    mother-in-law, is exposed, is ignored when asking for a basket, and gradually
    becomes a screech owl; the story closes with a warning saying for selfish young
    women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A high-caste girl with four brothers stepped on a snail, spoke contemptuously
    about it, and that evening went away with a youth about her own age.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a search, the girl was found halfway up a high perpendicular cliff with
    a very large snail coiled around her, and she was unable to throw herself down.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The four brothers experimented with wood and bone for wings; yellow cedar
    enabled them to reach their sister and drag her down while leaving the snail on
    the cliff.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The four brothers left their village, said their sister had disgraced them,
    became the Thunders, and their wing movements and winks are identified with thunder
    and lightning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When their father’s village was starving, the brothers flew over the ocean,
    caught a whale, brought it to the town, and later went to live in the sky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Taqêstînaˊ claim the Thunder because the brothers belonged to that family.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Sitka woman made an apron-like arrangement of hemlock branches and red-cedar-bark
    strings, used it at Herring rock as the tide came in to catch herring, and stored
    it carefully afterward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When her hungry mother-in-law asked about the food, the woman said she was
    cooking clams and then dropped a hot rock into the old woman’s hand, burning her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The mother-in-law told her son what had happened; the husband and his brother
    then secretly watched the woman, saw how she gathered herring, and obtained a
    canoe load of herring themselves.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: After seeing the canoe loaded with herring, the woman repeatedly called for
    her basket, but the people ignored her because of her treatment of her mother-in-law;
    her voice became strange and owl-like.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: The woman’s voice seemed to move farther from the village; she stopped asking
