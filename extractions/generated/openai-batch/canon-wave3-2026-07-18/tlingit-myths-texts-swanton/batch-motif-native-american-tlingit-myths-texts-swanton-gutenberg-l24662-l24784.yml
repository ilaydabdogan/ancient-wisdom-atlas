canonical_text:
  quote: ''
  summary: The passage consists of short abstracts of Tlingit myths and episodes involving
    animal-persons, punitive encounters with nonhuman beings, monstrous sea creatures,
    a miraculous child born from root sap, seasonal displacement, reciprocal animal
    adventures, the gaining of wealth from an unusual catch, the discovery of blue
    paint, named-place origins, and dangerous encounters near Cross Sound.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter meets Wolverine-man, whose house is full of game, and learns hunting
    taboos and how to make a ground-hog trap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunter learns that a small bushy tree named sǃᴀx is Wolverine-man’s wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A chief’s daughter offends the halibut people, who take her by canoe, fasten
    her to a rock with pitch, and leave her to die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: One brother disguises himself as the dead sister, goes to the halibut chief,
    and kills him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After another offense against a duck, the duck’s killer-whale grandfather
    takes the brothers to his house, burns them badly before the fire, and turns them
    into a species of duck.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A big devilfish sweeps camp occupants into the sea, but the two elder brothers
    kill it with sharpened sticks while being dragged down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A crying boy is carried off by land-otter people, fed apparent blackberries
    that are really spiders, and is later reduced to skin after the spiders are expelled
    from his body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A woman reaching under a rock for clams is held by a large bivalve and drowns
    when the tide rises.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A village’s people are carried into the sky by seizing something that drops
    down among them; canoe makers also disappear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After a daughter swallows root sap, she gives birth to Root-stump, who pulls
    down the thing that carried off the people, kills the destroyer of the canoe makers,
    and later becomes a great hunter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A town is buried in snow at the beginning of summer after disrespectful treatment
    of seaweed; a bird tells the people berries are ripe in a neighboring town where
    it is midsummer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Porcupine protects Beaver from Bear, later strands Beaver at the top of a
    tree, and Squirrel helps Beaver down.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Beaver carries Porcupine to an island; Porcupine escapes by calling on Wolverine,
    who freezes the lake surface.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A man catches a ground hog, hears its head speak while he is about to cook
    it, stops trapping ground hogs, and is killed by one of his bear deadfalls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A poor halibut fisherman pulls up a huge abalone, lets it go, later baits
    his hook with a blood-soaked sponge, and catches a fish-filled nest that makes
    him rich.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Four brothers take refuge near Mount Edgecumbe, discover a blue substance
    for paint, and return safely after the eldest refuses to throw it overboard during
    stormy weather.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: A child misunderstands an instruction to feed a crying baby, rolls the baby
    into the fire, and the stream is thereafter named Creek-where-a-person-was-burned.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: A cedar-bark collector is strangled by his tree climber after slipping from
    it; the board is later exhibited at potlatches.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: Two men’s canoe is swallowed by a devilfish, and townspeople sink a half-burned
    piece of wood into the sea over the devilfish hole.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: Hunters who killed and ate a land otter are followed by a land-otter-man who
    throws rocks, then cones, from a tree and is made to fall into a fire lit beneath
    it.
  category: sequence
  evidence_refs:
  - ev:10
