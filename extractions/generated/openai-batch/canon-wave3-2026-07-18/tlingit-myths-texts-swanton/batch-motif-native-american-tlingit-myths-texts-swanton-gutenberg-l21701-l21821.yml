candidate_motifs:
- id: motif:1
  label: ancestral fire and words end mourning
  taxonomy_refs: []
  basis: The initial speech says a fire has been made from the grandfathers' crest,
    that the people will be warm, and that they will no longer mourn because of kind
    words.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this in a ritual-speech context; wider ceremonial
    meaning is not supplied in the excerpt.
- id: motif:2
  label: surviving kin-remnant after communal destruction
  taxonomy_refs:
  - survivor_pair
  basis: The Gîtǃîḱc people destroy one another, first leaving a chief with his sister
    and niece, and later the woman and daughter alone save themselves.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: medium
  cautions: The initial remnant is three people, so the survivor-pair taxonomy applies
    most directly only to the later woman-and-daughter survival.
- id: motif:3
  label: wise helper creates powerful objects and gives use-instructions
  taxonomy_refs:
  - wisdom
  basis: Old-man-who-knows-all-troubles is sought for knowledge, makes a helmet and
    talking arrow, and instructs the chief about how not to use it.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not explain the old man's origin or broader identity.
- id: motif:4
  label: talking weapon kills and identifies its owner
  taxonomy_refs: []
  basis: The arrow kills an enemy chief, then flies away from examination and speaks,
    which leads others to discover the chief who owns it.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No external weapon taxonomy is supplied among the available references.
- id: motif:5
  label: forgotten instruction brings death by one's own weapon
  taxonomy_refs: []
  basis: After success in war, the chief forgets what the old man told him, and the
    old man kills him with his own arrow.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage states the sequence but does not fully explain the causal
    mechanism beyond forgetting the instruction.
- id: motif:6
  label: human woman marries the Sun's son and bears descendants
  taxonomy_refs:
