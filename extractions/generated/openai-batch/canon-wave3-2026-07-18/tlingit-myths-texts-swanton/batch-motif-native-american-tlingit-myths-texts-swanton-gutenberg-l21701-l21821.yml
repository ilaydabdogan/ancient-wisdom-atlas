canonical_text:
  quote: ''
  summary: A feast oration moves from thanks and ritual directions into an embedded
    account of destruction at Gîtǃîḱc, a surviving chiefly family, a wise old man
    who makes a helmet and talking arrow, a failed war episode, the survival of a
    woman and daughter, marriage to the Sun's son, and the restoration of descendants
    to their grandfather's town. The speaker then applies the narrative to the present
    addressee's troubles and consolation through ancestral emblems.
  language: English with Tlingit transcription/interlinear forms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker thanks the addressee for making a fire from the speaker's grandfathers'
    crest and says they will be warm and will no longer mourn.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief of the Kasqǃagueˊdî addresses the opposite Ravens and asks that
    any displeasing words be overlooked for the sake of the chief.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker tells the singers to take up their poles and begin a song.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A second division of dancers goes out, dresses up, enters dancing, and finishes
    a dance before its first chief addresses the chief of the feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker instructs the feast chief to wrap his father's brothers in good
    words and then calls out names, to which named persons answer that they are present.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the embedded narrative, people at Gîtǃîḱc kill one another and are being
    destroyed until only one chief is saved with his sister and niece.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The surviving chief seeks someone who can tell him certain things and eventually
    sends for Old-man-who-knows-all-troubles, who suits him completely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Old-man-who-knows-all-troubles makes the chief a helmet and a talking arrow
    and instructs him not to release it at the old man's friends in their canoes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The chief releases the arrow toward enemies; it strikes and kills an enemy
    chief, and later flies away while speaking.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the arrow reveals its owner, enemies make war against the chief; he
    puts on a war hat, his sister goes before him, and he emerges in a cloud of ashes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The chief kills all in four enemy canoes, but later forgets the old man's
    instruction and is killed by the old man with his own arrow.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The woman goes into the woods with her daughter, and the two alone save themselves
    with help from something unspecified.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Sun's son marries the woman's daughter, who has eight children, one of
    whom is a girl.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: A house is made for the children, food and provisions are placed inside, and
    they are lowered onto Gîtǃîḱc, their grandfather's town.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The orator applies the embedded narrative to the present addressee, saying
    the grandfathers have made war clothes, put a raven hat on the addressee's head,
    placed emblems around him like a fort, and put raven boards over him so he can
    be in a dry place.
  category: speech
  evidence_refs:
  - ev:11
