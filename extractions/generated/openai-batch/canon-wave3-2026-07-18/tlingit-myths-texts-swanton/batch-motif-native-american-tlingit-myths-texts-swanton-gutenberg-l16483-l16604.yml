canonical_text:
  quote: ''
  summary: A boy or young man appears as a salmon and is sent by salmon people to
    his mother. His father, not knowing the salmon is his son, hooks and kills it
    for cooking. The mother cannot cut through the salmon's neck because of a copper
    chain formerly worn by the son, and the parents recognize it. The father places
    the salmon in a woven basket, performs actions involving spitting and eagle's
    down, and puts it on the roof; by daybreak a large man lies where the salmon had
    been.
  language: English translation with Tlingit transcription/interlinear glosses
  quote_policy: summarized
