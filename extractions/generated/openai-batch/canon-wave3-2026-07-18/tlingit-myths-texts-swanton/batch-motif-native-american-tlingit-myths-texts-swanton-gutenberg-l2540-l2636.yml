canonical_text:
  quote: ''
  summary: 'The passage includes brief footnotes, then two Tlingit narratives: one
    about a poor fisherman who loses a huge shining abalone but later catches a nest
    of valuable fish and becomes wealthy through distribution, and another about four
    brothers near Mount Edgecumbe who discover blue paint at a cave or cliff, carry
    some away despite dangerous weather, and establish a continuing warning about
    taking things from that place.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A long town’s people regularly go fishing for halibut and other large fish,
    using spruce hooks hardened in fire and dried kelp stems for lines.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A very poor man fishes with the others, catches nothing, remains quiet, and
    is laughed at by the others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The poor man’s line behaves as if caught on something, then brings up a great
    live abalone shining out of the water.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Some people tell the poor man to cut the line, saying he has caught a great
    thing and should let it go; he cuts the line and the abalone slowly sinks.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the abalone is lost, others tell him it was valuable; a saying about
    a sunk abalone is associated with losing a valuable thing, and the man cries over
    what he let go.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: On another fishing trip, the poor man makes his nose bleed, fills a sponge
    with blood, and lowers it into the ocean.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The poor man pulls up a heavy valuable thing described as the nest of a fish
    called îcqēˊn, fills his and others’ canoes with the fish, distributes them through
    town, and receives skins and other property.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Four brothers from Sitka who are fond of hunting take refuge from a storm
    near Mount Edgecumbe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: While staying near Mount Edgecumbe, the brothers discover a rocky cave or
    overhanging cliff from which soft blue material continually drops.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The youngest brother says the blue material is valuable and will be used for
    painting and carved things.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the weather becomes fine, the brothers knock off a big piece of the blue
    material, wrap it among their clothes, and hide it away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the canoe starts with the blue material, the sea becomes rough.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The eldest brother steers and composes a song asking which way to steer, while
    the youngest suggests throwing the blue paint into the water so they can reach
    shore.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The eldest brother asks that the blue substance be tied to his head and says
    he will be drowned with it so that things will eat him with it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The brothers are not drowned and reach shore safely; people later speak of
    their bravery in not throwing the blue paint overboard.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: People still say that taking anything from that place will make the weather
    stormy, though people may risk it because what is obtained is valuable.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: For a long time after the brothers reach shore with the blue paint, bad weather
    and great ocean rollers prevent people from going to sea for halibut.
  category: sequence
  evidence_refs:
  - ev:10
