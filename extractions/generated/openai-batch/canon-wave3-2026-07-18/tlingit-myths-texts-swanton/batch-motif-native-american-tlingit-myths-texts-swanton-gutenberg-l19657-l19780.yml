  text: A glacier passed through the northern part of the mountain, and the group
    went upward by that route toward the top.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The group thought they might all die when they reached the top, but they did
    not reach the highest summit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: They put on their best clothing, stayed there for about five days, and prepared
    to depart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: They sang the song they had used on Copper River and wore nose pins, weasel
    hats, and coats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: They mourned friends left behind and those who had been lost in the fog, then
    got up and started away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Athapascans did not know about the sea and asked what the very blue thing
    was.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: They decided to go down to the sea and said that they had saved themselves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: They traveled quickly from the lower end of the glacier to the sea, crossed
    a large river boiling from under the mountain, and stayed near the river mouth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: They claimed the big mountain as a crest because they were the first to pass
    through it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When winter came, they built a house beside the river, named it Mountain house
