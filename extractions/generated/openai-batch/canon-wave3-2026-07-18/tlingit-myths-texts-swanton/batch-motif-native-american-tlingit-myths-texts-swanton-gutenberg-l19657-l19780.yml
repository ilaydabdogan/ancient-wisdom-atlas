canonical_text:
  quote: ''
  summary: A traveling Athapascan group reaches a mountain barrier, ascends by a glacier
    route, fears death, dresses in fine clothing, sings an old Copper River song,
    mourns companions, then descends toward an unknown blue sea. They cross a large
    river from under the mountain, stay at its mouth, claim the mountain as a crest
    because they were first to pass through it, and later build and name Mountain
    house, which becomes a town.
  language: English with Tlingit transcription and interlinear glosses
  quote_policy: summarized
