canonical_text:
  quote: ''
  summary: A famine affects a long town. A lazy man is left behind when the people
    leave for camp, though his uncle's wife hides dried fish for him. A small long-toothed
    speaking thing says it has come to help him, instructs him in a dream to put it
    into the water, and afterward sea animals drift ashore with the helper attached
    to them. The man builds a large house and obtains food while the relatives who
    left him continue to suffer famine.
  language: English
  quote_policy: summarized
