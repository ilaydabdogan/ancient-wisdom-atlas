canonical_text:
  quote: ''
  summary: The passage contains a short dance fragment involving raven hats, followed
    by an account in which a menstruant chief's daughter speaks in a way that angers
    a glacier, causing it to grow over a house and town so that people flee and build
    elsewhere. A later account describes a war expedition, the capture and release
    of a lone woman, the recovery of a hidden wolf post belonging to her son, quarrels
    over the post, and a war leader's speech while wearing face ornaments representing
    ears.
  language: English with Tlingit transcription and interlinear glosses
  quote_policy: summarized
