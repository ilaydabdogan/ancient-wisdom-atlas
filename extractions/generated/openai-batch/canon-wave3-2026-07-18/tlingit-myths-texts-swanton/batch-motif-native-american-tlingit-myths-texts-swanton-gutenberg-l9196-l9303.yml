canonical_text:
  quote: ''
  summary: 'The passage contains two complete narratives and the beginning of a third:
    a small halibut grows into a monster that breaks the Queen Charlotte Islands apart;
    a chief’s dead wife is represented by a red-cedar image that gradually becomes
    alive and is associated with a new cedar tree; and Djīyīˊn is introduced as an
    orphan girl during a famine at Klinkwan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A single village is described as existing on the Queen Charlotte Islands,
    and its people regularly go out to fish for halibut; one man repeatedly catches
    nothing.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unsuccessful man finally hooks something very strong, but when he pulls
    it up it is only a very small halibut.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man says the small halibut might bring him luck; his wife sees it, takes
    it by the tail, and throws it onto the beach.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The live halibut flops faster and grows from a small fish into a monster that
    smashes the town, breaks the formerly solid land into separate portions, and scatters
    the people.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A young chief’s wife falls ill, shamans are brought from various villages,
    and she dies after they fail to help her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief seeks carvers to make an image of his wife; a carver from his own
    village makes a red-cedar image dressed like the dead woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The chief takes the image home, pays the carver well, dresses the image in
    his wife’s clothes and marten-skin robe, keeps it close, and treats it like his
    wife.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: The image moves slightly, becomes increasingly like a human body, is said
    to be alive though unable to move or speak, and later gives a crackling sound
    from its chest.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:9
  text: When the image is moved, a small red-cedar tree is found growing where it
    had sat; the narrative links this to the quality of Queen Charlotte Islands cedars.
  category: object
  evidence_refs:
  - ev:10
- id: obs:10
  text: The woman-image moves very little and never talks aloud, but the husband dreams
    what she wants to tell him.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:11
  text: At Klinkwan, during a famine, an orphan girl named Djīyīˊn takes care of herself,
    with occasional help from her father’s sister, who is also poor.
  category: setting
  evidence_refs:
  - ev:12
