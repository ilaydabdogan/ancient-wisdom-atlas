candidate_motifs:
- id: motif:1
  label: Testing a shaman’s power
  taxonomy_refs: []
  basis: The passage repeatedly says people tried shamans because of their reputed
    strength, using blindness, tripping, fire, and attempts to cut hair.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: high
  cautions: The passage presents this as testing strength, not explicitly as initiation.
- id: motif:2
  label: Harmless fire as proof of spirit power
  taxonomy_refs: []
  basis: The visiting shaman runs around a fire and throws fire around the gathering
    and up to the ceiling without injuring anyone, which the passage states showed
    the strength of his spirits.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No broader fire-motif comparison is asserted beyond the literal episode.
- id: motif:3
  label: Apparent death and scarless restoration
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: A man is struck by the knife-bearing spirit, treated as slain, remains bleeding,
    and then rises after the shaman’s words and spirit noise with no scar.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes restoration from an apparently fatal wound; it does
    not describe an afterlife journey or full death chronology.
- id: motif:4
  label: Ritual response to a darkened moon
  taxonomy_refs:
  - sacred_exchange
  basis: When the moon hides its face, leading people dress up, grease the fire, dance,
    and hold up property while calling to the moon, which is said to feel poor and
    lonely.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage explains the action as customary when moon or sun acts this
    way, but does not explicitly state a completed exchange of property.
- id: motif:5
  label: Shamanic summoning of fish abundance
  taxonomy_refs: []
  basis: A shaman’s spirits sing to bring salmon, a boy catches an enormous salmon
    with a special hook, and the fish feeds the town.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No available motif-family reference precisely names fish-provision by
    shamanic spirits.
- id: motif:6
  label: Raven creates or plants local resources
  taxonomy_refs:
  - culture_hero
  basis: Raven is credited with making Hole-Raven-bored and planting nearby wild onions.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage gives only brief etiological statements about Raven, without
    a full Raven narrative.
- id: motif:7
  label: Speech taboo at an animate landscape crossing
  taxonomy_refs: []
  basis: Canoe travelers may pass under the glacier, but if anyone speaks, the glacier
    comes down; it is said to hear like an animal.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a speech prohibition rather than a forbidden-knowledge episode.
- id: motif:8
  label: Animate glacier provides salmon when addressed
  taxonomy_refs: []
  basis: When people below the glacier ask it for food, it rushes down, raises a wave,
    and throws salmon ashore.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage describes request and provision but not an offering or bargain.
- id: motif:9
  label: Shamanic rivalry through hostile spirit power
  taxonomy_refs: []
  basis: The Athapascan shaman sets out a destructive object for his guest, but the
    guest recognizes it and later the Athapascan shaman dies, killed by rival spirits.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not identify the object beyond its destructive function.
- id: motif:10
  label: Offerings or placed things at a spirit-containing rock for hunting success
  taxonomy_refs:
  - sacred_exchange
  basis: Tᴀˊnᴀku rock contains shaman spirits, and people place things there when
    they want to kill an animal.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage states the practice but gives little detail on the transaction
    or ritual procedure.
