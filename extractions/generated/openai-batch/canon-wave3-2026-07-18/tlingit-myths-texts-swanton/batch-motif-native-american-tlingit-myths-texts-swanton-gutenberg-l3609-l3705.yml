canonical_text:
  quote: ''
  summary: The passage recounts Alsek-area shamanic demonstrations, a dangerous spirit
    episode ending in a restored wounded man, a moon-darkening rite, the summoning
    and capture of an enormous salmon, Raven-made places, an animate glacier associated
    with speech danger and salmon provision, encounters and rivalry with an Athapascan
    shaman, and rock-associated shaman spirits used in hunting practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A visiting shaman at Kǃᴀkᴀnuwūˊ is publicly tested by having his mask thrown
    over his eyes and by people trying to trip him as he runs around a fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman throws fire around the people and up to the ceiling, but the fire
    hurts nobody.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A spirit named Gutsǃcaxoˊtǃqā comes with a big knife and strikes people on
    the breast; the shaman warns older people to stand still and not fear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a man is struck, laid aside, and called slain by the people, the shaman
    goes to the bleeding body, says it will be all right, and the man gets up with
    no scar.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shaman predicts that something dangerous will appear; the moon rises brightly
    and then hides its face.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Leading Kāˊgwᴀntān men and women dress up, put grease on the fire, dance for
    the moon to come out, and hold up property while calling to the moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A shaman left at home has spirits singing inside him to bring salmon into
    the creeks and has a one-barbed hook made.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A small boy receives the shaman’s one-barbed hook and easily pulls up an enormous
    salmon after other hooks are broken.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A place called Hole-Raven-bored is said to have been made by Raven, and rocks
    come out of it before large runs of fish.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: At a place where the Alsek River runs under a glacier, speaking while under
    it causes the glacier to come down; the glacier is said to have been like an animal
    and able to hear.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: When people camp below the glacier and ask it for food, the glacier comes
    down with a rush, raises a wave, and throws salmon ashore.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Cānyukᴀˊ, people encounter a strong shaman whose single hair is three inches
    across and cannot be cut by mussel shells, clam shells, or sharp stones.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Cānyukᴀˊ shaman has many spirits, including glacier spirits called Fair-girls-of-the-glacier
    and sky-tribe spirits called Fair-girls-of-the-sky.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Athapascan shaman places an object intended to destroy an opponent’s people
    before his guest, but the guest recognizes it and goes home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Soon after the guest returns home, the Athapascan shaman dies, said to have
    been killed by his rival’s spirits, and his spirits pass to a friend.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A rock named Tᴀˊnᴀku contains the spirits of a shaman called Qātsatîˊ; people
    place things there when they want to kill animals.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Wild onions near the rock are said to have been planted by Raven.
  category: setting
  evidence_refs:
  - ev:10
