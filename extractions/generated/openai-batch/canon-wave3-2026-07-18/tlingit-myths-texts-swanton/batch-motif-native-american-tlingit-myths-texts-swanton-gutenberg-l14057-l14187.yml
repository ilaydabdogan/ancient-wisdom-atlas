canonical_text:
  quote: ''
  summary: In a cave, mountain sheep are destroyed and their hides and fat are handled.
    A spirit gives instructions involving fire and a basket. A woman is supernaturally
    altered so that she cannot get full or taste mountain-sheep fat, with the passage
    giving her scratching of a cheek as the cause. The uncle is told to be courageous
    when Nix̣âˊ comes; grizzly bears gather and enter while he sings for the spirit.
    A grizzly bear with eagle down around its ears enters, the wife breaks apart in
    fear, and For-little-slave/the shaman burns in the fire with his spirit. The cave
    creaks, beings run into their skins, and the uncle also burns.
  language: English translation and gloss with Tlingit transcription
  quote_policy: summarized
