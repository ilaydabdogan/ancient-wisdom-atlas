canonical_text:
  quote: ''
  summary: A ceremonial speech says that grandfathers and their emblems are gathered
    around the addressee, that boards painted with raven have been put over him after
    rain, and that he can sleep dry beneath them. The chief giving the feast answers
    with thanks, saying the speakers’ words and emblems have placed them close to
    him, helped him like children of the sun, made his uncles seem to return, placed
    a raven-hat on his head, surrounded him with crests like a fort, warmed him after
    cold, and sheltered him from rain so he can sleep.
  language: English with Tlingit interlinear text
  quote_policy: summarized
