canonical_text:
  quote: ''
  summary: Footnote material gives two Tlingit song texts and translations. One song
    was composed by Kāqātucūˊtc when his father and uncle died and speaks of the sound
    of death coming down Chilkat River and the nation’s drum falling down. Another
    mourning song, composed by Kakᴀsguxoˊ about Kᴀckǃᴀˊʟkǃ and Łqǃayāˊkǃ, refers to
    Kᴀckǃᴀˊʟkǃ and his brothers trying to cross the Stikine, being seen by their sister,
    and turning into stone.
  language: English with Tlingit transcription
