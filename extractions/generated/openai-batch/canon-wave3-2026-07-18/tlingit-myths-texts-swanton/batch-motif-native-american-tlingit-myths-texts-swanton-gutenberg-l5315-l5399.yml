canonical_text:
  quote: ''
  summary: A group of brothers in Arrow-canoe pass and kill a series of dangerous
    sea obstacles and beings that had destroyed travelers, then overcome a bad sea
    shaman by using sinews from a small bird. They report the monster's death to an
    old man, return to their mother and pubescent sister, observe seclusion and sight
    restrictions for the sister, travel inland to deal with forest dangers, instruct
    some animals not to kill humans, help a blind hunter, and provide their sister
    with tools for needlework.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travelers pass under Point-that-moves-up-and-down, a point that rises
    and falls to smash canoes, and by passing safely they kill it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: They pass through a kelp patch that closes on travelers when it parts, killing
    it; the kelp piles into a kelp-covered rock said to still be visible.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: They pass over Fire-coming-up-out-of-the-sea when it falls back into the ocean,
    and kill it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dogs-of-the-sea draw apart and run together on anyone passing between, but
    Arrow-canoe runs through safely, killing them; they become rocks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Two Mountains-that-divide form the monster's doors by separating and coming
    together; Arrow-canoe passes between them when separated and kills them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The bad sea shaman breaks ropes made from whale sinew and monster sinews,
    but a very small thread made from the sinews of the bird Old-person removes the
    shaman's scalp, and the rest of the head turns into rock.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After hearing the report, the old man says the monster would have killed all
    people if not destroyed; people are glad and no longer fear the place.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The brothers return to their mother and sister when the sister has reached
    puberty; she is secluded behind a mat curtain, given water through goose and swan
    leg bones, and made to wear a large hat so she does not look at forbidden things.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says that the same regulations have been observed since the sister's
    time.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: After leaving, the brothers move south through the interior to kill forest
    monsters, hunt animals, and keep their sister from looking at any of the animals.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: They tell the wolverine and wolf not to kill human beings and provide them
    with prey animals as their food.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: They meet He-whose-hands-see, a blind man whose wife had aimed his arrows
    and then left him; the brothers give him grease, fat, and dried meat.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The brothers make animal-bone needles and sinew threads for their sister behind
    the screen; she works with porcupine quills and dyed sinews, and the passage attributes
    interior women's needlework skill to her.
  category: action
  evidence_refs:
  - ev:11
