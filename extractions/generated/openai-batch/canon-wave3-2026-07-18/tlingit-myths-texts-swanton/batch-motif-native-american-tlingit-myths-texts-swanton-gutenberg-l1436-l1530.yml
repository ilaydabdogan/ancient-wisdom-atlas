canonical_text:
  quote: ''
  summary: A group of brothers are repeatedly attacked, killed, revived, and aided
    by Kᴀckǃᴀˊʟkǃ’s small dog, red paint, and rattle. They kill and impersonate a
    two-headed bear chief, encounter a dangerous rolling object whose flight explains
    mountain curves and the sun’s halo, acquire a food-getting spear, meet Worm-eating
    Athapascans, bathe in the sea for strength, and finally Łqǃayāˊkǃ is shamed for
    conduct with his sister, becomes thunder, while his sister enters Mount Edgecumbe
    through the crater.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The one-legged man cannot sleep because of his lost spear, uses a quill that
    tells him things, and locates the brothers in a tree when the quill bends down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The one-legged man tears Łqǃayāˊkǃ and two other brothers to pieces before
    Kᴀckǃᴀˊʟkǃ releases his concealed dog, which tears the man apart.
  category: sequence
  evidence_refs:
  - ev:1
