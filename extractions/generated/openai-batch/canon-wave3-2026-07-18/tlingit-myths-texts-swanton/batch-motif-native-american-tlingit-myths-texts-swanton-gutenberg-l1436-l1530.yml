  evidence_refs:
  - ev:4
- id: obs:7
  text: Kᴀckǃᴀˊʟkǃ puts on the bear skin, hides his brothers under his arms inside
    it, carries strings of salmon, and imitates the two-headed man at the houses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A noisy object outside is rolled onto Łqǃayāˊkǃ and two older brothers, cutting
