candidate_motifs:
- id: motif:1
  label: Ritual revivification with paint and rattle
  taxonomy_refs:
  - resurrection
  basis: Kᴀckǃᴀˊʟkǃ twice restores dismembered or cut-apart brothers by applying red
    paint and shaking a rattle over their bodies.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The passage describes restoration to life but does not explain the ritual’s
    broader religious meaning.
- id: motif:2
  label: Size-changing animal helper defeating monsters
  taxonomy_refs:
  - shapeshifter
  basis: Kᴀckǃᴀˊʟkǃ’s dog can be made small and hidden, then released to kill the
    one-legged man and the two-headed bear chief and to defeat the rolling object.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  confidence: medium
  cautions: Only the dog’s size alteration is explicit; broader shapeshifting is not
    described.
- id: motif:3
  label: Impersonation by wearing the slain being’s skin
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: After the dog kills the two-headed bear chief, Kᴀckǃᴀˊʟkǃ wears the bear
    skin, hides his companions inside it, carries salmon strings, and acts like the
    bear chief.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: This is a disguise and impersonation episode; the passage does not say
    Kᴀckǃᴀˊʟkǃ physically transforms into the bear chief.
- id: motif:4
  label: Etiological shaping of landscape and sky
  taxonomy_refs:
  - culture_hero
  basis: The dog’s throwing of the rolling object explains the curved shapes of the
    mountains and the halo around the sun.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The world-shaping action is performed by a dog helper rather than directly
    by a named human culture hero.
- id: motif:5
  label: Origin of a useful spear and food acquisition
  taxonomy_refs:
  - culture_hero
  basis: The passage states that people have had the spear dīnaˊ since that time and
    that the brothers use it to get food whenever hungry.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives an origin statement for the spear but does not fully
    narrate its first creation within this excerpt.
- id: motif:6
  label: Taboo violation leading to transformation into thunder
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Łqǃayāˊkǃ is shamed after spruce gum is found on him, is told by his brothers
