- id: obs:3
  text: Kᴀckǃᴀˊʟkǃ applies red paint to his brothers’ bodies and shakes a rattle over
    them so that they come back to life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A two-headed bear chief comes upstream, catches many salmon, and carries them
    on strings at each side of his mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A little old man tells the brothers that the two-headed figure leaves salmon
