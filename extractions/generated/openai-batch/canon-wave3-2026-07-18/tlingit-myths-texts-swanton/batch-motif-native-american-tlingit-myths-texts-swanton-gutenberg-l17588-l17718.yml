canonical_text:
  quote: ''
  summary: Several brothers from Sitka go hunting among the islands. The eldest, Qāqǃᴀtcgūˊk,
    hears or is mentioned among fur seals. After conflict in the canoe, the brothers
    cover their heads and the canoe drifts far out for many days, eventually reaching
    an island with sea lions, seals, fur seals, sea otters, and sea-lion bristles.
    They remain there for a year and a half. Qāqǃᴀtcgūˊk dreams that he has come home,
    tells his younger brothers to set out, and uses the rising sun behind Mount Verstovaia
    as a directional guide. After nights at sea they see a sea gull and identify Mount
    Edgecumbe. They come ashore, name the landing place Canoe-resting-place, Qāqǃᴀtcgūˊk
    pounds out a sea-lion figure as a marker, and they return to Sitka.
  language: English with Tlingit interlinear text
  quote_policy: summarized
