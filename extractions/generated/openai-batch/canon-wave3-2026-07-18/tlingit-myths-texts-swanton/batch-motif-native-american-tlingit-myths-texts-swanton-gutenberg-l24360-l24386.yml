canonical_text:
  quote: ''
  summary: The passage contains footnotes and two song translations. One note explains
    that a term translated as “aunts” refers generally to marriageable women of the
    opposite clan. One song is said to have been composed by Raven-skin after his
    sweetheart abandoned him and says that if one controlled death it would be easy
    and pleasant to die with a Wolf woman. Another is identified as a Kā́gwᴀntān mourning
    song and says that a Wolf man’s death or condition was his own fault and that
    others should not be blamed.
