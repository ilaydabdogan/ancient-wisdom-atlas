canonical_text:
  quote: ''
  summary: The passage recounts six brothers hunting mountain sheep, the youngest
    brother going astray near a cliff and being carried by the leader of the mountain
    sheep. It then recounts the six brothers returning toward the place from which
    they had come out, after their uncle tells them to retrieve a valuable copper
    plate in Łtaxēn valley. They visit their friends, find the copper plate, which
    has eyes and hands, cut it in two, carry it away, and return to the ocean.
  language: English with Tlingit transcription and interlinear English glosses
