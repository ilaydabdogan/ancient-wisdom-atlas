canonical_text:
  quote: ''
  summary: The passage gives origin accounts for Kāˊgwᴀntān wolf and grizzly bear
    crests, then begins the migration story of Dancer of the Gānᴀxᴀˊdî, whose gambling
    causes his separation from his wife and who takes his nephews away, settles near
    Tongass, obtains a clay-like medicine from a mysterious animal, and uses it for
    hunting and bodily enhancement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Kāˊgwᴀntān man removes a bone from a wolf’s teeth and asks the wolf to show
    him what makes it lucky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: The man dreams of a fine wolf town, where the wolf he helped calls itself
    his friend and tells him something to make him lucky.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The account says that after this event the Kāˊgwᴀntān used the wolf.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bear reaches through a smoke hole and steals herring that Kāˊgwᴀntān people
    are drying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the people call the bear a thief, the bear kills them all.
  category: sequence
  evidence_refs:
  - ev:3
