candidate_motifs:
- id: motif:1
  label: Animal helper repays rescue with luck-giving knowledge
  taxonomy_refs:
  - sacred_exchange
  - wisdom
  basis: The wolf is freed from a bone in its teeth, later appears as a friend in
    a dream, and tells the man something to make him lucky.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage presents a reciprocal animal-human encounter; the taxonomy
    labels are interpretive and should be reviewed.
- id: motif:2
  label: Clan crest origin from animal encounter
  taxonomy_refs: []
  basis: The wolf episode explains Kāˊgwᴀntān use of the wolf, and the bear episode
    explains Kāˊgwᴀntān use of the grizzly bear.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No external crest taxonomy identifier is supplied in the available list.
- id: motif:3
  label: Animal theft and retaliatory killing leading to preserved remains
  taxonomy_refs: []
  basis: A bear steals herring and kills people; the Kāˊgwᴀntān then kill bears and
    preserve skins from their heads.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The available taxonomy includes sacred theft, but the passage does not
    mark the theft as sacred, so no taxonomy reference is assigned.
- id: motif:4
  label: Gambling loss causes departure from spouse and household
  taxonomy_refs:
  - departure
  basis: Dancer loses the house’s property through gambling, is told by his wife to
    leave, and goes away.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The departure label is supported by the narrative sequence but is broad.
- id: motif:5
  label: Uncle removes nephews and founds a new settlement
  taxonomy_refs: []
  basis: Dancer takes his sisters’ boys without maternal permission, travels by canoe,
    and makes a permanent residence on a sandy beach near the Tongass area.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not explicitly frame this as a formal initiation or legal
    adoption.
- id: motif:6
  label: Medicine obtained from a mysterious animal
  taxonomy_refs: []
  basis: A large unusual animal is identified as medicine; after it is shot at and
