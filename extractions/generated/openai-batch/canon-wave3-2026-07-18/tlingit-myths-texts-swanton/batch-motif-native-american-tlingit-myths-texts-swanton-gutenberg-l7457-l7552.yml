scenes:
- id: scene:1
  label: Luring the girl away and killing the worm
  summary: The people repeatedly try to get the girl outside so they can kill the
    worm. She finally comes out dressed in a marten robe and rope belt, singing that
    leaving her pet will cause death. The people then kill the worm despite her recognition
    of the uproar.
