- id: scene:2
  label: Lament, clan attribution, and burning
  summary: The girl laments the dead worm and says it will be known widely and claimed
    by a great clan. The passage links her songs and the worm to the G̣ānᴀxteˊdî,
    describes its human-style burning, and gives the father's public explanation for
    having it killed.
