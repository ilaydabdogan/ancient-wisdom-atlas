candidate_motifs:
- id: motif:1
  label: Dangerous animal-child killed and converted into clan property
  taxonomy_refs:
  - serpent
  basis: The girl treats the big worm as son or pet; the people kill it from fear
    of later harm; the passage then links it to exclusive G̣ānᴀxteˊdî ownership and
    origin.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  confidence: medium
  cautions: The creature is called a big worm, not explicitly a serpent; the taxonomy
    mapping is therefore approximate.
- id: motif:2
  label: Lament songs as clan inheritance
  taxonomy_refs: []
  basis: The girl's songs accompany the worm's death and are later used by the G̣ānᴀxteˊdî
    at feasts; the passage restricts use of the worm to that clan.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage gives a local clan-rights explanation rather than a broader
    cross-cultural comparison.
- id: motif:3
  label: Other-than-human shamanic journey and return
  taxonomy_refs:
  - departure
  - return
  - initiation
  - mystical_quest
  basis: Sǃāwᴀˊn is summoned by nonhuman land otters, travels covered by mat to their
    village, cures a patient, receives spirit knowledge, and is taken back home covered
    again.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:12
  - ev:13
  - ev:15
  confidence: high
  cautions: The passage describes a shamanic trip to land otters, not an afterlife
    or underworld journey.
- id: motif:4
  label: Healing by extraction of an invisible intrusive object
  taxonomy_refs: []
  basis: Sǃāwᴀˊn sees an arrow point invisible to the land otters, removes it from
    the sick otter's side, and the patient immediately recovers enough to sit up and
    ask for food.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: No taxonomy reference in the supplied list precisely names this healing
    pattern.
- id: motif:5
  label: Acquisition of helping spirits from nonhuman instructor
  taxonomy_refs:
  - initiation
  basis: A land-otter shaman shows Sǃāwᴀˊn named spirits, and the passage says all
    of these become the man's spirits afterward.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage does not describe a formal initiation ceremony for Sǃāwᴀˊn,
    but it does describe acquisition of shamanic spirits.
- id: motif:6
  label: Land-otter tongue and fasting as shamanic preparation
  taxonomy_refs:
  - initiation
  basis: The passage states that a man wanting to become a shaman cuts a land otter's
    tongue and fasts for eight days, with fasting sharpening the eyes.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: This is presented as a general practice note following the narrative,
    not as an action performed by Sǃāwᴀˊn in this passage.
- id: motif:7
  label: Animated shamanic implements identify the true place
  taxonomy_refs: []
  basis: Sǃāwᴀˊn's rattle and belt run ashore ahead of him and enter the proper house,
    exposing the correct location of the sick person.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage reports the action of the implements but does not explain
    their agency.
