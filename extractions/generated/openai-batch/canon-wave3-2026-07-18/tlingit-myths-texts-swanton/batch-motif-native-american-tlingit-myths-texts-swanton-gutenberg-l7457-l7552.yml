canonical_text:
  quote: ''
  summary: The passage first recounts the killing and burning of a girl's big worm
    pet, her lament songs, and the attribution of the worm and related songs to the
    G̣ānᴀxteˊdî clan. It then recounts how the shaman Sǃāwᴀˊn is summoned by land
    otters to cure a sick high-status otter, receives payment and spirit knowledge,
    and returns home; the passage ends with a note on later land-otter-related shamanic
    practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people prepare to kill the creature and repeatedly try to get the girl
    to leave her house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl calls the big worm her son or pet, dresses in a new marten robe with
    a rope belt, and comes out singing that her coming out will cause death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the girl is away, the people kill the worm; when she hears the uproar,
    her uncle's wife calls it a dog fight, but the girl says they are killing her
    son.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the worm is killed, the girl sings that it will be heard of widely,
    claimed by a great clan, and looked up to as something great.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that, to this day, the G̣ānᴀxteˊdî clan starts the girl's
    four songs when feasting.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girl asks that her pet be burned like a human body and that the whole
    town cut wood for it; the creature burns like coal oil.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says this is where the G̣ānᴀxteˊdî come from, that no one outside
    them can use the worm, and that they also own Black-skin, represented on poles
    with sea-lion intestines around his head.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The girl's father gives a feast with tobacco and explains that he had the
    pet killed because he feared it would later injure the village.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sǃāwᴀˊn becomes a shaman and tells the people to leave the village because
    spirits speaking in him warn that all will die if they stay.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A spirit says that nonhuman inviters are coming; a canoe arrives, Sǃāwᴀˊn
    packs his things, enters it, and is covered with a mat until reaching another
    village.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the land-otter village, Sǃāwᴀˊn's rattle and belt run ahead to the correct
    house where a sick person lies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The land otters call Sǃāwᴀˊn by name and say their shamans cannot see what
    is killing the sick one.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: When Sǃāwᴀˊn worries about who will sing his songs, the land otters say they
    can sing them, and they offer him a carved-bone breastplate as payment for curing
    the patient.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Sǃāwᴀˊn sees that an invisible copper arrow point in the land otter's side
    is causing the sickness, removes it, and the patient immediately sits up and asks
    for food.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: A land-otter shaman shows Sǃāwᴀˊn spirits, including Sickness as a clam spirit
    and spirits of the Sea, Land, Above, and Below; these later become Sǃāwᴀˊn's spirits.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: The passage says that a man who wants to become a shaman cuts the tongue of
    a land otter and fasts for eight days, and that much fasting makes a shaman's
    eyes sharp.
  category: action
  evidence_refs:
  - ev:14
- id: obs:17
  text: After showing the spirits, the land otters say they will take Sǃāwᴀˊn home
    when he wants, and they return him to his town covered again.
  category: sequence
  evidence_refs:
  - ev:15
