canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Tlingit narratives: a man becomes
    a powerful land-otter-man and land otters make peace with humans; warnings, prophecy,
    child abduction, a sea-lion healing episode, a woodworm crest origin, and a shamanic
    cure are summarized; Kakḗqǃᵘtê teaches food practices and later warfare and peacemaking
    occur; the G̣onaqadḗt originates through a lazy son-in-law’s lake-monster transformation,
    death, return, and underwater household; another G̣onaqadḗt story recounts abduction
    and restitution of nephews; the Thunders and screech owl are explained through
    transformation stories.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man upset in a canoe became a land-otter-man named Tūtsǃīdîgū́ʟ, described
    as very powerful.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four boys followed black ducks out to sea, were upset, and were taken into
    land-otter dens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A shaman told the people where the boys were, and the people burned the dens,
    killing many otters, while Tūtsǃīdîgū́ʟ escaped with the boys.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Land otters made war on humans, causing pimples and sores attributed to spider-crab-shell
    arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Two white land otters were treated as deer-like peace ambassadors, after which
    land otters came to town and danced to make peace.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Raven warned people not to leave; later, a man from the woods predicted the
    deaths of four boys and the shaman, and the prediction was fulfilled.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A crying child was carried away by Man-with-a-burning-hand and later found
    in a cliff hole with ants coming from its nose, eyes, and ears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: A hero abandoned on a sea-lion rock was taken into the sea lions’ house, cured
    a wounded sea lion, received a wind-controlling box, and drifted ashore inside
    it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: At Tuxican, a girl nursed a woodworm until it became large; the people killed
    it, and her people thereafter used it as a crest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The shaman Sǃāwᴀ́n was sent for by land otters, identified the correct sick
    otter with the aid of his rattle and belt, and cured it by drawing an arrow point
    from its side.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kakḗqǃᵘtê went among the Athapascans and taught methods of collecting and
    preserving food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Groups made raven ritual objects, warfare followed, iron spear heads washed
    ashore on wreckage were used in renewed fighting, and peace was later made.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A lazy gambling son-in-law split a tree, caught a lake monster, wore its skin,
    and used it to catch fish and sea animals for his mother-in-law to find.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After Raven called while the son-in-law was leaving the monster skin, he died;
    his mother-in-law died of shame when she learned he had supplied the animals.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The wife had the body and skin carried back to the lake edge; there the man
    came to life, took her into his house at the bottom, became the G̣onaqᴀdḗt, and
    their children became women at the heads of creeks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: In another G̣onaqᴀdḗt story, a chief’s nephews were taken away, then restored
    after the chief arranged a feast, and each received a headdress, rattle, and songs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: A girl offended a snail and was found on a high cliff with a large snail coiled
    around her; her brothers made wings, rescued her, later brought food, and became
    the Thunders.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: A Sitka woman mistreated her mother-in-law with hot herring milt; after refusing
    to fetch herring properly, she called all night until her voice and body changed
    into those of an owl.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:19
  text: The passage explicitly identifies several abstracts as versions of, identical
    with, or related to other numbered stories in the same collection.
  category: relationship
  evidence_refs:
  - ev:12
