canonical_text:
  quote: ''
  summary: A canoe party led by children reaches their father’s town, demands the
    return of an uncle’s hands, and causes the town to sink through song and drumming.
    Raven then instructs the eldest boy how to restore dead people with eagle feathers
    and replaced hands. Subsequent Raven episodes describe Raven entering a whale,
    killing it from within, being released by people on shore, deceiving them into
    abandoning whale oil, disguising himself as a child to eat fat, failing to steal
    provisions from a ghost town, and meeting Cannibal-man among Athapascan Indians.
  language: English
  quote_policy: summarized
