candidate_motifs:
- id: motif:1
  label: Song and drumming cause a town to sink
  taxonomy_refs: []
  basis: The eldest son’s renewed song and drumming make the town sink and shake,
    and later the town sinks again after the children leave.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The broader narrative context before this excerpt is not included, so
    the full cause of the conflict is not available.
- id: motif:2
  label: Resurrection through restored hands and eagle feathers
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Raven gives instructions to replace hands and use eagle feathers on mouths
    and cuts; after the eldest boy does this, all the dead people come to life.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the procedure but not an explanation of why eagle feathers
    have this effect.
- id: motif:3
  label: Trickster inside a whale kills it from within and escapes
  taxonomy_refs:
  - trickster_boundary
  basis: Raven enters the whale’s open mouth, lives and cooks inside it, cuts out
    its heart, sings for it to go ashore, and is released when people cut it open.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is based on Raven’s boundary-crossing and deceptive
    actions in the passage; the passage does not explicitly label Raven as a trickster.
- id: motif:4
  label: Food or oil obtained by false taboo warning
  taxonomy_refs:
  - trickster_boundary
  basis: Raven tells the people that hearing a strange sound in a whale brings bad
    luck and warns them not to eat or keep the oil, which then becomes his.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The warning is presented as Raven’s speech; the passage does not independently
    confirm the bad-luck claim.
- id: motif:5
  label: Shapeshifting into a child to steal food
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Raven makes himself look like a child and eats pieces of fat thrown among
    the children.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage describes appearance change but does not specify the mechanism.
- id: motif:6
  label: Ghost house prevents theft by invisible forces
  taxonomy_refs: []
  basis: Raven loads ghost-house provisions into a canoe, but an unseen line returns
