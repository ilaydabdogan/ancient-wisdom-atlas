canonical_text:
  quote: ''
  summary: The passage contains the end of one narrative and the beginning of another.
    In the first, a woman tells her husband not to bury her, is removed by the chief's
    son, and lives secretly with him. Her daughter discovers her while fetching fire.
    The husband verifies the empty burial container, gains flight and wizard power
    through contact with bones, and kills his wife and her lover with sharpened sticks.
    In the second, a chief's daughter kicks aside a skull, is visited by two dead
    chiefs' sons, and marries the elder, who appears as a fine young man to her but
    as a skull to others.
  language: English
  quote_policy: summarized
