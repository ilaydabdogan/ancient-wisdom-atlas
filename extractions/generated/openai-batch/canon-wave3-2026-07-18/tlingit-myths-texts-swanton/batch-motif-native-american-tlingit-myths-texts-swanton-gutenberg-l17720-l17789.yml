canonical_text:
  quote: ''
  summary: A canoe party approaches Mount Edgecumbe and Sitka. A named speaker directs
    them toward the mountain; a place is called Canoe-resting-place, and a sea-lion
    figure is made there as a sign of landing. At Sitka, an old wife who has been
    weeping sees the canoe and recognizes a spruce-root hat she had woven. The returning
    husband gives wealth to the people and shakes hands with his brothers-in-law.
    He is told that a death feast had long been held for him. A young woman is already
    married and grieves because she had left her first husband, now wealthy.
  language: English with Tlingit transcription and glosses
  quote_policy: summarized
