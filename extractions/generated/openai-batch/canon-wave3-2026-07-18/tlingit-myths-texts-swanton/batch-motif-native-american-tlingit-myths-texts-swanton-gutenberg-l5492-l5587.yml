canonical_text:
  quote: ''
  summary: A sequence of Raven episodes describes Raven transforming halibut fishers
    into a sky figure, killing seal people through deception, tricking and eating
    Deer, shortening ground-hog winter by removing toes, losing a fog-wife who produces
    salmon after mistreating her, failing to obtain a chief's daughter after Tsᴀgwâˊn
    exposes his cruelty, cursing Tsᴀgwâˊn, and making an old man temporarily young
    and handsome so that the chief's daughter falls in love with him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven asks people in a halibut-fishing canoe to come ashore and take him across,
    but they do not attend to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven threatens to put the canoe people in the sky, holds out his walking
    stick, and the canoe people go up into the sky as The-halibut-fishers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven invites seal people to a feast, smears pitch on each seal's forehead,
    blinds them when the pitch warms and runs over their eyes, and clubs them to death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven lays a rotten stick over a deep, narrow canyon and persuades Deer to
    try crossing after Deer first says it will break.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Deer falls to the bottom of the canyon and is crushed; Raven goes down, eats
    Deer, and then pretends to mourn him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven spends the winter in a ground-hog's house or hole, becomes sick of staying
    there, and calls out about winter coming on.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ground-hog is said to have had six toes, one for each month of its six-month
    stay in the hole; Raven pulls out one toe from each foot to shorten winter, explaining
    why ground-hogs have five toes now.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Raven marries the daughter of Fog-over-the-salmon, and while they lack food
    in winter his wife makes salmon appear by washing her hands in a large basket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Raven and his wife fill their house with drying salmon produced through her
    repeated basket-washing action.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: After a quarrel, Raven strikes his wife on the shoulder with dried salmon;
    she runs away, becomes impossible for him to seize, enters the water, and disappears
    with the dried salmon following her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage explains that Raven cannot catch his wife because she is fog.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Raven's father-in-law refuses to have the wife return because Raven had promised
    respect and care but did not keep that promise.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Tsᴀgwâˊn tells the people that Raven's first wife left him because he was
    cruel to her, and for this reason the chief's daughter is not given to Raven.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Raven says Tsᴀgwâˊn will live far out at sea, and the passage explains this
    as why Tsᴀgwâˊn is now always alone.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Raven tells an old man named Dᴀmnāˊdjî that he will make medicine to enable
    him to get the chief's daughter.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Raven makes the old man look young and handsome with feathers in his hair
    and a marten-skin robe, but says this appearance will last only a day or so.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The rejuvenated man paddles in a skin canoe to the girl, goes directly to
    her without asking her father's consent, and she immediately falls in love with
    him and agrees to marry him.
  category: sequence
  evidence_refs:
  - ev:9
