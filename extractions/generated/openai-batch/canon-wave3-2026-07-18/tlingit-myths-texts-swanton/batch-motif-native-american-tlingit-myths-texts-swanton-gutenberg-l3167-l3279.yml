  quote: ''
  summary: The passage contains the end of footnotes, the full story of a woman saved
    and kept by puffins after a canoe accident, and the opening of a story in which
    a mountain-sheep-associated youth is taken inside a mountain by beings connected
    with mountain sheep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women went at low tide to a neighboring island to dig shellfish; a breaker
    upset their canoe near a hole in the island, drowning all except one woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The surviving woman had previously admired the birds and said she wished she
    could sit among them; the birds saved her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: People in town beat drums for a death feast because they believed the woman
    had drowned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A canoe carrying the woman’s father passed the place, and he was told that
    his daughter was sitting among the birds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The puffin chief ordered the łᴀgwâˊtcǃ, described as the puffin’s slave, to
    braid the woman’s hair while she sat on the cliff edge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman’s father brought canoes filled with sea-otter, beaver, and marten
    skins for the birds, but the birds had taken the woman inside and the attempt
    failed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman’s mother proposed using old white hair that had belonged to her
    grandfather as a stratagem by spreading it on boards placed on the canoes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the canoes with the white hair reached the cliff, the birds flew out
    and each stuck a white hair in its head; the woman remained at the cliff at first.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the birds told the puffin chief about the hair, he ordered them to carry
    the woman back to her father and invited her to return if she tired of living
    with her father.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman had a nose like one of the birds because she had wanted to be one
    of them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sea gull is described as another slave of the puffin, and the Huna people
    say it calls a person’s name at that place because of its role when the woman
    was there.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Tǃᴀˊqǃdentān claim the island because some of their people drowned there,
    and they later built a house named after it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Wain-house people lived in a fort, hunted animals with spears and bows
    and arrows, stored the meat, set severed animal heads on sticks, and sang for
    them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A young man had been put into a mountain-sheep skin instead of a cradle at
    birth; when older he could follow mountain sheep to places others could not reach
    and killed more than the others.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The young man danced around severed heads and said he wished his own head
    were cut off; the sheep became tired of losing many of their number.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: During a mountain hunt, the young man became separated and met a shining,
    fine-looking man with a long white beard at the top of the mountain.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The shining man led the young man through a door into what seemed like a house
    but was the inside of the mountain, where piles of horns lay everywhere.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:18
  text: The young man’s companions searched, found his horn spear near the mountain
    top, and beat drums for him after failing to find him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: Mountain sheep heated horns in the fire and tried to fit them on the young
    man’s head, causing him to feel as if the insides of his head were coming out.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: About a year later, another hunter heard a voice among a flock of sheep on
    the mountain and identified it as the lost man’s voice, saying the mountain sheep
    had captured him.
  category: action
  evidence_refs:
  - ev:13
