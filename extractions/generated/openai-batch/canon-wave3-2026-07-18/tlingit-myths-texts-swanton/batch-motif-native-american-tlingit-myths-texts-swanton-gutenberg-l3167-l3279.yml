candidate_motifs:
- id: motif:1
  label: wish-linked human association with birds and partial bird feature
  taxonomy_refs:
  - shapeshifter
  basis: The woman had wished to sit among the birds, was saved and kept by them,
    and later had a nose like one of the birds because she had wanted to be one.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: medium
  cautions: The passage describes a partial bodily resemblance, not a full transformation.
- id: motif:2
  label: retrieval from animal people through valued offering or stratagem
  taxonomy_refs:
  - sacred_exchange
  basis: The father’s wealth-gifts fail, but the birds value the ancestral white hair,
    take it as head adornment, and the puffin chief then orders the woman returned.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The text calls the white hair a stratagem; it does not explicitly frame
    the act as a formal sacred exchange.
- id: motif:3
  label: etiology of bird markings and local bird behavior
  taxonomy_refs: []
  basis: The birds stick white hairs in their heads, explained as visible to the present
    day; the sea gull’s calling of names at the place is also explained by its status
    as puffin slave when the woman was there.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: This is an etiological pattern rather than a listed taxonomy motif family.
- id: motif:4
  label: place claim grounded in drowning event
  taxonomy_refs: []
  basis: The Tǃᴀˊqǃdentān claim the island because some of their people drowned there
    and later name a house after it.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives a social and place-name consequence, not a broader comparative
    motif label.
- id: motif:5
  label: animal retribution or capture after excessive hunting
  taxonomy_refs: []
  basis: The youth kills many mountain sheep, the sheep become tired of losing their
    number, and the later witness says the mountain sheep captured him.
  evidence_refs:
  - ev:9
  - ev:13
  confidence: medium
  cautions: The story excerpt ends before the outcome is given; the retaliatory interpretation
    is inferred from sequence but supported by the sheep’s stated reaction and capture.
- id: motif:6
  label: entry into hidden mountain interior
  taxonomy_refs:
  - ascent
  basis: The youth ascends with hunters to a mountain, is separated at the top, and
    is led through a door into the inside of the mountain.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The taxonomy reference is limited to the ascent to the mountain top; the
    main event is entry into the mountain interior, which is not itself one of the
    supplied motif-family labels.
- id: motif:7
  label: horn-fitting transformation or initiation by mountain sheep
  taxonomy_refs:
  - initiation
  - shapeshifter
  basis: Inside the mountain context, the mountain sheep heat horns in a fire and
    try to fit them on the young man’s head.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: medium
  cautions: The passage does not complete the episode, so whether this is an initiation,
    punishment, or transformation remains uncertain.
