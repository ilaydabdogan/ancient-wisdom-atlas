canonical_text:
  quote: ''
  summary: Qakēˊqǃᵘtê comes in sight of X̣ᴀkᴀnuwūˊ and finds no smoke or people outside.
    After entering the town, he finds the people dead where they slept, a disaster
    attributed to his having knocked down Sleep. The episode is remembered in a saying.
    He then gathers blankets, ornaments, tools, a painted death drum, red paint, and
    special snowshoes, intends to die with these things, and travels toward the mountain
    Tsᴀłxāˊn without ordinary food.
  language: English with Tlingit interlinear text included
  quote_policy: summarized
