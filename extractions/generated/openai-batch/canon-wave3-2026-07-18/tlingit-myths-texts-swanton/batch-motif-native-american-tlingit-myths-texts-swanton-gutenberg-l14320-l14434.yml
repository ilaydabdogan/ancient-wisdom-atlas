canonical_text:
  quote: ''
  summary: A boy, identified as the son of the heron who came to help a woman, repeatedly
    leaves home, kills dangerous beings associated with roads and bones, and brings
    their heads to his mother and grandmother. He raises a sharp-edged hīn-taỵīˊcî,
    kills it, and uses its skin as a coat. After learning that his uncles disappeared
    by sea, he uses the coat to enter the arms of a devilfish, cut up its tentacles
    and color sac, swim out, and return; the devilfish is said to have destroyed people.
  language: English and Tlingit
  quote_policy: summarized
