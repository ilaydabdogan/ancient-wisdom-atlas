canonical_text:
  quote: ''
  summary: A man is urged by his wife not to disbelieve a dream. After another dream
    in which the North man asks for his daughter, a nephew tells him to call out that
    he gives a person. North Wind then comes to the daughter, marries or cohabits
    with her, and calm weather follows. During a bay crossing, blood connected with
    the fine man is bailed from the canoe and the water where it is poured becomes
    clear; a saying explains fearlessness of weather by asking whether one has given
    a daughter to the wind. In a later winter episode, Heavy-wing seeks a replacement
    labret for his wife and encounters a woman-like nonhuman being, the ʟǃêˊnᴀxx̣īˊdᴀq,
    digging on the beach with a child on her back and mussel shells that fit together.
  language: Tlingit with English translation; one brief Latin sentence appears in
    the English prose translation.
  quote_policy: summarized
