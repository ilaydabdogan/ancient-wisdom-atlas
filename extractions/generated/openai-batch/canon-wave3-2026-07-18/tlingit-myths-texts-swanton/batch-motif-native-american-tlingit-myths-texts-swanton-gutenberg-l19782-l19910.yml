canonical_text:
  quote: ''
  summary: The passage describes the naming and settlement of Mountain House by the
    Cāˊdᴀdūx, a man making a skin-boat frame, Kǃwâdēˊłtᴀ rearing a sea gull that becomes
    enormous and swims away as she disappears after it, and a canoe expedition by
    six nephews who encounter eulachon and kǃāˊgᴀn, offend the fish by laughing, and
    are driven back by wind with loss and delay.
  language: English with Tlingit interlinear text and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Houses were made alongside a river; the place was named Mountain House, people
    stayed there, and it became a town.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cāˊdᴀdūx grew strong and are identified as the builders of Mountain House.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After ten years at Mountain House, one person began living away from town
    in order to work on the frame of a skin boat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kǃwâdēˊłtᴀ reared a young sea gull, which did not grow large until she did
    something to it; it then became as large as an eagle and nearly as large as a
    house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the sea gull became large, Kǃwâdēˊłtᴀ wanted to take it among her playmates,
    while her brothers wanted to kill it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: While Kǃwâdēˊłtᴀ was playing with the sea gull, it swam out of the mouth of
    the river; she also disappeared and started after it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A song described as difficult and having many kinds of notes was used over
    Kǃwâdēˊłtᴀ.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man sent six nephews in the canoe he had made, instructing them to go
    along shore and search for people when the weather was good.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The nephews discovered eulachon and kǃāˊgᴀn in a creek, used a small net for
    the eulachon, put living kǃāˊgᴀn into a small cooking basket, and laughed at them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the nephews set out at daybreak, a south wind arose at sea, preventing
    travel and forcing them back to their starting point.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The narrative summary says their skin canoe was broken, one person was killed
    under it, they stayed there probably twenty-one days, lived on kǃāˊgᴀn and eulachon,
    and started again when the weather became fair.
  category: sequence
  evidence_refs:
  - ev:9
