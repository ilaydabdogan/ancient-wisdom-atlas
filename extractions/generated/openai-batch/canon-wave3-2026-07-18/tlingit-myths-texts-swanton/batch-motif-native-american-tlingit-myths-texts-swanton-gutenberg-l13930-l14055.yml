- id: obs:8
  text: The nephew's spirits come to him while the uncle is with him, and the uncle
    beats time with sticks for him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The nephew tells his uncle to remember that when the spirit Nīx̣âˊ runs into
    the fire with him, the uncle must not let him burn up and must throw him into
    a basket while he is getting small.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nīx̣âˊ runs into the fire with him; the uncle throws him into the basket,
    and he comes alive inside the basket and becomes a big man again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: That evening the nephew sends his uncle out to call those who can sing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mountain sheep come down to look into the cave, making the cliff hardly visible;
    when they are seated, he whirls his bow and arrows and all the mountain sheep
    are destroyed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The inside of the cave is full of mountain sheep, and the nephew tells his
