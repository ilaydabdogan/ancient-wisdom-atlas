    that the uncle's wife scratched the inside of his cheek; instead he says cave
    spirits told him to come there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cave is described as large and bigger than a house.
  category: setting
  evidence_refs:
