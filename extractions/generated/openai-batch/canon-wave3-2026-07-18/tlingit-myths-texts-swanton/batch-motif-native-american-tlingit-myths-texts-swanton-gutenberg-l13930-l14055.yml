canonical_text:
  quote: ''
  summary: An uncle searches for his nephew and finds evidence of the nephew's camps
    by a creek and cliff cave. The nephew says cave spirits told him to come there,
    concealing that the uncle's wife had scratched his cheek. Spirits come to the
    nephew; with the uncle assisting by beating time, the named spirit Nīx̣âˊ runs
    into fire with him, and the uncle is instructed to place him in a basket as he
    becomes small. He comes alive in the basket and becomes a big man again. Later,
    mountain sheep come down toward the cave, are destroyed when he whirls his bow
    and arrows, and the cave is filled with them.
  language: English with Tlingit interlinear
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seagull and eagle are described as coming to hear everything from him, and
    his spirit destroys them when they go.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The uncle hunts for the nephew for eight days and finds the nests the nephew
    had made or camped in by a creek.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The uncle sees salmon in the creek, camps under the nest, listens, and hears
    the beating of shamans' sticks in the middle of the cliff.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before the uncle thinks the nephew has seen him, the nephew speaks to him
    and tells him he came underneath by the wrong way.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The uncle pities the nephew, is told to come up by a corner, and the nephew
    is thereafter named For-little-slave.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
