canonical_text:
  quote: ''
  summary: A decorated boy is rejected and later humiliated by a girl cousin who makes
    him give up his robe, hair, and shell ornaments. A loon appearing as a man carries
    him over the sea, restores his hair and ornaments, and brings him to a distant
    village where he marries a chief’s daughter whose father is the Calm. After many
    years the couple returns to the boy’s people under instructions concerning water
    and former lovers. A former sweetheart seizes and speaks to him; his wife’s water
    turns slimy, she leaves, becomes intangible to him, walks over the sea, looks
    back at him, and he sinks into the ocean.
  language: English
  quote_policy: summarized
