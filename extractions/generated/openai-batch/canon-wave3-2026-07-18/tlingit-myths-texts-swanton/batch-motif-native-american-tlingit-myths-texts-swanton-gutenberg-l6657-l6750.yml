canonical_text:
  quote: ''
  summary: 'The passage recounts several episodes: two young men seek wizardry, learn
    witchcraft through sleep and dream instruction, and take goose and brant forms;
    a fasting man discovers them and accepts payment to keep silent; witchcraft is
    said to have spread through named persons and the Haida, including by berries.
    Shamans describe witchcraft as a system of creeks. Raven causes boys from Cold-town
    to drown and remain as long-voiced sea birds. Raven then instructs a disgraced
    gambler to fast with devil’s clubs, receive help from Greatest Gambler, learn
    the names and marks of gambling sticks, and find valuable sea animal skins on
    his return.'
  language: English
  quote_policy: summarized
