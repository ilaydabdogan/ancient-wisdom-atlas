candidate_motifs:
- id: motif:1
  label: Witchcraft initiation through sleep, dream, and animal form
  taxonomy_refs:
  - initiation
  - shapeshifter
  basis: The young men seek wizardry, sleep at a prescribed place, receive teaching
    from a woman identified as a mouse, and later take goose and brant forms in a
    dream sequence.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames this as witchcraft origin and practice; broader initiation
    or shapeshifter categories are taxonomy-level grouping only.
- id: motif:2
  label: Hidden transgressors discovered through fasting and dream knowledge
  taxonomy_refs:
  - forbidden_knowledge
  - wisdom
  basis: A man fasts, drinks salt water, makes medicine, dreams about the two wizards,
    and confronts them with what he knows.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not present the knowledge as universally forbidden, but
    it is concealed and paid to be kept secret.
- id: motif:3
  label: Moralized ritual map of harmful behavior as waterways
  taxonomy_refs:
  - wisdom
  basis: Shamans describe witchcraft as a large creek fed by named creeks of lying,
    stealing, and profligacy.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This is an explanatory image rather than a narrative action motif.
- id: motif:4
  label: Raven causes drowning and fixes drowned boys as sea birds
  taxonomy_refs:
  - trickster_boundary
  - shapeshifter
  basis: Raven’s canoe outing leads to the boys’ drowning, after which he tells them
    to stay, and they are identified as sea birds.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not explicitly state the mechanics of transformation;
    it identifies the drowned boys as the sea birds.
- id: motif:5
  label: Fasting ordeal for gambling power
  taxonomy_refs:
  - initiation
  - wisdom
  basis: Raven instructs Qonᴀłgīˊc to fast, eat devil’s clubs, build a devil’s-club
    house, and await Greatest Gambler, after which he receives knowledge of gambling
    sticks.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:15
  confidence: high
  cautions: The motif is specific to gambling instruction and ritual discipline in
    this passage.
- id: motif:6
  label: Dream patron embodied as plant teacher
  taxonomy_refs:
  - initiation
  basis: Greatest Gambler appears in a dream and says the huge devil’s club from which
    bark was stripped was himself.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: No taxonomy reference for plant-spirit encounter is available; initiation
    is the closest supplied family.
- id: motif:7
  label: Named marked game implements linked to animal powers
  taxonomy_refs:
  - wisdom
  basis: The gambling sticks receive names and marks, including devilfish and other
    animal and fish names, and knowledge of the devilfish stick is tied to luck.
  evidence_refs:
  - ev:12
  - ev:15
  confidence: medium
  cautions: The passage gives practical and symbolic details but does not fully explain
    the powers of each named stick.
comparison_claims:
- id: claim:1
  claim: The passage itself claims a transmission relationship in which witchcraft
    came to Alaska through the sons of ᴀyāˊyî and through the Haida, and berry-related
    witchcraft knowledge was learned from the Haida.
  claim_level: historical_contact
  target: Haida-related transmission of witchcraft practices to Alaska/Tlingit context
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: This records the passage’s internal claim; it is not independent historical
    verification.
- id: claim:2
  claim: The passage states that the named and marked gambling sticks are the same
    among both Tsimshian and Tlingit.
  claim_level: same_function
  target: Tsimshian and Tlingit gambling-stick naming and marking practice
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports similarity of the gambling-stick set, but does
    not provide a full comparative description of Tsimshian practice.
