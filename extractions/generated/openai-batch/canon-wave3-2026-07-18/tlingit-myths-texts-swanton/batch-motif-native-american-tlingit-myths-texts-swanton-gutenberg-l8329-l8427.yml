candidate_motifs:
- id: motif:1
  label: prophetic spirit song fulfilled in battle aftermath
  taxonomy_refs:
  - wisdom
  basis: The shaman’s spirit sings of a raven swinging back and forth before the battle;
    after Yēł-x̣āk’s body moves with a log in the river, the shaman identifies this
    as the meaning of the song.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage presents the song as spirit knowledge and retrospective interpretation,
    but does not give a broader taxonomy label; the supplied 'wisdom' family is only
    a loose fit.
- id: motif:2
  label: victory through superior or unusual weapon material
  taxonomy_refs: []
  basis: Cādisîˊktc’s spear points are iron, while the Chilkat still have bone and
    mountain-goat horn points; Yēł-x̣āk’s spear does not seem to hurt Cādisîˊktc,
    but Cādisîˊktc kills him.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly state that iron alone causes the victory,
    though the contrast in spear-point materials is emphasized.
- id: motif:3
  label: capture and ceremonial handling of totemic objects in war and peace
  taxonomy_refs:
  - sacred_exchange
  basis: A totem pole is taken after victory; later Ckūˊwu-yēł brings a captured copper
    raven to make peace, while a raven hat and ānkᴀx̣wāˊî are brought out with eagle
    down in the peace ritual.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage supports ceremonial exchange and display, but the exact ritual
    category should be verified by a human reviewer.
- id: motif:4
  label: ritual transformation into a deer for peacemaking
  taxonomy_refs:
  - initiation
  basis: Ckūˊwu-yēł is seized to be made a deer, governed by deer rules, tested through
    a forbidden food, and later his father-in-law is also carried away to be deer
    on the other side.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: low
  cautions: The passage describes a ritual status called deer, but it does not present
    this as a personal transformation or initiation in the broader mythological sense;
    'initiation' is a tentative taxonomy fit.
- id: motif:5
  label: taboo test confirms peaceful intent
  taxonomy_refs: []
  basis: The deer is not supposed to eat devilfish or fresh fish; others use the situation
    to see what Ckūˊwu-yēł will say, and his request for devilfish leads them to declare
    that he has come to make peace.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The reason that asking for forbidden food proves peace is specific to
    the described ritual and is not fully explained beyond the passage.
- id: motif:6
  label: peace expressed through calm travel and sleep metaphors
  taxonomy_refs: []
  basis: Questions about a canoe ashore, a sunny and sheltered camp, lack of waves,
    and sleeping well are explicitly explained as figurative speech for no more war
    and the end of troubles.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is a passage-specific speech pattern rather than a confirmed broader
    motif family.
