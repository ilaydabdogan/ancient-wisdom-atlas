canonical_text:
  quote: ''
  summary: A war party prepares with animal-emblem headgear, iron spear points, drilling
    songs, shamanic instructions, and allied support. At Chilkat, Cādisîˊktc confronts
    and kills Yēł-x̣āk; the shaman interprets a previously sung raven image as fulfilled
    by the dead body moving with a log, and the victors seize a totem pole. Later
    Ckūˊwu-yēł travels with a captured raven object to make peace. A ritual called
    making him a deer occurs in Sleep house, involving eagle down, painted faces,
    a food-taboo test, dancing, reciprocal ritual action, and formulaic speech about
    canoes, calm camping, and sleeping well as metaphors for the end of war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war hat for Cādisîˊktc was made with a carving of a monster rat said to
    live under Wasǃīˊcā mountain, and his spear points were made from iron that the
    people believed had grown in timber.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: War canoes went from Kosǃēˊx toward Chilkat while drilling; the party camped
    where the shaman said Łᴀˊkua had camped, because going farther was thought to
    bring bad luck.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Allied families joined the expedition and were paid with copper plates, while
    the shaman’s spirit repeatedly sang about a raven swinging back and forth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the Chilkat fort, Yēł-x̣āk asked for Cādisîˊktc, who came forward wearing
    the mouse war hat and said that he had been in a great mountain belonging to his
    mother’s uncle and had come out after Yēł-x̣āk.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yēł-x̣āk’s bone or mountain-goat-horn pointed spear did not seem to injure
    Cādisîˊktc, while Cādisîˊktc speared Yēł-x̣āk through the heart; Yēł-x̣āk’s body
    floated downriver and moved up and down against a log.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The shaman identified Yēł-x̣āk’s body moving with the log as the raven moving
    back and forth from the spirit’s song, and said the enemy was now overcome.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Yēł-x̣āk’s death, the Chilkat people fled toward the mountains, and
    the ʟǃūkǃnᴀxᴀˊdî took the totem pole ānkᴀx̣wāˊî; the narrator links this to an
    earlier omen of a chip flying toward Huna and a tree falling toward it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ckūˊwu-yēł, distressed over the loss of his totem, took a captured copper
    raven and went toward Kᴀqǃᴀnuwūˊ to make peace; his wife’s father was head chief
    of the ʟǃūkǃnᴀxᴀˊdî.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: As Ckūˊwu-yēł approached the ʟǃūkǃnᴀxᴀˊdî town, a man ran toward the canoe
    pretending to kill him, but a Kāˊgwᴀntān person restrained him and referred to
    Ckūˊwu-yēł’s higher status.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ckūˊwu-yēł was seized to be made a deer and taken into Sleep house; his wife
    brought a captured raven hat with eagle down on it, and the others brought out
    ānkᴀx̣wāˊî with eagle down on it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The face of the deer and the face on the Sleep corner post were painted, and
    the narrator says this painting ended their troubles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Although the deer’s rules forbade devilfish and fresh fish, Ckūˊwu-yēł asked
    for devilfish; the others took this as proof that he had come to make peace and
    danced for him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The G̣ānᴀxteˊdî later carried away Ckūˊwu-yēł’s father-in-law to be deer on
    the other side.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Formulaic questions about whether the canoe was ashore, whether they would
    camp in a sunny and sheltered place, and whether the deer would sleep well were
    explained as ways of asking whether war and trouble would stop.
  category: speech
  evidence_refs:
  - ev:10
