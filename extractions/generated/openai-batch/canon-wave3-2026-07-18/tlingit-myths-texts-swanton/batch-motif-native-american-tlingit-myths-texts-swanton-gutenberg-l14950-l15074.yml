canonical_text:
  quote: ''
  summary: A little mouse relays a grandmother's invitation to enter a house. The
    grandmother receives two visiting women called granddaughters, feeds them food
    taken from between her teeth, and asks why they have come. They answer that they
    seek Mountain Dweller because it was said he would not marry them. The grandmother
    says he is difficult to approach and instructs them about fighting dogs, floating
    kelps, Crushing-mountain, and items to carry. The women set out, use a dry fish
    bone, moss, and a whetstone to pass the obstacles, and reach Mountain Dweller's
    camp. Mountain Dweller's mother is at home in a fat-filled house; she receives
    and feeds them. When the hunter returns with food and asks about them, his mother
    says they came to marry him because it had been said he would not marry them,
    and Mountain Dweller marries both women.
  language: Tlingit with English gloss and English prose translation
  quote_policy: summarized
