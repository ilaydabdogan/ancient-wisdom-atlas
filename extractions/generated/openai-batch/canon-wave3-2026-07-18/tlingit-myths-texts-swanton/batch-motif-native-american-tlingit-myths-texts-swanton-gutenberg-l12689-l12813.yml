canonical_text:
  quote: ''
  summary: A high-caste woman goes berrying, angrily addresses grizzly bear dung,
    and is later approached by a man who asks to marry her and leads her into the
    woods. The narrative identifies him as the grizzly bear whose dung she addressed.
    She lives among grizzly-bear people, experiences danger connected with their salmon
    trips and firewood practices, receives help and advice from a grandmother mouse,
    flees from pursuing grizzly bears, reaches a lake, and is taken by a speaking
    canoe up into the sun.
  language: Tlingit with English interlinear gloss and English narrative translation
  quote_policy: summarized
