canonical_text:
  quote: ''
  summary: The passage recounts a shamanic episode in which a raft and people believed
    destroyed come up from underneath; the shaman’s spirits declare them unharmed.
    It then describes the shaman displaying power against a land otter by sending
    a clothes man with a spear, spitting on the spear, speaking for strength, striking
    the land otter’s tail, creating place names from the event, cutting off the land-otter
    tongue after an eight-day fast, and living for more than a hundred years through
    the strength of his spirits.
  language: English with Tlingit interlinear text
  quote_policy: summarized
