canonical_text:
  quote: ''
  summary: Qakēˊqǃᵘtê travels through the Alsek and Cape Fairweather region using
    clawed snowshoes and mountain-cloud weather signs. At a ground-hog place he sets
    a trap, and the passage says people know how to fix such a trap from him. Expecting
    food, he finds a frog in the trap and says it pretended to be a ground hog. Lonely,
    he goes toward apparent people at Seaweed Point, discovers they are stones resembling
    people, and continues toward the upper Alsek.
  language: Tlingit with English gloss and English prose translation
  quote_policy: summarized
