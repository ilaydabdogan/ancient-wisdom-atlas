  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A young man about to marry was warned that if he failed to care for his wife
    he might lose her, while good treatment of a good wife would bring money and property.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tsᴀgwấn is described as a mischief maker who followed Raven to tell what
    Raven had done to his wife; the episode is applied to a person who does not tell
    the truth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that property settlement was formerly made when a man left
    his wife, and remarriage before settlement could cause trouble between the first
    and second wives.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Dᴀmnā́djî married a woman of higher family than himself and was taunted by
