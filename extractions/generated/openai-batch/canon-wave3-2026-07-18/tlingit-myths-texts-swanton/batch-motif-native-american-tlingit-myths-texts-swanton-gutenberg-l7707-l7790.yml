canonical_text:
  quote: ''
  summary: 'A sequence of footnotes records how Tlingit story episodes were cited
    as social instruction: to mock false claims of age or wisdom, warn children against
    laziness, deter secret murder or cowardice, identify hypocritical mourning and
    jealousy with Raven, caution adolescent girls against improper wandering and foolish
    influence, instruct young men about marriage and property, and draw lessons from
    Tsᴀgwấn and Dᴀmnā́djî concerning truthfulness, rank, wealth, in-law respect,
    humility, purity, and luck.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A saying about Sculpin and Raven is applied to people who claim to be very
    old and knowledgeable; the saying predicts that an older person will expose the
    pretender.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children going out in the evening are described as saying that the sculpin
    is visible up there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lazy and disobedient children were told that halibut fishermen got up into
    the sky because of laziness, and this made children fear being lazy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One cited episode was used to prevent a child from being a secret murderer
    or a coward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When an enemy of a dead man acted sorrowful in the house where the body lay,
    people compared him to Raven after Raven killed his friend the deer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same Raven-and-deer episode was also applied to a jealous person when
    a well-brought-up and prosperous person died.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Girls of about fourteen or fifteen who wanted to run about to feasts without
    their mothers or grandmothers were compared to Raven imprisoned in the ground-hog
    hole and wanting to get out.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Girls who stayed indoors were said to be respected, while Raven was also likened
