canonical_text:
  quote: ''
  summary: The passage recounts episodes involving a shaman’s spirit-assisted predictions,
    a fatal bear hunt followed by revival of the dead man using red paint, a raven-and-stick
    war rite preceding the destruction of a fort, the death of five women on a reef,
    a friendly visit by Yakutat people in an abalone-covered canoe, an insult involving
    damage to that canoe for firewood, and reciprocal destruction of copper plates
    in response.
