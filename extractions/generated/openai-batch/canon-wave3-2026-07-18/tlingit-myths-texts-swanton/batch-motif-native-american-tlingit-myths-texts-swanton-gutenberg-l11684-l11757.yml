canonical_text:
  quote: ''
  summary: Two crest-origin accounts are given. In the first, the Nanỵaāˊỵî climb
    a mountain during the flood while a grizzly bear and a mountain goat accompany
    them; they preserve and replace a grizzly bear skin and claim the grizzly bear,
    while also keeping a less-valued mountain goat head. In the second, a Stikine
    Kîksᴀˊdî man kicks a frog, loses his senses, and is said to have had his soul
    taken to the frog people, where the frog chief releases him because the frog woman
    and frog people belong to the same clan; the Kîksᴀˊdî then claim the frog.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the time of the flood, the Nanỵaāˊỵî climbed a mountain on the Stikine
    River called Sēkuˊqłe-ca, accompanied by a grizzly bear and a mountain goat that
    stopped and moved when the people did.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people killed the grizzly bear, preserved its skin with claws and teeth
    intact, replaced the skin when it deteriorated, and claim the grizzly bear for
    that reason.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the bear skin was shown, large amounts of slaves and furs were given
    away, and Shakes chiefs went to rows of slaves and slapped them, after which each
    slave had to be killed or sent home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The group also has the head of the mountain goat, but values it less highly
    than the grizzly bear.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Stikine Kîksᴀˊdî man kicked a frog onto its back and then lay motionless,
    unable to talk, after which his body was carried into a house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The narration says the frogs had taken the man's soul and tied it to a house
    post; some frogs proposed letting him starve, while others wanted to feed him
    and wait for the chief.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The frog chief Frightful-face arrived by canoe, was welcomed, and was told
    that the man had thrown down and kicked a frog woman named Woman-in-the-road.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Frightful-face said the frogs belonged to the man's clan, that the woman was
    of the same clan, and that the man should go back to his own village.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the man left the frogs' house, his body at home came to; he recounted
    the events, and the Kîksᴀˊdî claim the frog because the frog said he was Kîksᴀˊdî.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
