canonical_text:
  quote: ''
  summary: A youth grieving for his lost playmate finds the arrow chain transformed
    into a ladder and ascends to the sky. Berry bushes placed in his hair feed him
    on the journey. At the top he meets a small girl and her grandmother, an old woman
    who tells him his playmate is in the moon's house, feeds him, and gives him objects.
    He rescues the captive through a smoke hole, leaves a spruce cone to imitate the
    captive's cries, and flees from the pursuing moon using objects that become obstacles.
    The old woman instructs the boys to return by lying down and thinking only of
    their playground; they wake at the foot of the ladder. They then observe a death
    feast held for them, and the head chief's younger son reports seeing them, though
    his mother initially disbelieves him.
  language: English
  quote_policy: summarized
