canonical_text:
  quote: ''
  summary: A canoe party’s skin canoe breaks and one person dies. The survivors stay
    until weather improves, reach Yakutat, are refused permission to remain, and return
    toward their own place. At the foot of a big mountain they learn that a little
    girl has been named after a woman who followed a sea gull. The girl later digs
    up a long red object, from which a dish is made to replace one taken away. Drums
    and a song commemorate the sea-gull-following woman. Later, a Kā́gwantān party
    from the mouth of Copper River arrives by skin canoe and is received with food.
  language: English with Tlingit interlinear text
  quote_policy: summarized
