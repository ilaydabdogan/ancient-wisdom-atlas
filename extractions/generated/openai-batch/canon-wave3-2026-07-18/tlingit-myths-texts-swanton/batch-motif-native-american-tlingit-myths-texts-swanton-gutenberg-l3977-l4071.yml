candidate_motifs:
- id: motif:1
  label: Cliff ascent test reveals hidden bird-like ability
  taxonomy_refs:
  - ascent
  basis: Murrelet fails the cliff test until given his usual equipment, then ascends
    in claw snowshoes, calls like a murrelet, flies to the top, and lights fires.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents Murrelet as bird-associated but does not explicitly
    describe a transformation.
- id: motif:2
  label: Bound companion rescued by cutting enemy canoe bonds
  taxonomy_refs: []
  basis: The steersman is tied to all canoe ropes as an anchor; Murrelet descends,
    tells him to cry louder, cuts the ropes, and the war canoes drift away.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The phrase about turning the world over with his foes is reported but
    not explained in the passage.
- id: motif:3
  label: Captive mother and sorrow-born spirit power of the son
  taxonomy_refs: []
  basis: A captive pregnant woman bears a son among southern people. After learning
    of his mother's slave status and seeing her injured, sorrow causes him to have
    a powerful spirit, through which he earns enough blankets to buy her freedom.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not describe a formal initiation; it states only that
    sorrow made him have the spirit.
- id: motif:4
  label: Blood applied to a child to confer bravery
  taxonomy_refs: []
  basis: The mother takes some of her son's blood and puts it on his nose to make
    him brave.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives the action and purpose but no further ritual explanation.
- id: motif:5
  label: Spirit-guided voyage with fasting and strength-bearing birth
  taxonomy_refs:
  - miraculous_child
  basis: The son travels north with his parents under spirit guidance, his mother
    is covered with matting, the group anchors offshore, his mother becomes pregnant
    in an unexplained way, something born from her has strength, and the shaman does
    not eat.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The wording of the pregnancy and birth is obscure; the exact identity
    of what is born is not clear from the passage alone.
- id: motif:6
  label: Body map of conquest marked by smoking and burning spots
  taxonomy_refs: []
  basis: The son marks black spots on his arm equal to the towns he intends to conquer;
    while helpers work with his spirits, the spots smoke and burn, and one spot is
    cleaned away to spare a place.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage explains the spots' intended reference to towns, but broader
    symbolic interpretation should remain tentative.
- id: motif:7
  label: War trophy display around the canoe
  taxonomy_refs: []
  basis: After the fort attack, attackers scalp the dead, put the scalps on sticks,
    and tie them around the canoe while naming the action as shouting out for the
    scalped heads.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a violent war-trophy pattern; no additional ritual meaning is
    supplied beyond the passage's name for the act.
- id: motif:8
  label: Place-name etiology from carrying a canoe over land
  taxonomy_refs: []
  basis: A spy canoe is chased ashore, carried across a narrow strip of land, and
    the passage says the place is therefore called Things-taken-over.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The place-name explanation is limited to this incident.
- id: motif:9
  label: Primordial dating by reference to Raven's making of the people
  taxonomy_refs: []
  basis: The passage places the events very close to the time when Raven made the
    people.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: Raven is only mentioned in a chronological aside and does not act within
    the narrated episode.
