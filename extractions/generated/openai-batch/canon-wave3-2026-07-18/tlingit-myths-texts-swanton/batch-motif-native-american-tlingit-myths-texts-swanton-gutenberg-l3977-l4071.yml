canonical_text:
  quote: ''
  summary: Murrelet is tested at a cliff, at first fails, then ascends by using special
    gear, bird-like movement, and flight. He later rescues his steersman by cutting
    canoe ropes. A captured high-caste pregnant woman bears a son among southern people;
    the son gains spirit power through sorrow, frees his mother, returns north under
    spirit guidance, and prepares for war using smoking marks on his arm to represent
    towns. Subsequent scenes describe fort attacks, enslavement, scalping, named places,
    a reference to Raven as maker, and a southern war party.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war chief and his friends took Murrelet ashore to Bell point, where part
    of Huna is, to test him at a cliff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Murrelet was told to go up the cliff, fell back into the canoe three times,
    and was laughed at by people in the canoes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Murrelet said he normally climbed with a stone ax, a staff, a flint, and a
    seal's stomach full of grease; these were prepared for him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Murrelet ascended wearing claw snowshoes, called like a murrelet, went up
    flying, appeared at the top of the mountain, and lit fires along the top.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The warriors tied all canoe ropes to the body of Murrelet's steersman, intending
    to use him as an anchor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narration says the steersman was probably Murrelet's brother, but also
    says this was hard to determine.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Murrelet heard the steersman crying, ran down the mountain, told him to cry
    louder, cut all the ropes, and the war canoes floated away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After a fort was captured, a high-caste pregnant woman was saved, carried
    south, and cared for; her child was born among the southern people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The child's mother put some of his blood on his nose to make him brave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The son learned that he and his mother were slaves after a young man kicked
    his mother in the nose; sorrow caused him to have a spirit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The spirit-possessed son ordered a large paddle made, earned enough blankets
    through his services to purchase his mother's freedom, and prepared to travel
    north with his parents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: On the northward journey, matting was put over the mother, the travelers anchored
    offshore when encamping, the mother became pregnant, something born from her had
    strength, and the shaman did not eat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: When he returned, friends helped him show his spirits; black spots from wrist
    to elbow represented towns he intended to conquer, and the spots smoked and burned
    one after another.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At his father's request, the burning stopped at the elbow spot, which he cleaned
    away, signifying that he would not fight at that place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: His friends went to war openly; the fort people called them Chilkat people,
    and the passage says there was no iron, only mussel-shell knives, spears, and
    round wooden fighting hats.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: The attackers destroyed all the men at the fort, enslaved women and children,
    scalped the dead, put scalps on sticks around the canoe, and named the act as
    shouting out for the scalped heads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The passage identifies the people doing these acts as Kāˊgwᴀntān, says they
    started from ʟucāˊcakǃî-ān and Kᴀqǃᴀnuwūˊ, and places the events close to the
    time when Raven made the people.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: A later southern war party came north by the outside passage, included about
    a hundred canoes, destroyed Murrelet-point fort, captured women, and used bows
    and arrows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: One canoe sent to spy was chased ashore but carried across a narrow strip
    of land, giving the place the name Things-taken-over.
  category: sequence
  evidence_refs:
  - ev:9
