canonical_text:
  quote: ''
  summary: A man arrives at a wolf-chief’s village, sees the wolf-chief’s son and
    a rainbow toy or sign, and receives instead of the son a fish-hawk quill and a
    two-sided blanket with instructions for killing, healing, and reviving. On returning
    after an anomalous lapse of time, he uses the quill for hunting and the blanket
    to restore destroyed people, then uses the blanket elsewhere to kill and revive
    people for payment, becoming famous and wealthy. The passage then begins the story
    of Wolverine-Man, describing old hunting practices, ritual preparation, a hunter’s
    mountain journey, a wolverine killing sheep, and an open house containing fat
    from animals the wolverine had killed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man lands on the other side, makes his canoe small, puts it in his pocket,
    and goes among boys who are playing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys are playing with a round, twisted thing named gîtcxᴀnag̣āˊt, identified
    in the passage as rainbow.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man is directed to the wolf-chief’s house at the far end of the village,
    where an old-style evening fire is burning and the little wolf is playing near
    it in front of his father.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolf chief says a human being is looking in; the little wolf runs to the
    man, smells him, and knows him at once.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wolf chief says he let his son live among the man’s people because the
    man’s uncles and friends were starving, and says he is pleased the man came after
    him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wolf chief decides not to send his son back, but gives the man a fish-hawk’s
    quill from the wall and instructs him to hold it toward a bear so that it will
    fly out of his hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wolf chief also gives the man a tied-up object like a blanket, saying
    one side cures sickness and the other side can kill or be used in connection with
    paid treatment.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The wolf chief says the rainbow-like thing belongs to him and explains that
    seeing it in the evening means bad weather, while seeing it in the morning means
    good weather.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Something is put into the man’s mouth for a long journey; he is gone up there
    probably two years, although he thinks it was only two nights.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: On the way back, the man uses the quill against a bear and then against mountain
    sheep; the quill is found in the heart of the last sheep.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The man finds his town empty and destroyed, lays the saving side of the blanket
    on the bodies, and they all come to life.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The people restored after being dead for many years have very deep-set eyes
    and do not recover at once.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: The man hides the quill from his hunting companions, kills mountain sheep
    with it, retrieves it, and receives payment for meat from people who are not his
    close friends.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: In another town, the man kills some healthy people with his blanket, offers
    to make them well, and brings them back to life.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The man repeats the same activity in many places and becomes famous and the
    richest man of his time through paid services for sick people.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: The Wolverine-Man section states that in old times people hunted without guns,
    using bows, arrows, and horn spears, and that hunting preparation included fasting
    and washing heads in urine.
  category: other
  evidence_refs:
  - ev:15
- id: obs:17
  text: A hunter washes his head in urine, carries a horn spear up a valley, sees
    mountain sheep, camps, and then sees a wolverine among the sheep killing them.
  category: action
  evidence_refs:
  - ev:16
- id: obs:18
  text: The hunter reaches a mountain top, finds an open house, sees pieces of fat
    from many animals the wolverine had killed, wants to enter, but waits in nearby
    brush.
  category: setting
  evidence_refs:
  - ev:17
