- id: motif:2
  label: Substitutionary gift from animal chief
  taxonomy_refs:
  - sacred_exchange
  basis: The wolf chief says he will not let his son return but will help the man
    in another way, then gives the quill and blanket with instructions.
  evidence_refs:
