  quote_or_summary: The łuqᴀnaˊ, the chief’s nephew, performs early and later eats
    at the feast. Labret piercings were not made at the feast, but many blankets were
    given by the girl’s father when it occurred, and the work was done by someone
    of the opposite phratry.
