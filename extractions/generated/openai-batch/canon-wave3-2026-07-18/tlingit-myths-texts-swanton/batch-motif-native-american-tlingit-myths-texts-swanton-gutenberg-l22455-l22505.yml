canonical_text:
  quote: ''
  summary: A ceremonial passage gives speeches and procedures around dances, a feast,
    property distribution, labret-related gifts, and masked shows. One speaker thanks
    his father’s people for support in mourning and compares their gift of a house
    to sea-lion people giving a poor man a box to bring him ashore. A chief humbles
    himself by comparing his feast to a codfish head found by a starving woman after
    brants brought her misfortune. The passage also describes invitation responses,
    calling for dishes by rank, the role of the chief’s nephew, and masked performers
    treated as returning dead relatives or supernatural beings.
  language: English
  quote_policy: summarized
