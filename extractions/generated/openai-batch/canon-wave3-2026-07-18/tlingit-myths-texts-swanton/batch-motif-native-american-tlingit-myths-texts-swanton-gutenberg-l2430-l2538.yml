canonical_text:
  quote: ''
  summary: The passage contains two narrative sections. In “The Protracted Winter,”
    boys move drifting seaweed across a canoe, after which winter returns locally
    until a blue jay with elderberries indicates a neighboring town where summer has
    already come. In “Beaver and Porcupine,” porcupine and beaver are close friends,
    protect each other from bear, then betray and strand one another; porcupine later
    calls for help until the sea freezes so he can return home. The story continues
    with porcupine’s friendship with ground hog, a hunter’s capture of a small ground
    hog, a singing head that foretells the hunter’s own beheading in a trap, and a
    concluding funeral feast.
  language: English
  quote_policy: summarized
