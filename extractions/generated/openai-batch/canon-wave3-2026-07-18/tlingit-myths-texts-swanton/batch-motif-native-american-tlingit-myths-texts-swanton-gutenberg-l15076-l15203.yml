canonical_text:
  quote: "“My mother does not let the person that stays with me last long.”"
  summary: A man warns his wives about his mother. While he is away, the mother-in-law
    tries to kill the wives with a burning side of mountain sheep, but they push it
    back on her and kill her. The son returns, approves what they did, and later,
    after many years, Mountain Dweller helps his wives prepare to go home by having
    them weave thumb-sized baskets that hold many canoe loads of things.
  language: English translation with Tlingit transcription
  quote_policy: quoted
