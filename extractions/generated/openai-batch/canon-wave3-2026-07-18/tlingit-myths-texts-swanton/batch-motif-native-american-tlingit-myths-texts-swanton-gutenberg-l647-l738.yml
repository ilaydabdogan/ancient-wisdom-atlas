  text: Raven, Bear, and Cormorant go by canoe to a fishing ground; Cormorant sits
    in the bow, Bear in the middle, and Raven steers because he knows the place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven points out a mountain named Wasǃēˊtî-cā as a landmark for fishing and
