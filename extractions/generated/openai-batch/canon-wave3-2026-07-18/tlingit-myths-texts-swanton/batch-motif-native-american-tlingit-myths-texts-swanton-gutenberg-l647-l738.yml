canonical_text:
  quote: ''
  summary: Raven travels with Bear and Cormorant to a fishing ground, tricks Bear
    into a fatal mutilation, silences Cormorant, kills Bear’s wife with food filled
    with hot rocks, and consumes both bears. Raven then steals bait from a fishing
    camp, is hooked and loses his nose, recovers it by disguise and deception, and
    later takes fat from a deer’s nose and eats it.
  language: English, with a bracketed Latin passage
  quote_policy: summarized
