canonical_text:
  quote: HOW THE FROGS HONORED THE DEAD
  summary: After a preceding footnote, the passage narrates that two allied groups
    encamp on St. Lazaria island, a Kāˊgwᴀntān chief dies, the Kîksᴀˊdî are asked
    to care for his body, and the frog tribe interprets the summons as meant for itself.
    During the funeral fire, a large frog emerges, makes a sound, jumps into the fire,
    and burns. The mourners then perform gestures of respect, go to war, kill captives
    for the dead man, and place food in the fire for him, also naming the frog so
    it may receive some.
  language: English
  quote_policy: quoted
