canonical_text:
  quote: ''
  summary: A lazy youngest brother is left behind by his brothers during a hunting
    trip near a mountain. A man appears in his dream, tells him to go to a salmon
    creek and vomit, and he vomits up a salmon bone identified as the cause of his
    laziness. The helper is revealed as a mountain being, who leads him into the mountain
    through opened doors, where rooms contain grizzly bears, black bears, mountain
    sheep, and all things. The brothers later return, cannot find him, think him dead,
    blame one another, and return home, where Teqoedî people from Prince of Wales
    Island are present.
  language: English with Tlingit transliteration
  quote_policy: summarized
