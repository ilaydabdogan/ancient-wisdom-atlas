  text: The passage describes cooked bark being pounded, pressed into cakes, pierced
    for hanging, dried, stored either dry or in oil, and later soaked or eaten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kakēˊqǃᵘtê shows people how to gather and preserve a sweet root called tsǃēt
    from sand flats before its tops appear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that cooked tsǃēt roots move around as if alive, and that
    Tlingit widows do not eat them because they fear the roots will make them nervous.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kakēˊqǃᵘtê also shows how to prepare a root called sǃîn, how to kill seals
    and prepare their flesh, and how to catch animals with deadfalls baited with fat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
