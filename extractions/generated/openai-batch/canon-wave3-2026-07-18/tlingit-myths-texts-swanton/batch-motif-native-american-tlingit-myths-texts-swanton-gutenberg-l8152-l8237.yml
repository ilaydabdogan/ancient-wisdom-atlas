canonical_text:
  quote: ''
  summary: Kakēˊqǃᵘtê instructs Athapascans in preparing bark cakes, edible roots,
    seal flesh, and animal traps, then seeks to return to his native town. After receiving
    coppers, the party returns by his former route. One Tlingit group rejects the
    visitors, while the ʟǃūkǃnᴀxᴀˊdî take their coppers, incorporate them as people
    and friends, become wealthy, and later establish and name places, houses, and
    subgroup identities connected with Copper River, roots, islands, and moose hide.
  language: English
  quote_policy: summarized
literal_observations:
