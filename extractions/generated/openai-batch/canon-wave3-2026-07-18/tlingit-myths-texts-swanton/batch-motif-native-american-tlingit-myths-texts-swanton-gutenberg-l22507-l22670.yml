canonical_text:
  quote: ''
  summary: A footnote block is followed by an introductory note on graphophone-recorded
    songs and nine song texts with translations. The editor states that the song language
    is highly metaphorical and sometimes uncertain. The songs include Raven traveling
    below the sea and flying with his nose, Qakēˊqǃᵘtê encountering destroyed friends
    and dangerous stones, a frog that might have become a ground hog, Kᴀka drifting
    seaward and shoreward after being brought by land otters, dream songs about home,
    death, and a son, shamanic spirit songs about coming up through places, an under-fireplace
    spirit, and a river-floating/dragging command involving a raven.
  language: English with Tlingit song text/transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editor says the songs are highly metaphorical, often difficult to understand,
    sometimes uncertain even to informants, and include myth-referential songs, shamans’
    songs, feast songs, and contest songs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A song about Raven says he went down under the sea, had his nose pulled up,
    went through town for his nose, received it, flew outdoors, and then could wander
    along the beach.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A song about Qakēˊqǃᵘtê says that when he came down to the beach his friends
    were destroyed, he saw no one, saw something near Łᴀqǃᴀˊsg̣î point, and asks not
    to watch the little stones lest he be bewitched.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A second Qakēˊqǃᵘtê song, composed after catching a frog instead of a ground
    hog, says the frog might have turned itself into a ground hog or dug a hole under
    the trap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kᴀka’s song was sung after he had been brought up from the south by land otters;
    its lines ask to drift seaward and shoreward, and the note says he drifted out
    to sea or ashore when the words were uttered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Qaqǃᴀtcgūˊk’s song after his island dream says that a man who thought he had
    perished dreams about himself and keeps feeling as if he had gotten home.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The song about the G̣ānᴀxteˊdî woman who reared the woodworm says she is already
    going, is going to die, and has dreamed of her son.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A shamanic spirit song by ʟūswᴀˊt says the speaker has no place to come up
    through, will go to Chilkat, will come up through Łxodēˊt, and will cry.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A song by One-whose-quill-is-disliked says the singer was dreaming of his
    spirit under the fireplace and names an under-the-fireplace spirit.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: A spirit song by Kāsǃenduᴀˊxtc commands that someone be thrown into the river,
    float down to the mouth, and that a raven be dragged up to dry ground.
  category: action
  evidence_refs:
  - ev:10
