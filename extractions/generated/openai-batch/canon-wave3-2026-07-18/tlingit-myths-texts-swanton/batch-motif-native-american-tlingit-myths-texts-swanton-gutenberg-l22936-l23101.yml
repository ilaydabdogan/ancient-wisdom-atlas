  summary: A set of Tlingit feast, potlatch, and dance song texts with translations
    and notes. The passage includes a song about Raven inside a whale and turning
    over the world, a dying man’s song about going up to the ghost world, songs about
    ceremonial hats, Wolf-family feast entrance songs, Tsimshian-language feast songs,
    Raven/Wolf phratry reconciliation language, and a song about tying an object around
    the neck while seeking forgiveness.
