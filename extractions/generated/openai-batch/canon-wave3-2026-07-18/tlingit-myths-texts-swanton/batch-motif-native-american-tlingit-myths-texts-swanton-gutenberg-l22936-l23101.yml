  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening song fragment says that people’s words, specifically worthless
    people’s words, are backing down on the speaker.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A potlatch song addresses a killer whale, refers to Raven going inside a whale,
    asks whether the killer whale will satisfy Raven, and says Raven turned the world
    over with himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A song composed by Nawēya before death tells Kāgwᴀntān’s children to be good,
    says children jumped to save them, thanks Wuckitā’n’s children for pity, and says
    the speaker is going up to the ghost world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A feast song about an eagle hat is sung when a person is dissatisfied with
    the property obtained, and its single word is said to be Tsimshian.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A similar song concerns a g̣onaqᴀdēˊt hat; the words are said to be Tsimshian,
    and one word is identified as evidently the Kwakiutl name for the winter ceremonial.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A song used by all Wolf families is sung together as they enter a feast; it
    announces a rich man coming, tells people to keep silent, and says at the end,
    “It is all gone.”
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A song composed in Tsimshian is used by the Kāgwᴀntān at a great feast, and
    the last word is said to mean “stern of canoe.”
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Another feast song says the singers are going to be invited to Killisnoo or
    Hutsnuwu and that high-caste people are going to eat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A dance song says people at the head of Raven’s river have started for the
    Wolf phratry’s town, denies hard feelings against the Raven phratry, and proposes
    shaking hands.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A dance song warns Kîksᴀˊdî’s children not to be double-minded, asks pity
    for the Raven phratry, compares thinking of the speaker’s grandfathers’ town to
    getting drunk with whisky, and says no Wolf phratry person can set the speaker’s
    mind right.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: A song says the speaker will tie an unspecified object around the neck so
