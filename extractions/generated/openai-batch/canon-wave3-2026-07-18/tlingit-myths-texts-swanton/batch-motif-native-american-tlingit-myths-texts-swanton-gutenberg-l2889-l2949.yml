canonical_text:
  quote: ''
  summary: 'The passage concludes an account in which a chief receives the Rock House
    name and emblem after being saved by a great living thing. It then tells the origin
    of Iceberg House: after disease kills a man''s kin and friends, he offers a feast
    to pieces of ice as guests, and later invites beings from the sea; bear people
    arrive, are seated as if they were his dead relatives, eat, and lick away his
    sorrow. The passage explains related customs and the ownership of Iceberg House
    by the Tcūkᴀneˊdî clan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief instructs people to name a future house Rock House and says it is
    good to use each other's emblems; G̣onaqᴀdēˊt’s people load a canoe, scent their
    hair with cottonwood boughs, and let them return home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On returning home, the people are so finely dressed that they are not recognized;
    the chief says a great living thing saved them and gave them Rock House as an
    emblem-name to use when building a house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man and his wife live at a fort during a disease that destroys the man's
    uncles, fathers, and friends; the man decides to make a feast for the dead and
    gathers berries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ice floats onto the beach; the man brings the pieces into the house, treats
    them as guests, makes the fire blaze with oil, and places berries before the ice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ice makes a squeaking sound as if speaking; the passage says this explains
    a later practice of talking to drifting ice, giving it tobacco, and addressing
    it with kin terms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage identifies the ice-feast episode as before or at the beginning
    of the Tcūkᴀneˊdî clan and says that therefore they own Iceberg House.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man later goes out in a canoe and calls for anyone on the sea who hears
    him; crowds of the bear tribe come down between the mountains, thinking they were
    invited.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The man tells his wife to be courageous, says he does not care whether he
    lives or dies because his friends are dead, and speaks to the arriving bears as
    if they were his own people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The man directs the bear people to seats formerly associated with dead male
    kin, calls the names of the dead men, receives responses of presence, and passes
    dishes to the speakers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief of the bear tribe tells the bears not to leave the man friendless;
    the bears lick the man to remove his sorrow and then leave.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Men from another town watch the large animals leave and hear the man speak
    to them as friends, but they are afraid to approach.
  category: sequence
  evidence_refs:
  - ev:9
