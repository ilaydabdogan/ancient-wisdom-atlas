canonical_text:
  quote: ''
  summary: The passage first describes two young men who appear to hunt while remaining
    inside a house, after which a canoe is found loaded with sea animals and the village
    is fed. The men begin to come to life, receive marten robes, and are later killed
    when an angry girl marks their seats with human blood. The next narrative begins
    with a bereaved young widower who travels after his wife’s burial along the death
    road to a lake at the edge of spirit land. He is ferried across in Ghost’s-canoe,
    meets his dead wife, refuses otherworld food at her warning, and returns with
    her by the same canoe and road.
  language: English
  quote_policy: summarized
