  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives the action and result but does not explain the mechanism
    or wider ritual meaning.
- id: motif:4
  label: Journey road to the land of the dead
  taxonomy_refs:
  - afterlife_journey_map
  basis: The widower travels the death road through woods to a lake with a flat rock,
