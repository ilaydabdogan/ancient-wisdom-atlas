- id: motif:1
  label: Enacted or hidden hunt produces real food
  taxonomy_refs: []
  basis: The men appear to perform a hunt inside the house, invisible and inaudible
    to the villagers, and afterward a real canoe is found loaded with sea animals
    that feed the village.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage begins mid-narrative, so the nature of the two men and the
    full logic of the hunting episode require context outside this excerpt.
- id: motif:2
  label: Beings begin to come to life
  taxonomy_refs:
  - resurrection
  basis: The two men are said to begin coming to life and looking like living beings
    before being clothed by the chief.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The excerpt does not include the prior explanation of what state the men
    were in before this change.
- id: motif:3
  label: Death caused by human blood placed on a seat
  taxonomy_refs: []
  basis: An angry girl marks each brother’s sitting place with human blood, and each
