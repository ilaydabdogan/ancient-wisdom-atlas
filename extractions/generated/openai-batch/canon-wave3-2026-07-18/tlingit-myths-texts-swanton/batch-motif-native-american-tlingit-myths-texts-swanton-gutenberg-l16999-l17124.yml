canonical_text:
  quote: ''
  summary: Lively-frog-in-pond is captured by the salmon people and taken to their
    village. Hungry and ashamed after eating eggs, he observes herring people dancing.
    A woman explains that his capture resulted from speaking against the salmon people
    and instructs him how to roast salmon and return all leavings and roasting sticks
    to the water. When the salmon chief’s eye becomes sore, the woman suggests an
    eye may have been left behind; after he follows her directions, the eye is cured.
  language: English
  quote_policy: summarized
