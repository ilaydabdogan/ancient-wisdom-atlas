canonical_text:
  quote: ''
  summary: The Salmon people enter a creek in two schools. A salmon who is the woman's
    son is speared by his father after the mother calls attention to him. The mother
    later recognizes him by a copper ring around his neck, places the salmon with
    feathers on a mat on the house, and a shaman sings for him. At midnight the son
    changes back into a human being from the head downward, and named spirits speak
    from inside him.
  language: English translation with Tlingit interlinear/glosses
  quote_policy: summarized
