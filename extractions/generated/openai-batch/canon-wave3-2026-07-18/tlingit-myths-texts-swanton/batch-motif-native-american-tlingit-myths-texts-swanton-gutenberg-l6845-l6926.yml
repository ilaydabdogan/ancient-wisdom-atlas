canonical_text:
  quote: ''
  summary: The passage explains gambling sticks and cīct, a lucky medicine obtained
    through fasting, secrecy, and abstinence. It then recounts how the defeated rich
    opponent of Qonᴀłgīˊc became isolated, encountered a dancing grouse and other
    birds, learned of a medicine-man, fasted, received dream instructions for making
    dance medicine from a leaf, eagle parts, a wave, and a beach bird feather, and
    became a renowned dancer and singer who gained wealth through gifts.
  language: English
  quote_policy: summarized
