  text: If gamblers keep the rules of their cīct, it will tell them what animal they
    will kill while hunting.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: After losing all his property, the rich opponent of Qonᴀłgīˊc is left by his
    wife, leaves town, makes a bow and arrows, wanders in the forest, and lives by
    collecting and drying clams and fish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The isolated man hears a distant drum-like sound and eventually discovers
    that a grouse is making the noise.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The grouse says it dances when lonely, and the man asks it to dance with him
    because he is lonely too.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The man sees many birds, described as the grouse’s friends, and they dance
