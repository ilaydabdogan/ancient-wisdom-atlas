    action.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The name cīct is said to come from a wolf that had something stuck between
    its teeth and offered to show its cīct after a man removed it.
  category: relationship
  evidence_refs:
  - ev:2
