candidate_motifs:
- id: motif:1
  label: Ritual acquisition of lucky medicine through fasting and secrecy
  taxonomy_refs:
  - initiation
  basis: The gambler must fast, abstain from his wife, and keep the practice secret
    in order to obtain cīct; the chief also fasts before receiving medicine knowledge.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage describes practical ritual requirements but does not frame
    them with a formal initiation ceremony.
- id: motif:2
  label: Animal reveals or mediates special medicine
  taxonomy_refs:
  - wisdom
  basis: A wolf offers to show its cīct after being helped, and a grouse guides the
    lonely man toward a medicine-knowing person.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: medium
  cautions: The wolf and grouse episodes are separate; the passage does not explicitly
    classify them as the same pattern.
- id: motif:3
  label: Gambling implements as omens and secret powers
  taxonomy_refs: []
  basis: Gambling sticks are lucky objects, cheating sticks are compared to flying
    birds, stick movements may foretell death, and cīct can reveal future hunting
    success.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  confidence: high
  cautions: No available taxonomy reference directly matches gambling omens.
- id: motif:4
  label: Origin of dancing for mourners
  taxonomy_refs:
  - culture_hero
  basis: The man’s dance with the grouse and birds makes him forget grief, and the
    passage states that people dance for mourners because of this event and identifies
    it as the first dance.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The actor is not explicitly called a culture hero; the taxonomy reference
    is used only for the culture-origin aspect.
- id: motif:5
  label: Dream instruction after fasting for medicine-making
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: After fasting, the chief dreams that a man gives precise instructions for
    making medicine from natural and animal components and placing it in a windy tree.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The dream instructor may or may not be identical with the island medicine-man;
    the passage does not explicitly state the identity.
- id: motif:6
  label: Acquired dance power produces song, trance-like dancing, and wealth
  taxonomy_refs:
  - sacred_exchange
  basis: After completing the medicine instructions, the man composes songs easily,
    dances as if in a trance, teaches songs, receives gifts, and becomes rich through
    dancing.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The exchange is presented as gifts following performance, not as an explicitly
    sacred contract.
