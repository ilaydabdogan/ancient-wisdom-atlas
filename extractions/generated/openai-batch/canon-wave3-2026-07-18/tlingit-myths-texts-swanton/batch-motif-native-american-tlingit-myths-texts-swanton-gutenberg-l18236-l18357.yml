canonical_text:
  quote: ''
  summary: Qakēˊqǃᵘtê finds starving Athapascans who know only hook-fishing for eulachon.
    He hides in the woods, sets Tlingit eulachon traps at night, and leaves a heap
    of fish for them. An Athapascan shaman discovers that a helper has come. After
    food offerings fail, the people hang a copper spear and find him, then place a
    chief's daughter there so he will marry her. He joins them, explains the fish
    trap, and receives skins and copper spears as payment.
  language: English with Tlingit interlinear and glossed text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Athapascans lived upriver near the head of the Alsek and were starving
    although eulachon ran up the river, because they had only hooks for catching them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qakēˊqǃᵘtê at first stayed in the woods and did not let the Athapascans see
    him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Qakēˊqǃᵘtê tied together two Tlingit eulachon traps or nets called “seal’s-head”
    and set them near the edge of the water where the Athapascans came to fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Both traps filled that night, and Qakēˊqǃᵘtê emptied them at the Athapascans’
    usual fishing place, leaving a heap of eulachon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The next morning the Athapascans were astonished and asked what had done this;
    Qakēˊqǃᵘtê and the Athapascans did not know one another.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: An Athapascan shaman performed to find out what was working for the people
    and said that something had come to help them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The shaman instructed the people to hang all kinds of food there; when Qakēˊqǃᵘtê
    did not eat the food, they hung a copper spear and then found him.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The Athapascans placed a chief’s daughter there so they could get Qakēˊqǃᵘtê
    by having him marry her, and he eventually went out among them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Athapascans took Qakēˊqǃᵘtê with them, and he explained the fish trap
    to them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that this preserved the Athapascans from starvation and
    taught them about the trap.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Qakēˊqǃᵘtê married the woman, the Athapascans put moose skins, marten
