- id: ev:3
  type: summary
  locator: 4294-4300
  quote_or_summary: Raven-at-the-head-of-Nass is unmarried but has an unexplained
    daughter; the two old persons care for her and inspect her water before she drinks.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 4301-4305
  quote_or_summary: Raven-at-the-head-of-Nass first creates Heron as a tall and wise
    man and then creates Raven, who is also good and wise at that time.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 4306-4320
  quote_or_summary: Raven’s first mother loses many children; Heron tells her to heat
    a small smooth stone in the fire until red hot and swallow it, and she then gives
    birth to Raven.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 4320-4324
  quote_or_summary: Raven’s name is linked to a very hard rock and to Hammer-father,
    explaining why he was tough and not easily killed.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 4325-4328
  quote_or_summary: Heron and Raven become servants of Raven-at-the-head-of-Nass;
    Raven is favored and made head man over the world, and then some people are made.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 4329-4336
  quote_or_summary: Created beings exist in darkness for a long time; Raven pities
    the few people in darkness and decides that if he were the creator’s son he could
    do almost anything.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 4336-4340
  quote_or_summary: Raven makes himself small, turns into a hemlock needle, floats
    on the water the daughter is about to drink, is swallowed, and soon she becomes
    pregnant.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 4341-4349
  quote_or_summary: Raven-at-the-head-of-Nass knows what has happened, asks his daughter,
    instructs attendants to get moss for her, and the child is born and named Nās-cᴀˊkî-yēł;
    half a basket is used as a cradle.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 4350-4359
  quote_or_summary: Raven-at-the-head-of-Nass tries to make humans from rock and leaf;
    humans come from the leaf, and he explains that like a fallen rotting leaf they
    must die, whereas rock origin would have meant no death.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 4360-4369
  quote_or_summary: Raven-at-the-head-of-Nass says non-witches who do not lie or steal
    go after death to a good place above; wicked people become dogs or low animals,
    and arrivals are questioned about their death or life.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 4370-4373
  quote_or_summary: A man dies; Raven comes into the house, sees the wife and children
    weeping, raises the dead man’s blanket with both hands over the body, and brings
    him back to life.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 4374-4377
  quote_or_summary: The woman disbelieves Raven and her husband when they say there
    is no death; while asleep she sees a wide trail with many people and fierce animals
    around it, which good people must pass to live again.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: '4377'
  quote_or_summary: At the end of the trail she sees a great river, crosses in a canoe
    from the other side, and people there tell her to go back because their place
    has starvation, cold, and no drinking water.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
