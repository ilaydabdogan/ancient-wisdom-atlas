candidate_motifs:
- id: motif:1
  label: Primordial darkness with daylight held by a creator figure
  taxonomy_refs: []
  basis: The world has no daylight, while the creator figure’s house contains sun,
    moon, stars, and daylight.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This passage does not yet narrate release or theft of the lights.
- id: motif:2
  label: Creator or high deity
  taxonomy_refs: []
  basis: Raven-at-the-head-of-Nass is a prayed-to unseen deity addressed as creator
    and is the maker of beings and humans.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:11
  confidence: high
  cautions: No available taxonomy ref directly names a creator-deity family.
- id: motif:3
  label: Miraculous conception or birth by swallowed object
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: Raven is born after his mother swallows a red-hot stone, and later Raven
    enters the creator’s daughter’s water as a hemlock needle and is swallowed, leading
    to pregnancy.
  evidence_refs:
  - ev:5
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage presents two birth accounts involving Raven; their relationship
    should be reviewed by a human specialist.
- id: motif:4
  label: Shape-changing Raven
  taxonomy_refs:
  - shapeshifter
  basis: Raven makes himself very small and turns into a hemlock needle.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Only one explicit transformation is narrated in this passage.
- id: motif:5
  label: Culture hero acting for people in darkness
  taxonomy_refs:
  - culture_hero
  basis: Raven is made head man over the world, feels sorry for people in darkness,
    and makes a plan that depends on becoming the creator’s son.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The later outcome of the plan is outside the supplied passage.
- id: motif:6
  label: Origin of death through failed rock-human creation
  taxonomy_refs: []
  basis: Humans are made from a leaf rather than a rock, and this is explicitly given
    as the reason death exists in the world.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No exact available taxonomy ref corresponds to an origin-of-death motif.
- id: motif:7
  label: Moral judgment after death
  taxonomy_refs:
  - divine_judgment
  basis: The passage distinguishes good people from wicked people after death, gives
    a good place above for the former, animal rebirth for the latter, and questioning
    that governs the destination.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The mechanism is described in moral and spatial terms, but not as a formal
    court judgment.
- id: motif:8
  label: Afterlife journey with trail, animals, river, and canoe crossing
  taxonomy_refs:
  - afterlife_journey_map
  basis: The sleeping woman sees a trail needed for return to life, fierce animals,
    a river at the end of the trail, and a canoe crossing to the other side.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: The vision occurs while the woman sleeps and is not explicitly described
    as her own death journey.
- id: motif:9
  label: Restoration of a dead person to life
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Raven lifts the dead man’s blanket over the body and brings him back to life.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage gives a single brief revival episode without extended ritual
    detail.
