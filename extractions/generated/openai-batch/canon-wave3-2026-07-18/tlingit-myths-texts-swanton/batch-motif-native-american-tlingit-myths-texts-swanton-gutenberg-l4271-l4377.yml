canonical_text:
  quote: ''
  summary: The passage begins the Wrangell English version of the Raven myth. It describes
    a primordial dark world, Raven-at-the-head-of-Nass as an unseen creator figure
    who possesses sun, moon, stars, and daylight, the creation and birth of Heron
    and Raven, Raven’s transformation into a hemlock needle to be swallowed by the
    creator’s daughter, an explanation of human mortality through humans being made
    from a leaf instead of a rock, moral teachings about the afterlife, Raven’s revival
    of a dead man, and a woman’s dreamlike view of a trail, animals, river, canoe,
    and cold hungry dead.
  language: English
  quote_policy: summarized
