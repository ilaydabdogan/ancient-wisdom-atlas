canonical_text:
  quote: ''
  summary: In the Sitka Kîksᴀ́dî story “Moldy-End,” Lively-frog-in-pond is at the
    salmon stream Dax̣ḗt where his father has camped. The boy plays on the beach,
    catches sea gulls with bait, asks for food, receives half-moldy dry salmon, complains,
    and throws it into a corner. He returns to the sea gulls, wades out after one,
    falls into a hole, and disappears. His parents search, call for him, find his
    tracks leading into the water, mourn, and continue searching without sleeping
    or eating before giving up after months.
  language: English with Tlingit interlinear text
  quote_policy: summarized
