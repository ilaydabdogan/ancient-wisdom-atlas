canonical_text:
  quote: ''
  summary: The excerpt contains editorial footnotes and the beginning of story 106,
    "Origin of a Low-Caste Name." A footnote names Qǃāˊdustin as the teller of a story
    and another states that fire is a medium of communication between two worlds;
    another cross-references stories 35 and 94. In story 106, people in a northern
    village are fond of hunting. Three men go by canoe to the rocks where they hunt,
    find a strange little boy, take him aboard, bring him home, and keep him as a
    friend. The boy does not answer when spoken to, eats only after everyone has gone
    to bed, spills what he touches, is unmanageable, breaks valuable stone axes and
    other things, hurts children so his keepers must pay compensation, destroys clothing
    and shoes, drinks much water, eats greatly, is described as dirty and a crybaby,
    loses things entrusted to him, and causes much trouble.
  language: English with Tlingit interlinear text
  quote_policy: summarized
