canonical_text:
  quote: ''
  summary: 'After several footnotes, the passage recounts events among the Alsek River
    people: a famine, a shamanic underwater journey associated with the arrival of
    eulachon, an episode in which land-otter-men enter and threaten two menstruant
    women, the expulsion of the land otters through the women’s bloody clothes and
    speech, the destruction of a neighboring lake town by a flood after mockery of
    the land otters, and a spirit-guided shaman’s dangerous encounter with a giant
    devilfish.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A famine occurs among the people of the Alsek River, and two shamans sing
    for different food resources: eulachon and land animals.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first shaman’s spirit instructs him to go down the little rapids, and
    he goes under the water in a little canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The other shaman’s spirits report that the first shaman will remain underwater
    for four nights in a house containing eulachon, salmon, and other fish, and that
    he has opened the door.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After four days the first shaman is found dead on the beach amid piles of
    eulachon, and eulachon in the ocean begin running upriver.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The other shaman tells two menstruant women that many land otters will be
    about the town, and land-otter-men later pass through the village and are heard
    whistling.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Land otters are found talking inside the two women; the passage explains that
    these are land-otter-men, men taken by land otters and made like them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: When people creep close to the women, a voice inside warns them not to sneak
    around because it can see them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The land-otter-men have come to turn the two women into land-otter-people,
    and the shaman’s spirits are weakened by menstruant women.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Invisible land otters make noises under the houses at night while the people
    try to keep the two women from being carried off.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two women are told to take their bloody clothes to different beaches,
    leave them there, and speak to the land otters; after this, the land otters go
    away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The shamans predict that something will happen to a great town by a lake,
    and people in that town mock the land otters as stuttering beings unable to talk
