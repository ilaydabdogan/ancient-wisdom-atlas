canonical_text:
  quote: ''
  summary: The passage contains footnotes, explanatory notes, Tlingit song texts,
    and English translations for songs numbered 53 through 61. The songs include Raven
    and Wolf phratry imagery, a reply comparing the speaker to a drum beaten to make
    peace, a poor girl later becoming wealthy, warnings about death, accusations and
    replies concerning whisky and drunkenness, a shaman’s plea for love beyond pity,
    sarcastic humiliation of Little Raven, and a note about a compensation killing.
  language: English with Tlingit song transcriptions
  quote_policy: summarized
