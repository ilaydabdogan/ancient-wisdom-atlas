canonical_text:
  quote: ''
  summary: An unnamed man makes a large house, uses an unidentified object at the
    beach and among animals, and obtains great quantities of food from seals and mountain
    sheep. While his uncle’s people suffer famine, the uncle thinks he has died and
    sends slaves to burn his body. The man feeds the slaves, tells them not to take
    anything, and instructs them to report that they burned him. A slave secretly
    retains a piece of fat for her baby. Back in the famine-stricken town, the baby
    cries for fat; the greasy mouth reveals the hidden food, and the slave tells her
    master that the man is alive and has many things.
  language: English with Tlingit interlinear
  quote_policy: summarized
