canonical_text:
  quote: What he had hit was his own sleep.
  summary: Story 104 introduces Qakēˊqǃᵘtê, a X̣ᴀkᴀnūˊkedî hunter. After failing to
    kill anything, he anchors at The Bay. His steersman falls asleep while Qakēˊqǃᵘtê
    remains awake. A small flying thing circles his face; he strikes it into the canoe
    with a paddle. At daylight he finds it is a bird with swollen eyes and blood at
    the mouth, and the passage identifies it as his own sleep. His steersman cannot
    be awakened and is found dead, with blood coming from his mouth. Qakēˊqǃᵘtê returns
    sadly toward town with the body.
  language: English with Tlingit interlinear text
  quote_policy: quoted
