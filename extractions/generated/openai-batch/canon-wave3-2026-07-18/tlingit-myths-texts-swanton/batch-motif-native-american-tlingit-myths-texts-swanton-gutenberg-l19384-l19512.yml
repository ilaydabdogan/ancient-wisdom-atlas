canonical_text:
  quote: ''
  summary: The passage describes a ceremonial distribution of goods to guests, then
    recounts how all the people lived in a large Wolf house. Young men raced while
    going to cut firewood with stone axes; anger after a defeat led to fire and coals
    being pushed or thrown between opposing sides during a grease meal. Chiefs stayed
    apart while nephews carried out the conflict. A Cohoes person with a raven hat
    imitated a raven, and the fighting stopped. The house beams burned, the people
    were called Burnt-house people, they moved out and built other houses, and some
    descendants later moved to Sitka.
  language: English translation/gloss with Tlingit transcription
  quote_policy: summarized
