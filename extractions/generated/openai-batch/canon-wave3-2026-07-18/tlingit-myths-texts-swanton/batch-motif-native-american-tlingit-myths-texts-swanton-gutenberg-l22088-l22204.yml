canonical_text:
  quote: ''
  summary: A ceremonial speaker tells of a high-caste woman captured by grizzly-bear
    people on the Nass, married among them, instructed by an older captured human
    woman, and given objects that become obstacles during her escape. At the beach
    she is saved by G̣onaqᴀdē’t’s son, Gīnᴀcᴀmgêˊtk. The speaker then applies the
    story to the addressed people, comparing their trouble to the woman’s capture
    and the grandfathers’ ceremonial emblems, canoe, dead uncles, and eagle down to
    saving aids.
  language: English translation with Tlingit interlinear excerpt present
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A family on the first side asks the second division to make another speech,
    and the speaker of the Tāłqoeˊdî begins.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the Nass, grizzly-bear people capture a high-caste girl; she lives among
    them, cannot get away, and marries one of them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grizzly-bear people go for salmon while their wives gather firewood, but
    the captured woman does not know how to gather firewood in their way.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old woman among the grizzly-bear people says she too is a captured human
    being and tells the younger woman to get wet wood for firewood.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the younger woman follows the old woman’s instruction, her fire does
    not go out, her husband is fond of her, and she feels brave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the high-caste woman later feels sad, the old woman gives her a devil’s-club
    comb, a wild rosebush comb, sand, mud, and a piece of rock with which to save
    herself.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman flees; grizzly-bear people pursue her; thrown objects or materials
    become obstacles, including a hill of devil’s club, a sand hill, and a big hill.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fleeing woman reaches the beach, where G̣onaqᴀdē’t’s son comes ashore
    and saves her from the pursuers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker says the addressed people’s trouble has captured them, that the
    grandfathers are like the old woman, and that the raven hat and frog-cane correspond
    to the escape gifts.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The speaker says the frog-post, the grandfathers’ emblem and canoe, a dead
    uncle, long-dead uncles dancing, and descending eagle down will save the addressed
    people.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
