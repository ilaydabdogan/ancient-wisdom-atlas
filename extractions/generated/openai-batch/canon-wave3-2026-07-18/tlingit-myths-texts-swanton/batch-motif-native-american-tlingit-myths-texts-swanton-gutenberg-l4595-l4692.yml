canonical_text:
  quote: ''
  summary: Raven grants powers and traits to the eagle and land otter, including the
    land otter’s relation to water, land, and capsized canoes. The passage then explains
    land-otter-men, the origin of shamans through people recovered from land otters,
    and the story of Kᴀkaˊ, a Kîksᴀˊdî man taken by land otters, returned on a log,
    and possessed by land-otter spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven tells the eagle that it will be powerful above all birds, have very
    good eyesight, and receive useful talons.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven tells the land otter that it will live in water as well as on land,
    have a house on a breezy point, and save people from capsized canoes and make
    them friends.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that land-otter-man originated from Raven speaking to the
    land otter and that all Alaskans know about land-otter-man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: People taken by land otters who are recovered by friends become shamans, and
    shamans see one another by means of land-otter spirits.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kᴀkaˊ is described as the first man captured or saved by land otters; the
    land otters come in large canoes looking like his close relations, but he discovers
    the canoes are skates.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kᴀkaˊ gives himself up to the land otters and is named Qōwułkaˊ, a land-otter-language
    word later applied to a favored halibut fishhook.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Figures of Qōwułkaˊ are covered with dog skin and hung with dog bones, and
    a shaman possessed by him dresses in the same manner.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: From Kᴀkaˊ the people learn that land otters can affect the minds of long-term
    human captives, that land otters have shamans, and that land otters have their
    own language.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kᴀkaˊ’s friends search for him for two years while fasting and remaining away
    from their wives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An old land-otter-woman and her husband instruct Kᴀkaˊ to sit astride the
    first beach log he sees, keep his head covered, and not look around.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The land-otter-people sing a prayer asking to get on the current running to
    shore.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the land-otter-people arrive at land they disappear, and Kᴀkaˊ sits on
    the first log and becomes unconscious because of a shaman’s spirit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Kᴀkaˊ’s friends hear a shaman’s drum and see many sea birds around a floating
    log, where they find Kᴀkaˊ wearing only a kelp apron.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A voice from within Kᴀkaˊ’s chest speaks without his lips moving and identifies
    the relations as masters; the passage identifies the speaker as a shaman’s spirit.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The old land-otter-woman and her husband are identified as Kᴀkaˊ’s spirits,
    and the log is identified as the spirit’s canoe.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Kᴀkaˊ is not turned into a land otter because he does not believe land otters
    are stronger than human beings.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: Before Kᴀkaˊ is brought home, a devil-club house is made for him, townspeople
    fast, and the house and people must be clean.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Inside Kᴀkaˊ, Old-land-otter-spirit and The-spirit-that-saves identify themselves
    and sing the land-otter song.
  category: speech
  evidence_refs:
  - ev:10
