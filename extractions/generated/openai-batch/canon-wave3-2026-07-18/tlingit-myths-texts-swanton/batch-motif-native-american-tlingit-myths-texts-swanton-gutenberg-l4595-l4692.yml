    know about land-otter-man while few tell the Raven story correctly.
  claim_level: same_motif
  target: Wider Alaskan land-otter-man accounts or traditions mentioned in the passage
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: No external versions are provided in the passage, so the claim is limited
    to the passage’s own statement of wider recognition.
