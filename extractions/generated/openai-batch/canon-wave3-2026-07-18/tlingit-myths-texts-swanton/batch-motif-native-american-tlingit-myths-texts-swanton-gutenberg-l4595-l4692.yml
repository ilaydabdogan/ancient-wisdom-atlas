candidate_motifs:
- id: motif:1
  label: Culture hero assigns animal powers
  taxonomy_refs:
  - culture_hero
  basis: Raven gives the eagle its eyesight and talons and assigns the land otter
    its habitat and rescue function.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The broader Raven context is not supplied in this excerpt, but Raven is
    named in the passage as the speaker to the land otter.
- id: motif:2
  label: Nonhuman capture leads to shamanic status
  taxonomy_refs:
  - initiation
  basis: The passage states that people taken by land otters become shamans if recovered,
    and Kᴀkaˊ’s story details separation, instruction, spirit possession, return,
    fasting, and ritual preparation.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage frames this specifically as land-otter-related shamanism,
    not as a generalized initiation theory.
- id: motif:3
  label: Nonhuman beings disguise themselves as human kin
  taxonomy_refs:
  - shapeshifter
  basis: Land otters come to Kᴀkaˊ in canoes looking like his mother, sister, or other
    close relations, but he recognizes them and the canoe as a skate.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The text describes appearance and deception; it does not explicitly state
    bodily transformation.
- id: motif:4
  label: Forbidden sight of nonhuman ways
  taxonomy_refs:
  - forbidden_knowledge
  basis: Kᴀkaˊ is told to cover his head and not look around because the land-otters
    think that if he sees all their ways and habits they will die.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The danger is stated from the land-otters’ perspective and concerns their
    survival, not explicitly Kᴀkaˊ’s punishment.
- id: motif:5
  label: Return from nonhuman captivity with spirit helpers and knowledge
  taxonomy_refs:
  - return
  - wisdom
  basis: Kᴀkaˊ returns from the land otters with spirits, songs, and knowledge about
    land-otter minds, shamans, and language.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The return is mediated by shamanic spirits and kin recovery rather than
    by Kᴀkaˊ’s ordinary travel home.
- id: motif:6
  label: Spirit vehicle disguised as natural object
  taxonomy_refs: []
  basis: Kᴀkaˊ is found on a floating log, and the passage later identifies the log
    as the spirit’s canoe.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: No available taxonomy reference directly corresponds to a log-as-spirit-canoe
    image.
- id: motif:7
  label: Resistance to animal transformation through belief
  taxonomy_refs:
  - shapeshifter
  basis: The old woman and her husband cannot turn Kᴀkaˊ into a land otter because
    he does not believe land otters are stronger than human beings.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The text states an unrealized transformation; it does not describe the
    transformation process.
