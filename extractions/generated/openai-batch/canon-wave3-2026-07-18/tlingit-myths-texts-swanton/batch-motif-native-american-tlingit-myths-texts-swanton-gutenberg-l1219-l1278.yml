canonical_text:
  quote: ''
  summary: Raven travels from place to place making and naming a salmon creek, porcupine,
    winds, human groups, dog, plants, and other entities. The passage gives etiological
    explanations for salmon running upstream, porcupine quills and defensive behavior,
    wind and snow phenomena, different human languages, the dog’s form, mouse hunger,
    and the edibility or naming of certain beings and objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven makes a salmon creek and assigns Woman-with-long-teats-floating-around
    to be at its head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage explains salmon running up creeks as their going upstream to see
    the woman at the creek head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven makes the porcupine and sets pieces of yellow cedar bark along its back
    as quills.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The porcupine is instructed to throw its tail about when someone approaches.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Raven makes and names the west wind Qǃāxōˊ and says it is his son's daughter
    and will hurt nobody however hard it blows.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven takes up a piece of red salmon and says a person too weak to paddle
    home should take it up and blow behind him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven is described as a grandchild of the mouse, and this is used to explain
    why a mouse can never get enough to eat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Raven makes the south wind, and the passage says that when it climbs on top
    of a rock it never ceases to blow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Raven makes the north wind and a mountain house for it with ice-like hanging
    material, then speaks of its white buttocks to explain snowy mountains.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Raven makes different human groups, including the Haida and Tsimshian, as
    human beings like the Tlingit but with different languages.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The dog is first a human being who does what Raven wants, but Raven pushes
    him down by the neck and declares him a four-legged dog.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A thing called fat-on-the-sea protrudes from the ocean, repeatedly sinks when
