canonical_text:
  quote: 29. THE FIRST WAR IN THE WORLD
  summary: The passage opens a story titled “The First War in the World.” Xakútcǃ,
    a hunter, encounters and kills a devilfish; his spirit later empowers a shaman
    whose strength is used in warfare against southern people. The narrative also
    recounts a captured boy killing the southern brave Qǃōg̣á, the destruction of
    a fort, and a later southern expedition that captures Murrelet, a man trained
    to climb steep cliffs and mountains.
  language: English
  quote_policy: quoted
