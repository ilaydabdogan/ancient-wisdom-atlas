canonical_text:
  quote: ''
  summary: After a feast, people return one by one to buy food from a young man, and
    starving people are strengthened by the food he gives them. He exchanges salmon
    for property and asks his uncle’s younger wife to receive the goods. His old uncle,
    the chief, praises him for liberality and for bringing the village people and
    himself to life, then offers him his choice of the uncle’s two wives. The young
    man chooses the younger wife because she has been good to him. The uncle lets
    the nephew take his place, and the young man becomes wealthy and generous to the
    village and to his uncle.
  language: English
  quote_policy: summarized
