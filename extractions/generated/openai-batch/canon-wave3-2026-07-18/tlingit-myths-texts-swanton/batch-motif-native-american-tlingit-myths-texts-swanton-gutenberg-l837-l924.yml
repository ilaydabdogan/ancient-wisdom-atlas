canonical_text:
  quote: ''
  summary: Raven retrieves and distributes fire with the help of chicken hawk; makes
    a magical reaching cane to draw an offshore object to land, revealing an everlasting
    house containing aquatic foods; gives a feast for his dead mother; tricks and
    kills killer whales; steals grease from a companion and escapes confinement; then
    enters a whale, eats within it, kills it, and wills it to drift ashore.
  language: English
  quote_policy: summarized
