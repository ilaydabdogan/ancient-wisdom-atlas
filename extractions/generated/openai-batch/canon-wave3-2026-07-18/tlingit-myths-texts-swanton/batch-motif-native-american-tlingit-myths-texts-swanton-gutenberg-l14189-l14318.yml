canonical_text:
  quote: ''
  summary: The passage opens with the shaman and his uncle burned up. A town is then
    emptied as people who go on two wood roads or leave by canoe do not return, leaving
    only a woman and her daughter. A speaking heron on shore ice offers himself as
    a suitor, marries the daughter, and fathers a son. The child grows, is bathed
    amid ice, carries bow and arrows, goes into water and is nearly killed, and then
    encounters and keeps a sharp-sided hīn-taỵi’cî in a small seawater pond.
  language: English with Tlingit transcription and interlinear glosses
  quote_policy: summarized
