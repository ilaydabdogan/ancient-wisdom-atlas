canonical_text:
  quote: ''
  summary: After a husband dies holding open a monster's jaws, the people name the
    monster G̣onaqᴀdēˊt. The husband's body and the monster's skin are placed in a
    hollow tree by a lake. The wife mourns there until a monster in the lake speaks
    with her husband's voice, carries her to its former house, and is identified as
    a good-luck being whose wife and children also bring luck to those who see them.
  language: English
  quote_policy: summarized
