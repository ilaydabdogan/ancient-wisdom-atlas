candidate_motifs:
- id: motif:1
  label: Nonhuman animal people appear as human suitors
  taxonomy_refs:
  - shapeshifter
  basis: The suitors look like human beings to the chief’s daughter, but the narrative
    identifies them as halibut people.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes appearance and hidden identity, but does not explicitly
    say that the halibut people transform their bodies.
- id: motif:2
  label: Insulting speech toward an animal substance followed by punishment
  taxonomy_refs: []
  basis: The girl uses bad words toward halibut slime, and the next sequence has halibut
    people take and kill her.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The narrative sequence implies a relation between the insult and later
    events, but it does not explicitly state the halibut people act because of the
    insult.
- id: motif:3
  label: Sibling avenger descends to an undersea otherworld
  taxonomy_refs:
  - hero_descent
  - sibling_pair
  basis: The elder brother descends by line to the bottom, enters an undersea house,
    and acts to avenge his dead sister.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage frames the descent as travel to the halibut people’s underwater
    dwelling, not as a named land of the dead.
- id: motif:4
  label: Disguise with woman’s clothing and blood deceives nonhuman spouse
  taxonomy_refs:
  - trickster_boundary
  basis: The elder brother wears his sister’s dress, carries blood, and is mistaken
    for the dead woman; the Latin passage describes use of blood to sustain the deception.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The deception is explicit, but the taxonomy label is a broad functional
    match rather than a named motif in the passage.
- id: motif:5
  label: Special hook reaches the supernatural or underwater house
  taxonomy_refs: []
  basis: All ordinary hooks fail to enter the undersea houses, but Raven-backbone-hook
    comes in through the smoke hole.
  evidence_refs:
