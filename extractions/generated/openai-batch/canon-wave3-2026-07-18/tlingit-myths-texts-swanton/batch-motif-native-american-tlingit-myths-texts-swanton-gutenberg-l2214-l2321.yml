canonical_text:
  quote: ''
  summary: The passage contains the end of a footnote, the story “The Halibut People,”
    and the beginning of “Stories of the Monster Devilfish and the Cry-Baby.” In the
    first story, a chief’s daughter insults halibut slime, is taken by halibut people
    who appear human, and is killed. Her brothers seek revenge; the elder brother
    descends to the undersea halibut town disguised as his sister, deceives and kills
    the halibut chief, and returns with the head. Later, insulting speech concerning
    a cold duck causes the brothers’ canoe to sink to another undersea town, where
    the duck’s killer-whale grandfather has them burned by a great fire and they become
    crying ducks. In the second story, a devilfish living near a salmon-drying camp
    destroys the camp while hunters are away; the surviving hunter brothers lure it
    up, attack it with sharpened spruce sticks, and kill it, but it carries them down
    with it.
  language: English, with one bracketed Latin passage
  quote_policy: summarized
