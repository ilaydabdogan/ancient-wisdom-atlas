canonical_text:
  quote: "“These were really the girls’ skins.”"
  summary: A Kîksᴀˊdî youth discovers two bathing girls whose coats are their skins,
    takes the skins, marries them, follows them when they return to the brant people,
    is accepted by the brant chief, helps the brants defeat the herons with bows and
    arrows, and ultimately remains among the brants. The passage also gives etiological
    explanations for bird behavior, tools, clan emblems, and the custom of asking
    flying brants for food.
  language: English
