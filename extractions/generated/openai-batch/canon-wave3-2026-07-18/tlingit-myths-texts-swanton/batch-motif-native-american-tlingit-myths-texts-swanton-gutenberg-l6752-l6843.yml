canonical_text:
  quote: ''
  summary: A poor man identified with Qonᴀłgīˊc returns to the village, is mocked
    and invited to gamble, and repeatedly defeats a rich chief-opponent. He wins goods,
    food, slaves, relatives, the house, the wife, and finally the opponent himself,
    using unusual performances, hand-washing, dried salmon, and named gambling sticks
    that only he can see. After winning everything he refuses to claim the chief and
    his wife. The passage closes by explaining present attitudes toward gambling,
    gambler obsession, and the custom of returning some winnings in memory of Qonᴀłgīˊc.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the poor man enters the village, people mock him with words said to be
    Haida and want to gamble for his sea otter shirt and fur-seal blanket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the first renewed game, the poor man jumps, runs about, and says funny
    things, confusing the rich opponent and winning goods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the poor man wins tobacco, he treats the crowd around him with it, then
    stops the game despite the opponent wanting to continue.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The poor man asks to gamble for food so that he can feed his people, wins
    the food, and invites friends to receive it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When his luck turns, the poor man runs to a nearby creek, washes his hands
    very clean, returns to gamble, and repeats this action.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The poor man sometimes chews dried salmon, after which he can see the devilfish
    smoke much better.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The poor man calls certain lucky sticks by name, says the āsqǃancāˊdjî sticks
    will come out, and sees them fly around his head and settle again among the other
    sticks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief loses progressively more severe stakes, including nephews, house,
    wife's clothes, wife, and himself, while the poor man is reluctant to gamble for
    people.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: After winning the chief and his wife, the poor man says he will not claim
    them and tells the chief to take his wife back.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator states that high-caste people avoid gambling, that gamblers become
