canonical_text:
  quote: ''
  summary: The passage describes dancers going into water, a house owner’s feast at
    Kᴀqǃᴀnuwūˊ, the killing of slaves for guests, the throwing of bodies into a valley,
    two killed slaves coming to life, and the naming of Slaves’-valley. It then describes
    feast regalia, song, wearing articles of a dead predecessor, distribution of property
    and slaves, and guests’ reciprocal thanks by leaving a dance.
  language: English with Tlingit interlinear text
  quote_policy: summarized
