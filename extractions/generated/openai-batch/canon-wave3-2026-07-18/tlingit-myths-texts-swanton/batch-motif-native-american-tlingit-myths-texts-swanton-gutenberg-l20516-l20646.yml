canonical_text:
  quote: ''
  summary: The passage includes the end of a return by water involving a canoe that
    becomes associated with a stone and a named crooked river. It then describes a
    formerly sleepy or lazy hunter, the youngest among brothers, who excels at hunting.
    At a glacier near Kâck, an old cottonwood gives storm-warning noises. A hunting
    party travels by canoe to the glacier, builds a hunting house, loses its canoe
    when falling ice raises a swell, and remains stranded in winter conditions, surviving
    by the skill of the man said to have been saved by a mountain being.
  language: English translation with Tlingit transcription and interlinear glosses
