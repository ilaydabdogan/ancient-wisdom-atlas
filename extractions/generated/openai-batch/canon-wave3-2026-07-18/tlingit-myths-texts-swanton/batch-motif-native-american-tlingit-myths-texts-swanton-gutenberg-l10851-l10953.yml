canonical_text:
  quote: ''
  summary: The passage first concludes a narrative in which an uncle wounds, tracks,
    kills, and burns his dangerous nephew; the nephew's ashes become gnats. It then
    begins the story of Gᴀmnāˊtckǃî, whose wife is taken under the sea by killer-whale
    people. Gᴀmnāˊtckǃî raises the water like a blanket, walks beneath it, visits
    villages of sea peoples, paints red-cod people red and shark people black, learns
    that his wife is in the killer-whale town, and begins a rescue with help from
    the killer-whale chief's slave using steam as a diversion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The uncle sits behind straw in his house while his wife and children are in
    a hole he made in the mountain; his nephew enters armed with obsidian-pointed
    arrows and spears.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nephew points at a bundle of straw instead of at his uncle; the uncle
    shoots him under the left arm, and the wounded nephew runs out leaving his spear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy has a bird assisting spirit, about the size of a robin, which doctors
    him and removes the poison from the uncle's arrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The uncle tracks the boy by blood marks, kills him despite his plea and promised
    reform, burns the body, and the wind-driven ashes become minute gnats that torment
    people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gᴀmnāˊtckǃî's wife washes seal skin and meat in the sea; killer-whale people
    come landward and pull her underwater into their canoe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before eating, Gᴀmnāˊtckǃî takes red and black paints, raises the edge of
    the water as if raising a blanket, and walks underneath as though on land.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Under the water, Gᴀmnāˊtckǃî encounters red-cod people and halibut people
    in villages; he paints the pale red-cod people red and asks both villages about
    his wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gᴀmnāˊtckǃî enters a fortified shark village, paints the pale shark people
    black, and is told that a strange woman is in the killer-whale village across
    from them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The shark people say they have often fought the killer whales and advise Gᴀmnāˊtckǃî
    to use the killer-whale chief's slave to spill water on the fire, fill the house
    with steam, and carry off his wife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A strange bony-looking person among the shark people identifies himself as
    the halibut hook named Łgudjî that the sharks once took away from Gᴀmnāˊtckǃî.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the creek, the killer-whale chief's slave confirms that the chief has married
