    the fire.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: After the slave shows him where his wife sits, Gᴀmnāˊtckǃî watches through
    a crack, sees her cast down, and runs in to seize her when steam fills the house.
  category: action
  evidence_refs:
  - ev:11
