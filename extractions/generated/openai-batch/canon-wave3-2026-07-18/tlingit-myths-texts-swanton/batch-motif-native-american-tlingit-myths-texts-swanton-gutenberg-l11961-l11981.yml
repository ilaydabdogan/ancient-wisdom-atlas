canonical_text:
  quote: ''
  summary: A chief/father sends men to invite his daughter home; she says she cannot
    come. After her clothing is laid by the lake, she comes with the two high-caste
    frogs she has married. The father later orders the lake drained to recover her.
    When the lake is nearly dry, she is found covered with frogs except for her face,
    carried home, and the frogs follow. Killing frogs on her body only brings more
    until human bones are used, after which the frogs leave and she remains with her
    father.
  language: English
  quote_policy: summarized
