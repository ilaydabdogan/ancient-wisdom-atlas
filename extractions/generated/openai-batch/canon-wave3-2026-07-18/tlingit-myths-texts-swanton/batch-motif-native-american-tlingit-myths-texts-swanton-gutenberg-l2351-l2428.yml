canonical_text:
  quote: ''
  summary: The passage contains two narratives. In one, during famine, a chief’s daughter
    gathering shellfish is held by a large clam as the tide rises; after the tide
    covers her, the people mourn and place offerings in the water. In the Root-stump
    narrative, an airborne thing carries away the people of a town until only two
    women remain. One woman swallows root-juice, conceives a boy named Root-stump,
    and the rapidly growing child gains root-like strength. He anchors himself with
    roots, destroys the airborne killer, later kills a deadly canoe-maker who traps
    people, becomes a provider for his mother, and the story ends with a warning that
    women should not swallow root sap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a famine, women went to the beach at low tide every day to gather shellfish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief’s daughter reached under a rock for clams, and a large bivalve called
    xīt closed on her hand and held her prisoner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tide rose; the trapped woman sang about herself until the tide passed
    over her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Afterward, people felt sad and held a feast for her, placing food, blankets,
    and other things into the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In another town, many people were dying of sickness, while those who felt
    well played shinney on the beach.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Something came down through the air and carried people upward out of sight;
    this repeated until the men and then the women were gone except for two women.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The two remaining women walked along the beach calling for help and went into
    the forest every day for roots.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: One woman swallowed root-juice; it formed a child in her, and the boy was
    born and named Root-stump.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Root-stump grew rapidly, asked where the missing people had gone, tested himself
    with a tree limb, and roots ran out from him in every direction.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: After his mother warned him about playing on the beach, Root-stump seized
    the descending thing, grew roots into the ground, pulled it down, and broke it
    into pieces.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A being in the woods made chopping noises to entice people and killed them
    by closing a canoe on them after asking them to get inside.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Root-stump found the canoe-maker, avoided the canoe trap, killed him, broke
    up the canoe, and piled it on him.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Root-stump grew into a fine man, brought many things to his mother, and crossed
    chasms while hunting by sticking his roots into the ground on the far side.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The narrative ends with a saying warning women who work with roots not to
