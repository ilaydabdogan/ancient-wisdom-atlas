canonical_text:
  quote: "“So even now, when a man is poor, something comes to help him.”"
  summary: A missing woman is searched for by her family. A slave discovers a shining
    house and is told by the woman’s husband not to reveal the house, but to say that
    Garbage-man has married her. The family rushes to the branch house, but the shining
    interior makes them retreat. The husband later gives eight coppers to his father-in-law
    as marriage payment. The branch house is removed, copper shines out, and the narrator
    explains that the husband’s father had arranged this to help him; the episode
    is connected to the high value and lasting use of copper.
  language: English with Tlingit interlinear text
  quote_policy: quoted
