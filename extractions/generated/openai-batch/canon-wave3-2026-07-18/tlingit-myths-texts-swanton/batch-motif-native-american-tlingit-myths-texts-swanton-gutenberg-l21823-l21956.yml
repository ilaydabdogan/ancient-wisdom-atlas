canonical_text:
  quote: ''
  summary: An unnamed man or chief seeks counsel from Old-man-who-knows-all-troubles.
    A helmet or war hat and a talking arrow are associated with him, and he is instructed
    not to shoot toward the old man’s friends. He shoots the arrow toward an enemy
    town, killing a chief; the arrow later flies away through a smoke hole and speaks.
    War follows; the arrow-user enters his war hat, his sister precedes him, and he
    destroys enemies in four canoes. After he forgets the old man’s instruction, the
    old man kills him with his own arrow. A woman and her daughter flee to the woods
    and survive. The daughter marries the sun’s son and has eight children, who are
    provided with a house and food and are lowered to Gîtǃî́kc at their grandfathers’
    town. A concluding address links the descendants with burnt crests, ancestral
    war clothing, and a raven hat.
  language: Tlingit with English interlinear gloss
  quote_policy: summarized
