canonical_text:
  quote: ''
  summary: A Kîksádî origin account says Sky-people destroyed the group, but one woman
    hid under a log. After rejecting Grizzly bear’s offered power, she was addressed
    by a sun-associated being who married her. She bore five children. A large fort
    was lowered over them, and they grew inside it. When enemies came and became too
    strong, the children remembered their father or grandfather, the sun. The sun
    peeped out, made the sea boil, and the hostile people were destroyed in the water;
    the brothers remained in the fort.
  language: English with Tlingit interlinear text
  quote_policy: summarized
