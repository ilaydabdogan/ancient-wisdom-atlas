canonical_text:
  quote: ''
  summary: Raven comments on white birds, tricks killer whales who ask to be made
    white, kills most of them, and eats them. The passage then gives etiological explanations
    for certain human traits and social caution, linking them to Raven’s gender transformation
    and deception. Raven next imposes on several bird hosts, marries among goose people
    but fails to live as they do, participates in feast and dance practices, is credited
    with first establishing certain dances and speeches, avoids a rival feast, and
    finally eats leftovers after being ignored.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven identifies passing white birds, including a small sea gull, another
    white bird, and swans, as beings he made white.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Killer whales ask Raven to make them white; Raven says the process will hurt
    and says the earlier white beings were made white because they were brave.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven sharpens a hardwood stick previously used to kill her husband, tells
    the killer whales to lie in a row, pounds the stick into their ears, and kills
    all but the last one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The last killer whale sees what Raven is doing, escapes into the sea, speaks
    of Raven finishing them, and Raven remains eating the dead whales.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage explains contemporary cowards, lifelong single people, talkative
    thieves, deceptive women, and careful public speech and walking as consequences
    of Raven’s actions and gender transformation at that time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Raven enters fish-hawk’s house, sees much food, stays through the winter,
    refuses to work, promises future abundance, flatters the hawk, and is eventually
    left alone by the hawk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Raven visits another industrious fishing bird, is offered food, and is left
    the next morning because the bird knows Raven is lazy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Raven marries a woman among the goose people and travels with them; when Raven
    tires during the journey, his wife flies beneath him to hold him up.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Raven dislikes goose life and goose food, becomes lean, kills and cooks a
    goose apart from the others, is discovered, is called a man-eater, and is abandoned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Raven is asked to make a totem pole for a feast, dances after it is raised,
    makes a long speech, and holds a spear during a dance as a sign that he will next
    invite others to a feast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that Raven was the first person to have those dances and
    speeches.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: During a final dance, the opposing Raven company dances hard, shows fight,
    and crosses the line set between the companies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Raven avoids the next feast until it has begun, has slaves escort him there,
    tries to obtain a chief’s seat through a slave’s shouted request, is ignored,
    and eats leftovers after the others leave.
  category: sequence
  evidence_refs:
  - ev:7
