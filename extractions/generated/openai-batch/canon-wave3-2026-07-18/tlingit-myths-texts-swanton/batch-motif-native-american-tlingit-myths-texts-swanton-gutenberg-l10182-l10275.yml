canonical_text:
  quote: ''
  summary: A boy left with his uncle survives several attempts on his life by using
    a bracelet associated with transformations into feathers or eagle down. He escapes
    a clam, shrinks and kills a devilfish, survives being pushed from a high tree,
    is tied to a board and set adrift at sea, and finally washes ashore where three
    sisters find and untie him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy’s friends took him to his uncle and left him there for three days;
    the uncle’s wife cried because she thought the young boy had been left to be killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The uncle became angry at his wife’s crying and accused her of being in love;
    the boy answered aloud that she was in love with the right one this time.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The uncle told the boy to come with him to get a devilfish for supper, while
    the uncle’s wife watched them go and thought the boy was the last.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At a clam, the boy remembered his bracelet, turned it, and at the fourth turn
    fell into the clam as a ball of feathers; inside, he turned back into a boy, cut
    both sides of the clam, and came out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy found the devilfish, turned his bracelet twelve times while wishing
    it small, killed it after it became small, dragged it home, and threw it before
    his uncle, where it became enormous again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The uncle put something sharp on the ground, took the boy up a very high tree,
    and pushed him over; after the boy sang and turned his bracelet four times, only
    a ball of eagle down was visible on the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The uncle’s wife told the boy that his uncle was thinking hard because he
    could not kill him; the boy repeatedly answered, “Only a ball of eagle down.”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The uncle pretended to go into the woods but hid behind the house and listened
    while his wife urged the boy to run away and told him of a canoe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the boy fell asleep, the uncle tied him to a board, carried him far
    out to sea, and set him adrift in stormy weather, expecting the feathers to get
    wet and the boy to drown.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy floated ashore safely on a sandy beach at low tide, where three sisters
    digging clams found him as a handsome but silent youth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The eldest sister recognized his smile as like that of her dead lover; the
    second sister fell in love with him; the youngest refused a man who could not
    talk; the two older sisters untied him, and he then said he could talk.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Eagles were gathering around the boy to devour him at the time the sisters
    untied him.
  category: action
  evidence_refs:
  - ev:8
