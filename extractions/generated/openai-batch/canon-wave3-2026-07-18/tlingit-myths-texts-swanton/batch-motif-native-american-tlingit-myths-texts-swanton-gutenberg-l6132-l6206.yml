- id: obs:5
  text: When the arrow is examined, it flies from the old man’s hand, moves in the
    sky, says “Nuˊx̣gayu,” and then goes toward the enemies’ town.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During an attack by canoes, the chief repeats the song-and-drum procedure,
    throws ashes that look like smoke, and shoots an arrow that passes through men
    in multiple canoes and returns to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief later shoots toward the canoe containing the old man’s relations;
    the old man receives the arrow back, sends it at the chief, and kills him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief’s sister puts on her brother’s war clothes, while her daughter sings
    and drums, and uses the returned arrow to kill enemies as her brother had done.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Enemies identify the shooter as a woman by her apron; she and her daughter
    flee into the woods, look back from a mountain, see the house burning, grieve,
    compose songs, and continue into the forest.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
