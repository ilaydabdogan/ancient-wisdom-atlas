canonical_text:
  quote: ''
  summary: An old man makes a wolf-shaped war hat and a marked wooden arrow, then
    instructs a chief in a war rite involving his sister’s song, his niece’s drumming,
    wolf dress, repeated jumping over a rock, and a midnight shot toward an enemy
    village. The arrow kills an enemy chief at a distance, later speaks and reveals
    its source, and returns after killing men in canoes. When the chief mistakenly
    shoots the old man’s kin, the old man sends the arrow back and kills him. The
    chief’s sister then takes up his war clothing and arrow, continues killing enemies
    with her daughter’s song and drumming, is discovered to be a woman, and flees
    with her daughter into the woods, where they see the house burning, grieve, and
    compose songs.
  language: English
  quote_policy: summarized
