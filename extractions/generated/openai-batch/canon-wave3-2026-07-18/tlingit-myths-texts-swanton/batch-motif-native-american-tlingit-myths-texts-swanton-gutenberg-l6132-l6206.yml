- id: obs:2
  text: The old man directs the chief to have his sister sing, his sister’s daughter
    beat the drum, put on the wolf, jump over a beach rock four times, and avoid pointing
    the arrow toward the canoe with the old man’s nephews.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man gives the chief a bow and arrow and tells him to dress for war
    about midnight, stand before his house, aim toward the enemies’ village, speak
    to the arrow, and release it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief follows the directions, shoots the arrow with a spoken command,
    and the enemy chief is found dead with the small arrow in his heart.
