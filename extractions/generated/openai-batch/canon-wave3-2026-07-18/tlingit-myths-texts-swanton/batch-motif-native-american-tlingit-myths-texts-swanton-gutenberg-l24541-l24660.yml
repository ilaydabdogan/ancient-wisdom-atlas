canonical_text:
  quote: ''
  summary: 'The passage gives brief abstracts of several Tlingit narratives: Raven
    helps people disable a canoe-swallowing clam; four brothers and their dog travel
    beyond the sky, die and are restored, encounter unusual peoples, and become thunder,
    Mount Edgecumbe, and rocks; killer whales are made from yellow cedar and later
    abduct a wife who is rescued from an undersea setting; several land-otter stories
    involve abducted humans returning or helping kin; and a boy follows a wolf to
    a distant village, receives powerful objects, and restores the dead.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A place in Tenakee Inlet is named after a person swallowed by a halibut while
    attempting to wade to girls picking berries.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A big clam in the same neighborhood used to swallow canoes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven directed a little mink to call to the clam so that it would put its
    head out, after which people disabled it with sticks and by cutting its closing
    ligament.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Four brothers owned a dog that pursued a cloud into the sky, and the brothers
    followed it to the edge of a steep place on the other side of the world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: One brother stole the spear point of a one-legged salmon spearer by hiding
    in a salmon and cutting it off.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The one-legged man killed three brothers, but the fourth brother, aided by
    red paint, a rattle, and the dog, killed him and restored the brothers to life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The brothers killed a bear chief after previously destroying his slave, and
    the most powerful brother took the bear chief’s place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A hoop killed the three younger brothers; the remaining brother sent the dog
    after it and threw it into the mountains and around the sun, producing curved
    mountain outlines and a ring of light around the sun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The three brothers were again restored to life and continued traveling.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The brothers encountered Athapascan people whose faces had holes instead of
    mouths and who fed themselves with worms through the holes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Łqǃayāˊkǃ obtained bows and arrows among the Athapascan people.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: After suspicion that Łqǃayāˊkǃ was going with his sister was confirmed, the
    brothers told him to go away and become a thunder.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Łqǃayāˊkǃ became thunder; his sister went down into Mount Edgecumbe; the other
    brothers became rocks across the Stikine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: A man of the Tsagueˊdî made killer whales out of yellow cedar after other
    kinds of wood failed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Killer whales abducted a man’s wife after the couple discovered and frightened
    them at their camp and the man began taking their provisions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The husband followed the killer whales into the ocean and reached a town of
    shark people, where he met a lost hook that had become their slave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: With help connected to the shark chief and the killer-whale chief’s slave,
    the husband used steam in the house to seize his wife and run away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: The killer whales and sharks fought, and many killer whales were destroyed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: Killer whales are said to go north, to have several kinds, and to cross yearly
    at a place where they formerly dug through a cliff and carried canoes on skids.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: Kᴀkaˊ was taken south from Sitka by land otters and sent back by the husbands
    of a woman who had been carried off like him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:21
  text: Kᴀkaˊ was transported in a skate used as a canoe and kept covered all the
    way.
  category: object
  evidence_refs:
  - ev:8
- id: obs:22
  text: After friends fasted for two days, they found Kᴀkaˊ lying on a log with blood
    running from his nose and mouth; he was brought home and became a great shaman.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:23
  text: A man’s sister taken by land otters was married among them and later brought
    food to her brother while he was camping alone making a canoe.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:24
  text: The land-otter sister sent her three children to help her brother get bait,
    catch halibut, and launch his canoe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:25
  text: During a famine at Sitka, a son taken by land otters brought his father bait,
    put halibut on his hook, speared a seal, and helped bring home food.
  category: action
  evidence_refs:
  - ev:10
- id: obs:26
  text: The land-otter son first returned to the forest during the day, then stayed
    with his family and became more visible, but grew indistinct and vanished as they
    approached town.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:27
  text: A boy found a little wolf that killed many animals for him; when the wolf
    was mistreated by the boy’s brother-in-law, it ran away and the boy followed it.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:28
  text: An old woman helped the boy cross a big lake and told him that his wolf was
    the son of the town chief in the opposite village.
  category: action
  evidence_refs:
  - ev:11
- id: obs:29
  text: In the wolf’s village the boy received a quill that killed any animal it was
    pointed at and a blanket that healed on one side and killed on the other.
  category: object
  evidence_refs:
  - ev:12
- id: obs:30
  text: The village people were rolling an object identified by the chief as the rainbow.
  category: object
  evidence_refs:
  - ev:12
- id: obs:31
  text: When the boy returned home and found everyone dead, he restored them to life
    with the blanket and became wealthy through his two gifts.
  category: sequence
  evidence_refs:
  - ev:12
