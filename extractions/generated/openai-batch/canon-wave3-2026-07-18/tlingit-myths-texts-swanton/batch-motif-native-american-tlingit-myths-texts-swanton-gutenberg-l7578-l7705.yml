  summary: A sequence of editorial and informant footnotes explains how several Tlingit
    story episodes were used for moral instruction, including episodes involving Raven,
    ghosts, the Creator, Fire-drill’s son, a one-eyed man, a sky village, stars, and
    a disobedient young woman.
