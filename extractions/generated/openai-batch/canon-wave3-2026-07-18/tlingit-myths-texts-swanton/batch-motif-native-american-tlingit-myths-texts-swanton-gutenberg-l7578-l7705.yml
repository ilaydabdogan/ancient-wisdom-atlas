literal_observations:
- id: obs:1
  text: The notes state that the informant wove a large portion of his people’s sacred
    myths into one story and inferred that there were no bad stories about Nās-cᴀˊkî-yēł.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Raven episode is cited as a way to rebuke dishonest living by lying and
    stealing, greed, selfishness, and a trader wanting all the profit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes say Raven ate up all his playmates’ fat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another Raven episode is described in which goods were taken back from Raven,
    he felt shame when discovered, and ghosts watched him although he could not see
    them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same instructional note says children were told that a Creator watches
    them all the time and despises evil conduct.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: One note says an episode is used to address someone who takes after a bad
    father and urges the person to take another road and do better.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The notes say one story is used to teach that a person should not act spitefully
    or try to get ahead of someone who knows better.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fire-drill’s son is said to have fed young hawks instead of killing them,
    and the example is used to advise making friends rather than enemies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The one-eyed man is described as a bad fellow who tries to take advantage
    of a good person.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The notes say a murderer nowadays does not openly admit killing and tries
    to make an innocent person suffer, in comparison with the one-eyed man’s denial.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The one-eyed man’s wife is said to have invited a boy to eat in order to kill
    him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Raven is said to have brought fortune to two old women, and the example is
    used to say that a poor person with self-respect may later have good fortune.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Fire-drill’s son is praised for not using his power meanly; animals tried
    his power, and he did them no harm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Fire-drill’s son is said to have helped an old woman living back in the woods
    and to have gotten her food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A note says Fire-drill’s son was once chasing Dry-cloud when he was pulled
    into a village in the sky for an offense and punished there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The same note says people believed the stars are inhabited, thought of them
    as towns, and explained their light as the reflection of the sea.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: The disobedience of a young woman in looking up contrary to her brothers’
    directions is described as a lesson used for girls at that period in life.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The final note lists teachings not to look down on proud or low-caste persons,
    not to steal, and not to lie.
  category: speech
  evidence_refs:
  - ev:9
