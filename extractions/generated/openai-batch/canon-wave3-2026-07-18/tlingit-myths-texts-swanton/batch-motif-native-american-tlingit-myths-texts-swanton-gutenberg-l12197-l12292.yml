    to persuade a chief.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: medium
  cautions: The passage gives social motives and exchanges, but not a complete resolution
    for the third narrative within this line range.
- id: motif:8
  label: Purifying bath before transmission of love medicine
  taxonomy_refs: []
  basis: Before giving the eagle-tail charm, the very large woman takes a purifying
