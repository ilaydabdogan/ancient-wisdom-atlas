candidate_motifs:
- id: motif:1
  label: Dangerous descent into a hole to obtain medicine materials
  taxonomy_refs: []
  basis: The slave is lowered into a hole under threat and retrieves a sequence of
    living creatures and a final substance that become medicine ingredients.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents the slave, not Floating, as the one physically lowered;
    no broader underworld or initiation frame is stated.
- id: motif:2
  label: Composite medicine made from small creatures and fragrant substance
  taxonomy_refs: []
  basis: Floating mashes ants, frogs, blue flies, and the white substance together
    and stores them in an eagle feather shaft.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives the ingredients and container but does not explain their
    symbolic meanings.
- id: motif:3
  label: Hunting medicine that draws animals to the user
  taxonomy_refs: []
  basis: The Crying-for medicine is said to bring down any bear, mountain goat, or
    other animal desired when shaken in the air.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage states the function but does not narrate an actual hunt using
    it.
- id: motif:4
  label: Love-compelling medicine causing longing or return
  taxonomy_refs: []
  basis: Floating's wife is said to be anxious to return because of Crying-for medicine;
    the large woman also provides a charm and instructions so the youth's wife will
    come to him and not leave.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes coercive emotional effect but does not give a general
    native category beyond Crying-for medicine in the Floating episode.
- id: motif:5
  label: Runaway or estranged wife reversed into rejected supplicant
  taxonomy_refs: []
  basis: Floating refuses the wife who begs to return; in the Haida story, the runaway
    wife is drawn back and then refused by her husband.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:8
  - ev:9
  confidence: high
  cautions: The two cases appear in adjacent narrative material, but the passage does
    not explicitly state they are variants of one tale type.
- id: motif:6
  label: Medicine specialist gives charm validated by animal omen
  taxonomy_refs: []
  basis: The very large woman gives the youth a red-marked eagle's tail and tells
    him to test success by whether a white land otter stands still.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not specify the mechanism by which the eagle tail or
    land otter omen works.
- id: motif:7
  label: Marriage pursued through status, succession, and property exchange
  taxonomy_refs: []
  basis: The Haida youth seeks his uncle's daughter to take the uncle's place and
