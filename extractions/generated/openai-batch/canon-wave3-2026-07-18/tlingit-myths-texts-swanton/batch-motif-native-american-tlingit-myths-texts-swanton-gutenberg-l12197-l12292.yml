canonical_text:
  quote: ''
  summary: The passage closes one narrative about Floating obtaining Crying-for medicine
    from a hole with the coerced help of a slave, using it to attract animals and
    to make his estranged wife long for him while he refuses her. It then gives the
    story of a high-caste Haida youth whose wife repeatedly runs away; he seeks a
    large woman who knows love medicines, receives an eagle-tail charm and an omen
    involving a white land otter, and then refuses the wife when she is drawn back
    to him. The passage begins another story in which a nephew seeks a chief's daughter
    through marriage negotiations but is refused.
  language: English
  quote_policy: summarized
