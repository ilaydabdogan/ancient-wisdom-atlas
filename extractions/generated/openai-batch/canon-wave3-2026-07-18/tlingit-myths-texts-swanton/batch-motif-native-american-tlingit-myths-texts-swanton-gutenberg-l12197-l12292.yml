  locator: 12245-12255
  quote_or_summary: The youth hears of a very large woman who knows medicines for
    getting anyone one loves; her people host him, a large fire is prepared for her
    purifying bath, and a little girl attends her.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summary only.
- id: ev:7
  type: summary
  locator: 12256-12265
  quote_or_summary: After bathing, the large woman gives the youth an eagle's tail
    with one red streak and tells him to raise it when a white land otter comes ashore;
    if it stands still, he will get his wife and she will not leave again.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summary only.
- id: ev:8
  type: summary
  locator: 12266-12273
  quote_or_summary: The youth follows the instructions; his wife becomes anxious to
    see him and cannot resist going, but he refuses her and marries someone else in
    another village with his father.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summary only.
- id: ev:9
  type: summary
  locator: 12273-12280
  quote_or_summary: The first wife later demands property; the youth gives her his
    and his father's property and slaves so she will not bother the new wife, and
    she cries daily over his new marriage.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summary only.
- id: ev:10
