canonical_text:
  quote: ''
  summary: After Łtᴀxdᴀˊx dies, his valuable copper and named dish are taken out.
    Trouble arises over the dish, and a group from one side of the house, about forty
    people, leaves sadly toward a big mountain, taking sisters and brothers as companions
    or carriers. They dress in fine clothing and hats because they want to die wearing
    them. Near the mountain they discuss where to pass through, club many ground squirrels,
    and fog forms; some people are lost and disappear. The remaining group continues
    but finds no place to pass through, while the mountain appears very close.
  language: English with Tlingit interlinear text
  quote_policy: summarized
