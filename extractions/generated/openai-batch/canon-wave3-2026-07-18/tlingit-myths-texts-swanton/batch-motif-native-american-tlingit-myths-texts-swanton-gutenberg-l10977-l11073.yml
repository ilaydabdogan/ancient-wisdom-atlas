canonical_text:
  quote: ''
  summary: A footnote identifies the story as a version of a Tsimshian story. The
    passage then introduces the hīn-taỵīˊcî, a many-legged halibut-shaped fish. A
    Kîksᴀˊdî shaman named Face-of-mountain is led by spirits with his people to a
    sea-cliff observation place, where they repeatedly witness the hīn-taỵīˊcî fight
    successive groups of killer whales and other sea creatures. A sculpin repeatedly
    warns the hīn-taỵīˊcî of new attacks. The creature defeats killer whales, devilfish
    people, and monster halibut, usually leaving three killer whales alive, but when
    warned of big crabs it says they are the ones that will get it.
  language: English
  quote_policy: summarized
