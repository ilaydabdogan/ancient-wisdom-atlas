candidate_motifs:
- id: motif:1
  label: Funerary transfer through burning
  taxonomy_refs:
  - sacred_exchange
  basis: Bodies, food, and property are burned or destroyed so that the dead are comfortable
    and receive the food and property.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage explains a ritual transfer
    to the dead but does not use comparative terminology.
- id: motif:2
  label: Child Raven brings celestial light
  taxonomy_refs:
  - culture_hero
  basis: Raven as the wished-for grandchild obtains the moon and the box of daylight
    from his grandfather and releases them into the sky and world.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not give the full birth episode in this excerpt, so the
    motif is limited to the child’s acquisition and release of light.
- id: motif:3
  label: Release of daylight transforms people into animals
  taxonomy_refs:
  - shapeshifter
  basis: When daylight bursts upon the people, they run into water or woods and become
    seals, martens, bears, and other animals according to their skins.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The transformation is collective and clothing-linked; it is not described
    as voluntary shapeshifting.
- id: motif:4
  label: Theft of guarded freshwater and origin of rivers
  taxonomy_refs:
  - sacred_theft
  - culture_hero
  basis: Petrel keeps fresh water from others; Raven steals a mouthful and drops it
    in places that become the great rivers.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Only the water episode is explicitly called stealing; no broader historical
    comparison is implied.
- id: motif:5
  label: Acquisition and localization of fire
  taxonomy_refs:
  - culture_hero
  basis: Raven sends Chicken Hawk to bring fire from far out at sea and places it
    in rock and red cedar, explaining former fire-making practice.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not say the fire is stolen, only fetched from a distant
    source.
- id: motif:6
  label: Ambivalent culture hero institutes practices
  taxonomy_refs:
  - culture_hero
  - trickster_boundary
  basis: Raven teaches people what to do for a living and institutes or exemplifies
    funeral rites, crest-animal speech, slavery, shamanism, dances over the dead,
    fishing hooks, and traps, while also teaching foolishness and being linked to
    witchcraft.
  evidence_refs:
  - ev:1
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The trickster-boundary classification rests on the passage’s description
    of foolishness and witchcraft alongside useful instruction.
- id: motif:7
  label: Etiology of Raven’s black color
  taxonomy_refs: []
  basis: Raven is said to have formerly been pure white and to have turned black after
    being held in the smoke while escaping with Petrel’s water.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No supplied taxonomy family directly names animal-color origin; classification
    is left without taxonomy reference.
