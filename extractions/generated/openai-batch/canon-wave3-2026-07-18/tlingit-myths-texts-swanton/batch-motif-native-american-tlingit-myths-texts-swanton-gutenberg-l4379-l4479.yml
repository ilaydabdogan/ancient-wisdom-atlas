canonical_text:
  quote: ''
  summary: The passage explains burning bodies, food, and property for the dead; narrates
    Raven as the grandchild associated with bringing daylight; describes Raven releasing
    the moon and daylight, causing people to become animals; recounts Raven stealing
    freshwater from Petrel and creating rivers; explains Raven obtaining fire through
    Chicken Hawk and placing it in rock and red cedar; and lists practices Raven taught
    or exemplified among the Tlingit, including ritual, social, shamanic, and fishing
    practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People burn bodies of the dead and put food into the fire for them; the passage
