canonical_text:
  quote: ''
  summary: A being identified as Strength comes to help a man, subjects him to a forceful
    encounter involving water, and tells him to break a strength-contest object and
    put urine in its place. The man secretly breaks the object at night, is named
    as the breaker, and is laughed at as not strong. Later he is taken to a sea-lion
    island, receives the proper name Kāhā́sǃî, and displays great power by handling
    two sea lions. Afterward his companions do not beat him, and his strength remains
    known and recounted.
  language: Tlingit with English interlinear gloss
  quote_policy: summarized
