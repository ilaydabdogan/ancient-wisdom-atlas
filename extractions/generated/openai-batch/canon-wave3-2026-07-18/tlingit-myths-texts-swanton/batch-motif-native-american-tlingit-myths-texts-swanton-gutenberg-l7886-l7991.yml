canonical_text:
  quote: ''
  summary: 'The passage first gives footnote material about eagle feathers, mourning
    speech, and a peace-making office called the deer, plus brief informant comments
    and cross-references. It then begins the tale of Kakēˊqǃᵘtê: he captures a bird-shaped
    being named Sleep, gives it away, becomes unable to sleep, travels inland, makes
    a fish trap, encounters Athapascans, sees copper arrows, marries two Athapascan
    sisters, and teaches a more efficient fish-trap technology called tǃītx with a
    weir.'
  language: English
  quote_policy: summarized
