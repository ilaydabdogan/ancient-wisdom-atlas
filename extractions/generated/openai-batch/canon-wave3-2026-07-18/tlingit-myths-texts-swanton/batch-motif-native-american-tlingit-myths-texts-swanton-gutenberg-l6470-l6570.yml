- id: motif:2
  label: Etiology of local shellfish poison and avoidance
  taxonomy_refs: []
  basis: The passage explains that local shellfish, especially mussels, are poisonous
    because the boy killed the big mussel, while also noting seasonal avoidance by
    Alaskans.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a local explanatory motif; no supplied taxonomy ref precisely
    matches it.
