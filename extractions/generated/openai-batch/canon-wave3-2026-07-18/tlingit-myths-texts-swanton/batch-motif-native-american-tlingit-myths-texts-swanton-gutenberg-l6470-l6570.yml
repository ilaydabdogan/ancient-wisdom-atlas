canonical_text:
  quote: ''
  summary: A boy kills a canoe-destroying giant mussel, brings home its shell for
    weapons and tools, and the episode is used to explain local shellfish poison.
    His son Man-that-eats-the-leavings understands shellfish language and later controls
    devilfish attacking a town. A chief's daughter slips on devilfish slime, disappears
    with a devilfish appearing as a young man, has devilfish children, returns to
    her parents, and is kept after her devilfish husband is killed. Devilfish retaliate
    until Man-that-eats-the-leavings stops them. The woman is then bathed and reclothed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The grandmother tells the boy about a big mussel living in a certain direction
    and says no canoe can pass it without being chewed up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy goes to the big mussel, kills it, and takes all of its shell home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People throughout the village buy the mussel shell from him for spears, arrow
    points, and knives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says Tsimshian shellfish are fine, Alaskans avoid shellfish especially
    mussels in April as poisonous, and the local poison is attributed to the boy killing
    the big mussel.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy later marries and has a son named Man-that-eats-the-leavings, who
    is described as unlike him and worthless but able to see shellfish and understand
    shellfish language.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A chief's daughter slips on slime from a devilfish hung in front of a house,
    calls it dirty, and later that night a fine-looking young man comes to her and
    she disappears with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man is identified as the devilfish; the woman marries him and has
    several children by him while her parents mourn her absence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two small devilfishes appear on the chief's house steps, twice return after
    being thrown to the beach, enter the house, and climb into the laps of the chief
    and his wife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief addresses the two small devilfishes as possible grandchildren; after
    they are fed on long platters, people follow them and see them disappear under
    a large rock, and the platters later return clean.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The chief sends servants to invite his daughter, her children, and her husband
    to dinner; the woman answers from under the beach that they will come.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The daughter comes up with her devilfish husband and two little devilfishes;
    her robe is rotten, seaweed is in her hair, and she looks badly.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: After consultation, the chief and people invite the devilfishes again, kill
    the big devilfish, throw the little ones down on the beach, and keep the girl.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The girl warns of a terrible war because all the devilfish are assembling,
    and tells the town not to sleep at night.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: At night large and small devilfishes enter through cracks until the house
    is full, and some people are suffocated when devilfishes cover their mouths.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Man-that-eats-the-leavings comes to the town, hears of the nightly trouble,
    stays until evening, and seems to control the devilfish so that they stop bothering
    the people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage says large devilfishes are called dᴀg̣asā́ and that the small
    devilfishes seen by Alaskan Indians do not now injure anyone because their grandfather
    was human.
  category: other
  evidence_refs:
  - ev:9
- id: obs:17
  text: The girl is bathed to remove the devilfish from her, dressed in fine clothing,
    and is then desired in marriage by neighboring chiefs because of her beauty.
  category: sequence
  evidence_refs:
  - ev:10
