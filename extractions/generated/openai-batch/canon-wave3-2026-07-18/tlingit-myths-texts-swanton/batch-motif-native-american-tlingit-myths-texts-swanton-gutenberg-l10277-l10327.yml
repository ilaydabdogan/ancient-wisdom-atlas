canonical_text:
  quote: ''
  summary: A young man is brought into the sisters’ father’s house and marries both
    sisters. The elder sister notes his resemblance to her dead lover. The sisters
    hunt salmon and try to teach him to hunt. Jealousy develops between the younger
    and elder wives over the husband’s attention and over salmon. The young man decides
    to leave temporarily, explains a dead elder-brother/cousin connection to the elder
    sister, then travels to his uncle, kills him in revenge for murdering his brothers
    and making him suffer, tells the uncle’s wife why, and returns to his wives.
  language: English
  quote_policy: summarized
