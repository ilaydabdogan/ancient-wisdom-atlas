canonical_text:
  quote: ''
  summary: A man in hardship at a spring halibut camp is aided by his long-drowned
    sister, who has been taken by land otters and married among them. She brings food
    from the land-otter people, sends her three otter-human sons to help him fish
    and move his canoe, briefly causes tails to grow on his children, and later disappears
    with her sons; the man finds only land-otter holes when he searches for them.
  language: English
  quote_policy: summarized
