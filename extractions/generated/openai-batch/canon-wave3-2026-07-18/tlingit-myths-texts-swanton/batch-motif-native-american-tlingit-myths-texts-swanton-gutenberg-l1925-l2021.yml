canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a land-otter-man travels
    by canoe with his parents and disappears near a point before they reach Sitka,
    after which a feast is given and a place-name is explained. It then begins the
    tale of the Wolf-chief’s son: during famine a youth finds a dog-like animal, marks
    it with red paint, and it hunts birds and sheep that keep his family and friends
    alive. The youth treats the animal with preferred portions, but his brother-in-law
    insults it by throwing entrails in its face, causing it to flee into the mountains.
    The youth follows the red-painted trail and learns the animal is the wolf-chief’s
    son, sent to help him; the red paint explains wolf markings. He reaches a large
    lake with a town across it, enters a hidden dwelling through a door under his
    feet, and receives instructions from Woman-always-wondering about a canoe that
    will enlarge and carry him by wishing rather than paddling.'
  language: English
  quote_policy: summarized
