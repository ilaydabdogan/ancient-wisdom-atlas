canonical_text:
  quote: ''
  summary: An uncle's wife mistreats her husband's small nephew over a missing piece
    of mountain-sheep fat and wounds his cheek. The boy takes his uncle's whetstone,
    leaves for the woods and a creek, makes salmon-like nests by the water, and receives
    dream instruction from his spirit to let the whetstone swim in the water. The
    uncle asks after him, and the wife says the boy went up with bow and arrows. The
    boy, named For-little-slave, makes eight nests; on the last his spirit helper
    comes, the whetstone swims in the creek, he loses his senses and stays against
    a cliff, and birds come to hear him but are destroyed when his spirits leave.
  language: English translation with Tlingit interlinear text
  quote_policy: summarized
