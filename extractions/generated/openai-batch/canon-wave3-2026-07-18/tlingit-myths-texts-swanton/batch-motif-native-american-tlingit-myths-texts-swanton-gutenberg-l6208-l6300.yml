canonical_text:
  quote: ''
  summary: A woman seeks a husband for her daughter and rejects many animal and bird
    suitors after asking what they can provide. She accepts a shining man, son of
    the Sun, after he demonstrates his connection to the Sun. The man transforms his
    mother-in-law into Woman-of-the-forest, the echo. A spherical cloud carries the
    wife and husband upward to his beautiful home. They have eight children, who are
    equipped by their grandfather and sent down in the spherical cloud with a miniature
    house and provisions to Gîtǃî́kc, where the house and stores become large. When
    enemies attack, the boys place a painted wooden wedge in the fire and call on
    their grandfather; the Sun comes out fiercely, killing or blinding the enemies.
  language: English
  quote_policy: summarized
