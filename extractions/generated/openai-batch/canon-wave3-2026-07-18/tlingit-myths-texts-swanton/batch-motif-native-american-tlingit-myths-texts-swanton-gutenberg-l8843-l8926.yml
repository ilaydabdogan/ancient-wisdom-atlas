canonical_text:
  quote: ''
  summary: In the story titled “Origin of the ʟǃêˊnᴀxx̣īˊdᴀq,” a youth captures a
    baby belonging to a woman from a lake. The child gouges out the eyes of the people
    in the village, while a sick woman protects herself and her own child. The sick
    woman departs with wealth objects and is identified as the ʟǃêˊnᴀxx̣īˊdᴀq, a sign
    of coming wealth. Later, Heavy Wings encounters a woman with an infant, takes
    the infant, receives coppers in exchange for returning it, and gains wealth through
    a scratch whose scabs enrich his close relatives.
  language: English
  quote_policy: summarized
