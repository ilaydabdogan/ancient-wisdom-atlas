canonical_text:
  quote: ''
  summary: The passage contains a footnote marker, the full story “The Duck Helper,”
    and the opening portion of “The Boy Who Shot the Star.” In the first story, a
    boy and his mother survive smallpox, the boy becomes lost in the woods, encounters
    a black duck that turns into a man, receives a coat and instructions, and returns
    to his mother by thinking only of his uncle’s house. In the second story, two
    high-caste boys go to a moonlit hill with arrows; one compares the moon to his
    mother’s labret and disappears after darkness and a rainbow-like ring appear.
    The remaining boy shoots at a bright star until arrows form a chain reaching down
    to him.
  language: English
