canonical_text:
  quote: What he called one night was a whole month.
  summary: A mountain being instructs a man about finding grizzly bear dens and warns
    him not to use green fern roots. The man spends an altered length of time in the
    mountain, then receives provisions and a living, grizzly-bear-like canoe. The
    canoe must be fed or it will eat him. He returns downriver toward his home, feeds
    the canoe, is seen by his friends, and brings the canoe ashore; it becomes stone
    and leaves an etiological river name and crooked river course.
  language: English with Tlingit interlinear transcription
  quote_policy: quoted
