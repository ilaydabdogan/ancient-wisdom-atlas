canonical_text:
  quote: ''
  summary: A poor high-caste woman shaman, Djīyīˊn, restores her uncle’s ruined house
    by ritual action with an eagle’s tail. She is summoned to treat a sick chief and
    his sick daughter. Her spirits identify a witch, who arrives as a wild canary.
    The bird is restrained, and its bird-children swarm into the house and injure
    people. The restrained bird later leads men to a skull containing hair, food,
    clothing, leaves, and pieces of clothing used in bewitching; the materials are
    thrown into the sea, after which the chief and daughter recover. The bird is then
    taken to another place, entering a town under tree roots. The passage concludes
    that people learned witchcraft from this bird.
  language: English
  quote_policy: summarized
