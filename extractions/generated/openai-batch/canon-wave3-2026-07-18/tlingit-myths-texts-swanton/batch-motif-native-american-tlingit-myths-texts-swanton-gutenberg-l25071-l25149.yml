canonical_text:
  quote: ''
  summary: 'The passage gives a compressed sequence of Tlingit myth episodes: Raven
    teaches fire-making, extraordinary births and transformations occur, Fire-drill’s-son
    and later descendants kill dangerous beings, sky features are formed, helpful
    and hostile animal peoples appear, Raven tricks and marries, and a woman undergoes
    fox transformation, death, revival, and shamanic elevation.'
  language: English
  quote_policy: summarized
