canonical_text:
  quote: ''
  summary: A man and his wife, stopped by fog while crossing a bay in a canoe, hear
    a powerful song. As the fog lifts, they find the song comes from a very small
    frog. The couple disputes who will claim it; the husband yields to the wife. She
    treats the frog like a child, takes it ashore, places it by a lake in the woods,
    and the passage explains this as the origin of the Sitka Kîksᴀˊdî claim to the
    frog.
  language: English
