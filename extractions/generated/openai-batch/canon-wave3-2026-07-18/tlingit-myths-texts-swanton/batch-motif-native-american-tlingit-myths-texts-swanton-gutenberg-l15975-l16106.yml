canonical_text:
  quote: ''
  summary: A Kîksadî story set at early Sitka/Mossy-town tells how Łqǃayāˊkǃ’s wife
    mistreats her mother-in-law by refusing herring and putting hot herring milt in
    her hand. Łqǃayāˊkǃ harvests herring, sends his wife down to the canoe empty-handed,
    refuses her request for a basket, and by morning her speech changes into owl cries.
    He tells her she may become an owl because of what she did to his mother; she
    flies away as an owl. The story explains Owl’s-rock-slide and says owls are understood
    as predictors of bad weather and events in other towns.
  language: English with Tlingit interlinear text
  quote_policy: summarized
