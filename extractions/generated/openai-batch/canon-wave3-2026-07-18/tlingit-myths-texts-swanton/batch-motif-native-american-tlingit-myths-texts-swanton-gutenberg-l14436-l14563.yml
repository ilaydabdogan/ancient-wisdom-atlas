  quote: ''
  summary: A narrative excerpt describes an armed male figure, identified as Heron's
    son, encountering a head in a road, consulting his mother about unreturned uncles,
    and then using a hīntaỵīcî coat or shirt to kill a devilfish and a rat associated
    with holes. The devilfish is said to have destroyed people; the rat is defeated
    when its tail is cut by the sharpened garment.
