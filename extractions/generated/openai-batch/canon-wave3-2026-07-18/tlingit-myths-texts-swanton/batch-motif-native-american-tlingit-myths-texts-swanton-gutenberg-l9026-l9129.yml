canonical_text:
  quote: ''
  summary: The passage contains two brief footnotes followed by the beginning of the
    story “Little Felon.” A man’s painful finger felon is treated through the smoke
    hole, and the disease becomes a tiny man named Little Felon. Little Felon is skilled
    in crafts, running, and shooting, and later helps a youth seek a woman in marriage
    by revealing the answer to a lethal skin-guessing riddle and warning him about
    the old woman’s dangerous powers. After the youth answers that the skin is from
    a louse, the old woman sets monster-killing tasks involving a devilfish and a
    rat, both of which Little Felon helps overcome.
  language: English
