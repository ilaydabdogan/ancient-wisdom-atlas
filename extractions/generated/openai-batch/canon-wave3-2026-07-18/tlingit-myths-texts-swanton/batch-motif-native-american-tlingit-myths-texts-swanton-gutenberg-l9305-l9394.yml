canonical_text:
  quote: ''
  summary: An orphan girl named Djīyīˊn is taken root-digging only after her aunt
    intervenes, then is left alone by the women. Her aunt secretly leaves her a live
    coal and dried salmon. The girl cannot eat, encounters brants, finds buried canoes
    filled with stored foods, and learns that bird spirits are keeping food from her
    because she is becoming a shaman. Later she feeds visiting villagers, summons
    her aunt, helps other mistreated orphans, obtains slaves in exchange for food,
    and eventually is hired to treat a sick town chief after her spirit makes him
    ill.
  language: English
  quote_policy: summarized
