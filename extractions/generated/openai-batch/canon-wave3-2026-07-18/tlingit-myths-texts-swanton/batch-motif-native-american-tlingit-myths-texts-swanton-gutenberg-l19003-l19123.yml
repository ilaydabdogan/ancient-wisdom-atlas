canonical_text:
  quote: ''
  summary: 'The excerpt first identifies a red lake as blood. It then recounts warriors
    enslaving a shaman''s sister and aunt and carrying off his spirit box. When the
    warriors handle the contents and put on the chief spirit, Hanging-down spirit,
    those who wear it are destroyed except for one who runs away, and the shaman''s
    spirit is said to continue killing. The passage then describes a Kāgwᴀntān house-building
    ceremony: preparation of green-stone tools, fasting by the house owner, chopping
    and transporting house timbers, reciprocal participation by the opposite phratry,
    tobacco preparation and distribution, dancing with emblem hats, carving wolf posts,
    and naming the completed house Wolf House.'
  language: English with Tlingit interlinear
  quote_policy: summarized
