canonical_text:
  quote: ''
  summary: The passage gives several Tlingit song texts with English translations
    and explanatory notes. One song says Raven married a land-otter woman, became
    a messenger, encountered land-otter people acting as deer, beat a noisy drum identified
    as a lobster, and knocked a hole through it. Other songs concern a man saved by
    his Raven phratry, peace songs involving Raven’s canoe and Wolf’s home or town,
    a deer dance song linked to a killing after a ghost was seen before death, and
    a peace song addressed to Kāgwantān children and Raven.
  language: English translation with Tlingit transcription
  quote_policy: summarized
