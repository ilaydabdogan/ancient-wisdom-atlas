  summary: The passage contains Tlingit song text, glosses, translations, and editorial
    notes for songs numbered 62-64, plus the end of a preceding love song. Themes
    include love, longing to see brothers, a song about Princess Thom addressed as
    a Raven woman, and two songs or notes about men whose wives were taken away and
    who suffer sleeplessness or grief.
