canonical_text:
  quote: ''
  summary: The passage first explains a custom of restrained speech in retaliatory
    killing and care in arranging a daughter's marriage for family benefit. It then
    narrates how a chief's daughter, while berrying, is taken by a grizzly bear in
    human form, lives among bear people, receives advice from an older woman, escapes
    using objects that become barriers, is rescued by a man in a canoe after promising
    marriage, and sees the pursuing bears killed by the man's club in the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a high-caste good man is killed in fighting, his friends use good words
    toward opponents to induce a man of equally high rank on the other side to come
    out and be killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A saved woman remembers that her brother and relations were killed and takes
    care in selecting a husband for her daughter, believing this will help get her
    relatives back and help the family.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A chief's daughter goes berrying, steps into grizzly bear manure, and calls
    it a nasty thing in the way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A grizzly bear comes to the chief's daughter in the form of a fine-looking
    man; she goes off with him, while others think a grizzly bear killed her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The grizzly-bear people watch the girl closely and cover her tracks, but dentalium
    shells from her clothing are found in the covered tracks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the bear people, male bears go after salmon and the wives gather firewood;
    the girl initially gathers dry wood and cannot keep a fire, then learns from an
    old woman to use wet wood like the others.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old woman says she also came there through the same kind of event and
    tells the girl this is not a good place and asks whether she wants to go back
    to her father and mother.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old woman instructs the girl to collect devil's club, a wild rose thorn,
    sand, and a small rock, and to throw objects behind her when the bear people pursue.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'During the pursuit, thrown objects create or become barriers: many devil''s
    clubs, rose bushes, mud, a sand bank, and a high cliff.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The girl reaches a beach and asks a man fishing for halibut from a canoe to
    save her; he asks whether she will be his wife if he saves her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the girl agrees to become his wife, the canoe man takes her into his
    canoe and goes out again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The pursuing bears call the girl their wife, threaten the canoe man, swim
    toward the canoe, and are all killed when he puts his club into the sea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The canoe man tells the frightened girl not to be afraid and says his father
    was of the Ginᴀxcᴀmgêˊtk.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the bears are killed, the girl and the canoe man go to his home.
  category: action
  evidence_refs:
  - ev:7
