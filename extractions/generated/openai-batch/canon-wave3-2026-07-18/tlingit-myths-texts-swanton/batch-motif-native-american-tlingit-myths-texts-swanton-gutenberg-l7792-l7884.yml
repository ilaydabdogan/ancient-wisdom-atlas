canonical_text:
  quote: To see a G̣onaqᴀdēˊt brought wealth to the beholder.
  summary: The passage consists of explanatory footnotes giving social applications
    of Raven-related stories, comments on laziness, truthfulness, and social disgrace,
    a description of reciprocal feast etiquette and status competition, notes on G̣onaqᴀdēˊt
    and wealth, variant identification of a woman as Nās-cᴀˊkî-yēł’s wife or daughter,
    and a short variant in which a jealous husband guards his wife, animals and sea
    creatures are released from her arms, and a flood is survived by means of a large
    canoe with attached canoes and two animals of each species.
  language: English
  quote_policy: quoted
