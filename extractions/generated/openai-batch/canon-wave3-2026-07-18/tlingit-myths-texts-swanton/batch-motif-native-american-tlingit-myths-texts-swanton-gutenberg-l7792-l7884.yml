candidate_motifs:
- id: motif:1
  label: False high-status identity claim
  taxonomy_refs:
  - trickster_boundary
  basis: The passage says Raven made believe her father was a chief and explains the
    story as used for people who make others believe they are better or higher-born
    than they are.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is an informant’s social explanation rather than a full narrative
    episode.
- id: motif:2
  label: False mourning and misuse of inherited property
  taxonomy_refs: []
  basis: The explanation links false mourning, stories about a husband’s death, and
    the saying that a widow will eat up her husband’s body, meaning she will foolishly
    use his property.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The motif is presented as moral commentary and proverbial usage, not as
    a complete mythic scene.
- id: motif:3
  label: Lazy wanderer socially exposed
  taxonomy_refs: []
  basis: Lazy persons are described as moving from house to house or town to town,
    living on others, and becoming known and looked down upon wherever they go.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No specific supernatural action is attached except the separate note about
    Raven helping the abandoned.
- id: motif:4
  label: Raven helps the abandoned
  taxonomy_refs:
  - trickster_boundary
  basis: A bracketed note states that Raven comes along and helps one abandoned in
    a village.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives only a brief note and no full episode.
- id: motif:5
  label: Hidden wickedness betrayed by small act
  taxonomy_refs: []
  basis: The passage states that although a wicked man may appear nice, he will soon
    be found out because some small act will betray him.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a generalized moral statement rather than a developed narrative.
- id: motif:6
  label: Reciprocal feast as status competition
  taxonomy_refs:
  - sacred_exchange
  basis: The passage describes return payment after invitations, giving another feast
    if too much was received, and families appearing to compete over which was highest.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The taxonomy reference is based on formalized exchange; the passage itself
    frames the practice socially rather than explicitly as sacred.
- id: motif:7
  label: Ritualized mock hostility toward feast guests
  taxonomy_refs:
  - sacred_exchange
  basis: The host is called out as though enemies are approaching, appears armed,
    and reclassifies the approaching canoe party through set speeches during the feast
    protocol.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage describes etiquette and prepared speech; mythic significance
    beyond the feast setting is not detailed here.
- id: motif:8
  label: Wealth-bringing sight of G̣onaqᴀdēˊt
  taxonomy_refs: []
  basis: The note states that seeing a G̣onaqᴀdēˊt brought wealth to the beholder.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not describe the appearance or narrative actions of G̣onaqᴀdēˊt.
- id: motif:9
