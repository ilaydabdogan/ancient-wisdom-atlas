  type: summary
  locator: lines 7814-7825, footnote 79
  quote_or_summary: Persons without self-respect go house to house for food and are
    greedy and lazy; truth-tellers keep their word; Katishan was warned that laziness
    would leave him alone in a village; a note says Raven helps one abandoned in a
    village.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 7827-7837, footnote 80
  quote_or_summary: A lazy man is known wherever he goes, wanders living on others,
    and is looked down upon even if high-caste; children were taught to stay and make
    their living in their native place.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 7839-7841, footnote 81
  quote_or_summary: A wicked man may appear very nice, but some little act will betray
    him and he will be found out.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tlingit-myths-texts-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 7843-7870, footnote 82
  quote_or_summary: 'Reciprocal feast etiquette: a previous inviter is paid first
    and more than he gave; feast exchanges look like family status competition; a
