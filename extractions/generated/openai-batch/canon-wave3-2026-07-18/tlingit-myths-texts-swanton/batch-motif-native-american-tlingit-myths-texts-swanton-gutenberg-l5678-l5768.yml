canonical_text:
  quote: ''
  summary: A poor husband follows a receding creek to a mountain house, where an old
    water-associated woman transforms his appearance and gives him dentalia. He returns
    wealthy and becomes chief through exchanges with his wife's kin. Later his proud
    high-caste wife is carried off by brants, loses her clothing and hair, receives
    fox-skin clothing from an underground sweathouse through another old woman, and
    is identified as having become a fox.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A creek moves back from the man when he tries to fill his basket, and he follows
    it to a mountain where it vanishes into a house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the house he meets a very old woman, and he explains that his wife's
    high-caste relatives are visiting while he is poor and unable to entertain them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman brushes back his hair several times; his hair becomes beautiful,
    his clothes become valuable, and his basket becomes large and beautiful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the old woman's direction he uncovers a spring, dips the basket into it,
    and draws it out full of dentalia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When he returns home, most people do not recognize him at first; his wife
    and those who had seen him during the earlier wife-seeking episode do recognize
    him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: He gives water and dentalia to his guests, and his father-in-law and brothers-in-law
    give him slaves, valuable furs, and other property.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that he becomes very rich and chief of the town, and links
    the story to a present custom of returning more than the value of a brother-in-law's
    gift.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: After gaining status he has a big house built, his commands are obeyed, and
    those who had formerly mocked him become like slaves to him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: His wife becomes prouder, and people who displease her are put to death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: From the roof, the wife sees flocks of swans, geese, cranes, and brants, each
    time saying that a high-caste person she was going to marry is among them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the brants hear her words, they fly down, carry her away, and her husband
    runs underneath but cannot overtake them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the birds drop her, she is naked and without hair, makes herself a leaf
    apron, finds a red snapper head, and reaches a house with an old woman.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The woman and the old woman cook fish, and the woman hears many boys shouting
    though she sees no one.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: At the old woman's instruction she takes food to a hole leading to an underground
    sweathouse with many protruding hands; the tray is returned with two fine fox
    skins, which she makes into clothing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The old woman tells her that her parents live nearby at a salmon creek; when
    she approaches them, her father calls her a fox and looks for something to kill
    it, so she runs away.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The old woman says that she has already turned into a fox and tells her to
    go back and let her father kill her.
  category: speech
  evidence_refs:
  - ev:10
