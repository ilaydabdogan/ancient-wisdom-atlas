canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a boy obtains a box containing
    his village people''s lives from wolf people and restores the people by leaving
    it in each house for four days. It then begins “The Salmon Chief”: a fisherman
    releases a speaking salmon chief and is rewarded with salmon; later another speaking
    salmon instructs him to preserve its bones under his pillow, where two boy babies
    appear. One son grows brave and departs, meets an old woman who tells him of a
    seven-headed monster being fed the chief''s daughter, and then confronts the monster
    near its den.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy asks through the houses of a wolf people's village for his town people's
    lives, threatens to strike the village, and receives a box of lives from the wolf
    chief with instructions to leave it in each house for four days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy returns to his native village, leaves the box in houses for the prescribed
    period, and the absent people come to life; his mother and grandmother are happy
    after the people are restored.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A fisherman finds a salmon on the beach; the salmon speaks, identifies itself
    as chief of all salmon, asks to be put back into the water, and promises many
    salmon if released.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the first salmon is released, the weather becomes calm and the fisherman
    catches many salmon; later, during stormy conditions, he finds another salmon
    that tells him to cook it, avoid breaking its bones, place its head bones in a
    dish, and sleep on them under his pillow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fisherman and his wife are childless and want children; about midnight
    the man looks under his pillow and sees two boy babies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The two boys grow quickly; one is brave, while the other is cowardly and remains
    at home. The brave son asks about other people, begs to go away, and receives
    food for the journey after his parents consent.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The departing boy meets an old woman who addresses him as grandson and feeds
    him; she explains that a nearby black-looking village is threatened by a seven-headed
    being who must be fed the chief's daughter or else will murder everyone in the
    village.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A procession with a drum and dancing takes the chief's daughter toward the
    monster and returns without her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The boy runs after the chief's daughter; she says her father has given her
