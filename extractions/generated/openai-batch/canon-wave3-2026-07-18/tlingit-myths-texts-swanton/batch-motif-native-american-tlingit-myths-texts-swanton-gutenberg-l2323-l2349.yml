canonical_text:
  quote: ''
  summary: A youngest brother finds a settlement and people search for his brothers,
    discovering the place where a devilfish had floated with hunters and a canoe.
    A death feast and hair-cutting follow. In the same town, a continually crying
    boy is verbally offered to Djînᴀkᴀx̣wᴀˊtsǃa by his father; a land-otter-man responds
    from behind the house, has the child brought to him, and feeds him what appear
    to be blackberries. After two days the boy is found in the woods with a swollen
    belly. Salmon broth expels spiders or small creatures from his body; his flesh
    has been eaten away, leaving only skin.
  language: English
  quote_policy: summarized
