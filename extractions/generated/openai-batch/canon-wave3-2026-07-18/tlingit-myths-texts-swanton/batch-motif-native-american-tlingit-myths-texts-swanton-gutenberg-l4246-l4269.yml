  quote: God (Dekīˊ-anqāˊwo, Distant-chief) had come down from heaven to help them.
  summary: The passage includes editorial footnotes, then begins an account titled
    as the first hearing of Protestant Christianity at Sitka. A man returns from the
    south, calls people to a dance, and reports that God, glossed as Distant-chief,
    has come down from heaven to help them. Women make beadwork, dance, fall on their
    backs, and are revived or protected by salt water applied to blankets and flapped
