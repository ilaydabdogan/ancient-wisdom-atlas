canonical_text:
  quote: ''
  summary: After recovering, Dthas Seeven plans against Seeollstchewadack-Seeven by
    sending a young man with a football toward that city. A young girl hides the ball,
    is bewitched by it, and gives birth to Hawawk, a clawed child identified by Toehahvs
    through old prophecy. Hawawk grows into a dangerous hunter and cave-dweller who
    eats children, until Ee-ee-toy instructs the people to hide in sealed houses while
    cracking pumpkin seeds, leading Hawawk to think the houses are empty except for
    rats.
  language: English
  quote_policy: summarized
