canonical_text:
  quote: ''
  summary: A speaker seeks power from beings above and in the north. The Feather Nested
    Doctor spreads news but the earth continues moving. The Yellow Spider makes a
    web, binds the earth, marks directional corners with colored fringes, Vahahkkee,
    and arrows, and the earth becomes still. The addressee is then carried like a
    child, set facing east, and the heart moves toward the east. The addressee's seed
    grows, ripens, is stored and ground with sunbeams, and is eaten by children and
    elders for happiness and long life.
  language: English
  quote_policy: summarized
