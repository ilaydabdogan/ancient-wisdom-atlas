canonical_text:
  quote: ''
  summary: After lying dead for a variant span of four months or four years, Ee-ee-toy
    begins to revive amid thunder and earthquake. He tests stones and sticks, chooses
    four arrow-weeds, restores dried springs as he walks, follows the Sun's road,
    receives objects from the Talking Tree, leaves the arrow-weeds under a patterned
    stone at the Sun's drinking place, and goes toward Juhwerta Mahkai and his people
    who sank through the earth before the flood.
  language: English
  quote_policy: summarized
