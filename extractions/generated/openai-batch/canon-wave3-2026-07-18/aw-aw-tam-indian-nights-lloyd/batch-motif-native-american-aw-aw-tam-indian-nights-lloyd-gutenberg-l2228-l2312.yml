canonical_text:
  quote: ''
  summary: The passage describes the woman lulling Vandaih to sleep, Ee-ee-toy killing
    Vandaih and the child, the cliff swaying after the death, Ee-ee-toy reviving dead
    bodies with heated water, assigning the oldest revived skeletons to the East as
    white people, and Ee-ee-toy's descent, purification, and return after the killing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The child calls out to Vandaih as father; Vandaih interprets this as a warning
    that someone has come, while the woman says the child is only learning to talk.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman searches Vandaih's head, sings to put him to sleep, and uses repeated
    whistling to test whether he is asleep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ee-ee-toy emerges from a dead body in which he had been hidden.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ee-ee-toy uses an obsidian knife to cut Vandaih's throat, behead him, and
    cast the head and body in opposite directions; he also beheads the child and casts
    its parts in opposite directions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After Vandaih is killed, the cliff sways as if it may fall; Ee-ee-toy drives
    sharpened stakes into it for himself and the woman to hold.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The woman heats water, and Ee-ee-toy sprinkles dead bodies; those sprinkled
    come to life and are sent home by his power.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The oldest bodies, described as skeletons, revive slowly and cannot remember
    their homes or origins.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ee-ee-toy gives the revived oldest skeletons slant-cut eagle feathers and
    dried blood mixed with water, assigns their home to the East, and identifies them
    as white people of the present day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ee-ee-toy and the woman descend the cliff using sharpened stakes and make
    successive camps with eagle feathers, staying four nights at each camp.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: On each fourth morning Ee-ee-toy takes a purification bath, compared in the
    passage to a Pima practice after killing Apaches; when he arrives home he remains
    outside among the bushes for a time.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The people know Ee-ee-toy has killed Vandaih because they watched and saw
    a cloud over the high mountain; afterward they have nothing to fear for a long
    time.
  category: sequence
  evidence_refs:
  - ev:10
