canonical_text:
  quote: Nooee rose in place of the Sun
  summary: Nooee takes the Sun's place, repeatedly shoots at the earth, and creates
    increasing heat. Ee-ee-toy attempts to escape by seeking formerly cool refuges,
    but the pond boils, the rock bursts, the tree catches fire, and he dies before
    reaching the cool hollow of a striped post made by his power. Nooee then descends
    to his setting, returns the weapon to the Sun, and goes home.
