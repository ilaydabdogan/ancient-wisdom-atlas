  summary: A powerful personage from the North, known as See-ur-huh or Ee-ee-toy,
    comes to Juhwerta Mahkai, Nooee, and Toehahvs. Although they claim prior presence
    and seniority, he insists on being called older brother, and they allow it. A
    song says Juhwerta Mahkai made the world round and calls others to see it and
    make it useful.
