canonical_text:
  quote: ''
  summary: 'The passage gives three short songs connected with a flood story: Juhwerta
    Mahkai speaks before the flood, a Superstition Mountains song speaks of destruction
    and being turned to stone, and Ee-ee-toy sings that he will move the water both
    ways after making world serpents. The notes discuss Pima marriage customs, birds
    associated with the story, witchcraft and mahkai transformations, Superstition
    Mountain as a site of petrified forms, bird song subduing flood waters, editorial
    comparisons to Genesis and the Norse Midgard Serpent, dolls, and Juhwerta Mahkai''s
    skin waste and perspiration as a malign force.'
