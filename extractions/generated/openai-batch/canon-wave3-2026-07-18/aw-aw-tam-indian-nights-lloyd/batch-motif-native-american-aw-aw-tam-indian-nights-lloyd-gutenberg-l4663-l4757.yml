canonical_text:
  quote: ''
  summary: Pahtahnkum and his people return from repeated war expeditions against
    Apaches with property, weapons, captives, hair, and other trophies. Pursuing Apaches
    repeatedly turn back because of thirst, unfamiliar desert country, or other circumstances,
    and several places receive names from events in the pursuit. Pahtahnkum completes
    purifications, leads further raids, avenges his father through retaliatory killings
    and mutilations, then becomes ill, seeks cool air in the mountains, and dies.
    His mother stores Apache hair in a sealed olla, places it in a cave, calls wind
    and cloud by her power, and says she can make wind or rain when needed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pahtahnkum's people take Apache property and children as captives, return
    by the same road, send a messenger ahead, and present property, weapons, and captives
    to Pahtahnkum's mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apache neighbors form a war-party and follow Pahtahnkum's trail, but stop
    at Taht-a-mumee-lay-kote because they do not know where to find water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After prescribed purifications, war-dances, and rejoicing, Pahtahnkum forms
    another war-party and goes to the other end of the Superstition Mountains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pahtahnkum's party sees Apache lights at night on a peak, goes up, kills the
    Apaches except for children, and takes the children captive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In an open desert place, Pahtahnkum and Toehahvs are placed in the center
    while circles are formed, with older ones nearer the middle, and trophies are
    brought to them and thrown up with rejoicing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pursuing Apaches abandon pursuit after looking over unknown desert and saying
    they do not want to die of thirst; the mountains are said to be called Aw-up Chert-taw
    because a place where fires were made was found.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After another purification, Pahtahnkum leads a war-party east to Oy-yee-duck,
    where Apaches have cultivated fields.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A brave Apache keeps his wife before him and his child behind him, making
    it hard for the Papagoes to attack him because they do not want to kill them;
    the woman and man are killed, and the little boy is taken captive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After another circle-forming rejoicing scene, pursuing Apaches turn back at
    a red bluff where they dig a well, and the place is called Taw-toe-sum Vah-vee-uh,
    or Apache's Well.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A later war-party kills a single Apache hunter, cuts him up, and mutilates
    him as Pahtahnkum's father had been mutilated; another single hunter is scalped,
    and the scalp is placed like a hat on a giant cactus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Pahtahnkum walks behind, sad and thinking of his father, then returns home
    having revenged his father; this is described as the last of his wars.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Apaches follow once more but stop near the Superstition Mountains at a wet
    place, begin to clear a field, then give it up and return without planting.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Pahtahnkum's mother makes a large olla and flat pottery cover, puts Apache
    hair inside, seals it with greasewood gum, finds a cave, and by her power calls
    a wind and a cloud around it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Pahtahnkum's mother says she will leave the olla in the cave so that when
    she needs wind or rain she can form them by throwing these up and be independent.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Pahtahnkum becomes ill, and the people say it is because he has not properly
    purified himself; he seeks cool air on mountains, gets no better, dies at the
    Maricopa Mountains, and his mother later dies at home.
  category: sequence
  evidence_refs:
  - ev:9
