  quote: ''
  summary: Editorial notes on the story of Ah-ahn-he-eat-toe-pahk Mahkai identify
    dreams, witchcraft, rabbit hunting, a wind-and-soul belief, gruesome humor, burial
    and mourning customs, Maricopa cremation, and communal disapproval as a sanction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that the story introduces belief in dreams, more witchcraft,
    and rabbit-hunting as a national sport.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A transaction between Seevalick and the boy is described as showing a belief
    in a connection between wind and the human soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The latter part of the tale is described as having humor that is strange,
    labored, sometimes gruesome, and often tragic.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The notes say the old man was buried, while no mention is made of burying
    the woman who was shot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Pimas of old time are described as burying their dead in a sitting posture,
    with neck and knees tied, four to six feet underground, and with logs and thorn-brush
    over the grave to keep wolves away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Interment is described as usually occurring at night with chants and without
    other ceremony.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Immediately after interment, the deceased person's house was burned, personal
    effects and food were destroyed, and horses and cattle were killed and eaten by
    mourners except for property given to heirs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the mourning period, the dead person's name was never mentioned again
    and everything about the person was treated as forgotten.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Maricopas are described as burning their dead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The notes say no one appears to have punished the slayer for murderous practical
    jokes, and that the Awawtam seldom punished crimes except by boycott or public
    disapproval.
  category: relationship
  evidence_refs:
  - ev:10
