canonical_text:
  quote: ''
  summary: A communal smoking custom is corrected by requiring kinship terms when
    passing the pipe. Tobacco seeds are preserved and spread. Corn and Pumpkin, after
    going east and leaving people without these foods, return through named places.
    Corn meets a woman and her younger brother while they roast cactus and causes
    the cooked food to be corn and pumpkin. Corn sends the boy to ask Tobacco's father
    whether Corn may return and marry Tobacco; the father consents. Corn requires
    a mat-covered kee, house sweeping, and upturned vessels. A black cloud appears
    and rains corn and pumpkins all night while Corn and Tobacco are in the kee. Tobacco
    later bears a crooked-necked pumpkin child, which children accidentally break;
    Corn leaves east, briefly returns for his blackbird pets, and later departs again
    with them.
  language: English
  quote_policy: summarized
