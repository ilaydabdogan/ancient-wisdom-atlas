canonical_text:
  quote: ''
  summary: A short song by Koelhahah addresses her son and says great things and far-spreading
    news will come because of him. The following notes describe beliefs about a man's
    smoking affecting his unborn child, killing an Apache and throwing up trophies
    or a scalp causing rain, details of Pima and Apache bows and arrows, Pima archery,
    and old and modern wells and water quality.
