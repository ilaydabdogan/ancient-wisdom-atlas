  summary: The passage describes physical features, tattooing, clothing, footwear,
    hair customs, adornment, and head-carrying practices among Pima people, with brief
    mentions of Maricopa hair arrangement and obsolete Pima baskets and cradles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author describes two general facial types among Pima people, one with
    relatively regular, square, heavily moulded features and another with features
    the author calls more characteristically Indian.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The author states that babies sometimes show a slight upward tilt to the eye
    and that adult heads are generally well balanced on the neck.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author judges women as a rule to carry themselves less gracefully and
    attributes a loose hip motion to carrying heavy loads on the head at an early
    age, while also noting exceptions with stately figures and fine carriage.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A slight facial tattooing is reported on almost all Pima faces outside the
    youngest generation; women have blue lines from the mouth and eyes, while men
    usually have a single zigzag blue line across the forehead.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The pigment used for the tattooing is charcoal.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Men are described as generally erect and of good figure, with good chests,
    heavy shoulders, often slightly bowed legs, well-shaped hands, and well-shaped
    feet.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The passage contrasts older clothing reported by Emory and companions with
    contemporary dress: men are said to dress like white workmen, women to wear a
    loose print gown, and both sexes are commonly barefoot.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Old Pima sandals, called gah-kai-gey-aht-kum-soosk or string-shoes, are described
    as formerly universal and still often seen, with projecting forms used as protection
    against thorns.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says both sexes show little marked personal adornment apart from
    tattooing, and that beadwork and embroidery seen among other tribes are absent.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hair was formerly worn very long and loose, with bangs arranged differently
    for women and men; the passage says government discouragement has led most men
    to cut hair short and women to part and braid it.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author says some Maricopas roll their hair in ringlets, and that some
    men braided hair into a cue or looped the ends with a fillet.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage reports that mud and mezquite gum were used on hair to cleanse
    it, make it glossy, and darken gray hair.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Women are described as carrying ollas and other burdens on their heads with
    strength and dexterity.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The old Pima burden basket, called gyih-haw, and the baby carrying-cradle,
    called wawl-kote, are described as obsolete or disappeared; the cradle was carried
    poised on the head.
  category: object
  evidence_refs:
  - ev:10
