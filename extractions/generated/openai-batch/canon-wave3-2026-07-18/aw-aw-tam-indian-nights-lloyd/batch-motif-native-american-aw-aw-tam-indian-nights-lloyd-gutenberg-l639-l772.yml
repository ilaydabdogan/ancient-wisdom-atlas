canonical_text:
  quote: ''
  summary: A framed Pima creation narrative describes oral transmission, a primordial
    creator in darkness, formation of the world from bodily substance, earth-enlarging
    ants, creation and partial non-cooperation of Nooee the Buzzard, making of sun,
    moon, and stars, repeated creation and destruction of human populations by a falling
    sky, shaping of valleys for water, and the birth of Coyote from the Moon after
    her meeting with the Sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Comalk Hawk-Kih says the stories were handed down from father to son and that
    he learned them from his father when older.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the beginning there is no earth, water, sun, or light; only the Doctor
    of the Earth floats in darkness.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Doctor of the Earth rubs substance from his breast and holds it on his
    palm; after tipping three times, it remains upright on the fourth attempt as the
    world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first bush is the greasewood bush; small ants are created for it, and
    later white ants work to enlarge the earth until it is large enough for the Doctor
    of the Earth to rest on.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nooee is made from the shadow of the creator's eyes to assist in creation,
    is given power, but does not do the intended work.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sun and moon are made from water placed in a hollow vessel, hardened,
    and tried in several directions before working in the East.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The stars are first made from water spurted into the sky; when they do not
    give enough light, pieces of a smashed Doctor-stone are thrown into the sky to
    mix with them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man and woman are made as two little dolls from substance rubbed from the
    creator's breast; their descendants multiply, initially without sickness or death,
    but later kill and eat one another when food is lacking.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The creator lets the sky fall to kill the people, breaks a hole with a staff,
    and escapes with Nooee; similar sky-fall destructions and recreations follow when
    later peoples become prematurely grey and then when infants want to smoke.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: On the present earth, Nooee is sent to fly among the mountains and cut valleys
    with his wings so water can be caught and distributed for people to drink.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The sun is male and the moon is female; they meet once a month, and the moon
    becomes a mother and gives birth at a named mountain.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The moon leaves her child in tramped-down weeds; because the child has no
    milk, it is nourished on the earth, grows, walks to the house of the Doctor of
    the Earth and Nooee, and is identified as Coyote.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
