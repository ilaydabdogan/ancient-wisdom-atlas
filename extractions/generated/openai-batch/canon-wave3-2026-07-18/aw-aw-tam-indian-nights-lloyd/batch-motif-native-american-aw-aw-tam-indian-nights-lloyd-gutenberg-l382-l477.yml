canonical_text:
  quote: ''
  summary: The passage is the collector’s commentary on Pima traditions. It argues
    that the stories are ancient and locally rooted; summarizes traditions about peoples
    created locally as children of Ee-ee-toy and Juhwerta Mahkai; proposes a local
    flood, survivor groups, later invasion, destruction of vahahkkees, and cultural
    assimilation; and discusses oral transmission, later interpolations, lost meanings,
    and published variants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentator describes the traditions as ancient and saturated with local
    color, with most places said to be visible from Cheoffskawmack except the Rio
    Colorado and the ocean.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stories are reported to say that the dwellers in the vahahkkees were children
    of Ee-ee-toy, created locally, and that the army carrying out Ee-ee-toy’s revenge
    were children of Juhwerta Mahkai, also originally created locally.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentator proposes that a flood was a real but local event and destroyed
    the greater part of the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One survivor group is described as escaping by flight into the desert or through
    a hole in the earth, while another escaped by floating on objects and climbing
    mountains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The group that remained in the Gila country is described as becoming settled,
    agricultural, irrigation-using pueblo builders.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The desert fugitives are described as returning as a fierce invading force,
    destroying the vahahkkees and those who lived there, breaking ma-ta-tes and utensils,
    and dividing the region among themselves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Apaches are described as already living in outlying deserts and mountains
    and as not especially affected by the invasion.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The commentator suggests that some conquerors retained desert-wandering habits,
    while others adopted agricultural habits and brush-and-mud houses, leading to
    the present Pimas.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The commentator suggests that conquering groups may have spared and married
    women and adopted children from the vahahkkee people, allowing agricultural methods
