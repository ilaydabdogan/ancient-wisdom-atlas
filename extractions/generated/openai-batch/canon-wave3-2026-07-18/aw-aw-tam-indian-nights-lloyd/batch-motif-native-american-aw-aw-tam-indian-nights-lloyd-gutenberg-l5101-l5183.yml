canonical_text:
  quote: ''
  summary: A war-song-like passage describes a first-person speaker lying in ashes
    and praying for strength, receiving aid from the Sun, Blue Fog, Yellow Crow, and
    Yellow Spider, and capturing the enemy. A second first-person passage at empty
    Apache houses invokes possible death, bones, and blood, then calls on a Butcher-bird
    of Light, which blinds the enemy and associated Apache powers, allowing capture
    and victorious return with captives, property, water, flowers, wasps, and a butterfly
    on the homeward road.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-person speaker lies in ashes and prays to distant mountains and far
    doctors for strength and power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun rises from the east, follows a western road, and is followed by four-footed
    animals and birds who call themselves relatives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun brings the See-hee-vit-tah Feather, identified as the Sunbeam, for
    the speaker to wear on the head and embraces the speaker.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sun brings Blue Fog; the fog takes the speaker toward the enemy but instead
    carries the speaker up into the sky to Yellow Crow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Yellow Crow, described as a powerful mahkai, descends to the enemy, divides
    their land four times, slays human beings, and paints rocks with their blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker asks Yellow Spider for help; Yellow Spider stretches his web four
    times, finds and binds the enemy, and pushes the speaker toward the enemy, after
    which the speaker captures the enemy and all his people or possessions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The speakers address their relatives and tell them to think of victory, while
    acknowledging that the sound of rejoicing over the enemy may be disliked and will
    last only briefly.
  category: speech
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:8
  text: A group goes toward the mountains where the Apaches live, camps near empty
    Apache houses, and one person speaks figuratively as a type of his people.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The second speaker imagines that the Apaches may have killed him, dragged
    him through waters, beaten him with sticks, thrown ashes over him, and left bones
    and dry blood.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The second speaker describes a Vahahkkee of Light in the East with a Butcher-bird
    of Light inside it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Butcher-bird of Light is asked for power, follows a Road of Light, touches
    the ground four times with his tail, and reaches the enemy by a road lighted by
    a mahkai.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Butcher-bird punches out the eyes of the enemy, and also those of the
    animals, birds, winds, and clouds of the Apaches, without them knowing it.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: The Butcher-bird leaves the enemy powerless, pushes the speaker toward him,
    and the speaker captures him easily.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The speaker gathers property and captives, sees a country springy with water,
    follows wasps, follows a road with many flowers and a butterfly, and brings the
    dead enemy home as news spreads.
  category: sequence
  evidence_refs:
  - ev:7
