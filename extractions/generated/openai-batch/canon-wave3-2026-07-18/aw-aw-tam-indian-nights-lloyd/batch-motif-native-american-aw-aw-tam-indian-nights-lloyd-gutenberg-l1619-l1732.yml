canonical_text:
  quote: ''
  summary: The passage tells of Ah-ahn-he-eat-toe-pahk Mahkai, an orphan boy living
    with his grandmother. After mischievous behavior and failed attempts to find his
    dream in local ceremony and medicine-song, he leaves home, passes through houses
    visited by bewitching animals, and encounters the whirlwind Seevalick in a barren
    place. The whirlwind carries him through the four directions, takes and returns
    his soul, and tells him he will be like it. He returns morally changed, seeks
    the company of wise old men, and later repeatedly makes bows and arrows as instructed
    by Seevalick while being mocked by hunters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ah-ahn-he-eat-toe-pahk Mahkai is introduced as an orphan living at Two Reservoirs
    north of Tall Gray Mountain, with an old grandmother as his only relative.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandmother carries water in earthen vessels and asks the boy to help
    her with the load; he wrestles roughly and breaks the vessels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When sent for vegetables named owl's-feathers, crow's-feet, and blackbird's-eyes,
    the boy first brings actual owl feathers, crow feet, and blackbird eyes before
    fetching the intended vegetables.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy has a dream he wants fulfilled, but is dissatisfied after attending
    a girl’s womanhood dance and hearing a medicine-man’s song.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After leaving home, the boy stays at two rough bush houses where fierce animals
    including cougars, bears, and eagles arrive and bewitch one another, but he is
    not bewitched.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In a barren place without trees or bushes, the whirlwind Seev-a-lick catches
    the boy up, carries him east, north, west, and south and back, and takes possession
    of his soul.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Seevalick tells the boy he shall be like the whirlwind; the boy says this
    is what he was seeking, and the wind returns his soul to his body so that he returns
    home.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: After returning, the boy is described as kind, liked by everyone, and preferring
    the company of wise old men, whom he listens to without making speeches.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: When the old people plan hunting, the boy makes a bow and arrows as Seevalick
    had told him and places them where he can find them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Hunters mock the boy’s large bow and arrows, handle them, and return them;
    he remains silent, leaves the weapons, and makes new ones. A similar episode repeats.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
