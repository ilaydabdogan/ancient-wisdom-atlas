canonical_text:
  quote: ''
  summary: A story begins with two brothers gambling against the Awup/Apaches. One
    brother loses his goods, then wagers and loses his brother and parts of his own
    body, including his heart. The Apaches kill the lost brother and let the other
    return home. The survivor grieves, fasts four days, sleeps, and sees his dead
    brother in a dream or vision. In a long speech he describes cosmic sadness, bodily
    materials used as implements, an attempted embrace of the dead brother, and journeys
    to a powerful woman and three doctors, each associated with transforming Apache
    weapons, hair, blood, and goods into game, dwelling, or natural forms. These figures
    give him news of Apache weakness or enmity, after which he strengthens himself
    and spreads the news at home.
  language: English
  quote_policy: summarized
