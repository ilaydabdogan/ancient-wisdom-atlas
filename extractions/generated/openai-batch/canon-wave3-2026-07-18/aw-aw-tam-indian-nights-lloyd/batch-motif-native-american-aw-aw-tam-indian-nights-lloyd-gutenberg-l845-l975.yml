canonical_text:
  quote: ''
  summary: 'In the opening of the flood story, Seeurhuh/Ee-ee-toy creates a beautiful
    young man, arms and adorns him, and directs him toward marriage. The young man''s
    repeated marriages and uncanny rapid childbearing lead Juhwerta Mahkai and Ee-ee-toy
    to foresee a world-covering flood. Ee-ee-toy prepares a sealed gum vessel; other
    beings state alternate survival plans involving a staff, a cane-tube, flight to
    the sky, or breaking through the sky. A doctor named Vahk-lohv Mahkai counsels
    his fearful daughter and gives her a cactus-thorn charm wound with her hair, instructing
    her how to receive the young man. After the young man comes, a conditional meal
    and the thorn charm bring about an exchange of sexed roles: he becomes a woman
    and mother, she becomes a young man, and a child is born by daybreak.'
  language: English
  quote_policy: summarized
