  summary: Editorial and ethnographic notes on the Story of Wayhohm. The passage says
    the story suggests Thor and Prometheus, interprets Wayhohm's house as a hall of
    clouds, contrasts the caution of the Coyote-person Toehahvs with the boldness
    of the road-runner, and describes a fire-making demonstration using a socket stick,
    twirling stick, corn husk, tinder powder, and combustible material blown into
    flame.
