canonical_text:
  quote: the dance that is called "Tramping Down the Sickness"
  summary: A doctor uses song to request gifts from two brothers, directs their hunting,
    makes medicine-bags from fawn skin and body parts, and the hunters regain abundant
    deer. During the army's march, a sick woman dies and is buried; later a pestilence
    spreads, and a doctor prescribes killing a doe and holding a healing dance, after
    which the sick recover.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The doctor sings requests for Haymohl's turquoise earrings and Sooadack Ceeavawt's
    beads; at first the brothers listen but do not understand the request.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After being told to hunt near the crowd of people, the brothers kill a fawn
    and bring meat home to their family.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the doctor repeats the song, the brothers understand; Haymohl gives his
    earrings and Sooadack Ceeavawt gives his necklace of beads.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The doctor tells the brothers they will find plenty of deer, then makes medicine-bags
    for them from fawn cheek skin made into soft buckskin, filled with scrapings and
    tips of the fawn's ears, tail, and nose.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The brothers wear the medicine-bags at their belts, kill multiple deer, and
    from then on the people again have plenty of venison.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The people march in village order; when a woman from one village becomes sick,
    her fellow villagers stay behind, care for her until she dies, bury her, and then
    rejoin the others.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A pestilence spreads through the villages and delays them; a doctor tells
    them to kill a doe and hold the dance called "Tramping Down the Sickness," after
    which the sick recover.
  category: sequence
  evidence_refs:
  - ev:7
