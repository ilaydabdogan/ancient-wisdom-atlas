  summary: The notes report Emory and Johnston variants in which a beautiful woman
    living in or near a mountain refuses suitors while receiving tribute, feeds people
    from an undiminishing corn store during drought, conceives after a drop of rain
    falls on her sleeping body, and bears a son associated with founding a race and
    building ancient houses. A seeneeyawkum version gives her twins but lacks the
    descendant or building story.
