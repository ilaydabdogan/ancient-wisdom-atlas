canonical_text:
  quote: ''
  summary: A first-person war speaker describes a self-smoking doctor's pipe whose
    smoke becomes colored flowers and produces apparent abundance in Apache land,
    drawing western and eastern enemies into a destructive illusion in which food
    becomes self-consumption and lice. The speaker captures an Apache enemy and returns
    with property, captives, and scalps, then sends victory news to relatives. A later
    war prophesier describes a flower-lined road made by doctors for enemy destruction,
    a Cane-Tube Pipe at the middle of the earth, smoke rising to luminous structures,
    four directional colored vahahkkees opened by canes to release colored water and
    wasps, and a Yellow Spider whose web binds the enemy and makes capture easy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stump of a doctor's pipe stands and smokes itself; the speaker smokes it
    toward the enemy, and the smoke changes into white, glittering, grey, and yellow
    flowers that reach and circle Apache land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The smoke softens the earth and brings fresh grass and leaves on trees, so
    that Apaches will be gathered together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A western enemy sends his son to verify reports of plenty with the son's uncle,
    and the uncle confirms that there is food and game.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The western enemy travels with a turquoise nose-ring, paint, locks of hair,
    and pouch; the eastern enemy later travels with an eagle-feather war-bonnet, moccasins,
    wind, clouds, rainbow, and crops.
  category: object
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: People who think they are eating deer or seed instead eat themselves or their
    own lice, and their skin, hair, eyes, and bodies become diseased or lousy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker finds an Apache enemy asleep, captures him without trouble, takes
    property, captives, and scalps, returns home, and spreads news of victory to relatives
    in several directions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A war prophesier foresees a flower-covered road and trees; the Apaches are
    said to smile at the white flowers, thinking them beneficial, though the flowers
    are made by the doctors for their destruction.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the middle of the earth, a Cane-Tube Pipe smokes itself; the prophesier
    inhales and blows smoke eastward, and the smoke rises to the Vahahkkee of Light
    and the Cane of Light.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: White, Blue, Black, and Yellow vahahkkees and canes are associated with directions;
    when opened, they release corresponding colored water and wasps, and the wasps
    fly around four times before returning or sinking down.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: A Yellow Spider on top of the vahahkkee helps the prophesier by stretching
    its web four times, finding the enemy, and binding the enemy's heart, arms, bow,
    and arrows.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the Yellow Spider binds the enemy, the prophesier is pushed toward the
    enemy and captures him, his property, and his children easily.
  category: sequence
  evidence_refs:
  - ev:9
