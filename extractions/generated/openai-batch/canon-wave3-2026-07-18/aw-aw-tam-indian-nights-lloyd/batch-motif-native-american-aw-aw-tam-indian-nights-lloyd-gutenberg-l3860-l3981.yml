candidate_motifs:
- id: motif:1
  label: Separated war parties magically linked by light
  taxonomy_refs: []
  basis: The army divides into four parties and doctors unite them by The Light so
    they can know about each other during battle.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain the nature of The Light beyond its coordination
    function.
- id: motif:2
  label: Inquiry after prophecy before invasion
  taxonomy_refs: []
  basis: A Casa Blanca doctor sends his son to ask another doctor whether prophecies
    exist about the invading army.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The consulted figure reports no knowledge, so the motif is one of inquiry
    and forewarning rather than a fulfilled explicit prophecy.
- id: motif:3
  label: Doomed fearless watcher
  taxonomy_refs: []
  basis: Stcheuadack Seeven says he feels good and fears nothing, and the Casa Blanca
    doctor predicts that Stcheuadack will be first to witness the event; his village
    is then destroyed.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not state that Stcheuadack's lack of fear causes the
    destruction.
- id: motif:4
  label: Refuge burned with inhabitants inside
  taxonomy_refs: []
  basis: People who do not flee enter Geeaduck Seeven's house; the enemy sets the
    house on fire and kills all inside.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a localized destruction by fire, not a world-destruction episode.
- id: motif:5
  label: Warriors sing of conquest and expected loot
  taxonomy_refs: []
  basis: As the army marches, it sings about conquered places, expected beads, and
    the cane-cactus-fenced place.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage gives song topics but not full song texts for these later
    marches.
- id: motif:6
  label: Magic boundary opens the earth against enemies
  taxonomy_refs: []
  basis: A magic line before Casa Blanca stops the enemy because the earth opens when
    they come to it; a doctor with the army closes it.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The exact mechanics of drawing or closing the line are not described.
- id: motif:7
  label: Underestimated small magic-worker succeeds after stronger specialists fail
  taxonomy_refs: []
  basis: Thunder Doctor and Earthquake Doctor fail to tear down the strong place,
    while a little man not expected to have much power succeeds by transforming hair
    into a snake.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not name the little man or explicitly label him as a
    doctor, though he is asked after other doctors.
- id: motif:8
  label: Hair transformed into serpent as destructive agent
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: The little man takes a hair from his head, sings, turns it into a snake,
    and sends it to strike and break the house.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The serpent reference is direct; the shapeshifter taxonomy is less exact
    because the transformed item is a hair, not a person or animal changing its own
    shape.
- id: motif:9
  label: Pursued fugitive concealed by atmospheric phenomena
  taxonomy_refs: []
  basis: The fleeing Tcheu-tchick-a-dah-tai Seeven sinks down and is hidden in sequence
    by fog, mirage, and rainbow, each removed by a matching enemy doctor.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage ends before the ultimate result of the pursuit is given.
