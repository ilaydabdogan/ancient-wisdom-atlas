canonical_text:
  quote: ''
  summary: The passage gives two brief songs, then narrates Ee-ee-toy's army entering
    the Gila country, dividing into four parties, and conquering successive vahahkkees.
    Doctors use powers involving light, opened earth, fire, transformed hair, a snake,
    fog, mirage, and rainbow. Several local chiefs or doctors are killed, while Tcheu-tchick-a-dah-tai
    Seeven escapes temporarily through repeated concealments that enemy doctors remove.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first song mentions coming to the White Earth, war-bonnets shaking in
    the wind, and people gathering to dance and sing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The doctor's song to the hunters requests a necklace from Haymohl and turquoise
    ear-rings from Sooadack Ceeavawt.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the people are no longer sick, they come to the Gila Country, Ee-ee-toy's
    land, and divide into four parties; doctors unite them by "The Light" so that
    the parties can know about each other in battle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The great doctor at Casa Blanca, Tcheu-tchick-a-dah-tai Seeven, sends his
    son to Stcheuadack Seeven at Casa Grande to ask about prophecies concerning the
    invading army.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The son first turns back because he is frightened by Stcheuadack Seeven's
    frog, which is described as a pet and an assistant in doctor work.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Stcheuadack Seeven says he knows nothing, enjoys the voices of animals and
    birds, feels good, and fears nothing; Tcheu-tchick-a-dah-tai Seeven predicts that
    Stcheuadack Seeven will be the first to see the event within ten days.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ee-ee-toy's army comes to Stcheuadack Seeven's village and kills all the people
    there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Geeaduck Seeven tells his people to flee; some run to the mountains and other
    places, while others enter his house, which the enemy sets on fire, killing those
    inside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ee-ee-toy's men march north to Cheof-hahvo Seeven's place, sing about conquered
    places and expected sah-vaht-kih beads, conquer the vahahkkee, and give the beads
    to an old woman who requested them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Dthas Seeven's home, which has a cane-cactus fence, Ee-ee-toy's men sing
    about the place, take it, and kill Dthas Seeven.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Casa Blanca, Tcheu-tchick-a-dah-tai Seeven draws a magic line before his
    place; when the enemy reaches it, the earth opens until one of their doctors closes
    it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Thunder Doctor and Earthquake Doctor fail to tear down the strong place; a
    little man not expected to have much power takes a hair from his head, sings,
    turns it into a snake, and the snake breaks the house from above.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: After Casa Blanca falls, all are killed except Tcheu-tchick-a-dah-tai Seeven,
    who escapes and is pursued.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:14
  text: During pursuit, Tcheu-tchick-a-dah-tai Seeven repeatedly sinks down and is
    concealed by fog, mirage, and rainbow; enemy doctors named for fog, mirage, and
    rainbow remove each concealment.
  category: sequence
  evidence_refs:
  - ev:11
