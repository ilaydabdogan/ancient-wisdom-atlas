candidate_motifs:
- id: motif:1
  label: Flood survival and recession
  taxonomy_refs:
  - flood_and_renewal
  basis: The passage describes a flood that drowns many people, selected survivors
    using refuges, birds singing the waters down, and figures emerging when land appears.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage segment does not give a full repopulation or moral-judgment
    frame; the motif is identified from the flood, survival, and recession sequence.
- id: motif:2
  label: Vessel preserving world contents
  taxonomy_refs:
  - ark_vessel
  basis: Ee-ee-toy prepares a large vessel containing seeds and everything in the
    world, seals himself inside it, floats through the flood, and exits after dry
    land appears.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:7
  confidence: high
  cautions: The text calls it a vessel or house, not an ark; other survivors use smaller
    objects rather than the same vessel.
- id: motif:3
  label: Transformation into birds
  taxonomy_refs:
  - shapeshifter
  basis: The young man-woman changes into a sand-snipe and the baby into a little
    teeter-snipe during the flood onset; the young man had also previously changed
    into a woman and mother.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The immediate cause and later fate of these transformed figures are not
    explained in this passage.
- id: motif:4
  label: Flood refuge inside small or unlikely objects
  taxonomy_refs:
  - ark_vessel
  basis: Juhwerta Mahkai floats inside a walking stick, Toehahvs in a tube of cane,
    and Ee-ee-toy in a heavy vessel.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: Only Ee-ee-toy's object is a conventional vessel; the walking stick and
    cane tube are unusual floating refuges and may need separate local classification.
- id: motif:5
  label: Failed mountain refuge and petrification
  taxonomy_refs:
  - flood_and_renewal
  basis: People flee to mountains as the flood rises; a mahkai marks water levels
    and raises the mountain, but finally strikes the Stone-of-Light and the people
    become stone.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The petrification element has no specific supplied taxonomy reference;
    it is linked here to the flood sequence rather than to a separate taxonomy family.
- id: motif:6
  label: Birds sing down the floodwaters
  taxonomy_refs:
  - flood_and_renewal
  basis: The little birds survive in the sky and are explicitly said to have power
    to make the water go down by singing.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage states the power of song but does not provide a broader ritual
    or cosmological explanation.
- id: motif:7
  label: Ascent to sky as flood refuge
  taxonomy_refs:
  - ascent
  basis: The named little birds fly up to the sky and hang on by their bills during
    the flood, and Quotaveech remains there in a feather nest.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: This is an animal ascent in a flood context, not necessarily a general
    human ascent or heavenly journey motif.
- id: motif:8
  label: Post-flood elder-status dispute
  taxonomy_refs: []
  basis: After the flood, Juhwerta Mahkai, Ee-ee-toy, and Toehahvs repeatedly call
    one another younger brother and dispute who came out first, with Ee-ee-toy ultimately
