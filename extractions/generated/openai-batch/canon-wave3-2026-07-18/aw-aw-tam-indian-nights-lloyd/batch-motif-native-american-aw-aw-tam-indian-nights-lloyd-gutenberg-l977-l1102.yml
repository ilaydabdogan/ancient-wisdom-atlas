canonical_text:
  quote: ''
  summary: Juhwerta Mahkai foretells a flood associated with the return of a transformed
    young man-woman and child. Ee-ee-toy prepares a sealed vessel containing seeds
    and worldly contents, while Juhwerta and Toehahvs survive in smaller objects.
    Floodwaters rise, many people drown or are turned to stone on a mountain, birds
    survive in the sky and sing the waters down, and the principal figures later emerge
    and dispute elder-brother status.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Juhwerta Mahkai tells his neighbors that a young man who had become a woman
    and mother will return with a baby born from himself, and that springs or water
    will gush from under trees and on mountains.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: By the young man-woman's return, Ee-ee-toy has finished a vessel and placed
    in it seeds and everything that is in the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man-woman leaves the baby in bushes, enters without it, and is recognized
    by Ee-ee-toy, who asks to see the baby or grandchild.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ee-ee-toy enters his vessel, builds a fire on its hearth, and seals the vessel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The baby is crying with tears spread over the ground; when the young man-woman
    stoops to pick up the child, the young man-woman becomes a sand-snipe and the
    baby becomes a little teeter-snipe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Water gushes from under every tree and on every mountain; people who come
    to Juhwerta Mahkai are let through a hole in the earth made with his staff, while
    the rest are drowned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Juhwerta Mahkai floats in his walking stick, Toehahvs floats in his tube of
    cane, and Ee-ee-toy's heavy vessel floats only after the flood becomes deeper.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: People outside Juhwerta Mahkai's refuge flee to mountains, where a powerful
    mahkai marks flood limits and uses power to raise the mountain, but the water
    rises beyond the marks four times.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The mountain mahkai strikes his doctor-stone, called Stone-of-Light, causing
    a thunderous sound; the frightened people are all turned into stone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Several named little birds fly up to the sky and hang on by their bills, while
    Nooee floats in the air.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The flood rises to the woodpecker's tail; other birds make a feather nest
    for the cold Quotaveech, and the little birds later sing so that the waters gradually
    recede.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: When land begins to appear, Juhwerta Mahkai and Toehahvs get out; Ee-ee-toy
    waits, warms and unseals his vessel, reseals it after seeing running water, and
    later exits when there is enough dry land.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Juhwerta Mahkai, Ee-ee-toy, and Toehahvs go in different directions, miss
    one another, see tracks, and repeatedly dispute who is elder or younger.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Quotaveech stays in the sky because of the comfortable nest and is called
    Vee-ick-koss-kum Mahkai, the Feather-Nest Doctor.
  category: attribute
  evidence_refs:
  - ev:9
