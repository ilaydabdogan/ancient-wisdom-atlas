canonical_text:
  quote: ''
  summary: Editorial notes on the Vandaih story describe Pima smoking implements,
    gambling games, moral and numerical details in the tale, cross-cultural analogies
    proposed by the editor, and a detailed account of purification practices after
    killing an Apache enemy, including smoke signaling, fasting, ritual caretaking
    by a 'father,' separation of the slayer and wife, pinole, and a ritual speech
    invoking ocean water and the Red Thunder Person/Lightning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that Pimas used tobacco and corn-husk cigarettes or short
    cane tubes stuffed with tobacco, and that ceremonial cane pipes had small birds'
    feathers tied to them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gain-skoot game is described as using four marked dice-sticks with assigned
    values, a flat round stone, a parallelogram of holes, counters, and a rule in
    which an overtaken player is 'killed' and must begin over.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The waw-pah-tee game is described as a guessing game involving a painted stick
    or a hidden ball in one of four decorated sand-filled cane tubes, with sticks
    used to count winnings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The notes say Ahahnheeattoepahk Mahkai gives Vandaih moral advice, loads the
    dice, takes the proceeds, and shifts blame onto Vandaih.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The notes say Vandaih drinks bewitching pinole five times, and also mention
    a woman whistling three times to put Vandaih to sleep.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The notes identify references to white men, pens, and ink as a modern interpolation.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: The notes explicitly say the story suggests Jack the Giant Killer, the Roc
    of the Arabian Nights, harpies, and part-human, part-animal frightful creatures
    familiar in ancient folklore.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The notes state that killing an Apache made the slayer unclean and required
    an elaborate purification, even though the killing was considered valiant and
    praiseworthy.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: After an Apache killing, the event could be signaled to watchers at home by
    smoke from a mountain; the notes connect this with Ee-ee-toy's cloud over a high
    mountain as a success signal.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The slayer fasts and seeks a 'father' who performs his usual duties and necessary
    ceremonial duties during the slayer's uncleanness.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: If no 'father' is present in the war-party, a messenger is sent home; the
    slayer's wife is also unclean, must purify herself separately, and needs a substitute
    for her usual work.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The fast is complete for two days; on the third morning the slayer may drink
    a single breath's amount of thin pinole.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: When presenting pinole, the 'father' recites a speech about the slayer's fame,
    a journey to the ocean and back, water, and See-vick-a Way-hohm, the Red Thunder
    Person, identified with Lightning.
  category: speech
  evidence_refs:
  - ev:13
