  text: Tcheunassat Seeven and his wives travel with food, camp on the road, cross
    the Gila River, and the wives wash while Tcheunassat bathes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tcheunassat Seeven's wives enter Stcheuadack Seeven's house without asking,
    join the dance, and take Stcheuadack's hand; Stcheuadack thinks he will get them
    away from Tcheunassat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After bathing, Tcheunassat Seeven makes a hair ornament from oapot wood and
    crow feathers, applies one white paint spot over each eye, and watches his wives
    dance with Stcheuadack.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tcheunassat Seeven takes out his rattle and sings; the crowd gathers around
