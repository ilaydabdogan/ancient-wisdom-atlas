- id: obs:8
  text: Stcheuadack Seeven covers himself with a beautiful cloak decorated with live
    butterflies and hummingbirds, then sends it to Tcheunassat as an offer in exchange
    for returning the beautiful wife and her daughter; Tcheunassat refuses.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tcheunassat Seeven appears as a beautiful person with long hair and turquoise
    earrings and says his earlier appearance at the dance was only to fool Stcheuadack.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The beautiful daughter of the beautiful wife grows up, Tcheunassat Seeven
    marries her, and she has a baby.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: After hearing of the marriage and baby, Stcheuadack Seeven says he will punish
    Tcheunassat, makes a black spider, and sends it through the air; the spider hides
    in the baby's cradle and bites the baby.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The parents find the black spider; Tcheunassat asks Stcheuadack to see the
    dying grandchild, but Stcheuadack refuses, calls Tcheunassat a powerful doctor,
    and tells him to use weeds from Maricopa Mountain; Tcheunassat says he does not
    know which weeds are right, does not go, and the child dies.
  category: sequence
  evidence_refs:
  - ev:12
