  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Stcheuadack Seeven repeatedly sends messages asking a beautiful wife and then
    all his wives to come home, but the woman does not come and he wanders outside
    until morning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Near morning, Tcheunassat Seeven sings a beautiful song and moves toward his
    own home, dancing, with all the women going before him; he takes both his own
    wives and Stcheuadack's wives home.
  category: action
  evidence_refs:
