canonical_text:
  quote: ''
  summary: Stcheuadack Seeven invites Tcheunassat Seeven to gamble and bring his wives.
    At Stcheuadack's dance, Tcheunassat's rattle and singing draw first his own wives
    and then Stcheuadack's wives to him, and he takes all the women home. Stcheuadack
    offers a cloak to recover a beautiful wife and her daughter, but Tcheunassat refuses
    and reveals that his earlier unattractive appearance was meant to fool him. Tcheunassat
    later marries the daughter and has a baby with her. Stcheuadack sends a black
    spider that bites the baby; after Tcheunassat does not obtain the named healing
    weeds, the child dies.
  language: English
  quote_policy: summarized
