candidate_motifs:
- id: motif:1
  label: Gambling challenge involving wives
  taxonomy_refs: []
  basis: Stcheuadack invites Tcheunassat to gamble and bring all his wives; Tcheunassat
    later says that if Stcheuadack had been the better singer and won his wives, he
    would not have asked for them back.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The stakes are made explicit retrospectively in Tcheunassat's refusal,
    not in the initial invitation alone.
- id: motif:2
  label: Dance-song contest reverses attempted wife-taking
  taxonomy_refs: []
  basis: Stcheuadack expects to get Tcheunassat's wives, but Tcheunassat's singing
    draws his own wives back and draws Stcheuadack's wives to him, after which he
    takes all the women home.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage frames the contest through dancing, singing, hand-taking,
    and gambling; it does not give formal rules beyond these events.
- id: motif:3
  label: Concealed beauty used to fool a rival
  taxonomy_refs:
  - trickster_boundary
  basis: Tcheunassat initially appears not very good-looking, then later appears beautiful
    with long hair and turquoise earrings and says his earlier look was only to fool
    Stcheuadack.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is broad; the passage shows deliberate deception
    of appearance but does not explicitly identify Tcheunassat as a trickster.
- id: motif:4
  label: Compensation object offered for return of wife and daughter
  taxonomy_refs: []
  basis: Stcheuadack sends a beautiful cloak as an offer for the return of the beautiful
    wife and her daughter, but Tcheunassat rejects the exchange.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not state a ritual or legal framework for the exchange.
- id: motif:5
  label: Punitive creature sent against a child
  taxonomy_refs: []
  basis: Stcheuadack says he will punish Tcheunassat, makes a black spider, sends
    it through the air, and the spider bites Tcheunassat's baby in the cradle.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage directly links the spider to punishment, but does not explain
    the mechanics of making or sending it beyond the brief narration.
- id: motif:6
  label: Named mountain medicine not obtained and child dies
  taxonomy_refs: []
  basis: Stcheuadack tells Tcheunassat to get weeds from Maricopa Mountain to cure
    the child; Tcheunassat says he does not know which weeds are right, does not go,
    and the child dies.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not identify the weeds or describe an attempted cure.
