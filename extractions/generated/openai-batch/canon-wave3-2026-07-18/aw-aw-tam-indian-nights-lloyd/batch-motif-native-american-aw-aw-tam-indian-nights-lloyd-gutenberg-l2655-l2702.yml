canonical_text:
  quote: ''
  summary: Seeollstchewadack Seeven interprets a bird's action and sends a cold rain
    over Dthas Seeven's home, extinguishing all city fires and leaving Dthas Seeven
    near death from cold. The people send Toehahvs to obtain fire from Wayhohm, Lightning,
    but Toehahvs returns without it. They then send Tottai, the Road Runner, who steals
    a burning stick from Wayhohm. Wayhohm shoots at Tottai with the Bow-of-the-Lightning,
    striking both sides of his head. Tottai whirls so that sparks fly into all kinds
    of wood, explaining why fire can be obtained from sticks by rubbing them together.
    Tottai reaches Dthas Seeven's house, the people make fire, and Dthas Seeven recovers.
  language: English
  quote_policy: summarized
