canonical_text:
  quote: ''
  summary: The passage tells how Hawawk is made sleepy with cigarettes, confined in
    her mountain cave with wood and fire, and burned; her soul escapes through a crack
    and becomes a green hawk. The hawk is later burned in a pot, after which the pot
    of greens kills people until Toehahvs and Gee-ah-duk Seeven destroy it. An old
    man and orphan grandson eat the greens and become bears, which are eventually
    killed by the people, ending Hawawk's evil power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ee-ee-toy makes cigarettes for Hawawk that contain something sleep-inducing;
    Hawawk inhales the smoke and becomes so sleepy that Ee-ee-toy carries her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While people dance across country toward Hawawk's cave, others carry wood
    ahead; Hawawk's sleeping body is placed in the cave and the entrance is closed
    with four hurdles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wood in the cave is set on fire; when the fire reaches Hawawk, she wakes
    and cries out to the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hawawk jumps in pain, strikes the cave ceiling, and splits the rock; Ee-ee-toy
    puts his foot over the crack, but her soul escapes through it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After a period of peace, Hawawk's soul turns into a green hawk that kills
    people but does not eat them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The green hawk dives at a woman making pottery, misses her, enters a hot pot
    in the fire, and is burned up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Greens boiled in that pot boil over, splash around, and kill people; they
    boil by day and stop at night for a long time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The people send for Toehahvs and Gee-ah-duk Seeven to kill the pot; Gee-ah-duk
    Seeven asks whether the pot sleeps and proposes attacking before it wakes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Toehahvs refuses to attack the pot in darkness and directs Gee-ah-duk Seeven
    to take the other side and smash the pot if it throws fluid at him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Toehahvs attacks with shield and club; the pot boils over and scalds his back,
    after which Gee-ah-duk Seeven smashes it from the other side.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: An old man and his orphan grandson eat the choohookyuh from the smashed pot
    and immediately become bears, one black and one brown.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The bears kill people and catch arrows; the people distract them with palm-tree
    balls and then shoot and kill them.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage concludes that the evil power of Hawawk ended forever after the
    bears were killed.
  category: sequence
  evidence_refs:
  - ev:13
