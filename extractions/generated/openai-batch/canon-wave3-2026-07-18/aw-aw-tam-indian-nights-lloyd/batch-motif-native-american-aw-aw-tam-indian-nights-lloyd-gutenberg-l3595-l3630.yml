canonical_text:
  quote: ''
  summary: Juwerta Mahkai lifts and tends Ee-ee-toy, using two kinds of smoke to refresh
    him. A fire-circle called the O-num of Light is built. Several birds are sent
    against the enemy to breathe over them or spread dust, causing fear, weakness,
    disorder, dried springs, and visible tracks that lead to the enemy's capture.
    The passage states that this sequence is prophecy.
  language: English
  quote_policy: summarized
