canonical_text:
  quote: ''
  summary: Vandaih wins repeated gambling games with charmed dice made by Ahahnheeattoepahk
    Mahkai and gives him the winnings. Ee-ee-toy arranges for a doctor's daughter
    to prepare feather-and-corn pinole and carry it to the reservoirs. Vandaih follows
    her, asks to marry her, drinks the pinole, and is transformed into an eagle. The
    people fail to pierce him with arrows. Vandaih takes a cliff as his home, hunts
    game and then humans, and the people send to Ee-ee-toy for help.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vandaih plays gambling games, wins repeatedly, stops after two wins, and gives
    his winnings to Ahahnheeattoepahk Mahkai.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahahnheeattoepahk Mahkai makes gainskoot, described as dice-sticks, for Vandaih;
    the dice are described as charmed and as a reason for Vandaih's success.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After local and distant gamblers lose to Vandaih, one man goes to Ee-ee-toy
    at Salt River Mountain for things to wager, and Ee-ee-toy comes to see the game.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ee-ee-toy observes that Vandaih's dice are unlike common dice and difficult
    to beat because they were made by a powerful man.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ee-ee-toy asks the daughter of a powerful doctor to go around big trees and
    gather feathers of large birds, not small birds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ee-ee-toy cleans the feathers, removes pith from the shafts, cuts the shafts
    into small pieces, and tells the girl to roast them in a broken pot over a fire;
    the roasted pieces curl up like grains of corn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The roasted feather-shaft pieces are mixed with roasted real corn, ground
    very fine as pinole, and carried by the girl in her syih-haw to the reservoirs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ee-ee-toy tells the girl beforehand that Vandaih will follow her to the reservoir
    and want to marry her; he tells her to be polite, give him pinole to drink, and
    ask him to see her parents first.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Vandaih follows the girl to the reservoir, asks her to be his wife, and receives
    her answer that he should drink pinole and later speak with her family.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vandaih drinks the pinole five times; he becomes feverish, then goose-flesh
    appears, then feathers appear, then long feathers grow on his arms, and finally
    he becomes an eagle on the bank of the reservoir.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The girl tells the waiting players and the people to come see what has happened
    to Vandaih.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The people surround Vandaih with bows and arrows and shoot him, but arrows
    that strike him do not pierce him, causing the people to fear him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Vandaih hops, flies higher, breaks trees on which he perches, causes rocks
    to tumble from a mountain, and finally settles on a strong cliff that sways before
    standing still.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The narrative states that, when the earth was being made, it was foretold
    that one of the race of men would be turned into an eagle.
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage describes Vandaih as handsome but of bad character and says parents
    had warned children to practice virtue lest they be turned into eagles.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Vandaih takes the cliff as his residence, hunts animals for food, and later
    kills human beings and carries their bodies to the cliff to eat.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The people send a messenger to Ee-ee-toy at Mohahdheck asking him to kill
    the man-eagle; after Ee-ee-toy delays and Vandaih continues killing people, they
    send another plea for help.
  category: sequence
  evidence_refs:
  - ev:10
