canonical_text:
  quote: ''
  summary: Corn speaks in a kee with Tobacco and recounts eastern and western animal
    doctors who grant power and produce corn and pumpkins. In another speech to Tobacco's
    father, addressed as Doctor, Corn describes a burning earth restored by feathers,
    clouds, thunder, water, and renewed planting. The passage then tells how the broken
    Dog-Pumpkin Baby becomes the Giant Cactus, whose fruit and seeds are gathered;
    Badger steals the seeds, and Toehahvs scatters them, explaining the scattered
    growth of giant cactus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Corn makes a speech while he is in the kee with Tobacco, and later makes another
    speech to Tobacco's father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eastern Tonedum Vahahkkee, called the Vahahkkee of Light, is said to be
    the home of Bives-chool, the kingfisher and great doctor; Corn asks him for power,
    and Bives-chool flies and breathes light in repeated sets of four.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Bluebird in the West is asked for power, breathes four times, flies toward
    the East, and meets Bives-chool at the middle of the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bluebird plants blue grains of corn from his breast, and the corn grows tall
    enough for its tops to touch the sky; Bives-chool plants white seeds from his
    breast, and pumpkins grow.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Beautiful boys and girls run among the plants and learn to shout or whistle;
    relatives hear of the plentiful food, come, do not eat it all, and return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Corn tells the Doctor that the earth he made is burning, mountains are crumbling,
    trees are burning down, people have forgotten how to shout and walk, and birds
    have forgotten how to fly and sing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Doctor holds long pinion feathers toward the East; long clouds arrive
    with low thunderings, spread over the earth, and water the plants and tree roots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The force of the waters straightens crooked low places and valleys, leaves
    driftwood and foam, and the Doctor plants corn and pumpkin seeds in low valleys.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'The pumpkin vine extends in four colored zigzag directions: black to the
    West, blue to the South, white to the East, and yellow to the North.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the renewed planting, people gather food; young boys and girls eat and
    are happy, and old men and women eat and lengthen their remaining days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Dog-Pumpkin Baby lies broken, then sinks down to Gahkotekih, grows up
    there, and becomes the Harsan or Giant Cactus.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The mother and grandfather cannot find the Dog-Pumpkin Baby; Toehahvs searches
    by smell and circles, sees the Giant Cactus but is not sure, and Nooee later examines
    the Giant Cactus and reports that he has found the baby full-grown.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: When the Giant Cactus has fruit, the people gather it, make tis-win, and spread
    the seeds in the sun.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Badger steals the cactus seeds; Toehahvs confronts him, asks him to open his
    hand, slaps the hand from below, and knocks the seeds around, explaining why giant
    cactus is now scattered.
  category: sequence
  evidence_refs:
  - ev:11
