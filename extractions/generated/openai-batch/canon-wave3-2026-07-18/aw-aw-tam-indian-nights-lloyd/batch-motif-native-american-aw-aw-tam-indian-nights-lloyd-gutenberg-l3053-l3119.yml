canonical_text:
  quote: ''
  summary: 'The passage is an editorial note on the Hawawk story. It describes Pima
    football and long-distance running customs, then identifies motifs in the story:
    miraculous conception through the agency of a football, resemblance to kidnapped-child
    or animal nursery tales and werewolf/loup-garou tales, a god or hero''s footstep
    printed in rock, and a hint of transmigration in the adventures of Hawawk''s soul.
    It ends with ethnographic notes on greens, pottery, horse-hair work, baskets,
    and beadwork.'
  language: English
  quote_policy: summarized
