- id: obs:3
  text: The woman has twin babies; male claimants gather for a crawling test, but
    the babies climb upon no man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the twin boys are older, their mother points to a cloud in the east and
