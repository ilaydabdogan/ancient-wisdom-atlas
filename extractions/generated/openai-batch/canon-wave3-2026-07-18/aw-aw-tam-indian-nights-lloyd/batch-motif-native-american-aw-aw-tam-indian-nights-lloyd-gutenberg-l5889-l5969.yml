  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Cloud feeds the boys but leaves them outside overnight in rain and snow, and
    they remain there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Cloud next leaves the boys overnight at an icy pond, and they remain in the
