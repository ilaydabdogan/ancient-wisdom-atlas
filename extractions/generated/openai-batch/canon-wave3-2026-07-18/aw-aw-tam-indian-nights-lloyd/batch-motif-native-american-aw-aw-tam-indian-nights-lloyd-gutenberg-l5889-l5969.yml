  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cloud acknowledges the boys as his children, lets them return to their mother,
    commands them not to speak to anyone on the way, and says he will be with them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A cloud travels over the boys in the sky, shadowing them during their journey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The younger boy wants to ask a passerby about their mother, while the older
