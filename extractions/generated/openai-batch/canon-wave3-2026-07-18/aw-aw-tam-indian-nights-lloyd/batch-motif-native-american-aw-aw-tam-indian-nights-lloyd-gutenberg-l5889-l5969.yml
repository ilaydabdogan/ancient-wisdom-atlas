canonical_text:
  quote: ''
  summary: An unmarried woman in the mountains conceives twin boys after rain touches
    her navel. Their mother identifies Cloud as their father and Wind as their uncle.
    The boys seek Cloud, prove kinship through thunder and lightning, endure weather
    and water ordeals, and are acknowledged. On a return journey to their mother,
    they disobey Cloud's command not to speak, after which the cloud above them thunders
    and lightens and they become century plants.
  language: English
  quote_policy: summarized
