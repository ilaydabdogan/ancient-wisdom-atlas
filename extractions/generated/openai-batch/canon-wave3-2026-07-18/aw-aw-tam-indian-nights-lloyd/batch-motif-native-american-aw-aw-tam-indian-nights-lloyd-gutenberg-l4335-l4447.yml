canonical_text:
  quote: ''
  summary: 'The passage first gives editorial notes on warfare, tools, and Veeipschool
    as a sad being above. It then begins the story of Pahtahnkum: after Kaw-koin-puh''s
    death, his wife bears a son and continues mourning. The boy wants to join hunters,
    receives a bow and arrows from his uncle, brings home an unsuitable bird given
    by a hunter, and learns from his mother that his father was killed by Apaches
    in their former homeland. At night he questions his uncle and then doctors about
    why the Apaches are dangerous; the elders repeatedly answer that the Apaches are
    human like themselves, but dangerous because of their bows and cane arrows.'
  language: English
  quote_policy: summarized
