  summary: People play together and kick one another in sport. The Apaches become
    angry, say they will leave for the mountains, live on what they can find, and
    remain happy through good dreams. Other people settle on the Gila and toward the
    Rio Colorado; builders of adobe-and-stone houses live in the Gila valley between
    the mountains.
