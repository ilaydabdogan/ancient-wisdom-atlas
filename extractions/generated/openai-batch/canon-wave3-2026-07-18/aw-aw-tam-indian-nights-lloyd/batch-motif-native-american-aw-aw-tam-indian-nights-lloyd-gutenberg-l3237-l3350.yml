canonical_text:
  quote: ''
  summary: The passage describes Ee-ee-toy as a powerful mountain-dwelling figure
    disliked for taking girls as wives and withering crops. The people and two boys
    repeatedly try to kill or destroy him, but he returns alive or unharmed. Nooee
    declares that ordinary men cannot kill Ee-ee-toy, demonstrates his own power by
    making a miniature world, flies upward toward the Sun to see signs concerning
    Ee-ee-toy's heart, and finally asks the Sun for help and receives the Sun's weapon
    after taking the Sun's place in the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ee-ee-toy is said to live in Salt River Mountain, called Moehahdheck or the
    Brown Mountain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ee-ee-toy comes to girls' ceremonial dances at womanhood and sings appropriate
    songs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ee-ee-toy tempts young girls away to his mountain to be his wives, keeps them
    awhile, and sends them back.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people dislike Ee-ee-toy and believe he withers crops by shooting hot
    arrows through the fields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people discuss how to kill Ee-ee-toy, and two boys overhear and decide
    to try killing him themselves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two boys find Ee-ee-toy asleep at Moehahdheck, beat him with clubs, and
    say they have killed him, but he appears among the people the next morning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: All the people kill sleeping Ee-ee-toy, burn his flesh on a wood pile, and
    return home, but he is alive again in the morning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people kill Ee-ee-toy again, cut his flesh into pieces, boil it in a pot,
    and throw it away in different directions, but he is alive again in the morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people tie Ee-ee-toy with ropes, push him off a high cliff, and he reaches
    the bottom unharmed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The people tie Ee-ee-toy's hands and feet and throw him into a whirlpool,
    but he comes up without ropes and continues diving.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nooee tells the people that they cannot kill Ee-ee-toy because Ee-ee-toy is
    too powerful for men and has power over winds, animals, mountains, and the sky.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nooee says that he has power something like Ee-ee-toy's and invites the people
    to his house so he can show part of his power.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Nooee makes a little world in his habitation, with earth, mountains, sun,
    moon, and stars working like those of the ordinary world.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Nooee pushes darkness back with his hands, spreads it on the walls, and shows
    the wonder to the people for four days and four nights.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Nooee flies through the roof openings and upward toward the Sun until he can
    see Ee-ee-toy's heart; a green-looking view means he cannot kill Ee-ee-toy that
    day.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: On a later flight Nooee wears a sparkling shell nose-ring, sees the ground
    looking dry from above, and concludes that he will someday kill Ee-ee-toy.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Nooee flies up to the Sun, says Ee-ee-toy is bad, asks for the Sun's help,
    asks to shine in the Sun's place, and asks for the Sun's gun.
  category: speech
  evidence_refs:
  - ev:13
  - ev:14
- id: obs:18
  text: The Sun agrees; Nooee takes the Sun's place, descends over the mountain, and
    receives the Sun's weapon at the Sun's home.
  category: sequence
  evidence_refs:
  - ev:14
  - ev:15
