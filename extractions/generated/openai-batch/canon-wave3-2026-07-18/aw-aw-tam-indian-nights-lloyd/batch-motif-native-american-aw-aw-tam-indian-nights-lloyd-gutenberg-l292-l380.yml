canonical_text:
  quote: ''
  summary: The narrator describes the mediation, editing, translation, memorized speeches,
    and songs involved in recording the tales. He reports that the tales were once
    regarded as scriptures, offers a theory that successive mahkais invented tales
    to answer questions of history and origins, describes desert ruins and Casa Grande,
    and summarizes a tradition in which the tribes now known as Pimas, Papagoes, Yumas,
    and Maricopas came from a mythic underworld, overthrew the vahahkkees, and killed
    their inhabitants.
  language: English
  quote_policy: summarized
