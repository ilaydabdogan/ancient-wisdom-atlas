canonical_text:
  quote: ''
  summary: A figure called Older Brother, opposed and killed by others, comes back
    to life. He prepares arrow-weed sticks using smoke, light, fogs, and snakes associated
    with directions, overcomes several figures, travels under the earth and along
    the Light's Road and Sun's path, receives equipment from a Talking Tree, drinks
    where the Sun drinks, leaves arrow-weeds beneath a square Doctor's stone, descends
    to the home of Juhwerta Mahkai, and is affected by winds while four directional
    gophers roll over in distress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Older Brother is described as having people who were against him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Older Brother made an earth, mountains, springs of water, trees, and other
    things that worked well.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He is shot, thrown face-down, lies dead, then comes to life and rises using
    the strength of his right arm.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: He selects arrow-weeds by a river described as a green snake, cuts them into
    four pieces, blows smoke over them, and sees sparks of light nearly reach the
    Opposite World, the World of the Enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: He brings fogs and snakes associated with the West, Ocean, East, and Above
    to stroke, bind, and finish the sticks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: He steps on the great doctors of the earth, the Speaker, the Slayer, and a
    rushing young maid who gathers fruit, sinking each down, then sinks down himself
    and walks under the earth's crust.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: He comes out, finds the Light's Road, and is refreshed or cooled by springs,
    mountains, and trees that he had made.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the cliff where he had killed the man-eagle, an unknown Someone asks why
    he comes like a ghost and says he had been told he would be against that speaker's
    people and the earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: He goes east to where the Sun arises, reaches the four notches used by the
    Sun, climbs the windy way of sunrise, and then travels westward on an adorned
    road.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: He reaches Nee-yaw-kee-tom Oas, the Talking Tree, kneels toward it, and is
    questioned by the Tree about coming like a ghost.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Talking Tree places bark in his head, gives him a middle-branch club and
    nut-gall canteen, and hands him four pieces from the ocean-side branch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the Middle Road, he can see a road on either side called the Road of the
    Enemy.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the place where the Sun drinks, he kneels and drinks, finds a square Doctor's
    stone in clear water, and leaves the arrow-weeds under it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: He goes to the Sunset Place, descends as the Sun goes down four times to the
    home of Juhwerta Mahkai, and is carried or tossed by strong winds before being
    set down again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Four directional colored gophers, called his pets, roll over because of their
    trouble about him.
  category: relationship
  evidence_refs:
  - ev:9
