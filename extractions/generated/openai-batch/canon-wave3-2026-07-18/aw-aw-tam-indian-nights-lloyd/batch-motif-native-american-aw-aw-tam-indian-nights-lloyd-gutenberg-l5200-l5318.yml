canonical_text:
  quote: ''
  summary: Ee-ee-toy finds moss and driftwood and wonders how to make them human;
    the sun breathes on them, producing a turtle and a masked man, Nahvahchoo. The
    turtle and Nahvahchoo travel west through colored roads, nights, birds, and threatening
    bows, then reach Twisted Neck Mountain. The turtle makes fire and crops; Nahvahchoo
    tries to steal fire, then makes his own. The turtle goes under the earth to the
    ocean, while Nahvahchoo comes up on the sea shore, gains strength from driftwood
    and flowers, and makes a home in the east. Later Nahvahchoo follows earth-shaking
    to masked singers and dancers, hunts a deer for them, and is invited by a speaker
    to become a singer and live on lasting cultivated foods rather than quickly consumed
    game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ee-ee-toy found moss left since the flood and wondered how he could make it
    into a human being.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sun breathed on the moss, and it became a turtle rather than a man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ee-ee-toy found driftwood and wondered how to make it human; the sun breathed
    on it, and it became a man whose face was covered as with a mask.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The turtle and the masked man traveled westward, entered a Blue Vahahkkee,
    and stayed there overnight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At sunrise they were frightened by blue beams shining through the vahahkkee
    and left.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: They passed through black, blue, white, and yellow roads and nights, with
    birds and threatening bows; the birds obstructed or struck them, and the bows
    kept them afraid to sleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the danger ended, they came to Twisted Neck Mountain, where Nahvahchoo
    ran ahead and left the turtle behind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The turtle stopped at night, made a fire, made corn and pumpkins, and cooked
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nahvahchoo heard the cooking, tried to steal a piece of the turtle's fire,
    was prevented, and then made his own fire, corn, and pumpkins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The turtle sank down under the earth to the ocean and made it his home; Nahvahchoo
    also sank down but came up on the sea shore.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Nahvahchoo went east along the sea shore, handled driftwood and flowers, got
    their strength, and made his home in the east.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When Nahvahchoo heard the earth shaking, he searched in different directions,
    put on his mask, took his bow, and went north.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Nahvahchoo found many people singing and dancing named dances that involved
    gourd masks, cloth masks, a bonnet, rods, and notched sticks.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Nahvahchoo tracked a deer, measured its tracks with his arrow, pursued it,
    killed it, and brought it back to the singers, who ate it all.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: A speaker recognized Nahvahchoo as a great doctor, hunter, farmer, and powerful
