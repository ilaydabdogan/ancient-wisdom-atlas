canonical_text:
  quote: ''
  summary: 'An ethnographic note describes a purification custom for slayers: during
    purification they wear a distinctive top-knot-like hairstyle with a kuess-kote
    scratching stick inserted, because they may not scratch with their fingers. The
    note connects the custom to another story, to a picture of a Maricopa interpreter,
    and to recollections identifying that interpreter as Francisco Lucas, also called
    How-app-ahl Tone-um-kum or Thirsty Hawk.'
