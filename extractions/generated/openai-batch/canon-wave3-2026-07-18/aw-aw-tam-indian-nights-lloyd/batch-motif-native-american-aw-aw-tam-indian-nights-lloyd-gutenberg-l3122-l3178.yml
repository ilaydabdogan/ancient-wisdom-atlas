canonical_text:
  quote: ''
  summary: After a period of peace and population growth, groups settle in several
    regions. One group uses a canal successfully for irrigation. People on the south
    side of the Salt River make a canal, but it fails because it runs uphill and lies
    in hard lime rock. Ee-ee-toy attempts to deepen it with ironwood stakes and a
    song but fails. He recommends the wise old woman Taw-quah-dahm-awks, who comes
    with fog, examines the canal, blows a bitter wind through the uphill section to
    tear out its bed, and the fog dams the river so water runs through the canal.
    The people discover the canal full of water and become prosperous.
  language: English
  quote_policy: summarized
