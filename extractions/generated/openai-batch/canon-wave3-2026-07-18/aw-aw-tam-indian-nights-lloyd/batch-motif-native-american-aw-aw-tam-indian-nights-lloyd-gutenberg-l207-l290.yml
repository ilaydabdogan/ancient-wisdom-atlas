canonical_text:
  quote: ''
  summary: The passage describes the narrator’s stay among Pima people in Arizona,
    a meal at Ed and Mrs. Wells’s place, the desert surroundings, an elderly woman
    and her blind husband, the narrator’s visit to the seeneeyawkum Thin Buckskin/William
    Higgins, and subsequent sessions in which the old man dictated traditions in Pima
    while Ed translated and the narrator wrote them down. It also describes Christianized
    resistance to recording the old tales and two night scenes of storytelling, including
    a cawseen interior, gestures, a flute, lantern light, moonlight, wind, and coyotes.
  language: English
  quote_policy: summarized
