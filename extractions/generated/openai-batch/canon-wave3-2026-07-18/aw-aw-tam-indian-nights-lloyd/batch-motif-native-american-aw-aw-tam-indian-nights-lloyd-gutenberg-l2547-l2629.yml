canonical_text:
  quote: ''
  summary: At the settlement of Morning Green Chief, a young woman sinks into the
    earth during a game, and the green spot becomes a green rock from which turquoise
    ornaments are made. An envious eastern chief, Sun-Chief, creates a red bird from
    his blood and sends it to swallow turquoise; after the bird returns, water makes
    it vomit up the stones, giving Sun-Chief turquoises too.
  language: English
  quote_policy: summarized
