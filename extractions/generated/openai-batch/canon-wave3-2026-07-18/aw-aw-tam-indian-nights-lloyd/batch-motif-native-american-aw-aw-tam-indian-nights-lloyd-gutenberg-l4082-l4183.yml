  confidence: high
  cautions: The passage does not explain the nature of the vahahkkee or the wider
    narrative context of the attack.
- id: motif:2
  label: Color-linked creature as clan or faction relative
  taxonomy_refs: []
  basis: The notes connect red, yellow, and white army-band identities with same-colored
    wayheemmahls, which faction members would not kill and treated as relations.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The editor describes the custom as probably obsolete and frames it as
    a Pima superstition; the passage is explanatory rather than a full mythic episode.
- id: motif:3
  label: Mysterious light as occult communication among bands
  taxonomy_refs: []
  basis: The notes say the bands were united by the Light, an occult and mysterious
    means of clairvoyantly knowing one another's needs.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The editor says informants could not clearly explain what the Light was.
- id: motif:4
  label: River crossing with closing waters
  taxonomy_refs: []
  basis: The notes associate the Bow Doctor's exploit with crossing the Rio Colorado
    and also mention closing waters leaving Yumas and Maricopas on the far bank.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage gives only editorial summary, and the editor explicitly cautions
    that the far-bank explanation may be fanciful.
