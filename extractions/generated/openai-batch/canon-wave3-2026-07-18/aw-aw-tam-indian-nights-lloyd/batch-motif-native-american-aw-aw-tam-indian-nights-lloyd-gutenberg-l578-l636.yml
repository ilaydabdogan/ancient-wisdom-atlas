literal_observations:
- id: obs:1
  text: The narrator says he left the Pima people with genuine regard for their virtues
    and describes them as kind, honest, simple-minded, industrious, clean despite
    scant water and dust, and exceptionally calm tempered.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a planned ride to the Casa Blanca ruins, a loosened saddle on Georgie
    turned under the pony's belly after watering at a well, and the colt bucked and
    kicked until exhausted in a field, leaving saddle fragments behind.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ed responded sadly, the stepfather went to retrieve saddle pieces, and the
    mother used a bowl-shaped Pima basket with beans to coax and catch the colt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The colt was patted, soothed, and fed sugar; the saddle was patched and replaced;
    the party rode eighteen miles without another mishap and without harsh or complaining
    words.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator reports encountering no beggars, theft, oaths, brutal acts, child
    striking or scolding, disrespect toward women, drunkenness, or cruelty to animals
    among the Pimas during his stay.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator states that the Pimas appeared to excel an average white neighborhood
    in good behavior.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Pimas' land is described as a desert with colored salt weeds, greasewood,
    cacti, thorn-bearing bushes, rich soil, and insufficient water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that white settlers above the Indians on the Gila have
    withdrawn water, making crop failures from insufficient irrigation common and
    leaving the once ever-flowing Gila often a dry channel.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The valley is surrounded by and dotted with low volcanic peaks; giant cactus
    stands on slopes of stone, and desert growths line mountain feet and rain-torrent
    channels.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ponies and a few cattle graze on the weed-and-thorn pasture, while summer
