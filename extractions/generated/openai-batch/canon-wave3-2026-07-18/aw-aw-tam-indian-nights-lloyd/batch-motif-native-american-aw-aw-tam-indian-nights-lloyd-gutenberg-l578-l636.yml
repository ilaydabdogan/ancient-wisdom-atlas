  summary: The narrator describes personal regard for the Pimas, recounts a calm response
    to a pony saddle accident during a ride toward the Casa Blanca ruins, reports
    observations of good conduct, and describes the desert valley, reduced Gila River
    water, volcanic peaks, thorny vegetation, heat, and dust storms.
  language: English
