canonical_text:
  quote: ''
  summary: Vandaih, called the Man-Eagle in the story title, repeatedly visits Ahahnheeattoepahk
    Mahkai seeking friendship and approaches him with cane smoking pipes. After initially
    refusing to speak to him, Ahahnheeattoepahk Mahkai accepts a shared smoke, rebukes
    Vandaih for gambling and other bad habits, and gives him rules for avoiding or
    limiting gambling. Vandaih begins following this counsel when challenged to gamble.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahahnheeattoepahk Mahkai is described as famous for killing game, and Vandaih
    wants to become his friend.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vandaih makes four cane tube-pipes used for ceremonious smoking and goes to
    see the young hunter.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the first visit, Ahahnheeattoepahk Mahkai lies down, looks at Vandaih,
    turns his face away, and does not speak, while Vandaih stays through the night
    and tries his pipe.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Vandaih comes on successive nights and sits all night, but Ahahnheeattoepahk
    Mahkai still does not speak to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife of Ahahnheeattoepahk Mahkai asks why he never speaks to Vandaih and
    says she feels sorry for Vandaih.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ahahnheeattoepahk Mahkai says Vandaih is not a good man and accuses him of
    gambling, lying, theft, licentiousness, and other bad conduct.
  category: speech
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: On a later night, Vandaih lights a pipe, buries it when Ahahnheeattoepahk
    Mahkai rises, then gives him another pipe; Vandaih recovers his own pipe, and
    both men smoke.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ahahnheeattoepahk Mahkai says he has seen Vandaih there for four nights and
    says he will be glad for him to come if Vandaih quits his bad habits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ahahnheeattoepahk Mahkai tells Vandaih that people call him a thief, hide
    precious things when he comes, and say he is greedy when hunters bring in game.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ahahnheeattoepahk Mahkai tells Vandaih to go home, keep quiet about the conversation,
    rest, and return the next night.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the next visit, Ahahnheeattoepahk Mahkai gives Vandaih detailed instructions
    for refusing gambling, consulting him if pressured, limiting play after wins,
    and quitting forever if beaten first.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: When men ask Vandaih to gamble, he first refuses by saying he has nothing
    to wager; when another man persists, Vandaih consults Ahahnheeattoepahk Mahkai
    as instructed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ahahnheeattoepahk Mahkai tells Vandaih to gamble, gives him things to wager,
    and repeats that Vandaih should stop gambling if he is beaten.
  category: action
  evidence_refs:
  - ev:8
