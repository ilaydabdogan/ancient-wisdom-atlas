canonical_text:
  quote: ''
  summary: Ee-ee-toy's army continues a conquest campaign. A Coadjook Doctor removes
    a heat-shimmer obstruction so a fugitive can be killed. A rattlesnake, aided by
    a doctor and a gopher tunnel, kills a village speaker-doctor. Ee-ee-toy kills
    a doctor-chief at Shell Field as his first foe, then orders Nooee captured; Eagle
    and Chicken-Hawk find Nooee in the sky, and Ee-ee-toy scalps him alive, after
    which Nooee dies and begins to revive. The army fights left-handed archer brothers
    at Tall Red Mountain and is aided by a southern band identified as ancestors of
    the Papagoes and as expert bow-makers. The army conquers another seeven, one chief
    remains near Phoenix, and Bow Doctor divides the Colorado River for crossings.
    The army fails to conquer the hole-dwelling Foxes. On the return, some bands are
    left behind when the waters close and are identified as ancestors of the Yumas
    and Maricopas. A short song before a fight follows.
  language: English
  quote_policy: summarized
