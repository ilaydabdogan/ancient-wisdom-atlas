canonical_text:
  quote: ''
  summary: The passage first gives notes on Nahvahchoo, including recent Pima dancing
    games with masks, gourds, and notched sticks, a caution about interpreting a reference
    to the earth's movement, and a brief comparison of an everlasting corn device
    to an everlasting salt mill tale. It then tells how the daughter of a mahkai becomes
    associated with Tobacco after burial and return from the grave; how Tobacco quarrels
    with Corn, leaves westward, and resides on a high mountain; how drought follows;
    and how the doctor Geeheesop obtains tobacco seed, tobacco-worm dirt, and ritual
    instructions from Tobacco, uses smoking to bring rain, cultivates tobacco, and
    introduces pipe-smoking among the gathered people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes say that the story of Nahvahchoo had recently been celebrated among
    the Pimas by dancing games with masks, gourds, notched sticks, and one participant
    impersonating Nahvahchoo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes state that a reference to the earth's moving might look like astronomical
    knowledge but is likely a poetic figure.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes compare the 'everlasting corn will' to a folk-lore tale of an everlasting
    salt mill that makes the ocean salt by continuous grinding.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A powerful mahkai has an unmarried daughter who asks her father to bury her
    to see whether men will care for her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A tobacco plant grows from the daughter's grave; her father smokes it, and
    gathered people smell it and wonder what it is.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Although the tobacco continues to grow, the woman comes to life again, leaves
    her grave, and returns home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tobacco plays gainskoot with Corn; Corn wins, Tobacco does not fully pay the
    debt, and the two quarrel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tobacco says doctors use her to make rain and moisten the ground; Corn says
    old and young people eat and like him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tobacco becomes sad, travels westward, brings a strong wind at night, sinks
    down when leaving, and the wind removes her tracks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tobacco comes to the Mohaves and lives on a high mountain called Cheof Toe-ahk,
    or tall mountain, with a cliff hard to climb.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: After Tobacco leaves, no rain comes at corn-planting time, no corn is planted,
    and people say Tobacco must have had power because there had been rain when she
    was present.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The people scold Corn, tell him to leave, and send for Tobacco so they may
    have rain again.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Corn goes east with Pumpkin, both singing that they are going where there
    is plenty of moisture.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The doctor Geeheesop takes the Doctor's Stone of Light, the Doctor's Square
    Stone, soft feathers, and eagle-tail feathers to Tobacco and asks her to return
    because people, seeds, and trees need water.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Tobacco refuses to return but gives Geeheesop four balls of tobacco seed and
    instructions involving tobacco-worm dirt, a cane tube, smoke, planting, leaves,
    winds, clouds, and rain.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:16
  text: Geeheesop follows Tobacco's instructions; smoking the tobacco-worm dirt brings
    rain, seeds planted in a secret place sprout in four days, and later smoking tobacco
    leaves brings wind and rain that revive the plants.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: When the tobacco ripens, Geeheesop stores leaves in a gourd-like woodpecker
    nest from a giant cactus, smokes some in a cane-tube pipe, passes the pipe to
    the gathered people, and finally sticks it in the ground.
  category: action
  evidence_refs:
  - ev:14
  - ev:15
