candidate_motifs:
- id: motif:1
  label: masked ritual impersonation of a mythic figure
  taxonomy_refs: []
  basis: The notes describe dancing games in which players wear masks and one participant
    impersonates Nahvahchoo.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives only a note on performance practice, not the full ritual
    context.
- id: motif:2
  label: plant origin from a buried woman who returns alive
  taxonomy_refs:
  - death_rebirth
  - dying_and_returning
  basis: The daughter asks to be buried, tobacco grows from her grave, and she later
    comes to life and returns home while the tobacco still grows.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not explicitly say she dies before burial; it states
    burial, plant growth from the grave, and return to life.
- id: motif:3
  label: personified crops quarrel over their value to humans
  taxonomy_refs: []
  basis: 'Tobacco and Corn gamble, quarrel, and each claims a different kind of value:
    Tobacco for doctors and rain, Corn as food liked by all ages.'
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif label is descriptive; no specific external taxonomy reference
    is asserted.
- id: motif:4
  label: departure of a rain-associated being causes drought
  taxonomy_refs:
  - departure
  - seasonal_cycle
  basis: After Tobacco leaves, the passage says no rain comes during corn-planting
    time, no corn is planted, and the people seek Tobacco's return for rain.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The seasonal-cycle taxonomy is plausible because planting time and drought
    are central, but the passage frames the problem primarily as Tobacco's absence.
- id: motif:5
  label: ritual acquisition of tobacco seed and rain-making instructions
  taxonomy_refs:
  - sacred_exchange
  - wisdom
  basis: Tobacco gives Geeheesop seed balls, tobacco-worm dirt, and detailed instructions
    for smoking, planting, calling winds, and obtaining rain.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The exchange is a transfer of objects and instructions; the passage does
    not describe payment or reciprocal obligation.
- id: motif:6
  label: smoke brings rain and revives plants
  taxonomy_refs: []
  basis: Geeheesop smokes the tobacco-worm dirt and rain comes; later he smokes tobacco
    leaves, wind and rain come, and the plants revive and ripen.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage presents this as narrative causation; no broader comparative
    claim is made here.
- id: motif:7
  label: introduction of communal tobacco smoking
  taxonomy_refs:
  - culture_hero
  basis: Geeheesop cultivates tobacco, prepares leaves in a cane-tube pipe, smokes
    before the gathered people, passes the pipe around, and all smoke it.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: medium
  cautions: Geeheesop functions as a transmitter of tobacco use in this passage, but
    the text does not explicitly call him a culture hero.
- id: motif:8
  label: fourfold tobacco seed and four-day emergence
  taxonomy_refs: []
  basis: Tobacco gives four balls of tobacco seed and says the planted seed will come
    up in four days; Geeheesop plants the seeds and they come up in four days.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage does not explain the meaning of the number four.
