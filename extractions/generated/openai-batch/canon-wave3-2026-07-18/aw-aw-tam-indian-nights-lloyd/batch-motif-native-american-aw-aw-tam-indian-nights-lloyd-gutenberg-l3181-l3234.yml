  summary: Editorial notes identify a sharpened stake as an early digging utensil;
    describe pre-agricultural subsistence on game, wild desert foods, mesquite beans,
    cactus fruits, fermented cactus drink, and edible larva; note recurrent hunger
    and hopes of plenty in the legends; explain the name of Ursa Major as The Cactus-Puller;
    and comment that Ee-ee-toy may be regarded as a god but can be surpassed by an
    old woman, while a mahkai might be or do almost anything.
