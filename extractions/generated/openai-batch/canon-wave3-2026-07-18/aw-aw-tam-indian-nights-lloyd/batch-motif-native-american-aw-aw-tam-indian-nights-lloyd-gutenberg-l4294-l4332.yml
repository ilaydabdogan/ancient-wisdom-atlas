canonical_text:
  quote: ''
  summary: Gawksiss Seevalick calls the people together to ask about his missing son
    Kawkoinpuh. As a doctor, he knows the boy has been killed because of Vee-ips-chool,
    a being above associated with sadness after bad events. The people track Kawkoinpuh,
    find Apache tracks, dead Apaches, and then his mutilated body. They gather and
    burn his body parts. Gawksiss Seevalick sings in grief, later buries remaining
    blood with his daughter, urges the people to return to their first selected place,
    and the group travels for four nights, with doctors singing on the second, third,
    and fourth nights.
  language: English
  quote_policy: summarized
