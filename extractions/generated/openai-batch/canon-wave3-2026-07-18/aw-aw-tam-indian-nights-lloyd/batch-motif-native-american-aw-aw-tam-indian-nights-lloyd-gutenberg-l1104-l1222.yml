canonical_text:
  quote: ''
  summary: The passage describes locating the world’s center by sending a hummingbird
    and woodpecker in opposite directions, drying land with ants, moving waters with
    two snakes made from Ee-ee-toy’s hair, making clay dolls that become or fail to
    become peoples and animals, Juhwerta Mahkai’s sinking and pulling down of the
    sky, the origin of sickness and death from impurity, and the first speech of different
    peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Veepismahl the hummingbird and Hickovick the woodpecker are sent in opposite
    directions toward the edges of the world and return so their meeting place can
    help locate the earth’s middle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After repeated attempts, the group identifies the meeting place as Hick, the
    Navel of the World.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because there is no dry place to sit, Ee-ee-toy takes the smallest ants from
    his bosom and throws them on the ground; they make little hills and dry earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ee-ee-toy makes two snakes from hairs taken from his head and uses them to
    push remaining waters south and north.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two snakes lie with opposed head-and-tail orientations, and their tails
    are said to start morning and evening winds connected with waking, dreams, fires,
    and comfort.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Ee-ee-toy, Toehahvs, and Juhwerta Mahkai agree to make dolls without showing
    them until finished, sit facing different directions, and form dolls from damp
    clay.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Juhwerta Mahkai makes poor dolls because he remembers that some of his people
    escaped the flood through a hole in the earth and he intends to visit them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ee-ee-toy questions defects in Juhwerta Mahkai’s dolls and Toehahvs’s webbed
    dolls, while the makers answer with practical explanations.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ee-ee-toy says his own dolls are best, throws Toehahvs’s dolls into the water
    where they become ducks and beavers, and throws away Juhwerta Mahkai’s dolls so
    that they break to pieces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Juhwerta Mahkai becomes angry, sinks into the ground, hooks his stick into
    the sky and pulls it down, while Ee-ee-toy holds up the sky over his dolls and
    tries to stop him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Juhwerta Mahkai leaves waste from his skin in Ee-ee-toy’s hands, which the
    passage identifies as the origin of sickness and death; Ee-ee-toy’s hand-swinging
    and later washing spread further disease and dampness-related illnesses.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Ee-ee-toy and Toehahvs build a house for the dolls; Toehahvs listens for speech;
    the Aw-up, identified as Apaches, speak first, and the Aw-aw-tam speak last.
  category: sequence
  evidence_refs:
  - ev:10
