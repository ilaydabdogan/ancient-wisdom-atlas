canonical_text:
  quote: ''
  summary: 'A speaker describes bringing water in a dish after powerful beings affect
    it: the Eagle of Light, Chicken Hawk, and Coyote each enter or stand in the dish,
    exert force, and alter the water''s smell. The passage then gives notes on a slayer''s
    purification after killing an Apache: a ritual father gives small amounts of food,
    repeated fourth-day baths are taken, a buckskin bag is made with the dead Apache''s
    hair and feathers, the bag is treated like a child containing the dead Apache''s
    ghost, and a war dance is held with weapons, representative dancers, old veteran
    singers, fire, food, gifts, and a final river bath and seclusion.'
  language: English
  quote_policy: summarized
