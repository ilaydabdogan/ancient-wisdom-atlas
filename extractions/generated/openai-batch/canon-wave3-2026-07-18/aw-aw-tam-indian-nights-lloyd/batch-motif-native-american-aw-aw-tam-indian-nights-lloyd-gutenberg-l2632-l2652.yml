  quote: Turquoises seem to have been regarded by all Arizona Indians as magical and
    lucky stones, and the Story of the Turquoises professes to give their origin.
  summary: The notes state that turquoises were regarded as magical and lucky stones
    and that the story explains their origin. The notes also describe the women's
    game toe-coll, in which groups of women used willow sticks to toss paired balls
    and played until one side was exhausted; skilled women practiced beforehand, and
    the balls could also be made from knots in a short rope.
