canonical_text:
  quote: ''
  summary: The passage describes Ee-ee-toy's delayed response to the people's appeal
    against Vandaih, his cryptic requests for obsidian and four stiff sticks, his
    omen instructions, his concealed journey to Vandaih's cliff home, his ascent using
    the sticks, his meeting with a captive woman, and his attempt to hide from the
    returning man-eagle by transforming into a fly and concealing himself among bodies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ee-ee-toy repeatedly tells messengers he will come in four days, but the narration
    explains that this means four years, during which the people wait.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ee-ee-toy and Vandaih are described as relatives, and this is given as a reason
    Ee-ee-toy delays harming Vandaih.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ee-ee-toy asks the people for the object he calls the seed-roaster; after
    several wrong guesses he explains that he means obsidian, a black volcanic glass
    used for arrowheads.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ee-ee-toy asks for four springy sticks, but finally explains that he wants
    vahs-iff sticks, which are described as very strong and stiff rather than springy.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ee-ee-toy sharpens the four sticks to points.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Before leaving, Ee-ee-toy tells the people to watch the highest mountain:
    a big cloud will mean he has done something wonderful, while four days of fog
    over the world will mean he has been killed.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ee-ee-toy raises or permits a desert dust storm and travels within it so the
    man-eagle will not see him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ee-ee-toy reaches the foot of Vandaih's cliff after dark and hides under a
    rock.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: At daybreak Vandaih flies around the cliff four times and then leaves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ee-ee-toy climbs the cliff by placing one pointed stick after another into
    cracks, pulling them out from below and placing them above.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the top of the cliff, Ee-ee-toy finds a woman who had previously given
    Vandaih pinole with eagle feathers; Vandaih had found her, carried her up, and
    made her his wife.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The woman has a little boy who is just beginning to talk.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The woman tells Ee-ee-toy that Vandaih searches around carefully when he returns,
    eats, then lays his head in her lap so she can look for lice, and then sleeps.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ee-ee-toy turns into a big fly and repeatedly tests hiding places with the
    woman, who can see him until he hides inside the lungs of an old dead body covered
    by other bodies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Ee-ee-toy instructs the woman to whistle when Vandaih is surely asleep.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: At noon Vandaih returns carrying two still-living, moaning bodies and drops
    them over the place where Ee-ee-toy is hidden.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Vandaih smells what he calls an uncooked person, searches through the pile
    of bodies, but does not examine the oldest body at the bottom.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: After eating, Vandaih asks the woman to look for lice in his head; when he
    sees a fly pass before him, he jumps up to catch it, but the fly enters a rock
    crack beyond his reach.
  category: sequence
  evidence_refs:
  - ev:12
