canonical_text:
  quote: '"he is some kind of a powerful personage (mahkai)"'
  summary: 'A meeting-house owner warns hunters not to handle Ahahnheeattoepahk Mahkai''s
    bow and arrows. The young hunter then kills jack-rabbits and gives them away,
    especially to old men. During later deer hunts, he follows figurative or ambiguous
    commands literally: he tries to close a valley with rocks, hangs from a tree by
    his hands, kills a pregnant woman when told to kill a term also used for a pregnant
    doe, and kills an old man when told to kill a term meaning old deer. After the
    group is told to speak plainly, he is directly instructed to kill deer and produces
    many dead deer.'
  language: English
  quote_policy: quoted
