canonical_text:
  quote: ''
  summary: Editorial notes on a Pima creation story describe the earth being made
    from the Creator's bodily residue, the greasewood bush as first vegetation, repeated
    fourfold creation patterns, supernatural animal representatives as aides, creation
    of sun and moon in relation to the four directions, a solid sky, a westward-sloping
    world, Nooee shaping valleys, the moon mothering the coyote, and the difficult
    status of Eeeetoy in relation to Juhwertamahkai.
  language: English
  quote_policy: summarized
