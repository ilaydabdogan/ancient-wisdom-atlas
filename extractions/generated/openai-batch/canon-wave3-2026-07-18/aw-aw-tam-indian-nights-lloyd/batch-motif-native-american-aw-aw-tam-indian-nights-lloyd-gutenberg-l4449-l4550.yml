canonical_text:
  quote: ''
  summary: A boy, later named Pahtahnkum, seeks knowledge about Apache danger, war
    preparation, and purification. His uncle, a doctor, performs sunrise and pipe
    rites for him, places Apache hair into his body, ties cat-claw wood in his hair
    as a kuess-kote-like stick, and instructs him in a communal smoking rite. Pahtahnkum
    then speaks of his childhood grievance, his mother's account of his father's death,
    his desire for revenge, and his imagined journey into Apache land and to the mountain
    where his father fought.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy asks another doctor why the Apaches are dangerous, then asks his uncle
    about war preparation and purification afterward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The uncle tells the boy to return the next day, then takes him outside before
    sunrise so they can speak away from other people.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The uncle and boy stand facing east while waiting for sunrise, with the boy
    on the uncle's right.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The uncle catches sunbeams in his hands several times; on the second attempt
    with his right hand, a lock of Apache hair appears in his hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The uncle puts the lock of Apache hair into the boy's breast and rubs it until
    it disappears into the boy's body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The uncle gets a piece of oapot or cat-claw wood, ties cloth around the boy's
