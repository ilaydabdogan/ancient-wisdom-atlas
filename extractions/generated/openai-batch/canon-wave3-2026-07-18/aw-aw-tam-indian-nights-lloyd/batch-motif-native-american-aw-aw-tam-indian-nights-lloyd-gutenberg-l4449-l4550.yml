  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The uncle says cat-claw catches everyone who comes near and that he wants
    the boy to have power to capture enemies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The uncle tells the boy to stay home lying still during the day and return
    at night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At night the uncle has four cane pipes ready and instructs the boy to light
    one from a coal, smoke four whiffs, slide it toward him, and later bury the lighted
    end in the ground when it returns.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A gathering of people assembles at the doctor's house in the evening, as customary,
    and discusses the day's news and hunting.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The uncle rolls a coal from the fire toward Pahtahnkum, who lights a pipe,
    smokes it four times, and slides it slowly along the ground to his uncle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that the pipe must be slid slowly so the enemy will be
