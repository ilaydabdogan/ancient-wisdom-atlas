- id: obs:3
  text: At a great rock, the speaker sits while his tears wet it and winds of sadness
    blow around it four times.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A gray cousin called Coyote is selected as helper and comrade, sees where
    the Apaches are, and helps the speaker's band capture unready Apaches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After killing Apaches, the speaker takes their property, says he gains their
    strength and power, and returns home with captured things.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the doctor's home, a captured child sheds blue tears that fall onto the
