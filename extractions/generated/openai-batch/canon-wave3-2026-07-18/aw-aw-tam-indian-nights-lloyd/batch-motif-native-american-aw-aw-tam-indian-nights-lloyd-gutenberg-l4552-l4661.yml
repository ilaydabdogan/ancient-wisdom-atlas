canonical_text:
  quote: ''
  summary: A child speaker recounts grief images involving water, hair, and a skull,
    recalls the killing of his father by Apaches, invokes Coyote as a helper in war,
    and urges renewed fighting. The people prepare for war under Pahtahnkum's direction.
    Pahtahnkum and Toehahvs scout an Apache village; Pahtahnkum transforms into a
    crow to hide their human tracks. The war party surprises the village, kills and
    scalps the inhabitants, and heaps spoils around Pahtahnkum, who throws them upward
    to make a cloud because the killing of an Apache is said to bring rain. His mother
    Koel-hah-ah sings and foreknows events from home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker reaches two waters where his hair covers the water, finds his
    skull, uses it as a dipper, drinks, and experiences disordered sensations and
    strong smells.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says these impressions are caused by thoughts of his dead father
    and of Apaches rejoicing after killing him.
  category: speech
