canonical_text:
  quote: ''
  summary: Nahvahchoo becomes a singer, enters restricted paired vahahkkees, steals
    a corn-mill, is followed by rain and rising water, stops the rain with a chewed
    root, leaves the mill, and returns home. In speeches he recounts the making and
    adornment of a Driftwood-Being, the sun-breathed transformation of water moss
    into a turtle, westward travel through color-coded roads, nights, birds, and bows,
    recovery of the everlasting corn-mill, giving power to gathered people, smoke-assisted
    clearer sight, and appeals for power from directional mocking birds.
  language: English
  quote_policy: summarized
