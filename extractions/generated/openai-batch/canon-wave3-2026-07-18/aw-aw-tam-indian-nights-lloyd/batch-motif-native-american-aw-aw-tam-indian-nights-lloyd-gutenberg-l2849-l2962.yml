canonical_text:
  quote: ''
  summary: Hawawk resumes stealing and eating children. Ee-ee-toy first repels her
    by shapeshifting into a small animal and using a gourd rattle, but she eventually
    loses fear of rattles. Two boys captured by Hawawk escape by weighing her basket
    with stones, climbing out onto tree limbs, and later blowing cactus thorns into
    her eyes. After further child-killing at other places, the people ask Ee-ee-toy
    for help. He repeatedly invites Hawawk to dances and songs; she refuses several
    but accepts a ring dance, dresses in rattling deerskin garments, and joins hands
    with Ee-ee-toy at the dancing place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hawawk comes to believe the people have gone away, later sees children playing,
    catches two of them, carries them to her cave, and resumes stealing children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ee-ee-toy makes a rattle from a wild gourd, lies on Hawawk's trail, changes
    himself into a small animal called Kaw-awts, and frightens Hawawk by shaking the
    rattle at her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ee-ee-toy makes rattles for the children so they can scare Hawawk back, but
    after a while Hawawk becomes accustomed to the rattles and continues carrying
    children away.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Two little boys are hunting doves from a willow kee with a sand hole and a
    perching stick when they see Hawawk approaching and say she will eat them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boys hide under dove feathers, but a wind sweeps the feathers away; Hawawk
    catches the boys, puts them into her gyih-haw, and starts off.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The boys ask Hawawk to collect flat stones and pass under low tree limbs;
    while the stone-filled basket grows heavy, each boy escapes by catching a tree
    limb and hanging there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Hawawk follows their tracks and nearly catches them near the village,
    the boys hold up fine cactus thorns so the wind blows them into Hawawk's face
    and eyes, allowing the boys to run home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hawawk later stays near Notched Cliffs and Green Well, where she eats or kills
    children.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The people call on Ee-ee-toy for help, and Ee-ee-toy says he will kill Hawawk
    at once.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ee-ee-toy invites Hawawk to several dances or songs; she refuses the first
    three invitations but accepts the invitation to the See-coll-cod-dha-kotch Nyuee
    ring dance.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
- id: obs:11
  text: Hawawk dresses in a soft buckskin skirt and a fringed deerskin overskirt with
    deer-hoofs that rattle, runs to the dancing place, and joins hands with Ee-ee-toy.
  category: action
  evidence_refs:
  - ev:12
