canonical_text:
  quote: ''
  summary: Juhwerta Mahkai agrees to help Ee-ee-toy and to bring to earth his people
    who had sunk before the flood. Six named, color-marked bands prepare to emerge,
    with Yellow Gopher opening the way. Toe-hahvs laughs at the loaded gyih-haws,
    after which the gyih-haws cease walking and the earth closes, leaving some bands
    and Juhwerta Mahkai behind. The emerging people camp, sing, dance for war, and
    travel for years. Ee-ee-toy transforms a brave small rat into deer, creating a
    new food source. Two brothers hunt deer for the people, while a doctor uses deer
    body parts in witchcraft to hide the deer and later receives fawn tail, ear, and
    nose tips from the hunters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Juhwerta Mahkai promises Ee-ee-toy help and says he will lead back to earth
    his people, who had sunk down before the flood, so they may fight against the
    people who had turned against Ee-ee-toy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Juhwerta Mahkai's people gather portable property to take with them to earth.
  category: action
  evidence_refs:
