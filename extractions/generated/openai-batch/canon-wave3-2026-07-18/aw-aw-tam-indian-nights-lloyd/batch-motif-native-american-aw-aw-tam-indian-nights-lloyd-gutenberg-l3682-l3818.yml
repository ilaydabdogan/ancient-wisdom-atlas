  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A doctor uses deer ears and tail in witchcraft so that deer can hide from
    the hunters.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The same doctor gives the hungry hunters directions for finding deer and later
    asks for the tips of a fawn's tail, ears, and nose.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:17
  text: The doctor explains that a deer first feels pursuit with its tail, hears nearness
    with its ears, and smells danger with its nose; the brothers bring the requested
    fawn parts, and the doctor begins to sing while holding them with earlier items.
  category: speech
  evidence_refs:
  - ev:10
