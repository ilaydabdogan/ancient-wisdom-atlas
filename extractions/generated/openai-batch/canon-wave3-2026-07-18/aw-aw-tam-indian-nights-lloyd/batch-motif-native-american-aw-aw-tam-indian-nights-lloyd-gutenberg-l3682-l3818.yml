  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After deer exist, the people have a new food source.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Two brothers, Hay-mohl and Soo-a-dack Cee-a-vawt, hunt deer during the march
