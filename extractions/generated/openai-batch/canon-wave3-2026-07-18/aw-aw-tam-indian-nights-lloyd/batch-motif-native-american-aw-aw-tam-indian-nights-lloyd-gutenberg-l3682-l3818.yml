  text: The gyih-haws are loaded with belongings and walk beside the ranks as the
    bands pass through.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Toe-hahvs looks back, laughs at the walking gyih-haws, and the gyih-haws stop
    walking; the passage states that women have had to carry them ever since.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Toe-hahvs laughs, the earth closes, leaving the sixth band, part of
    the fifth band, and Juhwerta Mahkai behind; Ee-ee-toy, Toe-hahvs, and some other
    powerful men pass through to lead the people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At White Earth and later at Black Mountain, the people camp, sing, dress in
    war-bonnets, and perform war dances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the long journey, the people camp for extended periods, live by hunting,
    and send scouts and spies ahead to find safe stopping places.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ee-ee-toy attempts to make a deer from a wood-rat, but releases him when the
    cutting hurts him; the passage says a knife mark remains on the wood-rat's chest
    and neck.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ee-ee-toy transforms a brave small coarse-haired rat into a deer and says
