- id: obs:3
  text: Six named bands go out in order; the first, third, and fifth are red, while
    the second, fourth, and sixth are white and yellow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The band names are said to be the names by which they called their fathers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yellow Gopher is sent ahead to open a way to earth.
  category: action
  evidence_refs:
