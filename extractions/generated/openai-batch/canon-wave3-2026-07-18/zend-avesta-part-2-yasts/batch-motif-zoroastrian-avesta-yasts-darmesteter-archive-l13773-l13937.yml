canonical_text:
  quote: ''
  summary: 'The passage instructs Zarathustra to invoke Vayu''s names when threatened
    by violent attackers, loss, or imprisonment. Vayu is described as fear-striking,
    anti-Daeva, powerful, swift, and sovereign-like. A ritual exchange is described:
    Zarathustra is to take a baresma and orient it according to day or dawn; if Vayu
    is worshipped with sacrifice, Vayu promises health-giving speech and protection
    from Angra Mainyu, Yatus, Daevas, and hostile men. A litany sacrifices to Vayu
    under golden attributes and to the part of Vayu belonging to the Good Spirit.
    The passage then transitions to Din Yast, identifying Daena with the Zoroastrian
    Law or Religion and Chista with religious knowledge, and opening with sacrifice
    to Chista and the good Law of the worshippers of Mazda.'
  language: English
  quote_policy: summarized
