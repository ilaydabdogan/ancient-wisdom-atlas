canonical_text:
  quote: ''
  summary: The passage links correct sacrifice and prayer with rightful power, reign,
    and royalty; warns that a sovereign may receive bad treatment in the next world;
    gives a holy spell for cleansing birth and growth, purifying a woman, increasing
    children, milk, seed, offspring, and flowing springs; describes the fiend as drying
    milk and causing distress; says the perfume of fire removes demons and destroys
    harmers of the Good Spirit's creation; names Mithra, Rashnu Razista, and the Mazda-worshippers'
    Law as agents wishing beings taken far away; and describes the departed soul's
    first-night position near the head and in Good Words while singing a Gatha.
  language: English
  quote_policy: summarized
