canonical_text:
  quote: ''
  summary: The passage introduces the Haptan Yasht as a liturgical text for the seven
    Amesha-Spentas, largely extracted from the Sirozahs. It gives formulas of Mazda-worship,
    invocations and sacrifices to Ahura Mazda, the Amesha-Spentas, named divine or
    sacred beings, ritual times, waters, seasons, abundance, and protective powers,
    ending with the beginning of a section calling for Yatus, including Daevas and
    men, to be crushed.
  language: English
  quote_policy: summarized
