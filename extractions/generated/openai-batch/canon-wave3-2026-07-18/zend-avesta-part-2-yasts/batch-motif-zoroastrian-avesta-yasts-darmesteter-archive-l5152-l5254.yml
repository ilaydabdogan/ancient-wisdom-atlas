canonical_text:
  quote: '"the Moon, that keeps in it the seed of the Bull"'
  summary: 'The passage closes a Moon hymn in which sacrifice, libations, Haoma, meat,
    baresma, spells, speech, deeds, and rightly spoken words are offered to the Moon,
    which preserves the Bull''s seed and gives life-supporting benefits. It then introduces
    the Tir Yasht: Tishtrya, identified by the editor with Sirius, is described as
    the leader of the stars, a rain-producing star that struggles against Apaosha,
    the Daeva of Drought, is first overcome, and finally conquers. The introduction
    also notes a related Bundahish account in which the struggle has a cosmological
    role in producing seas and lakes.'
  language: English
  quote_policy: quoted
