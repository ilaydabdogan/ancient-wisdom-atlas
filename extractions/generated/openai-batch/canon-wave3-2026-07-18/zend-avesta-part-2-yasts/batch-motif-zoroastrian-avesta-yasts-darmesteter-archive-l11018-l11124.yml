  summary: The passage is primarily a litany worshipping the Fravashis of many holy
    named figures. It singles out Karesna, son of Zbaurva, as holy, gallant, the incarnate
    Word, mighty-speared, and lordly. It says that Ashi Vanguhi walked in Karesna's
    house in the shape of a beautiful, strong, pure, noble maiden, and it associates
    the same passage with battle prowess. Later lines continue the Fravashi litany
    and include named sonship relationships and a note tentatively identifying Amru
    and a second similarly named figure as mythical birds.
