canonical_text:
  quote: ''
  summary: The passage describes Zarathustra’s holiness and the power of his Ahuna
    Vairya prayer against the Daevas; Frangrasyan’s failed attempt to seize Zarathustra’s
    Glory; the kingly Glory cleaving to Vistaspa, who advances the Law and defeats
    enemies; the future cleaving of Glory to Saoshyant and his helpers during world
    restoration, resurrection, and the defeat of Druj; Astvatereta rising from Lake
    Kasava; and several figures bearing Glory during the killing of enemies.
  language: English
