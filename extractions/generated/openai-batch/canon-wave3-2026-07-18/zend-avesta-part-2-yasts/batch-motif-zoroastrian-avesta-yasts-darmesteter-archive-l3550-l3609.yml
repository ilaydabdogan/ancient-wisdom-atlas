canonical_text:
  quote: ''
  summary: The passage closes one boon request involving hostile beings and reports
    Ardvi Sura Anahita granting that boon. It then commands Spitama Zarathushtra to
    offer sacrifice to Anahita's spring. Yima Khshaeta, called the good shepherd,
    sacrifices to Anahita from the height Hukairya with large numbers of animals,
    asks for universal sovereignty and the transfer of riches and welfare from the
    Daevas, and Anahita grants his boon.
  language: English
