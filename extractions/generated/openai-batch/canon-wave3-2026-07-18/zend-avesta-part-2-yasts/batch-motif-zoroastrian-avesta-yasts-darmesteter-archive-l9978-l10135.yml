canonical_text:
  quote: ''
  summary: The passage praises the good, strong, beneficent Fravashis of the faithful
    as battle-aiding powers, protectors of the faithful, givers of victory, boons,
    health, and glory. It describes them as armed and radiant, coming from the heavens
    when invoked, assisting the pious side in conflict, and acting with Mithra, Rashnu,
    a cursing thought, and the victorious wind. It also describes Satavaesa between
    earth and sky as connected with waters, plant growth, nourishment, and help for
    the faithful.
  language: English
  quote_policy: summarized
