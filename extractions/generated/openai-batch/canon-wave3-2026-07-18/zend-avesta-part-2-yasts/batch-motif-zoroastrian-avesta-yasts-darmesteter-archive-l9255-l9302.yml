canonical_text:
  quote: '"the tree of the eagle ... in the middle of the sea Vouru-Kasha"'
  summary: 'Three invocation stanzas address holy, strong Rashnu wherever he may be:
    on the eagle''s tree in the middle of the sea Vouru-Kasha, on the Aodhas of the
    Rangha, or on the Sanaka of the Rangha. The tree is described as a tree of good,
    powerful, and all remedies, bearing the seeds of all plants. Editorial notes connect
    the eagle/tree with Saena, later Simurgh, and a cited Minokhirad account in which
    seeds from the all-seed tree are spread through bird agency and Tishtar''s rain;
    other notes cautiously suggest geographical meanings for Aodhas and Sanaka.'
  language: English
  quote_policy: quoted
