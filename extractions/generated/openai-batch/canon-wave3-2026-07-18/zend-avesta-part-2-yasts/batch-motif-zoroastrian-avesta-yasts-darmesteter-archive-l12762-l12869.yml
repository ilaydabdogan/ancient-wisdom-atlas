canonical_text:
  quote: ''
  summary: Ahura Mazda tells Zarathustra that the feather of the Vareghana bird can
    be used against curses and enemies. The passage describes the protective power
    of the bird’s feather or bone, the fear it inspires, and the bird’s association
    with chariots, Kavi Usa, Thraetaona’s defeat of Azi Dahaka, sacrifice to Verethraghna,
    and similes comparing Verethraghna with the Saena bird and water-filled clouds
    beating mountains.
  language: English
  quote_policy: summarized
