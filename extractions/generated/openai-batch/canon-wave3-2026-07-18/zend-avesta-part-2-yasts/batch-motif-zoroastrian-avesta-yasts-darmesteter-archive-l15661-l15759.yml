canonical_text:
  quote: ''
  summary: Frangrasyan repeatedly tries and fails to seize the Glory belonging to
    the Aryan nations and holy Zarathustra. Each failed attempt causes the Glory to
    escape and shift its seat in or near the sea Vouru-Kasha, producing named waters.
    Frangrasyan speaks of defiling corn and liquors, while a response says Ahura Mazda
    will oppose him. The passage then praises the Mazda-made Glory that cannot be
    forcibly seized and describes it cleaving to one who grows near Lake Kasava, the
    Haetumant river, and Mount Ushidhau, where waters flow and bring abundance, beauty,
    health, and animal strength.
  language: English
  quote_policy: summarized
