canonical_text:
  quote: ''
  summary: Mithra's chariot procession is accompanied by A'ista, a personified cursing
    thought in boar form, Atar, and kingly Glory. The chariot bears repeated arrays
    of thousandfold weapons and a hundred-knotted club, which travel through heavenly
    space and strike the Daevas. After smiting the Daevas and men who lied to him,
    Mithra drives through named regions, while Angra Mainyu and Aeshma flee.
  language: English
  quote_policy: summarized
