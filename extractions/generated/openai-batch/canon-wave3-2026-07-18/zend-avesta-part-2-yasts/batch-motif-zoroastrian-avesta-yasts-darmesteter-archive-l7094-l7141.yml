    and kills vast numbers. The hymn then turns to sacrificial praise of Mithra as
    sleepless and ever awake, describes his wide bright dwelling over the material
    world, and says that eight friends sit as spies for him at heights and watching-places,
    observing and remembering those who lie to Mithra and guarding threatened persons.
