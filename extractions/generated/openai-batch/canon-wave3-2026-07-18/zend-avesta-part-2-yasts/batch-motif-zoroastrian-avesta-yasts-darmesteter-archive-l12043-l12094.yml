canonical_text:
  quote: ''
  summary: The passage worships the Fravashis of holy women and men in named and all
    countries, then worships all good, awful, beneficent Fravashis of the faithful
    from Gaya Maretan to the victorious Saoshyaw. It asks the Fravashis to come quickly
    and help, says they protect in distress with the assistance of Ahura Mazda, Sraosha,
    and Mathra-Spenta, and describes Mathra-Spenta as all-knowing, anti-Daeva, a friend
    of Ahura Mazda, and worshipped by Zarathustra. The final line begins an incomplete
    wish concerning good waters and plants.
  language: English
