canonical_text:
  quote: ''
  summary: The passage repeatedly sacrifices to the most right A'ista/Arista, made
    by Mazda and holy, and to the good Law of the worshippers of Mazda. Zarathustra,
    Hvovi, the Athravans sent afar, and a country king each sacrifice while requesting
    moral, bodily, teaching, or political boons. A closing prayer blesses the sacrifice
    and asks for brightness, glory, long life, and the blissful abode of the holy
    Ones.
