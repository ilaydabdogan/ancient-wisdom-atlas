canonical_text:
  quote: ''
  summary: The passage says that a person who pronounces the named formulas at daily,
    ritual, and travel transitions will be protected from weapons and hostile fiends.
    It asks for instruction in rules for this world and the next so that Sraosha and
    Vohu-Mano may help. It then gives hails to sacred Iranian places, waters, and
    the holy world, and closes with worship of prayers, beneficent powers, and Ahura
    Mazda.
  language: English
  quote_policy: summarized
