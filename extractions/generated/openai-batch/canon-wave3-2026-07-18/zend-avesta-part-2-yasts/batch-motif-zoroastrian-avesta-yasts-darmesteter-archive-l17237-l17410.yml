canonical_text:
  quote: ''
  summary: 'Zarathustra instructs the young king Vistaspa in worship and sacrifice:
    proclaim worship of Ahura Mazda and his creation, address a holy Mazda-made tree,
    cut and bind baresma twigs, prepare Haoma, invoke Ahura Mazda and cosmic powers,
    recite prayers, worship Fire, follow the Mazdean Law, give gifts for heavenly
    reward, and purify with water. The passage links these rites and prayers with
    royal power, victory over enemies and the Druj, cleansing, moral correction, and
    ascent to the blessed Garo-nmana.'
  language: English
  quote_policy: summarized
