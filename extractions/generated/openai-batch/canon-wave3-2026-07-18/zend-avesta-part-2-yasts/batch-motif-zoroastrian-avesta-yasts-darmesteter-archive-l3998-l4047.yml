  quote: ''
  summary: The passage commands sacrifice to Ardvi Sura Anahita, described as a spring.
    The sons of Vaesaka sacrifice many animals at the high castle Khshathro-saoka
    on holy Kangha and request victory over Tusa and mass destruction among the Aryan
    people, but Anahita refuses the boon. A following section says Vafra Navaza worshipped
    Anahita when Thraetaona flung him into the air in the shape of a bird or vulture;
    translator notes connect this to a Thraetaona-cycle myth.
