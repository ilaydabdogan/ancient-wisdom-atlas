canonical_text:
  quote: ''
  summary: The passage describes Ardvi Sura Anahita as a vast holy river or spring
    from which waters flow through the seven Karshvares, purifying fertility and milk
    and increasing life, herds, wealth, and country. Ahura Mazda says he brought the
    river down for the increase and protection of human communities. Anahita proceeds
    from Maker Mazda, seeks praise and offerings, drives a chariot, is carried by
    four white horses, and sends down motherly waters. Ahura Mazda offers sacrifice
    to her in Airyana Vaejah by the river Daitya and asks for a boon concerning Zarathustra's
    adherence to his law.
  language: English
  quote_policy: summarized
