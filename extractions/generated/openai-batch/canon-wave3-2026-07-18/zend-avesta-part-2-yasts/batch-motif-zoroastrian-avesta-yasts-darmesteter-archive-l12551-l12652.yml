canonical_text:
  quote: ''
  summary: 'In this excerpt from the Bahrām Yašt, Zarathustra asks Ahura Mazda who
    is the best-armed of the heavenly gods, and Ahura Mazda answers that it is Verethraghna,
    made by Ahura. Verethraghna comes in successive forms: a wild ram, a fighting
    buck, and a bright man holding an ornamented golden-bladed sword, each time bearing
    the good Glory made by Mazda. The passage then praises Verethraghna as a maker
    of virility, death, and resurrection, and Zarathustra offers sacrifice requesting
    victorious forms of thought, speech, action, address, and answer. The excerpt
    breaks off as Verethraghna begins to give him something.'
  language: English
  quote_policy: summarized
