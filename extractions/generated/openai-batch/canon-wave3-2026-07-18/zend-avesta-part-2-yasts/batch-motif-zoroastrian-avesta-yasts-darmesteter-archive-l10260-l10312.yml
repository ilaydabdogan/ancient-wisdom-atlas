canonical_text:
  quote: ''
  summary: A sequence of Farvardin Yasht invocations worships the good, strong, beneficent
    Fravashis of the faithful. They are described as watching over the bright sea
    Vouru-Kasha, the stars Hapt6iri;^ga, the body of Keresaspa, and the seed of holy
    Zarathustra, each in a vast numbered host. The final unit says they fight at the
    right hand of a reigning lord if he rejoices the faithful and does not harm or
    offend the Fravashis.
  language: English
  quote_policy: summarized
