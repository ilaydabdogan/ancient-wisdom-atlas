canonical_text:
  quote: ''
  summary: The passage praises Mithra as undeceivable, wise, sleepless, ever awake,
    and all-seeing. It says he denies strength, glory, and boons to those who lie
    to him, removes their bodily powers, protects the man he helps from spear and
    arrow, possesses a wide law, looks over the seven Karshvares of the earth, gives
    prosperity and sovereignty, and proceeds with several divine or personified powers.
  language: English
  quote_policy: summarized
