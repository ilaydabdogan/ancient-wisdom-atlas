canonical_text:
  quote: ''
  summary: Ardvi Sura Anahita instructs Spitama Zarathushtra about the proper sacrifice
    and libation due to her between sunrise and sunset, restricts who may drink such
    libations, rejects offerings associated with various unfit persons, and explains
    that libations brought after sunset by worshippers of the Daevas are received
    by Daevas. The passage also mentions a serpent’s injurious poisons, notes water
    being sent upward toward the heavens, and praises the golden height Hukairya from
    which Ardvi Sura Anahita leaps with the glory of the waters.
  language: English
  quote_policy: summarized
