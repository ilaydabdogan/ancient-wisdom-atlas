  quote: ''
  summary: The passage praises and sacrifices to Mithra as sleepless and ever awake,
    describes his chariot drawn by white stallions, and contrasts a successful sacrifice
    offered by a holy priest with an ineffective sacrifice performed by an unholy
    priest. Ahura Mazda states that Mithra will visit the dwelling and bring boons
    to the properly served man, while improper ritual does not delight the divine
    powers.
