  quote: ''
  summary: The passage introduces sections on Verethraghna’s powers, including the
    raven’s feather, then gives liturgical praise and sacrifice formulas. Zarathushtra
    asks Ahura Mazda which heavenly god is best armed; Ahura Mazda identifies Verethraghna.
    Verethraghna comes to Zarathushtra in the shape of a strong, beautiful wind, bearing
    Mazda-made Glory, and declares his victorious, healing, and protective power against
    malicious beings.
