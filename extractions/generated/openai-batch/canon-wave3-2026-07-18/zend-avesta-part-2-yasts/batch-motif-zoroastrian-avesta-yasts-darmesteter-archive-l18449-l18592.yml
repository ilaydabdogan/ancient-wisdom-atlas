  summary: The passage is a prayer to Atar, the Fire and son of Ahura Mazda. It asks
    that Fire receive offerings in human houses, protect and burn there until the
    restoration of the world, grant welfare, wisdom, offspring, and a blessed abode,
    and bless those who bring proper fuel while aiding friends and avenging harmers.
