canonical_text:
  quote: ''
  summary: The passage petitions for law, health, Mazda-made Glory, virtuous offspring,
    a share in the blessed world, dominion, long life, boons, remedies, and protection
    against adversaries. It then worships the Fravashis of several holy figures, including
    Keresaspa, Akhrura, Haoshyangha, Fradhakhshti, Hvovi, Freni, Thriti, Pourucista,
    Hutaosa, Humai, and Zairici. Several invocations are explicitly framed as resistance
    to brigands, deceivers, Yatus, Pairikas, Daevas, fiends, and Aeshma. Notes add
    kinship details and explain the jar association of Fradhakhshti/Khumbya.
  language: English
  quote_policy: summarized
