  summary: The passage opens with liturgical confession and propitiation. Ahura Mazda
    tells Spitama Zarathustra to proclaim the power of the Fravashis of the faithful.
    Through their brightness and glory, Ahura Mazda says he maintains the sky, Ardvi
    Sura Anahita and her life-giving river, the wide earth with its waters and plants,
    and a conceived child in the womb.
