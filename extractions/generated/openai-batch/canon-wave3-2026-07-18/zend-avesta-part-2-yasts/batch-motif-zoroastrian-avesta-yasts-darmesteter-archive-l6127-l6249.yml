canonical_text:
  quote: ''
  summary: 'The passage introduces and begins a Yast addressed to the powerful, Mazda-made
    Drvaspa. Drvaspa is described as protecting flocks and herds, yoked with horses
    and a chariot, and aiding the faithful. Haoshyangha and Yima each offer large
    sacrifices and libations to her, ask for boons, and receive them: Haoshyangha
    asks to overcome the Daevas of Mazana, while Yima asks to bring prosperity and
    immortality to the Mazda-created world and remove hunger, thirst, old age, death,
    and hostile winds for a thousand years.'
  language: English
  quote_policy: summarized
