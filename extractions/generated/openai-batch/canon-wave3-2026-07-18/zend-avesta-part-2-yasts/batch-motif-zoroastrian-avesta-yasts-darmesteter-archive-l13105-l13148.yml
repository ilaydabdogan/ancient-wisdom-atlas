  quote: ''
  summary: In a liturgical section, Verethraghna, described as made by Ahura and by
    Mazda, is invoked in sacrifice. He disables the hands, eyesight, hearing, feet,
    and resistance of the Mithradrujes. The prayer blesses sacrifice, prayer, and
    Verethraghna's strength and asks for brightness, glory, and the blissful abode
    of the holy Ones for the sacrificer.
