canonical_text:
  quote: ''
  summary: 'In section VIII, the passage calls for sacrifice to the Waters, to the
    one who divides them, and to Vayu. Aurvasara, lord of the country, sacrifices
    to Vayu near the White Forest with golden ritual furnishings, baresma, and boiling
    milk offerings. He asks Vayu for a boon: that Husravah, the king who unites the
    Aryan nations, not smite them and that Aurvasara may flee from him.'
