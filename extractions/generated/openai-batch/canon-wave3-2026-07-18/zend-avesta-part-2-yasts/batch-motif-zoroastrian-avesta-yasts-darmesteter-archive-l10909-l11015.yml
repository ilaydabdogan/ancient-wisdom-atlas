    holy persons, many identified by patronymic or by translator notes. The passage
    links this worship with withstanding evil dreams, evil visions, evil Pairikas,
    evil Ashemaoghas, and evil done by the faithful. Mathravaka is singled out as
    a priestly figure able to smite evil, unfaithful Ashemaoghas.
