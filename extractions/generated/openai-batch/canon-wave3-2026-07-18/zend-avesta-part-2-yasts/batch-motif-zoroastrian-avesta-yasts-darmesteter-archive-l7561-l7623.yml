canonical_text:
  quote: ''
  summary: The passage invokes Mithra as protector of nations that worship well, destroyer
    of those who delight in havoc, lord of wide pastures, sleepless and awake. It
    describes Mithra’s dwelling for Rashnu, his protection of those who do not lie,
    his friendship with Rashnu and Verethraghna, the punishment of those who lie to
    Mithra, and Ahura Mazda’s gift to Mithra of a thousand senses and ten thousand
    eyes, by which Mithra watches offenders and remains undeceivable and all-knowing.
  language: English
  quote_policy: summarized
