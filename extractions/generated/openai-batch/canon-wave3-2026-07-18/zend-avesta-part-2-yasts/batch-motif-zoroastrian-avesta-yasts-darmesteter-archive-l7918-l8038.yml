canonical_text:
  quote: ''
  summary: A hymn passage addresses Mithra as sleepless and all-seeing, with arms
    extending across far boundaries. It contrasts earthly evil and limited human perception
    with Mithra’s heavenly goodness, wisdom, hearing, and sight. Mithra questions
    who will sacrifice or lie to him and is portrayed as able to grant or remove glory,
    health, wealth, offspring, sovereignty, and punishments such as sickness, death,
    poverty, and sterility.
  language: English
  quote_policy: summarized
