canonical_text:
  quote: ''
  summary: The passage praises Sraosha as a sleepless guardian of Mazda's creation
    and the material world. He protects from sunset with an uplifted club, has not
    slept since the good Spirit and the evil One made the world, fights the Mazainya
    Daevas day and night, and causes the Daevas to bow in fear and flee to darkness.
    A ritual voice sacrifices to holy, tall-formed, fiend-smiting Sraosha and says
    he watches the Druj and the most beneficent Spirit so that the Amesha-Spentas
    may go along the seven Karshvares of the earth.
  language: English
  quote_policy: summarized
