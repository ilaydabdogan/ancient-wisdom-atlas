canonical_text:
  quote: ''
  summary: The passage presents several episodes from the Aban Yasht in which named
    worshippers sacrifice to Ardvi Sura Anahita and request boons. A group of sons
    of Sayu asks for victory over Turanian opponents and receives the boon. Vistauru
    worships by the river Vitanghuhaiti, asks for a dry passage, and Anahita appears
    as a radiant maid who parts the waters to let him cross. Yoina of the Fryanas
    sacrifices and asks to overcome Akhtya and answer his ninety-nine riddles, and
    the boon is granted. Ahura Mazda then calls Ardvi Sura Anahita down from the stars
    to the earth so that great lords and their sons may worship her.
  language: English
  quote_policy: summarized
