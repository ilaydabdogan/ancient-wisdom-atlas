  summary: A liturgical catalogue worships the Fravashis of holy mythic and royal
    figures. Yima is invoked against Daeva oppression, drought, and unseen death;
    Thraetaona is invoked against diseases and the Serpent’s evil. Other holy figures
    and kings are listed, with translator notes giving wisdom, medical, genealogical,
    avenging, and royal associations.
