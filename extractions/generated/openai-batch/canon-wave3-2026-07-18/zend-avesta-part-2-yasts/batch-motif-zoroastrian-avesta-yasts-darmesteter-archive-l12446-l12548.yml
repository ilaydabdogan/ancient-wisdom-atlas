canonical_text:
  quote: ''
  summary: In repeated sections of the Bahrām Yašt, Verethraghna is invoked as made
    by Ahura. Zarathustra asks Ahura Mazda which heavenly god is best armed, and Ahura
    Mazda names Verethraghna. Verethraghna appears successively as a boar, a youth
    of fifteen, and a raven, each manifestation associated with Mazda-made Glory.
    The raven is described as extremely swift, dawn-seeking, and moving across mountains,
    valleys, and tree tops.
