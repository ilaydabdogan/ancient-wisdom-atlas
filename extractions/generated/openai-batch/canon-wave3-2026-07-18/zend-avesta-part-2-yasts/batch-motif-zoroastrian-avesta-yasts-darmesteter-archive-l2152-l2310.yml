canonical_text:
  quote: ''
  summary: 'The passage contains worship formulas and petitions: repeated remedy formulae;
    worship of Strength, Verethraghna, Spenta-Armaiti, Gaokerena, Ahura Mazda''s faculties,
    a mountain that gives understanding, Ahura Mazda as lord and master, and several
    cosmic powers. It asks for enemies and demonic beings to be disabled or smitten,
    invokes the keeping, study, and speaking of the Holy Word, and blesses a worshipper
    with health, strength, wealth, offspring, long life, and the blissful abode of
    the holy ones.'
