canonical_text:
  quote: '"the bright and glorious Tii''trya mingles his shape with light"'
  summary: 'The passage includes notes on Vanant as a star-leader and guardian of
    Mount Alborz''s passes and the sun-road, and on sacrifice to Tijtar for soundness
    of sight. The main hymn passage describes the bright and glorious Tiistrya/Tii''trya
    appearing with light in successive forms: a fifteen-year-old man, a golden-horned
    bull, and a white horse with golden ears and caparison. In the human and bull
    sequences he summons people to offer Haoma and holy meat, promising male children
    or oxen and purification of the offerer''s soul.'
  language: English
  quote_policy: quoted
