canonical_text:
  quote: ''
  summary: In the opening sections of the Tir Yast, Ahura Mazda addresses Spitama
    Zarathustra and describes worship and sacrifice offered to Tistrya, the bright
    and glorious star. Tistrya protects the Moon, dwelling, and food, gives fields
    their share of waters, is connected with the seed of the waters from high Apam
    Napat, is awaited by flocks, herds, and people for his rising and for abundant
    springs, and flies toward the sea Vouru-Kasha.
  language: English
  quote_policy: summarized
