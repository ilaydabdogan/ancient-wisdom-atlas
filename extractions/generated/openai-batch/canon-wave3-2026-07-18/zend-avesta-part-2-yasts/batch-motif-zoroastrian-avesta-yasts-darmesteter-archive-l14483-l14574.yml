canonical_text:
  quote: ''
  summary: 'Sections 32-43 of the Ashi Vast present three sacrifice-and-boon episodes
    addressed to Ashi Vanguhi: Thraetaona seeks victory over A^i Dahaka and deliverance
    of two named women; Haoma seeks to bind and bring Franghrasyan to Husravah for
    vengeance; Husravah seeks to kill Franghrasyan to avenge named murders.'
