canonical_text:
  quote: ''
  summary: The passage is a liturgical enumeration of beings, places, powers, teachings,
    and sacred objects to whom sacrifice is offered. It includes Mazda-made kingly
    Glory; Arstat; Mount Ushi-darena and all mountains as seats of holy happiness;
    the shining heavens and blissful abode of the holy ones; the Earth, places, and
    fields; the Mathra Spenta, anti-Daeva Law, Law of Zarathuštra, traditional teaching,
    devotion, understanding, knowledge, and wisdom; the eternal luminous space, Garo-nmana,
    place of eternal Weal, the Cinvat-bridge, Apam Napat, water, Haoma, blessing,
    cursing thought, holy gods of heavenly and material worlds, and Fravashis of the
    holy ones.
  language: English
  quote_policy: summarized
