  summary: The passage describes king Vt^t^spa maintaining Holiness against fiends,
    a figure identified in a note as Saoshyant looking on the living world so that
    living creatures are delivered to immortality, the coming forward of Astvat-ereta’s
    truthful friends, the retreat or defeat of hostile powers, and a sacrificial blessing
    of Mount Ushi-darena and kingly Glory.
