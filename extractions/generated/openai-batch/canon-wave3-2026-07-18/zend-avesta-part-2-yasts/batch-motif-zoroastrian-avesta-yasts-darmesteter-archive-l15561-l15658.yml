canonical_text:
  quote: ''
  summary: The passage invokes the Son of the Waters and the unseizable Glory. Ahura
    Mazda tells Zarathustra that whoever seizes the Glory, or longs for illumination
    and fullness of knowledge, receives the gifts of an Athravan and is attended by
    riches, victory, and strength. Frangrasyan, a Turanian figure, tries unsuccessfully
    to seize the Glory in the sea Vouru-Kasha; the Glory flees and changes its seat,
    producing Lake Husravah. Frangrasyan then threatens to defile corn and liquors,
    and the passage states that Ahura Mazda will come against him.
  language: English
  quote_policy: summarized
