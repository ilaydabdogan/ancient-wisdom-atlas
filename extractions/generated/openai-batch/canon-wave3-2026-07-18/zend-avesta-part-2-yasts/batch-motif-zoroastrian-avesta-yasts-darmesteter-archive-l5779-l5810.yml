  summary: The passage praises Ti^-trya/Ti-?trya as a bright and glorious star. His
    rising is watched by humans, chiefs, wild beasts, and tame beasts in relation
    to a good or bad year and the fertility of the Aryan countries. He is described
    as swift-flying toward the sea Vouru-Kasha, with his speed compared to Erekhsha's
    arrow shot through heavenly space between two mountains. The passage then says
    Ahura Mazda gives assistance and the Amesha-Spentas and Mithra point the way to
    an ambiguously identified 'him' in the arrow episode.
