canonical_text:
  quote: ''
  summary: A male figure flies toward his own house for three days and nights but
    cannot descend. At dawn he prays to Ardvi Sura Anahita, promising a thousand libations
    with Haomas and meat at the river Rangha if he reaches the earth and his house
    alive. Anahita comes in the shape of a radiant maiden, seizes him by the arm,
    and he arrives safely at the earth and at home. A bracketed clause reports the
    boon being granted, while a note calls that clause spurious. An editorial note
    identifies the figure as Thraetaona and compares the episode with a Shah Namah
    account involving Rangha/Tigris and magic.
  language: English
  quote_policy: summarized
