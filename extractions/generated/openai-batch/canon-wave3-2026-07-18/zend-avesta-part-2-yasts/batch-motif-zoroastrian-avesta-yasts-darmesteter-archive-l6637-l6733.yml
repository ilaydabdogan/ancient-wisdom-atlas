canonical_text:
  quote: ''
  summary: The passage invokes Mithra, promises libations and sacrifice to him, lists
    his vigilant and truth-speaking attributes, describes chiefs and horsemen worshipping
    him for success in battle, says he turns to the first faithful side, and places
    him reaching over Hara before the swift-horsed sun. Translator notes gloss good
    conscience/bliss in afterlife terms and identify Hara with Mount Alborz.
  language: English
  quote_policy: summarized
