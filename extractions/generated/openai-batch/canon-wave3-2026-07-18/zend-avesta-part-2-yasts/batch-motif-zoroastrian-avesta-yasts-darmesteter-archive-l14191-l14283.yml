canonical_text:
  quote: ''
  summary: The passage praises and sacrifices to Ashi Vanguhi, describing her as radiant,
    wise, healing, powerful, and able to help invokers. It lists ritual offerings,
    gives homage to Haoma, the Mathra, and Zarathustra, contrasts Haoma with other
    drinks associated with Aeshma, and describes the prosperity, royal wealth, household
    abundance, adorned beds, and waiting women enjoyed by men whom Ashi attends.
  language: English
  quote_policy: summarized
