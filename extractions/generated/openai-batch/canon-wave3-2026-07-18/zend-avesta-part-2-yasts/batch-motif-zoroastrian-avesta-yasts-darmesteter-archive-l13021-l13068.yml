canonical_text:
  quote: ''
  summary: The passage sacrifices to Verethraghna, made by Ahura. The speaker offers
    Haoma, described as protective and victorious, so that one who drinks him may
    prevail over enemies, and petitions to defeat an army coming behind. A prince,
    his son, and chiefly sons also offer to Verethraghna, call him strong and victorious,
    and petition for constant victory and the defeat of the same pursuing army.
