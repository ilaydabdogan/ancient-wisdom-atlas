canonical_text:
  quote: ''
  summary: 'Fragment from the Ram Yast: Vayu grants a boon connected with overcoming
    a destructive demon and delivering two named women. A ritual section invokes the
    Waters and Vayu. Keresaspa sacrifices to Vayu by the Gudha, a channel of the Rangha,
    using golden ritual furnishings, baresma, and milk offerings, then asks for vengeance
    for his brother Urvakhshaya by smiting Hitaspa and yoking him to his chariot.
    Gandarewa is described as dwelling beneath the waters and as master of the deep.
    Vayu grants Keresaspa''s boon.'
  language: English
  quote_policy: summarized
