canonical_text:
  quote: ''
  summary: Zarathustra blesses King Vishtaspa with long life, progeny, glory, strength,
    wealth, truthfulness, victory, welfare, freedom from sickness and death, and the
    bright blissful abode of the holy Ones. The blessing invokes many heroic, divine,
    celestial, and social exemplars, and closes with the formula of good thoughts,
    good words, and good deeds.
  language: English
  quote_policy: summarized
