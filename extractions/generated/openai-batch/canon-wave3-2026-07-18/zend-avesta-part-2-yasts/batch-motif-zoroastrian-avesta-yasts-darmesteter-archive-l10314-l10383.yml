canonical_text:
  quote: they come flying unto him, it seems as if they were well-winged birds.
  summary: The passage praises the Fravashis of the faithful as powerful, victorious,
    healing beings who gather in vast numbers. When waters rise from the sea Vouru-Kasha
    with Mazda-made Glory, they seek water for their kin, towns, and countries, fight
    for their own lands, and bring waters to the places they favor. A ruler surprised
    by enemies may invoke them, and they come to help if he has not offended them.
    The included notes mention Keresaspa sleeping under heavenly glory until Az-i-Dahak
    is unfettered, and a tradition in which ZaratiiJt's seed is preserved by angels
    and later produces the savior and forerunners through maidens bathing in Lake
    Kasava.
  language: English
  quote_policy: quoted
