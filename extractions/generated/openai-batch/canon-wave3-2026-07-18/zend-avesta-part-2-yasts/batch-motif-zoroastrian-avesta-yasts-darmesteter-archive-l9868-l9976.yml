canonical_text:
  quote: ''
  summary: The passage praises and worships the good, strong, beneficent Fravashis
    of the faithful. They are described as powerful helpers in ritual, battle, cosmic
    ordering, protection of the unborn child, maintenance of the sky, healing, and
    the delivery of victory to worthy countries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A place or side is described where faithful men are present, piety is greatest,
    the faithful man is rejoiced, and the faithful man is not ill-treated.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Fravashis of the faithful are worshipped and described as good, strong,
    beneficent, powerful drivers, safe bridges, effective weapons and arms, and as
    never turning their backs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Fravashis are to be invoked when bundles of baresma are tied and during
    fights and battles against foes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mazda invoked the Fravashis for help when fixing the sky, waters, earth, and
    plants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Spenta-Mainyu is said to have fixed the sky, waters, earth, cattle, plants,
    and the child conceived in the womb so that the child would not die from Vidotu's
    assaults and would develop bodily parts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Spenta-Mainyu maintained the sky, and the strong Fravashis sustained it from
    below while sitting silently and gazing sharply.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Fravashis are described as having powerful eyes and ears, bringing long
    joy, moving well and afar, and possessing riches and high renown.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Fravashis have lasting friendship, prefer an abode where they are not
    harmed by its dwellers, give health, conquer in battle, and do not harm first.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The will of the Fravashis is dreadful to those who vex them, and in battle
    they break the arms of foes and haters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Fravashis are liberal, valiant, strong, welfare-giving, kind, health-giving,
    and follow with Ashi's remedies across the extent of earth, rivers, and sunrise.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Fravashis fight bravely, cause havoc, wound, break the malice of malicious
    Daevas and men, and smite powerfully in battle according to their wish and will.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Fravashis deliver Victory made by Ahura and the crushing Ascendant to
    countries where they have been honored with sacrifice and prayer.
  category: action
  evidence_refs:
  - ev:10
