  summary: The passage recounts the third departure of the Glory from Yima in bird
    form, its seizure by Keresaspa, the attachment of Manly Courage to Keresaspa,
    and a catalogue of Keresaspa’s monster- and enemy-slaying feats, including Srvara
    the poisonous snake and Snavidhaka the stone-handed boaster who threatens cosmic
    inversion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Glory departs from bright Yima, son of Vivanghawi, for the third time
    and goes from him in the shape of a Varaghna bird.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The manly-hearted Keresaspa seizes the Glory and is described as among the
    sturdiest men of strength, next to Zarathustra, for manly courage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Manly Courage cleaves to Keresaspa and is described as firm of foot, unsleeping,
    quick to rise, and fully awake.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Keresaspa kills Srvara, a yellow poisonous snake that devours horses and men,
    with poison flowing over it a thumb’s breadth thick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Keresaspa cooks food in a brass vessel upon Srvara; at noon the fiend feels
    the heat, rises, rushes from beneath the vessel, upsets the boiling water, and
    Keresaspa falls back frightened.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Keresaspa kills the golden-heeled Gandarewa, who rushes with open jaws and
    is eager to destroy the living world of the good principle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Keresaspa kills the brood of Pathana, all nine, along with the broods of Nivika
    and Dastayana.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Keresaspa kills the golden-crowned Hitaspa, Vareshava son of Dana, and Pitaona,
    who is attended by many Pairikas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Keresaspa kills Arezo-shamana, described with traits including manly courage,
