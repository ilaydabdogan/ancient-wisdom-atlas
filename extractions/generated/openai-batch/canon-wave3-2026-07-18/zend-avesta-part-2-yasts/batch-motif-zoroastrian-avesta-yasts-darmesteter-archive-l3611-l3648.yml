canonical_text:
  quote: ''
  summary: The passage commands Spitama Zarathustra to offer sacrifice to Ardvi Sura
    Anahita, described as a spring. It then says that Azi Dahaka the three-mouthed
    sacrificed to her in the land of Bawri. The accompanying notes identify Azi Dahaka
    with a fiendish or storm-cloud snake, compare him with Vedic Ahi/Vrtra, describe
    his overthrow of Yima after Yima lost Glory, and mention later serpent imagery
    in the Shah Namah.
  language: English
  quote_policy: summarized
