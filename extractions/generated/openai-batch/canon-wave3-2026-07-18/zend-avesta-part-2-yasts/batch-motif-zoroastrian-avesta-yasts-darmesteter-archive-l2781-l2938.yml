canonical_text:
  quote: ''
  summary: The passage ranks the Holy Word as the best remedy and describes sickness,
    death, Daevas, hostile broods, vices, falsehood, the Evil Eye, and the north wind
    fleeing or being smitten. Angra Mainyu flees before the god Asha-Vahi-rta and
    laments that this god will smite and afflict sicknesses, deaths, fiends, counter-works,
    oppressors, hostile broods, and other harms. The Druj is said to perish, vanish,
    and go to the northern regions.
  language: English
  quote_policy: summarized
