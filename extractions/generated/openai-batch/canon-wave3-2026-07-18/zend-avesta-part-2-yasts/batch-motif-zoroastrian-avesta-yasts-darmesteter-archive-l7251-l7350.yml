  evidence_refs:
  - ev:1
- id: obs:2
  text: A pious man is described as holding libations in his hands and worshipping
    Mithra with a sacrifice in which Mithra is invoked by name and with proper words.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The liturgical speaker pledges to offer libations to Mithra with a sacrifice
    using Mithra's own name and proper words.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The petition asks Mithra to listen, be pleased, come sit at the sacrifice,
    accept consecrated libations, gather them with love, and lay them in Garo-nmana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The petition asks Mithra to grant boons including riches, strength, victory,
    good conscience, bliss, good fame, a good soul, wisdom, happiness-giving knowledge,
    Ahura-given victorious strength, the Ascendant of Asha-Vahi^ta, and conversation
    on the Holy Word.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The petition asks that the speakers may smite foes, enemies, and the malice
    of Daevas and Men, Yatus and Pairikas, oppressors, blind, and deaf.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
