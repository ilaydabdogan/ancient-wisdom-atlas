canonical_text:
  quote: ''
  summary: 'The passage gives liturgical speech to Mithra: proper named sacrifice
    and libations invite him to attend, accept the offerings, and grant boons including
    riches, strength, victory, good conscience, wisdom, and knowledge. The worshippers
    ask to smite foes and the malice of Daevas, Men, Yatus, and Pairikas. Later stanzas
    praise Mithra as lord of wide pastures, sleepless, ever awake, boon-giving, all-knowing,
    undeceivable, attended by ten thousand spies, and as one who makes waters flow
    and plants grow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
