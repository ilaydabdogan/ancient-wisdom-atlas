canonical_text:
  quote: ''
  summary: In this Aban Yasht passage, Spitama Zarathustra is commanded to offer sacrifice
    to the spring Ardvi Sura Anahita. Worshippers of Mazda stand before her with baresma.
    The Hvovas and Naotaras worship her and request riches and swift horses. The passage
    states that the Hvova was quickly blessed with riches and prosperity, and that
    Vishtaspa the Naotaride became lord of the swiftest horses. Ardvi Sura Anahita
    grants the requested boon while offerings, libations, gifts, sacrifices, and entreaties
    are made.
