  quote: ''
  summary: The passage is a Sirozah II litany, covering sections 1-12 and the beginning
    of 13. It repeatedly offers sacrifice to Ahura Mazda, the Amesha-Spentas, named
    deities and sacred powers, time-of-day recipients, fire and royal glory figures,
    waters and plants, the Sun, the Moon, and Bull souls/fravashis.
  language: English
  quote_policy: summarized
