- id: obs:2
  text: Ahura Mazda and the Amesha-Spentas are invoked at the opening of Sirozah II
    and again in the Dai pa Adar section.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:3
  text: The Bahman section invokes Vohu-Mano, Peace, heavenly Wisdom, and Wisdom acquired
    through the ear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ardibehet section invokes Asha-Vahishta, Airyaman, an instrument made
    by Mazda, and Saoka with eyes of love.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Shahrevar and Sapendarmad sections associate Khshathra-Vairya with metals,
    Mercy, and Charity, and associate Spenta Armaiti with Rata.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Khordad and Murdad sections associate Haurvatat with seasons and years,
    and Ameretat with fatness, flocks, corn, and Gaokerena.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The time-of-day invocations include Mithra and Rama at Havan, Asha-Vahishta
    and Atar at Rapithwin, Apam Napat and water at Uziren, several holy or beneficent
    powers at Aiwisruthrem, and Sraosha, Rashnu, and Arshtat at Ushahin.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
- id: obs:8
  text: Apam Napat is described as swift-horsed, tall, shining, and lord of the females,
    and is invoked with Mazda-made holy water.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Aiwisruthrem invocation includes Fravashis of holy ones, females that
    bring forth flocks of males, thrift of the seasons, Strength, Verethraghna, and
    the crushing Ascendant.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Adar section invokes Atar, several forms of Glory, king Husravah, named
    lakes and mountains, all Fires, and Nairyo-Sangha dwelling in the navel of kings.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: The Aban section invokes good waters, the water-spring Ardvi Anahita, all
    waters, and all plants.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: The Khorshed section invokes the bright, undying, shining, swift-horsed Sun.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:13
  text: The Mah section invokes the Moon as keeping the seed of the Bull, and invokes
    the Soul and Fravashi of the only-created Bull and of the Bull of many species.
  category: relationship
  evidence_refs:
  - ev:14
