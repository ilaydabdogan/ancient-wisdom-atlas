canonical_text:
  quote: ''
  summary: Mithra, called lord of nations and wide pastures, drives beside the wide
    round earth. Sraosha drives at his right hand, Rashnu at his left, and waters,
    plants, and the Fravashis of the faithful surround him. In might he brings falcon-feathered
    arrows, comes to nations hostile to Mithra, strikes horse and rider with his club,
    and casts fear on them. The speaker offers sacrifice for Mithra's brightness and
    glory.
