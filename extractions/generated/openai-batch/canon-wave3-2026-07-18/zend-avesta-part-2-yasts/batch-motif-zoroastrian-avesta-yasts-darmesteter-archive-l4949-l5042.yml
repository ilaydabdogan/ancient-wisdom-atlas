canonical_text:
  quote: ''
  summary: The passage gives sacrificial invocations connected with Mithra, the friendship
    of the moon and sun, and the undying, shining, swift-horsed Sun. It then introduces
    the Moon Yasht, explaining recitation days and the connection of Bahman, the Moon,
    and Gos through the seed of the bull, before opening with a Mazda-worshipper's
    confession and invocations to Havani and the Moon.
  language: English
  quote_policy: summarized
