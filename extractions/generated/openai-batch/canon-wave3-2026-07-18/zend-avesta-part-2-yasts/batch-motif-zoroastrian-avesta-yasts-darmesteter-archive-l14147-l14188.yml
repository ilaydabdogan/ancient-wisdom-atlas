  quote: ''
  summary: The passage introduces Ashi Vanguhi, the good Ashi, as a feminine personification
    of piety and as a source of goods, riches, fortune, and wealth. It notes her association
    with Pare;;di, outlines later episodes involving Zarathujtra and named worshippers,
    and says she rejects certain sterile offerers. The opening hymn sacrifices to
    Ashi and describes her attributes, chariot, and kinship with Ahura Mazda and the
    Amesha-Spe;^tas.
