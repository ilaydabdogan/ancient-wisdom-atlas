canonical_text:
  quote: ''
  summary: The passage instructs Mazda-worshippers to sacrifice to Mithra with livestock,
    birds, Haoma offerings, and cleanly prepared libations. Zarathustra asks Ahura
    Mazda how the faithful man should drink and offer the libations so that Mithra
    will be pleased. Ahura Mazda answers with requirements of bodily washing, numbered
    strokes, sacrifice and prayer to Mithra, and knowledge of a liturgical formula.
    A translator's footnote interprets the strokes as expiation and compares them
    with painful trials before Mithriac initiation.
  language: English
  quote_policy: summarized
