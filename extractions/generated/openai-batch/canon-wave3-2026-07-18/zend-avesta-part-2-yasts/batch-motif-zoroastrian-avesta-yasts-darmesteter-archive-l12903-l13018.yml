canonical_text:
  quote: ''
  summary: In Bahram Yasht XVII, Verethraghna is invoked as a deity made by Ahura
    who moves with armies alongside Mithra and Rashnu, asking who violates truth and
    oath. Ahura Mazda tells Zarathushtra that proper sacrifice and prayer to Verethraghna
    protect the Aryan countries from hostile forces and disease, then specifies offerings
    and excluded participants. If forbidden persons take the offerings, Verethraghna
    withdraws healing virtues and calamities fall on the Aryan nations. Verethraghna
    then denounces Daevas and their worshippers for bloodshed and improper ritual
    acts involving fire, after which they fail in their violence and are confounded.
  language: English
  quote_policy: summarized
