  summary: The passage says Ardvi Sura Anahita grants a boon to a supplicant who is
    offering libations, gifts, and sacrifice. A speech commands Spitama Zarathustra
    to offer sacrifice to Anahita's spring. Haoshyangha the Paradhata offers a large
    animal sacrifice at the enclosure of Hara and asks Anahita for sovereignty over
    all countries, Daevas, and men. Translator notes identify Haoshyangha with later
    Iranian royal tradition and identify Hara/Alborz as an earth-surrounding mountain,
    while marking one location term as doubtful.
