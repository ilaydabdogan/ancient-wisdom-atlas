  summary: Zarathustra is instructed to offer sacrifice to Ardvi Sura Anahita, described
    as a spring with a thousand cells and a thousand channels. Each channel is vast
    and contains a shining, columned palace with balconies and a scented bed. Ardvi
    Sura Anahita is also described as running down from a great height, possessing
    Glory like all the waters flowing on earth.
