canonical_text:
  quote: ''
  summary: Ahura Mazda lists a sequence of his names from the fourth through the twentieth,
    including holiness, understanding, knowledge, weal, lordship, beneficence, invulnerability,
    true accounting, all-seeing, healing, creator, and Mazda. He instructs Zarathustra
    to worship him day and night with libations, promises that Ahura Mazda, Sraosha,
    the waters, the plants, and the Fravashis of the holy will come for help and joy,
    and tells Zarathustra to recite these names every day and night to destroy the
    malice of hostile beings, human enemies, wolves, and armed hordes.
  language: English
  quote_policy: summarized
