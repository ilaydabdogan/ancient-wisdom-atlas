canonical_text:
  quote: ''
  summary: 'Stanzas 24-28 invoke and bless holy, strong Rashnu in several possible
    cosmic locations: on the highest Hukairya, on the Taera of high Haraiti, in the
    star Vana, in the star Tishtrya, and in the Haptoiringa star group. The passage
    describes Hukairya as having deep golden precipices from which the river Ardvi
    Sura Anahita leaps from a great height, and Taera as a place around which the
    stars, moon, and sun revolve. Each stanza invokes Rashnu’s friendship toward a
    prepared var.'
