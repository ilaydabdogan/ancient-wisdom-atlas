canonical_text:
  quote: ''
  summary: 'A first-person speaker, identified in a translator note as Vayu, declares
    many names and powers to holy Zarathustra: overtaking and smiting creatures in
    both worlds, working the good of Ahura Mazda and the Amesha-Spentas, destroying
    malice, acting against Daevas, bearing spear-related and glory-related names,
    and instructing Zarathustra to invoke these names amid battle and national strife.'
  language: English
  quote_policy: summarized
