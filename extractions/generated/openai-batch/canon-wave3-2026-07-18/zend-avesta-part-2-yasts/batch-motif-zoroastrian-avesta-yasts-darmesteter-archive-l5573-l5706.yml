canonical_text:
  quote: ''
  summary: Tistrya calls for worship and offerings, descends to the sea Vouru-Kasha
    as a white horse, and is met by the Daeva Apaosha as a black horse. After an initial
    defeat, Tistrya laments that he has not received named sacrifices. Ahura Mazda
    offers such a sacrifice and gives him the strength of ten horses, camels, bulls,
    mountains, and rivers. Tistrya returns, defeats Apaosha, announces the release
    of waters to fields and the material world, makes the sea boil and flow, and rises
    with Satavaesa as vapours rise above Mount Us-hindu in the middle of the sea.
  language: English
  quote_policy: summarized
