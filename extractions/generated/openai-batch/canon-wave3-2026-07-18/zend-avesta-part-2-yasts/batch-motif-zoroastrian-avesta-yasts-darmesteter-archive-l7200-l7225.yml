  summary: The passage describes a dwelling on Hara Berezaiti/Haraiti Bareza, a bright
    mountain around which many stars revolve and where hostile conditions and Daeva-made
    uncleanness do not come. The Amesha-Spe^ittas, in accord with the sun, made the
    dwelling for Mithra, who surveys the material world from it. When a wicked worker
    of evil rushes forth, Mithra yokes his horses to his chariot together with Sraosha
    and Nairyo-sangha, who smites hostile forces.
