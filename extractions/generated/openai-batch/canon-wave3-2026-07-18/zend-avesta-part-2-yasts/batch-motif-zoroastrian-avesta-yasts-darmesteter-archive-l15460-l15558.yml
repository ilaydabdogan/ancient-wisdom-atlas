  quote: that Glory that cannot be forcibly seized
  summary: The passage moves from Keresaspa killing an unnamed opponent to a ZamYad
    Yast section in which the Good Spirit and the Evil One struggle over an awful
    Glory made by Mazda. Both sides cast darts. Atar and Azi Dahaka each attempt to
    seize the Glory, but each withdraws after being threatened by the other. The Glory
    then swells and goes to the sea. Translator notes compare figures and episodes
    with Greek and later Iranian materials.
