canonical_text:
  quote: ''
  summary: Ahura Mazda tells Spitama Zarathushtra that the bright star Ti^trya is
    worthy of sacrifice and prayer and was created to oppose the Pairika Du^yairya.
    Ti^trya restrains that hostile being, and proper sacrifice and invocation protect
    the Aryan countries from enemies and diseases. Ahura Mazda gives instructions
    for libations, baresma, and a cattle offering, warns that excluded persons must
    not partake, and says Ti^trya withdraws healing virtues if they do. The passage
    closes with blessing formulas for Ti^trya and Satavaesa, and then begins an introductory
    note identifying Gos as the cow and as a personification protecting the animal
    kingdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ti^tryya is addressed as a bright and glorious star who is healthful, wise,
    happy, powerful, lord of a thousand boons, and giver of boons to a person who
    pleases him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda says he created Ti^trya as worthy of sacrifice, prayer, propitiation,
    and glorification as himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ti^trya is created to withstand, break asunder, afflict, and drive back the
    malice of the Pairika Du^yairya, whom evil-speaking people call Huyairya.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Without Ti^trya, the Pairika Du^yairya would wage war all day and all night
    against Ahura Mazda's material world, wanting to extinguish its life; Ti^trya
    keeps her in inescapable bonds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the Aryan countries perform due sacrifice and invocation for Ti^trya, hostile
    hordes, plague, leprosy, venomous plants, an enemy chariot, and an enemy spear
    are said not to enter them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ahura Mazda instructs the Aryan nations to bring libations, tie bundles of
    baresma, and cook a head of cattle of one uniform color for Ti^trya.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Specified excluded persons are not to take from the offerings; if they do,
    Ti^trya takes back his healing virtues and plagues and hostile hordes fall upon
    the Aryan nations.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The closing blessing names Ti^trya and Satavaesa, made by Mazda, who pushes
    waters forward.
  category: speech
  evidence_refs:
  - ev:7
