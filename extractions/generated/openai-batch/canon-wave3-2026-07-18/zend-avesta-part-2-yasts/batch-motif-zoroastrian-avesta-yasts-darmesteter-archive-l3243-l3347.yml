canonical_text:
  quote: ''
  summary: The passage introduces the Aban Yasht and Ardvi Sura Anahita, including
    a prefatory note on her worship, statues, and Greek-source cautions. The liturgical
    text confesses Mazda-worship and directs propitiation to the Waters, Ardvi Anahita,
    all waters, and plants. Ahura Mazda tells Spitama Zarathustra to offer sacrifice
    to Ardvi Sura Anahita, described as a holy, health-giving spring and large river
    that increases life, herds, folds, wealth, and country; purifies male seed and
    female wombs; enables safe birth; gives milk; and runs from the height Hukairya
    to the sea Vouru-Kasha.
  language: English
  quote_policy: summarized
