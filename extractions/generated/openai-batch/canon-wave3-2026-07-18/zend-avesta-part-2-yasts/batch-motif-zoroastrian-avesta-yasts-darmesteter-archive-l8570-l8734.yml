canonical_text:
  quote: ''
  summary: Introductory and opening liturgical sections of the Srosh Yast Hadhokht
    identify Sraosha as a holy, fiend-smiting divine figure and prescribe sacrifice,
    prayer, confession, and sacred words that protect Mazda-worshippers from fiends,
    Daevas, hostile opponents, dangerous crossings, darkness, and the evil eye.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies two Yasts dedicated to Sraosha and states that the
    Srosh Yast Hadhokht is recited every day during any gah except the Rapithwin.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The liturgical speaker confesses as a worshipper of Mazda, follower of Zarathustra,
    hater of the Daevas, and observer of Ahura's laws.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sraosha is invoked with sacrifice, prayer, propitiation, and glorification
    and is described as holy, strong, the incarnate Word, mighty-speared, lordly,
    tall-formed, fiend-smiting, and world-increasing.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Good prayer is said to remove the friendship of fiends, disorient their faculties
    and limbs, and turn away the Druj.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sraosha is called the best protector of the poor and a smiter of the Druj;
    words of blessing, the Mathra Spenta, the Ahuna Vairya, and the word of truth
    are also described as effective against fiends or the unseen Druj.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man or woman who pronounces the prescribed word with mind, words, and deeds
    intent on holiness is described as doing so amid fears involving high waters,
    rainy-night darkness, river fords, branching roads, gatherings of the faithful,
    or rushes of Daeva-worshippers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that during that day or night the tormenting fiend cannot
    cast the look of its evil eye on the reciter, and the malice of a cattle-thief
    cannot reach the reciter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Zarathustra is told to pronounce the word when encountering idolaters, thieves,
    and rushing Daevas, after which the malice of Daeva-worshippers, Yatus, Pairikas,
