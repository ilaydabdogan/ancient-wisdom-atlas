  claim: The Erekhsha arrow-shot in the passage is linked by the translator's note
    to a later Iranian Aris/Arii tradition in which a mountain-shot arrow determines
    the boundary between Iran and Turan.
  claim_level: same_motif
  target: Later Iranian Aris/Arii boundary-arrow tradition cited from Mirkhond and
    compared with Tabari in the note
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is supplied in the note rather than developed in the
    Avesta verse; geographical identifications are stated tentatively.
- id: claim:2
  claim: The passage's invocation of Haptoiringa against Yatus and Pairikas aligns
    functionally with the note's cited Pahlavi tradition in which Haptoiringa keeps
    back many demons, demonesses, fairies, and sorcerers opposed to the celestial
    sphere.
  claim_level: same_function
  target: Minokhired XLIX, 15 as cited in the Haptoiringa note
  evidence_refs:
  - ev:7
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The note gives a broader demon-warding role than the passage's brief
    sacrificial formula; the claim is functional rather than a full narrative identity.
- id: claim:3
  claim: The passage's worm-stars are cautiously associated by the note with shooting
