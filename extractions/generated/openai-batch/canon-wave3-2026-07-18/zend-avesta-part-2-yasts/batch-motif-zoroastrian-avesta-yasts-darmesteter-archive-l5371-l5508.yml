canonical_text:
  quote: ''
  summary: The passage praises Tishtrya and related stars. It recalls Erekhsha, the
    swift archer, whose arrow crossed from one mountain to another with help from
    Ahura Mazda, waters, plants, and Mithra. Tishtrya is invoked as a bright star
    who troubles the Pairikas, enters the sea Vouru-Kasha in horse form, makes waters
    boil and winds move, and is connected with rains and fertility. Satavaesa directs
    waters to the seven Karshvares. Tishtrya tells Ahura Mazda that if humans worship
    him by name he will come to the faithful at the appointed time. The passage also
    invokes stars, rains, Haptoiringa, Yanan, strength, victory, and protection against
    Yatus and Pairikas.
  language: English
  quote_policy: summarized
