canonical_text:
  quote: ''
  summary: Various groups petition Ardvi Sura Anahita for martial, priestly, marital,
    and childbirth-related benefits, and the passage says she will grant them as far
    as it lies in her power. Anahita then descends from the stars to the earth made
    by Mazda and speaks to Zarathustra, saying that Ahura Mazda established Zarathustra
    as master of the material world and established her to keep the holy creation.
    She says her brightness and glory sustain flocks, herds, and humans, and Zarathustra
    asks what sacrifice should be used to worship and forward her so that Mazda may
    make her run down to the earth.
  language: English
  quote_policy: summarized
