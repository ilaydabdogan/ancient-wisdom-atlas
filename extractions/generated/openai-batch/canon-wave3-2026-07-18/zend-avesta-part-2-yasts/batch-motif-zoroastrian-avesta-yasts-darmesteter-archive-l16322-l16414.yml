canonical_text:
  quote: ''
  summary: In a question-and-answer passage, Ahura Mazda says that on the second and
    third nights the faithful person's soul stays near the head, sings the Uštavaiti
    Gatha, proclaims happiness, and tastes great pleasure. At dawn after the third
    night, the soul seems to be amid plants and scents and to inhale a sweet wind
    from the south. The soul's own conscience advances in that wind in the form of
    a beautiful maiden, identifies herself, and recalls the person's good thoughts,
    words, deeds, religion, worship of the good waters and Atar, and welcome of faithful
    people.
  language: English
  quote_policy: summarized
