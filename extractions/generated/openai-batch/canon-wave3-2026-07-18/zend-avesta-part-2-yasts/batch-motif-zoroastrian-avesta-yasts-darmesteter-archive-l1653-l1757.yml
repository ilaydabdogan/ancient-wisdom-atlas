canonical_text:
  quote: ''
  summary: An invocation offers sacrifice, prayer, propitiation, and glorification
    to holy period-beings and to Ahura Mazda. Zarathustra asks Ahura Mazda which Holy
    Word is strongest, most victorious, most effective, fiend-smiting, healing, and
    able to free the material world from anxiety. Ahura Mazda answers that the divine
    Name associated with the Amesha-Spentas is the strongest part of the Holy Word
    and begins revealing several of his names.
  language: English
  quote_policy: summarized
