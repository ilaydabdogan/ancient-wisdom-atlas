  summary: The passage depicts a cow driven astray invoking Mithra for help, asking
    the bull-like lord of wide pastures to bring the cattle back to the stables and
    the right way from the den of the Druj. It says Mithra helps those with whom he
    is satisfied and crushes the domains of those with whom he is offended. The speaker
    then states an intention to offer Mithra a sacrifice for his brightness and glory.
