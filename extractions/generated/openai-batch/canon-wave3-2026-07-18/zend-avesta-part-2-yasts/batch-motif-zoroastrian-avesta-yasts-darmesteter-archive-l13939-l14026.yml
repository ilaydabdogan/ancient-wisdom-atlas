canonical_text:
  quote: ''
  summary: The passage praises a swift, holy power, then presents Zarathustra sacrificing
    to the most right Arista, made by Mazda and holy. He summons her from the Abode,
    asks for friendly passage over roads, mountains, forests, and rivers, and offers
    ritual materials and words. In repeated sections he sacrifices for righteousness
    of thought, speech, and deed, requesting bodily strength, speed, hearing, health,
    and extraordinary eyesight modeled first on the Kara fish in the deep Rangha and
    then on a male horse able to perceive a horse hair in darkness and bad weather
    from nine districts away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment describes a holy, clever, renowned, swift power or object
    that runs quickly to the goal, frees one from dangers, brings libations, works
    quickly, cleanses well, and is associated with the good Law of the worshippers
    of Mazda.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zarathustra sacrifices and addresses Arista, asking her to rise from her seat
    and come forward from the Abode; if she is before him she should stay, and if
    behind him she should overtake him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prayer asks that all things be friendly, that the speakers travel smoothly
    on roads, find good mountain pathways, run easily through forests, and cross rivers
    happily.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A sacrifice is promised to Arista for her brightness and glory, using libations,
    Haoma and meat, baresma, wisdom of the tongue, holy spells, words and deeds, and
    well-spoken words.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The worshippers sacrifice to the most right Arista, made by Mazda and holy,
    and to the good Law of the worshippers of Mazda.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Zarathustra sacrifices for righteousness of thought, speech, and deed, and
    for a boon from Arista.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: One requested boon includes swift feet, quick hearing, strong arms, health
    and sturdiness of the whole body, and the eyesight of the Kara fish.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Kara fish is described as living beneath the waters and able to measure
    a ripple no thicker than a hair in the Rangha, whose ends are far away and whose
    depth is a thousand times the height of a man.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: A repeated requested boon includes swift feet, quick hearing, strong arms,
    health and sturdiness of the whole body, and the eyesight of the male horse.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The male horse is described as perceiving, at night and through rain, snow,
    hail, or sleet, a horse hair mingled with earth from as far as nine districts,
    and as knowing whether the hair came from the head or tail.
  category: attribute
  evidence_refs:
  - ev:10
