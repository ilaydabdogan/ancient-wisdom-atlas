  quote: ''
  summary: A first-person speaker says that Zarathustra alone can reach and daunt
    the speaker, smiting with the Ahuna Vairya and burning with Asha-Vahishta. Ashi
    Vanguhi invites Zarathustra to lean against her chariot, caresses and blesses
    him, and is then praised in a sacrificial stanza. Haoshyangha the Paradhata sacrifices
    to her on the enclosure of Hara, a beautiful height made by Mazda, and begins
    asking a boon.
