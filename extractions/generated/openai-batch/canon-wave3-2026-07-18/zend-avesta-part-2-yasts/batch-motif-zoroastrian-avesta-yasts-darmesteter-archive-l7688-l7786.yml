canonical_text:
  quote: ''
  summary: Mithra is invoked as lord of wide pastures, sleepless and awake. Haoma
    offers sacrifice to Mithra on Haraiti Bareza with undefiled ritual elements, is
    established by Ahura Mazda as a priest, and is associated with a star-inlaid heavenly
    mortar and prayer. Mithra is praised as having many ears and eyes, and a human
    sacrificer is blessed when offering with holy ritual implements. Ahura Mazda and
    the Amesha-Spentas confess the religion, and the passage petitions Mithra for
    protection in both material and spiritual worlds from fiends and for strength,
    speed, and victory over enemies.
  language: English
  quote_policy: summarized
