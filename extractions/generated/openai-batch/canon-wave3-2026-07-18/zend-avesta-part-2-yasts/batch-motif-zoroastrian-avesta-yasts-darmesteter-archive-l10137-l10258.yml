canonical_text:
  quote: ''
  summary: The passage worships the good, strong, beneficent Fravashis of the faithful.
    During the Hamaspathmaedha they come and go through the borough for ten nights,
    asking who will praise, sacrifice to, remember, bless, and receive them with meat,
    clothes, and a prayer. A man who offers them such sacrifice receives their blessing
    for household abundance, livestock, people, horse, chariot, and a ritual leader.
    The passage then credits the Fravashis with showing paths to formerly unmoving
    waters, growth to formerly ungrowing plants, and paths to the stars, moon, sun,
    and endless lights, which had been kept from moving by the Daevas; the waters,
    plants, and lights now follow divinely appointed paths at the wish of Ahura Mazda
    and the Amesha-Spentas until the restoration of the world.
  language: English
  quote_policy: summarized
