  summary: The passage praises Rashnu as a holy and strong figure associated with
    justice, the punishment of thieves and bandits, and the watching and accounting
    of human deeds. It then repeats invocations and blessings of Rashnu in several
    named Karshvares, asking for his friendship toward a prepared ritual item or object
    called “var,” wherever he may be in the world.
