canonical_text:
  quote: ''
  summary: The passage invokes propitiation and sacrifice to the Bull, hails Ahura
    Mazda, the Amesha-Spentas, and the Moon, and describes the Moon as keeping the
    seed of the Bull. It explains the moon’s waxing and waning as equal fifteen-day
    periods, attributes the making of this cycle to Ahura, and sacrifices to the Moon.
    The Amesha-Spentas hold and pour the Moon’s glory upon the earth; warmer moonlight
    is linked with golden-hued spring plants. Notes report Pahlavi and Parsi interpretations
    of the lunar cycle as an exchange between earth and heaven and as part of a struggle
    involving stars, planets, and Ahrimanian forces.
  language: English
  quote_policy: summarized
