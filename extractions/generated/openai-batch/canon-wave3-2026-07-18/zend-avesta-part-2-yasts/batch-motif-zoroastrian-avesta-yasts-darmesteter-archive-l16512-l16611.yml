canonical_text:
  quote: ''
  summary: Zarathushtra asks Ahura Mazda where he should turn and to whom he should
    pray. Ahura Mazda describes the soul on the third night near the skull, singing
    the Kima Gatha and experiencing extreme suffering. At dawn the soul is associated
    with snow, stench, and a foul north wind. The wicked soul inhales this wind, then
    advances by steps into Evil-Thought Hell, Evil-Word Hell, Evil-Deed Hell, and
    Endless Darkness. A previously departed wicked being addresses the newly arrived
    wicked soul. An editorial note compares the sequence with Arda Viraf and Minokhired
    accounts in which the wicked soul meets a hideous woman identified as his own
    bad actions or conscience.
  language: English
  quote_policy: summarized
