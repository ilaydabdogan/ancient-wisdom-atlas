canonical_text:
  quote: ''
  summary: The passage invokes sacrifice to Tii^trya, the bright and glorious star,
    established by Ahura Mazda as lord and overseer above the stars and protected
    from death by hostile powers. Tii^trya is described as beneficent among the stars
    bearing the seed of the waters, moving from the sea Vouru-Kasha to lakes, caves,
    and channels in the form of a white horse with golden features. Waters flow from
    Vouru-Kasha as mother-like, friendly, and healing, and Tii^trya distributes them
    among countries when worshipped and propitiated. The passage also says that creatures
    of Spenta Mainyu in many habitats long for him.
  language: English
  quote_policy: summarized
