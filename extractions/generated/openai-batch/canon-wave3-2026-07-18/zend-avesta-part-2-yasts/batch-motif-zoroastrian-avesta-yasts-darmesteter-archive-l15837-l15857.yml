  quote: ''
  summary: In section XIII, verses 78-79, the speakers sacrifice to the awful kingly
    Glory made by Mazda. That Glory is said to cleave to holy Zarathu^tra, so that
    he thinks according to the Law and is fragmentarily described as speaking according
    to it. Included notes mention textual uncertainty and identify Keresavazda with
    Karsivaz in Firdausi.
