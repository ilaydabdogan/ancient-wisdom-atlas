  quote: ''
  summary: The passage first presents speech about a person with little friendship
    for the Law being placed or thrown down below to suffer, with Angra Mainyu naming
    an unbeliever, liar, or traitor and comparing such a person to a mad dog that
    wounds cattle and men. It then states that wounding a faithful man is to be paid
    for as wilful murder. A following blessing addresses the holy young king Vii-taspa/Vi-ftaspa,
    wishing him an imperishable, abundant house and boons from the Amesha-Spe/ztas,
    including brightness, glory, plenty, swift horses, and good sons.
