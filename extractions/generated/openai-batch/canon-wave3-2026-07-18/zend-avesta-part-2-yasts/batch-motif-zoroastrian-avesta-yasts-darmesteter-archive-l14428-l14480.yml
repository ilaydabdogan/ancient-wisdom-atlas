  summary: A petitioner identified as Haoshyangha asks Ashi Vanguhi for power over
    the Daevas of Mazana and obtains the boon when Ashi comes to his side. The hymn
    then praises and sacrifices to Ashi. Yima Khshaeta, called the good shepherd,
    sacrifices to Ashi from the height Hukairya and asks to bring abundance and immortality
    to Mazda's world and to remove hunger, thirst, old age, death, and harmful winds
    for a thousand years; he also obtains the boon.
