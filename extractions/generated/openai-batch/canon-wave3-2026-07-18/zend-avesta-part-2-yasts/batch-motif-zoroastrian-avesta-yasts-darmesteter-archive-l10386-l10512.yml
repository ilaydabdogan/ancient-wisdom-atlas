canonical_text:
  quote: They come in as a weapon and as a shield
  summary: The passage praises and worships the Fravashis of the faithful as protective,
    powerful beings. They guard a person from demonic threats and weapons, request
    praise and offerings, are worshipped along with souls, faculties, waters, plants,
    and divine beings, and are said to have stood firm during the creation conflict
    so that Angra Mainyu's malice did not stop waters from flowing or plants from
    growing.
  language: English
