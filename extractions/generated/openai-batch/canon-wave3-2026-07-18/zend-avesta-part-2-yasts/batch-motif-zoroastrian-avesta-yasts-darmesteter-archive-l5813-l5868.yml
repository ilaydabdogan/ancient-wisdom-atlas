canonical_text:
  quote: ''
  summary: The passage praises and sacrifices to Ti^trya, the bright and glorious
    star. Ti^trya opposes the Pairikas sent by Angra Mainyus to stop stars containing
    the seed of waters, drives them away from the sea Vouru-Kasha, and enables winds,
    clouds, fertility waters, and showers to spread over the seven Karshvares. The
    waters are portrayed as longing for Ti^trya to rise so that springs may overflow
    toward beautiful places and fields. An opening fragment mentions a light chariot
    and a mountain on shining waters.
  language: English
  quote_policy: summarized
