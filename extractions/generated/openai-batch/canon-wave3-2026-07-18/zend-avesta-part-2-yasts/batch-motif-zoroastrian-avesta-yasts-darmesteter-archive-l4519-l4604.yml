canonical_text:
  quote: ''
  summary: Two adjacent episodes describe sacrifice to Ardvi Sura Anahita. Zarathushtra
    sacrifices by the river Daitya and asks that Kavi Vishtaspa be brought to think,
    speak, and act according to the law; Anahita grants the boon. Kavi Vishtaspa later
    sacrifices behind Lake Frazdanava with large animal offerings and asks to overcome
    three named opponents in battle; Anahita grants that boon.
  language: English
