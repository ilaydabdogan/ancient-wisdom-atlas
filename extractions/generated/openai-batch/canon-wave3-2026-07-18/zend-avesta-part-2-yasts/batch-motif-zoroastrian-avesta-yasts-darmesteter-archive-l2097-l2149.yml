canonical_text:
  quote: ''
  summary: The passage worships holy beings, recites and blesses prayer and sacrifice
    to Ahura Mazda, addresses Zarathustra with an instruction to protect a friendly
    worshipper from an unfriendly foe, names several divine creations of Ahura Mazda,
    identifies Haurvatat and Ameretat as the reward of holy ones freed from their
    bodies, and states that Zarathustra knows from Ahura Mazda's understanding and
    knowledge how the world began and how it will end.
  language: English
  quote_policy: summarized
