canonical_text:
  quote: ''
  summary: The passage invokes Mithra as a deity who can bring both peace and trouble,
    prosperity to properly sacrificing households, and boons such as riches, strength,
    victory, good conscience, wisdom, and holy conversation. It asks Mithra to accept
    libations and help worshippers smite foes. It then describes Mithra as sleepless,
    all-knowing, victory-making, and battle-governing, breaking enemy lines, terrifying
    armies, punishing those who lie to him, causing their weapons to miss, and routing
    them with Rashnu and Sraosha toward two world-maintaining Yazatas.
  language: English
  quote_policy: summarized
