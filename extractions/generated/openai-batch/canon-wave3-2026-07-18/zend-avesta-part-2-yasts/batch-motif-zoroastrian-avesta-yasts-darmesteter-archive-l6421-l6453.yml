  summary: The passage describes the holy Zarathu^tra offering sacrifice to Drvaspa
    in Airyana Vae^ah by the river Daitya. He asks Drvaspa to grant that Hutaosa^
    think, speak, and act according to the law, spread his Mazdean law, and praise
    his deeds. Drvaspa grants the boon. The passage also includes a fragment about
    yoking teams of horses for the faithful and editorial notes linking the section
    to other Yasht passages and identifying Hutaosa as the wife of king ViJtaspa.
