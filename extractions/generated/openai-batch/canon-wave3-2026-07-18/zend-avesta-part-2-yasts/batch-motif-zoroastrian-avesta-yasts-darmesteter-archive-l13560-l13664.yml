canonical_text:
  quote: ''
  summary: A Ram Yast passage presents Vayu as a holy, bright, glorious power who
    receives sacrifice and grants boons. A fragmentary martial boon involves king
    Husravah and Aryans in the Forest. Hutaosa offers Vayu a ritual sacrifice and
    asks to be loved and well received in king ViJtaspa's house; Vayu grants it. Unmarried
    maids offer a similar sacrifice and ask for husbands and offspring; Vayu grants
    it. The passage then invokes Vayu of the Good Spirit, who tells Zarathujrtra that
    his name is Vayu because he goes through the two worlds.
  language: English
  quote_policy: summarized
