canonical_text:
  quote: ''
  summary: Editorial introduction and opening liturgical sections of the Mihir/Mithra
    Yast. Mithra is described as a deity of heavenly light who sees everything, witnesses
    truth, preserves oaths and contracts, punishes falsehood, and receives sacrifice
    and prayer. Ahura Mazda tells Spitama Zarathushtra that he created Mithra as worthy
    of sacrifice and prayer. The passage warns against lying to Mithra and asks Mithra
    for aid, mercy, health, and victory.
  language: English
