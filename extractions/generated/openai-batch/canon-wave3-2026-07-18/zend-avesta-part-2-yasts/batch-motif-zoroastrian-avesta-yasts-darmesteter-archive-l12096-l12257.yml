canonical_text:
  quote: ''
  summary: The passage invokes and worships the Fravashis of the faithful, holy men
    and women, next-of-kin, and men of the primitive law. It praises Zarathustra,
    worships earth, heavens, worthy things between them, and souls of animals and
    holy people. It asks the Fravashis to enter the house satisfied, bless it with
    Ashi Vanguhi, carry hymns and worship to Ahura Mazda and the Amesha-Spentas, and
    not depart complaining. The following Bahram Yasht introduction summarizes ten
    forms in which Verethraghna appeared to Zarathustra.
  language: English
  quote_policy: summarized
