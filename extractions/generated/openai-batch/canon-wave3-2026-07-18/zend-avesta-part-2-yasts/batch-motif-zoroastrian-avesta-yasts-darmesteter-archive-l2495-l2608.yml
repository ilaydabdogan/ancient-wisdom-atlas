canonical_text:
  quote: ''
  summary: A liturgical passage asks who has every Druj destroyed in his house when
    he pronounces certain words. The answer describes a man who takes the seven Amesha-Spentas
    as a shield, worships the Mazda-worshippers' Law and Mazda-made horse-shaped waters,
    renounces faults, defeats the destroyer of Vohu-Mano, and recovers the Law of
    Mazda from the ungodly. The passage then blesses sacrifice and prayer to Ahura
    Mazda, the Amesha-Spentas, and other divine beings, and petitions for bodily health,
    strength, wealth, offspring, long life, and the blissful abode of the holy Ones.
  language: English
  quote_policy: summarized
