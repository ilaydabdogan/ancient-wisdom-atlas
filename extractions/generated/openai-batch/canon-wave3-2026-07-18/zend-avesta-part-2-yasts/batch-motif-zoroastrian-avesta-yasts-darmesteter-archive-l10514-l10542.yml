  summary: The passage worships the good, strong, beneficent Fravashis of the Amesha-Spentas.
    These seven are described as unified in thought, speech, and deed, sharing Ahura
    Mazda as father and commander. They perceive one another's souls as thinking good
    thoughts, words, deeds, and Garo-nmana, and their ways shine as they go down toward
    libations.
