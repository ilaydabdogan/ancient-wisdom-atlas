canonical_text:
  quote: ''
  summary: The passage repeatedly invokes Drvaspa as a powerful holy being who keeps
    flocks healthy and assists the faithful. Thraetaona sacrifices to her and asks
    to overcome Azhi Dahaka and deliver his two wives; Drvaspa grants the boon. Haoma
    sacrifices to her on the highest height of Haraiti Bareza and asks to bind Franghrasyan
    and bring him to Husravah for vengeance; Drvaspa grants the boon. Husravah sacrifices
    behind the salt-water lake and asks to kill Franghrasyan in vengeance for Syavarshana
    and Aghraeratha; Drvaspa grants the boon.
  language: English
  quote_policy: summarized
