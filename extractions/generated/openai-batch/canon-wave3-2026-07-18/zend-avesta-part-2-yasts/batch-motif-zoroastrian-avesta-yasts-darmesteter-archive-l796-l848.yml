canonical_text:
  quote: ''
  summary: 'The passage gives a sequence of liturgical invocations at named gahs:
    Uziren, Aiwisruthrem, and Ushahin. It invokes Apam Napat and Mazda-made water;
    the Fravashis, reproductive females or flocks, the prosperity of seasons, Strength,
    Verethraghna, and the Ascendant; then Sraosha, Rashnu, and Arsidit. A following
    section, Dai pa Adar, invokes Ahura Mazda and the Amesha-Spentas. Notes gloss
    Apam Napat as Son or Navel of the Waters, connect him with lightning-fire born
    in clouds, and compare him to Vedic Apam napat.'
  language: English
  quote_policy: summarized
