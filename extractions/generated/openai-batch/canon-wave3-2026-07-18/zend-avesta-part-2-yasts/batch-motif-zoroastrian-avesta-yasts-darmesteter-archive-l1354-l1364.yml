  quote: ''
  summary: 'The passage repeatedly offers sacrifice to named and collective stars:
    Ti^-trya, Satavaesa, stars bearing seeds of waters, earth, and plants, the Star
    Vana/^^*, and the seven Hapt6iri//gas. Several are described as made by Mazda,
    and the seven stars are called glorious and healing. The stated purpose is to
    oppose the Yatus and Pairikas.'
