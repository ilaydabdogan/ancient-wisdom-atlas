canonical_text:
  quote: ''
  summary: In the opening of the Rashn Yasht, Zarathustra asks Ahura Mazda to answer
    truthfully about the qualities of the Holy Word. Ahura Mazda declares that the
    most glorious Holy Word itself is true, progress-making, discerning, healthful,
    wise, happy, and powerful to destroy. He then gives ritual instructions involving
    a three-twigged baresma, a prepared var, fire, boiling milk, oil, and plant sap,
    and says that he and Rashnu will come for help when invoked. Rashnu is addressed
    with epithets of truth, knowledge, discernment, foresight, and far-sight.
  language: English
  quote_policy: summarized
