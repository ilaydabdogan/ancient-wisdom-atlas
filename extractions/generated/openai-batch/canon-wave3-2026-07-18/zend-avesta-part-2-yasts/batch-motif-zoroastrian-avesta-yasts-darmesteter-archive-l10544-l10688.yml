canonical_text:
  quote: ''
  summary: The passage worships the beneficent Fravashis of named divine beings and
    elements, then praises the Fravashi and piety of Gaya Maretan and Zarathustra.
    Gaya Maretan is described as first receiving Ahura Mazda's thought and teaching,
    and as the source from whom Ahura formed the Aryan nations. Zarathustra is described
    as first in good thought, speech, and action; first priest, warrior, plougher,
    knower, teacher, and bearer of the Law; as one who defeats or nullifies the Daevas
    through the Word and the law of Ahura; and as one whose birth causes waters, plants,
    and creatures to rejoice and anticipates sacrifice and the spreading of the good
    Law through the seven Karshvares.
  language: English
  quote_policy: summarized
