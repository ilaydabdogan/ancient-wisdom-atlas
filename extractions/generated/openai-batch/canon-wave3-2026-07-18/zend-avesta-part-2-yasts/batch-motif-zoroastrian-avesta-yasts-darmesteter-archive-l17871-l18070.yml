canonical_text:
  quote: ''
  summary: The passage introduces the Nyayis as begging prayers addressed to the Sun,
    Mithra, Moon, Waters, and Fire, with rules for their recitation. It then gives
    the opening portions of the Khorshed Nyayish, a prayer to the Sun, including hails,
    ethical declarations, offerings of sacrifice and prayer, and a litany of sacrifices
    to divine, astral, cosmic, and spiritual beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Nyayi is described as a begging prayer, especially applied to five prayers
    addressed to the Sun, Mithra, the Moon, Waters, and Fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Every layman over eight years old is said to be bound to recite the Nyayij
    while standing and girded with the Kosti.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun Nyayij is prescribed three times daily, and the Mithra Nyayij is recited
    with it because Mithra follows the sun in its course.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Moon Nyayij is prescribed three times monthly, and the Waters and Fire
    Nyayij are prescribed daily when one is near those elements.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Fire Nyayij is said to be recited with the Penom on.
  category: action
  evidence_refs:
  - ev:3
