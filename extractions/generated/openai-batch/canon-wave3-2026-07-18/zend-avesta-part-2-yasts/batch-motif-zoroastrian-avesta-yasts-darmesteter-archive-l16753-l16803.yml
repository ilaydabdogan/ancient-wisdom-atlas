canonical_text:
  quote: ''
  summary: The passage summarizes a tradition in which God teaches the Zendavasta
    to Zartusht and sends him to Shah Gushtasp to read the book and convey divine
    counsel. Zartusht obeys, blesses the king, reads the Zandavasta, and exhorts him
    to follow its statutes, promising heavenly paradise for obedience and warning
    of divine displeasure, loss of prosperity, humiliation, and hell for refusal.
    Editorial notes connect these lines with Yasts XXIII-XXIV and compare Yast XXIV
    with Vendidad XIX.
