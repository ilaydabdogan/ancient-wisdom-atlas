candidate_motifs:
- id: motif:1
  label: Divine fire as child of the supreme maker
  taxonomy_refs:
  - divine_parent_child
  basis: Atar is explicitly called the son of Ahura Mazda and is addressed as a divine
    fire-power.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage gives an epithet and invocation, not a narrative of birth
    or upbringing.
- id: motif:2
  label: Sacred fire as glory, healing, and royal power
  taxonomy_refs:
  - royal_legitimacy
  basis: Atar is described as a source of Glory and healing, is linked with Kavi glory
    and king Husravah, and Nairyo-Sangha is said to dwell in kings.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: Royal legitimacy is inferred from clustered royal imagery and translator
    notes; the passage itself remains a litany rather than a coronation narrative.
- id: motif:3
  label: Fire established on sacred mountains
  taxonomy_refs: []
  basis: The passage invokes Mount Asnava and Mount Raevant with Atar, and notes say
    royal figures established named fires on these mountains.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The mountain-fire details rely partly on translator notes included in
    the supplied passage.
- id: motif:4
  label: Sacred waters and plant life under Mazda's making
  taxonomy_refs: []
  basis: The passage invokes good Waters, Ardvi Anahita, all waters made by Mazda,
    and all plants made by Mazda.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not narrate a water myth; it lists sacred recipients
    of invocation.
- id: motif:5
  label: Celestial preservation and distribution of life-seeds
  taxonomy_refs:
  - sacred_birth
  basis: The Moon keeps the seed of the Bull, and stars contain seeds of waters, earth,
    and plants; a note links the Bull's seed with later species.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The birth or creation sequence is only summarized in notes and alluded
    to in the litany.
- id: motif:6
  label: Truthful word as world-increasing force
  taxonomy_refs:
  - wisdom
  basis: Sraosha is called the incarnate Word, and true-spoken speech is said to make
    the world grow.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The available taxonomy has no exact creative-word category; 'wisdom' is
    only an approximate family.
- id: motif:7
  label: Destructive wind with beneficent affiliation
  taxonomy_refs:
  - duality
  basis: Vayu is described as more destructive than all other creatures, while the
    invocation specifies the part of Vayu belonging to Spenta-Mainyu.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: Only one affiliated part is named in this passage; a full dual-aspect
    doctrine is not developed here.
