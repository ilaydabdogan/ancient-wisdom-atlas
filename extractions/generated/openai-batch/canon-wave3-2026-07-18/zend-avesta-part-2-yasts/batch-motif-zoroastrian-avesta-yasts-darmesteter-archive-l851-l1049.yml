canonical_text:
  quote: ''
  summary: A Sirozah I litany addresses a sequence of Zoroastrian divinities, sacred
    powers, celestial bodies, waters, plants, fires, royal glories, mountains, animals,
    speech, sky, and time. The section especially emphasizes Atar as son of Ahura
    Mazda and source of glory and healing; waters and Ardvi Anahita; the Sun, Moon,
    Bull, Cow, and stars as seed-bearing cosmic powers; and later invocations to Mithra,
    Sraosha, Rashnu, Fravashis, Verethraghna, Vayu, Sky, and Time.
  language: English
  quote_policy: summarized
