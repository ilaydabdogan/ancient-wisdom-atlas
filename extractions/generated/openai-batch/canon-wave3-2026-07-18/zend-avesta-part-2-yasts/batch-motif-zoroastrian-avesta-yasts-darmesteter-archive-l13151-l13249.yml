canonical_text:
  quote: ''
  summary: The passage introduces the Ram Yast as devoted to Rama Hvastra and Vayu,
    then presents liturgical invocations and offerings to Vayu. It includes sacrifice
    to the Waters, Peace, and Weal; invocation of Vayu for a household and worshipper;
    and a scene in which Ahura Mazda sacrifices to Vayu in Airyana Vaejah, asks for
    power to smite Angra Mainyu's creation while protecting the Good Spirit's creation,
    and receives the boon. The passage also specifies offerings such as baresma, milk,
    libations, Haoma, meat, and prayer, and notes a part of Vayu belonging to Spenta
    Mainyu.
  language: English
  quote_policy: summarized
