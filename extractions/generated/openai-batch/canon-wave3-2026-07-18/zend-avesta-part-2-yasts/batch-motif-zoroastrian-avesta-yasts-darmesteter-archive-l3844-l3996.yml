canonical_text:
  quote: Ardvi Sura Anahita granted him that boon
  summary: The passage presents a sequence of petitions to Ardvi Sura Anahita. After
    one boon is denied, Zarathustra is instructed to offer sacrifice to Anahita's
    spring. Kavi Usa, Husravah, and Tusa each worship or sacrifice to Anahita at named
    places and ask for sovereignty, advantage in pursuit, health, speed, or victory;
    Anahita grants the stated boons to these petitioners. Translator notes relate
    several figures and places to later Iranian epic names.
  language: English
