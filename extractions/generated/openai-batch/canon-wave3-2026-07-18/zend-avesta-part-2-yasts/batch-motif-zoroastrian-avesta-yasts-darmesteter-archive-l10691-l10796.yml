  quote: ''
  summary: A Farvardin Yast passage invokes and worships the piety and Fravashis of
    named holy persons, including Maidhyo-mangha as first hearer of Zarathustra's
    teaching, Saena as a teacher associated with a hundred pupils, Zarathustra's sons,
    other named holy men, and the holy king Vistaspa. Translator notes connect Maidhyo-mangha
    with first discipleship, Saena with teaching and bird imagery, Karxipta with bringing
    and reciting sacred Law, and Zarathustra's sons with priestly, agricultural, and
    warrior roles.
