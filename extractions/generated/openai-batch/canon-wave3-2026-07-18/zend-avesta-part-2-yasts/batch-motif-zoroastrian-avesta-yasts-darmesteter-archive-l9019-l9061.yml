canonical_text:
  quote: ''
  summary: The passage introduces Rashnu Razi^ta as the Genius of Truth, a judge of
    the departed with Mithra and Sraosha, and the holder of an impartial balance for
    weighing deeds after death. It explains the Rashn Yast as an appeal for Rashnu
    to attend an ordeal as witness and arbiter, with a world-wide summons through
    earth, Alborz, celestial regions, and highest heaven. The passage then gives recitation
    days and opening liturgical confession and invocations to Ahura Mazda, Havani,
    Rashnu, Arstat, and true-spoken speech.
  language: English
  quote_policy: summarized
