canonical_text:
  quote: ''
  summary: Ashi Vanguhi is invoked as shining, high, and powerful. Zarathustra sacrifices
    to her by the river Daitya and obtains a boon concerning Hutaosa's support for
    the law. Kavi Vishtaspa also sacrifices and obtains a boon for defeating opponents
    and bringing nations to the good law. Ashi then speaks about libations she will
    not accept, narrates hiding beneath animals while pursued, laments fertility and
    lineage wrongs, and is told by Ahura Mazda not to withdraw to heaven or earth
    but to remain in a kingly palace. A final prayer proposes worship like Vishtaspa's
    sacrifice.
  language: English
  quote_policy: summarized
