canonical_text:
  quote: ''
  summary: Zarathustra is instructed to offer sacrifice to Ardvi Sura Anahita, identified
    as a spring. Ardvi Sura Anahita stands in a golden mantle, waiting for a man to
    offer libations and prayers. In her heart she asks who will praise and sacrifice
    to her with clean libations, Haoma, and meat, and who will cleave to her, think
    with her, bestow gifts, and show good will. She is also described as appearing
    in the shape of a fair, strong, tall, pure maid.
  language: English
