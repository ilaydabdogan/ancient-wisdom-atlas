  summary: The passage describes vapours taking cloud shape and weather agents moving
    after Haoma's ways to fields and the seven Karshvares. Apam Napat divides waters
    among countries with the wind, the Glory made by waters, and the Fravashis. The
    hymn sacrifices to Tishtrya, a bright star moving from the east along an appointed
    watery way by the will of Ahura Mazda and the Amesha-Spentas.
