canonical_text:
  quote: ''
  summary: A prayer praises Ashi Vanguhi as a powerful giver of desirable things.
    Men whom she attends possess beautiful daughters, swift horses, battle chariots,
    camels, silver and gold, and fine garments. The speaker asks Ashi not to turn
    away and identifies her divine family. Ashi stands on her chariot and asks who
    invokes her. Zarathushtra answers that he was the first mortal to praise Asha
    and sacrifice to Ahura Mazda and the Amesha Spentas; at his birth and growth waters,
    plants, and good creatures rejoiced, while Angra Mainyu fled from the earth.
  language: English
  quote_policy: summarized
