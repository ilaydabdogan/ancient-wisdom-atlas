canonical_text:
  quote: ''
  summary: A liturgical passage invokes and sacrifices to the Sun, Ahurian waters,
    Ahura Mazda, the Amesha-Spentas, Mithra, Tishtrya, unseen holy gods, celestial
    bodies, and trees yielding baresma. It asks for brightness, glory, bodily health,
    help from Mithra and Ahura, and access to a luminous highest space at the world's
    end. Mithra is described as truth-speaking, lord of countries, vigilant, sleepless,
    and endowed with many ears and eyes.
  language: English
  quote_policy: summarized
