canonical_text:
  quote: ''
  summary: The passage praises Mithra as sleepless and ever awake, a lord of wide
    pastures, protector of those who have not lied to him, and punisher of liars and
    hostile powers. Weapons fail against the person whom Mithra helps. Mithra removes
    strength and senses from those who lie to him, breaks the skulls of Daevas, withstands
    Pairikas, establishes nations when not deceived, and confounds destructive nations.
  language: English
  quote_policy: summarized
