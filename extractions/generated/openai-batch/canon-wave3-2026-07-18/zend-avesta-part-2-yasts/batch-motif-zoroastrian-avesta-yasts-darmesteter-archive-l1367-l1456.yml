  summary: The passage lists Sirozah II invocations numbered 14-25. A repeated sacrificial
    formula addresses named divine beings, personified abstractions, cosmic powers,
    winds, and qualities. Some recipients are described with attributes such as being
    made by Mazda, world-increasing, many-eyed and many-eared, destructive, bounteous,
    or associated with a light chariot.
