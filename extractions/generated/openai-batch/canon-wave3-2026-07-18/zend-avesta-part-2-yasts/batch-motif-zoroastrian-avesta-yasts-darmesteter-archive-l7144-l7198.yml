canonical_text:
  quote: ''
  summary: The passage praises Mithra as a sleepless, watchful, undeceivable helper
    and guardian. It describes him as carried by wide-hoofed horses against enemy
    hosts and says that when he bears ill-will toward those who have lied to him,
    he binds their hands, confounds their eyesight, removes their hearing, and prevents
    their movement and resistance. The passage includes repeated sacrificial formulas
    for Mithra’s brightness and glory and begins an incomplete statement naming Ahura
    Mazda as Maker.
