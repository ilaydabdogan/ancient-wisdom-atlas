  summary: The passage invokes the Waters and Vayu, then recounts sacrifices offered
    to Vayu by Haoshyangha, Takhma Urupa, Yima, and Azi Dahaka. Vayu grants the first
    three supplicants their requested boons but refuses Azi Dahaka’s request to empty
    the seven regions of the earth of human beings.
