canonical_text:
  quote: ''
  summary: The passage praises Mithra as a golden, summit-holding watcher over Aryan
    lands, mountains, waters, and the Karshvares. It describes him as an unseen Yazata
    who moves through all regions, brings glory and sovereignty, grants strength for
    victory to pious libation-offerers, and remains sleepless and awake. It warns
    that no social or political leader may lie to Mithra; when they do, Mithra angrily
    destroys their houses and jurisdictions, opposes the side of the liar, and causes
    the foe’s spear to turn backward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The praised figure is described as foremost in a golden array, taking hold
    of beautiful summits and looking over the abode of the Aryans with a beneficent
    eye.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described landscape includes valiant chiefs arraying troops, high mountains
    rich in pastures and waters, deep salt lakes, and wide-flowing rivers moving toward
    named regions.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mithra looks with a health-bringing eye on named Karshvares, including Hvaniratha,
    which is called bright and associated with cattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A translator note says the earth is divided into seven Karshvares separated
    by seas and mountains impassable to humans, and identifies Hvaniratha as the central
    Karshvare and the only one inhabited by humans.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mithra moves along all the Karshvares as an unseen Yazata and brings glory
    and sovereignty.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mithra increases strength for victory for those who piously offer him libations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker offers sacrifice for Mithra’s brightness and glory and sacrifices
    to Mithra as lord of wide pastures, sleepless and ever awake.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Nobody in the listed social offices—master of a house, lord of a borough,
    lord of a town, or lord of a province—must lie to Mithra.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: If those household or political leaders lie to Mithra, Mithra comes angry
    and offended and breaks apart their house, borough, town, province, and associated
    leading men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wherever someone has lied to Mithra, Mithra stands on that side angry and
    offended, and his wrath is described as slow to relent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Those who lie to Mithra cannot outmatch him while running, riding, or driving;
    the spear flung by Mithra’s foe darts backward.
  category: sequence
  evidence_refs:
  - ev:9
