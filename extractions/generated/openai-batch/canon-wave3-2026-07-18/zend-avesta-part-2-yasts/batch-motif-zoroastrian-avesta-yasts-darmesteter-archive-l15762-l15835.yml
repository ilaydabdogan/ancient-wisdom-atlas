canonical_text:
  quote: We sacrifice unto the awful kingly Glory, made by Mazda
  summary: The passage praises and ritually addresses the kingly Glory made by Mazda.
    This Glory protects creatures and the Aryan nations, cleaves to named Kavi rulers,
    grants royal virtues and boons, and is associated especially with Kavi Husravah,
    who prevails over enemies and binds Frangrasyan and Keresavazda to avenge murders.
  language: English
  quote_policy: quoted
