canonical_text:
  quote: ''
  summary: The passage recounts offerings to Ardvi Sura Anahita and requests for boons.
    One unnamed petitioner asks to depopulate the seven Karshvares and is refused.
    Thraetaona sacrifices to Anahita and receives a boon to overcome Asi/Azi Dahaka
    and deliver Savanghava and Erenavai. Keresaspa sacrifices to Anahita and receives
    a boon to overcome Gandarewa near the boiling sea Vouru-Kasha and to reach the
    fiend's stronghold. A following invocation calls Ardvi Sura Anahita a spring.
  language: English
  quote_policy: summarized
