canonical_text:
  quote: ''
  summary: A command is given to Spitama Zarathujtra to offer sacrifice to Ardvi Sura
    Anahita, described as a spring. A figure printed as 6^amaspa^ offers large animal
    sacrifices to her after seeing a hostile army of Daeva-worshippers approaching
    in battle array. He asks Ardvi Sura Anahita for a boon of constant victory among
    the Aryans, and she grants it while he offers libations, gifts, sacrifice, and
    entreaty.
