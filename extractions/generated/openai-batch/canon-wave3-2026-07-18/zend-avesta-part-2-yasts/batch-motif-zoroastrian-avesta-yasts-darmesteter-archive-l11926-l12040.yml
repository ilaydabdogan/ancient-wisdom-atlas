canonical_text:
  quote: ''
  summary: A section of the Farvardin Yasht lists the Fravashis of holy women, wives,
    maids, and holy persons in several countries as recipients of worship. It singles
    out Ereda^fedhri, called Vispa-taurvairi, because she will bring forth one who
    destroys the malice of Daevas and men. Translator notes identify related future
    mothers and describe conception through bathing in Lake Kasava, where Zarathushtra's
    seed is preserved.
  language: English
  quote_policy: summarized
