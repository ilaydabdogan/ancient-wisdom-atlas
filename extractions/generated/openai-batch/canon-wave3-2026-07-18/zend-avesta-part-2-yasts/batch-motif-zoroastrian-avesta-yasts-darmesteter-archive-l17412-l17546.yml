canonical_text:
  quote: ''
  summary: The passage presents a promise that the Amesha-Spentas and Ahura Mazda
    will show Zarathustra the way to the spiritual world, Paradise, and the Garo-nmana
    when the soul leaves the body. It then gives blessings and exhortations concerning
    Vishtaspa, charity toward the poor, the Law of Mazda, Rata, avoidance of Angra
    Mainyu, Atar's blessing of an incense-offerer, and praise carried with hymns to
    the Garo-nmana.
  language: English
