canonical_text:
  quote: ''
  summary: The passage introduces Arsti or Truthfulness, her ritual association with
    Rashnu and Mount Ushi-darena, and her connection with the Hvarenah. In the Astad
    Yasht, Ahura Mazda tells Zarathustra that he made the Aryan Glory, which grants
    abundance and withstands enemies. The Glory destroys hostile beings and afflictions.
    Ashi Vanguhi enters the family and royal palace of a generous faithful man, bringing
    flocks, victory, intelligence, Glory, and multiplication of horses, flocks, and
    offspring. Tishtrya, the Mazda-made wind, and the Glory bring increase to mountains,
    vales, and plants and remove afflictions. The passage closes with worship formulas
    and a transitional note describing the Zamyad Yasht as devoted to mountains and
    kingly Glory.
  language: English
  quote_policy: summarized
