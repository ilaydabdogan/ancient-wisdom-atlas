canonical_text:
  quote: ''
  summary: The passage closes a Rashnu liturgical section with invocation, sacrifice,
    blessing formulas, and a request that a worshipper receive brightness, glory,
    health, and a blissful abode. It then introduces the Farvardin Yasht, defining
    Fravashis as sustaining inner powers and deified souls, comparing them to Hindu
    Pitrs and Latin Manes, and outlining the Yasht as a glorification and catalogue
    of Fravashis from early figures to Saoshyant and holy women.
  language: English
  quote_policy: summarized
