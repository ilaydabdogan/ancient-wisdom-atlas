canonical_text:
  quote: "“We offer up a sacrifice unto the powerful Drvaspa, made by Mazda and holy”"
  summary: 'The passage invokes Drvaspa as a powerful, holy being made by Mazda, keeper
    of flocks and helper of the faithful. Kavi Vi^-taspa offers a large sacrifice
    behind the waters of the river Daitya and asks Drvaspa for a boon: victory over
    named enemies, the smiting of Daeva-worshippers and hostile nations, and the bringing
    of other nations to the good law. Drvaspa grants the boon, and the hymn closes
    with further offerings, ritual formulas, and requests for brightness, glory, health,
    and a blissful abode.'
  language: English
  quote_policy: quoted
