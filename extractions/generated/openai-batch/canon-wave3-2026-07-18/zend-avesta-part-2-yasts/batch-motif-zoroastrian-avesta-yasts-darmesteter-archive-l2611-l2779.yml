canonical_text:
  quote: ''
  summary: The passage introduces and begins the Ardibehišt Yašt. It praises Asha-Vahishta,
    Airyaman, and related holy beings; describes Asha-Vahishta as linked with divine
    order, holiness, and fire; presents Airyaman and the Airyaman prayer as healing
    and anti-demonic; and states that proclamation of Asha-Vahishta makes the way
    easy to the luminous abode or Garo-nmana, which holy souls may enter but the wicked
    may not.
  language: English
  quote_policy: summarized
