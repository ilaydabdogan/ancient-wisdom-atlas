canonical_text:
  quote: ''
  summary: Zarathustra asks Ahura Mazda which heavenly god is best armed. Ahura Mazda
    identifies Verethraghna, made by Ahura. Verethraghna appears successively in the
    shapes of a bull, a horse, and a camel, with attributes of strength, victory,
    glory, brightness, vigor, and destructive power against malice. The passage includes
    sacrificial formulas directed to Verethraghna.
  language: English
