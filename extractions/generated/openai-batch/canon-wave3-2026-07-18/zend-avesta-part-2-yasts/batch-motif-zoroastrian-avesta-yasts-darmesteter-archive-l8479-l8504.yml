canonical_text:
  quote: ''
  summary: The passage is a hymn section praising Mithra as a sleepless, ever-awake,
    knowledgeable, radiant Yazata. It describes his relation to the creation of Spenta
    Mainyu, compares his shining body and face to the moon and the star Tistrya, describes
    his star-inlaid heavenly chariot made by Ahura Mazda and embraced by an unnamed
    deceitless goddess, and states that Mithra has ten thousand spies and receives
    sacrifice for his brightness and glory.
