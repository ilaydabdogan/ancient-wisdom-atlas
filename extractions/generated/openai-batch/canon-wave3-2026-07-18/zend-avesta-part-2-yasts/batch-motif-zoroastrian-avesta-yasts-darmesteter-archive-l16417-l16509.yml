canonical_text:
  quote: ''
  summary: The passage describes the faithful soul being elevated through successive
    paradisal stations associated with good thought, good word, good deed, and Endless
    Lights. A previously departed faithful person questions the newcomer, but Ahura
    Mazda forbids questioning because the soul has just passed the fearful separation
    of body and soul, and instructs that postmortem food be given. Zarathustra then
    asks where the wicked soul abides after death; Ahura Mazda says it remains near
    the skull, laments with the Kima Gatha, and experiences intense suffering on the
    night after death and again on the second night.
  language: English
  quote_policy: summarized
