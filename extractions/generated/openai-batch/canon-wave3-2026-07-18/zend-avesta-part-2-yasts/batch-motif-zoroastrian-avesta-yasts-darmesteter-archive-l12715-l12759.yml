  quote: ''
  summary: The passage praises Verethraghna, made by Ahura, as a power connected with
    virility, death, resurrection, peace, and free passage. Zarathustra sacrifices
    to Verethraghna seeking victory in thought, speech, action, address, and answer.
    Verethraghna grants bodily strength, health, sturdiness, and the eyesight of a
    golden-collared vulture able to perceive a small piece of flesh from a vast distance.
    A following fragment says Zarathustra asks Ahura Mazda, addressing him with divine
    titles.
