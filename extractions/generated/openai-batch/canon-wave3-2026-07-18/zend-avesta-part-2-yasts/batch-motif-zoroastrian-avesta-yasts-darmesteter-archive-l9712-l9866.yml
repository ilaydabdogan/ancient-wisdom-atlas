canonical_text:
  quote: ''
  summary: The passage praises the Fravashis of the faithful as helpers who sustain
    the material and immaterial worlds, support waters, plants, winds, fertility,
    celestial order, battle victory, health, and glory. It presents hostile powers
    such as the Druj, Angra-Mainyu, and Vidotu as threats. Ahura Mazda instructs Spitama
    Zarathustra to recite fiend-smiting words when facing frightful roads, and the
    recitation invokes the Fravashis across households, communities, nations, and
    time.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fravashis of the faithful are said to have given help; without that help,
    the speaker’s animals and men would not subsist and the Druj would have strength
    and dominion over the material world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Without the Fravashis’ help, immaterial creatures between earth and sky would
    be harassed and smitten by the Druj, and Angra-Mainyu would not give way to the
    blows of Spenta-Mainyu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Through the brightness and glory of the Fravashis, waters flow from never-failing
    springs, plants grow from the earth, and winds drive clouds toward the springs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Through the brightness and glory of the Fravashis, females conceive offspring,
    give birth safely, and are blessed with children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Through the brightness and glory of the Fravashis, a man is born who becomes
