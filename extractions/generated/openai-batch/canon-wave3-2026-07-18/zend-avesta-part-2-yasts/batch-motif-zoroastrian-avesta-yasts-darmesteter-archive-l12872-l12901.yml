  quote: ''
  summary: 'Ahura Mazda answers Spitama Zarathustra with instructions for a battle
    setting: four feathers are to be thrown in the way, and victory will stand with
    the side that first worships well-shaped Strength and Verethraghna. The passage
    then blesses Strength and Victory as keepers and maintainers, restricts disclosure
    of the spell to specific kinship or teacher-pupil relationships, and describes
    the words as powerful, victorious, healing, and able to avert a weapon.'
