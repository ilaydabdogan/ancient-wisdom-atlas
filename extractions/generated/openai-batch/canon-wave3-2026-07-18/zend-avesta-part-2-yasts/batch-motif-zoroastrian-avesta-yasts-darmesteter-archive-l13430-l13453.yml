  summary: 'The passage announces sacrifice to the Waters and to Vayu. Thraetaona,
    heir of the valiant Athwya clan, sacrifices to Vayu in four-cornered Varena with
    golden ritual furnishings, baresma, and full-boiling milk offerings. He asks Vayu
    for a boon: that he may overcome A^i Dahaka, described as three-mouthed, three-headed,
    six-eyed, thousand-sensed, powerful, fiendish Dru^.'
