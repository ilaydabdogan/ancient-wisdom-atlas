canonical_text:
  quote: ''
  summary: The passage gives liturgical material addressed to Asha-Vahishta, naming
    offerings such as libations, Haoma, meat, baresma, sacred speech, and rightly
    spoken words. It blesses Asha-Vahishta, Airyaman, and Saoka and asks for brightness,
    glory, bodily health, and a blissful abode for a man. The following editorial
    introduction frames the Khordad Yasht as dedicated to Haurvatat, the Genius of
    Health and Waters, and connects the Bareshnum purification with Airyaman driving
    away diseases created by Angra Mainyu. The passage then opens with a Mazda-worshipper’s
    confession, rejection of the Daevas, obedience to Ahura’s laws, and dedication
    of sacrifice to Havani and Haurvatat.
  language: English
  quote_policy: summarized
