canonical_text:
  quote: the Glory was seen to flee away from him in the shape of a bird
  summary: The passage praises and sacrifices to the kingly Glory made by Mazda. It
    recounts how this Glory long adhered to Yima during an ideal reign of abundance
    and freedom from death, old age, hostile weather, and Daeva-made envy. After Yima
    delighted in falsehood, the Glory left him in bird form. It first went from Yima
    as a Varaghna bird and was seized by Mithra; a second time it went in the same
    form and was seized by Thraetaona, who is praised as a victorious hero and smiter
    of Az'i Dahaka, a multi-headed, multi-eyed fiendish Druj created by Angra Mainyu
    against the good world.
  language: English
  quote_policy: quoted
