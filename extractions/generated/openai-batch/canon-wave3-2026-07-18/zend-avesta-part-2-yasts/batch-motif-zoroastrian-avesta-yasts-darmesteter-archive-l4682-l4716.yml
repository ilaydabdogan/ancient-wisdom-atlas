  quote: ''
  summary: 'The passage commands Spitama Zarathushtra to offer sacrifice to Ardvi
    Sura Anahita, described as a spring. Ahura Mazda has made four horses for her:
    wind, rain, cloud, and sleet, through which precipitation falls on the earth;
    her armies are vast. The speaker vows to worship the height Hukairya, a golden
    height with deep precipices, from which Ardvi Sura Anahita leaps and runs powerfully
    with glory like all the waters of the earth.'
