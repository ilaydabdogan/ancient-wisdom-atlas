  summary: The passage ranks recitations of the praise of Holiness by ritual circumstance.
    Ahura Mazda answers questions addressed to Zarathustra, identifying recitations
    delivered while eating the gifts of Haurvata and Ameretat, and while drinking
    Haoma strained for sacrifice, as especially valuable when accompanied by professing
    good thoughts, good words, and good deeds and rejecting evil thoughts, evil words,
    and evil deeds. The final answer begins but is cut off after saying the recital
    is delivered when starting.
