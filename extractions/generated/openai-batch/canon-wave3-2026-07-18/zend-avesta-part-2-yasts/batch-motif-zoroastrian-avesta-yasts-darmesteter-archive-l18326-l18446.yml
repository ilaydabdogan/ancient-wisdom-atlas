  summary: The passage closes an invocation of Ardvi Sura Anahita, describing purification
    of waters, entry into Ahura Mazda's Garō-nmana, and requested boons. It then gives
    sacrificial formulas to Anahita and begins the Atash Nyayis, invoking Ahura Mazda
    and Atar/Fire, son of Ahura Mazda, with Mazda-made glory, royal and sacred place
    names, healing, and propitiatory prayer.
