canonical_text:
  quote: ''
  summary: The passage invokes Mithra, lord of wide pastures, as sleepless and ever
    awake. It describes him moving over the whole earth after sunset, surveying the
    space between earth and heavens, bearing a powerful many-edged club, causing hostile
    beings to flee in fear, and being feared as an angry smiter and fiend-smiting
    god. A following section repeats the sacrifice to Mithra and the flight of Daevas
    and Varenya fiends.
  language: English
