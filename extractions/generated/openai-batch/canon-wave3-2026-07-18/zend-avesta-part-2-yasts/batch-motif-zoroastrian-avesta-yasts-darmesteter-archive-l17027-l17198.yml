canonical_text:
  quote: ''
  summary: A blessing and instruction sequence addressed chiefly to the young king
    Vistaspa. The passage asks for sons, health, long life, victory, cattle, bread,
    divine Glory, household plenty, proper treatment of priests, support of the Law
    of Mazda, and transmission of teaching. It invokes or names Zarathushtra, Ahura
    Mazda, Waters, Ashi, Rata, Paredi, Sraosha, the Amesha-Spentas, and exemplary
    figures such as Gamaspa, Peshotanu, and Mithra.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A blessing asks that ten sons be born from the recipient''s own body: three
    Athravans, three warriors, three tillers of the ground, and one like Gamaspa.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son like Gamaspa is described as one who may bless the recipient with
    great and increasing happiness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The recipient is blessed to be freed from sickness and death like Peshotanu.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The recipient is compared with Mithra for piercing rays, the moon for warmth,
    fire for resplendence, and an old man for long life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After fulfilling a thousand-year duration, the recipient is wished the bright,
    all-happy, blissful abode of the holy Ones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Zarathushtra addresses the young king Vistaspa and asks that strength, victory,
    cattle, bread, and many male children be given to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The male children requested for Vistaspa are described as praisers, chiefs
    in assemblies, smiters who are not smitten, joyful, and ready to help.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Waters are asked to impart Glory to the man who offers them a sacrifice,
    and a boon is begged from Ashi Vanguhi and Rata.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Paredi of the light chariot is invoked to become manifest to the young king
    Vistaspa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage wishes that plenty dwell in a house standing upon high columns
    and rich in food.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The recipient is told never to give bad food to a priest and to regard a priest
    like the brightest offspring of his own blood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: One who supports the Law of the worshippers of Mazda as a brother or friend
    is said to keep want of food away from her.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Zarathushtra preaches the law to Frashaoshtra and Gamaspa, telling them to
    practise holiness and thrive.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ahura Mazda speaks to Zarathushtra, and Zarathushtra repeats to Vistaspa that
    bad or unfriendly priests cause harm and make sacrifice to the Amesha-Spentas
    as if no sacrifice had been offered.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: A teaching is to be received by Vistaspa and then done likewise to his son;
    the teaching is said to make him rich in children, milk, seed, and fat.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Law of Mazda is described as obtaining wishes, making the world grow,
    listening to songs, rejoicing the faithful man, and protecting and maintaining
