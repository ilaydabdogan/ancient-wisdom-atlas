  category: attribute
  evidence_refs:
  - ev:11
- id: obs:17
  text: A note states that Peshotanu was a son of Vistaspa; Zarathushtra made him
    drink a certain sort of milk, after which he forgot death, and he is counted among
    seven immortals reigning in Kangdez.
  category: sequence
  evidence_refs:
