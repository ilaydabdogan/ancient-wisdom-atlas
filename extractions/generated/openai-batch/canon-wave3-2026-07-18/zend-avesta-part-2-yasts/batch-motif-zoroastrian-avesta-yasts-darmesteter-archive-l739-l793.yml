  summary: A Sirozah liturgical passage lists invocations to Khshathra-vairya, Spenta-Armaiti,
    Rata, Haurvatat, Ameretat, Mithra, Rama, Asha-Vahishta, and Atar, along with associated
    domains such as metals, seasons, years, flocks, corn, Gaokerena, pastures, and
    fire. Notes identify Gaokerena as a white Hom or plant of immortality and Atar
    as the Genius of Fire, and cite related Yasna invocations for the Havani and Rapithwin
    periods.
