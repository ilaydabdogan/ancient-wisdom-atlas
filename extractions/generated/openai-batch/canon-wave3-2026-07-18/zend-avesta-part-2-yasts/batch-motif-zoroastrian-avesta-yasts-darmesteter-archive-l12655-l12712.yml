canonical_text:
  quote: ''
  summary: 'The passage describes gifts associated with Verethraghna: manliness, bodily
    strength and health, and extraordinary eyesight likened first to the Kara fish
    beneath the waters and then to a male horse seeing in darkness and rain. In section
    XII, sacrifice is offered to Verethraghna, made by Ahura, who is described as
    making virility, death, and resurrection. The holy Zarathu^tra offers sacrifice
    asking for victorious thinking, speaking, doing, addressing, and answering, and
    Verethraghna grants him the listed powers.'
