canonical_text:
  quote: "“We sacrifice unto Mithra, the lord of wide pastures...”"
  summary: In Mihr Yasht XXXI.123-126, Mithra is invoked as lord of wide pastures,
    sleepless and ever awake. Ahura Mazda is said to have offered him sacrifice in
    the shining Garo-nmana. Mithra drives forward from Garo-nmana with arms lifted
    toward Immortality in a beautiful, swift, ornamented golden chariot. Four white,
    undying stallions fed on heavenly food draw the chariot; their fore-hoofs are
    shod with gold and hind-hoofs with silver. Rashnu-Razishta drives at Mithra’s
    right hand.
