canonical_text:
  quote: ''
  summary: The passage says that without the Sun's rising the Daevas would destroy
    all things in the seven Karshvares and the heavenly Yazatas could not repel them
    in the material world. It prescribes sacrifice to the undying, shining, swift-horsed
    Sun to withstand darkness, darkness-born Daevas, robbers, Yatus, Pairikas, and
    unseen death; the offering is also said to be offered to Ahura Mazda, the Amesha-Spe;/tas,
    and the offerer's own soul, and to rejoice the Yazatas. A following fragment announces
    sacrifice to Mithra.
  language: English
  quote_policy: summarized
