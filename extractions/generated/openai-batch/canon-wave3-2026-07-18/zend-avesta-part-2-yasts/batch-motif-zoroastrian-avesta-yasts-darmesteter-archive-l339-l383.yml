  quote: ''
  summary: The introduction states that this volume translates the Sirozahs, Yasts,
    and Nyayis, identifies the material as chiefly mythical and legendary Zoroastrian
    lore, discusses the translator's use of etymological, comparative, Pahlavi, Persian,
    and Sanskrit aids, and notes that legends in Firdausi's Shah Namah help illuminate
    some Yast passages. Darmesteter thanks Mr. West and dates the introduction Paris,
    13 December 1882.
