canonical_text:
  quote: ''
  summary: The passage contains an exchange in which Ahura Mazda identifies recitals
    of the praise of Holiness at waking, at the last moments of life, and in renouncing
    evil as immensely meritorious. It then introduces Yasht XXII as a description
    of the post-death fates of righteous and wicked souls, including three nights
    after death, encounter with one's own conscience, movement toward heaven or hell,
    and reward or punishment. The first verses begin with Zarathustra asking where
    the soul of one of the faithful abides on the night of death, and Ahura Mazda
    replying that it sits near the head, sings the Ustavaiti Gatha, proclaims happiness,
    and tastes great pleasure.
  language: English
  quote_policy: summarized
