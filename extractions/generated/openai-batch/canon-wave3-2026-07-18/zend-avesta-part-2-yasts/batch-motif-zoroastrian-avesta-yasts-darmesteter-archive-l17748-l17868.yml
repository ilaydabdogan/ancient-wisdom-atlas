canonical_text:
  quote: ''
  summary: 'The passage describes the faithful soul after death: after nights spent
    in Good Deeds and on the way to Garo-nmana, it reaches the dawn of the third night,
    perceives a sweet-scented southern wind, and meets its own conscience appearing
    as a beautiful maiden. The conscience praises the soul''s good thoughts, words,
    deeds, worship, and hospitality. The soul then advances by four steps through
    Good-Thought, Good-Word, and Good-Deed Paradises into Endless Light. A previously
    departed faithful person questions the newly arrived soul, but Ahura Mazda says
    not to question one who has just passed the fearful separation of body and soul.
    The passage also names after-death food, the oil of Zaremaya, for righteous men
    and women.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The soul's postmortem sequence includes sitting in Good Deeds on the second
    night, going along the ways toward Garo-nmana on the third night, and reaching
    the dawn at the end of the third night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the dawn after the third night, the faithful soul perceives itself amid
    plants and scents and inhales a sweet-scented wind from the south.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The faithful soul asks where the sweetest-scented wind it has inhaled comes
    from.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The soul's own conscience appears to advance in the wind in the shape of a
    beautiful young maiden with many favorable physical attributes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The soul asks the maiden who she is, and the maiden identifies herself as
    the soul's own conscience.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The conscience addresses the soul as one of good thoughts, good words, good
    deeds, and good religion.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The conscience says that when the faithful one saw derision, idolatrous deeds,
    rejection of the poor, or shutting of doors, he sat singing the Gathas, worshipping
    the good waters and Atar, and rejoicing faithful people who came from near or
    far.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The conscience says the faithful person's good thought, good speech, and good
    deed made her lovelier, fairer, more desirable, and placed her in the foremost
    place.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The faithful soul's first, second, third, and fourth steps place it respectively
    in Good-Thought Paradise, Good-Word Paradise, Good-Deed Paradise, and Endless
    Light.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A faithful person who had departed earlier asks the newly arrived holy man
    how he left the material, decaying world and entered the spiritual, undecaying
    world.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ahura Mazda instructs that the newly arrived one should not be questioned
    because he has just traveled a dreary way full of fear and distress, where body
    and soul part from one another.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The food brought to the departed righteous is described as the oil of Zaremaya,
    given after death to a youth of good thoughts, good words, good deeds, and good
    religion, and also to a holy woman rich in good thoughts, words, and deeds.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Spitama Zarathushtra speaks to the young king Vishtaspa and asks Ahura Mazda
    to what land he should turn and to whom he should go with praying.
  category: speech
  evidence_refs:
