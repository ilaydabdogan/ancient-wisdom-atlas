- id: obs:3
  text: Parsi tradition is reported to hold that every Amshaspand and every Ized formerly
    had a particular Yast, though only twenty Yasts and fragments of another are now
    possessed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The order in which the Parsis arranged the Yasts is said to follow the order
