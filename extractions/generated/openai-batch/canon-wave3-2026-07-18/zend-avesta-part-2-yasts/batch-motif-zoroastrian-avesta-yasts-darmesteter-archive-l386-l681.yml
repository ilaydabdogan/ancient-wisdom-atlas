canonical_text:
  quote: ''
  summary: The passage introduces Yasts as worship or praise writings for Izeds, explains
    the Sirozah as a thirty-invocation prayer corresponding to the thirty days of
    the month and to the ordering of the Yasts, notes its recitation for the dead
    in India, discusses lost and non-corresponding Yasts, and reports a comparison
    between this thirty-day divine calendar and an Assyrian list of gods.
  language: English
  quote_policy: summarized
