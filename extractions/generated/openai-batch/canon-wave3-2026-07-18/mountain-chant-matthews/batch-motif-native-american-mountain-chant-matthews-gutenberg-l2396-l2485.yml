canonical_text:
  quote: ''
  summary: The passage describes the night construction of a branch corral or dark
    circle during a Navajo ceremony, its temporary sacred status and access rules,
    the movement of visitors into the enclosure, the lighting of fires, and a first
    nocturnal dance in which white-painted dancers circle a central fire with eagle-down-tipped
    wands, burn off the down, feign restoring it, and exit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Just after sunset, the old chanter stood east of the great woodpile at the
    intended gate of the corral and began singing while rattling.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young and middle-aged men dragged branches from neighboring woods and placed
    them in a circle while the chanter continued singing; their work stopped when
    his song stopped.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The completed corral averaged about forty paces in diameter, had an approximately
    eight-foot-high fence, and left an opening about ten feet wide in the east.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Once completed, the dark circle of branches enclosed sacred ground, and dogs
    were driven out if they entered.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: People entering for the first time were required to pass around to the left,
    described as to the south of the great woodpile.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: No one was allowed to look through or over the fence, and part of the auditorium
    was reserved for spirits of bears and other ancestral animal gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: No horse could be led into the enclosure until after sunrise, when the fence
    was razed and the ground became common soil again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: As night fell, many visitors moved goods into the corral and lit small fires
    close to the fence; others left watchers outside to guard property.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At 8 o'clock, musicians entered, sat beside a small fire in the west, and
    began continuous vocal and instrumental music.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the beginning of the music, the central fire was lit, quickly producing
    large flames, high sparks, falling ashes, and intense heat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The intense central fire prepared the setting to test dancers' endurance as
    they exposed, or seemed to expose, their naked breasts to the heat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the first dance, a warning whistle was heard, and about a dozen lean dancers
    entered through the entrance from the outer darkness, dressed in breechcloths
    and moccasins, painted with white earth, and yelping like wolves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The dancers moved around the fire in single file, changed bodily attitudes,
    faced the four directions, and carried slender wands tipped with eagle down.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The dancers' course around the fire was leftward, moving from east to west
    by way of the south and returning east by way of the north; the passage says this
    course was used by all dancers that night and never reversed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: After circling the fire twice, the dancers tried to burn the eagle-down tips
    from their wands, using various approaches near the fire and toward sparks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: After burning off the eagle down, each dancer feigned restoring the down by
    waving the wand, then held the wand up, yelped, and left the corral.
  category: sequence
  evidence_refs:
  - ev:7
