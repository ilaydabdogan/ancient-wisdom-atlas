  quote: "“the water suddenly burst forth in great abundance”"
  summary: 'The passage first states that a patient and friends, not the shaman, choose
    the rites to be performed. It then introduces the myth explaining the origin of
    the ceremony: a family of six lives and travels near the Carrizo Mountains, subsisting
    on small animals and seeds. At Winged Rock, the elder brother finds moist ground,
    digs, and releases an abundant spring later known as One-Eyed Water. The household
    moves near the spring, builds an excavated lodge with local materials, struggles
    with scarcity, and finally departs for the San Juan River, where food is more
    abundant.'
