canonical_text:
  quote: ''
  summary: The passage describes preparation of pigments and sand for a Navajo Mountain
    Chant dry painting, the placement of plumed wands and other ritual articles outside
    the medicine lodge, the nighttime seating of the sick woman at the crossing of
    two white serpents in the painting, the appearance and retreat of an evergreen-covered
    performer, and the final erasure and disposal of the painting sand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants ground coarse pigments between stones for use in sand pictures
    or dry paintings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Five pigment colors were prepared: black from charcoal, white from white
    sandstone, red from red sandstone, yellow from yellow sandstone, and a gray mixture
    treated as blue.'
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The coarse pigments were kept on curved pieces of piñon bark and replenished
    as the colored powder heaps diminished.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A cleared part of the lodge floor west of the fire was covered with dry sand
    about three inches deep and smoothed with broad oaken weaving battens.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chanter planted plumed wands in front of the medicine lodge and laid beside
    them beaver-skin collars and wing symbols intended for couriers to wear the next
    day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports that these outside articles were said to be a sign to
    the gods that the holy pictures were being drawn.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The great painting was begun about 1 p.m., finished about 3 p.m., and left
    in place until the night ceremonies ended.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At night, the fire burned in the center of the lodge; spectators sat near
    the edge, the sick woman sat in the south, and the qaçàli with assistants sat
    in the north.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sick woman was directed to sit facing east at the junction of two white
    serpents that crossed one another on the picture.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The qaçàli began a song accompanied by rattling and drumming and made a slight
    signal with his drumstick.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man covered with spruce twigs sprang from behind the singers, rushed toward
    the patient, retreated after the spectators yelled, and the scene was repeated
    three times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The qaçàli erased the painting with his rattle, beginning with the mountain
    in the west, then the bear track, the central hole, other figures, and finally
    the outer serpents.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When erasing the serpents, the qaçàli began with the eastern figures and followed
    the apparent course of the sun, ending with the northern figures.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the picture was obliterated, the sand was collected in a blanket, carried
    outdoors, and thrown away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The narrator notes that Navajo usage could apply the term for blue to gray
    things, while also stating that a distinction between gray and blue was evident
    in other painted objects.
  category: attribute
  evidence_refs:
  - ev:2
