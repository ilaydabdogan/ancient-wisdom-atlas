canonical_text:
  quote: ''
  summary: Matthews introduces the Navajo Mountain Chant as a nine-day ceremony practiced
    by shamans or medicine men. He explains its name as connected with a place within
    the mountains, sacred songs, and a chanter who directs the rite. The passage describes
    secret lodge ceremonies, a final public night performance in a piñon-branch enclosure,
    purposes including healing and invocations for crops and rain, winter-only timing,
    and a taboo against speaking of gods or ancient myths during thunder and rattlesnake
    season, illustrated by an anecdote about the informant Juan reacting fearfully
    to thunder while discussing a western goddess.
  language: English
  quote_policy: summarized
