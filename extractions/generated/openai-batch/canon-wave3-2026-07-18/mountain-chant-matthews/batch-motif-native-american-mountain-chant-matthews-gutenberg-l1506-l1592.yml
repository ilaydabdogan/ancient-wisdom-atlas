canonical_text:
  quote: ''
  summary: Two ceremonial couriers return to the medicine lodge with food from their
    journeys, later report their northward and southward errands, display exchanged
    weapons and ritual gifts as signs of truth, appear in fine attire, and are vindicated
    before those who mocked them. On the third day, invited groups arrive from north
    and south, and a very large branch corral is built for the night dance while singers
    and drummers rehearse.
  language: English
