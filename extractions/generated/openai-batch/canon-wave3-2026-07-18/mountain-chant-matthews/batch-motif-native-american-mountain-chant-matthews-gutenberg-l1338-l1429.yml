- id: motif:3
  label: Purification after contact with alien or supernatural places
  taxonomy_refs:
  - initiation
  basis: The returned wanderer is washed, dried with corn meal, subjected to a great
    dance, and given plant infusions to remove alien substances, influences, and strange
    food.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage links the first purification specifically to return from captivity
    with another tribe, while the later cleansing also addresses food taken among
