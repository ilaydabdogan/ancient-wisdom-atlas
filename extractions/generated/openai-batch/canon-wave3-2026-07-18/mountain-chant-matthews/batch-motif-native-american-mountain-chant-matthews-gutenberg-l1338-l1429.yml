- id: motif:2
  label: Transmission of ritual knowledge after a supernatural journey
  taxonomy_refs:
  - return
  - culture_hero
  - wisdom
  basis: The Navajo is shown the road home, returns to his people, recounts revelations
    from supernatural homes, instructs hearers in mysteries, and thereby completes
    or transforms the great dance.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage calls him a prophet and describes ritual transmission; broader
