canonical_text:
  quote: ''
  summary: In this passage, two brothers hunt under the direction of an old man identified
    as their father. After dreams of killing deer, trapping small animals, a restricted
    deer hunt, and a period of failed hunting, the father instructs them in a precise
    deer-processing procedure, guides a shot through the deer pluck, gives future
    hunting directions involving mountain mahogany and cliff rose, oversees preparation
    of deer disguises, and later has the group build a hogan at White Standing Rock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother rises early, stirs embers, makes a fire, and the two brothers
    sit by it warming themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother reports dreaming that he killed a buck deer; the younger
    brother reports a similar dream in which he killed a doe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man hears the brothers, approves, and sends them out again; their
    fallen traps contain small animals, and they return with twelve little creatures
    for food.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The old man tells the brothers to hunt deer to the east, west, or north, but
    not to pass south of the lodge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder brother kills a deer and hangs part of it in a tree; the younger
    brother returns from another direction with the hide and meat of a doe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man asks which deer was killed first and claims the skin of the first
    slain deer for himself.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After twelve days without further game, the old man says success takes four
    trials and tells the brothers that if they kill another deer they must leave it
    undressed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the brothers kill another deer, the father gives detailed instructions
    for removing the head skin, body skin, pluck, and meat, and specifies who must
    carry each part.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The younger brother carries the pluck in the hide, brings it directly to the
    father, and hangs it on a mountain mahogany as instructed.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The father places his hands over the elder brother’s hands on the bow, aims
    at the pluck, and releases an arrow that penetrates the heart and lungs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The father tells the elder brother to pull the arrow fully through the pluck,
    makes him stand close to it, and blows on him toward the pluck.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The father says that to kill a buck the hunter should shoot into mountain
    mahogany, and to kill a doe he should shoot into cliff rose; a dead deer will
    be found where the arrow strikes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The deer head skin is prepared with a wooden hoop, sewn mouth, open eyeholes,
    hay stuffing, hanging in a tree, and viewing cuts in the neck.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: A tanned doe skin is painted red and gray to resemble antelope skin, and two
    short sticks are prepared to help the hunter creep in disguise.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: For four days no work is done except the elder brother’s practice in imitating
    the walk of a deer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The camp moves to White Standing Rock, and before hunting or seed gathering
    the old man has all men and women help build the hogan, which is completed in
    four days.
  category: sequence
  evidence_refs:
  - ev:9
