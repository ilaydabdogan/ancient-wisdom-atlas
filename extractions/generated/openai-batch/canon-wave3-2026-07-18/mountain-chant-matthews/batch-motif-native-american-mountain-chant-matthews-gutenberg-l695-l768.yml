canonical_text:
  quote: ''
  summary: A Navajo captive among the Ute is threatened with death unless he explains
    the use of his mask and buckskin robe. He reveals how they are used to deceive
    deer and instructs two young men in related practices over eleven days. While
    later working in camp, he sees an old woman who tells him to do something for
    himself, but she disappears. The next evening, while fetching water, he sees a
    pipe-smoking owl-masked form in the spring, which repeats the admonition and tells
    him to walk toward its voice next time. When he returns to the lodge, he finds
    a ritualized arrangement with dogs, four doors, four tobacco bags, four pipes
    at cardinal points, an old man and old woman at the doorway, and cords by which
    he is tied to the old pair.
  language: English
  quote_policy: summarized
