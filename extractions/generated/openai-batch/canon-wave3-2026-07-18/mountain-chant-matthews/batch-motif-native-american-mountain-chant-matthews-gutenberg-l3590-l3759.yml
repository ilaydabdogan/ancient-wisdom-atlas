canonical_text:
  quote: ''
  summary: The passage gives Navajo song texts with English translation and commentary
    for Mountain Sheep and Thunder songs. The songs name the Holy Young Man and Holy
    Young Woman with a great plumed arrow, sacred implement, treasure, sunbeam, and
    rainbow; describe a black sheep on a rock as a sign and song source; present deer
    and mountain sheep as appearing horned animals; and pair the voice of thunder
    above in a dark cloud with the voice of the grasshopper below among plants.
  language: Navajo song text with English translation and commentary
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One song states that a figure stands high upon something, and names the Holy
    Young Man and Holy Young Woman with the great plumed arrow, a sacred implement,
    and a treasure by which the figure is holy or supernatural.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary says this set of songs was first sung by a black sheep that
    stood on a rock as a sign to a Navajo fugitive.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sixth Song of the Mountain Sheep describes the Holy Young Man with a sunbeam
    and the Holy Young Woman with a rainbow, each with a sacred implement and treasure,
    and each encircled.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The commentary explains that the great plumed arrows borne by the holy pair
    are adorned with sunbeams and rainbows and that they shine in glory.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Twelfth Song of the Mountain Sheep says that Slender Horn, glossed as
    deer, and Turgid Horn, glossed as mountain sheep, appear far beyond, with becoming
    antlers or horns.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary says the Mountain Sheep song refers to the prophet's vision
    of the black sheep on the rock, and notes that the reason for introducing the
    deer is not obvious.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The First Song of the Thunder pairs a voice above, identified as thunder within
    a dark cloud, with a voice below, identified as grasshopper among plants; both
    voices sound again and again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Twelfth Song of the Thunder repeats the above/below thunder and grasshopper
    voice pattern and glosses the sound as productive of terrestrial beauty.
  category: speech
  evidence_refs:
  - ev:8
