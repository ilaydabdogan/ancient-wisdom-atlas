canonical_text:
  quote: ''
  summary: A traveling family moves through named places, gathers salt and food, crosses
    the San Juan River, and approaches a mountain hunting area. The young men repeatedly
    fail to obtain game. Their father says they lack knowledge and instructs them
    to build a sweat-house with specified woods, deer-associated materials, fire-heated
    stones, silence, washing with soap-root lather, stone traps, and an eastward sleeping
    posture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travelers halt at named places, cut native salt from under a great rock,
    and carry it in bags made from small-animal skins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The travelers kill two rabbits, prepare them by crushing and boiling them
    with powdered seeds, and eat the resulting soup.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old man directs his sons to find a ford and names the time for crossing
    the San Juan River; the group crosses and follows a branch stream toward [¢]epéntsa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near [¢]epéntsa the soil is covered with tracks of deer and other large game,
    but the young men hunt for four days without success.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: While the sons hunt, the old man cuts saplings and builds a house, and the
    daughters gather seeds for the family’s food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old man tells the young men that they bring home no food because they
    lack knowledge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: At dawn the old man instructs the young men to build a sweat-house with four
    specified woods placed in the east, south, west, and north.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sweat-house instructions include forked sticks and a poking stick with
    bark abraded by deer antlers, and plants favored by deer as browse spread on the
    floor.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The men heat stones, enter the sudatory, sweat in silence, and repeat the
    sweating four times.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The daughters prepare soap-root lather, and the sons wash their hair and bodies
    with it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The sons set twelve stone fall traps baited with aromatic sumac berries.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: That night the young men talk late with their father and then sleep side by
    side with their heads to the east.
  category: sequence
  evidence_refs:
  - ev:9
