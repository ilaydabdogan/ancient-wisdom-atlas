canonical_text:
  quote: ''
  summary: The passage describes the medicine lodge structure, including its east
    openings and a north-side irregularity later used as a hiding place. It then outlines
    early ceremonies involving participants taking an emetic around a fire, depositing
    sand and spent fire north of the lodge, receiving cooling medicine, and making
    sacrificial sticks. The fifth-day actions include preparation and sacrifice of
    kethawns and cigarettes, the sick woman receiving powdered medicine and reciting
    a prayer after the chanter, and an assistant preparing painted cherry-wood sticks
    and cigarettes intended for the gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lodge is described as a simple conical structure made of large piñon logs,
    covered with sods and loose earth, and measuring about eight feet high under the
    apex and about twenty-five feet in average base diameter.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The circle of logs is incomplete in the east, where the door and smoke-hole
    openings are located, and a short entry passage leads to an outer doorway hung
    with blankets.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: An irregularity in the lodge circumference on the north side is said to provide
    a hiding place for a man dressed in evergreens during ceremonies of the first
    night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first four days' ceremonies for this case had been performed during the
    previous year, though the passage notes that the work is usually done in nine
    consecutive days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Early in the morning, men and women who choose to participate enter the lodge
    before eating, sit around a fire made from four kinds of dry wood, and take a
    hot emetic infusion made from fifteen kinds of plants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A little sand is placed before each participant to receive the ejected material,
    and after the emetic has acted each participant's sand pile is removed and deposited
    north of the sacred fire in sequence.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: After the participants return to the cooled lodge, the shaman spits cooling
    medicine mixed with hoar-frost on each person.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the earlier fire is removed and a new fire of ordinary wood is kindled,
    the kethawns or sacrificial sticks appropriate to the day are made.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the fifth day, the forenoon is devoted to preparation and sacrifice of
    kethawns and sacrificial cigarettes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sick woman enters the medicine lodge, and the chanter applies powdered
    medicine to several parts of her body in a named order, gives some to be swallowed,
    and throws some toward the heavens through the smoke hole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sick woman kneels on a sheep skin facing east, holds the medicine bag,
    and recites a prayer bit by bit after the chanter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: An assistant daubs a straight cherry branch with moistened herbaceous powder,
    divides it into four pieces with a flint knife, cuts gashes in the pieces, and
    paints them with black, red, and white rings using a shred of yucca leaf as a
    brush.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Two cigarettes are made from sections of a hollow stem filled with pulverized
    plants, and the passage states that such cigarettes are intended to be smoked
    by the gods.
  category: object
  evidence_refs:
  - ev:8
