canonical_text:
  quote: ''
  summary: 'The passage presents several Navajo Mountain Chant songs and ritual texts
    with translations and notes: a song to the San Juan River; a song for building
    the dark circle; a prayer to Dsilyi` Neyáni asking restoration and beautification;
    and part of a Rising Sun Dance song involving Holy Young Man, Holy Young Woman,
    arrows, the sun, and the moon.'
  language: English with Navajo song text and translated terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The San Juan River song uses water terms translated as flowing water or river,
    broad water, and water of old age, with a phrase in which the speaker's mind goes,
    comes, or wanders across it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the dark-circle song, Reared Within the Mountains carries a black spruce
    sapling, a dance implement, and a holy treasure or magic wand; the Holy Young
    Woman carries a blue spruce sapling, a dance implement, and a holy treasure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note says evergreen poles used in the dance and in making dark circles
    were observed as piñon, but that spruce is probably the true sacred tree and piñon
    a convenient substitute.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dark-circle song is sung by the shaman at the eastern gate while young
    men build the corral, and the given form is ordinarily recited when the patient
    is a woman.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prayer addresses Dsilyi` Neyáni as chief or master of the mountains, young
    man, and chieftain; it says a particular sacrifice and smoke or cigarettes have
    been made for him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The prayer asks for restoration, repair, and beautification of feet, lower
    extremities, body, mind, voice, words, what is before and behind, and, in related
    prayers, all that is above, below, and around.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The chanter pronounces each line of the prayer and the patient repeats it
    after him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Rising Sun Dance song, the sunrise stanza links Holy Young Man, a great
    plumed arrow that is swallowed and withdrawn, and the sun's satisfaction; the
    sunset stanza links Holy Young Woman, a cliff-rose arrow, and the moon.
  category: action
  evidence_refs:
  - ev:6
