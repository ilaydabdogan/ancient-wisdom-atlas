canonical_text:
  quote: ''
  summary: The passage gives a brief song about the sunset, the Holy Young Woman,
    a cliff rose arrow, and the satisfied moon; an explanatory note about the dance
    of the great plumed arrow and the sun rising on a pole; ritual instructions for
    the akáninili involving an identifying object, meal-sprinkling at landscape crossings,
    and a plumed wand from a holy place; a prayer by the prophet to his mask; and
    the prophet’s farewell words about gods coming from a holy place and signs in
    rain, thunder, harvest birds, and grasshoppers.
  language: English with Navajo terms transcribed in the source
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The song is set where the sun sets and names the Holy Young Woman, a cliff
    rose arrow, and the moon, which is said to be satisfied.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The explanatory note says the song is sung during a dance and that, after
    the great plumed arrow dance is properly performed, the sun should be satisfied
    and rise on a pole when desired.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The instructions say an object will make the recipient rise or progress, carry
    him along, make people know him, and hang around his neck.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The instructions require meal to be sprinkled across little valleys, gullies
    or arroyos, a tree root, and flat rocks; after sprinkling across the tree root,
    the person steps across it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The translator states that the 'great prepared arrow' refers to the plumed
    wand carried by the akáninili, that it is from a holy place, and that people know
    him by means of it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the prayer, the prophet addresses his mask as a domestic animal or pet,
    says it formerly assisted or granted requests and was alive once, asks not to
    die, and asks the mask to watch over him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the last words, the prophet greets or bids farewell to his younger brother,
    says the gods have come for him from a holy or supernatural place, and says the
    younger brother will never see him again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prophet says that when rain passes and thunder occurs, the younger brother
    should think it is the elder brother’s voice, and that in harvest time small birds
    and grasshoppers should be understood as the elder brother’s ordering or design.
  category: speech
  evidence_refs:
  - ev:8
