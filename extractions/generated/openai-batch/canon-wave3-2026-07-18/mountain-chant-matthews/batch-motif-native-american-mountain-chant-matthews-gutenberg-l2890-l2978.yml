canonical_text:
  quote: ''
  summary: 'The passage describes two performed spectacles involving animated objects:
    an eagle plume made to dance with a human dancer, and a comic performance in which
    boys and an old man burlesque the word thÃ²hay while a weasel image moves among
    spruce twigs. It then introduces the four great ceremonial pictures, describes
    the initiated assistants and ritual specialists involved in making them, and explains
    the exact system, materials, corrections, and directional color scheme used in
    drawing sacred figures.'
  language: English
  quote_policy: summarized
