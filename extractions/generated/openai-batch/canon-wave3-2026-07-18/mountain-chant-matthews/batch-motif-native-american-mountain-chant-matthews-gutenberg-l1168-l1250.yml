canonical_text:
  quote: ''
  summary: The Navajo traveler enters successive hill and mountain dwellings inhabited
    by butterfly beings, Holy Woman, bear-maidens, wind gods, and holy young men.
    He is bathed, painted, adorned, transformed, given white lightning as a path and
    power, and instructed in sacrificial sticks and ritual postures that are to be
    imitated in ceremonies among humans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Narrow Sand Hills the travelers enter a hill and come to the house of Ka¢lùgi,
    the Butterfly, a dwelling filled with butterflies and rainbows.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Niltci disappears at the butterfly dwelling, and the woman questions the Navajo
    about who he is.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman brings a large white-shell basin filled with water and soap root and
    tells the Navajo to bathe his body and wash his hair before visiting fair and
    beautiful people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: House of Feathers applies fine corn meal to body parts associated in the passage
    with healing ceremonies, directs the Navajo to rub himself with meal, and has
    him paint his face white and his legs and forearms black with white spots.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The completed body painting is identified in the passage as the painting of
    the akáninili, the courier sent to summon guests to the dance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Butterfly Woman pulls and stretches the Navajo's hair until it reaches his
    ankles and works his body and face until he has the form and features of a beautiful
    youth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hosts give him white moccasins, a beaver-skin collar with a whistle, and
    plumed sticks representing wings, dress him like the akáninili, give him white
    corn meal mixed with water to eat, and he sleeps in the house of butterflies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the morning Butterfly Woman places two streaks of white lightning on the
    ground, tells him the lightning is his to use, and points him to a white-lightning
    trail leading to Bistcàgi mountain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Navajo follows the lightning trail into the dwelling of Holy Woman inside
    a black mountain; the door is of trees, with the sun on the east wall and the
    moon on the west wall.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Holy Woman's house he is shown a sacrificial stick and told how to make
    and bury it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Two wind gods and a butterfly god appear, and a party of four sets out for
    Tcùckai.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Tcùckai they enter a two-story house inside a mountain, with four rooms
    on each story and four tree-covered doorways marked by differently colored spruce
    trees in the four directions.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Four Maidens that Become a Bear live in the Tcùckai house; they have white
    faces, shaggy hair on legs and forearms, human-like hands, and long pointed teeth.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The first Maiden that Becomes a Bear is said to have learned from coyote how
    to convert herself into a bear; she is described as an invulnerable warrior who
    removes and hides her vital organs during battle and restores them afterward.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The bear-maidens show the Navajo how to make four sacrificial sticks and how
    to bury them for sacrifice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: At the house of four Holy Young Men, the rooms look cavern-like but the house
    is made of water; plumed arrows hang on the walls and are held by young men standing
    in the four directions.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Navajo receives no sacrificial stick from the Holy Young Men, but is told
    to observe how they stand so he can imitate them in rites he will establish among
    humans.
  category: speech
  evidence_refs:
  - ev:9
