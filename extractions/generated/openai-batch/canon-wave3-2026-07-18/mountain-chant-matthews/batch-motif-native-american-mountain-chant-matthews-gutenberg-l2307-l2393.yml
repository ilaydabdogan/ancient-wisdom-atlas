canonical_text:
  quote: ''
  summary: 'The passage describes an afternoon pause in medicine-lodge ceremonies,
    the gathering of people and preparation of shelters, the making of an earth-baked
    corn cake for ritual workers, and ninth-day preparations of ritual properties:
    wands, plumed arrows, and piñon saplings used in nighttime performances. It also
    describes singing, rattling, powdered medicines placed on performers'' tongues,
    rehearsal, and the performers'' serious fear of divine displeasure if the acts
    are not done properly.'
  language: English
  quote_policy: summarized
