canonical_text:
  quote: ''
  summary: The passage describes the eleventh dance of the Navajo Mountain Chant as
    a fire dance or fire play, including the entry of ten men, cedar-bark fire bundles,
    four-direction fire actions, flame handling on bodies, spectator actions with
    fire fragments, explanations of possible burn protection, and closing ceremonies
    involving water, chanting, openings in the branch circle, and variation among
    later performances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The eleventh dance is identified as the fire dance or fire play and is described
    as especially picturesque and startling.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the dancers enter, buffalo-horn sounds are mingled with strange crane-like
    trumpeting sounds that grow louder and approach the eastern opening.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ten men enter; all except the leader carry long thick bundles of shredded
    cedar bark in each hand, while the leader carries four small fagots of the same
    material.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The dancers circle the central fire four times while waving bark bundles toward
    it, then halt in the east.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The leader lights and throws small cedar-bark brands toward the east, south,
    west, and north, and before throwing the northern brand he lights the bundles
    held by the other dancers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some spectators blow into their hands and make a tossing motion after each
    departing flame.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the bundles are lit, the band races around the fire, spits a substance
    of supposed medicinal virtue on one another, and the moving brands produce long
    flame streamers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dancers apply flaming brands to their own nude bodies and to the bodies of
    others, sometimes striking, rubbing, or bathing backs with flame while trumpeting
    sounds accompany the applications.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Extinguished brands are relit in the central fire; brands too consumed to
    hold are dropped, and dancers leave the corral one by one.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the performers leave, many spectators pick up fallen cedar-bark fragments,
    light them, and bathe their hands in the flames as a charm against harmful effects
    of fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator reports seeing performers immediately after the fire show who
    seemed happy and uninjured; the passage also reports a Navajo claim that the substance
    called azÃ¨-sakÃ¡zi or cold medicine is a prophylactic against burns.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator suggests that low-temperature cedar-bark ignition and a coating
    of white earth on bodies may have contributed to protection from burns.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: In closing ceremonies witnessed on other occasions, an assistant passes around
    the fire four times and sprinkles water on smoldering embers while the medicine
    man chants.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Three gaps are torn in the branch circle in the south, west, and north, making
    four entrances when combined with the original east gate; after sunrise the entire
    branch circle is razed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: In one later ceremony, the chanter packs up sacred utensils and leaves soon
    after sunrise, and the patient is said not to be permitted to sleep until after
    sunset.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The narrator states that later performances may differ and that all the alilis
    may be modified.
  category: attribute
  evidence_refs:
  - ev:10
