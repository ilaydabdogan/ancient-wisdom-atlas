canonical_text:
  quote: ''
  summary: The passage describes a Navajo ceremonial picture with four differently
    colored divine forms arranged toward the cardinal directions, each associated
    with a same-colored plant, ornaments, rattles, charms, baskets, lightning/cloud
    markings, and plumes. The plants grow from central waters and form a second cross
    toward the intermediate directions. An anthropomorphic rainbow deity encloses
    most of the picture and has empty hands for a ritual potion bowl. Two bluebirds
    appear in the eastern opening as sacred morning heralds and guards of the gods'
    dwelling.
  language: English
  quote_policy: summarized
