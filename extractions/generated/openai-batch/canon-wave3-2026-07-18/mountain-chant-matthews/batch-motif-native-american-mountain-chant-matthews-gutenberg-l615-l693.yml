canonical_text:
  quote: ''
  summary: A Navajo man is captured by Ute horsemen, threatened, spared by an old
    man, and forced under guard across rivers and plains with little food. He is brought
    to a Ute encampment on a plain between four mountains, led to a black-and-white
    tent with a forked pole, prays to the deer head associated with his mask, is circled
    by an old man dancing and an old woman whistling, then is fed berries and allowed
    to sleep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Navajo man wipes away tears, goes to the place where he laid his mask
    and arms, puts on his buckskin coat, and begins to put on his mask.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A crowd of Ute horsemen approaches from the south, divides into two lines,
    advances, and surrounds him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young Ute man aims an arrow at the Navajo's breast, but an old man speaks
    to the party and the young warrior lowers the arrow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The old man seizes the captive by the arm; after discussion among the Ute,
    the captive is made to move on while horsemen follow and guard him in a semicircle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: During the first night of captivity, the Ute watch him closely, give him nothing
    to eat, bind his feet and hands, and cover him with untanned buckskin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: On the journey, the captive is given only small portions of food, including
    a palmful of service berries, deer feet, and a piece of liver; he secretly saves
    part of the liver.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: One Ute takes pity on the captive and lends him a horse to ride for an afternoon
    while the owner walks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The captors indicate by signs that a large river is the last river they will
    cross before home; beyond it lies a great plain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The captive sees distant mountains, finds no hiding place on the desert plain,
    continues on foot, and weeps along the way.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: The party reaches a plain between four mountains, one each to the east, south,
    west, and north, with a large Ute encampment scattered across it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: One tent in the encampment has a black-painted top, a white-painted base,
    and a forked pole set in the ground in front of it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The old man who saved the captive leads him to the black-and-white tent; the
    old man hangs his arms and accouterments on the pole, and the captive hangs his
    deer skin mask and robe on the forks and lays his crutches against the pole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The captive prays to the head of the deer, saying it has helped him before
    and asking it to keep him from dying and watch over him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: After the prayer, an old man dances around the captive, and an old woman with
    a whistle whistles all around him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The narration explains the dancing and whistling as joy because the Ute had
    captured someone from an alien tribe; afterward the captive is sent into the tent,
    fed a large bowl of berries, and allowed to sleep undisturbed.
  category: sequence
  evidence_refs:
  - ev:5
