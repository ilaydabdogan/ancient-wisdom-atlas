  summary: 'The passage describes a day of the Mountain Chant ceremony: ritual couriers
    depart and return, an elaborate picture is painted and consecrated, a sick woman
    is treated with corn meal, infusion, fumigation, and dust from painted divine
    figures, spectators collect sacred substances, the picture is ritually obliterated,
    and the northern courier returns after a long run said to follow mythic examples.'
