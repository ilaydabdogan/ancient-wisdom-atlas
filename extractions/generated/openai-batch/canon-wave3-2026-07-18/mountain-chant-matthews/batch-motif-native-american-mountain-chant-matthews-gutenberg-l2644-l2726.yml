canonical_text:
  quote: ''
  summary: 'The passage describes the sixth, seventh, and eighth dances of a Navajo
    ceremony: a standing-arc dance in which eight performers place decorated semicircular
    arcs on one another''s heads; a wand dance with fire salutation, yucca leaves,
    and a prayer to the sun; and an eighth dance in which a sun effigy is revealed
    at the base of an upright decorated plank and is made to ascend and descend the
    plank.'
  language: English
  quote_policy: summarized
