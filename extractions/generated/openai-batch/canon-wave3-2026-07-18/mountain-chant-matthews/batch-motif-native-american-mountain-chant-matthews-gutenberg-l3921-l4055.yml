canonical_text:
  quote: ''
  summary: The passage gives translations and notes for several Navajo ceremonial
    songs. One song presents the Holy Young Man and Holy Young Woman as belittling
    each other and their notched sticks or magic wands. An Awl Song describes the
    Maid Who Becomes a Bear and the Holy Young Woman walking far around on mountains.
    Exploding Stick songs describe the Young Woman Who Becomes a Bear setting fires
    in the mountains, the Otter setting fires in the waters, a related drought legend
    in which smoke clouds bring rain, and later the Maid Who Becomes a Bear and Holy
    Young Woman seeking and finding the gods on mountain peaks or cloud summits with
    sacrifice. A note explains the sharp explosive drum strike accompanying the Exploding
    Stick songs.
  language: English
  quote_policy: summarized
