canonical_text:
  quote: ''
  summary: 'The passage explains Navajo color symbolism for directions, worlds, and
    gender, then describes two ceremonial pictures: a third picture commemorating
    Dsilyi` Neyáni''s visit to the Lodge of Dew, with giant directional goddesses,
    weasels, ritual objects, choke cherry, spruce, and a rainbow enclosure; and a
    fourth picture representing the great plumed arrows as a potent healing charm
    arranged according to cardinal order.'
  language: English
  quote_policy: summarized
