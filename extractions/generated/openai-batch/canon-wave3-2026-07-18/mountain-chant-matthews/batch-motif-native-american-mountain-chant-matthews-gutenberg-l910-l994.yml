canonical_text:
  quote: ''
  summary: A Navajo fugitive fleeing Ute captors is successively hidden by Bushrat
    in a den beneath a flat rock and by Kleyatcini behind a door in volcanic rock.
    In Bushrat's home, the wind god warns him against accepting refuse as food and
    later against eating rat food inside the rats' home, lest he become a rat. The
    Ute pursue and try to reach him with a stick but fail. Kleyatcini later points
    him toward the mountains where his home lies.
  language: English
  quote_policy: summarized
