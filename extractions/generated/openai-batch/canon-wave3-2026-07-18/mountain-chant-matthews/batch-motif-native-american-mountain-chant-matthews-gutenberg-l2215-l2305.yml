canonical_text:
  quote: ''
  summary: 'The passage describes late events of one day and the seventh and eighth
    days of a Navajo Mountain Chant ceremony: preparation of ritual spaces, sand paintings,
    treatment of a sick woman and her companion with meal, pollen, infusion, sprinkling,
    colored dust, fumigation, repeated obliteration of sacred pictures, and building
    a large wood stack for the final-night central fire.'
  language: English
  quote_policy: summarized
