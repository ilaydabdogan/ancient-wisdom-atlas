canonical_text:
  quote: ''
  summary: The passage describes the elder and younger brothers hunting deer under
    their father's repeated warning not to go south. The elder brother uses a deer
    mask to imitate deer and kill a buck, later hunts alone, becomes curious about
    the forbidden south, disobeys the injunction, crosses the San Juan River, climbs
    a hill, looks north toward the mountain homeland of [¢]epéntsa, sings of flowing
    water in homesickness, and is heard by the gods, who are said to be about to grant
    his wish to return in an undesired manner.
