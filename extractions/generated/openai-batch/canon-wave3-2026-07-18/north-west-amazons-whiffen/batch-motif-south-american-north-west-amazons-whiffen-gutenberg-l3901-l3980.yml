canonical_text:
  quote: ''
  summary: The passage describes practical hunting and fishing techniques among Northwest
    Amazonian groups, including water-baited traps, stake pits, log traps, poisoned
    javelins, territorial hunting and fishing rights, group differences in hunting
    and fishing, hooks, nets, fish traps, water poisoning, spears, tridents, harpoons,
    and bow-and-arrow fishing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shallow pan of water is used as bait for ground vermin; concealed holes
    around it hold rats, mice, frogs, and small snakes until the trapper collects
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For larger animals, hunters dig lines of pits with sharpened upright stakes
    at the bottom, conceal the openings with sticks and leaves, and drive game over
    them so that animals fall in and are impaled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Karahone arm pits with poisoned arrows and make a succession of death-traps
    down a forest avenue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A log trap is set in a forest run with rough brushwood fences on either side;
    pressure on a footboard releases a heavy trunk onto the intruder.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A tapir is sometimes killed with a throwing javelin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The javelin is a light spear with a poisoned palm spine at the point; the
    spine is filed so that it breaks off in the wounded animal.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man commonly carries seven javelins in his hand and seven in reserve in
    a bamboo case, though sometimes only five are carried in the hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hunting and fishing rights are described as well-defined; barriers may be
    erected in bush and rivers, and groups keep to their own localities to avoid quarrels
    and war.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Tukana are described as fishers but not hunters; the Boro are described
    as great hunters who do not fish; the Witoto and Okaina are described as especially
    skilful fishing tribes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Fish are taken by hook and line, nets and traps, water poisoning, spearing,
    and shooting with bows and arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Fish-hooks are made from wood, bone, or spines; metal hooks are sought after;
    the Witoto fakwasi is a hook made of wood or palm spine and used with a fibre
    line or rod and line.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hand nets are made of chambiri palm-fibre; larger nets or fences are fixed
    across streams; in the dry season, pools are dragged with nets or baled out with
    gourds so fish can be taken by hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The matapi fish trap is a basket open at one end but too narrow for a sizable
    fish to turn around, preventing escape because the fish cannot swim backward without
    turning.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Fish are speared with a wooden trident or stabbed with a bamboo spear with
    a double-edged blade.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Some lower Amazon Indians use harpoons with detachable heads for manatee or
    river dolphin, while in the upper waters dolphins are rarely seen and are speared
    with tridents; the Menimehe shoot fish with bow and arrow.
  category: relationship
  evidence_refs:
  - ev:9
