  - ev:6
- id: obs:7
  text: The passage states that Jivaro dried human heads and mummified heads are unknown
    in the district discussed, while reduced heads are said to occur among some tribes
    south of the main Amazon River.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'Among the Issa-Japura tribes, the head is treated as a trophy: fleshy parts,
    hair, and teeth are removed; the skull is hung in a plantation patch for ants
    and insects to clean; it is dried in the sun and later suspended outside or in
    the house.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At a feast, prisoners are killed, their heads are removed to be danced with
    and later dried as trophies, and their bodies are divided among feasters.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Only legs, arms, fleshy parts of the head, hands, feet, and the male genital
    organs are described as used at the feast; intestines, brains, and trunk are described
    as filthy or not eaten.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The male genital organs are given to the wife of the chief, who is described
    as the only woman having any share in the feast.
  category: relationship
