- id: obs:2
  text: The passage states that animal food is scarce, that slain enemies and prisoners
    provide meat, and that anthropophagy is presented as an effect of war rather than
    the cause of war.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A possible belief in assuming the characteristics of the eaten is mentioned,
    but the passage says this has the least weight among the stated reasons.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that, if food-quest were less important, human flesh would
    be eaten ceremonially as a ritual insult.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage denies intra-tribal cannibalism, eating tribal members, extracting
