canonical_text:
  quote: ''
  summary: The passage presents the author’s explanation of anthropophagy among the
    tribes discussed as primarily vengeance and ritual insult against enemies, with
    food scarcity and possible incorporation of characteristics as secondary explanations.
    It denies intra-tribal cannibalism and eating relatives, rejects or contrasts
    several reported customs from other groups, describes skull trophies cleaned by
    insects and displayed, and gives details of a cannibal feast involving prisoners,
    head trophies, selective consumption of body parts, and a special share for the
    chief’s wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anthropophagy is described as a system of vengeance and a supreme insult against
    an enemy, with degradation of the dead compared to treatment as slaughtered animals.
  category: relationship
  evidence_refs:
