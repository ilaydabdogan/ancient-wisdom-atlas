canonical_text:
  quote: ''
  summary: 'The passage describes outsider contact dynamics in Northwest Amazonian
    ethnographic narration: some groups reject intercourse and leave an apparently
    occupied house empty; hidden defenders use poisoned weapons and fire against intruders;
    a traveler seeking acceptance must conform to local custom; a chief may receive
    a visitor through declaration of friendship, food, gifts, council discussion,
    and tobacco-pot assent; proverbs warn against allegedly poisoned hammocks, narcotic
    smoke, and poisoned pineapple gifts.'
  language: English
  quote_policy: summarized
