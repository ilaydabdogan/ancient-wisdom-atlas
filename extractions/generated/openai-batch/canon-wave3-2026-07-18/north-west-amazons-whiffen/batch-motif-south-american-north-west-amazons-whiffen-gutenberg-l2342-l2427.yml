  summary: The passage describes hostile relations, social ranking, fear of enemy
    magic, revenge killings, limited intertribal commerce, marriage restrictions and
    exceptions, indirect circulation of goods, migratory tribal localities, and corrections
    to earlier tribal classifications among groups in the middle Issa-Japura region.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that tribes north and south of the Japura River hold a mortal
    antipathy toward each other and that lighter-skinned groups despise darker groups.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Maku are described as small dark people who are generally regarded and
    treated as slaves.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Andoke are described as feared tyrants and bullies, and Boro carriers
    are said to refuse to enter bush in Andoke country.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says most groups live in constant internecine strife, though some
    intertribal commerce occurs between certain groups.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage gives examples of mutual hatred forming a weak tie among other
    groups, including Boro, Resigero, and Okaina shared detestation of the Witoto.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Some specific marriage relations are reported: Boro and Resigero intermarry
