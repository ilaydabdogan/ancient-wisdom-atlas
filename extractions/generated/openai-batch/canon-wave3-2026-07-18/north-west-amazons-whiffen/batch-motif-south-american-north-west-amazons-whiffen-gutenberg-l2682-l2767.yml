  quote: ''
  summary: The passage introduces a chapter on dress and ornament and describes local
    clothing, adornment, and visual markers among Boro, Witoto, Andoke, Orahone, and
    other north-west Amazonian groups. It contrasts published depictions with the
    author's account of actual appearance in native settings, describes chiefs, warriors,
    women, men, and medicine-men, and notes objects such as bark-cloth garments, tooth
    necklaces, weapons, a scarlet turban, an admired palm-fibre bag, and tapir-hide
    vestments.
  language: English
