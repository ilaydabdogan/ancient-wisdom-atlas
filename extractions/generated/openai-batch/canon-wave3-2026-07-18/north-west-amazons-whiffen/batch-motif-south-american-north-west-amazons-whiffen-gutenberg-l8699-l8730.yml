  summary: The passage argues that multiple useful arts among the described Amazonian
    groups appear undeveloped or lost. It discusses fire carrying, tobacco licking,
    fibre rolling, hammock plaiting, rudimentary loom use, raft-making instead of
    dug-out canoes, possible loss of canoe-making by disuse, and concludes that the
    forest arrested development rather than reducing a later culture to a Stone Age
    condition.
