    female offspring to be like themselves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the Amazon river name was connected with this warrior-women
    tale and that later reports mentioned traditions of women without husbands.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author says he did not hear local stories of women fighting and adds that
