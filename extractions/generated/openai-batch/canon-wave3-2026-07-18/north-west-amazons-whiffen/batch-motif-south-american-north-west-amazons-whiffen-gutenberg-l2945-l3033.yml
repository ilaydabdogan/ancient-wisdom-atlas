canonical_text:
  quote: ''
  summary: The passage describes dance girdles, bead ornaments, necklaces, tooth necklaces,
    metal pendants, and substitute ornament materials among Issa-Japura, Karahone,
    Boro, Okaina, and related north-west Amazonian groups. It emphasizes dance-only
    use of women’s girdles, personal ownership, bead trade and scarcity, ornaments
    as valued possessions, and tooth necklaces as displays of hunting, warfare, and
    vengeance status.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women of the Issa-Japura tribes wear broad girdles for a dance, remove them
    when the dance ends, and do not wear them on other occasions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dancing girdles are made by women from seeds or Brummagem beads strung
    into lengths and fastened into a broad flat band with color designs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Beads are passed inward from the Rubber Belt from tribe to tribe; dark beads
    are especially sought, black and white are most prized, and red and white is commonly
    seen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Any woman may possess a dancing girdle, and the girdle is described as an
    individual possession rather than a tribal possession.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Karahone women especially treasure beads and may wear many bead chains; a
    Boro woman is described as wearing a neck appendage made from several pounds of
    white beads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Both men and women wear necklaces made of beads, animal teeth, human teeth,
    ivory-like teeth, discs, shells, seeds, and other strung materials.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Metal pendants are rare and cherished; they are usually thin, flat, triangular
    pieces of beaten metal from coins or old brass cartridge cases and may hang from
    a necklet or ear-plug.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Necklaces disclose the status of wearers; tooth necklaces indicate a warrior’s
    hunting success and bravery in war.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A string of human teeth is described as especially envied because it witnesses
    revenge; the teeth come from an enemy, and a man wears only teeth of foes or game
    he has killed himself.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: At a man’s death, his tooth string is buried with him unless he is killed
    by a foe, in which case the string may become part of the victor’s spoils.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Human teeth are not bored but are bound into necklaces with fine fibre string;
    other teeth are bored through the fang.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: Where trade beads are scarce, ornaments may be made from red and black seeds,
    bits of bone, cane, reed, red berries, or black beetles strung on fibre.
  category: object
  evidence_refs:
  - ev:7
