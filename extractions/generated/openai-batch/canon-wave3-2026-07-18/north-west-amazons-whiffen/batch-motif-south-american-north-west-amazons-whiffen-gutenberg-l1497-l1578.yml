  quote: ''
  summary: 'The passage describes hazards and irritations encountered in Northwest
    Amazonian forest and river travel: thorned palms and climbing plants, feared snakes,
    biting flies, ticks, wasps, bees, mosquitoes, sand-flies, and stinging caterpillars.
    It also contrasts the brilliant beauty of butterflies and other insects with butterflies''
    feeding on offal, manure, blood, and hunted kills.'
