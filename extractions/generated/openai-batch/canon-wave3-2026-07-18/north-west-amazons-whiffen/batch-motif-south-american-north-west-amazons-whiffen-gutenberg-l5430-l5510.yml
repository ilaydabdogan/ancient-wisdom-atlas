  text: Betrothals are often arranged in childhood by parents, and small children
    may occasionally be married in a ceremony formally like that used for adults.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among some Andoke groups, child marriage is described as allowed if the boy
    has made a plantation and successfully hunted an animal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that men often choose much younger girls, who are handed
    over to the women of the man’s family and live with his people until pubescence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The usual residence rule described is patrilocal: the woman comes to live
    with the man’s family, and the man does not go to hers.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A rare reported exception to patrilocal residence occurs when a chief without
    a son marries his daughter to a man in order to obtain an heir through her.
