canonical_text:
  quote: ''
  summary: 'The passage describes reported marriage customs among Andoke, Boro, Witoto,
    Kuretu, and neighboring groups of the north-west Amazon: childhood betrothal or
    child marriage, patrilocal residence, rare matrilocal arrangements for a sonless
    chief seeking an heir, ceremonial gifts and symbolic objects offered by a suitor,
    and a reported bride-capture-style marriage rite north of the Japura, including
    a Kuretu version with ritualized protest.'
  language: English
  quote_policy: summarized
literal_observations:
