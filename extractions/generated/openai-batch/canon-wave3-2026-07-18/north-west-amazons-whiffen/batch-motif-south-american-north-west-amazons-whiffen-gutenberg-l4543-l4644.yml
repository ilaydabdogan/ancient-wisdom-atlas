canonical_text:
  quote: "“Cassava, then, is the Indian’s ‘staff of life.’”"
  summary: The passage describes manioc/cassava preparation, regional variations in
    wringers and starch use, cooking on open fires, sauces and leaf preparations,
    the household pepper-pot, scarcity and value of salt, and ordinary eating habits
    involving cassava, meat, coca, and fruit.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Fresh and rotten manioc are removed from a pan, grated in a wooden trough
    with palm-spine teeth, then compressed in a cassava wringer until the poisonous
    juice drains away; the remaining material is dried as coarse flour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The manioc flour is sifted, baked on a clay platter, kneaded with water, and
    cooked over fire to make tough unleavened cassava bread.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Boro, Andoke, Resigero, Okaina, and tribes to the north are said to use
    a cylindrical palm-cane cassava-squeezer, while the Witoto and other southern
    tribes use a long rectangular palm-fibre wringer twisted into a cylinder.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cooking is described as taking place on large earthenware plates over open
    fires, with pots set on three logs or on tripods of branches; embers can be fanned
    with a palm leaf to make a flame.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Andoke, women peel manioc with their teeth, wash and pulp the roots,
    wash out starch over a calabash, strain the pulp in a cassava-squeezer, mix it
    with starch, sift it, bake it, and boil the drained water into a sweet drink.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the Boro and Witoto, manioc water is boiled until thick and used as
    a dipping sauce; Boro people on the Japura season such sauce with peppers and
    fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Manioc leaves are also eaten after boiling, pounding, and seasoning with fish,
    worms, frogs, ants, and peppers, or cooked in root-squeezed water into a paste
    carried as an emergency ration.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cassava is explicitly described as the Indian's staple food, complemented
    by a pepper-pot soup that simmers constantly in each family’s large pot and is
    replenished from kills.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mineral salt is described as unavailable in the middle Issa-Japura regions
    except through barter, with some salt obtained by burning saline plants; a gift
    of salt is said to be highly appreciated.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Indian is described as eating at sunrise after tea and a first bath, usually
    taking cold cassava cake, leftover meat, or hot-pot, eating sparingly before a
    march or hunt, carrying food only for journeys, and regarding coca as sufficient
    stimulant sustenance.
  category: sequence
  evidence_refs:
  - ev:8
