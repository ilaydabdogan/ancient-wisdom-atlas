canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing medicine-man healing practices: noisy
    exorcistic performances in dark malokas, use of drugs and ritual substances, spirit
    communication and divination, diagnosis of sickness, isolation taboos for patients,
    kin removal of sick women, and a witnessed Okaina healing in which a medicine-man
    sucked out an alleged evil spirit from a fever patient who recovered by the next
    morning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sickness is described as caused by an evil spirit that the medicine-man seeks
    to expel.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
- id: obs:2
  text: The maloka is kept dark during the medicine-man’s visit, without torches or
    stirred-up fires.
  category: setting
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: The medicine-man beats the floor with a palm branch, shakes a rattle, makes
    loud noises, and imitates forest animals and birds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that greater noise and wilder excitement are treated as
    signs of stronger magic.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The medicine-man uses tobacco juice and coca, drinks from a liana, enters
    intoxication and deep sleep, and is supposed in that state to communicate with
    the unseen world, wander in spirit, and foretell the future.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Relatives recount the sickness, and the medicine-man identifies or interprets
    the source of evil, often in ambiguous phrasing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: An invalid may be given a strong narcotic drink, carried to a clearing in
    the bush, and left under a rough shelter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: No one may speak to or pass the isolated patient; if the patient dies, the
    medicine-man attributes the death to a transgression of this rule.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A sick wife may be taken away by her relatives, and the passage describes
    a Bara case where ceremonial hostility occurred without a tribal quarrel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Okaina case, the medicine-man put coca in his mouth, placed his lips
    on the fever patient’s lips, sucked up the contents of her mouth, went outside,
    expectorated, and announced that he had removed the evil spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The fever patient was reported perfectly well the next morning, and the narrator
    described the event as an extraordinary faith cure.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that faith in medicine-men’s healing powers extended beyond
    tribesmen, giving one example from a rubber-district household.
  category: relationship
  evidence_refs:
  - ev:8
