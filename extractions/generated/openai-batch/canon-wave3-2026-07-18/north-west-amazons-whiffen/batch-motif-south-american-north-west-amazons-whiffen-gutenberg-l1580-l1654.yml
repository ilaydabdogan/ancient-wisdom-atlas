canonical_text:
  quote: Ants are the greatest curse.
  summary: 'The passage describes conditions in the north-west Amazon forest: stinging
    ants force travelers between land and water; snakes and other reptiles are said
    to avoid humans unless disturbed; alligators are small and not formidable in the
    Issa and Japura; frogs, toads, monkeys, and birds produce intense noises at certain
    times; and the forest is characterized by oppressive silence interrupted by sounds
    of predation and animal calls.'
  language: English
  quote_policy: quoted
