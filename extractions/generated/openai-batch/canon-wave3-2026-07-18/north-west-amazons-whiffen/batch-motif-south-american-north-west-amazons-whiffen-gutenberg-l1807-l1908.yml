canonical_text:
  quote: ''
  summary: 'The passage describes an Amazonian maloka homestead: a single large thatched
    communal house in a forest clearing, few external signs of occupancy, temporary
    use followed by abandonment and burning, relocation for soil and security reasons,
    hidden paths away from rivers, a cleared dancing ground, and construction from
    local forest materials including poles, lianas, palm leaves, bamboo, and water-soaked
    bindings.'
  language: English
  quote_policy: summarized
