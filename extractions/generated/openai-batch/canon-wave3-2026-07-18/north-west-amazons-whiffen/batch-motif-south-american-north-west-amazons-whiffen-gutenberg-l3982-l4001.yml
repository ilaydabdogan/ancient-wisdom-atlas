canonical_text:
  quote: ''
  summary: The passage describes several Northwest Amazon fishing methods using plant
    poisons. Babbasco root is pounded and placed in streams near dams or weirs so
    fish become distressed, narcotized, or dead and can be gathered with leaves, nets,
    or spears. Napo, Witoto and Issa-Japura, and Tapajos practices are distinguished,
    including the Tapajos use of timbo liana. The author states that babasco and timbo
    do not make the fish unsafe for human food.
  language: English
  quote_policy: summarized
