canonical_text:
  quote: ''
  summary: The passage describes preparation, administration, effects, containers,
    curative or ceremonial uses, and taboos connected with coca, parica/niopo snuff,
    and tobacco among named Northwest Amazonian groups. It includes comparisons between
    forest coca admixtures and Sierra coca practices, and between parica/niopo and
    coca.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coca leaves are picked, fire-dried, and pounded in mortars made from small
    tree-trunks, with a mahogany pestle mentioned in connection with an illustration.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coca is pounded with lime from palm-leaf ashes, baked clay scraped from under
    the fire, and powdered cassava flour; the passage also mentions Sierra coca mixtures
    with unslaked lime or Chenopodium Quinoa ashes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Prepared coca is carried in a bag or beaten-bark pouch suspended around the
    neck, and the author states that clay and palm-leaf ashes neutralize the leaf’s
    bitterness.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The coca powder is shot into one or both cheeks with a folded leaf, forms
    a hard ball when moistened, and is described as absorbed with saliva rather than
    swallowed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that with a coca wad in the cheek an Indian can go without
    sleep, food, or drink for several days.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author reports that coca use was continuous among the Indians observed,
    making it difficult to observe people not under its influence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author’s own trial of coca eliminated hunger and thirst for him but did
    not produce tolerance and was followed by vomiting and stomach cramps.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports marked pupil dilation in Indians using coca, giving a
    curious expression to the eye.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Tuyuka and other tribes north of the Japura use parica or niopo as a stimulant
    snuff, described as a strong narcotic similar in effects to coca.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Parica or niopo is made from dried mimosa seeds, mixed with quicklime and
    baked clay, roasted, pounded in a shallow wooden mortar, packed in snail-shells,
    and inhaled through hollow bird-bones inserted in both nostrils.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Uaupes Indians are said to use parica or niopo for curative purposes and
    also to smoke enormous cigars.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: The Menimehe and Yahuna take snuff but neither smoke nor lick tobacco; tribes
    south of the Japura do not smoke tobacco but lick it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Tobacco leaves are soaked and then pounded in a mortar by men; thickened cassava
    starch is added to make a stiff dark liquid used privately or ceremonially.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:14
  text: Tobacco in any form is described as taboo to women, and the taboo on coca,
    aya-huasca, caapi, and tobacco is said to be always binding on all women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The tobacco-pot described is made from a thick hard nut-shell with natural
    holes stopped by pitch, two bored string holes, an oval top hole, and use of a
    stick point when tobacco is taken.
  category: object
  evidence_refs:
  - ev:7
