canonical_text:
  quote: ''
  summary: 'The narrator recounts a search for traces of Robuchon after his disappearance:
    abandoned camps, broken equipment, a path, a machete, a raft, and an illegible
    message are found, while inquiries among Boro and Menimehe groups produce uncertain
    reports of a captured bearded white man but no memory of Robuchon''s woman companion
    or his Great Dane, Othello. The narrator weighs possible escape routes and rejects
    some as unlikely.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a clearing, the narrator found an abandoned Indian house, eight broken
    photograph plates, and the eye-piece of a sextant; no other evidence of civilized
    occupation was found there.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator's Indigenous companions identified traces of a path as a man-made
    road; following it led to a second clearing, shelter ruins, and a rusty, hacked
    machete or trade knife, after which the path ended.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The search party encountered no Indians nearby, and the nearest Boro were
    said to live on the Pama River forty or fifty miles away.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator searched eastward along the Japura and back along the right bank,
    finding no Indians or signs of Indians, but finding a broken, battered raft below
    Robuchon's last camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Brown recognized the raft wreck as one built by the Frenchman's party after
    the loss of their canoe, but it did not provide a clue.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator stopped attempts to investigate the north bank because his boys
    believed they would be eaten if they crossed the great river there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Inquiries among Boro communities produced no information about the explorer,
    the woman, or the dog.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Robuchon's Great Dane, Othello, is described as large, fear-inspiring, and
    respected by Indians, but the narrator's Boro boys found no record of Othello
    or Robuchon among their compatriots.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A north-bank Boro chief, married to a Menimehe woman, reported that the Menimehe
    had captured a white man with a face hairy as a monkey's about three years earlier;
    the Menimehe did not confirm the statement, and the report did not mention the
    woman or dog.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator says the report was weakened because either the Menimehe or the
    Yahuna had destroyed a Colombian settlement near the Apaporis and taken white
    men prisoner around the same time.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator later learned that Robuchon had previously been lost on another
    expedition and had lived with Indians, which may have contributed to captivity
    rumors in the Rubber Belt.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narrator concludes that Robuchon likely did not die of starvation at the
    camp because food-stuff but no human remains had been found, and because an illegible
    message nailed to a tree suggested that he had left information about his route.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: The narrator lists possible courses after Robuchon abandoned camp, including
    retracing the Japura upstream or crossing to Menimehe country, and judges both
    unlikely in the passage.
  category: sequence
  evidence_refs:
  - ev:10
