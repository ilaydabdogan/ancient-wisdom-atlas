canonical_text:
  quote: ''
  summary: 'The passage describes Northwest Amazonian implements and watercraft: manioc
    graters made by women, mortars and pestles for coca and tobacco, bark trays, methods
    for felling and hollowing trees, dug-out and temporary palm-trunk canoes, communal
    boat storage, raft use associated with rubber-workers, reported bark canoes, and
    canoe paddling methods.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Indian women make the manioc grater, described as a flat oval wooden implement
    set with short black palm-spines; quartz-inset versions are said to be commercially
    valuable north of the Japura.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mortars and pestles are used especially for preparing coca and tobacco; mortars
    can be made from hollowed tree trunks, peach-palm trunks, or ironwood.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bark is cut into strips to make shallow concave trays, and tree trunks are
    stripped or felled by making holes or notches and levering or cutting with a stone
    axe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dug-out boats are made by felling a tree, preferably cedar, hollowing the
    trunk with holes and stone axes, burning out a cavity, scraping away embers, and
    forcing the hot trunk apart with inserted logs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The heating process causes the bow and stern of the dug-out to curve upward,
    and the finished craft is described as heavy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dug-out boats belong to the community, are hidden in bush near the river-banks,
    and are not kept in the maloka; paddles are kept in the house overhead on rafters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Issa and Japura valley tribes make dug-out craft, though the passage suggests
    the original idea may not be indigenous and contrasts it with a temporary canoe
    made from a hollowed bulge-stemmed palm trunk.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Temporary palm-trunk canoes can be made in an hour or two, have ends stiffened
    with clay, are used for casual crossings of rivers, and may be left to drift away
    after use.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Rafts are said not to be used on Issa or Japura streams except by rubber-workers;
    their raft construction is described as trunks of light wood lashed with liana
    or withes and fitted with a side rail.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage reports Wallace's statement that the Catanixi make canoes from
    a sheet of tree bark, but the narrator says he did not see anything like a birch-bark
    canoe.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Canoes are propelled with four- to five-foot paddles cut from solid wood;
    the blades are elongated and may have roughly painted designs.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Paddlers face the direction of travel, paddle in unison, and the man in the
    bow steers.
  category: action
  evidence_refs:
  - ev:10
