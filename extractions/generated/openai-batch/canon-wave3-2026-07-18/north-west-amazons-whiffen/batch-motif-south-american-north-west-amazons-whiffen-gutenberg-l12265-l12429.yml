comparison_claims:
- id: claim:1
  claim: The passage uses an Australian example as an analogy for claims about magical
    ability and belief that another person can truly perform magic.
  claim_level: same_function
  target: Australian magical-power belief reported by Spencer and Gillen
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only the Australian quotation and a brief pointer
    to im Thurn; the compared Amazonian material is not included in this excerpt.
- id: claim:2
  claim: The passage compares water-mother terminology with Peruvian maternal earth
    and sea figures.
  claim_level: same_function
  target: Pachamama and Mamaccocha in Peru
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is lexical and thematic; no shared narrative sequence
    is supplied.
- id: claim:3
  claim: The passage explicitly points to Malay comparative material for the idea
    of monkey-people stealing women for mates.
  claim_level: same_motif
  target: Malay materials cited as Skeat, Malay Magic, and Clifford, Studies in Brown
    Humanity
  evidence_refs:
  - ev:12
  counter_evidence_refs:
  - ev:12
  confidence: low
  limitations: The cited Malay parallels are not described in the passage, and the
    author offers a non-mythic hostile-tribe explanation as an alternative.
- id: claim:4
  claim: The passage calls the hostile-tribe taking of a chief’s daughter an Amazonian
    version of Helen and Troy.
  claim_level: same_motif
  target: Helen and Troy abducted-woman war-story pattern
  evidence_refs:
  - ev:12
  counter_evidence_refs:
  - ev:12
  confidence: low
  limitations: The phrase is explicitly speculative and appears as the author’s analogy
    rather than as an indigenous comparison.
