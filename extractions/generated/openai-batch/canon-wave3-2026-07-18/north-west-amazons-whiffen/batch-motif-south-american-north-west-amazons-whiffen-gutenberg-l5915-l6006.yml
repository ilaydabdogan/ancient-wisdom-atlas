canonical_text:
  quote: ''
  summary: The passage describes the medicine-man of Witoto, Boro, and related South
    American groups as a shamanic doctor-wizard rather than a priest. It lists his
    guarded knowledge of poisons and remedies, explains sickness as caused by an evil
    spirit sent by an enemy, and describes healing by breath, massage, suction, and
    producing an object said to be the extracted spirit. It also notes payment for
    cures and blame of rival magic-workers when cures fail.
  language: English
  quote_policy: summarized
