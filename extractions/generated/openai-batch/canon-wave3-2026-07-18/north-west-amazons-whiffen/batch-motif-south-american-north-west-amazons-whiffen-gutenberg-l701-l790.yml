canonical_text:
  quote: ''
  summary: 'A travel narrative recounts the final known stages of Eugene Robuchon''s
    expedition: a tense river-bank encounter, loss of canoe and stores in rapids,
    desertion and return of followers, Robuchon''s abandonment at the mouth of the
    Kahuinari with an Indian woman and dog, the delayed relief expedition, discovery
    of an abandoned camp with an illegible note, and a later identification of a small
    clearing as Robuchon''s last camp.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Robuchon's party travelled down-stream, found a path from the right river-bank
    to a clearing and Indian house, arranged an exchange for food, then pushed off
    when more Indians appeared than expected.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Indians from the river-bank pursued in canoes while shouting for Robuchon
    to stop; Robuchon continued until they were outdistanced.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The informant boy believed the Indians had friendly intentions, and the narrator
    treats the incident as evidence of the party's nervous state.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the Igarape Falls the canoe was upset, most remaining stores were swept
    away, and the rescued food was mostly ruined by water.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Shortage of food and loss of the canoe led to mutiny; three negroes and a
    half-breed deserted, failed to cut back through the bush, and returned starving
    to ask forgiveness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The reunited party improvised a raft, reached the mouth of the Kahuinari,
    and Robuchon was weak with hunger and fever and unable to go farther.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Robuchon remained at the mouth of the Kahuinari with an Indian woman and the
    Great Dane hound Othello, while he ordered the negroes and half-breed to seek
    and send relief.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The messengers killed many peccaries shortly after leaving but did not carry
    meat back to Robuchon; instead they spent two days eating and smoking meat for
    their own journey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The messengers followed the Kahuinari, obtained stores from a Colombian half-breed
    only after surrendering their rifles, and eventually reached a military station
    where they told their story.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A relief expedition left thirty-seven days after Robuchon had been abandoned
    and took ten weeks to bring help.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The relief party found tools, clothes, coffee, salt, and a camera, but no
    trace of Robuchon, the Indian woman, or the dog.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A paper was nailed to a tree, but rain and sun had made the written message
    illegible.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the return journey the relief party divided; the larger section reached
    the rubber district, while the smaller party was lost in the bush and only five
    survivors reached safety after five and a half months.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Two and a half years later the narrator investigated rumours about Robuchon,
    travelled with one of Robuchon's former companions, and found a small clearing
    with three poles marking a deserted shelter.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: John Brown identified the deserted shelter site as Eugene Robuchon's last
    camp.
  category: speech
  evidence_refs:
  - ev:9
