  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Within the household or common house of assembly, exogamy is strictly enforced
    because all household members are held to be kin.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A possible exception allows a chief’s daughter without brothers to marry a
    man of the same household, probably an adopted son.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage says a man may marry into the household from which his mother
    came because marriage transfers the mother into her husband’s household.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The children of two sisters might possibly intermarry, while the children
