canonical_text:
  quote: ''
  summary: The passage describes tobacco-drinking in tribal councils, where a tobacco
    pot is passed to mark agreement and dissent, and also used to bind verbal promises
    and friendships. It then summarizes marriage, kinship, household exogamy, possible
    matrilocal traces, and gendered labor rules, including the association of women’s
    reproductive capacity with manioc production.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a council is desired, warriors and elders gather and squat around a tobacco
    pot placed on the ground in their midst.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Council topics may include war, hunting, or wrongdoing by a fellow tribesman.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A speaker may speak at length, and those who agree may grunt approval during
    the speech.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After speaking, the spokesman takes the pot, dips a short stick into the black
    liquid, wipes some on his tongue, and passes the pot to others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men who agree take tobacco; anyone who passes the pot by signifies disagreement
    and must give a reason.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The issue is decided by the majority, with the chief holding the casting vote;
    the settlement is described as final.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Passing tobacco is used as a binding promise in verbal agreements between
    individuals and to emphasize friendship.
  category: action
  evidence_refs:
