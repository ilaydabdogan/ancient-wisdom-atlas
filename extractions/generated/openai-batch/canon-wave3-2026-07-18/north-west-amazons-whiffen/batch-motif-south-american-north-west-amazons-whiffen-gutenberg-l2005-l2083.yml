literal_observations:
- id: obs:1
  text: Fire-making is described as unknown among tribes south of the Japura, while
    tribes north of the river obtain fire by friction in a groove; ants’ nests are
    reported as tinder.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator reports making a fire by firing cartridges into leaves and wood
    chips after replacing bullets with cotton wool.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Matches are described as magical in the Indian’s eyes and as a valuable gift,
    with only one match usually lit at a time.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Because damp conditions make bush fires impossible, the family fire is kept
    burning night and day for warmth, cooking, and light.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When going into the bush, tribesmen carry fire by holding a smouldering strip
    of resinous bark that can be blown into flame.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The household fire is arranged with three young trees placed endways in a
    triskeles form, with the fire kindled in the center.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: People, including children, kick the logs together during the day and feed
    the fire similarly during the night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The father’s, mother’s, and children’s hammocks are slung in a triangle with
    the fire between them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: At night family members rise to push the wood together, blow the embers, and
    before dawn rekindle the fire and wait for daylight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Dawn signals a river bath; girls return with jars of water, women work in
    plantations, and men may hunt or fish.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the evening women and hunters return with plant foods, animals, and fish;
