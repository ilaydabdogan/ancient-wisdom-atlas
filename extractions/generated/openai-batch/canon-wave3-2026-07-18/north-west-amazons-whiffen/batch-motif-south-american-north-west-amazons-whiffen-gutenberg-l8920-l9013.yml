canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of physical characteristics,
    grooming, body modification, eyesight and hearing, facial expression, greeting
    and affection practices, grief display, and the author's assessment of learning
    capacity among several named Northwest Amazonian groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hair is described as coarse, lank, abundant, almost uniformly black, with
    baldness unknown and greyness rare; children may have lighter or downy hair, and
    Tukana hair is described as more often wavy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Most of the peoples described are said not to cut their hair, while Karahone
    men, Boro women and sometimes men, and some Witoto women are described as cutting
    or trimming it; singeing is used when a knife is unavailable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men are described as having scanty beards or none, with depilatory customs
    mentioned as one cause.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author reports visible differences in complexion, lips, nose, and general
    appearance among named groups, including Boro, Resigero, Andoke, Tukana, and Okaina.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A squint is described as common among the tribes except the Tukana; eyes are
    described as not large, deeply set, usually black, and accompanied by acute sight
    and hearing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that tribesmen can distinguish details in the bush or dark
    where an ordinary white man would see nothing, but that their sight is inferior
    in strong light.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ears are said to be artificially distorted, with large ear-plugs pulling the
    lobe downward; nose-boring and small nose pins are described for Boro, Muenane,
    and Witoto women.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chin is described as narrow, small, rounded, and often retreating in women;
    teeth are described as large, even, and rarely projecting.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ordinary expression is described as stolid, but during speech the face
    is more animated; under the influence of coca, gesticulation is said to be freer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage contrasts men south of the Japura, who look a stranger straight
    in the face, with those north of the river, who are described as having a more
    furtive glance.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The peoples described are said not to be demonstrative of affection, not to
    kiss, and not to touch one another in greetings, though they may return a white
    man's offered hand.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A slap on the shoulder is described as the closest approach to an embrace
    observed by the author and as a salutation between great friends.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Mothers are described as fondling their children, and a woman was observed
    with her arm around her husband, but such display is said to be considered barely
    decent.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that grief is not shown by weeping; girl children may cry,
    children do not scream, and adults may whine but do not shed tears.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Boro are described by the author as especially intelligent and eager to
    learn useful things; the Menimehe are mentioned as a possible exception to Boro
    superiority in this respect.
  category: attribute
  evidence_refs:
  - ev:11
