canonical_text:
  quote: ''
  summary: The passage describes necklets, bracelets, ligatures, rattles, and dance
    ornaments among Boro, Witoto, Napo, Resigero, Yahabana, and other groups. It notes
    materials, patterns, gendered placement on the body, manufacture by finger-work,
    and a reported magical strengthening property for iguana-skin bracelets and children's
    nut rings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tight-fitting necklet is described as having white beads on either side
    of small flat black diamond-shaped pieces of wood, nut shell, or gourd, with only
    slight variation in width and spacing.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The polished black pieces in the necklet are compared in appearance to jet,
    and the black-and-white contrast is said to set off the wearer.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Iguana-skin bracelets are made by cutting a circular piece from the tail,
    removing the ring of skin, and drawing it over the hand while fresh and damp so
    that it dries tightly on the arm.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The iguana- or lizard-skin bracelets are reported as being supposed to have
    magical properties and to give the wearer special strength and vigour.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Children wear a black ring cut from a nut for the same purpose; the ring cannot
    be worn after growth and is expected eventually to be cut off, though the author
    states uncertainty about how or when.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women's bracelets are described as made of beads when available or of colored
    seeds; the Resigero example has threaded seeds or beads wound around the forearm
    with white beads at the ends and dark red beads in the center.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'Rattles and feather ornaments are worn on the legs for dance, while tight
    ligatures are gendered: men wear them on the upper arm and women on the legs below
    the knee and above the ankle.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tight ligatures are said to produce swelling of the muscles above or below
    the band rather than atrophy.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ligature bands are made of fine fibre thread by interworking and knotting
    with fingers only, without implements, and may have raised colored lines, diagonals,
    and diamonds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ligature ends are finished with open-work stitches and buttonholed or twisted
    edges; fibre cords pull the band together and are tied in knots, with men's ligatures
    knotted in front and women's laced securely.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Yahabana and other Kuretu-speaking tribes are reported to wear armlets
    very tightly, leaving lighter skin underneath that can blister in the sun if unprotected.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Leg rattles are made from polished nutshells strung on fibre thread, with
    or without beads; they make a tinkling sound when shaken and are said to play
    a distinct part in dances.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Additional worn ornaments include strings of feather-tufted reeds or bits
    of bone, pierced and strung on fibre thread, with feather bunches secured by pitch
    and spacing kept by knots.
  category: object
  evidence_refs:
  - ev:6
