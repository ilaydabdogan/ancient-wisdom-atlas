literal_observations:
- id: obs:1
  text: The author defines a tribe as a group sharing language, law, a rudimentary
    government, and capacity for common action.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author classifies tribes into language-groups such as Witoto and Boro,
    with the group name applying to all tribes in that language-group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that tribes within a group vary mainly by dialect and locality,
    while alien groups differ more strongly in speech and custom; he also compares
    the appearance of Boro and Witoto people to external populations.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Witoto and Boro are identified as the two groups mainly treated in detail,
    occupying lands roughly between the Japura, Igara Parana, and Issa rivers.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage locates Boro country in relation to the Futahi Hills, the Pupuna
    and Kahuanari rivers, the Japura, the Wama, the Ira watershed, and neighboring
    Menimehe, Karahone, Resigero, Nonuya, Muenane, and Dukaiya districts.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage locates Andoke, Orahone, Kuretu, Opaina, Makuna, Tukana, Bara,
    and Maku groups in relation to the Japura, Issa, Apaporis, Rio Negro, Arara Hills,
    Kaouri, and Uaupes areas.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author says that the peoples discussed are wanderers and that their given
    districts are approximate and dependent on neighboring groups, especially powerful
    or warlike ones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author distinguishes upper Issa tribes as semi-civilised Colombian Indians,
    lower-water tribes as semi-civilised Brazilian Indians, and middle-district tribes
    as recently less affected by white influence.
  category: relationship
  evidence_refs:
  - ev:4
