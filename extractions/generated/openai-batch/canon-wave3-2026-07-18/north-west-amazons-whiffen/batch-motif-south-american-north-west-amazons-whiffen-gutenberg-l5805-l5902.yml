canonical_text:
  quote: ''
  summary: The passage describes diseases, remedies, mourning behavior, and funerary
    customs among Northwest Amazonian groups observed by the author. It notes household
    removal of jiggers, fear of contagious disease, local disease attributions, practical
    remedies, immediate intramural burial with grave goods, variants for women and
    chiefs, fire over graves, and the belief that grief ceases after interment because
    the spirit has departed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Parasitic troubles are described as common, and an Indian wife is said to
    examine her man’s feet daily to remove thorns or jiggers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Contagious disease is feared; a sick person may be left to die, and smallpox
    causes panic near the Rubber Belt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some skin conditions are attributed in the passage to eating tapir or to eating
    much fish.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Remedies mentioned include cold river bathing for fever, tobacco-water with
    quinine, bark liquid for wounds, a boiled narcotic root, and a dry lichen-like
    moss as counter-irritant.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mourning may include crying, sobbing, wailing, and excited grief before burial,
    especially at the funeral of an important person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Burial takes place on the day of death; the dead man is unwashed, wrapped
    in his hammock in a sitting position, and buried beneath the place where the hammock
    was slung during life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A dead man’s ornaments, arms, tobacco-bag, coca-pot, and other personal possessions
    are placed in the grave beside him.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the deceased is a woman, pots are buried with her instead of weapons,
    and baskets and ornaments may also be included.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among the Kuretu-language group, a woman’s pots are broken before burial to
    prevent the soul from returning to ask for properties needed in the spirit world.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A chief’s funeral includes burial with weapons, ornaments, and treasures,
    followed by a feast with drinking, dancing, and songs praising the dead chief.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: At a chief’s funeral, the new chief appears in prescribed dress with a notable
    head-dress and speaks with his back to the assembled tribe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After burial, relatives make a fire over the new grave and keep it burning
    for several days; when a chief dies, the whole house is burnt.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After interment no grief is shown, because the spirit is believed to have
    departed; the grave is not marked and has no claim to respect from survivors.
  category: relationship
  evidence_refs:
  - ev:10
