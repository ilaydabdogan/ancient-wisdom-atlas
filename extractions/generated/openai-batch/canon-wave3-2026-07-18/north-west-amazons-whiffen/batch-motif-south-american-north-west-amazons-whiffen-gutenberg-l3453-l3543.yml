canonical_text:
  quote: ''
  summary: 'The passage describes domestic manufacture among northwest Amazonian groups:
    women make hand-shaped pottery, baskets, and hammocks; men sometimes make baskets;
    several tribes use bark, cane, palm fibre, clay, ashes, wood, and thorns for vessels,
    carrying-baskets, hammocks, and cassava-squeezing devices. It notes differences
    among named groups in basket forms, hammock thread spacing, and cassava-squeezing
    methods.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pottery-making is described as the sole province of women and connected with
    culinary work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pots are shaped by hand without a wheel, using clay coils or a circular hole
    in the ground, then dried, baked with hot ashes, and polished.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Clay is commonly obtained from river-banks and mixed with wood ashes; caraipé
    bark ashes are preferred for caraipé ware.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Large vessels for making kawana are described as bark strips riveted with
    thorns or spines, or as hollowed sections of large tree trunks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women are described as the chief basket-makers, though men sometimes make
    baskets.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Quick carrying-baskets can be made from green palm leaves and thrown away
    at the end of a march.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: More elaborate baskets of plaited bark-fibre and cane are present in malokas;
    some have regular black-cane patterns.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Resigero make bottle-shaped baskets as receptacles for edible ants.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hammock manufacture is described as women’s work, using curana string or palm-fibre
    prepared from Chambiri palm leaflets.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A hammock is made by turning fibre string between two posts in the maloka
    floor and tying cross strings at regulated intervals without implements.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The cassava-squeezer is described as a plaited or basket-work household article
