canonical_text:
  quote: Man is a very puny feature in the Amazonian cosmos.
  summary: 'The passage describes the narrator''s experience of Amazonian bush travel:
    exhausting daily progress through dense vegetation, oppressive weather and atmosphere,
    a personified hostile forest, hidden animal life, the danger of becoming lost
    after leaving river routes, and the possibility of Indigenous companions deserting
    into the forest at night.'
  language: English
  quote_policy: quoted
