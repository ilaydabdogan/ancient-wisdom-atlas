canonical_text:
  quote: ''
  summary: The author introduces the circumstances and route of his 1908-1909 Amazon
    journey. He explains his initial inspiration, limitations in equipment and scientific
    method, travel from England to Manaos and Iquitos, difficulties obtaining men
    for intended routes, his arrival at Encanto, the value of John Brown as servant
    and informant through a Witoto connection, and the expedition party that set out
    for the Igara Parana.
  language: English
