canonical_text:
  quote: ''
  summary: The passage describes feather head-dresses, dance ornaments, combs, women’s
    body decoration, and the practical rejection of introduced garments among Issa-Japura,
    Boro, Andoke, Witoto, and related groups. It emphasizes feather regalia as communal
    possessions, status differences in headdress elaboration, women’s use of down,
    paint, and ornament, and the claim that ornaments function as dress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Issa-Japura feather head-dresses are described as being made from available
    bright plumage rather than from a fixed tribal color scheme.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The feather head-dress is described as a coronet of bright breast-feathers
    with tufts of long tail-feathers tied with fiber thread.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Boro men put long macaw feathers into their arm-ligatures on festive occasions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief’s head-dress is more lavish than those of his warriors, and the
    only boy observed wearing one was the young son of a chief.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women do not wear the feather head-dress, but attach white curassow duck down
