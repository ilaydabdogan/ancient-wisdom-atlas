canonical_text:
  quote: ''
  summary: The passage describes childhood, parental authority, gendered childhood
    imitation, male and female puberty instruction, Bara whipping at a Jurupari dance,
    girls' forest lodges, tobacco-related practices, adolescent piercing, and Menimehe
    tattooing among northwest Amazonian groups as reported by Whiffen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children are described as exposed from birth to adult life, open discussion,
    and adult forms of joking, with no separate innocent childhood.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parental authority is described as slight; boys are said to pass beyond parental
    authority at puberty, while girls remain more under the care of mothers or elderly
    matrons until marriage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Children are not held personally responsible for damage; compensation is claimed
    from parents, and children are said not to be beaten and rarely punished.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Children are treated as potential warriors or mothers of warriors; boys receive
    miniature weapons and imitate fathers, while girls accompany mothers to plantations
    and imitate women's work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The author reports little elaborate initiation among most tribes: elders
    teach youths, a young warrior may join a tobacco palaver, receive a pouch of coca
    from the chief, lick tobacco, affirm bravery, and enter the ranks of fighting
    men.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the Bara, after a Jurupari dance pubertal youths are whipped with a
    sacred tapir-hide instrument; women are excluded, the boys' shouts are believed
    by women to be expulsion of demons, and disclosure of the experience leads to
    outcasting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Girls near puberty in areas near the Andoke are described as segregated in
    hidden forest lodges under old and wise women, partly for protection from raiders
    and partly for instruction.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Girls in the lodges are said to learn dancing, singing, and body-painting
    for festivals, and small girls may be seen painting each other.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'The girls'' isolation is not absolute: communication with the tribal house
    continues carefully, no visible path is allowed to develop, and a girl returns
    permanently only when a marriage has been arranged.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A reported Jivaro practice of festivities when a four-year-old is first initiated
    into smoking is contrasted with Japura and Issa tribes, where the author says
    tobacco is only licked.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: At puberty, adolescents' ears, noses, and lips are bored, probably with a
    capybara tooth; among the Menimehe, tribal marks are tattooed on the face and
    breast at that time.
  category: action
  evidence_refs:
  - ev:10
