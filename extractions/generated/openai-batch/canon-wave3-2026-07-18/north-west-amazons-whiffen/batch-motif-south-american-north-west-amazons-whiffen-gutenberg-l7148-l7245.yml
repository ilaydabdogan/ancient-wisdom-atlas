canonical_text:
  quote: ''
  summary: 'The passage describes reported magico-religious beliefs among north-west
    Amazonian groups: a remote benevolent Good Spirit, an active malevolent Bad Spirit,
    lesser spirits, magical countermeasures, spirit abduction fears in the forest,
    and avoidance of true names of spirits, persons, and tribes. It also records Boro
    terms Neva and Navena as usable names associated with good and evil spiritual
    categories.'
  language: English
  quote_policy: summarized
