  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The narrator doubts the claim that the caneiro tears off pieces of skin and
    flesh, although he says it sucks up flesh rapidly and painfully.
  category: speech
  evidence_refs:
  - ev:3
