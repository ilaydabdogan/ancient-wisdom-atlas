  quote: ''
  summary: The passage describes Indigenous swimming technique as practical rather
    than sportive, then discusses dangers encountered while bathing in Amazonian rivers,
    including electric or stinging fish, caneiro, piranha, and a reported small parasitic
    fish. The narrator recounts a caneiro attaching to his leg and notes reported
    precautions against some fish while expressing skepticism about some claims.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes the Indigenous swimmer as paddling like a dog rather
    than using a European breast-stroke, with sharply flexed legs suddenly straightened
    to drive the body forward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described swimming stroke is said not to be tiring, to permit long immersion
    without exhaustion, and not to produce remarkable speed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Swimming is described as a practical adjunct to bathing or a means to cross
    a stream, not as diving, exhibition feats, or water games.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bathing is described as exposing the bather to danger from fish, including
    stinging eel, skate or another stinging fish, caneiro, and piranha.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator says electric fish are less common in the upper rivers than in
    the main streams and that he did not observe Issa-Japura Indigenous people taking
    special precautions against them.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports that elsewhere some natives beat and prod the water with
    rods before bathing to try to discover whether eels are nearby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The caneiro is described as attacking by suction rather than shock, with an
