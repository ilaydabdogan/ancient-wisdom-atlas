canonical_text:
  quote: ''
  summary: 'The passage describes several dances: a flute dance in which women and
    small boys withdraw while men circle, play flutes, and whip one another until
    blood is drawn; harvest and Feast of Fruits dances with shoulder-linked men and
    monotonous song; a pineapple dance with plant wands; and a Boro manioc dance structured
    by male and female formations and a call-and-response song about cultivating,
    preparing, eating, and sexually joking about cassava.'
  language: English
  quote_policy: summarized
