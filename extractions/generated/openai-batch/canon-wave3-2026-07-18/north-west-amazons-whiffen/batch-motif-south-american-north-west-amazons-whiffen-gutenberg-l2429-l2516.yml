  summary: The passage describes household-centered tribal organization, chiefly authority,
    the rival authority of medicine-men, crisis leadership during rubber-era conflict,
    succession by tribal selection, and the supremacy of custom called Pia, with the
    tobacco palaver serving as council and court.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The social unit is described as an undivided household community of about
    sixty to two hundred people sharing a common house under a chief; each house is
    independent and exogamous.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that there is no head chief or central organization binding
    households, tribes, or language-groups, and that intertribal fighting is continual.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Only a grave common danger is said to be able to combine tribes temporarily,
    and even then an exceptional individual would be greatest among equals rather
    than a recognized commander-in-chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nonugamue, a Nonuya, is named as a recent paramount chief over the Nonuya-speaking
    area, described as an unusual case of one man influencing a large district.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Katenere, a Boro chief, gathered thirty to forty Boro men to make war against
    white rubber-gatherers but did not combine the tribes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An unnamed Resigero chief collected warriors to attack Indians who yielded
    to white pressure and worked rubber; the narrator reports finding thirty-eight
    dead people and a partly burned house attributed to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage characterizes these crisis cases as abnormal responses to new
    dangers threatening the tribes with a fate worse than death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In normal conditions, the chief’s influence is limited to his own household
    and is weighed against the authority of the medicine-man.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The medicine-man is described as often having the advantage because rebels
    against the magic-worker are said to die speedily.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The chief has a special portion of the house, receives prisoners and unattached
    women, controls large plantations through women’s labor, leads in war, presides
    over tobacco palaver, and has the last word in councils.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: On a chief’s death, the successor must be elected by the tribe; the son is
    usually appointed but can be passed over after discussion in tobacco palaver.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage identifies Pia, glossed as custom, as the one paramount and infrangible
    law, binding people from cradle to grave and serving as the reason for all things.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The chief, medicine-man, and tribal council do not make the law but enforce
    it; rare exceptions require consent of tribesmen in formal conclave.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The tribal council consists of adult males of the household under the chief’s
    presidency, and the tobacco palaver is described as the Indian parliament and
    court of law.
  category: relationship
  evidence_refs:
  - ev:9
