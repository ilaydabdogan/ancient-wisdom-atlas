  quote: ''
  summary: The passage describes rhythmic communal dance steps, a Tureka variation,
    the use of public grievance chants during a dance, subsequent chiefly attention
    and social sanction, and uncertain reports of an initiation or Jurupari-associated
    dance involving liana beatings that draw blood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The main dance has a strongly marked rhythm, simple figures and steps, and
    repeated forward and backward movement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dancers stamp the right foot on the earth in unison, with the knee raised
    and the body weight brought down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dance circles move to the right with slight changes of ground.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Tureka variation includes a jump before the stamp, a shout at the end
    of the figure, and whistling through the teeth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person with a grievance may enter the maloka during the dance wearing a
    striking costume and large hat, stand visibly but outside the dancers' track,
    raise a hand and staff, and recite a complaint to a monotonous refrain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The complaint examples concern alleged unfair exchange, non-delivery of promised
    goods, hunger after meat was taken, and a chief's daughter lost in the bush without
    kin searching for her spoor.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The petitioner may repeat the grievance song for hours; others appear to ignore
    it unless the dance ends, when performers may jeer and laugh, while the petitioner
    continues.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief is expected to take note of the complaint, and important matters
    may be discussed and judged at a later tribal conference in tobacco palaver.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Public airing of a grievance can place the alleged culprit on a black-list,
    causing others to deal warily with that person as a punishment.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that reliable evidence for initiation dances is difficult
    to obtain and that reports identify the same dance differently as a girls' initiation
    dance and as a men's Jurupari ceremony.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: A reported dance involves performers beating fellows with lianas until blood
    is drawn and the victims faint with pain, but the passage says its origin is uncertain
    and that it is not known in the district between the Issa and the Japura.
  category: action
  evidence_refs:
  - ev:8
