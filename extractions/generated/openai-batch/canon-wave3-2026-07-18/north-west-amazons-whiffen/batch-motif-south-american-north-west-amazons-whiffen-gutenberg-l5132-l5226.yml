  summary: The passage describes birth-related observances, including the father's
    restrictions, congratulations by visitors, ceremonial coca and tobacco use, a
    medicine-man's assessment, naming after eight days, gendered naming patterns,
    avoidance of true personal names, transfer of a deceased person's name to a living
    relative, maternal carrying and nursing practices, and children's food taboos
    until maturity.
  language: English
