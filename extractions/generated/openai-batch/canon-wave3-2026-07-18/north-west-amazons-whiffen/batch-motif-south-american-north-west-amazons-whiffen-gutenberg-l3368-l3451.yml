  summary: The passage describes carved teeth, rare carved wooden figures and a doll
    among Witoto groups; the scarcity and value of metal and stone; inherited stone
    axes regarded as gifts from gods; wood, tooth, fibre, bark-cloth, animal-skin,
    and pottery manufactures; medicine-men’s leather garments and jaguar-skin pouches;
    and barter in Menimehe pottery.
