literal_observations:
- id: obs:1
  text: The office of medicine-man is described as partly hereditary, with a son succeeding
    if efficient, but hairiness is presented as a more important qualification than
    primogeniture.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: A medicine-man may keep a small boy, actual or adopted son, who is credited
    with magic gifts and trained to receive professional secrets.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The initiation of a novice is said to include conjuring passes with sticks
    through the nostril and out of the back of the head; a secondhand report mentions
    exhausting ordeals and torture, but the narrator says he received no direct information
    on that point.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Most people depilate because they dislike resembling monkeys, while the medicine-man
    ignores this custom; among the Andoke, depilation is said to be strictly tabu
    to him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hairiness is described as a necessary qualification for a man or youth who
    seeks to become medicine-man; if no hairy son is available, a hairy child is chosen
    and educated for the post.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The medicine-man is believed to return after death as a tiger or jaguar and,
    during life, to make excursions in tiger form.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each medicine-man is said to possess a jaguar or tiger skin used when turning
    tiger; the skin is hidden when not used for magic purposes and is not worn as
    ordinary covering.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In tiger form, the medicine-man is said to be able to slay and eat wild beasts,
    attack enemies, carry individuals into the bush, and be unkillable unlike an ordinary
    tiger.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The medicine-man observes tabus including prohibited foods and avoidance of
    women while making medicines; if a woman bore a child in that circumstance, the
    child would be a tiger cub.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The medicine-man goes alone into the forest to make drugs and unguents, disappears
    at times, and on return reports magical journeys, tiger-form work against enemies,
    or spirit visits to other lands.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The medicine-man’s distinctive properties include a bag, rattle, small magic
    stones, and a cup made from a river-fish shell.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: In healing, the medicine-man speaks into the shell cup and rubs the sick person
    with it; if this fails, the patient sucks the cup and vomits until the evil spirit
    is expelled.
  category: action
  evidence_refs:
  - ev:7
