  quote: ''
  summary: A series of footnotes citing earlier sources and adding ethnographic clarifications
    on Northwest Amazonian groups, including terminology for social organization,
    clothing and bark-cloth, feather and fibre ornaments, hair arrangement, cotton
    use, body markings, pigments, and cautious comparisons with other ethnographic
    examples.
