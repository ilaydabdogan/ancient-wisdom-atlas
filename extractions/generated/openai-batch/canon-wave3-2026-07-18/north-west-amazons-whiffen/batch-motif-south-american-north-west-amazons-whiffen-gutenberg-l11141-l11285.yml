  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that his approach to the peoples discussed was from the
    Witoto country.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One note says an exceptional organizational combination may suggest possible
    former clan unity, but that the clans are now practically small tribes; it recommends
    the terms language-group, tribe, and tribesman over tribe, clan, and clansman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: One note describes a custom as the reverse of matrilocal customs reported
    by Sir Everard im Thurn.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cited statement says the natives are ashamed to be clothed, and the note
    adds that clothes are often worn by savages at periods of license only.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Several forest trees are identified as sources of fibrous bark for bark-cloth;
    the note says natives use whichever suitable tree is nearest when needed.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bark-cloth manufacture is reported among the Muizas, who traded it with the
    Maraves, and bark loin-cloths are also reported among Semang and other Malay Peninsula
    groups.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: A similar geographical progression is said to have been noted among women
    of British New Guinea.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:8
  text: Feather ruffs are said to be worn by Napo Indians but not by the tribes under
    discussion; one feather head-dress in the author’s possession used cotton yarn
    probably obtained by barter and feathers bound with fine fibre.
  category: object
  evidence_refs:
  - ev:9
- id: obs:9
  text: According to Koch-Grünberg, Yahabana and other Kuretu-speaking groups part
    the hair in the middle, plait it with bast, and after bathing dry, comb, and arrange
    it with a bandage.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: Red is described as the preferred colour for a djibbeh, while white ones were
    not much liked; the note also distinguishes a small Uaupes apron from longer girdles
    or garlands described here.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:11
  text: Cotton is described as very uncommon among the tribes; the author says he
    saw no preparation or use of it except in its natural state for tipping blow-pipe
    arrows, while fibre thread was otherwise used.
  category: object
  evidence_refs:
  - ev:12
- id: obs:12
  text: Belts of similar minute plaiting are reported among the Mafula of British
    New Guinea, with armlets and leglets of the same material, though not tightened
    to swell the muscles; the thread is said to be made in the same manner as among
    Issa-Japura Indians.
  category: object
  evidence_refs:
  - ev:13
- id: obs:13
  text: The Inca were called Orejones by the Spaniards because of large studs worn
    in the lobes of their ears.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:14
  text: The author rejects Wallace’s statement that these tribes have circular punctures
    along the arm and corrects Wallace’s description of a chin mark.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:15
  text: Two plant names, Bixa Orellana and Genifa americana, are supplied in the footnotes.
  category: object
  evidence_refs:
  - ev:17
