canonical_text:
  quote: ''
  summary: The passage describes warfare among named upper-river Amazonian groups
    as deliberate, stealthy, revenge-oriented, and reliant on surprise, hidden dwellings,
    and pitfalls. It also describes the taking, binding, killing, and sometimes eating
    of prisoners or enemy corpses after conflict, while rejecting a claim that these
    groups eat their own kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: War is described as planned after deliberation, often for revenge, with warriors
    mustering and sometimes joined by a friendly tribe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Attack is described as stealthy, silent, non-frontal, and dependent on surprise,
    often involving a night approach to the enemy's tribal house while occupants are
    occupied with a dance or asleep after a feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Victorious attackers may kill everyone in the house and burn the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Defence is described as lacking effective fortification and instead using
    pitfalls in forest avenues with poisoned stakes; the pits are said to be dug by
    the Karahone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The secrecy of the tribal dwelling is said to depend on the absence of direct
    footways, despite ongoing hostility between language-groups.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Warriors take prisoners when this can be done without excessive risk; prisoners
    serve as tangible evidence of success and personal valour.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Prisoners are bound with palm-fibre during the return from battle and may
    be killed if they delay the captors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Prisoners are sometimes sold, but are usually killed and eaten at a feast
    commemorating the event unless they are young enough to be kept as slaves without
    risk of escape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Prisoners are not kept long, receive no food or drink, and are killed with
    a heavy wooden sword; the described method includes blows to the legs and decapitation
    with a broadsword.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: If a chief is killed in war, his body is carried off by his tribe if possible,
    while ordinary dead or wounded warriors may be left because of the danger of delay
    and surprise during retreat.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among the Boro and other cannibal tribes, enemy corpses are eaten after tribal
    strife when it can be done without risking reprisals, especially when the fight
    occurs at their own house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that most upper-river Indians, especially the Boro, Andoke,
    and Resigero groups, are cannibals, but rejects the assertion that they eat their
    own dead children, friends, and relatives.
  category: attribute
  evidence_refs:
