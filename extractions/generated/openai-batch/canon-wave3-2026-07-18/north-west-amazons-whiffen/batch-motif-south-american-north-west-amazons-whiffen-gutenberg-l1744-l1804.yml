canonical_text:
  quote: ''
  summary: 'The passage describes the experience of becoming lost in the Amazonian
    bush: a traveller leaves companions, follows a stream, loses orientation among
    indistinguishable trees and waterways, calls and fires a rifle without result,
    and undergoes psychological distress. The narrator then recounts his own episode
    of being lost and finding Brown and his party by following terrain toward water.
    The passage ends with starvation as another extreme bush experience.'
  language: English
  quote_policy: summarized
