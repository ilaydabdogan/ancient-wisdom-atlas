canonical_text:
  quote: ''
  summary: A narrative tells of a chief's daughter lost in the forest, marked by hair
    and leaves after an encounter with a komuine, the birth of twins, and a tribal
    decision to destroy her, followed by her flight and the ruin of the Utiguene.
    The passage then summarizes Amazonian animal tales and lists conventional animal
    traits in local folktales, including comparisons with worldwide, Old World, Biblical,
    and African tale patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening verse says the chief's daughter was lost in the forest and that
    no one, including her brothers and male kin, came to find her spoor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While Komuine was dancing, observers noticed hair on her bird rump; old women
    rubbed milk on her to remove the hair, but more hair appeared, and she was covered
    with leaves before telling her story.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In her account, while picking peppers in the forest, a komuine came to her,
    forced her sexually, and took her into the bush to become his woman.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: She says she gave birth to twins, that the second was buried because komuine
    have only one child, and that the remaining child was hairy like a komuine but
    had a human face.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: She says that when she gave the child milk the unsightliness appeared, after
    which she fled from the beasts and returned to her people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tribe held a tobacco palaver and decided to destroy her because of the
    unsightliness, pollution, and a costly blood-feud with enemies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After hearing the decision, she fled into the forest, and all the komuine
    robbed the plantation so that there was no manioc and no fruit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Utiguene men went hunting, lianas were like a net in the path and too
