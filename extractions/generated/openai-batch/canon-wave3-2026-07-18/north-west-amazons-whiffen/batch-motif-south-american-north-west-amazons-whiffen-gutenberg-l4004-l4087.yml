canonical_text:
  quote: ''
  summary: The passage describes the armoury of Indigenous groups in the north-west
    Amazon as consisting chiefly of close-range weapons suited to dense forest, with
    limited firearm use. It gives details on swords, bows, arrows, spears, shields,
    quivers, poison preparation, weapon construction materials, and regional differences
    among named groups including Witoto, Menimehe, Jivaro, Napo-area tribes, Uaupes
    river Indians, Yahuna, and tribes south of the Japura.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The armoury is described as consisting mostly of weapons for hand-to-hand
    encounters with people or animals, and success in intertribal conflict is attributed
    more to personal dexterity than to mechanical accomplishment in dense woodland
    conditions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Witoto near rubber districts are said to have ordinary muzzle-loading scatter-guns,
    while other tribes have only a few rifles and fowling-pieces; an Indian who has
    a gun is described as reluctant to use it in order to save powder and shot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Menimehe are said to have neither rifles nor scatter-guns and to prefer
    throwing-javelins, bows, and arrows because they consider firearms to frighten
    game.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists the sword, bow, and spear as the chief offensive weapons,
    and states that war spears and arrows do not differ from those used against larger
    wild animals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: For defence, the Menimehe carry a small club or life-preserver and also have
    large round tapir-skin shields; Jivaro and some Napo-area tribes use circular
    tapir-hide shields likened to those of the Uaupes river Indians.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Yahuna on the other side of the Apaporis and tribes south of the Japura
    are described as not using shields.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Indian sword is described as a plain polished red-wood or black iron-wood
    weapon, thirty to thirty-six inches long, used to strike an antagonist’s thighs
    to bring him down and also to ward off thrown javelins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Spears and javelins are made from chonta wood, scraped smooth with the jaw
    of the pirai fish, and polished with leaves of Cecropia peltata.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A spear has a separate chonta head, a poisoned palm spine fixed in the point,
    a filed section intended to break off in the wound, and a reed sheath protecting
    the poisoned point.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Arrow-heads are also half filed through before use; arrow tips are chonta
    and poisoned, bows vary in wood and size, arrow shafts lack feathers and nocks,
    and arrows are carried in wicker or wooden quivers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Menimehe are described as especially skilful bowmen and as famous for
    quivers and pottery, with quivers made from scraped-out bamboo sections or from
    bound strips of bamboo.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Arrow poison is carried in a small pot or calabash; for weapons used against
    men or larger beasts, vegetable poisons for small game are replaced by a mixture
    including strychnos and poison from decomposed animal or human matter.
  category: object
  evidence_refs:
  - ev:6
