canonical_text:
  quote: ''
  summary: The passage reports names and cross-tribal equivalents for good and bad
    spiritual powers, then summarizes a Boro account in which Neva, the Good Spirit,
    created or permitted the world, watched humanity, came to earth in human guise,
    spoke to Indians at places now seen as open savannahs, became angry after one
    Indian vexed him, withdrew to the roof of the world, and instructed tigers to
    kill Indians. The passage also records a tobacco palaver after the narrator told
    a Christian story and notes uncertainty about whether the Neva story is indigenous,
    Biblically influenced, or transmitted indirectly.
  language: English
  quote_policy: summarized
