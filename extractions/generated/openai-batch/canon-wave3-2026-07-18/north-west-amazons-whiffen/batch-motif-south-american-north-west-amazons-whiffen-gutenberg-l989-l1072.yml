    boots are described as dangerous on slippery tree-trunks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator says a long knife or cutlass, a revolver, and a gun-bearer with
    a rifle or scatter-gun should be carried, along with bedding, waterproofing, and
    medical and hygienic comforts.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Drawings in the volume are said to derive from photographs or from trophies
