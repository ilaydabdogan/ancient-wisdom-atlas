canonical_text:
  quote: "“The horror of Amazonian travel is the horror of the unseen.”"
  summary: 'The passage describes practical difficulties of travel in the north-west
    Amazon: swampy terrain, unseen dangers, deserted settlements, single-file movement,
    supply shortages, hunger, minimal shelter, practical clothing and weapons, photographic
    difficulties, local objections to posing, and the roughness of maps made in dense
    forest.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bush travel is described as monotonous, uncomfortable, dangerous, swampy,
    and marked by sudden transitions from shallow mire to deep stream.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Deserted Indian houses or settlements are encountered, while poisoned arrows
    or leaf-roofed pitfalls indicate the presence of unseen inhabitants nearby.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Travellers move in single file; the first person cuts a path and the surrounding
    bush remains like a wall on both sides.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator recommends that an expedition party in such conditions rarely
    exceed twenty-five people and notes that less baggage allows more rifles for security.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Food supply is difficult because game is hard to shoot, preserved goods may
    spoil, fish are hard for the uninitiated to catch, and travellers may resort to
    frogs, snakes, and palm-heart.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator identifies fear of starvation and fear of being lost as major
    anxieties for Amazonian travellers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A tent is treated as burdensome, while a rough palm-thatch screen can be quickly
    built but gives poor protection from dew and rain.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Recommended clothing is practical rather than fashionable and includes thin
