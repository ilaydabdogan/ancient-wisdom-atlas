canonical_text:
  quote: ''
  summary: 'An ethnographic description of large festival dances at and within the
    maloka: guests gather by signal drum, fires are lit, men and women form coordinated
    lines or rings, a leader and the chief direct parts of the event, and dance implements,
    crop adornments, and formation customs vary by occasion and by named regional
    groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Scores to hundreds of painted and feathered guests gather in the clearing
    around the maloka after a signal drum summons them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bonfires and torches illuminate the tribal lodge, and the chief has a place
    in the centre.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men form a line with instruments and jingling dance-poles, while women form
    up facing them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A clattering leader guides the line around the maloka; the procession encircles
    the maloka and enters it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside, performers move around the chief until the lodge is full; the chief
    signals for silence and sings a line explaining the occasion, after which dance
    and song resume.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dances occur for pineapple and manioc harvests, successful hunts or war-expeditions,
    and other entertainments initiated by the chief; pineapple dances are especially
    associated with October.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dance staffs may be plain sound-making objects fitted with a calabash or carved
    hollow head containing nuts, and may also bear dried seeds that rattle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In harvest dances, staves are adorned with the crop being honoured, such as
    pineapple leaves or manioc shoots.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Named groups are described with differing dance-staff or instrument customs,
    including carved patterns, valued staves, aprons, clappers, horns, rattles, clubs,
    flutes, green twigs, and clay whistles.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The soloist may begin with fancy high stepping and may prance like a stallion,
    which amuses the company.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When dancers become heated in the house, they may file outside while still
    dancing, circle the open space, and return within.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dancers commonly stand in single file with one hand on the shoulder of the
    next person, though hand placement varies by group.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: One described figure consists of a broken circle of linked men holding dance
    implements and an inner concentric ring of women facing them with complementary
    timing.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: In some dances, a woman outside the outer circle places her left hand on the
    left shoulder of the man of her choice.
  category: relationship
  evidence_refs:
  - ev:10
