canonical_text:
  quote: ''
  summary: The passage critiques ethnic and linguistic classification of Northwest
    Amazonian peoples. It discusses Deniker's classification of Witoto as Carib by
    reference to hammocks, cassava-squeezers, and couvade, then counters that couvade
    is also common among Witoto and Boro and that hammock materials differ regionally.
    It describes confusion among names such as Witoto, Karahone, Miranha/Miranya,
    and Boro, and explains that groups often refer internally to “our speech” or “our
    own people” while receiving multiple external names from neighboring peoples.
    Several names are glossed as animal, insect, enemy, or wanderer terms, and spelling
    variation is noted as another source of difficulty.
  language: English
  quote_policy: summarized
