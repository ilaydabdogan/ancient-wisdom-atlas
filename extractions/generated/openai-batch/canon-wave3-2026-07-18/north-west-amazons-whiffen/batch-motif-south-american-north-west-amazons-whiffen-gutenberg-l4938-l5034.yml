canonical_text:
  quote: ''
  summary: 'The passage describes birth-related customs and beliefs among Northwest
    Amazonian peoples as reported by Whiffen: small family size, abstinence during
    pregnancy and lactation, high infant mortality, newborn submersion in water, pregnancy
    food tabus based on the belief that eaten animals affect the child, paternal abstinence,
    forest birth outside the house, female attendance, cord cutting, and the mother''s
    bathing after birth.'
  language: English
  quote_policy: summarized
