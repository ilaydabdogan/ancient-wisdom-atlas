  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Near the Japura River, the party searched for a bulge-stemmed palm tree to
    make a canoe and saw three Karahone canoes going downriver.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the Karahone canoes could not be stopped, the narrator reports that
    an alarm had been given, houses were abandoned, and the path contained poisoned
