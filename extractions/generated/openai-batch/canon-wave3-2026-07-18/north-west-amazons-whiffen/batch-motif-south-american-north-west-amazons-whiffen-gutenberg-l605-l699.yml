canonical_text:
  quote: ''
  summary: The narrator describes hiring and managing indigenous escorts and carriers
    in the Rubber Belt, travel through Chorrera, the Igara Parana, Andoke country,
    the Japura River, and the Kahuinari River, an attempted contact with Karahone
    canoes followed by abandoned houses and poisoned stakes, and the beginning of
    an account of Eugene Robuchon’s disappearance and route.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rubber-gatherers are described as training Indian boys as armed escorts and
    using them to obtain rubber from tribes hostile to the boys’ own tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hired carriers expected gifts at the end of service; cloth, beads, knives,
    and guns are described as valued trade goods or wealth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A boy called Jim promised to travel very far in exchange for a shotgun and
    carried a Winchester while serving as escort.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two half-breeds were rubber-collectors traveling with the narrator only as
    far as Chorrera.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator says carriers were often changed, had to be strongly disciplined
    and shepherded, and might run away if given the chance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that treachery by native Indians had to be guarded against
