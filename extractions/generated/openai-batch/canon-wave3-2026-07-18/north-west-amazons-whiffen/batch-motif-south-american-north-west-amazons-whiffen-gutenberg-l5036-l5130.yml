canonical_text:
  quote: ''
  summary: 'The passage describes postbirth treatment of infants among Witoto, Boro,
    Kuretu, and related groups: river washing and immersion, coating with rubber latex
    and clay, explanations given for deaths during immersion, killing or abandonment
    of some illegitimate, twin, sickly, deformed, or orphaned infants, attribution
    of abnormal births to evil spirits or enemy craft, and the father’s postbirth
    couvade tabus concerning hunting, weapons, and diet.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A newborn infant is taken with the mother to the river, washed, and ducked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the infant survives the river treatment, its body is covered with rubber
    latex called hittagei and then smeared with brown or red clay.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that submerging the newborn child increases deaths, and
    informants said a child not strong enough to survive had better die.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that fœticide is not practised, while unwanted children
    may be killed after birth during the subsequent lustration.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that children described as illegitimate are destroyed,
    and that the second of twins is left in the bush before immersion; in some Kuretu
    cases involving one boy and one girl, the girl is killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage explains that the second twin is treated as a transgressor and
    that twin birth is considered disgraceful because it is likened to the level of
    beasts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A child discovered at birth to be abnormal or sickly may be held under water
    until dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If deformity is discovered after the child reaches the tribal house, the medicine-man
    may be called; if he cannot remedy it, he may declare an evil-spirit cause and
    danger to the tribe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After such a declaration, the child may be left exposed in the forest or buried
    alive.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: An epidemic of deformed or sickly newborns would likely be attributed to the
    evil intention or craft of an enemy, whom the medicine-man would determine.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The passage reports two Witoto cases after a mother’s death: one infant was
    thrown to dogs, and another was buried with the dead mother when no one would
    adopt it.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Koch-Grünberg is cited as finding a small postbirth chamber in Tuyuka houses,
    while the author states that no such thing exists among the tribes under discussion.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The day after delivery, the mother presents the infant to the father and returns
