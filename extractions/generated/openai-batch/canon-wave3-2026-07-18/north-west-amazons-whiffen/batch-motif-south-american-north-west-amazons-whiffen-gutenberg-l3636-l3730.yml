literal_observations:
- id: obs:1
  text: The passage lists local occupations as agriculture, hunting, fishing, war-making,
    and festival-holding, and states that the people are not pastoral and do not keep
    cattle, pigs, fowls, or trained dogs in this district.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Most agricultural work is assigned to women, while men perform the preliminary
    heavier work of clearing, cutting, and breaking untouched soil.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each tribal house stands in a small clearing, with a large outer dancing ground
    in front and cultivated plots located nearby but not directly surrounding the
    maloka.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Private plantation patches may belong to married men or men with private bush
    lodgings, while tribal plantations belong to the chief.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: To prepare plantation ground, smaller trees are felled, larger trees are burnt,
    dry branches are set alight, and the clearing becomes a series of smouldering
    bonfires that leave charred posts and ashes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After burning, the ground is broken with wooden clubs; after this stage the
    men’s work ends and women take charge of the plantation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Witoto terms given are ike for a plantation before planting and akpho
    after planting.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women use a rough wedge-shaped wooden stake for digging, raking, and hoeing,
    and they work daily to prevent forest growths and creepers from reclaiming the
    cleared ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women go to the plantation after the morning bath, plant manioc cuttings,
    and tend crops such as pineapples and sugar-cane, while men go by canoe or hunt
    in company.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sowing is done during the rainy season, but there is no special harvest time
    because crops grow and ripen throughout the year.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage identifies maize as the only grain sown, while coca, manioc, and
    tobacco are described as the most universally cultivated crops.
  category: object
  evidence_refs:
  - ev:5
