canonical_text:
  quote: ''
  summary: 'The passage describes Amazonian wind instruments made from bamboo, human
    and animal bones, animal skulls, clay, bark, and palm stems. It gives special
    attention to Jurupari trumpets: sacred tribal instruments kept hidden away from
    the maloka, forbidden to women, connected with boy initiation and exorcism of
    an evil spirit from the novice, and used only north of the Japura according to
    the narrator.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bamboo is used for a larger flute, and flutes or fifes are made from arm-bones
    of prisoners taken in battle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a victim is killed and eaten, the humerus is cleaned, opened at the
    extremities, scooped out, and bored with finger-holes, usually three and sometimes
    five.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When human bones are not available, a tribesman uses a jaguar leg-bone, opened
    at the end and fitted with a wax stop that leaves a canal to a three-cornered
    air-hole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Heron-bone flutes are open at the lower end, have a square air-hole, generally
    four sound-holes, leaf mouthpieces, and very shrill tones.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some flutes are made from animal skulls covered with pitch, leaving only the
    nose and occipital holes open; one hole is blown through and the other serves
    as the sounding-hole.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Many bone flutes are ornamented with incised patterns dyed black and red and
    with tassels of cotton or palm-fibre.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The narrator states that native trumpets in the region do not have sliding
    tubes, plugs in the mouth-hole, or vibrating reeds, and that he encountered no
    bagpipes or stringed instruments in the regions traversed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Desana use clay whistles both as alarm signals and as adjuncts to the
    dance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Bark and bamboo trumpets have irregular distribution, and many tribes restrict
    them to Jurupari music.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sacred Jurupari trumpets are long instruments made from hollow palm stems,
    fitted with trumpet mouthpieces, and described as having a bassoon-like note.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Jurupari trumpets are tribal possessions kept concealed in a hut away from
    the maloka, where women may not enter and where boy-initiation paraphernalia such
    as tapir-hide whips are stored.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: It is described as a capital crime for any woman to see the Jurupari trumpets.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Girls are taught that trumpet music is necessary to exorcise an evil spirit
    from a youthful initiate and that female interference would leave the spirit in
    the novice and harm the tribe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: When Jurupari music approaches the maloka, women and the uninitiated go into
    the bush and remain hidden until the ceremony ends and the trumpets are returned
    to their storage place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The ceremony is kept secret, and infringement is punished by death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Usually two sacred trumpets are used; they are tuned to the same pitch but
    differ in tone according to length.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: The passage says Jurupari music is used only north of the Japura; south of
    the river, tribes have no Jurupari music and know it as a neighboring ceremonial
    practice connected with initiation secrets and frightening women.
  category: setting
  evidence_refs:
  - ev:8
