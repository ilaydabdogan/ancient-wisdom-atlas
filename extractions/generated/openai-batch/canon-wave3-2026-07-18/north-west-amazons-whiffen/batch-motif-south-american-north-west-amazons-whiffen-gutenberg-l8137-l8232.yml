  summary: The passage discusses Whiffen's transliteration system, difficulties in
    collecting Andoke vocabulary, observed affirmative and negative speech customs
    among Issa-Japura peoples, Witoto and Boro sentence construction and grammatical
    features, and the limited use of gesture signs, including pointing, beckoning,
    and a ribald sexual gesture.
