    by biting the big toe, while noting the author did not personally see a case.
    The passage closes with observations on the rarity of pets, one sighting of Menimehe
    children with tame monkeys, and a cited claim by Bates about monkeys as pets and
    women suckling young monkeys, which the author does not corroborate.
