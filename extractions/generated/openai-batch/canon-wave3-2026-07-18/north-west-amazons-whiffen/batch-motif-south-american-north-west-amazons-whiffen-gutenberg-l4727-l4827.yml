  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that men among some northern tribes drink caapi, while
    the author suggests caapi is unknown south of the Japura except probably to medicine-men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Caapi is prepared from plant stems, mixed with roots of painted caapi, pounded,
    rubbed through a sieve, and mixed with water; women are not allowed to touch the
    vessel containing it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Fermented drinks north of the Japura include maize and manioc drinks, caxiri,
