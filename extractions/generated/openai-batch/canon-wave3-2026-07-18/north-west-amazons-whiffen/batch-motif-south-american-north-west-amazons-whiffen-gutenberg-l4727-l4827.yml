  summary: The passage describes unfermented, fermented, stimulant, and intoxicating
    drinks among Northwest Amazon groups, including morning herb infusions, manioc
    and fruit drinks, patana palm drink, vegetable milk, caapi, caxiri, masato, kawana,
    and coca. It notes preparation methods, drinking customs, gender restrictions
    around caapi vessels, dance-related beverage storage, and authorial suggestions
    about caapi effects and possible Inca influence on coca use.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bitter herb infusion is taken in the early morning after bathing, drunk
    from half-gourds, and functions as the first meal of the day before household
    members disperse.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Capana seeds are scraped, mixed with cassava flour, wrapped in plantain leaves,
    fermented in water until saffron-colored, dried in the sun, and later diluted
    as a bitter morning tea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Indians may drink large quantities of water or unfermented
    liquor, do not drink while eating, and at feasts or dances may induce vomiting
    to continue drinking non-alcoholic beverages.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Principal unfermented drinks are made from manioc and fruits; one manioc by-product
    is produced by squeezing and boiling liquid from grated manioc.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Patana palm drink is described as a thick yellow liquid and as the national
    drink of these Indians, with the Menimehe and Kuretu named as exceptions because
    they make fermented drinks from pine fruit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A vegetable milk, identified by the author as likely cow-tree milk, is described
