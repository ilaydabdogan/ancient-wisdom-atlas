  quote: ''
  summary: The passage describes beliefs and practices concerning the anaconda as
    Yacu-mama, aquatic animals, jaguars or tigers, photographic technology, a forked
    palm tree, and celestial beings. It reports fear of water spirits, avoidance and
    revenge hunting of jaguars, anxieties about soul-capture by camera, respectful
    fear of an unusual tree, and veneration of the sun and moon, with stars explained
    by one Boro informant as souls of chiefs and great men.
  language: English
  quote_policy: summarized
