  summary: The passage describes the narrator's observations and reports about physical
    characteristics and bodily practices among Upper Amazonian groups, including running
    and burden-bearing, posture, skin treatment, bathing and parasites, depilation
    with rubber latex, exceptions for medicine-men and Karahone facial hair, and close
    cutting of girls' hair as a claimed precaution against kidnapping.
