  text: The narrator states that monogamy, not polygamy, is the rule among the tribes
    discussed, with exceptions reported for chiefs north of the Japura and among tribes
    on the Tikie.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs south of the referenced northern region are described as having only
    one wife, like ordinary members of the tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Female prisoners and unattached women are said to belong by right to the chief,
    who provides them protection in a role described as father, mother, and husband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage distinguishes these protected women from tribal prostitutes, while
    also stating that other men may have access to them if the chief consents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Where more than one wife is permitted, the first wife is said to retain the
    position of mistress of the house.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Marriage is described as lacking a long ceremony, festival, or elaborate ritual,
    and a youth marries when he reaches manhood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: An unmarried youth remains dependent because he cannot plant his own manioc
