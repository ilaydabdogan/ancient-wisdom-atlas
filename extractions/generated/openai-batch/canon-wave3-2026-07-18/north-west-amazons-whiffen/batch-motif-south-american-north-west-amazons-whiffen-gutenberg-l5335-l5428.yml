canonical_text:
  quote: ''
  summary: 'The passage describes marriage regulations among the tribes observed by
    Whiffen: monogamy is presented as the rule with exceptions among some northern
    chiefs; chiefs control and protect female prisoners or unattached women; marriage
    is simple and marks a youth''s movement into adult independence; a suitor must
    show hunting and defensive competence, sometimes through archery; and an intending
    bridegroom prepares a plantation before bringing a wife to live with his family
    or household group.'
  language: English
  quote_policy: summarized
literal_observations:
