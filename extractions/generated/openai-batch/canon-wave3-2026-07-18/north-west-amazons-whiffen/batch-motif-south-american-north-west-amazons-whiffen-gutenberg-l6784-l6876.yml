  summary: The passage describes songs as essential to dances and music as chiefly
    ceremonial. It details choral performance led by a male soloist, simple repeated
    melodies, rhythmic stamping, old tribal songs whose words are no longer understood,
    and harvest dances in which men sing a challenge and women reply. It also notes
    the absence of love-songs, sacred songs, nursery songs, and lullabies in the author's
    account.
