canonical_text:
  quote: ''
  summary: The passage reports beliefs about a Good Spirit and Bad Spirit, their lesser
    spirits, and their domains. The Good Spirit is linked with beneficial forest things,
    rivers, and skies, while the Bad Spirit is linked with harmful landscape features,
    poison, noxious growths, night wandering, shapeshifting, deception, and abduction.
    The medicine-man uses magic rather than prayer against the Bad Spirit. The passage
    then describes four kinds of spirits, temporary soul transmission into animal
    bodies, and a remembered soul that lingers after death before going to the Good
    Spirit’s happy grounds above the skies or upstream toward the setting sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The supreme good and evil spirits are described as standing in the relation
    of great chiefs over lesser spirits of good and evil.
  category: relationship
  evidence_refs:
