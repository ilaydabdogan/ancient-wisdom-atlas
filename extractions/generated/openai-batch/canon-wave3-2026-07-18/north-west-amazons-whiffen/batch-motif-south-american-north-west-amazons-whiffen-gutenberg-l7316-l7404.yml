    powerless to hurt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Four classes of spirits are listed: ghosts of the dead, temporarily disembodied
    souls of living people, spirits from other worlds, and spirits of or in natural
