- id: obs:2
  text: The Good Spirit is said to have made beneficial forest things, including edible-fruit
    trees, arrow-making trees, coca, useful herbs, medicine-men’s magic stones, rivers,
    and skies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bad Spirit is said to have placed rocks in rivers, poison in mandiocca
    and noxious growths, the liana that trips walkers, and other hurtful things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Good Spirit is located above the world, while the Bad Spirit inhabits
    the nether regions; earth holes are described as passages to the Bad Spirit’s
    kingdom.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Good Spirit’s visit to earth as a corporate being is described as unique
    and unrepeated, while the Bad Spirit is said to wander in the forest every night
    with attendants.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bad Spirit is described as sometimes taking the form of a tiger or other
    fierce animal, and sometimes resembling a man who can disappear at will.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bad Spirit is said to imitate the call of a hunter who has found game
    or the call of an animal to be hunted, enticing a victim deeper into the bush
    until lost, destroyed, or bodily spirited away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A child-lifting story is described as a favorite account, and a recovered
