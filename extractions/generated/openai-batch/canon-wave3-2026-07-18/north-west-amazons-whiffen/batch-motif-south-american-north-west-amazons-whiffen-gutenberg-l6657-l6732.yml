canonical_text:
  quote: ''
  summary: The passage describes a Muenane riddle-and-animal dance that has spread
    to other tribes, its central questioner with a torch, failed respondents who become
    followers and imitate animal behavior, animal-themed riddles, dance excitement
    and duration, an exceptional incident restrained by a chief, and a separate elimination-style
    line dance involving turns on an agreed cue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Muenane are described as possessing a dance that has spread to many tribes
    south of the Japura and become popular.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Muenane dance combines a riddle dance and an animal dance, with a witty
    warrior in the centre chanting an original riddle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dancers rotate around the questioner while taking up the chanted question.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the end of the measure, the riddler runs around the circle with a lighted
    torch, stops before a performer, thrusts the torch near his face, and repeats
    the question.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A performer who cannot answer gives the Muenane negative reply “Jana” and
    becomes a follower of the questioner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Failed respondents imitate the questioner’s antics, which are said to provide
    clues to the animal whose name is the answer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The failed respondents form a single file and present a burlesque of the habits
    of the animal that answers the riddle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The first performer to guess correctly becomes the next questioner, and the
    dance begins again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage lists jaguars, tapirs, monkeys, parrots, and other bush animals
    as subjects whose actions are closely mimicked.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The riddles are said to be nearly always about animals, with wit tested by
    sexual suggestion in the reply.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage attributes dance excitement to rhythmic motion, coca use, and
    sexual innuendo in songs, and states that one dance may last five days and nights
    with only short pauses.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: An exceptional salacious incident was restrained by order of the chief; the
    narrator states that the dance normally remains frenzy and excitement without
    eroticism and dwindles rather than formally ends.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A separate dance between the Issa and the Japura uses a line or two parallel
    lines led by a song-leader; dancers must turn on an agreed cue without losing
    the beat, and those who fail are withdrawn.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The second dance continues until only the fittest remain and is said to produce
    general amusement.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: In a described incident, an intoxicated questioner thrusts a torch near the
    narrator’s face; the narrator knocks him over, and the audience laughs at the
    discomfiture.
  category: sequence
  evidence_refs:
  - ev:4
