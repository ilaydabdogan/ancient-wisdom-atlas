  summary: 'The passage describes an ethnographic account of Amazonian tribal dances:
    a male victory dance after a cannibal feast with captives and enemy body parts;
    a nighttime dance around a maloka led by a soloist with rattles and accompanied
    by fires, torches, flutes, pan-pipes, and drums; and the way the dance draws even
    an outside observer into synchronized participation.'
