canonical_text:
  quote: ''
  summary: 'The passage describes bodily adornment and marking among several north-west
    Amazonian groups: ear boring and ear ornaments, wooden and shell ear plugs, labrets,
    nose-pins and nasal feathers, puberty scars, tattooing, tribal marks, and body
    paints with their colors and materials.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says ears are bored at puberty among the tribes being discussed,
    and small cane ear ornaments may be decorated with feather tufts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The name Orahone is explained as meaning “Big Ears” and is applied to different
    tribes that wear large wooden plugs in the ear lobes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Orahone and some Issa-Japura tribes, especially among the Boro-speaking group,
    use cabbage-wood ear discs; the Orahone color them red, while the Boro set an
    ornamented shell into the wood.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Some ear ornaments use shell, pitch, bamboo, black-and-white scratched patterns,
    white clay filling, or mother-of-pearl river shell.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Boro and other Indians near the Japura, the lip is perforated for
    a labret, while the Witoto are stated not to use the labret.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nose ornaments vary by group, including palm-spine pins, long pins, nasal
    ornaments, bird bones, quills, feathers, and goose feathers.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Boro, especially women in the central Igara Parana district, make small
    holes in the wing of the nose and insert feathers for dances after keeping the
    holes open with quills.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tuyuka boys burn scars on their arms at puberty; the narrator says he has
    not seen scarification among the Issa-Japura tribes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Menimehe men and women tattoo the face and breast; cheek designs are described
    as tribal marks, and lizard figures may appear on the arms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tattooing is described as being made with a palm spine, with black residue
    from burnt rubber rubbed into the puncture, leaving a blue mark.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Some Boro north of the Japura are said to have borrowed tattooing from the
    Menimehe and wear a tribal mark below the cheek-bone and sometimes a breast pattern.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says few groups tattoo, but all paint; colors include red, yellow,
