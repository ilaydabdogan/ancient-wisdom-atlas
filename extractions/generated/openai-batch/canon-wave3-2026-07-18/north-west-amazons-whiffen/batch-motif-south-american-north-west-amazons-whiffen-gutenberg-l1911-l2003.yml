literal_observations:
- id: obs:1
  text: Native houses are generally similar, often rough parallelograms or squares
    with rounded angles; lower Apaporis houses are circular, Napo River houses hemispherical,
    and Witoto or Boro houses usually have a triangular section with a pointed roof.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some houses have a lower section made of close-set palisade lined with matting
    or thatch; this is more noticeable among Nonuya houses, and Makuna houses are
    described as invariably fortified and lighter than Boro dwellings.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Witoto or Boro house is usually about 60 to 70 feet in diameter, and house
    size depends on the number of people in the tribe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The houses have no windows, and the entrance is a small opening in the palm-thatch
    eaves, closed by removable thatch or by a thatch curtain.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The entrance is kept closed, and people entering are expected to fasten it
    after they enter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Because of the absence of openings, maloka interiors are nearly as dark by
    day as by night; the gloom is said to keep insects out.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The central space inside the house is usually kept clear and used by children
    for play when not needed for dancing or a tobacco palaver.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The far end of the house is reserved for the chief and his family and usually
    has another small entrance; in some Witoto houses the area was matted off.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that Boro and Witoto houses do not have the palm-leaf cubicles
    noted for Uaupes houses or the two-part divisions described for Tuyuka houses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Each family has its own fire, which is described as the only internal distinction
    in ordinary Boro or Witoto houses, though lower Apaporis houses may use beaten
    palm-leaf mats to form family booths.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Apaporis Indians make sleeping shelves or platforms, while other Issa-Japura
    tribes use hammocks slung about two and a half feet from the ground.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: One hammock is hung for every man adjacent to, and almost over, his family
    fire; another belongs to his wife, and a third may be placed for children near
    the sloping thatch.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Family possessions are stored on rafters overhead along with hammocks, cooking
    pots, baskets of dried fish or smoked meat, the cassava-squeezer, and personal
    treasures.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The chief has no separate house; any tribesman may build a small bush house
    for his family while retaining a right to a corner in the common tribal dwelling.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: At ordinary times the tribal house may contain fifty to sixty people, while
    festivities may bring as many as two hundred people inside.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: The narrator describes native houses as very dark, very hot at night, and
    full of smoke, since most tribes lack chimneys.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: Some Apaporis Indians and the Kuretu have smoke-dispersing arrangements, but
    ordinary Boro or Witoto houses have nothing to disperse smoke from wood fires.
  category: object
  evidence_refs:
  - ev:7
- id: obs:18
  text: Wood fires are never extinguished because the tribes have no means of making
    fire; if a fire dies out, the household remains fireless until live embers are
    obtained from a friendly neighbor.
  category: sequence
  evidence_refs:
  - ev:7
