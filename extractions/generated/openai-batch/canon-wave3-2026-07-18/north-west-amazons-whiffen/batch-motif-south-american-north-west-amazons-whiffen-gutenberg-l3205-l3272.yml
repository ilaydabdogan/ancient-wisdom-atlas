canonical_text:
  quote: ''
  summary: The passage describes body-painting, pigments, and design practices among
    several Northwest Amazonian groups, including protective coatings for infants,
    women’s recurring dance paint, tribal and individual variation in designs, representational
    Andoke painting, Okaina elaboration, and more limited male painting practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Red or scarlet paint is described as a favorite colour, often daubed over
    women’s whole faces; blue-black staining and black juice on the face or neck are
    also described.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Latex with black ashes, resinous matter, black ashes, and yellow clay are
    reported as body treatments; the narrator states that the ash or clay treatment
    appears protective because babies in arms are invariably treated in this fashion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Orahone and some Issa and Japura Indians, women cover their teeth
    and fingernails with black pigment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Paint is renewed before it has entirely worn off, with fresh designs superimposed
    on older paint.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women always paint themselves for a dance, and they also paint themselves
    on occasions other than dances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The independent Andoke are described as having no fixed pattern and more flowing
    lines; one Andoke design uses purple paint while leaving a broad unpainted seam
    down the middle of the body.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In dances, Andoke painters are described as making representations of Witoto
    neighbours and, in another case, painted weapons and clothing forms in honour
    of the narrator.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator states that regular patterns can be fitted to the lines of the
    body and that Okaina women’s designs are the most elaborate he encountered.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage notes that women do not attempt to hide, disguise, or paint the
    body part that the narrator says males never expose.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Paint combined with tight leg ligatures is said to give women’s legs the appearance
    of small balcony pillars.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Witoto are described as less regular in painting, with crude smears and
    splotches rather than regular designs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Men are painted by women before a dance, but not with the intricate patterns
    or variety of colours used by women for themselves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Among the Okaina, three old women came with purple paint to paint the narrator
    for a festivity.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Andoke men are described as more inclined to paint themselves than men of
    other tribes, always using purple paint; a common device is a lizard painted on
    the back and chest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Male painting is described as not universal; the narrator states that he does
    not remember seeing a Witoto man painted.
  category: attribute
  evidence_refs:
  - ev:8
