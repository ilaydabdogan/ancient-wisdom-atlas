canonical_text:
  quote: ''
  summary: The passage describes fear of darkness, night sheltering in the maloka,
    and firelight storytelling. It comments on long, variant, grafted tales; summarizes
    beliefs about sun, moon, and night spirits; and gives a local manioc myth in which
    the Good Spirit teaches use of the plant but withholds its reproduction, a chief's
    virgin daughter conceives through a manioc root or plant-hunter, and her precocious
    daughter teaches women to propagate manioc from stalk pieces. It ends by contrasting
    a Barré story in which a bird reveals mandiocca from a solitary tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Darkness is described as feared, with children fearing tigers and other dangers,
    and adults ending occupations at sundown to gather in the maloka.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: People tell long tales by firelight after eating, and storytelling may continue
    until dawn, when embers are stirred and people wait for daybreak.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tales are described as lengthy, involved, variable, and often grafted
    together by narrators.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Stars are said to be largely ignored in these tales, while the sun is described
    as more important and the moon as his wife in a subordinate position.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: One explanation says the moon is periodically sent by her husband the sun
    to drive away evil night spirits; other tribes deny this protective character,
    and some hide infants from the moon.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Good Spirit comes to earth, shows the Indians a manioc plant, and teaches
    them how to extract the evil spirit's influence from it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Good Spirit does not explain how to reproduce manioc; the Indians search
    for seeds and bury young tuberous roots without success.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A virgin daughter of the chief is later found pregnant and explains that,
    while sick and under the medicine-man's magic, she wandered into the bush and
    found a beautiful manioc plant.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The woman is said to be seduced by the tuberous root; in another version,
    the plant is metamorphosed into a beautiful young hunter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The woman gives birth to a girl-child who can both talk and walk at birth.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The child takes women of the tribe to a manioc plantation up a river and explains
    how to reproduce manioc using pieces of stalk.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that cassava remains the chief food of the peoples described.
  category: relationship
  evidence_refs:
  - ev:8
