  summary: The narrator describes Indigenous attitudes toward white men, an incident
    in which formerly enslaved companions left him, a practice of stealing or losing
    enslaved Indigenous people, gendered work observations, curiosity about foreign
    possessions, fear or wonder over devices such as an eyeglass, camera, watch, phonograph,
    bicycle, and horses, and an argument rejecting the theory that the groups had
    regressed from a higher culture.
