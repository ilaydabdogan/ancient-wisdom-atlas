canonical_text:
  quote: ''
  summary: The passage describes extra-mundane spirits that visit the world, inhabit
    or invade natural objects, and may harm people through darkness, forests, deep
    waters, floods, storms, misdirection, and sickness. Medicine-men counter these
    dangers. Disease is described as a hostile invading spirit or foreign body. The
    passage also presents an animistic view in which animals, plants, rocks, and other
    objects have souls or occult agency. It says Boro-speaking groups have especially
    intricate spirit beliefs, and it singles out the jaguar and anaconda as magical
    beasts that are not killed for food.
  language: English
  quote_policy: summarized
