canonical_text:
  quote: ''
  summary: 'The passage describes medicine-men’s ritual objects and practices: condor
    claws, anaconda and snake skins, strings of magical stones, trance-like stone-gazing,
    rattling and shouting, magical rubbing, diagnosis of enemy malice behind sickness
    or disaster, vengeance or recovery rituals after a child is lost or killed by
    a tiger, divination of hostile tribes, influence over war policy, and suspicion
    toward white strangers as rival magic-workers.'
  language: English
  quote_policy: summarized
