canonical_text:
  quote: ''
  summary: 'The passage describes rites for Venus in spring, including washing the
    goddess, removing and restoring her ornaments, offering flowers and roses, and
    bathing under myrtle because Venus once covered herself with myrtle when Satyrs
    saw her naked. It explains offerings to Fortuna Virilis at a warm-water place,
    a milk-poppy-honey drink associated with Venus as bride, and supplication to Venus
    for beauty, morals, and reputation. It then notes Rome’s fallen chastity, the
    Cumaean woman’s advice to build temples to Venus, and a prayer for Venus to protect
    Roman descendants and brides. The final section gives celestial calendar signs:
    Scorpius setting, dawn, the Pleiades rising, and explanations for why seven Pleiades
    are named but only six are usually visible.'
  language: Latin
  quote_policy: summarized
