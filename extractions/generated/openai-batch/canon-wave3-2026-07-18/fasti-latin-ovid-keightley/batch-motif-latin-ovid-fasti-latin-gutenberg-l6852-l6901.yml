candidate_motifs:
- id: motif:1
  label: Spring festival of Venus and seasonal renewal
  taxonomy_refs:
  - seasonal_cycle
  basis: Venus is linked to the beautiful season and spring, winter maritime danger
    is past, and later celestial signs mark seasonal time.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is calendrical and ritual; the extraction should not infer
    a full vegetation-deity pattern beyond the explicit seasonal framing.
- id: motif:2
  label: Ritual bathing and re-adornment of a goddess
  taxonomy_refs:
  - sacred_exchange
  basis: Worshippers are instructed to remove Venus’s golden ornaments, wash the goddess,
    restore the ornaments, and offer flowers and a fresh rose.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The taxonomy reference is limited to the exchange-like offering and service
    to the deity; the passage does not frame the rite as a bargain in formal terms.
- id: motif:3
