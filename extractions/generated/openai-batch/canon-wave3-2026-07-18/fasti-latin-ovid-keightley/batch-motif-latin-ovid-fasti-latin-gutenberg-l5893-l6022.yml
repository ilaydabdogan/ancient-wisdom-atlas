canonical_text:
  quote: ''
  summary: The passage is a set of editorial notes on Ovid's Fasti. It discusses textual
    variants, the Consualia, figures connected with Romulus, explanations for a matrons'
    feast on the Kalends of March, Juno Lucina and fertility prayer, the Salii and
    the sacred ancilia, the nymph Egeria, the grove of Aricia, votive torch processions,
    the Rex Nemorensis, and a comparison between an Italian legend and the Menelaus-Proteus
    episode.
  language: English with Latin terms
  quote_policy: summarized
