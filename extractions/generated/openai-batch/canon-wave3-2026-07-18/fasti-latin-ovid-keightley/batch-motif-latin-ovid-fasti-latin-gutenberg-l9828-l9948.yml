canonical_text:
  quote: ''
  summary: Commentary on Fasti passages concerning the name of May, Maia, Mercury,
    Calliope and the Muses, Oceanus and Tethys, Arcadians, Luperci, Capella and the
    nursing of Jupiter, and the May rites or monuments of the Lares.
  language: English commentary with Latin and Greek citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary reports an opinion that the month was named from Maia, described
    by one source as Vulcan's wife and by others as Mercury's mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maia is described in the commentary as an old Italian deity and is identified
    there with Earth and with Bona Dea worshiped on the Kalends.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says a festival of Mercury occurred in May and that traders sacrificed
    in the month to Maia and Mercury.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The commentary identifies Calliope as placed at the head of the list of the
    Muses and mentions ivy as an ornament of learned brows.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Oceanus and Tethys are described as Titans, children of Heaven and Earth,
    and ancient poets are said to represent Ocean as a huge river flowing around the
    earth.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Luperci are described as running girded with goat-skin thongs through
    crowded streets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mercury's lyre is described as having seven strings, and its invention is
    ascribed to Hermes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentary describes the star Capella in the right shoulder of the Charioteer
    constellation and discusses its rising in May.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'A birth tradition of Jupiter is summarized: Rhea gave him to Themis, Themis
    committed him to Amalthea, and Amalthea had him suckled by her goat.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: An alternate tradition says Amalthea was the goat and had two kids, all later
    raised to the skies by Jupiter as a grateful nursling.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The altar of the Guardian Lares is said to have been erected on the Kalends
    of May, with discussion of Curius, Tatius, and Servius Tullius in relation to
    Lares worship.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: Compitalia rites are described as sacrifices at crossroads, and Augustus is
    said to have ordered the Compital Lares to be adorned with spring and summer flowers.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The 'three divinities' are glossed as the two Lares and the Genius of Augustus.
  category: relationship
  evidence_refs:
  - ev:13
