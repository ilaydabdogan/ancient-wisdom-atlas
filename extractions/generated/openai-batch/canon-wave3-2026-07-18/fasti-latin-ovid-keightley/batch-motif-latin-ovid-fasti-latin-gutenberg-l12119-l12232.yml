canonical_text:
  quote: ''
  summary: The notes discuss Roman vows after the defeat at Lake Trasimene, then explain
    the Vestalia and antiquarian interpretations of Vesta as fire, earth, a virgin
    deity, and the deity of a round temple associated with cosmic and terrestrial
    forms. The passage also discusses Vestal virgins, the Atrium Vestae, Archimedes'
    sphere, Greek Hestia parallels, and disputed etymologies.
  language: English commentary with Latin and Greek citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Roman defeat by Hannibal at Lake Trasimene, where the consul C.
    Flaminius was killed, the Sibylline books were consulted and vows were made to
    Jupiter, Venus Erycina, and Mars.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note states that Romans had a custom of trying to gain over the deities
    of their enemies and connects this with a proposed Phoenician origin for Venus
    Erycina.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Vestalia are identified as occurring on the V. Id., and the poet is said
    to treat the subject at length.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vesta is described as the principle of fire and as lacking a visible anthropomorphic
    form like other deities.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The temple of Vesta is said to have been built by Numa, and Vesta is glossed
    as the guardian of flame.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Vestals are said to have dwelt in the Atrium Vestae, and ill Vestals who
    had to leave it were entrusted to matrons.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The temple of Vesta is described as round, with ancient explanations relating
    its form to the universe or to the spherical earth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage records identifications of Vesta with Earth or Gaia and also with
    fire, flame, focus, or ignis.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The commentary discusses disputed verses about the round world or earth, motion,
    and the earth's position in the middle of the world.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Archimedes' sphere is described as representing the motions of the sun, moon,
    and five planets around the earth and as being enclosed in glass.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Vesta is described as unmarried, and reasons are given for her virgin priestesses,
    including Vesta's own virginity, fire's sterility, easier guarding of the fire,
    and chastity.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The commentary reports etymologies deriving Vesta from standing and focus
