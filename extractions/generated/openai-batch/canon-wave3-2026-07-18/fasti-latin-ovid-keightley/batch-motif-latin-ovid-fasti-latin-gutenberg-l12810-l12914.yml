canonical_text:
  quote: ''
  summary: Commentary notes discuss an aedile enforcing funeral restrictions, the
    meaning of exile and manumission, a Tibur stratagem involving musicians returned
    to Rome in covered carts, manuscript and medal evidence for Plautius, references
    to Marsyas and the Hyades nursing Bacchus, several calendrical astronomical risings,
    a Roman triumph, and temple dedications to Minerva and Summanus.
  language: English with Latin and Greek terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A law of the Twelve Tables is cited as limiting funeral display to specified
    garments, purple bands, and ten flute-players, with no more to be added.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentator says this funeral law had fallen into neglect and appears
    to have been put in force by the aedile mentioned by the poet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Exilium is defined by the commentator as renouncing the freedom of one’s own
    city by taking municipal franchise in a treaty city, though he is unsure Ovid
    uses it in that strict sense here.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: According to the note’s report of Livy, the government of Tibur used a stratagem
    after envoys had been sent from Rome.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The word dapes is glossed as probably referring to a sacrifice.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The vindicta is explained as the rod laid by a lictor on the head of a slave
    about to be manumitted, and here it is used for liberty.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The note explains that the musicians were sent to Rome in covered carts, described
    through wicker or skin coverings around a vehicle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A medal of the Plautian family is described as bearing a female mask on one
    side and winged Aurora driving four horses on the other.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The commentator says the Plautian medal commemorates the act and the time
    of day, while also discussing manuscript variants and possible differences from
    Livy’s version of the story.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tibicina is glossed as a singular used for a plural, referring to the tibicines.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The note identifies haec turba as the tibicines and directs the reader to
    the story of Marsyas in Ovid’s Metamorphoses.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: On the seventeenth day before the Kalends of July, the Hyades rise acronychally;
    another tradition cited in the note says the seven Hyades nursed Bacchus and were
    also called Dodonides.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Calendar notes state that Favonius begins to blow and that the upper part
    of Orion rises acronychally; the commentator also notes a textual difficulty concerning
    stella serena and geminos polos.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The following night, the Dolphin rises.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: A. Postumius Tubertus is said to have triumphed after defeating the Volscians
    and Aequians on the Algidus.
  category: action
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:16
  text: The sun enters Cancer on the thirteenth day before the Kalends of July, the
    same day on which a temple to Minerva on the Aventine is noted.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: On the twelfth day before the Kalends of July, a temple was dedicated to Summanus,
    and Aurora is glossed as married to Tithonus.
  category: relationship
  evidence_refs:
  - ev:14
