canonical_text:
  quote: ''
  summary: The passage recounts the Gnosian Crown and the thread-giving woman who
    exchanged Theseus for Bacchus. Bacchus returns from eastern conquest with captives,
    provoking his wife's lament that he repeats Theseus' betrayal. Bacchus hears her,
    embraces her, promises shared heaven and the name Libera, and makes her crown
    a stellar monument by transforming its nine gems into fires. The passage then
    turns to the Equiria festival site beside the Tiber and its flooded alternative
    on the Coelian.
  language: Latin
