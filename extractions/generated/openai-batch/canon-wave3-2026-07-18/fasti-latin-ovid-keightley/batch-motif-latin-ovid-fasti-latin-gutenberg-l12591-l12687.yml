canonical_text:
  quote: ''
  summary: Commentary notes discuss Mater Matuta, her worship by Roman matrons, her
    proposed association with dawn-light and identification with Greek Leucothea;
    ritual exclusion and cuffing of a female slave; prayers concerning children; a
    tradition that Matuta predicted the death of P. Rutilius Lupus; and the temple,
    statue, and divine-human love tradition of Fortuna and Servius Tullius.
  language: English with Latin and Greek excerpts
  quote_policy: summarized
