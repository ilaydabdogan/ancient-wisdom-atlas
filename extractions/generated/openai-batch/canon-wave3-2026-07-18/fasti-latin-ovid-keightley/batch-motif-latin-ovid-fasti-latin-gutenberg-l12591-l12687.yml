    have been for their own children and changed when Matuta became Leucothea.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the day of the Matralia in the Social War, P. Rutilius Lupus fell in battle,
    and tradition related that the voice of Matuta had predicted his fate.
  category: sequence
  evidence_refs:
  - ev:5
