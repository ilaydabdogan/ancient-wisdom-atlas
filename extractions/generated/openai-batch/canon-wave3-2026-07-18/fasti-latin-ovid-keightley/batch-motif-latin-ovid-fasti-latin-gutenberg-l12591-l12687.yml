- id: obs:3
  text: Mater Matuta is identified with Greek Leucothea, and Portunus or Portumnus
    is said to have been identified with Palaemon through resemblance of name and
    office.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Female slaves were not admitted into the temple of Matuta; Plutarch reports
    that one female slave was brought in and cuffed by matrons, and a similar exclusion
    existed at the temple of Leucothea in Chaeronea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A question from Plutarch concerns why worshippers prayed good things for brothers'
