  text: Mater Matuta is described as worshiped at Rome by matrons and also at Satricum.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentator says there is no reason to regard Mater Matuta as a marine
    deity and presents her instead as connected with dawning light, Aurora, and Greek
    Eos.
  category: attribute
  evidence_refs:
