canonical_text:
  quote: ''
  summary: The passage invokes Vesta and explains her temple, its round form, its
    relation to earth and fire, her virgin service, the absence of an image, hearth
    and bread customs, the tale of Priapus thwarted by Silenus’ ass while Vesta sleeps,
    and the opening of an account of Jupiter Pistor during the Gallic siege of the
    Capitol.
  language: Latin
  quote_policy: summarized
