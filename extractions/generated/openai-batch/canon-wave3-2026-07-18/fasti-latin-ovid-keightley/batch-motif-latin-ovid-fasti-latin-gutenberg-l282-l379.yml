  text: The passage says that before Thales only visible and apparent risings and
    settings of signs were observed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Astronomers distinguish risings and settings into cosmic, acronych, and heliac
    kinds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cosmic is defined as the true morning phenomenon at sunrise; acronych as the
    true evening phenomenon at sunset or early night; heliac as the apparent morning
    rising or evening setting.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that in the morning true rising precedes apparent rising,
    while in the evening apparent setting precedes real setting.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: 'The Hyades are used as an example: they rise with the sun while in Taurus
    but are unseen until the sun has moved far enough away for them to be visible.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A star’s true evening setting is described as sinking with the sun below the
    horizon, while its heliac setting is becoming visible as the sun sets and then
    disappearing after sunset.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage lists three risings and three settings of a star and says the
    acronych, or true evening rising, most attracts attention.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Keightley says he thinks Hesiod always speaks of the acronych or true evening
    rising.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that ancient Romans used two kinds of year, one of ten
    months and one of twelve months.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ten-month year is said to have been ascribed to Romulus, and the improved
    twelve-month year to Numa.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Licinius Macer, Fenestella, perhaps Plutarch, and Joseph Scaliger are described
