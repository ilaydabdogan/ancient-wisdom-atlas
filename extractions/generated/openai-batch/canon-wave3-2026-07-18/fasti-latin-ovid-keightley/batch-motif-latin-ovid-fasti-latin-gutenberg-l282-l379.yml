  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Ten months are cited as a term used for mourning, instalments, credit, and
    an ancient rate of interest.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: Keightley links the positions of Saturnalia and Matronalia to a possible earlier
