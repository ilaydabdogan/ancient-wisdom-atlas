  summary: Keightley explains ancient astronomical terminology for stellar risings
    and settings, then introduces Roman calendrical traditions concerning ten-month
    and twelve-month years, their attribution to early kings, and arguments for a
    ten-month reckoning in Roman and Etruscan practice.
