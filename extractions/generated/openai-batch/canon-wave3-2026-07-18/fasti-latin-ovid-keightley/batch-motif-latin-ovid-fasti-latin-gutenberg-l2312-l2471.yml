    and later Roman literary references, supporting a cautious same-motif comparison
    across Greek and Roman literary corpora.
  claim_level: same_motif
  target: Aloadae / Otus and Ephialtes in Homer Odyssey, Virgil Georgics, and Horace
    Odes
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The note marks an allusion but does not summarize the mythic episode,
    so the exact shared elements cannot be checked from this passage alone.
- id: claim:2
  claim: The passage states that Persian Mithras, as solar deity, was identified by
    Greeks with Helius/Hyperion, supporting a same-function comparison for solar divinity.
  claim_level: same_function
  target: Greek Helius / Hyperion as solar deity
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: high
  limitations: The claim rests on the commentator's identification; the passage gives
    no ritual or narrative details beyond the solar function.
- id: claim:3
  claim: The note identifies Diana with Hecate, supporting a cautious same-function
    comparison of these goddess figures within the commentator's interpretive framework.
  claim_level: same_function
  target: Hecate as identified with Diana
  evidence_refs:
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides the identification but does not spell out the
    functions shared by Diana and Hecate.
- id: claim:4
  claim: The passage states that Isis was supposed to be the same as Io and notes
