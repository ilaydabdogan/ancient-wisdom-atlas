canonical_text:
  quote: ''
  summary: The passage consists of commentary notes on sections of Ovid's Fasti. It
    discusses the poet's turn to stellar risings and settings, praises astronomy,
    notes calendar phenomena for Cancer and Lyra, explains the Agonalia and sacrificial
    terminology, gives etiological notes on offerings and animal sacrifice, and identifies
    or cross-references several deities and mythic figures including the Aloadae,
    Aristaeus, Mithras/Helius, Diana/Hecate, Priapus, Bacchus, Pan, Isis/Io, and Night.
  language: English with Latin and Greek terms
  quote_policy: summarized
