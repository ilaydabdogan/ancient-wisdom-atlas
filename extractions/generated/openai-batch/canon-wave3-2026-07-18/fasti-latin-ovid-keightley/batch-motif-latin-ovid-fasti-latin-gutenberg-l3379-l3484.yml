canonical_text:
  quote: ''
  summary: The passage prescribes rites and small offerings for the Manes at Feralia,
    recounts prodigies when ancestral days were neglected, describes ritual restrictions
    during the festival, gives a silencing rite for Tacita, narrates the myth of Lara/Muta,
    Jupiter, Juturna, Mercury, and the birth of the Lares, and then turns to the Caristia
    family feast honoring kin, family gods, Concordia, the Lares, and Caesar.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says tombs receive honor and paternal souls should be placated
    with small gifts rather than lavish offerings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Offerings named for the Manes include garlands, sprinkled grain, a small amount
    of salt, Ceres softened in wine, violets, prayers, and words set at hearths.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aeneas is named as the bringer of this pious custom to Latin lands, and he
    is said to have offered solemn gifts to his father's Genius.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When wars caused the Parentales days to be neglected, the passage reports
    that Rome grew hot with suburban pyres and that ancestors were said to have left
    tombs and howled through city streets and Latian fields.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the omitted honors were restored to the tombs, the passage says prodigies
    and funerals came to an end or measure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'During these rites, marriage rites are suspended: girls and widows are told
    to wait, Hymenaeus is told to put away his torches, temple doors are closed, altars
    lack incense, and hearths stand without fire.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says thin souls and dead bodies wander from sepulchres at this
    time, and the shade feeds on food that has been set out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Feralia is identified as the last day for placating the Manes.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: An aged woman seated among girls performs rites for Tacita using incense placed
    under a threshold, dark threads bound with lead, seven black beans turned in her
    mouth, a fish head sewn and burned, and wine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old woman declares that hostile tongues and unfriendly mouths have been
    bound, then leaves drunk.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Jupiter is described as captured by desire for Juturna, who hides in woods
    and waters; he calls the nymphs and asks them to block her at the bank so she
    cannot immerse herself in river water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lara, a Naiad, had been warned by Almo to hold her tongue, but she warns Juturna
    to flee and tells Juno that Jupiter loves Juturna.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Jupiter removes Lara's tongue and orders Mercury to lead her to the Manes,
    saying the place is suited to silent ones and that she will be a nymph of the
    infernal marsh.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: As Mercury escorts Lara through a grove, he prepares force; she pleads by
    expression because she cannot speak, becomes pregnant, and bears twins who guard
    crossroads and watch over the household shrine as Lares.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the tomb rites, the Caristia gathers dear kin at shared meals so that
    the living may turn their faces back toward the living and count family degrees.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage excludes impious and harmful family members and mythic examples
    of kin-crime from the Caristia gathering.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: The family gods receive incense, Concordia is said to be especially present,
    food is offered to the Lares, and wine accompanies a prayer for the household,
    fatherland, Father Caesar, and the speakers.
  category: action
  evidence_refs:
  - ev:10
