canonical_text:
  quote: ''
  summary: 'Editorial notes to Ovid''s Fasti describe the inquiry into the origin
    of the name of May. The notes report several etymological explanations: one from
    the personified goddess Majestas, daughter of Honos and Reverentia; another from
    maiores and juniores after Romulus divided the people by age and civic function.
    The notes also mention Muses as disputants, Heliconic springs and Pegasus, Saturnian
    confusion with Titans, the Giant-war, Majesty''s association with triumphing generals,
    and parallels in Macrobius, Hesiod, and other Greco-Roman sources.'
  language: English commentary with Latin and Greek citations
  quote_policy: summarized
