  quote: Mota dea est, sequiturque ducem, laudatque sequendo.
  summary: A woman later named Claudia is accused by rumor but performs a water rite
    and prays to the Mother of the Gods for judgment; she draws the goddess by a rope,
    and the goddess follows, proving Claudia chaste. The passage then describes rites,
    procession, washing in the Almo, sacrifices, and explanations of Megalesian customs,
    the Galli, ancient foods, and later calendar notices.
  language: Latin
