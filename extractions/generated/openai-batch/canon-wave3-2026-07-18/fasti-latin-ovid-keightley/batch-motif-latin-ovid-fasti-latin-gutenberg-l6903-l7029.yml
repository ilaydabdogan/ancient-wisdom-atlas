candidate_motifs:
- id: motif:1
  label: Mother goddess with public procession and imported cult
  taxonomy_refs:
  - mother_goddess
  basis: The passage centers on the Magna Mater/Idaean Mother, her festival, city
    procession, divine speech, and transfer from Ida/Phrygia to Rome.
  evidence_refs:
  - ev:1
  - ev:10
  - ev:11
  - ev:12
  - ev:14
  confidence: high
  cautions: The extraction records only the passage's poetic account, not an external
    history of the cult.
- id: motif:2
  label: Concealed sacred child protected from a devouring father
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: Jupiter is born after Saturn has swallowed earlier children; a stone deceives
    Saturn and ritual noise shields the infant's cry.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage emphasizes a ritual explanation for noise rather than giving
    a full infancy narrative.
- id: motif:3
  label: Ritual noisemaking as mythic imitation
  taxonomy_refs: []
  basis: The companions' bronze instruments, drums, and Phrygian pipes are explicitly
    said to imitate the earlier actions of the Curetes and Corybantes around infant
    Jupiter.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family precisely names ritual aition or ritual imitation.
- id: motif:4
  label: Divine beloved bound by chastity vow and punished for breach
  taxonomy_refs:
  - divine_beloved
  basis: Attis is a Phrygian youth loved by or bound to the goddess under a chaste
    vow, violates the condition with Sagaritis, and suffers divine punishment.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames the relation as chaste love and temple service, not
    marriage.
- id: motif:5
  label: Self-mutilation as punishment and ritual model
  taxonomy_refs:
  - sacrifice
  basis: Attis wounds himself, offers blood as deserved punishment, removes the offending
    parts, and his frenzy becomes the example for attendants who cut their bodies.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage describes self-wounding and blood penalty; it does not explicitly
    call the act a sacrifice.
- id: motif:6
  label: Sacred vessel carrying a deity over water
  taxonomy_refs:
  - ark_vessel
  basis: A painted hollow ship carries the Mother of the gods safely over named waters
    to Italy and then into the Tiber.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: medium
  cautions: The vessel is a cult-transport ship, not explicitly an ark or survival
    vessel.
- id: motif:7
  label: Chaste reception of a deity
  taxonomy_refs:
  - sacred_exchange
  basis: The oracle commands Romans to seek the Mother and receive her with a chaste
    hand, while the goddess consents to go and Attalus sends her.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage states a required mode of reception; a reciprocal exchange
    is only partly explicit.
comparison_claims:
- id: claim:1
  claim: 'Within the passage, the noisy instruments used by Cybele''s attendants are
    explained as having the same ritual function as the Curetes'' and Corybantes''
    earlier noise: concealing and protecting infant Jupiter.'
  claim_level: same_function
  target: Protective ritual noisemaking around the concealed divine child
  evidence_refs:
  - ev:1
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal etiological comparison made by the poem; it does
    not establish external historical origin.
- id: claim:2
  claim: Within the passage, the self-cutting of Cybele's later attendants is explicitly
    patterned on Attis's frenzy and self-mutilation.
  claim_level: same_motif
  target: Attis's self-mutilation and the self-cutting ministers of Cybele
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives a mythic aition for a ritual practice; it should
    not be generalized beyond the supplied text without other sources.
- id: claim:3
  claim: Within the passage, the Roman presence of the Mother is represented as a
    transfer from the Idaean/Phrygian sphere to Rome by oracle, embassy, divine consent,
    and ship transport.
  claim_level: historical_contact
  target: Idaean/Phrygian Mother cult and Roman reception of the Magna Mater
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is about how the passage represents contact; the poetic narrative
