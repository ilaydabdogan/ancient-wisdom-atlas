canonical_text:
  quote: ''
  summary: The passage describes rites of Cybele/Magna Mater, explains ritual noise
    through the story of Rhea hiding infant Jupiter from Saturn, explains the self-wounding
    of Cybele's attendants through Attis's betrayal and frenzy, and narrates the transfer
    of the Mother from Phrygia/Ida to Rome by ship, ending with the ship stuck in
    the Tiber and Claudia Quinta introduced.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A festival of the Idaean Mother is announced with curved Phrygian pipe, drums,
    bronze sounds, a procession through the city, and public games.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks learned Cybeleian descendants and the Muses why the Great
    Goddess rejoices in continual sound.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A prophecy says Saturn will be deprived of his sceptre by a son, and Saturn
    responds by swallowing each child born to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rhea grieves because she has often borne children but has not been able to
    be a mother to them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Jupiter's birth, a stone hidden in clothing is placed in Saturn's throat
    so that the father is deceived.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mount Ida resounds so that the infant boy may cry safely, while some strike
    shields and others empty helmets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that companions of the goddess move bronze instruments
    and rough drum-hides as imitations of the ancient act.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cybele is described as using a chariot drawn by tamed lions and as wearing
    a turreted crown.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Attis, a Phrygian youth in the woods, binds the turret-bearing goddess to
    himself in chaste love and promises always to remain a boy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Attis breaks faith with the goddess in relation to the nymph Sagaritis, and
    the goddess's anger exacts punishment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Naiad's tree is wounded, the Naiad dies, and Attis becomes frenzied, flees
    to Dindyma, shouts about torches and whips, wounds his body with a sharp stone,
    and removes his male parts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says Attis's frenzy became an example for soft attendants who
    cut their bodies while tossing their hair.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Mother is said to have loved Dindymon, Cybele, Ida with its springs, and
    Trojan wealth, and to have almost followed Aeneas's sacred ships toward Italy.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: An oracle tells the Romans to seek the absent Mother and receive her with
    a chaste hand; Apollo/Paean tells them to summon the Mother of the gods from the
    Idaean ridge.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Roman leaders go to Attalus, who first refuses; after the earth trembles and
    the goddess speaks from her shrine, he permits her departure.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Pines are cut, many hands work together, and a painted hollow ship carries
    the Mother of the gods.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: The ship travels by sea past named places including Rhoeteum, Sigeum, Tenedos,
    the Cyclades, Icarium, Crete, Cythera, Sicily, Sardinia, and finally Ausonia.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: At the Tiber mouth, equestrians, senate, plebs, mothers, daughters, brides,
    and virginal keepers of the sacred fires come to meet the ship.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: Men strain at the rope to pull the foreign ship; after drought and low water,
    the keel sticks in muddy shallows and the men stand astonished and afraid.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:20
  text: Claudia Quinta is introduced as tracing her lineage to Clausus.
  category: attribute
  evidence_refs:
  - ev:15
