canonical_text:
  quote: ''
  summary: 'The passage consists of notes on Ovid''s Fasti: Bacchus is described as
    horned through identification with Phrygian Sabazius; Liber is paired with Libera,
    who is identified in different traditions with Proserpine or Ariadne; calendar
    notes describe races, the festival of Anna Perenna, drinking, and gestures; further
    notes summarize traditions about Anna, Dido, Aeneas, funerary offerings, sea travel,
    the Penates, the Numicius river, etymologies of Anna Perenna, and alternative
    identifications of Anna with the Moon, Themis, Io/Isis, or a daughter of Atlas/nymph
    connected with the rearing of Jupiter.'
  language: English with Latin and Greek terms
  quote_policy: summarized
