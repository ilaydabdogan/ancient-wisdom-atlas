canonical_text:
  quote: ''
  summary: The poet asks Mars why matrons celebrate his festival. Mars answers by
    recounting early Rome’s lack of marriage alliances, his counsel to Romulus, the
    conflict involving abducted women, the women’s intervention between fathers and
    husbands with their children, and further calendar explanations involving Ilia,
    spring fertility, Juno/Lucina, flowers, and childbirth prayers.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The poet asks Gradivus/Mars why matrons observe his festival, and Mars answers
    after setting down his helmet while still holding a spear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mars says early Rome was small but contained hope for its future, and he describes
    Romulus’s royal dwelling as made of reed and straw.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mars says Romulus had no wife or father-in-law, and wealthy neighbors rejected
    poor sons-in-law and doubted Mars as source of Roman blood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mars says no woman wished to marry a Roman, so he told Romulus to put aside
    prayers because arms would provide what he sought, and to prepare a festival for
    Consus.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Cures grow angry, fathers-in-law take up arms against sons-in-law, the
    abducted women have become mothers, and neighboring wars have dragged on.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wives assemble in the appointed temple of Juno, and one woman described
    as Mars’s daughter-in-law begins to speak among them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker tells the abducted women that they cannot remain slow in piety
    and must choose whether they would rather become widows or orphans, since husbands
    and fathers hold arms on opposite sides.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After receiving the plan, the women obey by loosening their hair and covering
    their bodies with mourning clothing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Battle lines stand ready for iron and death, and the trumpet is about to give
    the signal for fighting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The abducted women come between their fathers and husbands carrying their
    children in their bosoms as dear pledges, reach the middle of the field with loosened
    hair, and kneel on the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The children stretch small arms toward their grandfathers and call to them;
    weapons and hostile courage fall from the men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After swords are removed, fathers-in-law and sons-in-law give and receive
    hands, and a grandfather carries a grandson on a shield.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Mars says Oebalian mothers first celebrate his Kalends from that day, possibly
    because the women entered among drawn swords and ended Martian wars with tears.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: 'Mars gives another possible reason: mothers duly honor his sacred day because
    Ilia was happily a mother by him.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: 'Mars describes winter yielding at this time: ice-covered winter departs,
    snow melts in warming sun, leaves return to trees, buds swell on young vine, and
    hidden grass finds ways upward into the air.'
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: Mars says the field is fertile, it is the time for livestock breeding, and
    a bird prepares shelter and a home on a branch.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: Mars says Latin mothers rightly honor fertile times because childbirth is
    their service and vows.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: Mars adds that public temples to Juno were made by Latin daughters-in-law
    on this day at the place associated with the Roman king’s watch and the Esquiline
    hill.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:19
  text: Mars says the mother loves married women and that a crowd of mothers frequents
    him; he identifies this as an especially fitting cause.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: Worshippers are told to bring flowers to the goddess, crown the head with
    tender flowers, invoke Lucina for giving light and aiding the laboring woman’s
