canonical_text:
  quote: ''
  summary: 'The passage describes the festival of Anna Perenna near the Tiber, where
    common people drink, sing, dance, and pray for years according to the number of
    cups. It then offers an explanatory tale: after Dido’s death, Anna mourns her
    sister, leaves home, receives temporary hospitality, flees threats, is driven
    by storm to the Laurentian shore, is welcomed by Aeneas, becomes the object of
    Lavinia’s jealousy, is warned by Dido’s bloody apparition, escapes, and is seized
    by the waters of Numicius.'
  language: Latin
  quote_policy: summarized
