canonical_text:
  quote: ''
  summary: The passage asks the origin of the Lupercalia and gives Arcadian/Pelasgian
    origins for Pan/Faunus rites brought by Evander to Latium. It explains nude ritual
    running through the god’s preference, archaic Arcadian custom, a comic tale in
    which Faunus is deceived by exchanged garments while seeking a woman in a cave,
    and a Latin tale of Romulus, Remus, a goat sacrifice, cattle recovery, and a ritual
    feast. It then begins the account of Ilia’s divine twin birth and the order to
    drown the boys at the swollen Tiber.
  language: Latin
  quote_policy: summarized
