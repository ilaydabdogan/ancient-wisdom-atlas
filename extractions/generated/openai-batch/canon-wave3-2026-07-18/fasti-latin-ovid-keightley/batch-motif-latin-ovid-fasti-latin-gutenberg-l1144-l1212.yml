  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says sacred rites are drawn from ancient annals and that each
    marked day has a reason or merit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says Germanicus will find domestic festivals, references to his
    father and grandfather, rewards shared with Drusus, and Caesar's altars and added
    sacred days in the calendar material.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Romulus, called founder of the city, established ten months in his year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The passage gives two time measures as justification for the ten-month year:
    the time sufficient for an infant to come from the mother''s womb and the same
    number of months for a widow''s mourning after a husband''s funeral.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The first month is assigned to Mars, the second to Venus, the third to old
    men, the fourth to young men, and the following group is marked by number.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Numa added two months to the ancient months and did not pass over Janus or
    ancestral shades.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Different days have different legal-religious statuses: on a nefastus day
    three legal words are silent, while on a fastus day legal action is permitted.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'A day may change status within itself: after entrails have been given to
    a god, all speech is permitted and the honored praetor has free words.'
  category: sequence
  evidence_refs:
  - ev:5
