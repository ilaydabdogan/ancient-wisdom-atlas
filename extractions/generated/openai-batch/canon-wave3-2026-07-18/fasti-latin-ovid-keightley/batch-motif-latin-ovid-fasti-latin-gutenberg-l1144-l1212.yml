canonical_text:
  quote: Tempora cum causis Latium digesta per annum, / Lapsaque sub terras ortaque
    signa canam.
  summary: The speaker opens the Fasti by announcing a poem on Roman times, causes,
    annual rites, and celestial signs; addresses Germanicus as patron; explains the
    origins and classifications of months and days, including Romulus' ten-month year,
    Numa's additions, fasti/nefasti rules, and divine associations of Kalends and
    Ides.
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says he will sing of Latin times arranged through the year, their
    causes, and signs that set below and rise from the earth.
  category: speech
  evidence_refs:
