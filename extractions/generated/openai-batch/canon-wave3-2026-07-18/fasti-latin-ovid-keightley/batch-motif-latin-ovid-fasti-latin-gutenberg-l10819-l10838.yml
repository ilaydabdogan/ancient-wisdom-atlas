  quote: ''
  summary: 'The notes explain calendar entries around late May: an old calendar abbreviation
    concerning the Rex Sacrorum at the Comitium; antiquarian explanations by Varro
    and Plutarch involving a sacrifice and rapid departure; the dedication of a temple
    of Fortuna Publica, probably identified with Fortuna Primigenia; and the evening
    or heliacal rising and setting of Aquila, Bootes, and the Hyades.'
