- id: obs:3
  text: Several entries record astronomical events, including Cancer setting, Lyra
    rising and setting, Delphinus rising, the Sun entering Aquarius after Capricorn,
    and a star in Leo setting.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  - ev:9
- id: obs:4
  text: The January 9 and 10 entries list the Agonalia, the rising of Delphinus, and
    midwinter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The January 11 entry lists the Carmentalia and the dedication of Juturna’s
    seat in the Campus Martius at Aqua Virgo; a later entry says the Carmentalia are
    repeated.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:6
  text: The January 13 entry states that a semimas sheep was immolated to Jupiter
    Stator, that provinces were returned to the people, and that Octavian received
    the name Augustus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
