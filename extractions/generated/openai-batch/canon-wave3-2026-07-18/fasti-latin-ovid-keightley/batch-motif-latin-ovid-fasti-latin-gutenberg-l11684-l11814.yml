canonical_text:
  quote: ''
  summary: 'Commentary on the opening of June in Ovid''s Fasti: the poet discusses
    the month name through divine etymologies; the notes cite ancient views of poetic
    inspiration, Hesiod and the Muses, the Judgment of Paris, Juno''s cult titles
    and temples, the Capitoline divine grouping, Etruscan associations, Vesta/Hestia''s
    genealogy, and Hebe/Juventas with Hercules and Romulus'' division of the people.'
  language: English with Latin and Greek citations
  quote_policy: summarized
