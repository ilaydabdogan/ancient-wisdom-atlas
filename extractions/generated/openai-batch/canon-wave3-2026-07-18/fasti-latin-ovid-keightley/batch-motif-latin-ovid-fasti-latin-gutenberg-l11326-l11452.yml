canonical_text:
  quote: ''
  summary: The passage explains rites of the Matralia and tells how Ino, after caring
    for Bacchus and suffering Juno’s anger, loses Learchus, leaps into the sea with
    Melicertes, is saved, comes to Italy, is attacked by Bacchants, is aided by Hercules
    and hosted by Carmentis, and receives prophecy of her transformation into Matuta/Leucothea
    and her son’s into Portunus/Palaemon. It also gives ritual explanations for cakes
    and exclusion of slave women, then turns to prophetic and historical notices concerning
    Rutilius, Didius, Fortune, Servius, and Tullia’s incitement to royal murder.
  language: Latin
  quote_policy: summarized
