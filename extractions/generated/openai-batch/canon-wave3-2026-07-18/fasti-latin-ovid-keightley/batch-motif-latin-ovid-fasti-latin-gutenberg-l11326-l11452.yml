candidate_motifs:
- id: motif:1
  label: Fostered divine child endangered by a jealous goddess
  taxonomy_refs:
  - divine_parent_child
  - miraculous_child
  basis: Bacchus, son of Jupiter and Semele, is nurtured by Ino, provoking Juno’s
    anger.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage emphasizes fostering and divine anger more than the child’s
    miraculous qualities.
- id: motif:2
  label: Divine madness causing kin-killing
  taxonomy_refs:
  - divine_judgment
  basis: Athamas is driven by Furies and false appearance and kills his son Learchus.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The immediate agent is Furies and illusion; the passage does not explicitly
    label this as formal judgment.
- id: motif:3
  label: Mother fleeing with child into the sea
  taxonomy_refs:
  - departure
  basis: Ino takes Melicertes from the cradle and leaps with him from a high ridge
    into the sea.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The taxonomy has no exact 'flight into water' motif; 'departure' is a
