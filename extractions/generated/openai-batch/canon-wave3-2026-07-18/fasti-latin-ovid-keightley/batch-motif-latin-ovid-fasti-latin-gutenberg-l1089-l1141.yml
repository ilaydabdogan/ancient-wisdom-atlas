canonical_text:
  quote: JUNIUS. LIB. VI.
  summary: A June calendar table lists Roman sacred observances, temple dedications,
    astronomical appearances, weather indications, ritual restrictions, and commemorated
    military or civic events for days from the Kalends through the end of the month.
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage is organized as a day-by-day calendar for June.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kalends of June list sacred observances for Carna, bean-related Kalends,
    Juno Moneta, Mars outside the Capena gate, Tempestas, and the full appearance
    of Aquila.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second day notes the rising of the Hyades and Taurus's horns and says
    that it rains.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several entries mark temples, shrines, altars, or cult sites as dedicated,
    consecrated, placed, or begun.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  - ev:9
  - ev:11
  - ev:15
  - ev:16
- id: obs:5
  text: The seventh day notes the setting of Arctophylax, identified parenthetically
    with Lycaon, and sacred Tiber games celebrated by fishermen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The ninth day lists rites of Vesta, an altar of Jupiter Pistor on the Capitol,
    a victory of Brutus over the Gallaeci, and the defeat and death of Crassus by
    the Parthians.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: The eleventh day lists Matralia sacred to Mater Matuta, a temple of Matuta
    placed by King Servius, deaths of Rutilius and Didius, a temple of Fortuna dedicated
    by King Servius, and a temple of Concordia consecrated through Livia.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:8
  text: The thirteenth day includes temples for unconquered Jupiter, minor Quinquatrus
    sacred to Minerva, and restrictions concerning marriage and the wife of the Flamen
    Dialis.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:9
  text: The wife of the Flamen Dialis is not to comb her hair, cut her nails, or lie
    with her husband before a specified day.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: Mid-month entries mark the rising of Thyene, removal of refuse from Vesta's
    temple, favorable blowing of Zephyrus, the rising of Orion, the full appearance
    of Delphinus, and a victory by Postumius Tubertus.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
- id: obs:11
  text: The nineteenth and twentieth days note the sun moving from Gemini into Cancer,
    the cult of Pallas beginning on the Aventine, the placement of Summanus's temple,
    and the rising of Ophiuchus, identified with Aesculapius.
  category: sequence
  evidence_refs:
  - ev:14
  - ev:15
- id: obs:12
  text: Late-month entries list defeats or deaths involving Flaminius, Syphax, and
    Hasdrubal, along with honors of Fors Fortuna.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:13
  text: The twenty-sixth day lists Orion's belt and the solstice.
  category: setting
  evidence_refs:
  - ev:17
- id: obs:14
  text: The final entries list shrines or temples for the Lares, Jupiter Stator, Quirinus,
    the Muses, and Hercules Musagetes.
  category: sequence
  evidence_refs:
  - ev:18
