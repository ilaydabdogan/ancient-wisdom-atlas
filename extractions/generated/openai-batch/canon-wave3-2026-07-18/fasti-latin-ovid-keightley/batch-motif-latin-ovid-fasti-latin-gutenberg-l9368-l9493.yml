canonical_text:
  quote: ''
  summary: The passage describes the nocturnal Lemuria rite for the ancestral dead,
    gives an aetiology connecting the rite’s name to Remus and Romulus, notes associated
    temple and marriage restrictions, and then narrates the hospitality of Hyrieus
    to disguised gods, the miraculous birth of Orion, Orion’s conflict with a scorpion
    sent by Tellus, and his placement among the stars by Latona.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lemuria is described as an old nocturnal rite in which offerings are made
    to the silent Manes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says earlier Romans already brought gifts to the extinguished
    ashes and purified ancestral tombs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At midnight, when dogs and birds are silent, a person mindful of the old rite
    rises with no bindings on his feet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ritual performer makes a sign with his fingers and washes his clean hands
    with spring water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ritual performer turns away, throws black beans, and says that with these
    beans he redeems himself and his own people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The formula is spoken nine times, without looking back, and the ghost is thought
    to collect the beans and follow unseen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The ritual performer touches water again, clashes Temesan bronze, asks the
    ghost to leave his house, repeats the command to the paternal Manes nine times,
    then looks back and considers the rite completed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The poet asks Mercury, called the son of the Pleiad and Caducifer, to explain
    the name of the day; Mercury arrives and gives the cause.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Romulus buried the fraternal shades of Remus, while Faustulus and Acca mourned
    over the burned bones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bloody shade of Remus appears by a bed and speaks in a low murmur.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
