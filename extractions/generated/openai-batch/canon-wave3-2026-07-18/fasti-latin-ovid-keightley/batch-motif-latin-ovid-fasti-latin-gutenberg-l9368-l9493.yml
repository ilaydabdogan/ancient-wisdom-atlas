  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The passage says Remuria later became Lemuria, and that the souls of the silent
    dead were also called Lemures.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage says temples were closed on those days and that weddings in May
