canonical_text:
  quote: ''
  summary: The passage explains why the constellations Corvus, Anguis, and Crater
    are grouped together. Phoebus, preparing a solemn feast for Jove, sends his bird
    to bring spring water in a golden bowl. The bird delays under a fig tree until
    the fruit ripens, then returns with a water-snake and falsely blames it for blocking
    the water. Phoebus exposes the lie, imposes a punishment connected with denial
    of spring water, and the bird, snake, and bowl shine together as enduring stars.
  language: Latin
