canonical_text:
  quote: ''
  summary: The passage explains calendar rites connected with Carmentis and Juturna.
    Carmentis, Evander’s prophetic mother, consoles Evander in exile from Arcadia,
    guides his voyage to Hesperia and the Tiber region, and prophesies the future
    greatness of Rome, the Trojan arrival, Aeneas, Vesta, Augustus, and Julia. After
    Evander settles, Hercules arrives with Erytheian cattle; Cacus steals two bulls
    into a cave, breathes fire in combat, and is killed by Hercules, who then sacrifices
    a bull to Jupiter and establishes the Ara Maxima. Carmentis is said to possess
    this day in the month of Janus.
  language: Latin
  quote_policy: summarized
