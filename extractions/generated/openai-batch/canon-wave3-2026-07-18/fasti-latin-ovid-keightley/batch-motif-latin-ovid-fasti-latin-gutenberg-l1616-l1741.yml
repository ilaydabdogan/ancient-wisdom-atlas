candidate_motifs:
- id: motif:1
  label: Prophetic mother guides an exiled son to a new land
  taxonomy_refs:
  - departure
  - divine_parent_child
  basis: Carmentis is both mother and goddess; she consoles Evander’s exile, explains
    it through fate and divine anger, and guides his ship toward Hesperia and the
    river of the future Roman site.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage emphasizes maternal prophecy and divine status, but it does
    not present a birth narrative for Evander.
- id: motif:2
  label: Foundation prophecy legitimating future world rule
  taxonomy_refs:
  - royal_legitimacy
  basis: Carmentis predicts that the hills will become great walls, that other lands
    will seek laws from the place, and that the Augustan house will hold guardianship
    and imperial authority.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The motif is expressed as prophecy within an Augustan Roman calendar poem;
    broader political interpretation requires external context.
- id: motif:3
  label: Heroic exile as repeated pattern
  taxonomy_refs:
  - departure
  basis: Carmentis explicitly places Evander’s exile beside those of Cadmus, Tydeus,
    Jason, and others, making exile a repeated heroic condition.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The named parallels are brief exempla rather than full retellings in this
    passage.
- id: motif:4
  label: Cattle theft hidden in a monster’s cave
  taxonomy_refs:
  - sacred_theft
  basis: Cacus steals two bulls from Hercules’ herd, drags them backward to conceal
    their trail, and hides them in a cave marked by violence and human remains.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The theft is clear, but the cattle are not explicitly called sacred before
    the later sacrifice to Jupiter.
- id: motif:5
  label: Hero slays fire-breathing cave monster and founds an altar
  taxonomy_refs:
  - culture_hero
  - sacrifice
  basis: Hercules follows the cattle’s lowing, forces open Cacus’ blocked cave, kills
    the fire-breathing monster with his club, sacrifices a bull to Jupiter, and establishes
    the Ara Maxima.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage presents a localized cult-foundation episode rather than a
    universal monster-slaying myth.
- id: motif:6
  label: Troy’s defeat transformed into Roman renewal
  taxonomy_refs:
  - death_rebirth
  - royal_legitimacy
  basis: Carmentis says defeated and overturned Troy will rise again, then predicts
    Aeneas bringing sacred objects and Vesta receiving Trojan gods, linking Trojan
    ruin to future Roman sacred authority.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The renewal is prophetic and political-sacral; the passage does not narrate
    the full Trojan migration.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Evander’s exile with the experience of Cadmus,
    Tydeus, Jason, and unnamed others as a repeated heroic condition.
  claim_level: same_function
  target: Cadmus, Tydeus, and Jason as exiled heroic figures
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: Only the shared function of exile is stated; the passage does not narrate
    the other figures’ stories in detail.
- id: claim:2
  claim: The passage visually compares Cacus’ fire-breathing to Typhoeus and to fiery
    Aetnaean lightning imagery.
  claim_level: visual_similarity
  target: Typhoeus and Aetnaean fire imagery
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison concerns the appearance and force of Cacus’ flames,
    not an identification of Cacus with Typhoeus.
- id: claim:3
  claim: Carmentis’ prophecy links the local Arcadian arrival at the future Roman
    site with Trojan, Aenean, Vestal, and Augustan lines of sacred succession.
  claim_level: same_function
  target: Trojan-to-Roman sacred and imperial succession pattern
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself gives the prophetic linkage, but broader comparison
    with other Roman foundation traditions would require external texts.
