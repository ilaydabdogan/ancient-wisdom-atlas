canonical_text:
  quote: ''
  summary: The passage asks why the Salii carry Mars' heavenly arms and sing Mamurius.
    It describes the sacred Arician grove and Egeria, then tells how Numa civilizes
    the Romans with law and sacred rites. After repeated lightning, Egeria instructs
    Numa to capture Picus and Faunus, who reveal that Jupiter may be drawn down. Numa
    summons Jupiter, negotiates a nonhuman substitute for a demanded life-taking rite,
    receives a promise of imperial pledges, and the next day witnesses a shield fall
    from heaven after thunder and lightning. Numa names it the ancile and has Mamurius
    make similar copies to confuse any plotter.
  language: Latin
  quote_policy: summarized
