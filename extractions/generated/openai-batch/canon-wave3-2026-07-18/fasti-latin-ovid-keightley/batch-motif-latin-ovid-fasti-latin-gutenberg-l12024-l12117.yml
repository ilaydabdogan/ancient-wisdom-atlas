canonical_text:
  quote: ''
  summary: Notes on Ovid's Fasti discuss the Sabine deity Sancus/Dius Fidius/Semo,
    his temple and cross-identifications, Roman calendar rules for June, Vesta-related
    ritual cleansing and fire, a celestial setting of Boötes, Callisto's transformation,
    and the Piscatorii ludi offering fish to Volcanus for human souls.
  language: English commentary with Latin and Greek quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nones are described as the anniversary of the dedication of a temple of
    the ancient Sabine deity named Sancus, Dius Fidius, and Semo.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says the Roman oath Medius fidius was formed from the name Fidius.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The note equates Semo with Indiges and says this corresponds closely with
    Greek haeros in its later sense.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Aelius Gallus is reported as saying Dius Fidius was a son of Jove and as connecting
    Sanctus/Sancus with Sabine language and Hercules with Greek tradition.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Augustine is reported as saying that the Sabines enrolled their first king
    Sancus or Sanctus among the gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cato is reported as deriving the Sabine name from Sabo, son of Divus Sancus
    Gentilis; Silius Italicus is reported as linking Sanctus and Sabe with the ancestry
    or naming of the Sabine people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Justin Martyr and Tertullian are said to have confused Semoni with Simoni
    and therefore to have asserted that Romans worshipped Simon Magus as a god.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The commentator says Ovid appears to imply that Sabines settling at Rome raised
    a temple on the Quirinal to Sancus, but also notes that history does not mention
    this.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dionysius is cited for a treaty memorial in a temple of Zeus Pistios, whom
    the Romans called Sanctus, on the Quirinal; the temple was begun by Tarquinius
    and dedicated by Spurius Postumius on the Nones of June.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The note says it was not lucky to marry in June before the Ides, while the
    rest of the month was favorable to marriage.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: Festus and Varro are cited for the removal of stercus from the temple of Vesta
    to a fixed place by the Capitoline slope, associated with the porta stercoraria.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Flaminia's hair is described as clipped at the ends and combed with a
    box-wood comb.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The marriage of the Flamen is said not to be dissolved except by death, and
    the Flaminica is described as univira.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ignea Vesta is glossed as the temple of Vesta in which perpetual fire is maintained.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: Arctophylax or Boötes is said to set in the morning on the seventh day before
    the Ides, and the note mentions Areas, Lycaon, Phoebe, Diana, and Callisto's transformation.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Piscatorii ludi are described as annual June games beyond the Tiber for
