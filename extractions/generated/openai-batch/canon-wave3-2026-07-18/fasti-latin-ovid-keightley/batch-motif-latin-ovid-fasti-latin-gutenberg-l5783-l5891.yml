canonical_text:
  quote: ''
  summary: 'Commentary notes discuss March rites and calendar customs: replacement
    of laurels, rekindling Vesta''s fire, restricted access to Vesta''s temple by
    Vestals, March as an early beginning of the year, Caesar''s calendar reform to
    match the sun, the Matronalia with sacrifice and gifts, and the Sabine rape as
    one explanatory cause connected to the March festival.'
  language: English with Latin excerpts
  quote_policy: summarized
