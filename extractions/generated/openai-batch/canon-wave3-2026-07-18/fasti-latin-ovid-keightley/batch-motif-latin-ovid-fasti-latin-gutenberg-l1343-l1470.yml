canonical_text:
  quote: ''
  summary: 'The passage contrasts early Roman poverty and moral simplicity with later
    greed, then presents Janus explaining the imagery on old coinage: his double image
    and a ship commemorating Saturn’s arrival by boat after expulsion by Jove. Janus
    recalls his early rule near the Tiber and Janiculum, a time when gods mingled
    with humans and Justice still remained on earth. He recounts protecting Rome against
    Tatius and the Sabines by releasing hot sulfurous waters, explains why his gates
    are open in war and closed in peace, notes temple dedications, and turns to astronomical
    signs and the intellectual ascent of those who first studied the heavens.'
  language: Latin
  quote_policy: summarized
