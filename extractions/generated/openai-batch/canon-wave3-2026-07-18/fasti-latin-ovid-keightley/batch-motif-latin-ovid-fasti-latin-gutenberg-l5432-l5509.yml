canonical_text:
  quote: Utque fugam capiant, aries nitidissimus auro / Traditur. Ille vehit per freta
    longa duos.
  summary: 'The passage describes the five-day rites of Minerva, her patronage of
    learning, crafts, war, and poetry, and several explanations for the name of Captive
    Minerva. It then narrates the crisis of Phrixus and Helle: a fraudulent stepmother
    and corrupted oracle lead to their standing veiled before altars, but their mother
    descends from the sky and gives them a golden ram for escape. Helle falls into
    the water, Phrixus mourns, the ram becomes a star, and its golden fleece reaches
    Colchis. The passage closes with calendar notices concerning the equinox, worship
    of Janus, Concordia, Salus, Pax, and Luna.'
  language: Latin
  quote_policy: quoted
