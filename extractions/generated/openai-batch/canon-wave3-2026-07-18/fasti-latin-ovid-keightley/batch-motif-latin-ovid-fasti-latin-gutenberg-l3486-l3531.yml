canonical_text:
  quote: ''
  summary: 'Latin passage describing the customary honours for Terminus, the god or
    numen of boundary markers: neighbours crown and feed the marker, kindle ritual
    fire, offer grain, honeycomb, wine, and animals, praise Terminus as guardian of
    legal boundaries, recall examples involving Thyreatis and the Capitol, and close
    with roadside rites and a statement about Roman space and the world.'
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A god is said to separate fields by his sign and to be honoured with customary
    rites after night has passed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Terminus may be a stone or an ancient post buried in a field, and the passage
    says that even in that form he has numen.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two owners from different sides crown Terminus and bring two garlands and
    two cakes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An altar is made, and a rustic woman brings fire from warm hearths in a broken
    potsherd.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old man cuts wood, builds it up, and tries to fix branches in the solid
    ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A boy stands holding broad baskets while flames are first stirred with dry
    bark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Grain is cast three times into the middle of the fires, a young girl offers
    cut honeycombs, and wine is libated to the flames.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A crowd watches and ritually favours the rite with their tongues.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Terminus is sprinkled with the blood of a slain lamb and is also given a suckling
    pig.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The neighbourhood gathers as suppliants, celebrates a feast, and sings praises
    to holy Terminus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Terminus is said to bound peoples, cities, and great kingdoms, and without
    him every field would be contentious.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that Terminus has no ambition, is not corrupted by gold,
    and preserves entrusted lands with lawful good faith.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: A counterfactual example says that if Terminus had marked Thyreatis, three
    hundred bodies would not have been sent to death and Othryades would not have
    lain on piled arms.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: When new Capitolia were being made, the crowd of gods yielded to Jove, but
    Terminus, found in the temple, resisted and shares the temple with great Jove.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A small opening in the temple roof remains above Terminus so that he sees
    nothing over him except the stars.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: Terminus is told not to move freely from his station and not to yield anything
    to a neighbour who asks.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: When struck by ploughshares or rakes, Terminus is told to proclaim which field
    is mine and which is yours.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: On a road leading the people to the Laurentine fields, the sixth milestone
    from the city sees rites performed for Terminus with entrails from a wool-bearing
    flock.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:19
  text: The passage closes by saying other peoples have lands given with fixed boundaries,
    while the space of the Roman city and the world is the same.
  category: speech
  evidence_refs:
  - ev:12
