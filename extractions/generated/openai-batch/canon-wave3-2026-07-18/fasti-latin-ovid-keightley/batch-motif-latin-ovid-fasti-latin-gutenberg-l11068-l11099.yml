  quote: ''
  summary: The passage discusses choosing auspicious June dates for a daughter's marriage;
    a Dialis priestess explains ritual restrictions before Vesta's purifications are
    carried by the Tiber to the sea. It then notes a celestial event, games by the
    Tiber for those using wet lines and baited hooks, and the temple and vows to the
    goddess Mens during fear of Punic war.
  language: Latin
