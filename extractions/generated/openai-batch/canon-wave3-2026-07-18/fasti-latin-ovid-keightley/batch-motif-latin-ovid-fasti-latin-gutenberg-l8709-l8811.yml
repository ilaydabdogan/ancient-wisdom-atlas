  text: The commentator says the poem's mention of Rome's birthday occasions a narration
    of the city's origin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary reports a dispute over whether the city should be called Rome
    or Remora and refers to Livy and Ennius on this point.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The birds used in the augury are identified as vultures, and the Romans are
    said to have given vultures great authority in augury.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The foundation rites are described as being carried out according to Etruscan
    ritual-books.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A deep round pit called the mundus was dug in the future Comitium; natural
    productions and earth from participants' native countries were put into it, and
    the city's circuit was described from it as a center.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The founder yoked a bull and a cow to a plough with a brazen share, made a
    furrow for the future wall-line, turned clods inward, and lifted the plough where
    gates were to be.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
