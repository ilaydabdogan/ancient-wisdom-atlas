canonical_text:
  quote: ''
  summary: Commentary notes on Ovid's Fasti explain the transition to the origin of
    Rome, the augural dispute over the city's name, Etruscan-style foundation rites
    involving the mundus and boundary ploughing, favorable thunder omens, Celer and
    Remus traditions, and the Vinalia festival associated with Jupiter, Venus, wine,
    and priestly sacrifice.
  language: English commentary with Latin terms and citations
