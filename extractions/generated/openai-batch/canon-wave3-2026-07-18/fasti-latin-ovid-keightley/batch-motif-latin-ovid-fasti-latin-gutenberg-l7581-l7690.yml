candidate_motifs:
- id: motif:1
  label: Fraternal funeral before civic destiny
  taxonomy_refs: []
  basis: The passage presents mourning and cremation of a brother immediately before
    announcing the city’s rise and destined dominion.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The excerpt begins mid-episode and does not name the brothers in the supplied
    lines.
- id: motif:2
  label: Votive wine exchange establishing a festival
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: Mezentius demands new must as reward, Aeneas vows must to Jupiter, and the
    owed wine is paid to Jupiter, explaining Vinalia.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives an etiological calendar explanation, not an external
    ritual history.
- id: motif:3
  label: Cult transfer by prophetic song
  taxonomy_refs: []
  basis: Venus is said to have been transferred from Eryx to Rome through the Sibyl’s
    song and worshipped in the city of her lineage.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The transfer is reported within the poem’s etiological account.
- id: motif:4
  label: Sacrifice to avert agricultural blight
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  - sacred_exchange
  basis: A flamen processes to Robigo’s grove, offers animal entrails, incense, and
    wine, and prays that grain and harvests be spared.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: Robigo is treated as a divine or personified power within the passage.
- id: motif:5
  label: Ritual substitution by name and celestial correspondence
  taxonomy_refs:
  - sacrifice
  - seasonal_cycle
  basis: The flamen explicitly explains that a dog is put on the altar for the sidereal
    Dog and dies only because of the shared name.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The correspondence is internal to this ritual explanation; no wider comparison
    is asserted here.
- id: motif:6
  label: Redirection of destructive force from crops to weapons
  taxonomy_refs:
  - duality
  basis: The Robigo prayer asks the harmful power to spare tender crops and instead
    damage iron, swords, and weapons while farm tools shine.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The duality is inferred from the passage’s contrast between agriculture/peace
    and weapons/war.
- id: motif:7
  label: Flower festival as seasonal transition
  taxonomy_refs:
  - seasonal_cycle
  basis: The flower goddess appears with garlands, and her rite is said to continue
    into the Kalends of May.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage postpones fuller treatment of the rite.
- id: motif:8
  label: Shared sacred house of multiple deities
  taxonomy_refs: []
  basis: Vesta, Phoebus, and an unnamed third holder are assigned parts of one Palatine
    house, which is said to contain three eternal gods.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The third holder is not named in the supplied excerpt, so no further identification
