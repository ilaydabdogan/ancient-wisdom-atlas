canonical_text:
  quote: ''
  summary: The passage closes a fraternal funeral and Rome’s rise, then treats Vinalia
    rites for Venus and an etiological account in which wine-vows are claimed by Jupiter.
    It next describes a Robigo procession, prayer, and sacrifice to protect grain
    from blight, including a dog offered because of the Dog star. It then turns toward
    a flower festival and concludes with Vesta, Phoebus, and a Palatine house shared
    by three eternal divine presences.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed speaker gives funeral rites to a dead brother, kisses the bier,
    says farewell, anoints the body, and the final flame is put under the pyre while
    Faustulus, Acca, and the Quirites mourn.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the funeral, the city is said to arise and is wished universal dominion
    while remaining under a great Caesar.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ordinary girls are told to celebrate Venus, offer incense, ask for beauty,
    public favor, charm, and playful words, and bring myrtle, sisymbrium, reed bands,
    and roses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A temple near the Collina gate is said to hold names from a Sicilian hill,
    and Venus is said to have been transferred from Eryx by a Sibylline song to be
    worshipped in the city of her own lineage.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Vinalia are explained through a war over whether Turnus or Aeneas would
    become Amata’s Latin son-in-law; Turnus seeks Etruscan support from Mezentius.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mezentius asks to share the nearest new must from the lakes as reward; the
    Rutuli assent, Aeneas arms himself and addresses Jupiter, and Jupiter later receives
    the owed wines after Mezentius falls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On an April day marked by rain-signs and the rising Dog, the narrator sees
    a white procession while returning from Nomentum to Rome; a flamen goes to the
    grove of Robigo with dog and sheep entrails for the flames.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The flamen prays to Robigo to spare Ceres’ crops, allow grain to grow until
    harvest, and remove rough hands from the fields.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The prayer asks Robigo to harm hard iron, swords, and weapons instead of tender
    crops, so that farm tools shine and arms become stained with rust in a peaceful
    world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The flamen offers incense, wine, sheep parts, and dog entrails, then explains
    that a dog is placed on the altar for the celestial Dog and dies because of the
    name.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A flower goddess comes wearing many varied garlands, and her rite is associated
    with freer joking and continues into the Kalends of May.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Vesta is said to take the day and to be received at a kindred threshold; Phoebus
    has one part, Vesta another, and a third holds what remains in a Palatine house
    marked by laurel and oak.
  category: relationship
  evidence_refs:
  - ev:8
