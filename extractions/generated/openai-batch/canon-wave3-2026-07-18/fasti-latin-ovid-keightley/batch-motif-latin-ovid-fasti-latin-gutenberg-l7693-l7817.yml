canonical_text:
  quote: ''
  summary: 'Commentary on the opening of April in Ovid''s Fasti: Venus is invoked
    as the deity of April, associated with myrtle and poetic inspiration; the Julian
    genealogy is traced from Venus and Aeneas through the Alban kings to Romulus and
    Germanicus; the name April is discussed through Greek and Latin etymologies; and
    several Greek or Trojan figures are cited as legendary founders or settlers in
    Italy.'
  language: English notes with Latin and Greek citations
  quote_policy: summarized
