canonical_text:
  quote: ''
  summary: A note discusses a rite near the Catularia gate in which red dogs were
    sacrificed in connection with the Canicula star and crop protection; the commentator
    argues the sacrifice was to Robigus/Rubigo rather than to Canicula. Columella
    is cited for placating Rubigo with the blood and entrails of a suckling puppy,
    while Ovid is said to mention a sheep. Another note explains Robigo as red mildew
    that damages growing grain, and a final note identifies Titan as a poetic name
    for the Sun.
