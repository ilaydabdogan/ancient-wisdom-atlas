candidate_motifs:
- id: motif:1
  label: cosmos ordered after chaos
  taxonomy_refs:
  - chaos
  basis: Polyhymnia explicitly begins after chaos and describes earth, sea, heaven,
    sun, stars, and lunar horses taking distinct places before divine rank is established.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage is an etiological hymn-like explanation, not a full creation
    narrative.
- id: motif:2
  label: personified authority stabilizes divine kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: Majestas is born after rightful order is set, sits by Jupiter, guards him,
    and enables his sceptre to be held without force.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The motif is expressed through Roman personification of majesty rather
    than through a human enthronement ritual.
- id: motif:3
  label: monstrous rebellion against heaven defeated by the thunderbolt god
  taxonomy_refs:
  - divine_judgment
  basis: Earth-born Giants with serpent legs attack the great gods by piling mountains
    toward the stars, and Jupiter hurls thunderbolts that overthrow them.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage emphasizes defense of Majestas and divine order; it does not
    frame the defeat with an explicit trial or formal judgment.
- id: motif:4
  label: Roman civic authority grounded in sacred antiquity
  taxonomy_refs:
  - royal_legitimacy
  basis: Majestas is said to be honored by Romulus and Numa and to protect fathers,
    mothers, children, fasces, the curule seat, and triumphal horses.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is an etiological claim about Roman institutions inside a calendar
    poem, not an independent foundation myth.
- id: motif:5
  label: elders as source of calendrical name and political order
  taxonomy_refs:
  - wisdom
  basis: Urania’s account links May to maiores, old age, counsel, the Senate, and
    Romulus’s Patres.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: 'The taxonomy link is approximate: the passage stresses age-based honor
    and counsel more than secret or supernatural wisdom.'
- id: motif:6
  label: divine mother as eponym of a calendar month
