canonical_text:
  quote: ''
  summary: 'The opening of Book V asks why May has its name and presents several explanations
    voiced by Muses: Polyhymnia connects May with Majestas, born after cosmic ordering
    and defended when Jupiter defeats Giants; Urania connects the month with maiores,
    elders honored by early Rome; Calliope connects it with Maia, mother of Mercury,
    and with Evander’s introduction of rites. The passage then recounts Amalthea,
    the goat that nursed hidden Jupiter, the broken horn filled with fruit, and Jupiter’s
    later placement of the nurse and horn among the stars.'
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the reason for the month-name May is not clearly known and
    asks the Muses associated with Aganippe and Hippocrene to speak.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Polyhymnia begins by describing a time after chaos when earth, sea, heaven,
    sun, stars, and lunar horses took their places.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Honor and Reverence assign proper seats; Majestas is born, sits high in mid-Olympus,
    and Pudor and Metus sit with her while the gods turn their faces toward her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Earth produces Giants with many hands and serpents in place of legs, and tells
    them to make war on the great gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Giants prepare to pile mountains up to the stars and disturb Jupiter with
    war; Jupiter throws thunderbolts from heaven and turns the piled masses back upon
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Majestas remains as a firm defense of the gods, sits beside Jupiter, guards
    him, and enables him to hold his sceptre without force.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Majestas comes to earth and is cultivated by Romulus, Numa, and later rulers;
    she protects fathers, mothers, children, civic insignia, and triumphal horses.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Urania says old age was once highly revered, that elders helped the fatherland
    by counsel, and that the Senate and the Patres are linked to seniority.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Urania suggests that May may derive its name from the maiores, while June
    follows from the name of the young men.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Calliope gives a genealogy in which Oceanus marries Tethys; Pleione joins
    with Atlas and bears the Pleiades; Maia surpasses her sisters in beauty, lies
    with Jupiter, and bears the wing-footed god on Cyllene.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Evander comes from Arcadia into Latian fields with imported gods; his prophetic
    mother tells him that the rural place where Rome will stand will become the seat
    of empire.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Evander teaches local peoples rites of two-horned Faunus and of the wing-footed
