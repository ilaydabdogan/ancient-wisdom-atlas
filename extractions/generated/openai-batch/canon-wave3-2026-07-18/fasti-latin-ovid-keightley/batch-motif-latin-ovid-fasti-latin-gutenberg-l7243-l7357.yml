canonical_text:
  quote: ''
  summary: 'A Latin passage recounts Ceres, disguised as an old woman, grieving for
    her abducted daughter, entering a humble household, healing the sick Triptolemus,
    attempting a nocturnal fire-purification that is interrupted by his mother Metanira,
    and declaring Triptolemus mortal but destined to be the first cultivator. Ceres
    then searches earth and sky for Persephone/Proserpina, learns from celestial witnesses
    that she is in the realm of Jupiter''s brother, appeals to Jupiter, and receives
    a compromise after the report that the girl ate three pomegranate seeds: she will
    spend six months in heaven. Ceres recovers, harvest returns, and the passage closes
    with calendar notes on the Cerealia and other April observances.'
  language: Latin
  quote_policy: summarized
