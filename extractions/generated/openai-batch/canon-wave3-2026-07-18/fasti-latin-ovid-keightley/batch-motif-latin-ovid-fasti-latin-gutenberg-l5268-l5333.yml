  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; short quotation.
- id: ev:3
  type: summary
  locator: 5275-5276
  quote_or_summary: People happily eat in the fields and celebrate the day with plentiful
