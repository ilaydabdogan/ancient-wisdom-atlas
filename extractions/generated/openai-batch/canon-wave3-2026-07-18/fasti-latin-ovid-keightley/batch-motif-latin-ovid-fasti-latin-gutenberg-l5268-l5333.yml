  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 5277-5280
  quote_or_summary: Some say Anna is Luna because she fills the year with months;
