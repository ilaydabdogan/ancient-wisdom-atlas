    first foods.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 5283-5286
  quote_or_summary: The old plebs, not yet protected by tribunes, flee to the summit
    of a sacred mountain, where food and grain run out.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 5287-5292
  quote_or_summary: A poor old Anna of Bovillae, diligent despite age, makes rustic
    cakes and distributes them steaming in the morning among the people.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 5293-5294
  quote_or_summary: After domestic peace is made, a sign or statue of Perenna is set
    up because she brought help when resources failed.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 5295-5296
  quote_or_summary: The poet says he must explain why girls gather and sing obscene
    reproaches or words.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 5297-5304
  quote_or_summary: Mars comes to the newly made goddess Anna and asks her help, saying
    he burns with love for armed Minerva and hopes Anna can bring the gods together
    in one union.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 5305-5308
  quote_or_summary: Anna plays with the god by an empty promise, draws out his foolish
    hope by delay, and claims the task is done when he presses her repeatedly.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 5309-5310
  quote_or_summary: The lover rejoices and prepares the bridal chamber; Anna is led
    there, covering her face like a new bride.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 5311-5312
  quote_or_summary: As Mars is about to take kisses, he suddenly sees Anna, and shame
    and anger come over the deceived god.
  source_text_path: texts/public-domain/roman/project-gutenberg/fasti-latin-ovid-keightley.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 5313-5314
  quote_or_summary: The new goddess laughs at the lover of dear Minerva, and nothing
