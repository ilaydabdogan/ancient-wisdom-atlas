canonical_text:
  quote: ''
  summary: 'The passage recounts traditions about Anna Perenna: a Sidonian woman is
    sought near a river and a voice identifies itself as the nymph of the Numicius;
    alternative identifications of Anna are listed; an old Anna of Bovillae feeds
    the seceding plebs and later receives a sign or statue; Anna tricks Mars, who
    seeks Minerva, by appearing veiled as a bride; Vesta then speaks about Caesar,
    saying she rescued him and left only an image or shadow to be struck, after which
    he was placed in heaven, while the assassins died deservedly and Caesar avenged
    his father. The passage ends with an astronomical notice about Scorpio after Aurora.'
  language: Latin
  quote_policy: summarized
