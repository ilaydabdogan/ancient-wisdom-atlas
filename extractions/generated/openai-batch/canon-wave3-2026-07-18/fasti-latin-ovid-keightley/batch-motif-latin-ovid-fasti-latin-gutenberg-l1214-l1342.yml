canonical_text:
  quote: ''
  summary: The passage opens with a New Year invocation to two-faced Janus and describes
    first-day rites, civic processions, sacrifices, and offerings. The poet asks Janus
    about his identity and form; Janus appears with two faces, a staff, and a key,
    explains that he was once called Chaos when the elements were an undifferentiated
    mass, and describes his cosmic office as keeper of gates, thresholds, peace, war,
    and divine access. He explains the winter beginning of the year, first-day work
    and auspicious words, and sweet New Year gifts of dates, figs, and honey.
  language: Latin
