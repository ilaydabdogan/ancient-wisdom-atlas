canonical_text:
  quote: ''
  summary: 'The passage explains Roman calendrical reckoning: the Kalends, Nones,
    and Ides as principal days; pontifical proclamation of the Nones at new moon;
    comparison with the Attic three-part month; Roman date formulas and inclusive
    counting; the division of days into fasti, nefasti, and intercisi; sacrificial
    timing affecting legal permissibility; and the count of 38 dies fasti in the Julian
    Calendar.'
  language: English with Latin terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The Roman month is described as having three named reference days: Kalends,
    Nones, and Ides.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kalends are identified as the first day of the month; the Nones as the
    ninth day before the Ides by inclusive reckoning; and the Ides as falling near
    the middle of the month.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the day of new moon, the pontiff proclaimed a formula five or seven times
    to indicate the day of the Nones to the people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Roman month is said to be divided into three portions like the Attic month,
    but with a more complex system based on relation to the three principal days.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Roman calendar expressions used grammatical case forms and prepositions to
    state dates in relation to Kalends, Nones, or Ides.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Because Romans reckoned inclusively, the passage gives a conversion rule for
    assigning Roman dates to modern day numbers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The days of the Roman year were divided into fasti, nefasti, and endotercisi
    or intercisi, marked in calendars by F, N, and EN.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: On dies fasti, courts sat and the Praetor gave judgment by speaking three
    legal words; on dies nefasti, courts did not sit; on dies intercisi, justice could
    be administered only during part of the day.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Some holidays are described as nefasti during the killing of the victim, fasti
    between the cutting and offering of the entrails, and nefasti again while the
    victim was consumed on the altar.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Manutius is said to have counted exactly 38 dies fasti in the Julian Calendar;
    the passage presents this as supporting a cyclic year of 38 weeks and as an example
    of Romans retaining old forms and names.
  category: relationship
  evidence_refs:
  - ev:8
