canonical_text:
  quote: ''
  summary: 'Commentary notes on Ovid''s Fasti entries concerning January calendar
    markers: solar and stellar positions, Roman festival categories, Paganalia sacrifices
    and offerings, Ceres and Tellus, grain processing, Tiberius'' temple to Castor
    and Pollux, and the altar to Peace connected with Actium, Apollo Actius, and laurel.'
  language: English with Latin and Greek terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage notes the sun's passage into Aquarius, the heliacal setting of
    Lyra, and the cosmic setting of Regulus in the breast of the Lion on specified
    January dates.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes Roman Stativae festivals fixed to certain days from
    Conceptivae festivals annually announced by magistrates or priests.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Servius Tullius is said to have divided Roman territory into pagi, each with
    an altar for an annual common sacrifice by the pagani; this festival is called
    the Paganalia.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lustration is explained as leading victims around the place, and liba are
    described as cakes brought by different families of the pagus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ceres and Tellus are identified as consortes operum, partners or sharers in
    agricultural work.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that ancient people parched far before grinding it and
    then baked it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tiberius is said to have built a temple to Castor and Pollux and inscribed
    it with his own name and that of his brother Drusus; Gente Deorum is glossed as
    the Caesarian family.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Romans are said to have erected no altar to Peace until A.U.C. 741, with
    sacrifices on January 30 and March 30.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The battle of Actium is described as giving peace to the world, with an allusion
    to Apollo Actius and laurel.
  category: relationship
  evidence_refs:
  - ev:7
