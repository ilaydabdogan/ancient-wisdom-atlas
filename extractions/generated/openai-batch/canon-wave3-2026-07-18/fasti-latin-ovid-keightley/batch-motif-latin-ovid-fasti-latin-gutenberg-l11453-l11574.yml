candidate_motifs:
- id: motif:1
  label: Impious child violates dead parent
  taxonomy_refs: []
  basis: The daughter orders her carriage wheels over the face of her slain father,
    and the street is named for the crime.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The motif label is limited to the literal family-violation pattern in
    this passage; no wider genealogy is asserted.
- id: motif:2
  label: Sacred image averts its gaze from impiety
  taxonomy_refs: []
  basis: The image covers its eyes, a voice asks for the face to be hidden from the
    daughter, and Fortuna forbids uncovering it.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage frames the image and voice as reported events; no external
    cult interpretation is added.
- id: motif:3
  label: Fire-conceived royal child
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Servius is conceived after a male form appears in hearth ashes; Vulcan is
    named his father, and flame later marks his head and hair.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The available taxonomy references fit the birth episode, but the passage
    does not describe infancy beyond conception and fiery signs.
- id: motif:4
  label: Divine or miraculous sign of future status
  taxonomy_refs:
  - royal_legitimacy
  basis: A bright fire touches Servius’ head and a flame burns in his hair; the passage
    calls these signs given by his divine father.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Royal legitimacy is inferred from the sign attached to Servius, who is
    identified elsewhere in the passage as Rome’s seventh king.
- id: motif:5
  label: Moralized destruction of excessive luxury
  taxonomy_refs: []
  basis: Caesar demolishes a great house because its luxury seemed harmful and the
    passage presents the act as an example consistent with what he urges on others.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This is a moral exemplum within a calendar notice rather than a mythic
    episode with supernatural action.
- id: motif:6
  label: Exiled ritual specialists return in disguise
  taxonomy_refs: []
  basis: The flute-players leave Rome, are brought back in a cart while drunk and
    asleep, and are concealed with masks and long garments.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No claim is made that this is part of a wider disguise-return motif beyond
    the passage.
- id: motif:7
  label: Divine invention of a musical instrument
  taxonomy_refs:
  - culture_hero
  basis: Minerva says she made the first long flute from pierced boxwood and calls
    herself the inventor and author of the art.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy reference is approximate because the inventor is a goddess,
    not a mortal culture hero.
- id: motif:8
  label: Rejected divine instrument taken up by another being
  taxonomy_refs: []
  basis: Minerva discards the flute after seeing her distorted reflection; a Satyr
    finds it and learns its use.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not describe theft; it states that the Satyr finds the
    discarded instrument.
- id: motif:9
  label: Challenge to a god followed by bodily punishment
  taxonomy_refs:
  - divine_judgment
  basis: The Satyr challenges Phoebus, Phoebus wins, and the Satyr is flayed.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives the punishment after defeat but does not explicitly
    state a formal divine judgment.
- id: motif:10
  label: Ritual impurity carried away by river to sea
  taxonomy_refs: []
  basis: Vesta’s purifications are sent by the Tiber through Etruscan waters into
    the sea.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage names purgamina and the water route but gives little ritual
    detail.
