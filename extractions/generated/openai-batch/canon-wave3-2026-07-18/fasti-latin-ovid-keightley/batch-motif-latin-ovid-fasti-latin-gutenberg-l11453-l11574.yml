canonical_text:
  quote: ''
  summary: The passage links Roman calendar notices with narratives about Servius
    Tullius, Tullia, Fortuna, Vulcan, Concordia, Minerva, the flute-players, Marsyas
    and Phoebus, Vesta, the Tiber, and Zephyrus. It recounts a daughter driving over
    her father’s corpse, a veiled royal image protected by Fortuna, Servius’ fiery
    conception and signs, a moralized demolition of a great house, the ritual return
    of flute-players in masks and long garments, Minerva’s invention and rejection
    of the flute, Marsyas’ punishment after challenging Phoebus, and the sending of
    Vesta’s purifications down the Tiber.
  language: Latin
  quote_policy: summarized
