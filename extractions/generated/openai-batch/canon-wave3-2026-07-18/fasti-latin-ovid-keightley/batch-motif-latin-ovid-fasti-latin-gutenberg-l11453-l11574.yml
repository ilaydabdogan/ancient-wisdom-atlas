scenes:
- id: scene:1
  label: Tullia drives over Servius’ body
  summary: After Superbus takes royal power, Servius lies slain near the Esquiline.
    His daughter sees the body from her carriage, rebukes the driver for stopping,
    and orders the wheels over the face; the street is thereafter marked by the deed.
  figure_refs:
