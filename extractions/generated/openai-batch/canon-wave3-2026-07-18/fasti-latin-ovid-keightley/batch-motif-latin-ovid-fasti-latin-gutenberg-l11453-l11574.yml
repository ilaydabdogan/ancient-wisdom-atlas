  - fig:2
  - fig:3
  symbol_refs:
  - sym:1
  evidence_refs:
  - ev:1
- id: scene:2
  label: The veiled image of Servius
  summary: A seated image associated with Servius covers its eyes. A voice asks that
    its face be hidden from the daughter, and Fortuna forbids the garment covering
    it to be moved.
  figure_refs:
  - fig:2
  - fig:3
  - fig:4
  symbol_refs:
  - sym:2
  evidence_refs:
  - ev:2
- id: scene:3
  label: Servius’ fiery conception and signs
  summary: A temple fire spares the image, and Vulcan is named as Servius’ father.
    After Tanaquil’s rites, Ocresia tends a hearth where a male form appears among
    ashes; Servius is conceived, and flame later marks his head and hair.
  figure_refs:
  - fig:2
  - fig:5
  - fig:6
  - fig:7
  symbol_refs:
  - sym:3
  - sym:4
  evidence_refs:
  - ev:3
- id: scene:4
  label: Concordia shrine and demolished house
  summary: Livia dedicates a shrine to Concordia. The passage states that a vast house
    formerly occupied the site and that Caesar demolished it because its luxury seemed
    harmful, making his own act an example.
  figure_refs:
  - fig:8
  - fig:9
  - fig:10
  symbol_refs:
  - sym:5
  evidence_refs:
  - ev:4
- id: scene:5
  label: The flute-players leave Rome and return disguised
  summary: Flute-players once honored in temples, games, and funerals leave Rome after
    a restriction. A host at Tibur feasts them and has them carried back in a cart;
    Plautius conceals them with masks and long garments so they can return without
    being recognized.
  figure_refs:
