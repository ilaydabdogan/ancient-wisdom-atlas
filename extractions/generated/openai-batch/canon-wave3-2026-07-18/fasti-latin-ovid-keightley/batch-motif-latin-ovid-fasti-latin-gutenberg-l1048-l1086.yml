  summary: 'A Latin May calendar table in Ovid''s Fasti lists day-by-day religious
    and astronomical notices: rites and temple dedications, Lemuria entries sacred
    to the Manes, games for Mars, rush effigies sent into the Tiber, and risings,
    settings, or transitions of celestial signs, including the beginning of summer.'
  language: Latin
  quote_policy: summarized
