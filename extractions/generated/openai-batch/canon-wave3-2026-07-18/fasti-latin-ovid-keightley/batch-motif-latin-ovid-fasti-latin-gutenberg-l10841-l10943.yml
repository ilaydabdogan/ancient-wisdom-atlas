canonical_text:
  quote: ''
  summary: 'Opening of Book 6: the poet announces multiple possible origins for the
    name of June. In a secluded grove he sees goddesses and hears successive claims:
    Juno says the month is named for her; Hercules’s wife argues for a derivation
    from the young men organized by Romulus; Concordia claims the name from the joining
    of Roman and Sabine peoples. The poet refuses to choose among the divine claimants.'
  language: Latin
  quote_policy: summarized
