canonical_text:
  quote: ''
  summary: 'Editorial notes on Ovid''s Fasti discuss mythological identifications,
    Roman calendar rites, seasonal signs, and ritual explanations: Chaos is glossed
    as Erebus or Pluto''s realm; the Fordicidia involve pregnant cows immolated in
    curiae and ashes kept by the eldest Vestal for purification at the Palilia; Faunus
    is associated with Pan and sleep incubation for divine responses; the Cerealia
    includes horse races, and a debated practice of burning foxes is discussed in
    relation to Carseoli.'
  language: English with Latin and Greek citations
  quote_policy: summarized
