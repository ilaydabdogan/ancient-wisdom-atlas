canonical_text:
  quote: ''
  summary: A sequence of calendrical notices links dates with stars, temple anniversaries,
    historical battles, Roman festivals, and mythic aetiologies. The central mythic
    episode recounts Hippolytus’ death after Theseus’ curse, his restoration to life
    by Coronides using herbs and serpent-aided healing, his concealment by Diana as
    Virbius at the Arician lake, and Jupiter’s punishment of the healer. The passage
    also describes Fortis Fortuna rites on the Tiber and closes with an invocation
    of the Muses and Clio’s speech.
  language: Latin
  quote_policy: summarized
