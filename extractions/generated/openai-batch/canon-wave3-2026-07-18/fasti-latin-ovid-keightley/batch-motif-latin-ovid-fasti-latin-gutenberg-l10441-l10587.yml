canonical_text:
  quote: ''
  summary: Commentary notes on portions of Ovid's Fasti discuss the Lemuria and its
    association with Lemures, Remus, rites for the dead, and avoidance of marriage
    in May; calendar and mythic notes on Orion; Augustan rites and monuments for Mars
    Ultor; and the heliacal rising of the Pleiades, the beginning of summer, and the
    rising of the Bull's head.
  language: English commentary with Latin and Greek excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes report an explanation that Lemures were named as if from Remures,
    connected with Remus, and that Romulus instituted the Lemuria to appease the shade
    of his slain brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lemures are glossed as nocturnal daimones.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The notes state that Romans did not marry in May because many made rites or
    offerings to the departed in that month.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A quoted old calendar marks Lemuria days as sacred on the first, third, and
    fifth days within a six-day sequence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The second day of the Lemuria is identified with the V. Idus, and Orion is
    said to set on that day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The notes identify Orion as born in Boeotia according to most writers, while
    also noting alternate traditions about his birthplace and father.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The Orion narrative is explicitly compared with the story of Philemon and
    Baucis, and the notes mention an accepted invitation, a maintained household fire,
    earthen cooking vessels, wine jars, and a linen covering.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Circensian games are said to be held on the IV. Idus in honor of Mars Ultor,
    and Augustus is said to have built a temple to this god after vowing it at Philippi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The temple of Mars is described as a place where the senate consulted about
    wars and triumphs and where returning victors deposited triumphal insignia.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The notes describe statues of commanders in the Forum, inscriptions of their
    deeds, Romulus bearing the spolia opima of Acron, and Augustus's name on the temple.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The notes refer to Crassus's fate and to Augustus's recovery of captured Roman
    ensigns.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The third and last day of the Lemuria is associated with the heliacal rising
    of the Pleiades and the beginning of summer; the following day is associated with
    the cosmic rising of the Bull's head and a poetic inquiry into its origin.
  category: sequence
  evidence_refs:
  - ev:10
