canonical_text:
  quote: ''
  summary: Editorial notes on Ovid's Fasti describe Chiron's parentage from Phillyra
    and Saturn in horse form, Chiron's role in Achilles' care, and an accident involving
    Hercules' weapons. The notes also describe the Lemuria, the Mundus as an underworld
    doorway open on three days, restless spirits called Lemures, household ritual
    actions with bare feet, hand signs, black beans, repeated formulae, copper sound,
    and Mercury's psychopomp role in connection with the origin of the name Lemuria.
  language: English with Latin and Greek terms
  quote_policy: summarized
