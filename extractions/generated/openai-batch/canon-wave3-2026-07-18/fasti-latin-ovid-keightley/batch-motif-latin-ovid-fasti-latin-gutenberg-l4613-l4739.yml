candidate_motifs:
- id: motif:1
  label: Divine conception of founder-twins
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  - sacred_twins
  basis: Mars conceives children with Silvia; the resulting twins are Remus and Quirinus/Romulus,
    and Romulus later claims Mars as blood ancestor.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:15
  confidence: high
  cautions: The passage presents the conception as a divine act involving coercion
    or stealth; the motif label should not soften the literal action.
- id: motif:2
  label: Prophetic twin-tree dream of future greatness and danger
  taxonomy_refs:
  - sacred_tree_axis
  - royal_legitimacy
  basis: Silvia’s dream shows two palms, one world-covering and star-reaching, attacked
    by an uncle but protected by a woodpecker and a she-wolf.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly interpret the palms, so links to royal
    legitimacy and sacred-tree-axis patterns remain inferential.
- id: motif:3
  label: Exposed twins saved from commanded drowning
  taxonomy_refs:
  - miraculous_child
  - survivor_pair
  - sacred_twins
  basis: Amulius orders the twin boys drowned; the water refuses the crime and the
    boys are left alive on dry ground.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No vessel or ark is described; the passage says the children are abandoned
    on dry ground after the water refuses the crime.
- id: motif:4
  label: Animal nursing and feeding of exposed infants
  taxonomy_refs:
  - miraculous_child
  basis: The infants are said to grow by ferine milk, and a woodpecker often brings
    food to the exposed children.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The text implies the wolf through ferine milk and the preceding dream,
    but the feeding line itself names milk and the woodpecker rather than explicitly
    restating the she-wolf as nurse.
- id: motif:5
  label: Founder restores royal line and establishes city
  taxonomy_refs:
  - culture_hero
  - royal_legitimacy
  basis: After learning their lineage, the brothers overthrow Amulius, restore the
    grandfather’s rule, and found the city walls.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage centers Romulus more strongly than Remus in the killing and
    later foundation speech.
- id: motif:6
  label: Sacred calendar legitimized by divine ancestry
  taxonomy_refs:
  - royal_legitimacy
  - seasonal_cycle
  basis: Romulus assigns the first month to Mars because Mars is his blood ancestor,
    and the month is then called by the father’s name as an act pleasing to the god.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: medium
  cautions: The evidence is calendrical and genealogical; it is not a seasonal myth
    in the narrower sense.
comparison_claims:
- id: claim:1
  claim: The passage itself compares Roman veneration of Mars with other communities’
    divine cults, presenting a pattern in which different peoples honor characteristic
    patron deities.
  claim_level: same_function
  target: local patron-deity cults among Cecropidae, Crete, Hypsipylean land, Sparta,
    Mycenae, Maenalus, and Latium
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is functional and literary within the passage; it does
    not establish historical contact or common origin among the cults.
- id: claim:2
  claim: The passage states that other regional calendars also include a month named
    for Mars, though with different positions in the year.
  claim_level: same_function
  target: Mars-named months in Alban, Faliscan, Hernican, Laurentine, Aequicolan,
    Cures, Pelignian, and Sabine calendars
  evidence_refs:
  - ev:18
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports a calendrical comparison only; it does not explain
    why each calendar used the name or whether the practice arose by inheritance,
    borrowing, or independent development.
