canonical_text:
  quote: ''
  summary: The passage invokes Mars and recounts how Mars conceives Rome’s founder-twins
    with the Vestal Silvia. Silvia falls asleep by water and later reports a dream
    of two palms protected by a woodpecker and a she-wolf. The twins are born; Vesta’s
    sacred signs react. Amulius orders the twins drowned, but the water refuses the
    crime, and the infants are left on dry land, nourished by ferine milk and fed
    by a woodpecker. The grown brothers learn their lineage, kill Amulius, restore
    their grandfather, and found Rome. Romulus honors Mars by giving the first month
    the name of his divine father, and the passage then discusses Mars’ cult and calendar
    placement among Romans and neighboring peoples.
  language: Latin
  quote_policy: summarized
