canonical_text:
  quote: ''
  summary: Keightley discusses Etruscan and Roman systems for measuring the year,
    including a ten-month or 304-day Etruscan cycle, Roman lunar and solar civil years,
    intercalation by pontiffs, Julius Caesar's reform, traditions about Romulus and
    Numa, a comparison with Israelite civil and religious years, and the later Roman
    adoption of seven-day weeks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the ten-month year was Etruscan, and that Romans adopted
    the Etruscan year for important matters because they looked to Etruscans in science
    and religion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Etruscan year is described as 304 days divided into 38 weeks of eight
    days, with uncertain monthly division.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Etruscan year is described as depending on neither sun nor moon and as
    serving to correct an Etruscan civil lunar year.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Romans are said to have used a twelve-month lunar civil year, probably
    borrowed from the Etruscans, which fell short of the solar year by 11 days and
    6 hours.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Roman method of reconciliation with the solar year is described as intercalating
    a month named Mercedonius every other year during 22-year periods, with alternating
    22- and 23-day lengths and no intercalation in the final biennium.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pontiffs are described as having charge of intercalation and as lengthening
    or shortening the year to benefit or harm consuls and revenue farmers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Julius Caesar is described as correcting the Roman year with foreign science
    after finding it 67 days in advance of true time; afterward the Roman civil year
    became solar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage concludes that the Roman civil year always had twelve months,
    while a ten-month year also existed early in the state for correction and important
    matters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A tradition is reported in which Numa added two months to the Romulian year,
    which was regarded as a year of ten lunar months.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author compares ancient Israelite civil and religious years, which began
    at different seasons, with a conjectural Roman coexistence of different named
    and numbered calendar systems.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The seven-day week is described as not known at Rome until the emperors; Etruscan
    eight-day weeks are linked to traces in the Roman nundines.
  category: relationship
  evidence_refs:
  - ev:8
