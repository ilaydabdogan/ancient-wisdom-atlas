  summary: Editorial notes on Ovid's Fasti discuss the name and ritual associations
    of February, purification objects and offices, mythic examples of purification
    after killing or guilt, Roman calendar ordering, celestial settings, and brief
    references to the Dolphin, Neptune, Amphitrite, Arion, Orpheus, and Diana/Cynthia.
