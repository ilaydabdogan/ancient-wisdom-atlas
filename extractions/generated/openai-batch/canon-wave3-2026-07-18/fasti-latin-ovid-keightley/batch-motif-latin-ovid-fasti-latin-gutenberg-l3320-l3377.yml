canonical_text:
  quote: ''
  summary: 'The passage explains Quirinus as Romulus deified. Mars asks Jupiter to
    return his son; Jupiter assents, the cosmos trembles, and Romulus disappears in
    a storm at the Capreae marsh while ascending to his father''s stars. Proculus
    Julius later sees Romulus/Quirinus in radiant, more-than-human form and reports
    his command that the Quirites cease mourning, offer incense, and practice ancestral
    arts and warfare. Temples, a hill-name, and fixed rites follow. The passage then
    explains the Stultorum festa and Fornacalia: early Romans mishandle grain-roasting
    with fire, suffer losses, deify Fornax, pray for tempered grain, and use curial
    notices, though some people miss their proper curia and perform rites on the last
    day.'
  language: Latin
  quote_policy: summarized
