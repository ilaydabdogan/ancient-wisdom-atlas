canonical_text:
  quote: Chloris eram, quae Flora vocor.
  summary: The poet invokes Flora at her games and asks her identity. Flora explains
    that she was Chloris, became the wife of Zephyrus, received a flower-filled garden,
    creates and governs flowers, helped Juno conceive Mars through a special flower,
    explains her power over crops, wine, honey, and youth, and recounts civic and
    ritual origins of her games and the consequences of neglecting divine honors.
  language: Latin
  quote_policy: quoted
