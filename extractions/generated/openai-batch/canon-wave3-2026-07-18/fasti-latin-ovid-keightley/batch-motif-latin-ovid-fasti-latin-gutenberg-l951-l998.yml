  quote: ''
  summary: A Latin calendrical table for March lists Roman sacred days, temple and
    priestly notices, public rites, coming-of-age and educational payments, astronomical
    risings and settings, the vernal equinox, and rites for named deities and personifications.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the Kalends of March, new laurels are placed in the houses of the flamines,
    the regia, the curia, and the temple of Vesta; the fire of Vesta is renewed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The March 1 entry also names Matronalia and the printed 'Salinorum' festival
    days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several entries mark celestial risings or settings, including Pisces, Arctophylax,
    Vindemitor, the neck of Pegasus, and the Gnossian Crown.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The March 6 entry notes a sacred rite of Vesta and that Caesar Augustus was
    made Pontifex Maximus; the March 7 entry notes the consecration of Vejovis' temple.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The March 14 entry lists the second Equiria in the Campus Martius or on the
    Coelian hill; March 15 lists rites of Anna Perenna and the killing of Julius Caesar.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The March 16-17 entries mention partial setting of Scorpius, going to the
    Argei, Liberalia as a sacred rite of Bacchus, the giving of the toga libera, and
    the rising of Milvus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The March 19-23 entries list Minerva's Quinquatria, Minerva's birthday, payment
    of the Minerval to teachers, dedication of Minerva Capta shrines, gladiatorial
    contests, the sun entering Aries, and Tubilustrium as Minerva's rite.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The March 26, 30, and 31 entries respectively note the vernal equinox, a day
    of Janus, Concordia, Salus, and Pax, and rites of Luna on the Aventine hill.
  category: sequence
  evidence_refs:
  - ev:6
