canonical_text:
  quote: ''
  summary: 'Commentary notes describe Roman rites and calendrical observances: the
    youth taking the manly gown, Argean sacred places, the rising of the Kite constellation
    and a related monster-slaying legend, Briareus, the Quinquatrus festival of Minerva
    with associated crafts and gladiatorial combats, the possible origins and names
    of Minerva Capta, transfer of conquered gods, and a grove where violation required
    capital expiation.'
