canonical_text:
  quote: ''
  summary: A grieving matron summons her father and husband, hides her face, weeps,
    and reports a disgrace involving Tarquinius. Though her father and husband pardon
    her as coerced, she refuses to pardon herself, stabs herself, and dies. Brutus
    draws the bloody weapon from her body, swears by her blood and Manes to punish
    Tarquinius and his line, and rallies the Quirites; Tarquinius flees with his offspring
    and annual consular rule begins. The passage then turns to the swallow as a herald
    of spring associated with Progne and Tereus, and to the Equiria of Mars, before
    closing the book.
  language: Latin
  quote_policy: summarized
