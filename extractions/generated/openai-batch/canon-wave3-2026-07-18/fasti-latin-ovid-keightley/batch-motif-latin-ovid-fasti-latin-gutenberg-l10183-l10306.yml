  summary: 'Notes on Ovid''s Fasti concerning the Floralia and Flora: civic funding
    of games and a temple, examples of divine anger or neglect, the annual celebration
    and licentious performances of the Floralia, floral banqueting and love customs,
    torches, theatrical associations, and animal hunts in the Circus Florae.'
