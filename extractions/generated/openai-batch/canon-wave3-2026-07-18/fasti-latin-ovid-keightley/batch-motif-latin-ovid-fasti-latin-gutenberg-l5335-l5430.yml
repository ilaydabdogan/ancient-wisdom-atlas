  category: speech
  evidence_refs:
  - ev:23
- id: obs:24
  text: The poet prays for Bacchus to turn his mild head and appeased horns toward
    him and to favor his talent.
  category: speech
  evidence_refs:
  - ev:24
- id: obs:25
  text: The passage notes a procession to the Argei and the appearance of the star
