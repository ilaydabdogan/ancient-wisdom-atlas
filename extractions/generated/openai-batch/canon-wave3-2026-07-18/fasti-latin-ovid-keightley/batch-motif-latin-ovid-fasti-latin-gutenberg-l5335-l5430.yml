canonical_text:
  quote: ''
  summary: 'The passage treats rites and explanatory myths connected with Bacchus/Liber:
    offerings, liba, honey, ivy, women and old women in Bacchic worship, the toga
    libera, and a stellar myth explaining how the kite gained a place in the sky after
    aiding Jupiter against Saturn and the Titans.'
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The poet invokes Bacchus and says the third day after the Ides is highly celebrated
    for him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage mentions but declines to narrate Semele, Bacchus' birth from Jupiter's
    body, eastern triumphs, Lycurgus, and Tyrrhenian transformations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before Bacchus' birth, altars are described as without honor and grass is
    found on cold hearths.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bacchus is said to have set aside first offerings for Jupiter after subduing
    the Ganges and the whole East.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bacchus is credited with first giving cinnamon, captive incense, and roasted
    entrails from a conquered bull.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Libamina and liba are explained by reference to their ritual use at sacred
    hearths.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bacchus is said to delight in sweet juices, and honey is said to have been
    discovered by him.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bacchus travels from the sandy Hebrus with Satyrs as companions and reaches
    Rhodope and flowering Pangaea.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When the companions' bronze-bearing hands make a sound, new winged creatures
    gather and bees follow the noise through the air.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Liber gathers wandering bees and shuts them in a hollow tree; he receives
    the reward of discovered honey.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: After Satyrs and a light old man taste honey, they search the woods for golden
    honeycombs.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The old man hears a swarm in a hollow elm, sees wax, and hides his discovery.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The old man, seated on a donkey, brings it to the hollow elm and greedily
    seeks honey hidden in the trunk.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Thousands of hornets gather and sting the old man's bald head and face.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The old man falls headlong, is kicked by the donkey, calls to his companions
    for help, and limps after his knee is struck.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The Satyrs laugh at the swollen face of their elder, and Bacchus also laughs.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Bacchus instructs the old man to apply mud, and the old man smears his face
    with mud.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Honey is poured on warm libum and given to Bacchus by right of discovery.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: Women are connected with Bacchic worship because Bacchus excites female dances
    with the thyrsus.
  category: relationship
  evidence_refs:
  - ev:19
- id: obs:20
  text: An old woman performs the rite because that age is described as more wine-loving
    and fond of the vine's gifts.
  category: attribute
  evidence_refs:
  - ev:20
- id: obs:21
  text: Ivy is said to be very pleasing to Bacchus.
  category: attribute
  evidence_refs:
  - ev:21
