canonical_text:
  quote: ''
  summary: The passage treats the Praestites Lares and their stone dog as watchful
    guardians; turns to the Bona Dea’s rock-site temple, Remus, a Claudian dedicant,
    and Livia’s restoration; then gives calendrical weather and the appearance of
    the Hyades, followed by alternate accounts and a myth of Hyas, his hunting death,
    mourning relatives, and heavenly naming.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An altar and small divine images for Maia’s Praestites Lares are said to have
    been established; Curius had vowed them, but age has damaged stone.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lares are explained as so named because they keep all things safe with
    their eyes; they stand for the people, preside over the city walls, are present,
    and bring aid.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dog made from the same stone stood before the feet of the Lar; the passage
    says both Lar and dog guard the house, are loyal to the master, favor crossroads,
    drive off thieves, and keep watch.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The speaker searched for two images of twin gods, but they had become ruinous
    through long age; the city has many Lares, the Genius of the leader who handed
    them over, and neighborhoods worship three divine powers.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A natural mass or rock gives its name to the place associated with the Bona
    Dea, and temples there are described as excluding male eyes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Remus had stood on the rock in vain at the time when birds gave the first
    Palatine kingdoms to his brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A female heir of the Claudian name dedicated the temple while described as
    having known no man; Livia later restored it so as to imitate and follow her husband.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The next day is described with dawn, a cold Argestes wind, sails on Calabrian
    waters, and the Hyades no longer hidden when night falls.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Seven radiant faces in Taurus are identified as the Hyades, called so by a
    Greek sailor from rain; some think they nourished Bacchus, while others regard
    them as descendants of Tethys and aged Oceanus.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Hyas was born before Atlas bore Olympus; he hunted timid deer and hares as
    a youth, later attacked boars and rough beasts, and was killed by a Libyan lioness
    while seeking her lair and cubs.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Hyas’s mother, his grieving sisters, and Atlas mourned him; the passage says
    the piety of the sisters overcame both parents, heaven was given, and the name
    Hyas was made.
  category: sequence
  evidence_refs:
  - ev:11
