canonical_text:
  quote: ''
  summary: 'The passage narrates the final Tarquinian context for the king’s flight:
    Tarquin and his son win Gabii by deception; a serpent omen at the altar leads
    to an oracle about kissing one’s mother, which Brutus interprets by kissing Earth;
    at the siege of Ardea the men test their wives, finding Lucretia spinning dutifully;
    the royal youth is seized by desire for her, returns as guest and kinsman, enters
    her chamber at night with a sword, and coerces her by threatening a false adultery
    accusation.'
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tarquinius is described as the last king of the Roman people, unjust but strong
    in arms, who captured some cities, overturned others, and made Gabii his by a
    shameful trick.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youngest son of Superbus comes into the enemy camp at night, claims he
    has been cruelly beaten by his father, displays wounded back-marks, and is accepted
    by the Gabines.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The son asks his father for a way to betray Gabii; in a garden Tarquinius
    silently cuts the tops from lilies, and the son interprets this as an order to
    kill the leading men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A serpent comes out among the altars and carries off the entrails after the
    fires have gone out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Phoebus is consulted, and the oracle answers that the first man to give kisses
    to his mother will be victorious.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The others hastily kiss their own mothers, but Brutus, who is wise while imitating
    stupidity, lies face down and kisses Mother Earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Roman standards surround Ardea, and the soldiers spend idle time in camp while
    the enemy avoids battle.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The young Tarquinius hosts companions with food and wine, and the men dispute
    about their wives’ duties and mutual care.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The men ride by night to test by deeds rather than words; they find the king’s
    daughter-in-law awake with wine and garlands, and then find Lucretia spinning
    wool with her attendants by a small lamp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lucretia urges her attendants to finish a cloak for her husband, asks about
    the remaining war, laments Ardea for keeping husbands away, fears for her husband
    in battle, weeps, and embraces him when he arrives.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The royal youth conceives a furious and blind love for Lucretia, admires her
    beauty, words, voice, and incorruptibility, and plans force and deceit against
    an unworthy marriage-bed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: He arms himself with a sword, comes to Collatia at sunset, enters Collatinus’s
    inner rooms as guest and kinsman, and is received while Lucretia unknowingly prepares
    a meal for her enemy.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: At night, after the meal and when the house is dark, he rises, draws a golden-hilted
    sword, enters Lucretia’s chamber, identifies himself as the king’s son Tarquinius,
    and tells her he has iron with him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Lucretia is silent, trembles like a small lamb under a hostile wolf, and is
