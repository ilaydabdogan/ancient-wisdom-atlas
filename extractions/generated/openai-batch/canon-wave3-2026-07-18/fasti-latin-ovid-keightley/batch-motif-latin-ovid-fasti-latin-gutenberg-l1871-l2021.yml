canonical_text:
  quote: Pax ades, et toto mitis in orbe mane.
  summary: The poem turns to the altar of Peace, invokes Pax as garlanded with Actian
    foliage, asks that enemies and triumphs cease, describes arms restrained by arms
    and trumpets used only in procession, and commands priests to offer incense, a
    white victim, and prayers that the house providing peace may endure with peace.
    The speaker then closes the first part of the work with its month.
  language: Latin
