canonical_text:
  quote: ''
  summary: Commentary notes discuss Ovid's use of oral traditions for old rites; a
    Carseoli custom compared with Samson's foxes; astronomical and mythic identifications
    of Taurus with Io or Europa; the Palilia festival of Pales as Rome's birthday
    and a spring pastoral festival; possible identities of Pales; and Palilia fire-leaping
    rites explained as purificatory and etiologically linked to Romulus founding the
    city.
  language: English commentary with Latin and Greek lemmata
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that Ovid consulted written fasti and books and collected
    oral traditions to explain old customs and religious rites.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes say lines 709-712 indicate a custom peculiar to Carseoli and compare
    it with the account of Samson using foxes to burn Philistine corn.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes place the Sun's entry into Taurus on 20 April and state that Taurus
    was drawn only as a forepart, allowing identifications either as Io transformed
    into a heifer or as the bull that carried Europa; in either case it was hateful
    to Juno.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The notes identify the XI Kalends of May as the festival of Pales, goddess
    of shepherds, called Palilia and celebrated as the birthday and foundation day
    of Rome.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The notes report variant explanations of the festival name: from Pales, from
    the birth of Ilia, or from springtime bringing-forth by plants, animals, and birds.'
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pales is described as a deity of pasture, identified by some with Vesta or
    the Mother of the Gods, and treated in some sources as female and in others as
    male.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the Palilia, rustics are described as piling hay and straw into a large
    fire and leaping over it, believing themselves purified or expiated.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentary says similar fire practices existed among northern European
    heathen peoples and among Celtic populations of Ireland and Scotland.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Roman etiological explanation says that when Romulus was building the city,
