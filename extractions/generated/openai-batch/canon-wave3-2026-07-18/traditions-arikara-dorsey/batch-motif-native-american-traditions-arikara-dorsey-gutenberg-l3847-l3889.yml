canonical_text:
  quote: ''
  summary: An Arikara tale titled “The Boy and the Young Hawks” tells of a boy who
    cares for four hawk eggs and the young hawks after they hatch. A stranger at the
    nest says the hawks are his sons and the boy’s brothers, tells the boy he has
    won favor and will be rewarded, and instructs him to leave the nest. The boy takes
    feathers for his arrows, later becomes a good hunter and brave, then becomes feared
    for wrongdoing. Attempts to kill him fail because the would-be killers forget,
    until one capable man kills him.
  language: English
  quote_policy: summarized
