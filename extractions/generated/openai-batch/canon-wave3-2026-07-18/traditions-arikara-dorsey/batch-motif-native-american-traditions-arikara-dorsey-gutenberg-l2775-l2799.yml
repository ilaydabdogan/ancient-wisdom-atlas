canonical_text:
  quote: ''
  summary: While the boy sleeps, a Snake enemy enters his body and moves upward as
    he cuts open parts of his body. His father above knows and sends wind; rain fills
    the boy's head and heat helps force the Snake out. The boy remains alive, catches
    the Snake, pronounces that it will crawl ashamed in the dirt, and flattens its
    head on a rock. A note explains the boy's fear of the foetus by seasonal unborn
    animals and the absence of his father's star cluster.
  language: English
