canonical_text:
  quote: ''
  summary: No-Tongue dresses and paints himself while the camp is being broken. He
    tells the people to go ahead, goes to a hilltop, and makes red and white stick-circles
    representing the Sun and Moon. The Sun and Moon arrive; No-Tongue identifies both
    as his fathers and says the Moon has helped him. The Sun is satisfied and takes
    No-Tongue up to his home. Later, four young men find the sticks still present
    but No-Tongue gone, never to be seen again. The passage explains that No-Tongue
    was so called because the Sun had taken and later restored his tongue.
  language: English
