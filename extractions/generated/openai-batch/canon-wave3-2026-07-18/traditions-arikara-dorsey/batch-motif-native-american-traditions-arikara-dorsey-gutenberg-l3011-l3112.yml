canonical_text:
  quote: ''
  summary: A poor boy, Burnt-Hands, lives with his grandmother outside a winter village
    and is mocked, while Last-Child brings them food. During an elk hunt, Red-Bear
    finds him at a dead elk, wounds him with arrows, and drops him through an air-hole
    for White-Bear. White-Bear, living in a stream lodge with a cub, takes pity on
    Burnt-Hands, adopts him as a son, grants him power, teaches him the bear ceremony,
    and gives him a medicine bundle. Burnt-Hands returns alive to his grandmother.
    Later, during preparations for a buffalo hunt involving a white buffalo hide desired
    by Red-Bear, Burnt-Hands promises the white robe to his grandmother, receives
    help from a young horseman, and urges the hunters not to wait for the chiefs.
  language: English
  quote_policy: summarized
