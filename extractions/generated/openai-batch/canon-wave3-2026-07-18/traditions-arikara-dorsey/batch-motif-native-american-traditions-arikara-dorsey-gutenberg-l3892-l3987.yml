canonical_text:
  quote: ''
  summary: A tale titled “The End of the Elk Power” tells of Pretty-Voice, the eldest
    unmarried of four brothers, who seeks help after his brother’s wife vanishes and
    her hungry baby is left crying. Pretty-Voice cries near an elk skull, receives
    help and ceremony from the Elk, summons captive women from Bear’s den with a whistle,
    flees with them, confronts the pursuing Bear, transforms into a full-grown elk,
    defeats Bear, releases him, and returns the women to the village, where Pretty-Voice
    is honored.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four strong young brothers are introduced; only the oldest is married and
    has a wife and child. The men go to eagle traps while the wife stays home preparing
    a hide.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the men return, the wife is missing; the baby is found crying on the
    ground, and the woman’s tools remain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The men believe the woman has been taken captive, and the family grieves while
    the baby remains hungry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eldest unmarried brother, named Pretty-Voice, cries near an old dry skull
    of a buck elk for two nights.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Elk hears Pretty-Voice and says the missing wife is alive, captured by
    a Bear who has also captured three other women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Elk says he has given Pretty-Voice power and later teaches him the ceremony
    of the Elks.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The Elk instructs Pretty-Voice to blow a whistle after sunrise and identifies
    the Bear’s home at a rough bluff with scattered brush.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pretty-Voice whistles four times; women in the Bear’s den hear the sound and
    rush toward him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the women see Pretty-Voice, he is described as handsome, wearing his
    robe wrong side out, with two mid-tail eagle feathers on his head and a long whistle
    in his hand.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pretty-Voice sees his brother’s wife and three long-missing young women and
    tells them to run home with him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Bear pursues the fleeing party, offers Pretty-Voice life if he gives back
    the women, and is refused.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Pretty-Voice attacks the Bear with bow and arrows, but the Bear does not mind
    the arrows.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Pretty-Voice throws himself down and rises as a full-grown Elk with antlers
    like branches of a cottonwood tree.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In elk form, Pretty-Voice strikes the Bear and lifts him from the earth; the
    Bear admits defeat and says the women are Pretty-Voice’s.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: Pretty-Voice releases the Bear, changes back into a man, gathers his clothing,
    and continues on.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: At the village, the rescued women are taken home, the people rejoice, and
    Pretty-Voice receives honor and respect.
  category: sequence
  evidence_refs:
  - ev:11
