canonical_text:
  quote: ''
  summary: Two boys are helped by an old woman who instructs them how to cross a great
    water on the fourth serpent, their grandfather. One boy is swallowed after jumping
    too soon, but is recovered. Later the wild boy eats meat from a serpent hidden
    as a burning log, gradually becomes a serpent, enters the Missouri River, overcomes
    Antelope-Carrier, removes most of his powers, and gives powers, songs, and the
    Medicine-men's ceremony to the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman feeds the boys, keeps them for one moon, explains that a strong
    wind brought them far from home, and prepares five large corn-mush cakes for their
    return crossing.
