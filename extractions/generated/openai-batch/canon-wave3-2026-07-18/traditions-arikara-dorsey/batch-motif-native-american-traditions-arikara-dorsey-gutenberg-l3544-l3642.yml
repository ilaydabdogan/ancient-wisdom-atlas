  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman instructs the boys to call serpents from the bank, reject the
    first three, and ride the fourth serpent, described as their grandfather carrying
    land and trees on his head.
  category: speech
  evidence_refs:
