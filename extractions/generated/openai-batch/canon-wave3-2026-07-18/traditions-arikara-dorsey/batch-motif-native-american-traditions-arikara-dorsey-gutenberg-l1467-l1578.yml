candidate_motifs:
- id: motif:1
  label: People emerge from beneath the earth
  taxonomy_refs:
  - ascent
  basis: The people come out from the ground after an earthquake, and the Awaho are
    identified as the last people to come from the ground.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The available taxonomy term 'ascent' is broad; the passage describes emergence
    from below the earth rather than ascent to heaven or a mountain.
- id: motif:2
  label: Divinely sent guide brings the people out
  taxonomy_refs:
  - culture_hero
  basis: The heavens send Mother-Corn, who says she has come to lead the people out
    and later teaches ceremonies and rituals.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage names Mother-Corn and gives culture-bringing actions, but
    does not explicitly classify her with an external comparative term.
- id: motif:3
  label: Animal helpers open the way through successive obstacles
  taxonomy_refs: []
  basis: Badger digs through earth and opens the chasm crossing, Screech-Owl makes
    a pathway through timber, and Loon clears ice and water to make dry land.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No specific available taxonomy family exactly names this helper-animal
    pathmaking sequence.
- id: motif:4
  label: Former human as dangerous animal pursuer
  taxonomy_refs:
  - shapeshifter
  basis: Cut-Nose is described as an animal that had been a man and as pursuing the
    people to kill them.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage states a former-human condition but does not narrate an active
    transformation or voluntary shapeshifting.
- id: motif:5
  label: Sacred bundle origin from Mother-Corn’s disappearance
  taxonomy_refs:
  - sacred_exchange
  basis: Mother-Corn gives bundle-related objects, promises a Mother-Corn in the bundle,
    disappears, and an ear of corn wrapped in her robe is found under the bundle.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The exchange is implicit in the sequence of gift, disappearance, and bundle
    object; the passage does not use the term exchange.
- id: motif:6
  label: Ritual sacrifice remembers origin under the earth
  taxonomy_refs:
  - sacrifice
  basis: The Awaho bury a piece of sacrificed meat and eat the rest; the passage explains
    the burial as teaching that the band was once covered and under the earth.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The interpretation is internal to the passage; broader comparative significance
    is not established here.
- id: motif:7
  label: Purification of sacred objects with water, flowers, fire, bathing, and sacrifice
  taxonomy_refs:
  - sacrifice
  basis: After the recovered bundle is purified with water, flowers, fire, and river
    bathing, meat sacrifices are made because the people and bundle are cleansed.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage presents purification and sacrifice as ritual actions but
    gives limited procedural detail beyond the described objects and sequence.
- id: motif:8
  label: Last or deserted band preserves and teaches ceremonies
  taxonomy_refs:
  - wisdom
  basis: The Awaho are the left or deserted last band, yet the passage says they knew
    all ceremonies and taught them to others.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The taxonomy reference 'wisdom' is general; the passage specifically concerns
    ceremonial knowledge.
