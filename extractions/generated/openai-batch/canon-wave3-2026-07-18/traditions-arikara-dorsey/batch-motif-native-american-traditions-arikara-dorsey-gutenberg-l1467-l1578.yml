canonical_text:
  quote: ''
  summary: An Arikara account explains the origin of the Awaho-bundle people. The
    people emerge from beneath the ground after distress and are led by Mother-Corn,
    who is sent by the heavens. Animal helpers open ways through earth, timber, a
    chasm, and ice-covered water. Mother-Corn gives ceremonies and bundle objects,
    then disappears, leaving an ear of corn wrapped in her robe. The Awaho are named
    as the left or deserted last band, preserve ceremonies, practice meat sacrifice
    and burial in remembrance of their under-earth origin, and purify a recovered
    sacred bundle with water, flowers, fire, river bathing, and later sacrifices.
  language: English
  quote_policy: summarized
