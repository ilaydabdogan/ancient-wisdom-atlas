canonical_text:
  quote: ''
  summary: 'The passage gives abstracted summaries of several Arikara traditions:
    animal sleight-of-hand performances; Village-Boy receiving wolf power and war
    success; Rabbit-Boy receiving rabbit power, raiding enemies, and helping make
    peace; a feared man aided by underwater dogs; turtle-linked origins of drums and
    a buffalo dance episode involving a mysterious being and child; rainmaking objects
    identified with an old woman on an island; a man who marries a coyote; and two
    accounts of people turning into stone.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Animals gather for sleight-of-hand performances, with Beaver, soft-shell Turtle,
    and Witch-Woman named as the performers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beaver gnaws nearly through three lodge posts, and people ask him to stop
    because they fear the lodge will fall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Soft-shell Turtle sticks a knife near his left collar-bone, water pours through
    the lodge, and he later takes the water back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Witch-Woman plays with a gun, calls for help, and gives birth to a child said
    to become a great medicine-man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Village-Boy mourns in a graveyard, meets Wolf, receives secret powers, and
    rolls on the ground to become a wolf near a ravine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Village-Boy leads in an enemy attack, takes a scalp, receives public credit,
    and later takes the head of a medicine-man of the Dumb People, whose dried head
    is used for medicine purposes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A young man mourning on a graveyard hill protects Jack-Rabbit from Eagle,
    and Rabbit gives him a war-club, rabbit-skin, and medicine paints.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Rabbit-Boy scouts and raids an enemy village, receives objects sent through
    an Arikara captive woman from an enemy girl, enters the girl’s tipi, and eventually
    the two tribes make peace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A feared man who commits evil deeds walks into a river, travels on the river
    bottom to a tipi of dogs, and receives assurance from their leader that he need
    not fear any man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Five soft-shell Turtles come to a village; four die and are made into drums,
    and a buffalo dance is organized.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A mysterious being with magpie feathers growing on his head dances during
    the buffalo-dance episode; a girl leaves the lodge despite a prohibition, becomes
    pregnant, and bears a child like the being.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: People kill the mysterious child and throw it into the river; a medicine-man
    throws a rock into the river, the waters part, the child is seen in the water
    and pulled out, and the child is buried between split stones.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A notched stick and dried buffalo hide are used to make rain during a medicine-men’s
    ceremony, then taken to an island where a man sees an old woman; his father says
    the objects are put there because they are the old woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A man stunned in battle revives after a year, joins Coyotes, marries a Coyote,
    is captured by hunters, calls for his coyote wife, and later finds that a baby
    coyote has disappeared from a snow bank.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: An old medicine-man waits for dried meat to offer as a sacrifice, but no one
    gives any until too late; his legs turn to stone and by the next day he is a rock
    in human form.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A chief’s daughter who had refused marriage is persuaded to marry; after a
    failed marital encounter involving her having only a sunflower, she leaves and
    turns to stone from shame.
  category: sequence
  evidence_refs:
  - ev:9
