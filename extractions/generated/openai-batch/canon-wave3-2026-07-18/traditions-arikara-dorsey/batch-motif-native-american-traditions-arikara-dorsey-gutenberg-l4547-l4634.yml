- id: obs:1
  text: The man, Buffalo cow, and boy enter the Buffalo village, where the Buffalo
    debate whether the man should be killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man sits on a hill, places a flint stone knife in the ground, and calls
    on gods in the ground to form stone around him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The calf warns the man that the Buffalo intend to kill him and says some Buffalo
    support him but are too few to prevent it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The calf and Yellow-Calf win a race against other calves, angering the Buffalo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy marks his mother with a burr so the man can identify her among other
    Buffalo cows who look alike.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy places a downy feather in his father’s hair before the Buffalo bulls
    rush at him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Four times the Buffalo rush at the man, but he remains seated on the hill,
    and when the Buffalo hook the ground their horns are knocked off by flint rocks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Buffalo tell the man to return to his people for eagle feathers and native
    tobacco and promise to send Buffalo so the people may have meat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Buffalo bull runs over the man, after which the man finds himself locking
    horns as a Buffalo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man, his wife, and his son travel as Buffalo, then turn into human beings
    near the human village and enter it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: People in the village bring eagle feathers and native tobacco to the man,
    who takes the gifts back toward the Buffalo herd.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Buffalo who receive presents are willing to go with the first group to be
    slaughtered by the people.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A big fire is made in the Buffalo man’s lodge, chiefs are summoned, and the
    man tells them where the people will find Buffalo the next morning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The people kill Buffalo in repeated outings, and the whole drove comes to
    the village.
  category: sequence
