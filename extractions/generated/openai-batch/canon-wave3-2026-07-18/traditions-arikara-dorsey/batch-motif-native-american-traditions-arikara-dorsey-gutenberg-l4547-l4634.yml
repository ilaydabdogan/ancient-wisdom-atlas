canonical_text:
  quote: ''
  summary: A man with a Buffalo wife and son enters the Buffalo village, is judged
    by the Buffalo, protects himself on a hill with flint stone power, is helped by
    his son in a race and in identifying his wife, survives attacks by Buffalo bulls,
    is transformed into a Buffalo, returns with his Buffalo family to the human village
    for eagle feathers and tobacco, and mediates an exchange in which Buffalo are
    given as meat to the people.
  language: English
  quote_policy: summarized
