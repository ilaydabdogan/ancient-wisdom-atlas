canonical_text:
  quote: ''
  summary: A young human man, aided by a Buffalo woman, is hidden in a Buffalo village
    where Buffalo people eat humans. She explains that he has been brought to help
    his people overcome the Buffalo. His people are to come out of the ground through
    a hole in an old hollow cottonwood tree, be armed with bows and arrows, and attack
    the Buffalo while withholding weapons from Cut-Nose, who helps the Buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man and the woman pass between Buffalo bull sentinels, through circles
    of Buffalo, and enter the ceremonial tipi while the woman covers him with her
    robe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Buffalo in the tipi notice the smell of human flesh, but others explain
    it as the result of a recent killing, so the hidden young man is not exposed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Buffalo who return to the lodge are described as human in form except
    for horns and tails, and they bring, cook, and eat human meat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Outside the lodge, the boy sees arbors holding fresh human meat and uncut
    bodies, and he becomes frightened.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Buffalo woman says the Buffalo eat the boy’s people and that she brought
    him there so his people can overcome and kill the Buffalo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Buffalo woman says that after the Buffalo are killed and driven away,
    they will eat grass intended for them by Nesaru, and the boy’s people will come
    out of the ground.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Buffalo woman instructs the young man to make many bows and arrows and
    says he will teach his people the ceremony the Buffalo sang before killing them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: An old hollow cottonwood tree has a knot-hole near its base, and an ash stick
    lies beside it; the woman says the stick makes people come out of the hole.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cut-Nose is said to sit at the entrance, come out first, escape, and help
    the Buffalo.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young man stays in the timber making bows and arrows, while the woman
    visits him at night, gives him buffalo meat, and later gives him long sinew strings
    for the bows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The young man listens to the Buffalo singing; the singing continues through
    the ceremony and stops at the end of every tenth song before resuming.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman instructs the young man to place the weapons at the foot of the
    tree, run up to the tree three times when the Buffalo approach, and distribute
    weapons to the men after he hears shouting, wailing, and screaming.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The woman specifically instructs the young man not to give weapons to Cut-Nose,
    because Cut-Nose helps the Buffalo.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: After arranging the bows around the tree, the young man and the woman hide
    under the bank.
  category: action
  evidence_refs:
  - ev:6
