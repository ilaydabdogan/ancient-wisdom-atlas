canonical_text:
  quote: ''
  summary: An Arikara story titled “The Man and the Water-Dogs” tells of a brave but
    violent man whom villagers try to kill. He sinks into the river, finds an underwater
    tipi inhabited by Dogs, is promised protection, returns to the village, frightens
    the people, commits worse crimes, and causes a permanent separation of kin groups
    from the village.
  language: English
  quote_policy: summarized
