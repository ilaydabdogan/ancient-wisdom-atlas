canonical_text:
  quote: ''
  summary: A narrative recounts animal-assisted emergence from underground, travel
    through water, darkness, chasms, and timber, the origin of ritual bundles, the
    sending of an ear of corn as Mother-Corn down the river, and the later return
    of a strange corn-woman who gives instructions about dreams, bundles, clothing
    the corn, and offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The animals agree to lead the people out so they can live on land and see
    the celestial bodies and heavens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The long-nosed Mouse instructs the Bear to enlarge the hole; the Bear digs
    until light reaches the people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The long-nosed Mouse goes out first, followed by the other animals and then
    the people, who have no clothing and no food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the ground, a woman tells a man that she is not a real woman but a grain
    of corn with understanding of what the people should do.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman says the people are on an island in big waters and had been placed
    there so they could dig through the earth and come out.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people who had been taken underground by Mice are described as grains
    of corn that have turned into people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man enters the water and turns into a long gar-pike; a woman is commanded
    to join him, and together they form a bridge, though some people fall into the
    water and turn into fish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the mainland the people pick up flint stones to use for cutting.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: During darkness, the Mouse leads the people through the dark and out of thick
    timber; people left in the timber turn into Owls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: An earthquake opens the land into a deep chasm; the Bear makes steps on both
    sides so the people can pass.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When thick timber blocks the way west, the Mouse calls on the gods and a Whirlwind
    makes a pathway through the timber without hurting the people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In muddy water in Pawnee country, the people find things to wear and eat,
    make the first bow, and wrap animal skulls and skins into bundles that receive
    rituals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Arikara dress an ear of corn as a woman, throw it into the River, and
    the old men address it as Mother while asking it to go to the origin island and
    return with knowledge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Years later a strange woman visits bundle lodges, sits under bundles, is eventually
    noticed and recognized, and a ceremony is performed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The returned woman says the people came from the ground, overcame obstacles
    by animal aid, were helped by her prayers to the gods and Nesaru, and should tie
    her on the bundle, clothe the corn, and offer corn and meat.
  category: speech
  evidence_refs:
  - ev:10
