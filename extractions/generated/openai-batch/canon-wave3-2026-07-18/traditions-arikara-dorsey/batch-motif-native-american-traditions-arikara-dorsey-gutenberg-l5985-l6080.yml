canonical_text:
  quote: ''
  summary: In the Arikara story opening, Young-Eagle of the south village and Yellow-Calf
    of the north village independently set out to visit one another after hearing
    of each other’s beauty. They meet on a high hill halfway between the villages,
    mark the place with a pile of stones, and proceed toward Yellow-Calf’s home. At
    a lake Young-Eagle dives underwater fully dressed and later emerges in a greatly
    altered, unattractive form. Yellow-Calf takes him home, where her parents assume
    he is her husband, but his behavior and appearance cause shame and mockery, and
    people call him Big-Belly-Boy.
  language: English
  quote_policy: summarized
