canonical_text:
  quote: ''
  summary: A boy enters a lodge and confronts an old woman attached to a young man’s
    back, saying she came from the Buffalo with a message but failed her purpose.
    Using colored arrows from his father Lightning, he splits and removes her, treats
    the sore place, and orders her burned. Afterward crying and a voice are heard
    near the burned place; the young man notices his ring is gone and dreams of hooking
    the ring with a stick while thinking he is with a woman.
  language: English
  quote_policy: summarized
