- id: obs:3
  text: The girl searched for food for the boy, was taken far away by a Whirlwind,
    returned, and afterward often disappeared for days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The girl brought the boy a bow, four blunt arrows, and later a larger bow
    with a quiver full of arrows.
  category: object
