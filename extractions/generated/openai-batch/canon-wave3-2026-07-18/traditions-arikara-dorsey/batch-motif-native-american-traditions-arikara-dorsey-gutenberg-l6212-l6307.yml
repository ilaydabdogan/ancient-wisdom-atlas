canonical_text:
  quote: ''
  summary: An Arikara tale, attributed in a footnote to Yellow-Bull, begins with two
    children separated from their family during a buffalo hunt. They find a cave near
    the village timber. The girl is taken by a Whirlwind and becomes associated with
    storm arrivals, repeated absences, and acquisition of weapons. An Owl warns the
    boy that his sister has become a dangerous Whirlwind and plans to kill him. The
    Owls shelter him in their den, and he is released after promising his first wife
    to the Whirlwind. He returns to his people, directs them to buffalo, helps them
    defeat enemies, and is promised the chief's daughter as a wife.
  language: English
  quote_policy: summarized
