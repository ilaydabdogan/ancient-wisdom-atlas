canonical_text:
  quote: ''
  summary: The passage begins the Arikara story 'Why the Buffalo No Longer Eat People.'
    During a famine caused by lack of buffalo, the chief and priests use the sacred
    pipe, Knot-in-the-Tree bundle, offerings, songs, and a pole ritual to call buffalo.
    After buffalo arrive, an old priest tells a story of Buffalo people who are human
    with horns and use their own Knot-in-the-Tree ritual at a hollow cottonwood tree
    to release and kill human beings for meat. One boy survives after being chased
    by a Buffalo cow. He hides in a ravine, later meets a strange woman in a white-looking
    buffalo robe, eats food she gives him, sleeps under her robe, and learns that
    she belongs to the Buffalo people and has chosen him to make them real animals
    so they will no longer eat human people.
  language: English
  quote_policy: summarized
