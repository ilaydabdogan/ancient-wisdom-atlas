candidate_motifs:
- id: motif:1
  label: Ritual exchange to obtain buffalo
  taxonomy_refs:
  - sacred_exchange
  basis: The chief and priests offer smoke and gifts to gods and call buffalo, after
    which buffalo come about three days later.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents ritual action and result but does not analyze the
    theology of exchange beyond gifts and divine aid.
- id: motif:2
  label: Promised animal helpers called in hunger
  taxonomy_refs:
  - covenant
  basis: The errand man addresses the buffalo as having promised to come when the
    people are in need of food.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: Only a brief speech refers to the promise; the passage does not give the
    original promise itself.
- id: motif:3
  label: Horned Buffalo people who can become real animals
  taxonomy_refs:
  - shapeshifter
  basis: The Buffalo are described as human with horns, and the Buffalo woman says
    there is a way for them to become real animals.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: high
  cautions: The actual transformation is anticipated in this excerpt but not completed
    within the supplied passage.
- id: motif:4
  label: Hollow tree as portal releasing people
  taxonomy_refs:
  - sacred_tree_axis
  basis: A hollow cottonwood tree is struck in ritual, people emerge from it, and
    Cut-Nose's return into the tree stops the outflow of people.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The tree functions as a passage or source in the narrative, but the excerpt
    does not explicitly call it an axis or world center.
- id: motif:5
  label: Survivor chosen to save his people through hidden knowledge
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: The escaped boy is selected by the Buffalo woman, who says she learned how
    his people can be saved and chose him to turn the Buffalo into animals.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: medium
  cautions: The boy's saving action is announced but not yet narrated in this line
    range.
- id: motif:6
  label: Animal woman ally guides human through guarded animal realm
  taxonomy_refs:
  - mystical_quest
  basis: The Buffalo woman tells the boy to go with her to the Buffalo people and
    pass unobserved through four circles of stationed Buffalo bulls.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The journey is set up at the end of the excerpt; its outcome is outside
    the supplied passage.
- id: motif:7
  label: Etiology of changed human-animal relations
  taxonomy_refs: []
  basis: The title and the woman's speech frame the story as explaining why Buffalo
