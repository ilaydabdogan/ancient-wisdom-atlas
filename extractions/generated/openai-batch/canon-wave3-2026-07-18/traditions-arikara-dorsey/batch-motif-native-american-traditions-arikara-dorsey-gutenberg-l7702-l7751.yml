canonical_text:
  quote: ''
  summary: A village of earth-lodges is partly emptied when many young people go on
    a buffalo hunt. Enemies attack the remaining villagers. An old medicine-man puts
    on medicine paint and costume, carries a gourd without a weapon, sings sacred
    songs from a lodge roof, and frightens the enemies away. A wounded enemy young
    man is brought into the village, tied to a wooden cross outside it, and dies there.
    Later his bones fall from the cross, rise, run into the village as a ghost, and
    enter the medicine-lodge. A brave man finds the figure under blankets on the altar;
    the people gather the bones in an old basket and throw them away. The hunting
    party returns with dried meat and is told what happened.
  language: English
  quote_policy: summarized
