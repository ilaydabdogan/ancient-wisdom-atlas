  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Years later, during a fall bundle ceremony, a mysterious-looking woman enters
    the lodge, is recognized as Mother-Corn, teaches more bundle ceremony songs, disappears
    before daylight, and is never seen again.
  category: sequence
  evidence_refs:
  - ev:5
