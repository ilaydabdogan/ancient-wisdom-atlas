  quote: ''
  summary: Mother-Corn gives corn seeds to the people, explains their ritual use,
    names scattered peoples, teaches bundle ceremonies and songs, departs by transforming
    into an ear of corn that is thrown into the river, and later returns briefly during
    a bundle ceremony to teach more songs before disappearing.
  language: English
  quote_policy: summarized
