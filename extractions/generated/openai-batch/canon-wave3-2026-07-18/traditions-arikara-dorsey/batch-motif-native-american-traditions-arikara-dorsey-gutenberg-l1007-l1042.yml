  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mother-Corn stays with the people until she has taught them the bundle ceremonies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mother-Corn says she will go back to the place from which they came and tells
