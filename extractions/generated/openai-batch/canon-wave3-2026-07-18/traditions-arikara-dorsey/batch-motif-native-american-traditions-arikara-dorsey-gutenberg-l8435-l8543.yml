canonical_text:
  quote: ''
  summary: The passage contains abstracts of Arikara origin and Mother-Corn traditions.
    Repeated episodes describe people living underground or in a cave, animal helpers
    digging or opening passages to the upper earth, westward travel through obstructing
    waters, timber, chasms, ice, and mountain banks, the ritual importance of Mother-Corn
    and sacred bundles, transformations between corn, people, animals, stones, and
    ritual objects, and later visits or returns of Mother-Corn to teach ceremonies.
  language: English
  quote_policy: summarized
