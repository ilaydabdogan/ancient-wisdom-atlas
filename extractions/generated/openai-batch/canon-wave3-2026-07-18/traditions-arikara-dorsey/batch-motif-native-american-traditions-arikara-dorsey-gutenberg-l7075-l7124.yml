canonical_text:
  quote: "“As soon as I had died I saw a path leading east.”"
  summary: A first-person speaker dies, sees a path east, enters the dead man's country
    through a small hole, is warned by a red-anointed robed man not to enter the dead
    people's village or lodge, observes a lodge ritual where dead people use dried
    willow sticks to call living relatives toward sickness and death, is told to return
    to his own country, and wakes remembering the experience.
  language: English
  quote_policy: quoted
