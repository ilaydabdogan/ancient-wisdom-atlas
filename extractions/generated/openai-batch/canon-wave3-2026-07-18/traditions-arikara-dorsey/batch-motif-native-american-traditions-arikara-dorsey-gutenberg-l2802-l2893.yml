    things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the morning the Sun takes No-Tongue into the sky to his home and asks him
    to choose among his possessions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: No-Tongue chooses the oldest things; the Sun cries because these old things
    will give No-Tongue long life and greatness, contrary to the Sun’s wishes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Sun tells No-Tongue that he will return home, go on the war-path after
    two days, conquer old enemies, and become great, then asks him to give the Sun
    a white buffalo robe.
  category: speech
  evidence_refs:
  - ev:7
