canonical_text:
  quote: "“All I want from you is your tongue.”"
  summary: A young man seeking warrior greatness fasts and mourns on a hill. A bird
    guides him to another place, where a red-painted man later identified as the Sun
    demands his tongue and causes his death. The Moon revives him, adopts and instructs
    him, and helps him survive the Sun’s tests involving old weapons and a requested
    white buffalo robe.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Young men seeking greatness are described as going among the hills to stand,
    mourn, and remain away from home for four or five days without eating or drinking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man goes alone onto a high hill to mourn, but a little bird tells
    him this is not the place and leads him to another standing place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A red-painted man comes in the evening, says the young man will be his son,
    asks for his tongue, and receives it after the young man cuts it off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After handing over his tongue, the young man falls down and dies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Moon rises, identifies the red-painted man as the Sun, touches the young
    man’s feet, and the young man wakes and sits up.
  category: action
  evidence_refs:
  - ev:4
