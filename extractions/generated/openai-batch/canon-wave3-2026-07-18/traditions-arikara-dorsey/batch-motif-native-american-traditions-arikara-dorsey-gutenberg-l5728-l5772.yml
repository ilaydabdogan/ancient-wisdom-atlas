canonical_text:
  quote: The buffalo skull and Mother-Corn blessed and poured their mercy on the baby
    girl.
  summary: An Arikara tradition told by Standing-Bull recounts how a mother placed
    her baby girl on a buffalo skull at an altar while protecting corn and other goods
    from rain. The buffalo skull and Mother-Corn watched and blessed the child. After
    growing into a woman marked by sacred power, she relieved a famine by having people
    clean their cellars, placing crop seeds there, requiring a four-day wait, and
    then the cellars were found full of food.
  language: English
  quote_policy: quoted
