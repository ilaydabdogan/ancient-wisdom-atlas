canonical_text:
  quote: ''
  summary: The passage opens the Arikara narrative “The Buffalo-Wife and the Javelin
    Game.” A successful young hunter dreams of a buffalo cow and two bulls becoming
    a ring and sticks, later encounters a buffalo cow, finds the ring, makes sticks
    from ash, and establishes a popular game. In a later episode he carries an old
    woman across a river; she clings to his back, claims to be his wife, and cannot
    be removed by medicine-men. A poor boy with hidden powers accepts a pipe, takes
    a bow and four colored arrows, and enters the afflicted young man’s lodge.
  language: English
  quote_policy: summarized
