canonical_text:
  quote: ''
  summary: An Arikara origin account in which Nesaru judges over-strong ancient people,
    preserves favored smaller people by having them become corn and live underground,
    sends Mother-Corn to bring them out, and explains the emergence of the people
    and the traits of Badger, Mole, and long-nosed Mouse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Large ancient people live on the earth, are very strong, lack good judgment,
    and make fun of the gods in the heavens.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nesaru is angry, says he made the large people too strong, decides to destroy
    them, and says he will put away the smaller people whom he likes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Animals assist some people to turn into corn, and those people are taken underground
    into a large cave where animals and people live together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The large people are killed by a flood, while the underground people know
    nothing of it because they are grains of corn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nesaru plants corn in the heavens, takes a mature ear of corn, turns it into
    a woman, and sends her to earth to bring his people from the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman follows thunder in the east, finds the underground people, is taken
    underground by Nesaru's power, and is recognized by people and animals as Mother-Corn
    with the consent of the gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mother-Corn says they must leave the underground darkness for the light above
    the earth, and Badger, Mole, and long-nosed Mouse volunteer to dig through the
    ground.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Badger, Mole, and long-nosed Mouse dig upward in turns and become tired; long-nosed
    Mouse pushes its nose through first, sees a little light, and says this made its
    nose small and pointed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mole goes through the hole, is blinded by the brightness of the eastern sun,
    and says it must live under the earth, with its people blind in daytime but able
    to see at night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Badger enlarges the hole, sunlight marks its face and legs black, and Badger
    asks to keep the marks so people will remember its help.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: As Mother-Corn leads the way out, thunder from the east shakes the earth open
    and the people are put on top of the earth, where they wail, cry, and rejoice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Mother-Corn says her people will journey west and that any who wish to remain
    as Badgers, long-nosed Mice, or Moles may do so; some people turn back to the
    holes and become animals.
  category: sequence
  evidence_refs:
  - ev:8
