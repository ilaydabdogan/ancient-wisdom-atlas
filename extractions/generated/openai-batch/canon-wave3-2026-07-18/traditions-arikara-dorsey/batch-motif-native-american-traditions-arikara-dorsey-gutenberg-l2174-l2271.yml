canonical_text:
  quote: ''
  summary: A husband finds his missing wife hanging from a string at a hole and sends
    a small stone down the string to kill her while sparing their boy. The boy falls
    unharmed, remains near his dead mother for a time, then goes west into fields.
    An old woman identifies him by leaving gendered play objects; he chooses bow and
    arrows, and she takes him as her grandson. The old woman feeds blackbirds that
    guard her field. The boy traps and kills the birds, but the old woman restores
    them to life. She then prepares ash and dogwood sticks and instructs the boy to
    throw them into pond water while addressing Grandfather; the next day he finds
    a black bow and four black arrows.
  language: English
  quote_policy: summarized
