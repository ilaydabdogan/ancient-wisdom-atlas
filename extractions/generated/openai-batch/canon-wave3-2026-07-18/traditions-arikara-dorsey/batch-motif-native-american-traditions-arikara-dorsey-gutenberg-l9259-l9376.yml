canonical_text:
  quote: ''
  summary: 'The passage contains abstracts of Arikara traditions: a boy and girl lost
    from a travois, the girl identified as Whirlwind, a bargain involving the boy’s
    future wife, and the boy’s later warrior and chiefly status; followed by Coyote
    abstracts involving mice dancing in an elk skull, transformation into buffalo,
    a speaking artichoke, riding Bear and Buffalo, races against Buffalo and Turtle,
    animated dancing corn, and a title for a following Coyote-and-Stone race.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy and girl fall from a travois, wander to a cave, and the girl is taken
    far away by Whirlwind while seeking food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Owl warns the boy that his sister is Whirlwind, that she intends to kill him,
    and that she cuts off and eats men’s testes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Whirlwind demands the boy but releases him after he promises to give her the
    first woman he marries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The boy returns to his people, helps locate buffalo, kills enemies during
    an attack, marries the chief’s daughter, receives a club and medicine with Whirlwind
    power from his sister, and becomes warrior and chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Coyote puts his head through an elk skull to see the Mice dancing, becomes
    stuck, is mistaken across water for a wonderful animal, demands the chief’s daughter,
    is exposed, bound, fouled, and escapes through a trick on an old woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Coyote consents to be made a Buffalo; after a buffalo rushes at him there
    are two buffalo bulls, but later Coyote-Buffalo runs into another Coyote and there
    are two coyotes instead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Coyote digs up Artichoke, eats it after it repeats the name “Take-a-Bite,”
    suffers worsening flatus, is carried upward with a tree and stone, and is killed
    when the stone falls on him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Coyote threatens Bear, rides on Bear’s back, mocks Bear from a hill, and is
    then killed by Bear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coyote falsely says Buffalo is his horse, injures himself, persuades Buffalo
    to carry him, strikes Buffalo with a cane, runs back to the village, and marries
    the girl.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Coyote tricks Buffalo into running with closed eyes toward a steep bank, butchers
    Buffalo after the fall, and later loses all the meat after Fox spreads the story
    to other animals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pounded corn lumps run into a mortar, come out to dance with Coyote, and Coyote
