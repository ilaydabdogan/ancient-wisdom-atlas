canonical_text:
  quote: ''
  summary: The Moon warns No-Tongue that Little-Sun, another son of the Sun, has been
    selected to kill him and gives instructions for the encounter. No-Tongue kills
    Little-Sun in battle. The Sun becomes angry, continues plotting against No-Tongue,
    changes into a Buffalo and is burned after becoming stuck in mud, and later tries
    to scalp No-Tongue. The Moon instructs No-Tongue to use a false bloody scalp,
    deceiving the Sun. The Sun then says he will leave No-Tongue until he is old and
    later take him up to his home; the Moon reports this to the aged, blind No-Tongue.
  language: English
  quote_policy: summarized
