canonical_text:
  quote: ''
  summary: In an Arikara tale, a village girl becomes attached to Buffalo, who sometimes
    appears as a well-dressed young man. Coyote claims that Buffalo is his horse and
    tricks Buffalo into carrying him by pretending to be crippled. Coyote then marries
    the girl, Buffalo leaves in shame, and the tale explains this as the reason Coyote's
    descendants are tricky and marry by foul means.
