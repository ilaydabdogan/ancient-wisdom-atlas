canonical_text:
  quote: ''
  summary: A young Arikara eagle hunter conceals himself in a baited hole on a high
    hill. Sioux find him, capture him, and force him to lead them to other Arikara
    hunters and cook meat for them. He uses a fire-stick with buffalo tallow to fling
    burning grease on the Sioux, escapes while they remain frightened in the tipi,
    and returns home to alert his people. Arikara warriors pursue the Sioux, kill
    three, return with three scalps, and hold war dances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arikara eagle hunters are described as going to hills, digging holes, and
    staying in them for many days to catch eagles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One young man climbed a high hill, dug a hole, covered it with dry limbs,
    placed dead jack-rabbits and small animals on the limbs, and entered the hole
    with his bow and arrows outside.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sioux found the hole and the man's weapons, removed the things from the hole,
    and ordered him to crawl out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sioux asked where the other men were, tied the young man, and he led them
    to the other men's location.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the other location the Sioux found much meat, untied the man, told the
    Arikara to stand around the fireplace, and made the man cook meat for them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man put a fire-stick into buffalo tallow, held it over the fire, whirled
    the dripping grease, and burned the Sioux with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Sioux were frightened, and the man left the tipi, weak from torture, and
    went into a ravine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sioux stayed in the tipi all night because they thought the man might
    be waiting outside to kill anyone who came out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: That night the man went home and told the people what had happened, after
    which warriors and braves mounted ponies and pursued the Sioux.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Arikara killed three Sioux, returned home with three scalps, and the people
    gave war dances.
  category: sequence
  evidence_refs:
  - ev:7
