canonical_text:
  quote: ''
  summary: The passage presents the tale of Burnt-Hands, also called Poor-Boy, a poor
    young man who joins buffalo hunts, is mocked, is selected to direct the hunters,
    kills buffalo, uses buffalo hair to produce tongues and hearts for his grandmother,
    sings of a coming snowstorm that kills many mockers, repeats the feat in a later
    hunt, receives a pony, marries the chief's daughter, becomes a great warrior,
    and finally becomes a chief.
  language: English
  quote_policy: summarized
