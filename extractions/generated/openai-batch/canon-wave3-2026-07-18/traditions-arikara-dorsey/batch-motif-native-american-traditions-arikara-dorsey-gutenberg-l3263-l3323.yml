- id: obs:2
  text: During a winter buffalo hunt, an old woman and her grandson Burnt-Hands are
    described as very poor and are with a village camped along a stream after scouts
    report buffalo.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Burnt-Hands asks his grandmother to make a bow and arrows and says he will
    bring back tongues and hearts; the grandmother cries because she thinks he cannot
    obtain them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Burnt-Hands joins the hunters, some people jeer at him as Poor-Boy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Burnt-Hands sings about being selected to stand in front and direct the hunters,
    and the leaders select him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the first hunt, Burnt-Hands goes among the buffalo, kills, and pulls out
    buffalo beards and shoulder hair, keeping them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Burnt-Hands finds that his robe has been taken, sings about it, asks for its
    return, and is mocked instead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Burnt-Hands sings about a coming snowstorm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At his grandmother's dwelling, Burnt-Hands throws the collected hairs on the
    ground and tongues and hearts appear there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The grandmother boils the tongues and hearts, and she and Burnt-Hands eat
    until filled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cold weather becomes a blizzard and kills many men who had mocked Burnt-Hands;
    others return saying he has done wonderful things.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: On a later buffalo hunt, people cease mocking Burnt-Hands, call him again
    to direct the hunters, and he is first to kill although he has no horse.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the later hunt, Burnt-Hands again pulls beard and side hair from buffalo,
    throws the hairs down in the lodge, and many tongues and hearts appear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: People recognize Burnt-Hands as wonderful, give him a pony for carrying meat,
