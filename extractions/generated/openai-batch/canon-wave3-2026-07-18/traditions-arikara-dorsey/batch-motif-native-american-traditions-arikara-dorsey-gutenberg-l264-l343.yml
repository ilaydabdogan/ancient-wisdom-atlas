canonical_text:
  quote: ''
  summary: The introduction describes the collection context for Arikara traditions,
    historical relations with Skidi Pawnee, Mandan, and Minitaree peoples, and gives
    a general motif-level overview of tales concerning earth creation by Wolf and
    Lucky-Man, human creation by Spiders with Wolf's aid, variants of the emergence
    of people, corn cultivation, and the escape of the Arikara from buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The traditions were collected in 1903 as part of a systematic study of Caddoan
    mythology and ceremonies, and were secured through James R. Murie of the Skidi
    band of Pawnee.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Arikara are described as belonging to the Caddoan linguistic stock and
    as formerly closely allied with the Skidi band of Pawnee, from whom they separated
    about 1832.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Arikara lived at various points along the Missouri River and were placed
    on Fort Berthold Reservation with the Mandan and Minitaree or Grosventres in 1854.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Arikara and Skidi are described as having dwellings, general mode of life,
    earth-lodge construction, social organization, and religious ceremonies that were
    similar in general.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Certain Arikara tribal members are said to possess sacred bundles or altars,
    while religious ceremonies are generally held secretly because of intimidation.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tales are described as having many points of resemblance with Skidi and
    other Pawnee tales, while also containing elements not found among the Skidi.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first and second tales are summarized as telling of the creation of the
    earth by Wolf and Lucky-Man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Another origin account is summarized as the creation of people by the Spiders
    through the assistance of Wolf.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The appearance of people upon earth, also called emergence, is said to occur
    in a number of variant forms in tales numbered 3 to 13.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tales numbered 9 and 10 are said to show the importance of corn cultivation
    among the Arikara.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tales numbered 11, 12, and 13 relate varying versions of the escape of the
    Arikara from the buffalo.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The fundamental principle of the escape-from-buffalo myth is described as
    widespread among many Plains tribes.
  category: relationship
  evidence_refs:
  - ev:8
