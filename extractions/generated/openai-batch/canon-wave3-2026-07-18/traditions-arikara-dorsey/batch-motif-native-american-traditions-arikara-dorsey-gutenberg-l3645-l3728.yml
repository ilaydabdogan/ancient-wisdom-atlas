canonical_text:
  quote: ''
  summary: An Arikara tale, told by Antelope, describes a foolish young man befriended
    by a chief's son. While traveling on the war-path, the two encounter a water-serpent
    blocking their way. They burn it in two; the foolish boy eats some of its meat
    despite his companion's warning. Over successive mornings his body becomes colored,
    his legs join into a tail, and he becomes a Snake. After failed attempts to place
    him in lakes, he settles in the Missouri River and instructs people to address
    him as brother and give him presents for safe crossing.
  language: English
  quote_policy: summarized
