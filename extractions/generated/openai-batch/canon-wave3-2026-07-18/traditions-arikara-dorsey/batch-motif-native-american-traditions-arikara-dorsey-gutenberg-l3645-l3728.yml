- id: obs:1
  text: A young man described as an idiot is plagued by the other boys, but the chief's
    son likes him, takes him to his lodge, and feeds him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:2
  text: The two boys go alone on the war-path, cross the Missouri River, travel south
    and west, become exhausted from lack of food, and turn back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boys encounter a water-serpent that appears like a log in the distance
    and seems to have no end, preventing them from going around it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The foolish boy proposes making a fire on the serpent; the boys gather dry
    limbs, place them on the serpent, set them on fire, and burn the serpent in two.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The foolish boy eats meat from the burned serpent, while the chief's son refuses
    after saying the serpent is wonderful and must not be eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On successive mornings the foolish boy finds colored stripes on his feet,
    then colored legs, then a colored body, and finally legs grown together into a
    snake's tail.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The companion promises to care for the transformed boy, carries him on his
    back, and takes him first to lakes and then to the Missouri River.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The Snake creates commotion in the lakes, and the fishes do not seem to accept
    him; he then says that he is to stay in the Missouri River.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Snake states that people crossing the Missouri River should address him
    as brother, ask to step over him, and give presents; doing so is associated with
    safe crossing, while silence creates danger of drowning.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The people bring blankets, tobacco, pounded corn, and dried meat to the river;
    the Snake boy receives the presents and shows himself, and warriors later address
    him before crossing on the war-path.
  category: action
  evidence_refs:
  - ev:7
