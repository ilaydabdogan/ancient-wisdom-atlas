canonical_text:
  quote: ''
  summary: A young man follows a woman and child from a disappearing tipi. The woman
    and child are seen as Buffalo cow and calf; the calf addresses the man as father,
    gives him water and food, and helps him approach the Buffalo mother. The group
    travels to Buffalo bulls on successive hills, where the man gives eagle feathers
    as presents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A new white tipi appears where ashes were, with a woman holding and talking
    to a child; by evening the tipi is gone, and the young man is well.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman wearing or carrying a new buffalo robe passes the young man while
    leading a child; the young man makes a bundle of eagle feathers and follows them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the young man follows their tracks up a hill, the woman and child are
    seen as Buffalo; the calf calls the cow mother and the man father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buffalo cow tells the calf not to run to the man because the man put them
    into the fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night the man sees a tipi near a river; the calf tells him to sleep outside,
    and the tipi is gone by morning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Buffalo cow covers streams with dust so that the water is hidden; the
    calf makes a small opening through which the man drinks and washes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man is filled and refreshed by water from a small hole that he had thought
    might be too small to satisfy him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: On a later night the man enters the Buffalo tipi and lies by the entrance;
    the tipi is gone again in the morning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The calf tells the hungry man to pick up and eat what the calf drops; the
    dropped chip is pemmican, grows as the man eats, and is said to be made from a
    whole buffalo.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The man sits by the woman in the tipi and sleeps with her; the next morning
    she wraps herself in her robe and stands as a Buffalo, while the boy is a Buffalo
    calf.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The woman says that the boy's grandfather waits on a hill; a Buffalo bull
    there says he has been waiting for them.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The man gives eagle feathers to Buffalo bulls on successive hills; the bulls
    jump, shake their heads, and direct him onward until he reaches four Buffalo bull
    chiefs.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
