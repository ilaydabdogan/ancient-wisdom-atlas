canonical_text:
  quote: ''
  summary: A poor boy named Burnt-Hands joins warriors on the war-path after his grandmother
    warns him not to tell Coyote stories and gives him a handled clay ball for roasting
    corn and as a war-club. The warriors mock and coax him. Later, while he roasts
    corn and begins telling Coyote stories about an attacked war-party, enemies surround
    the group. Burnt-Hands finishes eating, kills many enemies with the clay ball,
    and is later made a chief, receiving a tipi and wife and moving his grandmother
    into the new tipi.
  language: English
  quote_policy: summarized
