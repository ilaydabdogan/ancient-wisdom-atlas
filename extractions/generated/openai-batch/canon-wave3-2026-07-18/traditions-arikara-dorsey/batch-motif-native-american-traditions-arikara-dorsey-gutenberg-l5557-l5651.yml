canonical_text:
  quote: ''
  summary: A first young man seeks mysterious power near the Missouri River but flees
    from a bloody, club-bearing being. His friend repeats the vigil, does not flee,
    and is led through an entrance under the riverbank into a cave or lodge of men
    under the hill. The leader gives him ritual materials, a war-club, and instructions
    for appearing like a scalped man. The young man later uses this power against
    attacking enemies, frightens them, displays a scalp, returns to the source of
    his power, and is eventually known as a great medicine-man rather than a chief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man in the Arikara village wants mysterious power and goes west of
    the village to a hill near the Missouri River, where he waits for three days and
    nights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: A man or being with a war-club, white-clay-covered body, and blood dripping
    from his head appears to the first young man, who becomes afraid and runs home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first young man tells a friend, and the friend goes to the same hill,
    cries there for three days and nights, and remains when the same being threatens
    him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The threatening being identifies himself as the errand man of men living under
    the hill and leads the second young man to an entrance under the Missouri River
    bank, through a long passageway, and into a cave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Inside the cave or lodge, men are seated in a circle; the errand man removes
    the bloody headdress, places it and the war-club before the leader, and takes
    a seat near the entrance.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The leader says the second young man is the first who has not run from the
    errand man and gives him power, ritual instructions, a war-club, and a root for
    swift running.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: During an enemy attack, the young man clears a pathway, smokes himself with
    sage over coals, covers himself with white clay, uses a skin and red paint mixed
    with water on his head, takes the war-club, and leaves the lodge.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: On the battlefield he kills enemies with the war-club and scatters the enemy
    because his bloody, scalped-man appearance frightens them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: After the enemy retreats, he returns to his lodge, removes the head covering,
    smokes himself with medicine, washes in a creek, places a scalp on a pole outside
    the lodge, and disappears at night to the place where he received power.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: The people eventually learn his identity and powers; he becomes a great medicine-man,
    not a chief, and the passage says the scalps he brought were pieces he had made
    himself.
  category: sequence
  evidence_refs:
  - ev:11
