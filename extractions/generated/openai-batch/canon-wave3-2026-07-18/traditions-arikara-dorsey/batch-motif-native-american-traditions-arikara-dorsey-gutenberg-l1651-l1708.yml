canonical_text:
  quote: From the place where she was laid, grass, weeds, bushes, trees, and almost
    everything sprang up.
  summary: In a time of need and planting, Arikara elders make smoke offerings to
    invite Mother-Corn. She visits from the east, teaches the people, accepts ritual
    smoke, and through a moccasin-wearing walk around the fireplace reveals that buffalo
    will appear in four days. After the buffalo hunt succeeds, enemies later attack
    the village; Mother-Corn is killed, buried, and vegetation springs from her burial
    place.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: During a time of need and planting season, old Arikara men customarily held
    a ceremony with smoke offerings to the gods and to Mother-Corn so that Mother-Corn
    would come and the people would have plenty of corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mother-Corn starts from the east, comes through other camps, enters the medicine-lodge,
    and the people follow her in; when she speaks, the people cry for joy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people bring Mother-Corn many kinds of food, but she refuses them and
    says she can eat only a bird, such as a chicken or duck.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mother-Corn stays with the people many days and teaches them many lessons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because buffalo and other animals are scarce, a wise old man lays a sacred
    pipe before Mother-Corn for aid, believing that she has all power from Nesaru.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mother-Corn is pleased to smoke with the people, makes smoke offerings to
    the father, asks certain women to make moccasins for her, and sits on the altar
    in the medicine-lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mother-Corn walks slowly around the fireplace, wearing out several pairs of
    moccasins; the narration states that this walk meant she had traveled a long,
    hard way to the west.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mother-Corn tells the people that she has seen buffalo and that they will
    be seen in four days; the buffalo are seen on the morning of the fourth day.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The men kill many buffalo, meat becomes plentiful, and Mother-Corn receives
    much respect and honor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: While another party is away on a buffalo hunt, enemies attack the village;
    the remaining men fight, are driven out, and Mother-Corn is taken from the medicine-lodge
    and killed before she escapes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Arikara bury Mother-Corn; grass, weeds, bushes, trees, and almost everything
    spring from her burial place, and the returning hunters grieve her loss.
  category: sequence
  evidence_refs:
  - ev:6
