candidate_motifs:
- id: motif:1
  label: People emerge from underground to the earth’s surface
  taxonomy_refs:
  - ascent
  basis: The Arikara are said to live underground until animal helpers bring them
    to the top of the earth and they come out.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage describes emergence upward rather than a named abstract ascent
    doctrine.
- id: motif:2
  label: Animal helpers aid an origin journey
  taxonomy_refs:
  - culture_hero
  basis: 'Multiple animals perform necessary acts for the people: Fox leads and serves
    as messenger, Badger digs a path, Loon opens water, Bear digs steps, and Dog gives
    power.'
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:9
  - ev:10
  confidence: medium
  cautions: The animals function as helpers; the passage does not call them culture
    heroes.
- id: motif:3
  label: Divine or sacred intercession for a people’s survival
  taxonomy_refs:
  - divine_judgment
  basis: Mother-Corn goes into the heavens to ask the gods to let the people live,
    and the gods send Loon to aid them.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage emphasizes petition and aid, not explicit judgment in a punitive
    sense.
- id: motif:4
  label: Obstacle journey after emergence
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: After emerging, the people journey west through a chasm, Sickness or powerful
    obstructions, a deep river, Black-Wind, and a mountain bank.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage gives an origin migration sequence; the taxonomy labels are
    approximate.
- id: motif:5
  label: Miraculous opening of waters for crossing
  taxonomy_refs:
  - water
  basis: Loon opens a deep river so that it banks up on both sides, allowing the people
    to cross before the waters come together again.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The available taxonomy reference is a symbol rather than a motif family.
- id: motif:6
  label: Protective sacred tree during destructive wind
  taxonomy_refs:
  - sacred_tree_axis
  - tree
  basis: Mother-Corn directs the people to a cedar tree placed by Black-Meteoric-Star,
    whose leg is cedar, to shelter from Black-Wind.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage presents the cedar as protective and star-associated; an axis
    interpretation is not explicit.
- id: motif:7
  label: Voluntary animal sacrifice establishes ongoing power and remembrance
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  - covenant
  basis: Dog says the people will kill him, offer his meat to the gods, receive power
    through animals, and remember his promise because he will stay with them.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage frames this as Dog’s promise; the term covenant is not used.
