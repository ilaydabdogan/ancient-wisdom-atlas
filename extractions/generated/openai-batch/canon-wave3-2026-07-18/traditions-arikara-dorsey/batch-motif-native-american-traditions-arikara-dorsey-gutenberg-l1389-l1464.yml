canonical_text:
  quote: ''
  summary: 'The passage introduces an Arikara origin account told after ritual learning
    of bundle songs. The Arikara once lived underground. Pitying animals helped them
    emerge to the surface, after which the people journeyed west through repeated
    obstacles: an earthquake and trapped peoples, a chasm, Sickness, a deep river
    opened by Loon, Black-Wind with shelter under a cedar associated with Black-Meteoric-Star,
    a steep mountain bank crossed by Bear-made steps, and finally Dog’s promise to
    be sacrificed to the gods and to give power through animals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says he sacrificed buffalo to Mother-Corn, listened to songs,
    was given a seat by old men, learned bundle songs, and then heard the story from
    the old men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Arikara are said to have lived under the ground long ago.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Four animals—long-nosed Mouse, Mole, Badger, and Fox—pitied the people and
    agreed to take them to the top of the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fox served as messenger to the people about what the animals were doing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mole was first to dig but ran back because the sun’s brightness blinded him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people came out of the earth with Fox in the lead; an earthquake occurred,
    the Arikara came out, and other people were held fast by the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people journeyed west and reached a shaking place with a chasm or steep
    bank; Badger dug a pathway so they could cross.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mother-Corn was absent during the journey because she had gone into the heavens
    to ask the gods to let the people live.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The obstructions encountered by the people are described as wonderful powers,
    and a strange being is named Sickness or Natogo.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: After passing the first obstacle, the people gave thanks and made offerings
    to the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: During a storm, the people reached a deep river they could not cross until
    Loon, sent by the gods, opened it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Loon said Mother-Corn was traveling in the heavens to help the people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The river banked up on both sides, the people crossed, the waters came together
    again, and some people remained on the other side.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Mother-Corn said Black-Wind was angry because it had not been asked to come
    and had not been made one of the gods to receive smoke.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Mother-Corn said Black-Meteoric-Star understood the storm and would help the
