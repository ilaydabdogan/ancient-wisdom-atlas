canonical_text:
  quote: ''
  summary: A boy visits four men in a tipi, hunts with them, becomes trapped in a
    tree by fear of an elk fetus, and bargains away his grandmother for his life.
    After honoring the bargain, he is taught eagle-catching and hunting ceremonies.
    He later visits a camp of Snakes, protects himself from their attacks, exposes
    their offered spleen as their teeth, tells a story about Nesaru that puts them
    to sleep, beheads them, and leaves while arranging arrows to warn him of danger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy was absent all day and night, and his grandmother thought him dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy found a tipi containing four strong-looking men, a fire, and the meat
    of a whole buffalo and an elk.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men played with plum dice in a basket, and the boy shot an arrow through
    a hole to clean dirt from one man's nose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The men welcomed the boy, gave him buffalo to eat, asked him to stay overnight,
    and invited him on a hunting trip.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: During the hunt the men killed an elk, found a fetus, placed it before the
    boy, and the boy climbed a tree because he was afraid of it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy remained in the tree for about four days, becoming thin and suffering
    for food and water while the fetus stayed below.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The men offered to remove the fetus if the boy delivered his grandmother to
    them, and the boy agreed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The boy brought his grandmother to the men, who praised his honesty and taught
    him ceremonies of catching eagles and hunting, saying they would turn over their
    power and skill to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The boy entered a camp of Snakes, including deadly Rattlesnakes, and placed
    a smooth sharpening stone in his anus before sitting down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Snakes disappeared and attacked the protected place; the boy threw an offered
    spleen into the fire, where it cracked and was identified as the Snakes' teeth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Snakes told stories about the boy and his grandmother, and the boy told
    a story about Nesaru, winds, night, trees, and rivers that put the Snakes to sleep.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boy cut off the heads of the sleeping Snakes with his knife until one
    last Snake escaped and said it would remember.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After leaving, the boy placed arrows around himself and told them to awaken
    him when danger was near.
  category: action
  evidence_refs:
  - ev:7
