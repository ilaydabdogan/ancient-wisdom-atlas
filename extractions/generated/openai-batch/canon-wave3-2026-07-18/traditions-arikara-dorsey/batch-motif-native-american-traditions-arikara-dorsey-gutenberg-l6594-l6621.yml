canonical_text:
  quote: ''
  summary: Two hungry Coyotes go to an abandoned village to look for pounded corn.
    One Coyote finds animated lumps of pounded corn entering a mortar, performs song
    and ceremony-like actions to make them dance, then tries to seize food from the
    mortar and gets stuck. His brother chops open the mortar with an axe, accidentally
    kills him, and finds no food inside.
