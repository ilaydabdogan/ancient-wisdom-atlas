canonical_text:
  quote: ''
  summary: The passage recounts Mother-Corn’s instruction that the Arikara should
    eventually dress her and send her down the Missouri River to the ancestral place,
    with a priest asking her to return. The Arikara prepare her with paint and buffalo
    hide, tie children’s old moccasins to her, pray and weep as she disappears in
    the river, and years later she returns as a woman, is recognized, teaches ceremonies
    and songs, promises continued presence and long life through the gods, then disappears
    again.
  language: English
  quote_policy: summarized
