canonical_text:
  quote: ''
  summary: In an Arikara origin account, people live underground until Mother-Corn
    recruits animal helpers to open a way out. The people emerge, travel through a
    sequence of obstacles with divine and animal assistance, and some people remain
    behind by transforming into worms, animals, birds, fish, or loons. Later, offerings
    and a pipe are prepared for smoking to the gods; a speckled wild-cat is identified
    with the heavens and stars, and three Stars bring a stone that is made into a
    pipe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are described as living in the ground, and Mother-Corn engages Badger,
    Gopher, long-nosed Mouse, and Mole to help get them out.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The animal helpers dig through the earth in sequence; Mole is blinded after
    trying to see the light, Gopher receives a black streak across the eyes, Badger
    is burned by the sun, and long-nosed Mouse says his nose was squeezed into its
    lasting shape while opening the earth doorway.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mole asks to remain underground because of blindness, and Mother-Corn consents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people come out from the ground and see other pathways where other people
    had emerged with Buffalo's help.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the journey, a deep crevice blocks the people; Mother-Corn calls on the
    gods, and Kingfisher breaks down two banks so that they form a pathway.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some people ask to stay in the banks as Worms, and Mother-Corn allows them
    to remain there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thick timber blocks the people; Mother-Corn calls on the gods, and a wonderful
    Owl makes a pathway through the timber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some people ask to stay with the wonderful Owl, turn into animals and birds,
    and remain in the timber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A lake with mountain banks blocks the people; Loon flies through the waters,
    which open and leave the lake bottom dry for crossing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the lake, some people drink and become fish, while others ask to stay with
    Loon, turn into Loons, and remain behind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When it is time for Mother-Corn to smoke to the gods, animals and birds are
    sent to find offerings; Prairie-chicken kills a speckled wild-cat for the offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mother-Corn says the speckled animal represents the heavens and that its white
    spots represent the stars.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the people lack a pipe, three Stars in the heavens bring a stone to Mother-Corn,
