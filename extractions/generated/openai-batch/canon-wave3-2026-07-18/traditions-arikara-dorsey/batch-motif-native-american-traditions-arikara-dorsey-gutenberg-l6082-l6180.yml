canonical_text:
  quote: ''
  summary: Young-Eagle instructs Yellow-Calf to tell her youngest brother what to
    do when a war-party has been away three days. Young-Eagle then undergoes lake-associated
    transformations, becomes a young Eagle, reaches the war-party, is fed intestines
    and bones, captures ponies, kills enemies, and gives trophies through his brother-in-law.
    The war-party later reports his deeds, scalps and ponies are distributed, his
    family learns of the events, and he repeatedly saves the village. In a later lake
    episode he regains a handsome human likeness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young-Eagle tells the girl to instruct her youngest brother to obtain buffalo
    intestines and bones after the war-party has been out three days, put them in
    the fire, and listen at night for the whistling of a young eagle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl tells her youngest brother Young-Eagle’s instructions; the brother
    doubts they will come true, while the girl tells him Young-Eagle is wonderful.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young man associated with the girl’s household goes on the war-path for
    the first time, and the camp laughs at him and makes fun of him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the war-party has been gone three days, Young-Eagle takes his wife to
    a lake; she swims, and he enters the lake clothed and dives for a long time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At dusk Young-Eagle comes out of the water as the same man Yellow-Calf had
    first met, tells her not to touch him, covers himself with a robe, and then a
    young Eagle flies up from the rattling robe toward the southwest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At night the brother-in-law hears an Eagle’s cry and identifies it as Young-Eagle’s
    arrival, while other warriors mock this claim.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The brother-in-law gives Young-Eagle intestine to eat and bones to gnaw.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Young-Eagle tells his brother-in-law that the enemy are nearby, that he will
    bring all their ponies, and that the brother-in-law should divide the ponies among
    the warriors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The war-party’s scouts do not find an enemy village or ponies, but Young-Eagle
    continues to appear and meet his brother-in-law, while the warriors still doubt
    their relationship.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Young-Eagle drives a drove of ponies toward the war-party on foot and gives
    them to his brother-in-law to divide among the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Young-Eagle returns to the enemy camp, kills enemies, takes scalps, and gives
    the scalps to his brother-in-law, who gives them to the leader of the war-party.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the battle Young-Eagle goes home, and two days later the war-party returns
    singing scalp songs and telling what Young-Eagle has done.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The warriors tell the account in the priests’ lodge; scalps are brought to
    Young-Eagle’s lodge and placed on a long pole outside the entrance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Remaining ponies are given first to Yellow-Calf’s father, who takes only some,
    and Young-Eagle gives the rest to poor people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Reports of Young-Eagle’s deeds reach another village; his father disbelieves
    them because Young-Eagle had not gone on the war-path before, and his family had
    mourned him as dead or lost.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Whenever a war-party attacks the village, Young-Eagle is present to save it,
    and he sometimes follows outgoing war-parties.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Young-Eagle later enters the lake to get his own likeness and emerges wearing
    fine leggings, a fine robe, a mountain-lion quiver, and long hair; Yellow-Calf
    is proud of him.
  category: sequence
  evidence_refs:
  - ev:8
