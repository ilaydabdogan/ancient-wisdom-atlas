canonical_text:
  quote: ''
  summary: A poor young man and a chief's daughter elope and live in a wild place.
    While the husband is away catching eagles, a Bear in human form lures the wife
    away to a den where other women taken from husbands are held. An Elk finds the
    grieving husband, teaches and equips him, and helps recover the wife and the other
    women. The Elk and husband kill the Bear. The husband takes back his wife; the
    Elk takes the other women, who become elk, explaining why female elk run to a
    whistling male elk.
  language: English
  quote_policy: summarized
