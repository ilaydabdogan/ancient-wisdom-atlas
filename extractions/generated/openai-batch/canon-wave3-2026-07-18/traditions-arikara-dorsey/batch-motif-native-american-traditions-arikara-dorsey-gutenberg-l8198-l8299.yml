canonical_text:
  quote: ''
  summary: A first-person Bear Society member recounts learning Bear Society mysteries,
    receiving a stuffed bear skin from his father, and seeing the stuffed bear mirror
    his movements during a Bear dance. After the old bear skin is ritually left in
    a ravine, the narrator goes hunting with a friend. They encounter a Scalped-Man
    wearing a wolf hide at night, hunt deer in rattlesnake country, and later meet
    an adult bear with its young. The friend wounds the bear; the narrator finds it
    dead near a pond, and the story ends by observing that a skinned and stretched
    bear resembles a man.
  language: English
  quote_policy: summarized
