canonical_text:
  quote: ''
  summary: A man believed killed in battle later revives, lives among Coyotes, marries
    a Coyote, is found by his people, ritually cleansed in a medicine-lodge, summons
    his Coyote wife before the community, and later encounters a baby Coyote in a
    snowbank during a blizzard.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war-party left the Arikara country toward the south, was attacked by enemies,
    and one man was reported killed while the others returned home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After many years the man rose from where he was lying; the passage explains
    that he had not really been killed, but had been stunned by falling on hard ground
    and had not been scalped.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The revived man wandered over the prairies, encountered Coyotes, married a
    Coyote, and lived with her for several years.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hunters or warriors saw a mysterious being crossing the Missouri River, surrounded
    him, and caught him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The captured being was not scalped or wounded, but had changed his ways so
    that he could live with the Coyotes and was almost like an animal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people asked him to go home and told him that his wife and children were
    well and that his human wife had not remarried; he answered that he could not
    because he was married.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The people took him, gave him medicines, and he entered the medicine-lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the medicine-lodge he performed sleight-of-hand and vomited hair, white
    clay, and other things; after this he was described as cleansed from being a Coyote.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: He said he would call his wife and that fear of her was the reason he had
    not returned home.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: He shouted from the top of the lodge and toward several directions; after
    he shouted toward the northwest, the people heard Coyotes approaching from far
    away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Coyote whom the man had married entered the lodge, moved around by way
    of the south, west, and north to the northeast of the fireplace, and took her
    place there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The man identified the Coyote woman as his wife, and men in the lodge called
    her names and questioned why she had stayed far away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: A leading medicine-man received a pipe filled with native tobacco and made
    smoke to the Coyote woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: After the smoke, the Coyote woman left the lodge and went to join the other
    Coyotes; the people then knew that the man did have a Coyote woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Many years later, during a blizzard shortly before sunset, the man found one
    of his baby Coyotes lying in a bank of snow, left it there because he was cold,
    and later returned to find that the baby was gone.
  category: sequence
  evidence_refs:
  - ev:7
