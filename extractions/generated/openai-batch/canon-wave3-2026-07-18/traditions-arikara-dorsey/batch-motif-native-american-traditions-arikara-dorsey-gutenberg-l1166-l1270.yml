    powerful people.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-arikara-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 1232-1239
  quote_or_summary: Nesaru makes small wonderful people; when they displease him,
    he warns animals to hide because he will make water rise from the earth. Animals
    council and take most people underground with Badger, Mole, and long-nosed Mouse;
    Fox is runner and errand man.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-arikara-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 1240-1250
  quote_or_summary: The people live underground for many years. Groups of Bears, Badgers,
    Moles, Mice, and Foxes assemble; Bear, Badger, and Mole dig and give out, while
    Mice dig through the earth and return with noses worn sharp.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/traditions-arikara-dorsey.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 1251-1255
  quote_or_summary: Mouse says that from then on his people will have long sharp noses
