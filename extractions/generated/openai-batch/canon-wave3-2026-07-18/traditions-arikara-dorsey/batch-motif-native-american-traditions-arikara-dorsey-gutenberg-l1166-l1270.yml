candidate_motifs:
- id: motif:1
  label: ritual killing and consecration of buffalo for a bundle ceremony
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The buffalo cow is declared holy; selected parts are treated as holy, dried,
    carried to the priest's lodge, and used within a ceremony involving gifts and
    offerings.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The passage uses the language of holiness and offerings, but does not
    explicitly label the buffalo killing as a sacrifice.
- id: motif:2
  label: sacred bundle as carrier of origin memory
  taxonomy_refs:
  - wisdom
  basis: The bundle contains ritual objects and animal figures linked to the people's
    emergence, and the priest tells the origin of the bundle and people during the
    ceremony.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents ritual authority
    and origin knowledge rather than abstract wisdom.
- id: motif:3
  label: divine judgment by destructive heat
  taxonomy_refs:
  - divine_judgment
  basis: Nesaru becomes displeased with the first giant people and sends mighty heat
    that transforms them into stones.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage says heat, not fire; therefore no world-destroying fire taxonomy
    reference is assigned.
- id: motif:4
  label: ancestral people transformed into stones
  taxonomy_refs:
  - divine_judgment
  basis: The first giant people are turned into stones, and stones are said to be
    former powerful people called grandfathers.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is closely tied to the divine judgment episode and is not treated
    as a separate taxonomy family beyond that.
- id: motif:5
  label: rising water and protected survivors underground
  taxonomy_refs:
  - flood_and_renewal
  basis: After the second people displease Nesaru, he warns animals he will make water
    rise from the earth; animals take most of the people under the ground, where they
    live for many years.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage mentions rising water and preservation underground, but does
    not narrate the water's full destruction or a conventional post-flood renewal
    scene in this excerpt.
- id: motif:6
  label: animal-guided emergence from beneath the earth
  taxonomy_refs:
  - ascent
  - culture_hero
  basis: Animal helpers dig upward through the earth and bring or enable the people
    to come out from the ground; Mouse, Mole, Badger, Bear, and Fox have distinct
    roles in the emergence sequence.
  evidence_refs:
  - ev:3
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The culture-hero taxonomy is used cautiously because the helpers are animal
    groups rather than a single named culture hero.
- id: motif:7
  label: etiology of animal traits from emergence actions
  taxonomy_refs: []
  basis: Mouse's long sharp nose is explained by digging through the earth, and Mole's
    underground life is explained by blindness from seeing the sun.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: No supplied taxonomy reference directly matches animal-trait etiology.
