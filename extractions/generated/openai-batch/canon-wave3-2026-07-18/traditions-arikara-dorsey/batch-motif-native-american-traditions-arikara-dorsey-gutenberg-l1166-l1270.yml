canonical_text:
  quote: ''
  summary: A narrated Arikara origin tradition is introduced within a bundle ceremony.
    A buffalo is made holy and its selected parts are dried for a ceremony. In the
    priest's lodge, a sacred bundle is opened, ritual participants dance with implements,
    and offerings are made. The priest recounts that Nesaru first made giants, destroyed
    them with heat by turning them into stones, then made smaller people. When these
    people displeased Nesaru, rising water was foretold, animals hid people underground,
    and later animal helpers dug upward until the people could emerge. Mouse, Mole,
    Badger, Bear, and Fox receive roles and etiological traits in the emergence account.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says that, when he was about thirteen, his people left their
    village to avoid smallpox coming from the east and traveled north and west.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator's father killed a buffalo cow, declared that he had made a buffalo
    holy, and called an old man who was keeper of a bundle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old bundle keeper smoked to gods in the heavens, waved wild sage over
    the buffalo, and directed the cutting out and drying of selected holy parts of
    the buffalo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The holy meat was later carried by the narrator and his father to the priest's
    lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman in charge of the bundle had taken it down and placed it in the west
    of the lodge before the ceremony.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bundle was untied carefully so that it could be tied again in the same
    way, and its contents were spread out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The priest placed four animals said to have brought the people out from the
    earth: bear, badger, mole, and a tiny long-nosed mouse.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bundle also contained birds and two pipes, one black and one with a red
    bowl, white stem, bird feathers, and a white shell.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Four women and four men were invited into the lodge; the women were placed
    according to the four world quarters and given buffalo-shoulder-blade hoes, while
    the men were placed by them and given bows and arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The four old men took gourds, and the four men and four women danced until
    all the songs were sung.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before the origin narrative, presents were given, and the priest made offerings
    of willow sticks to the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The priest says Nesaru made giant people, was displeased with them, and sent
    mighty heat that turned them into stones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The priest says stones are called grandfathers because they were once wonderful
    and powerful people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The priest says Nesaru made small but wonderful people, was displeased with
    them, and warned the animals that water would rise from the earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The animals held a council and decided to take most of the people underground
    with the assistance of Badger, Mole, and long-nosed Mouse, while Fox acted as
    runner and errand man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: After the people had lived underground for many years, groups of Bears, Badgers,
    Moles, Mice, and Foxes assembled and decided to dig upward to inspect the land
    above.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Bears, Badgers, and Moles each dug and gave out, while the little Mice dug
    through the earth and returned with their noses worn sharp.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Mouse says that from then on his people will have long, sharp noses so people
    will know that through long-nosed Mouse they came out from the ground.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: Mole was first to stick his head out and see the bright sun, was blinded,
    and afterward was to remain underground and not see the sun.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: Fox later went through after Badger dug the opening wider, crawled out of
    the ground, shouted like a man, scouted the country, and reported back.
  category: sequence
  evidence_refs:
  - ev:11
