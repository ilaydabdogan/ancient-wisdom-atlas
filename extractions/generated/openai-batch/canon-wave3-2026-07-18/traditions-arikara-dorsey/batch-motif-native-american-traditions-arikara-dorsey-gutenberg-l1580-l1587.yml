canonical_text:
  quote: ''
  summary: Old people say Nesaru made the people, who were bad and destroyed. Nesaru
    made animals to take corn kernels under the ground; those kernels had formerly
    been people and were turned into corn by Nesaru. The people lived under the earth
    for many years, then animals brought them out, and Mother-Corn led them with the
    consent of other gods after being sent by a god in the heavens who had a cornfield.
