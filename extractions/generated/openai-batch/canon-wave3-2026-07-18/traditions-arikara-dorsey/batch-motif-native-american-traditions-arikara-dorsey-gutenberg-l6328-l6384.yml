canonical_text:
  quote: ''
  summary: In the tale titled “The Coyote and the Mice Sun Dance,” Coyote hears hidden
    dancing coming from an elk skull. The Mice, fearing him, let him look inside,
    then flee and leave his head stuck in the skull. Blinded and horned by the skull,
    he approaches a camp across water, frightens the people, and demands the chief’s
    daughter in exchange for sparing them. After a boy identifies him as only Coyote,
    the people break the skull, bind him to pegs, and humiliate him with excrement.
    Coyote tricks an old woman into loosening the pegs, attacks her with a stick,
    escapes, and the ending explains why Coyote defecates easily and runs from people.
  language: English
  quote_policy: summarized
