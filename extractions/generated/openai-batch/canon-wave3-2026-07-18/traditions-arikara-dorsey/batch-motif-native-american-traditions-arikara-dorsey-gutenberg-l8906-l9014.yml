canonical_text:
  quote: ''
  summary: 'This passage contains abstracts of Arikara narratives: an Elk helps a
    man rescue his wife from Bear; a boy receives elk teeth and a flute, dies, returns,
    and relatives transform in a river; a girl uses a buffalo windpipe to create seven
    brothers, while Coyote''s theft produces bumblebees; a buffalo-wife narrative
    explains a javelin game, buffalo-human exchange, and the Buffalo ceremony; a Wolf
    Dance origin story recounts a chief''s son trapped by girls, adopted by wolves,
    ritually restored, avenged, and made chief; a following heading names a Medicine
    Dance of Beaver, Turtle, and Witch-Woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Elk rescue abstract, Bear takes a man's wife while the man is away
    catching eagles; Elk tells the man what happened, teaches him to transform into
    Elk, and provides a whistle that draws women out of Bear's den.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the same abstract, Bear attacks Elk, Elk uses its horns against Bear, the
    man shoots and kills Bear, the man takes back his wife, and other women become
    Elk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the boy-and-Elk abstract, a young man rejected by girls goes near an animal
    skull by a lake, receives elk teeth and a flute from Elk, and uses the flute to
    attract girls.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the flute attracts women, men kill the boy; he is left unburied, later
    goes to his mother's tipi, and relatives who follow him into a river turn into
    animals, while the young man holding the elk teeth and flute survives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Coyote abstract, a girl waves a buffalo windpipe over smoke so that
    dust in it becomes her seven brothers, who summon and kill buffalo before being
    returned to the windpipe as dust.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Coyote steals the windpipe repeatedly; when finally allowed to carry it away
    and display it near a village, he turns it upside down and bumblebees come out
    instead of dust and boys.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the buffalo-wife abstract, a hunter dreams of buffalo becoming game sticks
    and a ring, lies with a buffalo cow, finds a ring, makes sticks, and wins at a
    game with young men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: An old woman attaches herself to the young man's back after he carries her
    across a river; a poor boy uses colored arrows to split her, remove her, heal
    the sore place, and she is burned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The buffalo-wife and child later appear, become buffalo, and lead the man
    to buffalo leaders; he uses eagle feathers, asks the gods to form stone around
    him, is turned into Buffalo, and mediates gifts of eagle feathers and native tobacco
    from the people to the Buffalo.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the exchange, Buffalo are willing to be slaughtered; people kill Buffalo
    four times, the man receives game sticks, lives a long life, and the Buffalo calf
    starts the Buffalo ceremony among the people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Wolf Dance origin abstract, seven girls trap a chief's son in a hole
    and leave him; Wolf and Bear contest him, Wolf reaches him first, and the boy
    lives among Wolves and acts like a wolf.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The wolf-man is trapped by hunters, put into a sweat-lodge, made to vomit,
    and recovers; he later calls Wolves and Bears to surround a tipi, where Wolves
    eat the seven girls, after which he becomes chief and starts the Wolf dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The final line in the passage is a heading naming the Medicine Dance of the
    Beaver, Turtle, and Witch-Woman.
  category: speech
  evidence_refs:
  - ev:7
