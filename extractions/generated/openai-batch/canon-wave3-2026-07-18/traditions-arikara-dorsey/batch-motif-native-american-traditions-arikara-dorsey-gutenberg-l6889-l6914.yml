canonical_text:
  quote: ''
  summary: A girl gathering grapes is found by a Scalped-Man and taken toward his
    den. At a creek she persuades him to swim and wash his head by promising not to
    fear him and to be his wife. While he dives repeatedly, she escapes, hides under
    a grapevine, remains silent when he searches for her, and later returns home to
    report the encounter.
