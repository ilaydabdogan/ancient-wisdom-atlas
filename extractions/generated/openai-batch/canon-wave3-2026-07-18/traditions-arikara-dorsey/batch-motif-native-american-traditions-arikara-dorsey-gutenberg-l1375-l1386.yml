canonical_text:
  quote: ''
  summary: A woman disappears and an ear of corn is found where she sat. The people
    use the corn for blessing and attach ears of corn, sometimes with hides, to bundles
    and walls, especially for those who gave buffalo meat to the bundles. Old men
    later claim that the old woman appeared in dreams and taught songs, buffalo-meat
    sacrifices, and the smoke ceremony.
