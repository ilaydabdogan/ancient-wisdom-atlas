canonical_text:
  quote: ''
  summary: A boy observes fog rising from a lake and a two-headed serpent or monster
    emerging. Thunderbirds attack it with lightning but cannot kill it. The boy kills
    both heads with arrows, after which the Thunderbirds and birds make him chief
    of all birds and give him powers. He roams as Antelope-Carrier, killing bad animals.
    In a following episode, two rawhide-joined village boys shoot a strange white
    moving object, are carried by wind to an eastern island in great waters, quarrel,
    set out westward, and encounter an old woman at an earth-lodge.
  language: English
  quote_policy: summarized
