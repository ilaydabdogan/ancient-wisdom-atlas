canonical_text:
  quote: ''
  summary: A Coyote asks an old Buffalo bull to make him into a buffalo. After repeated
    fear and jumping aside, Coyote finally stands firm when the Buffalo rushes him
    and becomes a Buffalo bull. The two bulls go to a herd, kill a dominant bull,
    and take cows. After the herd leaves him behind, Coyote-Buffalo tries to transform
    another Coyote by rushing at him; the result is two Coyotes, and Coyote-Buffalo
    returns to being Coyote.
  language: English
  quote_policy: summarized
