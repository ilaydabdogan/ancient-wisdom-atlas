- id: obs:1
  text: The narrator identifies White-Bear as his son and says White-Bear has the
    spirit of the Bear.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says he wore a bear robe in the medicine-lodge while his wife
    was pregnant, and attributes his son's Bear spirit to those actions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At birth and while nursing, White-Bear showed froth at the mouth and made
    a noise like a young bear.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator killed a young bear, had its hide tanned, and White-Bear wore
    the bear robe in Bear dances and stayed in the medicine-lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During preparations for a yearly medicine dance, the Arikara brought willow
    and cottonwood branches to build lodges.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: At about three years old, White-Bear went out with a butcher knife, fell on
    it, and suffered a deep belly wound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator saw White-Bear holding his intestines, took him into the tipi,
    and put the intestines back into place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator put medicine on the cut, bandaged it with buffalo hide, and the
    mother nursed the child while relatives mourned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The child nursed like a bear; froth came from his mouth, and the narrator
    put the froth on the cut, after which the child improved.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bear robe was put on the child for several days, and later children were
    brought to play with him while he wore it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: White-Bear grew up acting and having ways like a bear, and sleight-of-hand
    was performed upon him in Bear ceremonies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: White-Bear had visions of a bear in the medicine-lodge, and the narrator encouraged
    him to remain there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: As an adult, White-Bear is described as having a large belly scar and as being
    a Bear by birth, though he no longer shows bear ways because Bear dances have
    ceased.
  category: attribute
