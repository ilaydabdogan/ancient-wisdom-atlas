canonical_text:
  quote: ''
  summary: A narrator explains how his son White-Bear came to be regarded as having
    the spirit of the Bear and belonging to the Bear Society. The account links the
    child's prenatal condition to the father's actions in a medicine-lodge, describes
    bear-like signs at birth, a serious childhood knife wound and ritual treatment,
    the use of a bear robe, later bear-like behavior, visions of a bear, and White-Bear's
    adult scar and identity as a Bear by birth.
  language: English
  quote_policy: summarized
