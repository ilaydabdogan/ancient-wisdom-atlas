canonical_text:
  quote: ''
  summary: A footnoted Arikara tale segment identifies the story as told by Many-Fox.
    An Arikara hunter follows a mysterious Scalped-Man into a concealed Bad Lands
    cave. After the man speaks to him and stays four days and nights, the Scalped-Man
    offers help if the man keeps his cave dwelling secret. The Scalped-Man repeatedly
    obtains ponies and scalps from enemy country for the man, whose village credits
    him with war success. Later, the man brings a war-party near the cave, and the
    Scalped-Man goes ahead as scout and guide, helping them kill enemies and capture
    ponies.
  language: English
  quote_policy: summarized
