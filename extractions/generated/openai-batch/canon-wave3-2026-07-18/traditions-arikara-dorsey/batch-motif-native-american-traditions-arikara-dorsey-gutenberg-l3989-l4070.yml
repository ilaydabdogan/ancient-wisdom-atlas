canonical_text:
  quote: ''
  summary: Pretty-Voice, empowered by an Elk and using prescribed painting and a magical
    whistle or pipe, obtains women and proves invulnerable when village men attack
    him. He later repels Sioux attacks while armed only with his whistle, marries
    a Sioux woman, and reveals to her that missiles treated with incense made from
    elk horn and elk hair can kill him. She returns to her people, prepares the weapons,
    and leads a war-party; Pretty-Voice is pierced, falls, and is mutilated. His mother
    tries to carry out his prior instruction to collect his flesh and place it in
    a stream near timber so she will see him again, but men prevent this and burn
    the body. A pure white fog is then seen rising daily from the place.
  language: English with embedded Latin
  quote_policy: summarized
