canonical_text:
  quote: ''
  summary: An Arikara narrative titled “Two-Wolves, the Prophet” tells how Two-Wolves
    survives a storm, is saved by a Prairie-Chicken, receives from Waruhti the ability
    to understand Thunder, and later uses Thunder’s speech in public ceremonies to
    identify a horse-killer and confront a skeptical old brave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Arikara are camped at Stevenson Flat; during a buffalo chase a severe
    storm scatters the hunters.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: Two-Wolves is left alone overnight in the storm, is thought dead, and is mourned
    by his relatives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:3
  text: A Prairie-Chicken saves Two-Wolves’s life, and Waruhti gives him power to
    understand the speech of Thunder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Afterward, Two-Wolves practices his power and draws men to his lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Two-Bears kills Roving-Coyote’s troublesome horse with a sharp ash stake or
    picket pin.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: In a ceremony with public calls, black clouds and distant Thunder appear,
    and Thunder tells Two-Wolves that Two-Bears killed the horse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wolf-Chief ridicules or doubts Two-Wolves’s ability to understand Thunder.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: During rain and thunder, Two-Wolves hears his father instruct him to summon
