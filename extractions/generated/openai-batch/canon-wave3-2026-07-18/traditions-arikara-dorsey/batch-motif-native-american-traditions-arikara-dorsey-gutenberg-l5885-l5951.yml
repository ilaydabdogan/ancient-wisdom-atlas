canonical_text:
  quote: ''
  summary: A hunter's wife leaves with a fine-looking visitor and is later found beside
    an Elk. The Elk and woman enter a lake, where arrows cannot harm the Elk. The
    lake-bound wife later emerges to advise the husband before war expeditions, giving
    directions that come true. She finally says she can never leave the lake and directs
    him to capture a woman resembling her, who becomes his new wife.
  language: English
