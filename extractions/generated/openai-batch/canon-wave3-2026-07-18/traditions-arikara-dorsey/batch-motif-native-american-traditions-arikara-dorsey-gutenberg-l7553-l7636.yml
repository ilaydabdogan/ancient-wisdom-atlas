canonical_text:
  quote: ''
  summary: 'The passage first reports Sioux visitors identifying a strange man as
    Wichita and saying many tribes had gathered against the Arikara. It then gives
    a first-person account of the Medicine Bear Shield: after the narrator’s father
    dies, the narrator keeps vigil at the grave, dreams of a Bear and later of his
    father, sees lightning form a bear-marked circle and rainbow at the grave, learns
    that Howling-Wolf took the shield from the grave, recovers the frame, and has
    a new shield cover and inner shield made with bear, cedar, pine, lightning, eagle-feather,
    song, and east-facing ritual details.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sioux visitors told the Arikara that a strange man was Wichita and that many
    tribes had gathered to annihilate the Arikara.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator was fourteen winters old when his father died and later went
    alone to the father’s grave, which was covered with a buffalo robe over a pole-and-fork
    structure rather than with dirt.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the grave, the narrator cried, slept, and dreamed of a Bear standing by
    the grave and speaking about a shield that had been removed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator stayed near the grave during a rainstorm, crawled into a crevice
    in a steep bank, and kept watching the grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During lightning flashes near the grave, the narrator saw a Bear with paws
    upward, then a circle with a black center and marks interpreted as bear features,
    with cedar and pine on the ears, followed by a rainbow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In a later dream, the narrator saw his father, who said the shield had been
    on the grave, that Howling-Wolf had taken it, that it belonged to the narrator,
    and that the narrator should make another like the vision.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The narrator’s mother went to Howling-Wolf’s lodge; Howling-Wolf admitted
    taking the shield and discarding the cover, and the shield frame was returned
    to the narrator.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A new shield cover was made on tanned deer skin with a Bear image, Bear ears,
    cedar berries in the left ear, and pine cones in the right ear.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The inner shield was made from the breast hide of a buffalo bull, stretched
    over coals and hot stones so that it shrank and became thick, then cut to size.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Songs were sung during the shield painting; a red downy eagle feather was
    added for the first lightning, the ears were added so the shield would have understanding,
    and the shield was hung in the lodge and before sunrise facing east.
  category: sequence
  evidence_refs:
  - ev:10
