canonical_text:
  quote: ''
  summary: A boy calls for his sister at night. She comes to the tipi, receives the
    girl he had promised her, and later gives her brother a club, medicine, and the
    power of the Whirlwind. She says she will go southwest, remain there, hear the
    people's prayers as the Whirlwind, and comfort rather than destroy them. The young
    man becomes a famous warrior and chief.
  language: English
  quote_policy: summarized
