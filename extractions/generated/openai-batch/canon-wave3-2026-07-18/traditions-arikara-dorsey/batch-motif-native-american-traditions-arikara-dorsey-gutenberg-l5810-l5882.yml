canonical_text:
  quote: "“The woman said that he was a Bear...”"
  summary: A husband follows his wife to her garden and sees her with a painted man
    wearing bear claws. After the man helps her, eats with her, and lies with her,
    the husband later shoots him. The wife says the man was a Bear who had threatened
    to bring his people against the Arikara camp if harmed. Bears later come in large
    numbers, kill many people, spare some who hide in cellars, and do not stop until
    they kill the man who shot the Bear.
  language: English
  quote_policy: quoted
