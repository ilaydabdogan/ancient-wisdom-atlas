canonical_text:
  quote: ''
  summary: A young man in a Missouri River village, mocked for not joining dances
    or war-parties, goes to a graveyard hill to mourn and seek help from the gods.
    During and after a storm, he shelters a Jack-Rabbit from an Eagle. The Rabbit
    rewards him with a war-club, rabbit-skin, and medicine paints, promising to make
    him a great warrior. The young man returns, becomes known as Rabbit-Boy, joins
    a war-party, chooses weapons, aids a poor young warrior, scouts the enemy camp,
    and takes the enemy ponies to hide them in a hollow.
  language: English
  quote_policy: summarized
