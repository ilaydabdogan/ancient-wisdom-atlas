canonical_text:
  quote: ''
  summary: A young man discovers that Buffalo people are killing people as they emerge
    from the ground. A strange man, later revealed to be the bow and arrows themselves,
    gives him weapons and instructions. The young man gathers armed men, attacks and
    scatters the Buffalo, and the Buffalo cease eating people. The rescued people
    settle near the village; a later group travels south around the mountains and
    returns to Dakota to join their brothers.
  language: English
  quote_policy: summarized
