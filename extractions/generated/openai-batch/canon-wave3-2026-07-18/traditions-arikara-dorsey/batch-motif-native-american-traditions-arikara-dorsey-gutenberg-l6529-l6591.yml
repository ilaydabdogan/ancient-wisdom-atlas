canonical_text:
  quote: ''
  summary: A Coyote tricks a Buffalo into a race arranged near a steep bank, causing
    the Buffalo to fall to his death. Coyote butchers the Buffalo and stores the meat
    by a creek. He asks Fox to carry water in a buffalo pouch, but Fox eats the pouches
    and lies about their loss. Coyote punishes Fox with coals; Fox tells other animals,
    who eat all Coyote's meat while he sleeps. The passage ends with a warning not
    to trust friends when one has plenty.
  language: English
  quote_policy: summarized
