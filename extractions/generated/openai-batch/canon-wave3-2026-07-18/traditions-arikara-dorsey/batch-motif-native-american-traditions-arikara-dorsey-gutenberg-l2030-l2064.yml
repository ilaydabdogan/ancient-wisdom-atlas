canonical_text:
  quote: ''
  summary: At sunrise, rattles are laid down and singing stops amid mourning. Buffalo
    gather at the ceremonial lodge while four priests walk toward a tree. A hidden
    young man emerges, and people come out of a hollow tree; he gives men bows and
    arrows and urges them to kill the Buffalo. The Buffalo people flee, carry human
    meat under their arms, and the meat becomes part of their bodies so that they
    become buffalo; a parenthetical note links this to an Arikara food taboo. The
    young man and Buffalo woman take the bundle, the people burn the village, make
    a new camp, and the Buffalo woman, now married to the young man, teaches the bundle’s
    songs and ceremony. These people become part of the Arikara, and the telling of
    the story requires quiet.
  language: English
  quote_policy: summarized
