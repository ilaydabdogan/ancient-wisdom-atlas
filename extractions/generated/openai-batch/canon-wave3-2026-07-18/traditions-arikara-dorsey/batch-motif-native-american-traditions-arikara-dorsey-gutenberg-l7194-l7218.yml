canonical_text:
  quote: ''
  summary: A tradition told by Many-Fox recounts that after an Ojibwa pony theft and
    ensuing battle, an Arikara brave was gravely wounded through the neck. Near death,
    he saw a Jack-Rabbit who told him he would live. He was treated in the Arikara
    village medicine-lodge by a Rabbit medicine-man, recovered quickly, became a leading
    Rabbit-band medicine-man, lived to old age, and later died from a blood-vessel
    rupture in the old wound.
  language: English
  quote_policy: summarized
