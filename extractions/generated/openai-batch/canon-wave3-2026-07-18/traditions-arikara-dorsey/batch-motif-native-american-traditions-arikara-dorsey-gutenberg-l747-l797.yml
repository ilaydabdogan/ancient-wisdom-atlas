canonical_text:
  quote: ''
  summary: Mother-Corn leads the people to a settlement place near the Republican
    River. During ceremonies of smoke offering, Dog arrives, says it and Whirlwind
    were omitted, warns that Whirlwind brings disease, and prescribes dog sacrifice
    so the gods will send a storm to drive disease away. The people agree, the Whirlwind
    stops, and Dog promises to remain as guardian. Nesaru gives Mother-Corn, the chief's
    office, and medicine-men to the people. Mother-Corn instructs them about offerings
    to the four world-quarters and identifies the lodge-front Cedar-Tree with herself
    and the stone beside it with Nesaru.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mother-Corn led the people away through the country to the Republican River
    in Kansas, where there was one mountain and where they were to make a village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nesaru had placed roots and herbs at the settlement place for the medicine-men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Awaho people came last and received ceremonies from Mother-Corn.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: While ceremonies were going on, Mother-Corn had the people offer smoke to
    the different gods in the heavens and to animal gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Dog ran into the village frothing at the mouth, fell down, and called upon
    Mother-Corn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Dog said Mother-Corn had left it behind and had remembered the gods and
    animals without remembering the Dog.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Dog said that Whirlwind had also been left out, was angry, and was coming
    to scatter the people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Dog said it came from the Sun and that the Sun had given it curative powers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Dog said Whirlwind was a disease and that wherever the wind touched the
    people, disease would be left.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:10
  text: The Dog said that if the people killed a dog and offered dog meat first as
    a sacrifice to the gods in the heavens, the gods would send a storm to drive disease
    away from the villages.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:11
  text: As Whirlwind came, the people promised that Dog would be the first meat in
    ceremonial offerings and food when there was disease in the villages.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: After the people's promise, Whirlwind stopped blowing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: The Dog appeased the gods and said it would always remain with the people
    as guardian for their belongings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:14
  text: 'Nesaru gave three things to the people: Mother-Corn, the office of chief,
    and the medicine-men.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: Mother-Corn said the gods in the heavens are the four world-quarters and that
    they become angry and send storms if smoke is not given to them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:16
  text: Mother-Corn said smoke should be given to her last.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:17
  text: Mother-Corn said the Cedar-Tree standing in front of the lodge would be herself,
    reminding the people that she gave them life and brought them from the east.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:18
  text: Mother-Corn said the stone at the right of the Cedar-Tree is the man who gave
    order and established the office of chief, identified as Nesaru, who watches over
    the people.
  category: speech
  evidence_refs:
  - ev:4
