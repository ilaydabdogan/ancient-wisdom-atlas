canonical_text:
  quote: ''
  summary: Old-Woman’s-Grandson and the Snakes exchange tales in a den. The Snake
    chief recounts the boy’s celestial origin, adoption, powers, and earlier exploits.
    The boy then tells a story in which winds from four directions put the Snakes
    to sleep. He cuts off the sleeping Snakes’ heads, but one escapes and becomes
    his continuing enemy, forcing him to avoid springs and guard himself with arrows
    while sleeping.
  language: English
  quote_policy: summarized
