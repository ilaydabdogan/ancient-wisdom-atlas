  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The husband finds his wife and child hanging near the earth and tells a stone
    to spare the boy but kill the mother; the stone strikes her, cuts the rope, and
    her body falls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy remains by his mother's body and feeds at her breast for a time until
    her body begins to decay.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old woman who owns a cornfield notices the boy's footprints and uses a
