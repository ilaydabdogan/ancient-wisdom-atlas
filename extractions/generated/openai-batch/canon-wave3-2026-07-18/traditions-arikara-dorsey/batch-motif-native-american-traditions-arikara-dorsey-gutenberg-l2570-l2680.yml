  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old woman takes the boy home, feeds him corn mush, succotash, and squash,
    and he later hunts birds, deer, and antelope for her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy looks behind a curtain where food is placed and sees a huge serpent
    with large yellow eyes; he shoots it with arrows until it dies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The old woman covers the dead serpent and places it in a pool; the passage
