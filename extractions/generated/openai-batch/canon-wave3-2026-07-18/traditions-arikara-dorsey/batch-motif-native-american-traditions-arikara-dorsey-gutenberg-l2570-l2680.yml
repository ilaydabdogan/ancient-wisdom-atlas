  text: An old woman advises the woman to collect sinew from the game her husband
    brings, and the old woman makes thread or rope from it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old Spider-Woman fixes a sinew rope around the woman and lowers her with her
