canonical_text:
  quote: ''
  summary: A young woman wishes a bright star were her husband and is taken to the
    heavens to live with him. After disobeying his order not to dig a certain Indian
    turnip, she sees the earth below and seeks help returning. Old Spider-Woman lowers
    her and her child by a sinew-and-cobweb rope, but the rope is too short. The star
    husband discovers them and sends a stone that kills the mother while sparing the
    boy. The boy survives, is found and raised by an old woman in a field, kills a
    hidden serpent that is the old woman's husband, and later captures a dangerous
    bear despite the old woman's prohibition.
  language: English
  quote_policy: summarized
