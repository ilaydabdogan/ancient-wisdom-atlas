canonical_text:
  quote: ''
  summary: A boy falls asleep despite protective arrows, and a Snake enters his mouth
    and skull, leaving him apparently dead and skeletal. His father uses storm water
    and the Sun’s heat to force the Snake out; the boy rises, subdues the Snake, and
    obtains its promise to trouble people only rarely, explaining occasional snakebites.
    The boy then frees his grandmother, goes to the village, is recognized as the
    son of the girl connected with the cottonwood tree, clears wild animals from the
    country, and dies. The passage ends by identifying present landscape features
    with earlier events in the story.
  language: English
  quote_policy: summarized
