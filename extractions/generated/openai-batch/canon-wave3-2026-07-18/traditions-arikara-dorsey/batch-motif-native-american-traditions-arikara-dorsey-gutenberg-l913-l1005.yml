canonical_text:
  quote: ''
  summary: Mother-Corn sends the Prairie-chicken with a pipe and native tobacco to
    directional gods and to Nesaru; the gods receive and smoke. The Prairie-chicken’s
    difficult journeys explain its white-spotted feathers and establish a rule that
    offerers must personally undergo the smoke ceremony. Nesaru’s smoking signals
    consent for people to live on earth and for gods to protect them. A Dog warns
    that the Whirlwind has been slighted and is coming in anger. A woman becomes a
    Cedar-Tree, and a Rock/Big-Black-Meteoric-Star assists; people who stay with them
    remain Arikara, while others are scattered and their languages changed. Mother-Corn
    produces colored waters and matching ears of corn. The Whirlwind explains the
    origin of sickness and death and asks for smoke near the end of offerings. The
    Cedar-Tree, Big-Black-Meteoric-Star, and Dog each establish ongoing ritual or
    protective roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mother-Corn fills a pipe with native tobacco and sends the Prairie-chicken
    to carry it to the gods in the Southeast, Southwest, Northwest, and Northeast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each of the four directional gods receives the pipe and smokes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Prairie-chicken carries the pipe to Nesaru in the heavens; Nesaru receives
    and smokes, and other animal gods smoke with Nesaru.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Prairie-chicken reports hard winds and striking stones during its journeys;
    the stones make white spots on its feathers, and Mother-Corn permits it to remain
    that way.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mother-Corn states that people making sacrifice to the gods must personally
    go through the smoke ceremony so the gods receive the smoke offering from the
    offerer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the smoking, Nesaru lets the gods know that he has consented to Mother-Corn
    having people on earth and that the gods are to give the people power and protection.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Dog runs into camp and tells Mother-Corn that the Whirlwind has been slighted
    in the smoke ceremony, is angry, and is coming.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mother-Corn asks Nesaru and the gods for help because the Whirlwind is coming
    to destroy her people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman volunteers to save the people and is turned into a Cedar-Tree; a Rock
    falls by the Cedar-Tree, and a voice identifies itself as the Big-Black-Meteoric-Star
    who will assist.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The people run to the Cedar-Tree and around the Rock; some flee in four directions,
    and when the Whirlwind strikes those fleeing people, it changes their language.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The people who stand upon the Cedar-Tree and the Rock remain as the Arikara.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the Whirlwind strikes Mother-Corn, she vomits red, yellow, black, and
    white water, each followed by a matching colored ear of corn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Whirlwind says it was angry because Mother-Corn slighted it in the smoke,
    and that it has left diseases so people will become sick and die.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Whirlwind tells Mother-Corn to remember to give it smoke toward the last
    so that it will not visit the people very often.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Cedar-Tree says the Whirlwind twisted its body, asks to remain bent, and
    asks to be known as the Wonderful Grandmother and placed before the medicine-lodge.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The Big-Black-Meteoric-Star asks to be known as the Wonderful Grandfather
    and to sit by the Wonderful Grandmother before the medicine-lodge as a reminder
    that it saved the people from the Whirlwind.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The Dog says it brought the news, will remain with the people, guard camps
    and villages, and bark when enemies approach.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:18
  text: The Dog says its spirit is up to all the gods, its flesh is good to eat, its
    grease is curative for sores, and people should kill it in ceremonies and offer
    its flesh to the heavenly gods.
  category: speech
  evidence_refs:
  - ev:13
