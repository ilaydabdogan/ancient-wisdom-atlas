canonical_text:
  quote: ''
  summary: A second Arikara war party camps near a lake where an earlier Arikara war
    party had been killed and scalped. A poor young man fetching water encounters
    the speaking, mutilated corpse of the earlier leader, carries him to camp as proof,
    and receives a promise of success in revenge. The party kills enemies until their
    number equals the slain men in the lake, returns home, and the chiefs make the
    poor young man a brave.
  language: English
  quote_policy: summarized
