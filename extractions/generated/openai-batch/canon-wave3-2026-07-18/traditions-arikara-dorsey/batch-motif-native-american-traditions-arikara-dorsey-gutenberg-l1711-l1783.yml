canonical_text:
  quote: ''
  summary: An Arikara tradition tells how people emerged from the ground under the
    leadership of a woman called Mother, fled a horned lake monster named Cut-Nose
    and pursuing buffalo, and escaped through canyons, timber, deep water, and another
    canyon with help from animal beings. The passage ends with Mother giving bundle
    ceremonies, especially to the Awaho or Left-Behind people, who claim the right
    to take meat offerings left for the gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people came out through the ground, were led by a woman known as Mother,
    and had many kinds of animals among them except buffalo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A horned monster came out of a large lake, looked like a buffalo, and was
    called Cut-Nose.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Buffalo seemed to come out from under Cut-Nose, caught up with the people,
    and killed some of them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people made canyons behind them so the buffalo could not cross, allowing
    an escape at that point.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Whirlwind came, the people prayed to Mother, and she told them to give
    presents and smoke to Whirlwind; Whirlwind scattered some people over the country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a thick timber, Owl and Badger failed to make a path, while Coyote and
    Dog opened a way through it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At deep water, Dogs failed to make a pathway, while Loons made an opening
    through the water so the people could pass.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At a canyon, Mother called helpers; Kingfisher and Mole failed, while Badger
    dug so the banks fell and a pathway formed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After crossing the canyon, the people made their village by that canyon.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mother held ceremonies for the different bundles, and the Awaho bundle people
    were last to receive all the ceremonies from her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Awaho were called Left-Behind and claimed protection of the gods and the
