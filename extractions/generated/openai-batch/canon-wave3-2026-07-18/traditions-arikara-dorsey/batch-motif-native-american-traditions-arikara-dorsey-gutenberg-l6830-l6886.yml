canonical_text:
  quote: ''
  summary: A Coyote proposes a sleep wager to Rabbit beside a large fire and loses
    when Rabbit sleeps with his eyes open. Afterward Coyote soils a robe, repeatedly
    gives and takes it from a Stone, and the Stone angrily pursues him. Coyote deceives
    Bull-Bats into breaking the Stone, then eats their young; the Bull-Bats discover
    this and kill him. The passage ends with an etiological comment that Coyote’s
    mischief explains why dead coyotes are often found on the prairies.
  language: English with a Latin section
  quote_policy: summarized
