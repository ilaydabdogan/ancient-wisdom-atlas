canonical_text:
  quote: ''
  summary: A story attributed to Yellow-Bear tells of two Arikara boys or young men
    who repeatedly receive food, directions, and later omens from an old woman identified
    as their grandmother/helper. She first appears near the Missouri River, later
    in a Bad Lands cliff, and finally at lakes. Her singing and dancing at the lake
    signal success in war; her mourning signals defeat. People later give her blankets,
    tobacco, and other things.
  language: English
  quote_policy: summarized
