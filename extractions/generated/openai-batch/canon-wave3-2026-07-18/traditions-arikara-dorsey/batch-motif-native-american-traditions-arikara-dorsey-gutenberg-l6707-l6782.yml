canonical_text:
  quote: ''
  summary: A tale titled “The Coyote and the Rolling Stone” tells how Coyote, hungry,
    encounters Jack-Rabbits dancing around a fire and producing buffalo intestines
    from red willows. He gives his eagle war-bonnet to learn the procedure, then tricks
    the Rabbits into returning it and escapes. When he later imitates the procedure
    alone, it works only briefly and fails on the fourth attempt. A final Latin passage
    describes a scatological episode in which Coyote thinks he is emitting and trapping
    rabbits but finds only excrement and calls himself foolish.
  language: English with Latin passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote is hungry, hears dancing, and finds men identified as Jack-Rabbits
    dancing around a fire and eating intestines taken from the fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Rabbit men initially refuse to explain the source of the intestines, then
    their leader offers to teach Coyote how the big intestines are made if he pays
    a good price.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote offers his eagle war-bonnet as payment for the secret of making the
    intestines.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Rabbits direct Coyote to bring red willows; they throw the willows into
    the fire, sing, and dance, and the burning willows turn into large buffalo intestines.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote eats the roasted intestines, asks for the procedure to be repeated,
    and then eats all of the second batch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After learning the procedure, Coyote asks to put on the war-bonnet to show
    how it is worn; the Rabbit leader calls him tricky, but allows it, and Coyote
    jumps away wearing it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Rabbits pursue Coyote unsuccessfully and tell him he will not be able
    to perform the trick four times.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Coyote later tries the red-willow fire procedure alone; it succeeds at first,
    succeeds again, begins to fail on the third attempt, and on the fourth attempt
    the willows burn to ashes instead of becoming intestines.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the food-making procedure fails, Coyote cries because he expects to
    go hungry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Latin passage, Coyote has a stomach ache, defecates, sees rabbits appearing,
