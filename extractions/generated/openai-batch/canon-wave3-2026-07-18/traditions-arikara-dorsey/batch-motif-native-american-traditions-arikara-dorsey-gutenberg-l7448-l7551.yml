candidate_motifs:
- id: motif:1
  label: Sacred medicine-robe saves the village in battle
  taxonomy_refs: []
  basis: The robe keeper performs with the holy robe, smoke, gourd rattle, and eagle
    wing; the attacking enemy are overcome, flee, and the village is saved.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents the robe's power within this specific Arikara account;
    no broader comparative equivalence is asserted here.
- id: motif:2
  label: Prophetic captive's warning is followed by the predicted attack
  taxonomy_refs: []
  basis: The captive warns that a southern tribe will attack next month, and about
    a month later a large Sioux force approaches the village.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage reports the warning and later attack but does not explain
    the captive's source of knowledge.
- id: motif:3
  label: Executed dangerous man returns or appears during ceremony
  taxonomy_refs:
  - resurrection
  basis: After the captive is stabbed and his body dries, he comes into the lodge
    during a medicine-men's ceremony and is then found as a dead man lying on a buffalo
    robe.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The text still calls him a dead man when the keeper finds him, so this
    is not a clear full restoration to life.
- id: motif:4
  label: Intruder seeking a woman is exposed by domestic trap and firelight
  taxonomy_refs: []
  basis: The enemy says he came to capture a woman; the husband hides, catches him,
    and the wife creates a blaze and raises the alarm.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not develop this into a separate abduction narrative
    after the capture.
- id: motif:5
  label: Ritual containment of dangerous dead through robe, river, and smoke
  taxonomy_refs: []
  basis: The keeper wraps the dead man in the wonderful robe, throws him into the
    river with a spoken statement about his bones, and smoke is burned before ceremonies
    resume.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives actions but does not explicitly state a doctrine of
    purification or containment.
comparison_claims:
- id: claim:1
  claim: The passage explicitly reports intertribal transmission of scalp-dance forms,
    saying that some women's scalp dances were learned from the Cheyenne, the Grosventre,
    and the Pawnee.
  claim_level: historical_contact
  target: Cheyenne, Grosventre, and Pawnee scalp-dance traditions
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: Only the dances are said to be learned from these groups; the passage
    does not claim that the main medicine-robe narrative is borrowed from them.
- id: claim:2
  claim: The passage supports a limited same-function comparison among Arikara and
    learned Cheyenne, Grosventre, and Pawnee scalp dances as victory or rejoicing
    dances after scalps are brought in.
  claim_level: same_function
  target: Arikara, Cheyenne, Grosventre, and Pawnee scalp dances
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: No choreography, song texts, or ritual details are given for comparing
    the dances beyond their named origin and use in rejoicing.
