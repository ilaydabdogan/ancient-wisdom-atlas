canonical_text:
  quote: ''
  summary: A frame narrator reports an old account about an Arikara village where
    an enemy intruder is captured after a young woman detects him. The captive, marked
    with medicine objects, warns of an attack, is executed, and later appears during
    a ceremony. The keeper of a holy robe removes him to the river. When a large Sioux
    or southern enemy force comes, the robe keeper performs with the robe, smoke,
    a gourd rattle, and an eagle wing; the enemy are overcome and the village is saved.
    Rejoicing and scalp dances follow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war-party reaches an old village site with four large mounds where bundle
    lodges had stood, and an elder says the Arikara formerly lived there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During medicine ceremonies, most people are away from one lodge except a newly
    married young woman who keeps the fire and fastens the entrance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young woman sees an enemy peeping through the top opening and later digging
    into the side of the lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young woman pours water over the fire so it goes out and later tells her
    husband about the enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband first accuses his wife of having a lover, then hides in the lodge
    after placing dry willows and grass by the entrance.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: When the enemy enters the lodge, the husband seizes him from behind, the wife
    makes a blaze from grass and willow limbs, and she calls the men to the lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The captive has long hair, a painted face, bunches of medicine on his head,
    a rattlesnake skin on his right arm, and a turtle shell on his left arm.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The captive says by signs and speech that the people will be killed next month
    by a southern tribe and that he came to capture a woman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The captive is taken to the Awaho-bundle lodge, later tied on a scaffold of
    four ash timbers with buffalo strings, repeatedly loosens or breaks the bindings,
    and is then stabbed by an old priest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the captive's body dries, he comes into the lodge during a medicine-men's
    ceremony, and the medicine-men run out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The keeper of the wonderful robe wraps the dead man in the robe, carries him
    to the river, throws him into the river, and says his bones shall stay there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sweetgrass and wild sage are burned in the lodge after the dead man is removed,
    and the medicine-men resume their performances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: About a month later, a large Sioux force is seen coming from over the hills
    toward the village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The keeper of the holy robe makes medicine-smoke, wraps the robe around his
    body with the hair side out, holds an eagle wing and a gourd rattle, and climbs
    onto his lodge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The robe's inside is described as having the sun, moon, and stars upon it.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: When the robe keeper shakes himself and the robe toward the sun, some enemies
    fall from their horses bleeding from their lungs and seeming out of their heads;
