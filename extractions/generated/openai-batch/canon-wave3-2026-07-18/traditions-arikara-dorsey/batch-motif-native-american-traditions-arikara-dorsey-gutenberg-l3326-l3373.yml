canonical_text:
  quote: ''
  summary: A tale titled “The Two Boys and the Water-Serpent” recounts that two boys,
    repeatedly accused of eating food from village lodges, keep watch at night and
    discover a long black water-serpent entering lodges through smoke holes to take
    prepared food. The boys make arrows, shoot the serpent on the following night,
    and the wounded water-monster returns to the river; the waters roar and rise while
    it dies, then fall silent, and its body is found on a small peninsula.
  language: English
