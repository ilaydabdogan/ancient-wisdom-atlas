canonical_text:
  quote: ''
  summary: 'The introduction classifies Arikara tales 43-82: miscellaneous tales involving
    contests with animals, animal marriage, pursuit, transformation, and a whirlwind
    girl; animal tales centered on Coyote as trickster; traditions involving strange
    beliefs; and traditions or war tales including a medicine war shield and a Bear
    society member''s experience.'
  language: English
  quote_policy: summarized
