canonical_text:
  quote: ''
  summary: A war-party account describes taking a Sioux woman's scalp near a water
    source, returning with it, arranging pieces of scalp fat in a directional pattern
    to indicate an offering to the gods, and later burning the scalp in a priest-led
    ceremony involving fire-sticks, smoke, holy bundles, medicine bags, ritual recitation,
    and name changes given after presents to priests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The source note identifies the account as told by Hawk, and the title identifies
    the subject as a Sioux woman's scalp being sacrificed.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A group of five or six people on the war-path hid near the Pine Ridge Agency,
    close to the place where Sioux people obtained water, and two women came to the
    spring for water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The group ran toward the women; one young man caught one woman, grabbed her
    hair, used a knife, and removed a scalp from the right side of her head before
    she ran into camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The group returned to its leader, gave him the scalp, hurried home, traveled
    through two day-and-night periods, and rested in thick timber.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the rest, the leader removed fat from the scalp, cut it into five pieces,
    faced east, placed four pieces at the corners of his palm and one in the center,
    then placed the pieces on the ground in a similar directional arrangement.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the ground placement showed that the scalp was to
    be offered to the gods.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The scalp was given to a high priest, a scalp ceremony was held, fire-sticks
    were used to make a fire, and the scalp was burned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the burning, people passed holy bundles and medicine bags over the smoke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A priest stood west of the burning scalp, recited a ritual, and called on
    the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Young men and children who wanted their names changed gave presents to priests,
    and the priests changed their names.
  category: action
  evidence_refs:
  - ev:7
