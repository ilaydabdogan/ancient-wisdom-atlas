canonical_text:
  quote: ''
  summary: Coyote repeatedly tries to steal a windpipe that contains the girl's brothers
    and other young men. The girl knows his plan and has her brothers return him after
    early attempts, then lets him carry it away. When Coyote tries to use the windpipe
    before village young men, bumblebees emerge instead of boys, sting him, and then
    remain in a hollow tree while Coyote goes off as a coyote.
  language: English
  quote_policy: summarized
