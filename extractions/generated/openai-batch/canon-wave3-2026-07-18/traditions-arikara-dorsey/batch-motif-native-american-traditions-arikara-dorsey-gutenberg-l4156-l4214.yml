canonical_text:
  quote: ''
  summary: A handsome Arikara young man, disliked by women, goes to a lake and cries
    by an animal skull. An Elk appears, says the skull is its own, and gives him teeth
    and a flute that will draw young women. The youth uses them successfully, but
    men kill him. After lying unburied for several days, he returns to his mother,
    smokes tobacco, and later asks his kin to follow him away. They enter water, disappear,
    and become water animals. The young man with the flute and elk teeth does not
    go and remains the only one who lived.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A handsome young man in an Arikara village tries to marry, but the girls dislike
    him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man goes to a hilly country with a lake, places himself by an animal
    skull on the west side of the lake, and cries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Elk comes after the sound of a flute, identifies the skull as its own,
    gives the young man teeth from the skull and a flute, and instructs him to wear
    the teeth and blow the flute to draw young girls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the young man blows the flute, young girls and women come to him, and
    he marries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men dislike the women coming to the young man, gather with bows and arrows,
    close in on him while he is blowing the flute, and kill him.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: One of the boy's relatives takes the teeth from his neck and ears and also
    takes the flute; the relatives leave the body where he was killed because they
    are afraid to bury him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After several days, the boy comes to his mother's tipi, says he has returned,
    is seen by her after she makes a fire, asks for tobacco from the Young-Dogs society,
    smokes it, and says the smoke is good.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men in the village fear the returned boy may take revenge and some go to see
    whether he is home and alive.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy summons his nearest kin, says his heart is poor because the people
    killed him, says he does not want to live there, and asks whether they will go
    with him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Men, women, and children follow the boy toward the river, enter the water,
    disappear, and become some kind of animal living in the water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young man who has the flute and elk teeth does not go and is the only
    one who lived.
  category: sequence
  evidence_refs:
  - ev:9
