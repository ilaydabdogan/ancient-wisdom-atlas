canonical_text:
  quote: his legs had already turned to stone
  summary: A respected old medicine-man with a sacred bundle expects dried meat from
    returning buffalo hunters so he can give thanks and offer sacrifice to the gods.
    Almost no one provides it; after refusing a sacred pipe and saying it is too late,
    he remains seated on a hill, turns into stone, and is mourned by the people.
  language: English
  quote_policy: quoted
