canonical_text:
  quote: The Arikara and Sioux both tell this story.
  summary: 'A winter war narrative near Fort Berthold: Strike-Enemy is attacked by
    many Sioux and reaches the fort, which the Sioux surround. An unnamed hunter returning
    with an antelope flees through the snow, is tracked, kills and mutilates a Sioux
    pursuer, behaves in a bear-like way that frightens the Sioux, seizes and mostly
    returns their ponies, then dies frozen in a blizzard with arrows in his back.
    The passage says both Arikara and Sioux tell the story.'
  language: English
  quote_policy: quoted
