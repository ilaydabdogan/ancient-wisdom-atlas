canonical_text:
  quote: ''
  summary: In an Arikara story told by Yellow-Bear, a young man remains behind after
    the village leaves for a hunt. A crying woman asks him to recover her children
    from a nest hidden in a sacred white buffalo robe and promises that her people
    will give him power. He retrieves the nest, returns it, and discovers that the
    woman is a Mouse. Mice and Rats gather in human form at night, and a Rat-Man priest
    gives him a war-club, medicine, markings, and the power to turn into a mouse and
    disappear from enemies. The woman calls him her son and says mice are now his
    relatives and must not be killed by his household.
  language: English
  quote_policy: summarized
