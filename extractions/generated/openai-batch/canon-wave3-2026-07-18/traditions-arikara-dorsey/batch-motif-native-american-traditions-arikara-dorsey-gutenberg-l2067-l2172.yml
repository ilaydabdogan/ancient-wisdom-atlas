canonical_text:
  quote: ''
  summary: A girl in a Missouri River village says she would marry a bright red star.
    A porcupine leads her up a growing cottonwood tree into another world, where it
    becomes a man and identifies itself as the Star. Years later, after bearing a
    star-marked son, she discovers her people below, receives help from an old woman
    in a cliff cave, obtains buffalo sinews for a long string, and attempts to descend
    with her child; the excerpt ends while she hangs above the ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The setting is a village on the Missouri River where two girls sleep outside
    their lodge on an arbor and discuss young men in the tribe.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: One girl says she does not like any young man in the tribe, sees a bright
    red star toward the east, and says she would marry that star if it were on earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The next morning the girls go after water, see a porcupine, and pursue it
    because one wants porcupine quills for her work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The porcupine reaches a cottonwood tree near the river; the girl who liked
    the star climbs after it while the other girl suggests getting an axe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: As the girl climbs, the tree grows higher; she disappears from the girl below
    and reaches another world, described as a strange country.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The porcupine turns into a man and says he is the Star she saw, that he went
    down after her, and that he turned himself into a porcupine so she would come
    after him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The girl stays with the Star man and likes him, but he goes away every night
    and she cries because she wants to return to her people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Many years later the girl gives birth to a male child, and she finds the picture
    of a star on his forehead.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Star husband permits her to dig wild turnips but tells her not to dig
    in valleys; she digs in a valley, her digging-stick runs through the earth, and
    she sees people underneath.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: An old woman calls to the crying girl, takes her to a cave in the side of
    a cliff, and says she will help by making a sinew string that will reach the ground
    below.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The girl asks her husband for buffalo sinew; he kills a buffalo and brings
    sinews, but forgets the two sinews in the shoulder-blade.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The old woman makes a long sinew string, and the girl also makes a separate
    long sinew string of her own.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The old woman and girl dig a hole in the valley; the girl carries her boy
    on her back, ties herself to the sinew string fixed to a stick or pole, descends,
    adds her own string, and remains hanging at the height of the highest tree.
  category: sequence
  evidence_refs:
  - ev:10
