canonical_text:
  quote: ''
  summary: A Buffalo leader, seated on a high hill with a Buffalo skull before him,
    summons a Buffalo man and gives him sticks and a ring for play. The leader explains
    that the sticks and ring represent peoples, Buffalo, enemies, and conquest, and
    foretells jealousy over hunting-ground and war. The sticks are kept in the priests’
    lodge and displayed during bundle ceremonies. Two sets of people fight, the ring-catchers
    are conquerors, the man lives a long life, and a Buffalo calf begins the Buffalo
    ceremony among the people.
  language: English
  quote_policy: summarized
