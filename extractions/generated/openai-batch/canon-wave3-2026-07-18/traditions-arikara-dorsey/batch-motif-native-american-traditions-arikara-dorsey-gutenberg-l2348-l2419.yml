canonical_text:
  quote: ''
  summary: The boy returns from the tree and tells his grandmother that wonderful
    men tried to kill him with a fœtus and that he promised them his grandmother if
    they removed it. The grandmother accepts but requires compensation for the boy;
    he is directed to choose the middle bow and arrows among five, which he does to
    the men's regret. She then gives him a flute; he plays around the men's lodge,
    frightening them into closing it with earth, and they eventually die of hunger.
    The grandmother then plans to send the boy to dangerous places so he will be killed.
    After being told not to go to a dangerous hill, he enters a den of Snakes, sits
    on a rock, is offered a roasted Snake disguised as gut, recognizes and destroys
    it, and the Snakes' underground attack is blocked by the rock.
  language: English, with one Latin sentence
  quote_policy: summarized
