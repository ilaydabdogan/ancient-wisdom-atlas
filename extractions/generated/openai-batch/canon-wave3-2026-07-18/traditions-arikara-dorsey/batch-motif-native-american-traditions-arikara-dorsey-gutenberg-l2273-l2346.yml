canonical_text:
  quote: ''
  summary: A boy discovers and kills a serpent hidden behind his grandmother's buffalo
    curtain; the serpent slips into a pond and the water becomes a lake. The grandmother
    secretly mourns the serpent as her husband and the boy's grandfather, and then
    repeatedly sends the boy toward dangerous beings. The boy controls a mountain-lion
    and a cinnamon bear by command. Later he goes to the southwest country, meets
    four wonderful men killing buffalo, is trapped in a tree by an unborn calf/fetus
    placed in the branches, and promises his grandmother to the men in exchange for
    release.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy hunts daily after obtaining a good bow and arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman places mush behind a buffalo curtain; the boy investigates because
    the bowl is later empty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Behind the curtain the boy sees a serpent with large eyes and says it has
    been eating his grandmother's mush.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy shoots the serpent in the head and kills it; the serpent makes a great
    noise, falls back, slips into a pond, and the water spreads into a lake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman outwardly approves the serpent's death, but secretly becomes
    angry, recognizes the boy's supernatural powers, plans to have him killed, mourns
    the serpent as her husband, and says the boy has killed his grandfather.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After being warned not to go to a dangerous place, the boy goes there, commands
    an attacking mountain-lion to stop, leads it to the old woman's lodge, and the
    old woman sends it away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After being warned not to go to a dangerous mountainous place, the boy goes
    there, commands an attacking cinnamon bear to stand still, leads it by the ear
    to the lodge, and the old woman sends it away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old woman warns the boy not to go into the southwest country because four
    wonderful men are there; he goes and sees the men killing buffalo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The four wonderful men recognize the boy as Old-Woman's-Grandson and call
    him wonderful.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: While the men skin a buffalo cow, they remove a calf from inside it; the youngest
    man offers the calf to the boy, and the boy is frightened.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young man tries to bring the calf near the boy; the boy flees up a tree,
    and the calf is placed in the fork of the tree so the boy cannot descend.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the boy stays in the tree many days and nearly starves, one of the men
    offers to remove the calf/fetus if the boy promises his grandmother to them; the
    boy promises, and the man removes it.
  category: sequence
  evidence_refs:
  - ev:7
