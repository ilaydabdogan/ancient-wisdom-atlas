  quote: "“Oh! I like that whistling; I must go and find out what it is.”"
  summary: A story titled “The Girl and the Elk,” told by Many-Fox, describes an Arikara
    hunting camp on the Missouri River. An Elk’s whistling repeatedly compels a young
    woman to try to go to it, causing restraint by the people and jealousy from her
    husband. The Elk cannot be killed by ordinary shooting, but a man uses a medicine-loaded
    cartridge to kill it. Afterward the girl is treated with medicine and repeated
    sweat-lodge use until the spell ends.
