canonical_text:
  quote: ''
  summary: The passage gives the beginning of an Arikara narrative titled “The Origin
    of the Wolf Dance.” A chief’s son who refuses marriage is trapped in a covered
    pit by seven rejected girls and abandoned. A gray Wolf and a Bear contest over
    him; the Wolf reaches him first through digging, while the Bear later pledges
    help. The Wolf takes the young man among Wolves, where he becomes wolf-like in
    behavior and movement. Villagers later see him with wolves during a buffalo hunt
    but cannot catch him.
  language: English with embedded Latin
  quote_policy: summarized
