canonical_text:
  quote: ''
  summary: Two-Wolves leads a war-party that is delayed by rain. He foretells nearby
    enemies, forbids the killing of birds, and is later displeased when a man shoots
    an eagle despite the prohibition. Strike-Enemy sacrifices a buffalo to his sacred
    bundle. After another warning about a party of seven and the enemies' escape,
    Two-Wolves ends the expedition and the party returns home. The passage closes
    by describing Two-Wolves' later good works, thief-discovering, prophecies, sickness,
    and death.
  language: English
  quote_policy: summarized
