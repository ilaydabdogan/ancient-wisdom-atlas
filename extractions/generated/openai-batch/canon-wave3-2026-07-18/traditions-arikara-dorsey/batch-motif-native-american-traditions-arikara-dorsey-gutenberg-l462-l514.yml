canonical_text:
  quote: ''
  summary: Wolf and Lucky-Man meet by a large lake, compete to endure rain, and then
    cooperate in making land. Duck dives to the lake bottom for mud. Wolf uses mud
    to create northern prairie land with buffalo; Lucky-Man uses mud to create southern
    hills and mountains with buffalo and says future people will prefer that side
    for shelter. The channel between the two created countries becomes the Missouri
    River bed, and the Missouri begins to flow there.
  language: English
  quote_policy: summarized
