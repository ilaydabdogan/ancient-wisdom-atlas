canonical_text:
  quote: ''
  summary: A tale note names White-Bear as teller. A girl living in a timber lodge
    has sacred bundles and abundant buffalo meat. Coyote lives with her as a helper.
    When fresh meat is needed, she tells Coyote to cover his head and not watch. She
    uses coals, sweet grass, smoke, and a buffalo windpipe from a sacred bundle; dust
    from the windpipe becomes seven young men, her brothers. After she calls toward
    directions from the lodge, buffalo come and the brothers hunt them. The brothers
    then pass their bows through smoke and disappear; the girl gathers dust back into
    the windpipe and restores the windpipe and miniature bows and arrows to the bundle
    area.
  language: English
  quote_policy: summarized
