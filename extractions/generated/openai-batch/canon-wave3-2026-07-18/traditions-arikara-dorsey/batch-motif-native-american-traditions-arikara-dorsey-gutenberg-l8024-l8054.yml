  quote: ''
  summary: A story titled “The Mourning Lover,” noted as told by Elk, recounts Rolling-Log
    courting an Arikara woman who sets a sinew-gathering condition for marriage. While
    he is away hunting, she becomes sick and dies. He returns with the sinew, learns
    of her death, rebukes his people for not telling him, and leaves for the hills
    without returning to the Arikara camp.
