canonical_text:
  quote: ''
  summary: An Arikara tale tells of Village-Boy, mocked because he has never gone
    to war, who mourns at a graveyard and receives aid and secret powers from a white
    timber Wolf. He transforms into a wolf, guides a war party, captures ponies, takes
    a scalp, and is publicly recognized. Later he raids the Village-of-the-Dumb-People,
    kills their medicine-man, and the medicine-man's dried head becomes a curative
    object used by the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy with four sisters is called Village-Boy because he never goes on the
    war-path and never leaves the village.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sisters are mocked for dancing when their brother has no war achievements,
    and Village-Boy goes to a high mound graveyard with black soot on his face and
    grass arrows in his hair to mourn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A big white timber Wolf asks why Village-Boy is crying and tells him not to
    cry, promising to care for him, find him, and lead him to the enemy's camp when
    he joins a war-party.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Wolf visits Village-Boy and teaches him the secret powers of the Wolf;
    later Village-Boy rolls on the ground in a ravine and gets up as a Wolf.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: At night the wolf-formed Village-Boy stays outside the warriors' camp, barks
    like a wolf, receives burned bones from his friend, and gnaws the bones like a
    wolf.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: Village-Boy tells his friend that the enemy's camp is near, later drives many
    ponies to the warriors, leads the attack, kills one enemy, takes a scalp, and
    gives the scalp and ponies to the war-party leader.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: Village-Boy returns home without speaking about the battle; the leader later
    announces his deeds, the scalp and ponies prove them, his sisters dance without
    ridicule, and Village-Boy marries and becomes a great man of the village.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: Village-Boy later goes east with warriors, enters the Village-of-the-Dumb-People
    alone, kills their medicine-man, cuts his throat, carries away the mumbling head,
    and escapes pursuit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The medicine-man's head is placed in the village, dries into a kind of wood,
    is scraped for patients with certain sicknesses, cures many people, and remains
    among the people reduced to about the size of a hen's egg.
  category: object
  evidence_refs:
  - ev:10
