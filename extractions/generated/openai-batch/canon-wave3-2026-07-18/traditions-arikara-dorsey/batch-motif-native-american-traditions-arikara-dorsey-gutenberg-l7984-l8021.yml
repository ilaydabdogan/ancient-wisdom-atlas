canonical_text:
  quote: ''
  summary: A young Arikara eagle-catching leader takes six young men west to the Missouri
    bank, where they build a cave-like blind, bait it with meat, and catch eagles.
    A Sioux party approaches, asks for eagle feathers, then attacks; the leader directs
    a defense from the cave and bank using loaded guns passed by the others. The Sioux
    retreat, and the hunters take scalps and return to their village.
  language: English
  quote_policy: summarized
