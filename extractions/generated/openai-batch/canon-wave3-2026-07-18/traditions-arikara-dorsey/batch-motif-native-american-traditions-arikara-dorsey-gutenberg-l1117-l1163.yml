canonical_text:
  quote: This will give an idea to all how the Arikara originated under the earth.
  summary: During a westward march, the people encounter obstacles cleared by bird
    helpers, face and kill a huge buffalo with help from animal and fish beings, preserve
    parts of the buffalo in sacred bundles, and later separate from fowls, fishes,
    and animals after those beings give power to Mother-Corn. The passage closes by
    connecting the account to Arikara origin under the earth.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The marching people come to a very thick forest described as their second
    obstacle, and no one can go through it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Owl volunteers, blows down trees, clears a path, and the people continue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people next come to a very deep ravine described as the third and last
    obstacle, and the Kingfisher makes a way across it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On an open prairie the people see a very large buffalo whose horns seem to
    reach the sky; they are amazed, afraid, and unable to find a way to kill him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Mole, the Skunk, and the Badger agree to work together again, with Mother-Corn
    willing for them to do so.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Mole, Skunk, and Badger work under the surface of the earth and make many
    holes that loosen the ground around the buffalo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Fish enters the buffalo through its mouth while it drinks at the lake,
    works inside it with his fins, and the buffalo falls, bleeds, and dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people are afraid of the dead buffalo and worship him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The buffalo's hairs are described as grass, his horns as trees with thick
    bark, the end of his nose as a big black sunflower, and much of his appearance
    as Mother-Earth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The buffalo's blood sinks into the earth, hardens, becomes stone, and the
    stone is later used to make pipes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The buffalo is butchered; his flesh is divided among sacred bundles in different
    villages, and his joints are counted and preserved in the bundles.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After traveling westward for many days, separation takes place after Mother-Corn
    calls a council.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The fowls, fishes, and animals agree to separate from the people and give
    as much power as they can spare to Mother-Corn.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Mother-Corn is to get food and clothing from animals she chooses before separating
    from the animals.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The closing statement says the account gives an idea of how the Arikara originated
    under the earth and calls it a mystery to solve.
  category: speech
  evidence_refs:
  - ev:8
