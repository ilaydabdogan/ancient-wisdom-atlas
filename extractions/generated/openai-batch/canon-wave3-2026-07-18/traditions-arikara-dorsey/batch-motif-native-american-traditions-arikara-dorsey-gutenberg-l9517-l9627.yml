canonical_text:
  quote: ''
  summary: 'The passage gives brief abstracts of several Arikara narratives: Two-Wolves
    receives and uses power connected with Thunder; a medicine robe protects the Arikara
    from a dead enemy and from Sioux attackers; a boy receives dreams and visions
    connected with a bear-marked shield and later becomes a successful warrior and
    sun-dance participant; an enemy tied to a cross dies and his bones later move
    into a medicine lodge; a Sioux woman''s scalp is ritually offered to gods; a warrior
    fights Sioux in a bear-like manner and dies frozen; and a young man leads an attack
    in which the natural surroundings seem to join the war-whoop.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two-Wolves is left alone in a storm after a buffalo chase and has his life
    saved by Prairie-Chicken.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Waruhti gives Two-Wolves power to understand the speech of Thunder, and Two-Wolves
    later uses ceremony addressed to Thunder to identify who killed a horse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thunder instructs Two-Wolves to tell Wolf-Chief to kill his black dog and
    perform a ceremony.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two-Wolves later discovers thieves and prophesies notable events.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the medicine-robe narrative, an enemy looks into a woman's lodge opening,
    digs at the lodge side, and is captured by her hidden husband after the woman
    raises an alarm.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A captured enemy warns that a southern tribe is coming to kill the Arikara;
    after he repeatedly breaks loose from a scaffold, he is stabbed to death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: During a ceremony the dead enemy enters the lodge, the medicine-men run out,
    and the keeper of the wonderful robe wraps him in the robe and throws him into
    the river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: When many Sioux come, the robe keeper wraps the holy robe around himself,
    takes an eagle wing and gourd, climbs onto a lodge, shakes the robe toward the
    sun, and the enemy are frightened and defeated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: In the bear-shield narrative, a boy dreams that Bear tells him a woman has
    removed a shield from his father's grave.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: During a storm the boy sees a bear with paws toward the sky and lightning
    forming the appearance of a shield with a bear as the black center mark.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:11
  text: The boy dreams that his father says the shield was taken by Howling-Wolf and
    that the boy must get it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: The boy has a shield made like the one seen at the grave, later takes a scalplock
    in war, is made chief, and wears a shield by which he is never hit when enemies
    attack.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: At the sun dance, the boy swings day and night by buckskin strings tied to
    sticks run through his back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:14
  text: In the crucified-enemy narrative, an old man puts on medicine and costumes,
    carries a gourd to the top of a lodge, sings sacred songs, and frightens attacking
    enemies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: One brave enemy is captured, tied to a wooden cross outside the village, dies,
    loses his flesh, and remains as bones.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: When young men play near the cross, the bones fall, run toward the village,
    enter the medicine lodge, and the man is found under blankets on the altar.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:17
  text: In the scalp-sacrifice narrative, a war party seizes one of two Sioux women
    at a spring and takes a scalp from the side of her head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: The leader divides fat from the scalp into five pieces and places them in
    the four directions and the center to show that the scalp is offered to the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:19
  text: Fire-sticks burn the scalp, holy bundles and medicine bags pass through the
    smoke, and priests change the names of young men and children who give presents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:20
  text: In the winter warrior narrative, a man carrying an antelope is pursued by
    Sioux, kills the first Sioux, yells like a bear, and causes the Sioux to run away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:21
  text: The same warrior is later found frozen in timber with arrows in his back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:22
  text: In the bow-capture narrative, a young man, his brother, and his father follow
    Sioux who have captured old women and children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:23
  text: Before attacking, the young man looks at stars, trees, and everything; when
    the war-whoop is given, trees and everything seem to join it, frightening the
    enemy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:24
  text: The attackers capture the enemy's bows, kill many people, and set bows and
    arrows on a high hill.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:25
  text: The range ends with the title of narrative 76, 'The Woman Who Befriended the
    Warriors,' without the abstract's narrative content in the supplied passage.
  category: other
  evidence_refs:
  - ev:8
