canonical_text:
  quote: ''
  summary: A tradition titled “The Capture of the Enemy’s Bows,” told by Strike-Enemy,
    recounts how Sioux attacked a village while young men were away, taking old women
    and children and killing many. A returning young man, his brother, and their father
    pursued the Sioux camp, made a loud war-whoop that seemed to be echoed by trees,
    grass, stars, birds, and the surrounding timber, frightening the enemy. Their
    people remained, the enemy’s bows and some captives were taken, and later the
    bows and arrows were set on a high hill, which was thereafter named “Enemy’s-Bows-Upon-a-High-Hill.”
  language: English
  quote_policy: summarized
