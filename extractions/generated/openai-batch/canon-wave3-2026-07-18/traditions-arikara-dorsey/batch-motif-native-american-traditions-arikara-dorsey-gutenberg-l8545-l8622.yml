canonical_text:
  quote: ''
  summary: 'The passage contains abstracts of several Arikara traditions. One recounts
    Mother-Corn visiting a medicine-lodge, teaching people, announcing buffalo, being
    killed during an enemy attack, and vegetation springing from her burial place.
    Another recounts people emerging from the ground under the leadership of Mother
    and escaping Cut-Nose and buffalo with help from ritual offerings, landscape barriers,
    and animal helpers. Two related abstracts explain why buffalo no longer eat people:
    Buffalo are described as humanlike horned beings who eat human meat until a young
    man, aided by a strange man or a Buffalo woman, arms people with bows and arrows,
    scatters or kills the Buffalo, and causes them to become ordinary buffalo. The
    later version ends with the young man and Buffalo woman marrying and teaching
    songs and bundle ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man makes offerings to gods and Mother-Corn; Mother-Corn is pleased
    to share smoke with the people, travels from the east, enters a medicine-lodge,
    stays many days, and teaches lessons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mother-Corn asks a woman to make moccasins; four pairs wear out while she
    slowly walks twenty steps, and the abstract states this signifies a long, hard
    walk to the west.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mother-Corn tells the people she has seen buffalo and that they will appear
    in four days; on the fourth day the people kill many buffalo.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: While the people are away killing buffalo, enemies attack the village and
    Mother-Corn is killed; after she is buried, grass and other growth spring up from
    the place where she is laid.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: People come out through the ground led by a woman called Mother; all kinds
    of animals are with them except buffalo.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A horned monster called Cut-Nose comes out of a lake, buffalo come from under
    him, and the buffalo catch and kill some of the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The people make canyons behind them that the buffalo cannot cross; Mother
    tells them to give presents and smoke to Whirlwind, which then scatters some of
    the people.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:8
  text: Owl and Badger fail to open a path through big timber, while Coyote and Dog
    succeed; Dogs fail to make a pathway through deep water, while Loons make an opening;
    Kingfisher and Mole fail at a canyon, while Badger makes the banks fall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After crossing, the people make a village near a canyon; Mother conducts ceremonies
    for different bundles, and Awaho-bundle people receive ceremonies last.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In one account, a young man visits a village at night and finds that its people
    are Buffalo who talk about killing people; he sees a human head and meat and learns
    of a cut in a hill where people emerging from the ground are driven and killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A strange man gives the young man bows and arrows and instructs him to take
    young men to kill and scatter the Buffalo; after the attack the Buffalo become
    buffalo and no longer eat people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In another account, a chief priest opens a bundle and offers gifts to gods
    for buffalo; buffalo arrive three days after the ceremony, and an old priest tells
    a story in which Buffalo are human but have horns.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Buffalo use a ritual involving a hollow tree struck four times with a
    pole; people led by Cut-Nose come out and are killed, while Cut-Nose re-enters
    the tree.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A boy chased by a Buffalo cow sees a woman in a white buffalo robe, follows
    her west, and learns that she has chosen him to turn her people into real buffalo
    so they will not eat his people.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Buffalo woman leads the young man through four circles of Buffalo bulls,
    covers him with her robe, and shows him humanlike Buffalo with horns and tails
    who cook and eat human meat, arbors with human bodies, and a hollow cottonwood
    tree with a long stick.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: After three days making bows and arrows, the young man arms people who come
    out near the tree; the people shoot and chase the Buffalo until they become buffalo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The young man and Buffalo woman take a bundle from the tipi, marry, teach
    songs and bundle ceremony to the people, and the people become part of the Arikara.
  category: sequence
  evidence_refs:
  - ev:9
