canonical_text:
  quote: "“You people tell things about me that are not true, but then, it is all
    right.”"
  summary: A footnote attributes the tale to White-Owl. A prominent warrior leads
    boys into the hills to catch eagles. They dig holes and make a large cave in the
    bank of the Missouri River their home. One night, while they sit in a circle telling
    exaggerated Coyote stories, a Coyote barks outside, enters their den, says they
    tell untrue things about him, and leaves. The leader and young men scatter, abandon
    the den, and return to the village. They regard the talking Coyote as a bad sign,
    while other people think it was a good message and that they should have stayed
    to catch many eagles.
