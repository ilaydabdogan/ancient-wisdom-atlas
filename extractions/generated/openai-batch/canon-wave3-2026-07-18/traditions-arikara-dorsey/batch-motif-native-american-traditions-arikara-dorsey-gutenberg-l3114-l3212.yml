canonical_text:
  quote: ''
  summary: Burnt-Hands claims the white buffalo hide and later the elk teeth despite
    Red-Bear's chiefly privileges. After killing Red-Bear, he flees to his grandmother,
    uses bear claws and paint in a ceremony taught by his Bear father, and both become
    Bears. They defeat attacking warriors until Last-Child brings a peace-pipe, which
    Burnt-Hands accepts. He alters his and his grandmother's ages, marries Last-Child,
    becomes chief, and rules happily.
  language: English
  quote_policy: summarized
