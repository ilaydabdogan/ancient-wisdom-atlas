canonical_text:
  quote: ''
  summary: An Arikara hunting party encounters a small snake by the path. Older people
    advise giving it presents, but two poor boys resent the gifts and kill the snake.
    The Arikara return to their village and take refuge on high arbors as many snakes
    approach along both sides of the Missouri River. A battle follows in which many
    snakes and many Arikara die, including one of the boys; the other is bitten repeatedly
    but kills many snakes.
  language: English
  quote_policy: summarized
