canonical_text:
  quote: ''
  summary: Rabbit-Boy prepares himself with white clay, rabbit-skins, feather rabbit
    ears, and a war-club from Rabbit, leads dawn attacks on an enemy village, kills
    men who first emerge, escapes, and gains recognition as a great warrior. A young
    woman in the enemy camp repeatedly sees and encourages him, then sends gifts and
    a secret recognition sign through an Arikara captive woman, whom she helps return
    to her people with ponies and food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rabbit-Boy covers his body with white clay, wears rabbit-skins on his ankles,
    wrists, and neck, and places two feathers on his head to represent rabbit ears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rabbit-Boy's only weapon in the attack is a war-club that had been given to
    him by Rabbit.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rabbit-Boy plans the attack, and the warriors crawl near the enemy village
    before daylight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: As the sun rises, an old man comes out of the village calling for people to
    wake and get their ponies; Rabbit-Boy strikes him on the head and kills him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A young girl carrying a hide-scraper and a robe sees Rabbit-Boy clearly and
    wishes she could help him get away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rabbit-Boy escapes safely, rejoins the other warriors, and the warriors divide
    captured ponies before going home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the return, people speak of Rabbit-Boy's powers, rejoice in his lodge,
    and recognize him as a great warrior.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: On a later attack against the same village, Rabbit-Boy repeats the earlier
    pattern, kills the first man who comes out, and the warriors become bold and fight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: For a long time the enemy does not charge Rabbit-Boy's village.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Rabbit-Boy repeatedly passes by the young girl's tipi during attacks; she
    comes out, meets him, and at one point cheers him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: During scalp dances in Rabbit-Boy's village, women make him dance, several
    women become fond of him and try to marry him, and he pays no attention to them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The girl in the enemy camp makes a pair of moccasins, beaded bracelets, and
    beaded armlets.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The girl summons an Arikara captive woman and says she will help her return
