canonical_text:
  quote: ''
  summary: Coyote gives a robe to a big Stone, later reclaims it, and is chased by
    the animated Stone. He persuades two Bull-Bats to help him by claiming that the
    Stone insulted them and by promising to change their coloring. The Bull-Bats break
    the Stone with expelled flatus. A parenthetical note says that people claim this
    was the only stone in the world and that its fragments scattered everywhere. Coyote
    marks the Bull-Bats with white clay and leaves happy.
  language: English
