canonical_text:
  quote: ''
  summary: In an Arikara medicine-lodge account, Bear and Buffalo societies occupy
    opposite sides of the lodge and perform wonders. A young Bear man insists on challenging
    the Buffalo, delivering a tobacco pipe as the challenge despite objections from
    both leaders. After ritual preparations involving washing, dust, smoke, medicines,
    paint, drums, rattles, songs, and animal regalia, the Bear and Buffalo fighters
    enact their animals. The Buffalo fighter repeatedly hooks the Bear fighter and
    kills him. The death is accepted as the challenger's own fault, and thereafter
    animal chiefs in the medicine lodge do not challenge one another during performances.
  language: English
  quote_policy: summarized
