canonical_text:
  quote: "“because really they are an old woman.”"
  summary: In a medicine-men’s ceremony, a notched stick and dried buffalo hide are
    used to make sound, then placed on an island after the ceremony. People are told
    not to go there. A man visits and sees an old woman in place of the objects; later
    visitors sometimes see the old woman and sometimes the stick and hide. The man’s
    father explains that the objects are really an old woman.
  language: English
