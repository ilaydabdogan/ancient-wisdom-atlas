  evidence_refs:
  - ev:2
- id: obs:3
  text: At the end of the ceremony, lodges inside the big lodge were taken down to
    the river, and the notched stick and dried buffalo hide were placed on an island.
  category: sequence
  evidence_refs:
  - ev:3
