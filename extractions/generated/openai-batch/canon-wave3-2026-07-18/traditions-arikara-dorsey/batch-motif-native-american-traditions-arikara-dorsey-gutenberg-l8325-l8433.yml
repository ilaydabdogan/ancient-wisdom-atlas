canonical_text:
  quote: ''
  summary: 'The passage gives a footnote naming White-Bear as teller, followed by
    abstracts of several Arikara traditions: Wolf and Lucky-Man create land from lake
    mud retrieved by Duck; Spider-Man and Spider-Woman become progenitors of human
    beings; and two origin accounts describe flood destruction, people preserved as
    corn in a cave or under the ground, emergence aided by animals and Thunder, westward
    migration past obstacles, the institution of ceremonies by Mother-Corn, smoke
    offerings to gods of the world-quarters and Nesaru, Dog and Whirlwind episodes,
    the protective Cedar-Tree and Big-Meteoric-Star, language differentiation, and
    Mother-Corn’s transformation and later return to teach ceremonies.'
  language: English
  quote_policy: summarized
