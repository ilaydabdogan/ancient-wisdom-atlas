canonical_text:
  quote: ''
  summary: A first-person narrator recounts killing and skinning a young bear, keeping
    a smaller bear hide that his father has tanned and painted, wearing it in dances,
    keeping it in the lodge, and later learning that his family sold the bear robe
    to a white man while he was away visiting the Sioux. He is sorry but accepts it
    because Bear dances are no longer held.
  language: English
  quote_policy: summarized
