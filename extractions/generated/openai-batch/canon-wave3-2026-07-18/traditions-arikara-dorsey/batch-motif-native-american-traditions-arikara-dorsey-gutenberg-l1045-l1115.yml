canonical_text:
  quote: ''
  summary: An Arikara origin narrative describes unnumbered people and Mother-Corn
    in a dark cave deep in the earth. Mother-Corn sends four birds in four directions,
    but they return without good news. A long-nosed Mouse or Mole, a Skunk, and a
    Badger dig upward and widen a path to the surface. The Badger observes the surface
    world and reports back. Mother-Corn emerges through the opening and all the people
    follow. Nesaru from the heavens teaches Mother-Corn and gives her power. She leads
    a westward march until the people reach water, where Fish parts the waters so
    they can cross dry land between walls of water.
  language: English
  quote_policy: summarized
