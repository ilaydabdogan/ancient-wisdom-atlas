canonical_text:
  quote: ''
  summary: 'A footnoted Arikara tradition tells of a medicine dance or sleight-of-hand
    performance in a lodge by leading medicine figures: Beaver weakens and restores
    lodge posts, Turtle causes water to pour from a cut near his collarbone and then
    draws it back in, and Stawi the Witch-Woman performs with a mysterious gun-like
    medicine object before giving birth to a child destined to become a great medicine-man
    and leader in the medicine dance.'
  language: English
  quote_policy: summarized
