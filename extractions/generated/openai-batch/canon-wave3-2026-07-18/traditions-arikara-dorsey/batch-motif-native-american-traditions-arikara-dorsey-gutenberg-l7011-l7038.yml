  evidence_refs:
  - ev:1
- id: obs:2
  text: The friend feared that people would learn the Scalped-Man had done the killing
    and pony-capturing for which the friend had become chief, and that the friend
    would then be viewed as a coward.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night, the friend invited men and announced that he intended to capture
    the Scalped-Man, who dwelt in the Bad Lands and had assisted him in obtaining
    ponies and killing people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The men in the village thought the capture plan was wrong and did not want
    to do it, but the friend remained determined.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The next morning, people surrounded the bank where the Scalped-Man lived,
