canonical_text:
  quote: ''
  summary: A man who has gained chief status from deeds actually done with the help
    of the Scalped-Man fears exposure. He gathers men at night and plans to capture
    the Scalped-Man, though they think this is wrong. The Scalped-Man, who has been
    watching for betrayal, overhears the plan, returns to his cave, takes his things,
    moves away, and is never seen again.
  language: English
  quote_policy: summarized
