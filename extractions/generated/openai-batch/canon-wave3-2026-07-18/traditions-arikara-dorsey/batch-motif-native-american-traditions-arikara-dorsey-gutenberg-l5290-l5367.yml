canonical_text:
  quote: ''
  summary: A story titled “The Five Turtles and the Buffalo Dance” tells of five soft-shell
    Turtles entering an Arikara village from the Missouri River. One black-feathered
    Turtle departs, while the remaining Turtles become drums associated with the Buffalo
    dance. During the dance, a mysterious feathered and buffalo-adorned being mimes
    intercourse; a secluded girl becomes pregnant by him and bears a precocious child.
    The people kill the child and throw him into the river, but the father and a night-seeing
    medicine-man recover the body when the waters part. The child is buried between
    split stones, and the mysterious being marries the girl.
  language: English with Latin passages
  quote_policy: summarized
