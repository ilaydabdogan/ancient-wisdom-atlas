- id: obs:11
  text: The neighbors determine that the girl had not known a man and had become pregnant
    through the monstrous being’s motions; the people catch the child, kill him, put
    him into a bag, and throw the bag into the river.
  category: sequence
  evidence_refs:
  - ev:5
