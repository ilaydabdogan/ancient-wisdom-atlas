canonical_text:
  quote: ''
  summary: The passage introduces Antelope-Carrier, a gifted Arikara hunter whose
    powers and weapons are linked to heavenly gods and Wood-Rats. After wandering
    west and sleeping near a large lake, he is carried by Thunderbirds to a high mountain
    where their nest holds four young. The mother Thunderbird asks him to protect
    the young from a two-headed, flint-covered water-serpent that comes from the lake
    and resists lightning. She promises him lightning power and control over birds
    if he helps. The boy agrees, feeds the young, and is told that fog rising from
    the lake will signal the serpent’s approach.
  language: English
  quote_policy: summarized
