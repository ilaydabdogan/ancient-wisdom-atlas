canonical_text:
  quote: ''
  summary: A medicine-man arranges a trap to catch a human Wolf, treats him in a sweat-lodge
    until wolf-related substances are vomited out, and the young man recovers. The
    young man then summons Wolves and Bears to devour seven girls who had put him
    in a hole and left him to die. The community accepts the punishment, and the young
    man later becomes a warrior, chief, and founder of the Wolf dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man in the tribe is said to have medicines for catching the human Wolf and
    taking the Wolf feeling out of him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man selects a hilly place with steep banks on three sides and an opening
    on the north side, and he directs the people to make their village east of it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women dig a deep hole, set long poles on the banks, and prepare willows as
    a doorway to close the entrance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Young men kill buffalo and place the meat inside the enclosure as bait.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Wolves follow the bait, and mounted men drive the Wolves, including the human
    Wolf, into the trap.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Four strong men wearing rawhide leggings and sighted caps enter the trap,
    isolate the Wolf man, tie him, and remove him while he tries to bite them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The medicine-man builds a sweat-lodge, brings in hot stones, pours water on
    them, ties the Wolf man inside, and gives him prepared medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Wolf man vomits wolf hairs, white clay, froth, and raw meat while people
    rub wild sage on his body, especially his knees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the treatment, the Wolf man says he feels better, is untied, taken to
    his lodge, and recovers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The young man asks his father to build a tipi and invite the bravest men to
    the father's tipi rather than to the tipi built for the young man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Seven girls who had put the boy into the hole are invited to dress in fine
    clothes and come to the young man's tipi because he had promised to marry them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The young man calls to Wolves in the north as father and asks them to devour
    the girls who caused him to be with the Wolves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The young man calls Father Bear among the cedars in the west and asks Bear
    and his friends to devour the girls who put him into the hole.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Wolves and Bears come to the young man, are placed around the tipi, and the
    young man tells the girls that the Wolves will eat them because they left him
    in the hole to die.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The girls beg for mercy and try to crawl away, but the Wolves eat them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The young man's father tells the village that the seven girls are being devoured
    because they dug the hole, stripped the young man, demanded actions from him,
    and left him to die.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The people become angry at the girls, and the girls' relatives do not try
    to save them because the girls had done wrong.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: The next day the people break camp and leave; the young man later becomes
    a warrior, brave, chief, marries, and starts the Wolf dance among the Arikara.
  category: sequence
  evidence_refs:
  - ev:9
