canonical_text:
  quote: ''
  summary: 'The passage contains several Arikara tale abstracts: an old woman aids
    and later warns war parties; two versions of attacks on eagle hunters by Sioux;
    a mourning lover whose intended bride dies; a ritual contest between Bear and
    Buffalo societies; White-Bear’s bear-spirit affiliation; and a Bear Society member’s
    account involving bear skins, bear dances, hunting, and a human-like bear encounter.
    The end of the passage is a transcriber’s note without mythic narrative content.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two boys on the war-path find an earth-lodge where an old woman lives; she
    feeds them and tells them where to go, and they kill an enemy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman later disappears, is found inside a cliff in the Bad Lands,
    disappears again, and is then heard by warriors near a big lake singing scalp-dance
    songs or mourning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the old woman sings and dances, warriors proceed and take enemy scalps;
    when she mourns, warriors proceed and are beaten by the enemy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: People give the old woman blankets, tobacco, and other things after she is
    identified as the same woman from the Bad Lands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: In one eagle-hunter abstract, a young man in a baited hole leaves his weapons
    outside and is found by Sioux, who force him to come out and lead them to other
    Arikara men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The captured eagle hunter burns the Sioux with hot buffalo grease while cooking
    for them, escapes despite weakness from torture, and later Arikara men return
    with three scalps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: In another eagle-hunter abstract, young men are in a cave when Sioux come
    asking for eagle feathers; the Arikara leader goes out and the Sioux attack.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Arikara leader kills several Sioux, the others retreat, and the hunters
    return to the village at night with scalps.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Rolling-Log courts an Arikara woman who says she will marry him if he brings
    enough sinew to last a whole year; he obtains twenty-four sinews but returns to
    find her dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After finding the woman dead, Rolling-Log grieves and goes among the hills,
    not returning to the Arikara camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: During medicine ceremonies, the Bear family is placed on the north side of
    the lodge and the Buffalo family on the south side.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Bear-family young man challenges a Buffalo representative; both sides prepare
    their men with medicines, the societies meet, and Buffalo kills Bear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: White-Bear is associated with Bear from before birth because his father wears
    a bear robe while his mother is pregnant, and the child later shows froth, bear-like
    noises, and bear-like conduct.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: When White-Bear is three years old, he falls on a knife and his intestines
    come out; his father restores them and bandages him, and he recovers enough to
    wear a bear robe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: White-Bear performs sleight-of-hand in Bear ceremonies and has visions of
    bear in the medicine-lodge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: A boy stays in the medicine-men’s lodge, learns mysteries of the Bear Society,
    receives a stuffed bear skin from his father, and sees a little bear dance and
    imitate him during a Bear dance.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: A hunter and a young man see a bear that stands like a man and embraces a
    young bear; both bears are killed and skinned, and the little bear’s hide is later
    worn in Bear dances.
  category: sequence
  evidence_refs:
  - ev:7
