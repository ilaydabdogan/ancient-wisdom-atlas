candidate_motifs:
- id: motif:1
  label: Death and revival of the tongue-giving youth
  taxonomy_refs:
  - death_rebirth
  basis: The young man cuts off and gives his tongue, falls dead, and sits up after
    Moon touches his feet.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is an abstract and does not explain the ritual or moral significance
    of the tongue-giving.
- id: motif:2
  label: Celestial adoption and conflict with Sun
  taxonomy_refs:
  - divine_parent_child
  basis: Moon makes the revived youth his son; Sun had said the youth would be his
    son and later sends sons and other threats against him.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: Kinship terms are reported in summary form only.
- id: motif:3
  label: Ascent or removal to the sky
  taxonomy_refs:
  - ascent
  basis: Sun takes No-Tongue to the sky in the morning; later Sun takes the old man
    to his home.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage summarizes the movement but gives little detail about the
    sky location.
- id: motif:4
  label: Protective counsel from Moon
  taxonomy_refs:
  - wisdom
  basis: Moon repeatedly warns No-Tongue and gives practical instructions about weapons,
    robe preparation, and false scalp protection.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The taxonomy label is broad; the passage presents advice rather than a
    formal wisdom teaching.
- id: motif:5
  label: Sun becomes Buffalo
  taxonomy_refs:
  - shapeshifter
  basis: Sun becomes Buffalo in order to kill No-Tongue.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only one transformation by Sun is described in the abstract.
- id: motif:6
  label: Destruction of transformed Buffalo by fire
  taxonomy_refs: []
  basis: No-Tongue makes a fire on Buffalo's back while Buffalo is in a mud hole,
    and Buffalo burns up.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: No available motif-family reference exactly matches this localized fire
    episode.
- id: motif:7
  label: Bear adoption and ritual initiation
