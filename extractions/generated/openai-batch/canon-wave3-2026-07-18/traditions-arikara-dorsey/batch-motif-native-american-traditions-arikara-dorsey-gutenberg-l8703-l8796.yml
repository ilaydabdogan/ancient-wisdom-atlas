canonical_text:
  quote: ''
  summary: 'Abstracts of several Arikara traditions: a young man later called No-Tongue
    is taken into relationships with Sun and Moon and survives repeated threats; three
    versions describe Burnt-Hands or a poor boy gaining status through bear aid, a
    clay war-club, or buffalo-hunt powers; two boys discover and kill a water-serpent
    troubling the village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man goes to a high hill to mourn, is taken elsewhere by a little bird,
    gives his tongue to a red-painted man, and falls dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moon touches the young man's feet, the young man sits up, and Moon identifies
    the red-painted man as Sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moon makes the young man his son and advises him to choose old weapons when
    Sun offers weapons.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Sun takes No-Tongue to the sky in the morning and is distressed because No-Tongue
    takes the best things, which give him life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Moon advises No-Tongue to prepare a dark-brown robe powdered with white clay
    instead of sending Sun a white buffalo robe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sun plans for Little-Sun and then Big-Sun to kill No-Tongue, but No-Tongue
    kills them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sun becomes Buffalo to kill No-Tongue, falls into a mud hole, and burns when
    No-Tongue makes a fire on his back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Moon advises No-Tongue to use a false scalp with dog's blood inside, and Sun
    takes that scalp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When old and blind, No-Tongue makes a circle of red sticks for Sun and a circle
    of white sticks for Moon; Sun and Moon come, and Sun takes him home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Burnt-Hands is a poor boy living with his grandmother outside the village,
    and Last-Child brings them food.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Red-Bear shoots Burnt-Hands and drops him into an air-hole in the ice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: White-Bear's cub takes Burnt-Hands to White-Bear, who adopts him, teaches
    him the Bear ceremony, and gives him a medicine bundle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Burnt-Hands obtains a white buffalo robe, later strikes Red-Bear with a war-club,
    and drags him to the air-hole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Burnt-Hands and his grandmother perform the Bear ceremony, turn into Bears,
    and attack warriors until a peace-pipe is sent and accepted.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Burnt-Hands makes his grandmother thirty-eight years old and himself twenty-two,
    marries Last-Child, becomes chief, and has Black-Bear as slave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: In another abstract, a poor boy on the war-path is given a round burnt clay
    ball with a handle by his grandmother and is warned not to tell coyote stories.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: The poor boy roasts corn on the clay ball; when enemies arrive, the clay ball
    is a war-club, and he kills many enemies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: In another abstract, a poor boy joins a buffalo hunt, sings about being selected
    to direct the hunters, kills buffalo, and takes buffalo beard and shoulder hair.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: Buffalo hair becomes tongues and hearts, and a blizzard kills many men who
    had made fun of the young man.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:20
  text: Two boys accused of eating corn watch at night and see a long serpent putting
    its head into the smokeholes of lodges.
  category: action
  evidence_refs:
  - ev:12
- id: obs:21
  text: The two boys shoot the serpent with arrows; the river roars and rises, and
    the serpent is found dead after the water goes down.
  category: sequence
  evidence_refs:
  - ev:12
