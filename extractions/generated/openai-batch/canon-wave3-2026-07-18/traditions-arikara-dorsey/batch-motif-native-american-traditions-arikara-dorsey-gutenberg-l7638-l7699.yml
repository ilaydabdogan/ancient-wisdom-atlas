canonical_text:
  quote: ''
  summary: A first-person narrator recounts joining a war party at fifteen, striking
    a Sioux enemy, taking a scalplock, offering it through his grandfather at the
    lodge of the holy bundle, and being made a chief. He is invested with a white
    buckskin shirt to be marked for future battle deeds. He later describes a Sun
    Dance ceremony in which medicine-men paint him, warriors cut his back and suspend
    him by ropes, gifts and ponies are exchanged, Bloody-Knife releases him, and the
    narrator links his later battle success to the suffering endured in the ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says he joined a war party when he had seen fifteen winters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war party hid in a ravine; the narrator jumped up with a shield, another
    man shot the Sioux in the breast, and the narrator struck the Sioux with his bow
    and counted his first coup.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator took only the Sioux's scalplock and brought it to his grandfather.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The grandfather took the scalp to the lodge of the holy bundle; an offering
    ceremony to the gods was performed, and a chiefs' ceremony made the narrator a
    chief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: An old man put a white, ermine-fringed buckskin shirt on the narrator and
    instructed him to make marks on it for enemies struck and scalped.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator later joined other war parties, gave many scalps to his grandfather,
    wore his shield during attacks on the village, and says he was never hit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During a Sun Dance, the grandfather brought the narrator into a lodge and
    asked medicine-men and warriors to paint him, put a lariat rope on the pole, cut
    his back so that he would swing, and recount their deeds.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Medicine-men painted the narrator, warriors cut both shoulder-blades, sticks
    and buckskin strings were placed through the cuts, and a lariat rope lifted him
    about four feet from the ground.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator swung for one day and one night; a related warrior offered a
    racing pony and asked that the strings be cut, friends laid out presents, and
    Bloody-Knife cut the skin strips so the narrator fell to the ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the Sun Dance ordeal, the narrator again counted coup and struck an
    enemy, and he says he thought his easy time in battle was because of the sufferings
    he endured in the ceremony.
  category: action
  evidence_refs:
  - ev:8
