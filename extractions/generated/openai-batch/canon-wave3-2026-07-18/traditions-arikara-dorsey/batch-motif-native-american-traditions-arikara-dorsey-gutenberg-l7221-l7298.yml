canonical_text:
  quote: ''
  summary: An Arikara tale, identified as told by Elk, recounts a wife and her lover
    feigning her death, substituting dead dogs for her body, and fleeing in male disguise.
    When she later tries to see her son, the boy recognizes her. Her husband tests
    the disguised visitor by gait and pipe-smoking behavior, identifies her as his
    wife, cuts off her breasts, and she dies.
  language: English
