canonical_text:
  quote: They never made war on one another any more.
  summary: A returned captive tells Rabbit-Boy that a girl in the enemy camp wants
    him and has sent tokens. Rabbit-Boy goes secretly to her tipi, is discovered by
    her father, and is spared after an intercessor argues that the marriage will stop
    him from killing their people. He remains as son-in-law, joins war parties while
    killing only captives from his wife’s tribe rather than his own people, and eventually
    visits his home with his wife’s people. Gifts and reciprocal visits follow, and
    the two groups make peace.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A woman who had returned from captivity comes to the Arikara village, goes
    to the dances at night, and asks where Rabbit-Boy is.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The returned woman tells Rabbit-Boy that the girl in the enemy camp helped
    her escape, wants Rabbit-Boy, and had given moccasins and bracelets for him to
    wear when he came to her village.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rabbit-Boy says he will go, starts that night, and travels through the next
    day and night to reach the enemy camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the north side of the girl's tipi, Rabbit-Boy finds six pegs drawn up and
    understands that the returned woman's message was true.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rabbit-Boy puts his hand into the tipi, the woman feels for the bracelet,
    and she pulls him inside after finding it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rabbit-Boy crawls under the robe with the girl and stays with her all night,
    although they cannot talk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the morning the girl's father, who is chief, sees Rabbit-Boy in bed with
    his daughter and sees the battle things Rabbit-Boy wore hanging from a tipi pole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The chief makes a big fire and sends for warriors, who come prepared to kill
    Rabbit-Boy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: One man tells the people to disperse and says he is glad Rabbit-Boy has married
    one of their girls because Rabbit-Boy will no longer kill their people and will
    instead lead them against enemies.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Rabbit-Boy and the girl are told to sit by the fireplace, and Rabbit-Boy stays
    in the village for several months.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Rabbit-Boy's own people think he has died, but the returned woman tells them
    he will come after a while and that she knows where he is.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The old chief is pleased to have Rabbit-Boy as son-in-law because he expects
    scalps to hang on top of his tipi.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: On a war-party to Rabbit-Boy's own country, Rabbit-Boy kills a captive woman
    from his wife's tribe, takes her scalp, and brings it back to her tribe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The scalp is given to the old chief and strung between his tipi poles so that
    it hangs high in the air.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: On later war-parties, Rabbit-Boy keeps the party at a distance, kills captives
    from his wife's tribe when he finds them, and does not kill members of his own
    tribe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The old chief's people go to Rabbit-Boy's home, receive presents from Rabbit-Boy's
    people, return home, receive visits from the Arikara, and make peace so that the
    groups no longer make war on each other.
  category: sequence
  evidence_refs:
  - ev:7
