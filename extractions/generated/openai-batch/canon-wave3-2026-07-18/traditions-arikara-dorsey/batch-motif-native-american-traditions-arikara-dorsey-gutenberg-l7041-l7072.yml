canonical_text:
  quote: ''
  summary: A war-party sends scouts who report a mysterious coyote-hide-clad being
    that disappears into a steep bank. The leader seeks the being, identified as a
    possible Scalped-Man, for power and information about enemies. The party uncovers
    a hidden entrance by pulling a dry root that drops a mud door. A fearless young
    man leads the frightened men into the cave, where they find a crying man dressed
    in coyote skins with white sheeting on his head, wild sage spread through the
    cave, and a buffalo skull present. The men decide to ask the Scalped-Man to help
    their war-party succeed.
