  quote: ''
  summary: A chief's admired daughter repeatedly refuses marriage, then agrees after
    parental advice. A good hunter marries her, but the marriage is not consummated;
    the next day she shows her mother that she has “helianthes” in place of a vulva.
    Ashamed, she leaves with a bundle, sits down in another place, and turns into
    stone.
