canonical_text:
  quote: ''
  summary: Mother-Corn leads the people westward through obstacles. Bird helpers make
    passages through a chasm, thorny timber, and a lake; some people become birds.
    Mother-Corn later gives corn, returns from the heavens with a man who announces
    Nesaru's displeasure and rules, and establishes chiefly signs, ceremonies, medicine-men,
    and village-making.
  language: English
  quote_policy: summarized
