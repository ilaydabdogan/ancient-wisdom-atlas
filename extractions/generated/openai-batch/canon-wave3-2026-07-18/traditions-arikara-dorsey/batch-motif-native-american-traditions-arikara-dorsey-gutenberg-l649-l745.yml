  text: The journey begins with a mountainous country, deep chasm, steep banks, and
    no apparent way for the people to cross.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mother-Corn appeals to the heavens for help at the chasm; a Kingfisher from
    among the people offers to point out the way.
