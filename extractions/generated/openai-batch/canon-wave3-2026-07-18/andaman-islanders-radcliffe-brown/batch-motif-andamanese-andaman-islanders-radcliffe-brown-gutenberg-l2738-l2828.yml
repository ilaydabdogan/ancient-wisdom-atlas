canonical_text:
  quote: ''
  summary: The passage describes Andamanese kinship terminology and social organization.
    It distinguishes terms for spouses, physiological parents and children, adopted
    and step-relations, notes the weak lexical treatment of distant kin and the emphasis
    on social status, and describes the family as a permanent union between one man
    and one woman, with premarital love affairs sometimes leading to marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Northern ot-e-bui and Akar-Bale ab-i-ŋa are derived from verbal stems meaning
    “to marry” and denote a husband or wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Akar-Bale and Aka-Bea have terms for father and mother that describe the physiological
    relation between parent and child; the passage says adopted parents or a step-father
    cannot strictly be designated by those terms.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the North, the stem -tire means “offspring”; related terms distinguish
    plant offspring from animal or human offspring, and ot-tire is not strictly applied
    to an adopted child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An adopted child is described by the phrase t’oi-čolo-kom, glossed as “he
    whom I have adopted.”
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Akar-Bale and Aka-Bea have different child terms according to whether reference
    is made to the child of a man or to the child of a woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Aka-Bea father-child terms are explained through a stem connected with
    causing conception, while mother-child terms are explained through stems used
    for mother and child.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists additional specific relationship terms, says their derivations
