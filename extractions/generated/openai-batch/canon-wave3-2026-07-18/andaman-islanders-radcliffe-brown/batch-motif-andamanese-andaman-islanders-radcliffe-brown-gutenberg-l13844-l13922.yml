canonical_text:
  quote: ''
  summary: The passage describes Great Andamanese personal ornaments and related objects,
    including ornamented Pandanus leaf strips, women’s leaf aprons, netting and Dentalium
    shell ornaments, bone and shell ornaments, mangrove seed necklaces, bamboo necklaces,
    bark child-carrying slings, and red-painted Tetranthera wood dancing ornaments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pandanus leaf ornament strips are scratched with designs using pointed wood,
    sometimes including hidden portions, and may be further decorated with composition
    applied in simple geometrical patterns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: South Andaman women wear small aprons made from layered Mimusops littoralis
    leaves tucked into a Pandanus leaf belt; the leaves are renewed when they fade
    and turn yellow.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: North Andaman women had recently adopted the South Andaman leaf-apron fashion,
    while formerly using a different leaf called čainyo and a ko̱ro fibre tassel over
    the leaves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bands of netting decorated with Dendrobium skin and Dentalium shell strings
    are worn by both men and women, usually for dances or other ceremonies.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some ornaments are made from human bones, animal bones, wood, cane, or coral,
    attached to cord and often bound with Dendrobium skin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Various shells are perforated or strung on thread and worn around the neck,
    head, knee, wrist, or ankle; Dentalium shells are collected by women and made
    into cylindrical beads.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Seed-tops of several mangrove species are strung on thread and worn around
    the neck.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bamboo necklaces are made from short pieces of bamboo arrow-shaft threaded
    on string and ornamented with simple scratched or cut designs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A bark sling used for carrying children is made from Hibiscus tiliaceus bark
    and may be covered with netting or ornamented with shells.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: A dancing ornament is made by shaving Tetranthera wood, usually from an old
    pig-arrow shaft, tying the shavings at one end, covering them with red paint,
    and carrying them in the hand or wearing them in the belt at dances.
  category: object
  evidence_refs:
  - ev:10
