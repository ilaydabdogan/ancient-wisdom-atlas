canonical_text:
  quote: ''
  summary: The passage describes Great and Little Andaman practices of hair-dressing,
    shaving, scarification, and body-painting, including tools used, gendered performance
    of shaving, historical change in women's hairstyles, and brief comparisons with
    Semang and Philippine Negrito scarification practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Great Andaman, the usual current hair-dressing method is to shave around
    the scalp, leaving a skull-cap-like area of hair; sometimes a narrow strip over
    the crown is shaved as a parting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When hair becomes uncomfortably long, the whole head is shaved and then allowed
    to grow again; the passage also notes current cutting with scissors when scissors
    are available.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Little Andaman, women and old men are frequently seen with entirely
    shaved heads, while younger men shave away the lower edge of the hair all around;
    the passage cautions that the younger men's practice may be recent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An 1882 account by Mr Man described many women as shaving their heads almost
    entirely while leaving two narrow parallel hair lines called gor from crown to
    nape; the passage says this style is now entirely out of use.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The operation of shaving is performed with a flake of glass or quartz and
    is performed by women, never or only very rarely by men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The natives of the Great Andaman scarify the skin of the body and limbs with
    a flake of glass or quartz.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the Semang do not scarify themselves in this way,
    but that some Negritos of the Philippines do.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The natives of the Great Andaman paint their bodies with grey clay called
    odu or og, with fine white clay, and with red paint made by mixing burnt oxide
    of iron with fat or oil.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The natives of the Little Andaman use the same kind of clay as the Great Andaman
    odu or og, but smear it roughly on the back and front of the trunk instead of
    applying it in patterns.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The natives of the Little Andaman also use red paint to smear their hair,
    a practice the passage says is never met with in the Great Andaman.
  category: action
  evidence_refs:
  - ev:5
