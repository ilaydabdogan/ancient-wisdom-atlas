  text: The passage states that ten named languages were recognized by the Andamanese,
    but that the languages were closely related and neighboring speakers could often
    understand one another.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some tribes included distinct dialects, and the passage gives Akar-Bale and
