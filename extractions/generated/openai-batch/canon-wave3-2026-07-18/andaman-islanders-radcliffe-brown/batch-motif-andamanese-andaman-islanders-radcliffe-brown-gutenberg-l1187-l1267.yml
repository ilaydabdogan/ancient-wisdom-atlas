- id: obs:3
  text: Leaving aside the Aka-Bea, the average tribal territory is described as about
    165 square miles, with Aka-Kede over 300 square miles and Aka-Čari less than 100
    square miles.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Aka-Bea are described as having no recognized boundary with the J̌a̤rawa;
