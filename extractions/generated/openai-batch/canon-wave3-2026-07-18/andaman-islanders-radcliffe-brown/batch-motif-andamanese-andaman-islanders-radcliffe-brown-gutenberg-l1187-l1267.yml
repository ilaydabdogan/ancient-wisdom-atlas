canonical_text:
  quote: ''
  summary: The passage describes linguistic relatedness and dialect variation among
    Andamanese tribes; territorial extent and boundaries; the special case of the
    Aka-Bea and J̌a̤rawa; population estimates and decline; the cross-cutting division
    between coast-dwellers and forest-dwellers based on food supply and subsistence
    practices; and the former importance of independent local land-owning and hunting-right
    groups.
  language: English
  quote_policy: summarized
