canonical_text:
  quote: "“die and then come back to life again”"
  summary: 'The passage describes how an oko-ǰumu, or medicine-man/dreamer, is believed
    to acquire powers through contact with spirits: by death and return to life, direct
    encounters with spirits, or extraordinary dreams. It also describes the oko-ǰumu’s
    reputation, healing and harmful dream powers, spirit-dispelling cures, weather-control
    rites, and knowledge of magical properties of substances and objects.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that the powers of a dreamer or oko-ǰumu can only be acquired
    through contact with spirits, identified as Lau or Čauga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One means of acquiring medicine-man powers is described as dying and coming
    back to life; examples include an Aka-Ko̱ra man and an A-Pučikwar medicine-man
    said to have died and returned three times.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Direct communication with spirits is described through a man who met spirits
    in the jungle, later went alone to communicate with them, and returned with his
    head decorated with shredded palm-leaf fibre said to have been placed by the spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Extraordinary dreams, especially dreams in which a person sees spirits of
    dead persons, forest spirits, or sea spirits, may lead to the reputation of being
    a medicine-man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: An oko-ǰumu must make and sustain his reputation by demonstrating power; once
    acknowledged, he receives respect, shares of game, and presents from others.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: In dreams, an oko-ǰumu is said to communicate with spirits of the dead and
    to cause illness in an enemy or cure illness in a friend.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: For illness, an oko-ǰumu may recommend or apply remedies, address and conjure
    disease-causing spirits to leave, use substances or objects believed to keep spirits
    away, or promise a cure through dreams.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'The passage reports two beliefs about weather control: one attributes control
    to Biliku and Tarai, while another attributes it to spirits, especially spirits
    of the sea.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Two storm-stopping rites are described as crushing plant material between
    stones and placing it under a rock in the sea.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The oko-ǰumu is said to possess superior knowledge of the magical properties
    of common substances and objects, knowledge supposed to be obtained from spirits;
    a lesser degree of such knowledge is said to be possessed by everyone.
  category: relationship
  evidence_refs:
  - ev:10
