  summary: The passage is a methodological argument about ethnology. It says observation
    and theory should be combined in fieldwork, that interpretations of beliefs and
    customs require explicit psychological hypotheses, contrasts intellectualist and
    emotion-based accounts of so-called primitive beliefs, and then states a working
    hypothesis in which society develops and maintains sentiments through ceremonial
    collective expression.
