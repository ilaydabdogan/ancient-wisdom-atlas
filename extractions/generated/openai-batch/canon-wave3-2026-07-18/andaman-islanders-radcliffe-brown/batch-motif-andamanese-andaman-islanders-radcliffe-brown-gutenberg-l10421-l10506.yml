canonical_text:
  quote: ''
  summary: 'The passage explains details of an Andamanese turtle-eating initiation
    ceremony: protective leaves, fire, feeding rules, pigments and clay, sleep restriction,
    weeping female relatives, and a final dance in which the youth is surrounded by
    adult men, decorated, and associated with increased social standing. The dance
    movements are said to imitate turtle movement, and the leaves used are said to
    have efficacy against turtle-related dangers.'
  language: English
  quote_policy: summarized
