  summary: The passage summarizes related Aka-J̌eru and Aka-Kede flood legends. In
    one version, a flood is caused when an ancestor breaks firewood while a cicada
    is singing. In another, Ko̱po-tera-wat, angered because other ancestors refuse
    him honey, deliberately performs the storm-bringing action. The author states
    that these legend elements explain the great flood by tracing it to anti-social
    ancestral action.
