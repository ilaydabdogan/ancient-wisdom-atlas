canonical_text:
  quote: ''
  summary: The passage discusses Andamanese beliefs about Puluga/Biliku, including
    differing descriptions of appearance, doubts about claims of omniscience, ritual
    offences that anger Puluga, the cave or stone-sky abode of Puluga, the son Piǰčor/Perǰido,
    sky spirits called Morowin/Morua, prohibitions around roasting pork, and Mr Man’s
    account of čol spirits or demons who punish offenders with invisible weapons.
    The author notes uncertainty about the relation between čol birds, sky spirits,
    and Puluga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Different informants disagreed about Puluga’s personal appearance; one A-Pučikwar
    man described Bilik as very large, white-skinned, bearded, and carrying a J̌a̤rawa-type
    bow.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author reports that he could not confirm Mr Man’s statement that Puluga
    is omniscient.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When digging yams said to belong to Puluga, people take the tuber and replace
    the crown with the attached stem, explaining that Puluga will then not notice
    the yam was taken.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author says Andamanese wording does not distinguish clearly between “all”
    and “a great deal,” so statements that Puluga knows “everything” may mean that
    Puluga knows “a great deal.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author could not find native support for the claim that murder or adultery
    anger Puluga; he reports that Puluga is angered by ritual offences such as burning
    or melting wax, killing a cicada, and digging up yams.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The “stone house” of Puluga is explained by the author as meaning a cave;
    Biliku is said in North Andaman to live in a cave, while the sky is generally
    regarded as stone or rock and Puluga lives in the sky.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Piǰčor, also called Perǰido in North Andaman, is identified as the son of
    Puluga or Biliku, but the author learned very little about this being.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Morowin or Morua are described as sky spirits; in South Andaman belief there
    are both male and female Morowin, and they are of somewhat the same nature as
    jungle spirits and sea spirits.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: An Akar-Bale informant said Morua eat only pork, are angry if pork is roasted,
    make people ill, formerly lived in large baǰa trees, and now live in the sky.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that throughout the Andamans it is considered dangerous
    to roast pork; in North Andaman, jungle spirits are said to be angered by roasted
    pork and may cause illness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Mr Man’s version, čol are dreaded evil spirits descended from Maia Čol
    and punish those who bake or roast pig’s flesh; boiling pork is not said to carry
    the same risk.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Mr Man’s version, čol use an invisible spear or darts thrown from their
    distant abode at the heads of victims; the weapon is said to be invariably fatal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The author notes that Čol is also the name of a bird species, probably the
    racket-tailed drongo, and that he heard the name used for demons only insofar
    as the birds themselves were supposed to have supernatural powers.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The author says the connection between čol birds and the sky spirits Morowin
    or Morua is uncertain, and their connection with Puluga is still more obscure.
  category: relationship
  evidence_refs:
  - ev:8
