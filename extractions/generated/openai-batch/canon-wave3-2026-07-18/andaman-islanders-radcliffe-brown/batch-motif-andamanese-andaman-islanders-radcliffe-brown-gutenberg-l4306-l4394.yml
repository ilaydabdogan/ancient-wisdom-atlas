canonical_text:
  quote: ''
  summary: 'Ethnographic description of Andamanese mourning customs: bones are recovered
    after decay, washed, decorated, preserved, worn, exchanged, or made into healing
    strings; a ceremony called taking off the clay or shedding of tears releases mourners
    from restrictions through decoration, song, dance, and lamentation. The passage
    also summarizes food abstinence customs connected with mourning, childbirth, menstruation,
    illness, and especially adolescence/initiation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mourning period must last long enough for the flesh to decay from the
    bones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The end of mourning includes recovering the bones of the dead person and a
    dance joined by the mourners.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men who performed the burial cover themselves with odu clay, go to the grave
    or tree, recover the bones, weep over them, wash them in the sea or a creek, and
    bring them back to camp, where women weep over them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The skull and jawbone are decorated with red paint and white clay, fitted
    with ornamental netting for wearing around the neck, and often further ornamented
    with Dentalium or other shells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Skulls and jawbones of deceased relatives are preserved for a long time, worn
    around the neck, and may be lent or exchanged like other possessions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Limb bones may be painted with red paint and white clay and kept in the hut
    roof, while smaller bones or fragments are made into strings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Strings of bone are ornamented, covered with red paint, worn as cures and
    preventives of illness, made by female relatives of the deceased, and given as
    presents.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the North Andaman, a baby’s skull may be preserved in a small basket; the
    passage also reports a string-covering practice for children’s skulls in South
    and Middle Andaman.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A ceremony called taking off the clay or the shedding of tears releases mourners
    from restrictions; mourners remove odu clay from their foreheads and decorate
    themselves with red paint, white clay, and ornaments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the release ceremony, a male mourner sings an ordinary song at the
    sounding-board, non-mourning women provide a chorus, mourners dance, friends and
    others lament, and dancing may continue until near dawn.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the ceremony, mourners may again eat previously forbidden foods, use
    red paint and white clay, and participate in dances and festivities.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage lists food abstinence customs for mourners, parents around the
    birth of a child, menstruating women, ill persons, and adolescent boys and girls
    described as initiates.
  category: other
  evidence_refs:
  - ev:8
