canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese marriage and household relations: attitudes
    toward conjugal infidelity, gendered household duties, the social significance
    of childbirth for a marriage, marriage prohibitions based on kinship, uncertainty
    about cousins and orphan adoption, adoption connected with betrothal, prejudice
    against women marrying younger men, and relative freedom to marry within or across
    local groups and tribes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says former Andamanese views on spousal infidelity cannot be exactly
    recovered; at the present time in Great Andaman infidelity is described as common
    and lightly regarded, though this may have been affected by the Penal Settlement.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A husband and wife share one hut or one portion of a communal hut.
  category: setting
  evidence_refs:
