  text: The wife is described as responsible for fire-wood, water for cooking and
    drinking, cooking at the family fire, and providing and preparing vegetable food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband is described as responsible for providing flesh food for himself
    and his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A marriage is described as not fully consummated until the birth of a child;
    childlessness affects mourning status and the order in which a returning husband
    greets his wife and blood-relatives.
  category: sequence
  evidence_refs:
  - ev:3
