canonical_text:
  quote: ''
  summary: The passage describes Andaman Islander bodily ornaments and dress, distinguishing
    everyday utilitarian items from ceremonial and magical ones. It details men's
    belts and necklets, ceremonial shell and leaf ornaments, bone strings worn against
    sickness, women's Pandanus belts and leaf aprons, a child-carrying sling used
    in an initiation ceremony, and dances used for enjoyment, mourning closure, pre-fight
    occasions, and peacemaking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men constantly wear a rope belt, which can carry items such as adzes, fish,
    roots, or arrows.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A string necklet can carry a knife and skewer, and can also carry a small
    ball of beeswax.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In everyday life men usually wear only a belt, or a belt and necklace; wearing
    a loin cloth near Europeans is described as a modern custom influenced by outside
    opinion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: On ceremonial occasions men put on ornaments such as belts, necklaces, bracelets,
    garters, Dentalium shell, Pandanus leaf ornaments, and other shells.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Strings made of human bones are worn to prevent and cure sickness; animal
    bones are treated in the same way and made into ornaments.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bone strings may be worn as chaplets, necklaces, belts, garters, or bracelets.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Necklaces of shells, mangrove seeds, and beads from Port Blair are worn, and
    the passage says these do not obviously have a magical purpose.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Every woman and girl wears at least one Pandanus leaf belt, with different
    kinds specified for married women and unmarried girls.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women of the Southern tribes wear a bundle of Mimusops littoralis leaves suspended
    from the front of the belt to cover the pudenda.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Northern women formerly wore a čainyo leaf apron and a shredded palm-leaf-stem
    tassel, but within recent years adopted the Southern custom.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women may wear neck string or necklaces, but the string does not serve the
    same knife-carrying purpose as men's neck string.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Except for men's rope belt and women's Pandanus belt and leaf apron, the passage
    states that there is no difference between the ornaments worn by men and women.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A child-carrying sling called čiba in Aka-J̌eru is described as utilitarian
    but also having ceremonial uses; an officiating man wore one during an initiation
    ceremony.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Dance is described as both enjoyment and ceremony; it closes mourning, was
    formerly held before fights, and served as the ceremony by which hostile local
    groups made peace.
  category: action
  evidence_refs:
  - ev:10
