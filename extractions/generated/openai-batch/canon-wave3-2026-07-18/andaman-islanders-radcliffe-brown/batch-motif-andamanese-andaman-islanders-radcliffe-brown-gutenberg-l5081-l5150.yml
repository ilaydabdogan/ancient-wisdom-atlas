canonical_text:
  quote: ''
  summary: 'The passage describes two ceremonial customs: a homicide''s period of
    isolation, taboo, and purification, and a peace-making ceremony between hostile
    local groups involving women’s arrangements, a decorated koro-čop, dance, threatening
    gestures, ritual shaking, shared weeping, joint camping, hunting, dancing, and
    exchanges of presents and bows.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who kills another in a fight or quarrel leaves his village and lives
    alone in the jungle for weeks or months.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The homicide's wife and one or two friends may live with him or visit him
    and attend to his needs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the taboo period the homicide must not handle a bow or arrow, must
    not feed himself or touch food with his hands, must be fed by his wife or a friend,
    must keep red paint on his neck and upper lip, and must wear shredded Tetranthera
    wood plumes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the homicide breaks the rules, the spirit of the killed man is supposed
    to cause him illness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the purification ceremony the homicide's hands are rubbed first with white
    clay and then red paint, after which he may wash his hands, feed himself, and
    handle bows and arrows again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After purification the homicide retains the shredded wood plumes for about
    a year.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two hostile local groups may make peace through a ceremony arranged by the
    women of both parties and held in the country of the group that made the last
    attack.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A koro-čop is erected across the dancing ground using posts, a length of strong
    cane, and suspended bundles of shredded palm-leaf.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: When visitors approach, women of the home camp sit on one side of the dancing
    ground, while home men stand unarmed with their backs against the koro-čop and
    arms stretched along it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The visiting party, described as the forgiving party, dances into camp; the
    home women clap time on their thighs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The visitors dance before and between the standing men, bend beneath the suspended
    cane, make threatening gestures, shout, while the standing men remain silent and
    motionless and are expected to show no fear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The dance leader and then other dancers shake each standing man from the front
    and later from the back; visiting women afterward dance similarly and shake each
    man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the dances, the two parties of men and women sit down and weep together.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The groups camp together for a few days, hunt and dance together, exchange
    presents, and the men exchange bows.
  category: sequence
  evidence_refs:
  - ev:8
