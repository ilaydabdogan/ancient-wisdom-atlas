  summary: 'The passage explains Andamanese dance customs as social practices that
    create or renew group solidarity: dances before fighting intensify unity and collective
    anger; dance-meetings between local groups combine dancing with gift exchange
    to renew intergroup relations; ceremonial body painting and ornaments at dances
    are described as adornment that lets individuals express personal value within
    socially defined limits.'
