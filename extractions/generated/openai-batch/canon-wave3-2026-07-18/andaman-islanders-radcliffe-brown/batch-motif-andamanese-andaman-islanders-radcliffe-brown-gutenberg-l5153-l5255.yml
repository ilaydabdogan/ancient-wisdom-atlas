canonical_text:
  quote: When an Andamanese man or woman dies he or she becomes a spirit, i.e., a
    Lau or Čauga.
  summary: The passage describes Andamanese beliefs about spirits, including forest,
    sea, and sky classes; the transformation of dead persons into spirits; the special
    status of mythical ancestors as “big” spirits; the application of spirit terms
    to light-skinned aliens; and reported appearances and lights associated with forest
    and sea spirits.
  language: English
  quote_policy: quoted
