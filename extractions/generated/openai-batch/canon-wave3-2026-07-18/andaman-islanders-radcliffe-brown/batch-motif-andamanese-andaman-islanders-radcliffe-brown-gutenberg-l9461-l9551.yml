canonical_text:
  quote: ''
  summary: The passage interprets Andamanese ceremonial painting, ornaments, dancing,
    mortuary decoration, and protective objects. White clay, red paint, and Dentalium
    shell ornaments are described as marking social value or dignity after marriage
    and initiation. Corpse decoration is described as an expression of survivors'
    regard for the dead. The passage distinguishes these adornments from human bones
    and fire, which are said to have protective power against illness, spirits, or
    special dangers.
  language: English
  quote_policy: summarized
