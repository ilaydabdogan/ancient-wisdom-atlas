canonical_text:
  quote: ''
  summary: The passage introduces ceremonial customs as distinct from moral and technical
    customs, then describes Andamanese birth-related restrictions, naming practices,
    childbirth procedures, ideas about infant reincarnation, sex prediction, and practices
    for seeking children, including a reef where stones are said to have been children
    and baby souls may enter women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author distinguishes ceremonial customs from moral customs and technical
    customs, giving mourning practices such as covering the body with clay as an example.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the latter part of pregnancy and about a month after childbirth, both
    mother and father observe food restrictions, though the specific prohibited foods
    vary by informant and tribe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated reasons for parental food restrictions are that eating the foods
    may make the child ill or may make the parents themselves ill.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A baby is named before birth, after which the parents are referred to by relationship
    to the unborn child rather than by their own names until weeks after birth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: During childbirth, the woman sits in her hut on fresh leaves, supported by
    wood, assisted by matrons, and pressure is applied to the upper abdomen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The umbilical cord is cut, the afterbirth is buried in the jungle, the infant
    is washed and scraped with a Cyrena shell, and after a few days the infant is
    coated with clay.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a baby dies and the mother soon becomes pregnant again, the later child
    is said to be the same baby born again and receives the dead child’s name; this
    is said only of those who die in infancy.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'In Northern tribes, the side of the body on which a woman feels the unborn
    child is used to predict sex: left for male and right for female, linked to bow
    and fishing-net use.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: A childless married man who wants a child wears a bark child-carrying sling
    around his shoulders while sitting in camp.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A childless woman who wants a child may catch, cook, and eat a certain species
    of small frog.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At Tonmuket, women who wish to become pregnant may stand at low tide on reef
    stones said in legend to have once been little children; it is believed that a
    baby soul will enter the woman’s body and become incarnate.
  category: setting
  evidence_refs:
  - ev:11
