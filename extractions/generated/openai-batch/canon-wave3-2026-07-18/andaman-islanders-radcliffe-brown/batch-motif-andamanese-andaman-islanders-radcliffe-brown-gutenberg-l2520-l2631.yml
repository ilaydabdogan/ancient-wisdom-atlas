canonical_text:
  quote: ''
  summary: The passage analyzes Andamanese kinship terms, especially Aka-Bea forms
    recorded by Mr Man, their stems, prefixes, suffixes, gender markers, age distinctions,
    and affinal uses. It repeatedly compares selected Aka-Bea terms with Akar-Bale
    equivalents and notes possible inconsistencies in Mr Man’s list when compared
    with Akar-Bale usage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several parent-child terms are described as derived from the stems -odi-,
    -eti-, and -weǰi- or -weǰeri-, with prefixes ar- and ab- and verbal suffixes such
    as -ŋa, -re, and -yate.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The suffix -pail is described as meaning “female” and is added when female
    sex needs to be emphasized in terms for daughter, sister, granddaughter, or other
    female relatives.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:7
  - ev:9
- id: obs:3
  text: Dia ota and dia kata are reported as terms for “my son” and “my daughter”
    under three years of age, and ota and kata are identified as terms for the male
    and female genitals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dia ba is reported as a term for “my daughter” over three years of age and
    is compared phonetically with Akar-Bale dege bua.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dia ba-lola is reported for grandson-related relations, with -pail added for
    granddaughter-related relations.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: D’ar-ba is reported as applicable to the son of a sibling, half-sibling, or
    first cousin; with -pail it applies to the daughter of those relatives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Several ad en-toba- and ad en-toka- forms are reported as alternatives for
    “my elder brother,” with -pail making the term applicable to an elder sister;
    the word is compared with Akar-Bale en-toaka-ŋa.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: D’ar-doati-ŋa is reported for “my younger brother,” with -pail for younger
    sister, and is also said by Mr Man to apply to a first cousin younger than the
    speaker.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: D’ar-weǰi-ŋa or d’ar-weǰeri-ŋa are reported as alternative terms for younger
    brother and, with -pail, younger sister; the stem is noted as the same as in one
    term for mother, but with a different prefix.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dia mama and dia mam-ola are reported as terms for spouse’s siblings and various
    older affinal relatives; Mam-ola is described as implying greater respect than
    Mama.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: D’aka-kam is reported for a younger brother or younger half-brother, and with
    -pail for a younger sister or half-sister.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dia otoniya and dia otin are reported for son-in-law, daughter-in-law, and
    other younger affinal relations, and are compared phonetically and semantically
    with Akar-Bale otoni and oten.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Aka-yakat is reported as the relationship between a married couple’s fathers-in-law
    and between their mothers-in-law, and is compared with Akar-Bale aka-yat.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: D’aka-ba-bula and d’aka-ba-pail are reported as terms involving a husband’s
    younger brother and a younger brother’s wife, while the passage compares aka-ba
    with Akar-Bale aka-bua and presents a table of Aka-Bea and Akar-Bale affinal terms.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The author states that the Akar-Bale list is consistent and logical throughout
    and suggests that Mr Man’s Aka-Bea list may contain an error in two affinal assignments.
  category: speech
  evidence_refs:
  - ev:10
