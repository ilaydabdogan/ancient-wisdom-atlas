canonical_text:
  quote: ''
  summary: The passage gives several Andamanese versions of legends in which cyclones,
    floods, dances, quarrels, mourning, and acts against Puluga’s warnings lead to
    people becoming birds, fish, turtles, dugongs, other animals, or to destruction
    by storm or flood. One fragment describes ancestors surviving a flood by climbing
    a large Dipterocarpus tree; another says Puluga sent a flood destroying all living
    things except two men and two women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one Aka-Ko̱l version, there were initially no birds in the jungle and no
    fish in the sea.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Aka-Ko̱l version, ancestors made noise while the cicada was singing;
    Bilik became angry and sent a great cyclone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Aka-Ko̱l version, all the people were turned into birds, fish, turtles,
    and jungle beasts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In an A-Pučikwar flood fragment, water at Wota-emi rose over the trees, and
    some ancestors climbed into a large Dipterocarpus tree until the waters subsided.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a legend attributed to A-Pučikwar narration and probably Akar-Bale origin,
    Ko̱lwo̱t hosted a dance, became wild, and frightened the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When people tried to hold Ko̱lwo̱t, he threw them away; some fell into the
    sea and became fish and turtle, while others fell on islands and became birds
    and animals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In that version, Berep, a crab, caught Ko̱lwo̱t’s arm and stopped him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Akar-Bale version, Da Tigbul brought people to dance at Kwaičo, Da
    Karami quarreled with Da Kwo̱ko̱l, and Kwo̱ko̱l threw people into the sea or jungle,
    where they became dugong, birds, beasts, and fish.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Akar-Bale version, Da Berag bit deeply into Kwo̱ko̱l’s shoulder after
    pretending to seek red paint, and Kwo̱ko̱l died.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After Kwo̱ko̱l’s death in the Akar-Bale version, his mother Kegŋa wept, cut
    the to̱kul plant belonging to Puluga, and Puluga sent a big storm that killed
    Kegŋa and the other people there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Mr Man’s fish-origin version, women marred the chorus of Maia Ko̱lwo̱t’s
    song, he seized his bow to punish them, and fleeing people who escaped into the
    sea became dugongs, porpoises, sharks, and other fish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In another Mr Man version, Berebi bit Ko̱lwo̱t in the arm, could not detach
    his teeth, and Ko̱lwo̱t’s friends avenged the murder by throwing the corpses into
    the sea.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In that Mr Man version, Ko̱lwo̱t after death was transformed into a tree-lizard,
    and Berebi became a fish called Koŋo with poisonous barbs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the mourning song translation, the bereaved mother tells others to burn
    wax, grind Entada seed, destroy Caryota, dig up yams, and destroy everything.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: After these acts, Puluga became very angry and sent a flood that destroyed
