canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese arrow forms and manufacture: pronged
    fish-arrows, simple fire-hardened wooden-headed arrows, the construction and hunting
    use of a Great Andaman detachable pig-arrow, reported earlier material substitutions,
    and related Little Andaman and Jarawa variants.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Little Andaman, fish-arrows are sometimes made with two or four prongs
    attached to a bamboo shaft.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A North Sentinel Island arrow in the British Museum is described as having
    four prongs tied to a wooden shaft, with each prong barbed by a detached piece
    of wood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A simple arrow form in Great Andaman and Little Andaman consists of a bamboo
    shaft and a pointed wooden head hardened in fire.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the simple arrow form is now rarely used except for
    shooting at a mark, but was probably formerly used as an easier substitute for
    the described fish-arrow when iron was less plentiful.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great Andaman pig-arrow consists of a shaft, a fore-shaft, and a head;
    the shaft is made from Tetranthera lancæfolia wood and straightened by heat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Great Andaman pig-arrow head is made of iron, shaped and sharpened, inserted
    into the split fore-shaft, and bound with thread; one or two iron-wire barbs may
    be bound below the head.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A flattened cord of waxed Anadendron fibre is made and fastened between the
    shaft and fore-shaft of the Great Andaman pig-arrow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The thread holding the Great Andaman pig-arrow head, barbs, and cord attachment
    is covered with a previously described composition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In pig-hunting, the detachable pig-arrow head remains in the wound, while
    the shaft loosens, catches in jungle undergrowth, and helps hold the wounded pig
    until hunters come up and dispatch it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Great Andaman people say that before they had plenty of iron, they made similar
    pig-arrows with shell heads and pig-bone barbs.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Little Andaman people make a similar but generally longer pig-arrow, using
    Hibiscus fibre rope, Gnetum fibre binding, beeswax rather than composition, and
    usually one barb set at right angles to the head.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among the Jarawa, the pig-arrow head is attached to the fore-shaft by passing
    thread through holes made in the iron.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Another Great Andaman pig-arrow type has no detachable head and is used rarely,
    chiefly to dispatch a pig already struck by the usual arrow; the passage reports
    that such arrows were formerly preferred in fighting.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Great Andaman people formerly made an arrow with a bamboo shaft and a head
    of Areca wood.
  category: object
  evidence_refs:
  - ev:10
