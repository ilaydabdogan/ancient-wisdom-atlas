canonical_text:
  quote: ''
  summary: 'The passage describes age and kinship obligations in Andamanese social
    organization: puberty ceremonies end childhood; boys and girls enter post-childhood
    residential and service arrangements; married children continue duties to parents;
    siblings and wider relatives are treated according to age and deference; parents-in-law
    receive special respect; and a married man avoids close dealings with the wife
    of a younger man.'
  language: English
  quote_policy: summarized
