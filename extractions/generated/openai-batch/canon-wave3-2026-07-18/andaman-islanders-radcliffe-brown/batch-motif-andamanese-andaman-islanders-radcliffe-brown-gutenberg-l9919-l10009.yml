canonical_text:
  quote: ''
  summary: The passage explains uses of the terms kimil and gumul in connection with
    heat, rainy season, initiation, illness, stormy weather, and the condition following
    certain foods. It reports that clay body painting is used after eating dangerous
    foods because odor or smell may attract jungle or sea spirits and cause illness.
    It also describes smell as an active magical principle and lists foods ranked
    by danger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Aka-Bea usage, gumul is linked with the latter part of the rainy season,
    an initiate’s condition or address, and the turtle-eating ceremony gumul-le-ke;
    the passage calls this the literal equivalent of Northern kimil-ǰo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage summarizes kimil as used for heat, illness, stormy weather, the
    latter rainy season, initiation condition and ceremonies, and a food-related condition
    remedied or prevented by clay patterns on the body.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some informants said that after eating dugong, pork, turtle, and similar foods
    the body emits an odor that may attract spirits of the jungle or sea, and that
    people paint themselves with clay to prevent this.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man who has eaten dugong is said not to leave camp for some time after the
    dugong meat is finished, because spirits may smell him and harm him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage notes that clay painting does not physically remove the odor associated
    with eating fat meat.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage gives an example in which the smell of Anadendron paniculatum
    is said to enter the thigh during fibre preparation and cause rheumatic or sciatic
    pains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When asked what would happen if someone ate pork or turtle without painting,
    informants replied that the person would almost certainly become ill.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage concludes that, in the food-eating context, ot-kimil denotes a
    condition of danger associated with sickness and spirits.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage ranks foods by danger, naming dugong, komar fish, some snakes,
    certain internal fats, some fish livers, and honey as especially dangerous, followed
    by other animal foods and eggs, with molluscs and common fish and vegetable foods
    as least dangerous.
  category: attribute
  evidence_refs:
  - ev:7
