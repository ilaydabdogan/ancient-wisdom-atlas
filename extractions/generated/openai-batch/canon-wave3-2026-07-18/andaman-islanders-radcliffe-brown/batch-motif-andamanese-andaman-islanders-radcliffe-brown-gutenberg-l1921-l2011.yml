canonical_text:
  quote: ''
  summary: The passage discusses Andamanese leadership and influence. It presents
    Mr Man’s account of chiefs, sub-chiefs, succession, status, and limited authority,
    then qualifies this by saying that Andamanese leading men exercise influence rather
    than formal authority. It also describes the colonial title raja, women’s influence,
    and the distinct role of oko-ǰumu, people credited with supernatural powers over
    sickness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage warns that calling certain Andamanese men “chiefs” can be misleading
    because it suggests organised chieftainship.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mr Man describes a head chief called maia igla and elders or sub-chiefs called
    maiola, with authority described as limited or nominal.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Mr Man’s account, chiefs organise meetings, influence welfare questions,
    direct hunting, fishing, and migration parties, and intervene in disputes, but
    cannot punish or enforce obedience.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mr Man states that chiefly succession is not necessarily hereditary, though
    a qualified grown son may be preferred, and dissenters may transfer allegiance
    to another chief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mr Man links social status to relationship, hunting and fishing skill, generosity,
    and hospitality, and says chiefs, elders, and their wives may be spared drudgery
    by young unmarried persons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author says “influence” is a better term than “authority” for Andamanese
    leading men, because there is no organised rule or procedure.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that a tribe may have two or three leading men in different
    areas, each with his own following, and that influence is largely confined to
    a local group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Early Andamanese Homes officers selected certain men as raja to act as intermediaries
    between the Officer in Charge and the natives; the natives adopted the title because
    they had no word for chief.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A raja’s influence may increase if he is already respected, but the natives
    do not recognise him as having authority over them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Women may hold influence similar to men; wives of leading men often influence
    women, and women may influence quarrels, though not hunting matters involving
    men.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Certain men, and possibly women, called oko-ǰumu, literally “one who speaks
    from dreams,” are credited with supernatural powers connected with producing and
    curing sickness.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: People try to remain on good terms with oko-ǰumu by avoiding offence and giving
