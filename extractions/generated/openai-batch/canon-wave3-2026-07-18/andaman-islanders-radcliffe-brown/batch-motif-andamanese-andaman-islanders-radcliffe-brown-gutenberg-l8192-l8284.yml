canonical_text:
  quote: ''
  summary: The passage presents Andamanese legends about the origins or discovery
    of scarification/tattooing, yams, and honey. Duku scarifies himself with quartz
    despite his wife's objections, while a related version makes Maia Duku the first
    tattooed person after finding iron. Several yam legends describe animal-named
    ancestors or beings discovering, cooking, teaching, or propagating varieties of
    yam; one South Andaman version includes Bumroag being killed by his mother after
    scattering yam remains. The passage ends by noting that honey was discovered by
    Perjido, son of Biliku.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duku, identified as Monitor Lizard, lives with his wife Bain, identified as
    Civet-cat.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Duku says he will scarify himself; his wife tries to dissuade him, but he
    goes into the jungle, finds quartz, and scarifies himself all over.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Duku scarifies himself, his wife is angry, and Duku says he looks well
    and that other people will do the same.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Mr Man's version, Maia Duku, said to be identical with Tomo, is the first
    to tattoo himself after a missed arrow strikes a hard substance identified as
    the first iron ever found.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In that version, Duku makes an arrow-head from the iron, tattoos himself,
    and sings that he is tattooed and cannot be struck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator questions the accuracy of Mr Man's transcription because South
    Andaman scarification is said to use quartz or glass rather than iron or arrow-heads,
    while the song is in the Aka-Bea language.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yams and honey are identified as important foods, and yams are said in common
    belief to have been made or first discovered by Biliku or Puluga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Maia Dik, identified as Sir Prawn, discovers a single large ko̱nmo yam while
    hungry, cooks it in fire, eats part of it, and throws the remainder against a
    rock.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fragments of the ko̱nmo yam scatter, grow into new plants, and make ko̱nmo
    plentiful.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maia Pulimu, identified as Sir Fly, and Maia Mo̱ičo, identified as Sir Rail,
    kill a pig; Pulimu searches for a creeper to tie it, discovers mino yam, and later
    shows the ancestors how to cook and eat it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In an alternate version, Mimi Mo̱ičo, identified as Lady Rail, is Pulimu's
    mother; Pulimu finds a mino in the forest, brings it to her, and they roast it
    in fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Mr Man's South Andaman story, Maia Bumroag discovers the gono yam after
