candidate_motifs:
- id: motif:1
  label: first human born from enclosed plant form
  taxonomy_refs:
  - sacred_birth
  basis: J̌utpu, named as the first man, is born within a bamboo joint that splits
    open, with the passage comparing the enclosure to a bird’s egg.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The taxonomy label is approximate; the passage does not call the birth
    sacred, and the enclosure is a bamboo joint rather than an explicit cosmic egg.
- id: motif:2
  label: first people formed from clay or ant-nest material
  taxonomy_refs: []
  basis: J̌utpu molds Ko̱t and later other people from clay taken from a white-ant
    nest; another version connects Po̱ičotobut’s children with an ant’s nest.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives variant forms of the ant-nest association rather than
    a single standardized narrative.
- id: motif:3
  label: culture hero teaches arts and subsistence skills
  taxonomy_refs:
  - culture_hero
  basis: J̌utpu teaches canoes, bows and arrows, hunting, and fishing; Ko̱t teaches
    women crafts and body-pattern clay use; Po̱ičotobut teaches arts and customs.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage presents these as ancestor traditions from reported informants,
    not as a unified pan-Andamanese doctrine.
- id: motif:4
  label: world maker creates earth, lights, and people
  taxonomy_refs: []
  basis: Maia Čara is said to make earth, inhabitants, sun, moon, and daylight; Bilika
    is said by one informant to make the world and first men and women.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The Maia Čara account is undetailed, and the Bilika account is a single
    brief informant statement without a detailed legend.
- id: motif:5
  label: cosmic or weather beings as parents and children
  taxonomy_refs:
  - divine_parent_child
  basis: Tarai, the south-west monsoon, is husband of Ko̱t and father of sky, wind,
    storm, and sea foam; Bilika, another monsoon, is associated with making the world
    in a separate account.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: low
  cautions: The figures are not explicitly called divine in the passage; the taxonomy
    reference is only a broad fit for a cosmological parent-child pattern.
- id: motif:6
  label: animal progenitor of human ancestors
  taxonomy_refs: []
  basis: The passage states that Aka-Ko̱l and A-Pučikwar versions make the monitor
    lizard the progenitor of the Andaman race, and his children are the ancestors.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage notes that the versions do not say how the lizard himself
    originated.
- id: motif:7
  label: non-human wife obtained by rescue or transformation
  taxonomy_refs:
  - shapeshifter
  basis: Ta Pe̱tie marries Beyan after she rescues him in one account; in another,
    black wood found in a creek and placed over the fire turns into a woman who becomes
    his wife.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: Only the black-wood wife is explicitly transformed; Beyan’s account is
    a rescue-and-marriage episode rather than a transformation episode.
- id: motif:8
  label: death by drowning followed by change of form
  taxonomy_refs:
  - death_rebirth
  - shapeshifter
  basis: The A-Pučikwar account says Ta Pe̱tie drowns in the creek and turns into
    a kara-duku.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not explain what kara-duku is in the supplied text, and
    it does not describe a return to life.
comparison_claims:
- id: claim:1
  claim: The Aka-Bo J̌utpu story and the Aka-J̌eru Po̱ičotobut story are presented
    as versions of the same origin legend, sharing first-ancestor creation and an
    association with ko̱t, the ant’s nest or ant-nest material.
  claim_level: same_motif
  target: Aka-Bo J̌utpu origin account and Aka-J̌eru Po̱ičotobut origin account
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage notes differences in names and locations, and the Po̱ičotobut
    account uses cohabitation with an ant’s nest rather than molding clay.
- id: claim:2
  claim: The Tarai and Ko̱t genealogy is explicitly linked by the passage to the same
    ant’s-nest association found in other origin legends.
  claim_level: same_motif
  target: Aka-J̌eru Tarai-Ko̱t account and ant’s-nest-associated origin accounts
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The Tarai account is brief and does not describe human origins directly
    in the quoted summary, only named children and the retained association with Ko̱t.
- id: claim:3
  claim: The Aka-Ko̱l and A-Pučikwar monitor-lizard narratives share the function
    of making Ta Pe̱tie the progenitor whose children are ancestors, while giving
    different wife-acquisition episodes.
  claim_level: same_function
  target: Aka-Ko̱l and A-Pučikwar monitor-lizard progenitor accounts
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage states there are several versions but provides only two
    summarized narrative examples in this range.
- id: claim:4
  claim: The two Ta Pe̱tie wife-acquisition accounts show a repeated pattern in which
    a non-human or non-ordinary female becomes the progenitor’s wife and enables ancestor-descendants.
  claim_level: same_motif
  target: Beyan rescue-marriage account and black-wood transformation-marriage account
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: Beyan is an animal figure while the other wife is transformed wood;
    the equivalence is functional and thematic rather than identical in plot details.
