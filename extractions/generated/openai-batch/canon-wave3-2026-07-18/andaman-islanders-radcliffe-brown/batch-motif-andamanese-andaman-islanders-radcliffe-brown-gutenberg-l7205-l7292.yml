canonical_text:
  quote: ''
  summary: 'The passage reports several Andamanese origin traditions: ancestor titles;
    divergent accounts of the first people; J̌utpu born from a bamboo joint and creating
    a wife and ancestors from clay associated with a white-ant nest; Po̱ičotobut emerging
    from a Sterculia buttress and obtaining children through an ant’s nest; Tarai
    and Ko̱t as parents of named cosmic or weather beings; Maia Čara and Bilika as
    makers of the world and people; and monitor-lizard progenitor accounts in which
    Ta Pe̱tie obtains a wife through rescue by Beyan or through a piece of black wood
    becoming a woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says ancestors are generally named with appropriate titles, which
    differ by language or tribe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says there is no unanimity, even within a single tribe, about
    how mankind originated.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Aka-Bo legend, J̌utpu is the first man, born inside the joint of a
    large bamboo; the bamboo splits and he comes out as a little child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: J̌utpu makes huts, bows, and arrows as he grows, and scarifies himself with
    a lump of quartz.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: J̌utpu, being lonely, takes clay from a white-ant nest, molds it into a woman,
    and the woman becomes alive as his wife Ko̱t.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: J̌utpu later makes other people out of clay, and these people are called the
    ancestors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: J̌utpu teaches the ancestors canoe-making, bow-and-arrow making, hunting,
    and fishing; his wife teaches women basket, net, mat, and belt making, and the
    use of clay for body patterns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: An Aka-J̌eru account says the first man, Po̱ičotobut, comes out of the buttress
    of a Sterculia tree, cohabits with an ant’s nest, obtains many children, and teaches
    arts and customs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another Aka-J̌eru account names Tarai, the south-west monsoon, as the first
    man, with Ko̱t as his wife and Tau, Bo̱to, Piribi, and Air as their children.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Maia Čara account says the first living being made the earth, peopled
    it, made the sun and moon, and makes daylight every day in one commonly received
    account.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: One Aka-Kede informant says Bilika, the north-east monsoon, made the world
    and the first men and women, but gives no detailed legend.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In one monitor-lizard account, Ta Pe̱tie goes into the jungle to hunt pig,
    gets stuck in a Dipterocarpus tree, is released by Beyan the civet-cat, marries
    her, and their children are the ancestors.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In another monitor-lizard account, Ta Pe̱tie finds black wood in a creek,
    places it above the fire in his hut, and it turns into a woman who becomes his
    wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The same account says Ta Pe̱tie and the woman have a son named Po̱i and many
    later children; after a long time Ta Pe̱tie drowns in the creek and turns into
    a kara-duku.
  category: sequence
  evidence_refs:
  - ev:9
