candidate_motifs:
- id: motif:1
  label: Stolen game hidden in a tree and avenged by impalement
  taxonomy_refs: []
  basis: Both the Bumu/Berakwe narrative and Mr Man's Maia Čo̱l version center on
    a pig theft, tree refuge, stakes or spikes around the tree, forced descent, and
    fatal impalement.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes theft of pigs but does not mark the pigs as sacred;
    no sacred-theft taxonomy reference is assigned.
- id: motif:2
  label: Tree refuge reversed into trap
  taxonomy_refs: []
  basis: Berakwe and Maia Čo̱l use a tree as refuge after taking pigs, but the injured
    party plants stakes and makes the tree sink or forces it down, causing death.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The tree is functionally important, but the passage does not identify
    it as sacred or cosmic.
- id: motif:3
  label: Dead ancestor located on an afterlife bridge with bird descendants
  taxonomy_refs:
  - afterlife_journey_map
  basis: In Mr Man's version, Maia Čo̱l's spirit does not go to Čaitan but lives on
    an invisible bridge, and descendants are sent to him as black long-tailed birds.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The narrator cautions that Čo̱l should not be treated simply as 'spirits'
    and identifies them as birds; the afterlife geography comes specifically from
    Mr Man's recorded version.
- id: motif:4
  label: Monsters devour a community while a tree-top survivor escapes
  taxonomy_refs: []
  basis: The male and female Uču eat all the people except Pe̱tie, who survives because
    he is up in a high tree.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: Only one survivor is named; no survivor-pair taxonomy reference is appropriate.
- id: motif:5
  label: Swallowed people released from monster bellies
  taxonomy_refs: []
  basis: Pe̱tie cuts open the stuck Uču, and the people they swallowed whole come
    out.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage says the people were swallowed whole and came out; it does
    not explicitly state that they died and were resurrected.
- id: motif:6
  label: Etiological petrifaction into visible rocks
  taxonomy_refs: []
  basis: The Uču are identified with limestone rocks present to this day, and Kwo̱ko̱l
    with his bow and arrows is turned into stone and remains visible.
  evidence_refs:
  - ev:8
  - ev:11
  - ev:13
  confidence: high
  cautions: The passage contains transformations into stone, but not voluntary shapeshifting.
- id: motif:7
  label: Post-initiation rule breach punished by petrifaction
  taxonomy_refs:
  - initiation
  basis: Kwo̱ko̱l's ra-gumul status is linked to a rule against handling bows after
    the pig-eating ceremony, and Mr Man's version explicitly says neophytes fail to
    observe rules, go fishing, and are petrified.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: The first brief Kwo̱ko̱l version states the petrifaction but leaves the
    rule breach implicit; Mr Man's version makes the neophyte-rule violation explicit.
- id: motif:8
  label: Mythic monster name transferred to introduced animal
  taxonomy_refs: []
  basis: After elephants are introduced, they are named Uču or J̌irmu, names already
    associated with huge monsters in the passage.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:12
  confidence: medium
  cautions: This is an ethnographic naming observation rather than a narrative episode.
comparison_claims:
- id: claim:1
  claim: The Bumu/Berakwe story and Mr Man's Maia Čo̱l/Maia Ko̱lwo̱t account are presented
    as versions of the same story, sharing pig theft, tree refuge, spikes, forced
    descent, and impalement.
  claim_level: same_motif
  target: Mr Man's Maia Čo̱l version of the pig-theft and impalement tale
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The figure names and some outcomes differ, especially the added afterlife
