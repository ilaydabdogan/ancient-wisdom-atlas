canonical_text:
  quote: ''
  summary: 'The passage gives several Andamanese legends and ethnographic notes: a
    bird-pig theft tale with retributive impalement; Mr Man''s related Čo̱l version
    with an afterlife bridge and bird descendants; a note on a huge jungle monster
    named J̌irmu/Uču; a Uču legend in which monsters devour people and become rocks;
    and a petrifaction legend connected with post-initiation restrictions and a parallel
    version recorded by Mr Man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Da Bumu and Da Berakwe, both identified as species of birds, go hunting pigs
    together and obtain many pigs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Berakwe sends Bumu away to fetch cane, climbs a large Dipterocarpus tree with
    all but one very small pig, and leaves the small pig behind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yakoŋ, Bumu's wife and a species of fish, goes out at night to get fish, passes
    under the tree, is burned by falling resin, and sees Berakwe cooking the pigs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bumu places pointed Areca-wood stakes around the tree, makes the tree sink
    into the ground, and Berakwe falls onto the stakes and dies; Bumu and his wife
    recover the pigs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mr Man's version names Maia Čo̱l as the pig thief and Maia Ko̱lwo̱t as the
    original captor of the pig; it repeats the tree, spikes, forced descent, and fatal
    impalement sequence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Mr Man's version, Maia Čo̱l's disembodied spirit does not pass to Čaitan
    but lives on an invisible bridge, where descendants are sent by Puluga in the
    form of black long-tailed birds.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator clarifies that Čo̱l is the name of a bird species, probably the
    racket-tailed drongo, and notes that although Mr Man says the birds live on the
    rainbow, they are seen and heard in the jungle.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Across the Great Andaman there is said to be a belief in a huge animal, called
    J̌irmu in the North Andaman, that haunted the jungle and killed men and women
    in the days of the ancestors.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Akar-Bale name Kočurag-boa and the A-Pučikwar name Uču are presented as
    names for the same or a similar monster; Uču is also applied to two limestone
    rocks near Wota-emi.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ta Pe̱tie, Sir Monitor Lizard and the first ancestor, climbs a čo̱ti tree
    to eat fruit, throws fruit down to the people, is bullied for more fruit, and
    calls the Uču after being laughed at.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A male and a female Uču come, catch and eat all the people except Pe̱tie,
    who remains in the high tree; after eating heavily the Uču become stuck in sand
    and mud at the edge of a mangrove swamp.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Pe̱tie finds the Uču stuck fast, cuts open their bellies, and all the swallowed
    people come out; the Uču are said to remain there to the present day.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: After elephants are introduced into the Andamans, the Akar-Bale call them
    Uču and northern tribes call them J̌irmu.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Ra-gumul Kwo̱ko̱l goes fishing in the sea with bow and arrows, and he, his
    bow, and his arrows are turned into stone and are said to be visible there.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: Ra-gumul is explained as a youth or girl who has just passed through the pig-eating
    ceremony; a youth is not permitted to handle a bow for several days after that
    ceremony.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:16
  text: Mr Man's version describes Tomola neophytes who break rules after their fast,
    go to the shore to fish, and are found petrified, one attached to a boulder and
    another standing beside it.
  category: sequence
  evidence_refs:
  - ev:15
