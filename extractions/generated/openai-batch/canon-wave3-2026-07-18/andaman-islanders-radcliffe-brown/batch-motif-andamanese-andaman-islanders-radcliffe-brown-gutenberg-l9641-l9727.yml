canonical_text:
  quote: ''
  summary: The passage explains Andamanese beliefs and ceremonies in which particular
    plants, fibres, leaves, and woods are used as protective substances or amulets.
    Their ritual uses are linked to practical uses in turtle hunting, pig hunting,
    fighting, purification after homicide, first menstruation, protection from sea
    dangers, and an opposition between forest and sea domains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hibiscus fibre is used mainly in hunting turtle and large fish, and the Hibiscus
    tree is believed to ward off dangers connected with turtle and the sea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turtle flesh is said to be cookable only with Hibiscus wood; otherwise it
    is considered uneatable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the turtle-eating ceremony, an initiate regarded as in danger after eating
    turtle for the first time following abstention sits on Hibiscus leaves, holds
    a bundle of the leaves, sees them used in the dance, and receives a Hibiscus-wood
    skewer for eating.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If Hibiscus leaves are unavailable in the turtle-eating ceremony, leaves of
    Myristica longifolia are used; Myristica is also used for canoe paddles used in
    turtle hunting.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage states that Hibiscus and Myristica are believed to have powers
    that help conquer turtle and protect from evil influences associated with eating
    turtle flesh.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the pig-eating ceremony at initiation, Tetranthera leaves are used instead
    of Hibiscus or Myristica, and the tree supplies shafts for pig-arrows.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tetranthera leaves are believed to help destroy dangers resulting from eating
    pig, parallel to the relation between Hibiscus and turtle.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tetranthera leaves are also used in the ceremony at a girl's first menstruation,
    and the passage links this to the use of pig-arrows in fighting and to the shedding
    of blood.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A homicide must wear plumes of shredded Tetranthera wood during a purification
    period as protection against dangers believed to threaten him because he has shed
    blood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Shredded Tetranthera wood was formerly carried in dances before fights and
    rubbed on bows to ensure success in battle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage presents a general hypothesis that substances have protective
    power because society depends on them in daily life and because of their particular
    material uses.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: Anadendron paniculatum fibre is used for thread, bowstrings, pig-arrow cords,
    and binding harpoon and arrow heads and barbs, and is said to have no special
    relation to either pig or turtle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A piece of Anadendron tied around the neck or worn in a swimmer's belt is
    believed to protect from sharks and other dangerous fish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A crushed piece of Anadendron placed in the sea is said to have stopped a
    violent storm on one occasion.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Gnetum edule is described as having similar sea-danger protective power, though
    less powerful than Anadendron because its fibre is less valued.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage explains Anadendron and Gnetum as forest things opposed to things
    of the sea, within a broader contrast between jungle-dwellers and coast-dwellers.
  category: relationship
  evidence_refs:
  - ev:9
