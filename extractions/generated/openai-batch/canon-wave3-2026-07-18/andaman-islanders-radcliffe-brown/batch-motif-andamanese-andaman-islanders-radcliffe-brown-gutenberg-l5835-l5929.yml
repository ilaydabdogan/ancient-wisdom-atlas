canonical_text:
  quote: ''
  summary: The passage describes Andamanese beliefs that burning or melting beeswax,
    gathering certain plant foods, or making noise while cicadas sing may offend Puluga
    or Biliku and bring storms or bad weather. It discusses the cicada as Biliku's
    child or under Puluga's protection, a silence taboo at dawn and dusk, avoidance
    of killing adult cicadas while eating their grubs seasonally, and a December rite
    called “killing the cicada” in which the whole community makes loud noise at sunset
    to end the cicada season and produce fine weather.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Burning and melting beeswax are stated to anger Puluga.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gathering specified vegetable foods in the later rainy season and early cool
    season is described as an action that may offend Biliku; after an Entada pod was
    cut, a native predicted a storm as a result.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cicada is said to sing during the short intervals between dawn and sunrise
    and between sunset and darkness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Great Andaman tribes, people refrain from making noise while the cicada
    is singing, including stopping a song until the cicada is silent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Breaching the noise prohibition is explained as angering or offending the
    cicada and therefore Puluga or Biliku, bringing bad weather or storm.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:6
  text: In North Andaman the cicada is commonly called the child of Biliku; in Mr
    Man's reported account the butu, identified here as the cicada, is under Puluga's
    special protection.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:7
  text: Mr Man reports that the first parents were told by Puluga not to work after
    sundown in the wet months because noise would worry the butu.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Another account reported by Mr Man says that between dawn and sunrise people
    do no work except noiseless work lest the sun be offended and cause eclipse, storm,
    or other misfortune.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The prohibition against killing the cicada is described as applying to the
    full-grown form; cicada grubs are killed and eaten in October and November as
    a delicacy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the December rite called “killing the cicada,” all members of the community
    gather in camp before sunset and then make loud noises and shout after sunset
    to drown out the cicadas until after darkness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The stated purpose of the rite is to produce fine weather and to kill the
    cicadas left after the people have eaten the grubs; after the rite the cicada
    disappears for some weeks and fine weather follows for four months.
  category: sequence
  evidence_refs:
  - ev:8
