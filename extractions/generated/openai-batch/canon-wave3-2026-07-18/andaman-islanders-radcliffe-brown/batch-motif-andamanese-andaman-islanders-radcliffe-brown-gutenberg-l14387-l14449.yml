  summary: The passage is an ethnographic conclusion about Andamanese technical culture.
    It reconstructs probable pre-isolation material culture, describes later internal
    technological changes, and offers provisional hypotheses about possible earlier
    adoption of pottery and the outrigger canoe from an external, possibly Nicobar-related,
    population.
