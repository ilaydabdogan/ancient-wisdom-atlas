canonical_text:
  quote: ''
  summary: 'The passage gives scholarly notes on Andamanese beliefs and legends: cicada
    respect is linked with seasons; spirits are grouped by forest, sea, and sky/tree-tops;
    Biliku/Puluga is associated with storms, tabus, the N.E. monsoon, a spider, and
    a cave or hole; a snake called or-čubi/wara-ǰobo is linked with honey, fine weather,
    and preventing rain; ancestors’ magical powers are interpreted as representing
    the social value of tradition. The passage also includes cautions about source
    interpretation and a brief comparative note on a Central Australian lizard taboo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some respect paid to the cicada is said to be due to its connection with the
    seasons of the year.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage describes a threefold division of spirits: spirits of the forest,
    spirits of the sea, and Morua, who are called sky spirits but are often thought
    to live in the tops of tall trees.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A belief is recalled that a man who goes into the water after eating civet-cat
    will be unable to swim.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A geographical name, Puluga-l’ar-mugu, means the Puluga front or the side
    facing Puluga, and refers to a part of the archipelago facing the northeast.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Violent storms or cyclones are generally said to result from the anger of
    Biliku, but the passage also notes a conflicting belief that storms are made by
    spirits, especially spirits of the sea.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The name of the N.E. monsoon appears in variants such as Öluga, Puluga, Bilik,
    Bilika, and Biliku; the name is also applied to the spider in the North Andaman
    and to the monitor lizard in the Little Andaman.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Tabus connected with Biliku are described as risk beliefs rather than absolute
    prohibitions: if certain things are done, Biliku may become angry and storms may
    result.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
