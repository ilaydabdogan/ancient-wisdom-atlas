canonical_text:
  quote: ''
  summary: The passage describes Andamanese round and communal huts, their central
    common space, fires, trophies, family portions, sleeping arrangements, and architectural
    derivation from rectangular roof shelters. It then compares Semang temporary shelters,
    including tree shelters and palm-leaf shelter forms, with Andamanese shelters
    and explains differences by mobility and local environmental conditions.
  language: English
