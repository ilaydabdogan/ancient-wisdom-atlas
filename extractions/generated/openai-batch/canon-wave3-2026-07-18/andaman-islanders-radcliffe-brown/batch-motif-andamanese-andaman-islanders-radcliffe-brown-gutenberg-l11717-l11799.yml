  text: The so-called round hut is not always regularly circular; it may be oval,
    though its shape generally approaches a circle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Round huts vary in size with the number of occupying families, can have thatch
    reaching the ground in exposed situations, and have a low doorway on one side.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Inside the round hut is a central common space corresponding to the village
    dancing ground; in the wet season it contains the communal fire and communal cooking
    area.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Jarawa huts have pig-skull trophies of the chase hung from the central roof,
    and Great Andaman Division people formerly hung similar trophies in round huts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Spaces around the central area are allotted to different families and marked
    off with short lengths of wood laid on the ground.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author describes Andamanese architecture as based on a single rectangular
    roof open at the front, with camp arrangements producing long and round communal
    hut types.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each family has its own small fire for meals and a small platform beside it
    for storing food.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Sleeping arrangements vary: Little Andaman people use low bamboo bed platforms,
    Great Andaman people commonly use leaves and mats on the ground or raised floors
    in damp places, and Jarawa may sleep in wood-ashes of their fires in cold-weather
    hunting camps.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some Semang groups remain mobile, do not camp in one place for more than a
    few days, and therefore build only temporary shelters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Semang often build shelters in trees above ground; the passage distinguishes
