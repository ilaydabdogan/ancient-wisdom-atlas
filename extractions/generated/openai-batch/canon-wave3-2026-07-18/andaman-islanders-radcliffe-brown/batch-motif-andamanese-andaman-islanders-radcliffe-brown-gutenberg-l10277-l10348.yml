canonical_text:
  quote: food is a possession of the society
  summary: The passage explains Andamanese initiation ceremonies as a form of moral
    education. Children learn practical skills from elders, then pass through food
    abstentions and solemn or painful ceremonies. These restraints are presented as
    imposed by society and tradition, teaching self-control, respect for elders, conformity
    to custom, fear of unseen danger, and the idea that access to food and its safe
    use carry social obligations.
  language: English
  quote_policy: quoted
