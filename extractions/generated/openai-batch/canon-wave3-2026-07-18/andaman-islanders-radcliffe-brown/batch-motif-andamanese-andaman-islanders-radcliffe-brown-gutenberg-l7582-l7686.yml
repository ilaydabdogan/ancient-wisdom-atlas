candidate_motifs:
- id: motif:1
  label: theft of fire for ancestors or people
  taxonomy_refs:
  - sacred_theft
  basis: Many versions describe fire being stolen or taken from a possessor such as
    Bilika, Bilik, or Puluga, often while that possessor sleeps, and then passed to
