canonical_text:
  quote: ''
  summary: The passage presents several Andamanese versions of legends about the origin
    or acquisition of fire. In many versions, ancestors or people lack fire, while
    figures such as Bilika, Bilik, or Puluga possess it. Birds, fish, or other beings
    steal, fetch, receive, or pass on fire to ancestors. Some versions explain visible
    features of animals, the origin of the sun, or local place names through events
    involving fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one version, Maia Dik makes fire, Maia Totemo steals fire from him and
    cooks fish, and Maia Mite later steals fire from Maia Totemo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In another version, Piribi obtains fire from a stone, throws fire at Bilika,
    and burning yam leaves become the source from which Čo̱rolo obtains fire and gives
    it to the ancestors.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator says the two obscure versions were taken down in Aka-Čari, but
    may belong to Aka-Ko̱ra or Aka-J̌eru, and that the translation of piribi is doubtful.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Aka-Kede version, the ancestors have no fire, Bilika has fire, and
    Lirtit steals it while Bilika is sleeping.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bilika throws a pearl shell at Lirtit, cutting off his wings and tail; Lirtit
    dives into the water, swims with the fire, and passes it through Te̱pe and Mite
    to others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In an Aka-Kede sun-origin legend, Bilika makes fire from purum wood and throws
    a large fire-brand into the sky, where it becomes the sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The place-name Purum-at-čape is explained as connected with purum, fire or
    firewood, and village or hut.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In an Oko̱-J̌uwo̱i story reported by Portman, Mo̱m Mirit steals a fire-brand
    while Bilik is sleeping and gives it to Leč, who makes fire at Karat-tatak-emi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In an Aka-Ko̱l story reported by Portman, Luratut takes fire while Bilik is
    sleeping; Ko̱lotat carries fire onward, rekindles it from embers after it goes
    out, and the people become alive owing to the fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In an A-Pučikwar version, the ancestors at Wota-emi have no fire, Bilik makes
    fire from pe̱rat wood, and Luratut steals fire while Bilik is sleeping.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the A-Pučikwar version, Bilik throws a lighted brand at Luratut, burns
    the back of his neck, Luratut gives fire to the people, and Bilik goes away to
    live in the sky.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The kingfisher in the A-Pučikwar story is said to have a bright red patch
    on its neck where it was burnt by Bilik’s brand.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: In Portman’s A-Pučikwar variant, Luratut steals fire, Bilik burns Luratut
    and Tarčal with fire, Čalter takes the fire and gives it to the ancestors, and
    the ancestors make fires.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: In an Akar-Bale version, Dim-do̱ri fetches fire from the place of departed
    spirits, throws it at the people, burns and marks them, and the people run into
    the sea and become fishes.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Akar-Bale Dim-do̱ri story is said to account for the bright colouring
    of certain species of fish.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: In Portman’s similar Akar-Bale version, Dim-do̱ra brings fire from Puluga’s
    platform or fireplace, burns everybody, and named figures fall into the sea and
    become fishes.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Other Akar-Bale legends say that Puluga gave fire to the first ancestors,
    or that the ancestors obtained fire from Aga the skink.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: Mist hanging over the jungle after rain or at dawn is said to be the smoke
    of Aga’s fire, and an island is called Aga’s village.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:19
  text: In an Aka-Bea legend reported by Portman, Puluga is asleep, Luratut steals
    fire, the fire burns Puluga, Puluga burns Luratut, Luratut burns Tar-čeker, and
    the ancestors light fires.
  category: sequence
  evidence_refs:
  - ev:14
