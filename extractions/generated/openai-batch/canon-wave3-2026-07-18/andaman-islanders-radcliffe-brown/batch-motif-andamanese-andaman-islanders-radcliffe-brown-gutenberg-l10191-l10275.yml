canonical_text:
  quote: ''
  summary: The passage describes Andamanese preservation of animal skulls, especially
    dugong and turtle skulls, and J̌a̤rawa preservation of pig skulls. It interprets
    animal bones as protective and luck-bringing when related to proper ritual practice.
    It then discusses clay body patterns after eating dangerous foods as a communal
    rite connected with danger, sacred food, social solidarity, and comparison to
    grace before and after meals. The passage closes by introducing initiation ceremonies
    as social mechanisms that teach the value of food and transform a dependent child
    into an independent member of society.
  language: English
  quote_policy: summarized
