canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese hunting camps, camp-site preferences,
    kitchen-middens, and two types of communal hut: a long shelter corresponding to
    linear hunting-camp arrangement and a round hut corresponding to village huts
    around a central open space. It gives construction details, fire and sleeping
    arrangements, and notes a debated or occasional centre-post in some Great Andaman
    round huts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jarawa hunting camps are sometimes arranged like Great Andaman Division camps,
    with huts facing one direction and set as nearly in one line side by side as the
    site permits.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the observed Little Andaman hunting camp, huts were irregularly arranged
    to make best use of available space.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The islands are described as entirely forest-covered, and camps are avoided
    under high trees when possible because of falling branches in storms.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Preferred camp sites include an open space surrounded by forest for shelter
    from wind, immediate jungle near sea or creek for coast-dwellers, hill or ridge
    positions for forest-dwellers, and proximity to fresh water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Jarawa take defensive precautions by clearing trees around camps for visibility
    and apparently placing look-out stations at path tops, unlike Great Andaman Division
    tribes as described here.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Long-used coast-dwelling encampment sites contain accumulated kitchen-middens
    made of shells, animal bones, cooking stones, pottery fragments, and loam from
    decayed refuse.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two camp-arrangement types, associated with village and hunting camp, are
    said to be exhibited in two different types of communal hut.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The long shelter is rectangular, described as 40 feet by 12 feet, with a roof
    supported by three rows of posts and a single sloping roof line from back to front.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The long shelter has twelve fire places, food platforms near each fire, and
    two rows of sleeping places separated by small poles into rectangles probably
    occupied by a man, his wife, and small children.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The long shelter brings all members of one local group together under a single
    roof and is related to the ordinary family hut and linear hunting-camp arrangement.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The round hut corresponds to village huts arranged around a central open space
    and is reported as formerly used in the Great Andaman Division and presently built
    by Little Andaman natives and the Jarawa.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The typical round hut is built with two circles of posts, roof timbers, palm-leaf
    mats tied with cane, overlapping thatch, and a small central opening for fire
    smoke to escape.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Typical round huts of the Jarawa and Little Andaman are described as having
    no centre-post; the passage reports evidence that Great Andaman round huts may
    sometimes have had one.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage states that the round hut developed from the village by drawing
    small huts together and lengthening thatching mats to meet and overlap in the
    middle.
  category: sequence
  evidence_refs:
  - ev:12
