canonical_text:
  quote: ''
  summary: 'The passage surveys Great Andamanese relationship and address terminology:
    compound terms for older cousins, half-siblings, spouses, step and adoptive kin;
    respectful address terms for males, females, parents, grandparents and in-laws;
    relative-birth-order terms; and social-status terms for married older or younger
    persons. It stresses that several terms are address forms or social-status descriptions
    rather than strict consanguineal kin terms.'
