canonical_text:
  quote: ''
  summary: The passage states a functional interpretation of Andamanese ceremonial
    customs, gives methodological rules for explaining customs, and begins interpreting
    the Andamanese marriage ceremony. The ceremony requires bride and bridegroom to
    embrace publicly; in North Andaman the embrace proceeds by stages from sitting
    side by side, to arms around one another, to the bridegroom sitting on the bride's
    lap. The author interprets the physical embrace as expressing affection and symbolizing
    the social union of marriage.
  language: English
