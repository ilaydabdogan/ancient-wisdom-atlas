canonical_text:
  quote: ''
  summary: Radcliffe-Brown introduces an interpretation of Andamanese myths and discusses
    the Akar-Bale legend of the origin of night and day. He connects the legend with
    the cicada's twilight song, its cry when hurt, the prohibition on killing it,
    and a narrative sequence in which an ancestor kills a cicada and darkness covers
    the world. He then interprets day as socially active and comparatively secure,
    and night as socially inactive, insecure, and associated with fear of spirits.
  language: English
  quote_policy: summarized
