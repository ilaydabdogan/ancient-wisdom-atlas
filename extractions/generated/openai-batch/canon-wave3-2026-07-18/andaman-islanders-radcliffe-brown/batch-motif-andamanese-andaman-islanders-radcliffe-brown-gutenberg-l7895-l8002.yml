canonical_text:
  quote: ''
  summary: The passage gives an Akar-Bale song and explanation involving Berebi’s
    jealousy of Ko̱lwo̱t, a boat encounter, a rusty adze, and a blood threat. It then
    records several Andamanese accounts of flood, fire preservation, cataclysm, tribal
    dispersion, language differentiation, a netted-bag dispersal by Bilika, and Mr
    Man’s account of Puluga-directed dispersions, a punitive flood, four canoe survivors,
    and re-creation of animals and birds.
  language: English with Akar-Bale and Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The translated song commands that a boat be brought to the beach, refers to
    a grown-up son, says an adze is rusty, and threatens to stain lips with the son’s
    blood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Berebi is described as jealous of Ko̱lwo̱t’s renown, accomplishments, and
    strength, and asks to enter a boat occupied by Ko̱lwo̱t and his mother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After entering the boat, Berebi provides himself with a rusty adze and hone,
    sniffs Ko̱lwo̱t’s arm from wrist to shoulder, mutters a blood threat, and later
    fulfills it as previously described by the source.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Akar-Bale story says that in the time of the ancestors a great storm came,
    water rose over the land, and rain put out the fires.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Da Duku takes a smouldering log and tries to climb a tree with it, but cannot
    climb while holding the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Bain takes the fire from Duku, carries it to the top of a hill, and keeps
    it alight until the rain stops and the water goes away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hill in the fire-preservation story is said to be called Bain l’it-čapa,
    meaning Bain’s fire, to the present day.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mr Portman connects the flood story with a dispersion of ancestors over the
    islands and reports that tribal names were given by Maia Tomo-la after a cataclysm.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Portman’s account says the Andaman Islands were formerly larger, part of the
    islands subsided in a cataclysm, many aborigines drowned, and the remainder were
    separated into different territories by Maia Tomo-la.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The South Andaman dispersion legend is connected with the A-Pučikwar tribe,
    whose name is explained as meaning those who talk the original language.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Aka-Kede version, Bilika seizes all the ancestors, puts them in a netted
    bag, removes them a few at a time, and places them in different parts of the country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mr Man’s account says Tomo’s offspring became too numerous for their home,
    and at Puluga’s bidding were furnished with weapons, implements, and fire, then
    scattered in pairs with distinct dialects.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After Ko̱lwo̱t’s death, one legend says the tomola became disobedient and
    Puluga, in anger, sent a great flood without warning that covered the whole land
    and destroyed all living.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Four named persons, two men and two women, escape the flood because they are
    in a canoe when the catastrophe occurs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: When the waters subside, the four survivors land near Wota-emi and find that
    every living thing on earth has perished; Puluga then re-creates the animals,
    birds, and similar beings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A second exodus occurs after numbers again increase; each party receives fire
    and essentials, starts in a different direction, adopts a new dialect, and receives
    a tribal name.
  category: sequence
  evidence_refs:
  - ev:9
