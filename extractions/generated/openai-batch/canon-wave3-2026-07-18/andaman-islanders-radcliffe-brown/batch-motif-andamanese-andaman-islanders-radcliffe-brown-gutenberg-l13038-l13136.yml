canonical_text:
  quote: ''
  summary: The passage describes Andamanese techniques for making string, rope, cords,
    sleeping mats, thatching, and related woven or twined objects, noting materials,
    regional variations, uses, repair practices, and gendered labor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: String or thread is made by both men and women and is used for binding arrow,
    harpoon, spear, and bow parts, and for nets, baskets, mats, and personal ornaments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The string-making process begins with fibre strands rolled singly between
    the right palm and right thigh away from the body, then two strands are rolled
    together inward toward the body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a short length is twisted, the thread is rolled once in the opposite
    direction to make it more compact, and fresh strands are added continuously to
    increase length.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'String materials vary by region: Great Andaman uses Anadendron, Gnetum, and
    Hibiscus scandens; Little Andaman uses Gnetum and ulu fibre.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Great Andaman, Anadendron-fibre string may be made more durable by waxing
    with black bee's-wax, while Gnetum and Hibiscus scandens string are not said to
    require this treatment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ornamental rope for men's belts in Great Andaman is made from a Hibiscus fibre
    strand covered spirally with strips of Dendrobium skin and twisted into a two-ply
    cord.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Other cord forms include bow-strings and a special cord for attaching a pig-arrow
    head to its shaft; plaited cord is said to be little used.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Little Andaman sleeping mats are made from bamboo strips attached by thin
    cane strips at right angles, using a wrapped-twined technique.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A similar technique is used in Little Andaman and Great Andaman for making
    thatching from cane leaves, though the wrapping differs from the bamboo mat technique.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Great Andaman sleeping mats are made from the outer sheath of Calamus tigrinus
    leaf-stem, cut into uniform strips and fastened with thread wound onto two netting
    needles.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'North Andaman mat-making uses wrapped-twined work: one thread is held taut,
    with its needle held in the toes, while another thread is wrapped spirally around
    it, enclosing cane-leaf sheath strips.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'South Andaman mat-making uses twined work or fitching: two weft threads are
    twisted together in the same direction and enclose one leaf-sheath strip at each
    half turn.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mats vary from about one metre to ten metres; in use, about one and a half
    metres is unrolled, while the remainder may serve as a pillow.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: When a mat wears out in one part, the worn part may be kept rolled up while
    an unbroken part is used, and an old mat may be lengthened by additions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The work of making these mats is performed only by women.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Jarawa people and Little Andaman people are said to make mats of a somewhat
    similar pattern, but the author had not secured one to determine the construction
    method.
  category: other
  evidence_refs:
  - ev:8
