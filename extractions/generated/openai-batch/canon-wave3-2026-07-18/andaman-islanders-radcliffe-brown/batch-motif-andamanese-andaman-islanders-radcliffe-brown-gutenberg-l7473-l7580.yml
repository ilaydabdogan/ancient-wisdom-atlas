canonical_text:
  quote: ''
  summary: 'The passage records several Andamanese legends concerning Bilika/Biliku/Bilik/Puluga:
    a giant Bilika bridges a creek with her leg for Porokul; Porokul raises the low
    sky with a bow; another Bilika kills people who eat his special plant foods and
    is killed by the ancestors; Bilik/Puluga lives across a strait and/or goes to
    the north-east after conflict with the ancestors. The passage then gives multiple
    fire-origin stories in which fire is made, possessed, stolen, swallowed, recovered,
    or distributed by Biliku and bird figures such as dove, kingfisher, heron, rail,
    and others.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bilika lies on one bank of a creek and stretches her leg to the other bank
    so that Porokul can cross while carrying a pig.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Porokul makes a large bow; when he lifts it upright, its top strikes the low
    sky and lifts the sky to its present position.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One version describes Bilika as male, living with wife Mite and a child.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ancestors eat plants described as Bilika’s food, and Bilika smells their
    mouths and cuts the throats of those who have eaten it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ancestors kill Bilika and Mite, and Maia Burto carries Bilika’s child
    away to the north-east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator states uncertainty about the Aka-Kede legend and suggests that
    the child of Bilika may be the one who now lives in the north-east and sends storms.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In an A-Pučikwar account, ancestors live at Wota-emi while Bilik lives opposite
    them across a strait at To̱l-l’oko-tima; a hollow in a rock is said to mark where
    Bilik sat on earth.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In an Akar-Bale legend, Puluga becomes angry when the ancestors eat certain
    plant foods, destroys their huts and property, and is sent out of the world to
    the north-east.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator notes that the homes of Puluga or Bilik are north-east from the
    places of the ancestors and separated by a narrow strait in two cases.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that many legends tell how the ancestors first obtained
    fire and that North Andaman commonly says fire was stolen from Biliku by Maia
    Tiritmo, Sir Kingfisher.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: In an Aka-Čari legend, Biliku obtains fire by striking a red stone and a pearl
    shell together; while she sleeps, Mite steals fire and gives it to the village
    and other places.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In an Aka-J̌eru version, Lirčitmo steals fire while Biliku sleeps, swallows
    it when seen, is struck by Biliku’s pearl shell and beheaded, and the ancestors
    obtain the fire from his neck.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Another story says Tiritmo makes fire by striking rotten piń wood on a rock,
    gives fire to Čo̱kčura, who gives it to Totemo, who gives it to others.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A shorter version says Tiritmo made fire, Totemo stole it from Tiritmo and
    gave it to Mo̱ičo, and Mo̱ičo gave fire to all the people.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: In another version, an arrow hits a hill of fire; Tiriń finds the burning
    arrow, keeps fire for himself, and others steal fire from his hut at night.
  category: sequence
  evidence_refs:
  - ev:13
