candidate_motifs:
- id: motif:1
  label: giant body used as bridge across water
  taxonomy_refs: []
  basis: Bilika’s leg spans the creek so Porokul can cross with the pig.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents a single Aka-Kede example; no broader comparison
    is made in the passage.
- id: motif:2
  label: raising the low sky with an oversized object
  taxonomy_refs:
  - ascent
  basis: Porokul’s upright bow strikes the low sky and lifts it to its present position.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy term 'ascent' only partly fits; the passage describes
    the sky being lifted rather than a journey upward.
- id: motif:3
  label: anger over consumption of special plant foods
  taxonomy_refs: []
  basis: Bilika and Puluga become angry when ancestors eat plants described as their
    foods; Bilika kills offenders, and Puluga destroys property.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage does not frame the foods as a formal taboo; it only says they
    belong to or are the food of Bilika/Puluga.
- id: motif:4
  label: angered being expelled or removed to the north-east
  taxonomy_refs:
  - departure
  basis: Puluga is sent out of the world and goes to the north-east; Bilika’s child
    is also carried away to the north-east, with the narrator uncertainly linking
    the child to the being who now sends storms.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The child’s later identity and storm-sending role are explicitly uncertain
    in the passage.
- id: motif:5
  label: theft of fire from Biliku by a bird figure
  taxonomy_refs:
  - sacred_theft
  basis: The passage states a common North Andaman claim that fire was stolen from
    Biliku by Sir Kingfisher, and gives versions where Mite or Lirčitmo steals Biliku’s
    fire.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: Different versions name different animal or bird figures as the thief.
- id: motif:6
  label: fire distributed through a chain of animal figures
  taxonomy_refs:
  - culture_hero
