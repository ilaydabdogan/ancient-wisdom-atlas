  summary: The passage reports Andamanese accounts and customs concerning lunar and
    solar eclipses, personified night and daylight makers, sky beings associated with
    daylight, lightning, thunder, and rain, and several explanations of rain involving
    the sky-stone, a pool, or a female sky being.
