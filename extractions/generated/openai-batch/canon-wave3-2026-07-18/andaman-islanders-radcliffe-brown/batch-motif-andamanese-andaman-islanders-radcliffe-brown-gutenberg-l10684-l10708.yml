  summary: The passage interprets Andamanese funeral customs. It states that burial
    mode corresponds to the deceased person's social value, that corpses are decorated
    with white clay and red paint as an expression of regard, that fire and water
    are placed beside the grave as symbolic acts rather than necessarily as provisions
    for the spirit, and that mourning customs help reorganize continuing social ties
    after death.
