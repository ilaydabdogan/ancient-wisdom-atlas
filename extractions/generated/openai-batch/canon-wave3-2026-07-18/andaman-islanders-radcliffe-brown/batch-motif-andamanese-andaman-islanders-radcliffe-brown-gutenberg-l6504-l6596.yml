canonical_text:
  quote: ''
  summary: 'The passage reports and then critiques Mr Man''s account of Andamanese
    afterlife beliefs: an invisible cane bridge to J̌ereg, a cold punitive place below
    it, soul and spirit terminology, resurrection on a new earth, and a final earthquake
    commanded by Puluga. Radcliffe-Brown cautions that the account may combine inconsistent
    statements and may overstate resemblance to Christian doctrine.'
  language: English
  quote_policy: summarized
literal_observations:
