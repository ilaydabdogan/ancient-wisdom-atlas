  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In serious illness, the sufferer’s čauga is said to hover between this world
    and Hades and, after death, to haunt the deceased person's abode and the place
    where remains were deposited.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In dreams, the soul is said to depart through the nostrils and experience
    the dream events represented to the sleeper.
  category: action
  evidence_refs:
  - ev:3
