canonical_text:
  quote: ''
  summary: The passage summarizes and interprets an Andamanese legend in which an
    ancestor's killing of a cicada brings darkness over the world. The ancestors use
    resin torches, invent dancing and singing, and the light returns; thereafter day
    and night alternate and the cicada sings at transitions. The passage also discusses
    Da Teŋat's arrow-led discoveries of the yam, resin, and cicada; the magical power
    of arrows and ancestors; the revealing of names; and nearby Aka-Bea variants concerning
    the first yam and first darkness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A primordial ancestor, later discussed as Da Teŋat, kills or crushes a cicada
    under the influence of anti-social passion or anger.
  category: action
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:2
  text: The cicada utters its cry, and the world becomes covered with darkness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ancestors make torches of resin, which partly neutralize the darkness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The ancestors invent dancing and singing; after they continue for several
    hours, the light returns.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: After this event, day and night regularly alternate, and the cicada sings
    at each period of change.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Later people learn to use resin as artificial light and to address the effects
    of darkness by dancing and singing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:7
  text: The story groups Da Teŋat's discoveries as one new animal, the cicada; one
    new vegetable, the yam; and one new mineral, resin, which is classified in the
    passage as a kind of stone despite its vegetable origin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arrows are said to possess magical power; an ancestor's arrow can strike an
    important object, lead to discovery, and give a degree of power over the object
    so that it reveals its name.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Da Teŋat's unaimed shooting of arrows is interpreted as an act of anger after
    unsuccessful fishing, and these arrows lead him to the yam, resin, and cicada.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: An Aka-Bea version recorded by Mr Man is said to have ancestors bring about
    first darkness because they were annoyed by the continuous heat of the sun.
  category: sequence
  evidence_refs:
  - ev:7
