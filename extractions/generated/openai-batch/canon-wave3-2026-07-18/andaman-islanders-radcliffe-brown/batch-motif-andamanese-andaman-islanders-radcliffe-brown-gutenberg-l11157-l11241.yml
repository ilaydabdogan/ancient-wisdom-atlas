canonical_text:
  quote: ''
  summary: Radcliffe-Brown interprets several Andamanese fire, animal-origin, kingfisher,
    and flood/storm legends. The passage says fire is treated as the center and condition
    of human social life; ancestors who fled, lacked, or lost fire became animals,
    while those who possessed or preserved fire remained human. It also summarizes
    variants in which the kingfisher steals fire from Biliku, gains red neck feathers
    from fire or lightning, and in some versions becomes a bird unable to use fire
    or, in one Aka-Kede variant, becomes a man. A flood/storm legend is interpreted
    as an alternative expression of the same relation between fire, humanity, and
    animals.
  language: English
  quote_policy: summarized
