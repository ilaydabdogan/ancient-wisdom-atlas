canonical_text:
  quote: ''
  summary: The passage is a sequence of explanatory notes to Andamanese legends, names,
    customs, and prior sources. It mentions a possible bamboo birth of the first man,
    a place-name meaning the cave of Tarai, fire-related customs and legends, an informant’s
    comparison of Tomo with the Christian God, Lirtit becoming a man after losing
    wings and tail, the giant ancestor Dik, a huge legendary animal named Kočurag-boa,
    spirit speech, and etiological marks on fishes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author notes that giant bamboo does not grow in the Andamans, that pieces
    drift ashore from Burma, and that the bamboo from which the first man was born
    may have been such a drifted piece; he adds that he did not ask about this point.
  category: object
  evidence_refs:
  - ev:1
