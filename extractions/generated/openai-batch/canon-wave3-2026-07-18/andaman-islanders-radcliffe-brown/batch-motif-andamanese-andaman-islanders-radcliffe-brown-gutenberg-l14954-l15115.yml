  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small platform of sticks is placed near or above the fire for keeping food
    and drying objects.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Akar-Bale man raised as a Christian explained Tomo to the author as equivalent
    to the Christian God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author states that before European settlement the Andamanese had no means
