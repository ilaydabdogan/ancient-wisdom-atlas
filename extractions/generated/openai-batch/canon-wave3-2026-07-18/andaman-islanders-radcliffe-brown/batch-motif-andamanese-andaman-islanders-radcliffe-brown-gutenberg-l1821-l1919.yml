canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese social organization: private ownership
    of food combined with expected redistribution, seniority in food shares and community
    decisions, gendered labor, respectful terms of address for elders, use of such
    titles for legendary ancestors and celestial bodies, and influence gained by personal
    qualities rather than formal office.'
  language: English
  quote_policy: summarized
