canonical_text:
  quote: by death a man or woman becomes a Lau.
  summary: The passage interprets Andamanese death and burial customs as collective
    ritual responses to the loss of a social member. It states that the dead person
    becomes a Lau, that mourning is customary and time-limited, and that funerary
    treatment varies by the deceased person’s social position. It describes disposing
    of the body, abandoning the death camp, avoiding the name, placing a notable leader’s
    body in a tree, and neutralizing a stranger’s corpse by sea disposal or burning.
  language: English
  quote_policy: quoted
