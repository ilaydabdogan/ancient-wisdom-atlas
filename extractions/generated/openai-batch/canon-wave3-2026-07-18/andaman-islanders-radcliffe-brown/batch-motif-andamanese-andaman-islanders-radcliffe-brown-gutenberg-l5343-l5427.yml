canonical_text:
  quote: ''
  summary: The passage reports Andamanese beliefs about personified natural phenomena,
    especially the sun and moon, while noting contradictions among statements. It
    gives several tribal variants in which the sun and moon are spouses and the stars
    are their children, a legend in which the moon becomes a pig and kills a hunter,
    statements about Tomo as a sky being connected with daylight, weather, the dead,
    ancestry, and the making or regulation of the moon, customs for dimming fires
    when the moon rises, and explanations of lunar phases through cloud coating, a
    visible tongue, and the term “baby moon.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Andaman Islanders personify natural phenomena such
    as the sun and moon, and that different statements about such beliefs can be contradictory.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A common statement in all tribes identifies the sun as the wife of the moon
    and the stars as their children; in North Andaman, larger and smaller stars are
    named with terms also used for a beetle and a fire-fly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another North Andaman version says the moon is female, has a husband named
    Maia Tok, and the sun is male.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In an Aka-J̌eru belief, the moon can turn himself into a pig, descend to earth,
    and feed on things eaten by pigs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Aka-J̌eru legend, Maia Čoinyop shoots the moon in pig form; the moon
    kills Čoinyop, cuts off his head, carries the body to the sky, and eats it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In A-Pučikwar statements, the moon may be male with the sun as wife, or the
    moon may be female and wife of Tomo; Tomo is associated by one informant with
    fine weather and daily daylight.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tomo is said to live in the sky, where it is always day and fine, and the
    spirits of the dead are said to go up to the sky and live with him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Another statement says Tomo made the moon out of opalescent stone and in some
    way regulates its passage across the sky.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A belief found in North and South Andaman tribes says the moon becomes very
    angry if fire or bright light is visible when he rises shortly after sundown.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the moon’s evening rising, people are described as covering fires so they
    smoulder, preserving silence, stopping work or travel, and nearly extinguishing
    light or fire until the moon has ascended somewhat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The glowing appearance of the full moon near the horizon is said to indicate
    Maia Ogar’s anger, and he may punish people by withdrawing or diminishing his
    light.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: In an Aka-Bea explanation, the moon waxes and wanes because he gradually applies
    a coating of cloud to his person and then wipes it off, compared with use of red
    paint and white clay.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In an Aka-Kede explanation, the moon’s tongue hangs out by varying amounts
    and the visible tongue gives the light; in North Andaman the new moon is called
    the “baby moon.”
  category: attribute
  evidence_refs:
  - ev:9
