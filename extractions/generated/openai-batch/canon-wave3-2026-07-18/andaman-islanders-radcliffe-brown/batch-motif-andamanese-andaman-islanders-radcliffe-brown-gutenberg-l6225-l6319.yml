canonical_text:
  quote: ''
  summary: The passage describes a performer named Kobo, said by local informants
    to have died, returned to life, visited the world of spirits, and gained magical
    knowledge. It then describes his exceptional dance performance, including songs,
    chorus, comic dance movements, and impersonations of Biliku, jungle spirits, and
    Ele the lightning. The passage closes by introducing Andamanese beliefs about
    the vital principle and the burning of a slain enemy so that blood and fat ascend
    in smoke to the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kobo was said to have died and come back to life, and this was given as the
    reason for his special magical powers and reputation as a medicine-man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the period when Kobo was said to be dead, he was supposed to have visited
    the world of spirits, seen a dance involving spirits and supernatural beings,
    learned about spirits, and remembered these things after returning to life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The performance occurred one afternoon on the village dancing ground, with
    spectators seated around the swept space and a few women acting as chorus.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kobo sat in a hut at one end of the dancing ground and wore a bunch of leaves
    thrust into the back of his belt, with no other ornament mentioned.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kobo sang songs with a short refrain; the women’s chorus repeated the refrain
    and clapped time on their thighs while he came out, danced, and returned to the
    hut.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Several dances used modified ordinary dance steps and included violent dancing,
    feigned injury, scratching and laughter, bashfulness, tiptoe standing, stamping,
    crouching, and walking around the open space.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: One song mentioned the tide going down over the reef, walking around the world,
    and great wind and rain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: One dance represented Biliku through Kobo holding a shell, looking fiercely
    at spectators, and threatening to throw the shell at them; the passage identifies
    the intended gesture as Biliku threatening people with her pearl-shell, or lightning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another dance represented the jungle spirits by using a screen of bido leaves
    as a Calamus palm clump, after which Kobo came out with a bow and arrow and pretended
    to shoot at spectators.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Another dance represented Ele, the lightning, with Kobo sitting on a stone
    in the open space, swinging his arms to the chorus, and shaking his leg at intervals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The observer regarded the performance as exceptional, possibly invented by
    Kobo, and noted that Kobo was reluctant to repeat or explain it.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that the Andamanese identify the vital principle at different
    times with pulse, breath, blood, and fat, and that the body of a slain enemy is
    burned so blood and fat are consumed in smoke and ascend to the sky.
  category: sequence
  evidence_refs:
  - ev:10
