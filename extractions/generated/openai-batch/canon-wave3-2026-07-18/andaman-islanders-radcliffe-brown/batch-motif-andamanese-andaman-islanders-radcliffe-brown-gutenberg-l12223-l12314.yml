  quote: ''
  summary: The passage gives a technical description of the North Andaman bow, its
    shape, fibre bow-string with loops at both ends, the method of half-stringing
    and fully stringing it, and the practice of seasoning and storing the bow over
    a constantly burning hut fire.
  language: English
