literal_observations:
- id: obs:1
  text: The bow is described as having two blade-shaped portions that taper to points,
    with a waist or handle between them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The upper blade is straight, while the lower blade is curved outward in nearly
    every newly made or used bow of this type.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The North Andaman bow-string is made from Anadendron fibre and has a loop
    or eye at both ends.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: To half-string the bow, one loop is slipped over the top end, the bow is laid
    inside downward, a foot is placed on the middle, the lower end is bent upward,
    and the other loop is slipped over the end.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the half-strung position the string passes on the outside of the bow, reversing
    the bow and placing it under a strain that curves it outward.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A newly completed bow is strung in the reversed position and placed over a
    fire so that the lower curved blade is immediately above the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Smoke and heat from the fire season the lower portion of the bow, and seasoned
    examples are blackened on the inner surface of the lower part.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man places his bow over the fire of his own hut, which is kept constantly
    burning day and night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: For use, the bow is held by the handle and the string is pulled so that the
    bow reverses from half-strung into the fully strung position.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bow is hardly ever entirely unstrung; when not in active use it is kept
    half-strung and hung over the fire.
  category: sequence
  evidence_refs:
  - ev:8
