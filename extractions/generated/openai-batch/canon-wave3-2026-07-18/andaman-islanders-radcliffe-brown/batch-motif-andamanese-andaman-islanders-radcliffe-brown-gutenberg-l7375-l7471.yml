canonical_text:
  quote: ''
  summary: The passage recounts variants of Tomo's death and transformation, stories
    and beliefs about Biliku or Puluga living on earth in ancestral times, an Aka-J̌eru
    legend in which Biliku kills canoe occupants with pearl shells and becomes rocks
    with her stone, and several North Andaman statements about Biliku, Pe̱rǰido, Tarai,
    family relations, inventions, foods, earth-making, and weather phenomena.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One version says Tomo fell into the creek Yara-tig-ǰig while hunting, drowned,
    and was transformed into a kara-duku.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the same version, Čana Elewadi went by canoe or skiff with grandchildren
    to look for Tomo; Kara-duku upset the craft, drowning her and most companions;
    she became a small crab named elewadi, and the others became lizards called duku.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another version says Tomo found a čidi or Pinna shell-fish on the shore; it
    fastened on him until a baian or Paradoxurus seized the čidi and freed him at
    the cost of one of his members.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the alternate version, Tomo upset the canoe carrying his wife and children
    because he did not want them to know of his misfortune; the occupants and Tomo
    drowned, after which he became kara-duku and the others became duku.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports a general belief that Biliku or Puluga lived on earth
    in the time of the ancestors, with tribal locations identified as places where
    Biliku or Puluga lived.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Aka-J̌eru legend, people caught a turtle, offered some to Biliku, and
    after she refused they stored the meat and left; Biliku then ate the whole turtle
    and slept.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When people in a canoe refused to take Biliku with them, she threw pearl shells;
    the third shell struck the canoe, killed all the people in it, and the canoe with
    its occupants became a reef of rocks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Biliku placed a round stone in the sea, the stone floated, and she mounted
    it to cross; halfway across, Biliku and the stone sank and became two large rocks
    that remained there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator states that the pearl shells thrown by Biliku seem to be lightning,
    and that the round stone is the one she rolls about to make thunder.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: One statement says Biliku made the sun and the moon, invented things made
    and used by women such as baskets and nets, discovered fire, and discovered edible
    roots including ko̱nmo and mino.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Another statement says Biliku made the earth or forest, beginning at Čaura.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Several statements give variant family relations for Biliku, naming husbands,
    children, bird children, and other relatives including Tarai, Pe̱rǰido, Mite,
    and named birds.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
- id: obs:13
  text: One statement says Pe̱rǰido invented the arts of the Andamanese, including
    bows and arrows.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tarai is described as having very long legs and a short body; when he sleeps
    his heavy breathing makes the wind.
  category: attribute
  evidence_refs:
  - ev:11
