canonical_text:
  quote: ''
  summary: The passage lists and explains Akar-Bale kinship and address terms for
    parents, children, grandparents, siblings or age-mates, spouses, in-laws, step-relatives,
    and adopted or foster relatives. It distinguishes biological, affinal, adoptive,
    respectful-address, and relative-age uses, and includes several explicit comparisons
    with North Andaman terminology.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens with a vocabulary list glossing Akar-Bale terms for father,
    mother, child, grandparent, grandchild, older and younger siblings, children-in-law,
    consort, in-law relations, step relatives, adopted relatives, and older or younger
    relatives.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Da is described as a common respectful form of address to an older man; dege
    da generally refers to the speaker’s own father, although the address term itself
    does not imply relationship.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In is described as a common form of address to women; deg’ in refers to the
    speaker’s own mother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ab-atr describes the relationship of a father to his child and is said to
    convey a physiological relation between father and children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ar-bua can refer to the speaker’s own child, to a sibling’s child, or to an
    unrelated person of the same generation as the speaker’s children; the passage
    presents it as describing age or generation rather than relationship alone.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ar-kodire refers to the own child of a man, while ab-atet refers to the own
    child of a woman.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mama is glossed as grandparent but is also used as a respectful address for
    much older persons and can refer to grandparents, parents-in-law, and other senior
    relatives.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: J̌at is explained as grandchild and appears to be a reciprocal of mama, applicable
    by an old person to children of the generation of the person’s grandchildren.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: En-toaka-ŋa means a person born before the speaker, and ar-dotot means a person
    born after the speaker; both can be used for non-relatives as well as relatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author reports not discovering a term that would distinguish a person’s
    own brother or sister from other persons of the same age, while noting uncertainty
    about whether such a word exists.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Otoni and oten denote a daughter’s husband and a son’s wife respectively,
    and are also applied to a younger sister’s husband and a younger brother’s wife
    respectively.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Aka-yat names the relationship between a person’s parents and that person’s
    parents-in-law.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Aka-bua is applied by a man to his wife’s younger siblings and by a woman
    to her husband’s younger siblings.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ab-i-ŋa means consort, either husband or wife, and is derived from a verbal
    stem meaning to marry.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ep-taruo-ŋa denotes a step-child or younger step-brother or sister, while
    ot-čat-ŋa means adopted and is used in expressions for adopted child and foster
    father.
  category: relationship
  evidence_refs:
  - ev:8
