  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women may quarrel, swear, destroy belongings, or fight with fists or sticks;
    the quarrel can only be stopped by a woman of influence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Serious quarrels are said to be prevented by the influence of older men and
