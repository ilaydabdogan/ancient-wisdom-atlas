canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese treatment of anti-social actions without
    formal punishment: private injury, vengeance, quarrels, anger, feuds, loss of
    esteem, food obligations, and one refusal of initiation privations sanctioned
    only by contempt and ridicule.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there did not appear to be punishment of crime in
    the Andamans and distinguishes private injuries from actions disapproved by society
    generally.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Private anti-social actions listed include murder or wounding, theft, adultery,
    and wilful damage to another person's property.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Quarrels between men may involve swearing, an angry man seizing a bow, discharging
    an arrow near the offender, or destroying property.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During a display of anger, women and children flee into the jungle, and a
    slight show of authority can bring the scene to an end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After an occasional murder, the murderer generally leaves camp and hides in
    the jungle while relatives and friends of the dead man may exact vengeance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man liable to violent anger is feared, treated with outward respect, unlikely
    to gain esteem, and in North Andaman is denoted by the nickname Tarenǰek.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Quarrels at meetings of different local groups may end in murder and produce
