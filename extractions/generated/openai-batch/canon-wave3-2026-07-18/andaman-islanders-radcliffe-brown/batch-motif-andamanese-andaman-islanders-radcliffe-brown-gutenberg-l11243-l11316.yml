canonical_text:
  quote: ''
  summary: The passage connects several Andamanese flood/catastrophe legends as variants
    of one remembered event. Across versions, the flood or cyclone is linked with
    the near loss and rescue of fire, the transformation or origin of animals from
    ancestors, bird figures associated with fire, and specific tribal versions involving
    a storm caused by breaking firewood during cicada song, a world-destroying storm,
    and a bird lowering survivors with their fire from a Dipterocarpus tree.
  language: English
  quote_policy: summarized
