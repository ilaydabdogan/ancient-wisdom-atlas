canonical_text:
  quote: ''
  summary: The passage reports an Akar-Bale legend about a stone at a particular spot
    said to have been used by ancestors for adzes, followed by the observer's rejection
    of its historical value. It then describes the Andamanese use of shell, especially
    Cyrena shell, as a cutting and scraping implement, its carrying between camps,
    supply from coastal friends to inland groups, and the hand technique for using
    it.
