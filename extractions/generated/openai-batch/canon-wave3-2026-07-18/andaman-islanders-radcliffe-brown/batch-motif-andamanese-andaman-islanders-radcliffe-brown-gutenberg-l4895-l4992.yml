canonical_text:
  quote: ''
  summary: 'Ethnographic description of Great Andaman dance customs: ceremonial and
    ordinary contexts, night setting in the village center, preparation of the dancing
    ground, use of fires, resin lights, sounding-board, male singer/timekeeper, women’s
    chorus, male dancers, song structure, dance steps, posture, duration, and regional
    differences between Northern and Southern tribes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Initiation ceremonies include special dances connected with pig-eating and
    turtle-eating ceremonies; apart from these, the peace-making dance, and local
    exceptions, a tribe has only one main kind of dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same essential dance form is used at the end of mourning, before an attack
    on enemies, and after successful hunting on a fine evening.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Outside specified ceremonies, dancing takes place at night after the evening
    meal.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dance occurs on open ground in the center of the village; women and younger
    men sweep the ground clean, fires are lit, and resin heaps are placed to provide
    light.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A sounding-board is placed near one end of the dancing ground; one man beats
    time on it with his foot. The board is a hard Pterocarpus wood piece shaped somewhat
    like a large shield.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women forming the chorus sit in a row behind or beside the sounding-board,
    while men intending to dance stand or sit around the edge of the dancing space.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A volunteer male singer stands at the sounding-board, sings the song, leads
    the chorus, and marks time by foot-beating on the board; women repeat the chorus
    and mark time by clapping on the hollow formed by their thighs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dancers begin when the chorus begins; each dancer uses the same step, with
    little attempt to form a figure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: When a singer and chorus tire, singing may cease while time-beating continues;
    singers relieve one another, and a dance may continue for five or six hours.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: In North Andaman, a singer sings the whole song once and the chorus repeats
    it three or four times; in South Andaman, the singer sings a verse and refrain,
    and the chorus repeats the refrain indefinitely.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Southern dance step alternates right-foot and left-foot sequences of hop,
    scrape, and hop; dancers bend forward, may interlock thumb and forefinger of both
    hands with arms extended, rest by raising heels alternately, and move around or
    across the dancing ground while keeping time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Northern tribes are said to have adopted the Southern dance, but formerly
    used a slightly different circular movement with forward steps, hops, and scrapes;
    a variation called ko̱i strikes and scrapes each foot alternately.
  category: action
  evidence_refs:
  - ev:6
