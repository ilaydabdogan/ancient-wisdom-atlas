canonical_text:
  quote: ''
  summary: The passage describes procedures and aftermath of the turtle-eating ceremony,
    ritual naming and name substitution, altered food permissions and prohibitions,
    the subsequent pig-eating ceremony, and minor first-eating ceremonies that remove
    remaining food prohibitions among coast-dwelling Northern Andamanese communities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the turtle-eating ceremony the youth returns to his hut, resumes his
    former position, may talk and sleep, retains Hibiscus leaf bundles and Pothos
    leaf necklace and belt, and participates in repeated dances before resuming ordinary
    life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a week or two after the ceremony the youth may not touch bow and arrow;
    the Pothos leaves are worn until faded; body paint wears off while ears remain
    painted red; for some weeks he is considered in an abnormal condition and watched
    by friends.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the turtle-eating ceremony a new name is given to the youth, but the passage
    says such names do not seem to be used afterwards in speaking of or addressing
    the person.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage gives an example of an Aka-J̌eru youth whose birth name, nickname,
    and two turtle-ceremony names are listed, with the ceremony names not used in
    address.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: During and for some months after the turtle-eating ceremony, the youth or
    girl is not addressed or spoken of by personal name but by a substitute term such
    as Kimil in Northern tribes or Guma in Aka-Bea.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the turtle-eating ceremony, a coast-dwelling youth or girl may eat turtle
    flesh and some previously forbidden foods, but remains forbidden to eat turtle
    liver, turtle intestinal fat, pork, and other foods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The new period of food prohibitions may last months or longer and is ended
    by a pig-eating ceremony described as similar in many ways to the turtle-eating
    ceremony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the pig-eating ceremony a boar is required for a youth and a sow for a
    girl; the youth is seated on Tetranthera leaves and a boar carcass is pressed
    on his shoulders and back, while the girl is not treated this way.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the pig-eating ceremony the pork is cooked; the youth is anointed and fed
    fat, rubbed with red ochre, massaged, splashed with clay, and required to sit
    silent with arms crossed under Tetranthera leaves for a day and a night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the silent period of the pig-eating ceremony the youth may eat only
    pork and must use a Tetranthera wood skewer rather than touching the food with
    his hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the following day of the pig-eating ceremony the youth is decorated with
    white clay and red paint and dances; the dance uses Tetranthera rather than Hibiscus
    leaves and includes stamping with one foot rather than leaping with both feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the pig-eating ceremony, pork and some previously forbidden foods become
    permitted, while other prohibitions are later removed through minor ceremonies
    in which older men rub the food over the initiate’s mouth before it is eaten silently.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage says there is no regular order for removing most remaining food
    prohibitions, except that the turtle and pork ceremonies follow a rigorously observed
    order and are the two chief ceremonies.
  category: sequence
  evidence_refs:
  - ev:6
