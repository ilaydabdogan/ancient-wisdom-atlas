canonical_text:
  quote: ''
  summary: The passage describes Andamanese marriage arrangement by elders and parents,
    mediated communication and reciprocal gifts between future affines, North and
    South Andaman marriage ceremonies, post-wedding practices, widow remarriage, and
    reported levirate and sororate obligations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marriages are arranged by older men and women, and infants may sometimes be
    betrothed by their parents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a young man of marriageable age has formed an attachment with a girl,
    his parents discuss the matter with him and arrange communication with the girl's
    parents through friends rather than directly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two sets of parents avoid direct speech once a marriage is possible, communicate
    through a third person, exchange presents of food and other objects, and reciprocate
    such presents with equal value.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a marriage is arranged, the parents on both sides enter a relationship
    called aka-yat in Akar-Bale.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the North Andaman ceremony, the bride sits on a mat at one end of the dancing
    ground while the bridegroom sits with his friends at the other end; torches or
    resin fires are lit nearby.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A respected elder addresses the bride and bridegroom about marital duties
    and fidelity, then leads the bridegroom to sit beside the bride.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Relatives and friends weep during the ceremony, and the bridegroom may try
    to run away but is caught by prepared friends.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder places the arms of the bride and bridegroom around each other's
    necks and later makes the bridegroom sit on the bride's lap for several minutes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the ceremony, the wider community may dance, but the newly married pair
    do not join; a hut is ready for them, friends give useful objects, and the couple
    retire shyly to the hut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The day after the ceremony, friends decorate the bride and bridegroom with
    white clay, supply them with food for the early days, and refer to them by spouse-based
    descriptions rather than by personal names.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The South Andaman ceremony is described as much the same as the North Andaman
    ceremony, except that the bridegroom is made to sit on the bride's lap immediately
    after being led to her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A widow may marry again if she wishes, though it is generally not considered
    fitting before the end of mourning; Mr Man says about a year should elapse, but
    the author knew one case after about a fortnight.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mr Man reports a custom in which a bachelor or widower is nearly compelled
    to propose to a childless widow of his elder brother or cousin, and a childless
    widower is similarly obliged to marry his deceased wife's younger sister.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The author did not encounter a recent actual case of marriage to an elder
    brother's widow, but says questioned natives confirmed Mr Man's statement and
    notes ambiguity in kinship terms such as 'younger brother.'
  category: other
  evidence_refs:
  - ev:9
