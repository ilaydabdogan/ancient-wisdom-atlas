canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese social relations: the aka-yat relationship
    between parents-in-law, a similar avoidance-and-gift relation between men who
    underwent certain eating ceremonies together, a relationship system emphasizing
    age and social status more than kin categories, and friendly intergroup relations
    maintained by marriage, adoption, visits, gifts, and hospitality.'
  language: English
