  summary: The passage describes Andamanese local groups as small residential and
    land-owning units, discusses reported group sizes, larger friendly clusters called
    septs by Portman, local group naming by district or camp, rules of residence and
    marriage, and territorial hunting and fishing rights requiring permission from
    other groups.
