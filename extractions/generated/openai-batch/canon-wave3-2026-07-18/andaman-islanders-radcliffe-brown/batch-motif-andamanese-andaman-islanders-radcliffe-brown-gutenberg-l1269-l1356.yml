literal_observations:
- id: obs:1
  text: Mouat reported that Andamanese people were usually seen living together in
    several huts in one locality, with group sizes varying widely, while the author
    treats thirty to fifty persons as a plausible average for ordinary groups.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author concludes from native information that an average local group consisted
    of about forty to fifty persons, with about ten local groups to a tribe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Portman's term "septs" is treated by the author as referring not to single
    local groups but to larger clusters of four or five friendly local groups that
    sometimes met at festival gatherings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Local groups did not strictly have distinctive names; they could be referred
    to by the district, creek, island, coast, or chief camping place associated with
    them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man or woman was generally regarded as belonging to the local group in whose
    country he or she was born, but could reside with another group if welcomed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: When two young people from different local groups married, they might reside
    either with his parents or with her parents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The local group is described as the land-owning group; members could hunt
    in their own territory, while outsiders required permission to hunt or fish there.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author reports observing men ask and receive permission to hunt pig from
    a man described as an owner of that part of the country and survivor of the local
    group to which it belonged.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In former times, hunting or fishing in another group's country or waters without
    permission could lead to a serious quarrel.
  category: sequence
  evidence_refs:
  - ev:6
