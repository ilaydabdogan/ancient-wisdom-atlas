canonical_text:
  quote: ''
  summary: The passage catalogs Andamanese beliefs and practices concerning magical
    properties of plants, animal substances, bones, and fire, including a taboo around
    flowering Pterocarpus, plant-based remedies and protections, animal-related sickness
    etiologies and cures, apotropaic bones, and fire used against spirits and sickness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pterocarpus dalbergioides is described as a striking Andaman tree with hard
    red wood used by the natives for sounding-boards.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: An A-Pučikwar belief is reported that looking at flowering Pterocarpus is
    dangerous; stories say people who saw the flowers went mad or died, men avoid
    looking too long, and North Andaman string games are not played while the tree
    is in flower.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tetranthera lancæfolia provides wood for pig-arrow shafts; its leaves are
    said to keep away forest spirits, and shredded wood plumes are worn by a man who
    has killed another to protect him from the dead man’s spirit.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gugma leaves are used as a bed, body-rub, or inhaled odor for sick patients;
    the plant’s smell is said to have medical properties and to drive away turtle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Alpinia leaves and stems are chewed and swallowed for certain ailments, and
    chewed leaves or saliva are applied around honeycomb to prevent bee stings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Several unidentified plants are used as remedies by crushing, moistening,
    rubbing, drinking, tying on a limb, or heating and applying to wounds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports named trees and plants about which people say that anyone
    cutting them will become blind.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Black beeswax is heated and smeared on the chest for pleurisy and is also
    believed to keep away forest spirits; snake skin from a killed snake may be applied
    to a snake bite.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Animal-related beliefs include hiccough attributed to swallowing a tree lizard,
    numb limbs to rat bite, cramp to civet-cat bite or eating civet-cat before entering
    water, flying-fox flesh or fat as a rheumatism remedy, and turtle-fat burning
    in fire as a cause of storm.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Human bones are valued for driving away spirits and curing or preventing sickness;
    a moving human jaw-bone in a hut was blamed for illness, and animal bones are
    made into similar ornaments with similar magical properties.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Fire is said to keep away spirits of the sea and forest, is kept beside sick
    people, and heated stones from a fire are used in a dysentery treatment.
  category: action
  evidence_refs:
  - ev:10
