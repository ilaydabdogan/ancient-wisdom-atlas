literal_observations:
- id: obs:1
  text: The ordinary Great Andaman dance movements are described as not obviously
    expressive or mimetic, with their apparent function being to activate many muscles
    of the body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dance posture includes bending at the hips and knees, a slightly backward
    head poise, arms held in line with the shoulders, crooked elbows, and clasping
    of the thumb and first finger of each hand with those of the other.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The posture is said to produce balanced muscular tension, flexibility, and
    alertness without strain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The dancer uses sight to guide movement among others and hearing to keep time
    with the music.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Every adult member of the community takes some part: able-bodied men dance,
    women join the chorus, and those unable to participate actively are spectators.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dance takes place in the centre of the village, in an open space toward
    which the huts usually face.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes the dance and song as enabling members of the community
    to cooperate harmoniously and act in unity through rhythm and melody.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Marked rhythm is said to constrain those under its influence, directing bodily
    and mental movement; resisting it produces restlessness, while yielding to it
    produces pleasure.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The constraining force of rhythm is described as acting both from outside
    the individual, through friends dancing and sounds of singing and time-marking,
    and from inside the individual, through an organismic impulse to yield.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rhythmic action is said to reduce fatigue, increase the dancer's felt personal
    energy, and, with rapid movement, loud sound, and collective emotion, allow strenuous
    dancing through many hours of the night.
  category: sequence
  evidence_refs:
  - ev:6
