canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Andamanese naming practices: a birth-name
    selected before birth, later nicknames, and for girls a puberty flower-name taken
    from the tree or plant flowering at first menstruation; the flower-name is used
    through unmarried life and generally until after marriage or first childbirth,
    after which the birth-name or nickname is used again.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Every Andaman Islander is described as having a personal birth-name given
    before birth; the pregnant woman and her husband begin choosing it when pregnancy
    is realized.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The parents select the birth-name, while suggestions from friends and relatives
    are considered.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Naming a child after a man or woman is described as a compliment, and a request
    to have the child named after someone is rarely refused.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Birth-names are stated to be applicable to both sexes, and several men and
    women may bear the same name.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Many common names are names of objects, including trees, fish or other animals,
    rope, mats, plant foods, turtle, honey, stone, knife, and oriole.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some names have uncertain derivations, and native explanations of their meanings
    do not always agree.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A child receives a nickname some time after birth; nicknames may be given
    at any time of life, and one person may have several nicknames.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During childhood, boys and girls are addressed by either birth-name or nickname.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When a girl reaches puberty she receives a new name selected from a limited
    group of names that are tree or plant names.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The puberty name given to a girl is the name of the tree or plant in flower
    at the time of her first menstruation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage describes a succession of trees and plants flowering throughout
    the year, and says parts of the year are described by reference to plants then
    in flower.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The seasonal plants selected have flowers from which native bees make honey;
    each has a distinctive scent and gives a distinctive honey flavour.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The listed flower-names in Aka-Bea and Aka-J̌eru correspond to periods from
    mid-November to mid-February, mid-February to mid-May, mid-May to late August,
    and September to mid-November.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After a girl receives her flower-name, her birth-name and nickname fall out
    of use, and an unmarried girl is addressed only by the flower-name.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: A woman is properly known by her flower-name from puberty until after the
    birth of her first child, though the passage notes that in contemporary circumstances
    the flower-name may drop out after some years of married life without children.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After the birth of her first child, a woman is known by her birth-name or
    nickname rather than her flower-name.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:17
  text: Examples are given of women whose names change from birth-name to flower-name
    and then back to the birth-name after first childbirth or according to social
    usage after marriage.
  category: sequence
  evidence_refs:
  - ev:10
