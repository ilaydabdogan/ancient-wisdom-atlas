canonical_text:
  quote: ''
  summary: The passage describes Andamanese use of plant fibres for string, rope,
    thread, nets, bags, ornaments, bow-strings, arrow binding, and canoe or hunting
    equipment. It gives particular attention to Hibiscus tiliaceus bark, its preparation,
    and its uses, then notes other fibre sources including Sterculia, Grewia, Hibiscus
    scandens, Ficus species, and Gnetum edule. It also corrects an earlier botanical
    identification of the principal rope fibre.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For string, rope, and thread, the Andaman Islanders use several vegetable
    substances and are described as making no use of animal substances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hibiscus tiliaceus grows in beach vegetation throughout the islands and is
    described as one of the most important fibre sources.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coast-dwellers of the Great and Little Andaman Divisions use Hibiscus tiliaceus
    for rope; in the Great Andaman Division the rope is associated with turtle nets,
    turtle harpoon lines, canoe hawsers, and anchors or trees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Forest-dwellers of the Great Andaman are described as having less use for
    rope and less ready access to Hibiscus fibre, so their rope is obtained from coast-dwellers
    or made from another fibre.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Little Andaman, Hibiscus is used for rope and for the short cord attaching
    a detachable pig-arrow head to its shaft.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Strips of Hibiscus bark are used in the Great Andaman for child-carrying slings
    and are worn by Little Andaman women across the shoulders and breasts as ornaments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The preparation of Hibiscus fibre involves cutting young shoots, peeling bark,
    separating the liber layer, scraping it with a Cyrena shell, drying it in sun
    or over fire, and working it by hand.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author states that earlier identification of the principal rope fibre
    as Melochia velutina is erroneous and identifies it as Hibiscus tiliaceus.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Other bark fibres, including Sterculia and a tree doubtfully identified as
    Grewia laevigata, are said to be usable for rope but little used.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A fibre associated by Portman with Celtis cinnamonea is described as frequently
    used by Little Andaman people and the Jarawa for personal ornaments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A jungle-growing Hibiscus, believed to be Hibiscus scandens, provides a fibre
    prized in the Great Andaman tribes for fine rope or string and used in netted
    bags.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ficus laccifera bark is used by Great Andaman people for personal ornaments
    and in Little Andaman for bow-strings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Gnetum edule is used throughout the Andamans for thread and string after being
    cut, dried, scraped, peeled into fine strips, and made into cordage.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Gnetum string is used in the Great Andaman Division for netted bags and fishing
    nets, and in Little Andaman for binding arrows and netting.
  category: action
  evidence_refs:
  - ev:8
