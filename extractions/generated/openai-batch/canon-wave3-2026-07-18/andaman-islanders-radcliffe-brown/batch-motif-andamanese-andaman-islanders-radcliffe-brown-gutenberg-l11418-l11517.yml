canonical_text:
  quote: ''
  summary: Radcliffe-Brown introduces an appendix on the technical culture of the
    Andaman Islanders, comparing Andamanese technology with that of the Semang and
    Philippine Negritos under a cautious hypothesis of common descent. He distinguishes
    Great Andaman and Little Andaman divisions, describes a proposed history of isolation,
    migration, and conflict involving the Jarawa, presents a branching diagram or
    tree of cultural relations, and notes major limits in knowledge about North Sentinel,
    Semang, and Philippine Negrito technologies.
  language: English
  quote_policy: summarized
