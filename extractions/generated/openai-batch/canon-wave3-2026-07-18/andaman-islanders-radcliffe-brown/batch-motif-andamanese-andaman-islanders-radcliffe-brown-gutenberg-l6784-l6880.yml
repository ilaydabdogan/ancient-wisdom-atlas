canonical_text:
  quote: ''
  summary: The passage catalogs Andamanese beliefs about magical and medicinal properties
    of mineral and vegetable substances. Red ochre, red stone, clays, and olive-colored
    earth are used externally or internally as remedies. Several plants and trees
    have effects on turtle hunting or turtle cooking, protection from sharks or sea
    spirits, storm causation, and the housing of unborn child souls. The author also
    corrects an earlier report by Mr Man concerning alaba/Hibiscus wood and turtle
    cooking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yellow ochre is collected, burnt until red, and used as powder or paint; it
    may be mixed with pig or turtle fat, mixed with water and taken internally, or
    applied to the body for ailments and wounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Red paint is said by the described people to cure sickness by its smell when
    smeared on the upper lip below the nostrils.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A soft red stone called talar is used as a substitute for red paint and may
    be rubbed on the body or powdered, mixed with water, and taken internally.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: White clay and common clay are used medicinally; common clay is plastered
    on sores and is said at least to keep off flies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: An olive-colored earth found in certain springs is mixed with water and taken
    internally as a general remedy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Anadendron paniculatum provides fibre for bow-strings and thread used in arrows
    and harpoons.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The smell of the green Anadendron plant or insufficiently dried fibre is believed
    to cause rheumatism and to frighten away turtle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person who has prepared Anadendron fibre avoids turtle hunting and may not
    cook turtle; green creeper in a canoe or contact between the plant and turtle
    meat is believed to spoil the hunt or meat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: If Anadendron creeper is burnt in fire, it is believed either to drive all
    turtle from the neighborhood or to cause a great storm.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Carrying a piece of Anadendron creeper is said to make a swimmer safe from
    sharks and to protect the carrier from sea spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hibiscus tiliaceus provides fibre for rope; its leaves are believed to keep
    away sea spirits but not forest spirits.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hibiscus leaves are used in the turtle-eating ceremony, and only Hibiscus
    wood may be used for cooking turtle; other wood is said to make the meat not good.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author states that Mr Man's report about alaba wood being forbidden for
    turtle cooking and Puluga punishing offenders is an error; the author identifies
    alaba with Hibiscus tiliaceus and suggests possible confusion with Anadendron.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The green creeper of Gnetum edule is believed to drive away turtle if a piece
    is taken in a canoe.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Ficus laccifera trees are believed to be the home of yet unborn souls of children.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: In the North Andaman, cutting a Ficus laccifera tree is said to cause a storm.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The bark of the aerial roots of Ficus laccifera supplies fibre used for bow-strings
    in Little Andaman and for personal ornaments in Great Andaman; the author says
    the ornaments may possibly have magical properties.
  category: object
  evidence_refs:
  - ev:9
