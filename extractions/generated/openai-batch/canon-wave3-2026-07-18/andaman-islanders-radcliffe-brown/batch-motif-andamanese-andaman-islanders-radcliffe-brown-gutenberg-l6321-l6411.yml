canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese beliefs about a person''s double or reflection,
    dreams as movements or communications of this double, illness and danger associated
    with dreams and waking sleepers, the role of special dreamers, and several distinct
    accounts of what becomes of a person after death: becoming a spirit in the jungle
    or sea, going to an underworld called Maramiku, or going to the sky.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Northern languages, terms for reflection, shadow, and dream are related;
    in Aka-Bea, reflection, shadow, and dream are expressed by distinct words.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dreams are sometimes explained as the sleeper's double leaving the body and
    wandering elsewhere.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One reported dream was treated by the dreamer as evidence that a baby in his
    home country had died.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: People are said to avoid waking a sleeper, or to do so only with reluctance,
    because the sleeper's double may be far from the body and sudden waking may cause
    illness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Unpleasant dreams are interpreted as bad and pleasant dreams as good; sickness
    may be explained as caused by a dream.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person who has a painful dream may remain in camp the following day until
    the effect is thought to have worn off.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports belief in communication with spirits in dreams, especially
    by special individuals called oko-ǰumu, or dreamers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At death, the double, or according to some explanations the breath, leaves
    the body and becomes a spirit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: One Northern account says that a dead person becomes a Lau, first remaining
    near the grave or place of death and later living with other spirits; a drowned
    person becomes a J̌urua.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: An Aka-Čari account says that jungle-dwellers become Lau in the jungle, coast-dwellers
    become J̌urua in the sea, and all Aka-Čari become J̌urua when they die.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The same Aka-Čari account says that spirits of a person's own country are
    friendly, while spirits of another country are dangerous and may cause illness.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Another Northern account says that the spirit goes to a world under this one
    called Maramiku, which resembles the present world and contains forest, sea, animals,
    and plants.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: In Maramiku, spirits are said to hunt, fish, and dance as Andamanese people
    do on earth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Other Northern accounts say that the dead person's double or spirit goes to
    the sky, either directly or after wandering until the flesh has rotted from the
    bones.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The collector notes that answers about postmortem destiny were multiple and
    inconsistent and were therefore kept separate.
  category: other
  evidence_refs:
  - ev:11
