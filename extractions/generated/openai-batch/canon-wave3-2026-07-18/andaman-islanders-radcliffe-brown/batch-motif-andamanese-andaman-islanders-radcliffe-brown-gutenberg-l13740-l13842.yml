canonical_text:
  quote: ''
  summary: The passage catalogs personal ornaments of the Great Andaman Division,
    including imported cloth and beads, rope and string ornaments, Pandanus-leaf belts
    and girdles, Dentalium-shell attachments, dance garters and bracelets, rattling
    shell ornaments, and chaplets or headdresses. It gives wearer categories by sex,
    marital status, age, and ceremonial or dance context, and describes methods of
    construction for several ornaments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Natives of the Great Andaman Division obtain cloth and beads from the Settlement
    of Port Blair; cloth is worn around the loins, and beads are made into necklaces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Every man wears some sort of waist girdle; the passage says this was formerly
    the only object constantly worn by men.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men and women may wear a simple string, usually Anadendron fibre, around the
    neck or around the leg below the knee.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Every married woman always wears a Pandanus-leaf belt and puts on a new belt
    before removing the old one when renewal is needed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: One Pandanus-leaf belt is made from two leaves with thorns removed, wound
    spirally in three turns, tied at the back, and furnished with bundles of leaf
    strips.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The belt called toto t’er-bua is generally worn by married women, and similar
    belts are worn by men on certain ceremonial occasions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Other Pandanus-leaf belt forms are specified for women only, for girls and
    women only, or for either men or women.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Several Pandanus-leaf girdles or ornaments include tassels or pendent strings
    of Dentalium shell.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:9
- id: obs:9
  text: Garters and bracelets for dances are made from Pandanus leaf and worn around
    the leg below the knee or around the wrist.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some knee or wrist ornaments have hanging shells that rattle when the wearer
    walks or dances.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Chaplets or headdresses are worn by men when dancing and occasionally by women;
