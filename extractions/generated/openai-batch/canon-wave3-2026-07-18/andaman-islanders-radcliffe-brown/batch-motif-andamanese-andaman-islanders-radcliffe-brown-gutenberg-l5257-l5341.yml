canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese beliefs about jungle and sea spirits:
    their capture of solitary wanderers, danger to humans, causing sickness and death,
    protective objects and sounds, the relative safety of home spirits, feeding on
    the dead, and corrections to earlier singular descriptions of spirit classes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jungle spirits are said to live in a village or villages in the forest and
    to capture mortals wandering alone in the jungle.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A captive who shows fear is said to be killed, while a brave captive is taken
    to the spirits' village, detained for a time, and then released.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who survives such an encounter is said to receive lifelong power
    to perform magic and to visit the spirits as friends.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: One reported man periodically went into the jungle alone and returned looking
    strange, wearing shredded palm-leaf ornaments that he said the spirits had placed
    on him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Contact with jungle spirits, sea spirits, or a dead man's spirit is described
    as dangerous except for persons who have befriended them; spirits are believed
    to cause sickness and deaths from sickness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spirits are said to strike invisibly, especially when a person is alone away
    from the village; they rarely enter the village itself and are more dangerous
    at night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fire, arrows, human bones, beeswax, and red paint are named as objects believed
    to keep spirits away; people carry a fire-brand or torch at night for protection.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Whistling at night is avoided because it is believed to attract spirits, while
    singing is believed to keep spirits away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Spirits of a person's own home area are described as less dangerous or friendly,
    while spirits in a stranger's country may be hostile and associated with illness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Spirits are believed to feed on the flesh of dead people: jungle spirits
    eat those buried on land, and J̌urua devour those drowned or lost at sea.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author states that E̱rem Čauga and J̌uruwin are names for classes of supernatural
    beings, not single individuals; Mr Portman is cited as translating J̌uruwin in
    the plural.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Mr Man's account, the woods spirit is described with a wife and progeny;
    the husband and grown sons roam the jungles with a torch attached to the left
    leg and wound victims internally with invisible arrows.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: In Mr Man's account, J̌uruwin is invisible, lives in the sea with wife and
    children, devours drowned or sea-buried bodies, attacks fishers with a spear,
    and uses submarine residences, boats, and a net.
  category: action
  evidence_refs:
  - ev:10
