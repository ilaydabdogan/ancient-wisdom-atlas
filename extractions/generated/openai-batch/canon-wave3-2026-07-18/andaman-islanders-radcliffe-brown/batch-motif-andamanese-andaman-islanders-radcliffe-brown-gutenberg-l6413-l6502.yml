canonical_text:
  quote: ''
  summary: The passage records several Andamanese accounts of what happens to spirits
    after death, including journeys to an eastern spirit house, life in the sky with
    Tomo, separate postmortem status for medicine-men’s spirits, an Akar-Bale itinerary
    involving birds, nets, and the sea, and an Aka-Bea cosmology in which an under-earth
    jungle rests beneath a flat world supported by a palm-tree. The author notes that
    these beliefs vary and are not fixed or unanimous.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one A-Pučikwar account, a dead person’s spirit goes east or north-east,
    passes over the edge of the world, and remains at Lau-l’uŋ-ciŋ, called Spirit’s
    House.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spirit’s House is described as having a large hut in a jungle like the earthly
    jungle, where spirits live as people do, including hunting and fishing.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Beyond the home of the spirits is Puta-ko̱iča, identified as the home of the
    sun and moon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The rainbow is described as a cane-made path by which spirits visit friends
    on earth in dreams.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Another A-Pučikwar version says the dead live in the sky with Tomo, a mythical
    being also associated in some accounts with the first ancestor, the sun, light,
    and fine weather.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the sky account, the spirit world is never night because Tomo is always
    there, and spirits have pork and turtle and spend time dancing and enjoying themselves.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: A medicine-man informant said medicine-men’s spirits live apart from ordinary
    spirits and are called Bilik rather than Lau.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The informant reported a dream visit from Bo̱ičo Bilik, the spirit of a dead
    medicine-man, and said Bilik control weather and can cause or cure sickness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: One Akar-Bale statement says the breath of a dying person goes up to the sky
    and becomes a spirit; another says dead spirits go to J̌ereg-l’ar-mugu under the
    earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: One Akar-Bale account gives a route in which the spirit travels through named
    places, is announced by bird cries, is caught in big nets by people of Luŋ-tauar,
    is thrown into the sea, and then goes to Čauga-l’uŋ-jiŋa, Spirit’s Home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The people of Luŋ-tauar are said to have learned spirit-catching in nets from
    a wise woman named In Golat.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The author states that the cited Andamanese accounts give alternative and
    inconsistent destinations for spirits, including sky, under earth, east where
    sun and moon rise, and the jungle and sea of their own country.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: In Mr Man’s account of Aka-Bea belief, the world apart from the sea is flat
    and rests on an immense palm-tree called barata in an under-earth jungle called
    čaitan.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: Čaitan is described as gloomy and partially lighted by visits from the sun
    and moon; departed spirits are sent there by Puluga to await the Resurrection.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: In čaitan, no change of growth or age occurs; adult spirits hunt, animal and
    bird spirits are sent there, fish and turtle spirits remain in the sea and are
    preyed on by ǰuruwin, and young children’s spirits are placed under a rau tree
    to live on its fruit.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: The account says none can leave čaitan after entering it, and refers to a
    past oko-paiad who saw the region and activities of spirits in a dream vision.
  category: sequence
  evidence_refs:
  - ev:7
