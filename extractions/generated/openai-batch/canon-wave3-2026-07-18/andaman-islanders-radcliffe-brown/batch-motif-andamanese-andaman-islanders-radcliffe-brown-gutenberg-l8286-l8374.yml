canonical_text:
  quote: ''
  summary: 'The passage gives several Andamanese legends and comparative variants:
    Pe̱rǰido discovers honey and learns to smoke bees; Maia Po̱rubi hoards honey from
    his children and is killed by Be̱re̱t with a cut creeper and sharp stakes; another
    Aka-Čari legend has Po̱rubi defeating enemies and turning people and a canoe to
    stone; a cited fable links honey, a woodpecker, a toad, drought, and the return
    of water; an Aka-Ko̱l version transfers a similar tree-and-stakes punishment to
    Ta Mita and Ta Ko̱io after stolen pigs.'
  language: English
  quote_policy: summarized
