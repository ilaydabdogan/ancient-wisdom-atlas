canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese mourning customs: near relatives observe
    a months-long period marked by clay on the body or head, avoidance of names, abstention
    from dancing and ceremonial body decoration, and avoidance of specified foods
    that vary by locality or dwelling group.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mourning period for near relatives lasts for several months; for a young
    child, only the parents mourn.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated essentials of mourning are the use of clay and abstention from
    certain foods, dancing, white clay, and red paint.
  category: action
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:3
  text: On the death of an adult community member, every adult in the camp covers
    himself or herself with clay, but only near relatives renew the clay after it
    wears or washes off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Near relatives keep renewing clay on the body for many weeks; the clay is
    smeared evenly and not applied in patterns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Relatives plaster clay on their heads; a widow mourning her husband covers
    her whole head with a thick layer, while lesser mourning may use clay on the forehead
    only or later a forehead band.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The mourning clay is called odu in Northern languages and og in Aka-Bea; a
