  quote: ''
  summary: The passage describes domestic and subsistence implements made from bamboo,
    wood, shells, palm leaves, resin, leaves, charcoal, cane, creepers, and rotten
    wood. It explains how bamboo is used as a cooking and storage vessel, how trays,
    cups, tongs, digging sticks, hooks, sewn palm leaves, and torches are made and
    used, including the use of a sewn Licuala leaf as a sunshade, mat, screen, wrapper,
    or winding sheet for a corpse.
