canonical_text:
  quote: ''
  summary: The passage describes the arrangement of a communal hut and camp, the composition
    of a local group, sea and forest subsistence resources, rainy-season camp routine,
    pig hunting with bows, arrows, dogs, and fire, preparation and distribution of
    pork, other foods gathered or hunted, and the labor of women and children in providing
    vegetable food, firewood, and water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The communal hut is described as a village drawn together, with joined hut
    spaces and roofs meeting in the middle.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The center of the communal hut is an open public space corresponding to the
    village dancing ground and used for dancing, though it is small.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Families occupy special portions around the central space, marked by short
    lengths of wood on the floor; the hut may also include a public cooking place
    and a marked space for unmarried men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A local group is described as a few families, averaging about ten families,
    with some unmarried males and females.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Subsistence is said to depend entirely on natural products of the sea and
    forest, including sea animals, fish, shellfish, wild pig, honey, roots, fruits,
    and seeds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the rainy season, the forest group lives at its headquarters camp,
    often formerly in a communal hut; animal food is plentiful and vegetable food
    is limited.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After sunrise, camp members eat any food saved from the previous day, and
    men leave for hunting.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: A hunting party consists of two to five men; each man carries a bow and pig
    arrows, and one party member carries a smouldering fire-brand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dogs are used for pig-hunting in the described present; they were originally
    obtained from the Settlement of Port Blair, and the use of dogs in pig-hunting
    was learned from Burmese convicts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pig hunters follow tracks or pig runs, or find pigs feeding; dogs may scent
    out the pig and bring it to bay before it is shot with arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A killed pig may be carried whole to camp or eviscerated and roasted near
    the kill site; leaves are used in the body cavity and to wrap meat, and internal
    organs may be cooked and eaten by hunters.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If a pig is carried home whole, roasting and cutting are done at the public
    cooking place, and meat is distributed only after partial cooking.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Civet cat, monitor lizard, snakes, and rats may be killed and eaten; birds
    are rarely obtained, and the Andamanese are said not to trap birds or animals.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Hunters may collect roots, fruits, seeds, or wild honey while traversing the
    forest; small combs of black honey in the rainy season are generally eaten on
    the spot.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Women provide vegetable food, firewood, and water; attended by children, they
    cut and carry firewood, make baskets or nets, or forage in the forest.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: By midday the camp may be mostly deserted except for one or two old men and
    women and a few children.
  category: setting
  evidence_refs:
  - ev:9
