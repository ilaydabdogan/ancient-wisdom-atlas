canonical_text:
  quote: ''
  summary: The passage describes Andamanese personal ornaments and amulets made from
    plant fibres, beeswax, cane, animal bones, human bones, and other socially important
    materials. It gives examples of a Little Andaman neck charm containing Hibiscus
    rope, Ficus laccifera fibre used as an amulet and formerly or elsewhere as bow-string
    material, and medicine-men stopping storms with Anadendron or Ficus. The author
    argues that protective beliefs express the social value of materials important
    for food, weapons, and social life, and notes Hibiscus leaves used in initiation
    ceremonies as protection against unseen dangers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Personal ornaments are described as made from Hibiscus, Anadendron, and Gnetum
    fibres, and the author regards such ornaments as amulets to some extent.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man in Little Andaman wore a valued charm around his neck; when opened,
    it contained a carefully folded length of Hibiscus-fibre rope inside bark and
    ornamental thread.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Great Andaman people make ornaments from Ficus laccifera fibre and do not
    regularly use it otherwise, while Little Andaman people use Ficus fibre for bow-strings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author proposes that Great Andaman use of Ficus fibre as an amulet may
    be a survival from an earlier period when it was used for bow-strings before substitution
    by Anadendron fibre.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ficus is said to have qualities similar to Anadendron; the passage reports
