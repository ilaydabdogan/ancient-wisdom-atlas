literal_observations:
- id: obs:1
  text: The Jarawa of Rutland Island are described as making bows exactly like those
    of Little Andaman and apparently no other kind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Jarawa north of Port Blair are described as making Little Andaman-type
    bows and also a second kind called the modified Jarawa type.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The modified Jarawa type is described as larger than Little Andaman bows,
    with an average length of about 185 cm, a breadth of about 5 cm, a plano-convex
    or concavo-convex section, a slight central thickening, sometimes a slight outward
    recurving, and wood different from that used in Little Andaman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Little Andaman bow, North Sentinel bow, and Jarawa bow are described as
    varieties of one type, with the Little Andaman form said to be probably nearest
    the original of the type.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'A different bow type is said to have two varieties: one used in the South
    and Middle Andaman and another used in the North Andaman.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The South Andaman bow is cut from a tree that has naturally bent during growth,
    then shaped with an adze and finished by planing with a boar's tusk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The South Andaman bow is described as 180 to 210 cm long, typically 190 to
    195 cm, with a pointed upper end, a broad leaf-shaped upper blade, a narrowed
    thicker handle, and a lower blade that curves outward around the bend in the wood.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Near each end of the South Andaman bow, string is served for 3 or 4 cm, leaving
    a longer bare upper point and a shorter bare lower point.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The bow-string is made from Anadendron fibre strands waxed with black beeswax,
    with one strand wound spirally around three others and new strands added as needed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: One end of the cord has a knot, while the other has a loop or eye formed by
    bending the cord, serving it with Anadendron thread, and thickening the cord for
    about 35 cm from the eye.
  category: object
  evidence_refs:
  - ev:8
