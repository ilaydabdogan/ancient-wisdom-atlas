literal_observations:
- id: obs:1
  text: For a period described as the next sixty years, the islands remained unoccupied
    except by the aboriginal inhabitants, while several wrecks occurred and some crews
    were killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In 1839 Dr Helfer visited the islands seeking minerals and was killed by the
    natives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In 1844 the transports Briton and Runnymede were wrecked in a cyclone on Ritchie’s
    Archipelago; their crews and soldiers landed safely and were eventually rescued
    with little loss of life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The East India Company reconsidered colonizing the Andamans in connection
    with shipwrecks, harbour needs, and the need for a new penal settlement after
    the Indian Mutiny; the earlier settlement site was renamed Port Blair.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Penal Settlement was established in March 1858, and the aboriginal inhabitants
    were hostile from the beginning, conducting raids and trying to oust the invaders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Andamanese Homes were founded to provide free rations, lodging, and medical
    attendance to Andamanese visitors to the settlement, and friendly relations were
    later established with several groups.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The J̌a̤rawa are described as persistently hostile, making repeated attacks
    on isolated convicts, forest workers, and friendly Andamanese; punitive expeditions,
    gifts left in huts, and temporary capture were attempted without ending hostility.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Andaman Islanders are divided into two main divisions, the Great Andaman
    Group and the Little Andaman Group, with the J̌a̤rawa placed in the latter grouping
    rather than with the Great Andaman Group.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The languages of the Great Andaman Group are described as closely related;
    the J̌a̤rawa language is described as very similar to the Little Andaman language;
    Great Andaman and Little Andaman languages show strong lexical differences while
    sharing fundamental grammatical structure.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Technical culture is grouped similarly: the Great Andaman tribes are generally
    similar to one another, while the J̌a̤rawa and Little Andaman inhabitants have
    a markedly different technical culture.'
  category: attribute
  evidence_refs:
  - ev:6
