  summary: 'The passage gives historical and ethnographic background: shipwrecks and
    colonial contact in the Andamans, establishment of the Penal Settlement at Port
    Blair, conflict and attempted friendly relations with Andamanese groups, and classification
    of Andaman Islanders into Great Andaman and Little Andaman groupings by language,
    culture, and tribe names.'
