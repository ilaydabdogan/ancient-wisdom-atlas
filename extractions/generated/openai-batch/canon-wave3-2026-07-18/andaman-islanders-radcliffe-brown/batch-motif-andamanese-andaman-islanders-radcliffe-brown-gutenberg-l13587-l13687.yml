canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese domestic implements: the maintenance
    and transport of fire despite an earlier lack of indigenous fire-making methods;
    the making, regional forms, decoration, and uses of clay cooking pots; comparative
    remarks on the origin of Andamanese pottery; and wooden or bamboo vessels for
    carrying and storing water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Andamanese are described as formerly lacking a method for producing fire,
    while at the time of writing some obtain matches or have learned bamboo-friction
    fire-making from neighboring peoples.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fires are kept alive in villages, carried when travelling, and carried by
    hunting parties; wood is selected for long smouldering without flaming or going
    out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cooking pots are made from suitable clay by moistening, kneading, rolling
    into coils, building up the pot, scraping with an Arca shell, sun-drying, and
    baking with burning wood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Pot forms and makers differ by region: North Andaman pots are small with
    pointed bottoms and made by women; South Andaman pots are round-bottomed, larger,
    thicker, and made by men and women; Little Andaman pots are larger and deeper
    with somewhat pointed bottoms; Jarawa pots are said to resemble Little Andaman
    pots.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: North Andaman pots are not ornamented, South Andaman pots are decorated with
    simple dots and lines, and the Little Andaman pots seen by the author were not
    decorated.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pots are used for boiling meat and vegetables, and in North Andaman small
    pots are made for melting a composition used on arrow-head bindings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that Semang and Philippine Negritos do not make pottery
    and discusses the origin of Andamanese pottery through shared Andamanese words
    for pot and competing hypotheses of acquisition or loss.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wooden buckets are made by hollowing soft-wooded tree trunks and are used
    for carrying and holding water; their bottoms are waterproofed with beeswax in
    Little Andaman or with arrow-binding composition in Great Andaman.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Great Andaman and Little Andaman buckets have different cane carrying arrangements,
    and Little Andaman buckets are charred on the outside.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Drifted giant bamboo can be made into single-joint buckets, and local bamboo
    lengths with preserved lower nodes are used as water vessels for journeys by land
    or canoe and for keeping drinking water in huts.
  category: object
  evidence_refs:
  - ev:9
