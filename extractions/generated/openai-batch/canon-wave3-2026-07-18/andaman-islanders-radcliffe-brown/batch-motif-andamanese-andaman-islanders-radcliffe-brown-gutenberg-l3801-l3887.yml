canonical_text:
  quote: ''
  summary: The passage describes a youth-centered ceremony involving turtle fat and
    meat, red pigment, massage, clay and water spattering, silence, restricted posture,
    food and sleep rules, instruction about future diet, adornment with creeper ornaments,
    sea bathing, red and white body decoration, and a concluding communal dance with
    leaf bundles, song, and sounding-board accompaniment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man is chosen to take charge of the ceremony; he may be an older man of
    the youth's community or a distinguished visitor present in the camp.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man selects cooked turtle meat and fat, places them in a wooden dish,
    and comes to the seated youth while friends and relatives gather around.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The performer rubs turtle fat over the youth's lips and body while female
    relatives sit nearby and weep loudly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The performer rubs burnt oxide of iron used for red paint over the youth's
    body, except the hair of his head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The performer places turtle fat in the youth's mouth and feeds him a few mouthfuls,
    which the youth eats silently.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The performer massages the youth, presses his shoulders, shakes flesh at the
    sides of the belly, massages limbs, and forcibly flexes wrists, knuckles, and
    toes to make the joints crack if possible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A clay-and-water mixture is spattered over the youth's body from head to foot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: During the first proceedings the youth sits passive and silent.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: After the first part, the youth sits with a tray of turtle meat and fat beside
    him, uses a Hibiscus-wood skewer because he may not touch the meat with his fingers,
    and remains surrounded by Hibiscus leaves.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: For forty-eight hours the youth may not lie down, speak, or sleep; he may
    eat only turtle and drink only water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The man in charge sits behind the youth and instructs him about foods he may
    and may not eat after the ceremony.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Men and women take turns sitting beside the youth, attending to his wants
    and talking or singing to keep him awake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: On the morning of the third day, a belt and necklace made from the creeper
    called terkobito-balo, or centipede creeper, are placed around the youth's waist
    and neck.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: On the third day the youth is permitted to sleep, and either then or early
    the next morning he bathes in the sea to remove some of the red paint and clay.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: After the sea bath, female relatives decorate the youth with red paint made
    of red ochre and turtle fat and with white clay in alternating stripes and zig-zag
    lines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Early on the fourth day, an older man stands by a sounding-board, women sit
    near him, and the youth stands in the middle of the dancing ground with five or
    six men around him in a circle.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:17
  text: The youth and the surrounding men each hold bundles of Hibiscus or Myristica
    twigs in both hands.
  category: object
  evidence_refs:
  - ev:6
- id: obs:18
  text: The man at the sounding-board sings and beats time with his foot; at the chorus,
    the women join in and clap their hands on their thighs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: A turtle-hunting song is preferred, although the song may be on any subject
    selected by the singer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:20
  text: The youth and the men dance by flexing the hips and knees, placing leaf bundles
    on their backs, leaping in time to the sounding-board, and periodically sweeping
    the bundles along the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:21
  text: The dance is repeated several times until the youth is tired out.
  category: sequence
  evidence_refs:
  - ev:7
