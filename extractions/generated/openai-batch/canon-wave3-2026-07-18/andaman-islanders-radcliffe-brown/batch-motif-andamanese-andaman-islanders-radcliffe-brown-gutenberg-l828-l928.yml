- id: obs:3
  text: The passage says tribal boundaries are difficult to determine, and that the
    Aka-Bea and the J̌a̤rawa had no definite boundary, living in the same territory
    at enmity with one another.
  category: relationship
  evidence_refs:
  - ev:3
