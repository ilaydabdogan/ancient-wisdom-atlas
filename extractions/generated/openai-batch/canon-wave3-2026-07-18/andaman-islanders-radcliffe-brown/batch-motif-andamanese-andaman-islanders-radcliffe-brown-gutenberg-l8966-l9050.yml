  summary: 'The passage interprets Andamanese weeping rites as obligatory ceremonies
    that renew or modify social bonds: between friends or relatives meeting after
    separation, between formerly hostile groups in peace-making, between mourners
    and the community at the end of mourning, and between marriage participants and
    their relatives when kinship obligations are altered.'
