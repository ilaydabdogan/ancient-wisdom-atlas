canonical_text:
  quote: ''
  summary: The passage interprets Andamanese customs concerning food and valued materials.
    Certain foods and materials are treated as dangerous unless handled with ritual
    precautions, yet the same substances may provide protection, healing, or social
    benefit when used according to custom. Examples include prescribed treatment of
    turtle, pig, Anadendron fibre, special foods for sickness, and ornaments made
    from bones of eaten animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some foods are believed to be more dangerous than others, and body painting
    is obligatory after eating the more dangerous foods but not after eating less
    dangerous foods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A turtle must be killed with its head toward the open sea and cut up in a
    particular way; otherwise the meat would be considered bad.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A pig must be cut up in a particular way and stuffed with certain leaves before
    roasting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man avoids eating certain foods when away from his own country because he
    fears illness, and the passage relates this to a belief that spirits of strange
    places are more dangerous than those of his own home area.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fire and materials used for weapons are described as things whose social value
    is translated into a belief that they afford protection against danger.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fibre of Anadendron paniculatum is used for bow-strings and is believed
    to have efficacy against dangers of the sea such as sharks.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same Anadendron plant is believed to cause harmful effects if mishandled,
    including preventing turtle capture from a canoe, causing a storm or driving away
