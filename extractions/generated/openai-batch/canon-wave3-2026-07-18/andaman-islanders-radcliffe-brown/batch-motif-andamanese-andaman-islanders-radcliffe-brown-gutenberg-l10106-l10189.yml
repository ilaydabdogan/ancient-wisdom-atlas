    dangerous if it touches the plant.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Special foods, including yams, honey, turtle and dugong fat, and flying-fox
    flesh, are believed to have curative properties or to serve as remedies.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ornaments made of bones of eaten animals are believed to have protective powers
    similar to those attributed to human bones, especially for hunters in the forest
    or on the sea.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The bones of eaten animals are described as permanent remains of a feast and
    as visible signs of past well-being and future security.
  category: attribute
  evidence_refs:
  - ev:10
