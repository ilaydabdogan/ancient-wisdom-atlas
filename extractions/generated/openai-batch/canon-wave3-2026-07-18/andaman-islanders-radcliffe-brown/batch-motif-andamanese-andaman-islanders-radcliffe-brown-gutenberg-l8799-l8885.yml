- id: obs:8
  text: Giving presents is described as a common Andamanese way of expressing friendship;
    among friends it is usually reciprocal, and refusing a present is treated as rejecting
    goodwill.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At marriage the giving of gifts is one-sided, with no return expected, and
    everyone present has a duty to give something to the newly married pair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the North Andaman peace-making ceremony, dancers are divided into two parties,
    one of which expresses aggressive feelings through shouting, threatening gestures,
    and shaking members of the other party.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The other party in the peace-making dance remains still and shows neither
    fear nor resentment while submitting to the treatment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The aggressive party’s anger is described as appeased by collective expression,
    while the passive party’s submission is described as expiating wrongs, so that
    enmity ends.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passive participants stand against a fibre screen, which the passage says
