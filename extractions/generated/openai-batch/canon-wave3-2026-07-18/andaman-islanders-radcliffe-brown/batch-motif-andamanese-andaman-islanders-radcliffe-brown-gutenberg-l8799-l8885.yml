canonical_text:
  quote: ''
  summary: The passage interprets Andamanese marriage and peace-making ceremonies.
    The marriage rite is described as a public union sanctioned by witnesses and the
    community, producing a change of status for the couple and accompanied by gifts
    expressing collective goodwill. The North Andaman peace-making rite is described
    as a dance between an aggressive party and a passive party, followed by elements
    including a fibre screen, weeping together, and an exchange of weapons; the rite
    is said to transform enmity into friendship and restore solidarity between local
    groups.
  language: English
  quote_policy: summarized
