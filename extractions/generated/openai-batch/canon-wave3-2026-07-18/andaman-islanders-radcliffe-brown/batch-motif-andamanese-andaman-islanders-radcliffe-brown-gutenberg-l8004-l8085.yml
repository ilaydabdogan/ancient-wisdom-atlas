scenes:
- id: scene:1
  label: A-Pučikwar origin of night
  summary: In a time of continuous day, Ta Pe̱tie brings yams, resin, and a cicada
    to the ancestors. When he crushes the cicada, darkness comes. The ancestors use
    resin torches, dancing, and songs; after other singers fail, Ko̱ŋoro the ant sings
    and morning returns, after which day and night alternate.
  figure_refs:
  - fig:1
  - fig:2
  - fig:3
  - fig:4
  - fig:5
  symbol_refs:
