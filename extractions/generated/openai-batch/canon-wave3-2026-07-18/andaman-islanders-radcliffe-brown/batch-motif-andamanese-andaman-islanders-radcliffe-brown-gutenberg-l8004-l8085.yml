canonical_text:
  quote: ''
  summary: The passage gives Andamanese variants explaining the origin of night. In
    A-Pučikwar and Akar-Bale versions, an ancestral figure brings a cicada and resin;
    crushing the cicada brings darkness, and daylight returns after torches, dancing,
    singing, and especially an ant’s song. An Akar-Bale version also includes Teŋat
    learning names from a yam and resin and teaching how to cook yam. A version recorded
    by Mr Man explains night as Puluga’s punishment after two women destroy a caterpillar
    and a plant; singing and dancing lead to alternate day and night, and later the
    moon is created to ease night.
  language: English
  quote_policy: summarized
