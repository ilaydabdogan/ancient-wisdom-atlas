candidate_motifs:
- id: motif:1
  label: origin of night through killing a small creature
  taxonomy_refs: []
  basis: Two versions connect crushing a cicada with immediate darkness, while Mr
    Man’s version connects killing a caterpillar with Puluga’s punitive night.
  evidence_refs:
  - ev:3
  - ev:8
  - ev:11
  - ev:12
  confidence: high
  cautions: 'The causal mechanism differs: the cicada versions present direct onset
    of darkness, while Mr Man’s version frames night as divine punishment.'
- id: motif:2
  label: daylight restored through singing and dancing
  taxonomy_refs: []
  basis: The A-Pučikwar and Akar-Bale versions use torches, dance, and song, with
    the ant’s song restoring daylight; Mr Man’s version also uses invented dancing
    and singing to induce restoration.
  evidence_refs:
  - ev:4
  - ev:9
  - ev:13
  confidence: high
  cautions: The named successful agents differ, and in Mr Man’s version Puluga grants
    the restoration.
