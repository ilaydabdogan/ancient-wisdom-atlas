  - sym:6
  - sym:7
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
- id: scene:2
  label: Akar-Bale Teŋat version
  summary: Teŋat follows arrows into the jungle, learns names from a yam and resin,
    takes them and a cicada to the hut, teaches the yam’s name and cooking, then crushes
    the cicada and darkness comes. He makes resin torches and teaches dancing and
    singing; Da Ko̱ŋoro’s song restores day, and day and night alternate.
  figure_refs:
