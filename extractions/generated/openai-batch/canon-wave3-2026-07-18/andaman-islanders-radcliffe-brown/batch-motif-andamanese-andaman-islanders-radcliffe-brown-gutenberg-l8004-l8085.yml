comparison_claims:
- id: claim:1
  claim: 'The A-Pučikwar and Akar-Bale versions share a same-motif pattern: a cicada
    is crushed, darkness follows, resin torches and singing/dancing are used, an ant’s
    song restores daylight, and alternating day and night begin.'
  claim_level: same_motif
  target: A-Pučikwar and Akar-Bale origin-of-night legends in the supplied passage
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  - ev:9
  counter_evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  limitations: The Akar-Bale version adds Teŋat’s naming and first-yam episodes, and
    the principal ancestral actors have different names.
- id: claim:2
  claim: Mr Man’s Puluga version serves a similar explanatory function to the cicada-crushing
    versions by accounting for night and alternating day/night through destruction
    of a small creature and subsequent singing/dancing, but it changes the cause into
    divine punishment.
  claim_level: same_function
  target: Mr Man’s Puluga punishment version compared with the A-Pučikwar and Akar-Bale
    cicada versions
  evidence_refs:
  - ev:3
