canonical_text:
  quote: ''
  summary: The passage describes Andamanese cutting implements and materials, especially
    iron, quartz and glass flakes, flinty stone, shell, and disputed reports about
    stone adzes or arrow-heads. It emphasizes cold-working of iron, disposable stone
    or glass flakes for shaving and scarifying, and skepticism toward claims that
    stone tools were formerly used for broader cutting purposes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the time described, the Andamanese use iron for cutting implements; earlier
    iron was obtained from wrecks, and became plentiful after the European settlement
    of 1858.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Andamanese do not use heat when manufacturing
    iron implements and work the metal cold, likely applying methods formerly used
    on materials such as shell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Besides iron, the listed materials used by the Andamanese are wood, bone,
    shell, and stone.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Quartz flakes were formerly used mainly for shaving and scarifying the skin,
    with minor uses including cutting finger-nails and sharpening boars’ tusks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Quartz flakes are produced by striking a quartz pebble with a hard rounded
    pebble; suitable flakes are used, unsuitable ones are discarded, and used flakes
    are thrown away after their edge is lost.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Old encampment kitchen-middens contain many quartz pebbles used as cores and
    many flakes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A flinty kind of stone is heated in fire for several hours, cooled, and then
    flaked in the same way as quartz.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the time described, glass from old bottles is preferred to quartz; bottle
    bottoms are flaked like quartz pebbles, and glass or quartz flakes are made only
    when needed and then discarded.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage reports and rejects Colebrooke’s claim that Andamanese canoes
    were hollowed with fire and stone instruments.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The passage reports Stoliczka’s find of a supposed stone celt and arrow-head,
    but adopts Lapicque’s view that these were probably fragments of a sandstone whet-stone.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage reports Portman’s stone-headed arrow made for him by a North Andaman
    native, but says the evidence is unsatisfactory and records other North Andaman
    statements that shell, not stone, was used for arrow-heads.
  category: speech
  evidence_refs:
  - ev:11
