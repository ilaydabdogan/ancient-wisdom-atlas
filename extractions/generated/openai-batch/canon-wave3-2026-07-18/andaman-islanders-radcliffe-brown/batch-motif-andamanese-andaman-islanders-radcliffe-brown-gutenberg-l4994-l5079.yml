canonical_text:
  quote: ''
  summary: The passage describes Andamanese ordinary dances, women's dance and chorus
    roles, individual song composition for dance accompaniment, song subjects drawn
    from everyday work, and a reported former custom of dancing before fighting with
    warrior adornment and shredded-wood plumes used in relation to bows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In both Southern and Northern dances, dancers choose their own direction and
    step while keeping strict time to the music.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women generally do not join ordinary evening dances but form the chorus; on
    certain occasions, such as the end of mourning, they dance with steps different
    from men's.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Southern female dancer stands with flexed knees, alternately raises her
    heels, sways the hips, moves to a new spot, and either swings the arms or holds
    the wrists crossed before the breast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Northern female dancer advances in time, gives a small hop or curtsey at
    every third step, and may stop to scrape each foot backward while swinging both
    arms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ordinary dance is said always to require a song, and every dance song serves
    as dance accompaniment.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each man composes his own songs; no one would sing another person's song at
    a dance, and the passage states there are no traditional songs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Boys begin practicing song composition while young, and a man may compose
    while cutting a canoe or bow or while paddling.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before public performance, a man teaches the chorus to one or two female relatives;
    a successful song is repeated and kept in repertory, while an unsuccessful one
    is abandoned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Songs deal with everyday subjects such as hunting or canoe cutting, and the
    passage says rhythm and melody are more important than sense.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Native statements report a former custom of having a dance before setting
    out to a fight, without a special war-dance form distinct from ordinary dance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Those intending to attack enemies decorated themselves with red paint, white
    clay, ornaments, and shredded-wood plumes.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The shredded-wood plumes were made from short lengths of wood, often an old
    broken pig-arrow, carefully shredded with a Cyrena shell and tied at one end.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: When the attacking party set out, each man wore a shredded-wood plume thrust
    into the back of his belt.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The attackers rubbed their bows with the shredded wood and said this made
    their own bows shoot well and their enemies' bows shoot badly.
  category: speech
  evidence_refs:
  - ev:11
