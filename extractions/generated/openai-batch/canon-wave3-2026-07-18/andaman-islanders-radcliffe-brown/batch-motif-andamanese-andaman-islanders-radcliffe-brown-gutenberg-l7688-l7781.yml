candidate_motifs:
- id: motif:1
  label: First acquisition and instruction in fire
  taxonomy_refs:
  - culture_hero
  basis: Two origin versions explain fire’s introduction to Tomo through Puluga, with
    the second adding instruction in cooking by Lači Puŋa Ablola.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy label is broad; the passage calls these fire-origin legends
    but does not itself use the term culture hero.
- id: motif:2
  label: Ascent to the sky to take fire
  taxonomy_refs:
  - ascent
  - sacred_theft
  basis: Luratut flies up to Mo̱ro, the sky, attempts to seize a burning log from
    Puluga’s fire, and the brand falls near survivors without fire.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The action is a failed carrying-off followed by Puluga throwing the brand;
    the passage says Luratut receives credit, not that he successfully steals it by
    himself.
- id: motif:3
  label: Flood or storm catastrophe with survival and renewal
  taxonomy_refs:
  - flood_and_renewal
  basis: Several versions describe flood, storm, rain, or rising sea overwhelming
    ancestors, with survivors, preserved or restored fire, and in one version renewed
    forest growth from a seed.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  confidence: high
  cautions: The variants differ in cause, scale, and outcome; not every version includes
    both flood and renewal.
- id: motif:4
  label: Ancestors transformed into animals during catastrophe
  taxonomy_refs:
  - shapeshifter
  basis: Multiple versions say people or ancestors are turned into fishes, birds,
    turtle, or other animal forms, and Maia Dik becomes a prawn.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: The transformations are imposed or result from catastrophe, not voluntary
    shapeshifting.
- id: motif:5
  label: Fire preserved under a cooking-pot during catastrophe
  taxonomy_refs: []
  basis: Mimi Čara and Mimi Kota carry fire under a cooking-pot to a cave, and Mima
    Mite keeps fire alight under a cooking-pot while floodwaters rise.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: high
  cautions: The passage gives this as a repeated literal detail but provides no explicit
    interpretive explanation.
- id: motif:6
  label: Evening cicada-song disturbance preceding catastrophe
  taxonomy_refs: []
  basis: 'Several versions place critical disorder during evening cicada song: firewood
    breaking while the cicada sings, people making noise while Mite sings, and Ko̱po-tera-wat
    disturbing cicada song before storm and flood.'
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly state a general rule; the repeated timing
    and sound pattern is inferred from grouped variants.
comparison_claims:
- id: claim:1
  claim: The passage itself groups the North Andaman, Aka-J̌eru, Aka-Čari, and Aka-Kede
    materials as related catastrophe legends in which ancestors are overwhelmed and,
    in many versions, transformed into animals.
  claim_level: same_motif
  target: Andamanese catastrophe legends within the supplied passage
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports variants with different agents and mechanisms,
    including storm, flood, and thrown fire.
- id: claim:2
  claim: 'Post-catastrophe fire recovery or preservation recurs across variants: Luratut
    is credited with bringing fire to survivors, Mimi Čara and Mimi Kota keep fire
    in a cave, Maia Taolu is said to save fire, and Mima Mite preserves it under a
    cooking-pot.'
  claim_level: same_function
  target: Fire rescue or preservation pattern across Andamanese variants in the passage
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: 'The means differ: retrieval from the sky, preservation under a pot,
    and an informant’s brief statement of saved fire.'
- id: claim:3
  claim: The passage supports a cautious intra-passage comparison of evening noise
    or disturbance during cicada song as a repeated prelude to catastrophe.
  claim_level: same_motif
  target: Evening cicada-song disturbance pattern in Aka-J̌eru and Aka-Kede versions
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not define this as a formal motif, and one version
    mentions breaking firewood rather than deliberate disturbance of cicada song.
