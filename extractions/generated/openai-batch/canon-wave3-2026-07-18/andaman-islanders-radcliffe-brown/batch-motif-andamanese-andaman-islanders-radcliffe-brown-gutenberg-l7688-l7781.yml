canonical_text:
  quote: ''
  summary: The passage reports several Andamanese legends about the first acquisition
    of fire, the loss or rescue of fire after flood or storm, and catastrophes in
    which ancestors are killed, survive, or are transformed into animals. It includes
    variants involving Puluga, Tomo, Lači Puŋa Ablola, Luratut, Biliku, several named
    animal-person figures, storm or flood, preserved fire, and renewed forest growth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One fire-origin version says Puluga made the first man, Tomo, then gave him
    fire and taught him its use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In that version, Puluga stacks two kinds of wood and bids the sun to sit on
    or near the pile until it ignites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A second fire-origin version says Puluga comes to Tomo with the spirit Lači
    Puŋa Ablola; Tomo prepares and strikes a pyre, and Puŋa Ablola teaches him to
    cook food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator notes a contradiction in Lači Puŋa Ablola being described as
    a deceased person’s spirit while Tomo is described as the first Andamanese, and
    suggests the inconsistency may come from transcription.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: A flood legend says all fires are extinguished by the flood, leaving a few
    survivors without fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the flood legend, a recently deceased friend appears as the bird Luratut,
    flies to the sky where Puluga sits beside his fire, attempts to carry away a burning
    log, and the log falls near the survivors after Puluga hurls it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator groups several legends as accounts of a great catastrophe overwhelming
    the ancestors; many versions include transformation of ancestors into animals,
    and some are connected with Biliku, Puluga, or the first discovery of fire.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In one Aka-J̌eru version, Mimi Čara breaks firewood in the evening while the
    cicada is singing; a great storm kills many people, people are turned into fishes
    and birds, water covers the trees, and Mimi Čara and Mimi Kota preserve fire under
    a cooking-pot in a cave until the storm ends.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In another Aka-J̌eru version, people make noise while Mite the cicada is singing;
    Biliku becomes angry, throws pearl shells identified with lightning, causes storm
    and heavy rain, destroys the world, later lives in the sky, and drops a Dipterocarpus
    seed from which trees grow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The informant adds that Maia Taolu saved the fire on the occasion of Biliku’s
    catastrophe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In an Aka-Čari legend, Maia Dik becomes angry, throws fire at the ancestors,
    the ancestors become birds and fishes, and Maia Dik becomes a large prawn.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A related version says Maia Dik first discovered fire by striking paraŋo wood
    and then threw burning wood among the ancestors, who became birds and fishes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In a similar Aka-J̌eru version, Maia Ko̱lo throws fire among sleeping people;
    they wake, flee into sea and jungle, and become fishes, turtle, and birds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In an Aka-Kede version, people refuse honey to Ko̱po-tera-wat; he angrily
    disturbs the cicadas’ evening song, a storm and rising sea follow, people take
    refuge in a Dipterocarpus tree, Mima Mite keeps fire alight under a cooking-pot,
    and Mima Čarami-lebek lowers people to the ground with string after the waters
    subside.
  category: sequence
  evidence_refs:
  - ev:9
