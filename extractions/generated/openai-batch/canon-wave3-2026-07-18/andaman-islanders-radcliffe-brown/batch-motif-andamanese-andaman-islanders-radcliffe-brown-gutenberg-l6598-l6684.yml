canonical_text:
  quote: ''
  summary: The passage reviews reported and observed Andamanese beliefs about postmortem
    destinations, child souls, rebirth, world renewal, return from burial, the dying
    soul's movement with the tide, and dream-associated supernatural specialists called
    oko-ǰumu or oko-paiad. The author repeatedly distinguishes Mr Man's reports from
    his own inquiries and notes uncertainty where evidence was lacking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mr Man reports that souls of good men go to paradise and souls of bad men
    are tortured in purgatory, while the author states that his own inquiries found
    no evidence that good and bad people receive different treatment after death.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In conversations with Akar-Bale and A-Pučikwar men, the author did not hear
    of J̌ereg as distinct from J̌ereg-l’ar-mugu; he notes that the latter name includes
    a component meaning “front.”
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mr Man states that the souls and spirits of young children go to Čaitan and
    subsist on fruit of a rau tree, while the author found a North Andaman belief
    that unborn children's souls live in actual Ficus trees on earth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states a common belief that if a baby dies, the soul enters the
    mother again and is born a second time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author says there are several myths in which the world comes to an end
    and starts afresh, generally associated with Puluga or Biliku; the versions he
    heard referred to the past rather than the future.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Andamanese are said to speak of unconsciousness as “death” and to regard
    someone long unconscious as dead and returned to life again.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A North Andaman tale describes a man who died, was buried, reappeared as his
    people left camp, later died and reappeared again, and after a third death was
    buried deeply; when his bones were later sought, only the burial wrappings remained.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Among North Andaman coast-dwellers, the author found a belief that the soul
    of a dying man goes out with the ebbing tide.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Certain individuals are distinguished by supposed supernatural powers and
    are called oko-ǰumu in North Andaman and oko-paiad in Aka-Bea; these terms are
    explained as meaning “dreamer” or “one who speaks from dreams.”
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mr Man states that only men can possess oko-paiad powers, but the author's
    informants said women may also possess them, although men more often become famous
    in this way.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:11
  text: The passage says that information about oko-ǰumu and oko-paiad is difficult
    to obtain because many older practitioners are dead, younger men show scepticism,
    interpreters were sometimes necessary, and elders would not reveal professional
    secrets before younger men of their own race.
  category: other
  evidence_refs:
  - ev:12
