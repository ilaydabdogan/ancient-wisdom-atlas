literal_observations:
- id: obs:1
  text: The bow is strung by fastening the knotted end of the bow-string with a slip
    knot, fixing one bow end against the ground or a stone, bending the bow with hand
    and foot, and slipping the string loop over the other end.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After stringing, the bow appears S-shaped from the side; a man strings and
    tests it when starting to hunt or fish, and unstrings and stores it in his hut
    on return.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The knot at one end of the string permits tightening if the string stretches
    during use.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The string is usually served with Anadendron fibre thread at the point where
    the arrow nock is placed when drawing the bow.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The South Andaman bow uses wood from the concave side of a tree bent during
    growth, where the compressed fibres are described as stronger, tougher, and more
    elastic.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: When strongly drawn, the South Andaman bow changes from an S-shape toward
    a true arc shape, concentrating strain on the outward-curved lower portion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The breadth, narrowed handle, and tapered ends of the bow are explained as
    functional features preventing string slippage, permitting grip, and reducing
    splitting at the ends.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: South Andaman bows are always decorated with incised patterns, and newly made
    bows may also be decorated with red paint and white clay, especially when intended
    as gifts.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some South Andaman bows are made so large as to be almost useless for hunting;
    they are carefully made and decorated, intended as gifts, and may be used in shooting
    matches to show skill.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Toy bows of similar form to ordinary hunting bows are made for boys in South
    Andaman tribes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The North Andaman bow is described as shorter, lighter, and more slender than
    the South Andaman bow, though it may be broader in its broadest part.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The North Andaman bow is usually cut from curved wood but may sometimes be
    cut from wood that is practically straight.
  category: object
  evidence_refs:
  - ev:7
