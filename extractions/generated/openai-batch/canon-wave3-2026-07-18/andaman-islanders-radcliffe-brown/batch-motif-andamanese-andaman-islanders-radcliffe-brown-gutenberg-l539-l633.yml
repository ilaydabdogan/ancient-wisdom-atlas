literal_observations:
- id: obs:1
  text: The passage presents a hypothesis that the Andaman Islanders may have been
    entirely isolated in their island home and may have developed culture in adaptation
    to their environment.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, in historical times, mariners avoided the islands
    because natives attacked strangers who landed or were wrecked there; it also states
    that coconuts were absent before the first European settlement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The earliest authentic reference cited is attributed to two Arab travellers
    dated A.D. 871 and, in Renaudot’s translation, describes inhabitants of the Andaman
    coast as eating raw human flesh, lacking boats, and attacking ships that stopped
    for water.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Chinese and Japanese sources knew the islands in the first
    millennium A.D.; it also cites Marco Polo’s hostile description, while noting
    that some of his details were incorrect and derived from hearsay.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The account of Master Caesar Frederike is cited as describing the islands
    as inhabited by wild people, with inter-island warfare using small barques, danger
    to shipwrecked crews, and no trade with outsiders.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that seventeenth- and eighteenth-century references show
    the islands were feared and avoided, and it lists contacts through wrecks, water-seeking
    ships, Malay pirates, boats seeking edible birds’ nests and trepang, and capture
    of Andamanese as slaves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that the Andamanese learned the use of iron from vessels
    that visited or were wrecked on their shores; by 1771 they were aware of the value
    of iron, and wrecks remained the only supply until the mid-nineteenth century.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage recounts that the East India Company commissioned Archibald Blair
    in 1788 to found a settlement, that the settlement began in 1789, was transferred
    in 1792, and was abandoned in 1796 because the new site was unhealthy.
  category: sequence
  evidence_refs:
  - ev:7
