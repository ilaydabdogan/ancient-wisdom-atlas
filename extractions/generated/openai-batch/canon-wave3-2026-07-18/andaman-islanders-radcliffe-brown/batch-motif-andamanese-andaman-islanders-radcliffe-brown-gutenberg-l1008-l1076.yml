- id: obs:1
  text: Diminution of population is said to have altered the islanders’ mode of life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Communities formerly described as distinct and often hostile are now merged
    together.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Different languages are described as having become corrupt, and some tribes
    are said to have adopted customs of other tribes and abandoned their own.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Most younger men and women of the friendly tribes of the Great Andaman now
    speak some Hindustani or Urdu in a corrupt form.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The friendly natives are under the charge of an Officer in Charge of the Andamanese,
    and a Home and Hospital are provided for them at Port Blair.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: Some natives collect trepang under petty officers; trepang, wild honey, and
    shells are sold for the service of the Andamanese Department.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Government of India grant is linked to the Officer in Charge providing Andamanese,
    when necessary, to track and capture runaway convicts from the Penal Settlement.
