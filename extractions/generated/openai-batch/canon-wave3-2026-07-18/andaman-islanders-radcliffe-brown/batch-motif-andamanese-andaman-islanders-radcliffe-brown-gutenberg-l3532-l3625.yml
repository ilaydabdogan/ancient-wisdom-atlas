canonical_text:
  quote: ''
  summary: The passage first reports a North Andaman association between unborn souls,
    the green pigeon, and the Ficus laccifera tree, including a limited taboo on the
    tree. It then describes Andamanese life stages, childhood residence patterns,
    repeated scarification of children, and a Northern girls' first-menstruation ceremony
    involving sea bathing, removal of ornaments, leaf coverings, seclusion, bodily
    restrictions, silence, sleeplessness, attendance by kin and friends, and a month
    of dawn sea bathing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The same name, Reŋko, is used for both the green pigeon and the Ficus laccifera
    tree, whose fruit the pigeon favors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Native statements say that souls of unborn children live in Ficus trees and
    that the soul of a baby dying before weaning goes back to the tree.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another native statement says that a baby's soul goes into its mother when
    the green pigeon is calling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'The Ficus tree is described as to some extent taboo: it should not be cut
    or damaged, though people do cut it to obtain aerial-root bark for fibre used
    in personal ornaments.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: There is no taboo connected with the green pigeon, which may be killed and
    eaten.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that ceremonies marking the change from boy or girl to
    man or woman are commonly called initiation ceremonies in ethnological literature.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The life of an Andaman Islander is divided into childhood, adolescence, and
    maturity, bounded roughly by birth, puberty, marriage, and death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children live with parents or adopted parents; girls continue there until
    marriage, while grown young men before marriage occupy a bachelors' hut and have
    their own meal.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Every boy and girl undergoes repeated scarification during childhood, using
    a small flake of quartz or glass; the operator is always a woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Natives explain scarification either as improving personal appearance or as
    helping the child grow strong.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At first menstruation, a girl tells her parents, who weep over her; she then
    bathes alone in the sea for an hour or two.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the first-menstruation ceremony, ornaments are removed and the girl
    is covered or banded with Pandanus, čainyo, čelmo, or poramo leaves.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The girl sits in the allotted hut with folded limbs, may not lie down, must
    use a skewer to feed herself, and may not speak or sleep for twenty-four hours.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The girl sits in this manner for three days, bathes in the sea each morning,
    then resumes village life, while continuing dawn sea bathing for a month.
  category: sequence
  evidence_refs:
  - ev:10
