canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese body-painting materials and patterns:
    food-associated designs after meals, special patterns for initiation and first
    menstruation, a white-clay snake pattern used on ceremonial occasions and made
    by women, and red paint used for illness and in ceremonial decoration.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Body-painting patterns are made in the afternoon after men return from hunting,
    either just before or just after a meal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person asked about his painted pattern replies by naming the food just eaten,
    such as turtle or pork.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author reports no strict uniformity between particular designs and foods,
    though one turtle-related design appeared based on turtle carapace plates and
    was not observed except after eating turtle.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some pork-associated patterns used vertical lines or bands on the back and
    chest; the author notes a possible connection with longitudinal markings on wild
    pigs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pattern called kimil-t’e̱ra-puli is used only to paint a person described
    as aka-kimil, meaning someone who has just been through an initiation ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pattern called toto-t’e̱ra-puli, or Pandanus pattern, is reported as used
    to decorate a girl after the ceremony at her first menstruation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fine white clay called to̱l-odu is applied in one customary body-ornament
    pattern named from snake terms in several Andamanese languages.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The white-clay snake pattern is built from zig-zag lines and rows of lozenges
    made by applying clay mixed with water using the thumb and first finger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The snake pattern may cover the front and back of the body, arms, legs, and
    face; women make these patterns, and a wife is said to have the duty to decorate
    her husband when needed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The stated reason given by natives for this ornamentation is that it makes
    them look well; many performers are so ornamented at big dances and at dances
    when local groups meet.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Custom requires the snake pattern at the dance at the end of mourning; mourners
    are forbidden to use it during mourning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The snake pattern is used on a bride and bridegroom after marriage, on a youth
    or girl before initiation-related turtle-eating and pig-eating dances, and on
    a corpse before burial.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: On less ceremonial occasions, a man may have only his face decorated with
    white clay.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Red paint is used on ill persons on specified body parts, including chest
    and neck for colds and coughs and upper lip for fevers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Red paint also has ceremonial use in combination with white clay, with red
    lines placed between the clay lines of the snake pattern for burial, end-of-mourning
    dances, and initiation dances.
  category: action
  evidence_refs:
  - ev:8
