canonical_text:
  quote: ''
  summary: The passage describes Andamanese arrows, harpoons, turtle nets, spears,
    and fish-gigs, with comparisons to Semang and Philippine Negrito arrow practices
    and notes on regional distribution and recent adoption of some technologies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: No arrows made in the Andamans are feathered.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Andamanese, Semang, and Philippine Negritos are described as using arrows
    with detachable heads.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Semang and Philippine Negritos are said to feather their arrows, unlike
    the Andamanese; the passage says Semang feathering may be nonfunctional or possibly
    magical.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Semang poison their arrows, while the Andamanese do not; the Semang are
    described as long-time neighbors of people using blow-pipes with poisoned darts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Great Andaman, the harpoon is described as the most important hunting
    weapon after the bow and arrow and is used for dugong, turtle, porpoise, and large
    fish.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The harpoon consists of a head, shaft, and line; the line is Hibiscus-fibre
    rope, the shaft is bamboo, and the head is a pointed iron piece with iron barbs
    attached by thread.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A harpooner stands on the forward platform of a canoe, poles along the reef,
    raises the shaft, leaps forward to strike, and the line holds the struck animal
    while the bamboo shaft floats loose.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Harpoons are not used in Little Andaman; Great Andaman people say they began
    using harpoons only after obtaining iron and formerly captured turtle and dugong
    in nets.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Turtle nets are described as formerly made of Hibiscus-fibre rope, with variable
    length and different knot types recorded from South and North Andaman.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A turtle net was attached to stakes, weighted below with stones, fitted above
    with wooden floats and fibre tassels, and placed in shallow water so observers
    could see agitation when a turtle became entangled.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nets of the described turtle-net type are said not to be used in Little Andaman
    so far as known.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Andamanese make practically no use of spears; Great Andaman pig-spears
    with iron heads are described as recent, probably made in imitation of Burmese
    convict spears, and hardly ever used because the pig-arrow is preferred.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The true fish-spear is said to be unknown in the Andamans, though a smaller
    harpoon is sometimes used for fish.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: A former North Andaman fish-gig consisted of about twelve sharpened Areca-wood
    pieces fastened side by side and was used for spearing small fish in reef pools.
  category: object
  evidence_refs:
  - ev:10
