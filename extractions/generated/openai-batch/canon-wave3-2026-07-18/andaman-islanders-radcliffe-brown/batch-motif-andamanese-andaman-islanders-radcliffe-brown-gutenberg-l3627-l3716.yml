canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese puberty and menstrual customs: a girl’s
    first menstrual ceremony involves temporary name avoidance, a flower-name, and
    restrictions; menstruating women observe food taboos. It also describes boys being
    made aka-op, especially in Northern tribes, through a sequence involving dancing,
    sea bathing, scarification with a pig-arrow, fire, silence, temporary name substitution,
    and subsequent food restrictions. Variations by tribe, region, and sex are noted.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During and shortly after the girl’s ceremony, she is not addressed or spoken
    of by her childhood name, but is referred to as Alebe or Toto.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Toto is identified as the name of a Pandanus species whose leaves are used
    in the ceremony and from which women’s belts are made.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the ceremony the girl receives a new flower-name, taken from a plant or
    tree in flower at the time, and this name is used until after the birth of her
    first child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the ceremony the girl is described as aka-ndu-kolo̱t and for some time
    must not have her head shaved or use red paint or white clay.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: One informant’s account attributes the first menstrual discharge to sexual
    intercourse, specifically to a man’s breath entering the girl’s nose, and states
    that a man touching her during this period would have his arm swell.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At each menstrual period a woman must abstain from specified foods; eating
    them is said to cause illness, and the rule continues until the climacteric.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A menstruating woman is not required to leave the camp according to this passage.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The term aka-op, or aka-yaba in Aka-Bea, denotes a person under ritual restrictions,
    chiefly food restrictions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: For boys, relatives and friends decide when the boy is to become aka-op; in
    Northern tribes this is done through making customary scars on his back.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boy’s ceremony includes an evening dance lasting through the night, bathing
    in the sea after morning breaks, kneeling with elbows on the ground, and cuts
    made on his back by an older man using a pig-arrow blade.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The cuts on the boy’s back are horizontal and arranged in three vertical rows,
    each row containing about twenty to thirty cuts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the cutting, the boy sits with a fire at his back until the bleeding
    stops, and he must remain silent during the operation and for a few hours afterward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: For a few weeks after the back cuts, the boy’s own name is dropped and he
    is addressed and spoken of as Eǰido.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the back cuts the boy is described as oko-taliŋ-kolo̱t, becomes aka-op,
    and is under restrictions concerning foods he may eat.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: When the back wounds have healed, similar cuts are made on the boy’s chest;
    in North Andaman every man is said to have three rows of scars on the back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Some North Andaman women have similar scars on the chest and a few on the
    back, but these are not regularly part of initiation ceremonies and may be made
    after marriage.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:17
  text: During aka-op status, boys and girls must abstain from chief foods in turn;
    the exact rules differ by tribe and particularly between coast-dwellers and jungle-dwellers.
  category: action
  evidence_refs:
  - ev:7
