canonical_text:
  quote: ''
  summary: The passage interprets the Akar-Bale legend as an account of the origin
    of night and of singing and dancing. It reports that there was once no night,
    that an ancestor crushed a cicada and the insect's cry brought darkness, and that
    ancestors responded by singing and dancing until Ko̱ŋoro sang and day returned.
    The author connects the story with a prohibition on interfering with cicadas,
    North Andaman statements that spirits make night by drawing a mat or cloth across
    the sky, the custom of singing beside a corpse at night to keep spirits away,
    and the use of resin light for dancing and night fishing.
  language: English
  quote_policy: summarized
