canonical_text:
  quote: ''
  summary: The passage describes the aka-op period of food abstention among North
    Andaman communities, including staged release through food-eating ceremonies.
    Among Aka-Čari coast-dwellers the major ceremonies are turtle-eating and pig-eating;
    among forest-dwelling communities the major ceremonies include ńyuri-eating, pig-eating,
    and honey-eating. It also begins a description of the turtle-eating ceremony,
    including a turtle hunt, cooking, removal of ornaments, ceremonial seating, orientation
    toward the sea, and a nearby fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among Aka-Čari coast-dwellers, a boy or girl in the first part of the aka-op
    period must avoid many foods, including turtle, dugong, porpoise, certain fish,
    grubs, monitor lizard, flying fox, birds, shellfish, mangrove seeds, roots, and
    other vegetable foods.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The turtle-eating ceremony ends the first period of Aka-Čari abstention; after
    it, turtle and many formerly forbidden foods may be eaten, while certain turtle
    parts remain forbidden and pork becomes forbidden.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pig-eating ceremony ends the pork restriction; after that the youth is
    gradually freed to eat other foods, with minor ceremonies for some important foods
    such as honey, dugong, porpoise, and the fish komar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In forest-dwelling North Andaman communities, important ceremonies include
    ńyuri-eating, pig-eating, and honey-eating; Aka-Bo informants reported avoidance
    of creek fish, monitor lizard, sucking-pig, two snakes, vegetable foods, and honey
    during the first part of abstention.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the aka-op period, the youth abstains for a time from each of the more
    important foods of the community and later eats each food for the first time after
    abstention under ritual conditions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: For some foods, the ritual requires that the food be given by an older man
    who is himself free to eat it, that it be eaten in silence, and that the person
    be painted afterward with clay called odu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In North Andaman coast-dwelling communities, abstention from turtle and other
    foods begins for a girl at first menstruation and for a boy when his back is cut;
    it may last one year or several years and is closed by the turtle-eating ceremony.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When older men decide that a boy is to be released from abstention from turtle,
    they arrange a turtle-hunting expedition; the best turtle is selected, killed,
    and cooked.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the turtle-eating ceremony setup, the youth is seated in a hut, has
    ornaments removed, and sits on leaves with bundles of leaves placed under folded
    arms over the belly and behind the back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The seated youth must remain still with folded arms, legs stretched forward,
    big toes clasping each other, facing the open sea, with a fire placed nearby,
    generally beyond the feet.
  category: action
  evidence_refs:
  - ev:5
