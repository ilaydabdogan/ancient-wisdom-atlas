canonical_text:
  quote: ''
  summary: 'Radcliffe-Brown interprets Andamanese versions of a legend about the origin
    of night and the restoration of day. He identifies common elements across variants:
    night or darkness arises after a rule is broken and anger or irritation disrupts
    social harmony; singing and dancing by the ancestors neutralize darkness and bring
    day back. He also discusses variant animal actors, including teŋat, ko̱ŋoro, Pe̱tie
    the monitor lizard, a cicada, and a grub called gurug, and distinguishes major
    from minor motives in comparing versions.'
  language: English
  quote_policy: summarized
