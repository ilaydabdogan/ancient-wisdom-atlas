canonical_text:
  quote: "“Biliku is angry.”"
  summary: The passage describes Andamanese beliefs about Biliku/Puluga, Tarai/Daria,
    and related beings as senders of winds, storms, thunder, and lightning. It records
    name variants, explanations of lightning, storm-causing taboos involving beeswax,
    cicadas, noise, and certain foods, and reports that some people deliberately burn
    wax to bring storms against others.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In the Akar-Bale tribe, Puluga and Daria are usually stated to be male; this
    was apparently also common belief among the Aka-Bea.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In North Andaman, Biliku is also the word for “spider”; Tarai has no discovered
    meaning in the passage. In Little Andaman, a female storm-sending mythical person
    named Öluga is reported, and öluga is also the word for monitor lizard there.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage states that Biliku and Tarai send winds: Tarai sends the south-west
    wind that brings rain, while Biliku sends other winds, including winds connected
    with fine weather or violent storms.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Akar-Bale account says Puluga and Daria were once friends, quarrelled over
    which was more important, and now alternately send their winds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: According to one Akar-Bale statement, Puluga makes wind by fanning with a
    very large kwar-toŋ leaf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rain, thunder, and lightning accompanying the south-west wind are attributed
    to Tarai; storms in Biliku’s season are attributed to Biliku’s anger.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Lightning is explained as a fire-brand thrown by Biliku, as a pearl-shell
