  summary: The passage consists chiefly of ethnographic endnotes. It reports Portman's
    record of murders and subsequent punishment, comments on a decline in murder among
    the Great Andaman tribes, gives notes on nicknames, kinship terminology, Andamanese
    word prefixes, terms for husband and wife, methodological limits in the author's
    study of relationships, and a brief custom in which a husband sits on his wife's
    lap when they greet.
