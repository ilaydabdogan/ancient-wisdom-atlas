canonical_text:
  quote: ''
  summary: The passage describes Andamanese naming practices, temporary avoidance
    of personal names during mourning, childbirth, marriage, and initiation, and the
    use of clay and pigments for mourning, initiation, and patterned body decoration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy retains his birth-name and nick-name through life, but during adolescence
    passes through initiation ceremonies and receives a new unused nick-name at the
    turtle-eating ceremony; the author is unsure about a similar name at the pig-eating
    ceremony.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls pass through the same ceremonies as boys, but the author did not learn
    whether girls receive new names on those occasions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Names are generally used freely, but younger persons customarily use terms
    of address when speaking to older persons, and a person often hesitates to state
    his own name.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Personal names are temporarily avoided after a relative's death, around a
    child's birth, shortly after marriage, during initiation ceremonies, during a
    girl's puberty ceremony, and after a boy's back-scar ceremony in Northern tribes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Alternative terms of address are used during some periods of name avoidance,
    including Bolok, Ropuč, Kimil, Toto, and Eǰido.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The name of a dead man or woman is not mentioned during the mourning period,
    which lasts for some months.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Three substances are described for painting the body: common clay, fine white
    pipe-clay, and red pigment made from burnt oxide of iron mixed with fat or oil.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Common clay is used by mourners to smear the whole body and plaster the head,
    is spattered over initiates during turtle-eating and pig-eating ceremonies, and
    is used for decorative body patterns.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Body patterns called e̱ra-puli are made by women, who decorate each other
    and their male relatives with clay mixed with water and applied with the fingers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Body-painting designs may be made by finger-painting lines or by smearing
    clay and scraping it away with fingers, a fish-bone, or a small bamboo instrument;
    designs are often symmetrical and may cover much of the body.
  category: action
  evidence_refs:
  - ev:8
