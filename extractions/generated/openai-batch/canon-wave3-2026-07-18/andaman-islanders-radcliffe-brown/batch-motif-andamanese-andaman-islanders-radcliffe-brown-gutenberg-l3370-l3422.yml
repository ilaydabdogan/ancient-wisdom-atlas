  summary: The passage describes feuds between neighboring Andamanese local groups,
    women-mediated peacemaking, a long feud between the Aka-Bea and the J̌a̤rawa,
    J̌a̤rawa defensive camp practices, limited scale of fighting, an exceptional South
    Andaman attack on Port Blair, and narrow communication between local groups.
