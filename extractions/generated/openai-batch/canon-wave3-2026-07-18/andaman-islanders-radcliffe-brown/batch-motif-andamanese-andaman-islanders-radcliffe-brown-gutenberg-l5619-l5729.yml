literal_observations:
- id: obs:1
  text: Puluga or Biliku is said to live in the direction from which the north-east
    wind blows, described as really N.N.E.; a side of Havelock Island is named as
    facing Puluga.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that all Great Andaman tribes agree on the association
    of Biliku/Puluga with the north-east, Tarai/Deria with the south-west, and both
    beings with winds from those opposite compass points.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the A-Pučikwar tribe, winds are divided into the south-west wind called
    Teriya and all other winds collectively called Bilik; Bilik is described as a
    common name for a class of personified winds, also found in the Aka-Ko̱l tribe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: One Akar-Bale statement says Puluga has two brothers, J̌ila Puluga and Koaičo
    Puluga, who send easterly and westerly winds respectively.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The Andaman year is described in terms of wind patterns: a south-west monsoon
    rainy season, a north-east wind period, and variable winds during monsoon changes.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The south-west wind is identified with Tarai/Deria, while winds other than
    the south-west are commonly supposed to be sent by Biliku/Puluga.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The year is divided into a Tarai/Deria portion during the south-west monsoon
    and a longer Biliku/Puluga portion divided into stormy, cold, and hot seasons.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the North Andaman, Biliku is commonly regarded as female and Tarai as male,
    and they are frequently said to be husband and wife, though the passage reports
    lack of uniformity.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Recorded North Andaman variants assign different spouses and children to Biliku
    and Tarai, including Perǰido, the sun and moon, and named birds.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Aka-Kede, Aka-Ko̱l, and A-Pučikwar accounts vary in the stated gender
