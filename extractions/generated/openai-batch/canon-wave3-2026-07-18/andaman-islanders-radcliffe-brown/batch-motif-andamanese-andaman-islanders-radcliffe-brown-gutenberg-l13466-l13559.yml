canonical_text:
  quote: ''
  summary: The passage gives an ethnographic and technical discussion of Andamanese
    basket-work and netting. It describes South, North, and Little Andaman basket
    forms, proposes a hypothetical sequence of basket-work development, argues that
    wicker-work was later than wrapped techniques among the Andamanese, compares Semang
    and Philippine Negrito basket-work as probable contact borrowings, and describes
    women making netted bags, fishing nets, ornaments, and the basic netting method.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The South Andaman basket is described as conical, similar in shape to the
    Little Andaman basket, but with its bottom dented inward to make a kick that lets
    it stand on its bottom.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The South Andaman basket uses thin cane uprights that can be bent, wicker-work
    instead of wrapped work, and three rows of wrapped-twined work at the top of the
    weaving.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author presents a possible developmental stage between the Little Andaman
    and South Andaman baskets, but explicitly marks this intermediate stage as a surmise.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The North Andaman basket is described as differing from a South Andaman-like
    form by its materials and shape; its materials are said to be stronger and more
    durable, and its shape avoids the top-heaviness of the southern basket.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Both northern and southern baskets are said to share a gap between the top
    of the weaving and the rim, like the Little Andaman basket.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The author lists a hypothetical sequence of basket-work forms: North Andaman
    pot-covering, South Andaman pot-basket, rough Little Andaman basket, South Andaman
    cane basket with a kick, and finally the North Andaman basket.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the original ancestors of the Andamanese were probably
    not acquainted with wicker-work or had no use for it, and that wicker-work in
    the Great Andaman Division was likely adopted after the Great and Little Andaman
    Divisions separated.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage describes an Andamanese technical preference for processes in
    which a single flexible material is wound or wrapped around other rigid or flexible
    material.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Semang are said to make mat-work bags and wallets of check and to make
    or use baskets of hexagonal work; these techniques are also used by other groups
    in the Malay Peninsula and Malaysia generally.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says the same contact-adoption explanation would seem to apply
    to present Philippine Negrito basket-work, while also noting that little is known
    about it.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women of both Great Andaman and Little Andaman Divisions make netted string
    bags for carrying or storing small objects, and make small hand fishing nets from
    Gnetum fibre thread.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the Great Andaman Division, netting is also used for personal ornaments,
    generally with thread made from Anadendron fibre.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The netting method uses bamboo or cane netting needles with string wound on
    them; for the foundation of a net, a tied loop of string is placed over the big
    toe while the woman sits on the ground.
  category: sequence
  evidence_refs:
  - ev:8
