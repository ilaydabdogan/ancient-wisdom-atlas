canonical_text:
  quote: ''
  summary: The passage interprets Andamanese flood and origin legends as presenting
    a threefold world of water, earth, and forest-top. Ancestors climb trees during
    a flood; birds remain above while human beings descend, and aquatic animals are
    linked by the author to those who did not reach the upper world. The monitor lizard
    and civet-cat are discussed as exceptional figures because of their relation to
    multiple realms. A Dipterocarpus tree and seed appear in forest-origin traditions,
    and origin-of-animals variants describe a storm or cyclone that turns ancestors
    into animals.
  language: English
  quote_policy: summarized
