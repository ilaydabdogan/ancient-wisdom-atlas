  text: The passage reports that people initially felt shy and perhaps frightened
    during the first hours of such meetings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Visitors brought objects such as bows, arrows, adzes, baskets, nets, red paint,
    and white clay, gave them to hosts, and received presents in return.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A giver expected a return present of equal value and could become angry if
    the return did not meet expectations; sometimes a desired exchange object was
    mentioned, but the process is explicitly distinguished from barter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The exchange could distribute materials such as red ochre, white clay, shells,
