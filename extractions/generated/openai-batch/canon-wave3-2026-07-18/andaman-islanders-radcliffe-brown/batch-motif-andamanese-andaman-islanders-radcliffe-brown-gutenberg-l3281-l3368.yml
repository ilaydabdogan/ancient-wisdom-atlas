canonical_text:
  quote: The purpose that it did serve was a moral one.
  summary: The passage describes meetings between Andamanese local groups, including
    organized invitations, reciprocal gift exchange, hospitality, hunting, feasting,
    singing, dancing, possible peacemaking, possible new quarrels, and the conduct
    of surprise raids between groups during feuds.
  language: English
  quote_policy: quoted
literal_observations:
