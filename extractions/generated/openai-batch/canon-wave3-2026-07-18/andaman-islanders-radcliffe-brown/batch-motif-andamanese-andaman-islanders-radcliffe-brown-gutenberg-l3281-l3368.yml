  text: 'The exchange is described as having a moral purpose: producing friendly feeling
    between the two persons concerned.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: No one was free to refuse an offered present, and men and women competed amiably
    in generosity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Visitors stayed for a few days; the time included hunting, feasting, dancing,
    exchanging presents, and evening singing and dancing with newly composed songs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Meetings could end past quarrels but could also cause new quarrels over perceived
    poor presents or poor entertainment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Maintaining harmony in the camp could require a man of strong influence, and
