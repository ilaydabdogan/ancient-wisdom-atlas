  text: Meetings of two or more local groups were arranged by more prominent men,
    with a fixed time and place and invitations to neighbours.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Visitors, including men, women, and children, arrived at the appointed time
    and were accommodated by hosts.
  category: relationship
  evidence_refs:
