canonical_text:
  quote: ''
  summary: The passage interprets Andamanese beliefs about the moon as personifying
    the moon as an angry or jealous being who gives useful moonlight for night fishing
    and hunting, but withdraws it when artificial light appears. It then summarizes
    several Andamanese fire-origin legends in which the ancestors first lacked fire,
    fire was introduced by a varying actor, and some ancestors were burned or frightened
    into becoming animals; the burns explain animal markings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moonlight is described as socially valuable because it enables night fishing
    and the catching or harpooning of turtle and dugong.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second quarter of the moon is associated with increasing light and night
    expeditions, while the third quarter is associated with diminishing light, darkness
    at the beginning of the night, abandonment of expeditions, or dependence on torches.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the beginning of the third quarter, the moon rises in the evening with
    a ruddy, swollen appearance that the natives explain by saying the moon is angry.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that anger is associated with heat among the Andamanese
    and that the red glow of the moon is regarded as a visible sign of anger.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The moon's anger is said to be caused by a bright light visible when the moon
    rises; if someone uses artificial light such as fire, torch, or burning resin,
    the moon becomes angry and withdraws moonlight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Three recorded legends are summarized in which the ancestors initially had
    no fire, fire was introduced by one of them, and many ancestors were burned or
    frightened and turned into animals.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In different versions, the fire-introducing actor is the sea-eagle, the prawn,
    or Dim-do̱ri, now a fish.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fire-origin legend is described as widespread in both the north and south
    of the islands, and the varying actor is treated as a minor motive by the author.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The legend is said to explain markings on birds and fishes as places where
    the ancestor who became the species was burned by fire, and the author calls it
    etiological.
  category: relationship
  evidence_refs:
  - ev:6
