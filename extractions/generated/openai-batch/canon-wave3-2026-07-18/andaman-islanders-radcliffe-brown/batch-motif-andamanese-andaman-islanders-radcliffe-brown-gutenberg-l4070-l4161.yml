canonical_text:
  quote: ''
  summary: 'The passage describes Great Andaman mortuary customs: death is attributed
    to jungle and sea spirits; women and men mourn in sequence; mourners use clay;
    the corpse is decorated, bundled, given an object in the hand, and farewelled
    by relatives blowing on the face. Burial may be in a ground grave or on a tree
    platform. Both forms include eastward orientation and water and fire for the corpse;
    ground burial may include personal objects or weapons, with tribal variants.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Great Andaman tribes described, disease and death are said to be due
    to spirits of the jungle and sea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a death, women gather around the body and weep until exhausted; afterward
    men come and weep over the corpse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Adult community members cover their bodies and limbs with a wash of common
    clay, while nearer relatives and intimate friends also put clay on their heads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some women remove the dead person's ornaments, shave the head, and decorate
    the body with white clay patterns and red paint.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The body is flexed, a Cyrena shell or steel knife is placed in the closed
    hand, and the body is wrapped in a sleeping mat and palm leaves and tied into
    a bundle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before the bundle is fully tied, relatives take a last farewell by gently
    blowing on the face of the corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Male relatives and friends carry the corpse to the burial place; women take
    no part in the actual burial.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Two disposal modes are described: burial in a ground grave and placement
    on a platform in a tree; the tree-platform form is considered more honourable
    and is used for those dying in the prime of life.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In ground interment, the body is placed slightly on its side facing east;
    the reported explanation is that failure to observe this custom would prevent
    the sun from rising and leave the world in darkness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In ground interment, fire is lit beside the grave and water in a bamboo vessel
    or nautilus shell is left for the corpse; personal objects and weapons may also
    be placed in or on the grave.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: In tree-platform burial, a stick platform is erected about twelve feet above
    ground, the body lies sideways facing east, and water and fire are placed beneath
    the tree.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage reports uncertainty and variation about tree selection for platform
    burial, and notes Ficus laccifera and coastal mangroves as trees said to be used.
  category: other
  evidence_refs:
  - ev:8
  - ev:9
