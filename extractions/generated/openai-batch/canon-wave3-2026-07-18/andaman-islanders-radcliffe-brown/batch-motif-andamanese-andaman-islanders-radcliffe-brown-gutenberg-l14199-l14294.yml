canonical_text:
  quote: ''
  summary: The passage describes Andamanese canoes, their dimensions, balancing, onboard
    equipment, decoration, propulsion in deep and shallow water, gendered work in
    making and painting them, and the later large canoe form using oars after contact
    with the Penal Settlement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Canoes of the described type vary widely in size; a small three-boom canoe
    carried three persons, while a large canoe could measure about 9 metres.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A canoe may require stone or coral ballast for balance; it can overturn in
    a rough sea, but because it is made of light wood it does not sink when full of
    water and can be righted and baled out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Canoe equipment includes ballast, a stone or tin piece for keeping a small
    fire smouldering, an anchor of coral or stone on rope, Nautilus shells for baling,
    a bamboo pole, and paddles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prow platform has holes for fastening anchor rope; turtle skulls may hang
    below it, and a torch may be slung there during dark-night turtle hunting so the
    harpooner remains in shadow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Finished canoes are decorated with red paint and white clay, especially on
    the forward platform and gunwale; these designs wear off and are not renewed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Typical paddles are leaf-shaped, cut from Myristica longifolia wood with an
    adze, planed with a boar’s tusk, and sometimes decorated when new with red and
    white designs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In deep water, occupants sit facing forward and paddle, while a steersman
    on the stern platform keeps the course; in shallow water, the canoe is propelled
    with a pole from the forward platform, sometimes with another pole at the stern.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Men do the making of canoes and paddles and make most use of canoes, while
    painting is usually done by women.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The large canoe used by the Great Andaman Division is described as the same
    general hull shape as the Great Andaman outrigger canoe, but cut from a larger
    tree and made without the outrigger.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: After obtaining more iron tools, the people are described as cutting and hollowing
    larger trees; well-cut large canoes ballasted with stone could float without outriggers
    and balance better in rough sea than smaller outrigger canoes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The principle of the oar is attributed to contact with the Penal Settlement;
    in large canoes the oar passes through a cane loop serving as a rowlock, rowers
    face aft, and a man at the stern steers with a paddle.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A wooden thwart is placed through holes near the bow to fasten the harpoon
    line or anchor line, serving the function of the foremost boom in an outrigger
    canoe.
  category: object
  evidence_refs:
  - ev:11
