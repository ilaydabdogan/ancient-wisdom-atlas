  summary: Ethnographic description of Andamanese basket construction, ornamentation,
    and flexible-material techniques, including South and North Andaman basket forms,
    basket materials and weaving steps, rim gaps for securing contents, trophy skull
    basket-work, and two-ply or wrapped-cord binding methods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Hibiscus fibre handle is attached to a basket rim and rests across the front
    of the chest when the basket is carried on the back.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: South Andaman baskets may be ornamented during making with horizontally applied
    Dendrobium skin by overlaid interlacing, and may also receive red paint, white
    clay, and shells attached by thread.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'North Andaman baskets differ from South Andaman baskets in materials: čup-to̱i
    strips form the stakes or warp, and bobi tendril fibre is prepared for weaving.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: North Andaman basket construction begins with two equal bundles tied crossways;
    thread is worked in 4 to 7 spiral turns, and the centre cross is pressed under
    the heel into a ground hollow to form the later curve or “kick.”
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: North Andaman basket weaving continues with bobi strips, wrapped-twined rows,
    a cane rim tied to the uprights, the uprights bent and tied down, the rim served
    or bound with thread, and a Hibiscus fibre handle added.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Both North and South Andaman baskets leave a short unwoven space below the
    rim, allowing string to be tied across the mouth to keep contents safe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: North Andaman baskets have a belly at the bottom and narrow above, making
    them stand more firmly and be less top-heavy than southern baskets.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: North Andaman baskets may be ornamented with worked-in Dendrobium fibre in
    several methods and patterns, painted white and red when new, and occasionally
    shells tied by thread.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pig and turtle skulls killed in the chase were formerly preserved as trophies
    across the islands; the Great Andaman Division no longer preserves all pig skulls,
    while the Jarawa still encase every skull in simple wrapped cane basket-work.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Andamanese rope and string are described as two-ply; the Great Andaman bow-string
    is described as wrapped cord, and serving is used on arrows, bow ends, and harpoon
    heads.
  category: action
  evidence_refs:
  - ev:8
