canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic technical description of Andamanese
    canoes: their types, recent innovations, propulsion methods, tree selection and
    hollowing, hull form, caulking, and outrigger construction with floats, booms,
    sticks, and cane bindings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Canoes are described as being in regular coastal use throughout the islands,
    with three named types: a Little Andaman outrigger canoe, a Great Andaman small
    outrigger canoe, and a Great Andaman large canoe without an outrigger.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The large Great Andaman canoe without an outrigger is described as a recent
    innovation connected with access to iron tools and the ability to hollow large
    trunks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The large canoe type is said to have been invented in South Andaman and copied
    in Middle and North Andaman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Large Great Andaman canoes are rowed with short oars, except in shallow water
    where they are poled; rowing is described as adopted in imitation of European
    boats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For the small Great Andaman canoe, soft-wooded trees are selected near the
    shore or a creek, and the direction of felling is chosen according to the curve
    of the trunk and desired stability.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After felling, the trunk is cut to length, hollowed with an adze without using
    fire, stripped of bark, shaped at the ends, and finished to the required thickness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Except at stem and stern, the canoe retains the shape of the tree; the stern
    has a small platform for the steersman and the prow has a larger platform for
    the harpooner.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The prow is made from the lower and broader end of the trunk so that it can
    provide a large enough platform for the harpooner.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Small patches in prow and stern caused by the pithy core would admit water;
    these were formerly caulked with beeswax and are now often covered with tin and
    rags.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the hull is finished, it is moved to the shore or creek bank and fitted
    with an outrigger float made from light wood, with the broader end of the float
    forward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The outrigger float is attached to several booms; boom numbers vary from at
    least three in small canoes to eight or nine in larger canoes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A cane-bound part of each boom inside the canoe forms a seat for the paddler.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Three pointed sticks and cane binding connect each boom to the float and are
    described as resisting longitudinal and lateral thrust while keeping the float
    rigidly attached to the hull.
  category: relationship
  evidence_refs:
  - ev:8
