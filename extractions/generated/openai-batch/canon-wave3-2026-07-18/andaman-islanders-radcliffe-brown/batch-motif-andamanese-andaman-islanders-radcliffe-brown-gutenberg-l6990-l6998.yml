  summary: 'The passage describes scarification as a favored Andamanese remedy: the
    painful part of the body is cut with small shallow incisions using quartz or glass,
    causing slight bleeding; women perform the operation, and it is said to be used
    very frequently, excepting red paint and human bones.'
