  text: A supply of fresh water is described as a chief factor in choosing a camp
    site, especially in the dry season.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Within its own territory, the local group is described as semi-nomadic.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Coast-dwellers shift camps for several stated reasons, including a death,
