canonical_text:
  quote: ''
  summary: The passage describes Andamanese social customs concerning widow remarriage,
    child care, childhood training, adoption, and foster-parent relations. It notes
    uncertainty about former widow-remarriage practice, describes communal kindness
    toward children, early swimming and play, gendered learning of subsistence tasks,
    and fosterage between families and local groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a man of a local group died, older men are said to have selected an unmarried
    younger man, preferably a younger brother or relative of the deceased, and required
    him to marry the widow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states uncertainty about the widow-remarriage custom and suggests
    there may have been an objection to a widow marrying a man older than her former
    husband.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Infant children are cared for by the mother, but they are also played with,
    petted, and nursed by the father, mother, and other people in the village.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A woman with an unweaned child may suckle other women’s children, and babies
    are not weaned until about three or four years old.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before children can walk, they are carried in a bark sling by the mother and
    sometimes by the father or other persons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After they can walk, children often accompany their mothers near camp for
    firewood or vegetables, or play games in the village or on the beach.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Children of coast villages learn to swim very young, almost as soon as they
    learn to walk, and many of their games take place in the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At about five or six, a boy’s father makes him a toy bow and arrows and sometimes
    a toy canoe, after which the boy begins learning men’s occupations and knowledge
    of animals, trees, and fishes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A girl learns what women need to know by accompanying her mother to gather
    roots and seeds, catch fish, or pick up molluscs on reefs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Until about eight to ten, a child lives with the parents, has a place in the
    family hut, and shares the family meal.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Children are treated with extreme kindness, are never punished, and are hardly
    ever scolded.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: If parents die, children are adopted by friends or relatives and treated by
    foster-parents like their own children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mr Man reports that adoption of children above six or seven is requested as
    a compliment and mark of friendship after a visit, and that the foster-father
    becomes the child’s home authority while birth parents continue visits.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The author says that in his own observation the usual age of adoption seemed
    higher, around nine or ten years and upward.
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: A man and wife adopt children from a local group other than their own; the
    adopted child lives in their hut, shares meals, gives affection and obedience,
    and is visited by the birth parents.
  category: relationship
  evidence_refs:
  - ev:9
