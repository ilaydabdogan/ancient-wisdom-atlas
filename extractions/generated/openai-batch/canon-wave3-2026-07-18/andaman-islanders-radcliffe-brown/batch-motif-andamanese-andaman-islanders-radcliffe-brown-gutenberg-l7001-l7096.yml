canonical_text:
  quote: ''
  summary: The passage introduces Andamanese myths and legends as orally transmitted
    ancestral stories with many local and individual variants. It describes oko-ǰumu/oko-paiad
    specialists as authorities on spirits, remedies, and legendary lore, gives an
    example of storm-stopping magic using plant material placed under stones in the
    sea, explains how specialists innovate within common beliefs, notes the decline
    and fragmentation of legend knowledge after European settlement, and warns that
    the traditions are unsystematic rather than a single consistent narrative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stories are told by elders to younger people and concern ancestors in a long-ago
    time.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same legend may have many variants, including local tribal variants and
    individual differences in wording, gesture, and incident order.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Individuals called oko-ǰumu in the North Andaman and oko-paiad in the South
    are said to have special knowledge of spirits and magical remedies and to be authorities
    on legendary lore.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Magical remedies are described as based on a common stock of beliefs about
    substances, while individual specialists elaborate particular uses and value originality.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: One storm was believed to have been stopped by placing crushed Anadendron
    creeper stem under a stone in the sea; a later specialist used crushed Ficus laccifera
    bark and twigs under a different sea-stone for another storm.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each oko-ǰumu is said to build his own set of legends from common beliefs
    about ancestral events and may invent new stories by combining traditional incidents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage compares the lack of fixed traditional form in mythology with
    the lack of fixed traditional songs, but states that only certain people have
    authority to speak on legends.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Beliefs are handed from an oko-ǰumu to followers, who may later become oko-ǰumu
    and introduce slight modifications.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A doctrine in the A-Pučikwar tribe treated Bilik as the name of a class of
    beings rather than a single being and spread to Aka-Ko̱l and O̱ko̱-J̌uwo̱i groups
    without fully displacing earlier beliefs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: European settlement and associated changes are said to have led to neglect
    of old legends, and many old oko-ǰumu died without successors.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that Andamanese legends are fragmentary and unsystematic,
    with even the same informant able to give contradictory versions of origins such
    as fire or humanity.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Mr Man is said to have arranged South Andaman stories into a continuous narrative,
    creating a misleading impression of the originally disconnected stories.
  category: action
  evidence_refs:
  - ev:10
