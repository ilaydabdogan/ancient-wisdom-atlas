  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that the North Sentinel canoe is more like the Little Andaman
    canoe than the Great Andaman canoe.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author suggests that the Andaman Islands were probably peopled by sea
    from the coast of Burma and that the ancestors of the Andamanese must then have
    possessed canoes.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author suggests that ancestral Andamanese canoes may have had a single
