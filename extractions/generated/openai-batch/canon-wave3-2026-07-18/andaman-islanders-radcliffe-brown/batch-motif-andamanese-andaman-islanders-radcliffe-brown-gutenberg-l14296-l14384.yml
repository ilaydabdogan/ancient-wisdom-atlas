  quote: ''
  summary: 'The passage describes practical differences among Andamanese canoes and
    rafts: large and small canoes in turtle-hunting and travel, Little Andaman and
    North Sentinel canoe construction, Jarawa and Semang raft use, and the author''s
    cautious reconstruction of canoe origins and technological change.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Large canoes are described as less agile than small outrigger canoes for turtle-hunting,
    but useful for carrying captured turtles.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large canoes are chiefly used for journeys, carry many people and baggage,
    are less likely to capsize in rough sea, and increase movement between islands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Little Andaman small canoe is described as similar to the Great Andaman
    small canoe, with differences in the stem and stern, the attachment of outrigger
    booms, and the attachment of the float.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Jarawa of South Andaman are said not to use canoes at present and to make
    bamboo rafts for crossing creeks and inlets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Forest-dwellers of the Great Andaman Division are said to have made occasional
    use of similar bamboo rafts for the same purpose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A North Sentinel canoe observed in 1903 is described as a hollowed tree canoe
    with an outrigger, booms, a paddle, a Nautilus shell used as a baler, and poles
    resting on the outrigger booms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The North Sentinel canoe equipment is interpreted in the passage as indicating
