canonical_text:
  quote: ''
  summary: The passage compares Andamanese, Semang, and Philippine Negrito bow forms,
    then describes Andamanese fish-arrows, their construction, uses, Little Andaman
    variants, and older point materials used before iron was plentiful.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author concludes that Andamanese ancestors once used a bow resembling
    the present Little Andaman bow, and that the Great Andaman S-shaped bow was invented
    after the separation of the two main divisions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Semang bow discussion is based on six specimens; four are treated as a
    usual type, with wood or palm-wood bodies, shoulders at both ends, unequal end
    points, and three-ply rope strings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two Semang bow specimens do not conform to the usual type and are described
    with differing notches, loops, materials, lengths, and cord construction.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The usual Semang bow is said to differ from the Little Andaman bow in unequal
    end point, three-ply rope string rather than twisted fibre, and variation in middle
    section.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: For Philippine Negrito bows, the author says available information is insufficient
    for full typology, but one variety is described as very similar to the Little
    Andaman bow.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The reconstructed primitive Negrito bow is described as wooden, shouldered
    at both ends, rounded on one side and flattened or keeled on the other, with a
    twisted fibre string looped at one end and knotted at the other.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Andaman Islanders use two kinds of arrows, one for fish and one for pigs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The common Great Andaman fish-arrow has three parts: a bamboo shaft, a wooden
    fore-shaft, and an iron-wire point arranged to form a barb.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The bamboo shaft is straightened by heat, roughened with a Cyrena shell for
    grip or binding, fitted to the fore-shaft, and bound with thread.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The point binding is covered with a beeswax, resin, and red ochre composition,
    melted over fire, applied with wood, and smoothed with a hot Cyrena shell.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Fish-arrows are used for fish and also for snakes, rats, and occasionally
    birds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Little Andaman fish-arrows are similar but larger than Great Andaman examples,
    lack roughened bamboo shaft ends, and use beeswax only rather than the described
    composition for the point binding.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Before iron was plentiful, fish-arrow points were made from serrated sting-ray
    tail bone or pig tibia ground on stone and sharpened at both ends.
  category: sequence
  evidence_refs:
  - ev:10
