  summary: The passage describes daily camp food preparation, family and unmarried-person
    meals, evening dancing and storytelling, weather-dependent work, multi-day hunting
    absences, seasonal movements and food collection among forest-dwellers and coast-dwellers,
    and fine-weather meetings of local groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women return with gathered food in the afternoon, and men then return with
    their provisions; the camp prepares the chief evening meal when hunting has been
    successful.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A whole pig, when brought home, is cooked at a public cooking place, cut up,
    distributed among community members, and further cooked for household meals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each family has a fire in its hut, and the family meal is eaten by a man,
    his wife, and their children; bachelors and unmarried women eat separately.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: After nightfall, men may dance to song with a chorus of women, or a man may
    recount pig-killing tales with dramatic gestures to a few listeners.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When food remains from the previous day or in stormy weather, men may stay
    in camp and make weapons and implements.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When game is scarce, hunters may stay away from camp for several days until
    they obtain food, while women, children, old men, and perhaps some able-bodied
    men remain and provide for themselves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A named unsettled-weather period follows the rainy season, after which cool-season
    fruits and roots become plentiful, then hot-season honey and Artocarpus fruit
    become important foods before the rainy season returns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Forest-dwellers leave their main encampment during the cool season, make visits
    or occupy temporary camps, and return to headquarters before the rainy season
    to repair huts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coast-dwellers can fish and collect molluscs year-round; in the rainy season
    they combine forest pig hunting with fishing or turtle hunting, and in fine weather
    they make visits and turtle-hunting expeditions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Meetings of two or more local groups take place during fine weather and are
    described as important in Andaman Islanders' social life.
  category: relationship
  evidence_refs:
  - ev:7
