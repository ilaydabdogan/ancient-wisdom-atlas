  summary: The passage describes an Andamanese village site, hut construction, different
    kinds of camps, rare cave or rock-shelter use, and the social arrangement of families,
    bachelors, unmarried women, communal cooking, and household fireplaces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The village was in a small forest clearing near the seashore at Mo̱i-lepto
    in Akar-Bale country, with fresh water from a nearby spring or soak and access
    to fishing and turtle-hunting grounds.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The village contained eight huts arranged around a central open space, with
    the huts facing inward toward the centre; the open space was kept clear as the
    village dancing ground.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Most single huts were occupied by family groups consisting of a man, his wife,
    children, and dependants; one hut was occupied by an old widower and a bachelor.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The simplest hut form was a sloping palm-leaf roof on four posts, with two
    taller front posts and two shorter back posts; additional roofs could be added
    for more shelter.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Huts made from leaf mats attached to rafters could last for some time and
    could be made habitable again after several weeks of desertion in dry weather.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Temporary camps were made by forest folk during the dry season or after a
    death in a chief camp; they were arranged as villages rather than communal huts
    and used more carelessly made huts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A hunting party, which might include women as well as men, could spend a few
    days away from a main camp and build simple lean-to shelters of leaves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Caves or rock shelters suitable for occupation were almost unknown in the
    Andamans, though a few small rock shelters were occasionally used by hunting parties,
    and one larger shelter was reportedly formerly used as a chief camp.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hunting camps intended for brief occupation did not follow the regular village
    arrangement; shelters were placed mainly to give protection from the prevailing
    wind.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The local group was described as consisting of families, unmarried men, widowers,
    unmarried girls, and widows; unmarried men and widowers without children occupied
    a bachelors’ hut.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The author reports not finding a separate spinsters’ hut in visited camps;
    unmarried females were attached to families and lived in a married relative’s
    hut.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: A communal cooking place stood on one side of the dancing ground, generally
    near the bachelors’ hut; bachelors attended to communal cooking there.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Each family had its own fireplace in its hut, with a fire kept continually
    alight.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Two or more families could build adjoining huts that functioned as one hut
    while each family retained its own special portion; two brothers often formed
    such a common household.
  category: relationship
  evidence_refs:
  - ev:10
