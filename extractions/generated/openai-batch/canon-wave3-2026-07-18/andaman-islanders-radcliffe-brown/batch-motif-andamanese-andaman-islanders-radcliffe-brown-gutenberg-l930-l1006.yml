canonical_text:
  quote: ''
  summary: The passage describes demographic decline among the Andamanese after European
    occupation, attributing much of the decline to introduced diseases, increased
    mortality, and reduced births. It contrasts Great Andaman with Little Andaman,
    gives estimates of former population and density, explains differences in settlement
    and food supply, and predicts possible extinction of Great Andaman tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The numbers of the Andamanese are described as greatly diminished during the
    preceding fifty years, chiefly due to diseases introduced after European occupation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Syphilis is said to have been introduced among South Andaman tribes around
    1870 and later to have spread among Great Andaman tribes, excluding the hostile
    J̌a̤rawa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A measles epidemic in March 1877 is described as introduced with convicts
    from Madras and as rapidly spreading through the Great Andaman, with high mortality.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The birth-rate among friendly Andamanese is described as having fallen nearly
    to nothing, with very few young children observed and few infants surviving.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Little Andaman population is described as not yet affected by the same
    decrease because of little contact with the Penal Settlement or Great Andaman
    tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author gives an estimated former total population of about 5650 for the
    Andamans, divided among North Andaman, Middle Andaman, South Andaman, and Little
    Andaman with North Sentinel.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The smaller estimated density of South Andaman is explained by the Aka-Bea
    and J̌a̤rawa living there at war with one another.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Length of coast-line is described as more important to the Andamanese than
    land area, and Little Andaman natives are described as unable to harpoon turtle
    and large fish.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that North Andaman was reduced to about 27 percent of its
    former population and Middle and South Andaman to about 18 percent between 1858
    and 1901, and predicts possible extinction of Great Andaman tribes within another
    fifty years.
  category: sequence
  evidence_refs:
  - ev:6
