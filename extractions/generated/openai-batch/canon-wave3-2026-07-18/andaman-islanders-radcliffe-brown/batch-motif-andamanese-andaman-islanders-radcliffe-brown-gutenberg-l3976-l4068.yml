canonical_text:
  quote: ''
  summary: 'Ethnographic description of Andamanese food-abstention and first-eating
    ceremonies among several named groups, including Aka-Bo, Akar-Bale, Aka-Bea, and
    a less reliable note on Aka-Kede. The passage gives a detailed Aka-Bea honey-fast
    ceremony: a novice is fed honeycomb by an elder, eats in silence, is anointed
    with honey and bathed, and the next morning splashes in sea or creek water as
    a protection against a snake called Wara-ǰobo entering the body.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the preceding description strictly applies only to
    North Andaman coast-dwellers and that he did not witness ceremonies performed
    by jungle-dwellers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aka-Bo informants said the period of abstention begins when a boy or girl
    is forbidden to eat the fish ńyuri and certain other foods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Aka-Bo first ceremony, the initiate is seated on leaves, wears leaf
    bundles and a Pandanus-leaf belt, sits with legs doubled beneath, is fed the fish,
    and later joins an ordinary dance decorated with white clay.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the Aka-Bo fish-eating ceremony, the youth abstains from pork and other
    foods; a later pig-eating ceremony closes this abstention period and includes
    one night awake.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Aka-Bo honey-eating ceremony is described as the initiate sitting cross-legged,
    having honey rubbed on shoulders and chest, and being fed honey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For Aka-Kede, one informant said pig-eating precedes turtle-eating, but the
    author says he could not obtain reliable information about that tribe's ceremonies.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Akar-Bale informants described a multi-year abstention period beginning with
    restrictions on turtle, honey, turtle eggs, yams, fruits, and seeds, followed
    by a turtle-eating ceremony and later ceremonies involving turtle eggs, pig kidney-fat,
    dugong, honey, and other foods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mr. E. H. Man's Aka-Bea account divides the fasting period into three parts
    ending with turtle, honey, and pig kidney-fat ceremonies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Aka-Bea honey ceremony, the novice is placed in the middle of the group,
    receives honeycomb from a chief or elder, eats in silence, and must eat the comb
    without using fingers, holding it to the mouth and attacking it with teeth and
    lips.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Aka-Bea chief or elder squeezes honey over the youth's head and rubs it
    into the body; a bath follows to remove the honey.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the following morning the lad decorates himself with Alpinia leaves, enters
    the sea or a creek to waist depth, locks his thumbs, splashes water over himself
    and bystanders, and sometimes ducks his head under the surface.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The splashing performance is described as a safeguard or charm against snakes,
    especially Wara-ǰobo, which is imagined to enter the stomach and cause death if
    the performance is not done.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: For females, the Aka-Bea honey ceremony cannot occur until after the first
    child is born; females also abstain from honey during later pregnancies, and a
    chief or elder officiates.
  category: sequence
  evidence_refs:
  - ev:11
