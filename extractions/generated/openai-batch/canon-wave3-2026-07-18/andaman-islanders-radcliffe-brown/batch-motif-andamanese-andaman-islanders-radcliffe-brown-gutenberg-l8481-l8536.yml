candidate_motifs:
- id: motif:1
  label: fire-associated petrification into reefs under moon anger
  taxonomy_refs:
  - divine_judgment
  basis: The story has hunters and canoes turned to stone after a large evening fire,
    and the narrator explains it through a belief that the moon is angry at a bright
    fire during evening moonrise.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The quoted legend itself does not name the moon as the agent; the moon
    connection is the narrator's explanation of the story.
- id: motif:2
  label: people and vessels transformed into landscape feature
  taxonomy_refs: []
  basis: The hunters and their canoes are turned to stone and become the reefs that
    are now there.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No matching supplied taxonomy family directly names petrification or landscape-origin
    transformation.
- id: motif:3
  label: man-eating giant serpent at honey gathering
  taxonomy_refs:
  - serpent
  basis: A large snake catches, kills, and eats honey gatherers; a related version
    places a honeycomb on the neck of a huge snake.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The North Andaman version is described as not detailed, and the Akar-Bale
    snake name differs.
- id: motif:4
  label: serpent attacked with arrows but not killed
  taxonomy_refs:
  - serpent
  basis: Biča's group shoots the large snake with many arrows but cannot kill it;
    it escapes and is never seen again.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: ''
- id: motif:5
  label: first murder caused by jealousy over a wife
  taxonomy_refs: []
  basis: The passage explicitly introduces the Akar-Bale story as explaining how the
    first murder came to pass, and the killing follows Badgi-beria's jealousy and
    desire for Da Ko's wife.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not present a broader taxonomy label for first murder.
- id: motif:6
  label: humans transformed into birds after bathing
  taxonomy_refs:
