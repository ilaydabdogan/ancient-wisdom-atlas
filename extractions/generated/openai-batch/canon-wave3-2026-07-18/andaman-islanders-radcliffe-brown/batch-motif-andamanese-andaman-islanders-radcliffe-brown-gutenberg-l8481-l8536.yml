canonical_text:
  quote: ''
  summary: 'The passage gives several Andamanese legends: Kwaičo turtle hunters and
    their canoes become reefs after their wives make a large evening fire; a large
    snake attacks honey gatherers and in another version escapes after being shot
    with arrows; Da Ko kills his wife In Mud and his jealous friend Badgi-beria; Mud
    and Kulal become birds after bathing; and sea-eagle tales explain flight with
    leaves and the abduction of young women to a tree-top hut.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People of Kwaičo go to J̌ila to hunt turtle, taking two canoes; while they
    are away, their wives make a large evening fire at Kwaičo, and the hunters and
    canoes become stone reefs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator explains the Kwaičo story as connected with a belief that the
    moon becomes angry when a bright fire is visible as it rises in the evening shortly
    after sunset.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A North Andaman account places a large snake called o̱r-čubi at Dalamio in
    the time of the ancestors, where it catches, kills, and eats men and women gathering
    honey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In an Akar-Bale version, Biča looks for honey in the jungle and sees a very
    large snake with a honeycomb hanging from its neck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Biča addresses the bees, returns home, calls several men, and the men shoot
    the snake with many arrows but cannot kill it; the snake runs away and is not
    seen again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Da Ko is described as the first of the Andamanese and lives with his wife
    In Mud; his friend Badgi-beria has no wife, is jealous, and wants Da Ko's wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Da Ko becomes angry, hides in the jungle, sees Badgi-beria and Mud together
    on a path, and kills them with bow and arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mud and Kulal cook pig, become very hot, go to bathe, and are turned into
    birds; Mud is identified as the bronze-winged dove and Kulal as a teal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A North Andaman sea-eagle tale says that the sea-eagle first used Licuala
    leaves to fly before he had his own wings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Maia Ko̱lo, Sir Sea-eagle, lives unmarried at Čona in Tau-’ra-miku and has
    a hut in the top of a to̱ro̱ktato tree.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: When men go fishing, Maia Ko̱lo steals their wives, choosing good-looking
    girls and rejecting old or ugly women.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Maia Ko̱lo calls a young woman to hold his foot by saying he has a fish for
    her, then flies away with her to his tree-top hut.
  category: sequence
  evidence_refs:
  - ev:8
