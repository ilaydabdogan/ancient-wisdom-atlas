  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mr Man reports that Puluga does not kill directly but points out people who
    badly quarter and carve a pig to malevolent spirits called Čol, one of whom kills
    the offender.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The author reports two field statements about badly cutting up a pig: the
    meat becomes bad and makes eaters ill, or jungle spirits become angry and punish
    the offender; neither statement mentioned Puluga or Biliku.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states generally that Puluga or Biliku are believed to punish offenses
    only by sending bad weather.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mr Man reports that people shout a warning to Puluga when a dark cloud approaches,
    asking him to divert it; if rain falls, they think Puluga ignored the warning.
  category: speech
  evidence_refs:
  - ev:4
