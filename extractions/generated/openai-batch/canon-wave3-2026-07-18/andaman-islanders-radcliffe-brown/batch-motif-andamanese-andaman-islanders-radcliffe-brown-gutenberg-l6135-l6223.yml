  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the author's account, Nila or Ńila is an evil being living in hollow Pterocarpus
    trees who comes out when he smells humans near his tree and kills them with a
    knife.
  category: action
  evidence_refs:
  - ev:9
