canonical_text:
  quote: ''
  summary: The passage describes Andamanese burial customs for adults, infants, strangers,
    and slain enemies. Adult burials are marked with shredded palm-leaf plumes and
    followed by temporary camp abandonment. Infants may be buried beneath the hearth,
    with special obligations for the parents and a belief that the dead baby’s soul
    may return to the mother and be born again. The passage also describes variant
    Southern accounts involving milk placed by the grave, disposal of strangers or
    enemies by sea or burning, and night vigils with songs and angry gestures directed
    against spirits blamed for a death.
  language: English
  quote_policy: summarized
