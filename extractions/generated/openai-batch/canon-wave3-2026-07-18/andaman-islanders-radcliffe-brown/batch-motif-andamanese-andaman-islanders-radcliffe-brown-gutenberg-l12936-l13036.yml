canonical_text:
  quote: ''
  summary: The passage describes Andamanese vegetable fibres and plant materials used
    for string, rope, bow-strings, baskets, mats, women’s belts and tassels, ceremonial
    ornaments, grave and peace-making markers, and two-ply rope-making techniques.
    It notes intergroup differences and contact-related changes between Great Andaman,
    Little Andaman, North Andaman, and South Andaman communities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anadendron paniculatum fibre is described as the most valuable fibre of the
    Great Andaman tribes and is used for string, thread, and bow-strings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Little Andaman people did not know the Anadendron
    fibre preparation method until recent times and have learned it from Great Andaman
    people through contact.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Anadendron fibre preparation involves cutting suitable creeper branches, peeling
    bark strips, scraping them with a Cyrena shell, and drying the cleaned fibres
    in sun or over fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Calamus canes or rattans are used for baskets, canoe lashings and furnishings,
    hut building, women’s belts in Little Andaman, and mats in the Great Andaman Division.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A palm leaf-stem fibre is used in Little Andaman for the tassel worn by women
    over the pudenda, was formerly worn by North Andaman women, and has ceremonial
    uses in Great Andaman tribes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A tassel of the palm fibre is suspended near a dead person’s grave and at
    the entrance of the village where the death occurred.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In North Andaman, a suspended cane with a fringe of the palm fibre is erected
    for a peace-making ceremony.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pandanus Andamanensium leaves are used in the Great Andaman Division for women’s
    belts and ceremonial ornaments, and are said not to be used in Little Andaman.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dendrobium pods are roasted until the outer skin turns bright yellow; the
    skin is torn into strips for ornamenting nets, baskets, rope, and similar items.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says Andamanese rope, string, and thread are always two-ply; rope
    is made only by men and used for turtle harpoon lines and formerly for turtle
    nets.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Great Andaman rope-making uses a long twisted strand, a toe-held piece of
    wood, and a small reel to twist two strands into a firm two-ply cord.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Little Andaman rope-making is described as much the same as Great Andaman
    rope-making, but the reel is passed in the opposite direction, producing the opposite
    twist.
  category: relationship
  evidence_refs:
  - ev:10
