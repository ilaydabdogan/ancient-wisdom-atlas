canonical_text:
  quote: ''
  summary: Radcliffe-Brown interprets Andamanese initiation ceremonies. He notes uncertainty
    about the meaning of Pothos scandens ornaments, reports native explanations that
    ceremonies make youths strong and protect them from sickness or early death, and
    argues that ceremonies confer power to eat dangerous foods safely and endow children
    with adult social personality. The passage then links food danger and sickness
    to attacks or causation by Lau or Čauga, spirits of the dead.
  language: English
  quote_policy: summarized
