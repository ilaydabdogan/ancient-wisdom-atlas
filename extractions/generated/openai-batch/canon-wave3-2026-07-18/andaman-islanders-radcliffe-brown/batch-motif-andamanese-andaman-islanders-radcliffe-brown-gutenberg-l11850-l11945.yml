canonical_text:
  quote: They are essentially a bow and arrow people.
  summary: The passage describes Andamanese subsistence through collecting, fishing,
    and hunting; their reliance on the bow and arrow; related tools for fishing and
    collecting; the absence of special fighting or defensive weapons; and comparisons
    with Semang and Philippine Negrito subsistence and weapon use.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Andaman Islanders are described as depending on natural productions of
    the forest and sea, without cultivating soil and without domestic animals before
    dogs were introduced in 1858.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage classifies Andamanese food procurement into collecting roots,
    fruits, and honey; fishing in the sea and creeks; and hunting wild forest animals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For hunting, the Andamanese are said to rely entirely on the bow and arrow
    and not to use traps for game or birds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For fishing, the Andamanese use bow and arrow on reefs for fish and crustaceans,
    women use small nets for small fish and prawns, Great Andaman groups have used
    large nets and harpoons, and hooks and fish traps are described as absent or externally
    obtained.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Collecting implements include a digging stick for roots, a hooked pole for
    fruit, and an adze for molluscs and for cutting honey-combs from hollow trees.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bow and arrow is identified as the most important Andamanese utensil,
    with the author calling the Andamanese essentially a bow-and-arrow people.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Andamanese are described as having no weapons used only for fighting and
    no special defensive weapons; the shield is unknown, and the bow and arrow is
    used in fighting.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Semang are described as having a similar subsistence pattern of collecting,
    fishing, and hunting, with differences including lack of sea resources, greater
    forest game variety, and some agriculture adopted from neighbors.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Semang principal weapon is described as the bow and arrow, though they
    also use spears, traps, fish-spears, harpoons, scoops, rod and line, and in some
    cases a blow-pipe attributed to borrowing from the Sakai.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Philippine Negritos are described as originally depending on collecting, fishing,
    and hunting, with some agriculture attributed to contact with agricultural peoples.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief weapon of Philippine Negritos is described as the bow and arrow,
    including special fish-arrows; the passage also mentions nets, traps, and bamboo
    fishing weirs among particular groups.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author states that different kinds of Andaman bow can be compared and
    derived from one original pattern.
  category: relationship
  evidence_refs:
  - ev:7
