canonical_text:
  quote: ''
  summary: The passage describes Andamanese beliefs about beings, plants, and materials
    belonging to Biliku, Bilik, Puluga, or sea spirits; taboos against killing, eating,
    damaging, or burning them; storms as supernatural punishment or as acts of sea
    spirits; rites for stopping storms; and Mr Man's reported South Andaman account
    of Puluga as an invisible fire-like creator, judge of souls, sky-house dweller
    with wife, children, sky spirits, and a son-messenger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beliefs about bees’-wax, edible roots, and the cicada are described as shared
    by all Great Andaman tribes and as among the most important beliefs connected
    with Biliku.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the North Andaman, Biliku is said to be angered if certain creatures are
    killed, and a bird called to̱ro̱i is said to belong to Biliku and not to be killed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the A-Pučikwar tribe, two fish species, a mollusc, and a bird are said
    to belong to Bilik and therefore are not killed or eaten.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Akar-Bale tribe, two kinds of wood must not be used as firewood because
    they belong to Puluga and their use could offend him.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Biliku’s punishment for anger is described as sending violent storms; storm-stopping
    methods include frightening her, burning crackling Mimusops leaves, burning bees’-wax,
    and damaging or destroying creepers that belong to her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports an alternative and contradictory belief that storms are
    made by the spirits of the sea, J̌urua, with certain storm-producing acts linked
    to Anadendron paniculatum, turtle fat, and Ficus laccifera.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some storm-stopping methods involve the sea, including swishing arrows in
    the water and placing crushed plants or leaves under stones or rocks in the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mr Man’s quoted account describes Puluga as fire-like but invisible, unborn,
    immortal, creator of the world and objects except evil powers, omniscient by day,
    angered by sins, pitiful to sufferers, and judge of souls after death.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Puluga is reported to live in a large stone house in the sky with a green
    wife, daughters called morowin, and a son named Piǰčor; the wife and morowin throw
    fish and prawns into waters for humans, while Piǰčor transmits Puluga’s orders.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Puluga is said to eat, drink, sleep much during dry months, be heard as thunder,
    supply animals, birds, and turtles, and cause thunderstorms and squalls when angered
    by blowing, growling, and hurling burning faggots.
  category: action
  evidence_refs:
  - ev:9
