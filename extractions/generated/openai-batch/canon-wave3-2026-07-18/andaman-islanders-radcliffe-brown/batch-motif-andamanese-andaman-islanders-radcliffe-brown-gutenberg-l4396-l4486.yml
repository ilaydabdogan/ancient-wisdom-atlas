canonical_text:
  quote: ''
  summary: The passage discusses Andamanese food prohibitions and food-handling customs,
    including disputed reports about lifelong avoided foods, avoidance of certain
    foods in strange places, staying in camp after a dugong feast because spirits
    may smell the eaters, prescribed methods for killing and cooking turtle and preparing
    pig, and ceremonial weeping and gestures used in initiation, mourning, marriage,
    reunion, and parting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mr Man is reported as saying that every Andamanese man or woman is prohibited
    throughout life from eating one or more fish or animals, called yat-tub, often
    because the food was linked in childhood to bodily derangement.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says repeated enquiries in North and South Andaman did not confirm
    that every person had a forbidden food; he confirms only that a food observed
    to disagree with a child may be avoided for life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some men refused certain foods when away from their own part of the islands
    or in a strange place, even if they would eat the same food at home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After a dugong is caught and eaten in the North Andaman, people remain in
    camp after finishing the meat and do not go fishing or hunting until hunger makes
    them seek food again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The reason given for remaining in camp after eating dugong is that spirits
    of the jungle and sea may smell the people, be attracted by the food odour, and
    cause illness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A turtle must be killed by laying it on its back with its head toward the
    open sea and thrusting a wooden skewer through the eye-socket into the brain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The natives say turtle meat would be bad or uneatable if the turtle were killed
    in any other way.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Turtle meat may be cooked only on a fire made from Hibiscus tiliaceus wood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'A pig is killed as it runs, but must be cut up by a special method: disembowelled,
    leg joints severed, abdominal cavity filled with selected leaves, roasted whole,
    and then cut up.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: If a pig carcass is cut up by any method other than the traditional one, the
    natives believe the meat would be bad and would not eat it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Weeping by relatives and friends occurs as an essential part of several ceremonies,
    including initiation at the turtle-eating ceremony, the end of mourning, marriage,
    burial, and recovery of bones.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The described ceremonial weeping is real weeping, with wailing or howling
    and tears streaming down the face.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Friends or relatives separated for a few weeks or longer greet each other
    by sitting down, one on the lap of the other, placing arms around each other’s
    necks, and weeping and wailing for two or three minutes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: When husband and wife meet in this greeting, the man sits on the woman’s lap.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: When two friends part, one lifts the other’s hand toward his mouth and gently
    blows on it.
  category: action
  evidence_refs:
  - ev:10
