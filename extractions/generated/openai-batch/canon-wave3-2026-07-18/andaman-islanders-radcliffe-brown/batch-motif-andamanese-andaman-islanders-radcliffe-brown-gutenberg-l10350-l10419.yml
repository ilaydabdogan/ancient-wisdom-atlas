  quote: ''
  summary: The passage interprets Andamanese initiation ceremonies as placing adolescent
    youths or girls in a temporary position outside ordinary social life. Food abstentions,
    exclusion from dancing and body decoration, and a turtle-eating ceremony are described
    as producing awareness of social communion, food's social value, and the solemn
    danger managed by ritual precautions.
