canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese economic and property customs: individuals
    make and own many tools and goods; land is held by local groups; certain trees,
    animals, gathered foods, huts, and canoes have specific rules of ownership; and
    social life includes frequent reciprocal gift exchange, expectations of return
    among equals, and norms against refusing requests.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People make their own weapons and implements; men make items such as bows,
    arrows, and adzes, while wives make items such as baskets and nets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunting grounds of a local group are described as belonging to the whole
    group, with all members having an equal right to hunt there.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man may claim a tree suitable for a canoe by identifying it and telling
    others its description and location; others would not cut it without asking him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Certain Artocarpus trees are treated as privately possessed, and fruit may
    not be picked without the owner’s permission; a person who receives permission
    gives part of the fruit to the owner.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ownership of hunted or gathered foods is assigned by specific actions, such
    as first effective arrow strike, use of the capturing harpoon, cutting down a
    honeycomb, shooting fish, digging roots, collecting seeds, netting fish or prawns,
    or gathering molluscs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Weapons made by a man belong to him, and things made by a woman belong to
    her; a man is not free to dispose of his wife’s personal property without her
    permission.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each family builds and repairs its own hut, and in a communal hut each family
    is regarded as owning and repairing a particular portion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wife provides the hut with needed firewood and water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A canoe is cut by several men, but from the outset it belongs to one older
    man who selects the tree and supervises the work.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage describes constant giving and receiving of presents, including
    exchanges between friends and exchanges at meetings between neighboring local
    groups.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Between equals, a person who gives a present expects something of equal value
    in exchange.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Refusing another person’s request for something is described as a breach of
    good manners.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Almost every object possessed by the Andamanese is described as constantly
    changing hands; canoes may be given away but are more usually lent by the owner
    to friends.
  category: action
  evidence_refs:
  - ev:9
