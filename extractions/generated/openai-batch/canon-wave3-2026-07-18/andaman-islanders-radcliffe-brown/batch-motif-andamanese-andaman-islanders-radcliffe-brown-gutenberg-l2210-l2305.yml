canonical_text:
  quote: ''
  summary: The passage explains North Andaman relationship terminology, including
    terms for father, mother, child, older and younger same-generation persons, spouse,
    spouse's parents, and a doubtful affinal term. It notes the absence of distinct
    terms for brother, sister, grandparents, uncle, aunt, cousin, and similar categories,
    and explains that some extended relationships can be described through compounds.
    It closes by introducing Akar-Bale relationship terms as representative of South
    Andaman usage.
  language: English
