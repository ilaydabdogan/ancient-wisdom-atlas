  quote: ''
  summary: The passage explains Andamanese beliefs and customs concerning food. Foods
    are graded by danger, difficulty of procurement, and social value. Food procurement
    and distribution are described as communal duties tied to esteem, dependence,
    joy, scarcity, and moral obligation. The rite of painting the body after eating
    is interpreted as a ritual precaution expressing the social value and potential
    danger of food.
  language: English
  quote_policy: summarized
