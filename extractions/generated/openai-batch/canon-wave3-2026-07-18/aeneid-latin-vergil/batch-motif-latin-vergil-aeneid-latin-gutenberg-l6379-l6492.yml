  summary: Tarchon has sent royal insignia to Evander, but Evander says age and his
    son's Italian connection prevent them from taking command. He urges Aeneas, favored
    by fate and divine powers, to lead and gives him Pallas and Arcadian cavalry.
  figure_refs:
  - fig:7
