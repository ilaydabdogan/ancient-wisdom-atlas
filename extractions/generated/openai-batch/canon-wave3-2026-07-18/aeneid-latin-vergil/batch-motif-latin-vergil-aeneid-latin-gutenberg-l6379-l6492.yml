candidate_motifs:
- id: motif:1
  label: Divine smithing of martial arms
  taxonomy_refs: []
  basis: A fire-god commands Cyclopes in a volcanic cave to forge arms and a great
    shield, using divine forge implements and metals.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The immediate recipient is called a fierce man in this passage; the broader
    arm-gift context should not be assumed beyond this evidence.
- id: motif:2
  label: Foreign leader authorized by fate, divine warning, and regalia
  taxonomy_refs:
  - royal_legitimacy
  basis: The Etruscan army is restrained by a divine warning that no Italian may command
    it; Tarchon sends crown and scepter to Evander, and Evander redirects the leadership
    to Aeneas as one called by fate and divine powers.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage frames legitimacy through prophecy, fate, and transferred
    insignia, not through coronation actually performed in the scene.
- id: motif:3
  label: Just revolt and demand for tyrant's punishment
  taxonomy_refs:
  - divine_judgment
  basis: Mezentius' extreme cruelty prompts the armed citizens and all Etruria to
    rise and demand his punishment; the passage calls their anger just.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The punishment is politically and morally framed; direct divine punishment
    is not narrated, though divine warnings govern the subsequent leadership question.
- id: motif:4
  label: Warrior apprenticeship under a heroic leader
  taxonomy_refs:
  - initiation
  basis: Evander entrusts Pallas to Aeneas so that he may endure military service,
    learn the work of Mars, see Aeneas' deeds, and admire him from youth.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a martial training arrangement rather than a fully described initiation
    rite.
- id: motif:5
  label: Serpent and Gorgon imagery on divine protective armor
  taxonomy_refs:
  - serpent
  basis: Pallas' aegis is described with serpent scales, joined snakes, and the Gorgon
    head on the goddess' breast.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage describes an armor image; it does not narrate a serpent episode.
comparison_claims:
- id: claim:1
  claim: The Etruscan demand for a non-Italian commander, combined with divine warning,
    fate, and transferred crown and scepter, matches a royal-legitimacy pattern in
    which authority is validated by signs beyond ordinary politics.
  claim_level: same_motif
  target: royal_legitimacy
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The scene authorizes command but does not depict an actual enthronement
    or completed transfer of kingship to Aeneas.
- id: claim:2
  claim: Pallas' placement under Aeneas has the same function as an initiation or
    apprenticeship pattern, introducing a youth to warfare through a senior exemplar.
  claim_level: same_function
  target: initiation
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives instruction and military service, not a formal ritual
    sequence.
- id: claim:3
  claim: The volcanic divine forge, Cyclopes, and shield-making episode align with
    a divine-smith armament pattern found in mythic weapon-making scenes.
  claim_level: same_motif
  target: divine smithing of martial arms
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: No supplied taxonomy family directly names divine smithing, and the
    passage itself names only a fierce man as the immediate arms recipient.
