- id: scene:3
  label: Evander explains Mezentius and the Etruscan appeal
  summary: Evander says his own forces are weak but that fate offers alliance with
    Etruscan peoples. He recounts Mezentius' tyranny, the citizens' violent revolt,
    Mezentius' escape to Turnus, and the Etruscan demand for punishment. A haruspex
    bars any Italian from commanding them and orders external leaders to be chosen.
  figure_refs:
