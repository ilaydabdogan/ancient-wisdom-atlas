canonical_text:
  quote: ''
  summary: Vulcan rises at night and descends to his volcanic cavern-forge, where
    the Cyclopes are making divine weapons and armor. He orders them to set aside
    other tasks and forge arms, including a great shield against Latin weapons. At
    dawn Evander meets Aeneas and explains that the Etruscans, angered by Mezentius'
    cruelty and constrained by prophecy to choose a foreign leader, can be joined
    to Aeneas. Evander cannot take the command himself and entrusts his son Pallas
    and Arcadian horsemen to Aeneas.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A comparison is made between a woman who stirs ashes and sleepy household
    fires before dawn and Vulcan rising from soft bedding to his forge work.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The forge is located beneath a smoky, rocky island near the Sicilian side
    and Aeolian Lipare, in caverns associated with Aetna and named as Vulcan's house
    and land.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cyclopes Brontes, Steropes, and Pyragmon are working iron in a large cave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A partially completed thunderbolt is described with triple elements of twisted
    rain, watery cloud, red fire, and winged south wind, along with flashes, sound,
    fear, flames, and anger mixed into the work.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other works in the forge include Mars' chariot and wheels and Pallas' aegis,
    which is polished with serpent scales, gold, joined snakes, and a Gorgon head.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vulcan orders the Cyclopes to abandon current tasks, attend to him, and make
    arms for a fierce man; they rapidly divide the labor.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Copper, gold, and steel flow or melt in the furnace, and the Cyclopes form
    a huge shield with seven circular bands against all Latin weapons.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The forge work uses bellows, quenching in a basin or lake, anvils, raised
    arms, and tongs turning the metal mass.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Evander wakes at dawn, dresses, straps on a sword, puts on a panther skin,
    and is accompanied by two guardian dogs as he goes to Aeneas' quarters.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aeneas is accompanied by Achates, while Evander is accompanied by his son
    Pallas; the two leaders clasp right hands, sit within the house, and begin conversation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Evander says his own war strength is small, with the Tuscan river on one side
    and the Rutulian enemy pressing on the other, but that fate shows an unexpected
    alliance.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Evander recounts the old city of Agylla, settled by a Lydian people in the
    Etruscan hills and later ruled by Mezentius with proud power and cruel arms.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Mezentius is said to have bound dead bodies to living bodies, joining hands
    to hands and mouths to mouths, killing the living by prolonged torment.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The citizens, armed and enraged, surround Mezentius and his house, kill his
    allies, and throw fire onto the roof; Mezentius escapes to Rutulian territory
    and is defended by Turnus.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Etruria rises in anger and demands Mezentius for punishment; an aged haruspex
    says no Italian may lead such a people and that they should choose foreign leaders.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Tarchon sends envoys, a crown, a scepter, and royal insignia to Evander, asking
    him to assume the Tuscan camp and kingdom.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Evander says old age prevents him from taking command, and that his son cannot
    be urged to do so because his Sabine mother gives him part of an Italian homeland.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: Evander urges Aeneas to enter as leader favored by age, lineage, fate, and
    divine powers, and adds Pallas and selected Arcadian horsemen to him so that Pallas
    may learn war under Aeneas.
  category: speech
  evidence_refs:
  - ev:10
