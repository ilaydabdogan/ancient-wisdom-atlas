  label: Dawn meeting of Evander and Aeneas
  summary: Evander wakes, dresses, arms himself, and goes with Pallas and dogs to
    Aeneas. Aeneas comes with Achates; the leaders clasp right hands, sit in the house,
    and begin speaking.
  figure_refs:
