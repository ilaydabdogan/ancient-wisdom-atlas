scenes:
- id: scene:1
  label: Vulcan's nocturnal descent to the Cyclopes' forge
  summary: After a domestic dawn-labor comparison, Vulcan descends to the smoky volcanic
    cave where the Cyclopes are making divine weapons, including a thunderbolt, Mars'
    chariot, and Pallas' aegis. He orders all tasks set aside for new arms and a great
    shield.
