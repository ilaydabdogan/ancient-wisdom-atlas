canonical_text:
  quote: ''
  summary: Turnus hears the uproar from the city. His divine sister, disguised as
    the charioteer Metiscus, urges him to keep fighting elsewhere, but he recognizes
    her. A wounded messenger reports Aeneas' attack, fire at the houses, the queen's
    death, and the Latins' dependence on Turnus. Turnus sees the burning tower, accepts
    fate, leaves his sister, rushes to the walls, and calls for all to stop while
    he alone settles the treaty by combat.
  language: Latin
  quote_policy: summarized
