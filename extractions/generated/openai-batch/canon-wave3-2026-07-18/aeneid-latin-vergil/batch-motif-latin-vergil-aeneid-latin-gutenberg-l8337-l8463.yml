canonical_text:
  quote: ''
  summary: In a balanced slaughter watched by gods, Mezentius enters battle and exchanges
    spear-casts with Aeneas; Antores is accidentally killed, and Mezentius is wounded.
    Lausus intervenes out of love for his father and is killed by Aeneas, who pities
    him and returns his arms and body to ancestral shades. Mezentius, at the Tiber
    washing his wounds, hears of Lausus's death, laments that his son died for him,
    and rides Rhaebus back to challenge Aeneas, intending revenge or death. The supplied
    range ends during Mezentius's speech.
  language: Latin
  quote_policy: summarized
