canonical_text:
  quote: ''
  summary: 'Opening of Aeneid IV: Dido confesses to Anna that Aeneas has stirred her
    after Sychaeus'' death; Anna urges a politically useful union and delay of the
    Trojans. Dido performs sacrifices and becomes increasingly consumed by love, neglecting
    Carthage''s works. Juno then addresses Venus, proposing peace and marriage between
    Dido and Aeneas under shared divine auspices.'
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dido is described as wounded by heavy care, feeding a wound in her veins,
    consumed by hidden fire, and unable to rest because Aeneas' face, words, virtue,
    and lineage recur in her mind.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At dawn Dido speaks to Anna, calls Aeneas a new guest, praises his bearing,
    courage, and arms, and says she believes he is of divine stock.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dido says she had fixed in her mind not to join herself to anyone in marriage
    after the death of Sychaeus, yet recognizes traces of an old flame stirred by
    Aeneas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dido invokes the opening earth, Jupiter's thunderbolt, the shades of Erebus,
    and Pudor before violating her prior marital bond, and says Sychaeus should keep
    her love in the tomb; she then weeps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Anna urges Dido not to spend her youth alone, asks whether ashes or buried
    shades care, recalls rejected suitors, and points to surrounding peoples, deserts,
    the Syrtis, Tyrian conflict, and her brother's threats.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Anna argues that the Trojan ships came with divine auspices and favorable
    Juno, predicts Carthaginian greatness through such a marriage, and advises Dido
    to seek divine pardon, offer rites, extend hospitality, and invent reasons for
    delay while winter and stormy seas persist.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Anna's speech is said to inflame Dido's already burning mind, give hope to
    her uncertain mind, and loosen her sense of shame or restraint.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Dido and others go to shrines and altars, sacrifice selected ewes to Ceres,
    Phoebus, Lyaeus, and especially Juno, and Dido pours from a bowl between a white
    cow's horns and consults the still-living entrails of opened animals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The narrator states that vows and shrines do not help the raging Dido; a soft
    flame eats her marrow and a silent wound lives under her breast.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Dido wanders the city like a deer struck by an arrow, leads Aeneas through
    the walls, shows Sidonian wealth and the prepared city, falters in speech, seeks
    banquets, and repeatedly asks to hear Trojan sufferings from Aeneas.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At night Dido grieves alone in an empty house, lies on abandoned couches,
    hears and sees absent Aeneas in his absence, or holds Ascanius in her lap because
    he resembles his father.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: 'Carthage''s unfinished works are interrupted: towers do not rise, youths
    do not train with arms, harbor and defenses are not prepared, and great wall structures
    hang unfinished.'
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: Juno perceives that Dido is held by this destructive passion and that reputation
    does not stop her frenzy, and then addresses Venus.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Juno sarcastically says Venus and her boy have won great glory if one woman
    has been overcome by the deceit of two gods; she says she knows Venus feared Carthage,
    then proposes eternal peace, marriage agreements, shared rule, and Tyrians placed
    under Venus' hand through Dido's Phrygian husband.
  category: speech
  evidence_refs:
  - ev:14
