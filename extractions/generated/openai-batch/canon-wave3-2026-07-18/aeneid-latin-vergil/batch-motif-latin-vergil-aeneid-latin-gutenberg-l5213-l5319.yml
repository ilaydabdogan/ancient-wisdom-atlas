canonical_text:
  quote: ''
  summary: Aeneas and the Trojan leaders eat beneath a tall tree; when hunger makes
    them consume the bread serving as tables, Iulus jokes that they are eating the
    tables. Aeneas recognizes this as the fulfilment of Anchises' prophecy marking
    the destined land. He invokes gods and ancestors, and Jupiter confirms with thunder
    and a radiant cloud. The Trojans explore the region, send olive-branch-bearing
    envoys with gifts to Latinus, and begin marking out a shore camp. Latinus receives
    them in an ancestral royal hall filled with ancestral images and martial trophies,
    welcomes them, describes the Latins as Saturn's people, and recalls a tradition
    that Dardanus came from the Italian land before going to Phrygia and later being
    received among the gods.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas, leading Trojan chiefs, and Iulus place themselves beneath a tall tree
    and set out food, including cereal cakes and wild fruit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After other foods are consumed, hunger drives the Trojans to bite into the
    small cereal 'tables' or bread supports; Iulus says that they are even consuming
    the tables.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aeneas reacts to Iulus' words as the first end of their labors and recalls
    Anchises' secret prophecy about hunger forcing them to consume their tables on
    unknown shores.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Aeneas declares the land owed by fate to him, identifies it as home and fatherland,
    and says it will end their exile.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aeneas instructs the Trojans to investigate the local places, inhabitants,
    and walls, to pour libations to Jupiter, to call upon Anchises, and to set wine
    again on the tables.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Aeneas crowns his temples with a leafy branch and prays to the local genius,
    Earth, nymphs, unknown rivers, Night, celestial signs, Idaean Jupiter, the Phrygian
    mother, and his two parents in heaven and Erebus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Jupiter thunders three times from the high sky and displays a cloud blazing
    with light and gold.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A rumor spreads through the Trojan ranks that the day has arrived for founding
    the promised walls; they renew the feast, set out bowls, and garland the wine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At dawn the Trojans separately explore the city, boundaries, and shores of
    the people, including the Numicus pools, the Tiber river, and the dwelling place
    of the Latins.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Aeneas orders one hundred chosen envoys, veiled with branches of Pallas, to
    go to the king's walls, bring gifts, and request peace for the Trojans.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Aeneas marks out walls with a shallow trench and encloses the first shore
    settlement in the manner of a camp with palisades and earthwork.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Before the Latin city, boys and young men train with horses, chariots, bows,
    spears, running, and striking.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A mounted messenger reports to the aged king that very large men in unfamiliar
    clothing have arrived.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Latinus sits on his ancestral throne inside a great royal building associated
    with Picus, with one hundred columns, ancestral religious awe, royal insignia,
    council functions, and sacred feasts.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: The vestibule contains ordered images of old ancestors and kings, including
    Italus, Sabinus, Saturnus, Janus, and other origin kings and war-wounded figures.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: Sacred doorposts display many arms and war trophies, including captive chariots,
    axes, crests, gate-bars, spears, shields, and ship-prows.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: Picus is represented seated with a Quirinal lituus, a small trabea, and an
    ancile; Circe, desiring him, struck him with a golden wand, used poisons, and
    made him a bird with colored wings.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: Latinus calls the Trojans into the royal house and asks what they seek and
    what cause brought their ships to the Ausonian shore.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:19
  text: Latinus tells the Trojans not to avoid hospitality and describes the Latins
    as Saturn's people, just by their own will and the old god's custom rather than
    by bonds or laws.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:20
  text: Latinus reports an old tradition that Dardanus was born in these Italian fields,
    went to Phrygian Idaean cities and Samothrace, and is now received in the golden
    palace of heaven among the gods.
  category: speech
  evidence_refs:
  - ev:12
