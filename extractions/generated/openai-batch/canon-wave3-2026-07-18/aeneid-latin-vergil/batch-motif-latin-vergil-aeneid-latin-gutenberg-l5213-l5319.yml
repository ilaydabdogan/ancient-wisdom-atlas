candidate_motifs:
- id: motif:1
  label: prophecy fulfilled by eating the tables
  taxonomy_refs: []
  basis: Anchises' prophecy specified that hunger would force Aeneas to consume tables
    on unknown shores; Iulus' remark about eating the tables triggers Aeneas' recognition
    that the destined homeland has been reached.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The motif label is descriptive; no supplied taxonomy family directly names
    this omen-prophecy pattern.
- id: motif:2
  label: divinely confirmed foundation of a destined settlement
  taxonomy_refs:
  - royal_legitimacy
  basis: Aeneas declares the fated land and future home, performs prayers, receives
    Jupiter's thunder-and-cloud confirmation, and the Trojans conclude that the day
    has arrived to found the owed walls.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The taxonomy reference is approximate because the passage concerns settlement
    foundation and divine confirmation more than a completed royal enthronement.
- id: motif:3
  label: ritual hospitality and peace embassy
  taxonomy_refs:
  - sacred_exchange
  basis: Aeneas sends envoys with branches, gifts, and a request for peace; Latinus
    invites the strangers inside and tells them not to avoid Latin hospitality.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: medium
  cautions: The passage initiates diplomacy and hospitality but does not yet complete
    an exchange or treaty.
- id: motif:4
  label: return to ancestral land
  taxonomy_refs:
  - return
  basis: Latinus calls the visitors Dardanidae and recounts that Dardanus came from
    these Italian fields before going to Phrygia; this frames the Trojans' arrival
    as a return to an ancestral point of origin.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage presents Latinus' remembered tradition rather than an explicit
    statement by the narrator that all Trojans are returning.
- id: motif:5
  label: ancestral royal legitimation through hall, effigies, and trophies
  taxonomy_refs:
  - royal_legitimacy
  basis: Latinus receives the Trojans while seated in an ancestral palace-temple marked
    by royal insignia, sacred feasts, ancestor images, and martial trophies.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is a political-sacral setting motif rather than a narrative action
    motif.
- id: motif:6
  label: magical transformation into a bird
  taxonomy_refs:
  - shapeshifter
  basis: Circe uses a golden wand and poisons to turn Picus into a bird and color
    his wings.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: Picus is transformed by another figure rather than voluntarily shapeshifting.
- id: motif:7
  label: deified ancestor received among the gods
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: Latinus states that Dardanus is received in the starry golden palace of heaven
    and increases the number of gods at altars, connecting ancestry and divine status.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The available taxonomy does not include a specific deified-ancestor family;
    the listed references are partial fits.
