canonical_text:
  quote: ''
  summary: The passage opens Book VII with Caieta’s burial and Aeneas’ renewed voyage.
    The Trojans pass Circe’s dangerous shore, where transformed human beings appear
    as beasts, but Neptune carries them past. Aeneas reaches the Tiber. The narrator
    invokes Erato and introduces King Latinus, his divine ancestry, Lavinia’s marriage
    situation, the omens blocking Turnus’ suit, and the oracle of Faunus directing
    that Lavinia not be married to a Latin but to foreign sons-in-law whose descendants
    will gain vast rule.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Caieta, Aeneas’ nurse, has died; Aeneas completes funeral rites, raises a
    burial mound, and leaves the harbor by sail after the sea grows calm.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near Circe’s land, the passage describes inaccessible groves, singing, weaving,
    night fires of cedar, and the sounds of lions, boars, bears, and wolves.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The animal forms near Circe are said to be people whom the goddess, using
    powerful herbs, had clothed in the faces and backs of beasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Neptune fills the sails with favorable winds and carries the Trojans past
    Circe’s dangerous shallows and shores.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aeneas sees a large grove from the sea and the Tiber flowing into the sea;
    birds sing around the banks and riverbed, and Aeneas orders the prows turned toward
    land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator invokes Erato and announces a larger subject involving wars,
    battle-lines, kings driven to death, and Hesperia gathered under arms.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Latinus is introduced as an aged king ruling peaceful lands and cities; he
    is given a lineage through Faunus, Marica, Picus, and Saturn.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Latinus has no living male child; his daughter Lavinia is marriageable, and
    many suitors seek her, especially Turnus, whom the queen favors.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A sacred laurel in the palace interior is swarmed by bees, and a seer interprets
