candidate_motifs:
- id: motif:1
  label: Funeral rite followed by renewed voyage
  taxonomy_refs:
  - departure
  basis: After Caieta’s burial rites and mound are completed, Aeneas departs by sea
    and continues the journey.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage emphasizes the voyage sequence more than a formal departure
    ritual motif.
- id: motif:2
  label: Humans transformed into beasts by an enchantress
  taxonomy_refs:
  - shapeshifter
  basis: Circe uses powerful herbs to clothe people in the faces and backs of wild
    animals.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The victims are transformed by another figure rather than voluntarily
    shifting shape.
- id: motif:3
  label: Divine protection past a dangerous liminal shore
  taxonomy_refs: []
  basis: Neptune sends favorable winds so that the Trojans do not enter Circe’s dreadful
    shore and are carried past the dangerous shallows.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy reference precisely names this protective sea-passage
    pattern.
- id: motif:4
  label: Divine ancestry supporting royal identity
  taxonomy_refs:
  - royal_legitimacy
  basis: Latinus’ lineage is traced through Faunus, Marica, Picus, and Saturn, and
    the later oracle says foreign descendants will raise the name to the stars and
    rule widely.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: high
  cautions: The passage supplies genealogy and future rule, but does not explicitly
    argue a legal claim in prose terms.
- id: motif:5
  label: Portents blocking a royal marriage
  taxonomy_refs: []
  basis: 'Although Turnus is favored as Lavinia’s suitor, divine portents intervene:
    the bee swarm and Lavinia’s fire omen precede the oracle forbidding a Latin marriage.'
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: The motif concerns omen and dynastic marriage; it is not identical to
    a sacred marriage motif in the strict sense.
- id: motif:6
  label: Sacred tree as omen site
  taxonomy_refs:
  - sacred_tree_axis
  basis: A laurel consecrated to Phoebus and located in the palace interior receives
    a bee swarm that is interpreted prophetically.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The laurel is clearly sacred, but the passage does not state that it functions
    as a cosmic axis or world center.
- id: motif:7
  label: Ambivalent fire omen on a royal maiden
  taxonomy_refs: []
  basis: Fire envelops Lavinia’s hair and crown; interpreters read it as both her
    future fame and a sign of great war for the people.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The supplied motif taxonomy does not contain a direct fire-omen family,
    so no motif taxonomy reference is assigned.
- id: motif:8
  label: Nocturnal incubation oracle on sacrificial skins
  taxonomy_refs:
  - wisdom
  basis: Oracle-seekers bring offerings and sleep on the skins of slaughtered sheep,
    receiving images, voices, divine conversation, and underworld contact; Latinus
    follows this rite to receive Faunus’ command.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy reference 'wisdom' is broad; the passage specifically describes
    divination and oracular consultation.
- id: motif:9
  label: Fated foreign son-in-law and world-ruling descendants
  taxonomy_refs:
  - royal_legitimacy
  basis: The oracle commands Latinus not to marry his daughter to Latins, announces
    foreign sons-in-law, and says their descendants will raise the ancestral name
    to the stars and rule all beneath the sun’s course.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is closely tied to dynastic prophecy; the identity of the foreign
    son-in-law is not named within the oracle lines themselves.
- id: motif:10
  label: Rumor spreading divine prophecy before conflict
  taxonomy_refs: []
  basis: Faunus’ responses are not suppressed by Latinus and are spread by Fama through
    Ausonian cities as the Trojans arrive.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a narrative transmission pattern rather than a clearly bounded
    mythic motif in the supplied taxonomy.
