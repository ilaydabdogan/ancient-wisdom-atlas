    parts and dominate the citadel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: While Lavinia stands beside her father at the altars, fire appears to seize
    her hair, ornaments, and jeweled crown; the portent is interpreted as fame for
    her and great war for the people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Latinus seeks responses from the oracle of Faunus at the grove of Albunea,
