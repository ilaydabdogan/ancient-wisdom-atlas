canonical_text:
  quote: corpora viva nefas Stygia vectare carina
  summary: Aeneas encounters the shade of Palinurus, hears how he died and remains
    unburied, and receives the Sibyl's assurance that Palinurus will receive rites
    and a name-bearing tomb. Aeneas and the Sibyl then approach the Stygian ferry;
    Charon initially refuses a living, armed passenger, but accepts them after the
    Sibyl displays the fateful branch. After crossing, the Sibyl drugs Cerberus with
    a honeyed grain cake, and Aeneas passes the guardian.
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Palinurus appears as a sad shade; he is identified as Aeneas's helmsman who
    recently fell from the stern into the middle of the sea while watching the stars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas asks Palinurus which god took him away and drowned him, and says Apollo
    had promised that Palinurus would reach Italy safely.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Palinurus answers that Apollo's oracle did not deceive Aeneas and that no
    god drowned him; he says the rudder was torn away and he fell while clinging to
    it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Palinurus says he feared for Aeneas's ship, deprived of its gear and master,
    amid rising waves more than he feared for himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Palinurus says the south wind carried him over rough seas for three winter
    nights; on the fourth day he saw Italy, swam toward land, and was killed by a
    cruel people while wet and clinging to rough mountain rocks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Palinurus says waves now hold him and winds turn him on the shore.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:7
  text: Palinurus asks Aeneas either to cast earth over him near the Velinian harbor
    or, if possible, to give him a hand and take him across the waters so that he
    may rest in peaceful seats in death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Sibyl tells Palinurus that, unburied, he will not look upon or approach
    the Stygian waters and the severe river without command.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Sibyl tells Palinurus to stop hoping that divine fates can be bent by
    prayer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Sibyl foretells that neighboring peoples, driven by heavenly prodigies,
    will cleanse Palinurus's bones, establish a mound, send rites to the mound, and
    that the place will forever bear Palinurus's name.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: Charon sees Aeneas and the Sibyl approaching the river through the silent
    grove and challenges the armed visitor to state why he has come and to stop walking.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Charon says the place belongs to shades, sleep, and drowsy night, and that
    it is unlawful to carry living bodies in the Stygian boat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Charon recalls that he was not glad to receive Alcides, Theseus, and Pirithous,
    although they were divine-born and invincible in strength; he describes Alcides
    seizing the Tartarean guardian and Theseus with Pirithous attempting to lead away
    the queen of Dis.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Sibyl replies that there are no such plots, that the weapons bring no
    force, and that Trojan Aeneas descends to the lowest shades of Erebus to seek
    his father.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Sibyl reveals a branch that had been hidden in her clothing, and Charon's
    anger subsides when he recognizes the venerable gift of the fateful branch.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:16
  text: Charon turns his blue boat toward the bank, dislodges other souls, makes room
    on the benches, receives Aeneas into the hull, and ferries Aeneas and the Sibyl
    safely across the river.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The patched boat groans under Aeneas's weight and takes in much marsh water
