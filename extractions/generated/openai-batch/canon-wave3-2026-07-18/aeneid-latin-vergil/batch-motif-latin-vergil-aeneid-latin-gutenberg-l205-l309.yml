canonical_text:
  quote: ''
  summary: Neptune notices the sea-storm and the scattered Trojan fleet, rebukes the
    winds, asserts his rule over the sea, and restores calm. The Trojans reach a sheltered
    Libyan harbor with caves, fresh water, rocks, and woods. Achates makes fire; Aeneas
    searches for missing ships, hunts seven deer for the seven ships, distributes
    food and wine, and encourages his companions with hope of fated settlement in
    Latium and renewed Trojan rule. After eating, the Trojans wonder about missing
    companions, and Aeneas mourns named comrades.
  language: Latin
  quote_policy: summarized
