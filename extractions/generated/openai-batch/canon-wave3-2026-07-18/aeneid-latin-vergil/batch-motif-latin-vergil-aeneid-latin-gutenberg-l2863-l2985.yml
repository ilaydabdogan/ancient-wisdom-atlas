- id: obs:3
  text: Aeneas says that, if fate allowed him to direct his life by his own will,
    he would cultivate Troy's relics and rebuild Pergamum, but Apollo and Lycian lots
    order him to seek Italy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Aeneas says Anchises' image frightens him in dreams, Ascanius' future is being
    wronged, and a divine messenger sent by Jupiter brought commands through the air.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dido watches Aeneas silently and angrily, accuses him of not being born from
    a divine mother or Dardanus, and says Caucasus rocks and Hyrcanian tigresses produced
    him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dido says she received Aeneas when he was cast up and needy, gave him a share
    in her kingdom, restored his lost fleet, and brought his companions back from
    death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dido tells Aeneas to go to Italy and says she hopes he will suffer among rocks,
    call often on Dido's name, and that her shade will be present everywhere after
    death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dido breaks off her speech, withdraws from Aeneas' sight, collapses, and attendants
