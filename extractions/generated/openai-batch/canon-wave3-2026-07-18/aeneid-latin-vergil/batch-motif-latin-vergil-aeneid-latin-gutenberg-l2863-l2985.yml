canonical_text:
  quote: Italiam non sponte sequor.
  summary: Aeneas answers Dido that divine commands, fate, his father, and Ascanius
    compel him toward Italy. Dido accuses and curses him, then collapses. Aeneas grieves
    but returns to the fleet; the Trojans prepare to leave. Dido asks Anna to plead
    for delay, but Aeneas remains unmoved under fate and divine obstruction, like
    a wind-battered oak rooted toward Tartarus.
  language: Latin
  quote_policy: quoted
