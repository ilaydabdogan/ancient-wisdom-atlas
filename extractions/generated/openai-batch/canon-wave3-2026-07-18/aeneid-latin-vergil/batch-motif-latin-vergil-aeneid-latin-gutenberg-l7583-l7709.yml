canonical_text:
  quote: Rex Iuppiter omnibus idem. Fata viam invenient.
  summary: Venus appeals to Jupiter on behalf of the besieged Trojans and asks at
    least that Ascanius be spared. Juno rebuts her, defending the Italians and Turnus
    while accusing the Trojans and Venus of earlier provocations and interventions.
    Jupiter silences the divine assembly and declares impartiality between Trojan
    and Rutulian, saying each will bear fortune and fate will find a way; he swears
    by Styx and shakes Olympus. The narrative then returns to the Rutulian siege of
    the Trojan camp, where the Aeneadae defend the walls and Ascanius appears among
    them.
  language: Latin
  quote_policy: quoted
