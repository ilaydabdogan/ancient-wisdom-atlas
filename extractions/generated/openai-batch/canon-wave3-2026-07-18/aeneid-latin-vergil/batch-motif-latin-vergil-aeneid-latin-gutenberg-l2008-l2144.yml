candidate_motifs:
- id: motif:1
  label: prophetic curse delaying city-foundation
  taxonomy_refs:
  - divine_judgment
  basis: Celaeno gives a divinely mediated prediction that the Trojans will reach
    Italy but must suffer famine and eat their tables before enclosing their destined
    city with walls.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: high
  cautions: The passage presents a prophecy and threat; classification as divine judgment
    rests on the stated connection between the Harpies' injury and the announced famine.
- id: motif:2
  label: exiled sea journey toward a destined land
  taxonomy_refs:
  - departure
  basis: Aeneas' group seeks Italy, repeatedly departs by ship, follows wind and helmsman
    over the sea, and asks how to continue through the dangers ahead.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:9
  confidence: high
  cautions: This is a passage segment within a longer voyage, not the initial departure
    from Troy.
- id: motif:3
  label: ritual appeasement before danger or oracle
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: After the prophecy, Anchises calls on the gods with vows and honors; later
    the Trojans burn altars, and Helenus sacrifices calves and seeks peace from the
    gods before prophetic speech.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:10
  confidence: high
  cautions: The exchange relation is implied by vows, honors, sacrifice, and requests
    for divine peace, but not theorized in the passage.
