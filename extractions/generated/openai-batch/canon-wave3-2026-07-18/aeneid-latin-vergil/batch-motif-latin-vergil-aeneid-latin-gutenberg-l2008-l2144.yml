canonical_text:
  quote: ''
  summary: Celaeno the Harpy prophesies that Aeneas and his companions will reach
    Italy but will not found their city until famine forces them to eat their tables.
    The Trojans respond with fear, prayers, rites, and renewed sailing. They land,
    perform sacrifices and games, dedicate a captured shield, and come to Buthrotum,
    where they encounter Andromache and Helenus. Andromache laments her postwar captivity
    and asks after Ascanius. Helenus welcomes the Trojans into a miniature Troy. Before
    departure, Aeneas asks Helenus, as a divine interpreter, how to avoid the dangers
    foretold by Celaeno; Helenus performs sacrifice and prepares to speak prophetically.
  language: Latin
  quote_policy: summarized
