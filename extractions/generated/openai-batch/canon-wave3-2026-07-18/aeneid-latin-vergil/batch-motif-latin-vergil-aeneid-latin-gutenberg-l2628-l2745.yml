  evidence_refs:
  - ev:1
- id: obs:3
  text: Juno says Aeneas and Dido are preparing to go hunting in a grove at dawn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Juno plans to pour down a dark cloud mixed with hail and to stir the whole
    sky with thunder, so that companions scatter and are covered by dark night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Juno says Dido and the Trojan leader will come to the same cave, and that
    she will be present to join them in marriage if Venus is willing.
  category: speech
  evidence_refs:
  - ev:2
