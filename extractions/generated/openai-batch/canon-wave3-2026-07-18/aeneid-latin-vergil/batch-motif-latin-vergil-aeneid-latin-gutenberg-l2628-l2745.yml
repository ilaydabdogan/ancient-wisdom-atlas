  summary: Venus and Juno negotiate a plan in which a hunt, storm, and cave bring
    Dido and Aeneas together. The union is accompanied by divine and cosmic signs,
    then Fama spreads reports through Libya and inflames Iarbas, who prays angrily
    to Jupiter after recounting his temples, altars, and rejected marriage claim.
  language: Latin
