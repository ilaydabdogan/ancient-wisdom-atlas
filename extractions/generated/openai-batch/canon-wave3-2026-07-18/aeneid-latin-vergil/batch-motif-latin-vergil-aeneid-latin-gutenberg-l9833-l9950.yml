canonical_text:
  quote: ''
  summary: Aeneas, wounded and unable to return to battle, is treated unsuccessfully
    by Iapyx until Venus secretly adds Cretan dittany and divine healing substances
    to the water, causing the arrow to fall out and Aeneas' strength to return. Iapyx
    recognizes a greater divine power at work. Aeneas arms himself, exhorts Ascanius
    to learn virtue and labor from him, and returns to battle seeking Turnus. Juturna,
    fearing for Turnus, displaces his charioteer Metiscus and assumes his voice, body,
    and arms, steering Turnus away from direct combat. After Messapus nearly strikes
    Aeneas and Juturna keeps Turnus' chariot away, Aeneas invokes Jupiter and the
    violated treaty altars and begins indiscriminate slaughter.
  language: Latin
  quote_policy: summarized
