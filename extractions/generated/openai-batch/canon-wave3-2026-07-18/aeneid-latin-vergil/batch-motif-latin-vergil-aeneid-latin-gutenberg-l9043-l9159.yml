canonical_text:
  quote: ''
  summary: 'Diana addresses Opis from heaven and recounts Camilla’s infancy: Metabus
    fled with her from Privernum, vowed her to Diana, bound her to a spear, cast her
    across the flooded Amasenus, and raised her in the wild as a weapon-bearing virgin
    devoted to Diana. Diana sends Opis to avenge whoever wounds Camilla and promises
    to return Camilla’s body and arms for burial. The passage then shifts to cavalry
    battle between Trojan/Etruscan and Latin/Rutulian forces, with alternating charges,
    deaths, and named combat encounters.'
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Diana, called Latonia, speaks sorrowfully to Opis, one of her virgin companions
    in the sacred retinue.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Diana says Camilla is going to cruel war, is armed with Diana’s weapons, and
    is especially dear to her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Metabus, exiled from Privernum, carried his infant daughter while fleeing
    through battle and named her Camilla after her mother Casmilla with part of the
    name changed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the flight Metabus reached the swollen Amasenus river while Volscian
    soldiers pressed around him.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Metabus bound the infant, enclosed in bark and cork, to the middle of a strong
    spear and vowed her to Diana as his servant before throwing the spear across the
    river.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Metabus then entered the river and retrieved the spear and girl from the grassy
    bank as a gift to Trivia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: No cities or walled homes received Metabus; he spent his life among shepherds
    and lonely mountains.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Metabus nourished Camilla in thickets and rough lairs with the milk of a herd
    mare.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Camilla first stood on her feet, Metabus armed her hands with a sharp
    javelin and hung small missiles and a bow from her shoulder.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Camilla wore a tiger skin instead of gold hair ornaments and a long robe,
    and as a child she used missiles, sling, and hunting weapons against birds.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Many Tyrrhenian mothers sought Camilla as a daughter-in-law, but she remained
    content with Diana and cultivated weapons and virginity.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Diana says Camilla is pressed by harsh fates and instructs Opis to go to the
    Latin borders where battle is beginning under an unlucky omen.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Diana gives Opis an avenging arrow and orders punishment in blood for anyone,
