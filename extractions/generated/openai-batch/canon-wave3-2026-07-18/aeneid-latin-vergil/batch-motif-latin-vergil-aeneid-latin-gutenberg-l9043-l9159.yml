- id: ev:6
  type: summary
  locator: 9076-9082
  quote_or_summary: Metabus throws the spear; Camilla passes over the rapid river
    on the whistling javelin, then he enters the river and pulls spear and girl from
    the grassy bank as a gift to Trivia.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 9083-9086
  quote_or_summary: No houses, city walls, or cities receive Metabus; he lives among
    shepherds and lonely mountains.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 9087-9090
  quote_or_summary: Metabus feeds Camilla in thickets and rough lairs with the teats
    and wild milk of a herd mare.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 9090-9094
  quote_or_summary: As soon as the child first stands on her feet, Metabus arms her
    hands with a sharp javelin and hangs small missiles and a bow from her shoulder.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 9094-9100
  quote_or_summary: Instead of gold hair ornaments and a long robe, tiger skin hangs
    down Camilla’s back; even as a child she hurls weapons and uses a sling to bring
    down birds.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 9101-9105
  quote_or_summary: Many Tyrrhenian mothers desire Camilla as a daughter-in-law, but
    she remains content with Diana and preserves an unbroken love of weapons and virginity.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 9105-9110
  quote_or_summary: Diana wishes Camilla had not taken up such warfare against the
    Trojans; since she is driven by bitter fates, Diana sends Opis from heaven to
    the Latin borders where an ill-omened battle begins.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 9111-9114
  quote_or_summary: Diana tells Opis to take an avenging arrow from the quiver and
    says that whoever, Trojan or Italian, violates Camilla’s sacred body with a wound
    must pay blood penalty to Diana.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 9115-9117
  quote_or_summary: Diana says she will later carry Camilla’s pitiable body and unstripped
    arms in a hollow cloud and place them in her native tomb.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 9118-9120
  quote_or_summary: Opis descends lightly through the air from heaven, sounding as
    she goes, with her body surrounded by a black whirlwind.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 9121-9130
  quote_or_summary: Trojan forces, Etruscan leaders, and cavalry approach the walls;
    opposite them appear Messapus, swift Latins, Coras with his brother, and Camilla’s
    wing, extending spears and brandishing missiles.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 9131-9135
  quote_or_summary: Both sides halt within missile range, then burst into shouting,
    urge their horses, and pour dense missiles everywhere like snow, darkening the
    sky.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: 9136-9142
  quote_or_summary: Tyrrhenus and Aconteus rush together with opposed spears; Aconteus
    is thrown far like lightning or a weight shot from an engine and his life is scattered
    into the air.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: 9143-9158
  quote_or_summary: 'Latin ranks are disturbed and turn toward the walls; Asilas leads
    Trojan squadrons. The Latins rally, and the fight alternates: twice the Tusci
    drive the Rutulians to the walls and twice are driven back, compared to sea waves
    advancing to land and receding from shore.'
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: 9159-9166
  quote_or_summary: In the third clash the full lines interweave man against man;
    groans of the dying, blood, weapons, bodies, and half-alive horses fill the harsh
    battle.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: 9167-9172
  quote_or_summary: Orsilochus, unwilling to approach Remulus directly, hurls his
    spear at Remulus’s horse under the ear; the horse rears in pain and throws its
    rider to the ground.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:22
  type: summary
  locator: 9173-9182
  quote_or_summary: Catillus brings down Iollas and Herminius; Herminius is large
