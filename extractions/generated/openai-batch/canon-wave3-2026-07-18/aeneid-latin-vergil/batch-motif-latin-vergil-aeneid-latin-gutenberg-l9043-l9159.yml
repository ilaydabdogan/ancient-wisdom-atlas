  quote_or_summary: Metabus takes a large strong spear, encloses his daughter in bark
    and wild cork, binds her to the middle of it, and addresses Diana as the nurturing
    Latonian virgin who dwells in the woods.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
