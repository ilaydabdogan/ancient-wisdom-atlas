canonical_text:
  quote: ''
  summary: Ilioneus speaks to King Latinus on behalf of Aeneas and the Trojans, explaining
    their divine ancestry, displacement from Troy, divinely commanded search for Latium,
    and offering gifts from Troy. Latinus considers an oracle about a foreign son-in-law
    for his daughter, welcomes the Trojans, invites Aeneas, and sends horses as gifts
    while the Trojans return with peace.
  language: Latin
  quote_policy: summarized
