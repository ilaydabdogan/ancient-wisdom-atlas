candidate_motifs:
- id: motif:1
  label: treaty upheld and disrupted by violence
  taxonomy_refs:
  - covenant
  basis: Aeneas explicitly invokes the established treaty and laws and calls for anger
    to cease, but an unclaimed arrow wounds him during this appeal.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents a battlefield treaty and its disruption; it does
    not develop a broad covenant theology beyond the immediate duel terms.
- id: motif:2
  label: divine or chance ambiguity in a decisive wound
  taxonomy_refs: []
  basis: The narrator asks whether chance or a god brought the Rutuli the glory of
    the arrow-shot and says the agent is uncertain and unclaimed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage preserves ambiguity and does not identify a divine actor.
- id: motif:3
  label: warrior assimilated to war-god and storm-force
  taxonomy_refs: []
  basis: Turnus' battle-rage is directly compared to Mavors with war-horses and to
    Boreas driving waves and clouds, while he routes armies and kills many named opponents.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:10
  confidence: high
  cautions: This is supported by epic simile rather than by a literal transformation
    or divine identity.
- id: motif:4
  label: victorious warrior taunts fallen enemy over desired land
  taxonomy_refs: []
  basis: After cutting Eumedes' throat, Turnus tells the fallen Trojan to measure
    the fields and Hesperia he sought in war and frames this as the reward for those
    who test him with iron.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The motif is local to this combat scene and is not linked here to an available
    taxonomy family.
- id: motif:5
  label: chariot charge as battlefield devastation
  taxonomy_refs: []
  basis: Turnus mounts a chariot, crushes ranks, scatters blood with the horses' hoofs,
    routs formations, and kills Phegeus after Phegeus tries to stop the team.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:11
  - ev:12
  confidence: high
  cautions: This is a battle-pattern motif, not a mythic taxonomy category supplied
    in the available list.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Turnus' battle advance to blood-red Mavors
    driving war-horses with Fear, Anger, and Ambush as his retinue.
  claim_level: visual_similarity
  target: Mavors/Mars as war-god in a martial chariot-like advance
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is an epic simile; it does not claim Turnus is literally
    Mavors or divinely transformed.
- id: claim:2
  claim: The passage explicitly compares the retreat of armies before Turnus to clouds
    fleeing and waves being driven when Boreas sounds over the Aegean.
  claim_level: visual_similarity
  target: Boreas as storm-wind force driving sea and sky
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison concerns motion and force in battle; it does not establish
    historical contact or a separate storm-god episode.
- id: claim:3
  claim: The reference to Dolon, Tydides, and Achilles' horses links Eumedes' genealogy
    to a remembered Trojan-war spying episode within the epic tradition.
  claim_level: same_function
  target: Dolon spying episode involving Tydides and Achilles' horses
  evidence_refs:
