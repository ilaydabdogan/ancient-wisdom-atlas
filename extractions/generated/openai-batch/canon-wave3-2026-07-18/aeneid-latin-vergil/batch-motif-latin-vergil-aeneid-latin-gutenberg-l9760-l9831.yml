  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: While Phegeus is dragged and hangs from the yoke, Turnus' broad spear pierces
    his two-layer cuirass and grazes the top of his body.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Phegeus turns against the enemy with shield raised and sword drawn, but the
