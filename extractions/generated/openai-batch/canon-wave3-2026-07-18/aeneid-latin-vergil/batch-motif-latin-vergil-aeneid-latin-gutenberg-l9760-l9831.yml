canonical_text:
  quote: ''
  summary: Aeneas, unarmed and bare-headed, calls for the armies to restrain their
    anger and honor the agreed treaty that grants him the sole right to face Turnus.
    During his speech an arrow wounds him, with the source of the shot left uncertain.
    Turnus sees Aeneas withdraw, arms himself, mounts his chariot, and kills or overthrows
    many enemies. The narration compares his onslaught to Mavors driving war-horses
    near the Hebrus and to Boreas stirring the Aegean. Turnus kills Eumedes with taunting
    speech, then strikes down several companions and finally beheads Phegeus after
    Phegeus tries to stop his chariot.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas extends an unarmed right hand, with head uncovered, and calls to his
    own people to stop the sudden discord and restrain anger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas states that a treaty and laws have already been set and that he alone
    has the right to engage in combat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aeneas says he will make the treaty firm by his hand and that the rites now
    owe Turnus to him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: An arrow flies down with a hiss of wings and wounds Aeneas while he is speaking;
    the narrator says the hand, force, and whether chance or a god brought the deed
    are uncertain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: No one boasts of having wounded Aeneas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Turnus sees Aeneas withdrawing from the battle-line and the leaders confused,
    becomes heated by sudden hope, asks for horses and weapons, and mounts his chariot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Turnus drives through the fighting, killing many men, rolling many half-dead,
    crushing ranks with the chariot, and casting seized spears at fleeing men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator compares Turnus to blood-red Mavors by the cold Hebrus, driving
    raging wars with horses, accompanied by Fear, Anger, and Ambush.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Turnus' horses are sweating; their hoofs scatter bloody drops and trample
    blood mixed with sand.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Turnus kills Sthenelus, Thamyrus, Pholus, the two sons of Imbrasus named Glaucus
    and Lades, and others by close or distant attack.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Eumedes is identified as the son of ancient Dolon, resembling his grandfather
    in name and his father in spirit and hands.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Turnus wounds Eumedes from afar with a light javelin, stops his two-horse
    team, leaps from the chariot, pins the fallen half-dead man by the neck with his
    foot, takes his sword, cuts his throat, and taunts him over Hesperia and walls.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Turnus sends Asbytes down with a thrown spear and also kills Chloreus, Sybaris,
    Dares, Thersilochus, and Thymoetes, who had fallen from the neck of a plunging
    horse.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The narrator compares the ranks giving way before Turnus to clouds fleeing
    from the sky when Boreas sounds over the Aegean and drives waves to the shores.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Phegeus cannot endure Turnus' advance, throws himself before the chariot,
