canonical_text:
  quote: "“Cede deo.” ... “Hanc tibi, Eryx, meliorem animam pro morte Daretis / persolvo.”"
  summary: After a race, Aeneas announces a boxing contest with prizes. Dares steps
    forward unchallenged until Acestes urges the aged Entellus to fight. Entellus
    displays the heavy caestus once associated with Eryx and Hercules, accepts equal
    gear, and boxes Dares. After Entellus falls and then violently overwhelms Dares,
    Aeneas stops the match, telling Dares to yield to the god. Entellus receives the
    bull prize, kills it with the caestus, offers its life to Eryx in place of Dares,
    and renounces boxing.
  language: Latin
  quote_policy: quoted
