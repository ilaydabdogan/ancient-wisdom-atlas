canonical_text:
  quote: Nos sumus, Idaeae sacro de vertice pinus, nunc pelagi nymphae
  summary: At night Aeneas steers his ship. Sea nymphs who were formerly his ships
    meet him; Cymodocea explains their transformation, warns him of Ascanius and Turnus,
    and urges him to arm. Aeneas takes heart from the omen, prays to the Idaean Mother,
    approaches the Trojan camp at dawn, raises his fiery shield, and Turnus exhorts
    his forces to meet the landing.
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Night has fallen, Phoebe is in mid-Olympus, and Aeneas personally steers the
    ship because care does not allow his body rest.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A chorus of Aeneas'' companions meets him in mid-sea: nymphs whom Cybebe
    had ordered to have the power of the sea and to be nymphs from ships.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The nymphs swim together, cut the waves, recognize Aeneas from afar, and circle
    him in dances; their number matches the bronze-prowed ships that formerly stood
    at the shore.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cymodocea, described as the most skilled at speaking among them, follows behind,
    holds the stern with her right hand, rises with her back above the water, and
    rows silently with her left hand under the waves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cymodocea tells Aeneas that the nymphs were pines from Ida's sacred summit,
    are now sea nymphs, were his fleet, broke their bonds unwillingly when the Rutulian
    pressed them with iron and flame, and are seeking him across the sea.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cymodocea says the Mother pitied and remade their form, gave them existence
    as goddesses, and allowed them to pass their age under the waves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cymodocea reports that Ascanius is held by walls and ditches amid weapons
    and fierce Latins, while Arcadian horsemen mixed with Etruscans hold their assigned
    places and Turnus intends to block them from joining the camp.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cymodocea urges Aeneas at Aurora's coming to summon his allies to arms first,
    to take the invincible gold-bordered shield given by Ignipotens, and says the
    next light will see great heaps of Rutulian slaughter if her words are not considered
    false.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After speaking, Cymodocea pushes the tall stern with her right hand; the ship
    flies through the waves faster than a javelin and a wind-matching arrow, and the
    other ships hasten their course.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aeneas is astonished but raises his spirits because of the omen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Aeneas looks up to the vault above and prays to the Idaean Mother of the gods,
    invoking Dindyma, turreted cities, and paired lions at the reins, and asks her
    to lead the battle, bring the augury near, and aid the Phrygians with favorable
    step.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dawn reddens, day drives away night, and Aeneas orders his companions to follow
    the standards, set their minds to arms, and prepare for battle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Aeneas comes within sight of the Teucrians and his camp, stands high on the
    stern, and raises his burning shield with his left hand; the Dardanidae on the
    walls shout to the stars and throw weapons.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Rutulian king and Ausonian leaders are amazed until they see the ships
    turned toward the shore and the whole sea approaching with fleets.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A flame pours from the crest on Aeneas' head and from the top of his plume,
    and the golden boss of the shield emits great fires.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: The fiery sight is compared to blood-red comets at night and to Sirius' heat,
    which brings thirst and diseases to sick mortals and darkens the sky with an ill-omened
    light.
  category: other
  evidence_refs:
  - ev:9
- id: obs:17
  text: Turnus' confidence does not leave him; he seeks to seize the shore and drive
    the arrivals from land.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Turnus exhorts his men that what they wished for is present, that Mars is
    in their hands, and that they should remember wives, homes, fathers' praises,
    meet the enemy at the water, and trust that Fortune helps the bold.
  category: speech
  evidence_refs:
  - ev:10
