- id: motif:5
  label: Besieged child and returning leader
  taxonomy_refs: []
  basis: Cymodocea reports that young Ascanius is held within walls and ditches amid
    enemies while Aeneas approaches by sea to rejoin the camp and battle.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The passage states Ascanius' danger and Aeneas' return, but does not complete
    a rescue within this excerpt.
