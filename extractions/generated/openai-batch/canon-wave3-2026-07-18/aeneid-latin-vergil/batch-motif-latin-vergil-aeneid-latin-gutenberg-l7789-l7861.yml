candidate_motifs:
- id: motif:1
  label: Ships transformed into sea nymphs
  taxonomy_refs:
  - shapeshifter
  basis: The passage states that Aeneas' fleet, made from Idaean pines, has become
    sea nymphs and goddesses under the waves through the action of Cybebe or the Mother.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The transformation is divinely imposed or granted rather than voluntary
    shape-shifting by the ships themselves.
- id: motif:2
  label: Mother goddess as protector through transformation and augury
  taxonomy_refs:
  - mother_goddess
  basis: Cybebe or the Idaean Mother remakes the ships as sea nymphs; Aeneas then
    prays to her as Mother of the gods for battle leadership, augury, and favorable
    aid.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage reports the prior transformation and Aeneas' prayer; it does
    not narrate a new spoken response from the goddess within this excerpt.
- id: motif:3
  label: Divine omen strengthening the hero before battle
  taxonomy_refs: []
  basis: After Cymodocea pushes the ship, Aeneas is astonished but raises his spirits
    from the omen; he then prays and later displays a fiery shield as he approaches
    the camp.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage explicitly calls the nymph event an omen; the fiery shield
    is described portentously but not explicitly labeled an omen here.
- id: motif:4
  label: Fiery martial sign around hero and shield
  taxonomy_refs: []
  basis: Aeneas raises a burning shield, flame pours from his crest, and the shield
