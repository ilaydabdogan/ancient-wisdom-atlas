canonical_text:
  quote: ''
  summary: Pallas rallies retreating Arcadians, leads a charge, kills several opponents,
    and inspires his allies. A fire simile describes the gathering force of his comrades.
    Halaesus kills multiple enemies but is described as fated after his father’s death;
    Pallas prays to Father Tiber, vows Halaesus’ spoils to an oak, and strikes Halaesus
    while he protects Imaon. Lausus then resists, kills Abas, and the passage closes
    with Pallas and Lausus pressing from opposite sides while the ruler of Olympus
    prevents their encounter because greater fates await them.
  language: Latin
  quote_policy: summarized
