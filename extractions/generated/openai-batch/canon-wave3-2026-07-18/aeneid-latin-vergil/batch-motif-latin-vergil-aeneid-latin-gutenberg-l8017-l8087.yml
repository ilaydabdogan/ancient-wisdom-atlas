canonical_text:
  quote: ''
  summary: Turnus is urged onward and demands single combat with Pallas. Pallas accepts,
    prays to Alcides for aid, and is heard, but the divine father states that each
    life has its fixed day. Pallas wounds Turnus slightly; Turnus kills Pallas with
    a spear, grants burial honors while taking his ornate belt as spoil, and the narrator
    foretells Turnus's future regret. Pallas's companions carry his body back on a
    shield.
  language: Latin
  quote_policy: summarized
