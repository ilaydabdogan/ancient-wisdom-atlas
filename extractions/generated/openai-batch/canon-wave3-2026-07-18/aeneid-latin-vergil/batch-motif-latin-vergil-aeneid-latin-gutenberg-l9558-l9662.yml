  text: Dawn is described as light spreading over the mountaintops and the horses
    of the sun rising from the deep.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rutulian and Teucrian men prepare a contest field under the walls of a great
    city, placing hearths and grassy altars for common gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some participants carry water and fire and wear ritual coverings of linen
