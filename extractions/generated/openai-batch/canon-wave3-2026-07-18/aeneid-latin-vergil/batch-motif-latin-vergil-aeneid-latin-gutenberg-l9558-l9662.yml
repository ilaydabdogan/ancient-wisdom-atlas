  text: Juno watches the field, both armies, and Latinus’ city from a height later
    called the Alban mount.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Juno addresses Juturna, Turnus’ sister, a goddess associated with pools and
    sounding rivers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Juno says she protected Turnus and his walls while Fortune and the Parcae
    allowed, but now hostile fate is near.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Juno says she cannot look on the battle or treaties and urges Juturna to save
    her brother if she can, or to stir war and disturb the conceived treaty.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Juturna weeps and strikes her breast repeatedly after Juno speaks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Latinus comes in a four-horse chariot with twelve golden rays around his temples,
    while Turnus comes in a white two-horse chariot carrying two broad-bladed spears.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Aeneas, called the origin of the Roman stock, comes with celestial arms and
    a star-bright shield; Ascanius is beside him and is called another hope of great
    Rome.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: A priest brings the offspring of a bristly sow and an unshorn sheep to the
    flaming altars.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The ritual participants face the rising sun, offer salted grain, mark the
    victims’ foreheads with iron, and pour libations on the altars.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Aeneas prays with a drawn sword and calls Sol, Terra, Jupiter, Juno, Mars,
    fountains, rivers, heavenly powers, and sea deities as witnesses.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:17
  text: 'Aeneas states terms for Turnus’ victory: the defeated Aeneadae will withdraw
    to Evander’s city, Iulus will leave the lands, and they will not renew war against
    the realm.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: 'Aeneas states terms for Trojan victory: Italians will not be forced to serve
    Trojans, both unconquered peoples will enter equal eternal treaties, Latinus will
    keep arms and formal command, Trojans will build walls, and the city will take
    Lavinia’s name.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: Latinus swears by earth, sea, stars, Latona’s twin offspring, double-faced
    Janus, infernal divine power, Dis, and Jupiter who sanctions treaties with lightning.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:20
  text: Latinus touches the altars and flames and vows that no day and no force will
    break the peace and treaties for the Italians.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:21
  text: Latinus compares the oath to a scepter that will never again put forth leaves
    or shade because it was cut from its root and encased by a craftsman’s hand in
    bronze.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:22
  text: The leaders confirm the treaty before the nobles, slaughter the consecrated
    animals into the flame, remove entrails from living victims, and heap the altars
    with loaded plates.
  category: sequence
  evidence_refs:
  - ev:9
