canonical_text:
  quote: ''
  summary: At dawn, Rutulian and Trojan forces prepare a ritual field for a contest
    and treaty. Juno watches from the Alban height and urges Juturna, Turnus’ sister,
    to save him or disrupt the pact. Latinus, Turnus, Aeneas, Ascanius, and a priest
    arrive for oath sacrifice. Aeneas and Latinus invoke gods and cosmic witnesses,
    state treaty terms, and confirm the pact with the slaughter of consecrated animals
    at the altars.
  language: Latin
  quote_policy: summarized
