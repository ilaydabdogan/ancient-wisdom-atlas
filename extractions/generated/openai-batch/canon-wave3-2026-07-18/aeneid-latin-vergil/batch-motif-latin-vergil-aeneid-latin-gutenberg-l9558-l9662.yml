candidate_motifs:
- id: motif:1
  label: oath-bound covenant before divine witnesses
  taxonomy_refs:
  - covenant
  basis: The passage stages formal foedera with divine invocations, stated terms for
    victory by either side, mutual vows, and public confirmation before nobles.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage also includes divine encouragement to disturb the treaty,
    so the covenant’s durability is not shown within this excerpt.
- id: motif:2
  label: sacrifice sealing a public pact
  taxonomy_refs:
  - sacrifice
  basis: Animals are brought to flaming altars, ritual preliminaries are performed,
    and consecrated victims are slaughtered as the treaty is confirmed.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage describes the rite but does not explain all ritual meanings.
- id: motif:3
  label: divine prompting to disrupt a treaty
  taxonomy_refs: []
  basis: Juno urges Juturna either to rescue Turnus from death or to stir war and
    shake the conceived treaty.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The actual disruption is urged but not carried out within the supplied
    passage.
- id: motif:4
  label: sister urged to save endangered brother
  taxonomy_refs:
  - sibling_pair
  basis: Juturna is identified as Turnus’ sister, and Juno tells her to act for her
    brother as hostile fate approaches.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage emphasizes sibling relation and attempted rescue, not a matched
    heroic twin pattern.
- id: motif:5
  label: fate overriding divine protection
  taxonomy_refs: []
  basis: Juno says she protected Turnus only while Fortune and the Parcae allowed,
    and that the day and hostile force of fate are near.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This is based on Juno’s speech; the passage does not present a separate
    narrator explanation of fate’s mechanics.
- id: motif:6
  label: royal and dynastic legitimacy in a foundation pact
  taxonomy_refs:
  - royal_legitimacy
  basis: Aeneas is called the origin of Roman stock, Ascanius another hope of Rome,
    Latinus retains formal command, and the future city is to bear Lavinia’s name.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage contains dynastic and foundation language, but it is embedded
    in treaty terms rather than a coronation or genealogy scene.
