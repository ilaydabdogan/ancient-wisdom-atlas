  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a signal, the warriors withdraw to assigned spaces, fix spears in the
    earth, and lean shields aside.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mothers, unarmed common people, and elderly men watch from towers, house roofs,
