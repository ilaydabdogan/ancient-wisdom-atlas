candidate_motifs:
- id: motif:1
  label: Exiled people depart from a destroyed homeland
  taxonomy_refs:
  - departure
  basis: The passage opens with Troy fallen, the Trojans driven by divine auguries
    to seek exile, prepare ships, and leave homeland, harbors, and fields.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The taxonomy label is broad; the passage presents a literal exile-voyage
    rather than a completed quest pattern.
- id: motif:2
  label: Failed settlement abandoned after ominous discovery
  taxonomy_refs:
  - departure
  basis: Aeneas starts walls in Thrace, but the bleeding mound and Polydorus' revelation
    lead the group to abandon the polluted land and return to sea.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  confidence: medium
  cautions: This is a local departure within a larger migration, not the initial departure
    from Troy.
- id: motif:3
  label: Dead person revealed through bleeding vegetation
  taxonomy_refs:
  - death_rebirth
  basis: Vegetation pulled from the mound bleeds, and the buried Polydorus speaks
    from beneath it, linking plant growth to his corpse and grave.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage shows death manifested through plants, but it does not narrate
    Polydorus' rebirth or return to life.
- id: motif:4
  label: Funeral rites restore proper burial after uncanny disclosure
  taxonomy_refs:
  - sacrifice
  basis: After the grave speaks, the Trojans rebuild Polydorus' funeral rites with
    altars, cypress, milk, blood, burial of the soul in the tomb, and final calls.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The rites include offerings but are specifically funerary; the taxonomy
    reference is approximate.
- id: motif:5
  label: Oracular guidance for wandering founders
  taxonomy_refs:
  - wisdom
  basis: Aeneas prays for a home and augury; Apollo's voice instructs the Trojans
    to seek the ancient mother and foretells rule by Aeneas' descendants.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The available taxonomy contains no specific oracle motif, so 'wisdom'
    is used only for divine guidance and knowledge.
- id: motif:6
  label: Return to ancestral mother land
  taxonomy_refs:
  - return
  basis: Apollo says the land that first bore the Dardanids from their ancestral stock
    will receive them back and commands them to seek the ancient mother; Anchises
    identifies this as Crete.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: Within the larger Aeneid narrative this interpretation will be revised,
    but this passage itself identifies Crete as the destination.
- id: motif:7
  label: Promised rule of founder's descendants
  taxonomy_refs:
  - royal_legitimacy
  basis: The oracle declares that the house of Aeneas, his descendants, and those
    born from them will rule all shores in the destined place.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The passage gives a dynastic prophecy but does not yet show its fulfillment.
