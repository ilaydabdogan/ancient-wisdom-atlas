canonical_text:
  quote: ''
  summary: Aeneas narrates the Trojans' departure from fallen Troy, their attempted
    settlement in Thrace, the bleeding myrtle that reveals Polydorus' murder and burial,
    the funeral rites for Polydorus, the voyage to Delos, Apollo's oracle commanding
    the Trojans to seek their ancient mother, and Anchises' interpretation that they
    should sail to Crete.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Troy has fallen, Aeneas and his companions are driven by divine auguries
    to seek exile and deserted lands, prepare a fleet near Antandros and Ida, and
    leave their homeland.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas comes to Thrace and begins founding first walls there, naming the settlement
    Aeneadae after himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While preparing sacrifices, Aeneas tries to pull green growth from a nearby
    mound covered with cornel shoots and dense myrtle stems.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Aeneas pulls up shoots from the mound, dark blood drips from the broken
    roots or bark and stains the earth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A groan and voice from within the mound tell Aeneas to stop tearing a buried
    man and identify the speaker as Polydorus.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The voice says the place is cruel and greedy and says Polydorus is covered
    by an iron crop of weapons that grew from sharp javelins.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Aeneas explains that Priam had secretly entrusted Polydorus and a large weight
    of gold to the Thracian king, who later killed Polydorus and seized the gold after
    Troy's fortunes failed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Trojans decide to leave the polluted hospitality of Thrace and depart
    by sea.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Trojans renew funeral rites for Polydorus by raising earth over the mound,
    setting altars to the Manes, using dark cypress and blue fillets, offering milk
    and blood in cups and bowls, and calling a final farewell.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the winds and sea are favorable, the Trojans launch ships, leave the
    shore, and sail away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Trojans arrive at Delos, an island sacred to the mother of the Nereids
    and Aegean Neptune, fixed by Apollo between Myconos and Gyaros.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: Anius, both king and priest of Phoebus, receives Aeneas and recognizes Anchises
    as an old friend.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: Aeneas prays in Apollo's old stone temple for a proper home, walls, a lasting
    city, guidance on where to go, and an augury.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: After Aeneas' prayer, thresholds, laurels, and the mountain seem to shake,
    and a voice is heard from the opened shrine.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: Apollo's oracle tells the Dardanids that the land which first bore them from
    their ancestors' stock will receive them back and commands them to seek the ancient
    mother.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:16
  text: The oracle says the house of Aeneas, his descendants, and their descendants
    will rule all shores in that place.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:17
  text: Anchises interprets the oracle by identifying Crete, with Mount Ida and ancestral
    beginnings, as the destination, and recalls Teucer coming from there to the Trojan
    region.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:18
  text: Anchises associates Crete with Cybele, Corybantic bronze, the Idaean grove,
    sacred silences, and lions joined to the goddess's chariot.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:19
  text: Anchises urges the Trojans to follow the gods' commands, placate the winds,
    and seek the Cretan kingdoms.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:20
  text: Anchises sacrifices bulls to Neptune and Apollo and black and white animals
    to Winter and favorable Zephyrs.
  category: action
  evidence_refs:
  - ev:18
