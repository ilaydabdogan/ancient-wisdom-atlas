canonical_text:
  quote: ''
  summary: Aeneas hears Turnus named, leaves the walls, and advances joyfully in arms,
    with mountain similes marking his scale. The armies pause to watch as Aeneas and
    Turnus engage in single combat. Their clash is compared to two bulls fighting
    for mastery. Jupiter weighs the two fates on balanced scales. Turnus strikes,
    but his borrowed mortal sword breaks against the Vulcanian divine armor; he flees
    while Teucrians encircle him and swamp and walls hem him in.
  language: Latin
  quote_policy: summarized
