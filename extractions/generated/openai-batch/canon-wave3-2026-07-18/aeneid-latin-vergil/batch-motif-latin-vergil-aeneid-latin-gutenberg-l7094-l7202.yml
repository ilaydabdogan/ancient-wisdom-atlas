canonical_text:
  quote: ''
  summary: A mounted enemy party under Volcens discovers Nisus and Euryalus at night
    when Euryalus' helmet shines. Euryalus is hindered in a dark forest by booty and
    captured, while Nisus escapes, returns, prays to Luna, kills two enemies with
    spears, then reveals himself when Volcens threatens Euryalus. Euryalus is killed;
    Nisus kills Volcens and dies on Euryalus' body. The narrator promises lasting
    poetic memory for both. At dawn the Rutuli display the heads of Euryalus and Nisus
    on spears before the grieving Aeneadae.
  language: Latin
  quote_policy: summarized
