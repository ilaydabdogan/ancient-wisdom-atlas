canonical_text:
  quote: ''
  summary: In the midst of war, Latin envoys return from Diomedes with his refusal
    to aid them against Aeneas. Diomedes recounts the sufferings of Greeks after the
    violation of Troy, including his own punishment after wounding Venus, and advises
    making peace with Aeneas. Latinus convenes a council, recognizes the danger of
    fighting a divinely favored people, and proposes offering land, ships, gifts,
    and an embassy to establish peace with the Trojans.
  language: Latin
  quote_policy: summarized
