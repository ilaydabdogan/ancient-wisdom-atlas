canonical_text:
  quote: ''
  summary: Aeneas reaches Cumae, approaches Apollo’s shrine and the cave of the Sibyl,
    views temple images connected with Daedalus and the Cretan labyrinth, prepares
    sacrifices, hears the Sibyl’s Apollo-inspired prophecy of future wars in Italy,
    and asks for access to the underworld to see his father, citing earlier figures
    who entered or returned from the realm of the dead.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas and the Trojan ships arrive at the Euboean shores of Cumae, anchor,
    and the youths go ashore to gather fire, wood, and locate streams.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas seeks the heights over which Apollo presides and the immense cave of
    the Sibyl, whose mind and spirit are inspired by the Delian god.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The temple setting contains images of Daedalus, his flight from Minoan lands,
    his dedication of wings to Phoebus, and the placing of great temples.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The temple doors depict Cretan and Athenian mythic scenes, including Androgeos’s
    death, the lot-urn, Pasiphae, the bull, the biform Minotaur, the labyrinthine
    house, and Daedalus guiding hidden tracks with a thread.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Daedalus twice attempts to portray Icarus’s fall in gold, but his paternal
    hands fail because of grief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Achates arrives with Deiphobe, daughter of Glaucus and priestess of Phoebus
    and Trivia, who tells Aeneas that the moment calls for sacrifice rather than viewing
    spectacles.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The priestess prescribes seven unyoked bullocks and seven chosen sheep, and
    calls the Trojans into the lofty temple.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sibyl’s cave is cut into a vast side of Euboean rock and is described
    as having one hundred approaches and one hundred mouths from which the Sibyl’s
    responses rush out.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the threshold, the Sibyl urges Aeneas to ask for the fates, announces the
    god’s presence, and undergoes a change of face, color, hair, breathing, and voice
    as divine power approaches.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aeneas prays to Phoebus, asks that the Trojans be allowed to settle in Latium,
    and vows a marble temple, festival days, and inner chambers for the Sibyl’s lots
    and fates.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Aeneas asks that the Sibyl not entrust her songs to leaves that can be confused
    by winds, but sing them herself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Sibyl, not yet yielding to Phoebus, raves in the cave while Apollo presses,
    tames, and shapes her until the hundred doors open of themselves and carry her
    responses through the air.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The oracle says the Trojans will reach Lavinian realms but will not wish to
    have come, because land wars, a blood-foaming Tiber, a Latian Achilles, Juno’s
    opposition, a foreign bride, and foreign marriage await them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The oracle tells Aeneas not to yield to evils, but to go more boldly where
    Fortune permits; it says the first path of safety will open from a Greek city.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the Sibyl’s fury subsides, Aeneas asks her to teach the way and open
    the sacred doors so he may go to the sight and face of his dear father through
    the gate of the infernal king and the dark Acherontic marsh.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Aeneas recalls carrying his father on his shoulders through flames and weapons,
    and says his father instructed him to come as a suppliant to the Sibyl’s threshold.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Aeneas cites Orpheus, Pollux, Theseus, and Alcides as precedents connected
    with contact with the dead, exchange of death, repeated going and returning, or
    heroic descent.
  category: speech
  evidence_refs:
  - ev:11
