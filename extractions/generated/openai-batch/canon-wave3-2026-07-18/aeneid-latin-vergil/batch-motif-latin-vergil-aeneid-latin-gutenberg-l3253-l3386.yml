canonical_text:
  quote: ''
  summary: Aeneas' fleet leaves Carthage, sees Elissa's walls burning, is driven by
    storm toward Sicily, and is welcomed by Acestes. On the anniversary of Anchises'
    burial, Aeneas leads offerings at his father's tomb, where a great serpent appears
    and consumes offerings before returning harmlessly into the tomb. Aeneas renews
    sacrifices and funeral honors, then opens commemorative games beginning with a
    ship race.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas' fleet is in mid-sea, looking back at Elissa's walls shining with flames;
    the cause of the fire is hidden, but the Trojans take it as a grim omen connected
    with a woman's fury in love.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Storm clouds, rain, darkness, and rough water surround the fleet; Palinurus
    speaks from the stern, addresses Neptune, and orders the crew to manage sails
    and oars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Palinurus says the fleet cannot reach Italy under that sky and advises following
    Fortune toward Eryx and Sicilian harbors; Aeneas orders the course turned to the
    land of Acestes and the resting place of Anchises' bones.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Favorable west winds carry the fleet to familiar Sicilian sands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Acestes sees the allied ships from a high mountain, meets them, is described
    with javelins and a Libyan bearskin, and welcomes the weary arrivals with local
    supplies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aeneas summons the Trojans by the shore and tomb, marks the completed yearly
    cycle since Anchises' burial, calls for annual honors, prayers for winds, a feast
    with the Penates, and games with prizes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Aeneas, Elymus, Acestes, Ascanius, and the youth wreath their brows with myrtle
    or branches and proceed to the tomb.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the tomb Aeneas pours paired libations of wine, new milk, and sacred blood,
    scatters purple flowers, and addresses Anchises' ashes, paternal shades, and spirit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A huge slippery snake emerges from the inner shrine or tomb, makes seven coils,
    encircles the tomb and altars, gleams with blue, gold, and rainbow-like colors,
    consumes offerings, and returns harmlessly into the tomb.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aeneas is uncertain whether the serpent is the genius of the place or a servant
    of his father; he renews honors with sacrifices of ewes, swine, and black bullocks,
    pours wine, and calls the soul of Anchises and the Manes released from Acheron.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The companions bring gifts, load altars, sacrifice calves, set out bronze
    vessels, and roast entrails over coals while lying on the grass.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the ninth dawn crowds gather for the games; prizes including tripods, wreaths,
