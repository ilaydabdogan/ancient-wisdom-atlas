  text: Jupiter plans to dismiss Juturna from her brother’s arms and sends one of
    the Dirae from high heaven to meet her as an omen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dirae are described as twin destructive beings, born with Tartarean Megaera
