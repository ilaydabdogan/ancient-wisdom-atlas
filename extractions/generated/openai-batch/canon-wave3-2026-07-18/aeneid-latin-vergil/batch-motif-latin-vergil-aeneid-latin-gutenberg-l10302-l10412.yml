canonical_text:
  quote: ''
  summary: Jupiter sends a Dira from heaven as an omen to remove Juturna from helping
    her brother Turnus. The Dira takes the form of a nocturnal bird, terrifies Turnus,
    and Juturna recognizes Jupiter’s command, laments her immortality, and hides in
    a deep river. Aeneas challenges Turnus; Turnus tries to hurl a huge boundary stone
    but is divinely disabled. Aeneas wounds him with a spear. Turnus supplicates and
    asks that he or his body be returned to his people, but Aeneas sees Pallas’ belt
    on Turnus, becomes enraged, and kills him; Turnus’ life flees to the shades.
  language: Latin
  quote_policy: summarized
