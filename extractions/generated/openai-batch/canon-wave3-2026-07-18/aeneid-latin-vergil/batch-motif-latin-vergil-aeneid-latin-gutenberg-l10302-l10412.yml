  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sent Dira flies to earth like a poisoned arrow and assumes the form of
    a small nocturnal bird associated with tombs and deserted roofs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bird-formed Dira moves before Turnus’ face, beats his shield with its
    wings, and Turnus is seized by fear, with hair standing and voice caught.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Juturna recognizes the Dira’s screech and wings, tears her loosened hair,
    scratches her face, and beats her breast.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Juturna says she cannot oppose the monster, recognizes Jupiter’s commands,
    and laments that immortality prevents her from dying with Turnus.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: After speaking, Juturna covers her head with a gray mantle and hides herself
    in a deep river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Aeneas advances, brandishes a huge wooden weapon, and challenges Turnus to
    fight at close quarters rather than by running.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Turnus replies that Aeneas’ fierce words do not terrify him; the gods and
    hostile Jupiter terrify him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Turnus tries to hurl an enormous ancient boundary stone, but his knees fail
    and his blood freezes; the passage compares this failure to helplessness in a
    dream.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Dira denies success to Turnus’ efforts, and Turnus hesitates, seeing no
    escape, no way to strike Aeneas, and no chariot or sister nearby.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Aeneas hurls a fatal spear that pierces Turnus through the thigh, causing
