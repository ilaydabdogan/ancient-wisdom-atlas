canonical_text:
  quote: ''
  summary: Jupiter notices Aeneas delayed in Carthage and sends Mercury to command
    him to sail toward his destined Italian and Roman future. Mercury equips his winged
    sandals and wand, passes by Atlas, descends to Carthage, rebukes Aeneas, and vanishes.
    Aeneas is terrified and orders companions to prepare the fleet secretly. Dido
    senses the deceit through Rumor, rages through the city, and confronts Aeneas
    with accusations, pleas, and laments about her endangered reputation, rule, and
    lack of a child from him.
  language: Latin
  quote_policy: summarized
