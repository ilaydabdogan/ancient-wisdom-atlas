canonical_text:
  quote: 'Vos ite solutae, ite deae pelagi: genetrix iubet.'
  summary: Juno sends Iris to urge Turnus to attack while Aeneas is away. Turnus advances
    on the Trojan camp, whose defenders remain behind walls according to Aeneas’s
    order. Turnus attacks the Trojan fleet with fire. The narrator recalls how the
    Mother of the Gods had given Idaean pines for Aeneas’s ships and asked Jupiter
    to protect them; Jupiter promised that surviving ships would become sea goddesses.
    At the attempted burning, a divine voice orders the sacred ships to depart, and
    they break free, dive, and appear as sea goddesses.
  language: Latin
  quote_policy: quoted
