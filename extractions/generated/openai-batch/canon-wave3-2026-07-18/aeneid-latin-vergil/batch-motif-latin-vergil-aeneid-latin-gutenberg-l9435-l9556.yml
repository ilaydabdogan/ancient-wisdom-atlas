canonical_text:
  quote: ''
  summary: At the opening of Aeneid Book XII, Turnus sees the Latins failing and demands
    that Latinus establish a sacred treaty for single combat with Aeneas. Latinus
    counsels him against it, citing divine warnings about Lavinia's marriage and the
    ruin caused by war. Turnus refuses, Amata pleads with him, Lavinia weeps and blushes,
    and Turnus sends terms that the armies stand aside while he and Aeneas settle
    the war and Lavinia's marriage by their blood. Turnus arms himself with horses,
    armor, a divine-made sword, and Actor's spear. Aeneas, in his mother's arms, prepares
    and sends peace terms to Latinus.
  language: Latin
  quote_policy: summarized
