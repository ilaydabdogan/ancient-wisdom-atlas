- id: ev:13
  type: summary
  locator: 4921-4927
  quote_or_summary: Anchises says he has long wanted to show and enumerate his descendants;
    Aeneas asks whether souls should be thought to go upward to heaven and return
    again to slow bodies.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 4928-4933
  quote_or_summary: 'Anchises begins his ordered explanation: spirit nourishes heaven,
    earth, liquid plains, moon, and stars; mind, infused through the limbs, moves
    the mass and mingles with the great body.'
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 4934-4941
  quote_or_summary: From this source come humans, animals, birds, and sea creatures;
    their seeds have fiery vigor and heavenly origin insofar as harmful bodies, earthly
    limbs, and mortal members do not dull them.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 4942-4953
  quote_or_summary: Because souls are enclosed in dark bodily prison, evils do not
    all depart at death; souls undergo punishments for old evils, with some exposed
    to winds, some washed under a vast flood, and some burned by fire.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 4954-4959
  quote_or_summary: Each suffers its own Manes; then souls are sent through broad
    Elysium, and a few hold the joyful fields until the cycle of time removes hardened
    stain and leaves pure aetherial sense and simple fire.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: 4960-4965
  quote_or_summary: After souls have turned the wheel through a thousand years, a
    god summons them in a great column to the Lethean river so that, forgetful, they
    may revisit the upper vault and begin to wish to return into bodies.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: 4966-4971
  quote_or_summary: After speaking, Anchises draws his son and the Sibyl into the
    midst of the assembly and sounding crowd, then takes a mound from which he can
    inspect all the approaching souls in long order and learn their faces.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
