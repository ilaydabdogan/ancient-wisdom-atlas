canonical_text:
  quote: ''
  summary: Aeneas and the Sibyl enter the blessed groves and Elysian fields, ask blessed
    souls for Anchises, are directed by Musaeus, and meet Anchises. Aeneas tries and
    fails to embrace his father's shade. Anchises then shows Aeneas souls by the river
    Lethe and explains cosmic spirit, bodily impurity, post-mortem purgation, Elysium,
    drinking forgetfulness, and eventual return to bodies.
  language: Latin
  quote_policy: summarized
