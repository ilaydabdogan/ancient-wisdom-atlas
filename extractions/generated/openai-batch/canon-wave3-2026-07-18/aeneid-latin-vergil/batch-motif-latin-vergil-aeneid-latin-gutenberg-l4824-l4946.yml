    of his descendants.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Anchises greets Aeneas with outstretched hands and tears, praising his son’s
    pietas for overcoming the difficult journey.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Aeneas says his father's sorrowful image repeatedly drove him to these thresholds,
    asks to join right hands, and asks that his father not withdraw from an embrace.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Aeneas three times tries to put his arms around Anchises' neck; three times
    the grasped shade escapes his hands.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Aeneas sees a secluded grove, sounding thickets, and the Lethean river flowing
    before peaceful dwellings.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: Innumerable peoples fly around the Lethean river like bees in a summer meadow
    among varied flowers and lilies.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Anchises says that souls owed other bodies by fate drink secure waters and
    long forgetfulness at the wave of Lethe.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: Aeneas asks whether any souls go upward from there to heaven and return again
    to slow bodies.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: Anchises states that spirit nourishes sky, earth, sea, moon, and stars, and
    that mind moves and mingles with the vast body of the world.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:17
  text: Anchises states that living beings derive from this cosmic source but are
    weighed down by harmful bodies, earthly limbs, and mortal members.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:18
  text: 'Anchises describes souls after death undergoing punishments for old evils:
    some are exposed to winds, some have pollution washed under a vast flood, and
    some are burned by fire.'
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:19
  text: Anchises says that after purgation souls are sent through broad Elysium, and
    a few hold the joyful fields until time removes stain and leaves pure aetherial
    sense and simple fire.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:20
  text: Anchises says that after a thousand years a god summons souls in a great column
    to Lethe so that, forgetful, they may revisit the upper world and begin to wish
    to return into bodies.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:21
  text: After speaking, Anchises draws Aeneas and the Sibyl into the sounding crowd
