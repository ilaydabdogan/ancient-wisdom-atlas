- id: obs:2
  text: Turnus remains confident and tells the Rutuli that the prodigies threaten
    the Trojans, that Jupiter has removed customary aid from them, and that they have
    no sea escape.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Turnus says the Trojans have already received enough from fate and Venus by
    reaching Ausonian fields, and he claims counter-fates for himself to destroy the
    guilty people by the sword after his spouse was taken.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Turnus compares his grievance to that of the Atridae and Mycenae, then contrasts
    his intended daylight fire attack with clandestine Greek stratagems such as the
    theft of the Palladium and concealment in a horse.
