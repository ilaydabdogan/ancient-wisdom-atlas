canonical_text:
  quote: ''
  summary: The Rutuli react fearfully to a prodigy, but Turnus encourages them, dismisses
    Trojan hopes and divine responses, and calls for an open assault by fire. Messapus
    is assigned to blockade the gates while Rutulian watches pass the night with fires,
    wine, and sleep. The Trojans guard the ramparts under Mnestheus and Serestus.
    Nisus and Euryalus, bound by close affection and stationed at the gate, decide
    to leave the post on a dangerous mission to seek Aeneas; Euryalus insists on accompanying
    Nisus despite warnings about death, burial, and his grieving mother.
  language: Latin
  quote_policy: summarized
