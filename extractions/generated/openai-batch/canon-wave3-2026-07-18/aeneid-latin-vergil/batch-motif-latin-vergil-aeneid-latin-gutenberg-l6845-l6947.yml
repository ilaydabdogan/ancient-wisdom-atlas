candidate_motifs:
- id: motif:1
  label: companion-pair departure on a dangerous night mission
  taxonomy_refs:
  - departure
  basis: Nisus proposes leaving the guarded gate to reach Aeneas, and Euryalus insists
    on accompanying him into danger; the pair wake replacements and depart together.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage begins the mission but does not yet narrate its outcome.
- id: motif:2
  label: single-hearted warrior companions
  taxonomy_refs: []
  basis: The passage explicitly says Nisus and Euryalus share one love, rush into
    battles together, and hold the same station.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: They are companions rather than siblings; no sibling-pair taxonomy is
    applied.
- id: motif:3
  label: stolen beloved as cause for armed revenge
  taxonomy_refs:
  - stolen_beloved
  basis: Turnus says he has his own fates to destroy the guilty people by the sword
    because his spouse was taken, and he links this grief to the Atridae and Mycenae
    taking arms.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: This is Turnus's rhetorical framing within the speech, not an external
    narrator's legal judgment.
- id: motif:4
  label: fire encirclement of besieged walls
  taxonomy_refs: []
  basis: Turnus announces an open daylight plan to surround the walls with fire, and
    Messapus is assigned to encircle the walls with flames.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage records the plan and preparations, not the completed destruction
    of the walls.
- id: motif:5
  label: sacred theft and concealed-horse stratagem as rejected precedents
  taxonomy_refs:
  - sacred_theft
  basis: Turnus explicitly contrasts his intended open assault with the theft of the
    Palladium and concealment inside the horse.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: These stratagems are referenced as rejected comparisons, not enacted in
    the present scene.
- id: motif:6
  label: vulnerable enemy camp through wine and sleep
  taxonomy_refs: []
  basis: Rutulian guards are described as drinking wine and lying on the grass, and
    Nisus later identifies their wine and sleep as the opening for action.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage only establishes the vulnerability and proposed exploitation.
- id: motif:7
  label: anticipated funeral rites before perilous action
  taxonomy_refs: []
  basis: Nisus asks that if disaster strikes, someone should bury him or perform offerings
    at a tomb, and he worries about causing grief to Euryalus's mother.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The request is hypothetical within Nisus's warning.
comparison_claims:
- id: claim:1
  claim: Turnus explicitly aligns his grievance over a taken spouse with the Greek
    Atridae/Mycenae grievance that led to taking arms, supporting a cautious comparison
    to a Trojan War abducted-beloved war-cause pattern.
  claim_level: same_motif
  target: Trojan War tradition of armed conflict over a taken spouse or beloved
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is voiced by Turnus as rhetoric; the passage does not
    independently adjudicate the analogy.
- id: claim:2
  claim: Turnus compares his planned open fire assault with, and rejects, clandestine
    Greek stratagems involving the Palladium and the horse, supporting comparison
    to Trojan War siege-stratagem traditions.
  claim_level: same_function
  target: Trojan War traditions of Palladium theft and Trojan horse stratagem
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The present action is contrasted with those stratagems rather than
    repeating them directly.
- id: claim:3
  claim: Turnus compares the coming fight against the Trojans with the earlier Greek
    war delayed by Hector for ten years, invoking the nearby Trojan War epic tradition
    as a frame for the siege.
  claim_level: same_motif
  target: Trojan War long-siege pattern involving Danaans/Pelasgi and Hector
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is an explicit rhetorical allusion, but the passage has not
    yet shown an equivalent ten-year siege in the present conflict.
