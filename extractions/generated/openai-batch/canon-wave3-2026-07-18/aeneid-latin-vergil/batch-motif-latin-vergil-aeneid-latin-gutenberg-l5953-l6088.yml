- id: obs:3
  text: Aeneas, troubled by the coming war, lies down at night on the riverbank and
    falls asleep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tiberinus, the god of the place, appears to Aeneas as an elderly river figure
    among poplar leaves, wearing a greenish garment and reeds in his hair.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tiberinus tells Aeneas that a settled home and household gods are assured
    for him in the Laurentian land, and that divine anger has subsided.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Tiberinus announces a sign: a large white sow with thirty white offspring
    will be found under riverside trees, and this sign marks the place of a city and
    the future foundation of Alba by Ascanius after thirty years.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tiberinus instructs Aeneas to join the Arcadians of Evander as allies, promises
    to guide him upstream, and commands prayers to Juno and honors to Tiberinus after
    victory.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After waking, Aeneas lifts river water in his cupped hands, prays to Laurentian
    nymphs and Tiber, promises honors and gifts, and prepares two biremes with armed
    companions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A white sow with a matching white litter appears on the green bank; Aeneas
    sacrifices it and its young to Juno at an altar.
  category: action
  evidence_refs:
