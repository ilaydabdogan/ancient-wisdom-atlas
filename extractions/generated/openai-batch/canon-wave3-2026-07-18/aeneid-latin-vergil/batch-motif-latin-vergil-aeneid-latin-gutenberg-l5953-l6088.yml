canonical_text:
  quote: ''
  summary: At the opening of Book VIII, Turnus raises the signal for war and Latium
    mobilizes against Aeneas. Troubled at night beside the Tiber, Aeneas sleeps and
    receives an appearance of the river god Tiberinus, who promises a fixed home,
    gives the omen of a white sow with thirty white young, foretells Ascanius’ foundation
    of Alba, and directs Aeneas to seek alliance with Evander’s Arcadians. Aeneas
    prays to river powers, prepares ships, finds and sacrifices the sow to Juno, and
    travels upstream on a calmed river. He arrives near Evander’s settlement during
    rites to Hercules; Pallas challenges the strangers, Aeneas extends an olive branch,
    asks for alliance, and is received as a guest.
  language: Latin
  quote_policy: summarized
