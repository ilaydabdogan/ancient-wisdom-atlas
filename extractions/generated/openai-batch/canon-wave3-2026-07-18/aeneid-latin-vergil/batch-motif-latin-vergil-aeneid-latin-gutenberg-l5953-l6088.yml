  evidence_refs:
  - ev:1
- id: obs:2
  text: Venulus is sent to Diomedes’ city to seek aid and report that the Trojans
    have settled in Latium under Aeneas, who claims to be called by fate to kingship.
  category: action
  evidence_refs:
