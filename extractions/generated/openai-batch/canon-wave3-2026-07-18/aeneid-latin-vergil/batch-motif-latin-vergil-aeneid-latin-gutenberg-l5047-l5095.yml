canonical_text:
  quote: Sunt geminae Somni portae
  summary: Anchises shows Aeneas figures of Roman future greatness and grief, mourns
    a fated young Marcellus with proposed floral offerings, guides Aeneas through
    future wars and labors, and finally sends Aeneas and the Sibyl out through the
    ivory gate of Sleep toward the ships and Caieta's harbor.
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Anchises points out Marcellus as distinguished by rich spoils, entering as
    victor and surpassing all men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anchises says this Marcellus will steady the Roman state during turmoil, defeat
    Punic and rebellious Gallic enemies, and hang a third set of captured arms for
    Quirinus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aeneas sees a beautiful young man with shining arms accompanying the other
    figure; the youth has an insufficiently joyful brow, downcast eyes, and a dark
    night or sad shadow around his head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aeneas asks Anchises who the accompanying figure is, whether he is a son or
    descendant, and remarks on the surrounding crowd, the youth's greatness, and the
    dark shadow over him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Anchises begins to answer with tears and tells his son not to ask about a
    great grief of his people; he says the fates will show the youth to the earth
    only briefly.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Anchises describes future lamentation, funeral rites, a recent tomb, the youth's
    piety, old-fashioned faith, and invincible battle-hand.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Anchises names the youth Marcellus and asks for lilies and purple flowers
    to heap gifts upon the descendant's soul and perform an empty rite.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The group wanders widely through broad fields of air and surveys everything.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Anchises leads his son through each thing, kindles love of coming fame in
    him, and teaches him future wars, peoples, and how to avoid or bear each labor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Two gates of Sleep are described: one of horn, through which true shades
    are given easy exit; the other gleaming and made of white ivory, through which
    the Manes send false dreams upward.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: After speaking, Anchises escorts his son and the Sibyl and sends them out
    through the ivory gate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Aeneas cuts his way to the ships, revisits his companions, proceeds along
