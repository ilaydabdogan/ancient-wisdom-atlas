canonical_text:
  quote: ''
  summary: Aeneas carries out the Sibyl's instructions at a dark cave by a black lake,
    making chthonic sacrifices and invoking underworld powers. At signs of divine
    arrival, the Sibyl commands the profane to leave and leads Aeneas into the cave.
    They travel through the dim entrance of Orcus, past personified evils, dreams,
    and monstrous shades, then reach the waters of Acheron, Cocytus, and the Stygian
    marsh. Charon ferries some dead but refuses the unburied, whom the Sibyl says
    must wander for one hundred years until their bones rest. Aeneas pities this fate
    and sees Leucaspis and Orontes, drowned in a shipwreck.
  language: Latin
  quote_policy: summarized
