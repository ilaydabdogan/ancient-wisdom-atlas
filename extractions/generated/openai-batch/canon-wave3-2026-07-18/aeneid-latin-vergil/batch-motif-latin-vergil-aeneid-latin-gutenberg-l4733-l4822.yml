canonical_text:
  quote: ''
  summary: 'Aeneas, guided by Apollo''s aged priestess, views the boundary and punishments
    of Tartarus: fiery Phlegethon, adamantine gates, Tisiphone, Rhadamanthus, Hydra,
    Titans, mythic offenders, and categories of sinners. The priestess then urges
    Aeneas onward to the appointed gate, where he purifies himself with fresh water
    and fixes a branch on the threshold.'
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas looks back and sees broad walls under a left-hand cliff, surrounded
    by a triple wall and encircled by the fiery river Phlegethon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The place has a huge opposing gate with adamantine columns, an iron tower,
    and Tisiphone sitting sleepless at the vestibule in a bloody garment.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aeneas hears groans, savage blows, the screech of iron, and dragging chains,
    and he stops in fear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Aeneas asks the priestess what forms of crimes are there, what punishments
    press on them, and why such lamentation rises.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priestess says no pure person may set foot on the criminal threshold,
    but Hecate placed her over the Avernian groves and taught her the punishments
    of the gods.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rhadamanthus holds hard rule there, punishes and hears deceit, and forces
    confession of crimes delayed until death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tisiphone lashes the guilty with a whip, threatens them with snakes in her
    left hand, and calls the savage bands of her sisters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sacred gates open with a terrible sound, and a Hydra with fifty black
    gaping mouths has its seat within.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tartarus extends downward into shadow twice as far as the gaze upward to Olympian
    heaven.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ancient offspring of Earth, the Titan race, are rolled in the lowest depth
    after being cast down by lightning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The priestess says she saw the twin Aloidae, who attempted to tear down heaven
    and dislodge Jupiter from his kingdom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The priestess says she saw Salmoneus being punished after imitating Jupiter's
    flames and Olympian thunder while demanding divine honor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Jupiter hurls a thunderbolt among clouds and drives Salmoneus headlong in
    a great whirlwind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Tityos lies stretched over nine acres while a huge vulture tears at his immortal
    liver and renewed entrails without rest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A black rock hangs as if about to fall over certain figures, while rich couches
    and food are present and a Fury prevents them from touching the tables.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: The priestess lists condemned people who hated brothers, struck a parent,
    defrauded a client, hoarded wealth from kin, were killed for adultery, followed
    impious arms, or betrayed masters.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Some roll a huge stone; some hang stretched on wheel-spokes; Theseus sits
    forever; Phlegyas loudly warns the shades to learn justice and not scorn the gods.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Further crimes include selling the fatherland for gold, imposing a powerful
    master, making and unmaking laws for a price, and entering a daughter's forbidden
    marriage chamber.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:19
  text: The priestess says that even with a hundred tongues, a hundred mouths, and
    an iron voice, she could not encompass all forms of crimes or names of punishments.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:20
  text: The priestess urges Aeneas to continue the task, points out Cyclopean-built
    walls and gates where prescribed gifts must be deposited, and the pair approaches
    through dark ways.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:21
  text: Aeneas takes the entrance, sprinkles his body with fresh water, and fixes
    a branch on the facing threshold.
  category: action
  evidence_refs:
  - ev:12
