- id: motif:3
  label: postmortem judgment and confession of hidden crimes
  taxonomy_refs:
  - divine_judgment
  basis: Rhadamanthus punishes, hears deceits, and forces confession of crimes deferred
    until death; Phlegyas' warning links punishment to justice and reverence for gods.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: The passage emphasizes punishment and confession more than a full trial
    procedure.
- id: motif:4
  label: ritual threshold preparation before proceeding
  taxonomy_refs:
  - initiation
  basis: The guide says pure persons may not step on the criminal threshold, directs
    Aeneas to complete his task, and Aeneas sprinkles himself with fresh water and
    fixes a branch at the threshold.
  evidence_refs:
  - ev:2
  - ev:12
  confidence: medium
  cautions: The passage contains threshold rites, but it does not explicitly name
    them as initiation.
