canonical_text:
  quote: Rutuli somno vinoque soluti conticuere
  summary: At night, while living creatures sleep, Trojan leaders deliberate. Nisus
    and Euryalus request permission to undertake a mission to reach Aeneas. Nisus
    reports that the Rutuli are asleep from wine and that the route is known. Aletes
    praises the youths. Ascanius invokes household divinities, asks them to restore
    his father, and promises rich rewards. Euryalus asks that his mother be cared
    for if he goes into danger. Ascanius swears to honor this request. The youths
    are armed and depart with prayers, while Iulus' messages to his father are dispersed
    by winds and clouds.
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: While other animals sleep, the Trojan leaders and selected youth deliberate
    about the affairs of the realm and who might be sent as a messenger to Aeneas.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nisus and Euryalus ask to be admitted at once and say the matter is important
    and worth delay; Iulus receives them and orders Nisus to speak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nisus reports that the Rutuli are silent, overcome by sleep and wine; he says
    he has seen a place for ambush near the fork by the gate closest to the sea, with
    broken fires and black smoke rising.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nisus proposes using fortune to seek Aeneas and the Pallantean walls, and
    says the pair know the route and the river.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aletes, described as heavy with years and mature in spirit, praises the youths,
    grasps both by shoulders and right hands, and wets their faces with tears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ascanius invokes the Penates, Assaracus' Lar, and Vesta's sanctuary, places
    his fortune and good faith in the youths, asks them to restore his father to sight,
    and promises rewards.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ascanius promises Nisus treasures and spoils, including cups, tripods, gold,
    Dido's crater, Turnus' horse and arms, captives, weapons, and Latinus' field.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ascanius addresses Euryalus as a revered youth close to his own age and embraces
    him as a companion in every fortune, promising trust in war and peace.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Euryalus says no day will show him unlike such bold undertakings, whether
    fortune is favorable or adverse, and asks above all that his mother be comforted
    and aided.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Euryalus says his mother came with him from Priam's old lineage, that she
    has not been held back by Troy or Acestes' walls, and that he leaves her unaware
    of the danger and without farewell.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Dardanidae weep, and Iulus is especially moved by the image of filial
    piety.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Iulus swears by his own head, as his father once used to do, that the promises
    made to Euryalus will remain also for his mother and family.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Iulus removes a golden sword made by Lycaon of Cnossos with an ivory scabbard;
    Mnestheus gives Nisus a lion skin; Aletes exchanges a helmet.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The armed pair proceed, accompanied to the gates by the leading men, youths,
