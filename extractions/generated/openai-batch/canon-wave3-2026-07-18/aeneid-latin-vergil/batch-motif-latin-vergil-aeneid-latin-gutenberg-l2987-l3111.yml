canonical_text:
  quote: ''
  summary: Dido is terrified by omens and resolves on death. She hides her plan from
    Anna by describing a magical rite involving a Massylian priestess, Atlas, the
    Hesperides, a dragon, and sacred branches. Anna prepares a pyre with Aeneas’ belongings
    and the marriage bed. Dido and the priestess perform rites with chthonic invocations,
    Avernian water, poisonous herbs, and other ritual items. At night Dido cannot
    sleep and debates her remaining options before urging herself toward death by
    the sword. Aeneas sleeps aboard ship until a god-form like Mercury warns him in
    a dream to flee before Dido’s destructive plans unfold.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dido, described as unhappy and frightened by fate, asks for death and is weary
    of looking at the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While placing offerings on incense-burning altars, Dido sees sacred liquids
    darken and poured wine change into blood; she tells no one, not even her sister.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A marble shrine of Dido’s former husband is honored with white fleeces and
    festive foliage; at night she seems to hear his voice calling from it.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: An owl on the roof repeatedly gives a funeral-like cry, and earlier prophetic
    sayings terrify Dido with warnings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In dreams, fierce Aeneas drives Dido; she repeatedly seems abandoned, going
    a long road without companions and seeking the Tyrians in a deserted land.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dido’s derangement is compared to Pentheus seeing Eumenid bands, a double
    sun, and doubled Thebes, and to Orestes fleeing an armed mother with torches and
    black serpents while avenging Dirae sit on the threshold.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: After deciding to die, Dido addresses Anna with a calm-looking face and says
    she has found a way either to return Aeneas to her or release her from love for
    him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dido describes a Massylian priestess near the far Aethiopians and Atlas, keeper
    of the Hesperides’ temple, who feeds a dragon and guards sacred branches on a
    tree with honey and soporific poppy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The priestess claims through songs to free minds, impose cares, stop river
    water, turn stars backward, stir nocturnal shades, make the earth roar, and draw
    ash trees down from mountains.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Dido tells Anna to build a secret pyre inside the palace and place on it Aeneas’
    arms, all his relics, and the marriage bed, saying the priestess instructs that
    these reminders be destroyed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Anna prepares the requested things, not believing that her sister is concealing
    funeral plans under new rites.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The queen has a huge pyre erected with torches and cut oak, crowns the place
    with garlands and funeral foliage, and places Aeneas’ relics, sword, and an effigy
    on the couch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A priestess with loosened hair invokes three hundred gods, Erebus, Chaos,
    triple Hecate, and the three faces of Diana.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The rite includes simulated water from Avernus, herbs cut by bronze sickles
    under the moon, black poisonous milk, and a charm taken from the forehead of a
    newborn foal and from its mother.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Dido stands by the altars with meal in pious hands, one foot unbound, clothing
    loosened, and invokes the gods, the fate-aware stars, and any just power that
    cares for unequally bound lovers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Night brings sleep and quiet to bodies, woods, seas, fields, animals, birds,
    lakes, and rough countryside, but Dido does not sleep and is stirred again by
    love and anger.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: Dido debates whether to seek former suitors, follow the Trojan ships, accompany
    sailors alone, take the Tyrians back to sea, or die by the sword; she laments
    her broken faith to Sychaeus’ ashes.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Aeneas sleeps on the high stern of his ship, already resolved to go and with
    preparations duly made.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: A god-form, appearing in sleep and resembling Mercury in voice, color, yellow
    hair, and youthful body, warns Aeneas of dangers, Dido’s deadly plans, favorable
    winds, and coming fires if dawn finds him lingering.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:20
  text: After urging Aeneas to break delay, the god-form disappears into the dark
    night.
  category: sequence
  evidence_refs:
  - ev:10
