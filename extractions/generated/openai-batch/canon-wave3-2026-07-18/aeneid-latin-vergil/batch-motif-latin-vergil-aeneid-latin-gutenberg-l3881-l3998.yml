canonical_text:
  quote: ''
  summary: Juno sends Iris from heaven to the Trojan fleet. Iris, taking the form
    of Beroe, urges the weary Trojan women to burn the ships and settle in Sicily.
    Pyrgo recognizes signs of divinity; Iris flies away, and the women, driven by
    frenzy, set fire to the fleet. Ascanius and Aeneas arrive, and the women repent.
    Aeneas prays to Jupiter, after which a violent rainstorm quenches the flames,
    though four ships are lost. Nautes advises Aeneas to leave the old, weary, and
    fearful in Sicily with Acestes and continue toward Italy.
  language: Latin
  quote_policy: summarized
