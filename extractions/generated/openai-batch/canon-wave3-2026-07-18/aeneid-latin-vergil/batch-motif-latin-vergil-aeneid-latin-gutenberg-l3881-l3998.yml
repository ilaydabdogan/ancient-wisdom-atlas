- id: ev:12
  type: summary
  locator: 3974-3985
  quote_or_summary: The fires continue despite heroic strength and poured water; Aeneas
    tears his garment, calls on the gods, raises his palms, and prays to omnipotent
    Jupiter to save the fleet or strike him down if deserved.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source text.
