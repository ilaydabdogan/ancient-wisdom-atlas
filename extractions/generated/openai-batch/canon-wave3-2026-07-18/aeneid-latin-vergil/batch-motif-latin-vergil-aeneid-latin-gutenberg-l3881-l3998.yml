  quote_or_summary: After the prayer, a black storm with heavy rain and thunder comes;
    the ships fill with water, half-burned wood is soaked, all smoke is extinguished,
    and all ships except four are saved.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source text.
