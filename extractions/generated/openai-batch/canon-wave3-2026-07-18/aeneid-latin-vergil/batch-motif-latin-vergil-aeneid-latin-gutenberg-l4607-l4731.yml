canonical_text:
  quote: Hic locus est, partes ubi se via findit in ambas
  summary: 'Aeneas continues through regions of the underworld: infant souls, the
    falsely condemned, suicides, the Mourning Fields of those consumed by love, the
    ghost of Dido, warrior dead, and the mutilated Deiphobus. The Sibyl then identifies
    a forked road, with the right path toward Elysium and the left toward punishments
    in Tartarus.'
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Infant souls weep at the first threshold, and nearby are those condemned to
    death on false charges.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Minos acts as investigator and judge among the silent dead, moving an urn,
    summoning an assembly, and learning lives and crimes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who caused their own innocent deaths occupy nearby sad places; they
    wish they could endure life again, but a hateful marsh and the ninefold Styx restrain
    them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Mourning Fields contain those whom harsh love consumed; hidden paths and
    a myrtle wood conceal them, and their cares remain after death.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the dead of love, Aeneas sees Dido wandering in a great wood and recognizes
    her through the shadows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aeneas weeps and addresses Dido, saying he heard she died by the sword, asking
    whether he caused her death, swearing he left her shore unwillingly, and saying
    divine commands compelled him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dido keeps her eyes fixed on the ground, remains unmoved by Aeneas's speech,
    retreats hostile into a shady grove, and returns to Sychaeus, who answers her
    cares and equals her love.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Aeneas enters the outer fields frequented by those famous in war, sees named
    Greek and Trojan dead, and the Greek leaders and ranks react fearfully at the
    sight of him and his shining arms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Aeneas sees Deiphobus mutilated over his body, face, hands, temples, ears,
    and nose; he asks who inflicted such punishments and says he made an empty tomb
    and called on the Manes three times.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Deiphobus attributes his suffering to his fate and the destructive crime of
    the Laconian woman, recalling the final night when the fatal horse brought armed
    men into Troy.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Deiphobus says the Laconian woman feigned ritual activity, held a great flame,
    called the Danaans from the citadel, removed his weapons and sword while he slept,
    summoned Menelaus, opened the doors, and invaders entered the chamber with Aeolides.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The Sibyl warns that night is rushing on and identifies the place where the
    road splits: the right path leads under Dis''s walls toward Elysium, and the left
    sends the wicked toward punishments in Tartarus.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Deiphobus accepts the priestess's warning, says he will return to darkness,
    blesses Aeneas with better fates, and turns away.
  category: action
  evidence_refs:
  - ev:9
