candidate_motifs:
- id: motif:1
  label: Public contest followed by ranked gift distribution
  taxonomy_refs:
  - sacred_exchange
  basis: Aeneas repeatedly distributes prizes according to contest ranking and also
    promises that no runner will leave without a gift.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:8
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage presents competitive prize-giving rather than an explicitly
    reciprocal ritual exchange.
- id: motif:2
  label: Wounded serpent as image of damaged vessel
  taxonomy_refs:
  - serpent
  basis: The disabled ship of Sergestus is explicitly likened to a serpent injured
    by a wheel or stone and twisting partly disabled.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The serpent appears in a simile, not as an acting creature in the plot.
- id: motif:3
  label: Divine bird carries off royal youth
  taxonomy_refs: []
  basis: A woven image on the prize cloak shows a royal boy from Ida carried upward
    by Jupiter's eagle while guardians reach toward the sky.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The episode is an image on an object; the passage does not name the boy
    or narrate the wider myth.
- id: motif:4
  label: Friendship changes contest outcome through obstruction
  taxonomy_refs: []
  basis: Nisus, remembering Euryalus, blocks Salius after falling, and Euryalus wins
    by his friend's aid.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is a contest incident; no broader taxonomy reference is assigned.
- id: motif:5
  label: Sacrificial remains alter athletic outcome
  taxonomy_refs:
  - sacrifice
  basis: Nisus slips near the finish in blood from slaughtered young cattle and sacred
    blood mixed with filth, causing the race outcome to change.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage refers to slaughtered cattle and sacred blood but does not
    describe the sacrificial rite itself.
- id: motif:6
  label: Arbiter preserves formal result while compensating injured loser
  taxonomy_refs: []
  basis: Aeneas refuses to alter the prize order but pities Salius and grants him
    an extra lion-hide prize.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage frames this as judgment within games, not as divine judgment.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Sergestus' damaged ship to a wounded serpent,
    making the similarity visual and kinetic rather than a narrative serpent encounter.
  claim_level: visual_similarity
  target: wounded serpent pattern
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The serpent is a simile for the ship's impaired movement; it is not
    an independent mythic actor.
- id: claim:2
  claim: The woven cloak scene supports comparison with a divine-abduction image in
    which Jupiter's eagle carries off a royal youth from Ida.
  claim_level: same_motif
  target: divine eagle abduction of a royal youth
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies only the visual scene on a prize garment and does
    not provide the youth's name or the complete surrounding myth.
- id: claim:3
  claim: The footrace episode supports comparison with contest-dispute patterns in
    which an official keeps the formal order but gives compensatory prizes to aggrieved
    participants.
  claim_level: same_function
  target: disputed contest with compensatory award
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: This comparison is functional and internal to the contest scene; it
    does not establish historical contact or broader inheritance.
