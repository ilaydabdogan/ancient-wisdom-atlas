canonical_text:
  quote: ''
  summary: Aeneas awards prizes after the ship race, including decorated garments,
    armor, vessels, and a human prize to Sergestus after his damaged ship returns.
    He then organizes a footrace in a grassy valley theater. Nisus leads but slips
    in sacrificial blood and filth, deliberately impedes Salius, and enables Euryalus
    to win. Salius protests; Aeneas keeps the order of prizes but gives additional
    gifts to Salius and Nisus.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas declares Cloanthus the victor, crowns him with green laurel, and grants
    prizes including young cattle, wine, and silver.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victor receives a gold cloak decorated with purple patterning and a woven
    image of a royal boy from Ida hunting deer and being carried off by Jupiter's
    eagle while guardians and dogs react.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second-ranking competitor receives a triple-linked golden mail-coat taken
    from Demoleos near the Simois beneath Troy; the armor is described as very heavy.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Third prizes consist of twin bronze cauldrons and silver cups with raised
    figures.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sergestus brings in a damaged, mocked ship, missing oars and weakened on one
    side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The damaged ship is compared to a serpent wounded by a wheel or stone, twisting
    and partly disabled.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Aeneas gives Sergestus the promised prize because the ship was saved and the
    comrades brought back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The prize given to Sergestus is Pholoe, a Cretan enslaved woman skilled in
    Minerva's work, with twin infants at her breast.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the ship contest, Aeneas goes to a grassy field enclosed by wooded hills,
    where a theater-like space lies in the middle of a valley.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Aeneas invites contestants for a rapid footrace and sets out prizes.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Named runners include Nisus, Euryalus, Diores, Salius, Patron, Helymus, and
    Panopes; Euryalus is described as notable for beauty and youth, and Nisus for
    devoted love of the boy.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Aeneas says no participant will leave ungifted; the first three will receive
    special prizes and have their heads bound with yellow olive.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the start signal the runners leave the threshold together, and Nisus quickly
    takes a large lead, followed by Salius, Euryalus, Helymus, and Diores.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Near the finish, Nisus slips in blood from slaughtered young cattle that had
    soaked the grass, falling into filth and sacred blood.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Nisus, while rising on the slippery ground, blocks Salius; Salius falls, and
    Euryalus wins first place with help from his friend.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Salius loudly protests that his honor was taken by trickery and asks that
    it be restored.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: Favor, tears, beauty, and Diores' protest support leaving Euryalus' result
    unchanged.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: Aeneas states that the prizes and order will remain fixed, but he may pity
    an innocent friend's mishap; he gives Salius a large Gaetulian lion hide with
    golden claws.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:19
  text: Nisus asks what prize he deserves if the defeated receive such rewards, shows
    his soiled face and body, and receives a shield identified as Didymaon's work,
    removed by Greeks from Neptune's sacred post.
  category: action
  evidence_refs:
  - ev:13
