canonical_text:
  quote: ''
  summary: The passage recounts alternating slaughter by Aeneas and Turnus, compares
    their violence to fires in dry woodland and mountain rivers, then has Aeneas redirected
    by his divine mother toward the Latin city. Aeneas threatens to destroy the city
    with fire unless the Latins accept terms, and the assault produces panic and internal
    disagreement. Queen Amata sees the attack, believes Turnus dead, blames herself,
    and hangs herself; Lavinia, the women, and Latinus mourn.
  language: Latin
  quote_policy: summarized
