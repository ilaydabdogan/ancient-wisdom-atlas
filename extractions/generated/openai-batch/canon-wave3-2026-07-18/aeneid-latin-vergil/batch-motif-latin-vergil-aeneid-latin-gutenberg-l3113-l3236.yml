canonical_text:
  quote: ''
  summary: Aeneas, warned by a divine apparition, wakes his companions and departs
    by sea. At dawn Dido sees the fleet leaving, laments and curses Aeneas and his
    descendants, calling on deities and future Tyrians to maintain enmity. She prepares
    rites, mounts a pyre, uses the Dardanian sword, speaks final words, and dies as
    the city and Anna mourn.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas is startled from sleep by sudden shades and commands his companions
    to wake, take the benches, set sails, and cut the twisted ropes because a god
    from the high air again urges flight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas draws a flashing sword and cuts the mooring ropes; the companions rush,
    leave the shore, and row across the sea.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dawn Dido, from a lookout, sees the fleet advancing with level sails and
    realizes the shores and harbors are empty of oarsmen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dido strikes her breast, tears her hair, and speaks in anger and confusion
    about pursuit, flames, ships, and the departing foreigner.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dido imagines that she could have destroyed Aeneas, his companions, Ascanius,
    and the father and son, and then given herself up over them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dido invokes Sol, Juno, Hecate, the avenging Dirae, and the gods of dying
    Elissa, asking them to hear her prayer and turn divine power toward deserved evils.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dido prays that if Aeneas must reach land by Jupiter's fates, he be harried
    by war, driven from his borders, torn from Iulus, forced to seek aid, see the
    deaths of his people, and die before his day unburied on the sand.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dido commands the Tyrians and their future descendants to exercise hatred
    against Aeneas' line, forbidding love and treaties, and calls for an avenger to
    arise from her bones.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dido instructs Barce to bring Anna, have her sprinkle herself with river water,
    bring animals and expiatory offerings, and come with a sacred headband for rites
    to Stygian Jove and the pyre.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dido enters the inner house in a frantic state, climbs the high pyre, opens
    the Dardanian sword, sees Trojan garments and a familiar couch, lies on the couch,
    and speaks final words.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Dido says she has lived, completed the course fortune gave her, founded a
    renowned city, seen her walls, avenged her husband, and would have been happy
    if Trojan ships had not touched her shores.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Dido kisses the couch, says she will die unavenged but will die, and wishes
    the cruel Dardanian to see the fire from the sea and carry omens of her death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Companions see Dido collapsed on the sword, with the sword foaming with blood
    and her hands spattered; a cry rises through the palace and Rumor runs through
    the shaken city.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The houses resound with laments, groans, women's cries, and great mourning,
    compared in the passage to Carthage or Tyre falling to enemies and flames over
    human and divine roofs.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: Anna runs through the crowd, clawing her face and beating her breast, calls
    Dido by name, laments that she was deceived, and embraces and tends the half-alive
    Dido.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Dido tries to raise her heavy eyes, fails again, and three times lifts herself
    on her elbow before falling back and searching the high sky for light.
  category: sequence
  evidence_refs:
  - ev:9
