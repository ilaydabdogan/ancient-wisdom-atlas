canonical_text:
  quote: ''
  summary: The passage introduces Aeneas as a Trojan exile driven by fate toward Italy
    and long opposed by Juno. Juno, fearing future Trojan/Roman power and remembering
    earlier grievances, goes to Aeolus in Aeolia, where winds are confined in caves
    beneath mountains. She asks Aeolus to release the winds against the Trojan fleet
    and offers the nymph Deiopea in marriage as a reward. Aeolus opens the mountain,
    the winds raise a violent storm, Aeneas laments that he did not die at Troy, and
    several Trojan ships are damaged, scattered, or swallowed by the sea.
  language: Latin
  quote_policy: summarized
