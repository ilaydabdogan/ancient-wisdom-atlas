canonical_text:
  quote: At medias inter caedes exsultat Amazon, / unum exserta latus pugnae, pharetrata
    Camilla
  summary: The passage describes Camilla fighting amid battle, accompanied by selected
    Italian maidens and compared to Amazons. She kills a series of named opponents,
    taunts Ornytus, defeats Butes and Orsilochus, and finally overcomes a Ligurian
    warrior, the son of Aunus, who attempts to deceive her into dismounting before
    fleeing. Camilla outruns his horse and kills him; the action is compared to a
    hawk seizing a dove.
  language: Latin
  quote_policy: quoted
