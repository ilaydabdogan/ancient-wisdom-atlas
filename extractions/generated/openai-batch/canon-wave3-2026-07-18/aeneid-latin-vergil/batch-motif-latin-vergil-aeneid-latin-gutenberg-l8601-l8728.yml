canonical_text:
  quote: ''
  summary: Latin envoys approach Aeneas with olive branches to request leave to bury
    the dead. Aeneas grants the request and speaks of peace, blaming Turnus and the
    Latin king’s broken hospitality. Drances praises Aeneas and criticizes Turnus.
    A twelve-day truce follows, during which both sides gather wood. News of Pallas’
    death reaches Evander, who laments over his son’s bier and sends a message urging
    Aeneas to make Turnus pay. Trojans and Latins conduct funerary rites with pyres,
    processions, offerings, animal slaughter, cremation, burial, and mourning. In
    Latinus’ city, women and orphans curse the war and Turnus’ marriage, while debate
    about Turnus continues.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Envoys from the Latin city arrive wearing olive branches and ask Aeneas to
    permit burial of bodies lying across the fields.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas grants the request, says he would have granted peace to the living,
    and directs the Latins to put fire beneath their dead citizens.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aeneas says he did not come except because fate gave him a place and settlement,
    and that the Latin king abandoned hospitality and trusted Turnus’ arms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aeneas states that Turnus should have met him in arms if he intended to end
    the war or drive off the Trojans.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Drances praises Aeneas for justice and warlike labors, says the Latins will
    report this to their city, and says Turnus should seek his own treaties.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A twelve-day truce is agreed, and Trojans and Latins move safely through woods
    and hills while cutting and transporting trees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fame carries news of the loss to Evander’s houses and walls, reversing earlier
    news that Pallas was victorious in Latium.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Arcadians take up funeral torches according to old custom, and a long line
    of flames lights the road.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Trojan mourners meet the Arcadian group, and the women of the city raise cries
    when they see the procession enter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Evander falls upon Pallas’ bier and clings to it while weeping and groaning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Evander laments that Pallas had promised to be more cautious in war and says
    his own prayers and vows were not heard by the gods.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Evander says he has outlived his proper fate and wishes he himself had been
    carried home in the funeral procession instead of Pallas.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Evander sends a message that Aeneas’ right hand owes Turnus to both father
    and son, and that he seeks not the joys of life but a message to carry to his
    son’s shades below.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: At dawn, Aeneas and Tarchon set up pyres on the curved shore, and each person
    brings the bodies of his own people according to ancestral custom.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Armed mourners circle the burning pyres three times on horseback, cry aloud,
    and scatter tears on earth and weapons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Spoils taken from slain Latins, including helmets, swords, bridles, wheels,
    shields, and weapons, are thrown into the fire.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: Bodies of bulls, boars, and other livestock are slaughtered around the pyres
    or into the flame as offerings to Death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The mourners watch their burning comrades and remain by the half-burned funeral
    mounds until night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The Latins also build many pyres, bury some bodies, carry some away to nearby
    lands or the city, and burn a confused heap of the slain without count or honor.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: On the third dawn, mourners rake together high ash and mingled bones from
    the hearths and cover them with warm earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:21
  text: In Latinus’ city, mothers, daughters-in-law, sisters, and orphaned children
