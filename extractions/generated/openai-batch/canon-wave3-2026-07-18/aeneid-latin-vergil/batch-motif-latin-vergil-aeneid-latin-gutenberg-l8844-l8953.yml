canonical_text:
  quote: ''
  summary: In a Latin council scene, Drances rises against Turnus, urges Latinus to
    secure peace by giving his daughter in marriage to a Dardanian son-in-law, and
    challenges Turnus to face the enemy himself. Turnus answers angrily, mocks Drances
    as eloquent but cowardly, recounts his martial successes, argues that allies and
    Fortune still offer hope, and says that if Aeneas calls him alone he will go,
    having vowed his life to the Latins and Latinus.
  language: Latin
  quote_policy: summarized
