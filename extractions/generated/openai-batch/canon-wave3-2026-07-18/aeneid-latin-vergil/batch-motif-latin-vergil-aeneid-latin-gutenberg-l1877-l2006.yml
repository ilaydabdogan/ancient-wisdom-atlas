candidate_motifs:
- id: motif:1
  label: divinely corrected migration destination
  taxonomy_refs:
  - departure
  basis: The Trojans depart, found a settlement, then receive divine instruction that
    the settlement is wrong and must continue toward Hesperia/Italy.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  - ev:8
  - ev:11
  confidence: high
  cautions: The taxonomy reference is broad; the passage concerns redirection during
    migration rather than initial departure only.
- id: motif:2
  label: plague as sign of failed settlement
  taxonomy_refs:
  - divine_judgment
  basis: A deadly plague and crop failure afflict the new Cretan settlement shortly
    before divine messengers say the land is not assigned to Aeneas.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage juxtaposes plague and corrected divine instruction, but does
    not explicitly state the plague is punishment.
- id: motif:3
  label: dreamlike visitation by household gods
  taxonomy_refs:
  - wisdom
  basis: The Penates appear at night, deliver clarifying knowledge about Apollo's
    intended command, and instruct Aeneas on the proper destination.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The available taxonomy has no specific dream-oracle category; 'wisdom'
    is used only for the conveyed divine instruction.
- id: motif:4
  label: ancestral promised homeland
  taxonomy_refs:
  - royal_legitimacy
  basis: The Penates identify Hesperia/Italy as the Trojans' proper seat, connect
    it to Dardanus and Iasius, and promise future descendants, empire, and a city.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif concerns ancestral and imperial legitimation in the passage,
    not a coronation scene.
- id: motif:5
  label: storm-driven sea wandering
  taxonomy_refs:
  - departure
  basis: After leaving Crete, the fleet is overtaken by storm, darkness, and loss
    of navigation for three days and nights before sighting land.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The taxonomy reference is broad; the passage is specifically a storm episode
    within a voyage.
- id: motif:6
  label: foul winged food-snatchers
  taxonomy_refs: []
  basis: The Harpies descend on the Trojans' meals, snatch food, pollute the feast,
    and cannot be wounded by the attackers.
  evidence_refs:
  - ev:15
  - ev:17
  - ev:19
  - ev:21
  confidence: high
  cautions: No available taxonomy reference directly covers Harpies or food-polluting
    monsters.
- id: motif:7
  label: monstrous island encounter after sea survival
  taxonomy_refs:
  - hero_descent
  basis: After being saved from the waves and reaching the Strophades, Aeneas encounters
    monstrous Harpies and leads a failed attack against them.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:20
  - ev:21
  confidence: low
  cautions: The passage does not describe an underworld descent; the taxonomy reference
    is only loosely related to heroic ordeal and should be reviewed.
comparison_claims:
- id: claim:1
  claim: The Strophades Harpy episode is explicitly linked within the passage to the
    earlier Phineus-table tradition, since the Harpies are said to inhabit the islands
    after leaving Phineus' house and former tables.
  claim_level: same_motif
  target: Phineus and Harpies food/table-pollution tradition
  evidence_refs:
  - ev:14
  - ev:17
  - ev:19
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage names Phineus but does not narrate the full Phineus episode;
    the comparison is limited to the shared Harpy-table association stated here.
