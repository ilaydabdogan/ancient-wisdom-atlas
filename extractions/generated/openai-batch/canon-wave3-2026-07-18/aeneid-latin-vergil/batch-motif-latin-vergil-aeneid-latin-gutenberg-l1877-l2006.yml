passage_locator:
  label: LIBER II / PUBLI VERGILI MARONIS / AENEIDOS / LIBER III; lines 1877-2006
  start: '1877'
  end: '2006'
  translation: Aeneidos
  notes: Generated from OpenAI Batch run canon-wave3-2026-07-18; human review required.
canonical_text:
  quote: 'Mutandae sedes: non haec tibi litora suasit Delius...'
  summary: Aeneas and the Trojans leave Ortygia for Crete, found a settlement there,
    suffer plague and crop failure, receive a nocturnal message from the Penates redirecting
    them toward Hesperia/Italy, leave Crete, endure a storm at sea, reach the Strophades,
    and battle the Harpies after the Harpies foul their feast.
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A rumor says Idomeneus has been driven from his ancestral kingdom and that
    Crete's shores and homes stand abandoned.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Trojans leave Ortygia and sail among islands toward Crete, urged by companions
    who call for seeking Crete and the ancestors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aeneas begins building an intended city in Crete, names it Pergamea, and encourages
    his people to establish hearths and a citadel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After ships are drawn onto shore and the youth begin marriages and new fields,
    a wasting plague and deadly year affect bodies, trees, crops, and fields.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Anchises urges a return by sea to Ortygia and Apollo's oracle to ask for favor,
    an end to hardship, help, and a new course.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: At night, while living creatures sleep, the sacred images of the gods and
    the Phrygian Penates appear before Aeneas as he lies down.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Penates state that Apollo has sent them and that the Trojans must change
    settlements, because Crete is not the commanded destination.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Penates identify Hesperia/Italy as the proper ancestral land connected
    with Dardanus and Iasius, and say Jupiter denies Dictaean fields to Aeneas.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Aeneas responds to the divine vision with awe, sweat, raised hands, and offerings
    at the hearths, then reports the matter to Anchises.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Anchises recalls Cassandra's former prophecies about Hesperia and Italian
    kingdoms, acknowledges the earlier error, and agrees to follow Phoebus' warning.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Trojans abandon the Cretan settlement, leave a few people behind, set
    sail, and cross the open sea in hollow ships.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A storm covers sea and sky; winds scatter the ships, lightning flashes, and
    Palinurus cannot distinguish day from night or remember the route.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: After three uncertain days and three starless nights, land with mountains
    and smoke appears on the fourth day.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Strophades are named as Ionian islands inhabited by Celaeno and other
    Harpies after they left Phineus' house and earlier tables.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:15
  text: The Harpies are described as monsters with maiden-like bird faces, filthy
    belly-flow, hooked hands, and pale faces from hunger.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:16
  text: On entering the harbor, the Trojans see unattended cattle and goats, attack
    them with the sword, invoke the gods and Jupiter as sharers, and feast on the
    shore.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Harpies suddenly descend from the mountains, beat their wings loudly, snatch
    the food, and foul everything by unclean contact and odor.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: The Trojans prepare a second meal in a secluded place under a hollow rock,
    enclosed by trees and dark shade, with altars and fire.
  category: setting
  evidence_refs:
  - ev:18
- id: obs:19
  text: The Harpies return from hidden regions of the sky, circle the food with hooked
    feet, and pollute the feast with their mouths.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: Aeneas orders his companions to take arms and fight the Harpies; swords and
    shields are hidden in the grass.
  category: action
  evidence_refs:
  - ev:20
- id: obs:21
  text: Misenus gives a signal from a high lookout with hollow bronze, and the Trojans
    attack, but the Harpies cannot be wounded and fly away under the stars.
  category: sequence
  evidence_refs:
  - ev:21
