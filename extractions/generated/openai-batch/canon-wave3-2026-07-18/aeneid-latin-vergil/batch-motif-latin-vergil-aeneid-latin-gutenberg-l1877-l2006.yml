  rights_note: Public domain source; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: 1908-1915
  quote_or_summary: At night, when sleep holds living things, the sacred divine images
    and Phrygian Penates rescued from Troy's fires appear before Aeneas in bright
    moonlight.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: 1916-1925
  quote_or_summary: The Penates say Apollo has sent them, that they followed Aeneas
    from burning Troy across the sea, and that the settlement must change because
    Apollo did not advise these shores or Crete.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: 1926-1938
  quote_or_summary: The Penates describe Hesperia/Italy as an ancient fertile and
    armed land, the Trojans' proper seat and origin of Dardanus and Iasius, and say
    to seek Corythus and Ausonian lands because Jupiter denies Dictaean fields.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:9
  type: summary
  locator: 1939-1948
  quote_or_summary: Aeneas is stunned by the divine vision, says it was not sleep,
    sweats, rises, raises hands to heaven, makes pure offerings at the hearths, and
    reports the matter to Anchises.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:10
  type: summary
  locator: 1949-1960
  quote_or_summary: Anchises recognizes the ancestral error and recalls that Cassandra
    alone had prophesied Hesperia and Italian kingdoms, then says to yield to Phoebus
    and follow the better warnings.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:11
  type: summary
  locator: 1961-1964
  quote_or_summary: All obey; they abandon this settlement too, leave a few behind,
    set sails, and run over the vast sea in a hollow ship.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:12
  type: summary
  locator: 1965-1976
  quote_or_summary: Once no land appears, cloud, storm, darkness, winds, waves, and
    lightning scatter the ships; Palinurus cannot distinguish day and night or remember
    the route.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:13
  type: summary
  locator: 1977-1983
  quote_or_summary: For three uncertain days and three starless nights they wander;
    on the fourth day land rises, showing mountains and smoke, and the sailors row
    toward it.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:14
  type: summary
  locator: 1984-1990
  quote_or_summary: The Strophades receive Aeneas from the waves; these Ionian islands
    are inhabited by Celaeno and other Harpies after they left Phineus' closed house
    and former tables in fear.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:15
  type: summary
  locator: 1991-1995
  quote_or_summary: The Harpies are called exceptionally grim monsters and divine
    plagues, with maiden-like bird faces, filthy belly discharge, hooked hands, and
    pale faces from hunger.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:16
  type: summary
  locator: 1996-2001
  quote_or_summary: After entering the harbor, the Trojans see unattended cattle and
    goats, attack with iron, invoke the gods and Jupiter as sharers, build couches
    on the curved shore, and feast.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:17
  type: summary
  locator: 2002-2006
  quote_or_summary: The Harpies suddenly come down from the mountains with dreadful
    wing-noise, snatch the food, foul everything by unclean contact, and a dire voice
    is heard amid a foul smell.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:18
  type: summary
  locator: 2007-2011
  quote_or_summary: The Trojans again set tables and altar-fire in a distant recess
    under a hollow rock, enclosed by trees and gloomy shadows.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:19
  type: summary
  locator: 2012-2014
  quote_or_summary: The Harpy crowd again flies from another part of the sky and hidden
    lairs, circles the prey with hooked feet, and pollutes the food with their mouths.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:20
  type: summary
  locator: 2014-2018
  quote_or_summary: Aeneas commands his companions to take arms and wage war against
    the dire race; they place swords hidden in the grass and conceal shields.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:21
  type: summary
  locator: 2019-2027
  quote_or_summary: When the Harpies descend again, Misenus gives a signal from a
    high lookout with hollow bronze; the companions attack, but the birds receive
    no force or wounds and fly under the stars, leaving half-eaten prey and foul traces.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized from supplied passage.
