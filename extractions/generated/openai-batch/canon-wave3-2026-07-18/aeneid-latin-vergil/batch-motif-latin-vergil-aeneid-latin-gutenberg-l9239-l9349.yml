canonical_text:
  quote: ''
  summary: In battle, Jupiter observes from Olympus and stirs Tarchon, who rallies
    the Tyrrhenians and seizes Venulus, an action compared to an eagle carrying a
    wounded serpent. Arruns stalks Camilla while she pursues the richly adorned Chloreus.
    Arruns prays to Apollo of Soracte; Apollo grants that Camilla will fall but denies
    Arruns a safe return. Arruns wounds Camilla with a spear and flees, compared to
    a wolf after a killing. Camilla gives Acca a final message for Turnus, dies, and
    the battle intensifies.
  language: Latin
  quote_policy: summarized
