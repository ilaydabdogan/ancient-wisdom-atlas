canonical_text:
  quote: "'Hunc ego Diti sacrum iussa fero, teque isto corpore solvo.'"
  summary: Juno, pitying a long grief and difficult death, sends Iris from Olympus
    to release a struggling soul and bound limbs. Because the dying woman is not perishing
    by fate or deserved death, Proserpina has not yet taken the yellow lock or consigned
    the head to Stygian Orcus. Iris descends with many-colored wings, declares the
    consecration to Dis and release from the body, cuts the hair, and life departs
    into the winds.
  language: Latin
  quote_policy: quoted
