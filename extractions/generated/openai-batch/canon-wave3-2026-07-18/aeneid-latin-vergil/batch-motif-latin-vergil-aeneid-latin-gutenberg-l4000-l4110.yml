canonical_text:
  quote: Ditis tamen ante infernas accede domos, et Averna per alta congressus pete,
    nate, meos.
  summary: At night Anchises appears to Aeneas and instructs him to obey Nautes, take
    selected youths to Italy, and first seek Anchises through Avernus with the Sibyl's
    guidance. Aeneas performs rites, organizes settlers under Acestes, founds a Trojan-named
    city and cult places, and departs with sacrifices. Venus petitions Neptune for
    safe passage against Juno's hostility; Neptune promises safety to Avernus but
    foretells one death, then rides over and calms the sea with his retinue.
  language: Latin
  quote_policy: quoted
