- id: ev:9
  type: summary
  locator: lines 1099-1106
  quote_or_summary: Sinon says harming Minerva’s gift would bring ruin to Priam and
    the Phrygians, but bringing it into Troy would make Asia come against Pelopid
    walls in war.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; concise summary.
