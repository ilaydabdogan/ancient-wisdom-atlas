canonical_text:
  quote: ''
  summary: Sinon tells the Trojans that Calchas selected him for sacrifice, that he
    escaped and hid, and he is then freed by Priam. Sinon swears an oath and explains
    that the Greeks lost divine favor after stealing the Palladium from Minerva’s
    temple; he says the wooden horse was built as a substitute sacred image with dangerous
    consequences if mishandled. The narrator marks Sinon’s story as deceptive. Laocoon
    sacrifices a bull, then two sea-serpents come from Tenedos, kill his two sons
    and him, and take refuge at Minerva’s shrine. The Trojans interpret the event
    as punishment for Laocoon’s spear-strike against the sacred horse and call for
    the image to be brought into the city.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sinon reports that Calchas was pressed to name a victim and eventually designated
    Sinon for the altar.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sinon reports that sacrificial preparations, including salted grain and fillets
    around his temples, had begun before he broke his bonds and hid at night in reeds
    by a muddy lake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Priam orders Sinon’s manacles and tight bonds removed, accepts him as belonging
    to the Trojans, and asks him to explain the huge horse’s purpose and whether it
    is religious or military.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sinon raises his freed hands toward the stars, swears by sacred objects, says
    he is no longer bound by Greek law, and asks Troy to keep faith with him if he
    tells the truth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sinon says the Danaans’ hopes depended on Pallas, and that Diomedes and Ulysses
    stole the Palladium from a sacred temple after killing guards and touching the
    goddess’s fillets with bloody hands.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Sinon says signs followed the placement of the Palladium in the Greek camp:
    flames shone from its eyes, salty sweat passed over its limbs, and it leapt three
    times while bearing shield and spear.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sinon says Calchas declared that the Greeks could not destroy Troy unless
    they returned to Argos to renew omens and bring back the divine power carried
    away by sea.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sinon explains that the wooden horse was set up as a replacement for the Palladium
    and as expiation for the offended divinity, and that its size was intended to
    prevent it from entering Troy’s gates.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sinon says that harming Minerva’s gift would bring ruin on Priam’s realm and
    the Phrygians, while bringing it into Troy would lead Asia to attack Pelopid walls.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The narrator states that the Trojans believed Sinon’s perjured arts and forced
    tears.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: Laocoon, priest of Neptune by lot, sacrifices a large bull at the altars.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Two serpents come from Tenedos over calm waters toward the shore, with raised
    breasts, blood-red crests, immense coils, bloodshot fiery eyes, and flickering
    tongues.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The twin serpents first coil around and bite Laocoon’s two small sons, then
