candidate_motifs:
- id: motif:1
  label: Chosen victim escapes sacrificial death
  taxonomy_refs:
  - sacrifice
  basis: Sinon says he was selected by Calchas for the altar, sacrificial preparations
    were begun, and he escaped by breaking bonds and hiding at night.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The event is reported inside Sinon’s speech, and the narrator later marks
    Sinon’s account as deceptive.
- id: motif:2
  label: Sacred image stolen from temple causing divine withdrawal
  taxonomy_refs:
  - sacred_theft
  - divine_judgment
  basis: Sinon says Diomedes and Ulysses seized the Palladium from a sacred temple
    with bloody hands, after which Greek hopes failed and the goddess turned away.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: This causal account is part of Sinon’s deceptive persuasion, although
    the passage clearly presents the motif within his speech.
- id: motif:3
  label: Expiatory replacement image with taboo consequences
  taxonomy_refs:
  - divine_judgment
  basis: The horse is described as an effigy made in place of the Palladium and for
    the offended divinity; damaging it or bringing it into the city is said to determine
    different future fates.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The explanation is given by Sinon and may be strategically false in the
    narrative context.
- id: motif:4
  label: Serpent attack interpreted as divine punishment
  taxonomy_refs:
  - serpent
  - divine_judgment
  basis: Twin serpents kill Laocoon and his sons, retreat to Minerva’s shrine, and
    the Trojans interpret Laocoon as punished for striking the sacred horse.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage distinguishes the physical event from the Trojans’ interpretation;
    divine causation is inferred by characters, not directly narrated as authorial
    explanation.
- id: motif:5
  label: Deceptive speech opens a protected city to danger
  taxonomy_refs:
  - trickster_boundary
  basis: The narrator says the Trojans are captured by Sinon’s tricks and tears; Sinon’s
    story urges them toward treating the horse as a sacred object to be brought into
    Troy.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:16
  confidence: medium
  cautions: The available taxonomy label is broad; the passage supports deceit and
    a city-boundary outcome, but the term trickster is not used.
- id: motif:6
  label: Animated or prodigious cult statue as omen
  taxonomy_refs:
  - divine_judgment
  basis: Sinon describes the Palladium emitting flames from its eyes, sweating salt,
    and leaping three times while holding weapons.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The prodigies are reported inside Sinon’s speech.
comparison_claims:
- id: claim:1
  claim: Within Sinon’s explanation, the wooden horse is assigned the same ritual
    function as a replacement or recompense for the stolen Palladium and the offended
    divine power.
  claim_level: same_function
  target: Palladium / offended numen of Minerva
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:10
  confidence: medium
  limitations: The relationship is asserted by Sinon, whose speech the narrator frames
    as deceitful.
- id: claim:2
  claim: The passage itself compares Laocoon’s horrible cries to the bellowing of
    a wounded bull fleeing an altar.
  claim_level: visual_similarity
  target: wounded sacrificial bull simile
  evidence_refs:
  - ev:11
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: This is an explicit poetic simile, not evidence of a separate mythic
    origin.
- id: claim:3
  claim: The Trojan crowd treats the serpent attack as functioning like divine judgment
    for violation of a sacred object.
  claim_level: same_function
  target: divine_judgment for sacrilege against sacred image or offering
  evidence_refs:
  - ev:15
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports the Trojans’ interpretation; it does not independently
    confirm that this is the objective cause of the attack.
