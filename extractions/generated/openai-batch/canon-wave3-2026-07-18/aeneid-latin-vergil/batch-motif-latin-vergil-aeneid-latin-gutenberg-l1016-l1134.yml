  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; concise summary.
- id: ev:11
  type: summary
  locator: lines 1113-1118
  quote_or_summary: Laocoon, priest of Neptune by lot, sacrifices a huge bull at the
    altars.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; concise summary.
- id: ev:12
  type: summary
  locator: lines 1119-1128
  quote_or_summary: Two serpents from Tenedos move through calm sea with huge coils,
    red crests, raised breasts, foaming water, blood-and-fire eyes, and flickering
    tongues.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; concise summary.
- id: ev:13
  type: summary
  locator: lines 1129-1136
  quote_or_summary: The serpents seek Laocoon, first wrapping and biting the two small
    bodies of his sons, then seizing Laocoon when he comes to help with weapons.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; concise summary.
- id: ev:14
  type: summary
  locator: lines 1137-1145
  quote_or_summary: Laocoon, coiled twice around waist and neck, tries to tear the
    knots; his fillets are stained with gore and dark venom, and he cries like a wounded
    bull fleeing an altar.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; concise summary.
- id: ev:15
  type: summary
  locator: lines 1146-1149
  quote_or_summary: The twin serpents glide away to Tritonia’s high shrine and hide
    under the goddess’s feet and the circle of her shield.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; concise summary.
