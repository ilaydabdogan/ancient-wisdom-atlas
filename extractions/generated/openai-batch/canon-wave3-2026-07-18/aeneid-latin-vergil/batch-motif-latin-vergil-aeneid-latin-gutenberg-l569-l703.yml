    they taste Troy’s pasture or Xanthus, and Troilus fleeing without arms, dragged
    by his horses and chariot.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 582-586
  quote_or_summary: Trojan women go to the temple of Pallas with loosened hair, carrying
    a peplum and beating their breasts, while the goddess turns away and keeps her
    eyes fixed on the ground.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 587-594
  quote_or_summary: Achilles has dragged Hector three times around Troy’s walls and
    sells his lifeless body for gold; Aeneas groans when he sees the spoils, chariots,
    body of his friend, and unarmed Priam stretching out his hands.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 595-600
  quote_or_summary: Aeneas recognizes himself among Greek leaders, the eastern battle
    lines, Memnon’s dark arms, and Penthesilea leading Amazons with crescent shields
    and daring to fight men.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 601-603
  quote_or_summary: While these things seem marvelous to Dardanian Aeneas, he is stunned
    and fixed in a single gaze.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 604-606
  quote_or_summary: Queen Dido, very beautiful in form, enters the temple with a large
    band of young men surrounding her.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: quote
  locator: 607-614
  quote_or_summary: "“Qualis ... exercet Diana choros ... illa pharetram fert umero
    ... talis erat Dido” — Dido is compared to Diana among Oreads, carrying a quiver
    and surpassing the goddesses."
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; short excerpt quoted.
- id: ev:9
  type: summary
  locator: 615-616
  quote_or_summary: At the goddess’s doors, in the middle vault of the temple, Dido
    sits, enclosed by arms and supported on a high seat.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 617-619
  quote_or_summary: Dido gives judgments and laws to the men, divides the labor of
    works in fair parts, or assigns it by lot.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 620-624
  quote_or_summary: Aeneas suddenly sees Antheus, Sergestus, brave Cloanthus, and
    other Trojans whom a dark storm on the sea had scattered and carried to distant
    shores.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 625-631
  quote_or_summary: Aeneas and Achates are struck by joy and fear and wish to join
    hands, but uncertainty troubles them; they hide and watch under a hollow cloud
    as selected men from the ships seek pardon at the temple.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 632-638
  quote_or_summary: Ilioneus addresses the queen, says Jupiter granted her to found
    a new city and restrain proud peoples with justice, and asks her to prevent dreadful
    fires from the ships and spare a pious people.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 639-642
  quote_or_summary: Ilioneus denies that the Trojans came to ravage Libyan households
    by sword or carry stolen plunder to the shore.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 643-648
  quote_or_summary: 'Ilioneus describes their destination: Hesperia, an ancient land
    powerful in arms and rich soil, once inhabited by Oenotrians and now called Italy
    after a leader’s name.'
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 649-654
  quote_or_summary: A storm with rising Orion, violent south winds, waves, hidden
    shallows, and impassable rocks scattered the Trojans and brought a few to Dido’s
    shores.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 655-658
  quote_or_summary: Ilioneus asks what kind of people or barbarous custom forbids
    them the hospitality of the beach, stirs war, and bars first landing; he warns
    that the gods remember right and wrong.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: 659-665
  quote_or_summary: Ilioneus says Aeneas was their king, unmatched in justice, pietas,
    war, and arms; if fate preserves him and he is not among cruel shades, Dido need
    not fear helping them.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: 666-669
  quote_or_summary: Ilioneus says there are Sicilian cities and fields and Trojan-blooded
    Acestes; he asks to haul up the storm-battered fleet, fit timbers from the woods,
    and prepare oars.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: 670-677
  quote_or_summary: Ilioneus asks to seek Italy and Latium joyfully if Italy is granted
    with comrades and king restored; if Aeneas and hope of Iulus are lost, they would
    seek Sicily and Acestes.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: 680-684
  quote_or_summary: Dido tells the Trojans to release fear and set aside cares; hard
    circumstances and the newness of her kingdom compel her to guard the borders widely.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:22
  type: summary
  locator: 685-688
  quote_or_summary: Dido says the Poeni know the race of Aeneas, Troy, Trojan virtues
    and men, and the fires of such a great war.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:23
  type: summary
  locator: 689-695
  quote_or_summary: Dido says she will send the Trojans safely with help whether they
    seek Hesperia and Saturnian fields or Acestes; she also offers them settlement
    in her city with no distinction between Trojan and Tyrian.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:24
  type: summary
  locator: 696-700
  quote_or_summary: Dido wishes Aeneas himself were present and says she will send
    reliable men along the shores and through Libya’s outer regions to search whether
    he wanders in woods or cities.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:25
  type: summary
  locator: 701-708
  quote_or_summary: Aeneas and Achates are eager to break out of the cloud; Achates
    asks Aeneas, son of a goddess, what he thinks, noting that fleet and companions
    are safe and only one man is absent, seen submerged in mid-wave.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:26
  type: summary
  locator: 709-711
  quote_or_summary: The surrounding cloud suddenly splits and clears into open air.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:27
  type: summary
  locator: 712-713
  quote_or_summary: Aeneas stands and shines in clear light, with face and shoulders
    like a god.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
  rights_note: Public domain source; summarized.
- id: ev:28
  type: summary
  locator: 713-718
  quote_or_summary: Aeneas’s mother has breathed beautiful hair, purple light of youth,
    and joyous honors into his eyes, compared to ornament added to ivory, silver,
    Parian stone, or gold.
  source_text_path: texts/public-domain/roman/project-gutenberg/aeneid-latin-vergil.md
