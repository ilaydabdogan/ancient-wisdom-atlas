candidate_motifs:
- id: motif:1
  label: founding queen as lawgiver and host
  taxonomy_refs:
  - royal_legitimacy
  basis: Dido is presented as queen, sits in authority at the temple, gives laws and
    judgments, oversees civic labor, and offers protection or settlement to the Trojans.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:21
  - ev:23
  confidence: medium
  cautions: The passage supports royal authority and civic foundation, but the taxonomy
    label is broad and the passage does not explicitly discuss divine right or dynastic
    legitimacy.
- id: motif:2
  label: storm-driven exiles seeking a destined land
  taxonomy_refs:
  - departure
  basis: Ilioneus says the Trojans were voyaging toward Hesperia/Italy when storm,
    winds, waves, shallows, and rocks scattered them to Libya; he asks to repair the
    fleet and continue if Aeneas is recovered.
  evidence_refs:
  - ev:15
  - ev:16
  - ev:19
  - ev:20
  confidence: medium
  cautions: The passage concerns displacement and onward travel rather than the initial
    departure from Troy.
- id: motif:3
  label: hidden hero revealed in divine radiance
  taxonomy_refs: []
  basis: Aeneas and Achates watch under a cloud; the cloud breaks, and Aeneas appears
    in bright light with godlike face and shoulders.
  evidence_refs:
  - ev:12
  - ev:26
  - ev:27
  confidence: high
  cautions: No exact available taxonomy reference directly matches concealment followed
