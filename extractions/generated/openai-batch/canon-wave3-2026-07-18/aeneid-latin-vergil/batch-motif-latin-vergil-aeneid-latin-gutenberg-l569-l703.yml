canonical_text:
  quote: ''
  summary: Aeneas studies images of the Trojan War at the temple, including battles
    around Troy, the deaths or humiliations of Rhesus, Troilus, and Hector, Priam’s
    supplication, Memnon, and Penthesilea. Dido enters the temple with attendants,
    is compared to Diana, sits in authority, and distributes laws and work. Shipwrecked
    Trojans arrive to petition her. Ilioneus explains their storm-driven voyage and
    asks protection for their ships and permission to repair or depart. Dido reassures
    them, offers aid or settlement, and sends searchers for Aeneas. Aeneas and Achates,
    hidden by a cloud, are encouraged by her words; the cloud breaks, and Aeneas appears
    in bright beauty after his divine mother has enhanced his appearance.
  language: Latin
  quote_policy: summarized
