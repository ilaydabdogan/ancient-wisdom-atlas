canonical_text:
  quote: ''
  summary: Allecto leaves Latinus's house, comes by night to Turnus at Ardea, disguises
    herself as the old priestess Calybe, and urges him to take arms against the Trojan/Dardanian
    settlers and Latinus. Turnus dismisses her. Allecto reveals her Fury form with
    serpentine and fiery features, throws a smoking torch into Turnus's breast, and
    he awakens in terror and war-madness. He summons the Rutuli to arms against Latinus's
    settlement with the Trojans.
  language: Latin
  quote_policy: summarized
