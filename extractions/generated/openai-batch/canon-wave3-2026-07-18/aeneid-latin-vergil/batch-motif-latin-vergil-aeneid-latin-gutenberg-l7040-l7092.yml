canonical_text:
  quote: ''
  summary: Nisus and Euryalus cross into an enemy camp by night, find many enemies
    asleep and affected by wine, kill several named and unnamed men, halt as hostile
    daylight approaches, take selected ornaments and a crested helmet, and leave the
    camp toward safety.
  language: Latin
  quote_policy: summarized
