canonical_text:
  quote: ''
  summary: In the final combat, wounded Aeneas pursues Turnus, who calls for his sword
    while Aeneas threatens death and destruction. Aeneas's spear is caught in the
    root of a sacred oleaster of Faunus; Turnus prays that Faunus and earth hold it
    fast. Juturna, disguised as Metiscus, restores Turnus's sword, while Venus frees
    Aeneas's spear. Jupiter then addresses Juno from Olympus, declares Aeneas destined
    for heaven, reproaches Juno's continued opposition, and forbids further interference.
    Juno yields but asks that the Latins keep their name, speech, and dress, and that
    Troy's name disappear. Jupiter grants this, promising a mixed Ausonian-Teucrian
    people, Alban kings, a powerful Roman line, and special honor for Juno. Juno accepts
    and leaves the cloud.
  language: Latin
  quote_policy: summarized
