canonical_text:
  quote: ''
  summary: In a battle at the Trojan camp, Mars strengthens the Latins and sends fear
    among the Trojans. Pandarus closes the gate after seeing his brother fallen, accidentally
    shutting Turnus inside. Pandarus challenges Turnus; Juno diverts Pandarus’s spear,
    and Turnus kills him. Turnus then kills many Trojans, but rage prevents him from
    opening the gates to admit his allies. Mnestheus and Serestus rally the Trojans,
    who press Turnus toward the river. Jupiter sends Iris to restrain Juno from further
    aiding Turnus. Overwhelmed by missiles, Turnus leaps armed into the river, whose
    current receives him, washes away the slaughter, and returns him to his companions.
  language: Latin
  quote_policy: summarized
