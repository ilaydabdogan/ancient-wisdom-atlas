canonical_text:
  quote: ''
  summary: Opis, attendant of Trivia/Diana, watches Camilla's death from the mountains,
    laments her, and declares that the man who wounded her will pay with death. From
    the tomb of Dercennus she sees Arruns exulting, shoots him with Diana's arrow,
    and departs to Olympus. Camilla's forces and the Rutuli flee toward the city,
    causing panic and slaughter at the gates while mothers defend the walls with missiles
    and improvised weapons. Acca reports the disaster to Turnus; Turnus and Aeneas
    move toward the walls, but night falls before they can fight, and the armies encamp
    before the city.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Opis, described as Trivia's attendant, sits high in the mountains, watches
    the battle without fear, sees Camilla killed, and groans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Opis says Camilla suffered a cruel penalty for attempting to attack the Teucrians
    in war, and that Camilla's worship of Diana and carrying of Diana's arrows did
    not save her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Opis says Diana will not leave Camilla dishonored in death, that Camilla's
    death will not be nameless, and that whoever wounded her body will pay with deserved
    death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A large earthen tomb of the ancient Laurentine king Dercennus stands under
    a high mountain and is covered by a dark holm-oak; Opis takes her stand there
    and watches Arruns from above.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Opis sees Arruns rejoicing and swollen with empty pride, calls him doomed,
    and says he will die by Diana's missiles.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Opis draws a golden Thracian arrow from her quiver, bends her bow, and releases
    the shot; Arruns hears the arrow and the iron lodges in his body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Arruns is left dying and groaning in unknown field-dust by his companions;
    Opis is carried on wings to Olympian ether.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After Camilla is lost, her light cavalry wing, the Rutuli, Atinas, leaders,
    and scattered companies flee toward the walls, while no one can withstand the
    attacking Teucrians.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A dark, turbulent dust cloud rolls to the walls, and mothers watching from
    towers beat their breasts and raise a female cry to the stars.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Fugitives rushing through the open gates are crushed by the hostile mixed
    crowd; some die on the threshold among their native walls and homes, while others
    try to close the gates and refuse to admit pleading allies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Before the eyes and faces of weeping parents, excluded fighters fall into
    ditches or ram the barred gates; mothers on the walls throw missiles and imitate
    iron weapons with hard wood, stakes, and burnt poles, eager to die for the walls.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Acca brings Turnus news in the woods that the Volscian battle-lines are destroyed,
    Camilla has fallen, hostile enemies are advancing with favorable war, and fear
    is being carried to the walls.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Turnus, driven by fierce divine powers of Jove, leaves the besieged hills
    and rough woods; Aeneas enters open passes, crosses the ridge, and emerges from
    the dark forest.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Turnus and Aeneas both move rapidly toward the walls with their whole forces
    and are not far apart; each recognizes or perceives the other's approach.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: They would immediately begin battle, but Phoebus bathes his tired horses in
    the Iberian gulf and brings back night as day declines; the forces settle in camps
    before the city and fortify the walls.
  category: sequence
  evidence_refs:
  - ev:13
