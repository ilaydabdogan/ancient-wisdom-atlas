canonical_text:
  quote: ''
  summary: After the meal, wine, bowls, and lights fill the hall. The queen presides
    over a cup ritual, invokes Jupiter, Bacchus, and Juno for guest-right and joy,
    pours a libation, drinks, and passes the cup. Iopas, taught by Atlas, sings of
    celestial bodies, origins, weather, fire, Ocean, and night. The Tyrians and Trojans
    applaud. Dido prolongs the night by asking about Trojan and Greek figures, then
    asks the wandering guest to recount Greek stratagems, his people’s disasters,
    and his travels over land and sea.
  language: Latin
  quote_policy: summarized
