canonical_text:
  quote: ''
  summary: In a duel, a Trojan hero withstands repeated missiles, then drives a spear
    into the opposing warrior's horse, causing it to rear, throw its rider, and fall
    upon him. Aeneas approaches with sword drawn and taunts Mezentius. The Tyrrhenian
    warrior asks only that his body be buried and that he share his son's tomb; he
    then receives the sword in his throat and dies bleeding onto the field.
  language: Latin
  quote_policy: summarized
