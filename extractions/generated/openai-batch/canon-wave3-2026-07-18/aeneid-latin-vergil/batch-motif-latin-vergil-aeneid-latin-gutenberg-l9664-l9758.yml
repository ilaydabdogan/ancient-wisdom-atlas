candidate_motifs:
- id: motif:1
  label: Assumed identity used to alter battle morale
  taxonomy_refs:
  - shapeshifter
  basis: Iuturna assumes Camertus's form, enters the ranks, spreads rumors, and gives
    a speech that changes the warriors' intentions.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage explicitly states imitation of form, but it does not explain
    the mechanism or broader mythic background of the transformation.
- id: motif:2
  label: Bird omen authorizing collective violence
  taxonomy_refs: []
  basis: A sky event involving Jove's bird, a swan, and a flock is hailed as an augury;
    Tolumnius says he recognizes the gods and urges the troops to take up weapons.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The practical meaning is supplied by Tolumnius's interpretation and by
    the narrative statement that Iuturna used the portent to disturb and deceive minds.
- id: motif:3
  label: Broken treaty at sacred altars
  taxonomy_refs: []
  basis: The warriors ask that the treaty be undone; after Tolumnius's spear, altars
    are torn apart and Latinus departs with the disturbed gods and the treaty unfinished.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The larger treaty context is not included beyond this passage.
- id: motif:4
  label: Battlefield killing framed as sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Messapus kills Aulestes near the altars while he is praying and calls him
    a better victim given to the great gods.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The act occurs in battle and is described by the killer's speech; the
    passage does not present it as an orderly ritual sacrifice.
- id: motif:5
  label: Brother group avenges a slain member
  taxonomy_refs: []
  basis: After one of nine brothers is struck by Tolumnius's spear, the remaining
    brothers are inflamed by grief and rush into combat with swords and missiles.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage presents a group of brothers rather than a named sibling pair
    or twin pattern.
- id: motif:6
  label: Death described as sleep and night
  taxonomy_refs: []
  basis: The death after Alsus's axe strike is described as hard rest, iron sleep,
    and eyes hidden in eternal night.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a brief death image rather than a developed afterlife episode.
comparison_claims:
- id: claim:1
  claim: The Iuturna episode can be cautiously compared to a shapeshifter motif because
    the passage explicitly says she assumes Camertus's form in order to act among
    the warriors.
  claim_level: same_motif
  target: shapeshifter motif family
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only the immediate assumed-form action and not a
    full transformation narrative.
- id: claim:2
  claim: 'The bird scene has the same narrative function as a battle augury pattern:
    a bird event is interpreted as divine support and triggers renewed armed action.'
  claim_level: same_function
  target: bird-omen or augury pattern
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs:
  - ev:3
  confidence: medium
  limitations: The narrator also states that Iuturna used the sign to disturb and
    deceive the Italian minds, so the omen's authority is narratively complicated.
- id: claim:3
  claim: The killing of Aulestes can be cautiously compared to a sacrifice motif because
    the killer designates the slain man as a victim given to great gods near the altars.
  claim_level: same_function
  target: sacrifice motif family
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The death occurs in battlefield violence, and the sacrificial framing
    is spoken by Messapus rather than described as a formal rite.
