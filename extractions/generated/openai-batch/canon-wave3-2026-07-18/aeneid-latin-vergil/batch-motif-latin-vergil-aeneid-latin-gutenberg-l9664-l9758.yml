canonical_text:
  quote: ''
  summary: The Rutulians see Turnus's position as unequal and are unsettled. Iuturna,
    assuming Camertus's form, enters the ranks and urges the Rutulians not to abandon
    Turnus. She then gives a sky sign involving Jove's bird seizing a swan and being
    driven off by other birds. Tolumnius interprets the bird event as divine encouragement,
    throws a spear, and battle resumes around the broken treaty altars. Several named
    warriors are then killed or wounded in combat.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Rutulians regard the fight as unequal, and their emotions are mixed and
    unstable.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turnus advances silently, venerates an altar with lowered eyes, and is described
    as pale with wasting cheeks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Iuturna sees talk spreading and the crowd's hearts wavering, assumes the form
    of Camertus, enters the battle lines, and spreads varied rumors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In her speech, Iuturna asks whether the Rutulians are ashamed to expose one
    life for all, denies that they are inferior in number or strength, and warns that
    they will lose their homeland and obey proud masters if they remain inactive.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speech inflames the young warriors; the Laurentes and Latini are changed,
    want arms, ask that the treaty be made void, and pity Turnus's unequal lot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Iuturna adds a greater sign from the high sky, which the passage says disturbed
    Italian minds and deceived them by a portent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A tawny bird of Jove pursues shore birds in the red sky, seizes an excellent
    swan near the water, is mobbed by the other birds, drops the prey into the river,
    and flees into the clouds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Rutulians greet the bird event as an augury; Tolumnius says he accepts
    and recognizes the gods and urges the warriors to take up weapons.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tolumnius throws a spear toward the enemy; the spear strikes one of nine handsome
    brothers and spills him onto the yellow sand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The slain youth's brothers, inflamed by grief, take up swords and missiles
    and rush blindly into fighting.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The altars are torn apart, missiles fill the sky like a storm or iron rain,
    and Latinus departs carrying the disturbed gods with the treaty unfinished.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Messapus charges Aulestes, who falls among the altars; Messapus strikes him
    from horseback while he prays and calls him a better victim given to the great
    gods.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Corynaeus takes a burned torch from an altar, thrusts flames into Ebusus's
    face, seizes him by the hair, forces him down, and wounds him with a sword.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Podalirius pursues Alsus with a naked sword; Alsus uses an axe to split his
    opponent's face, and the victim's eyes are covered in death described as hard
    rest, iron sleep, and eternal night.
  category: sequence
  evidence_refs:
  - ev:10
