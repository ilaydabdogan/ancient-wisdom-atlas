canonical_text:
  quote: ''
  summary: Aeneas orders the fleet to set sail. Palinurus leads the course at night
    while the sailors rest. Somnus descends, appearing like Phorbas, and urges Palinurus
    to sleep, but Palinurus refuses to trust calm sea and sky and holds the helm.
    The god uses a Lethean and Stygian sleep-branch, causing Palinurus to fall into
    the sea with part of the stern and the rudder. The fleet continues safely by Neptune’s
    promise, passes the rocks of the Sirens, and Aeneas takes the helm and laments
    Palinurus.
  language: Latin
  quote_policy: summarized
