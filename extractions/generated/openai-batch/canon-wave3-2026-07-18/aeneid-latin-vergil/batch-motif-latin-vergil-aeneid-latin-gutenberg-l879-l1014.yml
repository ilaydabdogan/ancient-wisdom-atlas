candidate_motifs:
- id: motif:1
  label: deceptive gift concealing armed enemies
  taxonomy_refs:
  - trickster_boundary
  basis: The Greeks make a horse presented as a votive object, secretly conceal armed
    men inside, leave it for the Trojans, and Sinon is introduced as one prepared
    to use deceit to open Troy.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:9
  confidence: high
  cautions: 'The taxonomy reference is functional: the passage shows trickery enabling
    a hostile crossing into the city, but the taxonomy label is not named in the text.'
- id: motif:2
  label: feigned departure before infiltration
  taxonomy_refs:
  - departure
  basis: The Greeks hide at Tenedos while the Trojans believe they have departed for
    Mycenae, leading the city to open its gates and inspect the deserted camp.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The departure is a tactical feint rather than a completed heroic departure
    pattern.
- id: motif:3
  label: ignored warning against fatal object
  taxonomy_refs:
  - wisdom
  basis: Capys and Laocoon warn against the horse and advise testing or destroying
    it, while other Trojans marvel at it and urge admitting it within the walls.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The excerpt ends before the horse is admitted; the fatal outcome is anticipated
    by Aeneas' retrospective comments rather than completed within this passage segment.
- id: motif:4
  label: blood sacrifice demanded for safe return
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Sinon's reported oracle says winds were appeased by blood and a slain virgin
    and that the Greeks must seek return with blood and an Argive life.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This motif occurs inside Sinon's speech, which the narration explicitly
    marks as feigned; it is a narrated claim within the deception, not independently
    verified within the passage.
- id: motif:5
  label: divine fate overriding human detection
  taxonomy_refs:
  - divine_judgment
  basis: After Laocoon's spear makes the horse resound, Aeneas says Troy would still
    stand if the gods' fates and mind had not been against them.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage speaks of fate and gods, but it does not present a formal
    judgment scene.
