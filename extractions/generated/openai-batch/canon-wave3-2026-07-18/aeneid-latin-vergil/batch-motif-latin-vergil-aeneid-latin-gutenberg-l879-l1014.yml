canonical_text:
  quote: timeo Danaos et dona ferentis
  summary: 'Aeneas begins recounting Troy''s last crisis: the Greeks build and abandon
    a huge wooden horse containing armed men, the Trojans debate what to do with it,
    Laocoon warns against it and strikes it with a spear, and the captive Sinon begins
    a deceptive account involving Palamedes, Ulysses, Calchas, Apollo''s oracle, and
    a demanded blood-sacrifice for Greek return.'
  language: Latin
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Aeneas addresses a queen and says he is being asked to renew grief by telling
    how the Greeks overthrew Trojan power and the lamentable kingdom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Greek leaders, described as broken by war and repelled by fate, construct
    a horse like a mountain by divine art associated with Pallas and cover its ribs
    with cut fir.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Selected men are secretly enclosed in the horse's blind side, and its great
    caverns and belly are filled with armed soldiers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Greeks sail to Tenedos and conceal themselves on a deserted shore; the
    Trojans think they have gone to Mycenae and open their gates.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Trojans go out to view the deserted Greek camp, the abandoned places, and
    the shore left behind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some Trojans marvel at the horse as a deadly gift of Minerva; Thymoetes urges
    that it be brought within the walls and placed on the citadel.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Capys and others advise either casting the suspected Greek gift into the sea,
    burning it, or boring into the hollow belly to test the hidden places.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Laocoon runs down from the citadel with a crowd, calls the Trojans mad, warns
    that Greek gifts may contain tricks, and says not to trust the horse.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Laocoon hurls a strong spear into the horse's side and curved belly; the spear
    sticks trembling, and the shaken belly and hollow caverns resound.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A bound young man is brought to the king by Trojan shepherds; the narration
    says he had offered himself to open Troy to the Greeks, ready either to practice
    deceit or to die.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Trojan youth crowd around the captive and compete in mocking him; Aeneas
    frames this as an example of Greek ambushes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The captive laments that neither land nor sea can receive him, claims he has
    no place among the Greeks, and says the Trojans seek blood-penalties from him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: After hearing the captive's lament, the Trojans' anger is checked and they
    urge him to state his origin, purpose, and source of confidence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Sinon says he will confess the truth, does not deny he is of the Argive people,
    and names himself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Sinon tells of Palamedes, whom he says the Greeks killed while innocent under
    a false charge of treachery because he opposed the war.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Sinon claims he was Palamedes' companion and kinsman, that Ulysses' envy caused
    his suffering, and that Ulysses spread ambiguous accusations against him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Trojans grow eager to ask for causes, while the narration says they are
    ignorant of Pelasgian crimes and arts; Sinon continues while trembling and speaking
    with a feigned heart.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Sinon says the Greeks often wished to leave Troy, but rough winter on the
    sea and the south wind frightened them, especially after the wooden horse was
    built.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: Sinon reports that Eurypylus was sent to ask Phoebus' oracle and returned
    with words that winds had first been appeased by blood and a slain virgin, and
    that Greek return must be sought with blood and an Argive life.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: When this reported oracle reaches the common people's ears, they are stunned
    and tremble over whom the fates prepare and whom Apollo demands.
  category: sequence
  evidence_refs:
  - ev:9
