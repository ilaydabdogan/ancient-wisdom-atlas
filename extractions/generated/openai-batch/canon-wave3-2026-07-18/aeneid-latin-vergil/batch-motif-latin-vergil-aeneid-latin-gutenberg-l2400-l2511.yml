canonical_text:
  quote: ''
  summary: Achaemenides, a poor Ithacan companion of Ulysses, tells how he was abandoned
    in Polyphemus' cave, where the Cyclops ate men and was later blinded by Ulysses
    and his companions. He warns Aeneas' company to flee the Cyclopes' coast. Aeneas'
    party sees the blinded Polyphemus with sheep and a pine staff, receives Achaemenides
    as a suppliant, cuts the cable, and escapes by sea while Polyphemus roars and
    other Cyclopes gather. The narrative then follows a Sicilian coastal itinerary,
    mentions the hidden waters of Alpheus and Arethusa at Ortygia, worship of local
    powers, and Aeneas' loss of his father Anchises at Drepanum before Aeneas ends
    his account.
  language: Latin
  quote_policy: summarized
