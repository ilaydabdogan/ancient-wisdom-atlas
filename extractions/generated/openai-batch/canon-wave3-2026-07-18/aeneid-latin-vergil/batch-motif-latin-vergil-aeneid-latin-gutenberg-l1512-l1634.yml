canonical_text:
  quote: ''
  summary: Venus appears to Aeneas in divine brightness, restrains him, reveals that
    the gods themselves are overthrowing Troy, and commands him to flee to his family.
    Aeneas reaches his house through flames and enemies. Anchises at first refuses
    to leave, Aeneas prepares to return to battle, and Creusa pleads at the threshold.
    A harmless flame appears around Iulus' head; after Anchises prays, thunder and
    a fiery star mark a path toward Ida, and Anchises accepts the divine sign and
    agrees to depart.
  language: Latin
  quote_policy: summarized
