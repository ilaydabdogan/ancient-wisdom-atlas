canonical_text:
  quote: ''
  summary: At the opening of Book XI, Aeneas fulfills vows at dawn by setting up an
    oak trophy with Mezentius’ captured arms. He exhorts his companions to prepare
    for further war while burying the dead, and orders Pallas to be sent home with
    funeral honors. Aeneas then laments over Pallas’ body, sends an escort to Evander,
    arranges the bier and shroud, adds spoils, weapons, horses, bound captives, chariots,
    and mourning companions to the procession, says a final farewell to Pallas, and
    returns toward the camp and walls.
  language: Latin
  quote_policy: summarized
