canonical_text:
  quote: ''
  summary: Allecto moves from Turnus toward the Trojans, causes Iulus' hunting dogs
    to pursue a tame stag, and the stag is shot by Ascanius. The wounded animal returns
    bleeding to Tyrrhus' household, Silvia summons the local farmers, and Allecto
    intensifies the crisis with a Tartarean horn-call. Farmers and Trojans arm and
    fight; Almo and Galaesus die. Allecto reports her success to Juno, is dismissed
    from the upper air, and departs through an Italian underworld landscape at Amsanctus
    associated with Cocytus, Dis, and Acheron.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While Turnus is filling the Rutuli with bold spirits, Allecto moves toward
    the Trojans on Stygian wings and locates Iulus hunting animals along the shore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Allecto gives Iulus' dogs sudden madness and uses a familiar scent so that
    they pursue a stag; the passage names this as the first cause that inflames the
    rural people toward war.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stag is unusually beautiful and large-horned, was taken from its mother
    as a young animal, and is raised by Tyrrhus' household; Silvia adorns, combs,
    and washes it, and it is accustomed to human hands and the household table.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ascanius/Iulus, eager for praise, shoots the stag with an arrow; the passage
    says a god was not absent from his uncertain hand, and the arrow passes through
    the animal's belly and flank.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wounded stag returns bleeding and groaning to familiar shelter and fills
    the house with a cry likened to imploring; Silvia beats her arms, calls for help,
    and summons the hard rural men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The farmers arrive unexpectedly, arming themselves with a burnt brand, a heavy
    knotted stake, or whatever anger makes into a weapon; Tyrrhus calls a band while
    holding an axe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Allecto climbs to the roof of the stable, sounds a pastoral signal with a
    curved horn, and stretches a Tartarean voice through it; woods, lakes, rivers,
    and mothers with infants respond in fear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the horn-call, farmers gather with seized weapons, and Trojan youth come
    from the open camp to help Ascanius; the confrontation changes from rustic weapons
    to drawn swords.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Almo, the eldest son of Tyrrhus, is killed by an arrow wound under the throat;
    Galaesus, an old and just man who places himself between the sides for peace,
    is also killed amid many bodies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Allecto tells Juno that discord has been accomplished and that she has stained
    the Trojans with Italian blood; she offers to spread war through nearby cities,
    but Juno says there has been enough terror and fraud and tells her to leave.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Allecto lifts wings that hiss with snakes, goes to Cocytus, and leaves the
    upper world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Amsanctus is described as an Italian place under high mountains, dark with
