canonical_text:
  quote: ''
  summary: Aeneas addresses a king as a willing supplicant, grounds his appeal in
    divine oracles, fate, fame, and shared descent from Atlas, asks for mutual fides
    against the Daunians, and is received by the king, who recalls Anchises, promises
    aid, invites the visitors to annual sacred rites, and seats them at a sacrificial
    meal.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aeneas addresses the king with friendly words and says Fortune made him come
    as a petitioner with filleted branches.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aeneas says he was not deterred by the king being Greek-born, Arcadian, or
    connected with the Atridae, but came because of his own valor, divine oracles,
    kindred fathers, the king's fame, and fate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aeneas recounts a genealogy in which Dardanus comes from Electra, Electra
    from Atlas, Mercury is father to the king's people, Maia bears Mercury on Cyllene,
    and Maia is also generated by Atlas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aeneas states that both lineages divide from one blood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aeneas says he did not arrange envoys or first trials by craft, but came himself
    and exposed his own head as a supplicant at the threshold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aeneas says the same Daunian people pursues both sides in cruel war and asks
    the king to accept and give fides.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king studies the speaker's mouth, eyes, and whole body before replying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king gladly receives and recognizes Aeneas, recalling the words, voice,
    and face of Anchises.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king recalls Priam visiting Hesione's realm and coming into the cold Arcadian
    lands, and remembers admiring Trojan leaders in his youth, especially Anchises.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king says he wished to speak with Anchises and join right hand to right
    hand.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The king says Anchises gave him a notable quiver, Lycian arrows, a gold-woven
    cloak, and two golden bridles that Pallas now has.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The king declares that his right hand is joined by treaty to the request,
    promises aid and resources at the next dawn, and invites the visitors to annual
    sacred rites that may not be deferred.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: After speaking, the king orders food and cups to be set again, places the
    men on grassy seating, and receives Aeneas in a special place with a shaggy lion
    skin and a maple seat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Chosen youths and an altar priest bring roasted bull entrails, load baskets
    with grain-gifts, serve wine, and Aeneas with the Trojan youth eat from the ox
    and lustral entrails.
  category: action
  evidence_refs:
  - ev:6
