canonical_text:
  quote: ''
  summary: Pyrrhus and Greek forces breach Priam's palace amid fire and slaughter.
    The narrator witnesses the royal household's panic, Priam's attempt to arm himself,
    the royal women gathered at an altar beside an old laurel, Polites' death before
    his parents, and Pyrrhus' killing of Priam at the altar. The narrator then reacts
    with horror and, in the bracketed final portion, sees Helen hiding at Vesta's
    threshold and imagines vengeance against her.
  language: Latin
  quote_policy: summarized
