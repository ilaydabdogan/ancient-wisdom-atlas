canonical_text:
  quote: ''
  summary: In burning Troy, the first-person narrator organizes an escape with his
    father, son, wife, servants, ancestral sacred objects, and household gods. During
    flight, Creusa is lost. He hides the others, returns armed through the captured
    city to search for her, and sees Greek plunder and captives. Creusa’s shade appears,
    says divine will prevents her departure, foretells his exile across the sea to
    Hesperia and future rule, and vanishes when he tries to embrace her. At dawn he
    rejoins a gathered exile band and departs toward the mountains carrying his father.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fire is heard more clearly through the city walls, and the heat of the burning
    draws nearer.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker tells his father to climb onto his shoulders, says the danger
    and safety will be shared, assigns Iulus as companion, tells his wife to follow
    at a distance, and addresses the servants.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A mound, an old temple of deserted Ceres, and an ancient cypress are designated
    as the shared meeting place after leaving the city.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The father is told to take the sacred objects and ancestral Penates; the speaker
    says it is wrong for him to touch them after recent battle and bloodshed until
    he has washed in living water.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker covers his shoulders and neck with a garment and lion skin, takes
    up the burden, has Iulus clasp his right hand, and is followed by his wife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker, who had not feared weapons and Greek ranks before, is now frightened
    by every breeze and sound because he fears for both companion and burden.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Near the gates the father sees enemies approaching with burning shields and
    shining bronze and warns his son to flee.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In confusion the speaker leaves the known roads; Creusa is lost, and at the
    Ceres meeting place she alone is missing from the assembled group.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker entrusts Ascanius, Anchises, the Teucrians, and the Penates to
    companions in a hidden valley, arms himself, and returns through Troy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Greek forces have entered the house and occupy it; fire rises over the roof,
    and Phoenix and Ulixes guard Trojan treasure, divine tables, golden vessels, clothing,
    boys, and frightened mothers in Juno’s asylum.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker calls Creusa repeatedly through the darkness; her unhappy image
    and shade appear before him, larger than the form he knew.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Creusa’s shade says the events are not without divine will, says he may not
    carry her away as companion, foretells exile, sea travel, Hesperia, the Tiber,
    prosperity, kingship, and a royal wife, and says the great mother of the gods
    detains her.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: After speaking, Creusa’s shade leaves the speaker weeping; three times he
    tries to put his arms around her neck, and three times the image escapes his hands
    like light winds or a winged dream.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: At the end of night the speaker returns to his companions, finds many new
    men and women gathered for exile and ready to follow by sea, sees dawn rising
    over Ida while the Greeks hold the gates, and departs to the mountains carrying
    his father.
  category: sequence
  evidence_refs:
  - ev:11
