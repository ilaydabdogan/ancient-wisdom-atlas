canonical_text:
  quote: ''
  summary: The passage lists peoples in several countries and says that all peoples
    throughout the seven regions descend from the lineage of Fravak, son of Siyakmak,
    son of Mashya. It then states that ten varieties of man and fifteen races from
    Fravak make twenty-five races from the seed of Gayomard, and it enumerates unusual
    human varieties such as earth, water, breast-eared, breast-eyed, one-legged, bat-winged,
    forest, tailed, and hairy-bodied groups. The notes identify some country names
    with Avestan or historical-geographic equivalents and mention a separate tree
    in connection with the varieties.
  language: English
