canonical_text:
  quote: ''
  summary: 'The passage summarizes manuscript and translation history for the Bundahis:
    an old codex brought to Europe by Haug is now at Munich and differs from K20 in
    order and omissions; Justi published a German translation and Pahlavi text materials
    in 1868 using manuscripts related to M6; other European writers studied parts
    of the work; the present translator states a literal translation policy and cautious
    use of earlier translations.'
  language: English
  quote_policy: summarized
