canonical_text:
  quote: that which rains also rains more noxious creatures than water
  summary: 'The passage describes a deteriorated future period at the end of Zaratusht’s
    millennium: false speech and false oaths are accepted, priests and disciples act
    viciously and neglect ceremonies, mankind disregards revelation, rain and waters
    fail or become harmful, domestic animals decline in fertility and strength, misgovernment
    makes life unbearable, and ritual observances continue without firm belief or
    lawful reward.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Certain people accept the words of ignoble, slanderous, disreputable, mocking,
    and diversely opinioned speakers as true and credible.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oaths are taken with falsehood, false evidence is given, and false and irreverent
    speech is directed about Auharmazd.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those bearing the title of priest and disciples wish evil toward one another,
    speak and look upon vice, commit sins, become enemies of the good, neglect ceremonies,
    and have no fear of hell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The antagonism of Aharman and the demons is said to be much brought on by
    the conduct of priests and disciples.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the tenth hundredth winter, described as the end of Zaratusht’s millennium,
    all mankind binds torn hair and disregards revelation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A willingly disposed cloud and righteous wind are unable to produce rain in
    its proper time and season.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A dark cloud makes the whole sky night; hot and cold winds arrive; rain fails
    or rains more noxious creatures than water; rivers and springs diminish and do
    not increase.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Beasts of burden, oxen, sheep, and horses suffer reduced fertility, poorer
    birth, diminished milk quality, and reduced strength or agility.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men wearing the sacred thread-girdle are afflicted by misgovernment and false
    judgment so severely that living is impossible and death is sought as a boon.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Youths and children are apprehensive, and gossiping chitchat and gladness
    of heart do not arise among them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: People practice ancestral feasts, propitiation of angels, and prayers and
