  summary: The passage is an introductory philological discussion of the age and manuscript
    transmission of the Shayast la-shayast. It cites manuscript evidence, colophons,
    quotations from older commentaries and lost Nasks, and limits inferred from the
    formation date of the Pahlavi Vendidad.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All three parts of the treatise are said to occur in manuscript M6, dated
    A.D. 1397, while nearly the whole also occurs in K20, which may be slightly older
    and contains a Persian colophon dated A.Y. 700 / A.D. 1331.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The text in M6 and K20 is described as having been derived almost directly
    from the same older original, with some words already illegible to the copyist
    of M6.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A portion of M6 containing the book of Arda-Viraf and the tale of Gosht-i
    Fryano is said to have been copied from a manuscript written in A.D. 1249, and
    the editor infers that the Shayast la-shayast was copied from the same or an equally
    old manuscript.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that internal evidence points to greater antiquity for
    the first two parts because their compilers had access to old commentaries and
    many Nasks that had long been lost.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first treatise is said to quote several named commentators and eleven
    lost Nasks, as well as the Vendidad.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The second treatise is said to mention Vand-Auharmazd and to quote eight Nasks
    no longer extant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage notes that fragments of the Bagh and Hadokht Nasks may survive,
    that the Damdad, Husparam, and Sakadum Nasks existed around A.D. 881, and that
    the Dinkard preserves information about Nask contents but may compile older fragments.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The editor concludes that the first two treatises called Shayast la-shayast
    are more than a thousand years old, but cannot be more than about three centuries
    older because they quote the Pahlavi Vendidad in a form dated no earlier than
    the reign of Khusro Noshirvan.
  category: sequence
  evidence_refs:
  - ev:5
