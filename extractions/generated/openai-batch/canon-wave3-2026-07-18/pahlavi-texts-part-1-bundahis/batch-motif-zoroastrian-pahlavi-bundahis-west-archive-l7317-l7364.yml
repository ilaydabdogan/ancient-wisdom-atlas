canonical_text:
  quote: ''
  summary: The passage describes formed body and growth mingling again with rivers;
    three named river spirits refusing to flow into the world because of stagnant-water
    defilement until Zaratui^t is shown to them; Auharmazd saying he will create Zaratui^t,
    who will pour sixfold holy-water into the water, make it wholesome, and preach
    carefulness. It also describes water returning to sources in three, six, or nine
    years according to the balance of holy-water and pollution, compares plant growth
    and roots to this pattern, says blessings uttered by the righteous return to them,
    and states that Frasiyaz^ of Tur conducted the river Nahvtak away.
  language: English
  quote_policy: summarized
