  quote: ''
  summary: The passage gives ritual rules concerning the efficacy of the Ahunavar
    saying, treatment of the hedgehog, recitation of Ashem-vohu before washing the
    face, and the selection and conduct of purifiers responsible for ablution, consecrated
    water, bull's urine, the purifying bowl, and a measured purification place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ahunavar is described as the most triumphant among sayings that are spoken
    out, especially in connection with seasonal festival observance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rule says that when one sees a hedgehog, one takes it back to the plain
    and preserves its own place free from danger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that when a hedgehog voids urine into an ant's nest, a
    thousand ants die.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some members of the good religion say that Ashem-vohu should be uttered before
    washing the face, not while washing, because of doubt about water coming to the
    mouth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Selection from among purifiers concerns a case where purity and impurity are
    important and where control of ablution and non-ablution is connected with a particular
    man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man selected as purifier is to be considered with regard to good disposition,
    truthful speaking, the particular work, and innocence, and is considered more
    righteous on that account.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A cited Vendidad passage describes a righteous man as a purifier, truthful
    speaker, enquirer of sacred texts, ritual performer, and one who understands purification
    and religious formulas.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When control of ablution is connected with the purifier, the purifying bowl
    is treated as his, others abstain from it, and angels hear and consider them clean.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those who consecrate water and bull's urine are selected for their control
    of purification, and the work is to be performed observantly at a place measured
    very exactly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note explains the purifiers as priests retaining enough purifying effect
    of the Bareshnum ceremony to assist in purifying others; when that effect passes,
    a priest must undergo nine nights' purification again before performing sacred
    rites.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note describes the Bareshnum-gah as a place prepared for purification with
    bull's urine and water, marked out with furrows and furnished with stones for
    ablutions.
  category: setting
  evidence_refs:
  - ev:8
