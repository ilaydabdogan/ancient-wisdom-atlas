- id: obs:3
  text: Many passages are said to appear to be translations from an Avesta original,
    and the Bundahis is described as probably a translation or epitome of the Damdad
    Nask.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Damdad Nask is summarized as explaining spiritual existence, heaven, good
    and evil, material existence, the sky, the earth, and the characteristics of all
