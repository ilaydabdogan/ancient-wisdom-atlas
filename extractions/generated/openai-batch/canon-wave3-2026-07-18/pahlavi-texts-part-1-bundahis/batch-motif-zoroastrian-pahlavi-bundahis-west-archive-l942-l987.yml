canonical_text:
  quote: ''
  summary: The introductory passage describes the Bundahis as fragmentary, notes manuscript
    variation, and suggests that parts may translate or epitomize the Damdad Nask.
    It summarizes that Nask as treating spiritual and material existence, heaven,
    good and evil, sky and earth, Auharmazd's production of beings and natural domains,
    resurrection, future existence, the bridge where concourse and separation occur,
    and postmortem reward and punishment. It also notes genealogies, chronology, and
    early European manuscript transmission.
  language: English
  quote_policy: summarized
