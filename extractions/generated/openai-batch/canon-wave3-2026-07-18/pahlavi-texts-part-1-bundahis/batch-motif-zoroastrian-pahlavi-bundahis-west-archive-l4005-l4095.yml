canonical_text:
  quote: ''
  summary: The passage describes the evil spirit remaining confused for three thousand
    years because of fear connected with the righteous man. Demonic arch-fiends fail
    to rouse him. Geh then succeeds by promising to harm the righteous man, the labouring
    ox, water, plants, the fire of Auharmazd, and all creation. The evil spirit rises,
    kisses Geh, menstruation appears in her, she asks him for a man, and he appears
    to her as a young man while his form is described as a log-like lizard body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The evil spirit sees the impotence of himself and the confederate demons because
    of the righteous man and remains confused for three thousand years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The arch-fiends of the demons address the evil spirit as their father and
    tell him to rise so they may cause conflict in the world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The arch-fiends twice recount their evil deeds, but the evil spirit is not
    pleased and cannot lift his head through fear of the righteous man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Geh comes at the completion of the three thousand years, shouts to the evil
    spirit, and twice recounts her evil deeds, but this first does not make him rise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Geh says she will bring vexation on the righteous man and the labouring ox,
    destroy their living souls, and vex water, plants, the fire of Auharmazd, and
    the whole creation of Auharmazd.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Geh repeats these deeds a second time, the evil spirit is delighted
    and starts up from confusion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The evil spirit kisses Geh on the head, and the pollution called menstruation
    becomes apparent in Geh.
  category: action
  evidence_refs:
  - ev:6
