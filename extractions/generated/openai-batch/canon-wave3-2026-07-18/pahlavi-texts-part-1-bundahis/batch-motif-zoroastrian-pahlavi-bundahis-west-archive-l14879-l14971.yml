  quote: ''
  summary: The passage gives ritual rules for carrying a pregnant woman's corpse,
    cleansing the carriers by the Bareshnum ceremony, directing the corpse's head
    toward the Dakhma, and avoiding contamination when corpses are carried. The notes
    explain the Bareshnum, the Dakhma, the exceptional handling of a pregnant corpse,
    and the later Parsi rationale for exposure of the dead.
