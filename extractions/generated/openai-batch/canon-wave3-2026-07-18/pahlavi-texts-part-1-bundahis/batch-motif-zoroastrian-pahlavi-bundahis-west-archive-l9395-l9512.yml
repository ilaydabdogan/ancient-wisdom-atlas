canonical_text:
  quote: ''
  summary: The passage describes Soshyans and his assistants assigning recompense
    according to deeds by Auharmazd's order, the conveying of the righteous to paradise,
    a condition of nakedness for one lacking specified worship, rite, and gift, and
    later the seizure or smiting of opposing evil powers by Auharmazd, Srosh, and
    other named figures. It ends with Auharmazd coming to the world as Zota, Srosh
    as Raspi, and Auharmazd holding the Kusti.
  language: English
  quote_policy: summarized
