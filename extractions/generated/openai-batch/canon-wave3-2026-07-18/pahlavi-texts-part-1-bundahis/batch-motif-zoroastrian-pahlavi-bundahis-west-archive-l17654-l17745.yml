canonical_text:
  quote: "“he is not on the way to hell, owing to his renunciation”"
  summary: Neryosang discusses renunciation of sin, mortal sins, priestly retribution,
    sins against accusers, debts in the future existence, female atonement, botanical
    analogies for the stem of sin, and punishment of three nights. Kushtanobud adds
    that sins affecting accusers stay away when renunciation is performed.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Neryosang states that renunciation should be performed even when a sin is
    not mentally originating with a person.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When many mortal sins are committed and the person mentally renounces each
    separately, the person is described as not being on the way to hell because of
    renunciation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If there is a sin for which the person is not in renunciation, the way to
    hell is described as not closed to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says it is allowable to appoint priestly retribution to atone
    for an unrenounced sin, and to inflict it justly and strongly if it is appointed
    but not fully atoned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: For sin committed against accusers, the passage says action is needed so that
    the head of the family does not become evil-minded and does not divorce the wife
    from matrimony.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: For sin against accusers, the person is to engage in renunciation before the
    accusers, or before high-priests if not before the accusers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says sin against accusers becomes debts; debt does not make a
    man wicked, but in the future existence the accusers may forsake him, causing
    shame and disturbing enjoyment.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: When the female has atoned for the sin affecting accusers, the stem of the
    sin is described as atoned for.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Opinions are reported that the stem has no root, or that it is like a tree
    whose leaves wither away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: For sin relating to the soul, renunciation causes the sin to stay away from
    the person.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: If sin relating to the soul is not fully atoned for, the passage says they
