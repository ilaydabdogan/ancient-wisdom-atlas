canonical_text:
  quote: ''
  summary: The passage gives rules concerning pregnancy, childbirth, purity, and household
    offspring. It instructs that a well-maintained fire be kept in a house during
    pregnancy, citing the story that Dukdav was protected by fire while pregnant with
    Zaratust when a leader with many demons came to destroy him. It also instructs
    that a fire and pure incense be maintained for three days after a child is born
    to protect against demons, wizards, and witches. Further rules concern removing
    bark from a toothpick because of a pregnant woman's possible contact with discarded
    dead matter, and accepting male offspring of a handmaid as sons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a woman becomes pregnant, the rule says that, as far as possible, a well-cared-for
    fire is to be maintained in the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that Dukdav, while pregnant with Zaratust, was approached
    for three nights by a leader with one hundred and fifty demons seeking Zaratust's
    destruction, but the fire in the dwelling prevented them from finding a means
    to do it.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:3
  text: Where a child is born, the rule says that for three days a fire is to be made
    at night until daylight, maintained during the day, and supplied with pure incense
    for protection from demons, wizards, and witches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The rule says bark is to be cut off from a toothpick, because a discarded
    toothpick with bark can create doubt about dead matter if a pregnant woman steps
    on it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The rule says that a person who has a handmaid in cohabitation should accept
    male offspring born from her as sons, while female offspring are described as
    no advantage because an adopted son is required.
  category: relationship
  evidence_refs:
  - ev:5
