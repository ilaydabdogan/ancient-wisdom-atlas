canonical_text:
  quote: ''
  summary: The passage gives rules for menstruation-related impurity, washing, distance
    from sacred or ritual objects, pregnancy or miscarriage cases, contact and sexual
    intercourse penalties, and escalating sins when a menstruous woman sees, approaches,
    or touches fire, ashes, or a water goblet. Editorial notes compare some rules
    with Hebrew law and Avesta/Vendidad passages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a second menstruation, the woman is described as not in cleanliness
    for nine days and nights, which are days and nights for watching, and is then
    to be washed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Leucorrhoea that has changed colour, whether before or after menstruation,
    is said to have pollution like that of menstruation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the woman is completely clean from menstruation so that washing may be
    as usual, she does not pollute the sacred twigs or other things when beyond three
    steps.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because of severe cold, she may sit out toward the fire; while washing, a
    prayer is to be taken inwardly, and washing the hands except with bull's urine
    is not proper until then.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After her hands are washed, she is to destroy two hundred noxious creatures
    as atonement for sin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman whose pregnancy is certain and who sees she is polluted after the
    menstruation period is to be washed with bull's urine and water unless miscarriage
    is evident; if pregnancy is not certain she is considered menstruous, and additional
    opinions are reported for miscarriage doubt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Anyone who contacts a menstruous woman, or a person who must be washed with
    water and bull's urine, incurs the root of a sin of sixty stirs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person who knowingly has sexual intercourse with a menstruous woman incurs
    the root of a sin of fifteen Tanapuhars and sixty stirs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For a menstruous woman, seeing fire, going within three steps of it, and putting
    a hand on the fire itself are assigned escalating sins; the same pattern is stated
    for ashes and a water goblet.
  category: sequence
  evidence_refs:
  - ev:6
