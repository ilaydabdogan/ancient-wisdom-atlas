  quote: ''
  summary: 'The passage states that revelation describes thirty-three kinds of land.
    It then describes a day when Tt^''tar produced rain, seas arose from it, and the
    whole place, half covered by water, was divided into seven portions: one middle
    portion and six surrounding portions. A note explains uncertainty in the reference
    to Khvaniras or to one portion.'
