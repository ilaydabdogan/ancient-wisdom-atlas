canonical_text:
  quote: ''
  summary: The passage discusses the probable dating, redaction, and manuscript transmission
    of the Bundahis, then summarizes the headings of a Gujarati paraphrase. The listed
    chapter topics include Ahuramazd's covenant, cosmological accounts of sky, creation,
    Mount Alborz, zodiac, stars, soul, Ahereman's assaults on the sky, fire, the primeval
    ox, and Gaiomard, the roles of Ahuramazd and Ahereman, waters and rivers, noxious
    creatures, stars opposing demons, products of the primeval ox, birds, plants,
    flowers, and celestial revolutions.
  language: English
  quote_policy: summarized
