canonical_text:
  quote: ''
  summary: The passage states ritual claims about prayer, Gatha-hymns, righteousness,
    and remaining in the Mazdayasnian religion. Auharmazd addresses righteous Zaratust,
    saying that within the nine thousand years he created mankind will become most
    perplexed in a future perplexing time. He compares that future distress with the
    evil reigns of Kz-Dahak and Frasiyaz of Tur, when mankind was said to live better
    and with less disturbance from Aharman and demons. At the end of Zaratust's millennium,
    towns of Iran are foretold as desolated or ploughed up by horses, with banners
    reaching Patashkhvargar and sovereignty of the approved religious seat carried
    away. The passage closes by saying that Auharmazd rewards those who worship him
    with reverence.
  language: English
  quote_policy: summarized
