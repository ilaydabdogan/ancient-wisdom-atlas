canonical_text:
  quote: ''
  summary: The passage describes a righteous white-bodied three-legged ass with spiritual
    food, six eyes, nine mouths, enormous feet and ears, and one hollow gold-like
    horn with many branch horns. Its horn destroys corruption caused by noxious creatures.
    When the ass enters the ocean, its ears agitate the waters and make the side of
    Ganiva tremble; its cry makes female water-creatures of Auharmazd pregnant and
    causes pregnant noxious water-creatures to cast their young. Its staling in the
    ocean purifies sea-water in the seven regions from contamination and poison of
    the evil spirit. TLvtar is said to seize water from the ocean with the ass’s assistance,
    and ambergris is declared to be the ass’s dung. A final notice says the ox Hadhayos,
    called Sarsaok, once carried men from region to region in the original creation.
  language: English
  quote_policy: summarized
