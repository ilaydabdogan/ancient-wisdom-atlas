  quote: ''
  summary: The passage describes how, after the primeval ox died, grain, medicinal
    plants, specific plants, and animals arose from its marrow, body parts, and purified
    seed. The ox's seed is carried to the moon station, purified, and from it animal
    species are produced and released on earth, first as a male and female ox pair
    and then as pairs of each species.
