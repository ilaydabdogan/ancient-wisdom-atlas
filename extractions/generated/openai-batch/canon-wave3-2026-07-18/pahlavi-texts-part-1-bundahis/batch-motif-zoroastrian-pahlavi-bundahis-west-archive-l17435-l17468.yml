canonical_text:
  quote: ''
  summary: The passage states that sin affecting accusers must be atoned for among
    the accusers. An explanatory note distinguishes hamemal sins, which injure another
    person or animal who becomes an accuser, from rubanik sins, which affect only
    the sinner's own soul. It also summarizes a Rivayat teaching in which an unatoned
    hamemal sin can stop the soul at a bridge on the way to the other world until
    the accuser is satisfied, after which the soul is disposed according to the balance
    of good and bad actions.
