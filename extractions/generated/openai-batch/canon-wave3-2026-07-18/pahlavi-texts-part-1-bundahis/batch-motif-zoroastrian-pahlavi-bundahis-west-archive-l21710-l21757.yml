  quote: ''
  summary: Aharman tells an addressee to enter a season-festival and a sacred feast
    because theft or chatter by one attendee would violate those rites. He then tells
    the addressee to avoid next-of-kin marriage, saying he has no remedy for it and
    that one who has approached it four times will not be parted from the possession
    of Auharmazd and the archangels. Translator notes define the sacred feast and
    comment on the religious merit and obscurity of next-of-kin marriage passages.
