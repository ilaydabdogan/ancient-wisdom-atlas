  quote: ''
  summary: 'The passage gives a reckoning of cosmic years: twelve thousand years total,
    including three thousand years of spiritual existence and three thousand years
    associated with Gayomard and the ox in the world. It describes zodiacal millennium
    reigns, the adversary''s entry at Libra, Gayomard''s thirty years of tribulation,
    the maturation and married life of Mashya and Mashyoi, and the durations of early
    rulers including Hoshyang, Takhm6rup, and Yim until his glory departed.'
