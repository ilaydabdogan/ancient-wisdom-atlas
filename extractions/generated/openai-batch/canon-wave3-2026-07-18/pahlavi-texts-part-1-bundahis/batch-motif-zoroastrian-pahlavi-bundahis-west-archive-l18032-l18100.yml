canonical_text:
  quote: ''
  summary: The passage describes when the guardian spirits of the righteous are to
    be invoked during ritual recitation, how they wait through successive formulae,
    when they accept the ceremony, and how they withdraw if not invoked. The spirits
    explain that human reverence allows them to keep evil away and that their prayer
    reminds humans of mortality. A brief divine exchange follows in which Auharmazd
    answers a question about the duration in life of one who is dead with images of
    extreme brevity.
