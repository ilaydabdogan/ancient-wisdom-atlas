  quote: ''
  summary: 'A catalogue of named mountains: Si/C''idav is placed among mountains in
    Kangdej; Alburz is described as surrounding the earth and being connected with
    the sky; Terak of Alburz is the route through which the stars, moon, and sun pass
    and return; Hugar the lofty is the height from which the water of Aredvivsur leaps
    down; and Ausindom is introduced as a ruby mountain.'
