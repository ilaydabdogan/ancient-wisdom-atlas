canonical_text:
  quote: ''
  summary: Sacred fires and rituals are described as demolishing portions of the opposition.
    Peshyotanu walks forth with one hundred and fifty men wearing black marten fur,
    performs fire rituals and rites with sacred twigs, and then goes with the assistance
    of named fires to great idol-temples described as the abode of demons. The evil
    spirit, Wrath, demons, fiends, evil races, and wizards arrive at the deepest abyss
    of hell, and the idol-temples are extirpated through Peshyotanu's exertions. Auharmazd
    comes to Mount Hukairya with the archangels and orders spiritual beings to assist
    Peshyotanu. Mitro confronts the evil spirit verbally, refers to a span of nine
    thousand years and earlier destructive figures, and the evil spirit becomes confounded
    as Mitro is said to smite Wrath.
  language: English
  quote_policy: summarized
