canonical_text:
  quote: ''
  summary: Auharmazd describes a future perplexing time in which cosmic and worldly
    conditions worsen and the evil spirit becomes more oppressive before perishing.
    He instructs Zaratust to learn and teach the matter for the preservation of souls.
    He contrasts those who appeal for the body with those who appeal for the soul,
    then answers Zaratust’s question about whether righteous ritual practice will
    continue in that time.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the described perplexing time, the night is said to be brighter, the year,
    month, and day diminish by one-third, the earth of Spendarmad arises, and suffering,
    death, and destitution become more severe.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Auharmazd foretells to Zaratust that the wicked evil spirit becomes more oppressive
    and tyrannical when it is necessary for him to perish.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Auharmazd commands Zaratust to enquire fully, learn by heart, teach by Zand,
    Pazand, and explanation, and tell the teaching to priests, disciples, and those
    unaware of the hundred winters.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stated purpose of the teaching is hope for a future existence, preservation
    of souls, and removal of trouble, evil, and oppression affecting religious ceremonies.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Auharmazd contrasts a person who appeals for the body and cannot save the
    soul with a person who appeals for the soul and has a soul described as fat in
    heaven despite bodily misery.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Zaratust asks whether righteous people remain in the perplexing time and whether
    they wear the sacred thread-girdle, use sacred twigs in rites, and continue next-of-kin
    marriage in their families.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Auharmazd answers that one of the best men in that time wears the sacred thread-girdle
    and celebrates rites with sacred twigs, although not as in King Vistasp’s reign.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Auharmazd states that reciting Ita-as-yazam and one Ashem-vohu from memory
