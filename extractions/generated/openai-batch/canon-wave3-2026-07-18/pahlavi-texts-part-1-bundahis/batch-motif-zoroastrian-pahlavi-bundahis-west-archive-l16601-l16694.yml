canonical_text:
  quote: it smites with a look.
  summary: The passage gives ritual restrictions concerning a menstruous woman, including
    penalties involving water and rain, prohibitions on looking at luminaries, animals,
    and plants, and avoidance of conversation with a righteous man. It describes a
    violent fiend of menstruation, regulates fire, food, cloths, and napkins in the
    woman's seclusion place, and states that sacred twigs are not polluted if menstruation
    occurs during consecration and the performer immediately sets them down and leaves.
    Translator notes explain the dron sacred cake ceremony and the baresom sacred
    twigs.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Sitting in water is assigned a sin of fifteen Tanapuhars, and walking in rain
    through disobedience assigns a sin of fifteen Tanapuhars for every drop.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman is not to look at the sun, other luminaries, animals, or plants,
    and is not to converse with a righteous man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fiend of menstruation is described as so violent that, unlike another
    fiend that does not smite anything with a look, it smites with a look.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the house or seclusion place where a menstruous woman is present, the fire
    is not to be kindled, and food delivered from before her is not proper for the
    same woman.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A tray-cloth before her is not polluted when it is not in contact with her,
    and a table-napkin is proper when apart from her thigh and no contact occurs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If menstruation occurs while consecrating the sacred cakes and holding up
    the sacred twigs, the sacred twigs are not polluted when the performer immediately
    puts them down and goes out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The translator's note describes a dron as a small round unleavened bread cake
    or wafer made of wheaten flour and water, with clarified butter, and marked in
    ritual use.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The translator's note describes the baresom as slender rods or twigs, now
    often metal wires, laid on crescent-shaped stands and prepared for rites with
    prayers, washing, and tying with a girdle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The translator's note describes a dron ceremony in which sacred cakes, frasasts,
    a pomegranate twig, sacred twigs, and a fire or lamp are arranged before the priest,
    who recites consecration formulae and names an angel or guardian spirit.
  category: action
  evidence_refs:
  - ev:6
