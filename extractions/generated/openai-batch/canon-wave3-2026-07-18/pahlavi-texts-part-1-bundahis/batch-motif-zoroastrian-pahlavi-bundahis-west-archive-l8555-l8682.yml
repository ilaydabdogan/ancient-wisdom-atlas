canonical_text:
  quote: ''
  summary: 'The passage gives a catalogue of demons and their effects: old age, disaster
    and whirlwind, illicit intercourse, sloth, annihilation, distress, greed, hoarding,
    corpse pollution, deception, slander, falsehood, the evil eye, idol worship, death,
    and spoilage through an unblessed gaze. It also preserves the end of a preceding
    statement about an unspecified implement used by adherents of the good religion
    to strike noxious creatures and sinners.'
  language: English
  quote_policy: summarized
