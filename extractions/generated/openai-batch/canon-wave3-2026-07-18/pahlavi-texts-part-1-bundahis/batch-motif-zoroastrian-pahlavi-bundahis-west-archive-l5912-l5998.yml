canonical_text:
  quote: ''
  summary: Mashya and Mashyoi are described as corrupted through false speech linked
    to demons and the evil spirit. After fasting and wearing herbage, they enter the
    wilderness, milk a white-haired goat, and speak again in a way that strengthens
    demons and diminishes the taste of food. Later they slaughter a sheep, extract
    and kindle fire with heavenly guidance, roast meat, assign shares to fire and
    angels, acquire clothing, iron tools, and shelter, and then fall into mutual violence
    as demons become more oppressive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A false statement is made that the evil spirit created water, earth, plants,
    animals, and other things; through this false speech the two become wicked and
    their souls are said to be in hell until the future existence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The false speech is said to be spoken through the wall of the demons, and
    the evil spirit gains a first enjoyment from the two.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two go thirty days without food, wear clothing of herbage, and then go
    into the wilderness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the wilderness they come to a white-haired goat and milk its udder with
    their mouths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After drinking the milk, Mashya speaks to Mashyoi about his delight before
    and after consuming the milk with his body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The second false speech increases the power of the demons, and the taste of
    food is reduced so that only one part out of a hundred remains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After another thirty days and nights, the two come to a fat, white-jawed sheep
    and slaughter it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: They extract fire from lote-plum and box-tree wood through the guidance of
    heavenly angels, stimulate the fire with their mouths, kindle dry grass and other
    fuel, and roast the sheep.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: They drop three handfuls of meat into the fire as the fire's share and toss
    one piece toward the sky as the angels' share; a vulture carries some away, and
    a dog is said to have eaten the first meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: They are first covered with skins and later have woven garments prepared from
    cloth woven in the wilderness.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: They dig a pit, obtain iron, beat it with stone without a forge into a cutting
    edge or axe, cut wood, and prepare a wooden shelter from the sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Because of graceless conduct the demons become more oppressive, and the two
    show mutual malice, advance against each other, strike each other, and tear hair
    and cheeks.
  category: action
  evidence_refs:
  - ev:6
