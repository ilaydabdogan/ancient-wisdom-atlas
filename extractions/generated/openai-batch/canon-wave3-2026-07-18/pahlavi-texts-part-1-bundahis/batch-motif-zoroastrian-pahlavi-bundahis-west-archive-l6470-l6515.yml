  quote: ''
  summary: The passage describes a mountain with innumerable cavities located between
    trees, assigned protection over waters, from which water streams through channels
    to the land of the seven regions as the source of all sea-water there. It then
    begins a description of the three-legged ass standing in the wide-formed ocean,
    listing its multiple feet, eyes, mouths, ears, and horn. Notes connect the mountain
    with the white-Horn tree and the tree of many seeds, and compare the three-legged
    ass with the Avestan khara.
