canonical_text:
  quote: ''
  summary: The passage includes a brief fragment about Aniran and the angel Horn/Hom
    of three kinds, an instruction concerning plants held with water on a twig before
    fire, especially the lotos, and the beginning of a chapter on Aharman and demons.
    Aharman/the evil spirit is described as producing evil against Auharmazd's creation,
    exemplified by winter, having a lizard body and a place in filth, refusing welfare
    for Auharmazd's creatures, destroying what Auharmazd increases, and harming creatures
    through eyesight.
  language: English
  quote_policy: summarized
