canonical_text:
  quote: ''
  summary: A prophetic passage addresses Zaratusht about invading armies associated
    with wrath and demons entering the countries of Iran created by Auharmazd. It
    announces three great contests in different periods, describes displacement of
    Iranian people toward Padashkhvargar with reports of cave, mountain, and river
    dwellings, refers to the fire Vimasp on deep Lake Chechast with medicinal anti-demonic
    water, and describes the end of Zaratusht's millennium as a time when no wicked
    thing passes into the next millennium.
  language: English
  quote_policy: summarized
