canonical_text:
  quote: ''
  summary: 'Aharman comes against cattle, which resist with all the animals. The primeval
    ox dies, and from its vegetable nature and various body members arise many grains
    and medicinal plants. The passage states correspondences between body parts and
    plants: plants grown from a member promote that member; marrow gives rise to grains
    and legumes including sesame; blood gives rise to the vine and wine; and the nose
    gives rise to a pulse called donak.'
