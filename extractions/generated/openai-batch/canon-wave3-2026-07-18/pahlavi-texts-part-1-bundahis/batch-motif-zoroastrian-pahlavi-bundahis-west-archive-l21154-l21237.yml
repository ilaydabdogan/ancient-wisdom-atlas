canonical_text:
  quote: ''
  summary: The passage describes Spendarmad's lodgment in the earth and the earth's
    distress when death-worthy sinners walk on it, contrasted with happiness arising
    from cultivation, virtuous offspring, and cattle-rearing. It then instructs that
    Horvadad and Amerodad are propitiated through care for water and vegetation, forbidding
    pollution, theft, unlawful destruction, and unatoned offenses. Unatoned sins against
    even a twig or a drop of water obstruct the offender's access to heaven, while
    proper propitiation yields worldly fame and a share in Auharmazd's heavenly splendour.
    The passage ends by introducing Auharmazd speaking to Zarathusht.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spendarmad is said to have a lodgment in the earth, and the earth becomes
    distressed when death-worthy sinners walk about in the world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The earth's pain when death-worthy sinners walk upon it is compared to a mother's
    distress at a dead son on her bosom, and Spendarmad's lodgment is said to be little
    where such sinners walk.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The earth's happiness arises from tillage and cultivation, the birth of a
    virtuous son upon it, and the rearing of cattle upon it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that whoever wishes to propitiate Horvadad and Amerodad should
    propitiate their water and vegetation and should seize those who consume and steal
    water and vegetation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage forbids oppressive action, sinful walking in the world, bringing
    bodily refuse, dead matter, or pollution to water, unlawfully destroying vegetation,
    and giving fruit to the idle and vile.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a person commits an unatoned sin against vegetation, even against a single
    twig, then after departing from the world the spirits of all plants stand high
    before that person and do not let him go to heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a person commits an unatoned sin against water, even against a single drop,
    that also stands as high as the plants and does not let him go to heaven.
  category: sequence
  evidence_refs:
  - ev:5
