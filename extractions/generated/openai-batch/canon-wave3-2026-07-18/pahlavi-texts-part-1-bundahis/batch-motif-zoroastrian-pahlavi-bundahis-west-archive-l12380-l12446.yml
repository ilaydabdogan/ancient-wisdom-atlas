canonical_text:
  quote: ''
  summary: 'The passage assigns symbolic metals to periods or reigns: gold to the
    conversation with Zaratusht and Vistasp''s acceptance of the religion, silver
    to the reign of Arakhshir the Kayan king, steel to the reign of Khusro son of
    Kevad, and a substance mixed with iron to an evil demon sovereignty at the end
    of Zaratusht''s millennium. It also states that Mazdik, opposed to the religion,
    will cause disturbance, and that a glorified figure summons named priests and
    requires a promise about the handling and teaching of the Yasts and their commentary.'
  language: English
  quote_policy: summarized
