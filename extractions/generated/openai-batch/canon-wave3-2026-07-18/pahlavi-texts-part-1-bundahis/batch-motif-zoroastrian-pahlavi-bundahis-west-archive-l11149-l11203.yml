  quote: ''
  summary: Ahar-man comes with full strength to disfigure creation, darkens and confines
    part of the sky, and opposes the renovation of the universe. He proclaims victory
    by listing damages to sky, water, earth, vegetation, the ox, Gayomar, and celestial
    arrangements, while naming Auharmazd as the remaining being to take and pervert.
    He then sends Asto-vida with many decrepitudes and diseases upon a male figure
    referred to as him.
