  quote: ''
  summary: The passage gives ritual-legal rules concerning unlawful slaughter of animals,
    corpse handling for a pregnant woman, forgiveness prayers for the dead, pollution
    from dead matter and footwear, timing for tying the sacred girdle, and the equivalence
    of bodily wind during inward prayer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage prescribes reverential abstinence from unlawfully slaughtering
    any species of animals and says the unlawful slaughterer is punished when each
    hair of those animals becomes like a sharp dagger and the slaughterer is slain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage singles out lambs, goats, ploughing oxen, war-horses, hares, bats,
    the cock or bird of Vohuman, the magpie, and birds such as kite, eagle, and swallow
    as animals whose slaughter is especially to be abstained from.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A pregnant woman who has died is not to be carried by fewer than four men,
    and she is to be exposed to the united power of two dogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other corpses may be carried by two men after a dog's gaze without the carriers
    becoming polluted, but two men carrying a deceased pregnant woman must undergo
    ceremonial washing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A forgiveness prayer for a deceased person asks that mutual trespasses be
    accounted together and that remaining trespasses against the speaker be made a
    righteous gift by the speaker.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: One should not walk without boots; a booted foot on dead matter does not pollute
    the person if the dead matter is not disturbed, while an unbooted foot pollutes
    unless the dead matter is certainly known to have been seen by a dog.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sacred girdle is to be tied on a person one day after the person is fourteen
    years and three months old, and the passage says this is better than waiting until
    fifteen years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that retaining a prayer inwardly is treated the same whether
    wind comes from below or from the mouth.
  category: action
  evidence_refs:
  - ev:6
