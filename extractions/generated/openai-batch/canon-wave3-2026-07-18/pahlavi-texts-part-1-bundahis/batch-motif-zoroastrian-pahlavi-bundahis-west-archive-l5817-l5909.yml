canonical_text:
  quote: ''
  summary: The passage describes the growth of Matro and Matroyao from the earth in
    the form of a one-stemmed Rivas plant, their connected and sexually indistinct
    state, a statement that soul precedes body, their change from plant shape into
    human shape, and Auharmazd's address to Mashya and Mashyoi as the ancestry of
    the world. It also recounts their first thoughts, deed, and words, followed by
    antagonism entering their minds.
  language: English
  quote_policy: summarized
