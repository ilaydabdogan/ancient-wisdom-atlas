  quote: ''
  summary: 'The passage gives prescriptions for uttering different numbers of formulas
    in particular circumstances: blessings, season-festival participation, atonement
    for sin, seeking power and battle-success, worship, guardian-spirit ceremonial,
    sowing corn, seeking a wife, animal procreation, travel to mountains or low districts,
    and becoming pathless. Notes report manuscript and related-text variations for
    several prescriptions.'
