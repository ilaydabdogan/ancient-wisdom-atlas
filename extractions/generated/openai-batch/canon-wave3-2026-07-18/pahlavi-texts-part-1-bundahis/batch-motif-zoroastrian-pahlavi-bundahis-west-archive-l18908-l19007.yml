canonical_text:
  quote: ''
  summary: A series of ritual and purity rules describes fowl assisting against wizard-caused
    mischief, preservation of a safe place when a hedgehog is seen, a hedgehog killing
    ants by voiding urine into their nest, delayed corpse-contamination for certain
    deaths, the need to show corpses to an observant dog, restrictions on praying
    over decomposed or hairy offerings, and a fragmentary statement about women performing
    priestly duty among women.
  language: English
  quote_policy: summarized
