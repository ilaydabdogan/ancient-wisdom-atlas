  summary: The passage is an introductory and methodological section. It cautions
    about translating a technical Pahlavi treatise and about differences between medieval
    Persian customs and modern Parsi customs; classifies the Bundahij, Bahman Yast,
    and Shayast la-shayast by subject and biblical analogy; describes the selected
    texts as translations from old Avesta materials collected and rearranged across
    Sasanian and post-conquest periods; warns that the translated volume is too small
    a sample for judging the Parsi religion as a whole; and begins a discussion of
    dualism.
