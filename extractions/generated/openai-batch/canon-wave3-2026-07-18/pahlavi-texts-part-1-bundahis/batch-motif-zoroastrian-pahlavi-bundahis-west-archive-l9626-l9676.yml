canonical_text:
  quote: ''
  summary: The passage gives a genealogical sequence involving Yim and his sister
    Yimak, whose male-female pair of offspring become husband and wife and continue
    the lineage. It then states that Spittar, together with Dahak, cut up Yim. Narsih
    is described with an allotted destiny of daily troubles and of making all food
    purified and pure. Dahak is introduced genealogically as son of Khrutasp, son
    of Zainigav, with a translator’s note identifying Dahak/Az-Dahak with Avestan
    Asi Dahaka, “destructive serpent.”
  language: English
  quote_policy: summarized
