canonical_text:
  quote: When they consecrate a sacred cake (drono), and it becomes demon worship
  summary: The passage first completes a numerical listing of Gatha stanzas. Chapter
    XIV then asks which faults cause consecration of a sacred cake to become demon
    worship. The decision lists ritual defects involving unpurified or improper sacred
    twigs, wrong twig numbers, holding the twig-bundle north while uttering the Avesta,
    improper tasting of the cakes, premature inward prayer before the officiating
    priest tastes, and excessive recitation without restarting the consecration. Notes
    explain that an imperfect ceremony may be appropriated by demons rather than accepted
    by celestial beings, and that north is treated as the direction of demons.
  language: English
  quote_policy: quoted
