canonical_text:
  quote: ''
  summary: The passage gives ritual and legal instructions concerning atonement for
    grave sin through high-priests, surrender of body and wealth, renunciation, punishment,
    avoidance of hell, and a three-night ceremony. It also includes a restriction
    on hunting and an explanation of how merit from an improperly intended ceremony
    may be assigned to angels and enjoyed by a righteous-minded soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soul is to be atoned for among the high-priests, and obeying the high-priests'
    commands makes the sin depart and future good works attain completion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person whose sin is worthy of death is to confess to the high-priests and
    deliver up his body to them, not to anyone else.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Horsemen are said not to have hunting as their business, and hunting for game
    is disallowed except for a person whose wealth is less than three hundred stirs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ceremonial worship by those worthy of death is described as demon worship
    when it is not performed as renunciation of sin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the officiating priest does not know the improper status of the ceremony,
    its merit goes to the store of the angels, and enjoyment from that merit is given
    in spiritual existence to the soul of a person who has become righteous in mind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the mortal sinner delivers body and wealth to the high-priests, mentally
    renounces the sin, and receives their decision on duty and good works, previously
    performed duty and good works return to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If punishment is inflicted for three nights, the mortal sinner does not enter
    hell.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the high-priest orders the cutting off of the sinner's head, the sinner
    is said to be righteous on the spot, and a three-night ceremony is to be celebrated
    for him.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: An editorial note explains the three-night temporal punishment as saving the
    sinner from a three-night punishment in the other world mentioned elsewhere.
  category: other
  evidence_refs:
  - ev:7
