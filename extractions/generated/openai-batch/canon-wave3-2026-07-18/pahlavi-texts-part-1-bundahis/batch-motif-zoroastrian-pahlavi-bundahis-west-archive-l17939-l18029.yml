canonical_text:
  quote: ''
  summary: The passage cites the fifth fargard of the Paon/Pasag Nask for a fourfold
    classification of worship of celestial beings according to whether the Avesta
    is correct or faulty and whether the man is good or bad. It then states how archangels
    and angels approach, listen to, and accept or reject each type. It also instructs
    that angels and the guardian spirits of the righteous are to be invited at the
    beginning of every ceremonial and sacred-cake consecration, and that invoked angels
    accept the ceremony. The translator's note summarizes the broader Nask as treating
    ritual slaughter, fire and water rites, season-festivals, seasonal rotations,
    guardian-spirit visitation, and retribution for sins.
  language: English
  quote_policy: summarized
