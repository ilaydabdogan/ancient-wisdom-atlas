canonical_text:
  quote: ''
  summary: The passage catalogs named rivers and gives routes or alternate names for
    several of them. The Arae is said to come from Alburz and to pass through named
    lands under other names. The Veh flows east through Sind to the sea in Hindustan.
    The Frat rises near Arum, is used in Suristan, flows to the Diglat, and is associated
    with irrigation and with Manushchihr excavating its sources and giving water to
    drink. The Diglat is said to come from Salman and flow to the sea in Khuzistan,
    and the Daitik is introduced as another river. Translator notes identify or compare
    several names with Avestan or historical river names.
  language: English
  quote_policy: summarized
