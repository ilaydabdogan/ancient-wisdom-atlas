canonical_text:
  quote: ''
  summary: 'The passage names the sacred feast (myazd) and next-of-kin marriage, then
    gives a footnote on the six Gahanbars or season-festivals. The note states their
    dates in the Parsi year and summarizes an explanation attributed to Khurshedji
    Rustamji Cama: medieval Zoroastrians first recognized a two-season year, later
    divided the year into four equal seasons, and interpreted or adjusted the six
    festivals as points such as seasonal beginnings, midpoints, or ends.'
  language: English
  quote_policy: summarized
