canonical_text:
  quote: ''
  summary: In an eschatological prophecy, the evil spirit and demonic progeny retreat;
    Mitro commands Peshyotanu to destroy demon-abode idol-temples and restore religious
    sovereignty in Iran. Peshyotanu advances with named sacred fires, performs rites,
    and terrifies the wicked. Vahram the Varjavand appears in glory, restores Iran,
    and drives away vices. The wolf period ends and the sheep period begins; the fires
    are re-established, demons are cursed, and Peshyotanu comes with 150 disciples
    to take the throne of religion and sovereignty. Auharmazd frames this as prophecy
    to Zarathust at a millennial transition.
  language: English
  quote_policy: summarized
