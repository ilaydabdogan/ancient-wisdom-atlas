canonical_text:
  quote: ''
  summary: The passage gives ritual-purity rules for moving corpses under different
    conditions, especially whether a dog has seen the corpse, whether a stake or another
    man's hand is used, and what washing or sin penalties result. Notes explain that
    the stake blocks the Nasu, the demon of corruption. Further rules address uncertainty
    about a corpse at night, dead matter contaminating a flock, forest, or firewood,
    and doors struck by corpses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a corpse which a dog has not seen is moved with a stake, the mover's washing
    is not to be with ceremony, except in the specified case of moving it all.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man moves a corpse not seen by a dog by means of another man's hand,
    both the person arranging the movement and the person whose hand strength moves
    it are bodily polluted, and Tanapuhar sin is assigned to both.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the responsible person lacks the strength to move the corpse himself, the
    case is treated like moving it with a stake; the person who held it in hand-contact
    is washed with ceremony, with different sin designations assigned to the parties.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a corpse seen by a dog is moved by the hand of a man, the washing for him
    is not to be with ceremony, except in the specified case of moving it all.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A translator's note states that the interposed stake or piece of wood prevents
    the direct attack of the Nasu, the demon of corruption, which has not been driven
    away by a dog; the note also says inanimate objects stop the progress of pollution.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If someone passes a place at night, returns the next day, finds a corpse there,
    and does not know whether the evil was present when he passed, he is to consider
    that it was not there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Afarg says that a flock containing a sheep that ate dead matter, a forest
    containing a tree mingled with dead matter, and a firewood-stand containing greasy
    firewood are subject to restrictions: the flock and forest are not to be made
    fruitful, and the firewood is useless.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: For a door on which a corpse impinges, the town or city door is to be discarded
    by comrades or the community; opinions differ about a mostly closed door.
  category: action
  evidence_refs:
  - ev:8
