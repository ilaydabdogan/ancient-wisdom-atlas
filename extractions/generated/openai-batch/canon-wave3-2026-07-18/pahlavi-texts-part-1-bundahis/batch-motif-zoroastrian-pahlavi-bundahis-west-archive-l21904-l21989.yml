  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man is instructed to go as much as possible to the abode of fires and to
    perform the salutation of fire with reverence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three times each day the archangels form an assembly in the abode of fires
