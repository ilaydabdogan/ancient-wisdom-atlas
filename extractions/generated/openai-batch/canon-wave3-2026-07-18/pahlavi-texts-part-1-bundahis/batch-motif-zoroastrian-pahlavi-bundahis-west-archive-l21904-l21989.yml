canonical_text:
  quote: the nature of wisdom is just like fire
  summary: The passage links the Yatha-ahu-vairyo prayer with protection at rivers
    and with religion itself; instructs reverent attendance at the abode of fires
    where archangels shed good works and righteousness; compares wisdom to fire and
    to a cultivated fountain; prescribes acts against corruption and for religion;
    and lists ethical transformations as major human concerns.
  language: English
  quote_policy: quoted
