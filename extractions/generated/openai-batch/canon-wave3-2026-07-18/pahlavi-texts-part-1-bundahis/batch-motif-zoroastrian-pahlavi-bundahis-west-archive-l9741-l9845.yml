canonical_text:
  quote: ''
  summary: The passage gives a genealogical sequence from the line of Yim through
    Fre^un and his descendants. It describes the thousand-year evil reign of Dahak,
    Fre^un’s vengeance for Yim, the sons of Fre^un, the killing of Airi/6 and his
    sons by Salm and Tuf/Txxg, the concealment of Airi/6’s daughter and her daughter,
    the birth of Manuj-i Khurshed-vinik with sunlight falling on his nose, and the
    later birth of Manuj-chihar, who kills Salm and Tuf/Txxg in revenge for Airi/6.
  language: English
  quote_policy: summarized
