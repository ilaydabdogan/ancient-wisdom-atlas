canonical_text:
  quote: ''
  summary: The passage gives ritual-purity rules concerning objects, food, water,
    bedding, garments, washing, and periods of seclusion or waiting in relation to
    a menstruous woman and a woman after childbirth or miscarriage. It includes rules
    about measured distance, contact pollution, permissible handling of water for
    ablution, cleansing with bull's urine and water, and timing for washing after
    menstruation or renewed menstruation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacred twigs placed directly below uncleanness are treated as unclean even
    at a distance of fifteen steps, while fifteen steps are sufficient when they are
    not directly below.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prepared food within three steps of a menstruous woman is said to be polluted
    by her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Food delivered up from a menstruous woman's morning meal is not fit for the
    evening meal, and food delivered up from her evening meal is not fit for the morning
    meal or even for the same woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Water within three steps of a menstruous woman may be fit for ceremonial hand
    ablution if it is put into a pail or ablution-vessel without handling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a menstruous woman touches another person's bedding or garments, Soshyans
    says the touched space is to be washed with bull's urine and water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage distinguishes direct touch by the woman from contact between her
    bedding and another person's bedding; the latter is said not to make the other
    bedding polluted.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A menstruous woman who becomes clean in three nights is not to be washed until
    the fifth day; from the fifth through the ninth day she sits one day in cleanliness
    for depletion before washing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After nine nights, the passage states that depletion is no matter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A woman who has given birth or miscarried is discussed under a forty-day period
    in which pollution may be observed; if she is certainly free from menstruation
    she may be associated with from the fortieth day onward, but if not she is considered
    menstruous meanwhile.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a menstruous woman has sat one month as menstruous and becomes clean on
    the thirtieth day but immediately becomes menstruous again, the depletion begins
    again and washing is not allowed until the fifth day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a woman has been washed from menstruation, sits three days in cleanliness,
    and again becomes menstruous, she is to watch through four days and the fifth
    day is for washing.
  category: sequence
  evidence_refs:
  - ev:7
