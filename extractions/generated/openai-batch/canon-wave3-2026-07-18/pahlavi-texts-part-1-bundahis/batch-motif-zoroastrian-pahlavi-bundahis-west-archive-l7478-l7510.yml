  summary: The passage gives etiological accounts for the ape, bear, and other beings
    through unions between Yim, Yimak, demons, a demoness, and a witch. It also describes
    a later human group as arising from one intercourse during the reign of As-i Dahak,
    then fleeing Iran when Fre<^un came, settling on the sea-coast, and later being
    diffused again through Iran after the Arab invasion.
