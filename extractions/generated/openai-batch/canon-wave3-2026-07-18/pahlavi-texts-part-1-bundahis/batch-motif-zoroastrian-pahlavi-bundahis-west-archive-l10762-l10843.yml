  quote: ''
  summary: The passage introduces the Selections of Zaz-sparam and frames a teaching
    about the meeting of the beneficent spirit and the evil spirit. It describes primordial
    light above and darkness below, Auharmazd in the light and Aharman in the darkness,
    Aharman's approach toward a ray of light, Auharmazd's resistance by pure words,
    the appointment of protective spirits for three thousand years, and Aharman's
    later threats to smite creatures and seduce material life.
  language: English
