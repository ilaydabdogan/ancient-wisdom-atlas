canonical_text:
  quote: ''
  summary: The passage summarizes Zad-Sparam material about Zaratust before and at
    birth, including begetting through horn-juice and cow's milk infused with his
    guardian spirit and glory, genealogy connecting him with Auharmazd and Gayomard,
    attacks by fiends and other opponents, reception of the religion from Auharmazd,
    virtues and deeds, guidance by the archangel Vohuman to an assembly of spirits
    at age thirty, questions to Auharmazd and seven archangels, early discipleship
    and acceptance of the religion by Vistasp, and other writings on human formation
    and the renovation of the universe.
  language: English
  quote_policy: summarized
