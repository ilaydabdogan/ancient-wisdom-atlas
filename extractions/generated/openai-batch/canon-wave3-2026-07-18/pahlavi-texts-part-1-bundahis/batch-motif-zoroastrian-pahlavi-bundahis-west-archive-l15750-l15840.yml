  summary: The passage gives ritual-legal rules about the suitability of doors for
    places of differing ritual severity, penalties for throwing a corpse into water,
    the measured extent of water pollution caused by dead matter, and obligations
    and disagreements about removing a corpse from water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage records disagreement between Gogoasp and Soshyans about discarding
    a door by comrades, while stating that other doors were judged not proper.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A door from one's own chief apartment is said to be fit for a place for menstruation,
    a door from a place for menstruation is fit for a depository of the dead, and
    a door from a depository of the dead is not fit for any purpose.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states a general rule that what belongs to the more pleasant is
    fit for the more grievous.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Throwing a corpse into water is described as a sin worthy of death; throwing
    multiple corpses at one time counts as one such sin, while throwing them separately
    counts separately for each corpse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dead matter thrown into water pollutes measured extents in the advancing water,
    the water passed over, the water alongside, the depth, and the water pouring over
    the dead matter.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: For a great standing water, the text says the amount to be carried away with
    the dead matter corresponds to the amount to which the pollution extends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a man finds a corpse lying in water and can bring it out without injury
    to himself, abandoning it is not allowed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Soshyans says that if removal would injure the man, non-removal is allowable,
    but if removal would not injure him and he does not remove it, his sin is a Tanapuhar.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kushtano-buce says that even when removal would cause injury, abandonment
    is not allowable except by bringing the corpse out, and non-removal makes the
    man worthy of death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Gogo-yasp says that in a case of injury, failure to bring the corpse out is
    a Tanapuhar, and when there is no injury, failure to bring it out makes the man
    worthy of death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the man wishes to bring the corpse out, his clothing is to be laid aside.
  category: action
  evidence_refs:
  - ev:5
