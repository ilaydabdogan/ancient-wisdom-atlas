canonical_text:
  quote: ''
  summary: Ritual instructions address removal of a decomposed corpse, washing the
    handler's hands and knife, restrictions when a corpse lies in water during rain,
    the use and treatment of corpse-contaminated clothing, similar disposal of clothing
    worn by a menstruous woman, and purification of leathern clothing with bull's
    urine, dust, water, and sun exposure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a decomposed corpse must be brought out, the handler cuts off fragments
    and brings them out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For each corpse fragment, the handler's hands and knife are to be washed with
    bull's urine and with dust and moisture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For every single fragment brought out, the handler's good work is counted
    as one Tanapuhar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If rain is falling and a corpse lies in water, taking it from the water in
    order to deposit it in the rain is not allowable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Useless clothing is the clothing prescribed for carrying a corpse.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The portion of clothing on which a corpse decomposes or on which excretions
    of the dead come is to be cut away; the remainder is to be washed for a six-month
    period.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Clothing worn by a menstruous woman is to be discarded in like fashion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Leathern clothing is to be washed three times with bull's urine, dried with
    dust each time, washed three times with water, and laid out for three months where
    it can be viewed by the sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Translator notes connect the corpse-fragment instructions and clothing-purification
    instructions with passages in the Pahlavi Vendidad and Vendidad.
  category: other
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
