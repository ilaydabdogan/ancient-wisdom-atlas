canonical_text:
  quote: ''
  summary: The passage gives a chronological list of reigns and dynastic periods.
    It assigns millennial periods to zodiacal signs, including Scorpio, Sagittarius,
    and in a note Capricornus; lists reign-lengths for Dahak, Fre^un, Manujihar, Kai
    rulers, Vohuman, Humai, Darai figures, Alexander, the Askanians, and the Sasanians;
    says Kai-Kaus went to the sky; notes Manujihar in a mountain fastness; and describes
    rule passing to the Arabs. Editorial notes compare parts of the millennial chronology
    with Bahman Yast.
  language: English
  quote_policy: summarized
