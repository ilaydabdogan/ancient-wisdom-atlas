canonical_text:
  quote: ''
  summary: The excerpt includes translator notes on the miraculous birth of Hushe'dar-mah,
    the identification of Aži Dahak, and Yim's enclosure. In the narrative, an apostate
    shouts toward Mount Dimavand, calling Bevarasp/Aži Dahak to rise because nine
    thousand years have passed and Freðun is not living. Aži Dahak stands but does
    not remove his fetters and stake until Aharman removes them. Released, Aži Dahak
    gains vigor, swallows the apostate, rushes into the world, devours one-third of
    mankind, livestock, and other creatures of Auharmazd, and smites water, fire,
    and vegetation. Water, fire, and vegetation then lament before Auharmazd and ask
    him to make Freðun alive again so that Freðun may destroy Aži Dahak.
  language: English
  quote_policy: summarized
