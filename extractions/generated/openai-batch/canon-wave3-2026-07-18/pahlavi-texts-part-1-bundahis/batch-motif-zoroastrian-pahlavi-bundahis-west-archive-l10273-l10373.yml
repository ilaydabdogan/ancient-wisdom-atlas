canonical_text:
  quote: ''
  summary: The passage includes explanatory material on wife categories, inheritance,
    child affiliation, and other-world affiliation; then gives genealogical material
    about Isadvastar, a son called Ururvi^a^/Aran^-i Bira^an^, and adoption through
    a serving wife. It names three sons of Zarathusht from Hvov and says Zarathusht's
    seed went to the ground three times, was guarded and conveyed by angels, and will
    later be blended with a mother. It also says numerous guardian spirits protect
    the seed from demons, and it names Zarathusht's mother and maternal grandfather.
  language: English
  quote_policy: summarized
