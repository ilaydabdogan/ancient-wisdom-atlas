  quote: ''
  summary: The passage lists allocations of body parts or shares to guardian spirits,
    divine or cosmic figures, the poor, waters, fires, the moon, and archangels. It
    then comments on speech about protection and meat-offerings, and states a rule
    permitting one offering share to be offered on account of another except for the
    tongue, jaw, and left eye, which belong to the angel Hom.
