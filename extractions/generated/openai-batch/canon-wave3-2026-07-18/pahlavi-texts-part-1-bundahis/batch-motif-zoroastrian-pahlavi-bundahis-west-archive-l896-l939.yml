canonical_text:
  quote: ''
  summary: 'The introduction identifies the treatise as Zand-akas and summarizes its
    opening cosmology: a good spirit in endless light and an evil spirit in endless
    darkness produce separate spiritual creations; the evil spirit’s opposition is
    limited by an agreement; a sacred formula confuses the evil spirit while the good
    spirit produces archangels and material creation; demons later attack six classes
    of creation, causing specific disorders and deaths. The passage then lists topics
    treated in later chapters, including regions, mountains, seas, animals, sacred
    fires, trees, beings opposed to evil, demons, spiritual chiefs, resurrection,
    and future existence.'
  language: English
  quote_policy: summarized
