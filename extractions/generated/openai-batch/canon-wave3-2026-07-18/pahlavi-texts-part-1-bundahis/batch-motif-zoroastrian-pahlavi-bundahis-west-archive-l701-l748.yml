  summary: The passage discusses early Sasanian Pahlavi inscriptions, naming Artakhshatar
    son of Papak, Shahpuhar I, later successors, and the scripts and languages of
    inscriptions on rocks, coins, stones, and in a cave near Persepolis. It then compares
