canonical_text:
  quote: ''
  summary: 'The passage includes a note that month names are selected from day names
    but ordered differently, then opens Chapter XXVI with definitions of measures:
    a Hasar on the ground is equated with a Parasang of one thousand two-foot steps;
    a Parasang is described as the distance at which a far-seeing man can discern
    a beast of burden and tell whether it is black or white; a man''s measure is eight
    medium spans. Footnotes discuss textual and comparative details about these measures.'
  language: English
