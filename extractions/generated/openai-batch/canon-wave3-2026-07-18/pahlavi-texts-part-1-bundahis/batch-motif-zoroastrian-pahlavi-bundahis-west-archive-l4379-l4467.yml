canonical_text:
  quote: the sun, every day, comes in through an aperture, and goes out through an
    aperture
  summary: The passage describes the sun moving daily through eastern and western
    apertures in Alburn/Alburz, coordinating the motion of other heavenly bodies,
    marking equinoxes, solstices, seasons, and regions of the world, and returning
    after 360 days plus five Gatha days to the same aperture. One aperture is deliberately
    not named so demons cannot learn the secret and cause disaster. Translator notes
    compare the system with solar gates in the Book of Enoch and mention a related
    Pahlavi Vendidad sentence.
  language: English
  quote_policy: quoted
