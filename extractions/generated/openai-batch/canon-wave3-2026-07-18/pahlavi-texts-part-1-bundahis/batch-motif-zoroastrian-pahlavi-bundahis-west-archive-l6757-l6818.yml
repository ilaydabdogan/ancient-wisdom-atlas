canonical_text:
  quote: ''
  summary: 'The passage describes several animals and their functions: the hedgehog
    levels a hollow track; the water-beaver opposes a demon in the water; all beasts,
    birds, and fishes are said to have been created against some noxious creature.
    It also describes the vulture''s sight and musk under its wing, the Arab horse''s
    night vision, the cock and dog as allies of Srosh against demons and wizards,
    the special importance of shepherd and house watchdogs, the dog''s power against
    fiends, pain, decay, and the principle that Auharmazd created nothing useless.'
  language: English
  quote_policy: summarized
