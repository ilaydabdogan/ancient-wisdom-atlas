canonical_text:
  quote: ''
  summary: Rules prescribe how to handle a corpse or dead matter on trees and in relation
    to jars containing wine, oil, or corn. The passage distinguishes pollution of
    body, vessel, and contents by contact, bodily traces, risk of falling, and the
    special danger of a serpent in a jar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a corpse is on green bark or a green branch and there is no fear of its
    falling, it should not be carried down; if there is fear, or the tree or branch
    is withered, the body may have to be carried down according to the rule stated.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: When hair or a limb originating with the dead person remains on a tree, the
    rule directs that the whole body be carried down.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note explains the purpose of the tree rules as preventing a corpse from
    defiling more ground than necessary by falling upon it.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: If dead matter from outside remains on a jar containing wine, the jar is polluted
    while the wine remains clean.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If someone dies inside the wine in a jar and no hair or curl from that person
    remains on the jar, the wine is polluted while the jar is not polluted.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A note defines nasai as a corpse, carcase, or portion of such dead matter
    from a human, dog, or other animal of the good creation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: If dead matter remains outside on a jar containing oil, it is treated as though
    it remained inside because the oil moves outside and back inside; both jar and
    oil are polluted.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A jar polluted in the oil case is said not to be fit for putting anything
    in, even after drying.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: If a serpent is in a jar containing wine, both jar and wine are useless and
    polluted because the serpent makes them contaminated.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: If corn is in the jar with a serpent, the jar is polluted and the corn is
    clean except for the portion including the serpent and touched by it, which must
    be removed and thrown away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that the touch of the serpent's seed might be the death
    of someone.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: If hair or dead matter not originating with the serpent remains on the jar,
    the jar is polluted but serviceable after drying.
  category: relationship
  evidence_refs:
  - ev:10
