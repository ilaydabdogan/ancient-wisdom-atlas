canonical_text:
  quote: ''
  summary: 'The passage describes Auharmazd arranging a period with Aharman, divided
    into three periods of three millennia. Aharman relies on it, while Auharmazd understands
    Aharman''s relation to darkness and the arising of diffused poison or strife.
    After appointing the period, Auharmazd brings forward the Ahunavar formula, which
    is said to disclose benefits concerning Auharmazd''s will, reward and punishment
    at the bridge, heaven and hell, aid for the poor, and the three means by which
    renovation occurs: true religiousness, hope and fear concerning recompense and
    punishment, and mutual assistance or collective warfare against the enemy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Auharmazd demands a period for friendship or arrangement and forms it into
    three periods, each lasting three millennia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aharman relies on the appointed period; Auharmazd perceives that Aharman returns
    to darkness and that diffused poison gives rise to endless strife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the period is appointed, Auharmazd brings forward a formula identified
    in the passage with the Ahunavar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first benefit of the formula is that what is proper is what is declared
    to be the will of Auharmazd; what is outside that will is described as injurious
    and sinful from the beginning.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The second benefit of the formula concerns reward and recompense for doing
    Auharmazd's will and punishment at the bridge for not doing it; the passage also
    connects this with tales of heaven and hell.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The third benefit says that Auharmazd's sovereignty increases what is for
    the poor, removes adversity, and provides treasures for the needy through a pattern
    of assistance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The creatures of Auharmazd are described as contending with one another, and
    the renovation of the universe is said to occur through three things.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The three things leading to renovation include true religiousness, hope for
    reward, fear of punishment at the bridge, perseverance in good works, abstention
    from sin, mutual assistance among creatures, and collective warfare that triumphs
    over the enemy.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: An editorial note gives an alternative reading in which the diffused poison
    is the poison of a serpent.
  category: other
  evidence_refs:
  - ev:10
