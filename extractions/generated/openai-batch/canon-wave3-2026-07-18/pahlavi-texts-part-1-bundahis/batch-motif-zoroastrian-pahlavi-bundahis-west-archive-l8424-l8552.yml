  quote: ''
  summary: 'The passage catalogs several demons and their actions: demons are propitiated
    by gifts to people holding objectionable ritual opinions; Taprez and Zairi are
    linked with poison; Taromat, Mitokht, Arask, Aeshm, Vizaresh, Udai, and Akatash
