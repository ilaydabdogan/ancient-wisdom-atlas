  text: At that time all men become deceivers, great friends divide into different
    parties, and respect, affection, hope, and regard for the soul depart from the
    world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Family affection is said to depart between father and son and between brothers,
