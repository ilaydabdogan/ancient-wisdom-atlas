canonical_text:
  quote: ''
  summary: Auharmazd warns Zaratusht that demons will lead the Iranian countries into
    evil, tyranny, deceit, and devastation. The passage then describes an evil end-time
    marked by social and familial estrangement, diminished sun and time, barren earth,
    crop failure, smaller and weaker humans, disrespect for bread, salt, country,
    boundaries, and religion, improper treatment of dead matter with water and fire,
    and pursuit of the road to hell.
  language: English
  quote_policy: summarized
