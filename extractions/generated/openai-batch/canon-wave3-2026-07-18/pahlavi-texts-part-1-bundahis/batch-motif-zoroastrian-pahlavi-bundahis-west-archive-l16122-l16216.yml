  quote: ''
  summary: The passage gives purity rules for objects contacted by dead matter. It
    specifies different numbers of washings with bull's urine, drying with dust, and
    washings with water for gold, silver, iron, steel, stone, jewels, wood-like substances,
    earthen and horny articles, and other materials. It also prescribes cutting and
    drying firewood for one year before use, and records named authorities' statements
    about these rules.
