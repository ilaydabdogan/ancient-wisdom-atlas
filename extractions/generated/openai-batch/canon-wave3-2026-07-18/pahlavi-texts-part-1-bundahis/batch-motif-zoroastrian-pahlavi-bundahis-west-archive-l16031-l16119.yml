canonical_text:
  quote: ''
  summary: The passage gives ritual-purity rulings about clothing, wool, rugs, carpets,
    and cushions affected by corpses or dead matter; it then discusses cases involving
    pregnant women, children, solitary carriers of the dead, and animals that have
    eaten dead matter, including effects on cleanliness, washing, distance from ablution,
    and pollution of animal products.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Clothing with hair on it is treated like woven cloth for liability to pollution,
    and woven clothing is to be washed six times.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Connected wool is entirely polluted when a corpse rests on one connected part,
    while separate fleece is polluted only where the corpse rests.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a rich carpet and a coarse rug are connected and a person dies on them,
    both are polluted; if they are separated, the rug is clean.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: For unconnected heaped cushions, only the cushion on which dead matter comes
    is polluted.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: For tied cushions, dead matter touching the tie pollutes both the cord and
    cushions; if it touches only a cushion, all cushions are polluted by connection
    but the tie remains clean.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A pregnant woman who sinfully devours dead matter is described as polluted,
    worthy of death, and without washing available for her purification.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The child of such a pregnant woman is assigned ashes and bull's urine for
    eating and washing after becoming acquainted with duties.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A child born to solitary carriers of the dead is said to be clean at birth,
    even if both parents have sinfully devoured dead matter.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Roshan states that one polluted by dead matter through sinfulness is worthy
    of death and that the polluted body never becomes clean.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A solitary carrier of the dead is to be kept thirty steps from ceremonial
    ablution.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: An animal species that has eaten its own dead matter has polluted milk, dung,
    hair, and wool for one year.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: If a pregnant animal has eaten dead matter, the young one is said to have
    eaten it also, and the young one becomes clean one year after birth.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A male animal that has eaten dead matter does not pollute a female when it
    mounts her.
  category: relationship
  evidence_refs:
  - ev:11
