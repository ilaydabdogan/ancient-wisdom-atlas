canonical_text:
  quote: ''
  summary: The passage describes the Gokar or Hom tree growing in the deep mud within
    the wide-formed ocean as necessary for the renovation of the universe and the
    preparation of immortality. The evil spirit places a lizard in the deep water
    to injure the Hom, while Auharmazd creates ten Kar fish to circle and guard it
    until the renovation. It also describes a very large fish, the Vas of Pan/'asart'varan,
    as guardian of water creatures, and a separate many-seeded tree in the ocean whose
    seed contains all plants and is described with curing epithets.
  language: English
  quote_policy: summarized
