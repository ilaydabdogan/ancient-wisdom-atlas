canonical_text:
  quote: ''
  summary: Soshyans says that entry into the best existence does not require the post-death
    ceremony when good works exceed sin by one Tanapuhar; in heaven the lower is elevated
    to the higher, and a man near imperishable existence is called happy. Kushtano-bCi^e^^
    says that an ak-dino, glossed as one of another religion, is saved from hell under
    the same surplus-good-works condition. The supplied range also begins a classification
    of religious communities as pure-law and mixed-law groups and includes translator
    notes on terms and parallels.
  language: English
  quote_policy: summarized
