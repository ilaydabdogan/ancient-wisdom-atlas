  quote: ''
  summary: The passage derives healing herbs from parts of the ox, describes the brilliance
    of the ox’s seed being entrusted to the angel of the moon and purified by moonlight,
    recounts the production of a first male-female ox pair in Airan-ve and the emergence
    of animal species, and then classifies animals by domain, class, genus, species,
    and variety.
  language: English
