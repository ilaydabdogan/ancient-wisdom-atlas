  quote: ''
  summary: The passage describes seven regions arranged around the middle region Khvaniras.
    Khvaniras is encircled by sea and separated from other regions by a lofty mountain
    barrier. It is the place where benefits, heroic groups, the Mazdayasnian religion,
    and Soshyans are located or originate, while the evil spirit also acts there most
    strongly until made impotent by Soshyans.
