canonical_text:
  quote: ''
  summary: The passage describes Auharmazd protecting the sky after the creatures
    are disfigured. The sky speaks deceptively to Aharman and obstructs him while
    Auharmazd prepares a stronger rampart around the sky called righteous understanding.
    Guardian spirits of the righteous, described as mounted warriors with spears,
    are arranged around the rampart like prison guards. Aharman tries to return to
    darkness but finds no passage and fears the future renovation at the end of nine
    thousand years. A cited Gathic passage frames the opposition of the two spirits
    as life-preserving versus life-destroying, extending from Gayomard to humankind.
    The passage concludes that the first contest was the sky against Aharman.
  language: English
  quote_policy: summarized
