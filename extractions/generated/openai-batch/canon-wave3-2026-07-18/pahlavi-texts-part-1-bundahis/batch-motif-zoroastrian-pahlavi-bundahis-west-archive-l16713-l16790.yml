literal_observations:
- id: obs:1
  text: A note describes sacred twigs as passed around twice, fastened with a right-handed
    and left-handed knot on one side, then passed around a third time and fastened
    with a similar double knot on the other side, like the kustik around a Parsi wearer’s
    waist.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note says all ceremonial apparatus must be kept as far removed as the sacred
    twigs.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note says food is to be carried forth on iron, lead, or the basest metal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note says the name of an angel or spirit is mentioned in whose honour cakes
    are consecrated, and identifies prayers used in the consecration and in ceremonial
    worship.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A kustik made of silk is said not to be proper; hair of a hairy goat and a
    hairy camel is proper, and hair from other hairy creatures is proper among the
    lowly.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The least required fullness or slackness for the kustik is exactly three finger-breadths,
    after which remaining excess may be cut off.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: If someone has retained the prayer inwardly, tied the girdle, and then ties
    it anew again, the prior tying is undone and the action is not proper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Thick silk brocade and figured silk are not good for girdling.
  category: attribute
  evidence_refs:
  - ev:7
