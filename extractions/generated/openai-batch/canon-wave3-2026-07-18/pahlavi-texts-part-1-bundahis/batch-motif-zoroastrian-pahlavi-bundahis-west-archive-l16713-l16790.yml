  summary: The supplied passage consists of ritual notes and the opening rules of
    Chapter IV. It describes the tying of sacred twigs by a knotting sequence compared
    with the kustik, mentions ceremonial apparatus, consecrated cakes, and prayers,
    and then gives regulations for the sacred thread-girdle and sacred shirt, including
    proper and improper materials, required measurements, and the relation of girdle-tying
    to prayer.
