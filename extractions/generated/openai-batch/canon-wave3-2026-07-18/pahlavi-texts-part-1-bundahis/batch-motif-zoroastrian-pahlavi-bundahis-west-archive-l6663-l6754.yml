canonical_text:
  quote: ''
  summary: 'A catalogue describes animals and birds with special effects or functions:
    the ox-fish affects fish reproduction by its cry; the Ashozusht bird speaks an
    Avesta-like utterance and resists demonic use of nail-parings; many birds and
    beasts are said to be created in opposition to noxious creatures, demons, wizards,
    wolves, snakes, locusts, ants, and other harmful beings; scavenger birds devour
    dead matter.'
  language: English
  quote_policy: summarized
