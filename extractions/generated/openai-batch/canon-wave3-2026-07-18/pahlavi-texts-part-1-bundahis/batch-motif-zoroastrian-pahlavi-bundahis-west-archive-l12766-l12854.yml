canonical_text:
  quote: the token that it is the end of thy millennium, and the most evil period
    is coming
  summary: Auharmazd explains to Zaratušt a sequence of eras marked by steel and iron.
    Aharman and wizards retreat to darkness; King Khusro keeps Mazdak and the heterodox
    away from the religion; the iron-mixed period is identified with the reign of
    dishevelled-haired demons of the race of Wrath at the end of Zaratušt’s millennium.
    Auharmazd describes the token of this evil period as a vast demonic incursion
    into Iran from the east, with banners, killing, witchcraft, burning, damage, annihilation
    of social and religious goods, and the reduction of large settlements.
  language: English
  quote_policy: quoted
