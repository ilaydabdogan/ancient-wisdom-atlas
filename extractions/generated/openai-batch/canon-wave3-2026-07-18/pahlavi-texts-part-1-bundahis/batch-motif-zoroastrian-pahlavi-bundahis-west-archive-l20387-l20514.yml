- id: obs:1
  text: The earth is said to receive comfort from land on which a righteous man walks.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other comforts of the earth include dwellings of the good with fires, sowing
    corn while taking heed of dead matter, and the presence or birth of beasts of
    burden.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The earth is said to receive discomfort from the Arezur ridge and gate of
    hell, digging for a dead body, a depository for the dead, holes of noxious creatures,
    and the forsaking of an afflicted righteous man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Four stanzas of Ahu-airy-paiti are described as being about benefit connected
    with water, earth, plants, and animals.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several stanzas and repetitions are said to be on account of the existence
    of the sons of Zaratust.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two repetitions of Ashahya-aoj-sairi are for the praise of righteousness and
    the destruction of the fiend.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two repetitions of YeNhe-hatam are for the praise of Auharmazd and the archangels
    and for the destruction of the evil spirit and the miscreations.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two repetitions of Thwoi-staotarascha are for the praise of ceremonial worship
    and the sacred feast.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two repetitions of Ataremcha are for the praise of the Frobak fire and the
    fire Vazist.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The twenty stanzas of Taro-thwa-peresa are described as twenty judgments between
    the beneficent spirit and the evil spirit; repeated utterance of the formula leads
    to the evil spirit becoming confounded the twentieth time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The eleven stanzas of Af-fravakhshya are made up from six chieftainships and
    five accomplishments owing to religion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The listed accomplishments include reciprocal restraint, discernment of good
    and bad action, avoiding the vile and their conversation, confessing failings
    to high-priests, and not neglecting season-festivals or other things connected
    with the bridge.
  category: sequence
