  summary: The passage enumerates comforts and discomforts of the earth, then explains
    the ritual or doctrinal purposes of several Yasna stanzas and repetitions, including
    praise of righteousness, Auharmazd, archangels, ceremonial worship, sacred fires,
    and judgments between the beneficent spirit and the evil spirit.
