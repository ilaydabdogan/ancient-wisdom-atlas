canonical_text:
  quote: ''
  summary: Chapter X §§4-7 describes Dukdavo pregnant with Zarathust, nightly demonic
    attacks prevented by fire in the dwelling, rules for ritual water use and recitation,
    reciting Gathas in relation to the dead and a man in a house, and a prohibition
    on casting wine, aromatic herbs, or food northward at night because a fiend may
    become pregnant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dukdavo is identified as the mother of Zarathust and is pregnant with him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For three nights, each night a leader with one hundred and fifty demons rushes
    to destroy Zarathust.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The existence of fire in the dwelling prevents the demons from finding a means
    to accomplish the destruction.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A rule says disciples have a tank when performing the worship of God and sprinkling
    a stone seat, and the sprinkling is to be done sitting so that a wet place is
    not made.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says high-priests have taught in the Vendidad about making water
    while standing, and that an Avesta is to be uttered by the one who makes water;
    failure to utter it is described as more grievously sinful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A rule says reciting the Gathas over those passed away is not to be considered
    beneficial; the three Has at the beginning of the Ushtavait Gatha are not proper
    to recite on the road, while reciting them over a man in the house is healing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A rule says that at night wine, aromatic herbs, and anything like food are
    not to be cast toward the north quarter, because a fiend will become pregnant;
    if they are cast away, one Yatha-ahu-vairyo is to be uttered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A source note states that a druj or fiend is usually considered female, and
    that demons are supposed to come from the north, where they congregate on the
    summit of Aresur at the gates of hell.
  category: setting
  evidence_refs:
  - ev:6
