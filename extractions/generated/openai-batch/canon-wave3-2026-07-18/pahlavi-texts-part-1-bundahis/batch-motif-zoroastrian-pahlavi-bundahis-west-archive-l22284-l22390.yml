canonical_text:
  quote: ''
  summary: The passage is an extended benediction addressed to an unnamed recipient.
    It invokes Auharmazd and a sequence of named divine beings or angelic figures
    to grant rank, throne, wisdom, understanding, wealth, praise through offspring,
    a wife, plenty, prosperity, herds, divine support, a heavenly throne, lack of
    doubt, an assistant, travel through the seven regions, protection of beasts, judgment,
    protection from demons or fiends, and conduct to resplendent heaven. Editorial
    notes identify the chapter as an elaborate benediction calling blessings from
    archangels and angels whose names correspond to days of the Parsi month.
  language: English
  quote_policy: summarized
