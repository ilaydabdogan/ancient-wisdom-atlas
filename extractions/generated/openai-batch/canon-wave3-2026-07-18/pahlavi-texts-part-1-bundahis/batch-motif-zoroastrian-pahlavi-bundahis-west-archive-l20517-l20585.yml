  quote: ''
  summary: The passage explains the structure and ritual effects of several Gatha
    recitations. A line addressed to Ahura is repeated through the first nineteen
    stanzas and recited twenty times before the last stanza. A note identifies the
    Kmyi bridge as the route of the soul to the other world. The nineteen stanzas
    of Kam-nemoi-zam are associated with perseverance in duty and with nineteen propitiations
    that strengthen the angels and make the destroyer more perishable. Other sections
    list stanza and chapter counts, and explain paired repetitions as retaining or
    embracing Auharmazd and destroying fiends.
  language: English with transliterated Avestan/Pahlavi terms
