  quote: ''
  summary: 'Chapter XVI gives a revealed account of generation: pregnancy after menstruation,
    seed dominance and timing, properties and locations of male and female seed, conversion
    of residual material into blood and milk, classification of elements and creatures
    as male or female, and fish conception in running water. The supplied range also
    includes an embedded note listing ten species of men.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman is said to become pregnant soon when, during ten days and nights after
    coming out from menstruation, men go near her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When male seed is more powerful a son arises, when female seed is more powerful
    a daughter arises, and when both seeds are equal twins and triplets arise.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If male seed comes sooner it adds to the female and she becomes robust; if
    female seed comes sooner it becomes blood and the female's leanness arises from
    it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Female seed is described as cold and moist, flowing from the loins, with white,
    red, and yellow colour; male seed is described as hot and dry, flowing from the
    brain of the head, with white and mud-coloured appearance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Female seed that issues beforehand takes a place in the womb; male seed remains
    above it and fills the womb, while what refrains from this becomes blood again
    and enters female veins.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: At the time someone is born, material becomes milk and nourishes the newborn;
    the text says milk arises from male seed and blood is that of females.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sky, metal, wind, and fire are classified as male, while water, earth,
    plants, and fish are classified as female; the remaining creation consists of
    male and female.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fish at the time of excitement move forward and back in running water two
    by two, rub their bodies together, a kind of sweat drops out between them, and
    both become pregnant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An embedded note says a Parst manuscript names ten species of men, including
    breast-eyed, three-eyed, breast-eared, elephant-eared, one-legged, web-footed,
    leopard-headed, lion-headed, camel-headed, and dog-headed.
  category: other
  evidence_refs:
  - ev:6
