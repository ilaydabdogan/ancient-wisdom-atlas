  summary: 'The passage gives rules about corpse pollution: how dead matter affects
    substances, ground, and water; what to do when a dog or person dies in a house
    where a ceremony is prepared; how fire must be protected and kept from a corpse;
    when a wall may or may not be cut; and how prepared or unprepared food in the
    house is treated afterward.'
