canonical_text:
  quote: ''
  summary: 'The introduction argues that Zoroastrian/Parsi doctrine should not be
    simplistically labeled dualistic: Aharman is a personal evil spirit but is limited,
    ignorant, not eternal, and ultimately impotent. The passage summarizes Bundahish
    claims about Aharman arising from the abyss, seeing light, producing demons and
    noxious creatures, and losing power at the resurrection. It compares Aharman with
    the Christian devil, then rejects reports that boundless time produced both Auharmazd
    and Aharman by citing a Pahlavi passage in which Auharmazd creates Zorvan/time.'
  language: English
  quote_policy: summarized
