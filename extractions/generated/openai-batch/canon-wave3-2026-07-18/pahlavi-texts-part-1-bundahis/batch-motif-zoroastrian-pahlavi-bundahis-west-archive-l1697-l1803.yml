  quote: ''
  summary: The passage is an editorial introduction describing Bundahis manuscript
    witnesses and translating a small fragment. The translated fragment gives a royal
    chronology, mentions Kai-Kayus going to the sky, places Zaratuhaj-t the Spitaman’s
    coming with tidings from the creator Auharmazd in a Capricornus millennium, states
    that King Vij-tasp received the religion, lists later rulers and dynasties, and
    gives a manuscript colophon.
  language: English translation of Pahlavi material
  quote_policy: summarized
