canonical_text:
  quote: ''
  summary: The passage describes seasonal changes in day and night, measures the longest
    and shortest days by Hasars, marks equality of day and night at Hamespamadayem,
    divides the year into seven months of summer and five of winter, and explains
    how priests use this calculation for ritual regulation. It also lists daily periods
    for summer and winter and relates them to the appearance of stars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that night increases after the shortest day and that from
    the season named Me<^iyarem to the season of Merf'ok-shem night decreases while
    day increases.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The summer day is described as twice as long as the shortest winter day, and
    the winter night as twice as long as the shortest summer night.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage gives summer day as twelve Hasars and summer night as six Hasars;
    winter night is twelve Hasars and winter day is six.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A Hasar is described as a measure of time and also, in like manner, a measure
    of land.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: During Hamespamadayem, the five supplementary days at the end of the month
    Spendarmad, day and night are again equal.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Summer is defined as seven months from the day Auharmazd of Fravardin to the
    day Aniran of Mitro; winter is defined as five months from the day Auharmazd of
    Avan through Spendarmad and the five supplementary days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A priest fulfills regulation about a corpse and other matters by the calculation
    of summer and winter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the seven months of summer there are five periods of the days and nights
    because Rapitvin is celebrated.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The named summer periods are Havan at daybreak, Rapitvin at midday, Auzerin
    in the afternoon, Aibisrutem from the stars’ appearance until midnight, and Aushahin
    from midnight until the stars become imperceptible.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:10
  text: In winter there are four periods; from daybreak until Auzerin is all Havan,
    and the rest are as previously stated.
  category: sequence
  evidence_refs:
  - ev:8
