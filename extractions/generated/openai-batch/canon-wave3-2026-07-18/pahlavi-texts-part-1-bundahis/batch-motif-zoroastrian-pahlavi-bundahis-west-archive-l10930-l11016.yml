canonical_text:
  quote: ''
  summary: 'Aharman is confounded by a formula and falls back to gloom. Auharmazd
    produces the bodily creatures of the world in six categories: sky, water, earth,
    plants, animals, and mankind, with fire diffused through all six. For three thousand
    years the embodied creatures and heavenly lights remain still. Auharmazd produces
    unrestricted Time to aid the celestial sphere and set his creatures in motion.
    He brings forward a dark envelope connected with Time and speaks of the serpent,
    Aharman''s own daughter, religion, and an upheaval after nine thousand years.
    Aharman then accompanies Time to the star station, brings darkness into the sky,
    and leaves a deficiency extending over one-third of the star station.'
  language: English
  quote_policy: summarized
