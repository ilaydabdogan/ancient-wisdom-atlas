  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kasak river comes out through a ravine in the province of Tus and is locally
    called the Kasp river; the Veh river is also called Kasak there and in Sind.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Pert'ak-miyan, identified with the A^atru-miyan river, is in Kangdez.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Dara^a river is in Airan-vef, and Porushasp, the father of Zara-tu5-t,
    had a dwelling on its bank.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Other innumerable waters, rivers, springs, and channels are said to be one
    in origin with the named waters, though they receive different names in different
    districts and places.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Frasiyaz is said to have conducted a thousand springs into the sea Kyansih,
    suitable for several kinds of domestic animals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
