canonical_text:
  quote: ''
  summary: The passage catalogues named rivers, their sources, routes, receiving seas,
    and alternate regional names. It states that innumerable waters, rivers, springs,
    and channels share one origin but are called by various names in different places.
    It also reports that Frasiyaz conducted many springs and navigable waters, including
    the Zarinmand/Hetumand and waters of the Va/c-aeni source, into the sea Kyansih
    and settled people there.
  language: English
  quote_policy: summarized
