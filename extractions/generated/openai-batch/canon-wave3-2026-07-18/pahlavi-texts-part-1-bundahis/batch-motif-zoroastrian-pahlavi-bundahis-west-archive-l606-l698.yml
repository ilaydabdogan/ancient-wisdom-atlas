canonical_text:
  quote: ''
  summary: The passage explains difficulties in reading Pahlavi script, especially
    ambiguous letters, limited vowel notation, and Huzvarish logograms. It describes
    the risk that pronunciations of Semitic logograms were forgotten, the compilation
    of a Huzvarish-Pazand glossary to record pronunciation and meaning, the possible
    creation of artificial readings, and disagreement between Parsis and European
    scholars over traditional readings.
  language: English
  quote_policy: summarized
