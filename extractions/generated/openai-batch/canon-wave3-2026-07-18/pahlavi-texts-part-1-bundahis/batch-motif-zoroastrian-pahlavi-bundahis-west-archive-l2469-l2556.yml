canonical_text:
  quote: ''
  summary: The passage is an introduction discussing chronological inconsistencies
    in the Bahman Yašt concerning the expected advent of Hushe^ar, invasions or reigns
    of demon-races, millennial periods, destruction of the wicked, the roles of Vahram
    the Var^avand and Peshyotanu, and the textual basis of the Pahlavi manuscript
    tradition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says hypotheses about the threefold origin of the Yašt's present
    form are supported by inconsistencies in chronological details, especially the
    periods of the invaders' reign and Hushe^ar's birth.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Zoroastrians have long expected Hushe^ar, the first of their
    last three apostles, and have repeatedly postponed that expectation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One chronology places the last great battle of the demon-races at the end
    of Zaratui-t's millennium, with the wicked destroyed before the next millennium
    of Hushe^ar.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says a reign of evil is expected to arise and fall near the end
    of Zaratui-t's millennium, followed by Hushe^ar's appearance to restore the good
    religion.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another chronology says the demon-race invasion occurs when Zaratui-t's millennium
    ends; Hushe^ar is born then, and Vahram the Var^avand later advances into Iran
    with an innumerable army to destroy the invaders.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage links one Pahlavi commentator's expectations to his own historical
    setting, including the reign of Auharmazd IV and the military success of Bahram
    A'opin against invaders.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: A later chronology says Hushe^ar will be born in 1600, the demon-races will
    reign for a thousand years, Peshyotanu will restore the religion near the end
    of the millennium, and Var^avand will be prominent when Hushe^ar comes from conference
    with Auharmazd at age thirty.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says the compiler likely postponed Hushe^ar's advent and the destruction
    of the wicked, and that later Zoroastrians still had to postpone or interpret
    the prophecies less literally.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The translator's Pahlavi text of the Bahman Yašt is said to rely on the old
    manuscript K20 and on dependent modern copies, with aid from the Pazand version
    for missing words.
  category: object
  evidence_refs:
  - ev:9
