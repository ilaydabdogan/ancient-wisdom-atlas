  quote: ''
  summary: 'The passage states ritual conditions affecting the efficacy or ownership
    of good works: reverencing the sun, washing dirty hands, and destroying corruption
    so that angels may come to the body. It then describes allowable forms of the
    propitiation of fire by formula, explains shnuman and fire formulas in notes,
    and prescribes actions and punishments for someone who extinguishes a fire.'
  language: English
  quote_policy: summarized
