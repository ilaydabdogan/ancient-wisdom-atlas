  quote: ''
  summary: 'The passage classifies plant products and fruits: scented plant substances
    are called scent, plant stickiness is called gum, timber from trees is called
    wood, and the plants are called medicinal. It lists thirty principal kinds of
    fruit divided by whether their inside or outside is fit to eat. It also states
    that every flower is appropriate to an angel, with a note relating these angels
    to the thirty angelic names used for the days of the Parsi month.'
