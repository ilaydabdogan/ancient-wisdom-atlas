canonical_text:
  quote: ''
  summary: 'The passage classifies created animals by habitat, bodily form, and species.
    It distinguishes grazing valley animals, hill or mountain animals, and water-dwelling
    animals; then gives five genera: cloven-footed grazing animals, ass-footed animals,
    five-dividing-pawed animals, flying animals, and water animals. It further says
    these five genera are divided into 282 species, then lists examples among goats,
    sheep, camels, oxen, horses, and dogs, including the Kuri^k sheep used as a steed
    and the griffon of three natures as the largest flying creature.'
  language: English
  quote_policy: summarized
