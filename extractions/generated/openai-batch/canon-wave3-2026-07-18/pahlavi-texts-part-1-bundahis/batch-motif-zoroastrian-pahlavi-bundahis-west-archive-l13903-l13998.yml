  summary: The passage combines editorial/source description of the Haḍokht Nask with
    a Bahman Yast scene. It describes ritual recitations, duties, heavenly beings,
    demons, fate at a celestial bridge, and spoken remedies. It then narrates Neryosang
    traveling with righteous Srosh to Kangdez, summoning Peshyotanu to go to Iran
    and restore the religious throne, followed by Peshyotanu performing a holy-water
    rite with 150 righteous disciples and proceeding with the formula of good thoughts,
    good words, and good deeds.
