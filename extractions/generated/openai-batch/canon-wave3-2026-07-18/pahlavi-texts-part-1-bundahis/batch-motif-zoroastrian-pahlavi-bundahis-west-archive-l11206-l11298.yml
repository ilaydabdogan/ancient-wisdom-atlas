canonical_text:
  quote: ''
  summary: The passage explains that Gayomard was protected from sickness and death
    for an appointed thirty-year period by a decree of Time. It then describes Jupiter
    as life-giving toward creatures and Saturn as death-bringing, with their positions
    in Cancer, Libra, and later Capricornus explaining the completion of Gayomard's
    life and his suffering through defects brought by Aharman upon Auharmazd's creatures.
  language: English
