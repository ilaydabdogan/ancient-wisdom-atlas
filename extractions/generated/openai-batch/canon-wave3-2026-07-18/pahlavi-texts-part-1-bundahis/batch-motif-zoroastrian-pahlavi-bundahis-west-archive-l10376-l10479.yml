canonical_text:
  quote: The family of the Mobads ('priests').
  summary: The passage gives genealogies of several priestly figures and related families,
    including Bahak, Ataro-pad son of Maraspend, Mitro-varas, Durnamik, Mitro-akavi,
    and the narrator's mother Humai. It also states that Bahak was Mobad of Mobads
    to Shahpuhar son of Auharmazd, and that Kat was great preceptor to Darai. Notes
    discuss manuscript context, uncertain pronunciations of names, and chronological
    or genealogical difficulties.
  language: English
