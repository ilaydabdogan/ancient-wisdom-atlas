canonical_text:
  quote: ''
  summary: The passage describes the evil spirit's conflict with the earth. When the
    evil spirit rushes in, the earth shakes and mountains are created. Mount Alburz
    arises first, other mountain ranges grow from its root, and the mountains are
    compared to a tree rising to the clouds with roots below. A great mountain is
    called the knot of lands; subterranean water passages beneath mountains are compared
    to tree roots and to blood in human arteries. The mountains are said to grow from
    the earth over eighteen years, contributing to human advantage.
  language: English
