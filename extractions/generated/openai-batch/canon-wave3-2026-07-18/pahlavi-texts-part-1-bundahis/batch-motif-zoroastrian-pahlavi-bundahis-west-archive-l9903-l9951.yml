canonical_text:
  quote: ''
  summary: 'A fragment of Bundahis genealogy and legendary history: Aghrerad obtains
    divine favor so that Iranian army and champions are saved, is then slain by Frasiyaz,
    and begets Gopatshah as recompense. The passage gives Auzobo’s family line, tells
    how Auzobo rescues the abandoned child Kavard from a river and raises him, and
    then lists Kayan descendants from Kavard to Kai-Khusrob. Editorial notes identify
    several names with Avesta and Shahnamah forms.'
  language: English
  quote_policy: summarized
