canonical_text:
  quote: ''
  summary: The passage gives rules for retaining or relinquishing a ritual period
    of the day according to visible stars, with variant opinions about named and zodiacal
    stars. It then begins an appendix fragment in which Zaratušt, seated before Auharmazd,
    asks for information, perceives Auharmazd in human-like form, asks to grasp his
    hand, and is told that Auharmazd is an intangible spirit. Zaratušt then asks whether
    Auharmazd and the archangels should be worshipped when they are unseen and intangible.
  language: English
  quote_policy: summarized
