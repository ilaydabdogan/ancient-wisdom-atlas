- id: obs:1
  text: A first-person speaker beseeches through well-thought, well-said, and well-done
    thought, word, and deed, with the good augury of celestial and terrestrial angels
    upon virtuous creation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writing is dated to the second fortunate conjunction during the high-priestship
    of Spendya, son of Mah-vindad, son of Rustom, son of Shatroyar.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Spendya is described with honorific religious epithets, including God-devoted,
    sagacious, a cultivator of righteousness, lover of good works, and high-priest
    of the good religion of the Mazdayasnians.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the writing of the Bundahish was set going by the
