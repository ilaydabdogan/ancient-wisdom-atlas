canonical_text:
  quote: ''
  summary: The passage contains an invocation, a colophon naming the high-priest Spendya
    and his lineage, and an explanation that the writing of the Bundahish began after
    the coming of the Arabs to Iran. It contrasts Arab heterodoxy and ignorance with
    Kayan orthodoxy, describes evil times in which orthodox religious speech is devalued,
    and frames the treatise as a source for propriety and knowledge of tradition.
  language: English
  quote_policy: summarized
