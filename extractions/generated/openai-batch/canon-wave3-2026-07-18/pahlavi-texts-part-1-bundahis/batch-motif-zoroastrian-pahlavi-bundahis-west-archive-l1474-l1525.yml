  summary: The introduction describes the TD manuscript as containing additional material
    and extra chapters, then lists chapter headings. The headings concern Auharmazd's
    original creation, the evil spirit, formation of light, the destroyer's rush at
    creatures, opposition of spirits, and a numbered series of conflicts waged by
    creations and by entities such as water, earth, plants, the primeval ox, Gayomar^,
    fire, and constellations.
