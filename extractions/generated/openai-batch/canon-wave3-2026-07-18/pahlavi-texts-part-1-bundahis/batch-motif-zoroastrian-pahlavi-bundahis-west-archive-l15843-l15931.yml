canonical_text:
  quote: ''
  summary: Ritual-legal instructions describe how a corpse is to be removed from water,
    with attention to minimizing water pollution, showing the corpse to a dog, carrying
    it by two men, disputed rules about dragging it through water, and the intention
    required of the person entering the water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who is first and best able to act is to bring the corpse out of the
    water, using the breadth of the water if possible and otherwise the length.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The usual showing to a dog and waiting for two men are not to delay removal
    while the corpse is still in the water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After removal, the corpse must be placed far enough from the water that water
    dripping from it does not continuously reach back to the water; if it does, the
    person is described as worthy of death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the corpse is away from the water, it is to be shown to a dog and carried
    away by two men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Marz-bud and Roshan give opinions on throwing the corpse out of the water,
    both concerning distance and whether dripping corpse-water reaches back to the
    water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: One rule allows dragging the corpse over the water but forbids grasping and
    relinquishing it; moving it from a great water to a small water is allowed when
    the waters are connected and not allowed when separated.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Afarg and Medok-mah give opposing opinions about whether it is allowable to
    drag the corpse below or above through the water, each explaining the rule in
    terms of danger to the water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person entering the water is to do so with the idea that if there are many
    corpses below, he will bring all of them; disturbing another corpse without this
    intention causes pollution.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the corpse is too heavy for one person, the person may go out to prepare
    means to remove it; if he wilfully does not return, his body is described as polluted.
  category: sequence
  evidence_refs:
  - ev:6
