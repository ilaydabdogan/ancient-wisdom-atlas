canonical_text:
  quote: ''
  summary: The passage gives a genealogy leading to Zarathust, identifies Porushasp
    and Arasti as sons of Paitirasp, states that Zarathust brought and expounded the
    religion in Airan-vej, and says Mertyok-mah received it from him. It traces the
    Mobads of Pars to Manujchihar's race, then lists Zarathust's three sons and three
    daughters, assigning roles to the sons and distinguishing offspring of a serving
    wife and a privileged wife.
  language: English
  quote_policy: summarized
