- id: obs:1
  text: At the time when life departs, a dog is described as tied to the person's
    foot; the Nasu/Nasui rushes upon the body and is then destroyed when seen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dogs named as able to destroy the Nasu include the shepherd's dog, village-dog,
    blood-hound, slender hound, and rukunik, though a contrary opinion about the rukunik
    is reported.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dog destroys the Nasu when it sees the flesh, but not when it sees hair
    or nails.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A blind dog destroys the Nasu when it places a paw on the corpse, but not
    when the paw is placed on hair or nails.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The birds named as destroying the Nasu are the mountain kite, the black crow,
    and the vulture.
