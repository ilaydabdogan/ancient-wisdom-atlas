canonical_text:
  quote: ''
  summary: Chapter II gives ritual rules about corpse pollution at death. The Nasu/Nasui
    rushes upon the dead body, but specified dogs, a blind dog under paw-contact conditions,
    and specified birds can destroy it. The efficacy depends on direct sight of flesh,
    contact with the corpse, or a bird's shadow, and is denied for hair or nails and
    for seeing in water, a mirror, or a looking-glass. A dispute over the rukunik
    dog is also recorded.
  language: English
  quote_policy: summarized
