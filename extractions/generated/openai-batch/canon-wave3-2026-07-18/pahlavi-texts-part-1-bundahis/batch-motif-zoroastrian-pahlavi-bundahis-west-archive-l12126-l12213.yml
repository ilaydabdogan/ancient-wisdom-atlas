canonical_text:
  quote: ''
  summary: 'The passage describes several kinds or lodgments of beneficent glory/fire:
    one active in plants and seed, one moving in clouds, and the Supremely-benefiting
    glory lodged in the Behram fire. It then describes the protective work of the
    Behram fire against a spiritual fiend and witches. It states that at creation
    the earth was entrusted to three sacred fires, gives their mountain locations,
    and recounts an episode in Hoshang''s reign in which fire-stands on the ox Sruvo
    fall into the sea and one great fire becomes three glories lodged in the three
    fires.'
  language: English
  quote_policy: summarized
