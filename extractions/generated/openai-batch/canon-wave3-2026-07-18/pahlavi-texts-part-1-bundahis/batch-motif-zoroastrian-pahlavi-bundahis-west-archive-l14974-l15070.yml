canonical_text:
  quote: ''
  summary: The passage gives ritual-legal instructions for carrying and temporarily
    placing a corpse in relation to rain, clouds, a veranda, a flooded deposition
    place, and a temporary shelter. It then gives rules for pollution when a person
    dies on cloth, a bedstead, plaster, ground, or stone, including when pollution
    is transmitted downward and when materials become clean.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a corpse is not to be carried completely covered,
    because that is treated as burying the corpse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that carrying a corpse in rain is an offense described
    as worthy of death; the note explains this as allowing rain to fall on a corpse
    before deposition in the Dakhma.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: When clouds have been around, it is allowable to carry the corpse away from
    the house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: If rain begins while the corpse is on the road, it is not to be carried back
    to the house; if it is before a veranda, it may be put down there when the veranda
    owner is apprehensive and does not allow it inside.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When water stands to the height of a javelin inside the corpse's destination,
    the corpse is put down and later brought away again.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Me^'ok-mah is cited as saying that a shelter should be fastened above the
    place so that it is dry below, the corpse should be put under it, and the shelter
    may afterward be taken away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the place where life goes forth, if a person dies upon a cloth and a hair
    or limb remains upon the bed-place and ground, the ground conveys pollution downward
    to water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the person is on a bedstead whose legs are not connected with the ground,
    a hair or limb left on the bedstead does not convey pollution downward.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a person dies on a plastered floor, the plaster is polluted; after the
    plaster is dug up and spread again, it is clean.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a person dies on stone, the space occupied by the corpse is polluted; connected
    stone may become clean with the ground after a year, and polluted stone that is
    dug up is to be washed.
  category: sequence
  evidence_refs:
  - ev:6
