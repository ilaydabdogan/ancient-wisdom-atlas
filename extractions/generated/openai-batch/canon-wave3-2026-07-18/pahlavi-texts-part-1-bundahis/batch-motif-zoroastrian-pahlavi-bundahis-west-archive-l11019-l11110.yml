canonical_text:
  quote: ''
  summary: Aharman enters the created world at the frontier of the sky, scorches it,
    brings darkness through the waters and earth, and establishes an entry-passage
    described as the way to hell. He then comes to a central single-root tree, which
    withers, and to the sole-created ox, which Auharmazd mitigates with the narcotic
    bang before it becomes ill and falls. Auharmazd also forms a radiant fifteen-year
    figure from sweat and sends it to Gayomard; the figure sees the world darkened
    and filled with noxious creatures.
  language: English
  quote_policy: summarized
