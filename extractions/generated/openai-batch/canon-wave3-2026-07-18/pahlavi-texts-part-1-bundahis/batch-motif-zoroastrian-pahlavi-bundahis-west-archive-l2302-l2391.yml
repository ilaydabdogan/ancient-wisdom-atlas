canonical_text:
  quote: ''
  summary: 'The passage summarizes an eschatological sequence: ZaratCut asks how many
    can perish; demons appear; Hushe^ar is born near Lake Frazdan; Vahram the Var^avand
    raises armies and defeats demon races; Auharmazd sends angels to summon Peshyotanu
    to restore sacred fires and ceremonies; Hushe^ar proves his authority by stopping
    the sun; Hushe^ar-mah’s age includes the release of the serpent-origin fiend A^-i
    Dahak from Mount Dimavand and his killing by Keresasp; Soshyans appears, purification
    and resurrection occur, and future existence begins. The final portion comments
    that the extant text is probably an epitome or composite form connected with the
    Vohuman Yast and older Avesta/Pahlavi layers.'
  language: English
  quote_policy: summarized
