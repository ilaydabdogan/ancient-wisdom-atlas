  summary: The introduction explains the translator's literal translation policy,
    use of italics for supplied words, notes for doubtful passages and scholarly details,
    and reference practices for Avestan texts. It also states that the work does not
    attempt to trace myths or traditions earlier than the Avesta, warning that Indo-Iranian
    or meteorological reconstructions would be speculative and that myths may have
    entered from unknown sources.
