canonical_text:
  quote: ''
  summary: The passage describes three fires that fall into the sea and rise like
    breathing souls, giving light so men can pass through the sea. It then recounts
    the histories and locations of the fires Frobak, Gushasp, and Burzin-Mitro under
    Yim, Vistasp, Kai-Khusrob, and Zaratusht, and closes by comparing the fires’ indwelling
    souls to the soul dwelling in a human body.
  language: English
  quote_policy: summarized
