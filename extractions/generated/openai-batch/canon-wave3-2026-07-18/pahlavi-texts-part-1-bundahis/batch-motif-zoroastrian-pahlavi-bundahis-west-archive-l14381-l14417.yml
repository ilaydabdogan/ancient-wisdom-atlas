canonical_text:
  quote: ''
  summary: In an eschatological sequence, fire and water speak as if refusing their
    normal functions. Auharmazd commands Srosh and Neryosang to shake the body of
    Keresasp until he rises. They cry out three times, and on the fourth time Sam
    rises, confronts Azi Dahak, refuses his words, and kills him with a club. Desolation
    and adversity then leave the world; Auharmazd begins a millennium; Soshyans purifies
    the creatures, and resurrection and future existence occur. The passage closes
    with a prayer for peace, pleasure, and joy.
  language: English
  quote_policy: summarized
