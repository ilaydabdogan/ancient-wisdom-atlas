canonical_text:
  quote: '"Stand still!"'
  summary: Auharmazd declares that Hushe^ar will be born, confer with him at thirty
    years of age, receive the religion, and command the sun to stand still. The sun
    stands still for ten days and nights, and people accept the good Mazdayasnian
    religion. Mitro then tells Hushe^ar to command the sun to move again because darkness
    covers the regions of the world; after Hushe^ar does so, the sun moves and mankind
    believes. Auharmazd further foretells restoration, the later appearance of Peshyotanu,
    conflict with enemies who weaken the religion and destroy fire, the millennium
    of Hushe^ar-mah, the destruction of a serpent-origin fiend, a future mastery of
    medicine that prevents death, and a fragmentary notice about heretics and Aharman
    rising onto a mountain.
  language: English
  quote_policy: quoted
