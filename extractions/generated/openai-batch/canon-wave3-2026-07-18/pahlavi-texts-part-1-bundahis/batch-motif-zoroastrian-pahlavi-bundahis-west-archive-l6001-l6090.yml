canonical_text:
  quote: ''
  summary: Mashya pours milk toward the north, strengthening demons; after fifty years
    Mashya and Mashyoi regain desire and conceive offspring. Their first male-female
    pair is devoured by the parents through tenderness for offspring, after which
    Auharmazd removes that tenderness so children can be nourished. Seven sibling-spouse
    pairs arise from them, followed by named descendants and fifteen races; nine races
    travel over the ocean on the ox Sarsaok to other regions, while six remain in
    Khvaniras.
  language: English
  quote_policy: summarized
