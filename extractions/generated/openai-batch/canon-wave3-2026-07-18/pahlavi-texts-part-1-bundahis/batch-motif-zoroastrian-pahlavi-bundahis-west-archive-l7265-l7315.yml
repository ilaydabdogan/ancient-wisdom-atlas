canonical_text:
  quote: "“In revelation they mention seventeen species of liquid (maya)”"
  summary: The passage opens a revelatory enumeration of liquids. It says seventeen
    species are mentioned, though the accompanying note says only fourteen are detailed
    here. The listed liquids include plant liquid, river water from mountains, rain-water,
    water of tanks or constructions, several bodily fluids of animals and men, oil,
    saliva that nourishes the embryo, liquid under plant bark shown by a drop on a
    twig near fire, and milk. Notes mention textual variants and relate the material
    to Pahlavi Yasna and Yasna passages on water.
