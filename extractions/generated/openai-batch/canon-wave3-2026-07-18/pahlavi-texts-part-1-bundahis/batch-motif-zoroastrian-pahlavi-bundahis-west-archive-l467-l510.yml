  summary: The passage is an introductory philological discussion of Pahlavi writing.
    It describes Chaldee or Semitic logograms, contrasts Pahlavi usage with Arabic
    borrowings in modern Persian, explains the optional use of logograms as Huzvarij
    and pronounce-as-spelt words as Pazand, and notes uncertainty about the etymology
    of Huzvarij.
