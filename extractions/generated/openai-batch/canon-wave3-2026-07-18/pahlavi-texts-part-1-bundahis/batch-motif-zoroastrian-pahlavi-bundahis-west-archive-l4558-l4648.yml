canonical_text:
  quote: ''
  summary: The passage describes wind moving waters to the earth’s borders and the
    wide-formed ocean arising. Dead noxious creatures leave venom in the earth, so
    Tištar enters the ocean as a white horse to remove poison. Apaosh appears as a
    black horse and first drives Tištar back, but Auharmazd grants Tištar great strength,
    causing Apaosh to flee. Tištar then uses a cloud as a jar to produce prodigious
    rain; demons oppose the rain, and fire Vazišt strikes with a club. Ten days and
    nights of rain mix venom into the water, making it salt, and wind later restrains
    the waters so seas and fountains become manifest.
  language: English
  quote_policy: summarized
