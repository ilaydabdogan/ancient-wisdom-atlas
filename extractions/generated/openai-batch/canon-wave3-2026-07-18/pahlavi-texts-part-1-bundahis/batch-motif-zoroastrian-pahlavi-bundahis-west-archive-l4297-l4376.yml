canonical_text:
  quote: ''
  summary: Chapter V describes seven planetary chieftains coming to seven constellation
    chieftains, including named pairings of planets and stellar or luminary counterparts.
    It then says the sun attaches the thievish, tail-bearing Milxpar/Muspar to its
    radiance so that it can do less harm. The passage also describes Mount Alburz
    encircling the world and Mount Terak, which is called the middle of the world;
    the sun's revolution is compared to a moat around the world, and sun, moon, and
    stars return from behind Terak.
  language: English
  quote_policy: summarized
