  quote: ''
  summary: The passage gives ritual instructions about a sacred cake and sacred twigs,
    declares the sacred cake of a disreputable woman ineligible for consecration,
    restricts saying a fire-presentation phrase when the fire's splendour is not seen,
    prescribes washing at night and after contact from a menstruous woman, and adds
    a rule attributed to Ataro-pa^ son of Mara-spend about setting apart a mouth-veil
    and clothing from gifts so a soul may become easier.
  language: English
  quote_policy: summarized
