  summary: The chapter opens by invoking Auharmazd as creator. It introduces the Zand-akas
    as a work concerning Auharmazd's original creation, the antagonism of the evil
    spirit, and the nature of creatures from the original creation until the future
    existence. It declares, according to the religion of the Mazdayasnians, that Auharmazd
    is supreme in omniscience and goodness. A note identifies the evil spirit with
    Avesta Angra-mainyu and discusses related Pahlavi forms.
