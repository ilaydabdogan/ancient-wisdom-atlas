  quote: ''
  summary: An angel pounds plants and mixes them with water seized by Tii-tar, who
    makes it rain over the whole earth. Plants grow everywhere. Ten thousand plant
    types arise to keep away diseases made by the evil spirit, and from them many
    more plant species grow. From the same plant germ arises the tree of all germs
    in the wide-formed ocean, increasing all plant germs. Near it the Gokar tree is
    produced to keep away decrepitude, and the world's full perfection arises from
    it.
