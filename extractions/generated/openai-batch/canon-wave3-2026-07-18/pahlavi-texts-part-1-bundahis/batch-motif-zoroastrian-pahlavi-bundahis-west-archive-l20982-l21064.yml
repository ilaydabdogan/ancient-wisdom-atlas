canonical_text:
  quote: each individual of us has produced his own one creation (dayak) for the world
  summary: 'Auharmazd tells Zaratusht that each of the named spiritual beings has
    produced a corresponding worldly creation. The passage lists seven correspondences:
    Auharmazd with the righteous man, Vohuman with cattle, Arshavahisht with fire,
    Shatvairo with metal, Spendarmad with earth and virtuous woman, Horvadad with
    water, and Amerodad with vegetation. Care for all seven is said to keep the soul
    from Aharman and the demons. The passage then gives instructions for propitiating
    Auharmazd through care and protection of the righteous man and for propitiating
    Vohuman through care and protection of well-yielding cattle.'
  language: English
  quote_policy: quoted
