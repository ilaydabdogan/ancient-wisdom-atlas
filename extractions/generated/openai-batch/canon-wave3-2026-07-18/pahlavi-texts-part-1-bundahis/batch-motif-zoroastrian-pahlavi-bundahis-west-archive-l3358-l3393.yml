  summary: The passage explains editorial conventions for transliterating Pahlavi
    names and words, especially the use of italics to distinguish certain letters
    and sounds. It notes attempts at uniform spelling despite inconsistencies in cited
    languages, writings, and manuscripts. It then comments that translators may initially
    undervalue Pahlavi texts and authors, but greater knowledge leads to greater appreciation,
    and expresses hope that the translations will correct low estimates of Pahlavi
    writers.
