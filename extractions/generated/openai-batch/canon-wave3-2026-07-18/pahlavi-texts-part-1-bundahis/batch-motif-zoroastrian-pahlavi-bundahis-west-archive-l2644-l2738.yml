canonical_text:
  quote: ''
  summary: 'The passage summarizes a fragment related to the Bahman Yast, centered
    on Husheyar’s millennium: Husheyar destroys the wolf race; the winter of Malkos
    destroys animals and vegetation, after which the world is repeopled from Yim’s
    enclosure; nations fight a great battle on the Euphrates; Varjavand takes Iran;
    and Peshyotanu is summoned to restore religious ceremonies. The passage then introduces
    the Shayast la-shayast as a compilation on proper and improper ritual/legal matters,
    sin, impurity, and ceremonies.'
  language: English
  quote_policy: summarized
