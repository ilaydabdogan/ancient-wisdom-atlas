canonical_text:
  quote: ''
  summary: The passage explains the purposes of four Yatha-ahu-vairyo recitations;
    aligns portions of the Ahunavaiti Gatha with divine beings and earthly creations;
    assigns the progress of named Gathas and the Yasna to social and religious ranks;
    and gives numbered explanations for sections and stanzas of the Yasna of seven
    chapters, including hot ordeals, thanksgiving for Auharmazd's good creations,
    and the earth's comforts and discomforts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four Yatha-ahu-vairyos of the first Gatha are said to exist so that inferiors
    may become more tolerant of superiors' commands, good thoughts, good words, and
    good deeds may become more domesticated in the world, and the fiend may become
    more powerless.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage pairs seven named Gathic or liturgical units with divine beings
    and earthly creations, including Auharmazd with the righteous man, Vohuman with
    cattle, Ar^avahisht with fire, Shatvairo with metal, Spendarma with earth, Horvadad
    with water, and Amerodad with plants.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Progress in the Ahunavaiti, Ushtavaiti, Spenta-mainyu, Vohu-khshathra, and
    Vahishto-ishti Gathas is assigned respectively to house-rulers, village-rulers,
    tribe-rulers, province-rulers, and supreme Zaratushts.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:4
  text: The passage states that the progress in the Yasna, described as the place
    of righteous blessing, should be carried on by four classes themselves.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Yasna of seven chapters is described as having a beginning section with
    nine stanzas and as beginning and ending with Humatanam.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The six stanzas of Ahya-thwa-athro are attributed to six hot ordeals, with
    a translator note suggesting the corrupt Avesta phrase may refer to a quadruple
    fire.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The five stanzas of Itha-as-yazamaide are described as thanksgiving and praise
    for Auharmazd's production of the good creations.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The five stanzas of Imam-as-zam are attributed to five comforts and five discomforts
    of the earth, summarized from the Vendidad according to the translator note.
  category: relationship
  evidence_refs:
  - ev:8
