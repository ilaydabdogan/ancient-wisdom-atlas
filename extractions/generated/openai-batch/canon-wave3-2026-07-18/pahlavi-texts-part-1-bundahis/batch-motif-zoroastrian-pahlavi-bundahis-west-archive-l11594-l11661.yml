canonical_text:
  quote: ''
  summary: Aharman comes to the earth, which sets itself against him. Through the
    earth’s shattering, Alburn and the other mountains arise; Alburn is described
    as the boundary of the earth, and the other mountains number 2244. The mountains
    bind and arrange the earth, support plant growth, nourish cattle, and assist humans.
    Mountain substance is said to have been created before the destroyer’s coming;
    mountains grow like a tree with roots below and branches above. Their connected
    roots form passages by which water moves upward, compared to blood moving in veins
    toward the heart. The passage gives periods for the completion of the mountains
    and the longer growth of Alburn.
  language: English
  quote_policy: summarized
