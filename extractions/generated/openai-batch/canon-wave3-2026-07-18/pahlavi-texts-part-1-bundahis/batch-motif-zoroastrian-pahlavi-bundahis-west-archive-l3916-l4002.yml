  quote: ''
  summary: The passage links the Rapitvin Gah with a midday or mid-sky time/star context,
    with editorial notes on directional chieftain stars. It then describes Aiiharmazd
    performing a spiritual Ya^'i^n ceremony with the archangels in the Rapitvin Gah,
    supplying means to overcome the adversary, deliberating with the consciousness
    and guardian spirits of men, and presenting through omniscient wisdom a choice
    between bodily struggle against the fiend and perpetual protection from the destroyer.
    The guardian spirits agree to go to the world, despite evil from Aharman, with
    the expectation of future perfection and immortality.
