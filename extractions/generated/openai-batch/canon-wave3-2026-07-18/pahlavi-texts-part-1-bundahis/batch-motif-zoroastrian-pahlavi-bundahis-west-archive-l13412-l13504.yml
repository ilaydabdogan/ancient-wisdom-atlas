canonical_text:
  quote: ''
  summary: The passage closes a reverential statement about male and female members
    of the congregation and archangels. Zaratust asks Auharmazd how the good Mazdayasnian
    religion will be restored and how demons of the race of Wrath will be destroyed;
    he also asks that he and his favored ones not live through a perplexing time leading
    to wickedness and hell. Auharmazd answers by describing a future fiend, Sheodaspih
    of Kilisyakih, after the sovereignty of the race of Wrath. Reported commentators
    identify the advancing people and describe red weapons, red banners, and hats.
    Their advance is accompanied by celestial signs, a multicolored moon, earthquakes,
    violent wind, distress, and astrological indications of sovereignty for the vile,
    followed by a red-bannered movement into Iranian countries toward named river
    regions and Asuristan.
  language: English
  quote_policy: summarized
