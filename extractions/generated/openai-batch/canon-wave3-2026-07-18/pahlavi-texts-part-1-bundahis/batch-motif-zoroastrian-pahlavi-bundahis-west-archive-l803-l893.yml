  summary: The passage is an introductory discussion of Pahlavi script and manuscript
    transmission, the decline and preservation of Pahlavi literature, and the title
    and scope of the Bundahis. It states that the Bundahis means “creation of the
    beginning” or “original creation,” describes it as a fragmentary Pahlavi work
    on cosmogony, mythology, and legendary history in Mazdayasnian tradition, and
    notes that its earlier part concerns the development of creation under good and
    evil influences.
