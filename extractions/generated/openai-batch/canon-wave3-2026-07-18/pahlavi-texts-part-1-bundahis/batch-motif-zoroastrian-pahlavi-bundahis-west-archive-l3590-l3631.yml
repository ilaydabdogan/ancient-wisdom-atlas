  summary: The passage describes the evil spirit's attempt to destroy the light of
    Auharmazd, his retreat to gloomy darkness after seeing its greater glory, and
    his formation of demons and fiends. Auharmazd and the evil spirit each perceive
    the other's creatures. Auharmazd proposes peace and offers immortality and freedom
    from hunger and thirst in return for assistance and praise, but the evil spirit
    refuses and vows destruction and alienation of Auharmazd's creatures.
