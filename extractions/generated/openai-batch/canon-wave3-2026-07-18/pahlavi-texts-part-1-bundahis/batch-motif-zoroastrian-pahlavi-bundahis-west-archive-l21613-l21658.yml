  summary: A concluding funerary instruction says that a fragment is laid across a
    body’s limbs, with a note explaining it as likely from the place of death. A new
    chapter states that Aeshm rushed to Aharman and declared he would not enter the
    world because Auharmazd had produced three things there beyond his power. Aharman
    asks him to name them, and Aeshm begins with the season-festival. Notes identify
    Aeshm as the demon of wrath and chief agent of the evil spirit against mankind.
