  summary: The passage sets out ritual rules for substituting a prepared form of worship
    with a thrice-consecrated sacred cake and twig-bundle, recognizing a more knowledgeable
    religious authority as high-priest so as not to imperil the soul's bridge and
    best existence, properly keeping and cleaning household fire, and making no use
    of even small articles left with a dead person.
