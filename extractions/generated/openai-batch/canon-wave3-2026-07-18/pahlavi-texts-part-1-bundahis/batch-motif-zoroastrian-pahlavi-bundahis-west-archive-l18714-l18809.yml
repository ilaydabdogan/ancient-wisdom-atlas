canonical_text:
  quote: ''
  summary: The passage gives rules about proper recitation of the Avesta, Zand, and
    Ahunavar formula, warning against muttering or imperfectly voicing it. A cited
    Bagh Nask passage has Auharmazd tell Zarathust that a person who inwardly mutters
    the Ahunavar and then lets part of it escape aloud will have his soul kept away
    from the best existence by an interval as wide as the earth. The passage then
    states that doubtful actions should be avoided and that opinions should be formed
    through consultation.
  language: English
  quote_policy: summarized
