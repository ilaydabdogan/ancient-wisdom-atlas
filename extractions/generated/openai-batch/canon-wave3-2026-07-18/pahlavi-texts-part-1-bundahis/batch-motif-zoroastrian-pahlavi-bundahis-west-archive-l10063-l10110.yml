  quote: ''
  summary: The passage recounts a vow to give a first son to Aushbam, Aushbam's rescue
    of the woman from her fierce father, and Kai-Apiveh's birth, dedication, and companionship
    with Aushbam. It then gives genealogical notices about the mother of Auzobo, children
    begotten by Sam in male-female pairs, Dastan's eminence and territorial grants,
    and Avar-shatro's association with Avarnak, blessings to Srosh and Ar/avahi^t,
    horses, arms, religion, purity, joy, fame, and reputation.
  language: English
