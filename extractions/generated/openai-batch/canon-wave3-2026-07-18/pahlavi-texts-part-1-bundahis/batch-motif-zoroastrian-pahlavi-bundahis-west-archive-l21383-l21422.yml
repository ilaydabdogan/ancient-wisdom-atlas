canonical_text:
  quote: ''
  summary: Zarathustra asks Ahura Mazda when meat must not be eaten. Ahura Mazda replies
    that, when someone dies in a house, meat is not to be placed on the sacred cake
    or eaten by the deceased person's relations until three nights are complete; non-meat
    foods may be placed instead. For the three days the ceremony of Srosh is to be
    performed because Srosh can protect the soul from demons during that period. A
    note explains that the soul is thought to remain near the body for the first three
    nights and to depart for the other world at the third dawn.
  language: English
  quote_policy: summarized
