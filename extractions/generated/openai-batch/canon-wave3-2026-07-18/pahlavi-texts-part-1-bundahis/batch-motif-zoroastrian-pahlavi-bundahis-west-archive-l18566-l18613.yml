    the evil eye, judges, corn, crime, and punishment.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The next twenty sections include topics on furious cattle, mad dogs, wealth,
    marriage of sons and daughters, charity and waste, best and worst actions, unlawful
