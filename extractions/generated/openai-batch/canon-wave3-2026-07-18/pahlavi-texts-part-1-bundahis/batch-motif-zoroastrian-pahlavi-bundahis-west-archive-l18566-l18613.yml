  summary: The passage gives a brief summary of contents attributed to the Husparam
    nask, including a teaching ascribed to high-priests, variant names for the nask,
    and lists of sections on priestly study, ritual formulas, social and property
    law, animals, marriage, children, trees, burial, suffering, healing, physicians,
    and astrology.
