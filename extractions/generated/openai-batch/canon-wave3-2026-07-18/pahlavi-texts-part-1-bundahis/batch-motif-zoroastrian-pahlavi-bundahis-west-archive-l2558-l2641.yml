canonical_text:
  quote: ''
  summary: 'The passage first discusses the textual state of Pazand and Persian versions
    of the Bahman Yašt. It then summarizes the conclusion of the Persian version:
    Hushedar-mah appears, adversity departs, the sun stands still, many people accept
    the religion, milk and butter replace meat, a terrible serpent and noxious beings
    are removed, and fiends depart. Later Soshyans appears, destroys a fiend tormenting
    fire, another solar stillness leads all humanity to believe, Dahak briefly escapes
    confinement, Sam Nariman is roused and kills him, evil departs, mankind becomes
    like archangels, and resurrection occurs with details compared to Bundahis XXX.'
  language: English
  quote_policy: summarized
