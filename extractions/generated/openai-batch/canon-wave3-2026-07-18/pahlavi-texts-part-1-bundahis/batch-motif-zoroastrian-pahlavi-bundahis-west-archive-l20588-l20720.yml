  summary: 'The passage explains correspondences between Gathic and Visperad recitations,
    their repetitions, numbers of stanzas or lines, and religious meanings: laudation
    of divine or beneficent beings, destruction of evil beings, judgments, waters,
    plants, metal, social ranks, nightly blessing, and healing of communities.'
