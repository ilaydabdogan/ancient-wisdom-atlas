  quote: ''
  summary: In a dialogue passage, a speaker identifying as Zaratust addresses Auharmazd
    as creator and links being made immortal with a harm-opposed tree and named immortal
    figures. The speaker says this would lead men to believe in Auharmazd's good Mazdayasnian
    religion. Auharmazd replies that if he makes Zaratust the Spitaman immortal, Tur-i
    Bratarvash the Karap will also become immortal.
