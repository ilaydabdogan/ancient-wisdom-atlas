canonical_text:
  quote: ''
  summary: Auharmazd offers peace to the evil spirit, who refuses and proceeds to
    conflict. Auharmazd declares that the evil spirit is not omniscient or almighty
    and cannot destroy him or permanently take his creatures. Through omniscience,
    Auharmazd sets a nine-thousand-year contest, divided into three three-thousand-year
    periods, knowing this will undo the evil spirit. He recites the Ahunavar formula
    and reveals the final triumph, demon annihilation, resurrection, and everlasting
    future existence of the creatures. The evil spirit becomes confounded and falls
    back into gloomy darkness.
  language: English
  quote_policy: summarized
