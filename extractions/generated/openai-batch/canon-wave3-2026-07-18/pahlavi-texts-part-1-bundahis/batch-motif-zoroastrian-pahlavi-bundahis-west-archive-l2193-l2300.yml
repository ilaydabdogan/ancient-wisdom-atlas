canonical_text:
  quote: ''
  summary: The passage first describes manuscript witnesses and lacunae for related
    Pahlavi texts. It then summarizes the Bahman Yast as a prophetic work in which
    Auharmazd tells Zaratust the future of the Iranian nation and religion. Zaratust
    asks for immortality, receives temporary omniscient wisdom, and sees trees with
    metal branches interpreted as periods or ages of the religion. The summarized
    narrative includes future adversity, invasions by demons or idolators, Zaratust's
    question about restoration, and a later conflict in which the wicked are destroyed.
  language: English
  quote_policy: summarized
