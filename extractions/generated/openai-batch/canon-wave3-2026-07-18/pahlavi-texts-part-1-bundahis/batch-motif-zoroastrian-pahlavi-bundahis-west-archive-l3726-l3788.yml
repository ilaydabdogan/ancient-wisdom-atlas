canonical_text:
  quote: ''
  summary: 'The passage describes Aharman''s confusion, Auharmazd''s production of
    creatures beginning with Vohuman or good thought, the evil spirit''s production
    of falsehood and evil thought, the first created world element as the sky, Vohuman''s
    production of the world''s light and the Mazdayasnian religion, later named good
    beings, dark-world beings of Aharman, and a six-part order of world creatures:
    sky, water, earth, plants, animals, and mankind.'
