canonical_text:
  quote: ''
  summary: The passage lists genealogical relations among named heroic and royal figures.
    It then says that the glory of Fretun settled on the root of a reed in the wide-formed
    ocean; Noktarga used sorcery to form a cow, fed reeds to the cow until the glory
    went to it, milked the cow, and gave the milk to his three sons. Because the sons
    walked on hoofs, the glory did not go to them but to Farhank, who went away with
    the glory when Noktarga wished to injure her.
  language: English
  quote_policy: summarized
