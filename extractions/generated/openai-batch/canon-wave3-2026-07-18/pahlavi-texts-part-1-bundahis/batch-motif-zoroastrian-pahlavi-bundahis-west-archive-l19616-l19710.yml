  text: A cited teaching says that a son may be suitable as another person's son,
    while a daughter is not suitable as another person's daughter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says many do not appoint an adopted son on the assumption that
