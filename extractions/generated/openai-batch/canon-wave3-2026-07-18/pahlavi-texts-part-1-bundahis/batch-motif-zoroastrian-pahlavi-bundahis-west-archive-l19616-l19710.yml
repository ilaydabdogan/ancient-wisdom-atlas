  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The high-priests are said to teach that duties and good works performed by
    a son count as the father's, as if done by the father's own hand.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A rule says that what is given to the worthy should be proper and more than
    proper for eating and accumulation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a man gives bread to another man who already has too much, the good works
