canonical_text:
  quote: ''
  summary: The passage prescribes ceremonies for the dead over the first three nights,
    at dawn after the third night, on the fourth day, and in later tenth-day, monthly,
    and annual observances. It names sacred cakes for Rashnu/Rashnta and Astad, Vae
    the good, and the righteous guardian spirit; clothing is placed with the guardian-spirit
    cake. Notes explain that named angels are stationed at the Kinvad bridge where
    the soul gives an account, and that clothing is provided so the spirit is not
    unclothed in the other world. The passage also describes what to do when death
    occurs far from the place where news arrives, and includes a partial opening statement
    about three condemned categories.
  language: English
  quote_policy: summarized
