    the righteous guardian spirit is to be performed; tenth-day, monthly, and annual
    ceremonies follow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: If a person dies far from the place where the news arrives, the three-day
    ceremonies are preferred at the death place; otherwise they are performed at the
