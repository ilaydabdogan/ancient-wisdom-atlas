canonical_text:
  quote: ''
  summary: 'The passage gives ethical and religious counsel: one should turn enemies,
    wicked people, and ignorant people toward friendship, righteousness, and learning;
    direct human movement toward the abodes of the well-informed, the good, and fires;
    prefer actions for the soul over actions for the body; understand Gathas and renunciation
    of sin as opposition to adversarial or fiendish forces; treat the world without
    anxiety while using it to provide spiritual existence; and attend to maxims concerning
    truth, deceit, fire, giving to the vile, death, wickedness, and righteousness.'
  language: English
  quote_policy: summarized
