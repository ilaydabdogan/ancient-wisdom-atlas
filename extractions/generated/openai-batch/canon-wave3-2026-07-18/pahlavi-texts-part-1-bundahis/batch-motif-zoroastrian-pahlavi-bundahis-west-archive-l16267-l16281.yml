  quote: ''
  summary: A ritual-legal passage gives rules for cleanliness, pollution, and washing
    of foodstuffs and materials. It states that fruit with a perceptible rind is not
    polluted by contact with dead matter, while fruit without a perceptible rind is
    washed like another specified substance. It also states that meat, butter, milk,
    cheese, and preserves are not washed.
