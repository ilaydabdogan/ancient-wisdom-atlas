canonical_text:
  quote: ''
  summary: The passage describes end-time suffering according to deeds, a special
    punishment for Dahak and Frasiyaz, the assistance of righteous men and damsels
    to Soshyans, Gochihar's fall, molten metal flowing over the earth, universal passage
    through that metal for purification, reunion and inquiry about the soul's judgment,
    collective praise of Auharmazd and the archangels, Auharmazd's completion of his
    work, and Soshyans' ceremony in which an ox and white Hom are used to prepare
    Hush that makes all men immortal and restored.
  language: English
  quote_policy: summarized
