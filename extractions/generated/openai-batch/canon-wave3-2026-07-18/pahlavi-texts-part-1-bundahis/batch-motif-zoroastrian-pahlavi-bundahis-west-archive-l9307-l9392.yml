- id: obs:1
  text: Persons suffer for their own deeds; righteous and wicked persons may be divided
    even within father-son, brother, or friend relationships.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dahak, Frasiyaz of Tur, and others with comparable deeds undergo a punishment
    called the punishment of the three nights, which other men do not undergo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fifteen righteous men and fifteen damsels who are described as living come
    to the assistance of Soshyans in the renovation of the universe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gochihar falls from the celestial sphere from a moon-beam onto the earth,
    and the earth becomes distressed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fire and halo melt metal in the hills and mountains, and the melted metal
    remains on the earth like a river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: All men pass into the melted metal and become pure; the righteous experience
    it as warm milk, while the wicked experience it as melted metal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Afterwards all men come together affectionately, and relatives or friends
    ask one another where the soul has been and whether it was judged righteous or
    wicked.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The body asks the first soul it sees the same questions about its prior state
    and judgment.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: All men become of one voice and loudly praise Auharmazd and the archangels.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Auharmazd completes his work, and the creatures no longer require effort to
    be made about them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Soshyans and his assistants perform a ceremony for preparing the dead, slaughter
