canonical_text:
  quote: ''
  summary: The passage gives ritual and doctrinal rules concerning priestly apostasy,
    discussion of the good religion with priestly authorities, proper and improper
    ceremonial worship, renunciation of sin, disposal of a dead person from a vessel
    into water, and prohibitions on eating or consuming water and vegetables in darkness
    or with unwashed hands because demons or fiends seize portions of wisdom and glory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A priest who passes away, or possibly passes over, in idolatry is described
    as desolate; a high-priest is said to hold a different reading or opinion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a supreme high-priest passes away in idolatry, an apostate will be born
    in that dwelling and the calamity is uttered or announced.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Steadfastness in the good religion is to be discussed with priests and high-priests,
    and one who does not discuss it should not teach it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ceremonial worship performed in a fire-temple, when not done aright, does
    not reach the demons; worship performed in other places, when not done aright,
    does reach the demons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage states that there is no medium in worship: it reaches either
    angels or demons.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man who relinquishes a bad habit and engages in renunciation of sin has
    his good work advance unto the future existence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If someone dies in a vessel, it is allowable, for fear of contamination, to
    throw the body into the water; some say the water itself is the receptacle for
    the dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Eating food in the dark is not allowable because demons and fiends seize one-third
    of the eater's wisdom and glory.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Auharmazd's speech to Zaratust prohibits consuming, after the departure of
    light and with unwashed hands, the water and vegetables of Horvadad and Amerodad;
    if this is done, the fiend seizes two-thirds of existing original wisdom.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A translator's note identifies Horvadad and Amerodad as archangels whose chief
    duties are the protection of water and plants, respectively.
  category: relationship
  evidence_refs:
  - ev:9
