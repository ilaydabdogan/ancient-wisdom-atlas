canonical_text:
  quote: ''
  summary: The passage explains correspondences between named Yasna or ritual chapters
    and stanza counts, human constituents, material elements, future apostles, judgments,
    judges, warriors, and countries. Three named chapters each have eleven stanzas
    corresponding to eleven spiritual things in human bodies, whose bodies are formed
    from water, fire, and wind. Another chapter is connected with three recitations
    before the coming of Hushe^ar, Hushe^ar-mah, and Soshyans, whose presence is associated
    with a flourishing country. A twenty-two-stanza chapter is connected with twenty-two
    judgments and the better judgment of judges. A sixteen-stanza chapter is connected
    with warriors protecting sixteen countries mentioned in the Vendidad.
  language: English
  quote_policy: summarized
