canonical_text:
  quote: ''
  summary: 'The passage describes manuscript witnesses for the Bundahis: an unnamed
    fragmentary manuscript representing a third line of descent from a common original,
    omissions likely caused by lost folios, and the M6 codex, including its provenance,
    physical description, contents, dated colophons, chapter order, omissions, and
    probable dependence on a decayed exemplar.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed manuscript is described as not very old, containing only a fragment
    of the text, and not descending from either K20 or M6 but representing a third
    line of descent from their common original.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unnamed manuscript agrees with K20 in general chapter arrangement and
    in containing Chapter XXXI, differs from K20 in some details of that chapter,
    agrees with M6 in some verbal peculiarities elsewhere, and has not been collated
    in any other chapter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The omission of nearly twenty central chapters is presented as indicating
    that an ancestor manuscript had lost many central folios before copying and that
    the copyist did not notice the deficiency; the passage adds that such unnoticed
    omissions often occur in Pahlavi manuscripts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: M6 is identified as a very old codex brought to Europe by Haug in 1866 and
    now held as No. 6 of the Haug collection in the State Library at Munich.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: M6 consists of 240 folios of very old but well-preserved Indian paper of large
    octavo size, with thirteen later folios prefixed, and is bound in two volumes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: M6 contains nineteen Pahlavi texts written seventeen to twenty-two lines per
    page, some with Avesta; eleven texts are also found in K20, and the Bundahis is
    the fourteenth text, occupying folios 53-99 of the second volume.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Two other texts in M6 have dated colophons fifty days apart in A.Y. 766 /
    A.D. 1397, and the passage treats them as probably the actual dates when the colophons
    were written because 150 folios lie between the two dates.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'The arrangement of the Bundahis in M6 differs from K20: M6 orders the chapters
    as XV-XXIII, I-XIV, XXIV-XXVII, XXX, XXXII, XXXIV, and omits XXVIII, XXIX, and
    XXXI.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The omissions and misplacement of chapters in M6 are stated to make it probable
    that the manuscript from which its Bundahis was copied was already decayed; the
    passage says this is supported by more than fifty peculiar mistakes scattered
    across much of the text.
  category: other
  evidence_refs:
  - ev:9
