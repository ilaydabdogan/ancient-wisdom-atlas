canonical_text:
  quote: ''
  summary: The passage describes Asto-vidi/Asto-vidart and many demons being sent
    against Giyomar/Gayomar, but failing to noose him because his appointed time has
    not arrived. Gayomar declares that mankind will be of his race. The evil spirit
    corrupts fire with smoke and darkness; planets and demons disrupt the celestial
    sphere and constellations; angels battle demons for ninety days and nights, hurling
    them to hell and forming a rampart of the sky. Hell is located in the middle of
    the earth at the place where the evil spirit pierced it, and the world becomes
    marked by duality, persecution, contention, and mingling of high and low.
  language: English
  quote_policy: summarized
