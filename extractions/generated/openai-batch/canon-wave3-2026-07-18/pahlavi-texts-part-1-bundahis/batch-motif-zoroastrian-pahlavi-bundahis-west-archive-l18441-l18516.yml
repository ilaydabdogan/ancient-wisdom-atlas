canonical_text:
  quote: "“Three days and three nights no one is to pass between the fire and the
    child”"
  summary: 'The passage first summarizes legal sections on theft, family responsibility,
    animals, valuation, warriors, and practical regulations. It then gives rules for
    childbirth assistance: ten women are needed, the cradle is prepared, the infant
    is received, the navel cord is cut, and the fire is made to blaze. For three days
    and nights the child is protected from passage between it and the fire and from
    being shown to sinful persons; the child is smeared with sulphur in plant sap
    and first fed Hom-juice and aloes. Further rules state that beating an innocent
    man accrues sin until his pain ceases, that trusting a false judge causes deficient
    clouds and rain, diminished cattle and goat qualities including milk, and destruction
    of children in the womb, and that a marriage rule begins but is cut off in the
    excerpt.'
  language: English
  quote_policy: quoted
