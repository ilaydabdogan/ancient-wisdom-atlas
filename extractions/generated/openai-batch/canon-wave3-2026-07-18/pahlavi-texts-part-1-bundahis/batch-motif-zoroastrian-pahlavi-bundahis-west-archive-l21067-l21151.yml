canonical_text:
  quote: ''
  summary: 'Instructional passage on propitiating divine beings through their worldly
    counterparts or associated entities: Ardvahisht through the fire of Auharmazd,
    Shatvairo through melted metal, and Spendarma through the earth and a virtuous
    woman. The passage forbids stolen or extorted ritual materials, describes a pure
    heart as unharmed by molten metal, cites Ataropad son of Maraspend as an example,
    and states that wicked sinners burn and die when molten metal is dropped on their
    hearts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who wishes to propitiate Ardvahisht is instructed to promote his
    things and to propitiate the fire of Auharmazd at every place and time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fire is not to be served with stolen or extorted wood, incense, holy-water,
    or food-ration violently extorted from people.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The fire of Auharmazd is described as a counterpart of Ardvahisht in the world;
    those who propitiate the fires gain subsisting fame in the world and the splendour
    of Auharmazd in heaven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A person who wishes to propitiate Shatvairo is instructed to propitiate melted
    metal at every place and time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Propitiation of melted metal is defined as maintaining habits of the heart
    so unsullied and pure that molten metal dropped on it does not burn.
