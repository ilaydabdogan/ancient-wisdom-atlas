canonical_text:
  quote: ''
  summary: 'Auharmazd states that he has not rested because he protects his creatures,
    while the evil spirit likewise has not rested because he contrives evil for them.
    The passage then describes the evil spirit seducing mankind away from Auharmazd''s
    religion through witchcraft and false thoughts, followed by a catalogue of several
    demons and their harmful functions: Akoman, Andar, Savar, and Naikiyas.'
  language: English
