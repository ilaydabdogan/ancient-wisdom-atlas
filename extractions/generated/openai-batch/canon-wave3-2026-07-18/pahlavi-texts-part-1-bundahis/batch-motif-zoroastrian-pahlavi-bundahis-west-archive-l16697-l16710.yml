  quote: ''
  summary: The passage prescribes how a menstruating woman is to be seated at measured
    distances from water, fire, sacred twigs, and a righteous man; how her food is
    to be brought in iron or lead vessels by someone standing at a set distance; and
    what she is to utter aloud during worship at the dedication of consecrated sacred
    cakes.
