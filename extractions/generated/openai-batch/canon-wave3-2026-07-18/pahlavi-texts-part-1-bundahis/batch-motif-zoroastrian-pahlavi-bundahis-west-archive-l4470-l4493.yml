canonical_text:
  quote: ''
  summary: A revelation describes the evil spirit's attack on creation. The spirit
    of the sky is compared to an armored warrior and the sky is arrayed against the
    evil spirit while Auharmazd completes a stronger rampart. Guardian spirits of
    warriors and the righteous keep watch around the sky. The evil spirit finds no
    passage, retreats, and beholds the annihilation of demons and his own impotence,
    while Auharmazd beholds final triumph and everlasting renovation of the universe.
