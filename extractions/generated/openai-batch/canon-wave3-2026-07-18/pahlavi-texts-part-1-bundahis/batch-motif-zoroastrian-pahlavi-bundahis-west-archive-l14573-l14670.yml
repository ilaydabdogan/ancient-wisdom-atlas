  quote: ''
  summary: The passage gives a scale of named offence or sin degrees measured in dirhams
    and stirs, and the notes explain that this scale was extended from assault offences
    to sins and good works. A note states that sins are weighed in the golden scales
    of the angel Rashnu against good works after the third night after death, and
    that the soul is sent to heaven, hell, or an intermediate place according to the
    balance. The notes also compare the scale with Vendidad assault punishments by
    lashes.
