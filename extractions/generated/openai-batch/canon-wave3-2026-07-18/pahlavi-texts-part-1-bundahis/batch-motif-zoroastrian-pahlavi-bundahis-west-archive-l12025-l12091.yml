canonical_text:
  quote: ''
  summary: Aharman comes against Gayomard; a pure propitious liturgy and Auharmazd’s
    pure meditation oppose him. When Gayomard dies, eight metallic minerals arise
    from his members, and gold is produced from his life and seed. Spendarmad receives
    the gold of the dead Gayomard, which remains in the earth for forty years. After
    that period Mashya and Mashyoi arise in plant-like form, joined together and difficult
    to distinguish as male or female; a glory is associated with them. Auharmazd says
    glory was created before body and later given a body for activity. The pair then
    change from plant-shape into human-shape, and the glory enters them spiritually.
  language: English
  quote_policy: summarized
