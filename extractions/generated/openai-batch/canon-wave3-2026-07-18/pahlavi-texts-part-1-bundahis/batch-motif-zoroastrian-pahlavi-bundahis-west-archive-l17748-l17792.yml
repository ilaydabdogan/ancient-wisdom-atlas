canonical_text:
  quote: ''
  summary: The passage reports sayings attributed to Nosai Bur-Mitrō about next-of-kin
    marriage, sacred twigs, pregnancy, and atonement. It states that sins against
    water or fire may be atoned for in prescribed ways, that killing certain noxious
    creatures can atone for a sin against water, that a Tanapuhar sin can be counterbalanced
    by consecrating a sacred cake or performing a good work of the same weight, and
    that a high-priest may kill a mortal sinner under specified conditions. A quoted
    rule is noted as uncertain.
