canonical_text:
  quote: ''
  summary: The passage describes the second conflict, centered on water. While Tištar
    is in Cancer and the destroyer intrudes for mischief from the west, Tištar enters
    Cancer as a rain-producer and raises water aloft by wind. Named divine helpers
    cooperate with him. Tištar takes the forms of a man, a horse, and a bull over
    thirty days and nights, raining ten days and nights in each form. The rain floods
    the earth to a man's height and kills the noxious creatures, which go into holes
    in the earth.
  language: English
  quote_policy: summarized
