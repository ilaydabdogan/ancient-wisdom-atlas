  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Blight is spread over the vegetation, and the vegetation withers immediately.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Avarice, want, pain, hunger, disease, kist, and lethargy are spread upon the
    ox and Gayomard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Before the evil spirit comes to the ox, Auharmazd grinds healing fruit in
    water before the ox’s eyes to lessen its damage and discomfort; the ox becomes
    lean and ill, dies, and says that cattle are to be created and their work, labour,
    and care appointed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before the evil spirit comes to Gayomard, Auharmazd brings forth sweat upon
    Gayomard and forms that sweat into the youthful body of a radiant, tall fifteen-year-old
