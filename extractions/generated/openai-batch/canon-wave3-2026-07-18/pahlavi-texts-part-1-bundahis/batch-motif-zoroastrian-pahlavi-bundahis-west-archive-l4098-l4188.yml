canonical_text:
  quote: ''
  summary: The passage describes the evil spirit and demons entering the sky and descending
    to earth, piercing the earth, moving through water, vegetation, the ox, Gayomard,
    and fire, darkening and injuring creation, and spreading noxious creatures, blight,
    and afflictions. Auharmazd acts beforehand to lessen harm to the ox and to prepare
    Gayomard; the ox dies after speaking of future cattle, and Gayomard emerges from
    sweat and sees the darkened, contested world.
  language: English
  quote_policy: summarized
