canonical_text:
  quote: ''
  summary: In Chapter VIII, Aharman comes to the plants, which struggle against him
    while the vegetation is dry. Amerodad takes the essence of the world's vegetation,
    pounds it small, and mixes it with Tishtar's rain-water. After rain, the earth
    sprouts many plant species, including species provided to keep away diseases.
    Seeds from the plants produce the tree of all germs in the wide-formed ocean;
    a griffon bird on that tree scatters dry seed into water, and the seed returns
    to earth with rain. Nearby appears the white Hom tree, described as a counteractor
    of decrepitude.
  language: English
  quote_policy: summarized
