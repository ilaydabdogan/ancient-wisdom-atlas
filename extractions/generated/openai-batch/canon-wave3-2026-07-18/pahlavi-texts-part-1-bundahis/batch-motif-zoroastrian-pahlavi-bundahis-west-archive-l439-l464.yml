  quote: ''
  summary: The passage explains that Pahlavi writing used Semitic words within Persian
    sentences as written representatives or logograms for Persian words that were
    spoken. It gives an example of a Semitic written form read as Persian, notes that
    Parsis still read Pahlavi this way, and links the disappearance of the Semitic
    written element to adoption of a modern alphabet. It ends by noting a later, different
    influx of Semitic words after much of the nation became Muhammadan.
  language: English
