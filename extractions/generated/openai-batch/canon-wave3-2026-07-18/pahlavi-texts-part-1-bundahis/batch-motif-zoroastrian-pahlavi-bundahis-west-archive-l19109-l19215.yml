literal_observations:
- id: obs:1
  text: The passage gives equivalences for named weights or measures, including Srosho-zaranam,
    Agerept, Aivirist, Aredusr, Khor, Basai, Yat, and Tanapuhar.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that everyone ought to be unhesitating and unanimous that
    righteousness is the one good thing, heaven is the one good place, and contentment
    is the more comfortable thing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a sheep or goat is slaughtered and divided, its meat-offering is to be
    presented according to a specified distribution of body parts.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: The tongue, jaw, and left eye are assigned to Horn; the neck to Ashavahirt;
    the head to Vae; the right shoulder to Ardvisur; and the left shoulder to Drvasp.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: The right thigh is assigned to the guardian spirit of Vistasp, the left thigh
    to the guardian spirit of Gamasp, the back to the supreme chiefs, the loin to
    the spirits, the belly to Spendarmaid, and the testicles to the star Vanand.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:6
  text: A note identifies the section as explaining which part of the animal is suitable
    for use in a ceremony dedicated to one of the angels or spirits mentioned.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Notes identify Horn or Haoma as the angel of the Horn plant, Vae as assisting
    righteous souls toward the other world, Ardvisur as connected with waters, Drvasp
    as connected with cattle, and Spendarmaid as connected with the earth.
  category: attribute
  evidence_refs:
  - ev:7
