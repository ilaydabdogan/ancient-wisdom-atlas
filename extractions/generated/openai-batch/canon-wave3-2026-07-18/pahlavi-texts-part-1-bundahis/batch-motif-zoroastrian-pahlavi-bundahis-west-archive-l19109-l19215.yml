  summary: The passage lists several ritual weights or measures, states that righteousness
    is the one good thing, heaven the one good place, and contentment the more comfortable
    thing, and begins instructions for presenting a sheep or goat meat-offering by
    assigning particular animal parts to named angels, spirits, chiefs, and a star.
  language: English
