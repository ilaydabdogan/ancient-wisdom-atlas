canonical_text:
  quote: they rise from that place where the life went out from their bodies
  summary: The passage states that some souls become demonic or snake-like, instructs
    people to submit to priestly scriptural guidance to learn duties and good works,
    discusses a difficult case about death-worthy action and duty, and gives answers
    about the place from which the dead rise again. A note also describes Dron consecrations
    with ritual objects, priests, and fire.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage says that one whose begetting is owing to demons is himself a
    demon, that the soul of one who commits sodomy will become a demon, and that the
    soul of one who performs apostasy rites will become a dartino snake.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A footnote glosses the opening statement as meaning that there is no resurrection
    for the persons being discussed.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Auharmazd is reported as telling people to give up their persons submissively
    to the man for whom the whole Avesta and Zand is easy, so that he may make them
    acquainted with duties and good works.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says men go to hell when they do not submit their persons to priestly
    control and do not become acquainted with duties and good works.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A query asks whether a person should avoid an action that the Avesta calls
    not good and worthy of death, or should accomplish and urge it on for the advance
    of religion in uncertainty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The answer says there is no fear when people act well for better preservation,
    but also says that a duty is not to be forsaken and that a forsaken duty is very
    bad.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: ZaratO^t asks Auharmazd whether people rise again from the place where they
    first went into their mothers, from the place where their mothers gave them birth,
    or from the place where their bodies happen to be.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Auharmazd replies that people rise from the place where life went out from
    their bodies, not from the place of conception, birth, or later bodily location.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A further question asks from where one is raised if he is suspended from something
    and dies in the air.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The reply says such a person is raised from the place where his bones and
    flesh first fall to the ground, with an exception for death on a divan or bed
    before the body is carried away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A note describes consecration of Drons with thirty-three beans, thirty-three
    eggs, fruit, sun-shaped and crescent-shaped Drons, fire, clothes, an assistant
    priest, and a chief priest.
  category: sequence
  evidence_refs:
  - ev:6
