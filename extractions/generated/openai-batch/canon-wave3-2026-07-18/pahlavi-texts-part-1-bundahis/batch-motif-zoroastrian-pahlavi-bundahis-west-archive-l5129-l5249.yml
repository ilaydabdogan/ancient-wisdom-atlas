  quote: ''
  summary: The passage catalogues named mountains and hills, gives their locations,
    and states that many mountains in various districts have grown from larger mountains,
    especially Mount Aparsen. It says these mountains foster tillage and prosperity.
    It identifies Dimavand as the mountain where Bevarasp is bound, describes a mountain
    that broke off and slid into a plain during the war of the religion and saved
    the Iranians, and notes mountain-associated places including a lake, a fortress-road,
    and the abode of the Bumn-Mitro fire.
