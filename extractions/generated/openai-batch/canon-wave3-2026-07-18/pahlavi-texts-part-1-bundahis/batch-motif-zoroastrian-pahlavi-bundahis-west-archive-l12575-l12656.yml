canonical_text:
  quote: ''
  summary: Zaratust consumes an unspecified portion connected with omniscient wisdom
    and remains for seven days and nights in the wisdom of Auharmazd, seeing living
    beings, plants, and roots throughout the seven regions of the earth. Auharmazd
    then withdraws the wisdom, and Zaratust describes the experience as a pleasant
    dream. Asked what he saw, Zaratust reports reversals between wealthy and poor
    people in hell, paradise, and social esteem, and a tree with seven metal branches.
    Auharmazd explains the tree as the world and the branches as seven future periods,
    beginning with the golden reign of King Vistasp.
  language: English
  quote_policy: summarized
