    sickness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: When a corpse that a dog has not seen is moved by a thousand men, the bodies
    of the whole number are polluted and require ceremonial washing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: For a corpse that a dog has seen, the passage distinguishes between moving
