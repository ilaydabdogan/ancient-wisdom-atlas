canonical_text:
  quote: ''
  summary: 'The passage gives ritual rules for corpse pollution: indirect pollution
    through contact, special cases involving an ape, a menstruous woman, and dog carcasses,
    removal of a carcass from elevated places, penalties for bringing dead matter
    onto a person or disturbing it by touch, distinctions depending on whether a dog
    has seen the corpse, and washing requirements including ceremonial washing and
    washing with bull''s urine and water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Indirect pollution is described as cleaving to one through contact with someone
    who touched a corpse, extending through a chain of contacts up to an eleventh
    person in the passage wording.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The passage states that the indirect pollution of an ape and a menstruous
    woman remains, while the translator notes uncertainty about the reading and translation
    of the ape clause.
  category: other
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: The shepherd's dog, village-dog, and similar dogs are said to carry contamination
    to eight; when the carcass is carried down to the ground the place is described
    as clean immediately, while a death on a balcony remains polluted until brought
    down.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:4
  text: Whoever brings dead matter onto another person is described as worthy of death,
    and as thrice worthy of death when a dog has not seen the corpse.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:5
  text: Disturbing a corpse through negligence of appliances and means, and disturbing
    it by touching it, is described as a sin worthy of death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Afarg is reported as saying that there is no account of appliances and means,
