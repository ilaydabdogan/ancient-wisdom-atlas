  summary: 'The passage identifies Kyansih as the home of the Kayan race, then describes
    the nature of lakes as fountains of water corresponding to human eyes. It lists
    several named lakes and gives selected attributes: locations, oceanic source-connections,
    beneficial qualities, a lake that receives or rejects objects according to righteousness,
    and Lake Asvast whose water is needed for restoring the dead in the renovation
    of the universe. The provided excerpt ends during the beginning of the description
    of Lake Husru.'
