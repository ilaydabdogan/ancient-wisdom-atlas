canonical_text:
  quote: for ten years before Soshyans comes they remain without food, and do not
    die.
  summary: 'The passage describes an eschatological decrease of appetite: people are
    sustained first by consecrated food, then by vegetables and milk, then by water,
    and finally by no food before Soshyans arrives. It then turns to resurrection:
    after Soshyans comes, the dead are to be raised; Zaratusht asks Auharmazd how
    a dispersed body can form again; Auharmazd answers by listing acts of creation
    and arguing that resurrection is easier because existing creation can assist it.'
  language: English
  quote_policy: quoted
