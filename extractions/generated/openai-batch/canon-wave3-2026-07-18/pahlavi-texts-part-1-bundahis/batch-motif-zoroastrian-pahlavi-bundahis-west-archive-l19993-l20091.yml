canonical_text:
  quote: ''
  summary: 'The passage discusses correspondences among Yasna ritual chapters and
    then gives an initiatory rule: a fifteen-year-old Mazdayasnian candidate confesses
    failings to high-priests; ritual instruments are brought; the Gathas are chanted;
    good waters are consecrated; the renewed-birth ceremony is performed; and the
    candidate becomes a mature youth entitled to a share in prayers of initiation
    and fires. It also states that the five Gathas are made from the body of a righteous
    man.'
  language: English
  quote_policy: summarized
