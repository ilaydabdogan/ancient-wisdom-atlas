canonical_text:
  quote: ''
  summary: The passage describes Auharmazd forming illumination, stars, moon, sun,
    and the celestial sphere; assigning the twelve constellations and twenty-eight
    astral subdivisions; and arranging the constellations and stars as a protective
    army under four directional chieftains against a destroyer or adversary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Auharmazd produces illumination between sky and earth, including constellation
    stars, non-constellation stars, then the moon, and afterward the sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Auharmazd first produces the celestial sphere and assigns constellation stars
    to it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage lists twelve named constellations: Varak, Tora, Do-patkar, Kalahang,
    Sher, Khurak, Tarazuk, Gazdum, Nimasp, Vahik, Dul, and Mahik, with zodiacal glosses
    such as Lamb, Bull, Gemini, and Fish.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: From their original creation, the constellations are divided into twenty-eight
    subdivisions; a translator note identifies such subdivisions as the spaces traversed
    daily by the moon among the stars, generally called lunar mansions.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: All original creations residing in the world are committed to the constellations,
    so that when the destroyer arrives the constellations overcome the adversary and
    their own persecution, and the creatures are saved from adversities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The constellation order is described by a military image: every constellation
    has 6480 thousand small stars ordained as assistance, like a warlike army destined
    for battle.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Four chieftains are appointed as leaders on the four sides.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tishtar is named chieftain of the east, Sataves of the west, Vanand of the
    south, and Haptok-ring of the north.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Many unnumbered stars are assigned to various quarters and places as the united
    strength and appointed power of the constellations.
  category: action
  evidence_refs:
  - ev:4
