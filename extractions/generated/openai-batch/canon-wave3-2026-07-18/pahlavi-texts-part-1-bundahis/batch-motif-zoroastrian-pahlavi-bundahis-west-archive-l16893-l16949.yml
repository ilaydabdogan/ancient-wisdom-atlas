  quote: ''
  summary: The passage quantifies a Tanaptihar sin in relation to movement or walking,
    then instructs that at night a person should lie down wearing the shirt and girdle.
    These garments are said to protect the body and benefit the soul. Before sleep
    one should utter one Ashem-vohu; each breath is counted as a good work of three
    Srosho-yaranams, and if death occurs in that sleep the renunciation of sin is
    accomplished.
