canonical_text:
  quote: ''
  summary: 'A ritual-legal passage gives rules for menstrual impurity: which domestic
    surfaces become polluted depending on prior use, the sequence for removing ornaments
    and garments, retirement to the designated place for menstruation, inward retention
    or outward completion of a prayer formula, and the impurity caused when a menstruous
    woman sees hands prepared by ceremonial ablution or related sacred twigs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If menstruation occurs while a woman moves from cushion to carpet and into
    the bed-chamber, the carpet and bed-chamber are polluted, but the cushion is not
    polluted because it is already in use.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If cushion and carpet are both in use, the bed-chamber alone is polluted;
    if all three are in use, the passage states that there is no pollution.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the woman knows it is menstruation, she is instructed first to remove
    the necklace, then the ear-rings, then the head-fillet, and then the outer garments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If she remains in the designated place for the purpose, the passage says the
    outer garments are clean and no leather covering or leather shoes are needed;
    the note marks the reading and meaning as doubtful.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: When she is certain it is menstruation, until all garments are changed and
    she has sat in the menstruation place, a prayer is to be retained inwardly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When worship is being celebrated, a prayer is to be retained inwardly; if
    menstruation occurs, the prayer is to be spoken out by her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a call of nature arises while she retains a prayer inwardly, the passage
    says she does not need to speak out that prayer because a formula for the call
    is to be spoken by her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hands sprinkled in ceremonial ablution become unclean when seen by a menstruous
    woman, even if she looks hastily and does not see the sacred twigs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The translator’s note describes the dashtanistan as a room or cell for unclean
    persons, where they are not to see sun, moon, stars, fire, water, sacred vessels,
    or righteous men, and where prescribed distances from fire, water, sacred twigs,
    and righteous men are given.
  category: setting
  evidence_refs:
  - ev:6
