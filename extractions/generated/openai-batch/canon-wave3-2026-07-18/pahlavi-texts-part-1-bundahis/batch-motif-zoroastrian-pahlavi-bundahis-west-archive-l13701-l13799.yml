canonical_text:
  quote: ''
  summary: A religious prince named Vahram the Varjavand, also called Shahpur by some,
    is born; a falling star signals his birth. A cited authority gives a calendrical
    notice connected with his father, the child is reared among royal damsels, and
    a woman becomes ruler. At thirty the prince advances with banners, weapons, and
    diverse armies toward named eastern regions. The passage then describes Jupiter
    rising to culmination, casting Venus down, and sovereignty coming to the prince,
    followed by a large mustering of armed champions from various Iranian regions.
  language: English
  quote_policy: summarized
