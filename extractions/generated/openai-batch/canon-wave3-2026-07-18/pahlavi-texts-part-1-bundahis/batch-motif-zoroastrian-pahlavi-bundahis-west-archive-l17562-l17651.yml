  text: A person who does not engage in renunciation is described as being in hell
    until the future existence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the future body, the person is brought from hell, has his head cut off
    once for every mortal sin, is made alive again after the last time, and receives
    three nights of severe punishment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Renunciation of sin is described as having an open duty and a mental duty.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The open duty is to confess the known sin; the mental duty is to renounce
    with the thought that one will not commit sin henceforth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sin committed before renunciation is not to be overlooked or kept secret,
    and concealment is associated with further liability.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ataro-pad son of Zarathusht instructed a disciple to conform to renunciation
