    much of the required prayer as he can pronounce.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deaf, dumb, and helpless person is described as having unblemished conduct
    and proper disposition but being incapable of doing good works.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: From his birth until death, duty and good works performed in the world become
    his property as much as the property of the performers; one reported opinion relates
    this amount to Zarathust.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage distinguishes good works and sins that do not really originate
    with the helpless person from acts performed or omitted by an able person.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: After death, the person comes to an account concerning sin and good works.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If good works are greater, the person is in heaven; if sin is greater, he
    is in hell; if both are equal, he is among the ever-stationary Hamistakan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A surplus of three Srosho-Zaranams of good works over sins leads to heaven,
    while a surplus of one Tanapuhar leads to the best existence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note describes Hamistakan souls as those whose good works and sins are equal;
    they remain there until the future existence and suffer only cold or heat from
