  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: A note describes four upward grades of heaven associated with good thoughts,
    good words, good deeds, and Garotman where Ahuramazd dwells, and four downward
    grades of hell associated with evil thoughts, evil words, evil deeds, and the
    darkest hell where the evil spirit dwells.
  category: setting
