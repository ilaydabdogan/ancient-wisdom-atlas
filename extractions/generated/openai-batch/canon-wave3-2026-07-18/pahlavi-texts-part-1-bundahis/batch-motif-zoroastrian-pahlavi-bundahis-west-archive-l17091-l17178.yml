canonical_text:
  quote: ''
  summary: 'The passage states that a person with severely limited speech must recite
    only what he is able. It then discusses a deaf, dumb, and helpless person who
    cannot perform good works: good works performed in the world are credited to him,
    and after death his account of good works and sins determines heaven, hell, or
    the intermediate Hamistakan. Notes connect the Hamistakan and graded heavens and
    hells with other Zoroastrian texts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
