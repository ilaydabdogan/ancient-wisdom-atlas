canonical_text:
  quote: ''
  summary: After the primeval ox and Gayomar pass away in opposite directions, Goshurvan,
    the spiritual representative of the ox, emerges from the ox's body and cries to
    Auharmazd about the lack of guardianship for creatures amid ruin, withered vegetation,
    and troubled water. Goshurvan asks about the promised man who would preach carefulness.
    Auharmazd replies that Goshurvan is ill because of the evil spirit and that it
    is not yet proper to produce that man.
  language: English
  quote_policy: summarized
