  summary: The supplied passage assigns metal-labelled ages or reigns to rulers and
    religious restorations. Kayan, called Vohuman son of Spend-dad, separates demons
    from men and spreads religion through the world. A brazen age is linked with Artakhshir,
    Shahpur, and Ataro-pad restoring the world and true religion; a copper age is
    linked with an Aikanian king removing heterodoxy and the destruction of Akandgar-i
    Kihsyakih; a tin age begins with King Vahram Gor in an incomplete sentence. Editorial
    notes discuss omitted or reordered metal ages, name traditions, and possible identifications
    with other Persian/Zoroastrian materials.
