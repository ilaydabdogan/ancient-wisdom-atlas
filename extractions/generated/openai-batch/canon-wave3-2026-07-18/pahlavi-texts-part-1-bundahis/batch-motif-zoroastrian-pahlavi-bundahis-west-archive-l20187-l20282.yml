canonical_text:
  quote: ''
  summary: The passage explains ritual reasons for specified Gathic stanza counts
    and repetitions. Fourteen stanzas are linked with seven archangels active for
    the spirit and seven for the world, with attainment of heaven as the home of Auharmazd,
    the archangels, and the righteous. Three repetitions and the holding up of holy-water
    are connected with the four classes and with strengthening warriors and husbandmen.
    Fifteen stanzas are said to be for destruction of fifteen fiends. Four repetitions
    are connected with five chieftainships. A later note describes the officiating
    priest sprinkling sacred twigs with sacred milk during a twice-recited stanza.
  language: English with transliterated Avestan/Pahlavi terms
  quote_policy: summarized
