canonical_text:
  quote: ''
  summary: The passage describes the restoration of human bodies from elements, the
    raising of Gayomar, Mashya, Mashyoi, and all mankind, the recognition of kin,
    a universal assembly where good and evil deeds are seen, separation of righteous
    and wicked persons, punishment in hell, happiness in heaven, and grief at the
    separation of close relations.
  language: English
  quote_policy: summarized
