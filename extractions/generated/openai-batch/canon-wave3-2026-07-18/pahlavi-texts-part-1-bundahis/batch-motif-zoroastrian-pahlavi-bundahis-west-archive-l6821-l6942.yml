canonical_text:
  quote: ''
  summary: The passage describes the origin and circulation of rivers. Two chief rivers,
    Arag and Veh, flow from northern sources associated with Alburs and the Alburn
    of Auharmazd, one westward and one eastward. Eighteen further rivers flow from
    the same source, and other waters derive from them. The rivers circulate around
    the extremities of the earth, enter the sea, and return from the wide-formed ocean
    to their sources. The spirits of Arag and Veh petition Auharmazd on each other's
    behalf, leading to equal strength and mutual assistance. A future restoration
    without rapids is linked to the destruction of the fiend. The passage then names
    principal rivers.
  language: English
  quote_policy: summarized
