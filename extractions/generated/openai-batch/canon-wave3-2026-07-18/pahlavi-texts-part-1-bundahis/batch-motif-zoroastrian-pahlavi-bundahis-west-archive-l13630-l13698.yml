canonical_text:
  quote: "“first a black token becomes manifest, and Hushe^ar son of Zaratiut is born
    on Lake Frazdan”"
  summary: Zaratusht asks Auharmazd how a numerous group can perish. Auharmazd replies
    with a sequence involving a demon of the race of Wrath appearing in the eastern
    quarter, a black token manifesting, the birth of Hushe^ar son of Zaratusht on
    Lake Frazdan, and a later conference with Auharmazd connected with the birth of
    a prince in A'inistan or among the Hindus.
  language: English
  quote_policy: quoted
