  summary: The passage gives rules about ritual worship between spouses, classifies
    five timed ceremonies as good works whose omission becomes sin at the bridge of
    judgment, lists the relevant observances, and prescribes prayers for sneezing,
    yawning, and sighing, which are attributed to hungry living in a quoted Nask dialogue.
  language: English
