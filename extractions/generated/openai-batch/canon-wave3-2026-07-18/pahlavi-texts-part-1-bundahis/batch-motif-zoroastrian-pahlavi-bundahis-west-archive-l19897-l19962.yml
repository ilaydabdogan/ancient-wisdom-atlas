    dwell more closely together in spiritual existence than in the world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a Hadokht Nask statement that a reverent woman is to be
    considered as much as a suitable woman.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Five ceremonies are described as good works when performed.
  category: action
  evidence_refs:
  - ev:4
