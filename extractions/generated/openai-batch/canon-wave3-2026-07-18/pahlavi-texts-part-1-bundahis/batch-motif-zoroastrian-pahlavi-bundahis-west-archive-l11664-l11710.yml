canonical_text:
  quote: ''
  summary: The passage describes an upward sequence of celestial stations, ranks the
    Aparsen mountain after Alburj, and recounts how after a great primordial rain
    the wind swept waters to the ocean and the earth became seven regions. The middle
    region is Khvaniras, with Pars at its center, while six regions surround it like
    a coronet; ocean, sea, forest, and a northern mountain separate the regions. The
    section is named as the third contest, concerning the earth.
  language: English
  quote_policy: summarized
