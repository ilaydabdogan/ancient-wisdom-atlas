canonical_text:
  quote: ''
  summary: 'The passage describes the nature and classification of plants: vegetation
    is altered after the destroyer''s coming; plant species arise from the primeval
    ox and from the many-seeded tree opposed to harm in the wide-formed ocean; a bird
    and Tištar distribute seeds through water and rain; the white Hom or Gokar tree
    grants immortality; and plant genera are classified by use, growth, fragrance,
    cultivation, and seasonality.'
  language: English
  quote_policy: summarized
