canonical_text:
  quote: ''
  summary: A benedictory sequence invokes named beings to grant the addressee offspring,
    martial strength, long life, peace, support from Auharmazd, domestic blessing,
    Kayan glory, help, skill, wealth, protection from demons, a throne in heaven,
    victory, and aid in good works. It closes with homage and blessings for Srit the
    teacher. Translator notes gloss uncertain terms and explain the three-hundred-year
    wish as two great cycles.
  language: English
  quote_policy: summarized
