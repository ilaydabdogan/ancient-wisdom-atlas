canonical_text:
  quote: ''
  summary: 'The passage presents rules and definitions concerning pollution: how far
    pollution extends within a place, the use of certain animals in limiting pollution,
    the pollution relation of an unborn child and mother, direct and indirect pollution
    in relation to a hedgehog, and direct pollution as bodily contact with a corpse.
    Translator notes compare the hedgehog point and technical terms with Vendidad
    and Avesta material.'
