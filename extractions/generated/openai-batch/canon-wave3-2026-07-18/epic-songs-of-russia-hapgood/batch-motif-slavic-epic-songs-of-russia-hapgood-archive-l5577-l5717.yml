canonical_text:
  quote: ''
  summary: Reports of Churilo's guards harming royal falconers and townspeople lead
    Prince Vladimir to ask who Churilo is. Bermyag describes Churilo's extraordinarily
    rich court. Vladimir travels there with his princess, nobles, heroes, and men.
    Plenko hosts them through ranked gates and splendid chambers into a celestial-decorated
    tower for a feast. Successive retinues arrive before Churilo appears as a beautiful
    and agile youth with a large guard; Vladimir fears he is a foreign ruler or threatening
    ambassador until Plenko identifies him as his son.
  language: English
  quote_policy: summarized
