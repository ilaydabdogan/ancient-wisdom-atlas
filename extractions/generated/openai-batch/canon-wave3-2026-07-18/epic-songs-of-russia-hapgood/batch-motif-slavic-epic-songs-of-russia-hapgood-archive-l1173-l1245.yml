canonical_text:
  quote: ''
  summary: 'Opening passage of the bylina of Volga Vseslavich: Volga is born in Holy
    Mother Russia to Marfa Vseslavievna and a Dragon. His birth is accompanied by
    trembling earth and fleeing animals. As an infant he speaks to his mother and
    asks for armor and weapons rather than swaddling. He later learns wisdom, cunning,
    and languages, gathers a hero bodyguard, commands hunts, and after the bodyguard
    fails to catch beasts, transforms himself into a lion and captures them. The passage
    ends with a second command in Kiev to set cords in trees to catch birds.'
  language: English
  quote_policy: summarized
