canonical_text:
  quote: ''
  summary: Young Nightingale takes treasures from iron-bound chests, including valuable
    furs, birds, damask, gold, and silver, and brings them to Prince Vladimir's white-stone
    palace. After ritual greeting, Vladimir asks his identity. Nightingale identifies
    himself as Budimir's son from the blue sea and the Isle of Kadol, gives his offerings
    to Vladimir and Princess Apraxia, and is feasted. Vladimir offers him cities or
    treasure as reward, but Nightingale asks for a small plot in the royal gardens
    to build three golden-crowned towers. Vladimir grants the request, and Nightingale
    commands his guards to change into work clothing.
  language: English
  quote_policy: summarized
