  quote: ''
  summary: Commentarial passage interpreting Vladimir and Dobrynya as divided solar
    principles; presenting Dobrynya as a warlike solar figure who combats darkness
    and winter, slays dragons, and rescues captive women; linking Dobrynya and Ilya
    through descent from Svarog/Heaven; identifying a marriage round a bush as an
    ancient heathen rite; and explaining Dobrynya’s absence from Nastasya and transformation
    into an aurochs with golden horns as seasonal obscuration of light and warmth.
  language: English
