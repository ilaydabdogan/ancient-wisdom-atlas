canonical_text:
  quote: ''
  summary: Prince Vladimir uses a bath invitation as a test of Vasily Mikulich, whom
    Beauty suspects is a woman. Vasilisa, under the name Vasily, enters and exits
    the bath before Vladimir, then asks to woo Vladimir's daughter. Beauty again warns
    that the suitor is a woman. Vladimir proposes another test, an archery match.
    His young men shoot at a distant damp oak with limited effect. Vasily/Vasilisa
    has a massive traveling bow and quiver brought by attendants, draws the bow, and
    shatters the oak with a steel arrow.
  language: English
  quote_policy: summarized
