  quote: ''
  summary: Hero Svyatogor rides out on his steed across the plain or steppe, unable
    to find anyone with whom to measure his great strength. He boasts that, if there
    were a ring in the heavens or a pillar and ring in the earth, he could pull down
    the heavens or raise and twist the earth. He then pursues an uncatchable wayfarer,
    calls him to stop, and the wayfarer casts a small pair of pouches onto the damp
    earth.
