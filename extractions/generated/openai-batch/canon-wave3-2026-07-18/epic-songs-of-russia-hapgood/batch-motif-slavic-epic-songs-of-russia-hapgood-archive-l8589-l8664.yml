canonical_text:
  quote: "“Long have I slept, and suddenly arisen.”"
  summary: Mikailo forces the Dragon of the under-world to fetch the waters of life
    and death. He tests them by reviving the Dragon’s crushed child, then revives
    Marya the White Swan. His shout reveals his underground location; Ilya directs
    others to dig him out, and Mikailo emerges with his wife. Marya’s fame brings
    forty rulers who threaten Kiev if Vladimir does not yield her.
  language: English
  quote_policy: quoted
