canonical_text:
  quote: ''
  summary: Dmitry says he has written to Koschei the Deathless and that Koschei will
    cut off Ivan's head. Ivan travels with Avdotya across the plain and camps in a
    white damask pavilion. Koschei arms himself, learns Ivan has carried off Avdotya,
    pursues them, and challenges the pavilion. Ivan wakes, washes, performs Christian
    devotions, arms himself, and duels Koschei. Ivan knocks Koschei from his horse
    and tries to kill him but has forgotten his dagger, so he calls to Avdotya for
    it. Avdotya fetches the dagger, and Koschei addresses her, offering her queenly
    status if she lives with him rather than Ivan.
  language: English
  quote_policy: summarized
