canonical_text:
  quote: ''
  summary: The passage opens with a fragmentary return from Tzargrad to Jerusalem,
    then begins the Novgorod-cycle tale of Vasily Buslaevich. Old Buslai of Novgorod
    dies after a long peaceful life, leaving a widow, wealth, and his young son Vasily.
    At seven, Vasily learns reading, writing, and church singing, but then roams the
    city and violently injures other children. Representatives complain to his mother,
    who rebukes him and notes that he lacks brothers and brave guards. Vasily responds
    by writing invitations offering food, wine, and clothing at his court, shooting
    the scrolls into Novgorod on arrows, and preparing a large cask of green wine
    and a red elm cudgel before an incomplete challenge.
  language: English
  quote_policy: summarized
