canonical_text:
  quote: "“That the dragons of the under-world may not crawl into the coffin and gnaw
    my white body.”"
  summary: Tzar Bukar and Mikailo Rover play a high-stakes game of checkers. After
    Mikailo wins, Ilya of Murom enters and tells him that Marya the White Swan, his
    young wife, lies dead in Kief. Mikailo returns, has a large oak coffin made, provisions
    himself for three months, arms himself with iron rods and pincers, and is buried
    alive beside Marya with his steed in a deep mound. After three months an underworld
    Dragon with her brood forces open the coffin and rejoices at finding both a living
    man and a dead body; the excerpt ends as Mikailo begins to seize the Dragon.
  language: English
  quote_policy: quoted
