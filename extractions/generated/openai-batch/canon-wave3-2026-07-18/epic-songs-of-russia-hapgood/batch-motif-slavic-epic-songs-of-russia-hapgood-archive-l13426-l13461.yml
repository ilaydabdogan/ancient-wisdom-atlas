  summary: The passage introduces Vasily Buslaevich as a chronicle-attested epic hero,
    possible representative of nobility or river-pirates, and posadnik. It reports
    an editorial comparison between a “black-visaged maid” and Iris based on an arched
    yoke/rainbow and handmaid service. It then introduces Merchant Sadko, noting comparisons
    of his Lake Ilmen fish adventure and later Tzar Morskoi episode to Arabian Nights,
    Jonah/Nineveh, and Arion, and says chronicles present Sadko as not purely imaginary
    and as founder of a church.
