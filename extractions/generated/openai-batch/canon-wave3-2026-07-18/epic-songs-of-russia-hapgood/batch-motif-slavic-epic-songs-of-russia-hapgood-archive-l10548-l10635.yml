canonical_text:
  quote: ''
  summary: Ilya rides out on Cloudfall, whose passage leaves smoke and springs of
    water, and surveys the plain from a mountain. He finds Alyosha Popovich, Dobrynya
    Nikitich, and other Russian heroes assembled at named landmarks with tents and
    golden tassel signals. Ilya announces his errand, but Samson Samoilovich refuses
    to defend Kiev, Vladimir, and the Princess because Vladimir has rewarded nobles
    rather than the heroes. In Kiev, as the truce nears its end, Vladimir anxiously
    waits. His young nephew Yermak Timofeevich asks for a heroic horse, very heavy
    chain mail, and a mace so that he may ride against the hostile host; Vladimir
    first calls him a braggart child, then permits him to choose a horse.
  language: English
  quote_policy: summarized
