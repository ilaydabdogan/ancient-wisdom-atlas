canonical_text:
  quote: '"I set out after vespers on Holy Saturday," Diuk made answer, "and lo! I
    was in Kief at early mass on Easter Day!"'
  summary: Vladimir welcomes Diuk to the palace and banquet hall. Diuk disparages
    the expected treatment of his horse and claims to have traveled from India to
    Kief between Holy Saturday evening and Easter morning. He calls his steed priceless.
    Vladimir's nobles dispute the claim, saying the journey normally takes months.
    During the feast Diuk remains silent, asserts that he is wealthier than Vladimir,
    and handles wine and cakes in a way the nobles call discourteous. They accuse
    him of being an impostor, fugitive serf, murderer, thief, and mocker of Vladimir.
  language: English
  quote_policy: quoted
