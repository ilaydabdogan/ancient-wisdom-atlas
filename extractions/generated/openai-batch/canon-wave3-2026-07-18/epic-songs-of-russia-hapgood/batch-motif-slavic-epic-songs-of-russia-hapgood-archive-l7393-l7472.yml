canonical_text:
  quote: ''
  summary: Dobrynya prepares for a journey with steed and weapons. His mother warns
    him not to bathe in Mother Puchai, whose streams are associated with fire, sparks,
    and smoke. Overcome by heat, he ignores the warning and bathes. Fiery sky signs
    accompany the descent of the twelve-tailed Dragon of the Cavern, who threatens
    to devour and capture him. After his page has removed his horse and weapons, Dobrynya
    uses his wide-brimmed Grecian cap filled with riverbank sand to strike the dragon
    and cut off three tails; the dragon then pleads for life.
  language: English
  quote_policy: summarized
