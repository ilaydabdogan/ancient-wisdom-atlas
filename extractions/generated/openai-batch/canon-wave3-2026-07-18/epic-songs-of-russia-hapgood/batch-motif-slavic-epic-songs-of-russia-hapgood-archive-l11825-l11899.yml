canonical_text:
  quote: ''
  summary: Vasily Buslaevich and his band sail across the Caspian to a Cossack-held
    barrier, obtain hospitality, gifts, and a young guide, then travel toward Jerusalem.
    In Jerusalem he arranges church services, prays, bathes in the Jordan, gives gold
    to church dependents, and reembarks. His guards bathe naked in the Jordan, and
    an aged crone begins to question them.
  language: English
  quote_policy: summarized
