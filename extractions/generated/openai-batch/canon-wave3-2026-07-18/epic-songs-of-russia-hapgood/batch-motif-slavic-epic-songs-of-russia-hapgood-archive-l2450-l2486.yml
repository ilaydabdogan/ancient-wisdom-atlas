  quote: ''
  summary: Dunai Ivanovich slays Tatars in the Lithuanian king's court. The king's
    servants report the armed youth's attack. The king appeals to prior hospitality
    and offers first his elder daughter, then Princess Apraxia, in connection with
    Prince Vladimir's wooing. Dunai refuses the first offer, continues killing, then
    forces his way into the tower where Apraxia is in her chamber.
