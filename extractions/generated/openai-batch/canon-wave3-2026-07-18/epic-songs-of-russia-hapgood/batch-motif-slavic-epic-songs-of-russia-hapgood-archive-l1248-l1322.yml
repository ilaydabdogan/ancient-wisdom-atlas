canonical_text:
  quote: ''
  summary: Lord Volga uses animal transformations to recover birds and fish, then
    decides to scout the Turkish land himself. As a little bird he listens at the
    Turkish Tzar's window. The Tzar and Tzaritza discuss whether Volga is alive, the
    Tzaritza reports a dream of a small bird defeating a black raven, and the Tzar
    declares his intention to invade Holy Russia, take nine cities for his sons, and
    obtain a furred cloak. The Tzaritza says he will not succeed; he strikes and throws
    her down, then repeats his threat.
  language: English
  quote_policy: summarized
literal_observations:
