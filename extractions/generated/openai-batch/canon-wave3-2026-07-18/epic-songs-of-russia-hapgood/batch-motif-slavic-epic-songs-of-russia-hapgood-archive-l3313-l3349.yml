  summary: A dangerous road is said to be blocked by Nightingale the Robber, a magic
    bird whose whistle devastates forest and riders. Ilya the Old Cossack takes the
    straight road, crossing mountains, a bog, and the river Mother Smorodina with
    his steed Cloudfall before encountering Nightingale in a nest on seven oaks; Nightingale
    emits flame and terrifying sounds, and Cloudfall falls to his knees.
