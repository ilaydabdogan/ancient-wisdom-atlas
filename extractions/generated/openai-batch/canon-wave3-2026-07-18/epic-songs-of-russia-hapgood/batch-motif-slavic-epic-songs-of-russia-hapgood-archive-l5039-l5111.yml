canonical_text:
  quote: ''
  summary: Ivan Godinovich sees three animal tracks in fresh snow near the Dniepr
    and sends companies of men to capture the beasts for Prince Vladimir. Ivan then
    rides alone to Chernigof, enters Guest Dmitry's court, asks for Dmitry's daughter
    Avdotya, and is insultingly refused. He goes to Avdotya, called the White Swan,
    who is weaving among bird and animal imagery; she greets him affectionately. Ivan
    leads her forth, and she laments that her father did not know how to give her
    in marriage without bloodshed. Dmitry offers bread and salt too late, and Ivan
    refuses the hospitality.
  language: English
  quote_policy: summarized
