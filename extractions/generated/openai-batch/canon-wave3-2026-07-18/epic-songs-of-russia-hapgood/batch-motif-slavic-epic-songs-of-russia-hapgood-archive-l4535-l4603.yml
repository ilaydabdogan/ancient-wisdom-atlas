canonical_text:
  quote: ''
  summary: A speaker rejects Churillo Plenkovich as unsuitable and instructs Dobrynya
    Nikitich to approach Ilya of Murom on behalf of Prince Vladimir, apologize for
    having seated him in the lowest place, and invite him to a feast with a better
    place. Dobrynya fears both Ilya and disobedience to Vladimir, finds Ilya drinking
    in an imperial pot-house, approaches him from behind, and gives the message. Ilya
    says the rear approach saved Dobrynya from being reduced to ashes, then demands
    that drinking places in Kief and Chernigov be opened freely for three days and
    that an honorable banquet be made, threatening Vladimir's reign if this is not
    done. Dobrynya returns, the decrees are issued, crowds gather to view Ilya, and
    Ilya comes to the palace, where Vladimir offers him a seat beside him wherever
    he chooses.
  language: English
  quote_policy: summarized
