canonical_text:
  quote: ''
  summary: Talesmen seeking Lord Diuk Stepanovich's mother repeatedly mistake richly
    dressed female servants for the honorable widow. After being shamed by these mistaken
    acts of homage, they are told by the nurse that the widow is at long mass and
    may be recognized by a procession that prepares the way with shovels, sweeping,
    orange-tawny sand, and scarlet cloth.
  language: English
  quote_policy: summarized
