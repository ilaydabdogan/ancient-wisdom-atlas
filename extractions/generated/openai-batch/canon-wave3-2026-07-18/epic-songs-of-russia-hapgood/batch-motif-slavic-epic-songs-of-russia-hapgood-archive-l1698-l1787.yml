canonical_text:
  quote: ''
  summary: Ilya of Murom is introduced as a peasant hero who has sat on the oven for
    thirty years, unable to rise. When his parents leave for haying work, three wayfarers
    identified as Christ and two apostles in disguise ask him for drink. They command
    him to rise; he walks, brings kvas, drinks after them, and receives enormous strength.
    A second shared drink reduces the strength to a level the earth can bear. The
    wayfarers state that God has blessed him, command him to defend the Christian
    faith, and say death will not come to him in battle. The passage then names Volga
    and Svyatogor as exceptions to his unmatched strength, though the final sentence
    is truncated.
  language: English
  quote_policy: summarized
