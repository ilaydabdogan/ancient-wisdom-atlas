canonical_text:
  quote: ''
  summary: Vasily's mother relents, gives him bread and weapons, and warns him to
    defend his head. Vasily gathers his youths, leaves by scarlet vessel, and asks
    mariners for the direct way to Jerusalem because he must save his soul after killing
    and stealing. The mariners warn of the route length and of Cossack raiders on
    the Caspian route, but Vasily insists on the straight way. He ascends Sorochinsky
    mountain, spurns a human skull that foretells his head will lie there, dismisses
    it as unclean, and reaches an inscribed stone warning that anyone who leaps on
    it will break his head. Vasily disbelieves and leaps across the stone with his
    guards, though they do not leap lengthwise.
  language: English
  quote_policy: summarized
