canonical_text:
  quote: ''
  summary: Sadko prepares to die or be abandoned upon the blue sea by ordering an
    oaken plank and bowls of precious goods to be placed there. Holding an icon of
    St. Mikola and his gusly, he bids farewell, descends onto the plank, falls asleep,
    and awakens at the bottom of the sea near the white-stone palace of the Tzar Morskoi.
    The sea ruler says Sadko has not paid tribute and has come as a gift, asks him
    whether gold, silver, or damascened steel is greatest in Russia, and then commands
    him to play. Sadko plays; the sea ruler, sea-maidens, and lesser sea-folk dance,
    and the sea becomes violent, destroying ships, drowning men, and engulfing possessions.
  language: English
  quote_policy: summarized
