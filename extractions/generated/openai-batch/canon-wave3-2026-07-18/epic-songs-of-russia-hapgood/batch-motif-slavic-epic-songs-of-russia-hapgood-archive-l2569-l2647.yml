canonical_text:
  quote: ''
  summary: Princess Nastasya says men from Holy Russia stole her sister. Dunai Ivanovich
    recognizes her, proposes that they go to Kiev for Christian marriage rites, and
    escorts her there. In Kiev, Nastasya meets her sister Apraxia; Nastasya is baptized,
    and two marriages are celebrated. Three years later, at a feast, Dunai boasts
    of bringing two women from Lithuanian land into marriage. Nastasya rebukes his
    boast, praises other heroes, and proposes a difficult archery test. She successfully
    shoots through a ring so that her arrow splits evenly on a dagger; Dunai then
    begins to shoot.
  language: English
  quote_policy: summarized
