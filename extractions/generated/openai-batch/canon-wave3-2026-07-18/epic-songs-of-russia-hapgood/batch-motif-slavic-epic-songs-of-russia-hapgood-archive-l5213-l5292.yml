canonical_text:
  quote: thus died Koschei the Deathless
  summary: Avd6tya helps Kosch6i overpower Ivan, then persuades him to bind Ivan to
    a damp oak rather than cut out his heart. When two dark blue doves alight on the
    oak, Kosch6i shoots at them, but Ivan counter-conjures the arrow so that it rebounds
    from the oak and kills Kosch6i. Avd6tya then threatens Ivan with a sword and demands
    a marriage oath in exchange for unbinding him.
  language: English
