canonical_text:
  quote: ''
  summary: Dobrynya asks leave to wander through Kief. Prince Vladimir discourages
    him, and the Russian heroes direct him to ask his mother. His mother permits him
    to roam but warns him not to visit Princess Marina Ignatievna, whom she calls
    a witch and killer. Dobrynya nevertheless arms himself, wanders to Marina's lane,
    shoots at a pair of doves in her window, and accidentally kills Tugarin Dragon's
    Son inside the palace. When Marina refuses to return the arrow except to the shooter
    himself, Dobrynya enters, retrieves it, and encounters Marina lying with a fiery
    dragon and two serpents. Marina asks for his love; Dobrynya refuses, citing her
    killings of heroes, and returns home.
  language: English
  quote_policy: summarized
