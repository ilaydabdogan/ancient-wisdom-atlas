canonical_text:
  quote: ''
  summary: Dunai arrives at Prince Vladimir's palace, is honored at the banquet, drinks
    large measures of wine, mead, and beer, and tells Vladimir of two Lithuanian princesses.
    He says Princess Nastasya is an adventuring rider and not suited to Vladimir,
    while Princess Apraxia sits secluded in a chamber behind many locks and guards.
    Vladimir asks which hero should go to Lithuania; another hero recommends Dunai.
    Vladimir commands Dunai to woo Apraxia, offering troops and treasure and instructing
    him to take her by force if the king refuses.
  language: English
  quote_policy: summarized
