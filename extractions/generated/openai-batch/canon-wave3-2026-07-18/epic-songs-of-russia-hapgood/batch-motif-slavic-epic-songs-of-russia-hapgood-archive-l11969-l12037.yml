canonical_text:
  quote: ''
  summary: Sadko, a poor Novgorod gisly-player who is not invited to feasts for three
    days, repeatedly goes to Lake Ilmen and plays his maple-wood harp on a blue stone.
    The lake becomes disturbed; on the third day he continues playing despite fear.
    Tzar Vodyanoi, glossed as the Water-King, emerges from the lake, thanks Sadko
    for delighting the lake feast, and instructs him to boast at a coming Novgorod
    feast that Lake Ilmen contains golden-finned fish, to wager his head against merchants'
    shops and wares, and to cast a silk net in the lake three times.
  language: English
  quote_policy: summarized
