canonical_text:
  quote: ''
  summary: After missed shots, Dunai becomes angry and threatens Nastasya with a burning
    arrow smeared with serpent fat. Nastasya pleads for forgiveness, offers other
    punishments, and asks only to bear Dunai's son, whom she describes with precious-metal
    limbs and celestial signs. Dunai kills her, confirms the son is as described,
    grieves, and kills himself with his dagger. From the place flow two rivers, the
    Don and the Dniepr/Nastasya's river; where they meet, two cypress trees grow and
    twine together. The song closes with a formula that it will continue to be sung.
  language: English
  quote_policy: summarized
