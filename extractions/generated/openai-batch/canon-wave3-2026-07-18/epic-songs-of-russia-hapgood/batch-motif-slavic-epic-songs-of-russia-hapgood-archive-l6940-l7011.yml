canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Lord Diuk leads Prince
    Vladimir into an extraordinary palace, where a crystal floor lies over water with
    fish beneath it. Vladimir’s appraisers cannot calculate the value of a saddle,
    and Vladimir acknowledges Diuk’s superiority under their agreement; Diuk refuses
    Vladimir’s service and warns him not to mistreat strangers. A new episode then
    opens: aurochs emerge from beneath a cross and a white birch, pass by Kiev, and
    see what appears to be a weeping maiden carrying and reading the Holy Gospel.
    Their mother explains that the figure is actually the city wall lamenting because
    it has foreseen disaster for Kiev: Tzar Batyg approaches with his son, son-in-law,
    learned scribe, and large hosts.'
  language: English
  quote_policy: summarized
