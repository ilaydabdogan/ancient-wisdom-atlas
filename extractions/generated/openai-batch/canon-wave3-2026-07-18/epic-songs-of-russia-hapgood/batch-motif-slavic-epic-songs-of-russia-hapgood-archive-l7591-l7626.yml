canonical_text:
  quote: ''
  summary: A mother counsels her son before a journey to the Tugy mountains, recalling
    that his father slew an accursed serpent there. She tells him not to take ordinary
    weapons, gives him a seven-silk whip and a magic kerchief, and explains how these
    will restore his strength, protect his horse, crush the Dragon's brood, subdue
    the Dragon, and enable him to sever its twelve tails.
  language: English
  quote_policy: summarized
