canonical_text:
  quote: '"I know, in sooth, how to take a wife with cunning and wisdom."'
  summary: At a feast, Tarakashko, a guest from over the sea, tells Tzar Vasily of
    the peerless Tzaritza Solomonida in Jerusalem. When Vasily questions taking a
    wife from her living husband, Tarakashko proposes a cunning plan involving three
    ornate scarlet ships, marvels, music, food, vodka, and a drink of oblivion. Vasily
    supplies these things, and Tarakashko sails toward Jerusalem. Meanwhile Solomon
    bids farewell to Solomonida, who reports troubling dreams of a melting ring and
    a white swan carried from a green garden. Solomon interprets the visions and warns
    her not to yield to manly charms.
  language: English
  quote_policy: quoted
