canonical_text:
  quote: ''
  summary: Envoys sent by Lord Diuk meet the richly adorned honorable widow Amalfya
    Timofeevna, feast at her invitation, and attempt unsuccessfully to reckon Diuk's
    horses, foot-gear, vaults, casks, trappings, and jeweled saddle. They report to
    Prince Vladimir that even selling Kief for paper and Chernigof for ink would only
    begin the reckoning. Vladimir then invites Diuk with hospitality and tax-free
    trade, but Diuk refuses, saying courtesy was not shown when he first came. Vladimir,
    Churilo Fop, princes, nobles, and scribes then go to Volhynia town in India the
    Rich and marvel at Diuk's dwelling.
  language: English
  quote_policy: summarized
