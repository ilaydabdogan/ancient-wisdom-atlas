canonical_text:
  quote: ''
  summary: The passage introduces young Lord Diuk Stepanovich arriving from distant
    lands beyond the blue sea on his steed Shaggy. His armor, horse, bow, and arrows
    are described as extraordinarily valuable. He hunts beside the Ocean-sea; his
    arrows appear fiery or radiant. After shooting three hundred and three arrows,
    he recovers three hundred but loses three priceless arrows. He explains that these
    lost arrows were made from reed-tree shafts, precious stones, and feathers of
    an eagle associated with the blue sea and the white Alatyr stone. Sailors had
    gathered three such feathers and brought them as gifts to rulers and to Diuk.
  language: English
