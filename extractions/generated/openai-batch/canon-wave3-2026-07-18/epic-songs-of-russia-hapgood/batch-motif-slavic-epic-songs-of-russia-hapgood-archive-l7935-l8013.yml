canonical_text:
  quote: ''
  summary: In a royal court episode, Ivan Merchant's Son follows the instructions
    of his shaggy brown steed. The horse damages Ivan's costly sable mantle, amazes
    the assembled nobles and merchants, and then terrifies or kills the royal horses
    with cries compared to an aurochs and a dragon. Ivan claims a large wager from
    Prince Vladimir. When Vladimir asks for the horse and Ivan yields it, the steed
    refuses food and drink in the stable and kills the other horses.
  language: English
  quote_policy: summarized
