canonical_text:
  quote: ''
  summary: Churilo Plenkovich gives lavish treasures and status-graded gifts after
    complaints have been made against him. Prince Vladimir accepts the gifts, withholds
    judgment, and brings Churilo to Kief for court service. Churilo's beauty, curls,
    and ring attract Princess Apraxia and other women; Apraxia asks that he become
    groom of the chambers and later objects to another service assigned to him.
  language: English
  quote_policy: summarized
