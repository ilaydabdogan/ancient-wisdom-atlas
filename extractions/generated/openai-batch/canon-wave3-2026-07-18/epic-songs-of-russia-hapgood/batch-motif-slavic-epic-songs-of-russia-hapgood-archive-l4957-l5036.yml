canonical_text:
  quote: ''
  summary: A speaker complains of being refused where he would take and refusing where
    others would give. Prince Vladimir directs Ivan Godinovich to write a wooing letter
    to Dmitry the rich merchant of Chernigof, signs it, and says that he himself is
    the wooer. Ivan rides rapidly to Chernigof, formally presents the letter, and
    is rejected by Dmitry, who says Avdotya is betrothed to Tzar Koschei and insults
    Ivan by offering him a dog. Ivan returns to Kief and reports the insult. Vladimir
    grieves and first tells Ivan not to take her; Ivan leaves angrily. Vladimir then
    offers Ivan three hundreds of men and instructs him to woo honorably, but to take
    the maiden by force if she is not given willingly. The youths assemble and begin
    the journey.
  language: English
  quote_policy: summarized
