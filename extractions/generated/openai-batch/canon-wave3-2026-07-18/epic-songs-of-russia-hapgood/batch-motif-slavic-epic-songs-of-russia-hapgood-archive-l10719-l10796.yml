canonical_text:
  quote: ''
  summary: Ilya of Murom attacks Tzar Kalin's host. His horse Cloudfall speaks and
    warns him about three trenches, but Ilya rejects the warning. Cloudfall carries
    him out of the first two trenches but escapes the third without him. Tatars capture
    Ilya and bring him before Tzar Kalin, who offers food, drink, clothing, marriage
    to his daughter, and vassalage. Ilya refuses, declaring loyalty to God’s temples,
    Princess Apraxia, Prince Vladimir, and Kief. A voice from heaven tells him to
    lift his hands; he then beheads Kalin and attacks the Tatars.
  language: English
  quote_policy: summarized
