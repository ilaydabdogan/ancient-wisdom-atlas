- id: obs:2
  text: Vasily cannot find his war harness, mace, or spear, so he removes an iron
    axle from a nearby cart; the axle is described as two fathoms long and forty poods
    in weight.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vasily thanks the damsel for not letting his bodyguard perish, says he must
    not delay, and departs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the Volkof bridge, Vasily tells his bodyguard that his mother, not he,
    betrayed them, and tells them to rest while he deals with the opposing men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vasily strides about on the bridge brandishing the iron axle, and men of Novgorod
    fall in heaps before him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The princes of Novgorod, with the Voivoda and the Elder, go to Avdotya Vasilievna
    and ask her to curb Vasily and have him leave a remnant of their men alive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Avdotya says she dares not intervene because she has wronged Vasily by confining
    him in a deep dungeon; she directs the princes to his godfather, the Ancient Pilgrim
    at the Sergiei monastery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Ancient Pilgrim tears down the great bell of St. Sophia, sets it on his
    head as a cap, uses the bell clapper as a staff, and the bridge bends beneath
    him as he goes toward Vasily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ancient Pilgrim addresses Vasily as his godchild and asks him to restrain
    his heroic heart and spare a remnant of the men.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Vasily answers the Pilgrim with an Easter/Peter's Day egg-greeting formula
