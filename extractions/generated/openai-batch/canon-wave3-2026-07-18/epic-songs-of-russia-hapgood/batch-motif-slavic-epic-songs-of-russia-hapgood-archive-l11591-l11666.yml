canonical_text:
  quote: ''
  summary: An unnamed damsel releases Vasily Buslaevich from a locked confinement.
    Lacking his usual weapons, he takes a heavy iron cart axle and goes to the Volkof
    bridge, where he attacks the men of Novgorod. Novgorod leaders seek intervention
    first from his mother Avdotya Vasilievna and then from his godfather, the Ancient
    Pilgrim. The Pilgrim approaches with the great bell of St. Sophia as a cap and
    its clapper as a staff, asks Vasily to spare a remnant, and is killed by Vasily,
    who then takes the clapper and continues the slaughter.
  language: English
  quote_policy: summarized
