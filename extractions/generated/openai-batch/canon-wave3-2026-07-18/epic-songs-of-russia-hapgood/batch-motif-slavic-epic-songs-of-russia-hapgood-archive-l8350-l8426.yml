canonical_text:
  quote: ''
  summary: Ilya, Mikailo, and Dobrynya swear brotherhood at an oak and agree to return
    there. Mikailo demands tribute from Podolia, forces submission, then encounters
    a golden-adorned white swan by the sea. When he aims a burning arrow at her, she
    warns him not to shoot. The swan transforms into Marya, Princess of Podolia, who
    says she is unbaptized and asks to be taken to Kiev to receive the Christian faith
    before marriage crowns and a kiss. At the oak, Ilya and Dobrynya bring gold, while
    Mikailo brings Marya and is rebuked by his brothers in arms.
  language: English
  quote_policy: summarized
