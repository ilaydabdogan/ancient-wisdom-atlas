canonical_text:
  quote: "“But to Dobrynya God gave courtesy alone”"
  summary: At a feast, a speaker reports that the Discourteous Knight has challenged
    them to single combat and is coming in raven form. The heroes are silent. Ilya
    of Murom says he has guarded a road and defensive ditch for twelve years, cannot
    abandon the barrier, and recommends Dobrynya Nikitich. Dobrynya drinks wine brought
    by Prince Vladimir, leaves unhappily, weeps to his mother, and laments that he
    was born without heroic gifts. His mother replies that she would have given him
    the qualities of famous heroes, but that God gave him courtesy alone.
