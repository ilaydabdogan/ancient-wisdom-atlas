canonical_text:
  quote: ''
  summary: Churilo attempts a leap over a flood, but his steed flounders. Diuk then
    crosses the flood safely on his steed, returns, seizes Churilo by the curls, and
    drags him to shore and to Prince Vladimir. The women of Kief and Vladimir plead
    for Churilo's life, so Diuk kicks and humiliates him rather than killing him.
    Churilo then proposes sending men to the Indian land to list Diuk's cattle and
    possessions; Alyosha Popovich is suggested as envoy, but Diuk refuses him.
  language: English
