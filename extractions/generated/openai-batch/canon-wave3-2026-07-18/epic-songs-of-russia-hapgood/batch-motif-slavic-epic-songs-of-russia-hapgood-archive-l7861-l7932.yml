canonical_text:
  quote: ''
  summary: At a feast in royal Kief, Prince Vladimir boasts of his horses and their
    extraordinary speed. Ivan the Merchant's Son challenges the prince with a wager
    staking his own head, and written contracts are made. Ivan goes to his shaggy
    brown horse, weeps before its hoof, and asks for help. The horse answers in human
    Russian speech, promises victory, and gives Ivan instructions for three days of
    feeding and handling before the race.
  language: English
  quote_policy: summarized
