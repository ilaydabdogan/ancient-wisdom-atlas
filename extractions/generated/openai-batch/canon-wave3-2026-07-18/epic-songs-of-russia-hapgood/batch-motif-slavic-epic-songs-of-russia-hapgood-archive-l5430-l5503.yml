canonical_text:
  quote: ''
  summary: Alyosha refuses to kill Dobrynya while he sleeps, instead mounts Dobrynya's
    horse and wakes him to fight. The two heroes battle for days until thunder and
    quaking earth alert Ilya of Murom, who rides to a lofty mountain, separates them,
    hears each man's grievance, and persuades them to stop fighting and swear brotherhood
    by exchanging crosses. Dobrynya becomes the elder brother and Alyosha the younger,
    and they go to Kiev.
  language: English
