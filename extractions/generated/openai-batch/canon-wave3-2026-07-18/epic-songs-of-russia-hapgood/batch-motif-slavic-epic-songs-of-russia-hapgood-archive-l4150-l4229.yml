canonical_text:
  quote: bowing low, and set out for Jerusalem.
  summary: The excerpt opens mid-action with an unnamed female figure sewing up velvet
    so something will not be noticed. The next morning, forty-one pilgrims pray, eat
    at Princess Apraxia's tables, thank her, and depart for Jerusalem. Prince Vladimir
    returns, finds his royal cup missing, and hears Apraxia accuse the recently departed
    psalm-singers. Ilya of Murom warns that they are heroes rather than ordinary psalm-singers.
    Vladimir sends Alyosha Popovich, who insults the travellers as thieves; young
    Kasyan Mikailovich confronts him with a cudgel. Alyosha returns in fear and reports
    that brigands attacked him. The Old Cossack rejects Alyosha's account and recommends
    Dobrynya Nikitich as a courteous envoy.
  language: English
  quote_policy: quoted
