canonical_text:
  quote: ''
  summary: At Prince Vladimir's palace in Kiev, a feast is held. Vladimir gives rewards
    and gives Ilya a marten cloak, which Ilya dishonors while speaking against Tzar
    Kalin. A maid reports the speech to Vladimir as if directed against Vladimir.
    Vladimir orders Ilya imprisoned in a dungeon. Ilya willingly goes, frees his horse
    Cloudfall, and descends. Princess Apraxia secretly provisions him through a deep
    passage for three years. Tzar Kalin hears of this and gathers a Golden Horde host
    to attack Kiev and take Apraxia as wife.
  language: English
  quote_policy: summarized
