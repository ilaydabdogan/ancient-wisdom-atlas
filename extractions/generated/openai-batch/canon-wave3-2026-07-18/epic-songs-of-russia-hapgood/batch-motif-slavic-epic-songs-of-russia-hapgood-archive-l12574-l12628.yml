  quote: ''
  summary: The passage begins with a carry-over note on leader-bound guards, then
    introduces the section “Volga and Mikula.” It describes Mikula as an intermediate
    figure between physical and moral power, associated with Ilya, the Thunder-god,
    a nightingale mare interpreted as a thunder-cloud, rain, agriculture, and heavenly
    ploughing. It then discusses the mythical significance of the plough, citing seasonal
    dependence, divine examples of ploughing, a Siamese plough festival, and Herodotus’s
    report of Scythian heaven-fallen implements whose possession conveyed imperial
    power.
