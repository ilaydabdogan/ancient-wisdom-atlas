canonical_text:
  quote: he knew now that this was his own Falcon
  summary: After a combat, Ilya overpowers Falcon and asks his origin. When Ilya draws
    a dagger, Falcon says he comes from the blue sea and gray stone palaces of Zlatigorka,
    does not know his father, and was told by his mother to honor Ilya if he met him.
    Ilya recognizes Falcon as his son by Zlatigorka, recalls having overcome Zlatigorka
    and given her a ring, blesses Falcon, warns him, and sends him to greet his mother.
    Falcon, distressed by the secret of his birth, returns to Zlatigorka, strikes
    her with his sword, and declares an intention to kill Ilya because he will not
    live dishonored.
  language: English
  quote_policy: quoted
