canonical_text:
  quote: ''
  summary: 'The passage first recounts Volga Vseslavich changing into animals to enter
    and disable an enemy armory and stable, returning to Kief, leading his guards
    into the Turkish land, capturing the Turkish host, and dividing prisoners. It
    then begins the song of Volga and Mikula: Prince Vladimir grants Volga three towns
    in return for tribute he has brought; Volga rides with his guard to claim the
    disobedient towns and follows the sound of a plough until he meets an extraordinary
    husbandman with a remarkable mare and richly described plough. The husbandman
    questions Volga and warns him that robbers dwell in the towns.'
  language: English
  quote_policy: summarized
