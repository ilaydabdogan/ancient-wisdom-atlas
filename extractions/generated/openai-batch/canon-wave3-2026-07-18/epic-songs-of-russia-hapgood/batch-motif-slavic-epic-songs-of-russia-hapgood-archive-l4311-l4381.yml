canonical_text:
  quote: ''
  summary: A hoary-headed old man restores the wrongfully slain Kasyan to life, identifies
    himself as Mikola of Mozhaisk sent by the Lord, and commands Kasyan to go to Jerusalem,
    kiss the Lord's grave, bathe in the Jordan, and later build a cathedral. Kasyan
    rejoins his companions alive; Prince Vladimir finds only the empty pit where Kasyan
    had been executed. After the pilgrim-heroes return from Jerusalem to Kiev, they
    accuse Princess Apraxia of having placed the royal cup in Kasyan's pouch. Kasyan
    goes to Apraxia's chamber, where she asks forgiveness, and he breathes his holy
    breath and lays his holy hand upon her before the excerpt breaks off.
  language: English
  quote_policy: summarized
