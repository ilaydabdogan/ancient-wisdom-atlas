canonical_text:
  quote: ''
  summary: Sadko boasts before Novgorod's merchants and rulers that his treasure can
    buy all goods in the city. Thomas and Luka accept a wager of thirty thousand on
    behalf of Novgorod. Sadko buys all wares on successive days, but on the third
    day goods from Moscow fill the market, and he concedes that Novgorod is richer
    than he is. He yields the wager, builds decorated red ships, loads them with Novgorod
    wares, sails by river and sea toward the Golden Horde, sells the goods for gold,
    silver, and pearls, and then leads the fleet away until the ships halt on the
    blue sea.
  language: English
  quote_policy: summarized
