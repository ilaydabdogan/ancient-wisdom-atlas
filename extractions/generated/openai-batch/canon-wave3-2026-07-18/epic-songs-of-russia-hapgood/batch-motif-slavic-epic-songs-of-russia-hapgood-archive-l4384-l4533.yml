canonical_text:
  quote: ''
  summary: 'The supplied passage closes one song with pardon, banquet, departure,
    cessation of bloodshed, and Kasyan''s church-building repentance. It then begins
    “Ilya in Disguise”: Ilya visits Kiev under a false name, is not recognized by
    Prince Vladimir, rejects a low seat at the feast, kills the heroes sent to seize
    him, strips golden spires and crosses from sacred buildings to buy wine, and is
    identified by Dobrynya as Ilya of Murom.'
  language: English
  quote_policy: summarized
