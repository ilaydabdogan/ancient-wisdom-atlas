canonical_text:
  quote: ''
  summary: An unidentified speaker promises Sadko gold-finned fish and consequent
    possession of merchants' shops. Sadko returns to Novgorod, attends a merchants'
    feast, boasts of gold-finned fish in Lake Ilmen, and wagers his head against six
    merchants' shops. A silk net is cast three times, each time catching a gold-finned
    fish. The merchants yield their shops and wares; Sadko becomes a rich merchant,
    marries, builds a white stone palace mirroring celestial lights, and hosts another
    banquet where guests boast.
  language: English
  quote_policy: summarized
