canonical_text:
  quote: ''
  summary: At Prince Vladimir's table, Ilyd says he came by the straight way. Vladimir
    doubts him and says that route has been lost for thirty years because of Tatars,
    morasses, and the Nightingale's nest on seven oaks near Smorodina. Ilyd answers
    that the Nightingale Robber is bound in Vladimir's court. The court goes out to
    see the bound Nightingale; Vladimir orders him to whistle, roar, and hiss, but
    the Nightingale says he is not Vladimir's captive and asks for wine.
  language: English
