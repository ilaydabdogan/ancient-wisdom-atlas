canonical_text:
  quote: ''
  summary: Akim asks Alyosha which way to ride, and Alyosha chooses to go to Kief
    to Prince Vladimir. They camp near the Safat river, sleep, and prepare the horses
    in the morning after Alyosha washes and prays eastward. On the road they meet
    a richly dressed wandering psalm-singer, who reports seeing Tugarin the Dragon's
    Son and describes his huge body and fiery, smoke-breathing horse. Alyosha exchanges
    clothes with the psalm-singer, dresses as a wandering Kalyeka, takes a heavy staff
    and steel dagger, and goes to the Safat river, where he finds Tugarin roaring
    so loudly that the oaks tremble. Tugarin sees the pilgrim and asks what he knows
    of Alyosha.
  language: English
  quote_policy: summarized
