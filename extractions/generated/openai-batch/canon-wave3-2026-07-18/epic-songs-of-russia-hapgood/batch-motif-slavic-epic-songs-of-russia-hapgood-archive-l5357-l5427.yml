canonical_text:
  quote: Whoso entereth this pavilion, shall not issue thence alive.
  summary: Dobrynya Nikitich encounters a speaking raven on an oak, spares it after
    its counsel, and follows its direction toward a lofty mountain where marvels are
    said to be. He finds a locked white pavilion bearing a death warning, breaks the
    lock, enters, eats and wastes food, then sleeps unaware of danger. Alyosha Popovich
    arrives, becomes angry at the waste, and prepares to attack before pausing to
    reflect.
  language: English
  quote_policy: quoted
