canonical_text:
  quote: ''
  summary: 'Danilo kills a fierce beast and then sees a Russian host coming against
    him from Kief. After cutting down the host, he sees two heroes approaching: Nikita,
    his own brother, and Dobrynya, his brother-in-arms. Lamenting that brother has
    been sent against brother, Danilo kills himself by falling on his spear. The heroes
    report his death to Prince Vladimir. Vladimir goes to Danilo''s dwelling, kisses
    Vasilisa, and orders her to put on wedding robes. Vasilisa asks to see Danilo''s
    body, instructs that her body be laid with his, and kills herself with a knife.'
  language: English
  quote_policy: summarized
