canonical_text:
  quote: ''
  summary: Svyatogor rides for three days to a great tree and smithy, where a smith
    is forging two hairs and says he is forging the fates of those who will wed. The
    smith tells Svyatogor that his bride is in a royal city by the sea and has lain
    thirty years on a dung-heap. Svyatogor resolves to kill her, goes to the city,
    finds a maiden in a hut on the dung-heap with a body like fir bark, leaves five
    hundred rubles, strikes her breast with his sword, and departs. The maiden wakes,
    the bark falls from her body, she becomes extraordinarily beautiful, and she uses
    the money to trade, gain treasure, and build ships.
  language: English
  quote_policy: summarized
