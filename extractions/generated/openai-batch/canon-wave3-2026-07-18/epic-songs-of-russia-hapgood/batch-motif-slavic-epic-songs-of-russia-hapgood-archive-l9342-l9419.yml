canonical_text:
  quote: ''
  summary: A speaker praises Vasilisa as learned and suitable for princely status.
    Prince Vladimir objects to taking a woman from a living husband and orders Putyatin
    executed. Putyatin avoids immediate execution by proposing that Danilo be sent
    on a distant, no-return service involving the Island of Buyan and several animal
    targets. Vladimir accepts the counsel, imprisons Ilya of Murom after Ilya warns
    him with falcon-and-swan imagery, and commands Danilo to go. Danilo leaves the
    banquet, returns home troubled, and Vasilisa gives him more darts than he requested,
    saying that a spare dart may be useful.
  language: English
  quote_policy: summarized
