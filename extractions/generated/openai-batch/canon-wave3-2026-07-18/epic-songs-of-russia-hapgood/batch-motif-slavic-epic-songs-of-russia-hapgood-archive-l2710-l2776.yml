canonical_text:
  quote: ''
  summary: Prince Vladimir holds a royal feast in Kief and summons nobles, heroes,
    female warriors, merchants, and strangers. Stavr Godinovich of Chernigof enters
    respectfully. As the evening advances, other guests boast of horses, strength,
    treasure, and pelts, while Stavr remains silent and does not eat or drink. Vladimir
    offers him wine and asks why he does not participate or boast. Stavr responds
    by cataloguing his estate, palace, craftsmen, clothing, mare, profitable foals,
    and continuing wealth; the supplied passage ends as he begins another boast about
    a young person.
  language: English
  quote_policy: summarized
