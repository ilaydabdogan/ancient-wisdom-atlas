canonical_text:
  quote: ''
  summary: Ilya’s horse becomes able to bear him as a heroic steed according to the
    commands of aged psalm-singers who healed him. Ilya saddles Cloudfall, receives
    his parents’ farewell blessing, and rides onto the open plain. He finds a white
    linen pavilion under a damp oak, ties Cloudfall there, lies on a large heroic
    bed, and sleeps for three days and nights. Cloudfall hears a northern clamor accompanied
    by upheaval of earth, forests, and rivers, fails to wake Ilya by stamping, then
    speaks in a human voice to warn that Svyatogor is coming to his pavilion and tells
    Ilya to loose him and climb the oak.
  language: English
