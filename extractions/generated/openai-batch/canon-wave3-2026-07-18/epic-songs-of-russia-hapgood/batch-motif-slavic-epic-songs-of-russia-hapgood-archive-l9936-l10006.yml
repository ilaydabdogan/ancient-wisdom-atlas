canonical_text:
  quote: ''
  summary: Dobrynya tells his mother that he lacks a steed and heroic trappings. She
    directs him through the stables and then to a deep vault containing a bound heroic
    steed and equipment. Dobrynya descends, addresses the steed as one that served
    his father and grandfather, releases and saddles it, arrays himself, asks his
    mother for leave to ride on a heroic quest, receives her blessing, and is farewelled
    by his mother and wife. Nastasya asks when she should expect his return; the passage
    breaks after Dobrynya begins to answer that she should wait three years.
  language: English
  quote_policy: summarized
