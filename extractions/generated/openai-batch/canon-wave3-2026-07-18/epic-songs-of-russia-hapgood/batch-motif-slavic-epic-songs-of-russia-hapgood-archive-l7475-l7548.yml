canonical_text:
  quote: ''
  summary: The Dragon promises Dobrynya submission and fictive kinship, and Dobrynya
    releases her. Afterward the Dragon flies over Kiev, abducts Beauty the Fair, niece
    of Prince Vladimir, and takes her to a cavern in the hills. Dobrynya seeks his
    mother's blessing to attend Vladimir's feast; she warns him not to go, then blesses
    him when he insists. Dobrynya arrives in fine dress, is honored at the banquet,
    and drinks a large cup. Vladimir asks the assembled heroes to go to the Tugy mountains
    against the Dragon who has taken Beauty. The heroes avoid answering, and Semyon
    reports that he had seen Dobrynya fighting the Dragon by the Puchai River and
    being deceived by her.
  language: English
  quote_policy: summarized
