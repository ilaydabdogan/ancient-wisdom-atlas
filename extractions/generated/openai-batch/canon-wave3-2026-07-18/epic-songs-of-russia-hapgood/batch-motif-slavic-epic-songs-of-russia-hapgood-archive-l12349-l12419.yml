canonical_text:
  quote: ''
  summary: Sadko plays for three hours in the sea ruler's realm. The Tzaritza warns
    that the sea Tzar's dancing causes innocent people to drown on shore, so Sadko
    breaks his harp. The sea Tzar offers him a bride from among sea maidens. Following
    the Tzaritza's instructions, Sadko rejects the first two groups of three hundred
    maidens and chooses the last of the third group, Chernava, while avoiding a kiss
    or embrace. After a feast and heavy sleep, he awakens on the bank of the Chernava
    river, sees his ships return, rejoins his people, builds churches, prays for forgiveness,
    and no longer sails on the sea.
  language: English
  quote_policy: summarized
