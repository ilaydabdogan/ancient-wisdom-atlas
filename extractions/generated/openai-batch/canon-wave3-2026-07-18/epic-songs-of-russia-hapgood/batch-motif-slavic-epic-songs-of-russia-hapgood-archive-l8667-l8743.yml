canonical_text:
  quote: ''
  summary: Prince Vladimir asks Mikailo not to destroy his kingdom and to surrender
    his wife. Mikailo refuses, disguises himself as a woman, goes to the Sorochinsky
    mountains, and deceives forty royal suitors by posing as Marya the White Swan.
    He sends them to retrieve arrows and beheads them one by one. Returning to Kief,
    he learns that Tzar Vakramoy Vakrameevich has carried off his wife to Volhynia.
    Mikailo pursues without stopping; Marya greets him there with a vessel of forgetfulness-drink
    and offers him a bowl she calls a health-giving drink.
  language: English
  quote_policy: summarized
