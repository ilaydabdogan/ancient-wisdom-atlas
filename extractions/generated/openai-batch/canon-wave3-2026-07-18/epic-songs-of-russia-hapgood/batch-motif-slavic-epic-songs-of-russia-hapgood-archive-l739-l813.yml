canonical_text:
  quote: ''
  summary: The passage describes how Russian epic songs are preserved by memory in
    a secluded region, retaining archaic words and distant Dniepr nature details while
    also adding local northern landscape and practical details. It explains the term
    polydnitza as a female heroic counterpart to male bogatyrs, notes the fixed characterization
    of named epic figures, describes variation introduced by individual singers, and
    identifies tonic versification as a key feature of the bylina tradition.
  language: English
