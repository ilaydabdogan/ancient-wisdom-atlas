canonical_text:
  quote: ''
  summary: Diuk threatens a raven, but the raven speaks and directs him onward to
    a worthy adversary. Diuk follows horse tracks to a white pavilion, uses the peaceful
    feeding of two horses as a sign that he may enter, and finds the sleeping Ilya
    of Murom. After waking Ilya, Diuk refuses a duel and humbles himself before the
    renowned hero.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Diuk addresses a raven as a bird of omen and threatens to shoot it with a
    bow and fiery arrow, scatter its feathers, spill its blood on a damp oak, and
    give it over to death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The raven speaks with human tongue, asks Diuk not to shed its blood, and tells
    him to ride onward over the open plain to find an adversary fitting his stature.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Diuk rejoices at the prospect of proving his heroic might, rides onward, and
    finds traces of a horse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The horse tracks are described as furrowing damp mother earth like a mighty
    grating.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Diuk comes to a white linen pavilion beside which stands a white heroic steed
    with fine white Turkish wheat spread before it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Diuk fears entering the pavilion and decides to place his own steed beside
    the other steed; peaceful eating will mean he may enter, while fighting will mean
    he should go away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The two steeds feed in peace side by side, after which Diuk enters the pavilion,
    crosses himself, and makes the prescribed reverence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Inside the pavilion a hero sleeps in one corner and snores loudly enough that
    the threshold rings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A heroic inscription identifies the sleeping hero as the Old Cossack of the
    Don, Ilya of Murom, son of Ivan.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Diuk tries to wake Ilya and calls him to go to Kiev, to Prince Vladimir, and
    to Easter morning matins.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After waking, Ilya asks Diuk his land, horde, and name, then asks why he has
    been woken and whether Diuk wants to fight Tatars or test valor against him in
    the open plain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Diuk weeps, humbles himself, refuses to go to the open plain against Ilya,
    says Ilya's death is not decreed in battle, and compares Ilya's uniqueness to
    the one sun and one moon.
  category: speech
  evidence_refs:
  - ev:8
