canonical_text:
  quote: ''
  summary: Dobrynya rides to the Tugy mountains and the Dragon's cavern to seek the
    Prince's niece, encounters and destroys the Dragon's brood, then fights the Dragon
    over several days. Recalling his mother's counsel and obeying a voice from heaven,
    he uses a kerchief, spear, and conjuration to endure the fight and have the earth
    absorb the Dragon's blood. He kills and dismembers the Dragon, enters the den,
    releases many Russian prisoners, and searches for the Princess in the farthest
    den before the supplied excerpt cuts off mid-sentence.
  language: English
  quote_policy: summarized
