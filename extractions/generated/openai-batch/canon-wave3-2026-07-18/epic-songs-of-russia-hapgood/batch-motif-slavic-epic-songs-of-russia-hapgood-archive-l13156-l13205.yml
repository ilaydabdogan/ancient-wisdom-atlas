canonical_text:
  quote: ''
  summary: 'Editorial commentary states that Russian poems about the return of a long-absent
    husband are comparatively complete and original. A note on Ivan Godinovich explains
    a wedding ceremony in which the bride removes the bridegroom''s boots as a sign
    of submission, and says Avdotya''s refusal caused her death in the oldest versions.
    The passage then reports a proposed connection between Ivan''s experience with
    Avdotya and a legend of Prince Vladimir and Rogneda: Rogneda refuses Vladimir,
    prepares to marry Yaropolk, is forced to wed Vladimir after he kills her father
    and Yaropolk, later attempts to kill him in his sleep, and averts his retaliation
    through their little son.'
  language: English
  quote_policy: summarized
