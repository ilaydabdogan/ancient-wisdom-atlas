canonical_text:
  quote: ''
  summary: An unnamed female addressee is told she would be better at home doing household
    work and returns home in shame. Young Nightingale Budimirovich dresses richly,
    goes in state to Prince Vladimir of Kief, and asks for Vladimir's niece Love as
    wife. Vladimir betroths Love to him, and the young couple go to God's church to
    take the golden crowns. Nightingale removes his golden-crowned towers from Love's
    garden, restores things to their former state, boards his dark-red ship with his
    mother, bodyguard, and wife, sails to his own land, and dwells there with his
    wife in joy and peace.
