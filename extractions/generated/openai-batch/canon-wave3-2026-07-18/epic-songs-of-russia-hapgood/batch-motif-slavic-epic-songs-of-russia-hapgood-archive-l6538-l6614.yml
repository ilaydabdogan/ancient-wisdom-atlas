canonical_text:
  quote: ''
  summary: A scroll found on Diuk's steed tells Diuk's mother that her son is alive
    and has boasted. She prepares three years and three days of clothing, hides it
    under a worn garment, and sends the horse to him. Diuk and Churilo compete in
    riding through Kief with changing garments and horses. On Easter at mass, Churilo
    displays ornate clothing with animated devices, while Diuk's rich clothing is
    concealed under the worn garment until he casts it aside after Vladimir says he
    has forfeited the wager.
  language: English
  quote_policy: summarized
