canonical_text:
  quote: ''
  summary: Mighty Ivaniusho sets out on a pilgrimage to Jerusalem with devotional
    acts at Jordan, a cypress tree, and the Lord's grave. Returning by Tzargrad, he
    finds the city and its sacred spaces defiled under the accursed Idol. He captures
    and questions a Tatar about the Idol, receives a description of the Idol's huge
    body, kills the Tatar, and then meets Ilya of Murom. Ilya questions him about
    Tzargrad and rebukes him for not delivering Tzar Constantine. A footnote states
    that other variants localize the Idolishe episode at Kiev with Prince Vladimir.
  language: English
  quote_policy: summarized
