canonical_text:
  quote: ''
  summary: Vasily's mother dresses in dark and martial clothing, approaches him from
    behind, and intercedes until he drops his arms. Novgorod's leaders supplicate
    him, ask that the slain be buried, and invite him as a guest. Vasily orders the
    burial, later heals his guards, returns by ship to Novgorod, and asks his mother
    for a blessing to travel with his band to Jerusalem and the Jordan. His mother
    grants blessing only for a good purpose and refuses it if he intends robbery.
  language: English
  quote_policy: summarized
