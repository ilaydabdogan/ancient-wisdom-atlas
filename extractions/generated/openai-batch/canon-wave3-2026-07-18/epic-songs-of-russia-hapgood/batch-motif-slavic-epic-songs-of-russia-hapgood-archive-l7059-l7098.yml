  summary: Vasily the Drunkard violently humiliates princes and nobles at a pot-house
    and drives them to Prince Vladimir's court. Vladimir recognizes that they have
    irritated rather than appeased him, goes personally to the pot-house, performs
    reverent gestures, and addresses Vasily. Vasily requests very large drinking cups
    associated with Ilya of Murom, Dobrynya Nikitich, and Alyosha, draining at least
    the first two.
