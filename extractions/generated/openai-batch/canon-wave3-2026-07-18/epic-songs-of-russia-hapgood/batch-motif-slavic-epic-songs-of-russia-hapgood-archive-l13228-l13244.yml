canonical_text:
  quote: ''
  summary: 'Editorial note on Churilo Plenkovich: Churilo''s name is said not to appear
    in old chronicles; old Plenkd''s epithet is explained as indicating silk trade
    on the Surdg Sea, identified with the Sea of Az6f; another explanation links the
    term to the same Sanskrit root as Svarog, described as the Slavic Saturn; Prince
    Vladimir''s numerous attendants are assigned to the Moscow epoch and contrasted
    with the Kief court; Churilo is said to have died at the hands of Bermyag, an
    enraged husband mentioned in the song.'
