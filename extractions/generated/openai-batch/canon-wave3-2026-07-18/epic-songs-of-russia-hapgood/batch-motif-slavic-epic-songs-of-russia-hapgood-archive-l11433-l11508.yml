canonical_text:
  quote: ''
  summary: Vasily Buslaevich selects three guards, hosts a feast that honors only
    his guards and not the men of Novgorod, is excluded from a retaliatory feast,
    ignores his mother's warning, enters the feast unbidden, displaces the guests
    by occupying the hall, and drunkenly wagers his head that he and his guard can
    face all Novgorod on the bridge over the Volkof.
