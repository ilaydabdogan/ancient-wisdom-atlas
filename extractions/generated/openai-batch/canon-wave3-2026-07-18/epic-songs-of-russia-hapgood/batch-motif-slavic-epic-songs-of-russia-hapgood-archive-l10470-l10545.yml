canonical_text:
  quote: ''
  summary: 'Tzar Kalin’s large host surrounds Kief. Kalin writes an ornate cartel
    and sends a runner with instructions to enter the city insolently and deliver
    demands to Prince Vladimir: prepare the city for occupation, remove crosses from
    churches, turn churches into stables, brew drink for the host, and accept Kalin’s
    wedding to Princess Apraxia. Vladimir submits and asks for a three-month truce,
    then laments that Ilya of Murom is gone and no defender remains. A princess tells
    him to check the dungeon. Vladimir doubts Ilya could have survived three years,
    but goes and finds Ilya alive, provisioned, and reading the Holy Gospel; he bows
    and asks Ilya to defend them for the sake of widows and orphans.'
  language: English
  quote_policy: summarized
