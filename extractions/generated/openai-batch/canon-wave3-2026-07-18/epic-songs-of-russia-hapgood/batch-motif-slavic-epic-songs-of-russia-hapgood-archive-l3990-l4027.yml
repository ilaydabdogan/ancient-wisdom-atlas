  summary: A group of heroes accepts a vow forbidding theft, submission to women’s
    charms, and bloodshed, with severe bodily punishments for breach. They release
    their horses, put on pilgrim clothing, take ornate pouches, caps, staves, and
    luminous stones, travel by sunlight and by the light of stones and jewels at night,
    wander from horde to horde, approach Kiev, and meet Prince Vladimir hunting birds
    on the open plain.
