canonical_text:
  quote: ''
  summary: Ilya hides in a damp oak. The giant hero Svyatogor arrives carrying a crystal
    casket, opens it with a golden key, and his heroic wife emerges. She provides
    food and drink, then later sees Ilya, commands him down, puts him in Svyatogor's
    pocket, and wakes her husband. Svyatogor puts her back in the casket and rides
    toward the Holy Mountains. His horse speaks and reveals the extra burden. Svyatogor
    questions Ilya, hears the truth, kills his wife, exchanges crosses with Ilya,
    calls him younger brother, and explains that the earth cannot bear him so he rides
    only among hills, precipices, and the Holy Mountains.
  language: English
  quote_policy: summarized
