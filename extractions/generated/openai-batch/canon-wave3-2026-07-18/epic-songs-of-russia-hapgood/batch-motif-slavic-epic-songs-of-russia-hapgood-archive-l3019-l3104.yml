canonical_text:
  quote: ''
  summary: Prince Vladimir tests the stern ambassador Vasily Mikulich with a wrestling
    challenge. Vasily kills several of Vladimir's heroes, demands Vladimir's daughter
    in marriage, and threatens violence if refused. Vladimir betroths his daughter
    and orders a wedding feast. On the third day, before the church marriage, Vasily
    is sorrowful and asks for musicians; ordinary harp-players fail to cheer him.
    Vasily asks for Stavr Godinovich, whom Vladimir reluctantly summons. Stavr plays
    a maple-wood harp with strings associated with Kief, Tzargrad, and Jerusalem,
    and Vasiliushka begins to sleep and dream.
  language: English
  quote_policy: summarized
