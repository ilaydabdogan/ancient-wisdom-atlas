  quote: '"Take paper for three years and for three days," quoth Diuk'
  summary: Diuk sends a billet fastened to an arrow to ask Old Cossack Ilya for aid.
    Ilya sends Dobrynya to learn what aid is needed. Vladimir appoints Dobrynya and
    two others to inventory Diuk's possessions; the outcome will determine whether
    Vladimir becomes Diuk's vassal or Diuk serves Vladimir. Diuk boasts that many
    scribes and much time would not suffice to record his possessions. The counters
    set out with three carts of paper, reach India the Rich, climb a lofty mountain,
    and see the land glowing before them.
