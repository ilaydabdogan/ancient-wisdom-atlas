canonical_text:
  quote: ''
  summary: A heavy gold cross is offered as surety but not accepted. Poor boon companions,
    peasants, and villagers buy green wine for an aged pilgrim, who drinks it at once
    and promises to return the favor. The next morning he breaks into cellars, moves
    large wine casks to the marketplace, and gives wine freely to the peasants. Vintners
    petition Prince Vladimir after failing to take the wine from him. The old man
    later ignores a princely summons, addresses Vladimir directly, says payment for
    the wine comes from Ilya of Murom, and departs toward the open plain, heroic barriers,
    and damp oak.
  language: English
  quote_policy: summarized
