canonical_text:
  quote: ''
  summary: Ilyd and Diuk seal brotherhood by exchanging crosses. Ilyd sends Diuk to
    royal Kief with a promise of protection and a warning not to boast. Diuk rides
    to Kief, enters the royal palace court, insults Princess Apraxia, learns Prince
    Vladimir is at Easter mass, goes to the cathedral, and is later invited by Vladimir
    to a feast. Diuk’s horse Shaggy draws public admiration and follows him; muddy
    roads and Diuk’s ornate clothing and shoes are emphasized as Vladimir asks his
    name, country, and purpose.
  language: English
  quote_policy: summarized
