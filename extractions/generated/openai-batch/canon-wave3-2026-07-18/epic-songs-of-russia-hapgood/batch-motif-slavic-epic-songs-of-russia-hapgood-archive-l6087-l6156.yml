canonical_text:
  quote: ''
  summary: 'Diuk Stepanovich equips his heroic steed with elaborate gear and jewels.
    The horse speaks with a human voice, advises him how to ride, and promises to
    leap over mountains, lakes, and rivers. Diuk prepares for a journey, receives
    his mother''s warning not to boast when he reaches Kief and Prince Vladimir, then
    departs at great speed. The horse carries him safely through three barriers: clashing
    rocks, birds of prey, and a mountain dragon. He then reaches a damp ring-barked
    oak where a black raven sits cawing and begins to speak.'
  language: English
  quote_policy: summarized
