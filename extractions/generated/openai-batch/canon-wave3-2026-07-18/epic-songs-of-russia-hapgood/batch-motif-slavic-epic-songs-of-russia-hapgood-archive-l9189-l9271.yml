canonical_text:
  quote: ''
  summary: Nightingale orders his youths to cut trees in Love the Fair's garden and
    build three golden-crowned towers overnight. By midnight the palace is complete
    and adorned with heavenly images. At matins Love sees the marvel, is told by her
    attendants that her fate has come, and goes through the towers. She hears Nightingale's
    guard counting treasure, Ulyana Vasilievna praying for her son, and Nightingale
    singing to his harp. Love listens all day, then bows to Nightingale and asks him
    to take her as wife; he replies that she pleases him except that she has wooed
    a husband for herself.
  language: English
  quote_policy: summarized
