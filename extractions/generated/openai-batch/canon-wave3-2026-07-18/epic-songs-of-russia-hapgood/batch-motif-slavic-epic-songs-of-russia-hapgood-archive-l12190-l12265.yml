  quote: ''
  summary: Sadk6's ships are unable to move on the sea. After soundings find no obstacle,
    Sadk6 says they have paid no tribute to the Tzar Morsk6i and orders offerings
    of gold, silver, and pearls to be cast into the sea. The ships still do not move.
    Sadk6 concludes that the sea ruler demands a living man; repeated lots identify
    Sadk6 himself. He then asks for writing materials and begins distributing his
    possessions to churches, the poor, and his wife.
