canonical_text:
  quote: ''
  summary: A speaker asks young Nastdsya to spare his life and promises a great oath
    and the golden crown with her. After the oath, Dobrynya and Nastdsya go to Kief,
    meet Dobrynya's mother, and then enter Prince Vladimir's banquet-hall. Dobrynya
    identifies Nastdsya as his enemy and as the woman with whom he will take the golden
    crown. At Vladimir's court she is received into the Christian faith, the pair
    take golden crowns, Vladimir gives a three-day feast, and they live happily for
    a time.
  language: English
