canonical_text:
  quote: ''
  summary: 'The passage presents a literary-historical account of Russian epic traditions:
    nature phenomena are described as becoming gods, divine attributes as descendants,
    and older worship figures as localized and later transformed under Christianity.
    Vladimir''s 988 conversion of Russia, mass baptism, destruction of idols, and
    the syncretic identification of Perun with Elijah/Ilya are used to explain the
    ''two-faithed'' character of Russian tradition. The passage then contrasts the
    Kief, Novgorod, and Moscow/Imperial epic cycles, naming Sadko and Vasily Buslaevich
    as Novgorod representatives and noting historical memory and residual supernatural
    feats in later songs.'
  language: English
  quote_policy: summarized
