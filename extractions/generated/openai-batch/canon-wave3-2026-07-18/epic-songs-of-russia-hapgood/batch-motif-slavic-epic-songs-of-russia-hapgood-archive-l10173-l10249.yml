canonical_text:
  quote: ''
  summary: A bold youth rides to Kief, enters over the walls, breaks into the honorable
    widow Afimya Alexandrevna's dwelling, and is rebuked. The widow says her son Dobrynya
    has been gone for twelve years. The youth first speaks as if he recently parted
    from Dobrynya and asks after Dobrynya's wife Nastasya, then identifies himself
    as Dobrynya. The widow does not recognize him because his appearance is changed
    and worn. After he shows the birthmark on his right breast, she recognizes and
    embraces him. He asks where his young wife is.
  language: English
  quote_policy: summarized
