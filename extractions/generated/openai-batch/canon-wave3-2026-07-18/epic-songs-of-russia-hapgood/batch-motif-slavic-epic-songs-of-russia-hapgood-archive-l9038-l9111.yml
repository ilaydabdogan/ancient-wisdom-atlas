  summary: A richly adorned leading ship carries Nightingale Budimirovich, his mother
    Ulyana Vasilievna, and a bodyguard of three hundred youths. Nightingale plays
    the gusly for his mother, commands his men to sound the sea and avoid reefs, then
    orders them to look toward Kiev; they report that Kiev is nearby, and he directs
    the ship into harbor.
