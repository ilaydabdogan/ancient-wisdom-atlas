canonical_text:
  quote: ''
  summary: Ilya of Murom reaches an obstructed way, breaks open dungeon doors, and
    releases imprisoned rulers and heroes. He sends the freed rulers home, violently
    executes the fair Princess, redistributes her wealth, and burns her stone palace.
    He rewrites an inscription on a white stone, then follows the way where wealth
    is to be won, finds an inscribed treasure vault, and uses the treasure site to
    build a monastery and cathedral with church singing and bells. He returns to Kiev
    and recounts the Adventure of the Three Ways to Prince Vladimir.
  language: English
  quote_policy: summarized
