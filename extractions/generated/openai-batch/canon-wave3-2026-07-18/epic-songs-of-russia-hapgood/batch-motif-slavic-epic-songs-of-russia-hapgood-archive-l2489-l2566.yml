canonical_text:
  quote: ''
  summary: Dunai asks Princess Apraxia whether she will wed Prince Vladimir, and she
    says she has prayed for that marriage. Dunai escorts her from the king's court
    with a rich dowry. During the journey across the open plain, the party camps at
    night with horses and weapons arranged around them. A Tatar pursues; Dunai sends
    Dobrynya ahead with Apraxia and remains to fight. The Tatar's roaring and whistling
    have destructive effects on the landscape and unhorse Dunai. Dunai defeats the
    adversary and is about to stab the foe, but discovers the opponent is a woman
    who asks whether he knows her.
  language: English
  quote_policy: summarized
