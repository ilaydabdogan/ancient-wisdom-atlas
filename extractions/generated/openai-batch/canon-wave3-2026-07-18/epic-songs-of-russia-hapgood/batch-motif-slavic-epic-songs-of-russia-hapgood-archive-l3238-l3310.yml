canonical_text:
  quote: ''
  summary: Ilya appeals to his horse Cloudfall, uproots oaks as weapons, and with
    the steed destroys the Tatar force besieging Chernigof. He enters the city, where
    the inhabitants are preparing for death in church, reveals that the enemy has
    been defeated, refuses offers of rulership and treasure, and asks for the straight
    road to Kief. The people warn that the direct road has dangerous barriers, including
    mountains and the Smorodina river.
  language: English
  quote_policy: summarized
