canonical_text:
  quote: ''
  summary: Dunai boasts of his wanderings, favor, rewards, and Nastasya’s affection.
    The King orders him seized and beheaded. On the way to execution, Dunai asks to
    be taken past Nastasya’s dwelling and calls to her. Nastasya wakes, runs out,
    offers the headsmen treasure, and tells them to release Dunai and bring the King
    the head of a drunken Tatar instead. The headsmen comply. Dunai reaches Kiev,
    enters a royal pot-house, and drinks away his possessions. The passage then shifts
    to Prince Vladimir’s feast, where guests eat, drink, and begin boasting.
  language: English
