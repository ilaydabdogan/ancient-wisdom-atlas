canonical_text:
  quote: ''
  summary: A company of pilgrims led by young Kasyan Mikailovich reaches Kief, cries
    for alms, and is received by Princess Apraxia. Their cry shakes buildings, trees,
    earth, and cellar liquors. The pilgrims enter with Christian ritual gestures and
    are feasted. Kasyan is honored and described as shining like the red sun. At night
    Apraxia privately declares love for him; he cites his vow and rejects her repeated
    advances. After he sleeps, she opens his velvet pouch and places a silver bratina
    in it.
  language: English
  quote_policy: summarized
