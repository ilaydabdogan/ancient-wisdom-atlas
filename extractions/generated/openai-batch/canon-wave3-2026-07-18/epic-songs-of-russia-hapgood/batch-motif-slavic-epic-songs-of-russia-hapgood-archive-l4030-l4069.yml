  summary: A group of wandering pilgrims or psalm-singers encounter Prince Vladimir.
    They demand a large alms, and Vladimir asks them to sing the spiritual song or
    psalm of Elena. The singers set their staves in the earth, hang their pouches,
    form a circle, and sing. The earth, lake, forests, mountains, and oaks respond
    violently, and Vladimir asks them to stop. The singers prepare to continue their
    journey, and Vladimir directs them to Kiev and Princess Apraxia for hospitality
    because he has no provisions or treasure with him.
