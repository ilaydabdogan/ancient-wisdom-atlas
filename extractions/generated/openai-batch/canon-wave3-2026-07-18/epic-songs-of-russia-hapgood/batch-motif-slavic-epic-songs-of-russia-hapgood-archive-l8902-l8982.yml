canonical_text:
  quote: ''
  summary: Anna sees the captive Russian hero Mikailo, falls in love, and offers to
    save him if he takes her as wife. Mikailo swears that, if saved, he will kill
    Marya the White Swan and take the golden crown with Anna. Anna replaces him in
    the dungeon with a similar-looking Tatar, hides him under her sable cloak, deceives
    Tzar Vakramoy, and later heals Mikailo with herbs for three months. Through a
    feigned illness and dream-ruse she helps obtain heroic armor and a steed. Mikailo
    disguises himself in woman's garb, arms himself, leaps the city wall, and comes
    to the palace. Marya recognizes him as alive again and arranges a wine cup mixed
    with sleep-herb; as he is about to comply, Anna begins to warn him from a lattice
    window.
  language: English
  quote_policy: summarized
