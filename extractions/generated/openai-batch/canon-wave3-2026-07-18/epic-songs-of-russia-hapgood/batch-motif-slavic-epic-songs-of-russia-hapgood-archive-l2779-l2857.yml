canonical_text:
  quote: ''
  summary: 'At Prince Vladimir''s feast, Stavr''s wife Vasilisa is praised as capable
    of deceiving Kiev''s princes and nobles. Vladimir has Stavr fettered and put in
    a deep locked dungeon. Stavr''s serving-man brings the news to Vasilisa in Chernigov.
    Vasilisa dismisses her banquet guests, meditates on how to free her husband, decides
    that wealth and heroic strength will not suffice, and prepares a deceptive embassy:
    she writes a letter claiming to be an ambassador seeking Vladimir''s daughter,
    cuts her hair, puts on ambassadorial male dress, mounts a heroic steed, and rides
    with forty youths. On the road she meets a messenger from Kiev, who takes her
    for a bold young man.'
  language: English
  quote_policy: summarized
