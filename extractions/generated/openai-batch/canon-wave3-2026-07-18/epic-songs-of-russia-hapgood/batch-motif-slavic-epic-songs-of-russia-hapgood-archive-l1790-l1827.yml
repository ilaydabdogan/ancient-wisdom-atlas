canonical_text:
  quote: ''
  summary: The passage continues a warning to Ilya not to contend against named powers
    or figures and directs him to royal Kief. The men who spoke vanish. Ilya then
    performs an extraordinary feat of woodcutting for his father’s household, fixes
    axes in a stump so that no one can draw them, and later removes them himself.
    He then goes out over the plain, buys a shaggy brown foal from a peasant, and
    begins a prolonged regimen of feeding, watering, binding, and anointing the foal
    with dew.
  language: English
  quote_policy: summarized
