canonical_text:
  quote: ''
  summary: Marina uses Dobrynya's footsteps in a burning charm that causes him distress
    and desire. Dobrynya visits her and asks for love; she rejects him, declares her
    power to turn him into animals, and transforms him into an aurochs. In that form
    he roams the plain with other aurochs identified as heroic bridegrooms, destroys
    Avdotya Ivanovna's flocks and herds, and is recognized by Avdotya as her transformed
    nephew. Avdotya then changes herself into a magpie and flies to Marina.
  language: English
  quote_policy: summarized
