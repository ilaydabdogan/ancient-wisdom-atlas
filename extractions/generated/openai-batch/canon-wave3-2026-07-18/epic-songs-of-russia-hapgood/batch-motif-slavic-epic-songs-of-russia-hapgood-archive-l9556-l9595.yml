  summary: At a road choice, the Old Cossack considers paths promising wealth, a wife,
    or death, rejects wealth and marriage, and chooses the way of death. He rides
    on into a gloomy forest, where forty thousand robbers covet his horse and try
    to stop and rob him. Ilya answers that they cannot kill or rob the old man and
    lists the valuables he carries or wears.
