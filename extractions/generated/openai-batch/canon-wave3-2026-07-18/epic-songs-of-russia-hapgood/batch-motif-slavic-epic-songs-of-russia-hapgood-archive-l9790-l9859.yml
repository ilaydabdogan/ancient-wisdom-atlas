  quote: ''
  summary: The passage opens with a geographical proem describing Mother Volga rising
    and flowing into the Caspian Sea. It then begins the tale of Dobrynya at Prince
    Vladimir's feast in royal Kief, where heroes and warrior-maids are gathered. Ilya
    of Murom arrives, performs reverence, and takes an honored seat. Vladimir calls
    on the assembly to stand for the Christian faith, the royal household, and vulnerable
    people, asking whom to send to defend a barrier and fight the Discourteous Knight.
