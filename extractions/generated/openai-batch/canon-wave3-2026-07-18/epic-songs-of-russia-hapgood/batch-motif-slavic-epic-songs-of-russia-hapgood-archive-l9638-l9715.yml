canonical_text:
  quote: '"I have ridden this road, and have not been slain."'
  summary: Ilya refuses an enemy offer of comradeship and wealth, rewrites an inscription
    at the Alatyr stone, rides onward to a marvelous white-stone palace, is received
    by Princess Zenira and her damsels, feasts, avoids a false bed by placing Zenira
    upon it, and then asks palace attendants for the golden key and the way to the
    deep dungeons.
