canonical_text:
  quote: ''
  summary: A woman sails over the blue sea to a great city at the Holy Mountains and
    barters precious wares. Her beauty becomes famous, and Hero Svyatog6r comes to
    see her, loves her, woos her, and marries her. After the marriage, he sees a scar
    on her bosom and asks about it. She explains that an unknown man once came by
    sea, left five hundred gold rubles, and that when she awoke she had the scar,
    the fir-bark had fallen from her body, and before then she had lain thirty years
    on a dung-heap. Svyatog6r recognizes that no one can escape fate or the judgment
    of God.
