  quote: ''
  summary: The Old Cossack describes the value and qualities of his clothing, bridle,
    saddle, jewels, and steed Cloudfall. Robbers mock him and move to seize him. Young
    Ilya of Murom shoots a fiery projectile from his bow, striking and shattering
    an oak and ploughing up the earth; the robbers are terrified, lie senseless for
    five hours, and then entreat him.
