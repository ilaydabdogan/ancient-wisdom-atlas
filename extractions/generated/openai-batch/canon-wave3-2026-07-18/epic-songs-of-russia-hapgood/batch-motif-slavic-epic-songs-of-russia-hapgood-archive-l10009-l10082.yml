canonical_text:
  quote: ''
  summary: Dobrynya instructs Nastasya to wait for him through successive intervals
    up to twelve years and not to marry Alyosha Popovich. He departs on his steed
    with extraordinary leaps. After three years Alyosha reports Dobrynya dead and
    asks Nastasya to marry him; she rejects the report. After six years Alyosha woos
    her again, and she answers that she will keep the twelve-year oath and never wed
    him.
  language: English
  quote_policy: summarized
