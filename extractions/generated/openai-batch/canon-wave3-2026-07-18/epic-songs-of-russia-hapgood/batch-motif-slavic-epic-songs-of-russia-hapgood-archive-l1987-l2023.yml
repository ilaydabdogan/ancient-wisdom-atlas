  summary: A coffin proves too large for one figure but fits Svyatog6r. Svyatog6r
    says it was destined for him and asks Ilya to cover him, but Ilya refuses. Svyatog6r
    closes the lid himself and cannot raise it again. Ilya cannot lift the lid or
