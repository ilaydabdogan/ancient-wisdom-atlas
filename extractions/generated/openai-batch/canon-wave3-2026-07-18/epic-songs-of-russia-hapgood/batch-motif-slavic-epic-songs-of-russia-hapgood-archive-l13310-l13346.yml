canonical_text:
  quote: ''
  summary: The passage is explanatory commentary on versions of the poem of Svyet
    Mikailo Ivanovich the Rover. It describes Marya the White Swan as, in some versions,
    an underworld dragon who transforms in a coffin to kill Mikailo; Mikailo then
    dismembers and purges his bride, sprinkles her with living water, and marries
    her. The commentary interprets the swan, dragon, water, coffin, thunder, lightning,
    candles, rods, and pincers as meteorological symbols and compares Mikailo's mythic
    basis with Ilya of Murom and Dunai.
  language: English
  quote_policy: summarized
