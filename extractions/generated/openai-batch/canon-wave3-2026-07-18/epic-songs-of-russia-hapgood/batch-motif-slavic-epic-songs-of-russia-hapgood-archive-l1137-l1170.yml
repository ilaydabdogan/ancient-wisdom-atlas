  quote: ''
  summary: 'The passage gives a historical explanation for the movement, loss, replacement,
    and preservation of Russian epic songs: Kief songs are said to have been displaced;
    Southern Russian devastation and Lithuanian rule erased them from popular memory;
    Cossack communities created a new epic cycle; remnants survived in ceremonial
    songs and minstrel performance; emigrants in the North-east preserved older legends.
    The passage explicitly compares this northward movement of epic poetry to the
    migration of the Norse epos to Iceland.'
