canonical_text:
  quote: ''
  summary: A husbandman recounts a toll confrontation involving salt loads and force.
    Volga invites the husbandman to become his comrade. The husbandman unyokes his
    mare from the plough and rides with Volga, then remembers that his plough remains
    in the furrow and asks Volga to have it removed, cleaned, and hidden in a willow
    bush so robbers will not find it and peasants may use it. Volga sends men to move
    the maple-wood plough, but five mighty youths cannot draw it from the furrow;
    the supplied passage then begins to describe further attempts by ten men and the
    bodyguard.
  language: English
