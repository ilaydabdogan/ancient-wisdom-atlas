  quote: ''
  summary: The passage recounts Petr N. Rybnikof's efforts to collect Russian epic
    songs around Lake Onega, including his search for the peasant tailor known as
    “The Bottle,” his encounters with psalm-singers, difficult travel across Lake
    Onega, and a chance hearing of old Leonty Bogdanovich singing an ancient-sounding
    song and the lay of Sadko, which Rybnikof recognizes as the long-sought epic material.
  language: English
