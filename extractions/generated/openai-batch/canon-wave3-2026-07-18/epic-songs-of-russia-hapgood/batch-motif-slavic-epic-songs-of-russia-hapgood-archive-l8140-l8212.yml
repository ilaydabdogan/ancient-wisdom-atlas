canonical_text:
  quote: ''
  summary: Dobrynya falls into a swoon after his charger sinks, then returns to the
    barrier and reports to Ilya of Murom. Ilya arms himself, rides Cloudfall in pursuit
    of Falcon the Hunter, and challenges him for passing the barrier without leave.
    Ilya and Falcon fight with weapons and then hand to hand for three days without
    wounding one another. Ilya falls; Falcon stands over him with a dagger, but his
    arm becomes stiff and he cannot strike. Ilya invokes the Lord, says it is written
    on his right hand that he will not die in battle, and asks Falcon about his origin
    and parents. Falcon answers with abuse.
  language: English
  quote_policy: summarized
