canonical_text:
  quote: ''
  summary: 'The passage is an editorial/commentary section noting variants and comparative
    interpretations: Mikula is replaced by angels in a Hero Samson notice; Svyatogor''s
    boast is compared with Alexander legends; Elder Heroes give way to Younger Heroes
    in a seasonal light/darkness framework; Svyatogor is interpreted as a cloud-mountain
    bound by winter; Svyatogor''s father is compared with tricked giants; and a crystal
    casket carrying a wife is compared with an Arabian Nights incident.'
  language: English
