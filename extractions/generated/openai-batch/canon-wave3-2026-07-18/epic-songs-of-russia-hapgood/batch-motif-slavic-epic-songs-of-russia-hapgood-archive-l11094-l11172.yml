canonical_text:
  quote: ''
  summary: The excerpt opens mid-sentence with a woman being led to a cathedral where
    golden crowns are taken. Solomon returns from the open plain, finds his Tzaritza
    absent, gathers an armed force, and marches toward Tzargrad. He leaves the host
    in a grove with instructions to respond to three blasts on his aurochs horn, then
    goes alone to the palace and calls for alms as a wandering psalm-singer. Tzaritza
    Solomonida recognizes him, says what she did was against her will, and receives
    him with hospitality. When Tzar Vasily arrives, she hides Solomon in an iron-bound
    chest, sits on it, mocks his supposed foolishness, then opens it and asks Vasily
    to kill him. Solomon springs out, seizes Vasily, and objects that Tzars are not
    beheaded in his custom.
  language: English
  quote_policy: summarized
