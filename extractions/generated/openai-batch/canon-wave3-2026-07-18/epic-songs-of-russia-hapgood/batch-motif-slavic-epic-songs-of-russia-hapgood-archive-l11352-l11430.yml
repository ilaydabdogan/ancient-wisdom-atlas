canonical_text:
  quote: ''
  summary: Vasily states that anyone who can drain a heavy cup of wine at one breath
    and withstand a blow from his red elm may join his bodyguard. After his mother
    Avdotya warns him of an assembled Novgorod host in the courtyard, Vasily attacks
    the men with the red elm and kills many. Kostya New-trader passes the drinking
    and blow test; Vasily then tests his own strength on a white burning stone and
    admits Kostya. Lame Potdnyshka and Komushka the Hunchback also pass the same test
    and become members of the bodyguard.
  language: English
  quote_policy: summarized
