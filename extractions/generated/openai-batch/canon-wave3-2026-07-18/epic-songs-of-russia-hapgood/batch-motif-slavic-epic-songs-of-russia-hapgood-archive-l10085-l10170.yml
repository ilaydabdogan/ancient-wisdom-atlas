canonical_text:
  quote: ''
  summary: Alyosha returns after a period of years to seek marriage with Nastasya
    Mikulichna. She refuses, but Prince Vladimir threatens punishments and an unnamed
    group forcibly leads her to the cathedral, where she is betrothed to Alyosha and
    a feast is held. Dobrynya, away fighting for Kief and unaware of the event, hears
    from a dove and its mate that his wife has been wedded to Alyosha. He reacts violently,
    asks his steed Fly-alone to carry him home in three hours instead of three years,
    and the horse begins a swift, airborne return over waters, forests, and the sea.
  language: English
  quote_policy: summarized
