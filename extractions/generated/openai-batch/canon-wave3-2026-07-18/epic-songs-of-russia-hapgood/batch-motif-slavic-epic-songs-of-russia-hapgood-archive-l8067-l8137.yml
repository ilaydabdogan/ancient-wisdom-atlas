canonical_text:
  quote: ''
  summary: Ilya of Murom sees traces of a heroic rider and convenes the heroes in
    the white pavilion. He rejects several possible pursuers and sends Dobrynya Nikitich,
    who rides toward the Sakatar river by the blue sea and encounters Falcon the Hunter.
    Falcon appears on an extraordinary horse with fiery and celestial traits, accompanied
    by animals and a chained dragon, and boasts with a steel mace before exchanging
    challenges with Dobrynya.
  language: English
  quote_policy: summarized
