canonical_text:
  quote: ''
  summary: 'The passage closes one epic episode: Yermak returns to Kief and receives
    from Prince Vladimir the privilege of drinking beer and wine without payment;
    Ilya of Murom and Cloudfall are taken from the Tatars and turned to stone, Ilya''s
    bones becoming holy relics, and the race of Russian heroes ends. A new episode
    begins in Tzargrad, where Tzar Vasily Okulovich holds a great feast and asks the
    assembled nobles, heroes, warrior-maidens, Tatars, bodyguards, and merchants whether
    they know a suitable spouse for him, describing her desired qualities.'
