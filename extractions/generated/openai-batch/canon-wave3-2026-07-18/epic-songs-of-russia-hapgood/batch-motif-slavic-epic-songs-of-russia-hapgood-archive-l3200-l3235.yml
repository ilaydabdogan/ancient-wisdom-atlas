canonical_text:
  quote: ''
  summary: The passage describes Ilya mounting with equipment suited to heroic strength
    and riding the horse Cloudfall at extraordinary speed across plains, waters, trees,
    mountains, and hills. Cloudfall's hoof-falls produce springs and smoke. In the
    open steppe Ilya cuts down forest, raises a godly cross, and writes that Ilya
    of Murom rides to royal Kief on his first heroic quest. Near Chernigof he encounters
    a vast Tatar host with three Tzareviches, each with forty thousand men; the steam
    from the horses obscures sun and moon and prevents even hare and falcon from passing
    around the host.
  language: English
