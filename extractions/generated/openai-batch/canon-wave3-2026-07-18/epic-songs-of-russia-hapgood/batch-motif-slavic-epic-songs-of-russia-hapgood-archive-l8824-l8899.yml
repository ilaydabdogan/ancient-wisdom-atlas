canonical_text:
  quote: ''
  summary: A group traveling toward Kief reaches a stone where an aged pilgrim proposes
    a division of alms, reserving a fourth lot for whoever can lift and shatter the
    stone. Ilya and Dobrynya fail, but the aged psalm-singer lifts and casts the stone,
    commanding Mikailo the Rover to appear. Mikailo emerges as if from long sleep.
    The pilgrim instructs him to honor Saint Mikola and tells the heroes to pray to
    Mikola of Mozhaisk before vanishing. Mikailo returns to Tzar Vakramey's court,
    where White Swan Marya identifies him as her former husband, offers him wine,
    and says Tzar Vakramey imprisoned him in the white burning stone. Mikailo drinks
    and falls into stupor; Marya drags him to a dungeon and nails his hands and feet
    to the wall, then goes to buy a fifth nail for his heart. The passage ends as
    Anna the Fair begins to act with a serving-maid.
  language: English
  quote_policy: summarized
