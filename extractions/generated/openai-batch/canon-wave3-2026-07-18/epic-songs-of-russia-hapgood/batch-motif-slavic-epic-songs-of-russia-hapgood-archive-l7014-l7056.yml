  quote: '"demanded of Prince Vladimir an adversary in single combat."'
  summary: A hostile force before Kief demands single combat from Prince Vladimir
    while the chief heroes are away on errands. Vladimir orders that Vasily Ignatievich
    be summoned from the pot-house. The nobles find Vasily, describe him as a drunken,
    impoverished hero lying naked on an oven, and tell him that Tzar Batyg threatens
    to burn Kief, destroy the churches in smoke, capture the prince and princess,
    and boil the nobles in a kettle. Vasily begins to rise from the oven as the passage
    breaks off.
