canonical_text:
  quote: ''
  summary: At court, an unidentified speaker offers seating choices including the
    great place and the heroic place. Alyosha Popovich sits instead with his comrade
    on the oven-bench. Twelve mighty heroes carry in Tugarin the Dragon's Son on a
    sheet of pure gold and seat him in the great place beside Princess Apraxia. During
    the feast, Tugarin eats and drinks without honor. Alyosha denounces him to Prince
    Vladimir as an untutored fool who sits dishonorably, touches and kisses Princess
    Apraxia, and jeers at the prince. Alyosha begins an incomplete analogy about his
    father's old dog.
  language: English
