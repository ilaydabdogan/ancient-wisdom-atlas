canonical_text:
  quote: ''
  summary: Mikailo has drunk a bowl of the wine of oblivion and lies unconscious.
    Marya the White Swan tells Tzar Vakramey that the man is as dead, then drags Mikailo
    onto the open plain and turns him into a white stone. Mikailo's brothers in arms,
    longing for him, travel to Volhynia disguised as wandering psalm-singers and are
    joined by an aged man. At Vakramey's palace Marya recognizes them, directs that
    they be fed and made drunk, denies knowing where Mikailo is, and then sends twelve
    knights to kill them. The aged pilgrim, who did not eat or drink, slays the knights
    with his staff. Tzar Vakramey fears the strength of the one pilgrim and goes to
    his vaults for treasure.
  language: English
  quote_policy: summarized
