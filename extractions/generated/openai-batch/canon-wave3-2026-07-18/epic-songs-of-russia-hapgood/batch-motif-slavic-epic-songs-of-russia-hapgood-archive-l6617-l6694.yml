canonical_text:
  quote: ''
  summary: In Kief, Lord Diuk's ornate appearance displays a red sun, moon, flame,
    animated bird-clasps, and beast-like loops, terrifying the crowd and causing Vladimir
    to acknowledge Diuk's victory over Churilo. Diuk recalls the creatures and shares
    wine bought with the wager money. Churilo then proposes a deadly wager over whose
    horse can leap the three-verst-wide Dniepr. Diuk accepts, laments to his horse
    Shaggy, and Shaggy answers in human speech, promising to leap the river and fly
    beyond it. Diuk and Churilo ride to the Dniepr with spectators, and each disputes
    who should leap first.
  language: English
  quote_policy: summarized
