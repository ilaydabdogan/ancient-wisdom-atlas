canonical_text:
  quote: ''
  summary: Ilya orders that the wounded Nightingale be given drink and food. Vladimir
    brings wine, liquor, and mead, which the Nightingale drains. The Old Cossack commands
    the Magic Bird to whistle, roar, and hiss quietly, but the Nightingale maliciously
    uses full strength, causing destruction in Kief, panic among people and animals,
    and death among listeners. Ilya shields Prince Vladimir and the Princess, then
    condemns the Nightingale. Vladimir asks that a remnant of his people be spared.
    The Nightingale begs forgiveness and offers to build a monastery with ill-gotten
    gold, but Ilya rejects the offer.
  language: English
  quote_policy: summarized
