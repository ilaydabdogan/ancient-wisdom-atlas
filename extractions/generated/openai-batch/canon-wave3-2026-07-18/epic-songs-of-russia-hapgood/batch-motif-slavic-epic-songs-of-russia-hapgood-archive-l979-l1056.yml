canonical_text:
  quote: ''
  summary: The passage describes the Moscow cycle of Russian epic songs as beginning
    with Ivan the Terrible and ending with Peter the Great, while noting gaps and
    later decline in epic composition. It states that fantastic adventures in the
    songs retain historical foundations, that epic figures may conflate multiple historical
    persons, and that Ivan is credited with deeds of Ivan III and others. It notes
    early written collections of national songs, says epic songs about Peter and Poltava
    incorporated details from older myths of Dobrynya the Dragon Slayer and Ilya of
    Murom, and reports a contested theory that the Vladimir and Novgorod cycles came
    from Turko-Mongolian sources based on their geographic distribution.
  language: English
  quote_policy: summarized
