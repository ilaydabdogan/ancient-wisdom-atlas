canonical_text:
  quote: ''
  summary: 'The passage describes the Alatyr/Aldtyr stone as a source from beneath
    which rivers and healing proceed. Its sea-location changes by locality: the White
    Sea for the Archangel region, the Black or Caspian Sea for southern tellers, and
    an inland boundary stone at cross-roads for inland settings. With the spread of
    Christianity and religious songs, the stone is given Christian meanings: it is
    identified with the stone of Christ''s crucifixion, with Christ''s blood reaching
    Adam and all born on earth, with a Jerusalem-linked source of healing, spiritual
    gifts, and new life, and with the place from which Christ preached, sent disciples,
    and distributed books to the world.'
  language: English
  quote_policy: summarized
