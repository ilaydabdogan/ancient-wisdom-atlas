canonical_text:
  quote: ''
  summary: Princess Marina has transformed Dobrynya Nikitich into a golden-horned
    aurochs. After an unnamed woman rebukes Marina and threatens counter-transformations,
    Marina becomes a swallow, goes to Dobrynya in the open plain, and offers restoration
    if he swears to marry her. Dobrynya promises, Marina restores him, and they perform
    a wedding by pacing three times around a willow bush. At Marina's palace she again
    transforms him, first into an ermine and then into a falcon, before restoring
    him. Dobrynya's servant gives him a sword instead of wine, and Dobrynya beheads
    Marina. The next morning princes and nobles greet him with his bride, and he replies
    that he was wedded last night but is now single.
  language: English
  quote_policy: summarized
