canonical_text:
  quote: ''
  summary: After Vasily returns home sad from a feast, his mother Avdotya Vasilievna
    tries to ransom his pardon with gold, silver, and pearls, but the men of Novgorod
    refuse and threaten to behead him. Avdotya values her son above treasure, then
    makes him drink a cup of forgetfulness, locks him in a dungeon, and hides his
    horse, weapon, sword, and heroic garments. Vasily's troop fights the men of Novgorod
    by the Volkof river for days while he sleeps unaware. A black-visaged handmaiden
    sees the battle while fetching water, kills many men with her yoke, runs to the
    dungeon, reports the troop's peril, and Vasily asks her to release him for treasure.
  language: English
  quote_policy: summarized
