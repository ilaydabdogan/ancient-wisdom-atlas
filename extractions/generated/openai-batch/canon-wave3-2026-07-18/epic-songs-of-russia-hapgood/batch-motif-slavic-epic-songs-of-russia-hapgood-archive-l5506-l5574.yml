canonical_text:
  quote: ''
  summary: At Prince Vladimir's feast in royal Kiev, successive wounded groups petition
    him. A first host reports that richly equipped youths are hunting in the prince's
    forests and beating them. A second host of fishermen reports that other youths
    are taking fish from royal waters and beating them. Vladimir ignores the early
    complaints while continuing to feast. The excerpt ends as royal falconers and
    hawkers begin a similar complaint about the absence of birds and the presence
    of a thousand men.
  language: English
  quote_policy: summarized
