canonical_text:
  quote: ''
  summary: 'The passage introduces the song “Vasily the Drunkard and Tzar Batyq” and
    states that it resembles a Chronicle episode, idealized and transferred to Vladimir’s
    epoch and the siege of Kief by Batyq in 1240. It then summarizes a Chronicle account
    of Toktamysh besieging Moscow in 1381: many inhabitants turned to drunkenness,
    a few fought from the wall, and a cloth-dealer named Adam shot an arrow from the
    Frolov gate, killing a distinguished member of the horde and causing grief to
    Toktamysh and his princes.'
