canonical_text:
  quote: ''
  summary: The husbandman lifts and abandons his plough, then rides with Volga to
    several towns. Peasants assemble against them and build a treacherous bridge;
    the heroes send a host over it, and the bridge collapses into a river. Volga and
    the husbandman cross the stream, chastise the peasants, and the peasants become
    submissive and pay tribute. On the return, the husbandman's mare far outpaces
    Volga's horse. Volga asks the husbandman's name, and the husbandman identifies
    himself through future ploughing, harvesting, brewing beer, and being called Young
    Mikiila Selyaninovich, the Villager's Son.
  language: English
  quote_policy: summarized
