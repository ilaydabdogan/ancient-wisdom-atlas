  quote: ''
  summary: At a court feast, Alyosha mocks and threatens Tugarin Dragon's Son through
    animal analogies involving choking, bursting, and being flung by the tail. The
    princess, while trying to carve a white swan, cuts her hand and says she would
    rather gaze at Tugarin. Tugarin swallows the swan whole with a large loaf; after
    Alyosha's renewed insult and threat, Tugarin darkens, draws a steel dagger, and
    begins to fling it.
