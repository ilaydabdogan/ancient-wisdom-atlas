canonical_text:
  quote: ''
  summary: Alyosha confronts Tugarin, strikes him down with a staff, refuses Tugarin's
    offer of sworn brotherhood, and beheads him. Alyosha takes Tugarin's flowered
    garments, which causes Akim Ivanovich to mistake him for Tugarin and strike him
    down. Akim notices a gold cross on Alyosha's breast, realizes he nearly killed
    his own brother, and helps revive him with the pilgrim. The companions exchange
    clothing, ride to Kiev, and enter Prince Vladimir's hall, where Alyosha identifies
    himself as Alyosha Popovich of Rostov.
  language: English
  quote_policy: summarized
