canonical_text:
  quote: ''
  summary: Dobrynya returns and asks why Nastasya has not met him. His mother reports
    Alyosha's treachery and that a wedding feast is in its third day. Dobrynya dresses
    as a minstrel, takes his maple-wood gusly, gains entrance to the feast, performs
    before Prince Vladimir, and asks permission to give wine to whomever he chooses.
    He drops his marriage ring into a cup of wine and gives it to Nastasya, who drinks
    and recognizes the ring with which she had wedded him.
  language: English
  quote_policy: summarized
