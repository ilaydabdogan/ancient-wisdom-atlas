canonical_text:
  quote: ''
  summary: Dobrynya releases the chained Beauty Putyatichna, carries her on his horse,
    refuses her proposed lover-name because of social rank, and entrusts her to Alyosha
    Popovich for delivery to Vladimir in Kief. Dobrynya then follows horse tracks
    and encounters a warrior-maiden. His mace blows do not move her, though the same
    mace shatters large damp oaks; after the third blow she turns and mocks the blows
    as mere tapping.
  language: English
  quote_policy: summarized
