  summary: Ilya taunts the Robber Nightingale, uses a willow twig as a conjured dart
    in order not to stain his weapons with blood, and brings the robber down. The
    Old Cossack binds the robber to his stirrup and rides to the Nightingale's fortified
    house, which has seven pillars, an iron paling hung with heroes' heads, golden-crested
    towers, gardens, and an orchard. Magic Bu'd's children look out and see a hero
    riding with someone at his stirrup.
