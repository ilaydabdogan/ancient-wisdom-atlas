canonical_text:
  quote: ''
  summary: Mikailo returns to Kief with Mariushka the White Swan while Ilya and Dobrynya
    bring treasure. Prince Vladimir offers Mikailo wealth as a reward, but Mikailo
    asks instead for a sealed royal ukase allowing him to drink green wine without
    payment. Vladimir grants it and says young heroes are worth more than silver or
    gold. Mikailo and Mariushka agree to wed only after swearing that the surviving
    spouse will enter the grave alive with the dead spouse for three months. They
    marry in church. Later Vladimir reports that Tzar Bukar beyond the sea demands
    twelve years of tribute and threatens Kief. Mikailo tells Vladimir to say the
    tribute is being sent by him, but he goes without tribute, reaches Bukar, and
    claims the copper-coin carts broke down on the road.
  language: English
  quote_policy: summarized
