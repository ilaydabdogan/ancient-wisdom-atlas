canonical_text:
  quote: ''
  summary: Guest Tarakashko arrives by sea, petitions Tzaritza Solomonida for officials
    to record his ship wares, intoxicates the officials and then the Tzaritza with
    vodka and a drink of oblivion, has her fall asleep on an ivory couch aboard ship,
    orders the ships out to sea, explains that he is carrying her to Tzar Vasily Okulovich,
    and arrives at Tzargrad where Vasily meets her.
  language: English
  quote_policy: summarized
