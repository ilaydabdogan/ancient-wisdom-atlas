canonical_text:
  quote: ''
  summary: 'Diuk meets wandering psalm-singers on the highway and learns the journey
    between India/Volhynia and Kief is long. On Easter Eve he bows before his mother,
    Amalfya Timofeevna, and asks her blessing to ride to Kief, see Prince Vladimir
    and Princess Apraxia, and prove his prowess. His mother refuses, warning of dangers
    on the plain, hostile people in Kief, and three barriers on the road: clashing
    mountains, pecking birds, and a twelve-tailed Dragon of the Mountain. Diuk ignores
    the warning and prepares his horse Shaggy.'
  language: English
  quote_policy: summarized
literal_observations:
