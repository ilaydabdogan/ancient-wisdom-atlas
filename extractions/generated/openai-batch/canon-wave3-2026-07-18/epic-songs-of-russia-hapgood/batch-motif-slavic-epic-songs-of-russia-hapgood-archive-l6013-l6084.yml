  text: On a broad highway, Diuk meets one and thirty wandering psalm-singers and
    challenges them as possible thieves, highwaymen, prowlers, or church robbers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The psalm-singers answer that they are not robbers but pilgrims traveling
    from Kief to Volhynia town in broad India.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Diuk asks how long the way is; the pilgrims say the road from India to Kief
    takes a year on foot or three months riding, after which Diuk thanks them and
    rides back to Volhynia.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On Easter Eve, Diuk goes to vespers and bows before his mother, the widow
    Amalfya Timofeevna.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
