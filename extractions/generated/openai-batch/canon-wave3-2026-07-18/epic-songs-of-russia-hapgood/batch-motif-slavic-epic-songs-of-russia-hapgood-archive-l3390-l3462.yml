canonical_text:
  quote: ''
  summary: Elena, Nightingale's one-eyed witch daughter, identifies Ilya of Murom
    as the rider leading her father in bonds. Nightingale's nine sons threaten to
    become ravens and attack Ilya, but Nightingale orders them not to harm him. Elena
    attacks Ilya with a heavy steel beam; Ilya avoids the full blow and defeats her.
    Nightingale offers treasure for his release, but Ilya refuses because Nightingale
    might return to thieving, and takes him toward Kiev for forgiveness. In Kiev,
    Ilya secures his horse and captive, attends Easter mass, reverences Prince Vladimir,
    and is invited to the prince's feast.
  language: English
  quote_policy: summarized
