canonical_text:
  quote: ''
  summary: 'The passage concludes Svyatogor''s deathbed exchange with Ilya at the
    coffin: Ilya strikes the lid, refuses a final breath of strength that Svyatogor
    says would have killed him, receives the sword, binds the horse to the coffin,
    and departs while Svyatogor''s tears continue to flow. It then begins the tale
    of Quiet Dunai Ivanovich: Dunai wanders to Lithuania, serves the king in several
    offices, is favored by Princess Nastasya, ignores her warning not to attend a
    drunken feast, and enters a setting where boasting begins. Source notes gloss
    Dunai as a river-name and compare feast-bragging to northern ballads and a chanson
    de geste.'
  language: English
  quote_policy: summarized
