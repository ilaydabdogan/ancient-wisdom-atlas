  summary: The passage is a comparative commentary on Russian epic material around
    Ilya of Murom. It interprets storm-birds, the Smorodina river, Ilya's bridge,
    Falcon the Hunter, Idol, Ilya's quarrels with Vladimir, the uncertain disappearance
    or expected return of epic figures, and a fragmentary bylina in which heroes sail
    away in the Falcon ship.
