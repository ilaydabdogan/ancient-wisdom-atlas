  summary: Editorial and comparative notes identify Dunai, Stavr, Vasilisa, and Alyosha
    with chronicle or epic contexts. The passage discusses fantastic river geography,
    Stavr's oath and exile under Vladimir Monomachus, an explanation of Vasilisa's
    victory over Vladimir's heroes, contests at feasts, Alyosha/Alexander Popovich's
    chronicle death at Kalka, and Alyosha's resemblance to Loki as a mischief-maker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dunai is identified as the name of one of Prince Vladimir Vasilkovich's voivodes,
    mentioned in chronicles for 1281 and 1287, and described as a rover who was probably
    not Russian.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that geographical accuracy is not expected in the epic
    lays, and that Dunai and Nastasya, as rivers, have varied names and fantastic
    courses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Stavr is identified with a person from the Novgorod Chronicle of 1118; he
    is said to be not a boyar but a ruler of a hundred, and Vladimir Monomachus is
    said to have summoned Novgorod nobles to Kiev, required allegiance, and exiled
    some, including Stavr.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ryabinin explains Vasilisa's easy victory over Vladimir's heroes by saying
    that Ilya of Murom had not yet arrived in Kiev and that Vasilisa, as daughter
    of Mikula, was connected with Earth and the Elder Heroes and therefore superior
    to the Younger Heroes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that wrestling and shooting matches, and even horse-racing,
    were not uncommon at feasts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Alyosha is linked with chronicle references to Alexander Popovich; a Nikon
    Chronicle notice says Alexander Popovich, his servant Torop, Dobrynya Golden Belt
    of Ryazan, and seventy bogatyrs were slain by the Tatars at Kalka through God's
    wrath at sin.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says it is impossible to decide the relation between the epic
    Alyosha and the historical figure, but suggests the name Popovich shaped the epic
    character; it also notes tales hostile to popes and their relatives, a description
    of Alyosha as a scorner of women, and resemblance to Loki as a mischief-maker.
  category: attribute
  evidence_refs:
  - ev:7
