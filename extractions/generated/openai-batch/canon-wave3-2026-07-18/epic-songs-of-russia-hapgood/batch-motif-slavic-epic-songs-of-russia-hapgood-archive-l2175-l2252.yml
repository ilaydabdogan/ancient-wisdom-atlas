canonical_text:
  quote: ''
  summary: At Prince Vladimir's feast, after a pipe has played, Vladimir says he alone
    is unmarried and asks whether the guests know an equal princess. He describes
    the desired bride's beauty and says she should be his counselor and one to whom
    princes, heroes, and Kief may pay homage. The guests fall silent. Dobrynya Nikltich
    asks leave to speak and says he knows of such a princess by report from his cross-brother
    Dunai Ivanovich, who is at the royal pot-house and lacks means to attend the feast.
    Vladimir sends Dobrynya with treasure to ransom Dunai's raiment and bring him.
    Dobrynya pays the innkeepers and usurers; Dunai drinks a huge cup of green wine
    in one draught and departs with him through Kief. A footnote associates heroes'
    liquor vessels with rain-bearing clouds.
  language: English
  quote_policy: summarized
