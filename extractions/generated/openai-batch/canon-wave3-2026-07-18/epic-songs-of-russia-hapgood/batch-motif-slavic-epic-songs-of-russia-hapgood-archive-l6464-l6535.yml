canonical_text:
  quote: ''
  summary: A speaker describes extraordinary household abundance in liquors, garments,
    jewels, horses, and treasure vaults. Royal Vladimir, displeased, calls for Churilo
    Plenkovich. Churilo enters and exchanges remarks with Diuk Stepanovich, then challenges
    him to a long wager over apparel and horses. Diuk accepts despite claiming disadvantage,
    writes to his mother, and sends the message home on his dapple-bay horse. Amalfiya
    Timofeevna sees the empty saddle and mourns, thinking her son has died.
  language: English
  quote_policy: summarized
