canonical_text:
  quote: ''
  summary: Alyosha Popovich refuses an immediate dagger attack and wagers his own
    head on a next-day single combat with Tugarin. Tugarin flies away on paper wings.
    Alyosha prays through the night for a cloud with rain and hail; God sends it,
    wetting Tugarin's wings and bringing him down. Alyosha arms himself, faces Tugarin,
    beheads him, binds the head to his horse, and throws it into the royal courtyard
    at Kief.
  language: English
  quote_policy: summarized
