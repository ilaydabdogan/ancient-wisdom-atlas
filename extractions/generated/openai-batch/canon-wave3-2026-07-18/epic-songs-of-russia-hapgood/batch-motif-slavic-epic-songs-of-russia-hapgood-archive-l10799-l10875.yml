canonical_text:
  quote: ''
  summary: Ilya fights Tatars, summons his steed with an aurochs horn, rides to a
    lofty mountain, and sends a fiery arrow to wake his brother-in-arms Samson Samoilovich.
    Samson calls the other Russian heroes, and thirteen heroes attack the Tatar horde.
    After slaughtering the enemy, the heroes boast that they would climb a ladder
    to heaven and destroy the heavenly host. When they resume fighting, more Tatars
    rise for each one killed; the Russian heroes then attack one another until only
    Yermak Timofeevich remains alive. A note reports variant traditions in which heroes
    turn to stone in mountains and caverns, or the last bogatyr is made into a soldier.
  language: English
  quote_policy: summarized
