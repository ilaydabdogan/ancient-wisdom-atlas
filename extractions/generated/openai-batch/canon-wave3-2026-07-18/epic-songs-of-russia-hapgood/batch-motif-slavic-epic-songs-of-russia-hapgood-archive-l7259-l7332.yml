canonical_text:
  quote: ''
  summary: Ilya exchanges equipment with a pilgrim, takes a heavy staff, and goes
    to Tzargrad disguised as a wandering psalm-singer. His shout for alms shakes the
    ruler's palace and frightens Idol. After Constantine receives and feeds the pilgrim,
    Idol questions him about Russian heroes and Ilya of Murom. Ilya answers in concealed
    form, Idol boasts of his size and appetite and threatens to crush Ilya, and after
    Ilya's taunt Idol throws a poniard; Ilya dodges onto an oven. The supplied passage
    ends mid-action.
  language: English
  quote_policy: summarized
