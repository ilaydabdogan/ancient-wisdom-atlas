canonical_text:
  quote: ''
  summary: Vaslly declares that he can ride his horse and wield his heavy sword. From
    Kief's wall he shoots an arrow that kills three close associates of Tzar Batyg.
    Batyg sends messengers demanding the offender, but the culprit is not found in
    the large city. Vaslly then arms himself, offers himself to Batyg as a comrade
    in taking and destroying Kief, receives forty thousand men, leads them into the
    open plain, and kills the host to the last man before returning to Batyg.
  language: English
  quote_policy: summarized
