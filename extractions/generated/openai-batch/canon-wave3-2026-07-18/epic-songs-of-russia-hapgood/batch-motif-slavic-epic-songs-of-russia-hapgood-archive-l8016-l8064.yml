  summary: A fragment ends with a speaker dismissing Ivan Merchant's Son and his horse
    from a court after a race. The next song sets a strong barrier on the road to
    Kief, associated with Prince Vladimir, guarded by seven named heroes and lesser
    knights. The barrier is described as preventing riders, travelers, beasts, and
    birds from passing. Young Falcon the Hunter crosses it without asking leave, and
    at dawn Ilya of Murom notices traces.
