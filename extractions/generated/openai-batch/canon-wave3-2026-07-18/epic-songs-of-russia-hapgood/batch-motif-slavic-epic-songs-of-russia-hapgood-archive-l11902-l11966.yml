canonical_text:
  quote: falling, was killed upon the stone
  summary: A warning connected with bathing in the Jordan foretells the loss of Vasily
    Buslaevich. Vasily leaves the Jordan, travels across the Caspian, stops at Kuminsk,
    and continues toward Novgorod. On the Sorochinsky mountain he again encounters
    an inscribed stone, plays at leaping over it, attempts a lengthwise leap, falls,
    and is killed. His bodyguard buries him, returns to his mother Avdotya Vasilievna,
    delivers a letter, and receives gold and wine before departing.
  language: English
  quote_policy: quoted
