canonical_text:
  quote: '"I have wedded my sharp sword!"'
  summary: Avdotya attempts to strike Ivan but accidentally cuts his bonds. Ivan is
    freed, takes her on his horse, and at a ford asks her to fetch water in his boot.
    She suspects he means to kill her. He cuts off her arms, lips, and feet as three
    'lessons' connected to her contact with Koschei, then beheads her. He washes his
    sword in the Dniepr, returns to Kiev, and tells Alyosha Popovich that he has wedded
    his sword.
