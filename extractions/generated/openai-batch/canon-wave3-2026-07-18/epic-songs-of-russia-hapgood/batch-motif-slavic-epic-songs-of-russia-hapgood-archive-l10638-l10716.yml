canonical_text:
  quote: ''
  summary: Yermak equips himself, rides to the Nevida oak, rouses the sleeping Ilya,
    scouts the vast Tatar host from the oak, and then fights alone for three days
    while Ilya sleeps. After waking, Ilya sends Dobrynya to scout, summons the Russian
    heroes, orders them to restrain Yermak with grappling-hooks before he perishes,
    and finally catches Yermak himself before attacking the Tatar host.
  language: English
  quote_policy: summarized
