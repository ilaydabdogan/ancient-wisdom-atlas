- id: obs:2
  text: Yermak saddles a good horse and rides to the barrier by the Nevida oak, where
    twelve heroes are playing checkers on a gold board and Ilya is asleep on a couch
    of fishes' teeth under a sable coverlet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yermak shouts to Ilya that Kief has plenty of bread but no one to defend the
    town.
  category: speech
  evidence_refs:
  - ev:3
