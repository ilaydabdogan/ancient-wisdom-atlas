    and nights.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: During Ilya's three-day sleep, Yermak fights the Tatars alone without stopping
    to eat, drink, or rest his horse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After waking, Ilya sends Dobrynya up the oak; Dobrynya sees Yermak still galloping
    against the enemy and reports this to Ilya.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ilya calls on the Russian heroes to mount, take iron grappling-hooks, catch
