canonical_text:
  quote: ''
  summary: Dobrynya meets forty-one pilgrims, asks them to search their pouches for
    Prince Vladimir's lost golden cup, and the cup is found in Kasyan Mikailovich's
    pouch. Kasyan denies stealing it and says Princess Apraxia contrived the matter.
    The pilgrims, bound by a vow, mutilate Kasyan and bury him breast-deep before
    leaving for Jerusalem. Dobrynya returns the cup to Vladimir but does not disclose
    Apraxia's role. Apraxia becomes ill with grief. Mikola of Mozhaisk, identified
    in a note as St. Nicholas, arrives and restores Kasyan's limbs, eyes, and tongue.
  language: English
  quote_policy: summarized
