canonical_text:
  quote: No threatening ambassador is he — but a woman, by all the signs.
  summary: A messenger reports that a threatening ambassador named Vasily Mikulich
    is coming to Kief. Vladimir prepares to receive him. Vasilisa, in the ambassadorial
    role, leaps the city walls, enters the princely halls without asking leave, presents
    a letter, and demands Vladimir's daughter Beauty in marriage. Beauty tells Vladimir
    that the supposed ambassador is a woman, listing bodily and behavioral signs,
    and Vladimir proposes to test the ambassador with a steam bath.
  language: English
  quote_policy: quoted
