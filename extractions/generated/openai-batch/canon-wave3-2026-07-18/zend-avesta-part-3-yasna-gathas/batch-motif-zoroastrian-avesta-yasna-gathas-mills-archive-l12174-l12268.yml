canonical_text:
  quote: ''
  summary: The ritual speaker announces and completes the Yasna to natural and celestial
    entities, holy creatures, ritual time-lords, Fravashis, and Yazads. The speaker
    then addresses possible offenses committed by thought, word, or deed, promises
    added praise to make up ritual deficiency, and confesses identity as a Mazda-worshipper
    of Zarathustra's order and foe of the Daevas.
  language: English
  quote_policy: summarized
