canonical_text:
  quote: ''
  summary: The passage summarizes an introductory account in which an unnamed feminine
    figure’s wail is answered by Ahura and Asha through the appointment of Zarathustra,
    who accepts a redemptive commission and begins prophetic labours. It then describes
    the Gathas as containing lamentations, prayers, praises, and exhortations from
    Zarathustra and his associates. The population is characterized as agriculturists
    and herdsmen whose land and cattle were especially important, who dreaded raids
    and rapine, and who are said to have morally rejected rapine even as retaliation.
    The passage also mentions conflict with Turanians, Daeva-worshippers, and an organized
    Daeva-party seeking to overwhelm the Zarathustrians, with battle and violence
    alluded to.
  language: English
  quote_policy: summarized
