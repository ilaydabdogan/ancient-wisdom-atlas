canonical_text:
  quote: ''
  summary: The passage is a prayer and sequence of questions addressed to Ahura/Mazda.
    It asks for refuge for a struggling saint, an effective prayer for the holy Reign,
    reward, blessing, and helpers for Order; it asks when faith will become sight,
    when divine power will be discerned, and when the saving prophet or Saoshyawt
    will gain Good Mind's grace and recompense. It also asks when perfected minds
    will come to drive away polluted drunken joy connected with the Karpans and tyrants,
    and breaks off with a question about perfected Piety appearing.
  language: English
  quote_policy: summarized
