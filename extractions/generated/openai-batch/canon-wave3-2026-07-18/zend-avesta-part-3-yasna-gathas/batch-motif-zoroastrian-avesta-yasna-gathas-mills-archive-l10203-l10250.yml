canonical_text:
  quote: ''
  summary: The passage contrasts Daeva-worshippers, rapine, and opposition to Asha
    with the defender of the holy Daena. It describes a prayer for discernment, the
    search for a faithful leader to proclaim the Daena, the naming of Frashaortra,
    reliance on Ahura and Ahura's chosen rulers, and a warning that those choosing
    an evil sovereign will be excluded from the righteous afterlife company and will
    meet the wicked dead in the home of Lies.
  language: English
  quote_policy: summarized
