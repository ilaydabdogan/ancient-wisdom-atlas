canonical_text:
  quote: ''
  summary: The passage summarizes part of Yasna XXIX. Ahura reaffirms Zarathustra
    as the one who has heard inspired doctrine and is authorized to declare it. The
    Kine's Soul doubts the adequacy of this chosen guardian and expects a more kingly
    and effective helper, while the Bountiful Immortals or attending chieftains ask
    when such help will arrive. Zarathustra responds by entering his priestly and
    prophetic role, praying to Ahura for the people, asking for sovereign authority
    established in divine order, quiet, happiness, and immediate help for himself
    and his associates. He avows confidence in Ahura rather than in the Daevas.
  language: English
  quote_policy: summarized
