  summary: The passage opens Yasna X by asking Demon-gods and Goddesses to depart
    and inviting Sraosha and Blessedness to dwell in Ahura's house, sanctified by
    Haoma. The speaker praises Haoma during its ritual pressing, praises the cloud
    and rains that nourish it on mountain summits, and praises the earth as the holy
    plant's mother and the lands where Haoma grows. Haoma is described as growing
    on mountains and as a source of righteousness and ritual fountains.
