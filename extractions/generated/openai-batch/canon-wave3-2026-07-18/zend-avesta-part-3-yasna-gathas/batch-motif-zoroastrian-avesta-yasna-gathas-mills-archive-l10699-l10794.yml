canonical_text:
  quote: ''
  summary: A ritual speaker asks Ahura Mazda and invoked divine powers for saving
    grace, protection of flocks and herds, and just lands. The passage presents the
    joy-creating Kine as a protected and symbolic figure connected with peace, people,
    and livestock. The speaker promises sacrifice and praise to Ahura Mazda with Righteous
    Order, Best Mind, and Sovereign Power, and refers to a heaven-bound pathway and
    the Home-of-song where offering saints praise and see Ahura's face.
  language: English
  quote_policy: summarized
