  text: A guardian is described as saving wealth and seeking the joy-creating Kine,
    and the speaker asks how a man may see her provided with pastures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kine is described as a living symbol of peace; a note says she represents
