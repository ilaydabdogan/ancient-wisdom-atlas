canonical_text:
  quote: ''
  summary: A collective speaker worships the waters in several forms, describes them
    as female Ahuras and helpful, and seeks them for both worlds. Ahura Mazda is said
    to have given names to the beneficent waters, and the worshippers use those names
    in worship, bowing, prayer, and confession of debt. The waters are further described
    as productive, maternal, life-giving, beautiful, entitled to offerings, and able
    to reach sickness or misfortune.
