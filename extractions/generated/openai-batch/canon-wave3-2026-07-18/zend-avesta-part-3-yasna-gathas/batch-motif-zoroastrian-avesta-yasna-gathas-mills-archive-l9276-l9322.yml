  summary: A dialogic strophe asks whom Zarathustra has as a holy friend for the great
    cause. The answer names Kavi VLstaspa as heroic, says others in Ahura Mazda's
    assembly will be called with Good Mind's words, addresses the Hae/£a/-aspas and
    Spitamas as discerners of unlawful and lawful things who establish Righteous Order
    through primeval laws, and begins an address to Frashao.stra Hvogva.
