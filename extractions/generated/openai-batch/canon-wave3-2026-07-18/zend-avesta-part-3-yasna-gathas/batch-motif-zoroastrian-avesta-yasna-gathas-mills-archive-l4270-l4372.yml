  summary: The speaker asks Mazda Ahura to disclose what may and may not be. He praises
    the declared word as the Mathra of Welfare and Immortality, speaks of a realm
    flourishing in holiness, and describes Ahura Mazda as the first conceiver or inspirer
    of truths, creator of Righteous Order, supporter of Beneficent Mind, father of
    Good Mind, maker of Righteousness, Lord of life’s actions, and Creator of the
    Kine.
