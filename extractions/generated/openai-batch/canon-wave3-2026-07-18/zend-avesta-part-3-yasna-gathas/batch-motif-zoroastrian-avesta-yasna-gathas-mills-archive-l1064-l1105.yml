canonical_text:
  quote: In the Gathas all is sober and real.
  summary: The passage is an introductory scholarly comparison between the Gathas
    and later Avesta. It argues that the Gathas have a sober, practical, historical
    atmosphere, with only rhetorical exceptions such as the wailing Kine's soul and
    the Deity with Immortals speaking, hearing, and seeing. It denies monsters, dragons,
    fabulous defenders, and miracles except inspiration, and contrasts the Gathic
    toiling prophet with later fabled or demi-god portrayals.
  language: English
  quote_policy: quoted
