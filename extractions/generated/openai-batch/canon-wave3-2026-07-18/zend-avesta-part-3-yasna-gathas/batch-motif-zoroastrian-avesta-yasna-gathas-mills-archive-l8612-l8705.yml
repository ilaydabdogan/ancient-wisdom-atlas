canonical_text:
  quote: ''
  summary: The passage praises Ahura Mazda through Yasna worship and piety, describing
    him as acting through Good Mind, Righteousness, and Holy Order to support flocks,
    people, land, and creation, and to grant Weal and Immortality. It contrasts Ahura
    and those who honor him with Daeva-gods and alien men who deride him. It also
    refers to the Saoshyant's bounteous Faith and saving power. The included editorial
    material introduces Yasna XLVI as concerned with personal sufferings, hopes, appeals,
    and addresses to adherents or assemblies.
  language: English
  quote_policy: summarized
