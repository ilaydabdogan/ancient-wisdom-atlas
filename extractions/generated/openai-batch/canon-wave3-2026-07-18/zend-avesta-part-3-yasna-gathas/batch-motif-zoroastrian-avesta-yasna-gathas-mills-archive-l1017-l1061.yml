  quote: ''
  summary: The passage is an introductory evaluation of the Gathas, emphasizing their
    remote period and social setting. It describes Zarathiutra/Zarathuj-tra as devoted,
    courageous, not unwilling to shed blood, vocal in misfortune, and persistent.
    It outlines his sphere among provinces, villages, armies, individuals, rulers,
    chieftains, religiously devoted men, a priesthood, and a population. It describes
    three social orders, disturbed times, insecure royal tenure, and Vistaspa's vulnerable
    throne.
  language: English
