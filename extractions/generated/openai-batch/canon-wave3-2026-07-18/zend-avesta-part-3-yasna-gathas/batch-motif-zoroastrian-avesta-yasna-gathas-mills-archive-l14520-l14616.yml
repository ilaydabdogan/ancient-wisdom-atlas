canonical_text:
  quote: ''
  summary: A liturgical speaker invokes a series of chiefs, lords, holy powers, the
    Mazdayasnian Faith, the holy earth, the Fire of Ahura Mazda, fire-priests, Atharvans,
    pupils, Bountiful Immortals, and prophets. The speaker offers the flesh of his
    frame and blessings of life to the Bountiful Immortals, praises Ahura Mazda’s
    good thought, speech, disposition, and action, and worships with sacrifices, gifts,
    prayers, and confessions. The passage also mentions two spirits and worship of
    Fravashis including that of the Kine and Gaya Maretan.
  language: English
