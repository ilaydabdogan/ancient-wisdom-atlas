  summary: A ritual litany repeatedly declares worship, with sacrifice, of sacred
    utterance and law, mountains, kingly glory, blessing, waters, lands, plants, time-lords,
    named divine beings and guardians, Haoma, Zarathustra’s Fravashi, fire, saintly
    Fravashis, Yazads, and ritual lords. It closes with short ritual speech by the
    Ratu and Zaotar.
