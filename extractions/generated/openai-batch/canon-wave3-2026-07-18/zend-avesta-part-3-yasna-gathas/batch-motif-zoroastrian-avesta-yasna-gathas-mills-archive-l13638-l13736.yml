canonical_text:
  quote: ''
  summary: 'In a dialogue, Haoma names earlier men who prepared him for the corporeal
    world and states the gains they received: Athwya gained the son Thraetaona, who
    slew the dragon Dahaka; Thrita gained two sons, Urvakhshaya and Keresaspa, of
    whom Keresaspa slew a poisonous horned dragon. Editorial notes compare some names
    and dragon-slaying details with Vedic figures and motifs.'
  language: English
  quote_policy: summarized
