  summary: The passage argues that eastern names in the Vendidad may point to East
    Iranian ancestral homes and possible westward migration of Zarathushtra's ancestors.
    It then discusses the probable place and time of Zarathushtra's activity, connects
    the region with the land of the Vedas and shared Irano-Indian divine names, and
    considers the later Avesta in relation to Darius's inscriptions and mortuary practices.
