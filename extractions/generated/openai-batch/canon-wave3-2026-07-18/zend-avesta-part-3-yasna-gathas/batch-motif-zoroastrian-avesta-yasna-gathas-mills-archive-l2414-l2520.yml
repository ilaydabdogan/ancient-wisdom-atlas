canonical_text:
  quote: ''
  summary: In Yasna XXIX, a question is put to Righteousness about who was appointed
    as guardian, cattle-chief, and life's master for the Kine, able to secure pasture
    and repel the fury of the wicked. Asha/Righteousness answers that no capable,
    hate-free chieftain was obtainable and refers to hidden influences connected with
    lofty fires. A mighty being is approached with invocations. Zarathustra then intervenes,
    declaring that the Great Creator, Ahura, knows deeds of demon-gods and men across
    time and is the discerning arbiter whose will determines the outcome. The excerpt
    ends as Zarathustra says his soul and the soul of the mother Kine make supplication.
  language: English
  quote_policy: summarized
