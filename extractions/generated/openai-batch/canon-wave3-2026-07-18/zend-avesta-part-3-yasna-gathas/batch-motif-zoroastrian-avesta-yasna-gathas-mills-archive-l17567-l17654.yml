canonical_text:
  quote: ''
  summary: The passage praises Ardvi Sura Anahita as a holy, Mazda-made water or river
    effective against Daevas and worthy of sacrifice. She purifies male seed, women’s
    wombs, childbirth, and milk. Her waters flow from high Hukairya to Vouru-kasha,
    stir its gulfs, divide through many tributaries and outlets, and reach all seven
    Karshvars in summer and winter. The saints’ Fravashis are summoned near in relation
    to the waters. The waters are not to benefit evildoers but may become tormenting
    or destructive against them. The invoking priest is instructed to offer to the
    good waters with proper ritual words, following what Ahura Mazda showed to Zarathustra.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ardvi Sura Anahita is described as holy, efficacious against the Daevas, devoted
    to Ahura's lore, worshipped with sacrifice, and beneficial to living things, herds,
    settlements, wealth, and the Province.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ardvi Sura Anahita is said to purify the seed of male beings, sanctify women’s
    wombs for birth, make women fortunate in labour, and bring women a timely flow
    of milk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ardvi Sura Anahita’s volume is said to equal all waters flowing on earth,
    and she flows from high Hukairya to the sea Vouru-kasha.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Ardvi Sura Anahita rushes into Vouru-kasha, its gulfs are stirred and
    the middle wells up; she plunges foaming and has a thousand tributaries and a
    thousand outlets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A chief outlet of Ardvi Sura Anahita divides to all seven Karshvars, carries
    waters in summer and winter, and purifies men’s seed, women’s wombs, and women’s
    milk.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The saints’ Fravashis, including those of saints living, dead, born, and yet
    to be born, are asked to draw near and are associated with bearing the waters
    upstream.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The waters are denied to people described as evil in intent, speech, deed,
