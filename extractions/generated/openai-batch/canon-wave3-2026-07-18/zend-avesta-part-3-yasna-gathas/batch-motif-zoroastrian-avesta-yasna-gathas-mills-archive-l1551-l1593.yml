canonical_text:
  quote: "“naming gods, demons, and heroes so closely related, not to speak of myths”"
  summary: A scholarly introduction compares the Gathas, later Avesta, and Vedic Hymns/Rig-Veda
    by date, metre, linguistic form, and related mythic names. It argues that the
    Gathas show great antiquity through the historic mention of Zarathustra, but also
    appear relatively late because of abstract conceptions and the absence of Aryan
    gods such as Mithra and Haoma. It rejects a sudden dismissal of ancient gods or
    a religious schism as the cause of Indian migration.
