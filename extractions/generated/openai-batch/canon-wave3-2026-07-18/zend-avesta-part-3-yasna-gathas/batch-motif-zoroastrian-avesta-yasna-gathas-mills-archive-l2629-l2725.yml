canonical_text:
  quote: ''
  summary: A divine speaker says Zarathustra Spitama has listened to sacred enunciations
    and wishes to proclaim gracious acts for the Great Creator and Righteousness,
    and promises him a good abode. The Soul of the Kine laments its wounded condition
    and complains that its lord is powerless, while desiring an effective sovereign-like
    helper. The Ameshospends ask when strong-handed help will appear. Zarathustra
    prays to Ahura and Righteousness for gladness, divine Kingdom, peaceful homes,
    and asks when Righteousness, Good Mind, and Sovereign Power will come to strengthen
    him for his mission.
  language: English
  quote_policy: summarized
