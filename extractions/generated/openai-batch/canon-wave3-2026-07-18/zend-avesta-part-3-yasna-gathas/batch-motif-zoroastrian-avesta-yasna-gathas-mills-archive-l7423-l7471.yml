canonical_text:
  quote: ''
  summary: The speaker addresses Ahura Mazda as bounteous. Through Ahura Mazda's sovereign
    Power and Righteous Order, the speaker stands forth to go out to, or arouse, chiefs
    of the pure proclamation and others who recite the remembered Mathra word. The
    speaker says Sraosha, Obedience, approached through the Good Mind's grace and
    instructed that the quiet, long-enduring better mind with understanding should
    teach the speaker; the next warning begins but is fragmentary in the supplied
    passage. Translator notes discuss alternative readings and linguistic comparisons.
  language: English
