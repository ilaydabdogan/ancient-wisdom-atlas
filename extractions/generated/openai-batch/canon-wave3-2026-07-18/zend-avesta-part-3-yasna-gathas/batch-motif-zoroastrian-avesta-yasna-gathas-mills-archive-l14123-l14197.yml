canonical_text:
  quote: ''
  summary: The passage condemns an unnamed woman who wrongly eats Haoma's offering,
    presents Haoma's declaration of belonging to good thought, word, deed, obedience,
    and the saint rather than their evil opposites, and has Zarathustra praise and
    ritually pour Haoma. Haoma is described as Mazda-made, mountain-associated, health-imparting,
    victory-giving, healing, progress-causing, and death-averting. The passage also
    praises the Kine and worships the Fravashi of Zarathustra Spitama.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed female figure is said to try vainly to foil and beguile both the
    Fire-priest and Haoma; she is said to be deceived and to perish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same figure is described as sitting at home and wrongly eating Haoma's
    offering; this is said not to make her a priest's mother or give her holy sons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A speaker, identified in a translator note as Haoma, declares belonging to
    five positive categories and not to five negative ones.
  category: speech
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:4
  text: The declared positive categories include good thought, good word, good deed,
    Obedience, and the saint; the rejected categories include evil thought, evil word,
    evil deed, deaf disobedience, and the wicked.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speech says that the division will continue until the ending and the parting
    of spirits, with the two dividing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Zarathustra speaks praise to Haoma as Mazda-made and praises all Haoma plants
    on mountain heights, in valley gorges, and in clefts of hillsides where bundles
    are bound by women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Zarathustra says he pours Haoma from a silver cup to a golden chalice and
    asks not to spill the sacred liquor to earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Haoma's Gathas, songs, teachings, and truthful ritual words are described
    as health-imparting, victory-giving, and healing from harmful hatred.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Haoma's exhilarations are described as flowing forth, bright, sparkling, light,
    and flying lightly; Haoma is also called victory-giving and worshipped.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Kine receives praise and victory, with food and pasture spoken for it,
    and is asked to yield food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The yellow lofty Haoma is worshipped as causing progress, advancing settlements,
    and driving death afar; all Haoma plants, their blessedness, and the Fravashi
    of Zarathustra Spitama are also worshipped.
  category: action
  evidence_refs:
  - ev:7
