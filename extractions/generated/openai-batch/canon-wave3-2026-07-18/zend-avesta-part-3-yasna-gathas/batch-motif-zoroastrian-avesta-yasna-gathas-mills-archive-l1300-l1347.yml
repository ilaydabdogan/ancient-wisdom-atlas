  summary: The passage argues that Darius and the royal inscriptions do not fit later
    Zarathushtrian ceremonial law because tomb burial is presented as a major violation
    of that later law. It considers whether Darius followed an earlier or different
    form of Mazda-worship and notes that burial and possibly cremation may not yet
    have been forbidden in earlier Iranian religious practice. The passage also mentions
    expected but omitted references to a chief adversary and the Bountiful Immortals.
