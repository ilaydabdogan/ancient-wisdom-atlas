canonical_text:
  quote: ''
  summary: 'An unnamed speaker addresses Ahura/Mazda with requests for right instruction:
    to reveal a saving lord, to explain approach to a divine conference and chieftainship
    guided by Mathra and Righteousness, to acquire a prize of ten mares and a camel
    as sacrificial gifts, and to state the sentence for one who withholds an earned
    gift from the correct speaker.'
  language: English
  quote_policy: summarized
