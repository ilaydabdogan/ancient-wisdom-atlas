  quote: ''
  summary: The passage says that a worshipper desires to honor Ahura because Ahura
    approaches with divine authority and blesses men and herds. The worshipper seeks
    to magnify the Lord in ritual praise. Ahura is contrasted with the Daevas and
    their party. Ahura's prophet honors Him through holy Insight, the Daena of the
    Saoshyant, and the Saoshyant is described as controlling master of faithful worshippers.
    The faithful venerator is described with kinship language as friend, brother,
    and Father in the Faith.
