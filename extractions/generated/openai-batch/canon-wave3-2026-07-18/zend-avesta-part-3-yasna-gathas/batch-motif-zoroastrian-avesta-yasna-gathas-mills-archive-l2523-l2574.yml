canonical_text:
  quote: ''
  summary: The passage describes entreating Ahura, the Great Creator, with questions
    concerning the two worlds. It states that the righteous person and the thrifty
    tiller will not be destroyed together with the wicked. Ahura then speaks, described
    as understanding by insight, and says that no spiritual master or righteous chieftain
    has been found in that manner; therefore he has named or appointed “Thee” as head
    for the diligent tiller of the ground. Translator notes identify the addressed
    figure with Zarathartra and mention a rejected linguistic comparison of Mazdau
    and medha.
  language: English
