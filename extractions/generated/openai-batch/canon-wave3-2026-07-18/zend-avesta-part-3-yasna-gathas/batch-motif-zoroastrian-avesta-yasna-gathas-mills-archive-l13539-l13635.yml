canonical_text:
  quote: ''
  summary: 'The passage begins with editorial comments on Haoma worship and Indian
    Soma, then narrates the opening of Yasna IX: Haoma comes to Zarathustra during
    the Havani rite while Zarathustra serves the sacred Fire and sings the Gathas.
    Zarathustra asks who the beautiful glorious being is. Haoma identifies himself
    as holy and death-averting, asks for prayer, preparation, and praise, and answers
    Zarathustra’s question about the first man to prepare him. Haoma says Vivanghvat
    first prepared him and received the birth of Yima, whose reign brought freedom
    from death, drought, age, cold, heat, and demon-made envy.'
  language: English
  quote_policy: summarized
