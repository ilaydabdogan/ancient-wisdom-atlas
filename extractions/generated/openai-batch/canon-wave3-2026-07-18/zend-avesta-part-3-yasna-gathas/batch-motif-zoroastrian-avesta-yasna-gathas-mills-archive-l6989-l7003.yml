canonical_text:
  quote: ''
  summary: 'The passage describes a speaker beseeching Ahura/Mazda for answer and
    favour, asking that the deity shape or supply his petitions. It notes an alternative
    reading in which Ahura questions or searches the speaker, then returns to the
    retained reading: if Ahura asks the group’s questions for them, they will not
    fail, will not be like desireless men rejected by the wailing kine, and will be
    Ahura’s rulers speaking their wish.'
