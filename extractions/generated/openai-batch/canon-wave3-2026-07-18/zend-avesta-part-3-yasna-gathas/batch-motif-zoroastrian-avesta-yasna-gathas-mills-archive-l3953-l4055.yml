  text: Piety is ascribed to Ahura as his own and elsewhere his daughter; Ahura is
    also described as creator of the Kine and of Understanding.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ahura makes a path for the Kine, but the Kine’s free choice is said not to
    be abolished; she may proceed on the path guided by the first prophet or follow
    the profane nomad.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The Kine chooses the guardian appointed by Ahura, a diligent and pious husbandman,
    and rejects the idle, free-booting nomad.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After Mazda completes the inspiration of doctrines concerning choice in action,
