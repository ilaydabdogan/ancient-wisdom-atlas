canonical_text:
  quote: ''
  summary: The passage is a commentary-style section on Yasna XXXI. It describes a
    decision mediated by Sacred Fire and ritual, a missionary effort to proclaim doctrine,
    prayers for a mighty kingdom against falsehood, requests for prophetic and judicial
    knowledge, praise of the Mathra and Ahura’s authority, Mazda as creator, father,
    controller, and judge, the Kine’s free choice of a pious husbandman over a nomad,
    the struggle between the prophet and Daeva-worshippers, the examination of good
    and evil Spirits, and Ahura’s omniscient awareness of injustice and the future.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A satisfying decision is said to be given through the Sacred Fire and holy
    ritual, giving mental keenness to two contending parties; the doctrine is to be
    proclaimed for the conversion of mankind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the later traditional system announced restoration and conversion
    of all men, while the commentator states that he finds no trace of this in the
    Gathas and sees only an effort to convert.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bountiful Immortals are addressed as the Ahuras of Mazda, and a prayer
    asks for establishment of a mighty kingdom to overcome personified falsehood associated
    with opposing Daeva-worshippers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker asks for prophetic and judicial knowledge about what should be
    done or what is about to happen soon.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Mathra is lauded as if delivered afresh, and the Word of God is praised
    together with Ahura’s Sovereign Authority in a kingdom where goodness would increase.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Heavenly bodies are taken as evidence of the wisdom of the one who created
    Asha and the Good Mind; Ahura is said to support and extend their influence because
    he never changes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mazda is described as the supreme object of devotion, father of the personified
