canonical_text:
  quote: ''
  summary: A Yasna hymn addresses the Ahurian daughter of Ahura and the waters. The
    speaker offers Zaothra with Haoma, milk, and Hadhanaepata, worships and sacrifices
    to the Ahurian one, the sea Vouru-kasha, and all waters, asks for health, growth,
    heaven, offspring, and social prosperity, and states that pious sacrifice to the
    good waters brings splendour, health, possessions, a legitimate scion, long life,
    and the best life of the saints. Milk and libation are said to make waters flow
    and plants sprout while opposing demonic adversaries including a Daeva-made Dragon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker offers the rite to the Ahurian daughter of Ahura as a help for
    life and asks that the Zaothra satisfy any offense; the Zaothra is described as
    having Haoma, milk, and Hadhanaepata.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Zaothra is invited to approach for milk and libation and is associated
    with health, healing, progress, growth, ceremonial merit, good renown, equanimity,
    and victory for advancing settlements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage describes worship with Zaothras of good thought, good word, and
    good deed for enlightenment of thoughts, words, and actions, preparation for the
    soul, settlement advance, and preparation of meritorious saints.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker asks the Ahurian One for Heaven and for manly, legitimate offspring
    who will promote the speaker's house, village, tribe, province, and authority.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sacrifice is directed to the Ahurian one, the sea Vouru-kasha, and all waters
    on earth, including standing waters, running waters, well-waters, spring-waters,
    rain-drippings, and canal irrigations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The good and best waters are said to have been created by Mazda.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The milk and the libation are said to make the waters flow and the plants
    sprout forth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The milk and libation are also described as opposing the Daeva-made Dragon,
    arresting the Pairika, and contradicting the malice of the Ashemaogha, an unholy
    tyrant, and a human Daeva-worshipper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ahurian daughter of Ahura is asked to hear the sacrificial chants, be
    propitiated by the Yasna, be present at the rite, and come to help.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that if any man sacrifices piously to the good waters with
    fitting Zaothras, the waters give splendour, glory, health, bodily vigour, prominence
    of form, possessions, a legitimate scion, long life, and the best life of the
    saints; the speaker as priest asks to receive the same.
  category: sequence
  evidence_refs:
  - ev:7
