canonical_text:
  quote: ''
  summary: A Yasna litany continues the sacrifice by repeatedly naming beings, powers,
    times, celestial bodies, fires, waters, plants, festivals, and ritual authorities
    who are worshipped with the sacrifice. Ahura Mazda is invoked as creator and maker;
    Fire is called Ahura Mazda's son; waters and plants are described as Mazda-made;
    calendar divisions and seasonal festivals are included among the worshipped powers.
  language: English
  quote_policy: summarized
