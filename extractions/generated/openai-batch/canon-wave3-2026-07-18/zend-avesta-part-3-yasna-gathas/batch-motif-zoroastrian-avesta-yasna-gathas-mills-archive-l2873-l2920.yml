canonical_text:
  quote: ''
  summary: The passage comments on a Gathic prayer in which a reciter asks that he
    and his associates not anger divine mercy, that they persevere in service to Ahura,
    Asha, and Vohu Manah, and that Ahura fill his desire with righteous and benevolent
    gifts. The gifts are described chiefly as holy revelation. The reciter finally
    asks Ahura to speak the laws of the moral universe so that he may declare them
    to the waiting masses; Ahura is said to answer through a revelation of eternal
    principles that discriminates truth from falsehood.
  language: English
