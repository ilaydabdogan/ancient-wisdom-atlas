canonical_text:
  quote: ''
  summary: 'The passage says that Zarathustra Spitama''s best prayer has been answered:
    Ahura Mazda is asked to grant boons flowing from good Order, including a life
    prospered for eternal duration, and to make those who deceived him disciples of
    the good Faith in word and deed. It then asks Kavi Viitaspa, a Zarathustrian Spitama,
    and Frashaostra to offer propitiation to Mazda in thought, word, and deed. Translator
    notes discuss the conversion or instruction of deceivers and the uncertain identity
    of the Zarathustrian Spitama.'
