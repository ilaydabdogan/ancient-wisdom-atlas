canonical_text:
  quote: ''
  summary: The passage gives first-person liturgical declarations of approach and
    propitiation directed to Haoma, the Haoma-juice, Zarathustra's Fravashi, Fire
    as Ahura Mazda's son, the Fravashis of saints, lords of the ritual order, heavenly
    and earthly Yazads, and named ritual or temporal lords. The speaker confesses
    Mazdayasnian identity, allegiance to Zarathustra's order, hostility to the Daevas,
    and devotion to the Lord's lore. A final rubric introduces the Zaotar as speaker
    of the following formula.
  language: English
  quote_policy: summarized
