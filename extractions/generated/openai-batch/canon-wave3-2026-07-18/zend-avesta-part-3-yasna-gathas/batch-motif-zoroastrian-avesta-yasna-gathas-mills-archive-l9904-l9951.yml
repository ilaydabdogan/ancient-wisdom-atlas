  quote: ''
  summary: The passage asks Mazda about the secret of a future struggle and describes
    the enlightened person as one who closely follows the holy Faith or Daena in word
    and action, aligning will and creed and becoming versed in Mazda's Understanding.
    It then prays that good kings and the righteous obtain rule, that evil monarchs
    not govern, and invokes Aramaiti as pious wisdom who sanctifies human minds with
    blessings for offspring and mentions the Kine.
