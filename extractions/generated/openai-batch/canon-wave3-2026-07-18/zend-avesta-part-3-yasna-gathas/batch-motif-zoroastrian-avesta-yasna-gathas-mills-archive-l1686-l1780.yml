canonical_text:
  quote: ''
  summary: The introduction argues for cautious but serious use of Pahlavi translations,
    glosses, Neryosangh’s Sanskrit, and later Parsi/Persian translations in rendering
    and restoring the Avesta and Gathas. It compares Pahlavi evidence with Vedic evidence,
    discusses limits of literal Pahlavi rendering, defends traditional translations
    despite errors, notes manuscript evidence including the Copenhagen manuscript
    dated 1323 CE, describes deterioration and revival in the transmission, and briefly
    reports an Aiv/a Viraf notice about Avesta text traced on skins at Persepolis.
  language: English
  quote_policy: summarized
