canonical_text:
  quote: ''
  summary: The speaker seeks to discern and proclaim truths and the pure Daena or
    Faith of Ahura Mazda. He calls for attentive hearing in accordance with Good Mind
    and Holy Order, asks who will serve as ally or kinsman-lord for establishing worthy
    praise, identifies Frashaostra as given a guardian headship of Holy Order, prays
    for confirmation of that gift and for sheltering headship in Ahura's Realm, exhorts
    the zealous husbandman to listen, excludes the wicked from the sheltering chieftainship
    and best recompense, and states that believing natures and two named champions
    are joined through Holy Order.
  language: English
  quote_policy: summarized
