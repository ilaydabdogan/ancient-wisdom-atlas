canonical_text:
  quote: '"So your last word is ''Vayu''"'
  summary: Yasna LIII.7-8 addresses righteous women, promises them recompense, contrasts
    their action with lustful desire descending toward the reach of the evil spirit,
    says they bring forth a champion to help the cause, and describes sinners being
    foiled, consumed, and angrily crying out while the champion with good kings delivers
    the smiter as a captive. Translator notes discuss the ambiguity of recompense,
    Vayu, and parallels within the Yasna.
  language: English
