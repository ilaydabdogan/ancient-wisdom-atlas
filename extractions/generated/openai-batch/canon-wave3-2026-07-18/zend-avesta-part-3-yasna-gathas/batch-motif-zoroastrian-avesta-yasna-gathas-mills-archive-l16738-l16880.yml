canonical_text:
  quote: ''
  summary: Hymnic sections worship Sraosha, Obedience, as a blessed and stately ritual
    chief who smites victoriously, furthers settlements, first spread the Baresman,
    first chanted the Gathas of Zarathustra, receives Yasna worship with consecrated
    waters, builds a house for poor men and women, defeats Aeshema and other hostile
    figures, sits among the Bountiful Immortals, wards destructive terrors from dwellings
    and communities, and vigilantly guards the creatures of Ahura.
  language: English
  quote_policy: summarized
