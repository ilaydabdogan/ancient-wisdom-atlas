  quote: ''
  summary: The passage describes the Yasna as the chief Zarathustrian liturgy, combining
    confession, invocation, prayer, exhortation, and praise. It notes that the Gathas
    are sung in the middle of it, that the Visparad is interpolated within it in the
    Vendidad Sadah, and that the present arrangement is regarded as very ancient though
    not necessarily original to the earliest period. It states that the word Yasna
    means worship including sacrifice and lists manuscript locations for introductory
    excerpts.
