canonical_text:
  quote: ''
  summary: A liturgical passage invokes and worships Sraosha, identified as Obedience,
    asking him to be present for ritual worship and aid. Sraosha is praised as blessed,
    stately, victorious, a furthers of settlements, lord of ritual order, incarnate
    word of reason, and one whose body is the Mathra. The passage recalls Sraosha
    as the first to adore Ahura in Mazda's creation with the Baresman spread, and
    names consecrated waters, the Bountiful Immortals, Blessedness, Nairya-sangha,
    Ahura Mazda, and the words and deeds of Zarathustra within the ritual frame. An
    editorial note connects Sraosha with earlier Gathic usage and emphasizes both
    abstract and imagistic aspects.
  language: English
  quote_policy: summarized
