canonical_text:
  quote: ''
  summary: In an editorial summary of Yasna XXXII, the composer is described as facing
    the Daeva party amid reverses, receiving Mazda's encouragement, denouncing the
    Daevas and their worshippers as aligned with Satan or the Evil Mind, lamenting
    their perversion of human minds and destruction of hopes for earthly happiness
    and heavenly immortality, and recalling Ahura's countermeasures through holy doctrines
    and divine Khshathra.
  language: English
  quote_policy: summarized
