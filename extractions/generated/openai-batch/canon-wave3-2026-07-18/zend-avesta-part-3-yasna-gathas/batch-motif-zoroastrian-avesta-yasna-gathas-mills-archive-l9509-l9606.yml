canonical_text:
  quote: ''
  summary: The passage presents Ahura Mazda as ultimately setting things right, giving
    fullness and the best gifts to the righteous while the faithless and wicked act
    under the Evil Mind. It connects divine gifts with Fire, Piety, and Righteous
    Order. The translated verses describe Ahura Mazda giving Universal Weal and Immortality
    to a chosen righteous person through the bountiful Spirit, Best Mind, Righteous
    Order, Sovereign Power, and Piety; they also personify Good Mind and Aramaiti
    and describe Ahura Mazda as father of Righteous Order and maker of the joy-creating
    Kine.
  language: English
  quote_policy: summarized
