canonical_text:
  quote: ''
  summary: The passage gives a liturgical notice for recitation at a specified date
    and Rapithwina ritual time, names presiding geniuses and divine recipients of
    propitiation, and presents a dialogue in which Ahura Mazda invites Zarathustra's
    questions. Zarathustra asks what reward belongs to the person who recites and
    sacrifices with the Rapithwina office and prescribed ritual preparations. Ahura
    Mazda answers that the reward is like the southern wind's beneficent effect on
    the material world.
  language: English
  quote_policy: summarized
