canonical_text:
  quote: ''
  summary: The speaker calls near and far listeners who seek knowledge to hear and
    ponder, warns against the false teacher and wicked speech, declares the world's
    two first spirits as opposed in thought, deed, conscience, and soul, presents
    a first teaching told by all-wise Mazda Ahura, warns that non-obedience to the
    Mathra ends in woe, and identifies Mazda in relation to Righteousness and as father
    of the Good Mind.
