canonical_text:
  quote: ''
  summary: A prayer addresses the Fire as Ahura Mazda's Son, requesting legitimate
    and capable offspring, instruction, renown, reward, and preparation of the soul.
    The Fire of Ahura Mazda admonishes those for whom it cooks, watches what visitors
    bring, and blesses the person who brings wood, Baresman, or the Hadhanaepata plant
    with cattle, people, active mind and soul, and blessed life. The passage then
    turns to praise of the good waters and Ardvi Sura Anahita as wide-flowing and
    healing.
  language: English
  quote_policy: summarized
