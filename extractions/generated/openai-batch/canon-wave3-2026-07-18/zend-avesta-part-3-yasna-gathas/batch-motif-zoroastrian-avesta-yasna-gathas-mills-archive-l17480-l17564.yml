    saints, good reward, good renown, and long preparation of the soul.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Fire of Ahura Mazda addresses an admonition to those for whom it cooks
    the night and morning meal and seeks good and healthful care from a true praiser.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fire says it looks at both hands of all who come by and asks what the one
    who walks at large brings to the one who sits at home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a passing man brings wood with sacred care, or brings the Baresman or Hadhanaepata
