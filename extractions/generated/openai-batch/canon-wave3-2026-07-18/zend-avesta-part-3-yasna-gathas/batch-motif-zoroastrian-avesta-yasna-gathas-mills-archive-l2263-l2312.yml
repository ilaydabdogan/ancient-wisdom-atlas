canonical_text:
  quote: ''
  summary: The passage comments on Yasna XXIX as a divine colloquy in which Zarathustra,
    Asha, the Kine's Soul, Ahura Mazda, and other Immortals are involved. Ahura Mazda
    is described as the supreme answerer of prayers, knower and judge of good and
    evil, and the one who appoints Zarathustra as a regulating lord. Zarathustra joins
    the Kine's Soul in supplication, is inspired by Good Mind and righteousness, and
    is expected to rally the community. The passage also says Mazda revealed a sacred
    Word-of-reason and provided food for the Kine.
  language: English
  quote_policy: summarized
