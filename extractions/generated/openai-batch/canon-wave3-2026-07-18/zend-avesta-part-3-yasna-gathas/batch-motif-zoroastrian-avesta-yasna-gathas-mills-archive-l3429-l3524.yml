canonical_text:
  quote: ''
  summary: The supplied passage combines translator commentary and the opening translated
    verse of Yasna XXX. It describes souls and their adherents aligning with good
    or evil, divine powers bestowing bodies on souls, a hoped-for future restoration
    to sinless happiness, punishment of those choosing the Evil Mind, defeat of the
    Lie by loyal citizens and Righteousness, the coming of God's kingdom, heavenly
    reunion of the righteous, and salvation for those who learn and heed the holy
    vows. The translated verse presents the speaker proclaiming teachings, praises
    for Ahura, sacrifices from the Good Mind, meditations inspired by Righteousness,
    and hoped-for results in the lights.
  language: English
  quote_policy: summarized
