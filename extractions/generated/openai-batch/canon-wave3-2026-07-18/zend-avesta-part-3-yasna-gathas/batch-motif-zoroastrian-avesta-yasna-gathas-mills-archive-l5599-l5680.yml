canonical_text:
  quote: ''
  summary: The passage comments on a prayer for an enlightened, useful friend who
    supports believers and cultivates cattle and fields. It then discusses a first-person
    speaker, possibly Zarathurtra as printed in the passage, who renounces disobedience,
    lying, and neglect of cattle, invokes Obedience, seeks straight moral paths where
    Ahura dwells, and asks the Best Spirit for knowledge about restoring and perfecting
    fields. The commentary connects sacred agriculture, the kine's soul, the flight
    of Daevas from prepared grain, and the securing of Welfare and Immortality.
  language: English
  quote_policy: summarized
