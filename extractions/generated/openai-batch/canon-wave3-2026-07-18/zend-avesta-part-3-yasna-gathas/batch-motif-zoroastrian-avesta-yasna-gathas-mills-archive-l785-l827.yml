canonical_text:
  quote: ''
  summary: The passage summarizes Mills's view that the Gathas present future reward
    and punishment as inward or mental states. It then outlines a sequence in which
    souls and laws are established, Aramaiti gives bodies, a Mathra is inspired for
    guidance, the faithful learn vows from the Immortals, the reprobate follow the
    Worst Mind and Daevas, and the Kine laments the suffering of the holy people amid
    conflict with Daeva-worshipping tribes.
  language: English
  quote_policy: summarized
