canonical_text:
  quote: ''
  summary: A ritual passage directs righteous participants to eat the Myazda meat-offering,
    invokes divine and ritual powers to teach Mazdayasnians, contrasts adherence to
    righteous words with the magician's word, petitions Ahura Mazda to empower the
    holy and strip the wicked of power, presents Zarathustra exhorting community leaders
    to follow Ahura's religion in thoughts, words, and deeds, and offers propitiation
    to Haoma. An editorial introduction to the Hom Yast identifies Haoma with Soma
    and discusses its antiquity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ratu tells deserving men to eat the Myazda, described as a meat-offering,
    because they have deserved it by righteousness and correctness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage addresses the Bountiful Immortals, the Mazdayasnian law, just
    men and women, and Zaothras, and asks waters, plants, and Zaothras to cause Mazdayasnians
    to be further taught.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sorcery is said to ruin the settlements of Righteousness.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: An adult Mazdayasnian who invokes earnestly but does not adhere to the stated
    words is said to approach the word of the magician; against that, Righteousness
    is called the Best blessing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ahura Mazda is petitioned to reign by his will with a saving rule over his
