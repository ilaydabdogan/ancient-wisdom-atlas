  summary: In a translated Gathic stanza, the speaker says Beudva/Bendva has long
    fought him, threatens him, and would crush his strength while he tries to recover
    the disaffected in his host through righteousness. The speaker addresses Mazda,
    asking for good gifts to meet his sorrow and for Bendva's death through Good Mind.
    Translator notes discuss uncertainty about Beudva's name and the sacred terms
    Asha and Vohu Manah.
