  summary: The passage contains editorial exposition and the opening translation of
    a Yasna section. It describes questions about righteous and wicked persons in
    a final consummation, punishment for installing an evil Daeva-party monarch, the
    contrast between Asha and its opponents, warnings against deceptive doctrines,
    appeal to Ahura and the Fire ordeal, the ultimate fate of seducers, and the happiness
    and immortality promised to the faithful.
