  summary: The passage explains ritual sentences as acts of attributing good, bestness,
    blessedness, the Mathra, kingdom, and righteousness to sacred or holy recipients.
    It states that the whole utterance is the word of Ahura Mazda. A catechetical
    addition says Mazda proclaimed a heavenly and earthly holy one, characterized
    by excellence and sovereign rule without capricious tyranny. The following invocation
    sacrifices to the parts and ritual uses of the Asha VahLrta prayer.
