canonical_text:
  quote: ''
  summary: The passage opens Visparad I with repeated liturgical announcements that
    the speaker will complete the Yasna to lords of various creature classes, yearly
    festivals, seasons, sacred recitations and Gathas, female ritual saints, women
    bearing many sons, the Yasna Haptanghaiti, Ardvi Anahita, and shining mountains.
    Several festivals are described by beneficent seasonal or agricultural epithets
    such as milk-giver, pasture-giver, corn-giver, breeder, cold, and a special time
    for ritual deeds.
  language: English
  quote_policy: summarized
