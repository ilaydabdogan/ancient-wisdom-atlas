canonical_text:
  quote: ''
  summary: The passage is a Yasna liturgical invocation and worship of the life, conscience,
    intelligence, soul, and Fravashi of holy kin, saints male and female, dead and
    living saints, unborn future prophets, the souls of the dead, teachers, disciples,
    holy children, and all good Fravashis from Gaya Maretan to the victorious Saoshyant.
    Translator notes discuss the relation between Fravashi and departed soul and gloss
    the range from Gaya Maretan to Saoshyant by analogy.
  language: English
  quote_policy: summarized
