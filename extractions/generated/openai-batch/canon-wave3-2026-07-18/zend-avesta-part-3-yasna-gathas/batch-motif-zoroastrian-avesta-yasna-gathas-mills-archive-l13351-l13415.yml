canonical_text:
  quote: ''
  summary: A Yasna liturgical sequence lists offerings and sacrifices of Haoma, Haoma-juice,
    wood-billets, perfume, sacred words, prayer, curse, and other items to Fravashis,
    Fire, Yazads, lords of ritual order, Haurvata/ and Ameretata/, and saintly beings.
    The speaker petitions Ahura Mazda for blessing, soul reward, and lasting protection
    through Righteousness, and the passage ends with a Ratu-Zaotar ritual speech exchange.
  language: English
  quote_policy: summarized
