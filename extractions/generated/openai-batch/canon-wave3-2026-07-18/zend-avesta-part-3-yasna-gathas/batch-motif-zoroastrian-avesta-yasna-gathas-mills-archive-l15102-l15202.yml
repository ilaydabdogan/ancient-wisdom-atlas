canonical_text:
  quote: The evil one at once arose (to oppose Him), but He (Ahura) repelled that
    wicked one
  summary: The passage explains a sacred word or saying to be learned and recited.
    Its recitation acknowledges Ahura Mazda as supreme over creatures, creator and
    director of mind, lord of actions, and holder of the Kingdom. Ahura Mazda pronounces
    the Ahuna-vairya and repels the evil one with a renunciatory declaration of non-harmony.
    The saying is also described as having three stages or measures, four classes
    of supporters, and five chiefs.
