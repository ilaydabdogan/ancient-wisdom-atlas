  quote: ''
  summary: The passage directs an addressee toward a blessed place associated with
    Piety, Righteous Order, the Realms of Good Mind, and Mazda's honoured home. The
    speaker promises measured songs of homage to Mazda, who discerns lawful and unlawful
    things. The passage promises gifts and wealth to those who offer sanctity or help
    Zarathustra, and oppression or righteous vengeance against oppressors. It also
    speaks of rewards beyond earth and blessings gained through the sacred mother-kine,
    commanded by Mazda.
