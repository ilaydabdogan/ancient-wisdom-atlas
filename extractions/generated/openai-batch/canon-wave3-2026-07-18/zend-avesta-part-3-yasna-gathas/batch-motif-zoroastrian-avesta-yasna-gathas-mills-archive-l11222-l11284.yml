canonical_text:
  quote: ''
  summary: The passage includes editorial notes and translated verses in which a speaker
    announces through Ahura Mazda's flaming Fire a steel-forged sword of justice made
    for both worlds, asks Ahura Mazda to bless an avenging saint against the wicked,
    identifies a life-threatening opponent as aligned with the Lie, invokes Asha/Righteous
    Order for help, and asks an assembly who is a loyal friend to Spitama/Zarathustra
    and who has questioned divine Righteousness. The notes also mention water and
    plants beside Immortality and Welfare, an alternate fire-ordeal interpretation,
    and a later association with metal founding and forging.
