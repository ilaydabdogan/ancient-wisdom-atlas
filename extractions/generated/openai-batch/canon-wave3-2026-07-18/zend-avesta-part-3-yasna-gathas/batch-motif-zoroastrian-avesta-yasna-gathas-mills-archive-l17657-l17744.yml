canonical_text:
  quote: ''
  summary: Liturgical instructions direct Zarathustra to pray to the waters and offer
    Zaothras to them. The prayer asks the waters and other natural and divine powers
    for favor, wealth, offspring, immortality, and welfare. A following section offers
    a Zaothra with Haoma, flesh, and Hadhanaepata to the Ahurian One for the propitiation
    of Ahura Mazda and other sacred beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zarathustra is told to pray a first petition to the waters and then offer
    sanctified Zaothras to the waters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spoken petition asks the waters to grant favor, wealth with power, and
    self-dependent offspring blessed by multitudes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same request is extended to waters, lands, plants, Bountiful Immortals,
    good male and female beings, Fravashis of the saints, Mithra, Sraosha, Rashnu,
    Fire, Apam-napat, and all Yazads.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prayer asks for something greater than the preceding gifts, identified
    in the translation note as Immortality and Welfare or Weal.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ahura Mazda is addressed as maker of the Kine, plants, and waters, and is
    asked to grant Immortality and Weal through Good Mind in the doctrine.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Zaothra is offered with sanctity, together with Haoma, flesh, and Hadhanaepata,
    to the Ahurian One for the propitiation of Ahura Mazda, the Bountiful Immortals,
    Sraosha, and the Fire of Ahura Mazda.
  category: action
  evidence_refs:
  - ev:5
