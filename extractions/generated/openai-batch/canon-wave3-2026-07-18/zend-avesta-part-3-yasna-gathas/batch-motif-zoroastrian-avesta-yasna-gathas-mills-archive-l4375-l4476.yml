canonical_text:
  quote: ''
  summary: 'The passage describes a Spirit ordering a path for a feminine figure,
    who is given a choice and chooses the husbandman as holy master rather than the
    non-tiller or thieving nomad. It then addresses Ahura Mazda as creator of holy
    settlements, revealer of religious laws, giver of understanding and bodily life,
    and deliverer of injunctions by which a wisher may place choices. The final portion
    names opposed voice-bearers: truthful or liar, enlightened or unenlightened.'
