canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction discussing the relative age, oral
    and textual transmission, possible interpolation, and geographic origin of the
    Gathas. It argues that the Gathas likely originated in north-eastern Iran, that
    the later Avesta developed during westward migration, and that the Gathas portray
    Zarathustra as a settled historical person among familiar families and associates
    rather than as a foreign figure.
  language: English
