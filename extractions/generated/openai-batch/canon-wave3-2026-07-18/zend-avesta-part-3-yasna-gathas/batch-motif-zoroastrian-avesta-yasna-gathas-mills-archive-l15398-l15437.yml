canonical_text:
  quote: ''
  summary: The passage explains liturgical statements in which the worshipper offers
    the Yasna, identified as sacrificial worship, to Mazda and to the Bountiful Immortals.
    It describes holy females headed by Aramaiti, asks to whom the Yasna is addressed,
    and presents Mazda’s answer of salvation for saints who exist, are coming into
    existence, or will exist. It ends with sacrifice to the YeNhe hatam, called a
    prominent and holy Vast.
