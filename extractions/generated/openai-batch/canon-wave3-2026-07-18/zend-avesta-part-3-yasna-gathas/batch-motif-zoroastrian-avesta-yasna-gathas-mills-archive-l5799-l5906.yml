canonical_text:
  quote: ''
  summary: The passage addresses Ahura and asks that a righteous, energetic helper
    for the cattle be present in the work-field of Righteous Order and the pastures
    of Good Mind. The speaker renounces disobedience, Evil Mind, arrogance, lying,
    falsehood, and poor care of the Kine’s meadows. The speaker calls on Obedience
    for help, long life, and straight paths of Righteous Order where Ahura Mazda dwells,
    and, as a faithful priest, seeks to know the Best Spirit’s intention concerning
    work in the fields.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura is addressed in a request that a man who is best toward the righteous
    saint, whether a lord’s kinsman, village labourer, or allied peer, be present
    in the work-field of Righteous Order and the pastures of Good Mind.
  category: speech
  evidence_refs:
  - ev:1
