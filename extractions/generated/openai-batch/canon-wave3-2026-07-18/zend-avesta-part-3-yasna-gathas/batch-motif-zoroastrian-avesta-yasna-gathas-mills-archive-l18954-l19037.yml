canonical_text:
  quote: ''
  summary: The passage enumerates ritual praise and offerings. It praises the sacred
    word, the Mazdayasnian religion, ritual prayers, and the holy creation; approaches
    named regions, ritual implements, and prayers with praise; and presents Haomas,
    Haoma-water, milk, Hadhanaepata, Baresman, mortars, Zaothras, and other offerings
    to Ahura Mazda, other divine or cosmic recipients, the good waters, the reciter's
    soul, and the entire holy creation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A well-timed prayer for blessings is described as praise of the Mathra Spenta,
    the Mazdayasnian Religion, the Praises of the Yasnas, ritual lords, and well-timed
    prayers for sacrifice, homage, propitiation, and glorification of the entire holy
    and clean creation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritual speaker desires to approach named karshvars or regions, including
    Arezahis, Savahis, Fradadhafshu, Vidadhafshu, Vouru-bareti, Vouru-jaresti, and
    Haniratha, with praise.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The ritual speaker desires to approach ritual objects and prayers with praise:
    stone and iron mortars, the Zaothra cup, hair that prevents spilling, the Baresman,
    the Ahuna-vairya, ritual prayers, and the standing offices of the Mazdayasnian
    Faith.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The celebrants present offered Haomas and lifted-up offerings to Ahura Mazda
