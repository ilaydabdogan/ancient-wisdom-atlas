    a holy ruler, the Bountiful Immortals, the good waters, the reciter's own soul,
    and the entire holy and clean creation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage lists Haoma implements and offerings, including spread mats, Myazdas,
