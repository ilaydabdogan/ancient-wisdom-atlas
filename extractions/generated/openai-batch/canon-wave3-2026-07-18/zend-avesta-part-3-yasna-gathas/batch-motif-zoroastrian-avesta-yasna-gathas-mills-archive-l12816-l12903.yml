  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Month-lords are invoked along with the new moon, waning moon, and full
    moon, with the full moon described as scattering night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The yearly festivals and the Seasons are announced and presented to as holy
    lords of the ritual order.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The three and thirty lords of the ritual order are said to approach nearest
    around Havani; the festivals of Righteousness the Best are described as inculcated
