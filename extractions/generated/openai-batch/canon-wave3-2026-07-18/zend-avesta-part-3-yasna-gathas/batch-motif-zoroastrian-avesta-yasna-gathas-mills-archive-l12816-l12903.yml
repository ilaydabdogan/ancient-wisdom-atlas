  - ev:9
- id: obs:4
  text: Righteousness the Best, Ahura Mazda's Fire, Napa-apam, and Mazda-made water
    are named among recipients of offerings.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The Fravashis of the saints, women who bring forth many sons, prosperous home-life,
