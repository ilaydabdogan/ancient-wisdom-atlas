canonical_text:
  quote: ''
  summary: A liturgical passage announces and presents offerings for sacrifice, homage,
    propitiation, and praise to Ahura Mazda, the Bountiful Immortals, lords of ritual
    time, Mithra, Fire, water, Fravashis, powers of victory and prosperity, lunar
    phases, yearly festivals, seasons, thirty-three ritual lords, and celestial bodies.
    The closing fragment addresses Fire as Ahura Mazda's son.
  language: English
  quote_policy: summarized
