  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers present offerings to Day-lords and named holy lords of the ritual
    order, including Havani, Savanghi, Visya, Rapithwina, Fradat-fshu, and Zantuma.
  category: action
  evidence_refs:
