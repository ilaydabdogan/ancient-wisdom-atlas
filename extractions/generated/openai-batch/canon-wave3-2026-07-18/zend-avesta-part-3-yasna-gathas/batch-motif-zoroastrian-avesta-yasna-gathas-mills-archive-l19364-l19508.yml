  quote: ''
  summary: 'The passage presents a liturgical sequence of worship and sacrifice: exact
    recital and memorisation of the Yasna Haptanghaiti for Ahura Mazda''s Fire; worship
    of Fire, divine beings, Fravashis, Sraosha, Zarathustra, saints, and creation;
    offerings to fields, waters, lands, plants, and textual units; striving after
    good thoughts, words, and deeds; worship of Ahura Mazda, the Amesha Spenta, salvation,
    blessedness, Aramaiti, understanding, the sun, Mathras, herds, glory, wisdom,
    and the laws of Righteous Order.'
