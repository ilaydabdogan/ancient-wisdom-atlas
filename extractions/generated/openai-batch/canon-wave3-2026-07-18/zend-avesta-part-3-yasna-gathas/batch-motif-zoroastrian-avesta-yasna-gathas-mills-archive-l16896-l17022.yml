  text: Sraosha is described as a teacher of the law who will stride forth upon the
    embodied inhabitants of the earth and rule as he wills.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Religion is said to confess Ahura Mazda, Good Mind, Righteousness the
    Best, Khshathra-vairya, Piety, Universal Weal, and Immortality; a question is
    asked to the Lord and Mazda’s lore is written.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speakers ask Sraosha to protect their lives in both the corporeal world
