canonical_text:
  quote: ''
  summary: A hymn section worships Sraosha, describes Haoma worshipping him on high
    Haraiti, places Sraosha’s luminous thousand-pillared house on that height, associates
    sacred utterances with victory, says Sraosha’s power enables the Bountiful Immortals
    to descend to the seven-quartered earth, invokes Sraosha as teacher and protector,
    and describes four brilliant swift racers drawing him from east to west while
    evading weapons.
  language: English
  quote_policy: summarized
