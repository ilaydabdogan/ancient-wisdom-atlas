  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speakers ask Sraosha to grant swiftness to teams, soundness to bodies,
    observation of foes, smiting of foes, and sudden death for foes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Four racers draw Sraosha in harness; they are white, shining, beautiful, powerful,
