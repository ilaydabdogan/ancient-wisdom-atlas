  summary: The passage is a scholarly introduction discussing the difficulty of translating
    and interpreting the Gathic, Avesta, and Pahlavi materials. It credits Professor
    von Spiegel's prior work, emphasizes that his editions and citations were not
    full translations, and explains methodological problems involving Pahlavi translations,
    Zend literalism, and the evaluation of glosses.
