canonical_text:
  quote: ''
  summary: A ritual exchange between officiants introduces Yasna IV, where an offering
    is made. The passage lists good thoughts, words, deeds, Haoma, Baresman, flesh,
    wood, perfume, prayers, Gathas, and Mathras; presents these to Ahura Mazda, Sraosha,
    the Bountiful Immortals, Fravashis, souls, and the Fire of Ahura Mazda; and asks
    that the rite be propitious for a house, its herds, its men, and those born or
    yet to be born.
  language: English
  quote_policy: summarized
