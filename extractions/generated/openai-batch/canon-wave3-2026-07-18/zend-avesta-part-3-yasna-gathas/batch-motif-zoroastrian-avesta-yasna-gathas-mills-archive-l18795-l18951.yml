  quote: ''
  summary: A liturgical passage enumerates beings, personified powers, cosmic elements,
    ritual objects, offerings, and sacred words to be worshipped, approached, praised,
    or offered homage. It invokes Ahura Mazda, the Bountiful Immortals/Yazads, Fire,
    Apam-napat, Haomas and Zaothras, the Kine and the Kine's Soul, and a sanctified
    farm-house, with emphasis on right rule, ritual order, healing, knowledge, and
    complete offering.
  language: English
