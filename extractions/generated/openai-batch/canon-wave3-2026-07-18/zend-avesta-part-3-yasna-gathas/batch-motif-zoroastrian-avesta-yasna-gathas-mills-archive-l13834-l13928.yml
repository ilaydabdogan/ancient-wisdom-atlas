canonical_text:
  quote: ''
  summary: In Yasna IX.20-28, the speaker petitions Haoma for blessings of success,
    victory, vigilance, protection, and bodily preservation. The passage says Haoma
    grants speed to racers, offspring to women, wisdom to book-searchers, and husbands
    to unmarried maidens. Haoma is said to have dethroned Keresani, is praised for
    power and sacred speech, receives from Mazda a star-bespangled girdle identified
    with the Mazdayasnian Faith, and is begirt on mountain summits for spreading precepts
    and the Mathra.
  language: English
  quote_policy: summarized
