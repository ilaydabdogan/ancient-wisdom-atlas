canonical_text:
  quote: ''
  summary: The passage contrasts Ahura Mazda, Asha, Good Mind, and the speaker with
    wretched beings, Yima, and an evil teacher. Yima is associated with eating pieces
    of kine flesh. The evil teacher destroys doctrines, perverts understanding, blasphemes
    the sacred Kine and the Sun, offers wicked gifts to Demon-gods, brings drought
    upon meadows, and attacks a saint with a mace. Notes identify the Yima episode
    as an allusion to his fall and supply limited cross-references to Genesis and
    Vedic kine traditions.
  language: English
  quote_policy: summarized
