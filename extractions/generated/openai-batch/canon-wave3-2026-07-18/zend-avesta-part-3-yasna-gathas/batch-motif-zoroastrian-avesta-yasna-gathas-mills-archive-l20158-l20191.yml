canonical_text:
  quote: ''
  summary: A liturgical passage repeatedly offers sacrifice to Rapithwina, several
    Gathas, named ritual entities, correctly spoken words, waters, lands, plants,
    heavenly Yazads, Bountiful Immortals, Fravashis, the heights of Asha, and Mathras.
    It describes correctly spoken words as victorious and demon-slaying, describes
    Mathras as directing action, vows, justice, and faith, and mentions an assembly
    of the Bountiful Immortals on the heights of Heaven for Zantuma. Notes mention
    the Ahuna and state that Zarathujtra conquered the Demon with the Ahuna-vairya.
  language: English
  quote_policy: summarized
