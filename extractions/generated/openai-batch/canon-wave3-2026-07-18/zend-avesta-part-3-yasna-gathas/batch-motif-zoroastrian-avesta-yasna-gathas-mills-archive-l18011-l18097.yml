  summary: Frashacstra asks Zarathustra what the memorized recital of the rites and
    completed delivery of the Gathas are. Zarathustra answers with a concluding liturgical
    enumeration of worship and sacrifice directed to Ahura Mazda, Zarathustra, Fravashis,
    Bountiful Immortals, Yazads, the Mazdayasnian Faith, sacred metres, the Mathra,
    holy creatures, the Gathas, the Yasna, and Mazda-spoken words that overcome evil
    thoughts, words, and deeds.
