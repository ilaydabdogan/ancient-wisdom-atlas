canonical_text:
  quote: ''
  summary: 'A first-person liturgical speaker announces and completes the Yasna to
    several ritual or divine recipients: figures connected with victory, rectitude,
    and settlements; monthly festivals and moon phases; yearly feasts and named seasonal
    observances; the seasons; and a collective group of thirty-three lords of the
    ritual order around Havani. Translator notes identify Rashnu and Arstal with rectitude,
    explain a moon phrase, gloss Ayathrima as the rutting season, and compare the
    number thirty-three with Indian textual traditions while noting differences in
    names.'
  language: English
  quote_policy: summarized
