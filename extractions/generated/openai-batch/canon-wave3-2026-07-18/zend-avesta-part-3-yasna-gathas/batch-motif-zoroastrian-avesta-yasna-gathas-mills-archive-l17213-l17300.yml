canonical_text:
  quote: ''
  summary: 'A liturgical passage of mutual blessings and household prayers: it worships
    victorious divine powers, offers sacrifice to ritual objects, souls, Fravashis,
    sacred formulas, and praises; presents reciprocal blessings between Ratu and Zaotar;
    and asks for straight paths, righteousness, divine sovereignty, welfare for the
    house and village, endurance of the Zarathustrian Faith, and the presence of cattle
    in the farm-yard.'
  language: English
  quote_policy: summarized
