  quote: Salvation is announced as universal for believers.
  summary: Introductory commentary to Yasna XLIII frames the hymn as Zarathustra's
    reflections on the sublimity and bountifulness of Ahura. It describes themes of
    universal salvation for believers, divine power and benevolence, final judgment,
    the prophet's call through Sraosha, prayers for wholeness of soul and body, duration,
    splendour, Asha, divine wisdom, and guidance on straight paths.
