canonical_text:
  quote: ''
  summary: The passage asks who receives bounteous Piety and serves the cause of Good
    Mind, presents Zarathustra as resistant to impure solicitation, describes the
    righteous conscience overcoming the wicked spirit on a Judgment Bridge, condemns
    the Karpans for harming creatures and leading others to the Home of the Lie, and
    states a reward connected with Ahura Mazda and the Song Home, Garo^man.
  language: English
  quote_policy: summarized
