  summary: The passage presents a speaker addressing Ahura while challenging the people
    to distinguish righteous believers from sceptics and those governed by Angra Mainyu.
    It describes hostility toward opposing gods, condemns a sinner or chief who opposes
    the speaker, and asks how the Lying Goddess may be driven to Hell beneath or delivered
    to Holy Order and the saints for destruction through Mathras. It then anticipates
    a coming collision between hosts and asks which side Ahura will favor and who
    will be the champion to lead the victors for both worlds.
