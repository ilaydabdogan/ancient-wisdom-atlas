canonical_text:
  quote: ''
  summary: The speaker asks Ahura Mazda and personified divine qualities for blessings,
    sovereign rule, wealth, and spiritual aid. A guarded community assembles to hear
    Ahura, then asks where the lord of thrift and divine powers approach from. The
    tiller of the earth asks how to gain the sacred Kine. The passage contrasts divine
    bestowal for the good with worse-than-evil recompense for the sacrifice-withholder
    at the last turning of creation, and asks for Immortality, Welfare, Good Mind,
    doctrine, and teaching that distinguishes woe for the wicked from salvation for
    the maintainer of holy Order.
  language: English
  quote_policy: summarized
