canonical_text:
  quote: Whom (had I) then but Thee, Thy Fire and Mind, Ahura!
  summary: The passage praises a ruler or judge who treats applicants without injury,
    lives by vow and covenant, discerns the wicked, and is called to act against a
    hostile leader. It curses the powerful person who refuses to reprove guilt, associates
    such failure with the abode of the Lie, contrasts evil and holiness, and appeals
    to Mazda/Ahura, Fire, and Mind as protection while hostile harm is turned back
    on its sender.
  language: English
  quote_policy: quoted
