canonical_text:
  quote: ''
  summary: The passage says that gifts and blessings will be given by the Good Mind
    for the cause of the Righteous Order. Kavi Vistaspa has attained wisdom conceived
    by Ahura in accordance with Asha to teach salvation. Frashao^tra the Hvogva presents
    a beloved form, identified in a note as his child, and Ahura Mazda is asked to
    grant her so that the people may receive her for the good Religion and the gaining
    of Asha. Gamaspa the Hvogva is addressed as holy wisdom is being chosen, though
    the printed excerpt is incomplete and notes an alternate reading.
  language: English
