canonical_text:
  quote: ''
  summary: A Visparad liturgical passage announces a celebration involving the good
    Mazdayasnian law, Gatha recital, prayer, wood-billets, perfume, fire, and good
    Mazda-made objects. The celebrants make these known as offerings or ritual acts
    to Ahura Mazda and multiple divine or sacred recipients, including Sraosha, Ashi,
    Rashnu, Mithra, the Bountiful Immortals, Fravashis, souls, Fire, and other ritual
    lords. The passage honors the Fravashi of Zarathustra and the holy Fravashis of
    the dead, living, and unborn, mentions future prophets bringing renovation of
    the completed world, describes the Bountiful Immortals as dwelling with and arising
    from Good Mind, and seeks benefit, increase, protection, and blessing for a household,
    its herds, and retainers.
  language: English
  quote_policy: summarized
