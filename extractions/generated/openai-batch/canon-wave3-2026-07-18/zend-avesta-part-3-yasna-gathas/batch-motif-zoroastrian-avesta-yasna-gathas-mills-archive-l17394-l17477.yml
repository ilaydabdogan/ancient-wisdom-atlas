  quote: ''
  summary: The passage first names hostile groups and ritual enemies to be encountered,
    dislodged, or overthrown, then asks how the Demon of the Lie may be driven away
    from the seven Karshvars. It then turns to an address to Fire as Ahura Mazda's
    son, offering sacrifice and homage, prescribing fuel and ritual materials, asking
    Fire to remain aflame in the house until renovation is complete, and petitioning
    Fire for glory, nourishment, understanding, power, and offspring.
