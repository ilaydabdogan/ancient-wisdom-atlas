canonical_text:
  quote: ''
  summary: The passage calls listeners to hear the all-wise one who conceived Righteous
    Order and rules truthful speech, describing Ahura’s shining flame as a guiding
    sign for strivers. It contrasts the fate of one who deceives the saint—destruction,
    darkness, foul food, and low speech—with Ahura Mazda’s gifts of Universal Weal,
    Immortality, and the Good Mind’s might to the one who is his friend in spirit
    and deeds.
