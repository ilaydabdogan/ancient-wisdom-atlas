  quote: ''
  summary: A Yasna LXVIII prayer sequence in which Mazdayasnians offering sacrifice
    ask for knowledge of the correct and straight path, protection from hostile invaders,
    safe and joyful habitation, healing, blessings from the waters, praise for divine
    and cosmic beings, and prosperity to salvation through Ahura Mazda.
  language: English
  quote_policy: summarized
