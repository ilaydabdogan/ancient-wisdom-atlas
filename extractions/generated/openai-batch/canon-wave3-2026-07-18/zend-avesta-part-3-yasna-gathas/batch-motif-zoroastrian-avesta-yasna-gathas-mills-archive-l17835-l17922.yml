- id: obs:1
  text: Mazdayasnians who are offering sacrifice ask to be granted the desire and
    knowledge of the correct path.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The supplicant group is described as including colleagues, disciples, Aethrapaitis,
    Aethryas, men, women, children, and maidens of the field who think good only.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer asks for the overwhelming of oppression and malice during raids
    of an invader and against foes who hate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The prayer requests knowledge of the straightest path, associated with Righteousness
    and with Heaven, described as the best life of the Saints, shining and glorious.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the Ratu is from the Righteous Order and that the
    kingdom is for Ahura, which may offer nurture to the poor.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Zaotar beseeches for a safe, joyful, quiet, and long abode for the dwellers
    in the village and for every Mazdayasnian village.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Zaotar asks for succour, salutations of salvation, praises, and the fullest
    Yasht for Fire, called the Ahurian one of Ahura.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The prayer asks for healthfulness, healing, and a thousand and ten thousand
    healing remedies for the province and for a saintly person between heaven and
    earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker invokes religious zeal, capability, and the waters with the Yasna,
    asking the good waters to grant splendour, glory, and an ancient helpful blessing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage offers praise to Ahura Mazda, the Bountiful Immortals, Mithra,
    the sun, a star called Ahura Mazda's eyes, the Kine, Gaya Maretan, the Fravashi
    of Zarathustra, and the entire holy creation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ahura is asked to cause the worshippers to prosper to salvation through Good
    Mind, Sovereign Power, and Righteous Order.
  category: speech
  evidence_refs:
  - ev:7
