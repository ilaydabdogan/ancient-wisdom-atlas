  quote: ''
  summary: In a continuing sacrifice, a first-person ritual voice repeatedly desires
    to approach the Zaothra and Baresman with worship and praise. Through these ritual
    objects, the speaker approaches Ahura Mazda, the Bountiful Immortals, named ritual-time
    lords, Mithra, Righteousness the Best, Fire as Ahura Mazda's son, Apam-napat,
    holy water, Fravashis of the saints, fertile women, prosperous home-life, and
    Force.
  language: English
