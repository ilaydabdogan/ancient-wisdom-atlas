canonical_text:
  quote: ''
  summary: 'The passage contains ritual prayers and invocations: opposition to evil
    creation is prayed for through Righteousness; Airyaman is asked to approach men
    and women taught by Zarathiutra with grace and recompense; sacrifice is offered
    to Airy^ma-ishyo, the Gathas, and the Praises of the Yasna; worshippers offer
    their wealth, bodies, consciousness, soul, and Fravashi to the Gathas, which are
    described as guardians, spiritual sustenance, and reward-givers for the world
    beyond; the Praises are asked to appear with power, healing, protection, and gifts
    for one who understands.'
  language: English
  quote_policy: summarized
