  summary: In this liturgical passage, the speaker urges Zarathustra to proclaim the
    righteous way and divine regulations, speaks of yoking Ahura's swift servants
    toward the Bridges, and approaches Ahura Mazda and Righteousness through worship,
    hymnic forms, outstretched hands, and Yasnas of sacrifice. Notes identify the
    Bridges with the Cinvat Bridge and explain it as a crisis before salvation or
    perdition where souls meet their own consciences.
