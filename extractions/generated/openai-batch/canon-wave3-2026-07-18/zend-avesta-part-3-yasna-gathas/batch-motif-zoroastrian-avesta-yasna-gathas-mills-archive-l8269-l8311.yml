canonical_text:
  quote: Between this being, or personified abstraction, and Ahura, there is a gulf
    fixed.
  summary: The passage introduces Yasna XLV as a hymn on the doctrine of dualism and
    homage to Ahura. It describes an addressed assembly, the defeat and silencing
    of an evil teacher or adversary, and a doctrinal distinction between Ahura and
    the Angra Spirit or personified Anger of the Daevas as the source of evils.
  language: English
