canonical_text:
  quote: ''
  summary: 'Yasna XXIV presents ritual offerings: Haomas, Myazdas, Zaothras, Baresman,
    flesh, milk, Hadhanaepata, Haoma-water, mortars, prayers, Gathic recital, wood-billets,
    perfume, and other Mazda-made good objects are presented to Ahura Mazda, the good
    waters, Fire, and Sraosha.'
