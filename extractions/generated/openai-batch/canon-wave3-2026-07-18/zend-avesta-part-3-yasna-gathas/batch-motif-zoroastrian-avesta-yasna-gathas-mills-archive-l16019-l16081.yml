canonical_text:
  quote: ''
  summary: A communal prayer addresses Ahura Mazda and Righteousness. The speakers
    choose best thoughts, words, and deeds for both worlds; pray for the Kine to receive
    comfort and fodder; ascribe the Kingdom to Mazda Ahura and Righteousness; urge
    men and women who know duty to declare and fulfill it; remember sacrifice, homage,
    and nurture of the Kine; act under ritual Order toward clean creatures; and proclaim
    righteous sayings through Ahura Mazda’s order, mind, power, words, and Yasna.
  language: English
  quote_policy: summarized
