canonical_text:
  quote: ''
  summary: Mills opens his introduction by explaining why the Gathas require separate
    discussion, emphasizing the difficulty of Avesta interpretation and differences
    among scholars. He summarizes the Gathas as seventeen poetical sections in ancient
    Aryan metres, assigning supreme beneficent power to Ahura Mazda while describing
    him as opposed by Aka Manah or Angra Mainyu. The passage also describes six personified
    attributes or Immortals and a theological scheme of divine unity with faithful
    creatures.
