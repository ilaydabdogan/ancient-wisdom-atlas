canonical_text:
  quote: ''
  summary: The passage denounces those associated with the Demon-gods as forsaken
    by Good Mind and estranged from the Living Lord and Righteousness. They are said
    to beguile mankind away from happy life and immortality while being ruled by the
    Evil Spirit through evil mind, word, and action. A criminal leader is accused
    of seeking destruction, while Ahura is presented as possessing true teachings
    that the speaker intends to establish within Ahura’s kingdom and Righteous Order.
