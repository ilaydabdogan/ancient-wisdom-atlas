canonical_text:
  quote: ''
  summary: The passage moves from a petition to Mazda for immortality and weal into
    a commentary on the Ahuna-vairya. Zarathustra asks Ahura Mazda which word was
    declared before the sky, waters, earth, cattle, plants, fire, human beings, Daevas,
    Khrafstra-men, and all corporeal creatures. Ahura Mazda identifies this primordial
    word as the Ahuna-vairya, assigns high ritual value to its correct recitation,
    promises to bring the reciter's soul over the Bridge of Alnvat to Heaven, and
    warns that removing portions from it causes the soul to be drawn away from the
    better world. The passage also says the saying contains Ahu and Ratu, was pronounced
    before creation, and that the more bountiful of the two Spirits declared the whole
    creation across present, emerging, and future existence.
  language: English
  quote_policy: summarized
