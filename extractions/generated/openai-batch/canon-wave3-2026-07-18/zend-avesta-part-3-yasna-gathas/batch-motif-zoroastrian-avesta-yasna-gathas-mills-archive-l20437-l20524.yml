canonical_text:
  quote: ''
  summary: A set of miscellaneous fragments gives ritual exhortations to speak Yasna
    praise and words of sacrifice, invokes Zarathustra, the Bountiful Immortals, waters,
    plants, Fravashis, Yazads, and Thraetaona, distinguishes good and evil thoughts,
    words, and deeds with Heaven and Hell as outcomes, and proclaims the Airyema-ishyo
    prayer while opposing Ahura Mazda's rule to Angra Mainyu and the Daevas beneath
    the earth.
  language: English
  quote_policy: summarized
