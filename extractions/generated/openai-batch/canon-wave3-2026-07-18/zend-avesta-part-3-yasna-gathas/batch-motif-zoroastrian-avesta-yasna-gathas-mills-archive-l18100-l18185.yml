canonical_text:
  quote: ''
  summary: The passage presents a litany of sacrifice to fire, waters, plants, trees,
    land, heaven, celestial lights, animals, human and nonhuman creatures, mountains,
    lakes, fires, truthful words, the Gathas, Weal, Deathlessness, divine lore, and
    Haptanghaiti. It asks these invoked powers for protection and preparation. Zarathustra
    is then instructed to seek a holy friend and protector and to pronounce specified
    words at the end of life; Ahura Mazda promises that doing so will keep his soul
    far from Hell.
  language: English
  quote_policy: summarized
