canonical_text:
  quote: ''
  summary: A fragmentary Gathic passage invokes peace for dwellings and hamlets, calls
    for deceivers to be charged and death chained, describes false believers and a
    tormentor turning helpers into refusers, and appeals to the righteous Lord and
    Mazda's power and Kingdom to smite opponents and grant highest blessings to the
    right-living poor. Translator notes discuss lexical and intertextual comparisons.
  language: English
  quote_policy: summarized
