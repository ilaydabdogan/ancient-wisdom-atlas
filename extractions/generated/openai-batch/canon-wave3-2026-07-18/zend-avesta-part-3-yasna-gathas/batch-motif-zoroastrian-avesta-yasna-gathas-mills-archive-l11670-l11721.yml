canonical_text:
  quote: ''
  summary: The passage links praise and confession with straight paths and the Faith
    of the Saoshyawt that Ahura will found. A master of the feast addresses Pouru^ista,
    daughter of Zarathustra, saying an unnamed man will be given to her as help, chief,
    and guardian in the service of Good Mind, Asha, and Mazda. The pair are told to
    counsel well with the mind of Armaiti and act justly. Pouru^ista answers that
    she will love and vie with him because he gained her from her father. Translator
    notes mention missing verses, an alternate reading involving the Saoshyant as
    bride's father, internal Yasna path imagery, and uncertainty about whether the
    counsel refers to the pair or consultation with deity.
  language: English
  quote_policy: summarized
