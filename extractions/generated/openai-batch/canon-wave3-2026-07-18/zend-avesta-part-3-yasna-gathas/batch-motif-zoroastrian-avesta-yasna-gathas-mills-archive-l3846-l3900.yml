  quote: |-
    the long wounding for the wicked, and
    the blessings which are in store for the righteous
  summary: The passage addresses men as learners of religious incitations given by
    Ahura in happiness and sorrow. It contrasts a long wounding for the wicked with
    blessings and salvation for the righteous. A Pahlavi note interprets the surrounding
    lines as the overthrow of the Drug and the movement of people of good repute toward
    divine figures to seize reward.
