canonical_text:
  quote: "“The Haomas are crushed, O Mazda, Khshathra, and Asha, O ye Lords!”"
  summary: 'A prelude to the chief recital of the Ahuna-vairya declares its purpose:
    to render honor to Ahura Mazda, to smite wicked hostile beings, to further divine
    and holy powers and creatures, to crush the Haomas, to invoke Sraosha’s aid with
    the sacrifice, and to offer saving acts of wisdom and worship with the sacred
    Ahuna-vairya and the two mortars.'
