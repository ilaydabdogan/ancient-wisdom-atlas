  summary: An editorial note argues for one central Zarathushtra as composer and spokesman
    of the Gathas, discusses whether some verses are rhetorically placed in Vistaspa's
    mouth, and summarizes a section in which, after a hostile chief gains the upper
    hand, Zarathushtra prays to Ahura for guidance, declares no help beyond Ahura
    and the saving Order, asks how to further the sacred herds, and answers that one
    should advance upon the enemy.
