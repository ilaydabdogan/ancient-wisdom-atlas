canonical_text:
  quote: ''
  summary: The passage comments on prayers for sacrifice, hymn, pardon, divine help,
    insight into God's nature, and dedication to God. It then translates verses describing
    a spiritual chieftain, identified with Zarathustra, who acts justly toward the
    wicked, the righteous, and a mixed-deed person, and it praises those who oppose
    wickedness or admonish others as offering to their faith in Ahura Mazda's love.
    A note discusses a possible link between equal sins and good works and a later
    doctrine of an intermediate place between Heaven and Hell.
