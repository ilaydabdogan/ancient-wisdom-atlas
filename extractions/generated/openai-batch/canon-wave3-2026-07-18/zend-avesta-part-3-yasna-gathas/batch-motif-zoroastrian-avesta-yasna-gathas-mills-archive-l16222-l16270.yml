  quote: ''
  summary: The passage offers sacrifice and worship to the soul and created body of
    the Kine, to cattle and animal souls, to the souls of righteous men and women,
    to the Bountiful Immortals, and to Ahura Mazda. It describes the saints' good
    consciences as victorious in conflict with the Daevas, praises the male and female
    Bountiful Immortals as ever living and helpful, and includes worship, bowing,
    prayer, and confession of sin before Ahura Mazda.
  language: English
