canonical_text:
  quote: ''
  summary: The passage first sums up sacrifices to waters, river fords, road meetings,
    hills, lakes, corn-fields, earth and heaven, wind made by Mazda, high Haraiti,
    the land, the Good Mind, saints' spirits, sea-beings in Vouru-kasha, Haoma, flood-streams,
    birds, Fire-priests, and the Bountiful Immortals. It then begins a prayer asking
    benefit and good for holy creation across present and future generations, describing
    sanctity as bringing prosperity, shelter, precepts, healing virtues in waters,
    cattle, and plants, protection from Daevas, gifts, blessings, and prosperity for
    the abode and creation.
  language: English
  quote_policy: summarized
