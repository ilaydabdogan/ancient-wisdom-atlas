canonical_text:
  quote: ''
  summary: A liturgical prayer asks for sanctity, Ahura's lore, the aid of the Fravashis,
    moral victories in the house, continuing glory and offspring, companionship with
    Mazda in the best world, and the sending of prayers between heaven and earth to
    displace Angra Mainyu and other hostile beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prayer asks that rewarded sanctity, the strength of the holy man, and
    Ahura's lore be present speedily.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The good, heroic, and bountiful Fravashis of the saints are invited to come
    and go hand in hand with the speakers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Fravashis' healing gifts are described with measures as wide as the earth,
    as far-spread as rivers, and as high-reaching as the sun.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The requested effects of the Fravashis include furthering better men, hindering
    hostile ones, and increasing riches and glory.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Within the house, Sraosha is asked to conquer disobedience, and other virtues
    are asked to triumph over opposing vices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Righteous Order is asked to gain victory over the Demon of the Lie.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bountiful Immortals are said to seek good Yasnas, praises, sacrifice,
    homage, and an offering of the entire self in the house for salvation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The prayer asks that brilliant glory, abundance, legitimate offspring, and
    long-continued companionship not desert the house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speakers ask that minds, souls, and bodies be glorified and that bodies
    go openly to Heaven, the best world of the saints, accompanied by Asha Vahishta.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speakers ask to see Mazda, approach him, come around him, and attain entire
    companionship with him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Liturgical prayers are to be sounded or sent forth between heaven and earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The petition is sent for encounter with and displacement of Angra Mainyu,
    his evil creatures, and the Ka/k-aredhas or Ka/^aredha figures named in the passage.
  category: action
  evidence_refs:
  - ev:7
