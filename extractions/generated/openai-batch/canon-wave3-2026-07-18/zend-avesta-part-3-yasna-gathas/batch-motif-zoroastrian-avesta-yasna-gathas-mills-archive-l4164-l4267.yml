canonical_text:
  quote: ''
  summary: The passage invokes Ahura Mazda as the one who appoints a ruler over two
    opposed bands so that the worshippers may live according to Righteousness. The
    speaker asks Ahura to disclose divine knowledge, a vow for seeing, and truths
    through Spirit, Fire, Righteousness, and Good Mind. The speaker prays for a mighty
    Kingdom by whose force the Lie-demon may be smitten, and asks to discern the better
    lot given through Righteous Order.
