canonical_text:
  quote: ''
  summary: The passage describes recognition for one who expels or destroys a heretical
    tyrant, with that prestige returned to God as an offering for further service.
    It then urges a righteous official to warn Daeva-worshippers, encourage secret
    adherents, discriminate carefully before assailing an evil chief, and warns that
    failure will lead to the bonds of a Lie-demon. The prose emphasizes an uncompromising
    dualistic moral creed. It presents sacramental Fire as an outward emblem and symbolic
    flame linked with divine aid, Good Mind, and Order. The speaker calls for a helper,
    promises not to abandon the faithful few at the dread assize, and says the wicked
    will be cursed by conscience as they try to pass the Judgment Bridge; the supplied
    passage ends mid-sentence.
  language: English
  quote_policy: summarized
