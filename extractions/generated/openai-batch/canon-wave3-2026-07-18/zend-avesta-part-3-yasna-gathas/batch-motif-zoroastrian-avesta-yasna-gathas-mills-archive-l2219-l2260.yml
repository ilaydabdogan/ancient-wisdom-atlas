canonical_text:
  quote: The Wail of the Kine. The Call of Zarathustra. His Prayer for Aid.
  summary: The passage introduces Yasna XXIX as the wail of the Soul of the Kine,
    who represents the herds and livelihood of the holy Iranian people. She laments
    her creation under affliction, asks divine powers for agricultural instruction
    and protection, and Ahura questions Asha about an appointed guardian. Asha replies
    that no chief free from injustice was available, connecting the issue to the problem
    of evil and destiny.
  language: English
  quote_policy: quoted
