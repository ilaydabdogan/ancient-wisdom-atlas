  quote: ''
  summary: A liturgical speaker repeatedly desires to approach divine beings, ritual
    times, festivals, celestial bodies, fire, waters, plants, a sacred mountain, glory,
    blessing and curse, places, creatures, and the meat-offering through praise and
    Yashts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he desires to approach named lords of the ritual order and
    Mithra with praise or a Yasht.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mithra is described as having wide pastures, a thousand ears, and myriad eyes,
    and as a Yazad of the spoken name.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ahura Mazda's Fire, a lofty Ahura Napaz'-apam, and Mazda-made waters are included
    among those approached with praise.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Fravashis of the saints, women who have many sons, year-long prosperity,
    Might, and victorious ascendency are invoked.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sraosha is described as smiting with a victorious blow and making settlements
    advance; Rashnu is called most just; Arstat furthers settlements.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Monthly festivals, moon phases, yearly festivals, seasons, and thirty-three
    lords are listed as ritual powers or times to be approached.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ahura and Mithra are named as a lofty and imperishable pair; stars, Tishtrya,
    the moon, the sun, Ahura Mazda, and Fravashis are also invoked.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Fire is addressed as Ahura Mazda's son; all fires, all Mazda-made waters,
    and all Mazda-made plants are approached with a Yasht.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Mathra Spenta is described as holy, effective, Zarathushtrian, and a law
    composed against the Daevas; the Religion is said to have a long descent and to
    have been given by Mazda.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mount Ushi-darena and the Kingly Glory are described as Mazda-made; the mountain
    is glorious with sanctity and abundant in brilliance.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: A pious blessing, a swift curse, places, regions, pastures, abodes, water-springs,
    waters, lands, plants, earth, heaven, wind, celestial bodies, and holy male and
    female creatures are invoked.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The speaker desires to approach the meat-offering, Haurvatat, Ameretat, and
    sacred flesh for the propitiation of Sraosha, whose body is the Mathra.
  category: action
  evidence_refs:
  - ev:11
