  summary: Translator’s commentary identifies saving Saoshyants and named religious
    leaders as human combatants against a demonic opponent. The translated verses
    present a saint or champion of Ahura’s holy order smiting the Demon-of-the-Lie
    or evil heretic, ask Ahura about coming conflicts and the good consummation of
    life, and describe divine teaching through holy order, secret sayings, and the
    Good Mind.
