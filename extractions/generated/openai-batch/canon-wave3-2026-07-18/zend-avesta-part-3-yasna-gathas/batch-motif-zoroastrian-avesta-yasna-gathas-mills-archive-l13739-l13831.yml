  summary: Haoma answers that Pourushaspa’s preparation of Haoma brought the blessing
    of Zarathustra’s birth. Zarathustra is described as reciting the Ahuna-vairya,
    defeating demon-gods, praising Haoma, claiming inspiration, strength, victory,
    healing, understanding, and power over enemies, and requesting heaven, bodily
    health, and long life.
