  quote: ''
  summary: The passage is commentary on Yasna XLIII. It describes praise of Ahura
    as giver of grace, the holy Fire, the Good Mind strengthening the seer, a poetic
    vision of Ahura as sovereign over two spirits at the world's birth, rewards and
    punishments reaching to the last turning of creation, a petition for Ahura's final
    coming and the Sacred Kingdom, and Sraosha or Obedience questioning Zarathustra
    about his call, principles, and first inquiry into the holy Fire and its offering.
