canonical_text:
  quote: ''
  summary: A first-person ritual speaker repeatedly offers material offerings, drink
    offerings, ritual implements, and spoken recitations for the propitiation or contentment
    of named Fravashis, Fire, Mazda-made waters, Bountiful Immortals, Yazads, ritual
    time-lords, lunar phases, and yearly festivals.
  language: English
  quote_policy: summarized
