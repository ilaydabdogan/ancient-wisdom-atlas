  - ev:7
- id: obs:2
  text: Haoma and Haoma-juice are offered for the Fravashi of Zarathuitra Spitama,
    and wood-billets with perfume are offered for the Fire, called Ahura Mazda's son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Haomas, Haoma-water, fresh milk, and the Hadhanaepata plant are offered for
    the good waters described as Mazda-made.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Baresman with its Zaothra and binding is offered with sanctity and order
    for the Bountiful Immortals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker offers by voice well-thought thoughts, well-spoken words, well-done
    deeds, Gathas, Mathras, Lordship, Sanctity, ritual mastership, and a timely prayer
    for blessings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The spoken and ritual offerings are directed toward the holy Yazads and toward
    the contentment of the individual soul.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Recipients named in the daily or ritual-order sequence include Asnya, Havani,
    Savanghi, Visya, Mithra, Raman //z^astra, Rapithwina, Asha Vahiita, Ahura Mazda's
    Fire, Uzayeirina, Ahura Napa/-apam, and the Mazda-created waters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A later offering sequence names Aiwisruthrima, Frada/-vispam-hu^yaiti, Zarathustrotema,
    the Fravashis of the saints, women who have many sons, Prosperous home-life, Force,
    the Blow, and Victorious Ascendency.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sraosha is described as smiting with the blow of victory and advancing settlements;
    Rashnu is called most just; Arcta/ is said to further and increase settlements.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Offerings are also made to the Mahya, to new, waning, and full moon phases,
    and to yearly festivals including Maidhyo-zaremaya, Maidhyo-shema, PaitLmahya,
    and Ayathrima.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
