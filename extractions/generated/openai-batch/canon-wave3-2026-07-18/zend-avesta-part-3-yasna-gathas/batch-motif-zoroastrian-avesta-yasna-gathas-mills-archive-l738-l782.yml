canonical_text:
  quote: ''
  summary: The passage summarizes a theological system in which Sraosha, the Kine's
    soul, and Fire are described as personified or emblematic figures; the good God
    is opposed by the Evil Mind or Angry Spirit, served by Aeshma and associated with
    deceit and Daevas; and two original spirits produce good and evil, whose principles
    lead to future rewards and punishments while mutually limiting one another.
