canonical_text:
  quote: ''
  summary: A fragment invokes Khshathra so that a deadly sinful adversary may die
    away and destruction come upon it. A following fragment praises the Ahuna-vairya
    and related prayers as Mazda's chosen words, victorious and healing when pronounced.
    The passage also describes a hymn effective against the words of Aeshma, asks
    that a worshipper present it with an offering, and closes with the Kingdom belonging
    to Ahura and granting nurture to the poor.
