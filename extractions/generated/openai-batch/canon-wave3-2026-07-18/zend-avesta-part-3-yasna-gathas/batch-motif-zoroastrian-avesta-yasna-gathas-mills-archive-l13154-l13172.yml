  quote: ''
  summary: A priest presents complete and sacred offerings, including a meat-offering
    and the flesh of the Kine, with Haurvata, Ameretata, Ahura Mazda, the Bountiful
    Immortals, and Sraosha named in relation to propitiation. Haurvata is associated
    with guarding water, Ameretata with guarding plants and wood, and Sraosha is described
    as victorious and advancing settlements.
