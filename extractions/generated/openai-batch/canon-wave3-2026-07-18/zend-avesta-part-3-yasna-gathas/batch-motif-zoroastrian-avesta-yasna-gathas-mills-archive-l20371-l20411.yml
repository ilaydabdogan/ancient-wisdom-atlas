  summary: A Gah Ushahin liturgical passage opens with propitiation to Ahura Mazda
    and a first-person confession as a Mazda-worshipper opposed to the Daevas. It
    invokes sacrifice, homage, propitiation, and praise for Ushahina, Bere^ya, Nmanya,
    Sraosha, dawn and morning lights, Ahura Mazda, Good Mind, Asha Vahiita, Khshathra-vairya,
    and Aramaiti. Dawn and morning are described as radiant, horse-associated, and
    illuminating the house and the sevenfold earth.
