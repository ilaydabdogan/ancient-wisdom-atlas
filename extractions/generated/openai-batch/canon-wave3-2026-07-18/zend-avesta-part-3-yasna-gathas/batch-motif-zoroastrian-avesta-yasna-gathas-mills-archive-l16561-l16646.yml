canonical_text:
  quote: ''
  summary: The passage praises Mazda as protector of settlements, religious order,
    salvation-bringing communities, and all holy creation; asks Asha to bless holy
    petitioners according to good thoughts, words, and deeds; worships Righteousness,
    Good Mind, the Gathas, and the Praises of the Yasna; and invokes Sraosha to be
    present for the worship of Ahura Mazda, good waters, Fravashis and souls of saints,
    Immortals, and Sanctity or Blessedness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mazda is described as most beneficent, as victorious when He smites, and as
    helping settlements advance for protection, guarding of religious order, salvation,
    and protection of the entire holy creation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Asha is addressed as abiding within the Gathas and is asked to give blessing
    to every holy man who comes with the prayer and strives to help himself according
    to good thoughts, words, and deeds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speakers say they worship divine Righteousness, the Good Mind, and the
    bountiful Gathas, which are described as leading chants within the holy ritual
    order.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Praises of the Yasna are described as originating in the ancient world
