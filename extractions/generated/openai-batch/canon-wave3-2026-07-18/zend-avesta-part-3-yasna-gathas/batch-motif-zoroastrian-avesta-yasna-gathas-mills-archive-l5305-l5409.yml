canonical_text:
  quote: ''
  summary: The speaker describes hostile wicked men who threaten his life, seize inherited
    goods, and wound his folk. Ahura/God is said to rebuke their doctrines and declare
    evil those who have slain the Kine's life, prefer Græhmas and Karpans above Righteousness,
    and desire the Demon of lies. Græhma is linked with an evil kingdom, the abode
    of Hell or Worst Mind, estrangement from the sight of truth, and the establishment
    of Kavis and their scheming against Ahura.
  language: English
  quote_policy: summarized
