  summary: The passage introduces Yasna XXXI as concerning the progress and struggles
    of the cause. It frames the section as a hymn chanted by a sage before a multitude,
    describes opposing responses to recited truths, and summarizes an appeal to Ahura
    Mazda’s prepared spiritual regulation in response to the lament of the soul of
    the Kine. The regulation is said to concern the struggle of two parties and the
    success of the Righteous Order.
