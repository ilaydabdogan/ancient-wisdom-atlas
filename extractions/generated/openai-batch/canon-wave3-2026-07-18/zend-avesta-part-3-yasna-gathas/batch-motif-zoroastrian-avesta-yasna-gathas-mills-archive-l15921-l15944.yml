canonical_text:
  quote: ''
  summary: The passage says that holy action and correctly uttered words may be saving
    in wise significance. It calls the Ahu excellent and the Ratu a sanctified ruler
    who creates mental goodness and life-actions for Mazda. It attributes kingdom
    and riches to Ahura/Mazda, connects that kingdom with nurturing the poor, declares
    Mazda beyond Daevas and accursed mortals, and concludes with worship of the Ahuna-vairya
    and Asha Vahishta, the Bountiful Immortal.
