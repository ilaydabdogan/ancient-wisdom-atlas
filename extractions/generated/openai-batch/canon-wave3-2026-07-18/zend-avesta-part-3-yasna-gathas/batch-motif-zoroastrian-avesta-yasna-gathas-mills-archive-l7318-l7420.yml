canonical_text:
  quote: ''
  summary: In Yasna XLIII.11-14, the speaker addresses Ahura Mazda as bountiful, recalls
    a messenger approaching with Good Mind, asks not to be sent forth before Sraosha/Obedience
    comes hand in hand, asks for long life to make known sacred aims to men, and refers
    to a desired place within Ahura Mazda's Realm. The translator's note compares
    Sraosha's guiding function with later Parsi tradition.
  language: English
  quote_policy: summarized
