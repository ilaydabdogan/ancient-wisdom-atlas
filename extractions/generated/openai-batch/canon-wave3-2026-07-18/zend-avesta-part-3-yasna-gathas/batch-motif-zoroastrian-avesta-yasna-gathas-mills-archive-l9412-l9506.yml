canonical_text:
  quote: ''
  summary: The passage introduces the Gatha Spewta Mainyu and Yasna XLVII, titled
    around the bountifulness of Ahura. The commentary distinguishes Spewta mainyu
    from Ahura while identifying it as Ahura's spirit, discusses the grouping of divine
    personified attributes, and describes Ahura bestowing happiness and immortality
    through divine mediating powers. It also presents a prayer for Ahura's scheme
    to be enacted through piety and priestly speech, states that Ahura creates and
    provides for the symbolic Kine, and says the wicked are afflicted for sins.
  language: English
  quote_policy: summarized
