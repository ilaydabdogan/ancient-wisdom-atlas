canonical_text:
  quote: ''
  summary: A first-person liturgical confession declares Mazdayasnian identity in
    the order of Zarathustra, praises good thoughts, words, and deeds, rejects evil
    thoughts, words, and deeds, offers sacrifice and even the speaker's body to the
    Bountiful Immortals, drives away the Daevas, attributes all good things to Ahura
    Mazda, chooses Piety, and rejects violence, drought, wandering, and wasting that
    harm the sacred Kine and Mazdayasnian villages.
  language: English
  quote_policy: summarized
