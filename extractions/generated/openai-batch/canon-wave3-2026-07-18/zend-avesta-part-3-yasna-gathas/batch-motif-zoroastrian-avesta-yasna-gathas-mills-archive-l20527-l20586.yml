canonical_text:
  quote: ''
  summary: 'The passage includes a brief statement that foes should disappear, the
    dead should arise, and bodily life should be sustained in lifeless bodies. It
    then gives liturgical fragments: a sacrifice to Ahura Mazda, the Bountiful Immortals,
    victory-related powers, Zarenumawt, the Glowing Mountain, and all Yazads; a propitiation
    of the body and soul of the Kine or cows in connection with milking and water
    for washing the udder; and a water-offering addressed to good waters, Apam-napat,
    and the Ahurian water created by Mazda, with praise, offerings, pouring out, and
    Gatha recitation.'
  language: English
  quote_policy: summarized
