canonical_text:
  quote: ''
  summary: The passage describes the Daevas as evil and bereft of good, then has the
    speaker abjure them, their followers, and their shelter and headship. It recalls
    Ahura Mazda and Zarathustra conversing in questions and consultations, presents
    Zarathustra as having abjured the Daevas, and has the speaker imitate that abjuration
    as a Mazda-worshipper. The speaker claims belonging to a religious sanctity associated
    with waters, plants, the Kine, Ahura Mazda, Zarathustra’s creed, named adherents,
    and future Saoshyants, then confesses Mazda-worship and praises good thought,
    good word, good deed, and the Faith of Mazda. The next section begins an invocation
    to Ahura Mazda and a chief among guardian beings.
  language: English
  quote_policy: summarized
