canonical_text:
  quote: ''
  summary: A Yasna liturgical passage lists sanctified ritual substances, libations,
    implements, recitations, prayers, wood and perfume, then states their use in propitiation
    of Ahura Mazda, Fire, other divine or holy beings, sacred knowledge, the Mazdayasnian
    Religion, Mount Ushi-darena, Yazads, and Fravashis.
  language: English
  quote_policy: summarized
