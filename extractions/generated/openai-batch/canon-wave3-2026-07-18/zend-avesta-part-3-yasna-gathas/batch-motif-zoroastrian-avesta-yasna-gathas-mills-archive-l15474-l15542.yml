  text: Zaothras for the beneficial waters are described as having Haoma, milk, and
    Hadhanaepata with them, and Haoma-water is also approached with praise.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage names two mortars, one stone and one iron, and a branch for the
    Baresman among the ritual objects approached with praise.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ritual sequence includes memorised recital, fulfilment of the Mazdayasnian
    law, heard recital of the Gathas, and persistent prayer for blessings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wood and perfume are addressed in relation to Fire, who is called Ahura Mazda's
    son.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Good Mazda-made objects are named as being for the propitiation of Ahura Mazda,
    the Bountiful Immortals, Mithra, Raman, the sun, and Vayu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Vayu is described as working on high and set over other beings in the creation,
    with a Pazand note relating Vayu's influence to Spenta Mainyu.
  category: attribute
  evidence_refs:
  - ev:4
