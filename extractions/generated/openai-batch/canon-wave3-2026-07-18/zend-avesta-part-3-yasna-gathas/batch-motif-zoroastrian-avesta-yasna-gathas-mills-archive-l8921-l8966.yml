  summary: A first-person speaker addresses Mazda as Lord and Great Giver amid reduced
    flocks, a small following, and pressure from provincial tyrants. The speaker asks
    how to establish the Faith and gain divine grace, cries for help like that given
    between friends, asks to be taught the wealth of the Good Mind, and asks when
    the day's enlighteners will come to hold the world's Righteous Order upright.
