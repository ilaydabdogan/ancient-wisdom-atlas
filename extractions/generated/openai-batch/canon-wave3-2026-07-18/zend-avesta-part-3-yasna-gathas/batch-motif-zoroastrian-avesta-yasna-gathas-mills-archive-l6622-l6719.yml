canonical_text:
  quote: ''
  summary: A speaker asks Ahura/Mazda to teach the paths through Righteousness and
    the Good Mind. The path is described as shaped by religious precepts and laws
    of the Saviours, bringing thriving and reward for the good. The passage also links
    bodily life, deeds of Good Mind, work in the toil of the mother Kine, merciful
    care, best words and actions, confessing prayer, and progressive life through
    divine power and grace.
