canonical_text:
  quote: ''
  summary: The passage prays to Mazda for grace and describes pious people gaining
    a kingdom governed by Good Mind. It says the prayer is already heard, names Kavi
    Vistaspa in connection with established Sovereign Power, religious wisdom, and
    the laws of Ahura the Maker, and asks the Bountiful Immortals to grant blessedness,
    strengthen Holy Order through Good Mind, reveal Piety's words, receive sacrifice
    with homage, and seek Ahura Mazda's grace. The final fragment praises Kavi Vistaspa
    as bounteous and understanding.
  language: English
  quote_policy: summarized
