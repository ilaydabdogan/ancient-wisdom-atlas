canonical_text:
  quote: ''
  summary: The passage is an English commentary and synopsis for Yasna XXX, presenting
    a doctrine of dualism. A composer or speaker addresses gathered hearers, declares
    divine counsels about good and evil, urges each person to choose religion individually
    while attending to the holy Fire, describes two original spirits or principles
    that generate opposed conditions such as life and non-life, Heaven and Hell, and
    recounts the evil choice of Daeva-worshippers under the influence of the Worst
    Mind.
  language: English
  quote_policy: summarized
