canonical_text:
  quote: ''
  summary: The passage addresses the Lord/Mazda, asking for the joyful meadows of
    Aramaiti's peace because counsel has been taken with Good Mind. It says Mazda's
    bounteous spirit gives rewards and blessings to the good, while the wicked are
    harmed and the saints are not. It contrasts a feeble man who can give in obligation
    to Mazda's saint with a wealthy ruling evil man who serves the wicked. Translator
    notes connect Aramaiti/Piety with earth, meadows, husbandry, the Kine, pastures,
    sacred agriculture, and related passages.
  language: English
  quote_policy: summarized
