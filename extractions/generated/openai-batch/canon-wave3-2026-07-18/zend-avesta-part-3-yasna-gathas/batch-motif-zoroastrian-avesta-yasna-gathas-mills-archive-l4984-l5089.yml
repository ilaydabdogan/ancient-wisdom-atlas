canonical_text:
  quote: "“But you, O ye Daevas! are all a seed from the Evil Mind.”"
  summary: The passage contrasts Daeva-party prayer and worship with the speaker’s
    friendship with Ahura Mazda. Ahura Mazda answers through Good Mind, Sovereign
    Power, and Righteousness, accepting and choosing bountiful Piety. The Daevas are
    denounced as deriving from Evil Mind, associated with the Lie-demon, sacrifice,
    deceit across the sevenfold earth, and confusion of human thoughts.
  language: English
  quote_policy: quoted
