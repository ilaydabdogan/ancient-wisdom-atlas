canonical_text:
  quote: ''
  summary: The passage worships Heaven as the best world of the saints; worships the
    milk-offering and libation as a pair that makes waters flow, plants flourish,
    and opposes demonic or unholy forces; worships waters, plants, good people, and
    Yazads; and addresses the earth/dwelling-place, Aramaiti, and Ahura Mazda, asking
    that helpful preserving influences abide in the worshipper's abode through summer
    and winter.
  language: English
  quote_policy: summarized
