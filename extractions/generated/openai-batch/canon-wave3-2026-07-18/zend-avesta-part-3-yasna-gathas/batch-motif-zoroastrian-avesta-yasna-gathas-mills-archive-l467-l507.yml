canonical_text:
  quote: ''
  summary: 'The preface explains the editor''s textual basis and method: Westergaard''s
    texts are followed for extent because Geldner''s text was not complete; repeated
    formulas and prayers are generally not translated; Pahlavi, Sanskrit, Neryosangh,
    and Persian renderings are cited as interpretive witnesses, but with stated reserve.
    The author argues that such renderings and commentaries should be studied in difficult
    cases for traces of earlier explanation, not treated as exact reproductions or
    simple earliest tradition.'
  language: English
  quote_policy: summarized
