canonical_text:
  quote: ''
  summary: The passage describes Zarathustra in affliction and discouragement, driven
    from his country, poor in means and troops, and seeking to satisfy Ahura/Mazda.
    It attributes obstruction of the bearers of Holy Order to an accursed enemy, links
    Zarathustra's cry to Ahura with the Kine's cry, asks for divine teaching about
    saving thoughts and Saviours, and ends with a call for a chief to expel a world-destroyer
    and receive recognition among the faithful.
  language: English
