canonical_text:
  quote: ''
  summary: The speaker says that works of ritual and truth shine through Good Mind
    and compares them with the stars, suns, and Aurora, which bring the light of days
    and, through Righteous Order, praise the Great Giver and Lord. The speaker asks
    to be named a praiser, requests help from the maker of the world through Good
    Mind, and asks that what is most promotive through veritable grace be done. Editorial
    notes discuss translation choices and identify the following Gatha as Vohukhshathra,
    consisting of Yasna LI.
