canonical_text:
  quote: A blessing is Righteousness (called) the best
  summary: The passage presents Yasna XX as a Zand or commentary on the Ashem Vohu.
    It states that Righteousness is the best blessing, that weal comes to the man
    when Right helps Righteousness and the pious man serves it in truth, and that
    Ahura Mazda spoke the formula beginning “Ashem vohu.” It also identifies Asha
    as holy ritual sanctity.
