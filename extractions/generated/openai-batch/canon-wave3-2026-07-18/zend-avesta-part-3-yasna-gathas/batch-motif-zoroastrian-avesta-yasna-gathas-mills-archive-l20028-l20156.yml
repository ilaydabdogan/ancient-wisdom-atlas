- id: obs:5
  text: The litany sacrifices to Ahura Mazda, Zarathustra, the Fravashi of Zarathustra,
    the Bounteous Immortals, and the Fravashis of the saints, including those of the
    living, the dead, the bodily, and those in heaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The litany sacrifices to Havani, Universal Weal, Deathlessness, the question
    and lore of the holy lord of the ritual, the Yasna Haptanghaiti, Savanghi, Visya,
    and Airyema-ishyo in connection with the effective invocation of the Mathra and
    the five Gathas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The litany sacrifices to Fire addressed as Ahura Mazda's son, to the Baresman
