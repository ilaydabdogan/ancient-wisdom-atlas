canonical_text:
  quote: The Gahs are the five divisions of the day.
  summary: The passage defines the five Gahs as divisions of the day with prayers
    to be recited at those times. It gives the Havani prayer, a liturgical confession
    and repeated offerings of sacrifice, homage, propitiation, and praise to Ahura
    Mazda, Zarathustra, time-lords, Mithra, Fire, Fravashis, sacred prayers, ritual
    objects, and other named beings. It then begins the Rapithwina prayer with similar
    propitiatory formulas.
  language: English
  quote_policy: quoted
