canonical_text:
  quote: ''
  summary: The speaker prays that the worshippers not anger Ahura Mazda, Righteousness,
    or the Kindly/Good Mind while offering praise. The speaker asks Ahura Mazda, called
    Lord and Great Creator, to satisfy desire through attainments of the Good Mind
    derived from Righteousness, affirms divine instructions as effective for daily
    food, pledges to protect Righteousness and the Good Mind, and asks to be taught
    from Ahura Mazda’s own spiritual mouth how the primeval world arose.
  language: English
