canonical_text:
  quote: ''
  summary: The passage describes Zarathustra's system as a development rather than
    a repudiation of predecessors. It says the old Aryan gods retire before spiritual
    Ahura, while Benevolence, Order, Power, Piety, Weal, and Immortality dominate
    the system. It highlights an ambiguous personification of divine attributes, especially
    Vohu Manah, Asha, and Khshathra, which are treated both as meaningful words and
    as beings prayed to like gods or angels.
