canonical_text:
  quote: ''
  summary: 'The passage introduces Afrinagan blessings as ritual blessings over a
    consecrated meal for an invited angel or deceased spirit, performed at fixed seasonal
    times. It then gives an Afrinagan Gahanbar confession and ritual instructions:
    worshippers honor ritual time-lords and Righteousness, present Myazda offerings
    with flesh and milk or substitutes, and, if unable, make a mental offering to
    Ahura Mazda and Righteousness. Failure to provide specified Myazda offerings results
    in expulsion by the Ratu from the Mazda-worshippers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Afrinagan blessings are described as being recited over a meal of wine, milk,
    and fruits prepared in honor of an invited angel or deceased spirit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The consecration of the meal is said to be performed only by a priest, after
    which those present eat the meal.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Afrinagan performances are required at fixed times of the year, including
    the six Gahanbars, the five Gatha-days, and a named day in the first month.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Afrinagan Rapithwin is associated with the spirit presiding over the southern
    quarter, described as guardian of the way to paradise for a soul seeking to pass
    after death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ritual speaker confesses as a Mazda-worshipper of Zarathustra's order,
    a foe of the Daevas, and devoted to the lore of the Lord.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The ritual names Havani, Savanghi, Visya, Asnya day-lords, Mahya month-lords,
    Yairya year-lords, seasonal lords, and Ritual Righteousness as recipients of sacrifice,
    homage, propitiation, praise, or worship.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Those present are instructed to offer ritual service and present the Myazda
    of the named seasonal observance, with sound flesh from a choice beast and a full
    flow of milk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If worshippers cannot provide the offering, the passage permits a substitute
    liquor; if that is not possible, it directs the bringing of dry, well-cut wood
    to the Ratu's house or dwelling.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: If material offerings are not possible, the worshipper is directed to ascribe
    Sovereign Power to Ahura Mazda and Righteousness and complete the sacrifice through
    the well-timed prayer.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: A man who does not give the first or second Myazda may be expelled by the
    Ratu from among the Mazda-worshippers.
  category: action
  evidence_refs:
  - ev:11
