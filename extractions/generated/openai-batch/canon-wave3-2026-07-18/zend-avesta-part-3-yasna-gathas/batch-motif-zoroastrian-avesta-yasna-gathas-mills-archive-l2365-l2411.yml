  summary: The Soul of the Kine cries to Ahura and Asha, asking about its creation
    and complaining of assault by wrath, violent power, desolation, insolence, and
    thievish might. It says it has no other pasture-giver than the addressed powers
    and asks to be taught good tillage for the fields. The excerpt then marks Ahura
    as speaking and begins a reference to the Creator of the Kine.
