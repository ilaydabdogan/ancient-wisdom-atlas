canonical_text:
  quote: Save us, O Ye Bountiful Immortals!
  summary: A liturgical passage in which worshippers entrust settlements and persons
    to worship for protection, praise Ahura Mazda, invoke the Bountiful Immortals,
    describe the righteous herd-owner as guardian and father of the Kine, offer thoughts,
    words, actions, herds, and men to the Bountiful Spirit, ask the creative stars
    and the Fire of Ahura Mazda for blessing, and sacrifice to the Praises of the
    Yasna while honoring Ahura Mazda's celestial body.
  language: English
  quote_policy: quoted
