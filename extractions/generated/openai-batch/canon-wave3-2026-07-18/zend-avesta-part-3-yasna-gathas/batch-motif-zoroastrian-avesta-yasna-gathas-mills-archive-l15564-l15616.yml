canonical_text:
  quote: ''
  summary: 'The passage describes a ritual speaker approaching and praising Fravashis
    and holy beings: those of Ahura Mazda, the Bountiful Immortals, heavenly Yazads,
    named ancient figures, saints, kin, the speaker''s own soul, ritual lords, and
    good Yazads. It also mentions heaven, water, land, and cattle in relation to safely
    enclosed wombs and prevention of miscarriage.'
  language: English
  quote_policy: summarized
