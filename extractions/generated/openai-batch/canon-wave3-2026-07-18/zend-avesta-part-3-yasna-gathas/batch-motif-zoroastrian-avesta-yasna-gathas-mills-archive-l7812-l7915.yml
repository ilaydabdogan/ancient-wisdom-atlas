canonical_text:
  quote: ''
  summary: In Yasna XLIV.3-7, the speaker repeatedly asks Ahura to tell him aright
    who fathers Righteous Order, orders sun, stars, and moon, sustains earth and clouds,
    makes waters and plants, links wind and storm-clouds, inspires good thoughts,
    makes lights and darkness, sleep and waking, and establishes time divisions. The
    passage also asks about Piety, Good Mind, the Realm, true saints, the Mother-kine,
    Aramaiti with Sovereign Power, and the making of filial reverence.
  language: English
  quote_policy: summarized
