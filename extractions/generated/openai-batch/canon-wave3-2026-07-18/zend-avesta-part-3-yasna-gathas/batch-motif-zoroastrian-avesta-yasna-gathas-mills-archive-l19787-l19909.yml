canonical_text:
  quote: ''
  summary: The passage gives instructions about failure to provide specified Myazda
    offerings to a Ratu, including expulsion from the Mazdayasnian community and expiating
    deeds. It then presents blessings for royal province-chiefs or a province-governor,
    asking for strength, victory, long rule, health, conquest of evil and Daeva-worshipping
    foes, and Heaven. It blesses sacrifice and homage connected with day, month, year,
    season, and ritual lords, and begins an Afrinagan Gatha with an Ahuna-style formula
    and Mazda-worshipper confession.
  language: English
  quote_policy: summarized
