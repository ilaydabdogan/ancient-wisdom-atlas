canonical_text:
  quote: ''
  summary: A liturgical passage names recipients of sacrifice, homage, propitiation,
    and praise; the priest declares the Avesta and ritual prescripts as directed by
    Ahura Mazda and Zarathustra; offered Haomas, sacred utterance, mortars, Baresmans,
    correct speech, and correct ceremonies are associated with abundance, religious
    wisdom, sanctification, and the aspiration to belong to Spenta Mainyu's world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacrifice, homage, propitiation, and praise are directed to Nairya-sangha,
    victorious Peace, Ahura Mazda's Fire, the lofty lord, and the entire creation
    of the holy and clean.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person priestly speaker says he makes known the offering and the
    Avesta as Ahura Mazda directed, as Zarathustra directed, and as he himself is
    letting it be known.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The priest says he understands the lawful Avesta and ritual prescripts for
    sacrifice, homage, and propitiation addressed to the Bountiful Immortals, and
    links the rite to blessings, victory, sanctification, and well-being of souls.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The celebrants make these things known in their celebrations and offer them
    to Ahura Mazda, described as greatest, master, and Lord.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Offered Haomas poured in libation to Ahura Mazda and holy Zarathustra Spitama
    are said to produce abundance in cattle and in men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Good Sraosha is described as accompanying the worshippers with the great splendour
    of sanctity and as being asked to aid the worship.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wise offerings of the Ahuna-vairya are offered, and two mortars are described
    as pouring out the Haomas and being advanced with precision.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Religious wisdom is said to be contained in correctly spoken words, Zarathustrian
    utterances, correctly practiced ceremonies, exactly spread Baresmans, correctly
    pressed Haomas, praise, Yasnas, doctrines, recitations, and movements.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The wise ritual deeds are described as delivered by Ahura Mazda, nourished
    from Vohu Manah, grown from the Righteous Order, and connected with the wish to
    be among those of Spenta Mainyu's world.
  category: relationship
  evidence_refs:
  - ev:9
