  quote: ''
  summary: The passage introduces the five Gathas as the oldest part of the Yasna,
    attributed to Zarathiutra/Zarathuitra and immediate followers. It characterizes
    Zarathuitra in these texts as a struggling, suffering, human prophet or divinely
    appointed instructor, and describes the Gathas as serious, historically toned
    writings of an earnest religious reform movement in which most myths and nearly
    all old Aryan gods are absent.
