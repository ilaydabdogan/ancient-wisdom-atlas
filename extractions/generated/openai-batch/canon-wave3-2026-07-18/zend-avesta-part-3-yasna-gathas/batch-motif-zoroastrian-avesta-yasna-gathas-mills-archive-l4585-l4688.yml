canonical_text:
  quote: ''
  summary: A speaker addresses Ahura Mazda with questions about a wise person who
    promotes holy Rule in truth and may become like the Great Creator. The speaker
    asks which religion is greater, that of the righteous or of the wicked, urges
    that the enlightened speak to the enlightened, asks Ahura Mazda to declare the
    truth through Good Mind, and warns an assembled audience not to heed the words
    or commands of a sinner who would bring social spaces to ruin and death.
  language: English
