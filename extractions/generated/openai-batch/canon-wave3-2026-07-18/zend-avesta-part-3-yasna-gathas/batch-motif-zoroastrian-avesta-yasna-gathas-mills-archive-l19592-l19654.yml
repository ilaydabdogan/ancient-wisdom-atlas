canonical_text:
  quote: ''
  summary: The passage seeks to utter supplications for the Kine, contrasts a saint
    who knows a good and fruitful chant with a sinner who does not know it, and prays
    that the sinner not outstrip the speakers in thought, word, ceremony, or offering.
    It then worships Ahura Mazda, the Amesha Spewta, and Asha Vahirta, sacrifices
    to the best prayers and the best wish of Asha Vahista, worships Heaven as the
    bright world of the saints, and sacrifices to the approach to it and to rewards
    such as health, healing, increase, and victory through memorized recitation of
    good thoughts, words, and deeds.
  language: English
  quote_policy: summarized
