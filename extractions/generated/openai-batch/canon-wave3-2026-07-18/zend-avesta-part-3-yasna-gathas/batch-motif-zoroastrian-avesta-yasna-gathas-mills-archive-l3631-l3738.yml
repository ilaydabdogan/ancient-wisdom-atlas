canonical_text:
  quote: ''
  summary: The passage contrasts two spirits and describes a failure of the Demon-gods
    to choose righteously. The Worst Mind approaches their council to be chosen, after
    which they rush to the Demon of Fury to injure or pollute mortal life. Aramaiti
    then approaches with Sovereign Power, Good Mind, and Righteous Order, and gives
    a body to the spiritual creations of good and evil. The passage also mentions
    Ahura, actions performed in accordance with the faith, and a divine figure clothed
    with the firm stones of heaven.
  language: English
  quote_policy: summarized
