canonical_text:
  quote: ''
  summary: The passage summarizes Zarathustrianism in the Gathic period as a movement
    marked by ongoing conflict, an effort by Zarathustra and his companions to establish
    a divinely ordered kingdom that relieves suffering and protects the poor, and
    a restricted but present ritual hierarchy centered on sacramental fire. It also
    contrasts the more human portrayal of Zarathustra in the Gathic setting with later
    mythic attributes in the Yajts.
