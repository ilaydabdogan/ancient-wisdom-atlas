  quote: ''
  summary: The passage asks that toil be given and that a feminine figure prosper
    for life. She grants pleasing homes and lasting strength in connection with the
    Good Mind’s prayer, while Mazda/Ahura causes plants to flourish for her nurture
    in primeval life. The following verse calls for her mortal foes to be slain, the
    Wrath-demon of rapine cast down, and envy smitten by those who abide by Good Mind
    and holy Order and hold fast a refuge and sacred bond.
