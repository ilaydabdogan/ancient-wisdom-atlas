canonical_text:
  quote: these shall be borne ... to the home of (Thy) Good Mind (in Heaven)
  summary: The passage condemns deceitful deeds that aid the wicked, mentions the
    Kine, and speaks of a death-removing help and saving flame. The speaker vows to
    drive away the disciples of the Karpans and Kavis. Righteous or saintly figures
    are then described as being borne by the two to the home of Good Mind in Heaven.
    The next verse describes the reward of the righteous as coming from the Best One
    who teaches in the wide mental light of the pious, while Mazda Ahura is addressed
    as supreme.
  language: English
  quote_policy: quoted
