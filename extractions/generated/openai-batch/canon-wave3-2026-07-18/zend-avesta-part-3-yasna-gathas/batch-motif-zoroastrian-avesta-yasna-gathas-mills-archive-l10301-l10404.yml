  quote: ''
  summary: The passage presents a first-person speaker troubled by an evil judge estranged
    from Righteous Order. The speaker contrasts the judge and wicked allies with Mazda,
    Righteousness, Good Mind, Piety, Faith, and the Lord's Realm; prays for Good Mind's
    sheltering leadership; abjures wicked allies; describes supporters of Daevas;
    praises the one who guards Faith; and beseeches Mazda and Righteousness to disclose
    divine intention.
  language: English
  quote_policy: summarized
