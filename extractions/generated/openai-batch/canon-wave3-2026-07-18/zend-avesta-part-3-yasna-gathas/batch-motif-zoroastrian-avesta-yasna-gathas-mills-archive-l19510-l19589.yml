canonical_text:
  quote: ''
  summary: The passage gives liturgical formulas of sacrifice, worship, Yasna, homage,
    praise, and chant. It names Vohu-khshathra or Khshathra-vairya, correctly spoken
    sacrificial words, rewards and healing gained through the recital of good thoughts,
    words, and deeds, and homage to waters, fruit-trees, Fravashis, the Kine, Gaya
    Maretan, Mathra Spenta, Ahura Mazda, Zarathustra, Apam-napat, the Bountiful Immortals,
    and the holy Saoshyants. It also contrasts good thoughts, words, and deeds with
    evil, treacherous, false, and unfair ones.
  language: English
  quote_policy: summarized
