  quote: ''
  summary: A preface passage in which the translator discusses evidentiary method
    for Pahlavi, Neryosangh, and Persian translations; defends testing both old and
    new explanations; urges prepared rather than unprepared conjecture; reports long
    labor on the rendering; and adds notes on Neryosangh and on avoiding conjectural
    emendation where texts are translatable.
