canonical_text:
  quote: ''
  summary: The passage comments on Yasna XLV. It describes a false or recreant Mazda-worshipper,
    then presents Zarathustra's declaration of the severance between good and evil,
    God and Demon, and the two spirits. It says Mazda revealed the first Mathra, warns
    of woe for those who do not act according to it, describes Mazda as father of
    the Good Mind and practical piety as His daughter, promises Happiness and Immortality
    to listeners, and turns to praise, spiritual blessings, woe for the wicked, Ahura's
    sovereign regulations, and the hope of praising in the Home of song.
  language: English
  quote_policy: summarized
