  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage sacrifices to Zarathushtra as the possessor of the Mathra and
    also mentions blessings for the saints and a hail addressed to the Bountiful Immortals.
  category: action
  evidence_refs:
  - ev:2
