canonical_text:
  quote: ''
  summary: The passage presents Visparad liturgical fragments that address ritual
    mortars, worship Ahura Mazda and the Bountiful Immortals, sacrifice to sacred
    words, Zarathushtra, Gathic chapters, and the Ahuna-vairya, emphasize exact recitation
    and textual completeness, and exhort Zarathustrian Mazdayasnians to prepare body
    and understanding for lawful deeds, husbandry, aid to the needy, and the worship
    of Ahura Mazda with Sraosha present.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stone mortar and iron mortar are addressed as two mortars of the house
    and wider social units and are asked to be full of wisest meaning in a ritual
    context with wood-billets, perfumes, and blessings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritual formula worships Ahura Mazda and the Bountiful Immortals and sacrifices
