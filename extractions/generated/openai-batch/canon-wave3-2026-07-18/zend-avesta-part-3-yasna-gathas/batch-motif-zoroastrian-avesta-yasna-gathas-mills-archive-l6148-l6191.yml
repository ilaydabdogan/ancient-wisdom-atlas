canonical_text:
  quote: ''
  summary: The passage introduces Yasna XXXIV as a thankful declaration in which the
    prophet offers gifts to Ahura in response to received gifts such as Immortality,
    Righteous Order, and Sovereign Power. It defines proper offerings as pious actions,
    prayer, and praise rather than merely sacrificial goods, describes a meat-offering
    made with homage to Righteous Order and Divine Sovereignty, presents Fire as a
    priestly sacred power invoked for strength, blessings, and vengeance, and explains
    the desired Kingdom as ethical action directed toward nourishing the poor.
  language: English
  quote_policy: summarized
