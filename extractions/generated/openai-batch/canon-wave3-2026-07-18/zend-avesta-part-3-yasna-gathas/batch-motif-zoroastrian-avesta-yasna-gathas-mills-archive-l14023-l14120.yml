canonical_text:
  quote: H(a)oma grows while he is praised, and the man who praises him is therewith
    more victorious.
  summary: The passage praises H(a)oma, asks it to grow, describes its healing and
    victorious effects, contrasts it with other toxicants, locates its creation and
    growth on high mountain ranges, describes birds carrying it to heights, says its
    drink mixed with milk brings prosperity and mind, and includes a self-offering
    gesture and renunciation of a murderous Caini figure.
  language: English
  quote_policy: quoted
