canonical_text:
  quote: ''
  summary: 'The passage summarizes themes in Yasna LI: prayer-pressing worshippers,
    the Ratu as person or law judging between sides, Ahura as awarder of good and
    evil, a requested sign from the holy Fire, the temptation and victory of Zarathustra,
    the destructive path of opposing Karpans, promised recompense for true disciples,
    saving knowledge in sacred verse, a king and faithful priests preserving that
    knowledge, a female saint identified with it, and spiritual blessings from the
    Immortals. The translation section begins with the choice of Ahura''s good Government,
    which opposes oppressive actions through holy Order and pious zeal.'
  language: English
  quote_policy: summarized
