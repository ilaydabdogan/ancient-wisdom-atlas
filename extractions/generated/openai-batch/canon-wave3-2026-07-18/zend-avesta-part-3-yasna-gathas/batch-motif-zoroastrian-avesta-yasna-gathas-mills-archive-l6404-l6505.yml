canonical_text:
  quote: What is then Your Kingdom, O Mazda? What are Your riches?
  summary: The passage addresses Mazda with questions about divine kingdom and riches,
    asks how the speaker may belong to Mazda through actions joined to Righteous Order
    and Good Mind, links those actions with care for the poor, declares Mazda apart
    from Daevas and polluted mortals, requests a sign, describes approach through
    sacrifice and praise, asks after Mazda's offerers and helpers who produce doctrines,
    and asks for salvation through righteousness. Supplied notes and Pahlavi glosses
    add interpretation about Auharmazd's Fire, Vohuman's nourishment of the poor,
    and the Daevas as demon-gods.
  language: English
  quote_policy: quoted
