canonical_text:
  quote: ''
  summary: The passage explains that Ahura's word is declared through inspired prophets
    and should be followed for spiritual growth. It describes a prayer that the evil
    alliance not prevail after long struggles, praises righteous authority and order,
    and presents the sacred Kine as central to pious life and sustained by herbage
    given by Ahura. It urges overthrow of Rapine, asks how prayers may rally chiefs,
    seeks spiritual rewards, and asks when ideal men, Aramaiti, and Khshathra will
    appear against false priests and tyrants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahura's declarations are said to come by means of inspired prophets, called
    secret-announcers, to a person who understands true relations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person hoping for spiritual growth and purity is instructed to attend to
    the Deity's word and follow its teachings, after which fears and doubts disappear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A prayer to Aramaiti asks that, after long struggles, the winning party not
    be the evil alliance with its monarch.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Righteous government is described as rule by men who toil for the sacred Kine,
    suppress predatory raids, and uphold correct Authority and the Order of the Faith
    as a great gift of Ahura.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sacred Kine is described as all-important to the pious worshipper, representing
    wealth in herds and sustaining home-life of happy industry.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ahura is said to have originally caused herbage to grow for the support of
    the sacred Kine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker urges overthrow of the spirit of Rapine in accordance with the
