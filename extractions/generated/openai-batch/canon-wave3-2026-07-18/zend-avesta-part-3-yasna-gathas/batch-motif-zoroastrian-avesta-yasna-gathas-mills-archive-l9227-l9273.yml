canonical_text:
  quote: ''
  summary: The passage contrasts an enduring habitation in the Lie's abode with hope
    for penitent former foes. It says that some among the Turanian tribes and the
    Fryana will arise to support settlements of Piety, with whom Ahura will dwell
    through His Good Mind and to whom He will deliver commands. It then says that
    a man who propitiates Zarathustra Spitama with gifts is fitted for proclamation,
    receives life from Ahura Mazda, helps settlements thrive in mental goodness, and
    is regarded as a good companion for Righteousness. A translator's note interprets
    the passage as evidence for the conversion and friendship of a border tribe.
  language: English
  quote_policy: summarized
