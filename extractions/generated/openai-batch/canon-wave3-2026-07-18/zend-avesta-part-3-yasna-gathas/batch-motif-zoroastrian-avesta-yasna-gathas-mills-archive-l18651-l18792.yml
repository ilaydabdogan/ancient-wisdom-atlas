canonical_text:
  quote: ''
  summary: A liturgical sequence summons Mazdayasnian leaders, social classes, divine
    beings, and priestly figures; presents a ritual exchange between Zaotar and Ratu;
    and describes sacrifices, praise, offerings, confession, and worship directed
    to wisdom, sanctity, the Bountiful Immortals, Amesha Spenta, sacred words, named
    divine or personified powers, the Chinvat Bridge, Heaven as the Best World, and
    the path leading to it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage summons Mazdayasnian chiefs, Bounteous Immortals, pious Saoshyants,
    Fire-priests, warriors, and the diligent husbandman of the Mazdayasnian Faith.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Zaotar and Ratu exchange formulaic ritual speech, and the Zaotar says
    he will recite the Staota Yesnya with memorized intoning, chanting, and praise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sacrifice is directed to thoughts of the mind, good wisdom, sanctity, religious
    knowledge, and health of soul and body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confession is to be made for the Kine, and Zarathustrian Mazdayasnians celebrate
    sacrificial worship, homage, propitiation, and praise for the entire holy and
    clean creation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker approaches the Bountiful Immortals as a praiser priest, invoker,
    memorizer, reciter, and chanter for sacrifice, homage, propitiation, and praise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker offers the flesh of his body and the blessings of his life to
    the Bountiful Immortals and confesses belief in Ahura Mazda as a Mazdayasnian
    of Zarathustra's order and faith.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: With precept, praise, grace, Zaothras, and correctly spoken sacrificial words,
    the speaker calls and worships the good Amesha Spenta by their beautiful names.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The litany worships correctly uttered sacrificial words, Sraosha, Ashi, Nairya-sangha,
    victorious Peace, the Fravashis of the saints, the Chinvat Bridge, and the Garo
    Nmana of Ahura described as Heaven and the best world of the saints.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage sacrifices to the better path that leads to the Best World and
    worships Arstat or Justice and Rashnu the most just.
  category: action
  evidence_refs:
  - ev:8
