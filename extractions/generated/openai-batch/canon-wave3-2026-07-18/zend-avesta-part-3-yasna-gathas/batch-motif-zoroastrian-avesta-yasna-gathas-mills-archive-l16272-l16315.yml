  quote: ''
  summary: Yasna XL is a prayer addressed to Ahura Mazda asking for wise and bountiful
    action, reward for souls, benefit in this world and the spiritual realm, fellowship
    with Ahura Mazda and Righteousness, righteous human helpers, trained animals,
    local social support, and the petitioners’ own holiness, truth, and free giving
    of gifts.
