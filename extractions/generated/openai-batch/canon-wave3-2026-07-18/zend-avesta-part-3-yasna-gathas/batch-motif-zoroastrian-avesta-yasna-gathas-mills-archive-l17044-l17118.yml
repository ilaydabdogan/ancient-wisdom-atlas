canonical_text:
  quote: ''
  summary: The passage praises Sraosha, identified with Obedience, as a blessed, victorious,
    martial figure whose body is the Mathra and who guards houses where he is welcomed.
    It describes worship offered with the Yasna, consecrated waters, and associated
    sacred figures or qualities, asking Sraosha to come to aid. The following Yasna
    LVIII introduction presents worship or service as a defence that shelters the
    speakers from the Daeva and the evil-minded man and yields good thought, good
    word, and good deed.
  language: English
  quote_policy: summarized
