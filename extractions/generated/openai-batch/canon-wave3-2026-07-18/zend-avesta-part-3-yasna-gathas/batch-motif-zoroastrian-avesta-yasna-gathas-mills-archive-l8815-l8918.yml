  summary: The passage comments on Yasna XLVI, describing a narrow path from which
    the faithless fall to Hell; the possibility that outsiders and enemies may repent
    and be blessed; Zarathustra's offer of reward to helpers of his cause; the roles
    of Vutaspa, the Spitamas, Frashaostra, and the Hvogvas; the faithful reaching
    a sacred scene where the Immortals dwell with God; Ahura discerning and answering
    truthful praise; and the beginning of the translation in which the speaker asks
    where he should turn because kin and allies do not support him.
