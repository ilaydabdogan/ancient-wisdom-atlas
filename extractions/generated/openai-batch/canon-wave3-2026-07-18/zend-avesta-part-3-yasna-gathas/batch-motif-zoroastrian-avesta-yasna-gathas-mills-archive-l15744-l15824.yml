canonical_text:
  quote: ''
  summary: A liturgical passage worships the holy wind associated with Vayu and Spe^ta
    Mainyu, religious Knowledge, the Mazdayasnian law, the Mathra Spe^ta, Fire as
    Ahura Mazda's son, all Fires, Mount Ushi-darena, and holy Yazads. The following
    section praises and invokes the Fravashis of saints, worships grouped communities
    and the Fravashi of Ahura Mazda, and then worships the Fravashis or spiritual
    components of Bountiful Immortals, righteous men and women, the Kine, and several
    named holy figures.
  language: English
  quote_policy: summarized
