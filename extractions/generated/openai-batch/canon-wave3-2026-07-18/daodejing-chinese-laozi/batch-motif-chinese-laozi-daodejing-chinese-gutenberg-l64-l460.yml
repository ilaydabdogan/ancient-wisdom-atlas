  type: quote
  locator: Chapter 16
  quote_or_summary: "「萬物並作，吾以觀復。夫物芸芸，各復歸其根。歸根曰靜。」"
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:8
  type: summary
  locator: Chapter 2
  quote_or_summary: The sage handles affairs through non-action, performs wordless
    teaching, produces without possessing, acts without relying on action, and does
    not dwell on completed merit.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:9
  type: summary
  locator: Chapter 3
  quote_or_summary: The sage’s rule empties the people’s hearts, fills their bellies,
    weakens their ambitions, strengthens their bones, and acts by non-action so nothing
    is ungoverned.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:10
  type: summary
  locator: Chapter 22
  quote_or_summary: The sage embraces the One as a model for the world, does not display
    self, assert self, boast, or contend, and therefore no one can contend with him.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:11
  type: summary
  locator: Chapter 10
  quote_or_summary: The passage asks whether one can concentrate qi and reach softness
    like an infant.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:12
  type: summary
  locator: Chapter 28
  quote_or_summary: Knowing the male and guarding the female makes one the world’s
    ravine and returns one to the infant; the passage also links return to the uncarved
    wood.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:13
  type: summary
  locator: Chapter 55
  quote_or_summary: One who contains thick德 is compared to a newborn child whom poisonous
    insects, fierce beasts, and birds of prey do not harm.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:14
  type: quote
  locator: Chapter 25
  quote_or_summary: "「有物混成，先天地生。寂兮寥兮，獨立而不改，周行而不殆，可以為天地母。」"
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:15
  type: quote
  locator: Chapter 42
  quote_or_summary: "「道生一，一生二，二生三，三生萬物。萬物負陰而抱陽，沖氣以為和。」"
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:16
  type: quote
  locator: Chapter 36
  quote_or_summary: "「柔勝剛，弱勝強。魚不可脫于淵。」"
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:17
  type: summary
  locator: Chapter 30
  quote_or_summary: The passage warns that one assisting a ruler by Dao does not use
    military strength; where armies camp, thorns grow, and after a great army there
    is a bad year.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:18
  type: summary
  locator: Chapter 31
  quote_or_summary: Weapons are called inauspicious instruments; one who delights
    in killing cannot gain the world, and victory in war is to be treated with grief
    and funeral rites.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:19
  type: quote
  locator: Chapter 32
  quote_or_summary: "「天地相合，以降甘露，民莫之令而自均。」"
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:20
  type: summary
  locator: Chapter 50
  quote_or_summary: One good at preserving life travels without meeting rhinoceros
    or tiger and enters the army without armor or weapons harming him; horn, claw,
    and blade find no place in him.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:21
  type: summary
  locator: Chapter 51
  quote_or_summary: Dao gives birth to things, 德 nurtures them, things shape them,
    and circumstances complete them; Dao and 德 grow, rear, nourish, and cover them
    without possessing or ruling.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:22
  type: summary
  locator: Chapter 52
  quote_or_summary: The world has a beginning called the mother of the world; once
    one has the mother, one knows the children, and by guarding the mother one avoids
    danger through life.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:23
  type: quote
  locator: Chapter 64
  quote_or_summary: "「合抱之木，生于毫末﹔九層之臺，起于累土﹔千里之行，始于足下。」"
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:24
  type: summary
  locator: Chapter 37
  quote_or_summary: Dao constantly does nothing yet leaves nothing undone; if lords
    and kings guard it, the ten thousand things transform of themselves, and nameless
    simplicity settles desire so the world corrects itself.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:25
  type: summary
  locator: Chapter 32
  quote_or_summary: Dao is always nameless; though uncarved simplicity is small, none
    under heaven can make it a subject. If lords and kings guard it, the ten thousand
    things submit of themselves.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:26
  type: summary
  locator: Chapter 57
  quote_or_summary: 'The sage says: I do nothing and the people transform themselves;
    I love stillness and the people correct themselves; I have no affairs and the
    people enrich themselves; I have no desire and the people become simple.'
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:27
  type: summary
  locator: Chapter 34
  quote_or_summary: The great Dao is described as flooding or spreading broadly, able
    to go left or right, relied on by the ten thousand things for life without claiming
    mastery.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:28
  type: summary
  locator: Chapter 28
  quote_or_summary: Knowing the male and guarding the female makes one the world’s
    ravine; knowing glory and guarding disgrace makes one the world’s valley.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:29
  type: summary
  locator: Chapter 59
  quote_or_summary: Accumulated德 and possession of the mother of the state are linked
    with long duration and described as the way of deep roots and firm base.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:30
  type: summary
  locator: Chapter 39
  quote_or_summary: Heaven, earth, spirits, valleys, ten thousand things, and rulers
    each gain clarity, peace, efficacy, fullness, life, or correctness by obtaining
    the One.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:31
  type: quote
  locator: Chapter 40
  quote_or_summary: "「反者道之動﹔弱者道之用。天下萬物生于有，有生于無。」"
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
- id: ev:32
  type: summary
  locator: Chapter 33
  quote_or_summary: Knowing others is wisdom; knowing oneself is clarity. Conquering
    others is strength; conquering oneself is power. Knowing sufficiency is wealth.
  source_text_path: texts/public-domain/taoist/project-gutenberg/daodejing-chinese-laozi.md
  rights_note: Public domain source text supplied in request.
