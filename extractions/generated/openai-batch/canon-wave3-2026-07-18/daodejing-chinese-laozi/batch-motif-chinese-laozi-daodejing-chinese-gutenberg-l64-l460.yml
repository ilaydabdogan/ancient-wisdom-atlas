canonical_text:
  quote: ''
  summary: Chapters 1–64 describe the Dao as nameless, prior to heaven and earth,
    mother/root of the ten thousand things, and operating through emptiness, softness,
    reversal, return, and non-action. The passage repeatedly contrasts paired opposites,
    presents the sage as one who rules and acts by non-action, praises water, valley,
    infant, uncarved wood, and root imagery, and warns against desire, weapons, excess,
    pride, and forced action.
  language: Chinese
  quote_policy: summarized
