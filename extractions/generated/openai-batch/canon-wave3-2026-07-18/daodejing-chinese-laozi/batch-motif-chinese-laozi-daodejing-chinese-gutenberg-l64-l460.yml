candidate_motifs:
- id: motif:1
  label: Primordial nameless source as mother/root of cosmos
  taxonomy_refs: []
  basis: Dao or the unnamed is presented as prior to heaven and earth, as mother of
    the ten thousand things, and as the mother of heaven and earth; the mysterious
    female’s gate is also called the root of heaven and earth.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:14
  confidence: high
  cautions: The passage uses mother and female language, but does not narrate a personified
    goddess figure.
- id: motif:2
  label: Generative sequence from unity to multiplicity
  taxonomy_refs: []
  basis: The passage states that Dao gives birth to one, one to two, two to three,
    and three to the ten thousand things, which hold yin and yang in harmony.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The sequence is aphoristic and cosmological rather than a narrative cosmogony.
- id: motif:3
  label: Complementary dualities and reversal
  taxonomy_refs:
  - duality
  basis: The passage repeatedly pairs opposites as mutually dependent and also says
    reversal is the movement of Dao and that weak or soft overcomes hard or strong.
  evidence_refs:
  - ev:2
  - ev:16
  - ev:31
  confidence: high
  cautions: The dualities are philosophical formulations, not characters in a mythic
    conflict.
- id: motif:4
  label: Sage wisdom through non-action and non-contention
  taxonomy_refs:
  - wisdom
  basis: The sage teaches without speech, acts without forced action, refuses possession
    and boasting, and thereby governs or completes work.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:24
  confidence: high
  cautions: This is an ethical-political wisdom pattern rather than a heroic plot.
- id: motif:5
  label: Water as humble benefactor and model of Dao
  taxonomy_refs: []
  basis: Water benefits all things without contention, dwells in disliked low places,
    and is explicitly said to be near Dao.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The taxonomy supplies water as a symbol rather than a motif family; no
    separate water deity is present.
- id: motif:6
  label: Creative power of emptiness
  taxonomy_refs: []
  basis: The wheel hub, vessel, and room are useful because of empty spaces, and the
    passage generalizes that being gives benefit while non-being gives use.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a symbolic-philosophical pattern, not a narrative event.
- id: motif:7
  label: Return to root and restoration of stillness
  taxonomy_refs: []
  basis: The ten thousand things are observed returning to their root; root-return
    is named stillness and is associated with constancy.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Although it resembles cyclical return patterns, the passage does not explicitly
    narrate death and rebirth.
- id: motif:8
  label: Infant as image of primal softness and potency
  taxonomy_refs: []
  basis: The passage uses infant or newborn imagery for concentrated softness, return
    to constant德, and protection from harmful creatures.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The infant functions as an analogy, not as a miraculous child figure.
- id: motif:9
  label: Anti-war mourning of victory
  taxonomy_refs: []
  basis: Weapons are called inauspicious, military encampment is followed by thorns
    and bad years, and victorious killing is to be mourned as a funeral matter.
  evidence_refs:
  - ev:17
  - ev:18
  confidence: high
  cautions: The passage gives maxims about warfare rather than a specific battle narrative.
- id: motif:10
  label: Great works begin from minute origins
  taxonomy_refs: []
  basis: A large tree, nine-story terrace, and thousand-li journey are each said to
    begin from very small or initial conditions.
  evidence_refs:
  - ev:23
  confidence: high
  cautions: The tree and journey are instructional metaphors rather than sacred tree
    or quest narratives.
comparison_claims:
- id: claim:1
  claim: The passage supports comparison with a broad duality motif family because
    it repeatedly structures reality through paired opposites and reversal, including
    being/non-being, yin/yang, soft/hard, and weak/strong.
  claim_level: same_function
  target: duality
  evidence_refs:
  - ev:2
  - ev:15
  - ev:16
  - ev:31
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is functional and thematic only; the passage does not
    present duality as a mythic pair of deities or antagonists.
- id: claim:2
  claim: The passage supports comparison with a wisdom motif family because it centers
    aphoristic teaching about the sage, self-knowledge, restraint, non-action, and
    governance.
  claim_level: same_function
  target: wisdom
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:24
  - ev:32
  counter_evidence_refs: []
  confidence: high
  limitations: The material is didactic philosophy rather than a wisdom tale with
    a plot.
- id: claim:3
  claim: The water imagery can be compared to a symbolic pattern in which low, yielding
    water functions as an image of beneficent power and nearness to the sacred principle.
  claim_level: same_function
  target: water symbol
  evidence_refs:
  - ev:5
  - ev:27
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives symbolic analogy, not a water deity, flood, or water-journey
    episode.
