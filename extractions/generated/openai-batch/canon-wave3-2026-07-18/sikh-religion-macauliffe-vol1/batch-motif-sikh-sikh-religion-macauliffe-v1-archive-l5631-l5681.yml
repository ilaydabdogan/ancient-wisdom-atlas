canonical_text:
  quote: ''
  summary: Nanak’s mother reports his condition to the household, and the family grieves
    and calls him mad. His uncle tries to console him by referring to the occupation
    chosen for him, which Nanak has refused. Nanak recites a hymn contrasting worldly
    entanglements with a spiritual family made of forgiveness, contentment, truth,
    love of God, affection, patience, peace, and wisdom, and names the one God as
    his Lord. Nanak then becomes silent, lies down, and takes no food or drink. The
    family urges Kalu to call a physician; Kalu brings one, and the physician begins
    to feel Nanak’s pulse. The excerpt breaks off during the ensuing action and includes
    a fragmentary footnote about worn coin.
  language: English
