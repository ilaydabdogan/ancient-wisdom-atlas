canonical_text:
  quote: ''
  summary: The preface explains the difficulty of translating the Granth Sahib because
    of inadequate dictionaries, multiple source languages, unique words, and dependence
    on a dwindling number of professional Sikh interpreters. It criticizes an earlier
    German missionary translation as inaccurate and offensive, and states that the
    present work aims partly to make reparation to Sikhs and to provide a simple English
    translation for readers.
  language: English
  quote_policy: summarized
