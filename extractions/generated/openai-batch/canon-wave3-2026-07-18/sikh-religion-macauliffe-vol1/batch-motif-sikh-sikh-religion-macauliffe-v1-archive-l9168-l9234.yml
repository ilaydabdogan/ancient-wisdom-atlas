literal_observations:
- id: obs:1
  text: A speaker advises placing one's feet and property on two boats, saying one
    boat may sink while the other crosses over.
  category: speech
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:2
  text: The speaker identified by the verse-name Nanak says that for him there is
    no water, boat, wreck, or loss, and that the True One is his property and wealth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shaikh Brahm replies that the world is enamoured of a witch who is found false
    when her secret is known, and that a field is ruined while Nanak looks on.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Guru answers that love for the witch has prevailed from the beginning,
    but the field will not be ruined if the watchman remains alert.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shaikh Brahm says his body fails, his heart is broken, and he has no remaining
    strength.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Shaikh Brahm asks the beloved to become his physician and give him medicine.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Guru exhorts Shaikh Brahm to examine the truth, says lip-worship is hollow,
    and says the Beloved is not far but is to be beheld in the heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Shaikh Brahm says that when a raft ought to have been made it was not made,
