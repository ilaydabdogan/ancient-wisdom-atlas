  summary: A poetic dialogue between Guru Nanak and Shaikh Brahm uses images of boats,
    water, a witch, a field, a watchman, bodily weakness, a physician, a heart, a
    raft, and an overflowing river to discuss worldly attachment, remembrance of God,
    spiritual vigilance, and the nearness of the Beloved.
  language: English
