canonical_text:
  quote: ''
  summary: A devotional stanza describes Guru-granted realization, nectar, the end
    of doubt and transmigration, and blending with God. The prose then narrates Guru
    Nanak's travel to Batala and Saiyidpur, Lalo's complaint about Pathan oppression,
    and Guru Nanak's prediction of Babar's conquest. Guru Nanak addresses Lalo in
    a lament that portrays Babar's invasion as a sinful bridal procession, with wealth
    as bride, moral and religious order overturned, women suffering, blood imagery,
    and a city of corpses.
  language: English
  quote_policy: summarized
