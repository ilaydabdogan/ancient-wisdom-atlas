  quote: ''
  summary: The passage contrasts Sanskrit religious instruction by Hindu Pandits and
    Brahmans with the Sikh Gurus' use of contemporary dialects and Gurumukhi characters
    so people of all castes, classes, and genders may understand. Guru Amar Das explains
    this with a well-water and rain-water analogy, answers a Brahman's objection to
    teaching Sudars and women, and states that all forms belong to God and are finally
    absorbed in God. The passage also notes Guru Nanak's humility and lack of prophetic
    heralding.
