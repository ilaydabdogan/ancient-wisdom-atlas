canonical_text:
  quote: "“Offerings are like poison and cannot be digested.”"
  summary: Mardana brings money and clothes offered by villagers to Guru Nanak, who
    says they belong to neither of them and orders them thrown away, then teaches
    that offerings can be spiritually harmful when relied upon without fervent worship.
    The passage then introduces Shaikh Sajjan, a robber who provides religious accommodations
    and apparent hospitality to travelers but murders guests by throwing them into
    a well, then performs outward devotional acts. Seeing Guru Nanak, Sajjan mistakes
    his spiritual appearance for signs of worldly wealth, invites the party to sleep,
    and Guru Nanak asks to recite a hymn to God.
  language: English
  quote_policy: quoted
