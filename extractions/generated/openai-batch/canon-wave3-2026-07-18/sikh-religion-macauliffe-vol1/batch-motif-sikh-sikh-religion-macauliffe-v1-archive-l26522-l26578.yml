canonical_text:
  quote: ''
  summary: The passage praises a disciplined person who subdues passions through God's
    Name, defines true renunciation as desirelessness amid desires and love of one
    God, describes searching the body under the Guru's instruction, and presents the
    divine Name as the means of happiness, deliverance, and crossing over. A following
    fervent address to Mihan and Sihan uses the voice of a woman or soul separated
    from the Beloved, wandering in transmigration, offering herself sacrificially,
    and hoping to dwell with the Beloved through remembrance.
  language: English
