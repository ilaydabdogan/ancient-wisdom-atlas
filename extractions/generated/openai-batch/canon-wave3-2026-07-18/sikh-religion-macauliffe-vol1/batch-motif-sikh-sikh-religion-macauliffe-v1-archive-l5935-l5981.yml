canonical_text:
  quote: ''
  summary: Nanak is reminded by his servant to pursue his father’s practical errand,
    but he questions a priest and learns that the priest’s company avoids luxury,
    lives in forests, and accepts only voluntary food. Nanak gives his father’s money
    for the holy men’s needs and identifies himself as Nanak Nirankari, worshipper
    of the Formless One. After the faqirs depart, his servant rebukes him; Nanak sits
    under a tree outside Talwandi, where his father finds and punishes him. The tree
    is later preserved as Thamb Sahib, a holy trunk enclosed by a wall, with religious
    men praying and contemplating there. The passage then notes Jai Ram’s acquaintance
    with Nanak and Rai Bular’s support.
  language: English
