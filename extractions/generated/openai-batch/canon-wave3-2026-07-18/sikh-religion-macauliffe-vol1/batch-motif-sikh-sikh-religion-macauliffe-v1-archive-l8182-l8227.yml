canonical_text:
  quote: ''
  summary: Two shopkeepers repeatedly set out together, one to visit Guru Nanak for
    instruction and the other to visit a mistress. They agree to test their fortunes.
    The second shopkeeper, unable to find his mistress, waits at the meeting place
    and discovers a gold coin and then a jar of charcoal while digging with a knife.
    The first shopkeeper leaves the Guru and suffers a thorn wound in his foot. Seeing
    that the one pursuing sin has gained while the one pursuing devotion has suffered,
    they ask Guru Nanak for an explanation. The Guru begins to explain that the sinful
    shopkeeper had given a gold coin as alms to a holy man in a former birth; the
    passage ends mid-explanation.
