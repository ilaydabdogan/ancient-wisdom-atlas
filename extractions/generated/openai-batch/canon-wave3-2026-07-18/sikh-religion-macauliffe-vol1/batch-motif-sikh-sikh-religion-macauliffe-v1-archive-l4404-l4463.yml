canonical_text:
  quote: We have no boat or raft ; we are drowning ; save us, O Saviour King.
  summary: 'The passage presents devotional and doctrinal statements: the Creator
    unites people with Himself beyond rebirth; humans are depicted as drowning in
    a terrible ocean without a vessel and appealing for rescue; God is omnipresent,
    sovereign, unseen, and the giver of all; suffering is attributed to one’s own
    karma; the speaker uses a marital image of being a woman not yet united with her
    divine Husband; the world is God’s play yet is bound by Death, while those favoured
    by the Guru and seeking God’s protection are saved. Notes explain the world-ocean,
    karma and transmigration, the Guru’s salvific boat, and the God-as-husband image,
    with a limited comparison to Psyche and Eros.'
  language: English
  quote_policy: quoted
