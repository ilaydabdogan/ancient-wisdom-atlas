canonical_text:
  quote: The fire which is within him is not extinguished without the Guru, yet he
    heateth himself with external fires also.
  summary: The passage contrasts truth and service to the Lord with the conduct of
    a hypocritical Sanyasi named Brahmpuri. It says the true way of a Sanyasi is to
    follow the Guru’s instruction, contemplate the one God, and love the divine name.
    It criticizes hypocritical ascetics who abandon households, covet others’ houses,
    wear dyed beggar garb, carry money, beg and preach without knowing the Word, and
    rely on external fires while their inner fire remains unextinguished without the
    Guru.
  language: English
