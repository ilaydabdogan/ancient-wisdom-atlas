canonical_text:
  quote: "“The whole earth is my sacred lines, and he who loveth truth is pure.”"
  summary: The passage recounts Guru Nanak’s refusal of state money in favor of poor
    relief, his journey with Mardana to Saiyidpur, his stay with Lalo the carpenter,
    and his rejection of ritual and caste boundaries around eating. Malik Bhago summons
    him after he avoids a feast, and Guru Nanak squeezes bread from Lalo and Malik
    Bhago; milk issues from Lalo’s bread and blood from Malik Bhago’s, which the narration
    explains as a contrast between honest labor and oppressive wealth. The passage
    then describes Guru Nanak and Mardana traveling through a solitary forest, where
    Mardana receives food and homage after following the Guru’s instructions.
  language: English
  quote_policy: quoted
