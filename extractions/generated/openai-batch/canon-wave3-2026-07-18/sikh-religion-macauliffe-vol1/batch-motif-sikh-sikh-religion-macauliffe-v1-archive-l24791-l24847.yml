  quote: he who hath no Guru hath no understanding.
  summary: The hymn states that God causes good action, purifies those who fear Him,
    gives divine knowledge, and leads people according to His order. It presents the
    Guru and priest as sources of instruction, describes divine knowledge as incommunicable
    like a dumb man tasting sweets, praises the ambrosial Name, and begins an instruction
    to a Brahman that hopes, desires, and ritual ceremonies are entanglements.
