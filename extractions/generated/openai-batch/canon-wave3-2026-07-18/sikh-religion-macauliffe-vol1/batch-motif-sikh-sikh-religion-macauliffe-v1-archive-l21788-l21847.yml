canonical_text:
  quote: ''
  summary: 'The passage presents Guru Nanak’s devotional teaching: those who forget
    God wander without divine favor; human condition is compared to a bird flying
    high and low and perching in differing places; all beings are led by the Lord’s
    order. Women devoted to their Spouse are described as adorned by love, abiding
    in his chambers, regenerated by the Word, and supplicating the True One. The Word
    fulfills hopes and is associated with nectar. Nanak’s devotion to the True Name
    is described as insatiable through analogies of desert, fire, kings, and ocean.
    Bhai Rama asks how God is known, and the Guru replies that understanding comes
    from God.'
  language: English
  quote_policy: summarized
