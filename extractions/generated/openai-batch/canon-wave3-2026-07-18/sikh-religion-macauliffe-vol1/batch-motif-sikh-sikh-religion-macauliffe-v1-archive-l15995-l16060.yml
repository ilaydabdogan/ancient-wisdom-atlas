canonical_text:
  quote: ''
  summary: The passage states that God cannot be described in words and that the Guru
    teaches there is one Bestower for all living beings. It presents pleasing God
    as the true pilgrimage-bath, says created beings depend on previous good acts,
    and likens the Guru’s word to jewels stored in the heart. It contrasts worldly
    longevity and renown with the necessity of God’s favour, and includes commentary
    comparing God or the Guru with named Indic deities and quoting the tenth Guru
    on God creating the sword, the emblem of Death, before the world.
  language: English
  quote_policy: summarized
