  quote: ''
  summary: The passage praises the Word, Guru, and God's name as the means by which
    a person meets and remembers God. It uses coinage and assay imagery for divine
    evaluation, contrasts genuine and counterfeit, and states that extreme bodily
    austerities or countless ceremonies are not equal to God's name. A footnote explains
    the eight metals as bodily constituents, with an alternate interpretation by Bhai
    Gur Das.
