canonical_text:
  quote: ''
  summary: A hymn passage describes humans falling into fathomless water, passing
    through hunger, eating, sleep, dreaming, and morning turmoil, and preparing for
    long life. It counsels love and devotion to God through the eight watches of the
    day, contrasts divine nearness with false worldly occupations, and uses images
    of a house without the True One, weighing, assay, selection at the All-seeing
    gate, true goods from the perfect Guru, and the false being bound and led away.
  language: English
  quote_policy: summarized
