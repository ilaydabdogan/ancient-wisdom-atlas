  summary: The passage first gives the Guru's concluding instruction criticizing bodily
    and ritual strings, the Brahman's paid marriage practice, and the naming of a
    mentally blind person as wise. It then describes Sultanpur's revenue administration,
    Jai Ram seeing Nanaki drawing water from a well while he surveys a corn-field,
    the arranged marriage of Jai Ram and Nanaki through Rai Bular, and a Janamsakhi
    report that Nanak's marriage was arranged by his parents when he was fourteen.
