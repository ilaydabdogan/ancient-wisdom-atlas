canonical_text:
  quote: "“The world is an ocean, and is said to be difficult to cross”"
  summary: In a dialogue with Sidhs, Nanak speaks of dwelling in God, living according
    to divine will, and being absorbed in the True One through Guru instruction and
    self-knowledge. Charpat asks how to cross the world, described as a difficult
    ocean. Nanak answers with images of a lotus dry in water and a waterfowl in a
    stream, saying meditation on the Word and repetition of God’s name leave one unaffected
    by the world. The Sidhs hail him, and he redirects the praise to the Primal Being.
    A final note reports that some Sikhs associate this occasion with the composition
    of the Sidh Gosht.
