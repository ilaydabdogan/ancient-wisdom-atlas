canonical_text:
  quote: In the supreme state there is no rejoicing or mourning
  summary: The passage recounts Guru Nanak’s exchange with a king who asks whether
    he is Gorakhnath, the Guru’s oblique reply about Gorakh above the sky and Nanak
    as an anchoret, the king’s invitation to teach the queen, the composition of the
    Pransangali in Ceylon, and verses describing the supreme state as void, beyond
    desire, caste, sermon, and hymn, yet containing heavenly meditation and self-knowledge.
    It ends by saying Saido and Gheho later wrote the Pransangali from memory, with
    a note explaining that Sikh self-knowledge means knowing God within.
  language: English
  quote_policy: quoted
