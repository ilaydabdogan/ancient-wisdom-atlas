  quote: ''
  summary: 'The passage presents hymnic speech attributed to Guru Nanak: the speaker
    addresses the Lord as the only beloved refuge, declares service and sacrificial
    devotion to the divine name, reflects on the brevity of human life, urges service
    to the One who owns souls and lives, warns that deceit leads captive to the gate
    of Death, counsels speaking and hearing of God while alive, and closes with a
    moral reflection prompted by a thief’s arrest concerning the thief and the magistrate.'
