canonical_text:
  quote: ''
  summary: 'The hymn describes God as acting without consultation in creation, destruction,
    giving, and taking; as favoring and bestowing according to divine will; as dwelling
    in an unknowable and unreachable place; as making people great without regard
    to caste; and as an inexhaustible giver. A narrative frame says a Qazi and a pandit
    asked the Guru how a person could find God and be blended with Him. The reply
    uses spouse-wife imagery: all are wives of the Spouse, outward adornment and hypocrisy
    do not obtain love, and the good wife is pleasing to the Lord and adorned by divine
    favor.'
  language: English
  quote_policy: summarized
