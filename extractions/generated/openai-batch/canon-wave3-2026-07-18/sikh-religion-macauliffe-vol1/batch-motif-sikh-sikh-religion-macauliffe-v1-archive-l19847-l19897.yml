  quote: ''
  summary: The passage presents hymns of the Sohila attributed to Guru Nanak. It instructs
    singing divine praise and remembering the Creator, describes the Lord as provider
    and watcher over living beings, uses a bride and marriage-preparation image for
    meeting the Lord, warns that the day of the Caller approaches, and contrasts multiple
    philosophical systems with the one Guru of gurus. An editorial note states that
    the Sohila is recited at bedtime by pious Sikhs.
