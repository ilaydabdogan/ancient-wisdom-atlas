  quote: ''
  summary: This preface section argues that Sikh Gurus and associated figures supported
    women’s freedom from parda, prohibited infanticide and widow concremation, opposed
    caste and impurity beliefs, and that knowledge of Sikh texts and prophecies would
    aid British administration and Sikh loyalty. A footnote explains the titles Mata/mother
    for Gurus’ wives and Baba/father for Guru Nanak.
  language: English
