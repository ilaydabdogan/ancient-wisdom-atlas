canonical_text:
  quote: ''
  summary: A hymn attributed to Guru Nanak addresses God as possessing merits while
    the speaker has demerits, criticizes worldly pursuit, pride, evil speech, and
    false wisdom, and says pleasure apart from repeating God's name is insipid. An
    additional slok is introduced as advice Nanak gave to the queen of Ceylon, urging
    moral discernment, rejection of evil, avoidance of transitory attachment, consultation
    with the holy, and comparison of spiritual guidance to consulting skilled people
    before crossing dangerous water.
  language: English
  quote_policy: summarized
