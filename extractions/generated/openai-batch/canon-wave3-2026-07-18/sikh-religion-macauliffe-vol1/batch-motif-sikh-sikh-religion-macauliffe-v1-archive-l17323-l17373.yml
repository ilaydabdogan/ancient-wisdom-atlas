  summary: The passage opens the Asa ki War with a declaration of one true, unborn,
    immortal Creator. It identifies the War as including sloks by the first Guru and
    gives short verses attributed to Guru Nanak and Guru Angad on devotion to the
    Guru, the Guru's transforming power, and darkness without the Guru. Notes explain
    the term War, its liturgical use after the Japji, and a story of the holy prince
    As, falsely accused by his stepmother and mutilated, identified as an Oriental
    version of the Potiphar's wife story.
