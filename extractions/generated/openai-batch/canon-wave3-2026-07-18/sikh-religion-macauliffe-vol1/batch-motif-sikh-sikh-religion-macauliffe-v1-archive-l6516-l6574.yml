  quote: ''
  summary: A hymn attributed in the narrative to Guru Nanak lists numerous religious
    practitioners, spiritual adepts, divine beings, demons, and Muslim religious authorities,
    then states that none attain peace or purity without the true guru’s instruction
    and meditation on the true guru’s word. It affirms one Lord over all spiritual
    lords, the Creator whose name is true, whose worth is endless and incalculable.
    After hearing the hymn, Daulat Khan falls at Guru Nanak’s feet, and the people
    say God is speaking through Nanak’s mouth.
