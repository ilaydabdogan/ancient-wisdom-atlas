canonical_text:
  quote: 'Thou art an ocean : all are contained in Thee.'
  summary: A hymn attributed to Guru Ram Das addresses the Lord as the true Creator,
    giver, owner of all, and source of the divine Name. It contrasts the pious who
    gain the Name with the perverse who lose it, describes divine separation and union,
    and says God becomes manifest under the Guru’s instruction. A following hymn attributed
    to Guru Nanak depicts man in a world-like tank with water hot as fire and drowning
    in the mire of worldly love.
  language: English
  quote_policy: quoted
