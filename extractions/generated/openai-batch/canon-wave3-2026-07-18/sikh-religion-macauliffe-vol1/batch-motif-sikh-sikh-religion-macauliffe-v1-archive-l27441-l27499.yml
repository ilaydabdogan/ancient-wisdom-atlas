  quote: ''
  summary: The passage presents virtues and ethical conduct as the effective means
    of deliverance, replacing or revaluing outward ritual practices with truth, contentment,
    divine knowledge, meditation, mercy, forgiveness, good deeds, and love of God.
    It contrasts honest labour and giving with begging or external religious display.
    It then gives moral commands against coveting, pride, slander, lust, and wrath,
    and states that God dwells in the heart and that nectar is found there through
    the Guru’s instruction and equanimity toward opposites.
