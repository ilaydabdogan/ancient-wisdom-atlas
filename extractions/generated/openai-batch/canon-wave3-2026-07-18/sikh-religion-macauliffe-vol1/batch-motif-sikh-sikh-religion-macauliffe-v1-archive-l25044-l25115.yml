canonical_text:
  quote: ''
  summary: The passage gives moral instruction against theft, falsehood, and outward
    religious appearance. It says that the True One knows hidden conduct, that actions
    bring fitting reward, and that counterfeit value fails when tested. A Brahman,
    a Qazi, and a Jogi discuss with the Guru; the Guru teaches through images of the
    body as paper, the mind as writing, destiny on the forehead, God’s court, counterfeit
    coinage, and inner sterling silver. The passage criticizes the three religious
    specialists and defines a true Jogi and true Qazi by knowledge of God, recognition
    of the One, renunciation, and being dead while alive.
  language: English
  quote_policy: summarized
