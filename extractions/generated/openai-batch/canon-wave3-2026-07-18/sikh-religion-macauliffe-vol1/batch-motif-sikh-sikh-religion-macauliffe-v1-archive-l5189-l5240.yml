canonical_text:
  quote: ''
  summary: 'The passage recounts Nanak''s betrothal and marriage to Sulakhani, then
    describes two marvels from his youth: a tree''s shadow remains fixed over him
    while he sleeps, and a cobra shelters him with its hood. Rai Bular recognizes
    Nanak''s miraculous powers and congratulates Kalu. A jal-tree is identified as
    the site of the former miracle. The passage ends with Nanak''s mother reproaching
    him for idleness and urging practical work.'
  language: English
  quote_policy: summarized
