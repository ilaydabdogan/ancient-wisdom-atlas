canonical_text:
  quote: ''
  summary: The passage moves from a brief reference to demigods and demons claiming
    merit and the impossibility of concealing God's greatness, to a hymn in which
    Guru Nanak compares longing for God to a bride awaiting and recognizing her Bridegroom.
    God is described as the Spouse of all, the source of truth, contentment, mercy,
    and faith. A following hymn states that human life without holiness is useless,
    using images such as a cow without milk, a bird without wings, tillage without
    water, a ruler without homage, and a dark chamber without God's name. The speaker
    asks God not to forget him in affliction and notes the failure of bodily senses.
  language: English
  quote_policy: summarized
