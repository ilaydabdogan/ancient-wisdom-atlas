canonical_text:
  quote: ''
  summary: The hymn criticizes slander, pilgrimage and bodily ritual without true
    knowledge, false textual recitation, external ascetic signs, worldly desire, and
    a hypocritical Kapari. It warns of hell, separation from the Supreme Spirit, unremoved
    evil deeds, beast rebirth, and disgrace by Death. It contrasts these with service
    to the True Guru, removal of pride, repetition of the Name, and the conduct of
    a true Sanyasi. A fragmentary note describes Hindu devotees lighting fires in
    four directions with the sun as a fifth fire.
  language: English
  quote_policy: summarized
