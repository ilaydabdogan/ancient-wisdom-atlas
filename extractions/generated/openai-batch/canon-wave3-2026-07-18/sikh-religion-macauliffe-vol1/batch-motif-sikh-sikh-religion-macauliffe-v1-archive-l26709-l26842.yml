canonical_text:
  quote: ''
  summary: 'The hymn describes God as inaccessible, primal, sustaining, creative,
    and merciful. It teaches that emancipation comes through the true Guru’s instruction,
    love of God, and service to the Guru. It contrasts salvation and absorption in
    God with the consequences of forgetting the Name: departure under order, hell,
    transmigration, judgment according to acts, and lack of worldly aid. It uses images
    of Death as tax-gatherer, the soul and body as a male Jogi and beautiful woman,
    a narrow sword-edge way, divine court, true merchandise, robe of honour, and God’s
    presence in wind, water, and fire.'
  language: English
  quote_policy: summarized
