canonical_text:
  quote: ''
  summary: Guru Nanak travels to Mithankot and stays in a garden. Mian Mitha, a Muslim
    priest, boasts that he will overpower Nanak in encounter. Mardana reports the
    speech to the Guru. Mian Mitha meets Nanak, challenges him with a verse about
    God, the Prophet, the Creed, and acceptance in God’s court. Nanak replies by emphasizing
    God, good intention, and God alone at the divine gate. Mian Mitha asks about a
    lamp burning without oil and gaining a seat in God’s court; Nanak answers with
    counsel involving sacred books, fear as a wick, and the knowledge of truth burning
    within the body.
  language: English
  quote_policy: summarized
