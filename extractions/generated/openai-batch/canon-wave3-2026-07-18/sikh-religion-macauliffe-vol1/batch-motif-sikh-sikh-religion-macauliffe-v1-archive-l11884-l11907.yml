  quote: ''
  summary: Guru Nanak travels by the river Ravi to Lahore, where Duni Chand, a wealthy
    Khatri, is holding a shradh ceremony for his father. Duni Chand says he has fed
    one hundred Brahmans in his father’s name. The Guru replies that the father has
    not eaten for two days and states that the father has become incarnate as a wolf
    in a clump of trees six miles away.
