canonical_text:
  quote: ''
  summary: The preface explains the compiler’s narrative arrangement of Sikh hymns,
    the omission of repeated hymns after consultation with Sikh scholars, and the
    instructional function of repetition in orally delivered sacred teaching. It also
    states that the work contains what is necessary for faith and morals, including
    the goal of absorption in the Creator or dwelling in the Creator’s heaven. The
    passage then gives anecdotes of Guru Teg Bahadur’s prophetic words to Aurangzeb
    about Europeans coming from beyond the seas to destroy the empire, their later
    use as a Sikh battle-cry in Delhi in 1857, and Guru Gobind Singh’s prediction
    that the Khalsa would awaken in battle.
  language: English
  quote_policy: summarized
