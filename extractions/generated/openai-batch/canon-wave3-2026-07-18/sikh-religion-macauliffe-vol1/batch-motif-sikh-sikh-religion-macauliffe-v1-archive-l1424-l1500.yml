  summary: In the preface, Macauliffe argues that a comprehensive English work on
    Sikh sacred writings and the lives of Gurus and holy men would become impossible
    once current learned interpreters pass away. He reflects on the endless production
    of books, hopes his work avoids neglect, and describes unread library volumes
    and authors' toil as evidence of the transience of fame and uncertain reward.
