canonical_text:
  quote: ''
  summary: The passage teaches that divine knowledge and recognition of God come through
    the true Guru, God's Name, and the True Word. It rejects idol worship in favor
    of inward worship of God through meditation on the Name, using images of the heart
    as a scraper, the Name as sandal, good acts as kungu, and the heart washed like
    an idol surface. It contrasts beasts that give milk in return for food with Brahmans
    who make no return for offerings, affirms that God is near and caring, and says
    the Guru's God exceeds Hindu demigods, including Brahma arising from Vishnu's
    navel lotus. It ends by calling the Beloved the support of the soul.
  language: English
  quote_policy: summarized
