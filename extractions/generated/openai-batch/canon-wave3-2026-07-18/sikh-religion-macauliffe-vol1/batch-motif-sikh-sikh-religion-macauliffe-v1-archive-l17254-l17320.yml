  quote: ''
  summary: The passage describes innumerable worlds acting under God’s orders, presents
    a smithing and minting metaphor for spiritual discipline and the coining of the
    Word, identifies air, water, earth, day, and night as cosmic caregivers, and states
    that deeds are judged while those who ponder the Name are made bright and emancipate
    others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says there are worlds upon worlds and forms upon forms, all fulfilling
    their functions according to God’s orders.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: God is described as beholding and contemplating the worlds and being pleased;
    Nanak says describing them would be impossible.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage instructs the hearer to make continence a furnace, resignation
    a goldsmith, understanding an anvil, and divine knowledge tools.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage further names fear of God as bellows, austerities as fire, divine
    love as a crucible, and God’s name as what is melted; in a true mint the Word
    is coined.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The described practice belongs to those on whom God looks with favour, and
    the Kind One makes them happy by a glance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The slok states that air is the guru, water the father, great earth the mother,
    and day and night two nurses who set the whole world playing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A note explains that the denizens of the world are likened to children, with
    water as father, earth as nourishing mother, day as occupation, night as rest,
    and the breath of the Guru as divine instruction.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Merits and demerits are said to be read out in the presence of the Judge.
  category: action
  evidence_refs:
  - ev:4
