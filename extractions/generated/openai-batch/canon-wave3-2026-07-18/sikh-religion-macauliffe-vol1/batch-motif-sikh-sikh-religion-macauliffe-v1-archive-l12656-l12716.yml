canonical_text:
  quote: ''
  summary: A devotional hymn attributed to Nanak frames longing for God through months
    and seasons. The speaker asks God to open understanding, describes devotees as
    blended with God through praise, knowledge, meditation, love, and service, contrasts
    the movable world with God’s immovable wisdom, invokes God’s name as dispelling
    sorrow, locates divine presence within the body and all living beings, and uses
    images of spouse, friend, inner pilgrimage, ornaments, and bathing in God’s tank.
  language: English
  quote_policy: summarized
