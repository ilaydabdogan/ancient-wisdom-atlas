canonical_text:
  quote: My field, which you say this water cannot reach, is near, but your ancestors
    are very far away
  summary: At Hardwar, Guru Nanak uses water-sprinkling to challenge water offerings
    to ancestors, criticizes rosary-counting without devotion, names the attendees'
    worldly thoughts, disputes a cooking-square defilement accusation, recites a hymn
    equating inner vices with impurity and ethical conduct with ritual lines, rejects
    Brahmanical sacrifices and worship in favor of feeding humble Name-reciters, and
    then travels with Mardana to Panipat. A footnote recounts Shaikh Sharaf's divine
    call and renunciation of books.
  language: English
  quote_policy: quoted
