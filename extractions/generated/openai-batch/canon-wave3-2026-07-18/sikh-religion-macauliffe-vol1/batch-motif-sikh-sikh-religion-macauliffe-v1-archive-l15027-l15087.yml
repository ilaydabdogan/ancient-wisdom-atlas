canonical_text:
  quote: ''
  summary: The passage recounts Lahina’s contact with Jodha, his introduction to Guru
    Nanak, his abandonment of Durga ritual dance implements, and his adoption of God’s
    name and service to the Guru. It then narrates Lahina’s vision of Durga serving
    Guru Nanak, followed by a separate episode in which a Jogi and Guru Nanak test
    Sikh converts in a forest, where the Guru assumes a frightening guise and some
    Sikhs flee.
  language: English
