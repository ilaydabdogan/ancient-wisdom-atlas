canonical_text:
  quote: From fire and bubbles of water are we sprung; for what object were we created?
  summary: The passage opens with Guru Nanak composing a hymn while his parents and
    relations stand around him. The hymn questions human origin and purpose, addresses
    the Lord, lists created beings, describes theft and the impossibility of hiding
    from God, invokes pilgrimage places and worldly markets, imagines weighing one’s
    actions with a shopkeeper’s scale, laments sin and inner suffering, asks for mercy,
    and concludes that obedience to God’s order brings happiness. The narrative then
    says Kalu directs Nanak toward a mercantile life; Nanak sets out with a servant
    to buy trade goods and meets naked vow-bound holy men led by Santren.
  language: English
  quote_policy: quoted
