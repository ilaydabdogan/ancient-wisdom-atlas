canonical_text:
  quote: ''
  summary: The passage gives part of a Ramkali/Oamkar teaching attributed to the Guru,
    emphasizing the one God as creator, giver of knowledge, and savior through the
    divine word or name. It describes the letter O as a sign connected with God, recounts
    an unnamed Pandit's submission and becoming a Sikh after hearing the full Oamkar,
    notes visits by two young pandits at Banaras, and then describes the Guru proceeding
    to Gaya, a pilgrimage place associated with Buddha's renunciation and penance,
    where he replies to Brahmans.
