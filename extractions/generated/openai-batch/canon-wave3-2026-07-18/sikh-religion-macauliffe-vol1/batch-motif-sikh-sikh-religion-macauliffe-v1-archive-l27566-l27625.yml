canonical_text:
  quote: ''
  summary: The passage presents hymn stanzas in which the divine Beloved or God is
    obtained through the Guru's favour, found in the heart, and associated with absorption
    and the extinguishing of burning. It then warns against prayers for worldly advantage,
    describes fate under God's order, punishments and bonds for the wicked, the Word
    as a means to cross a terrible ocean, and the recognition of the pious in God's
    court.
