canonical_text:
  quote: ''
  summary: In a Guru's reply, a woman is urged to practice truth if she desires her
    Spouse. Ordinary boats or rafts cannot reach the distant Beloved. God is described
    as perfect, enthroned, and dwelling in a jeweled palace within a golden fortress.
    The Guru and God's name function as ladder, boat, raft, lake, sea, and sacred
    stream; bathing in the true tank brings purity if God wills. The passage says
    divine favor comes by devotion, while separation from the Spouse brings ruin,
    unrest, and grief without the Word.
  language: English
  quote_policy: summarized
