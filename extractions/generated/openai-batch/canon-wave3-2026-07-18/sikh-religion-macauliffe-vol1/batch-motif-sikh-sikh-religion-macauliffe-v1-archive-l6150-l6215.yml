  quote: There is but one God whose name is True, the Creator, devoid of fear and
    enmity, immortal, unborn, self-existent, great, and bountiful.
  summary: After Nanak has seen divine sovereignty, a voice addresses him. Nanak responds
    with humility and utters the preamble of the Japji. A voice again addresses him,
    linking divine mercy with Nanak's mercy and identifying him as the divine Guru.
    Nanak then sings a hymn using images of ocean and fish, Death as a fisherman with
    a net, and the divine gate as the only refuge.
