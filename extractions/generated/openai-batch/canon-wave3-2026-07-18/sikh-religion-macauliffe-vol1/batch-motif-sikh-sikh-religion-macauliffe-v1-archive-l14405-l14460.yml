canonical_text:
  quote: ''
  summary: Guru Nanak travels to Hasan Abdal, where Bawa Wali of Kandhar refuses water
    to the Guru and Mardana. Guru Nanak causes a stream to issue from the ground,
    after which the Wali's well dries. In anger, the Wali hurls the hillock at Guru
    Nanak, who raises his arm and arrests its fall, leaving a palm impression on the
    mass later known as Panja Sahib and revered by Sikhs. The passage then notes Guru
    Nanak's departure toward Gorakh-Hatari.
  language: English
