canonical_text:
  quote: ''
  summary: At Guru Nanak's death, Muslim and Hindu followers disagree over whether
    his body should be buried or cremated. Guru Nanak proposes a flower test to decide.
    He orders the Sohila to be sung, including imagery of praise, a bride, marriage,
    and meeting the Lord. After the Japji slok, he covers himself, utters 'Wahguru',
    makes obeisance to God, and is described as blending his light with Guru Angad's,
    the Guru remaining the same through a miraculous change of body. Notes explain
    death as marriage, bride-oil anointing, and the hymn's funeral use.
  language: English
  quote_policy: summarized
