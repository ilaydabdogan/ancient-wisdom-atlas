  summary: The passage presents Guru Nanak’s teaching on the superiority of repeating
    God’s name under the Guru’s instruction. It uses bridal imagery for the soul and
    God, describes God’s name as water that quenches four inner fires, and then gives
    a homily to the trader Ramu in which God’s praise is true merchandise accepted
    in the next world while counterfeit wares are rejected.
