  quote: ''
  summary: The passage contrasts the passing away of rulers, beings, worlds, and cosmic
    regions with the sole abiding reality of God. It describes God as the only source
    of maintenance, the giver to birds and humans, and the one who grants and removes
    power. It then reports Guru Nanak instructing Prem Chand of Sarhind that early-morning
    praise and single-hearted meditation are the best use of time, while later attention
    is distracted.
