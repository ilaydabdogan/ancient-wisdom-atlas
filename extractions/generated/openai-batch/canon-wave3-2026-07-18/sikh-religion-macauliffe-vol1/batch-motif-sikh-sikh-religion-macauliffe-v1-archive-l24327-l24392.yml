  quote: ''
  summary: A devotional voice laments separation from the Lord as Bridegroom and Beloved,
    describes bridal adornment, rejection, weeping, dream visitation, and an extreme
    offer of the speaker’s head to one who brings news of God. A following hymn, introduced
    as addressed to Hindus who value ablutions, contrasts bodily washing with truth
    in the heart, civil speech, attention to God’s word, and delight in the divine
    name.
