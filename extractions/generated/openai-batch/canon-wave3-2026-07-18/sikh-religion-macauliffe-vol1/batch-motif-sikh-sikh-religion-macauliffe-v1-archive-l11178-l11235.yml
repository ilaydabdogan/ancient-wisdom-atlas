canonical_text:
  quote: ''
  summary: The passage gives devotional instruction against empty mourning, says God
    remains and will awaken those laid to sleep, contrasts worldly wealth with true
    spiritual profit, and urges truth, virtue, the true Guru, and the Name. It then
    narrates Mardana asking Guru Nanak why many died in the Saiyidpur massacre when
    only some Pathans had done wrong. The Guru tells Mardana to sleep under a tree;
    while he sleeps, honey falls on him, ants come to drink it, and he half-consciously
    crushes them. The excerpt ends as the Guru asks him what he has done and Mardana
    begins to reply.
  language: English
