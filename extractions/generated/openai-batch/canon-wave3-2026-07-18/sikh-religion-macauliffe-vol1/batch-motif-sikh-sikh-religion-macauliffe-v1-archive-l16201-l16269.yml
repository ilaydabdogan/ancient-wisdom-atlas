canonical_text:
  quote: ''
  summary: 'Stanzas XIV-XVI praise obedience to God: it clears a person’s path, brings
    honorable departure and joyful progress, joins the person with virtue, and opens
    salvation for the person, family, Guru, and disciples. The elect are described
    as acceptable and honored in God’s court, as brightening royal courts, and as
    attending to the one Guru. Notes explain alternate readings involving transmigration
    and explain panch as literally five, associated with selection and a Hindustani
    proverb about God being present where five are assembled.'
