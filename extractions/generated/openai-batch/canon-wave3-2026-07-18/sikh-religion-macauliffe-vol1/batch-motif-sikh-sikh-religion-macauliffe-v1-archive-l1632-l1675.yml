canonical_text:
  quote: ''
  summary: 'The passage places the rise of Sikhism in a broad early modern historical
    setting, naming European cultural figures, rulers, navigators, and conquerors,
    then arguing that Europe and India shared a similar religious condition: learned
    religious authority was concentrated in priesthoods and classical languages, abuses
    followed, and reformers arose. It compares Luther and Calvin with Indian saints
    who denounced priestcraft, hypocrisy, and idolatry, and identifies Guru Nanak
    as founder of the Sikh sect. It also states that new religions are often explained
    as arising during periods of political or social depression, when people turn
    to the superhuman.'
  language: English
  quote_policy: summarized
