  summary: Guru Nanak teaches that another person's goods should be treated as forbidden,
    that lip service does not bring heaven, and that truth, right conduct, charity,
    good intentions, praise of God, and good works constitute true prayer and religious
    practice. The Qazi is astonished; the narrator says his prayer had become idle
    repetition while his mind was on worldly affairs. At afternoon prayer the company
    goes to the mosque, the Qazi begins the service, Guru Nanak laughs toward him,
    and the Qazi complains to the Nawab. The excerpt breaks off as Nanak begins to
    explain that the Qazi's prayer was not something further stated outside the supplied
    passage.
