  quote: ''
  summary: A hymnic and narrative passage describes ablution, purification by water,
    the benefits of rain, the image of Sikhs as rivers and the Guru as ocean, a Jain
    priest’s question about rainy-season travel, the Guru’s reply about beings helped
    or discomforted by Sawan rain, the priest’s conversion, dictation of hymns, and
    the Guru’s subsequent journey to a nameless ocean island ruled by a tyrant.
  language: English
  quote_policy: summarized
