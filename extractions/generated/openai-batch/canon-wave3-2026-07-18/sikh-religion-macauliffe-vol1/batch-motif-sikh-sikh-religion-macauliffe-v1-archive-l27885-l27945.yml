canonical_text:
  quote: ''
  summary: 'The passage presents brief hymnic teachings attributed to Guru Nanak:
    a section introduced as concerning widow concremation describes a widow who follows
    her husband in death and a woman struck by the news of her husband''s death, then
    speaks of God striking with an arrow of love. It continues with teachings on the
    frailty of the body as a fragile vessel made of five elements, the dependence
    of acceptance on God''s grace, the emptiness of pride without merit, and ethical
    definitions of a Brahman and a Khatri.'
