canonical_text:
  quote: ''
  summary: A didactic passage attributed to Nanak describes the marks of a true Jogi
    through restraint, service, quenching of passions, remembrance of God, divine
    knowledge, and repetition of the Name. It then says the Jogis wonder whether he
    is a Bairagi, and the Guru defines a Bairagi as one devoted to God, able to subdue
    mammon, perform worldly duties while thinking of God, and abandon wrath, avarice,
    and pride.
