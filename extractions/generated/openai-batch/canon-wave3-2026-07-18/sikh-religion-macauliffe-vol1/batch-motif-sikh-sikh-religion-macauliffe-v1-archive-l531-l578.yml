canonical_text:
  quote: ''
  summary: A prefatory passage introduces a translated address from the Singh Sabha
    of Amritsar. The address praises the recipient for long study of Sikh sacred books
    and repeated revision of an accurate translation, contrasts the work with Dr.
    Trumpp’s translation, frames the undertaking as induced by Akal Purukh, invokes
    Guru Teg Bahadur’s foretelling of helpers from beyond the seas, urges Sikhs to
    aid publication, and asks the recipient to avoid prejudicial writing and consult
    authoritative, uncorrupted works.
  language: English
  quote_policy: summarized
