canonical_text:
  quote: ''
  summary: 'A sequence of verses attributed to Guru Angad and Guru Nanak gives moral
    and devotional instruction: inner disposition matters more than lip-worship; falsehood
    and foolish companionship bear bad results; God must be approached by supplication
    rather than command; the servant-master relation is used to describe service,
    gift, obedience, love, reward, and punishment; God is limitless, creates and destroys,
    governs differing human conditions, fills human vessels, and regenerates those
    favored.'
  language: English
  quote_policy: summarized
