canonical_text:
  quote: ''
  summary: 'The passage recounts severe punishments associated with imperial rule:
    an unnamed authority orders whipping and further abuse of offenders; Khusrau rebels
    against his father Jahangir and is brought chained before him; Khusrau''s companions
    are tortured, executed, or publicly humiliated; other rebels are impaled while
    Khusrau is paraded between them. The passage also states that Jahangir later caused
    Guru Arjan to be tortured to death partly for religious reasons and partly for
    showing hospitality to Khusrau, and introduces Aurangzeb as a strict Muhammadan
    whose treatment of Hindus and temples will be described next.'
  language: English
  quote_policy: summarized
