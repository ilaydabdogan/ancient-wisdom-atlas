canonical_text:
  quote: After three days the Guru came forth from the forest.
  summary: The passage moves from a hymn on divine omnipresence and divine order to
    a narrative in which Guru Nanak emerges after three days, is thought by the people
    to have drowned and returned to life, gives away his possessions, and is interpreted
    by the Governor as abandoning the world. Later, people think Nanak is possessed;
    a Mulla attempts an exorcism with an amulet, but Nanak rebukes the selling of
    God's name, answers the charge of being a spirit or demon, and orders Mardana
    to play the rebeck.
  language: English
  quote_policy: quoted
