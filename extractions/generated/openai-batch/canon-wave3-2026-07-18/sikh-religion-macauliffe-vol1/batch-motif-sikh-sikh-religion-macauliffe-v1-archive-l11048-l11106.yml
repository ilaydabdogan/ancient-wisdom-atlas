canonical_text:
  quote: ''
  summary: The passage laments devastation and absent husbands, then frames suffering
    and happiness as subject to the Creator's will and allotted order. Guru Nanak
    then speaks of God fixing times and establishing cosmic regions, seas, worlds,
    qualities, ages, and lamps for the ages. The hymn presents all household-dwellers
    as God's slaves under religion, the earth as God's cooking-pot, destiny as storekeeper,
    and greed, demerit, wealth, and sin as forms of imprisonment, punishment, and
    judgment. Notes identify the fourteen-world scheme and the lamps with wider cosmological
    and scriptural references.
  language: English
  quote_policy: summarized
