  summary: A slok attributed to Guru Nanak declares worldly ranks, possessions, bodies,
    beauty, relationships, and sweetness false or passing, while God alone is not
    false. It then defines the true person as one with truth in the heart, cleansed
    from falsehood, loving the True One, hearing the Name, receiving true instruction,
    practicing mercy and charity, cultivating the body as a field for the Creator's
    seed, and dwelling in the pilgrimage of the heart.
