  text: The pious person is emancipated, avoids entanglements, and is delivered by
    meditation on the Word and God’s name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Many birds roost by night on a tree; some are happy and others unhappy; those
    whose minds have worldly love perish.
