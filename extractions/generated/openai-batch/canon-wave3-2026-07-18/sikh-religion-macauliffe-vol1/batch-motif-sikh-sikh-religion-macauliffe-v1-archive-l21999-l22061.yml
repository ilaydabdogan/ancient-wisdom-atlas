canonical_text:
  quote: ''
  summary: The passage presents the Guru’s reply about bondage, emancipation, absorption
    in the Imperishable, and liberation through the Name, Word, meditation, and meeting
    the Guru. It uses images of birds roosting on a tree and flying away, economic
    exchange, opened doors of understanding, and begins a dialogue in which the Soul
    warns the body about impermanence.
  language: English
  quote_policy: summarized
