  text: A question asks how a person is bound, obtains emancipation, and is absorbed
    in the Imperishable.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Guru replies that the Name is nectar in the heart and mouth and frees
    a person from worldly desires.
  category: speech
  evidence_refs:
