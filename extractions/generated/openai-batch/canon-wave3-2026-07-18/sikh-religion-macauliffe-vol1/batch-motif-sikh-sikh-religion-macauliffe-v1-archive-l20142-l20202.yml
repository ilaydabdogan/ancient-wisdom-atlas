  summary: The passage contrasts exclusion from and honor in God’s court, describes
    the Lord as a wise husbandman who sows the true Name, warns that rejecting the
    Guru’s doctrine leads to continued transmigration, uses the image of an adorned
    woman whose preparations are vain unless she pleases and loves her Spouse, and
    gives a brief creation sequence from the True One to air, water, and the three
    worlds.
