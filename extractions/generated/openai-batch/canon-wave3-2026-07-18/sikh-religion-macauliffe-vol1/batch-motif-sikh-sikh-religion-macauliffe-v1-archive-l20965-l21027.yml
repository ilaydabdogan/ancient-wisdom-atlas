  quote: ''
  summary: The hymn reflects on bodily mortality, the need for the Name and Guru’s
    instruction, the dreamlike nature of the world, and analogies of water, milk,
    mountain, and ocean to describe spiritual dependence and worldly difficulty. The
    speaker seeks divine happiness, meeting with God, and deliverance through the
    true Guru and God’s Name.
