  quote: But let me listen to Thy songs, O Beloved, if any will sit and sing them
    to me.
  summary: The passage explains Guru Nanak's learning as arising through contact with
    ascetics and religious men in the forests around Talwandi. It says he sought forest
    retirement and religious association, became acquainted with Indian religious
    teachings, and expressed a preference for listening to the Beloved's songs over
    other named practices. A note defines Jog as union of the soul with God and identifies
    Jogis as its practitioners.
