  quote: ''
  summary: The passage praises the wonder of God’s word, knowledge, creation, elements,
    nearness, and remoteness; attributes perception, creation, scripture, moral qualities,
    and material life to divine power; describes death, the soul’s departure, seizure
    by Death’s ministers, accounting of deeds, and judicial sentence; and states that
    winds, rivers, fire, earth, celestial bodies, divine beings, and humans exist
    in fear of God, while the Formless True One alone is without fear.
  language: English
