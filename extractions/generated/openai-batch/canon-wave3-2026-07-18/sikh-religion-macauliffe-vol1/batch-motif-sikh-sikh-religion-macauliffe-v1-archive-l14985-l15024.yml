  quote: There ought to be no lamentation for a man who was returning to his heavenly
    home
  summary: After Mardana's death, the Guru and his Sikhs consign his body to the river
    Ravi, read the Sohila for his repose, distribute karah parshad, and counsel his
    family not to mourn because he is returning to his heavenly home. Shahzada, Mardana's
    son, is invited to serve the Guru in his father's role. The passage then presents
    a slok attributed to Nanak against wine, using drinking and food imagery to contrast
    vice with good conduct, truth, God's name, merits, and modesty.
