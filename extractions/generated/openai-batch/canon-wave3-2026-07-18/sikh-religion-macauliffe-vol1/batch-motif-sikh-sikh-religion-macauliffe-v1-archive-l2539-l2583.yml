    of religion: fear of the elements leads primitive humanity to prayer and sacrifice;
    the Sun and fire receive worship; Vedic Indians address hymns to Agni while Greeks
    imagine fire stolen from heaven; agricultural life leads to invocation of sky
    powers in India and Greece, and the earth Prithwi is described as parent of sustenance.'
