    reward becomes charcoal after sin and a shopkeeper whose deserved impaling stake
    is reduced to a thorn through virtue. It states that destiny may be altered by
    virtue, after which two men fall at Guru Nanak's feet and become worshippers of
    God. Guru Nanak then recites verses using images of moral record-keeping, nets
    and bait, and a furnace with metal to describe conduct, sin, anxiety, and the
    transforming encounter with a Guru who bestows the name of the one God.
