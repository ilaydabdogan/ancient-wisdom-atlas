  quote: ''
  summary: The passage admonishes a morally negligent person who lacks virtue, forgets
    the divine Name, clings to wealth and family, and suffers transmigration, hell,
    ghostly existence, punishment by Death, and possible peril in a sea of terror.
    It contrasts these states with salvation through the Guru’s instruction, association
    with saints, and treasuring God’s name in the heart.
