canonical_text:
  quote: ''
  summary: A pandit is told that the woman he longed for was Maya, or worldly love,
    and that she was his guru. He returns to the Guru, falls at his feet, discards
    his books, repeats God’s name, and becomes humble. When he asks who is happy in
    this world, the Guru answers with sloks recorded by Hassu and Sihan, naming mythic
    and epic figures who wept after punishment, loss, exile, abduction, or enslavement.
  language: English
  quote_policy: summarized
