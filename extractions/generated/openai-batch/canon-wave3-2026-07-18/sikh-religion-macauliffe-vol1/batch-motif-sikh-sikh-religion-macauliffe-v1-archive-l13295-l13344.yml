  quote: ''
  summary: A hymnic teaching contrasts restless travel and worldly resting-places
    with attachment to the Name and the practice of sincerity. It lists religious
    specialists, heavenly beings, rulers, humans, and celestial bodies as going, departing,
    or passing away. Nanak declares God present in sea, land, and upper and lower
    regions, and says God alone is permanent while the world is transitory. The Pir
    is then convinced that the Guru is an exalted spiritual leader.
