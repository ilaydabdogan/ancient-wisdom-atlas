canonical_text:
  quote: There is no limit to God’s praises... Nobody knoweth His limits.
  summary: The passage praises God as limitless in praise, mercy, gifts, perception,
    creation, and inward mystery. It says human attempts to know God’s limits fail,
    while God alone knows His own greatness. It then describes God as a generous giver
    whose bounties cannot be recorded, with many beings begging, receiving, denying,
    sinning, eating, suffering, and dying in hunger; these conditions are also addressed
    as God’s gifts.
  language: English
  quote_policy: quoted
