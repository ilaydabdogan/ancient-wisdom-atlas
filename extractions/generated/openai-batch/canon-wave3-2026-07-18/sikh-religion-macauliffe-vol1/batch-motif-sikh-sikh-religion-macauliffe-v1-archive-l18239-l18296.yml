canonical_text:
  quote: ''
  summary: The passage exhorts a person to inquire from the true Guru, abide inwardly,
    use truth as a remedy for sin, seek the dust of the saints' feet, renounce covetousness,
    meditate on the Unseen One, and expect reward according to deeds. It contrasts
    truth with prevailing falsehood, uses seed and cloth-dyeing images for spiritual
    practice, and personifies greed, sin, falsehood, and lust as corrupt officials
    judging blind subjects.
