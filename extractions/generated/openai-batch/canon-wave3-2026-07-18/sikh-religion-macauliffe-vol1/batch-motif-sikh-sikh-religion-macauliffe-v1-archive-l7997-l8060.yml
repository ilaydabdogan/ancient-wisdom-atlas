canonical_text:
  quote: ''
  summary: Mardana reports to the Guru that a child has been born in the grain-dealer’s
    house. The Guru says the newborn is not a son but a creditor come to settle an
    account and will depart in the morning. The Guru then has Mardana play the rebeck
    and sings a hymn describing the child entering the womb by God’s order, praying
    within it, being born and departing naked, bearing destiny written by God, later
    forgetting meditation, and being dandled by its mother like Krishan in Yasodha’s
    house.
