canonical_text:
  quote: ''
  summary: The passage describes Bhai Budha’s early association with Guru Nanak, his
    custodianship of the Granth Sahib under Guru Arjan, and his appointment to impress
    the saffron tilak of Gurudom on Gurus’ foreheads. It then recounts Mani Singh’s
    meeting with Guru Gobind Singh, his humble cleaning of vessels, the Guru’s promise
    that his understanding would brighten, and his baptism and lifelong service. A
    note explains the title “Bhai” as brother and connects it with Guru Nanak’s teaching
    on brotherhood.
  language: English
  quote_policy: summarized
