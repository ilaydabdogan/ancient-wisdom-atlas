canonical_text:
  quote: ''
  summary: The passage contrasts inward impurity with outward respectability and inward
    richness with outward poverty. It describes devotees who love God, depend on God
    for food, and care only for the true Master. It then presents a single divine
    court where accounts are examined and the wicked are punished. In Pauri XX, God
    is addressed as creator and empowerer of the world, the world is likened to a
    game of losing and winning dice, and humans are urged to remember the Lord who
    owns life and soul and to arrange their own affairs.
  language: English
  quote_policy: summarized
