canonical_text:
  quote: ''
  summary: A translated passage presents brief Guru Nanak hymnic teachings on God’s
    control over body and soul, worldly pleasure and suffering, the True Guru’s settlement
    of disputes, and the Creator’s effective will. It then narrates Guru Nanak’s rebuke
    of a Qazi at Sultanpur, including a scene in which the Qazi wipes goat blood from
    his garments before prayer and Nanak contrasts external blood pollution with inner
    moral impurity and purity of heart. The passage ends with Nanak answering the
    Qazi’s identity question by saying he is nobody and nothing.
