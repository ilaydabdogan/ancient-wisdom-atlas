canonical_text:
  quote: Make mercy thy cotton, contentment thy thread, continence its knot, truth
    its twist.
  summary: The passage contrasts a material janeu or sacred thread put on by a Brahman
    with an inward thread for the soul made of mercy, contentment, continence, truth,
    and praise of the Name. It says the material thread falls away at death, is replaced
    when old, and does not cover wrongful acts or excluded bodies, while the true
    thread is durable and fit for entrance into God's court.
  language: English
  quote_policy: quoted
