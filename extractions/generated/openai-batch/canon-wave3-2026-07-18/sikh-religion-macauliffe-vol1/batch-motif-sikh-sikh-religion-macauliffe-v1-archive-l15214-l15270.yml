  quote: ''
  summary: Sikhs who deserted Guru Nanak regret stopping after finding lesser money,
    and the Guru composes a didactic verse on moral accountability, deceptive attachment
    to Maya, death, judgment, God's greatness, many inhabited worlds, and divine favor
    toward the lowly. The passage then begins a visit by the successor of Pir Baha-ul-Din
    with followers.
