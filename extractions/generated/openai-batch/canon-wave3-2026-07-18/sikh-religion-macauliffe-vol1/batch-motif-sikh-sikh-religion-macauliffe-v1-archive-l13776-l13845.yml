canonical_text:
  quote: ''
  summary: Nanak defines a Bairagi as one marked by contentment, inward devotion to
    God, breath control, mastery of the senses, and renunciation of evil. Followers
    of Gorakhnath urge the Guru to adopt the style of a Jogi and describe external
    Jogi signs. The Guru responds by replacing those external signs with inward spiritual
    qualities, teachings, and contemplative practices, including the soul’s union
    with the Supreme Essence.
  language: English
  quote_policy: summarized
