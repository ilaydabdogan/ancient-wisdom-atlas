canonical_text:
  quote: In this way shall he cross the ocean. And thus be dead while alive.
  summary: Questions are put to Guru Nanak about a gate, crossing an ocean, and being
    dead while alive. The Guru replies with allegorical images of sorrow, wrath, hope,
    anxiety, Mammon, domestic life, truth, desirelessness, and meeting the one God.
    Afterward he is pressed to adopt the style and religion of a Jogi, and he answers
    by identifying his meditation, horn, begging-wallet, and alms with the Word, divine
    instruction, honour, and uttering the Name. The passage ends with a statement
    about Gorakh lifting and fashioning the earth.
  language: English
  quote_policy: quoted
