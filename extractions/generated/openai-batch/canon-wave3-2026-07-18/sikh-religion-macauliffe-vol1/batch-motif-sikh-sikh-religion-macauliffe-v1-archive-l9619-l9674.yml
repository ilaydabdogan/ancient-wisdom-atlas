  quote: "“Shaikh Brahm, God is in thee.”"
  summary: Shaikh Brahm reflects anxiously on claiming to have dined while actually
    fasting. Guru Nanak praises his tender conscience, tells him God is within him,
    and answers his question about finding God with a hymn on the true Lord, the Omnipotent
    Spouse, the Guru’s word, spiritual virtues, universal praise, truth, understanding,
    and final blending with the true King.
