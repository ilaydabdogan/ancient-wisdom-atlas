canonical_text:
  quote: ''
  summary: A hymn presented as instruction to Taru and Bharu at the Baisakhi fair
    at Kartarpur teaches renunciation of vices, freedom from superstition, inner light
    revealed by the perfect Guru, salvation through meeting the true Guru and God,
    devotion to the divine Name, release from rebirth, and the subordination of Death
    to those who repeat God's name under the Guru's guidance.
