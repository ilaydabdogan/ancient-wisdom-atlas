  summary: A prefatory endorsement reports that learned Sikhs reviewed Macauliffe’s
    translation of hymns from the Granth Sahib, corrected or accepted passages after
    discussion, and declared the translation revised, correct, literal, and conformable
    to Sikh tenets. The endorsers ask Sikh leaders and learned persons to read or
    hear it, benefit from the instruction of the Gurus, and aid the translator. The
    narrator then reports receiving similar supportive documents and cites the beginning
    of a statement from The Khalsa calling the publication a new era.
