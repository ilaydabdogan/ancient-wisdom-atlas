canonical_text:
  quote: ''
  summary: 'Nanak is offered homage and temporal authority but does not accept temporal
    possessions. He replies to religious men with a hymn using dyeing and bridal imagery:
    the body is steeped in worldliness and avarice, the Name is imagined as dye, God
    as the Dyer, and the deity as Spouse or Bridegroom. After the hymn, faqirs kiss
    the Guru’s feet, the Governor and the people come to salute and take leave, and
    complaints about Nanak’s storekeeping are investigated.'
  language: English
  quote_policy: summarized
