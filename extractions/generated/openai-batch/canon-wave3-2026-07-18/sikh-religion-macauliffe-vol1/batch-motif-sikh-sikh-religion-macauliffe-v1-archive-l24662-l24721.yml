canonical_text:
  quote: ''
  summary: 'The passage presents devotional instruction: God alone is beyond destiny
    and is present within and without; the hearer is told to repeat God''s name, worship
    under the Guru''s instruction, restrain the mind, behold the Invisible, drink
    nectar, praise God, and escape rebirth. It then introduces a Sorath Ashtapadi
    in which the Guru rejects idolatry and describes an ideal renouncer who avoids
    mammon, tombs, cremation places, and greed-driven worship, while finding God in
    the speaker''s own home.'
  language: English
  quote_policy: summarized
