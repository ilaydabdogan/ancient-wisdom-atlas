  summary: Two hymn sections teach domestic devotion and devotion regardless of worldly
    opinion. The speaker locates the sacred search in the heart, says the true Word
    abides there, sees God everywhere, describes access to God's court through Guru-related
    work, God's will, God's name, praise, and service, and warns that occasional service
    is like embarking in a stone boat and drowning with one's cargo.
