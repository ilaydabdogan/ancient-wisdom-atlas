canonical_text:
  quote: ''
  summary: 'The passage describes circumstances leading to Nanak’s departure for Sultanpur:
    Jai Ram promises to care for him and find him work; Nanak gives a brass drinking
    vessel and a gold wedding ring to a visiting faqir, angering his parents; Kalu
    permits him to go to join Jai Ram and Nanaki. Nanak’s wife grieves at his planned
    journey and asks to accompany him, but he tells her he will send for her if he
    can earn a living. Rai Bular gives Nanak a banquet and offers to grant him a favor
    before he departs.'
  language: English
  quote_policy: summarized
