canonical_text:
  quote: ''
  summary: A hymn says the Creator hears a beggar at God’s gate, may console or repulse
    him, knows virtues rather than caste, acts and causes action, created and bestows,
    and can dwell in the heart by the Guru’s favour so that suffering and ignorance
    depart. It says God gives truth to those loved by God and that such a person will
    face no inquiry hereafter. A following hymn, addressed to a votary of Krishan
    worshipping with music and dancing, recasts dance and musical instruments as understanding,
    love of God, praise, truth, contentment, vision of God, and exclusive love for
    God.
  language: English
  quote_policy: summarized
