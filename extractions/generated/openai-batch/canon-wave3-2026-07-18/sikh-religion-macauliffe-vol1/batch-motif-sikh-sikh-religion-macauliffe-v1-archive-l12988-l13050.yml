canonical_text:
  quote: ''
  summary: Guru Nanak teaches that through the Guru a person obtains real life, reaches
    God's home, is absorbed in the True One, and obtains deliverance. He contrasts
    those who remember and serve God through the Guru with those who forget the Name,
    go astray in worldly love and superstition, lose honour, go to hell, and wander
    in birth and death. The passage affirms one God, described as the True One, the
    Bright One, and the Lord who shows the way and causes service to be done.
  language: English
  quote_policy: summarized
