canonical_text:
  quote: ''
  summary: A hymn addresses the Lord as wise, far-seeing, and the giver of wisdom.
    It describes the Word entering the heart, the true devotee seeing divine light
    within, and the true Bairagi as one who treasures the Word, restrains the mind,
    abandons desire, contemplates at home, and is nourished by the Name. The hymn
    also states that the Lord owns the world, grants greatness to the holy, bears
    exalted names, and that all born beings have destinies recorded on their foreheads.
  language: English
