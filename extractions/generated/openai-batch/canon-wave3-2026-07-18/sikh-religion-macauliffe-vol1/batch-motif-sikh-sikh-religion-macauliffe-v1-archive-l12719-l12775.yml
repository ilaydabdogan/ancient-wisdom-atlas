canonical_text:
  quote: ''
  summary: A devotional passage attributed to Nanak names sacred waters and pilgrimage
    places, then states that alms, charity, worship, and bathing at pilgrimage places
    are contained in or fulfilled through God's name. The speaker describes God's
    love, self-effacement, an invitation for the Lord to come home, bridal adornment
    for the Beloved, union with God through the Guru, and calendar time becoming pleasant
    when the True One meets the speaker. Footnotes identify Tribeni Priyag, the Saraswati,
    the sixty-eight Hindu pilgrimage places, and Hindi time units.
  language: English
