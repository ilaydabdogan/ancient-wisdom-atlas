canonical_text:
  quote: From water gems arose when Meru was made the churning staff.
  summary: Guru Nanak arrives at a Jain temple. The Jain priest Narbhi, accompanied
    by a disciple, questions him about eating corn, drinking water, shaking trees
    for fruit, and the destruction of life. Nanak replies with a hymn on the mercy
    of the True Guru, then criticizes Jain practices and invokes divine power over
    animal life. The passage also alludes to Meru used as a churning staff and a note
    identifies the allusion with the Hindu ocean-churning myth.
  language: English
  quote_policy: quoted
