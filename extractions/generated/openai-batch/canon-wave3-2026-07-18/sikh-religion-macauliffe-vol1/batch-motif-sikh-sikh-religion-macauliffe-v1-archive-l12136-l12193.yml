canonical_text:
  quote: Man is like the fish upon which the net falleth unawares.
  summary: A child speaks about the uncertainty of living to old age, and the Guru
    praises the child’s wisdom before composing verses. The verses use fish, net,
    hawk, huntsman, noose, and bait images to teach that death is inescapable, that
    the Guru and God’s name save, that the True One is to be obeyed and meditated
    on, and that supplication to the true Guru unites one with the Friend.
  language: English
  quote_policy: quoted
