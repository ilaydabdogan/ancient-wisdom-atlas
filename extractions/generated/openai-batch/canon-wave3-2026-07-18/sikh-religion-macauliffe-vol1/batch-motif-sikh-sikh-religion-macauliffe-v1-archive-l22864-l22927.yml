canonical_text:
  quote: ''
  summary: 'The passage first presents devotional instruction using the image of a
    dance shaped by fear of God, awareness that the body becomes ashes, and repetition
    of the true Name heard from the Guru. It then introduces a hymn meant to show
    God''s superiority to Ram and Krishan: God creates and upholds the cosmos, bounds
    water and fire, pervades and loves creatures, and exceeds feats such as the slaying
    of Rawan, the subduing of the black serpent of the Jamna, the slaying of Kans,
    Brahma''s attempt to measure God''s greatness, and the churning of the sea of
    milk.'
  language: English
  quote_policy: summarized
