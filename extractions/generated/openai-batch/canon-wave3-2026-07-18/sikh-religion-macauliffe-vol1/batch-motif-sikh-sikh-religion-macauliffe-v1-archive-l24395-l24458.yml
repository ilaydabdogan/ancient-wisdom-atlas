  quote: ''
  summary: The passage praises God's name as sweet and relieving sorrow, teaches acceptance
    of God's will and allotment of life according to past acts, states that God's
    Name surpasses alms and good works, and presents a question about why the ever-present
    God is not visible. The Guru replies that the Lord creates and reabsorbs the world,
    is not distant but in every heart, is known through the Guru's instruction, and
    is approached through meditation on the Name.
