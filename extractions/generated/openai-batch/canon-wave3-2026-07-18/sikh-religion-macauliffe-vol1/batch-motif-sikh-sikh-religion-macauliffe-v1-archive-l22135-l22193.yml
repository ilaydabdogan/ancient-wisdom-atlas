canonical_text:
  quote: ''
  summary: 'The passage presents hymnic reflections attributed to Guru Nanak: God
    owns souls and bodies and controls killing and reanimation; five deadly sins plunder
    the embodied soul and Death captures it; sinners go bound to Death''s city; and
    Guru Nanak replies to Kinganath Jogi by redefining yogic signs and disciplines
    as inner restraint, purified heart, and subjection of the senses rather than external
    ritual acts.'
  language: English
  quote_policy: summarized
