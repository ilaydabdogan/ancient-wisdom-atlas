canonical_text:
  quote: "“The soul thus passes from body to body in a revolving wheel”"
  summary: The passage explains Sikh ontology in which the individual soul enters
    bodies, carries acts and a subtle covering, transmigrates until purified, and
    ultimately blends with the Absolute. It defines Paramatama as the pervading supreme
    spirit and Jivatama as an emanated individual soul, both represented as light,
    and uses water, ocean, glass, thread, and wheel imagery to explain embodiment,
    transmigration, and Nirvan.
