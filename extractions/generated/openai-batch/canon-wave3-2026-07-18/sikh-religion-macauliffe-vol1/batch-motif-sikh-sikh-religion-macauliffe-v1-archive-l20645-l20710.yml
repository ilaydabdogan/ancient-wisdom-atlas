canonical_text:
  quote: ''
  summary: 'The passage instructs the human listener to love God through a series
    of natural analogies: fish needing water, the chatrik longing only for rain, water
    protecting milk by being consumed in boiling, and the chakwi longing through night
    for the sun and absent mate. It contrasts the pious, who perceive God and receive
    devotion, with the perverse, and says God’s worth is known through the Guru’s
    instruction.'
  language: English
  quote_policy: summarized
