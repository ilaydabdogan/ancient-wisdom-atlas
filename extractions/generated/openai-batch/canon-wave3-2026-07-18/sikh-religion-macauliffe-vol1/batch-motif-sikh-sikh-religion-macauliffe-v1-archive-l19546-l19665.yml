    while those who meet the true society obtain the relish of God and the manifestation
    of the Name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The addressed soul or man is told not to be anxious about exertion because
    God Himself is active on its behalf.
