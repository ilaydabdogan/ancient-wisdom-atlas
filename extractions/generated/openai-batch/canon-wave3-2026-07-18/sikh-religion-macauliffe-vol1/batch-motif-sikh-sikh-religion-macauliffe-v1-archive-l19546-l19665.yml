  text: Under the Guru’s instruction, the Name is described as the helper of the soul,
    and singing God’s praises is described as an occupation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men of God are described as fortunate when they have faith in God and thirst
    for Him; obtaining God’s Name satisfies them, and meeting the saints makes God’s
    attributes known.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who do not obtain the relish of God’s Name are described as unfortunate
    and as going to the god of death.
  category: sequence
  evidence_refs:
  - ev:1
