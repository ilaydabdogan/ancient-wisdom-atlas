canonical_text:
  quote: ''
  summary: A Rahiras passage praises the Name of God, Guru instruction, and the society
    of saints. It contrasts those who obtain the Name with those who lack its relish
    and go to the god of death. It teaches trust in God’s provision by citing insects
    in rocks and stones, abandoned young birds, and daily food for all. It also praises
    God as pure, inaccessible, illimitable, creator, provider, pervader of every heart,
    giver, enjoyer, and source of all roles.
  language: English
  quote_policy: summarized
