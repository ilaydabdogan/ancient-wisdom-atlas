canonical_text:
  quote: Nanak is hungry for God, and careth for naught besides.
  summary: In an encounter with a monarch, Guru Nanak refuses a present and says he
    seeks only God. He continues wandering, visits Bindraban, watches a Krishanlila
    play representing Krishan's exploits, and expresses dissatisfaction with the performance.
    His verses contrast theatrical religious spectacle with worship of the Fearless
    Formless One and knowledge obtained through the Guru's instruction. A footnote
    identifies Krishan within Hindu tradition.
  language: English
  quote_policy: quoted
