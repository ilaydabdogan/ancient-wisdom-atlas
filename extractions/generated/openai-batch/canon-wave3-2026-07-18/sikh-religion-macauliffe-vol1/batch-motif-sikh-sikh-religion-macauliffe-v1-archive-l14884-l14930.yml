canonical_text:
  quote: ''
  summary: A high priest challenges Guru Nanak to show his power, and the Guru is
    said to show the priest's son upper and lower regions described in the Japji.
    After completing his western mission, the Guru returns, visits Multan, answers
    a symbolic brimful cup of milk with a jasmine flower that does not overflow it,
    and later reaches Kartarpur with his minstrel. There he lays aside pilgrim dress,
    puts on worldly garments to discourage exclusive asceticism, sits on his religious
    stool, and preaches.
  language: English
  quote_policy: summarized
