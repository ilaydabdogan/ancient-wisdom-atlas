canonical_text:
  quote: ''
  summary: 'A Shaikh asks Guru Nanak what religious sect he belongs to and later asks
    about the sect of his loin-cloth. Nanak answers in first-person devotional and
    ascetic imagery: he is a disciple under his Guru, grasps the Word in his heart,
    speaks of a stole, hat, and loin-cloth as inner practices, restrains the senses,
    closes the body''s gates, contemplates in the body''s chambers, drinks from the
    brain''s waterfall, and exchanges low intelligence for the Guru''s wisdom. Translator
    notes identify Nanak''s Guru as God and explain several body and yogic images.'
  language: English
  quote_policy: summarized
