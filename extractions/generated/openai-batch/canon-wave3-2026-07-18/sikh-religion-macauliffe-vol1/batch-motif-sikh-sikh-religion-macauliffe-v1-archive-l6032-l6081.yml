  quote: ''
  summary: The passage gives an instruction to worship God when human strength fails,
    then narrates Guru Nanak's appointment as storekeeper under Daulat Khan through
    Jai Ram's introduction. Nanak performs his duties well, gives most of his allotted
    provisions to the poor, sings hymns at night, pauses over the counting word 'tera'
    because it also means 'Thine,' gathers Mardana and other friends around him, and
    practices early ablutions at the Bein river. The final sentence in the provided
    passage begins to say that one day after bathing Nanak disappeared, but the line
    is truncated.
  language: English
