canonical_text:
  quote: "“Repeating God’s name, form a raft for thy salvation”"
  summary: Guru Nanak gives religious instruction about purity, death-in-life, and
    a self-sounding horn; the Sidhs honor him after a pipal-tree is revived by his
    presence. Guru Nanak and Mardana then travel to Banaras, where Pandit Chatur Das
    questions Nanak’s saintship because he lacks Hindu devotional objects. Nanak replies
    by critiquing reliance on the salagram and basil necklace and by teaching that
    repetition of God’s name forms a raft for salvation. Footnotes explain Banaras,
    the salagram, and the basil necklace’s Vishnu association.
  language: English
  quote_policy: quoted
