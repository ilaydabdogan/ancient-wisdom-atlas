canonical_text:
  quote: ''
  summary: Guru Nanak goes to Ceylon and sits in Raja Shivnabh's garden, which is
    said to become green after being barren. A gardener reports this to the king.
    The king sends beautiful women to dance before and tempt the Guru, but the Guru
    remains inwardly absorbed and does not respond. The king questions him about name,
    caste, and whether he is a Jogi, Brahman, shopkeeper, Hindu, or Muhammadan; the
    Guru answers with spiritual definitions centered on the Name, divine knowledge,
    the One God, and the resolution of two ways.
  language: English
  quote_policy: summarized
