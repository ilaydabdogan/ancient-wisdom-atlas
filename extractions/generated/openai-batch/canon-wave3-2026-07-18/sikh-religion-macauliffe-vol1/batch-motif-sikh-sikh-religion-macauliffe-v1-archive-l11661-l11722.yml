  quote: ''
  summary: 'The passage describes sinners who lack the true Name suffering severe
    punishments involving hammers, spikes, heat, fire, a pillar, a furnace, sand,
    and a caldron. It says God pardons. It then presents the soul as accountable for
    degrading pleasures: bodily organs and senses testify in court, while the arrested
    soul in Death''s court blames the senses for leading the world astray. A note
    identifies Dharmraj with Pluto of Greek mythology.'
