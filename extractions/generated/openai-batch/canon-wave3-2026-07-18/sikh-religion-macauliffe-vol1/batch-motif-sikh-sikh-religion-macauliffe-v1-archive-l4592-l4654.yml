  summary: A verse attributed within the passage to Nanak speaks of God’s mercy, the
    limits of worldly status, death, and the necessity of the Name. The schoolmaster
    recognizes Nanak as a perfect saint. Nanak leaves school for private study and
    meditation, remains for long periods in one posture, and associates with religious
    men. Editorial notes explain the use and repetition of the divine Name and compare
    it to an ancient Jewish divine-name practice.
