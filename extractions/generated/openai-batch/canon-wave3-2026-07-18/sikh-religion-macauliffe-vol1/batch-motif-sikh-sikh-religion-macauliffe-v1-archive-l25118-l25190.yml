  quote: ''
  summary: The passage defines true religious identity and wisdom through reflection
    on God, inner cleansing, and enacted reading. It contrasts love, service, and
    remembrance of the Name with idolatry, pilgrimage, penance, garb, and wandering.
    It presents God as manifest, creator of the body, giver of gifts, judge, True
    One, and Spouse; outcomes include honour, punishment, transmigration, absorption
    in God, or rejection through falsehood.
