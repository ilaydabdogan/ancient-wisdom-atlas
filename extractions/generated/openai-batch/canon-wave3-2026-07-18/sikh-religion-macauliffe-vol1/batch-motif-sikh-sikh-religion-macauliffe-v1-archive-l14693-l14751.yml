canonical_text:
  quote: ''
  summary: 'A high priest asks Guru Nanak whether Hindus who read the Veds and Muslims
    who read the Quran will find God. Nanak replies with a hymn attributed to Kabir
    that criticizes reliance on scriptures, urges restraint of the mind and inward
    searching, describes the world as a magic show, states that the Creator is contained
    in creation, rejects identifying God with a blue Vishnu form, and speaks of a
    heavenly river. The high priest then asks how God may be obtained, and Nanak answers:
    by humility and prayer, introducing a Persian supplication.'
