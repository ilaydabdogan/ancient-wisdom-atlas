canonical_text:
  quote: ''
  summary: Guru Nanak speaks of God assigning different stations to people, dispensing
    true justice, and foretelling violent events in Hindustan. Lalo asks the Guru
    to explain, and the Guru replies with examples of God's power to reverse natural
    order, alter landscapes, exalt a worm to sovereignty, destroy an army, and sustain
    creatures without breath. A Brahman then offers fruit, calls the Guru's hymns
    wrathful, and is told by the Guru to leave with his family for a pool three miles
    away; the passage breaks off while warning about those who remain.
  language: English
