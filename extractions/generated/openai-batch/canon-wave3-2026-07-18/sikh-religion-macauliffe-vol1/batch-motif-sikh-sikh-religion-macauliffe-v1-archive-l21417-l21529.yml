  quote: ''
  summary: Verses attributed to Guru Nanak declare continuing praise of God under
    hypothetical powers, austerities, and heavenly enjoyments; reject reliance on
    caste; describe obedience and reflection through a mounted-cavalry allegory; explain
    a mill allegory in which attachment to God protects the soul; compare good people
    to processed sugar-cane; and give analogies for the uselessness of instructing
    a fool. Notes identify Rahu and Ketu as pain-inflicting eclipse demons and explain
    the mill allegory.
