canonical_text:
  quote: ''
  summary: The passage teaches that deliverance comes through meditation on the Word,
    utterance of God’s name, and the Guru’s guidance to God’s abode. It describes
    transformation by divine light, God’s pervasion and support of the cosmos, the
    contrast between folly and good association, the Name as unfailing treasure, God’s
    assay and blessing glance, and an admonition to a hypocritical Jogi about outward
    religious performance without inward purity.
