  summary: A hymn attributed to Guru Nanak asks about the divine gate or mansion where
    God sits and watches over all things. It describes countless instruments, musicians,
    measures, and singers praising God, including wind, water, fire, Dharmraj, recording
    angels, named deities, gods, meditative and holy figures, sages reading the Veds,
    heroes, and celestial maids in the upper, middle, and nether regions.
