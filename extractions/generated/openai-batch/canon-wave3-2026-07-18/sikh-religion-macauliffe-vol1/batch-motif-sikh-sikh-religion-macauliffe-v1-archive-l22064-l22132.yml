canonical_text:
  quote: What pleaseth God shall be done.
  summary: A hymn presents a dialogue between the soul and the body, each accusing
    the other of moral faults and warning of death, loss of human opportunity, and
    consequences in the next world. The passage contrasts worldly possessions, sweetness,
    buildings, and famous golden property with the enduring value of God's Name and
    concludes with God as a great Merchant and humans as retail-dealers.
  language: English
