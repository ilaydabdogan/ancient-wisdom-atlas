canonical_text:
  quote: ''
  summary: Guru Nanak teaches remembrance of the Lord, the inevitability of departure
    from the world, moral consequence in the next world, the world as illusion, the
    Creator's pervasive and limitless nature, and the difference between devotional
    weeping and vain worldly grief. After the assembled crowd sings mourning songs,
    the Guru falls into a trance. Upon waking, his sons ask what provision has been
    made for them after seeing a stranger appointed successor, and Nanak replies that
    God provides for His creatures.
  language: English
