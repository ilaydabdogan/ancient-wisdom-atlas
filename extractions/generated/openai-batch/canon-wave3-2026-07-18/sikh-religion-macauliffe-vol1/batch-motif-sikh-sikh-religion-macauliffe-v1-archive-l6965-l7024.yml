canonical_text:
  quote: ''
  summary: Guru Nanak’s discourse criticizes a Brahman/Pandit for ignorance and for
    inconsistent judgments about flesh, ritual purity, offerings, heaven, and hell.
    The passage states that living beings arise from flesh and that crops and the
    three worlds are deemed to have sprung from water. The narrative then says the
    Guru made many converts at Kurkhetar and, on departing, instructed his Sikhs to
    live harmoniously, utter the Creator’s name, reply with “Sat Kartar,” and pursue
    holy companionship, truth, contentment, and restraint of the senses as ways to
    reach God.
