canonical_text:
  quote: ''
  summary: 'The passage states that God can bestow virtue, while no one can bestow
    virtue on God. Stanzas VIII-X repeatedly describe the effects of hearing the divine
    Name: becoming like exalted spiritual or divine figures, gaining cosmological,
    yogic, bodily, scriptural, and divine knowledge, escaping death, sorrow, and sin,
    receiving honour, and gaining a benefit equal to bathing at sixty-eight pilgrimage
    places.'
  language: English
  quote_policy: summarized
