canonical_text:
  quote: ''
  summary: Guru Nanak returns to India and goes to Achal Batala during the Shivrat
    fair to preach. Crowds come to see and hear him and give offerings. The Jogis
    become jealous, and their superior Bhangarnath challenges Nanak about living as
    a householder and about not displaying miracles. Nanak answers with a critique
    of empty renunciation and says he has no miracle except the True Name.
  language: English
