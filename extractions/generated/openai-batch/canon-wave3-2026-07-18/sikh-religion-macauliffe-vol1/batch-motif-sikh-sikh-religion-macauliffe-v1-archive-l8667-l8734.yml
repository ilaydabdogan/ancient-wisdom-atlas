canonical_text:
  quote: ''
  summary: A hymn attributed to Guru Nanak uses the image of a woman seeking her Spouse
    or Bridegroom. The unhappy woman cannot gain entrance or obtain the Bridegroom
    by striving, cleverness, pride, or attachment to mammon. The happy wives explain
    that the Spouse is obtained by accepting what He does, worshipping His feet, obeying
    His bidding, giving body and soul, and effacing oneself. A wife who pleases the
    Spouse becomes favored, happy, absorbed in love, and wise. Notes identify the
    Spouse as God and the valued wealth as salvation or love.
  language: English
  quote_policy: summarized
