canonical_text:
  quote: ''
  summary: Mardana asks Guru Nanak about Kaljug and its signs. The Guru describes
    signs of Kaljug as moral and religious disorder. Kaljug then offers the Guru worldly
    wealth, luxury, women, miraculous power, and sovereignty if he will abandon his
    mission. The Guru rejects the offer, saying he has renounced sovereignty, and
    utters a stanza praying not to forget God amid luxury and affirming that there
    is no shelter but God.
