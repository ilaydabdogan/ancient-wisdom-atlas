  quote: "“The mere repetition of his name can confer salvation.”"
  summary: A shopkeeper tells Raja Shivnabh that he has gained salvation by beholding
    a great being, identifies that person as Guru Nanak, translates one of the Guru’s
    hymns, and advises the Raja to meditate inwardly on Nanak. The shopkeeper departs
    by ship from Ceylon to India, while the Raja remains at home thinking of the Guru
    and longing to behold him.
