canonical_text:
  quote: ''
  summary: The passage says that God creates ordered time, elemental and cosmic regions,
    establishes earth as a temple, places diverse living beings in it, and judges
    them according to their acts in a true court where good and bad are distinguished.
    It then describes the realm of knowledge through a catalogue of innumerable winds,
    waters, fires, deities, worlds, forms, lands, mountains, heavenly bodies, ascetics,
    goddesses, demons, saints, seas, languages, rulers, knowers, and worshippers,
    with no end to them.
  language: English
  quote_policy: summarized
