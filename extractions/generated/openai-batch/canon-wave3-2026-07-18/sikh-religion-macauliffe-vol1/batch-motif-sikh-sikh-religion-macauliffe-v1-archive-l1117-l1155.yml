canonical_text:
  quote: ''
  summary: The preface states that the work includes a few comparisons between Sikh
    teachings and other sacred and profane literature; explains that Janamsakhi writers
    lacked maps and sometimes gave the Gurus impossible itineraries, so the author
    revised travel accounts according to Indian geography and invites learned Sikh
    corrections; and notes that the Raja of Nabha funded European notation of thirty-one
    Indian rags associated with the Gurus' hymns, collected with difficulty by Mahant
    Gaja Singh.
  language: English
  quote_policy: summarized
