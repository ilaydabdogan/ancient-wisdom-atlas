canonical_text:
  quote: I have no other gate than Thine
  summary: The hymn says that devotion to God, the Name, and the true Guru’s instruction
    free a person from entanglements. It contrasts this with religious discussions,
    pride, worldly love, pursuit of supernatural power, wandering, scriptural learning,
    austerities, pilgrimage, and bodily restraint when these lack inner knowledge
    and Guru-directed practice.
  language: English
  quote_policy: quoted
