canonical_text:
  quote: ''
  summary: A sequence of Sikh devotional verses presents warnings about fire, the
    value of uttering God’s name, the soul’s departure from the body, and the irreversibility
    of embodiment. The Guru replies with a hymn using images of a devotional raft
    crossing a stream, a robe dyed with the Lord’s name, the devotee as one arrayed
    to meet the Bridegroom, union with the True One, and the end of transmigration.
    Shaikh Brahm then speaks about heartfelt love for God and the falseness of divided
    speech and intention.
  language: English
  quote_policy: summarized
