canonical_text:
  quote: ''
  summary: Opening portions of the Japji state that repeated thinking, silence, worldly
    abundance, and many devices do not by themselves obtain God. The passage asks
    how a person becomes true before God and answers that one walks according to the
    preordained will of the Commander. It then describes all bodies, souls, status,
    pain, pleasure, reward, and transmigration as governed by God's order, and says
    that understanding this order removes egoism. A following stanza asks who can
    sing God's power, gifts, or signs. Editorial notes provide alternate explanations
    and one comparison to a Greek temple inscription.
