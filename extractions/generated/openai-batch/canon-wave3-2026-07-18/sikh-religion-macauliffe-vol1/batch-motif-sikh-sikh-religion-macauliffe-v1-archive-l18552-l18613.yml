  summary: The passage contains a couplet contrasting outward bowing with an impure
    heart; an editorial note says Guru Nanak composed a hymn at Banaras during discussion
    with local pandits who urged Hindu-style dress. The hymn criticizes ritual actions,
    false speech, stone worship, Gayatri recitation, and ritual dress, concluding
    that without the true Guru the way is not found. A following pauri, said by some
    to address Sultan Ibrahim Khan Lodi, describes death as leaving beauty and raiment,
    receiving the fruit of good or bad deeds, proceeding on a narrow road, being sent
    naked to hell, and regretting sins. The passage ends with an editorial setup for
    a slok addressed to Pandit Hardial when he came to invest Guru Nanak with a janeu.
