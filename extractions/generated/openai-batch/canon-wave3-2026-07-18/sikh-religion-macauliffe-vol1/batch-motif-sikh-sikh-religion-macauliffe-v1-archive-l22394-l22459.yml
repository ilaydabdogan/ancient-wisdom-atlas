  quote: ''
  summary: The passage says that a saint’s filth is washed away and that such a person
    meets God by singing divine praises. It contrasts the destructive fire of evil
    inclinations and worldly desire with salvation through meditation on the Guru’s
    word and singing God’s praises. It lists animals that suffer and die through sense-driven
    acts, compares unstable religious learning without God’s essence to an unsatisfied
    widow, and ends with images of thirst and delight fulfilled by rain, water, and
    God’s essence. A prose sentence begins by naming a hill king, Amar Singh, but
    the narrative is incomplete in this excerpt.
  language: English
