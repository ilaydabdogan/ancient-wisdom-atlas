canonical_text:
  quote: ''
  summary: Guru Nanak travels with Saido, Gheho, and Siho into a tyrant's domain.
    The tyrant plans to kill them for trespassing and seizes the Guru, who enters
    a trance and sings a hymn on divine mercy, obedience, acceptance, and honour in
    God's court. Hearing the hymn, the tyrant relents, prostrates before the Guru,
    and drinks water in which the Guru had washed his feet, after which the narrator
    says he became a Sikh and obtained deliverance. The Guru then meets a proud successor
    of Pir Makhdum Baha-ul-Din Oureshi, speaks a verse condemning attachment to worldly
    filth instead of God's praise, and the Pir falls at his feet and invites him to
    stay.
  language: English
  quote_policy: summarized
