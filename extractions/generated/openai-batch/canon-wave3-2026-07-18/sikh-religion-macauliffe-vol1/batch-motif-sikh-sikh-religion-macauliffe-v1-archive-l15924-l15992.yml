canonical_text:
  quote: ''
  summary: A passage from the Japji describes God as self-existent, true, and the
    source of honour and salvation. It exhorts hearing, singing, and internalizing
    divine love, leading to removal of sorrow and absorption in God. It presents the
    Guru’s instruction as the means by which God’s word and knowledge are received
    and states that the Guru is Shiv, Vishnu, Brahma, Parbati, Lakhshmi, and Saraswati.
    Footnotes discuss alternate translations and explain bodily rebirth, the soul’s
    residence, divine decision, and future states of existence.
  language: English
  quote_policy: summarized
