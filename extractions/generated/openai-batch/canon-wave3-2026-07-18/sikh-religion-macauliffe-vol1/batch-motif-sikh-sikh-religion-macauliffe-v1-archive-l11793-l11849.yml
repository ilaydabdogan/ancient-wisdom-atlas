canonical_text:
  quote: ''
  summary: A hymnic section says that Brahma, Krishan, Shiv, and countless gods cannot
    encompass or only praise God. Mian Mitha asks the Guru about the one Name; the
    Guru leads him aside and asks whether he hears the Name of the one God. The name
    of the Prophet vanishes amid divine ecstasy and is replaced by ashes, while a
    heavenly voice repeats Allah. Shaikh Mitha kisses the Guru's feet, and the Guru
    enters a trance and utters ethical instruction contrasting faith and virtues with
    faithlessness and vices.
  language: English
  quote_policy: summarized
