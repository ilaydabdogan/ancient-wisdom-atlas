  summary: 'The passage praises God as beyond complete description: God creates and
    destroys the body, takes and restores life, seems far yet near, and is all-seeing
    and omnipresent. Human descriptions fail; God gives continually, sustains humans
    by bounty, orders the world, receives prayer, and is approached through meditation
    on the true Name at the ambrosial morning hour.'
