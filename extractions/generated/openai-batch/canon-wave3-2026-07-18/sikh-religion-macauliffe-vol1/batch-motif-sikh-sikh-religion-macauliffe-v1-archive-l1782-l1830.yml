  summary: The passage recounts severe policies and punishments attributed to an unnamed
    monarch and then cites Ibn Batuta’s account of Emperor Muhammad Bin Tughlak. It
    describes religiously framed claims about Hindus, restrictions on Hindu property,
    poverty and corpses during the monarch’s reign, brutal punishment of the monarch’s
    kin, the forced relocation of Dihli’s inhabitants to Daulatabad, violence against
    disabled men found after the removal, and a forward reference to Muhammad bin
    Tughlak’s later persecution of the Maratha saint Namdev.
