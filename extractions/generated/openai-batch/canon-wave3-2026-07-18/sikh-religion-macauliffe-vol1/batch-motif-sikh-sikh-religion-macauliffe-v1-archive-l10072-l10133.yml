canonical_text:
  quote: ''
  summary: Guru Nanak addresses his father Kalu, saying that God arranges marriages
    without error and joins those whom He has joined forever. Nanak's mother urges
    him to stop speaking and attend to worldly duties for wealth. Nanak replies with
    a hymn instructing one to call upon the Lord's name before dawn; devotional remembrance
    is associated with celestial journey furnishings, confession of spiritual deficiency,
    the pain of worldly pleasure under destiny, and meeting or separation from God
    by destiny and divine favor. A note relates the marriage statement to one-wife
    teachings in later Sikh sources.
  language: English
  quote_policy: summarized
