    as a response, criticizes pantheism as morally and emotionally unsatisfactory,
    and states that humans need access to a personal God who grants aid, solace, and
    love. It adds that the Sikh Gurus taught God as approachable, and a footnote compares
    the idea of divine image with an ancient Greek belief cited from Plato.
