  summary: A hymn uses images of tarnished bronze, accountable companions, hollow
    painted buildings, predatory white herons, a useless simmal tree, and a blind
    burdened traveler on a mountainous road. It asks Nanak to remember the Name for
    release from shackles. Shaikh Sajjan hears the warning hymn and recognizes the
    faults as his own.
