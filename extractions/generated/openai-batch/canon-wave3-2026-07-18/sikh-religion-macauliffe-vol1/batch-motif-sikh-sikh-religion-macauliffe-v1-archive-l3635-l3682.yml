canonical_text:
  quote: ''
  summary: The passage evaluates the claimed Bala Janamsakhi account of Guru Nanak.
    It says Bala was alleged to have dictated a biography to Paira by order of Guru
    Angad, but raises doubts based on dialect, the absence of an original volume,
    Guru Angad's represented ignorance of Bala, Bala's absence from lists of known
    Sikhs, conflicting claimed dates for the biography, and later schisms that encouraged
    falsified or newly composed Janamsakhis.
  language: English
  quote_policy: summarized
