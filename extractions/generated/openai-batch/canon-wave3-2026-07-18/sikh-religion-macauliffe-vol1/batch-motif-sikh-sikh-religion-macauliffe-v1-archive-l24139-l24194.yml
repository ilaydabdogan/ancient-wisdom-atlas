canonical_text:
  quote: ''
  summary: A hymn addresses God as the object of worship, source of cosmic light,
    and giver of peace. It contrasts pious light with perverse darkness, questions
    argumentative meditation without true sight of God, and says the Word and true
    Guru awaken and resolve dispute. Later stanzas ask only for love of the pure Name,
    compare the Name to nectar water, criticize merely external religious garb, stress
    service to God and the Guru, describe worldly impermanence, and ask for the Name
    as wealth worn on the heart.
  language: English
  quote_policy: summarized
