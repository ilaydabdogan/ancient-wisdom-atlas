canonical_text:
  quote: ''
  summary: 'The passage describes Jahangir in contrast to Akbar: Akbar is characterized
    as disposed toward religious free thought, while Jahangir is associated with the
    assassination of Abul Fazal, the death of Nur Jahan’s husband, and severe punishments.
    The passage cites Jahangir’s own memoirs and Sir Thomas Roe’s reports of robbers
    and other culprits being executed by elephants, dogs, swords, serpents, and other
    methods, often publicly and without formal trial. It also recounts the punishment
    of a woman and eunuch caught kissing.'
  language: English
