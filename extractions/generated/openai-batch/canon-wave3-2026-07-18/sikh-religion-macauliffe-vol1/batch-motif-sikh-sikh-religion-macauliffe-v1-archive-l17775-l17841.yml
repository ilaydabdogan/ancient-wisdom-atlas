    through external recreation, links fear of God with love, teaches repetition of
    the Formless Name, divine ownership and giving, humility, good acts, and the inevitability
    of death, then contrasts Musalman, Hindu, and Jogi religious practices with service
    to God, generosity, reward-seeking giving, and wrongdoing.
