canonical_text:
  quote: ''
  summary: 'The passage first warns that humans may be led astray, suffer transmigration,
    and need divine favor, the Guru, the Word, fear of God, and remembrance of the
    Name. It then presents a Suhi Chhant sung at marriages and festivities: saints
    or friends come to the speaker''s house by God''s will, rejoicing and music follow,
    the Spouse comes and adorns the house, and divine knowledge enables vision of
    God''s form filling the three worlds.'
  language: English
  quote_policy: summarized
