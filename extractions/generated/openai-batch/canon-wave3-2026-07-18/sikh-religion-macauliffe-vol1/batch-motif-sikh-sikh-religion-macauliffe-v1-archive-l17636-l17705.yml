  quote: ''
  summary: Guru Nanak's hymn contrasts the Formless One, divine knowledge, and the
    true Guru with named religious stories, public performances, royal ornaments,
    and bodily impermanence. It states that divine knowledge is obtained by God's
    grace, that the soul has wandered through many births, and that the true Guru
    communicates the Word. It ends with temporal and cosmic imagery involving milkmaids,
    Krishans, Gopals, wind, water, fire, the moon, and the sun.
