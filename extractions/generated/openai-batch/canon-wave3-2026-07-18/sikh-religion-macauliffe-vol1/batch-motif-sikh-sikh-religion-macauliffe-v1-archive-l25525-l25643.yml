  quote: ''
  summary: English translation excerpt of hymnic and instructional verses attributed
    to Guru Nanak. The passage uses images of sandal on a donkey, falsehood as woven
    cloth, devotional repetition of God’s Name, bridal longing for God, debate with
    Pandits over the Veds and divine knowledge, praise of God as indescribable emperor
    and source of all, and inwardized ascetic-pilgrimage imagery in which the Word
    dwells in the heart and rebirth ceases.
