canonical_text:
  quote: ''
  summary: The passage opens with devotional verses in which Nanak speaks of obtaining
    God as spouse and becoming a permanent bride. It then narrates that an impoverished
    man asks Guru Nanak for help obtaining a wedding outfit for his daughter. Guru
    Nanak sends his servant Bhagirath to Lahore for the required articles, warning
    him not to spend a night there. In Lahore, a shopkeeper says most articles can
    be ready that day but the bride’s bracelets cannot be made and colored before
    nightfall. Bhagirath explains the Guru’s command, praises his master as a great
    Being, and the skeptical shopkeeper decides to accompany him, though the excerpt
    ends mid-sentence.
