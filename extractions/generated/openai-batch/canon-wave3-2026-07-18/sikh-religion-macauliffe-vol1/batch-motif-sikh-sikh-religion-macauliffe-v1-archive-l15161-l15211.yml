canonical_text:
  quote: ''
  summary: Guru Nanak tests his followers by proposing that anyone wishing to accompany
    him eat from a corpse. Lahina remains obedient, the corpse is revealed as sacred
    food, and Lahina offers it first to the Guru. Guru Nanak explains the value of
    shared wealth, teaches Lahina the essential spell or preamble of the Japji, instructs
    him in its practice, and then embraces him, names him Angad, and promises he will
    be his successor after a Jogi declares that the future Guru is produced from Nanak's
    body.
  language: English
  quote_policy: summarized
