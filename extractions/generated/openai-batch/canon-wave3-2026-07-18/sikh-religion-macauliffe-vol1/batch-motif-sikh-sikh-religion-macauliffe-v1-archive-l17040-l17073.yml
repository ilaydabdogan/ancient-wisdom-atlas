  quote: ''
  summary: Section XXXI describes the divine seat and storehouses as present in every
    world, the Creator beholding creation, and praise of the True One as primal, pure,
    without beginning, indestructible, and constant in every age. Section XXXII imagines
    multiplied tongues uttering the Lord's name repeatedly, by which the speaker would
    ascend the Lord's stairs and become one with Him; it contrasts the religious who
    find the Kind One with the jealous, false, and boasting.
