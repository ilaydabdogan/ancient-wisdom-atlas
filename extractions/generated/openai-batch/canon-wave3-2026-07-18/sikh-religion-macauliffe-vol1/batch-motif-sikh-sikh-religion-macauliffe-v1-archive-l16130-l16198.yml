    sorrow and sin, reveals virtue, grants status or guidance, and makes the unfathomable
    knowable. It then describes obedience to God as indescribable, inwardly known,
    and productive of wisdom, knowledge of worlds, freedom from punishment, and freedom
    from departure with Jam, the god of death.
