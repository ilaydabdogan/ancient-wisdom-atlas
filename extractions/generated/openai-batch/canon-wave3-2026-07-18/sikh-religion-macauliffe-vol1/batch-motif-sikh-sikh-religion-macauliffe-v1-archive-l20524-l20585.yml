canonical_text:
  quote: ''
  summary: The passage presents hymn stanzas in which a woman or wife is unaware of
    her Husband/Beloved, while Nanak or the true Guru teaches love and causes union
    with God. It describes impurity of mind, body, tongue, and mouth without true
    instruction, and says the heart is cleansed through the Word. It criticizes Brahmans,
    pandits, and astrologers for reading, preaching, or studying without liberating
    understanding. It ends by praising the woman who has God as Spouse and is united
    with God by the Word, followed by an editorial note that the following hymn was
    addressed to Hindu devotees met by the Guru in the Himalayas.
  language: English
  quote_policy: summarized
