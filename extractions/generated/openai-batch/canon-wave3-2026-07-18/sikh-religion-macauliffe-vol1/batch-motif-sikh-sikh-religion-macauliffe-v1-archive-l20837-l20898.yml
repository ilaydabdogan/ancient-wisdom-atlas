canonical_text:
  quote: Everything is inferior to truth; the practice of truth is superior to all
    else.
  summary: The hymn declares extreme bodily austerity, costly offerings, and obstinate
    scriptural interpretations inferior to God’s name, truth, and instruction through
    the Guru. It describes God as fashioning vessels and filling the three worlds
    with light, and says the one who drinks the nectar of the Name is satisfied and
    goes to God’s court with honour.
  language: English
  quote_policy: quoted
