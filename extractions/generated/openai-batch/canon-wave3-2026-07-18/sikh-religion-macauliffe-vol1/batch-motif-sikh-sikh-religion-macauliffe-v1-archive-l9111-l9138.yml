canonical_text:
  quote: ''
  summary: At Jagannath, Guru Nanak meets a Brahman who closes his eyes and nose and
    claims mental vision of the world’s secrets. Nanak hides the Brahman’s lota; when
    the Brahman cannot find it, Nanak recites a hymn criticizing false claims to yogic
    vision, stating that God’s name is best in the Kal age, and mocking the claim
    to see the three worlds while failing to see what is behind him.
