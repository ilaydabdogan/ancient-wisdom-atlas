canonical_text:
  quote: ''
  summary: Saido and Gheho, having intended to worship Khwaja Khizir, meet a man carrying
    a fish who identifies himself as the river god and says his power comes from the
    Guru. They prostrate before the Guru, confess, and ask forgiveness. The Guru then
    composes verses presenting divine knowledge, the Guru, instruction, pilgrimage,
    bathing, river water, and fragrance as spiritual images. A French note associates
    Khizir with the Fountain of Life, Elijah, Paradise, the tree of life, and immortality.
  language: English with French note
  quote_policy: summarized
