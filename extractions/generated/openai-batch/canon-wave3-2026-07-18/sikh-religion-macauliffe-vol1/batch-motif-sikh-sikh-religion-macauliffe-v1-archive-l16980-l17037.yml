canonical_text:
  quote: One Maya in union with God gave birth to three acceptable children.
  summary: The passage praises God as primal, pure, beginningless, indestructible,
    and constant across ages. It advises making divine knowledge one's food, compassion
    one's storekeeper, and the inner voice a pipe calling to repast. It describes
    God as the one who has strung the world on His string, states that union and separation
    regulate the world under destiny, and presents Maya in union with God giving birth
    to three children who perform the functions of creator, provider, and destroyer
    while God directs and sees them unseen.
  language: English
  quote_policy: quoted
