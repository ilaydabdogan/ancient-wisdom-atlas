canonical_text:
  quote: Saith Nanak, impurity is not thus washed away ; it is washed away by divine
    knowledge.
  summary: The passage contrasts worldly luxury and forgetfulness of death with knowledge
    of God. A narrative setting describes Guru Nanak at a rich man's feast where Brahmans
    depart after a birth, deeming the house impure. Guru Nanak responds that, if impurity
    is understood materially, it is present everywhere because life exists in cow-dung,
    wood, grain, and water; true impurity is moral, involving greed, falsehood, covetous
    sight, and slander, and is removed by divine knowledge.
  language: English
  quote_policy: quoted
