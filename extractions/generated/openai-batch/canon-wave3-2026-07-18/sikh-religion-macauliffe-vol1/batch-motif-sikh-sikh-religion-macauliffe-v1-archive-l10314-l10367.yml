canonical_text:
  quote: ''
  summary: Guru Nanak answers with verses presenting humility, forbearance, and civility
    as a threefold dress by which the divine Spouse is won. A Shaikh asks for a knife
    that makes those killed by it acceptable to God; the Guru answers with an allegorical
    knife of truth, sharpened on the Word and sheathed in merit, which draws out avarice
    and leads the slaughtered person to God. The Shaikh praises the Guru as one who
    has seen God, and the Guru adds brief sayings about paired affinities.
  language: English
