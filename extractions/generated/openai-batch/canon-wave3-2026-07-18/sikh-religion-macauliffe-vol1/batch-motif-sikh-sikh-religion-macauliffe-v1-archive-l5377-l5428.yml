canonical_text:
  quote: ''
  summary: 'The passage presents Guru Nanak’s teaching that external religious acts
    and accumulated wealth are insufficient when the mind is caught in worldly illusion.
    It uses farming imagery for spiritual discipline: mind, acts, modesty, body, the
    Name, contentment, humility, and love are described as elements of cultivation.
    Nanak then tells his father that he has sown his own field, that its harvest will
    benefit others, and that his work has been done for God, ending in union with
    the Creator.'
  language: English
  quote_policy: summarized
