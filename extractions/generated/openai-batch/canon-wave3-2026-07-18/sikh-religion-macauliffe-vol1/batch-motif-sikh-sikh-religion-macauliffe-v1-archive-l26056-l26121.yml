canonical_text:
  quote: ''
  summary: The passage teaches that union with God depends on the Guru’s protection,
    favour, the Name, and conduct according to the Word. Those lacking God in the
    heart are punished at Death’s gate and remain in transmigration, while holy persons
    who know the one God are absorbed in the True One. A later address to a rich sinner
    warns that pride in beauty, wealth, gold, and woman leads through forgetfulness
    of the Name into a terrible ocean of suffering.
  language: English
  quote_policy: summarized
