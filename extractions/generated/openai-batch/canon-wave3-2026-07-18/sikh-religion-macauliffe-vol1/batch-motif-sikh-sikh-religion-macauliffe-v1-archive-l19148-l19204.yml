  quote: ''
  summary: 'The passage presents devotional and ethical instruction: true love is
    not attachment to worldly things but absorption in God; salutation combined with
    criticism of God''s works is rejected and said not to gain a place in God''s court;
    the hearer is urged to worship and remember the Lord, avoid evil deeds, and act
    so as not to lose with the Lord in a dice image; proud, quarrelsome service displeases
    a master, while self-effacing service gains honour, and longing for God leads
    to meeting Him.'
