canonical_text:
  quote: ''
  summary: 'A hymn presents the soul-like wife in relation to the Beloved Lord: the
    wife who has found the Beloved sleeps peacefully, while the wife abandoned by
    her husband grieves and wastes her youth in separation. Under the Guru’s instruction,
    truth and divine knowledge enable vision of God and dispel pride. Earthly relatives
    are described as impermanent, while the relationship with the Beloved found through
    the Guru is never sundered; the speaker says the Guru has united them with the
    Beloved.'
  language: English
  quote_policy: summarized
