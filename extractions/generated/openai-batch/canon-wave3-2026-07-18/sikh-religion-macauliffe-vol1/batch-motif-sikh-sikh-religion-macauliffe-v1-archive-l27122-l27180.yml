canonical_text:
  quote: ''
  summary: A hymnic passage attributed to Guru Nanak teaches that creation is by God's
    order, that humans are accountable before God, that holy people dwell apart and
    live on alms while seeing God everywhere, and that devotion and remembrance of
    God's Name bring salvation and meeting with God. It contrasts reliance on the
    Veds by many factions with remembering God's name, says pride and divine presence
    are mutually exclusive, and states that the Ineffable One's story or Real Thing
    is hidden in every heart but cannot be found without the Guru. A footnote explains
    God's primal love as protective love for the child in the womb.
  language: English
  quote_policy: summarized
