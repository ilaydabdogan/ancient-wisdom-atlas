  quote: they who have acted honestly shall depart with bright faces
  summary: At a deathbed moment involving a Pir, Guru Nanak replies that each person
    bears what he has filled, that God's will is over all, and that honest persons
    depart with bright faces. Seeing the Pir prepared for death, the Guru says he
    will soon follow and composes a hymn on the brevity of wealth and youth, the aging
    body, God's love, the grave, departure from one household to another, and the
    loss or carrying of merits and demerits.
