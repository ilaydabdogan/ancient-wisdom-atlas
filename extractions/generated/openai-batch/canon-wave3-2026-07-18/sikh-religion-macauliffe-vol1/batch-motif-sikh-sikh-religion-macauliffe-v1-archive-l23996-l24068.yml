  summary: The passage warns several addressed figures—the black deer, bumble-bee
    or black bee, demon, and soul from a strange land—about death, desire, and entanglement
    without the Name or Word. It presents God or the true Lord as protector, the Guru
    as the source of true knowledge of God, and uses images of bitter fruit, ocean
    wave, lightning, closing lotus, hot oil, Death's net, fisherman and fish, separated
    rivers, and sweetness containing poison.
