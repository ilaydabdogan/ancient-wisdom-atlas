canonical_text:
  quote: ''
  summary: The passage contrasts false and pious dealings, describes perverse attachment
    to mammon as blindness leading to painful transmigration, and presents Guru-protection
    and devotion to God's name as deliverance from Death, punishment, and the difficult
    road. It uses images of Death's noose and sword, the tree of the world with God
    as root, and God's court where those who please God receive a robe of honour by
    the True King's order. Nanak petitions the Lord for truth and preservation of
    honour.
  language: English
