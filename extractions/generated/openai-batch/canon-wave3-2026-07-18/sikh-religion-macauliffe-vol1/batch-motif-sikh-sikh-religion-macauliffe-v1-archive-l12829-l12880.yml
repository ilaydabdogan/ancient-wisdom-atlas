  quote: "“be blended with Him who is unborn and self-existent”"
  summary: A shopkeeper recognizes the Guru as a great being, remains with him for
    three years, memorizes hymns, then goes to Ceylon for trade while maintaining
    disciplined devotional practices. He follows the Guru’s teaching on pre-dawn bathing,
    repetition of God’s name, and spiritual union with God. In Ceylon, despite local
    religious customs, he adheres to the Guru’s teachings and is summoned by Raja
    Shivnabh, to whom he presents a coconut as a sign of loyalty.
  language: English
