canonical_text:
  quote: "“Turn my feet in a direction in which God is not.”"
  summary: A pilgrim says no Hindu has gone to Makka and asks Guru Nanak not to travel
    with him. After the Guru tells him to go ahead, the pilgrim can no longer see
    either the Guru or the cloud and interprets the encounter as divine illusion.
    In Makka, Guru Nanak sleeps with his feet toward the Kaaba. When an Arab priest
    rebukes and moves his feet, the temple is said to turn with the movement of the
    Guru’s body. Witnesses are astonished, and Qazis and Mullas question him about
    his religion and the source of his power.
  language: English
  quote_policy: quoted
