canonical_text:
  quote: ''
  summary: 'Nanak lies still for four days and is described as unsuited to secular
    work, causing concern to his parents. His mother and father try to direct him
    toward ordinary duty and agriculture. Nanak answers with verses that recast farming
    as spiritual cultivation: the body or good works become field or soil, the Word
    or God''s name becomes seed or irrigation, and faith or divine realization germinates
    in the heart. He further contrasts wealth, beauty, and mere words with spiritual
    understanding, using images of a puddle, toad, lotus, and bumble-bee teacher or
    Guru.'
  language: English
  quote_policy: summarized
