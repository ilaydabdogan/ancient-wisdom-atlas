canonical_text:
  quote: ''
  summary: The passage presents a Rag Basant hymn attributed to Guru Nanak, introduced
    as written after the departure of cold winter in northern India. It celebrates
    spring, exhorts the hearer to remember God, subdue pride, cultivate virtues, and
    describes good acts as a tree whose parts are God’s name, religion, divine knowledge,
    attainment of God, and the dispelling of pride. It then begins a Sarang ki War
    passage introduced as a refutation of impurity ideas, stating that songs, knowledge,
    and the phases of the moon and sun are not impure.
  language: English
  quote_policy: summarized
