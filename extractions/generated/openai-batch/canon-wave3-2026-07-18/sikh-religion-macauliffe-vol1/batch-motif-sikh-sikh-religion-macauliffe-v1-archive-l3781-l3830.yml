canonical_text:
  quote: ''
  summary: The passage summarizes and criticizes narratives attributed to the Janamsakhis
    in which Nanak reports to God that his mission on earth is incomplete, is sent
    back to finish it, and on his return meets a Jogi in the lower worlds who discusses
    former existences. The passage then describes these narratives as fictitious Handali
    interpolations that depreciated Guru Nanak, notes a transformation of his biographies
    around A.D. 1640, and mentions later persecution of Sikhs under Zakaria Khan Bahadur.
  language: English
