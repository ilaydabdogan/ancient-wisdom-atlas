canonical_text:
  quote: If I repeat the Name, I live ; if I forget it, I die
  summary: Nanak's father and mother urge him to abandon or suspend his devotional
    behavior and conform to worldly expectations. Nanak replies with verses in Rag
    Asa declaring that remembrance of the true Name is life-giving, that forgetting
    it is death, that the Name satisfies spiritual hunger, and that God is incomparable,
    undying, sustaining, creator of day and night, and the Spouse whom people must
    not forget.
