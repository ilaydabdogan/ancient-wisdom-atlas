canonical_text:
  quote: God will assay man’s qualities
  summary: The hymn teaches that God tests human qualities as genuine and counterfeit
    currency are tested; outward pilgrimage bathing cannot cleanse inner corruption;
    people should engage from youth in the commerce of God’s Name; those who profit
    by the Name are accepted and welcomed home, while evil association leaves people
    inattentive to divine praise and with the devil in their hearts.
  language: English
  quote_policy: quoted
