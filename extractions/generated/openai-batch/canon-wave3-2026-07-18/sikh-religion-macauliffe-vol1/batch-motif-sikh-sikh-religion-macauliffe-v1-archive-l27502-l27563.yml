canonical_text:
  quote: ''
  summary: 'The passage first says that wisdom, knowledge, understanding, love of
    God, and instruction come through God''s name, the Guru, saints, and the Creator''s
    favor. It describes the body as God''s palace, temple, and house containing divine
    light, and says the pious are invited to God''s palace and blended with Him. In
    the Malar Ashtapadi section, the Guru uses familiar Indian examples to express
    love for God: the chakwi longing for its mate, the lotus rejoicing in sunbeams,
    the chatrik thirsting for special raindrops, the fish depending on water, and
    a woman separated from her Beloved sending a message through the true Guru.'
  language: English
  quote_policy: summarized
