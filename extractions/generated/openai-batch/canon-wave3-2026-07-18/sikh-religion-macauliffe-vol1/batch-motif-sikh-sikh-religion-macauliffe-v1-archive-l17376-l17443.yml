    and inwardly ash-like. It then declares that God created the world, named things,
    made Maya, and gives and takes life. A slok attributed to Guru Nanak declares
    God's realms, order, court, command, favour, signs, power, and might true; Nanak
    says those who meditate on the True One are true, while those born and dying are
    false.
