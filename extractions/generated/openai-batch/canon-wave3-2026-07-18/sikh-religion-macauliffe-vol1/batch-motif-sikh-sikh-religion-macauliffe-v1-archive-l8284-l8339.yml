canonical_text:
  quote: ''
  summary: Guru Nanak gives a moral discourse warning against desire for a courtesan
    and advising company with the holy. Afterward Guru Nanak and Mardana continue
    wandering and are surrounded by robbers who say they have come to rob him. Guru
    Nanak gives them spiritual instruction, telling them to abandon robbery, take
    up agriculture, and give charity from their spoils. They follow his advice, repeat
    the Name, and reform. Guru Nanak then composes a hymn condemning covetousness,
    falsehood, deceitful food, slander, anger, pleasures, and self-praise, and saying
    that true worth is known at the Lord’s gate.
  language: English
  quote_policy: summarized
