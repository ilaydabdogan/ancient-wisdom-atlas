  quote: Come home, my Beloved, make me cross the difficult ocean
  summary: A seasonal devotional passage speaks in the voice of a woman or wife longing
    for God as Spouse or Beloved. In spring months, natural signs such as clouds,
    rain, blossoms, bees, birds, and flowering trees accompany her separation and
    prayer for God to return home, show compassion, and carry her across a difficult
    ocean. Nanak states that God is found through meditation on the Word.
