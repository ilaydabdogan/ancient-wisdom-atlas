canonical_text:
  quote: ''
  summary: 'A hymn praises God as creator: He separates earth and sky, fixes the heavens
    by a word, creates the sun and moon, gives them light, and orders night and day.
    The passage then praises God as incomparable, enthroned, formless, unbegotten,
    beyond Brahma’s measure, concealed in the lotus of the heart, and the source of
    the word. Those satisfied with the True One are described as absorbed in Him.
    Brahm Das reverently falls at the Guru’s feet and asks what existed before creation.'
  language: English
  quote_policy: summarized
