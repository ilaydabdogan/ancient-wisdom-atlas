canonical_text:
  quote: ''
  summary: The passage gives precepts for salvation. It says the Guru makes the Lord’s
    gate known, urges remembrance of the Name, restraining desires, renouncing falsehood
    and avarice, and seeking refuge in God. It contrasts Guru-guided understanding
    with greed, pride, mammon, falsehood, and a perverse mind likened to stone. It
    ends by presenting God’s name as wealth given by the true Guru and as nectar for
    one who does not forget it.
