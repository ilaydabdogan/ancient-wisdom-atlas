canonical_text:
  quote: ''
  summary: Hymn excerpts attributed to Guru Nanak describe the Word as a cultivated
    tree whose fruit is the Name; admonish a Brahman to replace external ritual objects
    with the body, heart, divine knowledge, meditation, love, and remembrance of God’s
    Name; state that God is known through the true Guru rather than ceremonies or
    books; and answer a pandit’s question about salvation by depicting the body as
    a frail vessel and the world as a dangerous ocean crossed only with the divine
    Guru. The passage also addresses God as Beloved and describes Mammon as an obstructing
    mother-in-law.
  language: English
  quote_policy: summarized
