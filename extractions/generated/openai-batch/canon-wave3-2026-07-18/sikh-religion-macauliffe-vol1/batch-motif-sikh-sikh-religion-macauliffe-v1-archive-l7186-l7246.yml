canonical_text:
  quote: ''
  summary: Tatihari, a disciple of a local Shaikh, encounters Guru Nanak and Mardana
    near a well while fetching water. Mistaking Nanak for a Persian darwesh, he gives
    a Muhammadan salutation; Nanak replies with a salutation to the Invisible. The
    Shaikh comes to question Nanak about his head-dress and lack of orthodox shaving.
    Nanak answers in verse that true shaving is shaving the mind, surrendering one’s
    own wisdom to the guru’s wisdom, becoming dust of all feet, abandoning pleasures,
    affections, and egotism, and wearing such a hat.
  language: English
  quote_policy: summarized
