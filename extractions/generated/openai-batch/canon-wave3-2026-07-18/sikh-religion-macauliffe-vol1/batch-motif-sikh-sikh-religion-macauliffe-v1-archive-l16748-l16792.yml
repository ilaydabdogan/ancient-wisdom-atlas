  summary: The stanza lists many classes of beings, religious authorities, and named
    Indic figures who speak of the divine addressee. It says that even if more beings
    were created, few could speak adequately of God, and concludes that only the True
    One knows His own greatness; improper speech about God marks a person as ignorant.
