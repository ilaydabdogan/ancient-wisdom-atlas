canonical_text:
  quote: ''
  summary: 'The passage satirizes social and religious conduct: instruction in private
    houses, material attachment, neglect of Shastars and Veds, self-worship, the Qazi''s
    bribery while invoking God, Hindu purity displays, Jogis with ashes who miss union
    with God, Brahmanical thread ritual, Musalman self-praise, the need for good works
    for heaven, and seekers who wander through Jogi discipline while the Creator is
    everywhere.'
