canonical_text:
  quote: ''
  summary: 'The passage presents several hymnic sections attributed to Guru Nanak:
    God gives knowledge and the Word; a minstrel is summoned to God''s true court
    and rewarded for praise; fear of God is described as necessary and formative;
    virtues replace ordinary kinship in a renunciant address; the body is analyzed
    as elemental and transient while the conscious soul does not die; the sought-for
    jewel is within the heart; Sant Das begins a set of questions about human origin
    and absorption.'
  language: English
  quote_policy: summarized
