canonical_text:
  quote: Bear, O my soul, the result of thine own acts.
  summary: The passage says that outward austerities, attachment to mammon, ignorance,
    and lack of the Name bring suffering or regret. It contrasts this with meeting
    the true Guru, fixing God's name in the heart, receiving divine favour, and being
    freed through the Word. It praises saints at the Lord's gate, says those outside
    favour find no entrance and wander in many births, and presents the speaker as
    a humble low-caste singer who begs from those who meditate on the Lord.
  language: English
  quote_policy: quoted
