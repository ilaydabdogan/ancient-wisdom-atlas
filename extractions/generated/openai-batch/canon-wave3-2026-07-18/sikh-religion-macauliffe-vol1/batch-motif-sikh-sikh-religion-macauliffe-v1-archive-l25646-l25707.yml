canonical_text:
  quote: ''
  summary: The passage presents a devotional prayer to God, describing God as boundless,
    omnipresent, and the source of learning and understanding. The speaker declares
    exclusive devotion, makes the heart a temple to God, and says all beings seek
    God's protection. In the following lunar-day instruction, the Guru counsels disregard
    of mammon, warns that attachment leads to fetters, Death's gate, punishment by
    the god of death, and transmigration, and teaches that emancipation requires the
    Guru's instruction. The passage concludes by elevating heartfelt devotion and
    repetition of the Name over ritual offerings and ablutions.
  language: English
  quote_policy: summarized
