canonical_text:
  quote: By praising God man establisheth an alliance with God’s court.
  summary: The passage presents proverbs about unreceptive folly, then says Guru Nanak
    answered his Sikhs’ question about forming an alliance with God by listing worldly
    examples of bonds, affinities, reconciliation, and exchange, concluding that praising
    God forms an alliance with God’s court. It then introduces seven sloks as instruction
    to Shaikh Brahm/Farid the second and states that worldly religious and political
    authorities are beneath the earth.
  language: English
  quote_policy: quoted
