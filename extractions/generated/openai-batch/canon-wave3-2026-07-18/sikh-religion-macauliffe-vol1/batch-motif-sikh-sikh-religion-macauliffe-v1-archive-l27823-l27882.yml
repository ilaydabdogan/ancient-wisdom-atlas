canonical_text:
  quote: ''
  summary: 'The passage presents brief hymn excerpts attributed to Guru Nanak: an
    assurance that addressing the True Guru prevents the bark from foundering; a lament
    over moral decline; a critique of women’s insincere mourning and empty invocation
    of God’s name; an animal allusion involving a raven, a swan, and a hypocritical
    holy man; and teachings that true ablution lies in treating the Guru as the river
    of pilgrimage, while true saints are few.'
  language: English
  quote_policy: summarized
