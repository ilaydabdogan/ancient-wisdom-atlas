canonical_text:
  quote: ''
  summary: Nanak’s verses describe the third watch of night as a time when a person
    is absorbed in woman, youth, worldly love, and neglect of God’s name. In the fourth
    watch, Death is figured as a reaper coming to the field, while no one knows when
    Death will seize a person; the text urges remembrance of God. A note explains
    that one’s final thoughts affect the next-world outcome and may lead to transmigration.
    In the narrative frame, the grain-dealer’s child dies by morning, the household
    mourns, and Mardana asks the Guru about the sudden reversal from rejoicing to
    grief.
  language: English
  quote_policy: summarized
