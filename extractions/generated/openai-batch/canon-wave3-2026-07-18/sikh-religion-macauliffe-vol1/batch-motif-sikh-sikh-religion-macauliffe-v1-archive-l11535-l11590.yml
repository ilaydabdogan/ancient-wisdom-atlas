  summary: The passage presents Guru Nanak’s instruction on inner light, service,
    worship, the true Name, and God’s court. Mian Mitha asks how a person gains distinction
    in God’s court and asks about the fate of wicked souls after death. The reply
    describes moral recompense, the grave, angels acting under divine orders, binding
    and leading away of offenders, and acceptance through the true Name.
