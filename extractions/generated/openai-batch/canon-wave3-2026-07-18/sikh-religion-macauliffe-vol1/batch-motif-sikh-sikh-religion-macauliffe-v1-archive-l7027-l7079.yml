canonical_text:
  quote: ''
  summary: A statement says that a person may find God whether he is a hermit or a
    householder. The Guru then visits Hardwar, where a large crowd has assembled to
    wash away sins. He observes that the pilgrims cleanse their bodies but lack inner
    devotion. As they throw water eastward for their ancestors, he throws water westward
    with cupped hands. Questioned by the crowd, he asks why they throw water eastward
    and who receives it. They answer that the libations are for ancestral manes. After
    a learned man says the ancestors are thousands of miles away, the Guru says he
    is throwing water toward a field he sowed at home in the west so it will not dry
    up.
  language: English
  quote_policy: summarized
