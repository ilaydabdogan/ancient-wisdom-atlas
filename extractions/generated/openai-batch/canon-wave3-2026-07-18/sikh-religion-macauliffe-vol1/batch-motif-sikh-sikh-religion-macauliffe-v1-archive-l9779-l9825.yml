canonical_text:
  quote: ''
  summary: The passage reports Guru Nanak reviving Mardana by placing his foot on
    Mardana’s forehead. In the next chapter, Mardana complains of travel, hardship,
    and hunger, and asks to remain with the Guru only if his hunger is satisfied and
    the Guru overlooks his actions. The Guru agrees and promises happiness in this
    world and the next. Mardana then urges a return home after twelve years of wandering.
    The Guru and Mardana go toward Taiwandi, halt in a forest near the village, and
    the Guru permits Mardana to visit his people and Kalu’s house without mentioning
    the Guru’s name. Mardana is greeted at home and then goes to Kalu’s courtyard.
  language: English
