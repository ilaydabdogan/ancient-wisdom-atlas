  summary: The passage presents devotional verses using weighing and merchant imagery
    for attention to the Lord, then narrates the Sidhs urging the Guru to become a
    Jogi. The Guru replies that religion is not found in ascetic dress, ritual objects,
    cremation-ground practices, pilgrimage wandering, or mere words, but in purity
    amid worldly impurity, equality toward all people, meeting a true guru, dispelled
    doubt, restrained mental wandering, and inward joy.
