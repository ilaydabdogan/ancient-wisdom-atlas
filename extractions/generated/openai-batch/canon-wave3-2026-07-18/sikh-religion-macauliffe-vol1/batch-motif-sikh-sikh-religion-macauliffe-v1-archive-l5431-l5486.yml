canonical_text:
  quote: ''
  summary: 'Kalu urges Nanak to pursue ordinary livelihoods: shopkeeping, horse trading
    with travel, or government service through Jai Ram. Nanak answers each proposal
    with a stanza that recasts the occupation in devotional terms: the true Name,
    meditation, sacred books, truth, virtues, attention, faith, and restraint of evil.'
  language: English
  quote_policy: summarized
