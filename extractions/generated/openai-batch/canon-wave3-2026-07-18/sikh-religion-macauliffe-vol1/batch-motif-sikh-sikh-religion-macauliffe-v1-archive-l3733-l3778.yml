canonical_text:
  quote: ''
  summary: The passage describes Bidhi Chand, a descendant of Handal, as a Sikh priest
    who lost followers after an unlawful attachment and then created a separate religion
    with writings that exalted Handal and degraded Guru Nanak. It summarizes a Handali
    account in which Guru Nanak journeys to Sach Khand, meets Dhru, hears of Kabir’s
    prior visit, announces Handal’s approach, and later finds Kabir fanning God represented
    as four-armed Vishnu.
  language: English
  quote_policy: summarized
