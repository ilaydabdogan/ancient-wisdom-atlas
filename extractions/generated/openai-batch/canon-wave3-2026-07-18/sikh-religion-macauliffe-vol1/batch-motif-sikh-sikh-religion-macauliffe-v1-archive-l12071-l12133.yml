  summary: A hymn rejects ritual wealth, sacred texts, bathing, alms, fasting, religious
    status, and household duties as insufficient without the true Name and knowing
    God; it says all creatures’ deeds are recorded and judged. A narrative then says
    Guru Nanak began singing hymns at the end of the night, and a seven-year-old boy
    came regularly to listen. When detained and questioned, the boy explains that
    seeing small sticks burn before large ones made him fear early death.
