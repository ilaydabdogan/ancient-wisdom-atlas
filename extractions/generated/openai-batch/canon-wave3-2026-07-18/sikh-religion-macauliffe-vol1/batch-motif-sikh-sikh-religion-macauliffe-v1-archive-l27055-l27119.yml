canonical_text:
  quote: "“crosseth over the terrible ocean of the world”"
  summary: The passage teaches that exalted company and the Guru’s instruction dispel
    doubt and enable a person to cross the world, described as a terrible ocean. It
    uses martial imagery of five arrows, glossed as five virtues, placed on the bow
    of the brain to kill Death. It contrasts knowledge of the Word and salvation through
    the Guru with transmigration. It praises the Fearless One/God as protector, transcendent,
    unborn, self-existent, invisible yet knowable through omnipotence, and also present
    within the heart. The society of saints, divine praise, recollection of the wandering
    mind, and the ambrosial essence of the True One culminate in being blended with
    God.
  language: English
  quote_policy: quoted
