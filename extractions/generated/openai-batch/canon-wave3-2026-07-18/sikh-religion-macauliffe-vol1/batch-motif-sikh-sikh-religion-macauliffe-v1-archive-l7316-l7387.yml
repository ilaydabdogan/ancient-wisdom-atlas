  quote: ''
  summary: The Shaikh questions Guru Nanak about the meaning of his slippers and then
    asks him to explain what a darwesh is. Guru Nanak replies in hymnic form, using
    images of fire, wind, earth, tree, river, sandal, churning, renunciation, and
    contemplative music to describe knowledge, endurance, self-effacement, holy conduct,
    and meeting the Creator.
