canonical_text:
  quote: ''
  summary: The passage teaches that true impurity lies in superstition, worldly attachment,
    and lack of remembrance of the Name, not in ordinary food and drink given by God.
    It praises the True Guru as one who brings people to God and removes inner evil.
    It contrasts this with a Brahman's ritual purification of himself, a square, and
    food, arguing that food becomes impure when consumed by a sinful body and by a
    mouth that does not utter the Name.
  language: English
  quote_policy: summarized
