canonical_text:
  quote: ''
  summary: A hymn passage teaches that meeting the True Guru brings enduring love,
    divine knowledge, remembrance of the Pure Name, recognition of God within, satisfaction
    through the Word, and love of the Lord. It contrasts this with pride, ritualism,
    separation from God, and punishment. An editorial note introduces a following
    address by the Guru to Raja Harbans during an eastern pilgrimage, where pilgrimage
    bathing is criticized when pride remains in the heart.
  language: English
  quote_policy: summarized
