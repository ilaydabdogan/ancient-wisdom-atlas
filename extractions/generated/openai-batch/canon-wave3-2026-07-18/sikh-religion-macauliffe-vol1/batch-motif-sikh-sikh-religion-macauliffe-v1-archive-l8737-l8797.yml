canonical_text:
  quote: ''
  summary: Nurshah and her women submit to Guru Nanak, ask how to obtain salvation,
    and are told to repeat God's name, perform domestic duties, and renounce magic.
    After leaving Kamrup, the Guru enters a wilderness where Kaljug comes to tempt
    him and Mardana is afraid. The Guru teaches that fear should be directed toward
    God, then sings a hymn about fear of God overcoming fear of Death, divine order,
    the soul, and the swan of the heart aspiring toward heaven.
  language: English
  quote_policy: summarized
