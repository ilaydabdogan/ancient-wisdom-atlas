  summary: The passage contrasts wealth, learned recitation, devotion, and penance
    with the need for credit in God's account, the true Name dwelling in the heart,
    Guru instruction, and knowing God. It describes hidden passions and senses that
    unsettle the mind, a devotional image of meeting the Beloved with adornment, and
    the soul departing while the senses weep and the soul gives account.
