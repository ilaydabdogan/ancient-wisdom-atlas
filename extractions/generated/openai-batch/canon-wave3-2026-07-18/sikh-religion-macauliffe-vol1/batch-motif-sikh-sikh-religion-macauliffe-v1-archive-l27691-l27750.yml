  quote: ''
  summary: The passage praises those devoted to the Word, the Name, and the true Guru,
    stating that Guru instruction purifies, brings honour in the true court, and unites
    a person with God. It criticizes Brahman ritual recitation, Jogi bodily feats,
    and the six Hindu systems as ineffective without knowledge of God or the true
    Guru. It includes footnotes explaining niwali and a Jogi breath technique associated
    with the serpent's way and nectar.
