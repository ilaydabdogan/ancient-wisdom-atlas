  summary: The passage discusses disagreement over solar and lunar reckoning for Kartik,
    then describes an early Janamsakhi attributed to Sewa Das, its date, language,
    script, and preservation in Pothohar while other Guru Nanak memoirs were destroyed
    during Sikh persecutions. Footnotes mention a deputation for a Guru Nanak birth-anniversary
    public holiday and describe Hola Mahalla as a day on which the tenth Guru held
    a mimic battle for his troops' instruction.
