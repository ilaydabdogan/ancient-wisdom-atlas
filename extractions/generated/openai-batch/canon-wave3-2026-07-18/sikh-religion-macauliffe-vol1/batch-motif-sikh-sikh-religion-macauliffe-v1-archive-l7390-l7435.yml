canonical_text:
  quote: ''
  summary: A Shaikh honors Guru Nanak and departs. Guru Nanak then reaches Dihli,
    where a royal elephant belonging to Ibrahim Lodi has died and its keepers are
    mourning. Guru Nanak says the elephant is alive and instructs the keepers to rub
    its forehead while saying “Wah Guru”; the elephant stands. Ibrahim Lodi asks whether
    Guru Nanak restored it to life. Guru Nanak attributes destruction and reanimation
    to God. After the Emperor asks whether the Guru could revive the elephant again
    if it were killed, the animal dies, and the Emperor orders another revival. Guru
    Nanak begins a reply using an analogy of iron heated in fire.
  language: English
  quote_policy: summarized
