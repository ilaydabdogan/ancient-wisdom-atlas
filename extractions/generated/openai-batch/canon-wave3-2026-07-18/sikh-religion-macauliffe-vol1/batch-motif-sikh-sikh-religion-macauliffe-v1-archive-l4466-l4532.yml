canonical_text:
  quote: ''
  summary: The passage describes God as playing a cosmic game with the four ages as
    a chaupar board and beings as dice. It contrasts seekers favored by the Guru with
    perverse wanderers who transmigrate through many animal forms, teaches recognition
    of the True One as freedom from rebirth, and presents God as creator, sustainer,
    orderer, all-pervading knower, and sole giver. It exhorts mortals to meditate
    on God's name, become absorbed in the True One, and offer themselves to God.
  language: English
  quote_policy: summarized
