canonical_text:
  quote: ''
  summary: The passage laments vanished worldly splendor, military power, houses,
    palaces, women, betel, and wealth. It states that the Lord establishes and disestablishes,
    that wealth ruins many and does not accompany the dead, and that the Creator first
    deprives of virtue those He destroys. It then describes priests attempting unsuccessfully
    to restrain an approaching emperor by miraculous power, the emperor burning dwellings
    and killing princes, battle between Mughals and Pathans, and the death of those
    whose letter has been torn in God's court.
  language: English
  quote_policy: summarized
