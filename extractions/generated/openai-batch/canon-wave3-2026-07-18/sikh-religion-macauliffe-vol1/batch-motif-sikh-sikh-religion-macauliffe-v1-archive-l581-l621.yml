  summary: A prefatory passage cites a Sikh request and prayer that Akal Purukh protect
    the translator on an ocean journey and that his translation of sacred books reach
    every true Sikh's library. The narrator then defends his interpretive method,
    notes possible disagreement by some Sikhs and alternative interpretations by gyanis,
    says rational interpretations were considered and notes supplied, and states that
    the translation was approved by learned Sikh priests and scholars. He adds that
    an account of Sikh Gurus, saints, and authors is necessary, mentions Professor
    Max Müller, and notes that Sikh friends urged publication of the extracts.
  language: English
