  quote: Pain is arsenic, the name of God is the antidote.
  summary: Guru Nanak, examined by a physician during illness, rejects ordinary medicine
    as unable to cure the inner pain of separation from God. He describes divine remembrance,
    the Name, contentment, penitence, and divine knowledge as the true remedies, and
    contrasts them with bodily medicine, worldly status, and external ritual practices.
