canonical_text:
  quote: Having turned my heart into a boat, I have searched in every sea;
  summary: The passage presents Guru Nanak’s declaration that scriptures and cosmic
    regions cannot measure God, describes a search through seas, pilgrimage places,
    worlds, nether regions, and heavens, and concludes that true faith requires fear
    of God and good works. It then narrates Guru Nanak’s travel to Madina and Baghdad,
    his victory in argument over priests, his altered call to prayer, the astonishment
    of Baghdad’s population, and his statement to the high priest that he rejects
    sectarian divisions and recognizes one God everywhere.
  language: English
  quote_policy: quoted
