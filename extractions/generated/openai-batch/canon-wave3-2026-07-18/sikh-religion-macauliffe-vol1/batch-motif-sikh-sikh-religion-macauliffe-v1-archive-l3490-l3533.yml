  quote: ''
  summary: The passage recounts Mani Singh organizing a Sikh gathering at Amritsar
    under a poll-tax condition, the Sikhs dispersing after troops arrived, Mani Singh
    being unable to pay the tax, and his punishment at Lahore after refusing to accept
    Islam. It then summarizes the birth, education, patrons, translations, and writings
    of Bhai Santokh Singh, including Nanak Parkash and later work on the lives of
    the remaining Gurus.
