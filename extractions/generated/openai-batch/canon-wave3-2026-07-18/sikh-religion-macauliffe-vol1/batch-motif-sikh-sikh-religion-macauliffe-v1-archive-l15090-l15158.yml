  summary: The passage first presents a devotional self-accusation in which Nanak
    speaks in images of dogs, hunting, falsehood, lust, anger, and dependence on the
    Creator’s Name. It then narrates the Guru’s party proceeding along a road where
    copper, silver, and gold coins appear; groups of Sikhs take the coins and leave.
    Only the Jogi, two Sikhs, and Lahina remain when the party reaches a funeral pyre
    with a corpse, four lamps, and a sheet.
