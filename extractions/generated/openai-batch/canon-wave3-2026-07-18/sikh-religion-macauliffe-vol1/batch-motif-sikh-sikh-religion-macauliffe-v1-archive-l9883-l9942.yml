    and clothing offered by his mother, and interprets God's word, divine love, truth,
    charity, meditation, contentment, and God's name as the true food, clothing, wealth,
    and youth. Mardana is asked to play accompaniment. Nanak's father Kaluhad hears
    of his arrival and rides to meet him.
