canonical_text:
  quote: ''
  summary: The passage exhorts a man to repeat God's Name and praises, states that
    the Guru unites man with God, compares holy company and beholding the Guru to
    pilgrimage and pilgrimage-bathing, warns that a body without the Name is punished
    by Death, and teaches that the water of life is found with the Guru and inwardly
    in the heart at home. It rejects outward disguises, mammon, vice, slander, falsehood,
    covetousness, and mere exterior washing, and recommends the Pure Name under the
    Guru's instruction.
  language: English
  quote_policy: summarized
