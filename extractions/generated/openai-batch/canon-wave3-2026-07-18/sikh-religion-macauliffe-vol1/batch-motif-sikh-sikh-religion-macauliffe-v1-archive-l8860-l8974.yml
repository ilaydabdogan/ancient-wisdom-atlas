canonical_text:
  quote: ''
  summary: The passage presents verses rejecting miraculous and worldly power if they
    lead to forgetting the divine Name; Kaljug bows and departs. Guru Nanak and Mardana
    then encounter one inhospitable village and one hospitable village. The Guru utters
    hymns on criticism, mortality, divine remembrance, and purity through the Name,
    then gives apparently reversed judgments on the two villages, explaining that
    bad people should stay contained while good people should spread and save others.
    The passage closes with travel by the Brahmaputra and coast toward Puri.
  language: English
