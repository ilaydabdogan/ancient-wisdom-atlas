canonical_text:
  quote: Falsehood is at an end ; Nanak, truth at last prevaileth.
  summary: Guru Nanak travels north-east to the bank of the Ravi, where he is widely
    visited, regarded as a man of God, and admired for verses sung by faqirs. A wealthy
    official from a neighboring village denounces him and proposes imprisoning him;
    when the official mounts a horse he is thrown, and on the next day he becomes
    blind while riding. Witnesses call Nanak a great saint, advise homage, and the
    official begins to praise the Guru while companions bow toward him.
  language: English
