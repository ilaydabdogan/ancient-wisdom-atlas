canonical_text:
  quote: ''
  summary: The passage presents devotional speech in which God's Name and Word are
    the speaker's true trade and practice. The speaker imagines becoming a koil in
    a mango tree, a fish in water, and a serpent in the ground while still remembering
    or abiding in the Word. The Lord is addressed as a Spouse present on both sides,
    and Nanak says the happy married wives are those whom God absorbs in His light.
    A following hymn teaches that without a religious guide a person hastens toward
    evil and perdition. It portrays the heart as an elephant, the body as a forest,
    and the Guru as a goad that marks the elephant with the true Word, leading to
    honor in the King's court. It also says God is not known by cleverness, that nectar
    in the house is being taken by thieves, and that worldly adornments and comforts
    cannot bring happiness without God's name.
  language: English
  quote_policy: summarized
