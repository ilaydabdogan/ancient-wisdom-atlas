  quote: There is but one road, one door; the Guru is the ladder to reach one’s home.
  summary: Guru Nanak travels north to Kashmir with companions, stays at Srinagar,
    and gains converts. Brahm Das, a leading Kashmiri pandit, visits with an idol
    and Sanskrit books and questions the Guru’s dress, purity, religious observance,
    and diet. The Guru responds with verses emphasizing one road and door, the Guru
    as ladder to reach home, and happiness in God’s name.
