canonical_text:
  quote: "“Without God’s name salvation is not obtained”"
  summary: The passage teaches that God is known through the true Guru and the Guru’s
    instruction; pride, doubt, fear, and transmigration are overcome through this
    wisdom. It rejects ritual offerings, ascetic practices, scholastic learning, pilgrimage,
    and outward religious markers as ineffective without God’s Name. It affirms God’s
    presence in all realms and concludes with Nanak asking preservation by the Guru’s
    favour and drinking God’s elixir.
  language: English
  quote_policy: quoted
