  summary: 'A preface passage records endorsements and assistance for Macauliffe’s
    work: Lord Reay recommended it, L. W. Dane supported it, Lord Kitchener publicly
    praised the accuracy and value of Macauliffe’s translations of Sikh sacred writings,
    and the author acknowledges literary help from Sardar Kahn Singh of Nabha. A brief
    preceding French fragment comments on a doctrine veiled by syncretism.'
