canonical_text:
  quote: My  Lord,  who  is  dyed  with  love,  pervadeth  everything —
  summary: 'The passage presents Guru Nanak''s hymn on instructing the heart through
    the Guru''s word, loving and repeating God''s name, and God''s omnipresence. God
    is described through paired identities and images: enjoyer and enjoyed, spouse,
    fisherman and fish, water and net, lake and swan, lotus and water lily. A following
    remonstrance addresses a Mulla and Qazi, praising the Creator who makes the world
    flourish, restrains sea and land, and warning the Mulla of death and fear of the
    Creator.'
  language: English
  quote_policy: quoted
