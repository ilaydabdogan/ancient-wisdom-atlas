canonical_text:
  quote: ''
  summary: Guru Nanak travels through several places to Kari Pathandi, where he makes
    many Pathan converts who honor him with music and cries of praise. He then composes
    a hymn describing the world-maker as watchful, urging praise of the Beloved, and
    presenting a wife who seeks, misses, or finds her Spouse through love, obedience,
    merit, guidance, and heartfelt meeting rather than words.
  language: English
  quote_policy: summarized
