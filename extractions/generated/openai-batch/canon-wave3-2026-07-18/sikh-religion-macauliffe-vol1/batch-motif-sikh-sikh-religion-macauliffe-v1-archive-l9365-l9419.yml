canonical_text:
  quote: ''
  summary: Guru Nanak and Shaikh Brahm spend the night in a forest. A charitable villager
    brings them milk before dawn. Shaikh Brahm separates his share and recites verses
    about night devotion and gifts from the Lord. The Guru replies that gifts belong
    to the Lord and cannot be forced. At the Guru’s request, Shaikh Brahm/Farid feels
    in the milk and finds four gold coins. The villager, thinking them magicians,
    leaves without his basin. The Guru then utters a hymn using images of dark night,
    sleep, death, theft, and divine protection.
