canonical_text:
  quote: ''
  summary: At age nine, Nanak is brought to receive the Hindu janeu, or sacrificial
    thread. The family priest attempts to place it on him; Nanak stops him, asks its
    benefit, hears its stated religious and caste value, and replies with verses redefining
    a true thread as virtues for the soul rather than a purchased cord.
  language: English
