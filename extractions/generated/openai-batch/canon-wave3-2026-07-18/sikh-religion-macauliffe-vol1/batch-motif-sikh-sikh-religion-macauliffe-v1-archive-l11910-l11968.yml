canonical_text:
  quote: "“If such a small and light thing as a needle cannot go to the next world,
    how can thy wealth reach there?”"
  summary: The passage recounts a teaching episode in which Guru Nanak uses a needle
    to instruct Duni Chand that ordinary wealth cannot be carried to the next world,
    while charity given in God's name and feeding the poor will accompany him. Duni
    Chand distributes treasure, becomes the Guru's disciple, and the Guru utters verses
    on the falseness of worldly status, possessions, bodies, beauty, and relationships
    when the Creator is forgotten. The opening lines also state that a father's soul
    had entered a wolf because he died desiring meat being cooked by a Sikh.
  language: English
  quote_policy: quoted
