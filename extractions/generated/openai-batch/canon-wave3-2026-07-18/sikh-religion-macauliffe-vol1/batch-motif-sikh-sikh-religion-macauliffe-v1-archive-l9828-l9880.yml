    live with the family, and take up commerce. Nanak responds by having Mardana play
    the rebeck while he sings a devotional hymn comparing attachment to God with drunkards’
    attachment to stimulants and fishes’ need for water, and describing the Lord as
    a fruit-bearing tree whose name is ambrosia.
