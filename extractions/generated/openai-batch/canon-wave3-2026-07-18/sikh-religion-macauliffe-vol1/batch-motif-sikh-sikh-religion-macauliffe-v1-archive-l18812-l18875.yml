canonical_text:
  quote: ''
  summary: 'The passage contrasts outward ablutions and body-washing with inward purity
    and meditation on the True One. It presents God as the one who sees all, grants
    greatness, appoints duties, and can reduce monarchs to helplessness. A framed
    slok attributed to Guru Nanak criticizes a dishonest ancestral rite: stolen offerings
    implicate the ancestors in the next world, the Brahman intermediary is punished,
    and only gifts made from honest labor bear fruit. The passage ends by locating
    purity in the heart where God dwells rather than in bodily washing.'
  language: English
  quote_policy: summarized
