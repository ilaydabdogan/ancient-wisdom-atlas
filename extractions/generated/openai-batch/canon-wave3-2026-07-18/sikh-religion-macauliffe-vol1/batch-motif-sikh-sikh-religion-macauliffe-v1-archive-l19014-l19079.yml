  summary: Guru Nanak rebukes one who reviles women, using the image of the woman
    as a vessel through which conception, birth, marriage, friendship, worldly life,
    and kingship occur. The passage states that only the True God is independent of
    such a vessel, praises the mouth that praises God, warns that each person must
    bear the result of their own acts, and describes the evil speaker as rejected
    and punished in God’s court.
