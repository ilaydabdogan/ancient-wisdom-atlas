canonical_text:
  quote: He was One, though the poets called Him by many names.
  summary: 'The passage surveys early religious concepts: Prajapati as father of gods
    and lord of living creatures; Aditi as identified with deities, humans, past and
    future beings, air, and heaven; and an inexpressible One before cosmic distinctions,
    darkness, and a germ covered by a husk. It compares Aditi''s all-encompassing
    character with Greek Zeus and Latin Jupiter, says Guru Nanak expanded the one-God
    conception, and notes contrasting reports about German worship in Tacitus and
    Caesar.'
  language: English, with quoted Greek and Latin lines
  quote_policy: quoted
