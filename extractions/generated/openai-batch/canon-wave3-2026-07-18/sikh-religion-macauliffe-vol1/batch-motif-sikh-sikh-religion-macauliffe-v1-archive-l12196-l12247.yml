canonical_text:
  quote: Death entereth not where the soul’s light is blended with God’s.
  summary: A hymn attributed to Nanak teaches that the Name, the Guru, and the Word
    bring knowledge, light, union with God, and freedom from death. The addressed
    boy is later identified as Bhai Budha and is said to confer Guruship marks on
    Guru Nanak’s first five successors. Kalu and his people come to the Guru’s habitation,
    Sikh societies begin to form, and the Guru adopts conventional dress and is hailed
    as a great saint.
