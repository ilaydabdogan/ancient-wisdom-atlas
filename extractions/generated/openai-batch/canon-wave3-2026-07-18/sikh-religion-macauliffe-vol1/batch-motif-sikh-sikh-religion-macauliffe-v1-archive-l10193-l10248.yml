canonical_text:
  quote: ''
  summary: In a forest setting, the Guru and his attendant are observed by Shaikh
    Kamal. The attendant plays a rebeck and sings a couplet about the one God. Kamal
    memorizes it and reports it to his master, Shaikh Brahm, who welcomes the Guru
    and asks him to explain the couplet. Shaikh Brahm frames the issue as one Lord
    and two ways; the Guru replies that there is one Lord and one way and that one
    should remember the one God. The Muhammadan priest then proposes torn clothing
    and a blanket as a dress by which to obtain the Lord, and the Guru begins to challenge
    that instruction.
  language: English
