canonical_text:
  quote: ''
  summary: A hymn asks the preserving Lord to save the speaker, recalls named saints
    whom God preserved, and asks that Nanak be extricated from the ocean of the world.
    The narrative then says the Emperor reveres Nanak, offers him a present, and grants
    his request to release the captives of Saiyidpur and restore their property. The
    captives leave with the Guru, find that the remaining people of Saiyidpur have
    been killed, and the Guru begins a lament accompanied by Mardana's rebeck.
  language: English
