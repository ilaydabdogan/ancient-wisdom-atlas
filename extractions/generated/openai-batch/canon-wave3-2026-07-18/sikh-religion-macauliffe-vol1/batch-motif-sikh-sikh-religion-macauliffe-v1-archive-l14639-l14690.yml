canonical_text:
  quote: Without good acts the professors of both religions shall suffer.
  summary: Guru Nanak responds to a comparison of Hindu and Muhammadan religion by
    saying both are insufficient without good acts. He then utters a hymn in the Tilang
    measure that redefines fasting and worship as inward restraint, meditation, kindness,
    and extinguishing lust. A Qazi praises him as a saint of God and tells the high
    priest, who comes to see Nanak and shakes hands with him.
  language: English
  quote_policy: quoted
