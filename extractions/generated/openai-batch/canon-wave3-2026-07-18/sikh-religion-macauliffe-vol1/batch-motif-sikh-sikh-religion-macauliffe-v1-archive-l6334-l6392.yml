canonical_text:
  quote: Make kindness thy mosque, sincerity thy prayer-carpet, what is just and lawful
    thy Quran
  summary: A Qazi questions the Guru about his statement that there is no Hindu and
    no Musalman. The Guru answers the Musalman portion by teaching that true Muslim
    identity requires love of saintly religion, renunciation of pride and wealth,
    acceptance of divine will, self-effacement, worship of the Creator, and kindness
    to all. When the Qazi asks further questions, the Guru has Mardana play the rebeck
    and sings instructions that equate Islamic ritual forms and sacred objects with
    moral virtues and right conduct.
