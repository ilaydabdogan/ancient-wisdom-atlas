canonical_text:
  quote: ''
  summary: Guru Nanak speaks of divine juice, nectar, and the Guru's word as producing
    intoxication in God's love and absorption in God. The Jogis ask whether he lives
    by begging and whether he is an Udasi or hermit. He answers that one absorbed
    in the Formless need not beg, and defines a hermit as one who uses knowledge to
    wrestle with the heart, understands the organs and passions, fixes divine knowledge
    to the mind, makes continual pilgrimage, and washes pride from the heart. A note
    explains that Sikhs and Moslems use 'Gate of God' for God's throne or court.
  language: English
  quote_policy: summarized
