canonical_text:
  quote: What pleaseth God, O Nanak, shall happen ; what is man ?
  summary: 'The passage first laments the suffering and religious disruption of captured
    women after Babar''s conquest. Mir Khan then observes miracles around Guru Nanak
    and Mardana in prison: Nanak''s bundle hangs unsupported above his head, Mardana''s
    horse follows as he plays the rebeck, and a hand-mill turns by itself while Nanak
    feeds it corn. Mir Khan reports this to Babar, who visits the prison and addresses
    Nanak. Nanak is in a trance, reflecting on the slaughter of innocents, and then
    utters a hymn not found in the Guru Granth Sahib. A note compares the phrase about
    human insignificance before God with another poetic passage.'
  language: English
  quote_policy: quoted
