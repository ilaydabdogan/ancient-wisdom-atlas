canonical_text:
  quote: ''
  summary: 'The passage describes young Guru Nanak’s early schooling: school materials
    and gifts are presented to the schoolmaster, the alphabet is written for Nanak,
    and he copies it from memory after one day. It then introduces an alphabetic acrostic,
    the patti or tablet in Rag Asa, said to express Nanak’s divine aspirations, teachings,
    and praise of the Creator. The included verses identify the one Lord and Primal
    Being, urge attachment to God’s service, warn the forgetful person, and use the
    image of an account to describe true education and pious understanding.'
  language: English
  quote_policy: summarized
