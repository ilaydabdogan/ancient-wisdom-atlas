  summary: The passage describes the realm of action and the true realm. It says force
    belongs to the realm of action, whose inhabitants include incomparable powerful
    warriors, heroes filled with the might of Ram, many Sitas, and saints. God or
    the True One dwells in hearts and in the true realm, looks favorably on its denizens,
    and makes them happy. The passage closes by saying that the continents, worlds,
    and universes there cannot be exhaustively described.
