  quote: ''
  summary: Guru Nanak rejects the need for torn clothing or special religious garb
    and says householders can find the Lord if their hearts are fixed on Him. A poetic
    exchange uses the image of a young wife longing for her absent Beloved, a woman
    lamenting from the grave that she has not met the Lord, and a teaching that virtue
    rather than outward appearance enables meeting the Beloved. Shaikh Brahm asks
    what word, virtue, spell, or dress can captivate the Spouse.
