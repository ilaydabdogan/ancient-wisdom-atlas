canonical_text:
  quote: ''
  summary: Guru Nanak appears before Emperor Babar with intense radiance. Babar asks
    for grace; the Guru tells him to free his captives. Babar seeks a promise that
    his empire will continue through generations, and the Guru replies that it will
    remain for a time. Babar orders the prisoners clothed with robes of honour and
    asks for instruction; the Guru counsels just judgment, reverence for holy men,
    avoidance of wine and gambling, mercy to the vanquished, and worship of God. At
    parting, Babar urges the Guru to embrace Islam on the grounds of shared monotheism
    and Muhammad’s mediation; the Guru answers that there is only one God and that
    numberless Muhammads and prophets stand in God’s court.
  language: English
  quote_policy: summarized
