canonical_text:
  quote: ''
  summary: The passage states that God sends and calls human beings and pardons. It
    urges seekers to find the society of those who have tasted God's elixir and to
    take the Guru's protection, through which wealth, supernatural power, wisdom,
    divine knowledge, and emancipation are obtained. It praises equanimity and says
    that one disciplined by the Guru obtains God and is absorbed in God. A following
    hymn section teaches that impure hearts must be purified before emancipation,
    using the image of gold purified by borax, touchstone, and fire until the Assayer
    is satisfied. It warns that lust, wrath, and pride damage the body and world,
    that actions bring recompense, and introduces a satire on hypocritical religious
    men.
  language: English
  quote_policy: summarized
