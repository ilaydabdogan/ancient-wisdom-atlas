canonical_text:
  quote: ''
  summary: The passage narrates that Nanak astonished his Persian teacher Rukn-ul-Din
    and, in reply to his injunctions, composed an acrostic on the Persian alphabet.
    The acrostic teaches remembrance of God, utterance of the Name, humility, repentance,
    observance of the Shariat, awareness of bodily death, preparation for a journey
    with the Lord, restraint of the mind, and remembrance of the Creator. Footnotes
    explain Shariat as Muhammadan law, define an adh as a very small coin value, and
    cite a Hindu injunction attributed to Parasar concerning the language of Yavan.
  language: English
  quote_policy: summarized
