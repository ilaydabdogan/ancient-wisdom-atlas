  summary: The passage criticizes priests, self-styled pandits, and pretended religious
    renunciants; states that human conduct is known to the True One and that caste
    has no force in the next world; affirms God as creator and doer, the Guru as revealer,
    and divine absorption for those who know God; praises repetition of the one God's
    name as the highest duty; and uses water in a vessel as an analogy for the mind
    restrained by divine knowledge.
