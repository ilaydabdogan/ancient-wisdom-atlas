  quote: ''
  summary: A hymn attributed to Guru Nanak presents inner knowledge, control of passions,
    mercy, continence, and rejection of desire as true religious discipline. It then
    develops a devotional image in which the devotee is like a wife longing for and
    fearing neglect by the divine Spouse; rejection of pride leads to pleasing the
    Spouse and being absorbed in Him.
