canonical_text:
  quote: There is no Hindu and no Musalman.
  summary: A verse describes Nanak as called mad because of exclusive devotion to
    God. The narrative then says Guru Nanak adopted religious dress, kept silence
    for one day, and repeatedly announced that there was no Hindu and no Musalman.
    The Sikhs interpret this as meaning that both Hindus and Muhammadans had forgotten
    their religious precepts. The Nawab's Qazi complained, Nanak was summoned before
    Daulat Khan/the Governor, and the Governor directed the Qazi to ask Nanak the
    meaning of his utterance.
  language: English
  quote_policy: quoted
