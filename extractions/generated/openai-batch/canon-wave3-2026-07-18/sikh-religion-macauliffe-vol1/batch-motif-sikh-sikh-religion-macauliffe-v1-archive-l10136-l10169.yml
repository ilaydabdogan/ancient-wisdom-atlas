canonical_text:
  quote: ''
  summary: Kalu appeals to his son, the Guru, on grounds of health and safety. The
    Guru replies with verses expressing lack of anxiety about death or desire for
    life, trust in God as cherisher and decider, and the satisfaction and divine knowledge
    gained through God's name and the Guru's instruction. The Guru then tells his
    parents that he has returned home after being a hermit and asks them to obey God's
    order and let him depart again. His mother laments that he has only just returned
    after twelve years; after the Guru reassures her, she falls silent.
  language: English
