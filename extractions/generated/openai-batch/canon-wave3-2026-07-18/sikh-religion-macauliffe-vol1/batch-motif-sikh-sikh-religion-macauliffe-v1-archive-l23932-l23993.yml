  quote: Nanak, God is my Beloved ; I belong to none besides.
  summary: A hymn of Guru Nanak presents the soul as a woman or wife longing for God
    as Beloved, merchant, lover, and spouse. The speaker values God's name and the
    Word above intellect or study, describes exchanging hearts with God, and warns
    that sinful worldly attraction ends in bitterness and death.
  language: English
  quote_policy: quoted
