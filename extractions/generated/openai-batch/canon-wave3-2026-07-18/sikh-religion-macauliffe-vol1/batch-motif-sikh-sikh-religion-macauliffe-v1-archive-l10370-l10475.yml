canonical_text:
  quote: ''
  summary: Guru Nanak responds to Shaikh Brahm’s questions about praise of the one
    God and intercession by having Mardana perform from the Asa ki War. The hymn praises
    the Guru and the Creator. Nanak teaches humility through a water simile, assures
    Shaikh Brahm that his devotion will be accepted, defines udas for a Sanyasi as
    detached use of worldly things while desiring God, and later encounters Khatris
    who object to his faqir appearance and Mardana’s singing.
  language: English
  quote_policy: summarized
