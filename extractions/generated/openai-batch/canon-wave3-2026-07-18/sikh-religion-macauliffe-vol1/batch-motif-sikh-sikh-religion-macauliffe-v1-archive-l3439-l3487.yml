canonical_text:
  quote: ''
  summary: The passage describes Mani Singh accompanying the tenth Guru to southern
    India, hearing the Guru explain the Granth Sahib, serving later as Granthi at
    the Har Mandar in Amritsar, and being commissioned by Sikhs to produce a trustworthy
    life of Guru Nanak by separating true material from alleged interpolations. It
    also describes Mani Singh’s textual works, later additions by copyists, his rearrangement
    of hymns and subsequent censure and pardon, and his 1738 request to Zakaria Khan
    for permission to hold a Diwali fair. A footnote identifies Diwali as originally
    a Hindu festival honoring Lakshmi.
  language: English
  quote_policy: summarized
