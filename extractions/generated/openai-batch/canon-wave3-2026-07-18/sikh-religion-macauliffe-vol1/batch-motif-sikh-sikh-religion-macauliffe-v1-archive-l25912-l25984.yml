  quote: ''
  summary: A hymn attributed in the heading to Guru Nanak addresses a Jogi and rebukes
    him for outward ascetic signs combined with worldliness, begging, sensual attachment,
    lack of self-knowledge, and deception. It contrasts these with love of God received
    under the Guru's instruction, contemplation, good works, compassion, divine light,
    and highest divine knowledge, and warns of punishment by Death, bondage, transmigration,
    and lack of emancipation.
