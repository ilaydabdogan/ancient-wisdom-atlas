  summary: A devotional hymn attributed to Nanak depicts a woman waiting for and being
    embraced by God as Spouse and Beloved. Birds cry and sing devotional-sounding
    calls. The body is described through mansions, a superior tenth home, and a temple
    entered by God. The speaker seeks refuge at God's feet, praises God, receives
    peace through divine favor and the Guru's teaching, and describes a rain of nectar
    when love with God is established.
