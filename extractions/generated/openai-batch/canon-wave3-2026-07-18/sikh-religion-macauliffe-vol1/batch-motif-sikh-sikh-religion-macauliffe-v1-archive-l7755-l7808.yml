- id: obs:2
  text: The Guru tells the hearer to make God the well, God's name the necklace of
    waterpots, and the mind an ox, then to irrigate with nectar and fill the parterres
    so as to belong to the Gardener.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pandit asks how irrigated soil can yield produce before it has been dug
