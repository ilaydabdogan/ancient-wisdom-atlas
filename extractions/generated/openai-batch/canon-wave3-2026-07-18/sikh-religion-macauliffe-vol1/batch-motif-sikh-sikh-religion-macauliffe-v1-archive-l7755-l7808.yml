canonical_text:
  quote: Make God the well, string His name for the necklace of waterpots
  summary: Chatur Das, called the Pandit, asks Guru Nanak how the ground may be prepared
    and God found. The Guru answers through agricultural metaphors of well, waterpots,
    ox, irrigation, nectar, and digging with a spade made from lust and anger. The
    Pandit then uses a crane-and-swan image for his own limitation and the Guru's
    spiritual status, and the Guru replies that divine mercy can change a crane into
    a swan. The Pandit asks the Guru to bless and praise the city; the Guru responds
    with an allegory of a frail city and a boy king, glossed in footnotes as body
    and heart, with mothers and fathers glossed as hope, desire, love, and hate.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Chatur Das replies to the saint that the salagram and sweet-basil necklace
