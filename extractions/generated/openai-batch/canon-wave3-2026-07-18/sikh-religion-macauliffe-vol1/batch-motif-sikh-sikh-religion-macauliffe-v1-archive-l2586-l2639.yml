    each addressed deity receives full homage, flattery, and sacrifice; deity cults
    coexist or compete in shared sacred landscapes; Shiv and Vishnu worship are differentiated
    by knowledge and devotion but remain within Hinduism; Greek lesser deities are
    subordinated to Zeus, while Indian seers and philosophers gradually evolve belief
    in an infinite supreme power.'
