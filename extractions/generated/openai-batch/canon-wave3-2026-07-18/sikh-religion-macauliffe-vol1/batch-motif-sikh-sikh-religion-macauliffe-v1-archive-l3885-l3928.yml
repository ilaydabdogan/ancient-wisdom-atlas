canonical_text:
  quote: ''
  summary: The passage discusses competing traditions for Guru Nanak’s birth month.
    It says Handali and modern Janamsakhis give Kartik, while older Janamsakhis give
    Baisakh. It explains the Kartik observance as arising from Bhai Sant Singh Gyani’s
    effort to create an Amritsar fair on the same date as the Hindu Ram Tirath fair,
    thereby diverting Sikhs from that pilgrimage. The author argues that Baisakh is
    the correct birth month, citing older Janamsakhis, earlier Nankana practice, and
    chronological inconsistency in the Nanak Parkash.
  language: English
