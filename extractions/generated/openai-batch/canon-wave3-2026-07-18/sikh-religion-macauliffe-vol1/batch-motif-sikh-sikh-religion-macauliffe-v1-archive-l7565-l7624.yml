canonical_text:
  quote: ''
  summary: Mardana questions visible social inequality between a man carried in ease
    and the barefoot bearers serving him. Guru Nanak answers that present joy or misery
    results from actions in previous states of existence, and Mardana falls at his
    feet. Guru Nanak and Mardana then travel to Gorakhmata, where a formerly withered
    pipal-tree is said to have become green when the holy man sat beneath it. Sidhs
    question Guru Nanak about his disciple-lineage and instruction, and he responds
    with a hymn addressing the limitless divine who fills sea, land, and the upper
    and lower regions.
