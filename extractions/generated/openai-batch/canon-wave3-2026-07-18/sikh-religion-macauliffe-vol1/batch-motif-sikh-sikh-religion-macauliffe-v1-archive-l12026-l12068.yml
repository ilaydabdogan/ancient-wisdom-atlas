  quote: ''
  summary: A wealthy supplicant is advised to approach the Guru on foot, recovers
    his sight when the Guru’s residence becomes visible, receives the Guru’s hospitality,
    and founds Kartarpur with a Sikh temple dedicated to the Guru. A Brahman who refuses
    the Guru’s cooked food on ritual-purity grounds tries to prepare his own cooking
    place but finds bones wherever he digs; overcome by hunger, he asks for the food
    he had rejected, and the Guru gives it to him.
