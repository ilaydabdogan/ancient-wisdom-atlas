canonical_text:
  quote: ''
  summary: A fragmentary opening mentions an unnamed person speaking of worldliness,
    taking up a basin, and departing. Shaikh Brahm then asks Guru Nanak what aid,
    besides God's name, is needed for future happiness, after stating that attachment
    to mammon makes salvation difficult. Guru Nanak answers with a hymn about bodily
    birth, destiny written by the Creator, loss of divine remembrance through mammon,
    inevitable departure from the world, the approach of Death, and the saving raft
    of God's fear amid the whirlpool of domestic entanglements. Afterward, people
    bring bread; Shaikh Brahm says he has already eaten, and the people are annoyed
    that their offerings are refused.
  language: English
  quote_policy: summarized
