  quote: ''
  summary: A devotional passage addresses God as infinite, fearless, eternal, and
    creator of all. Nanak praises those who serve, meditate on, and worship God, saying
    they attain happiness, emancipation, freedom from fear, release from Death's noose,
    and absorption in God. The passage also describes saints' varied worship and contrasts
    ritual and scriptural practices with pleasing God as the mark of true sainthood.
    It closes by affirming God's sovereignty, creation of the world, the world's eventual
    disappearance, and God's knowledge of all things.
