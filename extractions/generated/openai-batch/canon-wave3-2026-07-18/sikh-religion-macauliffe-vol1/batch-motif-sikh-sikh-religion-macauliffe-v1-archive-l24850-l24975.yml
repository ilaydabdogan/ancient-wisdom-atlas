canonical_text:
  quote: ''
  summary: The passage teaches that human birth is conditioned by deeds, that forgetting
    the Name leads to ruin, and that ritualism, hypocrisy, superstition, and idolatry
    are ineffective. It presents the true Guru as the one through whom the Name, peace,
    the way, release from transmigration, and freedom from Maya's binding knot are
    obtained. It uses metaphors of the spider's web, churning milk or water, Maya's
    cable, God's court, the Guru's goad, commerce, and a stone sinking in water. A
    following hymn voices fear, devotion to the one True Being, reliance on the Lord
    as Giver and Deliverer, crossing over by the Name, and longing for attachment
    to the Beloved.
  language: English
  quote_policy: summarized
