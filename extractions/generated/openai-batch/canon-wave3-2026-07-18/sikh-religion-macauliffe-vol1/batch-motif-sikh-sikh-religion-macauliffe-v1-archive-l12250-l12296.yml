canonical_text:
  quote: ''
  summary: The passage describes the daily devotional routine at Kartarpur, including
    recitations, hymn reading, singing, meals, and retirement. It then presents the
    Guru instructing Malo and Bhago that severe Hindu penances are works of darkness,
    contrasting them with Sikh devotional practices of disciplining the mind, pious
    discourse, and singing or listening to divine praise. Finally, Kalu asks for a
    definition of a holy man, and the Guru begins by identifying ethical qualities
    such as friendship, sympathy, joy at others' welfare, avoidance of evil company,
    and pure intentions.
  language: English
  quote_policy: summarized
