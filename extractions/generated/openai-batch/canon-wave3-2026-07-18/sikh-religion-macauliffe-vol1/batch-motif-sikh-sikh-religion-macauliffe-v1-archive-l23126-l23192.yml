canonical_text:
  quote: ''
  summary: 'The passage presents hymnic teaching attributed to Guru Nanak: abandonment
    of hopes, desires, mammon, worldly love, superstition, and family attachment;
    refuge in saints and obedience to the Guru’s instruction; repetition of the true
    Name; possession of the Name as treasure; warnings that worldly love causes rebirth
    and leads to the city of Death; and the final removal of such love through divine
    favour, ending in absorption in God. A footnote explains the fourth state as mental
    absorption in God and salvation during life. The passage ends with the opening
    of a new narrative in which Guru Nanak goes to Gorakhmata, also called Nanakmata.'
  language: English
  quote_policy: summarized
