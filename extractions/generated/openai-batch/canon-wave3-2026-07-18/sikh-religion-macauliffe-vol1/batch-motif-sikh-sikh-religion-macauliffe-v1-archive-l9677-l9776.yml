canonical_text:
  quote: ''
  summary: Guru Nanak travels from Shaikh Brahm's district to Bisiar, where most inhabitants
    reject him, but Jhanda the carpenter receives him, washes his feet, drinks the
    water, recognizes him as Guru, and joins his travels. The party later travels
    east to an ocean island without food, where Nanak composes the Jugawali on the
    four ages; Jhanda writes and circulates it, then returns home. Guru Nanak and
    Mardana continue into a lonely desert. Mardana complains of hunger and danger;
    Nanak consoles him and composes a hymn about religious seekers enduring hunger,
    renunciation, and pilgrimage for God. Nanak then tells Mardana to think of a hymn
    and play the rebeck, but Mardana says he is too weak from hunger. Nanak directs
    him to eat fruit from a tree but not to take any away. Mardana eats and secretly
    keeps some. Later, when hungry again, he eats the stored fruit, collapses, confesses
    disobedience, and Nanak says the fruit was poisonous but had been blessed for
    the occasion; the supplied passage ends mid-sentence.
  language: English
  quote_policy: summarized
