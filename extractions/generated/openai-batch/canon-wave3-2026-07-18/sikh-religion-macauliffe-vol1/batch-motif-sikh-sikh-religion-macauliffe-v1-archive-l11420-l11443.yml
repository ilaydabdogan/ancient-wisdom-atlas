  summary: The passage presents the Guru replying with Mardana’s musical accompaniment.
    The reply says that one God commissioned him, that all receive God’s gifts, that
    reliance on human support brings loss, that God alone is the Giver, that kings
    and emperors are made by God, and that a person who begs from Emperor Babar is
    foolish.
