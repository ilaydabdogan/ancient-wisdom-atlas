canonical_text:
  quote: The earth is a book, the furrow the writing.
  summary: The passage contrasts bodily pleasures with the dwelling of God's name,
    teaches honorable speech and avoidance of harsh words, praises those pleasing
    to God, and presents agricultural labor through an allegory in which oxen are
    disciples, the ploughman is their Shaikh, the earth is a book, and the furrow
    is writing. It commends eating from one's earnings and giving a portion away as
    the true way, then notes that the Guru departed.
  language: English
  quote_policy: quoted
