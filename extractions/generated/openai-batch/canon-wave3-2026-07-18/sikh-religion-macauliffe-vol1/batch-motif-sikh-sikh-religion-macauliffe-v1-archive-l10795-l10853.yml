canonical_text:
  quote: If it please God, He giveth greatness; and if it please Him, He giveth punishment.
  summary: Mardana is told by the Guru to utter “Wah Guru,” release the horse, and
    play Rag Asa. The Guru sings a hymn contrasting women’s former beauty, bridal
    honor, wealth, and attendants with their present shorn hair, dust, chains, broken
    pearls, and dishonor by soldiers. The hymn addresses the Primal Being/God as giver
    of greatness and punishment and links punishment with forgetting God amid pleasures.
    It also notes Babar’s rule and the distress of Pathan princes. A footnote explains
    a bridal water rite in which a female relative waves water around the bride’s
    head and drinks it to take on the bride’s ills.
  language: English
  quote_policy: quoted
