  quote: In the beginning there was indescribable darkness
  summary: The passage presents a hymn describing an initial state of darkness and
    void in which earth, heaven, luminaries, waters, afterlife realms, deities, social
    distinctions, rituals, sacred books, birth, death, pain, and pleasure did not
    yet exist; only the One unseen God existed. It then says God created the world,
    sustained the sky without supports, created Brahma, Vishnu, and Shiv, issued order,
    and watched over all. The following prose comments on Indian monotheism and on
    anthropomorphic representation of an unseen Supreme Being.
