canonical_text:
  quote: ''
  summary: A cosmogonic hymn says that before scriptures, sunrise, and sunset, the
    imperceptible God spoke, saw all, created the world, sustained the sky, created
    Brahma, Vishnu, and Shiv, revealed the Guru's words to a few, ordered and watched
    everything, and brought forth cosmic regions. The narrative then describes Brahm
    Das falling at the Guru's feet, discarding an idol, serving the Guru while retaining
    pride, being sent to seek a guru through four faqirs in the wilderness, and being
    beaten by a red-clad woman guarding a temple.
  language: English
  quote_policy: summarized
