  quote: ''
  summary: The passage teaches that remembrance of God destroys sin, that God fills
    all places and dwells in hearts, and that association with saints, service to
    the Guru, and love of God's name bring emancipation and protection from Death's
    agents. A following hymn addressed to a selfish Brahman urges service to the true
    Guru, repetition of God's name, and disregard of worldly entanglements such as
    family attachment, ostentatious ritual, tillage, trade, taxation, and perishable
    wealth.
