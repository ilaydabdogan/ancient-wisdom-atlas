canonical_text:
  quote: ''
  summary: The hymn contrasts the permanence of the Lord with the passing world. It
    says emancipation comes through relation to the holy man, the Guru, the Name,
    and the Word. Worldly attachment, pride, and forgetfulness of God lead to wasted
    life and transmigration, while Guru-instructed persons burn worldly love, meditate
    on the Name, restrain the mind, join the Sikh congregation, lose fear of Death,
    behold the True One, and are blended or absorbed in God.
  language: English
  quote_policy: summarized
