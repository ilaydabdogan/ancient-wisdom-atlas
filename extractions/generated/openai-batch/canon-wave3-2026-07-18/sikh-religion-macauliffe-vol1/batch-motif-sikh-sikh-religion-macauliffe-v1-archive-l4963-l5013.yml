canonical_text:
  quote: ''
  summary: The passage gives didactic verses about conduct, the indwelling God, service
    to the guru, deliverance, and love of God. It then states that Guru Nanak became
    a fair Persian scholar and may have been influenced toward free thought and toleration
    by Muhammadan writings. In the narrative, Nanak’s father, distressed and thinking
    him insane, sends him to herd buffaloes. Nanak falls asleep, the cattle enter
    a neighbor’s field, and Nanak says God will bless the field. After the owner complains
    to Rai Bular, messengers inspect the field and find no blade damaged. The field
    is identified as Kiara Sahib. A footnote says the preceding composition is not
    in the Granth Sahib and that some Sikhs deny its attribution to Guru Nanak.
  language: English
  quote_policy: summarized
