  quote: ''
  summary: The passage presents hymnic verses from the Sohila. It describes one God
    with many forms, cosmic elements as implements of worship, divine light present
    in everything and manifested through the Guru's teaching, devotional longing for
    God's lotus feet and favor, the destruction of lust and wrath through meeting
    saints, predestined finding of the Guru, absorption of the soul in God's love,
    reverence toward saints, and the pain of pride compared to a thorn ending in death's
    mace.
  language: English
