canonical_text:
  quote: ''
  summary: The passage states that the Creator's works cannot be numbered. It identifies
    the spoken-of bull as righteousness, born of mercy and supported by patience,
    maintaining the order of nature, while also asking how more worlds beyond the
    earth could be supported. It says living things, their species, and colours have
    been written with a flowing pen, but no full account can be made. God is addressed
    as powerful, beautiful, generous, and formless; by one word God expanded the world
    and produced countless rivers. The speaker declares inability to describe God
    or offer himself even once as a sacrifice. The next section begins by listing
    numberless worshippers, lovers, adorers, ascetics, and reciters.
  language: English
  quote_policy: summarized
