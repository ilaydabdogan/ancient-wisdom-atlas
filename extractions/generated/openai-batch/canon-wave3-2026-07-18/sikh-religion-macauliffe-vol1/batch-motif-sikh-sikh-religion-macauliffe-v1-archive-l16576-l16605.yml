  quote: ''
  summary: The stanza says that those who praise God still do not know Him, just as
    rivers and streams enter the sea without knowing its extent. It contrasts kings
    and emperors with great wealth against a worm that remembers God in its heart.
    The notes give alternate translations about the Veds failing to find God's limits,
    God as the root or principle of all things, and the sea as king of streams compared
    with God as monarch of all.
