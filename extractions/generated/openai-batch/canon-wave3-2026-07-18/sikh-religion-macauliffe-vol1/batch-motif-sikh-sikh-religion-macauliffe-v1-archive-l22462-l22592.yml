canonical_text:
  quote: ''
  summary: A frame states that an unnamed person dethroned by his brother went to
    Guru Nanak for advice. The hymn teaches that pride, religious display, worldly
    rank, and wealth do not lead to God; the Guru’s instruction, the Guru’s word,
    and the divine Name remove pride, sins, and fear of death. It presents death as
    universal, recalls Brahma’s error in relation to Vishnu’s lotus, and says God
    alone is immovable while created beings are destroyed.
  language: English
