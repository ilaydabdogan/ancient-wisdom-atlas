  quote: ''
  summary: The passage presents a hymn on God's uniqueness, formlessness, transcendence,
    lack of kinship ties, and indwelling light. It says God is known through the Guru's
    teaching, that Guru instruction opens understanding, that service to the True
    Guru and repetition of the Word bring deliverance, that the soul blends with the
    Supreme Soul by seeking divine protection, and that a person without the Guru
    is like a fish without water.
