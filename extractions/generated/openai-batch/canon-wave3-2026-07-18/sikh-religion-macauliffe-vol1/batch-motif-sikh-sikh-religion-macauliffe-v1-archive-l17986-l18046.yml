  quote: ''
  summary: The passage praises those who meditate on God, act honestly, live simply,
    and free themselves from worldly entanglements. It enumerates many forms of creation
    and states that God, the Creator and Bestower, knows and cares for all. It questions
    ritual marks and threads without the true Name, and introduces good acts, charities,
    penances, and sahaj jog, with a note contrasting sahaj jog with hath jog.
  language: English
