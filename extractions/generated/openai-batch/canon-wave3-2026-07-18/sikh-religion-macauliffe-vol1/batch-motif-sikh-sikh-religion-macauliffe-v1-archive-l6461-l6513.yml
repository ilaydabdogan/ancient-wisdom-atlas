  quote: ''
  summary: Guru Nanak explains that the Qazi and the Nawab were not inwardly attentive
    during prayer, correctly identifying the Qazi's worry about a newborn filly near
    a well and the Nawab's thoughts of buying horses in Kabul. Both admit his statements
    and honor him. Nanak then teaches what makes a true Musalman and answers a Muslim
    audience's question about God's authority and salvation by describing multitudes
    of revered figures at God's gate.
