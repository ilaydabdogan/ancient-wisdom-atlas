canonical_text:
  quote: ''
  summary: A hymn praises the giver of embodied life, the moon and sun, and the earth,
    and says that Death has no claim on those who meet saints. The narrative then
    describes Guru Nanak deciding to visit Makka, adopting the dress and ritual equipment
    of a Muslim pilgrim, traveling with Mardana, meeting a Muslim faqir, answering
    an identity question with a hymn about lasting intoxication, and being accompanied
    by an unusual cloud on the road.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hymn attributes water, breath, life in the body, the moon and sun, and
    the earth as an abode to an unnamed divine giver.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hymn names Sidhs, Strivers, Jogis, Jangams, and Pirs, and says the speaker
    will praise and serve them if he obtains the Name from them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hymn uses images of paper and salt not melting in clarified butter and
    the lotus remaining unaffected by water, and asks what Death can say to those
    who meet such saints.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a successful discussion with the Jogis, the Guru decides to visit Makka.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Guru disguises himself in blue Muhammadan pilgrim dress and carries a
    faqir’s staff, a collection of hymns, an ablution cup, and a prayer carpet.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: When an opportunity offers, the Guru shouts the Muhammadan call to prayer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mardana, described as the Guru’s faithful minstrel and rebeck-player, accompanies
    him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the Guru meets children on the journey, he joins in their sports.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Guru meets a Muhammadan faqir who is also going on the Makkan pilgrimage
    and spends a night with him in spiritual conversation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The faqir offers the Guru a bhang-pouch and asks whether he is a Hindu or
    a Musalman; the Guru replies with a hymn previously addressed to Emperor Babar
    about an intoxication whose effects do not depart.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the road to Makka, a cloud over their heads accompanies them, and the pilgrim
    becomes alarmed at the unusual occurrence.
  category: action
  evidence_refs:
  - ev:7
