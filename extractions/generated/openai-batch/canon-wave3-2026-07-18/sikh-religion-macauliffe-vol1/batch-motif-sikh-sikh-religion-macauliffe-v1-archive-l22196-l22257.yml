canonical_text:
  quote: If thou repeat the Name of the Bright One, thy soul shall be absorbed in
    Him.
  summary: The passage admonishes a Jogi and other human hearers to remember the one
    Lord rather than pursue hypocrisy, greed, property, sleep, eating, or buried wealth.
    It says the soul can be absorbed in God through repetition of the divine Name,
    but that after the body is burnt the soul regrets wasted opportunities. It presents
    human life as precious, fate as decided by acts, creation as cared for by its
    Maker, and devotion as a willingness to become lowly and be a sacrifice to the
    Lord obtained through the Guru's favour.
  language: English
  quote_policy: quoted
