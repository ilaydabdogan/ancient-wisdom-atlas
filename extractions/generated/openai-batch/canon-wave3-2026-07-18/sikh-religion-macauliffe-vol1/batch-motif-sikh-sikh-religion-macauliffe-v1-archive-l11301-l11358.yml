canonical_text:
  quote: fear of Thee is my bhang, my heart its pouch
  summary: Babar is said to become receptive to spiritual truths, praises the Guru,
    and offers him bhang. The Guru answers that he has already taken a bhang whose
    intoxication never subsides, and sings a hymn identifying fear of God with bhang,
    longing for God's sight with hunger, and saintly presence with fragrance and purity
    beyond caste. Babar asks the Guru to remain with him; the Guru is distressed by
    the prisoners, sings again, falls into a trance, and bystanders explain that he
    is suffering after beholding God's wrath.
  language: English
  quote_policy: quoted
