  summary: A Japji passage states that rebirth, deliverance, divine giving, punishment,
    praise, justice, court, measures, mercy, and ordinances depend on God and are
    beyond price. It also says that one who receives the boon of praising God is called
    king of kings, and that people continue speaking of God and fixing their thoughts
    on God.
