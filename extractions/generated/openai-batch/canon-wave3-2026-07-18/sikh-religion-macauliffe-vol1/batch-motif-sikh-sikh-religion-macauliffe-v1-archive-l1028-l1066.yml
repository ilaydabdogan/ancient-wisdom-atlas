  summary: The excerpt argues that recognizing Panjabi as an official or optional
    official language in the Panjab would help preserve Sikh religion and make the
    ethical instruction of the Granth Sahib accessible. It then describes how, after
    English occupation, administrators from the North-Western Provinces brought Urdu
    into official use, leaving officials and natives mutually unintelligible and Panjabi-language
    complaints unheeded.
