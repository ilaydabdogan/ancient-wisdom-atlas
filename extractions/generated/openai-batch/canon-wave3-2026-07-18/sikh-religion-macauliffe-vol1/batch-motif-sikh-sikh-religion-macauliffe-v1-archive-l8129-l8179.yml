  quote: ''
  summary: Guru Nanak speaks verses on the changing fortunes of human life and exhorts
    praise of the True One. As Guru Nanak and Mardana travel, a field watchman preparing
    roasted gram notices them and intends to fetch better food and bedding. Guru Nanak
    tells him that his pallet and love are sufficient, and the watchman later receives
    spiritual dignity for his kind intentions. A shopkeeper with a religious inclination
    hears of Guru Nanak and vows not to eat or drink until meeting him.
