canonical_text:
  quote: ''
  summary: The passage states that emancipation, discernment, and sight of the way
    require the Guru's instruction. It describes people as spiritually blind and as
    reversing true and false judgments. It contrasts service to a handmaiden, identified
    in a footnote as Mammon, with failure to see the Master, and uses the image of
    churning tank water without producing butter. It closes this section with a statement
    about self-knowledge. A following heading introduces a comparison between the
    pious longing for God and a young bride's longing for her spouse; the bride cannot
    sleep and pines in the Beloved's absence.
  language: English
  quote_policy: summarized
