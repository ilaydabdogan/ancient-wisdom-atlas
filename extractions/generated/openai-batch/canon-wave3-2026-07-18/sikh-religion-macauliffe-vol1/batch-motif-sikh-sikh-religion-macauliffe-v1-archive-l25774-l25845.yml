canonical_text:
  quote: Make thy body into a raft by which thou mayest cross over.
  summary: The passage instructs worshippers to adore God through an extended image
    of making the body a raft and fashioning an enduring lamp from the heart’s fire,
    divine knowledge, and good deeds. This lamp is floated on water, remains steady
    against wind and death, reveals God’s throne, and brings deliverance. A following
    address criticizes a Jogi who begs for food and clothing without the Guru’s instruction,
    contrasting him with one taught by the Guru, satisfied by love and the Word, and
    equal in vision toward all people.
  language: English
  quote_policy: quoted
