canonical_text:
  quote: ''
  summary: The passage recounts that, after Guru Nanak's death, a sheet was removed
    and nothing was found beneath it; flowers on both sides were in bloom and were
    taken by Hindu and Muslim groups, while Sikhs saluted the place where the Guru
    had lain. It gives the date and place of his death, describes a Sikh shrine and
    Muhammadan tomb on the Ravi later washed away by the river, and then presents
    Bhai Gur Das's depiction of the world's moral, social, and religious disorder
    at the rise of the Sikh religion.
  language: English
  quote_policy: summarized
