canonical_text:
  quote: ''
  summary: The Guru leaves after an insulting order and reaches a village at the site
    of present Goindwal. Only a poor leper receives him and hosts him for the night.
    After the leper laments his condition, the Guru recites a teaching on suffering,
    remembrance of God, sin, divine favour, and the Name. The Guru blesses the leper,
    who is cured, falls at the Guru's feet, and begins to utter the Name.
  language: English
  quote_policy: summarized
