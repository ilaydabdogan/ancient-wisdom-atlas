  quote: ''
  summary: The passage describes religious division among Hindus and Muhammadans,
    loss of guidance, and sin throughout creation. Pure religion is personified as
    weeping, burdened by human transgressions, and appealing to God. God hears human
    cries, gives Guru Nanak supernatural attributes along with the Name and humility,
    and sends him into the world. Guru Nanak observes spiritual darkness, travels
    through different countries, teaches the unity of God, restores religion, reduces
    caste divisions, and places king and beggar on spiritual equality.
