canonical_text:
  quote: ''
  summary: Chamyts meets a youth while on Balz, travels with him, and learns that
    the youth has a sister available for marriage under a condition about reproach.
    Chamyts marries her and takes her to a copper tower. Syrdon insults her, causing
    her to demand return to her parents. Before leaving, she transfers the son she
    would have borne into Chamyts' back as a swelling and instructs that the child
    be removed at the proper time and thrown into the sea. Soslan opens the swelling;
    the boy emerges, is thrown into the sea, and immediately becomes mountain-sized.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chamyts meets a youth while on Balz, asks to travel with him for three days,
    and the youth agrees to go with him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When night comes and they have no food, the youth tells Chamyts to stay with
    the horses while he gets something.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth climbs a mountain, drives game before him, kills the best animal
    he sees, carries it back, and drives the rest toward Chamyts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Chamyts has fallen asleep; the youth reproaches him but still serves him that
    evening.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The next morning the youth leaves, and Chamyts calls him back to ask what
    tribe he belongs to because Chamyts wants to court a maiden of that tribe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The youth says he belongs to the tribe of Chädmäst-Psäl and has a sister who
    can be given to Chamyts, but if anyone reproaches her she will either kill herself
    or Chamyts must take her back to her parents' house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Chamyts agrees, accompanies the youth home, courts the maiden, pays the bride-price
    at once, and takes his wife to a copper tower.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Syrdon comes to the tower, looks up at Chamyts' wife, insults her, and asks
    why she does not come down.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife tells Chamyts that Syrdon has insulted her and that she cannot remain;
    she asks to be taken back to her parents' house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wife says she would have borne Chamyts a son unlike any seen on earth,
    and says she will blow him between Chamyts' shoulders, where a swelling will appear.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wife instructs Chamyts to count the months, have the swelling opened when
    the time comes, and throw the boy into the sea immediately after he emerges.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Chamyts takes his wife back to her parents' house; when his back swells, the
    Narts pity him because they think it is an abscess.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Chamyts counts the months, goes to his copper tower, calls Soslan, and orders
    him to cut open the swelling.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A little boy comes out of the swelling, is carried to the sea and thrown in,
    and at once becomes as big as a mountain.
  category: sequence
  evidence_refs:
  - ev:7
