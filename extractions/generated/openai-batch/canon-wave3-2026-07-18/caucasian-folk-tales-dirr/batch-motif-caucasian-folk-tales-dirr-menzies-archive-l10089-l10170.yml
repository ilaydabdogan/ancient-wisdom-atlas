canonical_text:
  quote: ''
  summary: Etsemej is roasting meat when two unknown warriors arrive. He hosts them
    and learns that they were sent by a princess of the house of Etsej, his aunt,
    who seeks vengeance against Kuba and has waited for her nephew because she cannot
    cross a swollen river. Etsemej goes to her camp, promises to act alone, crosses
    the broad river on horseback at dawn, reaches Kuba’s kingdom, kills the grooms
    guarding Kuba’s horses, and drives the horses back toward his aunt’s camp, though
    he thinks the booty is too small.
  language: English
  quote_policy: summarized
