canonical_text:
  quote: ''
  summary: John rides his fire-horse to a royal festival where suitors attempt to
    reach the princess on a high balcony. After two near-successes, he reaches the
    balcony on the third day, takes the princess's ring, escapes, conceals the ring
    under a bandage, and is later identified when the princess sees the ring on his
    finger at another festival.
  language: English
