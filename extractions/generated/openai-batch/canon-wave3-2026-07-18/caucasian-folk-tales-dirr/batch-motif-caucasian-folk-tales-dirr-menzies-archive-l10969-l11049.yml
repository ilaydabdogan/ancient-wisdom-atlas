canonical_text:
  quote: ''
  summary: 'Rustumsal travels on the six-footed horse Tulpar. He meets an old man
    reading the Koran, who foretells Rustumsal’s future combat with a forty-headed
    Div and warns him of three bewitching temptations: cow’s milk, a pitcher of presents,
    and a beautiful maiden in a fruit garden. The old man also says that Iskender’s
    drum hangs on a tree and can summon aid if sounded. Rustumsal enters the land
    of the white Divs, resists the cow and pitcher temptations, prays, hunts and eats,
    then reaches the garden and enters despite remembering the warning.'
  language: English
  quote_policy: summarized
