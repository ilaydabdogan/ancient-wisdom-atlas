candidate_motifs:
- id: motif:1
  label: ascent from earth toward heaven
  taxonomy_refs:
  - ascent
  basis: Batras says earth is useless to him and sets out to go to heaven.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The episode is not a sustained ascent narrative in the extracted passage;
    the ascent functions as the start of Batras's conflict with heavenly figures.
- id: motif:2
  label: hero conflicts with heavenly or divine beings
  taxonomy_refs:
  - culture_hero
  basis: Batras attacks the Uatsillas and Uastyrdji, and later fights their combined
    attack on the plain of Chasma.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage does not explicitly
    name Batras as a culture hero.
- id: motif:3
  label: divine judgment against a powerful transgressor
  taxonomy_refs:
  - divine_judgment
  basis: After repeated complaints, God chooses between the complainants and Batras
    and sends the Balsig wheel after Batras, causing his death.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames the action as God's response to complaints, but it
    does not provide an abstract legal or moral explanation beyond the conflict.
- id: motif:4
  label: divine parent kills divine son
  taxonomy_refs:
  - divine_parent_child
  basis: God says he has killed his own son after sending the wheel that kills Batras,
    and later addresses Batras as his son.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: A note says the Ossetian form reads 'Son called by my name, that is, not
    of my body,' so the father-son relationship may be titular or ritual rather than
    biological.
- id: motif:5
  label: near-invulnerable hero with uncovered weak spot
  taxonomy_refs: []
  basis: Batras had been coated with steel by Kurdalagon, but a small part remained
    uncovered; that exposed part burns when the Balsig wheel comes after him.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available taxonomy reference directly corresponds to this motif.
- id: motif:6
  label: dead hero remains dangerous after death
  taxonomy_refs: []
  basis: After Batras dies, his released spirit kills sixty angels who come near his
    body.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage attributes the release of the spirit to God in the following
    speech, complicating agency.
- id: motif:7
  label: burial or deposition in a cave
  taxonomy_refs: []
  basis: God commands the angels to carry Batras to the Sopia cave, and Batras is
    finally laid there.
  evidence_refs:
  - ev:9
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage calls the cave a place where Batras remains, but does not
    fully describe it as a tomb except through the note questioning its location.
- id: motif:8
  label: divine tears become sacred places
  taxonomy_refs:
  - sacred_exchange
  basis: God's three tears fall on Batras and become Tarandjalos, Mykaly-Gabyrta,
    and Pekom, identified in a note as three sanctuaries.
  evidence_refs:
  - ev:12
  - ev:20
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage presents transformation
    into sanctuaries but not an exchange in a strict sense.
- id: motif:9
  label: sacrificial feast after vengeance
  taxonomy_refs:
