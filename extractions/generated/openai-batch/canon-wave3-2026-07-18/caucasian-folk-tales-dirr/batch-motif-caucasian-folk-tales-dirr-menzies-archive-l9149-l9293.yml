canonical_text:
  quote: ''
  summary: The passage includes a brief preceding fragment in which a father's death
    is avenged and a sacrificial feast is held, followed by the Nart saga episode
    in which Batras attacks heavenly figures, God sends the Balsig wheel to kill him,
    angels carry his body to the Sopia cave, and God's tears become three sanctuaries.
    The passage then begins the next episode, where Badsanag, son of a blind giant,
    descends from a mountain to steal from the Narts by the Saqola river.
