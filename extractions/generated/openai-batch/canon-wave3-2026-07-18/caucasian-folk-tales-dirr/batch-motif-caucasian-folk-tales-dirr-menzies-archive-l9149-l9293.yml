comparison_claims:
- id: claim:1
  claim: The source note compares Uatsilla with thunder and frightfulness deities
    known among other Caucasian peoples and describes such earlier deities as later
    transformed into angels and messengers from Heaven among Christian and Muslim
    Ossetes.
  claim_level: historical_contact
  target: Caucasian thunder/frightfulness deity traditions and later angelic or saintly
    reinterpretations among Ossetes
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
