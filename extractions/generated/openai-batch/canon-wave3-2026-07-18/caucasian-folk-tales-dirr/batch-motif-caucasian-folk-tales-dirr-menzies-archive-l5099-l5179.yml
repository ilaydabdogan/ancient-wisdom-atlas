canonical_text:
  quote: ''
  summary: The youngest son is praised and instructed by his father to hire only a
    servant who refuses to dine with him. After dismissing two servants who accept
    the dinner invitation, he hires a third who insists on eating only after his master.
    This servant proves clever and advises the prince to take a dangerous shorter
    road to a neighboring country. At a night camp the servant keeps watch while the
    prince's dog barks and a hidden voice speaks to it, saying the master will kill
    it and smear its blood on his eyes, and asking to take goods. The party reaches
    its destination safely. On the return journey, with merchants added, the same
    midnight event recurs at the same camp, and the servant wakes the prince as the
    passage breaks off.
  language: English
  quote_policy: summarized
