canonical_text:
  quote: ''
  summary: In a king's court, the companion of the king's son tells an embedded tale
    about a wooden boy brought to life and asks who should claim him. The king's daughter
    answers from behind a curtain, breaking her silence, and is given to the prince
    as wife. At night the companion kills an enormous serpent entering the bridal
    room. Later, during a division of goods, he threatens to split the bride, causing
    little snakes to emerge from her mouth. He explains that a serpent had loved her,
    slept beside her, made her dumb by its breath, and nearly made her bear serpents.
    He gives his share back, gives a cure for the prince's blind father, and departs.
  language: English
  quote_policy: summarized
