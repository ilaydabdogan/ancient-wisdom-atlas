canonical_text:
  quote: ''
  summary: The passage contains three Solomon wisdom episodes. In one, young Solomon
    exposes an unnamed king's unjust claim to all foals by using an absurd analogy
    involving the king's dogs. In another, Solomon visits a cave-dwelling hermit whose
    silent gestures and objects are interpreted by Solomon's courtier as moral advice
    about possessions, mortality, and restraint of speech. In a fragmentary third
    episode, Solomon begins plucking birds to build a feather castle requested by
    one of his wives, and the owl objects.
  language: English
  quote_policy: summarized
