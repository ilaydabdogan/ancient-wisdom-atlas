  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The owl tells Solomon that the birds are being robbed of their beauty and
    weather protection to satisfy one wife's mood, while saying she would give her
    feathers or even her head for Solomon if necessary.
  category: speech
  evidence_refs:
  - ev:9
