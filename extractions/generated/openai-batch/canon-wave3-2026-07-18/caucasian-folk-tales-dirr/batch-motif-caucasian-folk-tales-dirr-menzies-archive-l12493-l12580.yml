- id: obs:3
  text: Solomon tells the king that wolves stole a calf from his village and that
    the king's dogs did not give chase; when the king rejects this premise, Solomon
    compares it to the king's claim over distant foals.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king is embarrassed and stops appropriating other people's foals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A hermit lives in a cave near Jerusalem, and people from many places make
    pilgrimages to him.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Solomon goes with his favourite courtier to visit the hermit and ask for advice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hermit is said to know by divine inspiration that the king is coming;
    he sweeps his cell, leaves the sweepings in the middle, puts a cloth over his
    shoulders, stands at the threshold, and holds his mouth with his right hand.
  category: action
  evidence_refs:
  - ev:5
