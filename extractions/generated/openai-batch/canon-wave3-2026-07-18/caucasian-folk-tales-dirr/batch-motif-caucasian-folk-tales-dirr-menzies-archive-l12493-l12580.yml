- id: obs:1
  text: An unnamed king appropriates every foal born in his kingdom, claiming each
    descends from one of his mares.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young Solomon hires himself as the king's kennelman and beats the king's dogs.
  category: action
  evidence_refs:
