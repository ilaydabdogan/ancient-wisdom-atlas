    mouth as a warning about the tongue.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Solomon is pleased with the courtier's explanation and rewards him richly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: One of Solomon's wives wants him to build her a castle of birds' feathers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Solomon summons all the birds and begins pulling out their feathers; the owl
