  text: The courtier says they have already received the advice and later explains
    the hermit's silent signs to Solomon.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The courtier explains the sweepings as earthly possessions, the threshold
