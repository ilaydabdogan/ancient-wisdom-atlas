canonical_text:
  quote: ''
  summary: Amiran learns that giants killed his father and occupy his house, kills
    the giants, buries his father, travels with his uncles toward Filich, frees a
    pear-carrier enslaved by dragons, kills or overcomes the dragons, is swallowed
    by one and cuts his way out, meets the corpse and mother of a murdered giant,
    exterminates giants in Filich and nearby lands, then kills many Christians until
    Jesus Christ descends in human form, challenges him, causes his strap to become
    a chain, and locks him in an iron house inside a mountain. A dog continually licks
    the chain thinner, but smiths restore its thickness annually on Green Thursday.
    The passage then begins a Suanetian variant in which the smith Daredjiani hears
    despairing cries from Mount Elbruz.
  language: English
  quote_policy: summarized
