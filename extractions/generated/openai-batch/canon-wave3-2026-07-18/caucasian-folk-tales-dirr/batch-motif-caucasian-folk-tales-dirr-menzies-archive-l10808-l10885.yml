canonical_text:
  quote: ''
  summary: The passage ends an Udi Rustum variant in which an old woman removes Rustum’s
    ring, casts it into a well, transports Rustum’s second wife in a locked box to
    the king’s courtyard, and Rustum is restored by companions who recover the ring.
    Rustum then attacks the king, recovers his wife, and the tale closes with an apple
    formula. The passage then begins a Tatar Rustumsal variant in which an old woman
    tells Rustumsal that his aunt was stolen by a forty-headed white Div; after his
    parents and wise men deny the story, Rustumsal departs.
  language: English
