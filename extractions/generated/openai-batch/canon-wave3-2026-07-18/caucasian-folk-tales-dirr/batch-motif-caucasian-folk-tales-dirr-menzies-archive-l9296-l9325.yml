canonical_text:
  quote: ''
  summary: A figure leaves heaven for earth with half a glacier on his head to avoid
    burning. Batrás defeats and mutilates Bädsänäg during a dance encounter. Bädsänäg
    returns home, asks his father about Batrás’s strength, and is told that Batrás
    is cased in steel. Bädsänäg pays Kurdalagon to steel him in the same way, despite
    a warning that he will not survive; he burns in the furnace and only his bones
    remain.
  language: English
