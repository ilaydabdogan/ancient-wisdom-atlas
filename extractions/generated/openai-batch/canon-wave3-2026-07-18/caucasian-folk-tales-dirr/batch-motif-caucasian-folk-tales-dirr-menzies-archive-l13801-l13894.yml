canonical_text:
  quote: ''
  summary: 'The passage gives several short Mullah Nasreddin anecdotes: he follows
    running children after deciding their alarm may be true; he fails to leap a brook
    and privately admits he never could have; he cuts the branch he sits on, treats
    a passer-by''s warning as foreknowledge, believes he will die after his donkey
    brays three times, lies down as dead, and does not defend the donkey from wolves;
    and he begins a trick against his wife by sending her with pancakes to consult
    a supposed speaking hollow plane-tree while he hides inside it. A note compares
    the first joke to a Marius of Marseilles version involving a false report about
    a giant sardine.'
  language: English
  quote_policy: summarized
