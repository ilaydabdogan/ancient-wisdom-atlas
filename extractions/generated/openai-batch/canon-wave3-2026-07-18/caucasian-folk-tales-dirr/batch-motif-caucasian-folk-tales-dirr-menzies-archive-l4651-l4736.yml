canonical_text:
  quote: ''
  summary: At the close of “Balai and Boti,” Balai discovers that the guest has escaped,
    shoots after him, wounds the eagle’s wing, and the eagle carries the hero back
    to the king’s town. The hero publicly accuses the princess, directs a search of
    the cellar beneath her room, and the hidden lame husband and son are found; the
    king kills his daughter, and the hero kills the Nart and his son. The hero returns
    to his wife and becomes king. The next tale, “The Virgin Queen,” begins with a
    wise king who becomes blind and ill; his sons offer to seek a remedy, and he asks
    for fruit from the garden of the Virgin Queen. The eldest son rides armed over
    many mountains, meets an old white-bearded man sewing cracks in the path, exchanges
    hostile greetings with him, and rides toward a land with rivers of milk and grapes.
  language: English
  quote_policy: summarized
