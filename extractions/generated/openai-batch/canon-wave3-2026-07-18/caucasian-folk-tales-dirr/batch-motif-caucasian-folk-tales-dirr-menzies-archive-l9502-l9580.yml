canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Sdésryqo wins a dice contest
    against Mukkara, spares him, heals him after removing his scalp, and takes the
    scalp home to be made into a collar. It then begins the tale of Chamyts, Sosryqo,
    and Urysmag: the three dispute their order of age and consult their eldest sister.
    Her answer identifies Chamyts as youngest because the saddle-bags are on his horse.
    Chamyts curses her with the brown donkey of the Boras, accepts the tooth of Arqys
    in exchange for mercy, and later uses the tooth’s coercive power against the daughter
    of the Alagas, who becomes a serpent when he refuses her. After two years he feels
    pity and rubs her with the tooth.'
  language: English
  quote_policy: summarized
