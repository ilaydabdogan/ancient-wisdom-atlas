canonical_text:
  quote: ''
  summary: 'Urysmag narrates how, while in an animal condition, he let others kill
    sheep, was beaten, learned from his first master how to regain human form through
    soup and a whip-blow from Uastyrdji''s wife, and then slept with her, leaving
    his boots as evidence. The squirrel skin is awarded to Urysmag because dogs had
    run after him. A new tale begins: Etsemej, a ten-year-old prince''s son, disrupts
    boys playing dice by crushing the dice with a millstone. The boys'' mother challenges
    him to avenge his father by killing Kuba, and Etsemej realizes how his father
    died.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unnamed speakers asked Urysmag to let them in, and he let them in; they began
    killing sheep, and he helped until all were killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the master entered the stable in the morning, he beat Urysmag, who ran
    away to his first master.
  category: sequence
  evidence_refs:
