- id: obs:4
  text: The first master instructed Urysmag to go to Uastyrdji's wife, let his tail
    hang into her soup, and be struck by her whip so that he would regain human form.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Urysmag put his paw, rather than his tail, into the soup; Uastyrdji's wife
    struck him with the whip, and he appeared before her as a man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Uastyrdji's wife told Urysmag that she had been sorry for the injury she had
    done to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Urysmag told Uastyrdji's wife that because of her he had been miserable, dogs
    had run after him, and he had given birth to whelps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Uastyrdji's wife said that if Uastyrdji did not come that night she would
    be at Urysmag's disposal; Urysmag slept with her that night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Urysmag deliberately left his boots in Uastyrdji's wife's room, and Uastyrdji
