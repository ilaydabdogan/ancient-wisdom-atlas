  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Uastyrdji's wife admitted to Uastyrdji that she and Urysmag had slept together
    the previous night.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After Urysmag finished speaking, the squirrel skin was awarded to him because
    dogs had run after him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Boys were playing dice beside a mill when Etsemej, about ten years old and
