canonical_text:
  quote: he saw that his mother had borne a maiden, a foal, and a young hound.
  summary: As Satna dies, she orders Chamyts, Urysmag, and Sosryqo to watch by her
    grave. Urysmag and Sosryqo resist deceptive midnight daylight, but Chamyts leaves
    for Alaga's wedding. Udstyrdji lies beside the dead Satna, sends her a horse and
    hound, and flies back to heaven. A maiden, foal, and young hound are then found
    at the sepulchre and raised by Urysmag. The next tale begins with Urysmag, Chamyts,
    and Sosryqo setting out to plunder, compelling Syfyttar to prophesy, enduring
    his predicted snowbound hunger, and deciding a squirrel skin by a contest of wonderful
    stories.
  language: English
  quote_policy: quoted
