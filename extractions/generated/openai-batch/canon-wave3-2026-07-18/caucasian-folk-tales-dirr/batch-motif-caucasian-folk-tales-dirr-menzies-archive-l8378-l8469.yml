canonical_text:
  quote: ''
  summary: 'The excerpt concludes an animal fable in which a hare challenges the lion’s
    tyranny. The hare delays his appointed appearance, greets the lion respectfully,
    reports that another lion has claimed the land and taken a second hare, then leads
    the angry lion to a deep well. The lion sees his own reflection in the water,
    mistakes it for a rival, jumps in, and drowns. A moral warns against relying on
    strength without precautions. The next tale opens with famine in Daghestan: a
    fox leaves for Schirwan, persuades a wolf and a mule to join by describing abundant
    sheep and grass, and the group reaches a hill at the border while still far from
    Schirwan.'
  language: English
  quote_policy: summarized
