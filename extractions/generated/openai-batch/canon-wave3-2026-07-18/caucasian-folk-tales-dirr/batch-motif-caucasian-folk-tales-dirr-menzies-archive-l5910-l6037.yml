canonical_text:
  quote: ''
  summary: Tschnara reaches a town, learns of a princess whose movement in sleep causes
    lightning-like radiance, wins her by defeating a rival prince and retinue, and
    takes her home. The bride is then seized first by deceptive Erchustojer Narts/seven
    giants and rescued when she throws Tschnara his dagger, and later stolen from
    a locked bridal chamber by a Nogai-ian thief. During his search, Tschnara meets
    a shepherd who identifies the thief and provides a disguise plan. Tschnara infiltrates
    the thief’s house, hears the thief boast of his thefts, and beheads him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tschnara gives his horse freedom to find lodging; the horse turns toward the
    court of a widow’s isolated house, where the widow receives him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night Tschnara sees lightning-like illumination; the widow explains that
    such lightning appears whenever the king’s daughter turns in her sleep.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tschnara sends the widow to ask the king for the princess’s hand, but the
    king says a king’s son with one hundred and twenty cavaliers is coming to take
    the princess by force.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tschnara rides out to meet the king’s son, identifies himself as of the race
    of Nelbi, attacks, and kills the prince’s troop with the aid of his horse and
    dagger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the defeat of the rival prince’s party, Tschnara threatens the king
    with the same fate unless he gives up his daughter; the king consents, and Tschnara
    drives home with the bride in a wagon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Erchustojer Narts deceive Tschnara by calling themselves his friends;
    he comes to them unarmed, and seven giants enter his wagon and carry off his bride.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tschnara’s horse becomes loose from the wagon; he calls it, pursues the giants,
    receives his dagger when the bride throws it to him, and beheads the giants.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Tschnara reaches home and is married, his bride is stolen on the night
    after the wedding from a bridal chamber whose doors and windows had been locked.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tschnara grieves by weeping until he has no more tears and then weeping tears
    of blood, after which he sets out to search for the stolen bride.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tschnara meets a shepherd who repeatedly runs up and down a hill, laughing
    as he goes up and weeping as he comes down.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The shepherd says he weeps from pity for Tschnara and laughs because he gets
    meat and bread at home; he identifies the bride’s robber as a Nogai-ian from a
    nearby village.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The shepherd advises Tschnara to wear the shepherd’s clothes, hide his dagger,
    go with the calves to the Nogai-ian’s courtyard, receive bread and meat, and ask
    to take those gifts to the Nogai-ian’s wife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Following the plan, Tschnara waits in his wife’s room; the Nogai-ian boasts
    that he steals children from mothers’ arms and young wives from husbands’ sides.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tschnara’s wife answers that no one can wield the dagger as skilfully as the
    man from whom she was stolen; the Nogai-ian insults and strikes her, and Tschnara
    springs out and cuts off his head.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: An editorial footnote states that the wagon episode is a later addition and
    comments that Caucasians did not have wagons or harness horses to carts in the
    way described.
  category: other
  evidence_refs:
  - ev:11
