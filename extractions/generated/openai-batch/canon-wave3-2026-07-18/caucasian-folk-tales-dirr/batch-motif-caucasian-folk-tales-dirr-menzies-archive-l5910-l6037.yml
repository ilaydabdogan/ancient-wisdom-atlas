candidate_motifs:
- id: motif:1
  label: supernatural radiance of the destined bride
  taxonomy_refs: []
  basis: The princess’s movement in sleep produces lightning-like illumination visible
    to Tschnara at night.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives the phenomenon literally but does not explain its cause
    or divine status.
- id: motif:2
  label: bride won after defeating a rival armed suitor
  taxonomy_refs: []
  basis: A king’s son with one hundred and twenty cavaliers comes to take the princess
    by force, and Tschnara wins access to the marriage by defeating that force.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage frames the episode as combat and coercive negotiation rather
    than a formal contest.
- id: motif:3
  label: stolen beloved rescued by quest and combat
  taxonomy_refs:
  - stolen_beloved
  basis: Tschnara’s bride is seized by giants and later stolen from a locked bridal
    chamber by the Nogai-ian; both episodes lead to pursuit, infiltration, or combat.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The available taxonomy ref fits the bride-abduction pattern, though the
    passage contains two distinct abduction episodes.
- id: motif:4
  label: false friends disarm the hero
  taxonomy_refs: []
  basis: The Erchustojer Narts call themselves Tschnara’s best friends, causing him
    to approach unarmed, which enables them to take the bride.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No supplied taxonomy ref specifically names this deception pattern.
- id: motif:5
  label: captive bride returns the hero’s weapon
  taxonomy_refs: []
  basis: When Tschnara is unable to act because he has no weapon, the bride throws
    him his dagger, allowing him to behead the giants.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a local action pattern; no broader comparison is asserted.
- id: motif:6
  label: grief expressed as tears of blood
  taxonomy_refs: []
  basis: After the bride is stolen from the locked chamber, Tschnara weeps until ordinary
    tears are gone and then weeps tears of blood.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not state whether the blood tears are miraculous, figurative,
    or literal beyond the narrated image.
- id: motif:7
  label: quest helper provides disguise and plan
  taxonomy_refs: []
  basis: The shepherd identifies the thief and gives detailed instructions for Tschnara
    to enter the thief’s household in disguise.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The helper is not described as supernatural in the passage.
- id: motif:8
  label: boastful thief exposed in the stolen wife’s chamber
  taxonomy_refs: []
  basis: Tschnara hides in his wife’s room, hears the Nogai-ian boast of stealing
    children and wives, and then kills him after the wife provokes comparison with
    Tschnara’s dagger skill.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage supports the episode pattern but not a named external motif
    classification.
- id: motif:9
  label: intelligent horse as guide and battle aid
  taxonomy_refs: []
  basis: The horse finds lodging, participates in combat by trampling enemies, and
