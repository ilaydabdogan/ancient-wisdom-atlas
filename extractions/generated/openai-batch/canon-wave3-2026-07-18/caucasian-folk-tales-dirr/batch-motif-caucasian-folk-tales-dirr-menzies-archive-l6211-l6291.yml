canonical_text:
  quote: ''
  summary: A maiden survives a bear’s midnight bell challenge through the help of
    a mouse and receives a silver wagon with three horses. Her father returns with
    her, while the speaking house-dog announces the truth and is struck by the stepmother.
    The stepmother sends her own daughter to repeat the ordeal; that daughter refuses
    the mouse, is caught and eaten by the bear, and is later brought home only as
    bones. The passage then begins the next tale, in which a poor old couple spare
    their hen after it lays a golden egg, but the hen disappears and the old man goes
    to search for it.
  language: English
  quote_policy: summarized
