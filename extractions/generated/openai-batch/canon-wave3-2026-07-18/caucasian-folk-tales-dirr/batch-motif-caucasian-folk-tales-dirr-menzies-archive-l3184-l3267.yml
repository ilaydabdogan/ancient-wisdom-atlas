canonical_text:
  quote: ''
  summary: A childless peasant uses signs of recognition while journeying from a black
    Div to a red Div and then to a white Div beyond repeated groups of nine mountains.
    The white Div gives him two apples as a remedy, on condition that half of the
    resulting offspring be returned. The peasant and his wife divide one apple, and
    his mare and dog divide the other. The wife bears two golden-haired boys named
    Sachwatho and Thavisi; the mare bears two foals with golden manes and fiery hoofs;
    the dog bears two panther-cubs with golden manes and fiery teeth. As the promised
    day approaches, the peasant mourns, and Sachwatho presses his mother to reveal
    the cause.
  language: English
  quote_policy: summarized
