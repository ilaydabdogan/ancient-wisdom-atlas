canonical_text:
  quote: ''
  summary: A queen encounters a suffering stag, who asks her to consult the sun and
    offers his antlers as a ladder to heaven. She reaches the sun’s castle, where
    the sun’s wife, her sister, hides and protects her from the sun. The sun gives
    healing advice and water from his bath to cure the queen’s son and other afflicted
    figures. The queen returns, relays the advice, cures the sufferers, and her son
    marries Paradise-Rose and ascends the throne. The tale closes with a formula about
    listeners having no headache. The next tale begins with a king testing his sons
    to decide succession by asking the eldest to build a faultless church.
  language: English
  quote_policy: summarized
