canonical_text:
  quote: ''
  summary: 'The passage closes an Urysmig/Nart episode: Urysmig waits for a flock
    to leave a cave, taunts a giant, drives the flock to the Narts, and receives an
    added share after the Narts say he saved them from hunger. A new tale begins with
    Solomon the Wise offering a servant wages or three pieces of advice. The servant
    chooses advice, follows an instruction involving a serpent skin over a stick,
    and a golden-fruit tree grows from it. Three Armenian guests see the tree, decide
    to steal it, and question the wife about its origin.'
  language: English
  quote_policy: summarized
