canonical_text:
  quote: ''
  summary: In an Ossetian variant, Urysmag leads the Narts on a journey. Hungry, he
    tries to take a sheep from an enormous one-eyed shepherd at the foot of a mountain
    and is captured. The giant takes him to a cave closed by a boulder and prepares
    to roast him, but Urysmag frees himself, heats the spit in the fire, blinds the
    giant, kills the giant's son, and escapes by wearing the skin of the giant's favorite
    white goat while the blind giant lets the animals out.
  language: English
  quote_policy: summarized
