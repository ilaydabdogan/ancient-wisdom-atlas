- id: obs:4
  text: Urysmag takes the best sheep from the flock, but the sheep pulls him along
    until he falls into the hands of the one-eyed giant.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The giant addresses the sheep as Bodsol, treats Urysmag as a roast, and stuffs
    him into a knapsack.
  category: action
  evidence_refs:
