  evidence_refs:
  - ev:5
- id: obs:7
  text: At sunset the giant drives the flock to a cave and closes the entrance with
    a boulder so tight that sunlight cannot enter.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The giant orders his son to bring a roasting-spit, places Urysmag on it at
    the fire, and goes to sleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Because the spit has passed between Urysmag's clothes and body, Urysmag frees
    himself, heats the spit red-hot, drives it into the giant's single eye, and also
    kills the giant's son.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the morning the blind giant removes the boulder, stands at the cave mouth,
