canonical_text:
  quote: ''
  summary: 'A mother falcon, grateful that the king’s son saved her young, carries
    him toward home while he feeds her buffalo meat and finally flesh from his own
    body; she heals the wound with a feather. The king’s son then finds the abducted
    maiden, learns that the beardless lute-player’s soul, spirit, and strength are
    in three birds locked in a cage, kills the birds, and the lute-player dies. He
    returns with the maiden and the cock and hen nightingale, receives his father’s
    blessing and crown, and marries the maiden. A new tale begins: a widowed father
    with three daughters is pressured by a wicked stepmother to drive them away, and
    he lures them to an apple tree above a concealed deep hole.'
  language: English
  quote_policy: summarized
