canonical_text:
  quote: ''
  summary: 'The passage first concludes a transformation pursuit: a boy escapes a
    master through successive animal and object forms, the master pursues through
    matching forms, and the master is burned when the final grain becomes a hot needle
    and the pursuer becomes thread. The needle becomes a boy who returns to his father.
    The next tale begins with a stepmother beating a boy after hens eat corn he was
    told to guard. He reports a cosmic dream in which his feet span Baghdad and the
    sun, moon, and stars rest on or are held by him. His stepmother and then a king
    demand the dream as if it can be given; after he says it cannot, he is driven
    out and later imprisoned in a pit. The king''s daughter secretly feeds him. The
    passage ends as the King of the East sends four mares to the King of the West
    with a guessing challenge.'
  language: English
  quote_policy: summarized
