  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A king also asks for the boy’s dream and wants to have it; when the boy says
    he cannot give it, the king has him thrown into a deep pit.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The king’s daughter secretly brings food to the boy and lowers it into the
    pit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The same king is identified as King of the West; the King of the East, who
    has asked for the daughter’s hand, sends four mares with a guessing challenge.
  category: sequence
  evidence_refs:
  - ev:10
