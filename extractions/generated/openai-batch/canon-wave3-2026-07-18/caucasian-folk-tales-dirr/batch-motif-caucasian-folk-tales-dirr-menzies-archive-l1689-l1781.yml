  - ev:3
- id: obs:6
  text: The needle finally becomes a boy, who goes home to his father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the next tale, a stepmother tells her step-son to guard corn drying on
    the threshing floor; he sleeps, hens eat the corn, and she beats him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy tells a dream in which one foot stands in the middle of Baghdad, the
    other on the outskirts, the sun and moon rest on his feet, and stars are in his
    hands and on his face.
  category: speech
  evidence_refs:
  - ev:6
