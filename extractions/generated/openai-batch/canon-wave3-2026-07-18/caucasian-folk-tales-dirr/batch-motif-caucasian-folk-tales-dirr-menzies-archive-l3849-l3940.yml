canonical_text:
  quote: ''
  summary: Thavisi is mistaken for Sachwatho and temporarily lets others believe it,
    while avoiding Sachwatho’s wife by placing a sword between them. He goes despite
    the king’s warning to the tower of a dreadful woman, plays her golden lute, resists
    her deceptive instructions, and fights her with his horse and panther. After cutting
    off her three heads, he finds Sachwatho, with Sachwatho’s horse and panther, inside
    a box in her head. Sachwatho awakens, and the brothers ride home together, causing
    a witness to say that one man has become two.
  language: English
  quote_policy: summarized
