canonical_text:
  quote: ''
  summary: 'Opening portion of “The Fisherman’s Son”: a fisherman’s son releases a
    blood-red fish and later saves a stag, a crane, and a fox; each animal gives him
    a bodily token and promises aid. He then seeks to marry a maiden whose condition
    is that he must hide where she cannot find him. The red fish and the stag each
    hide him in a cave, but the maiden discovers him with her mirror.'
  language: English
  quote_policy: summarized
