canonical_text:
  quote: ''
  summary: 'The passage presents comic episodes about reputedly stupid villagers or
    figures associated with Kerkendj: a Chan tests three men with grapes and beetles;
    the people of Kerkendj lose their axes to a Tatar, fail to keep a foal by loading
    it with clothes, blame the priest, and fall into a ravine while trying to pull
    up a tree; Kirakos buys a melon as a supposed donkey''s egg, mistakes a hare for
    the hatched donkey, and later quarrels with his wife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Chan has two plates set before three men, one with grapes and one with beetles;
    when the beetles run, one man tells the others to eat first the grapes that can
    run away, and the Chan lets them go.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Notes in the passage state that the phrase about eating the running ones became
    a local Tatar proverb or joke, and that Kerkendj was an Armenian village near
    Schemache with a reputation for extraordinary stupidity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people of Kerkendj go with their priest into the forest to cut wood and
    quarrel over whose axe is sharpest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Tatar rider on a mare with a foal offers to settle the axe dispute, places
    the axes in his saddle-bag, and gallops away; the villagers fail to catch him
    but catch the foal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The villagers decide to keep the foal from following its mother by loading
    it with their clothes; the priest keeps his trousers, and the foal escapes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The villagers blame and beat the priest because he alone did not put his trousers
    on the foal's back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The villagers try to pull out a young tree by forming a human chain; a mosquito
    stings the priest, he lets go, and the whole band falls into a ravine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kirakos, Mayor of Kerkendj, sees melons in a Tatar's shop, is told they are
    donkey's eggs, and buys the largest one for three times its proper price.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kirakos's melon rolls, bursts near a tree root, and a hare springs out from
    behind the tree; Kirakos runs after the hare, thinking it is the little donkey
    from the egg.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Kirakos's wife laments the lost donkey and says she would have ridden it to
    a monastery; Kirakos becomes angry and beats her with a stick until she promises
    to go on foot.
  category: action
  evidence_refs:
  - ev:9
