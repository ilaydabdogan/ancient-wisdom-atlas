canonical_text:
  quote: ''
  summary: A woman consults a voice in a hollow plane-tree and admits she loves her
    lover more than her husband. The voice advises her to have her husband kill and
    eat their last cow so that he will become blind and deaf. Mullah Nasreddin reaches
    home before her, follows the plan outwardly, and later pretends to be blind and
    deaf. When the wife summons her lover and prepares separate food, Nasreddin kills
    the sleeping lover with boiling water. He then has his wife help carry the body
    to the dead man's house, imitates the dead man's voice at the door, leaves the
    corpse there, and later instructs his own wife to say words at the mourning that
    lead the dead man's relatives to stab her.
  language: English
  quote_policy: summarized
