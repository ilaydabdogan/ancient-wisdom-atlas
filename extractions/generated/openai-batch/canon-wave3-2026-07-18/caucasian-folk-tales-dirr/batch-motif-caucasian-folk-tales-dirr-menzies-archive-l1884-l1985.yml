canonical_text:
  quote: ''
  summary: In a continuation of “The Dreamer,” the Dreamer gathers additional companions
    with remarkable abilities. The enlarged group goes to the King of the East to
    request his daughter. The king imposes deadly eating and drinking tests; the clod-eater
    consumes all the bread, and the sea-water-drinker empties an enormous wine barrel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A man says the truly difficult deed is what the Dreamer did: marrying a king’s
    daughter and waging war; the Dreamer identifies himself and invites the man to
    join, after which the group is counted as four.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man listens with one ear to the ground and says ants are waging war in the
    underworld, which he is helping by giving advice; he joins the group, making them
    five.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man with a bow looks into the sky and says an arrow he shot three days earlier
    is only now returning; after this encounter the group is counted as six.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man creeps up to a flock of doves and changes their wings without the doves
    noticing; he gives the same response that the Dreamer’s deed was harder, and the
    group is counted as seven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A priest carries his church bound on his shoulders and can set it down wherever
    he chooses to hold service; he also says the Dreamer’s deed was more difficult,
    and the group becomes eight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The eight go to the King of the East and ask him to give them his daughter;
    the king refuses to proceed without bargaining.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The King of the East requires bread to be baked for three days and demands
    that the group eat it all in one day; success means they may have his daughter,
    failure means beheading.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The comrades assign the bread test to the clod-eater because he can eat clods
    of earth; he consumes all the bread and leaves no crumb.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The King of the East next requires that his wine barrel be emptied in one
    sitting, again offering his daughter for success and threatening beheading for
    failure.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The friends assign the wine test to the sea-water-drinker because he can drink
    salt water; he calls the barrel a mouthful and drinks it empty.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A note describes the wine barrel as an enormous Caucasian wine barrel requiring
    six wagon-loads of wine to fill.
  category: attribute
  evidence_refs:
  - ev:11
