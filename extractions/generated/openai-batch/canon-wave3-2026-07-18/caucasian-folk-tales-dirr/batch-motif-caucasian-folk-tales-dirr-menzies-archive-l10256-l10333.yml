canonical_text:
  quote: ''
  summary: Etsemej identifies himself as the son of Etsej and says he has come to
    avenge his father. He and Kuba choose a shooting duel, fight over several days
    according to local customs around shooting and sharing ammunition, and wound each
    other severely. Kuba repeatedly returns home for his wife to remove bullets from
    his body. Kuba recognizes that his opponent is only a child yet a formidable hero.
    On the fourth morning Kuba finds Etsemej lifeless, takes his armour, drags the
    body home by horse, and orders a division of his army to guard the corpse despite
    his wife's criticism.
  language: English
  quote_policy: summarized
