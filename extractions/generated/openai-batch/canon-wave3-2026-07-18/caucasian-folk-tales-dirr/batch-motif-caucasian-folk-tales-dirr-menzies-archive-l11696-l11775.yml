canonical_text:
  quote: "“Take it and lay it at a cross-road; it will grow of itself.”"
  summary: In the Suanetian variant, the smith Daredjiani climbs Elbruz, finds a weeping
    woman who says she is the wife of God, and later fathers a child with her. The
    smith’s wife cuts off the woman’s hair, which contains her strength and charm.
    The woman cuts open her own body, gives the child to the smith, and tells him
    to leave it at a cross-road. Jesus Christ, St. George, and the Angel of the Ways
    christen the child Amiran and pronounce a condition concerning broken words. Amiran
    grows rapidly, displays great strength before a dead giant, accepts an obligation
    to raise the giant’s sons, and later sees those sons kill animals surrounding
    him while he sleeps.
  language: English
  quote_policy: quoted
