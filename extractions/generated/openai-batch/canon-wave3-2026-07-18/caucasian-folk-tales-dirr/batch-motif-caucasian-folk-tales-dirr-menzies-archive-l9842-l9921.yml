  category: action
  evidence_refs:
  - ev:9
- id: obs:23
  text: A Kabardian merchant hears of the dog, obtains him, ties bran bread around
    his neck, and Urysmag becomes very hungry before seven wolves appear again as
    the excerpt ends.
  category: sequence
  evidence_refs:
  - ev:10
