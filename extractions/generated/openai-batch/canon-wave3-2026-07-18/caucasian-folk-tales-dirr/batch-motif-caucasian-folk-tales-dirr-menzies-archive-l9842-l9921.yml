canonical_text:
  quote: ''
  summary: In a framed exchange of stories, Chamyts recounts shooting at groups of
    seven Uástyrdji and seven Uatsillas, leaving some dead and others complaining
    to God. Sósryqo tells of riding toward a dead sweetheart, seeing a lengthening
    and shortening rope, fighting boots, entering his beloved’s grave for a week,
    hearing dogs in her parents’ grave, and receiving explanations from his brother-in-law.
    Urysmag then tells how Uadstyrdji’s wife whipped him after he declared desire
    for her, causing him to become a fierce dog; as a dog he is fed and set to guard
    sheep, kills seven wolves, is praised by a merchant, and is then acquired by a
    Kabardian merchant as the excerpt breaks off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chamyts says he saw seven Uástyrdji holding a meeting and shot at them; three
    remained and four went to God to complain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chamyts says he later saw seven Uatsillas holding a meeting on another mountain
    and shot again; four remained and three went to God to complain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chamyts totals the result as seven Uatsillas and Uástyrdji killed and seven
    complaining about him to God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The other two speakers tell Chamyts that this was no misfortune and call on
    Sósryqo to speak.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sósryqo says he had a sweetheart in Tynty and set out armed on horseback to
    visit her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A shepherd on the plain of Chés identifies Sósryqo as a Nart and tells him
    his sweetheart has already been dead for a week.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sósryqo weeps but says he will continue and take his sweetheart out of her
    grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the way Sósryqo finds a rope that becomes first longer and then shorter.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sósryqo sees a pigskin boot and a morocco-leather boot fighting, with the
    pigskin boot gaining mastery.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sósryqo opens his beloved’s grave, creeps into it, remains there for a week
    after it is filled in, and then crawls out again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: While in the grave, Sósryqo hears young dogs baying in the grave of his beloved’s
    parents.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sósryqo’s brother-in-law explains that the dogs in the parents’ grave are
    due to those people refusing bread to the poor, lacking sympathy, and being inhospitable
    to travellers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The brother-in-law explains the rope as meaning that two brothers, or a father
    and son, were dividing their land.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The brother-in-law explains the fighting boots as meaning that the nobility
    and common people would become equal and the people stronger than the nobility.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The other speakers say that Sósryqo’s grave stay is strange but that the things
    he saw are not wonderful, and they call on Urysmag to speak.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: Urysmag says he visited Uadstyrdji’s wife, who entertained him, and told her
    his heart yearned for her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Uadstyrdji’s wife becomes angry, fetches a hide whip, strikes Urysmag with
    it, and he changes into a fierce dog.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: As a dog, Urysmag runs about looking for food, other dogs run after him, and
    he soon has puppies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: A merchant takes the dog-form Urysmag to guard sheep, chains him, and hangs
    a salted whole sheep around his neck for him to eat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: Seven wolves come to the door, ask to be let in, promise repayment, and know
