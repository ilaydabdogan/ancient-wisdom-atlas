canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a cunning wife hides a shepherd,
    an Armenian visitor, and a miller in absurd domestic disguises when successive
    arrivals occur, after which her husband helps frighten them off and the couple
    keeps their property. It then begins a tale of three nearly identical brothers
    whose disputed inheritance of an empty house and a goat leads the two younger
    brothers to plan theft, while the eldest, Hadji, preemptively kills and hides
    the goat with his wife’s help.
  language: English
