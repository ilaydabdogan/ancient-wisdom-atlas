canonical_text:
  quote: ''
  summary: 'The excerpt concludes a hiding contest in “The Fisherman’s Son”: the youth
    is hidden in heaven by a crane but is seen by the maiden with her mirror; then
    a fox hides him through a tunnel under the mountain and beneath the maiden’s divan,
    defeating her search and leading to marriage. The passage then begins “Cinder-Stick”:
    a lazy husband is barred from home by his wife, leaves with ashes, an awl, and
    cheese, reaches a river, and sees a giant Div drinking there.'
  language: English
  quote_policy: summarized
