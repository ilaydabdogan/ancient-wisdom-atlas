canonical_text:
  quote: ''
  summary: A king’s son leaves his mother and travels abroad. On the road he meets
    a stranger who keeps watch at night and gives the prince more food than himself,
    prompting the prince to think he will make him a good friend. In a town, an old
    woman tells them of a king’s daughter who has been mute since age seven; whoever
    makes her speak may marry her, but failures are beheaded, and many skulls have
    already been used to build a house. The prince and his friend decide to attempt
    the challenge.
  language: English
  quote_policy: summarized
