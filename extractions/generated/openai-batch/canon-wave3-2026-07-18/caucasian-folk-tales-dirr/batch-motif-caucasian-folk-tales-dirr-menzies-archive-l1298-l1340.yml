canonical_text:
  quote: ''
  summary: After the Divs abandon their house, Cinder-Stick settles there. A fleeing
    Div meets a fox, who identifies Cinder-Stick as a poor man and returns with the
    Div while tied to him by a string. Cinder-Stick shouts at the fox as if the fox
    had been expected to bring twelve Divs, frightening the Div into fleeing beyond
    the ninth mountain. Cinder-Stick takes the Divs' belongings, loads them on camels,
    rejoins his wife, and they live happily.
  language: English
