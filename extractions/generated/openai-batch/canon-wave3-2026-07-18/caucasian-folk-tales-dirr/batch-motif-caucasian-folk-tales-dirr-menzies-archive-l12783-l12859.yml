canonical_text:
  quote: ''
  summary: The end of “The Skilful Thief” describes Peter frightening a king and queen
    while disguised, claiming to be St. George sent to take them to Paradise, enclosing
    them in boxes, and delivering them to his own king, who rewards him and names
    him successor. The beginning of “The Cunning Couple” introduces a poor husband
    and wife; the wife borrows a silk dress and separately invites a shepherd, an
    Armenian trader, and a miller to come to her as prospective husbands.
  language: English
  quote_policy: summarized
