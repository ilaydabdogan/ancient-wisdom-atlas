canonical_text:
  quote: ''
  summary: In this Tatar variant, Rustumsal is trapped after a maiden and her garden
    vanish, discovers seven chained kings, frees and feeds them, summons an old man
    by beating Iskender's drum, and escapes when the old man reads from the Koran
    to open the castle wall. Rustumsal then travels onward with Tulpar, while his
    parents later seek news of him through the bird Smaragd.
  language: English
  quote_policy: summarized
