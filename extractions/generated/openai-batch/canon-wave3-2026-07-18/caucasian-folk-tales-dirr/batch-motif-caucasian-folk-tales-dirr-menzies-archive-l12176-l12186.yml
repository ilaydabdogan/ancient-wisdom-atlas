  quote: The shepherd was a giant and one-eyed.
  summary: A travelling group decides to load its ship with honey and wax from a stream
    and sail along the shore. Before departure, a flock of sheep and goats approaches
    the honey-stream, led by a one-eyed giant shepherd carrying and twirling a pillar-thick
    stick. The frightened travellers are seized when the giant pulls their ship ashore
    and drives them with his herd toward a great building.
