canonical_text:
  quote: ''
  summary: An elder brother and then a second brother are defeated by a princess who
    bares her breast, causing her male opponents to lose control; they are beheaded.
    The youngest brother seeks them, accepts an old man's advice to avert his eyes
    and rush the princess, and defeats her. The princess agrees to belong to him only
    if he finds the lost mate to a golden slipper. The youth takes the slipper and
    journeys across mountains, gorges, rivers, and plains to a flowered meadow with
    a paradise-like garden, tents, and a spring, where an unknown newcomer wakes him
    and challenges his presence.
  language: English
  quote_policy: summarized
