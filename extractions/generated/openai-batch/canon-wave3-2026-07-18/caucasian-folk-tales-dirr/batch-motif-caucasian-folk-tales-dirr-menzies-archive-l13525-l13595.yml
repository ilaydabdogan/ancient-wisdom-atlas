canonical_text:
  quote: ''
  summary: 'The passage contains short comic anecdotes. In one, three natives of Auch
    investigate a cave for a fox; one is killed by a bear, and his companions and
    wife cannot remember whether he had a head. In another, natives of Auch make a
    human chain to reach a sack below a steep river-bank, but most fall into the water
    when the first man asks to release one hand to scratch his head. The excerpt then
    begins a section of Mullah Nasreddin stories: a wag challenges Nasreddin to guess
    hidden eggs, and Nasreddin guesses wrongly after receiving a description; the
    next anecdote begins with Nasreddin remarrying and relatives coming to name a
    son born after three months, but the supplied passage ends before the outcome.'
  language: English
  quote_policy: summarized
