canonical_text:
  quote: ''
  summary: The King of the East sets tests involving mares and foals and an immovable
    arrow. The Dreamer advises the king’s daughter how to identify the horses, then
    secretly pulls out the arrow and later proves the feat by lifting and shooting
    it back. He marries the King of the West’s daughter, departs to wage war on the
    King of the East, and begins gathering unusual companions with extraordinary capacities.
  language: English
