canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a boy proves that a bound woman
    is his mother and the king is his father by causing a dried vine and roasted pheasant
    to come back to life; the king accepts the children, the mother is restored to
    honor, and wicked sisters are punished. A closing formula follows. The next tale
    begins with a poor childless couple who own an extraordinary pig that performs
    household work. A king's son sees the pig's skin fall off at water in a dark wood,
    revealing a beautiful maiden. He follows the pig home, buys it from the peasant
    household, and insists on marrying it despite his father's anger.
  language: English
  quote_policy: summarized
