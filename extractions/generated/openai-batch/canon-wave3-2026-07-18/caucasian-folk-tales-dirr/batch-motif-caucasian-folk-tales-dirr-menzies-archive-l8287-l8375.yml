canonical_text:
  quote: ''
  summary: A fragment of a fox-and-crane episode ends with a crane carrying a wingless
    fox toward heaven, dropping him, and the fox dying on the ground. In “The Bear,
    the Wolf and the Fox,” three hungry animals live together in deep snow; the fox
    stages the wolf’s false death and apparent revival in water, then persuades the
    bear to be eaten under a promise of later payment and revival. The next tale begins
    in Hindustan, where a lion rules wild beasts; the beasts arrange by lot to send
    victims to the lion, and the hare is selected but objects.
  language: English
  quote_policy: summarized
