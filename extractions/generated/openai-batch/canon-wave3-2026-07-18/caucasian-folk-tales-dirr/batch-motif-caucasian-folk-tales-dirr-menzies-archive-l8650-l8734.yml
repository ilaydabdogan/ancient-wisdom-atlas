canonical_text:
  quote: ''
  summary: A kid answers threats from wolf and bear by claiming that the kid’s companions
    have already torn apart and eaten a wolf or bear and are still hungry. The frightened
    predators flee, then later compare accounts and pursue the kid, lamb, and calf
    to a crooked tree. The kid again frightens the wild beasts by assigning the calf,
    kid, and lamb to attack them; the predators believe the animals have supernatural
    powers and run away. The three flock animals spend the night safely and are found
    by their shepherd the next morning. A new tale begins with a grey wolf meeting
    and greeting an alarmed badger.
  language: English
  quote_policy: summarized
