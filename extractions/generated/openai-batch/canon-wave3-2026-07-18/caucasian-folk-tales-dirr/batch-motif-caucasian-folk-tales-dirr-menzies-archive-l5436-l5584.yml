canonical_text:
  quote: ''
  summary: 'The passage first closes a preceding tale: a speaking fish identifies
    itself, vanishes, and a king’s son returns with wealth and a wife, restoring his
    father’s sight with earth from a friend’s horse’s hoof. The new tale, “Sartanki,”
    begins with a prince pursuing a stag into a cave; the stag places sugar and straw
    in his hat while he sleeps. The prince falls gravely ill. An old bald-headed man
    diagnoses love for Sartanki and says marriage to her will cure him. The guide
    Bald-pate leads the prince across seven seas with a warning not to touch underwater
    riches. They lodge with an old woman, who reports that Sartanki is a king’s daughter
    able to change into any creature and unwilling to marry. The old woman arranges
    for the prince to appear before Sartanki with a golden samovar, and Sartanki recognizes
    him as the huntsman who drove her into the cave when she had taken stag form.'
  language: English
