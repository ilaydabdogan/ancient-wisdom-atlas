canonical_text:
  quote: ''
  summary: In an Udian variant, Rustum is taken by a goat to the underworld. There
    he learns that a serpent controls a well and must receive daily offerings for
    water. Rustum kills the serpent when the king's daughter comes with pilaw, and
    she marks him with bloody handprints so he can be recognized. When Rustum asks
    the king only to be sent back to the overworld, the king directs him to a bird
    whose young are eaten by another serpent. Rustum kills that serpent too; the bird,
    after being told by its young that Rustum saved them, agrees to carry him upward
    if supplied with meat and water. During the flight Rustum feeds the bird and,
    after missing its beak with the last meat, cuts flesh from his own thigh to give
    it.
  language: English
  quote_policy: summarized
