canonical_text:
  quote: ''
  summary: 'The passage concludes an episode about Näsni: when enemies attack the
    Narts, he tries to avoid battle, but an old mare carries him into the fighting;
    he accidentally uproots a plane tree, the mare tramples enemies, and the Narts
    make him chief. A new tale begins with Tschnara, a poor man whose mother reveals
    his father''s horse, mail, and dagger; he equips himself, rides out, and passes
    seven sleeping Nart brothers while their horses speak to his horse.'
  language: English
  quote_policy: summarized
