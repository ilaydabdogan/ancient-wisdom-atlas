canonical_text:
  quote: ''
  summary: The passage first continues a tale in which a foolish wife misreads animal
    sounds, leads home a camel, is tricked into hiding in an oven by her husband and
    a clever wife, and inadvertently exposes their killing of the camel before being
    dismissed as unreliable. It then begins a tale about a Lahitsch woman who traps
    herself around a roof-support post while holding flour, prompting futile help
    from family, neighbours, and the village headman, whose solution is to cut down
    the post.
  language: English
  quote_policy: summarized
