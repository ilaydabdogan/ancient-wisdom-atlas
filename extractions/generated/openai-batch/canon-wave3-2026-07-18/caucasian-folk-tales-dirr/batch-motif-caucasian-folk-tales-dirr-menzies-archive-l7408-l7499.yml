canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which the bear and fox kill the wolf, then
    discover the rich man hidden among the rafters and eat him, while the poor man
    is said to have a happy life appointed by God. It then begins ''The Helpful Ram'':
    a second wife favors her own daughter and mistreats her husband''s daughter, who
    weeps while tending sheep. A speaking ram helps the mistreated girl by giving
    her food and drink from his removable right horn. When the wife plots to have
    the girl pushed over cliffs, the girl tells the ram; the ram instructs her to
    lure the wife''s daughter to the cliff and then knocks that daughter to her death.
    The passage also includes the opening of ''The Fire-Horse,'' introducing an old
    man with three sons, two clever and one idle and described as stupid and dirty.'
  language: English
  quote_policy: summarized
