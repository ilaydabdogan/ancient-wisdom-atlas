canonical_text:
  quote: ''
  summary: A youngest son follows instructions for entering the Virgin Queen’s towers
    and garden, using iron, grass, and wood to bypass animate barriers, and takes
    fruit for his blind father. He visits the sleeping queen, leaves signs of his
    presence, and returns home. The queen learns the truth from a mirror, marches
    with armies from seven kingdoms, tests claimants, recognizes the youngest son,
    repays his kiss and bite twofold, heals the blind king, and marries the youth.
    A separate tale then tells of a widow who, on the fifteenth night of Ramadan,
    uses three wishes to enlarge, shrink, and restore her son’s head. The passage
    ends with the opening of “Arsuman,” naming a couple’s son and daughter.
  language: English
  quote_policy: summarized
