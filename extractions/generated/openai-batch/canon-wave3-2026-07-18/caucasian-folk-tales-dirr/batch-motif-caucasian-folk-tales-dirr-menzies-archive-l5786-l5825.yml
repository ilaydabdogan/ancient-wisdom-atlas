canonical_text:
  quote: ''
  summary: Näsni impresses the Narts by creating a cloud of flour where he had buried
    a sack, and they invite him to live among them, offering their sister and half
    their possessions. Later, a monster described in translation as a rhinoceros threatens
    the village. Näsni refuses to join the hunt until his wife forces him out. He
    hides in a pear tree above the monster’s lair, faints from fear, falls onto the
    beast’s back, and clings to it as it rushes to the village. The Narts kill the
    monster, while Näsni acts indignant afterward.
  language: English
  quote_policy: summarized
