canonical_text:
  quote: ''
  summary: The passage contains the end of one animal-fable episode, a full tale about
    a wolf, bear, fox, and donkey, and the beginning of a fox-and-partridge tale.
    In the opening fragment, hungry animals propose eating the youngest; the wolf
    and fox make exaggerated age claims, the mule directs the wolf to inspect a supposed
    birth date on its hoof, and the wolf is kicked and then eaten by the fox. In the
    main tale, a wolf, bear, and fox lure a donkey with a promise of barley after
    harvest, kill him, and divide badly after the fox eats the heart and lungs, blames
    the bear, hides the rest, and drives the wolf and bear away. The closing fragment
    begins with a hungry fox seeing a frightened partridge on a tree.
  language: English
  quote_policy: summarized
