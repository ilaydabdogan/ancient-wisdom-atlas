canonical_text:
  quote: ''
  summary: Cinder-Stick repeatedly avoids danger among the Divs by using substitutions,
    boasts, and explanations that make the Divs believe he has extraordinary strength.
    He produces water from cheese when challenged to squeeze a stone, persuades a
    Div to carry him across a river, escapes suspicion after being trapped under a
    giant loaf, pretends he intends to carry an entire wine-barrel, and threatens
    to pull out a roof rafter after being blown to the ceiling by a cough.
  language: English
  quote_policy: summarized
