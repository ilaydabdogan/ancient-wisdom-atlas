canonical_text:
  quote: ''
  summary: Sachwatho ignores a king's warning not to hunt beyond the country's borders,
    enters a tower with golden objects, and is tricked by a woman into disabling his
    horse, panther, and sword before she devours him and his animals. His brother
    Thavisi sees blood on a sword according to their compact, sets out to search for
    him, and is mistaken for Sachwatho because the brothers look alike.
  language: English
  quote_policy: summarized
