canonical_text:
  quote: ''
  summary: Sachwatho exchanges a golden robe for a swineherd's clothes and a pig's
    bladder, uses them to hide his golden hair, and becomes the king's gooseherd.
    His horse gives him a tail hair to summon the horse and panther. While bathing
    in the river, he removes the disguise, and the king's youngest daughter sees his
    golden locks and falls in love. She later gives her father three gherkins as a
    coded request that she and her sisters be married. The king summons suitors and
    begins a bride-choice procedure.
  language: English
  quote_policy: summarized
