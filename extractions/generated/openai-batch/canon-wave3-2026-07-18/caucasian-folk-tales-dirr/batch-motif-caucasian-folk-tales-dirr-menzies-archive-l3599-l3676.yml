canonical_text:
  quote: ''
  summary: A sick king sends his two sons-in-law a third time to fetch the Water of
    Life. Sachwatho, the gooseherd, secretly follows, summons his horse with a horse-hair,
    and is told how to take the water from between clashing rocks. The horse carries
    him through the rocks while he fills a pitcher, but its tail is cut off. The two
    brothers-in-law obtain the water from Sachwatho only after accepting kicks from
    the horse, then give it to the king, who recovers and credits them. The king later
    declares war on a neighboring king; Sachwatho summons horse and panther, arms
    himself in golden garments, and kills many enemy fighters with their help.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gooseherd remains silent and says nothing to anyone while his wife bears
    the situation patiently and waits for something to happen.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king calls his sons-in-law for a third attempt and orders them to bring
    him the Water of Life because earlier remedies did not cure him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two sons-in-law set out, and the gooseherd follows behind them on a lame
    old nag through the town.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After leaving the streets, the gooseherd pulls out his horse’s hair, and his
    horse appears beside him and asks what he wants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The horse says the Water of Life gushes between two rocks that open and shut,
    producing fire sparks when they clap together, and instructs Sachwatho to use
    a long-handled pitcher or pail while the horse leaps between the rocks.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the source of the Water of Life there is an immense rock, with its summit
    lost in the heavens, divided into two halves that separate and lock together so
    that no living creature can pass between them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The horse springs between the two rock walls, Sachwatho fills his pitcher,
    and the rocks clash together on the horse’s tail and cut it off as they leave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The two brothers-in-law arrive after Sachwatho has fetched the Water of Life,
    ask him for it, and offer him a high price.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sachwatho asks no payment except that each brother-in-law allow his horse
    to kick him; after submitting to the kicks, they receive the Water of Life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The brothers-in-law give the Water of Life to the king, who recovers; the
    vizier and high steward do not tell the truth, and the king believes he has heroic
    sons-in-law.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The gooseherd’s wife becomes convinced that her husband is a useless bald-headed
    fellow and thinks she will be put to shame by him.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Because the king believes in the bravery of his sons-in-law, he declares war
    on the king of the next country, with rule over both kingdoms to belong to the
    conqueror, and assembles his army.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The vizier and high steward put on splendid armour at the head of the army,
    while the gooseherd summons horse and panther with the horse-hair, puts on golden
    garments, takes arms, and goes to war.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The gooseherd gallops through the enemy lines, cuts off heads with his sword,
    and his horse and panther kill twice as many enemies as he does.
  category: action
  evidence_refs:
  - ev:8
