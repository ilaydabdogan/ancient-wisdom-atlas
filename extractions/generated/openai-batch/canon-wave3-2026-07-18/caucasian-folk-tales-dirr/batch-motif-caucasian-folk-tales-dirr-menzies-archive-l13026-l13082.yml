  quote: ''
  summary: The passage first concludes an episode in which Badyr and other brothers
    find themselves outwitted, regret disobeying their eldest brother Hadji, ask his
    pardon on their knees, and are forgiven and invited to eat goat. It then begins
    a tale in which two mullahs quarrel and fight over which one a passing rider greeted.
    They pursue the rider, waving their fur caps, and ask him to decide. The rider
    says he greeted both, but when pressed says the greeting was meant for the stupider
    of the two, prompting another quarrel.
