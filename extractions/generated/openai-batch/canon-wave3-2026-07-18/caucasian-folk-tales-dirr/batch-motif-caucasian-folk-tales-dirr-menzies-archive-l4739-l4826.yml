canonical_text:
  quote: ''
  summary: In a tale section titled “The Virgin Queen,” royal sons seek fruit from
    the distant garden of the Virgin Queen. The first two return from wondrous gardens
    associated with rivers of milk, winter-ripening grapes, and a river of oil, but
    the king says these are still far from the true garden. The youngest son courteously
    greets an old man sewing cracks in the paths and receives directions through rivers
    of milk, oil, and honey toward crystal, silver, and gold towers reaching toward
    heaven.
  language: English
