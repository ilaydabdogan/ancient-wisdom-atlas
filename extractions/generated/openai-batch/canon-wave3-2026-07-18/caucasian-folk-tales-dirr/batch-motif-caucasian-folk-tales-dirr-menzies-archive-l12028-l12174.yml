canonical_text:
  quote: ''
  summary: 'The passage first closes a cave-captive episode in which Djomlat leaves
    Abrskil in a cave and later finds that three days have passed; Abrskil remains
    alive and will be freed only if someone visits him again. The following Ossetian
    variant tells that God punished Amiran for oppression and impiety by chaining
    him in a copper-doored cave. A huntsman is led to the cave, speaks with Amiran,
    fails to pull the straps of Amiran’s sword, and is sent to fetch a holy hearth
    chain under commands not to speak or look back. Near the cave he looks back, the
    door shuts, and Amiran remains imprisoned. The next section begins a Mingrelian
    variant under the Polyphemus-saga heading: a traveller is attacked by wolves at
    night, rescued by a torch-bearing man, and hears the host’s tale of seven fisherman
    brothers whose ship was dragged for weeks by an enormous fish to a rocky shore
    with a river of honey.'
  language: English
  quote_policy: summarized
