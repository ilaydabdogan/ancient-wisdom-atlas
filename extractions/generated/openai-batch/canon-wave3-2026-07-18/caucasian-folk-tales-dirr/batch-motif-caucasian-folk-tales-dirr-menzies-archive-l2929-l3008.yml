canonical_text:
  quote: ''
  summary: A father abandons his three daughters in a deep hole. The youngest prays
    and receives tool-like hands, digs a way out, and feeds her sisters from a king's
    stable until they are discovered. Before the king, the sisters declare extraordinary
    abilities; the youngest says she can bear a boy and girl with golden locks. The
    king marries her, and she bears such children. Her jealous sisters and a nurse
    substitute puppies for the children, throw the children into a mill-stream, and
    falsely accuse the mother. The king chains the mother at the gate for public humiliation.
    A childless miller rescues and adopts the children, who grow unusually quickly.
    At a royal feast, the children recognize and honor the bound woman as their mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father tells his daughters he will shake the tree while they gather apples,
    but when they step on the sheet they fall one after another into a deep hole,
    and he leaves them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the daughters become hungry, the elder two suggest that they themselves
    be eaten; the youngest prays to God for her hands to become a pickaxe and a spade.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: God hears the youngest daughter's prayer, her two hands become a pickaxe and
    a spade, and she digs a way out of the hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youngest daughter hides in the king's stable and takes almonds and raisins
    intended for the horses, eating some and carrying the rest to her sisters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king sends a groom to watch the stable after the horses become thinner,
    and the groom catches the maiden filling her apron with food.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Before the king, the eldest sister says she can weave a carpet large enough
    for the whole kingdom, the second says she can cook a kingdom-feeding dinner in
    an egg-shell, and the youngest says she can bear a boy and girl with golden locks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king marries the youngest sister and makes the other sisters ladies of
    the court.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youngest sister bears a boy and a girl with golden hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The elder sisters, jealous of the youngest, make a plan with the nurse to
    exchange the children for puppies, throw the children into the mill-stream, and
    tell the king that his wife bore puppies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king orders the mother chained to the great gate, where passers-by spit
    in her face and throw soot on her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A childless miller hears crying behind the mill, finds the boy and girl, pulls
    them out of the water, and adopts them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The rescued children grow in days as other children grow in years, and the
