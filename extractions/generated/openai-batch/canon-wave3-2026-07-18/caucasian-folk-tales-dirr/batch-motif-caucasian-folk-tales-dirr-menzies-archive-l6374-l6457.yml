canonical_text:
  quote: ''
  summary: Sane searches widely for a bride and finds Helena, whose beauty is said
    to be unmatched. They marry and return home, where festivities last two weeks.
    A local custom requires a young husband to leave his wife after a fortnight and
    travel for a year. After Sane’s departure, a handsome merchant from Schahar arrives
    with rare wares and is welcomed into the prince’s house by Helena. The merchant
    and Helena become increasingly intimate, and the narration suggests she is unfaithful.
    As Sane’s return approaches, the lovers fear separation. A waiting-woman notices
    the merchant’s sadness, and he asks her to help him because he loves Helena.
  language: English
