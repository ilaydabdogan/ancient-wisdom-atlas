  summary: In an episode from “Three Thieving Brothers,” Badyr and Nadr repeatedly
    obtain a goat or its meat by stealth and disguise, while Hadji repeatedly counters
    them with his own impersonations and tricks. The passage includes roof entry,
    mistaken identity, cross-dressing disguise, a false alarm about robbers, a chimney
    deception, and Hadji roasting the recovered meat.
