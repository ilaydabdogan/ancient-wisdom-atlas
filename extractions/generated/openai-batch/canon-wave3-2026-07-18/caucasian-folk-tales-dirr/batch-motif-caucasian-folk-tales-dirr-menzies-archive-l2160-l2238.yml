canonical_text:
  quote: "“I am called Beauty; I will always be as I am now.”"
  summary: A youth remains with an immortal maiden named Beauty in the Land of the
    Ever-Living while earthly time passes rapidly. He longs for home, receives three
    apples from her, returns to find familiar landmarks dead or altered and his mother
    long gone, then eats the apples and rapidly ages and dies. The villagers bury
    him in the name of Christ.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The maiden asks the youth to tell her age, and he says she cannot be more
    than fifteen because of her youthful appearance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden says she was made on the first day of Creation, is called Beauty,
    and will always remain as she is.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maiden says the youth could have stayed with her always, but that he is
    not worth immortality; the youth vows to obey her will and stay beside her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Years pass so quickly that they seem like seconds; the earth changes, while
    the maiden remains unchanged, and a century passes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youth longs to see his home, mother, friends, and acquaintances; the maiden
    says he will not find even their bones and gives him three apples to eat at home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the return journey, the raven is still on its rock but is dead, and the
    abyss is filled up.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stag is still in its place but is dead, and the heavens support themselves
    on its horns.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In his village, the youth meets no one he knows; an old couple says a woman
    with his mother’s name lived according to old tradition a thousand years before.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The villagers do not believe he is the son of that woman and think he is a
    messenger from God.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the place where his mother’s house had stood, the youth finds ruins with
    broken walls, moss, and nettles, and remembers his mother and childhood.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: After eating the first apple, a white beard appears; after the second, his
    knees give way and he becomes weak and frail; after the third, he dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The people of the village carry away his body and bury it in the name of Christ.
  category: action
  evidence_refs:
