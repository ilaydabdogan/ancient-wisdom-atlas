canonical_text:
  quote: ''
  summary: Kitschüw travels with brothers and Aslanä on Tulpan horses to a sea, where
    a brother’s prayer opens the water and reveals the three-headed Ajdaha with Altuntschatscha.
    Altuntschatscha tells Kitschüw that Ajdaha’s soul is in a box inside a fish; Kitschüw
    destroys it, cuts off Ajdaha’s heads, and takes her away. Ajdaha’s mother Enäj
    later restores him to life by recovering his soul from another fish. Ajdaha pursues
    them; after another brother prays, God makes a tower appear, and Kitschüw again
    cuts off Ajdaha’s heads. Kitschüw returns home with his bride, then abruptly departs
    alone, asks her to wait a fixed span of time, chooses the path marked as one from
    which he will not return, and obeys his speaking horse’s instruction to bathe
    in a spring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kitschüw states that he will cut off Ajdaha’s head.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kitschüw sets out with five brothers and his friend Aslanä on Tulpan horses
    supplied by his father-in-law; they travel in seven days a distance that would
    take seven years on other steeds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the shore of a great sea, Kitschüw asks the eldest brother to fulfil his
    promise; after the brother prays, the sea opens and the group sees the three-headed
    Ajdaha asleep at the sea bottom with Altuntschatscha holding one of his heads
    on her lap.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Altuntschatscha tells Kitschüw to kill a fish, find a box containing Ajdaha’s
    soul inside it, and remove the soul before cutting off Ajdaha’s heads.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kitschüw kills the fish, opens it, removes the box, cuts the soul in pieces,
    cuts off Ajdaha’s three heads, takes Altuntschatscha, and flees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Enäj, Ajdaha’s mother, finds her son cut to pieces, becomes angry, and begins
    killing fish in the sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A big fish tells Enäj that another big fish ate Ajdaha’s soul; Enäj kills
    that fish, takes out the soul, and brings Ajdaha back to life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kitschüw identifies sudden fine rain as a sign that Ajdaha is coming after
    them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The second brother prays to God; God makes a high tower appear, and the brothers
    and Altuntschatscha hide in it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ajdaha jumps toward the tower but cannot reach the hidden group; on his second
    jump Kitschüw cuts off all three of Ajdaha’s heads with one blow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Seven days later Kitschüw, his bride, and his brothers arrive home, where
    the kings arrange a joyful feast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kitschüw suddenly says he must go away, tells his bride to wait three years,
    three days, three hours, and three minutes, tells his mother the same intention,
    refuses Aslanä’s company, and departs alone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: On the ninth or tenth day Kitschüw reaches three diverging paths with three
