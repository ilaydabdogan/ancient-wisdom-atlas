canonical_text:
  quote: ''
  summary: 'In the opening of “The Fire-Horse,” a father’s crop is damaged at night.
    The two elder sons fail to guard it. John, the third son called stupid, keeps
    himself awake by cutting his finger and rubbing salt in the wound. At midnight
    a winged fire-horse descends from heaven, damages the crop, and is caught by John
    with a rope. The horse promises future service and gives John a threefold whistle-and-call
    formula; John releases it and the field is no longer harmed. Later the king announces
    a three-day feast and a marriage contest: whoever can jump high enough on horseback
    to take the princess’s ring from her tower balcony may marry her. John’s brothers
    leave him behind, but John summons the fire-horse, jumps over its head, and becomes
    handsome.'
  language: English
  quote_policy: summarized
