canonical_text:
  quote: ''
  summary: A peasant seeks gifts for his three daughters. The youngest asks for a
    Rose of Paradise, which is found only in a Div's garden. The peasant steals it,
    and the Div demands either the rose or the youngest daughter. She goes to the
    Div's castle, overhears an order that she be killed and cooked, kills the Div's
    sister instead, escapes with magical objects, and uses a magic mirror to create
    a glass forest during the Div's pursuit.
  language: English
  quote_policy: summarized
