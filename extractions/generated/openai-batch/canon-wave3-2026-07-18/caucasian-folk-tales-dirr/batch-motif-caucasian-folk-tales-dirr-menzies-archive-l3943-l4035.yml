canonical_text:
  quote: ''
  summary: The passage closes one tale with reports of a doubled son-in-law, the arrival
    of two indistinguishable men, royal feasting, and a formulaic ending. It then
    begins a new tale in which the miller Lause-Hadschi catches a rag-stealing fox;
    the fox bargains to enrich him and marry him to the chan's daughter, then begins
    a trick by asking the chan for a measure to measure Bukutschichan's silver.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king rejects reports that his son-in-law approaches in a double form and
    has the first two messengers executed; when a third messenger repeats the news,
    he sends the queen to verify it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The queen sees two men coming who are so alike that they cannot be told apart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sachwatho and Thavisi come before the king; the king and Sachwatho's wife
    cannot distinguish them, and Thavisi tells the story.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king orders a great feast, makes Sachwatho king, and later the party visits
    Thavisi, who is king in his own country, where another festival is held.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The tale ends with a formulaic passage contrasting sorrow and joy, bran and
    flour, mentioning a mountain, Eternity, a mirror, and the marriage of listener
    and teller.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the next tale, the miller Lause-Hadschi discovers that his heaps of rags
    have disappeared, hides behind the door, and catches a mangy fox entering.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The fox speaks to the miller, asks not to be killed over the rags, and promises
    to make him rich, famous, and married to the chan's daughter.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'The fox sets a condition: the miller must feed him with kurdjuk while he
    lives and bury him in one when he dies; the miller agrees.'
  category: speech
  evidence_refs:
  - ev:8
  - ev:11
- id: obs:9
  text: The fox finds an abbas in a dustheap and goes to the chan's castle, which
    lies across a river.
  category: action
  evidence_refs:
  - ev:9
  - ev:11
- id: obs:10
  text: At the chan's castle, the fox asks for a measure to measure Bukutschichan's
    silver; when the chan says he has never heard of Bukutschichan, the fox says he
    is Bukutschichan's vizier and takes the measure.
  category: speech
  evidence_refs:
  - ev:10
