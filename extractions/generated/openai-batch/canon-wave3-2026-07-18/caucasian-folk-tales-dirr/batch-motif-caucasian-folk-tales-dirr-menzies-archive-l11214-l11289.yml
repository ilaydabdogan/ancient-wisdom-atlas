canonical_text:
  quote: ''
  summary: Rustumsal and Qahirman fight the army of the Divs. The king of the Divs
    sends giants against them, but Rustumsal kills a giant challenger and, with the
    help of seven kings and their army, defeats the enemy. Rustumsal enters the Div
    king's house, finds his aunt, gathers booty, and begins the return journey. The
    allied kings part from him. Near his native town he learns that the people are
    in mourning for him and his father and that strange conquerors threaten the land;
    he sends news of his return ahead.
  language: English
  quote_policy: summarized
