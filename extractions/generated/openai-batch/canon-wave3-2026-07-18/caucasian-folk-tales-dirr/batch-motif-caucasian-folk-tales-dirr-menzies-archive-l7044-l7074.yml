canonical_text:
  quote: ''
  summary: The queen finds her daughter's room empty and a search fails to find the
    princess. The five eldest sons of the King of Schura search and meet their youngest
    brother Kitschiiw under a tree. Kitschiiw says Altuntschatscha, his bride, was
    carried off by the three-headed Ajdaha. The brothers plan to rescue her and prepare
    for the journey. In Schura, two kings promise horses, weapons, and provisions;
    the eldest and second brothers propose prayers to God for a divided sea and a
    hiding tower if the Div follows.
  language: English
  quote_policy: summarized
