canonical_text:
  quote: ''
  summary: In the tale section titled “The Skilful Thief,” Simon and Peter repeatedly
    rob a treasury. Simon is caught in a hot-wax pit and asks Peter to remove his
    head. Guards expose the body to identify mourners, but Peter helps Simon’s wife
    mourn under cover of broken crockery. Peter then tricks the guards with a donkey
    ruse, recovers the body for burial, declares himself to the king, and is commissioned
    to shame a mocking neighboring king.
  language: English
  quote_policy: summarized
