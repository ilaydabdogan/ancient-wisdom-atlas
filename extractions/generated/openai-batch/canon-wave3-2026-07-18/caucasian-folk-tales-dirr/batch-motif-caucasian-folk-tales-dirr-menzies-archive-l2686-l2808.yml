canonical_text:
  quote: ''
  summary: A king's son is instructed to seize a golden-haired maiden by her hair
    until she swears by the cock and hen nightingale to marry him. He succeeds, passes
    her horse-kinship test, and sets out with her, but a lute-player abducts her by
    moving through earth and heaven. The king's son pursues through an underground
    route, encounters three three-legged horses with death, descent, and heavenly-light
    functions, rides the red horse down to another kingdom, and reaches a town where
    a dragon controls the well and consumes maidens. He protects the king's daughter,
    wakes when her tears burn him, kills the dragon, and the town regains access to
    water.
  language: English
  quote_policy: summarized
