canonical_text:
  quote: ''
  summary: Rustum kills the Adschdaha, follows its head to a deep hole, descends by
    rope after his companions fail, breaks seven iron doors below, kills Divs, frees
    four captive maidens, receives magical feathers from the most beautiful maiden,
    and is then abandoned below by companions who keep the maiden above.
  language: English
  quote_policy: summarized
