canonical_text:
  quote: ''
  summary: After capturing Kuba’s horses, Etsemej sends his aunt and her warriors
    home with the herd but remains behind to confront Kuba. He rests on a hill, is
    alerted by his horse, and sees Kuba approaching on a marvelous six-legged horse.
    Etsemej repeatedly misdirects Kuba about the stolen herd’s route before finally
    admitting that he himself drove the horses away.
  language: English
  quote_policy: summarized
