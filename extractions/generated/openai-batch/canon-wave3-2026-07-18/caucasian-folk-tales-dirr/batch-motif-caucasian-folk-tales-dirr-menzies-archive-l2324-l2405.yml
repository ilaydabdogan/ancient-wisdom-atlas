canonical_text:
  quote: ''
  summary: Rose of Paradise flees a pursuing Div by throwing a comb and scissors that
    become obstructing forests. She prays for a shut house to open, enters it, and
    the doors close against the Div. Inside she finds a coffin containing a king’s
    son who is dead during the day and alive at night because he had shot at the sun.
    The prince discovers her, they live as husband and wife, and she becomes pregnant.
    He gives her a ring that protects her from wild dogs at his father’s court. She
    receives lodging there and gives birth to a son whose likeness to the prince moves
    the king and queen. The prince later calls to ask whether the child is a son or
    daughter.
  language: English
  quote_policy: summarized
