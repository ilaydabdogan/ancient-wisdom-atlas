canonical_text:
  quote: "“Now, take off your pig’s skin!”"
  summary: 'The king’s son asks the pig to remove its skin; she becomes a beautiful
    maiden, is presented as his wife, and the king blesses and crowns them. A jealous
    vizier tries to repeat the event with a large ordinary pig, forces a church marriage,
    and is killed when the pig bites through his throat. A new tale begins: an old
    childless peasant and his wife seek a remedy; the peasant equips himself with
    iron items, consults a fortune-teller, and travels beyond nine mountains to the
    land of a black Div, who challenges his entry.'
  language: English
  quote_policy: quoted
