canonical_text:
  quote: ''
  summary: Sane obtains the princess’s consent and a large wedding is held by seven
    brothers. During the feast a bard sings songs that distress Sane because they
    recount the carrying off of a prince’s wife and bloodshed over Helena. The hosts
    shift to customary contests; Sane proves his strength by throwing a heavy stone
    far beyond the others. At night in the bridal chamber Sane pretends to sleep,
    sees his wife put on armor and ride away, then arms himself and secretly follows
    her to a deep gorge where armed men are assembled.
  language: English
  quote_policy: summarized
