canonical_text:
  quote: ''
  summary: In this passage, Sachwatho conceals his splendid identity by returning
    to town as a ragged bald-headed gooseherd. The king is not healed by an earlier
    liver remedy and sends his sons-in-law to obtain milk from a mother panther. Sachwatho
    summons his own horse with horse-hair, travels with a panther-cub whose teeth
    are fiery, subdues a mother panther, and trades the panther-milk to his brothers-in-law
    for the lobes of their ears. They bring the milk to the king and gain fame, while
    Sachwatho resumes his poor disguise and is mocked.
  language: English
  quote_policy: summarized
