canonical_text:
  quote: ''
  summary: A merchant persuades Helena's waiting-woman with treasure and a secret
    hiding arrangement to help him take Helena away. Helena is lured from bathing
    into a boat, carried to the merchant's ship, and after brief hesitation embraces
    him. The waiting-woman hides the disappearance for three days. When Prince Sane
    returns, learns Helena is gone, and fails to find her in his own kingdom, his
    father's former tutor advises him to search beyond the sea; Sane prepares to retrieve
    her even from the sea's bottom.
  language: English
  quote_policy: summarized
