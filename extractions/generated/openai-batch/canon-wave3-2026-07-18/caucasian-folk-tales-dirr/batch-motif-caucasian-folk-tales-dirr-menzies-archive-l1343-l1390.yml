  quote: ''
  summary: The opening of the Io tale “The Parasite” describes a lazy, work-shy beggar
    who loses the patience of his neighbours. He prays to God for sustenance, is mocked
    by local boys when nothing appears, and decides to climb a high mountain to be
    nearer to God. On the way he meets a speaking wolf.
