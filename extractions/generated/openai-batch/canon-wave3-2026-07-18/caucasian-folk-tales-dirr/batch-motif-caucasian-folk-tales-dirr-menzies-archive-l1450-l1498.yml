canonical_text:
  quote: ''
  summary: After receiving answers from the Almighty for the wolf, oak, and fish,
    the Parasite returns homeward. He tells the fish that a diamond in its left gill
    must be removed for its sight to return, removes it, and rejects the diamond reward
    by throwing it into the water. He then tells the oak that a buried wine-jar under
    its withered side prevents the sap from rising, digs it out, finds it full of
    gold and silver, and rejects this reward as well.
  language: English
