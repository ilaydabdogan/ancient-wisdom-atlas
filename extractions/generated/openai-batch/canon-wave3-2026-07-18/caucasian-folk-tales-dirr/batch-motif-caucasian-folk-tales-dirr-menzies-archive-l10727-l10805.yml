canonical_text:
  quote: ''
  summary: Rustum returns to the overworld on a bird, having fed it a piece of his
    own thigh when meat ran out; the bird heals him with a feather and gives him two
    feathers for future aid. Rustum rejoins his companions, takes the beautiful maiden
    as bride, gives other maidens to his companions, and they exchange rings whose
    stones blacken when one is in trouble. Rustum later kills a Div and takes the
    Div's wife. A king desiring that woman enlists an old witch, who gains entry to
    Rustum's household, induces the wife to learn the source of Rustum's strength,
    overhears that it resides in his ring and that removal for forty days will kill
    him, and begins to act while he sleeps.
  language: English
  quote_policy: summarized
