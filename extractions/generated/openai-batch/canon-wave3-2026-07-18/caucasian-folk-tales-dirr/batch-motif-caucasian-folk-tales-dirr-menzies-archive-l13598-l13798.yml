canonical_text:
  quote: ''
  summary: 'A sequence of comic Mullah Nasreddin anecdotes: he names a child Hasid
    because its nine-month journey was made in three; argues that old age has not
    weakened him because he still cannot lift a stone he could not lift when young;
    is caught stealing vegetables and invents excuses involving wind and uncertainty;
    divides four drachmen among three by postponing the third share until God sends
    more money; is robbed despite carrying weapons and says his hands were full; justifies
    eating nuts with shells; as a boy returns only a sheep skull and explains away
    every missing edible part; reverses his evaluation of cheese depending on whether
    it is available; refuses to lend an olkäna with impossible excuses; and tells
    noisy boys that free apples are being distributed at the bazaar.'
  language: English
  quote_policy: summarized
