canonical_text:
  quote: ''
  summary: Kuba's wife secretly dismisses the guards around Etsemej's body and revives
    him with a magic towel. Etsemej overhears her reveal that Kuba can be killed only
    with a black knife hidden in the innermost of twenty boxes. He steals the key
    and knife, beheads Kuba, impersonates him, and departs with Kuba's widow, who
    later recognizes him by his reflection in river water. Etsemej treats her as a
    prisoner during the journey. In Sdésryqo's territory, Sdésryqo demands toll and
    asks for Kuba's wife instead of gold, horses, or slaves.
  language: English
  quote_policy: summarized
