canonical_text:
  quote: "“The poor man had some milk brought in, boiled the wolf’s brain in it, and
    gave the sick man some of the soup to drink.”"
  summary: A poor man takes the brains of a wounded wolf, uses them boiled in milk
    to cure an ill prince, and receives rich gifts. A rich man hears of the poor man’s
    gains, threatens him, has one eye put out as the price of the story, and then
    goes to the animal house where the bear, wolf, and fox report their failures and
    missing treasures.
