canonical_text:
  quote: ''
  summary: Rustumsal arrives in a town, forces his way past the king’s guards, and
    demands to know which Div carried off his aunt. The king secretly summons Rustumsal’s
    father, Qahirman, and Qahirman’s wife. Rustumsal is told that his aunt is with
    the forty-headed Div, king of all Divs, though the Div’s dwelling place is unknown.
    The king directs Rustumsal to ancestral weapons in the treasure-house; Rustumsal
    arms himself, refuses his parents’ pleas to abandon the danger, declares his resolve
    to rescue his aunt, gives a seven-year deadline for his return, and rides away.
  language: English
  quote_policy: summarized
