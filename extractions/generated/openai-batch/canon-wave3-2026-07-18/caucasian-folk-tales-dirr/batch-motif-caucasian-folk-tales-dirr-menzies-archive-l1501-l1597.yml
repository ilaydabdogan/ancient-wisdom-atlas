canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which the Parasite brings the wolf an answer
    that human flesh will make it fat, and the wolf devours him; villagers later identify
    his clothing and an old man gives a moral about laziness. A new tale begins: a
    poor peasant, urged by his wife, takes his son to find a master. At a spring,
    a devil emerges in human form and offers to teach the boy for a year, with the
    condition that the father may reclaim him only if he can recognize him. After
    a year, the son secretly tells his father how to identify him when the master
    changes all pupils into doves. The father correctly identifies the son, and the
    angry devil must return him.'
  language: English
  quote_policy: summarized
