canonical_text:
  quote: ''
  summary: Sachwatho repeatedly leaves his humble disguise to fight as an unknown
    champion. After the king marks his wounded arm with a silken kerchief, a wine-and-apple
    test reveals him. The king reconciles with him, Sachwatho defeats the enemy, receives
    a palace with his wife, and exposes the vizier and high steward by showing bodily
    marks they gave as payment for earlier quest objects, including panther-milk and
    the Water of Life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a day of battle, people wondered about an unknown hero, while Sachwatho
    had already put on old rags and returned home to his wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At dawn Sachwatho put on golden garments and rode to battle, where he was
    wounded in the arm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king noticed the stranger knight bleeding and bound the wound with his
    own silken kerchief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king held a festival with oxen and wine and ordered a search for the knight
    whose wounded arm was tied with the king’s kerchief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When wine and apples were handed out together, Sachwatho kept one hand behind
    his back, and his wounded arm with its silken bandage was discovered.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the discovery, the king embraced Sachwatho, kissed him, asked forgiveness
    for earlier bad treatment, and asked him to appear in battle again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sachwatho covered his head with a pig’s bladder, wore old rags, mounted his
    horse, armed himself, and routed the enemy army.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The enemy king sent a messenger asking Sachwatho not to destroy his people
    and saying he was conquered and would give up his kingdom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the war, Sachwatho was praised, his wife looked at him admiringly, his
    wife’s sisters were envious, and the king gave Sachwatho and his wife a palace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sachwatho said he had given the doe’s liver to the vizier and high steward,
    and he showed their missing little-finger tips as proof.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sachwatho said he had also given them panther-milk for the lobes of their
    ears and had fetched the Water of Life with help from his horse.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The missing ear-lobes and hoof marks on the rivals’ backs were observed, after
    which the vizier and high steward left in shame.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The excerpt ends with the beginning of a sentence saying Sachwatho soon became
