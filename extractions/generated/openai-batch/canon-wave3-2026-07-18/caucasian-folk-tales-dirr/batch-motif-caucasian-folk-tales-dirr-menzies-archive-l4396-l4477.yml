canonical_text:
  quote: "“a land in which there was mud when the sun shone and dust when it rained”"
  summary: 'A hero wrestles an unknown radiant youth, receives hospitality from the
    youth''s shepherds, enters a castle guarded by two dragons, discovers that the
    youth is a maiden, overcomes her in a second wrestling contest, and marries her.
    She explains that a slipper previously held by the king''s daughter must be hers
    and gives him its pair. The hero returns the slippers to the king''s daughter,
    who gives him another task: to discover what passed between Balai and his wife
    Boti. He rides to a strange land and ties his horse beneath a tree whose branches
    reach heaven.'
  language: English
  quote_policy: quoted
