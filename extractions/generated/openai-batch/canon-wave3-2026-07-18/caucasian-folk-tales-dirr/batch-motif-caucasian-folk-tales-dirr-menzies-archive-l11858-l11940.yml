canonical_text:
  quote: ''
  summary: A noble Abkhasian virgin who had vowed perpetual virginity gives birth
    while remaining innocent. Her son Abrskil grows with extraordinary speed and becomes
    a brave defender, but grows proud, persecutes selected people and tribes, cuts
    down vines to avoid any sign of bowing, refuses God’s demand that he cease and
    bow forty times, and is pursued by angels. He uses the magic horse Arasch to move
    between Mount Uartsachu and the Black Sea shore until the angels seek advice from
    an old witch, who proposes an ox-skin trap.
  language: English
  quote_policy: summarized
