canonical_text:
  quote: ''
  summary: In a battle episode, an unnamed speaker taunts Urysmag about carrying a
    boy called the son of a witch; Urysmag throws the boy down and the boy dies. Batrás,
    son of Chamyts, observes from heaven, descends to the Narts, orders cannons brought,
    carries one himself, loads himself into it, and is fired into the enemy town.
    Tschilachsarton's daughter begs for mercy and agrees to marry his brother; Batras
    insists on the marriage, spares them, and takes half the town's goods. The Narts
    take people and gold, and Sósryqo takes his bride. The next section begins by
    naming Satana as mother of the race of Bora and recounting Uástyrdji's messenger-borne
    proposal to make her his beloved, which she refuses in the truncated excerpt.
  language: English
  quote_policy: summarized
