canonical_text:
  quote: "“Steel me, that I become as steel.”"
  summary: The passage recounts Batras emerging from the sea, displaying extraordinary
    strength, and seeking to be transformed into steel by the mythical smith Kurdalagon
    through fire and immersion in the sea. It then begins the following episode, in
    which Chamyts challenges a malik, kills the men sent against him, and the malik
    consults a wise woman about countering Chamyts through the use of a wolf-skin
    against Chamyts’ horse.
