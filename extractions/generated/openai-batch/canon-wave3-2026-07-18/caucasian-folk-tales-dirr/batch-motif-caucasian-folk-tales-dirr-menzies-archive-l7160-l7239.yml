canonical_text:
  quote: ''
  summary: 'The passage concludes part of the Kitschüw tale: a speaking horse transforms
    Kitschüw into a golden bird, gives him magical words and tail hairs, and later
    helps him complete bride-winning ordeals and defeat Ajdahas. Kitschüw returns
    with a maiden, is then sent to fetch the sister of three Ajdahas for his friend,
    kills the Ajdahas, opens a great tree where she sits, and returns with his friend
    to a greater feast. The passage then begins the next tale, in which a rich man
    invites a poor man to hunt and tells him to obtain provisions through his wife.'
  language: English
  quote_policy: summarized
