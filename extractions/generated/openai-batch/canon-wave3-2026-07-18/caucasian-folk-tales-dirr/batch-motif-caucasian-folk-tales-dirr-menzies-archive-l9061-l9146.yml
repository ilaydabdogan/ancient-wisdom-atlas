canonical_text:
  quote: ''
  summary: Chamyts is killed by the malik of Tynty and his body is carried home by
    his horse. His relatives address the dead man with an Underworld blessing or curse
    based on how he was killed. The Narts summon Batras by way of the evening and
    morning winds. Batras retrieves his hidden armor, descends burning from heaven
    to earth, cools himself with part of a glacier, and prepares to avenge his father.
    He attacks Tynty by loading himself into a cannon, destroys houses, finds the
    malik, refuses ransom, beheads him, takes spoils, and hangs the head on a pole
    in the graveyard.
  language: English
  quote_policy: summarized
