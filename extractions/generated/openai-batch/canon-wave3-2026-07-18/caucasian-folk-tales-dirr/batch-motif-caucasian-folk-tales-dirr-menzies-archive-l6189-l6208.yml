canonical_text:
  quote: ''
  summary: 'An old man remarries after his wife''s death. His second wife bears a
    daughter and hates the man''s first daughter, pressuring him to leave the first
    daughter in an empty house in a wood to be eaten by wild beasts. Alone there at
    night, the maiden begins making porridge and gives meal to a mouse. The satisfied
    mouse warns her that a bear will come, give her a little bell, and set a wager:
    if the bear cannot catch her as she runs three times around the house, she will
    receive a silver wagon with three horses; if he catches her, he will eat her.
    The mouse tells her to agree and take the bell; the excerpt breaks off as the
    mouse continues its instruction.'
  language: English
  quote_policy: summarized
