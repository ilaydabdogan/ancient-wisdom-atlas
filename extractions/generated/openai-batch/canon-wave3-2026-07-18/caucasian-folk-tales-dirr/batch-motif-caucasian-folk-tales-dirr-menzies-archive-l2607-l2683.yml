canonical_text:
  quote: ''
  summary: 'In a fragment of “Cock and Hen Nightingale,” a king asks his sons to build
    a flawless church. The youngest son accepts and repeatedly rebuilds after an old
    man identifies faults: crooked foundations, a crooked tower, and finally the absence
    of a cock and hen nightingale. The youngest son then leaves the country on a three-legged
    horse. At a meadow, an old man advises him that the horse can take him across
    the sea to a maiden who has the birds, but warns that the maiden can change him
    to dust and wind if she sees him.'
  language: English
  quote_policy: summarized
