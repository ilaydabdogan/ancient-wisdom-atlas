canonical_text:
  quote: ''
  summary: A mother forbids her son to enter another room. He disobeys, finds an empty
    room with a beautiful picture above the door, swoons, and resolves to find the
    maiden in the picture. His mother equips him and sends him with a woman guide
    to the daughter of the Chan. The guide instructs him how to visit the silent maiden
    and how to address a candlestick behind which the guide will hide and tell a story
    with a problem to solve. The embedded story begins with three friends who love
    the same maiden and are given money by her father for a trading contest to determine
    who will marry her.
  language: English
  quote_policy: summarized
