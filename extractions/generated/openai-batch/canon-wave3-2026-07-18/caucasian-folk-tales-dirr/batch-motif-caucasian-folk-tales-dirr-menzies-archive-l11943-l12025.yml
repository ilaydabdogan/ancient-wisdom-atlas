canonical_text:
  quote: ''
  summary: Abrskil, riding Arasch, is trapped at a mountain-top, seized by angels,
    and banished by God to an inaccessible cave. A witch or old woman associated with
    the cave guards him; Arasch continually licks Abrskil’s chain thinner, but the
    chain is restored when the transformed whelp eats. Djomlat enters the dark mountain
    cave with a guide, asses, and candles to seek Abrskil, but Abrskil remains unreachable
    and asks after Abkhasia.
  language: English
  quote_policy: summarized
