canonical_text:
  quote: ''
  summary: In a nested tale, three men possess a swift horse, a world-seeing telescope,
    and life-restoring medicine. The telescope reveals that the maiden they court
    is dying; the horse carries the medicine to her, and one drop restores her. The
    three then dispute who has the best claim to her. In the frame narrative, a candlestick
    asks a young man to judge the case; a silent girl contradicts his answer, and
    he claims her. A Djinn woman advises him to speak to the girl's tachta while she
    hides beneath it and answers. The tachta begins another tale in which a carpenter
    carves a human figure, a tailor clothes it, and a scholar prays that God give
    the being a soul.
  language: English
  quote_policy: summarized
