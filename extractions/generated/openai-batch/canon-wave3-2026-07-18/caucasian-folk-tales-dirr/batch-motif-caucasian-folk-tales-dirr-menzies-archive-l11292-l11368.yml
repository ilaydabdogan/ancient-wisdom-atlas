canonical_text:
  quote: ''
  summary: The passage recounts Rustumsal's return with his father and grandfather,
    then gives the history of a separated wife and three sons raised without knowing
    one another or their father. Djambachysch is taunted for having no father, learns
    his father's name, and sets out to find him. After showing extraordinary strength
    while helping an old man, he is brought before a king and made to wrestle Djanabbas,
    Söhrab, and finally Rustumsal. Rustumsal, not knowing Djambachysch is his son,
    stabs him during the fight. As he dies, Djambachysch reveals his father is Rustumsal;
    Rustumsal cries out and swoons.
  language: English
  quote_policy: summarized
