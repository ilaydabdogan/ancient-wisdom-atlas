canonical_text:
  quote: ''
  summary: 'The passage concludes the tale of Sane and his wife: she leads a raid,
    Sane secretly aids her in battle, she later recognizes him by the silk kerchief
    she used to bind his wound, reveals her former secret warrior life, and renounces
    it. The passage then begins “Kitschüw”: two allied kings vow that a future son
    and daughter will marry; the children are born and grow precociously; a three-headed
    Ajdaha, helped by his magical mother, becomes a golden bird and abducts the princess.'
  language: English
  quote_policy: summarized
