    for beauty while the prince hunts.'
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: No supernatural cause for the rapid growth is stated in this passage.
- id: motif:6
  label: stolen princess / stolen beloved
  taxonomy_refs:
