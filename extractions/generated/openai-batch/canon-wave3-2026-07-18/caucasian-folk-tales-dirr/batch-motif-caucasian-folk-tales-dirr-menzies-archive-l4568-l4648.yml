canonical_text:
  quote: ''
  summary: Balai recounts following Boti to the tower of the Narts, killing or wounding
    Nart brothers, being transformed by Boti’s magic whip into a dog and then a hawk,
    restoring himself, and imposing transformations on Boti. He then reveals that
    Boti’s sister is a king’s daughter connected to the wounded Nart. After Balai’s
    account, the hero escapes from Balai’s house on the mother eagle, who carries
    him over mountains and ravines.
  language: English
  quote_policy: summarized
