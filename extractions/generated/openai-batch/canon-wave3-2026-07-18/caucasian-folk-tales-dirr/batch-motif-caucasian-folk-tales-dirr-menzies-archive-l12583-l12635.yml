canonical_text:
  quote: ''
  summary: 'The passage ends a Solomon story with a plea about feathers being scattered
    by wind; Solomon abandons his plan and orders three sparrows to feed an owl daily,
    with a note that this continues in folk-lore. It then gives two Alexander stories:
    at birth Alexander runs around the room until an angel knocks him down at the
    fourth corner, signifying that he will conquer only three-quarters of the world;
    after Alexander dies, his mother refuses burial, but courtiers stage a fasting
    test with bread hung out of reach, causing her to stand on his body, after which
    they rebuke her and she permits burial.'
