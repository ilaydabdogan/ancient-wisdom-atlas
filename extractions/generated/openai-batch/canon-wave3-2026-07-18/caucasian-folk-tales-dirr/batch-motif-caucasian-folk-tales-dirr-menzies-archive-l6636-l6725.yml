canonical_text:
  quote: ''
  summary: Sane follows his friend's advice to disguise himself as a beggar in order
    to search inaccessible places. He discovers Helena in a big house, but she angrily
    orders him expelled. His friend then urges armed action. Sane resumes his princely
    identity, attacks the house with his friend's help, carries off the swooning Helena,
    and escapes by ship while fighting enemies. On the return voyage, the friend asks
    to be thanked by dividing Sane's prize; after Sane offers Helena to him, the friend
    insists and cuts Helena into two halves with a sabre, horrifying Sane.
  language: English
  quote_policy: summarized
