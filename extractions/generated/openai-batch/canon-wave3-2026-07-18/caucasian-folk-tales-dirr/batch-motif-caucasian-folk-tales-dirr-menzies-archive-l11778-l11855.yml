canonical_text:
  quote: ''
  summary: 'The passage recounts a Suanetian variant in which Amiran breaks his word,
    loses protection, is overpowered by demons, and is chained on Mount Elbruz opposite
    a nine-headed Div with a sword placed out of reach until his nails grow long enough.
    A bird alerts the demons to cut his nails, but a future liberation is expected
    to bring a Golden Age. A Kabardian variant follows: a one-eyed giant violates
    divine secrets at Mount Elbruz, is chained by God, tormented by a bird of prey,
    denied life-giving spring water, and will one day be released when God is angry
    with humankind.'
  language: English
  quote_policy: summarized
