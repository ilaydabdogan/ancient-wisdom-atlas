canonical_text:
  quote: ''
  summary: Qahirman rides the bird Smaragd toward the fortress where his son Rustumsal
    lives. Rustumsal nearly shoots the approaching bird but recognizes his father’s
    voice and lets them land. Father and son remain together for a time, hunting and
    roasting game. Meanwhile seven kings, who remember that Rustumsal delivered them
    from a spell, gather armies to search for him and promise a reward to whoever
    finds him. A man finds Rustumsal near a fortress and brings the kings to him.
    Rustumsal welcomes their offer of help, hunts enough game to feed the army, and
    then proposes a campaign against the white Divs. The passage ends as the white
    Div army approaches and Rustumsal attacks with the seven kings.
  language: English
  quote_policy: summarized
