canonical_text:
  quote: ''
  summary: A fox repeatedly deceives a chan into believing his master Bukutschichan
    is wealthy, first by planting coins in borrowed measures. The fox then asks for
    the chan's daughter in marriage, dresses Bukutschichan in improvised finery, and
    instructs him to feign being swept away in a river. The river removes the disguise;
    the chan's retinue rescues him and gives him real clothing and weapons. The fox
    explains Bukutschichan's awkwardness and astonishment as signs of even greater
    wealth and refinement.
  language: English
  quote_policy: summarized
