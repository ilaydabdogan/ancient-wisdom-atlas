canonical_text:
  quote: ''
  summary: The supplied range closes a preceding tale by saying a king gives the Dreamer
    his throne, kingdom, and crown. It then begins “The Earth Will Have Its Own,”
    in which a fatherless boy learns that all must die and be buried in the earth.
    He leaves home to seek a land without death, wanders widely, and meets a cloud-antlered
    stag, a raven at a bottomless abyss, and a beautiful maiden in a glass house by
    the sea. The stag and raven identify themselves as God’s messengers and offer
    him secure residence, but they are not deathless; the maiden tells him that no
    such land exists and that the earth will have its own. The excerpt ends mid-warning.
  language: English
