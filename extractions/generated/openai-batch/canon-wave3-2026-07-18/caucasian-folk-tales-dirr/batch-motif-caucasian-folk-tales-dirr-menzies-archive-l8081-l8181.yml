canonical_text:
  quote: ''
  summary: A hungry fox tries to imitate a wolf’s example while hunting with a hare,
    attacks a horse, is lured by the horse’s claim of gold hidden in its hoof, and
    is kicked. The fox reflects on earlier foolish bargains, is struck by a shepherd’s
    stone, and flees. In the next tale, a fox annually demands one of a dove’s young
    from her nest. The bird Malik Ulhazin advises the dove to challenge the fox to
    climb up if he can. The dove follows the advice, names Malik Ulhazin as her helper,
    and the fox goes to find him beside a river.
  language: English
  quote_policy: summarized
