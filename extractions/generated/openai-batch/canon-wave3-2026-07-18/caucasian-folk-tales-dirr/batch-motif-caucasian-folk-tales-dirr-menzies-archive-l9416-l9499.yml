canonical_text:
  quote: ''
  summary: In this Nart saga passage, Sósryqo kills Eltaghan with Eltaghan's own sword,
    takes his scalp and possessions, and orders young women to make a fur-collar from
    human remains they recognize as those of their relatives. The women consult a
    witch, who advises them to send Sósryqo after the golden scalp of Mukkara, son
    of Taryk. Sósryqo challenges Mukkara to a dice contest on the Sakola road, with
    heads at stake; the dice produce millet, chickens, a boar, hounds, fire, and rain,
    ending in Mukkara's concession within the supplied excerpt.
  language: English
  quote_policy: summarized
