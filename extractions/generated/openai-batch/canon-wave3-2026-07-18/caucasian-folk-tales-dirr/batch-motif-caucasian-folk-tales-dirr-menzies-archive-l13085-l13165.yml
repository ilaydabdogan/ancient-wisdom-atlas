canonical_text:
  quote: ''
  summary: The passage ends one tale in which two men compete over who is more stupid
    by recounting foolish incidents involving their pupils, and then begins a tale
    in which a man’s stupid wife interprets the order to mind the door literally,
    removes the door, and later climbs a tree after being beaten.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two disputants each claim to be the more stupid, and a horseman tells them
    to settle the question by each recounting the stupidest thing he has done.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: One speaker says he had thirty pupils and ordered them to clap their hands
    instead of saying a blessing whenever he sneezed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: During preparations for a festival in the court of the mosque, the first speaker
    digs a hole with his wife removing the earth, then calls two pupils to pull him
    out with a rope while he holds a sack of earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the first speaker sneezes near the top of the hole, the pupils let go
    of the rope and clap; he falls and suffers injuries to his arm, head, and eye.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second speaker says he had forty pupils and ordered that no one say anything
    except what was absolutely necessary.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the second speaker is ill, his pupils carry him on a rug to a neighbour,
    make soup but eat it themselves, and declare him dead while he remains silent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A mullah washes and wraps the silent teacher in grave-clothes; a pupil secretly
    puts dolma in his mouth, says he has come alive again with a swollen cheek, and
    a doctor cuts open the cheek and removes the dolma.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The second teacher then goes home silently and binds up his cheek.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The horseman tells the second speaker that he was the one whom the horseman
    had greeted, then turns his horse and rides away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man has two wives, one described as clever and one as stupid; he goes to
    the fields with the clever wife and tells the stupid wife to mind the door.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The stupid wife guards the door, becomes tired, removes it from its hinges,
    and takes it to her neighbours.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The husband and clever wife return and find both the door and the stupid wife
    absent; later the stupid wife returns with the door and explains that she faithfully
    carried out the command.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After receiving blows, the stupid wife runs to the fields and climbs a tree;
    a hen with chickens comes to the tree.
  category: sequence
  evidence_refs:
  - ev:6
