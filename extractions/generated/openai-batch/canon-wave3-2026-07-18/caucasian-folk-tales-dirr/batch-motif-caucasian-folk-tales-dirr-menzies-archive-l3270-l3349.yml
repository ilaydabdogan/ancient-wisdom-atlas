canonical_text:
  quote: ''
  summary: Sachwatho learns why his father grieves, reassures him, and agrees to go
    with the Div. The Div chooses Sachwatho, a foal, and a panther-cub and takes them
    toward his kingdom. An old woman warns that the Div plans to have Sachwatho and
    the animals killed and eaten. Sachwatho escapes on a horse with fiery hoofs, accompanied
    by the panther, and is pursued by the Div. At the ocean, the horse speaks, instructs
    Sachwatho, and carries him across the sea. Sachwatho gives thanks to God while
    the Div remains cursing on the far shore. Sachwatho then continues to another
    kingdom and meets a swineherd.
  language: English
  quote_policy: summarized
