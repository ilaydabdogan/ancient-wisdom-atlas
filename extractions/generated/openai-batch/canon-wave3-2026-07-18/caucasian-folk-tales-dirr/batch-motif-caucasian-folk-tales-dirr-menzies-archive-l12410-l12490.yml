canonical_text:
  quote: ''
  summary: A servant who has disclosed a secret loses a tree to three Armenians, then
    recovers it after Solomon gives him a riddle and supernaturally alters the sun’s
    apparent rising direction. Later, at the king’s table, the king tests the servant
    by claiming the servant’s knife as his own and imprisons him. Solomon, barred
    from visiting the prisoner and watched by guards, addresses a cat loudly with
    a legal answer that the servant overhears and repeats; the king releases the servant
    and gives him gifts.
  language: English
  quote_policy: summarized
