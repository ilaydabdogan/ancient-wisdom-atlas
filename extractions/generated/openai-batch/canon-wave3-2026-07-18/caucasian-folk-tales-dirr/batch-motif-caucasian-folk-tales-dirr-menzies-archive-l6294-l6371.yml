  summary: 'The passage concludes “The Magic Animals”: an old man receives a food-producing
    horse, a gold-producing goat, and a punitive cudgel from a very old woman; villagers
    steal the horse and goat by substitution, but the cudgel compels them to restore
    the animals. The passage then begins “The Beautiful Helena,” introducing Prince
    Sane, a seaside fortified town, wise men urging marriage, and the prince’s departure
    in search of a bride.'
