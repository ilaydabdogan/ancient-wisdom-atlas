canonical_text:
  quote: ''
  summary: After Helena's death, Sane resolves to take her head home as proof that
    faithlessness has been punished. His friend throws Helena's body into the sea
    and tells him that the seven Baraghun brothers have a sister who can become his
    companion. Sane returns home, displays Helena's head, then searches by land and
    sea for the Baraghun brothers. He finds them on an island, is received as a prince,
    and states his wish to court their sister. The elder brothers fear her strength,
    pride, and cruelty, but the youngest brother carries Sane's request. The sister
    allows Sane to come; when he proposes marriage, she silently turns away.
  language: English
  quote_policy: summarized
