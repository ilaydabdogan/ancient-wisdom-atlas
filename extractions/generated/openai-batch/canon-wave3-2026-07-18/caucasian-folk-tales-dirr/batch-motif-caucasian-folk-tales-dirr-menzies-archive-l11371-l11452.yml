canonical_text:
  quote: ''
  summary: Rustumsal attempts to restore his dead son Djambachysch by obeying a heavenly
    command to carry him in a trough for forty days, but an old man at a river persuades
    him to stop, causing the nearly revived son to die again. Later Rustumsal decides
    to prove himself by journeying toward the land of the Djinns, delegates rule to
    officials, wanders through woods and mountains, seizes a fortified mountain town,
    and has Djanabbas fight an opposing warrior who is revealed to be a woman.
  language: English
  quote_policy: summarized
