canonical_text:
  quote: ''
  summary: 'Etsemej refuses to give up the disputed wife and fights Sdsryqo and his
    army alone. Near death, he requests that the army stand in single file and uses
    his last shot to pierce the warriors'' left ears. His wife is prevented from helping
    him with a magic cloth, and Sdsryqo beheads him, though the army''s disfigurement
    brings Sdsryqo ridicule. The narrator says Etsemej fulfilled his duty and avenged
    his father. A new Rustum tale begins: Rustum, son of a shepherd and a beautiful
    wife taken to the king''s court after the shepherd''s death, shows violent strength
    as a child; the king sends him to a forest with three Divs, but Rustum kills them
    and returns with wood and the bodies.'
  language: English
  quote_policy: summarized
