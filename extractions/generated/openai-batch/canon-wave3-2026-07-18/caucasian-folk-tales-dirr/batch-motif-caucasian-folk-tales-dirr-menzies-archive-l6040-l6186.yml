- id: motif:6
  label: guarded bride carried away by instructed rider
  taxonomy_refs:
  - stolen_beloved
  basis: The Chan's desired maiden is watched by spirits; the heroine is instructed
    to seize her on horseback and brings the 'stolen maiden' away.
