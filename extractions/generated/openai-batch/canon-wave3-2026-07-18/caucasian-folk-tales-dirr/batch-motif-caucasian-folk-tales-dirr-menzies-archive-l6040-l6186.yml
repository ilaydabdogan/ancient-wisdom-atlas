canonical_text:
  quote: ''
  summary: An old nobleman tests his three daughters by ambushing them at a bridge
    while they ride in men's clothes. The youngest shows courage, travels onward,
    rescues serpent young from a burning plain, and receives aid from their spirit
    mother. With instructed horses and magical procedures she brings away a guarded
    maiden, retrieves a locked box, captures sea buffalo, is transformed into a man
    by a buffalo curse, survives the sequence of tasks indirectly, and marries the
    bride after the Chan's son dies in a hot milk ordeal.
  language: English
  quote_policy: summarized
