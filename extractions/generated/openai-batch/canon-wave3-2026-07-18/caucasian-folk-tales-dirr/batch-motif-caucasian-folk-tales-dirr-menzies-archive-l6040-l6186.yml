- id: motif:7
  label: impossible bride-tasks before marriage
  taxonomy_refs:
  - mystical_quest
  basis: The bride refuses marriage until the locked box is retrieved and the sea
    buffalo and their milk are brought for the ordeal.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The tasks are clear in the passage, while the taxonomy label remains general.
- id: motif:8
  label: magical access to hidden object
  taxonomy_refs:
  - forbidden_knowledge
  basis: The heroine is told how to enter a house undisturbed and use a little stick
    so doors and dog-skin open, allowing retrieval of a seven-locked box from a secret
    room.
  evidence_refs:
  - ev:5
  confidence: low
  cautions: The passage presents a secret object and magical access, but it does not
    explicitly frame the box as forbidden knowledge.
- id: motif:9
  label: gender transformation by animal curse
  taxonomy_refs:
  - shapeshifter
  basis: The buffalo curses whoever drives the sea buffalo out so that men become
    women and women become men; the heroine immediately changes into a man.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The transformation is curse-induced sex change rather than voluntary shapeshifting.
- id: motif:10
