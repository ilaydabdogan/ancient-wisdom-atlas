canonical_text:
  quote: ''
  summary: In one animal fable, a fox lures a partridge down from a tree by false
    speech and an oath, seizes it, but the partridge escapes by persuading the fox
    to open his jaws to recite a religious formula. The fox later feigns illness,
    is attacked by hounds, loses his tail, and laments that the partridge has outwitted
    him. In the next fable’s opening, a shepherd loses a kid, a lamb, and a calf;
    nearby bear, wolf, and fox send the fox to ask them for meat, but the kid’s intimidating
    reply frightens the fox away while the wolf later approaches.
  language: English
  quote_policy: summarized
