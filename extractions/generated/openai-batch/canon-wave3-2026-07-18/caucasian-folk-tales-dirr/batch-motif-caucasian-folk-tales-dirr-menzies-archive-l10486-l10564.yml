canonical_text:
  quote: ''
  summary: 'In an Udian variant of a Rustum saga, a witch advises the king to send
    Rustum against a white Div. The Div requires a forty-day fast before fighting,
    which weakens Rustum, but Rustum returns after farewelling his mother and kills
    the Div in combat. Later, Rustum leaves the king’s house and recruits three extraordinary
    men: one carrying a nut-tree to shade reapers, one grinding corn with millstones
    bound to his feet, and one drinking river water away. The four build a hut in
    a wood and take turns cooking while others hunt. An Adschdaha overpowers the first
    cook with a moustache hair and eats the pilaw; the same happens to the second
    cook, and the third day begins with the water-drinker’s turn.'
  language: English
  quote_policy: summarized
