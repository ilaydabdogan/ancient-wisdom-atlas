literal_observations:
- id: obs:1
  text: A badger tells a wolf that the wolf’s forefathers threw badgers three times
    up the road and three times down the road before eating them; when the wolf imitates
    this, the badger escapes into his hole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wolf offers the badger friendship, a mattress, pillow, and red silk coverlet;
    the badger interprets these as his own flesh, severed head, and bloodstained skin,
    and refuses to come out.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grey wolf dies of rage after failing to deceive the badger.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a separate tale, the fire goes out in the house of a bear, wolf, and pig,
    and they send members of their group to request fire from neighboring animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The neighboring lamb, kid, and hen are frightened, but the lamb answers each
    visitor and claims they possess meat from the visitor’s species.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The lamb repeatedly says that the kid with two horns obtains wolf-meat, bear-meat,
    and pork for them.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The bear, wolf, and pig spy on the neighboring animals and interpret the kid,
    lamb, and hen as threatening watchers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Both groups flee; the kid slips down from a rock, the lamb cries out for him
    to tackle one enemy, and the bear, wolf, and pig flee and fall over a precipice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In another tale, a wolf, fox, and camel swear friendship, agree to share spoil
    equally, and find a small loaf.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Because the loaf is too small for equal division, the animals agree that the
    eldest should have it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wolf claims to be the only wolf invited by Noah into the Ark and says
    all other wolves drowned in the Flood.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The fox claims to have been created by God before the wolf was born and says
    Adam and Eve stroked his back; he also claims he lay at Noah’s feet in the Ark.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The camel, unable to establish his age verbally, seizes the loaf, raises his
