  summary: 'The passage contains animal-fable episodes: a badger escapes a wolf by
    inventing an ancestral eating custom; weak animals frighten stronger neighboring
    animals who come seeking fire; and a wolf, fox, and camel dispute who is oldest
    in order to claim a loaf, until the camel simply eats it.'
