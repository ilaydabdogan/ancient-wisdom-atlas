canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a faithful servant descends into
    an underground Divs' pit, kills seven Divs, rescues three maidens and treasure,
    later provides blood and Div ears as remedies for the prince's father and sister,
    and dies as a grave closes over him; the youngest prince then becomes king. It
    then begins another tale in which a blind king sends his son to catch the horned
    Red Fish whose blood is said to restore sight, but the son and fishermen release
    it, leading to the son's banishment and his mother's advice about choosing a companion.
  language: English
  quote_policy: summarized
