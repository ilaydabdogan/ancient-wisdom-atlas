canonical_text:
  quote: ''
  summary: The hero kills a three-headed dragon threatening giant young eagles in
    a tree. The mother eagle offers kinship and a wish, then carries him toward Balai
    and Boti despite warning that no one returns from them. At their heaven-reaching
    tower, Balai receives the hero, mistreats his half-petrified wife after a meal,
    and begins explaining his suspicion of her secret nocturnal departure using a
    horse of the winds, while he follows on a horse of the clouds.
  language: English
  quote_policy: summarized
