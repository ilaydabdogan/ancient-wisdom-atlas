canonical_text:
  quote: ''
  summary: 'The passage closes a Tatar variant in which Djanabbas risks petrification,
    fires a gun, kills a thing from the heavens, and returns home; Rustumsal''s return
    makes invading giants flee, and he later transfers rule to Siilfager. The passage
    then begins a Georgian variant under the heading Prometheus Sagas: Rustum displays
    extraordinary strength over giants, marries a maiden encountered while hunting
    after sparing her stag, foretells a son named Amiran, and Amiran is later christened
    by Jesus before departing to seek his father.'
  language: English
  quote_policy: summarized
