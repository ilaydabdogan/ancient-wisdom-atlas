canonical_text:
  quote: ''
  summary: The youngest princess cannot find the man she seeks until the king summons
    Sachwatho, the bald-headed gooseherd. After he frightens her with a hare in his
    pocket, the king orders her to shut her eyes and sit on his knee, completing the
    marriage choice. The king gives the older daughters and their husbands wealth
    and houses, but gives the youngest and the gooseherd only a hen-house. Later the
    king, lacking a son, tests his sons-in-law by sending them to obtain a curative
    calf liver from a living hind. Sachwatho rides out in lowly guise, then summons
    his good horse with horse hair, puts on golden garments, captures a mother-hind,
    and bargains with the vizier and high steward for the tips of their little fingers.
  language: English
  quote_policy: summarized
