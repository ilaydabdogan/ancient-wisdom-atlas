canonical_text:
  quote: ''
  summary: After people drink excessively at a well and some die, the king’s daughter
    returns home. Her father seeks the unknown deliverer, and messengers bring the
    youth to the king. The youth has hidden a hare in his breast-pocket; its ears
    frighten the king’s daughter, but she is told to sit beside him. The king honors
    the youth, who refuses marriage and asks only to return home. The king cannot
    send him home but directs him to a falcon’s nest harried by an eagle. The king’s
    son kills the eagle with an arrow, and the young falcons take him into their nest,
    fondle him, and let him sleep there before the mother falcon returns.
  language: English
  quote_policy: summarized
