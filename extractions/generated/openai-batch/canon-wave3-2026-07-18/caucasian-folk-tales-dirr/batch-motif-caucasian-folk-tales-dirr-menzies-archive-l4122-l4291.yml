canonical_text:
  quote: ''
  summary: 'In the close of “Bukutschichan,” the fox runs ahead of the newly married
    Bukutschichan and his wife, frightens the dragon’s servants into naming Bukutschichan
    as owner of the dragon’s livestock, fields, and palace, then deceives the dragon
    into hiding in a hay-stack and burns him. Bukutschichan and his bride arrive to
    find the estate attributed to him. Later the fox tests Bukutschichan by pretending
    to be dead, then eventually dies for real and is rolled into a kurdjuk. The passage
    then begins “Balai and Boti”: after a king’s death, the eldest son sets out to
    seek a southern king’s daughter who will marry only the man who defeats her in
    single combat; he rejects an old man’s counsel and arrives at the king’s town
    to issue his challenge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bukutschichan marries the chan’s daughter, and the couple leaves with a large
    wedding escort including riders, pedestrians, musicians, singers, youths, maidens,
    and other people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fox says he will hurry ahead to get the house ready and runs on before
    the wedding party.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fox encounters a herd belonging to the dragon and tells the shepherd to
    say the cattle belong to Bukutschichan, warning that an army of seven kings is
    coming to kill the dragon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fox repeats the same warning and ownership instruction at the dragon’s
    horses, sheep, and harvesters.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the dragon’s palace, the fox warns the dragon that an army with cannons,
    mortars, guns, powder, and lead is approaching.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dragon asks the fox for a hiding place, and the fox points him to a mountainous
    hay-stack in the court.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: After the dragon hides in the hay-stack, the fox sets it alight at all four
    corners, and the dragon is burned in the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: As Bukutschichan’s procession passes the cattle, horses, sheep, fields, and
    meadows, people repeatedly answer that they belong to Bukutschichan.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The retinue is astonished at Bukutschichan’s apparent riches, while Bukutschichan
    does not understand how the situation has arisen.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fox sends back the couple’s retinue, settles Bukutschichan and his wife
    upstairs in the dragon’s castle, lives below, and takes burdens on himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The fox pretends to be dead in the court in order to learn what Bukutschichan
    thinks of him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bukutschichan says he would not care if the fox were dead and calls him a
    useless creature.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The fox springs up and sings of earlier events involving Lause-Hadschi, a
    wooden gun, a miller in difficulty, begging, and the fox’s forgiveness.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: When the fox later really dies, Bukutschichan thinks it is another trick and
    rolls him up in a kurdjuk, where the fox is said still to remain.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: In the next tale, after a king’s death, the eldest of three sons sets out
    to court a southern king’s daughter who has vowed to marry only a man who can
    overcome her in single combat.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: On the journey, an old man asks whether the young man values the maiden or
    the counsel of old age more; the young man chooses the maiden and rejects the
    counsel.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: At the town of the southern king, the eldest brother is received by royal
    attendants and a vizier, and he states that he wants to measure his strength against
    the king’s daughter.
  category: action
  evidence_refs:
  - ev:13
