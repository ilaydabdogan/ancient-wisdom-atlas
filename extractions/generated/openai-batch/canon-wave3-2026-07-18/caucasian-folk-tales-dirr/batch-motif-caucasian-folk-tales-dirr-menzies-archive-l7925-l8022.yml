canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a youth is questioned about the rightful
    claimant to a crafted maiden who received a soul through prayer; the maiden corrects
    the judgment, claims the youth as bridegroom, and her father the Chan accepts
    him. The youth later returns to his mother, recovers the gold spent to fulfill
    his father's wish, travels by Djinn to his father's former place, becomes Chan,
    receives a son from God, and praises God. The passage then begins an animal fable
    in which a foal, goat, and pig frighten wolves first by their combined cries and
    then by wolves' fearful misinterpretation of their ordinary habits.
  language: English
  quote_policy: summarized
