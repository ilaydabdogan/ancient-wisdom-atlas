- id: motif:3
  label: bride won through recognition and sanctioned by ruler-father
  taxonomy_refs:
  - royal_legitimacy
  basis: After the youth claims the maiden and she names him bridegroom, the Chan
    accepts him as son-in-law, arranges a wedding, and offers that he will be Chan
    after the ruler's death.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage contains marriage and a succession offer, but the youth does
    not remain to inherit this Chan's position.
- id: motif:4
  label: filial duty rewarded by return, restored wealth, rulership, and offspring
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: The youth returns to his mother, receives the gold spent fulfilling his father's
    last wish, goes to his father's former place, becomes Chan, receives a son, and
    thanks God for the reward.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The causal link is expressed in the youth's thanksgiving; details of the
    father's last wish are outside this passage.
- id: motif:5
  label: weak animal companions frighten predators with collective noise
  taxonomy_refs: []
  basis: The foal, goat, and pig make a combined noise at the wolves' banquet, and
    the wolves become frightened and run away.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No exact available taxonomy reference for this animal-fable pattern is
    supplied.
- id: motif:6
  label: predators misinterpret harmless behavior as threatening action
  taxonomy_refs: []
  basis: The wolves interpret the goat's chewing, pig's rooting, and foal's tail-sweeping
    as preparations to beat, seek, or strike wolves, and therefore do not approach.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The threatening interpretation is attributed to the wolves, not to the
    stated intentions of the foal, goat, and pig.
