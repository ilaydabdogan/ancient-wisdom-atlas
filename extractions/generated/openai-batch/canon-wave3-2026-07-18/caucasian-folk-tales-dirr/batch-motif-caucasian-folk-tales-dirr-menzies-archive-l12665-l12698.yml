canonical_text:
  quote: ''
  summary: 'The passage opens the tale of Peter, son of the deceased thief Iwane and
    nephew of the thief Simon. Peter asks to learn his father’s trade. Simon sets
    him a test: remove a feather from a bird on a tree without the bird noticing.
    Simon demonstrates by taking a feather from a dove, but Peter meanwhile removes
    Simon’s underclothing without Simon noticing. Astonished, Simon proposes that
    Peter steal money from the king’s treasury; they break in at night and take much
    money. The theft is noticed, the thief is not found, and the king is indignant.'
  language: English
  quote_policy: summarized
