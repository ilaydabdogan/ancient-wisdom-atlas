canonical_text:
  quote: ''
  summary: 'A fragment first mentions a woman begging flour and baking bread for her
    husband. In the beginning of “Rich Man and Poor Man,” a rich man and a poor man
    hunt unsuccessfully together. The rich man withholds food, demands one of the
    poor man’s eyes in exchange for bread, and then drives him away. The poor man
    finds an empty house near a hill and hides in the rafters. A wolf, bear, and fox
    enter and reveal their possessions or powers: a food-producing gold cloth, a pit
    of gold, and a healing tree. After the animals leave, the poor man takes the cloth
    and money, rubs his injured eye-place on the tree, regains sight, and encounters
    a shepherd before the passage breaks off.'
  language: English
  quote_policy: summarized
