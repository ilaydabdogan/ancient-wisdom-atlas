canonical_text:
  quote: ''
  summary: A vizier tells the guest to appear in the square at daybreak, where he
    will find the princess. The vizier warns that the guest may conquer her if fortunate,
    but if she defeats him his head will be cut off and displayed on a pole. The guest
    is unhappy and sleepless, but arrives at his station the next morning. At sunrise,
    as the sun rises from the sea, the princess arrives in armor shining brighter
    than the morning sun and steps forward.
