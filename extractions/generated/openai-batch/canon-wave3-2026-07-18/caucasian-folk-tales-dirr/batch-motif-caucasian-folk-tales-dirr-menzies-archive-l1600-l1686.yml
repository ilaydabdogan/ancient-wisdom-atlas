canonical_text:
  quote: ''
  summary: A father and son travel home. The son repeatedly transforms into valuable
    hunting animals so his father can sell him to nobles, then changes back and escapes.
    After gaining money as a hound and a falcon, the son transforms into a horse and
    warns his father not to sell him to a man with glistening eyes and to remove the
    bridle first. The father sells the horse, including the bridle, to the man with
    glistening eyes, who is pleased that his pupil has fallen into his hands again.
    The pupil is shut in a dark room and becomes sad and ill while seeking escape.
  language: English
  quote_policy: summarized
