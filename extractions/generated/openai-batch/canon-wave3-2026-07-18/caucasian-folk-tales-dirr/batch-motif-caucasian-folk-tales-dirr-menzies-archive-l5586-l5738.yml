canonical_text:
  quote: ''
  summary: The passage first describes the king’s son and Sartanki fleeing together,
    the bride’s father pursuing with an army, the prince returning home after being
    believed dead, and the conflict being resolved through a recognized marriage.
    It then begins a tale about Mariat of Tiflis, whose father promises her to whoever
    can provide a special work of art; three suitors with extraordinary abilities
    cooperate to locate and rescue her from a djinn stronghold on an island in the
    Black Sea, then quarrel over which of them deserves her.
  language: English
  quote_policy: summarized
