candidate_motifs:
- id: motif:1
  label: consensual elopement from a resistant father
  taxonomy_refs:
  - departure
  - stolen_beloved
  basis: The king’s son predicts refusal, the princess agrees to flee, and the father
    interprets the loss as a kidnapping requiring armed recovery.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The princess’s departure is voluntary, so the “stolen beloved” taxonomy
    is only a partial fit from the father’s perspective.
- id: motif:2
  label: armed pursuit resolved by recognized marriage
  taxonomy_refs:
  - royal_legitimacy
  basis: The bride’s father approaches with an army, but the prince’s father asserts
    that the marriage has been performed according to Islam; the hostile father becomes
    a guest and leaves peacefully.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents a social and legal resolution rather than a fully
    mythic royal-legitimacy episode.
- id: motif:3
  label: return of a son believed dead
  taxonomy_refs:
  - return
  basis: The prince is said to have died in foreign lands, yet he returns alive and
    sends a messenger to announce the news to his father.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not describe actual death or resurrection, only a false
    report of death.
- id: motif:4
  label: bride contest requiring extraordinary skill or artefact
  taxonomy_refs: []
  basis: Mariat’s father will give her only to a man who can produce a special work
