canonical_text:
  quote: "“duty calls me, I must avenge my father.”"
  summary: Etsemej pressures his mother to reveal who killed his father and where
    his father’s armour and horse are kept. She names Kuba as the killer, says Etsemej’s
    aunt has gone with an army to avenge the death, and identifies the hidden armour
    and charger behind an iron door in the tower. Etsemej takes charge of the dangerous,
    long-confined horse, says farewell to his weeping mother, rides away to avenge
    his father, subdues the horse, and later camps in a dark wood after hunting animals
    for food and skins.
  language: English
  quote_policy: quoted
