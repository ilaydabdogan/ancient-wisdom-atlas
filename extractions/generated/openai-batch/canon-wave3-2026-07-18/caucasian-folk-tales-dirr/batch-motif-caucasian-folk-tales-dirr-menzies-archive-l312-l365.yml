canonical_text:
  quote: ''
  summary: The introduction recounts a 1904 fieldwork episode in Thuschetia, where
    Georgian literacy and bilingualism complicated the collection of Batsian material.
    A very old man dictated tales that seemed familiar, including a Tell story; he
    later recalled reading it in a Georgian school reader. The editor then suggests
    that The Beautiful Helena may have reached the Kabardians through direct or indirect
    contact with Grecian colonies, while a cited commentator leaves the question of
    origin or borrowing unresolved. The passage also explains the collection’s broad
    genre scope, literal translation policy, and limited source notes.
  language: English
  quote_policy: summarized
