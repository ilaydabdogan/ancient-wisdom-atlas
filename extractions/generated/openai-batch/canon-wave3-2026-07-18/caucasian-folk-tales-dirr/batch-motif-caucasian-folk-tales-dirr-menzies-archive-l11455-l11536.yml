canonical_text:
  quote: "“a rain of fire fell down”"
  summary: After Djanabbas marries a maiden who accepts marriage only after being
    conquered, Rustumsal leads his sons toward the land and fortress of the Djinns
    despite warnings from Djanabbas’ wife. The party falls under a bad spell near
    the Djinn fortress, where other men have been turned to stone. Djanabbas’ wife
    arrives, consults her Book of Spells, produces fiery and watery phenomena, and
    frees them. She then identifies a speck in the heavens that must be killed by
    cannon fire, warning that missed shots will progressively turn the shooter to
    stone; Djanabbas misses his first shot and his feet become stone.
  language: English
  quote_policy: quoted
