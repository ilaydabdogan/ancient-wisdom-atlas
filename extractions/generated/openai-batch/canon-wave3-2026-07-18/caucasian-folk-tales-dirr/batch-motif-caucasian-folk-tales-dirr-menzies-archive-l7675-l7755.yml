canonical_text:
  quote: ''
  summary: 'The passage closes a preceding tale with John being presented as a bridegroom,
    prepared by bathing and new garments, and married in a seven-day celebration.
    It then begins “The Faithful Son”: a widowed merchant who has taken a Djinn woman
    as lover dies after commanding his son to place pilaw nightly in a stable corner.
    The son obeys until his wealth is exhausted, then watches and follows the woman
    who takes the dish into a Djinn-inhabited place. There he is received in a splendid
    castle by a Djinn woman who calls him her son and explains that his two brothers
    are there. She shows him a heap of gold equal to the money spent on pilaw and
    says it belongs to him.'
  language: English
  quote_policy: summarized
