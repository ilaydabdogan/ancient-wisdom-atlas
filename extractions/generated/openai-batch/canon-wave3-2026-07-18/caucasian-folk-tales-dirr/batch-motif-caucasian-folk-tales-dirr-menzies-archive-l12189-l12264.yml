canonical_text:
  quote: ''
  summary: A first-person narrator describes being trapped with his brothers in a
    one-eyed giant's stone animal house. The giant eats sheep and then the brothers
    one by one. The two remaining brothers blind him with a heated roasting-spit,
    escape by wearing sheep skins as the herd passes out, take animals to their ship,
    flee by sea, identify themselves to the giant from beyond his reach, nearly sink
    under his blows, and eventually return home.
  language: English
  quote_policy: summarized
