canonical_text:
  quote: ''
  summary: A king sets a bride-winning water-fetching contest with lethal stakes.
    The king's messenger drugs the Dreamer's fast companion, but the archer detects
    the problem and wakes him with an arrow; the helper fetches the water and overtakes
    the messenger. The king permits the betrothal, then secretly orders poisoned food
    for the stranger guests; another companion overhears and a plate-switching companion
    reverses the plot. The king next demands someone carry the dowry; the priest who
    carries his church bears it all away. Years later, the Dreamer returns home, seats
    his two wives beside his throne, and points to them and his son as the Sun, Moon,
    and twinkling star.
  language: English
  quote_policy: summarized
