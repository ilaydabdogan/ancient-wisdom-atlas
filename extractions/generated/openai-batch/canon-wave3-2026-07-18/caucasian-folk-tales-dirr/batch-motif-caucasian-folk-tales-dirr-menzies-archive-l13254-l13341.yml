canonical_text:
  quote: ''
  summary: The passage contains the end of a comic episode in which the result of
    Aqsaqal's wisdom is a collapsing roof that buries onlookers; the tale of two Lahitsch
    brothers who sow salt, see no crop, blame flies, and shoot at them; and the beginning
    of a tale in which three Lahitsch villagers learn only one Tatar word each, answer
    a policeman's questions with those words, and are imprisoned after appearing to
    confess to killing a man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After people wait to see the result of Aqsaqal's wisdom, a post sways, part
    of a roof falls, and half the onlookers are buried.
