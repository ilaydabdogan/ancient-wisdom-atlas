  evidence_refs:
  - ev:1
- id: obs:2
  text: Lahitsch is described as a mountain village far from any town whose villagers
    often need various goods, especially salt.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two brothers decide to sow salt so they will not need to go to town for it
    and might be able to sell it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In spring the field sown with salt is black and bare while surrounding fields
    are green and fertile.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brothers suspect someone has stolen the salt, find a swarm of flies on
    the saltish ground, and say the flies have eaten it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brothers shoot at the flies until tired; later one fly lands on one brother's
    brow, and the other brother shoots the fly dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Three Lahitsch villagers go to Schemache to learn Tatar but return after
    each has learned only one word: ''we,'' ''owe,'' and ''three kreutzers.'''
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the road the three villagers find a dead body and stand around it; a mounted
    policeman sees them and suspects them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the policeman questions them in Tatar, the villagers answer with their
    learned words, making it sound as if they killed the man over a debt of three
    kreutzers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The policeman binds the three villagers and takes them to the Chan, who has
    them put in prison after they repeat the same answers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Chan later reflects that it seems impossible for murderers to confess
