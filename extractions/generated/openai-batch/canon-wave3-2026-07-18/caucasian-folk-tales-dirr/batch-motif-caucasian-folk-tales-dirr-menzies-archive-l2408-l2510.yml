canonical_text:
  quote: ''
  summary: The prince visits Paradise-Rose at night and questions her about her bedding
    and their son’s cradle. After the nurse and vizier report the event, the king
    arranges a richer bed and golden cradle and hides nearby with courtiers to seize
    the prince and cure his spell. The prince enters when told the child is ill, is
    seized, is joyfully recognized by his parents, but dies at dawn and cannot be
    awakened by healers. The queen then travels toward her sister, who is married
    to the sun, to seek advice; along the way a foreign king and a man in a red-hot
    oven ask her to carry their troubles to the sun, and she sees a stag whose horns
    are locked in the heavens.
  language: English
  quote_policy: summarized
