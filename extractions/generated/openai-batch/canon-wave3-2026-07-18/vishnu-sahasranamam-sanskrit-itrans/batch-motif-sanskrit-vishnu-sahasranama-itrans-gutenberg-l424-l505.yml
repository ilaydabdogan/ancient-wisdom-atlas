canonical_text:
  quote: ''
  summary: A concluding section of the Vishnu Sahasranama lists epithets of Vishnu,
    including sacrificial and weapon-bearing names, invokes Narayana/Vishnu/Vasudeva
    for protection, states that the thousand divine names of Keshava have been proclaimed,
    and describes the benefits of hearing, reciting, studying, and worshiping the
    hymn. It also states that beings, worlds, disciplines, scriptures, and knowledge
    arise from Narayana/Janardana and that Vishnu pervades the three worlds.
  language: Sanskrit
  quote_policy: summarized
