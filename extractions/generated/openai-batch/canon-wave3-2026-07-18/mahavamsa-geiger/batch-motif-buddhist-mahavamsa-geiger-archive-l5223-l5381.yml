canonical_text:
  quote: Of this race of Mahasammata, thus succeeding, was born, in unbroken line,
    the Great Sage
  summary: The passage gives a royal genealogy from Mahasammata through Okkaka and
    the Sakya kings to Suddhodana, Maya, and Siddhattha. It then relates Siddhattha's
    kinship ties, friendship with Bimbisara, departure from his father's house, six
    years of striving, attainment of wisdom, later preaching, Ajatasattu's patricidal
    succession, the Buddha's nibbana, and a closing reflection on impermanence.
