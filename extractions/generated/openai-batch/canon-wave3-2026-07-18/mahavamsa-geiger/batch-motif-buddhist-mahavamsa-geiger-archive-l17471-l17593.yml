canonical_text:
  quote: ''
  summary: The passage recounts King Vasabha's Buddhist and civic works, including
    a thupa-temple, almsgiving, tanks, canals, fortifications, and festivals. It then
    narrates how Subharaja's daughter was hidden with a brick-worker, gave food to
    a thera in nirodha in a flowering kadamba thicket, received a prophecy of future
    royal rank, was later recognized by royal tokens and married to Vasabha's son,
    and how she and her descendants founded religious buildings at the remembered
    place.
  language: English
  quote_policy: summarized
