  quote: ''
  summary: The passage lists named parivenas and related monastic structures at the
    Mahavihara, explaining that their names derive from places connected with the
    thera Mahinda's bathing or purification, walking, meditation, seated posture,
    and visitation by hosts of gods. It also records a small pillared pasada built
    for the thera by the commander Dighasandana, and states that the wise king whose
    name contains 'beloved of the gods' patronized Mahinda and first built the Mahavihara
    in Lanka.
