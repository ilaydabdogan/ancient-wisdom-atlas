  summary: A dispute between two brothers is ended in the presence of the Buddhist
    brotherhood. The brotherhood acknowledges guilt and penance; the king gives food
    to the brotherhood, calls his brother, sits and eats with him among them, then
    sends the brother to direct harvest work. The chapter closes with a moral reflection
    that pious men appease even great enmity.
