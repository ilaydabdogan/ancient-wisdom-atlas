canonical_text:
  quote: ''
  summary: 'The passage recounts the preservation and destined transfer of a portion
    of the Buddha''s relics: Dhammasoka is prevented from taking the Ramagama dona
    because it is destined for the Great Thupa; after a flood destroys a riverside
    thupa, the relic urn reaches the ocean, is taken by nagas to Kalanaga''s palace,
    and is worshipped there. The brotherhood then directs that the relics be brought
    for enshrinement. A king announces the enshrining, adorns the city, receives divine
    assistance from Sakka and Vissakamma, provides gifts at the gates, and proceeds
    in a lavish procession toward Mahameghavana while Sonuttara hears the music from
    his cell.'
  language: English
  quote_policy: summarized
