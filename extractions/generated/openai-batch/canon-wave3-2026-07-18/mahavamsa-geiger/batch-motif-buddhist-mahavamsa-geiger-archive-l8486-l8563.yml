canonical_text:
  quote: ''
  summary: The passage describes Pandukabhaya assigning candala workers to sanitation
    and mortuary duties, building settlements and institutions around the cemetery,
    providing residences for ascetics and religious groups, establishing village boundaries
    across Lanka ten years after his consecration, enjoying fortune with visible and
    supernatural companions, and reigning seventy years in Anuradhapura.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pandukabhaya assigned five hundred candalas to clean the town streets, two
    hundred to clean sewers, one hundred and fifty to bear the dead, and the same
    number to watch the cemetery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He built a village northwest of the cemetery for the candalas, and they continually
    carried out the appointed duties.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He made a cemetery called the Lower Cemetery northeast of the candala-village
    for the candala folk.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Huts for huntsmen were built north of the Lower Cemetery between it and the
    Pasana-mountain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A hermitage for many ascetics was made northward as far as the Gamani-tank.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Pandukabhaya built a house for the nigantha Jotiya, and the nigantha Giri
    and many ascetics of various heretical sects dwelt in the same region.
  category: action
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:7
  text: He built a chapel for the nigantha Kumbhanda, and five hundred families of
    heretical beliefs lived west from that area and east of the huntsmen's street.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:8
  text: He also built a monastery for wandering mendicant monks, a dwelling for ajivakas,
    a residence for brahmans, a lying-in shelter, and a hall for those recovering
    from sickness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ten years after his consecration, Pandukabhaya established village boundaries
    over the whole island of Lanka.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kalavela and Cittaraja were visible in bodily form while Pandukabhaya enjoyed
