canonical_text:
  quote: ''
  summary: The king leaves the Mahameghavanarama for his palace. Over several days
    the thera eats in the king's house, preaches in the Nandana-grove, and brings
    large numbers of people to conversion. The king ceremonially adorns the city and
    road, approaches the arama with a royal retinue, pays respect to the theras, and
    ploughs a circular furrow beginning and ending at the Kadamba-river ford. The
    great thera fixes boundaries for monastic areas, after which the earth quakes.
    The Nandana-grove is renamed Jotivana because the doctrine shone there. The king
    orders monastic buildings, including a residence for the thera, a building for
    the Bodhi-tree, the Lohapasada, a salaka-house, a refectory, parivenas, bathing-tanks,
    and buildings for repose.
  language: English
  quote_policy: summarized
