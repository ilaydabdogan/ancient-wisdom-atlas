canonical_text:
  quote: ''
  summary: A note explains doctrinal categories of pariyatti, patipatti, and pativedha.
    The narrative then recounts Mahinda's passing into nibbana on Cetiya-mountain,
    King Uttiya's mourning, royal funerary procession, week of offerings, cremation,
    relic collection, and the building of cetiyas and thupas. The cremation place
    becomes an honored site for later cremations of holy men. The passage also recounts
    Samghamitta's passing into nibbana, her week of honors, cremation near the Great
    Bodhi-tree, and the building of a thupa there.
  language: English
  quote_policy: summarized
