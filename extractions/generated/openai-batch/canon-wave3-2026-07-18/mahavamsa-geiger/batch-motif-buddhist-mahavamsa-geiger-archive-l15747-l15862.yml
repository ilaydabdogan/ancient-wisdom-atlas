canonical_text:
  quote: ''
  summary: The passage opens Chapter XXXII. Before the cetiya's final chatta and plaster-work
    are finished, the king becomes mortally ill and asks his younger brother Tissa
    to complete the thupa. Tissa covers and decorates it with temporary and painted
    elements, then tells the king the work is complete. The king is carried to the
    monument, pays homage, and lies where he can behold the Great Thupa and the Lohapasada.
    A vast assembly of bhikkhus recites. The king notices the absence of the thera
    Theraputtabhaya, thinks of him as a former battle-companion, and frames his illness
    as a battle with death. The thera, dwelling near the Karinda-river source on Panjali-mountain,
    knows the king's thought and arrives through the air with five hundred liberated
    bhikkhus. He counsels the king not to fear, teaches impermanence, and recalls
    the king's love for the true doctrine, renunciation of heavenly bliss, return
    to this world, and works of merit.
  language: English with Pali/Sanskrit transliterated terms in notes
  quote_policy: summarized
