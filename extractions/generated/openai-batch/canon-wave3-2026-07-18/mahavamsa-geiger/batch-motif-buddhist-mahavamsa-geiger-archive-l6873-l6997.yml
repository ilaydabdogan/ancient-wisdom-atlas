canonical_text:
  quote: ''
  summary: A vast monastic assembly performs a miracle called the unveiling of the
    world to convert King Asoka, who is contrasted as formerly wicked Candasoka and
    later pious Dhammasoka. The king asks about his generosity and whether he is a
    kinsman of the Buddha's religion. Moggaliputta explains that wealth-giving alone
    is not religious kinship, but allowing a son or daughter to enter the order is.
    Asoka asks Mahinda and Samghamitta, who accept ordination; Mahinda later attains
    arahantship and special knowledge, while Samghamitta also becomes free from the
    asavas. They are described as lights of the doctrine who bless Lanka. A concluding
    origin notice tells of a forest-dweller and the wood-nymph Kunti, whose sons Tissa
    and Sumitta become ordained arahants with six supernormal powers.
  language: English
  quote_policy: summarized
