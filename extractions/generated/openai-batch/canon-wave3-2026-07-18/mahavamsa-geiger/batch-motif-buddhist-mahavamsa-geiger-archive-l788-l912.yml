canonical_text:
  quote: ''
  summary: The passage discusses evidence for Buddhist contact between continental
    India and Ceylon before Mahinda, the traditional concentration of the conversion
    story on Mahinda, Asoka's exhortation to Devanampiyatissa, inscriptions on relic
    urns and caskets that corroborate named missionaries and teachers, and monumental
    evidence interpreted as representing the transfer of a branch of the sacred Bodhi-tree
    to Ceylon. It also cautions that chronicle traditions may contain error and legendary
    elaboration.
