canonical_text:
  quote: ''
  summary: The passage opens the account of the levying of warriors by naming the
    elephant Kandula and ten great warriors. It then narrates Nandhimitta's unusual
    childhood strength, his attacks on Damilas who desecrated sacred memorials, the
    devas' disappearance of the bodies, his decision to serve Prince Gamani for the
    sake of the Buddha's doctrine, and the beginning of a levy in which Prince Dighabhaya
    demands one son from noble families and Nimila is introduced as another man of
    elephant-like strength.
  language: English
  quote_policy: summarized
