  summary: The passage describes the continuation of the Great Thupa after the brotherhood
    explains the sinking of the bricks, the miraculous procurement and arrangement
    of stones for the relic-chamber, and the king's placement of a jeweled bodhi-tree,
    ornaments, vases, a golden Buddha-image, divine attendants, thrones, a couch,
    and depictions of events from the Buddha's life within the relic-chamber.
