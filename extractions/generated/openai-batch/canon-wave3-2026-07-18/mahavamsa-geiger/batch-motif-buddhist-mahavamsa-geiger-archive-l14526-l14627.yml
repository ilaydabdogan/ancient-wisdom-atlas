canonical_text:
  quote: ''
  summary: 'A king begins the Great Thupa with a highly ordered consecration: silver
    and gold vases, garments, and eight bricks or foundation stones are arranged;
    the first stone is laid on the east side on fragrant clay; jasmine offerings are
    followed by an earthquake; the remaining stones are laid by ministers with ceremonies
    on the appointed uposatha day. The king honors arahant theras at the four quarters
    and greets Piyadassi, who preaches the doctrine, producing large-scale conversions
    and attainments. The chapter closes by exhorting those devoted to the Three Gems
    to cultivate virtues, noting the blessing brought by generous benefaction.'
  language: English
  quote_policy: summarized
