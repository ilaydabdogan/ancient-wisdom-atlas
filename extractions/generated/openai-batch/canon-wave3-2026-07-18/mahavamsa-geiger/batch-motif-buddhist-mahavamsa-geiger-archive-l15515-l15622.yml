candidate_motifs:
- id: motif:1
  label: Relics invested with royal authority
  taxonomy_refs:
  - royal_legitimacy
  basis: King Dutthagamani offers a parasol, consecrates his own kingly rank, and
    thrice confers the kingship of Lanka on the relics.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The motif is specific to the passage’s relic cult and royal ritual; the
    extraction does not infer broader political history beyond the passage.
- id: motif:2
  label: Sacred object enthroned with divine attendance
  taxonomy_refs: []
  basis: Sakka, gods, Brahma, celestial maidens, divine kings, musicians, guards,
    and bhikkhus attend the relics with regalia, offerings, music, perfumes, and song
    while the relics are placed in a casket on a throne.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family directly names this ceremonial enthronement
    pattern.
- id: motif:3
  label: Protective cosmic canopy against hostile forces
  taxonomy_refs: []
  basis: Indagutta creates a copper parasol as large as the universe to ward off Mara,
    while yakkha-chieftains guard against evil yakkhas.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage gives protective actions but does not elaborate a full conflict
    narrative.
- id: motif:4
  label: Miraculous ascent and self-opening of a relic casket
  taxonomy_refs:
  - ascent
  basis: The relic-casket rises from the king’s head, floats at a height of seven
    talas, and opens of itself before the relics emerge.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The ascent motif here applies to a sacred object rather than to a human
    or divine traveler.
- id: motif:5
  label: Relics manifesting Buddha form and performing a prior Buddha miracle
  taxonomy_refs: []
  basis: The relics take the form of the Buddha and perform the miracle of double
    appearances, explicitly compared to the Blessed One’s lifetime miracle at the
    foot of the gandamba-tree.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage frames this as a miracle of relics; it should not be generalized
    into resurrection without additional evidence.
- id: motif:6
  label: Vision of miracle produces spiritual attainment
  taxonomy_refs: []
  basis: After beholding the miracle, twelve kotis of devas and men attain arahantship,
    with others attaining the three other fruits.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage reports the effect but does not provide individual conversion
    narratives.
- id: motif:7
  label: Relic portion exchanged with treasure offerings
  taxonomy_refs:
  - sacred_exchange
  basis: The brotherhood leaves a few relics to the grieving nagas, who then rejoice
    and bring treasures as offerings.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not state a formal bargain; the exchange is sequential
    and devotional rather than contractual.
