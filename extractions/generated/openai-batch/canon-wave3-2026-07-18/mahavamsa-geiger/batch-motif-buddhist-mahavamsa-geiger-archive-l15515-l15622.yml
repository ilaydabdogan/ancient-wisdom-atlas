canonical_text:
  quote: ''
  summary: The passage describes lamenting nagas receiving a portion of relics and
    bringing treasure offerings; Sakka and other divine beings arranging a jewel pavilion,
    throne, and casket for the relics; a large divine and monastic ritual attendance;
    King Dutthagamani worshipping the relics and conferring the kingship of Lanka
    on them; and the relics miraculously rising, taking the form of the Buddha, performing
    the miracle of double appearances, and prompting many beings to attain spiritual
    fruits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The nagas lamented the carrying away of the relics, received a few relics
    from the brotherhood, and brought treasures as offerings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakka arrived with gods, bringing a jewel-set throne and a golden casket,
    and placed the relic urn in the casket on the throne within a jewel pavilion made
    by Vissakamma.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Divine beings and attendants held ceremonial objects including a parasol,
    yak-tail whisk, jewelled fan, shell with water, swords, baskets, lamps, and musical
    instruments.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yakkha-chieftains stood guard to ward off evil yakkhas, and the thera Indagutta
    created a copper parasol as large as the universe to ward off Mara.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: King Dutthagamani placed the relic casket on his head, set it upon a throne,
    stood with folded hands, and worshipped the relics with offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The king offered a parasol and three times conferred the kingship of Lanka
    on the relics.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king, surrounded by bhikkhus, circled the thupa three times toward the
    left, ascended it on the east side, and entered the relic-chamber.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The relic-casket rose from the king’s head, floated seven talas in the air,
    opened by itself, and the relics rose from it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The relics took the form of the Buddha, gleaming with the greater and lesser
    signs, and performed the miracle of double appearances.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Twelve kotis of devas and men attained arahantship after beholding the miracle,
    and others attained the three other fruits of salvation.
  category: sequence
  evidence_refs:
  - ev:7
