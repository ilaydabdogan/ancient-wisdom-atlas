canonical_text:
  quote: ''
  summary: The king greets the Buddhist brotherhood, secures their acceptance of alms
    for a week, gives lavish gifts, and begins preparations for the great thupa. He
    summons master-builders, accepts a shrewd builder’s durable method, and the builder,
    entered by Vissakamma, models the cetiya’s form from a water-bubble in a golden
    bowl. The king seeks to avoid burdening the people; gods bring bricks nightly
    to the four gates, and the king orders that all workers be paid with money, goods,
    food, flowers, and perfumes. A bhikkhu wishing to share in the building work secretly
    offers a prepared lump of clay, leading the king to identify him through an overseer
    and an offering of jasmine-blossoms at the sacred Bodhi-tree.
  language: English
  quote_policy: summarized
