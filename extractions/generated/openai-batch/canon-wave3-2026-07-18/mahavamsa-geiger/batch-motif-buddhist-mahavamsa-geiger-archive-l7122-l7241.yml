canonical_text:
  quote: ''
  summary: The passage recounts the king’s disturbance over a crime involving bhikkhus,
    the summoning of the thera Tissa son of Moggali, the thera’s arrival by ship on
    the Ganges, a controlled earthquake miracle, and the thera’s teaching that guilt
    does not result without evil intent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tissa, the king’s brother, sees a crime and sits near the minister; the minister
    then reports the matter to the king.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disturbed king asks the bhikkhu community who is guilty of the deed; some
    answer that the guilt is his, some say both are guilty, and the wise say he is
    not guilty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king asks whether a bhikkhu can set his doubts to rest and befriend religion;
    the brethren name the thera Tissa, son of Moggali.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king sends two successive delegations to bring the thera, first four theras
    and ministers and then eight, but the thera does not come.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The bhikkhus tell the king that the thera will come if asked to be their helper
    to befriend religion; when the message is delivered, the thera rises.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Because of the thera’s age and unwillingness to enter a wheeled vehicle, the
    king orders that he be brought by ship on the Ganges.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king goes knee-deep into the water and respectfully gives his right hand
    to the thera, who takes it from compassion and descends from the ship.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king leads the thera to the pleasure-garden Rativaddhana, washes and anoints
    his feet, and seats himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king asks to see a miracle and chooses an earthquake affecting a single
    region after hearing that it is more difficult than shaking the whole earth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Within a yojana the thera places a waggon, a horse, a man, and a vessel full
