  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The king asks whether he shares guilt for the murder of bhikkhus by the minister;
    the thera teaches that there is no resulting guilt without evil intent and recites
    the Tittira-jataka.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The thera remains for a week in the royal park and instructs the ruler in
