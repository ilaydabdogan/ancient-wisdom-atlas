canonical_text:
  quote: All this was the effect of Devanampiyatissa's merit.
  summary: The passage recounts Mutasiva's succession, his founding and rain-linked
    naming of the Mahameghavana garden, his long reign and children, and the accession
    of Devanampiyatissa. At Devanampiyatissa's consecration, treasures, jewels, unusual
    bamboo stems, and pearls appear in Lanka and are attributed to his merit. Devanampiyatissa
    sends these marvels and other precious objects as gifts to his unseen royal friend
    Dhammasoka in Pataliputta, whose court receives the embassy and rewards the envoys
    with offices.
  language: English
  quote_policy: quoted
