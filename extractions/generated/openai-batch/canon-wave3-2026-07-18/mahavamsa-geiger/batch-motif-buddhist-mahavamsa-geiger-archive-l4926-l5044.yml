canonical_text:
  quote: ''
  summary: The passage recounts Sarabhu obtaining the Buddha's collar-bone relic from
    the funeral pyre and enshrining it in Lanka, followed by later enlargements of
    the cetiya by Uddhaculabhaya and Dutthagamani. It then narrates the Buddha's visit
    from Jetavana to Nagadipa to avert a war between the naga kinsmen Mahodara and
    Culodara over a jewel throne. The deva Samiddhisumana accompanies him with a rajayatana-tree.
    Hovering above the battlefield, the Buddha creates darkness, then light, receives
    reverence, preaches concord, receives the surrendered throne, and establishes
    many snake-spirits in the refuges and moral precepts. Maniakkhika, a naga-king
    and prior convert, praises the Buddha's compassion and asks him to visit his country.
  language: English
  quote_policy: summarized
