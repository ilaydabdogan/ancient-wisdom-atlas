canonical_text:
  quote: ''
  summary: 'The passage describes imagery and ornamentation ordered for the relic-chamber:
    scenes from the Buddha''s descent from Tusita-heaven to the Bodhi-throne, celestial
    figures at the four quarters, devas with offerings and instruments, dhammacakkas,
    lit oil-pitchers, gems, gold, and lightning-like wall adornments. The thera Indagutta
    oversees the work, which is completed through the wondrous power of the king,
    devatas, and theras. A concluding reflection teaches that reverence to the Buddha''s
    relics brings merit equal to reverence to the living Buddha. The opening note
    also mentions the brahman Dona dividing the Buddha''s remains into eight parts
    to settle a dispute.'
  language: English
  quote_policy: summarized
