canonical_text:
  quote: ''
  summary: 'King Gamani resolves to build the Great Thupa after a gift ceremony for
    the Bodhi-tree, but worries that he cannot tax the people for bricks. Divine beings
    perceive this concern: Sakka orders Vissakamma to prepare bricks, and a local
    devata in iguana form leads a huntsman to discover them. Further materials appear
    in various directions from the city: gold, copper, precious stones, and silver.
    Villagers report these finds to the king. A merchant travelling near the cave
    where silver appears finds a large bread-fruit and intends to offer the first
    produce as alms, after which four theras arrive.'
  language: English
  quote_policy: summarized
