canonical_text:
  quote: a genuine historical reminiscence underlies the tradition
  summary: The passage surveys Northern and Southern Buddhist traditions about the
    Second and Third Councils, notes uncertainty over dates and places, identifies
    shared names and issues, and gives a critical historical interpretation of the
    Councils. It presents the First Council as an assembly of the Buddha's nearest
    disciples after his death to establish remembered rules of the Order, while treating
    later canonical elaborations with skepticism.
  language: English
  quote_policy: quoted
