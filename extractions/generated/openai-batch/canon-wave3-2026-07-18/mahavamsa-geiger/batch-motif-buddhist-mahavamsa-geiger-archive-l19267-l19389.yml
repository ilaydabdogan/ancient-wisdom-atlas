canonical_text:
  quote: ''
  summary: Appendix C reconstructs the campaigns of Pandukabhaya, describing his refuge
    from persecuting uncles, gathering of followers, indirect campaign through border
    districts, battles, river crossing, mountain bases, decisive victory, capture
    of the capital, assumption of sole sovereignty, and a limited route comparison
    with Dutthagamani's campaign.
  language: English
  quote_policy: summarized
