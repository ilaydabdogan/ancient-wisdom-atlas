canonical_text:
  quote: "“think on all those works of merit accomplished by thee”"
  summary: A thera urges the king to recollect his meritorious works. The king has
    a book of meritorious deeds brought and read aloud, and the scribe and king recount
    religious buildings, offerings to theras and monastic communities, festivals,
    robe-giving, lamp offerings, medical and food distributions, and support for preaching
    the doctrine.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A thera tells the king to think on all his works of merit and says that all
    will be well with him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is glad at heart after hearing the thera’s words and says that the
    thera is his help even in single combat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king commands that the book of meritorious deeds be brought, and he orders
    the scribe to read it aloud.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The book records that the king built ninety-nine viharas, the Maricavatti-vihara,
    the Lohapasada, and valuable works for the Great Thupa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The book records that, during a famine in the mountain-region called Kotta,
    the king gave two precious ear-rings, from which sour millet-gruel was obtained
    and offered to five great theras.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The book records that, while fleeing after defeat in battle, the king gave
    food from his bowl to the ascetic Tissa, who came through the air.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king says he arranged great and costly almsgiving to the great community
    of both sexes from the four quarters during major consecration and relic-enshrining
    occasions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king says he held twenty-four Vesakha festivals and three times gave the
    three garments to the brotherhood of the island.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king says he five times bestowed the rank of ruler of the island upon
    the doctrine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The king says he kept a thousand lamps with oil and white wicks burning perpetually
    in twelve places as an offering to the Blessed Buddha.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The king says he provided sick foods and remedies in eighteen places and various
    rice-foods, cakes, ordinary rice, and lamp oil in numerous places.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The king says he heard that a gift of doctrine is greater than a gift of worldly
    wealth, attempted to preach the Mangalasutta before the brotherhood, then commanded
    preaching throughout Lanka and rewarded preachers.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
