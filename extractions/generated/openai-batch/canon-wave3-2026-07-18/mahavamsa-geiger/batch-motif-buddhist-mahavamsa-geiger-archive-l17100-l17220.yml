literal_observations:
- id: obs:1
  text: After Mahadathika’s death, Amandagamani Abhaya, his son, reigns for nine years
    and eight months.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Amandagamani adds architectural features to the Great Thupa and to monastic
    buildings, builds a pavilion adorned with precious stones, builds the Rajatalena-vihara,
    makes the Mahagamendi-tank, and bestows that tank on the Dakkhinu-vihara.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Amandagamani commands that killing not occur on the whole island, plants vine-fruits,
    and gives flesh-melons in almsbowls with garments to the whole brotherhood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kanirajanutissa, Amandagamani’s younger brother, reigns for three years after
    slaying his brother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kanirajanutissa decides a lawsuit about an uposatha-house and orders sixty
    bhikkhus accused of high treason to be captured with their possessions and flung
    into the Kanira caves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Culabhaya, Amandagamani’s son, reigns for one year and builds the Culagallaka-vihara
    on the bank of the Gonaka-river south of the capital.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sivali, Culabhaya’s younger sister and Amanda’s daughter, reigns for four
    months before Ilanaga dethrones her and raises the parasol of sovereignty in the
    capital.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When Ilanaga goes to the Tissa-tank, many Lambakannas desert him and return
    to the capital.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In anger, Ilanaga orders the Lambakannas to make and stamp down a road to
    the Mahathupa beside the tank and sets candalas over them as overseers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Lambakannas respond by gathering, capturing the king, imprisoning him
    in his palace, and administering the government themselves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The king’s consort dresses her little son Candamukhasiva in festal garments
    and sends him with serving-women to the state-elephant.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The queen’s message tells the state-elephant that the boy is his lord’s son,
