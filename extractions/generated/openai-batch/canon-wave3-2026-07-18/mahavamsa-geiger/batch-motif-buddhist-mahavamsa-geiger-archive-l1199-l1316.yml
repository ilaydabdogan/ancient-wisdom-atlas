literal_observations:
- id: obs:1
  text: The passage contrasts a Puranic reckoning of Bindusara's reign as twenty-five
    years with the Mahavamsa reckoning of twenty-eight years, producing different
    dates for the Nirvana and for Asoka's abhiseka.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The date 256 at the end of the so-called Minor Rock-Edict I is discussed as
    formerly interpreted by some scholars as years elapsed from the Nirvana to publication
    of the edict.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: F. W. Thomas is described as deriving vivuthena and vivasa from vi-vas and
    interpreting the number 256 as nights, meaning nights and days, rather than years.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thomas is said to interpret Asoka as publishing the edict while on a religious
    journey, with the number referring to 256 changes of camp during the tour.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fleet is said to interpret vivutha and vivasa as referring to renunciation
    of household life and to Asoka renouncing the throne and world after thirty-seven
    years of reign.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: In Fleet's interpretation, Asoka's dwelling in retreat was the mountain Suvarnagiri
    near Girivraja in Magadha, and the edict was published from Suvarnagiri rather
    than Pataliputra.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fleet gives the number 256 special significance by linking the 256th day of
    Asoka's retreat with the end of the 256th year since the Nirvana; the author warns
    that further conclusions from this idea would be hazardous.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that indications exist for an earlier Ceylonese era reckoned
    from 483 B.C. as the year of the Buddha's death, replaced from the middle of the
    eleventh century by an era reckoned from 544 B.C.
  category: sequence
  evidence_refs:
  - ev:7
