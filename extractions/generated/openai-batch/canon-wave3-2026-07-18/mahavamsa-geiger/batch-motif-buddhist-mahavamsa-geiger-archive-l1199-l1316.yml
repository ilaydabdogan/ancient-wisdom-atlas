  summary: The passage is a scholarly introduction discussing chronological calculations
    for the Buddha's Nirvana and Asoka's consecration, interpretations of the number
    256 in the Minor Rock-Edict I, competing readings by F. W. Thomas and Fleet, and
    evidence for Buddhist eras in Ceylon reckoned from 483 B.C. and later from 544
    B.C.
