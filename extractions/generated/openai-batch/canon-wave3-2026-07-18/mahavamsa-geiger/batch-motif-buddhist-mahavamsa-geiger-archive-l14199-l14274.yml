canonical_text:
  quote: '"the bricks and the other (treasures) had appeared for the Great Thupa"'
  summary: A merchant gives food and drink to theras, is shown a cave with silver,
    and reports it to the king. Other treasures—pearls with coral and four gems—are
    found near watery or cave settings and reported to the king. The king rewards
    the finders, appoints them as watchers, and has the treasures brought for the
    Great Thupa. The narrator concludes that merit performed with faith brings happy
    results.
  language: English
