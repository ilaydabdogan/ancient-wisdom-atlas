canonical_text:
  quote: ''
  summary: The passage recounts Velusumana's seizure of lotus-blossoms and a sword,
    his pursuit by the king's warrior, the pursuer's death, and Velusumana's return
    to Mahagama. It then describes the queen giving birth to a noble son with auspicious
    signs, followed by arrivals of gem-laden ships, a young elephant brought by a
    six-tusked elephant, and another ship with gold vessels. At the prince's name-giving
    festival the king sets out expected omens tied to the son's future rule over Lanka
    and support of the Buddha's doctrine; the omens occur as stated.
  language: English
  quote_policy: summarized
