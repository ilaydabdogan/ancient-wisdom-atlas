  quote: ''
  summary: The passage recounts several rulers of Lanka after Mahallanaga. It lists
    Bhatikatissaka's and Kanitthatissaka's monastic constructions and donations; Khujjanaga's
    brief reign; Kuncanaga's fratricidal accession and famine almsgiving; Sirinaga's
    rebellion, reign, stupa works, Bodhi-tree repairs, offerings, and tax remission;
    and Tissa/Voharikatissa's legal reform and religious patronage.
  language: English
