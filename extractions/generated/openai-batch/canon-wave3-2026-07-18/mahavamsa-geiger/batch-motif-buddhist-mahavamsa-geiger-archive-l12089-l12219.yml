canonical_text:
  quote: ''
  summary: The passage begins the ordered account leading to Dutthagamani's kingship.
    It narrates royal succession, attempted poisoning, exile to Rohana, the birth
    and naming of Yatthalayakatissa, later rulers including Kakavannatissa, the story
    of Viharadevi's origin through a sea ordeal after King Tissa's wrongful killing
    of a thera and a disguised messenger, and the pious works of Kakavannatissa and
    a samanera.
  language: English
  quote_policy: summarized
