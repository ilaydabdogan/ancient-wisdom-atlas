canonical_text:
  quote: ''
  summary: The Pandu king sends his adorned daughter, maidens, gifts, transport, craftsmen,
    and guild families to Vijaya. Vijaya dismisses the yakkhim Kuvanna after hearing
    that the princess has arrived. Kuvanna leaves with her two children, enters Lankapura,
    and is killed by yakkhas who suspect her of spying. Her maternal uncle warns the
    children to flee; they go to Sumanakuta, later become a sibling couple in Malaya,
    and are named as ancestors of the Pulinda. Vijaya receives the Pandu princess
    and gifts, is consecrated king by his ministers, consecrates the princess as queen,
    sends an annual shell-pearl to her father, and rules Lanka peacefully and righteously
    for thirty-eight years.
  language: English
  quote_policy: summarized
