canonical_text:
  quote: ''
  summary: The passage describes King Dutthagamani beginning a campaign with a relic-bearing
    spear, an army, the elephant Kandula, and a company of bhikkhus. He conquers a
    sequence of Damila commanders and places, makes a solemn declaration that his
    aim is to establish the Buddha's doctrine rather than enjoy sovereignty, and this
    declaration is followed by the soldiers' armour taking the colour of fire. The
    passage then recounts Damila retreat into Vijitanagara, the testing of Nandhimitta
    against Kandula, and the beginning of a siege against the fortified city.
  language: English
  quote_policy: summarized
