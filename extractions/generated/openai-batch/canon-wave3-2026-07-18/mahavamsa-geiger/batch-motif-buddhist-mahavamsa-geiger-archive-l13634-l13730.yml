canonical_text:
  quote: ''
  summary: Phussadeva cuts off his own ear lobe as self-imposed royal justice for
    striking the king's ear-ring, but the king denies that this was guilt and later
    rewards him by covering his arrow with coins. After victory and the slaughter
    of the Damilas, King Dutthagamani sits amid palace luxury but feels no joy because
    he remembers the destruction of millions. Arahants from Piyangudipa perceive his
    thought and send eight arahants through the air to comfort him. They tell him
    that the deed is no hindrance to heaven, count only one and a half slain persons
    as morally relevant, and say he will glorify the Buddha's doctrine. The king takes
    comfort, then remembers a childhood vow never to eat without giving to the brotherhood,
    realizes he has eaten a pepper pod without leaving any for the bhikkhus, and resolves
    to do penance. A closing reflection advises mindful contemplation of killing,
    evil, and mortality as a way toward freedom from suffering.
  language: English
  quote_policy: summarized
