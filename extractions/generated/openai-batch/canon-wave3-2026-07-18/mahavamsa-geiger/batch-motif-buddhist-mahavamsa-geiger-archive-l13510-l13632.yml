  summary: The passage recounts Dutthagamani's defeat of Elara near the south gate
    of Anuradhapura, his funeral honors for Elara and unification of Lanka, and the
    later arrival and defeat of Bhalluka, who is killed by the archer Phussadeva after
    the elephant Kandula halts beside a city guardian shrine.
