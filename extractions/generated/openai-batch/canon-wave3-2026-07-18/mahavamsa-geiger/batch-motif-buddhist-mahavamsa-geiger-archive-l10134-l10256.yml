  summary: The passage recounts Buddha-visits to Lanka, preaching and conversions,
    relic-giving, Gotama’s encounters with yakkhas, nagas, devatas, and the future
    sacred site of a thupa. Mahinda prophesies a future royal builder, accepts the
    Mahamegha-grove, causes earthquakes, preaches to the people, and instructs the
    king that the doctrine will stand only when ritual boundaries are established.
