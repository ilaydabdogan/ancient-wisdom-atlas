  quote: ''
  summary: The passage narrates Vasabha’s escape from being delivered to the king,
    his reception and support at the Mahavihara, his acceptance of a prophecy that
    he will become king, his rebellion and victory, and then his later efforts as
    king to lengthen life through Buddhist observance, gifts, construction, restorations,
    lamps, images, and endowments.
  language: English
  quote_policy: summarized
