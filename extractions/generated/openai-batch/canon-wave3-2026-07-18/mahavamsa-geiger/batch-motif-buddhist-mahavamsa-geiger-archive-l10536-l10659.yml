canonical_text:
  quote: ''
  summary: 'In Chapter XVII, the thera tells the king that seeing the Buddha''s relics
    is equivalent to seeing the Conqueror. The king intends to build a thupa and asks
    for relics. The samanera Sumana instructs the king to prepare ceremonially, then
    is sent to obtain relics from Dhammasoka and from Sakka. Sumana receives an alms-bowl
    full of relics, the right collar-bone relic is given by Sakka, and the relics
    are returned to the thera. The thera deposits relics on the mountain, and the
    king receives the collar-bone relic after signs occur: the parasol bows, the elephant
    kneels, and the urn descends upon his head. The king rejoices, places the urn
    on the elephant, the elephant trumpets, and the earth quakes.'
  language: English
  quote_policy: summarized
