canonical_text:
  quote: ''
  summary: 'The passage first closes an episode in which a Sambuddha leaves sacred
    and monastic presences in the island, preaches at Ratanamala, rises into the air,
    and returns to Jambudipa. It then recounts Lord Konagamana’s visit to drought-stricken
    Varadipa: he comes through the air with disciples, stands on Sumanakutaka mountain,
    ends the drought, is seen by the king and people, is hosted by King Samiddha,
    accepts the Mahanoma garden, preaches with mass attainments, and arranges for
    the bhikkhuni Kantakananda to bring the south branch of his Bodhi-tree in a golden
    vase. The Buddha gives the branch to Samiddha, who plants it in the garden, after
    which the Buddha continues northward and preaches at Nagamalaka.'
  language: English
  quote_policy: summarized
