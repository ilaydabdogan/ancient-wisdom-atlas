canonical_text:
  quote: ''
  summary: The passage identifies present figures with earlier deeds and wishes, then
    recounts the novice Nigrodha's audience with King Asoka. Nigrodha sits on the
    royal throne under the white canopy, teaches the king, and the king is won to
    the Buddha's doctrine. Asoka expands almsgiving to monks, replaces teachers of
    false doctrine with bhikkhus, hosts the brotherhood, hears that the dhamma has
    eighty-four thousand sections, and vows to honor each with a vihara.
  language: English
  quote_policy: summarized
literal_observations:
