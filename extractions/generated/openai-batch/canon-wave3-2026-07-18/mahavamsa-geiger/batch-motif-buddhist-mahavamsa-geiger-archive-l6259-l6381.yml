- id: obs:3
  text: The one who had uttered 'candala' lived in a candala village in expiation
    and attained deliverance in the seventh year because he had desired deliverance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: King Asoka summoned Nigrodha, told him to sit on a fitting seat, and Nigrodha
    approached and sat on the royal throne under the white canopy.
