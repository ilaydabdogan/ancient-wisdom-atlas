canonical_text:
  quote: ''
  summary: 'The passage recounts the succession after Dutthagamani: Salirajakumara
    loves Asokamaladevi and does not seek rule; Saddhatissa reigns, sponsors Buddhist
    monuments and offerings, and is reborn among the Tusita gods; after Saddhatissa,
    Thulathana is consecrated with monastic consent but Lanjatissa overpowers him,
    later reconciles with the brotherhood, performs atoning constructions and donations,
    and is followed by Khallatanaga.'
  language: English
  quote_policy: summarized
