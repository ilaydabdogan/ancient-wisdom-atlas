canonical_text:
  quote: ''
  summary: The passage presents a table synchronizing Ceylonese kings, Indian kings,
    and Christian-era dates, then introduces the Buddhist Councils. It summarizes
    the Southern Buddhist tradition of three councils and surveys sources. In the
    First Council account, Mahakassapa hears of the Buddha's death, responds to Subhadda's
    statement that the monks are now free from restraint, proposes a communal recitation
    of Dhamma and Vinaya to keep the doctrine pure, and a council of 500 monks including
    Ananda is convened at Rajagaha. Additional episodes concern lesser precepts, reproaches
    against Ananda, Purana's response to the assembly, and Channa's brahmadanda penance
    and attainment of arahantship.
  language: English
  quote_policy: summarized
