canonical_text:
  quote: justice surely obtains rain in due season.
  summary: A guardian genius, moved by the fiery heat of a king's penances, reports
    the matter through the four great kings to Sakka. Sakka commands Pajjunna to send
    rain in due season. Thereafter rain falls only at night once each week, filling
    the cisterns. The passage closes by saying the monarch gained miraculous power
    by renouncing evil conduct, and exhorts the pious to do the same.
  language: English
  quote_policy: quoted
