  cautions: The taxonomy reference 'wisdom' is broad; the passage is primarily historiographic
    and doctrinal rather than mythic narrative.
- id: motif:2
  label: Branching of an original religious community into multiple schools
  taxonomy_refs: []
  basis: The passage narrates a sequence in which schools arise, separate, and branch
    from earlier schools, culminating in eighteen named schools and later separations.
  evidence_refs:
