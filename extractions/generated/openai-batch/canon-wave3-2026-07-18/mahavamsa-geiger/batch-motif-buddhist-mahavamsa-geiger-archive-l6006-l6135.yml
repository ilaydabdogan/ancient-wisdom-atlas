  - ev:3
  - ev:4
  confidence: high
  cautions: No specific supplied taxonomy family corresponds directly to schismatic
    branching.
- id: motif:3
  label: Royal legitimacy through anointing and consecration
  taxonomy_refs:
  - royal_legitimacy
  basis: Candagutta is anointed king over all Jambudipa by Canakka, and Asoka later
    consecrates himself as king after winning sovereignty.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage also includes violent succession; legitimacy is presented
    chronicle-style rather than argued in detail.
- id: motif:4
  label: Violent succession to universal sovereignty
  taxonomy_refs:
  - royal_legitimacy
  basis: Candagutta's kingship follows the slaying of Dhanananda, and Asoka wins undivided
    sovereignty after slaying ninety-nine brothers.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The taxonomy reference captures the sovereignty aspect; the violence itself
