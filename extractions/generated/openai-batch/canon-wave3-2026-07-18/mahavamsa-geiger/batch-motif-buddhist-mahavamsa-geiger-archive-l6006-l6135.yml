canonical_text:
  quote: ''
  summary: The passage opens Chapter V by recounting the Thera redaction of the dhamma,
    the rise of multiple Buddhist schools after the first century, and later separations
    in Jambudipa and Lanka. It then narrates royal succession from the sons of Kalasoka
    through the Nandas, Candagutta, Bindusara, and Asoka. Asoka gains undivided sovereignty
    after killing his brothers, is consecrated at Pataliputta, and receives extraordinary
    daily offerings from devas, spirits of the air, nagas, and parrots.
  language: English
  quote_policy: summarized
