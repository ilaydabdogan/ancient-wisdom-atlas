    of the dhamma.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: The theras travelled over Jambudipa consoling sorrowing people and then went
    to Rajagaha in the bright half of Asalha.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: At Rajagaha the theras spent the first rain-month repairing dwellings after
    informing Ajatasattu.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: After repairs were finished, the theras told the king that they would hold
    the council and requested a meeting place.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:11
  text: The king quickly built a splendid hall by Vebhara Rock at the entrance to
