canonical_text:
  quote: ''
  summary: The passage recounts the Buddha's passing at Kusinara, the gathering and
    funeral rites, Mahakassapa's decision to preserve the dhamma through a council,
    the inclusion of Ananda, the elders' journey to Rajagaha, and King Ajatasattu's
    preparation of a hall near Vebhara Rock and the Sattapanni grotto for the First
    Council.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Conqueror, described as incomparable and possessing five eyes, had fulfilled
    his duties and died at Kusinara between two sala-trees on the full-moon day of
    Vesakha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A very large assembly gathered, including bhikkhus, social classes, and gods;
    seven hundred thousand leading bhikkhus were present, with Mahakassapa as samghatthera.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mahakassapa performed rites for the Master's body and bodily relics.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mahakassapa desired that the Master's doctrine endure and recalled Subhadda's
    evil words, the Buddha's gift of a garment to him, the establishment of holy truth,
    and consent for a compilation of the dhamma.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: Mahakassapa appointed five hundred eminent bhikkhus for the compilation, though
    one place was left for Ananda.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: Ananda, repeatedly entreated by the bhikkhus, resolved to join the compilation
