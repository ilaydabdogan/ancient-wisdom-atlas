canonical_text:
  quote: ''
  summary: The passage narrates the conflict between the brothers Gamani/Dutthagamani
    and Tissa after their father restricts war against the Damilas and later dies.
    It includes royal religious building, an oath taken by warriors before the bhikkhus,
    Tissa's removal of the queen-mother and elephant Kandula, Dutthagamani's consecration
    and campaign against Tissa, a battle interrupted by a mountain created by bhikkhus,
    and a meal offering to the monastic brotherhood carried by an airborne thera.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prince Gamani is described as skilled with elephants, horses, sword, and archery,
    while Prince Tissa is stationed at Dighavapi with troops and chariots to guard
    the open country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gamani announces his intention to wage war on the Damilas, but his father
    the king forbids him for his protection and says the territory on their side of
    the river is sufficient.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After repeated refusals, Gamani sends his father a woman's ornament; the enraged
    king orders a golden chain made to bind him, and Gamani flees to Malaya, after
    which he is named Dutthagamani.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The father-king builds the Mahanuggala-cetiya, summons the brotherhood, and
