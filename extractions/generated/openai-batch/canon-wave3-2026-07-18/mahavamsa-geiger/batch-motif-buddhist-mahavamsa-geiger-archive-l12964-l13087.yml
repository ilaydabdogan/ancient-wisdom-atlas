  text: The ministers send a letter to Dutthagamani; he sets outposts at Guttahala,
    goes to Mahagama, and has himself consecrated king.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Dutthagamani sends repeated requests to his brother for his mother and the
