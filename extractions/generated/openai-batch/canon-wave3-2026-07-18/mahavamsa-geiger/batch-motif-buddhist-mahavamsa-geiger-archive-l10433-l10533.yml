canonical_text:
  quote: ''
  summary: The thera preaches to the people and king, leaves for Cetiya-mountain to
    found a vihara, is followed by the king and queens, and arranges the rains-retreat
    there. Maharittha and his brothers receive ordination and attain arahantship.
    The king builds rock-cells and gives the vihara as a consecrated offering; the
    thera establishes boundaries and confers higher ordination. A community of arahants
    spends the rainy season on the mountain, teaches the king, and is reverenced by
    gods and humans.
  language: English
  quote_policy: summarized
