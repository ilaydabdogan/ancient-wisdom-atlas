canonical_text:
  quote: ''
  summary: The king approaches and prepares the future Thuparama site, attempts to
    lower the relic from the elephant, and, after the elephant refuses, raises an
    equal-height clay platform for it. The elephant guards the relic while preparations
    for a thupa and festival proceed. Before a gathered multitude the relic rises
    into the air, performs the miracle of double appearances, and sends forth light
    and water. The passage explains the event through the Buddha’s earlier resolutions
    at his great nibbana concerning the Bodhi branch and relic miracles. The relic
    then descends onto the monarch’s head, is laid in the cetiya, and an earthquake
    occurs.
  language: English
  quote_policy: summarized
