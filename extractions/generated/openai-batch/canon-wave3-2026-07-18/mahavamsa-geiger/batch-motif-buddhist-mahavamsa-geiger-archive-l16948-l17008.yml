canonical_text:
  quote: ''
  summary: The passage describes King Bhatika’s gifts of garments, land, food, and
    hospitality to the brotherhood and his maintenance of earlier religious works.
    It then recounts the reign of his younger brother Mahadathikamahānāga, who undertakes
    works of merit, renovates the Great Thupa area, provides seats for preachers,
    builds the Ambatthala-thupa, risks his life when the building is unstable, and
    completes it with four bejewelled arches.
  language: English
