canonical_text:
  quote: ''
  summary: The passage narrates Mahaculi Mahatissa's pious reign, labor-earned almsgiving,
    monastic donations, and vihara foundations; Coranaga's rebellion, destruction
    of viharas, poisoning, and hell rebirth; Anula's repeated poisonings of rulers
    and lovers and her brief reign; and Kutakannatissa's return, slaying of Anula,
    and religious and civic building works.
  language: English
  quote_policy: summarized
