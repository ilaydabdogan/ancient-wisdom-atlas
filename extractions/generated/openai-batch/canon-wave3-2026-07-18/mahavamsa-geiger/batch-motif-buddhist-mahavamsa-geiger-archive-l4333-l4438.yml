canonical_text:
  quote: ''
  summary: 'Scholarly discussion of Buddhist council traditions: the First Council
    account is treated as dependent on the Mahaparinibbana-sutta while the Rajagaha
    assembly is still regarded as an established fact; the Second and Third Councils
    are distinguished in Southern tradition but treated as conflated or uncertain
    in Northern, Tibetan, and Chinese traditions.'
  language: English
  quote_policy: summarized
