- id: obs:4
  text: In the eighth year after attaining buddhahood, while dwelling in Jetavana,
    the Buddha set out with five hundred bhikkhus on the Vesakha full moon and went
    to the Kalyani country.
  category: sequence
  evidence_refs:
  - ev:2
