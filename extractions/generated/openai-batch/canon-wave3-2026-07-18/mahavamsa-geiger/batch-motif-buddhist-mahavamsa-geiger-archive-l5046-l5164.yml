canonical_text:
  quote: ''
  summary: The passage closes the Buddha's visit to Nagadipa by describing the rajayatana-tree
    and throne-seat as memorial objects for naga-kings to honor. It then narrates
    Maniakkhika's invitation of the Buddha and the brotherhood to Kalyani, the service
    of celestial food, the Buddha's preaching, the leaving of visible footprints on
    Sumanakuta, and his meditative consecration of several later sacred sites in Lanka
    before returning to Jetavana. The chapter concludes that the Buddha visited Lanka
    three times for its future salvation and honor.
  language: English
  quote_policy: summarized
