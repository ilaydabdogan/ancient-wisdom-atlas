canonical_text:
  quote: ''
  summary: The king sees omens, gives rice-milk to the brotherhood, and names his
    son Gamani-Abhaya. A second son, Tissa, is later born. At ritual food occasions
    the king and queen give the princes rice-milk and later test them with portions
    of food linked to vows about the Buddhist community, brotherly harmony, and fighting
    the Damilas. The princes accept the first two vows but reject the vow not to fight
    the Damilas. Gamani explains his contracted posture by referring to the Damilas
    beyond the Ganga and the Gotha-ocean on this side, and later matures into a vigorous
    heroic youth. The chapter ends with a reflection on merit and desired rebirth.
  language: English
  quote_policy: summarized
