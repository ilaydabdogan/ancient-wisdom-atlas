canonical_text:
  quote: ''
  summary: The passage reports many conversions to the three refuges and precepts,
    large numbers of noble sons and daughters receiving pabbajja, and a royal naming
    practice for princes. It then praises theras who, although already possessing
    nibbana, delay entering it in order to benefit the world and show the way to salvation,
    following the Buddha's renunciation.
  language: English
  quote_policy: summarized
