canonical_text:
  quote: ''
  summary: The passage is an editorial-historical discussion of Ceylonese and South-Indian
    chronological evidence for the reigns of Parakramabahu I, Parakrama Pandu, Udaya
    III, Asoka, and Devanampiyatissa. It argues from inscriptions and the Culavamsa
    about dates reckoned after the Buddha's Nirvana, concluding that different eras
    were confused and that an Indian tradition about Asoka was transmitted to Ceylon
    and linked with Devanampiyatissa.
  language: English
  quote_policy: summarized
