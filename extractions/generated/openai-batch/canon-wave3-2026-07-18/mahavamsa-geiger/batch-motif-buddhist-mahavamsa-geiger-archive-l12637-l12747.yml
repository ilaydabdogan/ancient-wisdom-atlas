canonical_text:
  quote: ''
  summary: A young man later named Suranimila is tested by Prince Gamani with a far
    errand to the brahman Kundali. He travels rapidly, visits and reveres sacred sites
    at Anuradhapura, returns with a letter and gifts, is richly honored by the prince,
    gives rewards to his parents, and is assigned by King Kakavannatissa to Gamani's
    service. The passage then introduces Sona, later Mahasona, whose extraordinary
    childhood strength leads the king to place him in Gamani's service.
  language: English
  quote_policy: summarized
