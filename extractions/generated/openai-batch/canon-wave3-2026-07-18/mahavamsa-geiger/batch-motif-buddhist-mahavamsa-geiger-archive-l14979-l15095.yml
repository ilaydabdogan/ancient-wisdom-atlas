canonical_text:
  quote: ''
  summary: 'The passage enumerates scenes from the Buddha’s life and final passing
    as represented in the making of the relic-chamber: post-awakening events, preaching
    and conversions, miracles, subduing of beings, approach to Parinibbana, funeral
    rites, and relic distribution. Notes identify parallels in Buddhist textual traditions
    and in Buddhist monument reliefs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note states that verses 78-87 enumerate scenes from the Buddha’s life from
    sambodhi to death and obsequies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the sambodhi, the Buddha is described as spending time near the bodhi-tree.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Brahma and other gods entreat the Buddha to preach the discovered truth to
    the world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The enumerated scenes include the admission of Yasa, the pabbajja of the Bhaddavaggiyas,
    the subduing of the jatilas, Bimbisara’s visit, entry into Rajagaha, acceptance
    of the Veluvana, disciples, Kapilavatthu, the jewelled path, and the pabbajja
    of Rahula and Nanda.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note explains the jewelled path as a path of gems created in the air, on
    which the Buddha paced while preaching to the Sakyas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The list includes the miracle at the foot of the mango-tree, preaching in
    the heaven of the gods, the miracle of the descent of the gods, an assembly with
    questioning, named suttas and exhortation, and the encounter with the elephant
    Dhanapala.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note says Dhanapala was an elephant let loose upon the Buddha and subdued
    by the power of the Buddha’s gentleness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The list includes subduing the yakkha Alavaka, the robber Angulimala, and
    the naga-king Apalala, followed by meeting with the Parayanakas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Final-life events include giving up life, accepting a dish of pork, accepting
    two gold-coloured garments, drinking pure water, and the Parinibbana itself.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Notes state that Cunda’s dish brought on the illness that led to the Buddha’s
    death, that Pukkusa’s garments were placed on him as his body radiated unearthly
    brightness, and that the Kakuttha-river water became clear when Ananda took a
    draught for him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Post-Parinibbana events include lamentation by gods and men, revering of the
    feet by the thera, burning of the body, quenching of the fire, funeral rites,
    and distribution of relics by Dona.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A note states that the funeral pyre could not be lit until Mahakassapa arrived,
    revered the Buddha’s feet, and then the pyre broke into flame by itself; streams
    of water from heaven extinguished the fire.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The noble king is said to have placed many Jatakas fitted to awaken faith
    in the same setting.
  category: action
  evidence_refs:
  - ev:10
