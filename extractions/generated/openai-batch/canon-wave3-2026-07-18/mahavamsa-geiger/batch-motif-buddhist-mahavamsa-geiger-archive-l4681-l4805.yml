canonical_text:
  quote: ''
  summary: The opening of the Mahavamsa announces the recitation of the chronicle,
    recounts Gotama Buddha's vow after seeing Dipamkara, his homage to prior Buddhas
    and receipt of prophecies, his enlightenment beneath the Bodhi-tree, his first
    teaching and conversions, and his departure toward Lanka because his doctrine
    would flourish there after the yakkhas were driven forth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator makes obeisance to the pure Sambuddha and states an intention
    to recite the Mahavamsa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator describes the present Mahavamsa as a tradition handed down to
    arouse serene joy and emotion, in contrast to an older compilation said to be
    too long, too compact, and repetitious.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After seeing the Sambuddha Dipamkara in olden times, the Conqueror resolved
    to become a Buddha in order to release the world from evil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Conqueror offered homage to twenty-four Sambuddhas and received from them
    the prophecy of his future buddhahood.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After fulfilling all perfections and reaching the highest enlightenment, Buddha
    Gotama is said to have delivered the world from suffering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Uruvela in Magadha, sitting at the foot of the Bodhi-tree, the great sage
    reached supreme enlightenment on the full-moon day of Vesakha.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: After enlightenment, he stayed there seven weeks, mastering his senses and
    knowing the bliss of deliverance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: He went to Baranasi, set rolling the wheel of the law, and brought sixty hearers
    to arahantship during the rain-months.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: He sent forth bhikkhus to preach the doctrine, converted the thirty companions
    of Bhadda, and stayed at Uruvela to convert the thousand jatilas led by Kassapa.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When a great sacrifice by Kassapa of Uruvela was near and the Buddha saw that
    Kassapa wanted him away, he went for alms among the Northern Kurus and ate near
    Lake Anotatta.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the ninth month of his buddhahood, at the full moon of Phussa, the Conqueror
    set out for the island of Lanka to win Lanka for the faith.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Lanka is described as a place where the Buddha's doctrine would later shine
    in glory, and as filled with yakkhas who first had to be driven forth.
  category: setting
  evidence_refs:
  - ev:11
