canonical_text:
  quote: ''
  summary: The passage narrates how Vijaya hears night music from a yakkha wedding
    festival. A yakkhini explains the gathering, decides to aid Vijaya's kingship,
    and instructs him how to strike invisible yakkhas through her cries and magic
    power. Vijaya slays the yakkhas, puts on the yakkha-king's garments, and later
    founds Tambapanni. The passage explains the names Tambapanni and Sihala/Sinhala
    through red hands on red earth and Sihabahu's lion-slaying. Vijaya's ministers
    found settlements, urge his consecration, and send gifts by ship to Madhura to
    obtain a noble Pandu princess and other maidens for a royal marriage alliance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At night Vijaya hears music and singing and asks the yakkhini lying near him
    what the noise means.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yakkhini thinks that she will bestow kingship on her lord and that the
    yakkhas must be slain because otherwise they will slay her for enabling human
    settlement in Lanka.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The yakkhini identifies a yakkha-city named Sirisavatthu and says a daughter
    of the yakkha chief and her mother have come there for a seven-day wedding festival.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The yakkhini urges Vijaya to destroy the yakkhas that day because later it
    will not be possible.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vijaya asks how he can slay invisible yakkhas, and the yakkhini says she will
    cry out where they are so that his weapon, by her magic power, will fall on their
    bodies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vijaya follows the yakkhini's instruction, slays all the yakkhas, puts on
    the garments of the yakkha-king, and distributes other raiment among his followers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After some days Vijaya goes to Tambapanni, founds the city of Tambapanni,
    and dwells there with the yakkhini and his ministers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The region and island are named Tambapanni because Vijaya's men, after landing,
    rest their hands on red earth and their hands are reddened by the dust.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sihabahu is called Sihala because he slew the lion, and Vijaya's followers
    are also called Sihala because of their ties to him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'Vijaya''s ministers found villages: Anuradhagama near the Kadamba river,
    Upatissagama on the Gambhira river, and Ujjeni, Uruvela, and Vijita by three other
    ministers.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After settlements are founded, the ministers ask Vijaya to be consecrated
    king, but he refuses unless a maiden of noble house is consecrated queen at the
    same time.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The ministers send people by ship with precious gifts, jewels, and pearls
    to Madhura in southern India to woo the Pandu king's daughter for Vijaya and other
    daughters for the ministers and retainers.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The messengers arrive at Madhura, present gifts and a letter, and the Pandu
    king consults with ministers before deciding to send his daughter to Lanka.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: The Pandu king obtains nearly one hundred maidens for Vijaya's ministers and
    proclaims by drumbeat that families willing to send daughters to Lanka should
    provide double clothing and place the daughters at their house doors as a sign.
  category: speech
  evidence_refs:
  - ev:13
