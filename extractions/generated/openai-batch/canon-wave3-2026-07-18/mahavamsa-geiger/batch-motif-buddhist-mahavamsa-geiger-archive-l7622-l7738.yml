candidate_motifs:
- id: motif:1
  label: Supernatural insider enables conquest of her own people
  taxonomy_refs: []
  basis: The yakkhini decides to bestow kingship on Vijaya, reveals the yakkha gathering,
    instructs him to attack that day, and uses cries and magic power so he can slay
    invisible yakkhas.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not name the yakkhini in the supplied excerpt and does
    not provide an explicit broader comparison.
- id: motif:2
  label: Defeated ruler's garments worn by conqueror
  taxonomy_refs:
  - royal_legitimacy
  basis: After killing the yakkhas, Vijaya puts on the garments of the yakkha-king
    and distributes other raiment among followers.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage later makes formal consecration depend on obtaining a noble
    queen, so the garment episode alone should not be treated as complete royal consecration.
- id: motif:3
  label: Settlement-founding ancestor and ministers
  taxonomy_refs:
  - culture_hero
  basis: Vijaya founds Tambapanni, dwells there with ministers, and his ministers
    or named associates found multiple villages and cities.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage records settlement foundation but does not explicitly label
    Vijaya a culture hero.
- id: motif:4
  label: Eponymous naming from bodily mark and ancestral deed
  taxonomy_refs: []
  basis: The name Tambapanni is explained through reddened hands from red earth, while
    Sihala is explained through Sihabahu's lion-slaying and ties to Vijaya's followers.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: This is an etiological naming pattern within the passage rather than a
    mapped taxonomy family from the supplied list.
- id: motif:5
  label: Royal consecration requires a noble queen
  taxonomy_refs:
  - royal_legitimacy
  basis: Vijaya refuses consecration unless a noble maiden is consecrated queen at
    the same time, leading ministers to seek the Pandu king's daughter.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The actual consecration is not completed within the supplied excerpt.
- id: motif:6
  label: Marriage alliance through gifts and transfer of maidens
  taxonomy_refs:
  - royal_legitimacy
  basis: Envoys carry precious gifts and a letter to Madhura to obtain the Pandu king's
    daughter for Vijaya and other daughters for his ministers and retainers; the king
    organizes the sending of maidens to Lanka.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage frames the exchange politically and dynastically; it does
    not describe a sacred marriage ritual in the excerpt.
