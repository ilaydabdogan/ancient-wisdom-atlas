canonical_text:
  quote: ''
  summary: The passage first concludes an earlier Sambuddha visitation with meditation,
    teaching, a girdle relic, resident monastics, aerial departure, and return to
    Jambudipa. It then recounts the Buddha Kassapa's visit to Mandadipa during a war
    between King Jayanta and his younger brother. Kassapa comes through the air with
    disciples, appears shining on Subhakuta mountain, causes people to gather, and
    the battle halts. Jayanta hosts Kassapa and the brotherhood, offers the Mahasagara-garden,
    and the grove blooms out of season and the earth quakes when accepted. Kassapa
    preaches, leading to mass attainment. He later meditates at a former Bodhi-tree
    site and summons the theri Sudhamma to bring the south branch of his nigrodha
    Bodhi-tree. Sudhamma marks, removes, and brings the branch in a golden vase with
    bhikkhunis and devatas; Kassapa gives it to Jayanta, who plants it in the garden.
    Kassapa then preaches at Asokamalaka and goes to a site where former Buddhas had
    sat.
  language: English
  quote_policy: summarized
