canonical_text:
  quote: ''
  summary: 'The passage narrates the origin of Sihabahu: a Vanga princess is prophesied
    to unite with the king of beasts, leaves home, encounters a lion, bears twin children
    in his cave, and later escapes with them. Her son Sihabahu, marked by lion-like
    hands and feet and extraordinary strength, eventually kills the lion, his father,
    and is recognized by the Vanga ministers as the king''s grandson and asked to
    rule.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Vanga king and his Kalinga consort had a daughter, and soothsayers prophesied
    that she would unite with the king of beasts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The princess left the house alone, joined a caravan, and in the forest fled
    along the way by which a lion had come after attacking the caravan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lion saw the princess, was moved by love, approached her, and she remembered
    the prophecy and caressed him without fear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lion carried the princess to his cave and was united with her; she later
    bore twin children, a son and a daughter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The son had hands and feet formed like a lion's and was named Sihabahu; the
    daughter was named Sihasivali.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: At sixteen, Sihabahu asked why his parents were different; his mother told
    him the story and said the cave was closed with a rock.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sihabahu lifted the rock barrier before the cave and traveled a great distance
    while carrying it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the lion was away, Sihabahu carried his mother on one shoulder and his
    sister on the other, and they left the cave area wearing branches as clothing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A border-country commander gave the fugitives clothing and food; the clothing
    became splendid garments, and the leaves holding food became golden dishes because
    of their merit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After learning the princess's family and clan, the commander took her to the
    Vanga capital and married her.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The lion returned to the cave, missed the three fugitives, grieved, stopped
    eating and drinking, and searched for his children; villages he approached were
    deserted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Border-folk told the king that a lion was ravaging the country, and the king
    offered increasing rewards to whoever would bring the lion.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Sihabahu's mother restrained him twice, but the third time he took the offered
    gold as reward for slaying his own father.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The king promised Sihabahu the kingdom if he would take the lion.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: At the cave opening, the lion came forward from love for his son; Sihabahu's
    arrows rebounded three times because of the lion's tenderness, but when the lion
    grew wrathful an arrow pierced him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Sihabahu returned with the lion's maned head; after the Vanga king's death,
    the ministers recognized his royal descent through his mother and asked him to
    be king.
  category: sequence
  evidence_refs:
  - ev:10
