canonical_text:
  quote: the earth encircled by the ocean trembled six times
  summary: Ananda is urged to attain the highest state before the council, becomes
    an arahant, and demonstrates this by taking his prepared seat miraculously. The
    assembled theras choose Upali to expound the vinaya and Ananda to expound the
    dhamma under Mahakassapa's questioning; the assembly repeats the teachings. The
    compilation is completed in seven months, accompanied by cosmic signs, and is
    named the Thera tradition. The passage closes by noting the elders' entry into
    nibbana and reflecting on death and renunciation.
  language: English
  quote_policy: quoted
