canonical_text:
  quote: ''
  summary: The king Devanampiya-tissa goes to meet the theri after hearing where she
    has gone, greets and speaks with her, and learns her wish. Perceiving her desire,
    he orders a pleasing convent for bhikkhunis to be built around the thupa-house.
    The convent is named Hatthalhaka-vihara because it is near the elephant-post.
    Samghamitta takes up residence there. The Bodhi-tree remains for a long time in
    Lanka, in the Mahamegha-grove, bringing benefit to the islanders and advancing
    the doctrine, endowed with wondrous powers.
  language: English
