canonical_text:
  quote: ''
  summary: The passage lists Buddhist missionary theras who travel to several regions,
    preach named discourses or a jataka, and produce mass attainments and ordinations.
    It then narrates Sona and Uttara going to Suvannabhumi, where a sea-born female
    demon devours royal newborn boys; the thera repels her by creating more demons,
    makes a protective bulwark around the country, and proclaims the Brahmajala discourse.
  language: English
