canonical_text:
  quote: ''
  summary: The passage opens Chapter IV with a succession of rulers who kill their
    fathers, leading citizens to banish Nagadasaka and anoint the worthy minister
    Susunaga. It then dates Kalasoka’s reign in relation to a century after the Buddha’s
    parinibbana. In Vesali, Vajji-clan monks teach that the Ten Points are lawful.
    The thera Yasa opposes their request for money from laypeople, is threatened,
    proclaims that his teaching accords with the dhamma, escapes through the air,
    and seeks support from other elders.
  language: English
  quote_policy: summarized
