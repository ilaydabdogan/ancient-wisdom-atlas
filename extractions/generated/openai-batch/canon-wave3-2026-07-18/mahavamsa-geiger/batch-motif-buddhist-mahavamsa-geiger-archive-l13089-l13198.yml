canonical_text:
  quote: ''
  summary: 'A thera distributes morsels to five hundred bhikkhus and sends an almsbowl
    through the air to the king. The narrative then recounts the war between the king
    and his brother Tissa: the brothers meet in battle on animal mounts, the king
    leaps over the elephant Kandula, Tissa''s forces are scattered, and Tissa flees
    to a vihara. Monastic figures hide and carry Tissa out under the guise of a dead
    bhikkhu, while the king refrains from seizing him because of the guardian genii
    of the royal house. Later Tissa seeks reconciliation through the thera Godhagatta
    Tissa, and Viharadevi shelters him before the king.'
  language: English
  quote_policy: summarized
