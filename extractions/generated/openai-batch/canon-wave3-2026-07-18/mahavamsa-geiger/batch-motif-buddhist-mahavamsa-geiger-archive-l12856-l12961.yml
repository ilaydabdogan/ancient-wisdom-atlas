canonical_text:
  quote: ''
  summary: The passage recounts three prodigious warriors—Khanjadeva, Phussadeva,
    and Labhiyavasabha—whose feats of strength, sound, archery, and earth-moving lead
    the king to attach them to Prince Gamani. It then describes the king honoring
    ten great warriors and ordering recursive recruitment until 11,110 warriors surround
    Gamani. The chapter closes with a moral exhortation toward piety.
  language: English
  quote_policy: summarized
