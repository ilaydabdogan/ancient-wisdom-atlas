canonical_text:
  quote: ''
  summary: 'The passage narrates successive Buddhist monastic transmissions: the brahman
    Dasaka learns from Upali and enters the order; Sonaka later enters the order under
    Dasaka; Siggava, Candavajji, and their followers encounter Sonaka in trance, enter
    the order, study the pitakas, and attain supernormal powers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dasaka is described as a learned brahman in Vesali, the eldest of three hundred
    disciples, who completed twelve years of Vedic study before meeting the thera
    Upali at the Valika-monastery.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Upali expounds difficult Vedic passages for Dasaka, speaks of a single doctrine
    after all doctrines, identifies it as the manta of the Buddha, and says it is
    imparted only to one who wears the robe.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Dasaka asks his teacher and parents about learning the manta; with three hundred
    young brahmans he receives pabbajja, later upasampada, and is included among those
    to whom Upali teaches the whole tipitaka.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sonaka, the fifteen-year-old son of a caravan-guide from the land of the Kasi,
    comes to Giribbaja and enters the Veluvana monastery with fifty-five young brahman
    companions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sonaka sees the thera Dasaka with disciples around him, gains faith, asks
    for pabbajja, fasts three meal-times, obtains his parents' leave, receives ordination
    with the other youths, learns the three pitakas, and is called foremost among
    Dasaka's thousand disciples who had overcome the asavas.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Siggava, a minister's son in the city named for the patali flower, is said
    to be eighteen years old and to dwell in three palaces for the three seasons before
    visiting Sonaka with Candavajji and five hundred followers at Kukkutarama.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Sonaka does not answer Siggava's greeting because he is in trance with
    restrained senses, the bhikkhus explain that those deep in trance give no reply
    and emerge at certain calls, when the allotted time ends, or at the approach of
    death.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The brotherhood gives the call; Sonaka awakens, says he was enjoying what
    is for the monks to enjoy, and later Siggava, Candavajji, and their five hundred
    followers receive ordination from Sonaka, study the three pitakas, and attain
    six supernormal powers.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
