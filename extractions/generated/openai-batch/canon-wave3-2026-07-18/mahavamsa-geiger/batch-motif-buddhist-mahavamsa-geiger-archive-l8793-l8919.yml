canonical_text:
  quote: ''
  summary: After the third council, the thera Moggaliputta foresees the establishment
    of the Conqueror's religion in neighboring countries and dispatches named theras
    to different regions. Majjhantika goes to Kasmira and Gandhara, where the naga-king
    Aravala has harmed crops with hail and flood. Majjhantika travels through the
    air, performs wonders at Aravala's lake, withstands the naga-king's storm and
    fire terrors, preaches the doctrine, and causes Aravala, many serpent beings,
    other supernatural beings, and many human inhabitants to accept Buddhist teaching
    or ordination. The passage also summarizes the missions of Mahadeva in Mahisamandala
    and Rakkhita in Vanavasa, with mass conversions and ordinations.
  language: English
  quote_policy: summarized
