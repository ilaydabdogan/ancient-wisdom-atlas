canonical_text:
  quote: ''
  summary: Mahinda, charged to convert Lanka, waits for a fitting royal moment, visits
    his kin and mother, is urged by Indra to set forth, and then rises into the air
    with companions to alight on Missaka-mountain in Lanka, where he is described
    as foretold and praised by the gods of Lanka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mahinda is described as a great thera of lofty wisdom, twelve years a monk,
    charged by his teacher and the brotherhood to convert Lanka; he considers the
    timing because king Mutasiva is old and his son must become king.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mahinda bids farewell to his teacher and the brotherhood, asks leave of the
    king, takes four theras and the novice Sumana, and goes to Dakkhinagiri to preach
    to his kinsfolk for six months.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Vedisagiri, Mahinda visits his mother Devi; she welcomes him and his companions
    with food prepared by herself and leads him to the vihara Vedisagiri.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage recounts that prince Asoka met Devi, daughter of a merchant, made
    her his wife, and that she bore Mahinda and later Samghamitta.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mahinda thinks that king Devanampiyatissa will take part in a great consecration
    festival, hear from envoys, climb Missaka-mountain on the uposatha-day of Jettha,
    and that Mahinda's party will go to Lanka on that day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Indra seeks out Mahinda and tells him to set forth to convert Lanka, saying
    that Mahinda has also been foretold by the Sambuddha and that helpers will aid
    him there.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bhanduka, a relative of Devi, hears doctrine preached by Mahinda to Devi,
    obtains the reward of one who shall return no more unto life, and remains with
    Mahinda.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: On the uposatha-day of Jettha, Mahinda, the four theras, Sumana, and the lay-disciple
    Bhanduka rise up in the air and depart from the vihara.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mahinda and his following alight on the pleasant Missaka-mountain, on the
    Sila-peak, at the open and fair Ambatthala.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mahinda is described as foretold by the Sage in the hour of death, as bringing
    salvation to Lanka, as having become like the Master for Lanka's salvation, and
    as extolled by the gods of Lanka.
  category: attribute
  evidence_refs:
  - ev:10
