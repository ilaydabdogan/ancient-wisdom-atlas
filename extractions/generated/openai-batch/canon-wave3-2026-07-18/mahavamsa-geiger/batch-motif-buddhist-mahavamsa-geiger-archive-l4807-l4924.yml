canonical_text:
  quote: ''
  summary: The Blessed One visits a yakkha gathering in central Lanka, creates terror
    through storm, darkness, and fire, receives a place and the island from the yakkhas,
    relocates them to Giridipa, preaches to assembled devas and living beings, and
    later gives hairs from his head to Mahasumana, who enshrines and worships them
    at the Master's seat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large gathering of yakkhas dwelling in the island is located at the Mahanaga
    garden on a river bank in the midst of Lanka.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Blessed One goes to the yakkha assembly and hovers in the air over their
    heads at the place of the future Mahiyangana-thupa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rain, storm, darkness, and related terrors are used to frighten the yakkhas,
    who ask the Vanquisher for release from fear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Vanquisher says he will remove their fear and distress if they give him
    a place to sit; the yakkhas answer by giving him the whole island.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After the terror, cold, and darkness are removed, the Conqueror spreads a
    skin rug on the ground, makes it spread wide, and flame surrounds it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The yakkhas stand around on the border because of the burning heat; Giridipa
    is brought near, they settle there, and Giridipa is returned to its former place.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: After the rug is folded, devas assemble; the Master preaches doctrine, many
    living beings are converted, and many take the refuges and precepts.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Mahasumana, prince of devas of Sumanakuta-mountain, asks for something to
    worship; the Conqueror passes his hand over his head and gives him a handful of
    hairs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mahasumana receives the hairs in a golden urn, places them on a heap of many-coloured
    gems at the place where the Master had sat, covers them with sapphire, and worships
    them.
  category: action
  evidence_refs:
  - ev:6
