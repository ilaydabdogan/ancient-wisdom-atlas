canonical_text:
  quote: ''
  summary: 'The passage recounts a succession of kings in Anuradhapura: a prophecy
    about an enduring race, the killing of king Vijaya and consecration of Samghatissa,
    Samghatissa''s offerings to Buddhist institutions, his death by poisoned jambu
    fruit, and the consecration and pious acts of Sirisamghabodhi. Sirisamghabodhi
    responds to drought by lying at the Great Thupa until rain raises him, uses corpse-burning
    deception to quell fear of rebels, and confronts the yakkha Ratakkhi, offering
    himself rather than any of his subjects.'
  language: English
  quote_policy: summarized
