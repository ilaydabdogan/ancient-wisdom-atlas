canonical_text:
  quote: ''
  summary: At the moment of the Tathagata's nibbana, he instructs Sakka to protect
    Vijaya, Vijaya's seven hundred followers, and Lanka because his religion will
    be established there. Sakka delegates Lanka's guardianship to a lotus-colored
    god, who comes in ascetic disguise, reassures Vijaya's followers, sprinkles them
    with water, binds protective thread on them, and vanishes. A yakkhini attendant
    appears as a bitch and leads one follower to Kuvanna, a yakkhini disguised as
    a woman-hermit near a pond. Kuvanna captures the man and then all seven hundred
    followers, but the protective thread prevents her from devouring them. Vijaya,
    armed with weapons, confronts and subdues Kuvanna, compels her by oath to restore
    his men, and receives food and goods taken from traders she had devoured. After
    receiving first portions of the meal from Vijaya, Kuvanna takes the form of an
    adorned young maiden, prepares a bed beneath a tree, and Vijaya takes her as spouse
    while his men encamp nearby.
  language: English
  quote_policy: summarized
