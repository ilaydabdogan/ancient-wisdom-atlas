canonical_text:
  quote: ''
  summary: 'The passage recounts successive reigns in Lanka: Mahasiva and Suratissa
    patronize Buddhist establishments; Sena and Guttaka conquer Suratissa and are
    later overpowered by Asela; Elara from the Cola country conquers Asela and rules
    with even justice. Elara maintains a bell for petitioners seeking legal judgment.
    Animals and an old woman use the bell in legal grievances, and Elara responds
    with severe or restorative judgments, including executing his own son for killing
    a calf and restoring a damaged thupa after accidentally injuring it.'
  language: English
  quote_policy: summarized
