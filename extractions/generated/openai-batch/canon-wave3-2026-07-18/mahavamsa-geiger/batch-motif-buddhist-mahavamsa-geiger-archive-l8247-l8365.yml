canonical_text:
  quote: ''
  summary: A maiden feeds the prince and his followers with food that does not diminish;
    banyan leaves become golden vessels, and the prince recognizes her as fit to be
    queen. After he takes her away, her father and brothers fight and are defeated.
    Pandukabhaya campaigns against his uncles and receives a boundary-setting letter
    from King Abhaya, whose brothers then appoint Tissa as regent. A yakkhini named
    Cetiya, dwelling near Dhumarakkha mountain and a pond, appears as a mare; the
    prince pursues her through repeated circuits around water and mountain, obtains
    a sword when a palm-leaf transforms by his merit, threatens her, and compels her
    to promise him the kingdom and follow him as a captured mare.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After hearing the maiden's account, the prince is described as being fired
    with love and asks for a share of the food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden steps down from the waggon and offers the prince food in a golden
    bowl at the foot of a banyan-tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maiden takes banyan-leaves for serving the rest of the people, and the
    leaves immediately become golden vessels.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After everyone is fed, the food is not diminished except as if one person's
    portion had been removed; the maiden is then called Suvannapali.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prince takes the maiden, mounts his waggon, and travels onward with a
    mighty army.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maiden's father sends soldiers, who are defeated; her five brothers then
    go to war, and Canda son of Pandula slays them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pandukabhaya marches with a great host across the Ganga toward the Dola-mountain,
    sojourns there, battles his uncles near Dhumarakkha-mountain, defeats them, and
    holds their camp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: King Abhaya sends the prince a letter and a thousand pieces of money, instructing
    him to keep the land on the further shore and not cross to this shore; the nine
    brothers anger at this, Abhaya yields the government, and Tissa is appointed regent.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A yakkhini named Cetiya dwells on Dhumarakkha-mountain near the pond Tumbariyangana
    and wanders about in the form of a mare.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man sees the mare, described as beautiful, white-bodied, and red-footed,
    and reports her to the prince.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The prince takes a noose and comes to capture the mare; she sees him behind
    her, fears his majestic aspect, flees, and does not make herself invisible.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: During the pursuit, the mare circles the pond seven times, enters and exits
    the Mahaganga, circles Dhumarakkha-mountain seven times, circles the pond three
    more times, and enters the Ganga near Kacchaka-ford.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the ford, the prince seizes the mare by the mane and grasps a floating
    palm-leaf; by the effect of his merit, the palm-leaf becomes a great sword.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The prince threatens to kill the mare; she promises to conquer the kingdom
    and give it to him. He pierces her nostrils with the sword-point, secures her
    with a rope, and she follows wherever he wants.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The prince rides the mare to Dhumarakkha-mountain, dwells there four years,
    then goes to Arittha-mountain and sojourns seven years awaiting a fit time for
    war.
  category: sequence
  evidence_refs:
  - ev:13
