canonical_text:
  quote: "“I will do battle with those rebels, the passions”"
  summary: After Lanka is united under one king, the warrior Theraputtabhaya rejects
    royal honours and enters monastic life, attaining arahantship. King Abhaya later
    attends a royal festival at the Tissa-tank, where a relic-bearing spear is planted
    and then cannot be moved. Taking this as a miracle, the king builds a cetiya and
    the Maricavatti-vihara around it, consecrates the monastery, gives it to the brotherhood
    with ceremonial water, and distributes lavish gifts. The chapter closes with a
    didactic statement about wise use of treasure.
  language: English
  quote_policy: quoted
