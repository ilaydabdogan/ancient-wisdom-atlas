canonical_text:
  quote: ''
  summary: The passage recounts an earlier Buddha, Kakusandha, visiting the island
    then called Ojadipa during King Abhaya's reign. A pestilence attributed to demons
    ceases through the Sambuddha's power. Kakusandha gathers the king and people,
    receives hospitality and the Mahatitthaka-garden, preaches with large numbers
    attaining the path, and arranges for the bhikkhuni Rucananda to bring a southern
    branch of his Bodhi-tree in a golden vase. The branch is handed to Kakusandha,
    given to King Abhaya, and planted in the garden, after which Kakusandha preaches
    at further northern sites.
  language: English
  quote_policy: summarized
