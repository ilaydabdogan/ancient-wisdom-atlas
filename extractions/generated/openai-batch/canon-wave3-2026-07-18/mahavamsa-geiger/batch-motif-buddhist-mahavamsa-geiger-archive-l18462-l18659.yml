canonical_text:
  quote: ''
  summary: An editorial appendix compares the Mahasammata dynasty and related Buddhist
    genealogical traditions across the Dipavamsa, Mahavamsa, Mahavastu, Dulva, Theravada
    commentarial materials, and the Rajavali. It summarizes stories of Iksvaku/Okkaka
    banishing legitimate sons, the founding of Kapilavastu and origin of the Sakyas,
    a leprous Sakya princess and Kola as ancestors of the Koliya clan, and the immediate
    ancestry of the Buddha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage introduces Appendix A as a comparison of the Mahasammata dynasty
    with parallel passages in northern Buddhist literature, specifically the Mahavastu
    and the Dulva.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A comparative list aligns names from the Dipavamsa and Mahavamsa with names
    from the Mahavastu and Dulva, including Mahasammata, Kalyana, Uposatha/Uposadha,
    Mandhatar/Mandhata, and Okkaka/Iksvaku.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the summarized story, Iksvaku banishes his legitimate sons because he wishes
    to pass the throne to Jenta, the son of a concubine, after being drawn into a
    promise by Jenta's mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Iksvaku's sons withdraw into the wilderness with their sisters, marry those
    sisters, later build Kapilavastu, and their descendants are identified as the
    Sakyas.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same Sakya-origin story is said to have been known to the Theravadins;
    the Mahavamsa Tika version mentions four banished sons of Okkaka and a fifth son,
    Jantu, for whom the brothers give way.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Mahavastu is said to relate a story of a Sakya king's daughter who has
    leprosy, is banished to the forest, is cured there, and is found by a hermit named
    Kola.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kola is described as a former king of Benares who had withdrawn into the forest
    because he also suffered from leprosy; he marries the Sakya princess, and the
    Koliya clan is said to spring from them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Koliya-origin legend is said to have been known in Ceylon and to occur
    in the Sumangalavilasini Tika and the Sinhalese Rajavali after the story of Iksvaku's
    sons.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Mahavastu and Dulva identify Simhahanu as the Buddha's grandfather and
    list sons including Suddhodana, the Buddha's father; the Dipavamsa and Mahavamsa
    give comparable names and add Sakkodana.
  category: relationship
  evidence_refs:
  - ev:9
