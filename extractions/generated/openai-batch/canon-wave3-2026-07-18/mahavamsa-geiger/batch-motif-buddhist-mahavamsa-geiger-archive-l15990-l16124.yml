canonical_text:
  quote: "“Enter into our delightful celestial world, O king.”"
  summary: A dying king recalls two meritorious gifts and is reassured by the thera
    Abhaya, who recounts how the gifts were distributed among many bhikkhus. The king
    instructs his brother Tissa to complete and maintain rites at the Great Thupa.
    During monastic chanting, gods arrive in six celestial cars and invite the king
    to their heavenly worlds. After a miraculous sign with flower garlands proves
    the cars’ presence, Abhaya identifies Tusita as the fairest celestial world and
    the dwelling of the Bodhisatta Metteyya. The king looks at the Great Thupa, dies,
    and is seen reborn in celestial form in the car from Tusita-heaven.
  language: English
  quote_policy: quoted
