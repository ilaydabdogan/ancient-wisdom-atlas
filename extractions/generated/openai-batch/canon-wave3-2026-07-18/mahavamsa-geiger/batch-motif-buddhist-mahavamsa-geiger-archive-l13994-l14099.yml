canonical_text:
  quote: ''
  summary: The passage describes the richly ornamented Lohapasada or Brazen Palace,
    including its chambers, gem-pavilion, throne, parasol, auspicious figures, furnishings,
    gateways, and copper covering. When it is ready, the king assembles the Buddhist
    brotherhood, assigns monastic groups to stories according to learning and attainment,
    formally bestows the palace with ceremonial water, gives alms for a week, and
    the chapter closes by praising almsgiving over hoarding treasure.
  language: English
  quote_policy: summarized
