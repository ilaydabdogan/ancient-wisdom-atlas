canonical_text:
  quote: ''
  summary: After Jetthatissa's death, Mahasena becomes king and is consecrated by
    the thera Samghamitta, who persuades him against the Mahavihara. A penalty for
    feeding Mahavihara monks causes them to leave, and the monastery is empty for
    nine years. Samghamitta gains permission to destroy it; Sona and allied bhikkhus
    demolish buildings and transfer materials to Abhayagiri, which the king further
    embellishes. The minister Meghavannabhaya rebels over the destruction, meets the
    king in trust over food, receives the king's promise to restore the vihara, and
    reconciles with him.
  language: English
  quote_policy: summarized
