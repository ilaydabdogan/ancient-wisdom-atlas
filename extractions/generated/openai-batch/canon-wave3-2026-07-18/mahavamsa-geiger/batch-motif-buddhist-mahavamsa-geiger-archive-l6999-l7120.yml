canonical_text:
  quote: ''
  summary: The passage recounts the illness and death of the thera Tissa, who lacks
    needed ghee and enters nibbana through fire-meditation, leaving bones as relics.
    King Asoka honors the relics and institutes medicinal support for monks. The thera
    Sumitta also enters nibbana while walking in meditation. Later, increased monastic
    revenue attracts heretics who put on the yellow robe and teach their own doctrines
    among the bhikkhus. Moggaliputta, seeing danger to the doctrine, withdraws alone
    to Ahoganga-mountain after entrusting his company to Mahinda. Because heretics
    are numerous and unruly, regular ceremonies cease for seven years. King Dhammasoka
    sends a minister to compel the uposatha ceremony; when the bhikkhus refuse to
    hold it with heretics, the minister begins beheading theras.
  language: English
  quote_policy: summarized
