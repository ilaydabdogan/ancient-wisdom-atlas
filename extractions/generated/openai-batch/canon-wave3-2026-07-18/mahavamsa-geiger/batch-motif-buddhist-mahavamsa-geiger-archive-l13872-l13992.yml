canonical_text:
  quote: ''
  summary: King Dutthagamani recalls a handed-down prophecy and a written gold-plate
    record foretelling that he will build the Great Thupa and the nine-storied Lohapasada.
    He asks the bhikkhu brotherhood for a drawing of a celestial palace. Eight enlightened
    theras go to the heaven of the Thirty-three, see the airborne gem-palace of Birani,
    a former serving-woman reborn there through lifelong giving, and return with a
    drawing. The king builds the Lohapasada after this model, pays workers, and the
    palace is described as a richly adorned nine-storied structure.
  language: English
  quote_policy: summarized
