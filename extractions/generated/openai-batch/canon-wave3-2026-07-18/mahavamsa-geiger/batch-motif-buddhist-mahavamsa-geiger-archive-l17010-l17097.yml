canonical_text:
  quote: ''
  summary: The passage describes a king's elaborate consecration festival for a cetiya
    at Cetiya-mountain, including decorated roads, lamps, gates, music, largess, almsgiving,
    gifts to monks and nuns, remission of prison penalties, and the carrying out of
    earlier meritorious royal works. The king symbolically gives himself, his queen,
    his sons, and state animals to the monastic brotherhood and then redeems them
    with gifts. He builds several viharas and grants land to viharas in response to
    services by samaneras. A concluding verse praises powerful men who do pious works
    without harming the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king provides gems, a red covering, golden balls, and pearl festoons for
    fastening to the cetiya.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Around the Cetiya-mountain the king prepares a tract measuring a yojana, makes
    four gateways and a road, sets up traders' shops on both sides, and adorns the
    road with flags, arches, and triumphal gates.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king illuminates the festival area with chains of lamps, lays carpets
    on the road from the Kadamba-river to the Cetiya-mountain, gives largess at the
    four gates of the capital, and extends chains of lamps over the island and nearby
    ocean waters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The consecration festival of the cetiya is identified in the passage as the
    great Giribhanda-offering.
  category: other
  evidence_refs:
  - ev:1
- id: obs:5
  text: The king commands almsgiving in eight places for bhikkhus gathered at the
    festival assembly, uses eight golden drums, gives lavish gifts to twenty-four
    thousand bhikkhus, distributes six garments, remits prison penalties, and orders
    barbers to work at the four gates.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king carries out works of merit that had been decreed by kings of old
    and by his brother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The king gives himself, the queen, his two sons, his state-elephant, and his
    state horse to the brotherhood as their own, although the brotherhood forbids
    him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The king gives possessions to the brotherhood of bhikkhus and to the company
    of bhikkhunis, and by giving suitable possessions he redeems himself and the others
    from the brotherhood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The ruler builds named viharas at Kalayanakannika, on the bank of the Kubukanda-river,
    and in Huvacakannika.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After a samanera at Pasanadipaka gives the king a draught of water, the king
    grants land around that vihara for the use of the brotherhood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The prince also grants land to the Mandavapi-vihara for the use of the brotherhood
    after rejoicing at the behavior of a samanera there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The concluding verse states that men of good understanding who have attained
    great power and overcome pride, indolence, and attachment to lust do many pious
    works without harming the people.
  category: speech
  evidence_refs:
