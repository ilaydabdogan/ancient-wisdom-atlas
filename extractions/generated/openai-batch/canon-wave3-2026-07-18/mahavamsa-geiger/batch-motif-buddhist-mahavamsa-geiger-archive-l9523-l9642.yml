canonical_text:
  quote: This Mahamegha-park do I give to the brotherhood.
  summary: In the Mahamegha-park episode, Mahinda and the theras teach assembled women,
    accept royal hospitality, advise on women’s ordination through Samghamitta, and
    receive the Mahamegha-park from the king through a water-pouring gift. Earthquakes
    are interpreted as signs that the doctrine is founded in the island and that the
    site renews an earlier monastic function from the lifetimes of previous Buddhas.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Because the elephant's hall was too small, seats were prepared for the theras
    outside the southern gate in the shaded Nandana-garden of the royal park.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The thera sat in the garden, noble women gathered at his feet, he preached
    the Balapandita-suttanta, and a thousand women attained the first stage of salvation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The theras intended to go to the mountain, but the king proposed the Mahamegha-park
    as a resting place that was neither too far nor too near and had water and shade.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cetiya later built at the place where the thera turned back was called Nivatta-cetiya.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king led the thera to the Mahamegha-park, had beds and chairs prepared,
    and the theras stayed there for the night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the morning the king brought flowers, greeted the theras, offered flowers
    in homage, and asked whether their rest and the garden were fitting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The thera said that an arama was allowed to the brotherhood and related the
    acceptance of the Veluvanarama.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Queen Anula came with five hundred women, attained the second stage of salvation,
    and she and the women asked to receive the pabbajja-ordination.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The thera said it was not allowed for them to bestow pabbajja on women, and
    named Samghamitta in Pataliputta as the nun who should come with bhikkhunis and
    the southern branch of the great Bodhi-tree to confer ordination.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The king took a splendid vase and poured water over Mahinda's hand as the
    token of giving the Mahamegha-park to the brotherhood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the water fell on the ground, the earth quaked, and the thera explained
    that the doctrine was founded in the island.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The king offered jasmine blossoms; the thera scattered eight handfuls around
    a picula-tree; the earth quaked again, and the thera explained that a malaka for
    the brotherhood's duties had existed there in the lifetimes of three Buddhas and
    would exist there once more.
  category: sequence
  evidence_refs:
  - ev:9
