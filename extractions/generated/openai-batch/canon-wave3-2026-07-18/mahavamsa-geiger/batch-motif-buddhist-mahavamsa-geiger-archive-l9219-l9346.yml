  text: The king arranged a water-festival for the city-dwellers and went out to hunt
    on foot with forty thousand men at a mountain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deva of the mountain wanted to show the theras to the king and appeared
    as an elk-stag browsing in a thicket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king considered it unseemly to kill an unheeding creature, sounded his
    bowstring, and pursued the fleeing stag toward the mountain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the stag drew near to the thera and the thera came into the king's view,
    the deva vanished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The thera first allowed the king to see him alone; the king was terrified
    when the thera called him by name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The thera identified himself and his companions as samanas, disciples of the
    King of Truth, who had come from Jambudipa out of compassion for the king.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After hearing the thera's words, the king's fear left him; he laid aside bow
    and arrow, approached the sage, exchanged greetings, and sat near him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The thera made his other companions visible after the king's people had arrived.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The thera said Jambudipa was full of yellow-robed disciples of the Buddha,
    including many arahants with learning and miraculous powers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: When asked by what way they had come, the thera answered that they came neither
    by land nor by water, and the king understood that they had come through the air.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The thera tested the king with questions about a mango tree, other trees,
    kinfolk, non-kin, and the king himself, and praised his shrewd wit.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After recognizing the king as keen-witted, the thera preached the Culahatthipadupama-suttanta,
