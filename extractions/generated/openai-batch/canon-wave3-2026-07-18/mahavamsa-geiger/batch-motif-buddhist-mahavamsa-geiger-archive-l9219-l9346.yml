canonical_text:
  quote: ''
  summary: King Devanampiyatissa goes hunting near a mountain with a large retinue.
    A mountain deva appears as an elk-stag and leads him toward a thera, who identifies
    himself as a Buddhist ascetic from Jambudipa. The king lays aside his bow and
    arrow, speaks with the thera, learns that the thera's companions came through
    the air, answers a test of reasoning about a mango tree and kinship, and then
    hears a discourse. The king and forty thousand men take the three refuges. Later
    the theras decline an evening meal, remain outside the city, and arrange for the
    young Bhandu/Bhanduka to receive pabbajja.
  language: English
  quote_policy: summarized
literal_observations:
