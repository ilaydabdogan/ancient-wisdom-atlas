  quote: thus is mortality the destroyer of the whole world.
  summary: The passage says that learned religious women who had expounded Buddhist
    scripture eventually came under mortality; King Uttiya reigned ten years; mortality
    is declared the destroyer of the whole world. A didactic reflection states that
    one who knows mortality’s irresistible power but remains undisillusioned with
    existence is knowingly fooled by the fetters of delusion. The chapter closes as
    'The Nibbana of the Thera,' followed by a translator’s grammatical note.
