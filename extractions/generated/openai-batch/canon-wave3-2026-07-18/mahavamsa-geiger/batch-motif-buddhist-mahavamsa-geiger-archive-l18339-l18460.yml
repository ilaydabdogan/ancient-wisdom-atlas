canonical_text:
  quote: Thus did he gather to himself much merit and much guilt.
  summary: The passage recounts violent retaliation for the destruction of the Mahavihara,
    restoration and reoccupation of monastic buildings, a boundary dispute around
    the Jetavana-vihara, the expulsion of Tissa from the order, Mahasena's founding
    of Buddhist institutions including some built after destroying brahmanical temples,
    his donations to monks, his irrigation works, and the chronicle's closing moral
    assessment of his reign.
  language: English
  quote_policy: quoted
