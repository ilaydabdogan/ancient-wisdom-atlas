canonical_text:
  quote: ''
  summary: Vijaya, lacking a son, seeks a successor from his brother Sumitta's line
    and dies before the prince arrives. Sumitta's youngest son Panduvasudeva travels
    to Lanka with companions disguised as mendicant monks, is recognized after a soothsayer's
    prediction, and is entrusted with sovereignty but not consecrated because he lacks
    a consort. Separately, Sakka Pandu sends his daughter Bhaddakaccana with thirty-two
    women-friends on a ship down the Ganges after omens predict an auspicious journey
    leading to royal consecration. They arrive in Lanka disguised as nuns, are recognized,
    and Panduvasudeva is consecrated king.
  language: English
  quote_policy: summarized
