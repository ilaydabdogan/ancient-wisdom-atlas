canonical_text:
  quote: ''
  summary: The introduction discusses the reliability of the Ceylonese Buddhist chronicles.
    It says the chronicles are generally modest and simple, while also containing
    fables and marvels connected with events that celebrate the Buddhist Order. Examples
    include Mahinda’s miraculous flight to Ceylon, miraculous phenomena at the Establishment
    of the Doctrine, the arrival of relics, and the planting of the Bodhi-tree. The
    passage frames such marvels as legendary or mythical additions around a simpler
    historical nucleus and argues that criticism should both examine the historical
    residue and seek the meaning of the mythical layer.
  language: English
  quote_policy: summarized
