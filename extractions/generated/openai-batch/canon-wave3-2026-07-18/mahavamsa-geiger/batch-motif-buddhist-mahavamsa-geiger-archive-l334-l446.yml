  quote: ''
  summary: A scholarly introduction discusses literary questions concerning the Dipavamsa
    and Mahavamsa, defends the view that these Ceylonese chronicles rest on older
    historical materials, summarizes objections by R. O. Franke, and lists conclusions
    about an older Atthakatha-Mahavamsa tradition, its recensions, its continuation,
    and its use by the Dipavamsa, Mahavamsa, Buddhaghosa, and the Mahavamsa-Tika.
