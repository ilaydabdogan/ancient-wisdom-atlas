canonical_text:
  quote: ''
  summary: A thera descends through the earth to the palace of the nagas to request
    relics said to be appointed by the Buddha for enshrinement in the Great Thupa.
    The naga-king, unwilling to surrender them, signals his nephew Vasuladatta, who
    swallows the urn containing the relics and coils at the foot of Mount Sineru while
    manifesting many hoods, smoke, fire, and surrounding snakes. After the naga-king
    tries to persuade the thera to leave the relics in the jeweled naga cetiya, the
    thera argues that they should be taken where the truth is understood. The naga
    says that if the thera sees the relics he may take them. The thera creates a long
    slender arm, reaches down Vasuladatta's throat, takes the urn, and returns through
    the earth to his cell. The nagas lament, while the gods rejoice and honor the
    relics.
  language: English
  quote_policy: summarized
