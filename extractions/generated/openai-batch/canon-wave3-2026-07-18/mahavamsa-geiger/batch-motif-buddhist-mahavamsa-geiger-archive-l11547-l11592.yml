canonical_text:
  quote: ''
  summary: The passage gives a chronology after the planting of the great Bodhi-tree
    under king Dhammasoka, including the deaths of Asamdhimitta and Dhammasoka and
    Tissarakkha's destruction of the tree with a mandu-thorn. It then narrates king
    Devanampiyatissa asking a learned thera where to obtain relics for thupas, receiving
    instructions about relics brought by Sumana and kept on Cetiya-mountain, and bringing
    them for the founding of viharas.
  language: English
  quote_policy: summarized
