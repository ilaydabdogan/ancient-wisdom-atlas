canonical_text:
  quote: ''
  summary: The passage includes notes on monuments and then narrates royal building
    works, the overthrow of King Khallatanaga by a commander, Vattagamani's killing
    of that commander and assumption of rule, rebellion by the brahman Tissa, the
    landing of seven Damilas, demands concerning the royal parasol, the defeat and
    flight of the king, a mocking cry by the nigantha Giri, the king's conditional
    vow to build a vihara, the protection and separation of members of the royal household
    during flight, the hiding of the almsbowl used by the Conqueror, and the giving
    of food to the king by the thera Mahatissa.
  language: English
  quote_policy: summarized
