canonical_text:
  quote: ''
  summary: During Dutthagamani's campaign, the elephant Kandula is injured by smoking
    pitch, recovers in water, is treated and armored, and breaks down an iron gate.
    Warriors then enter or breach the city by separate paths and fight the Damilas.
    Dutthagamani continues the campaign through several strongholds, camps near Kasa-mountain,
    and holds a water-festival. Elara and Dutthagamani prepare for battle; Dutthagamani
    arranges decoy royal figures in thirty-two troop bodies. Dighajantu destroys the
    decoys but is killed by Suranimila, after which Phussadeva blows a conch, the
    Damila army scatters, and Elara flees.
  language: English
  quote_policy: summarized
