  quote: ''
  summary: Appendix glossary entries define selected Pali Buddhist terms, including
    monastic ranks and rites, the Tathagata, stupas and sanctuaries, the Tipitaka,
    ordination, Uposatha observance, and architectural terms connected with stupas
    and bodhi-trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pavarana is defined as a festival held by bhikkhus at the close of the rainy-season
    residence in the monastery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Samana is defined as an ascetic designation for Buddhist priests as opposed
    to the Brahmana.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tathagata is identified as a term of veneration applied to Buddhas, and the
    Buddha is said usually to speak of himself with this term; its meaning is described
    as controversial.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thera and theri are respectful terms for monks and nuns, especially those
    of venerable age, while samghatthera denotes the senior priest in an assembly
    or community.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A thupa is described as an edifice serving as a receptacle for a relic or
    as a monument, with a base, tee, spire, and interior relic-chamber.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cetiya is described as a general term for sanctuary; a tree can be a cetiya,
    and the term is often used as a synonym for thupa in the Mahavamsa.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Upasampada is defined as the solemn ordination of a novice monk by a chapter
    of the order, described as the higher consecration of the priesthood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Uposatha is described as a Buddhist holy day for priests and laymen, occurring
    four times monthly on lunar dates and including recitation of Patimokkha precepts
    and confession.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: An uposathagara or uposathaghara is a monastery building used for Uposatha
    ceremonies.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: A bodhighara is described as a temple for a bodhi-tree, built around rather
    than over the sacred tree.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Vedi or vedika can mean terrace, altar, terrace with balustrade, or railing;
    a stone terrace around the bodhi-tree is given as one example.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Tipitaka is explained literally as 'three baskets' and as the collective name
    for the Buddhist canonical scriptures divided into Vinaya, Sutta or Dhamma, and
    Abhidhamma.
  category: object
  evidence_refs:
  - ev:11
