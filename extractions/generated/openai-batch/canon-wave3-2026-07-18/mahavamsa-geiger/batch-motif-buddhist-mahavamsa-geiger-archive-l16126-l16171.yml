canonical_text:
  quote: ''
  summary: The passage describes King Dutthagamani showing himself in glory, circling
    the Great Thupa three times on a car, doing homage to the thupa and the brotherhood,
    and entering Tusita-heaven. It then records memorial halls and a cremation place
    named after actions surrounding his death. The passage predicts future roles for
    Dutthagamani and his family in relation to Metteyya, and closes with a moral statement
    that merit leads one to heaven.
