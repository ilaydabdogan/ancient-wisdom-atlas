canonical_text:
  quote: Vijaya's arrival in Ceylon is dated on the day of the Buddha's death.
  summary: The passage is a scholarly introduction discussing chronological difficulties
    in the Ceylonese chronicles. It argues that some reign lengths are schematic or
    impossible, suggests that early chronology was lengthened to make Vijaya and the
    Buddha contemporaries, identifies Devanampiyatissa's reign and Mahinda's arrival
    as a clearer historical point, and describes the year of the Buddha's death and
    Asoka's consecration date as key chronological anchors in the tradition.
  language: English
  quote_policy: quoted
