canonical_text:
  quote: ''
  summary: The passage closes the account of Asoka’s consecration with marvels of
    animals and birds providing service and food. It then describes Asoka feeding
    and testing religious groups, seeing the novice Nigrodha, and learning the background
    of Nigrodha’s royal birth, flight, protection by a tree guardian, ordination,
    and attainment of arahantship. The passage also begins a former-life account involving
    honey traders, paccekabuddhas, a maiden at a river-bank, and an overflowing honey
    gift accompanied by a wish for sovereignty.
  language: English
  quote_policy: summarized
