  summary: The passage presents a comparative scholarly discussion of royal lists
    around Bimbisara, Ajatassattu/Ajatasatru, Udayabhadda/Udayin, Munda, Kalasoka/Kakavarnin,
    the Nandas, Candagutta, and Bindusara. It compares Ceylonese/Mahavamsa, Burmese,
    Jaina, Puranic, Northern Buddhist, and Chinese-pilgrim traditions, focusing on
    name correspondences, omissions, succession placement, and the disputed attribution
    of moving the royal residence from Rajagrha to Pataliputra.
