canonical_text:
  quote: ''
  summary: A queen devoted to offerings laments childlessness. A thera with supernormal
    powers directs her to a dying samanera. After offerings and repeated pleading,
    the samanera wishes for rebirth in the royal family, dies, and is reborn in the
    queen’s womb. During pregnancy the queen has unusual longings involving honey,
    a warrior’s severed head and sword-washing water, and unfaded lotus flowers. Soothsayers
    interpret the longings as signs that her son will defeat the Damilas, unite the
    kingdom, and make the doctrine shine. The king arranges to satisfy the longings,
    including through a countryman’s discovery of honey and Velusumana’s mission to
    Anuradhapura.
  language: English
  quote_policy: summarized
