canonical_text:
  quote: thus does faith in the Tathagata bring a rich reward.
  summary: A thera secretly contributes a brick to the Great Thupa and is later identified
    and rewarded through the king's agent. The passage then states that wage laborers
    on the Great Thupa were converted and went to heaven; two former women laborers,
    reborn among the gods, return with flowers to worship the thupa and tell the thera
    Mahasiva that their work on the Great Thupa brought this reward. Miraculous theras
    cause the flower-offering terraces to sink to ground level, and the king assembles
    a large brotherhood of bhikkhus.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An unnamed thera, described as a kinsman of a brick-worker, made a brick to
    the exact measure, deceived the work-people, and gave the brick to a workman,
    who laid it in the thupa; a quarrel arose.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king asked whether the brick could be recognized; the workman answered
    that it was impossible, but said that he knew the thera.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king placed an overseer near the workman so that the thera might be made
    known.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The overseer visited the thera in the Katthahala-parivena, learned the day
    and destination of the thera's departure, and reported this to the king.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king ordered gifts for the thera, including garments, a red coverlet,
    samana requisites, sugar, and fragrant oil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king's agent accompanied the thera, seated him in a cool shady place with
