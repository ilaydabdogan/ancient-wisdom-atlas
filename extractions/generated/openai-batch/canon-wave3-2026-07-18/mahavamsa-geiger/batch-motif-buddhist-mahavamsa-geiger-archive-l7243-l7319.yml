canonical_text:
  quote: the great earth shook at the close of the council
  summary: King Asoka assembles the bhikkhus, tests doctrinal affiliations, expels
    adherents of false doctrine, confirms the Vibhajja-doctrine with the thera, and
    supports a council in which Tissa and a thousand learned bhikkhus compile and
    defend the true doctrine. The council closes with a pavarana-ceremony, and the
    earth shakes as a sign of applause to the re-establishment of doctrine.
  language: English
  quote_policy: quoted
