canonical_text:
  quote: ''
  summary: 'The passage recounts several men of exceptional strength or skill who
    are brought into royal service: Gothaka/Gothaimbara proves his strength by clearing
    trees; Gothabhaya/Theraputtabhaya shows prodigious youthful strength and becomes
    known as a warrior while his father attains Buddhist liberation and ordains; Bharana
    becomes known as a great warrior through hunting feats; and Velusumana is recognized
    by an untamed Sindhu-horse, performs an extraordinary ride, and enters the king’s
    service.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gothaka, a son of Mahanaga in Nitthulavitthika, is described as strong as
    ten elephants, short in stature, and mocked by six elder brothers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When his brothers left him a share of forest-clearing work, Gothaka tore up
    imbara trees and leveled the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the brothers saw Gothaka’s work, they praised him; because of the feat
    he bore the name Gothaimbara, and the king commanded him to stay with Gamani.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rohana, headman of Kitti near the Kota-mountain, named his son Gothabhaya;
    at age ten to twelve the boy threw stones as play balls that four or five men
    could not lift.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: At sixteen, Gothabhaya used a very large club made by his father to fell palmyra
    and coco-palm stems; he became known as a warrior, and the king commanded him
    to stay with Gamani.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rohana heard a discourse by the thera Mahasumma at Kota-pabbata-vihara, attained
    sotapatti, transferred household headship to his son, and received pabbajja from
    the thera.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Rohana practiced meditation and attained arahantship; because of this, his
    son was called Theraputtabhaya.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bharana, son of Kumara of Kappakandara, killed hares with his foot as a boy
    and later killed antelopes, elks, and boars in a similar way; he became known
    as a great warrior, and the king commanded him to stay with Gamani.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Vasabha of Kutumbiyangana had a son; Vela and Sumana, governor of Giri, brought
    gifts and gave their names to the boy, who later lived in the governor’s house.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A Sindhu-horse belonging to the governor allowed no man to mount, but on seeing
    Velusumana it thought he was a worthy rider and neighed joyfully.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Velusumana mounted the horse, made it gallop in a circle, appeared as a chain
    of men on the horse’s back, and adjusted his mantle fearlessly while bystanders
    applauded.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The governor of Giri rewarded Velusumana, gave him into the king’s service,
    and the king made him dwell near him with honor and favor.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
