canonical_text:
  quote: ''
  summary: Siggava repeatedly visits the house of the brahman Moggali after the birth
    of Tissa. Moggali first reproaches him but then gains faith and supports him.
    When Tissa grows learned in the three Vedas, Siggava contrives to sit in Tissa's
    seat, provoking a dialogue about mantras. Siggava demonstrates knowledge of the
    Vedas and asks a difficult question from the Buddha's teaching. Tissa asks to
    learn it, is told it is given only to one wearing the robe, and with parental
    permission receives ordination. He learns meditation, scripture, vinaya, gains
    insight and supernormal powers, and becomes renowned. The following chapter begins
    with prince Tissa seeing joyful gazelles while hunting.
  language: English
  quote_policy: summarized
