canonical_text:
  quote: ''
  summary: Dhammasoka appoints many guardians and escorts for the great Bodhi-tree,
    brings it with Samghamitta and other bhikkhunis to a ship, consecrates the tree
    with kingship, and sends it by sea. The king grieves as it departs. Miraculous
    signs accompany the voyage. Nagas attempt to obtain the tree, but Samghamitta
    frightens them by taking a griffin form; they worship the tree in the serpent
    realm and return it to the ship. The tree arrives at Jambukola, where Devanampiyatissa
    has prepared for its arrival and sees it by the theri's power.
  language: English
  quote_policy: summarized
