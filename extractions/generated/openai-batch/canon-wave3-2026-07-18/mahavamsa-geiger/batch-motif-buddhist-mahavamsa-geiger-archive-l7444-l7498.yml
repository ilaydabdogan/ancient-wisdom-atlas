canonical_text:
  quote: "“on a ship and sent them forth upon the sea”"
  summary: Sihabahu transfers kingship, returns with Sihasivali to his birthplace,
    builds Sihapura, founds villages, and rules with Sihasivali as queen. Sihasivali
    bears repeated pairs of twin sons, including Vijaya and Sumitta, and Vijaya becomes
    prince-regent. Vijaya and his followers commit violent acts; after repeated complaints,
    the king punishes Vijaya and seven hundred followers by half-shaving their heads
    and sending them away by ship, with wives and children also sent forth. The separated
    groups land in different places. Vijaya eventually lands in Lanka at Tambapanni
    on the day of the Tathagata’s passing into nibbana.
  language: English
  quote_policy: quoted
