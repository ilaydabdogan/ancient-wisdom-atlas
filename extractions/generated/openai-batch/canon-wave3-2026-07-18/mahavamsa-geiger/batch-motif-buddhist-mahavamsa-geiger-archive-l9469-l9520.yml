  quote: ''
  summary: A fragment notes an aerial arrival at a spot before a driver arrived. The
    passage then reports women attaining the first stage of sanctification, townspeople
    gathering at the palace gates to see the theras, the king ordering the state-elephant
    hall prepared for them, and the great thera preaching there. The townspeople are
    filled with faith, a thousand attain the first stage of salvation, and the narrator
    says the peerless thera preached the true doctrine in Lanka in the island's speech
    and brought about the descent of the true faith.
