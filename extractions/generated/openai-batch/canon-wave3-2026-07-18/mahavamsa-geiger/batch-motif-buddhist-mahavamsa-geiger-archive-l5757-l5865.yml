canonical_text:
  quote: ''
  summary: Theras and bhikkhus assemble to settle a dispute over the Ten Points by
    seeking the learned thera Revata. Rival Vajjian or heretical bhikkhus attempt
    to win support through gifts and then mislead King Kalasoka about the Mahavana-vihara.
    Salha discerns the true doctrine and is encouraged by Brahma, while Revata rejects
    the Ten Points and refuses the rival faction. The king’s ministers are diverted
    by devas; the king dreams of being hurled into Lohakumbhi hell, and his sister
    Nanda comes through the air to calm him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sixty great theras from Pava and eighty from Avanti, together with bhikkhus
    from different regions, gathered on the Ahoganga; the bhikkhus numbered ninety
    thousand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The assembled bhikkhus identified Revata of Soreyya as chief among them and
    went to seek him out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Revata heard their resolution by his divine ear, set out toward Vesali, and
    was eventually met at Sahajati.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yasa, acting as Sambhuta had charged him, questioned Revata about the Ten
    Points; Revata rejected them and proposed ending the dispute.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The heretical bhikkhus sought Revata’s support by preparing ascetic requisites,
    taking ship to Sahajati, and providing abundant food at mealtime.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Salha perceived that those of Pava held the true doctrine; Brahma approached
    and told him to stand firm in the doctrine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Revata did not take the part of the monks who brought gifts and dismissed
    the pupil who took their part.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The rival monks went to King Kalasoka and claimed that country bhikkhus intended
    to take the Mahavana-vihara from them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A large assembly of bhikkhus came together under Revata to bring the dispute
    to a peaceful end, and the dispute was to be settled at Vesali.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Kalasoka sent ministers, but they were led elsewhere by the design of the
    devas.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Kalasoka dreamed that he was hurled into Lohakumbhi hell; Nanda, his sister
    and a theri free from the asavas, came through the air to calm his fears.
  category: sequence
  evidence_refs:
  - ev:9
