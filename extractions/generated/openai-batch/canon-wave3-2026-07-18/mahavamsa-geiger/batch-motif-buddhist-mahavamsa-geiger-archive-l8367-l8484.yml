candidate_motifs:
- id: motif:1
  label: royal consecration through regalia and water
  taxonomy_refs:
  - royal_legitimacy
  basis: Pandukabhaya uses the state parasol of his uncles, has it purified in a pond,
    consecrates himself with that water, consecrates his spouse as queen, and assigns
    offices after victory.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage supports a royal legitimation pattern; it does not present
    the consecration as divine judgment or cosmic renewal.
- id: motif:2
  label: supernatural yakkhini aid in royal victory
  taxonomy_refs:
  - shapeshifter
  basis: A yakkhini gives cunning counsel, the prince rides a yakkha-mare into battle,
    the yakkhini neighs during the attack, and the mare-form yakkhini is later housed
    in the royal precincts.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  confidence: medium
  cautions: The excerpt reports a mare-form yakkhini but does not narrate a detailed
    transformation episode.
- id: motif:3
  label: foundation of capital and ordering of sacred-civic space
  taxonomy_refs:
  - royal_legitimacy
  - culture_hero
  basis: After victory and consultation with a site expert, Pandukabhaya founds Anuradhapura
    and lays out suburbs, tanks, cemetery, execution place, ritual sites, trees, and
    a sacrificial house.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: medium
  cautions: The passage presents royal urban planning; the culture-hero classification
    is tentative because no broad civilizing myth is explicitly stated.
- id: motif:4
  label: ritualized exchange with local supernatural beings
  taxonomy_refs:
  - sacred_exchange
  basis: The king settles yakkhas and yakkhinis in city locations, rewards a former
    helper reborn as a yakkhini, makes annual offerings to them, and honors Cittaraja
    with an equal-height festival seat.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: Reciprocity is explicit for the former helper and suggested by the broader
    settlement and offering pattern; the passage does not explain all yakkha relationships
    equally.
- id: motif:5
  label: etiological naming from conquest and foundation events
  taxonomy_refs: []
  basis: The passage explains place names from the commander’s flight, the skull heap
    likened to gourds, the name Anuradhapura, and the naming of Jayavapi after victory-water
    used for consecration.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: No supplied taxonomy reference directly corresponds to place-name etiology.
