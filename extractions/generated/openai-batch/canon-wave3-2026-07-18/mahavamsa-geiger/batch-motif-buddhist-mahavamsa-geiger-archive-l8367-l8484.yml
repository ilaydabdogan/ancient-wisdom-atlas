canonical_text:
  quote: ''
  summary: The passage narrates Pandukabhaya’s victory over his enemies through the
    counsel and aid of a yakkhini, the killing of his enemy army and uncles, the founding
    and naming of Anuradhapura, his consecration using a purified royal parasol and
    pond water, his appointment of relatives and followers to offices, his settlement
    and ritual honoring of yakkhas, and his layout of civic and ritual places around
    the city.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An army in battle array established a fortified camp near a small city, placed
    a commander at its head, and surrounded Arittha-mountain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After speaking with the yakkhini, the prince followed her cunning counsel
    and sent soldiers ahead with kingly apparel, weapons, and a peace message.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The enemy were lulled to security and thought they would capture the prince
    if he came.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prince mounted the yakkha-mare and went to battle at the head of a great
    host.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The yakkhini neighed loudly, and the prince’s army, both inside and outside
    the camp, raised a mighty battle-cry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prince’s men killed the enemy soldiers and the eight uncles, then raised
    a pyramid of skulls.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The commander escaped to a thicket, and the passage explains names for Senapatigumbaka
    and Labugamaka from the battle events.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the victory, Pandukabhaya went to his great-uncle Anuradha, received
    his palace, consulted a soothsayer versed in suitable sites, and founded the capital
    Anuradhapura.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The capital was called Anuradhapura because it had been a dwelling of two
    Anuradhas and because it was founded under the constellation Anuradha.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pandukabhaya had the state parasol of his uncles purified in a natural pond,
    kept it for himself, and consecrated himself with water from the same pond.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Pandukabhaya consecrated Suvannapali as queen and appointed Canda as chaplain,
    with other followers appointed according to their merits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Because Abhaya had befriended him and his mother, Pandukabhaya did not kill
    him but gave him night-time government as Guardian of the City.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Pandukabhaya also spared Girikandasiva and handed over the district of Girikanda
    to him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The pond used for consecration was deepened, filled with water, and named
    Jayavapi because the victorious king had taken water from it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Pandukabhaya settled named yakkhas and yakkhinis at specified locations around
    and within the city.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Year by year he had sacrificial offerings made to the yakkhas, and on festival
    days he sat with Cittaraja on an equal-height seat while gods and men danced before
    him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: He laid out suburbs, the Abhaya-tank, a cemetery, an execution place, shrines
    or ritual places, trees linked with named beings, a ground for Yonas, and the
    house of the Great Sacrifice near the west gate.
  category: action
  evidence_refs:
  - ev:10
