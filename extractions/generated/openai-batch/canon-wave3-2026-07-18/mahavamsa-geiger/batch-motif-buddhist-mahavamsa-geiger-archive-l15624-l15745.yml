canonical_text:
  quote: ''
  summary: The Buddha relics return to their casket, are borne in procession, and
    are placed by the king on a jewelled throne and splendid couch. After ritual washing
    and perfuming, the king makes a conditional wish that the relics remain undisturbed,
    serve as refuge for the people, and rest in the form of the Master on his deathbed.
    The relics assume that form; the earth quakes and wonders occur. The king offers
    a white parasol, grants the relics overlordship of Lanka for seven days, sponsors
    offerings and recitations, and commands public worship. Indagutta enables worshippers
    from all Lanka to come and return. The brotherhood entrusts two novices with sealing
    the chamber, and perfected theras command that flowers, perfumes, lamps, and stones
    remain imperishable. The people enshrine thousands of relics above the great relic
    treasure, and the king completes the thupa and its four-sided building. The passage
    closes with a statement on the incomprehensibility of Buddhas and the merit of
    pious deeds.
  language: English
  quote_policy: summarized
