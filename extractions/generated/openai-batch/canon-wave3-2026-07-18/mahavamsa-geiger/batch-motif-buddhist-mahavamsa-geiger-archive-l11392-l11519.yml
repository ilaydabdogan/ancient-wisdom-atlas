  summary: A miraculous fruit from the Bodhi-tree is planted by the king and produces
    young Bodhi-trees. Saplings are distributed to sacred sites. Samghamitta and other
    monastics are associated with ordination, buildings, and the establishment of
    places connected to the tree. A state-elephant’s behavior leads to the building
    of a thupa with a relic.
