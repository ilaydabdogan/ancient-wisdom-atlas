  text: The return-gift includes royal and ritual objects such as a fan, diadem, sword,
    parasol, shoes, turban, ornaments, chains, pitcher, garments, litter, healing
    herbs, rice, and other items said to be needful for consecrating a king.
  category: object
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: The list includes unguent brought by nagas, red earth, water from lake Anotatta,
