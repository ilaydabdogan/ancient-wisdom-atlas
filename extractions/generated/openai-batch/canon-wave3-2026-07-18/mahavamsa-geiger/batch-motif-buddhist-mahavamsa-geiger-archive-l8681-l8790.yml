canonical_text:
  quote: ''
  summary: Dhammasoka prepares and sends a return-gift of royal consecration objects,
    ritual materials, and the true doctrine to his friend, the ruler of Lanka. The
    envoys travel to Lanka, deliver the gifts, and consecrate the ruler again as king;
    the consecration is celebrated on the Vesakha full moon.
  language: English
  quote_policy: summarized
