canonical_text:
  quote: ''
  summary: The passage recounts how King Asoka teaches Prince Tissa about fear of
    death, leading Tissa toward faith. Tissa then sees the thera Mahadhammarakkhita
    attended by a cobra, witnesses the thera display miraculous abilities involving
    flight and water, and resolves to receive ordination. Tissa, Aggibrahma, and many
    others are ordained. The passage then describes the completion of viharas and
    cetiyas under royal patronage, followed by Asoka's proclamation of a widespread
    religious festival with offerings, adornments, observance, and religious discourse.
  language: English
  quote_policy: summarized
