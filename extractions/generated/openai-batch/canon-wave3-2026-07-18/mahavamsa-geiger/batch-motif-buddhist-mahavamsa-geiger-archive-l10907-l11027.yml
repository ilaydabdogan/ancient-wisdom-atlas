canonical_text:
  quote: '"The great Bodhi-trees must not be injured with a knife"'
  summary: Asoka hears that the theri must depart because many people are to receive
    pabbajja. He consults the bhikkhus about sending the great Bodhi-tree to Lanka;
    Moggaliputta confirms it and recalls the Buddha's resolutions. Asoka prepares
    and adorns the road to the Bodhi-tree, receives a golden vase made by Vissakamma,
    approaches the decorated tree with army, monks, and princes, and worships it.
    After the south bough's branches vanish, Asoka consecrates the Bodhi-tree as king,
    draws a ritual line around the bough, and makes a solemn declaration. The branch
    severs itself, floats above the fragrant-earth-filled vase, and roots descend
    forming a net.
  language: English
  quote_policy: quoted
