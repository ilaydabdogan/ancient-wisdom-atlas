candidate_motifs:
- id: motif:1
  label: prophecy of a child who will kill royal kin for sovereignty
  taxonomy_refs:
  - royal_legitimacy
  basis: The brahmans foretell that Citta's son will slay his uncles for sovereignty,
    motivating the brothers' attempts to prevent or control the birth.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The passage frames the prophecy politically; broader mythic classification
    should be reviewed against the surrounding chronicle.
- id: motif:2
  label: guarded confinement of a woman to prevent a threatening birth
  taxonomy_refs: []
  basis: Citta is confined in a chamber with restricted access, a serving-woman inside,
    and soldiers outside after the prophecy about her future son.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No named taxonomy reference is assigned because the available list has
    no direct confinement motif.
- id: motif:3
  label: secret union bypassing guarded enclosure
  taxonomy_refs: []
  basis: Gamani enters Citta's chamber at night through the window by hook-ladder
    with the attendant's aid and continues to visit undiscovered.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage presents the event as a human stratagem rather than an explicitly
    supernatural episode.
- id: motif:4
  label: hidden royal child protected by infant substitution
  taxonomy_refs:
  - miraculous_child
  - royal_legitimacy
  basis: Citta's male child, threatened by the king's sons, is exchanged for another
    woman's daughter and named Pandukabhaya while the uncles believe a daughter was
    born.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The child's importance is tied to prophecy and royal succession; the birth
    itself is not described as biologically miraculous.
- id: motif:5
  label: slain attendants reborn as supernatural guardians
  taxonomy_refs:
  - death_rebirth
  basis: The herdsman Citta and slave Kalavela are killed, reborn as yakkhas, and
    guard the child in the womb.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage specifically names rebirth as yakkhas; interpretation of their
    wider religious status requires external context not used here.
- id: motif:6
  label: royal consecration following death of predecessor
  taxonomy_refs:
  - royal_legitimacy
  basis: Panduvasudeva dies when Pandukabhaya is born, and the king's sons then assemble
    to consecrate Abhaya.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a dynastic chronicle event; its mythic significance depends on
    comparison with the larger narrative.
- id: motif:7
  label: place-names grounded in ancestral settlement
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links several Lanka place-names to the settlements of named relatives
