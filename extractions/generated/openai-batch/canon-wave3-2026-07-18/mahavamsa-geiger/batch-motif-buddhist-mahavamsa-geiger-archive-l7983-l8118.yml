canonical_text:
  quote: ''
  summary: The passage recounts the birth prophecy concerning Citta, her confinement
    by her brothers, her secret union with Dighagamani, the threatened killing of
    any male child, the slaying and rebirth of two attendants as yakkha guardians,
    the substitution of a newborn daughter for Citta's son, the naming of Pandukabhaya,
    the death of Panduvasudeva, and the consecration of Abhaya. It also reports the
    arrival and settlements of Bhaddakaccana's brothers in Lanka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The queen bore ten sons and one daughter; the eldest son was named Abhaya
    and the youngest child, the daughter, was named Citta.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahmans skilled in sacred texts foretold that Citta's son would slay his
    uncles for the sake of sovereignty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Citta's brothers resolved to kill her, but Abhaya restrained them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Citta was lodged in a chamber with one pillar; its entry passed through the
    king's sleeping-chamber, with a serving-woman inside and one hundred soldiers
    outside.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Citta was called Ummadacitta because the sight of her beauty was said to drive
    men mad.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The brothers of princess Bhaddakaccana came to Lanka, visited Panduvasudeva
    and their youngest sister, then settled in places that received names associated
    with them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Anuradha built a tank and a palace south of it, and Panduvasudeva consecrated
    Abhaya as vice-regent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dighagamani, son of prince Dighayu, heard of Ummadacitta, came to Upatissagama
    out of longing for her, and was appointed to royal-court service with the vice-regent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Citta saw Gamani opposite her window, asked her serving-woman who he was,
    and learned that he was the son of her uncle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: With the serving-woman's cooperation, Gamani fastened a hook-ladder to the
    window at night, climbed up, broke the window, and entered Citta's chamber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Gamani had intercourse with Citta, stayed until daybreak, and returned repeatedly
    without being discovered because there was no entry to the chamber.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Citta became pregnant; the serving-woman told Citta's mother, who questioned
    Citta and then told the king.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The king and his sons decided to receive Dighagamani among them and give Citta
