canonical_text:
  quote: ''
  summary: A vanishing female speaker rebukes the king and urges him to reconcile
    with the venerable bhikkhus and protect their faith. The king travels to Vesali,
    hears both sides of the dispute, sides with the true faith, and promises protection.
    The brotherhood then uses an appointed panel of eight theras to settle the Ten
    Points. Revata questions Sabbakami, who judges the points unlawful according to
    tradition; the decision is repeated before the brotherhood and the opposing monks
    are refuted. Revata later selects seven hundred qualified arahants, who compile
    the dhamma at Valikarama under Kalasoka’s protection. The passage closes by saying
    the theras later attain nibbana and by reflecting on impermanence and striving
    for deliverance.
  language: English
  quote_policy: summarized
