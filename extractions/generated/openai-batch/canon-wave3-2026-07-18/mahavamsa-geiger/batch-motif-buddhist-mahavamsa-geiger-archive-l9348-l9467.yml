canonical_text:
  quote: ''
  summary: After an ordination and attainment of arahantship, Mahinda orders the novice
    Sumana to announce the time for preaching the dhamma across Tambapanni. The proclamation
    is heard over Lanka, echoed by earth-gods up to Brahma's heaven, and draws devas,
    nagas, and supannas to Mahinda's preaching. The next day the theras refuse the
    king's wagon and travel miraculously through the air to the east of the city,
    where the first cetiya later stands. The king prepares a pavilion and suitable
    seating, welcomes Mahinda and the theras into the city and palace, serves them,
    and summons Anula with five hundred women, who bow and make offerings before another
    sermon.
  language: English
  quote_policy: summarized
