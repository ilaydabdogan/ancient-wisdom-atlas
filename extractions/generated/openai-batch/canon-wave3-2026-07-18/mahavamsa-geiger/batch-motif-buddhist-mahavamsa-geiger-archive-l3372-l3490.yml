- id: obs:5
  text: The Puranas are described as assigning Nandivardhana and Mahanandin a combined
    reign of eighty-five years without recording deeds for them.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Puranas are said to insert Darsaka between Ajatasatru and Udayin, while
    the Pali canon is said to assert that Udayibhadda was the son and probably successor
    of Ajatasattu.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The passage identifies a chief difference between the Puranic and Ceylonese
    sources: the placement of Kalasoka/Kakavarna and his father in the dynastic series.'
  category: sequence
  evidence_refs:
  - ev:7
