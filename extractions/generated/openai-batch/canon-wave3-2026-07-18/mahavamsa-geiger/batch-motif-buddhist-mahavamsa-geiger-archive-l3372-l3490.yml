canonical_text:
  quote: ''
  summary: A scholarly introduction compares Buddhist, Jaina, Brahmanic, Puranic,
    Ceylonese, Tibetan, and Asokavadana traditions about early Indian royal succession,
    the founding or removal of the capital at Pataliputra, and the placement of kings
    such as Udayin, Kalasoka/Kakavarna, Munda, the Nandas, Candragupta, Bindusara,
    Asoka, and Sisunaga. The author argues that the Ceylonese chronicle tradition
    is generally preferable to the Puranic arrangement for this sequence.
  language: English
  quote_policy: summarized
