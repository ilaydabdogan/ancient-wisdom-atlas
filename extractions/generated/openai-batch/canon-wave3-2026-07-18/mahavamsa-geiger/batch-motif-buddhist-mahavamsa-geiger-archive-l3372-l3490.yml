  text: Hiuen-thsang is reported as saying that O-shu-kia or Wu-yau founded Pataliputra;
    the author says this cannot fit the third-century Dharmasoka and must reflect
    a tradition about an earlier king before Candragupta.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The removal of the royal residence is said to be attributed by Jaina and Brahmanic
    traditions to Udayin, and by Buddhist tradition to Kalasoka.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author rejects identifying all disputed names as one person and instead
    treats the evidence as a difference between Jaina-Brahmanic and Buddhist traditions.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author states a preference for the Ceylonese Chronicles over the Puranic
    list.
  category: speech
  evidence_refs:
