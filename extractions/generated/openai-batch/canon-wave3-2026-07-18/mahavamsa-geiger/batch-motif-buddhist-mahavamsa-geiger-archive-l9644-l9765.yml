  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mango kernel immediately sprouted and gradually became a tall tree with
    leaves and fruit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those present with the king saw the mango-tree miracle and stood doing homage
