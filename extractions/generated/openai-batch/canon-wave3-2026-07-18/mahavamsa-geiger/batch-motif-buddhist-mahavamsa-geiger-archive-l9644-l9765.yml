canonical_text:
  quote: ''
  summary: The thera Mahinda moves with the king through several places in the royal
    park and marks them with flower offerings. Each marked place is confirmed by an
    earthquake, and Mahinda explains the future sacred or monastic function of the
    site. The passage includes a miraculous mango-tree growth, references to Bodhi-tree
    branches of former Buddhas and the Tathagata, the future distribution of gifts
    to the brotherhood, the future Catussala, and a place by Kakudha-pond declared
    worthy of a thupa because it has been visited by four Buddhas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The thera went northward from the royal dwelling to a bathing-tank, scattered
    blossoms there, and the earth quaked.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When asked about the quake at the bathing-tank, the thera said that the place
    would be a tank with a room for warm baths.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the gateway of the king's dwelling, the thera made a flower offering, the
    earth quaked, and he explained that Bodhi-tree branches connected with former
    Buddhas and the Tathagata would have their place there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the Mahamucalamalaka, the thera scattered flowers, the earth quaked, and
    he said that the uposatha-hall of the brotherhood would be there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A gardener offered a ripe mango to the king, and the king offered it to the
    thera.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After eating the mango, the thera gave the kernel to the king to plant; the
