canonical_text:
  quote: ''
  summary: Theras and large bodies of bhikkhus or ascetics arrive from many monasteries
    and regions for the Great Thupa. The assembled bhikkhus stand by rank around the
    site, leaving an open central space for the king. The king greets them, offers
    flowers, circumambulates three times, and enters the consecrated place of the
    filled pitcher. He orders a noble minister to use a silver turning staff fixed
    to a gold post to mark out a great circular space for the cetiya. The far-seeing
    thera Siddhattha stops the king, reflecting that too large a thupa would cause
    the king to die before completion and would be difficult to repair. Out of reverence,
    the king follows Siddhattha’s instruction and allots a moderate space.
  language: English
  quote_policy: summarized
