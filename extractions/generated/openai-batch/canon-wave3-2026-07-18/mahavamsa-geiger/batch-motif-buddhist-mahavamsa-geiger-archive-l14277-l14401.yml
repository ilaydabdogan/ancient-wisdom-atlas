canonical_text:
  quote: ''
  summary: 'The passage describes the king beginning construction of the Great Thupa:
    preparing and layering the foundation with stones, clay, metals, and materials
    brought by samaneras; announcing the laying of the foundation-stone and a festival
    for the Buddha; adorning the city and providing goods for the people; proceeding
    ceremonially to the site; and receiving bhikkhus from various regions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king began the work of the Great Thupa on the full-moon day of Vesakha
    when the Visakha constellation had appeared.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king ordered a stone pillar removed and had the place for the thupa dug
    seven cubits deep to make it firm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Round stones were brought by soldiers, broken with hammers, and the crushed
    stone was stamped down by great elephants whose feet were bound with leather.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fine moist clay called butter-clay, associated with the place where the heavenly
    Ganga falls down, was brought by samaneras who had overcome the asavas.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king ordered layers of clay, bricks, rough cement, cinnabar, an iron network,
    marumba, mountain-crystal, stones, copper, and silver to be placed in the foundation
    preparation.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The marumba used in the work was brought by samaneras from the Himalaya.
  category: object
  evidence_refs:
  - ev:4
