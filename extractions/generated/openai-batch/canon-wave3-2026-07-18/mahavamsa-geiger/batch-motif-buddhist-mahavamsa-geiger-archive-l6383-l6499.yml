canonical_text:
  quote: ''
  summary: 'The passage describes King Asoka''s construction and patronage of monasteries,
    daily gifts for the three gems, the sick, monks, and palace women, and the distribution
    of water from Anotatta-lake. Asoka summons the powerful naga-king Mahakala, honors
    him, and asks to see the bodily form of the Buddha. Mahakala creates a radiant
    Buddha figure with the marks of a Buddha; Asoka rejoices and holds a seven-day
    Feast of the Eyes. The passage then shifts to a prophecy from the time of the
    Second Council: elders foresee a future decline of the faith in Asoka''s time,
    ask Brahma Tissa to be reborn among humans to avert it, and assign Siggava and
    Candavajji to receive and instruct the reborn boy. A brief teacher lineage follows.'
  language: English
  quote_policy: summarized
