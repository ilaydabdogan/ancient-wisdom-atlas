canonical_text:
  quote: ''
  summary: The passage is a scholarly discussion of Buddhist chronological traditions.
    It argues that confusion arose from failing to distinguish two Asokas, surveys
    Northern, Tibetan, and Chinese dates for Asoka after the Buddha's Nirvana, discusses
    schisms linked to the Vaisali ten points and Mahadeva's five dogmas, connects
    these issues with the Kathavatthu and the Council of Pataliputta, and concludes
    in favor of a Second Council under Kalasoka and a Third Council under Dhammasoka.
  language: English
  quote_policy: summarized
