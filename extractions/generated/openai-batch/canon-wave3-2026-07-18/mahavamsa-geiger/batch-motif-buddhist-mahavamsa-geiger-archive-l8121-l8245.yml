canonical_text:
  quote: ''
  summary: The passage recounts how the child Pandukabhaya is secretly carried away,
    protected from hostile princes, raised under a false twin identity, and repeatedly
    escapes attempts by his uncles to kill him. At sixteen he is sent to the brahman
    Pandula, who recognizes him, predicts his kingship and seventy-year reign, instructs
    him, funds soldiers, and gives instructions concerning a future queen and chaplain.
    Pandukabhaya then gathers followers and encounters the princess Pali near Girikanda.
  language: English
  quote_policy: summarized
