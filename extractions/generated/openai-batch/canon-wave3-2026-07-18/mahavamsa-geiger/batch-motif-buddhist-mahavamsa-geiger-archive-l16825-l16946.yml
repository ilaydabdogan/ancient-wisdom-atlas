canonical_text:
  quote: ''
  summary: 'The passage recounts royal Buddhist patronage, chiefly under Bhatikabhaya/Bhatikaraja:
    repairs and constructions at major shrines, lavish flower, water, jewel, lamp,
    festival, and alms offerings to the Great Thupa and related sacred sites, and
    a vow and fast that lead theras to admit him to the relic-chamber. It also includes
    a preceding note about a ruler founding a nunnery for his mother named Dantageha.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ruler founded a nunnery for his mother on a building plot belonging to his
    family, and the nunnery was known as Dantageha.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the prior ruler's death, his son Bhatikabhaya reigned for twenty-eight
    years and was known on the island as Bhatikaraja because he was the brother of
    King Mahadathika.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhatikabhaya repaired the Lohapasada and built two vedikas for the Mahathupa
    and an Uposatha hall in the vihara named after the thupa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bhatikabhaya abolished a tax appointed for himself and planted sumana and
    ujjuka flowers over a yojana of land around the city.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhatikabhaya ordered the Great Cetiya to be plastered with scented unguent
    and flowers, later with minium and flowers, and later strewn with flowers from
    the steps to the top parasol.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bhatikabhaya raised water by machines from the Abhaya-tank and poured water
    over the thupa as a water-offering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bhatikabhaya used pearls in a plaster-covering for the Great Thupa and prepared
    a coral net with gold lotus-flowers and hanging pearl clusters as an offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bhatikabhaya heard arahants chanting in the relic-chamber, resolved not to
    rise until he had seen it, and fasted while lying at the foot of an eastern stone-pillar.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Theras created a door for Bhatikabhaya and brought him into the relic-chamber,
    where he saw its adornment.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After seeing the relic-chamber, Bhatikabhaya made an offering of clay figures
    modelled in close likeness to figures within it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Bhatikabhaya ordered repeated offerings to the Great Thupa using honeycombs,
    perfumes, flower-filled vases, essences, pigments, lotus flowers, and many lamps
    with clarified butter and oils.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Bhatikabhaya ordered annual plaster-renewal festivals, Bodhi-tree watering
    festivals, Vesak festivals, lesser festivals, mimic dances, concerts, and instrumental
    music for the Great Thupa.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Bhatikabhaya went three times daily to pay homage to the Buddha, ordered the
    flower-drum offering twice daily, and gave alms and ascetic requisites.
  category: action
  evidence_refs:
  - ev:13
