  summary: The passage describes royal Buddhist patronage, doctrinal enforcement,
    Abhayanaga's flight and return to power after killing his brother, subsequent
    offerings and constructions around the Great Bodhi-tree, brief successions, and
    a blind prophet's declaration that three Lambakanna companions are rulers of the
    earth.
