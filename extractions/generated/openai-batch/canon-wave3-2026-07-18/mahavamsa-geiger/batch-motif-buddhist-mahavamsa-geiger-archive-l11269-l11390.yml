canonical_text:
  quote: ''
  summary: 'The king of Lanka receives and escorts the great Bodhi-tree, honors it
    with royal status and ceremonies, transports it toward Anuradhapura, installs
    it at Mahameghavanarama, and witnesses miracles: the tree rises into the air,
    emits six-colored rays, descends, roots in the earth, and is surrounded by rain
    and mist. Mahinda recounts the Buddha’s subduing of the nagas, and a large assembly
    gathers for the Bodhi-tree festival.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king came to Jambukola with theras and his retinue by the power of the
    great thera.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the coming of the great Bodhi-tree, the king uttered an exulting cry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king descended neck-deep into the water and, together with sixteen noble
    persons, took the great Bodhi-tree upon his head and brought it to shore.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The great Bodhi-tree was set in a beautiful pavilion, and the king worshipped
    it by bestowing on it the kingship of Lanka.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king entrusted his government to the sixteen persons, took on the duties
    of a doorkeeper, and ordered solemn ceremonies for three days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the tenth day the king placed the great Bodhi-tree on a car and escorted
    it as the “king of trees.”
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mahinda related to the king the Buddha’s subduing of the nagas.
  category: speech
  evidence_refs:
  - ev:3
  - ev:10
- id: obs:8
  text: The king caused monuments to be raised at places said to have been frequented
    by the Master.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The procession brought the great Bodhi-tree along a decorated road with offerings
    made day and night, and it reached the neighborhood of Anuradhapura on the fourteenth
    day.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The king entered Anuradhapura by the north gate, left by the south gate, and
    entered Mahameghavanarama, where the tree was brought to the place of former Bodhi-trees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the king released it, the great Bodhi-tree rose eighty cubits into the
    air, floated, and emitted rays of six colors that spread over the island and reached
    the Brahma-world until sunset.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ten thousand persons, moved by the miracle, gained spiritual insight, attained
    arahantship, and received pabbajja.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At sunset the great Bodhi-tree descended, stood on the earth under the constellation
    Rohini, and the earth quaked.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The tree’s roots grew over the brim of the vase, struck down into the earth,
