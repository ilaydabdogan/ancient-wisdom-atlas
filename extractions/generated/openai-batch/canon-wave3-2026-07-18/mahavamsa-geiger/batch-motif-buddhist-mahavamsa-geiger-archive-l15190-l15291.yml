canonical_text:
  quote: ''
  summary: The passage describes the completion of a relic-chamber, the monastic community's
    appointment of Sonuttara to bring relics, a remembered episode at the Ganges in
    which Bhaddaji displays supernormal power by revealing a celestial thupa and a
    sunken golden palace, Nanduttara's wish to gain power over relics held by others,
    and a deathbed prophecy that one measure of the Buddha's bodily relics will pass
    from Ramagama to the kingdom of the nagas and finally to the Great Thupa in Lanka.
  language: English
  quote_policy: summarized
