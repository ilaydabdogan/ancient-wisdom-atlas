canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction discussing the relative value of
    Ceylonese, Brahman, Jaina, Puranic, Northern Buddhist, and Pali traditions for
    early Buddhist and Indian royal chronology. It lists Indian kings according to
    Southern Buddhist tradition, explains the acariyaparampara or succession of teachers
    from Upali to Mahinda as a synchronological connection between India and Ceylon,
    cautions that many dates are uncertain, contrasts a Northern Buddhist patriarchal
    list, and gives chronological details for Upali and Dasaka.
  language: English
  quote_policy: summarized
