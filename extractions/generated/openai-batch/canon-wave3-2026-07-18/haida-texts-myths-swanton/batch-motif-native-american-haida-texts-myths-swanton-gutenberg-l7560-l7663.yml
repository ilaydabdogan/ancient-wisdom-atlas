canonical_text:
  quote: ''
  summary: A man proves strong supernatural power by swallowing red-hot stones and
    is allowed to marry. Later he longs to see his younger brother. His wife’s father
    directs them to a whale-bone canoe, which becomes a food-laden animated canoe
    with goose figures. The brothers and their wives travel in canoes with animated
    helpers, dig up human bones near a tree, and the wives restore the mother-in-law
    to life under a mat. Returning to Gunwa, they hide the restored mother and test
    the woman acting as the mother by making her carry heavy baskets correctly.
  language: English
  quote_policy: summarized
