canonical_text:
  quote: ''
  summary: The passage recounts Sacred-one-standing-and-moving boiling duck grease
    and the resulting earthquake saying among Raven people; his construction of cedar
    traps using children as bait to catch a wā′sg̣o; the recovery and revival of his
    younger brothers from the creature’s belly; the brothers’ later disappearance;
    and his crossing by hair ribbon to a supernatural house where Stone-ribs, Djila′qons,
    and other supernatural beings discuss fiery placement and future habitation beneath
    the island or earth.
  language: English
  quote_policy: summarized
