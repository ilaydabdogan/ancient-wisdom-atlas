candidate_motifs:
- id: motif:1
  label: perilous canoe approach and failing companions
  taxonomy_refs:
  - mystical_quest
  basis: Raven repeatedly seeks a companion for a canoe approach to a reef whose influence
    affects Snowbird, Blue-jay, and the toadstool drawing.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The purpose and nature of the reef objects are not explained in this passage
    segment.
- id: motif:2
  label: loss of food abundance after offending a powerful wife
  taxonomy_refs: []
  basis: Cloud-woman’s predicted salmon abundance ends after Raven’s bad language
    angers her and she commands the dog salmon to swim away.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explicitly classify Cloud-woman’s status beyond her
    name and control over the salmon departure.
- id: motif:3
  label: deceptive medicine instruction leading to boundary transgression
  taxonomy_refs:
  - trickster_boundary
  basis: Raven directs Sīwa′s to seek medicine and sit by a red marker, where she
    discovers Raven lying beneath her.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The social or ritual interpretation is not stated directly; the extraction
    keeps to the sequence of actions.
- id: motif:4
  label: miraculous child marked by lightning and taken by supernatural beings
  taxonomy_refs:
  - miraculous_child
  basis: A child cries where Raven draws with his finger, is taken out, grows quickly,
    vanishes, and is later said to be with supernatural beings; lightning marks his
    knee-joints.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not give a conventional birth description, only the child’s
    sudden appearance and later signs.
- id: motif:5
  label: failed recognition of returning or claiming child
  taxonomy_refs:
  - return
  basis: A disheveled-haired person addresses Raven as father and later shows lightning
    around his knee-joints, but Raven rejects him and he vanishes.
  evidence_refs:
  - ev:8
  confidence: low
  cautions: The passage does not explicitly identify the visitor as Sᴀqaiyū′ł, so
