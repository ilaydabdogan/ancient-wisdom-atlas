    objects.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: 5907-5911
  quote_or_summary: He spears a big and small object, places them on his wife and
    sister, and tells his crying sister that hers will be safe.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 5912-5920
  quote_or_summary: After Raven marries Cloud-woman, salmon come; after he uses bad
    language, she tells the dog salmon to swim away, leaving only a box of salmon
    roe.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 5921-5925
  quote_or_summary: During the move, Raven lies beside the roe, explains away a smell
    as a scab, and later throws Sīwa′s’s box empty ashore.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 5926-5933
  quote_or_summary: At a camp fire, yellow cedar sparks; Raven tells Sīwa′s to call
    for medicine and sit where a short red thing sticks up; she finds Raven under
    her.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 5934-5940
  quote_or_summary: Raven becomes ashamed, draws with his fingertip, a child cries
    there, he takes it out and boards it around; the child grows old enough to play
    and vanishes.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 5941-5949
  quote_or_summary: Raven searches by flying in feather clothing, hears supernatural
    beings took the child because he fooled them, and the boy Sᴀqaiyū′ł is described
    with lightning around his knee-joints.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 5950-5956
  quote_or_summary: A disheveled-haired visitor calls Raven father; Raven rejects
    him, and the visitor leaves with lightning around his knee-joints and vanishes.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 5957-5963
  quote_or_summary: Raven carries his sister, comes to Ramsey Island, asks birds to
    accompany him, and obtains cedar-bark roofing for a potlatch before leaving it
    there.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 5964-5975
  quote_or_summary: Hungry, Raven calls animals in canoes, speaks in black shabby
    clothing, relies on Porpoise-woman to interpret, eats thrown abalones and sea
    eggs, and potlatches outside as supernatural beings arrive.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: quote
  locator: 5976-5979
  quote_or_summary: "“That is why his nasal openings now run upward.”"
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; short quotation.
- id: ev:12
  type: summary
  locator: 5980-5987
  quote_or_summary: Raven decks out birds in different varieties as they now appear
    and explains thin-headed birds by their cramped places beside the walls.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 5988-5996
  quote_or_summary: Two birds refused adornment by Raven go crying to Master Carpenter,
    who says they will be handsomer than others, paints them, and puts designs on
    their feathers.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
