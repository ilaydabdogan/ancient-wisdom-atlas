canonical_text:
  quote: ''
  summary: Raven travels by canoe, seeks objects on a reef, interacts with his sister
    and wives, loses salmon abundance after angering Cloud-woman, deceives his sister
    in a fire-related episode that leads to a child, loses the child to supernatural
    beings, organizes a potlatch, and alters or adorns birds in ways that explain
    their present forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The protagonist travels by canoe, asks Snowbird and Blue-jay to accompany
    him, and both birds are overcome when the canoe nears the reef.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After trying other creatures, he makes a drawing on a toadstool, places it
    in the stern, and instructs it to reverse the canoe stroke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Short objects lie stacked on a reef; he spears a large one and a small one
    and brings them home.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: He places one of the reef objects on his wife and one on his sister; his sister
    cries, and he says hers will be safe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After marrying Cloud-woman, salmon come in abundance for him; after he uses
    bad language in the smokehouse, Cloud-woman tells the dog salmon to swim away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the salmon swim away, a box of salmon roe under his sister is the only
    food left in the house.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the camp move, he lies beside the salmon roe and later throws Sīwa′s’s
    box empty ashore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a camp fire, he puts yellow cedar on the fire; a spark flies between Sīwa′s’s
    legs, and he gives her instructions for seeking medicine in the woods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sīwa′s follows the instruction, sits where a short red thing sticks up, and
    discovers her brother lying on the ground under her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After becoming ashamed, he draws with his fingertip; a child cries there,
    and he takes the child out and places boards around it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The child becomes old enough to play and then vanishes while out playing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: He searches for the child by putting on feather clothing and flying over the
    country and the Mainland.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: He hears that supernatural beings took the child because Raven used to fool
    them; the boy is named Sᴀqaiyū′ł and has lightning flash around his knee-joints
    when he stands.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A disheveled-haired visitor addresses Raven as father; Raven spits on his
    face and says Sᴀqaiyū′ł was not like that; the visitor leaves with lightning around
    his knee-joints and vanishes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Raven carries his sister in his armpit, comes to Ramsey Island, and asks birds
    to accompany him to get cedar-bark roofing for a potlatch.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: When hungry, Raven calls animals, speaks in a way they do not understand,
    and Porpoise-woman interprets his speech.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Porpoise-woman says Raven wants them to fight him with abalones and sea eggs;
    they throw these at him, and he eats them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Raven potlatches outside because the house is too small, and the supernatural
    beings he invited come by canoe.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:19
  text: Raven makes holes in the beaks of many birds; Eagle’s holes are made carelessly,
    explaining why Eagle’s nasal openings run upward.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: Raven decks out birds in different varieties as they now appear; those next
    to the walls are told to have heads as thin as their sitting places.
  category: action
  evidence_refs:
  - ev:12
- id: obs:21
  text: Two birds Raven refused to adorn go crying to supernatural beings and then
    to Master Carpenter, who paints them and puts designs on their feathers.
  category: sequence
  evidence_refs:
  - ev:13
