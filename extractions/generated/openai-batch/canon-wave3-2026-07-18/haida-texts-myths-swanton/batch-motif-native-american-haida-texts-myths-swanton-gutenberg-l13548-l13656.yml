canonical_text:
  quote: ''
  summary: Big-tail performs among starving Skidegate people, receives saved foods,
    gives portions and fresh water to a named supernatural being, and a whale is found
    ashore. Later he attempts twice to reach the ocean house of Chief, elder brother
    of Supernatural-being-people-always-go-to, but winds from the house drive him
    back. Yä′yū, also called Supernatural-being-looking-landward, speaks through Big-tail,
    and Big-tail lies down or chews tobacco to enter that being’s house, where finned
    persons prepare food later identified as whale tongues. A finned, killer-whale-suited
    figure dances and speaks of a real dorsal fin and of humans saying he used to
    be human. After the supernatural meal, whale jaws float ashore along the coast.
    In another famine, the people go to Da′x̣ua and eat poor foods; after Big-tail
    performs all night, Supernatural-being-looking-landward says the little supernatural
    women along the shore should stop being made to cry and promises to give humans
    something.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Big-tail went to Skidegate, performed as before, and the starving people quietly
    gave him saved foods, grease, and Indian tobacco while he slept.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After sleeping, Big-tail spoke, put the top portion of the food into the fire,
    spilled fresh water around the fire, gave these to Supernatural-being-at-whose-voice-the-ravens-sit-on-the-sea,
    ate, and performed that night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The next day Big-tail told the people to go hunting; they found a whale floated
    ashore nearby, and the Skidegate people ceased being hungry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Supernatural-being-people-always-go-to asked Big-tail to come see his elder
    brother, launched a square canoe, placed Big-tail inside his clothing, and set
    off with him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the seaward journey they saw something white in the ocean like a mountain,
    identified as the elder brother’s house; a strong wind arose and they returned
    barely safe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On a later attempt, the great white house appeared at intervals over the waves,
    but wind from the house drove them back; Big-tail was told not to go again because
    the elder brother refused to let him see inside. The being’s name was Chief.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yä′yū, also called Supernatural-being-looking-landward, spoke through Big-tail,
    made things happen by speaking through him, and four whales floated about.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Big-tail asked to go see why a drum sounded in the house of Supernatural-being-looking-landward,
    lay down, entered the house, and saw finned persons stirring soapberry-like material
    in a painted-board object.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: On another visit, after chewing tobacco and lying down, Big-tail entered Supernatural-being-looking-landward’s
    house, was welcomed, saw the stirred material raised on a stick, then awoke regretting
    that he had not eaten whale tongue.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On a further visit, Big-tail chewed tobacco and entered the house; Supernatural-being-looking-landward
    told him not to go up and said he would invite the supernatural beings.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The invited people came in wearing fins; a figure dressed up, danced, lay
    down in the rear of the house in a full killer-whale suit, and had fins touching
    the roof.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The killer-whale-suited figure held a dorsal fin, repeatedly called it a real
    dorsal fin, and said humans kept saying that he used to be a human being; those
    in the house laughed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After those in the house ate what they had stirred up, identified as whales’
    tongues, the coast between Skidegate inlet and House-point was strewn with whale
    jaws that had floated ashore.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Later, during another famine, the people went with Big-tail to Da′x̣ua and
    ate edible fern stumps and occasional coot bodies.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After Big-tail performed all night, Supernatural-being-looking-landward told
    him to have people stop making the little supernatural women along the shore cry
    and said that he would give the human beings something.
  category: speech
  evidence_refs:
  - ev:11
