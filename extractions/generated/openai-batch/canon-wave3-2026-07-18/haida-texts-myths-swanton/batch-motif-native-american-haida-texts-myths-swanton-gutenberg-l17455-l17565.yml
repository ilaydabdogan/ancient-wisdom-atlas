canonical_text:
  quote: ''
  summary: A Point-town man is reported killed in Nass, prompting Point-town war parties
    led by Skîlqē′xas and Gia′ołins to attack Nass/Niska people, take slaves, gather
    heads, and occupy or return to settlements such as House-point, Łi′elᴀñ, and Masset.
    The account narrates cycles of raids, retaliation, town burnings, pitched battles,
    enslavement, blood compensation, peace-making with property, renewed conflict
    with Niska and Tsimshian groups, the killing and mourning of a town chief, the
    burning of an empty town, capture of grease boxes, and the later sending of feathers
    to Tsimshian and Niska.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Point-town person living in Nass was reported killed, after which the Point-town
    people prepared for war by drinking sea water for a while and raising their canoes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skîlqē′xas and Gia′ołins are named as war chiefs in the canoes of the Point-town
    people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Point-town war party traveled by way of the Tlingit country, waited until
    evening at Lᴀ′mas, went out early in the morning, killed many Nass people, and
    took slaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Qogī′s ran to a group of women and attempted to bring out ten by the hair,
    but got only six out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Point-town people got the heads of Niska people and counted slaves allotted
    to Gia′ołins and Skîlqē′xas.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Niska people later came in five canoes to fight at House-point; five Point-town
    people were killed, and one canoe load of Niska people was destroyed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Point-town people repeatedly returned from raids singing songs of victory.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  - ev:9
- id: obs:8
  text: Nass/Niska people burned empty Point-town settlements, including House-point
    and Łi′elᴀñ, and seized Skîlqē′xas’s provision house behind House-point.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Because the Nass people were considered too powerful, the Point-town people
    moved to Masset.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Four Up-inlet-gîtî′ns fought with the Point-town people in a pitched battle,
    two were killed, and their group later asked for payment.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: After the Up-inlet-gîtî′ns received one slave for two killed men, they left
    the slave, killed two Point-town people, fought through the winter, and later
    made peace through exchange of slaves as blood compensation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Point-town people pursued three canoes while on a Nass war expedition, killed
    those in them, and then learned they were Tsimshian, whom they enslaved.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Tsimshian forces fought the Point-town people, and both sides suffered many
    deaths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Point-town people destroyed campers drying halibut at the mouth of the Skeena
    and took many slaves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Tsimshian raiders took nine women as slaves from berry-picking canoes, killed
    three men, and some people escaped to the woods.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Many families joined together to attack Tsimshian campers, destroyed many,
    enslaved a great number, and returned to Masset singing songs of victory.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Tsimshian came in summer to make peace; the whole town danced, property was
    given, and Masset people later crossed over and gave property in return.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Niska people came to dance after hearing of the peace, without prior notice;
    when they landed, they were shot at and many were killed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: At Lag̣ᴀ′mkꜝida the Nass people won one battle, but in a later expedition
    the Point-town people killed many Nass people and a town chief named Sqatꜝî′n.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: After Sqatꜝî′n was killed, the Nass people wept and scratched their faces.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: When Point-town people later found Lag̣ᴀ′mkꜝida empty, they burned the town
    and captured many boxes of grease.
  category: action
  evidence_refs:
  - ev:10
- id: obs:22
  text: Skîlqē′xas and Gia′ołins each summoned the people and spoke of sending feathers
    to the Niska; after agreement, feathers were taken to the Tsimshian and then carried
    up to the Niska.
  category: sequence
  evidence_refs:
  - ev:10
