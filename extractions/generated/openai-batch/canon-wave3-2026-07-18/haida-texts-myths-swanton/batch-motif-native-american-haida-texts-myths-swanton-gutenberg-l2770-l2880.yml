canonical_text:
  quote: ''
  summary: A child forgotten in a cradle during a mussel-gathering stop is found with
    crows above him and behaving like a shaman. As he grows, people die because of
    him, and most kin reject him. His grandmother and the wife of his youngest uncle
    feed and care for him. He and his grandmother live in a cedar-bark house by a
    creek. He hunts birds, repairs the broken bill of a heron that promises help,
    learns to make deadfalls, and begins catching many black bears. His household
    becomes full of fat food, and this prosperity is reported secretly.
  language: English translation, with Haida text also present in the supplied passage
  quote_policy: summarized
