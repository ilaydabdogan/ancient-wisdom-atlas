canonical_text:
  quote: ''
  summary: A girl feeds halibut liver and fat to a raven. During a hungry spring,
    the raven helps her find food at low tide, and she shares food with relatives.
    Two men take her to a town associated with ravens, where she understands the speech
    and hears of a whale. The town chief orders food to be given to her in exchange
    for her help. She returns to her father’s house surrounded by food, enriches her
    father by trade, and later tells him of a whale at House point. Her father and
    the town harvest it. A note says some refer to the story as the origin of the
    Raven crest.
  language: English translation with Haida text appended
  quote_policy: summarized
