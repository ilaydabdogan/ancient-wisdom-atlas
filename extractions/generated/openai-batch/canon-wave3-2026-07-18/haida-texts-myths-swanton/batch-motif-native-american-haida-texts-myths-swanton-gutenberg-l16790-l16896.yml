canonical_text:
  quote: ''
  summary: A historical war account describes repeated cycles of killing, retaliation,
    ambush during visits or peace-making, enslavement and release, trophy-taking,
    fortification, and fighting involving Stikine and Sitka Tlingit, named leaders,
    and Russians or “Iron people.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cēks’s nephew lived at Sitka because of a woman and was killed there; afterward
    Stikine people went to Sitka, fought, and destroyed many Sitka people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Daoł, while connected with gathering stones at the ebb tide, predicted that
    he and his family would be killed when the tide was ebbing and that he would not
    return.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Daoł was captured at the place where he was gathering stones, taken into the
    war chief’s canoe, mocked, and later received his gun and knife from arriving
    friends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Daoł had his weapons, he shot and stabbed while others also shot; the
    Sitka people were destroyed, escapees were stabbed in the woods, and two young
    men were taken into Cēks’s canoe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The next day heads were collected; some people had twelve and others ten,
    and the heads were dried in the sunshine before Cēks told the people to stop fighting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Two enslaved youths were released in a ripped-seam, old three-fathom canoe
    with a small paddle; the releasers expected them to drown, but later heard that
    they escaped.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sitka people later came to make peace, danced, came ashore, entered houses,
    and received property including slaves as blood money before Cēks’s side shut
    the door and killed people outside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: During the house killing, a woman looked through the smoke hole holding a
    knife, made a beheading motion, and warned that the dancers were to be destroyed;
    the dancers ignored her and continued dancing until all were killed except six
    who were released.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After visiting resumed, Qała′x fought the Stikine people while they were inside
    a stockade and destroyed them; later, when ten canoes came to the Stikine, Yaqoa′n
    began killing them and all were destroyed.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: After Qała′x’s nephew was killed by Russians because he loved a Russian’s
    daughter, a Russian’s son was killed, fortifications were built, and armed Russians
    or Iron people attacked by vessel, boats, guns, bayonets, warships, and cannon.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
