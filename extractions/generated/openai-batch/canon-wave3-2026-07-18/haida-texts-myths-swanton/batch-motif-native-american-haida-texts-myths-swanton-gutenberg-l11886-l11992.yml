canonical_text:
  quote: ''
  summary: A man follows his wife into another place after she speaks of her mother
    and calls others to life. He later lives among beings who use skins and gather
    roots, is caught in a deadfall set by his brothers, is identified by copper around
    his neck, and is revived with medicine. Later, a brother with medicine in his
    mouth searches for vanished elder brothers, escapes or survives supernatural dangers,
    and repeatedly restores them by spitting medicine on them. The group encounters
    Greatest Echo, a feather on a slippery stone, and a woman whose dish bears a mouse
    figure. Finally the brothers take their sister toward the Stikine River, forbid
    her to look while they swim, and when she looks all except the eldest become rocks;
    the eldest sings and they settle there.
  language: English
  quote_policy: summarized
