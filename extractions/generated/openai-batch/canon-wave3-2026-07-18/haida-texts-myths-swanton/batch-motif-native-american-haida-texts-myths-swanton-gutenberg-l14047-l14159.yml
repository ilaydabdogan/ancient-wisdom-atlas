canonical_text:
  quote: ''
  summary: 'The passage closes a shamanic narrative in which a man conducts ritual
    actions with fire drills, dances, sleeps in a sail house, and recounts a journey
    with Sᴀqaiyū′ł to a mountain, a city, an armed black-skinned watcher, a boiling
    kettle, and an uncle who gives warnings about watchfulness and a name not to be
    spoken. The man returns and soon dies. Editorial notes identify the account as
    a shaman''s spiritual experience. The passage then begins the story of Djila′qons:
    ten men fish by canoe; one insults the water/Djila′qons with a cormorant-design
    hat; the party burns a frog that returns; and a beach-walking man foretells their
    sequential deaths, leaving only the steersman to report before he also dies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Town people gave fire drills to the man; he had them drill together and then
    placed the drills in the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After dancing, participants waved hats; the man sang and whistled, and Sᴀqaiyū′ł
    later spoke through him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sea-grass town chiefs initially would not let him sleep, then permitted it
    because they feared the supernatural beings might speak differently if refused.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A sail house was made for him in a corner; he slept there at evening, woke
    early, and later quietly told the narrator what had happened.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the account he gave, Sᴀqaiyū′ł stood with him on top of the mountain on
    Qꜝᴀ′ñga, wore white clothing without a coat, wept with a handkerchief over his
    face, and used a wheeled thing to travel to a city.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the city stood a large black-skinned being with a large gun pointed downward;
    Sᴀqaiyū′ł handed him something, which he put into his mouth without looking.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sᴀqaiyū′ł told the man not to be afraid, said that even supernatural beings
    die, and said he had died three times while his body never dies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The man saw a large outdoor kettle boiling without visible cause; near it
    was a long square-ended object on which Kwakiutl connected with a killing were
    nailed and placed into the kettle.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The uncle explained that the black-skinned being shoots down on people below
    who treat each other badly, causing smoke and sickness below.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The uncle told him to be watchful, said the black man watches foolish people,
    and warned that a certain name was too great to be mentioned below.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The man returned down in the wheeled thing, awoke in the sail house, and died
    not long afterward.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Ten men went in a canoe to fish with snares on poles; one man wore a cormorant-design
    hat that fell into the water whenever he caught a fish, and he angrily insulted
    the water/Djila′qons with the hat.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: After the fishing party went ashore and made a fire to roast fish, a large
    frog came to the fire; they threw it into the flames, laughed, heard thunder,
    and saw the frog burst; the same frog returned and later jumped out of the fire
    red-hot.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: As the men returned to their village, a beach-walking man foretold that one
    man would die at each point of land, that only the steersman would reach the village
    to report what happened, and that the steersman would then die.
  category: speech
  evidence_refs:
  - ev:14
