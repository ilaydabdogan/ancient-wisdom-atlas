candidate_motifs:
- id: motif:1
  label: ritual collection and burning of fire-making tools
  taxonomy_refs: []
  basis: The man asks for fire drills, has all the town people drill together, and
    then has the drills put into the fire.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not explain the ritual purpose beyond saying this was
    why he had them brought to him.
- id: motif:2
  label: shamanic sleep-vision journey with supernatural guide
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: The man sleeps in a prepared sail house and recounts traveling with Sᴀqaiyū′ł
    to a mountain, a city, and back in a wheeled thing; editorial notes identify the
    account as a shaman's spiritual experience.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:11
  - ev:15
  confidence: high
  cautions: The exact ontology of the visited city is not explicitly defined in the
    passage.
- id: motif:3
  label: otherworldly punishment and watcher of wrongdoing
  taxonomy_refs:
  - divine_judgment
  basis: A black-skinned armed being is said to shoot down on people who treat each
    other badly, with smoke and sickness below; offenders connected with killing are
    nailed and placed in a boiling kettle.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not explicitly call the place an afterlife court or the
    being a deity.
- id: motif:4
  label: supernatural repeated death with undying body
  taxonomy_refs:
  - death_rebirth
  - dying_and_returning
  basis: Sᴀqaiyū′ł says that even supernatural beings die, that he died three times,
    and that his body never dies.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage states repeated death and bodily persistence but does not
    narrate the deaths or returns.
- id: motif:5
  label: taboo on speaking a powerful name
  taxonomy_refs:
  - forbidden_knowledge
  basis: The uncle says the name is feared, must not be mentioned below, and is too
    great to mention, even instructing that a child should be stopped from saying
    it.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The name itself is not supplied in this passage.
- id: motif:6
  label: insult to water or named being followed by lethal consequence
  taxonomy_refs:
  - divine_judgment
  basis: A fisherman angrily insults the water/Djila′qons; afterward, a man foretells
    the deaths of the whole party, with only a temporary messenger surviving to tell
    the story.
  evidence_refs:
  - ev:12
  - ev:14
  confidence: medium
  cautions: The passage segment does not explicitly state causation between the insult,
    frog episode, and death prophecy, though the sequence strongly juxtaposes them.
- id: motif:7
  label: burned frog returns from fire
  taxonomy_refs:
  - death_rebirth
  basis: The frog is thrown into flames, bursts after thunder, returns, and later
    jumps out of the fire red-hot.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The text does not explicitly say the frog dies; the return may indicate
    supernatural resilience rather than death and rebirth.
- id: motif:8
  label: final witness reports disaster before dying
  taxonomy_refs:
  - return
  basis: The beach-walking man predicts that only the steersman will reach the village
    to tell what befell the party and that he too will then die.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: This is a prophecy within the passage; the actual fulfillment is not included
    in the supplied excerpt.
