canonical_text:
  quote: ''
  summary: 'The passage narrates warfare involving Bellabella, Kloo, and Town-of-Djī′gua
    people: a reef battle with a failed peace approach and corpse retrieval; threats
    and war preparations involving taboos, medicine, provisions, and women’s observances;
    a return with slaves including the chief Ya′koeʟas; a dawn raid on an inlet house
    assisted by shamanic silencing of a dog; the restraint, transport, attempted humiliation,
    and protection of Ya′koeʟas by a cedar-bark ring; and a final note that two canoes
    set out toward people living farther down the inlet.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Approaching people were discovered by someone who came out to urinate, after
    which the Bellabella began shooting; at daylight the Town-of-Djī′gua people went
    ashore near a reef and fired from their side.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A possible peace was mentioned to Gūnana′otx̣a, but when the Kloo people came
    out on the reef they were shot at again, and a Town-of-Djī′gua chief was killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The slain chief’s body lay high on a rock and was retrieved by fastening a
    hook to a pole, pulling it through the skin, and drawing the body in little by
    little.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The combatants shot at each other all day; some escaped by canoe under fire
    and returned empty-handed, while people at home reacted first to the return of
    an escaped man and wife and then to the returned dead body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Winter news came through a Kitkatla canoe that Gîtku′n would sweep the inlet
    from its head like a contagion; Bellabella speakers challenged how an inlet said
    to be unenterable could be swept out, and Town-of-Djī′gua people said they would
    destroy everything before them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Ya′koeʟas demonstrated how he would act if seized: ten Bellabella young men
    grabbed him, and he threw them about, saying he would do that to the Kloo people.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A group went southward fishing, remained there for a long time, observed war
    taboos, drank medicine, accumulated dried halibut, and then left.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After landing on a sandy beach, the war party set out; while they were gone,
    women observed rules in two smokehouses, and after ten nights they turned sleeping
    places when the warriors’ canoe bows were turned homeward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The returning party was announced by gun noise and war songs; many slaves
    were brought in, including the great chief Ya′koeʟas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During an inlet expedition, scouts smelled smoke, saw a house, and before
    daybreak the party approached the house in a line.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A white man’s dog barked at the approaching party; A′nkustᴀ performed as shaman,
    made a threatening motion toward the dog, and the dog stopped barking and licked
    the people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The attackers shot, rushed in, entered the house through the doorway and through
    its sides, and seized those inside amid confusion.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ya′koeʟas threw off a person who seized him, later refused to leave, threw
    off Kloo people with a jerk, and moved gradually toward an ax.
  category: action
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:14
  text: A married slave couple owned by Ya′koeʟas spoke during the capture; the woman
    told her husband to cut him up among them, and the husband replied that any place
    where water is drunk is all right.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: After a struggle, a large coil of rope near the door was found; Ya′koeʟas
    was tied, carried to a canoe, and put into Waters’s canoe, which shook because
    he and the others were afraid.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: An escaped former Kloo captive threw a spear at Ya′koeʟas from another canoe;
    Ya′koeʟas raised his palm so that the spear entered it, was struck in the face
    with a paddle, and did not turn away.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: After Ya′koeʟas had shaken for a while, Waters put a cedar-bark ring on him;
    the ring protected him from insult, and he understood that his life was safe.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: At broad daylight, Bellabella people said that some people lived lower down
    the inlet, and two canoes of Those-born-at-Qꜝā′dᴀsg̣o set off without anxiety
    for their lives because they had taken nothing.
  category: sequence
  evidence_refs:
  - ev:11
