candidate_motifs:
- id: motif:1
  label: Failed or deceptive peace approach followed by renewed attack
  taxonomy_refs: []
  basis: A possible peace is mentioned, but when the Kloo people come out on the reef
    they are shot at again and a chief is killed.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports the sequence but does not explain the intentions behind
    the renewed shooting.
- id: motif:2
  label: Recovery of fallen leader with improvised hooked implement
  taxonomy_refs: []
  basis: A chief’s body lying high on a rock is recovered by fastening a hook to a
    pole and pulling it in gradually.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not add ritual or symbolic explanation for the recovery
    method.
- id: motif:3
  label: Threat of total destruction described as sweeping out an inlet
  taxonomy_refs: []
  basis: News says Gîtku′n will sweep out the inlet from its head like a contagion,
    and Town-of-Djī′gua people say they will destroy everything before them.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a local war threat; no broader cosmological destruction is stated.
- id: motif:4
  label: Ritualized preparation for war by taboos, medicine, provisions, and home
    observances
  taxonomy_refs: []
  basis: The war party fishes, observes war taboos, drinks medicine, and gathers dried
    halibut, while women observe rules in smokehouses and turn sleeping places when
    the warriors turn homeward.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not specify the content of the taboos, medicine, or women’s
    rules.
- id: motif:5
  label: Dawn raid on a house after smoke-scouting
  taxonomy_refs: []
  basis: Scouts smell smoke, locate a house, and before daybreak the attackers approach
    in a line, shoot, and enter through the doorway and sides.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage gives tactical details but limited context about the house’s
    occupants.
- id: motif:6
  label: Shaman silences an animal alarm
  taxonomy_refs: []
  basis: A dog barks at the attackers, A′nkustᴀ performs as shaman and makes a threatening
    motion, and the dog stops barking and licks them.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage states the shamanic performance but does not explain its mechanism.
- id: motif:7
  label: Capture of an exceptionally strong chief requiring restraint
  taxonomy_refs: []
  basis: Ya′koeʟas throws off captors, refuses to leave, moves toward an ax, and is
    finally tied with a rope and carried to a canoe.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage presents physical strength and fear but does not frame him
    as supernatural.
- id: motif:8
  label: Protected captive marked by cedar-bark ring
  taxonomy_refs: []
  basis: Waters places a cedar-bark ring on Ya′koeʟas; the ring is said to protect
    him from insult, and he knows that his life is safe.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The specific cultural rule or status conferred by the ring is not explained
    beyond protection from insult and assurance of life.
