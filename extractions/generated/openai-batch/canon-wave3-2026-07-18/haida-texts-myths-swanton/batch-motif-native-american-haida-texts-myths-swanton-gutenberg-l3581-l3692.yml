candidate_motifs:
- id: motif:1
  label: supernatural naming linked to place and dangerous ritual object
  taxonomy_refs: []
  basis: A thunder-associated woman gives names, settles at Skidegate creek, owns
    the tā′xet, and the passage says careless handling of the tā′xet kills.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not explain what the tā′xet are beyond naming, ownership,
    and taboo handling.
- id: motif:2
  label: animal-skin disguise or transformation in fishing context
  taxonomy_refs:
  - shapeshifter
  basis: A hair-covered woman fits an intact surf scoter head and neck to her own
    head, swims among the nets, and takes salmon; after being struck at, the scoter
    disappears and a woman is found with salmon.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The text explicitly describes wearing the skin, not a full bodily transformation.
- id: motif:3
  label: near flood associated with a specially made house
  taxonomy_refs:
  - flood_and_renewal
  basis: The feather-covered Feather-house is followed by the tide rising to the house
    and the people saying they had almost had a flood because of it.
  evidence_refs:
  - ev:6
  confidence: low
  cautions: The event is a near flood rather than a completed flood, and no renewal
    sequence is described.
- id: motif:4
  label: child disappearance and bear-people conflict
  taxonomy_refs: []
  basis: A sleeping child disappears from a canoe, black-bear tracks lead inland,
    and the town people retaliate against the Black-bear people with dogs and deadfalls.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly say the child became a bear or was taken
    by the Black-bear people; it presents tracks and the subsequent anger of the town
    people.
- id: motif:5
  label: grieving animal mother treated as social person
  taxonomy_refs: []
  basis: The bear mother gestures to the people, comes down with her young, licks
    her friends, is fed raw food, does not speak, and dies from sorrow after her cubs
    are killed.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage gives social actions and emotion but does not provide an explicit
    interpretation of the bear's identity.
- id: motif:6
  label: protective doorway stratagem against supernatural intruders
  taxonomy_refs:
  - trickster_boundary
  basis: A nephew calls the intrusive supernatural beings, stations himself in the
    doorway with raised needles and a bullhead skin, cuts them as they float in and
    out, and frightens them away.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The available taxonomy label is approximate; the passage shows a boundary-defense
    stratagem but does not call the nephew a trickster.
