canonical_text:
  quote: ''
  summary: A sequence of Haida Skidegate narratives describes a thunder-associated
    supernatural woman who names people and owns the tā′xet; net fishing and a sighting
    of her in rainbow and flicker blankets; a hair-covered woman using a surf scoter
    skin while taking salmon from nets; night fishing and shaming speech about land
    otters; a feather-covered house connected with a near flood; an accidental injury
    near a fire; a child's disappearance followed by black-bear tracks and conflict
    with Black-bear people; a human-like deadfall victim with copper on his back;
    and a nephew who uses bullhead skin and needles to frighten supernatural beings
    entering an old man's house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman associated with the tā′xet returned to Skidegate creek, gave people
    names, named her sister and herself with thunder-related supernatural names, and
    settled at the head of the creek.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that she owns the tā′xet and that a person who does not
    handle them carefully, according to tabus, is killed; salmon are also found with
    cuts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women of the Food-giving-town people made nets and, while fishing, saw Supernatural-woman-in-whom-is-thunder
    wearing a rainbow blanket under a flicker blanket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman whose skin was covered with hair skinned a surf scoter, fitted its
    intact head and neck to her own head, swam where people were fishing, and took
    salmon out of the net.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a stone was thrown at the surf scoter, it gave a dull sound and disappeared;
    the next day a woman lay there with a string of salmon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A younger married man tried to eat roasted salmon at night with his wife;
    his wife shamed him by saying that land otters eat at night, and the next night
    he repeated the saying back to shame her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people built a town house with its front covered in feathers and called
    it Feather-house; the tide rose to it and then fell, and they said the house had
    almost caused a flood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After fishing, a wife lay with her back to the fire while a man had his arms
    around her; a cutting action injured the wife by accident, and she got up crying.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person fishing for silver salmon fell asleep after his daughter fell asleep
    in the canoe bow; in the morning the child was gone and black-bear tracks led
    inland from the canoe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The town people became angry with the Black-bear people, raised many dogs,
    made many deadfalls, and began killing bears.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A bear with two young ones climbed a tree; when people prepared to shoot her,
    she made a motion across her nose, after which the people tied the dogs' mouths.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The bear and young ones came down, were led home, ate raw food, and did not
    speak; the dogs later killed the cubs, and the mother's sorrow killed her.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: A deadfall fell upon a creature described as like a human being with copper
    on his back, and a person brought it home.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: Supernatural beings floated into Salmon-point's house and ate an old man's
    food; the old man's nephew used a dried bullhead skin, stood in the doorway, raised
    needles, cut the beings as they floated in and out, and made them afraid.
  category: action
  evidence_refs:
  - ev:13
