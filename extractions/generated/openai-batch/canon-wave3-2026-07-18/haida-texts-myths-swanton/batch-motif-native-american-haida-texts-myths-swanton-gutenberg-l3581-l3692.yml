- id: ev:2
  type: summary
  locator: 3601-3607
  quote_or_summary: Women of the Food-giving-town people make nets; while fishing
    one night they see Supernatural-woman-in-whom-is-thunder wearing a rainbow blanket
    beneath a flicker blanket and compose words about her appearance as the tide comes
    in.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:3
  type: summary
  locator: 3609-3616
  quote_or_summary: A cedar called Young-cedar-woman stands behind Tcꜝig̣ogī′g̣a;
    above it lives a hair-covered woman who skins a surf scoter, fits its intact head
    and neck to her head, swims where people fish, and takes salmon from the net.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:4
  type: summary
  locator: 3618-3622
  quote_or_summary: After the woman repeats the act, net owners throw gravel seaward;
    later someone throws a stone at her, the scoter gives a dull sound and disappears,
    and the next day a woman lies there with a string of salmon.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:5
  type: summary
  locator: 3624-3637
  quote_or_summary: A man with many married elder brothers marries and tries to eat
    roasted salmon at night with his wife; she says land otters eat at night and shames
    him, and the next night he repeats the saying to shame her.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: 3639-3643
  quote_or_summary: The people build a town house with a feather-covered front, call
    it Feather-house, and say that because of it they had almost had a flood when
    the tide rose to it and then fell.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: 3645-3648
  quote_or_summary: After fishing, a wife lies with her back to the fire while a man
    has his arms around her; a cutting action occurs, and the text says the wife got
    up crying because it was done accidentally to her.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: 3650-3655
  quote_or_summary: A person fishing for silver salmon at Falling-forward sleeps after
    his daughter falls asleep in the canoe bow; in the morning the child is gone and
    black-bear tracks lead inland from the canoe.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:9
  type: summary
  locator: 3657-3660
  quote_or_summary: The town people become angry with the Black-bear people, raise
    many dogs, make many deadfalls on trails, and begin killing them.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:10
  type: summary
  locator: 3662-3669
  quote_or_summary: Dogs pursue bears from the houses; people follow and find a bear
    with two young ones in a tree, and when bows are ready she makes a motion outward
    and side to side across her nose, after which the dogs' mouths are tied.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:11
  type: summary
  locator: 3671-3675
  quote_or_summary: The bear and young ones come down, the bear licks her friends,
    they are led home and given raw food, they do not speak, and after dogs kill the
    cubs the mother's sorrow kills her.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:12
  type: summary
  locator: 3677-3679
  quote_or_summary: A person checking a deadfall finds it has fallen on a creature
    like a human being with copper on his back and brings it home.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:13
  type: summary
  locator: 3681-3692
  quote_or_summary: In Salmon-point's house, supernatural beings float in and eat
    an old man's food; his nephew dries a bullhead skin, calls them, stands in the
    doorway with needles, cuts them as they float in and out, and makes them afraid.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from supplied passage.
