- id: motif:5
  label: ceremonial wealth exchange before an in-law figure
  taxonomy_refs:
  - sacred_exchange
  basis: Prepared clam and mussel shells are carried to the destination, laid before
    the absent woman’s husband until the house is filled, and a hat is placed on top
    and returned to him.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: medium
  cautions: The passage records the giving-back of goods but does not explicitly state
