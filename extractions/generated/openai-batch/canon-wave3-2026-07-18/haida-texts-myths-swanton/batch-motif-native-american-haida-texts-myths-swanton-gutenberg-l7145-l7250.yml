candidate_motifs:
- id: motif:1
  label: supernatural transport through induced oblivion
  taxonomy_refs:
  - departure
  basis: The travelers are struck by thunderbolt feathers, forget themselves, and
    awaken on the ocean; later the expedition forgets itself during a dance and awakens
    on retaining planks.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: medium
  cautions: The passage describes the episodes literally but does not explain the
    mechanism or ritual meaning.
- id: motif:2
  label: quest to recover an absent daughter or sister
  taxonomy_refs:
  - mystical_quest
  - return
  basis: The chief announces that he will look for his daughter, the town prepares
    ten canoes, and the people wait because they want to restore their sister; at
    the destination the chief’s child is still absent.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:10
  confidence: high
  cautions: The recovery is not completed within this excerpt.
- id: motif:3
  label: supernatural wife as helper and navigator
  taxonomy_refs: []
  basis: The elder brother marries Mouse-woman so the voyagers may follow her directions;
    she commands preparations and uses a bone awl to tow the canoes. The younger brother’s
    wife is also marked as powerful and later challenges the group.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:11
  confidence: medium
  cautions: The passage identifies Mouse-woman and the younger wife as powerful or
    extraordinary, but does not narrate an explicit transformation.
- id: motif:4
  label: magic implement that parts water and tows vessels
  taxonomy_refs: []
  basis: Mouse-woman removes a bone awl from her small wooden box, puts it in the
    water, and the water rushes aside as it tows the canoes.
  evidence_refs:
