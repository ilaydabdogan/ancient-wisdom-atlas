canonical_text:
  quote: ''
  summary: A transported chief’s wife and a slave return by supernatural canoe journey
    and report the situation of the chief’s daughter. The chief mobilizes a canoe
    expedition to recover her. His sons return with powerful wives, including Mouse-woman,
    who guides the flotilla with a bone awl that cuts through the water. At the destination
    the voyagers undergo another episode of forgetfulness, present shell wealth and
    a hat before the absent woman’s husband, and then face the approach of a powerful
    father accompanied by wind and shaking earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At dawn a young hair seal is crying in the house, and the visitors start off
    by canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A canoe lies on top of retaining planks; the male traveler fastens the chief’s
    wife and himself into it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A thunderbolt behind screens sends feathers toward the fire; when the feathers
    strike the travelers, they forget themselves and later come to themselves on the
    ocean.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After untying himself and the chief’s wife, the male traveler paddles and
    reaches his master’s town after two strokes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief’s wife reports the daughter’s situation to her husband, and the
    slave reports to his master what others had said.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief summons the town, feeds the people, announces that he will look
    for his daughter, and directs chiefs to start in ten canoes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief’s oldest and youngest sons disappear on successive mornings, and
    the town waits for them because the people want to restore their sister.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Figures of cumulus clouds are drawn on clam shells, mussel shells are placed
    inside them, and shells are gathered in specified amounts for the family and townspeople.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elder son returns with cedar limbs in his hair and brings a wife identified
    as Mouse-woman, described as curly-haired, parted-haired, and large-eyed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The younger son returns with a small fern in his hair and brings a powerful
    wife, described as hard to look at, short, curly-haired, and wearing a copper
    blanket; she refuses to enter until he brings her in.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The flotilla starts on the ocean; the elder brother’s wife sits visibly and
    keeps a small wooden box with her, while the younger brother’s wife conceals herself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mouse-woman takes a bone awl from her box, puts it into the water, and the
    water rushes aside as the awl tows the canoes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After smoke from a town appears, Mouse-woman directs the voyagers to land,
    cut long sticks, and fasten poles across the canoes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In front of the chief’s house the voyagers are told to remain still for a
    dance; after a time they forget themselves and later wake on retaining planks.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The voyagers untie themselves and the poles fastened on the canoes after waking
    on the retaining planks.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The chief’s child, the person sought by the voyagers, is absent; her husband
    sits there, and the visitors lay clam shells before him until they fill the house,
    then place a hat on top and return it to him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: A father is summoned; as he approaches there is a wind sound, the house moves,
    and the earth shakes.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: The visitors keep their heads lowered, but the younger brother’s wife raises
    her head and asks whether they also have no power.
  category: speech
  evidence_refs:
  - ev:11
