canonical_text:
  quote: ''
  summary: An unnamed man goes out from town to make a canoe with his wife and children.
    After he wishes for a sister to bring food, his sister, long ago carried away
    in the woods, arrives with food and conveys instructions from his brother-in-law.
    The canoe is turned and later brought out by unseen helpers. The sister accepts
    crab arms as gifts and brings food nightly. The family travels to the town she
    indicates, where the house becomes tree roots at night and is restored by day.
    After the canoe is finished, the sister gives departure taboos against looking
    back and speaking of that country. The child twice speaks of their life there
    and the party is returned to the town, before finally reaching home. An editorial
    note identifies the tale as a land-otter story and contrasts its benevolent land-otter
    role with more harmful land-otter stories.
  language: English
  quote_policy: summarized
