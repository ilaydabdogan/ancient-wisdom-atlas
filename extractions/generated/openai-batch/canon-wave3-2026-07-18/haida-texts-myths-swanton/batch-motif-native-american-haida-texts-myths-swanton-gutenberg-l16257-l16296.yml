canonical_text:
  quote: ''
  summary: 'The passage gives the end of one episode in which a grandson uses his
    grandmother’s urinal as a drum and sings that she ate her own cut-off vulva while
    she calls him a wizard. It then gives a Boas-obtained version: a boy and his grandmother
    live in a twig hut; a bear swallows the boy; he summons his grandmother’s fire
    drill, lights a fire inside the bear, kills it, butchers it, brings the meat home,
    obtains fire from town, distributes bear meat and fat, then mutilates his sleeping
    grandmother, roasts the severed flesh, deceives her into eating it, and runs out
    singing that she ate her own vulva.'
  language: English
  quote_policy: summarized
