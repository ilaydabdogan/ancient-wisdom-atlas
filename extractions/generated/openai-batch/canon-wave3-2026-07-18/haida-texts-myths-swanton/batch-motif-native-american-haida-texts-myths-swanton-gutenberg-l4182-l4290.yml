canonical_text:
  quote: ''
  summary: The passage recounts episodes in which Lg̣akꜝia′o is trapped in a crevice
    and released after his parents burn property and speak through the fire to a supernatural
    being; he later dies after mocking plucked hadja/birds. It then describes compensation
    and a grave, a woman shaman promised ten whales whose souls appear as mussels,
    and a fatal act of speaking against an unseen supernatural being on a tidal island.
    The passage ends with an ethnographic note and an untranslated Haida-language
    section headed QꜝŌ′NA-QĒ′G̣AWA-I.
  language: English with Haida-language text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lg̣akꜝia′o is let down into a crevice; when he tries to get out, the walls
    press against his head and the tide rises toward him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: His parents bring hides, paints, and feathers, start a fire, put these items
    into it, and speak through the fire to I′ʟꜝga-i-ᴀ′ndjusg̣as; after the property
    is destroyed, the crevice enlarges and he is pulled out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that supernatural beings began to take Lg̣akꜝia′o because
    he made fun of the hadja of I′ʟꜝga-i-ᴀ′ndjusg̣as.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After going for birds again, the group plucks the hadja, releases them, and
    makes fun of them; while going along a cliff edge, Lg̣akꜝia′o falls, moves after
    being told not to move, falls again, and is smashed below.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the children return home, Lg̣akꜝia′o’s father tells them not to enter
    their houses, and the children’s parents pay him property including many moose
    skins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lg̣akꜝia′o’s body is set up with a four-post grave; one post has a tree, and
    boys stop playing with boys of Those-born-at-Skedans after the injury is paid
    for.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman of Those-born-at-Skedans becomes a shaman; when she begins to perform,
    she has her father tie a dancing skirt on her, and a supernatural power promises
    her ten whales.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After fasting, the woman hears a lip-like noise, sees mussels, and the passage
    identifies the mussels as souls of whales; after ten nights, ten whales are found
    in Skedans creek.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A person reports that someone is walking on Island-that-turns-about-with-the-tide;
    a woman calls toward the island, and a canoe party goes to look but sees nothing
    there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the canoe party returns, people weep in Gutkwā′-ida; the passage states
    that the woman had spoken against the supernatural being and died.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note says the story was told by a Skidegate story-teller who belonged to
