candidate_motifs:
- id: motif:1
  label: Human child enters animal-people world by canoe
  taxonomy_refs:
  - departure
  basis: The hungry child is invited into a narrow canoe by two persons and taken
    to a town where Salmon and Herring people are later revealed as inhabitants or
    associated collectives.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly name the destination as an underworld
    or otherworld; this label is based on the literal difference between the child's
    home and the town of animal people.
- id: motif:2
  label: Food taboo with bodily transformation warning
  taxonomy_refs:
  - initiation
  basis: The half-rock person tells Moldy-forehead not to eat offered food and explains
    his own half-rock condition as the result of eating it.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states the warning and consequence but does not provide a
    formal initiation frame.
- id: motif:3
  label: Reciprocal handling of animal remains restores animal-person bodies
  taxonomy_refs:
  - sacred_exchange
  basis: The half-rock person instructs Moldy-forehead to burn all salmon bones; unburned
    eye and rib parts correspond to diseased persons, and burning the parts heals
    them.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The taxonomy reference is approximate; the passage presents a practical
    rule and healing correspondence, not an explicit contract.
- id: motif:4
  label: Animal souls enter human fishing waters
  taxonomy_refs: []
  basis: The text states that the souls of the Salmon people are what came into the
    creeks there.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No additional taxonomy reference is assigned because the available list
    has no exact animal-soul migration category.
- id: motif:5
  label: Hazardous canoe ascent toward the surface of the earth
  taxonomy_refs:
  - ascent
  basis: The Salmon people travel in one canoe toward the surface of the earth, encountering
    floating charcoal, floating foam, and the descending edge of the sky where the
    canoe breaks.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage specifies movement toward the surface of the earth but does
    not otherwise define a cosmological map.
- id: motif:6
  label: Passage through moving sky barrier
  taxonomy_refs: []
  basis: At the edge of the sky, the travelers count how many times it descends and
    pass under it after five closings, breaking the canoe and leaving few survivors.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available taxonomy reference exactly matches the moving sky barrier.
- id: motif:7
  label: Return to creek as salmon and death by human kin
  taxonomy_refs:
  - return
  - death_rebirth
  basis: After traveling with Salmon people to salmon inlets and a creek mouth, Moldy-forehead
    recognizes his mother, swims ashore, and allows her to club him to death.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:12
  confidence: medium
  cautions: The passage does not explicitly say Moldy-forehead has become a salmon,
    though the surrounding journey, creek, fish trap, and clubbing context support
    a cautious motif candidate.
- id: motif:8
  label: Rain-making by shaking the sky
  taxonomy_refs: []
  basis: Those in the canoe shake the sky with a pole, and rain begins at once.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No exact taxonomy reference is available beyond the literal water/rain
    symbol.
