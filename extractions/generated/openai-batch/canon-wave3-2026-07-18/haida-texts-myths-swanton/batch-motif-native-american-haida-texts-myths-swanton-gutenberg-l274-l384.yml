canonical_text:
  quote: ''
  summary: A child called Moldy-forehead, hungry during a famine, enters a canoe-borne
    town associated with Salmon and Herring people. A half-rock person warns and instructs
    him about food, salmon bones, and fire. Mishandled salmon parts correspond to
    injuries among Salmon people and are healed when burned. Later he joins Salmon
    people traveling toward the surface of the earth through hazards, sky-edge passage,
    and salmon inlets, then meets his human mother near a creek and finally allows
    her to club him to death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a famine, a child asks his mother for food; she gives him the upper
    part of a dog salmon, which he thinks is too small, and he cries.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child chews the dog salmon, puts it into a swampy place by the beach,
    and the salmon swells there into a great quantity; he then regrets losing it and
    cries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two persons arrive in a narrow canoe, invite the child in, and take him to
    a town where they land before the chief's house and give him food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person sitting in the house corner, described as half rock, warns the child
    not to eat the offered food and says he became half rock because he ate it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The child plays with children and secretly eats salmon eggs; another child
    shouts that Moldy-forehead is eating their excrement.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The half-rock person instructs the child to take salmon from a stream, roast
    it, eat all parts, and put all bones into the fire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the child leaves out the hard part around a salmon's eye, the chief's
    son's eye becomes diseased; when the omitted part is found and burned, the disease
    is gone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the souls of the Salmon people were what came into
    the creeks there.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a rib is left unburned, a person's rib becomes diseased; after the rib
    is found and burned, the sick person becomes well.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: People come dancing on canoes, and the half-rock person identifies an action
    for the child involving a young hemlock bough at the house where they dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The child is told not to look in after pushing the hemlock bough into the
    house corner, but he looks; his head sticks there, and his face and the bough
    become covered with eggs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Herring people leave, and later the Salmon people begin moving in one
    loaded canoe toward the surface of the earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Some people with injured feet and bound-up eyes want to travel, but they are
    refused; one hidden person is found, pulled up, and thrown ashore.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Moldy-forehead enters the canoe with the Salmon people; some travelers are
    lost at floating charcoal and others at floating foam.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: At the edge of the sky, the travelers count the sky's descents; after it has
    closed five times they pass under it, and the canoe splits in two, leaving few.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The travelers see things like many stars, which the passage identifies as
    salmon inlets; groups get off at different inlets.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:17
  text: At a creek mouth, people say “Ē′yo” to the travelers, causing them to be ashamed
    and sit down.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: In the evening Moldy-forehead sees his mother with pitch on her face, weeping,
    and sees his father walking about.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:19
  text: The travelers are told a fort has been built; later the passage states that
    this fort was a fish trap.
  category: object
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:20
  text: In fine weather, the canoe occupants pull off a pole from inside the canoe
    edges and shake the sky with it, after which rain begins to fall.
  category: action
  evidence_refs:
  - ev:11
- id: obs:21
  text: The canoe occupants prepare angrily to fight the fish trap.
  category: action
  evidence_refs:
  - ev:11
- id: obs:22
  text: Moldy-forehead recognizes his mother, swims ashore in front of her, first
