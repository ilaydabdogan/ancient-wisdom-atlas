canonical_text:
  quote: ''
  summary: A weak eldest son, Supernatural-being-who-went-naked, is despised while
    his seven younger brothers are defeated by a cloud-associated wrestler and sent
    away. After his mother laments him, he asks his sister to help him enter water-filled
    stone boxes, which he bursts by stretching, then enters the sea, seizes sea-animal
    tails, grasps a slender power that pulls him and cracks an island, and undergoes
    repeated ordeals by falling trees, ice, rocks, and a red-skinned whipper.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The household includes the mother, the sister, the eldest son, and seven younger
    brothers; the eldest is associated with bad things, while the younger brothers
    are described as like supernatural beings.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A younger brother shouts, and a cloud comes from the ocean or inlet; a person
    stands where the cloud touches and wrestles with him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cloud-associated wrestler defeats and bewitches the younger brothers and
    sends them to a flint point at the rear of his father’s house; one defeated brother
    goes upward into the air.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The mother weeps and says that her eldest son is nothing and that her mind
    is sad all the time.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sister tends the fire, and Supernatural-being-who-went-naked sleeps where
    the fire had been; he is weak and unable to sit up.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Supernatural-being-who-went-naked asks his sister to bring one of their mother’s
    stone boxes; she pours water into it, and he crawls into it after nearly fainting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: While he is in the water-filled stone boxes, his sister presses his floating
    buttocks down with a poker, and he bursts multiple boxes by stretching or with
    his knees.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the sea before Gū′łg̣a, he seizes the tails of a flounder, halibut, porpoise,
    white porpoise, and whale, throws them ashore, and tells his sister to steam them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: He grasps a slender thing in the sea; it pulls him away, he gains a foothold
    at Łg̣a′-ixa, the bottom of the island cracks, and he fastens the thing around
    his head before returning up the inlet.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Fallen trees descend noisily toward him; after he first runs away, forest
    vegetation and birds call him a coward and say his power is weak, and when he
    reenters the water the trees strike him without effect and float away as old rotten
    trees.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Ice and then rocks descend toward him; in each case he first runs away, is
