canonical_text:
  quote: ''
  summary: A man repeatedly acts like a shaman at night, and Tcꜝaawu′nkꜝa names himself
    through him. His grandmother equips him with shamanic regalia and leads songs
    for him. He later cures a chief’s sick son after other shamans fail, gains property
    and fame, undergoes an underwater ordeal tied to a rope, and is then taken at
    midnight by Land-otter people to help their chief’s sick son, while most of his
    nephews are put to sleep.
  language: English
  quote_policy: summarized
