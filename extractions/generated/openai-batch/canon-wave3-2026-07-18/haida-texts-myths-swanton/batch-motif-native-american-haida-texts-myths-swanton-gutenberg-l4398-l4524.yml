canonical_text:
  quote: ''
  summary: A story associated with bear songs tells of a man who sets deadfalls for
    black bears, fails, fasts, and dies. His son continues to inspect the deadfalls
    and finds black bears caught in them; when he prepares to skin them, the bears'
    bodies sing through him. The passage also includes an episode involving Marten
    and his younger brother Black-bear, with song, dance, and salmon-gathering details.
    It concludes that ten black bears were taken and each sang through the human being,
    though the informant knew only seven songs.
  language: English
  quote_policy: summarized
