canonical_text:
  quote: ''
  summary: The passage recounts ritual speech and dancing after a conflict, attempted
    and accepted blood-money payments, distribution of slaves, blankets, and other
    property, succession to an uncle's place through marriage to the uncle's wife,
    feasting of Eagles and Ravens, carving and raising of a grave post, renewed fighting
    after a quarrel, and a separate war between the Eggs-of-Skîtgaoqao and Inlet-rear-town
    people that begins with a night shooting during seal hunting and continues by
    canoe and on land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man identified as an uncle and a member of the Cod-people came behind
    the town singing catastrophe songs and delivered a speech about a war trail and
    a feather trail leading to the town of Gāla, the addressee's father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After two days in the woods, dancers were called toward the house, stood in
    line with guns ready, faced lines of Ya′gun-gîtîna′-i, and struck one another
    with guns and knives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cod-people picked up two chiefs of the Ya′gun-gîtîna′-i and laid them
    on a bed of feathers in the rear of the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two slaves, and then two more slaves, were offered as blood money to Those-born-at-Ya′gun,
    and both offers were refused.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tcꜝā′nut objected that his uncle was worth ten slaves and four hundred blankets
    and said that he would not dance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Middle-gîtî′ns took the dancers into their house because they had started
    the trouble, gave four slaves and much property, after which the Ya′gun-gîtîna′-i
    began to dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After further dancing, the Cod-people gave six slaves as blood money, faces
    were washed, and the Skîtg̣a′oqao, Middle-gîtî′ns, and Cod-people gave additional
    property including seven hundred blankets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tcꜝā′nut married his uncle's wife and was made to take his uncle's place,
    but later conflict arose when he stayed away from his wife and the Middle-gîtî′ns
    told him to leave the house.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tcꜝā′nut called in Eagles and Ravens on alternating days, fed them, used eighty
    boxes of grease and berries, and the Eagles assigned the work on his uncle's grave
    post.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The grave post was obtained, carved by the narrator's father, raised, and
    the potlatch ended with distributions of blankets and slaves and payment to the
    carver.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After quarreling with his younger brother, Tcꜝā′nut shot one of the Cod-people
    through the smoke hole, fighting resumed for two days, and property was given
    for the person killed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: In the second account, people living together at Masset went up the inlet
    in fall to dry salmon and camped on both sides of A′-în.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: During a night hair-seal hunt by some Eggs-of-Skîtg̣ao, a gun sounded from
    across a point and a boy in a canoe cried that he had been shot.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A companion asked who had done it, shot toward people pulling away in darkness,
    hit the man in the bow so that he fell into the water, and later reports returned
    to both sides.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The Eggs-of-Skîtg̣ao and Inlet-rear-town people fought through the fall; because
    wives were between the families, their sons got dog salmon for them.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: The two families fought in canoes on the way down, women followed behind in
    canoes, fighting continued on land through the night and next morning, many Inlet-rear-town
    people were killed, and later the Inlet-rear-town people began settling at Yan
    with a fort on an islet.
  category: sequence
  evidence_refs:
  - ev:14
