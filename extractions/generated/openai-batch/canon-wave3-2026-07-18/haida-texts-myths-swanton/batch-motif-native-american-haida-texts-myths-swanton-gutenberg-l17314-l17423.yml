    with guns ready, face the Ya′gun-gîtîna′-i, and strike each other with guns and
    knives.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:3
  type: summary
  locator: lines 17333-17340
  quote_or_summary: The Cod-people pick up two Ya′gun chiefs, lay them on a feather
    bed, and offer two slaves and then two more as blood money to Those-born-at-Ya′gun,
    who refuse.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:4
  type: quote
  locator: lines 17341-17345
  quote_or_summary: Tcꜝā′nut says, “My uncle is worth ten slaves and four hundred
    blankets. I will not dance.”
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:5
  type: summary
  locator: lines 17346-17355
  quote_or_summary: The Middle-gîtî′ns bring the dancers to their house because they
    had started the trouble, give four slaves and much property, the Ya′gun-gîtîna′-i
    dance, and the Gîtî′ns also give property.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:6
  type: summary
  locator: lines 17356-17362
  quote_or_summary: After four nights of dancing, the Cod-people give six slaves as
    blood money; faces are washed, dancing begins, and the Skîtg̣a′oqao, Middle-gîtî′ns,
    and Cod-people give more property, including seven hundred blankets.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:7
  type: summary
  locator: lines 17363-17368
  quote_or_summary: Tcꜝā′nut marries his uncle's wife and is made to take his uncle's
    place; after he stays away from his wife, the Middle-gîtî′ns rebuke him and tell
    him to leave the house.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:8
  type: summary
  locator: lines 17369-17379
  quote_or_summary: Tcꜝā′nut's wife has him call in friends; he feeds Eagles and Ravens
    on alternating days, uses eighty boxes of grease and berries, and the Eagles assign
    work on his uncle's grave post.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:9
  type: summary
  locator: lines 17380-17386
  quote_or_summary: The grave post is obtained, carved by the narrator's father, raised,
    and the potlatch ends; blankets and slaves are given away, and the carver receives
    slaves and twenty blankets.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:10
  type: summary
  locator: lines 17387-17394
  quote_or_summary: Tcꜝā′nut quarrels with his younger brother, shoots one of the
    Cod-people through the smoke hole, fighting resumes for two days, and property
    is given for the person killed.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:11
  type: summary
  locator: lines 17395-17405
  quote_or_summary: In the war between the Eggs-of-Skîtg̣ao and the Inlet-rear-town
    people, both live at Masset, go up the inlet to dry salmon, and during a night
    hair-seal hunt a gun sounds and a boy in the canoe cries that he has been shot.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:12
  type: summary
  locator: lines 17406-17413
  quote_or_summary: A companion asks who did it; when people pull away instead of
    answering, he shoots in the darkness, hitting the man in the bow, who falls into
    the water; reports later reach both sides.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:13
  type: summary
  locator: lines 17414-17418
  quote_or_summary: The Eggs-of-Skîtg̣ao and Inlet-rear-town people begin fighting
    through the fall, while wives are between the families and sons get dog salmon
    for them.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; Project Gutenberg text supplied in request.
- id: ev:14
  type: summary
  locator: lines 17419-17423
  quote_or_summary: Both families fight in canoes while women come behind; they fight
    again on land, many Inlet-rear-town people are killed, and the Inlet-rear-town
