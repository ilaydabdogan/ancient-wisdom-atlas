    given as blood money or after a killing, with dancing and face washing following
    settlement.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:10
  confidence: medium
  cautions: The passage describes social and ceremonial exchange literally; the broader
    taxonomy label is approximate and should be reviewed.
- id: motif:2
  label: potlatch distribution tied to grave-post completion
  taxonomy_refs:
  - sacred_exchange
  basis: Tcꜝā′nut hosts groups with food, the grave post is assigned, carved, and
    raised, and the potlatch ends with distributions of blankets and slaves and payment
    to the carver.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage uses the term potlatch and records property distribution,
    but does not explicitly frame it in mythic or sacred terms.
- id: motif:3
  label: succession to an uncle's place through marriage to the uncle's wife
  taxonomy_refs: []
  basis: The passage states that Tcꜝā′nut married his uncle's wife and that they made
    him take his uncle's place.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No broader dynastic or royal-legitimacy claim is made by the passage itself.
- id: motif:4
  label: retaliatory feud escalation from a shooting
  taxonomy_refs: []
  basis: A shooting in darkness during a night hunt leads to reports to both sides
    and to fighting between the Eggs-of-Skîtg̣ao and Inlet-rear-town people through
    the fall and during travel by canoe and on land.
  evidence_refs:
  - ev:11
  - ev:12
