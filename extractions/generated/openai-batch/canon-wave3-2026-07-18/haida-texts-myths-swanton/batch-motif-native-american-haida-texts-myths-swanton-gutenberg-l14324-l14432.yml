canonical_text:
  quote: ''
  summary: The passage contains a deluge-origin account in which Naēku′n emerges,
    a two-faced man directs people, Raven opens a cockleshell containing people and
    makes towns and family names, and a House-point woman with four teats is associated
    with the Raven families. It then narrates how Gasî′na-ᴀ′ndju, after gambling away
    his father’s potlatch property, travels through a dangerous landscape, drinks
    from a blue stream, enters a big house, receives ritual treatment and named gambling
    sticks from a chief, and returns with instructions, a sea otter, and a copper
    found in a gambling-stick bag.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the deluge, Naēku′n is described as the first place to emerge from the
    waters, and people hold a council about which way to go.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: A two-faced man comes to the deliberating people, asks why they cannot decide,
    and tells them which way to go.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Raven finds a cockleshell thrown by waves, hears noise inside, discovers children
    or people in it, opens it, makes towns, and gives names to Haida families.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the flood subsides, a woman is sitting on House-point; she has four teats,
    each owned by one of the Raven families named in the passage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the House-point people begin to increase, they cover themselves with
    grass, twirl sticks to light fires, and float fishing lines from the spit because
    they lack canoes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gasî′na-ᴀ′ndju begins gambling while his father is away inviting the Tsimshian
    and loses all of his father’s potlatch property.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Gasî′na-ᴀ′ndju puts a bladder full of grease into his gambling-stick bag,
    carries it on his back, and leaves.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: On his journey he eats leaves, defecates at a rotten stump, and passes moss-covered
    human bones and fresh human bones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Two streams flow down from Djū′tcꜝîtga; one is red and one is blue, and those
    who drink from the red stream die there.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gasî′na-ᴀ′ndju greases his insides, drinks from the blue stream, loses consciousness,
    and then finds himself before a big house with a two-headed house pole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The chief inside the house addresses him as grandson, refers to his gambling
    loss, uses a hawk feather at the corner of his eye, and removes blood and moss.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The chief squeezes the gambling sticks so that blood comes out and gives names
    to the sticks, including Coming-out-ten-times and Sticking-into-the-clouds.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The chief indicates that one of two transparent young fellows will go with
