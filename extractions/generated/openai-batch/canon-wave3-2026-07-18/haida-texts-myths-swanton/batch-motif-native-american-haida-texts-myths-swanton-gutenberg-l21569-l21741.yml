  quote: ''
  summary: The passage consists of editorial notes explaining names, places, linguistic
    identifications, story references, and interpretive comments connected with several
    Haida narratives. The notes mention shamans, spirits, Old Kloo, Tsimshian songs
    and words, Christian and white-contact influences, portents, place names, creatures
    associated with wealth, fasting and wandering, a mountain, a tree thrown at a
    shaman, and a condition associated with seeing a menstruant woman.
