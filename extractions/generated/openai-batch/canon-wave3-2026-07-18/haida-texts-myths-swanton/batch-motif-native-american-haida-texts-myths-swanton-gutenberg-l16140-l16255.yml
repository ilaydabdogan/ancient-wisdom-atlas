canonical_text:
  quote: ''
  summary: 'The passage closes a story in which a man tests canoe visitors with a
    bone, urine hand-washing, paddles placed in fire, and food placed in fire; impostor
    visitors are identified as land otters or minks, while true friends and his sister
    retrieve him, restrain his attacks, and return him to town. An editorial note
    connects the story with Haida and Tlingit notions of gā′gix̣īt, or wild men, and
    land otters. The passage then gives two children’s stories: one about a younger
    sibling who has been destroyed, and another in which Song-sparrow kills Grizzly-bear
    from inside its belly with fire, loses most of the bear meat to townspeople, and
    later mutilates and deceives his grandmother into eating the cooked body part.'
  language: English
  quote_policy: summarized
