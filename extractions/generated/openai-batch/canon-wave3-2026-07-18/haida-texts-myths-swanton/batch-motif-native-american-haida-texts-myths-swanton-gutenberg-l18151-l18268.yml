  basis: Alder sings while fleeing, verbally challenges Hemlock-bark-scraping-knife,
    and escapes when pursuers fear he is leading them to nearby enemies.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives a tactical escape episode rather than an explicitly
    supernatural or heroic cycle.
- id: motif:2
  label: captives exchanged for war matériel
  taxonomy_refs: []
  basis: Two slaves are traded for guns and ammunition, and ammunition is gathered
    for war.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a social-war pattern in the account, not a sacred exchange unless
    later context supports that reading.
- id: motif:3
  label: abandoned enemy settlement burned
  taxonomy_refs: []
  basis: The expedition finds the fort empty with property left behind and burns the
