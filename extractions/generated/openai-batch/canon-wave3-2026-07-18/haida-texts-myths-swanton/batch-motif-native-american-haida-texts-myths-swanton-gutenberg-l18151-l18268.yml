canonical_text:
  quote: ''
  summary: 'The passage recounts connected warfare episodes: Alder escapes Ninstints
    pursuers, captives are exchanged for weapons, a war expedition burns an abandoned
    fort, a shaman-like performance attacks enemy souls, battles and raids kill Ninstints
    figures, captives and property affect chiefly status, and the war ends after a
    head trophy is taken. A following episode tells of a woman taken by a lover from
    another town and the former husband killing both her and the man.'
  language: English
  quote_policy: summarized
