canonical_text:
  quote: ''
  summary: Supernatural-being-who-went-naked refuses multiple women, accepts a lame
    woman, and marries a chief-woman. A star appears at the rear of the house, and
    an unseen speaker under his pillow asks whether black cod binds him there. He
    overextends a net among whales, loses its meshes, and accompanies his wife to
    her father to recover it. At the father’s house he is given red-hot white stones
    in a rock tray and swallows them after taking medicine. Black cod are presented,
    rejected, then correctly served; his wife gives him the heads and bones to guard,
    but they disappear after warning about He-who-has-spines-for-earrings. Later the
    pillow-speaker says Nᴀñkî′lsʟas restored the younger brothers to life by being
    born from the protagonist’s mother. The protagonist sees a marten tail pass through
    a star, finds Nᴀñkî′lsʟas with a woman, leaves by canoe with black cod, and reaches
    his younger brothers’ town, where the brothers prefer Nᴀñkî′lsʟas, whose face
    is hidden by clouds.
  language: English
  quote_policy: summarized
