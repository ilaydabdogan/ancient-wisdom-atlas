candidate_motifs:
- id: motif:1
  label: Acceptance after multiple rejected suitors or visitors
  taxonomy_refs: []
  basis: The protagonist refuses ten women but accepts the lame woman by putting his
    arm around her.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not explain whether the lame woman and the later chief-woman
    are the same person.
- id: motif:2
  label: Food that may bind a person to a place
  taxonomy_refs: []
  basis: The unseen speaker twice asks whether eating black cod or black cod itself
    sticks the protagonist there.
  evidence_refs:
  - ev:2
  - ev:13
  confidence: high
  cautions: The passage phrases this as a question and does not explicitly state the
    mechanism of binding.
- id: motif:3
  label: Overstepping a warned limit on a powerful net
  taxonomy_refs: []
  basis: The wife warns that more than one should not be let out; the protagonist
    lets out two meshes among whales and loses all five into the water.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not name the net as supernatural, though its use among
    whales and the warning mark it as unusual.
- id: motif:4
  label: Dangerous hospitality test with swallowed heated stones
  taxonomy_refs:
  - initiation
  basis: At the wife’s father’s house, red-hot stones in a rock tray are set before
    the protagonist, and he swallows all four after taking medicine; the wife calls
    this sort of act a weapon.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly call this an initiation; the taxonomy
    reference is functional and should be reviewed.
- id: motif:5
  label: Discernment of correct food before eating
  taxonomy_refs: []
  basis: Several black-cod offerings are rejected as “something different” before
    the wife identifies the correct black cod and has them prepared.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The basis for distinguishing the rejected fish from the correct fish is
    not explained in the excerpt.
- id: motif:6
  label: Guarded food remains removed without sensation
  taxonomy_refs: []
  basis: The wife tells the protagonist to guard the black-cod heads and warns that
    He-who-has-spines-for-earrings can remove them from his clothing without his feeling
    it; the heads are later gone.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage implies but does not directly narrate the act of removal.
- id: motif:7
  label: Restoration to life through rebirth from the mother
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The under-pillow speaker says Nᴀñkî′lsʟas restored the protagonist’s younger
    brothers to life by letting himself be born from the protagonist’s mother.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The brothers’ prior death is reported in this passage but not narrated
    within the excerpt.
- id: motif:8
  label: Animal sign entering through a star to lead to a hidden encounter
  taxonomy_refs: []
  basis: After the revelation, the protagonist sees a marten tail pass through the
    star and then goes there, finding Nᴀñkî′lsʟas with a woman.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage does not explicitly identify the marten tail with Nᴀñkî′lsʟas
    or any other figure.
- id: motif:9
  label: Deceptive departure from spouse
  taxonomy_refs:
  - departure
  basis: The protagonist says he is sad because he left his mother nearby, which the
