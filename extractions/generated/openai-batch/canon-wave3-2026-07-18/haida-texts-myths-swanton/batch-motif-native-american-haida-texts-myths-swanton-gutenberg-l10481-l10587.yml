canonical_text:
  quote: ''
  summary: A man named He-who-was-born-from-his-mother’s-side is repeatedly warned
    by something moving under his pillow that feared supernatural beings are gathering
    against him. With advice from an old man identified as Heron and addressed as
    grandfather, he repels a thunderbird carrying his grandfather’s town, sea-borne
    attackers identified as silver salmon, dog salmon, sand fleas, and fleas, and
    finally a great fire coming over the ocean from the edges of the sky. The fire
    overcomes defenses made from human bones and grave boxes; the man puts on five
    blankets, carries his mother in his armpit and his wife in his hair knot, and
    starts off.
  language: English
  quote_policy: summarized
