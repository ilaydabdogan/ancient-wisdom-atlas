canonical_text:
  quote: ''
  summary: A left-handed man travels inland, catches and skins a lake creature identified
    as Loon, and uses the loon skin to see and hunt underwater. After marriage, he
    secretly supplies food to his affinal household, brings down copper from a cliff,
    and avoids shaming a slave who wears his clothes. His wife later takes the loon
    skin and drowns after mistaking an underwater log for salmon; the slave imitates
    the practice and disappears. The passage closes with etiological explanations
    about copper, shame, and meddling, plus an editorial comparison to rival-town
    stories among Tsimshian and Haida.
  language: English
  quote_policy: summarized
