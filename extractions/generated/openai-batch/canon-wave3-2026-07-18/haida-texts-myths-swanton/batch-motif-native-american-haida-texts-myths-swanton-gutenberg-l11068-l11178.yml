canonical_text:
  quote: ''
  summary: 'The protagonist is repeatedly sent by his father-in-law, Many-ledges,
    to obtain dangerous beings: a hair seal, an eagle, and a clam. His wife gives
    timed instructions, and his father’s supernatural helpers rescue him from monsters
    that swallow him. He kills or defeats the beings, scatters part of their bodies
    for future people, and brings part back to the house. He also survives a heated
    stone-box ordeal by using medicine, after which the father-in-law’s attitude changes.
    A note locates a killed devilfish in a cave at Skedans point and identifies Many-ledges
    as a cliff behind Skedans. The protagonist then returns with his wife in a self-moving
    canoe whose bow carving paddles and which must be fed boxes of berries and grease
    when it turns back.'
  language: English
  quote_policy: summarized
