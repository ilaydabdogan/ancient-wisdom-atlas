canonical_text:
  quote: ''
  summary: The supplied interlinear passage describes a canoe journey to the edge
    of the sky and through inlet mouths, arrival at Seaward creek, a later episode
    in which a man sees his mourning parents, conflict around a fort or fish trap,
    his mother killing him after recognizing or failing to recognize him, his body
    being laid on a clean plank, his gradual re-emergence after four nights, his becoming
    a shaman, and a later salmon-spearing episode involving a shining salmon.
  language: English with Haida interlinear text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A canoe or floating group travels to the edges of the sky; when something
    shuts, the canoe is broken in half and crushed, leaving only a few people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The remaining travelers enter or see a place described as like many stars
    and identify inlet mouths; groups of three, four, five, and ten persons get off
    into large inlets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: People arrive floating at the mouth of Seaward creek, stand up, are addressed
    with the cry “ēyō,” are made ashamed, and sit down.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the evening a male figure sees his mother weeping in mourning and sees
    his father walking about.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: People say a fort is being built on account of the group; observers go up
    repeatedly to inspect it until they say it is finished.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In fine weather, people in a canoe pull a long pole from inside the canoe
    edge and shake the sky with it, after which rain falls at once.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The fort is also described as a fish trap, and the people start up in a crowd.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The mother recognizes the male figure, he swims ashore in front of her, and
    she tries to club him; he escapes seaward at first.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When the male figure repeats the action, his mother clubs him to death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the mother begins to cut off his head for immediate cooking, the knife
    clicks against something at his neck; she sees a copper object around her son's
    neck and recognizes him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The mother places him on a clean plank, the father remains in the house, and
    the house is placed over him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: After four nights a slight sound begins in his throat; the top of his head
    becomes visible, and over the passing nights he continues coming out.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Rain washes salmon skin off him; he enters the house, becomes a shaman, and
    people sing for him.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: In the next season people return for salmon; when salmon come up, one shining
