canonical_text:
  quote: ''
  summary: A son and father depart from the mother; the father tells her to settle
    at the head of the creek. She instructs her youngest uncle to use a new hat and
    paddle for fishing, raises her dress to make wind from the inlet, and saves only
    the man with the new hat by reaching to his thread of life. She is identified
    as Fine-weather-woman. She later settles up the creek, moves after a trail over
    her tickles her, and sends small snowflakes, identified as feathers, when her
    son sits over the ocean. An editorial note identifies Sîñ, translated as Shining-heavens,
    as a sky god and mentions a similar Tsimshian sky god, Laxha′. A Haida-language
    heading and text follow.
  language: English; Haida/Skidegate dialect
  quote_policy: summarized
