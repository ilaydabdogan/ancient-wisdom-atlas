- id: obs:4
  text: A low bitter herb is said to grow on dead trees and have leaves like clover.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wrestling took place by a beach-gravel rock, and the note says the strange
    wrestler was presumably transformed into that rock.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Halibut hooks were commonly made from rotted hemlock limb stumps, and the
    note says the monster was transformed into these hooks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Supernatural beings hunt at night and return before ravens call; if delayed
