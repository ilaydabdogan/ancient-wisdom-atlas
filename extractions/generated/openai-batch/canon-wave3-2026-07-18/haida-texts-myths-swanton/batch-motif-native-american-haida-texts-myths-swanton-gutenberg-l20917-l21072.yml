- id: obs:10
  text: A bowl of water is identified as the ancient Haida looking-glass.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Red streaks in the morning clouds are associated with days that will be windy
    and may be represented by cloud designs in stories.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: Everything thrown or fallen into the sea is said to pass under the floor planks
