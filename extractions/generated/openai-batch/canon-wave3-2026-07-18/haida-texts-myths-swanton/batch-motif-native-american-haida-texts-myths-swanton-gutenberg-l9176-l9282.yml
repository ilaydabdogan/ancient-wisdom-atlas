canonical_text:
  quote: ''
  summary: A powerful traveler tells his crying mother that he is not truly her son
    and leaves after one more night. Wearing layered coats and skins, he journeys
    along the coast, encounters supernatural beings, passes a shut-door being, helps
    or compels a black-cod fisher through a rocky cave, escapes a five-finned ambusher
    by entering a halibut skin, crosses dangerous coastal places, threatens canoe
    fishermen and transforms one into rock, pursues an eagle that took his skin, and
    defeats an armed being. The passage then shifts to Upward, chief of Skedans and
    owner of Sand-reef, whose seal rights are mocked and contested by two sons of
    Farthest-one-out; after he captures them, they seize him, take him to their father’s
    house, and report the incident.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The traveler tells his mother that he intends to leave, that he is not really
    her son, and that he came because she called for him while weeping.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother sings crying songs; because of her crying, the traveler stays one
    additional night before departing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before traveling around the west coast, the traveler puts on a copper coat,
    a marten-skin coat, and a Qꜝā′g̣awa-i skin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Supernatural beings living along the west coast open their doors for the traveler,
    but one being in the middle of the island has a shut door; when the traveler takes
    hold of him, the house falls flat toward the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A black-cod fisher addresses the traveler as the great chief Stone-ribs and
    asks for a head.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Stone-ribs enlarges a rocky cave with his arm, gathers many black cod, throws
    them into the cave, and then pushes the man into the cave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Tcꜝā′ał inlet, a face-up being with half-copper arms and five fins lies
    in wait for the traveler.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The five-finned being seizes and squeezes the traveler, and its claws pass
    through his copper coat; the traveler enters the halibut skin and escapes between
    the claws.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Spit-point dries up because of the traveler; after waiting, he jumps and flops
    across it into the water on the other side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Swim-far-off appears half out of Rock-point’s door, shows frightening spines,
    threatens to kill the traveler, and causes him to go around on the other side.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two fishermen in a canoe speak about the traveler, become frightened, cut
    the anchor line, and flee.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The traveler bites off half of the fishermen’s canoe, pushes the stern man
    toward shore, throws the other man from his mouth near Ta′og̣ał, and that man
    is changed into a rock.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At Skedans bay, an eagle takes the traveler’s skin in its claws while he is
    sleepy or unconscious; the traveler puts on his copper coat and pursues it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: An armed supernatural being with a war spear and war helmet waits inland;
    Stone-ribs runs behind him, grasps him at a distance, holds his head, and throws
    it toward the head of the creek.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Upward is named as the town chief of Skedans and owner of Sand-reef; he goes
    there for hair seal and calls people in to eat.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: People in a canoe sing a mocking song about Upward’s wife while using the
    canoe edges as a drum.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Upward pulls the singers in, questions why they clubbed seals on his reef,
    fastens them to two canoe seats, and starts homeward with them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The two fastened men, identified later as sons of Farthest-one-out, seize
    Upward, fasten him to the canoe, take in his hair seal, and return.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
