candidate_motifs:
- id: motif:1
  label: Departure from a weeping mother
  taxonomy_refs:
  - departure
  basis: The traveler announces that he will go away, explains that he is not truly
    the woman’s son, delays only because of her crying, and then departs.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not specify the larger narrative reason for the departure
    beyond the traveler’s own statement.
- id: motif:2
  label: Layered protective clothing and animal-skin escape
  taxonomy_refs:
  - shapeshifter
  basis: The traveler wears multiple special coats and skins and later enters the
    halibut skin to escape an ambushing being’s claws.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage describes putting on or entering skins; it does not explicitly
    state a complete bodily transformation.
- id: motif:3
  label: Dangerous coastal threshold journey
  taxonomy_refs:
  - trickster_boundary
  basis: The traveler repeatedly crosses or negotiates liminal coastal places and
    beings, including supernatural doors, a rocky cave, an inlet ambusher, a drying
    point, a strait, and a threatening doorway.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy reference is tentative because the passage does not call
    the traveler a trickster; the evidence is the repeated boundary-crossing structure.
- id: motif:4
  label: Person transformed into rock
  taxonomy_refs: []
  basis: After the traveler throws one of the canoe fishermen from his mouth near
    Ta′og̣ał, that person is changed into a rock there.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives the transformation but does not expand on its later
    ritual or geographic significance.
- id: motif:5
  label: Skin theft by a bird and pursuit
  taxonomy_refs: []
  basis: An eagle takes the traveler’s skin while he is unconscious, and he puts on
    his copper coat and goes after it.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not state the eagle’s motive or the ultimate fate of
    the stolen skin in this excerpt.
- id: motif:6
  label: Captivity reversed by brothers
  taxonomy_refs:
  - sibling_pair
  basis: Upward fastens two men to canoe seats, but one calls to his younger brother
    and both seize Upward, fasten him to the canoe, and take him away.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The brother relationship is explicit, but the passage does not present
    a developed twin or full sibling-cycle motif.
- id: motif:7
  label: Disputed seal-reef rights and public mockery
  taxonomy_refs: []
  basis: Upward owns Sand-reef and questions why the singers clubbed seals there;
    the singers mock his wife in song before the capture and reversal.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: No broader comparative taxonomy is assigned because the passage frames
    this as a local conflict over reef ownership, song, and status.
