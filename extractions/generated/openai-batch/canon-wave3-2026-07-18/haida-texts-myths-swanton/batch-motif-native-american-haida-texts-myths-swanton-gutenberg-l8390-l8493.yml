canonical_text:
  quote: The chief’s son whom they had abandoned had become a sea-gull.
  summary: A chief’s son lives with two wives in an abundant town. The wives demand
    special digging sticks, use them to enlarge the town, and dig whales from the
    ground or shore. The man shoots and skins a sea-gull, enters the skin, flies to
    Nass inlet, and is recognized by his leg ornament as the abandoned chief’s son.
    His father sends slaves to find his bones; they instead encounter the enlarged,
    abundant town. The chief’s son initially prepares to shoot the slaves but is restrained,
    feeds them, and sends them back with instructions to say that they could not find
    his bones.
  language: English
  quote_policy: quoted
