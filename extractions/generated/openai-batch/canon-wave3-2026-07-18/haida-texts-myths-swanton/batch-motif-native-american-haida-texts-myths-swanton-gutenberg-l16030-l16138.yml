canonical_text:
  quote: ''
  summary: Qō′łkꜝē avoids a distant fire, prepares himself with dog skin, blood, a
    sharpened dog bone, a stone ax, wakefulness, fasting, and tightly closed openings.
    Unseen beings and shapeshifted animals try to make him a gā′gix̣īt through bodily
    entry, deceptive food, and false rescue parties. He tests the food and paddles
    in the fire, uses urine as a recognition test, identifies Land-otter people, and
    kills them while sparing the woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After saving himself, Qō′łkꜝē sees a distant large fire and a crowd of people
    talking near it, but he refuses to go because he has heard that anyone who goes
    to it will follow the fire forever.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: He kills and skins his dog, leaves the skull, rubs the dog's blood on his
    face, head, and body, sharpens an ulna on a stone, and keeps it in his hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An unseen creature that makes people gā′gix̣īts taps where he sits and tries
    to enter his anus, but says that Qō′łkꜝē's anus is closed tight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cold north weather comes; he stays awake, stops the chinks and crannies of
    his house, and urinates only into a hollowed wooden block.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: He keeps a stone with him, sits on it, holds the dog's ulna, and does not
    let go of the stone ax while the tapping and attempted entry continue.
  category: action
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:6
  text: A woman comes with a basket and offers chitons as food; when he puts the food
    into the fire, wood ticks run away, and he throws all of it into the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: He wears the dog's skin on his head with the teeth showing, the rest of the
    skin hanging down his back, and his body covered with blood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: On another evening the woman brings mussels; when he puts them in the fire,
    minks run away, and the narration states that a mink had changed into a woman
    to bring food that would make him a gā′gix̣īt if eaten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The woman tells him that friends will come for him; the next day about ten
    canoe people arrive, including a singing sister and apparent younger brothers
    whom he recognizes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: He tests the canoe with the dog's bone, ties the paddles together, brings
    the paddles into the house, and seats the canoe people in a circle with the sister
    near the door.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: He gives the canoe people urine to wash their hands; each turns away and snuffles,
    and he concludes that they are Land-otter people.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: He puts the paddles into the fire and minks run away; after clubbing those
    who came for him, they no longer conceal that they are land otters, and he clubs
    the land otters to death without touching the woman.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage states that the Land-otter people changed themselves to make him
    a gā′gix̣īt and that going with them would have made him one.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: He continues fasting and staying awake; the woman continues bringing food,
    and each time he puts it in the fire, different things run away from it.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: A second group of ten people comes after him in a canoe, again with a woman
    singing a crying song using the words 'Brother Qō′łkꜝē.'
  category: sequence
  evidence_refs:
  - ev:13
