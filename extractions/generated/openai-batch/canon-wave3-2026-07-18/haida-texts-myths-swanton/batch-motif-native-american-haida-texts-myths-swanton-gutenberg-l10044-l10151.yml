canonical_text:
  quote: ''
  summary: Nᴀñkî′lsʟas grooms and paints Supernatural-being-who-went-naked, gives
    him sky blankets, and instructs him to approach the woman troubling his mind by
    disguising himself in water as something contemptible. Water-fetching servants
    find him; the first recoils, the middle servant wants him thrown out, and the
    lame servant handles him carefully. In the chief-woman’s house he appears crooked
    and helpless, spills whale soup, is mocked, and is later insulted and ordered
    to fetch firewood. Outside he leaves his skin, uproots a spruce for firewood,
    and secretly reveals his identity to the lame servant. Later he stops making himself
    old, puts on the first face painting and the two sky blankets, and resolves to
    marry the chief-woman, rejecting an approaching servant.
  language: English
  quote_policy: summarized
