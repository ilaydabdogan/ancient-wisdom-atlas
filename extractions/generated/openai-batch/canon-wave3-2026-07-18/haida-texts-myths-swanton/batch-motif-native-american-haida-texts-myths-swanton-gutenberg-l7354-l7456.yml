canonical_text:
  quote: ''
  summary: At Gu′nwa on the Nass, slaves find young cedars, and the chief’s wife leads
    a party to gather bark. While she sits apart, a bearskin-clad person with a pointed
    half-red, half-blue object questions her about feast and fishing behaviors, then
    pierces her head, causes her flesh to fall away, enters her skin, and takes her
    place. The disguised figure’s abnormal appetite and a child’s refusal to nurse
    reveal that the figure is not the chief’s wife. The elder brother launches a canoe
    with his younger brother and leaves the town; they are then invited into a painted
    house by a woman who hosts them and offers salmon on a mouse-carved dish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The town of Gu′nwa lies on the Nass, and four slaves of the town owner find
    young cedars while cutting wood at a sandy beach below the town.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the slaves report the young cedars, the chief’s wife has her husband’s
    canoe brought out and goes with townspeople, the chief’s daughters, and young
    men to collect cedar bark.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the cedars, the chief’s wife sits with her back to the sunshine pulling
    cedar bark apart; she is described as slender-fingered, not eating much, and not
    caring for food.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the other people’s voices fade inland, a person wearing a bearskin blanket
    hair-side out stands near the chief’s wife holding a pointed object that is half
    red and half blue.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The bearskin-clad person asks the chief’s wife how she behaves when her husband
    calls people for food and when he returns from fishing; she answers with claims
    of swallowing or eating large amounts of food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chief’s wife has children, including two boys; one of the boys is described
    as unable to creep.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bearskin-clad person drives the pointed object through the chief’s wife’s
    forehead, raises her arm, causes her flesh to drop off, enters her skin, and buries
    her flesh in the sand at the foot of a tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The disguised figure sits in the chief’s wife’s place, eats white food offered
    by the others, and the party returns home late because the chief’s wife is said
    to have begun eating.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When one of the chief’s wife’s children is handed to the disguised figure,
    the figure offers a teat, but the child runs away crying because it is sucking
    a man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At a feast, the disguised figure empties a dish of roasted salmon into its
    mouth without chewing, astonishing the town people, who still think it is the
    chief’s wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The next day, while the people are astonished at the disguised figure’s behavior
    with berries, the elder brother carries his younger brother crying in front of
    the town, and observers recognize that what they saw was not the chief’s wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Very early the next day, the elder brother launches one of his father’s canoes,
    places his younger brother in the bow, and paddles away from Gu′nwa down and out
    of Nass inlet.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A woman leans halfway out from a painted house with a front sewn together
    with cedar limbs and invites the elder brother to come and stay until the next
    day.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The woman spreads many-colored woven mats, seats the boys near her, and later
    offers the elder brother a single piece of salmon on a dish carved with a mouse.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
