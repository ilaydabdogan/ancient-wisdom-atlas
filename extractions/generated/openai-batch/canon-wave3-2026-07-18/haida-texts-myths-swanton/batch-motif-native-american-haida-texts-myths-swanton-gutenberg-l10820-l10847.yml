canonical_text:
  quote: ''
  summary: A male figure sends people to fetch a basket they cannot lift, retrieves
    it himself, calls the people, and becomes town mother instead of the old chief.
    A sequel recounts that the old town-chief, the brother of a woman, was killed;
    the woman places her two bracelets in ʟgidō′ as a future portent. When disaster
    is impending, people see the bracelets with seaweed over them, flee by canoe,
    and move away. The woman goes into the woods and becomes a mountain called Sea-otter-woman.
    A source note identifies Qonā′ts as the hero of the story and one of the Sea-otters.
  language: English
  quote_policy: summarized
