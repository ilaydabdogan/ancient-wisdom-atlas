canonical_text:
  quote: ''
  summary: A woman married to the son of Supernatural-being-of-the-shining-heavens
    bears five sons and one daughter. Their grandfather teaches the children to gamble
    and fight, then sends them home with a nested box that produces destructive effects
    when opened according to instructions. The siblings restore a town, fight enemies
    across the river, and use the box to burn towns, water, and sea. The sister carries
    medicine in her mouth and revives brothers killed in battle by spitting medicine
    on them. After the brothers mistakenly take the wrong box to war and are destroyed,
    the sister and the wives pursue with the correct box; the women briefly forget
    their purpose while gathering cedar bark. The sister destroys pursuing enemies
    with the box and revives the youngest brother, but the other brothers cannot be
    found.
  language: English
  quote_policy: summarized
