candidate_motifs:
- id: motif:1
  label: Supernatural destructive box opened in crisis
  taxonomy_refs: []
  basis: The innermost box, when its cover is removed, causes destructive effects
    such as a town burning, wind arising, and water or sea burning; when the wrong
    box is taken, no effect occurs.
  evidence_refs:
  - ev:4
  - ev:9
  - ev:12
  - ev:13
  - ev:17
  confidence: high
  cautions: The passage presents the box’s effects but does not explain its origin
    beyond the grandfather’s gift.
- id: motif:2
  label: Burning water as war-destruction
  taxonomy_refs:
  - world_destroying_fire
  basis: During pursuit or attack, opening the box causes a strong wind and causes
    water or sea to burn, destroying people.
  evidence_refs:
  - ev:12
  - ev:17
  confidence: medium
  cautions: The destruction is local to enemies in war episodes, not explicitly the
    destruction of the whole world.
- id: motif:3
  label: Revival by spitting medicine
  taxonomy_refs:
  - resurrection
  basis: The sister spits medicine on killed brothers and they rise; later she spits
    medicine on the youngest brother and brings him to life.
  evidence_refs:
  - ev:10
  - ev:18
  confidence: high
  cautions: The passage states revival of the brothers but does not describe a broader
    afterlife or soul journey.
- id: motif:4
  label: Supernatural gift with operating instructions
  taxonomy_refs:
  - sacred_exchange
  basis: The grandfather gives the children the innermost nested box and detailed
    instructions for using it, and also gives the sister medicine and the youngest
    brother a wedge.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: The exchange is a gift within a kinship relationship; the passage does
    not frame it as ritual exchange.
- id: motif:5
  label: Wrong or duplicate magical object fails
  taxonomy_refs: []
  basis: The brothers take a box like the true one to war; when they open it during
    pursuit, nothing happens, leading to their destruction.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage does not say why the wrong box was taken or how the duplicate
    was made.
- id: motif:6
  label: Sibling rescuer with medicine and weapon-object
  taxonomy_refs: []
  basis: After the brothers are destroyed, their sister notices the true box has been
    left behind, follows with it, destroys attackers, and revives the youngest brother.
  evidence_refs:
  - ev:15
  - ev:17
  - ev:18
  confidence: high
  cautions: This is a sibling-group episode rather than a clearly defined sibling-pair
    motif.
- id: motif:7
  label: Momentary forgetfulness while on rescue mission
  taxonomy_refs: []
  basis: The sister and wives set out to help the brothers but stop to pull cedar
    bark and forget their purpose for a time before remembering.
  evidence_refs:
  - ev:16
  confidence: high
  cautions: The passage gives an etiological comment about women’s forgetfulness,
    but the extraction does not generalize beyond the stated episode.
