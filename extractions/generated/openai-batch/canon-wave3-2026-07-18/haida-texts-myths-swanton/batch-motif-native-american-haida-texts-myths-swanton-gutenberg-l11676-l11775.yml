  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 11692-11699
  quote_or_summary: The sister first menstruates; someone repeatedly talks with her;
    pitch placed on the mat later appears as spots on the mischievous one after sea
    bathing, and the others laugh at him.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 11701-11707
  quote_or_summary: The mother says Djugî′tg̣a’s head is going to be hung in front
    of the menstruant sister; the group asks an old man about it, gives him cedar
    limbs, bones for gimlets, and tobacco, and he tells them where the being sleeps.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 11709-11722
  quote_or_summary: The group borrows and tests canoes from Fast-rainbow-trout, Steel-head,
    and Jellyfish; Jellyfish's canoe has a stern at each end, Jellyfish agrees to
    go along, and his tentacles and the arrow test show its speed.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 11724-11734
  quote_or_summary: The old man is identified as Heron; he rejects a smooth day, later
    approves a foggy morning, and directs them to approach when phosphorescent light
    shines in the sleeping being's eyes and not otherwise.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 11736-11747
  quote_or_summary: The travelers see the phosphorescent eyes, carry blue hellebore
    and rotten urine, take the being's hair, cut off its head, use Jellyfish's tentacles
    and paddles through cracking currents, pour the substances into the currents,
    return to town, and hang the long-haired head before the sister.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 11749-11760
  quote_or_summary: A singing figure comes from the ocean with a red cane, demands
    his son's head, and threatens to tip the town; Heron advises covering the town
    end with hard white stones, and the red object makes only drumlike sounds when
    striking it.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 11762-11768
  quote_or_summary: The ocean figure returns singing with red things identified as
    fleas; Heron advises steaming and pouring urine toward them, and half the fleas
    are killed before the figure goes seaward.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 11770-11775
  quote_or_summary: The ocean figure returns with a staff and flying objects called
    sīxasʟtꜝᴀ′lgaña; Heron advises blunt arrows, and the defenders shoot and destroy
    half before the figure leaves.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
