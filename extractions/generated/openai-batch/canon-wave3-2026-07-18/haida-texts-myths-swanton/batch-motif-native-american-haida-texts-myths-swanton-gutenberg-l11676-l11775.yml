canonical_text:
  quote: ''
  summary: A group snares and kills Supernatural-eel, removes human bones from its
    belly, reassembles them with tree-limb substitutes, and ʟā′ga-na′qatî spits on
    them before the restored people are told to return home. After their sister's
    first menstruation, an unidentified speaker is exposed by pitch. Their mother
    refers to Djugî′tg̣a’s head being hung before the sister. The group consults an
    old man, later identified as Heron, borrows and tests canoes from animal-named
    beings, and uses Jellyfish's canoe to reach the sleeping being whose eyes shine.
    They cut off its head, return through dangerous currents using blue hellebore
    and rotten urine, and hang the head before the sister. A singing ocean figure
    with a red cane or staff repeatedly demands his son's head and sends or is followed
    by attacks; the defenders repel him with white stones, steamed urine against fleas,
    and blunt arrows against flying objects.
  language: English
  quote_policy: summarized
