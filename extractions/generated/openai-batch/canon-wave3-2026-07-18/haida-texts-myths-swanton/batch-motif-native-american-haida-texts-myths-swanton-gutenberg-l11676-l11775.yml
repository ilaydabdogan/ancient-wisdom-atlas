- id: motif:2
  label: Restoration from assembled bones with substitute parts
  taxonomy_refs:
  - resurrection
  basis: Human bones are removed, laid together, supplied with tree-limb replacements
    for missing parts, spat upon, and the resulting persons are told to return home.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage implies restoration through the command to return home but
    does not explicitly use the word resurrection.
- id: motif:3
  label: First menstruation linked to a displayed severed head
  taxonomy_refs:
  - initiation
  basis: After the sister first menstruates, the mother says Djugî′tg̣a’s head will
    be hung in front of her, and the group later hangs it there.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: medium
  cautions: The passage gives the action but does not explain its ritual meaning.
