candidate_motifs:
- id: motif:1
  label: reciprocal raid and retaliation warfare
  taxonomy_refs: []
  basis: 'The narrative presents successive raids and counter-raids: Skidegate captures
    women and a word, Kloo retaliates, further massacres and ambushes follow, and
    war continues into spring.'
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a narrative pattern in the passage, not linked here to a named
    external motif index.
- id: motif:2
  label: captured word as war spoil and provocation
  taxonomy_refs: []
  basis: The Skidegate people enslave women and also take possession of a made-up
    word; Kloo learns the word has been captured and sends four canoe-loads to war.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage treats the word as acquired from the expedition, but does
    not label it sacred or magical.
- id: motif:3
  label: decapitation and display in war
  taxonomy_refs: []
  basis: Owner and his companions have their heads displayed on poles, and later the
    food-bearing woman requests and receives beheading to avoid enslavement.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage gives the acts literally; no ritual meaning is stated.
- id: motif:4
  label: death preferred to enslavement
  taxonomy_refs: []
  basis: The Common-food-steamers woman explicitly says she does not want to be a
    slave or run away frightened, marks her neck, and asks to have her head cut off.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives her stated motive, but broader social interpretation
    requires external context not used here.
- id: motif:5
  label: place-name etiology through violent event
  taxonomy_refs: []
  basis: The cove is named from the youth’s begging for mercy, and Blood-fort is named
    from the blood that ran in the fort after killings.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only the two place names in this passage are extracted.
- id: motif:6
  label: lone survivor escaping by tree over water
  taxonomy_refs: []
  basis: One person attacked from a canoe climbs into a tree bending over the water
    and alone escapes while the rest are killed.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives one clear lone-survivor episode; it is not connected
    to a named motif family in the supplied taxonomy.
- id: motif:7
  label: sibling pair preparing for war after sister’s killing
  taxonomy_refs:
  - sibling_pair
  basis: In the aftermath of the woman’s killing, a man connected with the killed
    sister and his younger brother work on a canoe, and Alder addresses Kꜝwi′dᴀña-i
    as younger brother during the canoe dispute.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The exact identification of the man whose sister was killed with Alder
    is inferred from the immediate pronoun sequence and should be checked against
    the source.
- id: motif:8
  label: elder tactical knowledge enables ambush
  taxonomy_refs:
  - wisdom
  basis: The oldest warrior explains what a cedar chopper will think during the night
    and predicts his early return, enabling the killing.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The taxonomy link to wisdom is broad; the passage presents practical strategy
    rather than explicit sacred wisdom.
