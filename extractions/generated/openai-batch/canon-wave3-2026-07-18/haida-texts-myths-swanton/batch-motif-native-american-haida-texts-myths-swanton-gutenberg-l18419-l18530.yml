canonical_text:
  quote: ''
  summary: 'A sequence of conflicts between Skidegate and Kloo is narrated: a Skidegate
    raid captures women and a coined word, Kloo retaliates by killing Owner and his
    companions, further killings lead to place names at Blood-fort and Begging-for-mercy-cove,
    a woman refuses enslavement and asks to be killed, ambushes occur around Tꜝā′łdi,
    and Alder and Grandson later go to war in spring.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the time when arrows were used, Skidegate warriors went to Kloo, watched
    women who were digging roots, and observed them steaming nettle roots with a large
    fire and heated stones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As the women slipped skins from the cooked nettle roots, they repeatedly said
    a made-up word rendered as “Wᴀha-iwa′n.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Skidegate warriors came out, enslaved the women, brought them to Skidegate,
    and used the acquired word in the form “Ha-iwa′n.”
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Kloo people learned that the word had been captured, four canoe-loads
    went from Kloo to Skidegate to make war.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Kloo war party concealed itself at Gū′łga, pursued three persons in a canoe,
    shot an arrow over them, identified the middle person as Owner, and killed all
    three.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The heads of Owner and his two companions were put on poles at Kloo, and the
    Town-of-Djī′gua people made another new word translated as “without-even-looking-back.”
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Blood-fort, Koagia′ns counted visiting Skidegate people and destroyed them
    without injury on their own side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A missing Skidegate youth had jumped into the water, was found near the sea
    at the point of the fort, begged for mercy, and was killed; the cove and fort
    received names connected with begging for mercy and blood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A woman of the Common-food-steamers, married among the Ninstints people, brought
    food to Kloo, found Kloo empty, camped in the woods, and ignored a slave’s warning
    that people had passed in canoes at night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A canoe party at a sand beach chased the woman’s party; her companions escaped
    into the woods, while she remained, refused enslavement or fearful flight, marked
    her neck, and was beheaded at her own request.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When Skidegate warriors saw that someone had felled a cedar for a canoe, the
    oldest warrior predicted that the chopper would return early, and three men killed
    the chopper at the cedar in the morning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Skidegate warriors unexpectedly attacked people leaving Tꜝā′łdi by canoe;
    one person climbed into a tree bending over the water and alone escaped, while
    the rest were killed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The man whose sister had been killed could not get a canoe; Ginᴀ′skilas lent
    then withheld an unfinished canoe, and Alder ordered Kꜝwi′dᴀña-i to cut cedar
    limbs from it; by spring Alder and Grandson went to Skidegate to war.
  category: sequence
  evidence_refs:
  - ev:10
