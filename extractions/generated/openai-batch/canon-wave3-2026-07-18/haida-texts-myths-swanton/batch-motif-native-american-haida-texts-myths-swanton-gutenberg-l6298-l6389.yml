canonical_text:
  quote: ''
  summary: 'A sequence of Raven traveling episodes: Raven manipulates Cormorant over
    halibut; eats a sea anemone and is burned internally; tries to steal food from
    houses occupied by animated wedges and Shadow people; encounters dancing Herring
    people and begins using hemlock limbs to collect fish eggs; steals live coals
    by using a borrowed deerskin with pitch wood tied to its tail, explaining deer’s
    short tail and Raven’s burned beak; replaces Screech-owl’s beak with a devilfish
    mouth; tricks Eagle after a berry dispute, causes him to fall into a chasm, and
    eats his berries; then obtains directions from a labret-wearing basket-weaving
    woman and rejoins his cousin.'
  language: English
  quote_policy: summarized
