- id: obs:1
  text: The chief-woman provides dry fish that the brothers can pick up and eat, while
    the dish remains unconsumed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief-woman also provides a cranberry; she says supernatural beings are
    unable to consume it, and it is put back after the brothers are filled.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night the chief-woman tells the elder brother to lay the younger brother
    next to her, and the younger brother then sleeps very still.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The elder brother wakes to a woman laughing and sees the younger brother playing
    with the chief-woman; after hearing her words he cries from jealousy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At daybreak the chief-woman gives the elder brother a blue item from her box
