    power for him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief-woman directs the elder brother down the inlet to the one whose
    daughter he came to see and says the younger brother will remain with her and
    later marry her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The elder brother travels alone down the current, reaches a large town, enters
    Sqä′g̣ał’s house, and sees the chief’s child sitting behind screens under female
    watch.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Near water holes and a bull pine, human bones are piled up; armed female attendants
    accompany the chief’s child, including one identified as Tlingit and another as
    Bellabella.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The chief’s child bathes, turns four times, is rubbed by her attendants, enters
    the water a second time, turns to the right, and sits with her back toward the
    sun.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the chief’s child’s skin begins to dry, the elder brother seizes her
    and quickly touches noses with her; her armed attendants prepare to strike him,
    but she stops them and says she will marry him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The human bones around the place are said to belong to earlier men who seized
