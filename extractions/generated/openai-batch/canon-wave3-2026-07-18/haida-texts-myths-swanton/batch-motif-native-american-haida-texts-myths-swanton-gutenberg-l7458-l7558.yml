canonical_text:
  quote: ''
  summary: The passage begins with two brothers eating supernatural food provided
    by a chief-woman. The younger brother is placed beside the chief-woman and remains
    with her, while the elder brother receives a blue protective substance and travels
    alone down the inlet to seek Sqä′g̣ał’s daughter. He finds the guarded chief’s
    child, watches her bathing near water holes and a bull pine amid bones of previous
    suitors, seizes her, and is accepted by her after she stops her armed attendants
    from killing him. She hides him in her father’s house. Her father discovers him
    and prepares a dangerous dish with four red-hot stones, which the daughter says
    is how he kills her would-be husbands.
  language: English
  quote_policy: summarized
