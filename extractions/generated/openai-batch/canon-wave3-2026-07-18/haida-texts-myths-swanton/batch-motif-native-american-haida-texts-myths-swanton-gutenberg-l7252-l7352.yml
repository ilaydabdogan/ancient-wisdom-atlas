canonical_text:
  quote: "“Chief-woman, I will come forth from your womb. Do not be afraid of me.”"
  summary: A powerful supernatural father-in-law enters with earth-shaking force,
    is checked by a supernatural woman, restores ten eaten servants, instructs the
    chief's daughter that he will be born from her womb, and gives directions for
    a cloud-decorated cradle. After his birth as a strange child, he is wrapped in
    sky blankets, taken to the sea, lowered into the water, and becomes associated
    with a reef seen before sickness.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The house and ground shake when the supernatural being steps; people in the
    house hang their heads, while the youngest's wife tells them to hold their heads
    up.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The entering being is described as wonderful, with large eyelids too powerful
    to look at; after being stopped, he comes in without further disturbance and sits
    near his son.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When first seated, the being lays his hands on his hat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Using his father's staff, he divides clam shells, keeping the smaller part
    for himself and making his father's part large.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A youth is sent for the wife; she comes from the cave where she had lain and
    goes first to her mother rather than to her husband.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father dances, falls down, breaks in two at the middle, and feathers blow
    out of his buttocks and trunk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Servants emerge from the father's buttocks and trunk, and all ten servants
    whom he had eaten are restored.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The explanation states that he devoured the servants on account of the hat
    and that the chief's daughter was put into the cave because grease had been put
    into her mind by thinking.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Wood is added to the fire, the people are seated in a circle, and a feast
    continues until midnight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At daybreak young hair seals cry where they had cried before, and the people
    prepare to start from the retaining timbers where the canoes lie.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The father-in-law calls the chief's daughter, whispers directions, and says
    he will come forth from her womb and that she should not be afraid of him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: He gives her a round copper plate with strings and a chain, named X̣īłūtꜝā′ła,
    and instructs her to have Master Carpenter make his cradle with cumulus clouds
    around its edges.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: He says human beings will gather food through him and that surface birds will
    gather food while he governs the weather.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The chief's daughter gets into a canoe with her father; the canoes are fastened
    together, and after the people forget themselves they find themselves afloat on
    the ocean.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: After arrival at the village, the chief's daughter becomes pregnant; when
    labor begins, a house is made for her outside and she holds a stake while the
    child comes forth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The newborn is wonderful and has something flat sticking out from his eyelids;
    the mother runs away in fright, then returns, calls him her grandfather, and picks
    him up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The town is nearly overturned when the mother flees from the child, and becomes
    still after she returns to him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Her father puts hot stones into a urinal he owns, and they wash the child.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: Master Carpenter comes running with a wooden piece cut in the woods, puts
    the drawing on it as instructed, pictures two rows of clouds on it, and makes
    holes in the cradle for ropes beside the child's legs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The child is placed in the cradle and wrapped with two sky blankets.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: Five persons and the chief's daughter take her son seaward; midway between
    Haida country and the mainland they lower him into the water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:22
  text: When released, the child turns around to the right four times and becomes
    like something flat thrown down.
  category: action
  evidence_refs:
  - ev:9
- id: obs:23
  text: A note states that he has his place in the middle of the sea, is sometimes
    seen before sickness is about to break out, and that Nᴀñʟ̣da′ sʟas was a reef.
  category: relationship
  evidence_refs:
  - ev:10
