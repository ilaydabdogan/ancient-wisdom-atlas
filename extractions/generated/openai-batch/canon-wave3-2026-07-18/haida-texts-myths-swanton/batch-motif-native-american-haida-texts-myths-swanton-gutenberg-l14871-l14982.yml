canonical_text:
  quote: ''
  summary: A starving hunter finds and adopts a small wolf. The wolf speaks to him
    in a dream, gives instructions for obtaining grizzly bears, and helps him gain
    food and property. When the hunter's brother-in-law fails to follow the instructions,
    the wolf leaves. The hunter follows the wolf's snowy tracks to a town of wolf
    people, where his wolf-son hosts him, feeds him supernatural food, and sends him
    away with a sack of animal fat and meat and a directional cane.
  language: English
  quote_policy: summarized
