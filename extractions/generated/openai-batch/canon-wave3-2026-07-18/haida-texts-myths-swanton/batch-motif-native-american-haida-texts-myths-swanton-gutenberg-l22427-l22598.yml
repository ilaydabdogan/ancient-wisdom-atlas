  quote: ''
  summary: The passage consists of explanatory notes to several Haida war narratives.
    The notes include accounts of a wealth-seeking man and property medicine, a song
    to stop pursuers, a reef said to be the first land above primeval waters, a chief
    fasting for success and property, and an explanation of a spirit about to be reborn
    through a woman.
