candidate_motifs:
- id: motif:1
  label: miraculous child born from a thigh
  taxonomy_refs:
  - miraculous_child
  basis: A child comes out after the surviving mother’s thigh swells and bursts before
    ten nights pass; the child soon shows unusual hunting and later restorative powers.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:14
  - ev:15
  confidence: high
  cautions: The passage gives the unusual birth and later powers but does not explicitly
    explain the birth’s cause.
- id: motif:2
  label: avenging younger brother destroys the hostile town with fiery copper objects
  taxonomy_refs:
  - sibling_pair
  basis: The brother goes to help his mistreated sister, directs her to carry copper
    objects inside, and the house and whole town burn with no one saved; the text
    says he did it on account of his uncles.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The sibling-pair classification is based on cooperative brother-sister
    action; the story centers more on the brother’s revenge than on equal paired action.
- id: motif:3
  label: revival of dead kin from bones by medicine
  taxonomy_refs:
  - resurrection
  basis: The uncles’ bones are put together and, after medicine is spat on them four
    times, they sit up and settle in empty houses.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The passage calls the act medicine-spitting but does not detail the medicine’s
    origin.
- id: motif:4
  label: restoration of youth by medicine
  taxonomy_refs:
  - death_rebirth
  basis: The old mother becomes young after medicine is spat over her, and killed
    old people also become young after medicine is spat on them.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: This is rejuvenation and restoration after killing, not a full narrated
    rebirth sequence for each person.
- id: motif:5
  label: supernatural food abundance after restoration
  taxonomy_refs: []
  basis: After reviving and rejuvenating people, the brother supplies a whale, halibut,
    unconsumed food trays, and ten whales floating before the town.
  evidence_refs:
  - ev:16
  - ev:17
  confidence: high
  cautions: No available taxonomy reference directly matches this food-provision pattern.
- id: motif:6
  label: progressive hunting prowess of a secluded child
  taxonomy_refs:
  - initiation
  basis: The child begins with small birds and progresses to black bear, all kinds
    of animals, and grizzly bear while living with his mother apart from the town.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: low
  cautions: The passage does not explicitly frame the hunting progression as a formal
    initiation.
