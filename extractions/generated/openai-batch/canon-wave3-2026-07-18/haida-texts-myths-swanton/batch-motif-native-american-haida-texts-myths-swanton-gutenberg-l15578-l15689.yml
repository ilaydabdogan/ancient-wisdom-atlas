canonical_text:
  quote: ''
  summary: A chief rejects his first wife after marrying a woman from another town.
    After a deceptive incident involving pitch, paint, and feathers, the chief kills
    the second wife’s visiting male kin with heated water and later kills old people
    in their town. The surviving mother flees inland to a mountain, gives birth from
    her thigh to a child, and raises him in poverty. The child grows into a hunter,
    learns of the destruction of his uncles and mistreatment of his sister, uses copper
    objects to burn the chief’s town, restores dead kin and old people with medicine
    spit, rejuvenates his mother, and provides whales, halibut, and abundant food.
  language: English
  quote_policy: summarized
