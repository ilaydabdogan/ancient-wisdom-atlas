canonical_text:
  quote: ''
  summary: A story recounts conflict between two towns across Nass River after a chief’s
    son is killed for lying with another man’s wife. The killing is discovered, fighting
    follows, and one town is burned, leaving a woman and her mother as survivors.
    Inland, the mother seeks a husband for her daughter, rejects many bird and animal
    suitors, accepts a handsome helper, repeatedly disobeys his order not to look
    while he carries them up a mountain, and is finally transformed into the creaking
    sound of rubbing tree limbs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from two towns on opposite sides of Nass River visit, gamble together,
    and several brothers from one town go to hunt beaver at familiar lakes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the brothers destroy a beaver dam, the dam is carried away by the current
    and they float down with it, barely saving themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers conclude that a regulation has been broken, fail to kill anything,
    and become certain that one brother’s wife is with someone else.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before daylight, the eldest brother goes to his wife, finds someone lying
    with her, cuts off his head, wakes his wife, places the head above the door, and
    leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife digs a hole for the body left in her bed, gives an explanation for
    her crying child, and buries the body there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The slain man is identified as the son of the chief from the town on the other
    side of the river.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A slave sent after fire notices blood, returns, looks toward the doorway,
    sees the head, and reports what he saw.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the head is discovered, fighting begins; the town where the unfaithful
    wife lived is destroyed and burned.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: One woman and her mother escape from behind the screens to the woods and are
    the only people saved when the town is burned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The mother and daughter travel far inland to a high mountain, where the mother
    repeatedly calls for someone to marry her daughter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bird and forest-animal suitors come, state what they can do, and are refused
    by the mother.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: A handsome man comes, says he will help, and the mother thinks he is good.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The handsome man carries the mother and daughter upward on a lofty mountain
    and tells them not to look out, but the mother repeatedly looks and causes them
    to slide back.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After many failed attempts, the handsome man pulls a limb from a tree, puts
    the mother in its place, says future people will hear her voice, and the passage
    identifies her as the creaking caused by limbs rubbing together.
  category: action
  evidence_refs:
  - ev:10
