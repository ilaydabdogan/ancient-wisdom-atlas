canonical_text:
  quote: ''
  summary: An unnamed man creates sea beings from different woods, tests them, and
    sends them to their places. Ten yew killer whales obey his command to destroy
    fishing people and spare the man marked with a feather. Later the man uses a wā′sg̣o
    skin at night to draw fish and whales from the sea, exposes his mother-in-law’s
    claim to power, becomes wealthy from whales, and potlatches for his youngest brother-in-law.
  language: English
  quote_policy: summarized
