- id: motif:2
  label: strategic marriage undertaken for a hidden restorative purpose
  taxonomy_refs: []
  basis: Mouse-woman tells her husband that she married him to restore his mother
    to life, then immediately leaves him.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No broader ritual or sacred status is stated in the passage.
- id: motif:3
  label: death attributed to wife’s unfaithfulness and avenged by decapitation
  taxonomy_refs: []
  basis: The brothers say the elder brother’s wife must be unfaithful and that this
    caused their brother’s death; the youngest later cuts off the head of the man
    found with her.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The wife’s unfaithfulness is asserted by the brothers; the passage does
    not independently establish that it caused the death.
