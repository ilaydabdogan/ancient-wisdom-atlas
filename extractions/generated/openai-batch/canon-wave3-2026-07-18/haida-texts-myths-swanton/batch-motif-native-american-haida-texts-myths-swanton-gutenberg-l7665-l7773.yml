canonical_text:
  quote: ''
  summary: Mouse-woman is decapitated, uses a whetstone as her head and trunk draw
    together, is ground to pieces, restores or releases her mother-in-law, tells her
    husband she married him to restore his mother to life, and vanishes downstream.
    Sqäg̣ał’s daughter bears seven boys and one girl. The children settle at Qꜝadō′;
    the eldest son dies at a beaver pond. The youngest reports the death to their
    mother, watches the dead brother’s wife, and cuts off the head of the man with
    her. The head is displayed above the door and later recognized by a slave as the
    missing chief’s son from Metlakahtla. Metlakahtla people attack and destroy the
    brothers; only the mother and daughter survive. The grieving mother offers her
    daughter in marriage, and Grizzly-bear, Beaver, and Deer each propose destructive
    actions against the town.
  language: English
  quote_policy: summarized
