  - ev:5
  confidence: high
  cautions: No broader origin or ritual explanation is stated in the passage.
- id: motif:3
  label: moon lineage and empowered descendants
  taxonomy_refs:
  - divine_parent_child
  basis: The husband is identified as son of One-who-goes-along-above, the moon; his
    children are later endowed by their grandfather with houses, goods, weapons, and
    special protections.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage identifies the moon relation directly, but the exact cosmological
    location of the father’s house is inferred only from the later lowering of the
