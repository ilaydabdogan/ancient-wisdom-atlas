canonical_text:
  quote: ''
  summary: A silent armed suitor proves his power by cracking the earth with a footstep,
    then hunts, builds a house, and creates an unextinguished fire with two white
    rocks. He takes his wife to his father’s house and is identified as the son of
    One-who-goes-along-above, the moon. Their children receive names, houses, slaves,
    weapons, and protective or healing powers from their grandfather. The grandfather
    trains them in combat, lowers their town to human settlements, and the Metlakahtla
    people interpret their arrival as ghosts descending. A slave sent for coals enters
    the thunder-bird house and recognizes Ga'oax cooking there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person cries out, and someone comes in silently carrying a bow used as a
    staff, arrows, a quiver, dancing leggings, and a gable-crowned hat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When asked what he will do if he marries the daughter, the visitor stamps
    with his right foot and the earth cracks; he is then addressed as a great chief
    and accepted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The visitor removes his hat and quiver, keeps two arrows and a bow, and rolls
    a grizzly bear, a deer, and a beaver down from a steep place with his foot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The visitor carries posts, wall posts, stringers, roof planks, and wall planks,
    placing them until a house is completed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The visitor brings two white rocks, rubs them together, places them under
    the smoke hole, and the fire burns continually without being extinguished.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The mother-in-law cuts up and cooks mountain goats and grizzly bears; afterward
    the visitor takes his wife away and is identified as the son of One-who-goes-along-above,
    the moon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wife bears boys and girls; the eldest son is called Puncher, and two girls
    receive names connected with arrow wounds and healing.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The grandfather calls the eldest boy, removes his bones, and fills his body
    with stones in place of the bones.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The grandfather gives ten slaves to each of the eight, makes a row of houses
    joined with cedar limbs, places distinct figures on the house fronts, gives weapon
    boxes to the brothers, and wraps the two sisters in marten-skin blankets.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The grandchildren practice fighting; when one is shot, one sister sucks out
    the arrow and the other spits on her palms and rubs him, after which he immediately
    returns to fighting.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Weapons aimed at the two sisters rebound from their marten-skin blankets instead
    of penetrating them.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: The grandfather pulls apart floor planks, sees Metlakahtla and Qꜝadō among
    human beings, and lowers the houses; people at Metlakahtla cry that ghosts are
    coming down.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The youngest is instructed that, if retreating because opponents are too numerous,
    he should put a marked wooden wedge into the fire and tell it to inform his grandfather.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Metlakahtla people send a slave by canoe for live coals to the middle house
    with the thunder-bird figure; he enters, recognizes Ga'oax cooking animal parts,
    sees gambling, and receives meat called ghosts' food.
  category: sequence
  evidence_refs:
  - ev:13
  - ev:14
