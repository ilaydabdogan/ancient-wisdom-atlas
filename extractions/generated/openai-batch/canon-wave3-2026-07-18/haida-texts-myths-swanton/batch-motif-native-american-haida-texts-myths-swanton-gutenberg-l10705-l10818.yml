candidate_motifs:
- id: motif:1
  label: nature weeps with the grieving person
  taxonomy_refs: []
  basis: The passage explicitly says the trees and fishes weep with the wanderer when
    he looks toward the forest and sea.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives the image literally; it does not explain whether it
    is a broader cosmological principle or a single narrative effect.
- id: motif:2
  label: culture plant obtained by shooting a giant seed-bearing tree
  taxonomy_refs:
  - culture_hero
  basis: He-who-was-born-from-his-mother’s-side shoots the big tree, directs care
    of its seeds, and the passage identifies the result as tobacco planted by Cloud-woman.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explicitly call him a culture hero; the taxonomy
    assignment rests on the acquisition and dissemination of tobacco.
- id: motif:3
  label: seed-distributing female relative
  taxonomy_refs: []
  basis: Cloud-woman, named as the shooter’s cousin, arrives by canoe, takes all the
    seeds, and plants them over the island.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage gives her action but little additional characterization.
- id: motif:4
  label: departure from oppression and return as avenger
  taxonomy_refs:
  - departure
  - return
  basis: The nephew leaves with his grandmother after seeing his uncles oppressed
    and later returns to the town, confronts the chief’s renewed seizure, and kills
    him.
  evidence_refs:
  - ev:7
  - ev:12
  - ev:13
  confidence: high
  cautions: The return is present in action, though the passage does not frame it
    with an explicit formal return motif.
- id: motif:5
  label: strength gained through repeated bathing
  taxonomy_refs:
  - initiation
  basis: After leaving and building a house at Telel, the nephew bathes for strength
    until he becomes strong before developing hunting abilities.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage says he bathes for strength but gives no formal ritual explanation.
- id: motif:6
  label: underwater hunting by animal-skin disguise
  taxonomy_refs: []
  basis: Qonā′ts wears a prepared goose skin on his head, swims under geese, pulls
    them under water, and kills them.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a disguise or hunting technique in the passage, not an explicit
    transformation.
- id: motif:7
  label: supernatural encounter yields whale provision
  taxonomy_refs:
  - mystical_quest
  basis: Qonā′ts goes in search of something, meets the broad-blue-hatted creature
