  - ev:12
  - ev:13
  confidence: high
  cautions: The passage presents punishment by the nephew, not an explicitly divine
    judgment.
comparison_claims:
- id: claim:1
  claim: 'The tobacco-tree episode and the Dawson abstract describe the same broad
    tobacco-origin pattern: people lack tobacco or obtain it from a single large plant/tree,
    a man shoots down seeds from it, and later tobacco cultivation derives from those
    seeds.'
  claim_level: same_motif
  target: Dawson’s abstract of a mainland/Stickeen tobacco-origin version in Report
    on the Queen Charlotte Islands
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage presents the Dawson material as an editorial abstract,
    not as a full parallel text; names and setting differ.
- id: claim:2
  claim: The editorial note cautiously suggests that the Haida tobacco story may have
    come originally from the mainland.
  claim_level: historical_contact
  target: possible mainland origin of the tobacco-origin story
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself phrases this only as a possibility and provides
    no independent historical-contact evidence beyond the reported parallel.
