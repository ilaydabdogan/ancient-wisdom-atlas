canonical_text:
  quote: ''
  summary: 'The passage first concludes a tobacco-origin episode: a grieving wanderer
    reaches supernatural beings shooting leaves from a large tree, shoots the tree
    down, directs that its seeds be cared for, and has Cloud-woman gather and plant
    them across the island. An editorial note compares this with Dawson’s abstract
    of a mainland/Stickeen tobacco-origin version. The passage then begins the story
    of He-who-travels-behind-us, or Qonā′ts: a chief at Pebble-town confiscates porpoises
    from the people; a child nephew leaves with his grandmother, gains strength, develops
    hunting techniques, encounters a broad-blue-hatted being, receives or returns
    with a whale, brings provisions back, and kills the oppressive chief.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wandering man falls to the ground and weeps; when he looks toward the forest,
    the trees weep with him, and when he looks seaward, the fishes beneath the surface
    weep with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wanderer comes upon people laughing and talking while shooting leaves
    off a big tree and eating each leaf after it falls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people move back from the tree and say that He-who-was-born-from-his-mother’s-side
    is going to shoot.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: He shoots the tree near its base, causing it to begin falling and making the
    supernatural beings rejoice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: He tells the others to take care of the tree’s eggs or seeds and says his
    cousin Cloud-woman will take off the head of seeds; the narrator identifies this
    as tobacco.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cloud-woman comes by canoe, takes all the seeds, and begins planting them,
    spreading them over the island.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: An editorial note reports another version in which ancient people had no tobacco,
    one deity-caused tall plant grew far inland in Stickeen country, and a man shot
    down seeds that became the source of cultivated tobacco.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Pebble-town, a chief sends a slave to order porpoise-killers not to spill
    porpoise blood on the ground, and the chief often takes the porpoises away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A child nephew sees that his uncles are treated like slaves and nearly starved
    while the chief takes the town’s porpoises.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The child and his grandmother leave, arrive at Telel, build a house, and he
    bathes for strength until he becomes strong.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: He makes a bow, shoots a goose, skins it, cuts a hole in its underside, fits
    the skin on his head, and dries it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Using the goose skin on his head, he swims beneath geese, pulls them under
    water, twists their necks and wings, and brings them to his grandmother to pluck
    and dry.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: He draws blood from his nose with broken basketry, uses the bloodied pieces
    as halibut-hook bait, sets hooks on wooden floats, and pulls in halibut for his
    grandmother.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: While traveling down the inlet, he encounters a creature wearing a broad blue
    hat; after repeated questioning, the creature says it came from Qꜝᴀ′kun.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The broad-blue-hatted creature has two duck skins on its back; when the young
    man seizes one, he loses consciousness and later wakes in a house.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: A speaker in the house says to throw him out with the thing he wants; after
    another loss of consciousness, he wakes near the ocean beside a whale.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: He cuts open the whale, attaches a twisted young tree to it, drags it before
    his grandmother’s house, and his grandmother cuts, steams, and hangs the whale
    meat.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: His grandmother makes a large basket and fills it with foods including berries,
    salmon, roots, and kinnikinic berries; he and his grandmother hide it near the
    town.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: When the uncles kill another porpoise and the chief again takes it, the nephew
    contests the taking and becomes so angry that the floor planks are described as
    split into slivers by his fingernails.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: Outside, the nephew twists the chief’s neck; the chief cries that he has been
    killed, and his voice is lost in the woods.
  category: action
  evidence_refs:
  - ev:13
