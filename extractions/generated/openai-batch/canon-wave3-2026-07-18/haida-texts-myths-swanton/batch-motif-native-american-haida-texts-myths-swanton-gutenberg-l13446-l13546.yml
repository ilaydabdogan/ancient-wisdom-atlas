canonical_text:
  quote: ''
  summary: Big-tail is concealed in the armpit of Supernatural-being-at-whose-voice-the-ravens-sit-on-the-sea
    while many supernatural beings enter a house. Killer whales remove their skins,
    South-east arrives with storm phenomena and asks about the fate of humans, Djila′qons
    and Woman-sitting-and-smelling interact over red-painted eyebrows, Pestilence
    arrives in a spark-emitting vessel and is countered by a nephew with a tube-like
    object, and masked power-song performances produce white property that falls first
    by a vacant seat associated by Big-tail with The-one-below. The gathering ends
    with a large pile of property, provisions, a whale feast, and the departure of
    the big beings.
  language: English
  quote_policy: summarized
