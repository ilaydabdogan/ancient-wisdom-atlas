canonical_text:
  quote: ''
  summary: A male figure, later named Upward, is put with his canoe into a boiling
    water-tight basket heated by red-hot stones. His wife cries on the roof and water
    enters through holes she makes; after he thinks of and drums on a copper drum,
    a chief orders him thrown out, and his wife takes him away. Later he suspects
    his wife after hearing songs about himself, sees a rainbow enter through the smoke-hole
    toward her room, and beheads the visiting man, fastening the head above the door.
    A woman in a hair-seal canoe demands the head, nearly overturns Skedans with a
    half-red, half-blue object, and finally receives it. Upward enters the water,
    seizes her canoe, is invited in by the chief-woman, and lies with her; she later
    restores her son by putting his head back in place. Upward then observes the chief-woman
    and her servants singing while root-digging, sees a flying thick-eyebrowed person
    lie with her, disguises himself in her clothing and ornaments, cuts off that person's
    penis, replaces it with a sea-cucumber, and later the chief-woman and servants
    weep; the lover is identified as Snowy-owl.
  language: English
  quote_policy: summarized
