canonical_text:
  quote: ''
  summary: In a bilingual Haida-English interlinear passage, a singular male actor
    receives instructions, searches for objects linked with salmon and bodily sickness,
    places them in fire, and cures afflictions. He is told to care for bones after
    eating salmon. Later he is instructed to use a young hemlock branch at a dancing
    house and not to look in, but he looks and becomes covered with eggs. Herring
    people and salmon people appear; salmon people travel by canoe toward the earth's
    surface. Moldy-Forehead gets in with them, and floating charcoal and foam destroy
    some of the group.
  language: Haida (Skidegate dialect) with English interlinear translation
  quote_policy: summarized
