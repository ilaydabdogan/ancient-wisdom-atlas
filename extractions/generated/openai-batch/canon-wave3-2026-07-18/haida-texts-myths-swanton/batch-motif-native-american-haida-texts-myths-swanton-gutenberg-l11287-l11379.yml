canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a man who has taken back
    his wife escapes pursuers with the help of an old man who hides them in his mouth
    and later releases them to return home. It then introduces an alternate version:
    an orphan boy living with his grandmother gains his name from a swollen finger,
    repairs a crane''s broken beak, unknowingly receives shamanic powers, sees and
    extracts a bone causing his cousin''s sickness, obtains his father''s ritual paraphernalia,
    and becomes a great shaman. He then sets out to marry the daughter of a dangerous
    chief whose suitors are killed by being made to swallow red-hot stones; with crane-given
    medicine and other medicines, he survives the ordeal and travels by a mountain-goat
    wool strap bridge toward the girl''s house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A crowd pursues a man said to have taken his wife back; an old man hides the
    couple in his mouth, denies sensing anyone on the trail, is searched, and the
    crowd leaves.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man takes the couple out, tells them to go carefully with the wife
    along the trail, and the man later reaches town with her and stays with her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the village T’ī, a boy lives with his grandmother after his parents have
    died; a splint under his fingernail makes his finger swell and leads to the name
    Sʟᴇg̣otsg̣ā′noē.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:4
  text: The boy meets a crane with a broken beak and carves a new wooden beak for
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: The boy makes a mat apron, a cockleshell rattle, and a wooden shaman's wand
    while imitating shamans who are trying to heal his cousin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The boy sees a bone in his sick cousin's side and two black men at the door
    who are identified as porpoises; the people laugh at him, but he is allowed to
    try healing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The crane has given the boy shamanic powers without his knowing it; when he
    pulls out the bone, the cousin becomes well, and when he replaces it, the cousin
    becomes sick again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The grandmother warns the boy not to claim that he can save his cousin because
    he may be punished.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: When summoned to the chief's house, the boy carries his ritual objects, goes
    around the fire with the fireplace to his left, removes the bone, blows on the
    patient while people beat time, and the patient recovers temporarily.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After other shamans fail, the sick boy asks for his cousin again; the healer
    refuses ordinary property, the porpoises announce that he wants his father's dancing
    paraphernalia, and after the uncle promises it, he heals the cousin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boy replaces his mat apron, shell rattle, and wooden wand with a beautiful
    apron, wooden rattle, and bone wand, and is described as a great shaman.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A chief named T’êckoa′nayē has a daughter desired by chiefs and kills suitors
    by heating four stones in the fire and making them swallow the stones.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The crane gives the shaman a medicine that makes water gather in his mouth
    so that he can swallow the hot stones without injury.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The shaman chews a medicine at a place of rock slides, then throws a mountain-goat
    wool strap over Skidegate straits and steps across it as a bridge to reach the
    girl's house.
  category: sequence
  evidence_refs:
  - ev:11
