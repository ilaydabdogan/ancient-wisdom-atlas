canonical_text:
  quote: ''
  summary: A woman burns animated skins in the house, after which her children are
    present. She warns them not to look at their father. Sawałī′xa calls to the father
    and eats from his food. The father uses a cape and song to make eight children
    lie as if asleep. The last child, ʟā′ga-na′qatî, has medicine in his mouth, resists
    the father, heals himself, throws the father onto a whetstone, and revives his
    brothers. The children learn that a supernatural being in a cave destroyed their
    uncles. They make ropes and snares, repeatedly use their sister as bait and revive
    her with medicine, but their ropes break. A wren says “sinews,” after which they
    hunt wrens and twist the sinews into a slender rope.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wife puts wood on the fire before going out, then returns quietly and
    sees skins hung in the rear of the house pushing one another about.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She gathers the skins and puts them into the fire; after they burn, figures
    sit in a row opposite her, including one woman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother tells the children not to look toward their father when he comes
    home and says people never look him in the face.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sawałī′xa runs outside and shouts toward his father while the father is fishing
    seaward, despite his mother trying to stop him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the father has eaten, Sawałī′xa eats two fat pieces from a split fish
    and pushes away the tray.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father asks for his cape, puts it on, calls the children to him one by
    one, sings to them, pulls them close to his breast, and eight lie as if asleep.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The last child has medicine in his mouth; when he spits medicine upon his
    chest, sharp glass-like things and needles fall off and stick into or fall onto
    the floor planks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father pushes the last child toward an edged whetstone, which grinds skin
    off the child's side; the child rubs medicine on himself, heals, wrestles with
    the father, throws him down, and the father is ground to pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The medicine-bearing child lays his elder brothers together, spits medicine
    on them, and they get up saying they must have been sleeping there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The mother says the town is empty because a supernatural being at the south
    end of the island destroyed the children's uncles; the children find it living
    in a cave with a pile of human bones in front.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: All nine twist and splice cedar limbs into a long stout rope, set a snare
    before the supernatural being's den, strangle their sister, fasten her to a pole,
    and use her as bait.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the supernatural being comes out, they pull the sister back, spit medicine
    on her, and she seizes the rope, but the cord breaks and they fall backward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: They repeat the snaring attempt with a rope made from roots gathered on Gᴀsqo
    island, and again with dry strings from the beach; both attempts fail when the
    rope breaks.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: A wren chirps a word glossed as “sinews”; the children make blunt arrows and
    bows, bring in wrens, and their sister pulls out the sinews so they can twist
    them together.
  category: sequence
  evidence_refs:
  - ev:10
