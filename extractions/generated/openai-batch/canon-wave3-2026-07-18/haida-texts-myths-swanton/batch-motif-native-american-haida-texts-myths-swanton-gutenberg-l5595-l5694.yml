candidate_motifs:
- id: motif:1
  label: Entering animal skins for transformation and movement
  taxonomy_refs:
  - shapeshifter
  basis: The protagonist skins the bufflehead and blue slender bird, enters the skins,
    uses one in rough water, uses the other to fly, and later changes himself explicitly.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage describes entering skins and changing form, but does not provide
    a general theory of transformation.
- id: motif:2
  label: Animal messenger whose speech alters the tide
  taxonomy_refs:
  - trickster_boundary
  basis: The protagonist uses a dog to speak his desires; the tide dries up or returns
    immediately after the dog announces the messages.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is functional and cautious; the passage itself
    does not label the episode as a boundary-crossing motif.
- id: motif:3
  label: Magical exchange through withheld medicine
  taxonomy_refs:
  - sacred_exchange
  basis: Gum called woman's medicine is withheld until the uncle's wife gives the
    husband's owned white round object; after she chews and swallows the juice, her
    mind is changed.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The term 'sacred' is not used in the passage; the fit rests on a ritualized
    or powerful exchange involving medicine.
- id: motif:4
  label: Acquisition of power-objects from hunted birds
  taxonomy_refs:
  - shapeshifter
  basis: The protagonist repeatedly hunts birds feeding on the whale and obtains skins
    that he can enter and use.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage states ownership and use of the skins but does not explicitly
    call them power-objects.
- id: motif:5
  label: Voice or cry splitting stone
  taxonomy_refs: []
  basis: After entering the blue bird skin, the protagonist cries a raven croak while
