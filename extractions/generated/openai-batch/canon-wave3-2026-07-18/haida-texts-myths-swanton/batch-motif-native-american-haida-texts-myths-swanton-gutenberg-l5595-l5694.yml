  confidence: medium
  cautions: No supplied taxonomy family directly matches this literal episode.
- id: motif:6
  label: Disguised approach to another's wife during husband's absence
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: After the husband leaves to hunt, Raven changes himself, adorns himself,
    enters behind the screens, and the wife later answers the husband's question by
