canonical_text:
  quote: ''
  summary: Raven/Nᴀñkî′lsʟas-łîña′-i receives gum called woman's medicine from singing
    women, exchanges it through his mother for a white round object from his uncle's
    wife, commands tides through a dog messenger, obtains a whale left by his parents,
    acquires and enters bird skins, splits a rock with a raven cry, and later changes
    himself with sky blankets and face paint in a scene involving his uncle's wife
    and her husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The protagonist starts out early and comes to persons who sing sweet songs,
    dance, and ask what he is doing there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The singing women chew gum, call it woman's medicine, give him a piece, and
    instruct him to withhold it from his uncle's wife until he receives the thing
    her husband owns.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the protagonist enters the house, red gum is visible from his mouth;
    his uncle's wife asks for it, his mother mediates, the wife gives a white round
    object, and after chewing and swallowing the gum juice her mind is said to be
    changed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The protagonist speaks to a dog, telling it to announce his desire that the
    place where his fathers are should dry up; the dog goes out and says this, and
    the tide leaves them high and dry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The protagonist tells his mother to pour water on his fathers; she pours it
    only on Fin-turned-back and does not look upon her husband.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fathers are said to be going to the supernatural beings of Da′osgên to
    buy a whale.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The protagonist again sends the dog to announce that he wants the tide to
    come in to his parents, and the parents move away on the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After another message through the dog, something black is sent to one end
    of the town, and the protagonist finds a whale floating there.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The protagonist makes a house of hemlock boughs and shoots many birds near
    the whale.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A bufflehead eats from the whale; the protagonist shoots it by aiming above
    its head, skins it, enters the skin, wishes for heavy swell, dives under waves,
    dries the skin, and keeps it in a tree fork.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A blue slender bird repeatedly comes down from above to eat from the whale;
    two shots pass through its wings before the protagonist shoots above it and strikes
    its head as it starts to fly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After skinning the blue slender bird and entering it, the protagonist flies,
    turns down, runs his beak into a rocky point, cries out with a raven croak, and
    splits the rock by his voice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The aunt or uncle's wife tells her husband to go hunting; a war spear and
    box of arrows are prepared, and at midnight he leaves in a canoe.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Raven goes out, changes himself according to the parenthetical gloss, puts
    on two sky blankets, paints his face, enters, and goes behind the screens while
    the uncle's wife turns her head.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: A thunder-like noise is heard on the underground side of the island; the husband
    later asks his wife about the noise, and she answers that she is the same with
    his nephew.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The next morning Great-breakers sits where the fire was; a round fleck of
    foam swirls on the chief's hat, and something on the uncle's head turns rapidly.
  category: setting
  evidence_refs:
  - ev:12
