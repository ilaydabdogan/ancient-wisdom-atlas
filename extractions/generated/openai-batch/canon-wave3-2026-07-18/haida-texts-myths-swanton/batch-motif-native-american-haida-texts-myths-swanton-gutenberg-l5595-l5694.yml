comparison_claims:
- id: claim:1
  claim: At the motif-family level, this passage fits a shapeshifter pattern because
    the protagonist enters animal skins, flies or moves through water in those forms,
    and is explicitly said to change himself.
  claim_level: same_motif
  target: motif_family:shapeshifter
  evidence_refs:
  - ev:6
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to motif-family classification and does not assert
    historical contact or a specific parallel text.
- id: claim:2
  claim: The dog-mediated tide commands can be cautiously compared by function to
    trickster-boundary narratives in which a figure's indirect speech changes a natural
    boundary between land and sea.
  claim_level: same_function
  target: motif_family:trickster_boundary
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides the tide-control sequence but does not itself
    state a comparative category; the comparison is functional only.
- id: claim:3
  claim: The gum episode can be cautiously compared to a sacred-exchange pattern because
    a potent substance is withheld until an owned object is obtained, and the recipient's
    mental state changes after consuming it.
  claim_level: same_function
  target: motif_family:sacred_exchange
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses the word medicine, not sacred; the comparison should
    be reviewed against Haida-language context.
