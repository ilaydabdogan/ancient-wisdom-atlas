candidate_motifs:
- id: motif:1
  label: Ritual action halts earth disturbance
  taxonomy_refs:
  - chaos
  basis: The passage links earth shaking, thunder, and landslides with a woman’s arrangement
    of shells, grease, and feathers, after which the event stops and she believes
    her actions stopped it.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage reports the woman’s belief and does not independently confirm
    causation; the taxonomy link to chaos is broad.
- id: motif:2
  label: War-party return with trophy scalps
  taxonomy_refs: []
  basis: Returning warriors display two scalps from the stern of their canoe, and
    Kī′dja-i later retrieves the scalps from a drifting canoe rather than saving the
    canoe itself.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: This is a warfare pattern in the passage, not matched to a supplied taxonomy
    family.
- id: motif:3
  label: Refugee migration and fortified resettlement by canoe
  taxonomy_refs:
  - departure
  basis: The group loads canoes, travels between camps, rejects an island without
    water, and settles at Qꜝo′nakoa fort by building houses.
  evidence_refs:
  - ev:4
  - ev:15
  - ev:16
  confidence: medium
  cautions: The departure taxonomy is used in a literal migration sense; the passage
    does not frame the movement as a mythic quest.
- id: motif:4
  label: Animal-identity battlefield boast
  taxonomy_refs:
