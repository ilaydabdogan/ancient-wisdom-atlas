canonical_text:
  quote: ''
  summary: The passage recounts earth tremors, thunder, and landslides that a named
    woman believes she stops by arranging clam shells with duck grease and feathers.
    Warriors and refugees move by canoe, camp, and maintain sentinels. Returning fighters
    display scalps and report finding Skidegate empty, breaking open grease boxes,
    and killing youths. A warning leads canoes to turn back; a drifting canoe is retrieved
    only for its scalps. Skidegate and Kloo-related groups fight with guns, exchange
    speeches involving a grizzly-bear identity claim, suffer wounded men, and stop
    fighting at night. Women flee inland; a pregnant woman comes down from the mountains
    and finds relatives or acquaintances. The people inspect an island lacking water,
    settle at Qꜝo′nakoa fort, build houses, receive war news, and the passage ends
    with Skidegate people killing three fishers under an overturned canoe in the rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People remaining behind experience an altered earth, ground shaking, thunder
    overhead, and landslides.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Woman-too-dirty-to-be-touched owns four large clam shells, duck feathers,
    and duck grease, lays the shells down, puts grease in them, sets feathers along
    the edges, and speaks to them about not spilling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The disturbance stops, and the woman believes it stopped because of her actions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The people load and anchor canoes at a creek mouth, travel together, camp,
    stay awake at night, and have Amasa′n and his family act as sentinels.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ginᴀ′skilas, West-coast-clouds, and a slave go to examine a peninsula and
    meet two returning warriors whose canoe has two scalps hanging from the stern.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The returning warriors report finding Skidegate empty, not entering the houses,
    concealing their canoes, finding sixty grease boxes, breaking them open, and cutting
    off the heads of four youths who came for devilfishes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A woman shouts news that Alder and Grandson found Skidegate empty and that
    their canoes are full; she recognizes Gᴀ′nx̣oat’s Sea-gull canoe and turns around,
    escaping to land.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kī′dja-i swims to a drifting canoe, takes the two scalps rather than the canoe,
    and swims ashore with the scalps in his mouth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Skidegate and Kloo-related fighters meet in the woods, and the passage describes
    a great sound of guns.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A Skidegate-town man and a man of Those-born-at-Qꜝā′dᴀsg̣o, formerly good
    friends, exchange shouted words during the fighting.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Property-always-running-about says he was born a grizzly bear from grizzly-bear
    parents and had been placed at the front in war.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Amasa′n and a Skidegate man shoot at each other over a thin rock; Amasa′n
    asks for a war spear, but the people behind him refuse to give it to him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Tā′-iłgwai and Gidagā′ñgu fall wounded or fallen on opposing sides; the fighters
    call out to stop and cease shooting as darkness comes.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Flood-tide-woman flees up among the mountains when women escape to land; she
    is within a month of giving birth.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: At dark Flood-tide-woman descends cautiously, hears people laughing, and encounters
    Gwai′îs, who had been in love with a woman among them.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: The group considers an island; part of the group wants to use it and part
    refuses, because although it is good for houses it has no water.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:17
  text: The people go to Qꜝo′nakoa fort, judge it good and suitable for keeping canoes,
