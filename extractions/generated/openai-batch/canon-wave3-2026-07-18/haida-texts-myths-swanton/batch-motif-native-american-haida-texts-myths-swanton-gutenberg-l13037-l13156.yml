  label: THE STORY OF ONE WHO SAW AN EAGLE TOWN / THE ONE THEY ABANDONED BECAUSE HE
    WAS THE FIRST TO SPEAR SEA LIONS / THE MAN WHO MARRIED A KILLER-WHALE WOMAN /
    HE WHO WAS ABANDONED BY HIS UNCLES; lines 13037-13156
