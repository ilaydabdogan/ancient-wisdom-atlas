canonical_text:
  quote: ''
  summary: The passage contains the tale of a man and his sister abandoned by nine
    uncles, their journey following ravens to a mountain hole and then to Kundi, a
    supernatural marriage bargain involving Kꜝū′dᴀña-point, the killing and transformation
    of visitors into sea otters and seals, and the man’s later rise to chiefly status.
    It then begins another Stasqa′os abandonment tale in which a hungry man, his wife,
    and mother-in-law live with withheld salmon eggs, an earth-dug puppy becomes a
    provider of increasing sea foods, and the mother-in-law causes an east wind by
    pouring heated urine into the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and his sister are abandoned by his nine uncles and build a small house
    under a tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two ravens repeatedly fly from the west coast, sit on the tree, wipe their
    bills, and return over a mountain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The siblings become suspicious and travel in the direction taken by the ravens,
    going up the bed of Stasqa′os creek.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the top of a mountain the siblings find a hole whose bottom cannot be seen,
    and attempts to leave bring them back to it repeatedly.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man throws dirt into the hole and says it makes people return when they
    try to go away; afterward the siblings reach the town-site of Ku′ndi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Ku′ndi three rows of whales have floated ashore, with fresher whales nearer
    the sea, and killer whales sleep noisily on a reef.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man and his sister build a house, and the man cuts up and steams fresh
    whales.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Something whispers to the sister at night; she reports that Kꜝū′dᴀña-point
    will marry her and that the man will receive much food if he agrees and makes
    a strong club.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sister is gone in the morning after the agreement.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Good-looking people enter the house; when the house is crowded, the man stands
    outside and strikes them on the head as they leave.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The people struck by the man fall dead and become sea otters and hair seals.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two slaves of the uncles find the man; he feeds them and asks them not to
    report his situation, but one conceals food under his tongue for his child.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The uncles come after the slaves tell about the man; the passage notes that
    the youngest uncle’s wife had secretly left him food at the time of abandonment.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The uncles’ daughters arrive dressed up in canoes with coppers raised on poles;
    the man accepts the youngest and refuses the others.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The man marries the daughter of the youngest uncle; a town arises there, people
    buy food from him, and he becomes a chief.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: In the second tale, people abandoned at Stasqa′os include a man, his wife,
    and his mother-in-law; the mother-in-law owns salmon eggs while the hungry man
    repeatedly brings firewood without receiving them.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:17
  text: The wife hears a puppy bark within the earth while digging spruce roots, digs
    it out, brings it home, and the puppy grows quickly.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: After the dog is reared, sea foods begin appearing outside in an increasing
    sequence from fish to halibut, porpoises, hair seals, and whales.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:19
  text: When the mother-in-law becomes tired of grease, she cuts open the salmon eggs
    and gives some to the man, but he does not look at them.
  category: action
  evidence_refs:
  - ev:15
- id: obs:20
  text: The son-in-law covers chitons with rotten whale, and whole whales come to
    cover Stasqa′os beach.
  category: action
  evidence_refs:
  - ev:15
- id: obs:21
  text: The mother-in-law collects urine, heats it with stones, and pours it into
    the sea while the dog is out at sea and the son-in-law sleeps; a great east wind
    arises and increases.
  category: action
  evidence_refs:
  - ev:16
