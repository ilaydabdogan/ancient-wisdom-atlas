  basis: After abandonment, the man obtains access to food, marries the youngest uncle’s
    daughter, a town arises, people buy food from him, and he becomes chief.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage states his chiefly outcome but does not provide an explicit
