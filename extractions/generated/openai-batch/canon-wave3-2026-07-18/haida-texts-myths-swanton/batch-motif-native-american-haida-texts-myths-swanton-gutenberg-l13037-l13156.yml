- id: ev:6
  type: summary
  locator: 13076-13078
  quote_or_summary: The man and sister construct a house; when it is finished, he
    cuts up and steams fresh whales.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:7
  type: summary
  locator: 13079-13092
  quote_or_summary: The man hears night whispering to his sister; she says Kꜝū′dᴀña-point
    will marry her, offer him much food if he agrees, and instructs him to make a
    strong club and break heads when the house is full. He agrees, and she is gone
    in the morning.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:8
  type: summary
  locator: 13093-13100
  quote_or_summary: Good-looking people, some curly-haired, crowd the house; the man
    stands outside and strikes them as they leave. They fall dead and become sea otters
    and hair seals; Kꜝū′dᴀña-point is said to own the west coast sea otters.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:9
  type: summary
  locator: 13101-13108
  quote_or_summary: Two of the uncles’ slaves search for and find the man; he feeds
    them, tells them not to reveal his situation, and one hides a small piece of food
    under his tongue for his child.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:10
  type: summary
  locator: 13109-13116
  quote_or_summary: The uncles come around Sqa-i-point because the slaves told about
    him; the passage adds that, during abandonment, the youngest uncle’s wife secretly
    left him food enough for some time.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:11
  type: summary
  locator: 13117-13125
  quote_or_summary: The uncles’ daughters arrive dressed up in canoes with coppers
    raised on poles; the man calls in the youngest, refuses the others, marries the
    youngest’s daughter, a town arises, people buy food from him, and he becomes chief.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:12
  type: summary
  locator: 13131-13141
  quote_or_summary: In the Stasqa′os tale, abandoned people include a man, his wife,
    and his mother-in-law. The mother-in-law owns salmon eggs; the hungry man repeatedly
    brings firewood and expects some but receives none.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:13
  type: summary
  locator: 13142-13148
  quote_or_summary: When snow is gone, the man sends his wife for spruce roots; she
    hears a puppy bark within the earth, digs it out, brings it home, and they rear
    it as it grows very fast.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:14
  type: summary
  locator: 13149-13156
  quote_or_summary: 'Food begins appearing outside in increasing amounts and sizes:
    fish, halibut, porpoises, hair seals, a whale tail, and half a whale; the dog
    also becomes large.'
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:15
  type: summary
  locator: 13157-13168
  quote_or_summary: After they tire of eating grease, the mother-in-law cuts open
    the salmon eggs and gives some to the man, who does not look at them. Later she
    seeks low-tide foods, the son-in-law covers chitons with rotten whale, and Stasqa′os
    beach becomes covered with whole whales.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
- id: ev:16
  type: summary
  locator: 13169-13156
  quote_or_summary: The mother-in-law secretly collects urine, heats it with stones,
    and pours it into the sea while the dog is out at sea and her son-in-law sleeps;
    a great east wind arises and increases by daylight.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized evidence.
