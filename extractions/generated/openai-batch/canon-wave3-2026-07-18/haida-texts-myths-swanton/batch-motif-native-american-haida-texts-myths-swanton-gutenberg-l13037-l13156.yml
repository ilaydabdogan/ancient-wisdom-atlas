candidate_motifs:
- id: motif:1
  label: sibling pair abandoned by kin
  taxonomy_refs:
  - sibling_pair
  - departure
  basis: A man and his sister are abandoned by nine uncles and must live and travel
    together away from the abandoners.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage emphasizes abandonment and sibling companionship; the broader
    function of the departure is not explicitly explained.
- id: motif:2
  label: repeated birds reveal a path to another place
  taxonomy_refs:
  - mystical_quest
  basis: The siblings notice the repeated ravens’ flight path and follow it toward
    the mountain and Ku′ndi.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: medium
  cautions: The ravens do not speak or explicitly guide; the guidance is inferred
    from repeated action in the narrative.
- id: motif:3
  label: place that compels return until ritually addressed
  taxonomy_refs: []
  basis: The hole at the mountain top repeatedly brings the siblings back when they
    try to leave, until the man throws dirt into it and comments on its returning
    power.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage gives the action and effect but does not explain the hole’s
    nature.
- id: motif:4
  label: supernatural marriage bargain for food and action
  taxonomy_refs:
  - sacred_marriage
  - sacred_exchange
  basis: The sister reports that Kꜝū′dᴀña-point will marry her and that, if the brother
    agrees and makes a club to strike visitors, he will receive much food.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The marriage is reported through a night message and the sister disappears;
    the passage does not describe a wedding ceremony.
- id: motif:5
  label: struck visitors become sea animals
  taxonomy_refs:
  - shapeshifter
  basis: The good-looking visitors are struck dead and become sea otters and hair
    seals.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The text presents transformation after death rather than voluntary shapeshifting.
- id: motif:6
  label: abandoned man becomes food-rich chief
  taxonomy_refs:
