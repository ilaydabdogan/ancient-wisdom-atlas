canonical_text:
  quote: ''
  summary: A man brings home a wife who first appears as a cloud and is revealed when
    her hat is removed. After he kills a whitish sea otter, his wife washes its blood-spotted
    skin and is taken seaward by killer whales. An old man helps him reach a supernatural
    underwater town by a kelp trail. Heron hides him after receiving tobacco and cedar.
    The man heals two sore-covered persons with tallow, and they help him retrieve
    his wife by filling the house with steam. A three-headed house pole announces
    that he has taken her back.
  language: English
  quote_policy: summarized
