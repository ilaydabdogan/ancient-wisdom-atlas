canonical_text:
  quote: ''
  summary: A town chief has destroyed nine nephews after offering them his wife and
    sending them into deadly encounters with things he owns. A younger brother gains
    strength by bathing in the sea, prepares tools and protective objects, survives
    the uncle’s traps involving a rotten tree, cormorants on a cliff, burning bark,
    and a cockle, and destroys or carries away the uncle’s supernatural helpers. The
    uncle and friends then tie him in a box and throw him into the ocean, but he floats
    ashore and is rescued by two women, one of whom says she will marry him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A town chief lets his nephews have his wife and sends them to get things he
    says he owns; after repeated attempts involving an old dead tree, bark, and a
    cormorant net, nine nephews are destroyed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger brother learns what has happened, bathes in the sea for a while,
    becomes strong, smashes things he holds, and twists and pulls out spruce limbs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The younger brother makes or gathers several aids: two wedges, a sharpened
    sg̣u′nskaxaua shell, a weasel skin, feathers, and a hollow form made from pressed
    mud.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger brother paints his face and sits on top of the house; the uncle
    is described as jealous, calls him inside, gives him food, and tells him he shall
    marry the uncle’s wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the rotten tree, the uncle drops a wedge into an opened crack and asks
    the nephew to retrieve it; the nephew enters, knocks out the brace, and the crack
    closes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the uncle leaves rejoicing, the nephew cuts a hole from inside the log,
    comes out, takes out his elder brothers, breaks part of the log, and carries part
    home; the log is identified as the uncle’s supernatural power.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a high cliff, the uncle sets a net for a cormorant and pushes the nephew
    over; the nephew uses the feather to drop easily, enters the weasel skin to climb
    back up, catches cormorants, and tears the net to pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At burning bark, the uncle pushes the nephew into it, but the nephew gets
    inside the pressed mud form and does not feel the burning; afterward he pushes
    down and carries home some of the bark, which is called a supernatural helper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the cockle, the uncle tells the nephew to get it and pushes him into its
    open mouth; the nephew cuts its ligaments with a knife, pushes it open, throws
    part around, and carries part home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the cockle episode, the passage says the nephew has destroyed all of
    the uncle’s supernatural helpers.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: While the nephew sleeps on a bearskin, the uncle and his friends put him in
    a box, tie cords around it, carry it far out toward the middle of the ocean, and
    throw it into the water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The boxed nephew floats ashore on sand; two women, including Cloud-watcher
    and Cloud-watcher’s elder sister, remove the lid and pull him up, and the elder
    sister says she will marry him because she saw him first.
  category: sequence
  evidence_refs:
  - ev:9
