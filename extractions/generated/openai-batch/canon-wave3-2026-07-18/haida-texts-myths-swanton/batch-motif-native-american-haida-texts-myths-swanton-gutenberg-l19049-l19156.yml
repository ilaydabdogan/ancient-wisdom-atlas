canonical_text:
  quote: ''
  summary: A war narrative recounts warning of an impending Bellabella attack, shamanic
    detection of enemies at sea, raids on Kloo people, enslavements and killings,
    survivors signaling for rescue with smoke, mourning and treatment of a recovered
    headless body, and a later Haida approach to a Bellabella fort while its occupants
    sleep after secret-society singing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waters was dead at Sea-grass town, and his Tsimshian friend Wās came with
    four canoes of grease and sent food through the fire to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wās told the people that the Bellabella of the whole inlet had prepared canoes
    to make war on the Eagle people, but they did not believe him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a long sandy beach, the shaman Dī′g̣a-koya′ku performed and said that his
    supernatural powers had seen something at sea and that the Bellabella were coming
    that day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Ninstints man named Youngest-chief’s-son, previously taken, acted as pilot
    for the Bellabella and identified the fires of the Ninstints people and Gîtku′n’s
    people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bellabella canoes gathered near a camping place and raiders ran ashore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A woman behind the house was seized by a Bellabella attacker, knocked him
    down, struck his head with a short stick, and escaped.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bellabella raiders enslaved a Kloo man and his wife, then enslaved seven Kloo
    people at Qꜝo′na.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A raider shot near Gī′tgua fort, came upon a man hammering silver, fired without
    aiming, and tried to cut off the man’s head but cut his chest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Winōʟalū′sila heard a child singing, approached a camp screened by a mat,
    inspected those lying behind it, and returned to report their number.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Winōʟalū′sila went back alone; when others ran up, he had cut off a head,
    was covered with blood, held the head from his mouth, and carried two knives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At that place the Bellabella enslaved five people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Xēna-point, raiders lay in lines by the grass, advanced in a line, shouted,
    threw themselves upon the people, enslaved many Kloo people, and some escaped
    into the woods.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the captives were put into canoes, the attackers raised sails in a north
    wind and left many dead bodies behind.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Far out at sea, the head of Sʟins of the Cumshewa-town people was pulled off
    while he sat in a canoe, and his still-living body was thrown overboard.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Those who escaped into the woods met at Skwa′-ikun island, went toward the
    mainland on rafts, made a big smoke toward Ninstints, and were taken over to Ninstints.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After news of the attack, fishing stopped, people went to Sea-grass town,
    found the floating headless body, put it into the fire, took along the bones,
    wailed, and prepared for war.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The later war party did not know the mouth of Bellabella strait, pulled their
    canoes into the woods, and at dawn saw Wawayiê′la’s fort, named Lai′ʟaikꜝia-i.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:18
  text: The war party circled the fort while the Bellabella slept, saw many log houses
    on the lower part of the island point, and later went toward it just before daylight.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:19
  text: The fort people had sung all night for Wawayiê′la, who was acting in the secret
    society, and were asleep from weariness when the Haida came in front of them.
  category: sequence
  evidence_refs:
  - ev:12
