canonical_text:
  quote: ''
  summary: A nephew of the Skedans town chief offends his uncle, is set adrift on
    a pitch-lined cedar block, reaches a supernatural place, marries a chief’s daughter
    who had been kept for him, receives eagle feather clothing, and returns to Skedans
    in eagle form. After the townspeople shoot at him, he carries them seaward and
    they become islands. Later, among eagle-clothed people who hunt sea creatures,
    he disobeys a warning not to touch a thing protruding from the water; he and many
    others are drawn under in a chain while his wife’s grandmother prepares her claws.
  language: English
  quote_policy: summarized
literal_observations:
