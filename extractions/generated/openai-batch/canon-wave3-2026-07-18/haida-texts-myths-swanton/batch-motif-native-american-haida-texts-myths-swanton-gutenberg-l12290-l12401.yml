- id: obs:2
  text: He put shavings into the fire in front of his uncle’s wife and saw her genitals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a flicker spread red wings, he said he had just seen something in the
    house exactly like that, and his uncle became ashamed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: His uncle had a cedar block shaped like a canoe, put warmed pitch into it,
    made him sit on it, and took him out to the open sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wind blew from the ocean, he floated ashore at Broken-shells-of-the-supernatural-beings,
    and sunshine melted him free.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: He came to a town and looked into the chief’s house, where a woman sat between
    screens pointing toward each other.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman said her father kept her for the one whose uncle had taken him toward
    the open sea; he answered that he was that person, and she let him lie with her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman’s father accepted him as her husband and gave him food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The father-in-law took eagle feather clothing from a box and gave one garment
    to him; he put it on and flew.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Skedans, children and then adults shot at him while he sat lower, made
    himself small inside the skin, and changed himself repeatedly as instructed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: He seized one person by the head; others held one another by the feet until
    he flew up with the whole town, dropped them seaward, and they became islands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the other town, people entered feather clothing before daybreak, sat in
    line on a pole, flew out, and returned in the evening with marine animals and
    fish.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: He received a young person’s skin, flew out with the others, caught spring
    salmon, and later seized a whale in his talons.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: His father-in-law warned him not to touch a thing sticking out of the water
    at Skedans point and later showed him places around the island where underwater
    fish and sea mammals were visible.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: He seized the protruding thing; it acted like a solid object and nearly pulled
