candidate_motifs:
- id: motif:1
  label: Peacemaking through compensatory exchange
  taxonomy_refs:
  - sacred_exchange
  basis: The passage repeatedly describes peace following blood money, slave compensation,
    property transfers, grease gifts, and reciprocal exchanges.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents these as social and political acts in a war narrative;
    the available taxonomy label is broad and should be reviewed before treating the
    exchange as explicitly sacred.
- id: motif:2
  label: Marriage alliance to prevent renewed conflict
  taxonomy_refs: []
  basis: After Point-town and Up-inlet fighting, women on each side marry with the
    opposite side because the groups feared anger would return.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a pragmatic peace-making reason and does not frame the
    marriages as sacred marriage.
- id: motif:3
  label: Prestige refusal of a stranger’s canoe
  taxonomy_refs: []
  basis: Lgiäx refuses to be taken away in strangers’ canoes, says he is too great,
    asks whether grandfathers ever got into strange canoes, and has a six-fathom canoe
    made before returning.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage implies rank or propriety but does not fully explain the social
    rule behind the refusal.
- id: motif:4
  label: Crest recognition preceding peace
  taxonomy_refs: []
  basis: A man wearing a grizzly-bear crest comes ashore; the warriors think he is
    all right and suggest making peace.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not explicitly state why the crest caused trust or how
    crest identity functioned in this context.
- id: motif:5
  label: Medicine-eating as war preparation
  taxonomy_refs: []
  basis: The Middle-town people begin to eat medicine at once, continue all winter,
    and then go to war in summer.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not explain the medicine’s composition, ritual context,
    or intended effect.
- id: motif:6
  label: Victory return with songs
  taxonomy_refs: []
  basis: After enslaving women who were gathering berries, the Middle-town people
    return to the fort singing songs of victory.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage gives a literal victory-song scene but does not elaborate
    on song content or ceremonial form.
