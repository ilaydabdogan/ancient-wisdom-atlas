canonical_text:
  quote: ''
  summary: The passage recounts successive conflicts and peacemaking episodes among
    Masset, Nass/Niska, Point-town, Up-inlet, Tsimshian, Middle-town, Tlingit, and
    related groups. Peace is repeatedly associated with blood-money payments, slaves,
    property, grease boxes, copper plates thrown into water, and cross-marriages.
    The passage also describes raids, enslavements, fortified settlements, canoe battles,
    medicine-eating before war, Lgiäx’s refusal to enter a stranger’s canoe, and an
    attack on a three-sail canoe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group came in ten canoes, carried dancers into all houses, gave blood money,
    gave three slaves for a killed chief, and left Masset with no slaves remaining
    because all were given as blood money.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the compensation, some departed joyfully while dancing and singing canoe
    songs, and feathers were left as an invitation for Masset people to visit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another peacemaking exchange involved a great deal of blood money, a stated
    true peace, an invitation to receive boxes of grease, and the Niska settling again
    in the burned town.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Point-town people fought the Up-inlet-gîtî′ns; five Point-town chiefs were
    killed, two copper plates were carried to Qꜝayā′ñ and thrown into the water, and
    peace followed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Point-town people and Up-inlet-gîtî′ns exchanged slaves as blood money and
    arranged women on each side to marry with the opposite side to prevent renewed
    anger.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Rocky-coast-gîtî′n was killed among the Tsimshian; a peace-making party
    was destroyed, and later Masset watchers shot at Tsimshian approaching shore behind
    Masset.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Tsimshian enslaved nine Masset people, after which families again made
    war on the Tsimshian and the sides continually killed each other.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At one lonely place a man came ashore wearing a grizzly-bear crest; the warriors
    thought he was all right, suggested peace, returned, and the Masset people received
    much property in peacemaking.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After another Tsimshian was shot and the person who was to take Lgiäx’s place
    was shot down, Lgiäx came to make peace so that his nephew would not be killed
    for nothing, and he received much property.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lgiäx and others were attacked by Middle-town people going to war against
    the Niska; the Gîtsqoalʼâ′tcꜝî were destroyed, nine escaped with Lgiäx to the
    woods, and they survived on food thrown overboard that floated ashore.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: When Tsimshian came in four canoes to get Lgiäx, he refused to enter a stranger’s
    canoe and later had food brought and a six-fathom canoe made before returning
    to his town.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The Tsimshian destroyed the fort of Sidī′kun, enslaved many Middle-town people,
    and killed many renowned Middle-town men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Middle-town people ate medicine all winter, then went to war, killed or
    enslaved many Tsimshian, sold captives among the Tlingit for ammunition and guns,
    and fortified themselves again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Middle-town people and Tsimshian fought from canoes on the ocean; later Middle-town
    people raised their canoes, fought, enslaved many women gathering berries, returned
    to the fort singing victory songs, and kept watch.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:15
  text: A three-sail canoe approached; Middle people planned to destroy it, the Middle-born
    prepared for it, the canoe was upset by shooting, a pitched battle followed, and
    neutral Salᴀ′ndas found the canoe owner and his wife under it.
  category: sequence
  evidence_refs:
  - ev:13
