canonical_text:
  quote: ''
  summary: Nankilslas/Raven returns by sea in altered form, and an episode involving
    Qingi, a tall hat, rising seawater, and the loss of half the town follows. He
    is later welcomed by his father Qingi, who asks his companions for the story 'Raven
    traveling,' causing Nankilslas shame. A small dark person and others recite formulaic
    accounts in which supernatural beings come to view wonders or contests near Qingi’s
    village and are destroyed or lost. Nankilslas then travels to Kundji, changes
    into a flounder to steal salmon-roe bait, loses and replaces his beak, is caught
    and nearly roasted, escapes by putting on feather clothing and flying through
    the smoke hole, and finally deceives a town by making false canoes from rotten
    trees so that the people flee and leave feast cakes for him to eat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nankilslas is seen floating on the sea in a hair-seal canoe, wearing his uncle’s
    hat, with foam swirling on top of it, and the town people perceive that he has
    changed in an unknown manner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The town people enter Qingi’s house, and the people place themselves between
    the joints of Qingi’s tall hat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seawater continues to increase, Qingi grows up, becomes angry, pulls the
    hat downward and breaks it, and half the people of his town are lost.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After being absent, Nankilslas stops in front of the town; his father has
    him brought in, gives him food repeatedly, and is glad to see him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Qingi asks Nankilslas’s companions to tell a story; when they say they do
    not know one, Qingi specifically asks for 'Raven traveling,' and Nankilslas hangs
    his head in shame.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A small dark person seated on the right throws himself backward and begins
    a formulaic utterance naming Qingi as master of stories, startling the people
    in the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The recitations state repeatedly that supernatural beings came to look at
    named wonders, objects, places, or contests near Qingi’s village and were destroyed
    or lost there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nankilslas travels on foot to the town of Kundji, where many canoes are fishing
    for flounders with salmon roe used as bait.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wanting the salmon roe, Nankilslas changes himself into a flounder, goes out,
    steals the bait for a while, and has his beak pulled out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: People sitting in rows gambling inspect the beak and pass it around; Nankilslas
    says it is made of salmon roe, then pulls out Screech-owl’s beak, puts it on himself,
    and substitutes a common thing in the owl.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After going out again, Nankilslas is hooked in the lip, pulled ashore, given
    to a child, and put over the fire on a stick; when his back becomes too warm,
    he wishes the town people would move away, then puts on feather clothing and flies
    out through the smoke hole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Crow invites people to a feast of cakes made from inner hemlock bark and cranberries;
    Nankilslas refuses the invitation, sends Eagle to learn what the feast is for,
    and has Eagle announce that the chief is coming.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before the eating begins, Nankilslas makes ten canoes out of rotten trees,
    places spruce cones upright in them, gives the figures grass tops as spears, and
    causes the people to flee, leaving their food; he then enters the house and eats
    the cakes.
  category: sequence
  evidence_refs:
  - ev:9
