canonical_text:
  quote: ''
  summary: Stone-ribs is taken to Qꜝā′g̣awa-i with his mother’s party, is left behind,
    sings, enters Qꜝā′g̣awa-i’s mouth in a canoe, dons a halibut skin inside its belly,
    swells up, and kills it. He reveals his identity and announces crests, travels
    along the coast wearing or displaying skins, defeats hostile beings, receives
    hospitality from others, explains local crab abundance and canoe passages, loses
    the lent halibut skin when its owner reclaims it, and returns to his mother with
    objects and skins to establish crests and songs for future generations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The town people went to Qꜝā′g̣awa-i for shellfish, and the protagonist’s mother
    went with them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The protagonist cried after the party, said he would kill Qꜝā′g̣awa-i, and
    was taken along with a weasel skin fastened in his hair and with his copper bow
    and arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After gathering mussels, the party went home from him; he sang songs and beat
    the canoe edges with his bow instead of a drum.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Qꜝā′g̣awa-i came after the party, the canoe went into its mouth, and the protagonist
    came to himself in its belly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside Qꜝā′g̣awa-i’s belly he put on his halibut skin, swelled up in its stomach,
    and killed it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Qꜝā′g̣awa-i’s five fins had figures of human beings at their bases.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: At that time the protagonist showed himself to be Stone-ribs, said he was
    the son of Djila′qons, and told the people what crests they would use.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Stone-ribs traveled around the west coast wearing the halibut skin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Looking-at-his-own-shadow, a big mountain, invited Stone-ribs into his house,
    fed him, laughed at him, ordered the door to shut, and trapped him behind a stone
    hanging door.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Stone-ribs put on the halibut skin, flopped around, lifted the hanging door
    with his fins and tail, broke it, and shut supernatural beings inside.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sunshine-on-his-breast and Tcꜝī′da treated Stone-ribs well; while at Tcꜝī′da’s
    house he wore Qꜝā′g̣awa-i’s skin before the town people, which is given as the
    reason people born at Kaisun wear Qꜝā′g̣awa-i as a crest.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Stone-ribs was warned about Greatest-crab, passed over it, had the edge fins
    of his halibut skin cut by its teeth, then returned and swallowed the crab.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Supernatural beings were glad to see Stone-ribs because he saved people from
    the thing that had made the south end of the island empty.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Nastō′ gave Stone-ribs food and let him go happily; afterward Stone-ribs let
    the crab out in Naden harbor, which is given as the reason there are many crabs
    there.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Na-iku′n and Spit-point each dried up before Stone-ribs; he entered his halibut
    skin and flopped across overland, and the passage identifies these places as canoe
    passages.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Many-ledges gave Stone-ribs food and was pleased to see him; Qî′ñgi and other
    supernatural beings invited him in because they wanted to see Qꜝā′g̣awa-i’s skin.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: At point Skwai, an eagle had Stone-ribs’s halibut skin; forest beings told
