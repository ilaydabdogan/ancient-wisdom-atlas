  category: action
  evidence_refs:
  - ev:13
- id: obs:20
  text: The passage states that Those-born-at-Skedans have the copper bow, arrows,
    and weasel skin as crests because Stone-ribs wore or carried them.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:21
  text: Stone-ribs showed his mother the copper arrows and Qꜝā′g̣awa-i’s skin and
    said future generations coming from her should wear them as crests and possess
    the songs.
  category: speech
  evidence_refs:
  - ev:14
