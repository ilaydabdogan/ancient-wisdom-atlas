canonical_text:
  quote: ''
  summary: An editorial note says the story’s names and localities mark it as Tlingit
    while it is popular among the Haida. In the narrative, a chief’s son discovers
    two women bathing in a lake with goose skins on the shore. He sits on the skins,
    returns one skin to the elder sister, and marries the younger sister. The elder
    sister becomes a goose and flies away. The husband hides the younger woman’s feather
    skin in a cedar. His wife does not eat ordinary human food but eats certain plant
    foods and secretly flies out to feed on sea grass. During scarcity, her supernatural
    father sends food down with geese. After someone mocks the “goose food,” the wife
    recovers her skin and flies through the sky. The husband seeks the trail to her,
    receives advice and quest objects from an old man, and begins inland. On the trail
    he meets a louse-covered being, grooms him with comb and oil, and is told that
    the trail leads to his wife.
  language: English
  quote_policy: summarized
