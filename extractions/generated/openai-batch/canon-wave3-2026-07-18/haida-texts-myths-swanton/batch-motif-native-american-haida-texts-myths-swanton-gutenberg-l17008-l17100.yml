canonical_text:
  quote: ''
  summary: The narrator recounts repeated fighting with the Town-of-Tcꜝā′ał people,
    help from allied Middle-town people and Earth-eaters, wounds and compensation
    payments, renewed attacks, contact with the Iron people, relocation to Nass inlet
    and Port Simpson, and trade in furs, guns, ammunition, tobacco, cedar bark, blankets,
    canoes, and slaves. An editorial note frames the account as an example of conflicts
    among peoples of this Northwest Coast area.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator's group sang a song four times before going out to fight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator's group shot at four houses while Town-of-Tcꜝā′ał people drew
    up around them from the woods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator's gun became hot during the shooting, and he put it into water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nᴀñ-gut-tcî′ng̣a stood on top of his house holding a large horn through which
    he talked to the fighters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator's group waved something white that Nᴀñ-gut-tcî′ng̣a could see;
    he understood it to mean none of them had been killed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Middle-town people and Earth-eaters came to fight, broke through the opposing
    group, told the narrator's group to go home, and fought in their places.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator discovered that the back of his thigh was torn and then became
    faint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Further fighting continued for five nights, with many Town-of-Tcꜝā′ał people
    killed or wounded, and allies again relieved the narrator's group.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The opposing group shot intermittently at the house for more than a month
    before Djig̣ē′g̣as announced that they were gone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nᴀñ-gut-tcî′ng̣a gave the Earth-eaters eight slaves as blood payment for four
    killed persons and also gave them three hundred and twenty blankets.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Qołgî′t received a young slave because of sorrow over his canoe, and the canoe
    was repaired.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After renewed fighting, a ship of the Iron people arrived; Nᴀñ-gut-tcî′ng̣a
    told them about himself, and they left ammunition.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Iron people later took Nᴀñ-gut-tcî′ng̣a with them and also took the narrator
    because Nᴀñ-gut-tcî′ng̣a did not want to go without him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At Nass inlet, two vessels were present, a house was stockaded, cedar bark
    was obtained for roofing, and a warehouse was completed.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Iron people bought furs, and the narrator collected dropped tobacco into
    a sack for his father.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: A gun was priced by standing it on end and piling beaver skins beside it until
    they reached the muzzle; land-otter skins were exchanged for ammunition and bullets.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: After three years the settlement was considered too cold and the Iron people
    removed to Port Simpson, where the narrator lived with them for seven years.
  category: sequence
  evidence_refs:
  - ev:13
