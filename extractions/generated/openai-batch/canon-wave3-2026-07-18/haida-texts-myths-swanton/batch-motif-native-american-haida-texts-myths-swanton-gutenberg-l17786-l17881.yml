canonical_text:
  quote: They used helmets, war coats, and gorgets.
  summary: A conflict between closely intermarried Haida family groups begins over
    a contested inherited knife, develops into an armed battle with deaths and retreat,
    includes a chief’s mountain lament, the use of supernatural medicine on a necklace
    and mirror, a hostile marriage-seeking visit, retaliatory killings, and eventual
    peace.
  language: English
  quote_policy: quoted
