candidate_motifs:
- id: motif:1
  label: contested inherited object leading to formal combat
  taxonomy_refs: []
  basis: A large knife formerly owned by a dead father is won and withheld; the quarrel
    over it precedes an announced day for fighting.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this as a cause of conflict, not as a supernatural
    or cosmological object motif.
- id: motif:2
  label: volunteer body-protector killed with leader
  taxonomy_refs: []
  basis: Sounding-property volunteers to serve as Koa′gians’s fighting skirt, protects
    him in battle, and is found dead when Koa′gians is killed.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not state ritual sacrifice; the role is described in
    battle terms.
- id: motif:3
  label: defeated chief’s mountain lament for lost property
  taxonomy_refs: []
  basis: After defeat, South-east is carried up the mountain and weeps and sings for
    his beaver dish while the group retreats.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The emotional and musical elements are explicit, but wider symbolic meaning
    is not stated in the passage.
- id: motif:4
  label: supernatural medicine transmitted through adornment and mirror
  taxonomy_refs: []
  basis: Women gather supernatural medicine, apply it to a charmed necklace and looking-glass,
    and the recipients immediately feel its effects when wearing the charm or looking
    into the mirror.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage reports effects but does not explain the medicine’s nature
    or mechanism.
- id: motif:5
  label: dangerous wife-seeking expedition after charm use
  taxonomy_refs: []
  basis: After the charm and mirror take effect, Wā′nᴀg̣ᴀn and Tcinxā′da leave with
    many others to get wives; near Mountain-fort the encounter becomes hostile and
    the party escapes by canoe.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The exact causal relation between the medicine and the wife-seeking expedition
    is sequentially suggested but not fully explained.
- id: motif:6
  label: retaliatory violence followed by peace between closely intermarried families
  taxonomy_refs: []
  basis: A brother-in-law’s grievance over a killed nephew leads to return and killing
    at the fort, after which the parties make peace; the passage notes the families
    were closely connected by intermarriage.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a social-conflict pattern within the passage rather than a broad
    cross-cultural comparison.
