candidate_motifs:
- id: motif:1
  label: Reciprocal animal provisioning after feeding
  taxonomy_refs:
  - sacred_exchange
  basis: The boy feeds salmon to an eagle despite leaving with an empty canoe, and
    later an eagle is associated with increasingly abundant food left for him.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not explicitly state a verbal pact or sacred status;
    reciprocity is inferred from the sequence of feeding and later aid.
- id: motif:2
  label: Abandoned dependent sustained by concealed aid
  taxonomy_refs: []
  basis: The boy and his mother are abandoned by kin during hunger, but hidden food
    and a small canoe left by the youngest uncle’s household allow them to continue.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The source itself notes inconsistencies between the two parts of the tale.
- id: motif:3
  label: Fortune reversal through hidden or animal-supplied food
  taxonomy_refs: []
  basis: After being refused food, the boy obtains increasingly abundant fish and
    whales, while the uncles who abandoned him later seek his favor.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: No explicit supernatural explanation is given beyond the eagle’s repeated
    association with the food.
- id: motif:4
  label: Marriage reward for earlier food aid
  taxonomy_refs:
  - sacred_exchange
  basis: The boy refuses the prepared daughters of the other uncles and marries the
    lame daughter of the youngest uncle because she had left food for him.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage earlier attributes the hidden-food instruction to the youngest
