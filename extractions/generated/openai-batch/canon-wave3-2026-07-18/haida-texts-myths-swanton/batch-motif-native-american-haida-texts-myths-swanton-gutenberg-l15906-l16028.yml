canonical_text:
  quote: ''
  summary: An unnamed boy feeds salmon to an eagle and is later mocked and abandoned
    by his uncles during hunger. A helper from the youngest uncle’s household leaves
    him hidden food, and a young eagle later supplies increasing amounts of salmon,
    porpoise, and whale. The uncles seek his favor after learning of his prosperity;
    he marries the lame daughter of the youngest uncle, identified in the passage
    as the one who had left food for him, and refuses the others. A note says the
    story is associated with a Tsimshian family and has inconsistencies from multiple
    sources. The following fragment begins a tale in which Qō′łkꜝē is capsized by
    wind, reaches shore with his dog, builds shelter, and makes fire.
  language: English
  quote_policy: summarized
