canonical_text:
  quote: ''
  summary: The passage recounts Cloud-watcher as a shaman through whom supernatural
    powers speak, including a salmon power that is followed by the arrival of salmon.
    Cloud-watcher descends into water while the people sing, acts like a spawning
    dog salmon, and returns dry; afterward salmon are abundant. Later a power speaks
    through him in a tobacco-begging episode. The passage also describes sickness
    at Sea-grass Town, an old woman’s appeal to a heavenly power, and the shamanic
    career of Waters, including weapon and rattle regalia, an eagle prophecy, Moon-related
    names, self-multiplication, and cedar-bark fire dances used to assess sickness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Tlingit supernatural power and later the son of the chief of the salmon
    spoke through Cloud-watcher; at that time there were no salmon on the island,
    and then salmon came like a strong wind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cloud-watcher went into a deep place and used shamanic articles including
    moose-skin blankets with salmon pictures, a dance hat, a dancing skirt, and puffin-beak
    rattles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chiefs initially refused to let Cloud-watcher go down, saying he would
    swim away forever, but they allowed it after saying the salmon would be lost and
    sent a truthful person with him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cloud-watcher instructed the people not to stop singing the spirit song until
    he returned; after dancing around the fire, he went down into the deep place,
    followed by Lā′ma.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the creek Cloud-watcher lay still like a dog salmon; Lā′ma held the lower
    edge of his moose-skin blanket; Cloud-watcher jerked four times like a dog salmon
    sending out eggs and then stood up dry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Cloud-watcher stood up, many dog salmon were in the creek and nearly
    surrounded the island coasts; the passage contrasts this with earlier scarcity
    of salmon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cloud-watcher had the people get a large drum from the east side of a big
    cedar, and they used to hang it up.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sᴀqaiyū′ł spoke through Cloud-watcher; when the voice came through him he
    ran into the sea, begged around town, and received five tobacco plugs after Djat-gitcꜝî′ñgaga
    understood his words.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During sickness at Sea-grass Town, an old woman went to the end of town, raised
    her hands, and wanted Power-of-the-shining-heavens to look upon her; those above
    saw what she did.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Waters, a Town-of-Djī′gua man, became a shaman; a large dancing house was
    built for him, he danced without giving his name, and he used left-handed weapon
    placement with a club, war knife, and grizzly bear head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Sea-grass Town, Waters told the people where an eagle was sitting and foretold
    two blue feathers on either side of its tail; after the eagle was obtained, he
    struck the roof and announced two names identified with the Moon’s youngest grandchild.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: While gambling at Metlakahtla, Waters became angry at one opposite him and,
    when he stood up, became ten, causing his elder brothers to fear him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Because mercy was shown to the woman who raised her hands, the Moon’s son
    came down to Sea-grass Town; He-with-only-one-fin identified him as Ha′ostī and
    advised him to stop using feared weapons and use good rattles.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: After taking up puffin-beak, large, and chief’s rattles, he began to act in
    two different ways and used spirit songs including a question about the great
    supernatural power.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: He wore fine cedar bark around his neck, held it over the fire while acting
    as shaman, and burning coals flew around; dancers wore cedar bark with small trees
    stuck into head ornaments and sang for the great power to come.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: When the dancers came in, he watched from the rear of the house to see whether
    anyone was sick; if someone smiled a little, he said the people had untroubled
    minds.
  category: action
  evidence_refs:
  - ev:11
