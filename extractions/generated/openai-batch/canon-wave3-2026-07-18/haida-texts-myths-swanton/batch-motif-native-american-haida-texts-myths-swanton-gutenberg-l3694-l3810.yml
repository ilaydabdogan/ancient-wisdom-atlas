canonical_text:
  quote: ''
  summary: The English portion closes a Haida narrative with a visit to Heaven-holder,
    a promise by the Head-of-creek woman that the Food-giving-town people will become
    numerous again, the making and inheritance of a named cedar fish trap, and a statement
    that the Raven clan owns thunder as a death sign. An editorial note explains the
    story as mythic or half-mythic episodes about an old Haida family, its territory,
    Skidegate creek, Food-giving-town, and surviving members. The passage then continues
    with Haida-language text headed DAIYŪ′-AŁ-LĀ′NAS.
  language: English; Haida
  quote_policy: summarized
