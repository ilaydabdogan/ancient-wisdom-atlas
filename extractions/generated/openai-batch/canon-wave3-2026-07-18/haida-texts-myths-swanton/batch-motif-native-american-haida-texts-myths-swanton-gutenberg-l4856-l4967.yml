candidate_motifs:
- id: motif:1
  label: Retaliatory war expedition after destruction of a group
  taxonomy_refs: []
  basis: The passage links the Tlingit destruction of Those-born-at-Stasaos to subsequent
    Haida canoes going to war.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a historical-war narrative pattern in the passage, not necessarily
    a mythic motif family in the supplied taxonomy.
- id: motif:2
  label: Feigning peaceful visitation before attack
  taxonomy_refs: []
  basis: The party builds a fire, acts as visitors, denies being warriors, and says
    they came to buy food before pursuing and attacking the Tlingit canoe.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents this as tactical deception; no broader mythological
    comparison is stated.
- id: motif:3
  label: Perilous sea crossing with damaged canoe and restored morale
  taxonomy_refs: []
  basis: A great wind splits the canoe, it is repaired with staples and ropes, and
    the narrator encourages frightened companions until they stop weeping.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The episode is maritime and heroic in tone, but the passage does not link
    it to a named traditional motif.
- id: motif:4
  label: Public shame or taunt provoking renewed action
  taxonomy_refs: []
  basis: After the party returns with fewer gains than other warriors, shame and a
    woman’s taunt lead immediately to new war preparations.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The social-pressure pattern is explicit, but no external comparison is
    provided in the passage.
- id: motif:5
  label: Misrecognition through language performance
  taxonomy_refs: []
  basis: The canoe owner and companions speak Tlingit; after the attack the narrator
    recognizes them as Haida/Kaigani and says they would not have been touched had
    their identity been known.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The basis is linguistic and social rather than supernatural.
- id: motif:6
  label: Night raid on sleepers around a fire
  taxonomy_refs: []
  basis: The attackers approach a camp at night, peer over a log, find people asleep
    around a large fire, and attack just before daybreak.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a raid pattern; the passage does not claim ritual or mythic symbolism
    for the fire.
- id: motif:7
  label: Invocation of a supernatural helper during weather hardship
  taxonomy_refs: []
  basis: A slave calls for his uncle’s supernatural helper because rain chills him;
    the rain then stops and a north wind begins.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage places the invocation and weather change in sequence, but
    does not explicitly explain causation beyond the slave’s reason for calling.
- id: motif:8
  label: Return from expedition marked by war songs
  taxonomy_refs:
  - return
  basis: After crossing back and reaching the islands, the party sings war songs before
    continuing to Tcꜝā′ał.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The supplied taxonomy ref is broad; the passage gives a literal return
    and singing but no extended return-myth structure.
