canonical_text:
  quote: ''
  summary: 'A first-person account describes retaliatory Haida war expeditions against
    Tlingit and Klawak people: canoes depart after a prior destruction, a party uses
    a beach fire and peaceful speech to draw in Tlingit, pursues and attacks them,
    survives a dangerous storm crossing, is shamed by the success of other warriors,
    raids again, mistakenly attacks Haida/Kaigani people speaking Tlingit, attacks
    a Klawak camp at night, takes slaves and property, endures wind and rain, invokes
    a supernatural helper through a slave, crosses back, and sings war songs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tlingit are said to have destroyed Those-born-at-Stasaos in Skidegate
    channel, after which canoes from Gū′dᴀl went to war.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other members of the expedition plundered, destroyed a fort, and obtained
    many slaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator’s party landed on a beach, built a large fire, acted as visitors,
    and denied being warriors when questioned by seven Tlingit in a canoe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the Tlingit left in fright, the narrator’s group pursued, shot at them,
    and upset their canoe near an island.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During a night crossing, a great wind arose, the canoe split, and the narrator
    fastened it with staples and ropes while some aboard cried from fear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At daybreak near Paint mountain, the narrator exhorted his sons-in-law, called
    chiefs’ nephews, to strengthen their minds; they stopped weeping.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After returning to Gū′dᴀl and learning other warriors had taken thirty-eight
    slaves, the party felt shame and immediately prepared for another war expedition
    after a woman’s taunt was reported.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the second expedition, four canoes crossed from North island against the
    Klawak people and later hid near an inlet where dog salmon were present.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A canoe owner with his wife and two slaves passed near the hidden party, spoke
    Tlingit with those present, and had a fire at the foot of a nearby tree.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The canoe owner was shot; after the attackers heard Kaigani speech, the narrator
    said that, if they had known the people were Haida, they would not have touched
    them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wife said other people who had come with them had a fire on the other
    side and were Klawak people.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: At night the raiders approached a large fire, looked over a log, found people
    asleep around it, and attacked just before daybreak.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The raiders took property, took six slaves, and killed many people at the
    camp.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: On the return, a sudden south wind with rain forced the party to throw some
    property overboard and go back before finding a landing place.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A slave in the canoe called for his uncle’s supernatural helper because rain
    chilled him; afterward the rain stopped and a north wind began.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The party crossed Dixon entrance, reached the islands, sang war songs, and
    later came to Tcꜝā′ał.
  category: action
  evidence_refs:
  - ev:12
