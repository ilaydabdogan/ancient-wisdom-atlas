canonical_text:
  quote: ''
  summary: A war narrative recounts Kloo/Chicken-hawk preparations, a redirected expedition
    toward Tsimshian country, plundering, fighting near Metlakahtla, capture of persons
    and slaves, return songs, a later raid in which wives are taken, Tsimshian/Kîtkatla
    response, ceremonial exchange of captives through dancing and back-striking, and
    compensation with slaves, sea otters, property, and guns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kloo/Chicken-hawk war party prepared canoes for war, delayed departure
    because of high tides, and started when the tide was high.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skedans people reported a fight caused by Bufflehead throwing dried halibut
    at Î′ngîlîn and the killing of a Town-of-Djī′gua woman; after hearing this, the
    war party went toward the Tsimshian instead of continuing as planned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Along the route, the war party took dried salmon from a slave, salmon bundles
    from a canoe, and property from people living at Da′x̣ua.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near Metlakahtla, the war party pulled a canoe into the woods, came out to
    fight, and a Tsimshian shot a Haida.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some Tsimshian fled by canoe; the Kloo fighters chased them ashore and seized
    them, and Djix̣ia′al seized a knife-bearing Tsimshian man after the man turned
    back when his wife cried out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nî′swas and people of his town sat unseen by the Kloo people on an island
    with one tree near the place where the Kloo people had come out.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Skidegate man friendly with a Kloo man ran into a house and warned that
    people from High-point town were coming to fight; the Kloo people later returned
    to Chicken-hawk town singing a high song with ten slaves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A later short raid into Kitamat brought in two slaves, and by trading them
    the raider built a house named “Î′ngîlîn-house.”
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: On a later raid near Metlakahtla, Gîtku′n and Gitagᴀ′ñgiasʟas encountered
    five people gathering devilfish; the warriors took the wife of Nîsʟā′ganūs, the
    wife of his nephew, and another woman, whom the account says they lay with in
    the woods and then released.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nîsʟā′ganūs’s nephew shot at the departing raiders many times, but the gunpowder
    only flashed; the raiders pulled out of range and later sang a high song at Kloo.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Tsimshian came in a crowd to fight for the captured woman; Häl sent a
    canoe to talk, said he would come for her, and later many Kîtkatla people arrived
    by canoe at Skedans.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Häl danced and sent two women to the Kloo people by striking them on the back;
    later Gîtku′n danced, and the wife of Nîsʟā′ganūs and another woman were likewise
    struck on the back and sent to the other side in exchange.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: After the exchange, Kꜝuia′ns and Kꜝadja′-i paid for their sisters with slaves,
    sea otters, property, and guns.
  category: action
  evidence_refs:
  - ev:13
