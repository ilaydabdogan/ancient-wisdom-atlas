canonical_text:
  quote: ''
  summary: Raven tricks Eagle and carries away water, whose scattering forms salmon
    streams and lakes. Raven then travels, takes the form of a conifer needle in water,
    is connected with the birth of a child who obtains the moon/light and flies away
    with it. Raven tricks Cormorant, makes eulachon from his tongue, deceives Qadadjâ′n,
    and distributes eulachon. He tricks Fern-woman to obtain armpit hair, escapes
    her sons, exchanges light with fishers, consults a dog about moons, and places
    fragmented moon and sun in the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven directs Eagle to put hemlock branch tips on the fire, then causes a
    clump of branches to fall and frightens Eagle away from his water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven puts on feather clothing and flies away with Eagle's basket; Eagle also
    puts on feather clothing and pursues him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Water is jerked out of the basket during the pursuit, and the passage says
    salmon streams were formed as this happened.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven continues scattering water out of his mouth and empties remaining water
    at locations including an island and the head of Skeena.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Raven travels northward, takes the form of a conifer needle, enters a water
    hole behind a chief's house, and floats there awaiting the chief's daughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief's daughter dips water; Raven remains in the water and tells her
    to drink it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the water-drinking episode the chief's daughter becomes pregnant and
    gives birth to a child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The child cries for the moon; after boxes are opened, a round thing is given
    to it and light fills the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The child cries for the smoke hole to be opened wider and then flies away
    with the round thing; Marten and Tā′ʟᴀtg̣ā′dᴀla pursue but give up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Raven puts the moon into his armpit, makes Sea-gull and Cormorant quarrel,
    and bites off Cormorant's tongue after prompting him to brace himself with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Raven makes Cormorant's tongue into an eulachon, uses slime on his cape and
    canoe, and deceives Qadadjâ′n into producing eulachon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Raven distributes eulachon along the mainland and in Nass inlet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Raven offers eulachon to Fern-woman, says his canoe is cracking, pulls away,
    and pulls out hair from under her armpit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Fern-woman calls her sons, who throw objects with sticks and break ten of
    Raven's paddles; Raven is saved when a stone goes through the knot hole in the
    remaining paddle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Raven offers light to fishers in Nass in exchange for fish; they identify
    him as one who always plays tricks, but after he lets a small part shine they
    empty their canoe in front of him several times.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Raven asks a dog whether to make four moons; the dog rejects four and wants
    six, and Raven makes matters as the dog says.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Raven bites off and chews part of the moon, throws it into the sky as fragments
    for future people to see, then breaks the moon into halves and throws half of
    it and the sun into the air.
  category: action
  evidence_refs:
  - ev:10
