candidate_motifs:
- id: motif:1
  label: theft of water resulting in salmon streams and lakes
  taxonomy_refs:
  - sacred_theft
  - culture_hero
  basis: Raven takes Eagle's water by trickery; spilled and scattered water forms
    salmon streams and other named waters.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage narrates theft and origin of waters, but it does not itself
    use the term sacred.
- id: motif:2
  label: shape-changing entry into water leading to miraculous child and moon theft
  taxonomy_refs:
  - shapeshifter
  - miraculous_child
  - sacred_theft
  basis: Raven becomes a conifer needle in water; the chief's daughter drinks, becomes
    pregnant, and gives birth to a child who obtains and flies away with the moon/light.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The text's pronoun sequence links the child episode to Raven, but the
    passage does not explicitly state a formal identity explanation.
- id: motif:3
  label: trickster creation and distribution of eulachon
  taxonomy_refs:
  - trickster_boundary
  - culture_hero
  basis: Raven tricks Cormorant, makes his tongue into an eulachon, deceives Qadadjâ′n,
    and distributes eulachon where they now are.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents an origin distribution for eulachon; broader cultural
    function should be reviewed by a human specialist.
- id: motif:4
  label: deceptive acquisition of body hair followed by projectile escape
  taxonomy_refs:
  - trickster_boundary
  basis: Raven tricks Fern-woman while giving eulachon, pulls out her armpit hair,
    and escapes her sons' projectiles through the knot-hole paddle.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The subsequent significance of the armpit hair is not explained within
    this passage.
- id: motif:5
  label: trickster exchange of light for fish
  taxonomy_refs:
  - sacred_exchange
  - trickster_boundary
  basis: Raven offers light for fish; the fishers recognize him as a trickster, then
    give fish after he briefly shows light.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The exchange is brief and may be deceptive; the passage does not describe
    a completed transfer of permanent light to the fishers.
- id: motif:6
  label: placing fragmented moon and sun for future people
  taxonomy_refs:
  - culture_hero
  basis: Raven declares future people will see the moon fragments forever and throws
    moon pieces and the sun into the sky or air.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives the placement action but does not explain a full cosmology
    of sun and moon.
