canonical_text:
  quote: ''
  summary: One surviving Eagle reports to an old woman. She takes on an old Eagle
    form, flies to sea, and lifts the Eagles from the water after the clam had drowned
    them. A young man puts on eagle skin, flies to his uncle’s village, and drowns
    the villagers in revenge. Later he becomes homesick, receives the skin of the
    bird tʼᴇn, returns to the deserted village, and is caught by his two younger sisters
    with a noose made from their hair.
  language: English
  quote_policy: summarized
