- id: obs:1
  text: Only one Eagle remains and returns home to tell the old woman what happened.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman says “Ngai, ngai, ngai,” sharpens her nails, puts on an old
    ragged skin, and is described as an old Eagle missing many feathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old Eagle flies to sea, sees one Eagle’s wings above the water, tries
    four times to lift the Eagle, hears a sound under water, then lifts all the Eagles
    and takes them home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young man resolves to take revenge on the people who had killed him, puts
    on eagle skin, flies to his uncle’s village, and alights on the top of a tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The villagers try to shoot the Eagle because they want its feathers for their
    arrows, but they cannot hit him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the uncle’s son tries to shoot, the young man swoops down, grasps him,
