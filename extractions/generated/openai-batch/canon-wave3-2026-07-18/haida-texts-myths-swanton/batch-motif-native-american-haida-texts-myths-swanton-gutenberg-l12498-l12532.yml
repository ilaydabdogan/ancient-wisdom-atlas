  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young man raises all the men of the village, carries them out to sea,
    drops them into the water, and they drown.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: After living there for many years, the young man becomes homesick, does not
    laugh, and stays at home.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The old woman asks her daughter why her husband is sad, and the wife says
    he wants to return to his uncle’s village.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The old woman gives the young man the skin of the bird tʼᴇn; he puts it on
    and flies back.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:11
  text: The returned village is deserted because he had killed all the people; only
    his two younger sisters remain, having been hidden during the earlier visit.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: The two younger sisters are crying, see the bird, make a noose from their
