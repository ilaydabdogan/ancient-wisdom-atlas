  summary: The passage contains transcribed Haida song fragments addressing a chief,
    followed by the English account and opening Haida text of “Fight at the town of
    Da′x̣ua.” In the story, a disputed canoe purchase leads Yū′lᴀñ to smash the canoe
    before dawn, a fight between factions, Yū′lᴀñ’s blinding, victory by the Seaward-Sqoā′ładas,
    and Sg̣agᴀ′ño’s family fleeing and later acquiring Pebble-town.
  language: English with Haida transcription
  quote_policy: summarized
