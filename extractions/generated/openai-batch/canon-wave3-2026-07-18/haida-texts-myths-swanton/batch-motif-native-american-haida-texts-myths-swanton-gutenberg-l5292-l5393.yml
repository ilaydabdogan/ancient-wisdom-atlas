canonical_text:
  quote: ''
  summary: Raven manipulates a fire and obtains food, then takes a fish trap, a house,
    and a lake, escaping their owners by moving through trees. He unrolls the lake
    elsewhere and keeps the fish trap and house to teach people. He later retrieves
    a water-dwelling woman-like creature using a wild pea as a canoe, sets her ashore
    with a house, encounters a seal-hunting person with impaired sight, and then meets
    Eagle, whose water-tight basket Raven tries unsuccessfully to obtain through observation
    and substitution with root sap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven lights a fire, cooks and eats a salmon, puts the fire out, cries beside
    it, and tells arriving persons that he is crying because the fire went out some
    time earlier.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The arriving persons relight the fire, bring out a salmon from behind screens,
    prepare and eat salmon, cranberries, and the inside parts of a mountain goat,
    then leave the next morning with gambling-stick bags.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the persons leave, Raven eats salmon, cranberries, and mountain-goat
    inside parts, pulls up the fish trap, flattens it with the house, rolls the lake
    up with them, places everything in his armpit, and climbs a tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The owners find the house and lake gone, see Raven in a tree with their property,
    gnaw at successive trees with their teeth, and eventually give up; after having
    no place for a long time they find another lake and settle there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Raven unrolls the lake in a large open place but keeps the fish trap and house
    in order to teach Seaward and Shoreward people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Near the water at the mouth of Lalgī′mi, Raven sees part of a creature looking
    like a woman; she repeatedly sinks when he approaches in ordinary canoes, but
    does not sink when he comes in an opened wild pea called “Raven’s canoe.”
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Raven takes the woman-like creature into the canoe, brings her ashore, removes
    her dancing leggings and dancing skirt, wipes her, covers her with a tcā′łg̣a
    as a blanket, carries her landward, sets her ashore at the west arm of Cumshewa
    inlet, gives her the house, and keeps the fish trap in his armpit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A person with hair gathered in a pointed tuft travels by canoe with many hair
    seals, spears a seal between the canoes, says his poor eyesight came from a clam
    spitting on him, pulls a blood clot from Raven’s eye and puts it back because
    Raven used bad words; Raven treats him well afterward but does not get what he
    wants.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Raven tells Eagle that he has been drinking sea water and suggests Eagle do
    the same; both defecate after drinking, and Eagle later reveals a water-tight
    basket under his armpit from which he drinks.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Raven watches Eagle’s basket, intends to take it but lacks an opportunity,
    then puts root sap in his hat, drinks it, and offers it to Eagle, who notices
    that it smells like pitch; Raven explains that the water hole was in clay.
  category: sequence
  evidence_refs:
  - ev:10
