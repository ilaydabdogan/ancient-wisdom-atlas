canonical_text:
  quote: ''
  summary: An observer sees a dog’s ears intermittently above the water near named
    coastal points. Waves carry the dog along the west coast and out to sea. The dog
    attempts to climb ashore at a steep place near Qꜝā′łgwa-i, leaving claw marks
    on the rocks; the place is called “Dog-slipping-back.” The waves carry it away
    again; when it is very tired, The-one-in-the-sea calls it in, and it settles down
    in his house. A note refers readers to related stories and to the story of How
    one of the Stasa′os-lā′nas became wealthy.
  language: English
