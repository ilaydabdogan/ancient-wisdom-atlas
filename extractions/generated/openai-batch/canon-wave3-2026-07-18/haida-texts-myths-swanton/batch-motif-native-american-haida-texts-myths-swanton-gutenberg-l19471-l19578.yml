candidate_motifs:
- id: motif:1
  label: exchange or ransom ending hostilities
  taxonomy_refs: []
  basis: A captured child is exchanged for a Skidegate man and property, after which
    the people become friends and cease fighting.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents the event as social and political peace-making; it
    does not mark the exchange as sacred.
- id: motif:2
  label: ritual preparation before war
  taxonomy_refs: []
  basis: The war party keeps war rules, drinks sea water, and undergoes shamanic performances
    before proceeding.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: No broader taxonomy match is asserted beyond the literal pattern of war
    ritual.
- id: motif:3
  label: shamanic choice of auspicious time for action
  taxonomy_refs: []
  basis: G̣ᴀ′ndox’s-father asks the war people to choose between named options, the
    party chooses Days, and later refrains from action while waiting for the appointed
    day.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: The meanings of Town-singers and Days are not explained in the passage.
- id: motif:4
  label: spirit or power entering a shaman during war ritual
  taxonomy_refs: []
  basis: The passage says that after another power goes out of G̣ᴀ′ndox’s-father,
    Łᴀ′gua goes in, followed by a ritual involving the shaman’s hair.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage names the power but does not explain its identity or function.
- id: motif:5
  label: omen of death before battle
  taxonomy_refs: []
  basis: An unnamed shaman rolls before eight fires and cries out in pain at the last
    one because they are going to leave one dead.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives an explanatory statement but does not explicitly call
    the action an omen.
- id: motif:6
  label: stealth raid and mistaken targeting of allies
  taxonomy_refs: []
  basis: The party approaches the fort stealthily, then rushes into a house and mistakenly
    tries to take one another as slaves before recognizing the error.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: This is a narrative action pattern rather than a supplied mythological
    motif family.
