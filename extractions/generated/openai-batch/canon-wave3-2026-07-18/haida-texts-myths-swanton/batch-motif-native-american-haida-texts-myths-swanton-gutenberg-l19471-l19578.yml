canonical_text:
  quote: ''
  summary: 'An opening notice recounts hunger among the Bellabella, an invitation
    to eat halibut, an exchange involving a captured child, a Skidegate man, and property,
    and the cessation of fighting with the Bellabella. The main narrative describes
    a war expedition against the Gîtî′sda: departure in eight canoes, hospitality
    from Lawā′y, ritual war practices involving drinking sea water and shamanic performances,
    concealment while enemy canoes pass, a prior episode in which a woman discovers
    war canoes and her husband is killed, stealth near a fort, reconnaissance, and
    a confused house raid.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bellabella are described as hungry and are invited to eat halibut after
    a long fast.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The uncle of a captured child gives a Skidegate man and much property in exchange,
    after which friendship is made and fighting with the Bellabella ceases.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The expedition starts after preparation and includes Those-born-at-Skedans,
    the Town-of-Djī′gua people, and Those-born-at-Qꜝā′dᴀsg̣o; they travel in eight
    canoes and spend a night on the open sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near Gîtgia′gᴀs, four canoes go ahead, gun noise is heard, and Lawā′y, a Kitkatla
    man who also calls himself an Eagle, arrives in a canoe and asks what war is taking
    place.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Lawā′y invites the party, including chief Gîtku′n, gives them much food, and
    they stay overnight before leaving the next day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Point Qᴀ′lg̣a-i the party begins to keep war rules, drinks sea water, and
    has three shamans.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: G̣ᴀ′ndox’s-father performs and asks the war people to choose between Town-singers
    and Days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The war people carry G̣ᴀ′ndox’s-father on their paddles; after another power
    leaves him, Łᴀ′gua enters, and the warriors pull his long hair until few hairs
    remain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another shaman rolls in front of eight fires standing in a line and cries
    out in pain at the last fire because they are going to leave one dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At another daybreak the party again drinks sea water while Gᴀ′ndox’s-father
    performs; when asked to choose, they choose Days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Gᴀ′ndox’s-father tells the war people to go into the woods because his eye
    twitches; seven Gîtî′sda canoes pass in front of them, but the war party does
    not act because they are waiting for the appointed day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In a previous expedition, a woman picking berries discovers war canoes, runs
    away, and six men chase her; her husband, who holds a gun in a canoe, is shot
    and killed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The party later camps where the man had been shot, sees a white canoe sail
    pass in the inlet, and proceeds with Lda′ogwañ acting as pilot.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: At night the party approaches the side opposite the fort, pulls off two anchored
    canoes, and smashes them while the fort people are gathering salal-berries.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Two reconnoiterers return and report many salmon hooks stuck into the ground
    at the water’s edge.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The war party crosses a salmon creek in a crowd, friends keep together, two
    leaders give commands, and the people sit down when told.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: A crackling sound in the woods causes the group to lie on the ground.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: When the signal “hūk” is given, they rush into a house, mistakenly try to
    take one another as slaves, discover the mistake, and go out; Gia′gudjañ’s companions
    arrive as another canoe goes after berry-pickers.
  category: sequence
  evidence_refs:
  - ev:11
