canonical_text:
  quote: ''
  summary: 'An editorial note describes the story as a compound of three distinct
    tales: a principal tale about a person abandoned to die who receives supernatural
    help and becomes a great chief; a second tale about a man who married a grizzly
    bear, associated with the origin of secret societies and identified as a favorite
    Tsimshian story; and a concluding Haida section explaining how the woodpecker
    obtained brilliant plumage.'
