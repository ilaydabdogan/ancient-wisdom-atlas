canonical_text:
  quote: ''
  summary: In the Big-tail passage, Mouse-woman adopts Big-tail; supernatural powers
    try him and he becomes a shaman. He observes ritual regulations, receives a supernatural
    name, goes down to the house of Supernatural-being-at-whose-voice-the-ravens-sit-on-the-sea,
    negotiates over dance hats and a headdress, learns their use, and correctly locates
    floating sea otters and whales. Later he hears a drum, goes down again, and is
    invited to observe a feast for supernatural beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mouse-woman adopts Big-tail; after she has lived at Skidegate for a while,
    supernatural powers begin to try him, and he becomes a real shaman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Big-tail prepares to dance on the surface of the ocean while going after whales,
    and regulations are observed for five nights; an uneven number of nights is preferred
    so his supernatural power will not be spoiled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Big-tail asks what kind of supernatural being he is; an old man names him
    Supernatural-being-at-whose-voice-the-ravens-sit-on-the-sea, after which Big-tail
    runs around the fire four times and identifies himself with that being.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The being speaking through Big-tail names places where whales float; a person
    sent there sees only coots, while Big-tail still sees a whale there and becomes
    angry because the spirit is fooling him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Big-tail puts tobacco and calcined shells into his mouth, goes down to the
    house of Supernatural-being-at-whose-voice-the-ravens-sit-on-the-sea, brings the
    being's box, and sits with him at opposite ends.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The supernatural being takes out dance hats, including one carved with sea
    gulls; Big-tail asks what will happen when each is sung for, hears that there
    will be two whales, and refuses them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The supernatural being becomes angry and threatens to destroy Big-tail with
    a strong current of water; Big-tail answers defiantly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The being takes out a chief's dancing headdress carved with a hawk; when told
    it will bring ten whales, Big-tail still refuses until two handsome persons who
    can sing are given along with the headdress.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the supernatural being's house Big-tail learns how to tie the headdress
    strings and place flicker feathers; afterward he imitates the headdress, dances
    with it, and correctly announces where a sea otter is floating.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sea otters continue to be found in this way; Big-tail says that if he and
    his mother are given some, he will always have them found floating, and afterward
    whales are found at places he had named.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After acting as a shaman for a while, Big-tail wonders why a drum sounds in
    the supernatural being's house, chews tobacco, goes down in sleep, wakes, calls
    his wife Middle to help him sit up, and reports that a feast is being prepared.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Later Big-tail goes down again, enters the supernatural being's door, and
    is invited to sit near him and look on at a feast for supernatural beings.
  category: sequence
  evidence_refs:
  - ev:12
