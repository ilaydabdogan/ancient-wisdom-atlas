canonical_text:
  quote: ''
  summary: 'The passage recounts episodes connected with Those-born-at-Skedans: deaths
    and accidents linked to claims over sea, land, inlets, and islands; copper plates
    given for inlets; food sent through fire to drowned persons; Gîtko′na’s encounter
    with a small marked killer whale and the pursuing killer whale host; shamanic
    warnings and a four-year avoidance of the ocean; and Gîtko′na’s later disappearance
    after following a white animal into fog.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman named Woman-whose-feet-make-a-thunderous-noise owned a knife that
    shut up, died, and was said to have been carried off because of the knife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The knife was said to belong to Pestilence; feathers were put on it, and it
    was allowed to sink into the water in the middle of the inlet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the sinking of the knife, the people are said to have owned the sea
    water.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tꜝā′giao was attacked by a bear while hunting with dogs; after his body was
    laid away, ownership of the sea, land, and inlets is stated again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Copper plates were given by the Common-food-steamers and by a Town-of-Cumshewa
    woman for inlets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Skî′ltꜝakîñañ died after slipping into a crevice while following his dogs;
