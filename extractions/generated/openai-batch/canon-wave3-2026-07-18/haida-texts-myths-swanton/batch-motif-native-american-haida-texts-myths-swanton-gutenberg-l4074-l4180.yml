candidate_motifs:
- id: motif:1
  label: Dangerous object linked to pestilence and water claim
  taxonomy_refs: []
  basis: The knife is associated with Pestilence, treated ritually with feathers,
    sunk into the inlet, and followed by a statement that the people owned the sea
    water.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states the sequence but does not explain the causal or ritual
    logic beyond the knife and the ownership claim.
- id: motif:2
  label: Deaths or disappearances followed by territorial ownership claims
  taxonomy_refs: []
  basis: Multiple deaths or disappearances—knife owner, bear attack, crevice death,
    drowning, and Gîtko′na’s disappearance—are followed by statements of ownership
    or claims over sea, land, inlets, or islands.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:12
  confidence: high
  cautions: The extraction identifies a repeated narrative pattern within the passage,
    not an external comparative motif.
- id: motif:3
  label: Copper exchanged for inlet rights
  taxonomy_refs:
  - sacred_exchange
  basis: Copper plates are given or put out by named groups or a woman for inlets,
    in the context of claims to named waters and places.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The taxonomy label 'sacred_exchange' is plausible because valuable copper
    is exchanged for place-rights, but the passage does not explicitly call the exchange
    sacred.
- id: motif:4
  label: Food sent to the drowned through fire
  taxonomy_refs:
  - sacred_exchange
  basis: After Flowing-property and the Witch woman drown, the people send food to
    them through the fire before making claims to sea and islands.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage reports the action but gives no explicit explanation of its
    ritual mechanism or afterlife assumptions.
- id: motif:5
  label: Offended supernatural sea being retaliates through animal host
  taxonomy_refs:
  - divine_judgment
  basis: Gîtko′na spears a marked killer whale later identified as the son of Corner-of-mouth;
    a mass of killer whales surrounds him, and shamans say supernatural beings are
    considering how to make him die.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The beings are called supernatural, but the passage does not frame the
    event in a general doctrine of divine judgment.
- id: motif:6
  label: Offering appeases dangerous supernatural animals
  taxonomy_refs:
  - sacred_exchange
  basis: Tobacco and calcined shells are laid down for the killer whales; after a
    large creature accepts them, all the killer whales vanish into the ocean.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage strongly supports appeasement by offering, though the exact
    identity of the accepting creature is not explained.
- id: motif:7
  label: Taboo period after contact with supernatural danger
  taxonomy_refs:
  - initiation
  basis: Shamans instruct Gîtko′na not to go anywhere on the ocean for four years
    after he strikes the son of Corner-of-mouth, and he avoids the sea and all going
    after things during that time.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: A taboo or avoidance period is explicit, but connection to the taxonomy
    family 'initiation' is uncertain and should be reviewed.
- id: motif:8
  label: White animal lure into fog and disappearance
  taxonomy_refs:
  - departure
  basis: A white animal enters the harbor, leads Gîtko′na outward during pursuit,
    fog envelops him, and after two foggy nights only his paddle is found.
  evidence_refs:
  - ev:12
  confidence: low
  cautions: The passage does not state that the animal is supernatural or that the
