canonical_text:
  quote: ''
  summary: The passage recounts Raven traveling over a water-covered island, supernatural
    beings lacking a place to settle, Loon reporting this need, Raven entering a sky-world
    town by piercing the clear sky, occupying a newborn child’s skin, causing alarm
    after nocturnal actions connected with loss of eyes, falling or being cast into
    the water, receiving an underwater invitation, descending by a two-headed kelp
    or rock pole, and receiving objects and instructions from an undersea old man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Salt water extends over the island, and Raven flies about looking for a place
    to sit.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Supernatural creatures lie on a flat rock; weaker supernatural beings are
    stretched out in many directions asleep, while the condition is described as both
    light and dark.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Loon repeatedly goes out, calls, returns, and sits in his usual place in the
    house of Nankilslas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When questioned, Loon says the supernatural ones have no place in which to
    settle; the person addressed says he will attend to it or make it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Raven is attracted by neighboring clear sky, flies upward, runs his beak into
    it from beneath, and draws himself up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a five-row town above, the chief’s daughter has just given birth; at night
    Raven skins the child from the foot, enters the skin, and lies in the child’s
    place.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The child’s grandfather asks for the baby, washes it, places his feet against
    the baby’s feet, and pulls upward; Raven becomes hungry because chewed food has
    not yet been put into his mouth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: While the household sleeps, Raven loosens himself from the cradle, goes outside,
    returns with something hidden under his blanket, pushes aside the fire, digs in
    the cleared place, mixes what he carries with ashes, eats it while it pops, and
    laughs; this action is repeated.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Half-rock being watches Raven from the corner; afterward the inhabitants
    of four of the five towns have each lost one eye, and the old woman reports that
    the chief’s daughter’s child stands up out of himself when people sleep.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Raven, in the baby role, is given a marten-skin blanket, held during public
    singing, dropped, watched as he goes, turns to the right, strikes the water, drifts
    about, cries, and sleeps.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: An unseen speaker, later shown to be a pied-billed grebe, tells Raven that
    his mighty grandfather wants him to enter his house.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Raven steps on a kelp with two heads, which becomes or is revealed as a rock
    house pole with two heads; he climbs down it, and the sea is described as being
    as good as the world above.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: In an underwater house, an old man white as a sea gull gives Raven nested
    boxes, then two cylindrical objects, one speckled and one black, identifies them
    and a blue slim walking thing with Raven, and instructs him to place the objects
    in water, bite off part of each, and spit on the rest.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
