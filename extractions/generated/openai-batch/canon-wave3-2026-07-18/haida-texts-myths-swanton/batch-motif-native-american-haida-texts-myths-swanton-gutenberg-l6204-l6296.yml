canonical_text:
  quote: ''
  summary: A woman given in marriage secretly eats salmon roe, hides the discovery
    of her labret, is seen with a tail, conjures people from excrement who melt, and
    flies away. Raven then visits animal hosts who produce food from their bodies,
    fails when he imitates them, arranges his sister's marriages, deceives and kills
    Sea-lion, is exposed by Mallard-duck, and removes Cormorant's tongue, explaining
    cormorants' lack of voice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman given as a wife is fed salmon roe, later secretly eats from the storage
    place at night, and loses her labret there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the labret is found in the salmon roe, the woman touches it with her
    lips, gives an explanation involving a wing-flapping being in her lip, and receives
    the labret back.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: During an outing to defecate, a tail from the woman's buttocks is briefly
    visible, and another speaker says this has happened before with a Tlingit woman's
    tail.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman tells her husband people are about to come after her and has firewood
    gathered in preparation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman changes excrement into people, makes them arrive by canoe, and they
    melt after entering, sitting, and perspiring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the excrement-people melt, the woman becomes ashamed and flies away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Water-ousel, Sea-lion, and Hair-seal each feed Raven; Water-ousel produces
    salmon roe from his leg, and Sea-lion and Hair-seal produce grease from roasted
    hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Raven attempts to imitate Water-ousel's leg-producing food and the hand-roasting
    of Sea-lion and Hair-seal, but he faints or is burned and later revives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Raven offers his sister in marriage, rejects suitors with lean buttocks, accepts
    Sea-lion because his buttocks are fat, and Sea-lion and the sister have two children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: While fishing, Raven says halibut come to him because he uses skin from his
    testes as bait, then induces Sea-lion to let him cut there.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Raven cuts off Sea-lion's testes, eats the fat part, replaces it with stones,
    and returns singing a mourning song.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Raven tells his sister that enemies killed her husband at House-point; she
    laments with her two children, and Sea-lion's body is carried in a mat and is
    heavy because of the rocks inside.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Mallard-duck doctors the body, says the brother-in-law took out the insides,
    is kicked into the fire by Raven, and the others learn Raven killed Sea-lion.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Cormorant marries Raven's sister, catches halibut when fishing, has his tongue
    pulled out by Raven, and loses his voice.
  category: sequence
  evidence_refs:
  - ev:10
