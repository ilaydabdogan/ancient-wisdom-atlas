canonical_text:
  quote: ''
  summary: A man associated with chiefly status is tested by tasting or feeling his
    blood or skin and is recognized among the Stikine people after having been blown
    about for a long time. He is cared for, remains among them, has four children,
    learns their language, and sings a crying song. He says he belongs to the Fish-eggs,
    is recognized as a chief, and news or song reaches his friends. His friends are
    comforted when they learn he is happy, while his wife has remarried because he
    was thought dead.
  language: Haida with English interlinear translation
  quote_policy: summarized
