  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator prepares himself, disembarks, and pursues one person running
    near the sea and into the woods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pursued person jumps into the ocean; the narrator takes his yellow cedar
    blanket with some of his hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The pursued person surfaces farther out, holds up his hands before the narrator,
    swims toward him, dives again, and surfaces at sea.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The narrator shoots at the pursued person, who swims landward and presses
    himself against the face of a cliff.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: After two shots the narrator stops; the pursued person climbs a tree against
    the cliff, bends it to reach the cliff face, enters a hole there, cannot climb
    down or up, and the group says he will die there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: The narrating party goes away, makes a fire, and gives food to one another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The group fights against a fort, cannot get away at first, is later brought
    back into a canoe, and shoots a man crawling on top of a house so that he falls
    down.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: A man wearing a dancing skirt and cedar-bark rings drags down a canoe, and
