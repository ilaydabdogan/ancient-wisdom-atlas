canonical_text:
  quote: ''
  summary: A first-person canoe party encounters people on the water, hears gunfire,
    takes two women captive, pursues a fleeing man who ends trapped in a cliff hole,
    fights near a fort, refrains from shooting a decorated man when Ldō′gwañ refuses,
    runs out of ammunition, and returns to Kaisun with nothing from the far country.
    A note says the attacked tribe’s identity is uncertain.
  language: English
  quote_policy: summarized
