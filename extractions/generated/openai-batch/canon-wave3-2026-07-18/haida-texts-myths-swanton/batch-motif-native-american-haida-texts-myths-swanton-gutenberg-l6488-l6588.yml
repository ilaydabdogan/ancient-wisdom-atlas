canonical_text:
  quote: ''
  summary: 'The passage contains several Raven-traveling and related episodes: an
    opening fragment about a lovesick man making a hole by striking his head while
    singing; Raven and a cousin traveling to distant water, leaving named places and
    a bill-shaped water hole; Raven raising prone beings who become mountains; and
    an alternate version centered on Nenk·îlsʟasʟiñgai, a rapidly growing child who
    makes fire, hunts birds and whales, kills Raven, foretells the arrival of killer-whale
    kin, and commands the returning tide.'
  language: English
  quote_policy: summarized
