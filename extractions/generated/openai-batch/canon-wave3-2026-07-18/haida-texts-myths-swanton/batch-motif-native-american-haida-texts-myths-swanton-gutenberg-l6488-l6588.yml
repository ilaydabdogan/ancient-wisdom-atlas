  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nenk·îlsʟasʟiñgai cries continually until the young woman Qalgaitsadas takes
    him in her arms; he becomes quiet when he touches her breast and cries again when
    returned to his mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy grows very rapidly and soon becomes able to walk.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: ʟg̣anxē′la is the mother’s lover; when the father discovers this, he becomes
