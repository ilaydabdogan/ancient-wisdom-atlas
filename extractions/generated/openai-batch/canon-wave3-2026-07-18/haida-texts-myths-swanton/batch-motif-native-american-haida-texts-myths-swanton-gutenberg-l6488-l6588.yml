- id: obs:1
  text: An unnamed male is lovesick for his uncle’s wife, sings while striking his
    head on rocks as a drum, makes a hole there, and the place receives a descriptive
    name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven travels with his cousin to an island of ʟꜝkꜝia′o, eats them, and returns
    toward shore with the cousin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Raven and his cousin become thirsty, Raven tells his cousin to take one
    stroke in the water, and they immediately arrive at distant Standing-water creek.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The place where Raven drinks has a water hole shaped like his bill.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narration explains that west-coast canoe travel is easy because of this
    event, and the eating place is named “Pulled-off-with-the-teeth.”
  category: other
  evidence_refs:
  - ev:2
