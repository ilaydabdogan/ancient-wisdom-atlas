canonical_text:
  quote: ''
  summary: A man traveling by canoe with his wife and children is seized by a devilfish
    at low tide and taken to the devilfish woman’s father’s town. After many years
    he becomes homesick; the devilfish chief allows him and the daughter to return
    in self-moving canoes filled with food wealth. He returns to his father’s town,
    becomes a great chief through trading and potlatching, and later he and the devilfish
    woman melt and pass between the house planks, returning to her father’s town.
    The passage ends by identifying the hero as a shaman.
  language: English
  quote_policy: summarized
