candidate_motifs:
- id: motif:1
  label: food sent through fire to a deceased spouse
  taxonomy_refs: []
  basis: After Qā′-idjît’s wife is killed, he sends food through the fire to her.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states the act but does not explain its cosmology or whether
    it is a general funerary practice.
- id: motif:2
  label: revenge attack by relative of a slain woman
  taxonomy_refs: []
  basis: Lū′g̣ot is identified as brother of the woman who was killed and then attacks
    and shoots his brother-in-law.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage implies a relation between the killing and Lū′g̣ot’s attack
    but does not explicitly state his motive.
- id: motif:3
  label: assassination attempt through smoke hole frustrated by weapon failure
  taxonomy_refs: []
  basis: Attackers attempt to shoot Qā′-idjît through the smoke hole; the pistol fails
    twice before guns fire into the blankets.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a narrative pattern in the passage, not linked here to an external
    taxonomy.
- id: motif:4
  label: peace and blood compensation paid in slaves
  taxonomy_refs:
  - sacred_exchange
  basis: A slave is brought as a peace offering, and later five slaves are given as
    blood money after war and slave-taking.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The exchange and compensation are explicit, but the passage does not call
    them sacred; taxonomy linkage is therefore cautious.
- id: motif:5
  label: war captives transformed into house-building and potlatch status
  taxonomy_refs: []
  basis: Slaves taken in war are connected to building houses, naming Sunny-fort,
    and beginning to potlatch.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The passage gives a sequence of economic and status outcomes but does
    not offer symbolic explanation.
- id: motif:6
  label: communal song producing social incident and new song
  taxonomy_refs: []
  basis: The people sing and move forward until a platform falls; an uttered question
    to a child becomes another song.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents a local incident and song origin without broader
    mythic interpretation.
