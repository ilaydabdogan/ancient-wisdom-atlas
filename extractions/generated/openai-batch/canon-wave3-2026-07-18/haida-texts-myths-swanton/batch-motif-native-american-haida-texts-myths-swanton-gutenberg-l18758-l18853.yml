canonical_text:
  quote: ''
  summary: A sequence of Haida war-history episodes describes return after slave exchange,
    house-building plans, communal singing, relocation and succession, attacks and
    revenge around Qā′-idjît and his wives, survival of a smoke-hole attack, killing
    and death, peace offerings, slave-taking in war, blood-money payments, house construction,
    and potlatch-related status changes at Sea-grass town.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Djē′basa ate dry fish and grease in the canoe after arrival, and the group
    judged his mind to be good.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: South-east spoke of building a house from what he had received in exchange
    for slaves, and the Town-of-Djī′gua people sang outside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During singing the people made a forward motion; the platform fell, but no
    one was injured, and another song was made from a question to a child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The group moved from a fort to Chicken-hawk town and built houses; later Qā′-idjît
    succeeded after South-east and Ginᴀ′skilas were dead, cleared Sea-grass town,
    and built Cave-house there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those-born-at-Skedans came from Skedans to fight Qā′-idjît; their shooting
    killed his Pebble-town wife while he reached safety.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Qā′-idjît sent food through the fire to his dead wife, after which the passage
    says he soon forgot about her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In summer Qā′-idjît married a woman of Those-born-at-Qꜝā′dᴀsg̣o, and Lū′g̣ot,
    the brother of the woman who had been killed, stayed there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before Qā′-idjît set out to eat berries, painted and wearing weasel skins
    in his hair, Lū′g̣ot ran toward him and threw sand into his face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lū′g̣ot asked for guns in the canoe bow, received one after hesitation, and
    shot his brother-in-law; the passage states that he shot true and killed him,
    though Qā′-idjît is afterward described as wounded and escaping.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Those-born-at-Qꜝā′dᴀsg̣o fired and shot Qā′-idjît in the elbow; three were
    killed that day, and Qā′-idjît escaped into Cave-house under blankets and a cotton
    canoe sail.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Attackers later came by moonlight to kill Qā′-idjît; a boy sleeping with him
    woke him, a pistol moved in the smoke hole failed twice, and later gunshots through
    the smoke hole pierced the blankets.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Later Qā′-idjît heard running feet, aimed in that direction, and shot Naskiä′ł
    in the face when he put out his head; Naskiä′ł fell and is said to have been killed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Qā′-idjît later went to Gᴀ′nx̣oat in Big-house, died there, and his grandfather
    placed him in a big box.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The people who had shot Qā′-idjît and held a fort in Lake inlet brought a
    peace offering consisting of one slave.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: A later expedition to Gîtā′mat took many slaves; after the return, two large
    houses were built at Atā′na, five slaves were given as blood money, and remaining
    slaves were sold to build a house associated with Naskiä′ł and potlatching.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: After house timbers were obtained and a house was built at Sea-grass town,
    the passage says this was how they returned to Sea-grass town and later ceased
    to have trouble there.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: A closing note identifies Kitkatla as an important town and Tsimshian-stock
    tribe on Dolphin island.
  category: setting
  evidence_refs:
  - ev:15
