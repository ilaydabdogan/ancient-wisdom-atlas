  quote_or_summary: After arrival, Djē′basa eats dry fish and grease in the canoe;
    South-east speaks of building a house with goods obtained in exchange for slaves;
    Town-of-Djī′gua people sing outside.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: 18763-18770
  quote_or_summary: Song text is given; while singing, the people make a forward motion,
    the platform falls without injury, and another song begins from the question “Hî′ndju,
    is your brother there?”
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; short quotation included from supplied passage.
- id: ev:3
  type: summary
  locator: 18771-18777
  quote_or_summary: The people move from the fort to Chicken-hawk town and build houses;
    after a long interval, South-east and Ginᴀ′skilas are dead, Qā′-idjît succeeds,
    clears Sea-grass town, and builds Cave-house.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 18778-18783
  quote_or_summary: Those-born-at-Skedans come from Skedans to fight Qā′-idjît, shoot
    at him, and kill his Pebble-town wife; he gets safely inside and sends food through
    the fire to his wife.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 18784-18787
  quote_or_summary: In summer Qā′-idjît marries a woman of Those-born-at-Qꜝā′dᴀsg̣o;
    Lū′g̣ot, brother of the one who was killed, also stays there.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 18788-18794
  quote_or_summary: Qā′-idjît paints himself, ties weasel skins in his hair, and starts
    to go berrying; Lū′g̣ot runs toward him and throws sand into his face.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 18795-18798
  quote_or_summary: Lū′g̣ot asks for two guns in the bow, is eventually handed one,
    and shoots his brother-in-law; the passage says he shot true and killed him.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 18799-18804
  quote_or_summary: Those-born-at-Qꜝā′dᴀsg̣o fire at him and shoot him in the elbow;
    three are killed that day; Qā′-idjît is made to sit on the sand, escapes into
    Cave-house, and lies covered by two blankets and a cotton canoe sail.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 18805-18813
  quote_or_summary: Attackers return by moonlight fearing he is alive; a boy wakes
    him; while he moves back from the fire, a pistol in the smoke hole fails twice,
    then two guns through the smoke hole make large holes in the blankets.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 18814-18820
  quote_or_summary: Later Qā′-idjît sits outside, hears running feet, aims, and shoots
    Naskiä′ł in the face when he puts out his head; Naskiä′ł falls and is later said
    to have been killed.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 18821-18825
  quote_or_summary: Another family looks after Naskiä′ł’s body; Qā′-idjît goes to
    Gᴀ′nx̣oat in Big-house, dies there, and his grandfather places him in a big box.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 18826-18832
  quote_or_summary: The people who shot Qā′-idjît and held a fort in Lake inlet bring
    a peace offering of one slave; later Two-in-one comes from Daog̣ā′iłgᴀłgîñ and
    they get Naskiä′ł to go to war with the Gîtā′mat.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 18833-18841
  quote_or_summary: At Gîtā′mat they take many slaves for Naskiä′ł; Two-in-one has
    three; after returning they build two large houses at Atā′na, give five slaves
    as blood money, name the island Sunny-fort, and sell remaining slaves to build
    a house where Naskiä′ł begins to potlatch.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 18842-18847
  quote_or_summary: They get house timbers from Sea-grass town and build Naskiä′ł’s
    house there; afterward they procure more expensive seats at feasts and potlatches
    and cease having trouble at Sea-grass town.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 18848-18853
  quote_or_summary: The passage closes and adds that Kitkatla was an important Tsimshian-stock
    town and tribe on Dolphin island.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
