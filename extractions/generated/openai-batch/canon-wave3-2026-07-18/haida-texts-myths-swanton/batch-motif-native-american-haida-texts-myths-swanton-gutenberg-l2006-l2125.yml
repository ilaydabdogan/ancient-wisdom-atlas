canonical_text:
  quote: ''
  summary: Ten hunters with dogs encounter mist, a steep mountain called Slender-rock,
    and a fire ordeal in which a bow and then the men are consumed and appear below.
    As they travel, feather signs and bodily marks appear. They repair an old canoe,
    arrive at a shaman’s village, and are named as chiefs or supernatural beings.
    They then arrange themselves in the canoe, take in boys, collect feathers, and
    later take in and heal a crying woman, making her their sister.
  language: English
  quote_policy: summarized
