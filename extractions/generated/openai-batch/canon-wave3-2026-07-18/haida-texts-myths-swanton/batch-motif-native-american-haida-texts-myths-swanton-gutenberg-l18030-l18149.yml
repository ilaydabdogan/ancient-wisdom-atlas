canonical_text:
  quote: ''
  summary: 'The passage recounts conflict between Kloo and Ninstints people: South-east''s
    two wives are accused and whipped, disappear, and their mothers receive compensation;
    later South-east is pursued and killed; Alder responds through deception, killing,
    retrieval of goods and weapons, sparing a woman through a same-skin tie, and an
    ambush that kills two people and enslaves two others.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: South-east is described as having two wives, one linked to Sand-town and one
    to Pebble-town, and the passage says he loved the Ninstints woman because she
    was pretty.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pebble-town woman wanted the favored woman to do wrong and told South-east
    that she was receiving a man of the Town-of-Djī′gua people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: South-east took the accused woman outside naked and whipped her; after a counter-accusation
    concerning the Pebble-town woman, he whipped the Pebble-town woman also.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The next day both women had disappeared, and their whereabouts were unknown.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two mothers appeared together before People’s-fort, sang crying songs for
    their daughters, and each received a slave and much property as blood compensation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Near summer, South-east went to ask in marriage the younger sister of the
    Sand-town woman whom he had married.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mother of Many-chiefs asked Many-chiefs whether he was a man; he became
    angry, took his gun and paddle, and joined the pursuit of South-east.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: As South-east fled into the woods, a small limb under a fallen tree scratched
    his forehead and blood flowed over his cheeks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ninstints people encircled South-east and waited for Many-chiefs; after an
    unnamed speaker urged action, Skᴀ′ndal shot South-east, while those with him were
    allowed to go.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Łtā′na, an unmarried man of Those-born-in-the-Ninstints-country had recently
    won three sea-otter skins in gambling from Alder, a Town-of-Djī′gua man.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Alder went out, ate medicine, spent the night with the medicine on his stomach,
    and later began eating and drinking; his sister West-coast-clouds gave him birds’
    eggs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When crying came from the end of the town, Alder put down the egg he was shelling
    and stopped those who had begun the cry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Alder and his younger brother approached the Ninstints man by ship and canoe;
    Alder falsely explained the shore weeping as concerning a child falling into the
    water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Alder stabbed the Ninstints man, said that the chief had been killed and his
    body was being brought home, and took back four sea-otter skins.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Alder went to Strait-where-no-waves-come-ashore for gunpowder and bullets
    stored by South-east and brought the news there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Ginᴀ′skilas set a Sand-town woman outside to kill her, but Alder stopped him
