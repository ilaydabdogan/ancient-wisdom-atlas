  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Ninstints people taunted Alder that his leg had been cut off and wondered
    what he would use as weapons; Alder answered that in two nights he would procure
    weapons by selling them as slaves.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Alder and his younger brothers hid their canoe, went inland, found a storehouse,
    moved skins and hides, and found a box of sea-otter tails.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: Alder’s party watched by the fresh water opposite the fort; when three young
    women and a man came singing from the fort, they shot at them, killed the man
