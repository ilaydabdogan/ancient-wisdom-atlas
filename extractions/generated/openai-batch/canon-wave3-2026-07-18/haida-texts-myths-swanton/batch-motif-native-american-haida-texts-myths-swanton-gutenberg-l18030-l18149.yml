candidate_motifs:
- id: motif:1
  label: Accused wives disappear and are compensated through blood payment
  taxonomy_refs: []
  basis: The wives are accused and whipped, disappear, and their mothers receive slaves
    and property as blood compensation.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not state whether the women died or where they went;
    the compensation is described, but the exact legal or social mechanism is not
    explained in this excerpt.
- id: motif:2
  label: Challenge to manhood incites pursuit
  taxonomy_refs: []
  basis: Many-chiefs’ mother asks whether he is a man, after which he becomes angry,
    takes weapons, and pursues South-east.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The causal link is close in sequence, but the passage gives little explanation
    beyond the challenge and immediate reaction.
- id: motif:3
  label: Visible blood as a danger-sign before killing
  taxonomy_refs: []
  basis: After South-east’s face is bloodied by a scratch, an unnamed speaker warns
    that even the blood running down his face will put them in a predicament, and
    South-east is then shot.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The meaning of the warning about blood is not explained; this is a candidate
    pattern only.
- id: motif:4
  label: Deceptive approach before revenge killing
  taxonomy_refs: []
  basis: Alder approaches the Ninstints man, falsely explains the shore weeping as
    a child falling into water, then stabs him and connects the act to the killing
    of the chief.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage clearly gives the deception and killing, but the broader social
    rules of revenge are not explained in this excerpt.
- id: motif:5
  label: Retrieval of weapons and property after a chief’s death
  taxonomy_refs: []
  basis: Alder recovers sea-otter skins, goes for South-east’s stored gunpowder and
    bullets, and later searches a storehouse containing sea-otter tails.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: medium
  cautions: The passage presents these as connected actions, but does not explicitly
    define them as a ritualized motif.
- id: motif:6
  label: Kin or same-skin affiliation prevents killing
  taxonomy_refs: []
  basis: Alder stops Ginᴀ′skilas from killing a Sand-town woman, saying she is of
    the same skin dirt, and she is let in.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The phrase appears to mark an affiliation, but its exact social meaning
