canonical_text:
  quote: ''
  summary: The passage includes the close of a story in which a man returns with a
    sack containing animal parts, exchanges them, becomes a chief, and potlatches;
    an editorial note says the wolf-related tale is probably from the mainland. It
    then tells of an upper-class woman led inland to a large town and painted house,
    warned by a half-rock woman about food restrictions, aided in escape by objects
    that become obstacles, rescued at sea by Chief Sag̣adila′ʻo and his animate canoe,
    and finally killed by the chief’s first wife after breaking a rule against watching
    her eat.
  language: English
  quote_policy: summarized
