candidate_motifs:
- id: motif:1
  label: Inviolable peace tokens placed on chiefs
  taxonomy_refs:
  - sacred_exchange
  basis: The passage states that feathers are used in making peace and are inviolable,
    and then narrates feathers being placed on chiefs during negotiations.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  confidence: high
  cautions: The taxonomy label is broad; the passage gives a local practice of feathering
    chiefs rather than an explicit abstract doctrine of sacred exchange.
- id: motif:2
  label: Kin-mediated negotiation across enemy lines
  taxonomy_refs: []
  basis: Lda′ogwañ speaks from among the Bellabella to her father Waters, and their
    exchange frames the question of whether the gathered people want peace or war.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage does not explain why Lda′ogwañ is among the Bellabella or
    fully define her diplomatic status.
- id: motif:3
  label: Ritual sound and performance during armed peacemaking
  taxonomy_refs: []
  basis: A peace-drum sound is requested and improvised by beating a canoe thwart;
    later a secret-society eagle noise, singing, and dancing occur while the canoe
    parties face each other.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: medium
  cautions: The text reports actions and sounds but does not explicitly interpret
    their ritual meaning beyond the phrase 'peace drum' and the identification of
    a secret-society eagle.
- id: motif:4
  label: Concealed fugitive exposed during negotiation
  taxonomy_refs: []
  basis: During the canoe negotiations, the escaped slave hides under a yellow cedar-bark
    blanket, but Lā′ma recognizes him and seizes him by the hair.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is a narrative pattern in the passage, but no wider mythic taxonomy
    reference is supplied.
