canonical_text:
  quote: People always use feathers in making peace. They are inviolable.
  summary: The passage narrates a confrontation with Bellabella enemies, movements
    by canoe, shooting, and several episodes of peacemaking in which feathers are
    placed on chiefs. Lda′ogwañ speaks to her father Waters from among the Bellabella;
    Lā′ma later carries Gîtku′n’s feather bag, confronts an escaped slave, and feathers
    chiefs. The Bellabella approach, Ya′koeʟas addresses them, a secret-society eagle
    noise is heard, Gūnana′otx̣a sings and dances, and the Bellabella come ashore
    with their goods and guns.
  language: English
  quote_policy: quoted
literal_observations:
