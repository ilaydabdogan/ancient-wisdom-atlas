canonical_text:
  quote: ''
  summary: Stone-ribs is burned out from settling beneath the supernatural beings.
    Sacred-one-standing-and-moving is summoned, comes by canoe with his mother and
    sister, wears a wā′sg̣o skin, and succeeds in taking a place under the island
    while his companions treat his burned skin. The supernatural beings divide settlement
    places and depart. Stone-ribs travels on the island, hears a weeping call, goes
    to help, acquires and wears the skin of a copper-striped halibut after thunder
    and lightning accompany the cutting, tests it in a pond, then later enters a village
    by replacing a woman's child, grows rapidly, asks for a bow, and hunts birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stone-ribs experiences daylight, the supernatural beings fear him settling
    beneath them, and he is driven out by burning before daylight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The supernatural beings decide to send for Sacred-one-standing-and-moving
    because he is said to have bathed in the ocean often in order to settle under
    it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sacred-one-standing-and-moving says his mother and She-upon-whose-feet-property-makes-a-noise
    will go with him, retrieves a wā′sg̣o skin from between two heads of a cedar,
    and wears it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the canoe journey, his mother steers, his sister is in the bow, and he
    stands in the middle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When he enters, the supernatural beings lower their heads; his sister carries
    duck entrails, and his mother carries feathers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: He lies underneath, sizzles from the fire, and when the burning stops his
    sister greases his skin with duck grease while his mother places feathers on it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The supernatural beings discuss where they will settle, divide themselves
    up, and Woman-people-want-to-have says she will have her place with her children
    a little behind the chiefs among the trees.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At daybreak the Raven calls, and the passage states that he comes to have
    his place under the island.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fast-rainbow-trout is sent up with a string, splices hemlock roots to it when
    it is not long enough, and Marten goes down with the lower end.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Stone-ribs travels on the island, tells his mother that someone is calling
    and wailing for him toward Cape G̣ᴀ′ñxet, and decides to help despite her warning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Stone-ribs sees an eagle trying to catch something near white shells and finds
    a halibut with copper stripes along its edges and a weasel hanging from its nose.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: When Stone-ribs tries to split the halibut in several places, thunder and
    lightning occur; he then skins it along the tail and puts it on.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: In a pond, bullheads move into Stone-ribs's mouth and then come out dead.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Stone-ribs has a copper coat and a marten-skin coat; when he practices wearing
    them before his mother, swelling up nearly bursts her house.
  category: object
  evidence_refs:
  - ev:13
- id: obs:15
  text: At Łg̣adᴀ′n village, Stone-ribs skins a woman's child, is born instead, grows
    rapidly, asks for a bow, receives arrows and copper from the woman, and hunts
    birds.
  category: sequence
  evidence_refs:
  - ev:14
