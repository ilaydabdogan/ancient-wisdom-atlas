canonical_text:
  quote: ''
  summary: A beautiful boy in his uncle's house chews gum, repeatedly defecates indoors,
    visits his uncle's wife by means of his soul, and is associated with thunder.
    He summons chiefs, sheds skin, borrows people from an ocean-dwelling maternal
    grandfather, and participates in scenes where people speaking Tsimshian, Heiltsuk/Wakashan,
    and Haida are produced from dirt by stamping. At Qîng·'s house, Porpoise youths
    teach him how to become hungry; he becomes insatiable, is expelled, puts on raven
    skin, and later raises waters so that Qîng·'s sister and ten children climb Qîng·'s
    hat after it becomes a mountain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The uncle's wife makes mats and sits in the house; the boy is described as
    beautiful, chews red gum, defecates in the house, and approaches and encircles
    the woman on the highest platform.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy visits the woman when his uncle hunts; a bracketed note says the boy
    remains in the house while his soul hunts birds and visits the woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thunder occurs when the boy reaches the woman; he defecates so much that slaves
    carry the excrement out in buckets, and the uncle says the thunder is a sign that
    his nephew cohabits with his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy says he wants Qîng· to come and be his father; when canoes of chiefs
    arrive, the boy throws off his skin and is beautiful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qoēqqu′ns is said to live in the middle of the ocean and to be the boy's mother's
