canonical_text:
  quote: ''
  summary: An unnamed male figure is instructed by an unidentified speaker to call
    upon Cold-weather and North-wind and to sing North songs. He sings for clear sky,
    cold weather, and smooth water; North weather comes, the sea freezes, and his
    friends retrieve him, though he cannot walk. After he is brought to his parents'
    house, his father assembles and feeds the Forest people, and the man explains
    that the beavers harmed him because he ate Beaver's food. The Porcupine people
    then fight the Beaver people without defeating them. Later, porcupines seize Beaver,
    place him in a tall tree, and Beaver escapes by eating the tree from the top.
    An editorial note states that Tcꜝîñ is the Haida word for beaver, that qā′-idjît
    is of unknown meaning, and that the story was probably originally Tlingit.
  language: English and Haida
  quote_policy: summarized
