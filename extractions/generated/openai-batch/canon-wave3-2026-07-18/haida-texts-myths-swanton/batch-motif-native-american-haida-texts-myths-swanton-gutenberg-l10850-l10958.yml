canonical_text:
  quote: ''
  summary: A disliked boy and his mother live at the edge of White-slope. After helping
    a heron with a broken bill, the boy receives medicine and a wing-tip feather.
    He uses the feather to make a chief’s son ill, then demonstrates supernatural
    power and cures him for moose skins. He later transforms himself, marries and
    heals a lame woman, enters a wondrous living house, is acknowledged by Master
    Carpenter as a child, and receives arrows and knots for a journey to Many-ledges’
    town, where he disguises himself as driftwood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A certain person and his mother are disliked at White-slope and live in a
    branch house at one end of the town.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person regularly goes down at low tide and brings back food for his mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He finds a heron with a broken bill, sharpens the bill, and receives medicine
    and a wing-tip feather from the heron.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The heron instructs him to keep the medicine in his mouth and to blow the
    feather under the armpit of the town chief’s son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The child plays at having supernatural power, using a mat with shells, feathers,
    old cedar bark, and found objects as ritual items.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: He blows the feather into the chief’s son’s armpit, and the chief’s son immediately
    has pain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the chief’s son’s shamanic treatment, black-skinned persons holding burning
    pitchwood chase the boy after he wonders why they cannot see the object sticking
    out of the patient.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The pursuers are identified as The-ones-who-have-spines-for-earrings, and
    they later discover that the boy is responsible.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: When people set out to get him, he spits medicine on the objects he had been
    playing with; the dancing skirt, drum, and dancing hat are described as completed
    ritual objects.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the healing performance, the beating plank beats itself, the drum and beating
    board enter by themselves, and the dancing hat appears in different parts of the
    house.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: He pulls out the feather so that the pain and sickness cease, then blows it
    in again because he does not think he has received enough payment.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the payment is increased to ten moose skins, he removes the feather
    for good, and the chief’s child sleeps.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: He changes himself into a salmon-berry bush near a trail and entangles himself
    in the hair of the lame youngest daughter who has fallen behind.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: He tells the lame woman he will marry her, takes her home, spits medicine
    on her, stretches her leg out, and it becomes well.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After marrying her, he discards the branch house and builds a regular house
    with a bedstead.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: One night the house moves while he sleeps; at dawn, carvings inside the house
    wink and carvings on the bedstead corner posts move their tongues.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Greatest Hopper is present in a rear corner of the house, and Master Carpenter
    is said to have become the protagonist’s father.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: Master Carpenter calls him child, combs his hair, paints his face, and makes
    him handsome.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: When the protagonist sets out to marry the daughter of Many-ledges, Master
    Carpenter gives him arrows bearing weasel and mouse figures, and also gives him
    knots.
  category: action
  evidence_refs:
  - ev:13
- id: obs:20
  text: Master Carpenter warns that Many-ledges destroys the sons of supernatural
    beings and says driftwood never floats ashore in Many-ledges’ town.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:21
  text: Greatest Hopper carries him, and he spits medicine on burning capes before
    Greatest Hopper hops quickly over them with him.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:22
  text: Near Mā′g̣ᴀn he feels extremely sweet because there are many stick-potatoes
    there, according to the narrator’s explanation.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:23
  text: At Many-ledges’ town he changes himself into knots and floats ashore in the
    evening as driftwood, waiting for the children to come down.
  category: action
  evidence_refs:
  - ev:15
- id: obs:24
  text: Many-ledges’ children notice the unusual driftwood, bring it near the door,
    forget it, and later bring it inside before bed.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:25
  text: Many-ledges breaks four of five stone adzes while trying to cut the knots,
    splits the wood with the last adze, and puts it into the fire.
  category: sequence
  evidence_refs:
  - ev:16
