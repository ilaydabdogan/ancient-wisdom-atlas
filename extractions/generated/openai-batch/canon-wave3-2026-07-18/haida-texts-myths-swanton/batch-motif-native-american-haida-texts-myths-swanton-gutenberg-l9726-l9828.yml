canonical_text:
  quote: ''
  summary: An unnamed protagonist defeats or tests strength against Greatest-strong-man,
    returns by water to Gū′łg̣a, receives two sky blankets from his mother, proves
    too heavy for ordinary beds, repeatedly helps a shrew or mouse over a fallen tree,
    eats plant-covered mountains, confronts a destroyer of his younger brothers, uses
    medicine from Mouse-woman to bring his brothers' bones out of flint, transforms
    the opponent into brittle rock, visits Mouse-woman's fern-clump house, encounters
    inexhaustible food, and receives blue medicine and instructions for further restorations
    and an endless supernatural course.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The protagonist seizes Greatest-strong-man, pushes him down, and later pulls
    out a dead limb that the other figure had failed to pull off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The protagonist swims down the inlet, stands at Gū′łg̣a, enters a house, dries
    himself near the fire, and asks his mother for possessions prepared for him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother says she had items made for him when something made him and shut
    him in the womb, then gives him two sky blankets from a box.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The protagonist breaks several bedsteads by sitting on them, including newly
    made stronger ones, then makes a stable sleeping place with pokers fastened crosswise,
    dead salmon-berry bushes, and planks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the trail, he repeatedly finds a shrew or mouse with cranberries trying
    unsuccessfully to climb over a dead fallen tree, and he puts her across.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
- id: obs:6
  text: He eats through a mountain covered with devil's-club, spits out the last part,
    and says he may become a wā′sg̣o if he swims about so much.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After his speech about becoming a wā′sg̣o, voices identified as Red-backed-grouse
    and ʟꜝuqaᴀ′ndas answer from different directions along the inlet.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: On another day he eats a mountain covered with x̣î′lg̣oga, stays overnight,
    swallows the last of it, spits out part, speaks the same words, and receives the
    same kind of replies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: He challenges the being that destroyed his younger brothers to wrestling and
    instructs it to stand waiting after throwing him down.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: When thrown through the air to flint, he rubs Mouse-woman's medicine on himself,
    strikes the flint, pulls it down, and his younger brothers' bones burst out of
    it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: He spits medicine on the brothers' bones and returns to find the opponent
    still waiting.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: He throws the opponent down, says future people will see him, and the opponent
    becomes a kind of brittle rock.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the brothers disappear again, he thinks of the animal he helped, follows
    her into the butt end of a clump of ferns, and sees a house there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Mouse-woman addresses him as her son, says news has come that he is going
    to borrow something from her, seats him near her, and serves him food from boxes
    and trays.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: A piece of dried salmon and a single cranberry set before him cannot be consumed,
    even though they appear small.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Mouse-woman takes a blue substance from a box, bites off part for him, and
    gives it as medicine for when he thinks of eating medicine.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: Mouse-woman tells him to go to Gū′łg̣a lake, whistle for Among-the-hemlock-boughs
    at a shore trodden by many feet, drop to the ground when he nearly reaches him,
    and come to himself inside that being's belly.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Mouse-woman instructs him to apply medicine to himself, restore his younger
    brothers, then run to Sealion-town, climb into a tree, wound a sea creature by
    pushing an object into its ear, and restore the brothers there again.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: Mouse-woman says that after the brothers disappear again and he starts after
    them, he will keep going forever as one with supernatural power.
  category: speech
  evidence_refs:
  - ev:9
