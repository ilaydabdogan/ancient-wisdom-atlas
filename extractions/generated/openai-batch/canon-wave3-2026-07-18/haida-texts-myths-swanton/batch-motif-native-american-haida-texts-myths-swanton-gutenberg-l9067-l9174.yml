canonical_text:
  quote: ''
  summary: A boy travels by canoe with his mother to gather shellfish. A being named
    Qꜝā′g̣awa-i pursues canoes, opening his mouth so a current draws them inward,
    but the boy forces his lips shut. The mother repeatedly says she was saved by
    blowing through her labret hole and putting her foot or feet into the sea. Later
    the boy enters a halibut skin, follows an underwater trail to Qꜝā′g̣awa-i’s town,
    lies with Qꜝā′g̣awa-i’s daughter, and attacks fishing canoes. Qꜝā′g̣awa-i arms
    himself with skin clothing, spear, arrow box, and pitch-tipped arrows. In the
    final encounter the boy/Stone-ribs swells within or fills the Qꜝā′g̣awa-i skin,
    is not harmed by spearing, captures the skin, swallows fishing people, releases
    two to go home, and leaves others on shore without skins and with fins before
    returning to his mother.
  language: English
  quote_policy: summarized
