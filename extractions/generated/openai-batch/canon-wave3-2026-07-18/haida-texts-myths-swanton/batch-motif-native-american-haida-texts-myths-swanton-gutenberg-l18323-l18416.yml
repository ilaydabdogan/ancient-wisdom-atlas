canonical_text:
  quote: ''
  summary: The passage recounts warfare between Skidegate and Ninstints groups, including
    the destruction of a fort, enslavement of women and children, ominous speech before
    the fort’s fall, severed heads making noise after the battle, later ambushes and
    counterattacks, the display of an enemy head to demoralize Skidegate people, and
    a separate internal killing after a quarrel over gambling sticks.
  language: English
  quote_policy: summarized
