canonical_text:
  quote: "“Dance four short nights in your canoe. Then you will be finished.”"
  summary: Fine-weather-woman gives named brothers and a sister directions for arranging
    themselves in a canoe, assigning names, positions, colors, and functions. She
    sends them to Stā′ngwai to be painted and tells them to dance in the canoe. Stā′ngwai
    dresses them with dance regalia, wraps a cloud-skin around the canoe, arranges
    them inside, and makes nests where they sit. An editorial note compares the passage
    to other stories about the origin and naming of supernatural beings and explains
    headdresses and fire as a route to the land of souls. The remainder of the supplied
    passage is a Haida-language section without an English translation in the excerpt.
  language: English; Haida in later section
  quote_policy: quoted
