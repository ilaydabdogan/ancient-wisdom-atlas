canonical_text:
  quote: ''
  summary: The passage first describes a man named Sealion’s-neck arranging a carved
    grave post, giving tobacco to a shaman, and being associated with a supernatural
    utterance before an Inlet attack destroys the town and enslaves women and children.
    It then introduces Łᴀ′gua as a Tlingit spirit and recounts a poor Tlingit man
    whose Power promises wealth and chiefship during enslavement; while acting as
    a shaman he uses a love-making substance to put a village into deep sleep, escapes
    with fellow slaves and captured children in paddleless canoes, evades pursuit
    when the canoes become tree-covered islands, returns home, and becomes a great
    chief.
  language: English
  quote_policy: summarized
