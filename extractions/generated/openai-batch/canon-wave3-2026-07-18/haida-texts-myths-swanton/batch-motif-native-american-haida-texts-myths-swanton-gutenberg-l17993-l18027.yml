canonical_text:
  quote: ''
  summary: A man called Always-ready is given a shooting test with a bow and arrows,
    rejects some arrows, receives one with an iron point, and shoots Sg̣agᴀ′ño’s nephew.
    He is bound and tortured by fire on the beach, answers that the man he killed
    has gone up before him, and is burned to death. His entrails are examined and
    a short lobe of his liver is said to explain his bravery. Afterward the trouble
    stops, a chief’s son is put into a box, and the people leave sorrowfully. A woman
    of the family composes a crying song for Sg̣agᴀ′ño after he runs into the woods
    and reaches Tcꜝā′ał. The passage closes with a note identifying the families as
    noted Raven families.
  language: English
  quote_policy: summarized
