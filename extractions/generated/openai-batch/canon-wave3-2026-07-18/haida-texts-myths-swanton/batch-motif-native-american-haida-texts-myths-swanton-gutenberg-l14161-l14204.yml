canonical_text:
  quote: ''
  summary: A series of warnings and omens precedes the destruction of a town by a
    fire that comes from the water. A young girl who has just reached maturity hides
    in a cellar and is the sole survivor. Djila′qons comes from the water, sings a
    mourning song with her staff, finds the girl, and the girl becomes mother of the
    Djʼēguaʟlānas. Editorial notes identify Djila′qons as an ancestress or patroness
    of Eagle-clan groups and cite other published versions and a crying song.
  language: English
  quote_policy: summarized
