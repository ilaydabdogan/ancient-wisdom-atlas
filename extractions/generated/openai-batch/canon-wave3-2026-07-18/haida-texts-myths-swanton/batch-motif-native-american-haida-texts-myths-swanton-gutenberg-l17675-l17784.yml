canonical_text:
  quote: ''
  summary: A sequence of conflicts is narrated among named Haida groups and neighboring
    peoples. Gî′tg̣ax̣ī′liña is killed, his grandfather reacts with grief, and Î′ldjiwas
    arranges a wake, payments, and later killings. Further shootings, compensation
    payments, and peace-making episodes follow. Î′ldjiwas is wounded, gives a death
    speech about going upward and throwing down house materials and coals, then dies;
    afterward a red object falls from the sky. The passage also recounts Sg̣ā′gia
    killing his caretaker and fleeing by canoe, and later raids in which Tsimshian,
    Tlingit, and Bellabella groups enslave or kill people from named communities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gî′tg̣ax̣ī′liña is reported killed after fighting, and many others are wounded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gî′tg̣ax̣ī′liña’s grandfather initially resists the report of his death, goes
    to see him, then attempts to throw himself over a cliff before being seized.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The grandfather later cries around the fire and dashes himself against a white
    man’s anvil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Gî′tg̣ax̣ī′liña’s parents receive ten slaves from the house of the Middle-town
    people.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Î′ldjiwas asks the Middle-town people, who had recently been shooting at his
    side, to stay awake with Gî′tg̣ax̣ī′liña’s body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Middle-town people stay in the house for ten nights, receive food, and
    later receive property for the wake after the burial.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the wake and burial payments, Î′ldjiwas starts killing Middle-town people,
    and property is repeatedly given as blood money.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Nᴀñ-gut-tcî′ng̣a warns Î′ldjiwas that people are coming to kill him, and Î′ldjiwas
    shoots Gîtkudja′os beside a vessel so that he falls into the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A silver pistol bought for Î′ldjiwas is tested on his father’s younger brother
    after Î′ldjiwas says it cannot kill people but only wound them; fighting begins
    again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After being wounded and remaining alive fifteen nights, Î′ldjiwas holds a
    loaded gun and speaks of people coming down for him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Î′ldjiwas says he is going up, will throw down planks and burning coals from
    inside another house, and is going up to be with him; after speaking, he becomes
    like one asleep.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the evening, a slight noise is heard in the air and something red falls
    from the sky, described as happening as Î′ldjiwas had said.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Sg̣ā′gia is treated badly by Sg̣atcꜝîdā′łgîñ, draws blood in anger, kills
    him two nights later, takes his three slaves, and leaves by canoe after sparing
    his wife when she speaks good words.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Tsimshian, Tlingit, and Bellabella groups are described as enslaving, destroying,
    or killing people from named communities in separate later episodes.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
