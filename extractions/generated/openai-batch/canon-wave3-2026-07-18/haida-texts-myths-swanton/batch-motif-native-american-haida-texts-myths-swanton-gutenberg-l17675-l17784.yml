candidate_motifs:
- id: motif:1
  label: violent death followed by extreme kin mourning
  taxonomy_refs: []
  basis: Gî′tg̣ax̣ī′liña’s death is followed by his grandfather’s attempted cliff-jump
    and self-injury against an anvil.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a narrative pattern in the passage, not a claim about a broader
    tale type.
- id: motif:2
  label: wake kept by recent enemies and paid with property
  taxonomy_refs:
  - sacred_exchange
  basis: Middle-town people, despite recent fighting, stay awake with the body for
    ten nights, receive food, and are later paid property for the wake.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage frames the transaction socially and ritually around a wake;
    classification under sacred exchange should be reviewed.
- id: motif:3
  label: cycle of revenge, peace, and blood compensation
  taxonomy_refs: []
  basis: The passage repeatedly links killings and renewed fighting with property
    exchanges and blood money.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:9
  confidence: high
  cautions: This is extracted as a recurrent plot pattern within the passage, without
    assigning an external motif index.
- id: motif:4
  label: deathbed upward departure with confirming sky sign
  taxonomy_refs:
  - ascent
  basis: Î′ldjiwas says he is going up to be with another, dies after speaking, and
    afterward something red falls from the sky as he had said.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not explicitly explain the red falling object; the ascent
    label is based on the speaker’s own words.
- id: motif:5
  label: weapon display causing renewed kin conflict
  taxonomy_refs: []
  basis: An all-silver pistol given to Î′ldjiwas is shown to his father’s younger
    brother and used to shoot him, beginning fighting again.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The episode is brief and may be historical narrative rather than a conventional
    motif.
- id: motif:6
  label: mistreated youth kills caretaker and flees by canoe
  taxonomy_refs:
  - departure
  basis: Sg̣ā′gia reacts to mistreatment by killing Sg̣atcꜝîdā′łgîñ, taking slaves,
    sparing his wife after speech, and leaving by canoe across the sea.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The departure taxonomy is tentative because the text presents a flight
    after killing, not a formal quest departure.
- id: motif:7
  label: raiders destroy or enslave fishing and traveling parties
  taxonomy_refs: []
  basis: Several episodes report Tsimshian, Tlingit, and Bellabella groups enslaving,
    destroying, or killing people from named communities, including those out fishing.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a repeated conflict pattern in the passage, not a claim of symbolic
    equivalence across traditions.
