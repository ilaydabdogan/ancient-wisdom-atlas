canonical_text:
  quote: ''
  summary: A male traveler goes north to House-point, crosses by means of his hair
    ribbon, enters a newly born child’s skin, and lives as a baby in the chief’s household.
    He alternates between infant form and his own skin, assaults his aunt, causes
    her to forget, makes shell rattles and a dancing skirt from grave mats for a ghost,
    and instructs the ghost to bring deep sleep on the town. After the ghost’s rattle
    produces nightmares, he enters houses and lies with women. An old woman observes
    him leaving and returning to the cradle. The town expels Flood-tide-woman and
    her boy. Mother and child travel toward Skidegate, obtain a sea otter skin made
    into a blanket, and arrive at Great-breakers’ house, where the child is named
    Nᴀñkî′lsʟ̣as-łiña′-i and is described as bearing a name feared by supernatural
    beings. The child later bangs the door and defecates by the fire.
  language: English
  quote_policy: summarized
literal_observations:
