    cradle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Town people whisper that he has lain with his aunt and his mother, and after
    an outbreak they drive Flood-tide-woman and her boy away with abusive language.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Flood-tide-woman and her boy travel toward Skidegate, find a young sea otter
