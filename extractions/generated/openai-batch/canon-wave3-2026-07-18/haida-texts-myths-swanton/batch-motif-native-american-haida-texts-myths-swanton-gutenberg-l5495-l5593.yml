    a common child is so called.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: While staying at Great-breakers’ house, the child repeatedly bangs the swinging
    door; Great-breakers remarks that a common child is doing what supernatural beings
    fear to do.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The child defecates by the fire where he sits with his mother, and Great-breakers’
