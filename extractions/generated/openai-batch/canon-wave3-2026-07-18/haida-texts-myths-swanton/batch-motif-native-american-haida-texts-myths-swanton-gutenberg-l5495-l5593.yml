- id: obs:5
  text: After the traveler wishes the village children would go picnicking, they do
    so the next day, and his aunt brings him to the same place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the others leave the picnic place, the traveler enters his own skin quickly
    and seizes his aunt; afterward he becomes a baby again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The aunt goes home crying but, after the traveler wishes her to forget, explains
    the tear marks by saying she found him eating sand.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: By the sea, the traveler punches holes in tide-brought shells to make two
    dancing rattles and turns grave mats with shells into a dancing skirt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The traveler gives the dancing skirt and a rattle to a ghost and tells it
    to dance before the town and wave the rattle so that deep sleep falls on the people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the ghost dances and waves the rattle toward the town, the people mumble
    in sleep and have nightmares.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The traveler enters houses while the people are asleep and lies with women,
    including his aunt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: An old woman in the house corner does not have a nightmare and observes the
