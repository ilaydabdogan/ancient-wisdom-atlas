  text: The traveler goes northward, throws one end of his hair ribbon across, and
    runs across on it before walking through the town and peering in through cracks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the town chief’s wife gives birth, the traveler waits until evening,
    enters the child’s skin, and becomes newly born.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The child is washed each morning and held by his father; when handed to his
    aunt, he pinches her teats.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The town chief is named Hole-in-his-fin, and his nephew is named Fin-turned-back.
  category: attribute
  evidence_refs:
