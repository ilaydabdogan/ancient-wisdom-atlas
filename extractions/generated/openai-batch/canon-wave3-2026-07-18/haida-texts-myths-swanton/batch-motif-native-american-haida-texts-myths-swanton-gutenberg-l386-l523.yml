canonical_text:
  quote: ''
  summary: 'The passage closes a story in which a mother recognizes her son by a copper
    necklace when preparing to cook him, places him on a board and on the house top,
    and after four nights he emerges from salmon skin and becomes a shaman. Later
    he kills a shining salmon that is his own soul and dies; ritual actions with singing,
    an impersonator, a drum, and a pool where salt and fresh water mingle follow,
    and his drum is later heard as a sign of salmon abundance. An editorial note says
    the story has other North Pacific Coast versions, including Kaigani/Tlingit material.
    The passage then begins “Moldy-forehead”: during famine a child receives a small
    dog-salmon portion, cries, places chewed salmon in a swampy beach place where
    dog salmon become many, travels by canoe with two companions to a town, is warned
    by a half-rock person not to eat the house food, is mocked for eating salmon eggs
    or dung, and receives instructions for catching and roasting salmon.'
  language: English and Haida Skidegate dialect with English interlinear translation
  quote_policy: summarized
