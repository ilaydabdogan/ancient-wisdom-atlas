canonical_text:
  quote: "“they dug into the marks of salt water, and a salmon creek came to be there.”"
  summary: A boy follows his dog to a pool, helps it dig, and a salmon creek appears.
    He builds a fish trap, enlarges the house for drying salmon, feeds his younger
    brother and the dog while working, and repeatedly finds roasted fish missing.
    After his younger brother reports that someone came in and ate it, the boy arms
    himself and waits to watch for the person.
  language: English
  quote_policy: quoted
