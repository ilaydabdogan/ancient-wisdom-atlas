canonical_text:
  quote: ''
  summary: In the tale section headed “Sacred-One-Standing-and-Moving, Stone-Ribs,
    and Upward,” an eldest boy at Sealion-town seeks supernatural power through bathing.
    After his eight younger brothers disappear, his sister helps him bathe in salt
    water, and he breaks several stone boxes as his body/strength increases. He enters
    the sea, catches sea animals for his sister, is pulled by an unseen force, obtains
    a nearly transparent hair/head ornament, swims through named waters, and marks
    a channel. A shoreline figure addresses him as grandson, strikes him with various
    objects, wrestles him, and judges his strength. After returning home, the protagonist
    helps a shrew cross a log, discovers her hidden house, and receives an object
    and instructions for using mallard grease to restore his brothers from a destroyer
    living at Gū′łga lake. He goes to the lake, shoots a mallard, prepares it, and
    saves its entrails.
  language: English
  quote_policy: summarized
