canonical_text:
  quote: ''
  summary: A male traveler reaches a great town, hides the chief’s wife beneath an
    overturned canoe, meets Property-woman on the beach, and learns where the chief’s
    child lies and where to hear news. He enters a cave, unsuccessfully tries to raise
    the chief’s child by rubbing her with his coat, then moves unseen in yellow-cedar
    blankets through the chief’s house and behind a screen, where he sees a hidden
    lake and hears that the chief’s child can be restored if the father’s hat is returned.
    Remembering the chief’s wife, he finds only her bones, rubs them with his coat,
    and she wakes. He and the chief’s wife return tied in the canoe; after a dance,
    a thunderbolt and feathers from the smoke hole strike them and they lose consciousness,
    later awakening on retaining timbers. The chief’s wife is fed, cooking is performed
    with heated stones, and her own clam and mussel shells draw the attention of the
    people and chief before being given to her son-in-law and put behind the screen.
  language: English
  quote_policy: summarized
