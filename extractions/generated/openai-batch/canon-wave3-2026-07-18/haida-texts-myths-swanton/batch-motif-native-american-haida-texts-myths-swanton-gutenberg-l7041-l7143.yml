candidate_motifs:
- id: motif:1
  label: Revival or attempted restoration by rubbing a garment
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The traveler rubs his coat on the chief’s child in an unsuccessful attempt
    to raise her and later rubs his coat on the chief’s wife’s bones, after which
    she awakes as if from sleep.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The passage describes awakening/restoration behavior, not a doctrinal
    account of resurrection; one attempted restoration fails.
- id: motif:2
  label: Hidden or extraordinary domain behind a household screen
  taxonomy_refs:
  - mystical_quest
  basis: After following instructions, the traveler passes behind the screen in the
    chief’s house and sees an unexpected large lake, cranberry-red gravel points,
    canoe songs, and a fire for salt water.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly label this space as otherworldly; the
    motif label is based on the hidden and extraordinary setting.
- id: motif:3
  label: Unseen traveler crossing into a guarded social space
  taxonomy_refs:
  - trickster_boundary
  basis: The traveler puts on two yellow-cedar blankets, walks among the people without
    being seen, and enters the chief’s house to gather news.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The means of invisibility is not explained beyond wearing the blankets;
    the broader section title suggests Raven, but the passage body uses pronouns.
- id: motif:4
  label: Restoration dependent on return of a given-away prestige object
  taxonomy_refs:
  - sacred_exchange
  basis: Property-woman says the problem began because the father’s hat was given
    away, and overheard speech says the chief’s child will be restored when that hat
    is returned.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: medium
  cautions: The passage states the condition but does not fully explain the social
    or ritual status of the hat.
- id: motif:5
  label: Ritualized transition through loss of consciousness and reawakening
  taxonomy_refs:
  - initiation
  - return
  basis: The traveler and chief’s wife tie themselves in the canoe before the chief’s
    house; after a dance, a thunderbolt and pointed feathers strike them, they forget
    themselves, and later come to themselves inside on retaining timbers.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: low
  cautions: The passage does not explicitly call this an initiation or return rite;
    the motif is a cautious pattern candidate based on sequence.
- id: motif:6
  label: Shell objects as socially charged exchange items
  taxonomy_refs:
  - sacred_exchange
  basis: The chief’s wife’s clam and mussel shells cause the people and chief to stop
    and stare; she then has the shells transferred to her son-in-law, and they are
    put behind the screen.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage does not state why the shells command attention or what their
    final placement signifies.
