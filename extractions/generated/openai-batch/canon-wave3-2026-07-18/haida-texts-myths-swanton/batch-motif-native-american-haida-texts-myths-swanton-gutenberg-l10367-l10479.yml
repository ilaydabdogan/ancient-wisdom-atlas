canonical_text:
  quote: ''
  summary: 'The passage closes one story with Supernatural-being-who-went-naked becoming
    the Swamp-robin and notes shamanic power associated with a canoe. It then begins
    the story of He-who-was-born-from-his-mother’s-side: a chief’s daughter is injured
