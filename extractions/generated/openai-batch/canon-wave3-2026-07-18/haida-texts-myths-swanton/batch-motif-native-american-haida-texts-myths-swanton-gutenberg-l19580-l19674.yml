candidate_motifs:
- id: motif:1
  label: captured sleeper gives strategic information
  taxonomy_refs: []
  basis: Two sleeping women are seized, and one later tells the warriors that the
    fort can be taken because it has no guns.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents this as a war-story event; it does not explicitly
    frame the woman as a supernatural guide or mythic helper.
- id: motif:2
  label: approach in guise of visitors before attack
  taxonomy_refs: []
  basis: The advance party moves its paddles slowly as if coming as visitors while
    the fort people gamble and pay no attention; the attackers then fire guns near
    shore.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a tactical war stratagem in the passage; no trickster figure is
    named.
- id: motif:3
  label: raid on fort with enslavement and taking of property
  taxonomy_refs: []
  basis: The attackers enter the houses in a crowd, enslave people sitting inside,
    and take goods and property from the fort.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage is historical or war-narrative in tone rather than explicitly
    mythic.
- id: motif:4
  label: severed head as object of exchange and saying-origin
  taxonomy_refs: []
  basis: A head is cut from a dead body, later requested by Gîtku′n and thrown to
    him, and the narrator says this began a saying about a head cut off.
  evidence_refs:
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage gives a proverb or saying origin, but does not elaborate a
    ritual meaning for the head.
- id: motif:5
  label: tobacco sent through fire to a Kloo man
  taxonomy_refs:
  - sacred_exchange
  basis: After landing, the group sends tobacco to the Kloo man through the fire.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The wording suggests a ritualized transfer, but the passage does not explain
    the purpose, recipient’s condition, or cosmological meaning. The taxonomy link
    is therefore tentative.
- id: motif:6
  label: victory song after raid
  taxonomy_refs: []
  basis: After leaving the fort, the other people sing songs of victory.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage records the action but gives no song text or ceremonial explanation.
- id: motif:7
  label: war story lacking prior-injury prelude
  taxonomy_refs: []
  basis: The closing note explicitly states that, unlike most war stories, this one
    does not begin by describing an earlier injury inflicted by the attacked people.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: This is based on the passage’s own comparative note and should not be
    generalized beyond the stated war-story convention without further evidence.
