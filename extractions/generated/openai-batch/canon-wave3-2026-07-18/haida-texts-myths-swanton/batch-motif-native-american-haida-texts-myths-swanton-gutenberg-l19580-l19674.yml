  claim: The passage explicitly compares this account with a broader war-story pattern
    in which an attack is introduced by an earlier injury committed by the attacked
    people; this account is said to lack that opening.
  claim_level: same_function
  target: Local or corpus-level war-story convention of a prior-injury prelude
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the statement in the closing note; the
    passage does not list the other war stories or define the convention in detail.
