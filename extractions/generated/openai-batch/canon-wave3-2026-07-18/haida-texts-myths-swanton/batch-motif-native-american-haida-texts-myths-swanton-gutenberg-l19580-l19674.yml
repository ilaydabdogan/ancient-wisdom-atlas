canonical_text:
  quote: ''
  summary: A war-party captures two sleeping women near a canoe and mats. One woman
    tells the warriors that a fort can be taken because it has no guns. The attackers
    plan an approach, come as if they were visitors, and then fire on the people of
    the fort. Fighting follows, including deaths, flight, enslavement, taking of goods,
    a severed head, a wounded man, victory songs, capture of a lone canoe traveler,
    sending tobacco through fire to a Kloo man, and the transfer of the severed head.
    The passage ends with a note identifying the Gîtî′sda/Kittizoo as southern Tsimshian
    and stating that this account differs from most war stories by not beginning with
    a prior injury.
  language: English
  quote_policy: summarized
