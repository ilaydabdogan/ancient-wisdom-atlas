canonical_text:
  quote: ''
  summary: 'A sequence of Raven traveling episodes: Raven handles herring and speaks
    a future-location statement; encounters a spider crab; visits an old man whose
    stretched legs cause low tide; interacts with Eagle over roasted fish and a moving
    stump; recruits bird and halibut companions for a canoe expedition against Southeast-wind;
    tricks children and eats their hair seals; transforms a flicker feather and later
    bloodied cedar twigs into flickers for Master Fisherman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven travels by canoe, fills the canoe with herring from the bilge-water
    place, throws them toward shore, and says future people will not see the place
    where they are.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven addresses a spider crab as a childhood comrade, puts his wings into
    its mouth, is carried seaward until sea water flows over him, and is then released.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Raven pulls leaves from salal-berry bushes, sticks spruce needles into them,
    and enters a place where an old man lies with his back to a fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old man stretches out his legs, and it becomes low tide.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Raven and Eagle bring sea eggs and cod from the low tide area to the woods;
    Eagle's black cod drips fat into the fire, while Raven's red cod becomes dry.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Eagle heats stones in the fire and rubs a red-hot stone on a stump when it
    comes toward him; later Raven returns with his face blackened and says bark fell
    on him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven begs birds to join him as canoe companions; Blue-jay insists on coming,
    and Raven pulls him into the canoe by the top of his head, explaining the flattish
    top of Blue-jay's head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Halibut people come down to the beach, agree to accompany Raven, and place
    themselves along the bottom of the canoe like skids.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the enemy town before daylight, halibut lie in rows along the path with
    their heads outward while birds hide behind them.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the enemy comes out wearing a dancing hat, halibut strike or wriggle
    their tails at him until he falls and is brought in; the passage identifies him
    as Southeast-wind.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Raven asks playing children to let him join them, says relatives have gone
    after hair seal for him, then eats all of the children's hair seals, leaving them
    crying.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Raven finds a flicker feather floating near shore, commands it to become a
    flicker, and it immediately flaps its wings.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Master Fisherman wants Raven's flicker; Raven gives it to him and says such
    things are found on an island he owns.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Master Fisherman baits a halibut hook, lowers it into a hole associated with
    vomiting sea water, pulls out a halibut, and his wife prepares it for the three
    of them to eat.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Raven takes Master Fisherman to the supposed flicker island, wounds his own
    nose, puts blood on cedar twigs, throws them around, and repeatedly commands them
    to change to flickers; they fly as a flock.
  category: action
  evidence_refs:
  - ev:11
