candidate_motifs:
- id: motif:1
  label: Trickster traveler crossing from episode to episode
  taxonomy_refs:
  - trickster_boundary
  basis: Raven travels through varied places and social settings, speaks to animals
    and people, tricks children over food, and stages a flicker island through transformations.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
  - ev:11
  confidence: medium
  cautions: The passage does not use an abstract term for trickster; the label is
    inferred from Raven's repeated deceptive and boundary-crossing actions within
    the passage.
- id: motif:2
  label: Etiological changes caused by Raven's actions
  taxonomy_refs:
  - culture_hero
  basis: The passage explains future invisibility of a herring place, the flattish
    top of Blue-jay's head, and the production of flickers from a feather and bloodied
    cedar twigs.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage presents origin-like explanations, but not all results are
    explicitly framed as beneficial culture-making.
- id: motif:3
  label: Animal allies form a canoe war party
  taxonomy_refs: []
  basis: Raven recruits birds and Halibut people as companions, transports them by
    canoe, and uses their arranged bodies in an attack on the enemy identified as
    Southeast-wind.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: No supplied taxonomy family directly matches this animal-war-party pattern.
- id: motif:4
  label: Spoken command transforms object into bird
  taxonomy_refs: []
  basis: Raven commands a floating flicker feather to become a flicker and commands
    bloodied cedar twigs to change into flickers; both transformations occur.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: This is object-to-animal transformation rather than a clear self-shapeshifting
    episode.
- id: motif:5
  label: Body movement alters the tide
  taxonomy_refs: []
  basis: An old man stretches out his legs, and the tide becomes low, enabling Raven
    and Eagle to bring up sea food.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage states the event but does not explain the old man's identity
    or cosmological status.
- id: motif:6
  label: Trickster food taking from children
  taxonomy_refs:
  - trickster_boundary
  basis: Raven persuades children to let him play, then devours all their hair seals
    while they cry.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not provide a moral explanation; the trickster classification
    rests on Raven's deceptive action.
