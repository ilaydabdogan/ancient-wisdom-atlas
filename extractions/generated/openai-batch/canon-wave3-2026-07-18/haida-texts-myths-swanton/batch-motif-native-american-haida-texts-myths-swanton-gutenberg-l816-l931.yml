canonical_text:
  quote: ''
  summary: 'The opening interlinear section describes a dead person ritually handled
    with fire, drumming, singing, a plank, and placement in a tidal inlet, where he
    vanishes at the deep place and his drum is later heard when salmon are plentiful.
    The following narrative begins Îłdī′nī: he is blown out to sea while fishing,
    drifts for days, sings to the Ocean spirit for calm waves, reaches land unable
    to stand, communicates his name to a child, and is rescued by the child’s grandfather
    and wife, then carried into a house and placed near the fire.'
  language: English with Haida interlinear in the opening section
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person in the opening section is said to have died, and the passage says
    he did not know his soul.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other people made the dead person sit up, sat over his head, dressed him like
    someone, moved around near the fire while beating time, beat his drum, and sang
    for him.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After four nights, the people put the dead person into a tidal inlet as he
    had told them to do, using a plank, and also put his drum there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the water, the dead person turned around toward the right and vanished
    at the bottom of a deep place; afterward, when salmon were plentiful, people heard
    the noise of his drum in the deep place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Îłdī′nī lived at End-of-trail town, went out to fish, and was blown away from
    land by wind from the shore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Îłdī′nī drifted at sea through repeated days and nights, saw no land, and
    did not capsize because the wind was not strong.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Îłdī′nī stood in the canoe and sang, asking the Ocean spirit to calm the waves
    and asking his Power to come close to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After a long time in the canoe, Îłdī′nī’s legs were weak or bent together,
    and he was unable to stand or get out.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
- id: obs:9
  text: Îłdī′nī floated near a place where people lived, but they did not see him
    at first.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Îłdī′nī called to a male child, told the child his name, corrected the child’s
    pronunciation, and the child repeatedly said the name so as not to forget it.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The child told its grandfather to find Îłdī′nī and led him to the place; the
    grandfather and a wife came to Îłdī′nī and moved him in his canoe to the front
    of their house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Îłdī′nī showed that he could not stand, made signs with his fingers because
