canonical_text:
  quote: ''
  summary: Tcꜝaawu′nkꜝa and his nephew are carried by otters in a canoe to a town,
    where he is tested as a shaman. An animated rattle leads him to the correct house
    containing a sick chief’s son or otter-being with a bone spear on his body. Tcꜝaawu′nkꜝa
    performs around the fire, uses drum-sound, removes and reinserts the spear, endures
    mockery from other shamans, repels them with rotten urine mixed with blue hellebore,
    seeks halibut hooks, and finally saves the chief’s son after receiving them.
  language: English
  quote_policy: summarized
