candidate_motifs:
- id: motif:1
  label: maritime raid and boarding combat
  taxonomy_refs: []
  basis: The passage describes attacking a large canoe from other canoes, shooting
    at it, approaching, boarding, and fighting at close range.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: This is a descriptive war-raid motif label, not a mapped taxonomy family
    from the supplied list.
- id: motif:2
  label: surrender into enslavement after battle
  taxonomy_refs: []
  basis: Multiple Tlingits make surrender gestures, let themselves be enslaved, or
    are bound after being subdued; the passage counts nine slaves.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage gives no mythic explanation of slavery beyond the literal
    raid context.
- id: motif:3
  label: taking heads and property as war spoils
  taxonomy_refs: []
  basis: The attackers take severed heads, slaves, and all property from the attacked
    canoe.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not state ritual meaning for the heads or property; extraction
    should remain literal.
- id: motif:4
  label: war song contrasted with personal grief
  taxonomy_refs: []
  basis: The warriors sing war songs, while the narrator says he sings differently
    because two younger brothers were killed.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives the emotional contrast but does not elaborate a formal
    lament pattern.
- id: motif:5
  label: apparent pursuers revealed as driftwood and gulls
  taxonomy_refs: []
  basis: The travelers fear pursuing full canoes, but the narrator later sees that
    the sight was only driftwood with sea gulls on top.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not explain whether the misperception is supernatural,
    psychological, or ordinary visual confusion.
- id: motif:6
  label: killing a whale calf and trading oil for goods
  taxonomy_refs: []
  basis: A young whale is killed, its oil is taken to Port Simpson, and goods are
    bought until the canoes are filled.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: Although exchange is present, the passage describes ordinary trade rather
    than a clearly sacred exchange.
- id: motif:7
  label: post-battle cooking and feeding enemies or captives
  taxonomy_refs: []
  basis: After the raid and pursuit scare, a fire is started, humpbacks are roasted,
    the narrator’s group eats, and food is also given to the Tlingits.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage does not specify whether the Tlingits fed are captives, survivors,
    or another group.
