canonical_text:
  quote: ''
  summary: A first-person narrator describes a Haida attack on a large Tlingit canoe,
    close combat with knives, spears, and guns, the surrender and enslavement of some
    Tlingits, the taking of severed heads and property, killing a young whale and
    trading its oil, singing war songs while grieving killed brothers, mistaking driftwood
    and gulls for pursuing canoes, and later cooking food and giving food to Tlingits.
  language: English
  quote_policy: summarized
literal_observations:
