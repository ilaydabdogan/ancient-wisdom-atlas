  text: Skᴀ′ngwai’s father shoots people in a very large canoe whose occupants stand
    in lines in the middle while others paddle at the sides.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The occupants of the large canoe motion the attackers away with their hands,
    and the attackers stop shooting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gana′-i’s canoe approaches; a Tlingit in the middle stands with a gun, points
    it, is speared with a short-handled bone spear, drops the gun, and has his intestines
    come out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator boards the Tlingit canoe, is stabbed in the shoulder, and strikes
    several opponents with a long knife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An unarmed youth makes a hand motion of surrender and is thrown into the attackers’
