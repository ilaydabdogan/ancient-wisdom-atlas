  quote: "“She was he himself born again.”"
  summary: An unnamed man conceals birth-associated things, marries a chief’s daughter,
    receives a town, feeds his kin through supernatural abundance, survives hostile
    supernatural tests by his father-in-law, receives ten whales, provides for an
    uncle, is reborn as a woman born from his wife’s swollen thigh, departs to renew
    his old town with medicine-spit, and his uncles are later taken upward by the
    Moon and cared for as servants.
