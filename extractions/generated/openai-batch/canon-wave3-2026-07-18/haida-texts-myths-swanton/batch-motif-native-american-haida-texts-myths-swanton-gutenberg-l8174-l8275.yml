canonical_text:
  quote: "“Something with fire burning in its eyes came in and stood there.”"
  summary: In a dark house, a boy encounters Ga′ogila, a fire-eyed being who swallows
    roasted salmon and persons above; the boy shoots and pursues him. The boy then
    protects his younger brother and dog under his father’s drum and leaves. He meets
    Master Carpenter making a canoe, takes and returns his hammer, and becomes involved
    in separating two nested canoes with wedges and cedar-bark rings. Master Carpenter
    brings him home and gives him his daughter as wife. The boy later hears a nightly
    drum, learns that people are trying to cure the town chief, crosses by canoe with
    his wife, and sees the being he had shot suffering with arrows in him.
  language: English
  quote_policy: quoted
