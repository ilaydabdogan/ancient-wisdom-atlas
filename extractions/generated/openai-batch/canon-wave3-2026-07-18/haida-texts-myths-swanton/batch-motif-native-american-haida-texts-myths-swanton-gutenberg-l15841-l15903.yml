canonical_text:
  quote: ''
  summary: A man at Qꜝadō′ is rejected by a woman who repeatedly tells him to remove
    his hair before she will love him. After she finally refuses him, he withdraws,
    makes arrows, shoots them into the sky to form a way upward, and reaches the Moon’s
    town. The Moon, addressed as his grandfather, restores his appearance with water
    and a comb, instructs him to turn his back on the woman, and sends him back down.
    When the woman comes to look at him, he turns away, and she dies fascinated by
    the sight of him. Editorial notes compare the story with a Masset story and with
    the story of Big-tail.
  language: English
  quote_policy: summarized
