  label: STORY OF THE TWO TOWNS THAT STOOD ON OPPOSITE SIDES OF NASS RIVER / SLAUGHTER-LOVER.
    / THE WOMAN AT NASS WHO FLED FROM HER HUSBAND / THE REJECTED LOVER; lines 15841-15903
