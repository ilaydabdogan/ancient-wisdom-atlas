- id: obs:2
  text: The woman told him to remove his hair, then his eyebrows and eyelashes, then
    his mustache and body hair, and after he complied she still refused him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the refusal, the man stopped going among people, went out only at night
