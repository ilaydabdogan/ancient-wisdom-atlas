canonical_text:
  quote: ''
  summary: A band of brothers repeatedly encounters destructive supernatural forces.
    A fire pursues them and burns several brothers until the surviving medicine-bearer
    uses medicine and the old man's head to stop it, then revives the burned brothers.
    North, who lies with their sister, is mocked and later freezes the brothers, but
    the medicine-bearer defeats the ice and restores them. Another host, identified
    as Greatest Wizard, secretly stores breath on cedar bark in a perforated cedar
    container; Sawałī′xa observes and reverses the act, causing the wizard's death.
    Later North causes another episode involving a stump, broken weapons, fire, and
    disappearance. The brothers then settle at a mountain of ground hogs. The next-to-youngest,
    unsuccessful in hunting, is left behind, marries a woman who teaches him how to
    catch ground hogs, and then disobeys her warning by trapping a whitish ground
    hog.
  language: English
  quote_policy: summarized
