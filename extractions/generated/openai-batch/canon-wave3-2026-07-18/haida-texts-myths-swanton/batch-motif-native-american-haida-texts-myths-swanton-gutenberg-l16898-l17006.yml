canonical_text:
  quote: The house had three stockades. Not a single bullet reached the house.
  summary: 'The passage closes an account of fighting with Russians, in which Qała′x
    is alive after victory and receives goods. An editorial note identifies that episode
    as a native account connected with Baranof and the Indians at Sitka, while warning
    that it differs greatly from Russian accounts. The main section, told by Richard
    of the Middle-gîtî′ns, recounts a sequence of armed conflicts with the Town-of-Tcꜝā′ał
    people: a whisky-related fight at Dadag̣ē′ni, a dispute over a ramrod, an incident
    involving Sitting-chieftainess, killings of slaves, a major property distribution
    by Nᴀñ-gut-tcî′ng̣a, shootings around a damaged canoe, defense from a stockaded
    house and trench, and final preparation with washing, tallow, face paint, clothing,
    and black head handkerchiefs.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening episode reports renewed fighting with Russians, seizure of guns,
    coats, hats, and swords, and later delivery of property, clothing, food, rum,
    and ammunition to Qała′x or the winners.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An editorial note says the informant heard the Russian-fighting story from
    an old Tlingit from the Stikine and connects it with the struggle between Baranof
    and the Indians at Sitka, while stating that it differs greatly from the Russian
    account.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Richard section begins with a fight at Dadag̣ē′ni involving the Town-of-Tcꜝā′ał
    people; whisky drinking, a bitten-off nose, all-night shooting, and many deaths
    are reported.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A later conflict involves Nᴀñ-gut-tcî′ng̣a’s grandfather, two slaves, a gun,
    and a ramrod taken from a slave who held Nᴀñ-gut-tcî′ng̣a’s gun; the ramrod is
    retained as payment.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: When a vessel of the Iron people arrives, Nᴀñ-gut-tcî′ng̣a goes out to it
    and returns with many kinds of food; during his absence Sitting-chieftainess goes
    to Brave-in-his-belly for the ramrod and is pushed down.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Nᴀñ-gut-tcî′ng̣a and Brave-in-his-belly send announcements, four slaves
    belonging to an antecedent 'him' are killed, and Brave-in-his-belly kills the
    one slave he owns.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: On the following day, Nᴀñ-gut-tcî′ng̣a receives a large amount of property,
    including ten slaves, three hundred blankets, five big canoes, and other goods,
    and property is distributed to named groups, named individuals, and house chiefs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After several invitations and meals, a noise arises near a canoe that had
    been given to the narrator’s group; someone says the Town-of-Tcꜝā′ał people have
    broken it up, and armed people gather while the guests are told not to go out.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Town-of-Tcꜝā′ał people stand in lines around the canoe with guns ready;
    a Town-of-Tcꜝā′ał boy shoots at Nᴀñ-gut-tcî′ng̣a, the narrator shoots someone,
    and multiple dead and wounded bodies are described.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After further shooting, the guests are taken to Nᴀñ-gut-tcî′ng̣a’s house,
    and the sound of fighting ceases for a time.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The house is described as having three stockades; bullets do not reach it,
    and defenders later use a trench toward the beach to shoot back and kill two attackers.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: After four nights of shooting at the house, Nᴀñ-gut-tcî′ng̣a has the people
    eat, wash their faces, apply tallow, paint their faces, put on clothing, and tie
    black handkerchiefs around their heads.
  category: sequence
  evidence_refs:
  - ev:13
