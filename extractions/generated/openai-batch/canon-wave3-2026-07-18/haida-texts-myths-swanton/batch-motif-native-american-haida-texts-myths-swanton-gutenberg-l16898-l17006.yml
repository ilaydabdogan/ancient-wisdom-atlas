candidate_motifs:
- id: motif:1
  label: victory followed by goods from defeated outsiders
  taxonomy_refs: []
  basis: The Russian-fighting episode reports victory, many Russian deaths, and later
    property, clothing, food, rum, and ammunition being given to Qała′x or the winners.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is presented as a historical-style narrative rather than a mythic
    episode; the editor warns that few real facts may be preserved.
- id: motif:2
  label: feud escalation from a disputed object and insult
  taxonomy_refs: []
  basis: The ramrod dispute, Sitting-chieftainess being pushed down, announcements,
    slave killings, and renewed fighting form a sequence of escalating conflict.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: Pronoun references in the slave-killing passage are ambiguous, so some
    participant relations remain uncertain.
- id: motif:3
  label: compensatory property distribution after violence
  taxonomy_refs: []
  basis: After slave killings and announcements, a large property payment is made
    to Nᴀñ-gut-tcî′ng̣a and then distributed to groups, named individuals, and house
    chiefs.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not explicitly state the legal or ritual meaning of the
    distribution; the label is descriptive.
- id: motif:4
  label: fortified house under attack
  taxonomy_refs: []
  basis: Attackers shoot at the house, which has three stockades; bullets do not reach
    the house, and defenders fire back from a trench.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: This is a battle pattern in a historical narrative, not a supernatural
    protective motif.
- id: motif:5
  label: pre-battle or crisis adornment with tallow, paint, clothing, and headcloths
  taxonomy_refs: []
  basis: After four nights of shooting, Nᴀñ-gut-tcî′ng̣a directs the people to wash,
    apply tallow, paint their faces, put on clothing, and tie black handkerchiefs
    around their heads.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage describes the actions but does not explain their symbolic
    or ritual meaning.
