  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before the fatal visit, the man goes for water with the one he used to love.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The grizzly bear throws the man about and tears off his limbs; the cubs then
