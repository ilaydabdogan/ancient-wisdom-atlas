canonical_text:
  quote: ''
  summary: The passage recounts a man repeatedly visiting a grizzly bear and her young,
    bringing hair seal food, then being killed by the bear after an encounter with
    a former beloved; the cubs kill their mother and later kill people until they
    hear themselves named as kin. A separate section tells how featherless Woodpecker
    enters a barkless tree, meets an old grandfather, receives feathers and red coloring,
    and begins a renewed life. An explicitly marked alternate version tells of Gāts,
    a hunter captured by a bear, hidden by the bear’s wife, married to her after the
    he-bear is killed, warned not to look at his former wife, and finally killed with
    his sons after he violates that warning.
  language: English
  quote_policy: summarized
