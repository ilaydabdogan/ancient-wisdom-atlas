  - ev:10
  confidence: high
  cautions: The passage describes food gifts and visits, but does not explicitly define
    them as ritual exchange.
- id: motif:3
  label: warning or taboo involving a former beloved or wife followed by death
  taxonomy_refs: []
  basis: The first episode places a water trip with a former beloved before the bear’s
    changed and fatal behavior; the alternate version explicitly warns Gāts not to
    look at his former wife, and he is killed after smiling at her.
  evidence_refs:
  - ev:3
  - ev:9
  - ev:10
  confidence: medium
  cautions: The causal link is explicit in the alternate version; in the first episode
    the passage gives sequence and changed behavior but does not state a formal warning
    before the water trip.
- id: motif:4
  label: children avenge a parent’s killing and become dangerous wanderers
  taxonomy_refs: []
  basis: After the grizzly bear kills the man, the cubs tear their mother to pieces,
