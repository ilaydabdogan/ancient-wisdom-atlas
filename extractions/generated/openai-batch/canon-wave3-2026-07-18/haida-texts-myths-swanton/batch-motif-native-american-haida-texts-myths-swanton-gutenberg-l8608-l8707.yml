  - ev:3
- id: obs:3
  text: The man hunts hair seal, steams it at a camp fire, returns to the inlet, and
    throws off a hair seal near the grizzly bear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grizzly bear mother at first does not look toward the man; later the hair
    on the back of her neck stands up.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The man’s companions warn him to go back when they see the changed condition
