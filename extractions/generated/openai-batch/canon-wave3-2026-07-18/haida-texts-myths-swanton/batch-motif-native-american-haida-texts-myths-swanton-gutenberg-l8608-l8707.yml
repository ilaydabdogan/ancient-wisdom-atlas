  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Woodpecker is traveling on a grass-covered island without feathers and begins
    hammering on a large barkless tree in the middle of the islands.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: A voice tells Woodpecker that his powerful grandfather wants him to come in;
    Woodpecker looks into a hole at the foot of the tree and sees an old white man
    far back inside.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old man removes nested boxes, takes out a wing-feather, adds a tail, dresses
    Woodpecker, makes him red above, tells him to start life anew, and Woodpecker
    goes out flying and hammering on the tree.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the alternate version, Gāts is captured by a bear and carried to the bear’s
