- id: motif:2
  label: food-bearing return visits to an animal spouse or animal family
  taxonomy_refs: []
  basis: The man repeatedly hunts and brings hair seal near the grizzly bear; Gāts
    also gives food to the bear during later visits.
  evidence_refs:
