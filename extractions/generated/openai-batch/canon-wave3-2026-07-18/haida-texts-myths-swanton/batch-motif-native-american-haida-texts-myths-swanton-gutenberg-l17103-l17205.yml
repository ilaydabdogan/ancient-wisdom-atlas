canonical_text:
  quote: ''
  summary: A first-person account describes Skidegate and other Haida trading parties
    at Port Simpson, a dispute over dry halibut, escalating fighting with Tsimshian,
    attempted peacemaking, renewed pursuit, deaths, enslavement, survivor rituals
    with fire, compensation through property, and later related war preparations and
    attacks during trade.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Skidegate people traveled to Port Simpson in sixty canoes to trade dry halibut,
    and Pebble-town people also went there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tsimshian associated with a white man distributed sticks to the Haida and
    later took them back; the narration says this was done because they were counted
    before a planned winter destruction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dispute over the size of dry halibut involved Bufflehead, the wife of Lgiäx,
    and Lgiäx’s daughter, and dry halibut was thrown.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The conflict escalated from stone throwing to gunfire, including night shooting
    at Skidegate beach shelters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator lacked a gun at first, borrowed one, and dug a hole in the sand
    for shelter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator shot at armed opponents, including one behind a log and others
    on a hill behind the Skidegate position.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After five nights of shooting, the Tsimshian came to dance and sought peace
    because Lgiäx’s nephew had been killed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Two women walking seaward from the town were enslaved by the Skidegate party.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Property was given during the attempted peacemaking, and an arrangement was
    made for the Haida to go with the Tsimshian to Laqꜝalā′m.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the Skidegate people moved toward their canoes, Tsimshian took provisions
    left on shore and then pursued, shooting into canoes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Two canoes with dancers remained, and the narrator says he jumped into the
    stern of a canoe and shot both dancers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Canoes drifted away empty during the fighting and departure.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Tsimshian pursued the fleeing Skidegate people far out to sea and enslaved
    many of them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Survivors landed at ʟꜝg̣a′odana-i during heavy rain, which was named “The-rain-upon-the-skins-of-dead-bodies.”
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: At daylight the narrator built a big fire, and the wounded sat around it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A man of Those-born-at-House-point quarreled with the narrator, they were
    kept apart, and later the man made peace with him and gave him whisky.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage states that fifty canoe loads were destroyed, while the Pebble-town
    people did not cry because all of them escaped.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:18
  text: Food was sent through the fire to those who had been unable to escape, and
    the survivors stayed awake in canoes because they feared renewed pursuit.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: After returning to Skidegate, blame was placed on Bufflehead, property was
    requested from her, and her husband Lū′g̣ot gave all his property to the town
    while preparing a potlatch.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: Gîtî′ns’-servants came with paddles on their shoulders and said they had come
    to go to war for Gudiqā′yiñao’s father before he could ask for blood money.
  category: action
  evidence_refs:
  - ev:12
- id: obs:21
  text: In a later trading episode, many Masset people, said to be sixty canoes, traded
    and then a Tsimshian shot at the canoes; the bullet struck X̣ᴀ′na’s canoe.
  category: sequence
  evidence_refs:
  - ev:13
