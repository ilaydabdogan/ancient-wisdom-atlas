candidate_motifs:
- id: motif:1
  label: Trading expedition turns into armed conflict
  taxonomy_refs: []
  basis: Large canoe groups travel for trade, but a dispute and then stoning and gunfire
    lead to a destructive conflict.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a historical conflict pattern in the passage rather than a supernatural
    mythic motif.
- id: motif:2
  label: Visitors counted before planned destruction
  taxonomy_refs: []
  basis: Sticks are distributed to the Haida and taken back; the narration states
    this was done to count them because their destruction was planned during winter.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives the explanation directly but does not describe the later
    winter plan being carried out.
- id: motif:3
  label: Peace dance followed by renewed violence
  taxonomy_refs: []
  basis: Tsimshian come to dance and seek peace, property is exchanged, but the sequence
    then shifts to seizure of provisions, pursuit, and shooting into canoes.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly say the dance was deceptive; it only narrates
    the sequence.
- id: motif:4
  label: Empty drifting canoes after battle
  taxonomy_refs: []
  basis: During the pursuit and shooting, the account states that canoes drifted along
    empty and later that canoes drifted off empty.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not specify whether each empty canoe indicates death,
    flight, or abandonment.
- id: motif:5
  label: Survivors gather around fire after disaster
  taxonomy_refs:
  - fire
  basis: After the landing in heavy rain, the narrator builds a big fire and the wounded
    sit around it.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The motif is extracted from literal survivor action; no symbolic interpretation
    is asserted beyond the fire reference.
- id: motif:6
  label: Food sent through fire to the absent dead or lost
  taxonomy_refs:
  - fire
  basis: The survivors send food through the fire to those who had been unable to
    escape.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The phrase “unable to escape” implies absent victims, but the passage
    does not give a full ritual explanation.
- id: motif:7
  label: Property compensation after communal blame
  taxonomy_refs: []
  basis: After return, blame is laid on Bufflehead, property is requested, and her
    husband gives all his property to the town while preparing a potlatch.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The social meaning of the property giving is not explained beyond the
    passage statements.
- id: motif:8
  label: Blood money and war support
  taxonomy_refs: []
  basis: Before Gudiqā′yiñao’s father can ask for blood money, Gîtî′ns’-servants arrive
    with paddles and say they have come to go to war for him.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not narrate the subsequent war action in this excerpt.
- id: motif:9
  label: Repeated trading-party attack pattern
  taxonomy_refs: []
  basis: The opening Skidegate trading expedition and the later Masset trading expedition
    both involve large canoe parties trading with Tsimshian and later being shot at.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:13
  confidence: medium
  cautions: The later Masset episode is brief, so the degree of parallelism is limited.
