  summary: The passage first contains Haida transcription with repeated direct-speech
    formulae and named beings. It then begins an English-translated story in which
    Porcupine steals Beaver’s plentiful food, denies it by invoking supernatural status,
    fights Beaver, wounds Beaver with spines, and is later punished by Beaver’s kin,
    who collapse his house, seize him, and exile him to a sea island with two trees.
    Near starvation, Porcupine calls on animal friends, his father, and all friends,
    but receives no help.
