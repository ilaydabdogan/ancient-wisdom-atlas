canonical_text:
  quote: ''
  summary: Dogs bring whales to an unnamed man. His wife prepares a rotted mixture
    of urine and blue hellebore, heats it with stones, and pours it into the ocean,
    raising waves that prevent the dogs from landing. The dogs carry islands out to
    sea while trying to scramble ashore, leave claw marks at Skidegate channel, and
    are associated with named places called after their actions. The man stores whale
    grease in boxes, sells it, and becomes a chief. A source note directs comparison
    with another story.
  language: English
  quote_policy: summarized
