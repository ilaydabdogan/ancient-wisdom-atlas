  text: The dogs brought in two whales apiece, with one whale laid between the ears
    and one near the tail of each.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife is described as becoming two-faced or treacherous; she learned that
    the dogs always went out at daybreak and allowed urine and blue hellebore to rot
    together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the dogs were coming in, the wife put hot stones into the rotted mixture
    and poured the boiling mixture into the ocean.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the mixture entered the ocean, wind raised big waves and there was no
    place where the dogs could come ashore.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dogs carried some islands out to sea while trying to scramble onto them;
