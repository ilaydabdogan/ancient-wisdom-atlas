canonical_text:
  quote: ''
  summary: The passage first gives the ending of an English narrative in which an
    unnamed man is taken back in a large canoe with elk skins, boxes of grease, and
    halibut hooks. By morning the halibut hooks have vanished, while the cargo and
    canoe are revealed as seaweed, kelp heads with liquid, and a rotten log; the passage
    states this was the first time people learned about halibut hooks. A following
    note defines Tcꜝaawu′nkꜝa as both a supernatural being and a shamanic name, and
    connects the name and story with Tlingit tradition and Haida shamanic practice.
    The remainder is a Haida-language section headed TCꜝAAWU′NKꜝA.
  language: English and Haida/Skidegate dialect
  quote_policy: summarized
