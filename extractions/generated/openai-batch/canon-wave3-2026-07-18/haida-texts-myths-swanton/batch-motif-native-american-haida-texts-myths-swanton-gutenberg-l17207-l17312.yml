canonical_text:
  quote: ''
  summary: The passage recounts a sequence of raids, escapes, retaliatory killings,
    slave-taking, victory songs, intergroup feuds, a drowned chief whose grave post
    is left unfinished, the killing of a shaman whose matted hair moves over his head
    after death, and a ten-day town fight ending with a peace proposal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A son seized a gun and shot into a crowd on shore; the Tsimshian then pursued,
    destroyed people, and took slaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A canoe at Laxanē′st was destroyed, but two men and a woman escaped and later
    were saved by leaving in canoes when wood-gatherers came.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: People in a Port Simpson house who could not escape were later given a canoe
    by the Iron people and got home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Five families at Masset drank sea water and practiced fighting; a cartridge
    box caught fire and a man was burned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After six nights of drinking sea water, the war party set out in ten canoes
    and sighted canoes going out after salmon.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The attackers shot people in canoes, upset canoes, struck people in the sea,
    took heads, killed twenty-eight people in one day, and enslaved one brave Tsimshian
    man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Masset people returned singing victory songs and were said to have made
    accounts even, while the Skidegate people had not.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gî′tg̣ax̣ī′lîña informed his Sand-town brothers-in-law that their sister had
    been killed; they raised four canoes, attacked Tsimshian canoes, enslaved women,
    and returned singing victory songs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Yä′dᴀs and the Town-of-Tcꜝā′ał people fought each other for many years,
    killed one another wherever they met, and did not make peace.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Voice-at-evening drowned; his nephews later went for his grave post, but the
    Yä′dᴀs killed five Town-of-Tcꜝā′ał people, and the grave post remained there permanently.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The shaman Tcꜝā′nūt was shot with ten bullets; after people walked around
    him, bunches of his matted hair rose from the ground and lay over his head.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: During a ten-day town fight, no one had fire or water; chiefs’ wives tried
    to fetch water, but their buckets were smashed with stones, and later peace was
    suggested.
  category: sequence
  evidence_refs:
  - ev:13
