canonical_text:
  quote: ''
  summary: A figure later identifying himself as Îłdī′nī goes fishing by canoe and
    is blown offshore by wind. He drifts for repeated days and nights without seeing
    land, sings from the canoe to an ocean spirit asking that the waves be calmed
    and the sea made calm, and continues drifting through fog and weakness. He eventually
    floats near land, but nearby people do not see him. A small male child who does
    not speak well sees the canoe near a rock. Îłdī′nī calls to the child, identifies
    himself, asks the child to repeat his name, and the child says it incorrectly.
  language: Haida (Skidegate) with English interlinear translation
  quote_policy: summarized
