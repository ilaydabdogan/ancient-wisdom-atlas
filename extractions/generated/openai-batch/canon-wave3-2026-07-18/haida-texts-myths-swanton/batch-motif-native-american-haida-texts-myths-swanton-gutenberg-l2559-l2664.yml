canonical_text:
  quote: ''
  summary: A chief's son loses his father's property, town, slaves, and family in
    gambling against a cloud-covered opponent. After the townspeople depart, he floats
    on a cedar beam, descends through the water by a two-headed kelp or house pole
    to his powerful grandfather, receives food, special gambling implements, tobacco
    seeds, cleansing with a hawk feather, and instructions, then returns to gamble
    again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief's son made gambling sticks and sent his father's slave each day to
    call anyone who wished to gamble.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A gambling opponent appeared with only his hands visible and his upper body
    enveloped in clouds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief's son gambled with the cloud-covered opponent and lost his father's
    property, slaves, five rows of houses, and then his father, mother, and sisters.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After the losses, the people prepared canoes, boarded them in fog, and went
    away until their voices faded.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The chief's son pushed his father's cedar beam to the water, used his gambling-stick
    bag as a pillow, put on a marten-skin blanket, lay on the beam, and floated for
    many nights in calm weather.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A voice, later associated with a grebe's beak, told him that his powerful
    grandfather asked him to come in; he was floating against a two-headed kelp.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: He grasped the kelp head and went down on it; after entering the water, he
    saw it as a two-headed house pole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the house below, the grandfather invited him inside, said he had heard
    of his floating after losing the town, and gave him food after his fast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The grandfather sent him to gather gambling-stick wood, refused several kinds,
    and accepted limbs from Raven's-berry bushes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The grandfather made gambling sticks from the accepted wood, marked two with
    coals, placed a sea otter figure on one and a young sea otter figure on another,
    and had five large clam shells with cumulus-cloud designs and five mats made as
    stakes.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The grandfather instructed him to float back, sit at the town ready to gamble
    with the former winner, put the sea otter stick on his right shoulder and the
    young sea otter stick on his left shoulder, and divide tobacco seeds among watchers
    on both sides.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The grandfather opened five nested boxes, used a hawk feather to clean blood
    from both eyes, then used it in the mouth to remove dead lice, explaining that
    blood in the eyes from seeing the sister's bloody heel was why the chief's son
    had lost.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The grandfather also told him to choose the pile with the longest smoke while
    gambling and later the one with short smoke; the chief's son followed this instruction,
    losing at first and then taking the light-smoke pile, the djîl.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: When he missed, one of his father's slaves laughed and his name, Sounding-gambling-sticks,
    was discovered; afterward the stick on his right shoulder pulled out his djîl,
    and the sweet tobacco kept watchers from reporting it.
  category: sequence
  evidence_refs:
  - ev:14
