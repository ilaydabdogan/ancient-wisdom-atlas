canonical_text:
  quote: ''
  summary: A dispute escalates after Wada refuses a property settlement for a woman
    taken from his town. Chief-discovered likewise cannot be restrained, and the two
    sides agree on a day to fight. The attacking people arrive by canoe, the women
    withdraw to the woods, and combatants form lines on the beach. A call for “spear-whetstones”
    is answered mistakenly, but the intended call brings forward ten reckless and
    brave fighters who spear Chief-discovered’s people. Chief-discovered is killed
    while Wada escapes. Common-town people watch from canoes and carry dead bodies
    without fighting. Wada’s wife and children do not return, and her body is not
    found. Chief-discovered’s body is left in a canoe in the bilge-water because many
    friends were lost through him. A note identifies both families as Ninstints Raven-clan
    families and connects one family name to an islet said to be first land above
    flood waters.
  language: English
  quote_policy: summarized
