  summary: A pursued man escapes after another slave falls and Weasel bites him; the
    man reaches his canoe, uses blue hellebore to repel pursuing killer whales, returns
    with his wife to Qꜝadō′, confines her in five nested boxes, and later finds her
    gone through a hole. An editorial note links these episodes to Tsimshian and Masset
    parallels and notes the prominence of the killer-whale episode in Haida versions.
