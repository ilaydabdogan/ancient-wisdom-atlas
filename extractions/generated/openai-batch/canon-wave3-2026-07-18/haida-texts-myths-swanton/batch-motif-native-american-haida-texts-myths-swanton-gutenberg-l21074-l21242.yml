canonical_text:
  quote: ''
  summary: Editorial notes identify birds, plants, places, names, and interpretive
    details attached to Haida narratives. Motif-relevant notes mention swallowed town
    inhabitants whose bones are let out, instruction to Heron about future behavior
    or appearance, a possible Eagle-clan connection to tobacco, alternate supernatural
    identities, power gained from hearing, transformation into fine articles, emergence
    from the ground instead of a doorway, two women resolving into one, supernatural
    fire-lighting, destruction of hostile supernatural powers, a wife's disappearance
    at night explaining a camp custom, house-pole watchmen, and a figure identified
    as The-one-in-the-sea.
  language: English
  quote_policy: summarized
