canonical_text:
  quote: ''
  summary: A child repeatedly says the name Îłdī′nī so as not to forget it, forgets
    once, returns to be told again, then reaches a house and tells a grandfather to
    find Îłdī′nī. The child leads the grandfather to the named person. The found person
    is brought by canoe to a house, is unable to stand, does not know the local language,
    and communicates with finger signs. Household people warm him by fire, warm objects,
    and warm water, especially on his head and legs. He gradually straightens his
    legs, stands and walks with a stick, and is later given warmed water with grease,
    food, and a spoon.
  language: English with Haida interlinear text
  quote_policy: summarized
