canonical_text:
  quote: "“Earth, even, become people”"
  summary: A shapeshifting figure escapes rising seawater with his mother, stops the
    water in raven form, gains a title from his uncle, brings forth people from the
    ground, obtains large quantities of food for a prolonged distribution, travels
    with his father Qî′ñgi, learns a practice that makes him insatiably hungry, is
    excluded, and later causes his father’s house to begin falling by singing and
    striking his head against it.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A strong current of seawater pours from a corner of the house and rises until
    it reaches the roof.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The main figure places his mother in his armpit, enters a bufflehead skin,
    swims and dives in the current, and floats out through the smoke hole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The main figure enters a raven skin, flies upward, puts his beak into the
    sky while his tail floats on the water, kicks the water, speaks to it, and the
    water stops and melts downward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The main figure sees smoke from his uncle’s house, becomes angry, flies down
    into it, and his uncle says he shall own the title Chief-of-chiefs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The main figure says Qî′ñgi is coming to adopt him, and his uncle addresses
    the mother as Flood-tide-woman while telling her to stop the child from talking.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: People come dancing on ten canoes; the main figure puts on two sky blankets
    and walks around on retaining planks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The main figure kicks the ground in several parts of the house area; the ground
    cracks, drums are thrown up, people pour out, and lines of dancers and named peoples
    sing different songs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The main figure sends young men to several named women for food; salmon and
    cranberries are brought, the food reaches roof level, and distribution continues
    for ten days described as ten winters.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Qî′ñgi’s village, feasts are held; the main figure does not eat, while
    two big-bellied persons consume boxes of cranberries poured into their mouths.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The main figure finds places where cranberries are being blown out and stops
    the holes with moss; the big-bellied persons explain a practice involving bathing,
    scratching over the heart, and swallowing scabs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After following the described practice, the main figure becomes hungry, repeated
    feeding does not satisfy him, and he is shut out after being seen eating cranberries
    that had floated ashore from people’s dung.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The main figure asks his father to let him in, offers mainland animals, sings
    while striking his head against the house, and the house begins to fall over before
    black bear and marten skins are snatched from him.
  category: sequence
  evidence_refs:
  - ev:11
