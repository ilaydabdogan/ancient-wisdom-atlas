canonical_text:
  quote: ''
  summary: 'A male protagonist travels through several encounters: he enters the belly
    of a person-like water being and releases his younger brothers’ bones, makes hemlock
    pieces into future fishhooks, repeatedly revives his seven younger brothers with
    medicine, ambushes and skins a wā′sg̣o from the ocean, meets Gā′gix̣it-woman while
    his brothers are trapped, fails to enter his mother’s house, loses his blankets,
    catches and stretches a phosphorescent fur-like skin that is mocked as sky blankets,
    and finally comes upon a sobbing figure whose earrings carry small human beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The male protagonist travels at daybreak to a bare, trodden place in the woods
    with human footprints and whistles there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person-like being with hair floating on the water approaches; the protagonist
    drops flat and later comes to himself inside its belly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Inside the being’s belly, the protagonist applies medicine to himself, stretches
    himself, and his younger brothers’ bones pour out; he is also thrown out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The protagonist cuts or strikes moving hemlock, sets aside branches, throws
    short pieces into trees, spits after them, and says future people will use them
    as fishhooks for food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The protagonist spits medicine on his younger brothers; they arise, are told
    to go to their former sitting place, and then all seven disappear one after another.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The protagonist sharpens hemlock limbs, puts them over fire, goes at midnight
    to Sealion-town, and climbs a tree near the end of a trail.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two burning pieces of pitchwood come out of the ocean like lanterns before
    a wā′sg̣o appears carrying one whale in its mouth and another in the curl of its
    tail.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The protagonist sits between the wā′sg̣o’s ears, pushes hemlock limbs into
    its ears, returns to the tree, and the being falls at daybreak after the raven
    calls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Thunder and lightning occur while the protagonist skins and cuts open the
    wā′sg̣o; his younger brothers’ bones burst out, and he revives them with medicine
    before they again disappear one by one.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The protagonist hears a drum-like sound, follows a recently trodden trail
    to a house, and sees a woman in a brownish red cedar-bark blanket twisting threads,
    which makes the drum-like noise.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The protagonist uses a broken salmon-berry bush to poke the woman as she works;
    she turns, smiles at him, and talks with him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The younger brothers are heard making a repeated cry and are trying to run
    apart from one another; the protagonist applies medicine but cannot pull them
    apart, and the passage identifies the woman as Gā′gix̣it-woman.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The protagonist goes to Gū′łg̣a but cannot enter his mother’s house; he passes
    by unwillingly, and a pole in front of the house comes away in his hand.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The protagonist wanders to an open space near the middle of the top of the
    island and sees that he is naked and deprived of both blankets.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: While sitting with his back to the sunshine, the protagonist is touched by
    an unseen thing; he catches something soft, fur-like, and phosphorescent.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The protagonist skins the caught thing, stretches it on salmon-berry bushes
    to make blankets, and leaves the blankets after beings from both ends of the island
    mock them as sky blankets.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The protagonist hears bitter sobbing, finds a house, and sees a figure with
    tears, pitch on his face, long earrings, and small human beings hanging from the
    earring ends.
  category: setting
  evidence_refs:
  - ev:13
