canonical_text:
  quote: These were to be trees, they say.
  summary: Raven manipulates stones and water to form trees and land, calls beings
    and people toward the islands and Mainland, establishes traits attached to human
    groups, contests and kills a spring salmon, is deceived by crows who eat the salmon
    and are changed from white to black, receives hospitality from Beavers, then discovers
    a hidden lake, creek, fish trap, canoes, cranberries, and songs behind a screen
    and rolls up the lake, house, and fish trap to carry them into a tree.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The black stone is placed in the water first; Raven bites and spits parts
    of stones or pebbles onto the rest, and the attached pieces are said to be trees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a second object is placed in the water it stretches out; supernatural
    beings swim to it, and Mainland is described as finished and round on the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Raven floats before the island and calls landward in Tsimshian and then in
    Haida; later, at Mainland, a person with an old-fashioned cape and a paddle over
    his shoulder comes seaward.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explains the Mainland person’s response as the beginning of the
    Mainland people being industrious.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Near the south end of the island, Raven knocks a shore-walking person into
    the water twice, but the person floats face up and cannot be drowned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The inability to drown the shore-walking person is explained as connected
    with the Ninstints people going to practise witchcraft.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another person walking among fallen trees has his face cut by limbs and does
    not wipe it; he is identified as Greatest-crazy-one.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the Heiltsuk coast, Raven asks a spring salmon to strike him over the heart;
    it strikes him, he becomes insensible, recovers, and later uses stone walls and
    a club to kill it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Raven calls crows to help eat the salmon; they make a fire and roast it while
    he lies with his back to the fire and tells them to wake him when it is cooked.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The crows eat all of the salmon while Raven sleeps, place some salmon between
    his teeth, and tell him that he ate it before sleeping.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Raven spits into the crows’ faces and declares that future people will not
    see them looking as they do; the passage states that crows were white and have
    been black since then.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: People with feathers on their heads and gambling-stick bags on their backs
    find Raven weeping near a trail, ask what is wrong, and take him home after he
    says his parents are dead and that he is seeking them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the house, one man goes behind screens by the wall passage, returns with
    wet legs and a salmon with its back broken, and the group cooks and eats the salmon
    using fire made by rubbing white stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The feathered people with gambling-stick bags are identified as Beavers who
    were going out to gamble but turned back on Raven’s account.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Beavers bring out cranberries and mountain goat inside parts, divide the
    food into portions, make Raven’s portion large, and invite him to live with them
    always.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the Beavers leave to gamble, return, eat, sleep, and leave again the
    next morning, Raven goes behind the screen and sees a lake, a creek, a full fish
    trap, many salmon, small canoes, cranberry-red points, and sounding songs.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:17
  text: Raven pulls out and folds the fish trap, rolls it up with the lake and house,
    puts them under his arm, and climbs into a nearby tree; they are not heavy for
    his arm.
  category: action
  evidence_refs:
  - ev:10
