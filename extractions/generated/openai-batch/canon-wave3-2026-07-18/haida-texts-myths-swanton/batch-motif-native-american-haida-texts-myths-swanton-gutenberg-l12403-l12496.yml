    prepared board when he harpoons a seal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the seal hunt a slave pushes the young man onto the gum-covered board;
    he sticks to it, the slaves throw the board overboard, and they later report that
    he fell into the sea and could not be saved.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man drifts on the board until it reaches shore near a town; warm
    sun softens the gum, and he frees himself.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two beautiful singing women approach him, say they know his uncle's jealous
    plot, invite him to their father's country, and bring him to a large town; one
    is identified as a chief's daughter and the other as her slave, with the narrative
    also saying she was the daughter of the Eagle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the chief's house the young man is seated and fed; the girl's mother, G̣ōtsō′na,
