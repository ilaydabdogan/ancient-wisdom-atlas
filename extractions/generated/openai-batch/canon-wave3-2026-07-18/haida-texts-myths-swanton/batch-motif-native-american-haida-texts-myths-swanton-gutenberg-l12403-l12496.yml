    loves the chief's wife, and the chief becomes jealous and thinks of killing his
    nephew.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chief has gum fetched, boils it, covers the canoe bow-board with it, and
    spreads eagle down over it so the gum cannot be seen.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief summons the young man, gives him two marten blankets and caribou-skin
