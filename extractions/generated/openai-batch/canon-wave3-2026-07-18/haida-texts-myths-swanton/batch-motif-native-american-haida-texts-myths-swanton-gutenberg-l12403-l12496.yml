    his wife.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage identifies the household with Eagles but does not explicitly
    use the term divine.
- id: motif:4
  label: animal skin grants flight and extraordinary strength
  taxonomy_refs:
