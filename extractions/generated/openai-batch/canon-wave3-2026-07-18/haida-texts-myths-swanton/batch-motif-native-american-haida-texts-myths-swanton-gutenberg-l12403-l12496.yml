  confidence: high
  cautions: The passage gives the motive as jealousy over the chief's wife but does
    not provide broader comparative framing beyond the plot itself.
- id: motif:2
  label: castaway survives attempted killing and reaches another shore
  taxonomy_refs:
  - departure
  basis: The young man is cast overboard on the gum-covered board, drifts on the sea,
    reaches shore near a town, and frees himself.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The departure is involuntary rather than a chosen quest departure.
- id: motif:3
