candidate_motifs:
- id: motif:1
  label: jealous relative plots a false hunting accident
  taxonomy_refs: []
  basis: The chief becomes jealous of his nephew, prepares a hidden gum trap, sends
    him hunting, and has slaves throw him into the sea while later reporting an accident.
  evidence_refs:
  - ev:3
