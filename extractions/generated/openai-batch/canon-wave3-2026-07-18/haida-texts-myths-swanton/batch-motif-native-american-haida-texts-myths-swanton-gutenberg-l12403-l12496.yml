canonical_text:
  quote: ''
  summary: 'A closing fragment says a flying female pulls beings out as the bottom
    of an island cracks and Greatest-clam appears; the town is restored. An editor''s
    note then introduces another version: a chief at Lāltg·iwas becomes jealous of
    his nephew for loving the chief''s wife, prepares a gum-covered canoe-board trap,
    and has slaves throw the nephew into the sea during a seal hunt. The nephew drifts
    ashore, is freed when the sun softens the gum, and is invited by two singing women
    to their father''s country. He enters the household of an Eagle chief, marries
    the chief''s daughter, receives an eagle skin, and hunts whales with the Eagles.
    Although repeatedly warned not to seize a clam whose head resembles a sea otter,
    he eventually tries to catch it; the clam drains his strength and drags him and
    the assisting Eagles under the water.'
  language: English
  quote_policy: summarized
