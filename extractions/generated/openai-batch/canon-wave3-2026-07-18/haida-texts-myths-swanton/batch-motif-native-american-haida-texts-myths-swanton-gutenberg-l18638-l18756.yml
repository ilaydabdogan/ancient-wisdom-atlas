  quote: ''
  summary: The passage recounts episodes of inter-town conflict, whale-taking, fort
    settlement, killings, flight, a broken rescue promise, the end of a war, and a
    later trading visit that turns into fighting, enslavement, killing, ritual singing
    for a dead man, and slave exchange.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Peninsula man stayed at Qꜝo′nakoa fort, then smoke was seen from a seaward
    island where a large whale was drifting at Land-point.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people of the fort went out for the whale, encamped at G̣ᴀ′ldjida, and
    cut it up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two-voices went to Chicken-hawk town with two young men; gunshots were heard,
    Two-voices alone was shot, and his companions were spared.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Heavy canoes carrying whale could not reach Qꜝo′nakoa fort and instead went
    ashore at Dog-fish fort, where the people cleared bushes and began living.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ginᴀ′skilas hung duck-bill-ornamented blankets around the stockade for visitors
    and bought ten more blankets with a slave owned by a woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people in Dog-fish fort went to Skidegate to war, were discovered after
    pulling their canoes into the woods, and one person in the Kloo canoes was shot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tā′-iłgwai told the wounded Skî′lg̣atgwᴀns to get off, sit by a tree in the
    woods, and wait while he borrowed a canoe at Cumshewa to return for him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the Skidegate people pulled off their canoes, the wounded man made a
    fire for his head, and they crossed from Skidegate and cut off his head.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Town-of-Djī′gua people wandered by the point, were hungry and cold, found
    a sea otter ashore, made a fire, and steamed it in the ground.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ginᴀ′skilas refused the cooked sea otter placed before him, saying that the
    gravel might see him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The group attacked Tā′-iłgwai because he had not done what he promised to
    the wounded man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After stockade posts fell out, Gwi′sukūnas told his nephew that women could
    go anywhere, fighting lay on its back, and war was over.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: South-east and the people of his town went trading to I′nūł; after berries
    were dropped on South-east’s face and Alder disliked it, fighting began at the
    fort.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: In that fighting, the men were destroyed and the women were enslaved.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Axłua′ls was discovered swimming from the fort, pursued by youths, asked to
    be spared as brother-in-law, and was speared so that his back was broken.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: Axłua′ls’s body was towed ashore, and enslaved persons sang for his body a
    song formerly associated with his secret-society actions, sea-otter power, and
    sleight-of-hand performances.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: Forty slaves were taken for South-east, seventy in all, and the victors then
    fortified themselves at Thin-fort.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: Djē′basa arrived with many canoes and bought the slaves for grease, hides,
    and slaves; a remaining woman appealed to him and was exchanged for boxes of grease.
  category: sequence
  evidence_refs:
  - ev:15
