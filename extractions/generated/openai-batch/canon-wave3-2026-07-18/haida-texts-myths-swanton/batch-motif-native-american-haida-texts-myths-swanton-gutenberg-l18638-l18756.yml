candidate_motifs:
- id: motif:1
  label: Smoke signal leads kin to whale resource
  taxonomy_refs: []
  basis: A man raises smoke near a drifting whale for his brothers-in-law, after which
    the fort people go out to cut up the whale.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents this as practical signaling; no additional symbolic
    meaning is stated.
- id: motif:2
  label: Selective killing in a hostile encounter
  taxonomy_refs: []
  basis: Two-voices is shot while his two companions are explicitly spared.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain why Two-voices alone was targeted.
- id: motif:3
  label: Fort settlement and status display after obtaining whale
  taxonomy_refs: []
  basis: The group settles at Dog-fish fort after loading whale, and Ginᴀ′skilas decorates
    the stockade with ornamented blankets.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The relation between the whale, the fort settlement, and the blanket display
    is sequential but not explicitly interpreted.
- id: motif:4
  label: War party discovered at hidden canoes
  taxonomy_refs: []
  basis: A group going to war hides or pulls canoes into the woods above Skidegate,
    is discovered, and is pursued and shot at.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No broader mythic comparison is stated in the passage.
- id: motif:5
  label: Broken promise to rescue wounded companion
  taxonomy_refs: []
  basis: Tā′-iłgwai promises to get a canoe and return for the wounded Skî′lg̣atgwᴀns,
    but the group later attacks him for not doing as promised.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage does not give Tā′-iłgwai’s reasons for failing to return.
- id: motif:6
  label: Beheading of abandoned wounded enemy
  taxonomy_refs: []
  basis: The wounded man remains behind, makes a fire for his head, and Skidegate
    people come and cut off his head.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The phrase about making fire for his head is retained literally; its purpose
    is unclear from this passage alone.
- id: motif:7
  label: Refusal of food because a nonhuman thing might see
  taxonomy_refs: []
  basis: Ginᴀ′skilas refuses cooked sea otter and says the gravel might see him.
  evidence_refs:
  - ev:8
  confidence: uncertain
  cautions: The passage gives no explanation of the belief, taboo, or social rule
    implied by the statement.
- id: motif:8
  label: War ends when fort defenses deteriorate
  taxonomy_refs: []
  basis: After posts fall from the stockade, Gwi′sukūnas declares that women may go
    anywhere and that war is over.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The falling posts may be a practical sign of reduced need for defense;
    no explicit supernatural causation is stated.
- id: motif:9
  label: Trading affront escalates into massacre and enslavement
  taxonomy_refs: []
  basis: During a trading visit, berries are dropped on South-east’s face, Alder objects,
    fighting begins, men are destroyed, and women are enslaved.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage does not clarify whether the berry-dropping was accidental,
    insulting, or ritualized.
- id: motif:10
  label: Kinship plea fails to prevent killing
  taxonomy_refs: []
  basis: Axłua′ls asks to be spared as brother-in-law, but is still speared and fatally
    injured.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not explain the exact kinship relation or why the plea
    was disregarded.
