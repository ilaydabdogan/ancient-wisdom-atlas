canonical_text:
  quote: ''
  summary: A group of Haida-language narratives describes seal-disguise hunting leading
    to a mistaken spearing and warfare; the extinction of towns after fighting and
    dangerous fishing; a child lured and taken underground by a cold-handed being;
    a chief’s daughter trapped by falling rocks at Narrow-cave, killing the cave-being
    and escaping through a hole gnawed by Mouse, then later entering Narrow-cave’s
    house; and a boy abducted by two persons to a strange house, escaping after seeing
    tail-bearing beings extinguish a fire and evading them by climbing a tree above
    a pond.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter wearing a hair-seal skin and lying on a reef was speared by a hunter
    from another town, and the speared figure screamed as a human being.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage explains a hunting practice in which a person wore a hair-seal
    skin, lay on a reef, imitated a seal cry, and another person behind him speared
    seals that approached.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mistaken spearing led to terror, fighting between the Songs-of-victory
    people and Food-steamer’s people, the killing of Food-steamer’s wife, and mutual
    destruction.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Falling-tide returned from fighting, threw his kelp fish line into the fire,
    occupied a fort, had no food, spoiled himself, and was later killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: People at Kaisun stretched a black-cod fishing line on the beach to learn
    how far down the house of The-one-in-the-sea was, and later fishers who went out
    did not return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A child who refused black cod was called through the doorway by a being associated
    with burning coals and later grasped by large cold hands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The cold-handed being threw the child into a twisted-bough basket, and the
    child’s crying was heard from within the earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: People dug after the child’s crying and eventually dug out the tail of the
    marten blanket he wore; ditches are said to remain at that place.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The chief’s children picnicked behind Narrow-cave, and the chief’s daughter
    was left after others went for water, food, and firewood.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the chief’s daughter wished the rocks would fall upon her, the rocks
    fell toward her, trapping her while others cried outside.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Inside the enclosed place she made a fire, slept, and awoke to find a man
    lying with his back to the fire; the narrator identifies him as Narrow-cave.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Narrow-cave asked about the objects in the girl’s ears; she said sharp knots
    and mountain sheep wool had been put there.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The girl drove sharp knots into Narrow-cave’s ears, stopping once when he
    cried out, then doing it again until he died.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Mouse gnawed through the rock, making a small hole that grew larger after
    the girl put grease around it, until she escaped.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The girl returned at evening to her father’s house; a slave first reported
    her presence and was whipped before a nephew confirmed she was standing outside.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: After the girl recounted what happened, she became as if asleep, and the people
    guessed she had gone to live in Narrow-cave’s house.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: On a moonlight night two persons took a boy who was walking far behind and
    led him to a fine house.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: In the strange house the boy was fed fat from bullheads’ heads and later found
    he had been lying on large roots.
  category: object
  evidence_refs:
  - ev:18
- id: obs:19
  text: The beings in the house commented on fine weather clouds, went fishing, and
    in the evening placed their tails into a large fire, quenching it.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: After the beings went fishing the next day, the boy ran away; when pursued,
    he climbed a tree beside a pond, and the pursuers jumped into the pond after his
    shadow.
  category: sequence
  evidence_refs:
  - ev:20
- id: obs:21
  text: The pursuers could not get the boy from the tree and left; he returned to
    his parents, and his mother gave him a ground-hog blanket.
  category: sequence
  evidence_refs:
  - ev:21
