    a bone spear, and a human being screams.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: lines 14587-14592
  quote_or_summary: 'The hunting method is explained: a person wears a hair-seal skin,
    lies on a reef, makes a seal cry, and another person behind him spears an approaching
    seal; the man was speared while doing this.'
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 14593-14598
  quote_or_summary: The groups begin fighting; Songs-of-victory people kill Food-steamer’s
    wife with arrows; continual fighting follows, and they kill each other off.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 14599-14606
  quote_or_summary: Falling-tide, a brave man of Songs-of-victory town, returns from
    fighting, throws his kelp fish line into the fire, occupies a fort without food,
    spoils himself, and is later killed.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 14607-14616
  quote_or_summary: Only Kaisun remains; people stretch a black-cod fishing line on
    the beach to see how far down The-one-in-the-sea’s house is; when they later go
    fishing, they do not return. Night fishing for black cod is also mentioned.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 14617-14628
  quote_or_summary: A child refuses black cod; after crying, something moving burning
    coals calls him through the doorway using kinship language and promises roots
    with grease; when it stretches an arm in, the child complains of large cold hands.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 14629-14634
  quote_or_summary: The child’s parents tell him to go out; the being throws him into
    a twisted-bough basket; the child cries, and the people hear him crying within
    the earth.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 14635-14639
  quote_or_summary: People dig after the sound of the child’s crying in the earth
    and eventually dig out the tail of the marten blanket he wore; ditches are said
    to remain there.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 14640-14647
  quote_or_summary: The chief’s children at Kaisun go on a picnic behind Narrow-cave;
    all leave the town chief’s daughter, some going for water, some for food, and
    some for fallen limbs for firewood.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 14648-14652
  quote_or_summary: The girl thinks she wishes the rocks would fall upon her; the
    rocks fall toward her; she hears people talking and weeping outside.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 14653-14657
  quote_or_summary: After crying, the girl starts a fire, sleeps, and wakes to see
    a man lying with his back to the fire opposite her; the narrator says this was
    Narrow-cave.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 14658-14665
  quote_or_summary: Narrow-cave asks what has been put into the noble woman’s ears;
    she says sharp knots and mountain sheep wool; he takes sharp knots out of a little
    box used as a pillow.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 14666-14673
  quote_or_summary: Narrow-cave lays his head on planks; the girl pushes sharp knots
    into his ears, stops when he cries that it hurts, then does it again; his buttocks
    move and he dies.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 14674-14681
  quote_or_summary: The girl hears teeth working and sees light through a small hole;
    she puts grease around it, it grows larger each morning, and she exits; Mouse
    is identified as the one who nibbled through the rock.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 14682-14693
  quote_or_summary: Ashamed to come out, the girl returns in the evening to her father’s
    house; a slave reports her and is whipped for lying; the father’s nephew confirms
    she is there; her father brings moose hides, and she enters and sits on them.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 14694-14701
  quote_or_summary: Her father calls in the people; she recounts what happened; when
    finished, she becomes as one who falls asleep, and they guess she has gone into
    Narrow-cave’s house to live.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 14702-14706
  quote_or_summary: On a moonlight night, children go to play; two persons come to
    a boy walking far behind, take him away, and lead him to a fine house.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 14707-14713
  quote_or_summary: The hosts discuss what to feed the boy and give him fat from bullheads’
    heads; at night he awakes lying on large roots.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: lines 14714-14720
  quote_or_summary: In the morning the hosts mention fine weather clouds and go fishing;
    in the evening they build a large fire, place their tails into it, and the fire
    is quenched.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: lines 14721-14731
  quote_or_summary: After the hosts go fishing the next day, the boy runs away; they
    pursue him; he climbs a tree by a pond; they first jump into the pond after his
    shadow, then see him in the tree but cannot get him.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: lines 14732-14735
  quote_or_summary: The pursuers leave; the boy starts off, reaches his parents after
    having been lost, and his mother gives him a ground-hog blanket to wear.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
