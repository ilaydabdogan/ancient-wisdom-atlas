  taxonomy_refs:
  - shapeshifter
  basis: A person wears a hair-seal skin and imitates a seal as a hunting decoy, but
    another hunter spears him as if he were a seal.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage describes disguise rather than an explicit transformation,
    so the shapeshifter taxonomy fit is approximate.
- id: motif:2
  label: abducted child taken into or beneath the earth
  taxonomy_refs:
  - stolen_beloved
  basis: The child is lured outside, thrown into a basket, and heard crying from within
    the earth while people dig after the sound.
  evidence_refs:
  - ev:6
