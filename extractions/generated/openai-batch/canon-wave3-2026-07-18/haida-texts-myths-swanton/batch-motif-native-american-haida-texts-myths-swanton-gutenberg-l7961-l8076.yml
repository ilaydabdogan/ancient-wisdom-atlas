canonical_text:
  quote: ''
  summary: A chief’s son who habitually whittles eats a hair-seal flipper meant for
    his father. His father orders the town to move away and abandon him. Before departure,
    the wife of one of his uncles secretly arranges a hidden cache for him. Left with
    his young brother and dog, he builds a house, finds stored food and fire, preserves
    the food for his brother, and repeatedly refuses to eat. When the food runs out,
    the dog discovers salmon in a pool near cedar roots. The number of salmon increases
    daily; the boy processes and stores them, and the narration explains this as the
    origin of a custom of mainland chiefs cutting fish open.
  language: English
  quote_policy: summarized
