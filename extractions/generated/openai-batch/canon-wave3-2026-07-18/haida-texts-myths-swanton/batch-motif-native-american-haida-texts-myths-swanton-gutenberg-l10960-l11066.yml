canonical_text:
  quote: ''
  summary: A supernatural youth named He-who-got-supernatural-power-from-his-little-finger
    enters as a spark, marries a woman kept for him by her father, and survives a
    series of dangerous tests imposed by his father-in-law. Flaming food burns him,
    and then he is sent against an alder, a devilfish, and a sea lion, each of which
    swallows or traps him. After timed fourfold signs and the use of medicine, four
    supernatural helpers connected with his father rescue him. He kills or tears apart
    the dangerous beings, releases human bones from them, scatters pieces for future
    people, and the father-in-law laments each as his supernatural helper.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youth enters the sleeping place as a spark, sits at the head of the bed,
    lays his hands on the daughters, and identifies himself as He-who-got-supernatural-power-from-his-little-finger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: His name is explained by an incident from boyhood in which something stuck
    into his little finger while he was whittling.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman says her father has kept her for him alone; after she replies to
    him, he marries her, and her father accepts that he is the intended husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father-in-law seats the couple by the fire and gives the husband berries
    and grease from which flames come out; after a warning from his wife and four
    swallowings of medicine, the husband eats two mouthfuls, is burned inside, and
    smoke rises where he sat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father-in-law sends the husband to get an alder behind the house, and
    the wife tells him to approach only after it has come together and lightning has
    flashed in it four times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the youth spits medicine and chops the alder, he finds himself inside
    its mouth with no way out, held tightly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Four helpers, described as having hair tied in bunches with cedar limbs and
    carrying wedges and hammers, come through the hero's father's supernatural powers,
    split the alder, and pull him out; he rubs medicine on himself and is restored.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Human bones burst out of the alder, and the hero treads it into bits, scatters
    them, says they will be useful to later people, carries half to the house, and
    the father-in-law says his supernatural helper has been killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The father-in-law sends the husband for a small devilfish; the wife tells
    him to go after it has spit upward and lightened four times, and the youth approaches
    after it shoots up water four times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The youth shoots and strikes the devilfish, enters its mouth, is nearly drowned
    in slime, thinks of his father's supernatural helpers, and is pulled out after
    they club the devilfish in the eyes.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: After the devilfish episode, the youth restores himself with medicine, finds
    many bones in it, tears and scatters half of it for future people, carries half
    back, and the father-in-law again says his supernatural helper has been killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The father-in-law sends the husband after a little sea lion; the wife tells
    him to approach after it has looked at him and growled four times, and the sea
    lion breathes in so that he goes into its mouth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The supernatural helpers come with bone clubs, kill the sea lion, pull the
    youth from its mouth when he is almost dead, and he restores himself with medicine.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Three persons' bones fall out of the sea lion; the youth tears and scatters
    half of it for future people, carries half back through the doorway, and the father-in-law
    again says his supernatural helper has been killed.
  category: sequence
  evidence_refs:
  - ev:9
