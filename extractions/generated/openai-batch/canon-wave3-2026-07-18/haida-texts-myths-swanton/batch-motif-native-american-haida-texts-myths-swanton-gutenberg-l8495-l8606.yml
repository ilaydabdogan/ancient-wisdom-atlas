candidate_motifs:
- id: motif:1
  label: Abandoned son found prosperous and reintegrated with kin
  taxonomy_refs:
  - return
  basis: The father says they should go to the son whom he left and give him the town;
    the son is reported to have a larger town, wives, and whales, and later receives
    town people from his father.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage begins mid-episode; the abandonment context is supported here
    mainly by the father’s statement that he left the son and by the supplied passage
    label.
- id: motif:2
  label: Wives bring forth a town and whale wealth
  taxonomy_refs: []
  basis: The head slave reports that the son’s two wives brought out the town and
    dug out ten whales, five still floating where fastened.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states the action but does not explain whether it is magical,
    ritual, or otherwise extraordinary.
- id: motif:3
  label: Bride selection by food odor and clean mouth
  taxonomy_refs: []
  basis: Marriage candidates are given decayed whale-meat; nine are rejected because
    their mouths smell strong, while the youngest, who chewed hemlock bark, smells
    clean and is accepted.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The text does not explicitly state that the hemlock bark causes acceptance,
    although the sequence supports the association.
- id: motif:4
  label: Human captive hidden by an animal husband’s wife and made replacement spouse
  taxonomy_refs: []
  basis: The grizzly bear throws the human into the den; the bear’s wife hides him,
    lies to the bear, later marries the human, and shows him the hunting trail.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage calls the adversary a grizzly bear and describes a wife in
    his den, but it does not explicitly describe shapeshifting.
- id: motif:5
  label: External life as a thread cut by the spouse
  taxonomy_refs: []
  basis: The wife lets out the grizzly bear’s thread of life when he hunts and cuts
    it while it unrolls, after which she marries the human.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The exact effect of cutting the thread is not spelled out beyond the sequence
    in which the former husband disappears from the action and the wife marries the
    human.
- id: motif:6
  label: Departure under taboo with a surveillance token
  taxonomy_refs:
  - departure
  basis: When the man prepares to go away, the wife tells him not to talk or trifle
    with other women and gives him a water-tight basket with water and a hawk feather,
    saying she will see it there and that he should drink from it.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage ends before showing whether the taboo is broken or how the
    monitoring object changes.
- id: motif:7
  label: Return to father’s town after marriage in another household
  taxonomy_refs:
  - return
  basis: After living with the woman and having children, the man goes to his father’s
    town, identifies himself to his mother, is honored by his father, and hunts hair
    seal before setting out toward the inlet.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: medium
  cautions: The relationship between this return episode and the earlier abandoned-son
    episode is not made explicit in the extracted passage.
