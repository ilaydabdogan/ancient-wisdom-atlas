canonical_text:
  quote: ''
  summary: The passage recounts the discovery that an abandoned son is alive and prosperous,
    the movement of his relatives and prospective brides to his whale-surrounded town,
    his acceptance of the youngest unpainted bride after a mouth-smell test, and a
    later episode in which a human hunter is captured by a grizzly bear, hidden and
    then married by the bear’s wife after she cuts the bear’s thread of life. The
    hunter has children with her, is given a water-tight basket with water and a hawk
    feather as a monitoring object, and returns to his father’s town to hunt hair
    seal before heading back toward the inlet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Searchers return at night saying they could not find the bones, and the absent
    son’s parents weep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child of the head slave cries as if something is lodged in his throat,
    and the chief’s wife finds an unknown object in his mouth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The head slave says the abandoned son’s house or town has become larger, that
    his two wives brought out the town, and that they dug out ten whales, five of
    which remain floating.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At midnight the chief has wood put on the fire, calls in the people, and proposes
    that they go to the son whom he left and give him the town.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ten uncles plan to offer their daughters to the son in marriage, with marriage-gifts
    from the fathers, and the town breaks up and launches large canoes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The daughters are painted and made to sit on planks across the canoes, except
    the youngest uncle’s daughter, whose face is not painted because she is considered
    good for nothing.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The travelers eat decayed whale-meat and give some to the daughters; the youngest
    uncle gives his daughter inner hemlock bark to chew.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The travelers come in sight of a wonderful town surrounded by floating whales;
    the son takes up his bow but stops after his two wives speak to him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nine women are asked to open their mouths and are refused because their mouths
    smell strong; the youngest opens her mouth, smells clean, and is accepted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The father gives the town people to his son, the newcomers settle beside those
    already there, and five whales are given to the newly arrived people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man hunting with dogs finds a grizzly bear; the bear throws him into its
    den against the bear’s wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The bear’s wife hides the human in a hole in the earth with only his cape
    outside and denies to the bear that she has the human.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: When the grizzly bear goes hunting with a large basket, his wife lets out
    his thread of life, lets the hidden man out, feeds him, and hides him again when
    the thread begins to jerk.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: On the next day the wife fastens the thread to the bear and cuts it while
    it unrolls; she then lets the human out, marries him, and shows him the former
    husband’s hunting trail.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The man hunts crabs from a lake shoal, fills the basket, lives with the woman,
    has two sons with her, and later hunts hair seal.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:16
  text: Before the man departs, the woman tells him to leave some hair seal for her
    children, not to talk or trifle with other women, and gives him a water-tight
    basket containing water and a floating hawk feather.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The man returns to his father’s town, identifies himself to his mother, is
    honored by his father with a skin spread for him, refuses food, hunts hair seal,
    fills a canoe, and starts back toward the inlet.
  category: sequence
  evidence_refs:
  - ev:13
