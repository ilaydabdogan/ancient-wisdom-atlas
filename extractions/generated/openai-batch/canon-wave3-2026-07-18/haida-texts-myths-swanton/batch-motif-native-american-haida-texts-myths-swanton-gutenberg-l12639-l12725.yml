canonical_text:
  quote: ''
  summary: An unnamed man in an eagle-skin community enters and later borrows eagle
    skins, learns to hunt with eagles, and is warned not to approach a small object
    sticking out of the water. He ignores the warning and is dragged under with other
    eagles until an aged old woman pulls the group up and extracts the thing, later
    identified as Supernatural-clam, which is removed far out to sea. The man kills
    the feared being. Later he visits his uncle's town in eagle skin, leaves a whale
    there, abducts his uncle after the uncle claims the whale, drops him in the open
    sea, marries the uncle's wife, and comes to own the town while the uncle becomes
    a supernatural being in the sea.
  language: English
  quote_policy: summarized
