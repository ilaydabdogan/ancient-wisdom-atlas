candidate_motifs:
- id: motif:1
  label: resurrection or awakening of a dead wife
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: A woman is first described as a corpse; Sag̣adila′ʻo awakens her and marries
    her again.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives no explanation of the mechanism beyond the statement
    that he awakened her.
- id: motif:2
  label: rapidly grown child
  taxonomy_refs:
  - miraculous_child
  basis: The boy is made to grow to maturity by Sag̣adila′ʻo putting his feet on the
    boy’s feet and pulling.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The child’s conception is not described as miraculous in this passage;
    only the accelerated growth is explicit.
- id: motif:3
  label: wife carried away by sea creature
  taxonomy_refs:
  - stolen_beloved
  basis: The hunter’s wife is drawn after a slipping sea otter skin, becomes caught
    between a killer whale’s dorsal fins, and is carried away into the water.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not explicitly state whether the killer whale and later
    underwater husband are the same being.
- id: motif:4
  label: descent or entry to an underwater otherworld to seek a spouse
  taxonomy_refs:
  - hero_descent
  basis: The seeker goes into the water on a two-headed kelp at the place his wife
    passed in, follows a broad trail, and reaches a town where his wife has been taken.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is an underwater journey rather than a stated journey to the dead.
