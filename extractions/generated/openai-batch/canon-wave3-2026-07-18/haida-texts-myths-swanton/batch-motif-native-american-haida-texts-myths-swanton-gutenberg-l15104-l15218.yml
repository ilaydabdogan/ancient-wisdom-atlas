canonical_text:
  quote: ''
  summary: A man revives a dead woman and has a son who grows rapidly. The son becomes
    a hunter, marries, and loses his wife when she is carried away by a killer whale
    into the water. He gathers powerful substances and tools, enters the water at
    a two-headed kelp, travels along a trail to an underwater town, receives information
    and aid from women, a supernatural heron, and two slaves named Raven and Crow,
    and rescues his wife during a steam-filled commotion. The town pursues them, and
    animal-named pursuers and helpers appear as the flight begins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sag̣adila′ʻo returns to a house where his wife’s corpse is lying, kills his
    older wife, cuts her in two, places a whetstone between the parts, and the parts
    grind themselves away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sag̣adila′ʻo awakens the woman and marries her again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The revived woman has a boy by Sag̣adila′ʻo, and he makes the boy grow by
    putting his feet on the boy’s feet and pulling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sag̣adila′ʻo makes the boy a small canoe and a club like his own.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman leaves with her boy for her own place; the son later marries his
    uncle’s daughter and begins to hunt at Qꜝadō′.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A white sea otter swims in front of the town, the hunter shoots it in the
    tail, and his wife skins it without leaving blood on it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the wife washes the sea otter skin in sea water and puts it into the
    sea, it slips away repeatedly, drawing her farther after it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wife becomes stuck between the two dorsal fins of a killer whale, which
    swims away with her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Her husband pursues in a canoe as far as the Nass, and the wife disappears
    under the water in front of Killer-whale-always-blowing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The husband stores rotted blue hellebore, urine, first menstruation blood,
    and other menstrual blood in a box.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The husband takes twisted cedar limbs, a gimlet, and a whetstone, reaches
    a two-headed kelp where his wife entered, and goes into the water upon the kelp
    while Marten remains behind on the water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Under the water he comes upon a broad trail, reaches Lᴀ′mas, and meets women
    digging wild-clover roots who smell him.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: He opens the eyes of two women, and from them learns that his wife passed
    by and has been married by Isnē′g̣ał’s son, named Gîtgidᴀ′mtcꜝēx.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The women warn him that a supernatural heron at the end of the town is always
    watching and repairing a canoe.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: When the heron discovers him and cries out, the man puts the twisted cedar
    limbs, gimlet, and whetstone into the heron’s hands and puts the heron into his
    armpit.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The heron later tells him where the new husband lives and that two slaves
    named Raven and Crow will fetch dead hemlocks to steam a fin for his wife.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The man looks into the house and sees his wife sitting near her new husband.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: At the dead hemlocks, the man enters a hemlock, bites the end from a stone
    wedge, then restores it and cuts the firewood for Raven and Crow.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:19
  text: Raven and Crow tell him to stand in front of the house at evening and seize
    his wife while they create steam by spilling water into the fire.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:20
  text: At evening, red-hot stones, fins, and a stone box are prepared; water spills
    into the fire, steam rises, and the man takes his wife in his arms and runs back
    with her.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:21
  text: A house pole with three heads sounds an alarm after the wife is taken.
  category: action
  evidence_refs:
  - ev:17
- id: obs:22
  text: The town people pursue the escaping pair; Fast-rainbow-trout pursues above,
    Marten pursues below, and the two slaves run in advance.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:23
  text: When pursuers nearly catch him, one slave falls, swells his belly, and Mouse
    gnaws through the belly.
  category: sequence
  evidence_refs:
  - ev:18
