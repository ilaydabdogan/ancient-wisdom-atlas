canonical_text:
  quote: ''
  summary: A married woman plans with her lover to feign death, be placed in a tree-top
    box, and be secretly removed. The lover replaces her with wet rotten wood so mourners
    mistake the dripping liquid for bodily grease. The pair live far inland for years,
    return with altered dress, songs, dances, and invented words, and present her
    as a woman from an inland town. Her former husband gradually recognizes her voice
    and movements, verifies that the tree-box contains only rotten wood, removes her
    face-covering while she sleeps, and kills both her and the lover. The passage
    ends with an editorial note that a similar Alaskan Haida story exists elsewhere.
  language: English
  quote_policy: summarized
