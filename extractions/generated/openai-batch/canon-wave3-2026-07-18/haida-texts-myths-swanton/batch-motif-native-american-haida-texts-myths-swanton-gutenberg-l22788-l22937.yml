  quote: ''
  summary: 'Notes to war narratives explain customs and terms: differentiated payments
    for enslavement versus killing or wounding, Eagle-clan terminology for the Kloo
    Haida, an action said to help a soul reach Tāxet’s house, symbolic war regulations
    observed by warriors’ wives, slave-taking after contests, captive recovery and
    retaliation, hostage exchange, visitor-property pranks, and a violation of war
    taboos.'
