canonical_text:
  quote: ''
  summary: Master-carpenter repeatedly makes and tests canoes for a war expedition
    against Southeast. After several canoes split or break, he succeeds with a canoe
    left with limbs on it, sets out, challenges and seizes Southeast, and faces escalating
    wind, waves, mist, and tidal wave associated with named nephews. He gets Southeast
    ashore; some elders said Southeast died. A closing note explains avoidance of
    the word for “to-morrow” because it was the name of his mother and was associated
    with bad weather. The passage also includes the Haida text and an editorial transmission
    note.
  language: English translation with Haida text included
  quote_policy: summarized
