candidate_motifs:
- id: motif:1
  label: Concealed corpse in a carried box precipitates killing
  taxonomy_refs: []
  basis: A shot person is placed into a box, the town people later open the heavy
    box and find a dead man, and they immediately arm themselves and kill the companions
    lying about.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not explicitly explain the strategic purpose of putting
    the body in the box.
- id: motif:2
  label: Place-shaking act gives rise to a name
  taxonomy_refs: []
  basis: The passage states that a chief shook the entire island, and that on account
    of this people began to assume the name “Island-shaker.”
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not specify exactly which later persons or lineage bear
    the name.
- id: motif:3
  label: Food refusal because the ground might witness the eater
  taxonomy_refs: []
  basis: Sg̣agᴀ′ño refuses the canoe-builder’s food with the statement that the ground
    might see him, while the youths eat.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives the statement but does not explain the rule or belief
    behind it.
- id: motif:4
  label: Armored defender cannot be pierced by arrows during a siege
  taxonomy_refs: []
  basis: Always-ready walks on the fort roof wearing armor, and arrows shot at him
    do not pierce him.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The text attributes the arrow resistance to armor rather than to supernatural
    invulnerability.
- id: motif:5
  label: Marked arrow serves as a sign revealing a warrior’s absence
  taxonomy_refs: []
  basis: A floating arrow standing in the water with a small stone is interpreted
    by an old man as a sign that Always-ready is out fishing.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not identify who sent or arranged the sign.
- id: motif:6
  label: New bows break at hidden notches during confrontation
  taxonomy_refs: []
  basis: Always-ready’s ten new bows all break where his brother-in-law had notched
    them under the feathers, leaving him unable to wound the pursuers before capture.
  evidence_refs:
  - ev:9
  - ev:13
  - ev:14
  confidence: high
  cautions: The text reports the notches and breakage but does not explicitly state
    the brother-in-law’s intent.
- id: motif:7
  label: Famed brave captive set ashore for inspection
  taxonomy_refs: []
  basis: After capture, Always-ready is set ashore at G̣ᴀ′nʟ̣ī, and the captors sit
    around him because they had heard he was brave and wanted to see him.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The passage describes the captors’ interest but does not elaborate on
    a ritual or formal display.
