    Always-ready shoots an arrow into the canoe, and the one shot is put into a box
    before the party returns to town.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:2
  type: summary
  locator: 17897-17902
  quote_or_summary: The town people carry up property including a big heavy box; after
    food and evening, Sg̣agᴀ′ño’s companions sit at a flat rock while Sg̣agᴀ′ño and
    two youths go toward the upper end of town.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:3
  type: summary
  locator: 17904-17906
  quote_or_summary: The town people untie the heavy box and find a dead man; they
    take war spears and kill those lying idly about.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:4
  type: quote
  locator: 17908-17910
  quote_or_summary: "“At that time he shook this entire island. On account of that
    they began to assume the name ‘Island-shaker.’”"
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; short quote from provided passage.
- id: ev:5
  type: summary
  locator: 17912-17922
  quote_or_summary: Sg̣agᴀ′ño and two youths encounter a canoe-builder behind X̣i′das;
    the youths want to kill him, but the man hosts them with bear skins and cooked
    food. Sg̣agᴀ′ño refuses to eat, saying the ground might see him.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:6
  type: summary
  locator: 17924-17929
  quote_or_summary: The canoe-builder gives them a new five-fathom canoe, mat sails,
    paddles, mats, and food; Sg̣agᴀ′ño warns him to stay near a sandy beach and promises
    to put ashore enslaved friends after the fighting.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:7
  type: summary
  locator: 17931-17935
  quote_or_summary: The Ninstints people live in a fort on top of Sqas, and the people
    of Tcꜝā′ał come in successive war parties on the water in front of the fort.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:8
  type: summary
  locator: 17937-17943
  quote_or_summary: Always-ready comes out through the smoke hole, walks on the roof
    in armor, and arrows do not pierce him; later attackers try to roll stones from
    the cliff, but the stones skip over the houses.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:9
  type: summary
  locator: 17945-17950
  quote_or_summary: After a period of siege and hunger, Always-ready asks his brother-in-law
    to make ten bows; the finished bows have fine feathers near the tips, and he gives
    up his big cedar bow for them.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:10
  type: summary
  locator: 17952-17954
  quote_or_summary: The people of the town, including Always-ready’s sisters and brothers-in-law,
    begin to dislike him because they are always hungry on his account.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:11
  type: summary
  locator: 17956-17960
  quote_or_summary: Always-ready’s sister gives him the white belly-part of a halibut;
    he then goes fishing with three persons, taking ten bows and two arrow boxes but
    leaving his cedar bow behind.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:12
  type: summary
  locator: 17962-17969
  quote_or_summary: The attackers return early; a floating arrow stands on end in
    the water with a small stone hanging from it, and an old man interprets it as
    a sign that Always-ready is out fishing. Ten canoes start seaward.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:13
  type: summary
  locator: 17971-17978
  quote_or_summary: Five canoes search on each side of Xē′na and find Always-ready
    out at sea; as they approach, he breaks all ten bows, which break where the brother-in-law
    had notched them under the feathers.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:14
  type: summary
  locator: 17980-17983
  quote_or_summary: Always-ready throws the broken bows and two arrow boxes into the
    sea, wounds no one, and is captured after the three people fishing with him are
    killed.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain; summarized from provided passage.
- id: ev:15
  type: summary
  locator: 17985-17990
  quote_or_summary: Always-ready gets into Sg̣agᴀ′ño’s canoe; the captors camp at
    the sandy beach G̣ᴀ′nʟ̣ī, set him ashore, and sit around him because they had
    heard he was brave.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
