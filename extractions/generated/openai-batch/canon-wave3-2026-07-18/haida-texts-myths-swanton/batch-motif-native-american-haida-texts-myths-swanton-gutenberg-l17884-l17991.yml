canonical_text:
  quote: ''
  summary: A war narrative in which Sg̣agᴀ′ño and companions arrive with a heavy box
    containing a dead man, prompting the town people to kill the exposed companions.
    Sg̣agᴀ′ño and two youths escape, encounter a canoe-builder, and later the people
    of Tcꜝā′ał besiege a fort. Always-ready resists arrows while armored, but after
    accepting new bows from his brother-in-law and going fishing without his cedar
    bow, a signal arrow reveals his absence. Pursuers find him at sea; his ten new
    bows break at hidden notches, his companions are killed, and he is captured and
    set ashore for viewing because of his reputation for bravery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sg̣agᴀ′ño traveled from Tcꜝā′ał to visit Always-ready, and near Songs-of-victory
    town Always-ready shot an arrow into the canoe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the shooting, the one who had been shot was put into a box, the box
    was roped, and the party returned to the town.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The town people carried up property, including a big heavy box; after food
    and evening, Sg̣agᴀ′ño’s companions sat on a flat rock while Sg̣agᴀ′ño and two
    youths went toward the upper end of town.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the town people opened the heavy box and found a dead man inside, they
    took war spears and killed those lying idly about.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A chief went into the woods with young fellows, shook the entire island, and
    the name “Island-shaker” began to be assumed on that account.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sg̣agᴀ′ño and two youths later met a canoe-builder behind X̣i′das; the youths
    wanted to kill him, but the man hosted them, spread three bear skins, and his
    wife cooked food.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sg̣agᴀ′ño refused the cooked food, saying that the ground might see him, while
    only the youths ate.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The canoe-builder gave them a new five-fathom canoe, mat sails, paddles, mats,
    and food for the youths; Sg̣agᴀ′ño warned him to stay near a sandy beach and promised
    to put ashore his enslaved friends after fighting.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Ninstints people lived in a fort on top of Sqas, while the people of Tcꜝā′ał
    came in successive war parties and stayed on the water in front of the fort.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Always-ready came out of the smoke hole, walked on the roof wearing armor,
    and arrows shot at him did not pierce him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Attackers climbed to the top of the cliff and tried to roll stones down, but
    the stones skipped over the houses and did not come near them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the siege, the besieged people were short of food; Always-ready asked
    his brother-in-law to make ten bows, which were finished with fine feathers near
    the tips, and he gave up his usual big cedar bow for them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: People in the town, including Always-ready’s sisters and brothers-in-law,
    disliked him because they were hungry on his account.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: After receiving the white belly-part of a halibut from his sister, Always-ready
    went fishing with three persons, taking ten bows and two arrow boxes but leaving
    his cedar bow behind.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The next morning attackers came again; a floating arrow stood upright in the
    water with a small stone hanging from it, and an old man interpreted it as a sign
    that Always-ready was out fishing.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Ten canoes searched seaward, five on each side of Xē′na, and found Always-ready
    lying out to sea.
  category: action
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:17
  text: As the pursuers approached, Always-ready broke all ten bows; the bows broke
    where his brother-in-law had notched the rounded side under the feathers.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: Always-ready threw the broken bows and two arrow boxes into the sea, did not
    wound anyone, and was captured after the three people fishing with him were killed.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:19
  text: The captors put Always-ready into Sg̣agᴀ′ño’s canoe, camped at the sandy beach
    called G̣ᴀ′nʟ̣ī, set him ashore, and sat around him because they had heard he
    was brave.
  category: sequence
  evidence_refs:
  - ev:15
