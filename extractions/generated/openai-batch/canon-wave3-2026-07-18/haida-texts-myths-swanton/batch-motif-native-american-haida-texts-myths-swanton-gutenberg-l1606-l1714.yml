canonical_text:
  quote: ''
  summary: A chief’s daughter at Djū is abandoned after her father discovers she has
    gone with a slave. While digging on the beach she finds a crying child in a cockleshell
    and raises him; he grows rapidly, receives a copper bow and arrows made from her
    bracelets, and hunts birds. Master Carpenter becomes his father, dresses him with
    fair-weather clouds, and good weather follows when he sits seaward. In a fishing
    episode, directed speech and a hooked wonderful sea-being produce abundant halibut.
    The child is recognized by his mother’s kin, later wears preserved bird skins
    and appears as colored cloud forms over the sea, then announces that he will leave
    his mother and be associated with calm morning weather and people obtaining food.
  language: English
  quote_policy: summarized
