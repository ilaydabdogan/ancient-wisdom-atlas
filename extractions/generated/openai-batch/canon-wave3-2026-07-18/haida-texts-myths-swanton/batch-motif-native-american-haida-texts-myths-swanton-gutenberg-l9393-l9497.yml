candidate_motifs:
- id: motif:1
  label: concealment by sudden ritualized darkness
  taxonomy_refs: []
  basis: Marten repeatedly pushes ferns into the fire, producing darkness that lets
    Upward be moved away from the women whom the shamans identify.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes the action literally; no broader ritual function
    is stated.
- id: motif:2
  label: transformation into a small fire-remnant to hide
  taxonomy_refs:
  - shapeshifter
  basis: Upward changes himself into a cinder and hides at the smoke-hole before being
    detected.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only this single transformation is described for Upward in this passage.
- id: motif:3
  label: dismembered body fatally consumed by enemies
  taxonomy_refs: []
  basis: Wī′gît cuts Upward’s body into pieces, the shamans eat all of it, and then
    they become sick and die.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The mechanism of the fatal sickness is not explained in the passage.
- id: motif:4
  label: community-threatening water monster and intended slayer
  taxonomy_refs:
  - culture_hero
  basis: Qꜝā′g̣awa-i destroys canoes and threatens starvation, while Djila′qons’ son
    declares he will travel south and kill it.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The killing itself does not occur within the provided line range, so the
    culture-hero classification remains provisional.
- id: motif:5
  label: supernatural animal requiring correct cutting method
  taxonomy_refs: []
  basis: The small halibut cannot be cut open in attempted ways because supernatural
    beings protest and thunder occurs; cutting from the tail succeeds.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly state a rule or taboo, only the failed
    attempts, protests, thunder, and successful tail cut.
- id: motif:6
  label: rebirth by replacing a newborn child
  taxonomy_refs:
  - death_rebirth
  - miraculous_child
  basis: The protagonist destroys a cradle child and becomes born in its place, then
    grows as that household’s child.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage frames this as replacement birth; it does not describe the
    protagonist’s prior death.
- id: motif:7
  label: animal skin enabling flight
  taxonomy_refs:
  - shapeshifter
  basis: The protagonist brings in a skinned raven and later flies around the island
    with its skin on.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage does not describe the exact mechanics beyond wearing the skin
    and flying.
- id: motif:8
  label: tabooed monster-name near an animate hearth
  taxonomy_refs: []
  basis: After the boy names Qꜝā′g̣awa-i, charcoal is placed on his lips because people
    fear Woman-under-the-fire will carry his words to the creature.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The passage states the fear and protective action but does not provide
    a broader explanation of Woman-under-the-fire.
