canonical_text:
  quote: ''
  summary: The passage first describes Marten and Land-otter-women concealing Upward
    from shamans through darkness made by ferns on a fire; Upward later changes into
    a cinder, is found, dismembered by Wī′gît, eaten by shamans, and their consumption
    causes sickness and death. A second narrative begins with Qꜝā′g̣awa-i, a five-finned
    creature whose current draws canoes into its mouth. Djila′qons’ son sets out to
    kill it, obtains a small halibut skin after supernatural protest, replaces a newborn
    child by being born in its place, grows with copper weapons, kills birds including
    Supernatural-sparrow, uses a raven skin to fly, and is silenced with charcoal
    for naming Qꜝā′g̣awa-i near the fire because Woman-under-the-fire might report
    his words.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After someone announces that a chief is coming, Marten is sent into the woods,
    where he pulls up ferns, ties the stalks, and sits near the fire by the door.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Five Land-otter-women sit in a house corner, and one has Upward concealed
    inside her blanket.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven calls a young boy, whispers to him, and after the boy leaves and returns,
    a mat is spread for five matted-haired persons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The matted-haired persons act as shamans while songs are sung for them, and
    they point toward women who are hiding Upward.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
- id: obs:5
  text: When the searchers approach a woman hiding Upward, Marten pushes ferns into
    the fire, producing darkness in which Upward is handed to another woman.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Upward changes himself into a cinder and hides at the edge of the smoke-hole
    before a shaman points upward and Upward is brought in.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wī′gît pulls off Upward’s arms and legs, cuts up his body, and gives the pieces
    to the shamans, who eat them all.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After eating Upward’s body, the shamans become sick in the stomach, die, and
    their bodies are thrown outside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: People from Łg̣adᴀ′n fish for black cod near an island where Qꜝā′g̣awa-i,
    a creature with five fins, pursues them and draws canoes into its mouth by a current
    of water.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The people continue going to the island because they fear starvation and because
    mussels grow there, and they avoid striking their paddles against canoe edges
    to prevent noise.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Djila′qons’ son says he will go south to kill Qꜝā′g̣awa-i; his mother warns
    him for a while, then permits him to go.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: At point Skwai, Djila′qons’ son hears a rushing sound, sees an eagle near
    a salt water pool, and finds a small halibut floating in the pool.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: When he tries to cut open the halibut, supernatural beings protest and thunder
    occurs; cutting from the tail succeeds, after which he skins it and dries the
    skin in sunshine.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Łg̣adᴀ′n, he finds a newborn child in a cradle, destroys it while the household
    sleeps, and becomes born in its place.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: After growing somewhat, the reborn child asks for a copper bow and copper
    arrows while Qꜝā′g̣awa-i continues swallowing fishers and Supernatural-sparrow
    eats uncut halibut.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The child shoots birds, kills the large sparrow, later brings in a skinned
    raven, and flies around the island wearing its skin.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: After he says he is going to kill Qꜝā′g̣awa-i, his uncle tells his mother
    to put charcoal on his lips because they fear mentioning Qꜝā′g̣awa-i near the
    fire.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: The stated reason for the speech taboo is fear that Woman-under-the-fire would
    take the boy’s words to Qꜝā′g̣awa-i.
  category: relationship
  evidence_refs:
  - ev:14
