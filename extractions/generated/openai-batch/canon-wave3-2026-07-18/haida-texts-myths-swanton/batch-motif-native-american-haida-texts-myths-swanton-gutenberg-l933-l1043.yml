canonical_text:
  quote: ''
  summary: A disabled or injured chief is warmed, treated, fed, and helped to walk.
    His rescuers take him by canoe to a Stikine town, where people recognize him as
    a chief. The finder recounts how a grandchild discovered him and how they cared
    for him. Stikine chiefs have his blood tasted; its saltiness is taken as evidence
    that he had been blown about for a long time. He remains among the Stikine, is
    taken into the finder’s family and clan, learns their language, sings a crying
    song, joins the tribe, and sends songs to his former Fish-eggs friends, who learn
    he is alive and well. An editorial note says the story may explain a relationship
    between the Fish-eggs and a Stikine family.
  language: English
  quote_policy: summarized
