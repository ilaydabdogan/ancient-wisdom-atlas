canonical_text:
  quote: ''
  summary: Qä′ndawas prepares for a potlatch and attempts to sell a copper plate valued
    at ten slaves. After refusing a lower offer, her party is blown to Kaigani country,
    where Tlingit people invite them in, feed them, and kill those ashore; slaves
    who remain with the canoe escape but capsize and lose the property. The narrator
    later joins a winter war expedition against Tlingit people. The war party performs
    preparatory drinking, scouts houses, receives aid from A′nkustᴀ’s performance
    against souls and a dog’s mouth, fails to carry out an attack on a house, follows
    another canoe down an inlet, and engages a Tlingit canoe with guns. The narrator
    is wounded, G̣ᴀ′nx̣oat is killed, and Gā′ala shoots a man in the stern of the
    opposing canoe.
  language: English
  quote_policy: summarized
