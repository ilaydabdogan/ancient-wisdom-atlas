canonical_text:
  quote: ''
  summary: An unnamed man loses his property and his clansmen's property through gambling,
    leaves in shame, goes into the woods, climbs a mountain, and comes to a town of
    eagles. He lives with the eagles, observes their fishing and whale-killing, receives
    a warning about how much of a net to put into the sea, and later descends home,
    gambles successfully, and repays his debts. A note says the story was originally
    probably longer.
  language: English
