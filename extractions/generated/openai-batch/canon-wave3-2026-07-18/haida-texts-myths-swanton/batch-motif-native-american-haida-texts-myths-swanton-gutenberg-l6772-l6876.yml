canonical_text:
  quote: ''
  summary: Raven deceives Xāusgana by drifting away in his canoe, impersonates him
    at his house, and is later killed and cast away by Xāusgana. Raven continues through
    a whale-swallowing episode, escapes from the whale, frightens people into abandoning
    their village, and eats their provisions. He then deceives Beaver by claiming
    kinship, steals the water and fish from Beaver’s lake, perches with the water
    in trees while animals try to recover it, and scatters water to create rivers
    on Queen Charlotte islands and the Skeena and Stikine rivers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven lies in Xāusgana’s canoe, wishes for wind from the island, pretends
    to sleep, and the canoe drifts away while Xāusgana shouts to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After he is out of sight, Raven assumes Xāusgana’s shape, returns to Xāusgana’s
    house, tells the wife that the visitor was Raven and a liar, eats heavily, lies
    down with her at night, and is believed by people to be Xāusgana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Xāusgana remains on the island, summons his rattle and bow, and walks home
    over the surface of the water as if it were firm land.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Xāusgana tells his wife that Raven has cheated her and instructs her to close
    the house chinks, lock the door, and shut the smoke hole before he appears to
    take revenge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Xāusgana enters the closed house, catches Raven as Raven tries to escape in
    his skin, kills him, breaks his bones, and throws him into the latrine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After further abuse of Raven’s body, it is thrown into the sea, drifts on
    the water, and answers people who ask why that chief is drifting there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Raven wishes for a whale to swallow him, and a whale comes and swallows him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the stranded whale is cut open, Raven wishes that the chief’s son would
    open the whale’s stomach; the chief’s son does so, Raven flies out against his
    chest, and the youth dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Raven takes the shape of an old man with a staff, advises frightened people
    to leave their village and property, then stays behind and eats their provisions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Beaver is described as a chief living in a beautiful house near a lake with
    salmon and berries, from which he brings food home.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Raven disguises himself as a poor, ugly person, claims that Beaver is his
    brother and shares his ancestors, and receives food from Beaver.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Raven rolls up the lake water like a blanket, removes fish from it, later
    takes the water in his beak, and flies to the top of a large cedar tree.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Beaver finds the lake gone and sees Raven holding the water in a tree; Beaver
    calls Tā′ʟat’adᴇga, beavers, bears, wolves, and other forest animals to throw
    down the trees.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After animals fell several trees and ask Raven to return their chief’s water,
    Raven refuses, flies away, spits water onto the ground, and thereby originates
    rivers on Queen Charlotte islands and the Skeena and Stikine rivers.
  category: sequence
