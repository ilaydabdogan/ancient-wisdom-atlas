canonical_text:
  quote: ''
  summary: A male protagonist repeatedly takes refuge in named strong houses while
    pursued by burning; several roofs burn through and his blankets, and then his
    mother, are lost. An old canoe-repairing man recognizes him, assists with tools
    and bird-form equipment, and brings him by canoe to Burning-sky’s town. There
    a dancer identified as Sandhill-crane performs transformations that put rows of
    people to sleep, allowing the protagonist to recover his blankets and mother.
    On the return, fire pursues and is stopped by breath, but at home the blankets
    and mother are lost again and the protagonist’s wife has been taken away to be
    married.
  language: English
  quote_policy: summarized
