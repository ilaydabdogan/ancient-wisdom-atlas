canonical_text:
  quote: ''
  summary: A House-point chief's half-crazy son pursues a four-faced rolling being
    into the ocean, receives instructions in canoe-making, cedar-bark houses, and
    fishing technology, and returns to teach his people. Later conflicts over eagle
    feathers, a valuable copper, and warfare with Inlet people lead to drownings,
    a petition for a flood, two destructive tidal waves, exposed dentalium shells,
    slave-trading, and a House-point man whose image-covered house is repeatedly washed
    away before he takes a new name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The son of the town chief of House-point is described as half crazy and encounters
    a rolling thing with four faces after children have finished playing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man throws stones at the four-faced thing, eventually sees where it goes,
    chases it into the ocean, follows it along a trail in the ocean, and finds it
    waiting on a beach.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The being takes a bag from its back, removes a partly finished canoe, and
    teaches how canoes will be made, including stretching them and building a fire
    inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The being takes cedar bark from its bag, names it, and explains uses of cedar
    bark and cedar limbs for houses, sewing canoes, and fastening canoe seats.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the teaching, the being strikes or pushes the man down, becomes a bird,
    dives, and is then seen as a Redhead floating on the sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man returns home, tells his friends, and the people begin making canoes,
    fastening seats with cedar limbs, sewing broken canoes, making cedar-bark houses,
    and fishing in the ocean.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same being also teaches fastening halibut hooks with roots, weaving cedar-bark
    mats, and twisting cedar bark into ropes for fishing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A dispute over an eagle or hawk taken from eagle snares escalates into people
    putting on armor and weapons and fighting before separating.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A returning party sees smoke at a town, finds a prisoner being pushed toward
    the beach, and learns that the Inlet people have burned the town under a war chief
    called Burnt-forest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During a pursuit, a copper is fastened to a paddle and held high; the pursued
    people upset themselves, swim downward, and two named chiefs drown, after which
    Burnt-forest dives and recovers the copper.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The drowned people sit before Chief's house and beg him for a flood; after
    the warriors camp in calm weather, two tidal waves come in, carry away canoes
    and skids, uproot trees, and kill half of the warriors while Burnt-forest escapes
    with the copper.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The waves wash dentalium shells to the surface near Tow hill, and the Inlet
    people dig them, take them north, sell them for slaves, and become known as having
    many slaves.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A man of Those-born-at-House-point makes figures of supernatural beings on
    his house and human images on the roof-pole ends; the house is washed away five
    times, and he names himself Chief-who-renews-his-property.
  category: sequence
  evidence_refs:
  - ev:10
