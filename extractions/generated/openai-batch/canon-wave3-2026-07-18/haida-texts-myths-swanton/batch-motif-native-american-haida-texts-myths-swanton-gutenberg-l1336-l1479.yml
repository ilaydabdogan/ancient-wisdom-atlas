canonical_text:
  quote: ''
  summary: A person is fed broth, grease, and other food, and a canoe trip to town
    is planned. Property and canoes are prepared, and a group travels by canoe. At
    town, people are surprised because there are now two canoes and another person
    is seen sitting in one. The arrivals are taken to a house crowded with Stikine
    men, women, and children. A speaker recounts that his grandchild found the person
    while playing, that the person could not stand and had bent legs, that they carried
    him in a mat, tended and fed him, and later brought him by canoe from an uninhabited
    place. While the account is being related, others secretly see him feeling his
    skin with his teeth and tell one another; the passage then introduces a Stikine
    chief speaking.
  language: English with Haida interlinear text
  quote_policy: summarized
