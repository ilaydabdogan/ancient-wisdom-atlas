candidate_motifs:
- id: motif:1
  label: Healing by extraction of hidden missiles
  taxonomy_refs: []
  basis: The cure consists of seeing and removing arrows or arrow points from the
    sick man’s body, then seating him upright.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage gives a concrete cure sequence but does not name a formal
    motif type.
- id: motif:2
  label: Cure exchanged for marriage after wealth is refused
  taxonomy_refs:
  - sacred_exchange
  basis: The protagonist refuses escalating property offers, including moose-skins,
    coppers, and all town property, until the daughter is offered in marriage; he
    then completes the cure and marries her.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The taxonomy label is broader than the passage’s literal language; the
    passage presents exchange and marriage but does not explicitly call it sacred.
- id: motif:3
  label: Withheld or reversed cure to obtain the desired reward
  taxonomy_refs:
  - sacred_exchange
  basis: After initially removing arrows and making the sick man comfortable, the
    protagonist sees the daughter, puts the arrows back, and later completes the cure
    only after the daughter is offered.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The motive is inferred from sequence and the statement that his mind had
    become fixed; the passage does not give a direct spoken explanation by the protagonist.
- id: motif:4
  label: Homesick return to the left-behind younger brother
  taxonomy_refs:
  - return
  - sibling_pair
  basis: The protagonist lies abed because he is homesick for the younger brother
    he left, then travels back toward the town where the brother was left.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The relationship is explicit, but earlier events leading to abandonment
    lie outside this excerpt.
- id: motif:5
  label: Magical vessel enabling return
  taxonomy_refs:
  - return
  basis: A whale’s head is identified as the father-in-law’s canoe, floats on the
    water as a large canoe when addressed, and carries the protagonist, wives, and
    provisions toward home.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage supports a magical return-vessel pattern, but it is not a
    flood ark or survival vessel in this excerpt.
- id: motif:6
  label: Restoration of bones to life
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The younger brother and dog are found as bones under a drum; after ritual
