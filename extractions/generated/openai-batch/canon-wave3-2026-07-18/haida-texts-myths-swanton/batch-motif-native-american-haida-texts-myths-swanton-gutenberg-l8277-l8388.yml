canonical_text:
  quote: ''
  summary: A man observes that a Land-otter shaman cannot see objects protruding from
    a sick man. After preparing cedar-bark bands, he extracts arrows from the sick
    man, at first restoring him but then reinserting the arrows after seeing Ga′ogila’s
    daughter. He refuses wealth until the daughter is offered in marriage, then completes
    the cure and marries her, while Master Carpenter’s daughter also becomes his wife.
    Later he becomes homesick for his younger brother, obtains a whale-head canoe
    from his father-in-law, returns home with both wives and provisions, finds his
    younger brother and dog as bones under a drum, and the wives perform actions with
    a blue substance, a cloud-edged mat, and spitting, after which the brother rises
    and the dog is glad. The canoes are unloaded, followers arrive, and a large house
    is built for him.
  language: English
  quote_policy: summarized
