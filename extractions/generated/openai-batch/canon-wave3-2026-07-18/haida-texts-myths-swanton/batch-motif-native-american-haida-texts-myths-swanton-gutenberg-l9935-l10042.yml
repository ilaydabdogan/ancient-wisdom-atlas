canonical_text:
  quote: ''
  summary: A traveling supernatural protagonist encounters Master Weeper, unsuccessfully
    tries to kill him by dropping stones through the roof, and steals hides and blankets
    that Master Weeper retrieves. The protagonist then reaches a deserted town where
    an old man warns him against dangerous water and devilfish associated with the
    destruction of the village. In two episodes, the protagonist is swallowed, bursts
    out from inside the destroyer, reassembles human bones, spits medicine on them,
    and revives people. The old man later sees the restored townspeople walking about,
    and a final action involves heating a white hard rock in the fire and placing
    it in a urinal with a sharp half-blue, half-red object.
  language: English
  quote_policy: summarized
