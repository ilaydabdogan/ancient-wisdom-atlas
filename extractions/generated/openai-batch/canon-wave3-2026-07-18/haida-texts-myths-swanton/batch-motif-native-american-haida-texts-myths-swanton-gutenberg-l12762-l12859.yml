  label: HOW SOMETHING PULLED A ROW OF EAGLES INTO THE WATER / THE STORY ABOUT HIM
    WHO DESTROYED HIS NINE NEPHEWS / THE STORY OF ONE WHO SAW AN EAGLE TOWN / THE
    ONE THEY ABANDONED BECAUSE HE WAS THE FIRST TO SPEAR SEA LIONS; lines 12762-12859
