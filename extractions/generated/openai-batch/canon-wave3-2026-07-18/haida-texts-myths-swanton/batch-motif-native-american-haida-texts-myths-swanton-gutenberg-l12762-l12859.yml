canonical_text:
  quote: ''
  summary: A skilled carpenter and sea-lion spearer is abandoned on a reef by people
    who depend on his hunting ability. A grebe summons him into a pond to an underwater
    chief's house, where he is questioned about killing sea lions, fed, subjected
    to failed attempts to attach killer-whale fins to him, and then put into a sea-lion
    stomach that floats him back to shore. He returns secretly to his wife for tools,
    takes a child as bait, builds a cedar trap at a lake, kills a Wā′sg̣o, skins it,
    and dries it by fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A good carpenter with two children made corded spears with points and used
    them to spear sea lions driven into a pool on a reef.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After he had hunted in this way for a while, the people let him off first
    at the reef and abandoned him; the passage says they did this because only he
    could kill the sea lions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: His youngest brother-in-law paddled toward him and tried to take away the
    others' paddles, but they did not heed the abandoned man's calls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The abandoned man cried for his children, slept near a pond, heard a summons
    from the chief, and then saw a grebe emerge from the pond and repeat the summons.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: He took a whetstone, jumped into the pond, stood before a big house, entered
    it, and was asked why he had killed the chief's servants; he answered that he
    did it to feed his two children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Inside the house he saw two small killer whales in a corner pool, identified
    as the chief's children at play, and killer-whale fins hung in bunches in the
    four corners.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The house occupants cooked for him by dragging a sea lion toward the fire
    and putting hot stones and halibut into its mouth before giving him the cooked
    food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: They warmed killer-whale fins and repeatedly struck them onto his back while
    he placed the whetstone there; after four attempts the fins fell or slipped off
    and the attempt was abandoned.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The chief ordered him put into a sea-lion stomach and instructed him to get
    out after he had floated and struck land four times.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: He floated to shore, struck land four times, got out on a nice beach, tied
    the sea-lion stomach air-tight again, and threw it out; it vanished seaward against
    the wind.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: He returned secretly in the evening, saw his wife with burnt-short hair and
    pitch on her face, saw his two children, and told his wife to bring his tools
    and conceal his return.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: He took one child from among children playing, went inland to a big lake,
    cut a large cedar so it fell across the lake, split and braced it, made a rope
    from cedar limbs, fastened the child to it, and lowered the child between the
    split wood.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: When the lowered child jerked and the lake boiled, hands and then a head came
    to the surface; the man knocked out the brace, the being struggled, and he struck
    it several times until it died.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: When he was going to cut the being open in front, lightning shot about; he
    instead cut it open from the lower back, skinned it, dried it by fire, and the
    passage identifies it as a Wā′sg̣o.
  category: sequence
  evidence_refs:
  - ev:13
