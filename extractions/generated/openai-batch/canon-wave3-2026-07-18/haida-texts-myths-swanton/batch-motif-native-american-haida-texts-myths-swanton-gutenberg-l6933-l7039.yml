canonical_text:
  quote: ''
  summary: A loved chief's daughter is sought by canoe-borne visitors. A stranger
    in a hair-seal canoe is refused, after which water rises and half covers the island.
    The town sends dressed servant substitutes, but he rejects them and accepts only
    the chief's child, who enters his self-moving canoe with ten servants and vanishes.
    Her grieving father orders his head slave to find her. The head slave ritually
    prepares with bathing, fire, blue hellebore, and face-marking, then travels with
    the girl's mother, guided by an animated sea-otter spear. They pass long seaweed
    growth, floating charcoal parted by old spruce roots, and finally reach the edge
    of the sky, where the spear braces the closing sky while they go under it.
  language: English
  quote_policy: summarized
