  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The town dresses and paints servant women as substitutes for the chief's child,
    including with cloud imagery and blankets, but the stranger refuses all ten and
    demands only the chief's child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief's child is sent without painting; when she stands near the salt
    water, the canoe comes to her by itself, and she and her ten servants enter it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the chief's child enters, the people cannot see what moves the canoe;
    the stranger is seen floating where he had been before, and the canoe vanishes
    without a known direction or visible sinking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief's father and mother cry for the vanished child; the father tells
    his head slave to find where the child went.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before starting, the head slave kindles a fire, bathes, burns blue hellebore,
    rubs it on stone floor-planks, and marks his face with it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The head slave throws a sea-otter spear into the water; the spear moves by
    throwing its tail about and the canoe follows it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: During the journey, long seaweed grows on the canoe, the chief's wife, and
    the head slave; a whole year has passed, and he cleans them with his cape before
    continuing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Floating charcoal blocks the way, but old spruce roots put into the water
