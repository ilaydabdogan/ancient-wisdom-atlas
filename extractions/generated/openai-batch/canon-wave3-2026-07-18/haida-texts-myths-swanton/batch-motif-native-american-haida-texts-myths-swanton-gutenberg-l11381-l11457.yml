canonical_text:
  quote: ''
  summary: A shapeshifting young man, identified as Sʟᴇg̣otsg̣ā′noē, enters a chief’s
    daughter’s room after becoming a burl and then ashes. The chief/father-in-law
    repeatedly tries to overcome him through lethal tests involving red-hot stones,
    a devilfish, dangerous trees, and a sea otter. The young man uses medicine received
    from a crane, survives being swallowed or enclosed, causes monsters or trees to
    burst, and resuscitates the killed people whose bones or remains are found inside.
  language: English
  quote_policy: summarized
