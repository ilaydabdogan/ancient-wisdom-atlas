- id: obs:1
  text: The boy assumed the shape of a burl lying on the beach in front of the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl ordered her slave to carry the burl into the house so that her father
    could make a hook from it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief tried to split the wood, broke two axes against it, and then threw
    the wood into the fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the wood burned, the boy in the shape of ashes flew into the girl’s
    room and resumed human shape there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl said she wanted to marry no one but Sʟᴇg̣otsg̣ā′noē, and the young
    man replied that he was Sʟᴇg̣otsg̣ā′noē.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chief prepared four hot stones for the young man, and the daughter said
    the chief always tried to kill her suitors by means of red-hot stones.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man chewed medicine received from the crane, rubbed his body with
    it, swallowed the hot stones, and survived as the stones passed through his body
    and broke the stone floor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The chief sent the young man to kill a devilfish; after the young man harpooned
    it, he fainted and the monster swallowed him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Inside the devilfish, the young man wished its stomach would burst; the stomach
    burst, the devilfish died, and bones and remains of many people came out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young man spat medicine on the remains found in the devilfish and resuscitated
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A tree assigned by the chief had bark sliding up and down; after the young
    man struck it, he fainted, woke inside the tree, wished it would break, and it
    burst open with bones of killed people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When sent to cut alder wood, the young man struck the alder, fainted, woke
    inside the tree, wished it would burst, and emerged with people the tree had killed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The chief sent the young man to catch a sea otter living in a cave; after
