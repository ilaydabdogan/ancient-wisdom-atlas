canonical_text:
  quote: ''
  summary: A returning man asks whether Ga′oax has been killed, and townspeople debate
    her fate. A mischievous person tests mountain goat meat and declares it edible
    human food. A party crosses by canoe to gamble, and a gambling dispute leads to
    a killing and general battle. Two sisters move among the fighters unharmed by
    spears and heal a wounded man. When the people of Qꜝadō′ are driven back, the
    youngest brother sends a message to his grandfather by drawing on a wooden wedge
    and throwing it into the fire. The grandfather sees the battle, opens nested boxes,
    and throws down a sky-covered object called Clouds-of-the-Killer, after which
    the Metlakahtla people are killed. An editorial note states that the combined
    story includes a well-known Tsimshian tale and mentions a common episode involving
    marriages to women with supernatural power.
  language: English
  quote_policy: summarized
