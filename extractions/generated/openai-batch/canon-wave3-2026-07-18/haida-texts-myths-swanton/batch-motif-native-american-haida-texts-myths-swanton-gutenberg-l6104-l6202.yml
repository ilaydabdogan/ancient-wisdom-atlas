canonical_text:
  quote: ''
  summary: Raven drifts away from Master Fisherman, impersonates him, lives with his
    wife, eats halibut, and repeats a fishing act involving salt water. Master Fisherman
    returns by means of his hair-seal club, beats Raven, throws him in a latrine,
    pounds him, and pins him under a rock at low tide. Raven is rescued by supernatural
    helpers, drifts away, is swallowed by a whale by wishing it, eats the whale’s
    insides, emerges when the carcass is cut open, and takes the skin and place of
    an old man to frighten people and eat the whale meat. Later episodes show Raven
    devouring his own child, being shamed by Eagle over salmon milt on his nose, and
    transforming into a woman with a transformed stone-child to deceive hunters into
    giving hair-seal meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven lies in a canoe, drifts away with the wind, ignores Master Fisherman’s
    warning, and later paddles off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven makes himself appear like Master Fisherman and lands in front of Master
    Fisherman’s wife’s house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While in Master Fisherman’s likeness, Raven addresses the wife as “my child’s
    mother,” says he is hungry, receives steamed fat halibut, eats it, drinks salt
    water, lowers a baited halibut hook into a hole where sea water is vomited out,
    and pulls out a halibut.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Master Fisherman is found near the creek by his wife and says that he wished
    his hair-seal club would swim to him; it did so and brought him to land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Master Fisherman runs in with the hair-seal club, knocks Raven down, throws
    him into a latrine, takes him out, pounds him including his bones, and rolls a
    big rock over him on the beach at low tide.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: As the tide nearly covers Raven and only his beak shows, ten supernatural
    helpers come, roll the rock off, and Raven drifts away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: One of Raven’s supernatural helpers is identified as a Tlingit who wore a
    bone in his nose like a shaman.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Raven encounters people in a canoe and says that he has a hard time for going
    after a woman.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Raven wishes that a black whale would swallow him; the whale swallows him,
    he eats its insides, and he wishes it would drift ashore with him in front of
    a town.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When townspeople cut up the whale and open a hole where Raven is, he flies
    out and then flies upward.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Raven pulls off an old man’s skin, throws away his bones, enters the skin,
    and lives in the old man’s place.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: When asked about what came out of the whale’s belly, Raven says that in an
    earlier similar event people fled in fear; the people then flee, and Raven eats
    the whale they had brought up.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Raven has Hair-seal as wife and they have a child; during a firewood trip
    Raven says he is close to eating the fat son, and later devours him after the
    child reports the statement to his mother.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: At another town Raven eats salmon leavings, and salmon milt hangs from his
    nose.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Raven asks Eagle to say that a weasel hangs from his nose, but Eagle repeatedly
    says that salmon milt hangs from his nose, making Raven ashamed.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: Raven meets hunters returning with many hair seals, changes himself into a
    woman, changes a long slender rock into a child, and calls to the hunters to marry
    him.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: In the woman form, Raven says the child wants hair seal, causes mist to fall,
    is covered with mats, eats the meat, greases stones, throws them overboard, and
    says the stones are hair seal.
  category: sequence
  evidence_refs:
  - ev:17
