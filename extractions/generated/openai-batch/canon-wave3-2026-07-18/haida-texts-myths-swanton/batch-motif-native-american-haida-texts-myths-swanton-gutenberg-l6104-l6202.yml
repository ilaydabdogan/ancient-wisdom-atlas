- id: ev:5
  type: summary
  locator: 6132-6139
  quote_or_summary: Master Fisherman runs in with the hair-seal club, knocks Raven
    down, throws him into the latrine, later removes him, pounds him again including
    the bones, and rolls a big rock over him at the beach at low tide.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 6143-6148
  quote_or_summary: Raven is nearly covered by the tide, changes himself in different
    ways, and when only his beak shows above water his ten supernatural helpers roll
    the rock off him and he drifts away.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 6148-6150
  quote_or_summary: The first supernatural helper to smell Raven is a Tlingit wearing
    a bone in his nose like a shaman.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 6151-6155
  quote_or_summary: People in a canoe ask why the chief floats on the water; Raven
    says he has a hard time for going after a woman.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 6156-6161
  quote_or_summary: A black whale comes blowing; Raven wishes it would swallow him,
    it does, he eats its insides, and he wishes it would drift ashore before a town
    with him inside.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 6162-6165
  quote_or_summary: When people cut up the whale and cut through where Raven is, he
    flies out and then flies straight up.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/haida-texts-myths-swanton.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 6165-6168
  quote_or_summary: Raven turns down at the end of the town, removes an old man’s
