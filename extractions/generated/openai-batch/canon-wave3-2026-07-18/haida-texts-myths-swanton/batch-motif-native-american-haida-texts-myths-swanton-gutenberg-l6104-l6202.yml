candidate_motifs:
- id: motif:1
  label: Shapeshifting and assumed identity
  taxonomy_refs:
  - shapeshifter
  basis: Raven appears as Master Fisherman, changes in different ways under the rock,
    enters an old man’s skin, changes into a woman, and changes a rock into a child.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:11
  - ev:16
  confidence: high
  cautions: The taxonomy label is broad; the passage gives several transformations
    but does not supply an abstract category name.
- id: motif:2
  label: Trickster deception for food and sexual access
  taxonomy_refs:
  - trickster_boundary
  basis: Raven impersonates a husband to live with the wife and obtain halibut, frightens
    townspeople to get whale meat, and deceives hunters in woman form to obtain hair-seal
    meat.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:12
  - ev:16
  - ev:17
  confidence: high
  cautions: The term trickster is inferred from repeated deceptive actions by Raven,
    not stated as a taxonomy in the passage.
- id: motif:3
  label: Survival after dismembering or crushing punishment
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Raven is pounded, including his bones, pinned under a rock, nearly covered
    by tide, and then released by supernatural helpers.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not clearly say that Raven dies, so death-rebirth or
    resurrection should be treated as approximate motif candidates.
- id: motif:4
  label: Swallowed by whale and emergence from belly
  taxonomy_refs:
  - hero_descent
  basis: Raven wishes to be swallowed by a black whale, remains inside while eating
    its insides, drifts ashore in it, and flies out when townspeople cut the whale
    open.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The available taxonomy has no specific whale-belly motif; “hero_descent”
    is only a broad nearby category, and Raven’s action is opportunistic rather than
    framed as a heroic descent.
