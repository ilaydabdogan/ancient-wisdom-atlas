canonical_text:
  quote: ''
  summary: A boy loved his uncle’s wife; the jealous uncle raised waters to kill him.
    The boy used skins, climbed an arrow chain into the sky, wandered among five upper
    countries, transformed into a hemlock leaf and was swallowed by a chief’s daughter,
    was born as a child, blinded towns by eating eyes at night, was discovered and
    cast down to earth, became Raven, subdued a wind, and deceived Xāusgana with blood-made
    woodpeckers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy was in love with his uncle’s wife, and the uncle became jealous and
    called on the waters to rise in order to kill his nephew.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Waters came from Nenk·îlsʟas’s hat and began filling the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy put on the skin of a waterfowl, carried a raven skin under his arm,
    and swam as the house filled with water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the water rose higher, the boy flew through the smoke hole, shot arrows
    into the sky to make a chain, fastened his bow to the lowest arrow, climbed upward,
    broke the sky, and went through it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Above the sky he saw five countries, including an open place with berries,
    rivers with salmon, and singing people.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: A group of women sang a song about Nenk·îlsʟasʟîñgai′ being in love with his
    uncle’s wife; at that time the boy received the name Nenk·îlsʟasʟîñgai′.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Near a sky-town pond, Nenk·îlsʟasʟîñgai′ transformed himself into a hemlock
    leaf, entered the chief’s daughter’s water bucket, was swallowed with water, and
    after two months she had a child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The child slept beside his mother but at midnight traveled to towns and ate
    the eyes of sleeping people, leaving them blind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old man stayed awake, saw the boy return with his skin blanket filled with
    round objects, and inferred that he had taken and eaten the people’s eyes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the report, the chief broke the stone floor of the house and threw the
    boy down to earth; the boy landed on the top of a totem pole, cried out, took
    raven shape, and the waters began to subside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Raven made a good canoe from maple, went to the rock from which wind blew
    continually, vanquished the southeast wind Xēiō′, and made him his slave.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Raven visited Xāusgana while seeking to steal food, told him of an island
    with many woodpeckers, struck his own nose until it bled, and transformed the
    blood into woodpeckers.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
