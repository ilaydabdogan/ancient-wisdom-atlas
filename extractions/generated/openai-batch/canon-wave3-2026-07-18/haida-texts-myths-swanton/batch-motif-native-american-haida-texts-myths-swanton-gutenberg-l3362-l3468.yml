canonical_text:
  quote: ''
  summary: The passage recounts the Food-giving-town people's settlement history,
    a children's prank involving dogfish roe that causes fighting and migration, the
    illness and burial of a man's wife who is later found married to a chief's son
    in a neighboring town, the husband's revenge killing of the pair, and a later
    encounter in which Ḷ′xakuns sees a person use wooden floats that become sawbill
    ducks to catch salmon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The town of Sqē′na is said to have existed, and Supernatural-woman-in-whom-is-thunder
    and several named peoples were settled there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some boys made cedar pieces hard and sharp with fire, attached small stones,
    and used bows to shoot dogfish roe through house-corner holes until the roe burst.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the boys burst dogfish roe skins belonging to the town chief's mother,
    trouble arose and people fought one another with arrows and war spears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several named town peoples departed by canoe; only the Food-giving-town people
    remained at first, and they later moved to Lanai′ya.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Witch people established Falling-forward town on the other side of the
    Food-giving-town people, and the two groups were good friends.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Food-giving-town man's wife became sick and instructed her husband that,
    after her death, four dogfish should be put on top of her and no ropes should
    be put around her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After four nights of suffering the wife died, was made to sit up, and after
    two nights was placed in a box with four dogfish and without a rope; her husband
    put his head into the fire in grief.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After many nights, the husband looked in the box, saw large maggots, wept,
    and struck his head against the box.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the fire was out, the husband sent a slave to Falling-forward for live
    coals; the slave saw the master's supposedly dead wife there, married to the town
    chief's son.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The slave reported that the wife had married on the other side, but the husband
    whipped him until the report had been repeated four times and then came to believe
    him.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The husband went to Falling-forward, saw his wife with another man, and later
    hid behind a post in the house at night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The husband later found only dogfish in the box, stopped crying, became happy,
    and secretly made polished knot slivers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At night the husband inserted knot slivers into the sleeping man and woman;
    in the morning Falling-forward people wailed that the chief's son and the wife
    lay dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the deaths, the husband washed his head in urine, oiled it, and put
    on Haida paint; the narration states that the woman's love had made her sick and
    that after being put in the box she went to the one she loved.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A person named Ḷ′xakuns left the town, went up the inlet, and came to a narrow
    creek amid water grasses.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: Near the creek, another person stretched out an object, threw wooden floats
    across the creek, and the floats became sawbill ducks, crossed with it, then became
    wood again.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The creek-side person pulled the object in, took two bright salmon from it,
    dried the net on two alders, and went toward the woods with the salmon.
  category: action
  evidence_refs:
  - ev:9
