canonical_text:
  quote: ''
  summary: Raven travels through several towns. Eagle misreports Raven's food preferences.
    Raven learns that one of Gū′g̣ał’s sons has pulled off a chief's son's arm, disguises
    himself in an old man's skin, gambles in Gū′g̣ał’s house, retrieves the arm from
    a box behind a screen, and restores it as a shaman. Raven later tricks a chief's
    daughter into giving him a secret beautifying substance. The passage then gives
    place-name and landscape-origin episodes involving tobacco, calcined shells, halibut,
    naming places, spearing Bad Weather, and an eagle tail feather stuck in a place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At one town, people welcome Raven and Eagle with food, and Eagle falsely tells
    the hosts that the chief does not eat the berries Raven says he likes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief's son, described as the strongest man, loses his arm after a small
    pale hand comes through the smoke hole and challenges him to try strength.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Raven knows that one of Gū′g̣ał’s sons pulled off the chief's son's arm.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Raven asks an old man in Gū′g̣ał’s town about gambling and learns that the
    arm is in a box behind a screen in Gū′g̣ał’s house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Raven pulls off the old man's skin, enters it, and appears as the old man
    with a gambling-stick bag and a cane.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Raven gambles with Gū′g̣ał’s sons, wins the eldest son's hair ribbon, and
    stays overnight in their house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: While in the house, Raven sits near two good-looking women, is fed, and uses
    bodily noises that make the women laugh and later help explain that he is still
    lying there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Raven flies behind the screen, seizes the chief's son's arm from the box,
    and escapes through the smoke hole.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Raven returns to the chief's son's father's town, acts as a shaman, washes
    the decomposing arm, sets it in place under a new mat, and the arm is restored.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Raven approaches a good-looking woman, is repulsed, places dung inside her
    blanket while she sleeps, and publicly threatens to expose what he claims to have
    found.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The woman asks Raven not to tell anyone and gives him all of a secret substance
    owned by her father; she says it brings good luck and can be used to adorn people.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage explains that the secret substance is what causes people to be
    good-looking.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Siwa′s, Raven's sister, plants Indian tobacco in front of White inlet; Raven
    calcines shells, becomes angry with them, and throws them away, leaving white
    rock surfaces where they fell.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Raven fishes for his sister, throws halibut ashore, and the passage identifies
    high, level land there as 'Halibut’s place.'
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: Raven names places as he travels, including naming one place 'Salt Stone'
    after it calls after him asking for a name.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:16
  text: Raven sets out to spear Bad Weather, makes a spear with a detachable point
    and strong gut cord, spears its head, and is pulled out to a reef until the point
    breaks.
  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: The broken spear cord strikes a declivity, and the passage explains that rocks
    there show a white streak.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:18
  text: Raven sticks an eagle's tail feather into a place, which is then called 'Eagle’s-tail-feather-stuck-in.'
  category: action
  evidence_refs:
  - ev:16
