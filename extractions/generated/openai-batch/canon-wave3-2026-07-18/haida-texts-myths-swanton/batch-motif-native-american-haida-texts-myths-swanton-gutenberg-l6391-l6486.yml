candidate_motifs:
- id: motif:1
  label: Trickster deception and disguise
  taxonomy_refs:
  - trickster_boundary
  - shapeshifter
  basis: Raven obtains information by questioning an old man, enters the old man's
    skin as a disguise, gambles in the house of Gū′g̣ał’s sons, and later tricks a
    woman into surrendering a secret substance.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:10
  - ev:11
  confidence: high
  cautions: The taxonomy label 'shapeshifter' is applied to Raven's use of another
    person's skin as a disguise; the passage does not describe a full species transformation
    in this episode.
- id: motif:2
  label: Recovery and restoration of a severed limb
  taxonomy_refs:
  - death_rebirth
  basis: The chief's son's arm is pulled off, hidden in a box, recovered by Raven,
    washed, set in place, and immediately restored.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage concerns limb restoration rather than death and full rebirth;
    the taxonomy reference is approximate and should be reviewed.
- id: motif:3
  label: Theft or coerced acquisition of a guarded powerful substance
  taxonomy_refs:
  - sacred_theft
  basis: Raven tricks the woman into giving him all of a substance her father owns
    but keeps secret; the substance brings good luck, adorns people, and causes people
    to be good-looking.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage presents coercive trickery and secret possession, but does
    not explicitly call the substance sacred.
- id: motif:4
  label: Culture hero creates place-names and landscape features
  taxonomy_refs:
  - culture_hero
  basis: Raven names places, accounts for Halibut's place, white rock surfaces, a
    white streak on rocks, and a place named for an eagle's tail feather.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  - ev:15
  - ev:16
  confidence: high
  cautions: These are etiological place and landscape episodes; broader culture-hero
    classification should be confirmed by human review.
- id: motif:5
  label: Combat with personified Bad Weather
  taxonomy_refs:
  - culture_hero
  basis: Raven makes a specialized spear, spears Bad Weather, is dragged to a reef,
    and the event explains a visible white streak on rocks.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: Bad Weather is treated as a speared entity with a head, but the passage
    provides limited description of its nature.
