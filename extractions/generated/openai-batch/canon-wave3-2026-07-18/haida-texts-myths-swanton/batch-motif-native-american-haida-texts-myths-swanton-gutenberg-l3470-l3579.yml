canonical_text:
  quote: ''
  summary: The passage recounts how net knowledge is obtained and net-making begins;
    how a creek-being leaves after pollution and becomes rock; fishing incidents involving
    flounder; the birth, offering, recovery, rapid growth, and monster-killing of
    a girl with copper fingernails; an episode explaining future stinginess after
    a salmon is eaten; the deaths of brothers; and the youngest brother’s escape from
    his sister by climbing an arrow-and-bow ladder into the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An on-looker counted seventeen meshes in a net, repeated the number as “Fifteen
    and two,” repeatedly fell down, returned to recount, and finally came away with
    the information.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Food-giving-town people came to own the net after the information was
    brought back.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After moving back to Sqē′na, the people made mesh-twining forms, gathered
    ʟᴀl bark, and the Food-giving-town women began making nets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Food-giving-town man owned a spring-salmon creek and gave it to his son;
    his sisters then put dirty things into the creek.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The creek’s supernatural being put on clothing and a black-bear hat, had four
    dorsal fins, went seaward along the creek bed, became a rock, and the creek disappeared.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Tcꜝig̣ogī′ga, a roasted flounder was left with a boy; something ran out
    of it quickly, and the boy said the food had flown away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During later fishing, the people pulled up an unidentified thing, carried
    the flounders home, handed the thing around, and a person commented on it in quoted
    speech.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Food-giving-town woman became pregnant, gave birth to a girl, and later
    a being identified as Cave-supernatural-being came from the ground and swallowed
    people together with their canoes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: While traveling by canoe, the mother threw her crawling child into the mouth
    of the pursuing being; the being went under water, and the travelers landed at
    a place named “Landing-of-many-canoes.”
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the parents slept near daybreak, they heard a child crying and found
    the child creeping on top of a whale floating in a woodland lake; the father took
    the child back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The child grew rapidly, later walked along singing despite attempts to stop
    her, did not run from an open-mouthed supernatural being, seized it, and tore
    it apart with copper fingernails.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The girl threw the being’s pieces around and said future people would see
    them; its head became the rock called “Chief.”
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Skidegate creek, the girl was said to have power disproportionate to her
    size; after bringing in a salmon, her youngest brother ate it and substituted
    a bright humpback.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The girl lamented her salmon, called it “My child, Taxē′t,” and the narrative
    says she started the condition that future people would be stingy.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Her brothers were found dead on successive mornings until seven had been found
    dead.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: One night the sister came to the youngest brother’s bed, felt for his buttocks,
    and repeatedly tried to insert an unspecified object into his anus; he evaded
    it by drawing in his belly.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: The youngest brother rose, took his quiver, ran out, and was chased by his
    sister around the island and through the house of Many-ledges.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:18
  text: At Tree island, the youngest brother shot arrows into the sky to form a chain,
    laid his bow on it so that it became a ladder, climbed up, and the ladder drew
    itself up after him.
  category: sequence
  evidence_refs:
  - ev:13
