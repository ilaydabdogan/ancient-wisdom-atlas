canonical_text:
  quote: ''
  summary: The passage recounts warfare involving the Ninstints, Pebble-town, and
    East Coast people; the scouting of an enemy canoe; shamanic acts against enemy
    souls; several omens; a gun attack that overturns and destroys a canoe while sparing
    one person; and post-battle head-taking and further portents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pebble-town people and the East Coast people are described as being at
    war with the people of Ninstints, and all are said to be at G̣ētgā′ñ.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father of Qꜝaolga′s goes hunting and sees an unidentified war canoe pass
    near Gia′g̣ēs, close to shore and behind an islet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After going out to sea and turning back, the hunter's guns are heard at G̣ētgā′ñ,
    and the passage states that he had seen the enemy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two shamans are brought, and they whip the souls of the enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A white raven is reported to have flown into the inlet; after salt water has
    been drunk for two nights, all the warriors go out to meet the enemy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The warriors creep close to shore, hesitate before rounding ʟuqā′łgᴀłdᴀs,
    then go toward Kaisun and see people walking on the beach.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A canoe comes before the people at Kaisun; they get into it and go seaward,
    with a shaman in the middle whipping enemy souls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: One Ninstints man in the canoe sees a headless cormorant flying about; Kꜝadja′-i
    alone does not see it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A shot is fired at the canoe, gunfire follows, the canoe turns bottom up,
    the people in it are shot at and destroyed, and one person is saved.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the first gun sounds, the war chief tells Sqas to take the gun away because
    it is not the time for that.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After leaving, the attackers sing war songs; the next day they cut off heads
    and dry them in the sunshine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The shaman who whipped the souls has his hair bunched together and had told
    them to go back.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the way, the Ninstints people see portents, including the sound of drying
    frames dropping from above and Tia calling nearby while blood spurts from his
    neck.
  category: sequence
  evidence_refs:
  - ev:8
