  summary: A first-person narrator recounts travel by canoe after a raid, armed encounters
    with Masset and allied people, a confrontation with Stᴀwa′t, guarded feasting,
    refusal of an offer for a slave, departure by sea, survival of wounded companions,
    camp travel, and a victorious return with slaves. An editorial note identifies
    this and nearby stories as part of a longer account of recent Haida wars or raids.
  language: English
