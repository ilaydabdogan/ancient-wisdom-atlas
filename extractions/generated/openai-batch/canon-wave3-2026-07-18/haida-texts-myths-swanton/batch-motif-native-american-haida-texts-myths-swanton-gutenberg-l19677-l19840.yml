literal_observations:
- id: obs:1
  text: A half-rock woman in a corner, also described as a woman rooted to the ground,
    is said to be very common in Haida stories.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some versions of a story use water, but fire is described as more often regarded
    as a means of communication between natural and spiritual beings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Animal souls are said to have human form and to act much as humans do on earth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fish eggs are usually collected on hemlock boughs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Killer whales are described as an important set of supernatural beings who
    live in the sea.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Killer whales are said to call human beings “common surface birds.”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A closing sky is said to be spoken of frequently.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: During mourning, people covered their faces with pitch and burned off their
    hair.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person who had almost been turned into an animal could recover his senses
    in a usual way described by the note, though the note does not detail the procedure.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The duty of obtaining a deceased person’s supernatural helpers and their power
    usually fell to the deceased person’s nephew.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A song is described as having power to calm storms.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: There was no assured safety between people unless they were of the same family
    or peace was known to exist between their families.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: Accidents were often supposed to be caused by the unfaithfulness of a man’s
    wife.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Long, narrow clouds called Yen xagî′t, probably stratus, were said to indicate
    fair weather the next day.
  category: object
  evidence_refs:
  - ev:13
- id: obs:15
  text: Devilfishes were usually used to bait hooks for halibut; to catch a supernatural
    halibut, a devilfish of the same kind was secured.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: Halibut fishing grounds were named and owned by certain families.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:17
  text: Incantations were uttered to induce halibut to take the hook.
  category: speech
  evidence_refs:
  - ev:16
