  text: One creature in the surrounding story is called Mother-of-halibut in another
    story.
  category: relationship
  evidence_refs:
  - ev:17
- id: obs:19
  text: Clouds are represented as Shining-heavens wearing different bird blankets;
    clouds are more often thought of as clothing of The-one-in-the-sea.
  category: relationship
  evidence_refs:
  - ev:18
- id: obs:20
  text: When Shining-heavens presides, or when the relevant clouds are seen, the sea
    will be calm.
  category: sequence
  evidence_refs:
  - ev:19
