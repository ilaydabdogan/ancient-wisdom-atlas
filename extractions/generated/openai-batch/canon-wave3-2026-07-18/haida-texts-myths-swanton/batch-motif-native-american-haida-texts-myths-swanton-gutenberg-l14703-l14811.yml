canonical_text:
  quote: ''
  summary: 'The passage begins with a fragment in which a boy hears a voice from the
    woods and is identified as having been taken by Land-otter people. It then gives
    an ethnographic note on the Pitch-people and presents a story from Gu′nwa: town
    children play with a shaped woody object; a red feather appears, sticks to a child,
    and pulls up nearly all the townspeople. A menstruant chief''s niece, secluded
    behind screens, is left alone. She gathers bodily and environmental materials
    associated with her brothers, later bears ten children without marriage, and raises
    them. The children repeat the game; despite their mother''s warning, several seize
    the feather and are transformed into the materials gathered earlier. One becomes
    a strong wild crab-apple tree; his sister climbs him and cuts down the feather,
    causing those attached to fall. The youngest, who has medicine in his mouth and
    a blue hole in his cheek, spits medicine on his brothers and on the bones of the
    first townspeople, reviving them. The restored people use the feather against
    snow until snow covers the houses; after a blue jay drops a ripe elderberry through
    the smoke hole, they leave through the smoke hole to see Bill-of-heaven.'
  language: English
  quote_policy: summarized
