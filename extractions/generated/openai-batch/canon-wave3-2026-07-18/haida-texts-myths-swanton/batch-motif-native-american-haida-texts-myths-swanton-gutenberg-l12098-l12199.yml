canonical_text:
  quote: ''
  summary: A man traveling along a trail helps Mouse-woman, receives a mouse skin,
    helps a woman burdened with the mountains of the Haida island, climbs to the sky,
    encounters animal and supernatural beings, reaches his wife’s town, later asks
    to leave, and is carried down by Raven, landing on a reef and making a sea-gull
    noise. A closing editorial note compares details with Eskimo myths and says the
    opening episode is widely distributed.
  language: English
  quote_policy: summarized
