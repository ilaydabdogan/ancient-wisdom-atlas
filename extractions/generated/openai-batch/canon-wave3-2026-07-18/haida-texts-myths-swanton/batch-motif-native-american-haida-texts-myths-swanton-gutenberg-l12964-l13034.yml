canonical_text:
  quote: ''
  summary: A man abandoned with his wife discovers that she secretly meets a whale
    at a mussel-gathering place. He disguises himself as her, lures the whale ashore,
    cuts off its penis, cooks it, and feeds it to his wife. When he reveals what she
    has eaten, she shakes, flees, makes a hole in the island while ashamed, goes to
    the west coast, enters the water, and becomes reefs called “Woman.” The narrator
    states that the man had not known she was a female killer whale born of a woman,
    and that stories of this type are told throughout Haida country.
  language: English
  quote_policy: summarized
