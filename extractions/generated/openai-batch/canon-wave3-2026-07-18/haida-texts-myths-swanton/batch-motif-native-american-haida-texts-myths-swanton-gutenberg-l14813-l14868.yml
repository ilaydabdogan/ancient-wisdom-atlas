canonical_text:
  quote: ''
  summary: 'A traveling party encounters a djo′lgi, which the mischievous traveler
    tears apart. A labreted woman in a big house identifies it as her child and shuts
    the house. The medicine-knowing traveler escapes as a cinder, reassembles the
    djo′lgi, and revives it with medicine, after which the grandmother-host feeds
    the party. At a second woman’s house, the mischievous traveler enters the daughter’s
    screened sleeping place and uses her belt; a heart is taken and swallowed during
    the incident, and the daughter is found dead the next morning. The party then
    loses members to successive hazards: a falling big thing, a small dog in the trail,
    and the closing edge of the sky. Two survivors see Bill-of-heaven. A final note
    says the story appears to be a Nass/Gunwa importation and is paralleled by a Masset
    myth.'
  language: English
  quote_policy: summarized
