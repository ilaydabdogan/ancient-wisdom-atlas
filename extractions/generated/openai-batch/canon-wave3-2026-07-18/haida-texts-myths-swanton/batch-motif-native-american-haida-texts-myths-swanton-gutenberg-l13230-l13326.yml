canonical_text:
  quote: At the town of Skedans two own brothers fasted to become shamans.
  summary: At Skedans two brothers fast to become shamans. The younger brother dies
    after lying with a woman. Ocean-going shamans arrive, remove his skin, and depart
    by canoe. The elder brother secretly follows them, threatens the shamans by squeezing
    round objects hanging from their armpits, and compels the return of his younger
    brother’s skin. The great shaman Sîndjā′ña-i instructs the elder about healing
    sickness for property, returns him to Skedans, and the younger brother is restored
    to life when his skin is put back on him. The elder later gains property, becomes
    a chief, and potlatches.
  language: English
  quote_policy: quoted
