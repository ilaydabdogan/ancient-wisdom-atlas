canonical_text:
  quote: ''
  summary: Sarah, declaring herself barren, gives her handmaiden 'Agar to Abraham;
    'Agar bears Ishmael, and Sarah later bears Isaac. Sarah fears Ishmael may threaten
    Isaac's inheritance, Abraham petitions God, and God commands the expulsion of
    the handmaiden and Ishmael while promising Ishmael nations and establishing covenant
    with Isaac. The passage then lists royal dominions of Ishmael's children and Isaac,
    relates dominion to Shem's blessing, names Jesus Christ as supreme king, and begins
    an account of the Ethiopian king returning home joyfully with his retinue.
  language: English
  quote_policy: summarized
