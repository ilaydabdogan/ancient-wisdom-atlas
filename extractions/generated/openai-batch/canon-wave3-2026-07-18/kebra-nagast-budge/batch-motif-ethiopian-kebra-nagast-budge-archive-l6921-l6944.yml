canonical_text:
  quote: Now it is not a seemly thing to revile the king, for he is the anointed of
    God.
  summary: The passage teaches that the king should not be reviled because he is God’s
    anointed. A good king receives divine aid, heavenly honor, and earthly glory,
    while a king who treats God lightly receives shortened days, Sheol with the Devil,
    fear, and unrest. It adds that subjects should not revile the king because retribution
    belongs to God, and it states that priests are like prophets but better than prophets.
  language: English
  quote_policy: quoted
