  quote: ''
  summary: A speaker admonishes noble addressees to reject injustice, falsehood, and
    former divinatory or magical customs. The Queen asks Azariah to speak. Azariah
    praises the Queen's God-given wisdom, praises Ethiopia and Zion/the Tabernacle
    of the Law, states that God has chosen Ethiopia after rejecting his own nation,
    and delivers Mosaic-style religious, dietary, and social commandments.
  language: English
  quote_policy: summarized
