canonical_text:
  quote: ''
  summary: The preface passage compares stories and ritual patterns of divine kingship
    and sacred arks. It describes Alexander’s recognition as son of Amen, Nectanebus
    appearing as Amen to Olympias, Makeda’s view of Solomon as divinely empowered
    through the Heavenly Zion, Babylonian and Egyptian divine arks and processions,
    Piankhi’s royal recognition through opening the ark of Ra, and Menyelek’s theft
    of the Ark of the Law together with Ethiopian symbolism linking Moses’s case to
    the Virgin Mary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A story is reported in which Alexander the Great is called the son of the
    Egyptian god Amen, and his councillors use this claim to support his right to
    rule Egypt.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alexander is taken to the Oasis of Siwah and presented to Amen of Libya; the
    god is said to acknowledge Alexander as his son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priesthood accepts Amen’s declaration, the Egyptians believe Amen’s holy
    blood flows in Alexander, and Alexander becomes ruler of South and North without
    battle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pseudo-Callisthenes and other story-tellers are said to describe Nectanebus
    II as fleeing to Macedon and establishing himself as a magician.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nectanebus becomes acquainted with Queen Olympias and appears to her one night
    in the form and attributes of Amen of Libya, then begets Alexander.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The horns of Amen are said to be transferred by tradition to Alexander, with
    Arab writers calling him Dhu'l-Karnen, meaning provided with two horns.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Makeda, queen of Saba, gives herself to Solomon because she believes him to
    be of divine origin and regards him as like a god.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Solomon is described as custodian of the Heavenly Zion, the Tabernacle of
    the Law of God, from which he receives daily renewal of divinity, power, and authority.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Tabernacle of the Law is explicitly compared with Babylonian and Egyptian
    arks or divine tabernacles that house figures of gods or characteristic emblems.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ark of Bel contains a divine figure, receives an annual royal visit, and
    is carried by priests in procession on holy days.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Egyptian divine arks are kept in special chambers; figures of gods sit enthroned
    inside them, and the arks are carried on sledges or in boats during festivals
    or solemn days.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ark of Amen has bolted and sealed doors, and on some occasions the king
    may break the seals, unbolt the doors, and see the face of the god.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Piankhi is ritually received, purified, ascends to the ark of Ra, opens it,
    looks upon the face of Ra, closes and reseals it, and is recognized by Ra as king
    of all Egypt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states uncertainty about whether Piankhi looked upon a figure
    of Ra or the benben stone symbol of the god.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: Many Egyptian sacred arks are said to contain symbolic objects rather than
    divine figures; in Osiris temples, arks contain portions of Osiris’s body.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: Menyelek is said to have covered and stolen the Ark of the Law from the Temple
    of Jerusalem.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Ark of the Law is described as probably a copy of that made by Moses and
    as a gold-plated rectangular wooden box.
  category: object
  evidence_refs:
  - ev:8
- id: obs:18
  text: The Kebra Nagast is said not to mention the Mercy seat and Cherubim, but to
    say that Moses made a ship-belly-shaped case in which the Two Tables of the Law
    were placed.
  category: object
  evidence_refs:
  - ev:8
- id: obs:19
  text: 'The passage states that Ethiopians understood Moses’s case as symbolizing
    the Virgin Mary: the case carried the Word in stone, and Mary carried the Word
    Incarnate.'
  category: relationship
  evidence_refs:
  - ev:8
