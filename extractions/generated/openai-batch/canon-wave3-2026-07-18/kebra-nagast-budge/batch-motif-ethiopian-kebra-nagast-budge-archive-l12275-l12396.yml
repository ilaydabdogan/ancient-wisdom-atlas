canonical_text:
  quote: ''
  summary: The passage presents Christian typological interpretations of Gospel sayings,
    Moses' rod, the Egyptian plagues, Moses' outstretched hands in the battle with
    Amalek, and the support given by Aaron and Hur. It repeatedly identifies these
    Mosaic scenes and objects with the Cross, the crucifixion, the Resurrection, and
    the defeat of demons and Satan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jesus is quoted with images of a door, a shepherd, and a vine, and Peter is
    addressed as a rock on which the Christian people will be built.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that the rod of Moses is to be interpreted as the wood
    of the Cross.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage recounts Moses striking river water with his rod so that it became
    blood and the fish died, and it compares this with Christ slaying Death with the
    Cross and bringing people out of Sheol.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage recounts Moses producing darkness over Egypt for three days and
    three nights, and compares this with Christ lightening human hearts and rising
    from the dead on the third day and night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The rod of Moses is described as changing and transforming by the Word of
    God, dry while possessing life and living while becoming dry.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cross and the Sign of the Cross are said to give life to Christian believers
    and enable them to drive away devils.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The passage says Christians become spiritual beings through receiving Christ's
    Body and Blood in place of spiritual beings who were exiled after transgressing
    their Lord's commandment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Moses, with Aaron, goes up a mountain to pray during Amalek's battle against
    Israel, and God commands Moses to stretch out his hand until Israel gains power.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Israel prevails when Moses keeps his hand raised and stretched out, but Amalek
    prevails when Moses' hands become heavy and drop.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Aaron and Hur pile stones to the right and left of Moses and support him so
    that his hands remain stretched out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator interprets the war of Amalek against Israel as the war of believers
    against demons, Moses' outstretched hand as the Cross of Christ, Aaron and Hur
    as the thieves on Christ's right and left, Amalek as demons, and the king of Amalek
    as Satan.
  category: speech
  evidence_refs:
  - ev:6
