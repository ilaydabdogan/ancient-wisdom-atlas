canonical_text:
  quote: ''
  summary: Solomon's son enters the House of the Lord, sees the Tabernacle of the
    Covenant of God raising itself, and resolves to carry it to his country. Solomon
    warns that only priests may carry it and that it protects Israel, but says that
    if God wills the removal it will be easy, while asking not to be informed because
    of possible oaths. The young man secretly prepares a gold-covered wooden replica,
    kills or silences craftsmen, bribes and fetters priests, has the priests carry
    away the Tabernacle by night, leaves the replica in its place, and departs without
    farewell. The narrator attributes the event to God's dispensation and links it
    to the Davidic promise. In the morning, the worshippers find that the Tabernacle
    no longer rises into the air.
  language: English
  quote_policy: summarized
