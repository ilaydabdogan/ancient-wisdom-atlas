canonical_text:
  quote: ''
  summary: The Queen prepares to depart, and Solomon privately gives her a ring as
    a remembrance and as a sign for any child conceived from their union. He says
    that if the child is male he should come to him. Solomon reports a dream in which
    a sun rises over Israel, leaves, and lights Ethiopia, and he suggests Ethiopia
    may be blessed through the Queen. He exhorts her to worship God, describes God's
    power over judgment, status, life, death, wealth, and poverty, blesses her, and
    they separate. A following heading begins to announce the Queen's bringing forth.
