canonical_text:
  quote: ''
  summary: The preface introduces the Kebra Nagast as a venerated Ethiopian work used
    as proof of Ethiopian royal descent and legitimacy. It describes the work as a
    storehouse of traditions from biblical, Rabbinic, Egyptian, Arabian, and Ethiopian
    sources; outlines a Coptic-Arabic-Ethiopic transmission history; and summarizes
    Isaac's beliefs that Ethiopian kings descend from Solomon, that Menyelek brought
    the Ark of the Covenant from Jerusalem to Aksum, and that God transferred His
    earthly abode to Ethiopia.
  language: English
  quote_policy: summarized
