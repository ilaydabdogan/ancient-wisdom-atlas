canonical_text:
  quote: ''
  summary: 'The introduction summarizes traditions and chapter contents: genealogical
    arguments about Byzantium and other kingdoms as Semitic; a prophecy and dynastic
    marriage linking Solomon’s line to Byzantium; a judicial test leading to rule;
    stories involving false oaths, flight, infidelity, and exchanged children; biblical-derived
    origins and patriarchal episodes; and an apocryphal Samson narrative culminating
    in Akamhel killing Tebreles and taking the Philistine throne.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rom/Rome/Rum, identified with Byzantium, is described as originally the inheritance
    of Japhet, son of Noah.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Darius is credited with building Antioch, Tyre, Parthia, and possibly Constantinople,
    and eighteen generations are said to separate Darius from Solomon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zanbares, an astrologer and clockmaker descended from Darius, prophesies that
    Byzantium will pass to the sons of Shem.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Zanbares' daughter marries Solomon and bears 'Adrami; 'Adrami later marries
    'Adlonya, daughter of Baltasor, king of Byzantium.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Baltasor tests 'Adrami by assigning him a difficult dispute involving trespassing
    sheep and unlawfully detained property; 'Adrami decides the case to Baltasor's
    approval and later reigns in his place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports arguments that the kings of Medyam, Babylon, and Persia
    were Semites or descended from Semitic-linked ancestry.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The Karmin narrative includes false swearing by Zaryos and Karmelos, Karmin's
    flight to Babylon, infidelity by a merchant's wife, and an exchange of children
    by nurses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nebuchadnezzar II is said in the summarized narrative to be the son of Karmin
    and therefore a Semite.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The incestuous origin of the Moabites and Amalekites is said to be repeated
    from Genesis.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Samson marries a Philistine woman, which the passage describes as a transgression
    of the Will of God.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Philistines make Samson act as a buffoon; in revenge, he pulls a roof
    down on them and slays many more with iron, stone, wood, and the jaw-bone of an
    ass.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After Samson dies, Delilah is pregnant; Delilah and her sister Maksaba each
    bear a male child who grow up together with rich apparel, neck chains, and daggers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Akamhel, Samson's son, asks why he is not ruling the city and says he intends
    to reign over Philistia.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: During a meal, Tebreles snatches meat from Akamhel, and Akamhel cuts off Tebreles'
    head with a dagger; the head falls into the dish.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Delilah tries to kill Akamhel with Tebreles' sword; Akamhel hides behind a
    pillar, then turns violently against Delilah and Maksaba.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Maksaba gives Akamhel purple cloths from her couch, promises him the throne
    of Philistia, and that evening he takes possession of it and is acclaimed king.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The passage says the well-known story of Abraham's visit to Egypt with Sarah
    is told, with a description of Ishmael's kingdom added.
  category: sequence
  evidence_refs:
  - ev:10
