  quote: ''
  summary: The passage recounts Israel's complaint that God speaks only with Moses,
    God's command that the people purify themselves, the ascent of Moses and the elders
    at Sinai, the elders' terror before the divine voice, Moses' request to see God's
    Face, the shining of Moses' face and the veil, and a Christological interpretation
    of Abraham, Isaac, and the heavenly ram as a pattern of redemption through Christ
    and honor for Mary.
  language: English
  quote_policy: summarized
