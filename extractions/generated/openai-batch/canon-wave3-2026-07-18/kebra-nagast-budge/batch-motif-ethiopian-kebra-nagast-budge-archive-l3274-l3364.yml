canonical_text:
  quote: ''
  summary: The introduction summarizes chapters in which the Israelites appointed
    to go to Ethiopia grieve over leaving the Tabernacle of the Law. Azaryas secretly
    plans to take Zion by making a replacement box; after a dream-command and angelic
    assistance, he and companions remove the Tabernacle from the Holy of Holies and
    substitute the box. Bayna-Lehkem receives Solomon's farewell blessing. The Tabernacle
    Zion is hidden on a wagon and leaves Jerusalem, after which Solomon sends its
    covering and a gold chain. Michael then guides the company on a miraculous journey
    above the ground toward Gaza, Egypt, and the Nile.
  language: English
  quote_policy: summarized
