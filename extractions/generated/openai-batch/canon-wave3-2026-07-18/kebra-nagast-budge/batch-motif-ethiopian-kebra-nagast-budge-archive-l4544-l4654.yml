canonical_text:
  quote: ''
  summary: The passage describes Zion, the Tabernacle of the Law, as a heavenly object
    brought to earth as the dwelling of divine glory. God commands Moses to make an
    earthly ark/tabernacle of incorruptible wood overlaid with gold, containing the
    covenant tablets. The passage describes the ark’s splendor, contents, transport,
    its role in the Jordan crossing, priestly service around it, sacred furnishings,
    and the Sinai revelation of its pattern.
  language: English
  quote_policy: summarized
