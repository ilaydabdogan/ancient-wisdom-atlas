canonical_text:
  quote: ''
  summary: 'The passage first recounts Judas making a covenant with Jewish high priests
    and others to deliver Christ in exchange for silver collars taken from a piece
    of wood. That wood is made into the cross on which Christ is crucified. The narrator
    explains the wood typologically: Adam fell through eating fruit from a tree in
    Paradise, and Adam and his descendants are redeemed through Christ’s crucifixion
    on wood said to have come from the region of Paradise. The wood/cross is also
    said to raise a dead body and to protect kings and Christians. Judas returns the
    silver, hangs himself, and the silver is used to buy the potter’s field. The narrative
    then returns to the transfer of David’s kingdom to Abyssinia: Solomon honors the
    Queen, she visits him to hear his wisdom, he desires her, and they make a covenant
    that he will take her only if she comes freely to him by night. Solomon then teaches
    her for days and orders strongly seasoned food prepared, which the Queen eats
    before the supplied passage breaks off.'
  language: English
  quote_policy: summarized
