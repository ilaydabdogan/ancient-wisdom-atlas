canonical_text:
  quote: ''
  summary: The Queen is made intensely thirsty after spiced food. Solomon secretly
    orders that no water be given or shown to her except by his couch. At night she
    searches for water, is directed to Solomon’s bedside, drinks there while he pretends
    to sleep, and is then declared his wife according to the Law of Kings. She recalls
    their covenant and yields to him. She conceives a child. Solomon instructs her
    to send a son to him when grown, gives her his ring as proof of paternity, invokes
    God as witness to their covenant, and promises to make the son king and send him
    back. The Queen accepts and departs for her country with her retinue.
  language: English
  quote_policy: summarized
