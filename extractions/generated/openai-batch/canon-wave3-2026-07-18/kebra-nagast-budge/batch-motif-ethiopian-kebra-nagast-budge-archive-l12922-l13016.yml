canonical_text:
  quote: ''
  summary: The passage cites Isaiah, Moses, Stephen, Acts, and Matthew to contrast
    Jewish failure to keep the Torah with Gentile reception of the Law and divine
    mercy. It interprets the Torah's angelic order as a foreshadowing of heavenly
    Jerusalem, with the throne of the Most High, fire, four beasts, and sixth and
    seventh heavens. It then explains the Tabernacle, altar horns, table, offering,
    covering, and priestly invocation of the Holy Spirit as Christian sacramental
    similitudes connected to Christ's burial, body, blood, and believers' participation
    in divine sonship and everlasting life.
  language: English
  quote_policy: summarized
