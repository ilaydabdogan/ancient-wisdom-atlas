  summary: The passage summarizes portions of the Kebra Nagast introduction dealing
    with Cain and Abel, Noah and the Flood, the preexistent Tabernacle or Ark of the
    Covenant, Canaanite seizure of cities, idolatry and Abraham’s covenantal departure,
