candidate_motifs:
- id: motif:1
  label: Sibling rivalry, disputed marriage, and fratricide
  taxonomy_refs:
  - sibling_pair
  basis: Cain and Abel are contrasted; the reassignment of Cain’s twin sister contributes
    to Cain’s envy and anger, culminating in Abel’s death.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not label Cain and Abel themselves as twins; only their
    sisters are explicitly called twin sisters.
- id: motif:2
  label: Corrupt lineage judged by flood and followed by covenant
  taxonomy_refs:
  - flood_and_renewal
  - covenant
  basis: Cain’s descendants are described as wicked before God sends the Flood; after
    the Flood, God covenants with Noah not to destroy the earth again by flood.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage mentions survivors but does not describe a vessel for Noah
    in this line range.
- id: motif:3
  label: Preexistent divine Ark as earthly abode of God
