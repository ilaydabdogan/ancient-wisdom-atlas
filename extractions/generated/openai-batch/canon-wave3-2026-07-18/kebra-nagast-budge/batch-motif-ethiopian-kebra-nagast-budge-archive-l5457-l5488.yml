canonical_text:
  quote: ''
  summary: The Queen marvels at the sights, sounds, and palace splendor arranged by
    Solomon, praises the God of Israel inwardly, and is placed where she can see without
    being seen. Solomon has prepared a richly decorated and perfumed abode and sends
    foods and drinks intended to make her thirsty. After the royal meal and the departure
    of court personnel, Solomon and the Queen are alone; he invites her to remain
    until daybreak, and she asks him to swear by the God of Israel that he will not
    take her by force.
