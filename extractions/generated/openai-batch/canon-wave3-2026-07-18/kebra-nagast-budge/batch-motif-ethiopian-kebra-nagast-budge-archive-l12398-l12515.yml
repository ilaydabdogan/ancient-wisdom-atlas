  summary: The passage interprets Israel’s bitter water as sweetened through Moses’
    rod and the Sign of the Cross; cites Davidic sayings about pierced hands, feet,
    and vinegar as referring to Christ’s crucifixion; presents a parable of a king
    punishing an arrogant slave and exalting a humble slave, then identifies the king
    with Christ, the arrogant servant with Satan, and the humble servant with Adam;
    and begins an account of angels who revile Adam because of God’s favor toward
    him and his later transgression involving one forbidden tree.
