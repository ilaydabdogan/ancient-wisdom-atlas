canonical_text:
  quote: ''
  summary: The passage presents a series of typological parallels in which Moses and
    Joshua prefigure the Saviour’s future deliverance from Sheol, judgment of Satan,
    and entry into Paradise. It then describes salvation as a Pearl created in Adam,
    transmitted through selected ancestors from Seth to Solomon and Rehoboam, and
    associated with the future birth and saving work of the Saviour.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moses is said to have brought his kinsmen out of Egyptian servitude, and the
    Saviour is said to bring the addressees out of the servitude of Sheol.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moses’ ten miracles and punishments before Pharaoh are paralleled with ten
    miracles for life to be worked by the Saviour before the people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moses’ striking of the sea and the people’s dry passage are paralleled with
    the Saviour overthrowing the walls of Sheol and bringing the addressee out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explicitly interprets the sea as Sheol, Pharaoh as Satan, and
    Pharaoh’s Egyptian hosts as devils.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Moses’ feeding of the people with manna in the desert is paralleled with the
    Saviour feeding the delivered with the food of the Garden or Paradise forever.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Moses’ forty-year desert dwelling without worn apparel or torn feet is paralleled
    with toil-free dwelling after the Resurrection.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Joshua’s bringing of the people into the Land of Promise is paralleled with
    the Saviour bringing the people into the Garden of Delight.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Joshua’s slaying of the seven kings of Canaan is paralleled with the Saviour
    slaying the seven heads of Iblis.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Joshua’s destruction of the people of Canaan is paralleled with the Saviour
    destroying sinners and shutting them in the fortress of Sheol.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The building of the house of God is paralleled with future churches being
    built on mountain tops.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: A sign is introduced that the Saviour will come from the addressee’s seed
    and deliver the addressee, his fathers, and his later seed.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Salvation is described as having been created in Adam’s belly in the form
    of a Pearl before Eve.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Pearl does not pass to Cain or Abel but enters Seth, then moves through
    selected descendants.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Pearl passes from Abraham to Isaac rather than Ishmael, from Isaac to
    Jacob rather than Esau, and from Jacob to Judah rather than Reuben.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The Pearl comes through Fares/Perez, then to Jesse, then after six men of
    wrath to David, who is described as innocent and humble.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The Pearl comes into Solomon’s loins because of his wisdom and understanding,
    after five erring fools had been born from David.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The Pearl does not pass into Solomon’s firstborn or youngest son Adrami, with
    explanations concerning peoples who did not deny or crucify the miracle-working
    one to be born from the Pearl.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: The Pearl enters Rehoboam because of the wickedness of Israel, who are said
    to have denied and crucified the one born from the Pearl; the passage states that
    without crucifixion he could not have been salvation.
  category: sequence
  evidence_refs:
  - ev:18
