canonical_text:
  quote: water flowed forth, twelve streams.
  summary: 'The passage recounts Israel thirsting at Kades after leaving Egypt, Moses
    appealing to God, God commanding Moses to strike a rock with his rod, and water
    issuing in twelve streams. The people and beasts drink, and the rock follows them.
    The narrator then gives a Christian interpretation: the rock is Christ, the streams
    are the Apostles, the water drunk is apostolic teaching, and the rod is the wood
    of the Cross.'
