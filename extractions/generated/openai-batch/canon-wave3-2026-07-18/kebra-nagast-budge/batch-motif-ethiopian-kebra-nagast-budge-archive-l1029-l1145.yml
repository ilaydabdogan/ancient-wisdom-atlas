canonical_text:
  quote: ''
  summary: The introduction describes the Kebra Nagast as a highly esteemed Ethiopian
    work regarded as authoritative for the origin of the Solomonic royal line and
    for the conversion of Ethiopians from celestial worship to the Lord God of Israel.
    It then outlines European knowledge of the work through sixteenth- to eighteenth-century
    writers and manuscript transmission, especially James Bruce’s acquisition and
    donation of Kebra Nagast manuscripts.
  language: English
  quote_policy: summarized
