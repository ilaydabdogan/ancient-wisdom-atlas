canonical_text:
  quote: ''
  summary: The passage includes a plate caption describing the Baptism of Christ by
    John, then presents an Ethiopian Christian exegetical chapter on the prophecy
    of Christ. It interprets Solomon as a figure of Christ, Solomon’s temple as Christ’s
    body and the Church, Solomon’s foreign wives as alien peoples gathered into Christ’s
    kingdom, and Song of Songs imagery as referring to the Church, saints, Scripture,
    and Christ’s incarnation. It applies Davidic psalm prophecies of sonship, kingship,
    judgment, and priesthood to Christ rather than to Solomon, while also affirming
    Solomon as a king and prophet who spoke similitudes concerning Christ and the
    Church.
  language: English
  quote_policy: summarized
