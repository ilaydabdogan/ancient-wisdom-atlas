  summary: The passage teaches that priests and bishops must not be reviled, because
    they belong to God’s house and must rebuke sins. Priests are symbolically named
    salt, lamp, light of the world, and sun that lightens darkness. The text gives
    prophetic examples of rebuking kings, contrasts Israel’s reviling of kings and
    prophets with Christian peace under a God-loving king, and says the king’s enemies
    will be scattered by the Cross of Jesus Christ.
