canonical_text:
  quote: ''
  summary: Lady Zion, the holy Tabernacle of the Law of God, is promised as a constant
    guide. David is blessed and departs. The departing company secretly places Zion
    on a wagon by night among common goods, and the caravan leaves. Jerusalem mourns
    intensely, although the people do not explicitly know Zion has been taken. Solomon
    sees the city mourning, laments the departure of his son, glory, kingdom, law,
    wisdom, and understanding, and interprets the event through biblical prophecies
    concerning Ethiopia. The next heading introduces Solomon's command to Zadok the
    priest to bring the covering upon Zion.
  language: English
  quote_policy: summarized
