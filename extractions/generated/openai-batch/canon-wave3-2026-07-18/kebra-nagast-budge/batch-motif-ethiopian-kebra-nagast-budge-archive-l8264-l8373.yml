- id: obs:1
  text: Solomon addresses the Queen and says that the speakers have been negligent
    concerning the Commandment of God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The confession contrasts love of fablemongers, family, honor, riches, horses,
    food, and apparel with neglect of repentance, God's word, justice, and enduring
    life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists actions and practices said to be hated by God, including
    augury by birds, idolatry, enquiry of witches, divination, magic, theft, oppression,
    fornication, envy, fraud, drunkenness, false swearing, and false testimony.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Solomon says that because of these hated actions God has taken the Tabernacle
    of His Covenant away from them and given it to people who do His will, law, and
    ordinance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Solomon states that God swore not to abrogate seasonal and celestial orders
    and not to destroy heaven and earth by flood or fire as long as Zion is on the
    earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Solomon says that God has taken from them the Tabernacle of His Law, and he
    weeps continually while saying these things.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Spirit of Prophecy answers Solomon that the event happened by the will
    of God and that Zion has not been given to an alien but to Solomon's firstborn
    son.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Spirit of Prophecy says that God swore truthfully to David that a descendant
    from his body would sit on his throne forever in the Tabernacle of His Covenant,
    the Holy Zion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Solomon is comforted, says that the will of God should be done rather than
    the will of man, and receives an open appearance of the Angel of God.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Angel of God tells Solomon that he will build the house of God and that,
    if he keeps God's commandment and does not serve other gods, he will be beloved
    by God like David.
  category: speech
  evidence_refs:
  - ev:6
