canonical_text:
  quote: ''
  summary: Solomon addresses the Queen with a collective confession of negligence
    toward God's commandment and a list of practices said to be hated by God. He explains
    that God has taken away the Tabernacle of His Covenant/Zion from them and given
    it to people who do His will. Solomon weeps. The Spirit of Prophecy tells him
    that this happened by God's will and that Zion has been given to Solomon's firstborn
    son, in continuity with God's oath to David. Solomon accepts God's will, and the
    Angel of God tells him he will build the house of God and be beloved if he keeps
    God's commandment and avoids other gods.
  language: English
  quote_policy: summarized
