canonical_text:
  quote: '"Of the fruit of thy body I will make to sit upon thy throne"'
  summary: The passage argues that God’s promises to David are fulfilled through Jesus
    Christ, Mary and Joseph’s Davidic kinship, and Solomonic royal lines associated
    with Ethiopia and Rome. It recounts Mary’s Davidic genealogy, the birth of God
    the Word from her, deliverance from Sheol, Satan, and death, and then narrates
    Roman origins, Constantine’s heavenly cross sign, Zanbares’ astronomical wisdom
    and prophecy of dynastic transfer, and Baltasor’s request for Solomon’s son as
    Roman heir.
  language: English
  quote_policy: quoted
