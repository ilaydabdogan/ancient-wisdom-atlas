canonical_text:
  quote: ''
  summary: Rehoboam dismisses elder counsel and consults the young men raised with
    him. They advise him to answer Israel harshly, threaten heavier forced service
    and seizure of property, and justify his rule by inheritance from David and Solomon
    and by divine grant. Rehoboam speaks this way to Israel; the people reject the
    houses of Judah and Benjamin, arm themselves, gather at Samaria, cast lots, choose
    Jeroboam, and the kingdom separates from Rehoboam except for Judah and Benjamin.
  language: English
  quote_policy: summarized
