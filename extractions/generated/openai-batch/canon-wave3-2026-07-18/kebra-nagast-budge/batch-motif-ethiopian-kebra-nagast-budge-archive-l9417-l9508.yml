- id: obs:4
  text: The young men advised Rehoboam to answer the people with bold and haughty
    words so that he would not appear weak and lose tribute, gifts, slaves, and presents.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The proposed royal speech threatened increased labour, iron chains, scorpion-whips,
