canonical_text:
  quote: ''
  summary: Joas brings Bayna Lehkem before Solomon. Solomon welcomes him, recognizes
    him as his son through resemblance to David and himself, dresses him in royal
    regalia, seats him on the throne, and publicly claims him before the nobles. The
    nobles affirm his Davidic descent and bring gifts. The young man presents a ring
    from his mother and asks for a portion of the Tabernacle covering. Tamrin relays
    the Queen's request that Solomon anoint, consecrate, and return the young man
    as king over her country. Solomon refuses to return him, arguing that a son belongs
    to the father and declaring his intention to make him king over Israel.
  language: English
  quote_policy: summarized
