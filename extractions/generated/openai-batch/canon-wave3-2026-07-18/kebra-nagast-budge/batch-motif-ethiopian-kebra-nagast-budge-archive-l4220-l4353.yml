canonical_text:
  quote: ''
  summary: The passage recounts Noah's death, Shem's blessed rule, Canaan's oath-breaking
    usurpation, Noah's plea after the Flood, and God's covenant not to destroy the
    earth again by Flood, with seasons and the rainbow as signs. It then presents
    Zion/the Tabernacle of the Covenant as pre-created, heavenly, salvific, descending
    to Noah's seed, and typologically linked by church fathers to Mary and the Incarnation.
    A later notice returns to Canaan's seizure of cities and God's vengeance restoring
    land to Shem's descendants. The passage ends with a plate caption of Moses receiving
    the Table of the Law from God's hand on Sinai.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Noah dies, and Shem reigns in wisdom and righteousness after receiving Noah's
    blessing; Ham and Japhet are assigned servitude or subjection to Shem.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Devil is said to continue hostility against Noah's children by stirring
    up Canaan, who becomes a violent usurper and takes the kingdom from the children
    of Shem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Noah divides the earth among his descendants and makes them swear not to encroach
    on boundaries, eat carrion or torn animals, or practice unlawful harlotry, lest
    another Flood punish them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Noah humbles himself, offers sacrifice, cries, groans, weeps, and asks God
    to blot him out if God destroys the earth a second time by Flood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: God makes a covenant with Noah requiring Noah's children to avoid carrion,
    torn animals, and unlawful harlotry; God promises not to destroy the earth a second
    time by Flood and grants seasonal cycles.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: God swears by Himself and by Zion, the Tabernacle of the Covenant, described
    as created for a mercy seat and for human salvation, and promises that it will
    come down to Noah's seed and remain with them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: God says the rainbow, called the Bow of the Covenant, will appear with clouds,
    crown the Tabernacle of the Law, recall the covenant, avert anger, and bring compassion.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Archbishops answer Gregory that the Tabernacle of the Covenant was created
