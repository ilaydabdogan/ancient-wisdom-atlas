candidate_motifs:
- id: motif:1
  label: Covenant after Flood prevents renewed world destruction
  taxonomy_refs:
  - flood_and_renewal
  - covenant
  - divine_judgment
  basis: God responds to Noah's plea by covenanting not to destroy the earth a second
    time by Flood and by establishing obligations and signs.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage presents the Flood retrospectively and covenantally rather
    than narrating the original Flood event in detail.
- id: motif:2
  label: Rainbow as covenant-remembrance sign
  taxonomy_refs:
  - covenant
  - flood_and_renewal
  basis: The rainbow is named the Bow of the Covenant; it appears with clouds so people
    do not fear a Flood and so God remembers the covenant and sends compassion.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The rainbow's function is explicitly covenantal in the passage; no broader
    meteorological myth is developed here.
- id: motif:3
  label: Heavenly sanctuary created before the world and descending to humans
  taxonomy_refs:
  - covenant
  basis: Zion/the Tabernacle of the Covenant is described as created before angels,
    heaven, earth, and sea abysses, and as coming down to Noah's seed for salvation.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage supports a pre-created heavenly sanctuary motif, but does
    not explicitly call it a world-center or axis.
- id: motif:4
  label: Ancestral blessing establishes hierarchy and territorial legitimacy
  taxonomy_refs:
  - royal_legitimacy
  basis: Shem is blessed as heir and ruler; Canaan's seizure of the kingdom is framed
    as usurpation, and later God restores the country to Shem's descendants.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:11
  confidence: medium
  cautions: The passage concerns lineage, kingdom, and inheritance, but it is not
    a full coronation narrative.
- id: motif:5
  label: Oath transgression followed by divine vengeance and reversed inheritance
  taxonomy_refs:
  - covenant
  - divine_judgment
  basis: Canaan transgresses the oath sworn under Noah, takes cities, and later God
    takes vengeance and transfers the country to Shem's sons.
  evidence_refs:
  - ev:3
  - ev:11
  confidence: high
  cautions: The mechanism of vengeance is summarized rather than narrated in detail.
- id: motif:6
  label: Holy womb and Incarnation typology
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: The Fathers connect God's covenant plan to putting on Adam's flesh, say salvation
    depends on heavenly Zion coming down, and state that the Creator dwelt in Mary's
    womb.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage states Incarnation and motherhood theology but does not narrate
    a birth scene.
- id: motif:7
  label: Divine law received on Sinai
  taxonomy_refs:
  - wisdom
  basis: The plate caption states that Moses receives the Table of the Law from God's
    hand on Sinai.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: This motif appears only in the plate caption, not in the prose narrative
    of the passage.
