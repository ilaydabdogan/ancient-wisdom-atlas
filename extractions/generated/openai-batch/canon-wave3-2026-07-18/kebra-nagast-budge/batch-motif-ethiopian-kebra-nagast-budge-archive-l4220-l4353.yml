    and that the heavenly thing goes about upon the earth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Three Hundred and Eighteen Orthodox Fathers declare that Zion was the
    first created thing, the habitation of God's glory, and part of a covenant plan
    involving God putting on Adam's flesh and appearing to creation.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The heavenly Zion is said to be a similitude of Mary, Mother of the Redeemer;
    built Zion holds the Ten Words of the Law, and the Creator dwelt in Mary's womb.
  category: relationship
  evidence_refs:
