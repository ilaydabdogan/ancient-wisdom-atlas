- id: obs:1
  text: The speaker reports that opponents accuse the Christian community of having
    many gods and of worshipping wood, identified parenthetically as the Cross; the
    speaker says Isaiah’s words apply to worshippers of graven images and idols.
  category: speech
  evidence_refs:
  - ev:1
