  text: The passage says that devils lead into error those who claim that images are
    gods and creators and worship them as God.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that God saved Noah in the Ark.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists biblical episodes involving Abraham in the wood of Manbar,
    Isaac saved by a ram caught in a thicket, Jacob enriched through three rods in
    running water, and Jacob blessed through the top of his staff.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says God told Moses to make a tabernacle of indestructible wood
    in the similitude of Zion, the Tabernacle of the Covenant.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says David took the Tabernacle of the Law from the city of Samaria,
