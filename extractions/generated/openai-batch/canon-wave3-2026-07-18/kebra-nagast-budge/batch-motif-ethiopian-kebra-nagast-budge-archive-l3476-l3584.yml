canonical_text:
  quote: ''
  summary: After the loss of the Tabernacle Zion, Solomon and the elders pray, conceal
    the theft, and install a gold-covered substitute box containing a copy of the
    Law. Solomon later declines morally and religiously under the influence of Makshara,
    an Egyptian princess, and performs an act interpreted as worship of Egyptian gods.
    Near death he is rebuked and instructed by an angel, who prophesies Christ, the
    Virgin Mary, the Pearl lineage, and angelic guardianship over Solomon’s sons and
    the Tabernacle in Ethiopia. Solomon dies, Rehoboam is anointed, the people revolt
    and make Jeroboam king, and the passage closes with Davidic genealogy leading
    to Mary and Joseph.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Solomon agrees that the Will of God is irresistible and calls others to kneel
    with him in the Holy of Holies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After prayer and tears, Solomon advises keeping the theft secret so that outsiders
    will not boast over the misfortune.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elders set up a box made by Azaryas, cover it with gold and decorations,
    and place a copy of the Book of the Law inside it instead of the Two Tables.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jerusalem is described as free, heavenly, and as the earthly Gate of Heaven;
    the people resolve to do God’s Will so God may remain with and protect Israel.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The loss of the Tabernacle Zion is said to weaken Solomon’s love for God,
    cause his wisdom to leave him, and lead him to devote himself to women during
    his final eleven years.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Makshara, an Egyptian princess married to Solomon, first induces his household
    to worship her idols and then influences Solomon through her beauty.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Makshara reminds Solomon that Lady Zion has been carried off and urges him
    to worship the gods of her fathers, but he refuses for a time.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Makshara ties a scarlet thread across the door of her gods, places three locusts
    in the house of her gods, and asks Solomon to enter without breaking the thread
    and kill the locusts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrator states that Solomon’s action somehow constituted worship of Egyptian
    gods and that entering an Egyptian temple was an offence against the God of Israel.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Solomon is sixty and sick, the Angel of Death approaches, and Solomon
    weeps and prays for mercy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Angel of God rebukes Solomon for excessive love of women and for marrying
    alien women.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The angel refers to Solomon’s sons David, Rehoboam, and Adrami, and says that
    Joseph, Moses, and Joshua were types of Christ.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The angel says Christ will spring from Solomon’s seed and redeem mankind.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The angel prophesies concerning the Virgin Mary and narrates the history of
    the Pearl passing through a genealogy from Adam to Hanna, mother of Mary.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The angel says Michael will remain with the Tabernacle in Ethiopia, Gabriel
    with Rehoboam, and Uriel with Adrami.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: Solomon asks when the Saviour will come, and the angel answers that it will
    be after thirty-three generations.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The angel tells Solomon that the Israelites will crucify the Saviour and be
    scattered over the earth; Solomon weeps and laments.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:18
  text: After Solomon dies, Zadok anoints Rehoboam king; a wooden tablet bearing Solomon’s
    name is laid on the Tabernacle, and the people set Rehoboam on the royal mule
    and acclaim him.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:19
  text: Because of Rehoboam’s arrogant behavior, the people revolt, go to Beth Efrata,
    and make Jeroboam son of Nebat king over them.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:20
  text: The passage states that forty-one generations run from Rehoboam to Joachim,
    grandfather of Christ, and that Mary and Joseph are both descended from David.
  category: relationship
  evidence_refs:
  - ev:15
