candidate_motifs:
- id: motif:1
  label: stolen sacred object concealed by substitute
  taxonomy_refs:
  - sacred_theft
  basis: The passage refers to the theft of the Tabernacle Zion, advises secrecy,
    and describes a replacement gold-covered box containing the Law in lieu of the
    Two Tables.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: high
  cautions: The passage is a summary in the introduction and does not narrate the
    original theft in full within this line range.
- id: motif:2
  label: covenantal object and Law preserved after loss
  taxonomy_refs:
  - covenant
  basis: The substitute box is made to contain the Book of the Law in place of the
    Two Tables, preserving a sacred legal object after the Tabernacle Zion’s loss.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The word covenant is not used in this excerpt; the identification rests
    on the Law and Two Tables.
- id: motif:3
  label: heavenly Jerusalem as gate of divine presence
  taxonomy_refs:
  - world_center
  basis: Jerusalem is described as heavenly and as the earthly Gate of Heaven, with
    God’s presence expected to watch over Israel.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives theological language but does not develop a full cosmological
    map.
- id: motif:4
  label: loss of sacred object followed by royal decline
  taxonomy_refs:
  - wisdom
  basis: The loss of Tabernacle Zion is followed by Solomon’s waning love for God,
    departure of wisdom, and devotion to women.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a passage-specific pattern; taxonomy reference is limited to the
    explicit loss of wisdom.
- id: motif:5
  label: foreign spouse induces idolatrous transgression
  taxonomy_refs: []
  basis: Makshara, an Egyptian princess, brings idol worship into Solomon’s household
