canonical_text:
  quote: ''
  summary: Solomon makes his son David king of Ethiopia and orders that the firstborn
    sons of Israelite nobles accompany him, taking inherited ranks corresponding to
    their fathers' positions. A list of appointed officials is given, along with gifts
    of animals, vehicles, wealth, textiles, and precious stones. The departing nobles
    and families grieve and secretly revile Solomon for taking their sons, while publicly
    praising his wisdom and connecting his expansion to the Abrahamic blessing. The
    passage ends with a theological statement that God rules all and gives kings authority
    to judge, with God's Spirit resting in the king's heart.
  language: English
  quote_policy: summarized
