canonical_text:
  quote: God hath taken away, and there is none who shall bring back.
  summary: A lamenting speaker recalls bringing the Tabernacle of the Covenant into
    a house, offering sacrifices, and seeing the house filled with divine glory. Three
    years later, the speaker laments that God has taken away light, honour, life,
    and “our Lady,” calls on David to weep, confesses failures of priests and kings,
    describes communal defeat and mourning, and declares that God’s judgment cannot
    be reversed. The passage closes with rebukes against priests who prefer worldly
    pleasures over Scripture, prayer, fasting, alms, praise, and watching.
  language: English
  quote_policy: quoted
