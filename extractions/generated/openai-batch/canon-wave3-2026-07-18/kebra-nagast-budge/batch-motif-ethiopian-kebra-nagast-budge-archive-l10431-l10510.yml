  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Akamhel forces the women out of the house, takes the purple apparel, and the
    women return and secretly bury Tebreles' body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When young men and stewards cannot find their king, his mother says that the
