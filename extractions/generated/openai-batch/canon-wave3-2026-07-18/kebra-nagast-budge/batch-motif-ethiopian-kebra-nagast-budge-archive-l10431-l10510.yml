canonical_text:
  quote: ''
  summary: The passage narrates Akamhel's claim to kingship, his killing of Tebreles
    during a closed meal, the concealment of Tebreles' death, Akamhel's installation
    on the Philistine throne, and the narrator's concluding claim that the kingdom
    of the Philistines belongs to the seed of Shem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Akamhel asks his mother Delilah why he is not reigning on the throne and later
    says he will remain and be king there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Delilah tells Akamhel that the throne and city did not belong to his father
    and that he should later go to his father's throne.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: During a meal behind shut doors, two women sit together, two youths eat and
    play before them, and a maidservant holds the dish between them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tebreles snatches a piece of flesh from Akamhel, and Akamhel draws his sword
    and cuts off Tebreles' head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the killing, the mothers are seized by fear and do not speak to anyone.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The handmaiden takes Tebreles' head from the dish, puts it back on the neck,
    and covers it with her garment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Delilah seizes the sword of the dead youth and goes to kill Akamhel, but he
    hides behind a pillar and prepares to kill his mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Maksaba restrains Delilah, takes the sword from her, gives Akamhel rich purple
