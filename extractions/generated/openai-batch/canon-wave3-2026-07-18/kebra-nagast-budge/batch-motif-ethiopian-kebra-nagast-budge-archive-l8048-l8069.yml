    gifts. Before receiving the embassy, Solomon asks whether the noble has seen Ethiopians
    fleeing by that road. The ambassador says he came from Alexandria through Cairo
    and reports that the Ethiopians also arrived there after three days on the Takkazi,
    travelling with flutes and wagons compared to the host of heavenly beings.
