  summary: Abraham and Sarah, facing famine in Canaan, travel to Egypt. Abraham asks
    Sarah to identify him as her brother because he fears Egyptians will kill him
    for her beauty. Pharaoh takes Sarah after giving Abraham silver, but an angel
    with a fiery sword confronts Pharaoh, rebukes him, and orders Sarah returned with
    gifts.
