canonical_text:
  quote: ''
  summary: The passage summarizes Menyelek’s departure from Jerusalem, Solomon’s plan
    for a duplicate Jewish kingdom in Ethiopia, Makeda’s request for a holy token
    from the Tabernacle Zion, the conspiracy to steal the Tabernacle Zion and replace
    it with a wooden copy, the escape toward Ethiopia, Solomon’s failed pursuit, Menyelek’s
    reception at Dabra Makeda, Makeda’s abdication, and the establishment of an Ethiopian
    kingdom modeled on Israel. It also notes later claims about Solomonic descent,
    Hebrew-derived laws and customs, authorial attempts to connect other kingdoms
    to Semitic origins, and Christian interpretations identifying Mary symbolically
    with the Tabernacle of the Covenant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Menyelek saw that Rehoboam would succeed Solomon on Israel’s throne and pressed
    Solomon for permission to depart from Jerusalem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solomon arranged for the eldest sons of his nobles to accompany Menyelek to
    Dabra Makeda and arranged for a duplicate Jewish kingdom to be established in
    Ethiopia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Makeda had learned in Jerusalem that the Tabernacle Zion in the Temple was
    the abode of the God of Israel and asked Solomon to send her a portion of the
    fringe of its covering as a holy talisman.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Menyelek, Tamrin, and the eldest sons of Jewish notables formed a conspiracy
    to steal the Tabernacle Zion and carry it to Ethiopia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The conspirators’ stated object was to keep the God of Israel with them by
    taking the Tabernacle made of gold and wood.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Tabernacle is described as made according to the pattern of an original
    Spirit-Tabernacle in heaven and as containing the Two Tables of the Law, the pot
    of manna, Aaron’s rod, and other items.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A conspirator with access to the Tabernacle chamber removed the Tabernacle
    from under its curtain and substituted a wooden construction of the same size
    and shape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The theft was discovered only after Menyelek, Tamrin, and their company were
    already on the road to the Red Sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Solomon sent swift horsemen and then followed himself, but the thieves escaped
    and Solomon returned to Jerusalem in grief.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Menyelek reached Dabra Makeda, where he and the Tabernacle Zion were received
    with rejoicing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Makeda abdicated in favor of Menyelek, who established a kingdom in Ethiopia
    modeled on Israel and introduced laws and rules associated with Moses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The introduction says the Kebra Nagast later says little about Menyelek after
    his coronation and is silent about Makeda after her abdication.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The author is said to expect readers to assume that Ethiopia was ruled by
    descendants of Solomon and Makeda for about two thousand years and that Ethiopian
    religion, laws, and customs were substantially those of Hebrews in Palestine under
    the kings of Israel.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Another group of chapters is described as summarizing Old Testament prophecies
    about the Coming of the Messiah, applying them to Jesus Christ, and identifying
    the Virgin Mary symbolically with the Tabernacle of the Covenant.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: A heading presents the topic as the transfer of the kingdom of David from
    Jerusalem to Ethiopia.
  category: speech
  evidence_refs:
  - ev:10
