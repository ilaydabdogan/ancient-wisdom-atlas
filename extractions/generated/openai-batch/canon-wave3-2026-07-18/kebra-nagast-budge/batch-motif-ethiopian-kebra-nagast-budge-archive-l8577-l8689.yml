canonical_text:
  quote: ''
  summary: 'After the loss of Zion, Solomon and the elders of Israel agree to keep
    the matter secret and establish a covenant in the House of God. The passage then
    narrates Solomon’s later decline: he loves Makshara, daughter of Pharaoh, lives
    in an ornate house made for her, fails to rebuke her idol worship, and is said
    to forget his wisdom under God’s wrath. Makshara attempts to persuade him to worship
    Egyptian gods, but Solomon replies that such gods are human-made objects and says
    that he worships the Holy God of Israel and holy heavenly Zion, the Tabernacle
    of the Law.'
  language: English
  quote_policy: summarized
