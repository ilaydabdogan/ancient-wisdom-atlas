canonical_text:
  quote: ''
  summary: Solomon prepares abundant sacrificial offerings for his son David. Azaryas
    is permitted to offer sacrifice and later, after a nocturnal angelic appearance,
    is instructed to take the Tabernacle of the Law of God, called Zion. Azaryas and
    three companions enter the opened sanctuary, remove Zion, replace it with pieces
    of wood under its covering, hide Zion with lamps, incense, sheep sacrifice, and
    purple cloths for seven days and nights. The King of Ethiopia then comes to his
    father Solomon for a farewell blessing, and Solomon blesses him by invoking God’s
    blessings on David, Abraham, Isaac, and Jacob.
  language: English
  quote_policy: summarized
