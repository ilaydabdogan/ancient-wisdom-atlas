literal_observations:
- id: obs:1
  text: The archbishops say the kings of Ethiopia became great through Zion, while
    the kings of Rome became great through the nails of the Cross made by Helena into
    a bridle, called the vanquisher of the enemy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The archbishops say the chariot containing Zion belongs to the king of Ethiopia
    and ask how long it and Rome's vanquisher will remain with their kings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gregory says a future Roman king and an associated archbishop will transgress
    the faith, pervert apostolic teaching, and turn Scripture to suit themselves.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gregory says the vanquisher of the enemy will be taken from those who destroy
    the faith, and that an Angel of God has been commanded to protect the throne of
    Peter in Rome.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gregory identifies the unfaithful Roman king as Marcion the Apostate and says
