  summary: Gregory answers church leaders about the sacred objects associated with
    Rome and Ethiopia, prophesying the loss of Rome's vanquisher after a future corruption
    of faith, the continuing orthodoxy of Ethiopia, the future return and manifestation
    of Zion, and the raising of the dead with eschatological witnesses.
