canonical_text:
  quote: ''
  summary: A young Ethiopian royal figure arrives in his mother's country and is repeatedly
    mistaken for King Solomon because of his exact likeness to him. Spies verify that
    Solomon is still in Jerusalem and report the resemblance. Solomon reacts with
    emotion, and the narrator frames the young man as Solomon's eldest son, the King
    of Ethiopia, within Davidic and Christian royal theology. Solomon then sends his
    army commander with gifts to summon Bayna Lehkem, who thanks the Lord of Israel
    and hopes to see the king and return safely to Ethiopia and his mother the Queen.
  language: English
  quote_policy: summarized
