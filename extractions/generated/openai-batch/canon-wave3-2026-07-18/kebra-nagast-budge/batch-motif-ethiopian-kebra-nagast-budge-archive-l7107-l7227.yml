canonical_text:
  quote: ''
  summary: Azaryas devises a secret plan involving a carpenter-made wooden framework
    connected with Zion. In a night vision, the Angel of the Lord instructs him to
    perform sacrifices and to bring forth the Tabernacle of the Law of God, explaining
    that God will cause it to depart from Israel. Azaryas reports the vision to his
    companions, and David petitions Solomon for permission to depart and offer sacrifice
    in Jerusalem and Zion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Azaryas tells his companions to follow his instructions and asks each of them
    for ten didrachmas to pay a carpenter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The carpenter is to prepare wooden planks or a framework matching the height,
    breadth, length, and size of Lady Zion.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Azaryas says he will tell the carpenter that the framework is for a raft to
    use during sea travel if a ship sinks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Azaryas says he will take the unassembled framework, have it put together
    in Ethiopia, set it in Zion's habitation, drape it with Zion's draperies, take
    Zion, dig a hole, set Zion there, and not tell the king until they have travelled
    far.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The companions give Azaryas ten didrachmas each, totaling one hundred and
    forty didrachmas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A carpenter fashions a good piece of work from remnants of wood from the house
    of the sanctuary, and Azaryas shows it to his brethren.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: While Azaryas sleeps at night, the Angel of the Lord appears to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Angel commands Azaryas to take four yearling goats for the sins of Azaryas,
    Telmeyas, Abis, and Makri, four pure yearling sheep, and an unyoked ox.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Angel directs that the ox be offered on the east side of Zion, with the
    sheep and goats placed to the right, left, and west near its exit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Angel says David will ask Solomon for permission to offer sacrifice to
    Jerusalem and to Lady Zion, the holy and heavenly Tabernacle of the Law of God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Angel says Azaryas will offer the sacrifice, bring forth the Tabernacle
    of the Law of God afterward, and receive further instruction about bringing it
    out.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: The Angel states that the matter is from God and that Israel has provoked
    God to wrath, so God will make the Tabernacle of the Law of God depart from Israel.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:13
  text: Azaryas wakes rejoicing, remembers the Angel's instructions, and remembers
    that the Angel sealed him with the sign of the Cross, strengthened him, and heartened
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Azaryas tells his brethren that the Tabernacle of the Law of God has been
    given to them, that God has made blind His eye with respect to the kingdom of
    Israel, and that its glory has been given to others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:15
  text: Azaryas says Solomon's kingdom is to be seized by them except for two rods,
