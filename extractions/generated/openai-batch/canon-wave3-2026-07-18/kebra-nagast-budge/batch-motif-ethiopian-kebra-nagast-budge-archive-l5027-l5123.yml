  quote: ''
  summary: The passage describes Solomon's rich hospitality toward the queen, her
    astonishment at his wisdom, speech, judgment, and royal bearing, Solomon's technical
    supervision of the building of the House of God, his God-given wisdom including
    knowledge of animals and control over devils, Makeda's speech praising Solomon
    with light and precious-object similes, and Solomon's reply that his wisdom comes
    from the God of Israel. A plate caption also mentions Aaron holding a blossomed
    rod.
