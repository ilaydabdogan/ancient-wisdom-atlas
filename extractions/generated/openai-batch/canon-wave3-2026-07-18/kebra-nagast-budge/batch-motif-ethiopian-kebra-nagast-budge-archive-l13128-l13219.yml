canonical_text:
  quote: ''
  summary: Archbishop Cyril answers a polemical addressee by citing Jesus' teaching
    that those who hear and do the Father's will are his kin. He argues that martyrs,
    monks, and consecrated holy places are loved by God, that prayers in consecrated
    tabernacles are heard, and that the Holy Spirit transforms consecrated wood. He
    supports this by biblical examples involving the rods of Moses and Jacob, including
    Moses' rod becoming a serpent and swallowing the magicians' rods before Pharaoh.
    He concludes by invoking Hebrews' examples of salvation by faith and Christian
    belief and baptism.
  language: English
  quote_policy: summarized
