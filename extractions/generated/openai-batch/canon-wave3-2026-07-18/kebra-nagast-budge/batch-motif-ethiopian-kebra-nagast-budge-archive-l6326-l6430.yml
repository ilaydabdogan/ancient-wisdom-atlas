canonical_text:
  quote: ''
  summary: Solomon proposes extending Davidic kingship through his son and through
    allied royal lines, sending priests and laws so peoples will serve the God of
    Israel. The priests, officers, and councillors consent to send their children
    with Solomon's firstborn to Ethiopia. The son is consecrated as king with oil,
    music, priestly proclamation, a ritual act at the altar, a new royal name, procession
    on Solomon's mule, territorial blessings, and instruction to observe God's decrees
    in Ethiopia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Solomon cites a prophecy attributed to David that Solomon's seed will become
    three heads of kingdoms, with Rehoboam reigning over Israel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solomon says priests and laws will be sent so that peoples will worship and
    serve the God of Israel under three royal heads.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Solomon proposes making the young man king and sending him away with the children
    of wealthy and high-ranking men, whose children will rule according to their families'
    positions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The priests, officers, and councillors answer that Solomon may send his firstborn
    and that they will send their children according to his wish.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The children are prepared to be sent to Ethiopia, where they and their descendants
    are to reign and dwell from generation to generation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The coronation preparations include oil of kingship and the sounding of horns,
    flute, pipes, harp, and drum, with the city resounding in joy.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man is brought into the Holy of Holies, lays hold of the horns of
    the altar, receives sovereignty by priestly proclamation, and is anointed with
    holy kingship oil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After leaving the house of the Lord, the young man is named David by law,
    placed on Solomon's mule, led around the city, and acclaimed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The blessing assigns an Ethiopian dominion extending from the River of Egypt
    to the west of the sun and from Shoa to the east of India, and says the Lord God
    of Israel will guide him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The blessing says the Tabernacle of the Law of God will be with all that the
    new king looks upon, his enemies will be overthrown, and he will judge many nations
    without being judged by them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Solomon blesses the son with the blessing of heaven and earth, and tells Zadok
    to teach him the judgment and decree of God to observe in Ethiopia.
  category: action
  evidence_refs:
  - ev:7
