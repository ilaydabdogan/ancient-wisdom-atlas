canonical_text:
  quote: ''
  summary: The passage contrasts rejected Israel with honored Ethiopia, says Zion
    has come to Ethiopia, and narrates Makeda giving the kingdom to her son David/Menyelek.
    The son pledges obedience to his mother, warns that obedience regarding Zion brings
    divine protection while disobedience brings wrath and defeat, and recalls his
    Jerusalem anointing by Zadok with the oil of sovereignty, alongside the priestly
    and custodial appointments of Azariah and 'Almeyas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the people of Ethiopia forsook idols and were chosen and
    honored, while Israel and the daughters of Zion were rejected or disgraced.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zion is described as having been taken from Israel and as having come into
    Ethiopia, with her dwelling dependent on God's pleasure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Makeda gives the kingdom to her son David, son of Solomon, and states that
    she has made king the one whom God made king.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Makeda describes her son as keeper of God's Pavilion, envoy of the Tabernacle
    of Covenant and Law, director of widows, and giver of food to orphans.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king rises, girds his apparel, bows low before his mother, and pledges
    to serve and obey her even in matters of death or life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king asks his mother to pray that the God of Israel will deliver him from
    wrath if the people fail to do God's will regarding Zion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king says the Angel of God's host directed them, brought them to their
    present place, and will not depart from or forsake them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The king states that right conduct will bring God's dwelling and protection,
    while failure to keep right hearts will bring wrath, withdrawal of God's face,
    enemy plunder, defeat, and destruction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king says they brought with them the Law of the kingdom and the commandment
    of God.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Zadok the high priest anointed the king with the oil of sovereignty; Azariah
    was anointed to the priesthood, the king to the kingdom, and 'Almeyas was appointed
    keeper of the Law and Zion and Ear of the King.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Jerusalem commissioning involved horns, organs, harps, musical instruments,
    and outcries, and the speaker says it seemed as though earth quaked and the heavens
    thundered.
  category: setting
  evidence_refs:
  - ev:5
