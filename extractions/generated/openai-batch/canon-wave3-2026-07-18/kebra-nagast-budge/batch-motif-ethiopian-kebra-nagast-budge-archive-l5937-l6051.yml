canonical_text:
  quote: ''
  summary: Benaiah, Solomon’s commander, urges Bayna Lehkem to prefer Solomon and
    Israel over his mother and homeland, describing Israel as God’s promised inheritance
    and Bayna as David’s seed with a claim to Israel’s throne. Ethiopian merchant
    headmen answer by praising their own country’s climate, water, mountains, fruits,
    grain, and cattle, while acknowledging Israel’s superior wisdom. Benaiah praises
    wisdom as cosmically foundational and summons Bayna to Solomon. Bayna clothes
    Benaiah and his fifty men in fine garments, they go toward Jerusalem, and Benaiah
    reports Bayna’s noble appearance and resemblance to Solomon. Soldiers and others
    mistake or compare Bayna’s appearance with Solomon’s, and Israel crowds outside
    to see him.
  language: English
  quote_policy: summarized
