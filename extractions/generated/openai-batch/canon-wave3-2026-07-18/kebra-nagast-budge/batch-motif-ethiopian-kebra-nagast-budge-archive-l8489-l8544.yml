  quote: ''
  summary: A speaker recounts Israelite kingship from Saul to David, describes contested
    attempts to carry Zion, emphasizes that Zion moves only by her own will and God's
    will, applies this to Zion's going to Ethiopia, and consoles Solomon with sayings
    about wisdom and foolish speech.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment says an unnamed male received vision and prophecy, pleased
    God in all actions, and ruled Israel for forty-eight years.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people entreated God for a king like surrounding nations, and Samuel the
    Prophet anointed Saul as king.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Saul is described as being from Benjamin, the youngest branch of Israel, and
    as reigning for forty years.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Samuel the Prophet also anointed David, who is addressed as Solomon's father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Philistines fought Saul; Saul was conquered and died with Jonathan his
    son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Saul's remaining sons wished to carry away, hide, and transfer Zion to the
    Valley of Gilboa after Saul and Jonathan died.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Zion would not let Saul's sons carry her away, and the passage states that
    Zion cannot be carried unless she and God wish it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: David later took Zion and brought her to Jerusalem, dancing and clapping in
    joy before her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker says that Zion's going to Ethiopia could not be prevented if God
    and Zion herself willed it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker says Zion went of her own will and may return of her own will
    if God pleases; if she does not return, this too will be God's pleasure.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The speaker says Jerusalem may remain to Solomon and the speakers if God wills
    it, including the house of God Solomon built.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The speaker tells Solomon not to be sad and says the wisdom given to him by
    the Lord God of Israel has sprouted from him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage uses proverbial comparisons involving a lamp and the sun, vinegar
    and aloes with honey, smoke in the eye, unripe fruit on the tooth, and the words
    of fools in relation to the wise.
  category: speech
  evidence_refs:
  - ev:6
