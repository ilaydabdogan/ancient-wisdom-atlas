    on others. Moses and Aaron intercede with incense and censers, invoking Abraham,
    Isaac, and Israel. God shows compassion and instructs Moses to command the people
    to sanctify themselves and bring rods, with Aaron's rod marked and Moses's rod
    left unmarked as a miracle, vindication, and sign of life.
