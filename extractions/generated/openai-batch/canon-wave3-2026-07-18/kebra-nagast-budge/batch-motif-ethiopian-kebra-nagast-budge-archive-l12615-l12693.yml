canonical_text:
  quote: ''
  summary: The passage recounts angels receiving human flesh, descending from heaven,
    joining the revelry of the children and daughters of Cain, sinning with the women,
    and being judged by God. Their offspring are born violently and become giants.
    God announces a limited span of one hundred and twenty years and destruction by
    flood for sinners, while Noah is instructed to build a wooden four-sided, three-storied
    ark and is saved through belief and obedience. The passage also begins a later
    explanation by noting that God could have saved Noah by giving him an eagle-like
    wing, but chose another means.
  language: English
  quote_policy: summarized
