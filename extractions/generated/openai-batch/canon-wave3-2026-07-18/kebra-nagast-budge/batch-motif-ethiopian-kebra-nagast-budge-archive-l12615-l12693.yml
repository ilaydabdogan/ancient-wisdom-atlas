  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that God does not rest in the hearts of the arrogant and
    revilers, but abides in the hearts of the humble and sincere, and it cites Gospel
    sayings against self-righteousness and self-magnification.
  category: speech
  evidence_refs:
  - ev:2
