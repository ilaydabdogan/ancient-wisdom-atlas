canonical_text:
  quote: ''
  summary: The passage describes a prophetic sequence in which the kingdom of the
    Jews ends, the Kingdom of Christ is constituted until the False Messiah, and Justinus
    of Rome and Kaleb of Ethiopia meet in Jerusalem. Their archbishop prepares offerings;
    the kings establish the faith, exchange gifts and peace, divide the earth from
    Jerusalem, and share royal titles linked to David and Solomon. Kaleb leaves his
    firstborn Israel, returns to Ethiopia, offers himself in praise, enters a monastery,
    and appoints his youngest son Gabra Maskal as king. A son of Kaleb associated
    with Nagran comes to reign over Zion, leading to conflict with Gabra Maskal at
    the Sea of Liba. Both pray through the night, and God assigns Zion to Gabra Maskal,
    who reigns openly, while Israel receives the chariot and reigns secretly and invisibly
    among transgressors. The passage ends by attributing Ethiopia’s glory to Zion,
    the Tabernacle of the Law of God, and by an affirmation that the account was revealed
    through the Holy Spirit and agrees with the book of Damotiyos of Rome.
  language: English
  quote_policy: summarized
