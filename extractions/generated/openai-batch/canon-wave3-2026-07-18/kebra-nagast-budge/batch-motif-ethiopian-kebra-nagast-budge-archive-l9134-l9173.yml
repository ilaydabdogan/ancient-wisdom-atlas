canonical_text:
  quote: ''
  summary: The passage states that a sinless crucified figure rose without corruption,
    descended into Sheol, broke its walls, and delivered those addressed. It promises
    that men and women who carried the holy Pearl in a named ancestral succession
    will not be destroyed and will be purified by it. Zion is said to abide with the
    addressee's firstborn for the salvation of Ethiopia. The Pearl is to be carried
    by Rehoboam, born from the addressee's seed, and associated with the Redeemer
    coming from His Godhead to take on flesh.
