canonical_text:
  quote: ''
  summary: The passage presents a dialogue in which saints and bishops affirm Ethiopia’s
    exalted royal and sacred status because of heavenly Zion and the Tabernacle of
    the Law and Covenant. Gregory interprets Mary as the likeness of heavenly Zion,
    describes the virgin birth of Christ, begins an interpretation of Genesis, and
    explains Mosaic prophecy about Christ, including the raised brass serpent as a
    life-giving sign for those who look and believe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A gathered group of saints says that the King of Ethiopia is more exalted
    and honourable than other earthly kings because of the glory and greatness of
    heavenly Zion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The saints say that God loves the people of Ethiopia because they destroyed
    idols without knowing His Law, while those who had received the Law made and worshipped
    idols.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bishops accept Gregory’s words as true and say that Ethiopia is the place
    of God’s habitation, heavenly Zion, the Tabernacle of His Law, and the Tabernacle
    of His Covenant.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bishops describe the Tabernacle of the Covenant as a mercy-seat connected
    with mercy for human beings and with rains, waters, vegetation, fruits, peoples,
    countries, rulers, humans, animals, birds, and creeping things.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Gregory says salvation has been given to Christian people who have believed
    in Mary, whom he calls the likeness of heavenly Zion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Gregory says the Lord dwelt in the Virgin’s womb and was brought forth without
    carnal union.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Gregory says the Decalogue was written by the Finger of God and placed in
    Zion, the Tabernacle of the Law of God.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: An interlocutor asks about the beginning of the Book, and the answer identifies
    it as the Law written concerning Christ, the Son of God.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The creation account says God made the heavens and earth; the earth was formless,
    with darkness, winds, water, mist, and dust mixed together, and the Spirit of
    God hovered above the waters.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The interpretation says that the heavens and earth were created by the Word
    of God and that the Spirit of God dwelt over all creation.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Moses is said to have proclaimed that a prophet like himself would rise from
    among the brethren and that anyone who would not hearken to that prophet would
    be rooted out from the people.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: When serpents afflicted the children of Israel, Moses cried out to God, and
    God instructed him to make and suspend a brass image of a serpent as a sign.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Those bitten by serpents who looked at the brass serpent image and believed
    lived; those who failed to look died.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: 'The passage draws a likeness between the brass serpent episode and Christ:
    those who do not heed or believe in Christ perish in Sheol, while those who believe
    and hearken inherit everlasting life.'
  category: relationship
  evidence_refs:
  - ev:14
