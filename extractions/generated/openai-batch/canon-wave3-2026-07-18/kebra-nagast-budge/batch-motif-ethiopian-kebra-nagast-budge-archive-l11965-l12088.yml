  summary: The passage gives Christian typological explanations of Adam, Eve, Mary,
    and Christ; interprets Ezekiel's sealed eastern door and Moses' burning bush as
    images of Mary; recounts Israelite murmuring over priestly ministration, the making
    of seventy censers, the fiery destruction of unauthorized offerers, and the consecration
    of the censers; and then allegorizes the censer, coals, incense, and chains as
    Mary, Christ, Christ's perfume, and Jacob's ladder/prayer ascent.
