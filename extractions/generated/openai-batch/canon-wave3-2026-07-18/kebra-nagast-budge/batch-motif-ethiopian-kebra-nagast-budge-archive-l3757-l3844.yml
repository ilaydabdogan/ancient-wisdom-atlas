candidate_motifs:
- id: motif:1
  label: Royal legitimacy through possession or relation to heavenly Zion
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage states that the King of Ethiopia outranks other earthly kings
    because of the glory and greatness of heavenly Zion.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is an introductory summary, not the full narrative scene of
    enthronement or succession.
- id: motif:2
  label: Hidden pearl as sacred Christ-bearing sign
  taxonomy_refs:
  - sacred_birth
  basis: Christ is described as born from a Pearl hidden in Adam’s body, and the Pearl
    in Mary’s body is also identified with Christ.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage reports typological language briefly; it does not narrate
    a birth episode in detail.
- id: motif:3
  label: Prophetic prefiguration and scriptural typology
  taxonomy_refs:
  - wisdom
  basis: The passage says the Prophets knew Christ’s coming and the Law proclaimed
    Christ, followed by many symbolic identifications of biblical figures and objects.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The available taxonomy has no exact typology category; 'wisdom' is only
    a broad fit for revealed scriptural knowledge.
- id: motif:4
  label: Serpent sign reinterpreted as Christ
  taxonomy_refs:
  - serpent
  basis: The brazen serpent is explicitly said to be a symbol of Christ.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives the interpretation but not the full serpent narrative.
- id: motif:5
  label: Virgin Mary as sealed door and life-giving vessel
  taxonomy_refs:
  - sacred_birth
  - divine_beloved
  basis: Mary is said to give life, to be the closed door symbolizing virginity sealed
    by God, and to be represented by the Ark, pot, rod, bush, censer, and Pearl.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The 'divine_beloved' taxonomy reference is approximate; the passage mainly
    supports Marian virginity and vessel imagery.
- id: motif:6
  label: 'Saving wood: Ark and Cross'
  taxonomy_refs:
  - ark_vessel
  - sacrifice
  basis: The passage states that the wood of Noah’s Ark saved Noah as the wood of
    the Cross saved mankind when Christ died upon it.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The comparison is explicit but compressed into a single summary sentence.
- id: motif:7
  label: Flood as divine destruction of giants
  taxonomy_refs:
  - flood_and_renewal
  - divine_judgment
  basis: The giants born from the embodied angels and Cain’s daughters are destroyed
    by the waters of the Flood after 120 years.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The renewal aspect is implied by Noah’s survival but not elaborated in
    this passage.
- id: motif:8
  label: Rebellious heavenly beings descend and become embodied
  taxonomy_refs:
  - departure
  - chaos
  basis: The angels ask to be made like Adam, receive flesh and blood, descend to
    earth, and enter disorderly relations with Cain’s descendants.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The available taxonomy has no exact 'fallen angels' category; 'departure'
    and 'chaos' are broad approximations.
- id: motif:9
  label: Giant offspring of heavenly-human unions
