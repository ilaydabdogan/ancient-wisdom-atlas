canonical_text:
  quote: ''
  summary: 'The passage summarizes chapters of the Kebra Nagast introduction: it asserts
    Ethiopian royal exaltation through heavenly Zion, lists Christian typological
    readings of biblical figures and objects as signs of Christ, Mary, the Cross,
    and salvation, and recounts rebellious angels becoming embodied, mating with Cain’s
    descendants, producing giants, and being destroyed by the Flood while Noah is
    saved by the Ark.'
  language: English
  quote_policy: summarized
