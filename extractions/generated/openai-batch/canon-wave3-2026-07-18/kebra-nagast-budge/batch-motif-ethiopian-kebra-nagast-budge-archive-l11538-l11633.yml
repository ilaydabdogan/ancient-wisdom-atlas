  quote: ''
  summary: The passage contrasts Ethiopian and Roman Christian kingship, describes
    Satanic corruption of Rome through heresy, states a Christological confession
    of descent, incarnation, crucifixion, ascent, and final judgment, and then begins
    the account of the first war of the Ethiopian king David/Menyelek. David marches
    with his mother Makeda and Zion; Levites bear the Tabernacle of the Law as warriors
    sing, and the army devastates hostile districts and a monstrous city of vipers.
  language: English
  quote_policy: summarized
