  quote: ''
  summary: Solomon tells the elders that God could remove him or them while carrying
    Zion, give their city to others, or destroy them, because no one can oppose God's
    will. He leads the elders into the House of God and the Holy of Holies, where
    they supplicate, prostrate, bless God, and weep before heavenly Zion, the Tabernacle
    of the Law. Solomon then tells them to stop weeping, keep the matter from outsiders,
    and set up nailed hoards to be covered with gold and decorated.
