canonical_text:
  quote: ''
  summary: David is described as speaking under a spirit of prophecy. The people of
    Ethiopia rejoice with music; idols and crafted figures fall and break as Zion
    shines. Zion is dressed, honored with gifts, set on a purple-draped wagon, and
    carried in a singing procession. The procession rises and Zion moves in the heavens
    like the sun, witnessed and worshipped by Egyptians. The passage recalls Moses
    and Israel crossing the divided Red Sea and receiving the Tabernacle of the Covenant,
    then describes holy Zion crossing the same sea while the sea and waves roar, leap,
    thunder, and mingle their sound with the music.
  language: English
  quote_policy: summarized
