canonical_text:
  quote: he gave him the mystery of the bread and wine
  summary: The passage argues that Abraham, David, and the Prophets were justified
    by faith and prophesied the coming of the Son of God. Abraham asks God whether
    the divine word will be cast down in his days; God replies that the time has not
    yet come but promises to show a similitude of the Son's coming. Abraham is instructed
    to cross the Jordan, dip in the water, go to Salem, and meet Melchizedek, who
    gives him the mystery of bread and wine. The narrator connects this to the Passover
    celebrated for salvation through Jesus Christ, describes Abraham rejoicing around
    Melchizedek's altar with branch and palm on the Sabbath, and ends with a polemical
    citation of Isaiah about blindness and lack of understanding.
  language: English
  quote_policy: quoted
