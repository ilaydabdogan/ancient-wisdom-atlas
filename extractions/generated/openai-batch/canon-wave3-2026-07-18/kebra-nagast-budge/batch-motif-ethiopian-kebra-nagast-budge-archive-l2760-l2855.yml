canonical_text:
  quote: ''
  summary: The passage summarizes an episode in which Menyelek, Solomon's son, assists
    Solomon in Jerusalem but becomes a source of political dissatisfaction. Menyelek
    departs with the first-born sons of the people, substitutes the Ark of Mary for
    the Ark of Michael by changing covers, and refuses to return it. The Ark of Mary
    halts at Kayeh Kor until a deceased deacon's severed finger is restored to his
    coffin, then reaches Aksum, where Satan abandons a building project against God
    and Menyelek uses the stones for a church to hold the Ark. The passage then summarizes
    the opening chapters of the Kebra Nagast, including pre-creation Zion, the Trinity,
    Adam, Christ as second Adam, Mary as Second Zion, and Gregory the Illuminator's
    reflection on Adam's kingship.
  language: English
  quote_policy: summarized
