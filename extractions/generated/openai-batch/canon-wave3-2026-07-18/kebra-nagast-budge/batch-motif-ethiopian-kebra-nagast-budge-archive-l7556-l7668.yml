canonical_text:
  quote: '"he made them to march through the sea as upon dry land"'
  summary: A traveling company departs with wagons and animals under the guidance
    of Michael the Archangel, who protects and miraculously carries them. They cover
    a long distance without fatigue, hunger, or thirst, and the sons of the warriors
    of Israel explain to their king that the holy and heavenly Zion, the Tabernacle
    of the Law of God, has come to him by God's will and will guide his line if he
    keeps God's command. The sacred entity is personified as Lady, Mother, refuge,
    and salvation; Azaryas directs Elmeyas to prepare it for the king to see, and
    the king responds with prayer and praise.
  language: English
  quote_policy: quoted
