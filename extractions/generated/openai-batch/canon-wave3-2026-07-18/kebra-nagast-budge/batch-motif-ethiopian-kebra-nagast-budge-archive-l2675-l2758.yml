canonical_text:
  quote: ''
  summary: Eteye Azeb shows villagers a dead dragon and is made chieftainess. She
    and her maiden chief officer disguise themselves as men and travel to Solomon
    in Jerusalem, where Eteye Azeb's deformed foot is healed at the threshold. Solomon
    tests the disguised guests with food and honey, discovers that they are women,
    and lies with both. He gives each woman a silver staff and ring as tokens for
    a future child. Each later bears a son and sends him to Jerusalem. Solomon hides
    by placing a friend on the throne and sitting in a stable; Menyelek, the Queen
    of Sheba's son, uses a mirror and resemblance to recognize Solomon, who calls
    him his true son.
  language: English
  quote_policy: summarized
