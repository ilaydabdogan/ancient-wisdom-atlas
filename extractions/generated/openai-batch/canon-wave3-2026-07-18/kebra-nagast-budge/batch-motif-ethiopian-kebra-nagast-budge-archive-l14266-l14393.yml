  summary: 'The passage presents a sequence of biblical patriarchs and prophets as
    foreshadowings of Christ: Isaac’s near-sacrifice, Jacob’s journey and staff, Moses’
    rod and encounter with God, Jonah in the fish, Daniel in the sealed lions’ pit,
    Joseph’s sale and deliverance of his brethren, and patriarchal burial customs
