  summary: The passage moves from an opening fragment of speech about divine compassion
    and an heir, to the reigns of Seth’s line after Adam, including Enoch being hidden
    from death. It then describes Cain and his descendants as wicked, Noah as righteous
    and as warning his children not to mingle with Cain’s children, and God destroying
    sinners and most creatures by the Flood while excepting eight souls and selected
    clean and unclean creatures.
