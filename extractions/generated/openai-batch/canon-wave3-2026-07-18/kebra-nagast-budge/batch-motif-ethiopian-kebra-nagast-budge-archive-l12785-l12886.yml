canonical_text:
  quote: ''
  summary: The passage expounds Christian scriptural phrases about the beginning,
    identifying Christ as the Word of the Father through whom creation came into being
    and linking the Holy Spirit with the breath of God's mouth. It then laments Jews
    and pagans as having rejected divine love, recounts Adam's salvation through mercy,
    describes Christ's crucifixion and prayer of forgiveness, and concludes by identifying
    Christ as Maker, Creator, Light of Light, God of God, and Son of the Father.
  language: English
  quote_policy: summarized
