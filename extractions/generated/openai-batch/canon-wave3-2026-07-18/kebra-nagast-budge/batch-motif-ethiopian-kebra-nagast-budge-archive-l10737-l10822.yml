canonical_text:
  quote: ''
  summary: The passage describes public rejoicing in Ethiopia, the placement and guarding
    of Zion at Dabra Makeda, Makeda’s wealth and rule, her transfer of royal property
    and the throne to her son David, an oath by Ethiopian nobles restricting future
    rule to the male seed of David son of Solomon, appointments of religious officers,
    the renewed kingdom, and the Ethiopian people turning from idols and divinatory
    practices to worship of God.
  language: English
  quote_policy: summarized
