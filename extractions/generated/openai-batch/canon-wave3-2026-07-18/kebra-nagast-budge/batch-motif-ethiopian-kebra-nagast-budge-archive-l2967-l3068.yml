canonical_text:
  quote: ''
  summary: The introduction summarizes an apocryphal source used in the Kebra Nagast.
    It describes world-dividing rulers descended from Shem, Makeda as a wealthy and
    intelligent queen and trader, Tamrin as her caravan leader, Solomon’s Temple-building
    and wisdom, Makeda’s journey to Jerusalem, her exchange with Solomon, her religious
    renunciation of Sabaism in favor of the God of Israel, her vow concerning her
    descendants and the Tabernacle, Solomon’s wisdom extending to animals, and Solomon’s
    desire to beget a son by Makeda.
  language: English
  quote_policy: summarized
