canonical_text:
  quote: ''
  summary: Karmin flees by night with treasure, separates his household, reaches Babylon,
    gives a gift to King Bala'on, and receives lodging near an absent merchant's house.
    Men who had borne lying testimony are killed in Karmin's house. The merchant's
    wife becomes pregnant by Karmin and plans to conceal the matter by disposing of
    the child in the river; the narrator frames this with a Solomonic wisdom saying.
    Bala'on's wife gives birth to an eagle-like wingless being and secretly orders
    it placed in a wicker basket and cast into the river. The merchant's wife then
    gives birth to a comely man-child and calls a favored handmaiden.
  language: English
  quote_policy: summarized
