canonical_text:
  quote: ''
  summary: The preface discusses the Solomonic royal line in Ethiopia, its interruption
    by the Zague kings, and its restoration by Yekuno 'Amlak. It then summarizes an
    Ethiopian legend of a Pearl placed by God in Adam and transmitted through holy
    men until Hanna and the Virgin Mary, links this transmission to Solomon, Christ,
    Menyelek, and Ethiopian royal divinity, and compares Ethiopian divine kingship
    with Egyptian traditions in which kings are children of Ra, Amen, or Ptah-Tanen
    and possess divine status before or at birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the line of kings founded by Solomon continued after
    the Christianization of the Ethiopians, was broken when God permitted the Zague
    kings to reign, and was restored by Yekuno 'Amlak in 1270.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kebra Nagast is described as written to glorify the Solomonic line, while
    its editors and translators are said to have regarded the Zague kings as non-Israelites
    and transgressors of the Law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports a legend in which God placed a Pearl in Adam’s body, intending
    it to pass through a succession of holy men until it entered Hanna and formed
    the substance of her daughter, the Virgin Mary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Pearl is said to have passed through Solomon, who is identified as an
    ancestor of Christ; Menyelek is identified as Solomon’s son by the Queen of Sheba.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that Isaac the Ethiopian maintained that Ethiopian kings
    descended from Menyelek were of divine origin and that their words and deeds were
    those of gods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the idea of the divine origin of kings in Ethiopia,
    the Sudan, and Egypt was very old and apparently indigenous.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A legend from the Westcar Papyrus is summarized in which three kings of Egypt’s
