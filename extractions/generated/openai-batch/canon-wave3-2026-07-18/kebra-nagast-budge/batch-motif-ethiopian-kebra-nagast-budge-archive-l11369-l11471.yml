canonical_text:
  quote: ''
  summary: The passage exhorts the addressed people to fear God because their country
    has been blessed through Zion, the Tabernacle of the Law. It praises Makeda’s
    surpassing wisdom, credits her with drawing Israelite men and the Tabernacle to
    Ethiopia, destroying idols, and turning her people from sun worship, divination,
    magic, sacrifice to stones and trees, and bird augury toward trust in God. Wisdom
    is personified as Makeda’s mother, treasure, refuge, wall, nourisher, healer,
    and illuminator. The passage concludes that wisdom comes from God and that Zion
    has come to Ethiopia to guide King David.
  language: English
