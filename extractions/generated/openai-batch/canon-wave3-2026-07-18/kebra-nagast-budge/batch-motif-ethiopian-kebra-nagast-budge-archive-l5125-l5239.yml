canonical_text:
  quote: ''
  summary: Solomon tells the Queen that his wisdom, speech, movements, and service
    at the sanctuary and Tabernacle of the Law depend on the God of Israel. He then
    points to a poor laborer carrying burdens and uses him to teach humility, mortality,
    equality of king and laborer, compassion, fear of God, and the danger of arrogance
    and idolatry. The Queen admires Solomon’s words and asks whom she should worship,
    explaining her inherited sun worship and other cult practices, and reporting what
    she has heard about Israel’s God, the heavenly Tabernacle, the Tablet, Moses,
    and divine commandments.
  language: English
  quote_policy: summarized
