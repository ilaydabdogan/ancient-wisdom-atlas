  summary: Solomon reflects on sin, death, bodily decay, and the forgetting of human
    names; he counsels Rehoboam to do good and worship God only; he orders his son
    to be recorded and anointed king; Zadok anoints Rehoboam, who is publicly acclaimed;
    Solomon dies, is buried in David's tomb, and is mourned; after seven days Rehoboam
    receives Israel's request to lighten labor and consults elders.
