canonical_text:
  quote: ''
  summary: The passage narrates victories and supernatural aid for the Ethiopian king
    through Zion, presents a note on manuscript acceptance, asserts the universal
    honor of the Ethiopian royal estate through Zion and descent from Shem, and then
    summarizes Christian claims about the incarnation, miracles, crucifixion, resurrection,
    ascension, kingship, and judgment of Jesus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ethiopian king's forces lay waste to named places, receive gifts or tribute
    from foreign kings, and receive homage from the king of India.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that no one conquered the Ethiopian king and that attackers
    against him were conquered.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Spies are unable to keep up with the wagons because Zion exhausts the strength
    of the enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: King David and his soldiers run by the wagons without pain, hunger, thirst,
    sweat, or exhaustion, and travel in one day a distance usually taking three months.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The army lacks nothing that it asks God to give through Zion, the Tabernacle
    of the Law of God.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: God is said to dwell with Zion; His Angel directs her; Zion is called His
    habitation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king who ministers to God's pavilion has his wishes performed by word
    or gesture and is protected by the hand of God day and night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A manuscript note says that archbishops at the Church of Sophia and Domitius
    of Antioch accept writings from the days of Solomon and later prophetic writings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says that through the Kebra Nagast the Ethiopian king is known
    as honorable, King of Zion, and firstborn of the seed of Shem.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that God's habitation is in Zion and that God breaks the
    power of the king's enemies there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The King of Rome is described as anointed of the Lord because of the wood
    of the Cross.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage describes a Pearl born from Israel and the Sun of Righteousness
    born from the Pearl, with the Sun of Righteousness hidden in a human body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Sun of Righteousness, identified in the passage with Jesus, performs signs
    and wonders including raising dead people, healing sick people, giving sight to
    blind people, opening deaf ears, cleansing lepers, and feeding the hungry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says that the children of Israel/Jews saw and heard Jesus, envied
    him, crucified him on the wood of the Cross, and killed him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Jesus rises from the dead on the third day, ascends into heaven, and receives
    an incorruptible kingdom from the Father.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Jesus is said to judge the living and the dead and reward each person according
    to his work.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The passage polemically says that Jews will be shamed and condemned to everlasting
    fire, while Orthodox believers will rejoice with the Apostles if they have followed
    Christ's commandments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The passage says that after the crucifixion the Jews were scattered, their
    kingdom destroyed, and they were rooted out.
  category: sequence
  evidence_refs:
  - ev:8
