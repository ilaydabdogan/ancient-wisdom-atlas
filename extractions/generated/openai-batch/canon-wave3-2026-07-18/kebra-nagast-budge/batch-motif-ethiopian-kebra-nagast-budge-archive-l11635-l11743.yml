comparison_claims:
- id: claim:1
  claim: 'The passage itself sets up a functional comparison between Ethiopian kingship
    grounded in Zion and Roman kingship grounded in the wood of the Cross: both are
    presented as sacred bases for royal honor or anointment.'
  claim_level: same_function
  target: Ethiopian Zion-based royal legitimacy and Roman Cross-based anointment
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage ranks Ethiopia first and Rome after it; it does not present
    the two claims as equal.
- id: claim:2
  claim: The passage explicitly connects its miracle catalogue of Jesus to Johannine
    Gospel tradition by citing John the Evangelist's statement that not all of Jesus'
    deeds could be written.
  claim_level: historical_contact
  target: Johannine Gospel tradition, specifically John 21:25 as cited in the passage
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The supported link is the explicit citation and miracle context in
    this excerpt, not a full source-critical analysis.
- id: claim:3
  claim: The sequence of crucifixion, third-day resurrection, ascent, enthronement,
    and future judgment corresponds to a Christian passion-resurrection-ascension-judgment
    pattern present within the passage.
  claim_level: same_motif
  target: Christian passion, resurrection, ascension, and final judgment pattern
  evidence_refs:
