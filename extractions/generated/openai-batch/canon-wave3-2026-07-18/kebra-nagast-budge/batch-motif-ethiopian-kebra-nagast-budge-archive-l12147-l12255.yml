canonical_text:
  quote: ''
  summary: Moses gathers twelve named rods from the houses of Israel and places them
    in Zion, the Tent of Witness, according to God's command. In the morning Aaron's
    rod bears almond fruit and flowers with fragrance, revealing God's choice of priest.
    The passage then interprets the rod as Mary, whose virginal birth of the Word
    of God is compared to the rod blooming without water. It further interprets Zion,
    the Tabernacle, gold, incorruptible wood, the golden pot, manna, tablets, and
    spiritual Pearl in Marian and Christological terms.
  language: English
  quote_policy: summarized
