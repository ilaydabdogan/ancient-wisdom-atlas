canonical_text:
  quote: ''
  summary: 'Solomon returns to Jerusalem and mourns with Zadok and the elders over
    Zion. The elders console him by recounting an earlier episode: in the days of
    Eli, the Philistines captured Zion, the Tabernacle of the Law of God, and placed
    it in Dagon’s house. Dagon was destroyed, the Philistine land was afflicted by
    mice, and the people suffered sores. Philistine ritual specialists determined
    that Zion caused the punishment and advised returning her with gold offerings.
    They set Zion on a wagon drawn by two she-camels, using the animals’ route as
    a test of God’s disposition. The camels went straight toward Judah, Zion returned
    to her place, and Samuel ministered while she was in her house.'
  language: English
  quote_policy: summarized
