canonical_text:
  quote: ''
  summary: 'The passage summarizes the Kebra Nagast''s transmission history, its reported
    Arabic and Ethiopic translation context, its redaction, and its sources. It then
    states the work''s purpose: to glorify Ethiopia by narrating the voluntary coming
    of the spiritual and heavenly Zion, the Tabernacle of the Law, from Jerusalem
    to Ethiopia, and by establishing the Ethiopian king''s Solomonic and sacred lineage.
    It describes heavenly Zion as God''s immaterial habitation, a material copy made
    by Moses in wood and gold, its sacred contents, its placement in Solomon''s Temple,
    and the spread of Solomon''s wisdom through trade.'
  language: English
  quote_policy: summarized
