canonical_text:
  quote: "“the goat's foot became exactly like its fellow foot”"
  summary: The passage frames the Queen of Sheba’s desire to hear Solomon’s wisdom
    within God’s plan for Davidic kingship, cites the oath to David, and then narrates
    the Queen’s arrival in Jerusalem. Solomon, having heard that one of her feet is
    like a goat’s, fills the Temple courtyard with water so that she will lift her
    garments. When she steps into the water, her goat-like foot touches a submerged
    piece of wood from below Paradise and becomes like her other human foot. The Queen
    and Solomon praise God, the wood is honored with silver adornments, and later
    rulers continue to decorate it.
  language: English
  quote_policy: quoted
