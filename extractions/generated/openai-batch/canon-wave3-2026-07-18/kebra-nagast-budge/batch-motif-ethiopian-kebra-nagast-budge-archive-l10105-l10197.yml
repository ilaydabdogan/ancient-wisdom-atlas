canonical_text:
  quote: ''
  summary: 'The passage recounts two simultaneous births: a merchant''s wife bears
    a beautiful child and the king''s wife bears a child said to look like a wingless
    eagle. Their handmaidens meet while taking the children to be cast into the river,
    exchange the children, and the beautiful child is raised as the queen''s son under
    the name Nabukednasar. The passage then links the Babylonian king to the seed
    of Shem, narrates his conquest of Jerusalem, arrogance, idolatry, divine abasement
    among beasts, repentance, and restoration. It begins a new section on the King
    of Persia, tracing him to Shem through Judah and Tamar and recounting the punishment
    of Judah''s younger son for refusing to raise seed for his brother.'
  language: English
  quote_policy: summarized
