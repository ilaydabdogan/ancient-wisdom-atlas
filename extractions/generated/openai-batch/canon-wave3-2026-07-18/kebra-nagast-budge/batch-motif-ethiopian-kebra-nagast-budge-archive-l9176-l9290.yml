canonical_text:
  quote: ''
  summary: Gabriel speaks to Solomon about the protection of the Pearl, Zion, and
    the wood that will become the Cross. Michael, Gabriel, and Uriel are assigned
    to sacred objects and to Solomon’s sons. Solomon gives thanks for mercy and speaks
    of death, Sheol, his fathers, and future deliverance. He then asks when the Saviour
    will come; the angel answers that the Saviour will come after thirty-three generations,
    be rejected and crucified by Israel, rise again, and deliver those in Sheol.
  language: English
  quote_policy: summarized
