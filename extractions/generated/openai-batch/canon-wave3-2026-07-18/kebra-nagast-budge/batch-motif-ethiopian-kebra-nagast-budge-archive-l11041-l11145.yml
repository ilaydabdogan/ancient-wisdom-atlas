canonical_text:
  quote: ''
  summary: The Queen addresses the Children of Israel as teachers and guardians of
    the Law, asks them to instruct her people, praises wisdom and knowledge through
    images of light, water, food, architectural stability, sea-depth, pearl, lamp,
    star, treasury, flame, and shield, and states that the Lord has given her people
    seed in Zion, habitation in Jerusalem, and a portion with the chosen seed of Jacob.
  language: English
  quote_policy: summarized
