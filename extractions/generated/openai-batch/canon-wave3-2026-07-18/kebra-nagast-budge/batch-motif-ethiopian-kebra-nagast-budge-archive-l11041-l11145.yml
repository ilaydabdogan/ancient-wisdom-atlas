  text: The Queen describes the water of knowledge as something she has not yet drunk
    deeply, and as sweeter than honey and more thirst-quenching than wine.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The Queen prays to the Lord God of Israel that she may follow wisdom and use
