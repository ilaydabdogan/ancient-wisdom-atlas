canonical_text:
  quote: ''
  summary: The passage recounts Tamar’s encounter with Judah, her retention of his
    pledge objects, Judah’s recognition of them, and the birth of the twins Fares
    and Zara, from whom Persia is connected to the seed of Shem. It then recounts
    Lot’s rescue from Sodom and Gomorrah by Michael and Gabriel, the fiery destruction
    of the cities, the transformation of Lot’s wife Akmaba into a pillar of salt after
    looking back, and the birth of Moab after Lot’s daughters intoxicate him, establishing
    the King of Moab as of the seed of Shem.
  language: English
  quote_policy: summarized
