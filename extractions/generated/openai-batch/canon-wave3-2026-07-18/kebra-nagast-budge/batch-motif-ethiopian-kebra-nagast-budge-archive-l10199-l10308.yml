  evidence_refs:
  - ev:1
- id: obs:3
  text: Judah requests to company with Tamar; she asks for hire; he promises a sucking
    lamb and gives his staff, ring, and close-fitting cap as a pledge before lying
    with her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
