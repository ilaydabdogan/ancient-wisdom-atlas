canonical_text:
  quote: ''
  summary: The passage presents a council's affirmation that the Tabernacle of the
    Law has come down and that God's habitation is in Zion. Demateyos reports finding
    a manuscript in the Church of Saint Sophia that assigns world rule to the emperors
    of Rom and Ethiopia. The earth is divided from the middle of Jerusalem, and both
    emperors are linked to the line of Shem, Abraham, David, and Solomon, with the
    Ethiopian emperor called Solomon's firstborn. The passage then introduces the
    Queen of the South and cites Jesus' saying that she will rise on the Day of Judgment
    to condemn an unheeding generation.
  language: English
  quote_policy: summarized
