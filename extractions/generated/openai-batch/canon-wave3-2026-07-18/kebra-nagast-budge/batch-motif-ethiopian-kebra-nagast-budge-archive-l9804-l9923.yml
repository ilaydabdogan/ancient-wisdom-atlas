canonical_text:
  quote: ''
  summary: The passage moves from Adrami's legal judgment about sheep damaging a vine
    to his approval by Baltasar and election as king over Rome. It then gives genealogical
    and moral explanations for the kings of Medyam and Babylon as descended from Shem,
    retells Esau's loss of the firstborn right to Jacob for pottage, teaches temperance
    over bodily desire through Pauline and Gospel-style Christian exhortation, and
    introduces Karmm, a righteous wealthy man whom Satan envies.
  language: English
  quote_policy: summarized
