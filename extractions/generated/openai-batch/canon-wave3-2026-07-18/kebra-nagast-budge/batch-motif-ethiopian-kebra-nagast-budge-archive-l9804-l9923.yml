comparison_claims:
- id: claim:1
  claim: The passage explicitly retells the Jacob-Esau birthright-for-pottage episode
    to explain Edom and Medyam's genealogy, making it the same narrative motif as
    the biblical sibling birthright-exchange pattern.
  claim_level: same_motif
  target: Jacob-Esau birthright-for-pottage tradition
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The excerpt itself does not provide a Genesis citation; it uses the
    episode for a genealogical and moral argument.
- id: claim:2
  claim: The teaching on soul and body is explicitly linked to Paul and to Galatians
    in the passage, functioning as a Pauline flesh/spirit conflict used for ascetic
    instruction.
  claim_level: same_function
  target: Pauline body-soul or flesh-spirit conflict in Galatians
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: This claim follows the passage's citation and paraphrase only; it does
    not evaluate textual accuracy against Galatians.
- id: claim:3
  claim: The promises that disciples will heal, raise the dead, trample the Enemy,
    and judge Israel are presented with a footnote comparing Matthew and Luke, so
    the passage functions within a Gospel apostolic authority and eschatological judgment
    pattern.
  claim_level: same_function
  target: Gospel traditions of apostolic powers and judging Israel
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the passage and its footnote; no external
    source verification is performed here.
