canonical_text:
  quote: ''
  summary: The passage reports that Egyptian gods and idol towers fell when men carrying
    or accompanied by the Tabernacle of the God of Israel entered Egypt. Egyptian
    priests explain that the heavenly Tabernacle is with them and will remain in their
    country. A speaker asks Solomon why he has given away the Tabernacle of the Law,
    and Solomon laments in prayer, asking whether God has taken away the Tabernacle
    of the Covenant in his days. Solomon invokes covenants with Israel's ancestors,
    describes Zion and the Tabernacle as a heavenly divine dwelling associated with
    Moses, the mountain of sanctuary, and the Tent of Witness, and recalls David's
    desire and Solomon's own fulfillment in building a house for God's Name.
