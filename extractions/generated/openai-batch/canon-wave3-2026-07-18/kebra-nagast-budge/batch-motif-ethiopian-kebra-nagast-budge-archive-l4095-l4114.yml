  summary: The passage describes Satan envying Abel and placing envy in Cain’s heart.
    Cain envies Abel because of Adam’s succession statement, because of the sisters
    assigned in marriage, and because God accepts Abel’s offering but rejects Cain’s.
    Cain kills Abel, and the passage identifies this as the first fratricide, caused
    through Satan’s envy of Adam’s children. Cain then trembles in fear and is repulsed
    by his father and his Lord. Seth is then born, though the passage breaks off mid-sentence.
