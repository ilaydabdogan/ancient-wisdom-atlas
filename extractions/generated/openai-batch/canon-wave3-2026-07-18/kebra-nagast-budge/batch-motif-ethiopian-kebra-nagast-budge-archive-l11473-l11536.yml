canonical_text:
  quote: ''
  summary: Azariah calls for jubilee trumpets and a journey to Zion to renew David’s
    kingdom. He fills a horn with the oil of sovereignty and anoints David. A large
    public celebration follows in Ethiopia. The passage says David’s kingdom is renewed
    at Mount Makeda in the House of Zion, where the Law is first established by the
    King of Ethiopia. Ordinances are then made according to what had been seen in
    Jerusalem, the kingdom’s boundaries are enumerated, hereditary dominion is affirmed,
    and the Law and names are written and deposited as a memorial after Zion’s arrival
    in Ethiopia.
  language: English
  quote_policy: summarized
