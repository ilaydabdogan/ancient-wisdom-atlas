canonical_text:
  quote: ''
  summary: A royal addressee receives blessings promising victory, prosperity, rain,
    abundance, political superiority, and glory if aligned with God's will. The passage
    then gives instructions for righteous rule and judgment, especially protection
    of the poor, orphans, and wronged persons and avoidance of partiality and bribes.
    It closes with the opening of the Ten Commandments addressed to Israel, including
    God's deliverance from Egypt, exclusive worship, prohibition of graven gods, divine
    punishment and mercy across generations, and prohibition of false oaths in God's
    name.
