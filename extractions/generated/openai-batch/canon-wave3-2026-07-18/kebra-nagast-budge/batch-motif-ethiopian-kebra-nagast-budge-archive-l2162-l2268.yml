- id: obs:1
  text: The Queen returns to her own country, gives birth to a male child, names him
    David after his grandfather, rejoices, and raises him in great state and splendour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the child reaches manhood, he is described as hale, strong, wise, and
    understanding like his father.
