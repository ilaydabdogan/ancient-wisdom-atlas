canonical_text:
  quote: ''
  summary: After returning to her country, the Queen bears a son named David, later
    tells him Solomon is his father, gives him the royal ring or seal, and sends him
    to Jerusalem. Solomon recognizes the young man through the ring, embraces him,
    crowns him with David's crown, and seats him on David's throne. The passage then
    describes the Tabernacle of the Covenant in the House of the Lord and a miracle
    by which its rising or not rising signals divine acceptance or displeasure.
  language: English
  quote_policy: summarized
