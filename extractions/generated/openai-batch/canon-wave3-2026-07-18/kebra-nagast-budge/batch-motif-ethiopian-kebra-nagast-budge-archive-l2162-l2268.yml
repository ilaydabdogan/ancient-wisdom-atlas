  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: News spreads among the tribes of Israel that Solomon has made the Queen of
    the South's son ruler, crowned him king, and seated him on his throne.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The House of the Lord built and consecrated by Solomon contains the Tabernacle
