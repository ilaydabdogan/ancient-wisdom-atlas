  text: The Queen tells him that his father is Solomon, son of David, Prophet of God
    and King of Israel, whose kingdom is in Jerusalem.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Queen says she possesses the seal of his father's kingdom, kept ready
