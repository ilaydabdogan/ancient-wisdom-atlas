canonical_text:
  quote: ''
  summary: The passage describes Zion being carried toward Ethiopia while the sea,
    sea creatures, birds, angels, and Ethiopians rejoice. Zion emits light like the
    sun. Zadok returns to Solomon, who recounts a vision of the sun leaving Judah
    for Ethiopia and later illuminating Rom, Ethiopia, and believers. Solomon identifies
    the sun in his earlier vision as a symbol of holy Zion. Zadok examines the sanctuary
    and finds Zion absent, with only wooden boards made to resemble its pedestal.
  language: English
