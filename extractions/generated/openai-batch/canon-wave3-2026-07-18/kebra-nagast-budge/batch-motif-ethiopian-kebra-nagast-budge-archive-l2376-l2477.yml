canonical_text:
  quote: ''
  summary: Priests and elders discover that the Tabernacle of the Covenant and its
    holy things are missing from the Holy Shrine, conclude that Solomon's son and
    associated priests have taken it, and ask Solomon for armed pursuit. The pursuers
    learn from merchants that the young king and his soldiers travel with the Box
    of the Covenant at extraordinary speed; the pursuers return defeated. The young
    man reaches his country, his mother abdicates, he becomes king on the throne of
    David, and the Tabernacle remains in Abyssinia. The passage then links Abyssinia's
    Christian faith to Christ's dispensation, the preaching of the apostles, the baptized
    eunuch of Kandakes, Philip, and Parmenas, and states that the account is found
    in Coptic Church histories.
  language: English
  quote_policy: summarized
