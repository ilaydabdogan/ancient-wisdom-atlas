canonical_text:
  quote: ''
  summary: Children of Israelite nobles, ordered to depart with the king's son, form
    a private covenant after lamenting their separation from Lady Zion. Azaryas requires
    secrecy by oath, then proposes taking Lady Zion with them. The group accepts the
    risk of death, and Zechariah discusses Azaryas's access to the House of God, keys,
    hidden openings, and the Holy of Holies as part of the plan to bring Zion to Ethiopia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The children of the nobles of Israel are commanded to depart with the son
    of the king and take counsel together because they have left their country, birthplace,
    kin, and city.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The group proposes a covenant known only among themselves, promising mutual
    love in the new country and affirming that God is present both here and there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: "'Azaryas and 'Elmiyas, sons of priests, say their sorrow should focus on
    Lady Zion because they are being made to leave her after serving her."
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Others call Zion their Lady, hope, object of boasting, and mistress, but say
    they cannot resist the king's command or transgress their fathers' word.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: "'Azaryas asks the group to make a lifelong covenant of secrecy with him,
    whether they live, die, are taken captive, or go forth unhindered."
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The group swears an oath in the Name of the Lord God of Israel, by heavenly
    Zion, the Tabernacle of the Law of God, and by promises and ancestral references
    connected with Abraham, Isaac, and Jacob.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the oath, 'Azaryas proposes taking Lady Zion with them and says that,
    if discovered and slain, they will die for Lady Zion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The group rises, kisses 'Azaryas's head, face, and eyes, and promises to follow
    his counsel whether they die or live.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Zechariah, son of Yoas or Benaiah, asks whether 'Azaryas can carry Lady Zion
    off and says that 'Azaryas can enter the House of God in place of his father Zadok
    and continually has the keys.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Zechariah mentions hidden openings or windows made by King Solomon and says
    that only Zadok may enter there once each year to offer sacrifice in the Holy
    of Holies for himself and the people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Zechariah urges careful action before the keys are taken from 'Azaryas and
    says they will depart with Zion to Ethiopia, bringing joy to themselves and sorrow
    to their fathers.
  category: speech
  evidence_refs:
  - ev:5
