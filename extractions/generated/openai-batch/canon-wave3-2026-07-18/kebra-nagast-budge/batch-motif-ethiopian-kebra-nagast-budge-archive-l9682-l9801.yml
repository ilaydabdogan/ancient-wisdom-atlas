  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Solomon sends Baltasor a letter instructing him to take Adrami, give him his
    daughter, and make him king in Rome; Solomon also sends nobles arranged fourteen
    on each side to keep the Law with him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Adrami and his party arrive with the ambassadors of the King of Rome, much
