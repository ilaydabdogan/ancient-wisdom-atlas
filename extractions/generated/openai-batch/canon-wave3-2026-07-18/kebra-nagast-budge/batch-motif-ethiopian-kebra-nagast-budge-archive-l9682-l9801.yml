  text: After reading a letter, Solomon reasons that he should give his son so that
    his plan will not be made void.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solomon tells his counsellors that Israel already has a kingdom in Ethiopia
    and proposes sending his youngest son to Rome so that Israel may have a third
    kingdom there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Solomon says that giving children to Rome will make the men of Rome become
    the people of God and will associate Israel with the kingdoms of Ethiopia and
    Rome.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The counsellors agree that Solomon has already taken the eldest from their
    houses and may now take the youngest children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Adrami is set forward with nobles of the lower grades of the house of Israel,
    and the lot falls upon him in Solomon's name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Levite priest named Akimihel is given to Adrami; Adrami is placed on the
    king's mule and acclaimed by the people.
