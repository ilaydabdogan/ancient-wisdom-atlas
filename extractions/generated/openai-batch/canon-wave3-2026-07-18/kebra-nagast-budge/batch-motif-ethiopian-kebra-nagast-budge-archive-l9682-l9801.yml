canonical_text:
  quote: ''
  summary: Solomon decides to send his youngest son Adrami/Ardamis to Rome so that
    Israel may have a kingdom there as it already has in Ethiopia. Adrami is invested,
    sworn to the God of Israel, sent with nobles and a Levite priest, married to Baltasar's
    daughter Adlonya, and established over Rome. Baltasar then tests Adrami's judgment
    with a dispute between a vineyard owner and a sheep owner.
  language: English
  quote_policy: summarized
