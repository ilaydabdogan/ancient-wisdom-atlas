canonical_text:
  quote: ''
  summary: Zadok collapses after finding Zion absent from the house of God. Solomon
    orders a military pursuit of the men of Ethiopia, seeking to recover his son and
    Zion and threatening death for the alleged theft from the sanctuary. Israelite
    groups mourn the loss of the Tabernacle of the Law. Pursuers question witnesses
    in Egypt and Gaza, who report that the Ethiopians traveled with extraordinary
    speed in wagons suspended in the air or above the winds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zadok falls forward on his face, is terrified, and becomes like a dead man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Benaiah, son of Yodahe, is sent to Zadok, checks him for signs of breath,
    fans him, lifts him, rubs him, and lays him on a table.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zadok looks at the place where Zion had been set, does not find her, casts
    dust on his head, and wails at the doors of the house of God.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Solomon commands a crier and trumpets to summon pursuit of the men of Ethiopia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Solomon orders that, if overtaken, his son should be seized and brought back
    with Zion, while the other men are to be slain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Solomon says the men deserve death because they have robbed the sanctuary
    of God and sought to pollute the habitation of God's Name in a land without the
    Law.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Elders of Israel, widows, and virgins gather in the house of God and weep
    because the Tabernacle of the Law of God has been taken away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Solomon rises in wrath, follows the road of the Ethiopians, and sends mounted
    horsemen ahead to find and report on them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The horsemen reach Egypt, where the men of Ethiopia had encamped with their
    king, had made peace with Zion, and rejoiced.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Egyptian witnesses say that men of Ethiopia passed some days earlier, traveling
    swiftly in wagons like angels and faster than eagles, and that nine days had passed
    since they left.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Returning horsemen report the timing of the Ethiopians' journey and ask Solomon
    to consider the distance traversed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Gaza, witnesses say Solomon's son left three days earlier and that the
    group traveled in wagons suspended in the air, with baggage in wagons above the
    winds.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: When Solomon asks whether Zion, the Tabernacle of the Law of God, was with
    them, the Gaza witnesses say they did not see anything.
  category: speech
  evidence_refs:
  - ev:8
