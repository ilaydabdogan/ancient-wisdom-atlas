- id: obs:1
  text: Canaan is said to have seized the Girgasites by force from the seed of Shem,
    an act described as wrongful invasion and falsification of an oath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the offenders ceased to be and their memorial perished because
    they transgressed God’s command, worshipped idols, and bowed to beings that were
    not gods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'A succession of rulers after Shem is listed: Arphaxad, Kaynan/Cainan, Sala/Salah,
    Eber, Palek/Peleg, Ragaw/Reu, Seroh/Serug, Nakhor/Nahor, and Tara/Terah.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ancestral figures are said to have made magical images at the tombs of
    their fathers from metals including gold, silver, and brass.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A devil is said to have spoken from each image of the fathers and demanded
    the sacrifice of a beloved son.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The people slaughtered sons and daughters to devils and poured out innocent
    blood to them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Terah begot Abraham/Abram, and when Abraham was twelve years old Terah sent
    him to sell idols.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Abraham told potential buyers that the idols were not gods able to deliver
    and were made by an artificer from materials such as wood, stone, iron, and brass;
    the buyers refused to buy them because Abraham had defamed the images.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the return journey Abraham set the images down and asked whether they could
    give him bread to eat or water to drink; they did not answer because they were
    pieces of stone and wood.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Abraham abused the idols, struck one, kicked another, and broke a third with
    stones, then said that beings unable to deliver themselves could not be called
    gods.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Abraham turned his face east, stretched out his hands, addressed the Lord
