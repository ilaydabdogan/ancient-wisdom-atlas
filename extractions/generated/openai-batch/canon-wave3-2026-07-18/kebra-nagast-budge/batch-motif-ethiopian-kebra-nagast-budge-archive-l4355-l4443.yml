canonical_text:
  quote: ''
  summary: The passage describes Canaan’s wrongful seizure and the disappearance of
    peoples who transgressed God’s command and worshipped idols; lists post-Shem rulers
    down to Terah; recounts ancestral manufacture of magical images through which
    devils demanded child sacrifice; narrates young Abraham’s refusal to treat idols
    as gods, his test and destruction of idols, his prayer to the Creator, and a fiery
    chariot vision followed by divine reassurance. It then begins the section on God’s
    covenantal speech to Abram.
  language: English
  quote_policy: summarized
