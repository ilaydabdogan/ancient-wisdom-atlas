canonical_text:
  quote: ''
  summary: 'The passage gives legal and moral instructions: sparing a bird with young,
    leaving harvest remnants for strangers, avoiding impurity, partiality, oppression,
    idolatry, fraud, sexual transgression, and murder; it pronounces blessings for
    obedience and curses for wrongdoing; it invokes God, David, and scriptural comparison
    notes; and it lists clean and unclean animals, birds, insects, and water creatures
    for dietary observance.'
  language: English
