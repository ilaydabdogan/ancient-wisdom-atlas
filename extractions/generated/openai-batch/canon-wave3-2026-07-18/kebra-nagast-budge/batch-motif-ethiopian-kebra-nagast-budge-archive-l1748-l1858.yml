canonical_text:
  quote: ''
  summary: Solomon attempts to build the House of the Lord in Jerusalem but the workers
    cannot cut the immense stones. After praying for wisdom, he arranges for a young
    Rukh bird to be confined under a brass pot. The mother Rukh searches for the young
    bird, retrieves a piece of wood from below Paradise in eastern Eden, and breaks
    the pot with it. Solomon uses the holy wood to split stones for the Temple, then
    preserves it after the Temple is finished. The passage then says God willed the
    kingdom of David and Solomon to be transferred to Abyssinia and stirred up the
    Queen to journey to Jerusalem to hear Solomon’s wisdom. It also recounts that
    the Queen’s pregnant mother craved a handsome goat, after which the Queen was
    born with one human foot and one goat-like foot and remained unmarried until she
    began to reign.
  language: English
  quote_policy: summarized
