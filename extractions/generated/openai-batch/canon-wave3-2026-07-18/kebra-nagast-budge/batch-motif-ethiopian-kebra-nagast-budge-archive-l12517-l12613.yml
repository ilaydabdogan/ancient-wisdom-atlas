canonical_text:
  quote: ''
  summary: Angels accuse Adam of transgressing the command not to eat from a tree.
    God answers on Adam's behalf, contrasting angelic and human composition, describing
    Adam's mixed good and bad thoughts and the Devil's mental seduction. The angels
    boast that they would not transgress and ask to be tested. God warns them of hellish
    punishment if they fail, reward if they obey, explains Satan's limited power over
    thoughts, grants them human mind and body, and warns them not to transgress or
    defile themselves.
  language: English
  quote_policy: summarized
