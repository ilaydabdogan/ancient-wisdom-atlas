canonical_text:
  quote: ''
  summary: 'Solomon and the Queen of Sheba exchange oaths: he will not take her by
    force, and she will not take anything in his house by force. Solomon has water
    placed in the chamber, gives her thirst-making food, pretends to sleep, and accuses
    her of breaking her oath when she tries to drink. After she releases him from
    his oath, she drinks, and they sleep together. Solomon then dreams of a brilliant
    sun that shines over Israel and moves to Ethiopia. An authorial comment describes
    another Sun from Judah that is rejected by Israel, attacked, placed in a guarded
    tomb, comes forth unexpectedly, illumines the world, and ascends.'
  language: English
  quote_policy: summarized
