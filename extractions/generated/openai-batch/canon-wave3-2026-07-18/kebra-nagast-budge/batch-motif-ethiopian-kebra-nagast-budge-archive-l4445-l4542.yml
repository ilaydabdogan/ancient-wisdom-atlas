- id: obs:1
  text: God promises Abram a covenant with him and his descendants, multiplication
    of his seed, magnification of his name, and the future descent of the Tabernacle
    of the Covenant, which will travel with his seed and bring salvation to his race.
  category: speech
  evidence_refs:
  - ev:1
