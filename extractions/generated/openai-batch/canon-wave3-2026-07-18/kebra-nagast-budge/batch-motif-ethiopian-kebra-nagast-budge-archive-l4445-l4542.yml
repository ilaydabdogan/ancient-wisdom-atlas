canonical_text:
  quote: I will establish My Covenant with thee and with thy seed after thee
  summary: The passage recounts God’s covenantal promise and command to Abram, Abram’s
    obedience and departure, his righteous rule at Salem, the succession of Isaac
    and Jacob, Reuben’s loss of kingship after transgression, and the transfer of
    royal blessing through Judah’s line to David.
  language: English
  quote_policy: quoted
