- id: obs:1
  text: Karmin is presented as exceedingly rich, with many possessions, and governors
    are said to fear him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Benyas is described as a depraved man of the seed of Benjamin who leads the
    mule of the King of Israel; Karmin feeds him along with the mule of King Manasseh.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Certain neighboring men envy Karmin because of his pastures, wells, flocks,
    herds, and servants, and they want to drive him from the country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The neighboring men tell Benyas that Karmin has blasphemed the King of Israel
    and promise to act as witnesses before the king.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The conspirators make a covenant and swear to bear false witness against Karmin,
    though the narrative says Karmin never spoke or thought the alleged words.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Benyas reports the accusation to the king, who asks whether anyone heard the
    words with him and tells him to bring the alleged witnesses secretly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king says that if the witnesses agree with Benyas, Karmin’s head will
    be cut off.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Zaryos and Karmelos rehearse coordinated answers about drinking wine with
    Karmin, including the day, hour, cups of gold, and hall seating.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king questions the witnesses about the occasion, day, hour, drinking,
    and seating, and they repeat their prepared testimony.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrator states that God commanded kings, governors, and high officials
    to investigate accusations, as God commanded Moses.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The king orders his captain to surround Karmin’s house at dawn, kill the people
    there, behead Karmin, and bring Karmin’s possessions, goods, livestock, gold,
    and silver.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The false witnesses return to Karmin’s house, speak peaceably, compliment
    him, jest before him, and conceal evil in their hearts.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage cites David’s prophecy about people who speak words of peace to
    a neighbor while having evil in their hearts.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The false witnesses drink themselves drunk in Karmin’s house and sleep there
    with him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: An Angel of God is sent to Karmin, wakes him, and tells him to leave his possessions,
