canonical_text:
  quote: ''
  summary: In the section headed “Concerning Lying Witnesses,” envious men plot against
    the wealthy Karmin by inducing Benyas and two witnesses to accuse him falsely
    before the king. The king questions the witnesses but accepts their agreed testimony
    and orders Karmin’s household killed and his property seized. The false witnesses
    return to Karmin’s house in outward peace. While they sleep after drinking, an
    Angel of God wakes Karmin and tells him to flee because Manasseh has ordered his
    death.
  language: English
  quote_policy: summarized
