canonical_text:
  quote: ''
  summary: Menyelek raises a concern about his status relative to Rehoboam, who was
    born from the king's lawful wife. The king answers by invoking his own irregular
    paternal lineage from David and God's forgiveness, then identifies Menyelek as
    his firstborn and promises him succession, covenantal blessing, and access to
    the Tabernacle of the God of Israel. Menyelek replies that he cannot remain because
    his mother bound him by oath to return quickly and not marry there; he seeks his
    father's blessing and a safe departure back to his mother.
  language: English
  quote_policy: summarized
