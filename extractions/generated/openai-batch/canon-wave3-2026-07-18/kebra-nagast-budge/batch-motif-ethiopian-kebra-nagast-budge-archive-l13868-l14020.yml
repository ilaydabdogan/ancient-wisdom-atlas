canonical_text:
  quote: And the Prophets also prophesied concerning the Crucifixion of Christ.
  summary: The passage gathers prophetic and scriptural utterances attributed to David,
    Solomon, Moses, Jeremiah, Job, Hosea, Habakkuk, and Isaiah. First it condemns
    a sinner or man of iniquity associated with wrath, fraud, darkness, bribes, corrupt
    judgment, and thirty pieces of silver. It then states that the prophets foretold
    Christ's crucifixion, citing images of salvation crucified on wood, nails through
    hands and feet, divided garments, rejection, the killing of the righteous man,
    gall, and vinegar.
  language: English
  quote_policy: quoted
