canonical_text:
  quote: ''
  summary: Zadok the priest addresses a young man with commands to hear and perform
    the word of God and to serve no other god. He lists curses for disobedience, including
    defeat, famine, disease, social loss, and cosmic drought imagery. He then promises
    goodness, rule over enemies, and glory for obedience, and a section on the blessing
    of kings repeats blessings over city, field, house, offspring, land, waters, livestock,
    stores, and movements, with gathered people answering Amen.
  language: English
  quote_policy: summarized
