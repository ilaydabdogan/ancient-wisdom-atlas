  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Queen gives splendid apparel, gold, silver, hyacinthine and purple robes,
    and other desired things to nobles, and orders her kingdom so that none disobey
    her command.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The child grows, and the Queen names him Bayna-Lehkem.
  category: action
  evidence_refs:
