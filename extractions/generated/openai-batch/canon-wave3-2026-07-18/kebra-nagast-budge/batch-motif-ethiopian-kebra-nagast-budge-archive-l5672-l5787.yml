canonical_text:
  quote: ''
  summary: The Queen returns from Solomon, gives birth to a son, and later names him
    Bayna-Lehkem. The son asks about his father, learns he is Solomon, grows to resemble
    him, and seeks to travel to him. The Queen sends him with Tamrin and a retinue,
    ordering that he be brought back to assume sovereignty. The passage also states
    a change in Ethiopian succession from virgin queens to male rulers of Solomon's
    seed, with an enduring law against worship of natural and crafted objects and
    a request for fringes from the covering of holy heavenly Zion, the Tabernacle
    of the Law of God.
  language: English
  quote_policy: summarized
