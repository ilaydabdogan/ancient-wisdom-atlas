    far away and the road is very difficult.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bayna-Lehkem is described as handsome and as resembling King Solomon in body,
    shoulders, eyes, legs, and gait.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: At twenty-two years old, Bayna-Lehkem is skilled in war, horsemanship, hunting,
    trapping wild beasts, and other arts learned by young men.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bayna-Lehkem says he will go to look upon the face of his father and return
    by the will of God, the Lord of Israel.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Queen calls Tamrin, chief of her caravan men and merchants, and orders
    him to take the young man to the King and bring him back safely if God pleases.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Queen prepares a suitable retinue, journey provisions, gifts for the King,
