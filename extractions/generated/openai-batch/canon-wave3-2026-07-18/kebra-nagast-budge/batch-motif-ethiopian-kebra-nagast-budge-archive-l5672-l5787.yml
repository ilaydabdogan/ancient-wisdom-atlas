  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Queen commands the officers not to leave Bayna-Lehkem with the King, but
    to bring him back so that he may assume sovereignty over her land.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage states that Ethiopia had a law that only a virgin woman who had
