  confidence: medium
  cautions: The passage excerpt gives only the beginning of the Menyelek origin legend
    and does not yet narrate the conception.
comparison_claims:
- id: claim:1
  claim: Within this excerpt, the Islamic Balkis account and the Northern Abyssinian
    Eteye Azeb legend both associate a Queen-of-Sheba figure with an ass-like lower-limb
    feature.
  claim_level: visual_similarity
  target: Balkis in Muhammadan literature and Eteye Azeb in Northern Abyssinian legend
  evidence_refs:
  - ev:6
  - ev:12
  - ev:19
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The bodily details are not identical: Balkis’s feet and legs are hairy
    like an ass’s coat, whereas Eteye Azeb’s heel becomes like an ass’s heel after
    contact with dragon blood.'
- id: claim:2
  claim: The Eteye Azeb episode fits a serpent or dragon-sacrifice rescue pattern
    in which a maiden is offered to a monster and saved by holy figures who kill it.
  claim_level: same_motif
  target: serpent/dragon sacrifice and rescue pattern
  evidence_refs:
  - ev:13
  - ev:14
  - ev:16
  - ev:18
  - ev:20
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself presents the story as a Northern Abyssinian legend
    and does not compare it to external dragon-slayer traditions.
