candidate_motifs:
- id: motif:1
  label: wisdom test through altered object
  taxonomy_refs:
  - wisdom
  basis: Solomon alters Balkis’s throne and asks whether it is like hers; she answers
    that it is the same.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly call this a wisdom test, though the action
    functions as a recognition challenge.
- id: motif:2
  label: illusion of water in a glass palace
  taxonomy_refs:
  - water
  basis: Balkis mistakes water visible beneath a glass floor for deep water and acts
    accordingly.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: Only the literal glass-floor episode is present; broader symbolic meaning
    is not stated in the passage.
- id: motif:3
  label: conversion or submission after marvel
  taxonomy_refs:
  - wisdom
  basis: After seeing the glass building and floor, Balkis declares submission to
    God with Solomon.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: Commentators offer two motivations, repentance and fear; the passage does
    not give a single definitive cause.
- id: motif:4
  label: animal-like lower limb of queen
  taxonomy_refs: []
  basis: Balkis’s feet and legs are said to be hairy like an ass’s coat, and Eteye
    Azeb’s heel becomes like an ass’s heel after dragon blood falls on it.
  evidence_refs:
  - ev:6
  - ev:19
  confidence: high
  cautions: 'The two variants explain different bodily features: Balkis has hairy
    legs and feet, while Eteye Azeb has an ass-like heel.'
- id: motif:5
  label: maiden offered to serpent or dragon
  taxonomy_refs:
  - serpent
  - sacrifice
  basis: Eteye Azeb’s people worship a dragon or serpent requiring each man’s eldest
    daughter as an offering, and Eteye Azeb is tied to a tree to become its food.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:16
  confidence: high
  cautions: The passage presents this as a local legend; no wider classification is
    asserted.
- id: motif:6
  label: saints slay dragon with sacred weapon
  taxonomy_refs:
  - serpent
  basis: Abba Mentelit and the other saints kill the dragon by smiting it with a cross.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: The cross is not included in the available symbol taxonomy, but it is
    central to the passage’s literal action.
- id: motif:7
  label: rescued victim rejected by community
  taxonomy_refs: []
  basis: After the saints free Eteye Azeb, the villagers drive her away because they
