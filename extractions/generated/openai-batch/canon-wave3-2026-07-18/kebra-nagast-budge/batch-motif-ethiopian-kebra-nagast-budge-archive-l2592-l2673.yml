canonical_text:
  quote: ''
  summary: The passage recounts a tradition in which Solomon tests Balkis with her
    transported and altered throne and with a glass palace whose floor appears to
    be water, exposing her hairy legs and prompting her submission to God. It then
    introduces a Northern Abyssinian legend in which Eteye Azeb, later associated
    with Menyelek’s mother, is offered to a dragon or serpent, rescued by seven saints
    who kill the monster with a cross, and marked on the heel by the dragon’s blood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A throne belonging to Balkis is seen standing before Solomon after a rapid
    heaven-to-earth gaze by an unnamed actor at the opening of the passage.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solomon has Balkis’s throne altered so that she may not recognize it when
    she arrives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Solomon asks Balkis whether the throne is like hers, she answers that
    it is the same as it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Solomon has built a special palace for Balkis with white glass walls and a
    glass floor over running water with fish.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Balkis sees the water, thinks it is deep, and lifts her garments before walking
    through it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: By lifting her garments, Balkis exposes her legs, confirming a report that
    her feet and legs are hairy like an ass’s coat.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Balkis says she has dealt unjustly with her own soul and resigns herself with
    Solomon to God, Lord of all creatures.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Commentators explain Balkis’s words as partly repentance for sun-worship and
    partly fear of drowning in the water she sees.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Jalal ad-Din says Solomon considered marrying Balkis but hesitated because
    of the hair on her feet and legs.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Devils attending Solomon remove the hair from Balkis’s feet and legs with
    an infernal depilatory.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says it is doubtful whether Solomon married Balkis and reports
    another view that she may have married a chief of the Hamdan tribe.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: A Northern Abyssinian legend says Menyelek’s mother was a Tigre girl named
    Eteye Azeb, meaning Queen of the South.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Eteye Azeb’s people worship a dragon or serpent and each man in turn must
    offer his eldest daughter, sweet beer, and milk to it.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: When Eteye Azeb’s parents’ turn comes, they tie her to a tree where the dragon
    comes for food.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Seven saints sit beneath the tree for shade and notice Eteye Azeb when a tear
    falls from her.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The saints ask whether Eteye Azeb is human or a spirit; she says she is human
    and bound as food for the dragon.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: When the saints see the dragon, Abba Tchehama plucks his beard, Abba Garima
    says it has frightened him, and Abba Mentelit calls for seizing it.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: Abba Mentelit attacks the dragon, and with his companions kills it by striking
    it with a cross.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: Blood from the dragon falls on Eteye Azeb’s heel, after which her heel becomes
    like the heel of an ass.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:20
  text: The saints untie Eteye Azeb and send her to her village, but the villagers
    drive her away, thinking she escaped from the dragon.
  category: sequence
  evidence_refs:
  - ev:20
