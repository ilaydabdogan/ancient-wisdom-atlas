canonical_text:
  quote: ''
  summary: The passage summarizes Bayna-Lehkem's arrival at Gaza and Jerusalem, his
    recognition by Solomon as his son by the Queen of Sheba, Solomon's attempts to
    keep him in Jerusalem, Bayna-Lehkem's insistence on returning to his mother, a
    note comparing his oath by his mother's breasts with a Nubian royal text about
    Nastasen and Bast, and Solomon's arrangement for Bayna-Lehkem to be anointed King
    of Ethiopia as David II with Israelite first-born sons sent to found a colony
    and kingdom there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Gaza, people were astonished by the young man's close resemblance to Solomon,
    and messengers reported the resemblance to Solomon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solomon was described as depressed because he had expected a very large posterity
    but, after marrying one thousand women, had received only three children from
    God.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Solomon heard of the young merchant who resembled him, he concluded that
    the visitor was his son by the Queen of Sheba and sent Benaiah to bring him to
    Jerusalem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Benaiah met Bayna-Lehkem and, with fifty guards, escorted him to Solomon,
    who acknowledged him, embraced him, and kissed him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Solomon clothed Bayna-Lehkem in rich apparel, gave him a gold belt and gold
    crown, set a ring on his finger, and presented him to the nobles of Israel, who
    accepted him as Solomon's son and brought him gifts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bayna-Lehkem produced a ring from his mother and gave it to Solomon, but Solomon
    said the ring was unnecessary because Bayna-Lehkem's face and stature already
    proclaimed him as his son.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tamrin asked Solomon to anoint, consecrate, bless, and quickly send Bayna-Lehkem
    back to his mother, fearing that luxurious living in Solomon's house would harm
    the future king.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Solomon replied that a son belongs to his father after his mother has borne
    and suckled him, and he refused to give up his first-born son.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bayna-Lehkem wished to leave Jerusalem, asked for a portion of the fringe
    of the Tabernacle of the Law of God, and did not wish to live as Solomon's second
    son because Rehoboam already existed as a son born in lawful marriage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Solomon promised Bayna-Lehkem the kingdom of Israel, wives, and concubines,
    but Bayna-Lehkem said he had sworn by his mother's breasts to return to her quickly
    and not marry a wife in Israel.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator states that swearing by a woman's breasts was serious and compares
    it with a ceremony in the Annals of the Nubian Nastasen involving the goddess
    Bast giving life, blessings, breasts, and bosom.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: When Solomon could not keep Bayna-Lehkem in Jerusalem, he summoned the elders
    of Israel, announced his intention to make him King of Ethiopia, and asked the
    elders to send their eldest sons with him to found a Jewish colony and kingdom
    there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Zadok and Benaiah anointed Bayna-Lehkem king in the Holy of Holies, and at
    the anointing he received the name David II after his grandfather.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Solomon ordered Zadok to describe the curses for disobeying God's commands
