  summary: 'The passage summarizes an Islamic/Qur''anic account of Solomon and the
    Queen of Sheba: Solomon receives divine gifts of knowledge and command over birds,
    spirits, and humans; a lapwing reports the rich sun-worshipping kingdom of Saba
    ruled by Balkis; Solomon sends a sealed letter through the bird; the Queen consults
