canonical_text:
  quote: ''
  summary: A priest recalls commandments and written judgments brought from Israel,
    framing obedience as a choice between death and life. 'Elmeyas and Azariah read
    the writing before Makeda and the assembled leaders, who bow and glorify God.
    Zion is described as dwelling among the people, blessing and protecting them.
    The Queen counsels her son to walk in the right given by God and charges the Israelite
    leaders to protect and teach him; they pledge loyalty to her, the king, and heavenly
    Zion.
  language: English
  quote_policy: summarized
