  quote: ''
  summary: The passage includes a plate caption describing Mary with the Child and
    archangels. In the narrative, Solomon's son explains his attachment to his mother's
    land, asks for a portion of Zion's covering so he can worship with his mother
    and subjects, reports the Queen's suppression of idol worship, and refuses to
    remain in Jerusalem. Solomon questions him privately about why he wishes to depart
    and forsake the kingdom of Israel; the son replies that he must go to his mother
    with Solomon's blessing.
