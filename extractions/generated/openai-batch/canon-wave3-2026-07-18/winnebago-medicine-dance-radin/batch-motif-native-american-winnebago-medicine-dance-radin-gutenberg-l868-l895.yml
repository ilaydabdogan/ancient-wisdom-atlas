canonical_text:
  quote: ''
  summary: 'The passage summarizes the sequence of the main day ceremony of the Winnebago
    Medicine Dance: participants return from a brush ritual, leaders enter the lodge,
    entrance and smoking rites occur, basic rituals are begun and interrupted among
    directional bands, a candidate is initiated, shooting, food-presentation, smoking,
    feast, origin-myth narration, distribution of presents, closing basic ritual,
    possible movement to the fireplace, exit ritual, and sunset conclusion follow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rites are described as lasting until about eight in the morning, when
    brush-ritual participants return and other Medicine Dance members prepare to begin
    the principal day ceremony.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ancestor-host precedes the other leaders when entering the lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the entrance ritual, the drum is struck four times at stated intervals,
    and a smoking ritual follows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ancestor-host rises to begin the basic ritual, which is interrupted at
    the end of its second part.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gourds and drum are passed to the East Band, whose basic ritual is also interrupted
    at the end of the second part.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The initiation of the candidate into the Medicine Dance is followed by the
    general shooting ritual.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the East leader concludes, drum and gourds are passed to the North Band,
    whose basic ritual is not interrupted.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: After the North Band's basic ritual, the food-presentation ritual, smoking
    ritual, and feast follow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the feast, the leader of the West Band narrates the origin myth of the
    Medicine Dance, and the leader of the South Band continues it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Presents are distributed after the origin-myth narration.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The basic ritual continues through the West Band leader and the South Band,
    after which drum and gourds are passed to the ancestor-host.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The ancestor-host either finishes the third and fourth parts of the basic
    ritual or takes the drum and gourds to the fireplace before the exit ritual and
    the sunset end of the ceremony.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that the main difference between two forms of Part IV,
    apart from initiation, is the number of myths told and the greater length of speeches.
  category: speech
  evidence_refs:
  - ev:8
