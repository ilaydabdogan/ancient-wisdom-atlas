canonical_text:
  quote: ''
  summary: The passage analyzes the Winnebago Medicine Dance by distinguishing an
    intrusive but real initiation-shooting complex from a basic ritual repeated by
    bands. It compares the initiation complex with Ojibwa-Menominee forms, describes
    the passing of ritual objects and blessing, and relates the basic ritual to analogous
    Winnebago and Siouan society ceremonies. It also notes that Medicine Dance membership
    is purchased and cautiously compares this to a Night Dance development in which
    an earlier vision requirement was replaced by purchase.
  language: English
  quote_policy: summarized
