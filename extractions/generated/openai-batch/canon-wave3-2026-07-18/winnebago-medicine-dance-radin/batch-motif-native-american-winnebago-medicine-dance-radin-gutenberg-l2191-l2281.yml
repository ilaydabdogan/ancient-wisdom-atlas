canonical_text:
  quote: ''
  summary: The passage describes the Medicine Dance as an amalgamated ritual complex
    and discusses the Winnebago term for the society. It distinguishes the society’s
    ritual significance from therapeutic medicine and from an exoteric reputation
    for harmful shamanic magic. It states that the ritual’s purposes include long
    life, safe passage to the next world, and possible return to life, obtained through
    membership, duties, and ritual participation. The passage also identifies Rabbit
    as the mythical founder addressed in prayer and Earth-Maker as the spirit who
    sent him.
  language: English
  quote_policy: summarized
