canonical_text:
  quote: ''
  summary: The passage describes the preparation and performance of an initiation
    sequence in which band leaders use sacred shells and otter-skins in a ritual shooting
    of a candidate, followed by the candidate’s apparent unconsciousness, recovery,
    and re-clothing. It then describes a sweat-lodge ritual involving circuits, a
    heating-stone, entrance poles, and clay-smeared sticks for strength. Finally,
    it identifies the basic ritual as the passing of blessing through speeches, songs,
    drum, gourds, and actions among bands for the benefit of host and guests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The initiation proper begins after the tent is prepared with two long calico
    strips running west to east, separated by the fireplace, and a shorter strip at
    the west end on which the candidate is placed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the preparations, the ancestor-host rises, goes to each of the four
    leaders, speaks to them quietly, and returns to his seat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The leaders of the East and North Bands rise, make a complete circuit of the
    lodge, deliver speeches, and go to the west end where the candidate is kneeling.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The two leaders take and swallow their sacred shells, go to the east end,
    hold their otter-skins ready, jerk them forward twice toward the four cardinal
    points, and utter formulaic sounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two leaders run toward the reclining candidate, make loud threatening
    sounds, strike his body twice with the mouth of the otter-skin, and the candidate
    immediately falls prostrate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The candidate is covered with a blanket, the two leaders’ otter-skins are
    placed on the blanket, and privileged people gather around the covered figure
    to dance, sing, and shout with other society members.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the blanket is removed, the candidate appears unconscious, slowly sits
    up, coughs violently, and a shell apparently shot into his body falls out of his
    mouth; afterward his recovery is rapid.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After recovery, the candidate is undressed; his finery and new buckskin suit,
    moccasins, and related items are distributed according to custom, and a female
    relative, usually his mother, dresses him in ordinary clothing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the sweat-lodge ritual, the East leader and assistants are joined by the
    North, West, and South leaders with assistants; the East leader makes four steps,
    makes four circuits, approaches the heating-stone after the third circuit despite
    a stated rule, and shakes the two entrance-lodge poles while shouting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ancestor-host smears four sticks with a greenish clay and hands them to
    the East leader; the sticks are then passed to the North, West, and South leaders,
    each repeating the ceremony to obtain strength.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The important religious function of the Medicine Dance is described as the
    passing of blessing, made up of speeches, songs, and blessings passed from one
    band to another for the benefit of host and guests.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that these blessings are symbolized by the drum, gourds,
    songs, speeches, and specific actions in which each band participates.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The ceremony is said to begin with the ancestor-host’s first speech and to
    end when the drum and gourds are returned to him; intrusive rituals may interrupt
    the basic ritual, which then resumes from the point of interruption.
  category: sequence
  evidence_refs:
  - ev:7
