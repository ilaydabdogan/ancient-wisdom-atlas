canonical_text:
  quote: ''
  summary: The passage analyzes the ritual function of shooting in the Winnebago Medicine
    Dance and related societies. It describes shooting as a shamanic or sympathetic-magic
    means of resisting the shot and malignant influences, distinguishes initiation-linked
    shooting from a basic ritual complex based on mutual shooting, and compares Winnebago,
    Omaha, Central Algonkin, and Kwakiutl associations while cautioning that recurrence
    alone does not prove historical relationship.
  language: English
  quote_policy: summarized
