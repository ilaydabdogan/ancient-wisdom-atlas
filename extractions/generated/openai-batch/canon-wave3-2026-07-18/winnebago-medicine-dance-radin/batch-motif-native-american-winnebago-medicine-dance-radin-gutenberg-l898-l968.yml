canonical_text:
  quote: ''
  summary: The passage summarizes the Ojibwa Midewiwin as a graded shamanic society
    with four degrees, admission through vision or replacement, preparatory instruction
    by a preceptor, sweat-bath preparation, initiation by ritual shooting, dramatization
    of a bear-spirit struggle with evil spirits, and powers attributed to second-
    and fourth-degree mide.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ojibwa Midewiwin is described as a society of shamans of both sexes, graded
    into four degrees requiring special initiation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The ritual of all degrees is said to be the property of five shamans: four
    mide-priests and a preceptor; their lodge positions are specified relative to
    the candidate and western entrance.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Admission may follow a fasting vision of a manito connected with the Midewiwin,
    or a person may replace someone who died while preparing for initiation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A selected preceptor instructs the pupil in mide teachings and explains the
    meaning and origin of regalia, songs, and the Midewiwin itself by means of birch-bark
    records.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After required knowledge and payments, the candidate undertakes a four-night
    preparation with four sweat-baths and waits at dawn in the sweat-lodge, dressed
    in best clothes, for the preceptor and four officiating priests.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first degree shares a shooting ceremony and general speeches with the
    other degrees, while the fourth-degree ceremonies are described as more elaborate.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The shooting is performed by the four officiating mide; only their leader
    succeeds in rendering the candidate unconscious, and the body location shot varies
    by degree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After initiation the candidate tries his power on the members present; indiscriminate
    shooting is said to occur in Ojibwa initiation only at the fourth degree and is
    referenced as described among the Winnebago.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ojibwa interpretation presents the Midewiwin as a dramatization of the
    bear-spirit’s struggle with evil spirits; the candidate impersonates the good
    bear-spirit and some mide sometimes impersonate evil spirits.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Successful completion, especially in the fourth degree, is associated with
    professional power sought by hunters, warriors, lovers, and people seeking charms
    against an enemy’s work.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A second-degree mide is said to look into futurity, hear distant events, touch
    remote friends or enemies for good or evil, and traverse all space.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A bad second-degree mide is said to assume animal form to kill and then resume
    human form; a fourth-degree mide is said to perform necromancy and magic, read
    thoughts, and call forth and retain the shadow or soul.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage concludes that the Midewiwin covered practically all religious
    and shamanistic ideas of the Ojibwa.
  category: attribute
  evidence_refs:
  - ev:8
