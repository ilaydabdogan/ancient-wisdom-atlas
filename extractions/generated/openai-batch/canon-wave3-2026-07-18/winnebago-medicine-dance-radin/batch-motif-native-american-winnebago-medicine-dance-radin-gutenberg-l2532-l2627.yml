canonical_text:
  quote: ''
  summary: The passage discusses initiation as a general mechanism of group differentiation
    and critiques Schurtz’s attempt to connect society initiation genetically with
    puberty rites through tests and group initiation. It compares several initiation
    practices, including childhood initiation and later adult powers in the Winnebago
    Medicine Dance, retirement of novices to woods or holy precincts, symbolic death,
    hardship, taboos, long seclusion, bodily disintegration, restoration to life by
    a shaman, and return in a childlike or unrecognizing state.
  language: English
  quote_policy: summarized
