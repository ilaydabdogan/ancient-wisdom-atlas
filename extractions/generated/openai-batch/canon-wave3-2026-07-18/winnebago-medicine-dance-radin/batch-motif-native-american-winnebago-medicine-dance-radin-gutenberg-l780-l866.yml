canonical_text:
  quote: "“make a road for the candidate, symbolical of the path of life”"
  summary: 'The passage describes a sequence of Winnebago Medicine Dance procedures:
    invitation to the sweat-lodge, speeches, fire and smoking rituals, myths, sweat-bath,
    entrance into the medicine-lodge, circulation of drum and gourds among band leaders,
    shooting and food rituals, and a pre-dawn brush ritual in which the candidate
    is instructed in the sacred shell, shooting, mythic narratives, and recovery actions
    before being newly dressed and returned to the lodge.'
  language: English
  quote_policy: quoted
