canonical_text:
  quote: "“an initiation and a shooting”"
  summary: The passage analyzes the initiation ritual shared by Central Algonkin Midewiwin
    and the Winnebago Medicine Dance. It describes Ojibwa-Menominee initiation as
    a simple shooting-initiation preceded by instruction, songs, speeches, and teaching
    of individual mide practices. It interprets initiation as the transfer of personal
    mide power through symbolic objects, especially the migis and otter-skin bag,
    and argues that this power transfer became associated historically with membership
    in the Midewiwin as a more definite society.
  language: English
  quote_policy: quoted
