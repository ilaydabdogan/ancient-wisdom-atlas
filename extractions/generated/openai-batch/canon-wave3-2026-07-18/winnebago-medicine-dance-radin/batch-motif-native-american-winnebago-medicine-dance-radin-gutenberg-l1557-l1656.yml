  text: The shooting element is described as capable of association with multiple
    ritual complexes and as already examined separately from the initiation ritual.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Ojibwa-Menominee Midewiwin, few individuals take active part, ritual
    elaboration is limited, ritual myths are told, songs are sung, speeches are delivered,
    and preparations are made for shooting the novice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ojibwa-Menominee ceremony is said to end practically when the shooting
    terminates, with the shooting-initiation complex serving the initiation of an
    individual into the Midewiwin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The initiation ritual is described as the terminal element after a long course
