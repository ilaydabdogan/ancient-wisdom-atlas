canonical_text:
  quote: ''
  summary: The passage describes repeated sections of the Winnebago Medicine Dance,
    including speeches, songs, drumming, rattles, dancing, lodge circuits, transfer
    of drum and gourds, a shooting ritual intrusion, Blowsnake’s admission frame,
    four nights of preparation, candidate instruction, and sweat-bath preparations
    using tobacco, a stone, oak wood, and grass.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The East leader rises, speaks, sits, and sings an initial song with members
    of his band.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a second speech, the East leader begins a minor dancing-song while singing,
    drumming, and gourd rattles accompany dancing by members who have bought the privilege.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Privileged members proceed to the fireplace, where the leader gives a speech
    and begins the major dancing-songs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the major dancing-songs, the drum is tied to a privileged member, the
    lodge circuit is made twice, and stops are made at the west and east ends for
    completion songs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The lodge circuit is then made four times with accelerating chanting, followed
    by a final vocalization and the depositing of drum and gourds before the next
    band.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The basic ritual is repeated by each band and divided into four parts that
    are not themselves interrupted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A general shooting ritual occurs after the second part; designated men of
    each band are shot, and shooting-songs are sung at the fireplace until that ritual
    is over.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ceremony as related by Blowsnake begins with an account of how he was
    induced to join the society; after acceptance and payment of required material,
    the ceremony began.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The first two nights include an informal salutation, explanatory speeches,
    and four myths; the last three myths concern the origin and dissemination of the
    Winnebago Medicine Dance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the Four Nights’ Preparation, the candidate is probably instructed
    in permitted myths and actions, though the passage states that the exact events
    are not positively known.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the morning after the fourth night, the candidate receives sacrificial
    tobacco, selects a sweat-bath stone, pours tobacco on it before lifting it, and
    brings it to the host’s lodge to be heated.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The candidate is sent for oak branches, four pieces of oak wood, and grass;
    the grass serves as seats and the oak pieces serve as sweat-lodge poles set at
    east, north, west, and south.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The ancestor-host and candidate go to the lodge of the East leader and greet
    him by touching his head with their hand.
  category: action
  evidence_refs:
  - ev:9
