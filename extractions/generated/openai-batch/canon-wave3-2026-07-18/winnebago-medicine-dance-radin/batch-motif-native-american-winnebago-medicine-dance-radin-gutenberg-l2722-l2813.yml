canonical_text:
  quote: ''
  summary: The passage argues that the admission or exclusion of women from secret,
    religious, or medicine societies should be interpreted through local ideas about
    men’s and women’s functions, the society’s specific ritual or social role, and
    property concepts. It surveys examples from Melanesia, Africa, and North America,
    including the Objibwa-Menominee Midewiwin, Winnebago Medicine Dance, Sore-Eye/Night
    Dance, and Blackfoot religious society, and rejects a single universal explanation
    for women’s exclusion or for the origin of women’s societies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that interpreting women’s exclusion or admission requires
    understanding each tribe’s ideas about the specific functions of men and women,
    and that historical reasons are often uncertain.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Melanesia, women are described as entirely excluded from societies that
    are associated with many religious and social functions in which women are not
    permitted to participate.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The New Hebrides example links women’s exclusion from a secret society to
    women having no role in funeral and mortuary rites connected with that society.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Purrah Society is described as excluding women and having war and judicial
    functions that, according to tribal ideas as summarized in the passage, do not
    fall within women’s domain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Attonga Society of Senegambia is described as admitting only women and
    being associated with mortuary rites.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Dschengu is described as a women’s society connected with the cult of
    a water deity, and the region around the mouth of the Ogowe is said to have powerful
    women’s societies associated with various elements.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage rejects the general claim that women’s societies are merely imitations
    of men’s societies and suggests that women’s societies in Africa may form in response
    to the same society-forming tendencies as men’s societies.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Objibwa-Menominee Midewiwin, women are admitted; the passage explains
    this by saying that women may become shamans as well as men, and that fewer women
    members occur because fewer women become shamans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Winnebago Medicine Dance, wealth and certain requirements possessed
    by both men and women are described as the only essentials for admission, so both
    sexes can become members.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The present Sore-Eye Dance admits women, while the same society formerly known
    as the Night Dance excluded women because supernatural communication with night
    spirits was required and women did not obtain visions from them; after the vision
    requirement ceased and membership could be purchased, women were admitted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Among the Blackfoot, women are described as part members of a religious society
    because they have a part in a man’s medicine-bundle, and possession of the medicine-bundle
    is necessary for admission.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that analysis of five ceremonies established differences
    in society functions, while Schurtz explained such differences as developments
    from one historically primary function.
  category: other
  evidence_refs:
  - ev:9
