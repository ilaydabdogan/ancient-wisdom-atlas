  quote: ''
  summary: The passage summarizes and critiques Schurtz's theory of ascending stages
    in social evolution, including the use of criteria such as exclusion of women,
    initiation, degrees, and secrecy. It argues that Schurtz's supposedly inductive
    interpretation was shaped by deductive preconceptions, especially the assumption
    of ascending social stages. The author then states an intention to set the theory
    aside and examine specific ceremonial data from the Ojibwa-Menominee Midewiwin,
    the Winnebago Medicine Dance, and the Omaha Shell and Pebble Societies, beginning
    with their common elements.
