canonical_text:
  quote: ''
  summary: The passage describes a general shooting ritual in which leaders of four
    bands carry otter-skins around the lodge, display and manipulate a sacred shell,
    fall as if dead, recover, and ritually shoot members who fall and recover. It
    then describes an initiation ritual in which the Ancestor-Host’s Band and a candidate
    circle the lodge with otter-skins, the candidate remains at the east end by the
    fireplace, receives an admonitory speech and bodily touches from the ancestor-host,
    faces south and north, and is taken west.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The leaders of the East, North, West, and South Bands hold otter-skins, take
    three men with them, and make a complete circuit of the lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The East Band leader speaks at each end and sings or chants while moving between
    the east and west ends; the South Band leader also speaks at the west end.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The leaders place their otter-skins on the ground, kneel before them, cough,
    and a sacred shell drops from their mouths onto the otter-skins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: They hold the shell in one hand and the otter-skin in the other, circle the
    lodge four times, increase their speed with each circuit, sing, and keep the shell
    visible on the outstretched right palm.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near the east end, at the end of the fourth circuit and in front of the Ancestor-Host’s
    Band, they supposedly swallow the shell and fall head-first as if dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: They come to, cough up the shell, and put it into an otter-skin bag.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: They make a circuit of the tent and shoot specified numbers of members from
    the Ancestor-Host’s, East, North, West, and South Bands; each person shot falls
    prostrate, recovers after a few moments, and joins the circuit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the general shooting, every person possessing the right shoots one individual
    until all members have been shot; each person shot falls, feigns unconsciousness,
    and slowly recovers, with recovery speed linked to privileges and years in the
    society.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A small group at the fireplace sings shooting-songs with drum and gourds while
    the others walk around.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the initiation ritual, the Ancestor-Host’s Band and the candidate make
    one circuit of the lodge with otter-skins, touch members’ heads with the mouth
    of the otter-skin, and exchange vocal responses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the circuit, the candidate remains at the east end in front of the fireplace;
    the ancestor-host gives an admonitory speech, touches the candidate’s head and
    chest, makes the candidate face south and north, then sings and takes the candidate
    to the west end.
  category: sequence
  evidence_refs:
  - ev:6
