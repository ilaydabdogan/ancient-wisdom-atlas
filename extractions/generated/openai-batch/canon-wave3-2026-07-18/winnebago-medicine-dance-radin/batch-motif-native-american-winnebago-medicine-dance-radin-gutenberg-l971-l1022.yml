canonical_text:
  quote: ''
  summary: 'The passage describes Menominee Midewiwin initiation. Initiation often
    substitutes a candidate for a deceased member, with four mide-priests determining
    candidacy, assigning an instructor, and selecting assistants and ushers. If the
    candidate replaces a deceased person, the ceremony begins at the grave with a
    dusk-to-dawn service, then proceeds to the Midewiwin lodge. Participants enter
    in ordered groups, sit in assigned locations, chant, dance, pass the drum and
    gourds in sequence, narrate origin and ritual myths, and continue through the
    night. After sunrise, preparations are made for initiation: the second set of
    mide shoots the candidate, who recovers and then circles the lodge shooting selected
    persons. The passage states that this shooting ceremony is practically identical
    with the Winnebago form.'
  language: English
  quote_policy: summarized
