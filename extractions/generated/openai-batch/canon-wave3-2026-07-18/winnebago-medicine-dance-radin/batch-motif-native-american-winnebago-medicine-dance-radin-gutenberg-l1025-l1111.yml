canonical_text:
  quote: ''
  summary: The passage identifies common elements among the ritual complexes under
    discussion, especially a general initiation ritual and a specific shooting ritual,
    with further resemblances in ethical teaching, shooting details, secret brush
    ritual, and Winnebago songs in a Central Algonkin dialect. It cautions against
    treating shared elements as proof of historical identity without explaining major
    differences, then summarizes Schurtz’s theory that similar social organizations
    may arise independently from common tendencies of the human mind, with the age-group
    as a primary ordered form.
  language: English
