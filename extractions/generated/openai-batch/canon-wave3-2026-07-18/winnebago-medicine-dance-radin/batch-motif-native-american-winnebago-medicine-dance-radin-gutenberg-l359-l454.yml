canonical_text:
  quote: ''
  summary: The passage classifies components of the Winnebago Medicine Dance, especially
    speeches, salutations, and ritual exchanges. It explains that directional bands
    and the lodge dramatize a creation-myth pattern involving Rabbit, four guardian
    spirits, the earth as an island, and the end of the road. It also gives sample
    welcome, presentation, acceptation, and admonition speeches, including instructions
    to a candidate about the path of life obtained by Rabbit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first and second parts of the ceremony are described as reciting ritual
    myths and rehearsing songs and band-specific ritual used later.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author differentiates speeches, songs, and actions, and treats combined
    complexes as functional ritual units.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In later parts of the ceremony, salutations address the ancestor-host and
    his band by relationship to a deceased relative, and address East, North, West,
    and South by directional descriptions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The appellations of the bands are said to refer to a creation myth in which
    Rabbit visited four guardian spirits to ask about the necessity and meaning of
    death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rabbit is described as traveling around an earth conceived as an island and
    receiving no answer until he reached the spirit at the end of the road.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the dramatic performance, the lodge typifies the earth, the four bands
    and leaders typify four spirits, and the ancestor-host’s band typifies the ancestor
    of the Winnebago.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Speeches are expected to follow a traditionally determined sequence, and departure
    from the accepted norm is believed to interfere with the ceremony’s efficacy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The East Band leader’s welcome speech includes thanks for being invited, humility,
    reference to learning the true manner of living, and announcement of a song.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ancestor-host responds with welcome, readiness to sing, and a promise
    to pass tobacco, gourds, and drum as means of blessing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Food presentation and acceptance are accompanied by humility, thanks, reciprocal
