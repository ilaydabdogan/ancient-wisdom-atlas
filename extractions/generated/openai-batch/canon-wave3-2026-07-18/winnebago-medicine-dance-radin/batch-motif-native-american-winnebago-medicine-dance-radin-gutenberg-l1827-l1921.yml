canonical_text:
  quote: ''
  summary: The passage analyzes the Winnebago Medicine Dance initiation as possibly
    secondary to a basic ritual and as likely borrowed from the Central Algonkin Midewiwin.
    It compares initiation in Ojibwa-Menominee Midewiwin, Shell Society, Pebble Society,
    and the Winnebago Medicine Dance, then begins describing the general ceremonies
    of the Ojibwa-Menominee Midewiwin and Shell Society.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage treats the basic ritual as possibly the principal and historically
    primary feature of the Medicine Dance, while the initiation ritual is described
    as intrusive or secondarily associated.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Medicine Dance initiation-complex was borrowed
    from the Central Algonkin Midewiwin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The Medicine Dance is described as possessing two initiations: purchase of
    membership and the other initiation mentioned in the analysis.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Non-members are said not to call the shooting an initiation, but to view it
    as a shamanistic practice connected with strengthening power.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Ojibwa-Menominee case, initiation is described as a formal transfer
    of shamanistic powers from one individual to another, later associated with social
    status and society admission.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Shell Society, the transfer of powers is described as analogous to
    purchasing specific powers, with admission into the society purchased at the same
    time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Pebble Society, initiation is described as acquisition of power through
    supernatural communication from an animal, with no initiation into the society.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that initiation is both a concept and a ritualistic complex,
    varying across tribes and requiring study within each specific ceremony.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Ojibwa-Menominee general ceremony is described as essentially the initiation
    ritual itself, completing a long course of preparatory instruction in which the
    shaman plays the major part.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Shell Society general ceremony is described as a complex including invitation-sticks,
    opening the pack, circling the fire, filling a wooden bowl with water, shooting,
    passing the drum, and completion by five ceremonial bands.
  category: sequence
  evidence_refs:
  - ev:9
