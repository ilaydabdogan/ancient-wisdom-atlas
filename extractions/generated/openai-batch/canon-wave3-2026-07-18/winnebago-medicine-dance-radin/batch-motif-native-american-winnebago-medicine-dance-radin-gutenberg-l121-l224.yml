canonical_text:
  quote: The Medicine Dance is a society, admission into which is gained by purchase.
  summary: After listing section headings, the passage begins a description of the
    Winnebago Medicine Dance. It describes the Medicine Dance as a society entered
    by purchase, said to repeat Rabbit's initiation of the first man; it outlines
    five bands, leadership and assistant roles, lodge seating by invitation, joining
    procedures and payments, initial limits on knowledge and use of the otter-skin
    bag, member categories, and the host title.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Medicine Dance is described as a society whose admission is gained by
    purchase.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Winnebago are said to suppose the ceremony repeats one originally instituted
    by Rabbit when he initiated the first man into its secrets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The society consists of five bands: Ancestor-Host’s, East, North, West, and
    South; any band may act as host, and lodge positions depend on invitation order.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each band is divided into a leader, two assistants, and the rest of the band.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Leadership depends on thorough ceremonial knowledge and complete esoteric
    significance, held by one individual in each band and obtained through purchase
    and religious qualifications.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Assistants are men who purchased enough information and privileges to help
    the leader; drummers, rattle-holders, and dancers are recruited from their ranks,
    and assistants may later become leaders.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Lodge priority follows invitation order: the first invited band occupies
    the east position, the second north, the third west, and the fourth south; east
    is highest honor and south lowest.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man can join by applying to one of the five leaders or by taking the place
    of a deceased relative, with the latter described as the commoner form.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Initiation is described as requiring payment in goods and tobacco, divided
    between the leader of the Ancestor-Host’s Band during the Four Nights’ Preparation
    and the other four leaders during the ceremony proper.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A new member initially receives limited knowledge, is not initiated into the
    symbolism of ritualistic myths, receives the right to hold and use the otter-skin
    bag in a certain way, and cannot freely dance, sing, or shoot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Members are categorized as mature men, women, and children; women have specified
    differences in privilege, while children possess an otter-skin but need guidance
    from an older member to make it effective.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The host is named x’okera, and the host’s band is called Minañk‘ara-k‘oñañgire′ra.
