canonical_text:
  quote: ''
  summary: The passage distinguishes powers attributed to an individual mide from
    functions associated with the Midewiwin, especially prolonging life and ensuring
    safe passage to a future world through proper membership, ritual observance, precepts,
    and formulas. It compares Ojibwa and Menominee Midewiwin, noting Menominee kin
    succession and a ceremony beginning at the grave. It then describes the Shell
    Society as organized by ceremonial group units and lodge designations, and argues
    that its powers depend on ritual performance while broader magical and healing
    practices reflect general Omaha customs rather than proving historical links between
    societies.
  language: English
  quote_policy: summarized
