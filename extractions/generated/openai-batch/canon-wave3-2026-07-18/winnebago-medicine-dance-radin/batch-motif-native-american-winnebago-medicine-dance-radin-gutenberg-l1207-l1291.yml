canonical_text:
  quote: ''
  summary: The passage summarizes Schurtz's evolutionary classification of social
    organization. It presents social forms as developing from sexual instinct, blood
    relationship, age distinctions, puberty initiation, the men's house, secrecy,
    and finally clubs or secret societies. The account is analytical rather than a
    ritual narrative.
  language: English
  quote_policy: summarized
