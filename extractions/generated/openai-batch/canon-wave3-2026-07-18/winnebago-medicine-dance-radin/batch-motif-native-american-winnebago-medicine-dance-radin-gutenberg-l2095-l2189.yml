canonical_text:
  quote: ''
  summary: The passage analyzes the Shell Society and Pebble Society as ritual societies
    whose powers are associated with specific objects. It describes shell-associated
    magic, individual harmful magic, a death-related ceremony, a ritual punishment
    procedure using a sacred figure and an earth-drawn figure, and pebble/water-spirit
    associations with healing knowledge and curing disease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The society is named “Those-who-have-the-Shell,” and possession of the shell
    separates it from other societies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shell is connected with unspecified magical qualities, and the passage
    hypothetically links the society’s origin to an individual vision in which magical
    power was associated with a shell.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that different societies may associate magical powers with
    different objects, such as a shell, drum, flute, gourd, or stone.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In examples of Shell Society practice, shooting is said to kill the “children”
    in an origin myth, strengthen acquired powers in the general ceremony, and function
    as sympathetic magic in a punishment ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Members are said to exercise individual magic, including killing a horse after
    its owner offended a member and killing another member by magically placing a
    snake near that person’s workplace; the passage says these acts are not specific
    to the society.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a member dies, the deceased is carried to a tent where the regular ceremonial
    is performed; the passage says it is not known whether this relates to a soul
    journey to a future world.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A punishment ceremony is described as intended to keep people in order and
    check crimes such as molesting wives or daughters and destroying property.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The punishment ceremony uses a sacred figure said to represent the society;
    its arms contain poisons and its leg contains magic shells, and it is brought
    out at night after the society decides to punish someone.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Punishment is carried out by applying poison to an earth-drawn figure that
    symbolizes the offender, shooting at that figure, waiting to hear that the offender
    has become sick, and then singing in a tent until the offender dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Pebble Society is described as generally comparable to the Shell Society,
    but its magical powers are attached to a translucent pebble.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: People who had visions of water, the pebble as water’s representative, or
    the water-spirit could become members of the Pebble Society.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The water-spirit is associated with granting knowledge of medicinal herbs
    and powers for healing sickness, and the Pebble Society consequently contains
    many people with such powers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that curing disease is the most important association of
    the Pebble Society.
  category: attribute
  evidence_refs:
  - ev:9
