canonical_text:
  quote: ''
  summary: 'The passage classifies types of songs and actions in the Winnebago Medicine
    Dance, then outlines several ritual complexes: entrance, exit, fire, smoking,
    and presentation of food. It describes blessing gestures, counterclockwise movement
    through the lodge, circuits of the lodge, speeches and songs, offerings of tobacco
    and food, kindling of a new fire, and pipe-smoking directed to the four directions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Songs are divided into songs connected with myths or general speeches and
    songs accompanying specific actions; action songs are subdivided for description
    into minor dance, major dance, initial, terminal, loading, and shooting songs,
    while medicine-men distinguish four kinds.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A blessing is performed by holding either hand outstretched, palm downward,
    and moving it horizontally through the air; it is used when entering, leaving,
    or passing through the lodge, and recipients respond with a drawn-out vocalization
    and head obeisance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A head blessing consists of laying the hand on the head while giver and recipient
    look toward the ground; the recipient bends the head slightly and a few mumbled
    words accompany the act.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Movement in the lodge must normally proceed counterclockwise; the East Band
    must make the full circuit to pass out, with only a costly privileged exception
    during the shooting ceremony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The ritual is analyzed into nine complexes composed of speeches, songs, and
    movements: entrance, exit, fire, presentation of food, shooting, initiation, sweat-lodge,
    smoking, and basic ritual.'
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the entrance ritual a band enters the tent, makes a complete circuit, stops
    for speech and song, proceeds to the west and east ends for further speech and
    song, sits, and the leader gives tobacco to the ancestor-host.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the exit ritual the East, North, West, and South leaders speak; singing
    bands move toward the entrance with specified circuits so the East Band precedes
    them, then stop singing, say a phrase four times, and pass out.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the fire ritual the ancestor-host blesses leaders of four other bands,
    all make four circuits and sit, and the East Band leader kindles a new fire at
    the fireplace while holding invitation-sticks and tobacco.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the smoking ritual the East Band leader puts tobacco into the fire at the
    east, north, west, and south corners, puffs a pipe toward those directions, then
    passes the pipe around the lodge circuit before it is placed before the fireplace.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the presentation-of-food ritual the East Band leader and then the other
    leaders bring foods such as meat, berries, and wild potatoes to the ancestor-host,
    who rises and thanks them.
  category: action
  evidence_refs:
  - ev:10
