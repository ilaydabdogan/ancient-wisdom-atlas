canonical_text:
  quote: ''
  summary: The passage describes duties of the ancestor-host and the leaders of the
    East, North, West, and South Bands in the Winnebago Medicine Dance; the candidate’s
    instruction, transfer, and secret brush rites; distribution of gifts; facial markings
    and regalia; and the five-part division of the ceremony, including sweat-lodge
    rites, the night and day ceremony, guarded brush rites, feasts, and an intermission.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The candidate is present at a rehearsal four nights before the ceremony proper
    and is instructed in the ceremony; the candidate is glossed as “the one for whom
    they seek life.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ancestor-host sends invitation-sticks and tobacco to leaders of the other
    four bands, and the messengers are his sisters’ sons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ancestor-host begins preparatory ceremonies, receives leaders and assistants
    before the sweat-lodge ritual, begins the ceremony proper, welcomes the four bands,
    leads the candidate to the secret brush, gives precepts, acts as preceptor before
    the sacred-shell shooting, turns the candidate over to East and North leaders,
    relates myths, and performs basic ritual actions and speeches.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The East Band is identified with places where day comes from and where the
    sun rises; its leader assists in judging eligibility, participates in the brush
    ritual with two assistants, takes charge of the candidate, shoots the sacred shell
    into the candidate’s body, relates myths, and performs the basic ritual.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The North Band is identified with where cold comes from and its leader has
    the same duties as the East leader; the West and South leaders recite myths and
    perform the basic ritual, with different myths assigned to them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Gifts are apportioned among the directional band leaders, including blankets,
    parts of the candidate’s suit, moccasins, calico, food, tobacco, and payment to
    the ancestor-host from the candidate.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The candidate attends the Four Nights’ Ceremony of the ancestor-host’s band,
    sits to the right of that band during the ceremony proper, and is not dressed
    in the new suit until after the secret ceremonies in the brush.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The host’s band and the candidate paint a blue circle on each cheek; the author
    states that the significance of this marking is unknown to him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The regalia include animal-skin bags, a drum, gourd rattles, and invitation-sticks;
    beaded otter-skin bags contain the sacred shell and medicines, have red feathers
    inserted in the mouth, and gourds are marked with blue finger-marks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The Medicine Dance is divided into five parts: Two Nights’ Preparation, Four
    Nights’ Preparation, sweat-lodge rites, the ceremony proper divided into night
    and day ceremonies, and brush rites where the society’s secrets are imparted to
    the candidate.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Special guards are placed around the brush to prevent outsiders from entering;
    the brush ceremonies occur at dawn before the day ceremony.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two feasts and one intermission interrupt the main ceremony; feasts follow
    the East Band ritual, and the intermission begins after the drum and gourds are
    returned to the ancestor-host and ends when people return from the brush ritual.
  category: sequence
  evidence_refs:
  - ev:7
