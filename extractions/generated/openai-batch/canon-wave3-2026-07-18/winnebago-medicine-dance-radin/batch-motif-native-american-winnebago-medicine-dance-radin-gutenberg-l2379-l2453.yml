canonical_text:
  quote: ''
  summary: The passage argues that similarities among the Ojibwa-Menominee Midewiwin,
    the Winnebago Medicine Dance, and Omaha Shell and Pebble Societies do not by themselves
    prove historical relationship, since shared cultural environment and convergent
    development can produce similar ceremonial patterns. It notes a possible but unproved
    connection between the journey to spirit land and the Winnebago wake, states that
    the shooting ceremony in the Medicine Dance is a borrowed Midewiwin initiation
    ritual, describes Winnebago societies as currently organized around supernatural
    communication or common visions, and critiques Schurtz’s use of initiation, degrees,
    and exclusion of women as fixed survivals of social stages.
  language: English
  quote_policy: summarized
