candidate_motifs:
- id: motif:1
  label: Failed retrieval from hidden cave world after broken fast
  taxonomy_refs:
  - afterlife_journey_map
  - forbidden_knowledge
  - return
  basis: The parents are given a seven-day fasting condition for bringing the girl
    back, reach the cave threshold, see her among dancers, and lose access when the
    father eats too soon.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not explicitly call the cave an afterlife or otherworld;
    that reading rests on the described hidden dancers, recovery attempt, threshold,
    and vanishing cave.
- id: motif:2
  label: Supernatural marriage between human woman and invisible or spirit figure
  taxonomy_refs:
  - sacred_marriage
  - divine_beloved
  basis: Tuli-cula is an invisible person who takes a wife from a town; the Balsam
    legend also describes a maiden becoming the bride of a spirit.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage presents separate versions and does not prove they are identical
    in origin; Tuli-cula is called invisible, not explicitly divine.
- id: motif:3
  label: Birth or family event linked to landscape formation
  taxonomy_refs:
  - divine_parent_child
  basis: The birth of Tuli-cula's first son coincides with earthquake and noise, and
    the account attributes mounds and tracks in rocks to the event and subsequent
    removal.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: No exact available taxonomy family for etiological mound or footprint
    formation is supplied; the parent-child taxonomy reference is approximate.
- id: motif:4
  label: Mountain ascent for divine aid blocked by transgression
  taxonomy_refs:
  - ascent
  - divine_judgment
  basis: Warriors ascend a mountain expecting assistance, but a warrior's speech is
    judged sinful and the aid is withdrawn.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: Buttrick's account is described as told for a missionary's special benefit
