canonical_text:
  quote: ''
  summary: 'The passage presents several recorded or secondary versions of Cherokee-related
    traditions: an attempted recovery of a girl from a cave-dance that fails when
    a fasting condition is broken; a mound-origin tradition involving Tuli-cula, an
    invisible husband, earthquake and noise, and tracks in rocks; Buttrick''s accounts
    of warriors ascending a mountain for divine assistance but losing aid after a
    transgressive speech; and Zeigler and Grosscup''s embellished Balsam legend in
    which a maiden weds a spirit, mediates with the eternal hunting grounds, and a
    thunderous apparition of armed spirits frightens Cherokee chiefs after a hostile
    brother is struck down.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the John Ax version, the girl's father and mother try to bring her back
    and are told they must fast seven days to succeed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The parents travel to the mouth of a cave, hear a drum and dancing inside,
    and see their daughter among the dancers but cannot enter before the seventh day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father eats before sunrise on the seventh morning, after which the cave
    and dancers disappear and the parents are left alone on the mountain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Haywood's cited tradition says mounds arose from earthquake and great noise
    connected with adoption into the family of Tuli-cula, an invisible person who
    had taken a wife from a Cherokee town.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Haywood account, the earthquake and noise cease after an alarm whoop
    raised by two imprudent young men, and the father removes the child and mother
    toward Brasstown, making tracks in rocks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Buttrick's first version says warriors ascend a mountain for assistance from
    God, but a warrior speaks about women, a thunder-like voice from the mountain
    orders them to return, and the man is put to death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Buttrick's second form places the episode before coming to the continent,
    during distress from enemies, and says the people were told to go to a mountain
    top where God would come down to give relief.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Zeigler and Grosscup describe a maiden who wanders by a mountain stream into
    a glen, sleeps, and is wooed and won as bride by a spirit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The maiden's people believe she has been abducted, search for her, and make
    war on neighboring tribes because they cannot find her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The maiden asks the great chief of the eternal hunting grounds for retribution
    and is appointed to call a council of her people at the forks of the Wayeh river
    through a dream appearance to the chiefs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the appointed council, thunder, lightning, black cloud, and armed strange
    men appear on a rock; the maiden's enraged brother raises a war whoop and is killed
    by a thunderbolt.
  category: sequence
  evidence_refs:
  - ev:10
