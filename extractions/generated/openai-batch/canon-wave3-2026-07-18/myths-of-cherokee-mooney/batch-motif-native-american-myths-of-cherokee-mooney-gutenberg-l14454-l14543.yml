canonical_text:
  quote: ''
  summary: The passage first describes the Red Man of the Lightning rewarding a hunter
    with powerful hunting medicine made from an uktena scale and lightning-struck
    wood, along with instructions for handling its danger and curing the hunter's
    brother. It then gives the tale of a hunter who ignores warnings about a dangerous
    uksu'hi snake, is caught and dragged toward water, but escapes by putting perspiration
    on the snake's nose. The final section describes the Ustû'tli, a serpent on Cohutta
    mountain with peculiar feet, dangerous pursuit, and a fawn-like bleat.
  language: English
