    broader patterns of sacred numbers, including Christian three and seven and sacred
    numbers in many tribes and cults.
  claim_level: same_function
  target: sacred-number systems across Christianity and other tribal or cult traditions
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
