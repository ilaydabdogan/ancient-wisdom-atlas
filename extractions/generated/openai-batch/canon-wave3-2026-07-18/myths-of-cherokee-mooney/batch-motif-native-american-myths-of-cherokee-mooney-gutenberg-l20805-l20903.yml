- id: motif:8
  label: Miraculous child from a blood drop
  taxonomy_refs:
  - miraculous_child
  basis: In the Creek corn myth, the old woman's son, endowed with magic powers, develops
    from a single drop of her blood.
  evidence_refs:
  - ev:11
