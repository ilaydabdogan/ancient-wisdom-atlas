candidate_motifs:
- id: motif:1
  label: Sacred numbers structuring cosmos and ritual
  taxonomy_refs:
  - world_center
  basis: Four and seven organize directions, upper worlds or heavens, ritual repetitions,
    and center/vertical orientation.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The available taxonomy has no dedicated sacred-number category; world_center
    is used only for the directional-center aspect.
- id: motif:2
  label: Ritual ascent to the seventh heaven for long life
  taxonomy_refs:
  - ascent
  basis: The priest raises the client by stages to the first through seventh heaven
    before the prayer's goal is accomplished.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is a formula note rather than a full narrative.
- id: motif:3
  label: Animal acquisition or theft of fire by stratagem
  taxonomy_refs:
  - sacred_theft
  basis: The first fire variants include animal actors attempting, obtaining, or stealing
    fire, especially through dance-related stratagems.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The Cherokee Water-spider version is only alluded to in this passage;
    the Creek and Jicarilla details are more explicit here.
- id: motif:4
  label: Purifying water rite before hearing a sacred myth
  taxonomy_refs:
  - initiation
  basis: A listener must bathe in a running stream before daylight while fasting before
    hearing the sacred Kana'ti tradition from a priest.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage presents a ritual prerequisite, not an initiation narrative
    in full.
- id: motif:5
  label: Arrows used to determine a departed person's path to spirit land
  taxonomy_refs:
  - afterlife_journey_map
  - ascent
  basis: The boy's arrows test the four directions and above; the non-returning upward
    arrow shows the father has gone to the spirit land.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives a short synopsis and does not elaborate the spirit land.
- id: motif:6
  label: Divine punishment by removal of a sacred cave or game preserve
  taxonomy_refs:
  - divine_judgment
  basis: The Great Spirit punishes the Cherokee nation by tearing away the cave from
    Black Mountain and leaving a cliff.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The reason for the offense is only briefly summarized as connected with
    the foolish boy.
- id: motif:7
  label: 'Corn Woman: crop originating from female blood, body, or transformation'
  taxonomy_refs:
  - death_rebirth
  - mother_goddess
  basis: The passage says the corn spirit is female and corn originates from Corn
    Woman's blood drops or dead body; Cherokee, Creek, and Iroquois examples are given.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: Mother_goddess is used cautiously for female crop-origin figures; the
