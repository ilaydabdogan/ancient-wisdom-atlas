  limitations: The comparison is broad and functional; the passage does not argue
    historical connection or shared origin.
- id: claim:2
  claim: The Cherokee first fire variants, the Creek Rabbit story, and the Jicarilla
    Fox story share a fire-acquisition pattern involving animal actors and stratagems
    around a blaze.
  claim_level: same_motif
  target: animal fire acquisition or fire theft myths in Cherokee, Creek, and Jicarilla
    materials
  evidence_refs:
