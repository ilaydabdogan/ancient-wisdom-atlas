canonical_text:
  quote: '"This is where I live."'
  summary: 'The passage contains several animal tales: a drought tale in which the
    hare refuses to help dig a well, steals water, is trapped by a tar wolf, and escapes
    by being released into a thicket; a Rabbit and Possum tale in which Rabbit uses
    false council messages to gain a wife and then causes Possum to be beaten, explaining
    Possum''s feigned death; a Rabbit and Bear tale in which Rabbit is hurt after
    imitating Bear''s bodily production of grease; and the beginning of a Wolves tale
    in which Rabbit asks to perform a dance before being eaten.'
  language: English
  quote_policy: quoted
