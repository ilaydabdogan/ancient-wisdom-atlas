canonical_text:
  quote: ''
  summary: 'The passage contains the conclusion of a race between Crane and Hummingbird
    for a woman, followed by two marriage tales: an owl suitor who claims to be a
    hunter but is discovered changing between man and owl, and a huhu suitor who claims
    to be a worker but is found absent from the field and is expelled.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Crane continued through the nights, gained on Hummingbird over several days,
    and arrived first at the starting place where the woman lived.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hummingbird arrived later and lost the race, but the woman refused to take
    Crane as a husband and stayed single.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the owl tale, a widow advised her daughter to marry only a good hunter,
    and a suitor claimed to be such a hunter before the marriage was arranged.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The owl husband repeatedly went out saying he would hunt or fish, but returned
    with only small fish, spring lizards, or scraps left by other hunters.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The widow became suspicious and told her daughter to follow the husband secretly
    to see how he worked.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the river, the daughter saw her husband change into a hooting owl, fly
    to driftwood, take sand from the water, pick out a crawfish, and later take human
    form again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife confronted the husband, rejected his explanation that an owl had
    frightened the fish, said he was the owl, and drove him out.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After being driven out, the owl went into the woods and wasted away from grief
    and love until flesh remained only on his head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the huhu tale, a widow and her only daughter wanted a man in the family
    who would be a good hunter and field worker, and a stranger lover claimed to be
    that kind of man before marrying the daughter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the huhu husband was sent to the cornfield with a hoe, the widow found
    only a small amount of work or no work, no son-in-law present, and a huhu calling
    in the thicket.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The huhu husband explained his absences by saying he had been working hard,
    cutting sticks, or visiting kinsfolk in the thicket.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The widow said there was nothing living in the swamp but huhus, that her daughter
    needed a husband who could work and not a lazy huhu, and drove him from the house.
  category: speech
  evidence_refs:
  - ev:8
