canonical_text:
  quote: ''
  summary: 'The passage describes the Cherokee Nation after removal to Indian Territory:
    cultural and political reorganization, decline or secrecy of older ceremonies,
    factional conflict, Sequoya''s western journeys in search of linguistic knowledge
    and a lost Cherokee band, his death in Mexico, and later treaty adjustments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After final removal and reunion in Indian Territory in 1840, the author presents
    the Cherokee aboriginal period as closed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the forced expatriation completed a transition from hunter
    and warrior toward farmer and mechanic.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cherokee are described as torn from native streams and mountains, with
    council fires extinguished and townhouses burned behind them, then transported
    to a distant unfamiliar country.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ballplay is described as neglected, the green-corn dance as proscribed,
    and heroic tradition as fading into memory or children's tales.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says several thousand full-blood Cherokee still speak only their
    native language and secretly bow down to the nature-gods of their fathers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The conservative element is described as taking refuge in mountain districts,
    while mixed-bloods and adopted whites are chiefly in richer low grounds and railroad
    towns.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tahlequah is designated as the seat of government of the reorganized united
    Nation and is named from the older Cherokee town of Talikwa' or Tellico.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The missions and the Advocate are revived, while removals, persecutions, suffering,
    mortality, and poverty make renewed civil work difficult.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bitterness from the New Echota treaty leads to murders, assassinations, outlawry,
    and factional conflict between Ross and Ridge factions; Old Settlers also have
    grievances against newcomers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sequoya is described as prominent among the Old Settlers and as seized by
    a desire to make linguistic investigations, probably toward a universal Indian
    alphabet.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sequoya's mind is said to dwell on an old tradition of a lost band of Cherokee
    somewhere toward the western mountains.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In 1841 and 1842 Sequoya travels west with Cherokee companions, provisions,
    and papers loaded in an ox cart, and is received kindly by remote tribes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In 1843 Sequoya sets out to find the lost Cherokee believed to be in northern
    Mexico, but dies near San Fernando, Mexico, after hardship.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A party sent from the Nation to bring Sequoya back arrives too late; a pension
    is continued to his widow, and a district and the California Sequoia trees preserve
    his memory.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A Washington treaty in 1846 adjusts conflicting claims, promises reimbursement,
    and proclaims a general amnesty, though final settlement remains incomplete.
  category: sequence
  evidence_refs:
  - ev:9
