canonical_text:
  quote: ''
  summary: 'The passage contains several Cherokee narrative units: a runaway boy is
    swallowed by a fish and expelled after cutting its liver; Atagâ''hi is described
    as an invisible medicine lake in the Great Smoky Mountains where animals are healed;
    the North marries a daughter of the South, whose warmth melts northern ice houses
    and forces her return; and an Ice Man from the north extinguishes a world-threatening
    fire with wind, rain, sleet, and hail, leaving a lake where the fire pit had been.'
  language: English
  quote_policy: summarized
