canonical_text:
  quote: ''
  summary: Two brothers who have been away from home kill an old man during a mountain
    hunt, take provisions, return north, and are recognized by their mother after
    using a Seneca hail. A second narrative tells how the Seneca war chief Ganogwioeoñ
    infiltrates a Cherokee town, kills the chief's daughter, is captured and sentenced
    to torture, escapes after his feet are burned, is aided in a hollow log by unseen
    helpers who heal and warm him, and then finds hidden tools at an old bark shelter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The older brother proposes killing the old man and escaping; the younger brother
    worries that they might get lost, while the older says he remembers the way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a hunt in the mountains, the boys kill the old man, take meat and parched
    corn meal, and travel north away from the main trail along the mountain ridge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers reach a clearing near houses, wait until dark because they are
    dressed like Cherokee, and sit behind a large tree by a river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The older brother recognizes women fetching water, identifies one as their
    mother, and both brothers run out with the Seneca hailing-shout.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother recognizes her two sons and calls for the village to dance for
    the dead come to life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ganogwioeoñ leads a party against the Cherokee, enters the first town alone,
    and hides in the âsi under wood at a house occupied by an old woman and her granddaughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ganogwioeoñ threatens the awake girl with death if she screams and tells her
    to bring the chief's daughter to him in the morning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girl brings the chief's daughter to Ganogwioeoñ's hiding place; he kills
    and scalps the chief's daughter, gives a scalp yell, flees pursuers, kills one
    pursuer, and is captured after his bow breaks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Two women of the tribe, each described with two snakes tattooed on her lips,
    decide that Ganogwioeoñ's feet will be burned, grains of corn put under the skin,
    and that he will be chased and beaten with clubs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ganogwioeoñ is stripped, his feet are burned, a bark rope is tied around his
    waist, and he is made to run between two lines of people holding clubs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ganogwioeoñ pulls the rope away from the old man holding it, breaks through
    the line, runs away, and hides at night in a hollow log while naked, unarmed,
    and badly injured in the feet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Unseen strangers call Ganogwioeoñ their friend, tell him he is not the same
    as dead, lick his feet, and lie on each side of him inside the log to keep him
    warm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the morning the helpers lick his feet again, tell him to go to an old bark
    shelter, and after they disappear he finds a knife, an awl, and a flint hidden
    there by his men two years earlier.
  category: sequence
  evidence_refs:
  - ev:8
