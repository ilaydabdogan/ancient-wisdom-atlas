literal_observations:
- id: obs:1
  text: A treaty defined the boundaries of a seven-million-acre tract granted by the
    1828 treaty to correspond with the Cherokee country in Indian Territory, with
    an additional two-mile strip later annexed to Kansas.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tract in the northeastern corner between Neosho or Grand River and the Missouri
    line was set apart for the Seneca and several other removed tribal remnants.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The western outlet established by the 1828 treaty was reestablished as a westward
    extension from the bounded seven-million-acre tract.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The first treaty article guaranteed the Cherokee nation a perpetual western
    outlet and free, unmolested use of country west of the tract as far as United
    States sovereignty and soil rights extended.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the saline or salt plain fell within the outlet, the United States reserved
    the right to allow other tribes to obtain salt there in common with the Cherokees.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The treaty article stated that letters patent would be issued by the United
    States for the guaranteed lands as soon as practicable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The third article canceled, at Cherokee request, the 1828 provision by which
    the government was to give the Cherokee a set of laws and a surveyor for individual
    land surveys when desired.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After differences with the Creeks were adjusted, the Arkansas Cherokee occupied
    the guaranteed territory and were later joined by expatriated kinsmen from the
    east.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: By tacit agreement, some Creeks who had settled within Cherokee bounds were
    permitted to remain.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Several Uchee families, described as belonging to an incorporated tribe of
    the Creek confederacy, had resided at the later Tahlequah site and remained there
    until they were swept off by smallpox about sixty years before the account.
  category: sequence
  evidence_refs:
  - ev:6
