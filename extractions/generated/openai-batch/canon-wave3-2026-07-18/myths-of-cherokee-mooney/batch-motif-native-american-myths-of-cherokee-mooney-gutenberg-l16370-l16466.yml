- id: obs:11
  text: When the brother is finally brought inside the mountain, the interior is described
    as like a great townhouse.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: Tsul`kalû' is heard only as a voice from the air and says the brother cannot
    see him until he puts on a new dress.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: The unseen voice instructs the people to enter the townhouse, fast seven days,
    not come out, and not raise the war whoop; on the seventh day he will bring new
    dresses so they can see him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The people begin the fast because they want to see Tsul`kalû', who is described
    as owning all the game in the mountains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: One man from another settlement secretly leaves at night to eat during the
