  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: On the seventh morning the people hear a great roar compared to thunder or
    rocks rolling down Tsunegûñ'yi.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:17
  text: The outsider becomes frightened, runs out of the townhouse, and shouts the
