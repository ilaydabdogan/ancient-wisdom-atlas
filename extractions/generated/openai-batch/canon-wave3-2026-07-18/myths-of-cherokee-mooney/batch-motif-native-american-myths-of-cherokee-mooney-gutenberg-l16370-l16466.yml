  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After four years the sister tells her mother and brother that if they come
    early they can see her husband, but when they arrive he and his family have already
    gone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Freshly killed deer are left hanging on drying poles in such quantity that
    the whole settlement can take meat.
  category: object
  evidence_refs:
