canonical_text:
  quote: ''
  summary: A young man follows the trail of his sister, her giant husband, and their
    children to Tsunegûñ'yi, where he finds a cave-like entrance into a mountain dwelling.
    He repeatedly meets his sister outside and later receives instructions from the
    unseen Tsul`kalû' that the people must fast seven days in the townhouse and avoid
    leaving or raising the war cry in order to receive new dresses and see him. One
    outsider breaks the fast and shouts the war cry, after which Tsul`kalû' withdraws
    and says they can never see him.
  language: English
  quote_policy: summarized
