canonical_text:
  quote: ''
  summary: The passage describes treaty articles requiring Cherokee surrender and
    removal from Arkansas lands, United States inducements for Cherokee families east
    of the Mississippi to emigrate west, Cherokee opposition to an unauthorized Washington
    treaty, ratification followed by renewed forced removal of western Cherokee, some
    Cherokee movement across Red River into Texas, the actions of Tahchee/Dutch, and
    a later Creek-Cherokee boundary settlement through treaties at Fort Gibson.
  language: English
