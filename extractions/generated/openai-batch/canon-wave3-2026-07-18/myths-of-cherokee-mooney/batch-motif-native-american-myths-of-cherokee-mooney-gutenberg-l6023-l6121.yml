literal_observations:
- id: obs:1
  text: Article 9 provides for the Fort Gibson military reservation, and article 7
    requires the Cherokee to surrender and remove from their Arkansas lands within
    fourteen months.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Article 8 presents the western Cherokee agreement as a preliminary step toward
    removal of Cherokee remaining east of the Mississippi and offers emigrating heads
    of families goods, compensation, transportation support, provisions, and payments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Washington treaty was signed by several delegates, including Sequoya,
    and four delegates signed in Cherokee characters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Western Cherokee law made unauthorized negotiation of land sale or exchange
    a capital offense, and the delegates had acted without council authority.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Cherokee national council declared the delegates guilty of fraud and deception,
    declared the treaty null and void, and requested permission to send an authorized
    delegation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Despite Cherokee opposition, the treaty was ratified within three weeks, and
    the western Cherokee were forced to abandon cabins and plantations and move again
    into the wilderness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A considerable number of Cherokee refused to submit to the treaty or trust
    guarantees, crossed Red River into Texas, and joined the Cherokee colony located
    there by The Bowl under Mexican jurisdiction.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tahchee, also called Tatsi or Dutch, moved to Texas, later recrossed Red River,
    raided the Osage, defied a capture reward by attacking near Fort Gibson, escaped
    after leaping a precipice, and later returned under amnesty to settle on the Canadian.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Creek emigrants had settled on lands later assigned to the western Cherokee,
