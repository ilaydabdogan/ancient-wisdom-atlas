canonical_text:
  quote: ''
  summary: Historical account of the Cherokee at the end of the Cherokee war, subsequent
    peace negotiations, imperial and colonial treaty councils, accelerating settler
    emigration across mountains, repeated land cessions and boundary changes, forced
    treaties under protest, and Bartram's later account of Cherokee hospitality and
    inhabited towns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Cherokee are described as severely reduced by war, with burned towns,
    wasted fields and orchards, nearly exhausted ammunition, dead warriors, fugitives,
    smallpox, starvation, and factional division.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Cherokee people are described as fugitives in the mountains, hiding in
    caves, eating roots, or killing horses for food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ata-kullakulla came to Charleston, a treaty of peace was made, and the war
    ended.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that an estimated Cherokee population of at least 5,000
    warriors had been reduced to about 2,300 men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: A Virginian force under Colonel Stephen reached the Great Island of the Holston
    and was met by a Cherokee delegation that sued for peace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lieutenant Henry Timberlake returned with the Cherokee to their towns, spent
    several months there, and later conducted a delegation of chiefs to England.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the 1763 peace between England and France, a great council at Augusta
    included chiefs and principal men of southern Indians, Captain John Stuart, and
    colonial governors, and concluded a treaty of mutual peace and friendship.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Emigration across the mountains increased despite efforts to restrain it,
    and a series of treaty cessions attempted to establish a permanent barrier between
    Indians and white settlement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Royal proclamation and later treaties set or altered boundaries, while successive
    cessions reduced Cherokee hunting grounds in Virginia, West Virginia, and Kentucky.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that transactions called treaties were forced on native
    proprietors, who resisted and signed under protest after assurances that no further
    demands would be made.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Intruders had settled on the tracts before purchases were made, refused to
    withdraw across established boundaries, and in the Watauga and upper Holston area
    turned a temporary lease into permanent occupancy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: William Bartram toured the Cherokee country before the Revolution and described
    the Indians as hospitable and friendly, listing forty-three inhabited towns.
  category: attribute
  evidence_refs:
  - ev:7
