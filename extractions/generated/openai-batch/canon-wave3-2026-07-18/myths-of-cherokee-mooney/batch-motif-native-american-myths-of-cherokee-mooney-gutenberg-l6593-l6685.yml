canonical_text:
  quote: ''
  summary: The passage recounts late nineteenth-century federal efforts to obtain
    Cherokee and other Indian Territory lands through commissions, cession agreements,
    allotment policy, restrictions on tribal leasing, pressure from settlers and claimants,
    and surveys interpreted as steps toward ending communal holdings and tribal self-government.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1889 a federal commission later known as the Cherokee Commission was appointed
    to negotiate with the Cherokee and other Indians for cession of land titles and
    claims west of the ninety-sixth degree of longitude.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cherokee Commission made a cession proposition to Chief J. B. Mayes for
    the Cherokee outlet or strip, and the proposition was declined because the Cherokee
    constitution forbade its consideration.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other tribes were approached for similar purposes, and the commission continued
    until cession and allotment agreements had been made with many tribes in what
    is now Oklahoma.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Attorney-General denied the right of Indian tribes to lease lands without
    permission of the Government.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Cherokee had been receiving annual grazing-lease income from the strip,
    but President Harrison's 1890 proclamation ordering cattlemen to vacate cut off
    that income and made the strip practically valueless to them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Cherokee national council accepted a second proposition for cession of
    the Cherokee strip on January 4, 1892; the agreement included payment terms, a
    statement reaffirming local self-government, congressional ratification, and opening
    of the strip by presidential proclamation in 1893.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: An 1893 act authorized appointment of the Dawes Commission to negotiate with
    the Cherokee, Choctaw, Chickasaw, Creek, and Seminole for extinguishment of tribal
    land titles by cession, allotment, division in severalty, or other agreed method,
    with the stated aim of enabling future statehood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports at least 200,000 noncitizens in Indian Territory compared
    with 70,500 citizens of the five civilized tribes; it distinguishes permitted
    noncitizens from illegal squatters and unrecognized claimants.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Cherokee Nation test case was decided against claimants and in favor of
    the Cherokee, but removal of intruders was delayed and in 1896 citizenship-claim
    decisions were shifted from the Indian government to the Dawes Commission.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In 1895 the commission was enlarged, a survey of Indian Territory had begun,
    and the agent described the survey as proceeding with or without Indian consent
    and as a step toward the overthrow of communal holdings.
  category: sequence
  evidence_refs:
  - ev:5
