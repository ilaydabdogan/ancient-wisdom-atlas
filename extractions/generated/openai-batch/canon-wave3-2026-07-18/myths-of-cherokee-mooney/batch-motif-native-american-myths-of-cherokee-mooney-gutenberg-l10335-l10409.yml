canonical_text:
  quote: ''
  summary: 'A historical and linguistic note describes Sequoya''s development of the
    Cherokee syllabary: his early pictographic experiments, his analysis of Cherokee
    into syllables, his use and invention of characters, outside assessments of the
    system''s efficiency, and practical limits in pronunciation and dialect representation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage places Sequoya's syllabary within a comparative account of systems
    of symbolic thought representation and states that it ranks second after the author's
    own alphabetic system.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sequoya is described as working without formal instruction, without knowledge
    of English, and as devoting twelve years to the syllabary.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sequoya first tried to create one symbol for each Cherokee word and accumulated
    thousands of carved or scratched characters on bark before abandoning that plan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sequoya analyzed Cherokee speech and concluded that many words could be formed
    from combinations of a little over one hundred distinct syllables.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sequoya formulated symbols for syllables, reusing some characters from an
    English spelling book, modifying others, and inventing additional characters,
    making eighty-five in all.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A special character for the hissing sound when initial in a syllable reduced
    the needed number of characters from the first projected total.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Quoted commentators state that Cherokee pupils could learn to read and write
    Cherokee much faster than English once they learned the characters.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that written Cherokee usually has one letter per syllable
    in theory, but actual pronunciation includes vowel elision, sound variations,
    and dialect differences not fully represented in writing.
  category: attribute
  evidence_refs:
  - ev:6
