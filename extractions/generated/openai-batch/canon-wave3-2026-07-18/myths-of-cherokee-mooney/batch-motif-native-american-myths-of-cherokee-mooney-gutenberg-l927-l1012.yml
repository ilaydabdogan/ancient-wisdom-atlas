canonical_text:
  quote: ''
  summary: Historical account of De Soto's route through mountain country associated
    by the author with Cherokee territory, including arrival at Guaxule, local hospitality,
    the queen's escape with pearls, river travel to Canasoga and Chiaha, reports of
    Chisca mines, a failed scouting trip, and variant chronicle descriptions of the
    mineral region.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: De Soto turned west, crossed a very high mountain range identified by the
    author as probably the Blue Ridge, descended to an opposite-flowing stream, and
    experienced cold weather in the mountains despite it being late May.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After several days of travel, the expedition arrived at Guasili or Guaxule,
    where the chief and principal men came out to welcome them wearing skin robes
    and feather headdresses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before the expedition reached Guaxule, the queen escaped with three enslaved
    people of the Spaniards, was last heard going back to her country with one runaway
    as husband, and took a small box of pearls that De Soto had intended to take from
    her later.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Guaxule is described as a large town surrounded by small mountain streams
    that united to form a large river used by the Spaniards after leaving.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Guaxule, the Indians received the white men with kindness and hospitality,
    gave the Spaniards 300 dogs for food, and lodged principal officers in the chief's
    house or townhouse on a high hill identified by the author with the Nacoochee
    mound in Cherokee territory.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: From Guaxule, De Soto sent runners ahead to notify the chief of Chiaha of
    his approach so that sufficient corn would be ready when he arrived.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Leaving Guaxule, the expedition went down the river identified as the Chattahoochee,
    reached Canasoga or Canasagua, and was met by Indians bearing baskets of berries.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The expedition continued down the growing river through uninhabited disputed
    territory between Cherokee and Creeks, was met by messengers, and was escorted
    to Chiaha after leaving Cherokee country.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Chiaha, a chief confirmed reports of mines in Chisca, describing a melting
    of copper and another softer metal of similar color; the author places the province
    northward in a mountain region where native copper occurs.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Two soldiers were sent on foot with Indian guides to find Chisca; according
    to the Elvas chronicler, they reported rough high mountains, poor corn supply,
    an unprofitable poor town, and returned with a dressed buffalo skin given by Indians
    there.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Garcilaso's narrative gives a different impression, reporting fertility, copper
    mines with signs of gold and silver, repeated feasting and hospitality, while
    the passage concludes that De Soto made no further effort to reach the Cherokee
    mines and continued westward after a month in the mountain region.
  category: speech
  evidence_refs:
  - ev:11
