canonical_text:
  quote: ''
  summary: The passage gives notes on Cherokee tobacco, dagûl`kû geese, the story
    of the journey to the sunrise, Cherokee beliefs about Sun and Moon, a cannibal
    Sun comparison from Thompson River traditions, funerary co-burial comparisons,
    and the widespread motif of a rising and falling sky vault or closing sky boundary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tobacco is described as American in origin, sacred among nearly all tribes,
    and important in deliberative or religious ceremonies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The original tobacco of the Cherokee and other eastern tribes is identified
    as wild tobacco, distinguished by the Cherokee as “old tobacco,” and called “real
    tobacco” by the Iroquois.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dagûl`kû is identified as the American white-fronted goose, described
    as bluish-white, formerly common in the low country toward the coast, rare in
    the mountains, and heard flying south at night near the end of September.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The story called “The journey to the sunrise” is said to have parallels in
    many tribes and to have been obtained from John Ax with additional details from
    Swimmer and Wafford.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Swimmer’s version, when the travelers came near the sunrise they found
    a race of black men at work; the note also states that the story does not mention
    the travelers reaching the ocean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: According to the Payne manuscript as summarized here, Cherokee anciently believed
    that the world, the first man and woman, and the Sun and Moon were created by
    beneficent beings from an upper world, who then returned there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same Cherokee account says the Sun and Moon were left as deputies to finish
    and rule the created world and could both be addressed as creator in prayer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage reports varying Cherokee statements about whether Sun or Moon
    was male or female, and says Sun and Moon are sister and brother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Swimmer is said to have known a tradition that the Sun had a cannibal habit
    and, in human form, was once seen killing and devouring human beings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Thompson River tradition cited in the passage says the Sun was formerly
    a man and a cannibal, killed people during his travels, hung their bodies at home,
    ate earlier bodies, and was finally induced to abandon the habit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The “same grave” incident is compared by the author to an adventure in the
    voyage of Sinbad the Sailor and to the sacrifice of a wife at her husband’s funeral
    in parts of the Orient, Africa, and Hindu suttee.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that the nearest known American approach to the funeral
    co-burial custom was on the lower Columbia and adjacent northwest coast, where
    a slave was frequently buried alive with the corpse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A rising and falling sky vault at the horizon that crushes those trying to
    go beyond is said to occur in the mythologies of the Iroquois, Omaha, Sioux, Tillamook,
    and other tribes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Omaha story summarized here, travelers reach the end of the sky where
    it goes down into the ground; one fails to jump across and is carried under the
    ground, while the others continue behind the other world and return.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the Tillamook myth summarized here, six men reach a lightning door that
    opens and closes rapidly and forcefully; one man is caught on the return and injured
    by the descending sky.
  category: sequence
  evidence_refs:
  - ev:10
