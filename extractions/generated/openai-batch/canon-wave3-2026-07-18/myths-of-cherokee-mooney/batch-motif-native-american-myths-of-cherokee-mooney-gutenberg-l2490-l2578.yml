  summary: The passage recounts the 1785 Hopewell treaty between the Cherokee and
    the United States, disputes over land and boundaries, continuing intrusions and
    hostilities, attacks around the Cumberland settlements, and a later 1783 Nashville-area
    treaty that reduced but did not end Indian inroads.
  language: English
