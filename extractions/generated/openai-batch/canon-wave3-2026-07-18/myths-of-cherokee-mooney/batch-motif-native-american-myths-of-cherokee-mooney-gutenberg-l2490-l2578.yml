literal_observations:
- id: obs:1
  text: A treaty for peace and boundary delimitation was concluded at Hopewell in
    South Carolina on November 28, 1785, with nearly one thousand Cherokee in attendance
    and United States commissioners present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The treaty was signed by thirty-seven Cherokee chiefs and principal men representing
    nearly as many towns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: North Carolina and Georgia protested confirmation of some lands to the Cherokee
    because those lands had already been appropriated as bounty lands for state troops
    without Cherokee consent.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Cherokee complained that 3,000 white settlers occupied unceded land between
    the Holston and the French Broad.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The treaty left some Cherokee towns undisturbed while giving the country east
    of the Blue Ridge, with the Watauga and Cumberland settlements, to the whites.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The treaty boundary was described through ridges, rivers, forks, and regional
    landmarks including the Holston, Blue Ridge, Coosa River, Tennessee River, and
    western Alabama line.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hostilities were to cease, the Cherokee were taken under United States protection,
    and the proceedings ended with a distribution of presents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The treaty did not bring complete peace or security because intruders remained
    on Indian lands and aggressions and reprisals continued.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cherokee, Creek, Chickasaw, and northern Indian attacks on the Cumberland
    settlements began in spring with the aim of driving intruders from their lands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On January 15, 1781, a band of Indians approached Freeland's station at night,
    unfastened the barred gate, and was driven off after Robertson alerted the garrison.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: On April 2, a large body of Cherokee used a decoy to draw part of the Nashville
    fort garrison into an ambush; dogs released from inside the fort forced the attackers
    to retire, though they carried away five American scalps.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A June 1783 treaty near Nashville with Chickasaw, Cherokee, and Creek chiefs
    diminished but did not completely stop Indian inroads.
  category: sequence
  evidence_refs:
  - ev:9
