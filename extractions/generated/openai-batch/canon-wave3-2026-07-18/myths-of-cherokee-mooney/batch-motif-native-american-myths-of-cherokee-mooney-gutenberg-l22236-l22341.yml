canonical_text:
  quote: ''
  summary: The passage is a set of notes and parallels to Cherokee animal myths. It
    mentions a Jicarilla Fox and Bear-monster episode; variants about Rabbit's fate
    and a parallel in Harris's 'The Origin of the Ocean'; notes on Mink, Mole, Terrapin,
    Groundhog dance, animal migration, Wolf and Dog, and bird tribes; and several
    named comparative parallels from Creek, Catawba, Omaha, Cheyenne, West African,
    and other Cherokee materials.
  language: English
  quote_policy: summarized
