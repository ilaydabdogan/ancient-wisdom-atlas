literal_observations:
- id: obs:1
  text: The passage says 1793 began with attacks along the Tennessee frontier, mostly
    attributed to Chickamaugas and Creeks, with some Shawano involvement, while Cherokee
    towns on Little Tennessee remained peaceable.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A party commanded by Captain John Beard attacked friendly chiefs assembled
    for a conference at Echota, killing about fifteen Indians, including chiefs and
    two women, and wounding Hanging-maw.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the Echota attack, two hundred warriors took up arms for revenge, but
    appeals restrained them; Hanging-maw also refrained from revenge to avoid bringing
    war on his people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports that Beard was arrested but acquitted after a trial described
    as a farce.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Despite a territorial prohibition on invasion of Indian country, a mounted
    company under Colonels Doherty and McFarland crossed the mountains, destroyed
    six middle towns, and returned with scalps and prisoners.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A force of Creeks and Cherokee under John Watts and Doublehead advanced toward
    Knoxville but redirected to attack Cavitts station after hearing the sunrise gun.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The occupants of Cavitts station surrendered on a promise of exchange, but
    Doublehead's warriors killed them except for a boy saved by John Watts; other
    chiefs tried to prevent the killing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: General Sevier led seven hundred men into the Indian nation, burned Ustanali,
    defeated Cherokee and Creek defenders near Etowah, and destroyed nearby towns,
    provisions, and cattle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During Sevier's absence, Indians made an inroad on the French Broad, killing
    and scalping a woman and a boy, and later killing and scalping a man near a burial
    procession.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In 1794 the Tennessee Territorial assembly memorialized Congress, asking for
    stronger frontier protection and a declaration of war against the Creeks and Cherokee,
    and listing alleged killings, captivity, property destruction, slave-taking, and
    horse theft since the treaty of Holston.
  category: speech
  evidence_refs:
  - ev:7
