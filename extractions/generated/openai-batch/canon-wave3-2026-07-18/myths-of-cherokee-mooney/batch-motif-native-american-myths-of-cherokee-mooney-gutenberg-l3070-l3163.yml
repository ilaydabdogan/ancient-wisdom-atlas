  summary: Historical prose describes 1793-1794 frontier violence involving Cherokee,
    Chickamauga, Creek, Shawano, Tennessee territorial authorities, militia expeditions,
    attacks on settlements, retaliatory destruction of towns, and a Tennessee memorial
    to Congress requesting frontier protection and war.
