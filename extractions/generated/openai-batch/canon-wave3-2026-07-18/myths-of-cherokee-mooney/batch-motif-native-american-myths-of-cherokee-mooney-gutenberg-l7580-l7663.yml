canonical_text:
  quote: ''
  summary: The passage gives a late nineteenth-century historical account of Eastern
    Cherokee leadership, federal recognition and administrative neglect, an 1881 removal
    invitation from the western Cherokee Nation, Quaker-supported education contracts
    and schools, travelers' descriptions of reservation life, and the 1882-1884 census
    that some East Cherokee later disputed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lloyd R. Welch succeeded Kâ'lahû' as chief, served about five years, died
    shortly after reelection, and is credited with reconciling factions and opposing
    fraudulent white claimants and mischief makers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Government, through Special Agent John A. Sibbald, recognized Welch's
    authority as principal chief and recognized a constitution adopted by the band
    in 1875.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: N. J. Smith, previously clerk of the council, was elected to fill Welch's
    unexpired term and served until the fall of 1890.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1881 Commissioner Price reported that the East Cherokee lacked an agent
    or superintendent and that factional feuds were worsening administrative difficulties.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A visiting delegation from the Cherokee Nation west invited the East Cherokee
    to remove to Indian Territory; the Indian Office encouraged the project, and 161
    people removed during the year at Government expense.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Friends entered a contract in 1881 to establish an industrial school and
    common schools for the East Cherokee for ten years, funded partly by trust-fund
    interest and partly by the Friends.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thomas Brown began school work in 1881 with teachers sent by the Indiana Friends,
    and H. W. Spray later expanded and continued the educational work before being
    reappointed government agent and superintendent in 1898.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Travelers described the reservation population as living in ways nearly indistinguishable
    from neighboring whites, with crops, fruit, livestock, moccasins, homespun clothing,
    pipes, baskets, and visible school influence among children.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The agency was reestablished in 1882, Joseph G. Hester was appointed to take
    a new census, and the completed census listed 2,956 Cherokee east of the Mississippi.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Although the East Cherokee council approved the census, a large portion of
    the band refused to recognize it as authoritative because they claimed many enrolled
    persons had no Cherokee blood.
  category: relationship
  evidence_refs:
  - ev:9
