literal_observations:
- id: obs:1
  text: Yonaguska is described as a prophet, reformer, and chief who, at about sixty
    years old, underwent severe sickness ending in a trance; his people mourned him
    as dead, and he awoke after twenty-four hours.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After awakening, Yonaguska announced that he had gone to the spirit world,
    talked with deceased friends and with God, and been sent back with a message to
    the Indians.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the trance episode, Yonaguska's words were treated as inspired; he stopped
    drinking and organized his tribe into a temperance society.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a council, Yonaguska said God had allowed him to return to earth to warn
    his people and banish whisky; a pledge was written and signed by the chief and
    council.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yonaguska resisted pressure to remove westward, saying Indians were safer
    among rocks and mountains and that Cherokee happiness belonged to the country
    where nature had planted them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yonaguska counseled peace and friendship with white people while holding to
    his Indian faith and remaining suspicious of missionaries; after hearing part
    of Matthew in Cherokee, he remarked on the conduct of white people despite long
    possession of the book.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Near death, Yonaguska was carried into the Soco townhouse, gave a last talk,
    commended Thomas as chief, warned against leaving their own country, wrapped his
    blanket around himself, lay back, and died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Yonaguska was buried beside Soco under a rude mound of stones; he left two
    wives, property, an enslaved man named Cudjo, and a daughter named Katâ'lsta,
    described as the last conservator of pottery art among the East Cherokee.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Yane'gwa, called Big-bear, preceded Yonaguska in authority, signed treaties,
    and held a 640-acre reservation later known as the Big-bear farm.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tsunu'lahûñ'ski, also called Junaluska, was a warrior; after failing to exterminate
    the Creeks as boasted, he announced his result at a dance with a word meaning
    'I tried, but could not,' which became the burden of a song and the basis of his
    name.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tsunu'lahûñ'ski distinguished himself at Horseshoe Bend, later expressed regret
    connected with Jackson and removal, returned from exile to his old home, received
    citizenship and land, and died near Robbinsville.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Tsunu'lahûñ'ski is said to have tracked a kidnapped Indian girl to Charleston
    and regained her freedom by proving through microscopic examination that her hair
    lacked negro characteristics.
  category: action
  evidence_refs:
  - ev:10
