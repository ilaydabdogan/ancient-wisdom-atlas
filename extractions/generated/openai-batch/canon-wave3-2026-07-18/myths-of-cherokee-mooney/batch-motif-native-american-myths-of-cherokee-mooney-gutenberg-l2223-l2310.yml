  quote: ''
  summary: The passage recounts Revolutionary-era frontier warfare involving North
    Carolina and Virginia volunteers, Cherokee and Chickamauga towns, British efforts
    to enlist Native allies, Donelson’s river migration toward Nashville, attacks
    near the Chickamauga towns and the Suck, a smallpox outbreak, and the mountain
    militia response that culminated at Kings Mountain.
