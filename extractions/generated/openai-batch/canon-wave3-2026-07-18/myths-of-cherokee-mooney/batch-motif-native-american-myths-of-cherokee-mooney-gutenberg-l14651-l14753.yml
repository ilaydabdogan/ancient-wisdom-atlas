  confidence: high
  cautions: The transformation is punitive or consequential rather than a voluntary
    shapeshift.
- id: motif:2
  label: serpent vengeance demands human satisfaction
  taxonomy_refs:
  - serpent
  - sacrifice
  basis: Rattlesnakes identify a killed snake as their chief, demand the killer's
    wife as satisfaction, and send the Black Rattlesnake to bite her.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames the act as satisfaction for a slain chief; it does
    not explicitly identify it as a formal cult sacrifice beyond the rattlesnakes'
    own wording.
