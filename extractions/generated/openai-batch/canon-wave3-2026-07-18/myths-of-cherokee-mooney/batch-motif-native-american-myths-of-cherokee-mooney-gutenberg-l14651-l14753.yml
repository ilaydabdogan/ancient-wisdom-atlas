canonical_text:
  quote: ''
  summary: The passage recounts a hunter who violates a food taboo and is transformed
    into a water snake; a narrative in which rattlesnakes demand satisfaction after
    a woman kills their chief, resulting in her death and the gift of a protective
    healing song; and ethnographic notes on Cherokee beliefs and practices involving
    frogs, tortoises, turtles, and lizards.
  language: English
  quote_policy: summarized
