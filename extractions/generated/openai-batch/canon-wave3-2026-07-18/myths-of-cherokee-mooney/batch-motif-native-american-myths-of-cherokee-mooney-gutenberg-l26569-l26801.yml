canonical_text:
  quote: ''
  summary: A glossary segment defining Cherokee terms, personal names, place names,
    animal names, and etymologies. It includes entries for eagle and deer terms, Little
    Deer as a mythic chief of the Deer tribe, named informants and historical figures,
    possible animal-name etymologies, a rain-presaging lizard called a rain-maker,
    and mussel-based place names.
  language: English with Cherokee lexical items
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The entry for awâ'hili defines it as eagle, particularly Aquila chrysætus,
    distinguished as the pretty-feathered eagle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The entry for a`wi' defines it as deer and lists derived animal and plant
    terms, including bearded deer for goat, deer eye for Rudbeckia or black-eyed Susan,
    great deer for elk, and woolly deer for sheep.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The deer mocker or deer bleat is described as a whistle used by hunters to
    call a doe by imitating the cry of a fawn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A`wi' Usdi', translated Little Deer, is identified as the mythic chief of
    the Deer tribe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ayâ'sta is translated The Spoiler and identified as a prominent woman and
    informant on the East Cherokee reservation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ayuhwa'si is explained as meaning a savanna or meadow and as the name of former
    Cherokee settlements on or near the Hiwassee river.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: A`yûñ'ini is translated Swimmer and identified as a principal priest and informant
    of the East Cherokee who died in 1899.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Canacaught is identified as a Lower Cherokee chief in 1684, called the great
    Conjurer, and the entry says the name may possibly be kanegwâ'ti, the water-moccasin
    snake.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Cuhtahlatah is described as a Cherokee woman noted in the Wahnenauhi manuscript
    for bravery in battle; the entry adds that the proper form of the name may connect
    with a word for wild hemp.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Dagan`tû means he makes it rain and names a small lizard whose cry is said
    to presage rain; the entry also gives a plural form glossed as they make it rain
    or rain-maker.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Dagûl`kû is identified as the American white-fronted goose, with a note that
    the name may be onomatopoeic.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Dagû'na is defined as fresh water mussel and also as a variety of face pimples;
    related place names include Mussel place and Mussel-liver place, the latter identified
    as the Cherokee name for the site of Nashville.
  category: setting
  evidence_refs:
  - ev:12
