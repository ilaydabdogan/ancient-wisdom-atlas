- id: obs:2
  text: The bear council discusses scarce mountain food, receives a report from two
    bear messengers about abundant chestnuts and acorns in the low grounds, and prepares
    for a dance led by Kalâs'-gûnahi'ta, Long Hams.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bears take the hunter's bow and arrows to see whether they can use men's
    weapons, but their long claws catch the string and the arrows fall to the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the bear's own cave, the bear knows the hunter is hungry and produces chestnuts,
