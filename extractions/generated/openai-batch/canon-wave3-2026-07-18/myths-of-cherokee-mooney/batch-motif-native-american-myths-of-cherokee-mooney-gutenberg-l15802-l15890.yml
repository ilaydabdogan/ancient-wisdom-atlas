canonical_text:
  quote: ''
  summary: A hunter follows a bear into mountain caves, first to a bear council and
    then to the bear's home. The bear feeds him by producing food from its body, and
    the hunter spends the winter there, growing bear-like hair and nature. The bear
    foretells its own killing by settlement hunters and instructs the hunter to cover
    the blood with leaves. After the hunters kill, skin, and quarter the bear, the
    hunter looks back and sees the bear rise from the leaves and return to the woods.
    The hunter is supposed to remain hidden and fasting for seven days to lose his
    bear nature, but his wife takes him home early and he dies. The passage ends with
    the heading and opening location note for the next tale, concerning Tlanusi'yi,
    'The Leech place.'
  language: English
  quote_policy: summarized
