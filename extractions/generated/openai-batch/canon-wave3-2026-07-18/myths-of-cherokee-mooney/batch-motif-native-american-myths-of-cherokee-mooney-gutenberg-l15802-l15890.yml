  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hunters and dogs find the cave, kill the bear with arrows, drag it outside,
    skin it, cut it into quarters, and find the lost hunter at the back of the cave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before leaving, the hunter piles leaves over the place where the bear was
    cut up; after looking back, he sees the bear rise from the leaves, shake itself,
    and go into the woods.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Near the settlement, the hunter says he must be shut up unseen, without food
    or drink, for seven days and nights until the bear nature leaves him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The hunter's wife obtains him after four or five days, before the seven-day
