canonical_text:
  quote: ''
  summary: 'The passage describes Cherokee rattlesnake lore: the rattlesnake''s name
    and mythic origin, its association with Thunder, taboos and rites around killing
    it, vengeance by snake kin, protective plants and remedies, ritual handling of
    its body, and medical or protective uses of its teeth, rattles, flesh, oil, and
    roasted body.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rattlesnake is called utsa'nati, glossed as “he has a bell,” referring
    to its rattle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A referenced myth says the rattlesnake was once a man and was transformed
    into its present shape to save the human race from extermination by the Sun.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old men call the rattlesnake “the Thunder's necklace,” and killing one is
    described as destroying a prized ornament of the thunder god.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A formula addressed to the Little Men, sons of the Thunder, asks them to take
    the disease snake because it is what they adorn themselves with.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The rattlesnake is regarded as chief of the snake tribe and is feared and
    respected.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Few Cherokee are said to kill a rattlesnake except under necessity, and the
    killing must be atoned for by asking pardon of the snake ghost, directly or through
    a priest using a formula.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: If pardon is not obtained, the relatives of the dead snake may send one of
    their number to track and fatally bite the offender.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Campion, called “rattlesnake's master,” is said to frighten rattlesnakes and
    is used by doctors against rattlesnake bite.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Chewed linn bark is applied to the bite, and the linn tree is said to be immune
    from lightning.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Rattlesnake rattles, teeth, flesh, and oil are valued for occult or medical
    uses, and certain priests kill snakes for this purpose with rites and pardon formulas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Outsiders seeking the secret knowledge are told that a new initiate is likely
    to be bitten so the snakes can test whether he has learned the formula correctly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: When a rattlesnake is killed, its head must be cut off and buried an arm's
    length deep, and its body must be hidden in a hollow log.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: If the dead rattlesnake is left exposed, angry snakes are said to send heavy
    rain, overflow streams, and tell deer and ginseng to hide from hunters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: A rattlesnake tooth from a snake killed by a priest with proper ceremonies
    while lying east to west is used to scarify patients before medicine is applied.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Before using the tooth, the doctor prays over it until the tooth is said to
    become alive and ready for the operation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Rattles are worn on the head, and ball players sometimes eat rattlesnake flesh
    to become more terrible to opponents, though it is said to make them cross to
    their wives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Oil from the lower half of the rattlesnake body is used for rheumatism and
    sore joints, and the doctor who prepares it must eat the snake flesh.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: During some epidemics, a roasted rattlesnake was kept in the house; the father
    chewed a small piece with water and spat it on others to preserve them from contagion.
  category: action
  evidence_refs:
  - ev:8
