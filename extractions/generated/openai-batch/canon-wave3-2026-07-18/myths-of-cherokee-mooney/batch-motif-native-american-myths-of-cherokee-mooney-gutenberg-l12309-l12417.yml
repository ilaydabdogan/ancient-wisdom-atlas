canonical_text:
  quote: ''
  summary: The passage gives Cherokee explanations for eclipses, names and prayers
    connected with Sun and Moon, Thunder beings and rainbow taboos, the nature of
    stars, an encounter with two star-creatures, the origin of the Pleiades and the
    pine from seven boys, and the origin of the Milky Way from meal dropped by a fleeing
    dog.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An eclipse of the sun or moon is explained as a great frog in the sky trying
    to swallow it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In former times people gathered, fired guns, and beat a drum to frighten the
    frog away so the sun would be restored.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Common people call both Sun and Moon Nûñda, while priests use separate names;
    people sometimes ask the Moon to prevent rain or snow.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The great Thunder and his two sons live far west above the sky vault; lightning
    and rainbow are described as their beautiful dress.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Priests pray to the great Thunder and call him the Red Man because red is
    the brightest color of his dress.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other Thunders live lower down in cliffs, mountains, and under waterfalls,
    travel on invisible bridges, and are said to plot mischief.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Pointing at the rainbow is forbidden because the pointer's finger is said
    to swell at the lower joint.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Stars are variously described as balls of light, human, or living creatures
    covered with luminous fur or feathers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A hunting party saw two large star-like lights moving along a distant ridge
    on successive nights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The hunters found two round creatures covered with fine fur or downy feathers,
    with small terrapin-like heads and sparks flying from their feathers in the breeze.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The hunters kept the creatures for several days; at night they shone like
    great stars, and on the seventh night they rose like balls of fire until they
    became two points of light in the sky.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Seven boys spent their time playing the gatayû'sti game, and their mothers
    rebuked them by cooking game stones with the corn and offering the stones as dinner.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The boys, angered by their mothers' treatment, danced around the townhouse
    and prayed to the spirits; as they circled, their feet left the earth and they
    rose into the air.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: One mother pulled one boy down with a gatayû'sti pole, but he struck the ground,
    sank into it, and the earth closed over him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The other six boys ascended to the sky and are identified as the Pleiades,
    called Ani'tsutsa, The Boys.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The mother of the boy who sank into the ground wept at the spot until it was
    damp; a green shoot grew there into the pine, which is said to share the bright
    nature of the stars.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: People at a corn mill found meal stolen at night, discovered dog tracks, and
    caught a dog from the north eating from the bowl.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: After being whipped, the dog ran north with meal dropping from its mouth,
    leaving the white trail now seen as the Milky Way.
  category: sequence
  evidence_refs:
  - ev:11
