comparison_claims:
- id: claim:1
  claim: The passage explicitly states that the frog explanation of eclipses is known
    not only to the Cherokee but also to the Creeks and other tribes, supporting a
    cautious intertribal same-motif comparison.
  claim_level: same_motif
  target: 'Creeks and other tribes: eclipse caused by a great frog trying to swallow
    the sun or moon'
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives no separate Creek or other tribal variant details
    and does not establish historical transmission or common inheritance.
