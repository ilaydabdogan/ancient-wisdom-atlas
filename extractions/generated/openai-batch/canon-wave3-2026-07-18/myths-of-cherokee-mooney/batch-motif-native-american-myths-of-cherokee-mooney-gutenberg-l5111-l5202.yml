canonical_text:
  quote: ''
  summary: 'The passage recounts Cherokee political resistance to removal in 1834-1835:
    a memorial to Congress, councils at Red Clay, factional treaty negotiations, rejection
    of the Ridge treaty, federal pressure to attend New Echota negotiations, and the
    arrest or seizure of Cherokee leaders, papers, manuscripts, and the national press.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Cherokee delegation headed by John Ross sent an earnest memorial to Congress
    on May 17, 1834.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The memorial is described as showing the Cherokee attachment to the land of
    their fathers and their refusal to accept assurances of prosperity beyond the
    Mississippi.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A council at Red Clay debated the question of removal in a tumultuous and
    excited meeting.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: John Walker, Jr., an advocate of emigration, was assassinated from ambush
    after returning from the Red Clay council.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the Cherokee were nearly worn out by constant struggle
    against a fate from which they saw no escape.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Two rival Cherokee delegations arrived in Washington in February 1835: the
    Ross-led national party and the Ridge-led party prepared to negotiate for removal.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A treaty negotiated with the Ridge party proposed that the Cherokee cede their
    whole eastern territory and remove west in exchange for money, western acreage,
    and compensation for depredations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Schermerhorn compact was signed with an express stipulation that it would
    require approval by the Cherokee Nation in full council before having binding
    force.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In October 1835, the Ridge treaty was rejected by the Cherokee Nation in full
    council at Red Clay.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A notice called Cherokee people to meet commissioners at New Echota and stated
    that those who failed to attend would be counted as assenting to any treaty made.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before the Ross delegation departed for Washington, John Ross was arrested,
    his private papers and council proceedings were taken, and he was held without
    charge before release.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: John Howard Payne was seized with letters and manuscripts, and the Cherokee
    Phoenix was suppressed with its office plant seized.
  category: action
  evidence_refs:
  - ev:8
