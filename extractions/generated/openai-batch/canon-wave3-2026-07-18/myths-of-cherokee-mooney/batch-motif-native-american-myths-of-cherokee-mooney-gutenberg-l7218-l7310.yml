  summary: The passage describes Salola as a self-taught Cherokee blacksmith and maker
    of tools, firearms, and grist mills; then recounts federal census and payment
    actions concerning East Cherokee removal funds, disputed enrollments, the roles
    of agents such as Mullay, Siler, Chapman, Thomas, and Terrell, and the approach
    of Civil War-era Confederate efforts to involve the East Cherokee.
  language: English
