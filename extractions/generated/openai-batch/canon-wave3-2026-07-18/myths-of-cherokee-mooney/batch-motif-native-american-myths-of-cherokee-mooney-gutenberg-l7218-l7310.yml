  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: In 1855 Congress directed per-capita payment of the removal fund to the East
    Cherokee if North Carolina assured their permanent residence; the assurance came
    in 1866, and the funds were later applied to land purchases and titles.
  category: sequence
  evidence_refs:
  - ev:5
