- id: obs:5
  text: In 1848 Congress approved a census of Cherokee who had remained east of the
    Mississippi after Removal and provided for a per-capita removal and subsistence
    fund.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: J. C. Mullay completed an 1848 census of Cherokee in North Carolina, Tennessee,
