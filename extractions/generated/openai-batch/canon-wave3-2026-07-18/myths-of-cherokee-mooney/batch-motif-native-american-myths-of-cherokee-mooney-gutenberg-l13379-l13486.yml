candidate_motifs:
- id: motif:1
  label: Captive tricks enemies into choosing the escape medium
  taxonomy_refs:
  - trickster_boundary
  basis: Terrapin rejects pot and fire as ineffective, begs against the river, and
    then escapes through the water when the Wolves throw him in.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not call Terrapin a trickster; the label is based on
    the described strategy.
- id: motif:2
  label: Captive uses dance instruction to create an escape opening
  taxonomy_refs:
  - trickster_boundary
  basis: Groundhog persuades his captors to learn a new dance, uses successive trees
    to move nearer his hole, and escapes when the wolves are out in front.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames the action as the origin of a dance and an animal trait,
    not as an abstract trickster category.
- id: motif:3
  label: Animal bodily marks explained by narrated events
  taxonomy_refs: []
  basis: Terrapin's shell scars, Groundhog's short tail, and Groundhog's unpleasant
    head smell are each explained by events or punishments in the narrated material.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The head-smell story is explicitly not fully recorded in the passage.
- id: motif:4
  label: Animal council sends scout during famine and migrates after food report
  taxonomy_refs: []
  basis: Animals and birds hold council during a mast famine, send Pigeon to scout,
    and move to the low country after she reports abundant mast.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available taxonomy reference exactly matches this migration-and-scout
    episode.
- id: motif:5
  label: Brother rescues wounded brother from serpent attack by magic
  taxonomy_refs:
  - serpent
  - sibling_pair
  basis: The northward wolf finds his brother nearly dead beside a great greensnake,
    kills the snake with magic, and heals his brother.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage identifies the wolves as brothers but does not develop a broader
    twin or sibling-cycle structure.
- id: motif:6
  label: Slow messenger superseded by direct magical healing
  taxonomy_refs: []
  basis: Kana'ti sends Terrapin for a western doctor, but the magic wolf heals his
    brother long before the doctor arrives because Terrapin is slow and the doctor
    must prepare roots.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a small narrative function within the episode rather than a fully
    developed independent motif.
