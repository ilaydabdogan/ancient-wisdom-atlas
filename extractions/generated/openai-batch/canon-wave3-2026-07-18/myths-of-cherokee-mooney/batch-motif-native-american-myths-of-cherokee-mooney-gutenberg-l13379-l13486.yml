canonical_text:
  quote: ''
  summary: 'A sequence of Cherokee animal tales: Possum and Terrapin encounter a wolf
    at a persimmon tree; Terrapin uses the dead wolf''s ears as spoons and escapes
    revenge by diving into a river, with a variant explaining shell scars. Groundhog
    escapes seven wolves by teaching a dance and losing his tail, with a note on the
    smell of his head. Animals migrate from famine after Pigeon scouts food in the
    low country. Kana''ti''s hunting wolves confront a great greensnake; one wolf
    kills it magically and heals his wounded brother before a doctor arrives.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Possum and Terrapin go together to hunt persimmons and find a tree full of
    ripe fruit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Possum throws down a large persimmon, or in some versions a bone, which lodges
    in a wolf's throat and chokes him to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Terrapin cuts off the dead wolf's ears and later uses one of them as a spoon
    for kanahe'na gruel at houses.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: News spreads that Terrapin killed the Wolf and used his ears as spoons, after
    which Wolves follow Terrapin's trail, capture him, and hold council over what
    to do with him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Wolves consider boiling Terrapin in a clay pot, burning him in fire, and
    finally throwing him into the deepest hole in the river.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Terrapin laughs at the pot and fire threats, begs against being thrown into
    the river, and then escapes by diving under the water and coming up on the other
    side.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A variant says Terrapin struck a rock in the river, broke his back in many
    places, sang a medicine song about sewing himself together, and kept scars on
    his shell.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Seven wolves catch Groundhog, and Groundhog offers to sing a new dance for
    them before they kill him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Groundhog uses seven trees in turn during the dance, moving nearer to his
    hole under a stump before running into it.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The foremost wolf pulls off Groundhog's tail as he enters the hole, and the
    tale states that Groundhog's tail has been short ever since.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that other animals gave Groundhog's head an unpleasant
    smell to punish an insulting remark in council, but the fuller story is not recorded
    there.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: During a famine of mast in the mountains, animals and birds that lived on
    mast send Pigeon to the low country to look for food.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Pigeon reports finding mast on the ground in the low country, and the animals
