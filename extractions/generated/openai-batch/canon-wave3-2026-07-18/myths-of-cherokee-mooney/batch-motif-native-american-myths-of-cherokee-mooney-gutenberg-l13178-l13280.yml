canonical_text:
  quote: ''
  summary: The passage contains the end of a Rabbit-and-Wolves escape episode, the
    story of Rabbit visiting Flint and causing Flint to explode into scattered pieces,
    the story explaining how Deer received horns after Rabbit was caught cheating
    in a race, and the opening of a story in which Rabbit begins a revenge trick involving
    a grapevine after Deer won the horns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rabbit instructs the Wolves to stamp their feet during his song, dances progressively
    nearer the field, and escapes with a jump while they are focused on stamping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wolves pursue Rabbit; Rabbit climbs inside a hollow stump, spits into
    the eye of a wolf looking in, and remains in the stump after the Wolves leave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tawi'skala, identified as Flint, lives in the mountains, and the animals hate
    him because he had helped kill many of them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The animals discuss removing Flint but fear approaching his house until Rabbit
    volunteers to go and try to kill him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rabbit reaches Flint's house, speaks with him, studies the place for a plan,
    and invites Flint to visit him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rabbit tells Flint his house is in a broom-grass field near the river, coaxes
    Flint to come for supper at once, and the two go down the mountain together.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Near Rabbit's hole, Rabbit makes a fire, serves supper on the grass, and cuts
    a mallet and wedge from heavy sticks with his knife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After confirming that Flint is asleep, Rabbit drives a sharp stake into Flint's
    body with the mallet and runs toward his hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Flint explodes into pieces that fly about; the passage states this accounts
