  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the beginning of the Deer story, Deer has no horns; Deer is described as
    a great runner and Rabbit as a great jumper, and the animals arrange a race with
    antlers as the prize.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Before the race, Rabbit asks to inspect the bushes, enters the thicket, and
    secretly gnaws and pulls bushes away to clear a road.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A messenger finds Rabbit clearing the road and reports this to the other animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The animals accuse Rabbit of cheating, find the cleared road, exclude him
    from the race, give the horns to Deer, and say Rabbit may cut bushes for a living.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After Deer wins the horns, Rabbit feels sore, resolves to get even, stretches
