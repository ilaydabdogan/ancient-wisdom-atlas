  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Smoky Mountains, hunters heard a turkey gobble; some wanted to go toward
    it, while others suspected a ruse and advised reconnaissance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Cherokee scout found a man posted in a large tree making the turkey call
    to decoy hunters toward a concealed Shawano war party.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Cherokee scout shot the man in the tree, shouted for all to be killed,
