canonical_text:
  quote: ''
  summary: 'The passage recounts Cherokee-Shawano war traditions: raiding approaches,
    two episodes in which animal calls signal or enact ambushes, a Cherokee warrior-medicine-man''s
    capture of a Shawano prisoner, the widening and conclusion of war with Shawano
    and Delawares, and the raid on Tikwali''tsi, where a Cherokee conjurer locates
    an ambush, some men ignore his advice and die, and a counterattack pursues the
    raiders into the Smoky Mountains.'
  language: English
