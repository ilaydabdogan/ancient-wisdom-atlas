  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: All but one of the Cherokee hunters left the fire and concealed themselves
    after hearing the cry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The remaining Cherokee hunter threw heavy logs on the fire, lay on his blanket,
