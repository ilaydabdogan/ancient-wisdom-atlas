literal_observations:
- id: obs:1
  text: The author states that there is no large island in either the Coosa or the
    Chattahoochee and concludes that a chronicle's island was likely bottom land temporarily
    cut off by backwater from a freshet.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage gives parallel examples of flood-altered landscapes: The Slue
    near Flint River, a swollen Alabama river that delayed the Spaniards six days,
    and Lederer''s mapped ''Ushery lake,'' later explained as Catawba River overflow.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An engineering informant describes a former large mound on the east bank of
    the lower Chattahoochee and another mound on the west or Alabama bank, both partly
    submerged during extreme freshets.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lower Chattahoochee description includes a broad floodplain, wooded sloughs
    indicating an old river bed, river-made land, and remains of Jennies island, with
    no island visible at ordinary river stages.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the area around the lower Chattahoochee mounds and island
    remains was considered full of Indian lore and was presented as a possible clue
    for future study of the ground.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Chiaha is identified as the first town of the province of Coça, while Coste/Costehe/Acoste
    is identified with Kasi`ta or Cusseta, despite differences among the Spanish accounts
    about its distance and position.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Coste the Spaniards crossed the river and continued westward through towns
    said to be subject to the cacique of Coça until reaching the town of Coça itself.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage identifies Coça/Kusa/Coosa as an ancient Upper Creek capital and
    distinguishes two towns of that name known at different periods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A town name variously spelled Ytaua, Ytava, or Itaba is cautiously connected
    with I'tawa', Etowah, or Hightower; the Cherokee are said to regard this as a
