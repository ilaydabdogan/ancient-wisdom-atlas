  quote: ''
  summary: The passage describes Cherokee accounts of medicine warriors who change
    shape, use protective war medicine, move underground, or place their lives in
    treetops; historical anecdotes of self-sacrificing and women warriors; and explanations
    for mounds and townhouse locations by rivers.
  language: English
