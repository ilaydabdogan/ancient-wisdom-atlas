literal_observations:
- id: obs:1
  text: Some warriors are said to have medicine that lets them change shape at will
    in order to escape enemies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A medicine warrior returns to find his settlement attacked and chooses to
    rescue his grandmother across the river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The warrior changes a mussel shell into a canoe, puts his grandmother into
    a small gourd, changes himself into a swamp woodcock, and later both resume natural
    shape.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dasi`giya'gi, also called Shoe-boots, is described as a strong Cherokee warrior
    with magic power and war medicine consisting of an uktena scale and a large turtle
    shell.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In war, Dasi`giya'gi puts the scale into water, bathes with it, burns part
    of the turtle shell, and draws a black line around his men with the coal; he and
    his men are said not to be killed or wounded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some warriors are said to have medicine that lets them dive under the ground
    as if under water, emerge among enemies, kill and scalp one, and return underground
    to their friends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some war captains are said to put their lives in treetops during battle so
    that enemy blows cannot kill them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Shawano captain who knows the same medicine orders shots into the branches
    above a Cherokee leader, after which the Cherokee leader dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: During a cabin siege, one besieged warrior offers to die alone by drawing
    the attackers' fire so that his companions can escape while the attackers reload.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The besieged warrior rushes out in a zigzag course, is shot and killed, and
    the other warriors escape to the woods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A Cherokee woman who killed her husband's slayer is said to have been allowed
    to join the warriors in the war dance with gun and tomahawk.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Cuhtahlatah, after seeing her husband the chief fall, takes his tomahawk,
    shouts, and attacks the enemy, rallying the retreating Cherokee to victory.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At Waya gap, soldiers kill a figure behind a tree and find it was a woman
    painted and striped like a warrior, armed with bow and arrows, and already wounded
    in the thigh.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: 'The passage gives alternate explanations for mounds: some say another people
