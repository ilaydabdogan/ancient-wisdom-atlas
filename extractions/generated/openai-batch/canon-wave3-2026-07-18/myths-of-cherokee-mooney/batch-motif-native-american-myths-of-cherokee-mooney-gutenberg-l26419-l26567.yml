canonical_text:
  quote: ''
  summary: Glossary entries define Cherokee words, names, places, beings, and objects,
    including a Lightning spirit called the Red Man, ghosts, a sweat lodge, a mythic
    lake, mountain terms, fire-related beings and places, cedar place-names, and entries
    for Cherokee people and chiefs.
  language: English with Cherokee terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aquone is identified as a post office on the Nantahala river in Macon County,
    North Carolina, at the site of former Fort Scott, and is probably a corruption
    of a Cherokee term meaning river.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Asga'ya Gi'gagei is glossed as the "Red Man" and identified as the Lightning
    spirit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Asgi'na is glossed as a ghost, either human or animal, and is often rendered
    "devil" because ghosts are commonly supposed to be malevolent.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The âsi is described as a Cherokee and southern-tribal sweat lodge and occasional
    winter sleeping apartment, built low of logs, covered with earth, and associated
    with a smoldering fire inside.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Astu'gatâ'ga is a Cherokee lieutenant's name that may be rendered "Standing
    in the doorway" and implies that the man himself is the door or shutter.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Atagâ'hi is glossed as "Gall place" and identified as a mythic lake in the
    Great Smoky Mountains; the name is also applied to part of the Great Smoky range
    around Thunderhead Mountain and Miry Ridge.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ata'-gûl`kalû', a noted Cherokee chief, has a name rendered "Leaning-wood"
    and is described in a quoted Bartram description as small, slender, delicate,
    and of superior abilities.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A`tâhi'ta is abbreviated from a place-name meaning "Place where they shouted"
    and is identified with Waya Gap on a ridge west of Franklin, North Carolina.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Â'tali means mountain in composition, while forms for a mountain in situ are
    also given.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Â'tali-gûli', meaning "it climbs the mountain" or "mountain-climber," is the
    ginseng plant and is also called "Little Man" in sacred formulas.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ata'lûñti'ski is a chief's name denoting one who throws a living object, such
    as an enemy, from a place such as a precipice.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Atasi' or atasû' is glossed as a war club.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: A`tla'nuwa' means "Tla'nuwa hole" and is the Cherokee name of Chattanooga,
    originally applied to a bluff on the south side of the Tennessee River.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:14
  text: Atsi'la means fire, with a Lower dialect form atsi'ra.
  category: object
  evidence_refs:
  - ev:14
- id: obs:15
  text: Atsil'-dihye'gi means "Fire Carrier," is apparently the Cherokee name for
    the will-o'-the-wisp, and its compound form is plural, meaning "it carries fires."
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:16
  text: Atsil'-sûñ`ti is fleabane and its name means material with which to make fire.
  category: object
  evidence_refs:
  - ev:16
- id: obs:17
  text: Atsil'-tlûñtû'tsi means "Fire panther" and is identified as a meteor or comet.
  category: attribute
  evidence_refs:
  - ev:17
- id: obs:18
  text: Atsi'la-wa'i is a mountain sometimes known as Rattlesnake Knob near Cherokee,
    North Carolina.
  category: setting
  evidence_refs:
  - ev:18
- id: obs:19
  text: A'tsina' means cedar, and A'tsina'-k`ta'ûñ means "Hanging cedar place," a
    Cherokee name for the old Taskigi town on the Little Tennessee River.
  category: setting
  evidence_refs:
  - ev:19
- id: obs:20
  text: Atsûñ'sta`ti'yi means "Fire-light place" and refers to fire-hunting deer in
    a river at night.
  category: action
  evidence_refs:
  - ev:20
