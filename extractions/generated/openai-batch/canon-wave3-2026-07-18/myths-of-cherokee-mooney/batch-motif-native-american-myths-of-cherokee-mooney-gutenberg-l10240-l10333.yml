  quote: ''
  summary: The passage gives historical notes on Samuel Austin Worcester’s missionary,
    printing, translation, and publication work among the Cherokee, including his
    arrest by Georgia authorities and later work at Park Hill. It then summarizes
    and quotes Cherokee legal provisions making unauthorized land-sale negotiations
    punishable by death, declaring absconding violators outlaws, and requiring council
    and chief approval for binding treaties. It also notes a similar Creek law and
    the deaths of McIntosh and Ridge under such laws.
