canonical_text:
  quote: ''
  summary: The passage contains the end of a Seneca-Cherokee war narrative in which
    Hatcinoñdoñ is captured, sentenced to be burned, rescued by an old woman who says
    she was once a frog he saved, hides in a hollow tree in the water, kills three
    sleeping hunters, and rejoins his party. It then gives the Cherokee tradition
    of Hemp-carrier, who leads a vengeance party after Iroquois raiders kill women
    and children; the party counts out a matching number of scalps near a Seneca townhouse,
    escapes pursuit, and Hemp-carrier is rewarded. The passage closes with the beginning
    of a story about eight Seneca peacemakers, whose peace proposal is interrupted
    when one Cherokee chief requires them to join a war party, leading to the capture
    of their leader, The Owl.
  language: English
  quote_policy: summarized
