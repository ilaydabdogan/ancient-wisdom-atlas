canonical_text:
  quote: The defenders of the Horseshoe had been exterminated.
  summary: 'Historical account of the Battle of Horseshoe Bend: a Cherokee rear attack
    helps American and Tennessee troops breach the Creek defense; Creek warriors attempting
    escape by river are killed or captured; casualties are counted; the Cherokee contribution
    and leadership are discussed; Junaluska later states that he would have killed
    Jackson had he known Jackson would drive the Cherokee from their homes.'
