canonical_text:
  quote: ''
  summary: The passage summarizes Cherokee-Creek hostility, conflicting territorial
    claims, Creek-derived place names in former contested territory, and Cherokee
    traditions of conflict with the Creeks and Shawano. It recounts a tradition in
    which the Creeks secretly aided the Shawano while professing friendship, the Cherokee
    killed a visiting Creek party at a dance, war followed, the Creeks withdrew southward,
    and Cherokee forces later used a decoy and ambush at an island settlement on the
    Tennessee River. Bullhead is named as a Cherokee leader renowned for bravery and
    strategy.
  language: English
  quote_policy: summarized
