  summary: Editorial notes discuss the Cherokee Spear-finger myth, variants and parallels,
    including stone armor, awl-like fingers, human-liver-eating monsters, vulnerable
    spots revealed by helpers, place-name associations, kinship-language notes, and
    a comparison to European changeling belief.
