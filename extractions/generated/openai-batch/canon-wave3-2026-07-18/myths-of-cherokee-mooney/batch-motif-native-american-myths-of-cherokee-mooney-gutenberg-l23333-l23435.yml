literal_observations:
- id: obs:1
  text: The passage identifies U`tlûñ'ta, the Spear-finger, as one of the most noted
    Cherokee myths and says it is well known both east and west.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Ten Kate's version, the monster's stone coat of mail breaks apart when
    the monster is killed, and the fragments are kept as amulets.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some myth tellers conflate U`tlûñ'ta with Nûñ'yunu'wi, saying the two monsters
    were husband and wife, lived together, were dressed in stone, had awl fingers,
    and ate human livers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same note distinguishes the pair by saying the husband waylaid hunters
    while the female partner attended to children.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Creek parallel called 'The Big Rock Man' has a stony monster killed after
    Rabbit advises the people to shoot him in the ear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the British Columbia comparison, Coyote transforms himself into an Elk
    and covers his body with a hard shell that functions as armor, except for a small
    hole under the throat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The transformed Elk attacks people with antlers and trampling; arrows glance
    off his armored body until Meadow-lark reveals the vulnerable throat-hole and
    a hunter shoots that spot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The name U`tlûñ'ta is glossed as meaning that he or she has something sharp,
    here referring to the awl-like finger.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A place on Little Tennessee river is called U`tlûñtûñ'yi, 'Sharp-finger place,'
    because U`tlûñ'ta was said to frequent it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nûñyû'-tlu`gûñ'i, 'Tree rock,' is described as a notable monument-shaped rock
    resembling a standing tree trunk.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Whiteside mountain is linked to U`tlûñ'ta by the statement that a former projecting
    rock was part of a great bridge she attempted to build across the valley.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The notes say old Cherokee bottom lands were known for abundant strawberries
    and other wild fruits.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The notes explain that Cherokee grandchild terms are specialized and that
    kinship terms are commonly used to express affection or respect.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The note on 'Taking the appearance' states that it corresponds closely with
    European folk-belief in fairy changelings.
  category: other
  evidence_refs:
  - ev:10
