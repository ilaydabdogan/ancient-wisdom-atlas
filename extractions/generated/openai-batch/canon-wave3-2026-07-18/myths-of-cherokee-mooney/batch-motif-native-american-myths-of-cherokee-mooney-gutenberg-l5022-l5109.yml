  text: The annuity previously paid to the Cherokee national treasurer was ordered
    distributed per capita instead, affecting funds used for schools and the national
    press.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Federal troops were sent into Cherokee country with orders to prevent mining
    unless authorized by Georgia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Cherokee Nation, through John Ross as principal chief, brought an injunction
    suit against Georgia in the United States Supreme Court.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Supreme Court dismissed the Cherokee Nation's first suit on the ground
