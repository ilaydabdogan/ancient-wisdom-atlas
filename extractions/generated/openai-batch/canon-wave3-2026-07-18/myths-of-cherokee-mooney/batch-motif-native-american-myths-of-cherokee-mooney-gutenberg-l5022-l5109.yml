  text: The Cherokee appealed to President Jackson after Georgia's first act but were
    told that no protection would be afforded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Repeated efforts were made to persuade the Cherokee to remove or to cede lands,
