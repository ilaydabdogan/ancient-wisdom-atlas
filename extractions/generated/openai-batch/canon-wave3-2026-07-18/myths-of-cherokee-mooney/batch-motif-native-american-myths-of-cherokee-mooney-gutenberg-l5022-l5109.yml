canonical_text:
  quote: ''
  summary: 'The passage recounts Cherokee resistance to removal between 1829 and 1834:
    appeals to President Jackson, legal challenges against Georgia, arrests of missionaries
    under Georgia law, Worcester''s Supreme Court case, Georgia''s refusal to release
    him, a Cherokee public fast proclaimed by John Ross, discussion of alternative
    migration or land settlements, and protest against a removal treaty negotiated
    with a small Cherokee committee.'
  language: English
  quote_policy: summarized
