canonical_text:
  quote: ''
  summary: Mooney introduces notes and parallels to Cherokee myths, then summarizes
    a missionary-reported Cherokee migration legend that he says is heavily mixed
    with the Biblical Moses story. The account includes a leader named Wâsi, divided
    water, wilderness travel, a mountain episode, sacred fire from heaven, clan markers,
    white and red standards, four river crossings, serpent attacks, the earth opening,
    water from a rock spring, a grapevine bridge tradition, and a brief tradition
    of a walled town with flat-roofed houses.
  language: English
  quote_policy: summarized
