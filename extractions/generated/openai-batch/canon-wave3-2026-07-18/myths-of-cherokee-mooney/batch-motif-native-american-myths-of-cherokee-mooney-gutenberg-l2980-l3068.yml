  summary: Historical prose recounting 1792 frontier diplomacy, militia mobilization,
    an attack on Buchanan's station, protective blockhouses and patrols, and Captain
    Samuel Handley's capture, adoption into the Wolf clan, and safe return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Secretary of War directed Governor Blount to convene Chickasaw, Choctaw,
    and Cherokee chiefs at Nashville to seek their warriors' service against northern
    tribes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs were described as giving assurances of friendship and declaring
    a desire for peace, while attacks on the Tennessee frontier continued.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The five lower Cherokee towns on the Tennessee, identified as the Chickamauga
    and headed by John Watts, were reported to have declared war against the United
    States.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A force estimated at three to six hundred warriors, including Creeks, was
    reported to have moved against settlements, and militia were called out in eastern
    Tennessee and on the Cumberland.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At about midnight on September 30, 1792, several hundred Chickamaugas and
    other Cherokee, Creeks, and Shawano attacked Buchanan's station south of Nashville.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Families had gathered inside the stockade, with fewer than twenty able-bodied
    men present; alarmed cattle gave the garrison warning in time to close the gate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The attackers rushed the stockade, tried to set it on fire, and fired through
    port holes; one attacker climbed onto the roof with a lighted torch and was shot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The attack was repulsed; the assailants withdrew with dead and wounded, left
    hatchets, pipes, and other spoils, and John Watts was among the wounded, while
    no one in the fort was injured.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A system of garrisoned blockhouses and regular scout patrols was arranged
    along the French Broad, and Sevier prevented the burning of Chilhowee and a neighboring
    Cherokee town.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Captain Samuel Handley, separated from his men, encountered a warrior raising
    a hatchet; Handley seized the weapon and called out a Cherokee word glossed as
    'friend,' after which the warrior lowered his arm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Handley was taken to Willstown, adopted into the Wolf clan, used to write
    a peace letter to Governor Blount, and later sent home safely under an escort
    of eight warriors without ransom.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
