  text: 'The East Cherokee are described as having a disputed legal status: wards
    of the government, United States citizens, and in North Carolina a corporate body
    under state law.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: They pay some civic obligations and use local courts, but do not pay poll
    tax, do not receive county pauper assistance, and cannot freely contract or alienate
    their lands.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Under their tribal constitution, they are governed by a principal chief, an
    assistant chief, an executive council, and elected councilors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The annual council is held in October at Cherokee, with proceedings in the
    Cherokee language and records kept in both the Cherokee alphabet and English.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jesse Reid, also named Tse'si-Ska'tsi or “Scotch Jesse,” is identified as
    the present chief.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people are described as peaceable, law-abiding, kind, hospitable, and
    largely self-supporting through fields, orchards, fish traps, animals, hunting,
    gathered medicinal plants, fruit, and honey.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nearly all the men and some women are said to be able to read and write their
    own language.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people wear what the passage calls civilized costumes; occasional moccasins
