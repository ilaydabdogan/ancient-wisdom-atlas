canonical_text:
  quote: ''
  summary: 'Historical account of post-Civil War Cherokee Nation events: recognition
    of missionaries, the death and memorialization of John Ross, incorporation and
    settlement of other Native groups, railway construction, Cherokee-language publishing
    and schooling, East Cherokee removal efforts and litigation, and increasing pressure
    from intruders, allotment policy, and armed boomers seeking Cherokee lands.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Reverend Evan Jones and John B. Jones had followed the Cherokee into exile
    and were admitted to Cherokee citizenship by vote of the Nation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The act recognizing Evan Jones and John B. Jones states that they had done
    their work well.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: John Ross was in Washington on business for his people and died there on August
    1, 1866, at age seventy-seven after fifty-seven years of service to his Nation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Cherokee Nation passed a memorial resolution for John Ross; his people
    remained faithful to him, and he died as officially recognized chief of the Nation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: John Ross's body was brought back and interred in the territory of the Nation,
    and one district was named Cooweescoowee after his Indian name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Delawares from Kansas removed to Indian territory in 1867 and became citizens
    of the Cherokee Nation; Shawano followed in 1870.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Osage, Kaw, Pawnee, Ponca, Oto and Missouri, Tonkawa, and the captive Nez
    Percés of Joseph's band were settled or temporarily located on the Cherokee strip
    or western extension.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: In 1870 the Missouri, Kansas and Texas railway was constructed through Cherokee
    Nation lands under a government-ratified agreement, becoming the first railroad
    to enter that country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the same year, the Cherokee Advocate resumed publication, and John B. Jones
    began preparing schoolbooks in the Cherokee language and alphabet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In 1881 a Cherokee Nation delegation invited the East Cherokee remaining in
    North Carolina to remove and incorporate on equal terms with the western Cherokee
    Nation; 161 persons removed during the year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The East Cherokee later sued for a proportionate division of Cherokee funds
    and interests, but their claim was finally decided adversely by the Supreme Court.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: By 1889 the Cherokee Nation supported seminaries, an orphan asylum, primary
    schools, and mission schools with large annual appropriations for school purposes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Pressure increased to open Indian territory to white settlement, and many
    intruders settled on lands of the five civilized tribes despite repeated appeals
    for their removal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Government policy moved toward reducing or breaking up Indian reservations,
    allotting land in severalty, extending United States court jurisdiction, and opening
    surplus lands to white settlement.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Cherokee and other civilized tribes protested without avail, while armed
    boomers organized to invade and seize the Cherokee outlet and other unoccupied
    portions of Indian territory.
  category: action
  evidence_refs:
  - ev:8
