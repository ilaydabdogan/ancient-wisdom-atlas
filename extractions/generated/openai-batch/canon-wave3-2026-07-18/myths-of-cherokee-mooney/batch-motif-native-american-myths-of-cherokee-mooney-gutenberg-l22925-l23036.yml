  summary: Notes describe Cherokee divination with the Ulûñsû'ti, traditions concerning
    Âgan-uni'tsi's search for the Uktena and the origin of the Ulûñsû'ti talisman,
    neighboring horned-serpent tradition claims, named places associated with Uktena
    stories, the Red Man as a lightning spirit, beliefs about dangerous powerful talismans,
    several serpent beings, the Âsi hot-house, and a note that the Snake Man myth
    concerns tabu observance.
