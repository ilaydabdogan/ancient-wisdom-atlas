canonical_text:
  quote: ''
  summary: The passage recounts a Shawano raid at Kanuga, the Cherokee pursuit guided
    by the conjurer Kâ'lanû, the crossing of the Ohio, and the rescue of captives.
    It then begins the story of the false warriors of Chilhowee, who kill Cowee townspeople,
    falsely claim a victory over the Shawano, are exposed by a recognized gun, and
    become the target of Cowee reprisal.
  language: English
  quote_policy: summarized
