literal_observations:
- id: obs:1
  text: A tradition among old traders in upper Georgia said that a large tract had
    been won by the Cherokee from the Creeks in a ballplay; the passage says the story
    lacked living local Indian corroboration in 1890 and may have had a veiled meaning
    because Cherokee usage could make ballplay a figure for battle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says there is no good ground for Bartram's statement that the
    Creeks dispossessed the Cherokee of the region between the Savannah and the Ocmulgee
    in the historic period, and suggests he probably had the Uchee in mind.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Adair is reported as saying that, near the end of the last war between the
    Cherokee and Creeks, the Creeks defeated the Cherokee in an engagement and sent
    women and boys against them contemptuously.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Adair attributes the war to the 1749 killing of adopted Creek relatives by
    northern Shawano who had been guided and then sheltered by the Cherokee.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The battle of Tali'wa is described as a traditional account of a battle around
    1755 or a few years later, involving about five hundred Cherokee and twice as
    many Creek warriors; the Cherokee first fell back, rallied, returned to attack,
    and routed the Creeks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the Tali'wa defeat, the Creeks are said to have abandoned the upper
    portion of Georgia and adjacent Alabama to the Cherokee, including a town on Nottely
    river whose fields were occupied by Cherokee migrants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Yuchi or Uchee are described as a distinct linguistic stock whose territory
    lay below the Cherokee country and near the Creeks; they were gradually dispossessed
    by whites, incorporated with the Creeks about 1740, and retained separate identity
    and language.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rattling-gourd testified that, before Removal, some Yuchi lived scattered
    among the Cherokee, had no separate settlements, spoke their own language, and
    in some cases also spoke Cherokee and Creek.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A few Yuchi found at Tahlequah after its establishment as Cherokee capital
    are said to have died in the 1840 smallpox epidemic, and their graves were still
    pointed out in 1891.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ramsey states that a small tribe of Uchees near the Hiwassee was nearly exterminated
    in a battle with the Cherokee at the Uchee Old Fields and that survivors retreated
    to Florida and joined the Seminoles; the passage says there is no other authority
    for this statement.
  category: speech
  evidence_refs:
  - ev:7
