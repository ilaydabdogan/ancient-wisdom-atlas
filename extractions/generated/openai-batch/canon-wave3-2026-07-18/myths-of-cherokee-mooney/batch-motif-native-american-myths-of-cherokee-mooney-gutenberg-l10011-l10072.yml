- id: obs:1
  text: Spinning wheels and looms are said to have been introduced shortly before
    the Revolution.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wahnenauhi manuscript reports that an Englishman named Edward Graves brought
    the first spinning wheels and looms among the Cherokee from England and taught
    his Cherokee wife to spin and weave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage cautions that the manuscript writer may have confused Edward Graves
    with a young Englishman employed by Agent Hawkins in 1801 to make wheels and looms
    for the Creeks.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wafford reported knowing an old man named Tsi'nawi, a wheelwright on Young-cane
    creek of Nottely river, who was reputed to have made the first spinning wheel
    and loom among the mountain Cherokee, or perhaps in the Nation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In 1785 commissioners reported that some Cherokee women had recently learned
    to spin and that many wanted instruction in raising, spinning, and weaving flax,
    cotton, and wool.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A 1791 treaty provision supplied the Cherokee with farming tools, and by 1801
    an agent reported the wheel, loom, and plow in pretty general use at the Cherokee
    agency.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Return Jonathan Meigs was named to commemorate an incident in which his mother
    called back her lover as he was mounting his horse to leave after believing he
    had been finally refused.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Meigs served in the Revolutionary War, marched with Arnold against Quebec,
    was captured, later raised a regiment, and received congressional thanks and a
    sword for the attack at Sag Harbor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Meigs served as Cherokee agent from 1801 until his death, negotiated several
