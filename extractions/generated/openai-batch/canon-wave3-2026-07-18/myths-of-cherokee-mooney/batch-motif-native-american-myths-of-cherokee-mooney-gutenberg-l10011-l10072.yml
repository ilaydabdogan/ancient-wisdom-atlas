canonical_text:
  quote: ''
  summary: Historical notes describe the introduction and spread of spinning wheels,
    looms, farming tools, and plows among the Cherokee, including reports about Edward
    Graves, Tsi'nawi, treaty commissioners, and Agent Hawkins. The passage then gives
    a biographical note on Colonel Return Jonathan Meigs, including the origin of
    his name, his Revolutionary War service, and his later work as Cherokee agent.
  language: English
  quote_policy: summarized
