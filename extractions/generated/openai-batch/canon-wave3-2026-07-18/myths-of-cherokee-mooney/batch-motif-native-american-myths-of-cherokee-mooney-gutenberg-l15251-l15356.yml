canonical_text:
  quote: ''
  summary: A Cherokee narrative describes U`tlûñ'ta, Spear-finger or Stone-dress,
    a stone-skinned liver-eating ogress who can change shape and impersonate kin.
    She haunts mountain regions, lures or secretly stabs victims, and is eventually
    trapped by the people in a covered pit. Their arrows fail against her stone skin.
    A titmouse sings from a tree; the hunters interpret its call as advice to shoot
    at her heart, but this fails, and they cut off the bird's tongue before it flies
    into the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a terrible ogress or woman monster lived in the mountains,
    ate human livers, and could take any shape or appearance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In her proper form she resembled an old woman but had stone-hard skin and
    a long stony forefinger used for stabbing; she was called Spear-finger and Stone-dress.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Spear-finger could lift immense rocks and cement them together, and she began
    a rock bridge through the air before lightning shattered it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: She ranged through mountain stream-heads, dark passes, and trail gaps looking
    for victims.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: She sometimes approached children as an old woman, coaxed them as grandchildren,
    combed a child's hair until the child slept, stabbed the child with her hidden
    awl finger, and ate the liver.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: She could enter a house by taking the appearance of a family member and could
    stab a person without a visible wound or immediate pain, after which the victim
    weakened and died.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Cherokee people burned mountain leaves in the fall to gather chestnuts,
    smoke could draw Spear-finger toward their camps.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A solitary hunter once saw her in proper form, heard her sing about eating
    liver, and fled silently.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A council decided to trap Spear-finger in a covered pitfall near a large brush
    fire, expecting smoke to attract her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: She came along the trail disguised as a known old woman, fell into the pitfall,
    and then showed her true form.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Hunters shot arrows at her in the pit, but the arrows broke against her stony
    covering while she taunted them and tried to climb out.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A titmouse sang from a tree; the hunters interpreted the sound as meaning
    heart, but arrows aimed where the heart should be still failed.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The hunters cut off the titmouse's tongue; the bird flew into the sky and
    did not return, and the present titmouse is described as only an image of that
    bird.
  category: sequence
  evidence_refs:
  - ev:12
