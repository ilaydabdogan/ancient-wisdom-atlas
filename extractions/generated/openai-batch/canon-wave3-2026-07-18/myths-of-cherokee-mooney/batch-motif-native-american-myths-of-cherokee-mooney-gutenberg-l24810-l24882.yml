canonical_text:
  quote: ''
  summary: The passage recounts a Shawnee peace mission to the Cherokees after Seneca
    instruction. Shawnee messengers are received by a chief's daughter and the Cherokee
    chief, bring a valuable bundle containing a peace talk, and present an extended
    speech in council. The speech describes a clean white path, open houses, an enduring
    fire-light, shared benches, pipe, dish, and spoon, burial of tomahawks, cleansing
    of blood, burial of bones, and a peace talk entrusted to the Cherokees for different
    tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Seneca say they have made peace with northern and neighboring tribes and
    instruct the Shawnees to go south to the Cherokees, even into their houses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shawnees start at night, pray to the Great Spirit for peaceful and safe
    arrival, and reach Tah-le-quah safely.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two Shawnee men go to a house near Tah-le-quah; the chief's daughter meets
    them, shakes their hands, and invites them inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief's daughter tells her father that enemies are in the house; the chief
    shakes their hands, and some Cherokee men oppose killing them because the daughter
    and chief have taken them by the hand.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two men bring the rest of their people; they open a valuable bundle and
    say it contains a talk for peace.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cherokee chief says he cannot conduct the business alone and directs the
    peace business to a general council at Cho-qua-ta.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Cho-qua-ta, the messengers say they will make a path for the Cherokees
    and keep it swept clean and white for the rising generation to travel in peace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The messengers say they will keep their house doors open so the rising generation
    will be welcome among them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The peace talk is said to be for all different tribes of red brothers and
    to last to the end of time.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The messenger describes a fire made from dry elm, with one chunk toward the
    rising sun, one toward the north, and one toward the south; the fire is not to
    be extinguished as long as time lasts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: A stick is to stand by the fire so it may be stirred and raised into a light
    for the rising generation; anyone turning in the dark is to be caught by the hand
    and led to the light.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: White hickory bark is set against a tree so that the fire can be moved on
    it; when kindled, the fire will be seen rising toward the heavens.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The messenger says he has prepared white benches, leaned the white pipe against
    them, and arranged that when they eat they will have one dish and one spoon.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The messenger says the warriors still hold tomahawks as if wishing to fight;
    the tomahawks are to be taken and buried deep under the earth where there is water,
    with winds to blow them so far away that warriors never see them again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The messenger says spilled blood will be wiped clean, scattered bones will
    be buried, and the bones will be covered with white hickory bark and a white cloth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The messenger says there must be no more blood spilled and warriors must not
    recollect it any more.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The messengers say the Cherokees are placed under the centre of the sun, and
    the talk is left with them for the different tribes.
  category: speech
  evidence_refs:
  - ev:9
