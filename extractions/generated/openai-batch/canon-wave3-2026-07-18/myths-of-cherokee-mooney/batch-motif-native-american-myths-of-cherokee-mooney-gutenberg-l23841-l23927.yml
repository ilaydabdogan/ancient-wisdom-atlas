canonical_text:
  quote: ''
  summary: Mooney's notes cross-reference Cherokee myth details, explain names for
    Indians and dogs, describe Cherokee belief in slain animals returning from blood
    or bones, and provide Omaha, Yankton, European fairy-lore, and local Murphy-area
    parallels. The passage also discusses the Great Leech of Tlanusi'yi, its association
    with a deep river hole, a possible subterranean water connection, and Lanman's
    related but turtle-identified version.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage cross-references Kalâs'-Gûnahi'ta to number 15 and says stomach-rubbing
    as a means of procuring food also appears in number 3, "Kana'ti and Selu."
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The name translated as "Having topknots" is explained as referring to Indians
    because of former warrior hair crests, while the phrase translated as "they have
    split noses" is explained as referring to dogs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Cherokee hunting belief includes reincarnation of
    a slain animal from blood spilled on the ground or from bones.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Omaha example, Beaver kills and cooks one of his children for a meal,
    then gathers the bones into a skin, places them under water, and the youngest
    beaver comes up alive.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that a person who has eaten food of spirit people or supernaturals
    cannot return to ordinary human life and live unless treated to restore complete
    human nature.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Yankton example, one child taken by water people has eaten the water
    deity's food and dies if brought back, while another child who has not eaten that
    food is returned alive; a white dog is thrown in for the water spirits in each
    case.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Great Leech legend is associated with a deep hole in Valley River at Murphy,
    where something was said to appear alive or moving at the bottom.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wafford is reported as saying that the Leech had wings and could fly.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Nottely and Hiwassee or Valley river locations are said to be popularly
    believed to connect by a subterranean waterway.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Lanman's account identifies the local creature as a Large Turtle or immense
    turtle, says lightning could not injure it, and says it burrowed to the middle
    of the earth after repeated attempts to kill it.
  category: sequence
  evidence_refs:
  - ev:9
