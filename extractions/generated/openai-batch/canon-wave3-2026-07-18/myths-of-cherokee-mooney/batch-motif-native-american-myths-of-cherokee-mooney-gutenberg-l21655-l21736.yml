canonical_text:
  quote: ''
  summary: Mooney’s note identifies the Cherokee Great Yellow-jacket story as an origin
    tale with parallels in other Native mythologies, gives Lanman’s variant about
    a hornet-like bird that abducts Cherokee children and is killed after divine lightning
    exposes its cavern, adds a geographic cave anecdote, quotes an Iroquois great-mosquito
    parallel, and explains the Cherokee term U'la`gû'.
  language: English
  quote_policy: summarized
