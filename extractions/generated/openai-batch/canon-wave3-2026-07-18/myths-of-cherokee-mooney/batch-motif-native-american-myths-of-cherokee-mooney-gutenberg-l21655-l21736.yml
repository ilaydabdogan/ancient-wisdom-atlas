- id: obs:1
  text: 'The passage identifies the story as “The Great Yellow-jacket: Origin of fish
    and frogs,” obtained from Swimmer and known in the tribe.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that many tribal genesis accounts include ferocious monster
    animals in the primitive world that are later destroyed or made harmless, leaving
    smaller present-day descendants.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Lanman’s Cherokee variant, a very large bird resembling a green-winged
    hornet carried off younger children who wandered into the woods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Cherokee people declared warfare against the monster; several means failed
    before the wise men or medicine-men organized a mountain-summit watch and signal
    plan.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The monster’s hiding place was discovered as a deep cavern on the eastern
    side of the Blue Ridge at the fountain-head of the Tugaloo River, with an entrance
    inaccessible by mortal feet.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cherokees prayed to the Great Spirit; a thunderstorm arose, lightning
    tore away half of a large mountain, and the Indians slew the monster.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Great Spirit rewarded Cherokee courage by willing that the highest mountains
    in their land should be without trees, allowing them to watch enemies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage’s sequel describes White-side mountain or the Devil’s court-house
    as a high granite cliff with a small cave near the top, reachable only by a narrow
    strip of rock; a bear encountered there fell and was killed.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Iroquois parallel, a great mosquito invaded Fort Onondaga, used a long
    stinger to suck blood, resisted warriors’ attempts to expel it, was chased and
    killed by the Holder of the Heavens, and its blood became small mosquitoes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The note explains U'la`gû' as meaning a leader, principal, or colloquial “boss,”
    applied to a queen yellow-jacket or a work-gang leader; the story insect is described
    as a monster yellow-jacket.
  category: speech
  evidence_refs:
  - ev:7
