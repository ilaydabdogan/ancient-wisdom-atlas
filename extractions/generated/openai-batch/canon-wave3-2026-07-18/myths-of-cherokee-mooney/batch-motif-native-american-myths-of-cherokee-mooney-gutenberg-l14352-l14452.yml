canonical_text:
  quote: ''
  summary: A captured Shawano medicine-man, Âgan-uni'tsi, bargains for his life by
    promising to find the Ulûñsû'ti, a powerful jewel in the forehead of the Uktena
    serpent. He searches mountains, gaps, and waters, finds the Uktena, prepares a
    circle of fire and trench, shoots the serpent in the heart, survives its poison
    and blood, and later recovers the diamond, becoming a great medicine-man. A small
    snake remains on his head where poison struck, and the blood-filled trench becomes
    a black lake used for basket dye. A following episode begins with two hunting
    brothers; one hunter rescues a man from a great uktena by shooting it with an
    arrow.
  language: English
  quote_policy: summarized
