    groups.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy reference is broad; the passage treats the tradition as persistent
    belief and comparison, not as a single detailed myth narrative.
- id: motif:4
  label: broken crossing creates permanent division
  taxonomy_refs: []
  basis: The Tuscarora example describes people crossing the Mississippi by grapevine;
