    Iroquois, Navaho, Choctaw, and other traditions.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: Mooney proposes a possible historical explanation involving tall plains
    warriors, and he says giants are otherwise scarce in Cherokee mythology.
- id: motif:2
  label: invisible little people inhabiting woods and waters
  taxonomy_refs: []
  basis: The passage says Cherokee woods and waters are peopled by invisible fairy
    tribes and contrasts the abundance of little people with the relative scarcity
    of giants.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This passage gives only a general note, not a full narrative episode.
- id: motif:3
  label: lost or separated tribal kinsmen
  taxonomy_refs:
