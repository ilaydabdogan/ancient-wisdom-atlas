canonical_text:
  quote: ''
  summary: 'The passage gives Mooney''s notes and parallels for several Cherokee traditions:
    giants from the west; the lost Cherokee; the Ani''-Kuta''ni; war medicine; personal
    heroism and War Women; and mounds, constant fire, and sacred things. It offers
    possible historical explanations, reports related beliefs from other Native traditions,
    and cites Creek sacred-square practices as potentially relevant to Cherokee mound
    and fire beliefs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note on "Giants from the west" says the account may be exaggerated from
    a visit by taller plains warriors with plucked eyebrows and long side hair pendants
    wrapped in otter skin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Cherokee mythology appears to have no giants except Tsul`kalû',
    while Cherokee woods and waters are described as peopled by invisible fairy tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that giants are comparatively few in Indian mythologies,
    while "little people" are numerous, and it names Iroquois, Navaho, Choctaw, and
    other traditions as having giant-race stories.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lost Cherokee tradition says a portion of the Cherokee once wandered far
    west or southwest, were later heard of, but were never reunited with the tribe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Sequoya undertook a journey hoping to verify the lost-Cherokee
    tradition and restore lost kinsmen, and that he lost his life on that journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage gives Kiowa, Tonkawa, and Tuscarora examples of separated tribal
    groups, including separation by quarrel, by a sudden inroad of the sea, and by
    a broken grapevine crossing at the Mississippi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says several informants knew the name Ani'-Kuta'ni or Ani'-Kwata'ni
    but could not tell anything more definite than what had already been stated, and
    it notes that hereditary transmission of priestly dignities is common among tribes.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the war-medicine stories are characteristic of Indian belief
    and gives a Kiowa parallel in which Set-ängya was believed to carry a magic knife
    in his stomach and produce it from his mouth at will.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says Cherokee War Women were admitted to tribal councils, and
    quotes Timberlake as saying many Indian women were famous in war and powerful
    in council.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage presents Cherokee statements about mounds, constant fire, and
    old sacred things as popular belief shaped by tribal custom and ritual, relevant
    to supposed requirements for consecrating an important work.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Creek sacred square note describes a high circular mound at the center,
    built from earth removed yearly from the sacred square, with new untrodden soil
    added at the Green-corn festival and restricted from strangers until consecration
    was complete.
  category: sequence
  evidence_refs:
  - ev:9
