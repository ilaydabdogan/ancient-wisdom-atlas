candidate_motifs:
- id: motif:1
  label: dream-song leads to encounter with a speaking plant spirit
  taxonomy_refs:
  - wisdom
  - initiation
  basis: The hunter repeatedly hears singing in dreams or near-waking experience,
    follows it, and receives practical hunting instruction from a speaking corn plant.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage presents a direct encounter and instruction, but does not
    explicitly call it an initiation.
- id: motif:2
  label: plant being transforms into a woman and ascends
  taxonomy_refs:
  - shapeshifter
  - ascent
  basis: The corn plant suddenly takes the form of a woman, rises into the air, and
    disappears.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The text identifies the figure as Selu only after the hunter returns;
    the transformation itself is described briefly.
- id: motif:3
  label: hunting success granted with ritual instruction and generosity obligation
  taxonomy_refs:
  - sacred_exchange
  - wisdom
  basis: The corn plant gives a root-and-water instruction, promises future hunting
    success, teaches hunting secrets, and tells the hunter to be generous with game.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The exchange is implied through instruction and obligation rather than
    formalized as a contract.
- id: motif:4
  label: human visit to hidden animal community through a hill entrance
  taxonomy_refs:
  - hero_descent
  - mystical_quest
  - return
  basis: The hunter follows a speaking panther to a door in the side of a hill, enters
    a warm panther townhouse, participates in the dance, and returns to the ordinary
    winter woods.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The hunter is not explicitly named a hero, and the journey is not framed
    as a quest in the passage.
- id: motif:5
  label: altered time during stay in nonhuman dwelling
  taxonomy_refs:
  - return
  basis: The hunter believes he stayed only a short time in the panther townhouse
    but learns after returning that several days have passed.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No mechanism for the altered time is explained in the passage.
- id: motif:6
  label: assimilation to animal nature after otherworld contact
  taxonomy_refs:
  - shapeshifter
  basis: The hunter dies within seven days after returning because he has begun to
    take on panther nature and can no longer live with men.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage states a change of nature, but does not describe an outward
    bodily transformation.
- id: motif:7
  label: travelers teach vulnerable little people a defensive technique
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Cherokee travelers find the Tsundige'wi unable to fight and teach them to
    use sticks as clubs and strike birds on the neck.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The instructors are a group of travelers rather than a named culture hero.
