canonical_text:
  quote: ''
  summary: The passage contains three Cherokee narratives. In the first, an unsuccessful
    hunter hears singing in dreams, finds a speaking green corn stalk, receives hunting
    instructions and a water-related rite, and later the plant becomes a woman identified
    as Selu, after which he becomes a successful hunter. In the second, a winter hunter
    meets a speaking panther, hunts with it, enters a hidden panther townhouse through
    a hill by a spring, joins a dance, returns after an altered span of time, and
    dies because he has begun taking on panther nature. In the third, Cherokee travelers
    meet the Tsundige'wi, a small people living in sand nests and threatened by birds,
    and teach them to use clubs against the attacking birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter travels over mountains all day without game, builds a fire in a hollow
    stump at sunset, eats corn gruel, sleeps, and hears beautiful singing in a dream
    during the night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the next night the same singing recurs so vividly that the hunter follows
    it before daylight and finds it coming from a single green stalk of corn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The corn plant speaks and tells the hunter to cut off some roots, take them
    home, chew them the next morning, and go to water before anyone else is awake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corn plant says the hunter will kill many deer and be successful in hunting,
    teaches hunting secrets, and tells him to be generous with the game he takes.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: At noon, when the sun is high, the corn plant takes the form of a woman, rises
    into the air, and disappears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the hunter returns home, the people say he has seen Selu, the wife of
    Kana'ti, and he becomes known as the most successful hunter in the settlement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A winter hunter encounters a panther in the woods; when the panther speaks,
    the man feels as if there is no difference between them and they are of the same
    nature.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaking panther says seven panthers are hunting a buck for a Green-corn
    dance and invites the hunter to hunt with them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The panther rejects smaller or damaged deer, kills a large deer, wraps its
    tail around the deer, carries it on its back, and invites the hunter to the panther
    townhouse.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The panther leads the hunter up a stream branch to a head spring, where a
    door seems to open in the side of a hill and they enter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Inside the hill the hunter finds a large townhouse, green trees, warm summer-like
    air, and many panthers preparing for and beginning a dance.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: After dancing several rounds, the hunter leaves through the opened door and
    immediately finds himself alone in the cold winter woods with snow on the ground
    and trees.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: When the hunter reaches the settlement, people are about to search for him;
    he learns he has been in the panther townhouse several days rather than a short
    time.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The hunter dies within seven days after returning because he has begun to
    take on panther nature and can no longer live with people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Cherokee young men travel south and meet the Tsundige'wi, little people with
    unusually shaped bodies who live in sand nests covered with dried grass.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Tsundige'wi are weak, cannot fight, and fear wild geese and other birds
    that come in flocks from the south to make war on them.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: A south wind blows white feathers and down along the sand, which the Tsundige'wi
    understand as a sign that their bird enemies are approaching.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: The Cherokee travelers tell the Tsundige'wi to use sticks as clubs and show
    them where to strike the birds on the necks.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:19
  text: When the birds come like a great cloud and try to pull the little people from
    their nests with their bills, the Tsundige'wi use clubs to strike the birds' necks,
    kill many, and drive the rest southward.
  category: sequence
  evidence_refs:
  - ev:12
