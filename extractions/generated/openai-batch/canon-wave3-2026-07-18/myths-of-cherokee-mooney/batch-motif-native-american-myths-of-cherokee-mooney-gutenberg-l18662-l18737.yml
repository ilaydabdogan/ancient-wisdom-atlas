  text: A remnant of the Natchez is reported as living within present Tennessee as
    late as 1750, and part of the Natchez had been parceled out as slaves among the
    French after the downfall of their tribe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In 1758, some enslaved Natchez reportedly rose during a French troop withdrawal,
    killed their masters, escaped to neighboring tribes, and were later found by a
    French deserter at the Cherokee Great Island town.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Natchez incorporated with the Cherokee reportedly remained for a long
    time a separate people, did not marry or mix with other tribes, had their own
    chiefs and councils, and by 1823 had almost disappeared except for the name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Taskigi are described as another refugee tribe incorporated partly with
    the Cherokee and partly with the Creeks, with towns or possible settlements on
    the Little Tennessee, Tennessee, Tuskegee creek, and Coosa river.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the identity of the Taskigi is uncertain; they were neither
    Cherokee nor Muscogee proper, may have been Muskhogean, immigrant, or a distinct
    stock, and Cherokee informants called them a foreign people with distinct language
    and customs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'In the townhouse of the Taskigi settlement at the mouth of Tellico there
    was an upright pole, and from its top hung a protecting medicine: an image of
    a human figure cut from a cedar log.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Cherokee sometimes derisively called the Taskigi place Atsina'-k`taûñ,
    translated in the passage as “Hanging-cedar place.”
  category: speech
  evidence_refs:
