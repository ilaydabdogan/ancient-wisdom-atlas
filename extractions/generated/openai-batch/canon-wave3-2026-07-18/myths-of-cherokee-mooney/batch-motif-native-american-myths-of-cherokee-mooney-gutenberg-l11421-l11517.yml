  text: The earth is described as a great island floating in a sea of water and suspended
    at the four cardinal points by cords from a solid-rock sky vault.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the world grows old, the people are said to die, the cords to break,
    and the earth to sink into the ocean so that all becomes water again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the earth existed, all was water below, while the animals were above
    in Galûñ'lati beyond the arch.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dâyuni'si, the Water-beetle, goes over the water, dives to the bottom, and
    brings up soft mud that grows into the earth island.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The earth is later fastened to the sky with four cords, but the passage says
    no one remembers who did this.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Birds are sent to test whether the new earth is dry, but at first they find
    no place to alight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Great Buzzard flies low over the soft earth; where his wings strike, valleys
    form, and where they rise, mountains form.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The animals call the Great Buzzard back because they fear the whole world
    will become mountains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the earth dries and the animals descend, it is dark, so they obtain
    the sun and set it in a daily east-to-west track over the island.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sun is initially too hot; the Red Crawfish's shell is scorched red and
    its meat spoiled.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The conjurers repeatedly raise the sun until it is seven handbreadths high,
    just under the sky arch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Another world exists under this one and is like this world in animals, plants,
    and people, except that its seasons differ.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Streams from mountains are described as trails to the underworld, and springs
    at their heads as doorways into it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:14
  text: To enter the underworld, one must fast, go to water, and have an underground
    person as guide.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Animals and plants are told to stay awake for seven nights; only a few animals
    and several trees remain awake to the end.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The animals that keep awake receive power to see and go about in the dark
    and to prey on animals that sleep at night.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:17
  text: The trees that keep awake are made evergreen and greatest for medicine, while
    other trees are told they will lose their hair every winter.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:18
  text: Humans come after animals and plants; at first there are only a brother and
    a sister.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The brother strikes the sister with a fish and tells her to multiply, after
    which children are born to her every seven days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: Because humans multiply too rapidly, it is made that a woman should have only
