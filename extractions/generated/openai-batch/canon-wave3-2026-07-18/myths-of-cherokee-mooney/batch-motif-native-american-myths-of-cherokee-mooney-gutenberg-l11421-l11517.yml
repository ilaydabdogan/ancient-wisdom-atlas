canonical_text:
  quote: The earth is a great island floating in a sea of water
  summary: 'The passage gives Cherokee cosmogonic accounts: the earth as an island
    suspended from the sky, the Water-beetle bringing up mud from primordial water,
    the Great Buzzard shaping mountains and valleys, the sun being set and raised
    to a proper height, an underworld reached through streams and springs, powers
    granted to animals and trees that kept vigil for seven nights, the first human
    brother and sister multiplying, and the beginning of the first-fire episode in
    which the Thunders place fire in a hollow sycamore on an island.'
  language: English
  quote_policy: quoted
literal_observations:
