canonical_text:
  quote: ''
  summary: 'The passage summarizes Cherokee mythological and ritual ideas about animals:
    a primal human-animal continuity, later hostility caused by human aggression,
    animal tribal societies and afterlife, hunter compensation to animal tribes, animal
    resurrection/reanimation doctrines, supernatural masters of animals, game animals
    released from an underground cave, trickster Rabbit traditions, ball-game uses
    of Bat and Flying Squirrel powers, animal-related taboos and etiologies, and notes
    on buffalo and elk folklore.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Cherokee mythology presents no essential difference
    between men and animals, especially in the primal genesis period.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Human aggressiveness and disregard for other creatures' rights provokes animal
    hostility, and many kinds of animals join forces against man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Animals are described as having tribes, chiefs, townhouses, councils, ballplays,
    and the same hereafter in the Darkening land of Usûñhi'yi.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Humans continue to hunt animals but are said to be obliged to satisfy animal
    tribes through compensatory presents described as covering the bones of the dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: According to shamans, each animal has a fixed life term that violent death
    cannot shorten; if killed early, the animal's death is temporary and its body
    is resurrected from blood drops.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the predestined term ends, the animal body dissolves and the spirit
    joins kindred shades in the Darkening land; some priests hold that seven reanimations
    occur before the final end.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kana'ti and Tsul`kalû' are described as supernatural personages with dominion
    over animals and as distinctive gods of the hunter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kana'ti is said to have kept game animals and pestiferous insects shut in
