candidate_motifs:
- id: motif:1
  label: Primal human-animal continuity followed by separation
  taxonomy_refs: []
  basis: The passage states that men and animals are not essentially different in
    the primal period, but their lives later become apart after human aggression provokes
    animal hostility.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is explanatory rather than a narrated myth episode.
- id: motif:2
  label: Animal confederacy against human aggression
  taxonomy_refs: []
  basis: Insects, birds, fishes, reptiles, and fourfooted beasts are said to join
    forces against man after provocation.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The specific cited story is not included in this passage.
- id: motif:3
  label: Animal tribes mirror human society and share an afterlife
  taxonomy_refs: []
  basis: Animals have tribes, chiefs, townhouses, councils, ballplays, and a hereafter
    in the Darkening land.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives a general doctrinal summary, not one narrative.
- id: motif:4
  label: Hunter compensates animal dead
  taxonomy_refs:
  - sacred_exchange
  basis: Hunters must satisfy animal tribes by giving presents to cover the bones
    of the dead, analogous to compensation for a killing.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The taxonomy match to sacred exchange is interpretive; the passage frames
    it as compensation and pardon rather than a formal exchange myth.
- id: motif:5
  label: Animal resurrection from blood drops after premature killing
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Animals killed before their allotted life term are said to die only temporarily
    and to be resurrected from blood drops.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The resurrection applies specifically to animals within a shamanic explanation.
- id: motif:6
  label: Seven animal reanimations before final end
  taxonomy_refs:
  - resurrection
  basis: Some priests hold that animals undergo seven successive reanimations before
    the final dissolution.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage attributes this to some priests, not all informants.
- id: motif:7
  label: Master of animals confines game in an underground cave until released
  taxonomy_refs: []
  basis: Kana'ti keeps game animals and insects in an underground cave, and his sons
