comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Cherokee human-animal continuity as comparable
    to a broader pattern in the mythology of Indian tribes generally.
  claim_level: same_motif
  target: 'Mythologies of Indian tribes generally: no essential difference between
    men and animals'
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is Mooney's broad comparative statement; the passage does not
    cite specific non-Cherokee narratives for the comparison.
- id: claim:2
  claim: The passage states that buffalo names among Cherokee, Hichitee, Creek, and
    Choctaw are practically the same.
  claim_level: linguistic_similarity
  target: Buffalo terms in Cherokee, Hichitee, Creek, and Choctaw
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is a linguistic comparison, not a motif or symbol comparison.
