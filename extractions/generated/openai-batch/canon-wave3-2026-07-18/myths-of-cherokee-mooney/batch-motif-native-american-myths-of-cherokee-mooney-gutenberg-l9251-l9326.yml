canonical_text:
  quote: ''
  summary: Historical notes give biographical accounts of Sir William Johnson and
    Captain John Stuart, emphasizing their British colonial offices, relations with
    Indigenous nations, military actions, treaties, family connections, and roles
    during conflicts involving the Six Nations, Mohawks, Cherokee, southern tribes,
    loyalists, and Americans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sir William Johnson was born in County Meath, Ireland, in 1715 and died at
    Johnstown, New York, in 1774.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Johnson left Ireland after a disappointment in love and emigrated to America
    to settle his uncle's wild land along the south side of the Mohawk River in New
    York.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Johnson came into close contact with the Six Nations, especially the Mohawks,
    learned their language, adapted partly to their customs and costume, gained influence,
    and was adopted as a chief by the Mohawk tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Johnson was placed in charge of British affairs with the Six Nations and later
    commissioned superintendent for the Six Nations and their dependent and allied
    tribes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Johnson held colonial military offices, defeated Dieskau at Lake George, was
    wounded but remained in the field, and later took part in actions including Ticonderoga,
    Fort Niagara, and Montreal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Johnson received land north of the Mohawk River, built Johnson Hall near Johnstown,
    and lived there while attending to Indian affairs and other estate activities.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Johnson's influence is said to have prevented the Six Nations from joining
    Pontiac's confederacy against the English.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Johnson concluded the treaty of Fort Stanwix, which fixed the Ohio as a boundary
    between northern colonies and western tribes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Johnson married a German woman of the Mohawk valley, later formed a connection
    with Brant's sister, and died from over-exertion at an Indian council.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sir John Johnson succeeded to Sir William Johnson's title and estates, sided
    with the British in the Revolution, and drew the Mohawks and much of the Six Nations
    with him to Canada.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Captain John Stuart was born in Scotland around 1700, came to America in 1733,
    entered British service, and became favored by Indians.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: When Fort Loudon was taken by the Cherokee in 1760, Stuart was second in command
    and was rescued by Ata-kullakulla.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Stuart was appointed superintendent for the southern tribes in 1763 and held
    that position until his death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Stuart negotiated the treaty of Hard Labor with the Cherokee, fixing the Kanawha
    as Virginia's western boundary.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: At the outbreak of the Revolution, Stuart organized the Cherokee, other southern
    tribes, and white loyalists against the Americans and planned a wider invasion
    that failed after discovery and Cherokee defeat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: After the defeat of the Cherokee, Stuart fled to Florida, sailed for England,
    and died there in 1779.
  category: sequence
  evidence_refs:
  - ev:7
