  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: William Scott commanded a boat carrying goods and people down the Tennessee
    river toward Natchez; the boat was fired on near Chickamauga towns, and the passengers
    returned fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Cherokee party headed by White-man-killer pursued Scott's boat to Muscle
