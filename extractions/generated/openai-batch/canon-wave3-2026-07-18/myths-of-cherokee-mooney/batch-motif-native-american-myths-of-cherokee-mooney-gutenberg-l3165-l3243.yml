  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: John Ish was shot while plowing, and Hanging-maw ordered Cherokee to trail
    and capture the killer, who was identified as Creek and was tried and hanged at
    Tellico blockhouse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The executed Creek man said his people were at war with the whites, that he
    had left home to kill or be killed, and that his nation could avenge his death.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After a Creek war party crossed the Tennessee river against the settlements,
    Hanging-maw gave the alarm and Cherokee with federal troops pursued them, killing
    one Creek and wounding another.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The victors returned to Cherokee towns with death song and gunfire, and the
    night was spent in a scalp dance described as customary after victory over enemies,
    with white and red people joining.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Governor Blount sought peace with the Cherokee Nation; Cherokee speakers said
