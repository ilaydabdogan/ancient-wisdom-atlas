canonical_text:
  quote: ''
  summary: The passage recounts frontier warfare in 1788 involving Creek, Chickamauga,
    Cherokee, Georgia, Tennessee, and other actors; retaliatory expeditions and attacks;
    the killing of Abraham and Tassel; an attack on Gillespie's station followed by
    a letter from chiefs; negotiated prisoner surrender; and the captivity, adoption,
    warning, restoration, and later family ransom associated with Joseph Brown and
    his relatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Creek and Chickamauga inroads on frontier settlements prompted plans for a
    joint Georgia and Tennessee campaign, but federal authorities interfered and the
    enterprise failed to proceed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cherokee agent reported that, except for the Chickamauga band, the Indians
    wished for peace if whites would allow it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After members of the Kirk family were murdered, Sevier led a retaliatory force
    that burned towns on the Hiwassee and Little Tennessee and killed inhabitants,
    including some trying to escape in the river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Abraham and Tassel, described as friendly chiefs, were killed by one of the
    Kirks after voluntarily coming in at an officer's request during Sevier's temporary
    absence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Captain Fayne's expedition was ambushed at Citico town, lost men killed and
    wounded, and its survivors were pursued toward Knoxville.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: General Martin's expedition toward the Chickamauga towns was checked in a
    narrow pass; after officers were killed, the dead officers were buried in a large
    townhouse that was then burned to conceal the grave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A large Cherokee and Creek party attacked Gillespie's station, overpowered
    the small garrison, and killed twenty-eight persons including women and children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The attackers left a letter signed by four chiefs, including John Watts, expressing
    regret about the women and children killed, invoking the killing of Abraham and
    Tassel, and saying peace would be made when the whites moved off the land.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After further attacks on exposed stations, Sevier pursued the Indians to towns
    on the headwaters of the Coosa, after which they asked for peace terms and agreed
    to surrender prisoners at Coosawatee.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Joseph Brown, his two younger sisters, and others had been captured at Nickajack
    while descending the Tennessee in a flatboat; his father and other men were killed,
    and his mother and other children were taken to various Indian towns, including
    Creek towns.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Joseph Brown was condemned to death, rescued by a white man living in the
    town, and later adopted into the family of a chief.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: An old Indian woman warned that, if Joseph Brown were allowed to live, he
    would one day guide an army to destroy them; the passage states that Brown later
    guided the expedition that rooted out the Chickamauga towns.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: When Joseph Brown was restored at Coosawatee, he wore Indian costume and body
    markers, and his five-year-old sister was so attached to her adoptive Indian woman
    that she refused to go to her mother and had to be pulled along.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: McGillivray ransomed Brown's mother and another daughter from the Creeks,
    restored them to friends, and refused compensation.
  category: action
  evidence_refs:
  - ev:11
