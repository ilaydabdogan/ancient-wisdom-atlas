literal_observations:
- id: obs:1
  text: The Chickasaw and later the Cherokee surrendered claims to lands near the
    Cumberland and Duck rivers, while Chickamauga warriors and allies refused to acknowledge
    the Cherokee cession and continued attacks on new settlements.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spain claimed territory west of the mountains and south of the Cumberland
    River, and Spanish agents were accused of encouraging attacks against Americans,
    including alleged rewards for scalps.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Captain Robertson led volunteers and Chickasaw guides across the Tennessee
    River to Coldwater, surprised the town, and burned it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Coldwater, over twenty Native men and several French traders were killed;
    a white woman was accidentally shot, and trading goods were seized and sold for
    the troops.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After a temporary pause in attacks, renewed raids led to ranger orders to
    scour the country and kill every Indian found east of the Chickasaw boundary.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: McGillivray replied to a remonstrance by saying that the Creeks had accepted
    friendship proposals but that killings at Coldwater had renewed hostile feeling;
    he promised to work for peace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A peace treaty with the Creeks was signed in 1790, but the passage says it
    had little practical effect because of Spanish intrigues.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tennessee was organized as a federal territory in 1790, and William Blount
    was appointed territorial governor and superintendent for the southern Indians.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Federal officials described white settlement on Cherokee lands as a violation
    of the treaty of Hopewell and warned that such violations undermined United States
    authority and Native trust in treaties.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: After a federal proclamation against further encroachment, men built a blockhouse
    and defensive works on an island at Muscle Shoals.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Cherokee chief Glass appeared with about sixty warriors, told the intruders
    to withdraw or be killed, and after they left, the Indians burned the buildings
    to ashes.
  category: action
  evidence_refs:
  - ev:11
