canonical_text:
  quote: ''
  summary: Two strangers who appear Cherokee invite the people of Kana'sta to join
    a peaceful unseen town at Tsuwa`tel'da after a seven-day fast. The community fasts
    and follows guides into a cave in the mountain, where they find an open country
    and prepared houses. A visitor later returns outside with instructions about fasting
    to see or join the hidden people; the cave then appears as solid rock. The lost
    settlement is said to remain in the mountain, which is feared as haunted. The
    passage also begins the next legend, introducing Tsuwe'nahi, a lazy unsuccessful
    hunter who leaves with parched corn and returns without deer but with a story.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two strangers enter the chief's house at Kana'sta and say they are of the
    same people and from a nearby town that has not been seen by the settlement.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The strangers contrast the wars, sickness, enemies, and coming stronger enemy
    of Kana'sta with peace and happiness in their own town at Tsuwa`tel'da.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The strangers state that they do not live forever and do not always find game,
    because game belongs to Tsul`kalû' in Tsunegûñ'yi.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The strangers instruct the people to fast seven days if they want to be taken
    to live with them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The chief calls a council; the people decide to go, prepare their property,
    and begin the fast in the townhouse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the seventh morning a large company arrives from the west, led by the same
    two men, and helps carry goods toward Tsuwa`tel'da.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A man visiting Kana'sta from another town goes along with the migrating people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: At the mountain, the two guides lead the people into a cave that opens like
    a great door in the rock.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Inside the mountain is an open country and a town with houses arranged in
    two long rows from east to west.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: The mountain people live on the south side and have prepared houses for the
    newcomers, with more houses remaining ready for future arrivals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: The mountain people say another town of a different people is above them in
    the same mountain and that the Thunders live farther above at the top.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: The visiting man wants to return to his own friends, and the chief allows
    him to go despite some mountain people's wish to prevent it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The chief tells the visitor that others may come, that hidden people live
    in multiple mountain places, and that they see people at dances although they
    cannot be seen unless people fast.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The chief prescribes a four-day fast to see and talk with the hidden people,
    and a second seven-day fast if people want to live with them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:15
  text: After the chief leads the visitor outside through the cave, the visitor looks
    back and sees only solid rock instead of the cave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: The people of the lost settlement are never seen again and are said still
    to live in Tsuwa`tel'da.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:17
  text: Later hunters camp near the mountain, joke about the old Kana'sta people,
