canonical_text:
  quote: ''
  summary: A historical account of the 1838-39 Cherokee removal describes forced seizure
    into stockades, burning and plundering of homes, grave robbery, individual scenes
    of prayer and farewell, Tsali/Charley's resistance and voluntary surrender, punitive
    executions, the origin of the eastern band from fugitives allowed to remain, and
    mass removal by river transport and overland march.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Troops under Scott were stationed through the Cherokee country, where stockade
    forts were built to gather and hold Cherokee people before removal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: Troop squads searched cabins in coves and by mountain streams and seized occupants
    as prisoners.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Families, men, women, and children were taken from ordinary activities such
    as dinner, field work, spinning, travel, and play.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some captives saw their homes burning as they crossed a ridge, while outlaws
    looted stock and valuables and robbed Indian graves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One old patriarch, after being surprised by soldiers, called his children
    and grandchildren to pray with him in Cherokee and then led the way into exile.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: One woman, after finding the house surrounded, fed the chickens for the last
    time and then left with her infant, two other children, her husband, and the soldiers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tsali, also called Charley, was seized with relatives; after his wife was
    prodded with bayonets, he urged a dash for liberty, and Cherokee warriors attacked
    nearby soldiers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the sudden attack one soldier was killed, the rest fled, and the Cherokee
    involved escaped to the mountains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hundreds of other fugitives escaped to the mountains; some died of starvation,
    while others lived on roots and wild berries until the hunt ended.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: General Scott proposed that the fugitives could remain if Charley and his
    party were surrendered for punishment; Charley voluntarily came in with his sons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Charley, his brother, and his two elder sons were shot near the mouth of Tuckasegee,
    with Cherokee prisoners compelled to do the shooting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The text states that the fugitives permitted to remain became the origin of
    the present eastern band of Cherokee.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Nearly seventeen thousand Cherokee were gathered into stockades before removal
    began.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: About five thousand persons were moved by troops to river landings, put on
    steamers, transported down the Tennessee and Ohio rivers beyond the Mississippi,
    and then continued by land to Indian Territory.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Because summer removal brought sickness and mortality, Ross and other chiefs
    proposed fall self-removal, after which detachments with leaders, wagons, and
    horses started the long overland march.
  category: sequence
  evidence_refs:
  - ev:7
