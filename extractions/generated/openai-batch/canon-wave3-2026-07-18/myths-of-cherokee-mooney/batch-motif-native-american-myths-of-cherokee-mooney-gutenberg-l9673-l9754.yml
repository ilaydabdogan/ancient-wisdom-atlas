canonical_text:
  quote: ''
  summary: Historical notes recount examples of white and colonial scalp-taking, mutilation,
    and bounties; Hawkins's 1796 account of Lower Cherokee refugees' fear of white
    visitors due to remembered harassment; and a biographical account of Creek leader
    Alexander McGillivray, emphasizing his mixed ancestry, maternal ruling stock,
    formal accession to chieftainship, and diplomatic dealings with British, Spanish,
    and United States authorities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mission village of Norridgewock was attacked by New England men, and women
    and children were said to suffer the fate of warriors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The missionary Rasles was shot at the foot of a cross and later found scalped,
    mutilated, and with his body damaged.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says border men in the Revolutionary period and later scalped
    slain Indians when possible, and that British and American officials encouraged
    the practice through bounties and rewards.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage attributes later Apache difficulties to a treacherous 1836 massacre
    by American scalp hunters paid by the governor of Sonora, with a bounty of one
    ounce of gold per scalp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In 1864 Colorado militia under Colonel Chivington attacked Cheyennes camped
    under the United States flag, killed, mutilated, and scalped 170 men, women, and
    children, and brought the scalps into Denver for public display.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says Lieutenant Richmond killed and scalped three women and five
    children; it also mentions scalps taken in the Modoc war and a Comanche woman
    who survived being scalped by white soldiers in Texas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Willstown, Hawkins found Lower Cherokee children extremely alarmed at the
    sight of white men; one eight-year-old screamed, escaped through the door, and
    hid.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mothers explained that their town contained remnants of former towns from
    Tugalo and Keowee that had been harassed by whites, and that elders' stories of
    suffering had impressed the children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Women gathering nuts told Hawkins that his arrival at the camp alarmed them
    greatly, and that after he dismounted, took their hands, and spoke to them, they
    could not initially reply.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Alexander McGillivray is described as a famous Creek chieftain of mixed blood,
    son of a Scotch trader and a halfbreed woman of influential family whose father
    was a French officer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: McGillivray was educated at Charleston, studied Latin, was placed with a Savannah
    mercantile firm, returned to the Creek country, and became connected with the
    firm of Panton, Forbes & Leslie.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: McGillivray succeeded to the chieftainship after his mother's death because
    she came of ruling stock, but he refused the position until called by a formal
    council and then assumed the title emperor of the Creek Nation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After Georgia confiscated his paternal estates, McGillivray joined the British
    side with his warriors and later made a treaty of peace with the United States
    in New York on behalf of his people.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: Creek chiefs were entertained by the Tammany society, whose members wore full
    Indian dress; the visitors responded with an Indian dance, and McGillivray exchanged
    a Spanish commission for a higher United States commission.
  category: sequence
  evidence_refs:
  - ev:6
