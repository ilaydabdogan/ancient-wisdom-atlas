canonical_text:
  quote: ''
  summary: The passage describes Cherokee preservation and council display of symbolic
    peace records connected with an Iroquois treaty, including belts, pipes, and feather
    ornaments. It then recounts a Seneca warrior, Hiadeoni, making a solitary raid
    into Cherokee country, killing three men, deceiving a victim's mother by being
    mistaken for her son, fleeing pursuit, and returning to the Genesee with scalps.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Symbolic records of peace with the Iroquois were preserved by the Cherokee
    for nearly a century and carried west during the 1838 removal.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The records were in John Ross's keeping and were produced at an intertribal
    council near Tahlequah in June 1843.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gatûñ'wa`li, also called Hard-mush, interpreted the records at the council
    and said he had seen them delivered to Cherokee chiefs decades earlier.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The treaty objects included one large belt with smaller belts fitted to it,
    beads of uncertain material, red pipes, grayish-white or white peace pipes, and
    feather fans or ornaments.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pipes were passed around the council circle so each delegate could take
    a whiff.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The treaty objects formed a guarded package and were thought to have been
    destroyed when John Ross's house was burned during the War of the Rebellion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hiadeoni is described as a Seneca warrior of prowess, dexterity, swiftness,
    courage, and skill.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hiadeoni undertook a solitary incursion into Cherokee country, carrying only
    arms and a little parched and pounded corn meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At evening near a Cherokee village, Hiadeoni found people dancing and killed
    two men who left the dance ring for the bushes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hiadeoni killed a third young man near a remote lodge, took his scalp, and
    entered the lodge to search for tobacco and ammunition.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the third victim's mother entered, Hiadeoni lay in the young man's bed
    with his face covered, and she mistook him for her son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The mother spoke to the person she thought was her son, and Hiadeoni gave
    a suitable response.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the morning the mother prepared roasted squashes for the supposed son and
    left them for him to eat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Hiadeoni fled at dawn, was pursued, hid in remote woods until night, and eventually
    returned to the Genesee with three Cherokee scalps.
  category: sequence
  evidence_refs:
  - ev:7
