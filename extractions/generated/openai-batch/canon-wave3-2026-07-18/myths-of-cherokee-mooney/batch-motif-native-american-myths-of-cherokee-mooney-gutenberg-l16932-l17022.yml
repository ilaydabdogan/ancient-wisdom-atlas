literal_observations:
- id: obs:1
  text: Sequoya, identified as inventor of the Cherokee alphabet, tried to introduce
    it among the Cherokee about 1822, and some opposed it by arguing that Indians
    had no business with reading.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the book-and-bow account, the Indian was created as the elder and given
    a book, while the white man received bow and arrows; each was instructed to care
    for and use the gift well.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Indian neglected the book, and the white man stole it and left the bow
    in its place; the account explains books and reading as belonging to the white
    man and hunting as the Indian livelihood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the locomotive account, a Black man made the first locomotive as a toy
    on a wooden track, and a white man watched how to run it, killed him, and took
    the locomotive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the locomotive account was plainly of recent origin
    and was heard from several informants.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage describes long wars between Cherokee and Iroquois, with both groups
    retaining traditions of them; it also gives names by which Seneca/Iroquois and
    Cherokee referred to one another.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Iroquois traditions cited in the passage give alternate causes for the war:
    a Cherokee attack and plunder of a Seneca hunting party, or a Cherokee violation
    of a peace treaty by murdering Iroquois delegates.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Because the distance between Iroquois country and the Cherokee frontier was
    great, warfare is described chiefly as individual exploits, with captives taken
    on both sides and no permanent advantage gained by either.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A compromise made the Tennessee River the boundary between Cherokee and Iroquois
    claims, with land south of the river claimed by Cherokee and recognized by Iroquois
    as the limit of their own conquests in that direction.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'A reported agreement made the Tennessee River a limit of pursuit: if a Cherokee
    war party crossed back over before being overtaken, Iroquois pursuers did not
    attack the camp.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Iroquois Buffalo dance is traditionally said to have originated during
    an expedition against the Cherokee, when warriors at a Kentucky salt lick encountered
    buffalo and derived the dance music and action from the animals' sounds and movements.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: According to Cherokee tradition as given by Stand Watie, the war ended when
    Iroquois sent a delegation proposing a general alliance of southern and western
    tribes, which the Cherokee accepted and extended to other tribes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Osage were the exception to the peace, and the passage says they were
    therefore compared to wild fruit on the prairie at which every bird should pick.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says the treaty may be the same as that described in the story
    of “The Seneca Peacemakers,” and that a formal final peace was arranged by Sir
    William Johnson in 1768.
  category: relationship
  evidence_refs:
  - ev:9
