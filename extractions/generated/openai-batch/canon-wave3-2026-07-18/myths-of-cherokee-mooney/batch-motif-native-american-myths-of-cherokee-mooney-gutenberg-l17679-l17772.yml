  summary: 'The passage first concludes an account in which two women return, follow
    commands attributed to the Sky People, and perform a song in the long house. It
    then begins Ga''na''s story: a Seneca war chief prepares a peace delegation to
    the Cherokee through bathing, medicine, and eagle-feather acquisition; the Seneca
    enter a Cherokee town with dancing and wampum, negotiate peace, bury weapons,
    share food, and form kinship ties through adoption, after which Ga''na'' recognizes
    a wife formerly carried off by the Cherokee and meets their son.'
