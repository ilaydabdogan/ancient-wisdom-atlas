canonical_text:
  quote: ''
  summary: The passage first describes a nocturnal council-house ceremony in which
    black drink is prepared, split dry canes are arranged in a widening spiral around
    a central pillar, and the outer end of the spiral ignites and burns sunwise until
    the council ends. It then gives notes on Cherokee genesis traditions, including
    fragmentary creation accounts, variants of supernatural pregnancy, a blind first
    man, animal roles in shaping mountains and bringing or supporting earth, possible
    origins of the sun, figurative spatial language, successive removals of the sun
    or heavens, and parallels to multi-tiered heavens in other traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An officer or governor manages the ritual preparations and orders black drink
    made from cassine leaves and shoots under a pavilion opposite the council-house
    door.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bundles of split dry cane are placed crosswise on the floor in a widening
    spiral circle around a great central pillar.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night, after the assembly is seated, the outer end of the spiral catches
    fire, and the flame travels around the central pillar with the course of the sun
    until the cane circle is consumed and the council ends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Cherokee genesis traditions are preserved only in
    broken fragments and that recorded native cosmogonic myths begin with an already
    existing world and living creatures rather than a first act of creation.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: One conception variant has a brother striking his sister with a fish to make
    her pregnant; another has the Little People command a woman to use spittle and
    remain covered for seven days and nights before childbirth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In John Ax's version, after the first child is born, another child is born
    every seven days until the interval is lengthened.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: According to Wafford, the first man was created blind and remained blind for
    a time.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports a buzzard shaping mountains and notes that a similar incident
    occurs in Creek and Yuchi genesis myths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says that Creek and Yuchi traditions have the first earth brought
    up from under water by a crawfish, while northern tribes commonly have a turtle
    supporting the earth on its back.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The water beetle is identified as Gyrinus, and one variant has a water-spider
    helping in the work.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says some tribes believe the sun is a gaming wheel stolen from
    superior beings.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Cherokee term translated as hand-breadth is explained as a figurative
    expression for a serial interval of space in sacred formulas.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage reports a pattern of successive removals of the sun to reduce
    excessive heat and quotes a version in which seven heavens are created, with the
    seventh becoming the deity's abode.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage compares seven Hindu heavens, nine Aztec and Scandinavian heavens,
    and ten Polynesian heavens, with a Polynesian account of sky elevation by Ru and
    Matti.
  category: relationship
  evidence_refs:
  - ev:10
