literal_observations:
- id: obs:1
  text: A Cherokee national council sent a delegation to Washington to report alleged
    improper treaty methods and request that the treaty be set aside; the mission
    had no result.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The American Board of Commissioners for Foreign Missions established a Cherokee
    station at Brainerd with government-aided buildings, a schoolhouse, gristmill,
    workshops, and a work farm.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the mission, boys were taught ordinary branches and simple mechanic arts,
    while girls learned needlework and spinning; other mission sites later served
    about two hundred pupils by 1820.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buttrick and Worcester are named as early noted workers at Brainerd, and Worcester
    is described as having defended the Cherokee cause and suffered imprisonment.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Emigrant Cherokee delegations sought clearer Arkansas boundaries and future
    recognition as a separate tribe, but separate recognition was not granted in the
    passage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Governor William Clark arranged a St. Louis conference between Cherokee emigrants
    and the Osage and, after protracted effort, established friendly relations between
    them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Efforts by the western Cherokee and the government to persuade Shawano, Delawares,
    and Oneida to join the western Cherokee did not succeed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Governor McMinn told eastern Cherokee chiefs that the government could no
    longer protect them from surrounding white encroachments and urged removal westward
    with monetary compensation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chiefs promptly refused McMinn's offer and also refused when the amount
    was doubled.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A later delegation to Washington under Agent Meigs consented to a large cession
    after renewed and persistent negotiation pressure.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage reports disputed Cherokee population and emigration figures given
    by Governor McMinn and by eastern Cherokee claimants.
  category: attribute
  evidence_refs:
  - ev:6
