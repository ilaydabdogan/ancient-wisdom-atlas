literal_observations:
- id: obs:1
  text: Several Cherokee plant names are explained as based on visible traits, growth
    habits, or resemblance, including mistletoe as married to a supporting tree, bear-grass
    as greensnake, May-apple as wearing a hat, and puffball as little star.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some plant names are explained through animal associations, including wild
    rose as eaten by rabbits and shield fern as a place where the bear lies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fleabane is called fire maker because its dried stalk was formerly used to
    produce fire by friction.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bugle weed is called talkers because its chewed root is given to children
    or rubbed on their lips to give eloquence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some plants have ordinary names and sacred or symbolic names used by priests
    and doctors in prayer formulas; ginseng is addressed as Little Man and corn is
    invoked as Agawe'la.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A plant name meaning frogs fight with it is explained by a story of two quarrelsome
    frogs dueling with its stalks as lances.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: White clover is said by the Cherokee to follow the white man.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A myth explains the division between evergreen and deciduous trees by saying
    deciduous trees lose leaves in winter as punishment for failing to endure an ordeal
    to the end.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The cedar is described as sacred above other trees, with reverence linked
    to its evergreen quality, fragrance, red wood, resistance to warping, and resistance
    to decay.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Small cedar twigs are burned as incense in certain ceremonies, especially
    against asgina dreams, because malevolent ghosts are believed unable to endure
    the smell; cedar wood itself is considered too sacred for fuel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the war dance, scalp trophies on small hoops were hung on a trimmed and
    decorated cedar sapling.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Cherokee myth explains cedar's red color as coming from the blood of a wicked
    magician whose severed head was hung at the top of a tall cedar.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Yuchi version reported in the passage, a malevolent magician disturbed
    the daily course of the sun, was killed in his cave by two warriors, and his severed
    head remained alive until tied in a cedar.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The Yuchi story says blood from the head trickled down the cedar, giving the
    wood its red color and making cedar henceforth a medicine tree.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Basswood is believed never to be struck by lightning, so hunters seek shelter
    under it in thunderstorms, and its bark is made into hunting belts.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: Sourwood is used for barbecue sticks and carved objects, but it is not burned
    because its ashes or fire are believed to cause sickness or painful effects.
  category: action
  evidence_refs:
  - ev:12
