canonical_text:
  quote: ''
  summary: 'The passage recounts the Eastern Band Cherokee refugees after the 1838
    roundup: their mountain hiding under U''tsala, General Scott''s proposed compromise
    through William H. Thomas, U''tsala''s consent to surrender Charley''s party to
    save the wider fugitive band, Thomas''s solitary visit to Charley''s cave, the
    voluntary surrender and execution of the party with one boy spared, and later
    efforts and legal changes that left Cherokee people landless in their original
    country.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A remnant of Cherokee people remained in the old home country, and many who
    eluded the 1838 roundup fled into high mountain fastnesses.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: About half of the refugee warriors placed themselves under U'tsala, who kept
    headquarters among high peaks at the head of Oconaluftee while the fugitives suffered
    starvation and exposure.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'General Scott authorized William H. Thomas to offer U''tsala a compromise:
    seize and surrender Charley and the others involved in an attack on soldiers,
    after which pursuit of the fugitives would stop temporarily.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thomas reached U'tsala by secret paths and warned that rejection would bring
    the full force of the troops against U'tsala's small band until the last refugee
    was taken or killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: U'tsala, whose wife and little son had starved on the mountain side, decided
    that sacrificing a few was preferable to the death of all, because the band had
    sworn never to leave their country.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Charley and his party were hiding in a cave in the Great Smokies near Deep
    Creek; Thomas went alone, stood between them and their guns, and delivered his
    message while they sat around a fire near the entrance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Charley agreed to come in, saying he did not want to be hunted down by his
    own people; the party surrendered voluntarily and were shot, with one boy spared
    because of his youth.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: After the respite, Thomas went to Washington to seek a permanent settlement,
    but the treaty permission for some Cherokee to remain in the East was canceled
    and the passage states that every Cherokee became a landless alien in the original
    country.
  category: sequence
  evidence_refs:
  - ev:7
