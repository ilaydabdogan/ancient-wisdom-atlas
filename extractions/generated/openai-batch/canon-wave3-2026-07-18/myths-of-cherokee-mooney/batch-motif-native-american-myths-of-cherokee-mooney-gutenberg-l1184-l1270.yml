  text: A reported 1684 treaty or agreement between the South Carolina colonial government
    and the Cherokee is described as signed with the hieroglyphics of eight lower-town
    chiefs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A 1691 South Carolina record is described as ordering an inquiry into a report
    that colonists had murdered several Cherokee without a proclamation of war.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In 1693 Cherokee chiefs went to Charleston with presents and offers of friendship,
    asking protection against neighboring enemies who had made war on them and sold
    some Cherokee into slavery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The English response in 1693 said the captured kinsmen could not be recovered,
    expressed desire for friendship, and promised that there would be no future grounds
    for such complaint.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the 1693 promise was apparently not kept and cites a 1705
    accusation that Governor Moore commissioned attacks, killing, capture, and enslavement
    of Indians for private profit, with a warning that such actions could bring Indian
    war on the colony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: About 1700 the first guns are said to have been introduced among the Cherokee;
    in 1708 they are described as a numerous mountain people with sixty towns and
    limited importance in the Indian trade.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the Tuscarora War of 1711-1713, more than two hundred Cherokee joined
    South Carolina volunteers against the Tuscarora; the passage says the Indian allies
    took goods along the way, tortured many prisoners, and sold the remainder as slaves
    to South Carolina.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the Tuscarora War, former Indian allies of the English discussed grievances
    and joined a coalition against the whites, including the Cherokee, leading into
    the Yamassee attacks of 1715 and subsequent English military retaliation.
  category: sequence
  evidence_refs:
  - ev:8
