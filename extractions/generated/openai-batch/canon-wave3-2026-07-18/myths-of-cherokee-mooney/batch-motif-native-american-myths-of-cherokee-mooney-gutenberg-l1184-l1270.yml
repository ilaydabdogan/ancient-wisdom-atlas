  text: The passage dates the first permanent English settlement in South Carolina
    to 1670, describes James Moore's 1690 expedition into the mountains near reported
    Spanish mining and smelting activity, and names Cornelius Dougherty as the first
    trader among the Cherokee.
  category: sequence
  evidence_refs:
  - ev:1
