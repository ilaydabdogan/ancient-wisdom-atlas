canonical_text:
  quote: ''
  summary: Mooney distinguishes sacred Cherokee myths from shorter animal stories,
    describes a former age when animals and plants spoke and held councils, notes
    that the mythic animals ascended to Galûñ'lati, identifies offices and traits
    of specific animals such as Frog, Rabbit, and Bear, and discusses localized legends,
    sparse historical traditions, and Cherokee storytelling practices.
  language: English
  quote_policy: summarized
