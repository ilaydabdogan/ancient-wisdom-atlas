canonical_text:
  quote: ''
  summary: This historical passage describes western Cherokee belief and legislation
    concerning witchcraft, unfulfilled treaty stipulations over Arkansas lands, boundary
    disputes, Cherokee dispersal and attempted movement into Texas, opposition to
    land exchange, and the 1828 Washington treaty exchanging the Arkansas tract for
    lands farther west under a promised permanent home and western outlet. It also
    summarizes treaty articles concerning removal of non-Cherokee populations, compensation,
    education, Sequoya, printing, mission reestablishment, laws, and surveying.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The western Cherokee are described as holding a firm belief in witchcraft,
    with related punishment or retaliation producing frequent tragedies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In 1824 a law made it murder to kill anyone for witchcraft and made accusation
    of witchcraft an offense punishable by whipping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A treaty required separate censuses of eastern and western divisions of the
    Nation and an annuity apportionment based on that census.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The western line of the Arkansas tract was left open until the quantity of
    land ceded in the East could be determined and matched in the western tract.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says these treaty promises remained unfulfilled because of government
    efforts toward further emigration or cession, state survey delays, and Osage objections
    to the proposed line.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: With boundaries unadjusted and annuities withheld, distress and dissatisfaction
    affected the western Cherokee.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some western Cherokee spread south of the Arkansas river, while others under
    The Bowl crossed Red river into Texas in an attempt to escape American jurisdiction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In 1825 the western Cherokee council passed a law imposing death on any tribal
    member who undertook to cede or exchange land belonging to the Nation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After negotiations and pressure on an 1828 Washington delegation, consent
    was obtained to exchange the Arkansas tract for seven million acres farther west
    and a perpetual outlet west.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Washington treaty preamble stated a desire by the United States to secure
    a permanent home for the Cherokee under a solemn guarantee, free from future territorial
    or state jurisdiction around or over it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Article 2 defined the new boundaries and required removal and future exclusion
    of whites and other populations from within or west of those boundaries so they
    would not annoy the Cherokee.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Other treaty articles provided payments for improvements, removal costs, inferior
    land quality, strayed stock recovery, spoliations, Sequoya's alphabet, education,
    a printing press, false imprisonment indemnity, and the Dwight mission's removal
    and reestablishment.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Article 6 promised plain laws and surveying for individual land ownership
    when desired by the Cherokee, and the article was annulled in 1833 at Cherokee
    request.
  category: action
  evidence_refs:
  - ev:9
