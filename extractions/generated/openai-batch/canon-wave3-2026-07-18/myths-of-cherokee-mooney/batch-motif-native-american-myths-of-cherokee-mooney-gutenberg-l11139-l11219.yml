canonical_text:
  quote: ''
  summary: Mooney discusses the difficulty of reconstructing Cherokee origin legends,
    the prominence of the Rabbit or Great White Rabbit in Cherokee and other animal
    stories, possible relations between Indigenous and African American tale traditions,
    and several recurring animal-story patterns including tar baby variants, Rabbit
    dining Bear, races between slow and fast animals, and predatory animals luring
    victims with song or dance.
  language: English
  quote_policy: summarized
