    States to remove the Cherokee by force.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Further open and secret efforts in 1827 and 1828 to induce cession or emigration
    failed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the Cherokee adopted a constitution as a distinct and sovereign Nation,
