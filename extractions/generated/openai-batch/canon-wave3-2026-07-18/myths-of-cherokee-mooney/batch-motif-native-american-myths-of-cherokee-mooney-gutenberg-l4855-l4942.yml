  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Around 1815 a Cherokee boy found a shining yellow pebble along the Chestatee
    River; after washing, it proved to be a gold nugget.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy's mother carried the gold nugget to the settlements and sold it to
