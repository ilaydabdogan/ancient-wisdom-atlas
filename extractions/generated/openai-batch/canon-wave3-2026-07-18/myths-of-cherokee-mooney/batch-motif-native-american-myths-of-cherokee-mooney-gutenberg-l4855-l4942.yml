canonical_text:
  quote: '"It is the fixed and unalterable determination of this nation never again
    to cede one foot more of land."'
  summary: The passage recounts pressure from Georgia and the United States to obtain
    Cherokee land cessions, Cherokee refusal and treaty-based arguments for remaining
    on their territory, Georgia officials' demands and threats, federal acknowledgment
    that removal by force was not required under the 1802 agreement, Georgia assertions
    of authority after the Cherokee constitution, and the discovery of gold in Cherokee
    country as a decisive added motive for dispossession.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Georgia exerted persistent pressure to obtain cession of Cherokee lands within
    its chartered limits, but repeated efforts were unsuccessful.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cherokee refused further cession, saying their remaining lands were needed
    for themselves and their children and declaring they would not cede any more land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Secretary of War Calhoun answered a Cherokee memorial by saying that, because
    Georgia objected to their presence, they must prepare for removal beyond the Mississippi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cherokee delegates John Ross, George Lowrey, Major Ridge, and Elijah Hicks
    argued that the 1802 agreement was conditional and required Cherokee voluntary
    consent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The delegates described the Cherokee as original inhabitants of America, living
    on their own treaty-defined territory, and said their interests required permanence
    where they were and retention of their lands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Governor Troup blamed missionaries for Cherokee refusal, said Georgia would
    not permit the Cherokee to become citizens, and demanded federal assistance in
    taking possession or resistance leading to bloodshed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Georgia congressional delegation censured the federal government for teaching
    the Indians arts of civilized life and encouraging a desire to acquire property.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A federal report stated that the United States had extinguished large portions
