canonical_text:
  quote: ''
  summary: A historical-biographical passage recounts Houston's move from Tennessee
    to Indian Territory, his relationships with the western Cherokee and Chief Jolly,
    his marriage to Talihina, a period of drunken misconduct followed by public apology
    and sobriety, his advocacy for Cherokee interests, his role in Texas politics
    and war, his defense of the Texas Cherokee, and his later refusal of dictatorial
    authority and Confederate allegiance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Houston moved from Tennessee to Indian Territory, where many Cherokee had
    already removed, and lived near Chief Jolly, principal chief of the western Cherokee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Despite heavy drinking after a major disappointment, Houston retained the
    affections of the Cherokee and standing with officers and families at nearby forts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After his former wife obtained a divorce, Houston married Talihina, the youngest
    daughter of Rogers and niece of Chief Jolly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Talihina is described as beautiful, educated above her surroundings, and welcome
    where her husband was received.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Houston started a trading store near Webbers Falls, continued dissipated habits,
    assaulted his adopted father in a drunken affray, was knocked unconscious, then
    made a public apology and thereafter lived soberly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In 1832 Houston visited Washington for the interests of the western Cherokee
    and called on President Jackson in Indian costume.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After being accused of connection with a fraudulent Indian contract, Houston
    beat his accuser, a member of Congress; he was fined and reprimanded, and Jackson
    remitted the fine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Houston moved to Texas, participated in conventions and provisional government
    formation, and was elected commander-in-chief to organize the militia.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At San Jacinto, Houston defeated Santa Ana's larger army; Santa Ana was among
    the prisoners, and Houston was severely wounded.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Houston was elected first president of the republic of Texas, later served
    in the Texas congress, and was reelected president.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: During his Texas service, Houston supported the cause of the Texas Cherokee
    without wavering and at risk to his popularity and position.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Houston declared that no treaty made and carried out in good faith had ever
    been violated by Indians.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: In 1842 Houston vetoed a bill that would have made him dictator for resisting
    a threatened invasion from Mexico.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: After Texas joined the Union, Houston served in the Senate and as governor;
    when Texas passed a secession ordinance, he refused the Confederate oath, was
    deposed, declined federal military aid to keep office, and retired from the struggle
    until his death.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
