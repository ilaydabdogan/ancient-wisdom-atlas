canonical_text:
  quote: "“Cowee will have a ball play with you!”"
  summary: The passage describes a war-dance custom in which warriors sing deeds to
    a drummer, a dramatic disclosure by Gûlsadihi' of treachery and killing at Cowee,
    a public challenge to battle, Cowee warriors organizing vengeance after their
    enemies flee, and subsequent notes on Cowee town, a Shawano former prisoner’s
    praise of Cowee, and Cherokee names for neighboring eastern or northern tribes.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In the dance, each warrior customarily tells a deed against an enemy by whispering
    words to a drummer, who then sings and drums with him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that joking or impossible performances sometimes occur
    in the dance and make the people laugh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man from the late war party sings that they went to Cowee, took scalps,
    and took the gun he carries while dancing; the chief and people laugh because
    they think it is a joke.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gûlsadihi', called the gunstocker, waits outside with Cowee men, removes his
    breechcloth, rushes naked into the townhouse, and gives words to the drummer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The drummer is identified as one of the traitors, but at first he does not
    recognize Gûlsadihi'.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gûlsadihi' dances around the circle, sings a question about who has done this,
    and makes insulting gestures toward everyone present.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Gûlsadihi' sings that he killed a pregnant woman at the ford and threw her
    body into the river; some men are surprised, while the chief says he is only joking.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Gûlsadihi' sings that the enemies they thought were from the north are actually
    present there; the drummer then understands and begins to drum slowly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gûlsadihi' says Cowee will have a ball play with them, which the passage glosses
