    starts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After Gûlsadihi' leaves the townhouse, the dancers become uneasy and leave;
    outside they meet Cowee men armed with guns and hatchets, and neither side speaks
    because they are on friendly ground.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Cowee men return home and organize warriors from Cowee and neighboring
    Middle settlements for vengeance on Chilhowee and Kuwâ'hi, but find that their
    enemies have abandoned their homes and fled.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage identifies Cowee, or Kawi'yi/Kawi', as the name of two Cherokee
