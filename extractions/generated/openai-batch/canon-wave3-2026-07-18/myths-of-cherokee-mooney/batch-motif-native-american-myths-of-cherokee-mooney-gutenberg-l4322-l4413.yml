literal_observations:
- id: obs:1
  text: Emigrant Cherokee in Arkansas became involved in land-claim difficulties with
    the Osage north of the Arkansas River and the Quapaw south of it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The government told the emigrant Cherokee that protection in their western
    home depended on a cession of part of their eastern territory.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A treaty was concluded on July 8, 1817, at the Cherokee agency, by which the
    Cherokee Nation ceded specified tracts in Georgia and Tennessee in exchange for
    an Arkansas tract for those who had removed or intended to remove.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The treaty provided that eastern and western Cherokee would still be considered
    one people and that a census would be taken to apportion annuities and other payments.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The United States agreed to compensate removing emigrants for abandoned improvements
    or, for certain emigrant warriors, with goods including a rifle, ammunition, blanket,
    kettle, or beaver trap.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The treaty commissioners were Andrew Jackson, David Meriwether, and Joseph
    McMinn; Cherokee signatories included principal men of the eastern Nation and
    representatives of the western band by proxy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Before conclusion of the treaty, sixty-seven Cherokee chiefs and headmen presented
    a memorial opposing cession and removal and asking to remain in peaceable possession
    of their ancestral land.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The memorial was not heeded; the treaty was carried through and ratified,
    and authorities organized removal for those who wanted to go west.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Boats were provided, emigrants were collected under Governor McMinn, and a
    large number emigrated by the end of 1819, though the chiefs disputed the reported
    number.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The quoted account states that many Cherokee east of the Mississippi were
    bitterly opposed to the treaty and viewed federal pressure as attempts to drive
    them from ancestral homes.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The quoted account uses the image of a nation being compressed within the
    contracting coils of a giant anaconda of civilization.
  category: other
  evidence_refs:
  - ev:11
- id: obs:12
  text: The quoted account says pro-emigration Cherokees became objects of scorn and
    hatred and that old dissensions later reappeared among descendants.
  category: relationship
  evidence_refs:
  - ev:12
