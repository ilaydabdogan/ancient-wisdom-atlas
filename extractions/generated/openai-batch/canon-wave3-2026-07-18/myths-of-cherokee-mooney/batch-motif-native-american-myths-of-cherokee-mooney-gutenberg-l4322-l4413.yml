  summary: The passage describes the 1817 treaty concerning Cherokee cessions in Georgia
    and Tennessee in exchange for lands in Arkansas, provisions for emigrants, Cherokee
    opposition through a memorial, government-organized removal, and later bitterness
    within the Nation. It includes a quoted historical reflection portraying the Cherokee
    as being compressed within the coils of a giant anaconda of civilization.
