canonical_text:
  quote: ''
  summary: 'The passage recounts several Cherokee accounts of Nûñne''hi encounters:
    a boy is hosted by a man later identified as a Nûñne''hi impersonator; Nûñne''hi
    women dance at Nottely and vanish at a river ford; drums and songs are heard in
    hills and high balds; warm vapor and a circular depression are explained as Nûñne''hi
    townhouses. It then describes the Yûñwi Tsunsdi'', or Little People, as cave-dwelling
    mountain spirits who drum, dance, help lost children, enforce taboos against disturbance,
    and require permission before people take found objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man takes a boy down a path bordered by a cornfield and peach orchard, directs
    him toward a ridge and river road, and after the boy looks back the cornfield,
    orchard, fence, and house are gone, leaving only trees on a mountain side.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the boy returns, people report searching for him since the previous day;
    Udsi'skala denies seeing him and says a Nûñne'hi made himself look like him; the
    boy's mother says there is no house there but drums are heard above.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Four Nûñne'hi women dance with young men at Nottely until about midnight,
    leave toward the river ford, and disappear at the water in view of watchers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Burnt-tobacco hears a drum and dance songs in hills beside the trail, rides
    toward the sound, and finds the sound apparently behind him, after which he flees
    toward Hemptown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Drumming is reported to have been often heard in the high balds in that neighborhood
    until nearly the time of the Removal.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A small hole like a well or chimney near Blood mountain emits warm vapor,
    and people say the warmth comes from a Nûñne'hi townhouse and fire under the mountain.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: A clean circular depression near the head of Tugaloo is said to be a Nûñne'hi
    townhouse; logs and rocks thrown into it are found thrown out until later logs
    remain, which is interpreted as abandonment by the Nûñne'hi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Yûñwi Tsunsdi', or Little People, are described as living in rock caves
    on the mountain side, knee-high, well-shaped, handsome, long-haired, wonder-working,
    and fond of drumming and dancing.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Little People are said to find people lost in the mountains, especially
    children, care for them, and bring them back home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Little People's drum may be heard in lonely mountain places, but following
    it or disturbing them at home is unsafe because they can place a spell that bewilders
    the stranger and leaves him dazed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: When the Little People are heard talking near a house at night, people must
    not go out; in the morning work such as gathered corn or a cleared field may be
    found, and watching would cause death.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A hunter who finds a knife or trinket in the woods must ask the Little People's
    permission before taking it, because otherwise they will throw stones at him.
  category: action
  evidence_refs:
  - ev:11
