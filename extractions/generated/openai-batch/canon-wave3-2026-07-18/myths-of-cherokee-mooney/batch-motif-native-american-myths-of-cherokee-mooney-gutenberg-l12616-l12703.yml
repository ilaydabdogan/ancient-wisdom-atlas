literal_observations:
- id: obs:1
  text: The deer is described as a principal dependence of Cherokee hunters and as
    prominent in myth, folklore, ceremonial practice, and clan naming.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Deer ghosts are said to cause rheumatism when hunters fail to placate them,
    while deer aid is invoked against frostbite.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After killing a deer, a hunter cuts out and discards the hamstring from the
    hind quarter to avoid becoming easily tired in travel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Little Deer is described as the powerful chief of the deer tribe, invisible
    except to the greatest masters of hunting secrets.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a deer is shot, the Little Deer arrives at the spot and asks the blood
    stains whether the hunter has asked pardon for taking the deer’s life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If the hunter has not made the prescribed prayer, the Little Deer follows
    the blood drops to the hunter’s house and puts the spirit of rheumatism into his
    body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Little Deer is described as pure white, small, antlered, accompanied by
    a large herd, immortal, and able to come to life again even if shot by a master-hunter.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The antlers of the Little Deer and small consecrated portions of them are
    described as talismans that bring hunting success and attract or daze deer.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Little Deer’s antler talisman is said to be dangerous if not treated with
    proper respect and kept secretly away from the house.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Consecrated down from young deer antlers is described as having talismanic
    influence over anything connected with deer.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Bears are described as transformed Cherokee of an old clan, and their chief
    is the White Bear living at Kuwâ'hi near the enchanted lake of Atagâ'hi.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The bears are said to have townhouses under mountain peaks where they gather
    and dance every fall before retiring to dens for winter.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Bears are described as really human and capable of speech; a mother bear was
    once heard singing to her cub in words understood by a hunter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The wolf is revered as the hunter and watchdog of Kana'ti, and a Cherokee
