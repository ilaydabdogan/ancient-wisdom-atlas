  summary: The passage first describes Creek peace or refuge towns, especially Kusa/Coosa,
    and compares them with a Seneca fort or city of refuge associated with a virgin
    queen called the Peacemaker. It then describes the adoption and legalization of
    scalping and mutilation by white pioneers and soldiers, with examples involving
    King Philip and Lovewell.
