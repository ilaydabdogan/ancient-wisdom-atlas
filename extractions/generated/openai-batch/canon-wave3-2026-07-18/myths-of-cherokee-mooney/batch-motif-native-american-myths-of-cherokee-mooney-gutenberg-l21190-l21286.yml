candidate_motifs:
- id: motif:1
  label: serpent bite introduces or causes death
  taxonomy_refs:
  - serpent
  basis: The Cherokee variants place a serpent bite soon after creation at the first
    death, with consequences for general mortality.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports variants through cited collectors rather than a full
    primary myth narration.
- id: motif:2
  label: failed resurrection through escaped spirit
  taxonomy_refs:
  - resurrection
  - death_rebirth
  - return
  basis: The people attempt to restore the dead woman's body by bringing back her
    spirit, but the spirit escapes from the box before reaching the body.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The resurrection is intended but fails in the Cherokee versions summarized
    here.
- id: motif:3
  label: journey to recover a soul from the land of the dead
  taxonomy_refs:
  - afterlife_journey_map
  - hero_descent
  - mystical_quest
  basis: Cherokee messengers travel to ghost country; Turkey-head reports a land of
    souls; the passage's parallels include kin traveling to spirit domains to retrieve
    relatives' souls.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The journeys differ in destination, route, success, and ritual detail
    across the cited traditions.
- id: motif:4
  label: soul or spirit enclosed in a portable object
  taxonomy_refs: []
  basis: The woman's spirit is confined in a box; the Shawano sister is held in a
    hollow reed; the Algonquian son's soul appears as a nut carried in a pouch or
    bag.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The specific containers and narrative outcomes differ.
- id: motif:5
  label: dead found dancing or heard at dance in spirit country
  taxonomy_refs: []
  basis: The Cherokee and Shawano dead females are found dancing, and the British
    Columbia spirit-world shore is associated with singing and dancing heard in the
    distance.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:7
  confidence: medium
  cautions: The British Columbia example mentions sound from the spirit world rather
    than locating the mother directly at the dance.
- id: motif:6
  label: spirit-world boundary requiring aid or loss of mortal condition
  taxonomy_refs:
  - hero_descent
  - initiation
  basis: The Shawano brother needs medicine and directions to enter the spirit world;
    in the British Columbia myth, a living person cannot enter until his mortal part
    is removed.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: This is a functional pattern across parallels, not an explicit Cherokee
    rule in the passage.
- id: motif:7
  label: serpent made to obtain hidden divine power
  taxonomy_refs:
  - serpent
  - forbidden_knowledge
  - sacred_theft
  basis: In the Egyptian legend, Isis creates a serpent to bite Râ so she can demand
    the secret of his power as the price of assistance.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This motif belongs to the Egyptian parallel cited in the passage, not
    to the Cherokee mortality episode.
- id: motif:8
  label: celestial beings address humans through kinship
  taxonomy_refs: []
  basis: The Sun calls the people grandchildren and the male-personified Moon calls
    them younger brothers.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage gives linguistic and personification notes rather than a full
    narrative episode.
comparison_claims:
- id: claim:1
  claim: 'The Hagar Cherokee variant shares the same basic motif as the Buttrick version:
    a dead woman''s dancing spirit is recovered from ghost country and placed in a
    box.'
  claim_level: same_motif
  target: Hagar Cherokee variant of the spirit-recovery story
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: Hagar's version adds four staves and a seven-day journey, details not
    present in the Buttrick summary.
- id: claim:2
  claim: 'The Shawano story shares a close motif pattern with the Cherokee versions:
    a male relative travels toward the spirit world, finds a dead female relative
    at a dance, and encloses her in a narrow container for return.'
  claim_level: same_motif
  target: Shawano myth of brother retrieving dead sister
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  counter_evidence_refs:
  - ev:5
  confidence: high
  limitations: The Shawano version succeeds and includes a beneficent helper, sacred
    rituals, and restoration to material bodies, while the Cherokee Buttrick version
    ends with the spirit's escape.
- id: claim:3
  claim: The New Brunswick Algonquian example shares the motif of a soul carried in
    a container and lost when the container is opened.
  claim_level: same_motif
  target: Algonquian myth of father's recovery of son's soul as a nut
  evidence_refs:
  - ev:2
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The soul appears as a nut in the Algonquian example, while the Cherokee
    woman's spirit is caught directly in a box.
- id: claim:4
  claim: The British Columbia myth shares the broader function of living kin seeking
    a dead relative's soul at a spirit-world boundary.
  claim_level: same_function
  target: British Columbia myth of two brothers seeking their mother's soul
  evidence_refs:
  - ev:2
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The British Columbia passage emphasizes exclusion from the spirit world
    and removal of the mortal part, rather than successful capture or failed escape
    of the soul.
- id: claim:5
  claim: The Egyptian Râ and Isis passage shares the image of a consequential serpent
