canonical_text:
  quote: ''
  summary: The passage gives Cherokee variants in which a serpent bite soon after
    creation causes death, attempts are made to recover a woman's spirit in a box,
    and the spirit escapes when the container is opened, ending hopes of immortality.
    It then records related examples from Shawano, Algonquian, British Columbia, and
    Egyptian traditions, followed by notes on the sky vault, Sun and Moon kinship
    terms, and the Little Men or Thunder Boys.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Buttrick's Cherokee version, soon after creation a member of the family,
    also described in another tradition as a young woman, is bitten by a serpent and
    dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first failure to restore life is said to doom the race to death and later
    misery; another version says that returning the woman's spirit to her body would
    have made the body live again and prevented general mortality.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Young men set out with a box to catch the woman's spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman's spirit is found dancing, caught in the box, and confined by closing
    the lid.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The spirit pleads for the box to be opened for light; near the body, the lid
    is opened slightly, the spirit flies out, and hopes of immortality are lost.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Hagar's variant, messengers carry four staves, travel seven days to the
    ghost country, find the woman dancing, strike her with successive staves, and
    place her in a box.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: An informant says Turkey-head returned from the land of souls after a snake
    struck him in the forehead; the dead first go eastward and then westward to the
    Land of Twilight in the western sky.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Shawano myth summarized in the passage, a brother travels west to where
    earth and sky meet to bring back his dead sister from the land of shadows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Shawano brother receives medicine and instructions from a beneficent spirit
    called grandfather, captures his sister at a dance in a hollow reed, and later
    both are made material beings again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the New Brunswick Algonquian myth, a father receives his son's soul as
    a nut from Papkootpawut, but the soul escapes when a woman opens the bag containing
    it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the British Columbia myth, two brothers cross a great lake toward the spirit
    world to seek their mother's soul, hear singing and dancing, and are stopped by
    a sentinel who says the living cannot enter or take her away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the Egyptian legend, Isis makes a sacred serpent from spittle and earth
    and sets it where Râ will pass; the serpent bites Râ and poison seizes him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage cross-references the sky vault to other numbered Cherokee myths.
  category: other
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Sun calls the people by a maternal-grandchild term, while the Moon calls
    them younger brothers and is personified as male in Cherokee mythology.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Little Men are identified as the Thunder Boys, sons of Kana'ti, and are
    described as beneficent wonder workers of great power.
  category: attribute
  evidence_refs:
  - ev:11
