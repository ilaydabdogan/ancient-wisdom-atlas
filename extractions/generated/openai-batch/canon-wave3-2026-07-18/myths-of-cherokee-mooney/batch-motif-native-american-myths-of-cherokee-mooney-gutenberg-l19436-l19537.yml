canonical_text:
  quote: ''
  summary: The passage first quotes an account of Herbert's Spring, whose water was
    said by some drinkers to enchant them so they could not leave the Cherokee country
    for seven years. It then introduces western North Carolina local legends and gives
    gazetteer-style entries for named places associated with water monsters, a fireball
    or ulûñsûti on a mountain, a storehouse-like rock formation destroyed by lightning,
    an underwater buffalo, a monster hornet, a monster fish, a war crossing, paired
    uktenas in a river, and the water monster Dâtsi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Herbert's Spring is described as a head spring of the Mississippi water near
    the head of the southern branch of the Savannah River, where strangers commonly
    drank.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people who stayed longer than intended reported that the spring had a
    bewitching quality by which anyone who drank could not leave the nation for seven
    years.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The account says some men used the spring's supposed enchantment as an explanation
    for remaining in the country, while some pack-horse men avoided drinking there
    to avoid renewing a loss of liberty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The section states that existing local legends are especially numerous in
    western North Carolina because Cherokee still occupy that area.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Akwe`ti'yi is identified as a Tuckasegee River spot where tradition placed
    a dangerous water monster.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Atsi'la-wa'i, translated as “Fire's relative,” is a peak where a ball of fire
    was said to have flown through the air and alighted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The fire at Atsi'la-wa'i is identified by belief as an ulûñsûti once hidden
    on the summit by its owner, and after the owner's death it issued nightly to search
    for him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Black Rock or Jones Knob is associated with a large flat rock supported by
    four other rocks like a raised storehouse, formerly on the summit until lightning
    threw it down.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: West Buffalo Creek is named Yûnsâi'i, “Buffalo place,” from a tradition that
    a buffalo formerly lived under the water at its mouth.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Cheowa Maximum and Swim Bald are called Sehwate'yi, “Hornet place,” because
    a monster hornet was said to have nested there, driven people away, and then disappeared.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Dakwâ'i is a place in the French Broad River where a dakwa' or monster fish
    is said to have lived.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Da'`nawa-(a) Sa'`tsûñyi, “War crossing,” is a ford where a hostile northern
    war party crossed the Cheowa River after killing a man and being pursued.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Datle'yasta'i, “Where they fell down,” is a Tuckasegee River place where two
    large uktenas, twined as if in combat, were once seen rising from a deep hole
    and falling back into the water.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Dâtsi'yi is named from Dâtsi, a traditional water monster said to have lived
    in a deep hole in the stream.
  category: relationship
  evidence_refs:
  - ev:14
