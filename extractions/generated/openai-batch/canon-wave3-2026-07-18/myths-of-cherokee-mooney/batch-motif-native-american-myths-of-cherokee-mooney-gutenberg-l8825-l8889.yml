  text: Xuala is described as the most northern point reached by De Soto and as territory
    of the Suwala or Sara Indians in the eastern foothills of the Alleghenies near
    the headwaters of the Broad and Catawba rivers in North Carolina.
  category: setting
  evidence_refs:
