  summary: The passage reconstructs the geography of De Soto’s northern route near
    Xuala, identifies mountain ridges, rivers, gaps, and settlements, argues that
    Guaxule was in Nacoochee valley rather than at Xuala, and discusses the Nacoochee
    mound, surrounding mounds, settlement remains, Cherokee and Creek claims, and
    possible linguistic origins of the name Nacoochee.
  language: English
