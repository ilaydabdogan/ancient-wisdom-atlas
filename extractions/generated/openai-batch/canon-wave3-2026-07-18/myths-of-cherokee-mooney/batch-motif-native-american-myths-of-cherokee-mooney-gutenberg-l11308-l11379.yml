canonical_text:
  quote: ''
  summary: The passage gives biographical notes on several East Cherokee story tellers
    and informants, especially A`yûñ'ini, Itagû'nahi, Suyeta, and Ta'gwadihi, describing
    their roles as keepers of tradition, ceremonial authorities, doctors, ministers,
    and sources for stories, songs, formulas, and lore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A`yûñ'ini, “Swimmer,” is presented as the first and chief story teller; nearly
    three-fourths of the stories and a large portion of other Cherokee material were
    obtained from him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A`yûñ'ini was trained to be a priest, doctor, and keeper of tradition, and
    was recognized as an authority in the band.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Green-corn dances, ballplays, and other tribal functions were said to be incomplete
    without A`yûñ'ini’s presence and active assistance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A`yûñ'ini recorded songs, sacred formulas, names of medicinal plants, and
    prescriptions in his native alphabet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A`yûñ'ini’s recitations included songs and imitations of the characteristic
    cries of birds or beasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A`yûñ'ini spoke no English, kept the moccasin and turban, and had a rattle
    described as his badge of authority.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A`yûñ'ini died in March 1899, was buried on the slope of a forest-clad mountain,
    and the author states that half the tradition of a people perished with him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Itagû'nahi, also known as John Ax, is described as the oldest man of the band,
    an authority on tribal custom, and an expert maker of rattles, wands, and other
    ceremonial paraphernalia.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Itagû'nahi preferred wonder stories of the giant Tsul`kalû', the great Uktena,
    and invisible spirit people, and also appreciated humorous animal stories.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Suyeta, “The Chosen One,” is a Baptist minister who does not deal much with
    the Indian supernatural but remembers and likes rabbit stories and similar stories.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Suyeta speaks no English but uses a system of his own to verify references
    in his Cherokee Bible with a concordance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ta'gwadihi', “Catawba-killer,” was a doctor who supplied valuable stories
    and confirmatory evidence for stories obtained from other sources.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Additional East Cherokee informants are named, including Ayâ'sta as a conservative
    woman and James and David Blythe as educated younger men who inherited lore from
    a ceremonial leader father.
  category: relationship
  evidence_refs:
  - ev:8
