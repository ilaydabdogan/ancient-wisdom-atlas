- id: obs:2
  text: The Tuscarora are said to have risen against whites in 1711, suffered heavy
    losses over about two years, and many fled to the Iroquois of New York, after
    which the Iroquois were known as the Six Nations.
  category: sequence
  evidence_refs:
  - ev:1
