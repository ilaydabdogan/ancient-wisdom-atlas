canonical_text:
  quote: ''
  summary: The passage recounts Cherokee and other Native alignment with the British
    during the Revolutionary War, British distribution of supplies and bounties, Cherokee
    and Tory raids on frontier settlements, Nancy Ward's warning and intervention
    for a captive woman, settlers taking refuge in forts, and the border states' plan
    for coordinated expeditions into Cherokee territory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Indian tribes were almost universally on the British side
    at the opening of the Revolutionary struggle, partly because they viewed British
    authority as protection against American border encroachment.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: British authorities issued clothing, goods, hatchets, guns, and ammunition
    and offered bounties for American scalps.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Cherokee message to Cameron said their warriors were ready to attack the
    back settlements of Carolina and Georgia, and circular letters directed royalists
    to join the Indians.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A British fleet attacked Charleston while Cherokee forces led by Tories in
    Indian disguise came down from the mountains and ravaged the South Carolina frontier.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nancy Ward warned that seven hundred Cherokee warriors in two divisions were
    advancing against the Watauga and Holston settlements.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Holston men defeated one Cherokee division near Long Island in the Holston,
    and the Watauga fort repulsed the second division.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mrs. Bean and a boy named Moore were captured; Moore was burned, while Mrs.
    Bean was rescued after Nancy Ward intervened.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other Cherokee detachments attacked upper settlements; one returned after
    finding inhabitants shut in forts, while another ravaged the Clinch River country
    and caused casualties.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cherokee of the Upper and Middle towns, with some Creeks and Tories led by
    Cameron, ravaged the South Carolina border, burned houses, drove off cattle, killed
    inhabitants, and caused people to flee to garrisoned forts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: One attacking force included Tories who were stripped and painted like Indians;
    the attack was repulsed and thirteen Tories were captured.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The border states planned a coordinated blow and equipped four expeditions
    to enter Cherokee territory from four directions.
  category: sequence
  evidence_refs:
  - ev:7
