canonical_text:
  quote: ''
  summary: 'The passage gives a Wahnenauhi version in which, after the world is brought
    up from under water, a man and woman are made, led around an island, and taught
    through repeated circuits while corn grows and ripens. It then presents a story
    introduced as the coming of sin: children discover their father''s secret cave
    of animals and their mother''s secret source of corn, release the animals, and
    are told that the parents must die and that the children must now hunt, plant,
    save seed, and make bread. The passage ends with the opening of an origin story
    for disease and medicine, describing an earlier time when humans and nonhumans
    spoke and lived peacefully until human population growth, weapons, killing, and
    trampling led animals to consult for safety.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the world is said to have been brought up from under the water, unnamed
    figures make a man and woman, lead them around the edge of the island, plant corn,
    and instruct the pair to repeat the circuit until the corn is ripe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A second story is introduced as explaining how sin came into the world, beginning
    with a man and woman raising many children in comfort and plenty.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father regularly goes out and returns quickly with a deer, turkey, or
    other animal or fowl, while the mother returns with a basket of ears of corn that
    she prepares into meal for bread.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grown children wonder about the ease of food provision and decide to watch
    and follow their parents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those following the father see him move a large stone, reveal a cave entrance,
    and call a deer from among many animals and birds inside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the father leaves, his sons move the heavy stone from the cave mouth,
    and many animals and birds rush out, scatter, and disappear into the wilderness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those following the mother see her enter a small cabin, place a basket on
    the ground, shake herself over it, and cause large ears of corn to fall into the
    basket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the meal, the father says he knows what the children have done, says
    that he must die, makes bows and arrows for them, and sends them to hunt the released
    animals.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mother says that because her secret has been found out she can do nothing
    more, that she will die, and that corn will come up wherever her body is dragged
    over the ground.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother instructs the children to make bread from the corn and always save
    some for seed and plant every year.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The following origin passage states that in old days beasts, birds, fishes,
    insects, plants, and people could all talk and lived together in peace and friendship.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: As people increase and spread over the earth, Man invents weapons and hooks
    and begins killing larger animals, birds, and fishes while smaller creatures are
    crushed or trampled.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The animals resolve to consult about measures for their common safety.
  category: action
  evidence_refs:
  - ev:7
