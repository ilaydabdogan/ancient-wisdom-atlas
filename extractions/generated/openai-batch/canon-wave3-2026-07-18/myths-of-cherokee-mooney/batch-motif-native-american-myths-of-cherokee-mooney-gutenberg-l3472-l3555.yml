canonical_text:
  quote: ''
  summary: The passage recounts early missionary and school efforts among the Cherokee,
    the establishment and disruption of Moravian and Presbyterian missions, and later
    U.S. treaty pressure that produced land cessions, road permissions, secret treaty
    articles, and Doublehead's execution by decree of Cherokee chiefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Except for Priber, the passage states that there is no authentic record of
    missionary work among the Cherokee before 1800.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Moravians are described as establishing the first permanent mission connected
    with the Cherokee, after earlier contacts with Indians near Savannah, the Delawares
    in Ohio, and Cherokee acquaintances near the upper Yadkin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Missionaries visited the Cherokee in 1799 and the following summer; a council
    at Tellico agency debated the matter and decided to open a mission.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rev. Abraham Steiner and Rev. Gottlieb Byhan began the mission work in April
    1801 at David Vann's residence, and Vann and Colonel Return J. Meigs materially
    aided the mission called Spring place.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the Cherokee wanted education for their children rather than
    new theology; the great council at Ustanali ordered the missionaries to organize
    a school within six months or leave, and a school was then opened.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Additional missions or schools were opened by J. Gambold and Gideon Blackburn;
    the Moravian missions were broken up by Georgia in 1834, and Blackburn's school
    was abandoned for lack of funds.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Despite a treaty promise in 1798 that the government would guarantee the remainder
    of Cherokee country forever, measures soon began to procure more land cessions
    and road privileges.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Cherokee chiefs protested further land sales, but pressure, chiefly through
    Colonel Meigs, led to three Tellico treaties in 1804 and 1805 that ceded more
    than eight thousand square miles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The 1804 and 1805 treaties exchanged Cherokee land cessions and road permissions
    for payments, goods, working implements, and annuities.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Secret treaty articles reserved valuable small tracts for Doublehead and Tollunteeskee,
    and those provisions were not included in the copy sent to the Senate for confirmation.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Doublehead was later killed for continued abuse of official position, according
    to a decree of the Cherokee chiefs, with Major Ridge selected as executioner.
  category: action
  evidence_refs:
  - ev:11
