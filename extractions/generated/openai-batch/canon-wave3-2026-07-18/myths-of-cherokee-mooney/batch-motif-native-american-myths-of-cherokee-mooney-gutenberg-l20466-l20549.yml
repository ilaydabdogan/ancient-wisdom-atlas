canonical_text:
  quote: ''
  summary: Ethnographic notes describe Cherokee and neighboring southern Indigenous
    beliefs and practices concerning beans, melons, tobacco, wild parsnip, poison
    ivy, brier, and ginseng, including food taboos, ritual tobacco use, poisonous
    and medicinal plants, plant conciliation, and ceremonial ginseng gathering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beans are described as a major food plant, and cracked-open cooked beans are
    sometimes rubbed by mothers on children's lips to make the children look smiling
    and good-tempered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the idea behind cracked beans resembles the Irish
    naming of a cracked boiled potato as a “laughing” potato.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Melons and squashes are not to be counted, closely examined, stepped over,
    or approached by someone who has eaten May-apple, because these acts are said
    to harm or wither the vines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tobacco is described as sacred incense and as a guarantee of solemn oaths
    in warfare, peace treaties, sales, engagements, hunting omens, spirit-driving,
    and medical practice.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tobacco is said to be smoked in a pipe or sprinkled on fire, not rolled into
    cigarettes and not smoked merely for pleasure; its Tuscarora cognate is analyzed
    as “fire to hold in the mouth.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The tobacco originally used by Cherokee, Iroquois, and other eastern tribes
    is identified as Nicotiana rustica, distinguished from commercial tobacco and
    from tobacco-like plants not used in the same way.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Wild parsnip root is associated with evil spells, a seven-piece omen procedure,
    secret poisoning of food, and suicide.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wild parsnip may be chewed and blown on the body before travel to prevent
    sickness, but snakes are said to resent its smell and bite the carrier; a root
    decoction is also used in sweat-bath steaming to drive away disease spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When approaching poison oak or poison ivy, a Cherokee person addresses it
    as “My friend,” and if poisoned rubs beaten crawfish flesh on the affected part.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: One brier variety is called “the breeder” because a thorn left in the flesh
    is believed to breed more thorns.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ginseng is called “the mountain climber” and is addressed by priests as “Little
    Man” and “Little Man, Most Powerful Magician,” with the sacred term linked to
    the root's frequent resemblance to a human body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ginseng is treated as sentient and able to become invisible to unworthy gatherers;
    the first three plants found are passed by, the fourth is taken after prayer,
    and a bead is left in the hole as payment to the plant spirit.
  category: sequence
  evidence_refs:
  - ev:7
