canonical_text:
  quote: ''
  summary: The passage contains the conclusion of a story in which Ganogwioeoñ is
    aided at night by unseen helpers who feed, warm, and guide him home, later revealing
    themselves as a white wolf and a black wolf because he had formerly shared meat
    with them. It then presents Hatcinoñdoñ's escape from Cherokee pursuers, his removal
    by two Sky People to the house of Haweñni'o the Thunder-god above the sky vault,
    his meal of self-renewing food, the visit of the Sun, Thunder's instruction to
    stop fighting, and Hatcinoñdoñ's return to his warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganogwioeoñ sleeps in another hollow tree; unseen beings lick his feet, lie
    on each side of him to keep him warm, and tell him he will find food at noon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At noon Ganogwioeoñ finds a burning log near a dead bear, skins the bear,
    roasts meat, and later hears the night visitors say he now has plenty to eat and
    will get home safely.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The night visitors say Ganogwioeoñ's feet are well but he will be cold; he
    later finds two young bears just killed and makes leggings from their skins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ganogwioeoñ next finds two fawns just killed, makes moccasins from their skins,
    carries meat, makes a fire, and eats supper.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The helpers say they aided Ganogwioeoñ because he had given them the best
    part of hunted meat; in the morning they appear first as two men, then as a white
    wolf and a black wolf, and Ganogwioeoñ reaches home that day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hatcinoñdoñ is described as a great Seneca warrior who leads a company against
    the Cherokee; when discovered, he runs into canebrakes, and his pursuers set fire
    to one patch while he escapes into another.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: While Hatcinoñdoñ sleeps in the second canebrake, two men take him by the
    arm and carry him above the sky vault to a house with no visible door; a voice
    invites him in, and a door opens by itself.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Inside the house sits Haweñni'o, the Thunder-god; he gives Hatcinoñdoñ half
    portions of bread, wild apple, and pigeon, and as Hatcinoñdoñ eats, the food becomes
    whole again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Sun enters the house so brightly that Hatcinoñdoñ lowers his head; Thunder
    identifies the Sun as one who watches the world below and is hurrying east while
    it is night below.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Thunder says he loves both the Seneca and the Cherokee and tells Hatcinoñdoñ
    to tell the warriors to stop fighting and go home; the Sky People return Hatcinoñdoñ
    to his sleeping place, but after he reports the event, the warriors decide to
    strike the enemy once before going home.
  category: sequence
  evidence_refs:
  - ev:10
