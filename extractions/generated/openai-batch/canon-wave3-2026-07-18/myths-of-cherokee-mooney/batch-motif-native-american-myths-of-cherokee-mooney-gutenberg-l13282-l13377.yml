canonical_text:
  quote: ''
  summary: 'The passage contains several short animal-origin narratives: Rabbit tricks
    Deer into damaging his teeth, Deer later strands Rabbit beyond a magically enlarged
    stream, the animals burn Mink and thereby explain his black color and smell, and
    Mole uses underground travel to remove a sleeping woman''s heart so that she is
    compelled toward a man, after which jealous magicians threaten Mole and he remains
    underground.'
  language: English
  quote_policy: summarized
