    they are worn down near the gums, and Deer can no longer bite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that ever since then Deer's teeth are blunt and he can
    chew only grass and leaves.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Deer, angry about his teeth, pretends friendship and challenges Rabbit to
    jump across a stream.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rabbit jumps across the stream; Deer stops on the bank and conjures the stream
