    or excited.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: A man loves a woman who rejects him, and he becomes sick from thinking about
    it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Mole burrows underground to the sleeping girl, removes her heart, returns,
