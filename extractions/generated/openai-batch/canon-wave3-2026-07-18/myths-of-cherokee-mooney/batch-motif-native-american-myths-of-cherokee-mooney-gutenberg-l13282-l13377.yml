  text: Rabbit bites through a grapevine where he had already gnawed it, while Deer
    watches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Deer tries to imitate Rabbit against an ungnawed grapevine and is thrown down,
    bruised, and bleeding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
