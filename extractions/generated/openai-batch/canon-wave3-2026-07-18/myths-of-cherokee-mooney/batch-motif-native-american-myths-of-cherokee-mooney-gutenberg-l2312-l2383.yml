canonical_text:
  quote: ''
  summary: The passage gives a historical description of frontier fighters and recounts
    Cherokee raids after Kings Mountain, the raising of Holston mounted riflemen under
    Arthur Campbell and John Sevier, Sevier's ambush at Boyds Creek, the destruction
    of Cherokee towns and provisions, peace talks sent through Nancy Ward, a warning
    proclamation to Cherokee chiefs, and the surrender of several white prisoners
    during peace discussions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes border men in buckskin as white by blood and tradition
    but partly Indian in habit and instinct, combining farming and armed frontier
    activity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fighters are described as trusted-led, skilled in Indian warfare, horse
    riding, marksmanship, hardship, and equipped with hunting shirts, animal-skin
    caps or felt hats, rifles, tomahawks, and scalping knives.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the strike at Kings Mountain, the border men had left their homes unprotected,
    and news arrived that Cherokee bands were attacking upper settlements.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Holston settlements of Virginia and Tennessee raised seven hundred mounted
    riflemen under Colonel Arthur Campbell and Colonel John Sevier.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sevier began with nearly three hundred men, moved south along the great Indian
    war trail, and drove small Cherokee parties ahead of him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Boyds Creek, Sevier ordered a half-circle formation and sent scouts ahead,
    whose attack and feigned retreat drew Cherokee fighters into the trap.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the Boyds Creek ambush, the passage reports thirteen Cherokee dead,
    plunder abandoned, and no white casualties.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Campbell joined Sevier, and the combined force crossed the Little Tennessee
    below Echota while Cherokee watchers expected them at a different ford.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The combined force divided into two bodies and proceeded to destroy towns
    along the river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Cherokee chiefs sent peace talks through Nancy Ward, described as a Cherokee
    woman who had befriended the whites in 1776.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Campbell gave an evasive response to the peace overtures until he could destroy
    towns on lower Hiwassee whose warriors were described as particularly hostile.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Troops destroyed Hiwassee and Chestuee, including stores of provisions, while
    Cherokee people fled and kept spies watching the troops.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: One Cherokee spy was giving signals from a ridge by beating a drum and was
    shot by the whites.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: One soldier was buried in an Indian cabin, and the cabin was burned to conceal
    the burial.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The return march began on New Year's Day after ten principal towns, including
    Echota, several smaller villages, more than one thousand houses, corn, and other
    provisions had been destroyed or wasted.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: A proclamation warned Cherokee chiefs to make peace or face a worse visitation.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Some Cherokee met the returning force at Echota to talk peace and surrendered
    several white prisoners.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The passage says slight resistance may have resulted from many Cherokee warriors
