canonical_text:
  quote: ''
  summary: 'The passage recounts several Native relocations away from English or American
    pressure into Spanish or British-protected territories, then describes Cherokee
    westward movements across the Mississippi: an older tradition of a group led by
    Yûñwi-usga''se`ti, a 1782 request for Spanish permission to settle west of the
    Mississippi, and Washburn''s account of The Bowl''s party remaining permanently
    in the West after the Scott party violence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says several tribes viewed English and American advance with distrust
    and moved toward territories held or protected by Spain or Britain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Examples of relocation include Alabama and Koasati movements across or beyond
    the Mississippi, Lower Creek movement into Spanish Florida, Iroquois flight to
    Canada, and Shawano and Delaware settlement under Spanish permission near Cape
    Girardeau.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old Cherokee tradition says a portion of the tribe, led by Yûñwi-usga'se`ti,
    refused relations with the white man and marched toward the unknown West.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same tradition says communication with the western Cherokee group continued
    until after they crossed the Mississippi, after which they were lost sight of
    and later rumored to live near the Rocky Mountains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In 1782 Cherokee who had fought on the British side asked the Spanish governor
    at New Orleans for permission to settle west of the Mississippi, and permission
    was granted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Washburn's account connects the first permanent Cherokee settlement beyond
    the Mississippi with the 1794 Scott party violence at Muscle Shoals and states
    that whites first intoxicated and swindled the Indians, then killed two of them
    before the remaining Indians killed the white men on the boat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Bowl's party spared the women, children, enslaved people, and personal
    belongings, and escorted them down the Tennessee, Ohio, and Mississippi rivers
    as far as the mouth of the St. Francis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cherokee chiefs repudiated The Bowl party's action and offered assistance
    in arresting those concerned; although the party was exonerated, they refused
    to return because of bitterness, rich soil, and abundant game, and others later
    joined them.
  category: sequence
  evidence_refs:
  - ev:6
