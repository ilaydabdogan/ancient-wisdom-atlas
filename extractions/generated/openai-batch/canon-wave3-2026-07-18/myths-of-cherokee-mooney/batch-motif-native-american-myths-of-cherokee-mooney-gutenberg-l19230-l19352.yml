- id: ev:8
  type: summary
  locator: 19311-19316
  quote_or_summary: The Wren is the birds' messenger, gathers news from houses, and
    reports whether a newborn is a boy or a girl to the bird council.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain; source metadata indicates full text allowed.
- id: ev:9
  type: summary
  locator: 19316-19327
  quote_or_summary: Birds mourn a boy's birth because he will later hunt and roast
    them, but rejoice at a girl's birth because she will later leave stray grains
    while preparing cornmeal.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain; source metadata indicates full text allowed.
- id: ev:10
  type: summary
  locator: 19328-19334
  quote_or_summary: Cricket is glad when a girl is born and laments when a boy is
    born because boys shoot crickets and grasshoppers with little bows.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain; source metadata indicates full text allowed.
- id: ev:11
  type: summary
  locator: 19335-19337
  quote_or_summary: 'Cherokee inquiry about a newborn''s sex is phrased as object
