- id: ev:7
  type: summary
  locator: 19296-19309
  quote_or_summary: A baby song says that Bear is very bad and was very bad long ago.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
