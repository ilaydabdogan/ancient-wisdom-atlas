- id: ev:12
  type: summary
  locator: 19339-19344
  quote_or_summary: The Raven Mocker is described as a dreaded Cherokee witch or wizard
    of either sex who robs a dying person of life and often appears old or withered
    from added lives.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain; source metadata indicates full text allowed.
- id: ev:13
  type: summary
  locator: 19345-19350
  quote_or_summary: At night the Raven Mocker flies in fiery shape with outstretched
    arms, trailing sparks, a rushing sound, and a raven-like cry that frightens listeners.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain; source metadata indicates full text allowed.
- id: ev:14
  type: summary
  locator: 19350-19352
  quote_or_summary: At the sick person's house, Raven Mockers may enter invisibly
    unless a doctor drives them away; they torment and kill the sick person, sometimes
