canonical_text:
  quote: ''
  summary: 'The passage contains several Cherokee narrative and song items: a prophet
    exposed as fraudulent after investigators find him in a beaver lodge with peacock
    feathers; mother bear songs heard by hunters in caves; a baby song about Bear;
    animal responses to the birth of human boys or girls, led by the Wren and echoed
    by the Cricket; and a description of the Raven Mocker, a dreaded witch or wizard
    who steals life from the sick or dying.'
  language: English with Cherokee song text and English translations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Cherokee who saw another peacock in white settlements recognized the prophet
    as a fraud and told friends, who decided to investigate.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a night dance, the prophet delivered a new message said to be from the
    stars and then said he had to return to the sky.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Spies followed the prophet in darkness, saw him dive into the river, and later
    a party found a beaver lodge under the bank where a diver found the prophet with
    peacock feathers beside him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hunter heard singing in a cave and saw a mother bear singing to her cubs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The mother bear instructed the cubs by song to go upstream if hunters came
    down the creek and downstream if hunters came up the creek.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Another hunter followed what sounded like a woman singing to a baby and found
    a mother bear in a cave rocking her cub and singing a baby song.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The baby song is said to have been known by the Ani'-Tsâ'gûhi before they
    were turned into bears.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A baby song says that Bear was very bad long ago.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Wren is described as the birds' messenger, gathering news from houses
    and reporting a newborn child's sex to the bird council.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The birds lament the birth of a boy because he will later hunt and roast them,
    but they rejoice at the birth of a girl because she will later leave stray grains
    where she prepares cornmeal.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Cricket rejoices at the birth of a girl but laments the birth of a boy
    because boys shoot crickets and grasshoppers with small bows.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Cherokee are said to ask about a newborn's sex using paired object phrases
    such as bow versus meal sifter, or ballsticks versus bread.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Raven Mocker is described as a dreaded Cherokee witch or wizard that robs
    a dying person of life; Raven Mockers may be of either sex and are usually old
    or withered from added lives.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: At night the Raven Mocker flies through the air in fiery form, with arms outstretched
    like wings, sparks trailing behind, a rushing sound, and a raven-like cry.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: At the house of a sick person, Raven Mockers wait and, unless driven away
    by a knowledgeable doctor, enter invisibly and torment or kill the sick person,
    sometimes throwing him from the bed to the floor.
  category: sequence
  evidence_refs:
  - ev:14
