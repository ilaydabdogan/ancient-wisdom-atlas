canonical_text:
  quote: ''
  summary: The passage is a set of notes on Cherokee myths and customs. It quotes
    early descriptions of courtship and marriage negotiation; explains a belief that
    revealing supernatural secrets, or discovering a wizard's deeds, can cause death;
    glosses a Cherokee expression comparing smoothness to a pumpkin; identifies cross-references
    involving a large turtle, a horse, snake bracelets, a haunted whirlpool, Yahula,
    water cannibals, witches, and first-contact stories; and notes several parallels
    within Cherokee traditions and with European fairy lore.
  language: English
  quote_policy: summarized
