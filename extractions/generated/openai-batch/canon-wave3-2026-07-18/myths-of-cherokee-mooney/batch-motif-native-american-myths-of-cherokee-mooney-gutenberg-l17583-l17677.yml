canonical_text:
  quote: ''
  summary: 'The passage first relates how The Owl, condemned to be burned, asks to
    sing a death song, receives a tomahawk, uses the performance to kill two men,
    escapes to the Cherokee camp, and the treaty is concluded. It then gives an origin
    story for the Yontoñwisas dance: two Seneca sisters and a baby are captured by
    a Cherokee war party, escape at night, are guided home by a voice that provides
    directions and food, and finally learn that the speakers are the Hadionyageonoñ,
    the Sky People, who instruct them to establish a women-only song and dance.'
  language: English
  quote_policy: summarized
