canonical_text:
  quote: ''
  summary: Mooney’s notes discuss beliefs that food can transfer qualities or nature
    to the eater, hunting songs addressed to animals or lords of game, bear-associated
    mountains and healing places, and parallels to the Cherokee story “The Bear Man”
    in Creek, Iroquois, Pawnee, Jicarilla, European, and oriental folklore. The passage
    also notes animal reincarnation, thought reading in medicine contexts, and famine
    among animal tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports a belief that the qualities of food or of objects perceived
    by the senses can be transferred into people and animals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that continued adherence to a bear-like diet can give the
    eater bear nature, and possibly bear form and appearance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a period of eating “white man’s food” can give an
    Indian the white man’s nature and make Indian doctors’ remedies and spells ineffective
    on him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage directs readers elsewhere for explanation of animal reincarnation.
  category: other
