canonical_text:
  quote: ''
  summary: The passage recounts several 1813-1814 Creek War actions involving U.S.
    forces, Cherokee and other Indigenous allies, including a Hillabee peace embassy
    followed by an unsanctioned surprise attack, destruction of Autossee and Holy
    Ground, Jackson's retreat after battles near the Tallapoosa, and Floyd's retreat
    at Caleebee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people of Hillabee town sent messengers to Jackson's camp asking for peace,
    and Jackson granted the request.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the Hillabee peace messengers were returning home, General White's east
    Tennessee army, with four hundred Cherokee under Colonel Gideon Morgan and John
    Lowrey, surrounded Hillabee and took it by surprise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hillabee inhabitants had made no preparation for defense because they
    trusted the success of the peace embassy; sixty warriors were killed, more than
    two hundred and fifty prisoners were taken, and the attackers suffered no loss.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: White's official report says that part of his force and the Cherokee under
    Morgan were sent ahead to surround the town, and it praises Morgan and the Cherokee
    under his command.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Because the Creeks did not know the Hillabee attack was made without Jackson's
    sanction or knowledge, they concluded that peace overtures were useless and thereafter
    did not discuss surrender before the close of the war.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: General Floyd's Georgia army, including friendly Indians chiefly Lower Creeks
    under McIntosh, took and destroyed Autossee, killed about two hundred warriors,
    and burned four hundred houses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: General Claiborne, assisted by friendly Choctaws, defeated Creeks at Ecanachaca
    or the Holy Ground, and the town, another nearby town, provisions, and other property
    were destroyed; the passage says Cherokee involvement in this action is doubtful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Jackson's reduced force employed Cherokee to garrison Fort Armstrong and protect
    his provision depot; after receiving reinforcements, including friendly Creeks
    and more Cherokee, he advanced toward towns on the Tallapoosa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Emukfaw creek, Jackson's force was suddenly attacked; the Creeks were broken
    only with help from friendly Indians coming from the rear, and Jackson retreated
    to Fort Strother while carrying wounded men on horse-hide litters.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Enotochopco creek, the Creeks attacked Jackson's army again, were driven
    back by close-range grapeshot, and Jackson's army continued its retreat to Fort
    Strother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports that the Creeks claimed victory after these battles and
    contrasts an estimated Creek force of not more than five hundred warriors with
    Jackson's probable force of at least twelve hundred men including Indians.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: General Floyd later advanced again from Georgia but was surprised on Caleebee
    creek and compelled to retreat, leaving the enemy in possession of the field.
  category: action
  evidence_refs:
  - ev:10
