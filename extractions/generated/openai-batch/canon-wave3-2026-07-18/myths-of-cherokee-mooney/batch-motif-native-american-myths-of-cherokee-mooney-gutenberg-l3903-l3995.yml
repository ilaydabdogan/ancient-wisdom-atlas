canonical_text:
  quote: ''
  summary: A historical account describes Jackson's attack on the Creek fortification
    at Horseshoe Bend/Tohopeka in March 1814. The passage details the river-bend geography,
    the Creek breastwork and canoes, the forces involved, the cannonade, and the role
    of Cherokee and other allied forces in crossing the river, burning buildings,
    blocking escape, and attacking from within the bend.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jackson moved down the Coosa River, built Fort Williams, and marched toward
    the Horseshoe Bend of the Tallapoosa where Creek forces were reported to be gathered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Tohopeka, the Tallapoosa River formed a bend enclosing a narrow peninsula
    of roughly eighty to one hundred acres, with an island below and Emukfaw Creek
    nearby.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Creeks had built a strong log breastwork across the neck of the peninsula,
    with houses behind it and canoes moored at the bank for possible retreat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fort was defended by about one thousand warriors and included about three
    hundred women and children; Jackson's force numbered about two thousand men, including
    about five hundred Cherokee, and had two small cannon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jackson assigned General Coffee, mounted men, and most of the Indian force
    to cross below the bend and surround it so that escape in that direction would
    be prevented.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jackson placed cannon on a rise near the breastwork and directed cannon and
    small-arms fire at the fortification and its defenders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The breastwork is described as five to eight feet high, compactly built, supplied
    with a double row of portholes, and arranged to expose approaching enemies to
    crossfire.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Captain Russell's spies and a Cherokee party led by Colonel Richard Brown
    and conducted by Colonel Morgan crossed to the peninsula in canoes, set fire to
    some buildings, and fired on the defenders behind the breastwork.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Coffee reported that some allied Indians kept firing across the river while
    others swam over for canoes, brought the canoes back, embarked, and landed in
    the bend.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Coffee reported that Morgan, Kerr, Russell, and others were among the first
    to cross, advanced into the village, and drove the enemy from the huts toward
    the fortified works.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Morgan reported that Cherokee forces took assigned positions along the bank
    and that fugitives attempting to escape by water were overtaken there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Morgan reported that Cherokee swimmers retrieved canoes from the town, ferried
    others across under cover of gunfire, sheltered under the bank, and then advanced
    while under attack from multiple sides.
  category: sequence
  evidence_refs:
  - ev:6
