candidate_motifs:
- id: motif:1
  label: Mythic serpent with lethal or dangerous radiance
  taxonomy_refs:
  - serpent
  basis: Uktena is a huge horned serpent with a blazing crystal and light that dazes
    victims; even seeing it asleep brings death to the viewer’s family.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage describes the danger but does not provide a complete encounter
    narrative in this excerpt.
- id: motif:2
  label: Serpent jewel or crystal granting power
  taxonomy_refs:
  - serpent
  - wisdom
  basis: The Ulûñsû'ti from Uktena’s forehead can make its possessor a great wonder
    worker and is used for life prophecy.
  evidence_refs:
  - ev:9
  - ev:15
  confidence: high
  cautions: The exact procedure by which Âgan-uni'tsi won the crystal is not included
    in this passage.
- id: motif:3
  label: Quest for dangerous power object
  taxonomy_refs:
  - mystical_quest
  basis: Many daring warriors sought the Ulûñsû'ti, but only Âgan-uni'tsi returned
    successful, and the attempt is said to be worth a man’s life.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage summarizes the quest outcome rather than narrating the quest
    episode.
- id: motif:4
  label: Human transformed into serpent agent
  taxonomy_refs:
  - shapeshifter
  basis: The Little Men change a man into Uktena, and the spreading adder is also
    said to have formerly been a man transformed into a snake.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The transformations are imposed or instrumental; the passage does not
    describe voluntary shapeshifting.
- id: motif:5
  label: Angry celestial figure sends destroying sickness
  taxonomy_refs:
  - divine_judgment
  basis: The Sun becomes angry at people on earth and sends sickness to destroy them.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The reason for the Sun’s anger and the wider story context are not included
    in this excerpt.
- id: motif:6
  label: Blood-fed living power object
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The Ulûñsû'ti must be regularly fed with animal blood; if neglected, it emerges
    to seek human lifeblood.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage presents feeding as maintenance and danger-aversion; whether
    it should be classified as sacrifice or exchange needs human review.
- id: motif:7
  label: Prophetic mirror or crystal
  taxonomy_refs:
  - wisdom
  basis: The future is seen mirrored in the clear crystal, allowing the conjurer to
    know outcomes of illness, battle, and lifespan.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The passage gives examples of prophecy but not a full divination ritual
    beyond consultation and feeding.
- id: motif:8
  label: Death omen serpent
  taxonomy_refs:
  - serpent
  basis: Seeing the ground snake is said to foretell death for the viewer or tribal
    calamity when seen by several people.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The ground snake legend is only briefly reported.
- id: motif:9
  label: Rain-making through snake-associated practice
  taxonomy_refs:
  - serpent
  basis: Hanging a blacksnake body on a tree is believed to bring rain within three
    or four days, and ownership of the Ulûñsû'ti is also said to ensure success in
    rain-making.
  evidence_refs:
  - ev:2
  - ev:15
  confidence: medium
  cautions: The passage notes possible white derivation for the blacksnake belief
    and does not describe the rain-making procedure with the crystal.
