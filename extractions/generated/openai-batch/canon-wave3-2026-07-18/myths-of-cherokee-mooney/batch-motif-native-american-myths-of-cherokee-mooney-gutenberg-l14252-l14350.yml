canonical_text:
  quote: ''
  summary: The passage records Cherokee beliefs about several snakes and then narrates
    the origin, qualities, dangers, keeping, and prophetic use of the Uktena’s blazing
    forehead crystal, the Ulûñsû'ti.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The copperhead is feared for its poisonous bite, hated rather than venerated,
    believed to descend from a great mythic serpent, and said to have intensely bright
    eyes described as fire-like.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blacksnake is called “the climber”; biting its body is said to prevent
    toothache, and hanging one on a tree is believed to bring rain within three or
    four days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The small greensnake shares a name with a plant whose leaves resemble it;
    pressing the teeth four times along the snake’s body without injuring it is said
    to prevent toothache and ensure sound teeth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A rare wood snake resembling the water moccasin but with blue eyes is said
    to have great supernatural powers, though the passage does not specify them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The spreading adder is described as formerly a man transformed into a snake
    to destroy the Daughter of the Sun; because it failed, it is generally despised.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A legend of a great serpent called the ground snake says that seeing it was
    an omen of death for the viewer, or of tribal calamity if several people saw it.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the Sun became angry and sent sickness to destroy the people, the Little
    Men changed a man into the monster snake Uktena and sent him to kill her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Uktena failed in his mission; after the Rattlesnake was sent instead, Uktena
    became jealous and angry, and the people had him taken to Galûñ'lati with other
    dangerous things.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Other large dangerous Uktena remained behind and are said to hide in deep
    river pools and lonely high mountain passes.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Uktena is described as a huge snake as large around as a tree trunk, horned,
    with a bright diamond-like crest on its forehead, glittering scales, colored rings
    or spots, and a single vulnerable seventh spot from the head.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Ulûñsû'ti is the blazing transparent diamond on the Uktena’s forehead;
    a person who wins it may become a great wonder worker, but attempting to take
    it is life-threatening.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Whoever is seen by the Uktena is dazed by its bright light and runs toward
    it; seeing the Uktena asleep is said to bring death to the viewer’s family.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: Among those who sought the Ulûñsû'ti, only Âgan-uni'tsi is said to have returned
    successful, and the East Cherokee are said still to keep the crystal he brought.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The kept Ulûñsû'ti is described as a large transparent crystal, nearly shaped
    like a cartridge bullet, with a blood-red streak through its center.
  category: object
  evidence_refs:
  - ev:11
- id: obs:15
  text: The owner keeps the Ulûñsû'ti wrapped in a whole deerskin, inside an earthen
    jar, hidden in a secret mountain cave.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:16
  text: Every seven days the owner feeds the crystal with the blood of small game;
    twice a year it must receive blood from a deer or another large animal.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: If not fed on time, the Ulûñsû'ti is said to come from its cave at night in
    a fiery form and fly through the air to drink the lifeblood of the conjurer or
    one of his people.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: The owner may avert that danger by telling the Ulûñsû'ti it will not be needed
    for a long time; it then sleeps without hunger until next brought out and fed
    before use.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:19
  text: No white man may see the Ulûñsû'ti, and no person except the owner will approach
    it because of fear of sudden death.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:20
  text: The conjurer who keeps the Ulûñsû'ti fears it and changes its hiding place
    so it cannot learn the way out.
  category: action
  evidence_refs:
  - ev:14
- id: obs:21
  text: When the owner dies, the Ulûñsû'ti is to be buried with him; otherwise it
    comes out like a blazing star to search for his grave for seven years, then sleeps
    forever if it cannot find him.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:22
  text: Owning the Ulûñsû'ti is said to ensure success in hunting, love, rain-making,
    and every other business, with its greatest use being life prophecy.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:23
  text: When consulted for prophecy, the future appears mirrored in the clear crystal,
    allowing the conjurer to know whether a sick person, warrior, or youth will live
    or return.
  category: action
  evidence_refs:
  - ev:15
