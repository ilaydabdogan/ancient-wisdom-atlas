- id: ev:1
  type: summary
  locator: 14252-14258
  quote_or_summary: The copperhead is feared for poisonous bite, hated rather than
    venerated, believed to descend from a great mythic serpent, and said to have “eyes
    of fire.”
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary and short excerpt allowed.
- id: ev:2
  type: summary
  locator: 14258-14262
  quote_or_summary: The blacksnake is called “the climber”; biting its body prevents
    toothache, and hanging one on a tree is believed to bring rain within three or
    four days.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary and short excerpt allowed.
- id: ev:3
  type: summary
  locator: 14262-14272
  quote_or_summary: The small greensnake shares a name with a similar-looking plant;
    pressing the teeth four times along its body without injury is said to prevent
    toothache, with some variants requiring four snakes and a food taboo.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary and short excerpt allowed.
- id: ev:4
  type: summary
  locator: 14272-14276
  quote_or_summary: The water moccasin is not specially regarded, but a rare blue-eyed
    wood snake resembling it is considered to have great unspecified supernatural
    powers.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:5
  type: summary
  locator: 14276-14282
  quote_or_summary: The spreading adder is called “vomiter,” was formerly a man transformed
    into a snake to destroy the Daughter of the Sun, and is despised for failing.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary and short excerpt allowed.
- id: ev:6
  type: summary
  locator: 14284-14289
  quote_or_summary: A Wahnenauhi legend says a great serpent called the ground snake
    was an omen of death to one viewer and of tribal calamity if seen by several people.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:7
  type: summary
  locator: 14293-14304
  quote_or_summary: When the Sun angrily sent sickness to destroy people, the Little
    Men changed a man into Uktena and sent him to kill her; after he failed, Rattlesnake
    was sent, and Uktena was taken to Galûñ'lati with other dangerous things.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:8
  type: summary
  locator: 14304-14308
  quote_or_summary: Uktena left others nearly as large and dangerous, hiding in deep
    river pools and lonely high mountain passes called places where Uktena stays.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:9
  type: summary
  locator: 14310-14319
  quote_or_summary: Uktena is described as tree-trunk-sized, horned, with a blazing
    diamond on the forehead, fire-like glittering scales, colored spots, and a vulnerable
    seventh spot containing its heart and life.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:10
  type: summary
  locator: 14319-14324
  quote_or_summary: The Ulûñsû'ti can make its winner a great wonder worker, but the
    Uktena’s bright light dazes a person into running toward it, and seeing it asleep
    brings death to the viewer’s family.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:11
  type: summary
  locator: 14326-14332
  quote_or_summary: Only Âgan-uni'tsi returned successful from seeking the Ulûñsû'ti;
    the East Cherokee keep the crystal, described as transparent, bullet-shaped, and
    marked with a blood-red streak.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:12
  type: summary
  locator: 14332-14338
  quote_or_summary: The owner keeps the crystal wrapped in a whole deerskin, in an
    earthen jar, hidden in a secret mountain cave, and feeds it every seven days with
    small-game blood and twice yearly with larger-animal blood.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:13
  type: summary
  locator: 14338-14345
  quote_or_summary: If not fed, the crystal comes from the cave at night as fire to
    drink the lifeblood of the conjurer or his people; the owner can tell it it will
    not be needed so it sleeps until next use and feeding.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:14
  type: summary
  locator: 14347-14357
  quote_or_summary: No white man may see it; others avoid it for fear of sudden death.
    The conjurer moves its hiding place so it cannot learn the way out, and it must
    be buried with him or will search for his grave like a blazing star for seven
    years.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:15
  type: summary
  locator: 14359-14366
  quote_or_summary: The Ulûñsû'ti grants success in hunting, love, rain-making, and
    other business, and is chiefly used for life prophecy, with the future mirrored
    in the clear crystal.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
- id: ev:16
  type: summary
  locator: 14288-14291
  quote_or_summary: The passage directs readers to headings for traditions and beliefs
    concerning the Uktena, the Uksuhi, and other mythic serpents.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary allowed.
