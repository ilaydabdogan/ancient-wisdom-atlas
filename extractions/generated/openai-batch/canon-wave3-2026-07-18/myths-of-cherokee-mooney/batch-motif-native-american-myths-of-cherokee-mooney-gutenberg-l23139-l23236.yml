  text: Ûñ'tiguhi', also called The Suck, is described as a dangerous rapid in the
    Tennessee River; the Cherokee name is glossed as “Pot in the water.”
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A large flat rock near where Ûñtsaiyi' was said to live is described as having
