canonical_text:
  quote: ''
  summary: Commentary notes explain the name Ûñtsaiyi', identify him as a mythic gambler
    and inventor of the wheel-and-stick game, localize his gaming place near the Tennessee
    River rapid called The Suck, and add comparative notes on dangerous gambling,
    sweat-bath purification, hidden value in apparently insignificant objects, honey-locust
    and lightning associations, snake connections with thunder or rain spirits, and
    elder-brother kin terms.
  language: English with Cherokee terms
  quote_policy: summarized
