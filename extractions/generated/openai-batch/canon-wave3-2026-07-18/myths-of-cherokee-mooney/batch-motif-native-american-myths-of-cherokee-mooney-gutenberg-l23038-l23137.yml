canonical_text:
  quote: ''
  summary: The passage is a notes-and-parallels section. It compares snake-transformation
    stories from Ovid, Pawnee, and Omaha materials; comments on Cherokee rattlesnake
    reverence, prayer songs, reptiles, insects, bullfrog and Rabbit variants, and
    the Katydid warning; and summarizes variants of the Cherokee story of Ûñtsaiyi',
    the Gambler, including pursuit, westward flight, earth-opening escape, Little
    People, Thunderers, and a boy hero identified as lightning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that similar transformation myths occur worldwide and gives
    Cadmus in Ovid's Metamorphoses as an ancient example involving a snaky change
    witnessed by his wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Pawnee story, two brothers are traveling; the elder eats tabooed food
    and wakes to find that he is changing into a great rattlesnake, beginning at his
    feet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elder brother tells the younger brother to carry him to a hole after he
    has changed, calling it the house of the snakes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brother continues to talk with a man's mind as the metamorphosis
    extends upward until his head becomes a snake's head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the transformation, relatives visit the snake, and the brother brings
    it war trophies, including a horse and a woman, receiving protection from the
    snake man in return.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage cites a close Omaha variant called 'The warriors who were changed
    to snakes.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The note on 'The Rattlesnake's vengeance' says the story exemplifies Indian
    reverence for the rattlesnake and dread of offending it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage notes that many Indian ceremonial prayers and invocations are
    in the form of songs or chants.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The lizard Gi'ga-tsuha'`li is identified as probably Pleistodon erythrocephalus
    and is described as red-headed, forest-dwelling, often living high in hollow trees,
    fierce when caught, painfully biting, and not venomous.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A large horned beetle is said to be called crawfish, deer, or buck by the
    Cherokee because of its branching horns, and is compared with the 'flying stag'
    described by early travelers.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the note on 'The Bullfrog lover,' warning words are said to be delivered
    in a deep, gruff, singing tone imitating a bullfrog's note.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a Creek variant, Rabbit hides near a spring with a blowgun used as a trumpet
    and frightens an obdurate girl into consent by singing a warning that a girl who
    stays single will die.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The variants of 'Ûñtsaiyi', the Gambler' differ on whether the boy goes to
    the Sunset land to play against his brothers or whether the brothers meet him
    at their father's house.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: In the Ax version, the gambler flees west; when the brothers shoot arrows
    at him, thunder rolls and lightning flashes, but he escapes by sinking into the
    opened earth and reappearing elsewhere in another form.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: In Swimmer's version, the Little People help in the chase.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The passage states that, in Cherokee usage, an invitation to a ball contest
    is a challenge to battle.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: Thunder is said to be personified in the plural as Ani'-Hyûñ'tikwalâ'ski,
    'The Thunderers.'
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:18
  text: The father and two older sons are said to seem to be Kana'ti and the Thunder
    Boys, although neither informant positively asserted this; the unnamed boy hero
    is said to be lightning, and nothing is told of his later career.
  category: relationship
  evidence_refs:
  - ev:13
