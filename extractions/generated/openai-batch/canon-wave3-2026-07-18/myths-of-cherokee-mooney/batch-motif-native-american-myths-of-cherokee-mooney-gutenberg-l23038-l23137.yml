candidate_motifs:
- id: motif:1
  label: Human transformation into snake
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: Cadmus and the Pawnee elder brother are both presented as human figures undergoing
    snaky or rattlesnake transformation.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: Cadmus is an external comparison; the Pawnee story is not itself a Cherokee
    story in this passage.
- id: motif:2
  label: Tabooed food causing metamorphosis
  taxonomy_refs: []
  basis: The Pawnee elder brother eats tabooed food and then wakes to find himself
    changing into a rattlesnake.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain the taboo's origin or rule.
- id: motif:3
  label: Transformed snake kinsman as protector in exchange for offerings
  taxonomy_refs:
  - serpent
  - sacred_exchange
  basis: The transformed snake man receives visits and war trophies from kin and gives
    protection in return.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage reports this as part of a Pawnee story summarized in notes.
- id: motif:4
  label: Rattlesnake reverence and vengeance for offense
  taxonomy_refs:
  - serpent
  basis: The note says the Cherokee rattlesnake vengeance story exemplifies reverence
    for the rattlesnake and dread of offending it.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The actual vengeance narrative is not included in this line range.
- id: motif:5
  label: Ceremonial prayer as song or chant
  taxonomy_refs: []
  basis: The passage notes that many ceremonial prayers and invocations are performed
    as songs or chants.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a ritual-form note rather than a narrative motif in the passage.
- id: motif:6
  label: Animal suitor or hidden lover frightens with a sung warning
  taxonomy_refs: []
  basis: The bullfrog-lover note emphasizes gruff sung warnings, and the Creek variant
    has Rabbit hiding near a spring and frightening the girl into consent by singing
    through a blowgun trumpet.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The full Cherokee bullfrog-lover narrative is not summarized here; the
    coercive consent element is explicit only in the Creek variant.
- id: motif:7
  label: Pursued gambler escapes into opening earth and reappears transformed
  taxonomy_refs:
  - shapeshifter
  basis: In the Ax version, the gambler flees west, sinks into earth that opens for
    him, and reappears elsewhere in another form.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not describe each reappearing form.
- id: motif:8
  label: Thunder and lightning accompany arrows in pursuit
  taxonomy_refs: []
  basis: As the brothers shoot arrows at the fleeing gambler, thunder rolls and lightning
    flashes; the boy hero is also said to be lightning.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The exact relation between the arrow-shooting brothers, Thunderers, Thunder
    Boys, and the lightning boy is partly interpretive and partly uncertain in the
    passage.
- id: motif:9
  label: Ball-game invitation as battle challenge
  taxonomy_refs: []
  basis: The passage states that, in Cherokee figure, an invitation to a ball contest
    is a challenge to battle.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The surrounding narrative details of the contest are not included in this
    passage.
- id: motif:10
  label: Uncertain linkage to Kana'ti and the Thunder Boys
  taxonomy_refs: []
  basis: The father and two older sons in the Gambler story are said to seem to be
    Kana'ti and the Thunder Boys, while the boy hero is lightning.
  evidence_refs:
  - ev:13
  confidence: uncertain
  cautions: The passage explicitly says neither informant would positively assert
    this identification.
comparison_claims:
- id: claim:1
  claim: The Cadmus passage and the Pawnee snake-transformation story are presented
    as examples of a shared human-to-snake transformation motif family.
  claim_level: same_motif
  target: Cadmus in Ovid's Metamorphoses and the Pawnee story in Grinnell
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
