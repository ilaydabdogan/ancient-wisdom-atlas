  quote: ''
  summary: The passage recounts Christian Priber’s arrival among the Cherokee in 1736,
    his influence, proposed government centered at Great Tellico, capture by English
    traders, confinement and death, linguistic work, and claimed civilizing project.
    It then notes the lack of Carolina mission work and summarizes eighteenth-century
    Cherokee conflicts with neighboring peoples, including Tuscarora, Shawano, Catawba,
    Chickasaw, Iroquois, and Creeks, ending with references to Coweta and the battle
    of Tali'wa.
  language: English
