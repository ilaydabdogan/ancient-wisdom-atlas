canonical_text:
  quote: ''
  summary: The passage classifies Cherokee myths, describes a lost Cherokee genesis-and-migration
    national legend, explains restrictions around sacred myth recitation, and gives
    an account of nocturnal instruction in the âsi followed by dawn purification in
    running water. It also describes a boy tending the ritual fire and compares a
    circular fire arrangement with a Waxhaw custom described by Lawson.
  language: English
  quote_policy: summarized
