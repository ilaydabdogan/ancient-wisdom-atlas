canonical_text:
  quote: ''
  summary: The passage recounts several Cherokee accounts involving the Nûñne'hi or
    Immortals. One town prays and fasts before its townhouse and mound are lifted
    toward the mountains, leaving part of a mound behind and carrying the rest to
    Lone Peak, where the people become invisible and immortal. Another town prays
    and fasts and is taken under the water, where its people are still heard and remembered
    as kin. A separate river settlement at Gusti is carried into the river when the
    bank caves in; boatmen see or hear its stone townhouse and make food offerings
    for safe passage. The passage then tells how the Nûñne'hi defended Nikwasi' from
    invaders by emerging from a mound, fighting invisibly, defeating the enemy, sparing
    a few to report the defeat, and later appearing as many soldiers to deter Federal
    troops.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people feared coming evils and decided to go with the Immortals of the
    mountains and waters, whom they believed to be happy forever.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people of Anisgayâ'yi gathered in their townhouse, prayed, and fasted
    for six days; on the seventh day they heard a growing mountain sound like thunder
    and felt the ground shake.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Nûñne'hi lifted the Anisgayâ'yi townhouse with its mound, dropped part
    of it after some people screamed, and left that fallen part as the mound of Se'tsi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Nûñne'hi carried the rest of the Anisgayâ'yi townhouse and the people
    in it to Lone Peak; the townhouse is said to be visible as solid rock, while the
    people are invisible and immortal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The people of another town on the Hiwassee prayed and fasted, and after seven
    days the Nûñne'hi took them down under the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The underwater Hiwassee people are said to be heard talking below the surface
    on warm summer days, and fish-drags catch there because their lost kinsmen hold
    them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the Cherokee were removed westward, people from the Hiwassee and Valley
    rivers regretted leaving relatives who had gone to the Nûñne'hi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Gusti', a settlement was carried into the Tennessee River when the bank
    caved in while people were gathered in the townhouse for a dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Boatmen passing Gusti' see the stone dome of the townhouse under the water,
    sometimes hear drum and dance sounds, and throw food into the water for safe crossing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: An unknown powerful tribe invaded from the southeast, killing people and destroying
    settlements before reaching the mountains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Nikwasi' people gathered wives and children into the townhouse, kept scouts
    watching, and went out to fight when the enemy approached.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A stranger appeared during the retreat and told the chief to call off his
    men; soon a company of warriors emerged from the side of the mound as if through
    an open doorway.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Nikwasi' people recognized the mound-emerging warriors as Nûñne'hi who
    lived under Nikwasi' mound.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Nûñne'hi warriors became invisible outside the settlement, while their
    arrows and tomahawks remained effective against the invaders.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The invaders retreated, tried to hide behind rocks and trees, were struck
    by arrows that went around rocks, and finally cried for mercy at a place named
    Dayûlsûñ'yi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Nûñne'hi chief said the invaders deserved punishment for attacking a peaceful
    tribe, spared a few, and sent them home with news of the defeat.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: In a later war, Federal troops approaching Nikwasi' saw many soldiers guarding
    the town and withdrew without attacking the Confederates posted there.
  category: action
  evidence_refs:
  - ev:9
