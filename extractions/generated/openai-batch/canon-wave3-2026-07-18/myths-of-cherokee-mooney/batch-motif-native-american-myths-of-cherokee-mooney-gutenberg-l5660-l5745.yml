canonical_text:
  quote: the long procession of exiles was set in motion
  summary: 'The passage recounts the 1838-39 Cherokee Removal under Cherokee officers:
    the emigrants assemble at Rattlesnake Springs, travel mostly overland through
    multiple river crossings, suffer illness and deaths including White-path and John
    Ross''s wife, wait beside the frozen Mississippi, and arrive in Indian Territory
    after nearly six months. It then summarizes mortality estimates, settlement efforts,
    tensions with the Old Settlers, and the killings of Major Ridge, John Ridge, and
    Elias Boudinot after a failed council.'
  language: English
  quote_policy: quoted
