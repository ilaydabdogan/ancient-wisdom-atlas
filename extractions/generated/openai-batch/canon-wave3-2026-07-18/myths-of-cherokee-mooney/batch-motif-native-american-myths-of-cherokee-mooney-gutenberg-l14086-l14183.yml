canonical_text:
  quote: ''
  summary: 'The passage contains several Cherokee animal narratives and belief statements:
    a buzzard loses his proud topknot and becomes willing to eat carrion; an eagle''s
    brother avenges a killed eagle during an Eagle dance; a magic buzzard exchanges
    forms with a hunter, enabling the hunter to find deer; and snakes are described
    as supernatural beings linked with rain and thunder, surrounded by taboos, ritual
    precautions, dream-bite beliefs, and avoidance speech.'
  language: English
  quote_policy: summarized
