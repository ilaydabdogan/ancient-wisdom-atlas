canonical_text:
  quote: ''
  summary: 'The passage contains several brief animal narratives: a Kingfisher rescues
    a Yellowhammer nest from a Blacksnake and receives a long bill; a Partridge tricks
    Terrapin out of his whistle; a Raccoon deceives a Wolf, whose reward to a brown
    bird explains Redbird color; the Pheasant imitates corn-beating and is connected
    with the Pheasant dance; and the beginning of a race narrative sets Hummingbird
    and Crane as rivals for a woman.'
  language: English
  quote_policy: summarized
