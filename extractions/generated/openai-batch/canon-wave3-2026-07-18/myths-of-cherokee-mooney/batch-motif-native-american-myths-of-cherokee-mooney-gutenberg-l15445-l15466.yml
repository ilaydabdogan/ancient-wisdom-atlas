  summary: A giant fish called the Dakwa' lives in the Tennessee River. It overturns
    a canoe of warriors, swallows one man, and dives. The man survives inside the
    fish, uses swallowed mussel shells to cut his way out, escapes near shore, and
    returns bald because the fish's stomach juices scalded away his hair.
