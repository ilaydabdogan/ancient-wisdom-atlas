  summary: The passage recounts Spanish expeditions from Santa Elena into the Southeast
    interior under Juan Pardo in 1566-1567, including forts, reported conflicts, fortified
    Indigenous towns, routes through towns associated with earlier De Soto accounts,
    mountain and river landmarks, and generally hospitable receptions along parts
    of the route.
