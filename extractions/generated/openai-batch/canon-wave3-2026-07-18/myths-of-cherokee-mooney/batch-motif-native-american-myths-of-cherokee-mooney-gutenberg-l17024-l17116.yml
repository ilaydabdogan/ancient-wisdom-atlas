canonical_text:
  quote: ''
  summary: The passage recounts a Cherokee captive adopted among the Seneca who later
    sought his Cherokee relatives, then gives an account of an Iroquois peace embassy
    to the Cherokee, including wampum belts, hospitality toward an enemy messenger,
    a council at Itsâ'ti/Echota, a symbolic explanation involving cloudy and clear
    spring water, and the acceptance of peace tokens ending a long war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Cherokee boy captured and adopted among the Seneca later became a Seneca
    chief, learned of his Cherokee origin, traveled south to find his people, was
    not recognized, and returned to the Seneca.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: James Wafford's account of the Iroquois peace embassy was said to derive from
    Sequoya and Gatûñ'wa`li, both described as eyewitnesses connected with the Echota
    proceedings or later explanation of the belt.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A 1768 treaty of peace between Cherokee and Iroquois is described as brought
    about by a Cherokee delegation headed by Âganstâ'ta.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: According to Sequoya's account, Iroquois messengers traveled south with wampum
    belts and peace emblems, lost their way after passing Tennessee River, and reached
    the outskirts of Ta'likwa instead of Itsâ'ti or Echota.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: One Iroquois messenger entered the chief's house at Ta'likwa and asked for
    food; the chief's daughter set out food for him under the custom of hospitality.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When armed townsmen came to kill the Iroquois messenger, the chief stood in
    the doorway and protected him, saying they must first kill the chief before killing
    the messenger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The messenger was allowed to bring his companions, and the group was cared
    for at the chief's house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the delegation rested, the Ta'likwa chief accompanied them to Itsâ'ti,
    where a council was held and the Iroquois speaker produced wampum belts and pipes
    as proof of the mission.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Iroquois speaker described a spring in his people's country whose water
    remained dark and troubled for two years but became clear and sparkling in the
    third year, at which point they knew the time had come to seek peace.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Cherokee accepted the friendly message; the belts and other symbolic peace
    tokens were kept by them, and after feasting and dancing the messengers returned
    north and the long war ended.
  category: sequence
  evidence_refs:
  - ev:8
