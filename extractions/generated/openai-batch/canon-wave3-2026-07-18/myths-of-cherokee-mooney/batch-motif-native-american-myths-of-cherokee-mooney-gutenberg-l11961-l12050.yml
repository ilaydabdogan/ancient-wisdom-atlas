canonical_text:
  quote: ''
  summary: Animal councils respond to human killing and mistreatment. Bears consider
    war but abandon the plan because human weapons do not suit bear bodies. Deer establish
    a pardon-prayer requirement enforced by Little Deer through rheumatism. Fishes
    and Reptiles create harmful dreams. Birds, Insects, and smaller animals condemn
    Man and devise diseases, while episodes explain traits of Frog, Ground-squirrel,
    and Grubworm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bears meet first in council in a townhouse under Kuwâ'hi mountain, with
    the old White Bear chief presiding, and complain that Man kills them, eats their
    flesh, and uses their skins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bears decide to begin war against Man and identify bows and arrows as
    Man's weapons.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A Bear obtains locust wood and another Bear dies to provide entrails for a
    bowstring so the Bears can test Man's weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bears find that long claws catch the bowstring; trimming claws allows
    the arrow to fly straight, but the White Bear chief rejects cutting claws because
    Bears need them to climb trees and survive.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bear council disperses without finding a way to stop the increase of the
    human race.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Deer hold a council under Little Deer and decide to send rheumatism to
    hunters who kill Deer without asking pardon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Little Deer checks whether the spirit of a slain Deer heard the hunter's prayer;
    if not, he follows the blood trail invisibly to the hunter's cabin and strikes
    him with rheumatism.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hunters normally ask pardon of Deer, while some hunters who do not know the
    prayer may try to divert Little Deer by building a fire behind them on the trail.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Fishes and Reptiles hold a council and decide to make human victims dream
    of snakes twining around them or of eating raw or decaying fish, causing loss
    of appetite, sickness, and death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Birds, Insects, and smaller animals gather in council with Grubworm as chief,
    decide that each will give an opinion, and set seven votes as enough to condemn
    Man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Frog accuses Man of mistreating him and displays spots on his skin as sores
    from being kicked.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: An unnamed Bird condemns Man because hunters burn birds' feet while barbecuing
    them over fire.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Ground-squirrel alone speaks in favor of Man, and the other animals attack
    him, leaving stripes on his back.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The animals name many new diseases; when fatal menstruation is proposed, Grubworm
    rejoices, falls over backward, and thereafter must wriggle on his back.
  category: sequence
  evidence_refs:
  - ev:12
