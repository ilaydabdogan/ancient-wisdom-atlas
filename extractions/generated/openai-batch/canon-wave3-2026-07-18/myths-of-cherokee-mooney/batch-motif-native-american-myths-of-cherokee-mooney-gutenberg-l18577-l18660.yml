literal_observations:
- id: obs:1
  text: The Natchez are described as a formerly influential tribe around present-day
    Natchez, Mississippi, later disrupted by war with the French in 1729-31.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the disruption, Natchez groups are said to have taken refuge with the
    Chickasaw, Creeks, Catawba/South Carolina, and later Cherokee.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Cherokee name Anin'tsi is presented as abbreviated from Ani'-Na'`tsi,
    and some English-speaking Indians rendered the name as “Pine Indians” because
    of a chance resemblance to a Cherokee word for pine tree.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cherokee accounts generally say the Natchez came from South Carolina, while
    some say they came from the Creek country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the Cherokee regarded the Natchez as wizards and conjurers
    and connects this view with Natchez religious rites and their status as a remnant
    of an extirpated tribe.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: James Wafford reported a Natchez town on the north bank of Hiwassee, and his
    grandmother had to use an interpreter there because only one or two Natchez spoke
    Cherokee at the time.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: By 1824 Wafford found Natchez living jointly with Cherokee at Gû`lani'yi,
    no longer distinguishable in dress or general appearance, speaking broken Cherokee,
    and still retaining their own language.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ganse'`ti reported that Natchez were scattered among Cherokee settlements,
    had no separate townhouses, spoke Creek, Cherokee, and their own language, and
    were great dance leaders.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says Natchez went west with the Cherokee in 1838, that a small
    Natchez-speaking settlement existed near Tahlequah in 1890, and that Natchez descent
    was still claimed among the East Cherokee.
  category: sequence
  evidence_refs:
  - ev:7
