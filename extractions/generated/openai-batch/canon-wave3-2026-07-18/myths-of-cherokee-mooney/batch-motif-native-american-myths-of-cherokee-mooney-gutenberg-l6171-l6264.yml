  text: A band of western Cherokee under Chief Bowl left Arkansas and crossed Red
    River into Texas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The band was joined by Tahchee and others opposed to the 1828 treaty and united
    with other refugee Indians into a loose confederacy known as the Cherokee and
    their associated bands.
  category: relationship
  evidence_refs:
  - ev:1
