canonical_text:
  quote: ''
  summary: 'The passage concludes a race in which Terrapin defeats Rabbit by stationing
    identical-looking terrapin friends along ridges, then explains a ball-play practice
    using rabbit hamstrings to make opponents tire. It then begins the story of Rabbit
    and the Tar Wolf: during drought, the animals dig a well without Rabbit''s help;
    Rabbit steals water at night, and the animals set up a pine-gum-and-tar wolf by
    the well, which traps Rabbit until morning, after which he escapes.'
  language: English
  quote_policy: summarized
