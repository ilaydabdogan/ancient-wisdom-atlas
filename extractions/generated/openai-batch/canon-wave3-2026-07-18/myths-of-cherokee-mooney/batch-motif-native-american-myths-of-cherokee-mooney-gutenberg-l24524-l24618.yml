canonical_text:
  quote: ''
  summary: The passage first summarizes two reported Cherokee-related versions of
    a story explaining the transfer of a book from Indians to white people and the
    assignment of bow and arrows to Indians. It then characterizes the story as a
    common tale of former greatness. The remainder gives ethnographic and historical
    notes on the Iroquois league, including its member nations, the Hodenosaunee name
    as 'People of the Long House,' the symbolic eastern and western door guardianship
    of the Mohawk and Seneca, clan organization, expansion, removals, and 1890 census
    figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story of the book and the bow is said not to have been heard on the reservation
    but is reported from other authorities.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one quoted account, God gives the red man a book and paper and tells him
    to write; because he only makes marks and cannot read or write, the Lord gives
    him a bow and arrows and gives the book to the white man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In another quoted account, the ancestors handed down that the book possessed
    by white people was once theirs and that they prospered while they had it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same account says white people bought the book and learned many things
    from it, while the Indians lost credit, offended the Great Spirit, suffered from
    neighboring nations, and were directed by the Great Spirit to this country.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author characterizes the book-and-bow story as another version of a common
