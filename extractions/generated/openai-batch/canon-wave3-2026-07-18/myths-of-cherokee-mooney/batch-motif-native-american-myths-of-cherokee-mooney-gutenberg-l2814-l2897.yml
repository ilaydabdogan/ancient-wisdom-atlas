literal_observations:
- id: obs:1
  text: A convention was held with principal Cherokee men at White's fort, now Knoxville,
    in summer 1791, through Governor Blount's efforts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cherokee were brought with difficulty to consent to cede a triangular
    section in Tennessee and North Carolina, including areas along the French Broad
    and lower Holston.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the ceded area and adjacent territory were already occupied
    by whites.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The agreement included permission for a road, free navigation of the Tennessee
    river, restoration of prisoners, a guarantee of perpetual peace, and Cherokee
    receipt of an annuity, goods, and assistance toward civilization.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The treaty was signed by forty-one principal men, concluded July 2, 1791,
    and described as held on the bank of the Holston near the mouth of the French
    Broad.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Before the end of the year, six principal Cherokee chiefs appeared at Philadelphia
    to protest the arrangement, saying they had not known the conference was for land
    sale, had resisted for days, had yielded under threatening demands, considered
    the payment too small, and feared whites would not respect the boundary.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A supplementary article increased the annuity to eight thousand five hundred
    dollars, and the new line was not surveyed until 1797.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: One principal signer of the original treaty was among the protesting delegates
    and appeared in the supplementary paragraph as Iskagua, or Clear Sky, formerly
    Nenetooyah, or Bloody Fellow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The narrator states that the new name may have been symbolic of the signer's
    change of heart at the prospect of peace.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The treaty is said to have had little effect in preventing hostilities because
    intruders remained on Cherokee lands and raiding continued.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A boat that ran aground on the Muscle shoals was attacked by a party of Indians
    under pretense of offering assistance; one man was killed and another severely
    wounded with a hatchet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Leonard D. Shaw requested and received a commission as deputy agent to accompany
    returning Cherokee delegates, reside among the Cherokee, observe and report, assist
    with annuity distributions, study language and home life, and collect materials
    for an Indian history.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Secretary Knox instructed Shaw that his duty would require patience, fortitude,
    and knowledge of human character, and that acquiring the affections and knowledge
    of southern Indians could make him useful to the United States.
  category: speech
  evidence_refs:
  - ev:6
