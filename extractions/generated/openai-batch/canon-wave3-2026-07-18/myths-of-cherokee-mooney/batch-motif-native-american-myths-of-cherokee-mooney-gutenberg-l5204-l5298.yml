canonical_text:
  quote: ''
  summary: 'Historical account of the Treaty of New Echota: a sparsely attended conference
    led to a treaty ceding remaining Cherokee territory east of the Mississippi to
    the United States, providing for removal westward, financial and institutional
    provisions, land assignments, guarantees, a patent, and limits on future state
    or territorial jurisdiction without Cherokee consent.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The conference at New Echota opened with only three hundred to five hundred
    attendees from a population of over 17,000, and the principal officers of the
    Nation were absent.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A committee was appointed to arrange treaty details, and the treaty was drawn
    up and signed on December 29, 1835.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Cherokee Nation ceded its remaining territory east of the Mississippi
    to the United States for five million dollars and a joint interest in western
    territory, with an additional tract in what is now Kansas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The treaty provided that the Indians would be removed at United States expense,
    subsisted by the Government for one year after arrival, and removed within two
    years from treaty ratification.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A provision allowing a limited number of Cherokee to remain in North Carolina,
    Tennessee, and Alabama was allowed by the commissioners but later struck out after
    President Jackson announced that the whole Cherokee people should remove together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The treaty made provisions for debts, missions in the West, pensions, military
    posts and roads, Osage claims, intertribal understanding, and a permanent national
    fund for schools, orphans, and national purposes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The western territory assigned to the Cherokee consisted of two adjoining
    tracts: a seven-million-acre tract with a perpetual outlet west and an additional
    eight-hundred-thousand-acre tract in what is now southeastern Kansas.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The 1833 treaty language guaranteed the first tract to the western Cherokee
    forever and guaranteed a perpetual outlet west with free and unmolested use as
    far west as United States sovereignty and right of soil extended.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Article 3 of the present treaty stated that lands ceded by the 1833 treaty,
    including the outlet, and those ceded by the present treaty would be included
    in one patent executed to the Cherokee nation by the President of the United States.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Article 5 stated that the United States covenanted that the ceded lands would
    not be included within any state or territory without Cherokee consent and would
    secure Cherokee national council lawmaking authority, subject to stated federal
    limits.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
