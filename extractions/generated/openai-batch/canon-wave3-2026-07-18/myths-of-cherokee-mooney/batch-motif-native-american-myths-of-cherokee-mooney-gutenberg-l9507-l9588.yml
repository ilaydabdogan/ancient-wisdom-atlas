  summary: The passage first traces historical trails and roads through Cherokee country
    and nearby regions, then discusses Cherokee peace towns or towns of refuge, especially
    Echota/Chota. It compares such towns to ancient Hebrew cities of refuge, describes
    sanctuary for killers or manslayers, accounts of settlement through presents,
    refusal of sanctuary in one case, the phrase "house of peace," and a possible
    general amnesty at the annual Green-corn dance.
  language: English
