- id: obs:1
  text: Cherokee chiefs went to Charleston with a trader to express a desire for peace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Colonel Maurice Moore led several hundred white troops and a number of negroes
    up the Savannah and made headquarters among the Lower Cherokee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lower Cherokee and some western town chiefs reaffirmed desire for lasting
    peace with the English, blamed traders for much of the trouble, refused to fight
    the Yamassee, and were willing to proceed against some other tribes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Colonel George Chicken's detachment reached Quoneashee, where Upper Cherokee
    chiefs were described as more defiant, intent on continuing war against the Creeks,
    and demanding guns and ammunition.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Upper Cherokee chiefs said that peace with other tribes would remove their
    means of obtaining slaves with which to buy ammunition.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: An arrangement was made to furnish the Cherokee with two hundred guns, ammunition,
    and fifty white soldiers; the force was later increased by one hundred men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:7
  text: In 1721, Governor Nicholson invited Cherokee chiefs to a conference where
