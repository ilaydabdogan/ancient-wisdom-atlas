canonical_text:
  quote: ''
  summary: The passage recounts the recruitment of East Cherokee men into William
    H. Thomas's Confederate Thomas Legion after Washington Morgan stirred enthusiasm
    for enlistment. It describes Thomas's intention to use them mainly as scouts and
    home guards in mountain regions, the legion's composition, Cherokee participation
    at Baptist Gap, ritual and customary practices before and during service including
    consultation of an oracle stone, a war dance at Soco, paint and feathers, and
    ballplay, followed by later surrender, veteran survival, and Confederate administrative
    inquiry into East Cherokee funds.
  language: English
  quote_policy: summarized
