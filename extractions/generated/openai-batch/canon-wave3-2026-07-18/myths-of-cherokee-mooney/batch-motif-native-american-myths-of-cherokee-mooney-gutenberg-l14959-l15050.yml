canonical_text:
  quote: ''
  summary: The supplied passage includes a variant in which a tadpole lover in human
    form is exposed and leaves, a short tale in which a Katydid warns a mocking hunter
    of his death, and the beginning of the story of Ûñtsaiyi', the Gambler, where
    an afflicted boy travels west to find his father Thunder, encounters a tricky
    shape-changing gambler, is recognized by Thunder through a thorn test, is boiled
    with roots in a pot and thrown into the river, emerges cured, and receives instructions
    from Thunder's wife for later trials.
  language: English
