canonical_text:
  quote: ''
  summary: The passage recounts military expeditions by North Carolina, South Carolina,
    and Georgia forces against Cherokee towns. It describes towns, houses, crops,
    orchards, livestock, and stored goods being destroyed or carried off; several
    encounters and battles with Cherokee forces; Cherokee flight into mountain refuges
    or toward Overhill towns; and one killed Cherokee combatant later identified as
    a woman painted and armed like a warrior.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A North Carolina army of 2,400 under General Griffith Rutherford crossed the
    Blue Ridge and reached Stikâ'yi, or Stecoee, on the Tuckasegee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Stecoee the inhabitants had fled, and soldiers burned the town and an unfinished
    townhouse, cut standing corn, killed one or two stragglers, and continued on a
    destructive mission.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thirty-six towns on Oconaluftee, Tuckasegee, Little Tennessee, and Hiwassee
    were destroyed, with corn, stock, and other property destroyed, killed, carried
    off, or trampled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Cherokee made limited resistance against the combined advancing forces
    and fled with women and children into the Great Smoky Mountains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that, as was usual in Indian wars, the number killed or
    captured was small while property destruction was extremely large.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Waya gap in the Nantahala Mountains, Cherokee forces opposed Rutherford;
    the fight caused more than forty killed or wounded among the soldiers before the
    Cherokee were repulsed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: One of the killed Indians at Waya gap was later discovered to be a woman painted
    and armed like a warrior.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A South Carolina army under Colonel Andrew Williamson, including Catawba Indians,
    joined Rutherford's forces on the Hiwassee River and later returned by its route
    after the destruction had already been completed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: South Carolina detachments in the lower Cherokee towns burned towns, cut peach
    trees and ripened corn, and had occasional skirmishes with Cherokee forces on
    their flanks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Seneca, after resistance and retreat by the Indians, the South Carolina
    force burned houses and destroyed six thousand bushels of corn and other food
    stores.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Tomassee several whites and sixteen Cherokee were killed, and the Cherokee
    dead were scalped afterward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: As Williamson's army advanced in the Little Tennessee valley, houses were
    burned, cornfields and other crops or orchards were destroyed, and stores of dressed
    deerskins and valuables were carried off.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Indians who were not killed or captured were driven as homeless refugees into
    Nantahala or made their way toward the Overhill towns in Tennessee.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A Georgia force under Colonel Samuel Jack burned two towns near the heads
    of the Chattahoochee and Tugaloo rivers, destroyed corn, drove off cattle, and
    the Cherokee apparently fell back toward the mountains.
  category: action
  evidence_refs:
  - ev:7
