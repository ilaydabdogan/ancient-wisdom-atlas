  summary: The passage discusses historical accounts and later identifications of
    the province or town called Xuala, Xualla, Chouala, or Suala in De Soto-related
    narratives. It compares descriptions of its distance, terrain, mountains, rivers,
    provisions, and possible modern locations, then identifies Xuala with the Suwali
    or Sara/Cheraw people adjoining the Cherokee and explains the Cherokee name Suwa'li-nuñnâ
    for a trail or pass later rendered Swannanoa.
