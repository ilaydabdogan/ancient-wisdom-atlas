canonical_text:
  quote: ''
  summary: 'The passage catalogs Cherokee beliefs and lore concerning lizards, salamanders,
    fish, shellfish, crawfish, insects, and beetles: blood-taking and rain-making
    lizards; fish ghosts causing disease; a monster fish ancestor; seasonal fish-to-lizard
    transformation; animal taboos and ritual uses of animal parts; insects as disease
    agents; and beetles connected with genesis, Thunder boys, a mythic gambler, and
    a council against humans.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The giga-tsuha'`li is described as a very large lizard with red coloring at
    the throat and mouth, believed to be a transformed ugûñste'li fish and feared
    for blood-taking behavior.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tsâne'ni scorpion lizard is also called a blood taker and is believed
    to suck blood mysteriously when it nods its head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a dog eats the heart of the tsâne'ni, it is said to gain the ability to
    extract nourishment from food by looking at people who are eating.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Spring lizards are associated with rain: one causes rain when it leaves the
    spring, and another is called the rain maker because its cry brings rain.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The water dog lives in muddy water and is rarely eaten because eating it before
    going into the field is believed to ruin the crop.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some dream diseases are attributed to revengeful fish ghosts, and the doctor
    invokes a larger fish or fish-eating bird to drive out the ghost.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Dakwa' is identified as a mythic monster fish, father of all the fish
    tribe, formerly living in the Little Tennessee River near Toco creek.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ugûñste'li is a horned spring fish with red head spots, accompanied by
    smaller red fish; these fish pile up small stones in the water and later the ugûñste'li
    is believed to transform into the giga-tsuha'`li.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The hog-sucker is taboo to ball players, eel skin is used to make players
    slippery or women's hair long, and a red crawfish scratches children to give them
    a strong grip.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The generic small insects and worms called tsgâya are blamed by doctors for
    many human ailments as revenge for humans constantly destroying them.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The water-beetle called beaver's grandmother is said in the genesis tradition
    to have brought up the first earth from under the water.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A green-headed horned beetle is called the dog of the Thunder boys, and its
