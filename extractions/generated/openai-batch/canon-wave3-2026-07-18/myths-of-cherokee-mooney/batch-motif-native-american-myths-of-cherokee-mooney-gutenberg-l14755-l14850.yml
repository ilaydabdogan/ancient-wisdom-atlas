- id: ev:3
  type: summary
  locator: 14755-14850, spring-lizard paragraph
  quote_or_summary: The duwe'`ga spring lizard causes rain when it crawls out of the
    spring; another red spotted lizard, dagan'`tû' or aniganti'ski, is called rain
    maker because its cry brings rain.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:4
  type: summary
  locator: 14755-14850, water-dog paragraph
  quote_or_summary: The tsuwa' water dog frequents muddy water and is rarely eaten
    because one who eats it and then enters the field is believed to ruin the crop.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:5
  type: summary
  locator: 14755-14850, fish-lore paragraph
  quote_or_summary: Some dream diseases are attributed to revengeful fish ghosts,
    and the doctor cures by invoking a larger fish or fish-eating bird to drive the
    ghost out.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:6
  type: summary
  locator: 14755-14850, Dakwa' paragraph
  quote_or_summary: Toco creek is said to be named from the Dakwa', a mythic monster
    fish considered father of all the fish tribe and formerly living in the Little
    Tennessee River there; the passage refers to The Hunter and the Dakwa'.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:7
  type: summary
  locator: 14755-14850, ugûñste'li paragraph
  quote_or_summary: The ugûñste'li appears in spring with nose horns and red head
    spots, is accompanied by smaller red fish, piles small stones in water, and later
    disappears as it is believed to become the giga-tsuha'`li from head to tail.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:8
  type: summary
  locator: 14755-14850, fish and crawfish practice paragraph
  quote_or_summary: Hog-sucker meat is taboo to ball players; eel skin is rubbed on
    ball players for slipperiness and tied in women's hair for length; a red crawfish
    scratches children's hands for strong grip, with possible quarrelsome biting disposition.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:9
  type: summary
  locator: 14755-14850, insects and tsgâya paragraph
  quote_or_summary: Doctors say the tsgâya, small insects and worms, cause nearly
    every human ailment not otherwise explained, because humans constantly destroy
    them and this is their revenge.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:10
  type: summary
  locator: 14755-14850, water-beetle paragraph
  quote_or_summary: The little water-beetle dâyuni'si, beaver's grandmother, brought
    up the first earth from under the water according to the genesis tradition.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:11
  type: summary
  locator: 14755-14850, green-headed beetle paragraph
  quote_or_summary: A green-headed horned beetle is called the dog of the Thunder
    boys, and its metallic green forehead is explained as caused by striking the mythic
    gambler Ûñtsaiyi', Brass.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:12
  type: summary
  locator: 14755-14850, June-bug paragraph
  quote_or_summary: The June-bug is called by a name meaning one who keeps fire under
    the beans; its larva is the grubworm that presided at the insects' meeting to
