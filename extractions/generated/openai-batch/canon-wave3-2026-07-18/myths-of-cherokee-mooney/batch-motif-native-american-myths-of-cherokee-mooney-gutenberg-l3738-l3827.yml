canonical_text:
  quote: ''
  summary: 'The passage recounts Cherokee participation in the Creek War after the
    Fort Mims massacre: Ridge brings a request from friendly Lower Creeks for Cherokee
    assistance, the Cherokee council first declines and then declares war after many
    warriors volunteer, Cherokee and allied forces act with American armies, Turkeytown
    is relieved, Tallaseehatchee is attacked and destroyed, and Talladega is described
    as another slaughter in which friendly Creeks besieged by hostile Creeks are relieved
    by Jackson''s army.'
  language: English
  quote_policy: summarized
