canonical_text:
  quote: ''
  summary: The passage discusses the identification of the Cherokee/Tsalaki with Tallige-wi
    or Tallike as a cave-country people; summarizes Wyandot and Delaware-related traditions
    of conflict in the Ohio Valley; and reports fragmentary Cherokee migration traditions
    involving an eastern origin, commands from four councils sent from above, primordial
    snakes and water monsters, annual green-corn recitation, slow migration, mounds,
    burial places, and former residence in Virginia.
  language: English
  quote_policy: summarized
