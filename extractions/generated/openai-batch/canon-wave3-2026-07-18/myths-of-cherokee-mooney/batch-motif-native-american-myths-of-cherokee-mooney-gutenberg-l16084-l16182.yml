  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tsawa'si is described as a tiny handsome figure with very long hair who lives
    in grassy hillside patches and has power over game.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Tsaga'si is helpful to hunters but is also named as the cause when someone
    trips and falls.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: De'tsata was once a boy who fled to the woods to avoid scratching and has
    tried to remain invisible ever since.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: De'tsata hunts birds with blowgun and arrow, causes flocks to fly up suddenly,
