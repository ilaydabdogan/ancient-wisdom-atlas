  quote: ''
  summary: The passage recounts several Cherokee accounts of Little People, water-dwellers,
    house spirits, hunting fairies, De'tsata, a feared Fire-carrier, and invisible
    spirits or Immortals who warn people of future misfortune and invite them to enter
    hidden homes under mountains and waters after ritual fasting and silence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A winter hunter follows childlike tracks in snow to a cave full of Little
    People; they host him, warn him not to tell, and he dies a few days after revealing
    the story.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two hunters from Raventown find a cave behind a high fall with fresh footprints
    of the Little People on the floor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During a smallpox outbreak, a sick man disappears for several weeks and returns
    saying the Little People took him to a cave and tended him until cured.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tsantawû' is lost in winter for sixteen days and returns saying the Little
    People kept him in a cave, fed him, and guided him partway home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The food given to Tsantawû' includes large loaves that shrink into small,
    light, crumbly cakes when he tries to eat them, leaving him unsatisfied.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Tsantawû' crosses a knee-deep creek as instructed, the Little People
    vanish and the creek appears as a deep river; he reaches home with legs frozen
    to the knees and dies within days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Yûñwi Tsunsdi' help a settlement at night and care for lost children until
    offended, after which they cross a river ford and disappear into a large cave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Yûñwi Amai'yine'hi live in water and fishermen pray to them for help.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Unseen friendly spirits live in houses and protect them so that witches cannot
    come near to do mischief.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tsawa'si and Tsaga'si are small fairies who are mischievous but often help
