  summary: The passage describes the 1819 Washington treaty and Cherokee land cession;
    the 1820 adoption of a republican governmental structure modeled on the United
    States; the development of laws, courts, districts, and national authorities;
    the presence and work of missions, schools, translators, and Cherokee-language
    publications; and the impending importance of the invention of the Cherokee alphabet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A treaty concluded at Washington on February 27, 1819, states that much of
    the Cherokee nation wished to remain in the East and settle issues from the 1817
    treaty by ceding land to the United States.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The 1819 cession included tracts in Alabama, Tennessee, North Carolina, and
    Georgia, plus six small pieces reserved by previous treaties.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The entire cession is described as nearly six thousand square miles, more
    than one-fourth of the land then held by the nation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Individual reservations of one square mile were allowed to certain families
    who chose to remain among whites and become citizens rather than abandon their
    homes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The treaty provided payment for substantial abandoned improvements, assigned
    one-third of tribal annuities to the western band, and declared itself a final
    adjustment of claims from the 1817 treaty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: In fall 1820 the Cherokee adopted a regular republican form of government
    modeled after that of the United States.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The nation was divided into eight districts, each sending four representatives
    to the Cherokee national legislature at Newtown or New Echota.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: The legislature had an upper and lower house, described in Cherokee as the
    national committee and national council.
  category: object
  evidence_refs:
  - ev:2
- id: obs:9
  text: John Ross was the first person to hold the office styled president of the
    national council.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:10
  text: Districts had council houses, judges, marshals, light horse companies, and
    rangers, and the government enacted laws on taxes, debts, roads, schools, licenses,
    liquor, slavery, theft, marriage, and polygamy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:11
  text: The right of blood revenge or capital punishment was removed from the seven
    clans and vested in constituted national authorities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:12
  text: Individual negotiation of land sales to whites without national council consent
    was made treason punishable by death, and white men were not allowed to vote or
    hold office in the nation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:13
  text: Five principal missions and one or two smaller branches were active in the
    Cherokee nation, including Spring Place, Oothcaloga, Brainerd, Valley-towns, and
    Coosawatee.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:14
  text: The Brainerd mission had nearly one hundred pupils and reportedly had to turn
    away applicants for lack of accommodation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:15
  text: The superintendent reported that Cherokee children were apt to learn, willing
    to labor, submissive to discipline, and that Cherokee people desired instruction.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:16
  text: Currahee Dick is described as a prominent local mixed-blood chief who prompted
    the establishment of the Valley-towns mission.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:17
  text: Reverend Evan Jones is identified as translator of the New Testament into
    Cherokee; James D. Wafford compiled a Cherokee spelling book; Reverend S. A. Worcester
    translated and compiled Cherokee-language works.
  category: action
  evidence_refs:
  - ev:3
- id: obs:18
  text: Since 1817 the American Board had supported an Indian school at Cornwall,
    Connecticut, where young Cherokee were educated, including Elias Boudinot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:19
  text: The passage closes by announcing the invention of the alphabet as an event
    that placed the Cherokee in the front rank among native tribes and would influence
    their future history.
  category: sequence
  evidence_refs:
  - ev:4
