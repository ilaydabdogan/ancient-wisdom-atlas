comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the Cherokee sun-moon face-marking myth with
    traditions from Greenland, Panama, Brazil, and Northern India, and gives parallel
    details from Khasia, Amazonian, and Greenland accounts.
  claim_level: same_motif
  target: Sun-moon face-marking myths in Greenland, Panama, Brazil, Northern India,
    Khasia, Amazonian, and Greenland Eskimo traditions
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage summarizes secondary reports and does not provide full
    texts for all named regions.
- id: claim:2
  claim: The passage describes a British Columbia story and a Cheyenne story as similar
    to the sun-moon marking incident, though their figures and outcomes differ.
  claim_level: same_motif
  target: British Columbia Thompson River story and Cheyenne tale with Pleiades offspring
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The British Columbia story involves a dog transformed into a man, and
    the Cheyenne story has human figures and Pleiades offspring, so only part of the
    pattern is stated as similar.
- id: claim:3
  claim: The passage presents the eclipse monster frightened by horrible noises as
    a widespread or universal pattern, with the Cherokee frog-swallowing expression
    and Adair's Cherokee eclipse-noise account as local evidence.
  claim_level: same_motif
  target: Eclipse monster frightened away by noise motif
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage asserts universality but cites only a brief note and one
    Cherokee eyewitness-style report here.
- id: claim:4
  claim: The passage compares the Cherokee Thunderers with similar Iroquois and eastern
    tribal conceptions and with southern tribal statements that holy people are at
    war above the clouds during storms.
  claim_level: same_function
  target: Iroquois, eastern tribal, and southern tribal thunder-being or sky-war traditions
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is functional and descriptive; no historical relationship
    is established in the passage.
- id: claim:5
  claim: 'The passage compares thunder explanations involving supernatural storm beings:
    twin brother Thunderers in Portuguese West Africa and a great thunder-and-lightning
