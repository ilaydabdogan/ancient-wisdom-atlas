canonical_text:
  quote: '"the frog is swallowing the sun or moon"'
  summary: Notes compare Cherokee stories about the moon, thunder, rainbow, eclipse,
    and stars with other traditions. The passage describes sun-moon sibling and face-marking
    variants, an eclipse frog or monster resisted by noise, Thunderers associated
    with Kana'ti, mountains, cliffs, waterfalls, and storms, rainbow beliefs and taboos,
    and the belief that stars are birds.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Cherokee story of the sun and moon was obtained from Swimmer and later
    from other informants; Hagar records a variant in which a girl blackens her brother's
    face with seven charred corn cobs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the same myth is found among native tribes of Greenland,
    Panama, Brazil, and Northern India.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Khasia account summarized here, the moon is male, falls in love with
    his wife's mother, and has ashes thrown in his face; the sun is female.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the northern Amazon account summarized here, the moon is a maiden who falls
    in love with her brother, visits him at night, and is betrayed when he passes
    a blackened hand over her face.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Greenland Eskimo account, the Sun and Moon are sister and brother;
    Malina smears soot from a lamp on Anninga's face and hands so that she can recognize
    him by daylight, explaining the spots on the moon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage notes a similar British Columbia story involving a girl and a
    dog transformed into a man, and a similar Cheyenne myth in which the offspring
    become the Pleiades.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The myth connecting the moon with ballplay is attributed to Haywood, apparently
    on the authority of Charles Hicks.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Cherokee name for an eclipse is translated as the frog swallowing the
    sun or moon; an 1736 account describes Cherokee people making loud noises, firing
    guns, beating kettles, and ringing bells during a lunar eclipse to assist the
    suffering moon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that in probably every tribe both sun and moon are called
    by the same name with a distinguishing adjective.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Cherokee name for Thunder is an animate plural form meaning the Thunderers
    or They who make the Thunder; the great Thunderers are Kana'ti and his sons.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Inferior thunder spirits are said to people cliffs, mountains, and especially
    great waterfalls, whose roar is believed to be the voice of the Thunderers.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Adair reports that southern tribes described prolonged rain, thunder, and
    wind as holy people at war above the clouds.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says that in Portuguese West Africa the Thunderers are twin brothers
    answering each other from east and west, and that among Plains tribes thunder
    and lightning are caused by a great bird.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The rainbow is described as the beautiful dress of the Thunder god; in Mangaia
    it is Tangaroa's girdle, which he lets down until it reaches earth when he wishes
    to descend.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: A dread of pointing at the rainbow, under penalty of a withered or misshapen
    finger, is reported among many tribes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Swimmer's story is said to embody the old tribal belief that stars are birds;
    another informant told Hagar that a fallen star was found as a small bird.
  category: attribute
  evidence_refs:
  - ev:10
