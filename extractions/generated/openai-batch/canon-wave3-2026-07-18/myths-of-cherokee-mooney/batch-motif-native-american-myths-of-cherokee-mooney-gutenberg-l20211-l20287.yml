canonical_text:
  quote: ''
  summary: The passage reports several explanations for carved impressions or petroglyphs,
    including hunters making them, animals and birds fleeing over soft newly created
    earth, and an account in which a flood destroys living beings except one family
    and selected animals who embark in a big canoe commanded by the Great Spirit and
    later disembark at the rock, leaving impressions. It also discusses War Woman's
    creek and possible Cherokee associations with female war authority or women warriors,
    then introduces Cherokee plant lore, emphasizing agriculture, luxuriant flora,
    medicinal practice, and a belief that plants are friendly to humans and aid doctors
    against hostile animals.
  language: English
  quote_policy: summarized
