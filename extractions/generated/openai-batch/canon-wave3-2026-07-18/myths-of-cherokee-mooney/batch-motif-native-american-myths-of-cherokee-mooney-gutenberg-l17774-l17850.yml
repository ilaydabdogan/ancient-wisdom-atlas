canonical_text:
  quote: ''
  summary: A Seoqgwageono messenger challenges the Cherokee to ball play. The Cherokee
    lose, but visiting Seneca win repeated ball games and races; a Cherokee chief
    advises allowing the opponents one race to avoid trouble. Later the Seoqgwageono
    challenge the Cherokee and then the Seneca to battle. With Cherokee guides, the
    Seneca send two men who approach the town by feigning play with darts, kill and
    scalp a lone man, evade horsemen, and draw pursuers into a Seneca ambush. The
    passage ends by saying the Seoqgwageono are conjurers who can foretell others’
    actions but not those of the Seneca, whose medicine is stronger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A messenger from the Seoqgwageono, said to live near the great salt water
    in the east, comes to challenge the Cherokee to ball play.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The messenger is described as wearing skins so long that they touch the ground.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Seoqgwageono arrive on the appointed day, make heavy bets including costly
    robes, and the Cherokee lose the first ball game.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Seneca then play against the Seoqgwageono, win points quickly, and win
    repeated ball games with doubled bets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the first race the Seneca runner finishes just behind the opponent and
    says he has not done his best; in the second race he pulls ahead and wins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: For the long race, the Cherokee chief advises allowing the Seoqgwageono one
    race because losing everything might cause trouble; a Cherokee runner is then
    beaten.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A few days later the Seoqgwageono send a messenger challenging the Cherokee
    to meet them halfway for battle, and the Cherokee advise the few Seneca present
    to go home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Three years later the Seneca return; the Cherokee tell them the Seoqgwageono
    had won the battle and that the enemy chief said he wanted to fight the Seneca
    because he was a double man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Seneca set out toward the Seoqgwageono country with Cherokee guides and
    plan for two messengers to arrive near sundown.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The two Seneca messengers see the people of the town playing ball, approach
    from another side while throwing sumac darts so they will be mistaken for men
    at play, and get close enough to kill and scalp a man standing alone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After raising the scalp yell, the two Seneca flee through the woods, encourage
    each other to be strong, see Seoqgwageono coming on horses, and hide under a dry
    creek bank until the enemy pass.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The next morning the enemy pursue the two Seneca on horses and shoot arrows
    at them near an opening where Seneca forces are hidden on both sides of the pass.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: When the pursuers enter the pass, the two lines of Seneca close in, and every
    Seoqgwageono pursuer is killed or taken.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Cherokee later say the Seoqgwageono regard the Seneca as dangerous; the
    Seoqgwageono are called conjurers who can tell what other people will do but cannot
    tell what the Seneca will do.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Cherokee statement concludes that Seneca medicine is stronger.
  category: attribute
  evidence_refs:
  - ev:6
