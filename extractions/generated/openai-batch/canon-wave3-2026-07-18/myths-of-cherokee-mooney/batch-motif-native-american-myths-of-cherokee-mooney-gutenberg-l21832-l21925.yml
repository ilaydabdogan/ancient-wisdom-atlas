canonical_text:
  quote: ''
  summary: Notes and parallels discuss asking pardon of slain animals, with an Ojibwa
    bear-killing ceremony quoted from Henry; the Rabbit or Hare as a shrewd trickster-like
    animal in Indian, Angolan, and Korean tales; historical notes on buffalo and elk;
    and a Cherokee and southern tribal custom of cutting or avoiding a deer thigh
    sinew or hamstring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note links Cherokee references to asking pardon of animals with remarks
    on the Little Deer, Wolf, Rattlesnake, and selected numbered myths, then states
    that the custom was likely general among tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Ojibwa example, after a bear was killed, people handled the bear's
    head, stroked and kissed it, asked pardon for taking its life, called it a relation
    and grandmother, and shifted blame to the Englishman who killed it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bear carcass was skinned and divided into heavy portions of fat and flesh
    for transport.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the lodge, the bear's head was decorated with family trinkets, placed on
    a scaffold, and given tobacco near its nose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The next morning the lodge was cleaned, an unused blanket was put under the
    bear's head, pipes were lit, and Wawatam blew tobacco smoke into the bear's nostrils
    to appease its anger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Wawatam gave a speech to the bear's manes, saying men must destroy their friends
    in order to subsist; afterward the group ate the bear flesh, and after three days
    the head was cooked.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the Rabbit or Hare has a symbolic character in Indian myth
    and, as an animal actor, is assigned trickery and surpassing sagacity in other
    parts of the world.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage compares the shrewd Hare in Angolan folktales and the Rabbit who
    tends to come off best in Korean tales with the Rabbit or Hare in Indian myth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The buffalo note reports abundance of buffalo in Cherokee East Tennessee in
    1762 and describes a camp incident in which seventeen or eighteen buffalo ran
    among people, women sheltered behind trees, and one buffalo was killed while others
    were wounded.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The elk note reports that elk ranged in eastern Carolina in 1700 and describes
    the animal's skin, flesh, hams, and habit of feeding with buffalo.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The hamstring note says no satisfactory reason had been obtained for the custom,
    but records that Cherokee avoided eating a certain thigh sinew, with one explanation
    connecting it to cramp, and that southern tribes cut a piece from the lower thigh
    of deer they killed.
  category: action
  evidence_refs:
  - ev:10
