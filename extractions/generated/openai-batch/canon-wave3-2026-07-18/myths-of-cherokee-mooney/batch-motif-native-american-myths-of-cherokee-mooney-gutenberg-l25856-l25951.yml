literal_observations:
- id: obs:1
  text: The passage says that conjuring favored spots to make them fatal to an invading
    enemy was common to many tribes, and gives the Creek War “Holy ground” as an example
    believed lethal to white troops because of mystic rites performed by prophets.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacred fire is described as produced by rubbing dry wood with goldenrod
    and as kept smoldering in the townhouse in ancient times.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Older East Cherokee are said to believe that the ancient fire still burns
    inside the mounds at Franklin and Bryson City; some men reported seeing smoke
    from the Bryson City mound during the Civil War period.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buttrick’s Cherokee-derived account says that when enemies destroyed the house
    where the holy fire was kept, the fire settled into the earth and still lives
    there unknown to the people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Payne’s account places the kindling of new fire within an annual spring festival,
    after purification and ceremonial preparation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The new-fire altar is described as a conical fresh-earth altar in the center
    of the townhouse, with a circle on top for sacrificial fire and inner bark from
    seven tree species gathered from the east side.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Seven commissioned persons kindle the new fire: one official fire-maker and
    six assistants; goldenrod is placed in a hole in wood and ignited by whirling
    a fitted stick.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After old fires are extinguished and hearths cleansed, women take the newly
    kindled flame from the hearth to every house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A sacrifice is made in each new household fire from the first meat killed
    afterward by the household’s people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says similar annual sacred new-fire ceremonies were common among
    many tribes, especially southern tribes and the Pueblos, and adds that fire worship
    was very ancient and widespread.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Cherokee sacred ark or wooden box is described in cited sources, and its
    loss after capture by the Delawares is said by old priests to have caused later
    tribal degeneracy.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Adair’s description presents the ark as covered with dressed deerskin, placed
    on short blocks, and guarded by an armed sentinel who prevents an outsider from
    viewing its inside.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage groups the Cherokee ark with tribal palladiums or medicines whose
    existence and prosperity are supposed to depend on them, kept by a priest permitted
    to unwrap or expose the contents.
  category: relationship
  evidence_refs:
  - ev:8
