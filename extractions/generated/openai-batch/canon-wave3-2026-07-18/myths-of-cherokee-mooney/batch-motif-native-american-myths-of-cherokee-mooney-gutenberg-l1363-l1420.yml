canonical_text:
  quote: ''
  summary: Historical account of Sir Alexander Cuming's 1730 mission to the Cherokee,
    the designation of Moytoy, a Cherokee delegation and treaty at Whitehall, later
    colonial military considerations, a devastating smallpox epidemic and Cherokee
    responses to it, and the marking of a trading path followed by Kâ'lanû's participation
    in an expedition against Saint Augustine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sir Alexander Cuming was sent on a secret mission to the Cherokee in 1730
    to strengthen English influence while the Cherokee were close to alliance with
    the French through the Creeks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Nequassee, Cherokee chiefs accepted Cuming's demands, submitted themselves
    and their people to English dominion, and designated Moytoy of Tellico to act
    as their "emperor" and represent the Nation in dealings with whites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Seven Cherokee chiefs went to England and renewed a treaty at Whitehall acknowledging
    English sovereignty and agreeing to restrictions on trade, alliance, white settlement,
    and fugitive slaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: To confirm the treaty words, the Cherokee delegates delivered a crown, five
    eagle-tails, and four scalps; in return they received promises of love and friendship
    along with guns, ammunition, and red paint.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the following year, a plan to use the Cherokee and Catawba against a Tuscarora
    remnant was avoided when it appeared likely to provoke the Iroquois.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Smallpox, said to have been brought to Carolina by slave ships, broke out
    among the Cherokee in 1738 or 1739 and caused severe mortality.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Because the disease was unfamiliar, Cherokee sufferers resorted to cold plunge
    baths in running streams as a remedy for strong sickness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: As the pestilence spread, priests interpreted the visitation as a penalty
    for violating ancient ordinances and threw away sacred paraphernalia that they
    believed had lost protective power.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Many warriors committed suicide after seeing their disfigurement, using guns,
    knives, sharp canes, or fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Around 1740, the Cherokee marked out a horsemen's trading path from Augusta
    to their towns and westward; in the same year Kâ'lanû, "The Raven," joined Oglethorpe's
    expedition against the Spaniards of Saint Augustine.
  category: sequence
  evidence_refs:
  - ev:7
