  summary: The passage gives notes on the Cherokee gaming wheel and wheel-and-stick
    game, including historical descriptions and mythic parallels; explains archaic
    directional terms for the western twilight spirit land and eastern sun region;
    describes powers attributed to lightning-struck tree wood; distinguishes Little
    Men or Thunder Boys from other thunder beings; and records deer-hunting songs
    used by hunters.
  language: English
  quote_policy: summarized
