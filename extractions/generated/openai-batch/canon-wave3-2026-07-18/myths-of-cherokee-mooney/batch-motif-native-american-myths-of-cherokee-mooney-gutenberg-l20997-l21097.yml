comparison_claims:
- id: claim:1
  claim: The wheel-and-stick game object appears across multiple southeastern and
    other Native North American contexts under different names and descriptions.
  claim_level: same_function
  target: Wheel-and-stick game, snow-snake, chunki or chungkey, and related tribal
    gaming traditions
  evidence_refs:
  - ev:1
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports broad distribution and names but does not give
    detailed rules for every named tradition.
- id: claim:2
  claim: The Kana'ti myth version and the Creek story both involve a wheel-like object
    with extraordinary narrative function, though the functions differ.
  claim_level: same_motif
  target: Cherokee arrow-wheel above-sky episode and Creek locating wheel story
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The Cherokee object is an arrow form of the wheel connected with upward
    travel, while the Creek wheel locates lost things; the passage only briefly notes
    the parallel.
- id: claim:3
  claim: The belief that lightning-struck tree wood has special potency is presented
    as shared by American tribes and Europe.
  claim_level: same_function
  target: Lightning-struck tree wood potency in American tribal and European contexts
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the comparison but gives details only for Cherokee
    uses in this excerpt.
- id: claim:4
  claim: The passage distinguishes multiple Cherokee thunder-being categories by dwelling
    place and kind of thunder produced.
  claim_level: same_function
  target: Little Men or Thunder Boys, Yûñwi Tsunsdi' Little People, and Great Thunderer
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
