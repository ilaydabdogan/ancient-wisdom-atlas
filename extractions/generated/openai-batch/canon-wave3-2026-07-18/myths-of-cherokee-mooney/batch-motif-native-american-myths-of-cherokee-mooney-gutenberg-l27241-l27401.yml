literal_observations:
- id: obs:1
  text: Gatûñ'lti'yi is glossed as “Hemp place” and identified as a former Cherokee
    settlement known as Hemptown on a creek near Morganton in Fannin County, Georgia.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gatûñ'wa`li is described as a noted western Cherokee about 1842, known in
    English as “Hard-mush” or “Big-mush,” with the name explained through a thick
    parched-corn-meal mush made in lumps.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The entry ge''i gives directional meanings: down stream, down the road, or
    with the current; tsâ''gi is given as up stream.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ge`yagu'ga is given as a formulistic name for the moon and is said to seem
    to contain the word for “woman,” although the entry says it cannot be analyzed.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Several entries link blood or red coloration with animal names: gi''ga-danegi''ski
    means “blood taker” and names the scorpion lizard; gi''ga-tsuha''`li means “bloody-mouth”
    and names a large lizard.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Gi`li' means dog; Gi`li'-dinehûñ'yi is glossed as “Where the dogs live,” and
    Gi`li'-utsûñ'stanuñ'yi is glossed as “Where the dog ran” and identified as the
    Milky Way.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Guaquili and Guaxule are identified as towns in the Cherokee country visited
    by Spanish expeditions; Guaxule is placed probably near Nacoochee mound in White
    County, Georgia.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Gû'daye'wû is translated as “I have sewed myself together.”
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Gugwe' is identified as the quail or partridge and described as onomatopoeic;
    gugwe'-ulasu'la, “partridge moccasin,” names the ladyslipper plant.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Gûlâhi'yi is a place name derived from an unidentified spring plant eaten
    as salad, and the entry associates the name with locations near Currahee mountain
    and Cullowhee river.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Gûle' means acorn; gûle'-diska`nihi' names the turtle-dove and is explained
    as “it cries, or mourns, for acorns,” with the bird said to feed upon acorns and
    have a cry resembling gule'.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Gûle'gi means “climber” and is identified as the blacksnake.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: Gûl`kwâ'gi means seven and is also a name for the mole-cricket.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: Gû'nahitûñ'yi means “Long place” or Long valley and is identified with a former
    settlement known as Valleytown on Valley river in Cherokee County, North Carolina.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:15
  text: Gûn'-di'gaduhûñ'yi means “Turkey settlement” and is said to be named from
    the chief Turkey or Little Turkey.
  category: relationship
  evidence_refs:
  - ev:15
