    on the East Cherokee reservation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ta'gû is identified as the June-bug and is also called by a name glossed as
    “one who keeps fire under the beans.”
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ta'gwadihi' is glossed as “Catawba-killer,” from words for Catawba Indian
