  summary: The passage describes Andrew Jackson's election, Georgia's extension of
    jurisdiction over Cherokee territory, laws nullifying Cherokee legal customs and
    excluding Cherokee testimony against white defendants, distribution of Cherokee
    lands by lottery, restrictions on Cherokee public assembly and gold digging, and
    subsequent violence, arson, mining suppression, and execution under state authority.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Andrew Jackson was elected president in November 1828, and the passage states
    that the change was unfavorable to the Cherokee.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Georgia passed an act annexing the part of Cherokee country within its chartered
    limits and extending state jurisdiction over it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The act declared Cherokee laws and customs null and void and barred persons
    of Indian blood or descent from being witnesses or parties in suits where a white
    man was defendant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cherokee territory was surveyed into land lots and gold lots and distributed
    among white citizens of Georgia by public lottery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cherokee heads of families were allowed nominal reservations of 160 acres,
    but no deed was given and continuance depended on the legislature.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that Indian owners were made unable to defend property
    rights in court or resist seizure of homesteads or dwelling houses without risking
    imprisonment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Additional laws invalidated some contracts without white witnesses, required
    white residents to swear allegiance to Georgia, and forbade Cherokee councils,
    public assemblies, and gold digging on their lands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Edward Everett and Senator Sprague described the laws as exposing Cherokee
    people and property to violence and robbery without effective legal testimony
    against white offenders.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Bands of armed men entered Cherokee country, seized horses and cattle, occupied
    houses after ejecting occupants, and assaulted owners who resisted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Near present Dahlonega, two white men entertained at supper by an educated
    Cherokee citizen later drove out children and a nurse and burned the house; the
    case was dismissed because no Indian could testify against a white man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Cherokee miners on their own ground were arrested, fined, imprisoned, and
    had tools and machinery destroyed while white intruders mined unmolested.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Cherokee man tried for killing another Indian was seized by state authorities,
    condemned though unable to defend himself in English, and hanged despite a United
    States court order forbidding the execution.
  category: sequence
  evidence_refs:
  - ev:9
