canonical_text:
  quote: ''
  summary: 'Notes and parallels for several Cherokee animal stories: the bare-tailed
    Possum, the Wildcat catching the Gobbler through a hare-assisted dance trick,
    the Terrapin beating the Rabbit in a race, and the Rabbit and the tar wolf. The
    passage records variants, informants, and parallels in Creek, Kiowa, Omaha, Cheyenne,
    Jicarilla, Southern Black American, and European folklore traditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In variants of the bare-tailed Possum story, the tail-hair clipping is attributed
    either to the Moth or to the spells of the Snail, who is described as a magician.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Creek version says the Opossum burned the hair from his tail while trying
    to put rings on it like those of the Raccoon, and that he grins after chewing
    a bitter oak ball mistaken for ripe fruit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports Indigenous speculation about opossum anatomy, including
    beliefs about female reproduction and the pouch.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that great council gatherings were occasions for dances,
    feasting, and general festivity.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the quoted Wildcat and Gobbler story, wild turkeys hear a hare singing
    about a secret he will not reveal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: The turkeys ask the hare to tell them the secret, and the hare agrees on condition
    that they procure the king's daughter for his wife and go with him to dance around
    their enemy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hare leads the turkeys to a wildcat that appears to be dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The hare persuades the turkeys to close their eyes while dancing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: While the turkeys dance with closed eyes, the wildcat silently rises and kills
    several of them before the rest discover the snare.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says the Wildcat and Gobbler story and variants are among the
    most widespread animal myths.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: In a Creek version of the same story, the Rabbit's tail is afterward bitten
    off by enraged Turkeys.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In another Creek version, the Raccoon plays a similar trick on the Deer for
    the benefit of the Panther.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In a Kiowa version, Sinti entices prairie dogs near him under pretense of
    teaching them a new dance, then kills all but one while they dance around him
    with eyes shut.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In Omaha versions, the Rabbit captures Turkeys during a closed-eye dance to
    his singing, and a similar stratagem appears in a story of the Raccoon and the
    Crabs.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Terrapin-beats-Rabbit story is described as well known in the tribe and
    sometimes told with the Deer instead of the Rabbit as the defeated runner.
  category: other
  evidence_refs:
  - ev:11
- id: obs:16
  text: Creek versions of the Terrapin story have either the Deer or the Wolf defeated
    by the Terrapin's stratagem.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The Rabbit and the tar wolf story was obtained from James Wafford in Indian
    Territory, who said he had heard it repeatedly in boyhood from Cherokee who spoke
    no English.
  category: other
  evidence_refs:
  - ev:13
