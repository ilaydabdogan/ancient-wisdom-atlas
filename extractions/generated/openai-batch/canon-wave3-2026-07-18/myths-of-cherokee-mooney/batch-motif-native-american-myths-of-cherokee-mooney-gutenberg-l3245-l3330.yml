canonical_text:
  quote: ''
  summary: A historical account describes the planning and execution of Ore's expedition
    against the Chickamauga towns of Nickajack and Running Water in 1794, subsequent
    threats and peace negotiations with Cherokee leaders, Chickamauga relocation and
    return negotiations in Ohio, Cherokee refusal to patrol against the Creeks, and
    federal attempts to restrict unauthorized settlement on Indian lands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tennessee frontier settlers concluded that peace required destroying the Chickamauga
    towns, although federal orders had been issued against such an attempt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: General Robertson organized volunteers near Nashville, Kentuckians joined
    under Colonel Whitley, and Major Ore was given chief command of the expedition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: An army of five hundred and fifty mounted men left Nashville, crossed the
    Tennessee near the Sequatchee, and used Joseph Brown as guide.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The expedition surprised Nickajack, killed several warriors, took prisoners,
    and shot some people who attempted to escape in canoes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Warriors from Running Water came to assist Nickajack, were driven back, and
    Running Water was also destroyed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Breath, chief of Running Water, was among those killed; scalps, plunder,
    and ammunition were found in the towns.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Robertson warned John Watts that another attack would follow unless prisoners
    were surrendered and assurances of peace were given.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Tellico blockhouse, Governor Blount met Hanging-maw, John Watts, and about
    four hundred warriors; the account says the war then came to an end.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A Chickamauga Cherokee group had moved across the Ohio to Paint creek near
    Shawano allies, participated in Ohio frontier hostilities, and later some promised
    that the band would return south.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Cherokee chiefs refused Governor Blount's request to organize young men to
    patrol against the Creeks.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Congress passed a measure to regulate intercourse with Indian tribes and prevent
    intrusion onto lands whose Indian title had not been extinguished by federal treaty.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some squatters were ejected from Indian country, but pressure continued for
    expanded white settlement and another treaty cession.
  category: sequence
  evidence_refs:
  - ev:6
