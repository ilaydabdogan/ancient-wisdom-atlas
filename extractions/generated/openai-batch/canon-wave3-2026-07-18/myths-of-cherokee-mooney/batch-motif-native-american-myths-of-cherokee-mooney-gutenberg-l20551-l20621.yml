canonical_text:
  quote: ''
  summary: The passage describes Cherokee uses of plants in washes, cures, conjurations,
    hunting and fishing practices, future-looking ceremonies, memory rites involving
    cataract water and the Long Man, tabus in adult rites, and a priest-led water
    rite intended to gain social favor before travel or council.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Catgut or devil's shoestring roots are made into a hair wash for strength
    and toughness, and its leaves are used by ballplayers to wash themselves to toughen
    their limbs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ballplayers also bathe their limbs with small rush decoction so that, if thrown
    down, they may spring quickly to their feet; the rush is said to recover its erect
    position after being trampled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: White seeds of viper's bugloss were formerly used in important ceremonies
    intended to look into the future, but ordinary traders' glass beads have replaced
    them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Culver root is used in love conjurations, and an omen is taken from the root's
    motion while held in the hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Campion, locally called rattlesnake's master, is used as a remedy for snake
    bites, and a person carrying a small portion of the root in the mouth is believed
    to make even a deadly snake flee.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Burs called 'stickers' are believed to improve memory and stability of character
    because they hold fast to objects they touch.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Soon after birth, a small bur species is beaten and put into water from a
    noisy fall or cataract, then given to the child to drink on four successive days
    so the child will learn quickly and remember what is heard.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The noise of the cataract is believed to be the voice of Yûñwi Gûnahi'ta,
    the Long Man or river god, teaching lessons the child may understand; the stream
    is revered for seizing and holding things cast on it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A similar adult ceremony may be performed with tabus for four or seven days;
    if the subject loses temper during that time, the subject will remain quarrelsome
    thereafter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A tuberous flowering-vine root with milky juice is rubbed on a deer bleat
    so that a doe will think her fawn wants to suck and come sooner.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A deer hunter carries putty-root and puts chewed root into a shot deer's wound,
    expecting to find the animal unusually fat; infants that pine and grow thin are
    bathed with a decoction of the same root to fatten them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The root of Venus' flytrap is chewed and spit upon bait, and the plant is
    tied upon a fish trap, so that no fish may escape.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: For a person about to travel or take part in a council, the priest prays over
    a spiral-root plant at running water, chews it, and rubs and blows it on the person's
    body and arms so that those who meet or hear the person will be favorable.
  category: sequence
  evidence_refs:
  - ev:10
