  summary: The passage critiques Pickett's use of transmitted Indian traditions for
    locating De Soto's route and Chiaha, argues from original narratives that Chiaha
    was a Lower Creek town on the Chattahoochee near modern Columbus rather than at
    Rome, Georgia, and describes the river, falls, settlements, mounds, trail, town
    movements, and Cherokee-Creek boundary context.
