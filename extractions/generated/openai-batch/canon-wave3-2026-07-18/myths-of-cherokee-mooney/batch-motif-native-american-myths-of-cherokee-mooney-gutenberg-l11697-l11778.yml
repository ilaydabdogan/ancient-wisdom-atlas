- id: obs:2
  text: Selu instructs the boys to clear ground, drag her body seven times around
    and across a circle, stay awake all night, and expect plenty of corn in the morning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boys kill Selu with clubs, cut off her head, place it on the roof with
    the face turned west, and tell it to look for her husband.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boys clear only seven small spots rather than the whole piece of ground;
    the passage gives this as the reason corn grows only in some places.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Corn springs up where Selu's blood falls, and the boys drag her body across
    the ground only twice; the passage gives this as the reason crops are worked twice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The two brothers watch the corn through the night, and by morning it is full
    grown and ripe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Kana'ti returns, asks where Selu is, sees her head on the roof, becomes angry,
    and says he is going to the Wolf people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Wild Boy changes into a tuft of down, lands on Kana'ti's shoulder, enters
