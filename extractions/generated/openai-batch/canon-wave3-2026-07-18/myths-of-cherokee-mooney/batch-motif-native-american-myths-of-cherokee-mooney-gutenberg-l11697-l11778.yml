  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boys make a wide circular trail around the house with one opening, set
    four bundles of arrows at four points outside the circle, and hide in the woods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the Wolves enter the circle, the trail becomes a high brush fence; the
    boys shoot the trapped Wolves, and a few escape toward a swamp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boys run around the swamp, a circle of fire rises in their tracks, nearly
    all remaining Wolves burn, and the surviving few become the source of all present
