canonical_text:
  quote: wherever her blood fell on the ground the corn sprang up
  summary: Selu tells her sons how to obtain corn after killing her. The boys kill
    and behead her, only partially follow her instructions, and corn grows from her
    blood. Kana'ti angrily seeks the Wolf people against the boys, but the Wild Boy
    overhears by changing into bird's down. The boys trap and kill most of the Wolves
    with a circular trail that becomes a fence and a later circle of fire. Strangers
    receive seven grains of corn and instructions for nightly planting and watching,
    but after they fall asleep near home, corn no longer grows and ripens in a single
    night.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Selu knows the boys' intention before they speak, and the boys say they will
    kill her because they call her a witch.
  category: speech
  evidence_refs:
