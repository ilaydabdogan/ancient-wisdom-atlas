  locator: lines 12207-12307; THE JOURNEY TO THE SUNRISE, departure and tribes
  quote_or_summary: Several young men prepare bows, arrows, parched corn, and moccasins
    and travel east to find where the Sun lives, passing tribes known, heard of, and
    unknown, including root and acorn eaters.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 12207-12307; THE JOURNEY TO THE SUNRISE, mortuary custom
  quote_or_summary: The travelers witness a custom in which a dead man is lowered
    into a deep dark pit, then his wife is tied with rope and pine knots, given a
    lighted pine knot, and lowered to die when the light burns out.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 12207-12307; THE JOURNEY TO THE SUNRISE, sunrise place and Sun
  quote_or_summary: At the sunrise place the sky reaches the ground as a swinging
    solid rock arch or vault; its movement opens and shuts a doorway from which the
    hot, bright, human-figured Sun comes out.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 12207-12307; THE JOURNEY TO THE SUNRISE, failed passage and return
  quote_or_summary: The travelers try to pass through after the Sun emerges, but the
    first is crushed by the descending rock; the remaining six turn back and reach
    home as old men.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 12207-12307; THE MOON AND THE THUNDERS, Sun and Moon relationship
  quote_or_summary: The Sun is a young woman in the East; her brother the Moon lives
    in the West; an unnamed lover visits her each month in the dark of the moon.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 12207-12307; THE MOON AND THE THUNDERS, ash-marking plan
  quote_or_summary: To identify the visitor, the Sun dips her hand into fireplace
    cinders and ashes and rubs them on his face while pretending concern for his cold
    face.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 12207-12307; THE MOON AND THE THUNDERS, recognition and lunar behavior
  quote_or_summary: The next night the Moon's face has spots, revealing him as the
    visitor; ashamed, he stays far from the Sun and becomes thin as a ribbon when
    he must come near her in the west.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 12207-12307; THE MOON AND THE THUNDERS, alternate moon-as-ball saying
  quote_or_summary: Some old people say the moon is a ball thrown against the solid
    sky during a game after a leader unlawfully handled it; it remains there as a
    warning not to cheat, and games were formerly played only at full moon.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized.
