canonical_text:
  quote: ''
  summary: The passage contains a second version of a tobacco-retrieval story, a journey
    to the sunrise and the edge of the sky, and moon-related etiologies involving
    the Sun, Moon, ash marks, shame, lunar phases, and a ball game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people once had tobacco, used it all, and suffered because it was gone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old man was kept alive by smoking, and his son decided to seek more tobacco
    so his father would not die.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tobacco country lay far to the south, surrounded by high mountains and
    guarded passes.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son put on a hummingbird skin from his medicine bag, became a hummingbird,
    flew over the mountains, took tobacco leaves and seed, and returned unseen by
    the guards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After returning to human form, the son encountered a tree with a doorway-like
    hole and a pretty woman looking out from it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The son could climb the tree only after putting on medicine moccasins, but
    the hole appeared farther away whenever he climbed toward it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: One draw at the pipe made the old father strong again, and the people planted
    the tobacco seed and thereafter had tobacco.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Several young men traveled east to find where the Sun lives, passing through
    known, heard-of, and unknown tribes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At one tribe, the travelers saw a custom in which a dead man's wife was lowered
    into a deep pit with pine knots and a lighted pine knot to die in darkness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the sunrise place, the sky reached the ground as a solid rock arch or vault
    that swung up and down, making and closing a doorway.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Sun emerged from the eastern doorway, had a human figure, and was too
    bright and hot for the travelers to approach closely.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: One traveler was crushed by the rock sky while trying to pass through the
    doorway, and the others returned home as old men.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the moon story, the Sun was a young woman in the East, and her brother
    the Moon lived in the West.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: A lover came to the Sun every month during the dark of the moon, but she could
    not see his face and he would not give his name.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Sun rubbed ashes and cinders on the lover's face, later saw spots on the
    Moon, and recognized her brother as the visitor.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:16
  text: After being recognized, the Moon stayed far from the Sun and became thin when
    he had to come near her in the west.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: An alternate saying explains the moon as a ball thrown against the solid sky
    during a game after a leader handled it unfairly.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:18
  text: The ball fixed in the sky is said to remind players not to cheat, and play
    was formerly limited to the full moon.
  category: speech
  evidence_refs:
  - ev:13
