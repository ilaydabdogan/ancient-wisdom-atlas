- id: obs:2
  text: Birds return several times; the Tsundige'wi drive them off with clubs until
    tall sandhill cranes come and kill them because the little men cannot reach the
    cranes' necks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A boy of the Ani'-Tsâ'gûhi clan repeatedly leaves home for the mountains,
    stops eating in the house, and begins growing long brown hair over his body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy says he finds better and plentiful food in the woods, plans to live
    there permanently, and tells his parents they must fast seven days if they want
    to come.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The parents tell the clan headmen; after council, the Ani'-Tsâ'gûhi decide
