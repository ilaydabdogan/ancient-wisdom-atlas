canonical_text:
  quote: ''
  summary: 'The passage closes one tale in which the Tsundige''wi, or little men,
    are eventually killed by sandhill cranes. It then gives the origin of bears from
    the Ani''-Tsâ''gûhi clan: a boy increasingly lives in the mountains, grows hair,
    invites his people to fast seven days and follow him, and the clan changes into
    bears, promising to answer ritual songs and give their flesh to hungry humans
    while living always. The passage includes bear songs and hunting instructions,
    then begins another tale in which a hunter wounds a black medicine bear that speaks,
    reads thoughts, cannot be killed, and invites the hunter to live with it.'
  language: English
  quote_policy: summarized
