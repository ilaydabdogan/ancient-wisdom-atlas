  summary: The passage gives historical and comparative notes on Cherokee War Women
    or Pretty Women, especially their authority over captives, adoption, punishment,
    pardon, and peace-and-war deliberations. It cites treaty and historical examples,
    then adds notes on running the gauntlet, canebrakes, the sky vault, Seneca and
    Cherokee Thunder terminology, thought reading, and woman arbiters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women described as War Women or Pretty Women are said to have had power to
    decide the fate of captives.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Documentary references are said to indicate a Cherokee custom analogous to
    one among the Iroquois, in which important peace-and-war questions were decided
    by women.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Iroquois, the privilege is described as exercised by a council of
    matrons, called the mothers of the tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A captive enemy remained an enemy until adopted into tribe, clan, and family;
    because clan descent was reckoned through women, the adoption decision rested
    with women.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: If women favored adoption, the captive became a member of a family, clan,
    and tribe; otherwise death remained unless ransom occurred.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The proper Cherokee title of the female arbiter is stated to be unknown; the
    Long-hair clan is sometimes called the Pretty-woman clan, and the office may have
    been hereditary there.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Timberlake reports that war women were admitted into national assemblies and
    that some women were famous in war and powerful in council.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the Hopewell treaty conference, a war woman of Chota addressed commissioners
    after a chief introduced her as a beloved woman who had borne and raised warriors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The war woman of Chota offered a pipe and tobacco to smoke in friendship,
    referred to the commissioners and red people as her children, and spoke of peace
    and an unbroken chain of friendship.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Haywood describes a Pretty Woman office empowered to declare punishment or
    pardon for great offenders; Mrs Ward is said to have used this office to pardon
    Mrs Bean when she was bound and about to be burned on a mound.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Running the gauntlet is described as a practice in which a warrior captive
    ran between two lines of people toward a goal; it tested courage and endurance
    with a view to possible adoption and was not intended to be fatal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The tall cane reed is described as common along southern streams, valued for
