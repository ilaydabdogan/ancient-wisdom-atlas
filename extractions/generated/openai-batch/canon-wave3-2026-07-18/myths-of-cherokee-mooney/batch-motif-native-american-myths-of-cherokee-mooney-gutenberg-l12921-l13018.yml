  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: At Rabbit's signal in song and drumming, Wildcat jumps up and catches the
    Gobbler.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Rabbit and Terrapin dispute their speed and agree to decide it by a race across
    four mountain ridges.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Rabbit grants Terrapin the first ridge as a head start because Rabbit is confident
