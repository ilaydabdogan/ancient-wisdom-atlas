canonical_text:
  quote: ''
  summary: 'The passage contains three animal tales: Cricket secretly shaves Possum''s
    tail before a dance, causing Possum public shame; Rabbit saves himself from Wildcat
    by using a feigned-dead Wildcat and a dance to trap the Gobbler; Terrapin defeats
    boastful Rabbit in a race across four mountain ridges by arranging help from other
    terrapins.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cricket comes to Possum's house to prepare him for a dance and wraps a red
    string around Possum's tail while secretly cutting off the hair near the roots.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Possum enters the dance, removes the string from his tail, sings about the
    tail's beauty, color, length, and fur, and is laughed at by the assembled animals.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Possum sees that his tail is bare like a lizard's tail, becomes ashamed, rolls
    helplessly on the ground, and grins; the narration links this to present-day possum
    behavior when surprised.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wildcat catches Rabbit and is about to kill him, but Rabbit offers to show
    Wildcat a drove of Turkeys if released.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rabbit instructs Wildcat to lie still as if dead and uses rotten wood on Wildcat's
    eyes and nose to make him appear long dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rabbit tells the Turkeys that their enemy Wildcat is dead and proposes a dance
