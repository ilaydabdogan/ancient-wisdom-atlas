canonical_text:
  quote: Perpetual peace and friendship shall exist between the citizens of the United
    States and the Cherokee Indians.
  summary: The passage gives treaty articles promising peace, protection, removal
    of unauthorized settlers, instruction by approved residents, and potential Cherokee
    representation; it then describes the signing and ratification of the New Echota
    treaty, Cherokee protests against it, federal suppression of council discussion,
    and Major W. M. Davis's later recognition of the situation while enrolling Cherokee
    for removal.
  language: English
