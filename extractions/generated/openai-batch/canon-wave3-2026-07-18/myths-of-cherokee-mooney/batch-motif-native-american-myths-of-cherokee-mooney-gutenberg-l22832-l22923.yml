canonical_text:
  quote: ''
  summary: 'The passage compiles notes on the Ulûñsû''ti or related crystal/carbuncle:
    luminous serpent chiefs with carbuncles in their heads; a Tymahse medicine-man''s
    rattlesnake-derived carbuncle; a crystal that can summon Little People to guard
    the sick; the described physical form of the Ulûñsû''ti; its rarity, concealment,
    and powers for success and divination; and an example of wartime divination by
    images seen in the crystal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Serpent-like creatures are described as having a large carbuncle in each head,
    with light from the forehead that dazzles observers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The creatures, along with rattlesnakes, are called kings or chieftains of
    snakes, and one such chief is allotted to each species of brute creation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The place where the creatures resort is treated as secret, and head-men refuse
    to allow young warriors to show it to an old trader.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Killing the creatures is said to expose the killer to bites from inferior
    snakes that love their chieftains and know the killers by instinct.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: A medicine-man or Cherokee prophet at Tymahse is reported to have owned a
    carbuncle found where a great rattlesnake lay dead; it shone brightly enough to
    illuminate his dark winter house and was buried with him.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A crystal owner is said to be able to call one of the Little People and make
    him do his bidding, including guarding a sick person after an evil invisible being
    has been expelled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ulûñsû'ti is described as a triangular, transparent crystal about two
    inches long, flat on the bottom, tapering to a point, and marked by a single red
    streak through the center.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other small stones used by Cherokee conjurers for lost articles or occult
    purposes are sometimes called by the same name and are said to have originally
    been scales of the Uktena.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The specific Ulûñsû'ti described here is identified as the talisman from the
    forehead of the serpent and is said to have been extremely rare among the East
    Cherokee by 1890.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: One owner, a famous hunter, kept the talisman hidden in a cave wrapped in
    deerskin and refused to show or part with it, saying exposure to a white man would
    end his hunting success and might cost his life after sacrilege.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Possession of the talisman is said to ensure success in hunting, love, rain
    making, and other undertakings, with its greatest use being life divination in
    which the future is mirrored in the crystal.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: In consultation, a conjurer gazes into the crystal and sees a picture of the
    person or event; the specter's action or its position near the top or bottom indicates
    the event and its nearness in time or place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: East Cherokee men enlisting in Confederate service consulted the Ulûñsû'ti;
    in one account, three men's images rose along the red line, leading the conjurer
    to predict two deaths in the second year of war and the third man's survival and
    return.
  category: sequence
  evidence_refs:
  - ev:8
