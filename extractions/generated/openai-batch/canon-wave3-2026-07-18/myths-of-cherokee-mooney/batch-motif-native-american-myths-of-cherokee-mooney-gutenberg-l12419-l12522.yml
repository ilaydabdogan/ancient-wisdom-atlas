canonical_text:
  quote: ''
  summary: The passage contains three etiological narratives. In the first, the first
    man and woman separate after quarreling; Une'`lanûñ'hi, the Sun/Apportioner, places
    fruits along the woman's eastward path until first strawberries cause her to remember
    and return to her husband. In the second, the people of Kanu'ga`lâ'yi trace a
    giant child-carrying insect to a cave nest and destroy it with smoke, explaining
    yellow-jackets and place names; a short appended note explains fish and frogs
    as arising from pieces of slain monster fish and frog thrown into water. In the
    third, a speaking dog warns a man of a coming flood and tells him to build a raft;
    the man and his family survive while others drown, and afterward he sees signs
    of the drowned people's ghosts dancing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first man and his mate live happily at first, then quarrel, and the woman
    leaves toward Nûñdâgûñ'yi, the Sun land in the east.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man follows alone and grieving; Une'`lanûñ'hi takes pity on him and asks
    whether he is still angry and whether he wants his wife back.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Une'`lanûñ'hi places several kinds of fruit along the woman's path, but she
    ignores huckleberries, blackberries, other fruits, and service berries before
    noticing strawberries.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: While gathering the first strawberries, the woman turns west, remembers her
    husband, becomes unable to continue east, gathers berries for him, returns, and
    goes home with him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people of Kanu'ga`lâ'yi are troubled by a house-sized insect called U'la`gû'
    that carries children away and is too swift to track by ordinary pursuit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people attach white string to animal baits; only the yearling deer is
    heavy enough to make the U'la`gû' fly low and slowly enough for the string to
    be seen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hunters follow the U'la`gû' to a cave nest with tiered cells; fires around
    the hole fill the cave with smoke, killing the great insect and many smaller ones,
    while others escape and multiply.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cave and the place from which the nest was first seen receive names connected
    with the yellow-jacket and the hunters' shout.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fish and frogs are said to come from a great monster fish and frog that were
    killed, cut into pieces, thrown into water, and later took the shapes of smaller
    fish and frogs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A dog repeatedly goes to the river and howls, then speaks to its owner and
    warns that a great freshet will drown everyone unless the man builds a raft and
    first throws the dog into the water.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The dog offers the worn skin and exposed bones on the back of its neck as
    a sign that it speaks truth.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The man believes the dog, builds a raft, takes his family and provisions onto
    it, and survives a long rain whose waters cover the mountains and drown all other
    people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the waters recede, the man hears dancing and shouting beyond a ridge,
    sees piles of bones in the valley, and concludes that the ghosts of the drowned
    were dancing.
  category: sequence
  evidence_refs:
  - ev:10
