canonical_text:
  quote: ''
  summary: The passage recounts a brief origin-style account of Dog and Wolf, then
    gives ethnographic information on Cherokee bird terminology, bird-related disease
    beliefs, and the sacred status and ritual killing of the eagle. It describes seasonal
    rules, the professional eagle killer’s mountain vigil, the use of a deer carcass
    to call eagles, prayers to avert eagle vengeance, and euphemistic speech on return
    to the settlement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dog is said to have been placed on the mountain and Wolf beside the fire at
    the beginning.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In winter Dog came down to the settlement and drove Wolf away from the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wolf prospered in the mountains, later killed animals in the settlements,
    was killed by the people, and was avenged by his brothers; afterward people feared
    hurting a wolf.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Winged creatures are grouped under a generic term, and the passage lists Cherokee
    bird names and some beliefs that diseases may be due to bird ghosts, feathers,
    or shadows.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The eagle is described as the great sacred bird of the Cherokee and as important
    in ceremonial ritual, especially matters relating to war.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The golden or war eagle is especially prized for tail feathers used for decorative
    and ceremonial purposes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: In former practice, killing an eagle concerned the whole settlement and was
    to be done only by a professional eagle killer who knew the prescribed forms and
    prayers for pardon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man who killed an eagle in defiance of the ordinances is said to have been
    haunted by dreams of fierce eagles until priestly treatment exorcised the nightmare.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The eagle must be killed only in winter or late fall after crops are gathered
    and snakes have retired to their dens.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If an eagle were killed in summer, frost would destroy the corn and Eagle
    dance songs would anger snakes, making them more dangerous.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: For an Eagle dance, the eagle killer is called to procure feathers and goes
    alone to the mountains with a gun or bow and arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The eagle killer performs a vigil of prayer and fasting, kills a deer, exposes
    the body on a high cliff, hides nearby, and sings songs to call down eagles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: When an eagle alights on the carcass, the eagle killer shoots it and prays
    that it not seek vengeance on the tribe, saying a Spaniard has done the deed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the prayer, the eagle killer leaves the dead eagle, returns to the settlement,
    and tells the first warriors that a snowbird has died to avoid eagle vengeance
    from overhearing.
  category: speech
  evidence_refs:
  - ev:8
