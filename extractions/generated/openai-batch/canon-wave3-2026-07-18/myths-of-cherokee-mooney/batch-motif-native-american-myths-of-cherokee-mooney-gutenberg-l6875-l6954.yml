canonical_text:
  quote: ''
  summary: 'The passage gives a historical account of William Holland Thomas and the
    Eastern Cherokee: remaining Cherokee refugees after the 1838 removal, Thomas''s
    efforts to secure permission for them to stay and to buy lands for them, the later
    legal complications over land title, Thomas''s importance to the East Cherokee,
    his early life and trading-store work, and his adoption by Yonaguska, after which
    he learned the Cherokee language and writing system.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the last emigrant Cherokee party left in December 1838, a reported 1,046
    refugees remained scattered in the mountains of North Carolina and Tennessee nine
    months later.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thomas obtained governmental permission for the remaining refugees to stay
    and had their funds placed at his disposal as agent and trustee for buying settlement
    lands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thomas bought contiguous tracts on Oconaluftee River and Soco Creek, as well
    as detached western tracts, and the main Oconaluftee body became known as the
    Qualla boundary or Qualla reservation.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because North Carolina did not recognize Indians as landowners until 1866,
    Thomas held the deeds in his own name, and the Indian title remained under litigation
    until later United States adjudications.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the East Cherokee of the writer's day owed their existence
    as a people to Colonel William Holland Thomas.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Thomas was born in 1805 near Waynesville, North Carolina, as an only and posthumous
    child after his father drowned before his birth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: At about twelve years old Thomas was hired to tend an Indian trading store
    on Soco Creek; after his employer's debts, he accepted second-hand law books as
    payment and later used them in public service.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Yonaguska, also called Drowning-bear, adopted Thomas as his son after learning
    that the boy had neither father nor brother; Thomas was then recognized in the
    tribe as Wil-Usdi, or Little Will.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Thomas learned the Cherokee language from Indian friends and later learned
    to read and write it after the invention of the Cherokee alphabet.
  category: action
  evidence_refs:
  - ev:7
