canonical_text:
  quote: ''
  summary: Tsuwe'nahi, ashamed after being driven out as a poor hunter, follows a
    stranger to a cave at Tsuwa`tel'da and finds a large settlement inside the mountain.
    He is hosted by the chief and later returns home, where he is disbelieved. He
    repeatedly visits the mountain people, brings another hunter who hears unseen
    girls and later sees their unusual feet, and enters the mountain town after the
    hunter is healed with old tobacco because he had not fasted. They attend a dance
    and report it at Kanuga. Other people then fast seven days, go with Tsuwe'nahi
    to Tsuwa`tel'da, and are never seen again. The final line appears to begin the
    next tale and is not treated as part of this extraction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsuwe'nahi says his friends in the settlement drove him out because he was
    not a good hunter, and a stranger invites him to come to the stranger's nearby
    town.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stranger takes Tsuwe'nahi to Tsuwa`tel'da, where a cave leads to the heart
    of the mountain and to an open country with a large settlement and many people.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The chief receives Tsuwe'nahi, gives him a seat near the fire that is revealed
    to be a turtle, provides food, and shows him through the settlement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Tsuwe'nahi wants to go home, the chief brings him to the cave mouth,
    shows him the trail, and says he will not be satisfied in the settlement anymore
    but will know how to return.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Tsuwe'nahi returns to Kanuga, the people laugh at his story, but he
    later goes away often and says he has been with the mountain people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: An unnamed man agrees to go with Tsuwe'nahi; while camping, he hears girls'
    voices although he cannot see anyone, and the voices request ribs from deer meat
    drying near the fire.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: When two girls later appear with Tsuwe'nahi, the hunter notices that their
    feet are short and round, almost like dogs' paws, and they sit so he cannot see
    their feet.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the cave, the hunter's legs become unable to support him; a medicine-man
    rubs old tobacco on his legs and makes him smell it until he sneezes, after which
    he can stand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the townhouse, a seat with honey locust thorns proves soft when the hunter
    sits; during the dance, a man follows the line crying Kû because, after being
    lost in the mountains, his voice had failed before the mountain people found him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After Tsuwe'nahi and the hunter report what they saw, others fast for seven
    days, go with Tsuwe'nahi to Tsuwa`tel'da, and are never seen again by their settlement
    friends.
  category: sequence
  evidence_refs:
  - ev:8
