canonical_text:
  quote: ''
  summary: 'The passage records Cherokee lore about insects and bullfrogs: seasonal
    signs from insect songs, ritual uses of crickets and mole crickets for singing
    and speech, spider and moth associations with fire and conjuring, explanations
    for the Bullfrog''s striped head, and two Bullfrog Lover stories involving imitation
    or transformation at a spring.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The jar-fly's midsummer song is treated as a signal that beans are ripe and
    green corn is near.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The katydid heard later is said to have brought roasting-ear bread.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cricket is called a barber because it gnaws hair from furs; some persons
    drink cricket tea to become good singers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mole cricket is described as tunneling in the earth, having hand-like
    digging claws, being difficult to catch, and being an excellent singer that never
    makes mistakes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Infants slow in learning to speak have their tongues scratched with the claw
    of a living mole cricket so they may speak distinctly and become eloquent, wise,
    shrewd, and quick to remember.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: For a grown person, the inside of the throat must be scratched for four successive
    mornings with the mole cricket, while tabus are observed; alternatively the insect
    is put in water overnight, the water is drunk if the insect survives, and the
    insect is released.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The spider is said to appear in one Cherokee myth as bringing back fire from
    across the water, and in formulas it may be invoked to entangle a victim's soul
    in threads.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A small yellowish moth called tûñ'tawû flies about the fire, is said to go
    to bed when it falls into the blaze, and is invoked by doctors in fire diseases.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: One account explains the Bullfrog's yellow head stripes as scratches made
    by Brass after Brass defeated Bullfrog in the wheel-and-stick game.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Another account says Bullfrog had a conjurer paint his head with yellow stripes
    to look more handsome to a woman he was courting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In one Bullfrog Lover story, a young man barred from visiting a girl hides
    by the spring at night and uses a gourd-handle trumpet to imitate a bullfrog-like
    voice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The imitated voice says the faultfinder will die; the mother believes it is
    a witch bullfrog, is frightened, and gives consent, so the young man wins his
    wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In another Bullfrog Lover story, a girl hears a voice saying a bullfrog will
    marry her, then sees a bullfrog on a stone by the spring take the form of a young
    man and ask her to marry him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The girl's family dislikes the bullfrog-like look of the husband's face and
    persuades her to send him away; afterward a voice predicts that the daughter will
    die, and she dies soon after.
  category: sequence
  evidence_refs:
  - ev:8
