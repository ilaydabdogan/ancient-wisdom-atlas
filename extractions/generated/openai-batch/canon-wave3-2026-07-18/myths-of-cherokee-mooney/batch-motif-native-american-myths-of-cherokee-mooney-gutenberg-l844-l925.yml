canonical_text:
  quote: ''
  summary: 'Historical passage recounting De Soto’s expedition after Cofitachiqui:
    reports of copper and possible gold, a planned route toward Coça rather than the
    mountain province of Chisca, the imprisonment of the queen of Cofitachiqui as
    guide and hostage, her misdirection and escape, and the expedition’s passage through
    Chalaque, Guaquili, and Xuala with observations about food, carriers, terrain,
    and possible mines.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Cofitachiqui, the Spaniards found copper objects, some thought to resemble
    metal mixed with gold, and were told the metal came from an interior mountain
    province called Chisca.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because men and animals were exhausted and provisions were insufficient, De
    Soto chose to go toward Coça to rest and seek more information about mines rather
    than immediately attempting the mountains.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Some officers considered De Soto’s change of plan a mistake, but the passage
    says none opposed him because of his stern manner.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies Coça as Creek territory, Chiaha with Chehaw, and says
    Cofitachiqui may have been the capital of the Uchee Indians.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the queen of Cofitachiqui refused to provide guides and carriers, De
    Soto made her a prisoner to force her to guide the expedition and serve as a hostage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The captive queen did not lead the Spaniards directly west; she led them out
    of their course and then escaped, leaving them to find their way out of the mountains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: As the expedition traveled north through towns subject to the queen, local
    Indians showed her respect and supplied assistance that the Spaniards compelled
    her to demand.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Chalaque, identified as Cherokee territory, the inhabitants are described
    as having little corn, subsisting on roots, herbs, and game, and giving wild turkeys
    freely; one chief gave De Soto two deerskins.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A later account says the Chalaques fled to the mountains as the Spaniards
    approached, while the passage suggests their apparent poverty may have reflected
    unwillingness to surrender stored provisions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Guaquili, the Spaniards were welcomed with a little corn, many wild turkeys,
    small non-barking dogs bred for food, and men to help carry baggage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Xuala, the principal town was by a small rapid stream close under a mountain;
    the chief received the Spaniards in friendly fashion and provided corn, dogs,
    baskets, and burden bearers, while the surrounding country showed signs of gold
    mines.
  category: setting
  evidence_refs:
  - ev:7
