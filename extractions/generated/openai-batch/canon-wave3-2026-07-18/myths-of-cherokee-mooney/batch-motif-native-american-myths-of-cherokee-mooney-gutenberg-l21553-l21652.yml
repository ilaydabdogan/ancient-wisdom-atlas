canonical_text:
  quote: ''
  summary: Mooney’s notes collect parallels and variants involving lightning protection,
    Cherokee stellar names, the Pleiades, the Milky Way, and the origin of strawberries.
    The passage reports Tuscarora, Cherokee, Iroquois, Eskimo, Shawano, Kiowa, Cheyenne,
    and other Plains materials, including several sky-ascent and celestial-origin
    episodes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a funeral for a person killed by lightning, a priest or conjurer speaks
    about lightning’s power over humans, animals, and plants, with mice and the black-gum
    tree named as exceptions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Tuscarora-related account, an Indian once possessed lightning in the
    likeness of a partridge; while he had it, other lightning could not harm him,
    but after it escaped he again became vulnerable to lightning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Cherokee constellation of seven stars is called “The Arm” because it resembles
    a bent human arm and is said to be the broken arm of a man who went up to the
    sky after being crippled.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A meteor, and probably also a comet, is called Atsil'-Tlûñtû'tsi, translated
    in the passage as “Fire-panther.”
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Cherokee myth of the origin of the Pleiades and the pine is described
    as well known in the tribe and told in nearly the same form by several named informants.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: A report cited in the passage says the Cherokee paid veneration to the morning
    star and the seven stars and attached various legends to them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Iroquois Pleiades story, seven boys dance around a mound after their
    parents refuse supplies for a feast; the boys rise into the air and become the
    Pleiades.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Iroquois account, the singer among the boys is dimmed because of his
    desire to return to earth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In an Eskimo tale summarized in the passage, a pursued hunter rises from the
    ground to the sky and is turned into a star.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a Cherokee Milky Way variant, a northern hunter seizes the wife of a southern
    hunter while she is grinding corn and carries her across the sky.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the same Cherokee Milky Way variant, the woman’s dog follows across the
    sky after eating leftover meal, and falling meal from the dog’s mouth makes the
    Milky Way.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among Kiowa, Cheyenne, and other Plains tribes, the Milky Way is described
    as the dusty track made when Buffalo and Horse raced across the sky.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The note on the origin of strawberries says that the fruits in that myth were
    created for the first time, and quotes the informant’s comment that some good
    came from the quarrel.
  category: speech
  evidence_refs:
  - ev:10
