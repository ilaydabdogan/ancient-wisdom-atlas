canonical_text:
  quote: ''
  summary: The passage contains the end of a Rabbit escape episode, the story of Rabbit
    deceiving Otter in order to steal and wear Otter's coat at an animal council,
    and the beginning of a story in which Rabbit, jealous of Possum's bushy tail,
    arranges for Cricket to dress the tail before a council dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children tell their father about Rabbit in a tree; the father cuts a hole
    while Rabbit encourages him to enlarge it, then Rabbit jumps out and escapes when
    the onlookers stand back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The animals have different sizes, coat colors, coat patterns, fur lengths,
    and tails; they dispute their appearance and agree to hold a council to decide
    who has the finest coat.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Otter lives far up the creek, seldom visits the other animals, and is reputed
    to have the finest coat; Rabbit recognizes him by a beautiful coat of soft dark-brown
    fur.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: Rabbit wants the council verdict for himself, learns the trail Otter will
    take, meets Otter after four days' travel, and falsely says the animals sent him
    to guide Otter to the council.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rabbit chooses the camp, gathers wood and bark, shaves a stick into a paddle,
    and clears a trail down to the river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rabbit tells Otter that the place is called the Place Where it Rains Fire,
    warns that it may rain fire that night, and tells Otter to hang his coat on a
    limb and jump into the river if Rabbit shouts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rabbit throws hot coals into the air with the paddle and shouts that it is
    raining fire; Otter wakes, runs, and jumps into the river.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narrative states that Otter has lived in the water ever since jumping
    into the river.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rabbit takes Otter's coat, puts it on, leaves his own coat behind, and goes
    to the animal council.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The animals initially take Rabbit for Otter, but Bear pulls Rabbit's paw from
    his face and exposes Rabbit's split nose; Rabbit runs, Bear pulls off Rabbit's
    tail, and Rabbit escapes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Possum formerly has a long bushy tail and is proud of it; Rabbit, who has
    no tail after Bear pulled it off, becomes jealous and plans a trick.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Rabbit invites Possum to a council dance, promises him a special seat and
    tail grooming, and instructs Cricket, described as an expert hair cutter, to dress
    Possum's tail.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
