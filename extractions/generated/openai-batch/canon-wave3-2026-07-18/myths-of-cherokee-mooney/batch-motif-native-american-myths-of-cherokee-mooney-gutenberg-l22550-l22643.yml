  summary: 'Mooney''s notes identify sources, customs, and parallels for several Cherokee
    animal stories: the huhu bird''s marriage and call; the bare-headed buzzard tale
    and an Omaha parallel; eagle ritual customs; ceremonial wife exchange; and multiple
    beliefs and accounts concerning rattlesnakes, snake councils, snake vengeance,
    serpent chieftains, and avoidance of killing snakes.'
