canonical_text:
  quote: ''
  summary: 'The passage first explains that plants, friendly to humans, provide medicines
    against diseases caused by animals. It then begins the story of the Daughter of
    the Sun: the Sun, jealous of the Moon’s favorable relation with people, sends
    deadly heat; the people seek help from the Little Men, who transform men into
    serpent beings to kill the Sun. The first attempt fails; the second results in
    the Rattlesnake killing the Sun’s daughter. The grieving Sun withdraws, darkening
    the world, and the Little Men instruct seven men to travel west to the Ghost country,
    capture the daughter during a dance with rods, place her in a box, and bring her
    back without opening it. The men reach the Darkening land and put her into the
    box.'
  language: English
  quote_policy: summarized
