canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which Brass is bound beneath deep water
    and guarded by crows, then gives two Tla''nuwa stories: one about an inaccessible
    cliff-cave nest of giant hawks destroyed through a medicine man''s intervention
    and an Uktena serpent, and another about a hunter carried to a Tla''nuwa cave
    to guard young birds before escaping by using one young bird as a means of descent.'
  language: English
  quote_policy: summarized
