- id: obs:2
  text: The witch's heart is said to be inside her doubled hand, the same awl hand
    with which she had stabbed people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: An arrow strikes where the awl joins the witch's wrist, and she falls dead.
  category: sequence
  evidence_refs:
