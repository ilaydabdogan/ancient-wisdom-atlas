- id: obs:4
  text: The tsi'kilili' is thereafter known as a truth teller and as an omen that
    an absent traveler will soon come home safely.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A hunter on a high ridge sees an old man on the opposite ridge with a bright
    shining rock cane.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man points and smells the cane, then heads toward the hunting camp
    after smelling in its direction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old man's cane becomes a shining rock bridge across the river and then
