  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The medicine-man identifies the old man as Nûñ'yunu'wi, Dressed in Stone,
    a cannibal monster who kills and eats hunters.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The medicine-man says Nûñ'yunu'wi's stick guides him like a dog and that his
    body is covered with a skin of solid rock.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The medicine-man says Nûñ'yunu'wi can be killed if seven menstrual women stand
    in his path, because he cannot bear to look at a menstrual woman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Seven menstrual women strip and stand along the path by order of the medicine-man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: As Nûñ'yunu'wi sees the women one after another, he cries out, vomits blood,
    grows weaker, and falls on the trail.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The medicine-man drives seven sourwood stakes through Nûñ'yunu'wi's body,
    pins him to the ground, and the people burn him under piled logs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: While the fire approaches and burns him, Nûñ'yunu'wi tells medicines for sickness
