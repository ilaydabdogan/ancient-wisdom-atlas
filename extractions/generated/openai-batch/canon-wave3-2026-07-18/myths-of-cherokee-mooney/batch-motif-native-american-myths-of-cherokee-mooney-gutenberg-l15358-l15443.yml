canonical_text:
  quote: ''
  summary: The passage closes a witch episode in which a chickadee reveals the vulnerable
    place in the witch's hand, after which the bird is remembered as a truth teller
    and homecoming omen. It then tells of Nûñ'yunu'wi, the Stone Man, a stone-covered
    cannibal monster with a magical stone cane. A hunter warns the camp, the medicine-man
    arranges seven menstrual women in the monster's path, and the sight of them weakens
    him until he falls. The medicine-man pins and burns him; as he burns he reveals
    medicines and hunting songs. In the ashes remain red wâ'di paint and a magic u'lûñsû'ti
    stone, and the paint grants the people's prayers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chickadee lands on the witch's right hand, and the warriors understand this
    as a sign to aim at that hand.
  category: action
  evidence_refs:
