canonical_text:
  quote: ''
  summary: 'The passage recounts several Cherokee serpent narratives: a hunter near
    Cohutta defeats the Ustû''tli by using the side of a ridge and setting a mountain
    fire; a notice describes the immense cliff-dwelling Uw''tsûñ''ta at Nantahala,
    whose presence makes people abandon the valley; and a tale tells of a bird-hunting
    boy who becomes a horned uktena, enters a river, and is followed into the water
    by his grieving grandmother.'
  language: English
  quote_policy: summarized
