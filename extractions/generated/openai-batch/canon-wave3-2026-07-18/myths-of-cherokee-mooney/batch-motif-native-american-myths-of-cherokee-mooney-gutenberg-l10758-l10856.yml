canonical_text:
  quote: ''
  summary: The passage gives historical notes on resolutions to return John Ross's
    body for burial among the Cherokee; explains the name, origins, political purpose,
    and signs of the Ketoowah Society or Pins; and introduces Lloyd Welch's farewell
    address, including his statement about approaching death, burial, and the spirit
    going to God in a happy beyond.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Resolutions provided for bringing John Ross's body from Washington at Cherokee
    Nation expense and for suitable obsequies so that his remains would rest among
    those he served.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ketoowah Society's name is said to derive from Kitu'hwa, an ancient town
    in the old Nation associated with a conservative tribal element and sometimes
    with the Nation's name itself.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kituhwa name is described as still used in councils to indicate genuine
    Cherokee feeling, and a western delegate used the phrase 'We are all Kituhwa people'
    to address separated kinsmen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The western Ketoowah Society was organized shortly before the Civil War by
    John B. Jones as a secret society to cultivate national feeling among full-bloods
    and to counter secessionist secret organizations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Members were frequently called Pins because of a distinctive way of wearing
    a pin; the name was first applied by enemies in derision and then accepted by
    the group.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The account describes the Pins as a loyal, anti-slavery organization that
    rendered service to the Union cause and originated among members of a Baptist
    congregation at Peavine.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Secret signs included a way of touching the hat, a gesture with the coat lapel
    near the heart, wearing split corn-husk strips in the hair at Bird Creek, and
    a night passphrase involving Tahlequah and being Ketoowha's son.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lloyd Welch's farewell states that declining health requires him to resign
    the office of principal chief and that he expects his body to be consigned to
    the tomb and his spirit to God in a happy home beyond.
  category: speech
  evidence_refs:
  - ev:6
