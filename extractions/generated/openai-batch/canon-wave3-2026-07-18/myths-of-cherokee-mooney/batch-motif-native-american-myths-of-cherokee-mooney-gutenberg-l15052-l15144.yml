canonical_text:
  quote: ''
  summary: Thunder, described as the boy's father, dresses the cleaned boy, has him
    select living snakes as ornaments, gives him a war club, and tests him against
    two elder brothers who are young Thunders while the boy is Lightning. Thunder
    then equips the boy with a gourd containing an inexhaustible bead string and instructs
    him how to defeat the gambler Ûñtsaiyi'. The boy wins repeated wheel-and-stick
    games, produces water from a rock when the gambler asks to stop for a drink, and
    wins the gambler's goods, wife, and life. Ûñtsaiyi' escapes through a second door
    and shapeshifts during flight, but the Horned Green Beetle recognizes him under
    disguises, and the brothers finally catch him at the great water where the sun
    goes down.
  language: English
  quote_policy: summarized
