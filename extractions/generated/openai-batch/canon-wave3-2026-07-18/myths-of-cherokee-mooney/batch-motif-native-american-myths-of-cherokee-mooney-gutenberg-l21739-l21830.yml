literal_observations:
- id: obs:1
  text: The Cherokee deluge story is reported as given by Schoolcraft from Stand Watie
    in 1846 and obtained by the author in nearly the same form from James Wafford
    in 1890, who had heard it from his grandmother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The incident of dancing skeletons is said to be absent from Schoolcraft's
    version and may indicate a lost sequel to the story.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Haywood is reported to mention the Cherokee deluge myth and to conjecture
    that Track Rock gap petroglyphs in Georgia may refer to it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Missionary versions by Buttrick and Washburn are described as the Bible narrative
    as told by Indians, while Washburn's informant explained the flood by an upheaval
    and tilting of the earth so that waters temporarily overflowed inhabited areas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a Hagar variant, a star with a fiery tail falls from heaven, becomes a
    long-haired man, and warns the people of the coming deluge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that deluge myths appear to have existed among every people
    and age and lists numerous American tribal traditions in which such myths were
    found.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Creek variants, the warning is given by wolves in one version and by cranes
    in another.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A cited ethnological passage describes an Indian view in which humans are
    superior to animals but remain connected with them as part of a larger animate
    society.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The cited passage says animals, birds, fishes, trees, and plants may be included
    within animate nature and that animals are not excluded from the spirit world
    after death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: According to the Ojibwa note, animals formerly had speech until Nanibojou
    took it from them as punishment for conspiring against the human race.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Pawnee belief, the Nahurac animals possess miraculous attributes given
    by Tirawa and meet in five council lodges, including a hill with a deep well or
    water hole and a rock hill with a great hole where councils are held.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Angola comparison says the animal world and spirit world are organized
    and governed like the human world, with ranked animal chiefs and kings.
  category: relationship
  evidence_refs:
  - ev:8
