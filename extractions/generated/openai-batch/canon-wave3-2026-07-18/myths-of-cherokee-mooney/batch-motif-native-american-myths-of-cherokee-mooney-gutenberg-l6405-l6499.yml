literal_observations:
- id: obs:1
  text: Samuel Worcester died at Park Hill mission in 1859 after thirty-five years
    of service to the Cherokee, during which he had suffered chains, imprisonment,
    and exile for their sake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'At the outbreak of the Civil War, the Cherokee were divided: the Ridge party
    under Stand Watie favored the Confederacy, while the National party under John
    Ross, supported by the Kitoowah society, declared for neutrality.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On October 7, 1861, a treaty at Tahlequah with Confederate commissioner General
    Albert Pike aligned the Cherokee Nation with the Confederacy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two Cherokee regiments were raised for Confederate service under Stand Watie
    and Colonel Drew, and they participated in engagements including the battle of
    Pea Ridge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Union forces entered the Cherokee country, Drew's regiment went over
    almost as a body to the Union side, and Ross then made an arrangement with Union
    commander Colonel Weir before retiring to Philadelphia.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Indian Territory was ravaged by contending factions and armed bodies, and
    loyal fugitives, including Cherokee, took refuge in Kansas and later at Fort Gibson.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A spring return of loyal Cherokee to plant crops was interrupted by the approach
    of Stand Watie and his Confederate Cherokee regiment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Stand Watie's men and Confederate allies destroyed or carried off property
    belonging to loyal Cherokee; the passage estimates stock losses at more than 300,000
    head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage describes the Cherokee country as raided, sacked, burned, and
    left marked by scorched chimneys and neglected fields.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: After five years of war, Cherokee numbers are stated as reduced from 21,000
    to 14,000, with the country in ashes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The July 19, 1866 treaty restored the Nation to United States protection,
    proclaimed general amnesty, prohibited war-related confiscations, abolished slavery
    without compensation, and admitted Black residents within the Nation to full Cherokee
    citizenship.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Additional treaty provisions permitted settlement of friendly Indians by consent
    and purchase, sold specified Kansas lands, promised payment for spoliations by
    United States troops, awarded funds to Evan Jones, and guaranteed Cherokee possession
    and protection.
  category: action
  evidence_refs:
  - ev:7
