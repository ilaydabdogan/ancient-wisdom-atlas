  summary: Historical prose passage recounting Samuel Worcester's death; Cherokee
    factional divisions during the Civil War; Cherokee alignment with the Confederacy;
    military conflict, refugee displacement, and destruction in Indian Territory;
    and the 1866 treaty restoring United States protection, abolishing slavery in
    the Nation, admitting Black residents to Cherokee citizenship, arranging land
