canonical_text:
  quote: ''
  summary: Historical account of violence during campaigns against Cherokee towns,
    including shootings, capture and sale of prisoners, scalping and scalp display,
    widespread destruction of Cherokee settlements, forced treaties and territorial
    cessions in 1777, the rise and relocation of the Chickamauga resistance faction
    under Dragging-canoe, and western relocation of Lower Cherokee refugees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rutherford's men crossed the mountains and approached a trader's house; an
    enslaved man ran out and was shot by Reverend James Hall, who mistook him for
    an Indian.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two women and a boy were captured, threatened with killing and scalping if
    not immediately sold, and then sold for about twelve hundred dollars.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Wolf Hills, a party returned with eleven warriors' scalps, held a prayer
    service for success, and hung the fresh scalps on a pole above the fort gate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that border men practiced scalping when opportunity presented,
    that South Carolina offered a bounty for warrior scalps and a higher reward for
    prisoners, and that there was no record of Americans scalping Tories or other
    whites.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: More than six thousand armed enemies entered Cherokee territory; more than
    fifty towns were burned, orchards and fields destroyed, livestock killed or driven
    off, property plundered, people killed, starved, exposed, captured, enslaved,
    or forced into flight.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The destruction left further Cherokee resistance hopeless for the moment and
    compelled them to seek peace.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In 1777 the Lower Cherokee ceded nearly all remaining South Carolina territory
    at DeWitts Corners, and the Middle and Upper Cherokee ceded lands east of the
    Blue Ridge and disputed river territories at Long Island.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Captain James Robertson was appointed agent for the Cherokee at Echota to
    watch their movements, recover captured property, and prevent correspondence with
    persons unfriendly to the American cause.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A considerable portion of the Cherokee refused the cessions; Ata-kullakulla
    offered warriors to the Americans, while Dragging-canoe declared he would continue
    war against those who had taken his hunting grounds.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Under Dragging-canoe, several hundred warriors and families left Upper and
    Middle towns, settled on Chickamauga Creek, later moved farther down the Tennessee
    River, and built the five lower towns.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Chickamauga population was recruited from Creeks, Shawano, and white Tories
    and remained hostile to Tennessee until their towns were destroyed in 1794.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Expatriated Lower Cherokee moved to the far western border of their tribal
    territory and built new towns on the upper Coosa; later Willstown children were
    described as fearing white men because of stories of Williamson's invasion.
  category: sequence
  evidence_refs:
  - ev:10
