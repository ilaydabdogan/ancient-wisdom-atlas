literal_observations:
- id: obs:1
  text: The scalp dance is described as common to every tribe east of the Rocky Mountains
    and as a celebration of taking fresh enemy scalps.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The scalps are described as painted red on the fleshy side, decorated, stretched
    in small hoops, and attached to pole ends.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wives and sweethearts of the warriors carry the prepared scalps in the dance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: During pauses in the song, each warrior recites his exploits; among the Cherokee,
    a warrior entering the circle suggests an improvised song to the drummer.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: A new war name is frequently assumed after the dance, and dances may be repeated
    over the same scalps on consecutive nights or over weeks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Getting water from a neighboring stream or spring is described as a daily
    duty of women.
  category: action
  evidence_refs:
