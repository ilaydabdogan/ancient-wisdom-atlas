canonical_text:
  quote: ''
  summary: The passage describes Cherokee practices and beliefs concerning eagle feathers
    and the Eagle dance, followed by notes on ravens, crows, owls, buzzards, hawks,
    the mythic Tla'nuwa', the swamp gallinule or mudhen, the white-fronted goose,
    and the great white heron or egret. It records ritual handling of eagle feathers,
    sacrifice to eagle spirits, omen and healing uses of bird feathers, bird-associated
    dances, and brief cross-references to other Cherokee myths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunters wait four days before going to collect the eagle's large tail and
    wing feathers, a delay explained as allowing insect parasites to leave the body.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: The hunters wrap the eagle feathers in a fresh deerskin and leave the dead
    eagle and a slain deer on the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The slain deer is identified as a sacrifice intended for the eagle spirits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The wrapped feathers are hung in a small round feather house near the edge
    of the dance ground.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the night the feathers are brought in, an Eagle dance is held, and venison
    and corn are set below the feathers because the feathers are supposed to be hungry
    after their journey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A flaxbird or scarlet tanager body is hung with the eagle feathers for the
    same feeding purpose.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The eagle is regarded as a great ada'wehi, and only the greatest warriors
    and people versed in sacred ordinances dare wear the feathers or carry them in
    the dance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person who dreams of eagles or eagle feathers must arrange an Eagle dance
    with vigil and fasting, or someone in that person's family will die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Owls and other night-crying birds are believed to be embodied ghosts or disguised
    witches, and their cry is feared as an evil omen.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bathing a child's eyes with water in which a chance-found owl feather has
    soaked is said to let the child stay awake all night; water from a similarly found
    blue jay feather is said to make the child an early riser.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The buzzard is said to have had a role in shaping the earth and is described
    as a doctor among birds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Buzzard flesh or soup is said to prevent smallpox, a buzzard feather over
    a cabin door is said to keep out witches, and buzzard quill and down are used
    in treating gunshot wounds.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The little Tla'nuwa' is described as a grayish-blue bird about turkey-sized
    that follows wild pigeons, kills prey with its sharp breast, and eats while flying.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Diga'gwani' dance, performers sing the swamp gallinule's name and imitate
    its halting movements.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The white-fronted goose is connected with the myth of the origin of tobacco.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: Great white heron or egret feathers are worn by ball players, and a white
    wing is identified as a likely ancient peace emblem.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: The raven is connected with Raven Mocker tales and was formerly used as a
    war title, while the crow is said not to appear in Cherokee mythology.
  category: relationship
  evidence_refs:
  - ev:4
