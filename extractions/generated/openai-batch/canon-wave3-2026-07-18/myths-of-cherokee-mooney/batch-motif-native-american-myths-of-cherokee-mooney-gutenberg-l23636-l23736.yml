canonical_text:
  quote: ''
  summary: The passage is a notes-and-parallels section. It records rumbling, smoking,
    and earthquake-split mountains in the Carolina region; explains a Selu story through
    a corn-from-blood myth and compares plant-spirit lore from Iroquois tradition;
    notes a supernatural time-lapse motif in an Underground Panthers story; gives
    parallels for the Tsundige'wi involving dwarf or little peoples, tailed small
    people reported in early Spanish sources, and a Nisqualli story of captured brothers,
    a dwarf village, quill-throwing birds, and revival; and briefly notes the Origin
    of the Bear story and the Ani'-Tsâ'gûhi clan.
