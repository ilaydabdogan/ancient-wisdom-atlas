  quote: ''
  summary: Historical account of 1797-1798 negotiations and the first Treaty of Tellico;
    Cherokee land cessions, road permission, compensation, and guarantees; regional
    geopolitical changes after treaties with northern tribes, Spain, and the Creeks;
    and the Cherokee situation at the close of the eighteenth century, including population,
    territory, town distribution, and relocation of the national capital and council
    fire from Echota to Ustanali.
