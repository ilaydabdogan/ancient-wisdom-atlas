  quote: ''
  summary: Historical account of Christianity among the Kituhwa Cherokee, East Cherokee
    removal questions and treaty claims, Catawba residence among the Cherokee, Lanman's
    1848 description of the Qualla community, and a brief mention of Salâ'li as a
    mechanic.
