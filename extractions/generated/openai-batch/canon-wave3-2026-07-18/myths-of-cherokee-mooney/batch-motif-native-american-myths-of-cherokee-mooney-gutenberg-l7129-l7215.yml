literal_observations:
- id: obs:1
  text: Christianity is said to have been introduced among the Kituhwa Cherokee before
    the Removal through Worcester and Boudinot's translated Gospel of Matthew, published
    at New Echota in 1829.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the absence of missionaries, the translated book was read by Indians from
    house to house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the Removal, Reverend Ulrich Keener made irregular Methodist preaching
    visits and was later followed by Baptist workers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In 1839 the Commissioner of Indian Affairs reported that the East Cherokee
    wished to join their western brethren but were deterred by unsettled conditions
    in the Territory.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: About one hundred Catawba moved to live with the Cherokee in 1840, but later
    many returned home after tensions and unsuccessful removal negotiations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Catawba women living among the Cherokee are described as expert potters using
    a Catawba method distinct from the Cherokee method.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: While among the Cherokee, the Catawba gained a reputation as doctors and leaders
    of the dance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: An 1846 treaty at Washington recognized the East Cherokee right to participate
    in New Echota treaty benefits and provided for adjustment of unpaid claims.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lanman visited the East Cherokee in 1848 as Colonel Thomas's guest and described
    their ballplays, dances, and customs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Colonel Thomas is described as guide, counselor, friend, business agent, and
    chief of the Indians, with a relationship likened to that of father and children.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lanman estimated about 800 Cherokee and 100 Catawba on the Qualla town reservation,
    with 200 more Indians farther west in the state.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Lanman describes most of the community as literate in their own language,
    agriculturally active, and able to manufacture clothing, tools, axes, and guns.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Lanman reports that women were treated as equals, with men laboring in fields
    and wives devoted to household employments.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Lanman describes the community as chiefly Methodist and Baptist, with ministers,
