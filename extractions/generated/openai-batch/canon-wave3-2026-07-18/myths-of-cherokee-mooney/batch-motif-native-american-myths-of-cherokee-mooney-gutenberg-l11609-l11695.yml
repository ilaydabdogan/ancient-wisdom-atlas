canonical_text:
  quote: ''
  summary: Kana'ti's sons secretly follow him and discover that he keeps game animals
    behind a rock in the mountain. The Wild Boy first transforms into bird's down
    to spy on Kana'ti making arrows. Later the boys make arrows, open the rock, fail
    to control the animals, alter deer tails by striking them, and release deer, other
    animals, and birds into the forest. Kana'ti punishes them by releasing vermin
    from jars in a cave and tells them that they will now have to hunt for food. The
    boys then spy on Selu in her elevated storehouse and see her produce corn and
    beans from her body; they decide she is a witch and say they must kill her.
  language: English
  quote_policy: summarized
