canonical_text:
  quote: ''
  summary: Notes to Cherokee myths identify Pilot Knob as a shining mountain setting,
    explain ritual fasting for contact with spirit people, cross-reference Thunder
    beings, Tsuwe'nahi, turtle-seat and thorn incidents, sacred old tobacco, and describe
    Thunder spirits as associated with cataracts, snakes, water animals, lightning,
    water, rain, dance, and marriage custom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsuwa`tel'da, also called Pilot Knob, is described as a high mountain whose
    cliff faces can appear in sunlight like shining walls with doors, windows, and
    shingled roofs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says that a seven-day fast is required in several Cherokee myths
    for those who would join the spirit people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cherokee priests are reported as explaining the fast as a way to spiritualize
    human nature and quicken spiritual vision through abstinence from earthly food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ordinary Cherokee ceremonial fasting is described as one day, while occasions
    of supreme importance may require four or seven days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that Plains Sun Dance participants abstain entirely from
    food and drink during the four days and nights of the ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Tsuwe'nahi legend, a hunter met people inside an enchanted mountain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Parched corn is described as a standard traveling provision for warriors,
    carried as meal and mixed with water.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A turtle-seat incident is said to occur also in the story of The Man who Married
    the Thunder's Sister, and the turtle is identified as the common water turtle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A dog-paw peculiarity of mountain spirits is mentioned as unexplained and
    not elsewhere recorded as their characteristic.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ancient tobacco, Nicotiana rustica, is described as sacred among all eastern
    tribes.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Thunder spirits are said to have a favored residence under cataracts and to
    be connected with snakes and water animals.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:12
  text: One Cherokee informant is reported as saying that Thunder is a horned snake,
    lightning is its tongue, and it lives with water and rains.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Dance is described as both frequent social amusement and an important part
    of major religious or ceremonial functions.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The marriage note describes a lover giving presents to the intended bride's
