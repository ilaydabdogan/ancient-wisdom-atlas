literal_observations:
- id: obs:1
  text: A small number of Cherokees met at New Echota with Mr. Schermerhorn, and articles
    of a general treaty were entered into for the whole Cherokee nation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person statement says the paper called a treaty was not sanctioned
    by the main body of the Cherokee and lacked their participation or assent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The statement says fewer than one hundred Cherokee voters and fewer than three
    hundred people total, including women and children, were present at the conclusion
    of the treaty.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Blankets were promised to those who would come and vote for the treaty, and
    the statement says methods were used to conceal the small number present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The treaty business was transacted through a committee appointed by those
    present, and the power of attorney was signed only by the meeting president and
    secretary.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The writer warns that Senate ratification would bring trouble on the government,
    eventually destroy the Cherokee Nation, and require force to carry the treaty
    into effect.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: General Wool commanded troops concentrated in Cherokee country to prevent
    opposition to enforcement of the treaty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: General Wool reported that the Cherokee were almost universally opposed to
    the treaty and maintained that they had not made it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wool reported that those present at a recent council would not receive United
    States rations or clothing lest they compromise themselves concerning the treaty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Wool reported that people in the mountains of North Carolina had preferred
    living on roots and sap of trees rather than receive United States provisions,
    and that many said they would die before leaving the country.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Later letters from Wool describe the work of disarming and overawing the Cherokee
