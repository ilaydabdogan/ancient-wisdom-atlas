  summary: 'The passage presents statements and letters concerning the New Echota
    treaty: an unnamed writer rejects the treaty as lacking Cherokee consent, General
    Wool reports near-universal Cherokee opposition and refusal of United States provisions,
    and Major Ridge complains that white people and Georgians have taken Cherokee
    land and are preparing to take treaty funds before removal.'
  language: English
