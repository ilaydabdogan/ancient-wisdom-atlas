canonical_text:
  quote: ''
  summary: The passage recounts instructions for Shaw's mission among southern tribes,
    his route and residence at Ustanali, rising Creek and Chickamauga hostility, failed
    U.S. efforts to recruit southern warriors against northern tribes, violent incidents
    in Georgia and Cherokee territory, and reports of broader intertribal alliance
    efforts against American expansion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructions direct the agent to learn southern tribal languages, collect
    historical materials, ascertain tribal limits, make vocabularies, and teach agriculture
    and useful arts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instructions direct correspondence with Governor Blount and Brigadier-General
    McGillivray, keeping a journal for the War Office, and exhibiting a Cherokee book,
    writings, messages, and instructions to Blount.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A route is prescribed from the eastern United States toward Holston, with
    an expectation of more than twenty miles per day and arrival in about thirty days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The journey is described as proceeding by wagons to the head of navigation
    on the Holston River and then by boats to the Cherokee towns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shaw appears to have resided at Ustanali, described as having superseded Echota
    as the Cherokee capital, and was present at a council there without evidence of
    unfriendliness.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Later, Shaw reported danger from Creek hostility, and after the Chickamauga
    towns again declared war he left Ustanali under escort from friendly Cherokee.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The United States government attempted to prevent an alliance between southern
    Indians and hostile northern tribes by encouraging southern warriors to serve
    with the army, but the attempt failed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The governor of Georgia reported that lawless Georgians burned a Cherokee
    town and killed three Indians, and that two other Cherokee had been killed within
    the settlements.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the Georgia incidents, an entire family was found murdered, scalped,
    mangled, pierced with arrows, and accompanied by two war clubs left on the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A messenger from the Chickamauga towns reported prisoners, fresh scalps, and
    chiefs and warriors of two towns dancing over the scalps.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The messenger reported Shawano urging Cherokee to join against the Americans
    and McGillivray trying to form a general confederacy of Indian tribes against
    whites.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage describes tribes northwest of the Ohio and toward the Mississippi
    as allied under Shawano leadership to hold the Ohio River as an Indian boundary
    against white settlement.
  category: relationship
  evidence_refs:
  - ev:9
