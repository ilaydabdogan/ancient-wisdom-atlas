  summary: The passage describes late nineteenth-century legal settlement of East
    Cherokee land claims, population counts and epidemic mortality, domestic and agricultural
    conditions, land ownership and self-support in 1900, and the government-supported
    industrial training school at Cherokee under H. W. Spray with James Blythe as
    chief clerk.
