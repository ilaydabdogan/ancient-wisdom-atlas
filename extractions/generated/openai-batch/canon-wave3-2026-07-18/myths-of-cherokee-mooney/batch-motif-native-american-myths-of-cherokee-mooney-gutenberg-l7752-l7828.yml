literal_observations:
- id: obs:1
  text: In 1894 litigation involving the East Cherokee, creditors, and land claimants
    within and adjoining the Qualla boundary was settled by compromise and government-backed
    payment arrangements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The settlement completed title to nearly all lands claimed by the Indians,
    except a few outlying tracts described as comparatively unimportant.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Cherokee on the North Carolina reservation and outlying settlements were
    officially reported as 1,479 in 1895, 1,312 in 1897 after an epidemic, and 1,351
    the next year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Big-witch, described as the oldest man of the band, and Wadiyahi, described
    as the last old woman preserving the art of making double-walled baskets, died
    during the epidemic period.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The quoted official description says the people were industrious but not progressive
    farmers and commonly exhausted soil before clearing or breaking new ground.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The typical house is described as a small one-room log house with split-shingle
    or shake roof, no window, an open door for light, and a fireplace at one end with
    an outside chimney.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Common household possessions are listed as simple cooking vessels, a coffee
    mill, tableware, homemade bedsteads, bedding, and basic outdoor tools.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Usual foods are described as bean bread and coffee, with chestnut bread in
    the fall; pork is esteemed and hogs are kept running wild in summer.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In 1900, 1,376 East Cherokee were counted in North Carolina under direct charge
    of the agent, with about 1,100 on the reservation and others on Nantahala, Cheowa,
    and Hiwassee rivers.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The enumerated East Cherokee are described as owning about 100,000 acres,
    receiving no rations or annuities, and being entirely self-supporting.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A government-supported industrial training school at Cherokee boards, clothes,
    and educates 170 pupils in practical duties of life.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Prof. H. W. Spray is described as superintendent and agent for the band, and
    James Blythe as chief clerk and a Cherokee by blood who had earlier served as
    agent.
  category: relationship
  evidence_refs:
  - ev:10
