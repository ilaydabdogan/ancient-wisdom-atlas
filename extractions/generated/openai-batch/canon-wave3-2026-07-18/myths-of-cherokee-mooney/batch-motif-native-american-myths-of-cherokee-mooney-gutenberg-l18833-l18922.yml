  summary: The passage concludes a westward migration account in which a Cherokee
    band crosses the Mississippi, loses contact with the main tribe, and is later
    remembered as lost; later hunters find a Cherokee-speaking people near the Rockies.
    It then summarizes traditions about the Ani'-Kuta'ni or Nicotani, a hereditary
    priestly group said to have abused sacred privileges and to have been exterminated
    by the people after spouse-taking or abduction provoked a conspiracy.
