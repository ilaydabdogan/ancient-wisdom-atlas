canonical_text:
  quote: ''
  summary: A fire-origin episode recounts failed attempts by birds and snakes to bring
    fire from a burning sycamore across the water, followed by the Water Spider successfully
    carrying back a coal in a woven bowl. The next episode begins the story of Kana'ti
    and Selu, where a hunter, his wife, and their son encounter a second boy who comes
    from the river and is understood to have sprung from game blood washed there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Animals able to fly or swim want to go after the fire, and the Raven is sent
    first because he is large and strong.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Raven reaches the sycamore tree across the water, but the heat scorches
    his feathers black and he returns without fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Screech-owl, Hooting Owl, and Horned Owl each approach the fire; heat,
    smoke, and ashes injure or mark their eyes, and they return without fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Uksu'hi black racer swims to the island and enters the tree by a small
    hole, but heat and smoke scorch him black and he returns without fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The great blacksnake Gûle'gi swims to the island and climbs the tree, but
    smoke chokes him, he falls into the burning stump, and he becomes black.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A council is held because there is still no fire and the world is cold; other
    birds, snakes, and four-footed animals are afraid to approach the burning sycamore.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Water Spider volunteers and is described as having black downy hair and
    red stripes, able to run on top of the water or dive to the bottom.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Water Spider spins thread from her body, weaves it into a tusti bowl fastened
    to her back, carries a little coal of fire in it, and returns with the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Kana'ti and Selu live at Pilot knob with their only child; Kana'ti always
    brings back game, and Selu prepares it and washes the blood from the meat in the
    river.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The son plays by the river, and his parents hear signs of two children; he
    says the other boy comes out of the water, calls himself his elder brother, and
    says his mother threw him into the river.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The parents understand that the strange boy has sprung from the blood of the
    game that Selu washed off at the river's edge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kana'ti tells his son to wrestle the other boy and hold him; when the son
    does so, the parents come and seize the Wild Boy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Wild Boy cries that they threw him away, is taken home and tamed, remains
    wild and artful, leads his brother in mischief, and is found to have magic powers.
  category: attribute
  evidence_refs:
  - ev:6
