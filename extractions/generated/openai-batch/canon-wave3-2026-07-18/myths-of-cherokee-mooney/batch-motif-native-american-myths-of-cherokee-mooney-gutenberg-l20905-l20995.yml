canonical_text:
  quote: ''
  summary: 'Mooney''s notes identify and compare several Cherokee myth elements: a
    child born from blood drops; game animals enclosed in a cave or underground prison
    and later released; a Cherokee storehouse for food; miraculous production of provisions
    by rubbing the body; mind reading; the ritual importance of seven; wind-borne
    transformation into down, feather, leaf, or other light object; ball play as a
    metaphor for contest or battle; a protective invisible serpent around a sick person''s
    house; wolves as Kana''ti''s servants; and animal tribes descending from a single
    survivor after slaughter by a hero or trickster.'
  language: English
  quote_policy: summarized
