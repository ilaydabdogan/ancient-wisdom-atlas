canonical_text:
  quote: ''
  summary: 'The passage recounts Civil War-era events among the East Cherokee: a Confederate-authorized
    interest payment, Thomas''s statement on Cherokee alignment with the Confederacy,
    a small group of Cherokee captured and persuaded to join Union forces, hostility
    toward them after the war, a smallpox outbreak brought back by one Union Cherokee,
    high mortality worsened by ineffective treatments, Thomas''s later retirement,
    and subsequent federal census and administrative measures concerning the East
    Cherokee.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Confederate congress enacted payment of $19,352.36 to the East Cherokee
    for four years of interest from May 23, 1860, to May 23, 1864.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Confederate commissioner suggested payment in provisions because the Indians
    needed provisions and cash would not allow them to purchase supplies amid scarcity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that almost every Cherokee capable of bearing arms was
    reported to be in Confederate service.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Colonel Thomas stated that the North Carolina Cherokees had taken up arms
    against the Lincoln government, like their western brethren.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A small party of Cherokee, perhaps about a dozen, was captured near Bryson
    City by Union troops and taken to Knoxville.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some captured Cherokee became dissatisfied with Confederate service and were
    persuaded to go over to the Union side.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Through Digane'ski's influence, several others deserted to the Union army,
    making about thirty Union Cherokee in all.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the war, the Union Cherokee returned home and found their tribesmen
    bitterly incensed against them, with their lives in danger for a time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: One Union Cherokee brought smallpox back from an infected camp near Knoxville
    and died shortly after returning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Because characteristic pustules had not appeared and smallpox had been unknown
    among the Cherokee for nearly a century, the illness was not initially suspected;
    his funeral was largely attended.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A week after the funeral, several attendees became sick, and Colonel Thomas
    recognized the disease as virulent smallpox.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The smallpox spread through the tribe in early spring 1866 and more than one
    hundred people in the small community died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage attributes many deaths partly to the use of plunge baths in the
    river and cold-water douches after Cherokee remedies failed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: After more than half a century of involvement with the East Cherokee, Colonel
    Thomas retired from active participation because of physical and mental infirmity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: After Thomas's retirement, East Cherokee affairs became marked by confusion
    and factional strife until the United States intervened as arbiter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: In 1868 Congress ordered another census of the East Cherokee to guide future
    payments, limited to persons on the 1848 Mullay roll and their legal heirs and
    representatives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Congress directed that the Commissioner of Indian Affairs assume charge over
    the East Cherokee as over other tribes, in response to their expressed desire
    to be under immediate government charge as wards.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: An unratified treaty provision stated that Cherokee east of the Mississippi
    who removed west within three years would receive full citizenship and privileges
    there; later admission would require act of the Cherokee national council.
  category: speech
  evidence_refs:
  - ev:7
