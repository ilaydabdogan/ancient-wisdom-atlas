canonical_text:
  quote: ''
  summary: Kana'ti's two sons use a gaming wheel to find him, survive encounters with
    a panther and cannibals, pass through the sky at the place where the sun comes
    out, and go west as the Little Men or Thunder Boys. Later, when people lack game,
    the Thunder Boys return, call deer with seven songs, and teach the people those
    songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Kana'ti does not return, the two boys decide to go and find him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wild Boy rolls a gaming wheel toward several directions; it returns from
    the Darkening land, south, and north, but does not return from the Sunland.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boys travel east and find Kana'ti walking with a little dog; the boys
    know the dog is the wheel they had sent after him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kana'ti warns the boys to keep away from something dangerous in a swamp, but
    they enter it and find a large sleeping panther.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys shoot the panther with arrows, but the arrows do not hurt it and
    it pays no further attention to them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kana'ti warns the boys about the Anada'dûñtaski, described as Roasters or
    cannibals, who would put them in a pot and feast on them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boys come to a lightning-struck tree, and the Wild Boy directs his brother
    to gather splinters from it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The cannibals seize the boys, prepare a fire and boiling pot, and put the
    Wild Boy into the pot while his brother places the splinters into the fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A blinding light and lightning fill the townhouse, kill the cannibals, and
    the two boys stand outside unharmed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The boys reach the end of the world where the sun comes out, wait for the
    sky to go up, pass through, and climb up on the other side.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The boys find Kana'ti and Selu sitting together beyond the sky boundary; the
    old folk receive them kindly and tell them they must later live where the sun
    goes down.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The boys stay with their parents seven days, go to the Darkening land, are
    called Anisga'ya Tsunsdi' or The Little Men, and their speech is heard as low
    rolling thunder in the west.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: After the boys had let the deer out from the cave where Kana'ti kept them,
    hunters could not find game and the people became hungry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The people send for the Thunder Boys in the far west beyond the sun door because
    they are said to be able to bring back game.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Thunder Boys sit in the townhouse and sing; by the seventh song, a herd
    of deer led by a large buck comes from the woods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The hunters kill as many deer as they need, and the Thunder Boys teach the
    people the seven deer-calling songs before returning west.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
