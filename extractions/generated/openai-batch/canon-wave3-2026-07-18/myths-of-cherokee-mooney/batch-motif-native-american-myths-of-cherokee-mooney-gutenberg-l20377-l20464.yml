canonical_text:
  quote: ''
  summary: 'The passage describes Cherokee beliefs and practices concerning plants
    and wood: laurel and sassafras fuel taboos, walnut bark used to stupefy fish,
    fires made with specified woods to bring warm weather, and the dangerous or powerful
    qualities of lightning-struck wood. It then describes the ritual importance of
    corn as Selu or Agawe''la, the Green-corn dance, restrictions around first new
    corn, planting customs using seven grains, rites invoking the Old Woman to bring
    corn into the field, a clean trail between field and house, and a nearly forgotten
    field-corner wailing ceremony tentatively compared by the author to lamentation
    for Adonis.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Laurel is used for spoons, combs, and medicine, but is not burned because
    burning it is believed to bring cold weather and damage the plant's medicinal
    virtues.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hissing sound of burning laurel leaves is said to suggest winter winds
    and falling snow.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a doctor prepares a compound containing laurel, precautions are taken
    to keep laurel leaves or twigs from being swept into the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sassafras is tabooed as fuel among the Cherokee and also among neighboring
    white people, with a practical explanation offered that it may pop from the fire
    and set a house alight.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pounded walnut bark is thrown into small streams to stupefy fish so they can
    be collected in baskets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a pregnant woman wades into the stream during the use of walnut bark, its
    effect is nullified unless she has tied a strip of the bark around her toe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A fire made of post-oak and summer grape wood is believed to bring warm weather
    even in winter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wood from a living tree struck by lightning is described as especially mysterious
    and is used in secret compounds by conjurers.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ordinary laypeople avoid touching lightning-struck wood and do not burn it
    for fuel because of feared bodily and medicinal harms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A medicine-man may burn splinters of lightning-struck wood to coal and give
    it to ballplayers for body painting, so they may strike opponents with thunderbolt-like
    force.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Bark or wood from a still-green lightning-struck tree may be put into seed-soaking
    water to insure a good crop, while lightning-struck wood thrown into a field is
    believed to make the crop wither.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Corn is described as the foremost vegetable in household economy and ceremonial
    observance and is invoked in sacred formulas as Agawe'la, 'The Old Woman.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage connects corn's ritual name to a mythic origin from the blood
    of an old woman killed by her disobedient sons.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Green-corn dance was an annual thanksgiving ceremony before eating the
    first new corn, involving propitiation, expiation, amnesty, and prayer for the
    coming year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Seven ears from the previous year's crop were saved to attract the corn until
    the new crop ripened and the dance took place.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: When eating first new corn after the Green-corn dance, people avoided blowing
    on it to cool it for fear of causing a wind storm to damage the standing crop.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Seven grains were planted in each hill and were not later thinned out.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: After the last working of the crop, a priest and assistant built a small enclosure
    in the center of the field, sat inside it, and the priest sang invocations to
    the corn spirit with a rattle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: During the corn invocation, a rustling outside the enclosure was believed
    to be caused by the Old Woman bringing corn into the field, and neither participant
    was to look up until the song ended.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:20
  text: A clean trail was kept from the field to the house so the corn would be encouraged
    to stay at home and not wander elsewhere.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: A nearly forgotten ceremony after the first working of corn involved the owner
    or priest standing at each of the four field corners and loudly weeping and wailing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:22
  text: The author says priests could no longer explain the field-corner wailing and
    suggests it may have been a lament for Selu's bloody death, comparing it to Byblos
    women's weeping for Adonis.
  category: speech
  evidence_refs:
  - ev:10
