  quote_or_summary: The priest later checks for young ears if regulations were observed;
    owners may learn the songs and ritual for a fee; a clean trail is kept from field
    to house so corn will stay home, and many customs have fallen into disuse except
    among some old people.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
