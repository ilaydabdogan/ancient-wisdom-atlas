  locator: 20452-20464
  quote_or_summary: After first working of corn, a nearly forgotten ceremony had the
    owner or priest stand at each of the four field corners and weep loudly; priests
    cannot explain it, and the author suggests it may have been a lament for Selu's
    bloody death, like Byblos women's weeping for Adonis.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
