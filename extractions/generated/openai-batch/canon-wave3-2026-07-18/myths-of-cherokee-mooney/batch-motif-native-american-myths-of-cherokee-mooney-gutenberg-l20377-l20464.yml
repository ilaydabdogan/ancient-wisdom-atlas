  quote_or_summary: Seven grains are planted in each hill; after last working, a priest
    and assistant build a field-center enclosure, sit with heads bent, keep silence
    while the priest sings with a rattle, and hear a rustling believed to be the Old
    Woman bringing corn; the rite is repeated four nights, followed by seven nights
    when no one enters.
