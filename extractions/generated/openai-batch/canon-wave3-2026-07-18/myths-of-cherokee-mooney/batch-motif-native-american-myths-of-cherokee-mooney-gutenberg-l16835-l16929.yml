canonical_text:
  quote: ''
  summary: The passage describes water-dwelling cannibal spirits who kill sleeping
    people, especially children, carry bodies beneath rivers, and leave lifeless images
    in their place. It then tells how a sick man from Tikwali'tsi is led by an unknown
    old woman into an underwater country, sees hunters carrying dead humans, is healed,
    returns home under a seven-day silence rule, and later tells the story. The passage
    then shifts to historical traditions about first contact with whites through whisky
    and a creation-era story explaining the ulûñsû'ti as the Indian's talisman and
    silver or money as the white man's talisman.
  language: English
  quote_policy: summarized
