  summary: The passage gives historical notes on stockade forts used for collecting
    Cherokee people before Removal, a McNair family grave inscription connected with
    Removal, and a biographical sketch of Samuel Houston, including his Cherokee name,
    adoption by Chief Jolly's family, military career, political career, and later
    return to the Cherokee in the West.
