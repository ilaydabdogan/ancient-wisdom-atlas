  quote: ''
  summary: The passage narrates early nineteenth-century Cherokee treaty cessions
    and compensation arrangements, pressure for opening Cherokee lands, an abandoned
    iron-works concession, the 1810 Cherokee council act abolishing clan revenge,
    and the creation of a public road along an older trail through river and mountain
    routes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eastern Tennessee settlements were connected with the Nashville-area settlements
    after the treaty of October 25, 1805, while the southern part of the state remained
    Indian country under pressure for opening.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: By the January 7, 1806 treaty, the Cherokee ceded claims to a large tract
    between Duck river and the Tennessee, including Long island in Holston river,
    in exchange for cash installments, a grist mill, a cotton gin, and an annuity
    for Black-fox.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A September 11, 1807 supplementary treaty further extended ceded boundaries,
    and Agent Meigs secretly agreed to give a separate payment and rifles to the signing
    chiefs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In 1807 Colonel Elias Earle obtained a Cherokee concession for iron works
    at Chickamauga creek, but the project was abandoned after Tennessee refused to
    sanction the grant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tennessee legislature attempted to negotiate for Cherokee unceded lands
    within state limits, but the attempt failed because the Cherokee were unwilling
    to part with more territory and disliked the people of Tennessee.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In 1810 the Cherokee national council formally abolished the custom of clan
    revenge through an act of oblivion among the clans or tribes of the Cherokee nation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The 1810 enactment distinguished accidental killing without malice from murder
    and said that killing a horse thief would not require satisfaction from the killer's
    relatives or clan.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Under an 1813 agreement, representatives of Tennessee, Georgia, and the Cherokee
    nation organized a company to build a free public road from Tennessee river to
    the Tugaloo branch of Savannah river.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The road passed through named river valleys, a mountain gap, and the Great
    Smoky range, ending at Echota, and was known officially as the Unicoi turnpike
    and in North Carolina as the Wachesa trail.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The narrator states that some negotiations for Cherokee removal to the West
    are being passed over for the present.
  category: sequence
  evidence_refs:
  - ev:10
