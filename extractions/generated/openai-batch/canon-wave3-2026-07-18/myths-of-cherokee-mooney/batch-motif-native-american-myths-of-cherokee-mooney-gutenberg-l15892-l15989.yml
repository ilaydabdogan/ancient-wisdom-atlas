canonical_text:
  quote: ''
  summary: The passage describes a dangerous red-and-white great leech in a deep river
    hole near a rock ledge crossing, several human encounters with its boiling water
    and waves, and a continuing belief that it remains in the water and can move by
    an underground waterway. It then introduces the Nûñne'hi, invisible immortal spirit
    people of the Cherokee highlands who live in mountain or mound townhouses, make
    music, help lost wanderers, aid Cherokee warriors, and are distinguished from
    the Yûñwi Tsunsdi' or Little People. The passage ends with the beginning of a
    boy's account of being invited by a stranger to a house and fed kindly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A deep hole in Valley river lies near a rock ledge that people formerly used
    as a bridge, with a trail and high bank above the water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men on the trail saw a large red object on the rock ledge; it unrolled, appeared
    alive, stretched out like a great leech with red and white stripes, and crawled
    into the deep water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the creature entered the water, the water boiled and foamed, and spray
    or a waterspout fell where the men had been standing; the men escaped by running
    away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: More than one person was carried down in this way, and bodies were later found
    on the bank with ears and noses eaten off; people became afraid to cross the ledge
    or use that trail section.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A young man laughed at the story, dressed and painted himself, sang about
    using red leech skins as garters, and was swept away by a wave before he crossed
    halfway.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Two women went to fish at the ledge; one woman with a baby dismissed warnings,
    laid the child on the rock, and saved it when water rose over the ledge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: People say the great leech remains in the deep hole because they see something
    alive moving on the bottom; some also say it travels by an underground waterway
    to Nottely river, where another place is called The Leech place.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Nûñne'hi are described as immortals or spirit people living in the highlands
    of the old Cherokee country, with townhouses especially in bald mountains and
    under named peaks or mounds.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Nûñne'hi are invisible except when they choose to be seen; when visible
    they look and speak like other Indians, and hunters hear their music and drums
    but cannot locate the townhouse.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'The Nûñne''hi are described as friendly: they take lost wanderers to townhouses
    under the mountains, care for them, guide them home, and sometimes come out as
    warriors to save Cherokee from defeat.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage reports that some people have thought the Nûñne'hi are the same
    as the Yûñwi Tsunsdi' or Little People, but it distinguishes the Little People
    as child-sized fairies.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: A boy from Nottely was playing near the river and building a fish trap when
    a man invited him to rest, come to his house for dinner, and return in the morning;
    the boy went, was fed kindly, and saw a man he knew there.
  category: sequence
  evidence_refs:
  - ev:12
