  quote: ''
  summary: 'The passage contains several short narratives: a lazy hunter is exposed
    by scorched moccasins and expelled; a lazy suitor pretends repeatedly to have
    killed deer until relatives discover the hidden decayed carcass; two old men interpret
    soup comments as insults about their bodily features and kill each other; and
    a warrior buys peacock feathers, makes a headdress, claims they are star feathers
    from a sky journey, and gains authority as a false prophet.'
