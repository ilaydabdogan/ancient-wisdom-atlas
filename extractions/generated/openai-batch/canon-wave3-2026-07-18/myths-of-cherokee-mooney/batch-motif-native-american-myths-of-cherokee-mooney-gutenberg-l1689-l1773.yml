canonical_text:
  quote: ''
  summary: 'Historical narrative of events in 1760-1761 during the Cherokee war: Oconostota
    besieges Fort Prince George and signals an ambush of Lieutenant Coytmore, soldiers
    kill Cherokee hostage chiefs, Montgomery destroys Lower Cherokee towns and then
    retreats after battle near Echoee, Fort Loudon surrenders after a siege, hidden
    military stores lead to an attack on the surrendered troops, Ata-kullakulla escorts
    Captain Stuart safely through the wilderness, and Grant later destroys the Middle
    towns and food stores.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oconostota laid siege to Fort Prince George in winter and cut off communication.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oconostota sent word through an Indian woman that he wished to speak to Lieutenant
    Coytmore; when Coytmore came out, Oconostota stood across the river and swung
    a bridle as a signal to hidden warriors, and Coytmore was shot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Coytmore was shot, soldiers entered the room where Cherokee hostages,
    described as prominent chiefs, were confined and killed them all.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cherokee forces attacked Carolina frontier settlements and laid siege to Fort
    Loudon while Colonel Montgomery led a large force toward Cherokee towns.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Montgomery’s force destroyed Lower Cherokee towns, burned them, cut down cornfields
    and orchards, killed or captured more than a hundred men, and drove the population
    into the mountains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cherokee forces gathered near Echoee above Nikwasi and fought Montgomery on
    June 27, 1760; Montgomery withdrew to Fort Prince George after losing nearly one
    hundred killed and wounded.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Fort Loudon garrison was reduced to eating horses and dogs but received
    daily food supplies from Indian women who had formed attachments with soldiers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When threatened by chiefs, the women said the soldiers were their husbands,
    that helping them was their duty, and that English relatives would avenge harm
    done to the women.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Captain Demeré surrendered Fort Loudon to Oconostota under terms allowing
    the garrison to leave with arms and limited ammunition if remaining warlike stores
    were delivered up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the garrison left, hidden bags of powder and ball were found in the
    fort; the passage also reports that arms and ammunition had been thrown into the
    river.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Angered by the perceived breach of capitulation, Cherokee attackers struck
    the soldiers at daylight, killed Demeré and twenty-nine others, and took the rest
    prisoner.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ata-kullakulla claimed Captain Stuart, took him into the woods on the stated
    pretext of hunting, and led him for nine days through the wilderness to safety
    in Virginia.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Colonel Grant’s 1761 expedition included Chickasaw and Catawba warriors, defeated
    Cherokee resistance, destroyed the Middle towns with their granaries and cornfields,
    and drove inhabitants into the mountains.
  category: action
  evidence_refs:
  - ev:8
