canonical_text:
  quote: ''
  summary: A historical account describes Tecumtha's effort to unite tribes, his brother's
    prophetic doctrine urging Indians to return to old ways, and the doctrine's spread
    to Creeks and Cherokee. At Ustanali a Cherokee prophet announces that adoption
    of white goods has angered the gods and will bring destruction unless the people
    resume older practices. Major Ridge opposes the message and is attacked. The prophet
    later threatens a destructive storm that will spare only true believers gathered
    on high peaks of the Great Smoky Mountains; followers abandon white-derived possessions
    and march there, but the appointed day passes without disaster and they return
    home. The passage then contrasts Cherokee refusal to join hostile Creeks during
    the Creek War and recounts retaliatory pursuit of Creek murderers of a Cherokee
    woman.
  language: English
  quote_policy: summarized
