canonical_text:
  quote: no one can come back from the underworld and tell it and live
  summary: A young warrior follows two mysterious sisters from an all-night dance
    to their cave home beneath Tallulah falls. Their roads appear as water, their
    furnishings and riding gear are living turtles and snakes, and their brother is
    associated with thunder and lightning. The warrior refuses their otherworldly
    ways, is struck senseless, returns after an apparently long absence, discloses
    what he saw despite a warning, and dies seven days later.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At an all-night dance at Sâkwi'yi, two unknown young women with beautiful
    long hair arrived, danced, and slipped away in the morning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young warrior fell in love with one sister because of her hair and asked,
    through an old man, whether she would marry him and let him live with her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young woman said her brother at home had to be consulted and required
    the warrior to prove constancy by fasting until the next dance seven days later.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the next dance, the sisters said their brother was willing and warned the
    warrior that if he told anyone where he went or what he saw, he would die.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sisters led the warrior through woods to a creek; what looked to him like
    water was described by them as the road to their house and became soft grass underfoot.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Tallulah river, what looked like deep water was described by the sisters
    as the main trail; when he entered, it was tall grass above his head.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The travelers came to a rock cave beneath Ugûñ'yi, or Tallulah falls, which
    the women called their house.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Inside the cave the women removed their long hair and hung it on a rock, leaving
    their heads smooth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The younger woman told the warrior to sit beside her, but he saw the seat
    as a large turtle that raised itself and stretched out its claws.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The brother arrived with thunder, was identified by the woman, and sat on
    the turtle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The brother invited the warrior to a council; when the warrior asked for a
    horse, the young woman brought a great uktena snake, and additional riding gear
    included a turtle saddle and living snake bracelets.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the warrior rejected the place as full of snakes and creeping things,
    the brother became angry, lightning seemed to flash from his eyes, and thunder
    left the warrior senseless.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The warrior awoke standing in water and holding a laurel bush, with no cave
    or Thunder People visible, and he was alone in the forest.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: When he returned home, others thought he had been dead because he had been
    gone a long time, although it seemed to him only the day after the dance.
  category: sequence
  evidence_refs:
  - ev:9
