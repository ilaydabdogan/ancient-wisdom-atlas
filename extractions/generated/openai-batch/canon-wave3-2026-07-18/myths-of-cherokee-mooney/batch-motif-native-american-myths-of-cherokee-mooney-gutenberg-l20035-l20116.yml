  quote: ''
  summary: 'The passage gives place-name notes for sites in Georgia and nearby Cherokee
    country: the Chopped Oak as a law ground, war rendezvous, and scalp-marked tree;
    Dead Man''s Gap as a reputed grave site linked to a stolen woman and a killed
    Indian; Frogtown as a name explained by a giant frog sighting; Hiwassee and Nottely
    as names with rejected pseudo-myths; Nacoochee as a place with a fictitious tragic-princess
    legend and mound; and Talking Rock as a name linked to an echo rock or disputed
    council-rock explanation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Chopped Oak stood about six miles southeast of Clarkesville and was described
    as the Law Ground, a place for company musters and magistrates' courts.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Chopped Oak was said to be a rendezvous at a junction of trails where
    Indian parties laid war plans, separated, returned, and awaited one another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For every scalp taken, a gash was cut in the Chopped Oak; later a young man
    killed the tree by girdling it, and the stump remained standing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dead Man's Gap was named from a reputed Indian grave, said to be that of an
    Indian killed while eloping with a white woman stolen from her husband.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Frogtown, Cherokee Walâsi'yi or 'Frog place,' was linked to a tradition that
    a hunter once saw on a nearby mountain a frog as large as a house.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says there is no especial Cherokee story connected with Hiwassee
    and identifies White's Hiwassee account as a pseudo-myth and pure invention.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In White's Hiwassee pseudo-myth, Hiwassee is a Catawba chief's beautiful daughter,
    wooed and won by the young Cherokee warrior Notley, who later becomes head chief
    and makes perpetual peace between the two tribes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Nacoochee note cites a fictitious legend in which a princess called 'The
    Evening Star' loves a chieftain of a hostile tribe; both are killed while fleeing
    an angry father, buried in one grave, and covered by a mound.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Nottely note says the Cherokee form has no meaning in Cherokee and directs
    readers to the Hiwassee note for a pseudo-myth connected with the name.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Talking Rock translates Cherokee Nûñyû'-gûñwani'ski, 'Rock that talks'; one
    informant connects it with an echo rock, while an old trader's council-rock explanation
    is rejected on etymological grounds.
  category: object
  evidence_refs:
  - ev:7
