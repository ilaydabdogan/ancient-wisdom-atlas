canonical_text:
  quote: ''
  summary: Notes compare Cherokee beliefs and formulas concerning eagles, birds of
    prey, night birds, hawks, small messenger birds, and animal ball-game stories
    with reported practices and stories from other Native American and Indigenous
    American groups, including Quichua, Blackfoot, Southern tribes, Six Nations, Creeks,
    and Seminoles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Cherokee are reported to have held eagle tails in great esteem, sometimes
    giving them with wampum in treaties, and requiring them for warlike ceremonies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expression that a snowbird had been killed is described as a way to avoid
    offending the eagle tribe; a comparable Cherokee expression about being scratched
    by a brier is said to mean being bitten by a snake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Professional eagle killers and prescribed ceremonies for securing eagles are
    said to have existed among many tribes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The eagle, described as both a bird of prey and a sacred bird, was not eaten.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that shifting responsibility for a killing or disturbance
    to a vicarious victim is common in Indian formulas for obtaining pardon, especially
    for offenses against an animal tribe or spirits of the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Quichua laborers near Cuzco are reported to have knelt before work at cave
    tombs and recited a prayer to spirits of the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the quoted Quichua prayer, the speakers address dead chiefs as sons of
    the sun and brothers, deny that they have come willingly to disturb the dead,
    and ask that vengeance and curses be directed toward their superiors.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the prayer, sacrifices of coca leaves, aguardiente, and chicha were
    made, and a snow-capped mountain was called upon to witness affection for ancestors
    before work began.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Adair is cited as saying that Southern tribes considered birds of prey and
    night birds unclean and unlawful to eat.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says fear and reverence for night birds is universal among Western
    tribes, and that owls are believed to bring prophetic tidings to conjurers able
    to interpret their language.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A hawk is described as a bird of prey that was not eaten; in Adair's anecdote,
    an old woman refused to dress a hawk because she feared pollution, disease, and
    the 'accursed sickness.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A small uncommon bird chirping over a camp is reported to have intimidated
    Southern Indians, and a Oneida speaker at Albany described Tskleleli as a news-carrying
    bird that warned of a path being shut.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Cherokee story of a ball game of birds and animals is described as widely
    known and collected from several named informants.
  category: other
  evidence_refs:
  - ev:10
- id: obs:14
  text: Creek and Seminole stories are said to tell of ball games between birds and
    fourfooted animals; in one story the bat is rejected by both sides, then accepted
    by the fourfooted animals because it has teeth, and helps them win against the
    birds.
  category: sequence
  evidence_refs:
  - ev:10
