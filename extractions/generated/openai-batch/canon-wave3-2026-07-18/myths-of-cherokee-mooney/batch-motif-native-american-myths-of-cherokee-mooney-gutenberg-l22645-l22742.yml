canonical_text:
  quote: ''
  summary: Mooney’s notes collect parallel ethnographic accounts in which Seminole,
    Ojibwa, and Delaware people treat rattlesnakes as dangerous kin or grandfather
    beings, avoid killing them, make offerings or sacrifices to them, and explain
    snakebite or storm danger as possible retaliation for insult or injury to the
    rattlesnake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bartram reports that Seminoles around 1775 did not kill rattlesnakes or other
    serpents because the killed snake’s spirit could influence living snake kindred
    to take revenge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Bartram’s incident, Seminoles asked him to kill a rattlesnake in their
    camp, then wanted to scratch him to let out blood and courage, and the act is
    described as appeasing the dead rattlesnake.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Henry reports that near an Ojibwa camp he found a coiled rattlesnake poised
    to strike, went for his gun, and was asked by the Indians to desist.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Ojibwa participants brought pipes and tobacco, surrounded the snake at
    a distance, called it grandfather, and blew smoke toward it.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The Ojibwa petitioned the rattlesnake to care for their families, influence
    Sir William Johnson to be charitable, ignore Henry’s intended insult, and remain
    in their country.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Henry says the rattlesnake’s appearance so far north was treated as an extraordinary
    omen, and a storm arose the next day while the party crossed Lake Huron by canoe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the storm, the Ojibwa called on the rattlesnake, offered prayers and
    sacrifices to the god-rattlesnake or manito-kinibic, and sacrificed dogs and tobacco
    to avert drowning and retaliation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: One Indian near Henry said drowning would be Henry’s fault and that Henry
    ought to be sacrificed to appease the angry manito; the storm later abated and
    the party reached an island safely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Heckewelder reports that Delawares called the rattlesnake grandfather, refrained
    from injuring it, and that an elderly Indian stopped him from killing one on the
    Muskingum.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Delaware explanation says the rattlesnake guards Indians, warns them by
    its rattle, and that killing one would lead the snake race to rise up and bite.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The source notes that these older Delaware notions had largely died away and
    that Indians at the time of the report killed rattlesnakes without ceremony.
  category: other
  evidence_refs:
  - ev:8
