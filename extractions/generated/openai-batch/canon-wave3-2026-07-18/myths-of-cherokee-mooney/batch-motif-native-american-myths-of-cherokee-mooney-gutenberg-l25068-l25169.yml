canonical_text:
  quote: ''
  summary: 'Mooney''s notes explain several Cherokee, Seneca, Iroquois, Kiowa, and
    wider Native practices or story elements: affectionate and respectful address
    terms; the name and setting of Hemp-carrier; trail cairns as memorial burials;
    polygamy and marriage claims; Seneca peacemakers and a captured warrior parallel;
    death songs before torture; women''s shuffle dances; non-recovery and adoption
    of captives; pine-knot torches for night travel; native tubers; sky people as
    spirit messengers; and sacred rites understood as instructed by the spirit world
    through vision.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: "“My grandson” is described as an affectionate form of address to a dependent
    or inferior, while “grandfather” is described as respectful address to a superior
    or venerable person, without necessary kinship."
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tâle'danigi'ski is identified as a former chief near Valleytown, and his name
    is rendered as Hemp-carrier, Nettle-carrier, or Flax-toter, connected with richweed
    used for fiber.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Seneca route is described as running from Valley river across a ridge to
    Cheowa and then northwest to the great war path in Tennessee.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Stone cairns along Cherokee trails are described as sepulchral monuments made
    of loosely piled large stones above a body, sometimes six feet or more high.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Passers-by were accustomed to add a stone to a memorial cairn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A cited Lawson account describes seven stone heaps as monuments for seven
    Indians slain by Sinnagers or Iroquois, with an Indian guide adding a stone to
    each heap.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Polygamy is described as common among the Cherokee and many other tribes,
    though usually not to the extreme of seven wives in the cited story.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among plains tribes, and possibly others, a man marrying the eldest of several
    daughters is said to have prior claim on her unmarried sisters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Seneca peacemaker story is said to have a somewhat similar account involving
    a young Seneca warrior captured by the Shawano.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Among eastern tribes, a condemned prisoner who requested it could recite warlike
    deeds and sing a death song before final torture.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The death song is described as belonging either to the warrior himself or
    to his war society, with a burden of farewell to life and defiance of death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Set-ängya is described as bursting his shackles at Fort Sill, attacking surrounding
    soldiers, and first singing the war song of the Kâitseñ'ko order.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Yontoñwisas dance is identified with Morgan's Untowesus and described,
    along with the Oaskanea, as a shuffle dance for women only.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Morgan is reported as saying that the Iroquois did not attempt to recover
