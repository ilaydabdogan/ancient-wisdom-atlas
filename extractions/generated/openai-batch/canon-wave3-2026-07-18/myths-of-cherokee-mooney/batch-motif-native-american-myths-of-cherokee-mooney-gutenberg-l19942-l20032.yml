canonical_text:
  quote: ''
  summary: The passage records several localized Cherokee place legends and place-name
    notes. One legend tells of a great serpent in a gulch that annually demanded ten
    beautiful maidens, who were left on a cliff to be swallowed. Other notes describe
    a river eddy where a serpent was an evil omen, marked trees associated with hidden
    mines or scalp tallies, a noted cave, an ambush story at Savannah, and several
    place names whose meanings or associated legends are lost or disputed.
