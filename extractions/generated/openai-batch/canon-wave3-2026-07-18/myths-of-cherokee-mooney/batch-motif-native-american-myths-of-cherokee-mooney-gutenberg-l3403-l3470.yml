canonical_text:
  quote: ''
  summary: The passage describes changes in Cherokee material life, agriculture, trade,
    livestock keeping, crafts, government-sponsored tools, internal tensions over
    adoption of spinning and farming equipment, the emergence of a western faction,
    the introduction of slavery, intermarriage with white traders and settlers, mixed-descent
    leadership, education efforts, and continued conservatism in the mountain-enclosed
    Middle towns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Firearms, trade goods, horses, and domestic animals had been introduced among
    the Cherokee before the period under discussion, and the passage says the people
    had learned the use of firearms and relied heavily on traders.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports Cherokee ownership or sale of cattle, hogs, poultry, crops,
    bees, honey, beeswax, and horses, and describes a general air of prosperity after
    repeated war ravages.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Pottery and basket-making are described as principal employments of women,
    while warriors are described as successful hunters whose skins were traded in
    large quantities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Under a government policy formalized in the 1791 treaty, the Cherokee were
    to receive farming tools and similar assistance; by 1801 the wheel, loom, and
    plough were reported to be in general use at the Cherokee agency.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a conference, chiefs from mountain towns complained that western and southwestern
    settlements had received more spinning wheels and cards; the other side replied
    that the tools had been offered to all alike and that the complainants had accepted
    late.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Progressive leaders named John Watts, Doublehead, and Will threatened to secede
    from the rest and leave those east of Chilhowee mountain to shift for themselves;
    the passage identifies this as a germ of dissatisfaction later leading to western-band
    emigration.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that negro slavery had been introduced and that several
    leading Cherokee men were slaveholders.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Much of the described civilizational change is attributed to intermarriage
    between Cherokee people and white men, especially traders from the ante-Revolutionary
    period and some Americans from back settlements.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Families of mixed descent are said to have become important in Cherokee history,
    to have educated children away from home or in private schools, and to have influenced
    national councils.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The Middle towns are described as shut in by high mountains and as a stronghold
    of Cherokee conservatism.
  category: setting
  evidence_refs:
  - ev:7
