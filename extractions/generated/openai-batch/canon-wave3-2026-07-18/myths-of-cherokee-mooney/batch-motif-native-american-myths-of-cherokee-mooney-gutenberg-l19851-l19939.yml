canonical_text:
  quote: ''
  summary: The passage records and evaluates local stories and place-name explanations
    for places in South Carolina and Tennessee, including a story of a young woman
    naming mile creeks during a horseback flight, a Cherokee tradition explaining
    Conneross as the place where a duck seemed to fall from a cliff cave into water,
    philological notes on Toxaway, Chattanooga, and Chickamauga, and an account of
    Buffalo Track rock bearing impressions attributed to buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A series of creeks joining Keowee River are named Mile, Six-mile, Twelve-mile,
    Eighteen-mile, Twenty-three-mile, and Twenty-six-mile in downstream order.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A local story says a young woman named the creeks as she crossed each ford
    during a rapid horseback flight to obtain help for the garrison of Fort Prince
    George.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the mile-creek names actually date back near the
    colony's early establishment and marked approximate distances on the old trading
    path from Fort Ninety-six to Keowee.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Conneross is described as a creek entering Keowee or Seneca River from the
    west, and its Cherokee form is glossed as meaning “Where the duck fell off.”
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cherokee tradition says a duck had a nest on a cliff above the stream in a
    cave whose mouth made the duck appear to fall from the cliff into the water when
    leaving the nest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Toxaway is identified as the name of a creek and former Cherokee settlement;
    an earlier rendering as “Place of shedding tears” is rejected, and the correct
    Cherokee form is said to have a lost meaning.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Buffalo Track rock is described as covered with deep impressions attributed
    by old Cherokee hunters to buffalo running along the rock and butting their heads
    and horns against a rock wall.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: For Chattanooga, the passage says Cherokee speakers pronounce the name Tsatanu'gi
    but consider it not Cherokee; the city is sometimes called A`tla'nuwa', “Tla'nuwa
    (Hawk) hole,” after an old name for a bluff.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: For Chickamauga, the passage says Cherokee speakers state that the name is
    not Cherokee and has no meaning in their language.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage rejects earlier translations of Chickamauga as “Boiling pot,”
    “Whirlpool,” or “River of Death,” explaining that the whirlpool association confounds
    it with The Suck, known in Cherokee as “Pot in the water.”
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: A newspaper writer's “Chickamauga gulch” legend is introduced only to state
    that it is not genuine.
  category: other
  evidence_refs:
