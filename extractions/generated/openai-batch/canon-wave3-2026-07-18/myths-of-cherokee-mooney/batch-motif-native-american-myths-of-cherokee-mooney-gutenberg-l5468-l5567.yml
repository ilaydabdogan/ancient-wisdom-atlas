  text: The petitioners ask that regular troops be sent to protect them from assaults
    and protect their people as they depart for the West.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: General Dunlap declares that he will not dishonor Tennessee arms by helping
    enforce, at bayonet point, a treaty made by a minority against the will and authority
    of the Cherokee people.
  category: speech
  evidence_refs:
  - ev:2
