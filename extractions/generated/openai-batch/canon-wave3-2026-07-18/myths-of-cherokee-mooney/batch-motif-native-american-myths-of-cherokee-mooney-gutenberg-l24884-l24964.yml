canonical_text:
  quote: ''
  summary: Notes describe wampum shell beads and belts, their use in adornment, treaty
    memorials, and exchange; brief source notes on Seneca-related stories; an attention
    call compared to an Australian bush cry; and an animal-protector parallel involving
    a wounded Kiowa warrior aided by a wolf and later rescued.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wampum is described as shell beads cut from clam, conch, or other mollusk
    shells, cylindrical rather than globular, in white and purple or dark varieties,
    with definite values.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coast tribes manufactured wampum and traded it to interior peoples; it was
    used east of the Mississippi for personal adornment and wampum belts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wampum belts preserved the memory of treaties and tribal traditions through
    woven pictographic or symbolic designs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The meanings of wampum-belt designs were preserved and publicly explained
    by an appointed officer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In ancient times, a treaty or covenant was not considered binding, and a tribal
    embassy was not recognized as official, without delivery of a wampum belt as guaranty
    and memorial.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cherokee still tendered wampum belts in treaties with the Government up
    to the end of the eighteenth century, and a belt was delivered similarly at Prairie
    des Chiens in 1825.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shell beads were used in the East as a standard of exchange, and the Cherokee
    word atela is used for both bead and money.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Schoolcraft attributes the Hiadeoni incident to the Seneca Tetoyoah, William
    Jones of Cattaraugus, and Hewitt suggests a possible Seneca form and meaning for
    the name.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Curtin's manuscript notes for the Seneca traditions were obtained in 1886-87
    among the Seneca Indians of New York and kept in Bureau of American Ethnology
    archives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gowe is described as a long halloo used as a signal to arrest attention, and
    the note says it resembles the Australian Coowee bush cry used for the same purpose.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: For The Unseen Helpers, the note states that the meaning of the Seneca name
    cannot be given.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Animal Protectors note says the leading incident of the tale is closely
    paralleled by a Kiowa story told as an actual occurrence about fifty years earlier.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the Kiowa story, a warrior was desperately wounded in an engagement with
    Mexican troops in southern Texas and abandoned to die by retreating comrades.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At night, a wolf approached the wounded warrior, licked his festering wounds
    with soothing effect, repeated this several times, and then spoke to him face
    to face, telling him to keep courage and that he would return safely to his tribe.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The wounded warrior was later found by a Comanche party, restored to his people,
    and made public thanksgiving at the next Sun dance.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The commentator adds that a wolf licking the wounds is not impossible and
    notes an Indian belief that there is no essential difference between humans and
    other animals.
  category: other
  evidence_refs:
  - ev:12
