canonical_text:
  quote: ''
  summary: The passage gives a historical account of East Cherokee governmental organization
    after Thomas's retirement, the legal recovery and protection of the Qualla boundary
    lands, federal assistance in clearing land titles, and later Indian Office supervision,
    relief distribution, and educational efforts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A general council of the East Cherokee assembled at Cheowa on December 9,
    1868, and began steps toward a regular tribal government under a constitution.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A new government was formally inaugurated on December 1, 1870, with a first
    and second chief, minor officers, and an annual council representing Cherokee
    settlements in North Carolina.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kâ'lahû', also called All-bones, Flying-squirrel, or Sawnook, was elected
    chief; a later constitution fixed the chief's term at four years.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cherokee land deeds had been made in Thomas's name because state law had forbidden
    Indian ownership of real estate at the time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Thomas's wartime losses and disability, his properties, including Cherokee
    lands technically held by him, passed into the hands of creditors, including William
    Johnston.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Congress authorized suit in 1870 for recovery of the Indians' interest, and
    the dispute was later submitted to arbitrators whose award was confirmed by the
    court in 1874.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The arbitration award found that Thomas had purchased the Qualla boundary
    and other tracts with Indian funds, calculated a remaining balance due, and provided
    that Johnston should convey clear legal title after payment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Congress directed in 1875 that remaining removal and subsistence funds be
    used for perfecting titles, litigation costs, land purchases, and education, improvement,
    and civilization of the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The unpaid balance to Johnston was paid, about fifteen thousand acres were
    additionally purchased for the Indians, and the Commissioner of Indian Affairs
    was constituted trustee.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The lands were made inalienable except by council assent and presidential
    approval, and deeds for the Qualla boundary and additional purchase were executed
    in 1876 and 1880.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: After titles and boundaries were adjusted, the Indian Office assumed regular
    supervision, and W. C. McCarthy was sent as agent in June 1875.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: McCarthy reported that the Indians were destitute and discouraged, with little
    stock or farming equipment, no schools, little English among full-bloods, but
    broad literacy in their own language taught by parents to children.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Under McCarthy's authority, stock animals, seed wheat, and farming tools were
    distributed, and several schools were started; the agency was discontinued the
    following year.
  category: sequence
  evidence_refs:
  - ev:5
