  text: The ballplay includes ceremonial and conjuring practices and a ball dance
    involving women on the night before the game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says large sums were staked on ballplay and reports a tradition
    that Cherokee won territory in northern Georgia from the Creeks through a ball
    game.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Cherokee ballplayer invokes the aid of the bat and flying squirrel and may
    attach a small piece of bat wing to his ball stick or to the frame holding sticks
    during the preliminary dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cherokee attract black house-martins by fastening hollow gourds to long poles
    near their houses for nesting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Creek myth says Turkey was once a warrior and still wears his last scalp
