literal_observations:
- id: obs:1
  text: Cherokee ballplay is described as a major athletic game of the Cherokee and
    other Native groups, played with netted rackets and goals made of upright poles
    on a level grassy bottom beside a small stream.
  category: action
  evidence_refs:
  - ev:1
