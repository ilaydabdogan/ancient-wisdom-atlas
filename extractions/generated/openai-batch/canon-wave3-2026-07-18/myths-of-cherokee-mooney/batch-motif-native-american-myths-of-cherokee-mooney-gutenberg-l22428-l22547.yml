  claim: The passage presents ballplay as a shared game across Cherokee, Gulf tribes,
    St. Lawrence and Great Lakes groups, and also notes a British Columbia underworld
    association and later lacrosse/raquette names.
  claim_level: same_function
  target: Indigenous North American ballplay/lacrosse traditions
  evidence_refs:
  - ev:1
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage compares game form and cultural distribution, not a shared
    myth narrative or historical origin.
- id: claim:2
  claim: The passage reports Creek parallels for the origin of Turkey's beard or breast
    feature involving a warrior identity or a swallowed scalp.
  claim_level: same_motif
  target: Creek myths in the Tuggle collection about Turkey's beard/scalp
  evidence_refs:
  - ev:6
