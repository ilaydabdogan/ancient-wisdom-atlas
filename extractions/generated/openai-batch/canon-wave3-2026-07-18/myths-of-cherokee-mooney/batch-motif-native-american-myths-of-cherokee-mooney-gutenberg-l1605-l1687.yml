canonical_text:
  quote: ''
  summary: A historical account describes escalating conflict between Cherokee people
    and British colonial authorities after a failed 1756 expedition, disputed appropriation
    of horses, killings and mutilations by frontiersmen, unsuccessful demands for
    satisfaction, peace efforts by Cherokee chiefs, renewed colonial demands, seizure
    of Cherokee delegates, and the return of Governor Lyttleton after smallpox broke
    out in Cherokee towns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After France was removed from the immediate colonial conflict, the passage
    says some Indigenous groups still did not accept the settlement; Pontiac’s northern
    confederated tribes continued fighting, and Cherokee allies of the British returned
    to encourage resistance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Major Andrew Lewis led an expedition against the Shawano with about two hundred
    Virginia troops and about one hundred Cherokee; snow, rain-swollen streams, loss
    of provisions and ammunition, starvation, and the killing of horses marked the
    failed return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cherokee contingent felt contempt and neglect from the colonists they
    had assisted, returned home on foot, and appropriated loose horses as compensation
    for their own losses and risks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Frontiersmen attacked the returning Cherokee, killed a reported twelve to
    forty people including prominent men, and, according to Adair, scalped and mutilated
    bodies and sold the scalps as those of French Indians.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Young warriors prepared for revenge, but chiefs restrained them while satisfaction
    was sought through treaty channels from Virginia, North Carolina, and South Carolina;
    those applications failed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women continued mourning slain kin, Creeks taunted Cherokee warriors, officers
    at Fort Prince George committed an outrage near an Indian town, attacks occurred
    on Carolina settlements, and two Fort Loudon soldiers were killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In November 1758 influential chiefs recalled a war party, went to Charleston,
    arranged the difficulty on friendly terms, and peace with the Cherokee was officially
    declared.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In May 1759 Governor Lyttleton demanded the surrender for execution of every
    Indian who had killed a white man, including the chiefs of Citico and Tellico;
    the Fort Loudon commander demanded twenty-four other chiefs, and trading supplies
    for the upper Cherokee were stopped.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A delegation from every Cherokee town came to Charleston, declared a desire
    for peace and friendship, and said they could not surrender their own chiefs;
    the governor responded by declaring war and seeking allied support from surrounding
    tribes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A second delegation of thirty-two prominent men led by Oconostota came for
    peace, but Governor Lyttleton had the party seized and confined at Fort Prince
    George while troops moved toward Cherokee country.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Ata-kullakulla intervened, Oconostota and two others were released under
    imposed conditions; then smallpox broke out in Cherokee towns, and Lyttleton returned
    to Charleston.
  category: sequence
  evidence_refs:
  - ev:7
