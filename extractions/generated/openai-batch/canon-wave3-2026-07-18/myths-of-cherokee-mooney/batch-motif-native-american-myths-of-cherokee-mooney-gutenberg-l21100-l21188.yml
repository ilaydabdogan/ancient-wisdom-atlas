  quote: ''
  summary: The passage contains the end of a formulaic address to a deer, followed
    by Mooney's notes on Cherokee myths concerning disease and medicine, animal societies,
    Kuwâ'hi mountain, explanations of the ground squirrel's stripes, and variants
    and parallels for the Daughter of the Sun origin-of-death myth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A repeated formula addresses a deer as it lies down, raises its head, attempts
    to rise, raises its body, and stands up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says the Cherokee disease-and-medicine myth explains the theory behind
    Cherokee doctors' medical practice.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that, in many Indian and other early medical theories as
    described by the author, disease is caused by animal spirits, ghosts, or witchcraft,
    and doctors try to drive out a malevolent spirit.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Creek belief cited from the Tuggle manuscript attributes disease to winds
    born in the air and descending to earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another Creek myth cited in the passage describes beasts, birds, and reptiles
    holding a council to devise means to destroy humans.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage describes a Cherokee theory in which animals are organized into
    tribes with townhouses, councils, and chiefs such as White Bear and Little Deer.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kuwâ'hi is identified as a high peak in the Great Smoky Mountains, and the
    bears are said to have a townhouse under it.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Creek myth explains the ground squirrel's back stripes as scratches made
