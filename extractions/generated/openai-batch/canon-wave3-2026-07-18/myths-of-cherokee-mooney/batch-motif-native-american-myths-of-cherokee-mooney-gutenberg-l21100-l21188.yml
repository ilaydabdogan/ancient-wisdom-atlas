  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The Cherokee relation to this particular explanation is not stated; the
    passage cites Creek, Iroquois, and Thompson River examples.
- id: motif:7
  label: Snake or transformed object as lethal agent in solar myth
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: John Ax's variant includes a transformed man as a Spreading Adder and a stick
    becoming a Rattlesnake; the Payne summary has the daughter of the Sun bitten by
    a snake and dying.
  evidence_refs:
  - ev:12
  - ev:15
  confidence: medium
  cautions: The passage summarizes variants and does not fully narrate how these snake
    details function in each version.
- id: motif:8
  label: Failed recovery of the dead through forbidden opening of a container
  taxonomy_refs:
  - forbidden_knowledge
  - death_rebirth
  basis: The Sun instructs people to retrieve his daughter's spirit in a box and not
    open it until reaching her body, but they open it from curiosity, the spirit escapes,
    and human death is fixed.
  evidence_refs:
  - ev:16
  - ev:17
  confidence: high
  cautions: The taxonomy reference to death_rebirth is limited because the intended
    restoration fails; it is not a completed rebirth.
- id: motif:9
  label: Origin of human death after intended immortality
  taxonomy_refs: []
  basis: The creators intend humans to live always, but the Sun argues for death,
    and the failed spirit retrieval decides that all humans must die.
  evidence_refs:
  - ev:14
  - ev:17
  confidence: high
  cautions: The passage presents this through a quoted manuscript summary of Cherokee
    belief.
- id: motif:10
  label: Celestial figure's daughter as origin-of-death victim
  taxonomy_refs:
  - divine_parent_child
  basis: The daughter of the Sun dies after a snake bite, and the Sun's attempt to
