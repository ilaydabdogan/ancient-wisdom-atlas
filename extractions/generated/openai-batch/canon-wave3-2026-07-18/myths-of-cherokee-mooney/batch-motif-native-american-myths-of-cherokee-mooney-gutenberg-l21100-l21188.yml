  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The author says the same explanation for the ground squirrel's stripes is
    given by Iroquois and Thompson River traditions.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Daughter of the Sun is identified as a principal Cherokee origin-of-death
