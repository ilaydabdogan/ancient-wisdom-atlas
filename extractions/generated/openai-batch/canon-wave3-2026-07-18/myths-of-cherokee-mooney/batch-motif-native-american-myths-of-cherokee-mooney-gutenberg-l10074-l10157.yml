  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: While Tecumtha went south to seek aid from southern tribes, Harrison marched
    against the Prophet’s town on the Tippecanoe River, where a pre-dawn battle defeated
    and scattered the gathered warriors.
  category: sequence
  evidence_refs:
  - ev:4
