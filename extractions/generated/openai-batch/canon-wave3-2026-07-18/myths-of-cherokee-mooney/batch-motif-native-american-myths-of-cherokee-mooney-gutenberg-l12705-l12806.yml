canonical_text:
  quote: ''
  summary: The passage gives notes on Cherokee animal names, animal-related beliefs,
    and formulas, then begins the story of Rabbit going duck hunting. It mentions
    dog folklore, introduced animal names, skunk and buzzard disease protection, a
    beaver tooth formula for children, a frostbite-prevention song invoking animal
    powers, and Rabbit's failed attempt to imitate Otter's duck hunting, ending with
    Rabbit trapped in a hollow sycamore stump.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dog is said to appear only rarely in Cherokee folklore, but the passage
    notes myths making the dog responsible for the Milky Way, replacing the wolf at
    the house fire, and being connected with the deluge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several introduced animals are named by loanword, resemblance, or analogy,
    including cow, hog, sheep, goat, mule, cat, and elephant.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The odor of the skunk is believed to keep off contagious diseases; skunk scent
    bags or bodies may be hung near the doorway, and the disease spirit is said to
    be repelled by the fetid smell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The buzzard is also held to be powerful against contagious diseases because
    it is described as superior to carrion smells.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a child's milk tooth is removed or falls out, the child runs around the
    house with it, repeats a beaver formula four times, and throws the tooth onto
    the roof.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before winter travel, a traveler may rub his feet in fire ashes and sing a
    four-verse formula to acquire the cold-defying powers of wolf, deer, fox, and
    opossum.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After each verse of the frostbite formula, the performer imitates the cry
    and action of the animal named in that verse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rabbit is described as boastful and tricky, claiming he can do what others
    do and making other animals believe him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Otter says he eats ducks, challenges Rabbit, dives underwater, pulls down
    a duck without being noticed, and returns underwater.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rabbit makes a noose from bark, repeatedly dives and resurfaces for breath,
    reaches the ducks, and throws the noose over one duck's head.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The duck flies up with Rabbit hanging from the noose; Rabbit eventually falls
    into a tall hollow sycamore stump and cannot get out through the bottom.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: While trapped and hungry in the hollow stump, Rabbit eats his own fur, and
    after several days hears children playing outside among the trees.
  category: sequence
  evidence_refs:
  - ev:8
