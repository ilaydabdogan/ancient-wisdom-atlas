canonical_text:
  quote: ''
  summary: A sequence of Cherokee place-name entries explains named locations through
    cairns and traveler observances, remembered war deaths, ball games, prisoner release,
    weapon-making, interrupted settlement-building, river and mountain supernatural
    beings, great animals, and the giant Jutaculla's residence and landscape marks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A series of cairns along the south side of Cheowa river is said probably to
    mark an ancient battle site; at least one heap is reputed to be the grave of a
    Cherokee killed by the enemy.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Passing Indians add a stone to each cairn because they believe misfortune
    will follow if they neglect the act.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At another trail crossing, passers gnaw laurel twigs because they believe
    failure to do so will bring misfortune before the next ridge; a nearby cairn also
    receives a stone from each passer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A planned ball game between Qualla and Valleytown teams was abandoned because
    the two parties feared each other.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The name Duduñ'leksûñ'yi means 'Where its legs were broken off,' but the passage
    says the suggested tradition appears to be lost.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: After defeat in a ball game, the ball captain John Butler or Tsan-uga'sita
    compared his men to broken pots.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Shawano war party coming against the Cherokee halted on Straight creek to
    prepare arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In an old war, Cherokee released some prisoners at a place named as a setting-free
    place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: People once began building a settlement on a mountain bench but left after
    hearing a strange noise they thought was made by an uktena.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A deep place in Oconaluftee river is named from a tradition that two red dogs
    were seen playing on the bank and were thought to live under the water.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: At a place on Tuckasegee river, supernatural white people were said to have
    been seen washing clothes in the river and drying them on the bank.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The supernatural white people were probably supposed to be the family of Agis'-e'gwa,
    the Great Female, a spirit invoked by conjurers.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Gregory bald is called Rabbit place; rabbits had their townhouse there, and
    the Great Rabbit lived there as their chief.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Great Rabbit was described as large as a deer, and the smaller rabbits
    were subject to him.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: Joanna bald is called Lizard place because of a traditional great lizard with
    a glistening throat that haunted the place and was seen sunning on rocky slopes.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:16
  text: The giant Tsul`kalû' or Jutaculla was said to live in a mountain, to have
    made a bald clearing for a farm, and to have left scratches on a rock by jumping
    from the mountain to the creek below.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: A ravine named 'Where the bones are' is explained by the killing of two Cherokee
    by enemies and the later discovery of their scattered bones by friends.
  category: sequence
  evidence_refs:
  - ev:14
