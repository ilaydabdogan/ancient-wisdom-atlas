  summary: Historical and bibliographic notes discuss the Walam Olum, its alleged
    Delaware pictographic record and translation history, parallel pictographic traditions
    on wood or birch bark, a disputed Fish River identification, possible referents
    for the first appearance of whites, and De Soto's expedition and death near the
    Mississippi.
