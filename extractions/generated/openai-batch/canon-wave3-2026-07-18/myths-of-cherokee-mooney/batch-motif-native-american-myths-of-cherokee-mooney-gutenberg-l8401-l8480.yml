literal_observations:
- id: obs:1
  text: The name Walam Olum is explained as meaning “red score,” from Delaware terms
    for red-painted and score or tally-mark.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rafinesque asserted that the Walam Olum was a translation of a Delaware manuscript
    interpreting an ancient sacred metrical legend recorded in pictographs cut upon
    wood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rafinesque said the actual olum were obtained in 1820 as a reward for a medical
    cure, and that songs in the original language were obtained in 1822 and translated
    by him in 1833.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brinton concluded that the work was a genuine native production, while judging
    the manuscript rendering to be faulty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Brinton’s edition is described as presenting the legend in pictograph, Delaware,
    and English translation, with notes, glossary, and an ethnologic introduction.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that no original woodcut pictographs of the Walam Olum
    are known to exist, though Rafinesque implied he had seen them.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Similar pictographic series cut upon birch bark are described as common among
    the Ojibwa, Menomini, and other northern tribes, with each pictograph representing
    a line or couplet of sacred metrical recitation.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Delaware prophet in 1762 recorded visions in hieroglyphics cut upon a wooden
    stick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Kickapoo reformer around 1827 used the same wooden-stick method to propagate
    a new religion, and one prayer stick is said to remain in the National Museum.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Fish River name is given as Namæsi Sipu or Namassipi, and its identification
    with the Mississippi is disputed in the note.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Walam Olum chronicle is summarized as saying that all the Talega go south,
    and the author suggests this was probably gradual withdrawal rather than sudden
    flight.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The note on the first appearance of whites presents several possible early
    voyagers but says the author assumes the reference is to Dutch and English settlements
    soon after 1600.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: De Soto is described as landing at Tampa Bay in 1539 with armed men and horses
