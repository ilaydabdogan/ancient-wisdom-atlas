canonical_text:
  quote: ''
  summary: The passage records Cherokee bird names, identifications, beliefs, omens,
    and taboos, then begins the story of the birds and animals arranging a ball game.
    It describes rare or unusual birds, a fork-tailed bird believed to be a transformed
    red-horse fish, restrictions connected with turkey and ruffed grouse, supernatural
    or messenger roles for several birds, and the opening of a contest in which animals
    and birds gather with notable champions while two small four-footed beings ask
    to join the birds after being rejected by the animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rare bird called nûñda-dikani', translated as “it looks at the sun” or “sun-gazer,”
    is described as resembling a blue crane and possibly a little blue heron.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gu'wisguwi' is described as an infrequent visitor that sometimes passed
    over mountain country with flocks of wild geese, resembling a large snipe with
    yellow legs and unwebbed feet.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chief John Ross is said to derive his Indian name, Gu'wisguwi', from the gu'wisguwi'
    bird, with the name perpetuated in Cooweescoowee district.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A bird called tsun'digwûntsu'`gi or tsun'digwûn'tski, meaning “forked,” appeared
    only once for a short season and was pale blue with red in places, nearly crow-sized,
    and had a long forked fish-like tail.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The forked bird preyed on hornets in flight and ate larvae in nests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Because the forked bird appeared and disappeared unexpectedly, it was believed
    not to be a bird but a transformed red-horse fish, with red spots and a long forked
    tail cited as support.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Hunters on Oconaluftee were said to have seen seven such beings sitting on
    a tree limb, still shaped like red-horse fish but already having wings and feathers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Turkey feathers are not worn by ball players, and the turkey neck is not eaten
    by children or sick persons, because of fear that a growth called “kernels” would
    result.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ruffed grouse meat is taboo to a pregnant woman because the bird hatches a
    large brood but loses most of them before maturity; under a stricter rule it is
    forbidden to a woman until she is past childbearing.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: The redbird is believed to have originally been the daughter of the Sun.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The huhu, or yellow mocking-bird, occurs in several stories, is regarded as
    supernatural, and its heart is given to children to make them quick to learn.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: The chickadee and tufted titmouse are both regarded as news bringers, but
    the chickadee is venerated as a truth teller while the titmouse is mocked as a
    lying messenger.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: A chickadee chirping near the house is taken as an omen that an absent friend
    will soon be heard from or that a secret enemy is plotting mischief.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: In an example story, Tom Starr avoids an ambush after hearing the warning
    note of a chickadee and escapes despite pursuit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The animals challenge the birds to a great ballplay, and the birds accept.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: At the ball dance, the animals are on a smooth grassy bottom near the river,
    while the birds are in treetops over by the ridge.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:17
  text: Bear is captain of the animals and is described as so strong and heavy that
    he can pull down anyone in his way; he tosses logs and boasts on the road to the
    ball ground.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:18
  text: The original Terrapin has a shell so hard that heavy blows cannot hurt him,
    rises on his hind legs, drops heavily, and boasts that he will crush any bird
    taking the ball from him.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:19
  text: Deer is described as able to outrun every other animal.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:20
  text: The birds have Eagle as captain, with Hawk and the great Tla'nuwa, all swift
    and strong in flight, though they are still somewhat afraid of the animals.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:21
  text: Two little four-footed beings, hardly larger than field mice, climb to the
    tree where Eagle sits and ask to be allowed to join the game.
  category: action
  evidence_refs:
  - ev:8
- id: obs:22
  text: Eagle asks the small beings why they did not go to the animals; they answer
    that the animals mocked and drove them off because they were so small, after which
    Eagle pities them and wants to take them.
  category: sequence
  evidence_refs:
  - ev:9
