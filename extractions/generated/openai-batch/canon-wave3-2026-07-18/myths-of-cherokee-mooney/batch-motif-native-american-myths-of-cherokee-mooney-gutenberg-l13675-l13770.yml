  quote_or_summary: The redbird is believed to have been the daughter of the Sun;
    the huhu or yellow mocking-bird occurs in stories, is regarded as supernatural,
    and its heart is given to children to make them quick to learn.
  source_text_path: texts/public-domain/native-american-southeast/project-gutenberg/myths-of-cherokee-mooney.md
  rights_note: Public domain source; summarized evidence.
