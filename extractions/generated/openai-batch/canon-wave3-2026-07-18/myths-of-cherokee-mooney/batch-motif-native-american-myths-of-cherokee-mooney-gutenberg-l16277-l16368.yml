canonical_text:
  quote: ''
  summary: The passage first tells of an old man attacked by enemies while the town
    warriors are absent; unknown warriors help him drive the attackers away and then
    disappear, leading him to identify them as Nûñne'hi. It then tells of Tsul`kalû',
    a giant hunter who courts a widow's daughter at night, provides game and wood,
    is revealed in daylight after the mother insists on seeing him, leaves angrily
    when called frightful, later retrieves a child-form from menstrual blood thrown
    into the river, and takes his wife and baby daughter to his home at Tsunegûñ'yi.
  language: English
  quote_policy: summarized
