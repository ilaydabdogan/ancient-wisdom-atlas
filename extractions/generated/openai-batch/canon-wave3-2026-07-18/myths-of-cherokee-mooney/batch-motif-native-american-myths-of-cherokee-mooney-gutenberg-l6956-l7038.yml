canonical_text:
  quote: ''
  summary: 'Historical account of William Holland Thomas, Yonaguska, and the Eastern
    Cherokee: land sales and relocation, Thomas''s commercial and political activity,
    his organization of Eastern Cherokee towns and government, Civil War service,
    postwar aid, and Yonaguska''s role as peace chief, counselor, adopted father,
    and settlement leader.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1819, lands on Tuckasegee and its branches were sold, Thomas's mother moved
    to the west bank of Oconaluftee, and Thomas went to live with her while maintaining
    business at Qualla.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yonaguska and his immediate connection stayed on a small reservation in the
    same neighborhood, while the rest of the Cherokee retired west of the Nantahala
    mountains but continued visiting and trading on Soco.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the 1838 removal, Thomas bought a farm on the northern bank of Tuckasegee
    and built a homestead called Stekoa, named after an Indian town destroyed on the
    same site.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thomas owned five trading stores in or adjoining the Cherokee country and
    was studying law and participating in local politics.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: As agent for the eastern Cherokee, Thomas divided purchased lands into five
    districts or towns named Bird town, Paint town, Wolf town, Yellow hill, and Big
    cove; the first three names were Cherokee clan names.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thomas drew up a simple government for the eastern Cherokee; its execution
    was in his and Yonaguska's hands until Yonaguska's death, after which the band
    recognized Thomas as chief until his retirement.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Thomas served in the North Carolina state senate, promoted road improvements
    in western North Carolina, and is credited as father of the Western North Carolina
    Railroad.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In 1861 Thomas voted for secession, resigned to recruit Confederate troops,
    and in 1862 organized the Thomas Legion, including companies made up principally
    of Cherokee; the Legion served chiefly as a frontier guard in the mountain region.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the war, Thomas returned to Stekoa, took unofficial charge of Cherokee
    affairs, attended the Cherokee during the 1866 smallpox epidemic, and assisted
    them through Reconstruction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Thomas's resources and hopes were lost through the war, hardship was followed
    by physical and mental collapse, he died in 1893, and older Cherokee still revered
    Wil-Usdi' as a father and great chief.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yonaguska, identified as Thomas's adopted father, is described as the most
    prominent chief in East Cherokee history, a peace chief and counselor rather than
    a war leader.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Yonaguska is described as tall, strongly built, strikingly handsome, and as
    an orator said to surpass other chiefs of his day.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Yonaguska resided on a reservation at the ancient Kituhwa site, later moved
    to Oconaluftee, and after the Removal gathered his people and settled with them
    on Soco creek on lands purchased by Thomas.
  category: sequence
  evidence_refs:
  - ev:8
