canonical_text:
  quote: ''
  summary: The passage contains historical and biographical notes on General William
    McIntosh, William Weatherford, and Reverend David Brainerd. It recounts McIntosh's
    ancestry, Creek leadership, support for land-cession treaties, condemnation by
    the Creek national council, and killing at his burned house. It summarizes Weatherford's
    role in the Creek war, the Fort Mims attack, his surrender to General Jackson,
    later reputation, and courage. It also summarizes Brainerd's missionary work among
    Mahican, Delaware, and other Native communities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: General William McIntosh is described as a Lower Creek chief of mixed Scottish
    and Indigenous ancestry, born at Coweta and killed there by order of the Creek
    national council in 1825.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: McIntosh had enough education to conduct official correspondence and came
    to be regarded as principal chief of the Lower Creeks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: McIntosh led warriors in support of the Americans against Upper Creek towns
    during the Creek war and again against the Seminole in 1817.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: McIntosh supported the Treaty of Indian Springs, which ceded land between
    the Flint and Chattahoochee rivers and was repudiated by the Creek Nation as factional.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: McIntosh was branded a traitor and condemned to death under a Creek law penalizing
    unauthorized land sales; the passage also says he was denounced in Cherokee council
    for attempting to bribe John Ross and other Cherokee chiefs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Warriors sent by the Creek national council surrounded McIntosh's house at
    daylight, allowed women and children to leave, set the house on fire, and shot
    McIntosh and another chief as they tried to escape.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: McIntosh left three wives, one of whom was Cherokee.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: William Weatherford is described as a Creek war leader of mixed ancestry,
    born in the Creek Nation around 1780 and dead in Alabama in 1826.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Weatherford led the attack on Fort Mims, which resulted in destruction of
    the fort and massacre of more than five hundred inmates; the passage says he reportedly
    tried to prevent later excesses and left when he could not restrain his followers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Weatherford was defeated at the Holy Ground and narrowly escaped capture by
    General Claiborne's troops.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the Creek defeat at Horseshoe Bend, Weatherford voluntarily entered
    General Jackson's headquarters and surrendered; Jackson allowed him to return
    alone to gather his people before peace terms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the treaty, Weatherford retired to a plantation in Monroe County, lived
    in comfort, and was respected by white neighbors until his death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage gives an anecdote of Weatherford single-handedly arresting two
    murderers while a local justice and bystanders were afraid to approach, and reports
    Jackson's praise of his fearlessness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Reverend David Brainerd became a licensed preacher, worked as a missionary
    to Mahican Indians at Kaunameek, persuaded them to remove to Stockbridge, and
    later worked among Delaware and other tribes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Brainerd's health failed in 1747; he retired to Northampton, died there, wrote
    accounts of his missionary labor, and his brother continued his later mission
    work.
  category: sequence
  evidence_refs:
  - ev:8
