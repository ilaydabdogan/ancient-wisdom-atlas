canonical_text:
  quote: ''
  summary: The first part describes men carrying a boxed girl home from the Ghost
    country; she revives and asks for release, food, drink, and air, but when the
    lid is raised she escapes and is identified as the Redbird, daughter of the Sun,
    making return from death impossible. The Sun grieves until her tears threaten
    to flood the world, and people stop her grief through dance, song, and a changed
    drum song. The second part tells how the Dagûl`kû geese steal the only tobacco
    plant; after other animals fail, Hummingbird retrieves tobacco leaves and seeds
    and revives an old woman with tobacco smoke.
  language: English
  quote_policy: summarized
