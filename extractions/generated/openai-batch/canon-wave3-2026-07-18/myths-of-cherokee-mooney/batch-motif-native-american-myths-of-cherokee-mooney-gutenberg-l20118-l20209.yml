canonical_text:
  quote: ''
  summary: 'The passage gives place-name notes for Tallulah, then reports a Tallulah
    Falls story presented as a Cherokee Nûñne''hi tradition: hunters disappear, medicine
    men investigate a gorge and waterfall inhabited by little people, and the Cherokee
    avoid the falls. It also records a Toccoa Falls tradition of a woman appearing
    under the water and then high on a rock, identified by Wafford as likely Nûñne''hi.
    The final section describes Track Rock gap, whose rocks bear petroglyphic tracks
    and other patterns.'
  language: English
  quote_policy: summarized
