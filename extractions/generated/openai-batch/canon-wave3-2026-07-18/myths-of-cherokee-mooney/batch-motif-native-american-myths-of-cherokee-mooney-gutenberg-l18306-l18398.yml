canonical_text:
  quote: ''
  summary: The passage gives historical and ethnographic notes on Cherokee names for
    neighboring peoples, especially the Catawba and Creeks/Muscogee. It describes
    Catawba-Cherokee enmity, a tradition of disputed territory resolved by a river
    boundary and stone piles, Catawba alliances with whites against the Cherokee,
    a battle tradition involving deer-tail identification markers, a temporary Catawba
    move to join the eastern Cherokee, and Cherokee names for southern and northern
    neighboring groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Catawba are identified by Cherokee names including Ani'ta'gwa, Ata'gwa,
    and Ta'gwa, and are described as immediate Cherokee neighbors to the east and
    southeast with principal settlements on the Catawba River in South Carolina.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a Catawba population decline from an estimated 7,000 at
    early South Carolina settlement to about 500 in 1775 and perhaps about 100 remaining
    at the time of writing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some place names and a Cherokee personal name are explained as deriving from
    or referring to Catawba, including Tagwâ'hi, “Catawba place,” and Ta'gwadihi',
    “Catawba-killer.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Catawba and Cherokee are described as hereditary enemies, with their cooperation
    against the Tuscarora in 1711-13 given as a rare or unique recorded exception.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Cherokee claim attributed to Colonel Thomas says the Cherokee formerly occupied
    the head of the Catawba River area, withdrew west of the Blue Ridge after game
    became scarce, and later “loaned” the eastern territory to the Catawba.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Catawba tradition recorded in Schoolcraft says Catawba progress at the Catawba
    River was disputed by Cherokee claimants of original ownership, leading to a battle
    with heavy losses and no decisive result.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Catawba tradition, Catawba advantage in the battle is attributed to
    guns, while their opponents had only Indian weapons.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The disputed-territory tradition ends with an agreement: Catawba territory
    would be east of the Catawba River, Cherokee territory west of Broad River, and
    the region between the two streams neutral; stone piles commemorated the treaty,
    and Broad River was called Eswau Huppeday, “Line river,” by the Catawba.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Catawba assisted whites against the Cherokee in the war of 1760 and in
    the Revolutionary struggle, including participation with Williamson's force in
    1776.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At a battle near the present site of Franklin, North Carolina, Cherokee tradition
    says the Cherokee initially mistook Catawba allies of the troops for Cherokee
    warriors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the same battle tradition, Catawba wore deer tails in their hair so that
    whites would not mistake them for Cherokee.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Cherokee tradition claims that the Cherokee had defeated the troops and Catawba
    allies but had to retire when their ammunition gave out; their leader is named
    as the war chief Tsani, or John.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Around 1840 nearly the whole Catawba tribe moved from South Carolina to join
    the eastern band of Cherokee, but returned home after a short time because of
    tribal jealousies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Other tribal names of doubtful authority are listed, including names possibly
    intended for the Shawano or Shawnee and a name possibly connected with the Congaree.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Creeks or Muscogee are described as the Cherokee's nearest southern neighbors,
    a mixed confederacy in central and southern Georgia and Alabama, known to the
    Cherokee by names derived from Kusa and Coweta.
  category: relationship
  evidence_refs:
  - ev:7
