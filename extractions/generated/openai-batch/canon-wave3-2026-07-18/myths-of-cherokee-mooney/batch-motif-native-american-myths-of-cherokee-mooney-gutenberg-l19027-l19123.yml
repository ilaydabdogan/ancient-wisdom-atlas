canonical_text:
  quote: ''
  summary: The passage describes how a Cherokee mound and townhouse fire are ritually
    established with stones, buried dead, sacred objects, a protected central fire,
    and a fire keeper; it also describes Green-corn new-fire renewal, larger mounds
    with persistent fire, lost sacred objects, a peace pipe, a turtle-shaped stone
    drum, and two brief miscellaneous tales about an inexperienced cook and a man
    escaping from a hollow stump by grasping a bear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mound is begun by laying a circle of stones, making a fire in the center,
    and placing a deceased prominent chief or priest, or seven chief men according
    to one variant, near the fire with sacred objects.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A priest conjures the deposited bodies and objects with disease so an invading
    enemy who destroys the town or townhouse will not live to return home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women bring earth in baskets to build the mound over the stones, bodies, and
    sacred things while leaving an open place at the central fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hollow cedar trunk with bark is lowered around the fire to protect it from
    earth and to form an opening nearly to the surface inside the completed townhouse.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man called the fire keeper stays in the townhouse to feed and tend the fire.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: For a dance or council, the fire keeper pushes ihyâ'ga weed stalks down the
    cedar-log opening, adds lichens and punk, prays, and the fire climbs along the
    stalks until it catches and becomes a townhouse blaze.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Before the Green-corn dance, every settlement fire is extinguished, and the
    people receive new fire from the townhouse fire called the honored or sacred fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some accounts locate the everlasting fire only in larger mounds such as Nikwasi'
    and Kitu'hwa, and the passage says smoke was seen rising from the Kitu'hwa mound
    during the civil war.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Cherokee had a nearly square wooden box wrapped in buckskin for the most
    sacred things of their old religion, carried and guarded by two priests on important
    expeditions.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Delawares captured the sacred box more than a hundred years earlier, after
    which the old religion was neglected and trouble came to the Nation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A white stone peace pipe had seven stem-holes for seven men to smoke from
    at peace councils.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: A turtle-shaped stone drum was hung inside the Keowee townhouse and used for
    town dances, including by other Lower Cherokee towns that borrowed it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the household tale, an old man tells his son to marry so they will have
    a cook; the young wife serves walnut hominy with whole unshelled walnuts, and
    the old man sends her away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the stump tale, a man falls into a hollow stump onto bear cubs; when the
    she-bear descends tail first, he grasps her hind legs, and she drags him out before
    running away.
  category: sequence
  evidence_refs:
  - ev:8
