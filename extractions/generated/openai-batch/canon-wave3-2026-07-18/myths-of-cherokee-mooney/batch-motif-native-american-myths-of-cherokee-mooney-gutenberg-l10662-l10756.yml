literal_observations:
- id: obs:1
  text: John Ross is identified as a major Cherokee chief with mixed Scottish and
    Cherokee ancestry, born near Rossville, Georgia, and known first as Tsan-usdi',
    "Little John," then as Guwi'sguwi', a name associated with a rare white or gray
    migratory bird.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that Ross was educated at Kingston, Tennessee, began public
    life at about nineteen, and later had Cooweescoowee district named in his honor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ross's first wife, described as a full-blood Cherokee woman, died from hardships
    of the Removal during the western march and was buried at Little Rock, Arkansas;
    he later married Miss Stapler in Philadelphia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ross's official career began in 1809 with a mission to the Arkansas Cherokee
    entrusted by Agent Return Meigs, and he remained in near-continuous service to
    his people until his death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ross held Cherokee national offices including member and president of the
    national committee, associate chief with William Hicks, president of the 1827
    constitutional convention, principal chief of the eastern Cherokee, and later
    principal chief of the united Cherokee Nation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In conflicts over Cherokee lands east of the Mississippi, the passage says
