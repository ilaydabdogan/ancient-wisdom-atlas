canonical_text:
  quote: ''
  summary: The passage first gives an account of two Mohawk men who ambush Cherokee
    towns, evade pursuers through mountains and rocks, approach Keeowhee intending
    to take a captive, are detected by an old man, surrounded, captured, and tortured
    at the stake; one asks traders for redemption before being admonished by the elder.
    It then begins the tale of two Seneca boys left in camp, captured by a Cherokee
    war party, taken south, given to an old man whose sons had been killed by Seneca,
    and adopted until they become hunters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pair of Mohawk men ambush the lower Cherokee towns over spring and summer,
    kill more than twenty people in separate attacks, take scalps, and retreat before
    being detected.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mohawk pair use neighboring mountains, broad rock ledges, and contrary
    courses to prevent pursuers from tracing them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After taking many scalps, the pair decide to capture one person and carry
    him home; near Keeowhee, one crawls ahead under cover while the other moves from
    tree to tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old beloved man sees the pair from a hill, identifies them as enemies by
    hair, running trim, and posture, and warns a trader while asking that the matter
    not be spread prematurely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The trader tells headmen; the town youth continue public diversions to hide
    the danger, while runners summon neighbors to come silently.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The assembled Cherokee cross a river ford, proceed over a creek, form a semicircle
    from the river bank, and find the two men under fallen young pine trees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After a war signal, the Mohawk men spring from cover, fight, nearly kill a
    Cherokee combatant with his own cutlass, but are overpowered, captured, and tortured
    by fire before a crowd.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When tied to the stake, the younger Mohawk addresses traders in English and
    asks them to redeem their lives; the elder tells him in their language to desist,
    after which the younger becomes composed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Seneca hunters leave two boys at camp; a Cherokee war party finds the boys
    alone, captures them, travels south rapidly, and the hunters decide pursuit is
    useless.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Cherokee give the two Seneca boys to an old man whose sons had been killed
    by the Seneca; he adopts them, and they grow up until they can hunt for themselves.
  category: relationship
  evidence_refs:
  - ev:9
