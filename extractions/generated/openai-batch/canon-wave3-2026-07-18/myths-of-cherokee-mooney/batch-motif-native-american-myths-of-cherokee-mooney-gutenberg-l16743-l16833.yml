canonical_text:
  quote: ''
  summary: 'The passage describes dangerous whirlpools at The Suck, including an account
    of two canoe travelers drawn under water, one lost to a great fish and one escaping
    after seeing people at the river bottom. It then gives the Yahula place-name story:
    Yahula disappears in the mountains, returns saying the Nûñne''hi cared for him
    and that their food prevents him from living or eating with humans, vanishes at
    the threshold, later appears only intermittently, and is associated with a mountain
    stone enclosure and nighttime disembodied songs and bells.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Suck is described as dangerous whirlpools at the mouth of Suck creek on
    the Tennessee, called Ûñ'tiguhi', "Pot-in-the-water," because the water looks
    like a boiling pot.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Canoemen passing the whirlpools were said to wait near the bank when the water
    revolved rapidly, proceeding only after it quieted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two men in a canoe were drawn into the vortex, thrown from the canoe, and
    carried under the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One of the two men was seized under water by a great fish and was never seen
    again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The other man was carried to the lowest center of the whirlpool, then outward
    and upward to the surface, and escaped to shore.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The escaping man reported seeing a company of people on the river bottom who
    beckoned to him and tried to seize him before the current carried him away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yahula is described as a prosperous Cherokee stock trader whose ponies wore
    bells heard on mountain trails.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yahula disappeared after a great hunt, could not be found, and was mourned
    by his friends as dead before later returning at supper time.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Yahula said he had been lost in the mountains and that the Nûñne'hi, the Immortals,
    found him, brought him to their town, and cared for him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Yahula said he had tasted fairy food, could never again eat with human kind,
    could not stay with his family, and had to return to the Nûñne'hi.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Yahula's wife, children, and brother begged him to stay, but he said the choice
    was life with the Immortals or death with his own people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Yahula was visible while inside speaking with his people, but vanished when
    he stepped out the doorway.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Yahula later visited often, appearing as himself indoors but disappearing
    as soon as he crossed the threshold; after urgent entreaties, he came no more.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A small square enclosure of uncut stone, without roof or entrance, stood on
    the mountain at the head of the creek and was said to be where Yahula lived.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: At night, travelers by the creek heard Yahula singing, urging horses, cracking
    a whip, and bells tinkling, but no driver or horses were visible.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: A friend of Yahula sang the same songs after Yahula disappeared, died suddenly,
    and the Cherokee became afraid to sing those songs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: When some Cherokee went from Georgia to Indian Territory in 1838, some wondered
    whether Yahula had gone there, but they never heard him again.
  category: sequence
  evidence_refs:
  - ev:8
