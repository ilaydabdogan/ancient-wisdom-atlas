canonical_text:
  quote: ''
  summary: The passage describes Raven Mockers as witches who invisibly remove and
    eat the hearts of sick or dying people to lengthen their own lives; only people
    with the right medicine can recognize or deter them. It then recounts a reservation
    story in which a young hunter hides in an old couple's house, observes signs that
    they are Raven Mockers, sees what appears to be a man's heart roasting, rejects
    a beadwork bribe for silence, reports them, and later returns with warriors to
    find the couple dead after seven days and burn the house.
  language: English
  quote_policy: summarized
literal_observations:
