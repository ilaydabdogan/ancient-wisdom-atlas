  text: Raven Mockers are said to kill a person, remove and eat the heart, and add
    to their own lives the days or years taken from the victim.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that no one in the room can see the heart removal, that
    no scar remains, and that no heart is left in the body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person with the right medicine can recognize a Raven Mocker; if such a person
    stays with the sick person, the witches retreat, and a Raven Mocker recognized
    in its right shape must die within seven days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A named man, Gûñskali'ski, had this medicine, hunted Raven Mockers, and killed
    several.
  category: action
  evidence_refs:
  - ev:1
