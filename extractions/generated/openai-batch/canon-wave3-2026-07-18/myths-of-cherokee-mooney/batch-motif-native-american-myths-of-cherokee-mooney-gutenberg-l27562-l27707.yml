canonical_text:
  quote: ''
  summary: Glossary segment explaining Cherokee terms and place names from Itsa'ti/Echota
    through Kâsdu'yi, including Echota as an ancient capital and sacred peace town,
    Itse'yi as a fresh green place, animal terms such as crow, raven, butterfly, spider,
    and water-moccasin snake, personal or title names such as Kâ'lahû', Kâ'lanû, and
    Kana'ti, and object or place terms such as scratcher, pipe, and Ashes place.
  language: English with Cherokee terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Itsa'ti is commonly spelled Echota, Chota, Chote, and other forms; the passage
    says the meaning is lost and that the name occurs in several places in the old
    Cherokee country.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Great Echota is described as a settlement on the south side of the Little
    Tennessee River and as the ancient capital and sacred peace town of the Nation.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: New Echota is described as the capital of the Nation for some years before
    the Removal, located at a site originally known as Gansa'gi at the junction of
    the Oostanaula and Conasauga rivers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Itse'yi means New green place or Place of fresh green and is applied especially
    to ground made green by fresh-springing vegetation after timber clearing or burning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that Cherokee, like most other Indian languages, makes
    no clear distinction between green and blue.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The entries define i'ya as pumpkin and give related forms meaning like a pumpkin
    and of pumpkin smoothness.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kâ'gû is defined as crow and described as onomatopoeic; Kâgûñ'yi is explained
    as Crow place.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kâ'lanû is defined as The Raven, used as a war title in the tribe and as the
    Cherokee name for General Samuel Houston or for a person named Houston.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kâ'lanû Ahyeli'ski is glossed as the Raven Mocker, and Kâ'lanûñ'yi is glossed
    as Raven place, the proper name of Big-cove settlement, also called Raventown.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Kâl-detsi'yûñyi means Where the bones are and names a spot near the junction
    of East Buffalo creek with Cheowa river.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kama'ma means butterfly; kama'ma u'tanû means elephant, literally great butterfly,
    because of a resemblance between the elephant's trunk and ears and a butterfly's
    proboscis and wings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kanahe'na is a sour corn gruel used among the Cherokee and other southern
    tribes and is identified with the Creek tamfuli or Tom Fuller.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kanane'ski means spider and, by a fancied resemblance in appearance, also
    watch or clock; kanane'ski amaye'hi is the water spider.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kana'ti is glossed as Lucky Hunter, a masculine name whose verbal form means
    he is lucky or successful in hunting.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Kanegwâ'ti is defined as the water-moccasin snake.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: Kanu'ga means a scratcher, described as a bone-toothed comb used to scratch
    ball-players before applying conjured medicine; related forms name briers and
    a Brier place settlement.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: Kanûñ'nawû is defined as pipe, and Kâsdu'yi is glossed as Ashes place, a modern
    Cherokee name for Asheville.
  category: object
  evidence_refs:
  - ev:11
