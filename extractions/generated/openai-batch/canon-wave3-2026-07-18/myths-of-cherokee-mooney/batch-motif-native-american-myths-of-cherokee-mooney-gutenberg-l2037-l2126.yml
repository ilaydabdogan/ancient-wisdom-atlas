canonical_text:
  quote: ''
  summary: 'Historical account of Colonel William Christian''s expedition: a Virginia-led
    force advances toward Cherokee towns, rejects a truce proposal, performs a deceptive
    night river crossing, finds the opposing force gone, destroys deserted towns and
    fields, negotiates peace terms with head men from farther towns, spares Echota,
    and includes participant notices of violent border-warfare practices and crop
    destruction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Virginia army of about two thousand under Colonel William Christian rendezvoused
    at the Long island of the Holston and included several hundred men from North
    Carolina.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The army advanced along the great Indian warpath toward the French Broad crossing,
    where a strong Cherokee force was reported to be waiting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the river crossing, the Indians sent a Tory trader with a flag of truce;
    Christian returned the message that there would be no terms until Cherokee towns
    had been destroyed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the ford, Christian kindled fires and made preparations as if to camp,
    then at night secretly drew off half his force to cross the river lower down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The night crossing involved deep, rapid water; the men supported each other
    four abreast and kept guns and powder dry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After crossing, the force found no enemy; the Indians had fled without a show
    of resistance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Christian reached deserted Little Tennessee towns, destroyed them one after
    another with their outlying fields, and killed the few lingering warriors discovered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Head men from farther towns came to Christian's camp to treat for peace and
    agreed to surrender prisoners and stock and to cede disputed territory after representatives
    could assemble.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Christian consented to suspend hostilities, but Tuskegee and another town
    were burned; Echota, called the sacred peace town, was not molested.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Participant narratives report burning towns, wasting fields, killing defenders,
    scalping killed warriors, shooting women and men, and auctioning or killing prisoners.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Near Tomassee, a small party of Indians was surrounded and cut off; the passage
    also quotes a personal encounter ending in a man being scalped alive and killed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two cited accounts describe Indigenous women being shot or captured and then
    killed or said to have died in the soldiers' hands.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: At Hiwassee and another town, soldiers found houses, corn, vegetables, hogs,
    apple trees, and improvements, then destroyed crops, buildings, and other resources.
  category: action
  evidence_refs:
  - ev:10
