canonical_text:
  quote: ''
  summary: The passage teaches that incorporals, bodies, movers, and moved things
    are subject to passion in different ways, and that a man freed from body is freed
    from passion. It then states that God has given humans mind and speech/logos,
    equal to immortality, for knowing and praising God; proper use of these guides
    a person after departure from the body to the Choir of Gods and Blessed Ones.
    It distinguishes speech/logos from animal voice, asserts speech is one among humans
    and found the same in Egypt, Persia, and Greece, and quotes a hierarchy in which
    soul is in body, mind in soul, reason/logos in mind, mind in God, and God is Father
    of these.
  language: English
  quote_policy: summarized
