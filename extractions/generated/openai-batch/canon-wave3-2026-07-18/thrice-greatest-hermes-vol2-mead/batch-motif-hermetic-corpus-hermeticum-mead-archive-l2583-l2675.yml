canonical_text:
  quote: ''
  summary: 'The passage describes the consummation of a final initiation: a perfected
    person completes the earthly pilgrimage, receives glory and heavenly kingship,
    and passes into a Christ-state or superhuman state. It then explains purified
    personalities or alter-egos surrendering into union while retaining their powers,
    becoming powers of a New Man or Son of Man and ultimately one with the Divine
    Will. The Shepherd is described as Christ of God, Son of the Father, able to take
    all forms and then mingle with the Powers. The passage further compares the Shepherd
    with Christ and Buddha, citing Buddhist teaching on Buddhas, Suchness, Dharmakaya,
    and the Body of Transformation.'
  language: English
  quote_policy: summarized
