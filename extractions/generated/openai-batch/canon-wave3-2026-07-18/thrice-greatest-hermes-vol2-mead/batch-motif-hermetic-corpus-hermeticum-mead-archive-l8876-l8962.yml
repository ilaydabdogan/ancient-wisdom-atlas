canonical_text:
  quote: Life is the making-one of Mind and Soul; accordingly Death is not the destruction
    of those that are at-oned, but the dissolving of their union.
  summary: The passage teaches Hermes that diverse sensory and vital acts belong to
    one living agent and cannot be apart from God. God is described as perfect, never
    inactive, and making all things through one work identified with Life, the Beautiful,
    the Good, and God. God works by himself and sustains all things; if separated
    from this work, all would collapse. Life is defined as the union of Mind and Soul,
    death as dissolution of that union, and Man, Cosmos, Æon, and the Sun are arranged
    in an image-chain. Change is called death because the body dissolves and life
    withdraws to the unmanifest.
  language: English
  quote_policy: quoted
