canonical_text:
  quote: ''
  summary: The passage describes a mind whose penetration, work, and sight are not
    blocked by Air, Earth, or Water. It then distinguishes animal and stationary genera
    through root imagery and forms of nourishment. Animals are said to consist of
    soul and body, with soul nourished by the motion of the World and body by foods
    from water and earth. Spirit animates animal bodies; sense is added, and reason
    is given uniquely to man from aether. God exalts human sense toward understanding
    Divine Reason. The speaker returns to the theme of union with the Gods, by which
    men alone consciously enjoy divine regard and may obtain rapture and a share of
    Divine Sense. An editorial note compares the root imagery with Simonian Gnostic
    and Ashvattha/world-tree symbolism.
  language: English
  quote_policy: summarized
