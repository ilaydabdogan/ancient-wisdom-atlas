canonical_text:
  quote: ''
  summary: 'The passage presents a teaching on maker and made as paired principles:
    God is the maker, leader, and Good, while made things follow. It argues that making
    all things is God''s glory and figuratively God''s body. Evil is denied as God''s
    product through analogies of rust on brass and filth on a body; change is described
    as a cleansing of genesis. The passage criticizes those who do not ascribe the
    making of all things to God, calling this ignorance and impiety.'
  language: English
  quote_policy: summarized
