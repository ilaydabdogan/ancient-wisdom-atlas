canonical_text:
  quote: ''
  summary: Nature, after being embraced by Man, brings forth seven male-female beings
    corresponding to the Seven. Earth, Water, Fire, and Aether participate in the
    formation of frames in the form of Man, while Man changes from Life and Light
    into soul and mind. At the end of a period, God loosens the bond of male-female
    creatures, separates them partly into male and female, and commands multiplication
    through the Holy Word. The passage then links Mind, deathlessness, love, Forethought,
    Fate, Harmony, generation, and self-knowledge.
