canonical_text:
  quote: ''
  summary: Hermes explains that Mind works good on the soul, can guide human souls,
    and restrains wrathful and lustful elements. Souls lacking Mind are likened to
    irrational animals and are driven by passions. God has set Mind over passions
    as judge and executioner. Tat asks how punishment can coexist with Fate, and Hermes
    replies that all corporal works are under Fate and that suffering after wrongdoing
    is also fated. Hermes then distinguishes reason-led humans from unreasoning humans
    under Fate, genesis, and change.
  language: English
  quote_policy: summarized
