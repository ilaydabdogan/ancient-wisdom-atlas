canonical_text:
  quote: ''
  summary: 'Mead''s commentary presents the treatise as an instruction on the Cosmos
    as a “Second God,” while affirming God as the source, limit, and constitution
    of all things. It describes the Cosmos as a great body, sphere, perfect form,
    cave or womb of genesis, centered in the Pleroma or Intelligible Cosmos. It states
    that cosmic order is preserved by apokatastasis, restoration, ever-becoming, and
    cyclic renewal; bodily loss is denied and replaced by privation of sense or latency
    of consciousness. It concludes with relations among God, Cosmos, and Man: Cosmos
    is made in God''s image, Man in Cosmos''s image, and Man knows through sense and
    mind.'
  language: English
  quote_policy: summarized
