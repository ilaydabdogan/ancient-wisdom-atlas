canonical_text:
  quote: ''
  summary: The passage describes Eternity as beginless, endless, fixed by unchangeable
    law, and moving in a circular or self-returning course in which beginnings cannot
    be known and good and bad issues are mingled. The speaker closes the sacred discourse
    by blessing and praising God and returning to bodily concerns after a “feast of
    mind.” The participants leave the holy place and orient themselves for prayer
    according to the sun. Asclepius proposes adding incense and unguents to the prayer,
    but Thrice-greatest rebukes the proposal as profanation because God needs nothing,
    being all things or containing all things.
  language: English
  quote_policy: summarized
