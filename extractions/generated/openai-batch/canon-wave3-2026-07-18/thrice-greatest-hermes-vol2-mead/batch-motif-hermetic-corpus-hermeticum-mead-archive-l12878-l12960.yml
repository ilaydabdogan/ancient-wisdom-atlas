  summary: The passage warns that translating Egyptian sacred discourse into Greek
    would obscure its meaning and weaken the power of Egyptian names and sounds. The
    speaker urges the king to keep the sermon from translation so the mysteries do
    not pass to the Greeks. The speaker then begins with an invocation to God, described
    as Lord, Maker, Sire, and Encompasser of the universals, and states a doctrine
    that All is One and One is All. The passage closes by pointing to Earth as containing
    founts of Water and Fire in its midmost parts.
