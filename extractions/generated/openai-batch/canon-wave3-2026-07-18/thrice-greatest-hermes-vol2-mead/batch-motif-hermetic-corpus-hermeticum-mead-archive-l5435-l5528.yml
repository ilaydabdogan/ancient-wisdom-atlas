  quote: ''
  summary: Commentary on the Hermetic theme that unmanifest God is most manifest.
    The passage discusses Greek terms for manifestation, translates phantasia as “thinking-manifest,”
    compares the doctrine with Vedanta Maya and the Logos as maker, cites a Phosilampes
    saying and Hippolytus on hidden and manifest Fire, compares divine non-grudging
    with Hermetic and Platonic sayings, and relates Hermetic panmonism to a Logos
    address in The Martyrdom of Peter and to a concluding hymn to God.
  language: English
  quote_policy: summarized
