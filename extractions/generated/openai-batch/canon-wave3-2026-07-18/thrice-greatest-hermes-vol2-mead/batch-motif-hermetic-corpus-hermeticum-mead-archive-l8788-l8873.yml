    is used to deny the possibility of two or more makers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that among multiple makers a single order would not be
    kept, because rivalry and striving would follow between weaker and stronger.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage considers and rejects the idea that the maker of changeable and
    mortal lives is separate from the maker of deathless lives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Every living body is described as consisting of soul and matter, whether immortal,
    mortal, or irrational.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: All living bodies are described as ensouled, while things that do not live
    are described as matter by itself.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Soul, when in itself, is described as a cause of life after its own maker;
