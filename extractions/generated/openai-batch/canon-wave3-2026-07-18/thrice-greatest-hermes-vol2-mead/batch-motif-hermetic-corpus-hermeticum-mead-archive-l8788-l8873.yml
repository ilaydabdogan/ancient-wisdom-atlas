canonical_text:
  quote: ''
  summary: Mind argues to Hermes that the ordered diversity of living bodies implies
    one maker rather than multiple makers. The passage distinguishes soul, matter,
    life, mortal and immortal beings, and identifies the one maker as God, who alone
    puts soul into lives and makes all things in many ways.
  language: English
  quote_policy: summarized
