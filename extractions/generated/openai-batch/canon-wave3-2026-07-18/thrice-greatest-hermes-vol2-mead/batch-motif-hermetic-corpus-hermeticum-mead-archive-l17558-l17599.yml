canonical_text:
  quote: thou shalt call nothing void
  summary: The passage presents a cosmology in which any extra-cosmic region, if it
    exists, is filled with intelligible things, while the sensible cosmos is filled
    with bodies and animals. It describes daimones dwelling with humans, heroes abiding
    between the pure air and the earth, and instructs Asclepius that nothing should
    be called void without specifying what it lacks; even apparent void cannot lack
    spirit and air.
  language: English
