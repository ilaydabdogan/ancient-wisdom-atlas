canonical_text:
  quote: ''
  summary: The excerpt moves from a brief dialogue in which Asclepius asks what people
    ignore or disbelieve, and Trismegistus tells him to listen, into an account of
    the soul after bodily departure. The soul's merit is judged and weighed under
    its highest daimon. A pious and just soul is allowed to rest in fitting places,
    while a soul stained by evil and vice is driven from Above into the Depths and
    given over to turbulent elemental forces. The condemned soul is described as dragged
    between Heaven and Earth on cosmic waves and subjected to ceaseless pain. The
    passage includes editorial notes comparing this account with attributed Hermetic
    material, daemonic post-mortem functions, and Empedoclean elemental wandering.
  language: English
  quote_policy: summarized
