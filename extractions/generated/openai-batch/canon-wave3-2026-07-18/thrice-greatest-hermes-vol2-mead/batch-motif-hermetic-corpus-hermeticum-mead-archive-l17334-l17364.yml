canonical_text:
  quote: "“Both, then, seem boundless, both eternal.”"
  summary: 'The passage describes an unnamed supreme reality as beyond appraisal,
    support, tracking, location, time, origin, manner, and definition. It says this
    reality is upheld by supreme stability in itself, and may be called God, Eternity,
    or both. It then relates Eternity and Time: Eternity transcends the bounds of
    Time, while Time, since it cannot be bounded by number, change, or a secondary
    revolution, is said to share the nature of Eternity. Both are described as boundless
    and eternal, and stability is given chief place because it sustains things in
    motion.'
