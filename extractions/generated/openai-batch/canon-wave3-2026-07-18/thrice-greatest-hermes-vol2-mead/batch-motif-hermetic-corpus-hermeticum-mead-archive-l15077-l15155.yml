canonical_text:
  quote: For man is the sole animal that is twofold.
  summary: In dialogue, Asclepius asks whether all human senses are the same and why
    man is placed in the world rather than in the divine realm. The Thrice-greatest
    replies that not all attain true reason, describes man as both divine and embodied,
    prays for divine aid in explaining the matter, and begins an account of God making
    a second visible and sensible God.
  language: English
  quote_policy: quoted
