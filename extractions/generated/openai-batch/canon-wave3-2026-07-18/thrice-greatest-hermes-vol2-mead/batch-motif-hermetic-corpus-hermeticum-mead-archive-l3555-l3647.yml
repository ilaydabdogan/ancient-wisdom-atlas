canonical_text:
  quote: ''
  summary: A dialogue in which Hermes explains to Asclepius that motion is caused
    by interior animate principles such as soul or spirit, that lifeless bodies do
    not move lifeless bodies, and that no subsistent thing is void; apparently empty
    vessels are treated as full because air is body.
  language: English
  quote_policy: summarized
