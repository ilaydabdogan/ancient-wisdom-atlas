canonical_text:
  quote: '"God is the Pleroma of Good, and Good is the Pleroma of God."'
  summary: The commentary gathers Pauline, Philonic, and Trismegistic passages around
    the idea of Pleroma or Fullness. It presents God and Good as mutually plenitudinous,
    Christ as head of the Church which is his body and fullness, the soul as filled
    with virtues, and the Cosmos as Son of God, Logos, Image of the Father, wise Breath,
    and Pleroma of Life. It also states that the path to the True Good is balance.
  language: English
  quote_policy: quoted
