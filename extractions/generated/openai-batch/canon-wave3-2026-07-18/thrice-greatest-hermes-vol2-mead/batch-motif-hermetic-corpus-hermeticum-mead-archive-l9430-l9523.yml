canonical_text:
  quote: ''
  summary: The passage quotes a prayer to Thoth asking to be made present in the true
    forms or names of creatures and elements, then cites a description of a mind that
    mingles with elements, reaches sea-depths and heaven, and is not impeded by darkness,
    earth, or water. Mead interprets this as a Hermetic path of identification with
    all life, ascent beyond cosmic boundaries, becoming like God, transcending space
    and time, and realizing all things within oneself as the way to know God.
  language: English
  quote_policy: summarized
