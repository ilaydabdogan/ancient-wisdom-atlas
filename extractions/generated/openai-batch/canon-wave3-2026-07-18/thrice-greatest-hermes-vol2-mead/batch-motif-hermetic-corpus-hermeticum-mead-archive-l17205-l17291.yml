canonical_text:
  quote: Cosmos is [thus] Life-giver unto all that are in it
  summary: The passage presents Cosmos as life-giver and receptacle for things beneath
    the Sun. Cosmos is vivified by Eternity and vivifies its contents according to
    numbers and appointed times. Time is marked on Earth by qualities of air and heat
    or cold, and in Heaven by stellar return. Order and Time renew all things through
    alternation. All generated things are unstable, while God alone is immovable,
    self-contained, and present in all spaces. Eternity is described as immovable
    and as the source and destination of the motions of all times. Cosmos is called
    an image of transcendent Deity and an imitator of Eternity.
  language: English
  quote_policy: quoted
