canonical_text:
  quote: ''
  summary: The passage argues that nothing in the Cosmos is destroyed because the
    Cosmos is an immortal life made by the Father. God is described as eternal Maker;
    Cosmos is described as second God, after the Father's image, sustained and made
    deathless by Him. The Father forms a spherical universal body from matter, sows
    lives into it, encloses them as in a cave, and prevents matter from dissolving
    into its original unorder. Earthly lives experience increase and decrease called
    death, while heavenly bodies preserve order through restoration or cyclic return.
  language: English
  quote_policy: summarized
