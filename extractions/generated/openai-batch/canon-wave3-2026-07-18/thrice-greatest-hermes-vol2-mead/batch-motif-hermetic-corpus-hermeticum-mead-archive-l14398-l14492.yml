canonical_text:
  quote: ''
  summary: The passage discusses a story in which singers direct their song to God
    rather than to a dead Serpent, and a grasshopper fills in for a broken harp string
    in the tale of Eunomus. The commentary treats Clement's version as a naturalistic
    explanation of a Hellenic miracle-story and rejects literary dependence. It then
    comments on divine kingship, the true king's subjects as his children and members
    of his body, and the unity of intelligible beings described through transparency,
    light, and the sun and stars.
  language: English
  quote_policy: summarized
