canonical_text:
  quote: ''
  summary: 'Opening of Corpus Hermeticum XIII/XIV: the heading frames a secret sermon
    on the mountain concerning rebirth and silence, from Hermes to Tat. Tat recalls
    previous riddling teaching, his supplication while going up the mount, and Hermes''
    condition that he become a stranger to the world. Tat says he has made his thought
    a stranger to world-illusion and asks for the tradition of rebirth. Hermes answers
    Tat''s questions about the source of Man''s birth by identifying understanding
    Wisdom in silence as matter and womb, the True Good as seed, and the Will of God
    as sower.'
  language: English
  quote_policy: summarized
