canonical_text:
  quote: ''
  summary: 'Commentary on The Perfect Sermon discusses the possible communal status
    of Ammon, possible points of contact with Corpus Hermeticum X, and doctrinal themes:
    the Will of God, Aeon/Eternity, Cosmos, Spirit, Matter, Sense, Reason, and a possible
    Egyptian background for Spirit as Divine Breath.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentator suggests Ammon may represent a grade within a select ascetic
    community rather than a king, while Asclepius and Tat may be the referents of
    a final plural “we.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary reports points of contact between the sermon and Corpus Hermeticum
    X (XI), “The Key,” addressed to Tat, but says the cited references do not show
    literal dependence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Will of God is described as heavily emphasized, almost personified, and
    central to Trismegistic religio-philosophy.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Will of God is said to be identified with the Goodness and Nature of God.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: God and Aeon are described as sources of all things, and Aeon is described
    as the Eternity of God and the Fullness of all things.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Will of God is said to correspond to Aeon or Pleroma, Wisdom, Energy,
    and the Spouse of the Supreme.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Will rules Cosmos with Law and Holy Reason, while Fate and Necessity are
    described as instruments of the Divine Will.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spirit is described as both Cosmic Life and individual life, and the sermon
    is said to make frequent use of the terms Spirit and Sense.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Spirit and Matter, or the Nature of the Cosmos, are described as Positive
    and Negative, or Masculine and Feminine, energies of the Divine.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Spirit is described as ruler of all things in Cosmos or Nature, the immediate
    instrument of the Will of God, and loosely identified with that Will.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Spirit is said to be symbolized by Heaven, while the Sensible Cosmos is said
    to be symbolized by Earth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The doctrine of Spirit as Divine Breath is described as probably Egyptian
    and not owing to immediate Semitic influence.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Sense is described as apparently superior to Reason in some way, and this
    is linked by the commentator to an Egyptian point of view.
  category: relationship
  evidence_refs:
  - ev:9
