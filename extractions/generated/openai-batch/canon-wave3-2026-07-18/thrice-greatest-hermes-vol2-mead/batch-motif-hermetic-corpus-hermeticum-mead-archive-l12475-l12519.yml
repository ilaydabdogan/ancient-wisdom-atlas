  summary: The speaker says he will briefly restate the chief points of prior teaching
    in a more mystical way for an advanced recipient. He argues that manifest, made
    things do not make themselves but are made by another, and therefore there is
    an unmade maker more ancient than all made things. This maker is described as
    supreme, one, only, truly wise, ruler over the features and continuity of making,
    and invisible.
