canonical_text:
  quote: ''
  summary: Asclepius asks why philosophy is made difficult. Trismegistus answers that
    it is obscured by mixing it with subtle expositions and difficult sciences. He
    presents pure philosophy as dependent on godly piety, using other arts only to
    appreciate cosmic measures and to worship the Art and Mind of God. He defines
    true music as knowledge of cosmic order and harmony with God's Song, warns that
    future people will be led astray by sophists, and begins a treatment of God, Matter/Cosmos,
    and Spirit.
  language: English
  quote_policy: summarized
