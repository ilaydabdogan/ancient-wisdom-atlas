  quote: ''
  summary: Editorial commentary compares the doctrine of the Letter of Hermes to Asclepius
    with “Mind unto Hermes,” especially on divine self-working and divine power. It
    then compares the “Good Husbandman” image with an invocation naming Good Husbandman,
    Good Daimon, Harpocrates, and Chnouphis, with alchemical passages about a Husbandman
    who teaches the relation between sowing and reaping, and with a Zosimus passage
    citing Hermes on Achaab the Husbandman.
