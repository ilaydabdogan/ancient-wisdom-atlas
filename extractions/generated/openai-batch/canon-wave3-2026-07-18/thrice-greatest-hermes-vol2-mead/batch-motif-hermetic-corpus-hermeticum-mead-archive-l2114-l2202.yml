canonical_text:
  quote: ''
  summary: 'The passage describes a Hermetic cosmogonic sequence: within a World-Egg
    bounded by a Mighty-Power identified as the Gnostic Horos, the Logos descends
    into disordered primal elements, Fire and Air ascend, Mind emanates as Light and
    Life and as an Enforming Mind or Demiurge, seven ruling spheres are differentiated
    as a fate-bearing engine of soul-formation, and Nature begins physical formation.
    The passage emphasizes repeated downward movements followed by upward movements,
    and ends by introducing a Third Outpouring as the descent of Man.'
  language: English
  quote_policy: summarized
