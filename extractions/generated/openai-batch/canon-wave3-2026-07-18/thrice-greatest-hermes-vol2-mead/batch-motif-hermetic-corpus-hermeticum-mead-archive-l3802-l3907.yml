canonical_text:
  quote: ''
  summary: The commentary discusses the uncertain title and possibly lost introduction
    of a Hermetic treatise addressed to Asclepius, then summarizes its subject as
    the Plenum or Fullness of Being. It distinguishes Space from God, describes God
    as the cause of Space, connects the phrase “He who stands” with Philo and Gnostic
    tradition, explains Reason/Logos as a stable and ordering principle, and states
    that the World-Soul is in perpetual motion while bodies are inert and moved by
    soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary says the treatise has no precise title and that the traditional
    title naming Tat cannot apply to a tractate addressed to Asclepius.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary concludes that the beginning may have been lost, including
    a general sermon to Tat and an introduction to the treatise addressed to Asclepius.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary identifies the subject as the Fullness of Being or Plenum of
    things and states that Space is a Plenum.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Asclepius is warned not to confuse Space with God, because God is described
    as the cause of Space rather than Space itself.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commentary quotes the principle that all that is moved is moved in what
    is stable, and links the phrase “He who stands” with Philo and Gnostic, especially
    Simonian, tradition.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary describes an aspect of Reason that holds and compacts all things
    together, an opposite aspect called the Separator or Divider, and says that the
    two together form the Cross of Manifestation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The World-Soul is described as being in perpetual motion, and Reason is said
