canonical_text:
  quote: ''
  summary: The passage instructs a praise-singer to begin with the highest King, identified
    as God, and then descend in ordered praise to earthly kings who hold sceptral
    power after divine likeness. God is described as deathless, everlasting, first
    victor, and the source from whom victories descend. Human kings are portrayed
    as presidents of common welfare and peace whose lordship, prizes, and trophies
    are established by God before conflict. The discourse then turns back to its beginning
    by blessing the Better One and compares this return to the Sun gathering first-fruits
    with its rays, after which the speaker describes receiving a stream of wisdom
    and directing it toward the garden of souls.
  language: English
  quote_policy: summarized
