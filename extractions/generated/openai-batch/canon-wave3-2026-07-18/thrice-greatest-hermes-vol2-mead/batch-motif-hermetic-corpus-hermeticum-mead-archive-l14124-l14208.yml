canonical_text:
  quote: "“train these [streams] of blessing back again unto their source”"
  summary: The passage urges humans to return blessings and praise to God, described
    as the all-pure Father of souls. It compares human inadequacy in praising God
    to new-born babes thanking their father, then applies the same pattern to praise
    of the King. It also describes Gnosis as distributing life and the power to bless
    God, and says God sends tidings to the lower world urging praise that brings humans
    home again.
