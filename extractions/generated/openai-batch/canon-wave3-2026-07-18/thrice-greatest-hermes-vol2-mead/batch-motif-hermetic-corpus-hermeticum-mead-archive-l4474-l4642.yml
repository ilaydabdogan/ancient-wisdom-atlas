canonical_text:
  quote: ''
  summary: Hermes teaches Tat that the World-maker created the world by Reason, sent
    man to Earth, distributed Reason to all, and set Mind as a prize for souls. God
    filled a mighty Cup with Mind and sent it with a Herald proclaiming baptism in
    the Cup. Those who receive Mind gain Gnosis, release from Death's bonds, vision
    of the Good, and movement toward the One; those who lack Mind remain attached
    to bodily pleasures. Tat asks to be baptized, and Hermes says one must choose
    between perishing bodily things and divine bodiless things.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The World-maker is said to have made the universal World with Reason rather
    than with hands, and is described as everywhere, ever-being, author of all things,
    one and only, creating by will.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The divine Body is described as untouchable, invisible, immeasurable, inextensible,
    unlike other frames, and not identical with fire, water, air, or breath, though
    all come from it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: God is said to have sent down to Earth man, called a cosmos of the divine
    frame and a life both deathless and mortal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Man is said to excel other living beings by Reason and Mind, to contemplate
    God's works, to marvel, and to strive to know their Author.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Reason is distributed among all men, while Mind is not distributed to all
    but is set up in the midst for souls as a prize.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: God fills a mighty Cup with Mind, sends it down, joins a Herald to it, and
    commands the Herald to proclaim baptism in the Cup to human hearts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those who understand the Herald's tidings and douse themselves in Mind become
    partakers in Gnosis, receive Mind, and are called perfect men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those who do not understand the tidings possess Reason only, lack Mind, are
    ignorant of why and whereby they came into being, and center thought on bodily
    pleasures and appetites.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Those who receive a portion of God's gift are said to win release from Death's
    bonds, embrace earth, heaven, and what may be above heaven in their Mind, sight
    the Good, and speed toward the One and Only One.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tat asks to be baptized; Hermes answers that one must hate the Body to love
    the Self and that a person cannot give himself both to perishing bodily things
    and to divine bodiless things.
  category: speech
  evidence_refs:
  - ev:8
