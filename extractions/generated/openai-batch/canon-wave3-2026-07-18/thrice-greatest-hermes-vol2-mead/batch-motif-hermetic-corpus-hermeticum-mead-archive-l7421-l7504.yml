canonical_text:
  quote: the fight of piety is to know God and to do wrong to no man
  summary: The passage describes mind as a builder using fire, distinguishes the Mind
    of all from human mind, and explains different fates of pious and impious human
    souls. A pious soul freed from the body and having practiced piety becomes mind.
    An impious soul remains in its own essence, is chastised by lack of piety and
    by its own sins, seeks an earthy human body, and is not permitted to enter an
    irrational body. Hermes tells Tat that mind becoming a daimon takes a fiery body
    to execute divine service and scourges the impious soul.
  language: English
  quote_policy: quoted
