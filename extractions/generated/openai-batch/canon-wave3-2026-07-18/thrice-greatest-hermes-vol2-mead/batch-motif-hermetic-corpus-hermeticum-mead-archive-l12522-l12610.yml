canonical_text:
  quote: For all things are [these] twain, Maker and made
  summary: A letter attributed to Hermes to Asolepius teaches that the divine Maker
    is unseen because He continually makes. The passage urges the addressee to comprehend
    and marvel at Him as true Sire, and names Him God, Maker, and Father according
    to Power, Energy, and Good. It reduces all things to the two terms Maker and made,
    denies any middle or third term, and states that the Maker and made cannot be
    separated.
