canonical_text:
  quote: ''
  summary: The passage distinguishes a bodiless cosmos discerned by mind from the
    sensible cosmos that contains sensible things. It states that all things depend
    on God, who is all goodness, fitness, wisdom, and the source of existence. Asclepius
    is instructed to understand and give thanks, while True Reason teaches that things
    in the cosmos are wrapped by a Higher Cosmos. The passage then describes classes
    of living things, their images or forms, individual differentiation within a class,
    and the divine bodiless idea grasped by mind.
  language: English
  quote_policy: summarized
