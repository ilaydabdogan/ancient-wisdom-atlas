canonical_text:
  quote: ''
  summary: The passage discusses primal pre-cosmic elements, a comparison with Sethian/Ophite
    Gnostic material, the symbol of Seth or Darkness as a Great Serpent, Light as
    child of a supreme Trinity and as Cosmic Christ in a later Jewish-Christian framing,
    the Light's fashioning of inchoate substance into cosmos, the descent of a Holy
    Word or Logos into dark-moist-fiery Nature, the ordering of chaotic elements,
    and the Shepherd's explanation that Light is Mind and Mind is God, leading toward
    revelation of the Pleroma.
  language: English
  quote_policy: summarized
