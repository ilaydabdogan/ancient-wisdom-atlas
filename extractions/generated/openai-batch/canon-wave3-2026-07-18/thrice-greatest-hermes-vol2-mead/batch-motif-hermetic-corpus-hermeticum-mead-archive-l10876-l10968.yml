canonical_text:
  quote: "“Father, I see the All, I see myself in Mind.”"
  summary: In a dialogue between Hermes and Tat, Hermes explains a dwelling-place
    or tent associated with the human soul, the Twelve, the Ten Powers, and the relation
    of One and Ten. Tat reports seeing the All and himself in Mind, which Hermes identifies
    as Rebirth beyond bodily viewpoint. Hermes distinguishes the dissolvable natural
    body from an essential birth untouched by death, says Tat has been born a god
    and Son of the One, and speaks of a hymn heard at the Eight/Ogdoad of Powers,
    foretold by the Shepherd. Tat is described as pure and ready to “strike” or loosen
    the tent.
  language: English
  quote_policy: quoted
