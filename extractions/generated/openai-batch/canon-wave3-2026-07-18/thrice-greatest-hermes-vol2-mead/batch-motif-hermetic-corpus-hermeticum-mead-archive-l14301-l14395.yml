  summary: The passage is a commentary section on the Encomium of Kings. It presents
    the Encomium as an appended eulogy or apology meant to reassure imperial rulers
    and inculcate loyalty, discusses uncertain date and addressees, and introduces
    a comparison with Clement of Alexandria’s account of Eunomus the Locrian, the
    Pythic grasshopper, and a Greek assembly at Pytho celebrating the Death of the
    Serpent.
