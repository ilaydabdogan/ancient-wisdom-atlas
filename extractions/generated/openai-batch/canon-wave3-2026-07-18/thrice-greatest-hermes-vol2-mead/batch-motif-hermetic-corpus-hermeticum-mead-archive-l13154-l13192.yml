canonical_text:
  quote: ''
  summary: The passage states that error, necessity, fate, and ignorance are not punishable
    among the Gods, while impiety alone is guilty. It then describes the Sun as preserver
    and nurse of every class, analogous to the Intelligible World embracing and filling
    the Sensible World. The Sun gives births to all, strengthens them, and receives
    them again when they fail. Beneath the Sun are numerous choirs of daimons, ranked
    under groups of Stars and serving each Star, with activities described as good
    and bad.
