canonical_text:
  quote: ''
  summary: The passage presents a Hermetic dialogue in which Asclepius asks whether
    Trismegistus means statues. Trismegistus describes statues as ensouled, spirit-filled,
    prophetic, and capable of affecting human suffering. He then calls Egypt the image
    of Heaven and shrine of the world, and foretells a future when divinity leaves
    Earth for Heaven, Egypt is bereft of the gods, foreigners occupy the land, cults
    are proscribed, holy places are filled with tombs and corpses, and only tales
    and stone inscriptions remain of Egyptian piety.
  language: English
  quote_policy: summarized
