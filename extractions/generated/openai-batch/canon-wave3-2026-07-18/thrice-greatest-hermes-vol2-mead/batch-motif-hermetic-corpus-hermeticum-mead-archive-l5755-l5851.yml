  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hermes is reported as declaring to Asclepius that the things people call good
    and beautiful cannot be fled or hated, because people need them and cannot live
    without them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The commentary contrasts this statement with a formal Tat-teaching about hating
