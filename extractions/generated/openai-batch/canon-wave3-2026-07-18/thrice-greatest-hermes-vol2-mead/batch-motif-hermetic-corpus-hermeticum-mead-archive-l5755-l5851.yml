  summary: Commentary on the Hermetic sermon commonly headed from its opening proposition.
    The passage classifies the sermon with the Asclepius group, discusses whether
    its apparent dualism is literal or formal, contrasts statements about cosmos,
    earth, evil, body, and the Good across Hermetic tractates, and compares the theological
    use of “cosmos/world” with Christian and Oxyrhynchus material.
  language: English with Greek quotations
  quote_policy: summarized
