canonical_text:
  quote: ''
  summary: Mead's commentary describes an inner, non-physical change called the Birth
    of a Christ or Birth in God. Tat, prepared by his master, begins to lose ordinary
    bodily perception and is instructed toward inward inversion, spiritual senses,
    and the perception of all things within himself. The passage contrasts the Author
    or Genesiurge of Re-birth, identified with the One Man or Logos, with the Demiurge
    of ordinary birth, and discusses Greatness, Aeon, the One Element, and the One
    Sense. It also includes explicit comparisons to the Acts of John, Christian Gnostic
    terminology, and an Egyptian Papyrus Lisinger passage on the Greatness of God.
  language: English
  quote_policy: summarized
