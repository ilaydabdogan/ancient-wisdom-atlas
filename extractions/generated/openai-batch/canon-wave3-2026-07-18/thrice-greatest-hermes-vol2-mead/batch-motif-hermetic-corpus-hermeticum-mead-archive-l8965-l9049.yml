canonical_text:
  quote: ''
  summary: Mind addresses Hermes and explains that the Cosmos changes through concealment,
    revolution, conversion, and renovation without being dissolved. The speaker reasons
    about the maker of the all-formed Cosmos, describing God as having an unseen bodiless
    idea that manifests all ideas through bodies. The passage uses an image of mountain-tops
    in pictures to explain bodiless form, then states that God’s doing good is like
    divine life and motion, moving and enlivening all things. It concludes that all
    things are in God non-spatially, and that the bodiless is most comprehensive,
    swift, and potent.
  language: English
  quote_policy: summarized
