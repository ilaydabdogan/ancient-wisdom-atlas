canonical_text:
  quote: "“In God alone, is, therefore. Good, or rather Good is God Himself.”"
  summary: The passage argues that God alone is truly Good because God lacks passions
    and has no superior, peer, or rival. Generated beings, the cosmos, matter, human
    beings, and material bodies are passible or mixed with bad, so any good in them
    is partial, impure, or only nominal.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that nothing is superior to God, equal to God, resistant
    to God, or wiser than God in a way that would cause subjection, wrong, anger,
    love, or envy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage concludes that, since those conditions are absent from God's being,
    only Good remains in God.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: The passage says that what is not God includes other things, both little and
    great, and includes the cosmos described as a greater and mightiest living one.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Things subject to birth are said to abound in passions, and birth itself is
    described as passible.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states a mutual exclusion between passion and Good, illustrated
    by the mutual exclusion of day and night.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Good can never be in genesis, but only in the ingenerate.
  category: relationship
  evidence_refs:
