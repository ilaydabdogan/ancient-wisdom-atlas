canonical_text:
  quote: "“make all things, and make them back into itself again”"
  summary: The passage describes Cosmos as the organ of God's will, receiving seeds
    from God, manifesting all things, dissolving them, and renewing them. It explains
    material bodies as composed of earth, water, air, and fire, names God as sire
    of Cosmos and Cosmos as God's son, and states that all things are in God, brought
    into being by God, dependent on God, and that God is all these things himself.
  language: English
  quote_policy: quoted
