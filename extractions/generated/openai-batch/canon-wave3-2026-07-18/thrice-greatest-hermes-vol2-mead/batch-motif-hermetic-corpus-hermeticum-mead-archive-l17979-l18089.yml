canonical_text:
  quote: ''
  summary: In a Hermetic dialogue, Asclepius asks what place Heimarmene, or Fate,
    occupies in the cosmic economy. Trismegistus explains Fate, Necessity, and Order
    as mutually linked principles governing beginnings, ends, temporal arrangement,
    and the perfection of the Cosmos under God's Will, Law, and Holy Reason.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Asclepius asks Trismegistus what part Heimarmene, or Fate, occupies in the
    cosmic economy, and frames the question in relation to celestial and terrene gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trismegistus says Heimarmene, or Fate, is the necessity of all things that
    are born and is bound with interlinked enchainments.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fate is described as possibly the effector of all things, highest God, a second
    God made by God, or the discipline of all things in heaven and on earth established
    by divine laws.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fate and Necessity are said to be bound to one another by inseparable cohesion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fate gives birth to the beginnings of all things, while Necessity compels
    the end of things depending from those beginnings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Order follows Fate and Necessity as their warp-and-woof and as Time's arrangement
    for perfecting things.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Cosmos is said to be made perfect in all things and to be carried in Order,
    or to consist entirely of Order.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fate, Necessity, and Order are said to be immediately effected by God's Will,
    while God rules the Cosmos by Law and Holy Reason.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fate, Necessity, and Order are described as not moved by wrath or favor, but
    as instruments of Eternal Reason's self-compulsion.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A final sequence states that Fate casts in seed and supplies the embryo of
    what is to be, Necessity compels all things to their end, and Order preserves
    the warp-and-woof of what Fate and Necessity arrange.
  category: sequence
  evidence_refs:
  - ev:6
