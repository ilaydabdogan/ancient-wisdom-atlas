canonical_text:
  quote: ''
  summary: The passage states that divine necessity follows God's will, then has the
    speaker address Asclepius on how humans love and worship God, Heaven, and heavenly
    beings. It says humans uniquely perform this worship, that Heaven and its hosts
    delight in human praise, that the Muses' choir was sent by the Highest Deity so
    earthly life would have song and heavenly harmony, and that different humans are
    assigned either contemplation of Heaven through Pure Mind or study of the elements
    according to their embodied condition. It concludes that humanity's two natures
    enable both cultivation of earthly things and love of Heaven.
  language: English
  quote_policy: summarized
