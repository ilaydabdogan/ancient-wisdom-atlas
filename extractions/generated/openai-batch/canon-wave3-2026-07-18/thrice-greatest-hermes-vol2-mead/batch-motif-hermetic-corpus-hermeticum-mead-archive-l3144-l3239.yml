- id: obs:3
  text: The Abercius inscription is said to speak of a Shepherd who feeds a flock,
    has eyes gazing in every direction, and teaches scriptures worthy of belief.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author identifies the all-gazing Shepherd as Hermes treated as a symbol
    of Christ.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Naassene hymn to Attis is cited in which Attis is invoked as Pan, Bacchus,
    and Shepherd of bright stars.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Christian lamp and gem are described as representing Christ as the Good
    Shepherd after the Hermes type, with a lamb on his shoulder.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the lamp and gem image, Seven Planets appear above the shepherd’s head,
    the Sun and Moon appear on either side, and seven lambs gather around his feet.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The same image places Noah’s dove and ark and Jonah being swallowed by a whale
    on the right, and Jonah vomited onto land and resting beneath a miraculous gourd-tree
    on the left.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author interprets the grouping as a symbol of the mysteries and a glyph
