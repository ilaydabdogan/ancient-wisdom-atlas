canonical_text:
  quote: ''
  summary: Mead discusses Good Shepherd symbolism, arguing that Christian Good Shepherd
    art drew on Greek and Hermetic shepherd types. He reads the Shepherd in the Abercius
    inscription as Hermes treated as a symbol of Christ, compares a Naassene hymn
    to Attis as a stellar shepherd, and describes a Christian lamp and gem showing
    Christ as Good Shepherd with planets, Sun, Moon, lambs, Noah imagery, and Jonah’s
    swallowing and return. He interprets the grouping as a mystery glyph of rebirth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Good Shepherd type had roots in a prior tradition
    and that Hermes should be counted among pagan types taken over by rising Christian
    art.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Good Shepherd figure was borrowed from Greek sculpture
    and therefore cannot serve as evidence for earliest ideas about Jesus’ appearance.
  category: relationship
  evidence_refs:
