canonical_text:
  quote: ''
  summary: The commentary describes Ecstasis as a bodily transcendence associated
    with the Spiritual Sun and ancestral Gnosis. It connects the forebears of Hermes
    and Tat with symbolic Greek names, an Egyptian/Nile priesthood, and super-human
    grades reaching celestial dignity. It then cites Lactantius on Uranus, Cronus,
    and Hermes as rare possessors of perfect science, and contrasts this with the
    current treatise and P.S.A. xxxvii.
  language: English
  quote_policy: summarized
