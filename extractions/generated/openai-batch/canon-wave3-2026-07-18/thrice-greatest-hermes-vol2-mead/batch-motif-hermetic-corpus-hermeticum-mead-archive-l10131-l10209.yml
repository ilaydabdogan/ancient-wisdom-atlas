canonical_text:
  quote: God surroundeth all, and permeateth all
  summary: Hermes teaches Tat that God surrounds and permeates all things, that the
    ordered cosmos and its living matter allow contemplation of God, that all energies
    are energized by God, and that God is the All. Matter, body, and essence are described
    as energies of God. The passage concludes that worship of God consists in not
    being bad.
  language: English
