canonical_text:
  quote: ''
  summary: A dialogue explains why the ignorant remain in Darkness and Death, describes
    Darkness, Moist Nature, body, and Water in relation to mortality, and teaches
    that self-knowledge of one's origin in Light and Life enables return to Life.
    Mind is present with holy and pure people, aids their gnosis and devotion to the
    Father, restrains bodily and evil mental operations, and is far from the mindless
    and impious.
  language: English
  quote_policy: summarized
