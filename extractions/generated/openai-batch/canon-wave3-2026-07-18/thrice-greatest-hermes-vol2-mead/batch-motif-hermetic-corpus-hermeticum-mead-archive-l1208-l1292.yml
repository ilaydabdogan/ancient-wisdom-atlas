- id: obs:1
  text: A person is described as staying in Darkness, wandering, and suffering through
    the senses things of Death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The questioner asks what fault the ignorant commit that they should be deprived
    of deathlessness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The teacher asks why those who are in Death merit death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gloomy Darkness is called the root and base of the material frame; Moist Nature
    comes from Darkness; the body in the sense-world is composed from Moist Nature;
    Death drains the Water from the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Father of the universals is said to consist of Light and Life, and Man
    is said to have been born from Him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a person learns that they are of Life and Light and only happen to be outside
