canonical_text:
  quote: ''
  summary: The passage presents a hierarchy of God, Aion or Eternity, Cosmos, divine
    Sense, Cosmic Sense, and human higher sense. It states that God and Aion are principals,
    while the moveable Cosmos is not. Cosmic Sense contains sensible things, species,
    and sciences. Human higher sense is linked to memory and recollection, through
    which man is made ruler of the earth. Knowledge of Nature is obtained through
    Cosmic Sense and the sensible Cosmos, but the true Whatness of the Sense of Supreme
    God is identified with Truth, of which the Cosmos offers no discernible trace
    because temporal existence contains untruths, births and deaths, and errors.
  language: English
  quote_policy: summarized
