canonical_text:
  quote: "“there are two images of God — Cosmos and man.”"
  summary: 'The speaker instructs Asclepius to grasp a difficult Reason concerning
    God, Cosmos, and man. God is described as first, Cosmos second, and man third.
    God makes and rules the Cosmos; man is ruler of the compound thing and has a dual
    nature: divine in soul, sense, spirit, and reason, yet mortal and earthbound in
    his elemental cosmic part. Man knows himself and the world, reveres God’s image,
    and is said to share piety as the chief capacity of his dual nature.'
  language: English
  quote_policy: quoted
