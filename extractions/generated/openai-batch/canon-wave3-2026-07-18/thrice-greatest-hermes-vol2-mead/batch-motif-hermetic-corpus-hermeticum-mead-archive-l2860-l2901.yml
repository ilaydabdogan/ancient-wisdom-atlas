canonical_text:
  quote: ''
  summary: The passage is Mead's commentary on Poemandres. It compares appeals to
    'earth-born folk' with Sibylline diction and a sunset prayer with Essene and Therapeut
    prayers; distinguishes Poemandrist Gnosis and Saving Faith from Hebrew tradition
    while noting shared materials with Jewish and Christian mystics; describes rival
    traditions at Christianity's birth offering Gnosis and salvation; and summarizes
    the treatise's continuation in the spiritual awakening of a new-born disciple,
    who reaches the Plain of Truth and is described in Christian terms as having Christ
    born in the heart. It then introduces the concluding hymn of praise and prayer
    for Gnosis.
  language: English
  quote_policy: summarized
