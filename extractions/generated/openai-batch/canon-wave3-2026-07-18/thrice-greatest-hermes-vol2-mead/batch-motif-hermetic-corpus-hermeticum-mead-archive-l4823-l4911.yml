canonical_text:
  quote: ''
  summary: Mead comments on the Hermetic treatise called “The Cup or Monad,” linking
    it with “The Mind to Hermes.” He summarizes a doctrine in which Reason and Mind
    form the cosmos, humanity is called to contemplate God’s works and rise to God-knowledge,
    and the initiate undergoes a “Christ-Baptism” by plunging into a Mind-filled Cup
    identified with the Body of God. The commentary then cautiously speculates about
    connections between this Cup of Initiation, the Mystic Eucharist, and later Grail
    tradition, quoting Wagner’s vision of an angelic host bearing the holy vessel.
    It closes by contrasting this vision with the Gnostic seers’ direct plunge into
    the Cup, described as the Ocean of Divine Love and Wisdom.
  language: English
  quote_policy: summarized
