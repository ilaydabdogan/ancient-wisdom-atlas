canonical_text:
  quote: ''
  summary: 'The passage presents a cosmological teaching: the Cosmos is formed from
    Fire, Water, Earth, and Air, while Cosmos, Soul, and God are each described as
    one. The speaker asks the listener for total attention to know the Reason of Divinity,
    which is compared to a swift torrent from above. Heaven is called God Sensible
    and director of bodies; Sun and Moon govern bodily increase and decrease. God
    is named ruler and maker of all, and a flood of all things is said to stream through
    Cosmos and Soul. The Cosmos is described as a receptacle of forms, extended to
    Heaven through the four elements, and things dependent from Above are said to
    be subdivided into species.'
  language: English
  quote_policy: summarized
