canonical_text:
  quote: '"The Gnosis of the Good is holy silence"'
  summary: The passage comments on Hermetic apotheosis. It describes ecstasy as the
    fruit of meditation or contemplation, explains the Gnosis of the Good as holy
    silence and suspension of the senses, and uses womb and seed imagery for the birth
    of the true man. It then says an embodied soul may be made like God by contemplating
    the Beauty of the Good, identified with Cosmic Order. A further section describes
    the soul as capable of transformation into every likeness, as a separated soul
    in perpetual pilgrimage on a wheel of transformation, and compares this with Naassene
    and Egyptian material on the soul’s changing forms.
  language: English
  quote_policy: quoted
