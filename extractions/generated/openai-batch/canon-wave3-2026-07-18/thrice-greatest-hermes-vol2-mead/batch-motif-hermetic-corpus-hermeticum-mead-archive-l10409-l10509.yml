  summary: The passage is a commentary section comparing Hermetic material with Valentinian
    Christian Gnosis. It cites a report that Valentinus saw and questioned a newborn
    babe who identified itself as the Logos, quotes a Valentinian Psalm describing
    cosmic dependencies from Spirit through Soul, Air, Aether, Deep, and Womb, discusses
    Hermetic sermons on Fate, Providence, Necessity, and Justice, and closes by presenting
    Matter and Body as Energies of God within a pan-monist doctrine rather than essential
    dualism.
