canonical_text:
  quote: ''
  summary: The passage is Mead's commentary on a Hermetic tractate. It says daimones
    rule the lower energies of the soul, while the higher rational part is set above
    them as a receptacle of God, His Ray, or Mind. It quotes a Valentinian passage
    in which the heart becomes pure after evil essences are expelled, is compared
    while impure to a filthy inn inhabited by daimons, and is sanctified by the Alone
    Good Father so that its possessor sees God. The commentary notes similarity between
    Valentinus and the Hermetic treatises, describes a scheme of dependency as Egyptian,
    and states that God is sire of all while the Sun is Demiurge or Creative Logos,
    not the All-god. It also notes that the treatise is incomplete.
  language: English
  quote_policy: summarized
