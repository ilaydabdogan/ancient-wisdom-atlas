canonical_text:
  quote: ''
  summary: The passage describes an unnamed divine agent operating all things through
    continuous light and life-giving power. The upper light nourishes immortal parts
    of the cosmos, while the downward light vivifies mortal lives in the elemental
    lower realm. Mortal forms undergo spiral transformations and dissolution, while
    immortal bodies do not dissolve. Daimons dwell between mortals and immortals,
    watch human affairs, and enact what the Gods appoint, including requital for human
    impiety through storms, fire, earthquakes, famines, and wars. The passage ends
    by assigning benefits to the Gods, worship or piety to humans, and requital to
    daimons.
  language: English
