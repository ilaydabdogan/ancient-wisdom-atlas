canonical_text:
  quote: ''
  summary: 'The commentary explains the title term “secret” by discussing sacred sayings,
    logoi, and logia as guarded deposits, testaments, and withdrawn writings across
    several ancient contexts. It then identifies three stages of probation before
    Tat is fit to hear the Sermon on Rebirth: preliminary General Sermons, becoming
    Hermes’ suppliant, and dialogue in which questions may be asked.'
  language: English
  quote_policy: summarized
