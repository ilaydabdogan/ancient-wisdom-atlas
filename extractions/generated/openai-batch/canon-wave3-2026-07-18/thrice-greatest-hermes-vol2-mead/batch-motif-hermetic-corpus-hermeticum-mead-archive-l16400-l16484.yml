canonical_text:
  quote: ''
  summary: 'The passage describes a kinship and reciprocal relation between humans
    and gods: pious humans revere the gods, and the gods guard human things. Hermes/Trismegistus
    teaches Asclepius that the Highest God creates the gods in heaven, while humans
    make gods in temples, gods who can be approached, receive and emit light, and
    are confirmed on earth by humans. Asclepius expresses amazement. The passage contrasts
    heavenly gods with gods constructed by humankind, describing the latter as fashioned
    from both a more ancient divine nature and a human-associated nature, configured
    in a whole bodily form.'
  language: English
  quote_policy: summarized
