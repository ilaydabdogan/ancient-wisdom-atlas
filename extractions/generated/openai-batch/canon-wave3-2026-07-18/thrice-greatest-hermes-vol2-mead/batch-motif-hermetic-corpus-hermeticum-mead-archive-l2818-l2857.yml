canonical_text:
  quote: ''
  summary: The passage characterizes an earlier mode of Hermetic instruction as intimate,
    secret, intended for a few, and associated with probation and a select philosophical
    community. It then describes a shift in §27 to a public propagandist appeal, in
    which a man seeks to communicate the existence and saving power of the teaching
    to all. The author describes this appeal as a call to repentance with a Hebrew
    or prophetical atmosphere, and cautiously conjectures that Jewish and nascent
    Christian preaching may have contributed to this public phase, while noting that
    the historical evidence is obscure.
