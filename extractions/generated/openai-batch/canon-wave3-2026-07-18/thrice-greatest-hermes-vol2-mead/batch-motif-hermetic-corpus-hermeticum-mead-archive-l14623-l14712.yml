  summary: The passage frames a restricted sacred discourse in which Ammon is summoned
    to a holy place and a reverent group attends Hermes. Hermes teaches Asclepius
    that every human soul is deathless but not all in the same way. He then expounds
    the unity of All and One in the Creator, followed by a cosmological account of
    descent from heaven, upward life-giving fire, earth as receiver and restorer,
    and the Whole as manifold yet unified under Soul and World.
