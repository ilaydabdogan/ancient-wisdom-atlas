canonical_text:
  quote: without e'en quitting earth, he doth ascend above.
  summary: 'The passage describes Mind as leaving a sluggish soul bound to the body.
    It defines true man as a divine living being comparable or superior to the gods.
    Unlike gods, who do not cross heaven''s limit to earth, man can mount to heaven,
    measure and know it, and ascend above without leaving earth. It then states a
    reciprocal formula: man on earth is a mortal god, while god in heaven is an immortal
    man; all things are dispensed through Cosmos and Man, but by the One.'
  language: English
  quote_policy: quoted
