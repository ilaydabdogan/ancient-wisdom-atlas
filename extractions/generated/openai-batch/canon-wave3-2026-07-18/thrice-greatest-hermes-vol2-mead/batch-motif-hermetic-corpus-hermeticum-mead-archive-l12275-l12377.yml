canonical_text:
  quote: ''
  summary: Commentary on the Secret Hymnody emphasizes silence as the condition for
    hearing the hymn, identifies the hymn as addressed to the Spiritual Sun or All-seeing
    Light, interprets selected hymn lines as cosmic outbreathing through Logos and
    inbreathing through Man, and compares its language with Naassene, internal Hermetic,
    and New Testament passages.
