    divine Will and to the divine goes the All.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The commentary says the outbreathing of the Universe through Reason or Logos
    manifests the Will of God, and assigns the labels Son to Logos, Mother to Will,
    and Father to God.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentary says the inbreathing of the Universe is through Man, who cries
    to the divine to take back the All, and that this is accomplished first by sacrificing
    limited human reason to the Great Reason of things.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that the All or Universe is not other than God but is all
