  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that Later Pythagoreans kept silence regarding the Divine
    Service or Gnosis and heard divine, unspeakable things within them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Hymn must be heard in silence and that earthly
    sounds must be stilled for Heavenly Harmony to be heard.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage notes that four of five manuscripts place the indication “Logos
    IV” after the title “Secret Hymnody.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies the hymn as a hymn to the Sun, specifically the Spiritual
    Sun rather than the physical sun, and says its orisons address the Eye of Mind
    and the All-seeing Light.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes the eulogy as a potent theurgic praise-giving and says
    all nature is to thrill with thankfulness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
