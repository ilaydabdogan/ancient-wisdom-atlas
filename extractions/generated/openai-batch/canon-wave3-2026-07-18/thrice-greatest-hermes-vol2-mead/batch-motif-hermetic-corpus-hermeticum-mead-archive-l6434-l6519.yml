canonical_text:
  quote: ''
  summary: The passage contrasts works attributed to evil daimones with the few good
    seeds of God, identified as virtue, self-control, and devotion. It describes God-gnosis,
    the social rejection of Gnostics, the earthly place of badness, the devotee’s
    transformation of bad things through Gnosis, and a distinction between material
    and substantial humans. It also states that God makes all things ultimately like
    himself, while the Cosmic Course befouls or cleanses becomings, and Cosmos has
    its own sense-and-thought.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
