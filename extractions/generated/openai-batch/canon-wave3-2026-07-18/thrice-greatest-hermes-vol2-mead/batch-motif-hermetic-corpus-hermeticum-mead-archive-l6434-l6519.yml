    and casting down precipices as works of evil daimones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seeds of God are described as few, vast, fair, good, and named as virtue,
    self-control, and devotion.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Devotion is identified as God-gnosis; the one who knows God is filled with
    good things and thinks godly thoughts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Those who are Gnostic are said not to please the many; they are considered
    mad, mocked, hated, despised, and sometimes killed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bad is said to dwell on earth, which is its proper place, and not in Cosmos.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The devotee of God bears with all things after sensing Gnosis, refers all
    things to Gnosis, and is said to make bad things good.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker returns to the Discourse on Sense and says that sense shares with
