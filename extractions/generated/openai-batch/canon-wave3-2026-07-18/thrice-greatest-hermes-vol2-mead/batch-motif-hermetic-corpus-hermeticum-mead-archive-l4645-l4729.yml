canonical_text:
  quote: ''
  summary: The passage contrasts choosing the Better with choosing the Worse, assigns
    responsibility for evil to human preference rather than to God, and describes
    a path through bodies, daimones, and star-courses toward the One and Only God.
    It presents the Good as boundless, bodiless, invisible, and known through Gnosis,
    urges return to the Old Old Path, and describes Oneness as the Source and Root
    of all.
  language: English
  quote_policy: summarized
