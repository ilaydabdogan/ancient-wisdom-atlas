canonical_text:
  quote: ''
  summary: The passage says that those who gain Gnosis are to be made one with God,
    and the speaker is charged to show the worthy the way so mortal kind may be saved.
    Man-Shepherd then mingles with the Powers. The narrator gives thanks to the Father
    of the universal Powers, is freed and filled with power and teaching, and begins
    preaching Devotion and Gnosis to earth-born people described as drunk, asleep,
    and ignorant of God. The hearers come together. Editorial notes cite parallels
    in K.K. 25 and in a saying attributed to Jesus from an early Greek papyrus.
  language: English
  quote_policy: summarized
