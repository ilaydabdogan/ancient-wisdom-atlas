canonical_text:
  quote: "“Now gaze through Me upon the Cosmos that's now subject to thy sight.”"
  summary: Mind instructs Hermes to contemplate the cosmos as a beautiful, perfected,
    ever-youthful body. The passage describes the Maker/God as active in all made
    things and ruler of the seven world-orderings; the seven worlds are ordered by
    Aeon; light arises through the blending of contraries by divine energy; the Moon
    and Earth have ordered cosmic functions; and all things are filled and moved by
    Soul while subject to Genesis.
