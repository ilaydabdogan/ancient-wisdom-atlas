canonical_text:
  quote: ''
  summary: A commentary on the Hermetic treatise called the “Sacred Sermon” says the
    text is corrupt but may be complete; interprets the title as marking a doctrinal
    foundation comparable in function to Orphic and Pythagorean sacred sermons; describes
    the treatise as a simplified summary of the Shepherd cosmogony; notes a contrary
    scholarly view that it may be prophetic preaching transferred to Hermes; and introduces
    a “Trinity” section as a formal theological proem before cosmogenesis.
  language: English
  quote_policy: summarized
