canonical_text:
  quote: ''
  summary: The passage identifies Hermes as a mind illuminated by Mind, explains the
    impious soul's self-scourging through its own sins and the Christ's scourge as
    the soul's realization and suffering of prior misdeeds, describes the universe
    as interlinked grades of being from God through Cosmos to Man, and presents sacred
    marriage, divine Fullness, and illumination by Mind or Spirit as making the true
    Gnostic or true man godlike and even God. Souls empty of God and Mind are described
    as deficient and not truly men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hermes is described as no single man but as a mind illuminated by the Mind.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The impious soul is said to be scourged with its own sins and plunged in murders,
    outrage, blasphemy, violence, and other wrongs against mankind.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Christ's scourge is said to drive the unworthy out of His Temple, and
    the passage explains this as the soul being made to realize or suffer consequences
    of prior misdeeds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Light of Gnosis is said to contrast with the darkness or ignorance of
    the soul's past actions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dispensation of the universe is described as interlinking grades of being
    from God downwards and as intercourse or communion of souls.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: God, Cosmos, and Man are described as grades of being, each compared to a
    sun with powers or rays.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The rays of God are described as divine energies or self-realizing operations;
    the rays of Cosmos as the natures of things; and the rays of Man as the arts and
    sciences.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Communion of higher and lower natures is said to be realized by man through
    the consummation of the sacred marriage, by which man becomes a god and finally
    God.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The blessed one is identified as the true Gnostic filled with God and consecrated
    by the Fullness or Pleroma.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The soul empty of God is said to be deprived of Fullness and Mind and to be
    in a state called Emptiness or Insufficiency.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hermes says that such souls should not be called men, while a true man is
