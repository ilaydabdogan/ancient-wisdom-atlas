canonical_text:
  quote: '"the Demiurge — I mean the Sun — eternally doth order Heaven and Earth"'
  summary: The passage presents a cosmological definition in which visible natures
    such as Fire, Water, and Earth depend from one Root. Earth or matter is described
    as a treasury that sends forth abundance and receives subsistence from above.
    The Sun is identified with the Demiurge who orders Heaven and Earth, pours down
    Essence, takes up Matter, extends energies through all cosmic levels, and stands
    in the midst of the Cosmos like a charioteer restraining a cosmic team by reins
    named Life, Soul, Spirit, Deathlessness, and Genesis.
