canonical_text:
  quote: ''
  summary: In a dialogue with the King, Asclepius argues that some things connected
    with bodies are bodiless, using mirror appearances and forms as examples. He describes
    reciprocal reflections between bodies and bodiless things, identified with the
    Sensible and Intelligible Worlds, and instructs the King to worship images because
    their forms come from the Intelligible World. The King ends the session to attend
    to guests and says the sacred conversation will resume the next day.
