canonical_text:
  quote: ''
  summary: The passage comments on traditions about Egyptian sacred language, Thoth-Hermes,
    secret writings, and King Ammon. It connects Philo of Byblus's account of Sanchuniathon
    and the Books of Taautos with another tradition reported by Jamblichus in which
    Hermes taught a path to God and Bitys translated hidden temple inscriptions for
    King Ammon. The commentator emphasizes a recurring pattern of secret Hermetic
    teachings preserved in sacred Egyptian characters in inner temple shrines and
    translated for royal use.
  language: English
  quote_policy: summarized
