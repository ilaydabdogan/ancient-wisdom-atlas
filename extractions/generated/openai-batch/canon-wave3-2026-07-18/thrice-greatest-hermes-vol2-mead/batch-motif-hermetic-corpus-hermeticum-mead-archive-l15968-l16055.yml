canonical_text:
  quote: |-
    For as the World's illumined by the Sun,
    so is the mind of man illumined by that Light
  summary: The passage teaches that only a few minds can receive a great blessing.
    It compares the Sun’s illumination of the world with a greater illumination of
    the human mind by Light. When the Higher Sense is commingled with the human soul,
    their union frees such minds from errors of darkness. Asclepius asks about the
    heads or sources of beginnings, and Trismegistus frames his answer as the disclosure
    of mysteries and divine secrets. He distinguishes many hierarchies of gods into
    Noumenal and Sensible classes and says attentive hearing makes one fit to see
    more truly.
  language: English
  quote_policy: quoted
