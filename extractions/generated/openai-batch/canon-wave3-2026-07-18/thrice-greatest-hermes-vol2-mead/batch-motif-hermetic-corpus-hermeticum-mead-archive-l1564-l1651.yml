canonical_text:
  quote: ''
  summary: The passage explains the figure of the founder as a personification of
    spiritual illumination rather than a historical person. It describes an initiatory
    apocalyptic Vision granted by a Great Initiator or universal Mind, beyond normal
    speech and consciousness. The passage states that seers express the same experience
    differently according to their inherited religious, philosophical, and scientific
    materials, and that apocalyptic literature arises from a personal visionary nucleus
    combined with scriptural, mythical, cosmological, and symbolic materials. It also
    contrasts this process with later claims of fixed verbal inerrancy.
  language: English
  quote_policy: summarized
