canonical_text:
  quote: ''
  summary: 'The passage teaches that dissolution is not annihilation: bodies are restored
    to bodies that do not know death, while sense may be deprived. Man is described
    as the third life, made after the image of the Cosmos and endowed with mind. Tat
    asks whether this life perishes; Hermes tells him to understand God, Cosmos, immortal
    life, and dissoluble life, then states that Cosmos is by and in God, Man is by
    and in Cosmos, and God is the source, limit, and constitution of all things.'
