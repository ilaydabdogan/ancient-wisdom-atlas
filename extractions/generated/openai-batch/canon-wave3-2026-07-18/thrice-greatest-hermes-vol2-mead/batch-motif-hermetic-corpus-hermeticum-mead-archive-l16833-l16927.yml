canonical_text:
  quote: ''
  summary: The passage describes a cosmological ordering beyond Heaven, between Heaven
    and Earth, and over Earth and Sea, with Zeus Above and Zeus Below as rulers. It
    states that divine powers are distributed through existing things and make earth,
    trees, and fruits grow. It then speaks of earthly rulers being gathered in a state
    or community connected with upper Egypt, the setting sun, and the Libyan Hill.
    The final section turns to death, defining ordinary death as dissolution of the
    body and disappearance of bodily sense, and says fear of this death arises from
    ignorance of True Reason.
  language: English
  quote_policy: summarized
