canonical_text:
  quote: ''
  summary: The passage describes Nature receiving the Logos and copying the beautiful
    Cosmos; God-the-Mind bringing forth a Formative Mind, which forms seven rulers
    called Fate; the Logos rejoining the Formative Mind while lower elements become
    reasonless matter; Nature and the elements producing animal life; and All-Father
    Mind bringing forth Man, loving him as child and image, and granting him authority
    to enform.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nature receives the Word or Logos, gazes on the beautiful Cosmos, copies it,
    and makes herself into a cosmos through her own elements and births of souls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: God-the-Mind is described as both male and female and as subsisting as Light
    and Life.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: God-the-Mind brings forth another Mind whose function is to give things form.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Formative Mind is described as a god of Fire and Spirit and forms seven
    rulers who enclose the sensible cosmos; people call their rule Fate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Logos leaps up from the downward elements to Nature's pure formation and
    is at-oned with the Formative Mind, leaving the downward elements reasonless and
    as pure matter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Formative Mind with Reason surrounds the spheres, spins them in a whirl,
    and sets his formations turning in a circulation whose beginning and end meet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nature brings forth reasonless lives from the downward elements; Air produces
    winged things, Water produces swimming things, Earth and Water part, and Earth
    produces four-footed creatures, reptiles, and wild and tame beasts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: All-Father Mind, described as Life and Light, brings forth Man co-equal to
    himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: All-Father Mind loves Man as his own child, identifies him as beautiful beyond
    compare and as the image or form of his sire, and bestows all his formations on
    him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Man gazes on the Enformer's creations in the Father, wishes to enform, receives
    the Father's assent, and changes state to the formative sphere with authority.
  category: sequence
  evidence_refs:
  - ev:7
