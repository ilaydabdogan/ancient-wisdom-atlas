canonical_text:
  quote: The Way Up is the Path of Self-knowledge.
  summary: The passage explains generation through Fate or Harmony under Providence,
    presents Love as the motive power that can bind the lover to matter or turn him
    toward Light, interprets death as dissolution connected with Darkness, and describes
    deathlessness as a path of self-knowledge requiring moral purification. It also
    discusses Mind, the disciple and Master, lower desires, and the obscure Avenging
    Daimon, with a reference to the Platonic Vision of Er.
  language: English
  quote_policy: quoted
