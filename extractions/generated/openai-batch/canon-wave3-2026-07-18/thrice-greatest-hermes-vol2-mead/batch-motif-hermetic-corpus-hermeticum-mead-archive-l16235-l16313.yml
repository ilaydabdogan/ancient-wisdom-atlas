canonical_text:
  quote: ''
  summary: In dialogue with Asclepius, Trismegistus explains that God and all living
    and inanimate things are sexed and fruitful. Nature, Sense, and Cosmos are said
    to possess powers of birth and preservation. The union or unity of either sex
    is called Eros, Aphrodite, or both, and the Universal God of Universal Nature
    is presented as the source of the mystery of bringing forth. The passage describes
    sexual congress as a secret consummation of this mystery and states that the pious
    are few.
  language: English
  quote_policy: summarized
