canonical_text:
  quote: ''
  summary: 'A commentary passage interprets the Poemandres vision: the seeker asks
    how the cosmos came into being and is aware of an unseen Presence speaking mind
    to mind. The answer begins with Boundless Presence becoming joyous Light. Within
    the Light appears Darkness, moving downward in serpent-like folds and becoming
    chaotic moist matter. The passage compares this imagery with Egyptian darkness,
    Greek Rhea, and Sophia-myth language, then describes chaotic sound becoming a
    fiery voice that longs for union with the Cosmic Word. The named primal stages
    are Darkness, Moist Essence, and Fire.'
  language: English
  quote_policy: summarized
