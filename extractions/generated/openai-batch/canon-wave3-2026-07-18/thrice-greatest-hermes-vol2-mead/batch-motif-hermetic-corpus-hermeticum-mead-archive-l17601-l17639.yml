canonical_text:
  quote: ''
  summary: 'The passage gives a philosophical explanation of Space: Space by itself
    is said to lack sense unless specified as the space of some thing, such as water
    or fire. The speaker denies that void space exists in the Cosmos and says Space
    is intelligible only when dimensions such as length, breadth, and depth are added.
    The speaker addresses Asclepius and those with him.'
