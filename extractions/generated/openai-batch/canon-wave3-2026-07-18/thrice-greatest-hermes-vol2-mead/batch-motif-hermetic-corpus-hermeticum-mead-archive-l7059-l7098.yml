canonical_text:
  quote: ''
  summary: Hermes teaches Tat that a human soul can be made like God while still embodied
    by contemplating the Beauty of the Good. He explains that individual souls come
    from the One Soul or All-soul, revolve through the cosmos as if divided off, undergo
    many transformations through forms of life, and that human souls become daimones
    as the first step of deathlessness before circling to the choir of the Inerrant
    Gods.
  language: English
  quote_policy: summarized
