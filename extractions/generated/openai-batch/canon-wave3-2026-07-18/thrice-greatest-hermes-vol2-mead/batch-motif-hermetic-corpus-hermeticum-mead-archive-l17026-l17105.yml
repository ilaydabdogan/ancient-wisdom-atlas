canonical_text:
  quote: all things on Earth must die
  summary: Asclepius asks whether human faults are punished only by human law. Trismegistus
    replies that all earthly embodied beings die and receive rewards or punishments
    according to the merits or demerits of life. Hidden misdeeds receive more severe
    postmortem punishment, with divinity making the offenders fully conscious. Human
    legal execution is contrasted with natural death. The righteous are defended by
    piety and guarded by God, who reveals himself through mind's intelligence, dispelling
    Error and revealing Truth, so that the person mingles with Divine Intelligence
    and gains freedom from the part ruled by Death.
  language: English
  quote_policy: quoted
