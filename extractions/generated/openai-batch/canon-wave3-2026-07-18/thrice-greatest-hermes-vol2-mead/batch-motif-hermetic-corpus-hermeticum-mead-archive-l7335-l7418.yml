canonical_text:
  quote: ''
  summary: In a dialogue between Tat and Hermes, Hermes describes the soul before
    and after embodiment, the forgetfulness caused by bodily involvement, and the
    separation of soul, spirit, and mind at death. The mind, once freed, takes a fiery
    body or robe and traverses space, while the soul is left to judgment and deserved
    chastisement. Hermes explains the layered vestures of mind, soul, and spirit in
    an earth-body, and contrasts earth, fire, and water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The soul is described as beautiful before being befouled by bodily passions
    and as still almost hanging from the Cosmic Soul.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the body grows, it draws the soul into its mass; the soul cuts itself
    off, brings forgetfulness on itself, and this forgetfulness becomes vice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: For those who go out from the body, the soul withdraws into itself, the spirit
    contracts within the blood, and the soul is within the spirit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mind is stripped of its wrappings, takes a fiery body, and traverses every
    space.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mind abandons the soul to its judgment and to whatever chastisement it
    has deserved.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tat questions how mind can be parted from soul and soul from spirit, since
    Hermes had said that soul is the mind's vesture and spirit is the soul's vesture.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hermes says the arrangement of vestures occurs in a body made of earth, where
    mind cannot sit by itself in nakedness.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hermes says an earthy body cannot contain such immortality, so mind takes
    soul as an envelope.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Soul, also divine, uses spirit as its envelope, and spirit pervades the living
    creature.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: When mind frees itself from the earth-body, it immediately puts on its proper
    robe of fire, which it could not wear while dwelling in an earth-body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Earth is said not to bear fire, and water is poured around earth as a guard
    and wall to keep the blazing of fire away.
  category: setting
  evidence_refs:
  - ev:7
