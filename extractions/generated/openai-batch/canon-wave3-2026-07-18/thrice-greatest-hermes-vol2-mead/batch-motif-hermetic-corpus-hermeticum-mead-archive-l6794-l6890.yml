canonical_text:
  quote: ''
  summary: The passage comments on Gnosis, the true devotee of God, the transmutation
    of evil into good, the dual material and spiritual constitution of humanity, the
    goal of becoming like God in union, the Cosmic Course, the Cosmos as Logos and
    generative parent, and the possibility of knowing God through sense and thought.
    It also compares this teaching with a passage from the Perfect Sermon and notes
    a scholarly comparison with Sabsean Gnosis.
  language: English
  quote_policy: summarized
