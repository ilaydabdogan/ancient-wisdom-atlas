canonical_text:
  quote: ''
  summary: The passage describes a fiery voice, the descent of the Holy Word/Logos
    from Light onto Nature, the upward motion of Fire and Air from Moist Nature, the
    mingling of Earth-and-Water, and Man-Shepherd’s interpretation of the vision in
    terms of Light, Mind, Word, Father-God, Son of God, Life, Archetypal Form, and
    divine Will.
  language: English
  quote_policy: summarized
