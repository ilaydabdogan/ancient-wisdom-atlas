canonical_text:
  quote: man is a mighty wonder
  summary: The passage classifies daimons proper as beings who love human rational
    nature, describes mankind as diverse and combinatory, and presents man as able
    through mind and piety to join gods and daimons. It praises man as a wonder who
    shares in divine nature, stands in a middle cosmic station, loves what is below,
    is loved by what is above, and engages Earth, Elements, Sea, and Heaven through
    the mind.
