canonical_text:
  quote: "“the Path that leads above”"
  summary: The passage presents the Oneness as the ungenerated source that contains
    and engenders every number. It contrasts the Perfect One with engendered things,
    which are imperfect, divisible, and subject to increase and decrease. The speaker
    tells Tat that God's Image has been sketched for him; if Tat contemplates it with
    the heart's eyes, he will find the upward path, and the Image or Divine Sight
    will become his guide and draw the opened-eyed toward itself like a magnet drawing
    iron.
  language: English
  quote_policy: quoted
