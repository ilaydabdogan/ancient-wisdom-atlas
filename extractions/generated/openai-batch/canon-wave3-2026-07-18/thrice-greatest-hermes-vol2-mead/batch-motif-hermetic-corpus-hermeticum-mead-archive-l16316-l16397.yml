canonical_text:
  quote: ''
  summary: The passage explains that badness inheres through lack of Gnosis and Discernment,
    while God-like Reason and divine intelligence provide contempt and remedy of vice.
    Ignorance allows vices to strengthen and afflict the soul, except for those who
    know the Discipline of souls and Cure of intellect. Divinity shares science and
    intelligence with humans alone. God made man after the Gods from an equal mixture
    of a less pure cosmic part and a divine part; cosmic imperfections, bodily sustenance,
    desires, and passions remain with humans. The Gods are made from Nature’s fairest
    part and governed by order and law. Humans are distinguished from other animals
    by reason and discipline, through which they can separate bodily vices and strive
    toward deathlessness. The supplied excerpt ends while describing man’s status
    relative to the Gods.
  language: English
  quote_policy: summarized
