canonical_text:
  quote: ''
  summary: 'The passage presents a cosmological teaching addressed to Hermes. Mind
    orders the Cosmos and matter''s becoming depends on Mon/^on and God. Genesis and
    Time differ in Heaven and Earth: above they are unchangeable, below subject to
    change and destruction. The passage describes nested relations among God, Mind,
    Soul, Matter, Mon/^on, Cosmos, Heaven, and Earth; the universal Body is filled
    and encircled by Soul/Life. Mon/^on preserves the Cosmos, while all is described
    as God energizing. God is said to be incomparable, alone, one, and not inactive,
    because all things are full of God and no inaction exists in the Cosmos.'
  language: English
  quote_policy: summarized
