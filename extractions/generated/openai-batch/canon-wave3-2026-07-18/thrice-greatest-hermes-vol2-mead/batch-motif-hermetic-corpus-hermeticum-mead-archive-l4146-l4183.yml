  quote: ''
  summary: The passage describes embodied souls as receiving lordship, gnosis, and
    instruction through observation of Heaven, divine revolutions, Nature, and the
    works of God. Their life, wisdom, and death proceed according to fate appointed
    by the revolution of the Cyclic Gods. Human handiworks leave traces when cycles
    are renewed, while all ensouled births, seed-fruits, and works decay and necessarily
    renew through divine renovation and Nature’s rhythmic wheel. Nature and Godhead
    are described as co-established in an ever-renewing cosmic mixture.
