canonical_text:
  quote: ''
  summary: In the opening of Corpus Hermeticum X, “The Key,” Hermes addresses Tat,
    referring to a previous discourse to Asclepius and describing the present teaching
    as an abridgment of the General Sermons. The passage defines “God, Father and
    the Good” as sharing the same nature or energy, identifies God’s energy with Will,
    and describes God/Father/Good as the source and subsistence of all being. It also
    subordinates the Cosmos/Sun and ordinary parenthood to the Good’s creative desire.
  language: English
  quote_policy: summarized
