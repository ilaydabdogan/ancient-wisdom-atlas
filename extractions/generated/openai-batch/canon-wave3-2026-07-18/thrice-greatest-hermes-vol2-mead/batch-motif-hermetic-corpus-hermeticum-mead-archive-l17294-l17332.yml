  summary: The passage describes Time as perpetually moving yet stable through return
    to itself, and Eternity as stable and motionless yet appearing to move because
    Time is recalled into it. It then formulates a paradoxical relation in which Eternity's
    stability becomes moved, Time's mobility becomes stable, and God is described
    as moved into Himself by a motion that is also motionless. A note compares this
    reconciliation of opposites to Platonic and Upanishadic pairs.
