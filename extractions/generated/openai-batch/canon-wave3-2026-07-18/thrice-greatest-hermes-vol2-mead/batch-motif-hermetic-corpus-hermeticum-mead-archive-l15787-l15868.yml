canonical_text:
  quote: ''
  summary: The passage describes the Cosmos or Matter as uncreated yet generative,
    containing the births of all things and producing both bad and good. It rejects
    the claim that God was unable to remove evil and says Highest God provided for
    this by endowing human minds with sense, science, and intelligence so that humans
    may avoid ill. Spirit governs and quickens all things under the will of Highest
    God, who is conceived by mind alone and is ruler and director of the sensible
    god, the Cosmos.
  language: English
  quote_policy: summarized
