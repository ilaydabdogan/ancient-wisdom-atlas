canonical_text:
  quote: "“Seek'st thou for God, thou seekest for the Beautiful. One is the Path that
    leadeth unto It— Devotion joined with Gnosis.”"
  summary: The passage contrasts God as the fullness of Good with the world as a fullness
    of bad, identifies the Beautiful and Good as inseparable from God, distinguishes
    visible image-like things from invisible realities, and presents devotion joined
    with gnosis as the single path for seeking God and the Beautiful. It then describes
    those lacking this path as mistaking bad things for good and clinging to them.
  language: English
  quote_policy: quoted
