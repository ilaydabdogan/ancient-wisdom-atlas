  summary: 'The passage summarizes Mead''s discussion of a unitary Cosmic or Divine
    Sense in the Perfect Sermon: a higher sense connected with God, human reason,
    Nature, Cosmos, memory, divine likeness, and spiritual consciousness. It then
    introduces the sermon’s prophetic utterances, noting scholarly difficulty, comparison
    with Sibylline prophetic literature, possible relation to persecution of Trismegistic
    communities, and uncertainty about fourth-century dating or interpolation.'
