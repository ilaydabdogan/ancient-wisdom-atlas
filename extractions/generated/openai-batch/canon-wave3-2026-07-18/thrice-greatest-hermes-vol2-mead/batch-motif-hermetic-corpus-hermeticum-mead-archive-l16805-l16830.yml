canonical_text:
  quote: ''
  summary: In a dialogue, Asclepius asks whether Cosmos is good. Trismegistus answers
    that it is good and explains that God distributes good things such as sense, soul,
    and life to beings in Cosmos, while Cosmos bestows to mortals things perceived
    as good, including seasonal alternation, fruits, birth, growth, and maturity.
    God is described as transcending the highest Heaven, extending everywhere, and
    beholding all things.
