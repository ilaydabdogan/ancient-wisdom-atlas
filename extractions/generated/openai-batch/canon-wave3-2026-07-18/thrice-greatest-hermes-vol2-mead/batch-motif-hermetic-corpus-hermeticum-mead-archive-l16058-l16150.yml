  quote: ''
  summary: The passage describes a Hermetic cosmological hierarchy of sensible beings
    and essence-chiefs. Zeus is associated with Heaven and life-giving; light with
    the Sun; Pantomorph or Omniform with the Thirty-six Horoscopes; Fortune and Heimarmene
    with the Seven spheres and cosmic change; and Air with an engine through which
    things are made. The hierarchy of gods is arranged from bottom to top, while the
    Highest Lord sees the whole rulership as one, with all things depending on and
    flowing from the One.
