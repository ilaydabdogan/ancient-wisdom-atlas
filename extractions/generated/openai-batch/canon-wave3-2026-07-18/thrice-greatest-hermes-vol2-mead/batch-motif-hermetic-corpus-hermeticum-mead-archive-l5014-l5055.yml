canonical_text:
  quote: ''
  summary: A commentary passage argues that the terms “hate” and “body” in the Gnostic
    teaching should not be read literally; it assigns the cause of evil to human choice
    rather than to God or the body. It then explains Gnosis as the beginning of true
    knowledge of God, compares this with a Naassene saying about Gnosis and perfection,
    and describes recipients of the Baptism of the Mind as perfected humans who know
    their purpose, immortality, freedom from Death and Fate, and the cosmic order
    up to the Threshold of the Good or Plain of Truth.
  language: English
  quote_policy: summarized
