  summary: At the opening of Poemandres, the narrator enters a meditative state in
    which bodily senses are held back and thought is raised high. A vast Being calls
    the narrator, identifies himself as Man-Shepherd and Mind, and promises instruction.
    The narrator asks to learn what exists, nature, and God. The Being’s aspect changes,
    a limitless vision of light opens, and then darkness appears, coiling like a snake
    and changing into a turbulent moist nature that emits smoke.
