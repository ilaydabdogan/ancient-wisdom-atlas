canonical_text:
  quote: ''
  summary: The passage explains a hierarchy of genera and species. Each genus produces
    species like itself; divine genus and species are deathless, while other genera
    persist through fecundity even when individual species perish. Heaven is full
    of God. Formation and training are mediated by God, daimons, and humans. Some
    daimons that transcend their own genus and unite with a Godlike species are considered
    like Gods.
  language: English
  quote_policy: summarized
