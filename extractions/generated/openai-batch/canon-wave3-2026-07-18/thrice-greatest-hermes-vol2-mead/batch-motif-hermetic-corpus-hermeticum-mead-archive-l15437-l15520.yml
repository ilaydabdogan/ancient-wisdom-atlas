canonical_text:
  quote: ''
  summary: The passage states that perfection requires despising desires for alien
    things, including earthly possessions and even the body. It describes the soul
    led by reason to contemplate the divine while disregarding the mortal part joined
    for service to the lower world. Man is described as composed in fourfold bodily
    and higher faculties, enabling service to the terrene world and acquaintance with
    divine things, though bodily imperfection limits knowledge of true causes. Highest
    God is said to have created and appointed man to keep the world ordered, adore
    God, obey God's Good Will, and preserve the beauty of the Cosmos, with the passage
    asking what reward should follow.
  language: English
  quote_policy: summarized
