canonical_text:
  quote: Thus is it that man is the maker of the Gods.
  summary: Asclepius asks about the nature of terrene gods. The Thrice-greatest one
    says their quality consists in plants, stones, and spices containing divinity;
    they are pleased by sacrifice, hymns, praises, and harmonious sounds. Heavenly
    nature is drawn down into images through heavenly practices so that it can dwell
    with humankind. Heavenly gods dwell in heaven and keep their ranks, while the
    terrene gods aid humans through oversight, oracles, prophecy, foresight, and help.
  language: English
  quote_policy: quoted
