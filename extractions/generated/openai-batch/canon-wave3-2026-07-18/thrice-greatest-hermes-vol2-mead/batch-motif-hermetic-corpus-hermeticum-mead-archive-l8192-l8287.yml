- id: obs:2
  text: Jamblichus is cited as saying that Hermaic writings teach that man has two
    souls.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: One soul is said to come from the first Mind and to partake of the Creator's
    power; the other, constrained soul is said to come from the revolution of the
    celestial spheres.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The soul described as the seer of God is said to insinuate itself later into
    the sphere-derived soul.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The soul descending from the worlds or spheres keeps time with their circuit,
    while the soul from Mind is free from the whirl of genesis.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Through the Mind-derived soul, the bonds of Destiny are burst, a path up to
    the Gods is brought to birth, and a Great Art Divine is consummated beyond the
    spheres of genesis.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hermes is cited as saying that Mind takes soul as an envelope, soul uses spirit
