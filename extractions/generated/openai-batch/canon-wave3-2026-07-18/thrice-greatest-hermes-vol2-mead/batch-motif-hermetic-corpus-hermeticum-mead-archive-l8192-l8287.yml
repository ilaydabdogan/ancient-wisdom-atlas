  summary: The passage comments on Hermetic doctrines of life, the dual soul, nested
    vehicles of Mind, soul, and spirit, ascent beyond the spheres, and the standing
    Supreme Principle. It cites Jamblichus on Hermaic writings, Hermes on Mind and
    soul, and Numenius on the standing First God and moved Second God, with brief
    comparative references to Upanishadic literature, Proclus, Christianized Gnosis,
    and other traditions.
  language: English
  quote_policy: summarized
