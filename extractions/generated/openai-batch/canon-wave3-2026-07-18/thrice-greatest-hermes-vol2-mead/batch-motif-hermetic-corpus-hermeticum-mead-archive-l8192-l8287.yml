  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Supreme Principle is described as the One and Only One who stands perpetually
    and as the cause of the perpetual motion of the Hylic Cosmos.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Numenius is quoted as distinguishing a First God who stands from a Second
    God who is moved.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
