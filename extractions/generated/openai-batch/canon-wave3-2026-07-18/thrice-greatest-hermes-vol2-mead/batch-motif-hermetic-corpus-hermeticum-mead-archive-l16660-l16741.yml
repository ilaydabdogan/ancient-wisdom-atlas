canonical_text:
  quote: ''
  summary: 'The passage foretells a period of moral and cosmic inversion: darkness
    preferred to light, death to life, piety condemned, and the Religion of the Mind
    persecuted. The gods depart from humanity while harmful angels remain and drive
    people toward violence and deceit. The earth, sea, heaven, stars, divine voice,
    fruits, and air all fail. This condition is called the world''s old age, after
    which the supreme God corrects corruption and ends evil by flood, fire, or pestilential
    diseases.'
  language: English
  quote_policy: summarized
