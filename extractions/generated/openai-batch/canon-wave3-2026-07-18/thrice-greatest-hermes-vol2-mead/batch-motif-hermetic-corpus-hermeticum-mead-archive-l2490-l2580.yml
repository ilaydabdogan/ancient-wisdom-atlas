  summary: 'The passage explains an after-death ascent of the soul: the physical body
    and animal vehicle dissolve, irrational tendencies are left in the seven zones
    of the Fate-Sphere, and the initiated soul reaches the Eighth Sphere stripped
    of shame and clothed in its own power.'
