canonical_text:
  quote: ''
  summary: The passage describes an Avenging Daimon tormenting a transgressor with
    fire, then presents an instructional exchange in which the questioner asks Mind
    or the Man-Shepherd about the Way Above. The teacher explains that when the material
    body dissolves, the body is surrendered to change, the former form vanishes, the
    way of life is surrendered to the Daimon, senses return to their sources, and
    passion and desire withdraw to irrational nature. The human then ascends through
    the Harmony, giving up de-energized qualities in seven zones, and reaches the
    Eighth, where he joins others in hymning the Father. A band then goes to the Father’s
    home, surrenders to Powers, becomes Powers, and is in God.
  language: English
  quote_policy: summarized
