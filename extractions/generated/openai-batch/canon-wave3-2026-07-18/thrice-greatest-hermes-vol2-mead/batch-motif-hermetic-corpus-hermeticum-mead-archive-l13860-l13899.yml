  quote: ''
  summary: 'The passage states that God does not grow weary, then develops an analogy
    from music: in a contest, if something goes wrong after trumpeters and flautists
    perform and the music is completed with pipe and plectrum, the fault is not assigned
    to the inspiration or music-maker, but to the false instrument that hinders the
    performance and deprives listeners of the song’s sweetness.'
