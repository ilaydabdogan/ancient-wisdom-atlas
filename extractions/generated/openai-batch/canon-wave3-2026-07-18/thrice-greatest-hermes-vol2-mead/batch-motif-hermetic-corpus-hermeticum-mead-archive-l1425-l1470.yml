canonical_text:
  quote: ''
  summary: The speaker exhorts earth-born people to abandon Death, Error, Ignorance,
    Darkness, and Destruction, and to share in Deathlessness. Some listeners depart
    mockingly, while others ask to be taught. The speaker raises the receptive group,
    leads the Race toward home, teaches saving words or logoi, sows words of wisdom,
    gives them Deathless Water to drink, and later instructs all to give thanks to
    God. The speaker then records Man-Shepherd's benefaction in the heart and rejoices.
  language: English
  quote_policy: summarized
