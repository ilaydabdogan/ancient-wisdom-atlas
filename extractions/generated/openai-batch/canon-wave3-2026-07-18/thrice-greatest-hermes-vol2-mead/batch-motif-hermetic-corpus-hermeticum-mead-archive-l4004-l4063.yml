  summary: The commentary notes that the treatise names God as Good and Father, rejects
    immediate literary contact between two sets of scripture while allowing a shared
    theological language, and discusses the duty to beget children before entering
    contemplative life. It compares this social-before-contemplative rule with Egyptian
    priests, Pythagoreans, and the Manava Dharma Shastra, suggests Asclepius may represent
    married pupils, and reports a medieval marginal note calling the paragraph nonsense.
