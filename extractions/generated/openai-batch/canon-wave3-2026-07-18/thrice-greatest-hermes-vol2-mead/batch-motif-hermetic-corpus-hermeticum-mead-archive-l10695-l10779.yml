canonical_text:
  quote: ''
  summary: Hermes instructs Tat about an indefinable, bodiless, light-giving reality
    beyond sensory perception. Tat says his mind is blocked; Hermes tells him to withdraw
    inward, suspend bodily senses, and purge material torments so that divinity may
    come to birth. Hermes lists twelve inner tormentors, says they move through the
    prison of the body and depart from one pitied by God, and identifies this process
    as Rebirth; he then commands silence and says Tat is being purified by the Powers
    of God for the articulation of the Logos.
  language: English
  quote_policy: summarized
