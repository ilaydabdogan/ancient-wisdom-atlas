canonical_text:
  quote: ''
  summary: The passage, largely explanatory commentary, discusses the Body of Transformation,
    Dharmakaya, Sambhogakaya, and Nirmanakaya as forms or vehicles through which a
    Buddha or Master communicates with disciples according to their level of consciousness.
    It describes Bodhisattvas, stages of discipleship, transcendence of egoity, the
    sensing of the Master's Presence as Body of Bliss, and a higher Dharmakaya perfection
    uniting Without and Within. It then introduces the preaching of Gnosis, stating
    that Wisdom is held in trust for the benefit of the world-folk, and notes a possible
    later interpolation before the mention of the Shepherd's benefaction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Body of Transformation, identified parenthetically
    with Dharmakaya, has nothing to do with limitation or measurement.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Buddha is said to communicate with certain minds by means of a form that
    is described as the form of their own highly evolved consciousness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bodhisattvas are described as having consciousness of the "formless" state
    while not yet having reached Nirvanic Consciousness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Body of Bliss, or Sambhogakaya, is described as depending on activity-consciousness
    and as being conceived by Bodhisattvas from first aspiration up to the height
    of Bodhisattva-hood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Body of Bliss is described as having infinite forms, attributes, excellencies,
    merits, and ornamentations, and as manifesting everywhere from Mind.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: An older Chinese version is quoted as saying that this body is boundless,
    free from signs of limitation, self-existent, and never destroyed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Master who has reached Nirvanic Consciousness is said to teach or be active
    on planes that are unmanifest to ordinary folk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The vehicles of the Master's activity are named Dharmakaya, Sambhogakaya,
    and Nirmanakaya, and their limitation is said to depend on the disciple's conscious
    ability in divine, spiritual, and human states of self.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the first degree of conscious discipleship, the Master communicates through
    the Nirmanakaya by quickening the disciples' highest conception of masterhood,
    perhaps taking the form of their greatest love.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the next stage, the disciple is said to transcend ordinary egoity without
    destroying true individuality and to gain the power to manifest wherever and however
    he wills.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The disciple begins to realize that the Self is in all and all is in the Self.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Master's Body of Bliss is described as a sensing of the Master's Presence
    involving sympathy, compassion, blending with the Life of all beings, and relation
    to the Beloved.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Dharmakaya is described as the Own-Nature of Masterhood and as a higher perfection
    combining Without and Within in Transcendent Unity.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that Gnosis is to be utilized, that Wisdom is no man's
    property, and that whoever receives it holds it in trust for the benefit of the
    world-folk.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The commentator states an inclination to regard sections 27 to 29 as a later
    interpolation and says the treatise may originally have continued with a record
    of the Shepherd's benefaction.
  category: other
  evidence_refs:
  - ev:9
