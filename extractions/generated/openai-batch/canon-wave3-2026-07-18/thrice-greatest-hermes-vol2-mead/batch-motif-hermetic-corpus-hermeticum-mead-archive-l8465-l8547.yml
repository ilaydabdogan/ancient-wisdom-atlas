  quote: ''
  summary: Mind instructs Hermes about the relation of God and All. The passage presents
    a chain of principles—God, Æon/Mon, Cosmos, Time, and Becoming—assigning each
    a role, essence, energy, and place in a nested cosmic order. It states that Cosmos
    is not destroyed because it is held by indestructible Æon, and it identifies God's
    Wisdom with the Good, the Beautiful, Blessedness, Virtue, and Æon.
