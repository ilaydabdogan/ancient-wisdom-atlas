canonical_text:
  quote: "“man is twofold ; mortal because of body, but because of the essential Man
    immortal.”"
  summary: The passage describes Man learning the nature of the Brother’s creatures,
    breaking through the boundary of the spheres, descending through the Harmony,
    revealing God’s form to Nature, and becoming intermingled with Nature through
    mutual love. It then explains human beings as both mortal in body and immortal
    in essential Man, subject to Fate within the Harmony, and frames the account as
    a hidden mystery taught by the Shepherd/Mind.
  language: English
  quote_policy: quoted
