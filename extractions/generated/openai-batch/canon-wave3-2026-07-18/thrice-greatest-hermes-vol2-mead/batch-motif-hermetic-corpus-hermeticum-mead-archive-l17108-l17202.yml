canonical_text:
  quote: ''
  summary: The passage contrasts the good and the bad, saying the good shine in piety,
    sanctity, prudence, worship, service of God, and sight of True Reason. It presents
    the Sun as a holy and divine illuminator, a “second God” who gives light and rules
    or distributes vital powers. The Cosmos is described as a living, ever-living
    whole in which there is no place for death. God is described as the eternal ruler
    and everlasting giver of Life, preserving vital powers by an everlasting law.
    The next section states that the Cosmos is moved in the Life of Eternity and will
    not stop or be destroyed because it is bounded by Living’s Sempiternity.
  language: English
  quote_policy: summarized
