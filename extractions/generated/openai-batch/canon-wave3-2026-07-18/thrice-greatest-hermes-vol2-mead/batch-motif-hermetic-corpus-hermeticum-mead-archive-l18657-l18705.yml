  summary: The passage is editorial commentary on the dating and interpretation of
    prophecies in the Perfect Sermon. It discusses a Church Father, Zosimus, uncertainty
    about persecution, a prophetic statement addressed to Asclepius, a lament that
    Pure Philosophy is disappearing, possible relation to Christianity and Gnostic
    Christianity, and a prediction that worship of the Gods will be legally proscribed
    by foreign rulers of Egypt, compared by the editor with the destruction of the
    Serapeum by Christians in 389 a.d.
