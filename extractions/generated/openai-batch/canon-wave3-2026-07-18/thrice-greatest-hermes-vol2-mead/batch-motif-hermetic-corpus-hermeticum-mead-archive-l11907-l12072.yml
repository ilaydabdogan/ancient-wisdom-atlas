canonical_text:
  quote: ''
  summary: The passage lists moral and cosmological categories, then explains that
    the first seven virtues oppose the first seven vices, that the Twelve vices are
    permutations of Ignorance, and that virtues are summed in Gnosis or Truth. It
    contrasts post-mortem transformation in the Poemandres arrangement with the Way
    of Rebirth in a living person, relates numbered virtue-and-vice schemes to Gnostic
    systems, and cites a parallel band of seven women-virtues in the Shepherd of Hermas.
  language: English
  quote_policy: summarized
