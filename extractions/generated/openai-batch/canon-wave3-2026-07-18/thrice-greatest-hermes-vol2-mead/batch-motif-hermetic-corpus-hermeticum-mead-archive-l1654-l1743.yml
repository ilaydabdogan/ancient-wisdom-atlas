canonical_text:
  quote: "“I am thou, and thou art I; and wheresoever thou mayest be, I am there.”"
  summary: Mead comments on the composite yet spiritually intended character of Hermetic
    documents, then interprets the Poemandres disciple as receiving meditative initiation
    from the Master of masters. The passage emphasizes the Great Man or Shepherd of
    men as the disciple’s Greater Self, compares this to a Gospel of Eve vision of
    a gigantic Man and a dwarf on a lofty mountain, and describes the disciple’s renunciation
    of lower desires in pursuit of Gnosis of cosmos, nature, and God.
