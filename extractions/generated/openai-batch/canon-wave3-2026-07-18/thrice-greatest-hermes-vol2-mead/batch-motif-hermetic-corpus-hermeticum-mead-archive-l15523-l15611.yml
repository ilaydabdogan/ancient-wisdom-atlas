canonical_text:
  quote: ''
  summary: The passage prays that devoted persons may be restored pure and holy to
    their higher, divine nature after releasing worldly and deathly bonds. In dialogue,
    Asc. affirms this as the prize of pious service to God and help to the world.
    Tris. contrasts impious lives, for which return to Heaven is denied and migration
    into unworthy bodies is appointed. He describes bodily life, possessions, and
    spite as imprisoning the soul in its mortal part, and says prophetically that
    later people will lack the single love of wisdom-loving, understood as Gnosis
    of Divinity, contemplation, and holy piety.
  language: English
  quote_policy: summarized
