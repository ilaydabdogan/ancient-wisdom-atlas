canonical_text:
  quote: ''
  summary: 'Hermes explains to Asclepius that God should not be conceived as space,
    but as an energy able to contain all space. He then explains motion as depending
    on stability and opposition: moving bodies are moved in relation to what is stable,
    the errant spheres move against the inerrant one, the Bears turn forever around
    the same, and a swimmer remains stable in moving water by resisting it with hands
    and feet.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage distinguishes space from God: if space is a godlike thing it
    is substantial, while if it is God Himself it transcends substance.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says God is thinkable for humans but not for Himself, because
    what is thought falls under the thinker’s sense.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that if space is thought, it should not be thought as God,
    and if God is thought, He should not be conceived as space but as energy that
    can contain all space.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that all that is moved is moved not in what is moved but
    in what is stable, and that the mover is stationary.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Asclepius asks how things below are moved with things already moved, referring
    to errant spheres moved by an inerrant one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hermes answers that this is not motion with one another but motion against
    one another; contrariety turns resistance of motion into rest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The errant spheres are described as moving contrarily to the inerrant one,
    by mutual contrariety and by the stable one through contrariety itself.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bears are described as neither setting nor rising, and Asclepius says
    their motion is a motion that turns forever around the same.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:9
  text: Hermes states that revolution, or motion around the same, is fixed by rest,
    and that the contrary stands firm by being rendered stable through contrariety.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Hermes gives an earthly visible example: a man swimming in moving water remains
    stable through the resistance of his hands and feet, so that he is not carried
    along or sunk.'
  category: action
  evidence_refs:
  - ev:5
