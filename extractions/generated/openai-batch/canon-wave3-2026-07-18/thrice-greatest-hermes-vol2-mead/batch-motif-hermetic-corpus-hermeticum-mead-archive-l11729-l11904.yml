canonical_text:
  quote: ''
  summary: The passage explains repentance as a whole-nature turning toward God, replacing
    lower tendencies with Divine Powers. It describes Hermes expounding this process
    and performing an invocation for Tat. It then lays out a numbered scheme of Twelve,
    Ten, Seven, Three, and One, associating the Twelve with Torments of Darkness,
    error, animal soul, and outward going-forth, while associating the Ten with Gnosis,
    perfection, return, and the birth of souls. The excerpt begins paired lists of
    vices and virtues.
  language: English
  quote_policy: summarized
