canonical_text:
  quote: For He, indeed, is One and All.
  summary: The passage presents a Hermetic dialogue in which Asclepius asks for the
    reason behind a prior teaching. Tris. replies that God, called Father, Lord, and
    Creator of all, is too transcendent to be confined by any single name. Human words
    are described as sounds formed through air and breath. The full Name of God is
    associated with Sense, Spirit, Air, and all things. God is described as One and
    All, all-complete in the fertility of either sex, ever pregnant with His own Will,
    and bringing to birth whatever He wills through All-goodness.
  language: English
  quote_policy: quoted
