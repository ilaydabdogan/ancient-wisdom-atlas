canonical_text:
  quote: ''
  summary: The passage is Mead's commentary on a Hermetic sermon, discussing its textual
    relation to other sermons, the doctrine that human sense is constituted by sense-and-thought,
    the mind's capacity to go beyond sense and receive divine illumination, and the
    image of mind as a womb impregnated either by divine seeds or daimonial energy.
    It also describes Gnostics as estranged from the world and rejected by the many,
    and compares this with Philonic sacred-marriage doctrine and Synoptic sayings
    about persecution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lactantius is said to have had a collection in which two sermons stood in
    close connection.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Reitzenstein is reported as thinking the sermon was an extract from a longer
    sermon, while the commentator says its formal beginning and ending suggest a complete
    tractate.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that, in men, sense-and-thought together constitute human
    sense.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Normal human thought is described as bound to sense-impressions, while mind
    alone can soar beyond the senses and be illumined by God's Light.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mind is likened to a womb or woman that can be impregnated either by the Seeds
    of God or by Daimonial Energy and can bring forth virtues or vices.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Seeds of God are identified as Virtue, Self-control, and Devotion or Piety,
    and Devotion is glossed as God-gnosis or Knowledge of God.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Those in Gnosis are described as naturally divorced from the world and as
    mutually displeasing to the many.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Those in Gnosis are said to be thought mad, laughed at, hated, despised, and
    sometimes put to death.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The commentator compares the treatment of those in Gnosis with sayings quoted
    from Luke vi.22 and Matthew v.11 about hatred, reviling, expulsion, and persecution.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The commentator says Luke kept closer to an original saying addressed to those
    cast out for the sake of the Son of Man, interpreted as immediate inspiration
    of the Logos.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The commentator says Matthew adapted the saying for general purposes and for
    the necessities of the Cult of Jesus.
  category: speech
  evidence_refs:
  - ev:8
