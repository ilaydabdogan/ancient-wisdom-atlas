canonical_text:
  quote: ''
  summary: The passage describes God as ruler and distributor of what cosmic things
    require, filling all with Spirit. It explains the cosmos as a hollow spherical
    roundness that cannot be fully visible to itself; its lower or bottom part is
    linked etymologically with Greek terms for invisibility and with Hades, and in
    Latin with Inferi. The passage then presents a dialogue in which Asclepius summarizes
    cosmic principles and Trismegistus states that Cosmos nourishes bodies, Spirit
    nourishes souls, and Higher Sense feeds the mind.
  language: English
