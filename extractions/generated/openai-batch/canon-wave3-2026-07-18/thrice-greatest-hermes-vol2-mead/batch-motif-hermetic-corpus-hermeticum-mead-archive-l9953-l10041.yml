canonical_text:
  quote: ''
  summary: The passage presents a metaphysical hierarchy of image-relations and subtle
    principles from matter through air, soul, mind, and God. It describes God as surrounding
    and permeating all, and describes Mind, Soul, Air, Matter, Necessity, Providence,
    Nature, Sameness, number, units, Cosmos, Father, life, death, corruption, and
    destruction in relation to cosmic order. The Cosmos is called a living divine
    image, unified with the mightier One and filled with Life; the speaker denies
    that any dead thing exists in the Cosmos. Tat asks whether lives within it die,
    and the father-speaker says this is an error caused by terminology.
  language: English
  quote_policy: summarized
