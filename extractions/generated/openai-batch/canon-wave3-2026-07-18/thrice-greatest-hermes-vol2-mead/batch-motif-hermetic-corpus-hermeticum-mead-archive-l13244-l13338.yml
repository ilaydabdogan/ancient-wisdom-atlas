canonical_text:
  quote: ''
  summary: The passage describes a few people whose rational part receives a divine
    ray through the Sun and so is not subject to daimonic or divine powers. Others
    are led by daimons, who use human bodies as instruments in the terrene economy
    called Heimarmene. It then presents a hierarchy in which the Intelligible World
    depends from God, the Sensible from the Intelligible, the Sun mediates the Good
    from God, spheres give rise to daimons, daimons to men, and all things depend
    from God. God is Sire of all, the Sun is Demiurge, the Cosmos is an instrument,
    and divine making is endless and beginningless.
  language: English
  quote_policy: summarized
