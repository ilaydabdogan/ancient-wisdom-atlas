canonical_text:
  quote: ''
  summary: Hermes argues that what is called void is not truly empty but is filled
    by air and spirit; air is treated as a body compounded from the four elements.
    Asclepius accepts that air pervades and fills all things, then asks what to call
    the space in which the all moves. Hermes names it the Bodiless and defines it
    as Mind and Reason, free from body and error, self-embracing, containing and preserving
    all.
