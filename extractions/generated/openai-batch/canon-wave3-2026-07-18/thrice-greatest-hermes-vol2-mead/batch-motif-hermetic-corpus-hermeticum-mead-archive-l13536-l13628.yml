canonical_text:
  quote: "“the Sun as Demiurgic Orderer of all things”"
  summary: The commentary discusses the Hermetic treatise’s distinctive solar doctrine,
    its uncertain date and royal addressee, solar iconography involving a ray-crowned
    charioteer and a cosmic wreath, comparisons to Egyptian, Gnostic, Mithraic, Greek,
    and Orphic materials, a serpentine pattern of sun-life, and daimones as lower-cosmic
    ministers analogous to karmic agents.
