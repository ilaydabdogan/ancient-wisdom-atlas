canonical_text:
  quote: ''
  summary: The passage is Mead's commentary on the Hermetic Secret Sermon, presenting
    Tat's regeneration as a birth from above, a virgin birth, and an inner birth of
    Christ or the Son of God. It connects this teaching with Pleroma and Hysterema
    language, Sacred Marriage, the Virgin Womb, the Logos as seed, and the Race of
    the Logos whose memory is restored by God. The commentary also compares the passage
    with Behnesa, New Testament, Naassene, Philonic, Valentinian, Pythagorean, and
    Platonic formulations while explicitly cautioning that New Testament parallels
    are not cited to prove dependence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary compares the Hermetic teaching with a Behnesa logos saying
    in which Jesus states that fasting to the world is required to find the Kingdom
    of God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tat's prayer for the consummation of his probation asks that what falls short
    in him be filled up; the commentary links this wording to the technical terms
    Pleroma and Hysterema, glossed as Fullness and Insufficiency.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The commentary says the time has come for Tat to receive, through his master,
    the touch of true Mind-consciousness; Christ is to be born in his heart, and the
    light of the Pleroma is to shine into his inmost being.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same event is described as New Birth, Regeneration, Re-birth, and being
    born from Above.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The commentary cites passages from John and 1 Peter about being born from
    Above or reborn, but states that these citations are not meant to prove dependence
    of Hermetic authors on New Testament writers.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The commentary states that the doctrine of New Birth and Sacred Marriage was
    a crowning mystery of the Spiritual Way for mystic schools of the time.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tat's desired secret is identified as the Mystery of the Birth from the Virgin
    Womb, the Birth of Man, and the Great Mystery of Regeneration.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The cited Naassene passage describes the Gate of Heaven and House of God as
