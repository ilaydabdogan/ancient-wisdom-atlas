  summary: The passage explains a state in which persons have seen a Nirvanic vision
    without fully entering Nirvana or union with the Logos. It describes this vision
    as a foretaste of eventual at-one-ment with Deity, then presents the Way of Gnosis
    as an ancient return or going-home, identified for Hermetic followers with the
    archaic Wisdom of Ancient Egypt.
