  summary: The passage argues that Greek and other religious traditions are blended,
    that Chaldaea transmitted wisdom to Greece, and that initiated circles taught
    a common root of religions. It then quotes Granger on the Good Shepherd glyph,
    reporting comparisons between Jesus and Hermes, including Hermes Logios, Hermes
    Kriophoros, Jesus as Logos, and Jesus as the Good Shepherd. A footnote notes a
    disputed suggestion linking the Gospel according to the Egyptians with a mountain
    setting and a Hermetic sermon title.
