canonical_text:
  quote: God is Unwearied Spirit
  summary: 'The speaker warns against blaming the Race or God for failures caused
    by bodily or material weakness. God is described as an unwearied Spirit who continually
    gives benefits. The passage then uses artisan and musical-instrument analogies:
    a deficient matter, string, or instrument should be blamed rather than the Artist,
    whose skill may even appear greater when the instrument is poor.'
