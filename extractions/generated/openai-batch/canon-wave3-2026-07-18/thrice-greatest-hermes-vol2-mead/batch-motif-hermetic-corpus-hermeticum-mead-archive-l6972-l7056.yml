canonical_text:
  quote: ''
  summary: 'Hermes teaches Tat that God, the Father, and the Good is the cause of
    all being and is known through an inner vision. Tat says his mind''s eye has been
    filled with the Sight of the Good. The Vision of the Good is described as unlike
    a harmful fire-like sunbeam: it increases seeing, is perceived by mind alone,
    and is filled with immortal life. Those able to receive more of this Sight may
    fall asleep out of the body into a beautiful spectacle, as Uranus and Cronus are
    said to have done. Hermes says they are not yet ready for the Vision, and that
    Gnosis of the Good requires holy silence, the suspension of the senses, and bodily
    stillness.'
  language: English
  quote_policy: summarized
