- id: obs:2
  text: A maker is contrasted with God as defective because the maker sometimes makes
    and sometimes does not, and varies in the quantity and quality of what is made.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Good is said to will to be, to be by reason of itself, and to be the reason
    other things exist.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tat says his father has filled him or them with a good and fairest Sight,
    so that his mind's eye has become almost an object of worship.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The Vision of the Good is contrasted with a fire-like sunbeam: it does not
    harm the eyes or make them close, but increases the eye''s seeing according to
    capacity.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The radiance of the Good is said to be visible to mind alone, to come swiftly,
    to do no harm, and to be instinct with immortal life.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those able to drink in more of the Sight are said to fall asleep out of the
    body into the fairest Spectacle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Uranus and Cronus are named as forebears for whom this out-of-body sleep into
    the Spectacle was the case.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hermes says that he and Tat are not yet prepared for the Vision and do not
    yet have the power to unfold the mind's eye and gaze on the Beauty of the Good.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gnosis of the Good is described as holy silence and as giving holiday to every
    sense.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A person perceiving or gazing upon the Good cannot perceive, gaze on, hear,
    or move toward anything else, but stays every bodily sense and motion still.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the body's senses and motions are stilled, the Good is described as
    shining all around the mind.
  category: sequence
  evidence_refs:
  - ev:8
