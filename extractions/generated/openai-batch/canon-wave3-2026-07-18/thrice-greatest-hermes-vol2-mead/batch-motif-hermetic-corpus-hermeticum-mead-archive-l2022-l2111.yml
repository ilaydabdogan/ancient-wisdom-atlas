  quote: He transcends all opposites and contains all opposites in Himself.
  summary: The passage is an editorial discussion of a Hermetic visionary text. It
    reviews an argument about interpolation based on divine gender and dualism, then
    interprets Light, Darkness, the Serpent of Darkness, the Light Veil, the Pleroma,
    and the Feminine Divinity as aspects of a vision in which opposites are interblended
    and transcended. It further compares the combined visions with later Gnostic,
    Basilidian, and Valentinian systems.
