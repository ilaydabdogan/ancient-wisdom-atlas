canonical_text:
  quote: ''
  summary: The passage comments on the Hermetic image of the Cup or Monad as God's
    gift, linked to ascent, baptism, redemption, and Gnosis of the Mind. It then discusses
    the discipline called 'hating of the body,' warning against literal body-hatred
    and explaining it as an early-stage mystical discipline that leads toward balance,
    the Middle Way, and a union of heaven and earth described as a Sacred Marriage.
    The passage also compares this use of 'hate' with a Synoptic saying attributed
    to Jesus and notes a Gnostic interpretation of leaving parents as leaving ruling
    powers or past causes of imperfection.
  language: English
  quote_policy: summarized
