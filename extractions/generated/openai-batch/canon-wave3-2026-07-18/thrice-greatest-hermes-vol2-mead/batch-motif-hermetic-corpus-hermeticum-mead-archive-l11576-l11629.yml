canonical_text:
  quote: ''
  summary: The passage says that those entering Divine Service are moved by Heavenly
    Love and are of the race of Elxai. It discusses Hermes being unable to teach Tat
    the Birth in words, compares this with Isis not being permitted to reveal Horus’s
    divine birth, and describes Hermes guiding Tat through spiritual presence, the
    Cup of the Mind, and the laying-on of hands. It also describes Hermes entering
    higher spiritual consciousness and a deathless cosmic body.
  language: English
  quote_policy: summarized
