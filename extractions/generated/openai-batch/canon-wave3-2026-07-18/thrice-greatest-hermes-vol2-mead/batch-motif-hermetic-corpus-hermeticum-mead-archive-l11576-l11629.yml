  text: Those who betake themselves to Divine Service are said to do so not from custom,
    advice, or appeal, but because they are carried away by Heavenly Love.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same group is described as being of the Race of Elxai, who is called the
    Hidden Power or Holy Spirit and the spouse of Iexai, the Hidden Lord or Logos.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hermes cannot teach Tat this Birth in words.
  category: speech
  evidence_refs:
  - ev:2
