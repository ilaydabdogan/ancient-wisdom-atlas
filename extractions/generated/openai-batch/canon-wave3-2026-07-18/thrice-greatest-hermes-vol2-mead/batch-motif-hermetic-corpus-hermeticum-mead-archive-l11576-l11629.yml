  text: Isis is described as not permitted to declare the Birth openly to Horus, lest
    the Way-of-Birth of the immortal gods become known to men.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Hermes can guide Tat toward the Blessed Sight by entering a sublime state
