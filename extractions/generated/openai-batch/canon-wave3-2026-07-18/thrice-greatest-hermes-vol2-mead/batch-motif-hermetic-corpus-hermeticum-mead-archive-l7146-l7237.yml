canonical_text:
  quote: ''
  summary: The passage contrasts sense perception with Gnosis and science, presents
    science as incorporeal and as a gift of God, and describes all things as constituted
    through antithesis and contrariety. In a dialogue, Tat asks about a material God;
    the respondent describes Cosmos as beautiful, material, passible, ever-existing
    yet always in becoming, and as the source of material motion. Cosmos is imaged
    as a sphere or head moved by intelligible rest and mind. Those united to the head’s
    tissue, where soul is, are described as deathless, while those farther from it
    and having more body than soul are subject to death. The universe is said to consist
    of both hylic and intelligible aspects.
  language: English
