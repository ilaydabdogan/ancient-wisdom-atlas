canonical_text:
  quote: ''
  summary: Hermes teaches Tat that dissolution of compound bodies is not death or
    destruction but renewal. Life is associated with motion, and Earth is described
    as rapidly moving yet stable and as the Nurse of all. The Cosmos as a whole is
    unchanging while its parts change; nothing is ultimately corrupted or destroyed.
    Matter, Life, Spirit, Mind, and Soul are called immortal. Man is described as
    recipient of God and co-essential with Him; God foretells the future to man through
    visions, tokens, birds, inward parts, wind, and tree. Unlike other creatures confined
    to one element or region, man uses earth, water, air, and fire, and senses heaven.
  language: English
  quote_policy: summarized
