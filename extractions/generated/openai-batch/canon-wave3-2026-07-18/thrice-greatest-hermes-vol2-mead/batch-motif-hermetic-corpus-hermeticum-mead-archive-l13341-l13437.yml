canonical_text:
  quote: ''
  summary: Commentary on the title and literary setting of the 'Definitions of Asclepius
    to King Ammon.' The passage discusses manuscript titles, Patrizzi's and Reitzenstein's
    judgments, Lactantius's testimony about Asclepius as Hermes' hearer, and a literary
    tradition that Hermetic teaching was Egyptian and rendered into Greek modes of
    thought rather than literally translated.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Patrizzi combined sections under a 'Definitions of Asclepius' title while
    also indicating that one section seemed to come from another book.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A later manuscript hand added a contents catalogue listing topics such as
    God, Matter, Evil, Fate, the Sun, intelligible and divine essence, Man, the Pleroma,
    the Seven Stars, and the Man after the Likeness.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Patrizzi substituted the title 'Of the Sun and Daimons' for the manuscript
    contents list.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Reitzenstein is reported as attributing the contents-list and similar headings
    to a Byzantine scribe who also interpolated a section.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lactantius is cited as saying that the doctrine of daimonic incursions was
    also Hermes' doctrine and that Asclepius, Hermes' hearer, explained it to the
    King.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The commentator keeps the traditional title while placing the title associated
    with Lactantius second.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The treatise is called an epitome, and Asclepius is said to have previously
    written a number of sermons to the King.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: References to conversations among Hermes, Asclepius, and Tat are said to presuppose
    a class of Hermetic dialogue.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The correspondence of Asclepius with the King is described as a later deposit
    of the literature.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The literary activity of Asclepius is said to be authorized by Hermes and
    to purport to have been originally written in Demotic Egyptian.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The commentary states that the Greek is not actually a translation from Egyptian
    and calls the prophecy of direct translation a literary fiction.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The commentator considers it highly probable that the author was in contact
    with a tradition that Hermetic teaching was originally Egyptian and interpreted
    into Greek modes of thought.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The author is described as showing contempt for the Greek language and for
