canonical_text:
  quote: ''
  summary: The speaker describes an inner awakening and true vision, attributes the
    experience to Mind identified as Man-Shepherd and Logos, gives thanks to Father-God,
    praises God as holy creator and ineffable source, offers pure offerings of reason,
    prays not to fail in Gnosis, asks for Power and Grace in order to give Light to
    the ignorant, and concludes by going to Life and Light as God's Man seeking holiness
    and authority from the Father.
  language: English
  quote_policy: summarized
