canonical_text:
  quote: ''
  summary: The passage opens The Perfect Sermon, or Asclepius, with a textual note
    on its Latin transmission. Trismegistus tells Asclepius that God has brought him
    to hear a godly sermon. He says that seeing the Word with the eye of intellect
    fills the mind with good, then introduces a teaching on the relation of the many,
    the good, the One, and the All. He asks Asclepius to call in another hearer; Asclepius
    proposes including Ammon. Trismegistus allows Ammon, recalls writings addressed
    to him as a beloved son, and says this treatise will be inscribed with Asclepius'
    name.
  language: English
  quote_policy: summarized
