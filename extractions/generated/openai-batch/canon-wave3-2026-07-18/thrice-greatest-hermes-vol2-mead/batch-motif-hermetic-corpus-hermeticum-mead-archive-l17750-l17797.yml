canonical_text:
  quote: For what is Cosmos, or of what doth it consist, if not of all things born?
  summary: In a dialogue, Asclepius asks whether the Cosmos has a species. Trismegistus
    answers by describing the Cosmos as consisting of all things born, then explains
    changing species or qualities in heaven, earth, air, trees, flowers, berries,
    and fire. Fire is said to make numerous divine conversions and to produce images
    of Sun and Moon like mirrors reflecting likenesses.
