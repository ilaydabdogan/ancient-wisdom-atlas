canonical_text:
  quote: "“The Mind in men is God”"
  summary: Hermes teaches Tat that Mind belongs to God’s essence, is united with God
    as light is to the sun, and operates differently in human and irrational lives.
    Human souls, once embodied, are said to be depraved by pleasure and pain; Mind
    corrects such souls like a physician, inflicting pain to rescue them from pleasure
    and godlessness.
  language: English
  quote_policy: quoted
