canonical_text:
  quote: And so Man, the Beloved, descends;
  summary: The passage explains the co-essential relation of the Word, Formative Mind,
    Man, and the Father, then narrates Man's descent through the spheres toward Nature
    below. Man seeks to break through the Great Boundary, must descend further into
    matter before rising, and shows Nature his radiant Divine Form. Nature winds around
    his reflected image on water and shadow on earth, in parallel with Darkness winding
    like a Great Serpent around Light. The commentary further identifies Nature as
    World-Soul and spouse of Mind.
  language: English
  quote_policy: quoted
