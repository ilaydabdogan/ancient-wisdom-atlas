canonical_text:
  quote: ''
  summary: A Hermetic father-teacher explains that a person possessing Mind may be
    freed from vice, while still subject to change and genesis. He recalls Good Daimon’s
    divine saying that all things are one, that divine Mind and Soul are good, and
    that Mind as Soul of God rules all things. He then applies this to Mind’s relation
    to Fate and Law. Tat asks whether Mind’s cooperation with irrational impulses
    makes Mind passion, and the teacher begins to answer by distinguishing incorporeal
    movers from moved bodies.
  language: English
  quote_policy: summarized
