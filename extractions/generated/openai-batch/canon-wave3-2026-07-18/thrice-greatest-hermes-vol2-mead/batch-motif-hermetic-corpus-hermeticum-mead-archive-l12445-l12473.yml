  quote: ''
  summary: A letter attributed to Thrice-Greatest Hermes addresses Asclepius with
    a wish for health of soul. Hermes explains that, while Asclepius was absent, his
    son Tat wanted to learn the nature of existing things; because Tat was young and
    newly come to gnosis of the teachings, Hermes was compelled to explain more so
    that contemplation would be easier for him.
