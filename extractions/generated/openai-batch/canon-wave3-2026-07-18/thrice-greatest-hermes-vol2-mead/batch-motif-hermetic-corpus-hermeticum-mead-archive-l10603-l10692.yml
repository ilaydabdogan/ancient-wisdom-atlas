canonical_text:
  quote: ''
  summary: 'In a father-son dialogue on a mountain, Tat asks for direct instruction
    about Rebirth. The speaker called Her. says the Race is not taught but remembered
    by God’s will, describes an inner Simple Vision, passage into a deathless Body,
    being born in Mind, and the dismembering of the former composed form. Tat reacts
    with frenzy and stupefaction, asks who authors Rebirth, and receives the answer:
    the Son of God, the One Man, by God’s Will. The speaker contrasts mutable mortal
    form with what is true.'
  language: English
  quote_policy: summarized
