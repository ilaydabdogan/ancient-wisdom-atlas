canonical_text:
  quote: ''
  summary: Mind instructs Hermes that the soul can travel instantly, ascend through
    heaven and beyond the cosmos, and know God by becoming like God. The instruction
    contrasts expansive divine knowledge with confinement in the body, presents the
    Good as a straight path seen everywhere, and concludes that God is manifest through
    all created things.
  language: English
  quote_policy: summarized
