  summary: The passage states that all makable things are made by God, the Good. It
    offers an image of a husbandman sowing seed and planting trees, then applies the
    image to God sowing Immortality in Heaven, Change on Earth, and Life and Motion
    in the universe. It concludes that these are four, together with God and Genesis,
    in whom all things are.
