canonical_text:
  quote: Chaos, too, has its being from God's Will.
  summary: 'The passage comments on Hermetic cosmology: Logos and Light or Mind are
    ultimately one, the Son is one with the Father beyond opposites, and Hermes is
    instructed to understand Light as Life. Hermes receives expanded sight from the
    Master, sees Powers within the Light, and learns of a Great Boundary containing
    the sensible cosmos and its Fire. The passage explains Chaos, Discord, Concord,
    and Cosmos as originating in God''s Will, identifies a feminine divine aspect
    as Wisdom, Nature, Generation, and Isis, and describes the Mother/Wisdom being
    perfected through union with Fullness and impregnated by the Word to generate
    the sensible cosmos. It then compares this pattern with the Gnostic Sophia myth,
    Egyptian materials, Philo''s Gnosis, and Reitzenstein''s reading of the cosmogenesis.'
  language: English
  quote_policy: quoted
