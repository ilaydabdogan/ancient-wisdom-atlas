canonical_text:
  quote: ''
  summary: The passage gives prayers of thanksgiving after being filled, asks that
    the church be delivered and gathered into the prepared kingdom, and gives communal
    rules for receiving and testing teachers, apostles, prophets, travelers, and local
    ministers. It also describes support for true prophets and teachers through first
    portions, the Lord's day assembly with bread-breaking, confession, reconciliation,
    and pure sacrifice, and procedures for appointing bishops and deacons and correcting
    offenders.
  language: English translation of an Ancient Greek source
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After being filled, the community is instructed to give thanks to the holy
    Father for the holy name dwelling in their hearts, and for knowledge, faith, immortality,
    spiritual food and drink, and eternal life made known or given through Jesus the
    servant.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The thanksgiving states that the Almighty Master created all things for the
    sake of the divine name and gave food and drink to humans for enjoyment so that
    they might give thanks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer asks the Lord to remember the church, deliver it from every evil,
    perfect it in love, and gather the sanctified church from the four winds into
    the prepared kingdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage calls for grace to come, the world to pass away, the holy to come,
    and the unholy to repent; prophets are permitted to give thanks as much as they
    wish.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person who comes and teaches the previously stated teaching is to be received,
    but a teacher who turns aside to another teaching that overthrows it is not to
    be heard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An apostle who comes is to be received as the Lord, but if he remains three
    days or asks for money, he is identified as a false prophet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A prophet speaking in the spirit is not to be tried or judged, yet not everyone
    speaking in the spirit is a prophet; the prophet and false prophet are to be known
    from their ways.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A prophet who orders a meal in the spirit and eats from it, or who teaches
    truth without doing what he teaches, is identified as a false prophet.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Someone coming in the Lord's name is first received and afterward tested and
    known; a traveler is helped for a limited time, while a resident artisan is to
    work and eat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A person without a trade is to be provided for so that no idler lives with
    the community as a Christian; a person who refuses this pattern is described as
    making gain out of Christ.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A true prophet or true teacher settling among the community is worthy of support,
    and first portions from agricultural products, animals, bread, wine, oil, money,
    clothing, and possessions are to be given to prophets or, if there is no prophet,
    to the poor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the Lord's day the community is to assemble, break bread, and give thanks
    after confessing transgressions, so that the sacrifice may be pure.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Anyone with a controversy with a friend is not to join the assembly until
    reconciliation occurs, so that the sacrifice is not profaned.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The community is instructed to appoint worthy bishops and deacons who are
    meek, not avaricious, upright, and proved, because they perform service associated
    with prophets and teachers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Members are instructed to reprove one another without anger, and communication
    with an offender is restricted until repentance; prayers, alms, and deeds are
    to follow the gospel.
  category: action
  evidence_refs:
  - ev:10
