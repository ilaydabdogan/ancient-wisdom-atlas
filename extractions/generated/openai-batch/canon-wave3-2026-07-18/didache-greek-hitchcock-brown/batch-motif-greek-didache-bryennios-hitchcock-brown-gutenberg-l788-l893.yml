candidate_motifs:
- id: motif:1
  label: thanksgiving for divine gifts and sacred nourishment
  taxonomy_refs:
  - sacred_exchange
  basis: 'The passage presents a reciprocal pattern: God gives creation, food, drink,
    spiritual nourishment, and eternal life, and humans respond with thanksgiving.'
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage is liturgical instruction
    rather than a narrative of exchange.
- id: motif:2
  label: gathering the sanctified community into the prepared kingdom
  taxonomy_refs:
  - return
  basis: The church is to be gathered from the four winds into the kingdom prepared
    for it while the world is asked to pass away.
  evidence_refs:
  - ev:2
  confidence: low
  cautions: The passage says gathering, not an explicit return journey; the taxonomy
    fit is approximate and should be reviewed.
- id: motif:3
  label: discernment of true and false religious agents
  taxonomy_refs:
  - wisdom
  basis: Teachers, apostles, prophets, and travelers are tested by teaching, ways,
    duration of stay, requests for money, work, and conduct.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: This is an instructional pattern rather than a mythic episode.
- id: motif:4
  label: divine rather than communal judgment of the proved prophet
  taxonomy_refs:
  - divine_judgment
  basis: A proved true prophet acting in relation to the mystery of the church is
    not to be judged among the community, because he has his judgment with God.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not narrate an enacted judgment; it states a rule about
    who may judge.
- id: motif:5
  label: first portions supporting sacred specialists and the poor
  taxonomy_refs:
  - sacred_exchange
  basis: The community gives first portions of produce, animals, bread, wine, oil,
    money, clothing, and possessions to prophets, or to the poor when no prophet is
    present.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The pattern is prescriptive and communal rather than mythic narrative.
- id: motif:6
  label: pure sacrifice through confession and reconciliation
  taxonomy_refs:
  - sacrifice
  basis: The Lord's day assembly includes bread-breaking and thanksgiving after confession
    so that the sacrifice may be pure; unresolved controversy requires reconciliation
    before joining.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage uses sacrificial language for communal worship; it does not
    describe animal sacrifice.
- id: motif:7
  label: ordered community under gospel rule
  taxonomy_refs:
  - covenant
  basis: The passage repeatedly requires conduct according to the gospel, including
    reception, testing, appointment of worthy ministers, peaceful reproof, repentance,
    prayers, alms, and deeds.
  evidence_refs:
  - ev:3
  - ev:9
  - ev:10
  confidence: medium
  cautions: The term covenant is not used in the passage; the taxonomy reference is
    based on rule-bound communal obligation and needs review.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the conduct of a proved true prophet with
    the conduct of ancient prophets, supporting only a cautious functional comparison.
  claim_level: same_function
  target: ancient prophets
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: No ancient prophet is named and no specific story is retold; the comparison
    is a general appeal to precedent.
- id: claim:2
  claim: The passage anchors communal practices in the gospel by referring to the
    ordinance of the gospel and by directing reproof, prayers, alms, and deeds according
    to the gospel.
  claim_level: same_function
  target: gospel tradition as a nearby Christian textual authority
  evidence_refs:
  - ev:3
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not quote a specific gospel episode in these instructions;
    it invokes the gospel as an authority for practice.
