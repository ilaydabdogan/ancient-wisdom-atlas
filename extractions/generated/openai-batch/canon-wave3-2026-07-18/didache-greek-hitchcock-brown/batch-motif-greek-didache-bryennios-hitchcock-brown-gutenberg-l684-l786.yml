candidate_motifs:
- id: motif:1
  label: two opposed ways of life and death
  taxonomy_refs:
  - duality
  basis: The passage explicitly names 'the way of life' and 'the way of death' and
    contrasts commands leading to life with a catalogue of cursed conduct.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents an ethical-ritual opposition, not a narrative journey.
- id: motif:2
  label: guarding received divine commandments
  taxonomy_refs:
  - covenant
  basis: The addressee is told not to forsake the Lord's commandments, but to guard
    what has been received, neither adding nor taking away.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The word covenant is not used in the passage; the taxonomy link is based
    only on commandments received and guarded.
- id: motif:3
  label: initiatory washing with water and fasting
  taxonomy_refs:
  - initiation
  basis: Baptism is prescribed with water into the divine name, and fasting before
    baptism is required of ritual participants.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage is prescriptive ritual instruction rather than a narrative
    initiation scene.
- id: motif:4
  label: almsgiving as sacred exchange or ransom
  taxonomy_refs:
  - sacred_exchange
  basis: Giving by one's hands is described as a ransom for sins, and the giver is
    told to know the good dispenser of recompense.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives ethical instruction; it does not narrate an exchange
    event.
- id: motif:5
  label: sacred meal restricted to initiated participants
  taxonomy_refs:
  - sacred_exchange
  basis: The Eucharist involves thanksgiving over cup and bread, and only those baptized
    into the Lord's name may eat or drink it.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: medium
  cautions: The taxonomy label is approximate; the passage emphasizes thanksgiving
    and access boundaries rather than barter or sacrifice.
- id: motif:6
  label: scattered fragments gathered into one community
  taxonomy_refs: []
  basis: The broken bread, once scattered over the hills and gathered into one, is
    used in a prayer that the church be gathered from the ends of the earth into the
