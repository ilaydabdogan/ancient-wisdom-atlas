canonical_text:
  quote: ''
  summary: The passage gives instructions on the way of life, lists the way of death,
    warns against false teaching and idol-offered food, and prescribes baptism, fasting,
    prayer, and Eucharistic thanksgiving within an early Christian community.
  language: English translation of Ancient Greek
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressee is told to remember and honor the one who speaks the word of
    God, because where what pertains to the Lord is spoken, the Lord is present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is instructed to seek the saints daily, avoid division, make
    peace, judge justly, and avoid partiality in convicting transgressions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage commands giving, sharing with the needy and one's brother, and
    not claiming possessions as one's own.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage instructs parents to teach children the fear of God, masters not
    to command slaves or handmaids in bitterness, and slaves to be subject to their
    lords.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The addressee is told not to forsake the Lord's commandments, not to add or
    subtract from what was received, to confess transgressions in church, and not
    to approach prayer with an evil conscience.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage identifies the preceding commands as the way of life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The way of death is described as evil and full of curse, followed by a catalogue
    of acts and dispositions such as murder, adultery, theft, idolatry, false testimony,
    hypocrisy, greed, and persecution of the good.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Children are warned to be delivered from the listed features of the way of
    death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The addressee is warned not to be led astray from the way of the teaching
    by someone teaching apart from God.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says that one who can bear the whole yoke of the Lord will be
    perfect, while one who cannot should do what one is able.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage warns especially against food offered to idols, calling it worship
    of dead gods.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Baptism is to be performed into the name of the Father, Son, and Holy Spirit,
    preferably in running water, with alternatives involving other water, warm water,
    or pouring water on the head three times.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before baptism, the baptizer, the baptized, and others who can are to fast,
    and the baptized is to fast for two or three days beforehand.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The community's fasting is not to match that of the hypocrites; different
    days of the week are prescribed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The community is instructed to pray as the Lord commanded in his gospel, using
    the prayer addressed to the Father in heaven, and to pray this way three times
    each day.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The Eucharistic thanksgiving over the cup thanks the Father for the holy vine
    of David made known through Jesus.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The Eucharistic thanksgiving over the broken bread thanks the Father for life
    and knowledge made known through Jesus.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:18
  text: The broken bread is compared to bread once scattered over the hills and gathered
    into one, and the church is prayed to be gathered from the ends of the earth into
    the kingdom.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:19
  text: Only those baptized into the Lord's name may eat or drink of the Eucharist.
  category: action
  evidence_refs:
  - ev:14
- id: obs:20
  text: The passage cites the Lord's saying not to give what is holy to dogs.
  category: speech
  evidence_refs:
  - ev:14
