- id: motif:5
  label: resurrection and visible return on heavenly clouds
  taxonomy_refs:
  - resurrection
  - return
  basis: The signs of truth include resurrection of the dead, and the Lord comes with
    the saints and is seen on the clouds of heaven.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The text qualifies the resurrection as not of all; the extraction does
