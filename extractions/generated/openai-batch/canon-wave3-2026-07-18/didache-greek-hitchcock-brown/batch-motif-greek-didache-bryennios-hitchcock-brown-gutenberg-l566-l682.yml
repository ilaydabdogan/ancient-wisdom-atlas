- id: motif:6
  label: Two Ways of life and death
  taxonomy_refs:
  - duality
  - wisdom
  basis: The teaching explicitly states that there are two ways, one of life and one
    of death, and begins to define the way of life in moral terms.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is a didactic pattern rather than a narrative episode.
- id: motif:7
  label: enemy-love, nonretaliation, and radical giving
  taxonomy_refs:
  - wisdom
  basis: The teaching commands blessing, prayer and fasting for persecutors, love
    of enemies, turning the other cheek, going a second mile, and giving to requesters.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The motif is ethical-instructional; no mythic actors beyond the addressed
    community and ethical others are introduced.
- id: motif:8
  label: moral accountability and repayment
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: A person taking without need must give account, undergo examination under
    arrest, and pay the last farthing.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The scene is juridical and moral; the passage does not explicitly identify
    it as postmortem judgment.
- id: motif:9
  label: vices begetting greater wrongs
  taxonomy_refs:
  - wisdom
  basis: The instruction presents chains in which anger begets murders, lust begets
    adulteries, occult practices beget idolatry, lying begets thefts, and murmuring
    begets blasphemies.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This is a moral-causal teaching pattern, not a genealogical myth.
