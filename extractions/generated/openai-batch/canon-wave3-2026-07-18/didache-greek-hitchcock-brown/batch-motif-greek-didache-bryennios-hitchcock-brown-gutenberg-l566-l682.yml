canonical_text:
  quote: ''
  summary: 'The passage exhorts its hearers to remain watchful for the Lord’s unknown
    coming, gathers an end-time sequence of false prophets, social betrayal, a world-deceiver,
    fiery testing, signs of truth, resurrection, and the Lord’s arrival on the clouds,
    and then presents the beginning of the English Teaching: the Two Ways of life
    and death, commands of love, nonretaliation, giving, prohibitions, causal chains
    of vice, and exhortations to humility and virtue.'
  language: Ancient Greek with English translation material in the supplied range
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressees are told to watch over their life, keep their lamps from being
    extinguished, keep their loins from being loosened, and be ready because they
    do not know the hour when the Lord comes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressees are told to gather frequently while seeking things pertaining
    to their souls; the text says their whole time of faith will not profit them unless
    they are perfected at the last time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the last days, false prophets and corrupters multiply; sheep turn into
    wolves, love turns into hate, lawlessness increases, and people hate, persecute,
    and betray one another.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A figure called the world-deceiver appears as a son of God, performs signs
    and wonders, receives the earth into his hands, and does unlawful deeds described
    as unprecedented.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Human creation comes into fiery testing; many stumble and perish, while those
    who endure in their faith are saved.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The signs of truth are listed as a sign of outspreading in heaven, a sign
    of the voice of a trumpet, and a resurrection of the dead; the resurrection is
    specified as not of all.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Lord is said to come with all the saints, and the world sees the Lord
    coming upon the clouds of heaven.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The English teaching states that there are two ways, one of life and one of
    death, and that there is a great difference between them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The way of life begins with loving the God who made the hearer, loving the
    neighbor as oneself, and not doing to another what one would not wish to suffer.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The teaching commands blessing those who curse, praying and fasting for enemies
    and persecutors, loving those who hate, nonretaliation, going beyond what is compelled,
    and giving to those who ask.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage distinguishes guiltless giving and accountable taking; one who
    takes without need must give account, is examined under arrest, and does not go
    out until paying the last farthing.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A saying about alms states that alms should sweat in the hands until the giver
    knows to whom to give.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The second commandment section lists prohibitions against killing, adultery,
    corrupting boys, fornication, theft, magic, sorcery, abortion or destroying what
    is begotten, coveting, perjury, false witness, reviling, malice, double-mindedness,
    and double-tongued speech.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The instruction says that anger and related passions beget murders; lust and
    related traits beget adulteries; omen-watching, enchantment, astrology, and purification
    practices beget idolatry; lying, avarice, and vainglory beget thefts; and murmuring,
    presumption, and evil-mindedness beget blasphemies.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The addressee is told to be meek, long-suffering, pitiful, guileless, gentle,
    and good, to tremble at the words heard, not to exalt oneself, to dwell with the
    righteous and lowly, and to accept events as well-wrought because nothing occurs
    without God.
  category: speech
  evidence_refs:
  - ev:12
