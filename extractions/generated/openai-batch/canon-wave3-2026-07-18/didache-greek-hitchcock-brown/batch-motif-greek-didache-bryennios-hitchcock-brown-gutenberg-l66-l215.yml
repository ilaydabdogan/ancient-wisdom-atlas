canonical_text:
  quote: Ὁδοὶ δύο εἰσί, μία τῆς ζωῆς καὶ μία θανάτου...
  summary: The passage includes editorial front matter about the publication of the
    Didache and the opening of the work itself. The Didache is introduced as the Lord’s
    teaching through the twelve apostles to the nations. Chapter 1 presents two ways,
    one of life and one of death, then describes the way of life through commandments
    to love God and neighbor, avoid doing to another what one would not want done
    to oneself, bless and pray for enemies, refuse retaliation, give generously, and
    exercise discernment in almsgiving.
  language: Ancient Greek with English editorial front matter
  quote_policy: quoted
