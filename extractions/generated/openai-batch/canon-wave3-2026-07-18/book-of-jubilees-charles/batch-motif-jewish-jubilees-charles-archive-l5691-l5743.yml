    and twenty-two generations or heads of mankind from Adam to Jacob. It also notes
    a relation between the Sabbath and Jacob: both are described as blessed and holy,
    each stands at the close of a twenty-twofold sequence, and the Sabbath is said
    to be given to Israel alone.'
