canonical_text:
  quote: ''
  summary: The passage describes Enoch writing down the world’s condemnation, judgment,
    and human wickedness, serving as a sign and witness against humanity until the
    day of condemnation. It says God brought flood waters on Eden, and that Enoch
    burned acceptable sanctuary incense on a mount. It identifies four places belonging
    to the Lord on earth—Eden, the Mount of the East, Sinai, and Zion—and states that
    Zion will be sanctified in the new creation so that the earth may be sanctified
    from guilt and uncleanness. The passage then continues the genealogy from Methuselah
    to Lamech and from Lamech to Noah. Editorial notes compare these traditions with
    Ethiopic Enoch, Slavonic Enoch, and other nearby traditions, and discuss possible
    identifications of the Mount of the East.
  language: English
  quote_policy: summarized
