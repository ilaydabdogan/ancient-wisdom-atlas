canonical_text:
  quote: ''
  summary: Esau intends to kill Jacob after Isaac’s death. Rebecca learns of the threat
    in a dream and urges Jacob to flee to Laban in Haran. Jacob resists leaving without
    Isaac’s authorization. Rebecca speaks to Isaac about the danger of Jacob marrying
    Canaanite women. Isaac blesses Jacob, commands him not to marry a Canaanite woman,
    sends him to Laban’s household in Mesopotamia, and invokes the Abrahamic blessing
    and land promise. Jacob departs; Rebecca grieves, and Isaac comforts her with
    the assurance that Jacob will return in peace.
  language: English
  quote_policy: summarized
