- id: obs:3
  text: The work is described as incorporating traditional lore and fresh legal enactments
    and as constituting an enlarged Targum on Genesis and Exodus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The work is said to solve difficulties in the biblical narrative, supply gaps,
