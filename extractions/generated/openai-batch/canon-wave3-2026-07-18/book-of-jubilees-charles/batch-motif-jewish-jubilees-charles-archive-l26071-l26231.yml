canonical_text:
  quote: ''
  summary: 'The passage presents Sabbath regulations: burdens and work are forbidden,
    preparation is to be made on the sixth day, Israel is to eat, drink, rest, and
    bless the Lord on the holy festival day, and sanctuary offerings are the one permitted
    Sabbath work. Further prohibitions include journeying, farming, lighting fire,
    riding an animal, and ship travel. Editorial notes compare several rules with
    biblical, rabbinic, Karaite, Samaritan, and related legal traditions.'
  language: English
  quote_policy: summarized
