  quote: on this we kept Sabbath in the heavens before it was made known to any flesh
    to keep Sabbath thereon on the earth.
  summary: The passage gives Sabbath restrictions about preparation, drawing water,
    carrying burdens, and moving items from house to house. It states that the Sabbath
    is holier and more blessed than jubilee days, was kept in heaven before being
    revealed to earthly beings, and was blessed by the Creator. The accompanying notes
    identify Israel as the people uniquely sanctified to keep the Sabbath and describe
    it as a special sign between God and Israel.
