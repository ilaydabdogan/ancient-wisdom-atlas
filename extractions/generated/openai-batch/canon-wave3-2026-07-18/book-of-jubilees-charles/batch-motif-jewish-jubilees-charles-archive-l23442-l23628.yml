  summary: The passage recounts fighting between Jacob’s sons and the forces of Esau/Edom,
    the death and burial of Esau, the pursuit of Esau’s sons to Seir, their submission
    under servitude and tribute, and a subsequent list of kings who reigned in Edom
    before Israelite monarchy. Editorial notes compare parts of the account with Yalkut,
    the Chronicle of Jerahmeel, the Testament of Judah, and Genesis 36.
