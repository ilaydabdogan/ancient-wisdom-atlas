    Jared. Jared’s days are associated with the descent of the angels of the Lord
    to earth. The notes discuss kinship-marriage changes and compare the angel-descent
    tradition with Genesis 6:1-4, Isaiah 24:21, Enochic literature, and later Jewish
    interpretations.'
