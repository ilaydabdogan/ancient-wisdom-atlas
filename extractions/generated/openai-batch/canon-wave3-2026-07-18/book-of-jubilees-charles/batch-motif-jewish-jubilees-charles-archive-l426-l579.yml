  summary: The passage discusses titles and designations for Jubilees, especially
    “Jubilees,” “The Little Genesis,” “Apocalypse of Moses,” and “Testament of Moses.”
    It explains the title “Jubilees” by the book’s division of world history from
    creation to Sinai into forty-nine-year periods, notes its heptadic chronology
    and Israel’s entry into Canaan at the fiftieth jubilee, describes the work as
    a fuller treatment of Genesis details, and reports traditions identifying Moses
    as recipient of disclosures. It also mentions an account of Moses’ death and a
    strife between Michael and evil angels for Moses’ body in a related discussion.
