    Satan or evil one remaining.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The Sabbath command requires six days of labor and no work on the seventh
    day by Israelites, their children, servants, cattle, or sojourners.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that anyone who works on or desecrates the Sabbath shall
