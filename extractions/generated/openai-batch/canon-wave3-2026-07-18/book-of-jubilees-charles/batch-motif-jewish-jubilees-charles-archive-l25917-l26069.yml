- id: obs:2
  text: The Passover rite includes slaughter in the evening, placing blood on the
    threshold of the altar, placing fat on the altar fire, and eating roasted flesh
    in the sanctified court.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moses is instructed to command the children of Israel to observe Passover
    annually, eat unleavened bread for seven days, observe the festival, and bring
    a daily oblation during those days.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The festival is linked retrospectively to Israel leaving Egypt in haste and
    completing the observance on the shore of the sea before the wilderness of Shur.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says that Sabbaths, land sabbaths, year-weeks, and jubilee years
