canonical_text:
  quote: ''
  summary: The passage gives regulations for Passover at the tabernacle or house of
    the Lord, including slaughter, blood, altar fire, eating roasted flesh, and the
    annual festival of unleavened bread. It recalls the hurried observance after leaving
    Egypt, then turns to Sabbaths, land sabbaths, jubilee years, future entry into
    Canaan, the cleansing of Israel and the land, the removal of Satan or any evil
    one, and Sabbath prohibitions with death as the stated penalty for desecration.
  language: English
  quote_policy: summarized
