canonical_text:
  quote: ''
  summary: 'The passage explains a territorial-allotment tradition: Palestine is said
    to have fallen by lot to Arpachshad, while Canaan received north-west Africa but
    wrongfully seized Palestine. Cited parallels state that Palestine or Judaea belonged
    to Shem''s lot, that Canaan son of Ham seized it, that God delayed judgment to
    allow repentance and restoration, and that God later avenged the oath violation.
    Other cited parallels describe Canaan seizing the better land toward Lebanon and
    Shem receiving the central land including Judaea.'
