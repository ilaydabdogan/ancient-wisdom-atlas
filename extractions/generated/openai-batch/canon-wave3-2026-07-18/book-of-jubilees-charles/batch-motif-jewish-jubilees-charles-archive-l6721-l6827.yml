canonical_text:
  quote: ''
  summary: After the provision of covering for shame, the passage says that a law
    of covering shame is prescribed on the heavenly tables. Adam and his wife leave
    the Garden of Eden on the new moon of the fourth month, dwell in the land of Elda,
    Adam names his wife Eve, they have no son until the first jubilee, and Adam tills
    the land as instructed in Eden. The accompanying notes interpret the law as an
    anti-Hellenizing protest, explain the date of expulsion, and note that Eve is
    represented as a virgin until after the expulsion.
