canonical_text:
  quote: ''
  summary: The passage closes a note on Israel leaving Egypt with Egyptian vessels
    and garments, then gives Passover regulations. It recounts the night when the
    powers of Mastema slew Egypt's first-born, while houses marked with lamb's blood
    on their lintels were passed over and spared. Israel eats the paschal lamb, drinks
    wine, praises the Lord, and prepares to leave bondage. The passage commands annual
    observance of Passover as an eternal ordinance engraved on the heavenly tables,
    and states penalties for a clean nearby man who fails to observe it.
  language: English
  quote_policy: summarized
