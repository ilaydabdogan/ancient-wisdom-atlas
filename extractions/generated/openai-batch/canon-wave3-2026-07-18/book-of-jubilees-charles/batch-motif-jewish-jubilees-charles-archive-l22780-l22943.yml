canonical_text:
  quote: "“slept the eternal sleep”"
  summary: Isaac blesses his sons and their descendants after concern over the birthright
    is eased; the brothers eat and rest together. Isaac then dies at one hundred and
    eighty years old and is buried by Esau and Jacob. Esau settles in Edom/Seir, while
    Jacob remains in Hebron, worshipping according to visible commands and ordered
    time divisions. Leah dies and is buried in the double cave near Rebecca and Sarah;
    Jacob and the sons mourn her, and the passage praises her gentleness and uprightness.
    The following heading and note introduce an Esau-Jacob war legend also attested
    in other Jewish traditions.
  language: English
  quote_policy: quoted
