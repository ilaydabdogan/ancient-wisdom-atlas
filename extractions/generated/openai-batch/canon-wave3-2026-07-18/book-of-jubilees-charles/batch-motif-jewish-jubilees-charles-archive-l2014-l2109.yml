canonical_text:
  quote: This secret tradition had been handed down from father to son.
  summary: The passage characterizes Jubilees as a revelation of God to Moses that
    supplements and interprets the Pentateuch. It describes an esoteric ancestral
    tradition transmitted through patriarchs, sacred books, and a sacred language,
    ultimately entrusted to Levi and the priesthood. It then summarizes the author's
    aim as defending Judaism against Hellenism by presenting the law as eternal, heavenly,
    and historically enacted by primordial and patriarchal figures through laws, feasts,
    sacrifices, and separation from Gentiles.
  language: English
  quote_policy: quoted
