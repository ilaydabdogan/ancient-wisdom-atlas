canonical_text:
  quote: "“Come up to Me on the Mount, and I will give thee two tables of stone...”"
  summary: In the first year after Israel’s exodus, God summons Moses up the Mount
    to receive two stone tables of law and commandment. Moses ascends the mount of
    God; the glory of the Lord abides on Mount Sinai, a cloud overshadows it for six
    days, and Moses is called on the seventh day from within the cloud. The glory
    appears like flaming fire on the mountaintop, and Moses remains on the Mount forty
    days and forty nights while God teaches him earlier and later history.
