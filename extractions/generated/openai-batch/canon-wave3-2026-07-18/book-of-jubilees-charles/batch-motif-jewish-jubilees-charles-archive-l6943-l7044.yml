canonical_text:
  quote: ''
  summary: 'The passage continues the Cain and Abel account: Cain is made a fugitive
    and cursed because of his brother''s blood. A curse against treacherous smiting
    and silent witnesses is said to be written on the heavenly tables. The speakers
    announce sins before the Lord. Adam and his wife mourn Abel, later rejoice, and
    have Seth, described as a second seed in place of Abel. Adam also begets Aztire.
    Cain takes his sister Awan as wife; she bears Enoch. Houses are built on earth,
    and Cain builds a city named after his son Enoch. The supplied excerpt also includes
    translator notes comparing the wording with Genesis and Deuteronomy passages.'
  language: English
  quote_policy: summarized
