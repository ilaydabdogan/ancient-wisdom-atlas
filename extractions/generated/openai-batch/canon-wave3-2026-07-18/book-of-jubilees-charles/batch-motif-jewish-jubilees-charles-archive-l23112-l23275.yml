canonical_text:
  quote: ''
  summary: Esau is described as remembering hidden evil against Jacob and forgetting
    an oath sworn to his parents not to devise evil against his brother. Jacob, mourning
    Leah, does not know Esau is approaching with four thousand armed men until warned
    by the men of Hebron. Jacob closes the tower gates, stands on the battlements,
    and challenges Esau over the broken oath. Esau replies that no oath endures forever
    among humans or beasts, says brotherhood with Jacob cannot be observed, and frames
    reconciliation through impossible animal transformations and predator-prey peace
    images.
  language: English
  quote_policy: summarized
