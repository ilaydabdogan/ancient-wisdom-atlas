canonical_text:
  quote: "“Lay not thy hand upon the lad, neither do thou anything to him”"
  summary: A heavenly speaker stops Abraham from harming his son, saying Abraham's
    fear of the Lord has been shown. The prince of Mastema is shamed. Abraham offers
    a ram caught by its horns instead of his son, names the place “The Lord hath seen,”
    and the place is identified as Mount Sion. The Lord then swears to bless and multiply
    Abraham's seed because of his obedience. Abraham returns to Beersheba and commemorates
    the event with an annual seven-day festival, which is said to be ordained on the
    heavenly tables for Israel and its seed.
  language: English
  quote_policy: quoted
