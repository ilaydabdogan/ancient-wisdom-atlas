canonical_text:
  quote: ''
  summary: A scholarly introduction discusses the dating and calendar system of Jubilees.
    It notes an unsettled calendar context, frequent use of the divine title “Most
    High God,” and the absence of the phrase “feast of Pentecost.” It then describes
    Jubilees’ chronology as revealed from heavenly tables to Moses by the angel of
    the presence, organized around sevenfold jubilee periods and 364-day years, and
    compares these chronological patterns with Ethiopic Enoch, the Samaritan Chronicle,
    the Assumption of Moses, and other Jewish chronological traditions.
  language: English
  quote_policy: summarized
