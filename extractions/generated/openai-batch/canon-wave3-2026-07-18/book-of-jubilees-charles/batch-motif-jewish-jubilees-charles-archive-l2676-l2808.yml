- id: obs:1
  text: The introduction states that the calendar was unsettled when the author of
    Jubilees wrote, and it compares the calendar system with an allied system in Ethiopic
    Enoch lxxii-lxxxii.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The introduction states that the divine title “Most High God” is frequent
    in Jubilees and discusses its use in relation to Maccabean-era and later writings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The introduction states that the phrase “feast of Pentecost” for the feast
    of weeks seems to have been unknown to the author of Jubilees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The introduction states that the author of Jubilees claims his chronological
    system is derived from heavenly tables and was made known to Moses by the angel
    of the presence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The introduction describes the chronology of Jubilees as heptadic: each jubilee
    consists of seven year-weeks, and each year-week consists of seven years, making
    a jubilee of forty-nine years.'
  category: attribute
  evidence_refs:
