canonical_text:
  quote: ''
  summary: Joseph detains Simeon and sends the other brothers back to Canaan with
    food and concealed money, requiring them to bring Benjamin. Jacob fears losing
    Benjamin, but the worsening famine compels another journey after Judah pledges
    responsibility. In Egypt Joseph recognizes Benjamin, hosts the brothers, gives
    Benjamin a sevenfold portion, and arranges a test by having his silver cup placed
    in Benjamin's sack. The steward pursues the brothers, accuses them of theft, and
    states that only the one found with the cup will become a servant.
  language: English
  quote_policy: summarized
