canonical_text:
  quote: ''
  summary: A divine speaker reassures Jacob about his burial with Abraham and Isaac,
    commands him to write what he has seen and read, promises to restore his memory,
    and departs upward. Jacob wakes, remembers, writes the words, and celebrates an
    additional sacrificial day, naming it “Addition,” while the former days are called
    “The Feast.” The added celebration is said to be revealed and written on heavenly
    tables.
  language: English
  quote_policy: summarized
