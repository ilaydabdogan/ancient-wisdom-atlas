  summary: The passage describes divine judgment on corrupt beings, the ordaining
    and writing of all judgments on heavenly tables, God’s impartial refusal of gifts
    in judgment, promised forgiveness for Israel if they turn in righteousness, and
    Noah’s unique acceptance before the flood, with his sons saved through him and
    Noah commanded to make an ark against the flood waters.
