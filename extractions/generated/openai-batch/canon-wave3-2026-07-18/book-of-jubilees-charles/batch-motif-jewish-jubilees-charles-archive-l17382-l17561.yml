  summary: The passage describes Abraham completing his life old and righteous, contrasts
    earlier forefathers’ long lives with the post-Flood decline of human lifespan,
    foretells that generations up to the great judgment will age quickly and lose
    knowledge, lists accumulating calamities and sufferings for an evil generation,
    and says sons will accuse fathers and elders of sin.
