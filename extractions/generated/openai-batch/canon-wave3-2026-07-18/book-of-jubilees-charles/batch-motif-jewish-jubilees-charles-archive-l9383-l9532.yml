  quote: And all the days of the commandment will be two and fifty weeks of days,
    and (these will make) the entire year complete.
  summary: The passage presents a calendrical commandment in which memorial observances
    move through a fourfold sequence, the complete year consists of fifty-two weeks
    of days, and the ordinance is engraved and ordained on the heavenly tables. It
    adds that the commandment must not be neglected from year to year. Editorial notes
    explain this as a 364-day year with four seasons and discuss possible civil and
    ecclesiastical calendar systems.
