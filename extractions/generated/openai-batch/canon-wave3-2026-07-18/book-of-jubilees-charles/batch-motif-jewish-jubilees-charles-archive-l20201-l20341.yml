  quote: ''
  summary: The supplied passage presents the killing of the Shechemites by the sons
    of Jacob as a heavenly ordained judgment for dishonoring Dinah. It then extends
    the episode into rules against giving an Israelite daughter or sister to a Gentile,
    prescribing stoning, burning with fire, and exclusion from Israel for defilement.
    The surrounding notes compare this treatment with other Jewish and biblical traditions.
  language: English
