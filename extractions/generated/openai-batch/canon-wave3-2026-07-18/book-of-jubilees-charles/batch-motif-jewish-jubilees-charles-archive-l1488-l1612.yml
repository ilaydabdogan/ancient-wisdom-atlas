canonical_text:
  quote: ''
  summary: The introduction argues that Jubilees preserves an independent Hebrew form
    of the Pentateuch related especially to the LXX and Syriac textual traditions,
    proposes a date range on textual grounds, and discusses larger lacunae in the
    text. It treats a disputed passage about twenty-two Hebrew letters and twenty-two
    books, cites related evidence for numerical correspondences, and notes lost or
    damaged material concerning agricultural law, Cain, Abram’s pursuit of kings,
    captives, and Melchizedek.
  language: English, with quoted Greek and Latin excerpts
  quote_policy: summarized
