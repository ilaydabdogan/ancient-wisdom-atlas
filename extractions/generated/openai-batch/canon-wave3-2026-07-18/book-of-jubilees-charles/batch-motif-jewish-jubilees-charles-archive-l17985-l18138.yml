canonical_text:
  quote: ''
  summary: The passage describes the righteous seeing peace and judgment against enemies,
    their bones resting and spirits rejoicing, and Moses being told to write testimony
    on heavenly tables. It then narrates Isaac's blessing and settlement at the Well
    of Vision, a famine, Esau's sale of his birthright to Jacob for bread and red
    lentil pottage, Jacob's elevation over Esau, Isaac's movement toward Gerar during
    famine, and the Lord's appearance to Isaac with commands and promises of land,
    descendants, and blessing rooted in the oath to Abraham.
  language: English
  quote_policy: summarized
