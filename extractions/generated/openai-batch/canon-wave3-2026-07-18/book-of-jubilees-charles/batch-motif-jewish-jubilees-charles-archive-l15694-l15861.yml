canonical_text:
  quote: ''
  summary: Sarah dies in Hebron. Abraham mourns, is tested for patience, negotiates
    gently with the children of Heth, pays in full for the double cave near Mamre/Hebron,
    and buries Sarah there. The passage identifies this as Abraham's tenth trial and
    says he is recorded on the heavenly tables as the friend of God. It then reports
    Isaac's marriage to Rebecca, Abraham's marriage to Keturah and her six sons, and
    the birth and contrasting traits of Jacob and Esau.
  language: English
  quote_policy: summarized
