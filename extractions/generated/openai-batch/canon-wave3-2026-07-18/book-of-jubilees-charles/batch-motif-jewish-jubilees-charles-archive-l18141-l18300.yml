canonical_text:
  quote: ''
  summary: Isaac dwells in Gerar under Abimelech’s protection, becomes wealthy, and
    is envied by the Philistines. The Philistines stop up Abraham’s wells, Isaac departs
    to the valleys of Gerar, and his servants reopen or dig wells. Several wells receive
    names connected to disputes or lack of dispute. Isaac goes to the Well of the
    Oath, receives a divine appearance and promise of blessing and multiplied seed,
    builds an altar, sacrifices, and names the place for an oath with Abimelech and
    his associates.
  language: English
  quote_policy: summarized
