canonical_text:
  quote: ''
  summary: A mother blesses her son with numerous descendants, land, peace, divine
    presence, and sanctuary. Isaac, old and dim-sighted, sends Esau to hunt and prepare
    savory meat so that Isaac may bless him before death. Rebecca hears this, instructs
    Jacob to bring goat kids, prepares food, clothes Jacob in Esau’s garments, covers
    him with goat skins, and sends him to Isaac. Jacob presents himself to Isaac with
    the prepared food and attributes his quick success to God.
  language: English
  quote_policy: summarized
