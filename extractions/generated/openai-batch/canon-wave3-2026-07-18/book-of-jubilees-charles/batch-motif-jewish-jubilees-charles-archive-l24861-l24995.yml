canonical_text:
  quote: ''
  summary: The passage recounts Israel/Jacob and his sons dwelling in Goshen during
    the Egyptian famine, Joseph feeding his family and administering Egypt for Pharaoh,
    the return of river overflow and agricultural sowing, Joseph's fifth-part harvest
    ordinance, Israel's deathbed blessing and burial in the double cave at Hebron,
    the transfer of ancestral books to Levi, and the later multiplication and unity
    of the children of Israel in Egypt.
  language: English
  quote_policy: summarized
