canonical_text:
  quote: ''
  summary: The passage says that Zion and Jerusalem will be holy and refers to a king
    on Mount Zion. The angel of the presence takes tables recording divisions of years
    from creation through law, weeks, and jubilees, extending to the renewal of heaven,
    earth, and luminaries and the making of the Lord's sanctuary in Jerusalem on Mount
    Zion. The following chapter heading summarizes creation in twenty-two acts over
    six days and the institution of the Sabbath, and the angel begins to speak to
    Moses according to the Lord's word.
