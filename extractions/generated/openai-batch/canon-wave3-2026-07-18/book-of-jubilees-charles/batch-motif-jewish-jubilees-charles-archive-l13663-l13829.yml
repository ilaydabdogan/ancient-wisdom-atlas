canonical_text:
  quote: "“Look toward heaven and number the stars, if thou art able to number them.”"
  summary: The passage describes a perpetual ordinance of first-fruits and tithes
    for priests, the king of Sodom asking Abram for the rescued persons while offering
    him the booty, Abram refusing to take Sodom's goods under oath to the Most High
    God, and the Lord appearing to Abram in a dream to promise him an heir from his
    own body and descendants comparable to the stars.
