canonical_text:
  quote: ''
  summary: The passage presents a 364-day year as the ordained calendar that preserves
    feasts and seasons. It warns that neglecting this order, especially through observation
    of the moon, will disrupt seasons, confuse holy and unclean days, cause Israel
    to forget calendrical observances, and lead to further transgression. The speaker
    grounds the teaching in a written book and heavenly tables and commands the addressee
    to testify to later generations.
  language: English
  quote_policy: summarized
