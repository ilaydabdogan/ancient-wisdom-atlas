canonical_text:
  quote: ''
  summary: The Lord addresses Abram, promises the land and a divine relationship with
    Abram and his seed, and instructs him to prepare animals and birds. Abram sacrifices
    at the oak of Mamre near Hebron, pours blood on the altar, divides the animals,
    and drives birds away from the pieces. At sunset Abram experiences ecstasy and
    great darkness, and receives a prophecy of his descendants’ future bondage, divine
    judgment on the oppressing nation, later return, and Abram’s peaceful death. A
    smoking furnace and flame pass between the pieces, and the Lord makes a covenant
    granting land to Abram’s seed.
  language: English
  quote_policy: summarized
