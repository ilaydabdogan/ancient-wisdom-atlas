canonical_text:
  quote: ''
  summary: An unnamed speaker exhorts his sons to fear and worship the creator, to
    love one another as brothers, and not to devise evil. He warns that one who seeks
    to injure his brother will be destroyed and excluded from the book of life, with
    punishment likened to the burning of Sodom. The speaker divides possessions between
    the two, assigning a larger first-born portion including a tower and property
    at the Well of the Oath. Esau states that he has sold and given his birthright
    to Jacob and does not contest the transfer.
  language: English
  quote_policy: summarized
