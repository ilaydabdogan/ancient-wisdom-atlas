canonical_text:
  quote: ''
  summary: Judah goes to Timnah to shear sheep. Tamar, informed of his journey, removes
    her widow's clothing, veils and adorns herself, and sits by the way. Judah mistakes
    her for a harlot and has intercourse with her after giving his ring, necklace,
    and staff as pledges for a promised kid goat. Tamar conceives. Judah later sends
    the kid through his shepherd, but the woman is not found and local people deny
    that a harlot was there. After three months Tamar's pregnancy is reported, and
    Judah orders her burned. She sends the pledge objects to Judah, saying that their
    owner is the father. Judah acknowledges that Tamar is more righteous than he and
    cancels the burning. She later bears Perez and Zerah, and Judah acknowledges his
    wrongdoing.
  language: English
  quote_policy: summarized
