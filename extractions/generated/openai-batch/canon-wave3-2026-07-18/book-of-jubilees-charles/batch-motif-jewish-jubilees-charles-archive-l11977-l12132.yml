canonical_text:
  quote: ''
  summary: 'A divine command limits malignant spirits: nine parts are sent to condemnation
    and one tenth remains under Satan. An angelic speaker teaches Noah medicines and
    herbal remedies; Noah writes them in a book and gives the writing to Shem. Noah
    dies and is buried on Mount Libar in Ararat, while Enoch is described as a witness
    until judgment. The passage then recounts Peleg, Lemna, and Reu, and describes
    humans departing Ararat for Shinar, building a city and tower to ascend into heaven,
    using fire-made bricks and asphalt.'
  language: English
  quote_policy: summarized
