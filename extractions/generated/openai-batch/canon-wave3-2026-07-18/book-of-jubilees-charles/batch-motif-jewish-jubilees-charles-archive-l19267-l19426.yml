canonical_text:
  quote: ''
  summary: Jacob asks Laban for the wife for whom he has served seven years. Laban
    holds a feast but gives Jacob Leah, with Zilpah as her handmaid, while Jacob thinks
    she is Rachel. Jacob discovers the substitution and protests. Laban answers that
    the younger should not be given before the elder, and the passage presents this
    order as written in the heavenly tables and commanded for Israel. After Leah’s
    seven-day feast, Laban gives Rachel, with Bilhah as her handmaid, in return for
    another seven years of Jacob’s service.
  language: English
  quote_policy: summarized
