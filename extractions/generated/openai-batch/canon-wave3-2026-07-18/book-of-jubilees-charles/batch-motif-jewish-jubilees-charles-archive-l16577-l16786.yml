canonical_text:
  quote: ''
  summary: The passage gives instructions about acceptable altar woods, bodily washing
    before and after sacrifice, avoidance and covering of blood, refusal of compensation
    for human blood, warnings against sinful human ways, and blessings for obedience.
    It then begins a dated episode in which Isaac and Ishmael come from the Well of
    the Oath to celebrate the feast of weeks or first-fruits with Abraham, who rejoices.
  language: English
  quote_policy: summarized
