  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The addressee is warned that walking in the ways of the children of men may
    lead to sin unto death, divine rejection, being rooted out of the land, and the
    perishing of name and seed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The addressee is instructed to turn away from uncleanness, observe the ordinance
    of the Most High God, do His will, and be upright.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker says God will bless the addressee’s deeds, raise up the plant
    of righteousness from him, preserve the speaker’s and addressee’s names from being
    forgotten, and bless the addressee’s seed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After receiving the blessing, the addressee goes out rejoicing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the first week of the forty-fourth jubilee, second year, identified as
    the year Abraham died, Isaac and Ishmael come from the Well of the Oath to celebrate
