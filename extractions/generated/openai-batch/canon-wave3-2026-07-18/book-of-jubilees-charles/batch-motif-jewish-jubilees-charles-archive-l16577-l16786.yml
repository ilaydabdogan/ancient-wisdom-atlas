  text: The stated reason for excluding other woods is that their fragrance is dispersed
    and does not go up to heaven.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The addressee is instructed to be clean in body and to wash with water before
    approaching the altar, including washing hands and feet before and after sacrificing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The addressee is warned not to have blood on the body or clothing, to guard
    against blood, and to cover it with dust.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The addressee is commanded not to eat blood because blood is identified as
    the soul.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The addressee is told not to take gifts for human blood; the passage says
