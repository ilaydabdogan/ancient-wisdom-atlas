canonical_text:
  quote: ''
  summary: Isaac reassures Rebecca about Jacob and blesses him. Jacob travels toward
    Haran, stops at Luz/Bethel, sleeps with a stone at his head under a tree, and
    dreams of a ladder between earth and heaven with angels ascending and descending
    and the Lord standing upon it. The Lord promises land, numerous descendants, blessing
    for the nations, protection, and return. Jacob wakes, identifies the place as
    God's house and heaven's gate, sets up and anoints the stone as a pillar, names
    the place Bethel, and vows loyalty and a tithe if God preserves and returns him.
    The supplied passage then begins the next episode, with Jacob going east to Laban
    and serving for Rachel.
  language: English
  quote_policy: summarized
