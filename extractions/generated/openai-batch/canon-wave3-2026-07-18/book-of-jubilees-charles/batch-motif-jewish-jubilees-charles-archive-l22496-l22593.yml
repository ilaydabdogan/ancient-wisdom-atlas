canonical_text:
  quote: ''
  summary: Rebecca summons Jacob and commands him to honor his father and brother.
    Jacob agrees and asks whether she has found any perversity in him. Rebecca says
    she has seen only upright deeds in him, but announces that a dream has shown the
    day of her death. Jacob doubts this because she appears strong and healthy. Rebecca
    then asks Isaac to make Esau swear not to injure or pursue Jacob, accusing Esau
    of hostility, theft of household property, and murderous intent after Isaac’s
    death. She contrasts Esau with Jacob’s continued honoring of his parents. Isaac
    acknowledges Jacob’s honor and says his love has shifted from Esau, the first-born,
    to Jacob because of Esau’s evil deeds.
  language: English
