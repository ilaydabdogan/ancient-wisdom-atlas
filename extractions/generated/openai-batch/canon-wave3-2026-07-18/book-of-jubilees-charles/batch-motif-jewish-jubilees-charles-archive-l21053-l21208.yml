canonical_text:
  quote: ''
  summary: A blessing announces trembling nations, salvation for Jacob and Israel,
    peace connected with a righteous throne, and destruction of enemies. Isaac and
    Jacob are reunited; Jacob recounts divine protection, his vow, a vision, an altar,
    and a prepared sacrifice. Isaac urges Jacob to fulfill the vow, and Rebecca and
    Deborah go with Jacob to Bethel. Jacob recalls Isaac’s blessing of Levi and Judah,
    which is recorded as eternal testimony on heavenly tables. At Bethel, Levi dreams
    that he and his sons are ordained priests of the Most High God forever; Jacob
    gives tithes of all, and Rachel becomes pregnant with Benjamin.
  language: English
  quote_policy: summarized
