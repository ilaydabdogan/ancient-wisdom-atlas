canonical_text:
  quote: For into Sheol will they go, And into the place of condemnation will they
    descend
  summary: Noah warns his children that envy, disharmony, demonic seduction, bloodshed,
    and eating blood will lead to destruction, descent to Sheol, condemnation, darkness,
    and violent death. He commands them to cover shed animal blood, avoid eating blood
    with flesh because blood is life, practice judgment and righteousness, build cities,
    plant fruit trees, and treat fourth-year fruit as holy before the Most High God
    who saved him from the flood.
  language: English
  quote_policy: quoted
