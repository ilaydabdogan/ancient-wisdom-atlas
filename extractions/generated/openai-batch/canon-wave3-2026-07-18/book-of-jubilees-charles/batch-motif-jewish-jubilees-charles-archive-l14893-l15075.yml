canonical_text:
  quote: ''
  summary: Sarah conceives and bears Isaac after the Lord acts as promised. Isaac
    is born at the festival of first-fruits and circumcised by Abraham on the eighth
    day as an everlasting covenant. Heavenly speakers visit Abraham at the Well of
    the Oath, bless him, and announce decrees about his further sons, Isaac’s chosen
    line, and a holy seed belonging to God. Abraham and Sarah rejoice; Abraham builds
    an altar, celebrates a seven-day festival of joy, builds booths, and is described
    as the first to celebrate the feast of tabernacles on earth.
  language: English
  quote_policy: summarized
