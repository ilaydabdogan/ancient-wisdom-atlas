canonical_text:
  quote: ''
  summary: After Rachel bears Joseph, Laban goes away to shear sheep. Jacob calls
    Leah and Rachel and asks them to go with him to Canaan, explaining that a dream
    instructed him to return to his father's house; they agree to go with him. Jacob
    blesses the God of Isaac and Abraham, departs with his wives, children, and possessions,
    crosses the river, and comes to Gilead while concealing his intention from Laban.
    Laban pursues and overtakes Jacob at the mountain of Gilead, but the Lord prevents
    Laban from injuring Jacob by appearing to him in a dream at night. Jacob makes
    a feast, he and Laban swear mutual nonaggression across the mountain of Gilead,
    and Jacob makes a witness heap named “The Heap of Witness.” The passage then describes
    Gilead as the former land of the giant Rephaim, gives their habitations and cities,
    and states that the Lord destroyed them because of their evil deeds.
  language: English
  quote_policy: summarized
