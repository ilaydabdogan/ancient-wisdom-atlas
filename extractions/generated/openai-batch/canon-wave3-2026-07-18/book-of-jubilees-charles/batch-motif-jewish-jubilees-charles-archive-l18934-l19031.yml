canonical_text:
  quote: ''
  summary: 'Isaac tells Esau that Jacob has already been made lord over his brothers
    and strengthened with corn, wine, and oil. Esau asks for a blessing and weeps.
    Isaac answers with an oracle: Esau’s dwelling will be far from the dew of earth
    and heaven; he will live by the sword and serve his brother; when he becomes great
    and shakes off the yoke, he will sin unto death and his seed will be rooted out.
    Esau then threatens Jacob because of the blessing. The included editorial notes
    compare wording with Genesis traditions, Samaritan evidence, Targums, and later
    citations.'
