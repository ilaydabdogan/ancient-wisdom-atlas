canonical_text:
  quote: ''
  summary: Isaac is weaned and Abraham holds a banquet. Sarah sees Ishmael playing
    and dancing while Abraham rejoices, becomes jealous, and tells Abraham to cast
    out Hagar and her son so Ishmael will not share Isaac's inheritance. God tells
    Abraham to heed Sarah, declares Isaac the named seed-line, and promises to make
    Ishmael a great nation. Abraham sends Hagar and the child away with bread and
    a bottle of water. In the wilderness of Beersheba the water is exhausted; Hagar
    leaves the child under an olive tree and weeps. An angel tells Hagar that God
    has heard and seen the child; she sees a well, gives the child water, and goes
    toward Paran. The child grows into an archer, God is with him, and Nebaioth is
    born. Heavenly voices then speak of Abraham's faithfulness, and prince Mastémé
    is introduced.
  language: English
  quote_policy: summarized
