  summary: 'The passage commands an annual feast with sacrifices so that Israel will
    remember it. It then identifies the new moons of the first, fourth, seventh, and
    tenth months as days of remembrance and seasonal divisions. Noah ordains these
    days as memorial feasts because they correspond to flood events: the ark command
    and dry earth, the closing and opening of the abysses, descending waters, and
    the sight of mountain tops.'
