canonical_text:
  quote: ''
  summary: Rebecca instructs Jacob not to marry women of the land but to take a wife
    from her father’s house and kindred, promising divine blessing and righteous descendants.
    Jacob replies that he has remained sexually untouched, remembers Abraham’s commands,
    intends to seek a wife among Laban’s daughters, has refused his brother’s urging,
    and swears not to marry Canaanite women. Rebecca praises God, asks for a blessing
    of righteousness, receives the spirit of righteousness into her mouth, lays both
    hands on Jacob’s head, and blesses him with righteousness and numerous sons.
  language: English
  quote_policy: summarized
