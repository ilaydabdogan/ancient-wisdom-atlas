canonical_text:
  quote: ''
  summary: 'The introduction argues for dating Jubilees to the Maccabean period by
    indirect evidence: priestly titles associated with the Maccabees, the author’s
    Pharisaic stance before conflicts with Maccabean rulers, and laws responding to
    Hellenistic persecution concerning exposure, circumcision, Sabbath observance,
    and intermarriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the date of Jubilees must be established by indirect
    evidence and argues that it was written during the pontificate of the Maccabean
    family, not earlier than 135 B.C.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Levi is cited as being called a priest of the Most High God, and the passage
    links this title to Maccabean high-priests and the order of Melchizedek.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage describes the author as a strict Pharisee who approves the Maccabean
    pontificate, and it uses Pharisaic conflict with Alexander Jannaeus and Hyrcanus
    as a latest-date argument.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Jubilees points back to a period of stress and persecution
    before the recovery of national independence under the Maccabees.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A law forbidding Jews to expose their persons is described as prescribed on
    the heavenly tables and as aimed at participation in Greek games established by
    Jason the high-priest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The law of circumcision is said to be affirmed with severe penalties, to have
    been observed in the creation of the highest angels, and to be neglected by Israel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Antiochus is said to have forbidden circumcision under penalty of death, and
    the passage notes Jewish attempts to undo circumcision to avoid mockery in the
    palaestra.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Sabbath is described as re-enacted with death as the penalty for profanation,
    with prohibitions on war, cohabitation, and riding beasts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Intermarriage with heathen is described as absolutely prohibited under death
    penalty, and giving a daughter to a Gentile is equated with giving her to Moloch.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage concludes that Jubilees presupposes the flourishing period of
    Maccabean hegemony as its historical background.
  category: setting
  evidence_refs:
  - ev:9
