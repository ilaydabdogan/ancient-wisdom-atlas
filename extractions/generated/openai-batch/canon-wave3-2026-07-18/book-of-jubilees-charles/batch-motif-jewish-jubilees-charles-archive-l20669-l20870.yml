canonical_text:
  quote: ''
  summary: Jacob receives and destroys foreign gods and stolen idols, hides the remains
    under an oak in Shechem, goes to Bethel at the new moon, builds an altar and pillar,
    and summons Isaac and Rebecca to a sacrifice. Jacob then visits Isaac and Rebecca
    with Levi and Judah. Rebecca recognizes and blesses them. Isaac embraces Jacob,
    regains sight enough to see Levi and Judah, and under the spirit of prophecy blesses
    Levi first, assigning his seed sanctuary service, judicial authority, and blessing
    speech.
  language: English
  quote_policy: summarized
