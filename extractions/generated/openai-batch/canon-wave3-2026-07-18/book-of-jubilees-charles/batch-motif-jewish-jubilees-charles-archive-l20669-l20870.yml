- id: obs:9
  text: The spirit of prophecy comes into Isaac's mouth; he takes Levi by his right
    hand and Judah by his left, and turns first to bless Levi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Isaac's blessing asks that the Lord bless Levi and his children, give greatness
