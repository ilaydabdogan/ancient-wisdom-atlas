canonical_text:
  quote: ''
  summary: The passage pronounces a curse on the Philistines/Caphtorim, declaring
    that they will be destroyed, rooted out, deprived of remnant, name, and seed,
    and unable to escape judgment by heaven, earth, the nations, Sheol, or captivity.
    It states that this judgment is written on the heavenly tables. The next chapter
    begins with Rebecca warning Jacob not to marry a woman from the daughters of Canaan,
    citing Esau’s Canaanite wives as a grief to her.
  language: English
  quote_policy: summarized
