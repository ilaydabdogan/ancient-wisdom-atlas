canonical_text:
  quote: ''
  summary: A person copies the Watchers' teaching about celestial omens, sins because
    of it, and hides the matter from Noah. The excerpt then gives genealogical notices,
    including the naming of Shelah and Peleg. Peleg's name is linked to the time when
    Noah's children began dividing the earth. The children of Noah first divide the
    earth secretly, then the earth is divided into three parts for Shem, Ham, and
    Japheth while a sent figure is present; Noah calls his sons and their children
    and divides the earth into lots. An editorial note describes the formal division
    as oath-bound and binding on descendants.
  language: English; notes include Greek and Semitic transliterations.
