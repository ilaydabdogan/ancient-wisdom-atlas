canonical_text:
  quote: ''
  summary: 'The passage concludes a conflict near Shechem: Jacob defeats opponents,
    recovers herds, imposes tribute, builds named places, and makes peace, after which
    the defeated become his servants. It then recounts Joseph being sent to check
    on his brothers, their plot against him, his sale to Ishmaelite merchants and
    then into Egypt, and the brothers’ deception of Jacob with Joseph’s bloodied coat,
    leading Jacob and his household to mourn. Editorial notes compare the settlement
    tradition with Testament of Judah and later Hebrew witnesses, especially over
    whether herds were recovered by Jacob or restored by Jacob’s sons.'
  language: English
  quote_policy: summarized
