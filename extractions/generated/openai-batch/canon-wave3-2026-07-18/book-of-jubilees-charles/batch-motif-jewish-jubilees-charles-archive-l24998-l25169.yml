canonical_text:
  quote: ''
  summary: The passage recounts Joseph's peaceful later life in Egypt, his death at
    one hundred and ten years, and his command that Israel swear to carry his bones
    out of Egypt. It explains that conflict between Egypt and Canaan and the closing
    of Egypt's gates prevented burial in Canaan. Later, during another Egypt-Canaan
    war, the children of Israel carried the bones of Jacob's children, except Joseph's,
    to burial in the field of the double cave in the mountain; most returned to Egypt,
    while a few remained in the mountains of Hebron.
  language: English
  quote_policy: summarized
