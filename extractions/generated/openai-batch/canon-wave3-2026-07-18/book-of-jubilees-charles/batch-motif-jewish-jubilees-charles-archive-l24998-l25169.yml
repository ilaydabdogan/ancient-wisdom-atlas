    remaining life, and the Egyptians honored the children of Israel during Joseph's
    lifetime.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Joseph is said to have died at one hundred and ten years old after time in
    Canaan, servitude, prison, and eighty years ruling Egypt under the king.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before he died, Joseph commanded the children of Israel to carry his bones
    with them when they went forth from Egypt and made them swear regarding his bones.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage gives as a reason that Joseph knew the Egyptians would not again
    bring him out and bury him in Canaan.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Makamarén, king of Canaan, fought the king of Egypt in a valley, slew him,
    and pursued the Egyptians to the gates of 'Ermén.
