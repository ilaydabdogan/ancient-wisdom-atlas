  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Joseph was buried in Egypt, and his brethren died after him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: During a later war between the king of Egypt and the king of Canaan, the children
