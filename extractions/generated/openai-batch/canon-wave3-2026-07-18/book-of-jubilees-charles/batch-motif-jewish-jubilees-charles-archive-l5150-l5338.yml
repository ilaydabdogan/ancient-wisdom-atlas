canonical_text:
  quote: ''
  summary: 'The passage describes the first three creation days: God creates angelic
    beings associated with sanctification and natural phenomena, creates abysses,
    darkness, night, light, dawn, and day, and is praised for seven first-day works.
    On the second day God creates the firmament and divides the waters above and below
    it. On the third day God commands the waters to gather so dry land appears, then
    creates seas, rivers, water-gatherings, lakes, dew, seed, vegetation, trees, and
    the Garden of Eden. The accompanying notes compare several details with Genesis,
    Ethiopic Enoch, Slavonic Enoch, Revelation, and Greek textual witnesses.'
  language: English
  quote_policy: summarized
