canonical_text:
  quote: ''
  summary: 'The passage recounts divine vengeance on Egypt for Israel’s bondage: judgments
    occur through the addressed figure, Mastema opposes him and aids Egyptian sorcerers,
    Israel is delivered through the sea while Egyptian pursuers are cast into the
    depths, and Mastema is bound and later released in connection with the pursuit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Everything is said to have been sent through the addressed figure’s hand so
    that he would declare events before they happened and speak before the king of
    Egypt, his servants, and his people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ten great and terrible judgments come on Egypt as vengeance for Israel and
    in accordance with the Lord’s covenant with Abraham.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:3
  text: The prince of the Mastéma stands against the addressed figure, seeks to deliver
    him into Pharaoh’s hand, and helps Egyptian sorcerers who act before him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sorcerers are permitted to work evils, but remedies are not permitted
    by their hands; the Lord smites them with malignant ulcers and they cannot perform
    a sign.
  category: action
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:5
  text: The prince of the Mastéma calls the Egyptians to pursue the addressed figure
    with chariots, horses, and the hosts of Egypt.
  category: action
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:6
  text: A first-person speaker stands between the Egyptians and Israel, and the Lord
    brings Israel through the sea as though on dry land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Lord casts the pursuing peoples into the sea and the depths of the abyss,
    corresponding to the Egyptians’ casting of children into the river.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:8
  text: The prince of the Mastéma is bound and imprisoned behind the children of Israel
    from the fourteenth through the eighteenth so that he cannot accuse them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the nineteenth, Mastema and his powers are released to help the Egyptians
    pursue Israel; he hardens their hearts and makes them stubborn.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:10
  text: The pursuit is described as a device devised by the Lord in order to smite
    the Egyptians and cast them into the sea.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
