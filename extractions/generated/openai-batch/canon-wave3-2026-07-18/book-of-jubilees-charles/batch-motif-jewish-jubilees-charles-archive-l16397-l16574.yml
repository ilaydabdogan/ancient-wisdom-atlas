canonical_text:
  quote: ''
  summary: The passage presents a speaker instructing a son to obey God's commandments,
    avoid images and blood-eating, and perform peace- and thank-offerings with specified
    handling of blood, fat, flour, oil, drink-offering, altar fire, timing of eating,
    covenant salt, and sacrificial wood. It also grounds some rules in ancestral writings
    associated with forefathers, Enoch, and Noah.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God is described as living, holy, faithful, righteous, impartial, unreceptive
    to gifts, and as executing judgment on those who transgress commandments and despise
    the covenant.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is told to observe commandments, ordinances, and judgments,
    and not to follow abominations, graven images, or molten images.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The addressee is told not to eat any blood from animals, cattle, or birds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: For an acceptable peace-offering, the victim is to be slain, its blood poured
    on the altar, and its fat, flour or meat-offering with oil, and drink-offering
    offered on the altar of burnt-offering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fat and specified internal parts of thank-offerings are to be offered
    on the altar fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The offering is described as a sweet savour acceptable before the Lord and
    as the bread of the offering unto the Lord.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The meat of the offering is to be eaten on the day of sacrifice and the second
    day, with nothing left for the third day; eating what remains brings sin upon
    the eater.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker says this rule was found written in books of forefathers and in
    the words of Enoch and Noah.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Salt is to be strewn on all oblations, and the salt of the covenant is not
    to be lacking before the Lord.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The addressee is warned about bringing other wood for the altar or sacrifices;
