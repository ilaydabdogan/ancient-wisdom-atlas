  summary: The supplied extract is a mixed Greek-English commentary passage. It refers
    to division of the whole world among three sons, Shem, Ham, and Japheth, by lots;
    explains Israel's later driving out of Canaanites as recovery of its own possessions;
    cites Syncellus on Canaan, son of Ham, entering Shem's boundaries against Noah's
    command with seven nations; and notes that God destroyed those peoples through
    Moses and Joshua and restored ancestral land to Israel through judges. A further
    note identifies an angel of the presence sent by God to bind the fallen watchers.
