canonical_text:
  quote: ''
  summary: The passage recounts Joseph's fulfilled interpretation of the butler and
    baker, the butler's temporary forgetfulness, Pharaoh's two dreams of coming famine,
    the failure of Egyptian specialists to interpret them, Joseph's interpretation
    and plan for food storage, and Pharaoh's elevation of Joseph to authority over
    Egypt. It adds that the Lord gave Joseph favor, that Joseph ruled uprightly, and
    that Egypt had peace because the Lord was with him.
  language: English
  quote_policy: summarized
