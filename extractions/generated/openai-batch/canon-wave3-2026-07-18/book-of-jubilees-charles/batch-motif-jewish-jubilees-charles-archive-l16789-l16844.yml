canonical_text:
  quote: ''
  summary: Ishmael visits his father, and Isaac offers burnt- and thank-offerings
    at Abraham's altar in Hebron. Rebecca prepares cakes from new grain and sends
    them by Jacob to Abraham, and Isaac sends a thank-offering by Jacob. Abraham eats,
    drinks, blesses the Most High God as creator and provider, gives thanks for reaching
    old age in peace, says the adversary's sword has not overcome him, and prays that
    his descendants may be a chosen nation and inheritance among the nations.
  language: English
  quote_policy: summarized
