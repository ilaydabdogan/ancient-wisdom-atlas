  summary: The passage is a scholarly introduction discussing later Jewish, Samaritan,
    and Christian witnesses to or parallels with Jubilees/Little Genesis. It notes
    shared material with compilations, Midrash Tadshe, the Book of Jashar, and the
    Samaritan Chronicle; compares patriarchal chronological data; and lists Christian
    authors who cite or use Jubilees, including references to Cain and Abel, Cain
    and Seth's wives, and traditions about souls after death and a contest for Moses's
    soul.
