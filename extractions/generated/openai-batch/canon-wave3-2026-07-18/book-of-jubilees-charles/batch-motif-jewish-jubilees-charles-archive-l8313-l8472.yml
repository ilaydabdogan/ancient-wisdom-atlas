canonical_text:
  quote: ''
  summary: 'The passage recounts that angels of God took human women as wives and
    fathered giants. Lawlessness and corruption spread among humans and other creatures,
    God judged the earth corrupt, announced destruction of man and all flesh, and
    Noah found grace. God commanded punishment of the angels and their sons: the angels
    are bound in the depths of the earth, while their giant sons are destroyed by
    mutual violence through the sword and their fathers remain bound until the day
    of great condemnation.'
  language: English
  quote_policy: summarized
