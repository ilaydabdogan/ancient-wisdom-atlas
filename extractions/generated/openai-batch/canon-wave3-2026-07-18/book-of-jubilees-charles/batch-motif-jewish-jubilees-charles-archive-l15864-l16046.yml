canonical_text:
  quote: ''
  summary: Abraham contrasts Esau’s fierce hunting and warlike conduct with Jacob’s
    chosen lineage role. He instructs Rebecca to watch over Jacob, blesses Jacob before
    her with ancestral and divine promises, says Jacob’s seed will be beyond numbering,
    and declares that Mastema’s spirits will not rule over him. Abraham later gathers
    his sons and descendants and commands righteousness, love of neighbor, circumcision,
    avoidance of uncleanness, and separation from Canaanite marriage ties.
  language: English
  quote_policy: summarized
