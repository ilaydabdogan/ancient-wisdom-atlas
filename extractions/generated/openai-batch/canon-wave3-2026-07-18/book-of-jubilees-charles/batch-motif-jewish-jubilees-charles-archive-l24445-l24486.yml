  quote: ''
  summary: A searched vessel reveals Joseph's cup in Benjamin's sack. The brothers
    tear their garments, return to Joseph's house, and bow before him. Joseph accuses
    them of evil and theft and says Benjamin should remain as servant. Judah pleads
    that the father loves the lad, would die in sorrow if he did not return, and offers
    himself as bondsman in the lad's place because he had become surety for him.
