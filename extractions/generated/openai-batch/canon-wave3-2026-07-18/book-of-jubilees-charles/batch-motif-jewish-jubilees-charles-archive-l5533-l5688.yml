  summary: God tells heavenly addressees that Sabbath is to be kept with Him in heaven
    and on earth. God separates and sanctifies a Sabbath-keeping people, chooses the
    seed of Jacob as His first-born son, makes the Sabbath a sign, and joins the people’s
    seventh-day observance with heavenly observers. The passage also describes commands
    ascending as an acceptable sweet savour and links twenty-two heads of mankind
    from Adam to Jacob with twenty-two kinds of work made before the seventh day.
