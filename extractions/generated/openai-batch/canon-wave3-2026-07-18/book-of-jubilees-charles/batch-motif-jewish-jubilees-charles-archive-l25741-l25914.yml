canonical_text:
  quote: ''
  summary: 'The passage gives rules for Passover observance: the victim is to be slain
    near evening, eaten in the evening period, with leftovers burned. It must be roasted
    with fire rather than boiled or eaten raw, and its bones must not be broken. Israel
    is commanded to observe the festival annually at its fixed time, as a memorial
    before the Lord, with protection from plague promised for proper observance. The
    meal is to be eaten before the sanctuary, and eligible adult participants are
    specified. The included notes compare these rules with biblical and later interpretive
    traditions.'
  language: English
  quote_policy: summarized
