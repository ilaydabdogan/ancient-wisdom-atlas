canonical_text:
  quote: ''
  summary: 'The passage narrates Reuben seeing Bilhah bathing, entering her house
    at night while she sleeps, lying with her, and fleeing after she wakes. Bilhah
    later reports the defilement to Jacob. Jacob is angry, separates from Bilhah,
    and the passage expands the episode into a legal prohibition: a man must not lie
    with his father''s wife or uncover his father''s skirt; such uncleanness is written
    on the heavenly tables as punishable by death, curse, stoning, and removal from
    Israel.'
  language: English
  quote_policy: summarized
