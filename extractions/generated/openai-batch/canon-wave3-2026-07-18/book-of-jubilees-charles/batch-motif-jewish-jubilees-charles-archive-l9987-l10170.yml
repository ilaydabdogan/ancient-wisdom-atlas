  quote: ''
  summary: The excerpt describes Shem dwelling near Noah and building a city by Mount
    Libar, lists descendants of Shem and Japheth, recounts Noah instructing his descendants
    in commandments and righteousness, and explains the flood as judgment for the
    Watchers’ unions with human women, the violence of giant offspring, human iniquity
    and bloodshed, and sin against living creatures. It ends with Noah recalling survival
    in the ark.
