canonical_text:
  quote: ''
  summary: The passage enumerates members of Jacob's household associated with the
    entry into Egypt, including named descendants, deaths, childlessness, and a total
    of seventy souls. It then narrates Israel/Jacob entering Egypt and Goshen, Joseph
    meeting his father with tears, Jacob blessing God and affirming the Bethel vision,
    a meal before Jacob with Joseph and his brothers, and Joseph granting dwelling
    rights in Goshen and Rameses.
  language: English
  quote_policy: summarized
