canonical_text:
  quote: ''
  summary: Abraham blesses Jacob and asks the Most High God to preserve, sanctify,
    and renew the covenant with Jacob and his seed. Abraham then dies with Jacob beside
    him. Jacob discovers the death, informs Rebecca, and Rebecca informs Isaac. Isaac,
    Ishmael, and Abraham’s household mourn, and Isaac and Ishmael bury Abraham in
    the double cave near Sarah, followed by forty days of weeping.
  language: English
  quote_policy: summarized
