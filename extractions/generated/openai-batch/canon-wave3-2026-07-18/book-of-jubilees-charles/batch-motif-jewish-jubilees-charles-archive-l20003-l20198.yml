canonical_text:
  quote: ''
  summary: 'The passage describes the Amorites as wicked, Jacob sending Laban away
    and returning toward Gilead, Jacob crossing the Jabbok and reconciling with Esau,
    Jacob crossing the Jordan and pasturing flocks, and Jacob sending regular provisions
    to Isaac and Rebecca. Isaac dwells at the tower of Abraham after leaving the Well
    of the Oath, while Esau takes Mahalath, gathers flocks, goes to Mount Seir, and
    leaves Isaac alone. The next section begins the Dinah episode: Jacob goes to Salem,
    Dinah is carried off to Shechem''s house and violated, Shechem seeks marriage,
    Jacob and his sons respond deceitfully, and Simeon and Levi execute judgment on
    the men of Shechem.'
  language: English
  quote_policy: summarized
