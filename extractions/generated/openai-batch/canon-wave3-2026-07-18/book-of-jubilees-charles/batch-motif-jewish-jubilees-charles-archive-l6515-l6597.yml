canonical_text:
  quote: ''
  summary: 'The passage recounts the aftermath of eating from the forbidden tree:
    the woman is sentenced to sorrow in childbearing and subordination to her husband;
    Adam is sentenced to toil on cursed ground and eventual return to earth. The pair
    are clothed in coats of skin and sent from Eden. Adam offers a fragrant morning
    offering. The speech of animals is then closed, although they had formerly spoken
    with one language.'
  language: English
  quote_policy: summarized
