  quote: "“It is not good that the man should be alone: let us make a helpmeet for
    him.”"
  summary: The passage states that the Creator blessed the Sabbath and gave it as
    an enduring law for Israel. It then recounts Adam receiving and naming animals
    by kinds, finding no helpmeet, and the Lord forming the woman from Adam’s rib
    during a deep sleep. Adam recognizes her as bone and flesh of himself, and the
    text gives the formula that a man leaves his parents, cleaves to his wife, and
    they become one flesh. The supplied excerpt also begins an explanation linking
    the timing of Adam’s and the woman’s creation to a commandment, with editorial
    notes connecting this to purification law.
