  quote: ''
  summary: The passage is an introductory survey of Greek, Latin, and patristic witnesses
    that cite, echo, or depend on Jubilees. It mentions fragments involving Abraham
    and Sarah, Mastipha proposing the sacrifice of Abraham’s son, Jacob and Esau,
    Moses and angelic instruction, heavenly powers on the first day of creation, the
    serpent’s belly-crawling condition, the division of the earth, priestly and royal
    status assigned to Levi and Judah, and Isidore of Seville’s enumeration of twenty-two
    created works.
  language: English with Greek and Latin quotations
  quote_policy: summarized
