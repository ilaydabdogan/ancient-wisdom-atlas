canonical_text:
  quote: ''
  summary: 'The passage closes the Judah episode by describing lamentation, dream-announced
    forgiveness, and a command that sexual uncleanness with a mother-in-law or daughter-in-law
    be punished by burning, with Judah’s seed preserved because his sons had not lain
    with the woman. It then begins the famine episode: rain fails, Egypt has stored
    food through Joseph, Jacob sends ten sons but not Benjamin to Egypt for provisions,
    and Joseph recognizes them while they do not recognize him.'
  language: English
