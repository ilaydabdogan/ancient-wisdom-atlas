canonical_text:
  quote: those who are named the Watchers, that they should instruct the children
    of men
  summary: 'The passage fragment names the Watchers as instructors of humanity. The
    accompanying note surveys interpretations of Genesis vi. 1-4: an older angelic
    reading in which heavenly beings mingle with women, teach magic or sorcery, and
    beget giants; and later Sethite interpretations identifying the sons or angels
    of God with descendants of Seth and the daughters of men with descendants of Cain.
    It also notes the later exaltation of Seth and relative subordination of Enoch,
    including traditions crediting Seth with letters, wisdom, astronomy, calendrical
    knowledge, and naming stars and planets.'
