canonical_text:
  quote: ''
  summary: The excerpt is an introductory analysis describing how the author of Jubilees
    rewrites Genesis in a manner compared to the Chronicler, omits or alters material
    inconsistent with his legal assumptions, attributes certain troubling divine actions
    to Mastema, and presents circumcision, Sabbath, and law as heavenly and eternal
    realities that separate and sanctify Israel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the author of Jubilees sought to rewrite Genesis in a way
    compared to the Chronicler's handling of Samuel and Kings, in order to show rigorous
    observance of the law by the patriarchs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A footnote states that this procedure is in direct antagonism with the presuppositions
    of the Priests' Code in Genesis concerning patriarchal cultic acts and offerings.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:3
  text: The passage says the author alters or omits many Genesis statements that do
    not fit his presuppositions, including episodes involving birds from the ark,
    Abraham, Lot, Isaac, Jacob, Laban, angels, Esau, Shechem, and Joseph.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Genesis 49 is purposely suppressed because of its severity
    on Levi and its pre-eminence given to Judah; the author is said to reverse the
    relation and set Levi before Judah.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the author attributes Abraham's temptation to offer Isaac,
    the attempt on Moses's life, the hardening of Egyptian hearts, and the slaying
    of the first-born to Mastema and his angels.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the law is treated as superior to time, revealed in
    time, and valid from eternity as well as unto eternity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the earthly tabernacle is understood as a copy of a heavenly
    original and that elements of the law are likewise treated as copies of divine
    originals engraved on heavenly tables.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes Hellenism as undermining circumcision and Sabbath observance
    and describes the author as asserting their everlasting validity and sanctity.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says circumcision was first ordained in Abraham's time but had
    been ordained in heaven from the beginning; the two highest orders of angels were
    created circumcised, and Israel is sanctified with them through circumcision.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says the Sabbath was first ordained in Jacob's time but was originally
    celebrated in heaven by God and the two chief orders of angels; Israel is to unite
    with these angels in its observance, and the Sabbath marks Israel off from other
    nations.
  category: attribute
  evidence_refs:
  - ev:9
