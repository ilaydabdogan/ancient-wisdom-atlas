canonical_text:
  quote: ''
  summary: The passage is an introductory scholarly comparison of Jubilees with sections
    of Ethiopic Enoch, the Book of Noah, the Testaments of the Twelve Patriarchs,
    and related sagas. It lists shared or dependent themes such as a temporary Messianic
    kingdom, immortality of the soul, Sheol combined with fire, Israel judging nations,
    joy of righteous spirits after death, avoidance of the wicked, useless idols,
    blood prohibition, eternal law, the plant of righteousness, rain and dew, evergreen
    trees, the flood, angelic sin, punishment of angels, and a sequence in which Noah,
    Enoch, and Seth traditions displace one another.
  language: English
  quote_policy: summarized
