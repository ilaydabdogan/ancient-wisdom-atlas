canonical_text:
  quote: ''
  summary: The passage closes a warning that Israelites who neglect circumcision and
    forsake the covenant will incur the Lord's wrath and be rooted out. It then narrates
    angelic visitors at Mamre announcing Isaac to Abraham and Sarah, Sarah's laughter
    and admonition, the heavenly-tablets naming of Isaac, the fiery judgment on Sodom
    and neighboring places, Lot's rescue because God remembered Abraham, Lot's later
    sin with his daughters and the judgment inscribed against his seed, and Abraham's
    movements toward Gerar and the Well of the Oath.
  language: English
  quote_policy: summarized
