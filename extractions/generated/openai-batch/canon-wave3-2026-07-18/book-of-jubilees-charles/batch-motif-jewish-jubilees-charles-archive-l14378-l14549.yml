canonical_text:
  quote: ''
  summary: God renames Sarai as Sarah, promises that Sarah will bear Abraham a son
    named Isaac, and says the covenant will be established with Isaac and his seed.
    Abraham asks concerning Ishmael, and God promises blessing, multiplication, twelve
    princes, and a great nation for Ishmael while reserving the covenant for Isaac.
    God departs upward from Abraham. Abraham circumcises himself, Ishmael, and every
    male of his household on the same day. The passage presents circumcision on the
    eighth day as an eternal ordinance written on the heavenly tables, with exclusion
    and destruction assigned to one not circumcised on that day.
  language: English
  quote_policy: summarized
