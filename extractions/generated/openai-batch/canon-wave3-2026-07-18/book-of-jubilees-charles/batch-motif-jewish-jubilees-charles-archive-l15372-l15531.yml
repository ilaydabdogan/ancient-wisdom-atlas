canonical_text:
  quote: ''
  summary: 'The passage recounts Mastema''s proposed test of Abraham, the statement
    that Abraham had already been found faithful through many trials, and the opening
    of the Isaac sacrifice episode: God commands Abraham to take Isaac to a mountain,
    Abraham travels with Isaac and attendants, Isaac asks about the sacrificial animal,
    and Abraham binds Isaac on an altar with knife in hand.'
  language: English
