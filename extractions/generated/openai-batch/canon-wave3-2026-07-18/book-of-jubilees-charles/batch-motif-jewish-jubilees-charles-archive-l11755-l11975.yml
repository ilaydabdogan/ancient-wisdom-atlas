canonical_text:
  quote: ''
  summary: Noah's sons report that demons are leading astray and killing Noah's descendants.
    Noah prays to God, recalls being saved from the flood, asks that wicked spirits
    not rule over his descendants, and asks that the living spirits be imprisoned
    in a place of condemnation. The Lord commands that they be bound, after which
    Mastéma, chief of the spirits, asks that some remain under his authority.
  language: English
  quote_policy: summarized
