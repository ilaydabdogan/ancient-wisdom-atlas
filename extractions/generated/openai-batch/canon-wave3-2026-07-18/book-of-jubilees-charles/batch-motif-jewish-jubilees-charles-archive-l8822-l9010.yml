canonical_text:
  quote: ''
  summary: After the flood, Noah leaves the ark on the new moon of the third month,
    builds an altar on a mountain, and makes atonement for the earth with blood and
    burnt offerings. The Lord accepts the savour of the offering and makes a covenant
    that no further flood will destroy the earth and that the ordered cycles of the
    earth will continue. The divine speech commands multiplication, grants animals
    as food, forbids eating blood, and requires accountability for shedding human
    blood. Noah and his sons swear to the blood prohibition as a perpetual covenant.
  language: English
  quote_policy: summarized
