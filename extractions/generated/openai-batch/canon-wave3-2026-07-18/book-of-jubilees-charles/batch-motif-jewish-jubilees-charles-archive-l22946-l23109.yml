  quote: ''
  summary: Esau's sons are angered that the elder's portion and blessing have passed
    to Jacob. Esau recounts selling his birthright for lentils and Jacob's obtaining
    the blessing by guile, and he cites an oath of peace between the brothers. His
    sons reject peace, threaten Jacob and Esau, recruit fighting men from neighboring
    peoples, and force Esau to lead them against Jacob.
