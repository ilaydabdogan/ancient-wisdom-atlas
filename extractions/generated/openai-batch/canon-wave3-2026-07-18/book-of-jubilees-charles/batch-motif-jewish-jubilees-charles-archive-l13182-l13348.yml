canonical_text:
  quote: ''
  summary: Abram prays for deliverance from evil spirits and for guidance about whether
    to return or remain. The Lord’s word comes through the first-person mediator,
    commanding him to leave his country and father’s house for a land to be shown,
    promising blessing, descendants, and divine protection. God orders Abram’s mouth
    and ears opened so that he can hear and speak the revealed Hebrew language, which
    had ceased after Babel. The mediator opens his mouth, ears, and lips, teaches
    him Hebrew, helps him understand ancestral books, and Abram studies them before
    telling Terah that he will leave Haran for Canaan.
  language: English
  quote_policy: summarized
