canonical_text:
  quote: "“she made an ark for thee, and covered it with pitch and asphalt”"
  summary: The passage recounts oppression of the children of Israel in Egypt, including
    forced labor and a command by Pharaoh that male children be cast into the river.
    Moses is born during this tribulation; his mother hides him, places him in a sealed
    ark among the river flags, and Miriam guards him. Pharaoh’s daughter Tharmuth
    finds the crying child, has compassion, and Jochebed is brought to nurse him for
    wages.
