canonical_text:
  quote: ''
  summary: The passage describes a forbidden sexual act involving a man and his father's
    concubine, frames the related ordinance as an everlasting covenant law for Israel,
    commands Moses to write it down, and presents God as an impartial judge. It then
    recounts Jacob's household dwelling near Isaac and Rebecca, names Jacob's children
    by maternal line, and describes Isaac and Rebecca blessing Jacob and his sons.
    A following chapter heading and opening verses summarize conflict with Amorite
    kings, Joseph's later sale into Egypt, mourning, the institution of the Day of
    Atonement, and Jacob sending his sons and servants to pasture sheep at Shechem,
    where seven Amorite kings assemble against them.
  language: English
  quote_policy: summarized
