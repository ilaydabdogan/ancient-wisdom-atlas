canonical_text:
  quote: ''
  summary: The passage recounts warnings to Canaan not to dwell in a land allotted
    to Shem, an oath-bound curse connected with that boundary violation, Canaan's
    refusal to heed the warning, and the naming of the land as Canaan. It then describes
    Japheth's descendants and Madai's move to Media. A following section gives Reu's
    marriage and the birth of Séréh, describes the rise of war, captivity, bloodshed,
    fortified cities, kingdoms, weapons, and slavery among Noah's descendants, and
    reports Or's building and naming of a Chaldean city.
  language: English
  quote_policy: summarized
