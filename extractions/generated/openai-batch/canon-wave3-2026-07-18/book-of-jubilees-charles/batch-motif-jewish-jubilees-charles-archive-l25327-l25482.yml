canonical_text:
  quote: ''
  summary: The passage recounts Moses being brought to Pharaoh's daughter, taught
    writing by Amram, and raised in the royal court. It then describes Moses killing
    an Egyptian who was striking an Israelite, being challenged by an Israelite on
    the following day, and fleeing. Moses later dwells in Midian and returns to Egypt.
    On the return journey prince Mastéma seeks to kill him, but Moses is delivered
    and proceeds to perform signs and wonders against Pharaoh and the Egyptians. The
    Lord executes vengeance for Israel through the plagues.
  language: English
  quote_policy: summarized
