canonical_text:
  quote: ''
  summary: Joseph is taken to Egypt at seventeen, bought by Potiphar, and placed over
    the Egyptian household because the Lord prospers him. Potiphar’s wife repeatedly
    seeks to lie with Joseph, but he refuses by remembering the Lord and ancestral
    instruction about adultery and divine punishment. She seizes him, he escapes leaving
    his garment, and she falsely accuses him. Potiphar imprisons Joseph, but the Lord
    gives him favor with the prison guard. Pharaoh’s chief butler and chief baker
    are imprisoned there, and both have dreams that they tell to Joseph.
  language: English
  quote_policy: summarized
