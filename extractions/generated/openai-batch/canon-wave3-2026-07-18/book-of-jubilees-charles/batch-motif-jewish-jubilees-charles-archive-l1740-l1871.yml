canonical_text:
  quote: ''
  summary: The passage is an introduction describing Jubilees as using written traditions
    and legends, listing parallel attestations in other Jewish works, naming legendary
    persons and places, summarizing several legendary incidents, and comparing Jubilees'
    midrashic rewriting tendency with that of the Old Testament Chronicler.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the author of Jubilees used current traditions and
    legends already reduced to writing and preserved in Hebrew and Greek independent
    works.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the war of Jacob and his sons against Amorite kings in Jubilees
    is also found in the Testament of Judah, Midrash Wajjissau, and the Book of Jashar.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the fratricidal war between Jacob and Esau in Jubilees has
    parallels or authorities in Testament of Judah, Jalkut Shimeoni, and Chronicles
    of Jerahmeel.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists several incidents in Jubilees also attested in the Testaments
    of the XII Patriarchs, including Reuben and Bilhah, Levi's priesthood dream and
    consecration, Tamar with Er and Onan, and the burial of Jacob's sons in Hebron.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Jubilees preserves many proper names, especially names of
    women, fathers of wives, kings, and places including a mount and cities built
    by Noah's sons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage lists legendary incidents involving Adam naming creatures, a common
    animal language before the Fall, Adam's burial, Cain's death, and Kainam discovering
    writings of the Watchers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists a detailed account of the tower of Babel and its destruction
    by a mighty wind, and the beginning of wars and idolatry in Serug's time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage lists Abraham's early exploits, campaign against idolatry, burning
    of a heathen temple, Haran's death, astronomical knowledge, miraculous acquisition
    of Hebrew, and ten temptations.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The passage mentions Zebulon and Dinah as twins.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says Hebrew children were cast into the river for a number of
    months, Egyptian gods were burned, and one thousand Egyptians were destroyed in
    the Red Sea for every Hebrew child cast into the river.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The passage characterizes Jubilees as an extreme product of a midrashic process
    also apparent in the Old Testament Chronicler.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage says the Chronicler rewrote earlier Israelite and Judahite history
    with an object, omitted or transformed facts that did not fit presuppositions,
    and attributed David's temptation to Satan rather than Yahweh.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
