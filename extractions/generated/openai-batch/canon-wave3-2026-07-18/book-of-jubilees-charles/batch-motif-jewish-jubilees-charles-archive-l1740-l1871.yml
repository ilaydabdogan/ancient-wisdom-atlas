comparison_claims:
- id: claim:1
  claim: The war of Jacob and his sons against Amorite kings in Jubilees is presented
    as the same narrative or motif found in Testament of Judah, Midrash Wajjissau,
    and the Book of Jashar.
  claim_level: same_motif
  target: Testament of Judah 3-7; Midrash Wajjissau; Book of Jashar
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage notes different textual histories, including that the Book
    of Jashar is late; it does not compare full narrative details.
- id: claim:2
  claim: The fratricidal war between Jacob and Esau in Jubilees is cautiously linked
    to parallel or supporting material in Testament of Judah, Jalkut Shimeoni, and
    Chronicles of Jerahmeel.
  claim_level: same_motif
  target: Testament of Judah 9; Jalkut Shimeoni i.132; Chronicles of Jerahmeel
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself says the statement about some Hebrew documents is
    made with reservations.
- id: claim:3
  claim: Several Jubilees incidents are presented as shared with or attested by the
    Testaments of the XII Patriarchs.
  claim_level: same_motif
  target: Testaments of the XII Patriarchs
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The claim covers a list of incidents and does not establish the direction
    of dependence for each one.
- id: claim:4
  claim: Jubilees is compared with the Old Testament Chronicler as an extreme example
    of a similar midrashic rewriting process.
  claim_level: same_function
  target: Old Testament Chronicler
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: This is a comparison of literary method, not a shared mythic episode.
- id: claim:5
  claim: The Chronicler's handling of David's temptation is presented as a transformation
    of an earlier attribution to Yahweh into an attribution to Satan.
  claim_level: same_function
  target: 2 Samuel xxiv.1 and 1 Chronicles xxi.1
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage uses this as an example of rewriting; it does not analyze
    the figure of Satan beyond the attribution.
