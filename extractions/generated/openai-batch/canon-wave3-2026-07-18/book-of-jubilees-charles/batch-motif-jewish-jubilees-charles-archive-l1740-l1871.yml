candidate_motifs:
- id: motif:1
  label: Reuse of written legendary traditions
  taxonomy_refs: []
  basis: The passage repeatedly states that Jubilees draws on current traditions,
    legends, and existing writings, and it lists parallel attestations.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: This is a literary-transmission pattern rather than a mythic action inside
    the narrative.
- id: motif:2
  label: Sibling or fratricidal conflict
  taxonomy_refs:
  - sibling_pair
  - duality
  basis: The passage explicitly refers to a fratricidal war between Jacob and Esau.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage summarizes the incident and does not narrate its details.
- id: motif:3
