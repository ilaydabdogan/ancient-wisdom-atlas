    southward, and westward and eastward.”"
  summary: The passage recounts Pharaoh seizing Sarai and being plagued by the Lord,
    Sarai’s restoration and Abram’s peaceful return to his altar, Abram’s sacrifice
    and invocation of the Most High God, Lot’s separation and dwelling in Sodom, the
    Lord’s promise of land and innumerable seed to Abram, and the war in which Lot
    is taken captive before an escapee informs Abram.
