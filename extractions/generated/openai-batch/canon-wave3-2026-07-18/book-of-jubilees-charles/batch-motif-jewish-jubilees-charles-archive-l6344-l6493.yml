canonical_text:
  quote: ''
  summary: The passage states a law for Israel concerning abstention from hallowed
    things and sanctuary entry until childbirth-related days are completed. It then
    narrates Adam and his wife in Eden for seven years, Adam's garden labor, the serpent's
    approach to the woman, the dialogue about the forbidden tree, the eating of the
    fruit, the covering of nakedness with fig-leaves, and God's curse/wrath against
    the serpent and woman.
