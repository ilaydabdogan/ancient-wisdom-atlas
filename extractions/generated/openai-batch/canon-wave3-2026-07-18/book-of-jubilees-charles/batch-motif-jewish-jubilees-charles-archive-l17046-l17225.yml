  quote: ''
  summary: Abraham denounces people who worship evil spirits, eat over graves, and
    address wood and stone as divine. He blesses Jacob, warns him against taking a
    wife from the seed of Canaan, declares judgment against Canaan’s seed and idolaters,
    compares their removal to Sodom, affirms the enduring house/name/seed of Abraham
    through Jacob, and ends by blessing Jacob with intimate farewell gestures.
  language: English
