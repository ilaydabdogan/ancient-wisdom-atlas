comparison_claims:
- id: claim:1
  claim: The editor's notes identify the drunkenness, nakedness, Ham's seeing, Shem
    and Japheth's covering act, and Noah's curse and blessings as corresponding to
    Genesis 9:21-27.
  claim_level: same_motif
  target: Genesis 9:21-27 Noah drunkenness and sons episode
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  - ev:16
  counter_evidence_refs:
  - ev:17
  confidence: high
  limitations: The claim relies on the supplied editorial citations and comments;
    the full Genesis passage is not included in the excerpt for independent comparison.
- id: claim:2
  claim: The editor's note compares the fourth-year fruit detail with Leviticus 19:23-25
    concerning the first three years of tree fruit.
  claim_level: same_function
  target: Leviticus 19:23-25 fruit restriction pattern
  evidence_refs:
  - ev:2
  - ev:18
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt gives an editorial explanation of legal resonance but does
    not quote Leviticus directly.
- id: claim:3
  claim: The editor's note compares the sacrifice ritual mainly with Numbers 29:2,
    5.
  claim_level: same_function
  target: Numbers 29:2, 5 sacrificial ritual pattern
  evidence_refs:
  - ev:4
  - ev:19
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to an editorial note; the Numbers text is
    not supplied in this passage.
- id: claim:4
  claim: The editorial note cites Syncellus, Cedrenus, and Epiphanius as preserving
    or following the tradition that Noah planted a vineyard on the mountain in Armenia/Ararat
    after the deluge.
  claim_level: same_motif
  target: Later chronographic and patristic notices of Noah's vineyard on the Armenian/Ararat
    mountain
  evidence_refs:
  - ev:20
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the editor's note is present; these external texts are not independently
    supplied.
