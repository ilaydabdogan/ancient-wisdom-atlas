  label: post-flood renewal on the mountain
  taxonomy_refs:
  - flood_and_renewal
  basis: The ark has rested on an Ararat mountain, and Noah begins cultivation there
    by planting vines that later bear fruit.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The flood itself is only presupposed by the ark's resting place and the
    editor's note about habitation after the deluge; it is not narrated in this excerpt.
- id: motif:2
  label: ark resting on a mountain
  taxonomy_refs:
