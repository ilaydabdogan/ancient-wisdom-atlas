canonical_text:
  quote: ''
  summary: Noah plants vines on the Ararat mountain where the ark rested, makes and
    stores wine, celebrates a feast with burnt offerings, drinks wine with his children,
    becomes drunk and uncovered in his tent, is seen by Ham, is covered respectfully
    by Shem and Japheth, and then curses Canaan and blesses Shem and Japheth. Ham
    separates and builds a city; Japheth, becoming envious, also builds a city.
  language: English
  quote_policy: summarized
literal_observations:
