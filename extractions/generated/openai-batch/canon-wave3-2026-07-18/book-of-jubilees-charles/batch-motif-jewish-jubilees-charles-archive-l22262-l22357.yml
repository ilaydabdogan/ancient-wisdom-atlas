  quote: ''
  summary: The passage reports Israel/Jacob's refusal to be comforted over Joseph,
    the deaths and burials of Bilhah and Dinah, Israel's year-long mourning, and an
    explanation that the children of Israel are to afflict themselves and make annual
    atonement with a young goat on the tenth day of the seventh month because Jacob's
    sons grieved their father regarding Joseph. It then begins a notice about the
    sons of Jacob taking wives.
