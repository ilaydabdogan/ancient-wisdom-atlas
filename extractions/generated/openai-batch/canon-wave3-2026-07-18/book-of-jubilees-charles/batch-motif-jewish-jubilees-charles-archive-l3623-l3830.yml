canonical_text:
  quote: ''
  summary: This introductory passage compares themes in Jubilees with New Testament
    passages and nearby traditions. It summarizes Jubilees traditions about Mastema,
    Abraham, Noah, angels over natural phenomena, guardian angels, fallen watchers,
    demons from giants, Satan/Mastema, the Messiah from Judah, and a temporary Messianic
    kingdom marked by renewed nature, long life, restraint of evil, and final judgment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Jubilees represents Mastema as suggesting Abraham's temptation
    to sacrifice Isaac and as hardening the hearts of the Egyptians.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Abraham's belief is described as counted for righteousness, and he is said
    to be recorded on heavenly tables as the friend of God.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage identifies a sermon of Noah in Jubilees and also notes statements
    about the renewal of heaven and earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies angels connected with voices, thunder, lightnings,
    winds, fire, and waters.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:5
  text: The passage distinguishes higher angelic orders from angels over natural phenomena
    and says the latter do not observe the Sabbath because they are always engaged
    in their duties.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Guardian angels of individuals are said to be mentioned in Jubilees.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says angelic watchers were sent down to instruct mankind, fell
    by lusting after the daughters of men, and were punished.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Demons are described as spirits that went forth from the souls of giants,
    who were children of fallen angels.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Demons are said to attack men, rule over them, corrupt, lead astray, and destroy
    the wicked; they are also said to be subject to Mastema or Satan and to receive
    sacrifices as gods.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The demonic activity is said to continue until the judgment of Mastema or
    the establishment of the Messianic kingdom, when Satan can no longer injure mankind.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says Jubilees preserves hope for a Messiah sprung from Judah,
    though it assigns him no important role.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Messianic kingdom is described as gradual, involving spiritual development,
    transformation of nature, thousand-year life in happiness and peace, restraint
    of evil, and a last judgment at its close.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage reports that this view of the Messianic kingdom is probably derived
    from Mazdeism and that the author thought the kingdom era had already begun.
  category: other
  evidence_refs:
