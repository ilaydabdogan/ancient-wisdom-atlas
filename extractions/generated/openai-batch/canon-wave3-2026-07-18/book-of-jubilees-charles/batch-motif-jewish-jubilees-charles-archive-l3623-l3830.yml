  limitations: The passage compares functions and examples, not full angelological
    systems.
- id: claim:2
  claim: The passage states that Jubilees' demonology reappears for the most part
    in the New Testament, especially demons as disembodied spirits under Satan and
    awaiting final judgment.
  claim_level: same_function
  target: New Testament demonology
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
