canonical_text:
  quote: ''
  summary: The passage exhorts the recipients to seek the divine countenance and practice
    righteousness so that they may receive mercy, rain, and blessings upon work, food,
    offspring, land, and livestock. It then recounts that gifts are given to Ishmael,
    Ishmael’s sons, and the sons of Keturah, that they are sent away from Isaac, and
    that everything is given to Isaac. The departing groups settle eastward from Paran
    toward Babylon, mingle, and are called Arabs and Ishmaelites.
  language: English
  quote_policy: summarized
