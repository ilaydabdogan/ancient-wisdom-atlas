canonical_text:
  quote: He set His bow in the cloud for a sign of the eternal covenant...
  summary: The passage links covenant, blood prohibitions, altar supplication, the
    sign of the bow in the cloud after the flood, and the yearly feast of weeks as
    a recurring renewal of covenant. It narrates observance and neglect of the feast
    from creation, Noah, the patriarchs, and Israel at the mountain.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A covenant with the children of Israel is to be made in a specified month
    upon the mountain with an oath, and blood is to be sprinkled on them because of
    the covenant words.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage forbids eating the blood of beasts, birds, or cattle and states
    that one who eats blood, together with his seed, shall be rooted out of the land.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The children of Israel are to supplicate with blood before the altar, morning
    and evening, seeking forgiveness before the Lord.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: God gave Noah and his sons a sign that there should not again be a flood on
    the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: God set his bow in the cloud as a sign of the eternal covenant that there
    should not again be a flood destroying the earth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The feast of weeks is said to be ordained and written on the heavenly tables
    for annual celebration and renewal of the covenant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The festival is described as celebrated in heaven from creation to the days
    of Noah, observed by Noah and his sons, discontinued by Noah’s sons after his
    death, observed by Abraham, Isaac, Jacob, and Jacob’s children, forgotten by Israel,
    and renewed on the mountain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The children of Israel are commanded to observe the feast of weeks in all
    generations, one day in the year in the specified month.
  category: speech
  evidence_refs:
  - ev:7
