canonical_text:
  quote: ''
  summary: 'The passage is a mixed text-and-note section. It includes a fragment about
    Jared taking a wife in the eleventh jubilee and an extended note on Enochic and
    Sethite traditions: planetary and luminary naming, Enoch’s attributed achievements,
    reinterpretations of the Genesis 6 descent of heavenly beings as Sethites descending
    from a holy mountain, Seth being carried off by angels and receiving revelation
    about the Watchers and the Deluge, Seth’s later elevation as an exceptionally
    holy or quasi-divine patriarch, and Uriel teaching Seth and Enoch calendrical
    and astronomical distinctions.'
