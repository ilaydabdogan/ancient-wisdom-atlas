canonical_text:
  quote: ''
  summary: The passage recounts births and naming of several children of Jacob through
    Bilhah, Zilpah, Leah, and Rachel, including the Lord opening Rachel's womb before
    Joseph's birth. After Joseph is born, Jacob asks Laban to release him with his
    wives and sons so that he may return to Isaac and make a house. Laban asks Jacob
    to remain for wages, and they agree that marked young animals will be Jacob's
    wages. The flocks produce marked offspring, Jacob's possessions multiply, and
    Laban and his sons envy him and act with hostile intent.
  language: English
  quote_policy: summarized
