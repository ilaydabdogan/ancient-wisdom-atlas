canonical_text:
  quote: ''
  summary: The passage commands Moses to warn Israel against giving daughters to Gentiles
    or taking Gentile wives for sons. It interprets such unions as defilement, reproach,
    and giving seed to Moloch, and states that judgment, curses, and rejection of
    offerings may fall on offenders and the nation if the sin is ignored. The deeds
    of the Shechemites against Dinah and the response of Jacob’s sons are presented
    as testimony; the Shechemites’ defeat by two sons of Jacob is said to have been
    reckoned as righteousness.
  language: English
  quote_policy: summarized
