canonical_text:
  quote: ''
  summary: In the generations associated with Ur of the Chaldees, people make and
    worship images while malignant spirits and Mastema’s agents seduce and corrupt
    them. Serug is named in connection with widespread sin; Serug worships idols,
    marries Melka, begets Nahor, and teaches Nahor Chaldean divination by heavenly
    signs. Nahor marries Ijaska and begets Terah. Mastema sends ravens and birds to
    consume seed and fruit, making the years barren and giving rise to the naming
    of Terah. The excerpt ends as Terah takes Edna as wife.
  language: English
  quote_policy: summarized
