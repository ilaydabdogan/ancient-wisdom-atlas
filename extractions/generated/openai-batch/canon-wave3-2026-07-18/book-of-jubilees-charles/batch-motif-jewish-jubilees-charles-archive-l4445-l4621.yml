  quote: "“I shall be their Father and they will be My children.”"
  summary: God declares that the people will cleave to His commandments and be known
    as His children. Moses is told to write the revealed words spoken on the mountain,
    covering the divisions of days, law, testimony, weeks, jubilees, and events until
    God descends and dwells with them forever. God then commands the angel of the
    presence to write for Moses from creation until the eternal sanctuary is built
    among them.
