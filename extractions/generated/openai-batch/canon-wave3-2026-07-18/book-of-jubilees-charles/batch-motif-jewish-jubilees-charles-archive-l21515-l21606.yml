canonical_text:
  quote: ''
  summary: The passage records the naming of a feast day as “Addition,” the death
    and burial of Deborah beneath an oak by a river, Rebecca’s return and Jacob’s
    sending of animals for Isaac, Jacob’s travel to Kabratan, and Rachel’s birth of
    a son first named for sorrow and then named Benjamin by his father. Rachel dies,
    is buried at Ephrath/Bethlehem, and Jacob builds a pillar on her grave. Editorial
    notes relate parts of the narrative to Genesis 35.
