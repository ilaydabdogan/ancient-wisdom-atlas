canonical_text:
  quote: ''
  summary: Title-page and preface material for R. H. Charles's 1902 edition and commentary
    on The Book of Jubilees. Charles explains the delayed production of the commentary,
    states that he came to date Jubilees earlier than the traditional first-century
    CE view, associates it with the Testaments of the XII Patriarchs and a Pharisaic/Maccabean
    milieu, describes its scholarly value for Second Temple Judaism and later Jewish
    and Christian literature, notes prior scholarship, and thanks Mr. Cowley for help
    with Talmudic references.
  language: English
  quote_policy: summarized
