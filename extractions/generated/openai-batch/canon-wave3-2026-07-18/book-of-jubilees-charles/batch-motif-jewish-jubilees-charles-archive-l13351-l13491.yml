canonical_text:
  quote: "“To thee and to thy seed will I give this land.”"
  summary: A blessing asks the eternal God to protect the traveler and gives instructions
    concerning Lot and Nahor. Abram journeys from Haran with Sarai and Lot into Canaan,
    sees pleasant land, receives the Lord’s promise of land for himself and his seed,
    builds altars and offers burnt sacrifices, blesses the Lord for leading him from
    Ur, moves south to Hebron and Bealoth, and goes to Egypt during a famine before
    his wife is torn away from him.
  language: English
