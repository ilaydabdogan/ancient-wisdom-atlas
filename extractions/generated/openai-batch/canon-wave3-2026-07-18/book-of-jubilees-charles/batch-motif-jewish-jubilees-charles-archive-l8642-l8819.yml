canonical_text:
  quote: ''
  summary: 'The passage gives a dated flood sequence: Noah enters the ark with what
    has been brought to him, the Lord closes it, seven heavenly flood-gates and seven
    mouths of the great deep release water, the waters cover the earth and mountains,
    the ark floats and then rests on Libar in the mountains of Ararat, the waters
    recede, the earth dries, and the ark is opened so that living creatures are sent
    out.'
