canonical_text:
  quote: ''
  summary: 'The introduction argues that Jubilees reflects a period of Maccabean ascendancy:
    it reads a promise to Jacob as anticipating worldwide dominion, emphasizes Levi
    over Judah in priestly and civil authority, connects the sons of Jacob''s conquest
    of Esau''s sons with Judah''s conquest of Edom in the Maccabean wars, notes Edom''s
    subjection under a yoke, and says another conflict with Amorite kings adumbrates
    the Maccabean wars.'
  language: English
  quote_policy: summarized
