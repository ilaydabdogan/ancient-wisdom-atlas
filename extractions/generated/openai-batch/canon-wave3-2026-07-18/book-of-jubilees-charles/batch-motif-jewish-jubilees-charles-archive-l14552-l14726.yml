canonical_text:
  quote: ''
  summary: The passage connects covenant observance with circumcision, exclusion,
    election, and heavenly governance. A covenant breaker is to be rooted out; Israel
    is commanded to observe the sign of the covenant as an eternal ordinance. The
    angels of the presence and angels of sanctification are associated with holiness,
    and Israel is sanctified to be with God and the holy angels. God chooses Israel
    rather than Ishmael, Esau, and their kin, gathers Israel from humankind, and rules
    Israel directly while spirits are placed over the nations. The passage also announces
    future Israelite failure to keep the circumcision ordinance.
  language: English
  quote_policy: summarized
