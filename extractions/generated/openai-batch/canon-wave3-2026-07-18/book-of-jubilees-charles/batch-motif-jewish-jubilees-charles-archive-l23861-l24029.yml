canonical_text:
  quote: ''
  summary: 'The passage closes a Joseph-in-Egypt scene: Pharaoh’s realm is ordered,
    Joseph receives a new name and a wife from Potiphar’s priestly household, Joseph
    stands before Pharaoh at thirty, Isaac dies, Egypt has seven years of abundant
    production, and Joseph stores food in the cities. The passage then begins the
    Judah and Tamar episode: Judah gives Tamar to Er, Er rejects her and is slain
    by the Lord, Onan is commanded to raise seed for his brother but spills seed and
    is slain, and Tamar is sent to wait as a widow for Shelah, whose mother prevents
    the marriage.'
  language: English
  quote_policy: summarized
