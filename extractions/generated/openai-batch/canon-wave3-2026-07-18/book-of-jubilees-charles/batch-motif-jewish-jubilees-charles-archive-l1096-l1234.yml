  summary: The introduction argues that the Ethiopic and Latin versions of Jubilees
    derive from Greek, and that the Greek version derives from a Semitic, specifically
    Hebrew, original. It weighs Aramaic-looking proper names, Mosaic attribution,
    Hebrew as sacred and national language, national-language revival, Hebrew retranslations,
    and surviving Hebraisms as evidence.
