- id: obs:4
  text: Abram prays to the Creator of all things to save him from human error, uncleanness,
    and vileness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At sowing time, people go out to guard their seed from ravens, and Abram goes
    with them as a fourteen-year-old lad.
