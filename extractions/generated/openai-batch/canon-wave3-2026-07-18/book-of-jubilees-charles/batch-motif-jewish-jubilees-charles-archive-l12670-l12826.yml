  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Those with Abram see him cry out and see the ravens turn back, and his name
    becomes great in the land of the Chaldees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: People who wish to sow come to Abram that year; they sow their land and bring
