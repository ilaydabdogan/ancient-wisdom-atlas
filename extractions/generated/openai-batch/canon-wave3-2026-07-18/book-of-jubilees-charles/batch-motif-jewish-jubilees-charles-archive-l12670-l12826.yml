canonical_text:
  quote: "“Descend not: return to the place whence ye came,”"
  summary: Abram is named after his maternal grandfather. As a young child he recognizes
    the error of idolatry, learns writing from his father, separates from his father’s
    idol worship, and prays to the Creator to be saved from human error. At sowing
    time he drives away ravens that threaten the seed, becomes renowned in Chaldea,
    and then teaches artificers to make a seed-vessel for ploughs so the seed is hidden
    in the earth. The next chapter opens with Abram addressing Terah and questioning
    the value of the idols Terah worships.
  language: English
  quote_policy: quoted
