  quote: ''
  summary: The passage reports Adam's death and burial in the land of his creation,
    explains his 930-year life through the interpretation that a divine day is one
    thousand years, recounts Cain's death by the falling stones of his house as retribution
    for killing Abel with a stone, states a heavenly-table rule of equivalent punishment,
    and gives Noah's marriage to ‘Em zAra and the births of Shem, Ham, and Japheth.
  language: English
