  quote: "“the guardian of Jacob is great and powerful and honoured”"
  summary: 'The passage presents Rebecca seeking sworn peace between Esau and Jacob,
    Esau promising to bury her near Sarah and to love Jacob, Jacob making a reciprocal
    promise, and Rebecca being buried by both sons in the double cave. It then begins
    Isaac’s deathbed instructions: he asks to be buried near Abraham in the double
    cave, commands righteousness, brotherly love, rejection of idols, remembrance
    of the God of Abraham, and begins to impose a great oath.'
