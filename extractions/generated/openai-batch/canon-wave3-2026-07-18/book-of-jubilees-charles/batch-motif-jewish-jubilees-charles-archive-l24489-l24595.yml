canonical_text:
  quote: ''
  summary: Joseph reveals himself to his brothers, explains that God sent him ahead
    to preserve life during famine, and sends gifts and transport for Jacob. Jacob
    is revived by the news and resolves to see Joseph. Israel/Jacob then journeys,
    sacrifices at the Well of the Oath, remembers Bethel, hesitates about Egypt, celebrates
    first-fruits amid famine, and receives a divine appearance telling him not to
    fear descent to Egypt and promising that he will become a great nation there.
  language: English
  quote_policy: summarized
