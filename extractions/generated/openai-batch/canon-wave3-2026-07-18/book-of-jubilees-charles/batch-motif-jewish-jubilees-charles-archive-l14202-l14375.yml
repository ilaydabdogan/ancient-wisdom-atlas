  quote: I shall establish My covenant between Me and thee, and thy seed after thee
  summary: Abram offers first-fruits and animal offerings on an altar. The Lord appears
    as God Almighty, announces an eternal covenant, renames Abram as Abraham, promises
    many nations, kings, descendants, and the land of Canaan, and commands circumcision
    of every male on the eighth day as the covenant's bodily token. The excerpt ends
    with the statement that an uncircumcised male will be cut off from his people.
  language: English
  quote_policy: quoted
