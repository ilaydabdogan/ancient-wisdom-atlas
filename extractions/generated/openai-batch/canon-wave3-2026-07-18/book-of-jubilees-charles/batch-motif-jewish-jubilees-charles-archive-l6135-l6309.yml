canonical_text:
  quote: for it is holier than all the earth besides, and every tree that is planted
    in it is holy.
  summary: 'The passage says that Adam, after forty days in the land where he was
    created, was brought into the garden of Eden to till and keep it; his wife entered
    on the eightieth day. It grounds a childbirth-purity commandment written on heavenly
    tables in this timing: after a male birth, seven days of uncleanness and thirty-three
    days of purifying; after a female birth, two weeks of uncleanness and sixty-six
    days of purification, eighty days total. Eden is described as holier than the
    rest of the earth, with holy trees.'
