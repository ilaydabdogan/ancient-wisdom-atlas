canonical_text:
  quote: ''
  summary: The passage describes the territorial portions allotted to Ham and Japheth
    and their descendants. Ham's second portion is bounded by the Gihon, the Garden
    of Eden, fiery mountains, western seas, Gadir, and the great sea. Japheth's third
    portion is described north of Tiné/Tina, extending through regions including Gog,
    Qélt, western waters, Farad/’Aférég, and Rafa, ending with five great islands
    and a northern great land. Editorial notes identify these portions with Africa,
    parts of Asia, northern Asia, and Europe, and compare details with other ancient
    and late antique sources.
  language: English
  quote_policy: summarized
