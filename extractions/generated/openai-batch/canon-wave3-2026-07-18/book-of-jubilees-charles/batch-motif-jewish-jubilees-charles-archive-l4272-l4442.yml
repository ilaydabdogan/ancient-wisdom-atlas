  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Afterward the people will turn to the divine speaker with all their heart,
    soul, and strength; the divine speaker will gather them from among the Gentiles
    and be found by them when they seek him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The text says the divine speaker will disclose peace with righteousness, includes
