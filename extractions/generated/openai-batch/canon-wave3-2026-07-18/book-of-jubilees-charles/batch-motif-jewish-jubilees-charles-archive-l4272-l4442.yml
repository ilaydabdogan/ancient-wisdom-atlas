canonical_text:
  quote: ''
  summary: The passage foretells captivity among the Gentiles, forgetting of law and
    sacred times, later repentance, divine gathering, peace, sanctuary, and covenant
    dwelling. Moses intercedes for the people, asking that they not be abandoned or
    ruled by Beliar. The Lord answers that the people will confess sin and that he
    will circumcise their hearts, create a holy spirit, and cleanse them.
  language: English
  quote_policy: summarized
