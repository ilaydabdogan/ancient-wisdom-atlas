canonical_text:
  quote: ''
  summary: The passage describes Jacob's tithing and sacrifice at Bethel, Levi's priestly
    function, an ordinance for annual second tithes recorded on heavenly tables, Jacob's
    intent to sanctify the place, the Lord's night appearance renaming Jacob as Israel
    and promising descendants, kingship, and possession of the earth, followed by
    the Lord's ascent and an angelic vision in which seven tablets reveal future events
    and instruct Jacob not to build an eternal sanctuary there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jacob tithed clean animals and made a burnt sacrifice; the passage states,
    with an editorially supplied negative, that he did not give the unclean animals
    to Levi, and that he gave Levi all the souls of the men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Levi performed the priestly office at Bethel before Jacob, in preference to
    his ten brothers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jacob gave his vow, tithed the tithe again to the Lord, and sanctified it
    so that it became holy to Him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tithing-again of the tithe is said to be ordained on the heavenly tables
    as an annual law without limit of days.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The second tithe is to be eaten before the Lord in the chosen place, and nothing
    from it is to remain from one year to the next.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Seed, wine, and oil are to be consumed within their season; anything left
    over and old is regarded as polluted and is to be burned with fire because it
    is unclean.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tithes of oxen and sheep are holy to the Lord, belong to His priests,
    and are to be eaten before Him year by year.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the following night Jacob resolved to build the place, surround the court
    with a wall, sanctify it, and make it holy forever for himself and his descendants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Lord appeared to Jacob by night, blessed him, and declared that his name
    would be Israel rather than Jacob.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Lord identified Himself as creator of heaven and earth and promised to
    increase Jacob, bring kings from him, give his seed the earth under heaven, and
    grant them rule and inheritance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After speaking, the Lord went up from Jacob, and Jacob watched until He had
    ascended into heaven.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In a night vision an angel descended from heaven holding seven tablets, gave
    them to Jacob, and Jacob read them and knew what would befall him and his sons
    throughout all ages.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The angel showed Jacob what was written on the tablets and told him not to
    build that place as an eternal sanctuary or dwell there, but to go to the house
    of Abraham and live with Isaac until Isaac's death; the angel also says Jacob
    will die in Egypt.
  category: speech
  evidence_refs:
  - ev:9
