- id: claim:2
  claim: The supplied editorial references link the Shechem and Bethel material with
    the Genesis 34-35 narrative complex, especially Jacob's reproach, the dread preventing
    pursuit, and household purification before Bethel.
  claim_level: same_motif
  target: Genesis xxxiv.30 and Genesis xxxv.2-5
  evidence_refs:
