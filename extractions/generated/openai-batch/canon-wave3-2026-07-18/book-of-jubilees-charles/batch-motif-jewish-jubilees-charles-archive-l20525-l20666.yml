canonical_text:
  quote: ''
  summary: The passage presents Levi and his descendants as blessed for priestly ministry
    because of zeal for righteousness, says heavenly tables record righteous persons
    and covenant transgressors differently, recounts the sons of Jacob killing Shechem,
    recovering Dinah, seizing goods, and being both divinely credited and reproached
    by Jacob, describes divine terror preventing surrounding cities from pursuit,
    and begins Jacob’s command to purify his household and go up to Bethel while putting
    away strange gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Levi and his sons are associated with priesthood and Levitical ministry before
    the Lord, and Levi and his sons are said to be blessed forever.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Levi is described as zealous to execute righteousness, judgment, and vengeance
    against those who arose against Israel.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A testimony in Levi's favor is inscribed on the heavenly tables, and his righteousness
    is remembered and recorded for later generations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The children of Israel are commanded not to sin, transgress ordinances, or
    break the covenant, but to fulfill it and be recorded as friends.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who transgress and work uncleanness are recorded on heavenly tables
    as adversaries and are removed from the book of life into a book associated with
    destruction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A heavenly writing is recorded in favor of the sons of Jacob on the day they
    slew Shechem, crediting them with righteousness, uprightness, and vengeance on
    sinners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sons of Jacob bring Dinah their sister out of the house of Shechem.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sons of Jacob take captive the livestock, wealth, and flocks of Shechem
    and bring them to Jacob their father.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Jacob reproaches the sons because they put the city to the sword and because
    he fears the Canaanites and Perizzites dwelling in the land.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The dread of the Lord is upon the cities around Shechem, and those cities
    do not pursue the sons of Jacob because terror has fallen on them.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Jacob tells the people of his house to purify themselves, change garments,
    and go up to Bethel, where he had vowed a vow when fleeing Esau.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Jacob says God had been with him, brought him into the land in peace, and
    commands the household to put away strange gods among them.
  category: speech
  evidence_refs:
  - ev:9
