- id: claim:3
  claim: The note on 'book of life' points to a comparable expression in Ethiopic
    Enoch xlvii.8, suggesting a shared register-of-life expression in nearby Jewish
    pseudepigraphic tradition.
  claim_level: linguistic_similarity
