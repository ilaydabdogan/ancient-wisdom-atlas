candidate_motifs:
- id: motif:1
  label: Heavenly accounting of righteousness and transgression
  taxonomy_refs:
  - divine_judgment
  - covenant
  basis: The passage repeatedly describes heavenly tables and books recording righteous
    friends, adversaries, and those appointed to destruction.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The exact function of the books is presented within this passage but not
    fully systematized here.
- id: motif:2
  label: Covenant obedience versus covenant-breaking
  taxonomy_refs:
  - covenant
  basis: Israel is commanded not to sin, transgress ordinances, or break the ordained
    covenant, while covenant transgression leads to hostile recording and destruction.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: ''
- id: motif:3
  label: Priestly legitimation through zeal for righteousness
  taxonomy_refs:
  - covenant
  basis: Levi and his descendants receive priestly and Levitical blessing in connection
    with Levi's zeal for righteousness, judgment, and vengeance.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The available taxonomy has no specific priesthood-legitimation family;
    'covenant' is only a broad fit.
- id: motif:4
  label: Divinely credited vengeance against sinners
  taxonomy_refs:
  - divine_judgment
  basis: Both Levi's zeal and the sons of Jacob's violence against Shechem are framed
    as righteousness, judgment, uprightness, and vengeance on sinners.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage reports the evaluation without supplying a general theory
    of violence.
- id: motif:5
  label: Recovery of a sister from an enemy house with plunder
  taxonomy_refs: []
  basis: Dinah, called the sister of the sons of Jacob, is brought out of the house
    of Shechem while the sons take livestock and wealth.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The broader Dinah episode is not fully included in the supplied passage,
    so the extraction is limited to recovery and plunder as stated here.
- id: motif:6
  label: Divine terror restraining pursuers
  taxonomy_refs:
  - divine_judgment
  basis: The dread of the Lord and terror fall on cities around Shechem, preventing
    them from pursuing the sons of Jacob.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not describe the mechanism of the terror beyond naming
    it as dread of the Lord.
- id: motif:7
  label: Ritual purification before ascent to a sacred site
  taxonomy_refs:
