canonical_text:
  quote: ''
  summary: Abraham offers daily burnt, sin, and thank-offerings at the altar, burns
    a seven-part incense morning and evening, and celebrates a seven-day festival
    with his household. He blesses his Creator, is associated with a future plant
    of righteousness and holy seed, and names the festival as the Lord's. The passage
    says the heavenly tables ordain Israel to keep the feast of tabernacles for seven
    days in the seventh month forever, dwelling in booths, wearing wreaths, and taking
    boughs and willows. Abraham takes palm branches and fruit of goodly trees and
    circles the altar seven times in the morning while praising God.
  language: English
  quote_policy: summarized
