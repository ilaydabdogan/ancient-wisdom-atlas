canonical_text:
  quote: ''
  summary: A mother prepares rice, covers it in a basket, and leaves for the spring.
    Her daughter stays behind, reaches for the rice, falls into the covered basket,
    and is hidden. When the mother returns, she hears a bird cry from the basket;
    after she uncovers it, a little brown rice bird flies away and calls back that
    the mother would not give it rice to eat.
