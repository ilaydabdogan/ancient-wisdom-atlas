canonical_text:
  quote: ''
  summary: The passage includes the close of one Tinguian narrative in which gold-covered
    betel-nuts summon people and compel Ini-init, the Sun, to attend a ceremony; he
    appears as a stone, later becomes a man, is recognized as a lost son named Aponitolau,
    pays bridewealth through his parents, and returns with Aponibolinayen to earth.
    It then begins another Tinguian narrative in which Aponibolinayen's beauty attracts
    the powerful suitor Gawigawen, whose mother Dinawagen negotiates marriage arrangements
    with Aponibolinayen's family amid magical hospitality.
  language: English
  quote_policy: summarized
