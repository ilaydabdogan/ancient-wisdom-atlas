candidate_motifs:
- id: motif:1
  label: Bride-price paid by repeated filling of a sacred or ritual house
  taxonomy_refs:
  - sacred_exchange
  basis: Aponibolinayen's price is negotiated as eighteen fillings of the spirit house
    with valuable things.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage calls it a spirit house but does not explain the ritual status
    of the exchange beyond the payment and satisfaction of the parties.
- id: motif:2
  label: Extraordinary beauty changes light, water, and surroundings
  taxonomy_refs: []
  basis: Aponibolinayen's appearance makes sunshine vanish, draws the river and fish,
    beautifies the route, and later makes Kadayadawan's house appear fire-like.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:9
  confidence: high
  cautions: The effects are described as consequences of beauty; the passage does
    not explicitly label them divine or sacred.
- id: motif:3
  label: Human body transformed into spring, shade tree, and valuables
  taxonomy_refs:
  - sacrifice
  basis: Aponibalagen kills an old man and uses his head, body, and blood to produce
    sparkling water, a tree, and beads.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The old man is killed to create benefits, but the passage does not describe
    the killing as voluntary or use the word sacrifice.
- id: motif:4
  label: Bride deceived by false report of husband's deformity
  taxonomy_refs: []
  basis: Aponibolinayen covers her face and avoids seeing Gawigawen because a jealous
    girl has told her he has three noses; animal speakers later refute the claim.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The motive of jealousy is explicit for the informant, but the passage
    does not show the informant speaking directly.
- id: motif:5
  label: Magical self-transformation enables escape
  taxonomy_refs:
  - shapeshifter
  - departure
  basis: Aponibolinayen runs away at night by changing herself into oil and sliding
    through the bamboo floor.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only one transformation is described in this passage.
- id: motif:6
  label: Animal encounters guide, correct, or redirect a fleeing woman
  taxonomy_refs: []
  basis: The rooster and monkey challenge the false report about Gawigawen, while
    the carabao transports Aponibolinayen across the ocean and reports her to Kadayadawan.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The animals do not all serve the same function; the rooster and monkey
    advise, while the carabao transports and informs another man.
- id: motif:7
  label: Ocean crossing on an animal mount
  taxonomy_refs:
  - departure
  basis: Aponibolinayen reaches the ocean, climbs onto a carabao, and is carried across
    to the other side.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not state that the ocean crossing completes a formal
    quest; it occurs within her flight.
- id: motif:8
  label: Magical messenger enforces ritual attendance by growth on body or animal
  taxonomy_refs: []
  basis: Magic betel-nuts are sent to summon relatives and threaten to grow on unwilling
    knees; one grows into a tall tree on Aponibalagen's pig until he agrees to attend.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The compulsion is shown for one invitee through the pig, not directly
    on a person's knee in this excerpt.
