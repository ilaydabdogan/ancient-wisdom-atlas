canonical_text:
  quote: ''
  summary: The passage narrates negotiations over Aponibolinayen's bride-price, wedding
    festivities, marvels caused by her beauty, the making of a spring through the
    killing and transformation of an old man, Aponibolinayen's concealment of her
    face because of a false report about Gawigawen, her magical escape as oil, encounters
    with animals during flight, her ocean crossing on a carabao, her marriage to Kadayadawan,
    and the dispatch of magic betel-nuts to summon relatives to a ceremony for the
    spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people of Nalpangan demand a high price for Aponibolinayen, and the agreement
    requires Gawigawen to fill the spirit house eighteen times with valuable things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the bride-price is paid, the people dance, beat copper gongs, and one
    dancer's neck-jars are described as singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Aponibolinayen comes down to dance, the sunshine vanishes, the river
    comes up into the town, and striped fish bite at her heels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the way to Adasen, the trail, grass, trees, streams, and Gawigawen's spring
    become unusually beautiful; grains of sand become beads and a water-jar resting
    place becomes a big dish.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aponibalagen asks for an old man because he wants to make a spring for Aponibolinayen.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Aponibalagen cuts off the old man's head and puts it in the ground; water
    bubbles up, the body becomes a shade tree, the blood becomes valuable beads, and
    the path is covered with big plates.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Aponibolinayen keeps her face covered and has not seen Gawigawen because a
    jealous pretty girl told her he had three noses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Aponibolinayen becomes unhappy, must feel her way while cooking, and escapes
    at night by using magical power to change herself into oil and slide through the
    bamboo floor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the jungle, a wild rooster asks where Aponibolinayen is going and tells
    her not to believe the report that Gawigawen has three noses.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A monkey also asks where she is going and says the report about Gawigawen
    must have come from someone who wanted to marry him herself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the ocean, Aponibolinayen climbs onto a carabao, which plunges into the
    water and swims with her to the other side.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The carabao brings Aponibolinayen to a large orange tree, then tells its master
    Kadayadawan about the beautiful girl.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kadayadawan prepares himself, goes to the orange tree, becomes acquainted
    with Aponibolinayen, persuades her to become his wife, and takes her home.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Every night after the marriage, Kadayadawan's house looks as if it is on fire
    because of Aponibolinayen's beauty.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Kadayadawan and Aponibolinayen decide to make a ceremony for the spirits and
    send oiled magic betel-nuts to invite relatives, instructing them to grow on the
    knees of anyone unwilling to attend.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: A magic betel-nut summons Aponibalagen; when he refuses because he is searching
    for his lost sister, it grows into a tall tree on his pig until he agrees to go.
  category: sequence
  evidence_refs:
  - ev:11
