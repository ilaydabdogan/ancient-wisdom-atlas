canonical_text:
  quote: ''
  summary: 'The passage opens with people returning from hiding as the sea withdraws.
    It then begins the Moro tale of Bantugan: Bantugan seeks to marry a Sultan''s
    daughter, sends his son Balatama through dangerous obstacles to deliver the proposal,
    and the court demands extraordinary bridal gifts. Balatama produces a gold statue
    whose display causes earthquake, storm, darkness, and falling stones, forcing
    the Sultan to accept. On the return journey Balatama is detained. Meanwhile a
    Spanish General threatens the Sultan''s city with a vast fleet and demands the
    Princess for himself, while Bantugan prepares to search for his missing son.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People come out of hiding, return to their homes, and the sea withdraws from
    the land, leaving lowlands to the people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bantugan is described as a very strong man in the valley of the Rio Grande
    before Spanish occupation of Mindanao; his father is said to be the brother of
    earthquake and thunder.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bantugan wishes to marry the Sultan's daughter, and his son Balatama is chosen
    to carry the proposal over a long hazardous journey while wearing his father's
    arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Balatama encounters a wooden fence around a stone shaped like a man; when
    he tries to cut the fence, darkness and house-sized falling stones occur, and
    he uses his father's shield and calls homeland winds to clear the air.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A great snake in the road identifies itself as the guard of the road and forbids
    passage; Balatama cuts it in two with his fighting knife and throws the pieces
    into the sea and mountains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Balatama reaches a high glistening rock overlooking a city with ten harbors,
    including a crystal house and a gold house, before arriving at the town gate.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Balatama states his errand to the Sultan, who asks his courtiers to decide
    whether he should give his daughter to Bantugan in marriage.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The court and the Princess's sister demand extraordinary marriage gifts, including
    a pure-gold human figure, a thick gold floor, gifts as numerous as grass blades,
    a stone bridge, a stone ship, and golden transformation of coconuts and leaves.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: When threatened unless he produces the gold statue immediately, Balatama draws
    it from his helmet; earthquake, storm, and falling stones follow, and the Sultan
    asks him to put it back and agrees to the marriage with the statue as the only
    gift.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: On the way home Balatama reaches the fence around the human-shaped stone and
    is detained there for four months.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A Spanish General decides to marry the Sultan's daughter himself and arrives
    at the Sultan's city with a warship and ten thousand other ships, filling the
    harbor and frightening the people.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The General's brother demands the Princess for the General and threatens citywide
    destruction if refused; the Sultan and courtiers agree, setting the wedding for
    the next full moon.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Bantugan prepares for the expected marriage, becomes alarmed when Balatama
    does not return, fears he may be dead, and prepares a search expedition with a
    gold-flagged warship.
  category: sequence
  evidence_refs:
  - ev:13
