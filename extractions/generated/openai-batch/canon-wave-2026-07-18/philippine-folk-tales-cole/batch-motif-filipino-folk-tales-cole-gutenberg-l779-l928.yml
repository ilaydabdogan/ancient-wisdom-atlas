canonical_text:
  quote: ''
  summary: 'The excerpt first concludes an episode in which magic betel-nuts carry
    people across a river to a ceremony, Gawigawen seizes Aponibolinayen during dancing,
    Kadayadawan kills and revives him, compensation is arranged, and Kadayadawan’s
    guardian spirit gives a golden house. It then begins “Gawigawen of Adasen”: sick
    Aponibolinayen secretly longs for Gawigawen’s oranges; Aponitolau brings substitute
    foods, heals animals after taking food from them, discovers her true desire by
    becoming a centipede, prepares for a dangerous journey with a life-token vine
    and weapons, and ignores warnings or bad signs from supernatural figures on the
    road.'
  language: English
  quote_policy: summarized
