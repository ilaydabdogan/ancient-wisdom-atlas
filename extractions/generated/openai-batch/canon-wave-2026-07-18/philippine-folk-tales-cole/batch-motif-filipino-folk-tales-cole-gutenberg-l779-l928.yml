- id: motif:2
  label: seizure of a woman at a ceremony
  taxonomy_refs:
  - stolen_beloved
  basis: Gawigawen seizes Aponibolinayen during dancing and puts her in his belt.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: Gawigawen claims she is his lost wife, so the passage frames the seizure
    through conflicting marital claims rather than a simple abduction.
- id: motif:3
  label: killing followed by restoration to life
  taxonomy_refs:
  - resurrection
  basis: Kadayadawan kills Gawigawen with a spear, and the victim is then brought
