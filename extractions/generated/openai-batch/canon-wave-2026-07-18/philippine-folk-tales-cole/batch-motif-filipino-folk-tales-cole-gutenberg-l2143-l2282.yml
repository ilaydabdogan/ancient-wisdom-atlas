canonical_text:
  quote: ''
  summary: The passage contains the end of an Alan episode, the Tinguian tale of Sogsogot,
    a Tinguian tale of mistaken marriage gifts, and the opening of a tale in which
    Elonen is swallowed by a stone. Supernatural beings demand a special bead and
    burn a man's house when refused. Sogsogot is carried by a large bird to a nest
    in a tall tree, survives there, returns home with the help of young birds, later
    follows his dead wife to a spirit town, hides from man-eating spirits using white
    chicken feathers, and returns home. Siagon's marriage proposal is misunderstood
    after a messenger mistakes nodding eaters for consenting relatives. Elonen catches
    a bird, loses it when his grandmother eats it, and asks a stone to swallow him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Alan see the man fall, believe him dead, come down from a tree, and lay
    gold and beads on him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man rises and tells the Alan to go away; the Alan demand one bead called
    nagaba and say he may keep the rest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the man refuses the bead, the Alan say they will burn his house; soon
    after he reaches home, his house burns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sogsogot is hunting in the mountains and forest when a big bird catches him
    in its claws and carries him over the mountains to a nest in a big tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sogsogot cannot climb down from the tall tree and finds two young birds and
    three little pigs in the nest.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sogsogot eats the pigs, feeds the young birds, receives more pigs and deer
    from the mother bird, and later holds the young birds' legs as they carry him
    safely to the ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Sogsogot returns home, people hear about his trip, make a ceremony for
    the spirits, and rejoice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: While returning from fighting in a hostile town, Sogsogot meets the spirit
    of his dead wife driving a cow and two pigs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sogsogot's wife tells him that she is dead and gives him only her shortest
    finger when he wants to touch her hand.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The wife instructs Sogsogot to get a white chicken and follow the footmarks
    of the cow and pigs.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: At a river, the wife tells Sogsogot he may come to the spirit town, where
    she will hide him in a rice-bin and where he must throw white chicken feathers
    at night visitors who want to eat him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the spirit town, people come at night to eat Sogsogot, but the white chicken
    feathers frighten them away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After about two weeks, when the feathers are nearly gone, Sogsogot asks to
    leave; his wife shows him the way home and gives him rice for the journey.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: When Sogsogot returns home, people tell him his wife had died and was buried
    under the house.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Siagon's parents seek a suitable wife for him and send a man to ask a distant
    maiden's parents about the match.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The messenger sees the maiden's household nodding while eating periwinkles
    and mistakes the nodding for approval of the marriage proposal.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: Siagon's parents bring animals, kettles, basi jars, blankets, and pigs as
    presents, surprising the maiden's people, who had not expected the marriage proposal.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: Elonen makes a bird snare after a little bird repeatedly calls to him, catches
    the bird, and places it in a jar.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: Elonen's grandmother eats the bird while he is away; Elonen goes into the
    forest, asks a big stone to open its mouth and eat him, and the stone swallows
    him.
  category: sequence
  evidence_refs:
  - ev:15
