canonical_text:
  quote: ''
  summary: 'The passage closes a prior episode in which a spider, spirits of springs,
    golden beads, and a thread settle a debt, followed by feasting and Dumalawi remaining
    with his wife in his created town. It then begins the Tinguian story of Kanag:
    Kanag is sent to guard rice, becomes lonely, turns into a little bird, and refuses
    to return to boyhood, saying he prefers to carry spirit messages and give signs.
    His bird omens guide Aponitolau before battle. Aponitolau defeats a hostile town
    with weapons and magic, displays the enemies'' heads, and holds a feast. Kanag
    again refuses to become a boy to marry, so his parents send spirit servants after
    him. The servants draw girls to a well by magic; Kanag sees a beautiful girl,
    becomes a man, and gives her betel-nut.'
  language: English
  quote_policy: summarized
