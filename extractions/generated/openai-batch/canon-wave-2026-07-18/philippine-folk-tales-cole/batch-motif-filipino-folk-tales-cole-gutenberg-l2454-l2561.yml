canonical_text:
  quote: ''
  summary: Dogedog loses his rice to a cat, traps the cat, spares it after it promises
    usefulness, and later finds it changed into a cock. Taking the cock to Magsingal
    for a cockfight, he is joined by an alligator, a deer, a speaking mound of earth,
    and a monkey, each with a special ability. The cock and the companions defeat
    all challengers, winning Dogedog enough wealth to buy horses, carry sacks of silver,
    and purchase a rich man's house.
  language: English
