canonical_text:
  quote: ''
  summary: The passage begins with a brief remnant about a wooded island where white
    monkeys serve a Princess living inside a mountain and where attendants of Bantugan's
    wife may be heard singing. It then introduces the tales of Christianized Philippine
    tribes as shaped by old customs and outside influence. The Ilocano tale "The Monkey
    and the Turtle" tells how a hungry monkey and a turtle steal banana plants; the
    turtle's plant bears fruit, the monkey withholds the ripe bananas, and the turtle
    kills him through a bamboo trap. The turtle then sells the monkey's dried meat
    to other monkeys, escapes their revenge by tricking them into throwing him into
    water, and finally deceives them into drowning. The passage ends with the opening
    of "The Poor Fisherman and His Wife," in which an old fisherman catches a great
    white fish, he and his wife misidentify it as a priest or governor, and they flee
    after mistaking holiday cannons and bells for signs of pursuit.
  language: English
  quote_policy: summarized
