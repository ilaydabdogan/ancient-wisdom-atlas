canonical_text:
  quote: ''
  summary: Ini-init, the Sun, discovers and marries Aponibolinayen, who has been secretly
    cooking in his house. She makes fish from a stick by magical power. She later
    accompanies him across the sky, melts from the heat, is bottled and dropped to
    earth, and is found near a spring by her townspeople. During preparations for
    a spirit ceremony, a baby boy emerges from her pricked little finger and grows
    rapidly when bathed.
  language: English
  quote_policy: summarized
