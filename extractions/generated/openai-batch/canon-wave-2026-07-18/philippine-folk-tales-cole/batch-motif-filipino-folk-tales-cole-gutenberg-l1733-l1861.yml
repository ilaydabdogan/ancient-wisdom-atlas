canonical_text:
  quote: '"Sayen thinks I am Danepan, but Laey I am."'
  summary: The passage tells of Sayen, son of an old Alan, who mistakenly marries
    Laey instead of Danepan, kills Laey and their baby by sabotaging a bridge, attacks
    Danepan's town, revives the slain after chewing betel-nut, kills the murderous
    Komow for Magosang, fights Kaboniyan to a draw, joins him in raids, escapes by
    becoming a fish or chicken, and is finally trapped and killed. The passage ends
    with the heading and opening line of a Sun and Moon tale.
  language: English
  quote_policy: quoted
