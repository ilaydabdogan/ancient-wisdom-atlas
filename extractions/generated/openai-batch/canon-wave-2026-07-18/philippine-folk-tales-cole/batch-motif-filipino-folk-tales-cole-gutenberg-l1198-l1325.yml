canonical_text:
  quote: ''
  summary: Aponitolau waits in a sugar-cane field and sees stars descend; a beautiful
    star-woman removes a star-like dress. After he frightens the other stars and sits
    on her dress, she identifies herself as Gaygayoma, daughter of Bagbagak and Sinag
    in the air, and compels him under threat to go with her to the sky in a basket.
    He lives among the stars, has a miraculously born son, Takyayen, and later returns
    periodically between his earth wife Aponibolinayen and Gaygayoma in the sky. Gaygayoma’s
    tears appear below as falling water while the sun is shining. The passage ends
    with the opening of another tale, in which Aponitolau becomes angry with his son
    Dumalawi and plans to destroy him.
  language: English
  quote_policy: summarized
