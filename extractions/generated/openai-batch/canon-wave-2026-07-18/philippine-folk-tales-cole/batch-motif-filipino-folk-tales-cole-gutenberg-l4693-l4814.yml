canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which Benito obtains water from heaven
    and the lower world by sending a bird with bamboo cups. The heavenly water transforms
    the Princess after she cuts herself, while the lower-world water turns the King
    into an ugly creature that vanishes. Benito marries the Princess, becomes king,
    and provides land for his parents. The passage then begins the Tagalog tale “The
    Adventures of Juan,” in which a foolish, lazy boy repeatedly spares a magic tree
    in exchange for magical gifts. A cunning friend steals several gifts after getting
    Juan drunk, but a magic stick activated by command words forces restitution, reverses
    Juan’s position in his household, and later kills robbers.
  language: English
  quote_policy: summarized
