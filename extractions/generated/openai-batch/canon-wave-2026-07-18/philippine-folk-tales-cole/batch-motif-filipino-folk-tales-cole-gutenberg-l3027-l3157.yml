  summary: The passage introduces Bukidnon and Bagobo beliefs in Mindanao spirits,
    then gives Bukidnon tales explaining the moon and stars, a flood caused by a giant
    crab and survived by people and animals on a raft, and the opening of a tale about
    Magbangal preparing to clear land for planting.
