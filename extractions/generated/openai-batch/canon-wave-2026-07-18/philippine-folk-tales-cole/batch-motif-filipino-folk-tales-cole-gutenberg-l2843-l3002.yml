canonical_text:
  quote: ''
  summary: 'The passage ends a Tinguian Lumawig episode in which Fugan is placed in
    a wooden coffin with a dog and cock and floated to Tinglayen, where a widower
    finds and marries her. It then gives Igorot tales: the Moon cuts off the Sun''s
    son''s head, the Sun restores him, and declares that people on earth will thereafter
    cut off each other''s heads; two mistreated wood-gathering brothers are separated
    when one gives his bones as wood and becomes a serpent eagle; two friends tattoo
    each other unequally and become a lizard and a crow; and the opening of a tale
    in which a girl asks her mother for raw rice.'
  language: English
  quote_policy: summarized
