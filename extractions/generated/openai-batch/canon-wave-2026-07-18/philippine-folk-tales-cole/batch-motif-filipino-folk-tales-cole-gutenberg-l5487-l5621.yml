canonical_text:
  quote: ''
  summary: A sequence of explanatory notes describes Tinguian practices, material
    objects, beliefs about omens and spirits, and several comparative folklore parallels,
    including a life-linked tree or vine, animal helpers, star-dress beings, food
    multiplication comparisons, omen birds, and offerings to a grain-multiplying spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tinguian are described as using rice-straw ashes or tree bark soaked in
    water as substitutes for soap when washing hair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The condition of a certain tree or vine is said to reveal whether an absent
    person is well or dead.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tinguian stove is described as a bed of ashes with three stones on which
    pots are placed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tinguian are described as carrying a head-ax, shield, and long steel-pointed
    spear for work, hunting, or warfare.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The shield is described as having prongs that can be slipped about a victim's
    neck or legs while the head-ax is used.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the people talked with lightning and thunder, and
    that thunder is now believed to be the dog of Kadaklan, whose barking communicates
    the god's desires.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Stories in which animals assist human beings are said to occur in many lands;
    ants sorting grain for Cinderella is given as a familiar European example.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: An ancient custom is described of placing the heads of slain enemies at a
    gate or around a town, followed in later custom by exposing a head for three days,
    breaking skulls, and giving pieces to guests.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tinguian beliefs are said to include many giants, some with more than one
    head, and a ritual passage describes a tall fat man with nine heads.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Large bamboo poles are described as serving as water buckets and as planting
    tools with hardwood points.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: 'The passage describes beings with star dresses: when wearing the dresses
    they are stars, and when the dresses are removed they are human.'
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Small elevated bamboo houses near rice fields are used by watchers, sometimes
    connected to flappers by strings to frighten birds from the grain.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: Cold mountain mornings are described with groups of people wrapped in blankets
    and squatting around small fires.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:14
  text: A note instructs comparison with the biblical story of the loaves and fishes
    and lists similar incidents among the Igorot, in Borneo, and in India.
  category: other
  evidence_refs:
  - ev:13
- id: obs:15
  text: 'The passage says there appear to have been two classes of spirits: one highly
