    life before irrigated fields were known.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:17
  text: The labeug is described as an omen bird and direct messenger of Kadaklan to
    the people.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:18
  text: Before ripened rice is stored, pig blood mixed with cooked rice is placed
