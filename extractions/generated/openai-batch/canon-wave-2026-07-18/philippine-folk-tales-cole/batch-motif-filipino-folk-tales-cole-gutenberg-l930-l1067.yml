canonical_text:
  quote: ''
  summary: Aponitolau continues despite warnings, crosses the sea by magical use of
    his head-ax, reaches Adasen, and enters Gawigawen’s town with help from a spider.
    He is challenged to eat a whole carabao, which ants and flies consume for him,
    then gathers oranges from a knife-branched tree but is cut and dies after sending
    two oranges home by spear. Aponibolinayen eats the oranges and recognizes his
    death by a wilted vine. Their son Kanag is born, grows rapidly, learns of his
    father’s death, and sets out to retrieve him. Kanag passes tests by lightning
    and thunder without flinching, challenges Gawigawen, leaps over the high bank
    into town, sees signs of violence there, and vows to kill Gawigawen.
  language: English
  quote_policy: summarized
