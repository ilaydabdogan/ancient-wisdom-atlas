candidate_motifs:
- id: motif:1
  label: quest for guarded fruit in a distant place
  taxonomy_refs:
  - mystical_quest
  basis: Aponitolau travels across the sea to Adasen for oranges controlled by Gawigawen
    and must overcome barriers and tests to obtain them.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents the fruit as desired for Aponitolau’s wife, but does
    not explain a broader cosmological or ritual meaning for the oranges.
- id: motif:2
  label: magical object as vehicle across water
  taxonomy_refs:
  - departure
  basis: Aponitolau’s head-ax sails across the ocean when he steps on it, carrying
    him to the other side.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy has no specific vehicle or magic-object motif;
    the departure reference is a broad fit.
- id: motif:3
  label: animal helpers solve impossible tasks
  taxonomy_refs: []
  basis: The spider provides a thread for climbing an otherwise inaccessible bank,
    and ants and flies consume the whole carabao that Aponitolau cannot eat.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives practical aid by animal figures but does not state a
    reason for their help.
- id: motif:4
  label: ascent over an inaccessible boundary
  taxonomy_refs:
  - ascent
  basis: Aponitolau climbs a spider thread up a high bank reaching nearly to the sky,
    while Kanag later jumps over the same bank into town.
  evidence_refs:
  - ev:3
  - ev:11
  confidence: high
  cautions: The ascent is into a hostile town rather than explicitly to a heavenly
    or cosmic realm.
- id: motif:5
  label: life-token plant signals death
  taxonomy_refs: []
  basis: Aponibolinayen sees the vine’s leaves wilted and knows that Aponitolau is
    dead.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not explain when or how the vine was linked to Aponitolau’s
    life.
- id: motif:6
  label: rapidly maturing child seeks dead father
  taxonomy_refs:
  - miraculous_child
  basis: Kanag is born after Aponitolau’s death, grows rapidly into a strong brave
    boy, and sets out after learning that Gawigawen killed his father.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The birth itself is not described as supernatural in this passage; only
    rapid growth and exceptional bravery are stated.
- id: motif:7
  label: ordeal by thunder and lightning as favorable sign
  taxonomy_refs: []
  basis: Kanag stands on a high rock while lightning flashes and thunder sounds; because
    he does not move, both declare his sign good and send him onward.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage frames the events as sign tests but does not define the full
    divinatory system.
- id: motif:8
  label: son’s challenge to father’s killer
  taxonomy_refs: []
  basis: After learning that Gawigawen killed his father, Kanag travels to Adasen,
    announces that Gawigawen must prepare to fight, and vows to kill him.
  evidence_refs:
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage ends before the fight occurs, so the outcome is not included
    here.
