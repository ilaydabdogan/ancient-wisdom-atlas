canonical_text:
  quote: ''
  summary: Aponitolau repeatedly tries to destroy his son Dumalawi, first with sharpened
    bamboo sticks and then by intoxicating him with basi and sending him away by a
    magical storm. Dumalawi wakes in a vast empty field, magically grows gold-covered
    betel-nuts, scatters them so they become people, and marries Dapilisan. The couple
    prepare a ceremony for the spirits; animated gold-covered betel-nuts invite people,
    including Dumalawi's grieving mother Aponibolinayen. Guests cross a river on alligators,
    with Aponitolau delayed. A feast and marriage-price payment follow, involving
    a small jar of basi, spirits from springs, and jars filling the spirit house nine
    times; Dalonagan then asks for more and calls a pet spider.
  language: English
  quote_policy: summarized
