canonical_text:
  quote: ''
  summary: The passage first gives cosmological accounts in which a star-child of
    the Sun and Moon is cut apart and scattered to become many stars, and another
    child, a gigantic crab, causes lightning, tides, waves, and threatens the Moon
    until people frighten it away with shouting and gongs. It then begins a Subanun
    tale in which a widow's son hunts a strange pig, enters a stone dwelling, shares
    food and drink with its master, becomes his brother, returns home, is attacked
    by seven armed men, receives supernatural aid, defeats them, and then seeks further
    combat at a giant's house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun and Moon have a first child described as a large star like a man;
    the Sun cuts this child into small pieces and scatters them across the sky, after
    which many stars exist.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another child of the Sun and Moon is a gigantic crab whose eye movements produce
    lightning, whose movement in and out of a sea-bottom hole is linked to tides,
    and whose motion causes great waves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The crab sometimes tries to swallow the Moon, and people on earth shout and
    beat gongs to frighten the crab away and save the Moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A widow and her only son live at the edge of a village and support themselves
    by growing rice on mountain clearings and hunting wild pig.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The widow's son goes hunting before dawn with a spear and dog after asking
    his mother to prepare rice for him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the forest, the dog finds a large black pig with four white legs, and the
    pig runs straight up the mountain rather than toward a watercourse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The pig pauses six times before the boy can throw his spear; on the seventh
    pause, on a large flat rock, the boy kills it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the pig is killed, a door opens in the large stone, and a man comes
    out asking why the boy killed his master's pig.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Inside the stone is a large room with red and yellow striped coverings, and
    the master wears trousers, jacket, and head-kerchief of seven colors.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy and the master chew betel-nut, drink wine from a large jar, eat rice
    and fish, and the master says he wants to make the boy his brother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy stays seven days in the stone house and then leaves early in the morning
    to return to his mother.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the return journey, the boy encounters seven armed men dressed in different
    colors, each with eyes matching his clothes; their red-clad leader says they kill
    whatever has life and must kill the boy also.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: A nearby voice tells the boy to fight; he sees his spear, shield, and sword
    from home, and understands the command as coming from a spirit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The boy fights the seven warriors for three days and nights; on the fourth
    day he kills the red leader and then the other six.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: After killing the seven warriors, the boy is crazed with fighting, goes looking
    for more to kill, and challenges a giant whose house is full of conquered men.
  category: sequence
  evidence_refs:
  - ev:10
