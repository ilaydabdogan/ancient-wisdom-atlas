candidate_motifs:
- id: motif:1
  label: celestial parent-child origin of stars through dismemberment
  taxonomy_refs:
  - divine_parent_child
  basis: The star is a child of the Sun and Moon; the Sun cuts the star-child apart
    and scatters him over the sky, explaining the presence of many stars.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents celestial bodies as parents and child, but it does
    not explicitly call them deities; the taxonomy reference is therefore approximate.
- id: motif:2
  label: cosmic animal causing tides, waves, and lightning
  taxonomy_refs: []
  basis: The gigantic crab's eyes make lightning, its position in a sea-bottom hole
    is linked to high and low tide, and its movement causes waves.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No available motif-family taxonomy exactly matches this cosmological animal
    pattern.
- id: motif:3
  label: moon-swallowing creature repelled by communal noise
  taxonomy_refs: []
  basis: The crab tries to swallow the Moon, and people save her by shouting and beating
    gongs until the crab is frightened away.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage supports the lunar attack and noise-rescue pattern, but it
    does not explicitly name the event as an eclipse.
- id: motif:4
  label: hunter follows marked animal to hidden dwelling
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: The boy leaves home to hunt, pursues a distinctive pig up the mountain, kills
    it on a rock, and then discovers a doorway into the stone leading to an inhabited
    hidden house.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The quest or departure reading is inferred from narrative structure; the
    passage itself frames the action as an ordinary hunt that becomes strange.
- id: motif:5
  label: ritualized hospitality creates brotherhood
  taxonomy_refs:
  - sacred_exchange
  basis: The stone-house master shares betel-nut, wine, rice, and fish with the boy
    and declares he wishes to make him a brother.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The exchange is explicit, but the passage does not explain the ritual
    or social rules behind the brother-making.
- id: motif:6
  label: trial by seven armed opponents with supernatural aid
  taxonomy_refs:
  - initiation
  basis: The returning boy meets seven armed warriors who threaten him, receives a
    command from a spirit and his weapons from home, fights for three days and nights,
    and kills all seven.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The combat trial is clear, but its function as initiation is interpretive
    and should be reviewed.
- id: motif:7
  label: battle frenzy leading to giant challenge
  taxonomy_refs: []
  basis: After killing the seven warriors, the boy becomes crazed with fighting, seeks
