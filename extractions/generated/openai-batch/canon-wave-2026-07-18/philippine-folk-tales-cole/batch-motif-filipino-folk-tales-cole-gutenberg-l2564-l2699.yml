canonical_text:
  quote: ''
  summary: The passage introduces Igorot social life and beliefs, especially the sky-dwelling
    Great Spirit Lumawig. It then gives an Igorot creation story in which Lumawig
    turns paired reeds into speaking men and women with different languages, commands
    marriage, and assigns salt and pottery-making to particular communities. The passage
    continues with a flood story in which Lumawig’s two sons flood the flat world
    to make mountains for hunting, causing mass drowning except for a brother and
    sister at Pokis; Lumawig descends and tries to provide them fire through his dog
    and deer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Igorot are described as living several days’ journey south and east of
    the Tinguian, separated by difficult mountain trails and swift rivers, with little
    intercourse between the groups.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Salt, weapons, and jars are sometimes exchanged between the groups, although
    their customs and beliefs are described as dissimilar.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Igorot village and house arrangement is described, including grass-roofed
    houses, storage above, cooking and eating below, a small family bedroom, girls’
    dormitory, and men’s council house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Igorot cultivate terraced mountain fields using water brought from streams
    through troughs and ditches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lumawig is described as the Great Spirit who lives in the sky, watches over
    the Igorot, controls winds and rains, and provides crops and health.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lumawig is believed to have created the Igorot and once lived among them on
    earth; the Igorot perform a monthly ceremony praying for protection, health, and
    crops.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the beginning of the creation story there are no people on earth; Lumawig
    comes down from the sky and cuts many reeds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lumawig divides reeds into pairs, places them in different parts of the world,
    commands them to speak, and the reeds become male and female people with differing
    languages.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Lumawig commands each man and woman to marry, and their descendants speak
    the same language as their parents.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Lumawig creates salt and first instructs one group to boil it down and sell
    it, but they do not understand his directions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Lumawig gives the salt to the people of Mayinit, who follow his directions
    and are told they will always own the salt while others must buy from them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Lumawig tells the people of Bontoc to make pots; after they fail to shape
    jars properly, he transfers pottery-making to Samoki, whose people make well-shaped
    jars and are told to make jars to sell.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: In the flood story, the world is initially flat and without mountains, and
    two brothers, sons of Lumawig, are fond of hunting.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:14
  text: The older brother proposes causing water to cover the world so that mountains
    will rise up for hunting wild pig and deer.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: The brothers cause water to cover the earth and set the town head-basket as
    a trap, catching wild pigs, deer, and many people.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: Lumawig sees from the sky that his sons have flooded the earth and that all
    people have drowned except a brother and sister at Pokis on one uncovered spot.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: Lumawig descends, speaks to the surviving boy and girl, and learns that they
    are alive but very cold.
  category: action
  evidence_refs:
  - ev:15
- id: obs:18
  text: Lumawig commands his dog and deer to get fire for the survivors; they delay,
