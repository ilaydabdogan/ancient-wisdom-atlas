canonical_text:
  quote: ''
  summary: 'The passage closes a Kanag and Dapilisan marriage episode involving bird
    transformation, bride-price, magical replenishing of jars, and a spider-web test
    with gold beads. It then gives the Tinguian story of the Tikgi: bird beings offer
    to cut Ligi''s rice, magically ripen and harvest it, fill his granary, attend
    a spirit ceremony, and are followed to a bana-asi tree where they remove feathers
    and become one maiden. Magic betel-nuts identify her as the long-missing daughter
    of Ebang and her husband; she says Kaboniyan carried her to the tree until she
    changed into tikgi birds to find Ligi. Ligi marries her, followed by prolonged
    feasting and dancing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kanag identifies himself as the son of Aponitolau and Aponibolinayen, and
    Dapilisan identifies herself as the daughter of Bangan and Dalonagan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kanag follows Dapilisan home, tells her parents his name and that he had changed
    into a little bird, and asks to marry their daughter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before Kanag and Dapilisan can marry, the bride-price is discussed, and Bangan
    and Dalonagan require the spirit house to be filled nine times with different
    kinds of jars.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dalonagan makes half of the jars disappear by raising her eyebrows, and Aponibolinayen
    uses magical power to fill the spirit house again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dalonagan requires a spider web to be put around the town with gold beads
    on it; when she hangs on it and it does not break, she declares the sign good.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kanag and Dapilisan are married, and the people play copper gongs, dance,
    and make merry for a long time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ligi hears tikgi birds offering to cut his rice; he initially says birds cannot
    cut rice, but later tells them to return when the grain is ripe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Ligi leaves the field, the tikgi birds use magic so that the rice grows
    rapidly and is ripe five days later.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The tikgi birds command rice cutters to cut by themselves and bands to tie
    the cut rice into bundles by themselves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ligi sees five hundred bundles of cut rice, offers the tikgi payment, and
    each tikgi takes only one head of rice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the next workday the tikgi finish cutting all the rice and tell Ligi that
    the rice will be in his granary; he returns home and finds the granary full.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Ligi's ceremony for the spirits, the tikgi fly over the people's heads,
    make them drink basi until drunk, and say they must go home because they cannot
    sit among the people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ligi follows the departing tikgi to the bana-asi tree and sees them take off
    their feathers, place them in the rice granary, and become one beautiful maiden.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The maiden says she became tikgi and cut rice for Ligi so that he would find
