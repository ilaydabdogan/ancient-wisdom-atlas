  summary: The passage contains the ending of a flight episode in which an old couple
    die from fear after misreading bells and falling fruit, the Ilocano tale of an
    unjust presidente who grows horns and is exposed through a bamboo-borne voice,
    the Ilocano tale of a monkey who turns losses into coerced exchanges until a dog
    kills him, and the opening of an Ilocano tale about a kind childless couple who
    have long prayed for a child.
