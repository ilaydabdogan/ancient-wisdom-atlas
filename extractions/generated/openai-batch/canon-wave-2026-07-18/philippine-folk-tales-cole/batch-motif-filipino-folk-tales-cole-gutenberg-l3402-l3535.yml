canonical_text:
  quote: ''
  summary: The passage contains the end of a sky-return episode in which an unhappy
    man is lowered from the sky and becomes an owl, followed by Bilaan creation accounts
    about Melu making the earth and people, a Mandaya account of egg-born first ancestors
    from limokon birds, and a Mandaya account explaining the Sun's continuing chase
    of the Moon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One man who had followed Lumabet is unhappy in the sky, keeps looking down
    at the land, fears the spirits' proposal to remove his intestines, and asks to
    return home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Manama tells the spirits to let the unhappy man go; they tie a chain of karan
    grass leaves to his legs, lower him head first, and he reaches the ground as an
    owl.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Melu is described as an enormous being living on the clouds, with gold teeth
    and white skin produced by continually rubbing himself clean.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Melu piles the dead skin rubbed from his body and later shapes that pile into
    the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Melu fashions two smaller beings from leftover material, but Tau Tana appears
    from below the earth and argues for a role in making them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tau Tana makes the noses upside down; Melu and Tau Tana whip the forms until
    they move, after which each returns to his own realm.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A great rain nearly drowns the first people because water runs from their
    heads into their upside-down noses; Melu comes from the clouds and turns the noses
    right side up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The first people tell Melu they are lonely, and Melu tells them to save hair
    from their heads and dry skin from their bodies so he can later make companions
    for them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: In another Bilaan beginning account, four beings live with one bird on an
    island no larger than a hat, surrounded by waters and without trees, grass, or
    other living things.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The four beings send the bird across the waters, and it returns with earth,
    a piece of rattan, and fruit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Melu shapes the soil and beats it with a paddle like a woman shaping clay
    pots, making the earth, then plants fruit seeds that grow into rattan and fruit
    trees.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The beings attempt to make people from wax, but the wax forms melt when brought
    to the fire, showing that people cannot be made that way.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Melu and a companion make people from dirt; the companion puts the noses upside
    down, and Melu later turns them, leaving a visible mark at the root of the nose.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the Mandaya account, limokon doves can talk like humans, and one limokon
    lays two eggs along the Mayo River; one egg hatches into a man and the other into
    a woman.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The egg-born man lives alone, finds a hair swept against his legs in the river,
    follows the river upstream, finds the woman, marries her, and their children are
    identified as Mandaya living along the Mayo River.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Sun and the Moon are married; the ugly and quarrelsome Sun becomes angry
    and chases the Moon, and this chase continues with varying distance between them.
  category: sequence
  evidence_refs:
  - ev:11
