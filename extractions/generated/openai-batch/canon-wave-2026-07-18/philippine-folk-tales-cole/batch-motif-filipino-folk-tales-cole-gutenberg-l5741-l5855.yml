  summary: A sequence of notes describes Igorot salt production and exchange, Samoki
    pottery, comparative notes on flood and fire-acquisition stories, head-taking
    objects and customs, coffins, Lumawig and head-hunting, tattoo status marks, animal-origin
    tales with morals, rice pounding, a Borneo sky-raising myth, and a Malaysia-wide
    belief that a giant crab causes tides.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Mayinit, people obtain salt from brackish hot springs by encrusting stones,
    washing them, boiling the water, forming paste into cakes, and baking the cakes
    near fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hostile tribes conduct indirect trade for Mayinit salt by calling from a hill,
    depositing trade goods, withdrawing, and receiving salt left in exchange.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women of Samoki make pottery from reddish-brown clay mixed with a bluish mineral,
    shape it by hand, dry it in the sun, fire it with grass and pine bark, and glaze
    it with resin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note states that flood stories occur in the mythology of nearly all peoples
    and refers to Tinguian and Bukidnon flood accounts elsewhere in the volume.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: A bamboo basket is identified as the container for victims' heads before a
    head-taking celebration.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Tinguian fire account, Kaboniyan sends a flood covering all land; fire
    has no place to stay and enters bamboo, stones, and iron, from which knowledgeable
    people can still get fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The magical increase of food is described as a popular Tinguian folk-tale
    subject.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note describes Lumawig striking a rock and water coming out, compares the
    incident to Moses, and says it may have been added after Catholic missionaries
    arrived.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Igorot coffins are made from a log split lengthwise, hollowed out, tied with
    rattan after the body is placed inside, and sealed with mud and lime.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Among the Kulaman of southern Mindanao, an important man may be placed in
