candidate_motifs:
- id: motif:1
  label: Child trapped in an unopenable speaking stone
  taxonomy_refs: []
  basis: The stone identifies the boy's presence, but the grandmother and helpers
    cannot open it.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage preserves only the ending of this tale, so the boy's entry
    into the stone and wider narrative function are not available here.
- id: motif:2
  label: Cautious small animal survives while noisy companion is exposed
  taxonomy_refs:
  - trickster_boundary
  - wisdom
  basis: The turtle warns the lizard to be quiet, while the lizard's repeated loud
    speech causes the man to come out.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The taxonomy assignment is based on the turtle's practical cunning and
    the lizard's boundary-crossing theft, not on an explicit passage label.
- id: motif:3
  label: Hidden trickster defeats searcher through unseen voice
  taxonomy_refs:
  - trickster_boundary
  basis: The turtle hides under the man's seat and repeatedly calls out; the man cannot
    find him and dies from excitement.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not state the turtle intended the man's death, only that
    repeated calls and failed searches led to it.
- id: motif:4
  label: Impulsive companion harmed by rushing ahead
  taxonomy_refs:
  - wisdom
  basis: The lizard rushes to the honey and is stung, then rushes to the snare and
    is killed.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is a practical cautionary pattern rather than a named motif in the
    passage.
- id: motif:5
  label: Paradoxical advice to go slowly in order to arrive sooner
  taxonomy_refs:
  - wisdom
  basis: The boy says slow travel will be quick and fast travel will take all day;
    the man's haste causes repeated delays.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No broader comparison is made in the passage.
- id: motif:6
  label: Race opponent multiplied through identical responders
  taxonomy_refs:
  - trickster_boundary
  basis: Different shells answer the carabao's calls along the route, making him think
    one shell is keeping pace until he dies from running.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage presents the shells collectively rather than describing an
    explicit plan or trick arranged beforehand.
- id: motif:7
  label: Tooth-marked food remnant reveals the thief
  taxonomy_refs: []
  basis: The alligator sees the rind with teeth marks in the river and knows who ate
    his fruit.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The fruit is owned by the alligator but is not described as sacred or
    forbidden in religious terms.
- id: motif:8
  label: Predator killed by being fed a red-hot implement
  taxonomy_refs: []
  basis: The people invite the alligator to eat first, then push a red-hot iron soil-turner
    down his throat.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not compare this event to other fire-killing or monster-slaying
    patterns.
- id: motif:9
  label: Lazy poor orphan moved to work by seasonal hardship
  taxonomy_refs: []
  basis: Dogedog is lazy and poor, but the coming rainy season and fear of cold storms
    make him decide to build a floor.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: Only the opening of the Dogedog tale is included, so the subsequent development
    is absent.
