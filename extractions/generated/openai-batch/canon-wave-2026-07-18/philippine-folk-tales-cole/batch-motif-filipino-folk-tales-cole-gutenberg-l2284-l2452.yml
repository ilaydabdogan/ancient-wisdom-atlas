canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which a grandmother cannot free
    a boy from a speaking stone, followed by several Tinguian tales: a turtle survives
    while a noisy lizard is repeatedly harmed and finally killed; a boy gives paradoxical
    travel advice to a man carrying coconuts; a carabao races shells and dies from
    overexertion; women steal fruit from an alligator and the alligator is killed
    with a red-hot implement; and the beginning of the story of Dogedog, a poor lazy
    orphan who decides to repair his floor before the rainy season.'
  language: English
  quote_policy: summarized
