canonical_text:
  quote: ''
  summary: King Indarapatra sends his brother Sulayman to Mindanao to avenge devastation
    caused by monsters. Sulayman travels through the air, kills Kurita and Tarabusaw,
    but is crushed by the wing of a great bird. Indarapatra sees a fate-linked sapling
    wither, travels to Mindanao, finds Sulayman's bones, and revives him with heaven-sent
    water. Sulayman returns home while Indarapatra kills a seven-headed bird, searches
    for survivors hidden underground, is guided by an old woman, and receives the
    headman's daughter in marriage after restoring safety.
  language: English
  quote_policy: summarized
