candidate_motifs:
- id: motif:1
  label: secretly witnessed magical labor causes loss and separation
  taxonomy_refs: []
  basis: Magbangal's wife secretly sees his autonomous tools working; immediately
    after, Magbangal loses an arm and announces separate transformations for himself
    and his wife.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly state a taboo against watching, only that
    Magbangal identifies being observed as the cause of his arm loss.
- id: motif:2
  label: human transformed into constellation as agricultural sign
  taxonomy_refs:
  - ascent
  - culture_hero
  basis: Magbangal goes to the sky, becomes a constellation, and his stars indicate
    the time to plant rice.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage gives no further cosmological setting beyond the constellation
    and planting function.
- id: motif:3
  label: human transformed into fish
  taxonomy_refs:
  - shapeshifter
  basis: Magbangal tells his wife to go to the water and become a fish.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage reports the command but does not narrate the completed transformation
    in detail.
- id: motif:4
  label: children transformed into monkeys after improper laughter
  taxonomy_refs:
  - shapeshifter
  basis: The children's laughter at their burned mother changes them into monkeys,
    with spoons becoming their tails.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not state an explicit moral judgment beyond the causal
    transformation.
- id: motif:5
  label: origin explanation for animal traits
  taxonomy_refs: []
  basis: The story explains monkey tails from shell spoons and black monkey nails
