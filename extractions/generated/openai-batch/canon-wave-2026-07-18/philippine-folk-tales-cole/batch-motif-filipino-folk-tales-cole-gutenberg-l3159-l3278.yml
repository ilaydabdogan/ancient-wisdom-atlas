canonical_text:
  quote: ''
  summary: The passage includes the end of a tale in which Magbangal commands tools
    to clear land, loses an arm when secretly watched by his wife, goes to the sky
    as a constellation used as a rice-planting sign, and sends his wife to the water
    to become a fish. It then gives a Bukidnon tale in which children laughing at
    their burned mother become monkeys, with shell spoons becoming their tails. A
    second Bukidnon tale tells of twin brothers Bulanawan and Aguio, separated when
    a wind carries Bulanawan away in cotton, later becoming rival warriors who unknowingly
    fight over Bulanawan's wife until kinship is revealed and peace is made.
  language: English
  quote_policy: summarized
