canonical_text:
  quote: ''
  summary: The passage first concludes a Tinguian tale in which Kanag confronts Gawigawen,
    uses magic to avoid his weapons, defeats the multi-headed giant, finds the dismembered
    remains of his father Aponitolau, restores him to life, kills Gawigawen, and returns
    home where a green vine signals Kanag's survival and a feast follows. The passage
    then begins a new Tinguian tale in which Aponitolau and Aponibolinayen plant sugar-cane,
    Aponitolau magically hastens its growth, and Gaygayoma, daughter of the big star
    Bagbagak and the moon Sinag, sends stars down to take the cane and golden-stemmed
    beans before descending herself with her father and other stars. Aponitolau later
    discovers the chewed cane and a piece of gold and decides to watch the field.
  language: English
  quote_policy: summarized
