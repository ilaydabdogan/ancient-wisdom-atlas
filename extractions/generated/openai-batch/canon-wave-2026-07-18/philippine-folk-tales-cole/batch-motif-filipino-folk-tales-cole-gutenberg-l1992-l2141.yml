canonical_text:
  quote: ''
  summary: 'The passage contains portions of several Tinguian tales: a hunter follows
    a wounded deer into a cave and finds a talking bead-bearing shrub; a striped blanket
    causes spirits to mistake a sleeping man for a wild pig; two hunters obtain fire
    from an Alan, kill her baby, trick her into falling, and take valuables; another
    Tinguian encounters Alan spirits living upside down in a tree.'
  language: English
  quote_policy: summarized
