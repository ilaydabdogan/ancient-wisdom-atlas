canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which the widow''s son fights a giant,
    is restrained by a friendly spirit, learns that a stone spirit sent enemies against
    him because of a marriage rivalry, returns home, prepares wine, and joins former
    enemies at a feast where marriages are made. It then gives an editorial introduction
    to the Moro and begins a Mindanao myth: ancient Mindanao is water-covered except
    for mountains, and four destructive monsters ravage the land.'
  language: English
  quote_policy: summarized
