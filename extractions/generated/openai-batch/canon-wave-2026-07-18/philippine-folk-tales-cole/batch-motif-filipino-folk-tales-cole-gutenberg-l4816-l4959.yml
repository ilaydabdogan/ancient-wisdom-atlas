candidate_motifs:
- id: motif:1
  label: Magic tree enables fortunate marriage
  taxonomy_refs: []
  basis: The tale fragment credits the couple's happy life after marriage to the kindness
    of a magic tree.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: Only the ending of the preceding tale is present, so the tree's earlier
    actions and full narrative function are not available in this passage.
- id: motif:2
  label: Trickster substitutes dangerous contents for food
  taxonomy_refs:
  - trickster_boundary
  basis: Juan is sent for guavas but places a wasp nest in the fruit basket, traps
    the guests, and mocks their swollen faces.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage frames Juan's act as a joke, but the resulting harm to the
    guests is literal.
- id: motif:3
  label: Celestial marriage produces star children
  taxonomy_refs:
  - divine_parent_child
  basis: The Sun and Moon are married, and their children are explicitly identified
    as the stars.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage uses celestial beings but does not explicitly call them gods;
    the taxonomy link is based on celestial parent-child structure.
- id: motif:4
  label: Sun-Moon conflict explains lunar marks and ongoing chase
  taxonomy_refs:
  - duality
  basis: The Moon's anger at the Sun leads to an attack, sand on her face explains
    dark marks, and the Sun's chase of the Moon continues.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy reference captures opposed celestial pairing, but the passage's
    main emphasis is an etiological chase and lunar-mark explanation.
- id: motif:5
  label: Human transgression punished by animal transformation
  taxonomy_refs:
  - shapeshifter
  basis: The lazy boy attacks his grandmother and is suddenly changed into an animal
    whose features derive from her cotton and spindle.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The transformation is involuntary punishment rather than voluntary shapeshifting.
- id: motif:6
  label: Origin of monkeys through contagious transformation and exile
  taxonomy_refs:
  - shapeshifter
  basis: The transformed boy turns his gambling companions into similar animals, and
    they are driven into the forest where they live in trees as monkeys.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The tale is explicitly etiological for monkeys, but the available taxonomy
    has no separate animal-origin category.
- id: motif:7
  label: Plant revived by animal blood
  taxonomy_refs:
  - sacrifice
  basis: The coconut plant repeatedly wilts and is revived with the blood of a bird,
    monkey, and pig.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The animals' blood functions as life-giving substance, but the passage
    does not describe a formal ritual sacrifice.
- id: motif:8
  label: Originator of coconut tuba and explanatory drinking types
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: The hunter is called the first man to take tuba from the coconut tree and
    gives an explanatory comparison between drinking levels and three animals.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The hunter introduces a cultural practice and a practical moral explanation,
    but the passage does not present him as a heroic figure beyond this origin act.
