  quote: ''
  summary: The passage contains the ending of a tale in which a magic tree enables
    a happy marriage, followed by Tagalog and Visayan tales about Juan tricking guests
    with wasps, the Sun and Moon as quarreling celestial spouses whose children are
    stars, the origin of monkeys through human transformation, and the origin and
    effects of coconut tuba.
