canonical_text:
  quote: ''
  summary: The passage first concludes a flood-renewal episode in which Lumawig uses
    fire to dry the waters and a brother and sister marry and repopulate the earth.
    It then narrates Lumawig, the Great Spirit, descending from the sky to visit two
    sisters, miraculously increasing beans, domestic animals, rice, and feast provisions,
    marrying the younger sister Fukan, contending with a brother-in-law, consulting
    an omen, and producing water from a rock before pushing the brother-in-law into
    it so that water comes from his body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Pokis, Lumawig built a large fire that warmed a brother and sister and
    caused the water to evaporate, leaving the world restored except for the presence
    of mountains; the brother and sister then married and had children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lumawig is identified as the Great Spirit, looks down from his place in the
    sky, sees two sisters gathering beans, and decides to visit them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The younger sister is named Fukan and says they are gathering beans while
    her sister often wants to bathe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lumawig shells a single pod of beans into a basket, and the basket becomes
    full; he repeats this with other baskets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fukan tells her parents about the young man who can fill a basket from one
    pod, and her father says the young man must be a god.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the house, Lumawig asks for water, receives it in a coconut shell, and
    says that if he stays there he will become very strong.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Lumawig feeds the household chickens rice meal, the chicks rapidly grow
    into adult cocks and hens.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Lumawig feeds the pigs sweet potato leaves, the little pigs grow to
    full size.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fukan's father offers his elder daughter to Lumawig, but Lumawig chooses the
    younger daughter, and the marriage is arranged.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The brother-in-law objects that there is no rice, beef, pork, or chicken for
    a wedding feast, and Lumawig says he will provide the feast.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Lanao, Lumawig cuts two large pine trees, hurls them to Lanao, and the
    people make a fire with them to heat ten kettles of water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Lumawig passes a small basket of rice over five kettles and fills them, then
    calls out so that deer and then pigs come from the forest.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The brother-in-law cannot catch the selected pig despite chasing it; Lumawig
    catches it, the pig escapes from the brother-in-law, and Lumawig finally retrieves
    it again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: After eating, drinking, and making offerings to the spirits, the group goes
    to a mountain to consult an omen concerning the northern tribes; the omen is unfavorable.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: When the people are thirsty and the brother-in-law repeatedly asks Lumawig
    to create water, Lumawig has the people rest and then strikes a rock with his
    spear so that water comes out.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The brother-in-law tries to drink first, but Lumawig holds him back until
    all others have drunk; Lumawig then pushes him into the rock and water comes from
    his body.
  category: action
  evidence_refs:
  - ev:13
