canonical_text:
  quote: ''
  summary: The passage contains a Visayan tale in which a poor husband repeatedly
    sells rice for the same amount he paid, while his wife uses the same small capital
    to weave hemp into cloth and build wealth. It then begins the Visayan tale “Why
    Dogs Wag their Tails,” in which a rich man sends a dog and cat to carry a magic
    ring to his daughter; at a river crossing the dog takes the ring from the cat,
    drops it in the water, and flees in fear.
