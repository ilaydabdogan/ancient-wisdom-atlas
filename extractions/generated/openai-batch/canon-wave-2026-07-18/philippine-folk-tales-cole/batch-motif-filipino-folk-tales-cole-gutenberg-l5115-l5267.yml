  summary: The passage closes one animal etiological tale about a lost magic ring,
    dogs, and cats, then gives Visayan tales explaining the hawk’s hostility toward
    chickens, the spider’s hostility toward flies, and the shore behavior of small
    crabs after a failed war against the waves.
