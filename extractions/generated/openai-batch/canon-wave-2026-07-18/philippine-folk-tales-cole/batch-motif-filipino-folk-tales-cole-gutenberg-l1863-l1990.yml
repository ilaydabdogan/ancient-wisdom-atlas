candidate_motifs:
- id: motif:1
  label: Etiology of lunar markings through celestial conflict
  taxonomy_refs: []
  basis: The Sun throws sand in the Moon's face after an argument, and the passage
    identifies the result with the Moon's visible dark spots.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The available taxonomy list does not include a specific lunar-marking
    etiology family.
- id: motif:2
  label: Supernatural teaching of agriculture and crop processing
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Kadaklan sends Kaboniyan to teach; the spirit gives Dayapan rice and sugar-cane
    and instructions for planting, a granary, and a sugar-press.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage names a divine sender and servant rather than using the term
    culture hero.
- id: motif:3
  label: Spirit entry as a mode of instruction
  taxonomy_refs:
  - wisdom
  basis: The spirit enters Dayapan's body at the spring and again while she plants,
    giving and demonstrating new knowledge.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No broader possession taxonomy is supplied; classification is limited
    to the observed instruction function.
- id: motif:4
  label: Origin of a healing ceremony with mixed outcomes
  taxonomy_refs: []
  basis: The Sayung ceremony cures Dayapan, but the dog killing the cock is interpreted
    as a sign that later performances will heal some people and not others.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No specific taxonomy reference for ritual-origin or partial-healing motifs
    is available.
- id: motif:5
  label: Human first practitioner transmits spirit-taught healing knowledge
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Dayapan reports what the spirit taught her, demonstrates her cure, and is
    subsequently called to treat the sick.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Dayapan is a human recipient and practitioner; the teaching source remains
    the spirit.
- id: motif:6
  label: Mountain hunt leads to discovery of an animate object
  taxonomy_refs: []
  basis: Hunters set out for deer, but the dog brings to bay a large jar that evades
    pursuit.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The available motif taxonomy has no precise label for an animate-object
    hunting encounter.
- id: motif:7
  label: Blood condition enables capture of a spirit-associated object
  taxonomy_refs: []
  basis: An unseen voice says that blood from a pig without young will allow the hunters
    to catch the jar, and they follow the instruction before catching it.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage says to take the blood but does not explicitly call it a sacrifice
