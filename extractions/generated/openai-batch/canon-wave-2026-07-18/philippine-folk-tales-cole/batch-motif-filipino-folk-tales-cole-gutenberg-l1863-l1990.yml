canonical_text:
  quote: ''
  summary: The passage contains the end of a Sun and Moon etiological tale, the Tinguian
    tale of Dayapan learning planting and the Sayung healing ceremony from a spirit
    sent by Kadaklan, the tale of hunters capturing the living talking jar Magsawi,
    and the opening of another Tinguian mountain-hunting tale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Moon answers the Sun by saying that women prefer her night light because
    they go outdoors and spin when she shines.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun becomes angry and throws sand in the Moon's face; the dark spots on
    the Moon are presented as still visible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In old times the Tinguian are described as not knowing how to plant, harvest,
    or cure illness and injuries attributed to evil spirits.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kadaklan, described as the Great Spirit living in the sky, sees the people's
    hunger and sickness and sends Kaboniyan to earth to teach them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dayapan, a woman from Caalang, has been sick for seven years before the spirit
    encounter.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a spring, a spirit enters Dayapan's body with rice and sugar-cane and instructs
    her to plant them, build a granary and sugar-press, and perform the Sayung ceremony.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The spirit again enters Dayapan's body and shows her how to plant; afterward
    the Tinguian plant crops yearly and have enough food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After reaping the first rice and cane, Dayapan performs the Sayung ceremony
    under the spirit's direction and is cured.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the river, Dayapan ties a dog and a cock near the water; while she bathes,
    the dog eats the cock.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kaboniyan says the dog's killing of the cock is a sign that, when the ceremony
    is made, some people will die and some will recover.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dayapan tells the people what the spirit taught her and afterward is called
    to treat illness; some patients die and others recover.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the Magsawi tale, Tinguian hunters leave a valley village for the mountains
    with spears, head-axes, and hunting dogs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A hunting dog appears to have brought a deer to bay, but the hunters find
    a large jar, which evades them as they pursue it.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: An unseen soft voice instructs the hunters to take blood from a pig without
    young so they can catch the jar.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The hunters follow the jar into a hole leading to a dark cave, where they
    are able to catch it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The jar is named Magsawi, is said still to live and talk, and has speech no
    longer understood by the Tinguian after a crack appeared in its side.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: Magsawi is said to visit a wife jar in Ilocos Norte and a child jar in San
    Quintin, then return to Domayco near the cave.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: The next tale opens with a Tinguian hunter and his faithful dog going up a
    mountain to hunt, cutting a path through jungle where needed.
  category: action
  evidence_refs:
  - ev:11
