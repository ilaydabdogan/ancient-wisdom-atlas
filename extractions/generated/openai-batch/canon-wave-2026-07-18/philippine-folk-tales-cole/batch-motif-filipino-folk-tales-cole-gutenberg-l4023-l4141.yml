canonical_text:
  quote: ''
  summary: Bantugan enters the Sultan’s harbor despite the Spanish fleet, is identified
    through ancestral flags, and becomes one of two claimants to the Princess. The
    Sultan orders Bantugan and the Spanish general to fight for her. After naval and
    land battles, a deception allows Bantugan to marry the Princess, prompting Spanish
    retaliation. Bantugan makes a doomed last stand; his warship sinks and an island
    arises where he and his warriors live in the mountains. His wife later attempts
    revenge, her ship sinks, and the mountain of Timaco arises.
  language: English
  quote_policy: summarized
