canonical_text:
  quote: ''
  summary: 'Benito undertakes a series of commanded errands: he frees a bound bird,
    crosses the sea with help from the King of the Fishes, receives a magic sword
    from a strange woman, rescues a princess from giants, retrieves the princess''s
    lost ring and earring through animal kings and their subjects, and is finally
    sent to obtain water from heaven and the lower world, with Sparrow-hawk agreeing
    to help.'
  language: English
  quote_policy: summarized
