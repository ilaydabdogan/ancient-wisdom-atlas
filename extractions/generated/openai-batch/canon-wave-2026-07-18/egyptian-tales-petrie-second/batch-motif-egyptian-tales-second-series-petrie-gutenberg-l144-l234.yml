canonical_text:
  quote: ''
  summary: In the reign of King Men-kheper-ra, Tahutia is sent against rebellious
    Joppa. The king has his wonder-working cane hidden in Tahutia's baggage. Tahutia
    lures the Foe in Joppa into a tent, uses the cane to strike him, binds him, conceals
    soldiers and restraints in sacks, and has the sacks carried into the city under
    a false report. When the gates are opened, the soldiers emerge, fetter the inhabitants,
    and Tahutia reports the capture to the king as a gift of Amen.
  language: English
  quote_policy: summarized
