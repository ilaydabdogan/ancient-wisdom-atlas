canonical_text:
  quote: '"I am thy doom, following after thee. ..."'
  summary: A youth traveling in Egypt is threatened by animal dooms. A crocodile is
    restrained by a mighty man. Later, a serpent tries to bite the sleeping youth,
    but milk makes it drunk and the wife kills it with a dagger. She says God has
    given one doom into his hand, and the youth sacrifices to God. Later, the youth
    follows his dog into the river, where the crocodile takes him and declares itself
    his doom before the papyrus breaks off.
  language: English
  quote_policy: quoted
