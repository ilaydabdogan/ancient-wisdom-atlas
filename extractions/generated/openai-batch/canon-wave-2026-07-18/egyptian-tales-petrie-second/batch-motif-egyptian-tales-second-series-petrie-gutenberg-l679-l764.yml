canonical_text:
  quote: ''
  summary: Bata is warned by cows that his elder brother Anpu waits with a knife to
    kill him. Bata flees and appeals to Ra Harakhti, who places a crocodile-filled
    water barrier between the brothers. At dawn Bata explains the wrong done to him,
    cuts off part of his flesh and casts it into the water, then instructs Anpu about
    his external soul, which will be placed on the top flower of an acacia and can
    restore him if put in cold water. Bata goes to the valley of the acacia; Anpu
    kills his wife and mourns. Bata lives alone beneath the acacia that bears his
    soul, builds a tower, encounters the Nine Gods, and receives a mate made by Khnumu.
    The Seven Hathors foretell the woman’s sharp death, and Bata warns her not to
    go outside lest the sea seize her.
  language: English
  quote_policy: summarized
