canonical_text:
  quote: ''
  summary: Setna Kha-em-uast, a learned royal scribe, hears of the magic book of Thoth
    and enters the tomb of Na-nefer-ka-ptah to seize it. In the tomb he finds Na-nefer-ka-ptah,
    Ahura's ka, offerings, and the book. Ahura warns him that the book brought suffering
    and recounts her royal sibling marriage to Na-nefer-ka-ptah, their child Mer-ab,
    Na-nefer-ka-ptah's study of sacred writings, and the priest Nesi-ptah's revelation
    that Thoth's book lies in nested boxes in the river at Koptos, surrounded by serpents,
    scorpions, crawling things, and a deathless snake.
  language: English
  quote_policy: summarized
