  summary: The passage comments on motifs in the Setna narrative, especially Setna
    being sunk into the ground, his loss of magical power through Tabubua, Na-nefer-ka-ptah's
    victory, restitution of a magic roll, the search for Ahura and Mer-ab's tomb,
    and an apparition guiding Setna. It also compares the sinking episode with a Palestinian
    dervish story involving Derwisha Bint Bari, Desuki, and a jar of water of Paradise.
