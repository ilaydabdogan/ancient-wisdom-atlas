canonical_text:
  quote: ''
  summary: Petrie's remarks frame the tale of the taking of Joppa as probably historical,
    identify Tahutia/Tahuti as an officer of Tahutmes III, discuss the deceptive stratagem
    used against the rebel of Joppa, compare the hidden-soldiers-in-containers scheme
    with later examples, and describe funerary objects from Tahuti's tomb, especially
    a gold dish given for his ka.
  language: English
  quote_policy: summarized
