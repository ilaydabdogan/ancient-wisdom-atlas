canonical_text:
  quote: ''
  summary: Setna, after a dream-like ordeal involving Tabubua, returns to Memphis
    and is ordered by the king to return the book to Na-nefer-ka-ptah. Setna goes
    to the tomb, where Na-nefer-ka-ptah asks him to bring Ahura and her child Mer-ab
    from Koptos. Setna travels by royal boat, performs offerings at Koptos, searches
    unsuccessfully, and is then aided by Na-nefer-ka-ptah appearing as an ancient
    man who reveals the burial place. Ahura and Mer-ab are transported as honored
    persons to Memphis and placed in the catacombs with Na-nefer-ka-ptah.
  language: English
  quote_policy: summarized
