canonical_text:
  quote: ''
  summary: Bata's wife is pursued by the sea, identified in Egypt through a fragrant
    lock of hair, and brought to Pharaoh. She causes the acacia containing Bata's
    soul to be cut, killing him. Anpu seeks the soul, finds it as a seed, restores
    it in water, and revives Bata. Bata then becomes a great bull, is brought to Pharaoh,
    and reveals himself to the princess as alive.
  language: English
  quote_policy: summarized
