  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Na-nefer-ka-ptah reads pages from the book, he enchants heaven, earth,
    abyss, mountains, and sea; he understands birds, fish, and beasts, and sees celestial
    bodies, gods, stars, and fish of the deep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ahura reads the same pages of the book and experiences the same enchantment,
    animal-speech knowledge, and cosmic vision.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Na-nefer-ka-ptah copies the book onto a new papyrus, washes the writing off
