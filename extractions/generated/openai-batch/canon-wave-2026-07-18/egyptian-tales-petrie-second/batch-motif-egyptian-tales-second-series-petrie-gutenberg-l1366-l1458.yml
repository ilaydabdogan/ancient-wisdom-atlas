canonical_text:
  quote: ''
  summary: Ahura narrates Na-nefer-ka-ptah's journey to Koptos to obtain a hidden
    divine book. After offerings at the temple of Isis and Harpokrates, he uses magic
    to create laborers, excavates the book from guarded nested boxes, defeats a deathless
    snake, reads spells that grant cosmic vision and knowledge of animal speech, lets
    Ahura read the same spells, copies the text and drinks the washed-off writing.
    Thoth then reports the theft to Ra, who sends a heavenly power to prevent Na-nefer-ka-ptah
    and his kin from returning safely; Mer-ab falls into the river and is made to
    report what happened.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Na-nefer-ka-ptah decides to go to Koptos to fetch a book despite Ahura's attempt
    to dissuade him, and obtains the royal boat for the journey with Ahura and Mer-ab.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Priests of Isis of Koptos and the high priest of Isis meet the travelers;
