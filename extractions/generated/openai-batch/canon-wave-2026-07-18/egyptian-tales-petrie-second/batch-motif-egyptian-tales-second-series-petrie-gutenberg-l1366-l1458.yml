    and drink-offering.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the fifth day Na-nefer-ka-ptah makes a magic cabin full of men and tackle,
    puts a spell on it, gives the men life and breath, and sinks it in the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: He fills the royal boat with sand, takes leave of Ahura, and sails from the
