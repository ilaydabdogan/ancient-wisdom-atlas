- id: motif:2
  label: forbidden divine knowledge
  taxonomy_refs:
  - forbidden_knowledge
  - wisdom
  basis: The book is identified by Thoth as his book and revelation; reading it grants
    cosmic vision and knowledge of birds, fish, and beasts, and its taking brings
