literal_observations:
- id: obs:1
  text: The tale is said to exist only in the papyrus of Madame d'Orbiney, formerly
    belonging to Sety II while crown prince, and therefore assigned to the XIXth Dynasty
    in its extant form.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentator distinguishes the simple, non-marvellous opening from a later
    portion in which marvels are said to be piled up, and suggests that an older story
    was lengthened by a later compiler.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The colophon names the scribe Anena as owner of the roll and invokes Tahuti
    to smite anyone who speaks against it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bata is described as self-denying, innocent, sympathetic toward cattle, and
    as listening to what the cattle said.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bata is described as returning in the evening laden with produce, sleeping
    with the cattle, rising before dawn to make bread for his brother, and driving
    cattle to pasture.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentator contrasts Bata's house and farm labor with Anpu's easier life
    and states that bread-making would normally have been Anpu's wife's duty.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The evening cattle drive is described as a regular Egyptian practice in which
    herds leave the fields, pass along paths and canals, and return to stables or
    huts for the night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The commentator explains the nightly return of cattle partly by the insecurity
