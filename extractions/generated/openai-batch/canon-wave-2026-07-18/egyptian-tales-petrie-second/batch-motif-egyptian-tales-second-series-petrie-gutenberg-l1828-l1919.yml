canonical_text:
  quote: ''
  summary: 'Petrie’s remarks discuss scenes and ideas in the Setna and magic book
    material: Ahura’s vigil by the river, women’s reading versus writing, spells consumed
    through washed ink, limited divine knowledge and delegated divine action, the
    limited power of the magic book over death, the speaking ka, repeated fatality
    within a family, funerary stages, and Setna’s struggle for the magic roll through
    a gambling episode compared with other tales and tomb game-boards.'
  language: English
  quote_policy: summarized
