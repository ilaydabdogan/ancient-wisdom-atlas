canonical_text:
  quote: ''
  summary: 'The remarks interpret episodes from Anpu and Bata: the valley of the acacia
    is geographically conjectured; Bata''s removed heart is explained as a separable
    soul or vitality; the Nine Gods, Khnumu, the wife of Bata, the seven Hathors,
    the sea episode, the lock of hair sent to Pharaoh, Bata''s death and revival,
    and his bull transformation are discussed with comparative references.'
  language: English
  quote_policy: summarized
