canonical_text:
  quote: ''
  summary: Editorial remarks describe the manuscript, composition, and structure of
    the tale of Setna and the magic book. The remarks summarize Setna’s search for
    a magic book, Ahura’s warning narrative, Setna’s magical contest with Na-nefer-ka-ptah,
    Setna’s bewitchment, and the command that Setna bring Ahura’s and her child’s
    bodies to Memphis. The passage also explains the wandering of the ka, the presence
    of Ahura’s ka in her husband’s tomb, and the relation of protective formulas to
    the Book of the Dead.
  language: English
  quote_policy: summarized
