canonical_text:
  quote: ''
  summary: The passage opens the tale of Anpu and Bata. Anpu is the elder brother
    with a house and wife; Bata is the younger brother who works for him, tends cattle,
    and is described as possessing divine spirit. The cattle speak to Bata about good
    pasture. During a ploughing episode, Anpu sends Bata for grain; Anpu's wife propositions
    Bata, he refuses, and she later stages injury and falsely accuses him. Anpu sharpens
    a knife and waits behind the stable door to kill Bata.
  language: English
  quote_policy: summarized
