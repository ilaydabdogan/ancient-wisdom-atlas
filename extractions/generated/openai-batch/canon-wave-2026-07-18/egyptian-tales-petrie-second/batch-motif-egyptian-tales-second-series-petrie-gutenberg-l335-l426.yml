canonical_text:
  quote: "“His death is to be by the crocodile, or by the serpent, or by the dog.”"
  summary: A king obtains a son after prayer to the gods, but the Hathors decree that
    the child will die by crocodile, serpent, or dog. The king confines him in a desert
    house, yet the prince acquires a pet dog, later chooses to travel, reaches Naharaina,
    wins the chief’s daughter by climbing to her high window, and is accepted as her
    husband after she vows to die if separated from him. He then tells his wife of
    the three fates; she urges killing the dog, but he refuses, and she keeps watch
    over him.
  language: English
  quote_policy: quoted
