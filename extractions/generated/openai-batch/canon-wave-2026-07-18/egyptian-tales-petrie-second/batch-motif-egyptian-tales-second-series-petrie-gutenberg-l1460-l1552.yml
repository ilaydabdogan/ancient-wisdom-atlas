canonical_text:
  quote: ''
  summary: Ahura recounts the deaths and burials of Mer-ab, herself, and Na-nefer-ka-ptah
    in connection with a dangerous magic book. Setna demands the book from the tomb,
    plays a magical game against Na-nefer-ka-ptah, is sunk into the ground, is rescued
    by a talisman of Ptah brought by his brother, and then takes the book. Light and
    Darkness accompany his departure; Ahura laments, Na-nefer-ka-ptah predicts that
    Setna will be forced to return the book, and the king advises Setna to return
    it. Setna refuses and reads it publicly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mer-ab is brought to the Good House, embalmed, and buried in a coffin in the
    cemetery of Koptos like a great and noble person.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura falls into the river at the place where Mer-ab had fallen; Na-nefer-ka-ptah
    reads a spell over her, brings her body up, makes her recount what happened, and
    has her embalmed and buried with the child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Na-nefer-ka-ptah reflects that he cannot return alive to Memphis after the
    deaths of the king's children, binds the book to himself with striped byssus,
    cries to Ra, and falls into the river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The royal boat reaches Memphis; the king and religious and court officials
    mourn; Na-nefer-ka-ptah is found in the inner cabin with the book by him, the
    king orders the book hidden, and Na-nefer-ka-ptah is embalmed and buried.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ahura tells Setna that sorrow came upon them because of the book and says
    Setna has no claim to it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Setna demands the book that he sees between Ahura and Na-nefer-ka-ptah and
    threatens to take it by force if it is not given to him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Na-nefer-ka-ptah challenges Setna to a game of 52 points; after winning successive
    games, he uses a spell and the game board to sink Setna into the ground to his
    feet, then waist, then ears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Setna strikes Na-nefer-ka-ptah and calls to his brother An-he-hor-eru to go
    up to earth, tell the king what happened, and bring the talisman of Ptah and magic
    books.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: An-he-hor-eru reports to the king, receives orders to bring the talisman and
    magic books, returns to the tomb, lays the talisman on Setna, and Setna immediately
    springs up.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Setna takes the book; as he leaves the tomb, Light goes before him and Darkness
    behind him, Ahura weeps, Na-nefer-ka-ptah predicts that Setna will return the
    book with a forked stick and fire-pan, and the tomb closes behind him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The king tells Setna to return the book to Na-nefer-ka-ptah's grave or be
    forced to bring it back with a forked stick and fire-pan; Setna refuses and reads
    the unrolled book to everybody.
  category: sequence
  evidence_refs:
  - ev:11
