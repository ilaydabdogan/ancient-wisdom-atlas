canonical_text:
  quote: ''
  summary: The royal wife obtains Pharaoh's oath and asks to eat the liver of an ox.
    The ox is sacrificed; two drops of its blood fall by Pharaoh's doors and grow
    into two Persea trees. One tree later speaks to the wife, identifying itself as
    Bata alive and recounting the wife's role in cutting the acacia and killing the
    ox. The wife secures another oath and has the trees cut into planks. A wood chip
    enters her mouth, she swallows it, and she bears a son who becomes royal son of
    Kush and later heir. After Pharaoh goes to heaven, the heir reveals what has happened,
    judges the wife, restores his elder brother, reigns, dies, and is succeeded by
    that brother. A colophon names scribes and invokes Tahuti against anyone who speaks
    against the roll.
  language: English
  quote_policy: summarized
