- id: motif:2
  label: blocked threshold with selective mercy
  taxonomy_refs: []
  basis: The doors are blocked by fire, but Flosi allows women, children, and house-carles
    to leave while refusing atonement or exit for Njal's sons.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The pattern is social and legal within the episode; no broader mythic
    taxonomy is stated in the passage.
- id: motif:3
  label: failed escape through disguise
  taxonomy_refs: []
  basis: Helgi attempts to leave under a woman's cloak and kerchief, is detected,
