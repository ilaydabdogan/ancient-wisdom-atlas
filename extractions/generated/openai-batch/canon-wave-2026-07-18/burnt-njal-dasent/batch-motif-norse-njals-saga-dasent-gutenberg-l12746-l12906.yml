canonical_text:
  quote: ''
  summary: Attackers set fire around and above the house at Bergthorsknoll. Some inside
    resist the fire or escape under leave granted by Flosi, while Helgi attempts to
    leave disguised as a woman and is killed. Njal and Bergthora refuse offered escape,
    lie down with the boy Thord between them, are covered with an ox hide, sign themselves
    with the cross, and entrust their souls to God as the burning continues.
  language: English
  quote_policy: summarized
