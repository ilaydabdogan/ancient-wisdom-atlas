canonical_text:
  quote: ''
  summary: Bergthora sends Atli to find and kill Kol. Atli locates Kol, confronts
    him, and kills him with a spear after Kol misses with an axe. Bergthora approves
    the deed but warns that Hallgerda will not keep peace. Hallgerda vows that Atli
    will be paid back. At the Thing, Njal and Gunnar settle the killing by valuing
    Kol and Swart equally and exchanging twelve ounces of silver, preserving their
    friendship despite anger from their wives.
  language: English
