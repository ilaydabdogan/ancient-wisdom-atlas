canonical_text:
  quote: ''
  summary: Hall of the Side travels with Kol and others to Holt to negotiate atonement
    with Thorgeir. Thorgeir and Kari receive Hall honorably. Hall proposes terms;
    Thorgeir resists accepting compensation from the Burners, and Kari urges him to
    accept while refusing compensation for himself because his son remains unavenged.
    A truce is handselled, gifts are exchanged, and Hall reports to Flosi. At a later
    meeting at Headbrink, Thorgeir states settlement conditions concerning Kari's
    access to his house, mutual non-harm there, Flosi's responsibility for fines,
    payment in unclipped coin, and the continued force of banishment and outlawry.
    Hall later urges Flosi to fulfill the terms, including going abroad, pilgrimage
    to Rome, and fines.
  language: English
  quote_policy: summarized
