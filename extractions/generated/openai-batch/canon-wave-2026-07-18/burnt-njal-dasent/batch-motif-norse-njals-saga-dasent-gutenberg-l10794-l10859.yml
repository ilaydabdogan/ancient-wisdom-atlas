  quote: '"Praised be the Lord! now I see what His will is."'
  summary: Amund the blind, son of Hauskuld, asks Lyting for compensation for his
    father's death. Lyting refuses. Amund invokes God's judgment, briefly receives
    sight at the booth door, kills Lyting with an axe, and then becomes blind again.
    Njal says Amund is not to be blamed because such events are settled by a higher
    power, and a legal settlement follows.
