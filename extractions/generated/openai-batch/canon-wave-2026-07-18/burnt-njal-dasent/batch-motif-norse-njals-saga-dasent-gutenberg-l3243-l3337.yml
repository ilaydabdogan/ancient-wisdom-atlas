canonical_text:
  quote: '"This beast is no man''s fetch, but Gunnar''s of Lithend"'
  summary: Gunnar travels under the identity of Huckster Hedinn, follows Njal's plan,
    gains Hrut's trust, tricks Hrut into teaching and validating a legal summons,
    and escapes. Hauskuld dreams of a great bear with two cubs entering Hrutstede,
    then interprets the beast as Gunnar's fetch after noticing signs of the disguised
    stranger. Hrut and Hauskuld realize the legal trick and attribute the plot to
    Njal's wit, but their search fails and Gunnar returns home.
  language: English
  quote_policy: quoted
