- id: obs:3
  text: Gunnar follows what Njal had laid down for him, stays at Hauskuldstede, reaches
    a farm near Hrutstede, offers wares for sale, and Hedinn falls upon the farmer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hrut sends for Hedinn, welcomes him, seats him opposite himself, and their
    conversation proceeds much as Njal had guessed.
  category: relationship
  evidence_refs:
  - ev:2
