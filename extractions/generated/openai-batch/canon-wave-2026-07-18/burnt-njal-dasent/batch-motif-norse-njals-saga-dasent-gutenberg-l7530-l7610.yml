canonical_text:
  quote: ''
  summary: After Thorgeir Otkell's son's death, Gizur the white gives formal notice
    of a manslaughter suit against Gunnar Hamond's son at the Thing. Njal warns Gunnar
    that repeated killing within the same stock makes adherence to the settlement
    a matter of life and death, and promises help. Gizur publicly states the charge,
    seeks outlawry and forfeiture, repeats notice with witnesses, and later brings
    the suit before court through oath, proofs, and an inquest procedure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: News of Thorgeir's death spreads; Gizur the white and his men go to the place,
    give notice of manslaughter, and call the neighbours on the inquest to the Thing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Njal warns Gunnar to beware because he has slain twice in the same stock and
    must keep to the settlement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gunnar says he does not mean to break the settlement and will need Njal's
    help at the Thing; Njal promises faithfulness to Gunnar until death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: As the Thing approaches, each side gathers a large company, and people discuss
    how the suits will end.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gizur the white and Geir the priest discuss who should give notice of the
    manslaughter suit after Thorgeir; Gizur takes the suit and gives notice at the
    Hill of Laws.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gizur declares that Gunnar made a legally defined onslaught against Thorgeir
    and wounded him with a body wound that became a death wound.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gizur seeks a judgment that Gunnar become a convicted outlaw, receive no aid
    or harbouring, and forfeit his goods, with the suit placed in the Quarter Court.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Gizur takes witness and gives notice a second time, repeating the charge and
    asking which Quarter Court the suit belongs in and where the defendant dwells.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the notice, men say that Gizur spoke well, while Gunnar keeps himself
    restrained and says little or nothing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: When courts are set, Gunnar stands south by the court with his men, while
    Gizur stands north, calls witnesses, asks Gunnar to hear his oath, declaration,
