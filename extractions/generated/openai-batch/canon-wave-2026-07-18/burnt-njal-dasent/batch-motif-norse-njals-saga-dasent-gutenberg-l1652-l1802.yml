canonical_text:
  quote: ''
  summary: Gunnhillda, mother of King Harold Grayfell, hears that Hrut has arrived
    from Iceland and recognizes that he intends to claim an inheritance held by Soti.
    She sends her servant Augmund to invite Hrut and Auzur to stay with her and promises
    support before the king. Auzur advises acceptance. Gunnhillda prepares Hrut for
    an audience by sending a dress of honour and instructing him to ask for a place
    in the king's body-guard. Hrut petitions the king for help with his inheritance
    and for court service; Gunnhillda praises him, and the king defers formal admission
    for half a month while placing him under her care. In Gunnhillda's hall, Hrut
    is seated in her high-seat, shares drink with her, spends nights privately with
    her, and the witnesses are threatened into silence. After a gift exchange, Hrut
    returns to the king and is made one of the body-guard.
  language: English
  quote_policy: summarized
