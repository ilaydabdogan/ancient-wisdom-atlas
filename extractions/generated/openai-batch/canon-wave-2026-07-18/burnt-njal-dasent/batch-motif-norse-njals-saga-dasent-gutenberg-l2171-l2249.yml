canonical_text:
  quote: "“I challenge thee to fight on the island”"
  summary: Hrut returns after his wife has gone and later goes to the Thing with Hauskuld.
    Mord publicly brings a money-suit for his daughter’s dower. Hrut counters by challenging
    Mord to fight on an island with the dower and matching goods at stake. Mord refuses
    after advice and is publicly shamed. Later, at Lund, children mockingly reenact
    the dispute; Hauskuld strikes one boy, while Hrut gives him a ring and receives
    praise.
  language: English
  quote_policy: quoted
