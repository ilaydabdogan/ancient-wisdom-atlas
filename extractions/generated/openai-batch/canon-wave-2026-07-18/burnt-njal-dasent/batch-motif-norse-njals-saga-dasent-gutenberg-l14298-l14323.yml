canonical_text:
  quote: ''
  summary: Snorri offers conditional friendship and tactical advice before a possible
    fight at the Thing. He refuses to go to court with the group but says he will
    position his men to help if they are overmatched, guard the pass to the Great
    Rift stronghold if the opposing side retreats, and intervene to stop the battle
    after a limited number have been slain. Gizur thanks him, and Asgrim directs the
    group to the Northlanders' booth.
