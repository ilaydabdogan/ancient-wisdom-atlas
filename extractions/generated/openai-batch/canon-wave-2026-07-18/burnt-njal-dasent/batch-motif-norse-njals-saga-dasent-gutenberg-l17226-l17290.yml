canonical_text:
  quote: ''
  summary: Kari receives a manned long-ship and follows news that Flosi and his men
    have gone to Wales. Kari’s companions choose to remain with him, and they hide
    in a Welsh creek. In town, Kari finds Kol Thorstein’s son buying and counting
    silver, kills him with a sword, and publicly declares the slaying as his own deed.
    Kari then leaves for Scotland. Flosi hears of Kol’s death, arranges his burial
    without speaking wrathfully against Kari, then travels on pilgrimage to Rome,
    receives absolution from the Pope for a large payment, returns through Norway
    to Iceland, and is said to have fulfilled the terms of his atonement in fines
    and foreign travel.
  language: English
  quote_policy: summarized
