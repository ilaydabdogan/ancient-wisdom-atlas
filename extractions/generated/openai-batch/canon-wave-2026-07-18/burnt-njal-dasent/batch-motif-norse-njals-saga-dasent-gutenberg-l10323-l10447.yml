  quote: "“it will never do to have no law in the land”"
  summary: Njal arranges a proposed marriage for his foster-son Hauskuld with Hildigunna.
    Hildigunna will accept only if Hauskuld obtains a priesthood or leadership. Njal
    seeks such an office and later, amid unresolved lawsuits at the Althing, argues
    for maintaining law and proposes a Fifth Court supported by new priesthoods.
  language: English
