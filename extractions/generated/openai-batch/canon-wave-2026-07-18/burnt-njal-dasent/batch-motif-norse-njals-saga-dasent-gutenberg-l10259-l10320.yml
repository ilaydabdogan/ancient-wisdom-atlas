canonical_text:
  quote: '"if there be a sundering of the laws, then there will be a sundering of
    the peace"'
  summary: At the Thing, Christian and heathen factions split over law. Hall of the
    Side gives silver to Thorgeir of Lightwater, a heathen and old Speaker of the
    law, to pronounce the law. Thorgeir withdraws under a cloak, then urges one common
    law for peace. Both sides pledge to accept his ruling. He declares Christianity
    and associated observances lawful for all in the land while initially allowing
    some older practices in secret; the passage says these practices soon disappear
    and all become Christian.
  language: English
  quote_policy: quoted
