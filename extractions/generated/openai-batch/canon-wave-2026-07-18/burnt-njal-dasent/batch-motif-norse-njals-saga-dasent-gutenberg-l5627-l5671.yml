canonical_text:
  quote: "“it is an unwise step to send the greatest liar on an errand”"
  summary: After Gunnar leaves, Hallbjorn tells Otkell that Gunnar had made good offers
    and advises him to seek Gizur the white and Geir the priest. Otkell prepares to
    go, but Skamkell offers to travel in his place, and Otkell accepts after asking
    him to be truthful. Skamkell takes Otkell’s horse and cloak while Otkell returns
    home. Hallbjorn condemns the decision, warning that Skamkell is a liar and that
    lives may depend on the errand. Otkell and Hallbjorn quarrel about fear, Gunnar’s
    bill, and yielding.
