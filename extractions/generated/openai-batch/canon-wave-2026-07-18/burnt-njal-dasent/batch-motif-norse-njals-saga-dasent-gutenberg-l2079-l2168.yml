  summary: Hrut and Unna's marriage again deteriorates in spring. During Hrut's absence,
    Unna goes to the Thing, consults her father Mord, reveals that Hrut is spell-bound
    and that she wishes to leave him, receives a detailed plan for lawful separation,
    follows it, declares herself separated at the Hill of Laws, and returns home with
    her father.
