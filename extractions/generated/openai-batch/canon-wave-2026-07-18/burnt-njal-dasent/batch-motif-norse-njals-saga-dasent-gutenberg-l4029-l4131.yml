canonical_text:
  quote: ''
  summary: At Gunnar's wedding feast, kin groups gather and are formally seated. Thrain
    Sigfus' son stares at Thorgerda Glum's daughter; his wife Thorhilda mocks him
    in verse, and he puts her away from the feast. Thrain immediately asks Hauskuld
    for Thorgerda as wife. Hauskuld consults Gunnar, Njal, and Hrut; the match is
    approved, terms are agreed, the mother and daughter assent, and Hallgerda betroths
    her daughter. The feast ends with gift-giving and new household arrangements.
  language: English
  quote_policy: summarized
