canonical_text:
  quote: ''
  summary: Thorgeir Starkad's son summons his namesake, Thorgeir of the Threecorner,
    and an armed company lies sleeping in a nearby wood. Njal, unable to sleep, reports
    seeing the fetches of Gunnar's enemies. A shepherd discovers the sleeping armed
    men and reports their gear to Njal, who sends him to warn Gunnar. Njal then confronts
    the men, warns them that Gunnar is gathering force, and frightens them into riding
    home. Njal tells Gunnar to keep his company together while he seeks an atonement
    payment for the treason.
  language: English
  quote_policy: summarized
