canonical_text:
  quote: ''
  summary: Hildigunna wakes from troubling dreams, searches for Hauskuld, and finds
    him slain by the fence. A shepherd reports that Njal's sons had gone from the
    place and that Skarphedinn gave notice of the slaying. Hildigunna gathers Hauskuld's
    blood in a cloak and stores it. Thorgerda urges Kettle to remember his fosterage
    obligation to Hauskuld, while Kettle notes his divided kinship through marriage
    to Njal's daughter. Mord Valgard's son takes charge of the legal suit, shows the
    wounds to neighbours, conceals his own wound-dealing, and summons neighbours to
    the Althing inquest. The killing becomes widely condemned, and Njal's sons seek
    Asgrim's help.
  language: English
  quote_policy: summarized
