canonical_text:
  quote: ''
  summary: At the Thing, Flosi gathers supporters while Hall of the Side urges atonement
    and peace and warns him about Mord. Njal and Asgrim confer privately; Asgrim then
    leads Njal's sons and companions to seek help. Gizur pledges kinship support and
    shared fate. Skapti refuses and is taunted by Skarphedinn. Snorri declines to
    take up the suit but promises neutrality, then predicts that Skarphedinn has little
    time to live. Hafr also refuses involvement.
  language: English
  quote_policy: summarized
