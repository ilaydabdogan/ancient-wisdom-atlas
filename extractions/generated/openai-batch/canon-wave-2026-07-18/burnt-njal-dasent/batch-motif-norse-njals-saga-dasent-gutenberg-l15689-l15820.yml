  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man with turf-panniers told Thorgeir that the pursued men had recently passed
    and planned to sleep during the day in Carlinedale before going no farther than
    Headbrink.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Carlinedale-water the stream was high; Kari and Thorgeir saw saddled horses,
