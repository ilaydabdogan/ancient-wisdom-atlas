canonical_text:
  quote: ''
  summary: The passage first reports an atonement payment made for Hall of the Side
    after he had let his son's death go without a fine. It then follows Kari and Thorgeir
    as they pursue the sons of Sigfus, receive information from local people, find
    sleeping opponents by Carlinedale-water, disarm and wake them rather than attack
    sleepers, fight several men, and stop pursuit because Kari will not slay Kettle
    of the Mark, who is linked to him by marriage and has behaved comparatively well.
  language: English
  quote_policy: summarized
