- id: obs:1
  text: Hall of the Side allowed his son to fall without taking a fine for the sake
    of an atonement, after which the host at the Thing agreed to pay him a large silver
    fine; other men who had been with Flosi received no fines for their hurts and
    were displeased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kari and Thorgeir rode east, met women at Selialandsmull, and learned that
    the sons of Sigfus had recently been at Raufarfell and intended to reach Myrdale.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thorgeir asked whether they should ride on the track of the sons of Sigfus,
    and Kari answered by describing Thorgeir's apparent wish to take on eight men
    and by agreeing to ride after them with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kari and Thorgeir avoided passing by Holt because Thorgeir did not want blame
