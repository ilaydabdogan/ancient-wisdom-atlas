canonical_text:
  quote: ''
  summary: Asgrim and his companions seek Thorkel foulmouth's help at court. Thorkel
    resists and insults Skarphedinn; Skarphedinn answers with sharper insults and
    an armed threat. Thorkel sheathes his sword and sits down. The group reports the
    events to Njal, and Gudmund later sends Einar and his band to stand by Njal's
    sons, promising further help if needed.
  language: English
  quote_policy: summarized
