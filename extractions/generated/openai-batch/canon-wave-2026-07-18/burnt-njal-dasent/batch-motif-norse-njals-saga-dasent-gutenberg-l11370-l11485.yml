  quote: ''
  summary: Hildigunna receives Flosi with formal hospitality, but after the meal she
    confronts him over Hauskuld's killing. She brings out the bloody cloak in which
    Hauskuld was slain, throws it over Flosi, and adjures him by Christ, manhood,
    and bravery to avenge the wounds. Flosi reacts angrily, rides away, and seeks
    support from Ingialld, who is conflicted by ties to Njal and his sons.
  language: English
