canonical_text:
  quote: ''
  summary: Hauskuld and Njal's sons exchange feasts, gifts, and assurances of friendship.
    Mord Valgard's son separately tells Hauskuld and then Njal's sons hostile stories
    about each side, including accusations of mockery, envy, attempted killing, treacherous
    lodging, and planned burning or ambush. Hauskuld rejects Mord's charges and says
    he would rather die than harm Njal's sons, but Njal's sons eventually believe
    Mord, and coldness arises. Flosi warns Hauskuld of the danger and offers him relocation,
    but Hauskuld refuses to seem to flee and says he would rather fall unatoned than
    cause many others harm. Flosi gives Hauskuld a scarlet embroidered cloak. The
    passage closes with notes on Njal's foster-children Thord and Thorhall and the
    coming of an early spring.
  language: English
  quote_policy: summarized
