canonical_text:
  quote: ''
  summary: The passage recounts a formal Fifth Court legal proceeding in which Mord
    manages inquest findings and witness declarations against Flosi. Eyjolf and Flosi
    look for procedural flaws. A dispute arises over the proper number of judges;
    Mord sets aside six men and offers the opposing side the chance to do likewise,
    but after judgment Eyjolf claims the judgment is invalid because too many judges
    sat. Gizur calls Mord's action a serious mistake, and Asgrim proposes asking his
    son Thorhall for counsel.
