canonical_text:
  quote: Then Gunnar made up his mind to sail abroad with him.
  summary: A ship from Norway arrives in Iceland under Hallvard the white. Hallvard
    stays with Gunnar and urges him to go abroad. Gunnar consults Njal, who approves
    the plan and agrees to keep Gunnar's goods and help oversee his household with
    Gunnar's mother while Gunnar and Kolskegg are away. Hallvard describes his wide
    sailing experience, agrees to sail eastward with Gunnar, and Gunnar decides to
    travel abroad.
