candidate_motifs:
- id: motif:1
  label: Legal defeat turns into armed vengeance
  taxonomy_refs: []
  basis: The messenger reports that legal suits will fail; Thorhall then kills Grim,
    Kari frames the act as vengeance for the Burning, and general fighting begins.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a saga conflict pattern rather than an explicitly mythic motif
    in the passage.
- id: motif:2
  label: Wounded avenger rises from bed
  taxonomy_refs: []
  basis: Thorhall rises from bed in shock, cuts out his foot-boil with a spear, walks
    unhalting to the court, and kills an opponent.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents the action as literal narrative; no supernatural
    cause is stated.
- id: motif:3
  label: Inherited or named weapons used in vengeance
  taxonomy_refs: []
  basis: Thorhall uses Skarphedinn's spear-gift, and Thorgeir uses Skarphedinn's former
    axe, the ogress of war, during the battle for vengeance after the Burning.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage names ownership and use of the weapons, but does not explicitly
    state symbolic meaning.
- id: motif:4
  label: Single warrior's extraordinary battle prowess
  taxonomy_refs: []
  basis: Kari leaps over a blow, kills or wounds opponents, catches a spear in the
    air and returns it fatally, and forces Bjarni out of the fight.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The feats are martial and heroic, but the passage does not mark them as
    supernatural.
- id: motif:5
  label: Shield cleaving in heroic combat
  taxonomy_refs: []
  basis: Multiple attacks split or pierce shields before wounding or killing the shield-bearer
