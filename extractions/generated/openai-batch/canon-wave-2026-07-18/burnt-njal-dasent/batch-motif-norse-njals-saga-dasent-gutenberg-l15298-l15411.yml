canonical_text:
  quote: ''
  summary: At the Althing, news that legal suits will fail shocks Thorhall Asgrim's
    son into leaving his sickbed; after violently cutting out his foot-boil with Skarphedinn's
    gifted spear, he goes to the Fifth Court and kills Grim the red. Kari and Asgrim
    call this the start of vengeance for the Burning, and a general battle follows.
    Several named warriors fight, kill, wound, or force opponents back. Flosi's side
    gives way in places and has a plan to retreat to the Great Rift, while Hall of
    the Side seeks help to separate the fighters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Snorri the priest arranged his men below the Great Rift, between it and Hadbooth,
    and instructed them beforehand how to behave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A messenger told Thorhall Asgrim's son that Mord Valgard's son and his friends
    would be made outlaws and that the manslaughter suits would come to nothing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thorhall reacted to the news by rising from bed, taking Skarphedinn's gifted
    spear, driving it through his foot, and cutting out the boil, after which blood
    and matter flowed onto the floor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thorhall then went out without halting and moved so fast that the messenger
    could not keep up with him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the Fifth Court, Thorhall met Grim the red, struck through his shield with
    the spear, pierced his body, and cast him off the spear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kari told Asgrim that Thorhall had slain a man and that it would be shameful
    if Thorhall alone had the heart to avenge the Burning; Asgrim answered that they
    should turn on their foes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A great cry and war-cries rose through the host, and Flosi's side and their
    foes turned against one another.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kari evaded Hallbjorn's blow, killed Arni Kol's son with a cut to the shoulder
    and breast, wounded Hallbjorn through the shield, caught Holmstein's thrown spear,
    and threw it back so that a man in Flosi's band died.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Thorgeir Craggeir struck Hallbjorn with a left-handed spear-thrust and then
    killed Thorwalld Kettle rumble's son with the axe called the ogress of war.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Asgrim, Thorhall, Hjallti, and Gizur attacked Flosi, the sons of Sigfus, and
    other Burners, while Gudmund, Mord, and Thorgeir attacked other regional groups;
    hard fighting followed and Flosi's men gave way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kari fought near Bjarni Broddhelgi's son, split a shield put before Bjarni,
    crippled the shield-bearer with a cut down the leg, and forced Bjarni back out
    of the fight.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Thorgeir and Gizur attacked where Holmstein and Thorkel led; Holmstein and
    Thorkel gave way and were hooted by Gudmund's men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Thorwalld Tjorfi's son received a spear-wound in the forearm, attributed by
