  text: The passage explains this belief as connected with regarding body and soul
    as distinct beings that could take separate bodily shapes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A fylgja could appear in human shape or in animal forms thought to foreshadow
    a person's character; examples include bear, wolf, ox, fox, and swan.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Seeing one's own fylgja is described as unlucky and often a sign of being
    death-doomed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thord Freedmanson sees a goat wallowing in its gore at Bergthorsknoll, and
    Njal interprets it as Thord's own fylgja and as a sign of his doom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Njal is said to have seen the fylgjur of Gunnar's enemies, and the passage
    says his feeling was soon confirmed by news from his shepherd.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says family guardian spirits may show themselves and be harmful
    to a household member before a great change begins in the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some men are said to have more than one shape, either by taking animal shapes
    such as bears or wolves, or by gaining rage and strength especially toward night.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: These men are called hamrammir, or shape-strong, and are said to become weaker
    after the fit leaves them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Baresarks are described as having exceeding and sometimes superhuman strength
    when their fury rises, and as being tired after the fits pass.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage compares Baresarks with Malays running a-muck, notes a possible
