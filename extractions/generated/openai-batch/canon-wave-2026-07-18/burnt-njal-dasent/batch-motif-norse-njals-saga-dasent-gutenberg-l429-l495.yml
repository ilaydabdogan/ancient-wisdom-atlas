canonical_text:
  quote: ''
  summary: 'The passage surveys beliefs attributed to Northmen: supernatural beings
    between humans and gods; wraiths, fetches, and guardian spirits; fylgjur that
    appear in human or animal forms and may foretell death; family guardian spirits;
    shape-strong men and Baresarks with supernatural fury; invulnerability, omens,
    luck, magic, and sorcery; and an inborn foresight exemplified by Njal and Helgi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Northman believed in good and bad giants, dark and bright
    elves, and other superhuman beings between humans and the gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Northman believed in wraiths, fetches, and guardian spirits
    attached to particular persons and families.
  category: relationship
  evidence_refs:
