  quote: '"the fame of this defence of his shall last as long as men live in this
    land"'
  summary: After Gunnar is slain, verse and speech praise his fame and defense. Gizur
    asks Rannveig for burial ground for two dead men, orders that nothing be robbed,
    and the attackers leave. Later, fear of retaliation leads to Geir being selected
    by lot to stay south; Hroald and Thorgeir boast of wounds dealt to Gunnar, while
    the slaying is widely condemned and mourned.
