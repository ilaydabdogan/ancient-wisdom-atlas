canonical_text:
  quote: ''
  summary: At the Althing, satirical verses and laughter precede a negotiated settlement
    after killings connected with the Burning and the fighting at the Thing. Hall
    of the Side renounces compensation for his son and offers peace. Snorri the priest
    and other leaders urge atonement; terms are accepted by many, though Thorgeir
    remains loyal to Kari. The settlement is handselled with handshakes, fines, offsets
    for killings, banishment abroad for Flosi and the Burners, and permanent exclusion
    for some men. Subsequent honor-gifts are exchanged, and the parties depart in
    different directions.
  language: English
  quote_policy: summarized
