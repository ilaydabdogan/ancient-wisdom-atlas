canonical_text:
  quote: ''
  summary: Flosi learns of Hauskuld's slaying, restrains his grief and anger, summons
    allies to the Thing, and travels among supporters. The passage includes a conditional
    prophecy about Ljot's future chiefship if he completes three safe annual journeys
    to the Thing. Flosi consults Runolf for a truthful account of the killing and
    the legal suit; Runolf calls the killing causeless, names Mord as the initiator
    of the legal action, and counsels Flosi to rest his wrath and seek the least trouble.
  language: English
  quote_policy: summarized
