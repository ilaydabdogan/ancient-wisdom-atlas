canonical_text:
  quote: ''
  summary: Unna visits Gunnar at Lithend after losing ready money and asks him to
    recover her goods from Hrut rather than accept more of Gunnar's money. Gunnar
    accepts her cause, gives her money for housekeeping, and then rides to Njal for
    legal advice. Njal agrees to prepare the case but warns that Gunnar's life will
    be in danger if he breaks the rules Njal sets.
