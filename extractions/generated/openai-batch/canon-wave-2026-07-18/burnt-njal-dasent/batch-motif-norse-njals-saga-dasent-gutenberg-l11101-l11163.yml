canonical_text:
  quote: God help me, and forgive you!
  summary: Hauskuld, the Priest of Whiteness, goes out sowing corn while carrying
    a corn-sieve and sword. Skarphedinn and his band ambush him near a fence, and
    all wound him. Hauskuld asks God to help him and forgive the attackers. Mord then
    proposes a plan to manipulate the report and legal notice of the killing. The
    attackers return home and tell Njal, who grieves deeply and foretells the deaths
    of himself, his wife, and all his sons, while saying Kari will withstand their
    enemies through good fortune.
  language: English
  quote_policy: quoted
