canonical_text:
  quote: ''
  summary: After violent tidings, Kari mobilizes Mord, Hjallti, and others to pursue
    Flosi's party. Ingialld reports a spear wound and a likely killing. Thorgeir and
    Mord counsel on kinship feud, outlawry, revenge, and tactics. Flosi observes the
    pursuit, avoids a trap involving home visits, keeps his men together, and winters
    at Swinefell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kari leaves the hollow where he had rested and continues onward after the
    previously reported meeting with Bard.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kari tells Mord the tidings; Mord grieves, and Kari urges him to gather people
    and come to Holtford rather than weep for the dead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kari meets Ingialld of the Springs along Thurso water and sees that Ingialld
    is bloody about the thigh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ingialld says that by Rangwater a spear was thrown at him, that he threw it
    back, and that the returned spear was said to have killed a man resembling Thorstein,
    Flosi's brother's son.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hjallti hears the tidings, reacts badly to the deeds, says there is need to
    pursue and slay the perpetrators, and gathers men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The pursuing force divides the hue and cry over several roads and places,
    including the east coast road, Fleetlithe, Threecorner ridge, Godaland, Sand,
    Fishwaters, and Holt.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thorgeir says Flosi would not ride under his eyes after slaying Njal and his
    kin, advises the pursuers to turn back, and offers Kari support and care for his
    farm.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Thorgeir states that he and his brothers are next of kin to follow up the
    feud and intend a suit leading to outlawry and revenge, man for man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Hof, the pursuers discuss their failure to find the fugitives and some
    describe the failure as disgrace.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some men propose pulling down the homesteads of those involved in the deeds,
    but Mord rejects the plan and argues that standing houses may draw the men back
    to visit their wives, where they can be hunted later.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hjallti invites Kari to stay with him; Kari says he will first go there and
    later make use of Thorgeir's offer.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Flosi and his men see the pursuers' movements from a fell, and Flosi decides
    that they should take their horses and ride away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Flosi infers that Mord expects the men to visit their wives and orders that
    no man shall part from the others, but all ride east with him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Flosi's group rides east and north of the Jokul to Swinefell; Flosi sends
    for stores, remains through winter until after Yule, does not speak about the
    deed, and shows no fear.
  category: sequence
  evidence_refs:
  - ev:11
