canonical_text:
  quote: ''
  summary: Hallgerda coerces Malcolm the thrall into stealing food from Kirkby and
    burning the storehouse so the loss will appear accidental. Malcolm goes by night
    with two horses, kills a friendly house-dog, takes food, burns the storehouse,
    and later leaves his knife and belt behind after repairing his shoe. Otkell initially
    accepts the damage as an accident. When Hallgerda serves the food at Lithend,
    Gunnar questions its source, condemns complicity with thieves, strikes Hallgerda,
    and she vows to remember and repay the blow.
  language: English
  quote_policy: summarized
