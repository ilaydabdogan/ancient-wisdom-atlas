canonical_text:
  quote: ''
  summary: Hrapp admits a sexual offense involving Gudbrand's daughter, escapes Gudbrand's
    attempt to seize and kill him, hides in a thick wood, and finds a secluded householder
    named Tofi. Hrapp reveals that he has slain Gudbrand's overseer and coerces Tofi
    into sharing his household by threatening to expose him. Tofi admits he seized
    and carried off a woman. Hrapp stays there, continues wandering and meeting Gudruna,
    evades her kin, and is later declared an outlaw by Earl Hacon with a price placed
    on his head.
