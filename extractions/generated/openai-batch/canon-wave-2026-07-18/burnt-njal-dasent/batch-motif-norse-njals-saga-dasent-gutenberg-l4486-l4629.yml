canonical_text:
  quote: ''
  summary: Njal warns Atli that Hallgerda may cause his death, but Atli remains in
    Njal's household and asks not to be compensated as a thrall if slain. Hallgerda
    brings in her kinsman Brynjolf, sends him to kill Atli while Atli is secretly
    making charcoal at Thorolfsfell, and afterward presents the killing as repayment
    for Kol's death. Gunnar and Njal settle the matter by full atonement, while Bergthora
    indicates that her own promise of reciprocal revenge remains unfulfilled.
  language: English
  quote_policy: summarized
