  quote: ''
  summary: Kari asks Njal's sons to join him in warfare, agrees to their condition
    that he later travel with them to Iceland, and goes sea-roving with them. They
    raid several places, fight local opponents, defeat Godred on Man, kill Dungal
    the king's son, and take spoil. They later stay with Earl Gilli, who travels with
    them to the Orkneys to meet Earl Sigurd. The next spring Sigurd gives his sister
    Nereida to Gilli, who returns to the Southern Isles.
