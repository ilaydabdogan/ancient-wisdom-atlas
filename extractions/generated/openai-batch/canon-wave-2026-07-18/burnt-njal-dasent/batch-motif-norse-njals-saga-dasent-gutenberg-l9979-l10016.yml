canonical_text:
  quote: ''
  summary: Thangbrand and Hall travel through Iceland preaching Christianity. Thangbrand
    defeats and kills Thorkell after Thorkell opposes the faith and challenges him.
    Several households or individuals accept the new faith or offer support. Heathen
    men hire Sorcerer-Hedinn to kill Thangbrand and his company; Hedinn makes a great
    sacrifice, after which the earth opens beneath Thangbrand's horse. Thangbrand
    escapes, the horse and harness disappear into the gulf, and Thangbrand praises
    God.
  language: English
  quote_policy: summarized
