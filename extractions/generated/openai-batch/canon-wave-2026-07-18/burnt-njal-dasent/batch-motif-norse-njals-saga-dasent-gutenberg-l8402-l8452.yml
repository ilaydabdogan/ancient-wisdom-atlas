canonical_text:
  quote: ''
  summary: Njal's sons Grim and Helgi leave Iceland by ship with Olaf Kettle's son
    and Bard the black. Wind and mist drive them off course until they near land,
    where a Viking force approaches in thirteen ships. The Viking leader Gritgard
    demands either their goods or their lives. Helgi speaks for defense, the chapmen
    hesitate, Grim prevents their reluctance being heard, and Bard and Olaf urge all
    aboard to arm themselves and bind themselves not to give up while they can fight.
  language: English
  quote_policy: summarized
