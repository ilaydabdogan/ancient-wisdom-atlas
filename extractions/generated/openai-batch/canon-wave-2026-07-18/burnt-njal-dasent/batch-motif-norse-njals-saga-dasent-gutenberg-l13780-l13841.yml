canonical_text:
  quote: ''
  summary: Mord formally summons nine nearby neighbours to attend the Althing and
    serve on an inquest concerning whether Flosi caused Helgi's fatal wound. Mord
    then coordinates with Thorgeir Craggeir and the allied bands swear not to separate
    until Kari permits it and to risk life for one another. Kari reports to Asgrim
    on the suit and on Flosi's gathering of support. Thorhall, a renowned lawyer,
    is badly disabled in one foot but is sent with Kari and twenty men to the Thing
    to prepare the booths because his help will be needed.
  language: English
  quote_policy: summarized
