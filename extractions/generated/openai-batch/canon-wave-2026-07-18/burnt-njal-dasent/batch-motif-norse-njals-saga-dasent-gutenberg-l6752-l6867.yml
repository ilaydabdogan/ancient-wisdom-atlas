canonical_text:
  quote: ''
  summary: Starkad urges an attack on Gunnar and his companions in the ness. Gunnar
    first fights with bow and arrows, then with bill and sword, while Kolskegg and
    Hjort also fight. Several named attackers are killed or maimed. Thorgeir vows
    to bring Gunnar's head to Hildigunna, but Gunnar resists the charge. Thorir Easterling
    kills Hjort, and Gunnar immediately kills Thorir. Starkad calls for flight, saying
    they are not dealing with men; Gunnar wounds Starkad and Thorgeir before they
    part. Fourteen men are dead in addition to Hjort. Hjort is carried home on his
    shield and buried in a cairn, while Hildigunna later dresses Starkad's and Thorgeir's
    wounds.
  language: English
  quote_policy: summarized
