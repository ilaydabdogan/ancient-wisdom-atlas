canonical_text:
  quote: ''
  summary: 'Kari and Kolbein sail from Eyrar and reach Fair Isle, where David the
    white hosts Kari through the winter and gives him news of the Burners. The narrative
    then reports Orkney and Irish political tidings: Earl Sigurd hosts a Yule feast
    with Earl Gilli and King Sigtrygg; Kormlada, Sigtrygg''s mother and Brian''s former
    wife, urges Sigtrygg to seek help in killing King Brian. Brian''s kin, foster-child,
    sons, mercy toward outlaws, and reconciliation with King Kylfi are described.
    At Earl Sigurd''s hall, the guests are seated by rank, and Gunnar Lambi''s son
    is set on a stool to tell the story of the Burning.'
  language: English
  quote_policy: summarized
