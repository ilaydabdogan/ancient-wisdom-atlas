canonical_text:
  quote: ''
  summary: Skamkell finds Malcolm's knife and belt, brings them to Otkell, and seeks
    counsel about suspected theft from Kirkby. Mord devises a test using women who
    exchange small wares for household gifts; cheese received at Lithend from Hallgerda
    fits Thorgerda's cheese-mould, leading Mord and others to judge that Hallgerda
    stole it. Gunnar, urged by Kolskegg, goes to Otkell to offer atonement and settlement,
    but Skamkell advises Otkell to reject Gunnar's terms and seek counsel from Gizur
    and Geir.
  language: English
  quote_policy: summarized
