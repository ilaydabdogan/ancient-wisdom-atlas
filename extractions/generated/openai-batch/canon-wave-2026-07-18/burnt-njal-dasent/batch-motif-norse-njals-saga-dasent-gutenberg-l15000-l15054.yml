canonical_text:
  quote: '"I swear an oath on the book, a lawful oath, and say it before God"'
  summary: 'Eyjolf Bolverk''s son appears before the court and advances a legal defence:
    the suit was pleaded in the wrong Quarter Court because of Flosi''s Thingman status.
    He repeatedly takes witness, swears a lawful oath on the book before God, presents
    witnesses and procedural proof, protests before a priest against the judges giving
    judgment, and calls on the judges to accept the defence. Other Burning suits then
    proceed.'
