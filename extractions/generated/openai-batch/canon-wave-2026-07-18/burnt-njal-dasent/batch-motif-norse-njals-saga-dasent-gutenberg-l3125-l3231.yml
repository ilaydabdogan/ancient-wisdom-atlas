canonical_text:
  quote: ''
  summary: In a chapter headed as Njal's advice, the speaker gives a detailed plan
    for an unnamed addressee to travel with companions disguised as a rude huckster
    named Hedinn. The addressee is to establish a bad reputation, provoke a quarrel
    near Hrut's farm, gain access to Hrut's house, draw Hrut into legal discussion
    about Unna's dower, induce Hrut to recite the proper summons, repeat it correctly,
    and openly summon Hrut in the suit transferred by Unna Mord's daughter.
