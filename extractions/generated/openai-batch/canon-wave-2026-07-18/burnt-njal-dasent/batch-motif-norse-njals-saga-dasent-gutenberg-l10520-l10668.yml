canonical_text:
  quote: ''
  summary: Lyting of Samstede urges others to avenge Thrain by killing Hauskuld Njal's
    son, but several men refuse because of obligation to Njal or an existing atonement.
    Lyting, his brothers, and house-carles ambush Hauskuld, who wounds Lyting and
    kills two serving-men before falling with sixteen wounds. Rodny has Hauskuld's
    body brought to Bergthorsknoll, presents it to Njal and his sons by torchlight,
    and urges Skarphedinn to avenge his brother; Bergthora also presses for immediate
    action.
  language: English
  quote_policy: summarized
