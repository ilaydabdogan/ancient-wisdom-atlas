  - ev:1
- id: obs:2
  text: Hauskuld Njal's son has a farm at Holt and regularly rides between Bergthorsknoll
    and Holt by the homestead at Samstede.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lyting asks Hauskuld Sigfus' son to avenge his father by killing Hauskuld
    Njal's son; Hauskuld Sigfus' son refuses because Njal is his foster father and
    has done him good.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lyting asks Grani Gunnar's son, Gunnar Lambi's son, Lambi Sigurd's son, and
    the sons of Sigfus to join in killing Hauskuld Njal's son; they refuse, with Grani
    saying he will not break an atonement made by good men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lyting says he has taken no atonement for Thrain and will not be content unless
    vengeance, man for man, is taken.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lyting calls on his two brothers and three house-carles, and they lie in wait
    for Hauskuld Njal's son in a pit north of the farmyard until about mid-even.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When Hauskuld Njal's son rides up, the ambushers attack with arms; he defends
