candidate_motifs:
- id: motif:1
  label: blood vengeance after rejected or absent atonement
  taxonomy_refs: []
  basis: Lyting says he has taken no atonement for Thrain and seeks vengeance man
    for man; later Bergthora anticipates that atonement may be offered if vengeance
    is delayed.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: The passage frames this as social feud and legal compensation, not as
    a supernatural or divine motif.
- id: motif:2
  label: refusal to break an atonement
  taxonomy_refs: []
  basis: Grani refuses to attack Njal's son because it would break an atonement made
    by good men, and others refuse in like terms.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives only the immediate reasons for refusal; broader legal
    details are not supplied here.
- id: motif:3
  label: ambush killing by lying in wait
  taxonomy_refs: []
  basis: Lyting and his companions hide in a pit north of the farmyard, wait for Hauskuld
    Njal's son, then jump up with arms and attack.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: No supernatural element is present.
- id: motif:4
  label: corpse displayed to incite kin vengeance
  taxonomy_refs: []
  basis: Rodny arranges Hauskuld's body upright in the sheepcote, shows it by torchlight
    to Njal's household, and explicitly gives Skarphedinn responsibility for vengeance.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage does not state that the display is ritualized beyond the actions
    described.
- id: motif:5
  label: denial or testing of death through bodily signs
  taxonomy_refs: []
  basis: Rodny asks whether Hauskuld's head is off, says he may not be quite dead,
    and appeals to Njal's healing ability; Njal counters that he sees death marks
    and no signs of life.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: This is not a resurrection episode; Hauskuld remains dead in the supplied
    passage.
- id: motif:6
  label: mortuary closing of eyes and nostrils assigned to kin
  taxonomy_refs: []
  basis: Njal asks why Hauskuld's eyes and nostrils have not been closed, Rodny says
