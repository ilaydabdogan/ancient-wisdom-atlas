  summary: Hrapp, after admitting a killing in Iceland, obtains sea passage from Kolbein
    but proves violent and deceptive. In Norway he gains hospitality from Gudbrand
    of the Dale, whose household is linked to a major shrine shared with Earl Hacon.
    Hrapp secretly associates with Gudbrand's daughter Gudruna, kills the overseer
    Asvard when discovered, learns Gudruna is pregnant, and then confronts Gudbrand
    with the bloody axe and admits the killing.
  language: English
