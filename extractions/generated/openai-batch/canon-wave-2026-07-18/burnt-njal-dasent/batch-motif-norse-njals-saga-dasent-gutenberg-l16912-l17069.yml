candidate_motifs:
- id: motif:1
  label: battle outcome determined by sorcerous inquiry and sacred timing
  taxonomy_refs: []
  basis: 'Brodir''s sorcery gives an answer keyed to Good Friday: Brian will fall
    but win if the battle is fought then, while earlier fighting means the fall of
    Brian''s opponents.'
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states the divination and timing, but does not identify the
    source of the answer.
- id: motif:2
  label: king protected because he will not fight on a fast-day
  taxonomy_refs: []
  basis: Brian refuses to fight on the fast-day and is surrounded by a shieldburg
    while his army fights before him.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents the act literally and does not expand its theological
    meaning.
- id: motif:3
  label: warrior or armor unharmed by steel
  taxonomy_refs: []
  basis: Brodir fells the foremost enemies, and no steel will bite on his mail.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The protection is attached specifically to the mail in this passage, not
    necessarily to Brodir's body.
- id: motif:4
  label: fatal battle banner whose bearers die
  taxonomy_refs: []
  basis: Kerthialfad kills the banner-bearer and successive bearers; Asmund explicitly
    warns that all who bear the banner get their death.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not explain the banner's origin or mechanism.
- id: motif:5
  label: river vision of hell and devils
  taxonomy_refs: []
  basis: Hrafn, chased into a river, sees pains of hell below and thinks devils want
    to drag him down, then is released after addressing Apostle Peter.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage frames the experience through Hrafn's perception, using 'thought
    he saw' and 'thought the devils wanted'.
- id: motif:6
  label: healing power of a slain king's blood
  taxonomy_refs: []
  basis: Brodir's stroke cuts off Takt's arm and Brian's head, but Brian's blood falls
    on the stump and heals it immediately.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives a healing miracle but not a doctrinal explanation for
    the blood's power.
- id: motif:7
  label: slain king's head rejoined to body
