canonical_text:
  quote: ''
  summary: 'The passage narrates the Battle of Brian: Brodir receives a sorcerous
    prediction about fighting on Good Friday; armies are arrayed; Brian refuses to
    fight on the fast-day and is protected by a shieldburg. Brodir, Earl Sigurd, Kerthialfad,
    Wolf, Ospak, Thorstein, and Hrafn are involved in fighting and flight. A fatal
    banner brings death to its bearers. Hrafn has a vision of hell and devils at a
    river. Brodir kills King Brian, but Brian''s blood heals Takt''s severed arm stump;
    Brodir is captured and disemboweled around a tree. Brian''s head is later found
    grown fast to his body. On Good Friday in Caithness, Daurrud sees women in a bower
    weaving on a loom made from men''s heads, entrails, a sword, and arrows, and singing
    the Woof of War.'
  language: English
  quote_policy: summarized
