canonical_text:
  quote: ''
  summary: Thrain Sigfus' son comes to Norway and is received by Earl Hacon because
    of his kinship with Gunnar of Lithend. Kol, a sea-rover, raids and kills Hallvard
    Soti and is outlawed by the Earl. Thrain volunteers to hunt Kol, is equipped with
    ships, men, weapons, and a pilot, and pursues him to Denmark. In a sea battle
    Kol boards Thrain's ship and kills many, but Thrain confronts him; after Kol is
    disabled, Thrain's side kills him and keeps his severed head. Thrain presents
    the head to Earl Hacon and is rewarded with a carved, painted, vulture-headed
    ship named the Vulture, along with the Earl's friendship. Thrain remains with
    the Earl after news arrives of Gunnar's death in Iceland.
  language: English
  quote_policy: summarized
