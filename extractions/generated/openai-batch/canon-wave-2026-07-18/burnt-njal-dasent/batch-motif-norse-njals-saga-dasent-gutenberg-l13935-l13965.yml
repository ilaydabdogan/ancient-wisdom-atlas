canonical_text:
  quote: ''
  summary: Thorgeir Craggeir rides west with many people and his brothers, joins with
    Mord, Hjallti, Asgrim, and Gizur, and approaches the Thing with men drawn up in
    array. Asgrim reports his dealings with Flosi, and Thorgeir voices a wish to test
    the other side's bravery before the Thing closes. Flosi and his men arm themselves,
    nearly causing a fight, but Asgrim and his party refuse to take part and withdraw
    to their booths. The day remains quiet, and the Thing is described as exceptionally
    crowded with chiefs from all quarters.
  language: English
  quote_policy: summarized
