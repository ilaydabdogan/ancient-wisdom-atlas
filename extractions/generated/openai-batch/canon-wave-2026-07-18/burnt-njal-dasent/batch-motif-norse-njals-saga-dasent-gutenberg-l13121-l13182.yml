canonical_text:
  quote: ''
  summary: Flosi confronts Ingialld across a river, accuses him of breaking faith,
    and offers to spare him if Ingialld grants Flosi the right to set his own award.
    Ingialld refuses. Flosi throws Thorstein's spear at Ingialld, wounding him and
    pinning the spear in his saddle-tree. Ingialld pulls it out and throws it back;
    Flosi avoids it, but Thorstein is struck dead. Ingialld escapes into the wood.
    Flosi then advises his men to ride to Threecorner ridge and Threecorner-fell,
    where they can watch movements and hide until three suns have risen and set.
  language: English
  quote_policy: summarized
