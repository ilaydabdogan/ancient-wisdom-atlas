canonical_text:
  quote: ''
  summary: Hallgerda learns and reports Thord's location, urging Sigmund, Thrain,
    and companions to attack him on his way home. Sigmund and others ride out armed,
    exclude Thrain from direct participation, confront Thord, refuse his request for
    single combat, and attack him with numerical advantage. Thord defends himself,
    breaks their spears, loses a hand to Skiolld, continues defending, and is killed
    by Sigmund. The attackers cover him with turf and stones. Thrain regrets the deed
    and expects Njal's sons to resent it. Hallgerda is glad, Rannveig warns of later
    consequences, Hallgerda sends messengers with news of the slaying, and Bergthora
    refuses to answer Hallgerda with a lesser quarrel.
  language: English
  quote_policy: summarized
