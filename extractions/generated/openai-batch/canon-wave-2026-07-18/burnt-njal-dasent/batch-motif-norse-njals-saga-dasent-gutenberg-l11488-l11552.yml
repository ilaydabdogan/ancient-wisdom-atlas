canonical_text:
  quote: ''
  summary: A company associated with the sons of Sigfus meets Flosi at Holtford and
    discusses the slaying and the legal suit. Kettle says he wants peace but is bound
    by oath to continue the suit. Grani and Lambi Sigurd's son seek outlawry and death,
    while Flosi warns that killing Njal or his sons would bring a dangerous blood
    feud and losses. Mord Valgard's son offers Flosi support at the Thing, and Flosi
    proposes a wedding alliance to secure Mord's loyalty and force. Mord and Flosi
    then ride to the Thing together in secret counsel.
  language: English
  quote_policy: summarized
