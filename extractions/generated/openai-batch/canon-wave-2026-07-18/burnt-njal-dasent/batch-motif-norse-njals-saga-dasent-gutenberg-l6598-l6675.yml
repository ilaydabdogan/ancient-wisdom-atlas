canonical_text:
  quote: ''
  summary: Gunnar rides home from Tongue with his brothers Kolskegg and Hjort after
    receiving hospitality and gifts from Asgrim. Sigurd Swinehead reports Gunnar's
    movements to hostile men, who plan an ambush at Knafahills with about thirty men.
    The passage includes boasts against Gunnar and Kolskegg, Hildigunna's warning
    response, Easterlings' reluctance to join an unequal attack, a shaming speech
    by the house mistress, and an Easterling's fatal farewell before joining the ambush
    party.
  language: English
  quote_policy: summarized
