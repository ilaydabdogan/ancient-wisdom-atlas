canonical_text:
  quote: ''
  summary: A sea battle is underway between Vikings and chapmen. After the chapmen
    refuse to yield, a fleet led by Kari Solmund's son arrives from the south. Kari
    identifies himself, promises aid, joins the fighting, kills Snowcolf, and helps
    the defenders defeat Gritgard. The defeated men receive peace, while their goods
    are taken and the ships are moved under the islands.
  language: English
  quote_policy: summarized
