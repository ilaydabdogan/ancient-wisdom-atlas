canonical_text:
  quote: '"I will challenge thee to single combat on the island"'
  summary: At the Thing, Asgrim has an inheritance suit against Wolf, but Wolf has
    a procedural bar against it. Gunnar intervenes by challenging Wolf to single combat
    if legal rights cannot be obtained, and Wolf pays the money. Asgrim invites Gunnar
    to visit and pledges legal support. Later Njal warns Gunnar of a threatened attack,
    advises secrecy, companions, and weapons, but Gunnar prepares to travel with Kolskegg
    and chooses not to involve Njal's sons.
  language: English
  quote_policy: quoted
