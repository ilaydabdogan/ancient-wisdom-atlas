canonical_text:
  quote: ''
  summary: Earl Sigurd of Orkney receives Kari and the men he brings to Hrossey. Kari
    recounts their valor and asks that they be given quarters among Sigurd's bodyguard.
    During the winter Helgi is silent; when questioned, he says Sigurd's Scottish
    realm has suffered violence and that messengers have been stopped from crossing
    the Pentland Firth. Sigurd and Kari discuss whether this is second sight. Messengers
    later confirm that Earl Hundi and Earl Melsnati have killed Havard, Sigurd's brother-in-law,
    and Sigurd gathers a host to drive them out.
  language: English
  quote_policy: summarized
