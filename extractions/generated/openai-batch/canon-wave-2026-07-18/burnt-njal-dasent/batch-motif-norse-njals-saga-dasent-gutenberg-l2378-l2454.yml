canonical_text:
  quote: ''
  summary: After Thorwald and Hallgerda return from their bridal feast, Thiostolf
    remains close to Hallgerda and distant from Thorwald. Hallgerda's spending contributes
    to household scarcity, and a quarrel over provisions ends with Thorwald striking
    her face and drawing blood. Hallgerda shows the wound to Thiostolf, who vows to
    avenge it. Thiostolf rows to the Bear-isles with an axe, confronts Thorwald while
    he is loading goods, and kills him after Thorwald attacks with a fishing-knife.
  language: English
  quote_policy: summarized
