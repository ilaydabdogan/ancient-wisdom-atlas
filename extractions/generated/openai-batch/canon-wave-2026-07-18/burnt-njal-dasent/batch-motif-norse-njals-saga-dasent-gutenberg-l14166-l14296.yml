canonical_text:
  quote: ''
  summary: Asgrim, Gizur, Kari, Hjallti, Mord, and Thorgeir discuss opposing legal
    plans, including a report that Eyjolf has secretly received a gold ring and may
    defend Flosi's suit. Gizur organizes a delegation to seek help. Skapti refuses
    aid because of remembered insults from Skarphedinn, while Snorri receives the
    delegation, discusses the blood-feud, and encourages readiness for armed conflict
    at the Thing.
  language: English
  quote_policy: summarized
