canonical_text:
  quote: "“Njal and Flosi, and the sons of Sigfus shook hands...”"
  summary: Njal asks the parties to remain and hear him. He says the suit has failed
    and asks to make atonement for Hauskuld’s slaying on behalf of his sons, with
    worthy men to make an award. Intercessors urge Flosi to accept atonement; Hall
    of the Side invokes a promised boon, and Flosi agrees. Flosi and Njal each name
    six daysmen. Njal, Flosi, and the sons of Sigfus shake hands, and Njal pledges
    that his sons and Kari will abide by the judgment of the twelve men. The judges
    are to sit in the Court of Laws.
  language: English
  quote_policy: quoted
