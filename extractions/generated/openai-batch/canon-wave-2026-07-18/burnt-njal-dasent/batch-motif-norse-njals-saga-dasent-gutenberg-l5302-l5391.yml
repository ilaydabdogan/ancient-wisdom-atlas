canonical_text:
  quote: ''
  summary: The passage introduces Otkell of Kirkby, his kin, household, and associates,
    including Skamkell and the Irish thrall Malcolm. During a widespread scarcity
    of hay and meat, Gunnar, having shared his own stores, asks Otkell to sell or
    give supplies, but Otkell refuses under Skamkell's bad counsel. Gunnar rejects
    a proposal to take the supplies by force and instead buys Malcolm. Njal and Bergthora
    criticize the refusal, and Njal and his sons bring Gunnar hay and meat as a gift
    of aid and friendship.
  language: English
  quote_policy: summarized
