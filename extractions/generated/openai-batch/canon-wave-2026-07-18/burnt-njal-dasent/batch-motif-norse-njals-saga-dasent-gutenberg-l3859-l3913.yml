canonical_text:
  quote: ''
  summary: Gunnar decides to sail back to Iceland. The Earl provides meal and timber
    for his ship because grain and sailing are scarce. Gunnar returns with Hallvard
    and Kolskegg, arrives before the Thing, is welcomed at home, and visits Njal.
    Njal welcomes him but warns that Gunnar will face envy, bad events, and quarrels,
    and advises against riding to the Thing. Gunnar gives Njal gifts for caring for
    his goods. Kolskegg urges attendance at the Thing for honor, while Gunnar says
    he does not seek display but values meeting worthy men; Hallvard offers to ride
    with them.
  language: English
  quote_policy: summarized
