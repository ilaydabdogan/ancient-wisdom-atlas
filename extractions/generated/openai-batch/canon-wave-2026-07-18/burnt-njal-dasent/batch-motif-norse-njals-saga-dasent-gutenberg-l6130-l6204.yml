canonical_text:
  quote: This will be the beginning of thy manslayings.
  summary: After Gunnar reports his deeds to Njal, Njal gives prophetic advice about
    the coming Thing, future killings, keeping peace-settlements, and the danger to
    Gunnar's life. Gizur the white and Geir the priest, who hold the blood-feud after
    Otkell, decide to pursue the matter at law; Geir is chosen by lot to take up the
    suit. They gather legal evidence at Rangriver, summon witnesses, decline an armed
    move against Gunnar, and news spreads that the coming Thing will be turbulent.
  language: English
  quote_policy: quoted
