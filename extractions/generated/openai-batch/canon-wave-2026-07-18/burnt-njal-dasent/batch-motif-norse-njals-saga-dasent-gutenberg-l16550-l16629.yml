canonical_text:
  quote: ''
  summary: Flosi leads men and goods east to Hornfirth, sails abroad, loses course
    in hard weather, and is wrecked on Hrossey in the Orkneys. The men survive but
    lose ship and goods. After hiding briefly, they surrender to Earl Sigurd. Flosi
    admits killing Helgi Njal's son, the Earl's henchman; Thorstein and others intercede,
    the Earl accepts atonement, grants peace, and places Flosi in Helgi's former service
    position.
  language: English
  quote_policy: summarized
