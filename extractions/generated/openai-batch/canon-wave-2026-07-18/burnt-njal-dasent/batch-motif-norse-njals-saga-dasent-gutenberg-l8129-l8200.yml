canonical_text:
  quote: ''
  summary: Skarphedinn urges Hogni to set out by night. Hogni takes down Gunnar's
    bill, which rings; Rannveig interprets this as a sign of death and tells Hogni
    to avenge his father rather than send the weapon to Valhalla. Hogni and Skarphedinn
    travel with two ravens accompanying them, use animals or animal-like signs to
    draw enemies out, kill four men, and then confront Mord, who begs for mercy and
    offers atonement. Hogni accepts the right to make his own award from Mord.
  language: English
  quote_policy: summarized
