canonical_text:
  quote: ''
  summary: The opening of the saga introduces Mord Fiddle, his legal authority, and
    his daughter Unna. The narrative then shifts to Hauskuld and his brother Hrut
    in the Broadfirth dales. At a feast, Hauskuld calls his daughter Hallgerda to
    him, kisses her, and asks Hrut to judge her beauty. Hrut says she is fair but
    predicts that many will suffer for it and remarks on her “thief’s eyes,” angering
    Hauskuld and cooling relations between the brothers.
  language: English
  quote_policy: summarized
