canonical_text:
  quote: ''
  summary: As Gunnar and Kolskegg ride toward Rangriver, a blood-token appears on
    Gunnar's bill and is interpreted as 'wound-drops' before a great fight. They see
    an ambush by the river, prepare at the ford, and fight. Gunnar and Kolskegg kill
    and wound multiple attackers, including Thorgeir Otkell's son, whom Gunnar casts
    into Rangriver; the ford is thereafter named Thorgeir's ford. The attackers flee.
    Gunnar refuses pursuit because of expected compensation payments. Hallgerda praises
    the deed, while Rannveig feels foreboding.
  language: English
  quote_policy: summarized
