canonical_text:
  quote: ''
  summary: Skarphedinn fails to escape the burning house, wounds Gunnar Lambi's son
    with Thrain's jaw-tooth, joins his brother Grim in treading the fire, and is trapped
    by the fallen roof. Flosi and the burners remain until daylight. Geirmund reports
    that Kari escaped burned but armed, and Flosi predicts a severe blood feud. Songs
    are sung about the burning, including an uncertain song heard from within the
    fire. Flosi refuses to search the ruins, rides away, and turns toward a new attack
    on Ingialld.
  language: English
  quote_policy: summarized
