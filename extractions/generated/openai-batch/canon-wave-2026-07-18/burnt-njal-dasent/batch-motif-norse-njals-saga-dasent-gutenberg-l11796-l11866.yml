canonical_text:
  quote: ''
  summary: Asgrim and his party seek support from Gudmund the powerful. Skarphedinn
    is twice marked by others as pale-faced, fearsome, and unlucky-looking, and he
    answers with taunts about abduction, killing, and slander. The group then goes
    toward Thorkel foulmouth's booth, and the narrator recounts Thorkel's foreign
    exploits, including the slaying of a robber, a wild man of the woods, and a flying
    fire-drake, as well as his carved memorialization of these deeds and his reputation
    for harsh speech.
  language: English
  quote_policy: summarized
