  quote: ''
  summary: At the Hill of Laws, Mord and other men publicly declare legal suits connected
    with killings and the burning at Bergthorsknoll. Flosi consults Eyjolf, who advises
    a procedural defense by transferring Flosi's priesthood and changing his Thing
    affiliation, after which Flosi acts on that advice secretly.
  language: English
  quote_policy: summarized
