canonical_text:
  quote: ''
  summary: Mord comes to Bergthorsknoll, slanders Hauskuld, and urges Njal's sons
    and Kari to kill him. Skarphedinn agrees on the condition that Mord join them
    and take part. Mord accepts, and they bind the plan by promises. Bergthora asks
    Njal what the men are discussing, and Njal says he is not in their counsels, adding
    that he was seldom excluded when plans were good. That night Mord arrives; Njal's
    sons and Kari take weapons, ride away, and wait by a fence at Ossaby as the sun
    rises.
  language: English
