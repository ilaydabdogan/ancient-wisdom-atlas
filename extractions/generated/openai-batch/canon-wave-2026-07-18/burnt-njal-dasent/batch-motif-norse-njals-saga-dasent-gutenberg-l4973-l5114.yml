canonical_text:
  quote: ''
  summary: After the Thing, Gunnar says he has made peace for Sigmund with Njal and
    Njal's sons, but warns him against further mocking. Later, gossiping women report
    to Hallgerda what they saw at Bergthorsknoll. Hallgerda mocks Njal's beardlessness
    and his sons by dung-related nicknames and asks Sigmund to compose abusive verses.
    Gunnar overhears, rebukes Sigmund, and forbids the words being repeated. The women
    then tell Bergthora, who urges Njal's sons to answer the shame. The sons show
    restrained or silent anger, and Njal counsels patience and caution about vengeance.
  language: English
  quote_policy: summarized
