canonical_text:
  quote: ''
  summary: Mord visits Bergthorsknoll and cultivates close friendship with Skarphedinn
    and Njal's sons, though Njal dislikes his coming. Mord then invites Njal's sons
    and Kari to a feast marking his heirship after his father and promises gifts.
    At the crowded feast he gives named gifts to Skarphedinn and Kari and other gifts
    to Grim and Helgi. When the recipients return home boasting of the gifts, Njal
    warns that the gifts will be dearly bought and that they should beware repaying
    Mord in the way he desires.
  language: English
  quote_policy: summarized
