canonical_text:
  quote: ''
  summary: At the Thing, Geir the priest brings multiple manslaughter suits against
    Gunnar and one against Kolskegg. Formal legal procedures follow, including oaths,
    witnesses, an inquest, findings, and Gunnar's legal defence and counter-threat
    against Geir. Njal, Thorod, Gizur, and other wise men steer the dispute toward
    arbitration. The award assigns compensation, offsets Otkell's death against Gunnar's
    spur-wound, leaves Skamkell unatoned, and ends with peace pledges and Gunnar's
    enhanced honour.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Skapti and his father Thorod are introduced as chiefs skilled in law, with
    Thorod described as crafty and guileful; they support Gizur the white in quarrels.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lithemen and dwellers by Rangriver come to the Thing in a large body and
    declare support for Gunnar.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The parties arrive at the Thing, set up booths, and chiefs are listed in company
    with Gizur the white.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the Hill of Laws, Geir the priest gives notice of manslaughter suits against
    Gunnar for the deaths of Otkell, Hallbjorn the white, Audulf, and Skamkell, and
    against Kolskegg for the death of Hallkell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the courts are to be set, both sides gather men in strength; Geir and
    Gizur stand on one side of the court, while Gunnar and Njal stand opposite them.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Geir follows formal court procedure by taking an oath, declaring his suit,
    calling witnesses about notice, calling neighbours to form the inquest, calling
    on Gunnar to challenge the inquest, and calling for the inquest's finding.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The neighbours on the inquest state that Audulf's slaying cannot be found
    on because the next of kin who should pursue it is in Norway.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The inquest finds Gunnar truly guilty of killing Otkell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Gunnar answers with an oath and defence, saying he had outlawed Otkell before
    neighbours for a bloody wound caused by Otkell's spur, and he forbids Geir and
    the judges to proceed by lawful protest.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gunnar states that he will summon Geir at the Hill of Laws for calling inquest-men
    who had no right to deal with Audulf's slaying and will seek to have Geir declared
    outlaw.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Njal warns that the dispute should not take that turn because the strife would
    be carried to the uttermost, and he says both Gunnar and Geir have serious legal
    vulnerabilities.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Thorod recommends settlement and atonement as the peaceful way; Gizur proposes
    that good men and true utter an award; Gunnar says he has been willing to make
    matters up.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: By the counsel of the wisest men, all suits are put to arbitration, and six
    men issue the award at the Thing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The award leaves Skamkell unatoned, offsets the blood money for Otkell against
    Gunnar's spur-wound, and requires payment for the remaining manslaughters according
    to the worth of the men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Gunnar's kinsmen provide money to pay the fines at the Thing.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Geir and Gizur give Gunnar pledges that they will keep the peace in good faith;
    Gunnar returns home, thanks helpers, gives gifts, receives great honour, and remains
    at home in honour.
  category: sequence
  evidence_refs:
  - ev:10
