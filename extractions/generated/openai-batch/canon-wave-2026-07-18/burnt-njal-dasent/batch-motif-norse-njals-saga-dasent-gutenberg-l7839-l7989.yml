canonical_text:
  quote: ''
  summary: Gunnar is besieged in his wooden hall. He kills or wounds attackers with
    his bill, bow, and arrows through repeated assaults. Mord proposes burning the
    house, but Gizur refuses; Mord instead devises a rope-and-lever plan to pull off
    the roof. After Gunnar's bowstring is cut, he asks Hallgerda for locks of hair
    to make a new string, saying his life depends on it. Hallgerda refuses because
    he once slapped her. Gunnar continues fighting until exhausted and is slain; skaldic
    verse commemorates his defence.
  language: English
  quote_policy: summarized
