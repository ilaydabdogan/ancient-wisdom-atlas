canonical_text:
  quote: '"Take good care, messmate, that thou keepest to this atonement"'
  summary: At the Thing, Njal intervenes in Gunnar's manslaughter suit, challenges
    the inquest, and establishes that the slain men had intended harm to Gunnar. Chiefs
    press for atonement, twelve men make an award, and the settlement requires payment
    and Gunnar's departure abroad with Kolskegg for three winters. Njal pays Gunnar's
    amount from money he had kept and invested, then warns Gunnar that keeping the
    settlement will bring honor and return, while breaking it will bring death in
    Iceland. Gunnar says he will not break the atonement, and Rannveig comments on
    his going abroad.
  language: English
  quote_policy: quoted
