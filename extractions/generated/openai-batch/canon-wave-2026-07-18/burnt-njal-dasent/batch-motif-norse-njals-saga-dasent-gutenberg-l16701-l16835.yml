canonical_text:
  quote: ''
  summary: Kari arrives unexpectedly in Orkney, hears Gunnar Lambi's son mockingly
    and unfairly recount the Burning on Yule-day, enters the hall, and beheads him
    before King Sigtrygg and the earls. Kari is not pursued and sails to Caithness.
    Sigtrygg then recruits Earl Sigurd for war against King Brian by promising him
    Kormlada and the kingship of Ireland, and later secretly offers the same reward
    to Brodir. Ospak refuses to fight Brian and splits from Brodir, who is described
    as an apostate sorcerer with mail that steel cannot bite.
  language: English
  quote_policy: summarized
