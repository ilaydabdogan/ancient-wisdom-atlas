candidate_motifs:
- id: motif:1
  label: miraculous preservation from fire
  taxonomy_refs: []
  basis: Njal and Bergthora are found unburnt beneath a fire-shrivelled hide, and
    the witnesses praise God and call it a great token; Skarphedinn is also partly
    preserved from the fire.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage reports the witnesses' religious interpretation but does not
    explain the mechanism of preservation.
- id: motif:2
  label: incorrupt or luminous honored dead
  taxonomy_refs: []
  basis: Hjallti says Njal's body and face are brighter than any dead man's body he
    has seen, and others agree.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage describes brightness and collective assent, but it does not
    explicitly call Njal a saint or state a formal cultic interpretation.
- id: motif:3
  label: cross-marked dead warrior
  taxonomy_refs: []
  basis: Skarphedinn's hands are laid in a cross, and two cross-shaped brands are
    found on his body after his death in the burned house.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage says men thought he must have burned the marks into himself;
    any further theological interpretation would go beyond the passage.
- id: motif:4
  label: weapon succession after a warrior's death
  taxonomy_refs: []
  basis: Skarphedinn's axe is recovered from the wall, praised as a rare weapon, and
    Kari names Thorgeir Craggeir as the one who shall bear it.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage designates a new bearer but does not narrate a formal inheritance
    ritual.
- id: motif:5
  label: kin grief turning toward vengeance and lawsuit
  taxonomy_refs: []
  basis: Thorhall reacts violently to Njal's death and wishes for vengeance, while
    Asgrim and Kari plan legal suits and ally support against Flosi.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage combines emotional vengeance language with legal procedure;
    the outcome of the suits is not included here.
