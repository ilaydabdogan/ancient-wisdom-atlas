canonical_text:
  quote: ''
  summary: Kari asks Hjallti to search for Njal's bones. A party gathers at Bergthorsknoll,
    digs through ashes, and finds Njal and Bergthora unburnt beneath a hide, with
    a boy between them whose finger is burnt. Hjallti comments on Bergthora's fair
    appearance and Njal's unusually bright dead body. Skarphedinn is found by the
    gable with his legs burnt, the rest of him unburnt, his axe driven into the wall,
    his hands crossed, and cross-shaped brands on his body. Other remains are found
    and the bodies are carried to church. Kari and the displaced household go to Asgrim,
    Thorhall reacts violently to news of Njal's death and wishes for vengeance, and
    Asgrim reports Gizur's advice for bringing legal suits against Flosi and using
    Mord as pleader.
  language: English
  quote_policy: summarized
