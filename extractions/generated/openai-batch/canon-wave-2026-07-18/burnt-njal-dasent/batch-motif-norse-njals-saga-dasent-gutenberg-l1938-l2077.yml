canonical_text:
  quote: ''
  summary: Hrut grows silent at the king's court and asks leave to return to Iceland.
    Gunnhillda provides meal, gives him a gold ring, kisses him, and lays a spell
    that he will not enjoy life with the woman he desires in Iceland. Hrut sails home
    with Auzur, arranges his wedding to Mord's daughter Unna, and begins married life.
    Unna is unhappy and complains to her father at the Thing, but she states no formal
    charge; witnesses speak well of Hrut, and Mord tells her to return home.
  language: English
  quote_policy: summarized
