  evidence_refs:
  - ev:1
- id: obs:2
  text: Hrut asks the king for leave to go to Iceland; the king questions whether
    Hrut's honour will be greater there, and Gunnhillda urges that he be allowed to
    go.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: During a bad harvest, Gunnhillda gives Hrut as much meal as he chooses before
    he prepares to sail to Iceland with Auzur.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gunnhillda gives Hrut a gold ring, clasps it around his wrist, kisses him,
    and speaks a spell concerning his future life with the woman he desires in Iceland.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
