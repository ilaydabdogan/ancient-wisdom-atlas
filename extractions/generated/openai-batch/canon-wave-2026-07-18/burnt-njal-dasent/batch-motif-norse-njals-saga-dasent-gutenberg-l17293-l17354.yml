canonical_text:
  quote: ''
  summary: Kari travels abroad by ship for pilgrimage and absolution, returns north
    through Britain to Caithness, and later sails toward Iceland. His ship is wrecked
    at Ingolf's Head, but the men survive. In a storm he goes to Swinefell, where
    Flosi receives him with honor; they make full atonement, and Flosi gives Hildigunna
    to Kari. The passage then recounts Flosi's later departure by sea in old age,
    his disappearance without tidings, and closing genealogical notices.
  language: English
  quote_policy: summarized
