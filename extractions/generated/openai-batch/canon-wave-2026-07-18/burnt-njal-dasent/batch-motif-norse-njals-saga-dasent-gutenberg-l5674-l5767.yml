  quote: '"This must be the biggest lie."'
  summary: Skamkell reports counsel between parties, then tells Otkell that Gizur
    and Geir advise a hostile legal summons rather than settlement. Otkell accepts
    this report, despite Hallbjorn's suspicion, and the summons is served on Gunnar
