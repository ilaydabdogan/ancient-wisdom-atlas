canonical_text:
  quote: ''
  summary: At the Thing, Eyjolf is asked to support and defend suits. After first
    reacting angrily, he is calmed and offered a valuable gold arm-ring by Flosi in
    exchange for help and friendship. Eyjolf accepts the ring, formally undertakes
    the whole legal defence, and asks that the payment remain secret if the matter
    reaches the Fifth Court. Later Snorri the priest sees the ring, questions whether
    it was bought or given, and warns that the gift may bring Eyjolf death before
    the Thing ends.
  language: English
  quote_policy: summarized
