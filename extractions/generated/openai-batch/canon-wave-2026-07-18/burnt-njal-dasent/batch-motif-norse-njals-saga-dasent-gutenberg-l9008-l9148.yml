canonical_text:
  quote: ''
  summary: The Earl repeatedly searches Thrain's ship for Hrapp, whom he accuses Thrain
    of hiding. Thrain and his men conceal Hrapp first in the lading and then in the
    sail, while the Earl correctly suspects successive hiding places too late to find
    him. A fair breeze allows Thrain's ship, the Vulture, to sail away to Iceland
    with Hrapp. The Earl says the outcome was caused by their ill-fellowship, and
    Hrapp later remains connected with Thrain and Gritwater, where he is regarded
    as a harmful presence.
  language: English
  quote_policy: summarized
