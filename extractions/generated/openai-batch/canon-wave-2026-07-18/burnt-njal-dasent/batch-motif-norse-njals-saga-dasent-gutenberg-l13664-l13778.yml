canonical_text:
  quote: ''
  summary: 'Thorhall and Kari visit Gizur. When Njal''s burning is mentioned, Kari
    recites a griefful verse about escaping the burning. Gizur counsels Kari to ride
    east, gather allied kinsmen, and compel Mord Valgard''s son to take up a manslaughter
    suit against Flosi for the killing of Helgi Njal''s son. Mord is pressured through
    threats involving Thorkatla and accepts the suit. He then performs formal legal
    acts: summoning neighbours, receiving the suit by law, giving notice of the fatal
    wound and assault, and summoning nine neighbours to the Althing inquest.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thorhall Asgrim's son and Kari Solmund's son ride to Mossfell to see Gizur
    the white, who receives them warmly and hosts them for a long while.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During talk of Njal's burning, Gizur says Kari's escape was very lucky, and
    Kari responds with a verse of grief about leaving the burning against his will.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Kari's verse describes leaping out while armed men lit a blaze of flame and
    Njal's rooftree roared or crackled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gizur advises Kari not to ride home, but to ride east under Eyjafell to Thorgeir
    Craggeir and Thorleif crow, with Thorgrim the big also to ride with them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gizur says these men are the next of kin in the suit and instructs Kari to
    tell Mord Valgard's son to take up the manslaughter suit for Helgi Njal's son
    against Flosi.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gizur instructs Kari to pressure Mord by feigned wrath, by pretending that
    he would let his axe fall on Mord's head, and by threatening that Gizur will fetch
    his daughter Thorkatla home.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kari rides east over named rivers and places to Holt, where Thorgeir welcomes
    him and reports Flosi's journey and the help Flosi gained in the east firths.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Thorgeir says that the better things go for Flosi's side, the worse they shall
    be for them, and that he and his allies will follow them up harder.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mord Valgard's son initially hesitates to take on the case and says it is
    harder to go to law with Flosi than with any other ten men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kari rebukes Mord as cowardly and heartless and says Thorkatla shall go home
    to her father; Thorkatla prepares at once and says she has long been ready to
    part from Mord.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mord changes his mind, asks them to let go of their wrath, and accepts the
    suit at once.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kari warns Mord to plead the suit without fear because Mord's life lies on
    it, and Mord promises to do the task well and manfully.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mord summons nine neighbours who live near the place where the deed was done.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Mord takes Thorgeir by the hand and, before witnesses, declares that Thorgeir
