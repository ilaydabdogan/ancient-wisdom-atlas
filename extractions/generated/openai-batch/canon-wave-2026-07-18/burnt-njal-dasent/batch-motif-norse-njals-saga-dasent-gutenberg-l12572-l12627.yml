canonical_text:
  quote: '"the whole board and the meat on it is one gore of blood"'
  summary: At Bergthorsknoll, Grim and Helgi hear reports of armed riders and return
    home. Bergthora foretells that this is the last meal she will set before the household
    and gives the brothers' early return as a token. Njal reports a vision of the
    gable wall thrown down and the board and meat covered in blood. Skarphedinn urges
    composure, the brothers return before the meal is cleared, and Njal warns everyone
    not to sleep but to be on guard.
  language: English
  quote_policy: quoted
