canonical_text:
  quote: ''
  summary: After returning to Holt, Thorgeir sends his brothers away to avoid the
    charge of truce-breaking, maintains an armed household, and gains renown with
    Kari for a recent attack on a larger group. Kettle reports the failed expedition
    to Flosi at Swinefell. Later, after Yule, Hall of the Side and Kol visit Flosi.
    Hall advises Flosi to seek atonement with Thorgeir, explains the likely terms
    involving fines for Njal and his sons, identifies remaining blood-feud obligations,
    and warns that Kari remains dangerous if left outside the settlement. The sons
    of Sigfus accept Hall's counsel, while Grani Gunnar's son and Gunnar Lambi's son
    speak confidently about dealing with Kari; Hall warns this will be costly.
  language: English
  quote_policy: summarized
