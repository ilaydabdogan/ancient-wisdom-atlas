canonical_text:
  quote: ''
  summary: A flood has thrown a smooth, slippery sheet of ice across the Fleet, where
    Thrain and his men stand. Skarphedinn leaps the stream, slides across the ice,
    kills Thrain with an axe, and escapes across the ice. His companions then fight
    and kill Hrapp and Tjorvi. Skarphedinn seizes two men but chooses not to kill
    them, and several men are given peace. The leap is measured at twelve ells. Njal
    hears the report and predicts that evil, including the possible death of one of
    his sons, will follow. Thrain's body is carried to Gritwater and laid in a cairn.
  language: English
  quote_policy: summarized
