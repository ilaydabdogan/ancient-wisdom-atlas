canonical_text:
  quote: ''
  summary: At the Althing, Gunnar pursues a suit against Hrut. Hrut objects on procedural
    grounds, but Njal says the pleading can still be kept alive. Gunnar instead challenges
    Hrut to single combat on an island in Axewater unless the money is paid that day.
    Hrut avoids the combat after Hauskuld counsels payment. The brothers collect support
    from householders and pay Gunnar, who later gives all the money to Unna. Hrut
    predicts that Gunnar will be avenged upon, though not by Hrut and Hauskuld.
  language: English
  quote_policy: summarized
