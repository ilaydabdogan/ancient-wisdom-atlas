canonical_text:
  quote: ''
  summary: Otkell and companions ride toward the Dale, their horses racing off the
    path. Gunnar is alone sowing in his field when Otkell rides over him and wounds
    his ear with a spur. Gunnar protests the bloodshed and insults; Skamkell taunts
    him, and Gunnar threatens that Skamkell will next see his bill. Gunnar later reports
    the event to Kolskegg and neighbors. At the Dale, Skamkell repeats and mocks the
    episode; Runolf rebukes him, warns of consequences, offers to accompany Otkell,
    and later gives Otkell farewell gifts.
  language: English
  quote_policy: summarized
literal_observations:
