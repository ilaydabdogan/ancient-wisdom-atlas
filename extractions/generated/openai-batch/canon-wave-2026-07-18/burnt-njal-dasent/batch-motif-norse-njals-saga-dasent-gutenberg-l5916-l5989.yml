- id: obs:3
  text: Gunnar left home alone carrying a corn-sieve in one hand and a hand-axe in
    the other, went to his seed field, laid down his cloak and axe, and sowed corn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Otkell rode faster than he wished, with spurs on his feet, down over the ploughed
    field; neither Otkell nor Gunnar saw the other before the collision.
  category: sequence
  evidence_refs:
  - ev:3
