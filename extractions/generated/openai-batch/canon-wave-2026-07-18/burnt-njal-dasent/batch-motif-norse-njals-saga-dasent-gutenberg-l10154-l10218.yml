canonical_text:
  quote: ''
  summary: Gest Oddleif's son, described as wise and prophetic, hosts Thangbrand.
    A feared Baresark named Otrygg is expected at Hagi. Thangbrand proposes a test
    with hallowed and unhallowed fires to determine whether the people should accept
    the faith. Otrygg enters, treads the heathen-hallowed fire, cannot tread Thangbrand's
    hallowed fire, and is then disabled and killed after Thangbrand uses a crucifix
    and sword and Gudleif cuts off his arm. Gest and his household, along with many
    others, are baptized. Gest counsels Thangbrand about the future legal adoption
    of Christianity and gives him gifts before Thangbrand travels onward.
  language: English
  quote_policy: summarized
