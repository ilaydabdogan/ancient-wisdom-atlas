canonical_text:
  quote: ''
  summary: Earl Sigurd, accompanied by Kari and Njal's sons, marches south to Caithness
    and fights enemy earls at Duncansness. Njal's sons reverse a flank attack, Kari
    kills Earl Melsnati by catching and returning his spear, and the force withdraws
    when Malcolm gathers a larger host. Sigurd later divides spoil, gives gifts, takes
    Helgi and Grim into his body-guard, and the companions continue in service and
    sea-roving before Njal's sons depart by ship for Norway.
  language: English
  quote_policy: summarized
