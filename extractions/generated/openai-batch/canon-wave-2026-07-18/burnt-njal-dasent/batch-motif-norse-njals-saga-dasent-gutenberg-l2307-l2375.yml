canonical_text:
  quote: '"this match will bring luck neither to him nor to her"'
  summary: Hallgerda learns that Hauskuld has arranged her marriage without consulting
    her and objects. Hauskuld asserts his authority. Hallgerda confides in her foster-father
    Thiostolf, who predicts a second marriage and promises to support her wishes within
    limits. Preparations and invitations for the bridal feast follow. Hrut warns that
    the match will be unlucky. Hallgerda invites her wizard maternal uncle Swan through
    Thiostolf. At the feast, Hallgerda sits on the cross-bench, Thiostolf speaks with
    her and Swan, and Hauskuld pays her portion while Hrut cautions against further
    gifts.
