canonical_text:
  quote: '"Thou must be a ''fey'' man," says Njal, "and thou must have seen the fetch
    that follows thee."'
  summary: Sigmund and Skiolld arrive at Gunnar's house. Gunnar warns them against
    Hallgerda's incitement. Hallgerda presses for vengeance for Brynjolf and conspires
    with Sigmund, Skiolld, and Thrain to kill Thord. Thord sees a blood-covered goat
    that Njal identifies as his fetch and a sign that he is fey. Njal and Bergthora
    try to direct Thord's movements while the conspirators time their plot around
    the Thing.
  language: English
  quote_policy: quoted
