canonical_text:
  quote: ''
  summary: Kari is unable to sleep at night. Asgrim wakes and asks whether he cannot
    sleep. Kari answers with a verse saying that the memory or bidding of murdered
    companions keeps him awake, and that men burned Njal, his house, and his household
    the previous autumn. The prose adds that Kari often spoke of Njal, Skarphedinn,
    Bergthora, and Helgi, but did not abuse or threaten his foes.
