canonical_text:
  quote: ''
  summary: In a preface dated Christmas Eve 1860 at Broad Sanctuary, the translator
    explains his practice of rendering saga place names, surnames, and nicknames into
    English. He describes how Icelandic nicknames could arise from events, traits,
    or circumstances and serve as lifelong distinguishing marks, compares this function
    to identifying initials, and explains retained archaic words such as “busk,” “boun,”
    and “redes.”
  language: English
  quote_policy: summarized
