  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a society where many men bore the same name, circumstances, events, bodily
    features, or traits of temper and mind could give rise to a surname or nickname
    that remained with a man through life.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage compares the Icelandic nickname’s identifying function to United
