canonical_text:
  quote: ''
  summary: Gunnar sails north with companions, goods, and ships; is welcomed by King
    Harold Gorm's son in Denmark; proves unmatched in feats of strength; declines
    an offer of marriage and power until he can return to Iceland; exchanges gifts
    with the king; returns ships and lading to Oliver; visits Earl Hacon, receives
    winter hospitality and a gold ring, and becomes interested in Bergliota, the Earl's
    kinswoman.
  language: English
  quote_policy: summarized
