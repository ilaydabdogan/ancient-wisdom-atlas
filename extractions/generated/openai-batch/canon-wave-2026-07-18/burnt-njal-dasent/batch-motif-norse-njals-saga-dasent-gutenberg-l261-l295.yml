canonical_text:
  quote: ''
  summary: The passage says that Iceland's conversion to Christianity brought writing
    and writing materials around the year 1000; earlier runic writing is described
    as limited to inscriptions and short legends on objects. It states that sagas
    passed from oral to written form before 1200, presents Njal/Njala as especially
    notable among them, and assigns 1200 as the latest date for its present shape.
    It then uses a fosterage metaphor for the translator's care of the work and hopes
    the translated work will win new fame for Iceland's ancient worthies.
  language: English
  quote_policy: summarized
