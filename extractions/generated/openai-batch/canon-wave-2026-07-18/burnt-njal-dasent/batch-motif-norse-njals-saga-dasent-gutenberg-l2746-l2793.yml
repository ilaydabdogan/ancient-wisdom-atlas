canonical_text:
  quote: ''
  summary: Glum's wedding party gathers at Hauskuldstede, where Hallgerda sits on
    the dais and Thiostolf moves about with a raised axe, but the feast proceeds well.
    Hallgerda goes south with Glum, refuses housekeeping when asked, and later settles
    at Varmalek after Thorarin and Glum divide their residences and common property.
    Hallgerda gives birth to a daughter named Thorgerda, who is sprinkled with water
    at naming. News then comes that Swan and his men were lost after a storm while
    fishing; some fishermen report seeing Swan enter the fell at Kalbackshorn and
    be greeted there, though others reject the report, and he is never seen again
    alive or dead. Hallgerda regards Swan's loss as great, and Glum later asks Thorarin
    to exchange lands, which Thorarin declines.
  language: English
  quote_policy: summarized
