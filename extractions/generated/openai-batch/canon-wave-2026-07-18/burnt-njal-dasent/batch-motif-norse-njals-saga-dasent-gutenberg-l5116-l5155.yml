canonical_text:
  quote: ''
  summary: At evening Njal hears an axe strike the panel, notices the household shields
    are missing, and learns from Bergthora that his sons have gone out with them.
    He follows and questions Skarphedinn, who gives ordinary explanations involving
    sheep and salmon, while Njal points out that they would not be armed for such
    errands. Skarphedinn's verse speaks of seeking in fight those who make mocking
    death-songs. After the sons depart, Njal tells Bergthora she must have urged them
    on, and Bergthora says she will thank them if they report Sigmund's slaying.
  language: English
  quote_policy: summarized
