canonical_text:
  quote: ''
  summary: 'Atli Arnvid''s son, an outlaw in the Sound, confronts Hrut''s ships. A
    naval battle follows: Asolf kills several men before Hrut kills him, Wolf is killed
    by Atli, and Hrut kills Atli after Atli loses his sword. Hrut''s party takes goods
    and ships. Separately, Soti is betrayed to Gunnhillda by Augmund and hanged by
    Gudred; his goods go to Gunnhillda. Hrut later returns with goods and shares them
    with the king and Gunnhillda.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atli, son of Arnvid, had withheld taxes, fled from Jemtland to Gothland, lay
    out in Öresound, and was an outlaw of both the Dane-King and the Swede-King.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hrut continued south into the Sound with his ships; he said that his ship
    and Auzur's should go first, while Wolf placed his galley beside Hrut's ship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Atli learned that ships were approaching, he said there might be gain
    and ordered his own ship to be in the middle of the fleet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Atli hailed the approaching ships, asked the chief's name, learned it was
    Hrut, and heard that Hrut was one of King Harold Grayfell's bodyguard.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Atli declared that Hrut would not live to tell of the meeting, then hurled
    a spear at Hrut's ship and killed the man standing before it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Asolf boarded Hrut's ship and killed four men before Hrut turned against him
    and killed him with one blow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wolf remarked on Hrut's blows and Gunnhillda; Hrut answered that Wolf spoke
    with a fey mouth, and Atli soon killed Wolf with a spear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Atli boarded Hrut's ship, Auzur fell after another man thrust at him, Atli
    split Hrut's shield, a stone struck Atli's hand so that his sword fell, and Hrut
    took the sword and killed Atli.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After Atli's death, Hrut's side took much goods and brought away the two best
    ships, while Soti and his crew had already sailed past toward Norway.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Soti told Augmund that he would stay three nights, then go west to England
    and never return to Norway while Gunnhillda ruled there.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Augmund reported Soti's plan to Gunnhillda; Gunnhillda asked Gudred to take
    Soti's life, and Gudred came upon Soti unawares, had him hanged, and brought the
    goods to Gunnhillda.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Hrut returned in autumn with many goods, offered them to the king, gave the
    king a third, heard from Gunnhillda about Soti's death and the inheritance, and
    gave Gunnhillda half of all he had.
  category: action
  evidence_refs:
  - ev:12
