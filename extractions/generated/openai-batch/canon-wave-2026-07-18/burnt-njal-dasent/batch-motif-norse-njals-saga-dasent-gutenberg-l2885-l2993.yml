canonical_text:
  quote: ''
  summary: During a sheep hunt near Crossfell, Glum and Thiostolf are left alone,
    quarrel, and fight with axes. Thiostolf kills Glum, covers the body with stones,
    takes a gold ring, and tells Hallgerda, who sends him to Hrut. Hrut hears Thiostolf's
    confession, says Hallgerda has no part in the deed, and kills Thiostolf. Hrut's
    men cover Thiostolf's body with stones. Hrut reports the slayings to Hauskuld.
    Thorarin, Glum's brother, later asks for atonement, and gifts are given to him.
  language: English
  quote_policy: summarized
