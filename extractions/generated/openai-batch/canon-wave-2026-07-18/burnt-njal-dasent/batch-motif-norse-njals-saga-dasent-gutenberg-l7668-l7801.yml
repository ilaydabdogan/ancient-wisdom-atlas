canonical_text:
  quote: ''
  summary: Several men arrange overseas voyages. Njal warns his sons that their voyage
    will be dangerous and may lead to later quarrels. Gunnar sets out with Kolskegg,
    but after his horse stumbles he looks back toward Lithend, praises the home landscape,
    and decides not to go abroad. Kolskegg warns him that this breaks the atonement
    and then departs alone. Gunnar later remains at home, is declared outlaw at the
    Thing, and a group of foes agrees to attack him. Hjalti refuses to join because
    of a promise to Gunnar. Njal warns Gunnar and offers his sons as defenders, but
    Gunnar refuses and asks Njal to look after Hogni.
  language: English
  quote_policy: summarized
