canonical_text:
  quote: ''
  summary: In a formal Althing lawsuit, Mord declares procedural steps and calls on
    the defence to challenge the inquest. Eyjolf challenges two inquest members first
    for kinship and gossipry, then for being lodgers rather than householders. Public
    judgment shifts as each side seems to gain advantage. Asgrim repeatedly sends
    a messenger to Thorhall, who gives step-by-step legal advice for overturning Eyjolf's
    challenges.
  language: English
  quote_policy: summarized
