canonical_text:
  quote: ''
  summary: The preface defines saga as prose storytelling sometimes mixed with verse,
    distinguishes mythical, royal, and Icelandic family sagas, and argues for the
    truthfulness of Njala through oral transmission, public memory, and corroboration
    from other sagas, songs, and annals. It also treats supernatural elements such
    as ghosts, dreams, omens, witchcraft, and foresight as features of eleventh-century
    popular belief and therefore as marks of historical genuineness rather than disproof.
  language: English
  quote_policy: summarized
