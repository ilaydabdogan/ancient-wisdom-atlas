  quote: ''
  summary: The passage reports a change of ruler and faith in Norway, Olaf Tryggvason's
    Christianizing activity, Njal's favorable response to the new faith, Thangbrand's
    missionary arrival in Iceland, local resistance, Hall of the Side's hospitality,
    a mass for Michael the archangel, Thangbrand's explanation that Michael weighs
    good deeds, and Hall's baptism with his household after receiving a promise that
    Michael will be his guardian angel.
