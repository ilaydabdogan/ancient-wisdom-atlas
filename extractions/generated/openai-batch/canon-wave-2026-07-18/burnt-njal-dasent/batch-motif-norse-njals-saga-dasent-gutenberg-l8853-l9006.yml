canonical_text:
  quote: ''
  summary: Killing-Hrapp enters a shrine associated with Earl Hacon and Gudbrand,
    removes ornaments from Thorgerda Shrinebride, Thor's car, and Irpa, drags the
    shrine figures out, and burns the shrine. He kills or wounds men who attack him,
    evades Earl Hacon's search, seeks refuge from Njal's sons, and is refused by Helgi.
    Thrain takes Hrapp under his safeguard, hides him in lashed casks lowered overboard,
    and the Earl later questions others without finding him.
  language: English
  quote_policy: summarized
