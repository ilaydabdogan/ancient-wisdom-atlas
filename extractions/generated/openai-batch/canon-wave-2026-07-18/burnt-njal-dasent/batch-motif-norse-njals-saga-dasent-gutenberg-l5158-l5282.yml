canonical_text:
  quote: ''
  summary: Njal's sons encounter Sigmund and Skiolld near the stud-horses. Skarphedinn
    assigns the attack, excludes Hauskuld, fights Sigmund, and kills him; Grim and
    Helgi kill Skiolld. Skarphedinn cuts off Sigmund's head and tries to send it to
    Hallgerda as a taunting proof connected with Sigmund's mocking verses. Hallgerda
    tries to urge Gunnar toward vengeance, but Gunnar does not pursue the case. Later
    Gunnar receives counsel from Njal, and Njal raises the unresolved killing. Gunnar
    makes an award of compensation for Sigmund but none for Skiolld; a public settlement
    forbids repeating Sigmund's insulting verses, and Gunnar and Njal pledge to settle
    such matters between themselves.
  language: English
  quote_policy: summarized
