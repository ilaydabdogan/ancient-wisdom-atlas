canonical_text:
  quote: "“this is such good law in all points, that there is not a word to say against
    it”"
  summary: In court, Mord counters Eyjolf's challenge to the inquest, public opinion
    first favors the prosecution, then the defense after Eyjolf identifies a summons
    flaw. Asgrim invokes Thorhall's legal training under Njal; Thorhall supplies a
    procedural remedy, Mord performs it by witness and oath, and Skapti confirms that
    the point is good law. Mord then formally bids the inquest to utter its finding.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Mord goes to the court, takes witness, and declares Eyjolf Bolverk's son's
    challenge void because the challenged men have a lawful right to be on the neighbour
    inquest under land or dairy-stock qualifications.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mord brings his witness before the court, goes to the neighbours on the inquest,
    and tells them to sit because they are rightfully among the inquest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Mord's first legal move, there is a great shout and cry, and people
    say Flosi's and Eyjolf's cause is much shaken and that the prosecution is better
    than the defence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Flosi asks Eyjolf whether Mord's point can be law; Eyjolf says he does not
    know for certain, and Skapti, the Speaker of the Law, sends word that it is surely
    good law though few know it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sons of Sigfus say four of the summoned neighbours were wrongly summoned
    because nearer neighbours to the spot are at home.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Eyjolf takes witness, challenges the four men out of the inquest with lawful
    form, and tells the remaining neighbours to state a bar: only five have been summoned
    to utter the finding, though there ought to be nine.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Eyjolf's challenge, the narrative says Flosi and Eyjolf are boastful,
    and a public cry says the suit for the Burning is quashed and the defence is again
    better than the prosecution.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Asgrim says the opponents do not yet know what to boast of before Thorhall
    is seen, and reports that Njal taught Thorhall law so that he would become the
    best lawyer in Iceland when tested.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Thorhall tells the messenger that Mord should take witness and swear an oath
    that the greater part of the inquest is rightly summoned; he says this will set
    the prosecution on its feet again, though Mord must pay fines for wrongly summoned
    men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mord goes to court, takes witness, swears the oath that the greater part of
    the inquest was rightly summoned, and says he has set the prosecution on its feet
    again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A great roar praises Mord's handling of the suit, and it is said that Flosi
    and his men have turned only to quibbling and wrong.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Flosi and Eyjolf again seek confirmation from the Lawman; Skapti says Mord's
    point is good law in all respects and says he thought only he and the now-dead
    Njal knew it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mord takes witness and lawfully bids the neighbours on his inquest in the
    suit against Flosi to utter their finding before the court; one neighbour utters
    it, and all confirm it by consent.
  category: action
  evidence_refs:
  - ev:8
