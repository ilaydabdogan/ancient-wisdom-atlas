canonical_text:
  quote: ''
  summary: 'After Gunnar''s death, Njal says a manslaughter suit cannot be brought
    because Gunnar had been outlawed, but he suggests vengeance. Gunnar is placed
    upright in a cairn, and Rannveig reserves his bill for whoever will avenge him.
    A neat-herd and serving-maid report hearing Gunnar merry and singing in the cairn.
    Later, Skarphedinn and Hogni see the cairn open at night: Gunnar turns toward
    the moon, four shadowless lights burn inside, and Gunnar sings of dying rather
    than yielding. The cairn shuts again, and Skarphedinn and Hogni discuss the tokens
    as guidance for action.'
  language: English
  quote_policy: summarized
