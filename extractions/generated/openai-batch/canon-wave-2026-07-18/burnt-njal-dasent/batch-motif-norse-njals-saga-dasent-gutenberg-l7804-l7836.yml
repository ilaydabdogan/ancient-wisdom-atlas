canonical_text:
  quote: ''
  summary: Mord reports that Gunnar will be alone at Lithend while his people are
    away. Gizur, Geir, Starkad, and others gather to plan an attack. Mord advises
    that they must first force the neighboring farmer Thorkell to handle Gunnar's
    hound Sam. The attackers seize and bind Thorkell, threaten him with death, and
    bring him to Lithend. Thorkell lures the hound away, but the hound detects the
    hidden men, attacks Thorkell, and is then killed by Aunund with an axe.
  language: English
