canonical_text:
  quote: ''
  summary: Flosi and the men who had taken part in the Burning ride toward Asgrim's
    home, intending to breakfast there and humble him. Asgrim recognizes them, prepares
    the hall and food, but gives no greeting. The armed guests eat while Asgrim remains
    silent and angry. After the meal, Asgrim attacks Flosi with a pole-axe, but Glum
    stops the blow and others seize Asgrim. Flosi forbids anyone to harm Asgrim, saying
    the provocation was too severe and Asgrim acted as he ought. The parties agree
    to resume their quarrel at the Thing. Later, Hall of the Side criticizes Flosi's
    conduct as excessive, and the party rides in array to the Thing.
  language: English
  quote_policy: summarized
