canonical_text:
  quote: ''
  summary: Njal discusses the planned journey to Tongue and the Thing with Skarphedinn
    and declares that he will not be separated from the suit. Thorhall, Njal's foster-son,
    speaks of pursuing a blood-feud for his foster father. Njal's party rides from
    home, gathers kinsmen and helpers, meets Hjallti, and goes to Asgrim at Tongue.
    Asgrim receives Njal honorably, prevents Hjallti from leaving, and promises to
    support Njal's cause. Asgrim's band gathers, and the enlarged party rides to the
    Thingfield and sets up booths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Njal asks Skarphedinn what plan he, his brothers, and Kari have made; Skarphedinn
    says they will ride to Tongue to Asgrim and then to the Thing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Njal says he will ride to the Thing because his honor requires that he not
    be separated from their suit while he lives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thorhall Asgrim's son is described as Njal's foster-son, wearing a russet
    coat, and saying he will throw it off when he follows up the blood-feud for his
    foster father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party prepares to ride away from home with nearly thirty men, and Njal's
    kinsmen Thorleif crow and Thorgrim the big offer help and following to Njal's
    sons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The group crosses Thursowater, rests on Laxwater bank, baits the horses, and
    meets Hjallti Skeggi's son there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hjallti says Njal has asked him for help, that he has given his word to aid
    him, and that Njal has given him and others cunning counsel.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hjallti reports Flosi's doings to Njal; Thorhall is sent to Tongue to tell
    Asgrim the party will arrive that evening, and Asgrim makes ready to meet them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Njal arrives wearing a blue cape and felt hat and carrying a small axe; Asgrim
    helps him down from his horse and seats him in Asgrim's own seat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Hjallti wishes to ride away because he thinks there are too many people
    there, Asgrim catches his reins, has the horses unsaddled, and seats Hjallti beside
    Njal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Asgrim asks Njal what his heart says about their matter, and Njal answers
    heavily that he fears they will have no lucky men in the suit; he asks Asgrim
    to gather his Thing-men and ride with him to the Althing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Asgrim promises that he will never leave Njal's cause while he can get men
    to follow him, and those in the house thank him and call the speech brave.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The party stays overnight; Asgrim's band arrives the next day, and afterward
    all ride together to the Thingfield and set up booths.
  category: sequence
  evidence_refs:
  - ev:8
