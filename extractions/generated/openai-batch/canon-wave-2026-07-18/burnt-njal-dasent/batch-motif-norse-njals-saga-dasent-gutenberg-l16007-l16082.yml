canonical_text:
  quote: ''
  summary: After an atonement involving Thorgeir Craggeir, Kari refuses to remain
    with him, entrusts his family property to Thorgeir, and rides away with horses,
    weapons, clothing, and money. He travels to Bjorn the white's farm in Thorsmark,
    asks Bjorn for lodging and companionship in his journeys, hears Bjorn boast and
    Bjorn's wife Valgerda warn against relying on him, and then stays there in hiding
    while a false report of his route is spread.
  language: English
  quote_policy: summarized
