canonical_text:
  quote: ''
  summary: Flosi leaves home with his men and travels among households asking supporters
    to ride to the Thing for his quarrel after the Burning. Some agree because of
    kinship, friendship, obligation, gifts, or payment; Saurli withholds support pending
    Gudmund the powerful's position. Yngvillda reports a troubling dream of her son
    Thorwalld in tight red clothing and bad shoethongs, but her sons dismiss it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Flosi and his company prepare to leave home; Flosi wears long-hose because
    he intends to walk and wants walking to seem less hard to the others.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party travels through named places including Knappvale, Broadwater, Calffell,
    Hornfirth, Staffell in Lon, and Thvattwater to Hall of the Side.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Flosi asks Hall to ride to the Thing with all his Thingmen; Hall says he is
    bound to help Flosi and gives him counsel.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hall counsels Flosi to go north to Weaponfirth and ask all the chiefs for
    aid, saying Flosi will need it before the Thing is over.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Hallbjorn's, Flosi offers a purse of money and asks Hallbjorn to ride to
    the Thing and stand by him; Hallbjorn accepts and promises support as if for a
    brother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hrafnkell resists for a while but promises that his son Thorir will ride with
    their Thingmen; Holmstein receives Flosi and says he has long been in Flosi's
    debt for help.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Saurli says he cannot decide until he knows which side Gudmund the powerful
    will take; Flosi comments that a woman rules in the house and leaves without getting
    help there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Thorkel the allwise and Thorwalld put Flosi off until he gives each of them
    three marks of silver; then they agree to stand by him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Yngvillda weeps and recounts a dream in which Thorwalld wears a tight red
    kirtle, red hose, and bad shoethongs and appears uncomfortable; the brothers laugh
    and dismiss her words.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bjarni takes Flosi by both hands, refuses to sell his help for bribes, and
    promises to ride to the Thing and stand by him for friendship's sake.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Thorkel Geiti's son says it is his duty to stand by Flosi and gives him gifts;
    later Holmstein gives gifts and notes that all have backed Flosi except Saurli.
  category: action
  evidence_refs:
  - ev:9
