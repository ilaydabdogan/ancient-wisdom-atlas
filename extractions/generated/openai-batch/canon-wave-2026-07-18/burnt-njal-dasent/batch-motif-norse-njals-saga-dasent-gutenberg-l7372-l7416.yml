canonical_text:
  quote: ''
  summary: Mord and the two namesakes discuss their losses and ask for a new plot
    against Gunnar. Mord advises that Thorgeir Otkell's son should beguile Ormilda,
    Gunnar's kinswoman, and that the resulting displeasure can be used against Gunnar.
    Mord also advises that Gunnar should not be attacked at home while the hound lives.
    Thorgeir approaches Ormilda, enmity grows, and secret meetings continue. Mord
    and Thorgeir of the Threecorner plan an ambush when Gunnar rides to the isles.
    A messenger summons attackers, who gather and decide to wait by Rangriver. Gunnar
    returns with Kolskegg, both armed.
  language: English
  quote_policy: summarized
