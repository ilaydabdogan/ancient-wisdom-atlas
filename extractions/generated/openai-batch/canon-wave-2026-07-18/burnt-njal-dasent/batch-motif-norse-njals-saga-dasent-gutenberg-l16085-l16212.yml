canonical_text:
  quote: ''
  summary: Flosi urges the Burners to prepare for going abroad, fines, and atonement.
    He arranges to buy a ship from Eyjolf by transferring land, helping Eyjolf's marriage
    bargain, and organizing supplies. The sons of Sigfus plan a journey to Fleetlithe,
    and Flosi warns them to travel together, remember a hidden dream, and beware of
    Kari. Kettle responds that human life is foredoomed. The party departs after a
    farewell. Bjorn of the Mark meets them, gives information about Kari, learns when
    they will return, and later reports their plans to Kari, who praises Bjorn's faithfulness.
  language: English
  quote_policy: summarized
