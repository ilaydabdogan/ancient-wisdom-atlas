canonical_text:
  quote: ''
  summary: Earl Hacon, angered by Thrain's escape, pursues Njal's sons with ships
    despite Sweyn's objection. Njal's sons defend themselves, refuse to abandon Helgi,
    kill two of the Earl's men, and are captured. Grim frees himself and Helgi at
    night by cutting his bonds on an axe edge, and they escape to Kari. Kari refuses
    to surrender them; Eric proposes amends and protection, which Helgi accepts from
    Eric rather than from Hacon. Kari later sails west and winters with Earl Sigurd.
  language: English
  quote_policy: summarized
