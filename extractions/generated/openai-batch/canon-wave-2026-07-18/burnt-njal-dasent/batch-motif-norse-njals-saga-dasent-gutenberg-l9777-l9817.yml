canonical_text:
  quote: ''
  summary: Kettle, brother of the slain Thrain and husband of Njal's daughter Thorgerda,
    asks Njal about atonement for Thrain's slaying. Njal agrees to atone, arbitration
    sets blood-money and binding peace pledges, and Njal pays. Later Kettle seeks
    to take Hauskuld, Thrain's son, as foster-child; Thorgerda agrees on conditions
    of sworn support, vengeance if Hauskuld is slain, and dower money. Hauskuld goes
    home with Kettle.
  language: English
  quote_policy: summarized
