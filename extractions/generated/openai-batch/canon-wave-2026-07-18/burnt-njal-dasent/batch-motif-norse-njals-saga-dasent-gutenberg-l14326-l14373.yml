canonical_text:
  quote: ''
  summary: Asgrim and his companions visit Gudmund the powerful in his booth and ask
    for steadfast help. After hearing that they have already approached Skapti and
    Snorri, Gudmund admits earlier stubbornness and pledges to go with them to court
    with his Thingmen, support them, fight if needed, and risk his life for them.
    He also plans to draw Thorstein gapemouth, Skapti's son and Jodisa's husband,
    onto their side. Gudmund counsels them privately not to seek further chiefs, to
    rely on their present force, to attend legal business armed, but not to fight
    as matters stand.
  language: English
  quote_policy: summarized
