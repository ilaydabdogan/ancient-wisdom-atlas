canonical_text:
  quote: ''
  summary: The passage describes tenth-century Icelandic homestead and hall architecture,
    including the main dwelling, outbuildings, doors, porches, side aisles, hearths,
    seating, sleeping areas, dais, decorative hangings and carvings, weapons on the
    walls, and structural features relevant to saga episodes of feasting, honour,
    defence, attack, and escape.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tenth-century Icelandic homesteads are described as having one main building
    for living and sleeping, with outbuildings for offices and farm-buildings opening
    onto a yard.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Outbuildings could stand apart from the main building and could be regarded
    as separate houses for defensive purposes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The main building is called the stofa; in the houses of chiefs and great men
    it could be a larger skáli or hall, also called eldhús or eldáskáli because of
    the fires in it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hall had a men's or main door and a women's or lesser door, each opening
    into its own porch.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hall interior is described as having a nave and two low side aisles, with
    stone aisle walls and a higher timber nave supported by rows of pillars.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A fallen cross-beam from a burning roof is described as enabling Kari to reach
    a side wall and leap out, while Skarphedinn could not follow when the burnt beam
    broke under him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hall had wainscot fittings, shut-off sleeping places for heads of the
    family, other beds for the household, sleeping space for women servants behind
    the dais, and sometimes upper chambers or lofts.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hall proper had long central hearths, louvres above for smoke, benches
    along the sides, high seats in halls of great men, and tables brought in and removed
    around meals.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: For feasts or many guests, lower stools could be brought in, and lower-ranking
    men sat on them nearest the fire outside the tables.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A raised platform or dais stood at the end of the hall opposite the door,
    and women are described as eating there at weddings.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: In later times the seat of honour shifted from the upper bench to the dais;
    the passage says this sometimes occurred with kings and earls.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Hildigunna sets up a high seat on the dais for Flosi, and Flosi spurns it
    while saying he is neither king nor earl.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Asgrim moves to the dais during Flosi's visit, and the passage infers Flosi's
    position in relation to the dais from Asgrim's ability to aim a pole-axe blow
    at him from the platform rail.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: On high days and feast days, part of the hall could be hung with valuable
    tapestry, with carvings over the hangings along the wainscot.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: Thorkel Foulmouth is said to have carvings on the stool before his high seat
    and over his shut bed in memory of deeds performed abroad.
  category: object
  evidence_refs:
  - ev:13
- id: obs:16
  text: Shields and weapons were hung against the wainscot in various parts of the
    hall.
  category: object
  evidence_refs:
  - ev:14
- id: obs:17
  text: The sound of Skarphedinn's axe against the wainscot wakes Njal and brings
    him out of his shut bed when his sons go after Sigmund the white and Skiolld.
  category: action
  evidence_refs:
  - ev:15
- id: obs:18
  text: The passage describes high gables with carved projections and says that ropes
    twisted around the timber ends would tear the whole roof off the house.
  category: object
  evidence_refs:
  - ev:16
- id: obs:19
  text: Gunnar's foes are described as mounting the side-roofs and attacking him in
    his sleeping loft after his bowstring had been cut.
  category: action
  evidence_refs:
  - ev:17
