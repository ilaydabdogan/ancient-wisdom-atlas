canonical_text:
  quote: ''
  summary: Kolskegg travels from Norway to Denmark and enters the service of Sweyn
    Forkbeard. He dreams that a bright, glistening man summons him, promises him a
    bride, and says Kolskegg will be his knight. A wizard interprets the dream as
    a sign that Kolskegg should go to southern lands and become God's knight. Kolskegg
    is baptised in Denmark, then travels through Russia to Micklegarth, serves the
    Emperor, marries there, becomes captain over the Varangians, and remains until
    his death.
  language: English
  quote_policy: summarized
