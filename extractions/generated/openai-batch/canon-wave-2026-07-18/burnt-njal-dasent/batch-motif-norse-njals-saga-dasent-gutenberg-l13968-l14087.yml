canonical_text:
  quote: ''
  summary: Eyjolf Bolverk's son is introduced as a high-ranking, handsome, strong,
    money-greedy, highly skilled lawyer. Flosi consults Bjarni about how to meet the
    legal suit arising from the Burning. Bjarni advises seeking help, possibly offering
    atonement, or defending the suit at law, and warns that the defender in the Burning
    suit will be doomed. Flosi and Bjarni solicit support from several groups, sometimes
    with money and persuasion. They then meet Eyjolf, marked by fine clothing and
    weaponry, and privately ask for his help, praising his birth, descent from Ragnar
    hairybreeks, family record in lawsuits, and likely luck in winning suits.
  language: English
  quote_policy: summarized
