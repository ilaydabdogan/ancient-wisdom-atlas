  summary: Travelers ride across Thurso water to Tongue, where Asgrim welcomes them.
    Njal negotiates for Thorhalla to marry his son Helgi; Asgrim agrees, terms are
    set, and a bridal day and feast follow. Njal then offers to foster Asgrim's son
    Thorhall, teaches him law, and Thorhall becomes renowned as the greatest lawyer
    in Iceland in those days.
