canonical_text:
  quote: ''
  summary: Twelve judges arbitrate the atonement for Hauskuld. Snorri rejects outlawry
    and proposes a very large money fine of six hundred in silver, to be paid at the
    Thing with contributions from the judges and the public. The money is assembled,
    and Njal adds a silken scarf and boots. When the parties meet to exchange peace
    pledges, Flosi uses the scarf to insult Njal; Skarphedinn answers with a counter-insult
    and throws blue breeches to Flosi. Flosi then kicks away the money, refuses peace,
    and chooses either an unatoned death or vengeance.
  language: English
  quote_policy: summarized
