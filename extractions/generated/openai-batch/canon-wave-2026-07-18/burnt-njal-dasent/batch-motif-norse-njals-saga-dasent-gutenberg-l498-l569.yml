canonical_text:
  quote: ''
  summary: 'Dasent describes social principles attributed to early Northmen in Iceland:
    paternal power over children, newborn acceptance or exposure, fosterage ties,
    marriage as sale or barter, analogy between Odin''s supremacy and household patriarchy,
    war and duel as appeals to divine judgment, and brave death as leading to welcome
    by Valkyries in Valhalla.'
  language: English
  quote_policy: summarized
