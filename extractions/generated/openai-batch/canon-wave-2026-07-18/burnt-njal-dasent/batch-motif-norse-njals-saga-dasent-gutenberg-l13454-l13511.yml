canonical_text:
  quote: ''
  summary: 'Flosi is awakened from troubled sleep and tells Kettle of a dream: at
    Loom-nip the Nip opens and a goatskin-clad man with an iron staff emerges, calls
    many of Flosi''s men by name, identifies himself as Irongrim, says he will go
    to the Althing to challenge legal proceedings and clear a field for fighters,
    and sings of slaughter. He shouts, strikes his staff, returns into the fell, and
    leaves Flosi afraid. Kettle interprets those called as fey and urges secrecy.
    After Yule, Flosi tells his men they must leave home to seek help and submit to
    many before the quarrel ends.'
  language: English
  quote_policy: summarized
