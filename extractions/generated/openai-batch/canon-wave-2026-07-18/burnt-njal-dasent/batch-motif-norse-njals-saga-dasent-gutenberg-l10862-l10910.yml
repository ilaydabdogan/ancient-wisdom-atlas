canonical_text:
  quote: ''
  summary: Valgard the guileful returns to Iceland still heathen, stays with his son
    Mord, learns that political and legal changes have weakened Mord's position, and
    advises him to use gifts and tale-bearing to make Njal's sons kill Hauskuld so
    that later blood-feuds will destroy them. Mord asks Valgard to adopt the new faith;
    Valgard refuses, urges Mord to abandon it, breaks crosses and holy tokens, then
    soon falls sick, dies, and is laid in a cairn by Hof.
