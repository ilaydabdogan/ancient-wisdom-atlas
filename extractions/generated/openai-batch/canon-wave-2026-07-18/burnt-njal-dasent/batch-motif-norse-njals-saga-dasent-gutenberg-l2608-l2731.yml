  quote: ''
  summary: Glum, one of three wealthy brothers, considers ending trading voyages and
    seeks to woo Hallgerda, Hauskuld's daughter, despite warnings about her earlier
    marriage. Thorarin, Glum, and companions travel to Hauskuldstede, where Hauskuld
    and Hrut discuss how to answer the proposal. Hrut advises full disclosure, restrictions
    on Thiostolf, and Hallgerda's informed consent. Hallgerda enters, hears the terms,
    and accepts the bargain as settled by Hauskuld and Hrut.
  language: English
