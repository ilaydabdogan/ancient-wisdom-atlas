canonical_text:
  quote: ''
  summary: Njal expresses foreboding that the suit will weigh heavily on his side.
    Skarphedinn answers that the laws cannot be used to pursue them, but Njal says
    something worse will happen. Men who had contributed money discuss taking it back,
    but Gudmund refuses the shame of reclaiming a gift. Snorri advises that Gizur
    and Hjallti hold the money until the next Althing because he foresees a need for
    it. Hjallti and Gizur divide the money for safekeeping, and the men return to
    their booths.
