  quote: all this atonement was made and hands were shaken on it
  summary: At the Thing, Gunnar consults allies about a lawsuit involving Otkell.
    Hrut proposes legal pressure through challenges to combat. Gizur learns that Skamkell
    falsely attributed counsel to him and Geir. Gizur offers Gunnar the right to make
    his own award; oaths are taken, Gunnar states compensation terms, refuses friendship
    with Otkell, and the settlement is sealed by handshakes.
  language: English
