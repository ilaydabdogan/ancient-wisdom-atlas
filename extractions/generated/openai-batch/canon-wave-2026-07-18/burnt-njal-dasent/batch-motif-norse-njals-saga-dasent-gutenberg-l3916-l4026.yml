canonical_text:
  quote: ''
  summary: Gunnar arrives at the Thing, meets Hallgerda, and discusses marriage with
    her. He then asks Hauskuld and Hrut about marrying her, receives warnings about
    the match and Hallgerda's reputation and temper, but the bargain is made and Hallgerda
    is betrothed. Njal later warns Gunnar that the marriage will bring trouble and
    threaten their friendship, though he agrees to attend the wedding.
  language: English
  quote_policy: summarized
