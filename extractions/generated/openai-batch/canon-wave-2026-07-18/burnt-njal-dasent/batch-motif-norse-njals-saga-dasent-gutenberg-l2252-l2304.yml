canonical_text:
  quote: ''
  summary: Hallgerda, Hauskuld's daughter, is introduced as beautiful, tall, fair-haired,
    lavish, and hard-hearted, with a violent foster-father named Thiostolf. Thorwald,
    a wealthy but hasty man, seeks a wife. His father Oswif suggests Hallgerda but
    warns that her will and Thorwald's stern temper make the match unsuitable. Thorwald
    insists. At Hauskuldstede, Hauskuld warns honestly about Hallgerda's hard temper,
    but Thorwald proceeds. The marriage terms are negotiated, Hauskuld does not ask
    Hallgerda's opinion, and Thorwald becomes betrothed to her.
  language: English
