canonical_text:
  quote: ''
  summary: Hauskuld urges his brother Hrut to seek a wife at the Althing and proposes
    Unna, daughter and heir of Fiddle Mord. Hauskuld and Hrut negotiate with Mord,
    who sets financial terms and betroths Unna to Hrut with witnesses and a handshake.
    News then arrives from Norway that Hrut's brother Eyvind has died and left Hrut
    an inheritance that may be seized unless he claims it. Hrut and Mord alter the
    marriage agreement so Unna will wait three years while Hrut sails overseas to
    pursue the inheritance.
  language: English
  quote_policy: summarized
