canonical_text:
  quote: ''
  summary: Gunnar grows drowsy while riding east, sleeps, and recounts a dream in
    which wolves attack him and his companions near Knafahills and Rangriver. In the
    dream Gunnar and Kolskegg kill many wolves, while Hjort is pulled down. Gunnar
    warns Hjort to return, but Hjort refuses. The party then sees armed men by Knafahills,
    and Gunnar says his dream comes true before choosing a defensive position by Rangriver.
  language: English
  quote_policy: summarized
