canonical_text:
  quote: ''
  summary: At the Thing, Gunnar and his allies pursue lawsuits arising from earlier
    violence. Mord challenges Gunnar's legal standing, and Njal answers each objection
    with legal reasoning. Hjallti persuades the parties to submit the whole dispute
    to the award of good men. The settlement exchanges peace pledges, offsets claims,
    and imposes fines. Njal supplies Gunnar with money to pay, and Gunnar gains honor
    while his adversaries remain envious.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gunnar, the sons of Sigfus, and Njal's sons move together in one close and
    swift band, and the lawsuits are widely discussed at the Thing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gunnar meets Olaf and his cousins, recounts the fight and subsequent steps,
    and asks them for help, which they say is due to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Olaf remarks that Njal stands closely by Gunnar in counsel, and Gunnar says
    he cannot repay this help.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The suits on both sides come before the court, and each side pleads its cause.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mord questions whether Gunnar has the right to bring suit after making himself
    an outlaw by striking Thorgeir, and Njal answers that Gunnar's right to lawful
    deeds was restored after he offered full atonement.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mord questions Gunnar's assigning Hjort's slaying to Kol when Mord says the
    Easterling slew him, and Njal answers that the assignment was lawful because Kol
    was chosen as slayer before witnesses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mord questions why Gunnar summoned the opposing men as outlaws; Njal answers
    that they came to deal wounds and manslaughter, citing Hjort's death and Kolskegg's
    flesh wound.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hjallti asks Gunnar to lay the whole suit before the award and judgment of
    good men; Gunnar asks for Hjallti's future support, and Hjallti gives his word.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hjallti works with Gunnar's adversaries and brings about reconciliation, after
    which each side gives the other pledges of peace.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The settlement balances and offsets multiple claims, including wounds, slayings,
    lawsuits, onslaught, and half fines.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Njal, Asgrim, and Hjallti are named as participants in the award.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Njal gives Gunnar money he had out at interest with Starkad and at Sandgil
    so Gunnar can make up the fines.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Gunnar pays all the fines on the spot, gives gifts to many chiefs who helped
    him, gains great honor from the suit, and later rides home in peace while adversaries
    envy him.
  category: sequence
  evidence_refs:
  - ev:11
