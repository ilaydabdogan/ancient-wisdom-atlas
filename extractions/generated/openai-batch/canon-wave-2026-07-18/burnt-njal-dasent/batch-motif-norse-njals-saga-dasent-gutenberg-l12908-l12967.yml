canonical_text:
  quote: ''
  summary: During the burning of the hall, Flosi's side stops shooting and waits for
    the fire to overcome those inside. As beams fall, Skarphedinn believes his father
    is dead. Kari and Skarphedinn discuss escape; Skarphedinn insists Kari go first
    and says Kari will avenge him if he escapes. Kari uses a blazing bench and the
    smoke to escape through the roof, extinguishes himself in a stream, and rests
    in a hollow later called Kari's Hollow.
  language: English
  quote_policy: summarized
