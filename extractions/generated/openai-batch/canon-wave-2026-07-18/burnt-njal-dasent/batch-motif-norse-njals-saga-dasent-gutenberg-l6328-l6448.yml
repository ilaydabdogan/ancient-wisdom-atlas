canonical_text:
  quote: ''
  summary: The passage introduces Starkad, Egil, their kin groups, and armed Easterling
    guests. Starkad's side possesses a notable chestnut fighting horse. In a conversation
    about horse-fighting, Hildigunna names Gunnar as a man who would dare to match
    his brown horse against them. Starkad warns the challengers to try Gunnar last
    and not to trick him. They challenge Gunnar at Lithend; Gunnar accepts only on
    terms that the fight remain sport and not become a quarrel or an occasion for
    shame. The challengers report the encounter as if Gunnar had been fearful. Hildigunna
    counters that Gunnar is slow to quarrel but dangerous when forced. Gunnar then
    consults Njal, who says Gunnar will win the horse-fight but that many deaths and
    future feud consequences will arise from it.
  language: English
  quote_policy: summarized
