canonical_text:
  quote: ''
  summary: A legal strategy meeting considers a flaw in a suit because Mord, who first
    took up the case, is alleged to have taken part in Hauskuld's killing. Thorhall
    advises delaying disclosure so the opposing side cannot repair the summons. At
    the Thing, factions gather around the courts, armed parties remain at their booth,
    the sons of Sigfus plead the suit, and Thorhall formally protests that the inquest
    must not give a finding because Mord is under the ban of the law and the suit
    therefore fails.
  language: English
  quote_policy: summarized
