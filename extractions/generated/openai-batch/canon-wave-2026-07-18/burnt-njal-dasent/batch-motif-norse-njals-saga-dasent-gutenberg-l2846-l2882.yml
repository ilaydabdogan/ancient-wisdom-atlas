canonical_text:
  quote: ''
  summary: In autumn, Glum sends Thiostolf to search for missing sheep with house-carles.
    Thiostolf refuses because he considers the task beneath him unless Glum comes
    too. Glum later tells Hallgerda of the quarrel. Hallgerda defends Thiostolf, and
    Glum strikes her and leaves. Hallgerda weeps; Thiostolf approaches, but Hallgerda
    forbids him to avenge or interfere between her and Glum. Thiostolf leaves with
    a spiteful grin.
  language: English
