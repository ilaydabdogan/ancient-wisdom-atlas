canonical_text:
  quote: ''
  summary: At the opening of Chapter CXLI, both sides prepare armed for court and
    mark helmets with war-tokens. Thorhall advises Asgrim to proceed lawfully and
    asks for a treasured spear given by Skarphedinn. Asgrim summons allies and goes
    to the Eastfirthers' court, where Flosi and his supporters also arrive. Mord Valgard's
    son draws the first lot to declare his outlawry suit, makes procedural witness-statements,
    swears on the book before God to plead truthfully and lawfully, names witnesses,
    and states the assault and outlawry claims against Flosi for Helgi Njal's son's
    death. The supplied excerpt then repeats part of the legal formula after a garbled
    transition.
  language: English
