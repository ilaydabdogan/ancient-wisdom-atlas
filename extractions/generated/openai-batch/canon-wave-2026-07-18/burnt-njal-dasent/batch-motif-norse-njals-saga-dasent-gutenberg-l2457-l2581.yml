canonical_text:
  quote: ''
  summary: Thiostolf sinks the skiff carrying Thorwald's body, rows away, and returns
    to Hallgerda with a bloody axe. Hallgerda sends him north to Swan at Swanshol,
    where he is received. Hallgerda returns to her father. Oswif gathers men to pursue
    Thiostolf, but Swan uses a goatskin and spoken words to bring mist, fog, fright,
    wonder, and darkness against the pursuers, who repeatedly lose horses and weapons
    and fall into bogs or woods. Oswif turns back and seeks atonement from Hauskuld;
    Hrut agrees to make an award and takes Oswif's hand as a token that the suit will
    be dropped.
  language: English
  quote_policy: summarized
