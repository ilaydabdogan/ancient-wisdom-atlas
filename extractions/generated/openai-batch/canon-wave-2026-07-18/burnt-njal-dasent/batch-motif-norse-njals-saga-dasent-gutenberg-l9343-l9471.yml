canonical_text:
  quote: ''
  summary: Njal's sons press grievances against Thrain Sigfus' son. Njal advises delay,
    witnesses, and careful escalation rather than immediate violence. Kari is sent
    to speak with Thrain. Thrain's armed household and companions are described. Njal's
    sons and Kari ride to Gritwater, where Thrain's men arm themselves and stand in
    the porch. Hallgerda denies them welcome, Skarphedinn insults her, and Helgi asks
    Thrain for amends, which Thrain deflects.
  language: English
  quote_policy: summarized
