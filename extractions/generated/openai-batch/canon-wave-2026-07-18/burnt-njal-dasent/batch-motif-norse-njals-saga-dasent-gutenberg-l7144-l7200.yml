canonical_text:
  quote: ''
  summary: Thorgeir Starkad's son and his namesake form a close friendship after a
    secret meeting and a spear-gift. A land dispute involving Gunnar continues at
    the Thing. Kolskegg warns Gunnar that the namesakes may prove untrue, but Gunnar
    answers fatalistically. Gunnar later announces a haymaking schedule that will
    leave him at home with only the women. The namesakes then discuss grievances against
    Gunnar and agree to attack him with armed followers when he is alone.
  language: English
