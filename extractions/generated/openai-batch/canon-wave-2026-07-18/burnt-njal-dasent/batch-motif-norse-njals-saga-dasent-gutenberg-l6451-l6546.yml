canonical_text:
  quote: ''
  summary: 'The passage reports Hauskuld''s death and the birth and naming of a boy
    as Hauskuld. It then describes a public horse-fight attended by Gunnar, Njal,
    Starkad''s sons, and others. Gunnar refuses Skarphedinn''s offer to drive his
    horse, the horses fight, and Thorgeir and Kol try to make Gunnar fall. The attempt
    leads to violence: Kol and Thorgeir are struck down, Gunnar''s horse is maimed,
    and Kolskegg kills the horse at Gunnar''s command. Njal tries to make peace, but
    Thorgeir refuses. Later Gunnar warns Olaf the Peacock to travel carefully with
    many men.'
  language: English
  quote_policy: summarized
