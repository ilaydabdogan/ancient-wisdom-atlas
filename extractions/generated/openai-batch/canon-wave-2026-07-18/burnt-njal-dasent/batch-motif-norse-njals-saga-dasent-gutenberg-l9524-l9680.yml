canonical_text:
  quote: ''
  summary: Thrain Sigfus' son travels armed with companions after a quarrel with Njal's
    sons. Hosts urge reconciliation and caution, but Thrain rejects counsel. Gangrel
    women report Thrain's abusive talk and expected return to Bergthora, who informs
    her sons and Kari. Njal observes his sons and Kari going armed; Skarphedinn calls
    their errand a sheep hunt, which Njal connects to an earlier killing. The party
    waits at the Redslips, is spotted by gleaming shields, and runs to meet Thrain's
    larger company near the icy Markfleet. Skarphedinn is briefly delayed by a broken
    shoe-string, then raises his axe and runs toward the deep river.
  language: English
  quote_policy: summarized
