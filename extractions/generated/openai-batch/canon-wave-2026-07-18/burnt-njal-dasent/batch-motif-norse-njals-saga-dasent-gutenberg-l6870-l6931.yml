canonical_text:
  quote: ''
  summary: Steinvor persuades Thorgrim the Easterling to remain in Iceland by offering
    him her daughter Gudruna and her goods. Thorgrim recalls a prophecy that he will
    fall by Gunnar's hand if he stays. Gunnar seeks counsel from Njal after killing
    many men. Njal devises a legal strategy involving transferred suits, naming the
    dead as outlaws, and preparing responses for the Thing. Gunnar and Njal's sons
    later dig up the buried bodies and summon the dead as outlaws for assault and
    treachery.
  language: English
  quote_policy: summarized
