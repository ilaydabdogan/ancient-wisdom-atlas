canonical_text:
  quote: ''
  summary: Thord Freedmanson is introduced as a strong fosterer of Njal's sons and
    attached to Gudfinna. Bergthora instructs him to kill Brynjolf, Hallgerda's kinsman.
    Thord goes to Lithend, asks Hallgerda where Brynjolf is, and warns that Brynjolf
    may suffer as Atli did. Hallgerda doubts Thord's capacity for killing, while Rannveig
    comments that Hallgerda is goading him. Thord meets Brynjolf on the road, gives
    him warning, and kills him in combat with an axe. Thord reports the killing, Bergthora
    blesses his hands, and Hallgerda reacts angrily and foretells ill consequences.
  language: English
  quote_policy: summarized
