canonical_text:
  quote: ''
  summary: Asgrim and his allies consult Thorhall, who devises a procedural legal
    response against Flosi and Eyjolf. Mord follows this counsel by summoning Flosi
    and Eyjolf at the Hill of Laws for bringing or receiving money in court and for
    contempt of the Thing. While Flosi and Eyjolf delay in the Eastfirthers' Court,
    they lose procedural priority. In the Fifth Court, Mord gives his oath, his vouchers
    swear on the book, and Mord advances the outlawry suits and prepares the inquest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Asgrim and his friends send a man to Thorhall to report their difficult situation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thorhall says he sees that the opposing side intends to summon Asgrim's party
    to the Fifth Court for contempt of the Thing and to divide the Eastfirthers' Court
    so no judgment is given.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thorhall instructs that Mord should summon both Flosi and Eyjolf for bringing
    money into the Fifth Court and should also summon them for bringing forward an
    irrelevant witness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thorhall states that two pending lesser-outlawry suits against the same man
    should result in immediate full outlawry, and he urges that Asgrim's side begin
    its suits first.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mord takes witness at the Hill of Laws and summons Flosi for giving money
    to Eyjolf for help at the Thing, seeking outlawry and forfeiture of goods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mord also summons Eyjolf for taking and receiving the money, and then summons
    both Flosi and Eyjolf a second time for contempt of the Thing involving an improper
    witness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The judges in the Eastfirthers' Court disagree over judgment, and Flosi and
    Eyjolf try to divide the court, losing time while the other summoning proceeds.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Eyjolf says that they loitered in an evil hour, that Thorhall's cunning has
    appeared, and that no man is his match in wit.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Eyjolf recognizes that Mord's side now has the first right to plead before
    the court, though Eyjolf still summons the opposing side for contempt of the Thing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Fifth Court, Mord calls for attention to his oath, suit declaration,
    proofs, and procedural steps against Flosi and Eyjolf.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mord takes a Fifth Court oath invoking God, truth, justice, lawfulness, and
    denial that he has brought or taken money in the suit.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two of Mord's vouchers swear on the book that they believe Mord will plead
    truthfully, justly, and lawfully, and that he has not used money to help himself.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Mord declares the four suits against Flosi and Eyjolf and seats nine neighboring
    inquest members west on the river-bank before inviting challenges to the inquest.
  category: sequence
  evidence_refs:
  - ev:10
