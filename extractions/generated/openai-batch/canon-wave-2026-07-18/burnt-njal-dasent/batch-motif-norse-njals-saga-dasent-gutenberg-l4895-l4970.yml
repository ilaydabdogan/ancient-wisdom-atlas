canonical_text:
  quote: ''
  summary: Gunnar receives news at the Thing of Thord Freedmanson's slaying and goes
    to Njal. Gunnar offers Njal self-doom for the killing. Njal accepts, despite expecting
    blame from his wife or sons, and the two men make peace privately by handclasp.
    Njal sets an award of two hundred in silver, which Gunnar accepts. Njal later
    tells his sons that Sigmund and Skiolld killed Thord and that Thrain stood near.
    Skarphedinn responds with a martial verse and asks when they will act. Njal urges
    his sons not to break the peace, while Skarphedinn says they will remember the
    old feud if new conflict arises.
  language: English
  quote_policy: summarized
