canonical_text:
  quote: ''
  summary: Kari and Bjorn undertake a risky stealth ride through Flosi's country.
    Bjorn's housewife urges him to support Kari and later misdirects men seeking him.
    Kari and Bjorn hide near Skaptarwater, confront a divided hostile band, take a
    defensive stand, and defeat or wound their attackers while remaining unharmed.
    The surviving attackers flee, and the journey is judged shameful by others.
  language: English
  quote_policy: summarized
