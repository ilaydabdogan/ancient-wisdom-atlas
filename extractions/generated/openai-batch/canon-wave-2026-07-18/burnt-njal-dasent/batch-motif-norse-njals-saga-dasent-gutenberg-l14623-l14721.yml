canonical_text:
  quote: ''
  summary: Mord Valgard's son formally declares and repeats an outlawry suit against
    Flosi Thord's son for the death-wounding of Helgi Njal's son. Witnesses confirm
    Mord's notice, testify to the transfer of the manslaughter suit from Thorgeir
    Thorir's son to Mord, and swear oaths. Mord then calls on nine summoned neighbours
    to sit west on the river-bank and invites the defendant to challenge the inquest.
  language: English
  quote_policy: summarized
