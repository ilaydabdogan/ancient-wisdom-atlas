canonical_text:
  quote: ''
  summary: After a brief verse and the departure from the sheepcote, Skarphedinn and
    his brothers track Lyting and his brothers near Rangriver. Skarphedinn kills Hallgrim
    and Hallstein, while Lyting escapes wounded to Ossaby. Hauskuld seeks terms for
    Lyting from Njal. Njal grants a settlement requiring silver compensation for the
    slain Hauskuld, denying compensation for Lyting's wounds, declaring Lyting's brothers
    outlaws, and pledging peace. Njal's sons later learn of the settlement, and the
    atonement is kept.
  language: English
  quote_policy: summarized
