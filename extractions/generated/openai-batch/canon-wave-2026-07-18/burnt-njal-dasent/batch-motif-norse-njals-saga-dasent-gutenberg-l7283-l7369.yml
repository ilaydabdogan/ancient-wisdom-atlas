canonical_text:
  quote: ''
  summary: Njal mediates between Gunnar and the opposing namesakes, sets conditions
    for lawful arbitration at the Althing, obtains peace pledges, has judges named,
    and assigns silver payments. Gunnar then visits Olaf the Peacock, who gives him
    a gold ring, a royal cloak, and the hound Sam, described as intelligent, able
    to know Gunnar's foes, and utterly loyal. Olaf warns Gunnar to beware of enviers,
    and Gunnar returns home.
  language: English
  quote_policy: summarized
