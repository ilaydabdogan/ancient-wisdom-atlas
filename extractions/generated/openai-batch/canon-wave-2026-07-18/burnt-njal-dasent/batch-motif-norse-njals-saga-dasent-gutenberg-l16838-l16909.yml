canonical_text:
  quote: ''
  summary: 'Brodir and his men experience three nights of supernatural wonders: a
    shower of boiling blood, self-moving weapons, and attacking ravens. Each night
    brings injury and deaths on every ship. Brodir asks Ospak to interpret the signs.
    Ospak says they foretell bloodshed, doom, battle, and damnation by devils. Brodir
    angrily plans violence, while Ospak vows to take the true faith, escapes by cutting
    Brodir''s ships loose, reaches King Brian, receives baptism, and reports what
    he has learned.'
  language: English
  quote_policy: summarized
