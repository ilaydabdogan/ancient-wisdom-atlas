canonical_text:
  quote: ''
  summary: Flosi leads an armed band to Bergthorsknoll. Njal, his sons, Kari, and
    the household debate whether to remain outside or enter the house. They go indoors,
    are surrounded, repel an initial weapon assault, and Flosi concludes that the
    attackers must either withdraw or set the house on fire, despite the Christian
    burden of doing so.
  language: English
  quote_policy: summarized
