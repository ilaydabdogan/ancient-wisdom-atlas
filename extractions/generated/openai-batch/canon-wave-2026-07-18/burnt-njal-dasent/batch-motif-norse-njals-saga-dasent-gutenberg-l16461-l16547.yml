canonical_text:
  quote: ''
  summary: Kari and Bjorn evade pursuit, return to Midmark, and Kari vouches for Bjorn's
    bravery. Kari then secures Thorgeir's protection and a stocked farm for Bjorn.
    Kari continues west to allies, states his intent to go abroad in pursuit of remaining
    enemies, receives a sword from Gizur, and takes passage with Kolbein, who declares
    that one fate shall befall them both.
  language: English
