canonical_text:
  quote: Goods perish, friends perish, a man himself perishes, but fame never dies
    to him that hath won it worthily.
  summary: 'The passage outlines Northman social principles as described by Dasent:
    kin-revenge and blood-feud, compensation tariffs for injury or death, fatalism
    joined to the pursuit of lasting fame, ethical distinctions between open and secret
    killing, burial duties toward slain foes, face-to-face speech, generosity to kin,
    and hospitality even to enemies.'
  language: English
  quote_policy: quoted
