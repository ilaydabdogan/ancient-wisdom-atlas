canonical_text:
  quote: ''
  summary: Flosi gathers an armed company at the Great Rift, receives demands for
    the killing of Njal's sons, binds the men by oath and handshake, is chosen leader,
    and lays out a secret timed plan to attack Bergthorsknoll with fire and sword.
    Kari pledges to share the fate of Njal's sons. Rodny confronts her brother Ingialld
    over his oath against Njal, reminds him that Njal had saved him, shows him the
    bloodied hood of her slain son Hauskuld, and persuades him not to stand against
    Njal.
  language: English
  quote_policy: summarized
