canonical_text:
  quote: ''
  summary: At Reykium on Skeid, Hildiglum goes out at night, hears a great crash,
    and sees a fiery ring in the west containing a black rider on a gray horse. The
    rider carries and later hurls a flaming firebrand eastward, causing a blaze that
    hides the fells, then vanishes among the flames. Hildiglum later reports the vision,
    and Hjallti identifies it as “the Wolfs ride,” said to come before great tidings.
  language: English
  quote_policy: summarized
