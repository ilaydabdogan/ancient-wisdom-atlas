canonical_text:
  quote: ''
  summary: A group of supernatural women chant over a blood-soaked war-loom made from
    human remains and weapons, foretelling slaughter and the deaths of rulers. They
    tear down the woven cloth and ride away in two groups. Further portents and visions
    are reported across the North Atlantic world, including blood on a priestly garment,
    a vision of the sea by an altar, a man disappearing after seeing Earl Sigurd,
    and Earl Gilli's dream of a messenger from Ireland whose song is later confirmed
    by news of Brian's battle.
  language: English
  quote_policy: summarized
