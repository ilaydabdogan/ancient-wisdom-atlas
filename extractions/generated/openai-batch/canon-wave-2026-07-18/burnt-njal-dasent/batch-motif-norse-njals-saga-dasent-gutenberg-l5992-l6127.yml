canonical_text:
  quote: ''
  summary: Gunnar is warned that Otkell and others are riding nearby and that Skamkell
    has mocked him as weeping after being ridden over. Gunnar arms himself, his bill
    sounds loudly, and he rides to the ford at Hof on Rangriver. There he confronts
    the riders, answers the insult, and fights them. He maims Hallbjorn, kills Skamkell,
    Audulf, and Otkell; Kolskegg arrives and kills Hallkell, and eight men are slain.
    A woman seeks Mord's intervention, but he refuses. Gunnar and Kolskegg ride home,
    and Gunnar reflects on the killing.
  language: English
  quote_policy: summarized
