canonical_text:
  quote: ''
  summary: Gunnar and Njal go to the Thing while Hallgerda remains at home. In a dispute
    over shared wood at Redslip, Hallgerda orders her grieve Kol to kill Swart, Njal
    and Bergthora's house-carle. Kol ambushes Swart and kills him with an axe. Gunnar
    reports the matter to Njal, who settles it for twelve ounces of silver and warns
    of further trouble. Bergthora says an equal payment will later be made for Kol.
    Later, an armed homeless Eastfirther named Atli comes to Bergthora seeking service
    and admits to a hard temper and a history of wounding men.
  language: English
  quote_policy: summarized
