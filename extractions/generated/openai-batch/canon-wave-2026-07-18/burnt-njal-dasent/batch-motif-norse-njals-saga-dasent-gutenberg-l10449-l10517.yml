canonical_text:
  quote: ''
  summary: Njal describes rules for a new Fifth Court and lawmaking procedure. Skapti
    Thorod's son brings the Fifth Court into law, and new priesthoods are established.
    Njal then asks the assembly to allow a new priesthood at Whiteness for Hauskuld,
    whom he has taken into his house after a settled killing dispute. Hauskuld receives
    the priesthood. Njal negotiates Hauskuld's marriage with Hildigunna through Flosi;
    the wedding is held, property is paid, and Njal later gives Hauskuld land and
    a household. The families maintain close friendship through mutual honor, company,
    feasts, and gifts.
  language: English
  quote_policy: summarized
