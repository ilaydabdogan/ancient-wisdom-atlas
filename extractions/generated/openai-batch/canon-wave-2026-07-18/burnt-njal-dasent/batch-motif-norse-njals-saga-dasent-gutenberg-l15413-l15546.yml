canonical_text:
  quote: ''
  summary: During fighting at the Althing, Flosi's band flees and is blocked near
    Snorri the priest's men. Several men are wounded or killed by spears and other
    violence, including Solvi, Bruni, Ljot, and Eyjolf. Snorri and Hall intervene
    to separate the combatants, a truce is set, bodies are borne to the church, and
    wounds are bound. The next day Hall seeks even atonement at the Hill of Laws,
    but Kari rejects atonement because he will not have the killings weighed against
    the Burning; after Skapti taunts him, Kari answers in verse.
  language: English
  quote_policy: summarized
