canonical_text:
  quote: '"If thou wilt do all the work that I set before thee"'
  summary: A man asks to be taken in by Bergthora. She accepts only if he will do
    any work she assigns, even dangerous work, and he agrees. She takes him into the
    household as Njal's house-carle. Njal questions whether the worker will be good.
    Skarphedinn is kind to Atli. Later Njal and his sons ride to the Thing, where
    Gunnar is also present; Njal shows a purse of money that Gunnar had paid him for
    their house-carle the previous summer, and Skarphedinn comments that it may be
    useful.
