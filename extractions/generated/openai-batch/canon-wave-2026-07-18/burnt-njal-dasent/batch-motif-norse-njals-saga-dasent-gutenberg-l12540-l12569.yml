canonical_text:
  quote: ''
  summary: Flosi prepares to leave from the east before winter, gathers armed companions
    with horses, orders household tasks, leads prayers at home and in a church on
    the route, rides west through named places, and waits at Threecorner ridge, where
    all have arrived except Ingialld of the Springs. The sons of Sigfus criticize
    Ingialld, but Flosi tells them not to blame him in his absence and says they will
    repay him later.
