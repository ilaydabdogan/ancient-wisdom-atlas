canonical_text:
  quote: ''
  summary: 'The line range closes a fragmentary preceding episode in which Eme''mqut''s
    woman, fly-eggs, bumblebees, fishermen, and Eme''mqut''s return home are mentioned.
    It then gives the episode titled "Eme''mqut''s Whale-Festival": Eme''mqut and
    his people kill a whale, take it home, arrange a thanksgiving ceremonial, and
    gather reindeer-breeding people and Magpie-Women. At the ceremony, Magpie-Woman
    and Fox-Women are called on or begin to dance and sing. Their songs refer to eating
    or damaging other people''s property, whale-skin, excrement, and snowshoe-strings.
    Kilu'', Big-Raven, and Eme''mqut comment on these admissions, and some performers
    become ashamed and depart. The passage ends as Small-Magpie-Woman is called to
    dance and begins a song.'
  language: English with Koryak transcriptions and interlinear glosses
  quote_policy: summarized
