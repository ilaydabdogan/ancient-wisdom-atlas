canonical_text:
  quote: ''
  summary: After phonetic and accent notes, the passage begins the tale “Little-Bird-Man
    and Raven-Man.” Raven-Man and Little-Bird-Man both woo Big-Raven’s daughter. Big-Raven
    favors Little-Bird-Man, while Miti says she will give her daughter to Raven-Man.
    Raven-Man secretly goes out, eats excrement and dog carrion, and later claims
    that he killed wolverene and wolf skins found nearby. A long violent snowstorm
    arises; Big-Raven promises his daughter to whichever suitor can calm it. Raven-Man
    asks for provisions, stays nearby under a cliff eating, glares at Little-Bird-Man,
    and Little-Bird-Man returns silently.
  language: English with Koryak text and interlinear glosses
