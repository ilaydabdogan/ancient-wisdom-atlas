canonical_text:
  quote: ''
  summary: A mixed passage of Koryak transliteration, English translation, and notes.
    It includes the end of one fragment, the tale of Eme'mqut and Shellfish-Girl,
    the tale of Eme'mqut and the Perches, and the beginning of Miti' and Magpie-Man.
    Episodes include shellfish and hood transformation, marriages to Shellfish-Girl
    and Fox-Woman, dried perch-tails turning into small men, departure in iron canoes,
    later acceptance of Eme'mqut and his wife, and a household deception involving
    Miti', Magpie-Man, and Big-Raven.
  language: English with Koryak transliteration
  quote_policy: summarized
