canonical_text:
  quote: ''
  summary: In an ongoing storm, Raven-Man enters with frozen boots and says the heavens
    have a crack. Little-Bird-Man is challenged to calm the storm; after Big-Raven
    rejects both suitors, Little-Bird-Man takes a stopper, shovel, and fat, flies
    to heaven, and temporarily plugs the crack. When the storm returns and the first
    stopper is thrust back, Big-Raven makes a larger stopper and gives more fat; Little-Bird-Man
    installs it with a mallet, spreads fat and snow around the hole, and the storm
    becomes calm. Raven-Man is rejected by Miti' for failing to calm the storm, while
    Little-Bird-Man marries Yini'a-fia'wgut. In a later summer rain, Raven-Man puts
    the sun in his mouth, making it dark; Can'ai is sent to fetch water and begins
    singing in the dark.
  language: English with Koryak interlinear text
  quote_policy: summarized
