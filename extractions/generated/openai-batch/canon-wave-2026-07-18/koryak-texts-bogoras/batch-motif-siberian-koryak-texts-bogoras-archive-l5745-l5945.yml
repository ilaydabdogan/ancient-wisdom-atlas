canonical_text:
  quote: ''
  summary: In the translated Kamchadal tale, Raven-Big’s people are hungry. Raven-Big
    goes to the sea, finds Fish-Person/Fish-Woman, brings her home, and marries her;
    her roe provides food. Miti becomes jealous and repeatedly attacks, kills, cooks,
    or eats Fish-Woman, yet Fish-Woman reappears or recovers and brings food. Eventually
    Fish-Woman returns home and refuses Raven-Big’s calls because Miti will kill her
    again. In the following fragment, Kilu and a female companion encounter an ominous
    being; at home a Monster-Being comes to the entrance. Kilu pushes her companion
    toward him and flees. During her flight, trees tear away her clothes and injure
    her before she reaches a village where people laugh and question her.
  language: English translation with Kamchadal/Koryak transcriptions
  quote_policy: summarized
