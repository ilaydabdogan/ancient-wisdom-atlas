canonical_text:
  quote: ''
  summary: The passage closes a tale in which Little-Bird-Man carries a woman across
    a river, dies, later appears as her husband, shows gloves she made as proof of
    identity, and returns with her by caravan to Big-Raven, creating silver sledges.
    It then begins the tale 'Big-Raven and the Mice,' where Mouse-Girls walk by the
    seashore, the youngest Mouse is tied there, makes a false discovery claim about
    a nail that proves to be a shell, is struck, and later indicates a creature that
    proves to be a small ringed seal.
  language: English translation with Koryak interlinear/glossed text
  quote_policy: summarized
