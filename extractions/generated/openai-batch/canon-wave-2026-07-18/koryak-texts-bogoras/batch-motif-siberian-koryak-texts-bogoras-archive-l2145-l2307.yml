canonical_text:
  quote: ''
  summary: 'The passage contains the close of one tale in which Grandfather goes to
    a river, sees his own image in the water, addresses it as Painted-Woman, drops
    a stone hammer and then his body into the water while asking to marry her. It
    then begins the tale of the Mouse-Girls: the youngest loses a tooth while playing,
    claims she was shot from heaven by the Envious-One, is taken home, and her mother
    calls a grandmother who practices shamanism. Ermine-Woman inspects puddings at
    the porch, finds evidence of pilfering and the lost tooth, and the tooth is fitted
    to the suffering girl.'
  language: English translation with Koryak interlinear transcription
  quote_policy: summarized
