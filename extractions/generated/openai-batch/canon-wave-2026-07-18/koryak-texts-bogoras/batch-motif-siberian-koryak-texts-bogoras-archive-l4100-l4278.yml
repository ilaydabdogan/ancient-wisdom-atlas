canonical_text:
  quote: ''
  summary: 'The passage includes the close of one tale, in which a woman’s secret
    childbirth outside the settlement is explained and named couples live prosperously,
    followed by two Ermine-People episodes: one involving a false invitation to Big-Raven’s
    people, rejection, cave dwelling, flood, and upward climbing; another involving
    the birth of an Ermine son, a search for an axe to cut the navel-string, and preparation
    of a birth-feast with meat sent to Big-Raven’s people.'
  language: English translation with Koryak text and glosses
  quote_policy: summarized
