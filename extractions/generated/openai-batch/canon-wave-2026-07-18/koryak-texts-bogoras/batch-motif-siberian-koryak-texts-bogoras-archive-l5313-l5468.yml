canonical_text:
  quote: ''
  summary: A Big-Raven family tale recounts how Kilu' and Yini'a-na'wgut go walking
    with fish-head provisions; a fish bone is thrown, Yini is reported as having become
    a kamak, and after sleeping she wakes to Fish-Man, who marries her and brings
    fishing abundance. Kilu' later envies this marriage, deliberately repeats and
    falsifies the fish-bone episode, sleeps, wakes to another Fish-Man, marries him,
    and returns home; both Fish-Men live with the family, fishing successfully, and
    sons are born. The passage then begins a new titled tale, “Big-Raven and Fox,”
    with a note that the fox is usually female in Koryak and Chukchee traditions.
  language: English translation with Koryak transcription
  quote_policy: summarized
