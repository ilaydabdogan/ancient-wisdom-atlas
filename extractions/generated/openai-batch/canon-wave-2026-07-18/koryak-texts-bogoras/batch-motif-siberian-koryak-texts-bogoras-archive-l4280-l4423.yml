canonical_text:
  quote: ''
  summary: A girl repeatedly carries meat to another household and is rejected. After
    reporting that Eme'mqut detained and invited her, she and her newly delivered
    mother travel with the child, but are struck and rejected as Ermine-People. They
    leave for a cave. Ermine-Man falls from a cliff, sleeps in the cave, then addresses
    ice blocks in the sea as Stone-Face and reports that Stone-Face answered about
    fishing. An editor's note explains Stone-Face beings as petrified human-like natural
    rock forms in native belief, while this episode treats an unstable ice block as
    the object of Ermine-Man's pretense.
  language: English translation with Koryak transcription
  quote_policy: summarized
