canonical_text:
  quote: ''
  summary: 'The passage contains the close of a Big-Raven episode in which Big-Raven
    enters a kamak dwelling, is eaten, returns home because he is a shaman, eats soup,
    swallows a grooved hammer, and kills the big kamak. It then begins the tale of
    Kilu and the Bumblebees: Eme''mqut, married to childless Kilu, goes upstream,
    joins luminous Bumblebee people who are fishing, marries a Bumblebee-Woman, and
    has many children with her. Kilu follows, finds them, kills the new wife, and
    the resulting eggs and fishermen become bumblebees.'
  language: English with Koryak interlinear forms
  quote_policy: summarized
