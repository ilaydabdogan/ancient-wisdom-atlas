canonical_text:
  quote: ''
  summary: A threatening figure associated with Eme'mqut tries to reach people on
    a constructed platform and is opposed by Big-Raven. Big-Raven's cutting tools
    are damaged when he cuts at the figure's tongue. Grass-Woman drops the figure's
    small son into his mouth, where only broken bones are spat out. Big-Raven commands
    the figure to consume his own body; he does so, dies, and is burned. Later, in
    darkness after the fire has gone out, Yini'a-na'wgut and her sister stop the smoke-hole.
    A returning pair, apparently Eme'mqut carrying his small son, asks for the fire
    to be brought out. The women bring out and feed the fire with sacrifice, after
    which the newcomers enter. The episode ends with the cessation of going to the
    open country and a decision to stay at home.
  language: English translation with Koryak transcription/interlinear glosses
  quote_policy: summarized
