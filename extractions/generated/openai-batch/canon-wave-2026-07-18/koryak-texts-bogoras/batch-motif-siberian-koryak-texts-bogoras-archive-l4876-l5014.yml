canonical_text:
  quote: ''
  summary: 'A small louse becomes Big-Raven''s drum, and Big-Raven sets a bride-test:
    whoever can identify the drum''s material will receive his hidden daughter. An
    evil spirit or kamak emerges from the fire, correctly identifies the drum as made
    from a small louse, and the daughter is sent to him. At the kamak house she uses
    a knife and an enlarging comb to survive, but the kamak foretells that he will
    eat her after she marries and bears two children. After the prophecy is fulfilled,
    she is eaten, cuts the kamak open from inside with a hidden knife, and emerges.
    The passage range then begins the next item, “The Kamak and his Wife,” with only
    partial opening material visible.'
  language: English with Koryak transcription embedded
  quote_policy: summarized
