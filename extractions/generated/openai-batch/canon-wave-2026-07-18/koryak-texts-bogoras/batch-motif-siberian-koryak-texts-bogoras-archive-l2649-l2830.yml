canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which people living down the
    coast steal a valuable line from Big-Raven's people. Eme'mqut makes and enters
    a wooden whale, goes to the down-coast people, distracts them with berries, and
    carries a line home, after which it is kept in the inner room. The passage then
    begins a tale in which Big-Raven slides from a large mountain into the house of
    kamaks, is treated as human game, is eaten joint by joint while still alive, and
    returns home because he is a shaman.
  language: English with Koryak transliteration and interlinear glosses
  quote_policy: summarized
