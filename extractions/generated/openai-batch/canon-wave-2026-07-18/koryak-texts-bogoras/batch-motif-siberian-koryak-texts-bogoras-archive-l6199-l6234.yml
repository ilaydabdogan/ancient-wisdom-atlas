  summary: The passage lists Koryak names and glosses for three constellations. The
    Pleiades are glossed with terms meaning group of women, little sieve, sieve, wild
    reindeer, and string. Cassiopeia is glossed with terms meaning wild reindeer,
    group of women, small reindeer-buck, and wolf. Orion is glossed with terms meaning
    crooked one, crooked star, and crosswise-bow carrier.
