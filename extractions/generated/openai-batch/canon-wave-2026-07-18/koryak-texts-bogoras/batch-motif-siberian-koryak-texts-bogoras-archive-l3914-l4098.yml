canonical_text:
  quote: Eme'mqut married Fox-Woman.
  summary: After a preceding closing fragment about staying at home, the tale of Eme'mqut
    and Fox-Woman describes Eme'mqut bringing home a dead mouse that becomes a wolverene,
    a drum episode in which Fox-Woman sings about untidiness and eating snowshoe strings,
    her ashamed departure and delivery of many children outside, and the transformation
    of her thimbles into clothing for those children.
  language: English translation with Koryak transcription/interlinear forms
