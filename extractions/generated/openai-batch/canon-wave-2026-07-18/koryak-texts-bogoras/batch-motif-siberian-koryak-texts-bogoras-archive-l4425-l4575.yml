canonical_text:
  quote: ''
  summary: 'The selected passage contains the end of one tale in which sea-water reaches
    a sleeping group, they climb a cliff, an unnamed man loses a side of his body,
    the group unknowingly cooks and eats that side, and the survivors become real
    ermine. It then gives Tale 13, “Eme''mqut and the Kamaks”: Eme''mqut finds a house,
    is addressed as La''wa, answers the house occupants, uses a drum to call spirits,
    puts a kamak-woman and her husband to sleep, revives a slain man, and flees with
    him. The real La''wa later returns and calls to the spirits with a drum made of
    pieces of skin from women''s breasts. The revived man later lives with Eme''mqut''s
    family and marries a reindeer-breeder''s daughter. The passage also includes headings
    and Koryak text for following tales, but no English narrative extraction is made
    from those untranslated portions.'
  language: English translation with Koryak transcription and editorial footnotes
  quote_policy: summarized
