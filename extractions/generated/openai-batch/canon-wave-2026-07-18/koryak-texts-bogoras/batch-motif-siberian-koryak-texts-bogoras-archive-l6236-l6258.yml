canonical_text:
  quote: ''
  summary: The passage gives names and explanatory notes for constellations or asterisms.
    It records “Group of women” as a name for the Pleiades among the Chukchee and
    for Cassiopeia among the Koryak of Kamenskoye, with two named women. It also records
    the Belt of Orion as the crooked back of the Chukchee archer Rulte'nnin, made
    crooked when his wife struck him with a tailoring-board or scraper handle. Among
    Reindeer Koryak, the Belt of Orion is called Kilu's handle of scraper, and a Koryak
    archer carrying his bow crosswise is said by the note to be evidently identical
    with the Chukchee archer.
  language: English
  quote_policy: summarized
