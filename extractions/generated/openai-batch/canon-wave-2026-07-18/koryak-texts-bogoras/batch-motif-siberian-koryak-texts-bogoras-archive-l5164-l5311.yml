canonical_text:
  quote: ''
  summary: In the translated passage, Big-Kamak swallows Gull-Woman whole without
    chewing; from inside his body she cuts him open with a woman's knife, causing
    his death, then emerges covered with slime and escapes. Cormorant-Woman decides
    to imitate this act, despite being warned that she lacks a woman's knife, and
    plans to use her nails instead. She hides in a dark cave, calls out to Kamak-Woman
    to swallow her, is swallowed without chewing, and later kills Kamak-Woman by tearing
    old scars with her nails before emerging through drifted snow. An editorial footnote
    notes confusion in the roles of Big-Kamak and his wife.
  language: English translation with Koryak transcription
  quote_policy: summarized
