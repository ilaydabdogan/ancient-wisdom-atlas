canonical_text:
  quote: He was eating his own father-in-law.
  summary: An opening tale fragment describes an unnamed actor hauling tobacco-mortars;
    reindeer body parts emerge from the mortars and he strikes or chops them before
    bringing the mortars to Eme'mqut. In the titled tale, Eme'mqut marries Grass-Woman,
    increasingly stays in the open country, kills and eats his father-in-law Root-Man,
    and is later deceived by Grass-Woman's small lice decoys when she flees to Big-Raven's
    people, who construct a raised platform.
  language: English translation with Koryak transcription and interlinear glosses
    present
