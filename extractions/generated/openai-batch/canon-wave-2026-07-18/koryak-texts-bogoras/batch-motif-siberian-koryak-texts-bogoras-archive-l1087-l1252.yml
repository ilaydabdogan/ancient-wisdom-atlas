canonical_text:
  quote: ''
  summary: A sequence of Koryak text and translation describes darkness after Raven-Man
    uses the sun as a quid, a young woman sent to fetch water in the dark, the arrival
    of a bubbling small river and River-Man, River-Man's marriage to the woman, River-Man's
    magical restoration of dawn with a ringed-seal-thong headband, and Yini'a-na'wgut's
    later visit to Raven-Man, who turns his back while she tries to face him and tickles
    him under the arms.
  language: English with Koryak transcription/glosses
  quote_policy: summarized
