canonical_text:
  quote: ''
  summary: A captured small kamak is brought into a house, danced over, asked what
    object it should become, and refuses several household-object transformations
    before accepting transformation into a thong. After it is made, cut, carried outside,
    and stretched, Frost-Man's people try to steal or untie it; the thong cries out
    and wakes Big-Raven's people. People living down the coast later hear of the watchful
    thong and plan to carry it away.
  language: English translation with Koryak text and interlinear glosses
  quote_policy: summarized
