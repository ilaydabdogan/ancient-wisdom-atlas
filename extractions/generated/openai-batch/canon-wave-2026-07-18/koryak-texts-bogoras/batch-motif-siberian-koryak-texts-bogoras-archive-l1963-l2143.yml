canonical_text:
  quote: ''
  summary: Raven-Big complains that broth tastes of excrement and says Mouse-Women
    have defiled him. He takes a big club to punish them, but they repeatedly lure
    him with puddings and make him sleep. In the first episode they attach red shreds
    to his eyes; when he returns home, he tells Miti to tear apart the worst of their
    sons to appease or strike the fire, though the fire is then questioned as absent.
    In the second episode, the Mouse-Women again feed him, make him sleep, paint his
    face with charcoal, and wake him at daybreak.
  language: English with Koryak interlinear/gloss material
