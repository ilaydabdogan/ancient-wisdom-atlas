canonical_text:
  quote: '"take care not to look back at them!"'
  summary: Eme'mqut, son of Big-Raven, encounters an old man making ornamented tobacco-mortars.
    The old man sends him to an old woman who cooks for him, then gives him the mortars
    and orders him to haul them away without looking back. After hauling the heavy
    mortars, Eme'mqut stops, looks back, and sees a young woman in a covered sledge
    driving a reindeer team; they go home and live joyfully. ila' then asks how this
    happened and begins to repeat the same procedure.
  language: English translation with Koryak transcription and interlinear glosses
  quote_policy: quoted
