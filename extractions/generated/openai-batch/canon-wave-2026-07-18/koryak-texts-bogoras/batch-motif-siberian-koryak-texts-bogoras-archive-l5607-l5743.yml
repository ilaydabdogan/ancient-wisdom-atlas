canonical_text:
  quote: ''
  summary: The passage opens with the end of a prior fragment involving vomited matter
    and an unnamed person refusing it. It then gives the tale “Big-Raven and Fish-Woman”
    in English synopsis and in dialectal forms. Big-Raven’s hungry family is fed by
    Fish-Woman’s spawn after he finds her at the sea and marries her. Miti becomes
    jealous, kills and cooks Fish-Woman, but Fish-Woman repeatedly appears or revives
    and feeds Big-Raven. Fish-Woman finally leaves, returns to the sea-shore, and
    refuses Big-Raven’s call because Miti will try to kill her again.
  language: English, with Chukchee and Koryak dialect transcriptions
  quote_policy: summarized
