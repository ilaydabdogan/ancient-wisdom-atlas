  summary: Introductory source notes describe collection of Koryak texts chiefly in
    Kamenskoye, transcription difficulties caused by dialect differences, vowel harmony
    and consonant variation in Koryak compared with Chukchee, and the named narrators
    or version-makers for several numbered texts. The passage is linguistic and ethnographic
    metadata rather than a myth narrative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The texts were collected chiefly in Kamenskoye, identified by the Koryak name
    Vai'kenan, on Penshina Bay, with the help of Nicholas Vilkhin.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nicholas Vilkhin is described as a half-Russianized Koryak, raised in Gishiginsk,
    and belonging by birth to Paren, identified by the Koryak name Poi'tin.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Paren and Kamenskoye dialects are described as very similar but having
    pronunciation differences, including replacements involving e and a, tk and ft,
    and y and s.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The collector states that he tried to avoid confusing the Paren and Kamenskoye
    pronunciation systems but was not sure he succeeded in every case.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that vowel harmony exists in Chukchee but is unstable and
    often inconsistent in Koryak.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Koryak, a and e are described as neutral for the vocalic harmony system,
    while the remaining vowel pairs also admit many exceptions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Intermarriage between people of different villages is said to contribute to
    variation in vowel and suffix use among different persons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage describes dialectal and individual differences in consonant use
    and notes that sex-based pronunciation differences exist in Koryak but are less
    strict than in Chukchee.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Except where otherwise stated, texts were taken down in Kamenskoye from Maritime
