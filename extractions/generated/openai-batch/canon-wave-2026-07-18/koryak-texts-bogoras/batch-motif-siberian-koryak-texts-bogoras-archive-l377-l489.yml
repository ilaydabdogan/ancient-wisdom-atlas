  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Text No. 21 is said to be in the Pa'llan dialect and to have been related
    by Basile, a Maritime Koryak man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Text No. 22 is said to be in the Paren dialect and to have been taken down
