canonical_text:
  quote: ''
  summary: The passage contains the end of one tale, in which Ermine-Woman tests a
    tooth in the mouths of small women until it fits a suffering small woman, followed
    by a mother ordering a female to die and the female eventually dying after going
    away. It then begins a tale titled “How a Small Kamak was transformed into a Harpoon-Line,”
    where a hungry small kamak rejects food in several storage places, insists on
    going to Big-Raven’s house despite his mother’s warning, is caught in Big-Raven’s
    snare near an elevated storehouse, is taken home by Big-Raven, and is celebrated
    by dancers Miti' and Ga'na.
  language: English
  quote_policy: summarized
