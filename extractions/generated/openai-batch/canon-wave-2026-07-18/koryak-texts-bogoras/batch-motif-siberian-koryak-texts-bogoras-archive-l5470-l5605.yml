canonical_text:
  quote: ''
  summary: 'The passage contains the close of a Big-Raven tale: Big-Raven finds stranded
    sea mammals, chooses a whale, enters its mouth, takes whale-oil, shares oil accidentally
    with a fox, and is killed by the fox''s return-gift. It then gives a fragment
    about Eme''mqut and Envious-One: after an omasum-roasting episode, both men compare
    the beauty of their wives, and Envious-One''s preparations and reactions lead
    to swooning and bodily distress.'
