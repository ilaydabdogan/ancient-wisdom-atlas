canonical_text:
  quote: ''
  summary: Mouse-Women monitor the preparation of a ringed seal in Big-Raven's house.
    Mouse-Woman uses a magic-associated grass bundle to make Big-Raven postpone eating
    the cooked meat. While Big-Raven and Miti' sleep, the Mice steal the meat and
    broth, defile the kettle, and fill the householders' boots with pebbles. In the
    morning Big-Raven and Miti' discover the harm, and Big-Raven vows retaliation
    against the Mouse-Women.
