canonical_text:
  quote: The sun jumped out and fastened itself to the sky. It grew daylight.
  summary: A woman makes Raven-Man laugh so that the sun emerges and daylight comes.
    She later kills Raven-Man, uses his head or palate in a sky-related utterance,
    reports that he had the sun in his mouth, and the weather becomes better. Raven-Woman
    visits her dead brother. In a later travel episode, Little-Bird-Man carries the
    woman across a river and dies; the woman nearly freezes among stone-pines and
    then sees a reindeer herd with iron antlers and a man.
  language: English
  quote_policy: quoted
