canonical_text:
  quote: ''
  summary: Big-Raven visits dancing Mouse-Girls despite Miti's warning. After asking
    to be loused, he is loused by Hairless-One, shakes his head, scatters the small
    mice into different places, and carries home the small ringed seal they had found.
    The Mouse-Girls later compare where they fell, return home, and tell their mother
    that grandfather took the seal; the mother says they will fetch it back.
