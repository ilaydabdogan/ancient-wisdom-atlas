canonical_text:
  quote: Many said that the decree was carried more by violence than by law, but it
    remained in force.
  summary: Thorir of Gard seeks vengeance against Grettir at the Thing and succeeds
    in having him proclaimed an outlaw, despite Skapti the Lawman's objection that
    judgment should not rest on one account. Grettir later returns to Iceland, hears
    at once of his father's death, his brother's killing, and his own outlawry, yet
    remains merry. He conceals himself in a black cape, takes Sveinn's swift brown
    mare Saddle-head, rides through the district, sends verse messages ahead, is pursued
    by Sveinn, and finally reaches Gilsbakki, where Grim welcomes him and Sveinn accepts
    the matter as settled after an exchange of verses.
  language: English
  quote_policy: quoted
