canonical_text:
  quote: ''
  summary: At the All-Thing, Thorgils and Skapti discuss three outlaw guests and their
    differing fears. Thorodd pursues a legal complaint over Thorbjorn Oxmain's death,
    but Skapti argues that Grettir's outlawry removes his legal standing in the case.
    Atli's nearest kin receive blood-money, Snorri proposes commuting Grettir's sentence,
    Thorir refuses, and Thorodd and Thorir set an unusually high reward for Grettir's
    head.
  language: English
  quote_policy: summarized
