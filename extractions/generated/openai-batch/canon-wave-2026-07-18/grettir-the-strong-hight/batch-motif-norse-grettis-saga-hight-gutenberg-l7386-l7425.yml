canonical_text:
  quote: ''
  summary: Thorsteinn and Spes travel to Rome, confess the tricks by which they achieved
    their union, accept penance, receive full absolution, and are admonished to live
    in purity. Spes proposes that they atone by having separate stone retreats built.
    Thorsteinn funds the builders; after completion, the pair part company, each lives
    alone in a retreat in hope of eternal life, and both end their lives there. The
    narrator adds that most men considered them fortunate and that no descendants
    are said to have come to Iceland.
  language: English
