  quote: ''
  summary: Grettir prepares for and completes a swim from the island to Reykjanes,
    reaches the settlement at Reykir, warms and rests in a hall, is discovered asleep
    by two women who recognize and mock him, then obtains help from Thorvald to return
    to the island by ship. News of the swim increases his reputation for courage and
    causes local men to blame Thorbjorn Angle for not removing him from Drangey.
  language: English
