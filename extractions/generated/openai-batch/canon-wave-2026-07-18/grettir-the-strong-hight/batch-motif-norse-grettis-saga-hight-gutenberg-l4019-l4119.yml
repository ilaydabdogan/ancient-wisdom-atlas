canonical_text:
  quote: ''
  summary: Thorodd investigates the killing of Thorbjorn and his son; Asdis argues
    that vengeance for Atli was not excessive. A lost spear is later found in the
    marsh where Thorbjorn fell, giving the place the name Spearmarsh and serving as
    proof of the killing site. Thorbjorn's kinsmen seek Grettir, who is warned and
    sent to ask Snorri Godi for protection; Snorri refuses lodging but offers to speak
    for him. Grettir then goes to Thorgils at Reykjaholar for the winter, where he
    shares hospitality with the foster-brothers Thorgeir and Thormod under a rule
    of peace. The three later go by boat to fetch Thorgils's ox from an island in
    cold north wind and high surf; Grettir holds the boat in shoulder-deep water while
    the ox is loaded, and during the return Thorgeir rows so hard that the rowlocks
    break.
  language: English
  quote_policy: summarized
