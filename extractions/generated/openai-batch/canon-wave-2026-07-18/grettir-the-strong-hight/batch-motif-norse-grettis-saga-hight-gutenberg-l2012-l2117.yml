canonical_text:
  quote: ''
  summary: Grettir is attacked first by Hjarrandi and later by Gunnar with armed followers.
    Arnbjorn saves Grettir from the first attack, after which Grettir and Arnbjorn
    kill Hjarrandi and his men. Jarl Sveinn summons assemblies, and Grettir's friends
    and kin repeatedly plead for his life and offer atonement. After Gunnar attacks
    Grettir in a booth and is killed, the jarl refuses blood-money and declares that
    he must have Grettir's life.
  language: English
  quote_policy: summarized
