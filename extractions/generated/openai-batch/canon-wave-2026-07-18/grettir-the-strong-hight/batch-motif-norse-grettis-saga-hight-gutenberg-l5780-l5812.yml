canonical_text:
  quote: '"hence I go not, unless I am dead or dragged away"'
  summary: After midwinter, local bondis row to Drangey to retrieve their animals
    for slaughter. They discover Grettir and his companions on the island, with the
    shore people pulling up the ladders. Grettir identifies himself, refuses offers
    of money and safe departure, and declares he will not leave unless dead or dragged
    away. The bondis return home unable to remove him.
