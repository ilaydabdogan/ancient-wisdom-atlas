canonical_text:
  quote: ''
  summary: During a severe famine in Iceland, a large stranded whale at Rifsker becomes
    the object of a dispute between local groups. Flosi's men begin cutting up the
    whale; Thorgrim and the Kaldbak men claim it and receive support from Svan. Fighting
    breaks out using ordinary weapons and whale-cutting tools, and even whale parts
    are used as weapons. Several men are killed or wounded. The dispute later goes
    before the All-Thing, where legal judgment divides the land and establishes that
    drift belongs to the owner of the land where it strands. Compensation, exile,
    and reconciliation follow.
  language: English
  quote_policy: summarized
