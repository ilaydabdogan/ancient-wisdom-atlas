  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Grettir rises and answers in verse that he will get up despite the rolling
    ship and that the woman would be angry if he remained while others did his work.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Grettir goes aft to the men who are baling and asks what they want him to
