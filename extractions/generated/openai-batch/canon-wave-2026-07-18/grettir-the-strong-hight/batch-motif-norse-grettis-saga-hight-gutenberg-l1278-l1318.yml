canonical_text:
  quote: ''
  summary: Grettir is summoned from rest to help with shipboard baling. Though others
    doubt him, Haflidi allows him to help. Grettir bales water so powerfully that
    successive men tire while emptying the buckets, and the ship is dried. Later the
    ship sails east in darkness, strikes a rock, takes on water, and the passengers
    and goods are moved by boat to a nearby island identified at daybreak as Haramarsey
    near Sunnmore in Norway.
  language: English
  quote_policy: summarized
