canonical_text:
  quote: ''
  summary: After Grettir reports what happened, the priest admits he held the rope
    faithlessly. The community believes monsters caused local disappearances; after
    Grettir's action, haunting ceases and bones are buried. Grettir later seeks protection
    from Gudmund the Mighty, who recommends the defensible island of Drangey, accessible
    only by ladder. Grettir says fear of the dark prevents him from living alone.
    He then travels, seeks revenge, raids small farmers, and the passage ends with
    the birth and short life of Skeggi, an unusually strong youth later attributed
    to Grettir.
  language: English
  quote_policy: summarized
