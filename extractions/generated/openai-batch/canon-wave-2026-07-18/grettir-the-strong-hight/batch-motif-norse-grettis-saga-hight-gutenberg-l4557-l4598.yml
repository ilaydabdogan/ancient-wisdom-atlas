canonical_text:
  quote: ''
  summary: Grettir withdraws to the Arnarvatn Heath, builds a hut, and supports himself
    by fishing, though he suffers from fear of the dark. Other outlaws look to him
    as a protector. Grim, an outlaw bribed by people of Hrutafjord to kill Grettir,
    gains hospitality from him and watches for a chance to attack. When Grim thinks
    Grettir is asleep, he takes a short sword hanging above Grettir and raises it
    to strike. Grettir springs up, overpowers him, extracts the truth, and kills him.
    The winter passes, with Grettir's fear of darkness remaining his greatest hardship.
  language: English
  quote_policy: summarized
