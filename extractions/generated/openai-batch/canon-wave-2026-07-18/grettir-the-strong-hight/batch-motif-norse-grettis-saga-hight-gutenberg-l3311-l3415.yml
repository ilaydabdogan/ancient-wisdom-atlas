canonical_text:
  quote: ''
  summary: After a burned house is found with human bones, traders accuse Grettir
    of burning the sons of Thorir of Gard and their followers, expel him, and spread
    the accusation. Grettir goes to King Olaf to clear himself, denies intentional
    guilt, and offers to undergo legal purgation by bearing iron. During the church
    ceremony, an ill-favoured overgrown boy denounces and insults him; Grettir strikes
    the boy, and the ordeal is aborted. The boy's origin is unknown, but he is believed
    to have been an unclean spirit sent to destroy Grettir. King Olaf says Grettir's
    ill-luck prevents his service, permits him to depart, and predicts his return
    to Iceland, where he will die.
  language: English
  quote_policy: summarized
