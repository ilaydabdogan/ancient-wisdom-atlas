canonical_text:
  quote: ''
  summary: Grettir and his companions live on Drangey with food from birds, eggs,
    and remaining sheep, and with fuel from driftwood. A tame ram remains near their
    hut. The thrall Glaum, charged with work including tending the nightly fire, grows
    slack, and the fire goes out. Because they have no boat, Illugi suggests waiting
    for a ship to bring fire, but Grettir decides to risk trying to reach the mainland
    across the sea passage.
