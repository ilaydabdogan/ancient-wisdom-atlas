canonical_text:
  quote: ''
  summary: Grettir enters a waterfall with only a short sword, swims behind the fall
    into a cave, fights and kills a giant by the cave fire, explores the cave, retrieves
    the bones of two men, and leaves a rune-staff account at the church. The priest
    who was tending the rope mistakes bloody debris in the river for proof of Grettir's
    death and abandons the rope before later reading the runes.
  language: English
