canonical_text:
  quote: ''
  summary: Thorir attacks Grettir in a narrow gorge but withdraws after heavy losses,
    interpreting the unseen defense behind Grettir as magic or troll-like. Grettir
    then discovers the wounded Hallmund, who had secretly aided him, and is invited
    to Hallmund's cave at Balljokull, where Hallmund's daughter nurses both men. Later
    Grettir seeks counsel and refuge, is received conditionally by Bjorn the Hitdale
    Warrior, and establishes a defensible mountain hiding-place at Fagraskogafjall,
    using a grey wadmal screen to disguise the entrance. The passage also reports
    Grettir and Bjorn's strength feats, including swimming the Hitara and placing
    stepping-stones in the river.
  language: English
  quote_policy: summarized
