  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Grettir fetches ale, gives it to the berserks, keeps them supplied with the
    strongest ale, and tells them stories while they drink heavily.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The berserks want to swear fellowship with Grettir, but he says it should
    not be done hastily while ale has affected them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: As night comes on and the berserks are fuddled, Grettir tells the women to
    go to bed in Thorir’s name.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Grettir leads the berserks outside to an enormous, strongly built outbuilding
