  text: Thorir tells the mistress that her husband’s absence will not leave her, her
    daughter, or the other women without a man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women flee and weep because they are overcome by terror.
  category: action
  evidence_refs:
