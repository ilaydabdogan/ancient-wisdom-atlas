canonical_text:
  quote: Ale is another man
  summary: Grettir handles Thorir and the other berserks by having them set aside
    weapons, serving them strong ale, delaying sworn fellowship, leading them into
    a locked outbuilding, obtaining household weapons from the mistress, and killing
    Thorir and Ogmund before fighting the rest.
  language: English
  quote_policy: quoted
