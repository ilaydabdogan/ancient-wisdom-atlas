canonical_text:
  quote: ''
  summary: Grettir spends a winter with his kinsman Thorsteinn Kuggason at Ljarskogar.
    Thorsteinn is an industrious smith and builder, while Grettir is skilled at forging
    but reluctant to work. Thorsteinn's church and ingenious bridge with audible rings
    and bells are described. When men of Hrutafjord gather after hearing Grettir is
    there, Thorsteinn tells Grettir to seek another hiding-place because he does not
    work. Grettir travels south among kinsmen and acquaintances, including Grim, Skapti
    the Lawman, and Thorhall, who treats him well but does not want to keep him long.
  language: English
