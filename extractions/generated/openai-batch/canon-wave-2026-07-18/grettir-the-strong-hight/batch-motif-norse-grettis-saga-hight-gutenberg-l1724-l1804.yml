canonical_text:
  quote: ''
  summary: After Yule, Thorfinn returns home and discovers signs that hostile vikings
    or berserks have been there. His wife tells him that Grettir, their winter guest,
    saved the household from disgrace. Thorfinn thanks Grettir, promises future aid
    and household honor, and later gives him a valuable short sword. Grettir's fame
    spreads because of his exploit against the vikings, and he travels north to Vagar
    and then to Thorkell's home, where he is received with honor.
