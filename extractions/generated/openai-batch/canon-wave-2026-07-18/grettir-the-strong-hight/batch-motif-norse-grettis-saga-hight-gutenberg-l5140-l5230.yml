canonical_text:
  quote: ''
  summary: Grim, an outlaw, takes up fishing on Arnarvatn Heath where Grettir had
    been. Hallmund resents Grim and repeatedly removes his catches. Grim keeps watch,
    wounds the fish-taker with an axe, and follows him to a cave at Balljokull, where
    a woman identifies the wounded man as her father Hallmund. Hallmund has his daughter
    cut his adventure in runes on a staff while he recites the Hallmundarkvida, recalls
    past exploits, speaks of Grettir and Grim's fate, and dies as the song ends. Grim
    remains in the cave long enough to learn the lay, winters on the heath, and later
    spares Thorkell son of Eyjolf.
  language: English
  quote_policy: summarized
