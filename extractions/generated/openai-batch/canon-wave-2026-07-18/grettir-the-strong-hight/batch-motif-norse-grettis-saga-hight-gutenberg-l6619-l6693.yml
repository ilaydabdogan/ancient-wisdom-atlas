canonical_text:
  quote: ''
  summary: After Grettir is already dead, Thorbjorn Angle strikes and decapitates
    him to prove the killing and claim the bounty. Illugi denounces the killing as
    caused by sorcery and refuses to swear away vengeance in exchange for his life,
    choosing death instead. Illugi is executed and praised for courage; the brothers
    are buried on the island while Grettir's head, weapons, and valuables are taken
    away. Glaum is later killed while resisting. Grettir's head is salted and stored
    at Vidvik. Thorir refuses to pay Angle the bounty, condemning the killing as evil
    and associated with magic and witchcraft, and directs the dispute toward legal
    judgment at the All-Thing.
  language: English
  quote_policy: summarized
