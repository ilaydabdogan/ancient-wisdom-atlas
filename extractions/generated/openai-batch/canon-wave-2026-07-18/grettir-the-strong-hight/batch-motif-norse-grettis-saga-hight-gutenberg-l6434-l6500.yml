  text: Halldor says that Thorbjorn's foster-mother is a sorceress and that sorcery
    is forbidden.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Halldor advises Thorbjorn to ask Bjorn in Haganes for a boat and warns that
    the journey will be vain if Grettir is well and hearty.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Halldor tells Thorbjorn not to slay Grettir in open fight and not to slay
    Illugi if it can be avoided.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Halldor gives Thorbjorn six additional men, bringing the party to eighteen
