canonical_text:
  quote: ''
  summary: After the old woman has bewitched a log, Thorbjorn Angle is urged by his
    foster-mother to make another attempt against Grettir. She implies that her earlier
    act has reached Grettir and that she may be influencing the weather. Thorbjorn
    gathers men, receives reluctant counsel and reinforcements from Halldor, obtains
    Bjorn's boat, and sails with eighteen men toward Drangey. Although bystanders
    think the crossing impossible, the weather becomes calmer at sea and the party
    reaches the island at evening.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thorbjorn Angle is at home in Vidvik, displeased because he has not been able
    to overcome Grettir.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: About a week after the old woman bewitched the log, she comes to speak with
    Thorbjorn and asks whether he means to visit Grettir.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The foster-mother says she does not intend to meet Grettir, says she has sent
    him her greeting, and advises Thorbjorn to set out quickly if he is to overcome
    him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The foster-mother advises Thorbjorn to collect men and seek help from Halldor,
    and asks whether it is too wild to suppose that she may have something to do with
    the current breeze.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several men refuse to help Thorbjorn, while Tungu-Steinn, Hjalti, Eirik, and
    Thorbjorn's own household provide enough men for twelve to ride from Vidvik to
    Hof.
  category: action
  evidence_refs:
  - ev:4
