canonical_text:
  quote: Bare is his back who has no brother!
  summary: Grettir is too ill to stand, while Illugi stays with him and Glaum is left
    to keep watch. Glaum falls asleep and fails to draw up the ladder, allowing Thorbjorn
    Angle and his men to reach the hut. Glaum reveals Grettir's condition. The attackers
    break into the hut through the door and roof. Illugi defends Grettir; Grettir,
    though badly weakened, kills attackers. Illugi is overpowered and captured. Grettir
    dies from his wound and illness. Angle cuts off Grettir's hand to take the sword
    from his locked grip and then strikes off his head, damaging the sword.
  language: English
  quote_policy: quoted
