canonical_text:
  quote: ''
  summary: News from Norway says Olaf son of Harald has become king and favors skilled
    men. Grettir wants to leave Iceland, takes ship, and later seeks audience with
    Olaf. Thorbjorn Slowcoach joins the same vessel, insults the death of Asmund Longhair,
    taunts Grettir, and refuses to retract. Grettir prophesies that Thorbjorn will
    not die of hearth smoke or old age, challenges him, strikes him, and beheads him.
    The sailors praise the stroke and the ship sails to Norway.
  language: English
  quote_policy: summarized
