canonical_text:
  quote: ''
  summary: A group of young men gather for autumn ball-games at Midfjord Water. Fourteen-year-old
    Grettir is matched against the older and very strong Audun. A play action escalates
    into anger, a wound, a bat swing, and wrestling. Audun throws Grettir and presses
    him down until others separate them. Grettir utters a saying about vengeance,
    and mediators prevent further discord.
  language: English
  quote_policy: summarized
