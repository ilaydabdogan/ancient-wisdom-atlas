canonical_text:
  quote: ''
  summary: Grettir meets Bjorn at a coastal port, revives their quarrel, refuses compensation,
    and kills Bjorn in combat. Bjorn's death leads to complaint before Jarl Sveinn.
    Thorfinn protects and advocates for Grettir, citing Bjorn's provocations and Grettir's
    earlier killing of berserks. Hjarrandi, Bjorn's brother, refuses compensation
    and plots against Grettir, so Thorfinn assigns Arnbjorn to accompany him.
  language: English
  quote_policy: summarized
