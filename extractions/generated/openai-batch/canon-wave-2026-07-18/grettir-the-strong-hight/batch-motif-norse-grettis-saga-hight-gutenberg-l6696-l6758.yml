canonical_text:
  quote: ''
  summary: After Grettir and Illugi are killed, their kinsmen grieve and condemn Angle
    for killing a dying man and for alleged sorcery. Angle rides to Bjarg with Grettir's
    preserved head, places it on the floor, and boasts before Asdis. Asdis answers
    with a defiant verse. Supporters gather around her, Angle abandons his intended
    property claim, and the matter shifts toward legal counsel and the All-Thing.
  language: English
