canonical_text:
  quote: ''
  summary: Grettir, living as an outlaw in the Kjol region and robbing travelers for
    subsistence, encounters Lopt, a mounted traveler with property. Grettir demands
    goods without payment, but Lopt refuses. Grettir seizes Lopt's bridle; Lopt overpowers
    him and tears it away. Lopt then answers Grettir's questions about his destination
    in verse, naming Balljokull. Grettir recognizes that he cannot match Lopt's strength.
    Later Grettir asks Skapti for shelter, but Skapti rebukes his robberies and says
    a lawman cannot harbor an outlaw. Grettir says he can scarcely live alone because
    he fears the dark. Skapti advises caution, and Grettir eventually goes to Grim,
    who advises him to move to Fiskivotn in Arnarvatn Heath.
  language: English
  quote_policy: summarized
