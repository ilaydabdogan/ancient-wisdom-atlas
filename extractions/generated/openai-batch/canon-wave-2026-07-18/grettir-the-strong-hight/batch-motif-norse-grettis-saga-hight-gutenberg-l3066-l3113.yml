canonical_text:
  quote: ''
  summary: After Glam speaks a curse limiting Grettir's future strength and foretelling
    exile, solitude, haunting visions, and death, Grettir recovers, decapitates Glam,
    and helps dispose of the body by burning the remains and burying the ashes far
    away. Thorhall thanks and rewards Grettir, neighboring men praise the deed, and
    Grettir later reports that the struggle tested him greatly. He is afterward more
    ill-tempered and becomes afraid of the dark, seeing apparitions; the narrator
    explains the expressions “Glam's eyes” and “Glam visions.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Glam tells Grettir that, because of their struggle, Grettir will possess only
    half the strength and firmness of heart otherwise decreed to him, and that he
    will never grow stronger than he is now.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Glam says that Grettir's future will include exile, battle, evil outcomes
    from his deeds, the forsaking of his guardian-spirit, outlawry, and life alone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Glam says that his eyes will always be before Grettir's vision and that living
    alone will be hard for Grettir and finally drag him to death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After Glam's speech, Grettir's faintness leaves him; he draws a short sword,
    cuts off Glam's head, and lays the head between Glam's thighs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Thorhall comes out after dressing but does not approach until Glam is dead;
