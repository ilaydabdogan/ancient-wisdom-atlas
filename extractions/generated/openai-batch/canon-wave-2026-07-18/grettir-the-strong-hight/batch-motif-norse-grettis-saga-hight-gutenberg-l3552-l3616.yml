canonical_text:
  quote: ''
  summary: Thorbjorn Oxmain, jealous of Atli, urges Gunnar and Thorgeir to ambush
    Atli on his return from Snaefellsnes. Atli refuses to strike first and frames
    the encounter in terms of compensation and defense. Gunnar rejects compensation,
    invokes a previous killing by Grettir, and attacks while Grettir is absent. Eight
    men set upon Atli's six. Atli draws Jokulsnaut, a sword given by Grettir, kills
    two attackers and Gunnar. Grim fights Thorgeir, pursues him when he tries to escape,
    and wounds him with an axe. The remaining followers are spared, the packs are
    reloaded, and Atli spends the autumn and winter guarded at Bjarg with allies.
  language: English
  quote_policy: summarized
