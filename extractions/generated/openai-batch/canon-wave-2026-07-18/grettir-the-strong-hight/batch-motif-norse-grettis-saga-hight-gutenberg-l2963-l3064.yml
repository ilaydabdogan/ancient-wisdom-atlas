canonical_text:
  quote: ''
  summary: Grettir comes to Thorhallsstad, where Thorhall warns him about Glam's nightly
    violence and the danger to horses. After two nights, Glam kills Grettir's horse.
    Grettir keeps watch in the damaged hall, covered by a cloak. Glam enters after
    making noise on the roof, seizes the cloak, and wrestles with Grettir. The struggle
    moves to the doorway, where Grettir uses a fixed stone to make Glam fall backward
    out of the house, damaging the building. In bright moonlight Grettir sees Glam's
    eyes and is overcome with fear before Glam speaks.
  language: English
  quote_policy: summarized
