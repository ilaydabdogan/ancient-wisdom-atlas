canonical_text:
  quote: ''
  summary: Grettir is pressured to leave human settlements after killings, seeks counsel,
    and travels to Geitland. He ascends the Geitland glacier with supplies and discovers
    a secluded ice-enclosed valley with grass, brushwood, hot springs, volcanic fires,
    a stream, and numerous fat sheep. He builds a hut, slaughters a lamb belonging
    to a ewe called Brownhead, and is kept awake by the ewe's nightly bleating. At
    twilight he hears a voice calling the sheep to shelter. Grettir says a giant named
    Thorir rules and protects the valley, names it Thorisdal, spends the winter there,
    then leaves and makes a stone with a hole through which one can see into the gully
    from Thorisdal.
  language: English
  quote_policy: summarized
