canonical_text:
  quote: ''
  summary: After Thorfinn keeps treasure and a sword near his bed, the narrative turns
    to Norway, where jarl Eirik prepares to sail west and abolishes holmgang abuses
    by declaring robbers and berserks outlaws. Two outlawed berserk brothers, Thorir
    Paunch and Ogmund the Bad, bear a grievance against Thorfinn for helping to outlaw
    them. At Yule, Thorfinn leaves for a festival with many freemen, while his wife,
    daughter, Grettir, and servants remain at home. Twelve men arrive by shield-covered
    ship, move Thorfinn's large boat, and identify themselves as Thorir, Ogmund, and
    companions. Grettir greets them warmly, tells them Thorfinn is absent and the
    household is vulnerable, invites them to the hall, and the mistress denounces
    them as robbers and malefactors.
  language: English
  quote_policy: summarized
