  basis: The brothers are said to carry off men's wives, keep them for a week or two,
    and send them back.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy label is broader than the passage's literal statement; the
    passage describes wives being abducted but does not frame a specific beloved-recovery
