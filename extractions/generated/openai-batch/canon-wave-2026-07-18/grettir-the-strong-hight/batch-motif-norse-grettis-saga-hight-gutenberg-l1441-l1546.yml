- id: motif:4
  label: vulnerable household during festival absence
  taxonomy_refs:
  - departure
  basis: Thorfinn leaves for a Yule festival with thirty freemen, leaving his wife,
    sick daughter, Grettir, and eight serving men at home; the outlawed brothers arrive
    during this absence.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:12
  confidence: medium
  cautions: The departure motif is supported narratively, but the passage does not
    itself mark the absence as a sacred or mythic departure.
- id: motif:5
  label: dangerous guests received through ambiguous hospitality
  taxonomy_refs:
  - trickster_boundary
  basis: Grettir greets the unpeaceful arrivals warmly, discloses Thorfinn's absence,
