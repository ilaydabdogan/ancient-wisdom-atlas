canonical_text:
  quote: ''
  summary: Thrand and Onund travel west to Ireland while Balki and Hallvard sail to
    Iceland and occupy land. Eyvind the Easterner welcomes his brother Thrand but
    becomes angry at Onund over Onund's earlier war against King Kjarval. Thrand mediates
    and says he and Onund will share their fortune, after which Eyvind is appeased.
    Thrand and Onund remain with Eyvind through the summer, join his expeditions,
    and Onund is judged very valiant. In autumn they go to the Hebrides, where Eyvind
    transfers to Thrand his share in their father Bjorn's patrimony under a stated
    condition; they remain there through marriage and for some years after.
  language: English
