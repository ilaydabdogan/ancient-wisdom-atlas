canonical_text:
  quote: ''
  summary: At the All-Thing, Grettir's friends argue that his outlawry should be considered
    fulfilled, while opponents argue that later outlaw-like acts should extend it.
    The Lawman Steinn orders inquiry into the timing. Thorir of Gard finds that one
    year should not count, leaving only nineteen years of outlawry. Steinn rules that
    outlawry cannot exceed twenty years, but Grettir cannot be freed before that term.
    The attempt fails for the moment, though release seems likely the next summer.
    Men of Skagafjord pressure Thorbjorn Angle to give up the island or kill Grettir,
    and Thorbjorn seeks means by force or fraud.
  language: English
  quote_policy: summarized
