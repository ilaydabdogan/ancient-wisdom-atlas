canonical_text:
  quote: ''
  summary: Thorkell Krafla visits Asmund at Bjarg and asks about Asmund's sons. Asmund
    describes Atli as likely careful and wealthy, and Grettir as strong but headstrong
    and quarrelsome. Grettir accompanies Thorkell to the Thing, loses his provision-bag,
    quarrels with Skeggi over a sack, kills Skeggi after Skeggi attacks with an axe,
    and is banished for three years after compensation is arranged. On the return
    journey, Grettir lifts a large stone later called Grettishaf.
  language: English
  quote_policy: summarized
