canonical_text:
  quote: ''
  summary: Thorir of Gard hires the outlaw Thorir Redbeard to kill Grettir. Redbeard
    gains lodging with Grettir on Arnarvatn Heath, serves him for two years, then
    fakes storm damage to a boat in order to lure Grettir unarmed into the lake. Redbeard
    attacks Grettir at the shore with a short sword, but Grettir dives back into the
    water, swims unseen to a bay behind him, disarms him, and beheads him. Afterward
    Thorir of Gard prepares a larger attack with about eighty men, while Grim son
    of Thorhall warns Grettir.
  language: English
  quote_policy: summarized
