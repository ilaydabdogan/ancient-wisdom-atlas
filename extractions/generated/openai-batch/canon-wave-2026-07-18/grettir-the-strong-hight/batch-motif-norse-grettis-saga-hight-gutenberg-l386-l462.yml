canonical_text:
  quote: ''
  summary: Onund retaliates against King Harald's official Harekr for seized property,
    while Grim murders Ondott Crow. Signy escapes with her sons and property, then
    seeks punishment of Grim. Onund and Ondott's sons burn Grim and his men in a house,
    later attack jarl Audun, force weregild-like payment from him, and disgrace him
    with a nickname. Further fighting and a Yule quarrel lead Eirik to advise departure
    to Iceland because of royal danger.
  language: English
  quote_policy: summarized
