canonical_text:
  quote: ''
  summary: Thorsteinn Dromund remains honored among the Varangians, marries Spes after
    kinsmen leave the choice to her, prospers with her in Constantinople, and then
    returns with her and followers to Norway. They are welcomed by Thorsteinn's kin,
    have children, and live in honor. Thorsteinn is also received by King Magnus because
    of his fame for avenging Grettir in Constantinople, enters the bodyguard, and
    remains in Norway as years pass and political rule changes.
  language: English
