canonical_text:
  quote: ''
  summary: Thorbjorn Angle travels to the Thing with Grettir's head but, after Halldor's
    advice, allows it to be buried in a sand-hill. At the Thing, Angle claims the
    outlaw reward for killing Grettir, while opponents bring counter-charges that
    Grettir died through witchcraft and sorcery and that Angle killed a man already
    half dead. The court sentences Angle to leave Iceland and denies him the reward.
    Later, Skeggi retrieves the bodies of Grettir and Illugi from Drangey and buries
    them at Reykir; Grettir's bones are later reported to be very large, and his head
    is buried at Bjarg. Asdis remains at Bjarg, and the property later passes to Skeggi
    Short-hand.
  language: English
  quote_policy: summarized
