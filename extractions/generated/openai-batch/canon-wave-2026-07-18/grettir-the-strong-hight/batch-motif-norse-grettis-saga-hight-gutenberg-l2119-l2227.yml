canonical_text:
  quote: ''
  summary: A jarl moves to seize Grettir, but Grettir's allies prepare to defend him.
    Counselors persuade the jarl to accept atonement instead of battle, and Grettir
    is allowed to leave Norway for Iceland. Grettir praises Thorfinn, Thorsteinn,
    and Bersi in verse. The narrative then shifts to Iceland, where Thorgils Maksson
    is killed by the foster-brothers Thorgeir Havarsson and Thormod Coalbrow-Skald
    after a dispute over a whale; Asmund Longhair takes up the resulting blood-feud
    through legal action at the All-Thing.
  language: English
