canonical_text:
  quote: ''
  summary: Grettir visits Audun's home to renew a rivalry after an earlier ball-play
    defeat. Audun returns with curd-bags, trips over Grettir, and throws curds over
    him. The two wrestle violently until Bardi arrives and intervenes. Grettir invokes
    Bardi's unfinished vengeance for Hall, but accepts Bardi's mediation. Grettir
    then offers to accompany Bardi south, and Bardi makes the offer conditional on
    Thorarin's approval.
  language: English
  quote_policy: summarized
