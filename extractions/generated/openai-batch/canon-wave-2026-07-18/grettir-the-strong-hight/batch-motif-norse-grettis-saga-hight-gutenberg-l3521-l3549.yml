canonical_text:
  quote: ''
  summary: The passage resumes the narrative, reports Thorbjorn Oxmain's anger at
    Thorbjorn Slowcoach's death, and describes Asmund Longhair's final illness. On
    his deathbed Asmund assigns his property to Atli, urges kin support, speaks anxiously
    of Grettir's unstable prospects, and predicts possible valor for Illugi. Asmund
    dies and is buried at Bjarg, where he had built a church. Atli then becomes a
    prosperous bondi and travels with companions to acquire dried fish, carrying it
    home on seven horses.
