canonical_text:
  quote: ''
  summary: 'At Thorhallsstad, Thorhall hires the powerful foreigner Thorgaut as winter
    shepherd despite warnings about apparitions. Thorgaut mocks the hauntings and
    later disappears on Yule Eve during a snowstorm; he is found dead at Glam''s cairn
    with his body violently broken. Glam''s haunting then intensifies: people flee
    the farm, an old cowherd is found dead in the cow-house, livestock and animals
    are killed, farms up the valley are raided, and the disturbances lessen in spring
    but return in autumn, ending with the death of Thorhall''s daughter and the threat
    of devastation in Vatnsdal.'
  language: English
  quote_policy: summarized
