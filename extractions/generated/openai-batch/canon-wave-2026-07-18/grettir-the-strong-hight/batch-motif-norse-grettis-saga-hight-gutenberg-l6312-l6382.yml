canonical_text:
  quote: ''
  summary: An old woman performs a ritual over a tree stump by the sea, inscribing
    and blood-reddening runes, speaking spells, and sending the stump toward Drangey
    to harm Grettir. The stump drifts against the wind, is twice rejected by Grettir,
    is eventually carried home by Glaum as fuel, and wounds Grettir when he strikes
    it with an axe.
  language: English
  quote_policy: summarized
