canonical_text:
  quote: He began to howl and to bite the rim of his shield.
  summary: At Yule, Grettir stays with the wealthy bondi Einar, whose daughter Gyrid
    is marriageable. A berserk named Snaekoll arrives with followers and demands that
    Einar hand over Gyrid or defend her. Einar privately asks Grettir for help. Snaekoll
    displays threatening berserk behavior, but Grettir kicks Snaekoll's shield into
    his mouth, drags him from his horse by the helmet, and cuts off his head with
    an axe. Snaekoll's followers flee. Grettir is thanked, stays through Yule, later
    visits his brother Thorsteinn, and recites a verse about the deed.
  language: English
  quote_policy: quoted
