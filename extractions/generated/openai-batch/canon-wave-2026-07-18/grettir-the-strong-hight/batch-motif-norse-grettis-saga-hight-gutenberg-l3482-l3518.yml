  summary: Grettir stays with Thorsteinn through winter and spring. Thorsteinn observes
    Grettir's unusually strong arms and links them to his heavy blows. Grettir acknowledges
    his might but accepts that no one shapes his own fortune. Grettir then mocks Thorsteinn's
    thin arms, and Thorsteinn replies that those thin arms will avenge Grettir someday
    if he is avenged. Grettir doubts this. Later Grettir sails to Iceland, and the
    two part as friends, never to meet again.
