canonical_text:
  quote: With her interest and her wealth she brought it about that both of them were
    released.
  summary: The passage introduces Lady Spes, a wealthy high-born woman in an unhappy
    marriage. She hears Thorsteinn singing from a dungeon, learns that he is confined
    after killing a man to avenge his brother, and asks whether he will accept life
    from her. Thorsteinn refuses release unless his companion is also freed. Spes
    uses money and influence to secure both men’s release, then secretly receives
    Thorsteinn, who later campaigns with the Varangians.
