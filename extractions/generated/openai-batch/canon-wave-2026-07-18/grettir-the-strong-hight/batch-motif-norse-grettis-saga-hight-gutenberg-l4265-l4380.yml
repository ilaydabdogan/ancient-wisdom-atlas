canonical_text:
  quote: ''
  summary: Grettir travels through Langadal and the Vatnsfjord district taking goods,
    food, clothes, weapons, and a horse from local farmers. He sleeps fearlessly near
    a dairy shelter in the forest. Local farmers gather, ambush him while he sleeps,
    overpower and bind him after a hard struggle, and then debate who should keep
    him. Since no farmer will take responsibility, they decide to build a gallows
    and hang him. Thorbjorg of Vatnsfjord arrives, rebukes the farmers, warns them
    against killing a renowned and well-connected man, and releases Grettir after
    he swears not to do violence in Isafjord or avenge his capture. She brings him
    home and cares for him until Vermund returns.
  language: English
  quote_policy: summarized
