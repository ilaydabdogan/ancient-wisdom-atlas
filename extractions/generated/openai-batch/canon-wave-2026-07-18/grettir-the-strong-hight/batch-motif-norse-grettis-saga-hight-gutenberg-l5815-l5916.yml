canonical_text:
  quote: ''
  summary: At the Hegranes Thing, Grettir goes ashore in disguise while others are
    gathered for festivities and wrestling. Calling himself Gest, he is pressed to
    join the games and agrees only if peace and safe-conduct are granted. Haf son
    of Thorarin proclaims an elaborate peace oath protecting Gest during the games
    and his journey home, with sacred and social curses on any violator, and the assembly
    confirms it by joined hands.
  language: English
  quote_policy: summarized
