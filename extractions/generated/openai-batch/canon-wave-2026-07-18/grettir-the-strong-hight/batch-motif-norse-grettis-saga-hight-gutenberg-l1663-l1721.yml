canonical_text:
  quote: ''
  summary: Grettir fights a group of berserks and ruffians, killing several in an
    enclosure, boat-house, and barn while others flee. Exhausted in a cold snowy night,
    he returns to the house by a light set in an upper window. The mistress praises
    him for saving the household and offers reward. The remaining two berserks are
    later found dead from cold and wounds, and the dead are buried by the tide. Grettir
    recites a verse about the twelve buried near the sea, and the mistress honors
    him with the high seat and the best provisions until Thorfinn returns.
  language: English
  quote_policy: summarized
