  summary: After Bjorn dies, Grim the Hersir tries unsuccessfully to claim Bjorn's
    estate, while Ondott Crow maintains that Thrand is the rightful heir. Thrand and
    Onund return from the West to Norway with a favorable wind and arrive before their
    journey is known. Ondott warns Thrand of Grim's likely hostility, advises him
    to take the property and leave the country, and Thrand does so. Thrand asks Onund
    to support his kinsmen and later goes to Iceland, where Ofeig and Thormod welcome
    him and he settles at Thrandarholt. The passage also notes Ofeig and Thormod's
    prior settlement in Iceland and Thormod's descendants.
