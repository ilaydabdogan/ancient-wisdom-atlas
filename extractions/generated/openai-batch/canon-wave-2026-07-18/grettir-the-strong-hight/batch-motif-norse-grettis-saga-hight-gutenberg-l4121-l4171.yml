canonical_text:
  quote: ''
  summary: Grettir rows forcefully after oars are damaged, improvises with spars,
    and later carries a tired ox on his back, impressing onlookers and arousing Thorgeir's
    jealousy. Soon after Yule, Thorgeir plans to attack Grettir as he comes from bathing;
    Grettir throws him down, Thormod tries unsuccessfully to pull Grettir away and
    reaches for a sword, and Thorgils intervenes to stop the fight. In spring the
    men depart, and Grettir travels onward after making a remark about the food at
    Reykjaholar.
  language: English
  quote_policy: summarized
