  quote: ''
  summary: In Constantinople, Spes financially supports Thorsteinn and they become
    attached. Her husband Sigurd suspects she is keeping another man. Spes twice hides
    Thorsteinn during searches, first in a chest and later under clothes, while challenging
    Sigurd's accusations. Later Sigurd pretends to leave but secretly watches; Spes
    and Thorsteinn meet in a sea-edge house with a secret trap-door, and Sigurd brings
    witnesses before entering.
