canonical_text:
  quote: ''
  summary: Thorhall seeks Skapti's counsel because shepherds at his place are injured
    or unable to finish their work. Skapti directs him to Glam, a strong, bold man
    from Sweden. Thorhall meets Glam, who agrees to serve as winter shepherd if allowed
    freedom. Thorhall says the place seems haunted, and Glam says he is not afraid
    of ghosts. Glam later arrives at Thorhallsstad, is disliked by the household,
    works successfully with the sheep, avoids church and mass, and rejects the Christian
    Yule-eve fast despite the mistress's warning that this sin will bring harm.
  language: English
  quote_policy: summarized
