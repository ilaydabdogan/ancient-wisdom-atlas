canonical_text:
  quote: ''
  summary: Haering, a young climber, urges Thorbjorn Angle to take him to Drangey
    so he can attempt the cliff. Thorbjorn offers reward if Haering reaches the island
    and kills or wounds Grettir. Haering is secretly put ashore while Thorbjorn distracts
    Grettir's party at the ladder. Haering climbs to the top by an unprecedented route,
    approaches the brothers with an axe, is noticed by Illugi, flees, and dies after
    leaping over the cliff edge. The place is thereafter called Haering's leap. Thorbjorn
    withdraws and later events note Grettir's continued stay, the death of Skapti
    the Lawman, and the timing of Grettir's outlawry.
  language: English
  quote_policy: summarized
