canonical_text:
  quote: ''
  summary: After a shipwreck near an island, Thorfinn rescues the sailors and hosts
    them. Grettir remains with Thorfinn, visits Audun, and sees a fire on a headland.
    Audun explains that the headland contains the howe of Kar the Old, Thorfinn's
    dead father, whose ghost has driven away other farmers. Grettir opens the grave,
    descends by rope, finds horse bones, a seated dead man, treasure, and a casket.
    He is seized by the howe-dweller, struggles with him, beheads him, and carries
    the treasure back to Thorfinn. Among the treasure is a short sword that Thorfinn
    recognizes as a family heirloom. Thorfinn does not blame Grettir for removing
    buried treasure because Grettir has brought it to him, but says Grettir must display
    prowess before receiving the sword.
  language: English
  quote_policy: summarized
