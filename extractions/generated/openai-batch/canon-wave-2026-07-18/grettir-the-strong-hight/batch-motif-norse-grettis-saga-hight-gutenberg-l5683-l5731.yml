canonical_text:
  quote: ''
  summary: Grettir and a companion travel north in worsening winter weather, acquire
    the talkative vagrant Thorbjorn, called Glaum, and proceed to Reykir. Grettir
    pays Thorvald for assistance in reaching Drangey by night. The island is described
    as grassy, sea-cliffed, accessible only by ladders, supplied with birds and sheep,
    and Grettir settles there after many years as an outlaw.
  language: English
  quote_policy: summarized
