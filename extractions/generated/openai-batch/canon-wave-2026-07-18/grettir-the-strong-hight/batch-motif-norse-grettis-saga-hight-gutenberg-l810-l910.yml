canonical_text:
  quote: ''
  summary: 'The passage introduces Asmund Longhair''s household at Bjarg and his children,
    especially contrasting the accomplished Atli with the difficult young Grettir.
    At age ten Grettir is assigned household tasks: minding geese, rubbing Asmund''s
    back by the fire, and later tending horses. Grettir resists or subverts the first
    two tasks, killing or injuring birds and using a wood-comb on his father''s back.
    His mother rebukes him, and Asmund''s relations with him worsen. The final task
    concerns a weather-wise mare, Keingala, whose refusal to graze is taken as a sign
    of an approaching storm.'
  language: English
  quote_policy: summarized
