canonical_text:
  quote: ''
  summary: Grettir returns home, then travels north, reconciles with Audun by giving
    him a valuable battle-axe, and later visits his uncle Jokull in Vatnsdal. At Tunga,
    the talk centers on Glam's walking. Grettir asks for details and declares his
    intention to go to Thorhallsstad. Jokull warns that dealing with Glam is more
    hazardous than fighting human men and says such goblins are dangerous. Grettir
    remains determined. The two exchange sayings about luck, brave deeds, woe, foresight,
    and the inability to alter what is before them, then part displeased with each
    other's prophetic words.
  language: English
  quote_policy: summarized
