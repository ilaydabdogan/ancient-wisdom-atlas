canonical_text:
  quote: ''
  summary: Two Vikings, Vigbjod and Vestmar, raid around Ireland and the Hebrides.
    Thrand and Onund Treefoot pursue them to Bot with five ships. Onund arranges a
    naval trap in a narrow channel between rocks, draws the Vikings forward by backing
    oars, and has stones launched down on them. In boarding combat, Vigbjod's sword
    becomes fixed in a log placed under Onund's stump, and Onund disables him. Vestmar
    escapes, Vigbjod dies, and Onund's side takes booty.
  language: English
  quote_policy: summarized
