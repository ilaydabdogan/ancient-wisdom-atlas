canonical_text:
  quote: ''
  summary: After a friendly parting from a bondi, Grettir receives news from Grim
    that Atli's blood-money has not been paid and that Asdis may be endangered if
    the feud continues. Grettir keeps his northward journey secret, returns to Bjarg
    at midnight, enters by a back door, and meets his mother. Asdis laments the loss
    and weakness of her sons; Grettir says Atli may yet be avenged. Grettir then remains
    hidden for a time, gathering news, and learns that Thorbjorn Oxmain is at home
    with few men after hay-harvest.
  language: English
  quote_policy: summarized
