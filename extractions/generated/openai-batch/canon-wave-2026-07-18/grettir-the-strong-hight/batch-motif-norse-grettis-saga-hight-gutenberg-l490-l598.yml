canonical_text:
  quote: ''
  summary: Onund Treefoot reaches the western coast of the Skagi peninsula, learns
    that little land remains unclaimed, and accepts land from Eirik Snare, settling
    at Kaldbak. Later, Onund is drawn into a feud after Ofeig Grettir is killed; the
    case is settled by arbitration, weregild, and exile. Onund helps Aud the Deep-Minded
    arrange Olaf Feilan's marriage to Alfdis. The passage then summarizes Onund's
    marriages, sons, natural death, burial in Treefoot's howe, and the later standing
    of Thorgrim Greyhead.
  language: English
  quote_policy: summarized
