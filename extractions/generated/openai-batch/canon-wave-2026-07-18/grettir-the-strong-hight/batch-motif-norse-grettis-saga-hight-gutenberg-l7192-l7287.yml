canonical_text:
  quote: ''
  summary: The passage narrates Spes's public oath ordeal. On the way to church in
    rainy, flooded conditions, a large beggar carries her across a swamp, falls, touches
    her legs with muddy hands, and receives money from her. In church, Spes answers
    Sigurd's accusation with an oath that includes exceptions for her husband and
    the beggar. The oath is accepted publicly, Spes obtains divorce from Sigurd, and
    later people suspect the oath formula and discover that the beggar was Thorsteinn
    Dromund.
  language: English
  quote_policy: summarized
