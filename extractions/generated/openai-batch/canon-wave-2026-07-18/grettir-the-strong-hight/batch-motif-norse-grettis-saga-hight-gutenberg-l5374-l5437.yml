canonical_text:
  quote: ''
  summary: Near midnight a huge troll-wife enters the house where Gest is lying, carrying
    a trough and a large cutlass. She attacks him, and after a destructive struggle
    drags him from the room toward the river and rocks. At a rock by the river, Gest
    frees a hand, draws his short sword, cuts off her right arm, and is released;
    she goes among the rocks and disappears in the waterfall. Afterward he reveals
    that he is Grettir son of Asmund, asks for a priest, and later takes the priest
    to inspect the falls. They see an inaccessible cave beneath the rock above the
    water, and Grettir prepares to descend by rope. The passage also reports a local
    Bardardal variant that the troll-woman was overtaken by dawn and remains standing
    on the mountain in woman-shape.
  language: English
  quote_policy: summarized
