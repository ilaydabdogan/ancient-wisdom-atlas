canonical_text:
  quote: ''
  summary: Thorbjorn Angle seeks help from his old foster-mother Thurid, formerly
    skilled in witchcraft and magic. She has him row to Drangey to confront Grettir,
    then pronounces words depriving Grettir of health, luck, fortune, protection,
    and counsel. Grettir recognizes danger from her spells and throws a stone into
    the boat, breaking her thigh. Thurid later vows vengeance and calls the injury
    the beginning of the brothers' destruction.
  language: English
