canonical_text:
  quote: ''
  summary: Glam threatens a woman to bring his food, eats, and goes out into worsening
    darkness, snow, wind, and storm. He does not return. Searchers later find scattered
    animals, signs of a violent struggle, and Glam dead, blackened and swollen. Attempts
    to bring his body to the church fail, including an attempt with oxen and a later
    attempt with a priest. The body is ultimately buried where it is found under a
    cairn. Afterward Glam is reported restless in the grave, injuring and terrifying
    people, appearing near houses, and riding on rooftops at night.
  language: English
  quote_policy: summarized
