canonical_text:
  quote: ''
  summary: Grettir is set to minding horses in cold snowy weather. Irritated by Keingala's
    habits and her taking the other horses' fodder, he injures and shaves her back
    with a knife, then conceals the matter through evasive answers. Asmund discovers
    the condition of the horse, suspects Grettir, speaks a verse about being cheated
    and mocked, and later has Keingala killed. The passage adds that Grettir played
    many other childish pranks, grew large, had untested strength, made ironic verses,
    slept apart, and was generally silent.
  language: English
  quote_policy: summarized
