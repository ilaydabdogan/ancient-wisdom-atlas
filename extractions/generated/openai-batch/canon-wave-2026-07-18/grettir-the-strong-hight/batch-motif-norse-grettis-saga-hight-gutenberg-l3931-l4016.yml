canonical_text:
  quote: "“Atli's death was unatoned; fully now the debt is paid.”"
  summary: Grettir rides to Thoroddsstad, learns that Thorbjorn is in the hay fields
    with his son Arnor, and confronts them. After Thorbjorn plans for Arnor to attack
    Grettir from behind, Grettir's thrown spear fails, but he kills Arnor and then
    Thorbjorn with his sword. A woman witnesses the fight and reports it; the body
    is carried to the church and the blood-feud passes to Thorodd Drapustuf. Grettir
    tells his mother Asdis, who says the deed begins his outlawry, and he leaves westward
    to visit kin and friends.
  language: English
  quote_policy: quoted
