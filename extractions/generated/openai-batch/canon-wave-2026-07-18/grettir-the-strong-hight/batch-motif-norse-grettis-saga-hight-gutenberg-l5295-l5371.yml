canonical_text:
  quote: ''
  summary: 'At Sandhaugar in Bardardal, a house thought haunted by trolls has suffered
    two disappearances during winter/Yule absences: Thorsteinn the White and later
    an unnamed servant vanish, with blood found at the outer door after the second
    disappearance. Grettir, disguised as Gest and described as accustomed to ghosts
    and spectres, arrives on Yule-eve, offers to remain while Steinvor goes to mass,
    carries Steinvor and her daughter across a flooded icy river, then returns to
    the house and prepares a barricaded night vigil with a light burning. At Eyjardalsa,
    Steinvor says she does not know whether a man or troll carried her, and the priest
    says the helper is a man unlike others who may intend to help.'
  language: English
  quote_policy: summarized
