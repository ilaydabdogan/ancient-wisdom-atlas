canonical_text:
  quote: ''
  summary: At a public gathering, Grettir reveals himself by removing his hood and
    upper garments. The men present debate whether to uphold a declared peace, and
    Hjalti states that Grettir may depart safely until he reaches home. Grettir then
    wrestles first one and then both of the Thords, and observers judge the two together
    no stronger than Grettir alone. The bondis ask Grettir to give up Drangey, but
    he refuses and returns there to Illugi. Later, bondis sell shares in the island
    on the condition that the buyer kill or remove Grettir; Thorbjorn Angle accepts
    the obligation and acquires shares cheaply.
  language: English
  quote_policy: summarized
