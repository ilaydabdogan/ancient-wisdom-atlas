canonical_text:
  quote: ''
  summary: Bardi consults his foster-father Thorarin about Grettir's help, but Thorarin
    warns against bringing Grettir because of his arrogance and ill luck. Grettir,
    angered at being excluded, waits for the wounded returning party, challenges Bardi,
    and is avoided when Bardi refuses pointless combat and gains reinforcements. The
    passage then introduces Thorhall of haunted Thorhallsstad, who has trouble finding
    a shepherd and seeks counsel from Skapti at the All-Thing.
  language: English
  quote_policy: summarized
