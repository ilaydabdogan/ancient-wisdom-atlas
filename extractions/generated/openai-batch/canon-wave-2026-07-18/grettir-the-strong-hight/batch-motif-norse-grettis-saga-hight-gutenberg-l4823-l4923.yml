canonical_text:
  quote: ''
  summary: Gisli, a boastful and ostentatiously armed mariner, discusses with Thord
    the possibility of attacking Grettir for the outlaw bounty. Friends of Bjorn overhear
    and report the plan, and Bjorn warns Grettir. Grettir later overpowers bondis
    who try to stop him taking sheep to his den. Gisli rides north with two men in
    conspicuous red clothing and shining shields, hoping to draw out the forest-man.
    Grettir sees them from his mountain refuge, descends armed, takes Gisli's bag
    of clothes, and provokes a confrontation.
