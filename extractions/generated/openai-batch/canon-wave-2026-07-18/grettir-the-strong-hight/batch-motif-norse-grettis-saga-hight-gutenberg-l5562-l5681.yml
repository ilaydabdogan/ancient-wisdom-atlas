canonical_text:
  quote: ''
  summary: Thorodd, sent away by his father Snorri until he has slain a forest-man,
    is redirected by Geirlaug from killing an outlawed shepherd toward fighting Grettir
    in the mountains. Thorodd attacks Grettir, but Grettir restrains and releases
    him. Snorri approves Grettir's mercy. Grettir then visits Bjarg, admits he can
    no longer live alone, and prepares to go to Drangey with his loyal brother Illugi.
    Their mother Asdis consents reluctantly, gives them money, accompanies them partway,
    and foretells their shared death while warning them against treachery and witchcraft.
  language: English
  quote_policy: summarized
