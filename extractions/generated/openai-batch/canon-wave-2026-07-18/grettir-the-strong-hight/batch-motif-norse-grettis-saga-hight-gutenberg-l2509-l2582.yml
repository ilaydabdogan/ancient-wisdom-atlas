  summary: The passage introduces Thorbjorn Oxmain, his associates, and several related
    households in Hrutafjord. Grettir travels through the district, delays at the
    great stone called Grettishaf, and encounters Kormak's party. A challenge leads
    to a fight. Thorbjorn Oxmain arrives and orders the combatants to separate after
    deaths and wounds occur. The parties depart unreconciled, Slowcoach mocks the
    affair, and relations between Bjarg and Oxmain become strained into a later feud.
