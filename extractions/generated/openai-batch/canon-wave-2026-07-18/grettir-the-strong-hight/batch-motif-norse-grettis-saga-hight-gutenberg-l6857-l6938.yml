canonical_text:
  quote: ''
  summary: Thorsteinn Dromund secretly follows Thorbjorn Angle to Constantinople to
    avenge Grettir. Both seek entry into the Varangian Guards. At a weapon review,
    Angle displays the sword Grettisnaut and boasts that he used it to behead Grettir,
    explaining the damaged edge. Thorsteinn recognizes him, takes the sword, and kills
    him in the assembly. Thorsteinn is arrested, judged according to local law, and
    condemned to a dark dungeon unless ransomed. In prison he sings loudly, giving
    joy to another prisoner who had nearly lost hope.
  language: English
  quote_policy: summarized
