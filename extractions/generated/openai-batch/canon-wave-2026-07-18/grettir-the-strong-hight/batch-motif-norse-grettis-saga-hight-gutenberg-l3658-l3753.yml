canonical_text:
  quote: "“They use broad spear-blades nowadays.”"
  summary: Ali leaves Thorbjorn Oxmain after rough handling and seeks work with Atli
    at Bjarg. Atli lets him remain after Ali works well and appeals for protection.
    Thorbjorn claims Ali as his workman, threatens further conflict, later comes armed
    to Bjarg, hides after knocking, and stabs Atli through the doorway with a broad-bladed
    spear. Atli dies on the threshold; Thorbjorn proclaims the killing and rides home.
    Atli is buried beside his father, and no blood-money is paid because Grettir is
    named as the absent representative.
  language: English
  quote_policy: quoted
