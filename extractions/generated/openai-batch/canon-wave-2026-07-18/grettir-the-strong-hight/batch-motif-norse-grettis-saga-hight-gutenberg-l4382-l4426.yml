canonical_text:
  quote: ''
  summary: Thorbjorg explains why she spared Grettir. Vermund praises her wisdom,
    rebukes Grettir for being captured by churls, and questions him. Grettir answers
    in verse that he had been ransomed and nearly hanged until Thorbjorg saved him,
    invited him home, and gave him a horse, life, and peace. Vermund warns Grettir
    that his life will be great and troubled, says he cannot keep him because of powerful
    enemies, and advises him to seek his kin. Grettir later tries to find shelter
    among leading men in the Western fjords, but obstacles prevent them from taking
    him in.
  language: English
  quote_policy: summarized
