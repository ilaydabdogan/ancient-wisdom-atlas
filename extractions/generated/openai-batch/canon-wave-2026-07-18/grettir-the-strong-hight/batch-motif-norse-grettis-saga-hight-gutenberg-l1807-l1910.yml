canonical_text:
  quote: ''
  summary: A destructive brown bear lives in a sea-cliff cave and harms men, cattle,
    and flocks. Bjorn, a boastful rival of Grettir, fails in a night attempt near
    the den and later throws Grettir's cloak into the bear's cave. Grettir returns
    alone, fights the bear on the narrow path and over the cliff, kills it with his
    sword, retrieves his torn cloak and the severed paw, and displays the paw before
    Thorkell and Bjorn.
  language: English
  quote_policy: summarized
