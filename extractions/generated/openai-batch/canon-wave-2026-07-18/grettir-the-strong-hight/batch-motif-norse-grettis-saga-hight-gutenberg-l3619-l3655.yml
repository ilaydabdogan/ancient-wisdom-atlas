canonical_text:
  quote: ''
  summary: A feud suit over the deaths of Thorir's sons is brought to the Hunavatn
    Thing. Grim and Atli defend themselves by saying the slain brothers had attacked
    wrongfully. Friends urge reconciliation, arbitrators are appointed for both sides,
    and an award sets partial compensation, offsets another killing, banishes Grim
    from his district, and leaves Atli to pay penalties. Atli accepts the award, while
    Thorbjorn remains dissatisfied and hints the matter is not finished. Atli returns
    home and Grim moves south to Gilsbakki.
  language: English
  quote_policy: summarized
