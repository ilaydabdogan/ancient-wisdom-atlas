canonical_text:
  quote: ''
  summary: The passage introduces Thorir of Gard, his sons Thorgeir and Skeggi, and
    a consecrated ship whose head and stem figures are later set over doors and said
    to foretell winds. Thorir sends his sons to Norway. In bad winter weather near
    Stad, Grettir and his companions lack fire and see a fire across a channel. After
    his companions challenge him to fetch it, Grettir swims across with a barrel,
    reaches a house where Thorir's sons and others are drinking around a large fire,
    and enters in a frozen cloak so that the people mistake him for a troll or fiend.
    In the ensuing struggle, firebrands spread fire through the house. Grettir escapes
    with fire and returns to his companions, who praise him and are glad to have fire.
  language: English
  quote_policy: summarized
