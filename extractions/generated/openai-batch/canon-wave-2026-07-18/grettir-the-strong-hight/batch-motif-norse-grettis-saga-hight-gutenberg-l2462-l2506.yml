canonical_text:
  quote: ''
  summary: A large horse-fight is held at Langafit. Atli of Bjarg's valued grey stallion
    is matched against the brown stallion of Kormak and Thorgils. Grettir handles
    Atli's horse, while Odd the Needy-Skald handles the other. During the fight near
    the river, Odd strikes Grettir with a pointed stick; Grettir retaliates by striking
    Odd so hard that he breaks three ribs, and Odd falls into a pool with the horse
    and tethered mares. Armed factions begin to form, but other men intervene and
    separate them. The parties go home angry, and Grettir boasts that they should
    meet again if he had his way.
  language: English
  quote_policy: summarized
