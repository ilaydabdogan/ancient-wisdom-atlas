canonical_text:
  quote: ''
  summary: Grettir travels in disguise on Reykja Heath while avoiding Thorir. Thorir
    gathers men to capture him, but Grettir hides in a hill-dairy, then disguises
    himself as a traveller and directs the pursuers toward swampy marshes. After the
    pursuers are delayed, Grettir rides past Thorir's homestead, sends a taunting
    message through Thorir's daughter, and later withdraws north into the mountains
    while hiding his face.
