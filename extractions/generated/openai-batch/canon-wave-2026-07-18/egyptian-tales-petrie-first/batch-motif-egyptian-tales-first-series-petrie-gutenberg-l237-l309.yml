canonical_text:
  quote: ''
  summary: In Khafra's tale, Uba-aner's wife secretly meets a royal page in a garden
    lodge. A steward informs Uba-aner, who enchants a wax crocodile and has it thrown
    into the lake when the page bathes. The crocodile becomes large, seizes the page,
    and later obeys Uba-aner before King Nebka. Nebka orders the crocodile to keep
    the page and orders Uba-aner's wife burned, with her ashes cast into the river.
    Khufu then orders offerings for Nebka and Uba-aner, calling the episode a token
    of Uba-aner's learning.
  language: English
  quote_policy: summarized
