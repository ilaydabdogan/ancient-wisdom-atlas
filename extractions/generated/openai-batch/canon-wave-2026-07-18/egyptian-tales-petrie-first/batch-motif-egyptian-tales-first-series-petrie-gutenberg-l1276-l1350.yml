canonical_text:
  quote: ''
  summary: Sanehat turns away from the palace and flees through named places, crossing
    a river, hiding near a frontier fortress, travelling by night, and nearly dying
    of thirst before Sati people give him water and milk and pass him onward to Adim.
    After half a year, Amu-an-shi, prince of Upper Tenu, summons and questions him
    about events in Egypt. Sanehat answers evasively, denies wrongdoing, and then
    praises the deceased king’s son as legitimate heir, wise ruler, divine essence,
    fierce warrior, beloved king, and potential source of blessing to obedient foreign
    lands.
  language: English
  quote_policy: summarized
