canonical_text:
  quote: ''
  summary: A wise servant or sailor speaks with his lord after a safe return, then
    narrates a voyage to Pharaoh's mines that ended in a storm and shipwreck. Alone
    on a fertile island, he makes an offering to the gods and encounters a huge gold-and-lazuli
    serpent, who questions him, spares him, explains that God preserved him, foretells
    his return home after four months, and describes his own serpent household and
    a girl burned by heavenly fire. The sailor bows and promises to report the serpent's
    greatness to Pharaoh and bring cultic gifts and sacrifices.
  language: English
  quote_policy: summarized
