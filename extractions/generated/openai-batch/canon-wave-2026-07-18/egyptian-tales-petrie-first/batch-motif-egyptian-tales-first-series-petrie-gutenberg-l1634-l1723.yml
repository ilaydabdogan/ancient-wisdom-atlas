canonical_text:
  quote: ''
  summary: The passage introduces The Adventures of Sanehat through manuscript witnesses,
    translations, and Petrie's view of the tale as historically plausible. It explains
    Sanehat's name as linked to a sacred sycamore, describes his high rank and connection
    to the royal household, proposes an explanation for his panic after Amenemhat
    I's death, summarizes royal succession and the image of the dead king ascending
    as a hawk to the sun, and reconstructs the geography and timing of Sanehat's flight
    from the western Delta across the Nile and frontier into the eastern desert, where
    he is rescued by Sati or Asiatics.
  language: English
  quote_policy: summarized
