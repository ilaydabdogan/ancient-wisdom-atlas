canonical_text:
  quote: ''
  summary: Sanehat is welcomed by the Prince of Tenu, given marriage, land, rank,
    and provisions, and becomes prosperous and militarily powerful. He defeats a Tenu
    champion in single combat. In a petition to King Kheper-ka-ra, he recalls his
    flight and asks forgiveness, return to Egypt, palace appointment, and embalming
    in his birth land as old age and death approach. The king responds with gifts
    and a decree to bring him back to Egypt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Prince of Tenu tells Sanehat that Egypt is happy and settled, promises
    to do good to him, places him before his children, marries his eldest daughter
    to him, and grants him choice land on a border.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The land named laa is described as fertile, with figs, grapes, wine, honey,
    olives, fruit trees, barley, wheat, and many cattle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sanehat receives daily bread, wine, cooked meat, roasted fowl, wild game,
    butter, and milk of many kinds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sanehat passes many years in the land, and his children become great, each
    ruling his tribe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Messengers turn aside to visit Sanehat, and he gives water to the thirsty,
    sets the lost on their way, and rescues the robbed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Prince of Tenu appoints Sanehat for many years as general of his soldiers;
    Sanehat attacks lands, takes cattle, vassals, and slaves, kills people, and is
    loved by his prince for his strength.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A champion of the Tenu comes to Sanehat's tent to challenge him, intending
    to overthrow him and take his cattle for his tribe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sanehat replies that he does not know the challenger, denies prior offense
    against him, frames the challenge as envy, and asks whether God will forget what
    has been ordained.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sanehat rests, strings his bow, readies his arrows, loosens his poignard,
    and prepares his arms before the dawn assembly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At dawn the land of the Tenu gathers its tribes and neighboring people to
    watch the fight; the people are troubled for Sanehat because the adversary has
    a buckler, battle axe, and many javelins.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sanehat draws the adversary into attack, turns aside his arrows, shoots him
    in the neck, drives his lance into him, and raises a victory shout on his back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The men of the land rejoice, Sanehat and the adversary's oppressed vassals
    give thanks to Mentu, and Sanehat carries off the adversary's goods and cattle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: In his petition, Sanehat says he once fled as a fugitive and suffered hunger,
    nakedness, and wandering, but now has a good name, feeds others, wears fine linen,
    possesses serfs, and has a fine house, wide land, and memory established in temples.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Sanehat asks that his flight obtain forgiveness, that he be appointed in the
    palace, that he see the place where his heart dwells, and that his body be embalmed
    in the land where he was born.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Sanehat says return is happiness, states that he has made offering to God
    for this request, and asks that the one afar off may revisit the place of his
    birth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: Sanehat asks the king of Egypt for gracious favor, pays homage to the mistress
    of the land in the palace, and asks to hear news of her children.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Sanehat describes old age and physical weakness, says death draws near, and
    says he will soon be led to the city of eternity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: King Kheper-ka-ra responds to Sanehat's desire by sending royal presents,
    royal sons address Sanehat, and a decree is brought to lead him back into Egypt.
  category: sequence
  evidence_refs:
  - ev:8
