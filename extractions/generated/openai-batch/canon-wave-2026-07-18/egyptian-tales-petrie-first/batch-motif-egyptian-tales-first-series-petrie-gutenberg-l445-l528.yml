candidate_motifs:
- id: motif:1
  label: Hidden sacred designs sought by a king
  taxonomy_refs:
  - wisdom
  basis: The king asks about the designs of the dwelling of Tahuti; Dedi does not
    know their number but knows their hidden location in a chest and names a future
    child who will bring them.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents hidden or restricted knowledge, but does not explicitly
    call the designs forbidden.
- id: motif:2
  label: Divine parentage of future rulers
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  - royal_legitimacy
  basis: Rud-didet is said to have conceived three sons by Ra, and these children
    are promised rule over the land.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The extraction follows the passage's statements without identifying historical
    rulers beyond the names given in the passage.
- id: motif:3
  label: Miraculous multiple birth assisted by deities
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: Ra sends deities to deliver the three children, and the birth of each child
    is accompanied by divine attendance, naming, washing, preparation, and strengthening.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif is identified at the narrative-pattern level; no external parallels
    are asserted.
