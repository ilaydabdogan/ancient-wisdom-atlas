canonical_text:
  quote: ''
  summary: Khufu questions Dedi about the designs of the dwelling of Tahuti. Dedi
    identifies their hidden location and prophesies that the eldest of Rud-didet's
    three sons by Ra will bring them. Ra sends goddesses and Khnumu to assist Rud-didet's
    delivery; the deities disguise themselves, deliver three named children, proclaim
    their kingship, strengthen them, and later hide divine royal diadems in a bushel
    of barley amid a weather marvel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Khufu asks Dedi whether he knows the number of the designs of the dwelling
    of Tahuti.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dedi says he does not know the number, but knows the designs are in a chest
    of whetstone in the plan-room at Heliopolis.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dedi says he is not the one who will bring the designs to Khufu; the eldest
    of three children in Rud-didet's body will bring them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dedi identifies Rud-didet as the wife of a priest of Ra, says she has conceived
    three sons by Ra, and says the god promised that they will reign over the land,
    with the eldest becoming high priest in Heliopolis.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Khufu's heart becomes troubled, and Dedi tells him that Khufu's son and grandson
    will reign before one of Rud-didet's children.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dedi gives the date of Rud-didet's delivery and says he will cause four cubits
    of water at the banks of the canal of Letopolis.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Khufu orders Dedi to live in the house of the royal son Hordedef and to receive
    daily provisions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ra commands Isis, Nebhat, Meskhent, Hakt, and Khnumu to deliver Rud-didet
    of the three children who are to hold royal office and support the deities' temples
    and offerings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The deities take the appearance of dancing-girls, with Khnumu as a porter,
    play music before Ra-user, and enter the birth chamber to help Rud-didet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The first child, addressed by Isis as User-ref, is born into Isis's hands,
    described as one cubit with strong bones, gold-like limbs, and lapis-lazuli-like
    hair; Meskhent declares him a king, and Khnumu strengthens his limbs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The second child, addressed by Isis as Sah-ra, is born with the same extraordinary
    description; Meskhent declares him a king, and Khnumu strengthens his limbs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The third child, addressed by Isis as Kaku, is born with the same extraordinary
    description; Meskhent declares him a king, and Khnumu strengthens his limbs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the delivery, the deities tell Ra-user that three children have been
    born, and Ra-user gives a bushel of barley to their porter as a reward.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Isis proposes doing a marvel for the children; the deities make divine royal
    diadems, place them in the barley, summon clouds with wind and rain, and put the
    barley in a closed chamber.
  category: sequence
  evidence_refs:
  - ev:10
