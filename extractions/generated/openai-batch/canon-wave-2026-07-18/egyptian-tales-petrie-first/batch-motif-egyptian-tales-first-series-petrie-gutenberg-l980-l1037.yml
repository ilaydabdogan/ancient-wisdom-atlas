  summary: The passage gives editorial context for a tale set around Henenseten/Herakleopolis
    and the Sekhet Hemat near the Fayum. It explains the geography, water and salt
    environment, Egyptian path customs, Hemti's encroachment on a path, the resulting
    trespass conflict involving the Sekhti's asses, Hemti's seizure of property, the
    case before Meruitensa and nobles, the damaged eloquent speeches of the Sekhti,
    and the apparent ending in which Hemti's property is given to the oppressed peasant.
  language: English
