canonical_text:
  quote: ''
  summary: The passage introduces Sanehat and his courtly offices. He says he served
    in the household connected with the royal wife Ankhet-Usertesen and the royal
    son Amenemhat. In the thirtieth year, King Sehotepabra dies and is described as
    entering his horizon, flying to heaven, and joining the sun's disc. The palace
    mourns and closes its gates. While the heir Usertesen returns from a campaign
    in Libya with captives and cattle, palace councillors send a messenger westward
    with urgent news, using the image of a hawk soaring with followers and instructing
    secrecy. Sanehat overhears the message, panics, flees, and hides between two bushes.
  language: English
  quote_policy: summarized
