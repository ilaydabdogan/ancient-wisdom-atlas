canonical_text:
  quote: ''
  summary: Rud-didet completes a fourteen-day purification, discovers that brewing
    barley is held in a sealed chamber, and learns of uncanny royal music and performance
    sounds coming from a sack. The sack is secured in nested containers and sealed
    away. After Ra-user returns, the household rejoices. Later Rud-didet beats her
    servant; the servant threatens to report to King Khufu that Rud-didet has borne
    three kings. The servant’s maternal uncle refuses to assist in treachery, strikes
    her, and she is carried away by a crocodile while fetching water. The uncle reports
    this to Rud-didet, who had been grieving over the servant’s threat. The tale then
    breaks off. Editorial remarks identify the text as part of the Westcar papyrus,
    describe its manuscript state and narrative frame, and note that the tales are
    fictitious while preserving traditions about early kings.
  language: English
  quote_policy: summarized
