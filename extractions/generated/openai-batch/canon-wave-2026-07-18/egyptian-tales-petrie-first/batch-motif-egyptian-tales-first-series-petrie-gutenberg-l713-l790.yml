canonical_text:
  quote: ''
  summary: The passage is Petrie's commentary on the tale of Rud-didet and the Khufu
    tales. It connects Rud-didet, Ra, and the first three kings of the Vth Dynasty;
    comments on royal solar titulary, temple endowments, name-play, beauty imagery,
    dancers, purification customs, sealed property, an unfinished plot involving a
    treacherous maid, Khufu, Dedi, and the children, and dates the tale through references
    to Tybi and the Nile inundation. It also compares the marvel-centered Khufu tales
    with later Egyptian narratives such as the tale of the peasant and Sanehat.
  language: English
  quote_policy: summarized
