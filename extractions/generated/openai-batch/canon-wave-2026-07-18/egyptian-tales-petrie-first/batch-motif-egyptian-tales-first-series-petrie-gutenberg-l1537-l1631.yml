canonical_text:
  quote: ''
  summary: Sanehat transfers his goods to his eldest son, travels south toward Egypt,
    is escorted and summoned to the palace, trembles before the king, is recognized
    and praised in a courtly hymn, is freed from fear by the king, receives noble
    status, wealth, Egyptian clothing and grooming, a mansion, daily provisions, a
    pyramid tomb, fields, peasants, and a gold-inlaid statue, and ends by wishing
    to remain in the king's favor until death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanehat makes a feast in Iaa, passes goods to his children, and gives tribal
    leadership, corn, cattle, fruit, and trees to his eldest son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sanehat travels south to the roads of Horus; a garrison officer sends notice
    to the palace, and the king sends an overseer and boats loaded with presents for
    the Sati who conduct Sanehat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sanehat addresses recipients by name, distributes the royal presents as intended,
    exchanges salutations, and reaches Thetu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At daybreak four men summon and lead Sanehat to the palace; he salutes with
    both hands on the ground while royal children and courtiers conduct him toward
    the royal chamber.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sanehat finds the king on a great throne in a hall of pale gold and throws
    himself on his belly before him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the king's presence Sanehat experiences blindness, faintness, bodily failure,
    and loss of heart; the king orders him lifted and asks him to speak and name himself.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king calls Sanehat a desert-wandering old man and speaks of embalming
    his body so that the Pedtiu will not bury him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sanehat answers that terror is in his body like sudden death and says that
    he is before the king, whom he calls life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king tells the queen that Sanehat has come as an Amu produced by the Sati;
    the queen cries aloud, and the royal children deny that this is so before the
    king confirms his identity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The royal children bring collars, wands, and sistra, display them before the
    king, and sing praise invoking divine favor, the king's uraeus, and breath for
    Sanehat the traveller.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The king commands that Sanehat not fear, frees him from terror, appoints him
    a Royal Friend among nobles and courtiers, and sends others to seek wealth for
    him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After Sanehat leaves the palace, the royal children offer him their hands
