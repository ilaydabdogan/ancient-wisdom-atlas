canonical_text:
  quote: ''
  summary: Hordedef tells Khufu of Dedi, an aged man at Dedsneferu who has extraordinary
    powers and knows the designs of the dwelling of Tahuti. Khufu orders Hordedef
    to bring Dedi. Hordedef travels by river, greets Dedi, and brings him to the palace.
    Before Khufu, Dedi refuses to demonstrate on a human prisoner and instead restores
    decapitated animals by magic speech.
  language: English
  quote_policy: summarized
