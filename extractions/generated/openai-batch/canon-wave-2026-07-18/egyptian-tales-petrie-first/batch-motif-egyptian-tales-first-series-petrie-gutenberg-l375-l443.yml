- id: obs:1
  text: Hordedef names Dedi as a man dwelling at Dedsneferu, aged one hundred and
    ten years, who eats five hundred loaves, a side of beef, and drinks one hundred
    draughts of beer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hordedef says Dedi knows how to restore a head that has been smitten off,
    how to make a lion follow with its halter trailing, and the designs of the dwelling
    of Tahuti.
  category: speech
  evidence_refs:
  - ev:1
