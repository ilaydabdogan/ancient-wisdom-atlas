    to Nair customs and to an anecdote of a lady sending clothing to indicate her
    choice.
  claim_level: same_function
  target: Nair-like female selection and clothing-gift indication of choice
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: This comparison is made by the commentator and is social-anthropological
    rather than direct evidence of historical contact.
- id: claim:2
  claim: The passage compares the crocodile's reversion to wax with Aaron's serpent
    becoming a rod when taken up.
  claim_level: same_motif
  target: Aaron's serpent-to-rod reversion
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The wording says the episode reminds the commentator of Aaron; it does
    not claim borrowing or shared origin.
- id: claim:3
  claim: The passage groups the wax crocodile, tomb equipment, ka statues, ushabtis,
    foundation-deposit models, and Setnau's model boat as examples of models believed
    to function as actual realities.
  claim_level: same_function
  target: Egyptian ritual and narrative model-efficacy practices
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is intra-Egyptian and based on the commentator's generalization
