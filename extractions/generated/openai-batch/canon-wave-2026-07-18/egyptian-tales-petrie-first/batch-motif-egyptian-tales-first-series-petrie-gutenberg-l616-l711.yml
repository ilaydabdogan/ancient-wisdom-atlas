candidate_motifs:
- id: motif:1
  label: Efficacious magical model
  taxonomy_refs: []
  basis: The commentary explicitly presents the wax crocodile, tomb models, ushabtis,
    foundation-deposit models, and Setnau's model boat as models believed to act with
    real efficacy.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is extracted from commentary on Egyptian beliefs and narrative examples,
    not from a single continuous narrative action in the supplied passage.
- id: motif:2
  label: Animal-object magical reversion
  taxonomy_refs: []
  basis: The crocodile becomes wax again when taken up by the magician, and the passage
    compares this to Aaron's serpent becoming a rod.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The available motif taxonomy does not contain a precise animal-object
    transformation family; the serpent taxonomy is treated as a symbol rather than
    as the main motif label.
- id: motif:3
  label: Contested female choice under changing social order
  taxonomy_refs: []
  basis: The commentary frames the first tale as involving a clash between female
    predominance in property/descent and a reciter who favors men's rights; it also
    compares the pattern to a lady's selection in Nair country and to priestesses
    of Amen retaining choice.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: This is the commentator's social interpretation of the tale rather than
    a literal plot summary supplied in the passage.
- id: motif:4
  label: Exemplary punishment by burning before women's quarters
  taxonomy_refs: []
  basis: Burning alive is described as a climactic horror placed before the harem
    to intimidate other ladies.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage itself notes that burning alive is rare in Egyptian history
    and may have been introduced for horror rather than probability.
- id: motif:5
  label: Royal boredom relieved by wise entertainment
  taxonomy_refs:
  - wisdom
  basis: Sneferu is described as bored by pleasures; a reward for a new pleasure motivates
    the tale, and the wise man's remedy is a day in the country with rowing entertainment.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage emphasizes amusement
    and practical advice rather than formal wisdom teaching.
- id: motif:6
  label: Funerary offering formula for honored royal dead
  taxonomy_refs: []
  basis: Khufu orders offerings after each tale in honor of the king under whom the
    wonder occurred, and the passage relates this to tomb-tablet offering formulas
    for deceased persons.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is ritual-formula commentary rather than a mythic episode in itself.
- id: motif:7
  label: Tale within a tale of wonders and prophecy
  taxonomy_refs: []
  basis: The last tale is explicitly called double, beginning with Dedi's wonders
    and continuing with the history of children about whom he prophesied to Khufu.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives only a summary of the nested structure and does not
    provide details of the children's later history.
- id: motif:8
  label: Prophecy concerning children before a king
  taxonomy_refs: []
  basis: Dedi is said to prophesy to Khufu about children whose history follows the
    account of his wonders.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not state that the children are miraculous, royal, or
    divinely born, so related taxonomy references are not applied.
