canonical_text:
  quote: ''
  summary: The king orders Meruitensa to prolong the Sekhti's complaint by silence,
    record his speeches, and secretly provide for him and his family. The Sekhti repeatedly
    petitions Meruitensa, is beaten during the process, and continues until the ninth
    appeal. His eloquent complaints are written on papyrus and sent to King Neb-ka-n-ra,
    who values them and delegates judgment to Meruitensa. Meruitensa inventories the
    Sekhti's household and gives him the Hemti's property and offices; the Sekhti
    becomes favored by the king. The accompanying remarks describe manuscript witnesses,
    the lost beginning, and the social conflict between peasant and workman/client
    as the basis of the tale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king tells Meruitensa to prolong the Sekhti's complaint by remaining silent,
    to bring the Sekhti's words in writing, and to provide for the Sekhti's wife,
    children, and the Sekhti himself without revealing the source of the support.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sekhti receives four loaves and two draughts of beer each day through
    Meruitensa's friend, and the wife receives three rations of corn each day through
    the governor of Sekhet Hemat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sekhti comes to Meruitensa repeatedly; at the third request Meruitensa's
    followers seize and beat him with staves, and the Sekhti nevertheless comes again
    up to six times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In one petition the Sekhti addresses the Lord Steward with praise for destroying
    deceit, encouraging justice, and doing right, using images of plenty, clothing,
    clear sky, fire, and water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Meruitensa does not initially heed the complaint; the Sekhti continues until
    the ninth time and fears another beating, but Meruitensa reassures him and says
    his speeches delight the king.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Meruitensa has each petition written on a clean roll of papyrus and sends
