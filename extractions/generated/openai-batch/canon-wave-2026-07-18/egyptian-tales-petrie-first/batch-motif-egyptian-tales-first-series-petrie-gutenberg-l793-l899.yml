canonical_text:
  quote: ''
  summary: A peasant named Sekhti travels with goods and asses from the Sekhet Hemat
    toward Henenseten. Hemti, a workman connected to the domain of the High Steward
    Meruitensa, blocks a narrow tow-path with a shawl, forces Sekhti toward the corn,
    seizes an ass after it eats a cluster of corn, beats Sekhti, and takes his asses.
    Sekhti appeals to Meruitensa, who hears an account, consults nobles, and remains
    silent before Sekhti makes a formal speech praising justice and asking that oppression
    be abolished. Meruitensa reports to King Neb-ka-n-ra that he has found a Sekhti
    excellent in speech whose goods were stolen.
  language: English
  quote_policy: summarized
