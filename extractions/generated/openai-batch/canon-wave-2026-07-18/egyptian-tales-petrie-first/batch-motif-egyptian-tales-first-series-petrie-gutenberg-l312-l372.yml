canonical_text:
  quote: ''
  summary: 'Bau-f-ra recounts a wonder from Seneferu''s reign: Seneferu seeks refreshment,
    follows Zazamankh''s advice to watch harem maidens row on the palace lake, and
    is pleased until a steerer loses a malachite jewel and refuses a replacement.
    Zazamankh magically displaces the lake water, recovers the jewel, restores the
    water, and is rewarded; Khufu then orders offerings for Seneferu and Zazamankh
    after hearing the tale.'
  language: English
  quote_policy: summarized
