canonical_text:
  quote: ''
  summary: Petru rides through a timeless, early-morning region toward Fairy Aurora's
    palace. Using a flute given by Holy Friday, he passes sleeping guardians including
    a one-eyed giant, seven-headed dragons, and lions. At a river of milk with an
    insubstantial bridge, he returns to the giant, repeatedly wakes and enchants him
    to sleep, binds his fingers, and demands an oath that the giant carry him across.
  language: English
  quote_policy: summarized
