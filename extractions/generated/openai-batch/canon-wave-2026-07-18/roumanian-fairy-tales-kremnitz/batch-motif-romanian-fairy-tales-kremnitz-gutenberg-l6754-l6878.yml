canonical_text:
  quote: ''
  summary: A speaking box tells Petru that his brothers Florea and Costan plan to
    kill him, take the water from the Fairy Aurora's fountain, and claim the kingdom.
    Petru breaks the box, returns toward his homeland, ignores the bay horse's warnings,
    and stops to greet his brothers. The brothers use friendly speech to lure him
    toward a deep well; the text then says they go home with the water while the bay
    mourns at the well. At court the water heals the emperor's blindness, and Florea
    and Costan receive the divided empire. After Petru has left Aurora's palace, Fairy
    Aurora awakens, remembers a wondrous human-like visitor, sees a garland on her
    couch, and becomes sad.
  language: English
  quote_policy: summarized
