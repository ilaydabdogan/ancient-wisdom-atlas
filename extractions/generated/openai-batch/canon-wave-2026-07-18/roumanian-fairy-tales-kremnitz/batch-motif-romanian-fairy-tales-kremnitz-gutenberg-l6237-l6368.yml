canonical_text:
  quote: ''
  summary: Petru continues through the hot kingdom of Holy Thursday, resists cold
    springs and enticing maidens, visits Holy Thursday, and is directed toward Holy
    Friday. On the moor before Holy Friday's house, his speaking bay horse identifies
    phantoms as the Whirlwind's daughters and instructs him to distract the Whirlwinds
    with a copper wreath, then petition Holy Friday with a silver wreath. Holy Friday
    initially refuses lodging but opens the window after Petru repeats the instructed
    appeal.
  language: English
