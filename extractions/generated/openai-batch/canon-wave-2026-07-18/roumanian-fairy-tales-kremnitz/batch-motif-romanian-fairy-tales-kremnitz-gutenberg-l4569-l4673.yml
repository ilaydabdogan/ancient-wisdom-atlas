canonical_text:
  quote: ''
  summary: The Poor Boy reaches the other world on an enchanted horse, who becomes
    a prince freed from the Wood Witch's spell. The two share bread and become brothers
    for life, travel through an ageless luminous land to the dragons' palaces, and
    find a singing, weeping maiden in a glass tower. She reveals herself as the Bodiless
    Maiden, explains that the heroes' sisters are held by older dragon brothers, and
    warns that the youngest dragon can be defeated only inside his courtyard after
    withstanding his club-strike against the gates.
  language: English
  quote_policy: summarized
