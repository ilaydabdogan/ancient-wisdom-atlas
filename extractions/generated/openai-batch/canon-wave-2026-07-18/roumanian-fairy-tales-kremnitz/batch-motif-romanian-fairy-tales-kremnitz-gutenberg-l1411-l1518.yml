canonical_text:
  quote: ''
  summary: A childless emperor and empress seek aid for having children. A wise old
    man gives them herbs and foretells that they will have one beautiful son but will
    not keep him long. At birth the crying child is quieted only when the emperor
    promises him youth without age and life without death. At fifteen the learned
    prince demands the promised gift; when told it is impossible, he resolves to wander
    the world to find it. Preparing for departure, he rejects the fine horses and
    discovers a sick speaking horse, which instructs him to recover his father's youthful
    arms and garments and to feed it oats boiled in milk for six weeks. After this
    care, the horse becomes strong, sheds its sores, reveals four wings, and enters
    the prince's service.
  language: English
  quote_policy: summarized
