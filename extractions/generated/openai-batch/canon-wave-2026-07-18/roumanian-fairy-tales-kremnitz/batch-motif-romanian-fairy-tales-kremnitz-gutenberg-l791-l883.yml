canonical_text:
  quote: ''
  summary: A first-person speaker recounts leaving home to satisfy his father’s unfulfilled
    wish. At a crossroads meadow he shelters and feeds a talking fox, who later reveals
    himself as a cursed hero released by that hospitality and becomes the speaker’s
    helper. They enter dragon lands, meet a stolen girl who directs them toward the
    wonderful bird, and at a second dragon palace the speaker mounts a horse and takes
    the caged magic bird. In the frame return, the emperor recognizes the speaker
    as his son and the speaker identifies the poultry-keeper as the girl from his
    tale.
  language: English
  quote_policy: summarized
