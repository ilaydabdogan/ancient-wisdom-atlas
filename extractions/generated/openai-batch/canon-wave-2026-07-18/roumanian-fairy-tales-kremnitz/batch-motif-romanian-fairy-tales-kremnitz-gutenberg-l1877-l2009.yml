canonical_text:
  quote: |-
    "Kikeriki, sir, Kikerikak,
        To me the little purse give back."
  summary: 'The passage concludes a rooster tale: a gentleman tries to destroy or
    trap a rooster, but the rooster swallows treasure, compels the return of a purse,
    returns to the old man enlarged and accompanied by birds and cattle, and produces
    ducats. The old woman tries to imitate this by beating her hen, but receives only
    a glass bead, kills the hen, and remains poor while the old man becomes rich.
    The passage then begins “Mogarzea and His Son,” in which an orphaned lad leaves
    his guardians, follows a forest path to a fire, encounters a giant-like man named
    Mogarzea, claims to have been sent as his son, and is set to tend sheep with a
    boundary warning.'
  language: English
  quote_policy: quoted
