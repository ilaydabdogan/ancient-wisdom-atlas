canonical_text:
  quote: ''
  summary: 'The youngest prince sets a blade-trap beneath the golden-apple tree to
    catch Ileane, but she reverses the trap and drops him into it. She later takes
    the apples to her sisters, impersonates a witch and then a priest at the wounded
    prince''s court, and hears his confession of hostile desire to marry her. The
    passage then turns to the returning emperor''s test of his daughters: Ileane''s
    entrusted flower, bird, and apple remain fresh, while the older sisters'' attempted
    false presentation fails.'
  language: English
  quote_policy: summarized
