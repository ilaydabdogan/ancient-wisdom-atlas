canonical_text:
  quote: ''
  summary: Jack is beaten after the imperial-breed sheep are burned and flees into
    the woods. Lost, hungry, and frightened, he shelters in a hollow tree. A band
    of twelve robbers and their captain camp nearby. They threaten Jack, then learn
    he is the seventh of seven children and force him to find iron-wort, a plant said
    by a witch to open iron locks when found by such a child at dawn. Jack finds the
    gleaming plant, uses it to release a one-eyed robber's handcuff, and the robbers
    become angry when the captain cannot make the plant obey him.
  language: English
  quote_policy: summarized
