canonical_text:
  quote: ''
  summary: Two speaking fish instruct a fisherman to place them in dew under the sun;
    when the dew dries, they have become identical golden-haired twin princes marked
    with golden stars. The rapidly maturing brothers hide their marks under lambskin
    caps, enter the imperial palace despite resistance, and reveal their identity
    through speech and song before the emperor and empress. As their story is sung,
    the empress’s cushions fall away; after the revelation, Laptitza is restored beside
    her husband, the step-mother’s daughter is humbled, and the wicked step-mother
    is punished.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fishermen plan to take the living fish to the emperor as a gift after
    seeing a miracle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One fish says they have just come from the emperor and that being taken there
    would destroy them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second fish tells the fisherman to gather dew from leaves, let the fish
    swim in it, place them in the sun, and return only after the sunbeams have dried
    the dew.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fisherman follows the instructions with the dew and sun, and when he returns
    the fish have become two identical princely boys with golden hair and golden stars
    on their foreheads.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The children grow at an extraordinary rate and after three days and nights
    are twelve years in age, twenty-four in strength, and thirty-six in wisdom.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The twin princes ask to go to their father, are dressed by the fisherman,
    hide their golden hair and forehead stars under lambskin caps, and are taken to
    the imperial palace.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the palace the twins insist on entering while the emperor is at table,
