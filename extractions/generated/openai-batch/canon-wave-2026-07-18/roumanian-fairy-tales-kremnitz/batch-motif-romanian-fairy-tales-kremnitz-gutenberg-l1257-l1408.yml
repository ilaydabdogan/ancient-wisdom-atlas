  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The empress is seated beside the emperor on twelve silk cushions; one cushion
    falls when the princes enter, another after their cryptic speech, a third when
    their song begins, and all are gone by the end of the song.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
- id: obs:10
  text: The twins refuse to uncover their heads, saying that a covered head is a token
    of rank and that they wish to be what they are.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The twins describe themselves as twin brothers from a family broken in two,
    with half in the earth and half at the head of the table, and say they have spoken
    through wind, wood, and water before singing in human language.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: After their song, the twins remove their caps and reveal golden hair and golden
