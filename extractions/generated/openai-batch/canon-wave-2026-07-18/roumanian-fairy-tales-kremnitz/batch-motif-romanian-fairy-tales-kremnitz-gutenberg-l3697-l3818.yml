canonical_text:
  quote: ''
  summary: An emperor catches a fish made entirely of gold. The empress cooks it,
    the royal couple eat it, and a maid-servant sucks a fish-bone from the empress's
    plate. The empress later bears Busujok, while the maid-servant bears Siminok the
    same night; the two boys are indistinguishable and grow up together. The empress
    secretly knots two locks of Busujok's hair to recognize him, Siminok discovers
    the mark, and Busujok decides to leave. Busujok gives Siminok a handkerchief that
    will show three drops of blood if he is dead. When the drops appear, Siminok sets
    out to search for him and hears from an old woman that Busujok has become the
    son of a neighboring emperor.
  language: English
  quote_policy: summarized
