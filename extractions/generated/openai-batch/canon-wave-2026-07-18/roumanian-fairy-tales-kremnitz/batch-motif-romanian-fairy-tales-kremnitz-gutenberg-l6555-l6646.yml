canonical_text:
  quote: ''
  summary: Petru defeats a giant after a long struggle, compels him to carry him across
    a river, and uses his flute to subdue the giant and make fairies and the enchanted
    realm sleep. He enters Fairy Aurora's garden and palace, where everything is beautiful,
    still, asleep, or petrified, passes through forty-eight richly decorated rooms,
    and reaches the forty-ninth chamber containing Fairy Aurora and the famous fountain
    he has sought.
  language: English
  quote_policy: summarized
