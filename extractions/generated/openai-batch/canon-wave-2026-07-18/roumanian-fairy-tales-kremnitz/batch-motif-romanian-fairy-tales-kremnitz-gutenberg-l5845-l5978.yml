canonical_text:
  quote: Before the eyes of the young prince stretched a copper forest--trees, saplings,
    shrubs, bushes, ferns, and flowers of the most beautiful varieties, all made of
    copper.
  summary: Petru rides through a wilderness on a talking bay horse and enters a copper
    forest. Speaking flowers tempt him to gather them, though the bay warns that a
    curse will summon the Welwa of the wood. Petru gathers flowers, a storm and darkness
    arise, and a composite monster appears. Following the bay's advice, Petru fights
    until dawn of the third day and throws the horse's bridle over the Welwa, which
    becomes a beautiful horse. The transformed being says it has been delivered from
    enchantment and is revealed as the bay horse's brother, bewitched by Holy Wednesday.
  language: English
  quote_policy: quoted
