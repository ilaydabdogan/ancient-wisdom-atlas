candidate_motifs:
- id: motif:1
  label: youngest son as third departing hero
  taxonomy_refs:
  - departure
  basis: The passage explicitly says that for the third time a hero departed and identifies
    the departing hero as the youngest son.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage begins mid-story, so the first two heroic attempts are only
    indirectly present here.
- id: motif:2
  label: celestial theft for an intended bride
  taxonomy_refs:
  - sacred_theft
  - divine_beloved
  - mystical_quest
  basis: The prince says he is hurrying to the sun to steal one of its rays, give
    it to the sun's sister, and take her home as his bride.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage reports the intended quest in speech; it does not show the
    theft or establish the sun's sister's nature beyond her celestial relation.
- id: motif:3
  label: cunning woman tests and traps a suitor-like visitor
  taxonomy_refs:
  - wisdom
  - trickster_boundary
  basis: Ileane questions the prince about marvelous feats, controls his entry and
    seating, and the seat drops him into the treasure cellar.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not state that the questions are formal riddles or a
    marriage trial, though the language of banquet, kisses, love-making, and bridegroom
    seat suggests a courtship setting.
- id: motif:4
  label: false accusation and humiliating expulsion
  taxonomy_refs:
  - divine_judgment
  basis: Ileane accuses the prince of being a cellar intruder, pronounces judgment,
    and orders twelve punished girls to carry him out and kiss him at the frontier.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The judgment is royal or household justice within the tale, not explicitly
    divine judgment; taxonomy fit is tentative.
- id: motif:5
  label: revenge through feigned illness and luring errands
  taxonomy_refs:
  - trickster_boundary
  basis: The older sisters pretend sickness to induce Ileane to go to the princes'
    court, where she performs risky errands for food, wine, and apples.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The immediate motive is the princes' revenge plan, while Ileane's own
    intention is presented as sisterly help.
- id: motif:6
  label: trickster infiltration by false summons
  taxonomy_refs:
  - trickster_boundary
  - wisdom
  basis: Ileane enters the princes' kitchen and cellar and sends the head-cook and
    head-butler away by falsely claiming the emperor calls them, then takes the desired
    provisions and destroys the remainder.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents the deception as clever action but does not give
    an explicit moral evaluation.
- id: motif:7
  label: triple escalation of attempts and errands
  taxonomy_refs: []
  basis: 'The passage marks a third heroic departure and then shows three revenge
    errands directed at Ileane: food, wine, and apples.'
  evidence_refs:
  - ev:2
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The third errand begins in this passage but is not resolved within the
    selected line range.
- id: motif:8
  label: sisterly loyalty expressed as ordeal-readiness
  taxonomy_refs:
  - sacrifice
  basis: Ileane repeatedly goes on errands because she would do anything for her sisters
    and says she would go through fire and water for them.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: medium
  cautions: No actual self-sacrifice through fire or water occurs in this passage;
    the ordeal language is spoken as a pledge.
