canonical_text:
  quote: '"I''m hurrying to the sun to steal one of its rays"'
  summary: The youngest prince reaches Ileane's palace and declares a quest to steal
    a ray from the sun for the sun's sister, whom he intends to marry. Ileane tests
    him with impossible transformations, tricks him into falling into a treasure cellar,
    accuses him, judges him, and has him carried out of the country by twelve punished
    girls who each kiss him. The princes then try to take revenge by using Ileane's
    older sisters to lure her to their court. Ileane repeatedly comes for food and
    wine, tricks household officers with a false imperial summons, takes what she
    came for, and spoils the rest. The passage ends as both sisters ask her to bring
    two apples from the princes.
  language: English
  quote_policy: quoted
