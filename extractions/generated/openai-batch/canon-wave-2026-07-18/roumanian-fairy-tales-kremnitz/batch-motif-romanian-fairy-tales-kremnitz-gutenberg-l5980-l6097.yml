canonical_text:
  quote: ''
  summary: 'Petru continues through a sequence of marvelous metallic forests. In the
    Silver Wood he ignores a warning, gathers flowers into a wreath, fights the Welwa
    of that wood for three days and nights, and bridles it. At the Gold Forest, despite
    warnings from the horses and the bay, he again gathers flowers. A more terrible
    ordeal follows: the Gold Forest Welwa appears first as dense fog and then as a
    water-like force, while Petru fights blindly for extended periods and prepares
    for the enemy’s next approach.'
  language: English
  quote_policy: summarized
