canonical_text:
  quote: ''
  summary: The passage lists the contents of the collection and begins the tale “Stan
    Bolovan.” Stan and his wife grieve because they have no children. After prayers,
    masses, and consultations with witches do not bring children, two travelers, revealed
    by the narration as angels in disguise, are hospitably received and grant Stan
    three wishes. Stan asks only for children, despite a warning that there may be
    too many. On returning home he finds about a hundred children belonging to him.
    Joy is followed by scarcity, and Stan leaves to seek food for them. Near the end
    of the world he sees a sheep-fold, seven shepherds, and a flock of sheep.
  language: English
  quote_policy: summarized
