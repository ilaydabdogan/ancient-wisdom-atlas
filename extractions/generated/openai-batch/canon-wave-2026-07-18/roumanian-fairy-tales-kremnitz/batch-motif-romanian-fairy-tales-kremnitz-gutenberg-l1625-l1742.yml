canonical_text:
  quote: "“We seek Youth without Age and Life without Death.”"
  summary: The prince and his speaking horse reach the final peril before the palace
    of Youth without Age and Life without Death. They leap over a forest guarded by
    wild animals, are saved by the palace mistress, and are received by her and her
    two elder sisters. The prince marries the youngest fairy and lives there without
    aging, but is forbidden to enter the Valley of Lamentation. While hunting a hare
    he accidentally crosses it and is overcome by longing for his parents. The ladies
    warn that his parents died centuries earlier and that he may perish if he leaves,
    but he departs with the horse under a condition. On the return route, former wild
    lands and the Scorpion Witch’s country have become settled places remembered only
    in ancestral tales.
  language: English
  quote_policy: quoted
