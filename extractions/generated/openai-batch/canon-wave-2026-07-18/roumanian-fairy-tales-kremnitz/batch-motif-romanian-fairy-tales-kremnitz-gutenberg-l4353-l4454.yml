canonical_text:
  quote: ''
  summary: The Poor Boy reaches a witch's domain near the frontier of the other world.
    The witch's house is surrounded by skull-bearing poles, trees, clear water, and
    a forest edge. Inside, she has a cauldron over smokeless fire and uses a giant's
    shin-bone. She contracts with the Poor Boy to watch her drove for a year in exchange
    for a horse, with his head forfeit if he loses the herd. The witch secretly instructs
    the mares about sleep-inducing water. The Poor Boy drinks, sleeps, and loses the
    herd, then summons wasps with a token from a Wasp Queen; they recover the horses
    once, but after the second loss they report the herd is not on earth and must
    be in the sea.
  language: English
  quote_policy: summarized
