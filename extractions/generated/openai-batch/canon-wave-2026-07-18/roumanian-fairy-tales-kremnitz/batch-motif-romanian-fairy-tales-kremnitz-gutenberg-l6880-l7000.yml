canonical_text:
  quote: ''
  summary: Fairy Aurora discovers that bread, wine of youth, and water from her fountain
    have been taken. She orders her guards to pursue Petru, but he has escaped beyond
    her realm. The Sun searches for him and fails. Aurora darkens the world until
    the thief returns. The emperor sends his sons Florea and Costan; each falsely
    presents himself and is blinded. Aurora then releases or reassigns her subjects,
    alters the functions of flowers, winds, springs, and sunbeams, stops the wheel
    bearing the threads of human life, and hides herself in the darkest corner of
    her palace.
  language: English
  quote_policy: summarized
