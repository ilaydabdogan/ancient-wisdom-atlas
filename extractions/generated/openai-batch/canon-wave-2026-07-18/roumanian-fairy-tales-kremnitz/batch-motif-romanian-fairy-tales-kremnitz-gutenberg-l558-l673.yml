canonical_text:
  quote: ''
  summary: The passage closes an episode in which Stan Bolovan survives a dragon's
    night attack by using a trough as a decoy, then manipulates the dragon into carrying
    sacks of ducats home and frightens him away with the sight of Stan's hungry children.
    It then begins "The Wonderful Bird," where a pious emperor cannot complete a richly
    adorned church because its steeple keeps falling; after proclamations and prayers,
    he dreams that the church can be finished if the wonderful bird from the other
    shore is brought and its nest placed in the steeple. His three sons offer to undertake
    the mission, and the oldest is chosen to go first.
  language: English
  quote_policy: summarized
