  quote: He had been too obedient, obstinately obedient.
  summary: Jack remains silent when a cart loses parts because his master ordered
    him not to speak; the cart breaks, and the farmer dismisses him. Jack wanders,
    is hired as a shepherd, receives instructions about fire and the fold, then interprets
    them literally by making a fire in the sheepfold entrance and driving the sheep
    through it, setting the fold ablaze.
  language: English
