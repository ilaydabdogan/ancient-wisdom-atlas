canonical_text:
  quote: ''
  summary: An elder prince and then a second prince set out to find a wonderful bird;
    each refuses the request of a magical fox and is transformed to stone. The youngest
    prince persuades his father to let him depart on the same quest. Later the older
    sons return with the magic bird and a young girl. The bird supports the completion
    of a church steeple but remains silent except when an unknown shepherd enters
    the church. The emperor orders the shepherd brought to him and asks why the bird
    sings only in his presence; the shepherd begins to tell his story.
  language: English
  quote_policy: summarized
