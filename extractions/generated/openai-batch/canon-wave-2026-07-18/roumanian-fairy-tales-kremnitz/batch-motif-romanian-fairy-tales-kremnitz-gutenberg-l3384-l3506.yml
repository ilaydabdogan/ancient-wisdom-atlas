canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a chain of grief and comic disaster beginning
    at a well and ending with an emperor becoming a monk. It then begins “The Pea
    Emperor”: a poor wanderer finds three peas, imagines becoming rich, convinces
    an emperor he is wealthy through boasting, marries the emperor’s daughter, falls
    into shame when no wealth appears, and enters a conditional bargain with a rosy-cheeked
    stranger involving nine riddles, property, and his first child. An old man then
    enters his service and directs a grand journey as the Pea Emperor’s steward.'
  language: English
  quote_policy: summarized
