canonical_text:
  quote: ''
  summary: Florea and Costan each attempt to pass a dragon at a bridge and disappear
    after fleeing. Petru, the emperor's youngest son, also confronts the dragon but
    returns for a better horse. His nurse Birscha directs him to recover a remnant
    of the horse his father rode in youth; through incense, charms, and striking the
    house pillars with an old bridle, a splendid speaking bay horse appears. Mounted
    on this horse, Petru gains strength and courage, receives tactical instructions,
    leaps over the bridge-dragon, cuts off its head, and crosses the bridge.
  language: English
  quote_policy: summarized
