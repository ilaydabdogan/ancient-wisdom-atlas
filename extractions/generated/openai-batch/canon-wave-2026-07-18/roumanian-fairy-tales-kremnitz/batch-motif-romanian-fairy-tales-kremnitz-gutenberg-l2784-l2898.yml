canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a princess is reprieved from
    hanging, reconciles with the fisherman as her husband, and returns home with him.
    A new tale, “Little Wild-Rose,” begins with a wonder-tale opening. An elderly
    childless couple grieves over having no heir despite religious and magical attempts.
    The old man leaves home to seek a child, enters a dense forest and dark cave with
    repeated Christian gestures toward the east, encounters an ancient praying hermit,
    explains his childlessness, and receives a blessed apple cut into two halves for
    himself and his wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Onlookers stand motionless and weep with joy as the hangman removes a noose
    from the prisoner's neck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fisherman asks the royal maiden three times whether she will call him
    “fisherman” again; the princess apologizes, calls him her dear husband, and promises
    not to repeat it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fisherman says the royal maiden is his wife, takes her by the hand, and
    they go home together; the tale states they live in peace and happiness.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The new tale begins by saying something extraordinary happened at a time when
    wolves rested with sheep, shepherds feasted with emperors and kings, and one sun
    rose while another set.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old man and his older wife have never had a child; the wife is compared
    to the Friday-goddess or Venus, and their childless home is described as grief-filled.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old man has given alms, arranged liturgies, brought white-bearded priests,
    and had masses and prayers read; the old wife has consulted witches, magicians,
    and enchanters, but all efforts have failed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man asks his wife for provisions, declares that he will travel through
    the world to find a child and heir, and says he will not return home if he finds
    no child.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old man leaves with a knapsack, reaches a dense forest of intertwined
    trees and bushes, makes the sign of the cross and prostrates himself toward the
    east, then enters and eventually reaches a very dark cave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Inside the cave the old man sees a light and an ancient hermit with a long
    white beard; the hermit stands by an old psalm-book and a wax candle, absorbed
    in prayer, and uses a crutch to signal the old man to stand aside.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The old man tells the hermit that he and his wife have no children and desire
    an heir; the hermit blesses an apple, cuts it in two, and instructs him to give
    one half to his wife and eat the other himself.
  category: action
  evidence_refs:
  - ev:8
