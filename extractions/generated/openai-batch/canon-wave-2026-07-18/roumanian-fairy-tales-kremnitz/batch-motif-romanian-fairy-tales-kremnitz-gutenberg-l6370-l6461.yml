canonical_text:
  quote: ''
  summary: Petru visits Holy Friday, who receives him hospitably and recounts her
    primordial beauty, aging, and grievance against Fairy Aurora. Holy Friday assigns
    Petru to fetch a jug of rejuvenating spring water from Fairy Aurora's guarded
    kingdom, gives him a flute that puts hearers to sleep, instructs him how to proceed
    with his horses, warns him not to look at Aurora, and Petru continues his journey
    after leaving the bay horse behind.
  language: English
  quote_policy: summarized
