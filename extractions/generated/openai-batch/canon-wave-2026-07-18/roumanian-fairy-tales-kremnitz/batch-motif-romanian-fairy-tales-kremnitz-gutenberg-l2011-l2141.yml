canonical_text:
  quote: ''
  summary: Mogarzea tells the youth that he is a prince whose soul was taken by wicked
    elves while he was traveling to the Sweet-milk Lake to marry a fairy. The youth
    later enters the elves' meadows with Mogarzea's sheep, plays his flute while three
    maidens or elves dance, tricks the elves with a broken flute and a seven-year-old
    cherry tree, traps their fingers in the trunk, obtains Mogarzea's soul from a
    bottle, and restores it. Mogarzea rewards him with directions concerning the Milk
    Lake and a fairy wife, then brings the trapped elves to his father's kingdom,
    where the youth is thanked.
  language: English
  quote_policy: summarized
