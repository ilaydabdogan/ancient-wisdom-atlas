canonical_text:
  quote: ''
  summary: The passage closes one tale with an emperor punishing two older princesses,
    praising Ileane, consenting to Ileane's marriage to a neighboring emperor's son,
    and narrating Ileane's use of a sugar-doll double to survive the prince's wedding-night
    attack before reconciliation and peaceful rule. It then opens another tale in
    which a princess repeatedly buys fish from a young fisherman, signals love, gives
    him money for fine clothes, proposes marriage, and obtains her father's betrothal
    consent.
  language: English
  quote_policy: summarized
