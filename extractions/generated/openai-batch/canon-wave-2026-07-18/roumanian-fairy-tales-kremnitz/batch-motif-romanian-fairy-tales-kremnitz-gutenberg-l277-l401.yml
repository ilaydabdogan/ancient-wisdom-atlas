canonical_text:
  quote: ''
  summary: Stan Bolovan seeks work at a sheep-fold and learns that a dragon comes
    every midnight to take livestock and milk for an old she-dragon's rejuvenating
    bath. Stan bargains with the shepherds to free them from the dragon, confronts
    the dragon, and deceives it in a strength test by squeezing cheese as if it were
    a stone. The frightened dragon offers Stan service with his mother for rich wages.
    Stan follows him to the old she-dragon, who has prepared a cauldron for a healing
    mixture and plots with her son to get rid of Stan.
  language: English
  quote_policy: summarized
