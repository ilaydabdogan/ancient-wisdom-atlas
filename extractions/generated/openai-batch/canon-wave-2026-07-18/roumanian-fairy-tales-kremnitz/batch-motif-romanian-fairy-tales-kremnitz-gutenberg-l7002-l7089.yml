canonical_text:
  quote: Human life was at a stand, time ceased to move.
  summary: 'A supernatural crisis follows Fairy Aurora''s anger: light fades, time
    stops, monstrous beings hide or guard a bridge, Holy Friday sends winds to remove
    a frontier veil and then to find Petru. The violent whirlwinds fail, but the Spring
    wind discovers Petru and his bay at the bottom of an empty well; Holy Friday sends
    for a gold crucible and the water of life.'
  language: English
  quote_policy: quoted
