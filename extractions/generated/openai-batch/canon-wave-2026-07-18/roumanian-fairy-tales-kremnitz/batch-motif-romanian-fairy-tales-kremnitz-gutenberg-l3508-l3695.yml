canonical_text:
  quote: ''
  summary: A royal party inspects the Pea Emperor’s apparent estates and the palace
    of the nine dragons. At night the old servant answers a sequence of numbered riddles
    in his master’s place and uses a formula against the dragons; in the morning the
    nine dragons are dead and a voice says compassion saved the Pea Emperor. A new
    tale begins with a childless emperor and empress seeking help; after almsgiving,
    prayer, and fasting, the empress dreams that the Lord promises a child and instructs
    that a fish from the brook be prepared and eaten.
  language: English
  quote_policy: summarized
