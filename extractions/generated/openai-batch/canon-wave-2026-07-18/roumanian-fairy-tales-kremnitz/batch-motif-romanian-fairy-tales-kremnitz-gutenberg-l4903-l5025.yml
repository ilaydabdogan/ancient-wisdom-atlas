canonical_text:
  quote: ''
  summary: Jack insists on going with his father to the fair despite a warning that
    he may be lost. On the journey he misunderstands the cart wheels, moving visual
    scenery, and echoes, leaves the cart, takes a wrong road, wanders through woods
    and meadows, repents, and reaches an unfamiliar village. A peasant takes him into
    service as a plow-boy. Later Jack misunderstands an order to grease the cart,
    uses the grease on the wrong parts, and is punished until he learns that cart
    axles are to be greased.
  language: English
  quote_policy: summarized
