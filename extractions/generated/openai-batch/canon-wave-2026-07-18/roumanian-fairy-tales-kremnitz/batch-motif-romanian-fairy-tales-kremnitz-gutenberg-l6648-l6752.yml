canonical_text:
  quote: ''
  summary: Petru finds Fairy Aurora asleep beside her fountain, keeps the palace asleep
    with a magic flute, bites her three times, eats the bread of strength, drinks
    the wine of youth, places a golden wreath on her brow, and fills a jug with fountain
    water. The garden becomes renewed, and Petru flees pursuers. He gives water to
    Holy Friday, receives warnings and an enchanted protective handkerchief from Holy
    Thursday, and consults an enchanted box that reports anger from Fairy Aurora,
    Holy Friday, and his brothers.
  language: English
  quote_policy: summarized
