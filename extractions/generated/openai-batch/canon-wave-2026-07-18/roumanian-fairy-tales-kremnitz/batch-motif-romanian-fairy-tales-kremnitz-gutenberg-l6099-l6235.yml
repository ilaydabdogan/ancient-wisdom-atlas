canonical_text:
  quote: ''
  summary: Petru confronts the Welwa in an indescribable, inverted form, fights until
    nearly exhausted, and follows the bay horse's instruction to subdue it with a
    bridle. The Welwa is released from enchantment and becomes Petru's fourth horse.
    Petru retrieves copper, silver, and gold wreaths after the bay warns him not to
    discard them. He then enters Holy Wednesday's freezing domain, resists warming
    himself at roadside fires despite enticing calls, and receives a magic casket
    that reports true news. The casket tells him his father is troubled by Costan
    and Florea, who are trying to take the scepter. Petru hurries onward, and the
    bay warns of a coming heat ordeal.
  language: English
  quote_policy: summarized
