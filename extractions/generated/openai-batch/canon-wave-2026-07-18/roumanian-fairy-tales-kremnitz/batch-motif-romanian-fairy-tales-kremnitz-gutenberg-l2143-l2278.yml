canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a boy journeying to the Sweet-milk/Milk
    Lake in a fairy kingdom, using flute-playing to approach a dancing fairy, taking
    the rose from her head, marrying her, and later returning yearly to the lake with
    their children. It then begins “Cunning Ileane”: an emperor with three daughters
    departs for war after giving each daughter a flower, bird, and apple as signs
    of faithfulness. The neighboring emperor’s sons plan to make the daughters faithless;
    the first and second princes wait at the older princesses’ windows and steal kisses
    after being redirected toward the youngest sister.'
  language: English
  quote_policy: summarized
