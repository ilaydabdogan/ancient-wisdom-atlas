canonical_text:
  quote: ''
  summary: A griffin swallows little Wild-Rose, after which she reappears more beautiful.
    The griffin then raises her in a flower-and-moss chamber in a forest tree. When
    Wild-Rose first looks out into the world, a wondrous light like a second sun appears
    and nature rejoices. At fourteen she remains unseen by humans until an emperor's
    son, pursuing a deer during a hunt, reaches the untrodden forest, finds the tree
    and the young griffins, is dazzled by Wild-Rose's radiance, faints, and leaves
    filled with love and longing.
  language: English
  quote_policy: summarized
