canonical_text:
  quote: ''
  summary: At a deserted well, Holy Wednesday, Holy Friday, and Holy Thursday gather
    Petru's bones and ashes, prepare a life-giving salve with dew, fire, spells, ashes,
    and the herb of life, and restore him. Petru rides his speaking bay horse to the
    ruined emperor's court, learns what has happened from old Birscha, and returns
    to Fairy Aurora's kingdom. He crosses the bridge, kisses Aurora, and enters her
    palace. The natural and solar world is renewed, Petru marries, brings his parents,
    becomes emperor of both kingdoms, and his brothers' sight is restored.
  language: English
  quote_policy: summarized
