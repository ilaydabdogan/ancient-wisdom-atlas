canonical_text:
  quote: ''
  summary: A widower's virtuous daughter is mistreated by her stepmother and stepsister,
    falsely accused, and sent away from home by her father. On the road she helps
    a sick dog, a caterpillar-covered pear-tree, a ruined fountain, and a dilapidated
    oven, each of which asks for care and promises future reward. After continuing
    through a dark forest, she reaches a meadow with a vine-covered house, where an
    old woman greets her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old widower with one daughter marries a widow who also has one daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The widow's daughter is described as ugly, lazy, obstinate, and spiteful,
    while the old man's daughter is described as beautiful, industrious, obedient,
    and good.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stepmother and stepsister persecute the old man's daughter and assign
    her hard work, including gathering dry wood, carrying grain to the mill, and constant
    household labor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At village spinning, the old man's daughter completes a whole sieve of spools,
    while the widow's daughter completes only one and then falsely claims the work
    as her own.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The widow's daughter is allowed to attend village amusements, while the stepdaughter
    is denied them; the stepmother tells the father that the stepdaughter is disobedient
    and should be sent away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father is portrayed as dominated by his wife and tells his daughter she
    can no longer remain in his house, advising her to be obedient, humble, and industrious
    among strangers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The girl kisses her father's hand with tears, leaves home with no hope of
    returning, and meets a sick, thin dog on the road.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dog addresses the girl as beautiful and industrious, asks her to care
    for it, promises a future reward, and is washed and cleaned by her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A pear-tree in bloom, covered with caterpillars, asks the girl to care for
    it and promises repayment; she removes dry branches and caterpillars.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A ruined fountain asks for care and is cleaned by the girl; a dilapidated
    oven asks to be lined with stones and cleaned, and she repairs and cleans it.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The girl walks day and night, misses her way, keeps trust in God, passes through
    a dark forest, reaches a meadow, sees a vine-covered little house, and is greeted
    by an old woman.
  category: sequence
  evidence_refs:
  - ev:9
