canonical_text:
  quote: ''
  summary: The passage ends one tale in which people are called by an unseen person
    or voice and disappear, with one man finally falling into a chasm that later cannot
    be found. It then begins another tale about a childless old couple who adopt a
    mouse as their child; the mouse dies in a pot of boiling buttermilk or porridge,
    and the couple and a magpie react with mourning gestures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife hears a call, says she is coming, and looks for her fur jacket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Her husband seizes her by the hand, warns her not to go if she does not want
    to die, and bolts the room doors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife escapes by slipping out of her fur sack and runs away while crying
    that she is coming.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After many years, the husband, while at the barber, addresses an unseen caller,
    refuses to come, seizes the barber's razor, and runs after the person he says
    is calling him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The barber follows the man, and the man falls into a chasm outside the town
    and does not come out again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The barber reports the event; people then believe that those who had vanished
    fell into the gulf, but a later crowd finds only a broad plain where the gulf
    was expected.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: An old man and an old woman have no child and lack help even for lighting
    the fire after field work.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old man and old woman go in different directions to seek a child; he finds
    a dog, and she finds a mouse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The couple agrees to adopt the mouse as a child and to drive the dog away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old woman makes a fire, sets sour buttermilk or porridge to boil, and
    leaves the mouse to watch the pot while the couple works in the fields.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The porridge splashes over the pot; the mouse warns it not to jump on him
    and then jumps into the pot.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old couple returns, cannot find the mouse child, eats the porridge, and
    discovers the dead mouse at the bottom of the dish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old man tears his beard and the old woman pulls hair from her head in
    grief.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A magpie perched in a tree asks the old man why his beard is pulled out and
    then tears out its own feathers after hearing about the mouse child's death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The old woman goes to the well for water to wash the dead body of the mouse
    child.
  category: action
  evidence_refs:
  - ev:9
