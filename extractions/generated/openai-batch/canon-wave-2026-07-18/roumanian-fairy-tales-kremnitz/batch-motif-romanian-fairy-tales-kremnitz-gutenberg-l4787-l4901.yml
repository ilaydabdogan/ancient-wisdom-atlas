canonical_text:
  quote: ''
  summary: The passage concludes a tale in which the Poor Boy fights an invisible
    dragon, receives advice from a princess that lets him see the dragon, crushes
    the dragon, is healed by the princess's kiss, returns on an enchanted horse with
    his bride, and is rewarded with marriage and a share of the empire. The passage
    then begins the tale of Mother's Darling Jack, describing Jack as the youngest
    of seven, especially loved by his mother, spoiled, disobedient, and unwilling
    to learn practical work.
  language: English
  quote_policy: summarized
