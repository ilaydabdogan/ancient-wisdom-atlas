canonical_text:
  quote: ''
  summary: The plotting step-mother causes the emperor to be drawn away to war. During
    his absence Laptitza gives birth to identical twin princes with golden hair and
    a golden star on each forehead. The step-mother replaces them with puppies, buries
    the children, and Laptitza is punished. The twins persist through transformations
    into aspens, bedsteads that speak, sparks, and golden-scaled fishes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The step-mother sends to her brother in a nearby kingdom, asking him to come
    with soldiers and summon the emperor to war.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The emperor goes to battle and returns at dawn on the third day, wanting to
    know what happened while he was absent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At dawn on the third day, Laptitza gives birth to two beautiful twin princes,
    exactly alike, each with golden hair and a golden star on his forehead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The step-mother puts two puppies in place of the twins and buries the golden-haired
    children at the palace corner under the emperor's windows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The emperor sees the puppies, believes Laptitza has not kept her promise,
    and orders her buried to the breast in the earth as punishment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the punishment, the emperor marries a second time, and the passage states
    that God's blessing does not rest upon unjust deeds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Two aspens spring up where the twin princes were buried; the step-mother wants
    them removed, but the emperor orders that they be allowed to grow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The aspens grow with extraordinary speed until their boughs reach the emperor's
    window, and the emperor listens to their rustling.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The empress persuades the emperor to allow the aspens to be cut down, with
    one made into a bedstead for him and the other for her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The emperor sleeps well on his bed, while the empress feels as if she is lying
    on thorns and nettles and cannot sleep.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The beds creak and speak; the bed under the emperor says it is happy because
    the beloved father rests on it, while the other says it bears a wicked soul.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The empress replaces the aspen beds, burns the originals, collects their ashes,
    and scatters them to the winds over nine countries and seas.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Two sparks from the burning beds fall into the deep river and become two identical
    little fishes with golden scales; imperial fishermen later net the fishes at dawn.
  category: sequence
  evidence_refs:
  - ev:11
