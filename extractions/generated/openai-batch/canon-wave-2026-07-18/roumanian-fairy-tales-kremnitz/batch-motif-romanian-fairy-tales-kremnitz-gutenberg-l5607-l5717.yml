    improve.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The emperor explains that one eye laughs because of his sons and the other
    weeps because he fears they may not protect the country; he asks for water from
    the Fairy Aurora's fountain to bathe his eyes.
  category: speech
  evidence_refs:
  - ev:8
