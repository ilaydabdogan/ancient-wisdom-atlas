    children escaping safely.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The next tale introduces a great emperor with a vast kingdom; his right eye
    laughs and his left eye weeps, and the cause is unknown to others.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The emperor has three sons named Florea, Costan, and Petru, each described
    with distinct physical or behavioral traits.
