canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which a speaking bread addresses a dragon,
    after which the dragon bursts, the palace community removes its carcass and gives
    thanks for the royal children''s escape. It then begins “The Fairy Aurora”: a
    vast emperor has one laughing eye and one weeping eye; his three sons are introduced;
    the youngest, Petru, persistently asks about the eyes until the emperor explains
    his anxiety and requests water from the Fairy Aurora''s fountain. The eldest son,
    Florea, departs first and reaches the frontier abyss and single bridge of the
    empire.'
  language: English
  quote_policy: summarized
