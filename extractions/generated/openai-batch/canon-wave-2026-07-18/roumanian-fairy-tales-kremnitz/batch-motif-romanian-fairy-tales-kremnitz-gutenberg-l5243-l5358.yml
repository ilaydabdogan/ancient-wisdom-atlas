canonical_text:
  quote: ''
  summary: 'The passage ends one tale with Jack spared because robbers honor a promise,
    then sealed in a cask and accidentally carried home when he grips a wolf''s tail.
    A new tale, “Tellerchen,” begins: a stepmother demands that her husband''s son
    be sent away; the son leaves, serves a rich man for seven years, receives livestock
    as his reward, chooses an ox and a cow, and the ox is identified as bewitched
    and named Tellerchen.'
  language: English
  quote_policy: summarized
