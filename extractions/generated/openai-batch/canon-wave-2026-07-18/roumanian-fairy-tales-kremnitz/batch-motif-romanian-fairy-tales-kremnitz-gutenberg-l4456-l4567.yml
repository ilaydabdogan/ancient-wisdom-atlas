canonical_text:
  quote: ''
  summary: The Poor Boy uses magical tokens and animal helpers to recover a hidden
    drove before sunrise, completes a three-day service year, and chooses a neglected
    filly as his wage. The old witch pursues him after mounting a tripod and changing
    her form, but the speaking horse tells him to throw grooming tools that become
    barriers and blades. At the seventh forest, the sick horse becomes a winged steed
    and promises to carry him from this world to the other while seeking its sister.
  language: English
  quote_policy: summarized
