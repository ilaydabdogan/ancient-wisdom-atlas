canonical_text:
  quote: ''
  summary: The passage concludes an episode in which an old woman tricks Little Wild-Rose
    into climbing down from a tree in the forest and brings her to an enamored prince,
    after which she is dressed richly and married at court. It then begins the tale
    “The Voice of Death,” in which a man enriched after praying to God seeks a land
    where people do not die, finds a country where people instead follow a visible
    caller and never return, and moves his family there after warning them never to
    follow anyone who calls.
  language: English
  quote_policy: summarized
