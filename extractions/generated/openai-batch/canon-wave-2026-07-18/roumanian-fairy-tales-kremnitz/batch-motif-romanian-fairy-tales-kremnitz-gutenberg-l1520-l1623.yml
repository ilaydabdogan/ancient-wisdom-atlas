canonical_text:
  quote: ''
  summary: A prince leaves court on a dangerous quest, dismisses his escort at the
    wilderness, and travels east with an enchanted speaking horse. He passes into
    the domains of two cursed monster-sisters, the Woodpecker Fairy and the Scorpion
    Witch. In each encounter the horse warns him, the prince wounds the attacker,
    receives a blood-written promise of safety, is hosted, restores the severed body
    part, and continues his journey. The passage ends as he reaches a field of perpetual
    spring where the horse begins to speak.
  language: English
  quote_policy: summarized
