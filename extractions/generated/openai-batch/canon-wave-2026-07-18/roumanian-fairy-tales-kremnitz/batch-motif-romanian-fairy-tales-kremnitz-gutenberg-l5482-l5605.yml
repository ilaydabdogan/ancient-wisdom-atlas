canonical_text:
  quote: ''
  summary: A third bull challenges Tellerchen and the youth at the Copper Bridge.
    Tellerchen is defeated and leaves the youth his left horn, which later releases
    countless cattle. A dragon restores the cattle to the horn in exchange for the
    future right to take the youth's dearest possession. The youth returns home, uses
    the cattle for charity, marries the emperor's daughter, and on the wedding night
    the dragon comes to claim the bride. A ritual roll of bread begins speaking against
    the dragon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A feeble, ugly, dirty third bull appears, objects to the boy and Tellerchen
    drinking its water and spoiling its meadows, and challenges them to fight at the
    Copper Bridge the next day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tellerchen tells the youth that the bull will overpower him and instructs
    the youth to seize Tellerchen's left horn if the bull is pushing him under the
    bridge; he also warns not to open the horn until reaching home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Copper Bridge, Tellerchen and the bull fight until afternoon; when
    the bull is about to hurl Tellerchen under the bridge, the boy wrenches off Tellerchen's
    left horn, and Tellerchen does not return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The grieving boy spends the night on a hill, opens the horn because of hunger,
    and a countless multitude of cattle comes out, impossible for him to drive home
    or put back into the horn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A dragon offers to put the beasts back into the horn; it rejects half the
    cattle and demands the right to come when the boy loves life best and take his
    dearest possession to devour it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The boy agrees without fully knowing what he is doing, and the dragon raps
    three times with its tail and puts all the cattle back into the horn.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The boy returns to his father, who is alone; the old woman and her daughter
    have vanished, and when the horn is opened the surrounding fields and country
    fill with cattle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The father advises the youth to relieve widows and the poor, and the youth
    gives aid so regularly that no pauper remains in the neighborhood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: News of the youth's wealth and benevolence reaches the imperial court; the
    emperor asks him to become suitor to his clever and beautiful daughter, and a
    wedding is celebrated after mutual agreement.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the wedding festivities, the old man places a roll of snow-white bread
    in the couple's sleeping room according to ancient custom.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: During the wedding night, the dragon appears with one jaw on the upper cornice
    of the door and the other on the threshold, saying it has come to settle the account
    and claim the bride to devour her.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The young man hesitates because he remembers the bargain and his father's
    teaching that a person who gives his word has pledged his soul, but he also cannot
    yield his beloved wife.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The bread jumps about and speaks to the dragon, recounting its own processes
    of being sown, grown, mowed, bundled, trampled, winnowed, and milled, and tells
    the dragon to bear its troubles and go into the depths of the sea.
  category: speech
  evidence_refs:
  - ev:13
