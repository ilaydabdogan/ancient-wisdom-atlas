canonical_text:
  quote: ''
  summary: The Poor Boy and the prince confront a dragon at a palace. The Poor Boy
    holds the gates and supports the palace while the prince fights the dragon; the
    palace collapses and buries the dragon, and the Bodiless Maiden vanishes from
    the glass tower. They travel to the second dragon's palace, where the Poor Boy's
    sister is held in a glass tower but does not recognize him and loves the dragon.
    A bread token made with her mother's milk makes her homesick and willing to flee.
    The companions defeat the second dragon and then reach the emperor's daughter,
    who refuses rescue and keeps her hand on a nail that can collapse the palace.
  language: English
  quote_policy: summarized
