canonical_text:
  quote: ''
  summary: A first-person narrator recounts escaping dragons with a caged bird and
    a maiden, aided by a powerful companion who petrifies pursuers. The companion
    reveals that stone pillars are the narrator's brothers and restores them at the
    narrator's request. The brothers then betray the narrator by cutting off his feet
    at a pond and taking the maiden and wonderful bird. The narrator is protected
    by his horse, makes an oath of brotherhood with a blind man, kills a three-headed
    scorpion, and uses its blood to restore his feet and the blind man's sight. He
    becomes a shepherd and trusts divine justice. The maiden tells the emperor that
    she became a poultry-maid rather than accept the older sons, and the emperor asks
    her to prove her identity.
  language: English
  quote_policy: summarized
