canonical_text:
  quote: ''
  summary: The passage closes one tale with a prince returning through altered lands,
    aging rapidly, finding his ruined birthplace, opening a chest containing his personified
    death, and crumbling to dust. It then begins another tale in which an abused rooster
    finds a purse with two half-pennies, has it taken by a gentleman, and repeatedly
    survives punishments while demanding its return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prince says he recently passed through the region, but the people laugh
    at him, and he rides on while his hair and beard grow white.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the realm of the Woodpecker Fairy, the prince again encounters changed
    places, cannot understand the alteration, and is described with a white beard
    to his waist and trembling feet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In his father's empire, the prince finds new people, new towns, and a changed
    birthplace; his horse kisses his hand, says it is returning to its place of origin,
    offers him a quick departure, and then darts away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prince sees a ruined palace with weeds, recalls its former appearance,
    finds the stable, enters a rubbish-choked cellar, and opens a dilapidated old
    chest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A voice speaks from the chest; the prince's death, shriveled inside it, seizes
    him, and the prince falls lifeless and crumbles into dust.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: An old woman has a hen that lays eggs and refuses to share them; she advises
    the old man to beat his rooster so it will lay eggs, and the old man thrashes
    the rooster and threatens to stop feeding it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: The rooster runs down the road, finds a little purse with two half-pennies,
    carries it in its beak, and has it taken by a driver at a gentleman's order.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: The rooster pursues the carriage and repeatedly demands that the little purse
    be returned.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: After the gentleman orders the rooster thrown into a well, the rooster swallows
    all the well water and flies out.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After being placed on burning coals with the chimney opening blocked, the
    rooster spits out the swallowed water, extinguishes the fire, floods the kitchen
    floor, pushes the stone away, and escapes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: After being thrown among herds of cattle, the rooster swallows the whole herd,
    its stomach grows as big as a mountain, it darkens the gentleman's room with its
    wings, and it repeats its demand.
  category: action
  evidence_refs:
  - ev:11
