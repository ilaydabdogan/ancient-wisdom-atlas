canonical_text:
  quote: ''
  summary: At an imperial wedding banquet, a princess asserts precedence over her
    fisherman husband during a customary egg rite, and he vanishes. She repents, searches
    for him, finds him serving in a tavern while pretending to be mute, and enters
    a written agreement that she will make him speak within three days or be hanged.
    At the gallows, as the noose is placed around her neck, the fisherman finally
    shouts for the execution to stop.
  language: English
  quote_policy: summarized
