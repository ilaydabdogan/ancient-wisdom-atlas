canonical_text:
  quote: ''
  summary: Siminok arrives at the princess's palace and proves by an animated sword
    that he is not her husband Busujok. He searches for Busujok, encounters the Wood
    Witch, outwits her, and forces her to return Busujok with his horse and dogs before
    killing her through his hounds. Busujok then becomes jealous, causes Siminok's
    death by a blindfolded-horse trial, learns by the same sword that Siminok and
    his wife told the truth, grieves, rides blindfolded into the same spring, and
    dies. Busujok and Siminok appear in the sky as morning and evening stars.
  language: English
  quote_policy: summarized
