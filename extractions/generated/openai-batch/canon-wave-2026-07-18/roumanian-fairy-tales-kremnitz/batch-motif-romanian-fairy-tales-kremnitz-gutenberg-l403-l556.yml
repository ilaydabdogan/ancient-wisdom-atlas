canonical_text:
  quote: ''
  summary: 'Stan is given successive tasks alongside a dragon: throwing an ancestral
    iron-sheathed club, carrying water in buffalo skins, and bringing wood from the
    forest. Though physically unable to perform the tasks, Stan repeatedly makes claims
    that frighten the dragon into doing the work and promising sacks of ducats. After
    the year of service ends, Stan overhears the dragon and his mother discussing
    how to get rid of him, and the she-dragon tells her son to kill Stan while he
    sleeps.'
  language: English
  quote_policy: summarized
