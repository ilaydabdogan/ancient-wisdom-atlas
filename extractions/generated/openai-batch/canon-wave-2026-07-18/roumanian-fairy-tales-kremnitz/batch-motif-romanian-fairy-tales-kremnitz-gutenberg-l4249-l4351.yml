canonical_text:
  quote: ''
  summary: 'A poor boy meets a feeble old woman who is revealed to be the Wood Witch.
    After he offers her bread, her heart softens and she tells him how to reach his
    sister in the other world: he must cross six moors and six forests, reach the
    seventh forest at the frontier of the next world, and obtain an enchanted horse
    by serving and choosing correctly. The boy continues, sustained by his loaf, and
    rescues a wasp, a fish, and a mole. Each grateful creature gives him a bodily
    token that can summon future help.'
  language: English
  quote_policy: summarized
