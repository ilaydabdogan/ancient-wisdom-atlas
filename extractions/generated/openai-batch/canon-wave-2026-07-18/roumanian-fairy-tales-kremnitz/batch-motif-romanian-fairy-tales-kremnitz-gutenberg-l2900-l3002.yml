canonical_text:
  quote: ''
  summary: An old man leaves a hermit's cave with a gift, becomes thirsty, mistakenly
    eats the apple-half meant for his wife, sleeps, and finds a miraculous girl beside
    him. An angel baptizes her as Little Wild-Rose. The old man takes her home, but
    she disappears from a trough on the roof after a griffin carries her to its nest.
    The young griffins shelter her. A twelve-headed dragon from a poisoned well threatens
    the griffin brood, but an archangel slays the heads and purifies the land with
    basil and consecrated water. The returning griffin finds its young alive and connects
    the miracle with the radiant child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man takes a gift, kisses the hermit's right hand and feet, and leaves
    the cave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the forest and meadows, the old man is seized by thirst and a burning throat,
    finds no water, and eats the half apple meant for his wife instead of his own
    half.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After eating the apple-half, the old man feels unable to continue, lies down
    among yellow cheese-wort, and sleeps while the angel of the Lord watches beside
    him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the old man wakes, a crying little child is beside him; the angel brings
    basil and nine-year-consecrated water, sprinkles the child, christens her, and
    names her Little Wild-Rose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The old man carries the girl home to his wife, places her in a kneading-trough
    on the roof, and says the Lord has given him a daughter with golden hair and star-like
    eyes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the couple goes to take down the trough, the child is gone; the old man
    searches and wonders whether an angel, elves, or wicked gnomes have taken her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A bird identified by the narrator as a griffin hears the child, seizes her,
    carries her under its right wing into the sky, and places her in its eyrie to
    feed its young.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The young griffins do not eat the child; they look kindly at her, give her
    bread-crumbs, make a bed for her, and cover her with their wings.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A twelve-headed dragon lives at the bottom of a well of pure poison near the
    tree containing the griffin nest and has repeatedly killed the griffin's young
    when they were ready to fly.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: At midnight, two fiery dragon heads emerge and approach the nest; an archangel
    appears on a golden cloud with a sword and cuts off the dragon's heads in pairs
    until all twelve are destroyed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Blood and poison flood the forest and valley; the angel sprinkles the four
    quarters of the earth with basil and Paradise water consecrated nine years, after
    which the ground swallows the heads and blood and the wood becomes pure and bright.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: At dawn the griffin returns, finds its children safe and the well gone, asks
    who helped it, and later sees the child's golden hair and starry eyes shining
    in the morning sunlight.
  category: sequence
  evidence_refs:
  - ev:12
