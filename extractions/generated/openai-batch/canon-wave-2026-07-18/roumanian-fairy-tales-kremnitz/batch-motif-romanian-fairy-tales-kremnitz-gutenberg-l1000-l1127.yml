candidate_motifs:
- id: motif:1
  label: magical object proves bride's identity and raises a palace
  taxonomy_refs: []
  basis: The apple identifies the girl, and the threefold whip-cracking over it causes
    a magnificent palace to arise instantly.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not explain the apple's origin or full prior function.
- id: motif:2
  label: divine judgment by ordeal
  taxonomy_refs:
  - divine_judgment
  basis: The youngest son asks for God's judgment, and the stone ordeal kills the
    elder brothers while sparing him.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The narration reports the outcome but does not explicitly state a divine
    voice or visible divine intervention.
- id: motif:3
  label: wrongdoing elder siblings punished while youngest is vindicated
  taxonomy_refs:
  - sibling_pair
  basis: The older brothers are associated with prior wrongdoing against the youngest,
    are asked to seek forgiveness, and die in the ordeal, while the youngest survives.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: medium
  cautions: The exact prior offense occurs outside this excerpt, so sibling rivalry
    is inferred only from the forgiveness and judgment scene.
- id: motif:4
  label: royal legitimacy through marriage and throne transfer
  taxonomy_refs:
  - royal_legitimacy
  basis: After the ordeal and wedding, the emperor marries his son to the poultry-maid
    and gives the throne to the prince.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives succession as an event, not an extended legitimacy doctrine.
- id: motif:5
  label: three sisters make marvelous marriage promises
  taxonomy_refs:
  - sacred_exchange
  basis: Each sister states a supernatural or extraordinary gift she would provide
    to a husband if chosen.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The promises lead to marriage, but the passage does not frame them as
    a formal bargain.
- id: motif:6
  label: miraculous marked twins promised to a royal husband
  taxonomy_refs:
  - sacred_twins
  - miraculous_child
  - sacred_birth
  - sibling_pair
  basis: Laptitza promises twin boys with golden hair and a golden star on their foreheads,
    and the empire awaits the unprecedented fulfillment.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: high
  cautions: The twins are promised and anticipated in this excerpt but not yet born
    within it.
- id: motif:7
  label: magical food grants renewed youth and bravery
  taxonomy_refs: []
  basis: Anna promises and later makes bread that will make its eater always feel
    young and brave.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage reports the promise and fulfillment but not the bread's later
