- id: ev:6
  type: summary
  locator: lines 1024-1033
  quote_or_summary: The new tale introduces an emperor ruling a whole world and an
    old shepherd couple with three daughters, Anna, Stana, and Laptitza; the footnote
    glosses Laptitza as Little Milk-white from 'Lapte,' milk.
  source_text_path: texts/public-domain/romanian/project-gutenberg/roumanian-fairy-tales-kremnitz.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:7
  type: summary
  locator: lines 1034-1038
  quote_or_summary: Anna's beauty stops sheep from feeding, Stana's makes wolves guard
    the herd, and Laptitza is described as milk-white and more beautiful than both
    sisters together.
  source_text_path: texts/public-domain/romanian/project-gutenberg/roumanian-fairy-tales-kremnitz.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:8
  type: summary
  locator: lines 1039-1046
  quote_or_summary: The sisters pick strawberries at the edge of the forest and hear
    approaching horses; the emperor's son hunts with friends and courtiers, and the
    riders slow when they see the sisters.
  source_text_path: texts/public-domain/romanian/project-gutenberg/roumanian-fairy-tales-kremnitz.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:9
  type: summary
  locator: lines 1047-1055
  quote_or_summary: Anna promises bread that keeps a husband young and brave; Stana
    promises a shirt for fighting dragons and passing through water or fire unharmed;
    Laptitza promises twin boys with golden hair and a golden star on their foreheads.
  source_text_path: texts/public-domain/romanian/project-gutenberg/roumanian-fairy-tales-kremnitz.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:10
  type: summary
  locator: lines 1056-1063
  quote_or_summary: The emperor's son declares Laptitza will be his, lifts her onto
    his horse, and two other youths take the other sisters; the three weddings are
    celebrated the next day with three days and nights of festival.
  source_text_path: texts/public-domain/romanian/project-gutenberg/roumanian-fairy-tales-kremnitz.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:11
  type: summary
  locator: lines 1064-1072
  quote_or_summary: News spreads that Anna has made the promised bread and Stana has
    made the promised shirt; Laptitza alone has not yet kept her word.
  source_text_path: texts/public-domain/romanian/project-gutenberg/roumanian-fairy-tales-kremnitz.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:12
  type: summary
  locator: lines 1073-1080
  quote_or_summary: Seven weeks after the wedding, the emperor says he will stay with
    his wife day and night, and the empire rejoices in expectation of seeing something
    never seen before.
  source_text_path: texts/public-domain/romanian/project-gutenberg/roumanian-fairy-tales-kremnitz.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:13
  type: summary
  locator: lines 1081-1092
  quote_or_summary: The emperor's stepmother has a daughter and had intended that
    daughter to become empress instead of Laptitza; she decides that, if Laptitza's
    promise is fulfilled, the emperor and world should be made to believe otherwise.
  source_text_path: texts/public-domain/romanian/project-gutenberg/roumanian-fairy-tales-kremnitz.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:14
  type: summary
  locator: lines 1093-1127
  quote_or_summary: The stepmother cannot act because the emperor remains with his
    wife. She tries coaxing and cunning, but he does not leave as the time for Laptitza's
    promise draws near.
