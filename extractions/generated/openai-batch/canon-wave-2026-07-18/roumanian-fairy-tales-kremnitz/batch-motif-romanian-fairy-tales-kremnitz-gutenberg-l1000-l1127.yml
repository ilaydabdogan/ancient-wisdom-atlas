canonical_text:
  quote: ''
  summary: 'The passage closes one tale with a girl producing an apple, using a little
    whip to raise a palace, and a youngest prince submitting his elder brothers to
    an ordeal before a church in which the elder brothers die and the prince receives
    marriage and the throne. It then begins ''The Twins With the Golden Star'': three
    shepherd daughters meet a royal hunting party, each promises a marvelous marital
    gift, the youngest promises twin sons with golden hair and a golden star, the
    marriages occur, two promises are fulfilled, and a stepmother plots against the
    youngest wife while the emperor remains with her.'
  language: English
  quote_policy: summarized
