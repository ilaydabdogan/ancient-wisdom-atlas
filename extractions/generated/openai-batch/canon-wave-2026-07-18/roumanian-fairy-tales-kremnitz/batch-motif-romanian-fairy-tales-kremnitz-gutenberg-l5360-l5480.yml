canonical_text:
  quote: ''
  summary: A youth returns home and is mistreated by his wicked stepmother, who gives
    him ash-cakes while he tends cattle. His talking ox, Tellerchen, tells him to
    take food and wine from its right horn. The stepmother’s daughter spies on him
    and reports the ox’s magic. The stepmother persuades the father to have the ox
    slaughtered, but the youth escapes on Tellerchen’s back to a rich forest. There
    Tellerchen is challenged by rival bulls at the Gold Bridge and Silver Bridge and
    defeats them.
  language: English
  quote_policy: summarized
