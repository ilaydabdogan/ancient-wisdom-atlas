  quote: ''
  summary: A speaker recounts being told by Mamma that seeing a bat signals that a
    porcupine may come. The speaker must stay awake to watch for the porcupine because
    the porcupine's approach causes sleepiness against one's will. The porcupine uses
    this to enter or approach the hole, smell for danger or a man lying in wait, and
    then withdraw quietly if it detects a person's scent.
