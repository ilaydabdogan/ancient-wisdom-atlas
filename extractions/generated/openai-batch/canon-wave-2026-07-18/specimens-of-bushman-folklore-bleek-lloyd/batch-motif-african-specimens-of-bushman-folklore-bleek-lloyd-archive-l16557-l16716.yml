canonical_text:
  quote: ''
  summary: The speaker recounts hunting when springbok were absent. He describes shooting
    a bustard, carrying it home in a bag, and his wife plucking and boiling it for
    soup. He then describes hunting hares for the children by making them spring up
    and run in the sun until heat, thirst, fear, and fatigue cause them to die. The
    passage explains that hares eat dry bushes, do not drink, do not know water pans,
    and wait in the sun.
