canonical_text:
  quote: ''
  summary: At daybreak the man is still running from a lion. He sees a fire made by
    other people, remembers a warning that a lion's eye can resemble fire at night,
    and goes nearer to test whether it is a real fire. Seeing people lying near it,
    he joins them and tells them that he had unknowingly entered a cave occupied by
    a lion, heard breathing there, and escaped because the lion slept.
