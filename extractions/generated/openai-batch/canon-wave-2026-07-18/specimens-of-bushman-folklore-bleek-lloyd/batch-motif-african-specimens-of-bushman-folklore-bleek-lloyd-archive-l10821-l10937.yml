canonical_text:
  quote: ''
  summary: The passage introduces a tale of a woman of the early race and the Rain
    Bull. The Rain courts an ill young woman in her hut, follows her scent, and approaches
    while mist, fragrance, and his breath fill or close in the place. The woman lies
    with her child on a kaross, smells the Rain's scent, and becomes aware of him
    as he passes the side of the hut. Notes explain that the Rain's breath appears
    like mist and that he resembles a bull, understood as the Rain's body.
