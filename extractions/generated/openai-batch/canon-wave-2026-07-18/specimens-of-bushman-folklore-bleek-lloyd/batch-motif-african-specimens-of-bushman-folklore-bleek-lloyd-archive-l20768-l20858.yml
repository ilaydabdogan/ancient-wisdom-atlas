canonical_text:
  quote: ''
  summary: The passage describes a hammerkop living at a water or pool in which all
    things can be seen, including sky objects reflected as stars like fires. At night
    a person walking by the water can be seen clearly. The narrator reports that mother
    and others said the hammerkop sees in the water when a relative has died and flies
    to tell the people; a star also gives such notice before ordinary news arrives.
    The same informants said that girls carried off by the Rain remain at that water;
    when the Rain is angry it lightens, kills them, and they become stars with changed
    appearance. The supplied excerpt then continues in ǀXam transcription without
    further English translation in this passage segment.
  language: English; ǀXam transcription present in later lines
