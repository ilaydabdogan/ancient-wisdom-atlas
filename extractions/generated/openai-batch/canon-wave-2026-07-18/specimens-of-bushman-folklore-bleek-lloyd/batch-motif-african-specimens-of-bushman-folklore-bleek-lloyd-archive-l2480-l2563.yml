  summary: A group takes up the flesh of the Mantis and tells a child to carry a hartebeest's
    head so that father may roast it. The head is heavy, slips downward, speaks to
    the child about a thong obstructing its eye, and the Mantis winks at the child.
    The child reports that the hartebeest's head can speak and wink, while her elder
    sister scolds her as lying or deceiving them. The latter part of the supplied
    passage contains source-language transcription and editorial notes not used here
    for additional interpretation.
