canonical_text:
  quote: ''
  summary: 'The excerpt begins with the end of a separate reminiscence about food-giving
    by the speaker''s mother and by Silla at Jacob Kotze''s place. It then introduces
    a narrative of +Kagara and \haunu: +Kagara, described in a note as a little bird,
    goes to fetch his younger sister and takes her away from \haunu back toward her
    parents. \haunu, identified in a note as a man, the Rain, and perhaps a Rain''s
    Sorcerer, chases his brother-in-law behind a hill. Clouds appear and vanish. +Kagara
    repeatedly tells his younger sister to walk on toward home while she carries her
    husband''s things, and he asks what heavy things she is carrying. The title states
    that +Kagara and \haunu fought each other with lightning, but the supplied excerpt
    ends before a narrated lightning-combat episode.'
