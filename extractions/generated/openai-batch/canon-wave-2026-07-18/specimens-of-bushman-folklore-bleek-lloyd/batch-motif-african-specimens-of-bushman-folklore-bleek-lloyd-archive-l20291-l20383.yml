  summary: The passage describes a man who has missed the house but uses known water
    as a landmark to return. It then explains guiding signs made by reversing branches
    and drawing a foot-mark in the ground to indicate direction of travel. A following
    heading introduces a separate account in which a Bushman faint from the sun's
    heat throws earth into the air so people at home will see the dust and come to
    help.
