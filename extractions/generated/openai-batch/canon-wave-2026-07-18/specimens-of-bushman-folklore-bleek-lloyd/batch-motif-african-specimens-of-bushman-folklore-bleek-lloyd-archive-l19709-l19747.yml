  summary: Mansse notices a child that seems to have followed him or lost its way.
    He approaches to see what child it is. The child appears afraid, stays by a bush,
    looks from side to side, and seems ready to flee. Mansse sees that it is a little
    girl-like child, partly like a person and partly not. He decides to leave it alone
    and walks away; the child then comes forward near the bush and sits.
