canonical_text:
  quote: ''
  summary: In the translated portion, the Mantis sets down his quiver and kaross,
    takes out a feather brush, and calls to baboons to play with a ball. The baboons
    suspect his purpose. During the play, the child's eye moves about; the baboons
    try to catch it. The Mantis springs out, seizes the child's eye, whirls it around,
    anoints it with perspiration from his armpits, and throws it toward the baboons.
    The eye ascends and moves in the sky, then appears to stand in or near the quiver's
    side bag. The supplied range also contains untranslated/transcribed text not used
    for interpretation.
