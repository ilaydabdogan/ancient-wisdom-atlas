  summary: In this excerpt from “The Son of the Mantis,” the baboons and the Mantis
    search for the child's eye, which the baboons demand as a ball. The baboons suspect
    the ball is inside the Mantis's bag and require him to shake it. The Mantis denies
    having the ball while holding the child's eye and turning the bag inside out.
    A fistfight follows between the baboons and the Mantis. A note states that the
    bag was the one containing the child's eye, and another note says “Hartebeest's
    Children” may refer to a bag made from young hartebeest skin.
