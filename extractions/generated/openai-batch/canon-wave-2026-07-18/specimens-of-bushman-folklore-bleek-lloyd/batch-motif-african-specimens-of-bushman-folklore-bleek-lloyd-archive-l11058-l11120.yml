canonical_text:
  quote: ''
  summary: In this passage from “Woman and Rain Bull,” the Rain carries a young woman
    to a tree or bush. She instructs him to go underneath near the stem, rubs him
    with buchu, and he sleeps. She then climbs away along the tree, descends at a
    distance, and returns home. The Rain wakes when the place becomes cool, goes back
    to the spring or water from which he had come, and enters it while believing she
    is still on his back. Notes identify the tree or bush and clarify that the rubbing
    was with dry buchu on his neck.
  language: English translation with embedded source-language transcription and editorial
    notes
