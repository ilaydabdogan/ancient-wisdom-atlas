  summary: The passage describes Whara as a black stone or pigment and tto as a red
    pigment. People prepare them by mixing, pounding, anointing heads, and rubbing
    bodies. Whara is associated with black, shimmering heads and desired hair growth.
    The passage also describes reciprocal arrangements involving men, wives, bags,
    Whara, and tto, followed by old women praising a young man whose head is made
    attractive by Whara.
