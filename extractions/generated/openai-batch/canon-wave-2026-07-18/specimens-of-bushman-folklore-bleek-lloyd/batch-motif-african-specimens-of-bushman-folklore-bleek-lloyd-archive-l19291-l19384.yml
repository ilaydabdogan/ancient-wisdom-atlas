canonical_text:
  quote: ''
  summary: The passage describes people recognizing arrows by marks, making a red
    marking material for arrows, and preparing an adhesive or poison substance for
    arrow-making from Wleuarri juice. The preparation involves collecting juice in
    a tortoise shell, heating it by fire, beating it, and rolling it with a Driedoorn
    stick. A following section is introduced as a Katkop-dialect text about getting
    rid of the evil influence of bad dreams, attributed to Diajkwain.
  language: English with embedded San-language terms and an untranslated Katkop-dialect
    excerpt
