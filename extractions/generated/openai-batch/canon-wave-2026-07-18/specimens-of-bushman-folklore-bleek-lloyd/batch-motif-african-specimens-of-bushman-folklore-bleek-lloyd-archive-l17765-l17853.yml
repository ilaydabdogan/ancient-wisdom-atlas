canonical_text:
  quote: ''
  summary: 'The passage describes a hunting-related presentiment: in warm spring conditions,
    unnamed “things” pass near the hut and leave spoor. The narrating group does not
    sleep at noon when they feel a sensation under the knees, which they associate
    with the things walking and with later carrying game. Little boys watch from shade
    above the hut and signal by beckoning and pointing when they see the things moving,
    including toward the Brinkkop mountains. Footnotes explain an ostrich louse and
    a term for spring/flower time. The excerpt then begins a new section titled “Doings
    and Prayers when Canopus and Sirius Come Out,” followed by source-language text
    without an English translation in the supplied passage.'
  language: English with source-language transcription in the latter portion
  quote_policy: summarized
