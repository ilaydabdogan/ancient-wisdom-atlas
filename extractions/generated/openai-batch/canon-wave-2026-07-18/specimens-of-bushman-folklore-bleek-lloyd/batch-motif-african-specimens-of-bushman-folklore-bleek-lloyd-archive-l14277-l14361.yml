  quote: The man, when he had entered the cave, heard a thing which seemed to breathe.
  summary: In darkness and rain, a man who cannot find his way home seeks a cave in
    which to sleep until morning. A lion has arrived first, intending to wait for
    the man and catch him, but after warming itself in the cave it falls asleep. The
    man enters, hears breathing, wonders whether silent people are present, and decides
    to feel gently rather than call out, in case the breathing thing is not human.
