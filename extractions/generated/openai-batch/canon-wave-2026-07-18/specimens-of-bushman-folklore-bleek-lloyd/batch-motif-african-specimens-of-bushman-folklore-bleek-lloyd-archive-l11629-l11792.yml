canonical_text:
  quote: ''
  summary: A husband gathers Bushman rice until a bag is full. He asks his wife for
    her little kaross so that he can put earthy Bushman rice on it. She repeatedly
    says that those of the house of +nerru do not put earthy Bushman rice into a back
    kaross, and tells him to put the rice into the ground and cover it with earth.
    He insists and snatches the kaross; the wife’s entrails, described as being on
    the kaross, pour down. The husband laments, while the wife rises, sings the rule
    about the house of +nerru, and walks on replacing her entrails.
  language: English translation with transcribed original text in parallel
