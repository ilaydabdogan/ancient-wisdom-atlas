canonical_text:
  quote: ''
  summary: 'The passage gives a procedural account of making clay pots: clay from
    the earth is rubbed, set down in a circle, smoothed, and moulded upward into a
    pot; pots are dried in the sun; damp pots are anointed with fat to prevent splitting;
    small and larger pots are made and set beside the large pot; gum is prepared by
    pounding it fine between stones and putting it into a pot. Editorial notes identify
    a bone smoothing tool and describe gum associated with the \khou tree. The latter
    part of the passage includes /Xam transcription and philological notes for the
    same section.'
  language: English with /Xam transcription
  quote_policy: summarized
