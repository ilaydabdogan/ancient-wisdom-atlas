  summary: A hammerkop bird is said to come and cry over people when a star has fallen,
    announcing that one of their people has died. The people regard the hammerkop
    as truthful. Mother and others, not wanting to hear its death-message, address
    it and send its story into the Orange River water, where stars stand in the water.
