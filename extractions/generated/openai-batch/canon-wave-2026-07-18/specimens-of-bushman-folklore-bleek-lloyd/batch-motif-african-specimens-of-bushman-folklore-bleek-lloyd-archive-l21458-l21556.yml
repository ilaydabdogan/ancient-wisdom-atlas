  quote: ''
  summary: 'The passage describes \%ue / \yue in changing or deceptive forms: as a
    lizard, as water or a water hole, through grass or reeds that catch a wood pigeon,
    and later as a small \nu-erre bird. He catches a wood pigeon, plucks it, places
    feathers in his head, cooks and eats the bird, then hides from Ovaherero searchers
    until a little Omuherero boy sees the bird-form on a bush.'
  language: English translation with embedded Ikun/Jkun text and editorial notes
