  summary: In this passage from “The Son of the Mantis,” the Mantis approaches a child
    lying in the sun opposite the water. He catches and anoints the child, says that
    he is the child’s father and that the child is his son, clothes the child with
    a front kaross and a Wkoroko, and brings him home. At home, the young Ichneumon
    and \Jcuammah-a discuss the returning pair and mention baboons playing ball with
    the child’s eye.
