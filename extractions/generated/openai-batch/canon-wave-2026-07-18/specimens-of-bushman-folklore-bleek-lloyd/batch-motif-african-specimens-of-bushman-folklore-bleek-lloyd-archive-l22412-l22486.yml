canonical_text:
  quote: ''
  summary: 'The passage records a practice in which the Jcun and a speaker''s paternal
    grandmother beat a stone on the ground while commanding something, parenthetically
    identified as possibly lightning, to fall into water. It states that women, not
    men, beat a stone on the ground. The passage then gives death-related animal rules:
    snakes, lizards, and a certain small antelope near graves are to be respected;
    a snake near a grave is not killed because it is identified with an ''other person''
    or dead person. Another heading describes a certain snake whose posture on its
    back announces a family death and which must not then be killed. Footnotes explain
    relationships among death, snakes, spirits, sex, and cause of death.'
  language: English
  quote_policy: summarized
