  quote: The Bushmen's letters are in their bodies.
  summary: 'The passage gives two brief statements about cutting off the upper joint
    of a little finger, followed by an account of Bushman presentiments: internal
    bodily letters or beatings speak, move, and guide people; dreams are described
    as deceptive, while presentiments are described as truthful and practically useful
    for hunting, travel, warning, and finding a sought person.'
