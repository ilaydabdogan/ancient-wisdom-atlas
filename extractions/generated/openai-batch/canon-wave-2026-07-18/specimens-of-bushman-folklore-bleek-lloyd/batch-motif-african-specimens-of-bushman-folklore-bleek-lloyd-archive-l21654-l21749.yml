canonical_text:
  quote: ''
  summary: A first-person speaker describes seeing his child making fire with small
    sticks; the child sees the speaker and dies. The speaker says his own country
    is very distant, describes the child making fire, eating tshana fruit, hurting
    his hands, crying, seeing him, and dying. The speaker also describes wearing many
    wood-pigeon feathers on his head, fears the dead child, and goes to his own country,
    Wnqd, identified as a large mountain. Notes explain the fire-making sticks and
    the tshana tree. The passage then introduces a prayer to the young Moon, with
    provenance and Jkun text.
