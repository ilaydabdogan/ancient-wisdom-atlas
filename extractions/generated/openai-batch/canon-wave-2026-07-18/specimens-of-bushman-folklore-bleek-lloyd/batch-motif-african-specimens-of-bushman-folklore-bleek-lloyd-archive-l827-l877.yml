  quote: a small drawing, representing a family of ostriches
  summary: The passage records boys' abilities in imitating sounds and animal actions,
    representing with brush and pencil, and making elaborately feathered arrows. It
    then gives an anecdote in which Dr. Bleek asks Dia\hvain whether he can make pictures
    and later sees an ostrich-family drawing pinned to the porch wall. The same Bushman
    reports that his father %da-ttin chipped animal pictures at Miami, where animals
    used to drink before the coming of the Boers. The passage also notes other drawings
    and an ostrich illustration caption.
