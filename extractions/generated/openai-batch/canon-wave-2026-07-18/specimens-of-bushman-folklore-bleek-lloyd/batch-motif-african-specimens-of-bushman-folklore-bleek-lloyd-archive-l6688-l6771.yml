canonical_text:
  quote: ''
  summary: A mother withholds a child's comrade's name until the father has strongly
    sheltered the hut. She says that after she has uttered the comrade's name, the
    child must run home into the hut because the wind might blow him away. The two
    children roll a ball; \na-Jca-ti asks again about the other child's name; the
    mother gives names for the other child. \na-Jca-ti returns to the ball game and
    at first remains silent, remembering his mother's warning not to utter the comrade's
    name even if the comrade utters his name.
  language: English with original-language transcription in part of the supplied excerpt
