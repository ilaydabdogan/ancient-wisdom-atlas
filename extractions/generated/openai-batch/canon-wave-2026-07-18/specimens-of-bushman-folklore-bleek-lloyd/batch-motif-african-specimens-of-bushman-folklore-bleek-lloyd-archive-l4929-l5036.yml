canonical_text:
  quote: ''
  summary: In this origin-of-death passage, the Moon says he told a figure not to
    cry for his mother because she would live again, but the figure said she would
    not return alive. The Moon declares that the figure will become a hare and that
    people will die, because the figure contradicted the Moon's own pattern of returning
    alive after death. The narrator reports that elders said the hare was formerly
    a man whom the Moon cursed. The hare is said to retain a piece of human flesh,
    which people remove and do not eat.
  language: English translation with embedded ǀXam transcription
  quote_policy: summarized
