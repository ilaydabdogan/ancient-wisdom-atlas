canonical_text:
  quote: ''
  summary: 'The passage presents a hunting taboo: after game has been shot, people
    must not look at the Moon or up toward the sky. Mothers taught that the Moon is
    not good if looked at in this situation. If the hunters look at the Moon, predators
    may eat the wounded game, and the Moon''s water may fall on the game, cool the
    poison, cure it, and allow it to rise and live.'
