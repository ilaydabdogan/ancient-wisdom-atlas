canonical_text:
  quote: ''
  summary: In the translated portion, the narrator recalls that his leveret was killed,
    that he cried, and that his mother soothed him with a report of a lizard's former
    speech about going through named passes. The narrator also recounts that Tsatsi
    caught a live leveret on the hunting-ground and gave it to him. The narrator repeatedly
    played with the leveret by setting it down, chasing it, and catching it. \jabbi-ah
    wanted him to kill and roast the leveret, but he was unwilling because he found
    its gentle running and ear movement beautiful.
  language: English translation with transliterated |Xam/San names and source transcription
  quote_policy: summarized
