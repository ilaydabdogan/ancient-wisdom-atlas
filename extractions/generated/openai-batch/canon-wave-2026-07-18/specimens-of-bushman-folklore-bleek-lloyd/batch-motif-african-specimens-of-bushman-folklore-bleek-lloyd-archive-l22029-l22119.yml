  quote: '"It is only a woman (whom) we burn, burn, putting (her) into the fire."'
  summary: 'The passage describes stated treatments of thieves: a girl or woman thief
    is put into a hut and killed by burning; a male thief is killed with many arrows
    rather than fire; a little child thief is scolded and not killed; a grown child
    thief may be killed. Notes state that the names of people killed are feared and
    not uttered because of their spirits.'
