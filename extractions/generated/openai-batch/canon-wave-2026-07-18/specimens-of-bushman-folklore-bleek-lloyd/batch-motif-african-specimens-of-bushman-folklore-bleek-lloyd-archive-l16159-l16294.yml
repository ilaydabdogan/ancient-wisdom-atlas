canonical_text:
  quote: ''
  summary: In the translated portion, the speaker identified with IIKABBO reflects
    on waiting for the moon to turn back so that he may set out on the path and return
    to his own people. He wants to tell his master that it is time to sit among fellow
    men, visit, and talk, rather than continue working silently with women who send
    him to work. He says he must rest his arms, listen silently for people's stories,
    and wait for a story to come to his ear, travel along the road after him, and
    move like wind; his names also float along the road toward his place.
  language: English translation with /Xam transcription in the surrounding passage
