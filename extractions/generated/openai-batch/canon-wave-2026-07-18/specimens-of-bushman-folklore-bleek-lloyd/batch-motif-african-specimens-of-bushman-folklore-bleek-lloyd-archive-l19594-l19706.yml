canonical_text:
  quote: ''
  summary: The narrator returns as the sun sets, checks the place where an apparition
    had sat, finds nothing there, and concludes it was not merely a bush. The narrator
    recalls teachings that when sorcerers are taking someone away, that person's friend
    or outer skin may come before people because he still thinks of them and does
    not want to leave. A related report from Mdnsse describes seeing a frightened
    little child peeping beside a bush while he was hunting. Footnotes connect the
    appearing part with thought and mention dying as changing into a different thing,
    as the \nu people do.
  language: English with |Xam transcription in part of the passage
  quote_policy: summarized
