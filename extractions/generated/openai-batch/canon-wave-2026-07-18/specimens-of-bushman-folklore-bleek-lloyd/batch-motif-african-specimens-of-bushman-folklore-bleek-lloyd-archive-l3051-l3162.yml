  quote: ''
  summary: In a section headed “The Son of the Mantis,” a child says he must fetch
    sticks, possibly bushes, for his father so that the father may take aim at people
    sitting on their heels. Baboons repeatedly ask what the child says and call others,
    including an old man or passing person, to come hear the child. A footnote notes
    a Maluti Bushmen parallel in which the Mantis sends a son to cut sticks for bows
    and the son is caught and killed by baboons.
