canonical_text:
  quote: ''
  summary: A figure identified as the son of the Wind rolls a ball to [nq-ka-ti and
    calls [nq-ka-ti by name. [nq-ka-ti answers by calling him “comrade” because he
    does not know the other figure’s name, then asks his mother to tell him the name
    so that he can use it when rolling the ball back. Notes explain the ball as probably
    made of or associated with Wkudrri, described as poisonous and used in aiming
    play, and add an explanation about [nq-ka-ti’s name and a painful red insect.
