canonical_text:
  quote: ''
  summary: A woman identified as the wife of the Dawn's-Heart Star has her ornaments
    and clothing come off by themselves, then runs into the reeds. Her younger sister
    asks to bring the child to suck while the elder sister is still conscious. A hyena
    puts on the ornaments and returns home with the younger sister. Dawn's-Heart returns
    from hunting and asks why his wife is not tending the crying child; the hyena
    does not answer. Later the younger sister carries the child to the reeds, where
    the elder sister emerges, lets the child suck, and says the child must be brought
    quickly again before her thinking-strings fall.
  language: English translation with /Xam transcription present in the passage
  quote_policy: summarized
