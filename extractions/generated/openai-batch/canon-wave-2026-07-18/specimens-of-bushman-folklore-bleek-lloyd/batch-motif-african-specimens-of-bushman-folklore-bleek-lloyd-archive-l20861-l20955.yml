  summary: The passage warns that water flowers may be girls taken away by the Rain.
    Beautiful flowers standing in water vanish into the water when approached. Elders
    advise people to leave them alone because they are described as the water's wives,
    and because those who do not fear the Rain may become like them. The passage also
    notes precautions against Bushman women walking about when the Rain comes, from
    fear that the Rain may kill them by lightning. The excerpt then begins a new titled
    section on Wind, Moon, and Cloud in relation to humans after death, but the supplied
    lines provide no English narrative content for extraction from that section.
