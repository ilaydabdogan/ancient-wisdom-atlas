canonical_text:
  quote: ''
  summary: The passage describes Bushman direction signs. When people travel away
    after another man has not returned, they drag a foot along the ground and place
    grass near the marks. The returning man sees the upright grass, recognizes further
    grass markers, infers that the people have gone toward a water pool, and follows.
    He climbs the hill by the water to look for huts, then sees white huts and smoke
    rising from outside fires.
