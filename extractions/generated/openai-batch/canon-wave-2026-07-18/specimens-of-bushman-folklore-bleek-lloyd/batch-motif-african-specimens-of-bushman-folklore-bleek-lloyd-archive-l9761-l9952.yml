canonical_text:
  quote: ''
  summary: 'The passage contains the tale of the Mason Wasp and his wife: while walking,
    the wife asks him to shoot a hare, tells him to put down his kaross, mocks his
    slender body, and he shoots her; she dies, and he cries as if he had not shot
    her. Notes identify the Mason Wasp as a small flying insect seen near water and
    state that he was formerly a man. The passage also includes family hut and water
    labels, place labels including hill, ravines, house of the lioness, and children’s
    houses, and the title/opening metadata for a following legend about a young man
    of the ancient race carried off by a lion while asleep in a field.'
  language: English with transcribed San-language terms
  quote_policy: summarized
