  summary: The passage first preserves a fragment in which the belongings of frog-people
    or first Bushmen enter and grow by a spring. It then tells of an unnamed early-race
    man who insists that his wife cut off his ears because he has misunderstood his
    younger brother's shaved head as a skinned head; after she does so, he screams.
    The final section begins a tale in which a man of the early race is married to
    the +nerru, glossed as formerly a person and now a bird; the couple gather, bag,
    and wash Bushman rice.
