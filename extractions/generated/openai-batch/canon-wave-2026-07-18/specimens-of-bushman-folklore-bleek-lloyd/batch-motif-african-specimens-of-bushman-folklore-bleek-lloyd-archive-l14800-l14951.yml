  quote: They (the Bushmen) put the things' bones nicely aside, while they do not
    throw them (about).
  summary: 'The passage includes a short concluding note about a person sitting away
    from a springbok to avoid the scent of its viscera, followed by information under
    JNANNA-SSE concerning the treatment of bones: people put animal bones aside carefully,
    deposit them opposite the hut entrance at a named bone heap, sometimes beside
    a little thorn bush, and another person gnaws bones on an ostrich breastbone dish
    before taking them to the deposit place. Notes add that each hut or person may
    have a separate heap of bones from animals such as springbok, gemsbok, hare, and
    porcupine.'
