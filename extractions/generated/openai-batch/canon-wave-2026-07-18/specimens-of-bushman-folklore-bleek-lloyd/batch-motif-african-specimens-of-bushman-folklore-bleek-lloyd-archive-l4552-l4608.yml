  quote: ''
  summary: The Sun leaves a backbone for the children. The moon goes away and returns
    painfully, then becomes another whole moon, lives again after seeming to die,
    becomes a new moon, grows large, and walks at night while feeling that he is a
    shoe. The Sun brightens the earth, enabling people to walk, see, hunt or approach
    animals, visit one another, and travel in summer. A note says that the Mantis
    once threw a shoe into the sky and ordered it to become the Moon.
