canonical_text:
  quote: ''
  summary: The first-person narrator describes hunting hares in summer heat, expecting
    water at home from children sent by his wife, planning to ambush ostriches at
    the Har River after rain, and waiting through the present moon and Sundays until
    boots are ready for a long hot return road to his own place, where autumn and
    dryness will arrive.
