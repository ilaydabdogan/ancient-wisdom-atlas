canonical_text:
  quote: ''
  summary: 'A passage headed “The Treatment of Thieves” describes what is done when
    an IKun woman steals: she is returned to her parents, the stolen thing is returned
    to its owner, the owner demands that she be killed, and the husband refuses because
    she has gone back to her parents and country. A later fragment describes crying,
    heartache, and an announced intention to kill the wife and in-laws, followed by
    a note about the woman openly showing the stolen thing to her husband.'
  language: English with embedded IKun source text
  quote_policy: summarized
