canonical_text:
  quote: ''
  summary: The children wait for the Sun, stealthily approach him, seize him together,
    lift him, and throw him upward while he is hot. They address him, telling him
    to stand fast and go along while hot. An old woman and her husband describe the
    Sun, also called the old man or Sun-armpit, as now standing fast above after the
    children threw him up when he had lain down intending to sleep. The children return
    and recount who grasped him and who ordered the others to hold him firmly and
    throw him up. The passage then shifts into Xam transcription with an editorial
    note on the word khwai.
  language: English with Xam transcription
  quote_policy: summarized
