canonical_text:
  quote: ''
  summary: A narrative headed as the Mantis in the form of a hartebeest describes
    a hartebeest's severed head speaking to a little daughter, the people dropping
    the flesh and running, and the animal's flesh and head rejoining as the body mends.
    The figure rises, chases the people, descends into a small river, and is described
    as having deceived them by lying as if dead and feigning death after being cut
    with stone knives. The supplied range then transitions into the beginning of another
    item with original-language transcription and a collector note.
  language: English; latter portion includes untranslated |Xam transcription
  quote_policy: summarized
