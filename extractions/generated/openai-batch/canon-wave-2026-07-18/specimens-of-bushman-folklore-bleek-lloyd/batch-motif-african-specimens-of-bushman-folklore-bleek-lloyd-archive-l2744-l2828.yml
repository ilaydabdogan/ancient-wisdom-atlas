canonical_text:
  quote: ''
  summary: A hartebeest head speaks about a thong in front of its eye. A father asks
    children whether they cut up the old man, the Mantis, while he lay pretending
    to be dead. The children describe a hartebeest with horns and hair, no arrow wound,
    and flesh that reassembled and chased them. The figure runs with a red hairless
    body and human-like arm movement, then flees toward a little river bed and behind
    a hill. The parents identify the being as the old man Tinderbox-Owner.
  language: English translation with |Xam transcription
