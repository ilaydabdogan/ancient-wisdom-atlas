canonical_text:
  quote: ''
  summary: 'The passage describes procedures after cutting up a springbok: bones are
    gnawed and deposited opposite another person''s hut entrance; the stomach is removed
    and its contents shaken onto a bone heap; blood is laded into the cleaned stomach
    by hand; spilled blood with earth and bushes is also placed at the hut entrance.
    Children eat marrow from springbok bones, and shoulder blade bones are mentioned.
    Notes add that the springbok has dangerous ''magic sticks'' and that shoulder
    blade divination is known in several other traditions.'
  language: English with transcribed Indigenous-language material
  quote_policy: summarized
