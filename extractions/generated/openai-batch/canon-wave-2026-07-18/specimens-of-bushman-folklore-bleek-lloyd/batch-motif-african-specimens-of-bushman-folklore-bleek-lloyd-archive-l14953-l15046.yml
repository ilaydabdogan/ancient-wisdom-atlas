canonical_text:
  quote: ''
  summary: The passage describes people boiling and gnawing bones, placing them on
    an ostrich breastbone dish, and depositing them near the entrance of another person's
    hut on a heap of bones. Notes explain meat distribution among a man, his wife,
    and children; a rule that women do not eat springbok shoulder blades out of respect
    for men's arrows; illness associated with failed shooting and with the springbok;
    and prohibitions on children playing on springbok skin or people playing tricks
    with springbok bones. The supplied excerpt also includes a Xam-language text segment.
  language: English with Xam-language text in the supplied excerpt
  quote_policy: summarized
