  quote: ''
  summary: The speaker says he is waiting for the moon to turn back so that he may
    return to his place. He wants to visit people, sit in the sun, and listen to stories
    that come or float from distant places. He contrasts this with his present situation
    doing household work, not visiting, and therefore not obtaining stories. He says
    the Flat Bushmen visit one another's huts, sit smoking, and obtain stories there.
