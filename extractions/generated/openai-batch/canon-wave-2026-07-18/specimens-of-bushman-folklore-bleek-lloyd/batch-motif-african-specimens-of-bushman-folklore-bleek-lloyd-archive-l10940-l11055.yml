  summary: In the supplied excerpt from “Woman and Rain Bull,” a young woman confronts
    a male figure later identified with the Rain/Rain’s Bull, applies buchu to his
    forehead, tends and leaves a child on a kaross at the hut, mounts the Rain, and
    is taken away. She asks to be set down at a large tree because she aches. Notes
