canonical_text:
  quote: For I always feel blood, when I am about to kill springbok.
  summary: The passage describes presentiments connected with hunting. A high place
    allows people to view the ground, trees, and green river beds where springbok
    may be. The speaker reports bodily sensations before killing and carrying springbok,
    and a group waits quietly when sensations indicate animals approaching. Specific
    sensations are associated with springbok feet, horns, facial stripe, and eye marks.
    An ostrich is then introduced as another animal connected with such sensation,
    but the supplied excerpt continues largely in Xam transcription without English
    translation.
  language: English; later portion includes Xam transcription
  quote_policy: quoted
