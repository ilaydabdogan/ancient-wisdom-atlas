  summary: The passage opens with speakers saying they are fatigued and will not hunt.
    It then identifies \gaunu-tsaxau as a son of the Mantis. He goes to fetch sticks
    for his father so that his father may take aim at people who sit on their heels.
    While doing this, he approaches feeding baboons. An older baboon questions him;
    after the child explains his errand, the baboon calls others to listen. Another
    baboon replies with a repeated listening refrain. Notes in the passage comment
    on rendering the baboons' manner of speaking.
