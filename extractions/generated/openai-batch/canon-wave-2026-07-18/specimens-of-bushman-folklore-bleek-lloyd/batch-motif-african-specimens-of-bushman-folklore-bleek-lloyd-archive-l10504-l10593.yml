canonical_text:
  quote: ''
  summary: A speaker points to the hill-top place associated with the young man. The
    young man's mother tells the people not to let the lion enter the huts and to
    shoot it before it reaches them. The people arm themselves and shoot at the lion,
    but it does not die. An old woman proposes giving the lion a child so it will
    leave, but the lion says it wants the person whose eye-tears it had licked. An
    old man says the lion must be a sorcerer because it will not die and insists on
    the man it carried off. The people throw children to the lion, but the lion leaves
    them alone and continues seeking the man while people shoot at it.
  language: English translation; source-language transcription also present in the
    excerpt
  quote_policy: summarized
