  summary: An old woman instructs that children should wait for the Sun, lift him
    while he lies asleep, throw him into the sky, and tell him to become fully the
    hot Sun. The children wait, see him lying with his elbow raised and his armpit
    shining on the ground, and throw him into the sky. The passage also says the Sun's
    heat dries Bushman rice and that the children listen to their mother, who transmits
    the old woman's words. The latter part of the supplied passage contains original-language
    transcription.
