    playing the goura while the rain fell. A note identifies the goura as a musical
    instrument. Another translated note reports a mother saying not to play with meat,
    because meat is laid to roast, and says a leveret is killed and roasted rather
    than played with. Most of the remaining passage is Xam transcription without supplied
    translation in this excerpt; near the end, an exclamation is glossed as one of
    suffering or pain.
