canonical_text:
  quote: ''
  summary: The passage describes repeated encounters with the Whin. When it gives
    or turns its belly toward people, they fear it and leave rather than killing it.
    When it does not give its belly, people beat, kill, and discard it, not keeping
    or eating it. One encounter occurs at water in a tree hollow. A woman lays down
    her skin necklace; the Whin turns its belly to the earth, and she kills and discards
    it. A note explains that the Whin fears the fat-worked, strongly scented necklace.
    The passage also says that if someone has died and the news has not yet been heard,
    seeing the Whin turn its belly causes fear and crying.
  language: English
