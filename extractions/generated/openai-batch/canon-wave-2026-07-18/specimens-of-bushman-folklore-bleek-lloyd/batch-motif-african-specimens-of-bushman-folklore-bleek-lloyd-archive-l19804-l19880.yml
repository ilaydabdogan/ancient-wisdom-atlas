  quote: ''
  summary: The passage states that little children are not given jackals' hearts,
    because the jackal runs away and its heart would make a child excessively fearful.
    It says that a little child eats leopard heart instead, because the leopard is
    not afraid. A narrator's note recounts a grandfather acquiring a dog, using it
    to kill jackals, skinning the jackals, and grandmothers dressing and sewing the
    skins.
