  quote: the Ostrich called, sounding afar
  summary: In a fragment from “The Lion and the Ostrich,” a speech says that eating
    the Ostrich's lungs would make others call like the Ostrich. The Lions ask women
    to make a tyebbi-ggu game in order to test whether the Ostrich calls finely. The
    Lion calls and is not applauded; the Ostrich comes and calls resoundingly, and
    the women praise the Ostrich's call. A Lion complains that the women cherish only
    the Ostrich for his sweet call. Another Lion becomes angry, attacks the Ostrich's
    Whdtten-ttu, and the Ostrich kicks back. The latter portion of the supplied passage
    shifts into original-language transcription without an accompanying translated
    narrative in the excerpt.
