canonical_text:
  quote: ''
  summary: 'The passage explains a springbok hunting tactic. A man uses ostrich feathers
    fixed to sticks, placing a larger feathered stick in bushes so that it looks like
    a standing man. The arrangement is meant to affect how springbok move during a
    drive toward other people and through a curve of feather brushes. A note explains
    that three feather brushes are used: two are set in the ground and the smallest
    is held and waved over the head to frighten the springbok.'
