canonical_text:
  quote: ''
  summary: A historical and administrative report by W. H. I. Bleek recommends support
    for research into Indigenous languages and surveys earlier and ongoing materials
    for the study of the Bushman language, including vocabularies, manuscripts, examinations
    of speakers, and records in the Grey Library.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bleek recommends the subject of Indigenous language and literature research
    to Her Majesty's Government and cites an annual Natal grant to Rev. H. Callaway
    for printing collected Zulu native literature.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The report states that the oldest and formerly only materials for knowledge
    of the Bushman language were short vocabularies and a few sentences published
    by Dr. H. Lichtenstein.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The report says Lichtenstein's materials were probably obtained mainly from
    missionaries working among Bushmen at the beginning of the century.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1857 Bleek tested Lichtenstein's vocabulary by examining Bushmen and Bushwomen
    from the Colesberg and Burghersdorp neighborhoods who were then at Robben Island
    and in Cape Town penal institutions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bleek reports that this 1857 examination led him to conclude that Bushman
    dialects within the Colony varied little from each other and were distinct from
    Hottentot.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The words collected in the 1857 examination were incorporated into a manuscript
    comparative vocabulary in Sir George Grey's Library.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In 1858 Rev. C. F. Wuras presented Sir George Grey with a short manuscript
    grammar of the Bushman language; the report says the manuscript was probably at
    Kauwau, New Zealand, or that a copy might be sent.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In 1861 Rev. G. Kronlein sent a few words and sentences from another Transgariepian
    Bushman dialect; the manuscript was in the Grey Library and had been worked into
    a concordance by Bleek.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Around 1866 Bleek had an opportunity to examine two Bushman prisoners from
    the Achterveld after their transfer from the Breakwater to the Town Prison by
    order of Sir P. E. Wodehouse.
  category: action
  evidence_refs:
  - ev:7
