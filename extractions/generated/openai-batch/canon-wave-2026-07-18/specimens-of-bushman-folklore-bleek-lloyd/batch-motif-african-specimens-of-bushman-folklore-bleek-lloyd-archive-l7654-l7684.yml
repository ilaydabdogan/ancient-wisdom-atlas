canonical_text:
  quote: ''
  summary: A speaker describes pouring soup into a child's mouth and a wife's mouth.
    The Hyena pours soup into the Lion's mouth and puts the Lion's head into a pot,
    intending to kill him with the soup's heat. The passage states that the Hyena
    deceives others, that the Lion is foolish and kills and eats people, and that
    the Hyena also kills and eats people. The Hyena carries off an old woman, then
    takes a stick and beats the Lion while the Lion's head is inside the pot, believing
    that the Lion has died.
