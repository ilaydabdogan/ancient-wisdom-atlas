canonical_text:
  quote: ''
  summary: English translation of Ikun material describing the many doings and transformations
    of Ixue. The passage reports that Kdru told the speaker about Ixue, then gives
    sequences in which Ixue changes form at sunrise or sunset into plants or trees,
    a fly, water, and, in a fragmentary note, an elephant. Ixue's wife appears in
    the Wgui-tree/fly episode and in the elephant fragment. The excerpt includes explanatory
    notes on several plant forms and a heading associating Ixue's own form with rubbing
    fire and dying.
  language: English translation with Ikun names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening states that Ixue's works or doings are many, and that the speaker's
    father's father, Kdru, told the speaker about them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first transformation sequence, Ixue is naxane at sunrise; birds eat
    Ixue; at sunset he is Ixue again and sleeps; at the next sunrise he is a large
    naxane tree; at night he is no longer a tree and is Ixue again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the further-changes sequence, sunrise and sunset frame Ixue appearing as
    dui, Omuherero, shab after going into another country, Makoba, and naxane.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Explanatory notes identify several plant forms: dui has light-coloured flowers
    and fruit that changes colour; shab is a tall tree; naxane has ground and tree
    varieties; Wgui is an edible raw thorny tree.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:5
  text: In the Wgui sequence, Ixue sleeps alone on the ground, awakens at sunrise,
    sees a little sun, and is Wgui and a tree.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ixue's wife sees the Wgui, goes to it, and tries to take hold of a Wgui fruit;
    the Wgui vanishes, and Ixue is a fly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ixue's wife lies on the earth, cries about the Wgui, and dies; Ixue as a fly
    settles on the grass.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The section heading states that Ixue is water and other things, and that in
    his own form he rubs fire and dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The opening of the water section states that Ixue is water in the shadow of
    a tree; wood pigeons appear and begin an eating action, but the supplied passage
    breaks off before the object is clear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A fragmentary numbered note states that Ixue is an elephant and mentions tusks;
    it also says his wife sees him, is afraid, prepares food, beats him with a knobkerry,
    and has hands as kaha fruit, a tree growing from her head, and long great toes.
  category: sequence
  evidence_refs:
  - ev:7
