canonical_text:
  quote: ''
  summary: 'The passage describes names traveling or floating ahead while bodies are
    not perceived, with mountains and curving roads between places. It then turns
    to IIkabbo/Wkabbo''s intended return to his own place: he thinks of the place,
    waits for the moon''s return, plans to inspect water pits, repair an old hut,
    and gather his children. The place is identified through family possession from
    his father''s father to his father, elder brother, and then himself, with further
    description of wife, children, grandchildren, and huts arranged around his central
    hut.'
  language: English translation with interleaved original-language transcription
  quote_policy: summarized
