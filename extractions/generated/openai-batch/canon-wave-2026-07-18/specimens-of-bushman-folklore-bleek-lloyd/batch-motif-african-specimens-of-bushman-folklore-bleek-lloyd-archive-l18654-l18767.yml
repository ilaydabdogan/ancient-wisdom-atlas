  summary: The passage describes making a Bushman drum by tying a wetted springbok
    skin or bag over a pot mouth with sinew and tightening it so it will sound. It
    also describes men tying springbok ears, called dancing rattles, on their feet
    or insteps while dancing to a drum beaten by women. The sound quality of the rattles
    is associated with their having been well made by a woman. A following section
    gives !Xam transcription on preparing the rattles and begins another section on
    the use of the jGoinjGoin, but without enough translated detail in the supplied
    excerpt for interpretation.
