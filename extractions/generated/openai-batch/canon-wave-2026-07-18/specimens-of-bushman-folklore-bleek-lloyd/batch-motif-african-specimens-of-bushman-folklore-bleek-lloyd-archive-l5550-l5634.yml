  quote: She first gently threw up wood ashes into the sky
  summary: A girl associated with making stars throws ashes and then roots into the
    sky after anger over not receiving enough food while she is hungry and ill in
    a hut. The passage links red stars with roots, describes her dependence on her
    mother or mothers for food, and includes a note about a girl in retreat avoiding
    looking at springbok. The passage then introduces an |Xam-language text titled
    as the Great Star, |Gaunu, singing and naming the stars.
  language: English translation with |Xam text fragments
