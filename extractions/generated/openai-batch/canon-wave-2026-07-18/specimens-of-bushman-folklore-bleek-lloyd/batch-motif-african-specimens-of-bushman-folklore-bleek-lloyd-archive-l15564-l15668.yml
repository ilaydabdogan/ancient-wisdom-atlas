canonical_text:
  quote: I came ... from my place, when I was eating a springbok. The Kafir took me;
    he bound my arms.
  summary: 'First account of IIKabbo''s capture and journey: the first-person speaker
    says he was taken and bound while eating springbok; he, his son, and his daughter''s
    husband were bound near a wagon and taken to a Magistrate; they were kept in jail
    and placed in stocks with Korannas; they ate sheep associated with the Magistrate
    and on the way to Victoria; at Victoria they worked on the road by lifting and
    rolling large stones. The supplied passage then continues in source-language transcription
    with footnotes explaining a barrow-like object and identifying Beaufort West.'
  language: English translation with source-language transcription
  quote_policy: quoted
