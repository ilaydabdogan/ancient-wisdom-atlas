canonical_text:
  quote: ''
  summary: The passage describes tto as located in a mountain mine. People fear sorcerers
    who dwell by the mine, so collectors rub themselves and throw stones at the mine
    to make the sorcerers hide before working there. The collectors obtain tto and
    Whara, put them away, and return home. Footnotes say the sorcerers' houses are
    thought of as small holes, that being seen by them would cause illness, and that
    the Whara mine is in a different place. The line range also includes the heading
    and opening of a following, mostly untranslated section about signs made to show
    the direction in which people have gone.
  language: English with |xam terms and later |xam transcription
  quote_policy: summarized
