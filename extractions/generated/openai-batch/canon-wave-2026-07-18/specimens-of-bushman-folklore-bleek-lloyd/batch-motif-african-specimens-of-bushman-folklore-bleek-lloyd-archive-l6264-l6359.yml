canonical_text:
  quote: ''
  summary: In the translated portion, Dawn's-Heart attacks the place where a hyena
    had been sitting; the hyena springs away, burns herself in the fire, and leaves
    ornaments behind. Dawn's-Heart rebukes his younger sister-in-law for concealing
    the hyena and notes that the figure had sat with her back toward him, unlike his
    wife, who sat facing him. He asks where his wife seems to be, and the younger
    sister-in-law tells him to wait until it is light and the sun has come out. Footnotes
    explain that the hyena had sat afraid in the house, removed bracelets, worn the
    wife's things, and that Dawn's-Heart had married the hyena because he thought
    it was his wife. The later supplied lines are original-language transcription
    without an English translation in this passage.
  language: English translation and notes, with original-language transcription in
    later lines
