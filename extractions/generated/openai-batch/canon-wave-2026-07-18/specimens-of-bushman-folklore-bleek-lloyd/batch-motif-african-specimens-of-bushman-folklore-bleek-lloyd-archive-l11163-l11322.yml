canonical_text:
  quote: ''
  summary: A transitional fragment describes a young woman removing the scent of the
    Wkhou from herself and old women burning horns so the rising smell will keep the
    Rain from anger. The following story tells of an ill girl who refuses ordinary
    food and secretly kills and eats the Water's children. Her mothers leave a child
    at home to watch her. The child sees the girl go to the spring, kill a Water-child,
    carry it home, boil and eat it, and lie down again. The child reports this to
    the mother, who identifies the creature as a Water-child. Later, while the mother
    seeks food, clouds and a whirlwind appear, and she says that something is wrong
    at home and that the whirlwind is taking things to the spring.
  language: English with embedded |Xam transcription and terms
  quote_policy: summarized
