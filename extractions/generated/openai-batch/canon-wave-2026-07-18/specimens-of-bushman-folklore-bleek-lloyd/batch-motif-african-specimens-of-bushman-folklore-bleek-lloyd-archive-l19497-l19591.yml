canonical_text:
  quote: '"a thing which looked like a little child, as it sat upon the salt pan"'
  summary: After people have come to bury the narrator's wife, the group crosses a
    salt pan and sees a seated thing that looks like a little child or person. The
    narrator's sisters compare it to the narrator's wife, especially because it appears
    to wear her cap. Wkic-dii recalls an old saying about angry people who take a
    person away and let that person be seen in front of others. The narrator says
    he will look for it again when he returns home. The latter part of the supplied
    passage contains untranslated transcription and notes.
  language: English with Xam transcription and editorial notes
  quote_policy: quoted
