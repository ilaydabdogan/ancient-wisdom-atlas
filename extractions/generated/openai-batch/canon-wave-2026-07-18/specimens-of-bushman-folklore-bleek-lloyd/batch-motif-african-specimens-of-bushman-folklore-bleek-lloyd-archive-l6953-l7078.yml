canonical_text:
  quote: ''
  summary: A fragment of a Wind narrative describes a male figure flying away, returning
    after seeking food, eating about, returning again, and sleeping. An editorial
    note then frames a related Bushman belief that the wind wears bird form. Smoke's
    Man reports seeing the wind at Haarfontein/Haarfontein's mountain. He throws a
    stone at it while thinking it is a certain bird; the wind bursts, raises dust,
    flies away, and enters a mountain hole. Smoke's Man, frightened, goes home and
    shelters under hut bushes while dust obscures the sheep; the sheep return, he
    later brings them to the kraal after sunset, and he waits for his mother to bring
    food.
  language: English with /Xam transcription
  quote_policy: summarized
