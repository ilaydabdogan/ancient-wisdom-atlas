canonical_text:
  quote: ''
  summary: 'The passage recounts //Kabbo''s capture and forced journey: he and others
    carry earth and work with a wagon, are bound to a wagon chain, pass through Beaufort
    jail, travel through water and to the Breakwater, then are taken by train to the
    Cape prison. A second account lists his family present at capture, says a small
    group was taken by Kafir police, describes travel by wagon, a roadside fire and
    roasted meat, and later movement toward the Magistrate while wives walked on foot.'
  language: English translation with Xam transcription
  quote_policy: summarized
