  quote: ''
  summary: 'The passage describes preparing dancing rattles from springbok ears: a
    woman removes the hairy skin, sews the inner skin, fills the ears with soft earth
    to dry them, removes the earth, inserts k6rri berries, ties the opening with sinew,
    pierces the ears, and adds threads so men can fasten the rattles to their feet.
    A following section states that people beat the \gbin\gdih so that bees may become
    abundant, then continues in transcribed |Xam text not translated in this excerpt.'
