  summary: The passage records several short songs of the Blue Crane. One song speaks
    of berries on the bird's shoulder. Two song-contexts repeat the image of a white
    stone splinter, once when running away from a man and once when walking slowly
    away in a “walk of peace.” Another song-context, when the bird flaps its wings,
    mentions scraping a springbok skin for a bed. Footnotes report Wkdbbo's explanations,
    including that the white stone splinter refers to the bird's head and white feathers,
    and that one song belongs to the “first” old people.
