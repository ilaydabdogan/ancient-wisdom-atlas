canonical_text:
  quote: ''
  summary: The passage describes practices for distributing, gnawing, and putting
    away springbok bones and parts; preventing dogs from eating or crunching certain
    bones; preparing springbok-skin bags; exchanging bags for materials, arrows, and
    poison; and Tsatsi's related treatment of bones, including a stated link between
    dogs eating springbok parts and injury to the hunter's first finger. A final heading
    introduces the narrator's father-in-law's treatment of bones, followed by untranslated
    Xam text in this excerpt.
  language: English translation with embedded Xam transcription
