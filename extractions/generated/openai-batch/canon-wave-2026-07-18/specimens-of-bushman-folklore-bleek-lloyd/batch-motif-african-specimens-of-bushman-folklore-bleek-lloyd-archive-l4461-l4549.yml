canonical_text:
  quote: ''
  summary: A youth tells his grandmother that young men threw up Sun-armpit and instructed
    him to become the hot Sun so that people would no longer be cold, food could dry,
    the earth would be light and warm, and darkness would be removed. The passage
    then describes the recurring appearances of the Sun, darkness, and moon. The Sun
    pierces the moon with the Sun's knife; the moon decays and asks that its backbone
    be left for the children, which the Sun does.
