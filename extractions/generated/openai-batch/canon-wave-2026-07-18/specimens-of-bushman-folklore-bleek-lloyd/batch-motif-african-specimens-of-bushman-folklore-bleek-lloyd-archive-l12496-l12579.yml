  summary: 'The passage gives a short Caama Fox song about crossing the fox''s spoor,
    with an explanatory note in which a dog fails to kill the Caama Fox and becomes
    exhausted while the fox rests. It then gives Blue Crane songs: the Blue Crane
    sings of krieboom berries on its shoulder, with editorial notes on the berries
