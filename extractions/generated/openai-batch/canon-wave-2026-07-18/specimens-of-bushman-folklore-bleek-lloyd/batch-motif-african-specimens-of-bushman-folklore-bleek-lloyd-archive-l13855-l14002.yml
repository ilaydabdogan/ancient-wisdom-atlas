canonical_text:
  quote: ''
  summary: The Saxicola Castor laughs at a wild cat lying asleep, and other little
    birds join in laughing. In the following tale opening, baboons see ||abbiten||abbiten
    returning from white men with flour. They plan to knock him down; he insults their
    foreheads, and they angrily break sticks to beat him. The baboons' children ask
    for his head as a plaything. Hearing this, ||abbiten||abbiten decides to climb
    a krieboom because the baboons are numerous. The baboons gather below; the children
    discuss his large head, and a grown-up baboon says the adults, rather than children,
    would get the pieces. The supplied passage ends mid-action.
  language: English, with San names and terms
  quote_policy: summarized
