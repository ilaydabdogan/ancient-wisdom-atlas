canonical_text:
  quote: ''
  summary: A first-person narrator recalls being rebuked by the mother for acting
    like Wkunh/Whunh, a person associated with stopping rain when angry. The narrator
    continues lying down and playing the goura. Lightning from the rain shines into
    the people's eyes, their eyes feel closed and green, and the lightning passes
    over them and shatters a stone outside the hut. The mother exclaims, and the father
    asks what is wrong. A note identifies Whanri/Coos Groot-Oog as a rain sorcerer
    associated with a place called Evvicass Pits.
  language: English with some transcribed |xam text in the supplied passage
