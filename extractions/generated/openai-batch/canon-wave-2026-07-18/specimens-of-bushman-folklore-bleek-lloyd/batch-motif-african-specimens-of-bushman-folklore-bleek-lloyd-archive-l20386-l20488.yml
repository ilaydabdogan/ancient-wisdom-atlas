canonical_text:
  quote: ''
  summary: 'The passage describes practical signs used in travel and distress: a person
    reads a reversed branch as indicating where people have gone toward water, then
    follows footprints and a footpath to a house; another account says a man faint
    from heat on the way home throws earth into the air so that people at home, especially
    his wife watching for him, may see the dust and come to help.'
  language: English with interlinear or source-language transcription in part of the
    passage
