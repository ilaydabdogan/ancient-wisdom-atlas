  quote: ''
  summary: Fragment in which the Mantis recounts playing ball among baboons with his
    grandson's eye; the eye vanishes, the baboons accuse and fight him, and he comes
    away flying. After being questioned about going among strangers, the Mantis says
    yearning took him among the baboons, while concealing that he placed the child's
    eye in water. He later returns to the water to look for the child or eye; the
    child repeatedly hears him approaching and enters the water. The child grows back
    to its former condition and is seen sitting in the sun before fleeing again into
    the water. The supplied passage then continues largely in untranslated /Xam transliteration.
