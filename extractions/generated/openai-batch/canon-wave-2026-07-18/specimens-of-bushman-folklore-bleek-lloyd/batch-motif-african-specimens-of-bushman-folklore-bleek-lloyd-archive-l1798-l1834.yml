canonical_text:
  quote: ''
  summary: The passage describes Bushmen living away from frontier conflict, hunting
    game and drinking ancestral waters without knowledge of different peoples. It
    then describes the Dutch East India Company station at Table Bay in 1652, contrasts
    Portuguese presence at Sofala, and frames 1652 onward as an opportunity for study
    of Bushman life, thought, speech, and religious ideas. It also reports a broad
    historical claim that this race once extended across Africa and beyond, with possible
    modern representatives in parts of South-Eastern Asia, and connects it to prehistoric
    hunters and ivory carvers in France.
  language: English
  quote_policy: summarized
