  quote: ''
  summary: A report explains the anthropological purpose of photographs of Bushmen,
    the use of genealogical tables to clarify kinship, relationships among individuals
    in a photographed group, supplemental measurements, notation for Bushman name
    pronunciation, and the incompleteness of the photographic collection because no
    females had yet been photographed.
