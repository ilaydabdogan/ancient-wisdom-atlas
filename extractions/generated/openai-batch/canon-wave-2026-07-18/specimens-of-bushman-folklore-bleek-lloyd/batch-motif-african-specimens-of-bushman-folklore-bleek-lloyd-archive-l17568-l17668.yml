canonical_text:
  quote: ''
  summary: The passage describes Bushman presentiments in which bodily tapping or
    sensations correspond to approaching people or animals. A man feels the place
    of an old wound before grandfather arrives; another sensation at the ribs is taken
    as springbok coming. Footnotes add examples involving an ostrich scratching its
    neck, springbok scratching themselves, and a returning woman whose child-sling
    thong is felt on a seated man's shoulders.
  language: English with embedded |Xam transcription
