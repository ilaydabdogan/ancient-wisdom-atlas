canonical_text:
  quote: The moon is carrying people who are dead.
  summary: The passage says that after death the wind removes human footprints, gall
    sits green in the sky, and hair resembles clouds. A remembered mother explains
    that a hollow moon carries dead people and signals that news of a death may be
    heard. A footnote adds a related explanation that, under certain shade conditions,
    the liver goes out and clouds are made.
  language: English
  quote_policy: quoted
