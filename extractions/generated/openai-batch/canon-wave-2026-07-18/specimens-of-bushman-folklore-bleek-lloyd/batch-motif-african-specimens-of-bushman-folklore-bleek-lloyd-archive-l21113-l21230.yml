  summary: The passage contains the close of a Death section in which knowledgeable
    speakers identify certain clouds as a person's clouds and as the hair of that
    person's head. It then begins an appendix of !Kũn texts about !ue, stating that
    !ue's doings are many, and listing material on !ue's transformations, including
    !ue as !naxane, further changes of form, a tree/day-night form, fire, a hut, a
    place where !ue went into the earth, a place where water had been, a little bow,
    a quiver, a !naxane grown from his teeth, and wood-pigeon's feathers.
  language: English with transliterated Indigenous-language text
