canonical_text:
  quote: ''
  summary: 'The passage describes procedures for preparing a new clay pot: boiling
    gum and applying it to the pot, obtaining springbok blood, boiling the blood in
    the pot, allowing remaining blood to dry, then boiling water and meat. It also
    records a rule against striking bones with a stone while a new pot is on the fire,
    notes gendered craft work and the pot-maker''s female maternal teachers, and includes
    adjacent notes and captions for implements, arrows, eating tools, and animal drawings.'
  language: English, with embedded Indigenous-language terms and captions
  quote_policy: summarized
