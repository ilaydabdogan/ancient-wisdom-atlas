canonical_text:
  quote: ''
  summary: 'The passage begins with a fragment in which the Mantis says a child is
    not strong, explains that he came to put the child''s eye into water, notes that
    the child came out of the water, and says he will care for him until he becomes
    strong. The passage then begins the story of the Leopard Tortoise: while people
    are away hunting, an ill female at a hut asks a hunter to rub her aching neck
    with fat. When he does so, she holds him by drawing in her neck, and his hands
    decay. She then sees another hunter and repeats the request. Footnotes identify
    the leopard tortoise as Testudo partialis, say the misfortune happened to men
    of the Early Race, and explain that the hands decayed down to bone. The end of
    the passage includes source-language transcription not independently interpreted
    here.'
