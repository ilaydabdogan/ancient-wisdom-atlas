  summary: The Mantis dreams that baboons have killed the child and made the child's
    eye into a ball. He rises, takes up his quiver with rattling arrows, sees the
    dust of the baboons playing ball with the eye, cries, dries his tears so the baboons
    will not notice, and runs toward them. The baboons stare at him because they are
    startled and unused to seeing him.
