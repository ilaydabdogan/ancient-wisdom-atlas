canonical_text:
  quote: ''
  summary: An appendix report contrasts Bantu, Hottentot/Khoi khoi, and Bushman groups
    in terms of social organization, religious worship, language, literature, counting
    systems, possible relationship, physical appearance, and geographic origins of
    photographed Bushman individuals. It includes an anecdote in which the writer
    identifies a man among Korannas as Bushman by ear and head shape, and the man
    says he was raised among Korannas from childhood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes Bantu peoples as worshipping, speaking prefix-pronominal
    languages, having prosaic ideas and literature, and using a decimal counting system
    described as clumsy in application.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Hottentots or Khoi khoi as pastoral, sometimes polygamous,
    ruled by hereditary chiefs, formerly worshipping the moon, speaking a clicking
    monosyllabic sex-denoting language, having myths and fables in traditionary literature,
    and using a decimal counting system.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes Bushmen as hunters, strictly monogamous, without chiefs,
    worshipping moon, sun, and stars, speaking a harsh clicking and guttural monosyllabic
    language, having extensive mythological traditionary literature, and using a binal
    counting system without names beyond the third number.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Bushmen and Hottentots may originally have been one
    race with languages of common descent, but says this relationship has not been
    proved and should not yet be assumed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that Bushmen and Hottentots are physically closer to each
    other than either is to Kafir and Negro groups.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The writer says the difference in appearance between Hottentots and Bushmen
    is usually marked, and singles out the small Bushman ear and near absence of an
    outer lobe as distinctive from Korannas represented at the Breakwater Convict
    Station.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The writer reports identifying a man in a group of Korannas as Bushman, after
    observing his ear and head shape; the man confirms he is Bushman but was raised
    among Korannas since childhood.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says the Bushmen represented in the photographs mostly come from
    the Strontbergen region, nearby areas, the country toward Kenhart, and especially
    the Hartebeest River.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: A footnote distinguishes people called Bushmen because they had adopted Bushman
    life after losing cattle from people described by the author as belonging physically,
    linguistically, and ideationally to the Bushman nation.
  category: attribute
  evidence_refs:
  - ev:9
