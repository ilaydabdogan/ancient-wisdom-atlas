  summary: The preface presents the volume as a small selection from a larger collected
    body of Bushman native literature, notes uncertainty about publication of remaining
    manuscripts and copied Bushman pictures, explains irregular spelling and line
    correspondence issues, describes marginal manuscript-number references, and gives
    an explanation of extra orthographic signs used for clicks, throat sounds, nasalization,
    tone, intonation, and breath arrest.
