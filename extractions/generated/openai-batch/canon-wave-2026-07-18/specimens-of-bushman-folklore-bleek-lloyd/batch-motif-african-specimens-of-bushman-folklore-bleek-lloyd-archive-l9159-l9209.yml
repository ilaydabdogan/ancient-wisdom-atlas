canonical_text:
  quote: ''
  summary: After an elder sister has gone, the Vultures leave her house, sit outside
    it, and discuss sending someone upward to see what the place above is like. A
    little Vulture girl, called the younger or little sister, ascends into the sky,
    disappears from sight, later descends or falls back from the sky, and sits among
    them. When asked what the place is like, she says her elder sister, a grown-up
    girl who is there, should ascend to look because something may be perceived above.
    The elder sister then begins to ascend as the excerpt breaks off.
  language: English with a brief Xam transcription fragment at the end
