canonical_text:
  quote: ''
  summary: 'The passage describes responses to theft: a husband obtains a stolen item
    from his wife, refuses to return it to her, and says it must go back to its owner.
    It then states that a husband may kill a wife who has stolen. A father tries to
    restrain him. A later section describes a female child living in another person''s
    hut and being handed over if she steals. Notes add variants involving a surviving
    mother, an old offender burned to death, and killing with an arrow.'
  language: English; includes some transcribed Ikun text and editorial notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A husband asks his wife to give him her thing so that he may look at it; after
    persuasion she gives it, and he puts it into a bag.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife cries and asks for the thing back, addressing the man as her husband.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband refuses to listen to the wife and says that the other person would
    kill him, so he will give the other person's thing to the other person.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that if a woman steals another person's thing and returns
    to her husband, the husband sees it, his heart aches, and he kills her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another man, glossed as the husband's father, tells him not to quite kill
    his wife; a note explains this as meaning that he may beat her.
  category: speech
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:6
  text: The husband answers that he objects to stealing, that his heart aches, that
    he will kill his wife, and that the others must fear him that day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A female child whose mother is dead and who is an only child goes to another
    person's hut.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: If that female child steals, the person whose hut she entered takes her and
    gives her to another person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A note says that if the father is dead and the mother alive, the woman who
    stole is still taken and given back to the mother; if she is an old offender,
    the mother may give her through a son to another person to be burned to death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note says the husband kills his wife by shooting her with an arrow, specifically
