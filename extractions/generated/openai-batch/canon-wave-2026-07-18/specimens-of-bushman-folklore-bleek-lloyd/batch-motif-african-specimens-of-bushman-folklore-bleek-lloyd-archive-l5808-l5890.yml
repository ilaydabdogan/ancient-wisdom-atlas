  quote: The Stars said, "Tsaii ! Tsau !"
  summary: The passage reports that the Stars make sounds in summer. A first-person
    speaker remembers sitting outside with his grandfather and asking what spoke;
    the grandfather identifies the Stars and says they curse the springboks' eyes
    for people. The grandfather addresses Canopus when it newly appears, asking the
    star to exchange heart, stomach, and arm with him so that he may be satisfied
    and his arrow may hit springbok. The excerpt then begins a following item titled
    as concerning iKQ-GINUIIN-TARA, wife of the Dawn's-Heart Star, Jupiter, followed
    by transcribed original-language text and notes without an English narrative translation
    in the supplied passage.
  language: English with transcribed ǀXam/San text in the latter segment
