canonical_text:
  quote: THE WIFE OF THE DAWN'S-HEART STAR.
  summary: The passage identifies ko-g-nuih-tdra as wife of the Dawn's-Heart Star,
    Jupiter. It describes the gathering and sifting of haken and haken larvae. A female
    hyena contaminates haken with blackened perspiration from her armpits, and an
    animal-bird group gives the haken to ko-g-nuih-tdra. She tells her younger sister
    not to eat it, says she herself will eat it, and instructs the sister to take
    care of the child. A note says the child is ko-g-nuih-tdra's child and that Dawn's-Heart
    buried the child away from his wife under a plant.
  language: English with transcribed ǀXam terms and continuation
  quote_policy: quoted
