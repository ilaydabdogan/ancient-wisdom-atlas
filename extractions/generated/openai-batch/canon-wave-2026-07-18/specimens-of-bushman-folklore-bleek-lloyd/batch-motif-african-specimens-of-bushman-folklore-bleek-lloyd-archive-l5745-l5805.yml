canonical_text:
  quote: ''
  summary: In a prayer to a Star, the Bushmen wish to perceive hunting-related things,
    ask the Star to take their hungry heart, and ask to receive the Star's heart of
    plenty so that they may not hunger. The Stars are also said to call “Tsau! Tsau!”
    and to curse the springboks' eyes for the people; the narrator says his grandfather
    Tsqtsi identified the speakers as the Stars.
