canonical_text:
  quote: ''
  summary: 'The passage describes a Bushman dance: men dance standing around while
    women sit and drum; dust from the dancing feet and from the drum lies on the women’s
    faces. After dancing, the dancers are tired and sleep as the sun sets and the
    place becomes dark. In the morning children are sent to fetch water because the
    dancers are thirsty. The supplied range then begins a new section titled preparation
    of feather brushes used in springbok hunting, attributed to lhan+kass’o from personal
    observation.'
