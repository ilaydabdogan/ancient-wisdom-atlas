  summary: The passage describes several nineteenth-century efforts by frontier farmers,
    missionaries, and the Orange River Sovereignty government to settle or employ
    Bushman groups, all described as unsuccessful. It then notes that some white children
    learned Bushman languages on farms, but that this knowledge was not written down
    and died with them.
