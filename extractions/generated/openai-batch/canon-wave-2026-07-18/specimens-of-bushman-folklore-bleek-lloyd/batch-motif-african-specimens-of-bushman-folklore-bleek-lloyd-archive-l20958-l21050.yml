canonical_text:
  quote: ''
  summary: 'The passage first gives a teaching about Rain and lightning: Rain can
    smell human scent, lighten in the sky, and intend to kill people by stealth, but
    people who quickly look toward the lightning cause the thunderbolts to turn back
    because the human eye shines like them; Rain then passes over without killing.
    A footnote describes the thunderbolts as black, pointed, shining stones from the
    sky. The next section states that, when humans die, their own wind blows; humans
    possess wind and make clouds; wind makes dust to take away the footprints made
    while they were alive. A section heading names Wind, Moon, and Cloud in relation
    to human beings after death, but much of the following supplied text is untranslated
    transcription.'
  language: English with original-language transcription in part
  quote_policy: summarized
