canonical_text:
  quote: ''
  summary: In an origin-of-death passage, the hare mourns his mother and insists that
    she is altogether dead and will not return alive. The Moon tells the hare to stop
    crying and says that the mother is not altogether dead and will return alive.
    When the hare refuses to assent, the Moon angrily strikes and cleaves the hare's
    mouth, declares that he will bear a scar and be pursued and torn by dogs, and
    decrees that people will die away without returning alive. Notes identify the
    hare as a young male who had been a person and was cursed by the Moon to become
    a hare.
  language: English translation, with /Xam transcription and editorial notes in the
    supplied passage
