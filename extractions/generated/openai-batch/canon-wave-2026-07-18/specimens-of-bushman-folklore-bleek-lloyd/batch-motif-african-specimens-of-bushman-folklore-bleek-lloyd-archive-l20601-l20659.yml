canonical_text:
  quote: For the stars know the time at which we die.
  summary: The passage says that when a person's heart falls down or falls over at
    death, a star also falls. Stars know when people die and, by falling, tell other
    people who do not know that a death or other bad event has happened elsewhere.
    People who see a falling star expect to hear news of something bad from another
    place.
