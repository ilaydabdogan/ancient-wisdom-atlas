canonical_text:
  quote: ''
  summary: Ddi-yerreten learns that the Lioness has gathered other people's children
    to live with her and work for her because she is ill and cannot do hard work.
    While the Lioness is away dipping water, Ddi-yerreten goes to her house, addresses
    the children, and repeatedly tells groups of them where their own people's fire
    is. The children then leave and go back to their own people.
