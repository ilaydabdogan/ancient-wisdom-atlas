canonical_text:
  quote: ''
  summary: The passage first locates Wkabbo's home area, named places, a water pool,
    and a game pitfall. It then recounts that Wkabbo fetched and brought up Betje
    after her father and mother died. Footnotes describe the father's murder, the
    mother's death and exposed remains, the younger sister carrying the child, Wkabbo
    leaving home to retrieve the child, and his return home with her. Wkabbo also
    explains that, as a young and fleet hunter, he expected to feed Betje and his
    own child with game.
  language: English with embedded |Xam transcription
  quote_policy: summarized
