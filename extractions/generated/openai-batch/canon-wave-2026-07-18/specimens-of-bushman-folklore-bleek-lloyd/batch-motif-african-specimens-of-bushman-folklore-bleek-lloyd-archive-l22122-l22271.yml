canonical_text:
  quote: ''
  summary: 'The passage first describes a treatment of theft: a woman’s child steals
    or eats the household’s food, and the household gives the child and mother to
    other local people, who burn both with fire and report back. The household approves,
    says it objects to stealing, and later enters exchanges involving an elephant
    tusk, the Makoba, a bull, and Indian Hemp. The passage then begins a section on
    the four wooden divining pieces called \xu: women and girls respect them and do
    not handle them, while men and a male child do handle them; the objects are described
    as a set of four, two male and two female, made from the \ke tree.'
  language: English with Jkun terms and editorial transliteration
  quote_policy: summarized
