canonical_text:
  quote: ''
  summary: In a passage headed as the Mantis in the form of a hartebeest, children
    or sisters cut up the hartebeest. Portions of the cut flesh move or reposition
    themselves on bushes. The speakers remark that the hartebeest's flesh moves and
    prepare burdens for carrying pieces home. A note says the children truly thought
    the flesh moved and compares it to human flesh that quivers while warm and living,
    becoming dead when cold. The passage also includes |xam/Bushman-language text
    and a note identifying Mantis's speech.
