canonical_text:
  quote: ''
  summary: A name-utterer waits until his father has finished sheltering a hut, then
    calls out names and runs home. The other one, identified in the passage as the
    wind, falls and kicks on a vlei; huts and sheltering bushes are broken and dust
    prevents people from seeing. The wind's mother comes from her hut and raises him
    to his feet, after which the wind becomes still. The narrator explains that Bushmen
    say the wind is lying down when it blows strongly and standing upright when it
    is still.
  language: English with !Xam transcription and editorial notes
