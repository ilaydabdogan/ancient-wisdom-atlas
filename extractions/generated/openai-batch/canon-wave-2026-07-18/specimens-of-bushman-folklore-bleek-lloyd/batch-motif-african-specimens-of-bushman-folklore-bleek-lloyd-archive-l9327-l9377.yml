  quote: ''
  summary: A group associated with the Vultures is told to leave an undercut or meat
    portion for their elder sister when she comes. They see her approaching, leave
    meat in a springbok skin, and disperse. The elder sister rebukes them, takes up
    the springbok, and returns home, while the Vultures fly on and seek another springbok
    to eat.
