canonical_text:
  quote: ''
  summary: In a tale headed as the Mantis in the form of a hartebeest, the Mantis's
    body parts rejoin while the children run home. He arises whole and is described
    as a man, moves by way of a river bed, and returns to his own house. The children
    report that they saw a dead hartebeest, cut it with stone knives, and saw its
    flesh move by itself and its head whisper or talk. One child tells her father
    that the hartebeest head spoke to her. The latter part of the supplied extract
    continues in /Xam transcription without an English translation in the provided
    passage.
  language: English with /Xam transcription segments
