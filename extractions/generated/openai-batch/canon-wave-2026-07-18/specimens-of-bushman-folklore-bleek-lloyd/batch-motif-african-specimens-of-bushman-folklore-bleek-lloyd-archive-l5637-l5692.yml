  summary: The opening fragment describes a girl thinking about saliva placed in springbok
    meat, its imagined movement into a bow, her fear of young men's game, and her
    relation to her father's game and hands. The main section describes \gaunu as
    a former great Star who called and sang the names of the Stars, so that the Stars
    possess names, including small stars named Wywhai. Footnotes give source and astronomical-identification
    notes.
