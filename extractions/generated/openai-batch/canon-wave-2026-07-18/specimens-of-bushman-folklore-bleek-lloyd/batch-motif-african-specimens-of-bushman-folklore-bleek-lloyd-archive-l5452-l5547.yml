canonical_text:
  quote: The Milky Way gently glows; while it feels that it is wood ashes.
  summary: The passage describes the Stars and Milky Way moving across the sky, explains
    the Milky Way as wood ashes thrown up by a girl to give night light for people,
    and includes notes that the same girl made stars from \huih roots and locusts
    from \kuissi peel. A further note explains a custom of placing a grown girl in
    a tiny hut made by her mother.
  language: English translation with transcribed source-language material and editorial
