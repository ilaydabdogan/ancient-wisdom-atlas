canonical_text:
  quote: ''
  summary: 'The passage describes colonial proclamations and ordinances affecting
    Bushmen: an 1809 proclamation made them British subjects and restrained roaming;
    an 1812 proclamation under Governor Sir John Cradock apprenticed certain children;
    and an 1828 ordinance removed restraints and granted formal rights while land
    formerly hunted by their ancestors was allotted to European settlers, with penalties
    for later taking livestock there.'
  language: English
  quote_policy: summarized
