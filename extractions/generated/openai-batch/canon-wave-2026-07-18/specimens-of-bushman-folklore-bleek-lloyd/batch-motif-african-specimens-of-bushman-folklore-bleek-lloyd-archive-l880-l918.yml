  quote: ''
  summary: 'The preface gives two instances meant to show the continuing activity
    of Bushman beliefs: an owl''s breathing-like night sound near a child''s window
    after Dr. Bleek''s death, and a red fungus described as a rain-related object
    whose threatened disposal is linked to violent weather.'
  language: English
