canonical_text:
  quote: ''
  summary: 'In a fragment from “The Hyena’s Revenge,” a male Hyena removes a pot from
    the fire and intends to kill the Lion with the soup’s heat, because he feels the
    Lion was stingy toward him about quagga flesh. The Hyena deceives the Lion with
    ostrich flesh and intends to put the Lion’s head into the pot. The passage also
    states a same-species marriage pattern among animal persons: Lion with Lioness,
    Hyena with female Hyena, leopard with leopardess, and hunting leopard with hunting
    leopardess.'
