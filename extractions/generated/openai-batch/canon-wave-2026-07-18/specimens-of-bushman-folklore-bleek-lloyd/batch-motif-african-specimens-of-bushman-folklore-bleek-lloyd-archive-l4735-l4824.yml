canonical_text:
  quote: ''
  summary: 'The excerpt states that after the first Bushmen had passed away, the Flat
    Bushmen occupied their ground and taught children stories of the First Bushmen.
    It then says that the Sun had once been a man and talked, and that the Sun and
    Moon formerly lived on earth and spoke, whereas now they live silently in the
    sky. A titled section introduces an origin-of-death narrative preceded by a prayer
    to the young Moon: when the Moon has newly returned alive and is shown to people,
    they look at it, cover their eyes with their hands, and address it. The prayer
    asks the Moon to take the speaker''s unpleasant face and give its own face, so
    that the speaker may resemble the Moon, which dies, is unseen, and returns alive.
    The prayer also says the hare told the Moon to do this. The supplied excerpt then
    continues in transcribed source-language text without an English translation in
    the provided passage.'
  language: English translation with transcribed Xam/San-language text
  quote_policy: summarized
