canonical_text:
  quote: ''
  summary: In the translated portion, a younger sister repeatedly brings a child to
    her elder sister at the reeds so the child may suck. The elder sister warns that
    she may forget or no longer know them. Later, at a \ku dance or game at the house,
    men play and nod while women clap. Dawn's-Heart, identified by the section header
    as a star, places his hand on his younger sister-in-law's shoulder; she swerves
    away and angrily tells him that his old she-hyena wives may clap for him. The
    supplied excerpt then continues partly in untranslated /Xam transcription.
  language: English translation with embedded /Xam transcription
  quote_policy: summarized
