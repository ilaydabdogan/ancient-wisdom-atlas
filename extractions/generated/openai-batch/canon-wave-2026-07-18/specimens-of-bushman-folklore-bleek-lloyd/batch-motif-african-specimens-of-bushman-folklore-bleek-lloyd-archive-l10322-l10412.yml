  summary: In the English-translated portion of the excerpt, the man tries to prevent
    the lion from smelling or following his footprints. He plans to run in a zigzag
    direction rather than straight into the house, calls from the top of a hill to
    people at home, says he has been “lifted up,” and asks them to roll him in many
    hartebeest-skins and mats. The stated reason is that the lion may return, miss
    him, and track him, because a lion does not leave uneaten prey. A footnote says
    he may be avoiding the name of the lion. The later portion supplied is original-language
    transcription without an English translation in the excerpt.
