  quote: '"the moon has been cut"'
  summary: A fragment describes one man hiding his decayed hands after they had been
    in the Leopard Tortoise's neck. He urges his mate to rub their ill elder sister
    with fat. The Leopard Tortoise tells the mate to put his hands into her neck,
    draws in her head, and holds him fast while he tries to dash her against the ground.
    The first man shows his damaged hands and leaves. An explanatory note connects
    the phrase about the cut moon with a Bushman mythological account in which the
    male Moon is cut by the Sun, spared as a small piece, regrows, and is cut again.
