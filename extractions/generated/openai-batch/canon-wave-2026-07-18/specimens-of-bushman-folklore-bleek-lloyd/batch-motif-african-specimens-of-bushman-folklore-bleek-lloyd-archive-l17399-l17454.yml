  summary: The passage contains a second account headed as cutting off the top of
    the little finger, with an editorial note explaining that a child’s finger joint
    is cut off with a reed before nursing, in order to make children live and grow
    up. It then introduces a section on Bushman presentiments, described by Bleek
    as bodily sensations that announce coming events; a beating of the flesh tells
    things, but those who do not understand and disobey these teachings fall into
    trouble, such as being killed by a lion.
