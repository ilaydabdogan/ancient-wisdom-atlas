canonical_text:
  quote: ''
  summary: The passage gives two versions of “The Old Woman’s Song.” An old woman
    sings about an old she-hyena carrying her away from an old hut. In the first version,
    the old woman springs aside, rises, beats the hyena, and the song says the hyena
    killed the hyena. A note explains that the hyena killed herself by hurling herself
    onto the pointed rock on which she had meant to throw the old woman. Another note
    explains that the old woman was too weak to travel, had been left in an old deserted
    hut by her starving sons, and was left with fire and wood. The end of the supplied
    excerpt begins another song section attributed in the heading to “STAE jGAUNU”
    and especially to Bushman women.
  language: English, with a short untranslated transcribed-language excerpt in the
    following song section
