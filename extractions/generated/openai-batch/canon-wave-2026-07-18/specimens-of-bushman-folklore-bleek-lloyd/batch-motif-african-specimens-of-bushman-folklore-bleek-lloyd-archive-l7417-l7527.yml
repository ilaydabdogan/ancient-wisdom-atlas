canonical_text:
  quote: ''
  summary: In an animal fable, Hyena deceives Lion after feeling wronged over quagga
    flesh. Lion comes to Hyena's house while Hyena is boiling ostrich flesh. Hyena
    offers Lion soup, places the hot pot over Lion's head, and the hot soup burns
    Lion's eyes, mouth, and throat until Lion dies. Hyena then beats him with a stick
    and breaks the pot.
