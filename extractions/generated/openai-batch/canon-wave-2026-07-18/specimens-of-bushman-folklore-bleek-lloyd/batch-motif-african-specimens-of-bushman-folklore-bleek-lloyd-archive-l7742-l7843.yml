  summary: The passage describes Lions discussing the Ostrich, whose call is praised
    by women. The Lions ask how they can deceive, propose arranging a game called
    gebbi-ggu, explain that the Ostrich calls well because he calls with his lungs,
    and state a plan to kill the Ostrich and take out his lungs. Notes in the passage
    connect an Ostrich scar to a Lion's nail and describe a Grass Bushmen game in
    which men call like male ostriches while women clap, dance, and sing.
