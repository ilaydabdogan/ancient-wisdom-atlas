canonical_text:
  quote: ''
  summary: The passage explains hunting observances called \nanna-sse. After shooting
    game, hunters show respect to the game, are given only food believed to help the
    poison kill, and avoid eating, touching, or carrying springbok meat because the
    springbok's fleet, wandering, unsleeping qualities and scent are said to affect
    the wounded game. Elders regulate the food rules, and a clever man can identify
    springbok handling as the cause of an improper scent or effect.
  language: English translation with interleaved original-language transcription
