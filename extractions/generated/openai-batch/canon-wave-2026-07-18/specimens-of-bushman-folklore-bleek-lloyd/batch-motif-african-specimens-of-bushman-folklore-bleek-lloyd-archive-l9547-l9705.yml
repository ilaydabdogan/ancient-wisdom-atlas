canonical_text:
  quote: ''
  summary: Ddi-^erreten repeatedly tells groups of children where their people’s fire
    is, at the top of a ravine descending from a hill, and the children rise and go
    away to their own people. He waits for the Lioness. The Lioness returns from the
    water, notices that the children are absent, recognizes or suspects Ddi-^erreten,
    and demands the children. He denies that the children are there. She seizes his
    head, growls, and complains about her teeth. Ddi-^erreten leaves, while the Lioness
    remains angry because he has taken away children who had lived peacefully with
    her and whom she loved.
  language: English translation with original-language transcription
