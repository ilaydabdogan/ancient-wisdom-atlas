canonical_text:
  quote: ''
  summary: The translated passage describes Ixue seeing Ovaherero, crying out, shedding
    eye water, being heard and searched for but not found, and flying away. He flies
    to his mother's country, sees his father, dies, is found dead, then rises after
    the father goes away and calls to him. In a later scene the father approaches
    stealthily; Ixue hears and sees him, dies, becomes a lizard on the ground, and
    is recognized by the father as his child. The father also says Ixue had been rubbing
    sticks to make fire before seeing him and dying. Notes identify Ixue as many,
    then one, \nu-erre and mention a small female-antelope-skin bag.
  language: English translation with transcribed !Kun text in the appendix portion
  quote_policy: summarized
