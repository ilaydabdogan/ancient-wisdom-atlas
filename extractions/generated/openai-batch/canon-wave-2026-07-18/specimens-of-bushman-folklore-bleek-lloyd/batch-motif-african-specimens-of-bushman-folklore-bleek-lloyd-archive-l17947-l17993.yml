canonical_text:
  quote: ''
  summary: A man says he has seen Sirius. Another man asks him to burn a stick toward
    Sirius so that the sun may come out shining and Sirius may not come out coldly.
    The man asks his son for wood, heats it in the fire, points it toward Sirius,
    calls Sirius grandmother, asks that she ascend the sky and twinkle like Canopus,
    sings about both stars, throws fire toward them, and then lies down covered in
    his kaross. He later sits up, feeling that he has worked by putting Sirius into
    the sun's warmth. Women go out early to seek Bushman rice while exposing a shoulder
    blade to the sun. A note states that Canopus and Sirius are both female stars.
  language: English
  quote_policy: summarized
