canonical_text:
  quote: ''
  summary: The passage contains an opening fragment about a pouch carried off at night
    and unsuccessfully sought; a short song or lament called “The Broken String,”
    in which the speaker says people broke a string for him and the place no longer
    feels as it did; an editor's note explaining that the broken string refers to
    the loss of a former ringing sound in the sky heard during a magician's lifetime;
    and “The Song of iNulnumma-lkwiten,” a predatory being said to kill crying children,
    whose song was repeated by a grandfather to quiet noisy children. Notes also give
    explanations of the name in relation to white eggs, a white mouth, and an egg-swallowing
    figure from another legend.
  language: English with Xam names and terms
  quote_policy: summarized
