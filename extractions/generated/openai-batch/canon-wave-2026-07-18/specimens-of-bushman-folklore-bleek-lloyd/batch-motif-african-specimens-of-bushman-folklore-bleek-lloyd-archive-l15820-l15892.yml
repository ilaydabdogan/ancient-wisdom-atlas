  quote: ''
  summary: The first-person group speaks with the Magistrate, is taken to jail at
    night, and repeatedly has its legs placed in stocks. They sleep, eat, sit, lie
    down, and smoke while confined. The Magistrate removes their legs from the stocks
    so they may sit comfortably and eat his sheep; named men eat with them. The group
    is later put back in the stocks, and other Korannas enter another jail house.
