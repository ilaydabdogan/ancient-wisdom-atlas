canonical_text:
  quote: ''
  summary: In the closing portion of “Young Man Carried Off by Lion,” the people say
    a lion has refused children previously given to it and demands the young man it
    had carried off. Under communal pressure, the young man’s mother permits them
    to give her child to the lion, while asking that they not let the lion eat him
    and that they kill the lion so it dies upon him. The people unwrap the young man
    from hartebeest-skins, give him to the lion, and shoot and stab the lion while
    it bites him to death. The lion says it will die now because it has obtained the
    man it sought; the lion and the man lie dead together. The excerpt then begins
    a new item titled “A Woman of the Early Race and the Rain Bull,” followed by a
    dictation note and untranslated |Xam transcription.
  language: English; includes |Xam transcription in the following item
