  summary: The passage contains several star-song entries. One song is described as
    sung by the star |gaunu and especially by Bushman women, and it asks which flower
    opens, answering that the |jcu-yam opens. A later entry says the narrator's step-grandmother
    Ttuai-aii used to rejoice about Canopus and gives a song in which Sirius and Canopus
    each wink like the other. A following entry gives the Song of the Kwa-kwara, related
    by Ihan+kass'o, with a note identifying Kwa-kwara as a bird.
