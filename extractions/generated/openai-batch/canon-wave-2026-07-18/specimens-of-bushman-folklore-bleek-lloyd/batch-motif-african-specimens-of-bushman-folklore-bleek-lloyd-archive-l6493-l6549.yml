canonical_text:
  quote: ''
  summary: A child mocks animals until recognizing its mother. Jackal and Hyena, insulted,
    revenge themselves by bewitching the mother, Lynx, with poisoned “Bushman rice,”
    transforming her into a lioness. Hyena attempts to take Lynx’s place in the hut
    when Dawn’s-Heart returns, but the deception is revealed. Dawn’s-Heart tries to
    stab Hyena; she flees and burns her foot in the fire. The bewitched wife is enticed
    from the reeds by her younger sister, caught by her brothers, and restored when
    the lion skin is pulled off. Because of the bewitchment, she can no longer eat
    Bushman rice and becomes a lynx who eats meat.
  language: English
  quote_policy: summarized
