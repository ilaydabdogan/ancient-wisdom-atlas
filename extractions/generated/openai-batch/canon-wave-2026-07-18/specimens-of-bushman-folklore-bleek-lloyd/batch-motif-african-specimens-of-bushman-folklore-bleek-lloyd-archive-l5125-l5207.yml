canonical_text:
  quote: ''
  summary: In this Moon and Hare version of the origin of death, the narrator says
    people should have resembled the Moon and should not have died altogether. The
    hare's story, actions, and contradiction of the Moon are named as the cause of
    the Moon's curse on people, who now die altogether and go away. The Moon also
    curses the hare to lie in bare places, without bush or tree shelter, where vermin
    bite him; this explains why the hare springs up and shakes his head to dislodge
    vermin. An editorial note identifies the passage as one among different versions
    of the Moon and Hare story called "The Origin of Death."
  language: English, with a subsequent untranslated transcribed Kathop-dialect excerpt
