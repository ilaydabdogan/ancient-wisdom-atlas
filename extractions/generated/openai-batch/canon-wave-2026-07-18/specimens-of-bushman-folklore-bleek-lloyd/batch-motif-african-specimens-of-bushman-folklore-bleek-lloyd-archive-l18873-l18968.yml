canonical_text:
  quote: ''
  summary: The English portion describes people beating the named \gbih\gbih so that
    bees may go to other people's places and people may obtain honey. Honey is carried
    home to hungry women. Once the women are fed, they make or play a drum, and the
    men dance while women clap; one woman beats the drum. A footnote adds that women
    may arrange the game of \goo so that the men may roar. The sun rises while the
    dance continues and the people are satisfied with food. The supplied passage then
    continues in Xam/Bushman-language transcription, which is not interpreted here.
  language: English with Xam/Bushman-language terms and transcription
  quote_policy: summarized
