canonical_text:
  quote: ''
  summary: A young man of the ancient race is hunting, ascends a hill, becomes unusually
    sleepy, and lies down. A thirsty lion, going to a water pit in the heat of the
    day, sees him asleep and takes him up. The man wakes and decides not to move because
    he thinks the lion will bite him to death if he stirs. The lion appears to think
    he is dead, carries him to a large zwart-storm tree, and places him partly into
    the tree at the bottom.
