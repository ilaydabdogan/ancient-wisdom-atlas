canonical_text:
  quote: ''
  summary: The branch opens under the authority of the Holy Graal and Joseph. Perceval,
    also called Parluifet by his uncle King Pelles, recovers in the hermitage, feels
    renewed desire for knighthood, arms himself, and rides into the forest seeking
    adventure. In a broad clearing beneath a leafy tree he hears a horse neigh three
    times and prays that a strong knight may come without either combatant being slain.
    An armed knight with a white shield bearing a gold cross enters. Perceval challenges
    him, and the two engage in a severe mounted and then sword combat, wounding one
    another while the other knight repeatedly asks who Perceval is and why he attacks.
  language: English
  quote_policy: summarized
