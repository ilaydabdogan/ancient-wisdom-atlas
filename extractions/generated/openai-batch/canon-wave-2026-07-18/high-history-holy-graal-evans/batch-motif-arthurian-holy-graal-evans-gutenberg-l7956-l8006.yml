canonical_text:
  quote: ''
  summary: Messire Gawain tells a damsel that only the knight of the white shield
    should perform the vengeance she seeks. The damsel says that this knight, later
    named Perceval, has gone into the forest and is difficult to find. She recounts
    that the Graal appeared to him at King Fisherman's house because of his virtues,
    but that he failed to ask a required question, causing harm to the land. She and
    Gawain both seek him, though his frequent changes of shield and arms obscure his
    identity. Gawain prays that the Saviour will lead him to Perceval openly.
  language: English
  quote_policy: summarized
