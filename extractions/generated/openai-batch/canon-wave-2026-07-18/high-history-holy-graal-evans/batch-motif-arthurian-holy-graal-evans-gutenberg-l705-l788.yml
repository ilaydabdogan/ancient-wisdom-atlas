canonical_text:
  quote: ''
  summary: A messenger accuses a squire of stealing a gold candlestick from a chapel
    where it honored a dead knight. The squire refuses to return it and intends to
    give it to King Arthur. In a dream-like encounter he is stabbed, then wakes at
    Cardoil with the knife actually in his side and the candlestick in his possession.
    He confesses before the knife is removed and dies. Arthur arranges burial and
    gives the candlestick to St Paul in London for memorial prayer. Arthur then prepares
    to go alone to the chapel of S. Augustine, saying that God will allow no companion,
    and departs armed while the Queen and knights watch.
  language: English
  quote_policy: summarized
