canonical_text:
  quote: ''
  summary: King Claudas advances against Arthur's lands while Arthur is weakened by
    the absence of many renowned knights. At Cardoil, Lucan the Butler tells Arthur
    that imprisoning Lancelot has driven loyal knights away and advises Lancelot's
    release. Arthur brings Lancelot into the hall, repents, and offers amends. Lancelot
    denies any treason, refuses to hate Arthur, and vows continued aid. The court
    rejoices at Lancelot's release, while Briant of the Isles declares enmity toward
    him.
  language: English
  quote_policy: summarized
