  quote: "“it raineth upon me on this side the river, but on the other raineth it
    not at all”"
  summary: Messire Gawain leaves a hall with his horse and arms ready, rides beside
    a river through a storming forest, and sees across the river a knight and damsel
    riding joyfully in clear weather. He asks a squire why rain falls on his side
    but not the other; the squire says he has deserved it and that it is the forest’s
    custom. The squire says the tempest will cease at the first bridge Gawain reaches.
