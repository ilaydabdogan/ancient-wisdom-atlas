canonical_text:
  quote: ''
  summary: King Arthur is distressed by Madeglant, King of Oriande, and asks the returning
    Lancelot to defend his land. Lancelot accepts, leads forty knights to Madeglant's
    island, destroys the enemy's means of retreat, kills Madeglant, frees the islands,
    conquers Albanie, destroys idols, institutes Christian images, and then refuses
    an offered kingship except by Arthur's will.
  language: English
  quote_policy: summarized
