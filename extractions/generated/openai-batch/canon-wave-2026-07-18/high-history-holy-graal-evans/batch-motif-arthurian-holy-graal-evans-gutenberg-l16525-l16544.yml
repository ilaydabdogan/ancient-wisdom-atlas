canonical_text:
  quote: ''
  summary: Perceval honors the coffin of his father and other family coffins, stays
    with hermits, hears mass, then departs by ship toward Great Britain. He lands
    near the Red Tower, arms himself, rides through a depopulated land that he has
    unknowingly helped empty, and reaches a forest hold where he sees an injured or
    reclining knight tended by a beautiful damsel.
  language: English
  quote_policy: summarized
