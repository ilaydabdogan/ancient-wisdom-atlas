canonical_text:
  quote: ''
  summary: Lancelot defeats and beheads the lord associated with Rock Gladoens on
    behalf of the Knight of the Green Shield, who regains land and obedience. Lancelot
    then rides through the forest, is warned by a wounded knight about the Castle
    of Beards, and reaches a gate where beards and knights' heads are displayed. Gate
    knights demand his beard as toll, saying hermits use such beards for hair-shirts.
    Lancelot refuses, kills or wounds the gate knights, and is approached by the Lady
    of the Castle and her damsels.
  language: English
  quote_policy: summarized
