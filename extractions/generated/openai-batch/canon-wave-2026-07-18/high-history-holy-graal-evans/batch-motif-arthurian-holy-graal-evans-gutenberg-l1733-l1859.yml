canonical_text:
  quote: ''
  summary: An unnamed knight challenges Messire Gawain to joust for a precious shield
    formerly belonging to Judas Machabee. Gawain defeats him, is recognized as King
    Arthur's nephew, and receives the shield. A damsel warns Gawain not to give his
    own shield to the knight because shields carried into the castle mark defeated
    prisoners. The conquered knight explains that Gawain has ended a burdensome castle
    custom of challenging passing knights. Gawain gives his battered shield to the
    Damsel of the Car, the defeated knight returns to the castle and is imprisoned,
    and Gawain receives directions by a great cross at the forest entrance.
  language: English
  quote_policy: summarized
