canonical_text:
  quote: ''
  summary: Perceval rescues a damsel from a tree, captures King Gohaz, frees Galobruns
    from imprisonment on a rock, and allows Galobruns to put Gohaz into the same bonds.
    Perceval then restores land to Galobruns and his sisters, travels by sea past
    a perpetually burning castle explained by a hermit as the result of Joseus killing
    his mother, hears a prophecy of world-ending fire, and later visits an island
    of twelve hermits guarding the tombs of twelve dead knight-brothers, including
    Alain li Gros, Lord of Camelot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gohaz tells Perceval that he is king of the land, and Perceval answers that
    this is the reason for his action.
  category: speech
