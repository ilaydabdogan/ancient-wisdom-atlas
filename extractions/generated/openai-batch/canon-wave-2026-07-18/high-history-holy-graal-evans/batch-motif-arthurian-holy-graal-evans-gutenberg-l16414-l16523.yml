  - ev:1
- id: obs:2
  text: The damsel asks Perceval not to leave her and asks to be helped to the house
    of her father, the Sick Knight.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Perceval brings the damsel down from the tree, puts her into the ship, and
    returns toward the rock where his cousin is held.
  category: action
  evidence_refs:
  - ev:2
