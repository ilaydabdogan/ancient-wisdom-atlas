  text: Perceval tells Gohaz that he will put him where Gohaz had imprisoned the son
    of Perceval's uncle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Perceval brings Gohaz up to the rock and frees Galobruns from the irons in
    which he was imprisoned.
  category: action
