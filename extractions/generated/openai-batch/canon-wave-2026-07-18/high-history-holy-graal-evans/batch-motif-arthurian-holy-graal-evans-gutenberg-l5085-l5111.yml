canonical_text:
  quote: ''
  summary: Lancelot denies having shamed the Lady and criticizes knights who tried
    to take strangers' beards by force. The Lady offers to abandon her ill-will if
    he lodges in her castle for the night, and he agrees. Inside, a dead knight is
    buried in the chapel, another knight is tended, and Lancelot is disarmed, richly
    clothed, and recognized by the Lady. At the meal, successive courses are brought
    by chained and mutilated knights, and the fifth course by fair tall knights holding
    naked swords and presenting their heads to the Lady.
  language: English
  quote_policy: summarized
