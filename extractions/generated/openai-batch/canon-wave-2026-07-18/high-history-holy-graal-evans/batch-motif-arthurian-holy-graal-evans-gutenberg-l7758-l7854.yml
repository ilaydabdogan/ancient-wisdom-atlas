canonical_text:
  quote: ''
  summary: Messire Gawain hears that the Vavasour has been causing knights to fight
    so that he can seize their arms and horses. An unnamed knight, later identified
    through the hermit’s explanation as Perceval, refuses to disclose his name and
    enters the Lonely Forest. Gawain lodges with a hermit, who reveals that the knight
    with the gold shield and green cross was Perceval, explains the shield exchange
    and the brachet, and praises Perceval’s chastity, truthfulness, restraint, and
    knightly virtue. Gawain laments that he has twice found and lost the knight whom
    King Arthur sent him to seek.
  language: English
  quote_policy: summarized
