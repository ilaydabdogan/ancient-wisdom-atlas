canonical_text:
  quote: ''
  summary: King Arthur and Messire Gawain leave a tent and ride toward the land they
    seek, hoping for Lancelot’s arrival. They come at night to the Waste Manor, a
    place associated with an earlier slain knight found by Gawain. The Lady of the
    Waste Manor summons knights against Arthur and Gawain, but will not allow them
    to be harmed inside her hold; instead, she posts seven bold knights at the bridge
    entrance to prevent their departure except through armed resistance.
  language: English
