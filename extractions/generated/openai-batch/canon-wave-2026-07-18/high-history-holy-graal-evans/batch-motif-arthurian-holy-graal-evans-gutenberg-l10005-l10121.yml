canonical_text:
  quote: ''
  summary: Perceval is at the Turning Castle, an aerial castle founded by Virgil and
    bound by prophecy to stop turning when a certain Christian knight bearing the
    shield of the Good Soldier arrives. The castle people rejoice and turn to the
    new faith. A damsel tells Perceval that the Knight of the Dragon must be killed
    before the people can leave and leads him to the Island of Elephants. There the
    Queen of the Golden Circlet laments knights slain by the dragon knight and promises
    conversion and the circlet if Perceval defeats him. Perceval confronts the huge
    Knight of the Dragon, whose black shield bears a fire-breathing dragon head. In
    combat the dragon flame burns Perceval’s spear, but his shield, containing relics
    of Christ, resists the enemy’s sword and turns back the dragon fire. The dragon
    knight then burns the body of a dead knight and the horses to ashes, and Perceval
    vows to amend the wrong if God allows.
  language: English
  quote_policy: summarized
