candidate_motifs:
- id: motif:1
  label: Prophesied liberator ends an enchanted castle’s condition
  taxonomy_refs:
  - mystical_quest
  basis: The Turning Castle is bound by prophecy to keep turning until the appointed
    knight arrives with specified qualities and the Good Soldier’s shield, after which
    the people’s death is respited and they turn to the new law.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage strongly identifies the pattern within this episode, but broader
    Grail-cycle significance is not inferred beyond the given text.
- id: motif:2
  label: Christian champion against a dragon-associated desolating foe
  taxonomy_refs:
  - serpent
  basis: Perceval is a Christian knight sent against the Knight of the Dragon, who
    prevents release from the castle, slays people, desolates lands, and bears a fire-breathing
    dragon head on his shield.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage presents a dragon image on a shield rather than a fully separate
    living dragon creature.
- id: motif:3
  label: Holy relic shield repels hostile fire
  taxonomy_refs: []
  basis: Perceval’s shield, containing Our Lord’s blood and a piece of His garment
    according to Josephus, resists the enemy’s sword and causes dragon flame to turn
    back without nearing him.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The text links relics and protection narratively, but does not explicitly
    explain the mechanism in doctrinal terms.
- id: motif:4
  label: Victory as proof leading to conversion
  taxonomy_refs:
  - divine_judgment
  basis: The queen says that if Perceval conquers the Knight of the Dragon, she will
    accept the New Law and regard Perceval’s law as more effective than hers.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is a conditional statement before the outcome; the passage segment
    does not include the victory itself.
- id: motif:5
  label: Marvelous construction by ancient wisdom
  taxonomy_refs:
  - wisdom
  basis: Virgil is said to have founded the Turning Castle in the air by his wisdom
    during the philosophers’ Quest of the Earthly Paradise.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: Only the origin notice is given here; no extended account of Virgil’s
    wisdom or construction method is supplied.
- id: motif:6
  label: Vengeance for slain kin within a quest combat
  taxonomy_refs: []
  basis: The damsel identifies the place where Perceval’s uncle’s son was slain and
    hands the dead man over to Perceval, telling him to avenge him as best he may.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The extracted passage includes the charge to avenge and the enemy’s insult
    to the corpse, but not the completion of vengeance.
