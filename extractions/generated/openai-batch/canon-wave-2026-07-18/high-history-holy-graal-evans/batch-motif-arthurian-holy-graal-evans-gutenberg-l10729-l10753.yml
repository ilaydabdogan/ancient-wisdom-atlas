canonical_text:
  quote: Perceval looketh at the lion to know what he shall do
  summary: Sacred powers and holy figures overwhelm hostile knights, but their treachery
    remains. They pretend submission and ask mercy while intending later to kill Perceval.
    Perceval looks to the lion for guidance, refuses mercy, attacks, and the lion
    slays the knights and casts their bodies into the water. Perceval approves the
    lion and esteems it highly.
  language: English
