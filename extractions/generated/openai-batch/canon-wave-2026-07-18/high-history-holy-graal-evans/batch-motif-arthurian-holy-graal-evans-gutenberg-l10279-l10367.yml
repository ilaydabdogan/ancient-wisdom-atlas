canonical_text:
  quote: ''
  summary: An evil spirit leaves a copper bull, after which thirteen survivors are
    baptized and later live penitently under the New Law. Perceval visits King Hermit
    and recounts a vision of a little white beast with twelve hounds inside her; the
    hounds kill her beside a cross, while a knight and damsel place her flesh and
    blood in golden vessels. King Hermit interprets the beast as Jesus Christ, the
    hounds as the people of the Old Law or Jews, and the golden vessels as signifying
    the divinity of the Father; he also recounts a manna-in-the-wilderness episode
    ending in divine punishment when stored manna becomes reptiles and vermin.
  language: English
  quote_policy: summarized
