canonical_text:
  quote: ''
  summary: The narrative turns from Arthur and Gawain to Meliant, son of the slain
    knight of the Waste Manor, who seeks knighthood from Briant of the Isles in order
    to avenge his father against Lancelot. Lancelot, grieving for Queen Guenievre,
    rides through a forest, meets a knight and damsel, and is directed toward a castle.
    The damsel recognizes Lancelot and secretly vows vengeance for a forced marriage
    he arranged. Lancelot reaches the Castle of the Griffon, where severed knights'
    heads hang at the gate. A knight explains that guests must attempt to draw a sword
    fixed in a column to win the lord's daughter, and failed challengers are beheaded;
    the castle also has an underground cavern with a lion and griffon said to have
    devoured many knights. Lancelot enters the hall, where the lord insists on the
    castle custom that armed knights disarm before eating.
  language: English
  quote_policy: summarized
