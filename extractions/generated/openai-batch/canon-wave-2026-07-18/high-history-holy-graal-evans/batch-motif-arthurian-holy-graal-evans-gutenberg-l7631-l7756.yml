canonical_text:
  quote: ''
  summary: Messire Gawain seeks news of Perceval, identified by a banded shield with
    a red cross, and is told he may find him at the Red Launde assembly. On the way,
    Gawain meets a damsel escorting a dead knight to the assembly so that the best
    knight may avenge him. Gawain lodges with an old Vavasour, who closes him in and
    asks him to fight a knight with a golden shield and green cross. When Gawain rides
    out, the castle is closed behind him. A second damsel arrives and accuses the
    Vavasour of deceiving her brother into attacking an unhostile passing knight;
    both combatants died in the encounter.
  language: English
  quote_policy: summarized
