canonical_text:
  quote: ''
  summary: Perceval promises to aid his sister but lets her continue alone because
    the grave-yard custom allows only one person to enter and because she must keep
    her vow. She travels at night through the forest to a grave-yard entrance marked
    by a cross, prays there, enters the burial ground, and sees many tombs. The grave-yard
    is described as blessed by Saint Andrew so that evil spirits cannot enter, though
    frightening apparitions in the shapes of dead knights appear around it. She sees
    black knights with spears and fire-red swords fighting outside the grave-yard,
    crosses herself, and goes to an ancient chapel. Inside, before an image of Our
    Lady, she prays for preservation and sees the holy cloth she came to take above
    the altar. When she approaches, the cloth rises out of reach above a crucifix,
    and she says this is because of her sin and disloyalty.
  language: English
  quote_policy: summarized
