canonical_text:
  quote: ''
  summary: Perceval, borne by a ship after battle and guided by God, reaches an island
    castle. White-clad bell-ringers and two venerable men appear; the men venerate
    the shield he carries, identifying its former bearer as Joseph of Arimathea and
    explaining the cross placed on it after Christ's crucifixion. Perceval sees a
    rich fountain beneath a tree, a large ivory-like vessel containing a silent armed
    knight, and a royal hall filled with holy imagery and white-clad men marked with
    red crosses. During a ritual meal, a gold chain with a jeweled crown descends
    by divine will into an opened pit from which dolorous cries issue, then rises
    again before the pit is covered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Perceval has slain everyone in the ship except the pilot, whom he has spared
    under a covenant that the pilot will believe in God and renounce his former law.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ship travels far from land by night and day, with God described as guiding
    Perceval, until a castle and an island of the sea come into view.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the castle town, four people in white garments sound bells at the four
    corners.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the ship reaches haven below the castle, the sea withdraws, leaving the
    ship on dry land; Perceval, his horse, and the pilot leave the ship.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near the castle, Perceval sees a tall broad tree and a very clear fountain
    surrounded by rich pillars, with gravel that seems to be gold and precious stones.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two men with white hair and beards but young-looking faces meet Perceval,
    bow before the shield he bears, kiss its cross and the boss containing hallows,
    and say they knew the knight who bore it before him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two men identify the earlier shield-bearer as Joseph of Arimathea and
    say the cross was added to the shield after Jesus Christ's crucifixion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: One of the worshipful men sets on the shield a blooming posy of herbs and
    flowers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Perceval sees a round ivory-like vessel large enough to contain an armed knight;
    the knight does not answer when Perceval speaks, and the hosts say Perceval may
    not yet know who he is.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hall is called the royal hall; it is richly furnished and contains an
    image of the Saviour of the World in majesty with apostles, as well as galleries
    full of holy people.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Thirty-three men in white garments, each with a red cross on his breast, enter
    together, worship God, set out cups, wash at a golden laver, and sit at tables;
    Perceval is seated at the master-table with the Masters.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the meal, a gold chain with precious stones and a gold crown descends
    from above, held only by the will of Our Lord; a pit is opened in the hall, dolorous
    cries and voices issue from it, the men weep, and the chain descends into the
    pit before rising aloft again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the meal, the Good Men rise, give thanks to Our Lord, and return whence
    they came.
  category: sequence
  evidence_refs:
  - ev:9
