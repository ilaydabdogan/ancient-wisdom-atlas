canonical_text:
  quote: ''
  summary: Lancelot rejects friendship with Briant after Briant declares enmity. Briant
    appeals to the King for protection, says he will not stay at court while Lancelot
    is there, and refuses the King's proposed amends until he has drawn from Lancelot
    as much blood as Lancelot drew from him. Briant leaves angrily, travels toward
    the Castle of the Hard Rock, threatens action that may cost the King land, then
    seeks aid from King Claudas, who swears and pledges support, with Briant pledging
    in return.
