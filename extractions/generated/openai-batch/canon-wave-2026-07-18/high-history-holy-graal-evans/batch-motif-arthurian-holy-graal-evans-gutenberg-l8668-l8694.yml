canonical_text:
  quote: ''
  summary: After a parting, Gawain and Lancelot return toward King Arthur's court
    while Perceval travels through strange forests into a deserted waste land. He
    finds a hermitage in a mountain combe, where a hermit and clerk perform a service
    for the dead before a pall near the altar. Perceval listens reverently from outside
    rather than entering armed. The hermit tells him the service is for Lohot, King
    Arthur's son, who is buried under the pall, and says he will explain who slew
    him.
  language: English
