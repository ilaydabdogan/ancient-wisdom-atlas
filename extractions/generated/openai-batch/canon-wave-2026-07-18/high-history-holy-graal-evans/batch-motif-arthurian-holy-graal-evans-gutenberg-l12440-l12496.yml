canonical_text:
  quote: ''
  summary: Gawain acknowledges a hermit as faithful to a covenant. During a meal with
    Arthur, Perceval, Gawain, and older knights, a wounded Damsel of the Car arrives
    and reports that Aristor of Moraine is attacking Perceval's mother, has abducted
    Perceval's sister, intends forced marriage and land seizure, and follows a custom
    of killing each wife after marriage. Perceval is grieved; Arthur offers aid, but
    Perceval asks Arthur to guard the Widow Lady's Camelot. The narrator distinguishes
    this coastal Welsh Camelot from King Arthur's Camelot in Logres.
  language: English
  quote_policy: summarized
