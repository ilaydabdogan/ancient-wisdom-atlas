canonical_text:
  quote: ''
  summary: The narrative returns to Perceval, who has learned that Aristor carried
    off his sister and intends forced marriage and New Year beheading. Perceval rides
    to his uncle's hermitage, learns that King Pelles/King Hermit has been slain by
    Aristor after mass, and attends the burial. A damsel then presents a knight's
    severed head in an ivory casket and asks Perceval to avenge him. She identifies
    the slain knight as son of Bruns Brandalis and says he was killed treacherously
    by the Knight of the Deep Forest, also called the Red Knight, who leads a lion.
    The damsel says the Deep Forest lies toward Aristor's castle.
  language: English
  quote_policy: summarized
