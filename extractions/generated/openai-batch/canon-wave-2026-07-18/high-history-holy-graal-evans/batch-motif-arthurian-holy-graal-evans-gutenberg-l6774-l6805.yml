canonical_text:
  quote: ''
  summary: Lancelot says an unnamed man is hard to find because he changes his cognizance
    and hides his name. King Fisherman honors Lancelot and a rich feast is served,
    but the Graal does not appear; the narrator attributes this absence to Lancelot's
    unrepented sin concerning the Queen. After being attended by two damsels, Lancelot
    rises, hears mass, leaves the castle between two lions, prays to see the Queen,
    rides into the forest, desires news of Perceval, and sees an approaching knight
    with a richly dressed damsel.
