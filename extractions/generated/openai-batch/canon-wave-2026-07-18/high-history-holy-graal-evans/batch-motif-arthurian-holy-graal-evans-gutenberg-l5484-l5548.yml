canonical_text:
  quote: ''
  summary: King Hermit rides from his hermitage on a white mule marked with a red
    cross to seek his nephew. He finds two knights fighting, intervenes, learns that
    the Knight of the White Shield is the son of King Ban, identifies him as Perceval’s
    cousin, and reconciles the combatants. The knights are taken to the hermitage,
    disarmed, and treated by a skilled damsel; Lancelot is more seriously wounded
    than Perceval. The narration adds that Perceval’s usual shield, green with a white
    hart, would have let Lancelot recognize him and avoid the quarrel.
  language: English
  quote_policy: summarized
