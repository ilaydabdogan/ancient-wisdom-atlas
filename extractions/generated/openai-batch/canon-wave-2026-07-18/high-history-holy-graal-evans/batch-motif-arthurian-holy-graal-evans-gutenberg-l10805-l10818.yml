canonical_text:
  quote: ''
  summary: Perceval is in company with good men. Josephus reports that King Fisherman’s
    former household, including ancient knights, priests, and damsels, left when a
    self-slaying king seized the castle because they would not remain at his court.
    God preserved them in safety. After the Good Knight won the castle by valour and
    right, the Saviour sent back those who had served King Fisherman. Perceval and
    the returned people rejoice, and the passage characterizes them as coming from
    a place where God and His commandments were honored.
  language: English
