canonical_text:
  quote: '"None shall I never marry, save God alone."'
  summary: Perceval restores a dispossessed damsel to her forest castle, then brings
    Aristor's severed head to his sister as proof that her forced wedding has failed.
    The sister rejoices, Aristor's head is cast into a river, and Perceval escorts
    her to Camelot, where their grieving mother rejoices. Perceval speaks of his mother
    ending her life at King Fisherman's castle, where the Holy Graal and sacred hallows
    are, and his sister declares that she will marry only God.
  language: English
  quote_policy: quoted
