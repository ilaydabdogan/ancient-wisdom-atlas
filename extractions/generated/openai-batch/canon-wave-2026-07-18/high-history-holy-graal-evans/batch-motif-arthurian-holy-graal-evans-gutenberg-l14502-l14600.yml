canonical_text:
  quote: ''
  summary: At Arthur's court, reports arrive that Lancelot has conquered Oriande and
    other lands. Briant of the Isles privately tells Arthur that Oriande, Albanie,
    and other islands have sworn together to make Lancelot king and attack Arthur.
    Arthur first doubts Lancelot's disloyalty, but trusts Briant and summons Lancelot
    by sealed letters. Lancelot returns from Oriande, reports his reconquests, and
    is then confronted in Arthur's hall after Arthur has placed armed knights under
    cloaks to arrest him. Lancelot says he armed himself to protect Arthur, but Arthur
    accuses him of intending murder and orders him seized.
  language: English
  quote_policy: summarized
