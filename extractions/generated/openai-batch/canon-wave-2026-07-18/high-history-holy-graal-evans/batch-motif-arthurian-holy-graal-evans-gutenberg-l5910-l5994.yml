canonical_text:
  quote: ''
  summary: Perceval leaves the castle he has reconquered for his mother and rides
    to a camp of tents where damsels are mourning. An accusing damsel identifies him
    as the killer of important kin, but the Damsel of the Car recognizes him by his
    shield and welcomes him. She presents him to the Queen of the Tents as the Good
    Knight. The Queen mourns Chaos the Red as her slain protector, then becomes strongly
    enamored of Perceval and offers pardon for Chaos's death if he grants her love.
    Perceval answers in terms of knightly protection rather than inward love, while
    the Queen continues to desire him and the damsels marvel that she has forgotten
    her mourning.
  language: English
  quote_policy: summarized
