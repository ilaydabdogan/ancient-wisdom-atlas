canonical_text:
  quote: '"Ite, missa est"'
  summary: After mass, an angelic voice gives the dismissal. The Son leads the Mother
    from the chapel with a fair company, and the flame that had come through the window
    departs with them. The hermit finishes his service, tells King Arthur that he
    was barred from entering during mass because of his sins, permits him to enter
    afterward, and admonishes him to amend wrongs toward God and the saint worshipped
    in the chapel. He warns that Arthur and his court have declined from honor to
    shame.
  language: English
  quote_policy: quoted
