canonical_text:
  quote: ''
  summary: Messire Gawain rides in search of a knight and receives reports from a
    hermit, the Queen of the Maidens, and a fleeing knight about a dreaded sea-roving
    champion, identified by the Queen as Perceval, who has driven enemies from an
    island below her castle and now rows about the sea. Gawain continues along the
    seashore and forest, then sees an armed knight bearing a gold shield with a green
    cross.
  language: English
  quote_policy: summarized
