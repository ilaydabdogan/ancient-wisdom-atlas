canonical_text:
  quote: ''
  summary: A beautiful but treacherous damsel from a robber lineage directs Lancelot
    to a forest hold for lodging. A dwarf is present there while five robber knights,
    Lancelot's mortal enemies, are elsewhere in the forest. The damsel urges Lancelot
    to disarm, but he refuses because the place seems dark and foul. Lancelot eats,
    keeps his arms near him, and falls asleep. The damsel steals his sword and searches
    for a way to kill him under his armor. While asleep, Lancelot dreams that a small
    cur-dog, large ban-dogs, and a greyhound bitch with woman's hands attack him and
    hold his sword; in the dream he takes the sword and kills several attackers. The
    dwarf steals Lancelot's horse, brings it as a token to the robber knights, and
    leads them armed to the hold. Lancelot wakes frightened from the dream and sees
    the armed men enter as the damsel urges them to act.
  language: English
  quote_policy: summarized
