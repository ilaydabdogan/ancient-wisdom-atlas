canonical_text:
  quote: ''
  summary: Perceval meets two squires in the forest and learns that Aristor of Ariste
    has abducted the daughter of the Widow Lady, intends to marry her, and customarily
    beheads such a bride on New Year's Day. The squires also report that Aristor is
    fighting the Knight Hardy, a member of Perceval's fellowship. Perceval rides to
    the combat, wounds and then kills Aristor, beheading him. He then brings the mortally
    wounded Knight Hardy to a nearby hermitage for confession; after the knight dies,
    Perceval arranges shrouding, gives arms and horses to the hermit for the knight's
    soul, hears mass sung, buries the body, and departs.
  language: English
  quote_policy: summarized
