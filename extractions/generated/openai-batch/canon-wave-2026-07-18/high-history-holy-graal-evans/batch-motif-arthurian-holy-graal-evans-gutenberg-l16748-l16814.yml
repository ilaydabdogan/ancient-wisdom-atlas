canonical_text:
  quote: ''
  summary: Perceval encounters a damsel carrying a golden cup and learns it is the
    prize for an assembly of knights under the White Tower. He enters the combat,
    is judged the best by right of arms, and receives the cup. The damsel explains
    that the cup came through the Elder Damsel of the Tent to Gawain, who asks that
    whoever accepts it avenge Meliot of Logres, slain treacherously by Brundans. Perceval
    accepts the charge and sends the cup by the damsel's companion knight to the wife
    of the Sick Knight.
  language: English
  quote_policy: summarized
