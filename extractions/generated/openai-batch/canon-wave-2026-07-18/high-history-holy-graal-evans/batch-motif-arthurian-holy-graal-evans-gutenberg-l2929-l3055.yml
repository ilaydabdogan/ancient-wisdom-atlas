canonical_text:
  quote: ''
  summary: Gawain leaves a castle after hearing mass, is intercepted by armed knights
    sent to bring him to the Proud Maiden of Castle Orguelleux, refuses, and wounds
    his would-be captors. The Proud Maiden orders pursuit but then recognizes that
    she has lost him through her pride and failure to learn his identity. Gawain continues
    praying for guidance toward the hostel of King Fisherman. A brachet follows a
    blood trail and leads him to a decayed manor in a marsh, where a damsel mourns
    a dead knight and says the dog was meant to fetch the slayer. She names Lancelot
    of the Lake as the killer and calls for vengeance on him and Arthur's court. Gawain
    leaves and prays to find Lancelot.
  language: English
  quote_policy: summarized
