canonical_text:
  quote: ''
  summary: Perceval finds Galobruns imprisoned at sea and learns that only the imprisoning
    king has the key. Perceval recognizes Galobruns as his kinsman and promises deliverance.
    He then reaches an island where King Gohaz and an abducted damsel have climbed
    a tree to escape a fire-breathing serpent from a mountain hole. The damsel identifies
    Gohaz as her abductor and as the holder of stolen lands. Perceval kills the serpent,
    recovers from its throat the red-hot key to Galobruns's chain, and carries Gohaz
    to his ship.
  language: English
  quote_policy: summarized
