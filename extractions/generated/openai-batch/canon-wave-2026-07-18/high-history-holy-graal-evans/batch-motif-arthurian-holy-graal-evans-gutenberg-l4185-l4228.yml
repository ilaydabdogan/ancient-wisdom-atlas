canonical_text:
  quote: ''
  summary: 'Messire Gawain asks a priest about several strange encounters: an inverted
    cowardly knight who rights himself, a black-and-white knight whom Gawain defeats
    and receives as a vassal, a young child riding a fierce lion, and a forest fountain
    with a hiding image, golden vessels, a clerk, and three damsels who seem to become
    one. The priest gives Christian allegorical explanations for the first three and
    refuses to disclose the final mystery, saying the Saviour''s secrets must remain
    hidden.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gawain reports meeting a knight in the forest who rode with his orientation
    reversed, carried his arms upside down, called himself the Knight Coward, wore
    his habergeon on his neck, and then set his arms right when he saw Gawain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The priest says the wrongly turned knight corresponds to the law being turned
    worse before the crucifixion and restored to right after it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gawain reports that a black-and-white knight jousted with him, challenged
    him concerning a lady's death on behalf of her husband, and promised that defeat
    would make himself and his men Gawain's men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gawain says he defeated the black-and-white knight and received his homage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The priest says those remaining in the old law were made subject because the
    old law was destroyed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gawain reports seeing a child of no more than six years riding a fierce lion
    in a hermitage, where none except the child dared approach the lion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Gawain identifies the child as the son of the lady who was slain on his account.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The priest says the child signifies the Saviour of the world, born under the
    old law and circumcised, and that the lion signifies the world and its creatures,
    governable only by the Saviour's virtue.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Gawain reports finding a very fair fountain in a forest with an image inside
    it that hid itself when it saw him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Gawain reports that a clerk brought a golden vessel, removed another golden
    vessel hanging at a column, and set his own vessel in its place.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Gawain reports that three damsels filled the vessel with what they had brought,
    after which it seemed to him that only one damsel was present.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The priest refuses to explain the fountain episode further, saying the Saviour's
