canonical_text:
  quote: ''
  summary: Gawain rides from an evil forest into a fair forest and reaches a hermit's
    chapel beside a clear spring shaded by a broad tree. A damsel waits there with
    a mule bearing a knight's head, seeking news of the Chaste Knight. The hermit
    receives Gawain and the damsel, reveals that he was once a knight in Uther Pendragon's
    court, and says the Chaste Knight has twice stayed in the chapel within the year.
    The damsel speaks harshly of King Arthur and recounts rejecting the service of
    another knight named Arthur because of the king's name, while Gawain defends his
    uncle and says Arthur intends reform.
  language: English
  quote_policy: summarized
