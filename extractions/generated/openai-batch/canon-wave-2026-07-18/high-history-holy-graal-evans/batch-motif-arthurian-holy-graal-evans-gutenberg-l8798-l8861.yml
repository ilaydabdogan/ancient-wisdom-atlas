canonical_text:
  quote: ''
  summary: Perceval arrives and is recognized by a damsel through his knightly signs.
    She prays to the Mother of the Saviour, petitions Perceval for aid for herself
    and her mother, and recalls Arthur's court, a brachet, and the shield. Perceval
    says Arthur kept covenant by sending for him and grants aid. The narrator states
    that the damsel does not know Perceval is her brother, while he knows she is his
    sister but conceals it. She then explains that she must go alone by vow to the
    Grave-yard Perilous to obtain holy altar cloth from its chapel, because a holy
    hermit said the enemy knight can be overcome only by means of that cloth, which
    is associated with the Holy Sepulchre and Christ's return from death to life.
    She directs Perceval toward Camelot, where her mother, the Widow Lady, awaits
    succour from the Good Knight.
  language: English
  quote_policy: summarized
