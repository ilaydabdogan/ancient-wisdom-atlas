canonical_text:
  quote: ''
  summary: Gawain is lodged in a tent, attended by a dwarf, squires, and two damsels.
    The damsels say the tent has an evil custom that may be ended if he chooses one
    of them. Gawain declines to engage beyond thanks and sleep. The damsels doubt
    he is the true Gawain and order the dwarf to keep watch. At dawn Gawain arms himself,
    and two armed knights demand payment for the lodging while the damsels and dwarf
    again connect the situation with Gawain's identity and the evil custom.
  language: English
  quote_policy: summarized
