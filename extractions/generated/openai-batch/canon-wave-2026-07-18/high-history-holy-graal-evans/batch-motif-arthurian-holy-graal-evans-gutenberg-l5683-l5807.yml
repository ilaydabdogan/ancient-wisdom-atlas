canonical_text:
  quote: ''
  summary: Clamados, advised by the Damsel, fights a lion that attacks him, is wounded,
    kills and beheads it, and hangs the head at a hall door. A squire objects that
    the lion belonged to Meliot of Logres and guarded a forbidden land. Clamados and
    the damsels then pass onward to an empty castle region and a large encampment
    of women, where his wounds are tended. The Lady of the Tents identifies him as
    her close kin and offers him lordship, while the company awaits the healed Good
    Knight; Lancelot is still not whole in a hermitage.
  language: English
  quote_policy: summarized
