canonical_text:
  quote: ''
  summary: King Madeglant arrives by navy in Albanie, a distant part of Arthur's land,
    and the inhabitants ask Arthur for help. Arthur sends Lancelot with forty knights.
    Lancelot is welcomed as champion and protector, defeats Madeglant's force, and
    leaves the land safe. The people of Albanie wish for Lancelot or another appointed
    lord to protect them. At Cardoil, a messenger from King Claudas demands Lancelot's
    whereabouts and warns Arthur that Claudas regards Lancelot as a mortal enemy over
    the deaths of Meliant of the Waste Manor and Meliant's father. Arthur replies
    that he will not fail his knight if Lancelot is willing to answer the charge and
    defend himself.
  language: English
  quote_policy: summarized
