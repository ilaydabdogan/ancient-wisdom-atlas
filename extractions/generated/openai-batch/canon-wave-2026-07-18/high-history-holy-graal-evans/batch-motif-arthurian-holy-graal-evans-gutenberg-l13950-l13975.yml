canonical_text:
  quote: ''
  summary: Lancelot challenges a damsel for valuing her wish above his safety. She
    answers that she does not desire his death, since the knight for whose sake he
    undertakes the enterprise would not be made whole if Lancelot died. She urges
    haste, says a very fair damsel will help him, and warns that delay increases danger.
    After departing, she privately says she has reason to hate Lancelot because he
    took her friend and gave him to another, though she still would not have him die.
    Lancelot then leaves the court and Cardoil armed, enters a deep forest, and prays
    for divine guidance to safety.
