canonical_text:
  quote: King Claudas sent a privy message to Briant
  summary: King Claudas resents Lancelot’s growing renown and victories because of
    earlier conflict involving King Ban of Benoic, Lancelot’s father. Claudas secretly
    urges Briant to cause King Arthur to exclude Lancelot from court, reasoning that
    if Lancelot and Gawain are absent, the rest of Arthur’s company will not remain
    and Arthur’s land will become vulnerable. Briant replies that Gawain and Ywain
    are already becoming aloof and that he can arrange for Lancelot to be badly defeated.
