canonical_text:
  quote: ''
  summary: Perceval is urged by the damsel to seek the Red Knight who killed his uncle's
    son and is defended by a fierce loyal lion. On the way to the Deep Forest, Perceval
    meets a wounded knight, directs him to a hermit for a horse, and the knight is
    later killed by a retainer of Aristor for taking Aristor's horse. Perceval enters
    the forest, fights and kills the lion, then kills the Red Knight in single combat
    and takes the Red Knight's horse because his own mount is disabled.
  language: English
  quote_policy: summarized
