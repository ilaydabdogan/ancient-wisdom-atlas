  summary: Perceval hears his mother with little reply but is pleased; courage comes
    over him, and she has him disarmed and richly clothed. The Lord of the Moors,
    expecting to take Perceval's mother's castle, learns of Perceval's coming. An
    unnamed knight of the Widow Lady returns from hunting hart and hind in the Lonely
    Forest with huntsmen. The Lord of the Moors challenges his use of the bow there,
    and the knight answers that the forest belongs by right to the Lady of Camelot
    and her son.
