canonical_text:
  quote: ''
  summary: Perceval accepts a perilous adventure reported by a damsel, leaves court
    with Gawain and Lancelot as companions, and approaches the Castle of Great Endeavour.
    The castle turns rapidly, is surrounded by waters, and is defended by copper archers,
    horn-blowers, and chained beasts. The damsel says only Perceval may enter to vanquish
    a knight, win the Golden Circlet and the Graal, and end the false law. Perceval
    gives her his spear and shield, rides alone to the gate, strikes it, and the castle’s
    defenses stop while bridges rise behind him. Gawain and Lancelot are warned not
    to approach; people inside rejoice that Perceval may save them in body and soul.
    The companions leave toward the Waste City, where Lancelot anticipates death and
    the Poor Knight appears.
  language: English
  quote_policy: summarized
