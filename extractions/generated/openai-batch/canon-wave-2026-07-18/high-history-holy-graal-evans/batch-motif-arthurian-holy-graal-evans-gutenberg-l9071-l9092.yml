canonical_text:
  quote: ''
  summary: A damsel tells Perceval that only her brother can now aid her and her mother,
    whose time in her castle is limited to fifteen days. She does not know where to
    find the brother and names King Pelles in the hermitage as their only refuge.
    Perceval silently pities her as she weeps and points out the lands around Camelot.
    She says the Lord of the Moors has taken these lands from her mother and seeks
    the castle as well.
