canonical_text:
  quote: "“No knighthood is there so fair as that which is undertaken to set forward
    the Law of God”"
  summary: Perceval, the son of the Widow Lady, travels toward tasks connected with
    his knighthood and enters a land hostile to Christian belief. A knight warns him
    about the island, its queen, her hatred of the New Law, and her blindness, which
    the narrator attributes to God while the queen attributes it to her false gods.
    Perceval replies that holy knighthood should advance God's Law and accept bodily
    travail for God. He departs glad to hear that Lancelot won a kingdom and did away
    with its false law, though he does not know Lancelot has been imprisoned.
  language: English
  quote_policy: quoted
