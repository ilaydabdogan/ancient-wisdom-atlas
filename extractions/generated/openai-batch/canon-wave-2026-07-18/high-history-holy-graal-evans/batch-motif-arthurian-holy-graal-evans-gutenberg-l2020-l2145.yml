canonical_text:
  quote: None may teach you the way, save the will of God lead you therein.
  summary: A hermit tells Messire Gawain about serving King Fisherman at the holy
    place where the Graal appears, and says that only God's will can lead one to the
    castle. The damsel prays before an image of Our Lady and explains that she must
    carry a severed head to the Black Hermit's castle as the price of safe passage.
    Gawain and the damsel depart separately; Gawain rides through the forest, prays
    to be guided to King Fisherman's land, meets a vengeance-seeking squire, and later
    sees a fortified castle on a mountain surrounded by waters and meadows.
  language: English
  quote_policy: quoted
