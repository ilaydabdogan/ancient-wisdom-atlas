canonical_text:
  quote: ''
  summary: Perceval recounts his adventures, remains with his mother until her land
    is peaceful, and then departs because his tasks are unfinished. A lady establishes
    a rich chapel by a sepulchre between the forest and Camelot, later associated
    with an abbey. Perceval enters the forest, is hosted by a sighing knight, and
    hears that the knight’s brother was killed because he rode Aristor’s horse. Perceval
    is troubled by the news. After leaving, he hears mass at a hermitage, where a
    hermit warns him that armed knights in the forest seek the killer of Aristor,
    the Red Knight, and the lion, and intend to kill knights they meet.
  language: English
  quote_policy: summarized
