canonical_text:
  quote: ''
  summary: Perceval comes near Cardoil and finds Arthur's country terrified by the
    Knight of the Dragon. At Arthur's hall, mutilated dead knights are displayed,
    and messengers report the enemy's devastation and taunts. A damsel with a horse-bier
    petitions Arthur, identifies Perceval as the knight who won the Red Launde assembly,
    and says he is bound to avenge the knight she has borne. The slain knight is named
    Alein of Escavalon, Perceval's kinsman, beloved of the Damsel of the Circlet of
    Gold. The damsel explains that slaying the Knight of the Dragon would avenge Alein,
    win the Circlet of Gold, and save Arthur's and neighboring lands.
  language: English
  quote_policy: summarized
