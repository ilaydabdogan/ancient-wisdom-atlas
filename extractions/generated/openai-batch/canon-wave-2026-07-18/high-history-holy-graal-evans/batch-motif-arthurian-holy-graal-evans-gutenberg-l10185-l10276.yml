canonical_text:
  quote: ''
  summary: The passage recounts Elysa's baptism after giving Perceval a sword, Perceval's
    departure to the Castle of Copper, his encounter with a copper-bull cult guarded
    by necromantic copper men with iron mallets, and a Voice-directed ordeal in which
    only thirteen of fifteen hundred inhabitants survive because they have bound their
    belief in Our Lord.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman asks that those unwilling to be baptized or accept the New Law be
    slain by the sword she gives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: She is baptized first, receives the name Elysa, is described as leading a
    holy virgin life, and her body is said to be honored in Ireland.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After healing, Perceval leaves the Queen of the Golden Circlet's castle, leaves
    the Golden Circlet with her, and rides until he reaches the Castle of Copper.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inhabitants of the Castle of Copper worship a bull of copper and believe
    in no other God.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:5
  text: The bull of copper stands in the middle of the castle on four copper columns,
    bellows loudly enough to be heard for a league, and contains an evil spirit that
    gives answers to questions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the gateway are two copper men made by necromancy, holding iron mallets
    and striking so powerfully that mortal beings passing between the blows would
    be crushed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Voice above the gate tells Perceval he may go forward safely and need not
    fear the copper men or their blows.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When Perceval approaches, the copper gate-guards cease striking and hold their
    mallets still, allowing him to enter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Inside the castle, the people are so intent on worshipping the bull that they
    do not speak with Perceval.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says the devil has deceived the inhabitants and supplied them
    with abundance of everything they desire.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Voice tells Perceval to make all the inhabitants pass through the gateway
    so that willingness to believe in God may be proved.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Perceval draws his sword and compels the inhabitants to pass before him through
    the entrance where the copper serjeants strike with iron mallets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Of fifteen hundred inhabitants, only thirteen are not slain by the mallets;
    the passage explains that these thirteen had firmly bound their belief in Our
    Lord, so the copper serjeants did not heed them.
  category: sequence
  evidence_refs:
  - ev:7
