    and slain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Perceval slays and crushes the defenders of the fifth bridge and makes them
    fall into the swift water beneath the bridge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The defenders of the sixth bridge, and then the seventh bridge, cry mercy,
