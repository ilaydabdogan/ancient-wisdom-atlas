- id: obs:3
  text: Two other defenders ask Perceval for mercy and say they will be at his will,
    believe in God and His sweet Mother, and abandon their evil lord; the men of the
    fourth bridge say the same.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: On Joseus’s counsel, Perceval allows the surrendering defenders to live on
    condition, and they cast away arms and yield the bridges.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Perceval thinks that God’s power is great, that a knight with strength ought
    to prove prowess for God’s sake, and that God wills human travail for Him.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Perceval dismounts from the white mule, gives the banner to Joseus, mounts
