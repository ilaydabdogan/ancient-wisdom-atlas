canonical_text:
  quote: ''
  summary: Perceval arrives armed on a white mule and overcomes the defenders of successive
    bridges. Some defenders surrender, promise to believe in God and His Mother, abandon
    their evil lord, cast away arms, and yield bridges. Perceval reflects on divine
    power and the labor expected of God’s champion. At the fifth bridge, Joseus bears
    the banner and helps in combat while God saves him from being slain; Perceval
    kills the defenders and casts them into swift water. Defenders of the sixth and
    seventh bridges surrender. A chained red lion breaks free and kills a knight,
    after which a white lion attacks and tears the red lion apart.
  language: English
  quote_policy: summarized
