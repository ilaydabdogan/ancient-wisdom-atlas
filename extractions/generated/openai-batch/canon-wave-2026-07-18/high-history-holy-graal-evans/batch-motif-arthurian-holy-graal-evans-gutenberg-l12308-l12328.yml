  summary: A speaker laments the death of an incomparable Queen. Lancelot asks the
    King for leave to return toward Cardoil to defend the King’s troubled land while
    the King is away in relation to the Graal. Gawain supports the request. The King
    consents and asks Lancelot to guard and govern the land until God brings the King
    back. Lancelot departs sorrowfully.
