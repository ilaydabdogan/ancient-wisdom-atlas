canonical_text:
  quote: "“they lodge many arrows in his shield”"
  summary: A damsel praises Perceval, notes changes in her own condition and that
    of another damsel, and warns him about the castle of the Black Hermit. Perceval
    rides toward the castle with the Damsel of the Car following. Archers shoot at
    him, but because of his white shield they do not recognize him at first. At the
    moat and drawbridge the shooting stops, the gate opens, and those inside lose
    the will and strength to kill him, leaving the matter to their lord. Perceval
    enters the hall and confronts the armed Black Hermit, whose men say they cannot
    aid him if he cannot defend himself.
  language: English
  quote_policy: quoted
