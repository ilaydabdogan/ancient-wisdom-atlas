canonical_text:
  quote: ''
  summary: Kay boasts that he has opened the coffer. At the damsel's request, Arthur
    has a chaplain read the gold letters inside. The letters identify the head in
    the vessel as Lohot, son of Arthur and Guenievre, and state that Kay killed Lohot
    while Lohot slept on the giant he had slain, then took the giant's head and falsely
    claimed the exploit. Guenievre recognizes her son's head by a childhood scar,
    and the court mourns. Arthur is then reminded to undertake his promised pilgrimage
    to the Holy Graal; he prepares to go with Gawain, Lancelot, and a squire, and
    sends Lohot's head to a chapel in Avalon. Kay flees and is sheltered by Briant
    of the Isles, who begins war on Arthur's land after Arthur departs.
  language: English
  quote_policy: summarized
