canonical_text:
  quote: ''
  summary: Gawain turns to leave, but a damsel on foot rebukes him for failing to
    ask about the Damsel of the Car's arm, its golden stole, and the pillow on which
    it lies. The Damsel of the Car says Arthur and his knights also failed to ask,
    refuses to explain now, and says only her own knight, called the most coward knight
    in the world, will know. Gawain does not press her and continues on the road she
    had indicated.
