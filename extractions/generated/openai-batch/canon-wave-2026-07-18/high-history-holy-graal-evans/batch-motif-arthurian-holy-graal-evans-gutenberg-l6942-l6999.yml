canonical_text:
  quote: '"And you had had the like desire to see the Graal that you have to see the
    Queen, the Graal would you have seen."'
  summary: A damsel accuses Lancelot and Gawain of earlier killings and threatens
    trouble for Lancelot. Lancelot leaves and visits King Hermit, who hears of Lancelot's
    visit to the languishing King Fisherman. King Hermit says Lancelot did not see
    the Graal because his desire to see the Queen was stronger, then warns him not
    to incur divine wrath. Lancelot stays overnight, hears mass, and returns to Pannenoisance
    on the sea of Wales.
  language: English
  quote_policy: quoted
