canonical_text:
  quote: ''
  summary: King Arthur and Messire Gawain are confined in a castle by Ahuret the Bastard,
    who seeks vengeance for his brother Nabigant. Arthur and Gawain sortie against
    Ahuret's superior force. After heavy fighting and the loss of their five knights,
    Arthur maims Ahuret. Meliot of Logres arrives with fifteen knights, rescues Arthur
    and Gawain, and routs the besiegers. Gawain thanks Meliot, grants him the castle,
    promises reciprocal aid, and departs with Arthur while Meliot fortifies the castle.
  language: English
  quote_policy: summarized
