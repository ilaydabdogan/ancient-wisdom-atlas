canonical_text:
  quote: ''
  summary: Perceval, honored at the Queen of the Maidens' castle and described as
    chaste, learns that his uncle, the King of Castle Mortal, has come to the island.
    He crosses alone in a galley despite the Queen's wish to send escorts. Perceval
    and the King fight until the King notices Perceval's shield and learns that Perceval
    is the son of King Alain and Yglais, the King's sister. Perceval denounces his
    uncle as disloyal for warring against a good king, the lady of the castle, and
    the sacred hallows. The King withdraws into his galley and flees; Perceval declares
    the island conquered and returns unwounded to the Queen's castle, where he is
    honored and the inhabitants feel safer.
  language: English
  quote_policy: summarized
