canonical_text:
  quote: ''
  summary: Perceval, released from a prior accusation, hears that his sister is seeking
    him and his mother needs help. He travels to the Castle of Tallages, where knights
    and damsels under penance are released when he is recognized as the knight who
    was first at the Graal but failed to ask its purpose. The Queen of the Maidens
    explains that the King of Castle Mortal, Perceval's uncle and brother of King
    Fisherman, wars on her and seeks the Lance and the Graal.
  language: English
  quote_policy: summarized
