canonical_text:
  quote: ''
  summary: At court, Gawain, Lancelot, the King, and the Queen discuss the Good Knight
    and the damsel Dindrane, identified as the Good Knight's sister. Lancelot recounts
    a prior combat and healing stay with the Good Knight. The Queen describes a brachet
    that showed joy toward both Dindrane and the knight. Gawain and Lancelot leave
    court to seek the Good Knight, reach a cross where all forest roads meet, choose
    separate right and left paths, and agree to reunite there after a year.
  language: English
  quote_policy: summarized
