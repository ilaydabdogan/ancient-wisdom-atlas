canonical_text:
  quote: For promise that knight maketh to dame or damsel behoveth him to keep.
  summary: A weeping damsel tells Lancelot that a knight promised to marry her but
    now refuses. Lancelot rebukes the knight, threatens him with death if he will
    not keep the covenant, and compels him to marry her. The party rides to a chapel
    at a hermitage where a hermit weds the pair. Lancelot then reports the marriage
    to the damsel's father, the Vavasour, who rejoices. Later, Lancelot tells another
    damsel traveling with a dwarf that the wedding occurred and required his intervention.
  language: English
  quote_policy: quoted
