canonical_text:
  quote: ''
  summary: Clamados accuses Perceval before the Queen of the Tents and seeks vengeance
    for slain kin. The Queen shelters Perceval and delays immediate acceptance of
    a gage. Melior of Logres then arrives, accusing Clamados of killing his lion and
    insulting him by displaying the lion's head. The Queen distinguishes self-defense
    from insult and allows a combat between Clamados and Melior, appointing Perceval
    to keep the field.
  language: English
  quote_policy: summarized
