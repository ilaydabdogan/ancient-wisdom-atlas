canonical_text:
  quote: ''
  summary: At King Arthur's Whitsuntide court at Cardoil, a marvel of two suns is
    explained by a Voice as joy over the Good Knight's conquest and as a summons for
    Arthur to make a Graal pilgrimage. A richly dressed damsel then brings a golden,
    jewelled coffer containing a knight's head, saying that only the slayer can open
    it and that sealed letters within name the dead knight and killer. Arthur and
    his knights fail to open it; the coffer sweats when Arthur touches it. Kay, after
    protesting that he was overlooked, touches it and the coffer opens, revealing
    the head and emitting a sweet smell.
  language: English
  quote_policy: summarized
