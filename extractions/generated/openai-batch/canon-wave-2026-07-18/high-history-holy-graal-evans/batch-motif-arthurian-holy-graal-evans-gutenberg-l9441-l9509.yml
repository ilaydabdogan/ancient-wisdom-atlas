canonical_text:
  quote: ''
  summary: After Gawain and Lancelot return to Arthur's court from an achieved quest,
    two armed knights arrive during a royal meal carrying two dead armed knights.
    They report that the Knight of the Fiery Dragon has entered Arthur's land, destroying
    knights and castles. He is described as huge, grim, heavily armed, and bearing
    a shield with a dragon head that emits fire. The messengers say he comes from
    the Giant's castle to avenge Logrin the Giant, whose head Kay brought to court.
    Lancelot offers that he and Gawain go against him, but Arthur refuses, calls the
    foe a devil or fiend from Hell, and the court remains in fear.
  language: English
  quote_policy: summarized
