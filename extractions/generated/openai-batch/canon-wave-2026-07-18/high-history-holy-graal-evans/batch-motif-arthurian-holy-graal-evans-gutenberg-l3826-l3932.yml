canonical_text:
  quote: ''
  summary: Messire Gawain learns that King Gurgalain’s only son has been carried off
    by a Giant who has devastated the land. The king offers a wondrous sword, associated
    with the beheading of Saint John and bloody at noon, to anyone who recovers the
    son and slays the Giant. Gawain accepts, travels through a perilous mountain pass
    to the Giant’s rocky hold, fights him, and kills him after the Giant strangles
    the king’s son. Gawain returns with the dead child and the Giant’s severed head,
    and the king promises the reward.
  language: English
  quote_policy: summarized
