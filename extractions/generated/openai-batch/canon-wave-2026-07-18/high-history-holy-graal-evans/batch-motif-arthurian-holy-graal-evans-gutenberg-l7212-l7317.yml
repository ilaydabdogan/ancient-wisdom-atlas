canonical_text:
  quote: ''
  summary: At Arthur's court in Pannenoisance, the king asks about his missing son
    Lohot and speaks of Kay's killing of the giant Logrin. A distressed damsel arrives
    and asks for the aid of the knight who will bear the shield hanging in the hall.
    She says she has searched for her brother and must travel alone in danger. Arthur
    and Guenievre honor her. A brachet associated with the shield unexpectedly recognizes
    and follows the damsel. She prays daily in the chapel for counsel because her
    mother's castle is in danger. She explains that her father is dead, her mother
    has been dispossessed by an aggressor, Gawain had protected the last castle for
    a year, and she seeks either her brother or the shield-bearing knight reputed
    to be the best knight in the world.
  language: English
  quote_policy: summarized
