canonical_text:
  quote: ''
  summary: King Arthur seeks penitential counsel from a holy hermit, who recounts
    a failed encounter with the Holy Graal and bleeding Lance that has brought war
    upon the lands. Arthur departs, is attacked by a Black Knight with a burning spear,
    is wounded in the arm, and kills the knight. A damsel then demands that Arthur
    return through danger to bring her the dead knight's head, saying this is required
    for his healing.
  language: English
