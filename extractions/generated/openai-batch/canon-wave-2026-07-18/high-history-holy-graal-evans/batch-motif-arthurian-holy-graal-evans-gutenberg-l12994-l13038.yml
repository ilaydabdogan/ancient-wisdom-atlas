canonical_text:
  quote: a desire and a will hath taken him to keep vigil in the chapel before one
    of the images of Our Lady.
  summary: In a chapel containing the Queen's coffin, Lancelot learns whose body lies
    there, conceals his grief, kneels by the coffin under cover of worshipping an
    image of Our Lady, laments and prays for burial near the Queen, and then refuses
    food and rest so that he may keep vigil through the night before a Marian image.
  language: English
