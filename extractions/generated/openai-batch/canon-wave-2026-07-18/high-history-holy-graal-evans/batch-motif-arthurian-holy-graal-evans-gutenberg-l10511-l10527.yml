canonical_text:
  quote: Two lions are there at the entry of the gateway, whereof the one is red and
    the other white.
  summary: Perceval listens to the Hermit's chastening counsel. The Hermit tells him
    that two lions, one red and one white, stand at a gateway; Perceval should trust
    the white lion, which is on God's side, and follow its intent as revealed by its
    gaze. This guidance is necessary for passing nine bridges guarded by twenty-seven
    knights and for furthering the Law of Our Lord.
  language: English
