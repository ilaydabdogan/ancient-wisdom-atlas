canonical_text:
  quote: ''
  summary: Messire Gawain, spiritually prepared by confession and the Hermit's counsel,
    crosses successive threatening bridges that prove knights who seek entry. The
    bridges become safe or splendid as he advances. At the gate he sees sacred images,
    an angel pointing toward the chapel of the Holy Graal, and a purity inscription
    about the castle lord. A lion yields to him at the entrance. Inside the castle,
    Gawain enters a richly decorated hall, sees a couch and chess-board, is welcomed
    and disarmed by two knights, washed with water from gold basins, clothed by two
    damsels, and marvels at a candleless brightness like sunlight.
  language: English
  quote_policy: summarized
