canonical_text:
  quote: ''
  summary: Messire Gawain asks a priest about a king who cooked his dead son and made
    his people eat him; the priest interprets the act as a sacrifice to Christ that
    removed evil belief from the land. Gawain travels through a fair land to a long-secluded
    hermit, who directs him to the Fisherman King's water-surrounded castle. After
    confession, the hermit instructs Gawain to ask what a prior knight forgot, to
    fear nothing at the entrance, and to adore the chapel where the flame of the Holy
    Spirit descends for the Holy Graal and lance point. Gawain approaches, adores
    the chapel, is warned away from a rich sepulchre, and comes to three dangerous
    bridges over three waters, where a castle knight urges him to cross without misgiving.
  language: English
  quote_policy: summarized
