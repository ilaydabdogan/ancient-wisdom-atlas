canonical_text:
  quote: ''
  summary: Gawain wakes in the hall. The lady realizes the dwarf has betrayed her
    and asks Gawain not to leave without helping her. Gawain arms himself and waits
    in ambush. Marin the Jealous arrives with the dwarf, accuses his wife of disloyalty,
    strips her, has the dwarf lead her by the hair, forces her into a cold spring
    or pool, and beats her with rods until the water is bloody. Gawain intervenes
    and offers to swear on sacred hallows that no wrongdoing occurred. Marin proposes
    a joust as judgment of the lady’s guilt. When the joust begins, Marin avoids Gawain’s
    charge and kills his wife with a spear, then flees. Gawain tramples the fleeing
    dwarf, returns to the dead lady, carries her to a chapel, lays her inside, and
    closes the door to protect the body until burial.
  language: English
  quote_policy: summarized
