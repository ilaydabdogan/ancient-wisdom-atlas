canonical_text:
  quote: ''
  summary: Lancelot refuses a damsel's invitation into her castle and refuses to return
    a sword taken from a coffin because it is needed to heal an unnamed knight. The
    damsel says the sword prevents hostile beings from harming him and reveals that
    without it she would have had him carried into her castle and held there. Lancelot
    passes safely through a grave-yard of hideous evil folk, later becomes lost in
    the forest, and sleeps in a walled orchard near a cavern associated with griffons.
    A servant-damsel discovers him, tells her Lady, and the Lady kisses the sleeping
    Lancelot three times before he wakes and makes the sign of the cross.
  language: English
  quote_policy: summarized
