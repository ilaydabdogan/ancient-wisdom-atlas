canonical_text:
  quote: ''
  summary: Lancelot, King Arthur, and Gawain are hosted by a knight who resents Lancelot
    for having forced him to marry a damsel whose honor Lancelot once saved. The knight
    humiliates his wife by requiring her to serve water and sit with squires. Lancelot
    condemns the conduct but does not attack while lodged in the host's hold. The
    party then reaches Tintagel, where an old priest explains the fallen ground around
    the castle as the result of the sin by which Uther, aided by Merlin's art, entered
    in Gorlois's likeness, lay with Ygerne, and begat Arthur. The priest also reports
    that Merlin's body was placed in a sepulchre outside the chapel but mysteriously
    vanished.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lady tells Lancelot that he once had great pity on her and saved her honor;
    she says she prefers hardship with honor to abundance with shame.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The knight of the hold returns from shooting in the forest with venison, recognizes
    Lancelot, and says Lancelot made him marry the damsel, who has not had and will
    not have joy from him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lancelot says he made the knight marry the damsel because the knight had intended
    to disgrace and shame her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The knight says the damsel he formerly loved would like to cause Lancelot
    vexation, hurt, and shame, and has great power in the forest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The host commands water service; the lady presents basins of water to the
    knights, and the King initially refuses to accept such service from her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lancelot has the King accept water from the lady; she performs the same service
