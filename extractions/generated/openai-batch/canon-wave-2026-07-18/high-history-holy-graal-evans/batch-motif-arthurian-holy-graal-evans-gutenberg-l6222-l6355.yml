canonical_text:
  quote: ''
  summary: The branch turns from Perceval to Lancelot. Lancelot reaches a castle where
    an old vavasour and his two daughters ask him to defend their rightful castle
    and fiefs from a knight whose truce is ending. After mass the next morning, Lancelot
    answers the challenger, defeats and wounds him, learns he is Marin of Gomeret,
    and requires him to renounce his feud and swear on hallows never again to war
    against the vavasour and his daughters.
  language: English
  quote_policy: summarized
