  quote: So soon as he came nigh, the sepulchre openeth on one side, so that one saw
    him that was within the coffin.
  summary: Perceval arrives at a castle with his sister. Their mother sees them from
    the hall window and hopes the knight is her son, since her castle and heirs depend
    on it. Perceval recognizes a chapel with a mysterious coffin. After he approaches
    the tomb, the sepulchre opens, the coffin's occupant is visible, and the Lady
    recognizes and joyfully embraces Perceval as her son.
