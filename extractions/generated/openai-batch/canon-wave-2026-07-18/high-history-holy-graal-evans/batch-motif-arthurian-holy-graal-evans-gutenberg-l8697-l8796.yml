canonical_text:
  quote: ''
  summary: A hermit recounts how Lohot, Arthur's son, slew the giant Logrin in the
    wasted borderland of Logres, but Kay found Lohot sleeping on the corpse, killed
    him, hid his identity, and claimed the giant's head and reward. The hermit and
    a damsel later tended Lohot's remains. Perceval hears this account, departs after
    mass, and then overhears a damsel praying under a tree for aid for her mother,
    whose castle is threatened; she laments the absence of her brother, the languishing
    Fisher King, the hostility of the King of Castle Mortal, and the withdrawal of
    King Pelles into hermitage.
  language: English
  quote_policy: summarized
