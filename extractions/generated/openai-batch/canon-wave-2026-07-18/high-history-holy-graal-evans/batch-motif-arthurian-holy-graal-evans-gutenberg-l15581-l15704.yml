canonical_text:
  quote: ''
  summary: Meliot of Logres, seeking news of the imprisoned Gawain, rides through
    a gloomy forest, finds a damsel forced to watch two hanged knights, buries the
    knights, and brings her to a bright chapel where another damsel watches a dead
    knight. The chapel damsel reports further threats by the Knight of the Galley,
    including Gawain's coming unarmed fight with a lion and a lady's threatened death
    unless she renounces the New Law. The Knight of the Galley arrives with the lady
    and a dwarf; Meliot confronts and wounds him in combat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Meliot of Logres departs Castle Perilous unharmed, grieves over news that
    Messire Gawain is imprisoned, and rides through a strange, gloomy forest seeking
    information about him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night, in a foul-seeming place under a dark moon, Meliot sees a damsel
    sitting and lamenting in the forest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The damsel shows Meliot two fully armed knights hanging above her head and
    says the Knight of the Galley killed them because they believed in God and His
    Mother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The damsel says she must watch the hanged knights for forty days so that no
    one takes them down, and that the Knight of the Galley would behead her if she
    failed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Meliot says it would be shameful to leave the knights hanging, makes graves
    with his sword, and buries them as best he can.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Meliot and the rescued damsel go to a chapel where a hermit had formerly been,
    and where another damsel keeps watch over a dead knight amid a great brightness
    of light.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The chapel damsel says the Knight of the Galley killed the dead knight on
    the seashore the previous day.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chapel damsel says the Knight of the Galley will come before going to
    the castle where Messire Gawain is to fight a lion unarmed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The chapel damsel says her lady will be brought to the lion and will be delivered
    to it unless she renounces the New Law, and that the damsels themselves will be
    devoured with her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Meliot stays in the chapel overnight and hears the Knight of the Galley coming
    like a tempest, bringing the lady of the castle with a dwarf following after him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The dwarf calls Meliot disloyal, says he caused the knight to lose his castle,
    and urges the Knight of the Galley to avenge himself before going to Gawain's
    death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Knight of the Galley accuses Meliot of trespass and taking down his knights;
    Meliot replies that the dead were knights of God and that the killing was a foul
    outrage.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Meliot strikes the Knight of the Galley in the breast with his spear and wounds
    him; the knight then strikes Meliot's shield hard in return.
  category: action
  evidence_refs:
  - ev:9
