canonical_text:
  quote: ''
  summary: After winning two bridges, Perceval is exhausted and remembers what his
    uncle had told him about the lion. He sees a white lion standing upright at the
    gateway, looks into its eyes, and understands that by God's will it is telling
    him the third-bridge knights cannot be overcome by one knight unless God opens
    the way; he must take the mule and carry the banner. Perceval thanks God and withdraws
    with Joseus, and they see that the first bridge has been raised behind them.
  language: English
