canonical_text:
  quote: ''
  summary: Perceval, Gawain, Lancelot, and an unnamed knight connected to the Poor
    Knight of the Waste Castle confront robber-knights in a forest hold. Lancelot
    fights the robbers until Gawain and Perceval arrive; the robbers are killed. The
    companions discover plundered treasure in an underground cave and broad pit, grant
    the hold and treasure to two poor damsels related to the Poor Knight, and entrust
    Joseus the Hermit with guarding it. Perceval then departs to seek his sister and
    widowed mother and to fulfill King Arthur's promise to his sister.
  language: English
  quote_policy: summarized
