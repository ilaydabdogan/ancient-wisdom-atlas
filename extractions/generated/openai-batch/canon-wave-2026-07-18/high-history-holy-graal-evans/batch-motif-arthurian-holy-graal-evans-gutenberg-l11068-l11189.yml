canonical_text:
  quote: ''
  summary: King Arthur, Lancelot, and Messire Gawain travel through a dark forest
    at night and are guided by a squire’s sighting of a distant fire to a deserted
    house. Inside, they find a chamber full of dead men. A wounded and lamenting damsel
    arrives carrying half of a dead man and explains that she is the Damsel of the
    Castle of Beards, punished for former cruelties against knights by having to carry
    slain knights into the manor. She says Lancelot’s arrival ends her penance and
    warns that black, hideous knight-fiends come nightly to battle; Lancelot draws
    a protective circle with his sword.
  language: English
  quote_policy: summarized
