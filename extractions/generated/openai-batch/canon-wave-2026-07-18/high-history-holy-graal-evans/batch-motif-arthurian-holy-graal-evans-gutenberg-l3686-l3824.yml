canonical_text:
  quote: '"You are not the Good Knight unto whom is served thereof and who thereby
    is made whole."'
  summary: Gawain rides through a fair walled land ruled by the King of Wales, who
    identifies his destination as King Gurgalain's country and the sword associated
    with Saint John's beheading. After pledging to return, Gawain enters a forest
    and encounters an ornate fountain, a golden vessel, a hidden image, a forbidding
    voice, a clerk, and three white-clad damsels bringing bread, wine, and flesh.
    The vessel is said to be carried to hermits and to the sick Good Knight. Gawain
    then lodges with a hermit, hears a warning about knights who do not return, and
    reaches Gurgalain's land amid mourning.
  language: English
  quote_policy: quoted
