canonical_text:
  quote: ''
  summary: Perceval leaves the White Tower, comes through the forest to Castle Perilous,
    learns of Brundans's treacherous killing of Meliot, and is summoned to rescue
    the younger Damsel of the Tent from forced abduction. He confronts Brundans, defeats
    and beheads him, and sends the head to King Arthur's court with greetings for
    Arthur, Gawain, and Lancelot. He later hears that a cup and message he sent have
    helped reconcile the Sick Knight and his wife, and he discusses the honorable
    death of the knight once called Knight Coward and then Knight Hardy.
  language: English
  quote_policy: summarized
