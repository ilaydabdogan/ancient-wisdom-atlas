canonical_text:
  quote: ''
  summary: Gawain rides through the forest in anger and grief, meets the strangely
    inverted Knight Coward, is challenged by a knight acting for Marin the Jealous,
    defeats and spares the challenger, learns from the Knight Coward about the Damsel
    of the Car and her relation to the Holy Graal, receives the Coward's spear, and
    then encounters a wounded knight who says he was wounded in Gawain's service.
  language: English
  quote_policy: summarized
