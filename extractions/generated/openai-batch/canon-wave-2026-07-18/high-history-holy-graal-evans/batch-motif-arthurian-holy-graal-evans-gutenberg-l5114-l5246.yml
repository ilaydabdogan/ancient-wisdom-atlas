canonical_text:
  quote: ''
  summary: Lancelot leaves a castle after the lady offers him lordship and love and
    after a damsel says his love for Queen Guenievre prevents him from seeing the
    Graal. He travels toward the Castle of Souls, passes through a thorn-enclosed
    burial ground, enters a chapel where a dead knight's wounds bleed at his arrival,
    is accused by hostile knights, kills one knight at the graveyard exit, and later
    reaches a hermitage where another knight says he seeks a brother known as the
    Poor Knight.
  language: English
  quote_policy: summarized
