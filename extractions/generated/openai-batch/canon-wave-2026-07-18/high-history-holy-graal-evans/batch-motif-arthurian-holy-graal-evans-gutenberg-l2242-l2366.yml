canonical_text:
  quote: ''
  summary: Messire Gawain speaks with the Widow Lady and her daughter about Perceval,
    the Lady's son and the daughter's brother, who has been absent for seven years.
    The Lady describes warfare against her castle and says King Fisherman is challenged
    for the Holy Graal and the bleeding Lance. Gawain recalls a knight before whom
    the Graal appeared three times, yet who failed to ask about its service or honor;
    the daughter says this failure caused King Fisherman's languishment. A squire
    reports a tournament in valleys formerly belonging to the Lady, where the best
    knight is to take over the castle garrison. The daughter pleads for help, and
    Gawain prepares with the Lady's five knights to attend the assembly. Riding out,
    they see the Valleys of Camelot, which the knights say the Lady and her daughter
    have lost, along with seven castles.
  language: English
  quote_policy: summarized
