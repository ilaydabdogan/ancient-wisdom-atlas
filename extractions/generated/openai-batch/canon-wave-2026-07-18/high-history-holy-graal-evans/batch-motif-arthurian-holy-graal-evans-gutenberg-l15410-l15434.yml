canonical_text:
  quote: They held her up and baptized her, both her and her damsels with her. Perceval
    held her at the font.
  summary: Perceval and a damsel negotiate a promise of proper knightly love linked
    to her willingness to believe in his God and receive baptism. A hermit is summoned,
    the damsel and her attendants are baptized, Perceval holds her at the font, she
    is named Celestre, and afterward she is taught Christian belief and lives holily
    with good works.
