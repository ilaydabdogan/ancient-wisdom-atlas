canonical_text:
  quote: '"so soon as he shall return, this coffin behoveth open"'
  summary: Messire Gawain approaches the castle of the Widow Lady, learns that it
    is besieged and that she awaits her absent son. At a chapel near the castle he
    observes a coffin. The Widow Lady and her daughter mistake the possibility of
    his arrival for the son's return, but the unopened tomb proves otherwise. Gawain
    reveals his name and is received as an honored guest while the Lady asks for news
    of her son.
  language: English
  quote_policy: quoted
