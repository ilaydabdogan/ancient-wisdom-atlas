canonical_text:
  quote: ''
  summary: King Arthur obtains the severed head of the Black Knight from another knight,
    crosses a boundary called the bar, and gives the head to a damsel. She heals Arthur's
    wound with warm blood from the head and explains that the head is also needed
    for the recovery of a castle taken from her by treason, through the knight Perlesvax.
    She then recounts Perlesvax's naming, the dispossession of his father's lands,
    his youth, and an ancient coffin whose inscription says it will open when the
    Best Knight in the world arrives.
  language: English
  quote_policy: summarized
