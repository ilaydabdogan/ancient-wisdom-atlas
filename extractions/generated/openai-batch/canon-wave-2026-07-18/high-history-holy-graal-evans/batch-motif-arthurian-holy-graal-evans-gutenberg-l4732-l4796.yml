canonical_text:
  quote: I forgat to ask how it served and of what?
  summary: Lancelot and Gawain are hosted by a poor knight and clothed in poor garments
    offered by two damsels. They attend the burial of a dead messenger-knight. Gawain
    tells Lancelot that he saw the Graal at King Fisherman's court but failed to ask
    the question requested of him; the knights then part ways.
  language: English
  quote_policy: quoted
