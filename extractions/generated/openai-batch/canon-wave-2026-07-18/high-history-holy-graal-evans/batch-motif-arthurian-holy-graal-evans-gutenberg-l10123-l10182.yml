canonical_text:
  quote: ''
  summary: A damsel beside the Queen calls on Perceval to remedy the harm. Perceval
    fights a knight who bears a devil or dragon's head in his shield. Flame from the
    shield makes Perceval's sword fiery; after an exchange of wounds, Perceval thrusts
    his sword into the dragon's gullet. The dragon's head turns on its lord, burns
    him to dust, and departs into the sky. Perceval's wound is treated with the dead
    knight's dust. The Queen declares that he has saved her land and fulfilled a prophecy
    of the knight with the head of gold, then places the Circlet of Gold on his head
    and returns his sword.
  language: English
  quote_policy: summarized
