canonical_text:
  quote: ''
  summary: 'Perceval recounts seeing two priests respond differently to the cross:
    one kisses and worships it joyfully, while the other beats or reviles it with
    grief. Perceval says he was angered by the second priest. The Hermit explains
    that both priests believe rightly: the joyful priest rejoices in Christ’s redemption
    of souls and divine-human nature, while the grieving priest mourns Christ’s suffering
    on the cross and reviles the instrument of crucifixion. The Hermit identifies
    the priests as forest hermits named Jonas and Alexis.'
  language: English
  quote_policy: summarized
