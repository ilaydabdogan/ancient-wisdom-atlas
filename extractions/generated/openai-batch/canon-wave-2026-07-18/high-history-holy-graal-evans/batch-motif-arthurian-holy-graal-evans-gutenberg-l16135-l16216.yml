canonical_text:
  quote: ''
  summary: Perceval is told that he may depart only if he promises to return when
    he sees a ship with a sail marked by a red cross. The Masters explain that, if
    faithful, he will receive a gold crown, sit on a throne, and become king of a
    plenteous island, but negligent kings are deprived and sent to the Poverty-stricken
    Island. Perceval asks about an armed knight in an ivory vessel and the castle,
    but is told he may know only on return. The Master asks about the Holy Graal and
    hallows, speaks of Joseph and Christ's blood, and attributes Perceval's arrival
    to God's will. After mass, Perceval exchanges his shield for a white shield, departs,
    enters the ship, and is guided swiftly away by God.
  language: English
  quote_policy: summarized
