canonical_text:
  quote: ''
  summary: Lancelot praises the Queen, while a hermit rebukes their love as sinful
    and urges repentance, warning that Lancelot will not be able to behold the Graal
    because of the mortal sin in his heart. Lancelot refuses to renounce the Queen
    and later arrives at King Fisherman's castle, passes safely through a lion-guarded
    gate, is received richly, and meets the ailing King Fisherman in a miraculously
    bright chamber. The King asks about Perceval, learns that Perceval was the first
    knight who came to the Graal chapel, laments that he did not recognize him, and
    asks Lancelot to send Perceval back to heal and help his kin.
  language: English
  quote_policy: summarized
