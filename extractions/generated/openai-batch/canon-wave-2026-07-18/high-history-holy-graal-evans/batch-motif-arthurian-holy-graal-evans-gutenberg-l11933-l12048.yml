canonical_text:
  quote: ''
  summary: King Arthur and Messire Gawain fight in a tournament. Arthur defeats Nabigant
    but restrains his own prowess so that Gawain may receive the Golden Circlet. A
    damsel and the assembled knights award the Circlet to Gawain, though he remains
    publicly misrecognized and mocked as cowardly. Gawain says he will return the
    Circlet to the rightful person and to the Queen from whom it was taken by force.
    Arthur refuses a younger damsel’s offered reward in favor of preserving her honor.
    Meliot of Logres seeks Gawain’s help to recover land taken by Nabigant, but hears
    reports of Gawain’s shame and turns back sorrowfully.
  language: English
  quote_policy: summarized
