canonical_text:
  quote: ''
  summary: Messire Gawain continues seeking Perceval and Lancelot, waits unsuccessfully
    at a cross, and lodges at Joseus the Hermit's hermitage. An unnamed knight brings
    news of a white-armed knight who sought the bearer of a golden-eagle shield and
    later conveys Meliot of Logres's appeal for Gawain's aid against Nabigant of the
    Rock. Joseus identifies Perceval when he arrives; Gawain and Perceval recognize
    that they had jousted at the Red Launde, praise one another, embrace, and enter
    the hermitage.
  language: English
  quote_policy: summarized
