canonical_text:
  quote: ''
  summary: Perceval leaves his mother and sister with their goodwill and rides into
    the Lonely Forest. In a fair launde he sees a red cross, a white-clad knight with
    a golden vessel, and a richly dressed damsel. A white beast, carrying twelve questing
    hounds inside her body, flees in fear and seeks protection, but the hounds emerge
    at the cross and tear her apart. The knight and damsel collect her flesh and blood
    in golden vessels and adore the cross. Perceval imitates their reverence and encounters
    two priests who respond to the cross in opposite ways, one adoring it and one
    beating it while weeping. Perceval then meets the Knight Coward and threatens
    to make him hardy or kill him.
  language: English
  quote_policy: summarized
