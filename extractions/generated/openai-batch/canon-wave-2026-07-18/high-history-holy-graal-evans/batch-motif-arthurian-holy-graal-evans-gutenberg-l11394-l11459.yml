canonical_text:
  quote: ''
  summary: A priestly speaker recounts that Arthur was conceived in sin after a king
    killed a man and espoused Queen Ygerne; Arthur is ashamed to hear this unknown
    account of his birth. Arthur, Gawain, and Lancelot depart through a miraculously
    changing landscape of forests, islands, holds, castles, and adventures, explained
    by Josephus as occurring by God's pleasure and in service of the New Law. Lancelot
    recalls a covenant made after slaying a knight in the Waste City and separates
    from Arthur and Gawain at a forked crossroad to fulfill a perilous pledge. The
    companions part affectionately and pray for his safety. Lancelot secretly thinks
    of the Queen, whom he loves, and reaches the empty Waste City at noon.
  language: English
  quote_policy: summarized
