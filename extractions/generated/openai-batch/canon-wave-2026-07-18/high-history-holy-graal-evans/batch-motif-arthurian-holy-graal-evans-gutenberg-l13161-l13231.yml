canonical_text:
  quote: ''
  summary: Lancelot’s arrival comforts the knights at Cardoil, though he is grieved
    to find many wounded. Meliant of the Waste Manor, at the Hard Rock, hates Lancelot
    and hopes to avenge his father. When armed knights seize booty between Cardoil
    and the forest, Lancelot rides out with seven knights, fights the raiders, unhorses
    Meliant, and enters prolonged combat with Briant of the Isles. Lucan wounds Meliant,
    but Briant’s force rescues him. Night separates the sides; Lancelot returns to
    Cardoil with captured wounded enemies, and the castle rejoices while its wounded
    knights begin to heal.
  language: English
  quote_policy: summarized
