canonical_text:
  quote: ''
  summary: Meliot kills the Knight of the Galley and an escaping dwarf, and the damsels
    thank him for rescuing them. He learns that Messire Gawain has been bound in a
    forest clearing and is to fight a lion unarmed while two damsels are to be devoured.
    Meliot slays the guards, frees Gawain, and identifies himself. News of Queen Jandree's
    baptism and the defeat of the hostile knights causes the Red Court to flee across
    the sea. Meliot and Gawain then come to the seashore and see Perceval fighting
    alone at a ship that has been launched into the sea, placing him in grave peril.
  language: English
  quote_policy: summarized
