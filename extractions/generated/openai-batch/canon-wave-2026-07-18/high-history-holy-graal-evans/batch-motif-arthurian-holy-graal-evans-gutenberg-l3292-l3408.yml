canonical_text:
  quote: '"the entrance to the land of the rich King Fisherman, and within yonder
    are they beginning the service of the Most Holy Graal."'
  summary: Messire Gawain leaves a chapel episode, wanders to a rich land, and reaches
    a guarded castle identified as the entrance to King Fisherman's land where the
    service of the Holy Graal is beginning. A priest tells him he cannot enter or
    approach the Graal unless he brings the sword that beheaded St. John. Gawain departs
    without asking where to find it. Later, by a hill and chapel, a burgess tells
    him that the sword is held by the cruel unbelieving King Gurgalain and offers
    Gawain a rich destrier if he promises to return and show the sword if he conquers
    it.
