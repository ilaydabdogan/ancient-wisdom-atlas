  quote: ''
  summary: Damsels host King Arthur and Messire Gawain overnight, knights gather for
    an assembly near the forest launde, and two damsels lend distinctive arms to Gawain
    and Arthur. Gawain is to wear red arms and be known as the Red Knight; Arthur
    receives gold arms. The assembly is then prepared, with the Golden Circlet damsel
    present and Nabigant of the Rock bringing many knights.
