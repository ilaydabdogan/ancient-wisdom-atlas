canonical_text:
  quote: ''
  summary: Messire Gawain leaves after the baptism of the King of Albanie and fulfills
    pledges involving a sword identified as the weapon used to behead St. John. The
    King of Wales and later a burgess attempt to keep or redirect the sword, but it
    is returned to Gawain. Gawain is then invited to the Castle of the Ball, where
    initial hospitality is interrupted by a dwarf who strikes the host’s daughters
    and accuses them of honoring Gawain, who had slain their uncle.
  language: English
  quote_policy: summarized
