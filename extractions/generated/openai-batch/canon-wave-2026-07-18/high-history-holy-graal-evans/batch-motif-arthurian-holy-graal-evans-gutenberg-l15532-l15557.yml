  summary: 'A first-person speaker recounts a visionary sequence: a beautiful Child
    is born to a Lady whose maidenhood is said to remain intact; fair bird-like folk
    rejoice. The speaker then sees a gentle Man bound and scourged, later nailed to
    a cross and pierced with a spear. The Lady grieves at the cross, another man comforts
    her, and others collect the Man''s blood in a holy Vessel.'
