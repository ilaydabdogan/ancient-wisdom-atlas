canonical_text:
  quote: ''
  summary: The Widow Lady rejoices that her son has returned and says the opening
    of the coffin proves he is the Best Knight. Her chaplain reads gold-sealed letters
    from the coffin identifying the body as one who helped remove Our Lord from the
    cross; bloody pincers are found beside him but cannot be taken, and the coffin
    closes again after Perceval leaves the chapel. The Widow Lady brings Perceval
    to her castle, recounts the wrongs done to her, explains that a hostile knight
    has seized her lands, and urges her son to restore honor while also invoking scripture
    and Solomon on forbearance toward enemies.
  language: English
  quote_policy: summarized
