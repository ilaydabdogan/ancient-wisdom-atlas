canonical_text:
  quote: ''
  summary: Perceval, driving an unwilling knight before him, hears two damsels crying
    for help in the forest. He finds an armed robber-knight beating them and hears
    their account that Gawain and Lancelot had given them the hold and treasure taken
    from robber-knights. Perceval appoints the fearful knight as his champion. After
    being wounded, the fearful knight fights back, kills and beheads the robber-knight,
    presents the head to Perceval, and is renamed the Knight Hardy before escorting
    the damsels safely to their hold.
  language: English
  quote_policy: summarized
