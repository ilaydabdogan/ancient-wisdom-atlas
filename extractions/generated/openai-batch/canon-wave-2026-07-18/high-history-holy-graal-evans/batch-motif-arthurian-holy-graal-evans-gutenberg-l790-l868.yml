canonical_text:
  quote: ''
  summary: King Arthur leaves company, rides into an adventurous forest, and finds
    a hermitage beside a chapel. Inside he hears unseen angelic and demonic voices
    disputing over a dying hermit's soul. After Arthur withdraws, the Holy Lady argues
    that the hermit's penance and service to her and her Son remove the devils' claim.
    The devils depart, and the Holy Lady commends the hermit's soul to angels, who
    carry it toward her Son in Paradise while singing. The narrator names the hermit
    Calixtus.
  language: English
  quote_policy: summarized
