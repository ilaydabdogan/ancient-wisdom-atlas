canonical_text:
  quote: ''
  summary: Lancelot is attacked by a group of armed knights. He protests that this
    is an evil return for his services, defends himself against many attackers, wounds
    or kills several, and wounds Briant of the Isles. The king orders Lancelot taken
    unharmed to a dungeon. The court laments his imprisonment, except Briant and his
    knights, and some blame Briant for procuring the attack while praying that God
    punish him and free Lancelot.
