canonical_text:
  quote: ''
  summary: Arthur and Gawain first excel at the assembly under the patronage of two
    damsels. The next morning the younger damsel gives Arthur white arms, while the
    elder damsel invokes Gawain’s earlier covenant connected with a sacred sword and
    commands him to perform worst of all while wearing his own recognizable arms.
    Gawain accepts the loss of worship rather than break the covenant; at the assembly
    he drops his shield and flees from Nabigant, and onlookers call the act cowardice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger damsel tells Arthur that no knight present has better arms than
    his and asks him to show himself a good knight for love of her; Arthur answers
    with a prayer that God grant it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder damsel says she is displeased with Gawain because he is not minded
    to do as she wishes, and says he shall pay dearly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Arthur and Gawain enter the assembly together, knock down knights, pierce
    shields, and are said to be unmatched there except by Lancelot or Perceval.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gawain defeats Nabigant in the first day’s fighting and sends two captured
    horses by a squire to the Damsels of the Tent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At evensong the knights withdraw, and the Knight of the Golden Arms and the
    Knight of the Red Arms are judged to have done best; a dwarf brings the same report
    to the damsels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Arthur and Gawain return to the damsels’ tent, are disarmed, clothed in rich
    robes, served food and wine, seated beside the damsels, and sleep until morning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The younger damsel greets Arthur in the morning and asks him to bear white
    arms that day and do no worse than he did the previous day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder damsel reminds Gawain of a king whose land was surrounded by a stone
    wall and of the covenant by which that king yielded to him the sword with which
    John Baptist was beheaded.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The elder damsel asks Gawain to prove his loyalty by doing worst of all the
    knights that day and by wearing only his own arms so that he will be recognized;
    she threatens to tell the king if he breaks the promise.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gawain says he has never broken a covenant he could fulfill, and he arms himself
    in his own arms despite the loss of worship that will follow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the second day Arthur overthrows two knights, while Gawain rides between
    two companies so that spectators identify him as Arthur’s nephew.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Nabigant of the Rock charges Gawain, Gawain throws his shield to the
