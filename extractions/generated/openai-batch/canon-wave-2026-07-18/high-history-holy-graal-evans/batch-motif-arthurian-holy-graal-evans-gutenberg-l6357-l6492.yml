canonical_text:
  quote: '"on New Year''s Day behoveth him to be crowned in the midst of the fire"'
  summary: Lancelot rides through strange lands to a city whose people greet him joyfully
    and ask him to accept kingship because an unquenchable fire began when their king
    died and will cease only when a new king is crowned in the fire. Lancelot refuses;
    a dwarf arriving with a fair dame volunteers and is crowned. Lancelot leaves,
    reaches a new hermitage, and speaks with a young hermit about a healed knight
    and King Pelles.
  language: English
