canonical_text:
  quote: ''
  summary: A wounded knight tells Messire Gawain that Marin the Jealous attacked him
    while he was trying to bury a damsel and left the body to wild beasts. Gawain
    then reaches the castle of the Proud Maiden, where no one asks a knight’s name.
    The lady shows him a rich chapel with four tombs, three jeweled wall openings,
    candles, and coffers of hallows. She says the tombs are for Gawain, Lancelot,
    Perceval, and herself, demonstrates a hidden blade meant to behead the three knights
    when they bow to adore the hallows, and explains that she plans to entomb them
    so that they may keep her company after her death. Gawain is honored as an unknown
    guest while the lady’s men have orders to bring any of the three named knights
    to her.
  language: English
  quote_policy: summarized
