canonical_text:
  quote: ''
  summary: Perceval leaves a hermitage carrying a banner, with a white mule following,
    and travels toward the former land of King Fisherman. In the forest he meets a
    hermit who stops after seeing the cross on Perceval's shield. The hermit says
    Christians are being driven from the forest by the King of Castle Mortal, who
    has renounced God and His Mother. Perceval responds that God will lead them onward.
    The hermit says twelve other hermits wait at a cross and intend to go to Logres
    for penance, abandoning their cells and chapels because the king has seized the
    land and will not allow believers to remain.
  language: English
