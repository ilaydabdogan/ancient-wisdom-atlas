canonical_text:
  quote: ''
  summary: Perceval reaches the Raving Castle, is warned by a chained Christian gatekeeper
    and by a damsel that three brother-knights inside go mad at the sight of a Christian
    knight. Perceval enters with the cross on his shield; the brothers rave, are prevented
    from attacking him, fight each other, and die. Perceval has their bodies cast
    into running water, kills other residents unwilling to believe, frees the chained
    Christian, and is later desired by the damsel, who asks him to renounce his faith
    for love of her after he urges her to renounce hers.
  language: English
  quote_policy: summarized
