canonical_text:
  quote: ''
  summary: An unnamed damsel prays in a chapel for divine aid for herself and her
    dispossessed mother, invokes Joseph of Abarimacie, and requests the holy cloth.
    The cloth descends over the altar and she receives a portion. During the night
    evil spirits fight outside, a midnight Voice announces the Fisher King's death,
    the loss of the Holy Graal's appearances after the King of Castle Mortal seized
    the castle, and says only the damsel's brother can succour her. The dead in the
    church-yard lament, the spirits depart, and the damsel leaves at dawn, rides toward
    her mother's castle in the Valley of Camelot, and sees Perceval beneath a tree
    near the castle.
  language: English
  quote_policy: summarized
