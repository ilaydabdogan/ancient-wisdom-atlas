canonical_text:
  quote: ''
  summary: Clamados of the Shadows comes to Arthur's court seeking knighthood so that
    he may avenge his father on the knight destined to bear a shield on Arthur's column.
    Gawain objects because the absent knight is exceptionally honored, while Guenievre
    argues Arthur should grant the request. Arthur knights Clamados, who later leaves
    court, rides through forests, and encounters three damsels near a tree before
    a pass between two mountains. The damsels ask for convoy through a lion-haunted
    pass. Clamados recognizes the Damsel of the Car, learns that she also seeks the
    shield-bearing knight, and enters the lion's field, where a lion at a gateway
    charges toward them.
  language: English
  quote_policy: summarized
