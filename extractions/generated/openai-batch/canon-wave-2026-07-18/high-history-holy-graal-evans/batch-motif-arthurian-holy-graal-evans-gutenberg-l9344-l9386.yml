canonical_text:
  quote: ''
  summary: The Lord of the Moors asks the Lady to release him in exchange for yielding
    her castle. Perceval refuses mercy, invokes divine law against man-slayers and
    traitors, executes eleven knights into a vat, and drowns the Lord of the Moors
    in their blood. The bodies are cast into a charnel, the blood into a river, and
    the surrounding castles submit to Perceval, restoring lands and allegiance to
    his mother. The Lady’s joy is limited by grief for her dead brother, King Fisherman.
  language: English
  quote_policy: summarized
