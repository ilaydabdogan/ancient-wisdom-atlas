  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The vavasour carried the child to a distant homestead and delivered him to
    a man and his wife, instructing them to keep and nurture him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The foster carers nurtured the child until he was grown, then took him to
