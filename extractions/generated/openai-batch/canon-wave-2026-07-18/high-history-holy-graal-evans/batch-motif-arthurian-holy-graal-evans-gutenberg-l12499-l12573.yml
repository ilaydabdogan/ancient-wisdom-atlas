canonical_text:
  quote: ''
  summary: King Arthur and Messire Gawain leave Perceval and lodge in an old forest
    castle inhabited only by a priest and clerk. In the chapel, the priest explains
    painted images as a true history of Gawain's hidden birth there, his threatened
    abandonment, his rescue by the loyal vavasour Gawain, his fosterage, recognition
    through sealed letters, refusal of imperial office, and inheritance of the castle.
    Present-day Gawain is ashamed, while Arthur and the priest affirm his honour and
    lawful birth.
  language: English
  quote_policy: summarized
