canonical_text:
  quote: ''
  summary: Gawain sees Perceval carried farther away in a ship while defending himself,
    laments that he cannot aid him, and rides on with Meliot. They meet a knight from
    Arthur's court, who reports that Arthur has favored Briant of the Isles, imprisoned
    Lancelot despite Lancelot's victories, and placed Briant in high authority though
    Briant is betraying him. Gawain condemns a king who trusts a traitor over good
    knights and grieves over Lancelot's imprisonment.
