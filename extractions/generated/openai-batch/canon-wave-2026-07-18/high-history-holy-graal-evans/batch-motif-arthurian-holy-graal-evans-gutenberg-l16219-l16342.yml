canonical_text:
  quote: ''
  summary: Perceval’s ship is guided to an island with an impoverished ancient castle.
    A poorly clad gentlewoman and her two daughters receive him and explain that a
    cruel knight, Gohaz of the Castle of the Whale, has taken their lands, imprisoned
    her son Galobruns, and threatens to seize one daughter or the remaining castle.
    Perceval recognizes them as kin, promises aid, and rows to a rock where he climbs
    to a cave-like chamber and finds a comely knight chained there.
  language: English
