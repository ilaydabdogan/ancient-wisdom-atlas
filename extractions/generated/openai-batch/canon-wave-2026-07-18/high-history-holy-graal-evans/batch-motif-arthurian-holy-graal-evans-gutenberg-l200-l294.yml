canonical_text:
  quote: ''
  summary: The passage discusses textual transmission of The High History of the Holy
    Graal, including Welsh supplements and alternate names. It quotes a passage from
    the History of Fulke Fitz-Warine in which Merlin prophesies a Wolf from the White
    Launde with twelve teeth who drives out a Leopard; the quotation also recalls
    Kahuz dreaming of stealing a candlestick and being wounded by a knife, then waking
    to find the knife in his side. The editor uses this citation and later references
    to argue that the present work was known as The Graal, the Book of the Holy Vessel,
    and distinguishes it from other Grail romances such as Chrestien's Perceval.
  language: English
  quote_policy: summarized
