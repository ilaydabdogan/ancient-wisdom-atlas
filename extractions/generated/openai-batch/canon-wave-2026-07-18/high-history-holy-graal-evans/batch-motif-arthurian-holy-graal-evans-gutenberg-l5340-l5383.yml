canonical_text:
  quote: ''
  summary: An unnamed knight, saying he is repentant and purified by confession, asks
    Lancelot to behead him with an axe. Before the act, he requires Lancelot to swear
    toward a minster and upon its holy relics that he will return within a year and
    place his own head in the same peril. Lancelot swears, reluctantly beheads the
    knight, then sees that the head and body have vanished. From the city he hears
    knights and ladies cry that he will be avenged at the appointed term or before,
    and Lancelot leaves the city.
  language: English
  quote_policy: summarized
