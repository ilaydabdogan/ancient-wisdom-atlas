  summary: Lancelot looks from the hall windows over a populous city. Clerks and priests
    process while praising God because they can return to their church, and they bless
    the knight through whom they have been freed. Lancelot is honored in the city,
    waited upon by two damsels, and shown worship by clergy and others present or
    arriving.
