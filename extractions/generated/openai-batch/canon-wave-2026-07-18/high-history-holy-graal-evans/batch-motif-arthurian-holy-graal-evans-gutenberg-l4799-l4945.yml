canonical_text:
  quote: ''
  summary: The narrative turns from Gawain to Lancelot. In a forest Lancelot meets
    a knight bearing a green shield, who is seeking his twin brother Gladoens. Lancelot
    reveals that Gladoens has died while helping him, offers reciprocal service to
    the grieving brother, and accompanies him toward the land of the Moors and Gladoens's
    castle, which has been taken by an enemy. Near the castle they encounter a squire
    carrying a dead wild boar and learn that the hostile lord is approaching armed.
  language: English
  quote_policy: summarized
