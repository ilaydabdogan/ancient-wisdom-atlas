  summary: Lancelot confirms that the King and Messire Gawain are alive. The hearers
    rejoice and report that Briant of the Isles has defeated them and that Kay the
    Seneschal is aiding him against them. Lancelot says Kay should refrain from harming
    them and recalls that Kay left the field wounded by Lancelot’s spear when Lancelot
    rescued Messire Ywain.
