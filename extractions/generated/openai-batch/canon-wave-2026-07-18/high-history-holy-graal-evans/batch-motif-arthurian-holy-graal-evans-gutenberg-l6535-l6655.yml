canonical_text:
  quote: ''
  summary: At a hermitage, robber-knights try to steal Lancelot's horse and arms but
    are captured by the hermit and his squire; Lancelot later has them hanged. Continuing
    his journey, Lancelot encounters a river boat with knights, damsels, a reclining
    knight, and a fishing knight, and learns of King Fisherman's castle beyond a mountain.
    Before approaching the high hostel where the Holy Graal appears, he confesses
    to a hermit but refuses to repent his love for the Queen; the hermit condemns
    this as mortal sin.
  language: English
  quote_policy: summarized
