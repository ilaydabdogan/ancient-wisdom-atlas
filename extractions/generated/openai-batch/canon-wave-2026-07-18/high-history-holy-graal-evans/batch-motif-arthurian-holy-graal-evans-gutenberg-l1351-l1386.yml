  quote: ''
  summary: After the Voice falls silent, King Arthur returns to Cardoil and is joyfully
    received by the Queen and knights. He shows the Queen his healing arm wound, is
    robed in silk and ermine, and discusses suffering, honour, reproach, and moral
    amendment. He reports that a Voice in the forest told him God commanded him to
    hold court, where a great adventure will occur. The Queen urges him to fulfill
    the commandment, and Arthur agrees.
