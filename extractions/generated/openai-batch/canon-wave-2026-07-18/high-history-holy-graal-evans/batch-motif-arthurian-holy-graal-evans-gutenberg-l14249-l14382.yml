canonical_text:
  quote: ''
  summary: Lancelot is told that the serpent-head errand was a pretext to draw him
    back to the damsel of the Castle of Griffons. After refusing her and leaving,
    he reaches Castle Perilous with a dead knight's sword and winding-sheet. These
    objects are used to heal Meliot of Logres. The lady at Castle Perilous renounces
    her former grievance against Lancelot after his service.
  language: English
  quote_policy: summarized
