canonical_text:
  quote: ''
  summary: Lancelot leaves the Waste City, meets Meliot of Logres in a forest, and
    hears that Meliot is seeking Gawain despite rumors of Gawain's cowardice. Lancelot
    and Meliot arrive at the Waste Manor as King Arthur and Gawain are being blocked
    by seven armed knights, and they help clear the passage. A damsel accuses Lancelot
    of having killed a squire's brother and announces vengeance. Meliot then asks
    Gawain to uphold his feudal claim against Nabigant of the Rock, reminding him
    of their covenant. Gawain goes to Nabigant's land, kills Nabigant in combat, compels
    the castle knights to do homage to Meliot and surrender the keys, then departs
    after Arthur and overtakes a damsel in the forest.
  language: English
  quote_policy: summarized
