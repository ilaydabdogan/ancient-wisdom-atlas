  summary: Lancelot seeks Perceval and Gawain, visits Joseus at the hermitage, sees
    Perceval's shield, receives warning about robber-kindred, learns of the Castle
    of the Golden Circlet and its relic, meets a damsel carrying a dead knight who
    names Perceval as the rightful avenger, and is then spied on by a dwarf connected
    to robber-knights preparing revenge.
