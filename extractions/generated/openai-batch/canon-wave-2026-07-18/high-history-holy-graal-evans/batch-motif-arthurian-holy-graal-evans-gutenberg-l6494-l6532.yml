canonical_text:
  quote: '"Right close are we akin, I and you."'
  summary: Lancelot and the hermit Joseus exchange names and learn they are close
    kin. Lancelot notices weapons in the hermit's house. Joseus explains that the
    lonely hermitage is defended against robbers by himself and his hardy squire,
    while denying that he wounds or slays anyone. Lancelot and the squire praise Joseus's
    strength, and Lancelot is lodged for the night.
