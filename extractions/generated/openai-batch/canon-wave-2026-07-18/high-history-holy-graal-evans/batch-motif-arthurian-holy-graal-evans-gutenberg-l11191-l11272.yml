canonical_text:
  quote: ''
  summary: Arthur, Gawain, and Lancelot are beset in a forest manor by demonic knightly
    routs using fire. A damsel warns Lancelot not to leave a circle. The attackers
    are fought off, and some become ashes and black raven-shaped devils. A second,
    stronger rout withdraws when a clear bell sounds. The damsel says the sound has
    saved her nightly and that she has completed her penance. Josephus notes the unusual
    presence of a bell in Britain at that time. Hermits plan to bury the dead in a
    chapel and establish holy service there to end the haunting. Arthur continues
    on pilgrimage, hears a single bell every hour, conceals his royal name, and reaches
    a fair hold where a damsel recognizes Lancelot.
  language: English
  quote_policy: summarized
