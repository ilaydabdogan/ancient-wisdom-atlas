canonical_text:
  quote: ''
  summary: King Arthur and Gawain visit Avalon, where the Queen and the head of Arthur's
    son lie in coffins, then return to Cardoil through a war-wasted land. Arthur's
    return brings joy because many thought him dead; Kay flees overseas to Chinon.
    At Cardoil the diminished court gathers. An armed messenger from Madeglant of
    Oriande demands the Table Round on kinship grounds after the Queen's death, challenges
    Arthur over the New Law, and offers aid if Arthur renounces his belief and marries
    Queen Jandree. Arthur consults his knights, and Gawain advises defensive measures.
  language: English
  quote_policy: summarized
