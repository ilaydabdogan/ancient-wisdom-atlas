canonical_text:
  quote: ''
  summary: A knight says he cannot leave the castle until it is replenished and his
    land is restored through the Good Knight's valor. Gawain leaves, follows a blood
    trail through the forest, and finds Lancelot in combat with opposing knights.
    Gawain intervenes; some opponents are killed and one escapes. Gawain and Lancelot
    then take the horses of the dead knights back to the Poor Knight and two damsels,
    making the host rejoice at his restored wealth.
  language: English
