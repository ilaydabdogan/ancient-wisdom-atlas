canonical_text:
  quote: ''
  summary: At a tournament assembly, Messire Gawain avoids combat and stays close
    to King Arthur, bringing public shame and accusations of cowardice. A dwarf ridicules
    him and Arthur; the hostelry knights debate the Circlet of Gold because the golden-
    and red-armored champions are absent. Arthur says Gawain has counterfeited a bad
    knight for the damsel’s sake. Gawain accepts that he must obey her, and the next
    morning she commands him to wear rich golden arms and conceal his name, while
    the younger damsel commands Arthur to wear red arms.
  language: English
  quote_policy: summarized
