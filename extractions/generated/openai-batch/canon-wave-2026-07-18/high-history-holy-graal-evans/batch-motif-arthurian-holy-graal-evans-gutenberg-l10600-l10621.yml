canonical_text:
  quote: ''
  summary: Perceval, armed on horseback, is blessed by hermits and commended to God
    before attacking knights guarding bridges. He defeats the three knights at the
    first bridge and throws them into the river. At the second bridge, Joseus asks
    whether helping him would be sinful; the hermits say it would be a work of mercy
    to destroy the enemies of Our Lord. Joseus helps by hurling one opponent into
    the river, and Perceval kills the other two and throws them into the river as
    well.
