canonical_text:
  quote: ''
  summary: A messenger warns Lancelot that armed knights will block the castle gate
    and says the lady has provided a hidden cavern route to the forest. The cavern
    contains a lion and two serpent-griffons. The lady sends a brachet to distract
    the griffons, while Lancelot must face the lion by courage and God’s aid. Lancelot
    reluctantly follows the plan, passes the griffons when they seize the brachet,
    and kills the lion near the cavern exit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The messenger says the lord will station twelve armed knights at the gate
    issue and another twelve outside, and intends to cut off Lancelot’s head where
    other knights’ heads were cut off.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lady sends word that a cavern under the castle leads underground as far
    as the forest, with an exit near an orchard and a broad river.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cavern is said to contain a fierce lion and two beasts called serpent-griffons,
    described with human faces, birds’ beaks, owls’ eyes, dogs’ teeth, asses’ ears,
    lions’ feet, and serpents’ tails.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lady sends a brachet and instructs Lancelot to show and cast it before
    the griffons because they love it and will play with it instead of harming him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The messenger says no protection against the lion is available except God
    and Lancelot’s own courage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lancelot says he would rather risk fighting the knights than wild beasts,
    but he agrees to do the damsel’s command.
  category: speech
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:7
  text: At daybreak Lancelot arms himself with sword, shield, and spear, enters the
    cavern, and the brachet follows after him rather than being carried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The griffons rise, writhe like serpents, cast fire that lights the cavern,
    see the brachet, carry it in their claws, and let Lancelot pass.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Near the cavern issue, a famished lion attacks Lancelot; Lancelot cuts off
    its thigh and leg, then thrusts his sword into its gullet, and the lion dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The damsel comes into the cavern and hears that the lion is dead.
  category: action
  evidence_refs:
  - ev:6
