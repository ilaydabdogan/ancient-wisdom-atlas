canonical_text:
  quote: ''
  summary: Perceval leaves a hermitage, kills two hostile knights, gives their horses
    to the hermit for future use by needy knights, receives news from a messenger
    about the Damsel of the Car and about another damsel being beaten and threatened
    with the Serpent's pit, then rides toward the captive damsel. The damsel recognizes
    Perceval and asks for mercy; her captor recognizes Perceval's horse as that of
    the Red Knight of the Deep Forest and declares Perceval his mortal enemy.
  language: English
  quote_policy: summarized
