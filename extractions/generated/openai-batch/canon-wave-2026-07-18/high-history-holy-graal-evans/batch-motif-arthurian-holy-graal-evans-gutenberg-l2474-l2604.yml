canonical_text:
  quote: ''
  summary: Messire Gawain rides on a holy errand toward the land of the rich King
    Fisherman, enters a forest, and comes to a water-encircled hold. A dwarf welcomes
    him and announces him to the young lady of the hold, whose absent husband hates
    Gawain and has warned her against him. The lady receives Gawain hospitably. Gawain
    notices her beauty but restrains his thoughts because of his pilgrimage. After
    Gawain sleeps, the dwarf rows by river to the jealous knight and falsely claims
    that Gawain and the lady are together in bed and that Gawain may carry her away.
  language: English
  quote_policy: summarized
