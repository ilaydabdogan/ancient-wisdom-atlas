    the Graal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gawain sees three drops of blood fall upon the table and is abashed and silent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Gawain wishes to kiss the three drops of blood, they vanish, and he cannot
