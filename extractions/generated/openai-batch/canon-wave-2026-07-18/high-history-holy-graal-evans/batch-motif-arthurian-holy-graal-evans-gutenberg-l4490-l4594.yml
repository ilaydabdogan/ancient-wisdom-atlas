  text: The meal includes venison, wild-boar flesh, silver vessels, gold cups, and
    burning candles whose brightness is overshadowed by a greater light within.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two damsels issue from a chapel; one carries the Holy Graal and the other
