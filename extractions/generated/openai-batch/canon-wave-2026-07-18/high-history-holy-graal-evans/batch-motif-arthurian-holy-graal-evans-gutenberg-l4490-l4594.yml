candidate_motifs:
- id: motif:1
  label: Graal procession with bleeding lance
  taxonomy_refs:
  - mystical_quest
  basis: Two damsels carry the Holy Graal and a Lance bleeding into it through the
    hall, producing holy fragrance and visionary perceptions in Gawain.
  evidence_refs:
