canonical_text:
  quote: ''
  summary: Messire Gawain is hosted in a hall by twelve ancient knights. During the
    meal two damsels carry the Holy Graal and a bleeding Lance through the hall, and
    Gawain sees successive visions involving a chalice, angels, a child, drops of
    blood, and a crowned King nailed on a rood. Gawain remains silent despite reminders
    and warnings. After the Graal and Lance are returned to the chapel, he is left
    alone, loses at a chess game against gold pieces, and sleeps. In the morning he
    is barred from the chapel service; a damsel explains that he lost entry through
    failure to speak a small word. A voice then warns him to leave while the bridges
    are lowered and the gate is open.
  language: English
  quote_policy: summarized
