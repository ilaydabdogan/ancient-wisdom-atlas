- id: motif:2
  label: Vision of sacred blood, child, and suffering crowned King
  taxonomy_refs:
  - sacrifice
  basis: Gawain sees three blood drops, a child in the Graal, and a crowned King nailed
    on a rood with a spear in his side, and focuses on the King's pain.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The child and the suffering King appear as Gawain's perceptions; the passage
    does not explain their doctrinal meaning.
- id: motif:3
  label: Failure to speak the needed word
  taxonomy_refs:
  - initiation
  - mystical_quest
  - wisdom
  basis: The Master repeatedly prompts or warns Gawain, Gawain remains silent, and
    the damsel later says he lost chapel entry and the castle's joy because of a small
    word.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:8
  confidence: high
  cautions: The exact required word is not stated in the supplied passage.
- id: motif:4
  label: Supernatural or adversarial chess game
  taxonomy_refs:
  - initiation
  basis: After the sacred procession, Gawain is left alone and plays against the gold
    chess pieces, which mate him twice; he then sweeps the pieces from the board.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly call the chess game a test, so the initiation
