- id: motif:5
  label: Sacred threshold and barred chapel access
  taxonomy_refs:
  - initiation
  - departure
  basis: Gawain is shut behind bolted doors, cannot enter or hear the chapel service,
    is told the chapel's relics make it inaccessible at certain times, and later receives
    a warning to depart while the gate is open.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The threshold pattern is inferred from the sequence of blocked and opened
    access rather than named by the passage.
