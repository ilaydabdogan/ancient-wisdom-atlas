canonical_text:
  quote: ''
  summary: Perceval tells his hermit uncle of his battle with a devil-knight whose
    shield bore a fiery dragon, and of the Turning Castle with copper archers and
    chained beasts. The hermit interprets these events as victories over the Devil
    and false belief, then charges Perceval to restore the land of King Fisherman,
    whose castle has been seized and fortified. He describes nine bridges guarded
    by twenty-seven knights, the empty Grail chapel, and gives Perceval an old white
    mule and a banner whose divine power will overcome enemies when Perceval cannot
    prevail by knighthood alone.
  language: English
  quote_policy: summarized
