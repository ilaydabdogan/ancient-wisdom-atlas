canonical_text:
  quote: "“So soon as he touched it, the sword draweth it forth with such a wrench
    that the column quaked thereof.”"
  summary: Lancelot is hosted at a castle, admired by the lord’s daughter, and accused
    by another damsel as the lord’s brother-slayer. The lord requires him to request
    the daughter and fulfill a custom by drawing a sword from a gold-inlaid column.
    Lancelot succeeds, but the lord refuses the covenant because Lancelot is his mortal
    enemy, guards the gateway, and plans to behead him. The daughter sends a private
    warning telling Lancelot to arm himself.
  language: English
  quote_policy: quoted
