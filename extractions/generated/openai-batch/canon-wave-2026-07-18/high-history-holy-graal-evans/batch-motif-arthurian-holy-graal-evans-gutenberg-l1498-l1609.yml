canonical_text:
  quote: ''
  summary: A bald damsel at Arthur's court explains that a knight failed to ask the
    required question when the Holy Graal appeared at King Fisherman's hostel, bringing
    languishment, war, and visible losses. She displays her bald head, describes a
    rich car drawn by three white harts and filled with severed heads, and has a shield
    and brachet left at court. Kay inspects the car and speaks crudely about the harts,
    and Arthur rebukes him. The three damsels depart into the forest, where they meet
    a worn-looking knight who reveals himself as Gawain and says he is going to King
    Fisherman's land.
  language: English
  quote_policy: summarized
