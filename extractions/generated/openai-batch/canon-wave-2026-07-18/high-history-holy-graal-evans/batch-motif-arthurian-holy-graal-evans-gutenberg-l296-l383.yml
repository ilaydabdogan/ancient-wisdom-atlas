  summary: Introductory critical passage citing Helinand's Chronicle as testimony
    for the Book of the Graal. The quoted chronicle reports an angelic vision to a
    hermit in Britain concerning S. Joseph and the dish or paten used by Our Lord
    with his disciples, explains the term graal/gradalis as a platter, and notes French-only
    manuscript circulation. The passage then argues for dating Helinand's Chronicle,
    using Vincent of Beauvais and Guarin of Senlis, to establish approximate limits
    for the Book of the Graal.
