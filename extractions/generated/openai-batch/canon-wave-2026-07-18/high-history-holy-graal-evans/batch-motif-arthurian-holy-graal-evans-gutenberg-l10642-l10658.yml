  summary: Perceval mounts a white mule marked with a red cross, takes a banner, and
    holds a drawn sword. A white lion sees him, frees itself, runs to a lifted bridge,
    and lowers it among the knights. The King of Castle Mortal, speaking from the
    battlements, rebukes the bridge-warding knights as cowardly and praises the lion
    as hardier than they are.
