canonical_text:
  quote: ''
  summary: Lancelot leaves the Castle of the Griffons, refuses the love of the castle
    damsel because of his fidelity to the Queen, and rides into the forest. The castle
    lord searches for him; two knights sent into the cavern are slain and devoured
    by griffons. Lancelot later reaches a valley and climbs toward a rich mountain
    chapel at Avalon, where hermits receive him. Inside are two coffins with tapers
    and psalm-chanting clerks; a hermit says the coffins were made for King Arthur
    and Queen Guenievre, though Lancelot says Arthur is not yet dead.
  language: English
  quote_policy: summarized
