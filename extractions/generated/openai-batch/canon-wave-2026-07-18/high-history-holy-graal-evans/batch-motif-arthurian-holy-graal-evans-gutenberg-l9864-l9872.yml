  summary: Perceval asks a damsel where the Knight of the Dragon is. She says he is
    in the Isles of the Elephants, a formerly fair and rich land that he has made
    desolate, on an island opposite the castle of the Damsel of the Golden Circlet.
    The Damsel of the Golden Circlet sees him daily carry off knights from the forest,
    kill them, and cut them limb from limb, causing her grief.
