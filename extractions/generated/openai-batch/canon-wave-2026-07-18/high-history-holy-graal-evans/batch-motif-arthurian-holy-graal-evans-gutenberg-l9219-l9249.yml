canonical_text:
  quote: ''
  summary: The Lord of the Moors kills a knight, whose body is brought to Camelot
    before the Widow Lady and her son. The Widow Lady tells Perceval that the Lord
    of the Moors has long harmed her land and that Perceval was named in baptism to
    remember and retrieve the wrong done to his father and to him. After the knight
    is shrouded, given mass, and buried, Perceval arms two old knights, rides into
    the dark forest, meets five armed men of the Lord of the Moors who are seeking
    him, and identifies himself.
  language: English
  quote_policy: summarized
