canonical_text:
  quote: ''
  summary: Arthur, newly moved to seek honour and largesse, summons a court at Pannenoisance.
    At the feast three damsels enter the hall. The first, a richly adorned but bald
    mounted damsel carrying a crowned king's head, says she cannot dismount among
    knights until the Graal is achieved. She presents a shield once belonging to Joseph,
    instructing Arthur to hang it on a central column for the one knight who may take
    it and by it achieve the Graal. A brachet is also left to await that knight. The
    damsel then reports that the Fisher King, described as righteous and loyal, has
    fallen into grievous languishment.
  language: English
  quote_policy: summarized
