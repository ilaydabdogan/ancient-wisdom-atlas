canonical_text:
  quote: ''
  summary: Gawain tells Perceval that Perceval's sister petitioned King Arthur for
    aid from the knight who bore away a shield, and that Arthur sent Gawain and Lancelot
    to find him. Gawain also reports Perceval's widowed mother's losses and need for
    help. Perceval promises to succor her and acknowledges his obligation. A hermit
    confirms the duty to honor parents. Joseus gives news that Lancelot had recently
    been at the hermitage and is endangered by robber kinsfolk. Perceval and Gawain
    resolve to seek Lancelot, depart armed through the forest, and meet a frightened
    knight who reports robbers, an unnamed beset knight, a slain treacherous damsel,
    and a dwarf accomplice.
  language: English
  quote_policy: summarized
