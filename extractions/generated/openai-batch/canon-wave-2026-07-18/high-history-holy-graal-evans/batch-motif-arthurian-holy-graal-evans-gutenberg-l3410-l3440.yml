  summary: Messire Gawain exchanges mounts with a burgess, takes leave, and rides
    into a great forest until sundown. In a broad meadow he finds an ornate white
    and red tent with silk, ivory, gold, and golden eagles. He leaves his horse, spear,
    and shield outside, enters, observes a richly furnished couch, paired seats, candles,
    and a set table with vessels, then sits armed on the couch and wonders why the
    tent is richly prepared but empty.
