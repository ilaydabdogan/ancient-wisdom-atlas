canonical_text:
  quote: ''
  summary: Orguelleux of the Launde arrives after a long absence from court and addresses
    Briant. He rebukes speech against the absent Lancelot, praises Lancelot's service
    and reputation, warns that Arthur should not be turned against his knights, and
    says that if Claudas wars on Arthur for Lancelot's sake, Arthur still has many
    unmatched knights unless treason harms him.
