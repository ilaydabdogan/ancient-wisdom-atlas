canonical_text:
  quote: A man is not good by his name, but by his heart.
  summary: A damsel tells Arthur about a young squire who learned of knighthood, killed
    a Red Knight while hunting, was knighted by Arthur, and became known as the Best
    Knight. She seeks him with news that his father is dead and his mother is under
    attack. The damsel then learns the king's name is Arthur and denounces Arthur's
    court and reputation. Arthur rides toward Cardoil and hears a forest Voice saying
    God commands him to hold court so the worsened world may be amended.
  language: English
  quote_policy: quoted
