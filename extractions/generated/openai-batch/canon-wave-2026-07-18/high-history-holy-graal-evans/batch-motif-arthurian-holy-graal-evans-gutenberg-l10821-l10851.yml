  quote: The Graal was restored in the holy chapel, and the other hallows as you have
    heard.
  summary: 'After the conquest of the castle, divine favor is shown to the place:
    the Graal and other hallows return to the chapel, Perceval secures the land and
    restores the New Law, and King Fisherman’s tomb is miraculously adorned and lit
    at night.'
