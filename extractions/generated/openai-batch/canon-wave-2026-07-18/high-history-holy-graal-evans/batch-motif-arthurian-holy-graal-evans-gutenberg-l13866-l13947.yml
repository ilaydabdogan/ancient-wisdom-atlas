canonical_text:
  quote: ''
  summary: A damsel is received at Arthur's court and asks the King to hasten her
    errand. Several knights defer the attempt to Lancelot. After being urged by the
    damsel and commanded by Arthur, Lancelot draws a quarrel fixed in a column and
    gives it to the damsel. She states that only he could have done this and, under
    Arthur's covenant, assigns him a quest to the Chapel Perilous, the Castle Perilous,
    and a cavern with griffons, so that a sick knight may be healed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lucan the Butler takes the damsel in his arms, sets her on the ground, and
    her mule is led away to be stabled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After washing, the damsel is seated beside Messire Ywain, who shows her honor,
    serves her, and looks at her because she is described as fair, gentle, and of
    good countenance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the meal, the damsel asks the King to hasten her business.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The damsel says that many good knights are present and that only one knight
    can achieve the business of drawing the quarrel forth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The King asks Messire Ywain to set his hand to the quarrel and give it back
    to the damsel.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Messire Ywain refuses to put himself forward before Lancelot and the other
    knights, asking to be excused.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sagramors and Orguelleux of the Launde say they will act after Lancelot has
    made assay, but not before him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The damsel asks Lancelot, by the thing he loves most, to set his hand to the
    quarrel so her errand will not be bootless.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lancelot resists the request because many good knights are present and he
    fears being judged a fool and braggart if he goes before them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The King requires Lancelot, by the faith he owes him, to attempt the quarrel
    before the others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Lancelot remembers that the damsel conjured him by the thing he loves most,
    and the passage states that he loves the dead Queen more than anything.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Lancelot stands upright, removes his robe, comes to the quarrel fixed in the
    column, draws it out with a strong wrench that makes the column tremble, and gives
    it to the damsel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The damsel tells King Arthur that no knight present except Lancelot could
    have drawn the quarrel, and she recalls a covenant that the successful knight
    must do what she reasonably requires.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The damsel requires Lancelot to go swiftly to the Chapel Perilous, find a
    shrouded knight in the middle of the chapel, and take the shrouding cloth and
    a sword lying at the knight's side in the coffin to the Castle Perilous.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: After going to the Castle Perilous, Lancelot must return to the castle where
    he slew the lion, go to the cavern with two griffons, take the head of one griffon,
    and bring it to the damsel at Castle Perilous for a sick knight's healing.
  category: sequence
  evidence_refs:
  - ev:8
