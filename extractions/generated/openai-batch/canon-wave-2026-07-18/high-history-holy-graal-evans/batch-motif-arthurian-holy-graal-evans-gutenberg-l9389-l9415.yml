canonical_text:
  quote: ''
  summary: At a meal in the Widow Lady's hall, the Damsel of the Car arrives with
    two other damsels and addresses Perceval. She conveys King Hermit's urgent message
    that Perceval must go to the land formerly belonging to King Fisherman because
    the King of Castle Mortal has seized the land and is promoting the Old Law against
    the New Law. The Widow Lady laments the disloyalty of this kinsman, and Perceval
    rejects him as kin because he denies God.
  language: English
  quote_policy: summarized
