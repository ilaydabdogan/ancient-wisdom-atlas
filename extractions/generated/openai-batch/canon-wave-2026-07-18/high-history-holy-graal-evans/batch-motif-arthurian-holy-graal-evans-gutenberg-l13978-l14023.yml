  summary: Briant of the Isles returns to Cardoil with heavy losses from the campaign
    against Madeglant. Messengers from Albanie ask Arthur to send Lancelot to defend
    the land. Briant advises Arthur to abandon the distant, costly territory, but
    Arthur refuses on grounds of honor and lordship. Briant warns that the people
    of the country value Lancelot above all and may make him king; Arthur expresses
    trust in Lancelot, while Briant predicts that Lancelot’s knighthood may harm Arthur
