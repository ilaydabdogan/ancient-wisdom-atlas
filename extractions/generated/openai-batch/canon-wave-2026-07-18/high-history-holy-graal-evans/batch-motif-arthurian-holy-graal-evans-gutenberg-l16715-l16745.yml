canonical_text:
  quote: ''
  summary: Perceval confronts and defeats the Black Hermit in the hall. The people
    in the castle open a trap-door over a foul pit and cast their fallen lord into
    it, then surrender the castle to Perceval. The Damsel of the Car receives the
    gold-sealed heads of the King and Queen and departs toward the Valleys of Camelot.
    The castle’s former people submit to Perceval, covenant to stop harassing knights
    and instead receive them gladly, and the place is brought to belief in Our Lord
    with daily holy service.
  language: English
  quote_policy: summarized
