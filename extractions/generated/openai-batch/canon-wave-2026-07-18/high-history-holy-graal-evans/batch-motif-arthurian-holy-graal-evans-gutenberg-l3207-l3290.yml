canonical_text:
  quote: ''
  summary: Messire Gawain questions a weeping squire, Joseus, who says he killed his
    queen mother over the succession and now seeks a hermitage and banishment. Joseus
    identifies himself and his kin as belonging to the lineage of Joseph of Abarimacie.
    After Joseus departs, Gawain follows a spring-stream through the forest to an
    enclosed house and chapel, where an aged hermit prevents him from entering because
    a sick knight, called Par-lui-fer and also of Joseph's lineage, is being kept
    quiet lest he arm himself and joust.
  language: English
  quote_policy: summarized
