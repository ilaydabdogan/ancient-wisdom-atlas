canonical_text:
  quote: ''
  summary: King Arthur remains at Cardoil, promotes worship by ordering chalices and
    bells made after patterns brought from the Grail castle, then rides out against
    Briant and Meliant. In battle Lancelot wounds Meliant mortally after both exchange
    severe spear and sword blows. Arthur is pressed by Briant's men until Ywain, Lucan,
    and Sagramors break through; Sagramors unhorses Briant, and Arthur forbids killing
    him. Arthur brings Briant to Cardoil, heals and imprisons him until Briant gives
    surety, becomes Arthur's man, and is made seneschal. Arthur's rule is restored,
    while the treachery of Kay remains a grievance for which Arthur desires vengeance.
  language: English
  quote_policy: summarized
