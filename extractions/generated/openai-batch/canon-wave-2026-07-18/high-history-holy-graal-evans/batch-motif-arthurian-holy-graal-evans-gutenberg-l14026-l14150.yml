canonical_text:
  quote: ''
  summary: Lancelot meets a wounded knight from the Chapel Perilous, receives a message
    from a damsel there, and learns that a sword and part of a shroud from the coffin
    of Ahuret the Bastard are needed to heal Meliot of Logres. Lancelot enters the
    haunted chapel and graveyard, prays, opens the coffin, takes the sword and cloth,
    and is confronted by a damsel who guards the chapel and commands the graveyard's
    earthly fiends. She says he has the right to the objects and invites him to see
    tombs prepared for Lancelot, Perceval, and Gawain.
  language: English
  quote_policy: summarized
