canonical_text:
  quote: ''
  summary: King Arthur and Messire Gawain, while concerned for Lancelot, hear from
    an armed knight that Nabigant of the Rock has taken the Golden Circlet from the
    Queen who held it for the Son of the Widow Lady. The circlet is to be brought
    to a tournament at the Meadow of the Tent of the two damsels and awarded to the
    best-performing knight. Arthur and Gawain lodge in the richly furnished tent where
    Gawain had formerly ended an evil custom. The two damsels arrive, reproach Gawain
    over unreciprocated love and the use of their property, and announce the three-day
    assembly. The younger damsel asks Arthur to be her knight at the tournament; Arthur
    accepts, gives his name as Arthur of Tincardoil, and is not recognized as King
    Arthur. Though he behaves favorably toward the damsel, his thoughts remain on
    Queen Guenievre.
  language: English
  quote_policy: summarized
