canonical_text:
  quote: ''
  summary: Perceval hears a lady explain her sick lord's anger, his desire for a golden
    cup awarded to the best knight, and her continuing loyalty despite mistreatment.
    Perceval reports that the lord's brother has recovered his land and daughter.
    The lady explains that the cup will be awarded at an assembly under the White
    Tower and hopes Lancelot or Gawain might win it for her. The sick knight rejoices
    at the news of his brother but still commands his wife to sit apart. Perceval
    later departs, intending that a knight might win the cup to relieve her. He travels
    toward the castle marked by a chain of gold, enters the Joyless Forest of the
    Black Hermit, and meets the Damsel of the Car, who now has hair after formerly
    being bald.
  language: English
  quote_policy: summarized
