canonical_text:
  quote: ''
  summary: Messire Gawain and five knights enter a tournament assembly. Gawain defeats
    several opponents, including Chaos the Red and the Lord of the Moors, while the
    five knights also overthrow opponents and win horses. The assembled knights acclaim
    the knight of the Red Shield with the gold eagle as best in the tournament, and
    the Lord of the Moors calls Gawain warden of Camelot. Gawain delegates safeguarding
    of Camelot to the five knights. After a dispute over prisoner status and ransom,
    the Lord of the Moors promises that for a year and a day the castle and the Lady's
    land will not need to fear him or anyone he can restrain; Gawain accepts.
  language: English
  quote_policy: summarized
