canonical_text:
  quote: ''
  summary: Messire Gawain passes from a tempest to a crowded Castle of Joy, where
    the inhabitants avoid him and a gate knight says they judge him discomfited and
    slothful because of his passage through the Forest Perilous. Gawain then reaches
    a barren land and poor wasted castle, where a poor knight and two damsels welcome
    him. A wounded knight arrives and reports that Lancelot is fighting four knights
    in the forest; Gawain immediately mounts his horse still armed.
  language: English
  quote_policy: summarized
