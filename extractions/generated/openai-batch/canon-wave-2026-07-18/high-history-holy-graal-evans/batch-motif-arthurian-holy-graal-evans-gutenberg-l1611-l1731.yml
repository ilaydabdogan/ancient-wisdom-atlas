canonical_text:
  quote: ''
  summary: Messire Gawain escorts a damsel through a forest. She explains that a damsel
    walking afoot and her own baldness are penalties that will end if Gawain reaches
    the Fisher King's hostel, sees the Holy Graal, and asks the required question;
    otherwise they must suffer until the Good Knight achieves the Graal. They pass
    from a green forest into a burnt, black, cracked forest and approach the castle
    of the Black Hermit, where black water roars through the castle and prisoners
    lament for the Good Knight. One hundred fifty-two black knights take one hundred
    fifty-two heads from the damsel's car and carry them on spears into the castle.
    The damsel says only the Good Knight can end the mischief and free the prisoners.
    As they pass beyond the castle, a knight with a red shield bearing a golden eagle
    comes out and asks Gawain to wait.
  language: English
  quote_policy: summarized
