canonical_text:
  quote: ''
  summary: Perceval comes with hermits from the forest toward the castle of King Fisherman,
    seeking divine aid and prayers to recover what is rightfully his. A prophecy is
    recalled that the bearer of his shield will win the Graal from the one who sold
    God for money. Near a guarded bridge, Perceval stops at a Camelot-like chapel
    containing an unknown sepulchre. The sepulchre opens at his coming, reveals a
    knight identified by letter as Josephus, and gives forth a sweet savour. The hermits
    declare Perceval the Good Knight, chaste and holy. The bridge defenders are dismayed,
    while the king holding the castle urges them not to fear a single knight.
  language: English
  quote_policy: summarized
