canonical_text:
  quote: ''
  summary: Gawain goes toward an assembly with an exhausted squire and finds King
    Arthur, Lancelot, and many knights gathered. A knight has brought a white destrier
    and a rich gold crown as prizes for the knight who performs best; the winner must
    defend the land of the dead Queen who had worn the crown. Arthur bears a red shield,
    Gawain his own shield, and Lancelot a green shield in memory of a slain helper.
    The three fight strongly, and the assembled knights judge the Knight of the Red
    Shield to have done best. The crown-bearing knight, not recognizing Arthur, offers
    him the crown and horse and explains the duty and uncertainty surrounding the
    land’s king.
  language: English
  quote_policy: summarized
