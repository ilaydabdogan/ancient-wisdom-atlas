canonical_text:
  quote: ''
  summary: Lancelot is ambushed in a hall after finding his sword missing from its
    scabbard. A damsel holds the sword while five knights and a dwarf attack him.
    He kills the master knight with a lance, recovers his sword, and unintentionally
    kills the damsel when she leaps between him and the knights. The dwarf urges the
    surviving knights to avenge her. Lancelot cannot find his horse, concludes the
    dwarf has removed it, kills the dwarf, wounds two knights, and is wounded. With
    only one entrance to the hall, the knights guard the doorway. Lancelot bars the
    door, throws the dead bodies out through the windows, and waits inside with food
    while the knights outside swear to capture or starve him.
  language: English
  quote_policy: summarized
