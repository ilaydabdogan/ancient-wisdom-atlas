canonical_text:
  quote: '"never will I renounce"'
  summary: King Arthur answers a damsel’s message by refusing to renounce the Law
    established by the Saviour’s death and crucifixion, instructing the Lady or Queen
    to believe in God, His Mother, and the New Law. He says no queen will be in his
    land unless she is of worth like Queen Guenievre. The damsel warns of bad tidings,
    returns to the Queen, and reports Arthur’s answer. The Queen says she loves Arthur
    but that he has refused her will, then sends to her brother King Madeglant demanding
    vengeance and Arthur’s imprisonment.
  language: English
