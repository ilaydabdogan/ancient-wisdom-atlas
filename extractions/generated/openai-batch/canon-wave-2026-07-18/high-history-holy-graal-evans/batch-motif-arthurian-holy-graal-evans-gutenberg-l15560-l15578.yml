canonical_text:
  quote: ''
  summary: A lady recounts a vision of the Lord taken down from the cross and placed
    in a stone sepulchre. Moved by pity and tears, she says she received sight, then
    urges belief in this Lord, renunciation of false gods, and punishment for refusal.
    She is baptized, has refusers destroyed or banished, is named Salubre, later lives
    a holy life and dies in a hermitage. Perceval leaves joyfully because the lady
    and her people believe in the New Law.
