canonical_text:
  quote: ''
  summary: Lancelot returns to a ruined city to fulfill a deadly pledge after having
    beheaded a knight there. The slain knight's brother prepares to behead him in
    return. Lancelot accepts the danger, prays, makes devotional gestures, and stretches
    out his neck. Two damsels intervene and compel the executioner to stop. They reveal
    that Lancelot's loyalty has saved their city and lands, whereas many previous
    knights failed to return to keep the same covenant. The city populace rejoices
    at his coming.
  language: English
  quote_policy: summarized
