  summary: The Widow Lady exhorts her son Perceval to uphold the Law of the Saviour
    and to be ready in divine service. She rises from the table with the knights,
    gives thanks, and prays for her son’s long life and amendment of soul and body.
    Perceval remains for a long time with his mother and sister and is honored by
    the knights for wisdom, diligence, and valor.
