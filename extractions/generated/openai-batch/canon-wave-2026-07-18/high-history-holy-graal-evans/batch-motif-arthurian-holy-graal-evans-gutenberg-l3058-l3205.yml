canonical_text:
  quote: ''
  summary: Messire Gawain follows a forest path at evening and is welcomed by a hermit
    at a chapel, manor, and enclosed orchard. In the orchard he sees a child with
    attendants guarding and riding a lion. The hermit explains that the child, Meliot
    of Logres, is the son of Marin the Jealous, who killed Meliot's mother, and that
    Meliot wishes to become Gawain's man. Meliot controls the lion, greets Gawain,
    kneels with joined hands, and offers homage; Gawain accepts and promises counsel
    and aid. The next morning Gawain departs toward the land of King Fisherman, where
    the hermit says another knight has caused sorrow and the king languishes. Gawain
    then reaches fair meadowland near a high forest and meets a downcast squire who
    serves a hidden lord called Parlui but refuses to reveal his exact location.
  language: English
  quote_policy: summarized
