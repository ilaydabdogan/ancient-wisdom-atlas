candidate_motifs:
- id: motif:1
  label: Grail quest toward the Fisher King's afflicted land
  taxonomy_refs:
  - mystical_quest
  basis: The passage identifies itself as a branch of the Graal; Gawain travels toward
    King Fisherman's land, where a previous knight has caused the lands to fall into
    sorrow and the king languishes.
  evidence_refs:
  - ev:1
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage gives only the approach and report of affliction; it does
    not yet narrate Gawain's arrival at King Fisherman's court.
- id: motif:2
  label: Exceptional child who masters a dangerous beast
  taxonomy_refs:
  - miraculous_child
  basis: Meliot is not more than six years old, yet the hermit says only he can master
    the lion, and the narrative shows him riding and confining it.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage does not describe a miraculous birth or divine origin; the
    taxonomy link rests only on the child's extraordinary power and youth.
- id: motif:3
  label: Orphaned or bereaved noble child seeks protection through homage
  taxonomy_refs: []
  basis: Meliot's mother has been slain, he refuses his father, and he offers homage
    to Gawain, who promises succour and counsel.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage presents feudal homage and protection; broader symbolic interpretation
    should be reviewed.
- id: motif:4
  label: Hermit host as guide to lineage and quest danger
  taxonomy_refs: []
  basis: The hermit receives Gawain, explains Meliot's family circumstances, prompts
    the homage scene, and warns Gawain about the sorrow connected to King Fisherman's
    land.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage shows guidance and hospitality, but no explicit formal initiation
    rite.
- id: motif:5
  label: Hidden sorrowful lord served by a loyal retainer
  taxonomy_refs: []
  basis: The downcast squire serves a forest lord called Parlui, says he is alive
    but without joy, and refuses to disclose his exact location against his will.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: medium
  cautions: The cause of Parlui's sorrow and the narrative function of his concealment
    are not given in this passage.
