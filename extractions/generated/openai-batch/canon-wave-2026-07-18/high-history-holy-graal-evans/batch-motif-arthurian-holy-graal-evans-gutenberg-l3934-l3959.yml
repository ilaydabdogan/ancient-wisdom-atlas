canonical_text:
  quote: ''
  summary: The King laments his son, has torches and a great fire made, orders his
    son's body cooked in a water-filled brazen vessel over the fire, and hangs the
    Giant's head at the gate. The son is then cut into small pieces and portions are
    given to the high men of the land. The King gives a sword to Messire Gawain, asks
    to be baptized, is baptized by a forest hermit with the name Archis, and orders
    Gawain to behead those unwilling to believe in God.
  language: English
