  quote: ''
  summary: Perceval speaks with a castle lady who had been blind and hostile to knights
    of the New Law. She permits him into her castle, later appears seeing clearly,
    summons the leading men of her land, and recounts that her former gods could not
    restore her sight and demanded Perceval's death. She then prayed to the Lord of
    the New Law and dreamed of a fair Lady giving birth to a radiant Child.
  language: English
