canonical_text:
  quote: Lancelot slew him in the King's war and upon his land in defence thereof.
  summary: King Arthur remains at Cardoil and summons counsel about whether Lancelot's
    slaying of Meliant exposes Arthur's land to complaint or war. Ywain and Gawain
    defend Lancelot as acting in royal war and defense of the land; Briant advises
    that Lancelot be kept from court for a year to placate hostile kings; Sagramors
    rejects this as a betrayal of a loyal knight.
  language: English
  quote_policy: quoted
