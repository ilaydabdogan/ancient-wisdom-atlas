canonical_text:
  quote: ''
  summary: Messire Gawain questions a fast-moving damsel. She says she is going to
    a great assembly of knights at the Palace Meadow and is seeking the knight who
    won the Circlet of Gold at the Meadow of the Tent. She explains that her Lady,
    who kept the circlet for the son of the Widow Lady, sent her to find him. The
    Lady asks him, for the sake of the Saviour of the World and out of pity for dames
    and damsels, to take vengeance on Nabigant, who has slain her men and destroyed
    her land, because the one who won back the Golden Circlet is said to have the
    right-duty to do so.
  language: English
