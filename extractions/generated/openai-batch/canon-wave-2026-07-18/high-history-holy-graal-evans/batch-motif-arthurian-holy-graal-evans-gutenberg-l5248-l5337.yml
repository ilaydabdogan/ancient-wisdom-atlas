canonical_text:
  quote: ''
  summary: Lancelot sends a horse as a gift to the poor man who had harboured him,
    then leaves the hermitage. He rides through a lifeless parched waste land to a
    ruined and empty city. In an ancient palace he hears knights and ladies mourning
    a knight whose death cannot be postponed. A richly dressed young knight carrying
    an axe appears and tells Lancelot that Lancelot must behead him with the axe or
    be beheaded himself. The knight requires Lancelot to promise to return within
    a year and submit his own head to the same peril.
  language: English
  quote_policy: summarized
