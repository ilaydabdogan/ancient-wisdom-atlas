canonical_text:
  quote: ''
  summary: A sorrowful damsel is at Arthur's court. At night King Arthur sees a candle-like
    light on the calm sea and discovers a ship steered by an old master. Within it
    lies an armed knight on an ivory table with candles. The knight later enters the
    hall, bearing a red shield with a white hart, is greeted by the Queen, exchanges
    shields, and departs quickly by ship with a brachet. Arthur forgets to ask the
    knight about the damsel's business; the damsel leaves to seek him. Lancelot later
    recognizes the left shield and identifies the visiting knight as Perceval.
  language: English
  quote_policy: summarized
