canonical_text:
  quote: ''
  summary: Messire Gawain, mocked as a counterfeit, is forced into combat with two
    knights connected to an evil custom. He defeats and kills the first after the
    elder damsel says the custom cannot end while that knight lives. He then wounds
    the second, hesitates out of pity, and learns from the younger damsel that the
    knight can be killed only by a sword stroke in the sole of the foot. After the
    wounded knight flees, Gawain pursues and kills him in that manner. The damsels
    rejoice, explaining that the knight was of Achilles' kindred and that his ancestors
    could die only so. They offer Gawain service and love, but he refuses to stay
    and enters the forest.
  language: English
  quote_policy: summarized
