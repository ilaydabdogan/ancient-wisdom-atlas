canonical_text:
  quote: ''
  summary: Lancelot keeps vigil in a chapel before a tomb, hears masses for the Queen
    and her son, leaves, and rides toward Cardoil, where he finds desolation. A wounded
    knight reports that Kay the Seneschal is leading Ywain li Aoutres away to the
    Castle of the Hard Rock. Lancelot pursues, fights Kay, wounds him, frees Ywain,
    and escorts the wounded men to Cardoil. Kay returns to Briant of the Isles at
    the Hard Rock, where enemies infer that Arthur and Gawain may be dead. At Cardoil,
    the people mourn Arthur but take comfort in Ywain’s rescue, and Lancelot reports
    that he last parted from Arthur at Palace Meadow.
  language: English
  quote_policy: summarized
