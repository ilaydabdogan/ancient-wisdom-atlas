canonical_text:
  quote: ''
  summary: Lancelot is recalled to Arthur's court after peace in Albanie, while Briant
    and King Claudas contribute to renewed trouble. Madeglant returns with a navy,
    devastates Albanie, and defeats Briant, who only pretends loyalty to Arthur. At
    Arthur's Whitsuntide court in Cardoil, a rich quarrel strikes and embeds in a
    hall column. A beautiful damsel arrives on a costly mule, asks Arthur for a boon,
    and requests that the knight able to draw out the quarrel be sent where there
    is urgent need.
  language: English
  quote_policy: summarized
