canonical_text:
  quote: "“this crown was the crown of Queen Guenievre that is dead and buried”"
  summary: Arthur asks about the land and the queen's crown. An emissary reports that
    the king of the land was named Arthur, that many believe him dead, and that Queen
    Guenievre is dead and buried. Knights at Cardoil sent the emissary with Guenievre's
    crown and a destrier to seek Arthur, Gawain, and Lancelot and tell them of the
    land's sorrow. Arthur, Lancelot, Gawain, and the knights mourn; Arthur holds the
    gold crown and looks at the destrier that he had given Guenievre.
