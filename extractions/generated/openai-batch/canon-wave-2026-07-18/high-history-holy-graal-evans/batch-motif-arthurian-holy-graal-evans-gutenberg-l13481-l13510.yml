canonical_text:
  quote: ''
  summary: A damsel comes to King Arthur at Cardoil with Queen Jandree's message.
    Jandree demands to become lady and queen of Arthur's land, to marry him, and to
    have him renounce the New Law for her gods. The message threatens invasion by
    King Madeglant, who claims the Round Table by right. Jandree refuses to look upon
    believers in the New Law; her gods allow her to uncover her eyes and face while
    remaining sightless. She trusts her brother, who has covenanted to destroy such
    believers, after which she expects her sight to be restored.
  language: English
  quote_policy: summarized
