canonical_text:
  quote: ''
  summary: Arthur, after a night near a chapel, rejoices that a good man's soul has
    been borne to Paradise and finds the coffin covered by a rich tomb-stone with
    a red cross. He rides into a forest laund, where a damsel warns him that the place
    is perilous but that the chapel gives counsel. Arthur reaches S. Augustine's chapel
    and sees the hermit ready for mass, but cannot enter despite the open door. From
    outside he witnesses a liturgical vision involving a crowned Child, a beautiful
    Lady, descending flame, angelic responses, the offering of the Child on the altar,
    and a wounded thorn-crowned man who changes back into the Child.
  language: English
  quote_policy: summarized
