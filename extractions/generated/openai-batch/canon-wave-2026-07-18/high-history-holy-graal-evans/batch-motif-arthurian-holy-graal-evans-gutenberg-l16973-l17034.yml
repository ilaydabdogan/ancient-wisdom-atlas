canonical_text:
  quote: ''
  summary: Perceval sees a ship with a white sail and Red Cross arrive by the sea-facing
    manor. Robed worshipful people pray in the chapel, place several bodies in rich
    coffin-like vessels, and Perceval departs by ship after taking leave. A voice
    commends the departing party to God and God's Mother, and the narrator says no
    earthly person later knew Perceval's fate. Joseus remains secluded in King Fisherman's
    former castle and dies there; the dwelling decays but the chapel remains whole.
    Curious people later fear to enter the place, except two Welsh knights who enter,
    remain long, and emerge as ascetic hermits later called saints. The coda says
    the Holy Graal story ends, grants a benison through Josephus, and locates the
    Latin source in Avalon at a religious house where Arthur and Guinevere lie.
  language: English
  quote_policy: summarized
