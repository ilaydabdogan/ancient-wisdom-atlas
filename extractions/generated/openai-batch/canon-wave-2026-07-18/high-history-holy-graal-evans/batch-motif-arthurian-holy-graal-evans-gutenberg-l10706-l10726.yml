canonical_text:
  quote: ''
  summary: A lion, unable to speak, makes signs to Perceval warning him not to attack
    the defenders of the last bridge with the holy banner or grant them mercy. The
    lion indicates that the enemies can only be conquered by God's will and by himself,
    and directs Perceval to ride the white mule, with Joseus carrying the banner and
    twelve holy hermits going before. Perceval trusts the lion, changes mounts, and
    advances toward the castle; the knights on the last bridge see him, Joseus, and
    the banner approaching.
  language: English
  quote_policy: summarized
