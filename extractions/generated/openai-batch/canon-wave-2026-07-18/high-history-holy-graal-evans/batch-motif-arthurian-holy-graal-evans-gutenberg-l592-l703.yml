canonical_text:
  quote: ''
  summary: The Queen laments the decline of Arthur's court and advises him to seek
    counsel at the chapel of St Augustine in the White Forest, a perilous place found
    only by adventure. Arthur agrees to go armed with one squire, Chaus. Chaus sleeps
    in the hall, dreams that Arthur has gone without him, follows horse tracks into
    a forest, finds a chapel with a graveyard, a dead knight, burning tapers, and
    golden candlesticks, removes one taper and candlestick, and then meets a black,
    foul-favoured armed man in a wooded lane.
  language: English
  quote_policy: summarized
