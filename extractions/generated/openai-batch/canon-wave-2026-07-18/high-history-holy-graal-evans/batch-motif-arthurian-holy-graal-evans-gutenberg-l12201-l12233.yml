canonical_text:
  quote: ''
  summary: Gawain tells a damsel that the knight who won the Golden Circlet has killed
    Nabigant, shows the circlet in an ivory casket as a token, and the damsel returns
    joyfully to her Lady. Gawain then rides toward the assembly and meets a weary
    squire, who reports war in Arthur's land, rumors of Arthur's death, the Queen
    acting in his place at Cardoil, raids by Briant of the Isles and Kay, and the
    weakened state of the Round Table knights defending Cardoil.
  language: English
  quote_policy: summarized
