canonical_text:
  quote: '"this castle is your mother''s and ought to be yours"'
  summary: The narrator links Perceval to Joseph of Abarimacie, then recounts Perceval's
    departure from the hermitage, his arrival at a castle, his confrontation with
    Chaos the Red, the combat in which Perceval kills him, and the surrender of the
    castle's keys after the household acknowledges the castle belongs to Perceval's
    mother and ought to be his.
  language: English
  quote_policy: quoted
