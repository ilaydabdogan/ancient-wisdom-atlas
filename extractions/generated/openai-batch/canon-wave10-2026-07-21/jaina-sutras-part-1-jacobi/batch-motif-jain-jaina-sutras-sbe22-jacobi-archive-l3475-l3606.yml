canonical_text:
  quote: "“all breathing, existing, living, sentient creatures ... should not be slain”"
  summary: The passage states a Jain doctrine of non-injury, presents it as the eternal
    law proclaimed by Arhats, Bhagavats, and teachers, urges adoption of the law with
    indifference to sense impressions and freedom from worldly motives, links carelessness,
    desire, fraud, karma, rebirth, and painful consequences, rejects a contrary doctrine
    permitting violence toward living beings, and argues that pain is unpleasant and
    feared by all living beings.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Seer is described as not injuring living beings, ending acts and samsara,
    destroying former actions by preventing sin, and having no worldly weakness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arhats and Bhagavats of past, present, and future declare that all breathing,
    existing, living, sentient creatures should not be slain, treated violently, abused,
    tormented, or driven away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The law is described as pure, unchangeable, and eternal, and as declared by
    clever ones who understand the world.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: One who adopts the law is instructed not to hide or forsake it, to become
    indifferent to impressions of the senses, and not to act on worldly motives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Those who acquiesce and indulge in worldly pleasures are said to be born again
    and again, while carefulness is connected with conquering and carelessness with
    standing outside salvation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage names srava, parisrava, anisrava, and aparisrava, and says that
    a wise man who understands these terms proclaims truth to men still in samsara
    who are awakened and have discrimination.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The afflicted and careless are to be instructed; nothing is secure from the
    mouth of death; desire-led persons are described as seized by Time, dwelling in
    the heap of karman, and being born again and again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A bracketed variant passage says that repeated delusion renews acquaintance
    with places of pain, that beings experience pains inherent in regeneration, and
    that frequent or rare cruel acts correspond to frequent or rare punishment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some Brāhmaṇas or Śramaṇas are described as saying, after examining upper,
    nether, and sidelong directions, that living beings may be harmed and that there
    is no wrong in it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Teachers reject the harm-permitting doctrine as wrongly seen, heard, acknowledged,
    understood, and examined, call it a doctrine of the unworthy, and restate that
    living beings should not be harmed.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage proposes asking professors whether pain is pleasant or unpleasant,
