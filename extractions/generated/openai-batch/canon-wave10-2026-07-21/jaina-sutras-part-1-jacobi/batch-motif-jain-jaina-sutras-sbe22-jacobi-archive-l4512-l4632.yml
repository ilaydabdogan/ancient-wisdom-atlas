canonical_text:
  quote: ''
  summary: The passage rejects unsupported doctrinal alternatives, commends restraint
    in speech, states vows and non-harm toward living beings, and gives rules for
    a mendicant to refuse offerings or lodging obtained through violence, theft, force,
    or improper household action. It also prescribes endurance under hostility and
    gives rules about giving to dissenters and to persons of the same faith.
  language: English
