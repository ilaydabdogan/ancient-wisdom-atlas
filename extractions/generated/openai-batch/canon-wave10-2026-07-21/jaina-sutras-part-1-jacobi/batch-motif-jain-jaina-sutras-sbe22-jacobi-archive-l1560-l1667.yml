canonical_text:
  quote: ''
  summary: The passage presents a scholarly argument for dating the oldest parts of
    the Jaina canon by comparing metres in Jaina, Pali Buddhist, Brahmanical, and
    Northern Buddhist works. It concludes that the oldest extant Jaina literature
    is later than early Pali literature and earlier than the Lalita Vistara, and then
    relates this conclusion to Svetambara traditions about the collection of the Angas
    at Pataliputra after a twelve-year famine.
  language: English
  quote_policy: summarized
