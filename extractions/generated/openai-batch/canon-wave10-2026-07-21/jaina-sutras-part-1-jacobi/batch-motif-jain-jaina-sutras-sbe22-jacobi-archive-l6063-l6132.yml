canonical_text:
  quote: ''
  summary: 'The passage gives rules for monks and nuns on a begging tour: they should
    avoid competing with other mendicants for alms, stay out of sight when others
    have entered a house, share food given for all, divide it impartially without
    choosing desirable portions, and wait until another alms seeker has finished before
    addressing the householder.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun on a begging tour who knows that another mendicant, guest, pauper,
    or beggar has entered a house should not stand in that person’s sight or opposite
    the door.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The Kevalin gives the reason that another person, seeing the monk or nun,
    might procure and give food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The instructed mendicant should go apart and remain where people do not pass
    or see them.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:4
  text: If food is brought as a gift for all, silently accepting it and treating it
    as enough only for oneself is described as sinful and is forbidden.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The recipient should join the other beggars and tell them that the food was
    given for all of them to eat or divide.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When dividing or eating the food, the mendicant should not select the larger,
    conspicuous, savoury, delicious, nice, or big portions, but should divide or eat
    impartially and without greed or desire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If another alms seeker has already entered the house, the monk or nun should
    not overtake that person or address the householder first; after the other has
    been sent away or received alms and returned, they may enter and address the householder.
  category: sequence
  evidence_refs:
  - ev:6
