canonical_text:
  quote: ''
  summary: The lesson presents a vow not to perform acts relating to plants after
    entering the order. It defines the one who refrains from such acts as houseless,
    describes sensory qualities and attachment as worldly entanglement, contrasts
    self-controlled persons with those who merely pretend to be houseless, condemns
    injurious acts toward plants, and compares plants with humans in birth, aging,
    reason, sickness when cut, need for food, decay, impermanence, growth, and change.
    Notes discuss plants and animals as living beings and commentarial arguments for
    plant knowledge.
  language: English
  quote_policy: summarized
