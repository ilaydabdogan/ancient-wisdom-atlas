canonical_text:
  quote: ''
  summary: The passage gives rules for Jain mendicants receiving alms. Meat or fish
    with many bones is to be refused; if accepted inadvertently, it is to be eaten
    in a suitable place and the bones left in a secluded place on ashes. Fossil or
    sea salt is likewise not to be accepted directly; if accepted inadvertently, the
    mendicant should return to the householder, ask whether it was given knowingly,
    and may consume or share it only after permission is given. Remaining food or
    drink is to be shared with suitable fellow-ascetics when available.
  language: English
  quote_policy: summarized
