- id: obs:2
  text: If the householder brings meat with many bones in a bowl, the mendicant should
    not accept the bowl from the donor’s hand or vessel because it is described as
    impure and unacceptable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the bone-filled meat has been accepted inadvertently, the mendicant should
    not reject it verbally but should go apart, eat it in a garden or upāśraya with
