canonical_text:
  quote: ''
  summary: The Fifth Lesson contrasts worldly accumulation for pleasure with the conduct
    of a houseless mendicant. It instructs the mendicant to avoid unclean acceptance,
    buying and selling, excess possessions, emotional attachment to gifts, and storage.
    It describes pleasure as binding and painful, presents knowledge of the world
    and its states as liberating, treats the body as loathsome and painful, and rejects
    a harmful heretic who claims to cure desire while committing violence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Worldly wants for pleasure are said to be supplied by bad injurious doings,
    including wealth accumulation for family, dependents, hospitality, and meals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wise, houseless, noble person recognizes the proper moment and should not
    accept, cause, or permit acceptance of anything unclean.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mendicant should not buy, cause others to buy, or consent to the buying
    of others.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mendicant is described as knowing time, strength, measure, practice, occasion,
    conduct, religious precepts, and the true condition of the donor or hearer.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After cutting off both love and hate, the mendicant proceeds securely on the
    road to final liberation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Clothes, alms-bowls, blankets, brooms, property, and straw mats are listed
