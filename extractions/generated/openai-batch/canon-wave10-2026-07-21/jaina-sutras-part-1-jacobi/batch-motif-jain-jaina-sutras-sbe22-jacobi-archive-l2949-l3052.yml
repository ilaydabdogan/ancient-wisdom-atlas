  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: When receiving food, the mendicant should know the required quantity, should
    not rejoice at receiving a gift, should not be sorry when receiving nothing, and
    should not store away abundance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A person who loves pleasures is described as afflicted by their loss, sorry
    in heart, troubled, and suffering pain.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The far-sighted one knows the world's inferior part, upper part, and side-long
    part, and knows that one who desires the world is turned round in samsara.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The one who knows the relation of worldly desire is called a hero who liberates
    those who are fettered.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The body is described as loathsome inside and outside, with foul interior
    humours.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: A person engaged in worldly affairs practices many tricks, is bewildered by
