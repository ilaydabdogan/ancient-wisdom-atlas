canonical_text:
  quote: ''
  summary: Rules for yatis during Pa^usan prescribe asking leave before medical cures,
    penance, death-facing abstinence, movement, eating, easing nature, lessons, or
    vigils; arranging care for sun-dried monastic utensils; maintaining a proper bed
    or bench; inspecting places for easing nature because rainy-season life forms
    emerge; keeping three sanitary pots; and observing hair-removal rules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk is not allowed to undertake a medical cure, exalted penance, death-facing
    mortification with abstinence or motionlessness, movement, eating, easing nature,
    daily lessons, or religious vigils without asking leave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Pa^usan, a monk who dries or warms his robe, alms-bowl, blanket, broom,
    or another utensil must ask one or more nearby persons to mind it before going
    out for specified activities.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the person asked to mind the utensil promises to do so, the monk may go;
    if not, he may not go.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During Pa^usan, monks or nuns are not allowed to be without their proper bed
    or bench.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A poorly reserved, low, rickety, insufficiently fastened, unfixed, unexposed,
    uninspected, or unclean bed or bench is said to make control difficult; the contrary
    makes control easy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: During Pa^usan, monks or nuns must inspect three spots where they ease nature,
    especially because rainy-season living beings, grass, seeds, mildew, and sprouts
    frequently come forth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'During Pa^usan, monks or nuns must have three pots: one for ordure, one for
    urine, and a spitting-box.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the specified night of the fifth Bhadrapada during Pa^usan, monks and
    nuns are not allowed to wear their hair as short as that of a cow; a monk should
    shave his head or pluck out his hair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hair-removal intervals stated are shaving with a razor every month, cutting
    with scissors every half-month, and plucking out every six months.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note explains that the bed or bench is not the mendicant's property but
    is temporarily reserved for the mendicant's use.
  category: relationship
  evidence_refs:
  - ev:7
