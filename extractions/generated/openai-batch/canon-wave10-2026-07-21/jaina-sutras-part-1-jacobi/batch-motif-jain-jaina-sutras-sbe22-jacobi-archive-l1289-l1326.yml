  quote: ''
  summary: The passage compares Jaina and Buddhist traditions about successive prophets,
    noting twenty-four Tirthakaras and twenty-five Buddhas, while stating that priority
    or borrowing cannot be determined. It argues that Jainism developed independently
    from Buddhism, though both Jainism and Buddhism drew on Brahmanical, especially
    Sannyasin, groundwork in philosophy, ethics, and cosmogony. It then reports Barth's
    caution that Jaina sacred books were written down long after the sect's foundation
    and that continuous sectarian tradition had not been demonstrated.
