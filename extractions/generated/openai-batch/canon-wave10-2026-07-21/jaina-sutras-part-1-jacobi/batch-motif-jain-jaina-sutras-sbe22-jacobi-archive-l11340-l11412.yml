canonical_text:
  quote: ''
  summary: 'The passage describes the latter dreams seen by the queen: a turbulent
    milk-ocean, a radiant celestial abode, an enormous Meru-like heap of jewels, and
    a smokeless ghee-fed fire. After these dreams the queen awakes joyfully. The text
    states that every mother of a Tirthakara sees fourteen dreams on the night when
    the famous Arhat enters her womb, and then names Trisala as awakening glad and
    joyful after the dreams.'
  language: English
  quote_policy: summarized
