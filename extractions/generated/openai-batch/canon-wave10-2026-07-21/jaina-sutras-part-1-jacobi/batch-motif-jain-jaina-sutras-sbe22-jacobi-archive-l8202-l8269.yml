  quote: should employ language in moderation and restraint.
  summary: The passage instructs monks and nuns how to speak about trees, fruits,
    vegetables, sounds, and sensory qualities. It forbids speech that treats living
    plants as materials or food and prescribes descriptive, restrained, precise language.
    It concludes that practitioners should put aside wrath, pride, deceit, and greed
    and speak with discrimination, moderation, and restraint.
