canonical_text:
  quote: ''
  summary: The passage describes Mahavira's nurtured childhood, his later enjoyment
    of permitted fivefold sensory pleasures, his names and family lineage, his parents'
    religious practice, fasting death, divine rebirth and future liberation, and Mahavira's
    thirty years as a householder followed by giving away wealth and possessions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: As a child, Mahavira is attended by caregivers who dress him, play with him,
    carry him, and pass him from lap to lap; he grows on a beautiful precious-stone
    mosaic ground with a tree-in-mountain simile.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'After his intellect develops and childhood passes, Mahavira lives in enjoyment
    of allowed, noble, fivefold joys and pleasures: sound, touch, taste, colour, and
    smell.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Tradition records three names for Mahavira: Vardhamana from his parents,
    an ascetic name connected with enduring dangers, nakedness, and miseries, and
    the name Mahavira from the gods.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists Mahavira's gotra and the names or gotras of his father,
    mother, paternal uncle, eldest brother, eldest sister, wife, daughter, and granddaughter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mahavira's parents are described as worshippers of Pārcva and followers of
    the Sramanas who practice observance, blame, repentance, confession, and penance
    for the sake of protecting six classes of lives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mahavira's parents reject all food on a bed of Rosa-grass; their bodies dry
    up through the last mortification of the flesh, and they die in the proper month.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After death, Mahavira's parents are born as gods in Adbhuta Kalpa; after that
    life ends, they will descend to Mahavideha and reach absolute perfection, wisdom,
    liberation, final Nirvana, and the end of misery.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mahavira lives thirty years among householders under the name Videha and is
    identified as a Kshatriya and prince/native of Videha.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: After his parents have gone to the worlds of the gods and he has fulfilled
    his promise, Mahavira gives up gold, silver, troops, chariots, and valuable treasures,
    distributing them for a whole year.
  category: action
  evidence_refs:
  - ev:7
