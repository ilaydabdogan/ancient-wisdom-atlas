canonical_text:
  quote: ''
  summary: 'The lesson gives rules for monks or nuns about begging and accepting food
    or drink: they should refuse food specially procured or prepared for ascetics,
    avoid houses of relatives where food might be prepared for them, withdraw from
    public view before seeking acceptable alms elsewhere, avoid approaching food prepared
    for guests or sick persons, and consume received food or drink without selecting
    only the pleasant portions. The final sentence begins a rule about surplus food
    but is incomplete in the supplied passage.'
  language: English
  quote_policy: summarized
