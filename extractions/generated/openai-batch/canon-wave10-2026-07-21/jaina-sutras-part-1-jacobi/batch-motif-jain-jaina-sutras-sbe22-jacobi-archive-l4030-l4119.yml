  summary: A didactic Jain passage contrasts outward conduct with true discipline,
    instructs the aspirant to follow the ācārya and the Tīrthakara teaching, reject
    wrong doctrines, lead a restrained ascetic life, avoid the currents and whirlpool
    of sin or desire, leave the road of birth and death, and understand liberation
    as beyond speech, mind, body, gender, form, and sensory qualities.
