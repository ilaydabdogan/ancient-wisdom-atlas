canonical_text:
  quote: ''
  summary: 'The passage gives rules for monks and nuns seeking alms: they should avoid
    improper haste, take alternate paths around obstacles, dangers, and difficult
    terrain, avoid bodily contamination and life-bearing surfaces when cleaning themselves,
    use permitted clean materials in a secluded place, and not alter or pass a thorn-blocked
    household entrance without permission and examination.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a proper time, a mendicant may enter with other mendicants and accept acceptable
    alms respectfully given, then eat the meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A monk or nun should not hurry into a householder's abode when the first portion
    of a meal is being handled and other religious mendicants, guests, paupers, and
    beggars are already going there in haste.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a begging-tour, if a monk or nun comes upon walls, gates, bolts, or bolt-holes
    and a byway is available, they should avoid the obstacles rather than go straight
    on.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kevalin gives the reason that walking there could make the mendicant stumble
    or fall and contaminate the body with bodily substances.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the body becomes soiled, the mendicant should not clean or dry it on bare
    ground, wet or dusty earth, rock, life-containing clay, worm-inhabited timber,
    or things containing eggs, living beings, or cobwebs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The prescribed cleaning sequence is to beg for dust-free straw, leaves, wood,
    or a potsherd, go to a secluded spot, examine and clean a heap of ashes or bones,
    and then wipe, rub, warm, or dry the body circumspectly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When vicious animals or a vicious person approach, the monk or nun should
    use a byway if one is available and not walk straight on.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When encountering a pit, pillar, thorns, unsafe ground, marshy or uneven ground,
    or mud, the monk or nun should avoid these obstacles by a byway if possible.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the entrance to a householder's abode is secured by a branch of a thorn
    bush, the monk or nun should not make it passable or enter and leave without the
    owner's permission and without examining and sweeping the entrance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The householder's abode is the setting for the alms-related instructions.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
