canonical_text:
  quote: ''
  summary: The passage gives rules for monks and nuns about remaining during the rainy
    season and later wandering from village to village only when roads are safe for
    living beings and travelers. It instructs mendicants to walk carefully, avoid
    living beings, seeds, grass, water, and mud, choose bypaths where available, and
    avoid routes through hostile, politically unstable, or difficult forest regions
    when safer alternatives exist.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mendicants may remain in a village during the rainy season when suitable lodging,
    alms, and conditions are available.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the rainy season, they should not wander if the road contains many living
    beings and other ascetics and Brahmanas are not yet traveling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the road contains few living beings and many ascetics and Brahmanas are
    traveling, they may wander circumspectly from village to village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A monk or nun should look ahead four cubits while walking and alter the manner
    of stepping if animals are seen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a bypath exists, the monk or nun should choose it rather than go straight
    on.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Roads with living beings, seeds, grass, water, or mud should be avoided when
    an unobstructed byway is available.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Routes through regions associated with borderers, robbers, Mlechchhas, non-Aryan
    people, or half-civilised people are to be avoided if another place or friendly
    district is available.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The stated reason for avoiding hostile regions is that local people might
    bully, beat, or suspect the mendicant, or take away the mendicant's robe, alms-bowl,
    mantle, or broom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Routes through countries with no king, many kings, an unanointed king, two
    governments, no government, or weak government are to be avoided when safer alternatives
    exist.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: A forest route that cannot certainly be crossed within one to five days should
    be avoided when another place or friendly district exists.
  category: setting
  evidence_refs:
  - ev:9
