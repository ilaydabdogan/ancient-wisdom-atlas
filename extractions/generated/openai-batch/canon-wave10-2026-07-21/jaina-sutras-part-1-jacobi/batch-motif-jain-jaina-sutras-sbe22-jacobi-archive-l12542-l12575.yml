canonical_text:
  quote: ''
  summary: 'The passage catalogs groups of female lay votaries, sages, Kevalins, professors,
    and disciples, giving their numbers and attainments: scriptural knowledge, Avadhi-knowledge,
    combined knowledge and intuition, self-transformation, knowledge of others'' mental
    conditions, victory in disputes, perfection, freedom from pains, and last-birth
    status. Footnotes explain selected technical terms.'
  language: English
  quote_policy: summarized
