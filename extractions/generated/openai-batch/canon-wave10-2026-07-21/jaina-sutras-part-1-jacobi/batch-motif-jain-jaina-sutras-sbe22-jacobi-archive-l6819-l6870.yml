- id: obs:2
  text: A monk or nun seeking lodging after entering a village or scot-free town should
    not use a lodging for religious postures, night's rest, or study if they think
    it contains eggs or living beings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the lodging contains only few eggs or few living beings, the monk or nun
    may inspect and clean it before using it circumspectly for religious postures
    and related purposes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a householder gives lodging for a Nirgrantha or fellow ascetic after buying,
