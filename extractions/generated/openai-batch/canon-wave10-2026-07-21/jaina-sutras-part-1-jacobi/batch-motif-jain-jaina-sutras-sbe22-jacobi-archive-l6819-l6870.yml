canonical_text:
  quote: ''
  summary: 'A closing instruction from the prior lecture describes rule-following
    religious persons acting under the commandment of the Gana and respecting one
    another. The next lecture begins rules for monks and nuns seeking lodging: lodgings
    containing eggs or living beings are not to be used, except under limited conditions
    after inspection and cleaning; lodgings improperly acquired by a householder through
    theft, force, or harm to living beings are also to be refused, whether intended
    for Nirgranthas, fellow ascetics, or other named recipient groups.'
  language: English
  quote_policy: summarized
