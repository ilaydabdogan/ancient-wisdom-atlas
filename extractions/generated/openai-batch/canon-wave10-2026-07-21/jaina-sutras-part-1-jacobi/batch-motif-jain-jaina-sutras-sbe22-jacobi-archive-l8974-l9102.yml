canonical_text:
  quote: ''
  summary: A Jain monastic regulation passage instructs monks and nuns to ask permission
    before entering sugarcane plantations or garlic fields and to apply previously
    stated food rules to sugarcane and garlic. It then gives rules for taking and
    using dwelling-places, especially in traveller's halls, including use for oneself
    or other mendicants, restrictions when a requested dwelling is not obtained, and
    a concluding teaching that dominion is fivefold.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun who wishes to go to a sugarcane plantation should ask permission,
    and rules for eating mango apply to chewing or sucking sugarcane and its parts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A monk or nun who wishes to go to a garlic field should ask permission, and
    rules for eating mangoes apply to chewing or sucking garlic and its bulb, peel,
    stalk, or seed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A monk or nun who has obtained a place in a traveller's hall or similar lodging
    should avoid occasions to sin connected with preparations made by householders
    or their sons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first dwelling rule permits begging for a domicile after reflection on
    its fitness for a stay.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The second and third rules concern asking for a dwelling-place for other mendicants,
    with one version allowing the monk to use it and another version not allowing
    him to use it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fourth and fifth rules concern, respectively, using a dwelling-place already
    ceded to other mendicants and asking for a dwelling-place for oneself rather than
    for multiple persons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The sixth and seventh rules state that if the requested or occupied dwelling
    condition is obtained, it may be used; otherwise the monk or nun should remain
    in a squatting or sitting posture.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says that someone who has adopted one of the seven rules should
    follow an additional repeated prohibition formula from an earlier passage.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A teaching attributed to the venerable Mahavira reports that the Sthaviras
    declared dominion to be fivefold.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The five dominions listed are those of the lord of the gods, the king, the
    houseowner, the householder, and the religious man.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A note explains the religious man's dominion as his domicile and says that
    when he takes possession of it, he must ask permission of the possessors.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A commentary note links the rules about eating mangoes, sugarcane, and garlic
    to the Sixteenth Lesson of the Nishitha Sutra.
  category: relationship
  evidence_refs:
  - ev:11
