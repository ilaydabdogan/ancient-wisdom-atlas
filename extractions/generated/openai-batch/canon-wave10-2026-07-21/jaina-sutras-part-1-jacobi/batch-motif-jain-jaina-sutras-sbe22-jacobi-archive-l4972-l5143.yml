canonical_text:
  quote: "“He should not long for life, nor wish for death.”"
  summary: 'Instructional verses and notes describe disciplined forms of religious
    death for a Jain ascetic: the practitioner learns the law, abandons attachment
    to life and death, fasts, chooses ground free from living beings, endures pain
    without harming creatures, restricts or ceases bodily motion, mortifies the flesh,
    seeks destruction of karman, and chooses a prescribed method for entering Nirvana.'
  language: English
  quote_policy: quoted
