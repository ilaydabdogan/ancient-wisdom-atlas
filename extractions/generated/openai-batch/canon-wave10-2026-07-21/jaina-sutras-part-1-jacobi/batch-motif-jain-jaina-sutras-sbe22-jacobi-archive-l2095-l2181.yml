canonical_text:
  quote: ''
  summary: The passage frames Sudharman as reporting a discourse heard from Mahavira.
    It says that many beings do not remember the direction from which they descended
    at birth or know whether the soul is reborn, what they formerly were, or what
    they will become after death. It teaches that one should know, through one’s own
    knowledge, instruction, or hearing from others, the soul’s repeated birth and
    movement through directions. It identifies belief in soul, world, reward, and
    action, along with acts done, caused, or permitted, as causes of sin to be comprehended
    and renounced. Failure to comprehend and renounce these causes leads to wandering
    through directions, repeated births, and painful feelings.
  language: English
  quote_policy: summarized
