  summary: The passage gives rules for monks and nuns about where they may or may
    not relieve themselves, emphasizing inspection, use of a broom, avoidance of living
    beings, avoidance of places prepared through harm or labor for ascetics, and avoidance
    of cultivated, inhabited, public, sacred, death-related, and water-adjacent places.
