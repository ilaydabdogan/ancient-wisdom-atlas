canonical_text:
  quote: ''
  summary: The passage describes Mahavira's absence of passions and wrong belief,
    his ascetic wandering and equanimity toward valued and despised things, twelve
    years of meditation, attainment of Kevala under a Sal tree near the river Rigupalika
    after fasting and deep meditation, his omniscient knowledge of beings and their
    rebirth conditions, his rainy-season stays, and his death and liberation at Pava
    as Siddha/Buddha.
  language: English
  quote_policy: summarized
