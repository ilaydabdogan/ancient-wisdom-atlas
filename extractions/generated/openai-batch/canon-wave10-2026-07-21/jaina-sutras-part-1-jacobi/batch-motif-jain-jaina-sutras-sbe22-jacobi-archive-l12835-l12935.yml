canonical_text:
  quote: ''
  summary: 'The passage recounts the life of the Arhat Arishtanemi: his auspiciously
    timed descent from the Aparajita heavenly mansion into Queen Sivi’s womb, his
    birth and naming, his princely renunciation with fasting and hair-plucking, his
    attainment of Kevala knowledge under a tree on Mount Girnar, his religious community,
    lifespan, karmic exhaustion, and final liberation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The five most important moments of Arishtanemi’s life are said to occur when
    the moon is in conjunction with the same asterism named in the passage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arishtanemi descends from the great Vimana called Aparajita, where he had
    lived for thirty-six Sagaropamas, and takes embryo form in Queen Sivi’s womb at
    night in Sauripura.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Queen Sivi, wife of King Samudravijaya, gives birth to a healthy boy after
    nine months and seven and a half days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A note explains the name Arishtanemi by referring to his mother’s dream of
    a wheel-rim made of stones flying up to the sky.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Arishtanemi rides in a palankin called Uttarakura, followed by gods, men,
    and Asuras, through Dvaravati to Revatika park and an Aroka tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After fasting two and a half days without drinking water, Arishtanemi puts
    on a divine robe, tears out his hair with a thousand persons, leaves the house,
    and enters houselessness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After fifty-four days of bodily neglect, Arishtanemi fasts three and a half
    days without drinking water under a tree on the summit of Mount Girnar and obtains
    Kevala, described as highest knowledge and intuition.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Arishtanemi is said to have eighteen Ganas and eighteen Ganadharas, along
    with large communities of monks, nuns, lay votaries, female lay votaries, sages,
    and perfected disciples.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Arishtanemi’s total lifespan is given as one thousand years, including three
