  text: A couch or lodging appropriated by someone other than the giver may be inspected,
    cleaned, and then used circumspectly for religious postures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A monk or nun who knows that a layman has prepared lodging for the mendicant
    by matting, whitewashing, strewing, smearing, levelling, smoothing, or perfuming
    it should not use that lodging if it was prepared by the giver himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If such lodging has been prepared by another person, the monk or nun may use
    it circumspectly for religious postures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A monk or nun should not use lodging appropriated by the giver when the layman
    alters access or arrangement for the mendicant, such as making small doors large
    or spreading a couch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A monk or nun should not use lodging appropriated by the giver when the layman
    removes or places outside plants, plant parts, or household objects for the mendicant's
    sake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A monk or nun should not use above-ground lodging such as a pillar, raised
    platform, scaffold, second story, or flat roof, and should not use an underground
    place except under urgent circumstances.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: If lodged in such a place by chance, the monk or nun should not wash or clean
    body parts with hot or cold water and should not put forth bodily secretions there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Kevalin gives the reason that making secretions might lead the mendicant
    to stumble or fall, injure the body, or kill living beings.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A monk or nun on a begging tour should not use a lodging-place used by a householder
    where women, children, cattle, food, and drink are present.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The reason given is that illness might befall the mendicant and the layman,
