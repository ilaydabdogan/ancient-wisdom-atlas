canonical_text:
  quote: ''
  summary: 'The passage gives rules for monks and nuns concerning lodging and couches:
    they must avoid lodging specially prepared, altered, or cleared by a layman for
    their sake, though lodging prepared by another person may be used circumspectly.
    It also forbids above-ground and underground lodging in ordinary circumstances,
    explains that bodily secretions there could lead to falling, injury, or killing
    living beings, and warns against lodging with a householder''s family because
    illness might lead the layman to provide bodily care, washing, warmth, and fire.'
  language: English
  quote_policy: summarized
literal_observations:
