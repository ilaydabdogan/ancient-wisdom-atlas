  summary: 'The passage summarizes Arhat Parsva''s life durations, then dates his
    final death and release from pains after exhaustion of fourfold Karman: after
    a month-long fast without water, on the summit of Mount Sammeta, in the company
    of eighty-three persons, with hands stretched out. It also records the elapsed
    time since that event.'
