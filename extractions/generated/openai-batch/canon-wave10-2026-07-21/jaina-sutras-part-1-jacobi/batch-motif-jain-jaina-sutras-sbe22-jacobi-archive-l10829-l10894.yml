canonical_text:
  quote: ''
  summary: A chief god with sovereign authority over many celestial beings enjoys
    divine entertainments, then uses Avadhi knowledge to view Jambudvipa. He sees
    the Venerable Ascetic Mahavira as an embryo in the womb of the Brahmani Devananda.
    Filled with joy, he rises from his throne, removes his shoes, arranges his robe
    and hands, advances toward the Tirthakara, bows with his head to the ground three
    times, joins his palms, places them on his head, and speaks a reverential hymn
    to the Arhats, Bhagavats, Tirthakaras, enlightened guides, and givers of law,
    safety, sight, shelter, life, and knowledge.
  language: English
  quote_policy: summarized
