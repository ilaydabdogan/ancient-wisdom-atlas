  quote: ''
  summary: The passage discusses why the Drishtivada and Purvas disappeared, rejects
    a sectarian-neglect explanation, argues for continuity and independence in Jain
    religious development, and introduces the Akaranga Sutra as an early canonical
    work whose first book is treated as the oldest core. It also describes the text’s
    relation to the Angas, the divisions of sacred lore, later appendices, and Silanka’s
    use of auspicious sentences to identify textual structure.
