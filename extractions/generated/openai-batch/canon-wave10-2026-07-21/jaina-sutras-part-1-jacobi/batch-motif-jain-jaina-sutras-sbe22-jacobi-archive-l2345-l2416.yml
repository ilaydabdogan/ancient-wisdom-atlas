  quote: ''
  summary: The passage concludes an instruction on avoiding sinful acts toward water,
    then teaches that denying the world of fire-bodies is denying the self. It presents
    knowledge of fire-related injury and control or non-injury as wisdom; describes
    self-controlled heroes; states that harmful acts involving fire injure fire-bodies
    and other beings and bring bondage, delusion, death, and hell; enumerates beings
    that fall into fire and die; and instructs the wise not to act sinfully toward
    fire or cause or allow others to do so.
