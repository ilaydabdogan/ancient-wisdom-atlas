  summary: The passage describes a well-instructed ascetic mendicant who lives in
    abstinence, does not seek clothing or repair implements, endures bodily hardships,
    follows the example of the Tirthakaras, ceases sin and action, and is said to
    cross samsara and be liberated. It compares the law taught by noble ones to an
    island not covered by water and says disciples should be instructed day and night
    like young birds are fed.
