canonical_text:
  quote: '"show it ... and hide nothing"'
  summary: 'The passage gives rules for mendicants and for monks or nuns on a begging-tour:
    a mendicant must not conceal agreeable food, must openly show the vessel to other
    mendicants, must not keep the good portion while bringing inferior food, and must
    not accept foods from which much must be rejected, including specified cane or
    pod items and meat or fish with many bones. It introduces a householder''s invitation
    to accept meat with many bones.'
