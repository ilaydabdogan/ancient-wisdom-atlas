canonical_text:
  quote: ''
  summary: Mahavira, after a three-day fast without water and wearing one garment,
    leaves in a great palankin with gods, men, and Asuras for a park. At night he
    stops on untouched raised ground, descends, sits facing east, removes ornaments,
    plucks out his hair in five handfuls, pays obeisance to liberated spirits, vows
    to avoid sinful action, and adopts holy conduct. Divine figures collect his ornaments
    and hair. The assembly becomes motionless and silent. Mahavira attains Manahparyaya
    knowledge, resolves to neglect his body for twelve years and endure calamities,
    then meditates on the Self at Kummara.
  language: English
  quote_policy: summarized
