canonical_text:
  quote: ''
  summary: 'The passage gives a formulaic life account of the Arhat Rishabha: he proceeds
    in a divine and human entourage to a park and tree, undertakes fasting, hair-plucking,
    and houseless renunciation with followers, practices long austerity, attains Kevala
    under a Nyagrodha tree, is described with a vast religious community, and finally
    dies or is liberated on Mount Ashtapada after the exhaustion of Karman. The passage
    closes with chronology relative to Mahavira and the end of the Lives of the Ginas.'
  language: English
  quote_policy: summarized
