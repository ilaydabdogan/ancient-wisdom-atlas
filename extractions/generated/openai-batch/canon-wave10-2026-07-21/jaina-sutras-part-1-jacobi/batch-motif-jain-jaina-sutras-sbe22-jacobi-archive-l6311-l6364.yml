canonical_text:
  quote: ''
  summary: 'The passage gives rules for Jain monks and nuns on begging-tours: they
    should reject hot food cooled by blowing or fanning, reject food placed on vegetable
    or animal matter, distinguish unacceptable from acceptable used water by its condition
    and straining, ask properly for certain waters, and reject water taken from bare
    ground or brought in an unsuitable vessel.'
  language: English
  quote_policy: summarized
