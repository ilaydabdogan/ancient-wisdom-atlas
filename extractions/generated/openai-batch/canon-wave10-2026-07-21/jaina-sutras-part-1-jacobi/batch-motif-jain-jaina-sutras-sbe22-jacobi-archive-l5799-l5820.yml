  quote: ''
  summary: The lesson warns that after eating or drinking at a festive entertainment,
    one may vomit, fail to digest properly, or become ill. The Kevalin gives a reason
    involving a mendicant who has drunk various liquors with householders and monastics,
    and who may not find the promised jesting-place after leaving the entertainment.
    Footnotes gloss several terms related to food, householders, and lodging.
