canonical_text:
  quote: ''
  summary: The passage discusses Jain and Buddhist renunciatory ideals, caste status
    among ascetics, and the formation of dissenting sects. It highlights a Jain legend
    in which Mahavira's embryo is transferred from the Brahmani Devananda to the Kshatriyani
    Trisala because a Brahman woman or woman of low family is said not to be worthy
    to bear a Tirthakara. A note reports sectarian disagreement about this legend,
    offers an explanatory hypothesis involving Siddhartha, Devananda, Trisala, and
    patronage, and explicitly compares the embryo-transfer idea to a Puranic story
    about Krishna. The passage also discusses ascetics discontinuing ritual ceremonies
    and Veda recitation as part of a broader historical account of Jain and Buddhist
    origins.
  language: English
  quote_policy: summarized
