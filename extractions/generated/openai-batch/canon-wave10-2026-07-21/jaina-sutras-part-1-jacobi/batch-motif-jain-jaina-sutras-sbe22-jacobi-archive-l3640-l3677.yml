  quote: "“Difficult to go is the road of the heroes, who go whence there is no return
    (final liberation).”"
  summary: The passage instructs the practitioner to mortify the flesh, leave former
    connections, enter tranquillity, practice restraint and chastity, and pursue the
    difficult heroic road toward final liberation. It contrasts this with the fool
    who desires the current of karman, remains fettered to the world, and lacks knowledge
    and success in faith.
