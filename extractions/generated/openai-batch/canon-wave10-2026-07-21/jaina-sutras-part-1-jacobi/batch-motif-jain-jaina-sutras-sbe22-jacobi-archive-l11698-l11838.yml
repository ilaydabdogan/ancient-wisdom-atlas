canonical_text:
  quote: ''
  summary: The passage explains dream-omen rules for mothers of great beings, applies
    them to Trisala’s fourteen dreams, and reports that Siddhartha accepts the dream
    interpretation predicting the child as a universal emperor or Jina. After Mahavira
    is brought into the Gnatr family, supernatural servants bring hidden treasures,
    prosperity increases, and his parents plan the name Vardhamana. Mahavira remains
    motionless in the womb out of compassion, causing Trisala to fear loss, then quivers
    to reassure her, restoring joy.
  language: English
  quote_policy: summarized
