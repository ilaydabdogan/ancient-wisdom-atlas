canonical_text:
  quote: ''
  summary: 'The passage gives rules for Yatis during the named observance rendered
    in the OCR as Pa^usan/Pag^usan: restrictions on repeated alms rounds, a seven-house
    rule for going to a place where rice is cooked, prohibitions and shelter rules
    during rain for monks collecting alms in the hollow of the hand, rain-intensity
    rules for monks using an alms-bowl, places where a monk may stand during intermittent
    showers, and rules for accepting rice or pulse depending on whether cooking began
    before or after the monk''s arrival.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mendicant who has brought together dinner for the day is not allowed to
    go a second time to householders' abodes for collecting alms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Pa^usan/Pag^usan, monks or nuns who restrict their visits to certain
    houses may go to a place where rice is cooked if it is the seventh house from
    their lodging; the passage notes disagreement about whether the lodging itself
    is counted among the seven houses.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A monk who collects alms in the hollow of his hand is not allowed to frequent
    householders' abodes or collect alms if rain, even fine spray, is falling.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:4
  text: After accepting alms in the hollow of his hand, such a monk is not allowed
    to stay anywhere except in a house, because rain might begin.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: If rain begins after he has accepted hand-held alms, he should eat a part,
    put back the rest, cover his hand with the other hand, place it on his bosom or
    under his armpit, and go to a covered place, cave, or foot of a tree where water
    does not fall into his hand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A monk who uses an alms-bowl is not allowed to go to householders for alms
    if it rains fast, but may do so if it rains only a little, while wearing an under
    and an upper garment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When a monk has entered a householder's abode during single showers of rain,
    he may stand, when the rain ceases briefly, under a grove, in his residence, in
    the village assembling-hall, or at the foot of a tree.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The monk may accept rice or pulse only when the dish was begun before his
    arrival; if both dishes began before his arrival, both may be accepted, and if
    both began after his arrival, neither may be accepted.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that rain is called a rain-body and explains this as raindrops
    considered to contain life, apkaya.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:10
  text: The monk is not allowed to pass time with food previously collected, but should
    first eat and drink pure food and drink, then rub and clean his alms-bowl.
  category: action
  evidence_refs:
  - ev:9
