canonical_text:
  quote: ''
  summary: An unnamed divine agent transforms himself into the form gods use when
    entering the world of men, travels through numberless continents and oceans to
    a Brahman household, bows before the Venerable Ascetic Mah&vlra, puts Devnand&
    and her retinue into deep sleep, purifies particles, and takes Mah&vlra in his
    folded palms without harming him. He then goes to a Kshatriya household, puts
    Tri^ali and her attendants into deep sleep, purifies particles, places Mah&vlra's
    embryo in Tri^ali's womb, places Tri^ali's embryo in Devinandi's womb, and returns
    by the way he came.
  language: English
  quote_policy: summarized
