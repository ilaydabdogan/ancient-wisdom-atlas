canonical_text:
  quote: ''
  summary: The passage recounts a womb transfer involving Mahavira and Trisala, Mahavira’s
    knowledge of that transfer, his birth under specified calendrical and lunar conditions,
    divine attendance at the birth, showers of auspicious substances, an anointment
    as a Tirthakara, the increase of his family’s wealth from the time he entered
    Trisala’s womb, public gifts and feasting after purification, his naming as Vardhamana,
    and the beginning of his nursing care.
