canonical_text:
  quote: ''
  summary: The passage opens with a fivefold obeisance, then summarizes Mahavira's
    major life moments as occurring under specific asterisms. It narrates his descent
    from a celestial abode into Devānandā's womb, notes his knowledge concerning the
    descent, describes Devānandā's fourteen auspicious dreams, and reports Rishabhadatta's
    interpretation of the dreams as signs of an auspicious son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fivefold obeisance is addressed to Arhats, Liberated Ones, Religious Guides,
    Religious Instructors, and all saints, and is said to destroy sins and be the
    principal benediction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mahavira's descent, womb transfer, birth, renunciation by tearing out his
    hair and becoming houseless, and attainment of Kevala are all associated with
    the moon's conjunction with Uttaraphalguni; his final liberation is associated
    with Svati.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mahavira is described as descending from the Pushpottara vimana after the
    end of his divine lifespan and taking embryo form in Devānandā's womb in Kundagrama,
    in Jambudvipa and Bharatavarsha, at midnight under Uttaraphalguni.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Mahavira''s knowledge regarding the descent is described as threefold: he
    knew he was to descend, knew he had descended, and did not know when he was descending.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Devānandā, while on her couch in a state between sleep and waking, sees fourteen
    illustrious and auspicious dreams and then wakes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fourteen dreams are listed as an elephant, a bull, a lion, an anointing
    of the goddess Śrī, a garland, the moon, the sun, a flag, a vase, a lotus lake,
    the ocean, a celestial abode, a heap of jewels, and a flame.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the dreams, Devānandā is joyful, rises from her couch, goes to Rishabhadatta,
    greets him, sits, folds her hands, and recounts the dreams.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Rishabhadatta hears the dreams, reflects on them, interprets them as auspicious,
    and says Devānandā will give birth to a handsome boy after nine months and seven
    and a half days.
  category: speech
  evidence_refs:
  - ev:7
