  summary: Trisala wakes Siddhartha and reports having seen fourteen auspicious dreams,
    including an elephant. Siddhartha interprets them as signs that she will bear
    a handsome boy who will glorify the family and become a powerful king. Trisala
    accepts the interpretation and stays awake, listening to auspicious religious
    stories so that the dreams will not be counteracted by bad dreams.
