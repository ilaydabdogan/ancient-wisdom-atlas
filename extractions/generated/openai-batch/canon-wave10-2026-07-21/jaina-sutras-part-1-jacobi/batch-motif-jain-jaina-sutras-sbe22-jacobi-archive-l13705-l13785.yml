canonical_text:
  quote: ''
  summary: Rules for Yatis during the Pa^usan/rainy-season observance establish precedent
    from the Sthaviras, limit residence and alms travel by a measured distance, restrict
    travel at flowing rivers unless crossable, regulate giving and accepting food
    for the sick through the Acharya, restrict rich foods or drinks for healthy ascetics,
    forbid deceptive collection for the sick, caution against prompting lay supporters
    to obtain unseen goods, and prescribe one daily meal at a fixed alms time.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The practice of the Sthaviras is presented as a precedent followed by present
    Nirgrantha Sramanas, masters, teachers, and the speaker's group in beginning the
    Pa^usan after a month and twenty nights of the rainy season, with earlier but
    not later commencement allowed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the Pa^usan, monks or nuns may regard their residence as extending
    a Yojana and a Krosa all around and may live there for a moderate time.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the Pa^usan, monks or nuns may go and return to collect alms only within
    a Yojana and a Krosa from their lodgings; an always-flowing river containing water
    restricts such travel unless it is shallow enough to cross by putting one foot
    in the water while keeping the other in the air.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Acharya's spoken directions, such as 'Give' or 'Accept,' determine whether
    food may be given to or accepted for a sick brother or patient.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Healthy monks or nuns of strong body are not allowed during the Pa^usan frequently
    to take nine listed drinks or provisions: milk, thick sour milk, fresh butter,
    clarified butter, oil, sugar, honey, liquor, and meat.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A collector of alms may ask whether an article is required for a sick man,
    learn the needed amount, beg and accept that amount, stop when it is obtained,
    and may not accept by pretending that food is for the sick man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In converted and devoted householders' families, Sthaviras during the Pa^usan
    may not ask whether the household has an unseen item, because a devout householder
    might buy or steal it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: During the Pa^usan, a monk eats only one meal a day and should visit householders'
    abodes for alms at one fixed time.
  category: action
  evidence_refs:
  - ev:8
