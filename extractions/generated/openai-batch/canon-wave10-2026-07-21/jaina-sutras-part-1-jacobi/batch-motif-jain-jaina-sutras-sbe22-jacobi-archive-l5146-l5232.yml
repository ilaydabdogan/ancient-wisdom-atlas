canonical_text:
  quote: ''
  summary: 'The passage describes the Venerable Ascetic after entering the order:
    he wanders while meditating, refuses and later gives up his robe, becomes a naked
    houseless renunciant, endures living beings crawling on his body and people striking
    him, renounces household company and worldly life, remains silent when questioned
    or saluted, avoids entertainments and contests, lives austerely without cold water,
    becomes calm and intuitive, and knows elemental and plant forms of life.'
  language: English
  quote_policy: summarized
