  summary: The passage compares Jain, Buddhist, and Brahmanic doctrines, especially
    rebirth, karma, liberation through knowledge and conduct, and recurring prophets
    who renew the faith. It also argues that the Nirgranthas were probably already
    an old sect at the time of Buddha and Nataputta, with Nataputta treated as a reformer
    rather than founder.
