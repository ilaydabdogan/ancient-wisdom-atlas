  quote: ''
  summary: 'After a ten-day festival, King Siddhartha gives and receives large numbers
    of offerings, gifts, and presents. The parents of the Venerable Ascetic Mahavira
    mark his birth through a sequence of rites: first-day celebration, third-day showing
    of the sun and moon, sixth-day religious vigil, post-birth purification ceremonies,
    and a twelfth-day feast with invited kin and followers.'
