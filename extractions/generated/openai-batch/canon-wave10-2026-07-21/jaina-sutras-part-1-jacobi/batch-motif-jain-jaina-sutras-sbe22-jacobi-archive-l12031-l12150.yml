canonical_text:
  quote: ''
  summary: The passage describes auspicious rites, a feast, and honors given to kin
    and followers, followed by the explanation that Mahavira was named Vardhamana
    because prosperity increased from the time he was begotten. It records Mahavira's
    names, gotra, lineage, qualities, and his father's names. After his parents die
    and he receives permission from his elder brother and the kingdom authorities,
    Laukantika gods praise him and urge him to establish the law for all living beings.
    Mahavira perceives through superior knowledge that the time for renunciation has
    come, abandons wealth and royal possessions, gives gifts, and departs in the palanquin
    Chandraprabha accompanied by gods, men, Asuras, and attendants.
  language: English
  quote_policy: summarized
