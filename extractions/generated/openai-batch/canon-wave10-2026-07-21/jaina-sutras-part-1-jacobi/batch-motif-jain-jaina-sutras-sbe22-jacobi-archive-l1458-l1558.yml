  quote: ''
  summary: A scholarly introduction discusses the transmission and redaction of Jaina
    sacred literature, arguing that Devarddhi likely arranged existing manuscripts
    into a canon and supplemented only missing works from learned reciters. It considers
    but dismisses the Jaina dogmatic claim that all sacred books were revealed by
    the first Tirthakara, then evaluates historical arguments for dating the canon,
    including lack of Greek astronomy and linguistic comparison with Pali and later
    Prakrit.
