  quote: ''
  summary: The passage discusses Ambapali's donation of a park to Buddha and his conversion
    of Siha at Vesali; identifies Mahavira's locality and clan connections around
    Vaisali; argues that Siddhartha was a petty Kshatriya chief rather than a monarch;
    describes Trisala's kinship with Chetaka of Vaisali; and summarizes traditions
    about Vaisali's confederated rulers, Chetaka's war consultation, and a festival
    instituted after Mahavira's death.
