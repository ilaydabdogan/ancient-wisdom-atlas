canonical_text:
  quote: ''
  summary: 'The passage gives repeated reasons why a mendicant should not use a householder''s
    lodging for religious postures: household quarrels, handling of fire, ornaments
    and women, sexual inducement, altered household work, specially prepared food
    or wood, risk involving a thief, harm to beings in straw sheds, and improper residence
    in places frequented by fellow ascetics.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mendicant is instructed not to use a lodging-place used by a householder
    for religious postures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a mendicant lives in a householder's lodging, he might mentally approve
    or disapprove when householders bully, scold, attack, or beat each other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a mendicant lives with householders, a householder might kindle, light,
    or extinguish a fire-body, and the mendicant might mentally approve or disapprove.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mendicant might see household ornaments, jewels, pearls, gold and silver,
    bracelets, necklaces, or a decked girl or maiden, and might think or say approval
    or disapproval about her condition.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Household women might say that a woman who has intercourse with celibate ascetics
    will have a strong, glorious son of heavenly beauty, and one of them might induce
    the mendicant to sexual intercourse.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Because mendicants do not bathe and are described as unclean and foul-smelling,
    householders might change the order of their own work because of the mendicant.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A householder might prepare or dress food for the sake of the mendicant, and
    the mendicant might desire to eat, drink, or swallow it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A householder might cleave, buy, or steal wood and kindle fire by rubbing
    wood on wood for the mendicant, who might desire to dry or warm himself or enjoy
    the fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At night or twilight, if a mendicant leaves a door open to ease nature, a
    thief might enter; the mendicant is not to make statements identifying the thief
    or his actions, and the householder may suspect the ascetic.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A monk or nun should not use grass or straw sheds containing eggs or living
    beings, though they may use them if they contain few eggs or few living beings.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: A mendicant should not stay in halting-places, garden houses, family houses,
    or monasteries where many fellow ascetics frequently arrive.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: Reverend persons who overstay the fixed time or repeat their retreat in the
    same place are to be told that they sin.
  category: speech
  evidence_refs:
  - ev:12
