canonical_text:
  quote: ''
  summary: A didactic Jain passage praises the wise follower who hears the learned
    law, keeps firmness, practices early exertion, fights with and subdues the body,
    avoids killing and sensual attachment, lives humbly without attachment, and is
    described as crossing the flood of life and attaining liberation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a wise man has heard and understood the word of learned ones,
    and that noble ones have declared the law without partiality.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says the connection with the world has been destroyed here and
    is difficult to destroy elsewhere, and therefore advises not abandoning firmness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage distinguishes those who exert themselves early and do not slide
    back, those who exert early and later slide back, and those who do not exert early.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A follower of the commandment is described as wise and passionless, exerting
    himself before morning and after evening, contemplating virtue, and becoming free
    from love and delusion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage instructs the practitioner to fight with the body rather than
    anything else, and says the human body is difficult to attain and worth the fight.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Clever ones are said to praise discernment of wisdom, while a fool who falls
    from it is liable to birth and related consequences.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the fool's fall depends on colour and killing; the translator's
    note glosses colour as sense perceptions and attachment to sensual pleasures.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A sage on the beaten track to liberation is said to know acts, not kill, control
    himself, and not be overbearing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The practitioner is described as comprehending that pleasure and pain are
    individual, advising kindness, avoiding worldly work, living humbly, and being
    unattached to any creature.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage equates righteousness with sagedom and says this is inconsistent
    with weak, sinning, sensual, ill-conducted house-inhabiting men.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: A sage acquiring sagedom is told to subdue his body, and heroes indifferent
    to everything are said to use mean and rough food.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Such a person is said to have crossed the flood of life, passed over samsara,
    become liberated, and ceased from acts.
  category: sequence
  evidence_refs:
  - ev:12
