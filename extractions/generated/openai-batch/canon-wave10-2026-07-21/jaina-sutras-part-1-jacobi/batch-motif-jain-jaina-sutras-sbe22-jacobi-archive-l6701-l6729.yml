canonical_text:
  quote: As this would be sinful, he should not do so.
  summary: The passage gives a rule for mendicants handling agreeable food when another
    mendicant is sick. A bearer must not conceal and misrepresent the food in order
    to eat it himself; instead he should identify which parts are unfit for a sick
    person. A second, similar case begins with an instruction to return the food if
    the sick mendicant will not eat it, but the passage range ends before the case
    is completed.
  language: English
