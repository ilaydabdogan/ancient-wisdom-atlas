canonical_text:
  quote: ''
  summary: The passage opens with reverence to the Jinas and to the Venerable Ascetic
    Mahavira. Sakra, chief and king of gods, worships Mahavira and reflects that Arhats
    and comparable exalted beings are not born in low or Brahmanical families but
    in high, noble, royal families. He notes that Mahavira has taken embryo form in
    the womb of the Brahmani Devananda, and decides that the embryo should be moved
    to the womb of a Kshatriyani, while the Kshatriyani's embryo is moved to Devananda.
    Sakra orders Harmegamesi, the divine commander of foot troops, to perform the
    exchange. Harmegamesi accepts, departs toward the northeast, transforms himself
    by magical power, and gathers subtle particles of precious materials.
  language: English
  quote_policy: summarized
