canonical_text:
  quote: ''
  summary: The lesson gives prescriptive rules for monks and nuns begging, inspecting,
    accepting, refusing, cleaning, drying, and hanging clothes. Acceptable clothing
    may be requested from lay donors when inspected and fit for mendicant use. Garments
    must be refused when tied to delayed promises, harmful preparation, perfumes,
    washing, removal of life-containing matter, hidden valuables, living beings, eggs,
    seeds, grass, or unfitness for ascetic use.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun may ask a householder or his wife for inspected clothing and
    may accept it when it is pure and acceptable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A monk or nun may beg for an under-garment, an upper-garment, or a left-off
    robe that no other ascetic, Brahmana, guest, pauper, or beggar wants.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a householder offers a future promise or asks the mendicant to return
    or follow, the mendicant should refuse the promise and ask that the gift be given
    immediately if it is to be given.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a robe is to be given only after preparing another garment for household
    use by killing living beings, the mendicant should not accept it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If householders propose to perfume, rub, clean, wash, or otherwise prepare
    the cloth before giving it, the mendicant instructs them not to do so and refuses
    the clothes if they are nevertheless altered.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: When a robe is brought and given, the mendicant should inspect its inside
    in the donor's presence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The reason given for inspecting the robe is that valuables, living beings,
    seeds, or grass might be hidden inside it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Clothes full of eggs or living beings are not to be accepted; clothes free
    of such things are also not acceptable if they are not fit, strong, lasting, wearable,
    and fit for a mendicant.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Clothes that are fit, strong, lasting, wearable, pleasant, and fit for a mendicant
    may be accepted.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A monk or nun should not wash, rub, wipe, or clean clothes with drugs or plentiful
    water, including in response to smell.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A monk or nun drying clothes should avoid placing them on bare ground, wet
    earth, rock, clay containing life, or unstable raised supports.
  category: setting
  evidence_refs:
  - ev:9
