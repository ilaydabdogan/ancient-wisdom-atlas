canonical_text:
  quote: Knowing them, a wise man should not act sinfully towards wind, nor cause
    others to act so, nor allow others to act so.
  summary: The passage teaches that one who understands affliction and the reciprocity
    between oneself and others should avoid sinful actions toward wind and wind-bodies,
    should not cause or permit such actions, and thereby comprehends and renounces
    sinful acts. It contrasts self-controlled persons with those only pretending to
    be houseless, describes harm to living beings through wind-related acts, and names
    the knower of such causes of sin a reward-knowing sage.
  language: English
  quote_policy: quoted
