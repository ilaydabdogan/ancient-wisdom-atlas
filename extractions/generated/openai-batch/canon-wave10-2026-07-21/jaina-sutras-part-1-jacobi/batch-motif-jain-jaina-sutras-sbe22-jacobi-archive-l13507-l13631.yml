    branching institutional lineage.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage states founder relationships but does not narrate founding
    events.
- id: motif:3
  label: authority marked by gotra affiliation
  taxonomy_refs: []
  basis: Many named figures are paired with gotra affiliations, and the editorial
    note remarks on the significance of one missing gotra.
  evidence_refs:
