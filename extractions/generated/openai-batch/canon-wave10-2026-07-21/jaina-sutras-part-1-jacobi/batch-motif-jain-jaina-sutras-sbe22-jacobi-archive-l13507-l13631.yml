  quote_or_summary: 'Arya Siwhagiri Ctismara of the Gautama gotra is said to have
    four disciples: Dhanagiri, Arya Samita, Arya Vajra, and Arhaddatta. Arya Samita
    and Arya Vajra are sakha founders. Later entries name Arya Vajrasena, Arya Padma,
    and Arya Ratha as founders of sakhas, with Arya Ratha of the Vatsa gotra.'
