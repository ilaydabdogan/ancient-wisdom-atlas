- id: claim:1
  claim: The passage supports an internal comparison between the prose Sthavira list
    and subsequent gathas, because the editor says the gathas repeat names 16-32 but
    with differences in names, additions, and gotra attribution.
  claim_level: same_function
  target: Prose list of Sthaviras and following gatha list within the manuscript tradition
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to textual recensional function; it does
    not establish a broader comparative mythology claim.
- id: claim:2
  claim: The passage reports an editorial identification of Sandilya with Skandila,
    but marks it as the editor's opinion.
  claim_level: linguistic_similarity
  target: Sandilya and Skandila
  evidence_refs:
