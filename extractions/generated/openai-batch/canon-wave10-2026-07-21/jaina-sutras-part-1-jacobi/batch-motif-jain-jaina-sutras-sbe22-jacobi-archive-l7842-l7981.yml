canonical_text:
  quote: ''
  summary: This passage gives rules for Jain monks and nuns walking on pilgrimage.
    They are told to avoid demonstrative looking or gestures toward structures, trees,
    caves, mountains, water-places, and other sites because creatures may be disturbed
    or frightened. It gives further rules about walking with teachers or superiors,
    answering or not answering travellers, not revealing people, animals, plants,
    water, fire, transports, or distances, and remaining undisturbed in the face of
    dangerous animals or thieves. If robbed, the mendicant is not to complain or seek
    redress, but to remain silent or use religious exhortation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun on pilgrimage is instructed not to look toward listed structures
    or sites while raising arms, pointing fingers, or bowing up and down, and may
    then wander circumspectly from village to village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listed places include walls, ditches, ramparts, gates, hill houses, palaces,
    underground houses, houses in trees, mountain caves, a sacred tree or pillar,
    and workshops.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The listed natural or defended places include marshes, pasture-grounds, moats,
    fortified places, thickets, woods, mountains, caves, tanks, lakes, rivers, ponds,
    lotus ponds, winding ponds, and water-sheets.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Kevalin gives the reason that deer, cattle, birds, snakes, and animals
    living in water, on land, or in the air might be disturbed or frightened and seek
    refuge, thinking the Śramaṇa will harm them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: When walking with the master or teacher, the monk or nun should not touch
    the master's or teacher's hand, but should walk without touching or being touched.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If travellers question a group walking with a master, teacher, or superior
    priest, the master, teacher, or highest-ranking superior should answer, while
    the others should not mix in the conversation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: If travellers ask whether the mendicant saw a person or animal on the road,
    the mendicant should not tell or show it, should not comply, and may remain silent
    or say that he did not know.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The same manner of response applies to questions about water-plants, roots,
    bark, leaves, flowers, fruits, seeds, nearby water, kindled fire, corn transports,
    wagons, cars, village size, or distance to another settlement.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a vicious cow comes toward a monk or nun, they should not leave the road,
    take another road, enter a thicket, wood, or stronghold, climb a tree, plunge
    into a water-sheet, or seek refuge in a fold, army, or caravan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the face of danger, the mendicant is told to remain undisturbed, keep the
    mind from outward things, and collect himself or herself for contemplation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If the road passes through a forest where bands of thieves desire the mendicant's
    property, the mendicant should not leave the road from fear, following the same
    rule as with the vicious cow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: If thieves demand the mendicant's clothes or possessions, the mendicant should
    not hand them over and should not reclaim them by imploring, folding hands, or
    moving compassion, but by religious exhortation or silence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: If thieves bully the mendicant and tear off clothes, the mendicant should
    not lodge information in the village or at the king's palace and should not complain
    to a householder.
  category: action
  evidence_refs:
  - ev:9
