canonical_text:
  quote: ''
  summary: The passage narrates the birth of the Venerable Ascetic Mahavira to Trisali
    under nocturnal lunar and auspicious conditions. On the birth night, gods and
    goddesses create divine light and noise, demons in Vaisramana's service shower
    riches on King Siddhartha's palace, deity classes celebrate the Tirthakara's birthday,
    and Siddhartha orders civic release, cleansing, decoration, performances, and
    a ten-day royal festival with remissions and public rejoicing.
  language: English
  quote_policy: summarized
