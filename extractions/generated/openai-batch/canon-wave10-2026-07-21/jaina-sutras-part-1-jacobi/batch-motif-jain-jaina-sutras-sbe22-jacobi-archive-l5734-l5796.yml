canonical_text:
  quote: ''
  summary: The passage gives rules for Jain mendicants receiving food only after others
    have been served, asking appropriate household members, accepting food considered
    pure, avoiding festive entertainments and feast occasions, and avoiding situations
    where food or lodging may be specially prepared or improperly obtained for them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guests, paupers, and beggars are described as being entertained with food
    in the setting of the rule.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mendicant waits until all have received their due share and are enjoying
    the meal before speaking.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mendicant addresses a householder’s wife, sister, daughter-in-law, nurse,
    servant, or slave and asks for something to eat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Food brought and given after the request, or food otherwise given, may be
    accepted as pure and acceptable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A monk or nun who knows that a festive entertainment is occurring more than
    half a yojana away should not decide to go there for that entertainment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When a monk hears that an entertainment is in one direction, he should go
    in the opposite direction and remain indifferent to the feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Kevalin gives as the reason that eating food from such an occasion would
    incur sin connected with things prepared for the monk, mixed with living beings,
    bought, stolen, forcibly taken, or not given.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A layman might alter doors, adjust beds, change exposure to draughts, cut
    grass, and spread a couch for a mendicant.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage concludes that a well-controlled Nirgrantha should not decide
    to go to a festival that is preceded or followed by a feast.
  category: action
  evidence_refs:
  - ev:7
