  quote: ''
  summary: The passage praises awakened preaching, wisdom, the road to liberation,
    renunciation, non-harm, departure from family, endurance of ascetic hardship,
    and the practice of naked or mendicant discipline. It contrasts controlled renunciants
    with sense-attached people and failed practitioners, and describes karmic suffering
    through birth, disease, darkness, and pain.
