- id: obs:3
  text: A greedy leaf-covered tortoise in a lake is said to be unable to rise, and
    trees are said not to leave their place; these images are compared to men attached
    to sense objects who cry bitterly and do not reach liberation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Creatures are described as being born in various families to reap the fruit
    of their own acts, with many diseases and wounds enumerated.
  category: attribute
