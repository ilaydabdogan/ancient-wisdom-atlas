canonical_text:
  quote: "“leaving the house entered the state of houselessness”"
  summary: 'The passage gives a victory exhortation to Mahavira, describes his praised
    public procession through Kundapura to the Shandavana park and the Asoka tree,
    then recounts his renunciatory acts: stopping the palankin, removing ornaments,
    plucking out his hair, fasting, putting on a divine robe, and entering houselessness.
    It then summarizes his later ascetic practice, nakedness, alms-taking, bodily
    neglect, endurance, circumspection, moral restraint, non-attachment, and purity
    through a series of similes.'
