  quote: ''
  summary: The passage is a scholarly introduction defending the authority of Jaina
    sacred books and beginning an inquiry into Mahavira. It reports Jaina claims that
    Mahavira was the son of King Siddhartha of Kundapura or Kundagrama, then argues
    that the tradition exaggerated the importance of the place and ruler. It uses
    Jaina and Buddhist textual references, including a Buddhist itinerary involving
    Buddha near Vesali, to locate Mahavira's birthplace.
