canonical_text:
  quote: ''
  summary: 'The passage summarizes Mahavira/Vardhamana’s genealogy and life-course:
    he remained with his parents until their death, entered a spiritual career at
    age twenty-eight with permission, practiced austerities for twelve years, went
    naked after the first year, attained Kevaliship and recognition as an omniscient
    Jaina prophet or Tirthakara, and spent thirty years teaching and organizing an
    ascetic order under princely patronage.'
  language: English
  quote_policy: summarized
