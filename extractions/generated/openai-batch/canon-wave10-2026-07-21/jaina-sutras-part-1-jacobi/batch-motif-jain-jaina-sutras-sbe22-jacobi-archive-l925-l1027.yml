canonical_text:
  quote: ''
  summary: The passage compares Jaina ascetic rules and practices with precepts attributed
    to Baudhāyana and related Brahmanic ascetic practice. It discusses wandering restrictions,
    hair removal, avoidance of harm to seeds and small beings, indifference to injury
    or kindness, Mahāvīra's endurance of pain, non-injury by word, thought, and act,
    water-straining cloths, insect-removing brooms, and ascetic equipment such as
    sticks, rope, water vessel, and alms-bowl.
  language: English
  quote_policy: summarized
