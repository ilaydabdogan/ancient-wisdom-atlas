canonical_text:
  quote: ''
  summary: 'Rules for Jain monks or nuns on a begging-tour: avoid hungry animals gathered
    around food if a byway is available; avoid intrusive postures, looking, pointing,
    or coercive gestures at a householder’s abode; request food properly from someone
    eating; refuse food made impure by washing or wiping hands or vessels with water,
    which the note explains is considered to contain life.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun on a begging-tour may encounter hungry animals, including chicken-kind,
    pig-kind, or crows, gathered in search of food where an offering has been thrown
    on the ground.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a byway is available in that situation, the monk or nun should avoid the
    animals rather than proceed straight ahead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A monk or nun should not stand leaning against parts of a householder’s abode
    such as the door-post, sink, or spitting-pot, nor stand in sight of or opposite
    the bathroom or privy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A monk or nun should not contemplate or point toward a loophole, mended spot,
    fissure, or bathing-house of the household.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A monk or nun should not beg by pointing at, moving, threatening, or scratching
    the householder with a finger, nor by praising him or using coarse language.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the monk or nun sees someone eating, such as the householder or his wife,
    the proper request is a verbal request for some of that food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the donor would wash or wipe a hand, pot, spoon, or plate with cold or
