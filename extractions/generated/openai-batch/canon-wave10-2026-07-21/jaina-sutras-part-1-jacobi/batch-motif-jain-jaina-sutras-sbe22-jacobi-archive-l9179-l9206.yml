canonical_text:
  quote: ''
  summary: 'The passage gives rules for monks or nuns selecting a place for study:
    they should reject a place infected by eggs or living beings and may accept one
    free from them. It cross-references similar rules about couches. It also forbids
    small parties of mendicants going to the study place from embracing, biting, or
    scratching one another.'
