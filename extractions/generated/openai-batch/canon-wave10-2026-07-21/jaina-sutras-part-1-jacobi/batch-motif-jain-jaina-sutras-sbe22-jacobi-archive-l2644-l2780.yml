canonical_text:
  quote: ''
  summary: A didactic lesson warns that longing for family, property, wealth, and
    sensory qualities leads to suffering, carelessness, violence, and decline; kin
    cannot protect one another. It urges timely entry into pilgrimage or religious
    life, control, desirelessness, and nonviolence. False ascetics who follow wrong
    instruction remain deluded, while those freed from attachment reach the opposite
    shore and are called houseless.
  language: English
  quote_policy: summarized
