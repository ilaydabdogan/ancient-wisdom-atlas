canonical_text:
  quote: ''
  summary: 'The passage gives a compressed life of the Arhat Parsva: his heaven-descending
    conception, royal birth, naming note involving a serpent seen by his mother, thirty
    years as householder, divine exhortation, departure in procession, fasting and
    hair-plucking renunciation, austerity, attainment of Kevala knowledge under a
    tree, organization of a large community, and institution of two epochs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage lists five important moments of Parsva''s life: descent and entry
    into the womb, birth, leaving the house for houselessness, attainment of Kevala
    knowledge and intuition, and final liberation; each is linked with the moon''s
    conjunction with Visakha.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parsva descended from the Priyata Kalpa after a divine life and took embryo
    form in the womb of queen Vama, wife of king Asvasena of Benares.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After nine months and seven and a half days, the queen gave birth at night
    to a healthy boy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A note says that before the birth, Parsva's mother saw a black serpent crawling
    in the dark, and that this was connected with the naming of the boy.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Parsva lived thirty years as a householder before Laukantika gods addressed
    him with words of victory.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Parsva rode in a palankin through Benares to Asramapada park and to an Asoka
    tree, followed by gods, men, and Asuras.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After fasting three and a half days without drinking water, Parsva put on
    a divine robe, tore out his hair together with three hundred men, left the house,
    and entered houselessness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Parsva neglected his body and meditated for eighty-three days during his houseless
    period.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the eighty-fourth day, under a Dhataki tree, after fasting two and a half
    days without water and while in deep meditation, Parsva reached Kevala knowledge
    and intuition.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Parsva is said to have had eight Ganas and eight Ganadharas, along with large
    numbers of monks, nuns, lay votaries, female lay votaries, sages, Kevalins, and
    disciples.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'Parsva instituted two epochs in his capacity as a Maker of an end: one relating
    to generations and one relating to psychical condition.'
  category: action
  evidence_refs:
  - ev:11
