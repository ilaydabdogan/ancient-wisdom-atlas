  quote: The (living) world is afflicted, miserable, difficult to instruct, and without
    discrimination.
  summary: The passage teaches that causes of sin should be comprehended and renounced.
    It describes the living world as full of pain, emphasizes beings embodied in earth,
    condemns harmful acts toward earth and earth-bodied beings, and states that such
    injury is associated with loss of happiness and wisdom, bondage, delusion, death,
    and hell. It also introduces a simile of cutting or striking a blind man and body
    parts.
