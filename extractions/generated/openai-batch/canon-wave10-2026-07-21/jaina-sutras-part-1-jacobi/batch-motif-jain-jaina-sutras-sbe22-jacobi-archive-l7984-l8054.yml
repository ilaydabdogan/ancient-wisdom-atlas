canonical_text:
  quote: ''
  summary: 'A monastic lesson instructs monks and nuns to avoid blameworthy speech,
    to speak with precision, moderation, and restraint, to distinguish certainty from
    uncertainty, and to recognize four kinds of speech: truth, untruth, mixed truth
    and untruth, and neither truth nor untruth. The passage says all past, present,
    and future Arhats teach these speech categories and adds a statement about speech
    before and during utterance.'
  language: English
  quote_policy: summarized
