canonical_text:
  quote: ''
  summary: 'The passage gives rules for monks and nuns on pilgrimage: they should
    wander circumspectly, cross shallow water in prescribed ways, avoid pleasure-seeking
    immersion and unnecessary rubbing, avoid damaging grass and vegetation, choose
    byways around obstacles or military groups, seek human help rather than grabbing
    plants if they fall, remain equanimous if seized, and refuse questions about village
    size and resources.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun on pilgrimage is told not to wander from village to village
    while conversing with householders, but may wander circumspectly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When encountering shallow water, the monk or nun is instructed to wipe the
    body from head to heels and wade through in a straight line with one foot in the
    water and the other in the air.
  category: action
  evidence_refs:
  - ev:2
  - ev:11
- id: obs:3
  text: The monk or nun crossing shallow water should avoid being touched by, or touching,
    another person's or their own hand, foot, or body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The monk or nun should not enter deeper water for pleasure or heat and should
    remain on the bank with a wet or moist body if able to leave the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage repeats a rule that a monk or nun should not wipe or rub, referring
    back to an earlier rule outside this excerpt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: With muddy feet, the monk or nun should not leave the way so that grass removes
    the mud, because this would destroy grass by cutting, trampling, and tearing;
    instead, a path with little grass should be inspected.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When coming upon walls, ditches, ramparts, gates, bolts, holes, moats, or
    caves, the monk or nun should choose a byway if one exists rather than continue
    straight.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Kevalin explains that the mendicant might stumble or fall and grab vegetation
    to get free; instead the mendicant should ask travellers for a hand and lean on
    it to extricate himself.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When encountering transports, vehicles, armies, or encamped troops, the monk
    or nun should choose a byway if available rather than go straight.
  category: action
  evidence_refs:
  - ev:9
  - ev:12
- id: obs:10
  text: A trooper might accuse the mendicant of spying on the army and have him dragged;
    the mendicant is instructed to be neither glad nor sorry.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:12
- id: obs:11
  text: If travellers ask about a village or town, its inhabitants, animals, food,
    water, population, or corn, the mendicant should neither answer nor ask such questions.
  category: speech
  evidence_refs:
  - ev:10
