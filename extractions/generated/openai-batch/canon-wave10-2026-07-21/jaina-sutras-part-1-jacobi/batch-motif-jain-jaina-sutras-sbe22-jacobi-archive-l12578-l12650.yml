literal_observations:
- id: obs:1
  text: 'Mahavira is said to have instituted two epochs in his capacity as a Maker
    of an end: one relating to generations and one relating to psychical condition.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the epoch relating to generations ended in the third generation,
    and the epoch relating to psychical condition ended in the fourth year of Mahavira's
    Kevaliship.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage enumerates Mahavira''s life phases: thirty years as a householder,
    more than twelve years in a state inferior to perfection, something less than
    thirty years as a Kevalin, forty-two years as a monk, and seventy-two years overall.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mahavira's death is placed after the exhaustion of karmans producing experience,
    length of life, name, and family.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The death is dated within the Avasarpini era and the Duhshamasushama period,
    with three years and eight and a half months remaining in that period.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The death is located at early morning in the town of Papa, in king Hastipala's
    office of the writers, while the moon is in conjunction with the asterism Svati.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mahavira is described as single and alone, sitting in the Samparyarika posture,
    reciting fifty-five lectures on the results of karman and thirty-six unasked questions,
    and explaining the chief lecture of Marudeva.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mahavira dies and is described as freed from all pains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A commentary note interprets the epoch passage as meaning that after three
    generations no one reached Nirvana, and after the fourth year of Mahavira's Kevaliship
    no one entered the path ending in final liberation.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: A later chronological notice says nine centuries had elapsed since Mahavira's
    death, with variant redactions giving the eightieth or ninety-third year of the
    tenth century.
  category: other
  evidence_refs:
  - ev:7
