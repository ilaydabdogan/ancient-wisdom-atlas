  summary: The passage states that Mahavira began the Pajjusan observance after one
    month and twenty nights of the rainy season had passed. It explains this timing
    by saying that lay people had by then prepared, repaired, furnished, and cleaned
    their houses. The same timing is then attributed to the Ganadharas and to the
    disciples of the Ganadharas.
