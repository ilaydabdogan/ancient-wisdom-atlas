canonical_text:
  quote: ''
  summary: The lesson gives rules for a naked monk. If he can endure bodily pains
    but cannot give up covering the privities, he may use a specified cloth. A naked
    monk is described as enduring grass, cold, heat, flies, and mosquitos, while aspiring
    to freedom from bonds and conforming to what the Revered One declared. The passage
    then lists vows concerning collected food, eating food brought by other monks,
    and mutual assistance with acceptable unchanged dinner remnants, to be kept even
    at risk of life.
  language: English
