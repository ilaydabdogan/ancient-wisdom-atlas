canonical_text:
  quote: 'This is the rule which has often been followed by the wise Brâhmaṇa, the
    Venerable One, who is free from attachment: thus proceed (the monks).'
  summary: The passage presents the Venerable One or great Hero as an ascetic model
    who understands karman, avoids injury and sinful action, limits food and possessions,
    wanders houseless, meditates in varied resting places for thirteen years, endures
    attacks, sensory hardships, cold, and mistreatment, and is offered as the rule
    for monks to follow.
  language: English
  quote_policy: quoted
