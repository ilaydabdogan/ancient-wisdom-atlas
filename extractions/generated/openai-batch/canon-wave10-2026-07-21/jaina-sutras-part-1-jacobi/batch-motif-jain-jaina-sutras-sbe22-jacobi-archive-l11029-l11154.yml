canonical_text:
  quote: ''
  summary: A divine agent ascends to the Saudharma heaven and reports to Sakra. Mahavira’s
    embryo is removed by Harinegamesi, on Sakra’s command, from the womb of the Brahmani
    Devananda to that of the Kshatriyani Trisala at a specified night and lunar conjunction.
    Devananda awakens after seeing fourteen auspicious dreams taken from her by Trisala.
    Trisala, lying in an ornate and fragrant chamber, sees fourteen dreams and awakes;
    the passage describes the first three dreams as a white elephant, a white bull,
    and a white lion.
  language: English
