canonical_text:
  quote: The unwise sleep, the sages always wake.
  summary: The passage contrasts unwise, deluded, desire-driven persons with sages
    who know the law, restrain sensory attachment, practice nonviolence, remain equanimous
    amid heat and cold and pleasure and pain, examine karman and its root in killing,
    and seek liberation from death and rebirth through religious life, truth, and
    restraint.
  language: English
  quote_policy: quoted
