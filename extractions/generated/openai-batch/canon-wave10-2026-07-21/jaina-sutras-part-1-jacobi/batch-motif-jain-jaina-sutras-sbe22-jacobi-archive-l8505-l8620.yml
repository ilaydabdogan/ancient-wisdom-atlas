canonical_text:
  quote: ''
  summary: Rules for Jain monks and nuns concerning drying, begging, wearing, borrowing,
    altering, and protecting clothes. The passage emphasizes careful inspection, wearing
    clothes as received, restrictions on washing, dyeing, exchange, or appropriation,
    and calm adherence to the road and contemplation when threatened by thieves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun should not dry clothes on above-ground places such as dykes,
    walls, rocks, stones, pillars, platforms, scaffolds, upper stories, or flat roofs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note explains that if a garment falls to the ground it may contact dust,
    contain living beings, and no longer be pure.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For drying clothes, the monk or nun should resort to a secluded spot and use
    an inspected and cleaned heap of ashes or bones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A monk or nun should beg for acceptable clothes and wear them in the condition
    in which they are received.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A monk or nun should not wash or dye clothes, wear washed or dyed clothes,
    or hide clothes when passing through other villages.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For alms, religious practices, study, or wandering from village to village,
    a monk or nun should be outfitted with all their clothes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When strong and widespread rain is pouring down, a dressed monk or nun should
    not enter or leave a householder's abode for alms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a single mendicant borrows a robe for a short time and returns after one
    to five days, the robe's owner should not take it for himself, give it away, exchange
    it, solicit another wearer, or discard it by rending it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The same rule applies when many mendicants borrow clothes for a short time
    and return after one or more days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Borrowing a robe with the thought that it might thereby become one's own is
    described as sinful and prohibited.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: A monk or nun should not make colored clothes colorless, color colorless clothes,
    give them away in order to get other clothes, give them on promise, exchange them,
    solicit another wearer, or rend strong clothes to make another mendicant think
    them bad.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: If thieves are seen on the road, the mendicant should not leave the road out
    of fear or to save clothes, but should collect himself for contemplation and continue
    wandering circumspectly.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: If a pilgrimage road passes through a forest with bands of thieves desirous
    of clothes, the monk or nun should not leave the road to save the clothes.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:14
  text: When thieves demand the robe, the monk should not give or deliver it and should
    act as prescribed elsewhere in the text.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:15
  text: A translator's note states that the word rendered as robe is uncertain and
    the translation is conjectural.
  category: other
  evidence_refs:
  - ev:6
