canonical_text:
  quote: ''
  summary: Rules for monks and nuns traveling on pilgrimage when rain, forests, watercourses,
    boats, boatmen, leaks, threats of being thrown into water, swimming, and wet bodies
    are encountered. The passage repeatedly instructs mendicants to act circumspectly,
    avoid participation in boat work, remain silent or contemplative in several situations,
    refrain from violent resistance, and avoid attachment to implements if weakened
    in water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rain or a wet route is described as involving possible injury to living beings,
    mildew, seeds, grass, water, and mud; after such circumstances the mendicant may
    wander circumspectly from village to village.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A monk or nun on pilgrimage should not board a boat for crossing a watercourse
    if they know the householder will buy or purloin the boat, prepare or move it,
    bale it, or make a sinking boat float.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a boat is to cross the river, the monk or nun should receive the owner's
    permission, step apart, examine the outfit, put aside provender, wipe the body,
    reject the householder's food, and enter the boat circumspectly with one foot
    in the water and the other in the air.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In entering the boat, the monk or nun should not choose the stern, prow, or
    middle, and should not gesture toward the boat with raised arms, pointing fingers,
    or bowing up and down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If asked on board to pull, push, draw, or help move the boat, the monk should
    not comply but should look on silently.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: If asked to give the rope to others so they may move the boat, the monk should
    not comply but should look on silently.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: If asked to move the boat with oar, rudder, pole, or other nautical instruments,
    the monk should not comply but should look on silently.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: If asked to lade water out of the boat with hand, pitcher, vessel, alms-bowl,
    or bucket, the monk should not comply but should look on silently.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: If asked to stop a boat leak with body parts, a bucket, cloth, mud, grass,
    or lotus leaves, the monk should not comply but should look on silently.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: If the monk or nun sees water entering through a leak and the boat becoming
    dirty, they should not tell the boatman; instead they should collect themselves
    for contemplation and complete the journey by boat on the water.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: If asked to take an umbrella, pot, dangerous instruments, or let a boy or
    girl drink, the mendicant should not comply but should look on silently.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: If the boatman tells another crew member that the Sramana is a heavy load
    and should be thrown into the water, the mendicant should quickly manage their
    clothes by removing, fastening, or bundling them on the head.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Anticipating being thrown into the water, the mendicant should ask the householders
    not to seize and throw them, saying they will leap into the water themselves.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: If seized and thrown into the water by force, the mendicant should be neither
    glad nor sorry, should not resist violently, and may swim circumspectly.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: While swimming, a monk or nun should not touch hand, foot, or body with their
    own hand, foot, or body, but should swim circumspectly.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: While swimming, a monk or nun should not dive up or down, lest water enter
    ears, eyes, nose, or mouth.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: If overcome by weakness while swimming, a monk or nun should throw off all
    or part of their implements and not be attached to them.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: If able to get out of the water and reach the bank, the monk or nun should
    remain there with a wet or moist body.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:19
  text: The monk or nun should not wipe, rub, brush, stroke, dry, warm, or heat the
    body until the water has dried and moisture is gone; afterward they may tend the
    body and wander from village to village.
  category: sequence
  evidence_refs:
  - ev:18
