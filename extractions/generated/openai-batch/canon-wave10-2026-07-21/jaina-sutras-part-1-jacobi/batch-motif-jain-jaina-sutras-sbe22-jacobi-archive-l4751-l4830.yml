canonical_text:
  quote: ''
  summary: The lesson prescribes rules for a mendicant’s minimal clothing and bowl,
    the discarding of worn garments, refusal of food brought by a householder during
    illness, vows governing assistance among fellow-ascetics, and adherence to vows
    concerning begging and eating when sick. It states that such practice brings tranquility
    and may end in putting an end to existence; a note identifies rejection of food
    and drink as a liberation-associated method.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mendicant equipped with two robes and a bowl as a third article is told
    not to seek a third robe and to use only robes allowed to be begged for.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After winter has passed and the hot season has come, the mendicant is to discard
    used-up garments and may be clothed in an undermost garment, a gown, or no clothes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage links the clothing rule with aspiring to freedom from bonds, states
    that penance suits the mendicant, and instructs conformity to what the Revered
    One declared.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When a sick mendicant is too weak to beg and a householder brings acceptable
    food or similar items, the mendicant should deliberate and refuse to eat, drink,
    or accept them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A mendicant may resolve to accept unasked assistance from healthy fellow-ascetics
    when sick and to give unasked assistance to sick fellow-ascetics when healthy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the mendicant should not deviate from that resolution even
    if he dies for want of help.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The lesson lists vows concerning whether to beg for another sick person and
    whether to eat what another brings when one is sick, and says one should adhere
    to the chosen vow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Practicing the declared law is said to make one tranquil, averted from sin,
    and guarded against allurements of the senses.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says that, even though sick, the practitioner will in due time
    put an end to existence, and that many free from delusion have adopted this method.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The translator’s note identifies the method as rejecting food and drink and
    calls it bhaktapanapratyakhyanamukti, saying it seems to have been regarded as
    leading to final liberation.
  category: other
  evidence_refs:
  - ev:5
