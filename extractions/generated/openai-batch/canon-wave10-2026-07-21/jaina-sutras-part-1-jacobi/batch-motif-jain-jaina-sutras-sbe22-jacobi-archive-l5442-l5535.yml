canonical_text:
  quote: ''
  summary: 'The passage describes Mahavira''s ascetic discipline: refusal of bodily
    treatment, aversion to sense impressions, exposure to seasonal hardship, rough
    and infrequent food and drink, careful alms-begging without harming creatures,
    motionless meditation, restraint from sin, purification of the soul, and liberation
    from delusion.'
  language: English
  quote_policy: summarized
