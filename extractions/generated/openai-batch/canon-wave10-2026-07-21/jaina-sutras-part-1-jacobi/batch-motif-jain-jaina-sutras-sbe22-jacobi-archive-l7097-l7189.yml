canonical_text:
  quote: ''
  summary: The passage gives rules about mendicants accepting or avoiding lodgings
    offered by householders. It lists many possible lodging places, describes lay
    donors who believe lodging gifts have merit, and classifies different offered
    or prepared lodgings according to types and degrees of sin, especially when preparation
    causes injury to earth, water, fire, wind-bodies, plants, and animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Faithful householders and householders' wives are described as not fully acquainted
    with monastic lodging rules but convinced of the merit of giving lodging to mendicants.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The donors provide lodging places for Śramaṇas, Brāhmaṇas, guests, paupers,
    and beggars in many kinds of places, including workshops, chapels, temples, halls,
    wells, empty houses, hill-houses, caves, stone-houses, and palaces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A mendicant is instructed to warn persons living with other guests in such
    places that they sin by living in a place frequented by other sectarians.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: If mendicants come to such lodgings when other religious men do not come there,
    the passage says they sin by living in a place not frequented by other mendicants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some householders propose to give mendicants lodgings already prepared for
    the householders' own use and then prepare replacement lodgings for themselves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lodgings ceded by others under the described circumstances are said to be
    infected by named sins, including varṇakriyā, mahāvarṇakriyā, sāvadya-kriyā, and
    mahāsāvadya-kriyā.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
- id: obs:7
  text: One type of lodging preparation is said to involve great injury to earth,
    water, fire, wind-bodies, plants, and animals, through acts such as wasting cold
    water, strewing or smearing the ground with cowdung, shutting doors, securing
    the bed, and lighting a fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: If lodgings are prepared by householders for their own sake under the same
    harmful circumstances, mendicants who frequent them are said to lead an unambiguous
    life, and the lodging is associated with a very small sin called alpasāvadya-kriyā.
  category: attribute
  evidence_refs:
  - ev:9
