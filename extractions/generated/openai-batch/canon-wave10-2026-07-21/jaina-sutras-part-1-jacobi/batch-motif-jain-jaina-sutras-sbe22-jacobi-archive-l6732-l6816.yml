canonical_text:
  quote: ''
  summary: The passage lists seven rules for mendicants begging food and corresponding
    rules for begging drink. The rules define acceptable circumstances involving wet
    or not-wet hands and vessels, householders placing alms in bowls or hands, foods
    requiring little cleaning, offerings with nearly dried hand-moisture, food taken
    from the ground, food not wanted by others, and water previously used with flour
    or sesamum. It closes with a fragmentary admonition against declaring other reverend
    persons' chosen rule wrong.
  language: English
  quote_policy: summarized
