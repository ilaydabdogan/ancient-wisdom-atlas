canonical_text:
  quote: ''
  summary: The lesson teaches reflection on repeated births in high and low families,
    warns against pride, anger, and attachment to possessions, states that all beings
    value life and dislike pain, and contrasts the worldly fool trapped in birth,
    death, and suffering with the clever one who adopts true faith and control. It
    uses the image of beings unable to cross a flood or reach the shore, glossed in
    the passage note as saṃsāra figured as a lake or slough.
  language: English
  quote_policy: summarized
