canonical_text:
  quote: ''
  summary: The passage gives rules for monks and nuns concerning speech. It forbids
    sinful, abusive, rough, harmful, divisive, or violence-encouraging language; prescribes
    accurate and blameless speech; gives examples of respectful address; rejects weather
    and crop statements framed as acts of gods; and instructs ascetics how to speak
    about sickness, qualities, crafted things, food, animals, and cattle without provoking
    anger or implying harm.
  language: English
  quote_policy: summarized
