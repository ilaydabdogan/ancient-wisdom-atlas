canonical_text:
  quote: ''
  summary: The introduction argues about the chronology and possible borrowing of
    Brahmanic ascetic practices by Jainas and Buddhists. It states that Gautama is
    older than Baudhāyana and perhaps before Buddhism, that Brahmanic asceticism was
    already complete in Gautama's law code, that Buddhists were more likely to borrow
    from Brahmans than the reverse, and that Jaina and Buddhist monastic orders were
    copied from Brahmans and originally directed chiefly to Kshatriyas.
  language: English
  quote_policy: summarized
