canonical_text:
  quote: ''
  summary: The passage teaches non-injury toward earth-bodies and water-bodies, describes
    water as containing many lives and as living matter, instructs houseless practitioners
    to preserve faith and self-control, and associates injurious acts toward water
    with bondage, delusion, death, hell, and loss of happiness and perfect wisdom.
    It also notes the straining of water and rejects a Bauddha permission claim about
    using water.
  language: English
  quote_policy: summarized
