canonical_text:
  quote: ''
  summary: King Siddhartha completes bathing and adornment, enters the audience hall
    with royal attendants, sits facing east, arranges state chairs and a curtained
    seat for Trisala, summons dream interpreters, receives them formally, and asks
    them to explain the result portended by Trisala's fourteen great dreams. The interpreters
    prepare ritually, arrive, consider the dreams, and consult dream-books before
    answering.
  language: English
  quote_policy: summarized
