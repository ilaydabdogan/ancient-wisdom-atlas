canonical_text:
  quote: ''
  summary: 'The passage explains five clauses of the first great vow, abstinence from
    killing living beings: a Nirgrantha is careful in walking, examines his mind,
    examines his speech, carefully lays down begging utensils, and inspects food and
    drink, all to avoid harm to living beings. It then introduces the second great
    vow, renouncing lying speech, and begins its first clause: a Nirgrantha speaks
    after deliberation to avoid falsehood.'
