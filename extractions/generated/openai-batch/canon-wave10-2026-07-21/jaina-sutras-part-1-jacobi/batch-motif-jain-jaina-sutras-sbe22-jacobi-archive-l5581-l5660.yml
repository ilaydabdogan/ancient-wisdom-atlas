canonical_text:
  quote: ''
  summary: 'A disciplinary passage gives rules for monks and nuns on begging-tour:
    food and drink must be inspected for living beings or living substances; unacceptable
    remains are to be left in a secluded cleaned place; living herbs, beans, and insufficiently
    processed grains are rejected; lifeless or more thoroughly processed foods may
    be accepted; ascetics should avoid certain companions and should not give or receive
    food in improper exchanges involving forbidden recipients or violent acquisition.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Food or drink is to be inspected for living beings and substances such as
    sprouts, dew, water, ants, mildew, drops of water, mud, and cobwebs before it
    is eaten or drunk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Food or drink that cannot be eaten or drunk is to be left at a secluded spot
    on materials such as ashes, bones, rusty things, chaff, or cowdung, after the
    place has been examined and cleaned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A monk or nun should not accept herbs or fresh beans that are whole, retain
    their source of life, and are still alive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A monk or nun may accept herbs or fresh beans that are split, no longer contain
    their source of life, and are lifeless.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Flattened grains, chaffy grains, half-roasted spikes, flours, rice, or rice
    flour are rejected if only once worked, but may be accepted when worked twice
    or thrice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage forbids a monk or nun from entering or leaving householders' abodes,
    religious or study places, or wandering from village to village together with
    a heretic or a householder; it also forbids an observant monk from doing so with
    one who does not avoid forbidden food.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A monk or nun should not give food to a heretic or householder; likewise,
    a monk who avoids forbidden food should not give it to one who does not.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A monk or nun should not accept food from a householder when it is known to
    have been bought, stolen, taken by force, or obtained through sinful action toward
    living beings for the sake of a fellow-ascetic.
  category: action
  evidence_refs:
  - ev:6
