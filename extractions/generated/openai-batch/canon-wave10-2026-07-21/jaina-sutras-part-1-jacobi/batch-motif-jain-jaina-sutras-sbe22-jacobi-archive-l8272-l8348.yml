  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A youthful, young, strong, healthy, well-set monk may wear one robe, not two;
    a nun should possess four raiments of specified widths.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the specified pieces of cloth are not received, pieces may later be sewn
    together.
  category: action
  evidence_refs:
  - ev:1
