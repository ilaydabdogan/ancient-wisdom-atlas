canonical_text:
  quote: ''
  summary: 'This passage gives rules for Jain monks and nuns begging clothing: allowable
    materials, limits on robes or raiments, a distance limit for seeking clothes,
    repeated rules from food-begging, restrictions on accepting specially prepared
    or costly garments, and the first of four rules for begging clothes in order to
    avoid occasions to sin.'
