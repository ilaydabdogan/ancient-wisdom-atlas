canonical_text:
  quote: ''
  summary: The passage gives rules for monks or nuns performing religious postures.
    They should enter a settlement but not accept a place infected by eggs or living
    beings, because such a place is impure and unacceptable. A mendicant avoiding
    occasions to sin may choose among rules for religious postures. The first rule
    is to choose something inanimate, lean against it, adjust the body slightly, and
    stand there. The second rule begins by repeating the choice of something inanimate
    and leaning against it.
