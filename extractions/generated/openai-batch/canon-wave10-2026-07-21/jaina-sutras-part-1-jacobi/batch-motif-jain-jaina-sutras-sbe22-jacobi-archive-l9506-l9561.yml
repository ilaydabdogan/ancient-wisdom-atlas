canonical_text:
  quote: ''
  summary: The passage lists bodily interventions and ministrations involving washing,
    cutting, extracting fluids, wiping impurities, cutting hair, removing lice, rubbing
    feet, adorning with ornaments, garden or park treatment, charms, and cutting living
    plant matter for a sick monk. It repeatedly states that one should neither be
    pleased with nor prohibit such actions by another person, and concludes that sensation
    results from former actions and is experienced by all sorts of living beings.
