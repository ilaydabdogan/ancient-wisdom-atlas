canonical_text:
  quote: ''
  summary: 'The passage lists small sprouts, small flowers, small eggs, small caves
    or lairs, and small moisture as things to be inspected by monks and nuns. It then
    gives rules for a monk during the Pa^usan who wishes to go for alms, visit temples,
    leave the house for bodily needs or other business, wander between villages, or
    take medicine: he must ask permission from a teacher or other superior, and he
    may proceed only if permission is granted.'
  language: English
  quote_policy: summarized
