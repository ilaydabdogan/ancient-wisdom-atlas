canonical_text:
  quote: ''
  summary: 'Rules for monks and nuns on begging-tour: avoid certain royal houses,
    avoid or permit attendance at entertainments according to food, living beings,
    and crowding, wait before entering a household until milking and food distribution
    are complete, and address issues of begging in small or populous villages and
    visiting kin for food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun on a begging-tour is told not to accept food in the houses of
    Kshatriyas, kings, messengers, or relations of kings, whether inside or outside,
    because such food is described as impure and unacceptable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A monk or nun should not resolve to go to a festival, wedding breakfast, funeral
    dinner, or family dinner when meat, fish, or roasted slices of meat or fish will
    chiefly be served.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same prohibition is linked to paths containing many living beings, seeds,
    sprouts, dew, water, mildew, drops of water, dust, and cobwebs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A crowded assembly with many Śramaṇas, Brāhmaṇas, guests, paupers, and beggars
    is described as unsuitable when a wise man cannot enter or leave it or study,
    question, repeat, consider, or think about the law there.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A monk or nun may go to such an entertainment if the route has few living
    beings, seeds, and related obstacles, if the listed visitors will not arrive,
    and if the assembly is not crowded.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A monk or nun wishing to enter a householder's abode should not enter while
    cows are being milked or food is being cooked and not yet distributed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After seeing milking or cooking in progress, the monk or nun should step aside
    and stay where no people pass or see them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the cows are milked and the dinner is prepared and distributed, the
    monk or nun may carefully enter or leave the householder's abode for alms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some mendicants tell fellow mendicants that a small, populous village is not
    large and that they should go to outlying villages to beg alms.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A mendicant may have kinsmen or relations in a place, including householders,
    wives, daughters, daughters-in-law, nurses, slaves, and servants.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Such a mendicant intends to visit related families before begging time, expecting
    to get food, dainties, dairy products, sweeteners, oil, honey, meat, liquor, and
    prepared dishes.
  category: action
  evidence_refs:
  - ev:10
