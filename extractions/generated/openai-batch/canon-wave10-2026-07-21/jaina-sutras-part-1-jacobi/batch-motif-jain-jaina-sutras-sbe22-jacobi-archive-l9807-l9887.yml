  summary: The passage says that, on an astrologically marked day, the ascetic Mahivtra/Vlra
    resolved to retire from the world. It describes the customary year-long giving
    of property before a Gina's renunciation, divine orders waking the Tirthakara
    to propagate religion, the arrival of gods and goddesses at Kiw(/apura, and Sakra's
    creation of a divine pavilion with a throne, followed by ritual worship, anointing,
    bathing, clothing, and adornment of the ascetic.
  language: English
  quote_policy: quoted
