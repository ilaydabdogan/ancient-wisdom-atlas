canonical_text:
  quote: ''
  summary: The passage gives rules for Jain monks and nuns about walking and residence.
    During the rainy season, because many living beings and seeds arise and roads
    contain living beings and become hard to recognize, they should not wander between
    villages but remain in one place. It also says that if a village lacks space for
    religious practice or study, lacks suitable furniture and pure alms, has many
    other mendicants and needy people, and has very small means of existence, monks
    and nuns should not remain there during the cold season.
  language: English
  quote_policy: summarized
