canonical_text:
  quote: ''
  summary: The lesson describes awakened persons who receive teaching, renounce pleasure,
    harm, and forbidden desire, and are called unfettered when desireless and harmless.
    It describes the passionless mendicant as practicing self-control, pity, proper
    measure, and progress toward final liberation after cutting off love and hate.
    In a dialogue, a cold mendicant refuses to kindle fire, or have another kindle
    it, for bodily warmth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some persons are awakened as middle-aged men and exert themselves after hearing
    and receiving the word of the learned; noble ones have preached the law impartially.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The awakened are instructed not to wish for pleasure, do harm, or desire forbidden
    things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person without desires who does no harm to living beings in the whole world
    is called unfettered.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: One free from passions is said to understand the bright one, glossed in the
    note as self-control, and to know birth in upper and nether regions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bodies are described as increasing through nourishment but being frail in
    hardships, with organs failing through weakness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A desireless person cherishes pity; a mendicant who understands the doctrine
    of sin knows time, strength, measure, occasion, conduct, and religious precept,
    and disowns things not required for religious purposes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mendicant exerts himself in time, is under no obligations, and proceeds
    securely on the road to final liberation after cutting off both love and hate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A householder approaches a mendicant whose limbs tremble from cold and asks
    whether he is subject to the influences of his senses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mendicant says he is not subject to the influences of his senses, but
    cannot sustain the feeling of cold; he also says it does not become him to kindle
    or light a fire for warmth or procure that comfort through the order of others.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: If the other person kindles or lights a fire for the mendicant, the mendicant
    should observe and understand this and order him to show no such obsequiousness.
  category: sequence
  evidence_refs:
  - ev:7
