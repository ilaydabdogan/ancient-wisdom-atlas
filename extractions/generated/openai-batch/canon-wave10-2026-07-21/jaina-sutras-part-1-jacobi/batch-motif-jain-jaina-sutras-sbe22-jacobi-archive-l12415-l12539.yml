canonical_text:
  quote: ''
  summary: The passage describes Mahavira's final liberation and death under a precise
    calendrical and astral configuration. The night is marked by descending and ascending
    gods, divine light, noise, Indrabhuti's attainment of Kevala, royal institution
    of an illumination on a new-moon fasting day, the entry of an ominous Graha into
    Mahavira's natal asterism, the origin of an animalcule affecting alms discipline,
    and an enumeration of Mahavira's community.
  language: English
  quote_policy: summarized
