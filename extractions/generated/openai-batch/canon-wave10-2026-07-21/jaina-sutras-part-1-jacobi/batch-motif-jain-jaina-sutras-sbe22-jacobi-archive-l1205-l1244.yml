canonical_text:
  quote: ''
  summary: The passage argues that Jainism should not be derived from Buddhism and
    that their principal doctrines differ. It contrasts Buddhist teaching on Nirvana,
    the Buddhist rejection of the Brahmanic Atman theory, Jain acceptance of Atman
    with a different account of its spatial extent, Buddhist Skandhas, Jain hylozoism
    in which animals, plants, and elemental particles have souls, and a Jain fivefold
    theory of right knowledge culminating in omniscience.
