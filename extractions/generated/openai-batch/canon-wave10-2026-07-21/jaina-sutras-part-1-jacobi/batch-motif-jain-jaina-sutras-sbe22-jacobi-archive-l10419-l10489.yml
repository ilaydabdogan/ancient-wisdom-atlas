canonical_text:
  quote: ''
  summary: The passage gives clauses concerning sensory restraint for a Nirgrantha
    or mendicant. Sounds, forms, smells, tastes, and touches may be agreeable or disagreeable,
    but the practitioner should not become attached, covetous, disturbed, loving,
    or hateful toward them. It concludes that one who correctly practices the great
    vows and their twenty-five clauses is truly Houseless.
