  quote: ''
  summary: Rules for monks and nuns begging for, accepting, using, returning, and
    preparing couches or beds; inspecting places and bodily actions to avoid injury
    and harm to living beings; and remaining content in difficult lodging conditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk or nun may beg for a couch by specifying permitted materials such as
    reeds, grasses, peacock feathers, hay, brush-hair, Pippala, or straw.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the householder prepares or gives the requested couch, the mendicant may
    accept it as pure and acceptable.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a monk or nun requests a couch from the householder in whose house they
    live and does not receive it, they should remain squatting or sitting for the
    whole night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A couch should not be given back if it contains eggs or living beings; if
    it contains few living beings, it may be returned only after restrained inspection,
    sweeping, and drying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On a begging-tour, in residence, or on pilgrimage, a monk or nun should inspect
    the place for easing nature before using it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The stated reason for inspecting such a place is to avoid stumbling or falling
    and thereby hurting oneself or killing living beings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before spreading a bed or couch, the monk or nun should inspect and sweep
    the floor and choose a place with attention to other occupants and environmental
    conditions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before ascending a pure bed or couch, the monk or nun should wipe the body
    from head to heels and then sleep circumspectly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: While sleeping, a monk or nun should keep enough distance not to touch a neighbour’s
    hand, foot, or body.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before breathing out, coughing, sneezing, yawning, vomiting, or eructating,
    the monk or nun should cover the face or the place where the face lies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The monk or nun should remain content in lodging whether it is even or uneven,
    dusty or not, draughty or not, full of insects or not, and whether or not it contains
    dangers and troubles.
  category: attribute
  evidence_refs:
  - ev:9
