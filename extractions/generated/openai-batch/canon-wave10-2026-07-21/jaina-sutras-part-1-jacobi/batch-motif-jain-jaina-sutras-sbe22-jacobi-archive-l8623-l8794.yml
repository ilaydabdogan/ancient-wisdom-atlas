canonical_text:
  quote: ''
  summary: The passage gives rules for Jain monks and nuns begging for an alms-bowl.
    It permits simple bowls of bottle-gourd, wood, clay, or similar materials, forbids
    costly or specially prepared bowls, sets four rules for acceptable begging, instructs
    mendicants to reject bowls made impure by preparation or filling, and requires
    inspection of the bowl to avoid living beings, seeds, grass, or dust.
  language: English
  quote_policy: summarized
