canonical_text:
  quote: ''
  summary: The passage gives rules for a Jain mendicant, monk, or nun concerning renunciation
    of ownership, taking or using objects only with permission and inspection, seeking
    temporary domicile, sharing or offering goods to fellow ascetics, borrowing and
    returning small tools, avoiding unsuitable places, not disturbing prior occupants,
    and selecting mangoes or mango parts according to stated conditions involving
    eggs, living beings, animal nibbling, and injury.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person taking the vows declares the intention to become a Śramaṇa without
    house, property, sons, or cattle, to eat what others give, to commit no sinful
    action, and not to accept what has not been given.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After taking such vows, a mendicant is instructed not to take, cause others
    to take, or allow others to take anything that has not been given when entering
    a village or town.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mendicant may take or appropriate another monk's umbrella, vessel, stick,
    or similar property only after receiving permission and after inspecting and wiping
    the object.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A mendicant may ask for a domicile in a traveller's hall or similar place
    after reflecting on its fitness and must request permission from the landlord
    or steward for a bounded time, space, and number of ascetics.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After obtaining a place, a mendicant should invite arriving fellow-ascetics
    of the same rules to food he has collected, but not to anything held for somebody
    else.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After obtaining a place, a mendicant should offer begged furniture to arriving
    zealous ascetics who follow other rules, but not offer anything held for somebody
    else.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A mendicant may borrow a needle, Pippalaka, ear-picker, or nail-parer from
    a householder or his sons, must not give or lend it to someone else, and should
    return it without placing it directly into the householder's hand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A monk or nun should not take possession of anything in places described as
    bare ground, wet ground, places with eggs, pillars, walls, tree trunks, householders,
    fire, water, women, children, cattle, conflict, body-rubbing, bathing, nakedness,
    or inaccessible conditions.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: After a place is taken, the mendicant should not move belongings of previously
    settled Śramaṇas or Brāhmaṇas from outside to inside or inside to outside, wake
    a sleeping person, or molest the inmates.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A monk or nun wishing to go to a mango park should ask permission from the
    landlord or steward before taking possession of the place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A mango or mango part covered with eggs or living beings is not to be taken;
    a mango free from eggs and living beings but not nibbled or injured is also not
    to be taken; a mango or mango part free from eggs and living beings and nibbled
    or injured may be taken.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
