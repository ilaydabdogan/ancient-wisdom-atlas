canonical_text:
  quote: ''
  summary: A rule for male or female mendicants collecting alms says they must not
    accept food, drink, dainties, or spices found to be affected by living beings,
    mildew, seeds, sprouts, water, or dust, even if obtainable, because such food
    is impure and unacceptable. If such food is accepted under pressing circumstances,
    the mendicants should go to a secluded spot, garden, or monk's hall.
  language: English
