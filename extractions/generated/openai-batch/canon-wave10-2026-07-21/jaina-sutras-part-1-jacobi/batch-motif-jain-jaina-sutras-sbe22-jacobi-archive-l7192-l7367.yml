canonical_text:
  quote: ''
  summary: The passage gives Jain monastic rules about acceptable alms, lodging, entry
    and exit from cramped lodgings, asking permission to dwell temporarily, avoiding
    household spaces for religious postures, and accepting a couch only under conditions
    that avoid harm and occasions to sin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that pure, acceptable alms are difficult to obtain because
    lodging or alms may involve preparations such as strewing grass, smearing cowdung,
    shutting doors, and securing beds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mendicant is described as delighting in pilgrimage, religious exercises,
    study, and begging for a bed, couch, or other alms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some mendicants explain the requisites of lodging and are called upright,
    seeking liberation, and practising no deceit.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some householders may try to deceive mendicants by saying a lodging was assigned
    to them, prepared for the householders or their relations, used, or relinquished.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: A mendicant entering or leaving a small, low, or cramped lodging at night
    or twilight is instructed to put forward the hand first and then the foot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The reason given is that loose objects in the lodging could make the mendicant
    stumble or fall, injure hand or foot, and kill living beings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: At halting-places, the mendicant should inquire who the landlord or tenant
    is and ask permission to dwell temporarily in the lodging granted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mendicant’s answer to limits on lodging states that the lodging will be
    occupied only as long as it belongs to the host or for as many fellow-ascetics
    as need it, after which they will wander.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A monk or nun who knows the name and gotra of the person whose lodging is
    used should not accept food in that house, whether invited or not.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A lodging used by a householder or containing fire or water should not be
    used for religious postures.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Other unsuitable lodgings include those requiring passage through the householder’s
    abode, those with no road, those where household members quarrel, and those where
    bodily anointing, perfuming, washing, nakedness, sexual talk, secret planning,
    or frequent play occurs.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: A couch should be refused if it contains eggs or living beings, is heavy,
    is not movable, or is not well tied; it may be accepted if free from eggs and
    living beings, light, movable, and well tied.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The rules for begging for a couch are said to avoid occasions to sin.
  category: other
  evidence_refs:
  - ev:6
