  summary: The passage is a scholarly introduction describing the first book of the
    Akaranga as difficult, fragmentary prose mixed with verse quotations and moral
    applications. It notes themes of the faithful progressing toward highest perfection,
    the prophet’s suffering as an ascetic example, a maxim about constant exertion
    and wisdom, the loss of the Mahaparinnd lecture, and the technical difficulty
    of translating later conduct rules.
