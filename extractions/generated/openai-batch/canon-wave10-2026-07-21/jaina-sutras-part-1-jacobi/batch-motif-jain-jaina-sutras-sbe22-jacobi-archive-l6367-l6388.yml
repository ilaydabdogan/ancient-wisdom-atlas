  quote: ''
  summary: 'The passage gives rules for monks and nuns on a begging tour: they must
    not accept certain strained fruit liquors prepared for them if the liquid contains
    particles of shell, skin, or seeds, because it is impure and unacceptable; and
    they must not deliberately smell food, drink, or sweet scents in dwellings or
    monasteries, remaining indifferent to pleasant smell.'
