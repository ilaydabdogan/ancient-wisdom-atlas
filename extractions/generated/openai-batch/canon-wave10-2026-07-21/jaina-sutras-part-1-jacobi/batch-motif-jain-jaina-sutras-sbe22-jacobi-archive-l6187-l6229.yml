canonical_text:
  quote: ''
  summary: The passage gives rules for Jain monks and nuns on begging-tours about
    which food or salt may be accepted. It treats alms given with wet, moistened,
    dusty, or soiled hands as unacceptable in some cases, allows acceptance under
    specified matching conditions of soiling, and forbids accepting grains or salt
    processed for the mendicant on a rock or clay containing life.
  language: English
  quote_policy: summarized
