    sin of killing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wise man is described as knowing non-killing and searching after the liberation
    of the bound; murder and worldly ideas are to be known and renounced.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A miserable and afflicted fool who delights in pleasures is said to be turned
