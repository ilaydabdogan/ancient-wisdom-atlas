canonical_text:
  quote: Such a man is said to have crossed the flood (of life)
  summary: 'The passage gives ascetic instruction: avoid sinful and violent acts,
    relinquish property, practice non-attachment and rough discipline, know non-killing,
    and seek liberation from worldly bondage. It contrasts the hero or sage who crosses
    the flood of life with the fool who delights in pleasure and turns in a whirl
    of pains.'
  language: English
  quote_policy: quoted
