  summary: The passage gives rules for a mendicant’s minimal possessions, clothing,
    solitude, taste-restraint, bodily austerity during illness, preparation of a secluded
    straw place free from living things or moisture, and the religious death called
    itvara. It concludes by linking truth, passionlessness, crossing samsara, leaving
    the frail body, and ending existence.
