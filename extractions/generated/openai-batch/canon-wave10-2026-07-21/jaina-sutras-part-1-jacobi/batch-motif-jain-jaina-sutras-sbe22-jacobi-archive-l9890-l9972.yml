canonical_text:
  quote: ''
  summary: A god magically produces a splendid palankin named A^andraprabhd. The palankin
    is richly decorated and contains a throne for the best of Ginas. After a three-day
    fast, the shining Gina ascends and sits on it, attended by Sakra and Isana with
    chowries. Humans, gods, Suras, Asuras, Garudas, and Nigas/Kigas carry it on assigned
    sides, while hosts of gods fill the firmament and music is performed in sky and
    on earth.
  language: English
  quote_policy: summarized
