canonical_text:
  quote: ''
  summary: The passage teaches that beings dwell only temporarily in states of existence
    and that the wise mendicant should renounce family bonds, acts, attachments, desire
    for this world and the next, and should endure insult and blows without harming
    living beings. It uses images of flame, light, fire cleaning silver, a snake casting
    off skin, and an ocean difficult to cross to describe austerity, vows, purification,
    release from pain, and renunciation of samsara.
  language: English
  quote_policy: summarized
