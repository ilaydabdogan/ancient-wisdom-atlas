canonical_text:
  quote: ''
  summary: The passage gives rules for Jain monks and nuns on begging and accepting
    food. It rejects food prepared by householders for groups of ascetics, Brahmans,
    guests, paupers, or beggars when associated with sinful harm to living beings
    or when certain conditions make it impure. It permits food under specified alternative
    conditions. It warns against entering habitually liberal houses for food or drink,
    lists calendrical occasions when mass feeding occurs, identifies unblamed family
    sources from which food may be accepted, and begins a rule concerning assemblies,
    ancestor offerings, and festivals for deities, demons, Yakshas, snakes, tombs,
    shrines, trees, hills, caves, water places, and other sites.
  language: English
  quote_policy: summarized
