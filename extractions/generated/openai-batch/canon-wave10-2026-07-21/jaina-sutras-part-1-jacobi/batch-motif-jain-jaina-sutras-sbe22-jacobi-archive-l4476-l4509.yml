canonical_text:
  quote: ''
  summary: 'The passage gives prescriptive instruction about conduct: one should not
    give specified goods or service to friendly or hostile heretics, and should not
    accept such support when a heretic offers it. It then criticizes persons not well
    instructed in conduct who urge killing, kill or consent to killing, take what
    has not been given, and pronounce speculative opinions about the world. A translator
    note says the opening paragraphs are difficult to translate.'
