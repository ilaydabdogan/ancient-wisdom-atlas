canonical_text:
  quote: ''
  summary: Rules for monks and nuns during the Pa^usan/Paggusan prohibit harsh speech,
    prescribe mutual forgiveness in disputes, regulate lodging places, require notice
    of alms-going direction for safety during austerities, limit travel distance,
    and connect observance of rainy-season conduct with perfection and freedom from
    pains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the Pa^usan/Paggusan, monks or nuns are told not to use harsh words;
    if they do, they are to be warned, and a continuing offender is to be excluded
    from the community.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a quarrel, dispute, or dissension occurs during the observance, the young
    monk and the superior are to ask forgiveness from one another, forgive one another,
    appease and be appeased, and converse without restraint.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that success in control belongs to one who is appeased,
    and explains the rule with the statement that peace is the essence of monachism.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Monks or nuns are to have three lodging-places during the observance: two
    for occasional use that must be inspected, and one for constant use that must
    be swept.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Monks or nuns are to give notice of the direction or intermediate direction
    in which they intend to go for alms, so that if an ascetic weakened by austerities
    swoons or falls, other monks can search in the named direction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Monks or nuns are not allowed to travel farther than four or five Yojanas
    and return; they may stay in an intermediate place but not pass the night there
    at the end of the journey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The closing notice says that Nirgrantha monks following these rainy-season
    rules for Sthaviras may reach perfection and be freed from pains in the same life,
    next life, or third birth.
  category: sequence
  evidence_refs:
  - ev:6
