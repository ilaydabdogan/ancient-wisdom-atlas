canonical_text:
  quote: ''
  summary: The passage argues that extant Jaina literature should not be dated before
    about 300 B.C., yet Jaina tradition reports older works called the fourteen Purvas.
    These are said to have been incorporated into the twelfth Anga, the Drishtivada,
    later lost, while contents survived in other texts. The author treats the Purvas
    as older sacred books superseded by a new canon, whose loss coincided with the
    collection of the Angas. He conjectures that the Purvas chiefly preserved philosophical
    controversies involving Mahavira and rival teachers, which later lost practical
    relevance and led to the composition of a new canon.
  language: English
  quote_policy: summarized
