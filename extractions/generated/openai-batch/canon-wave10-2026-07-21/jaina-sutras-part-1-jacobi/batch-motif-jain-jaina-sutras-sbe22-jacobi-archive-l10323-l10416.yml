canonical_text:
  quote: ''
  summary: The passage presents clauses of Jain great vows for a Nirgrantha. It instructs
    deliberation when begging for ground, renunciation of sexual pleasures, avoidance
    of talk, sight, memory, food, drink, and sleeping places that may disturb celibate
    discipline, and the beginning of a vow renouncing attachments, including attachment
    to agreeable and disagreeable sounds.
  language: English
  quote_policy: summarized
