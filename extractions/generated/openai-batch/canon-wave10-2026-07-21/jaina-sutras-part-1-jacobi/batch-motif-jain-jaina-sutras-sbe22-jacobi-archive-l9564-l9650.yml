canonical_text:
  quote: ''
  summary: 'The passage first gives a rule against approving or prohibiting reciprocal
    actions involving oneself that produce karman. It then introduces clauses on the
    Venerable Ascetic Mahavira: five major life moments occur under the moon''s conjunction
    with Uttaraphalguni, final liberation occurs under Svati, and a dated account
    describes his descent from the Pushpottara Vimana into Devdnandi''s womb, his
    lion form, his threefold knowledge about the descent, and Indra''s removal of
    the embryo according to Tirthakara birth custom.'
  language: English
  quote_policy: summarized
