- id: obs:2
  text: 'The passage lists five important moments in the life of the Venerable Ascetic
    Mahavira as occurring when the moon was in conjunction with Uttaraphalguni: descent
    from heaven and womb entry, removal from one womb to another, birth, hair-tearing
    and leaving the house, and obtaining Kevala.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Mahavira obtained final liberation when the moon was
    in conjunction with Svati.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dated account says Mahavira descended from the great Vimana called Pushpottara,
    where he had lived among gods until the end of his allotted divine life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After descending, Mahavira took the form of an embryo in the womb of Devdnandi,
    wife of the Brahmana Rshabhadatta, and the passage also says he took the form
    of a lion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Mahavira''s knowledge concerning the descent is described as threefold: he
