canonical_text:
  quote: ''
  summary: Prescriptive rules for yatis during the Paggusan period regulate lodging
    before sunset, mixed standing arrangements involving monks, nuns, novices, lay
    people, and named senior figures, acceptance of food for another person, meals
    while the body is wet, and the inspection of small living beings, mildew, seeds,
    sprouts, and moisture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person putting his things together is to go before sunset to the place where
    he is lodged and is not allowed to spend the night in the former place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One monk and one or two nuns, or two monks with one or two nuns, are not allowed
    to stand together in the same place unless a fifth person is present, the place
    can be seen by passers-by, or doors open on it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A monk and a lay woman, and likewise a nun and a layman, are subject to a
    similar standing-together restriction with stated exceptions involving a fifth
    person, visibility, or open doors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: During Paggusan, monks or nuns are not allowed to accept food, drink, dainties,
    or spices for someone who has not asked them and whom they have not promised to
    serve in this way.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage gives a question-and-answer rationale that one who collects alms
    for another without being asked might eat them or not as he chooses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: During Paggusan, monks or nuns are not allowed to take meals while their body
    is wet or moist, but may eat once the water has dried and moisture is gone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Seven moisture-retaining places are named: hands, lines in the hand, nails,
    tops of the nails, brows, under lip, and upper lip.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'A mendicant ought diligently to perceive, observe, and inspect eight classes
    of small things: living beings, mildew, seeds, sprouts, flowers, eggs, layers,
    and moisture.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Small living beings are said to be of five kinds by color, and an animalcule
    named Anuddhari is difficult to see when at rest but easy to see when moving for
    monks and nuns not yet perfected.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Small mildew, small seeds, and small sprouts are also described in five color
    classes, with additional notes about matching the color of the substance or grain.
  category: attribute
  evidence_refs:
  - ev:8
