  summary: The passage describes a decorated twisted caribou rawhide line with a red
    birchwood piece and bone barb, notes its resemblance to a Naskapi caribou snare
    and its differences, explains its use for dragging caribou carcasses and hoisting
    skins, and states that such implements are valued, inherited, and sometimes honored
    with songs. It also lists a cradle and baskets, then describes birchbark carrying
    baskets used in travel.
