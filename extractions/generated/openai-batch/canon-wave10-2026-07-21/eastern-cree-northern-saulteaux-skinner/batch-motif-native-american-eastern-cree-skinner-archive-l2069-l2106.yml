canonical_text:
  quote: ''
  summary: The passage lists remembered Eastern Cree dances and notes that few native
    dances remain, having been largely set aside for European square dances. It describes
    war-related dances before battle, a spring feasting or greeting dance, animal-named
    dances, a Bear Dance centered on a drumming conjuror inside a small square enclosure,
    and a Mid^ Dance connected with Albany band midewin ceremonies.
  language: English
  quote_policy: summarized
