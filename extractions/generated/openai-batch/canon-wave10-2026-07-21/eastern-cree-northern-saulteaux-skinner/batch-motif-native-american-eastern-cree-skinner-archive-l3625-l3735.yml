canonical_text:
  quote: ''
  summary: 'The passage describes Eastern Cree hunting observances concerning animal
    spirits, especially bear rites: offerings and preservation of animal remains,
    vermilion markings, apology before killing a bear, an announcing claw, ceremonial
    reception of the bear carcass, tobacco and smoking rites, food and gesture taboos,
    burning portions for the bear''s spirit, eating the heart for desired qualities,
    care of bones and skull, and a former Moose Fort pipe-and-bear-head ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Every animal is said to have a spirit whose favor must be acquired, otherwise
    it may prevent its species from being taken by hunters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beaver bones are cleaned and cast into running water so that dogs do not get
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Heads, teeth, claws, and chins from various animals are saved as offerings
    to the animal spirit, talismans for owners, and trophies or tallies of the chase.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The skin of every animal taken is decorated with vermilion stripes and dots,
    including a series of five dots whose meaning was not obtained.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The bear is described as the most powerful and important animal for the Eastern
    Cree.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: Before killing a bear, a hunter apologizes, explains that lack of food compels
    the killing, and asks that the bear and other bear spirits not be angry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After killing a bear, the hunter cuts off the middle toe and claw of the right
    forefoot and later gives this announcing claw to the person chosen to bring in
    and butcher the carcass.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The announcing claw may be wrapped in cloth, beaded, painted, and kept as
    a memento.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: When multiple men kill a bear, the bear is laid on its back in a canoe, covered,
    greeted at camp, and then laid out like a man in front of the slayer's wigwam.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Tobacco is placed on the bear's teeth or in its mouth, and the hunter and
    chief men smoke over the bear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: During the ceremony, if the bear must be mentioned it is called Kawi'patc
    mi'tcEm, translated in the passage as black food; pointing at the carcass is tabooed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After smoking, the bear is butchered, flesh is distributed to the camp, and
    selected parts including a small piece of heart are burned as food for the bear's
    spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The slayer eats the rest of the bear's heart in order to acquire the bear's
    cunning and courage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Women are not allowed to eat the bear's head or paws, and men are not allowed
    to eat its rump.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Bear bones are cleansed, saved, and hung up or placed on a scaffold where
    dogs cannot reach them; wild animals other than dogs eating them is said to do
    no harm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The bear skull is cleaned, dried, painted with vermilion, kept safely for
    three to six months, and then secretly hung on a tree in the forest.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: A former Moose Fort ceremony used a cooked bear head, a stone pipe, tobacco,
    a left-to-right pipe circulation, and a rule that participants bite the bear head's
    flesh without using their hands.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The Moose Fort head-and-pipe ceremony was sometimes also performed after killing
    a caribou.
  category: sequence
  evidence_refs:
  - ev:9
