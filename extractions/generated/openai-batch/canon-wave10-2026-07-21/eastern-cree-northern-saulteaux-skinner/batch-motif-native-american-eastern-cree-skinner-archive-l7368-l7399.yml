canonical_text:
  quote: ''
  summary: 'The passage describes sign and signal practices: oblique, vertical, and
    lashed wooden elements near a deserted camp encode travel direction and camping
    duration; Northern Saulteaux report no use of smoke signals and little picture
    writing apart from Midewin bark scrolls; missionary syllabics are used on birchbark,
    chips, and blazed tree surfaces; blazed trees also mark forest trails for later
    travelers.'
  language: English
  quote_policy: summarized
