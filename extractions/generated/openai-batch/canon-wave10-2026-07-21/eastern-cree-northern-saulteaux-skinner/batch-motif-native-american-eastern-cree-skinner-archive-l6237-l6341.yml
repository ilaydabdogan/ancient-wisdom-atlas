  quote: ''
  summary: The passage describes Northern Saulteaux clothing, moccasin types, hair
    arrangements, tattooing, facial and body painting, and personal ornaments, including
    notes on changes from older forms to European-style dress and comparisons with
    Cree and Eastern Cree practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Older clothing forms included women's stroud dresses with separate sleeves
    and belts, beaded leggings, and occasional rabbitskin costumes; most ancient and
    transitional clothing had been discarded.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Contemporary men and women wore European clothing purchased from traders;
    beadwork was described as poor and scarce, and porcupine quill work as discarded.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some northern bands in contact with the Eastern Cree kept special clothing
    for warlike purposes, while more southern bands wore old clothing to war so that
    their best garments would not be taken by enemies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Several moccasin types are listed: older unornamented “wolverene shoes,”
    an ankle-flap type, a low summer form, sturgeon-skin makeshift moccasins, and
    woven rabbitskin shoes for winter travel over slippery ice.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Modern Saulteaux moccasins are described as high or low, with a seam running
    from toe over instep to a decorated vamp, and with ankle flaps adorned with beads
    or quills.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The writer states that Saulteaux clothing was entirely utilitarian and that
    no attempt was made to render it beautiful, unlike clothing of tribes farther
    south and north.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women wore hair in one braid, two braids brought forward, loose hair caught
    at the nape, or two tight braids coiled flat on the back of the head; some covered
    the head with a silk handkerchief.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men formerly wore hair loose; at the time described they cut it like Europeans
    or cropped it at the shoulders, and sometimes wore a snake skin as a brow fillet
    or a knotted handkerchief as a skullcap.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Scalplocks were said not to have been cultivated; beards and mustaches were
    common and valued because they increased resemblance to Europeans.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Saulteaux were said not to use tattooing or scarification for adornment,
    though the writer observed an old woman with bilaterally symmetrical cross tattoos
    on each cheek as charms against toothache and headache.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Similar tattooed symbols were reportedly placed on legs and wrists to ward
    off rheumatism.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The writer suggests that the cross-tattoo custom may have originated from
    Roman Catholic missionary teaching rather than from a purely aboriginal idea.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Tattooing was performed with charred birchbark or wood pigment rubbed on a
    thread fastened to a needle, with the design sewn under the skin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Abitci-ininis stated that young men used facial paintings to attract women
    rather than for warlike purposes; the paintings were generally red and made from
    hematite iron ore.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Ceremonial paintings other than warlike paintings were said once to have been
    common; labrets were unknown, nose rings were recent and obsolete, and earrings
    were made by slitting the ear and suspending pieces of marten skin.
  category: object
  evidence_refs:
  - ev:9
