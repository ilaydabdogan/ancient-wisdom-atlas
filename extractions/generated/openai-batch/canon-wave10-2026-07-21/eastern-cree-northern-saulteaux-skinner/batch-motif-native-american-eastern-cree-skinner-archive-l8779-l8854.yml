canonical_text:
  quote: ''
  summary: WisEkejack encounters Toad, who carries a drum and rattle and says he is
    going to cure the wounded Panther. WisEkejack kills Toad, wears his skin, enters
    Panther's lodge under that disguise, and kills the wounded Panther. The other
    panthers retaliate by raising a flood. WisEkejack builds a raft for the animals.
    Beaver, Otter, and Muskrat dive for mud beneath the water; Beaver and Otter fail,
    while Muskrat returns dead but with mud on his body. WisEkejack revives the drowned
    divers by blowing on them and makes land from Muskrat's mud. Crow and Wolf test
    the size of the new land; Wolf never returns.
  language: English
  quote_policy: summarized
