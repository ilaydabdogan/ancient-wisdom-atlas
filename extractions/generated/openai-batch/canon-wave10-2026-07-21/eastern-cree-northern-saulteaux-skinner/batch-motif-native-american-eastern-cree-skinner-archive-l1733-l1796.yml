canonical_text:
  quote: ''
  summary: Ethnographic description of Cree leather tanning. The passage gives a six-part
    sequence—flaying, fleshing, scraping, braining, working, and smoking—describes
    tools and handling of hides, and notes optional waterproofing with boiled willow
    bark liquor. It also briefly compares Cree methods with Woodland, Plains, Gulf,
    Eastern-band, and westward practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cree leather manufacture is described as differing in some essentials from
    Plains and Gulf tribal methods while resembling Woodland methods in general.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The tanning task is divided into six named parts: flaying, fleshing, scraping,
    braining, working, and smoking.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After an animal is killed, the hunter cuts the skin down the belly and inside
    the legs and removes it with a wedge-shaped bone skinning tool.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In winter the skin may be frozen and held until the tanner has time; in warmer
    weather it is preferable to flesh it at once.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For fleshing, the skin is pegged on the ground and scraped with a semilunar
    knife among Eastern bands; a chisel-shaped scraper may replace it westward.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: For scraping and defurring, the skin is placed over the smoothed upper end
    of an obliquely set log, and a deer-shin-bone beaming tool is pushed against the
    grain of the hair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the fur is shaved away, the skin is washed and hung out to dry.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A mixture of animal grease and brains is worked into the dry skin while it
    is warmed from time to time; afterward the skin is dried, soaked, and washed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wet skin is worked and stretched by hand while it dries until it becomes
    pliable, white, and soft.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before smoking, the white soft leather is usable but is described as likely
    to become mouldy and as not very durable.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: For smoking, the skin is sewn into a bag-like form, suspended from a tripod,
    and exposed to fumes from smouldering punk in a pot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Waterproofing may be attempted by soaking the leather in liquor from boiling
    willow bark; tanning skins with the fur left on is similar, except that scraping
    is omitted.
  category: sequence
  evidence_refs:
  - ev:6
