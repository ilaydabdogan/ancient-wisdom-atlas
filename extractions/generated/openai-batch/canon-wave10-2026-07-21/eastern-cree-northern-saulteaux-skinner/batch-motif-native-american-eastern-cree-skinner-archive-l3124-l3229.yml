canonical_text:
  quote: ''
  summary: The passage describes the difficulty of recovering older Eastern Cree religious
    beliefs after Christian missionary influence; identifies older beliefs as polytheistic;
    describes sacrifices to animal souls and appeals to powers of nature; gives named
    personified winds and weather-making rites; and summarizes shamanic initiation
    through fasting, dreams, visions, guardian spirits, and medicine-society degrees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Eastern Cree older religion was largely given up or covered
    by Christianity, and that the idea of one “great spirit” is described as a European
    importation rather than an older Cree belief.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that hard hunting conditions led people to make sacrifices
    propitiating the souls of animals and to appeal to powers of nature for aid.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The winds are described as four brothers with distinct names, directions,
    and qualities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The north wind is described as the eldest and most powerful wind, as sender
    of cold, and as able to punish evil doers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: To obtain a north wind, a snow man or a witch’s broom may be set on the ice;
    to turn the wind from the north, a saliva-wet stone with charcoal is struck to
    make a loud report.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hunters and others use bull roarers or buzzers to bring wind, sometimes manipulating
    them all night; the passage connects the instrument with wind through a noise
    resembling rushing wind.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: To bring snow, a rabbit or hare skin is thrown into fire and singed; the explanation
    links the rabbit’s white winter skin and love of deep snow with winter, which
    is offended when the hair is burned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: To bring rain, a greasy roasting spit covered with old flesh is picked clean
    with teeth; the passage says teeth and saliva cleaning the stick symbolize rain
    washing the spit clean.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Eastern Cree had an esoteric medicine society with degrees; admission
    and advancement are described as occurring through dreams and visions.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: A young man seeking admission would go to a secluded forest place, fast and
    wait night and day for a week or ten days, and stay on a raised scaffold built
    on poles.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ordinary dreams were said to reveal a guardian spirit, usually an animal,
    and to give instructions about tasks, charms, or fetishes; other visions could
    reveal supernatural power and a destiny to become a shaman.
  category: sequence
  evidence_refs:
  - ev:10
