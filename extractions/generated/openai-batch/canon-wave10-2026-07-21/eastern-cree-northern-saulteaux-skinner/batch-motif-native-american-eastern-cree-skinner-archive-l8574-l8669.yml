canonical_text:
  quote: ''
  summary: Omishus returns with a young male captive concealed under an overturned
    canoe. His elder daughter refuses the man as ugly, while the younger washes him,
    dresses him, and marries him. After the couple have two children, Omishus twice
    takes the son-in-law out by canoe, first for gulls' eggs and later for sturgeon,
    and each time abandons him to dangerous creatures. The young man survives the
    great gull and the horned water snake, returns with food or proof, and Omishus
    discovers that the creatures were embodiments of his dreams.
  language: English
  quote_policy: summarized
