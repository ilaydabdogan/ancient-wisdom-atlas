canonical_text:
  quote: ''
  summary: The passage describes Eastern Cree and Albany Cree social organization,
    remembered totems, possible dream-assigned clan and guardian identities, scattered
    family hunting, spring reunions with prophecy and dance, leadership, and marriage
    customs including arranged marriage, polygyny, and cited accounts of wife hospitality.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At posts visited other than Fort Albany, the Cree are described as having
    no recollection of clan organization and as regarding the patriarchal family as
    the general social unit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Albany natives remembered animal totems including moose, caribou, fish,
    sucker, sturgeon, loon, and Hell-diver, while whale and seal were said never to
    have been known.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some old men thought that in former times young men occasionally dreamed both
    their clan and their personal guardians.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Descent is described as following the father's line, with no marriage restrictions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Food scarcity is given as the reason that permanent village communities could
    not exist, requiring families to scatter through the forest.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Formerly, dispersed families made spring rendezvous at a central point for
    reunion, ceremonies, councils, prophecy, and a feasting or greeting dance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mitê or prophet prophesied the events of the coming year before the spring
    assemblage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the present described by the passage, Cree families meet at Hudson's Bay
    Company posts to trade winter furs, remain for two to four weeks, and return to
    hunting grounds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A nominal chief is described as now appointed by the Canadian Government near
    civilization, while formerly the chief was the best warrior and most trustworthy
    man, gaining office by tacit consent after the previous chief's death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The former chief's orders had to be obeyed, especially in war, though revolts
    and civil wars were not uncommon where rival capable men were present.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Marriages are described as arranged by older people or parents, with the bride
    brought to the young man's house and the young people having little choice.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Polygamy is described as formerly common, with four or five wives possible,
    the first wife having most authority, and sisters considered less likely to quarrel
    as co-wives.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: Girls are described as marrying at about fifteen years of age, while men married
    when they became good hunters; small presents were made to the bride's parents.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Mackenzie and Carver are cited for accounts in which offering wives or temporary
    wife exchange appears as hospitality to strangers.
  category: speech
  evidence_refs:
  - ev:12
  - ev:13
