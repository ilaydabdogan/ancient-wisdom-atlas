canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a very young boy is identified
    as the father of a girl's child by a bodily sign after a false claimant is exposed,
    then becomes her husband and a successful hunter while jealous villagers suffer
    hunger. It then gives the tale 'The Beaver Wife,' in which a man tests several
    female animals as potential wives, lives briefly with Whisky-jack, marries Beaver
    under a condition about placing a stick across water crossings, neglects the condition,
    and is separated from Beaver by a newly appearing river and her beaver house.
  language: English with Latin phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young boy loves a girl despite being laughed at for his youth; after he
    repeatedly uses the same place associated with her urination, the passage says
    she becomes pregnant and gives birth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief assembles the young men and uses the child in a test intended to
    identify the father by the infant's urination.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young man who loves the girl tries to pass off spittle as the identifying
    sign, but people in the crowd see the trick and call him a liar.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the child reaches the true father, the infant urinates on him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young boy takes the girl as his wife; other people become angry or jealous,
    leave him alone, fail at hunting, nearly starve, and later beg him for meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In 'The Beaver Wife,' a man tries several female animals as possible partners,
    rejecting them for unsatisfactory work or traits before Whisky-jack stays with
    him for a time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Whisky-jack keeps the tent clean and prepares water and wood, but a heavy
    bundle of beaver breaks her legs; the man binds them with bowstring, and the wrapping
    marks are said to remain visible on whisky-jack legs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man meets Beaver cutting down a tree; she is described as attentive, a
    good worker, and able to wash and dress fur, so he asks her to become his wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Beaver says she will live with the man only if he never forgets to break down
    a stick and lay it across a valley, creek, or water crossing, otherwise it will
    become a big river and separate them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The man later neglects this condition while traveling through the forest;
    his wife disappears, and at the place of omission he finds a great river with
    Beaver swimming in it and building a beaver house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The man cries and asks Beaver to come to him; she refuses to come ashore,
    tells him to come to her, and says that if he dives down and comes up inside the
    house it will be dry there.
  category: sequence
  evidence_refs:
  - ev:9
