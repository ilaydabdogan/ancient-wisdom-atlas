canonical_text:
  quote: ''
  summary: 'The passage records several Cree folklore fragments: a giant pursues a
    mythical beaver and throws a rock that remains visible as Stag Rock; two bright
    stars marry two sisters who only see them at night; a conjuror retaliates against
    a harmful magical bird sent with mud; and a cannibal father and son fatten or
    attack people, while one family escapes through weather conjuring and another
    family’s medicine-strong sons detect the cannibals’ approach.'
  language: English
  quote_policy: summarized
