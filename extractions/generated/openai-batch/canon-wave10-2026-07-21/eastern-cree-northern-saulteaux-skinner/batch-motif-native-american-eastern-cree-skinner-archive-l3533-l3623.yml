canonical_text:
  quote: ''
  summary: 'The passage describes Eastern Cree conjuring practices: an enclosed ritual
    speaker reports a talk with the Great Spirit and gives a prediction; miteo conjurors
    use dreams, empowered animals, trance spirit travel, conjuring houses, songs,
    spirit voices, and ritual contests for prophecy, hunting, war, love, and hostile
    magic. It also records skeptical observation of a lodge-shaking performance, love
    charms including a greenish stone, and tobacco offerings to fire and rapids to
    propitiate spirits and a resident manitou.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man in an enclosure remained vociferating for about three quarters of an
    hour, became exhausted and speechless, then rose, removed his covering, and addressed
    the assembly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker said the Great Spirit had held a talk with him and gave a prediction
    that a canoe would arrive after the sun reached its highest point the next day,
    bringing information about the traders.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Evil conjuring is described as performed by a miteo against rivals or enemies,
    with a dream informing him what course to take.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bird or animal may be captured, imbued with malevolent power, and sent to
    strike or fall upon a victim; if the victim's power is stronger, the messenger
    may be sent back with fatal effect.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A miteo wishing to kill a rival may lie apparently dead in trance while his
    spirit leaves the body, travels to the victim, and kills by magic; if defeated,
    the miteo does not recover from the trance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rival miteos may build conjuring houses and battle each other, with victory
    attributed to stronger spirit influence or more mysterious power.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Conjuring is said to be used for hunting, war, love-making, and seeing into
    the future; the conjuror's influence is described as greater than the chief's,
    and evil conjurors could terrify a community.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: For hunting success, the conjuror retires to a secluded spot and builds a
    dome-shaped conjuring house while hunters form a circle at least twenty-five feet
    away and no one is allowed to pass through.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Inside the hunting conjuring house, the conjuror sings to invoke spirits;
    the tent shakes, wind blows, spirit voices are heard from the top, and bird and
    beast cries are audible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The conjuror asks the spirits about hunting success, and their answers from
    the top of the lodge determine the expected result of the hunt; the drum is not
    used in the conjuring house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A white man at East Main River Fort reported breaking through the lines and
    seeing the conjuror brace himself inside the tent, shake it violently, and imitate
    animal calls and spirit voices.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: War conjuring includes a conjuror's dance, and love magic includes charms,
    medicines, dream revelations, or a magic object brought into contact with the
    desired woman.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A famous little greenish stone, kept in one family, is described as giving
    a young male carrier powerful influence over women.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Tobacco is thrown in the fire before a feast to propitiate spirits, and Cree
    voyageurs cast tobacco into rapids to conciliate a resident manitou or demon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The resident being at the rapid is described as half woman and half fish.
  category: attribute
  evidence_refs:
  - ev:9
