canonical_text:
  quote: ''
  summary: The passage describes Moose Cree and Eastern Cree bear ceremonies, bear-related
    taboos, feast rules, bear naming practices, body-part charms and hunting methods,
    a statement that bears understand speech, a brief notice of a former bear dance,
    a comparative footnote about a Seneca ceremony, and a first-caribou-kill ceremony
    in which selected parts are cooked and passed to men and boys while women do not
    partake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a Moose Cree bear ceremony, the bear's intestines are removed, slightly
    cooked and smoked, coiled on a plate, and passed around by the slayer after the
    passing of the head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women may be present for the bear-intestine ceremony but are not allowed to
    eat the meat.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Cree of Rupert's House and Eastmain River Fort, pointing a finger
    at a bear is tabooed because the bear would run away, being warned by its medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a feast after a bear is slain, each guest receives an amount of food and
    must finish it either at one sitting or by the next night at the feast giver's
    house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several alternate names for the bear are listed for use in different contexts,
    including names to avoid angering, offending, frightening, or letting the bear
    know it is being discussed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The skin of the bear's under-lip or chin is described as sacred, and a tongue
    bone is placed in a pouch attached to the chin skin; such prepared chins serve
    as charms and hunting trophies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bear claws, a young bear thigh-bone skinning tool, a worked scapula, and a
    bear foetus skin are described as kept as trophies or charms, with some items
    never used.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says that anciently the Eastern Cree did not use bow and arrow
    for bear hunting, but used war club and knife, with dogs used to worry the bear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that bears are supposed to understand everything said to
    them, and reports a man who was released by a black bear after pleading for mercy.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A former bear dance is mentioned, but the author says no information was obtained
