candidate_motifs:
- id: motif:1
  label: Vision-based initiation into a medicine society
  taxonomy_refs:
  - initiation
  basis: A young man wishing to join the midewin must receive a supernatural revelation
    in the form of a vision, and the vision is treated as power-bearing and secret.
  evidence_refs:
  - ev:17
  confidence: high
  cautions: The content of the vision is not given in this passage.
- id: motif:2
  label: Ritual death-like collapse from medicine-bag contact
  taxonomy_refs:
  - initiation
  - death_rebirth
  basis: During the ceremony, shooting the migis with a medicine bag causes the touched
    bystander or novice to fall and lie as if dead.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly call this an initiation death or rebirth;
    the death-rebirth taxonomy is only a cautious formal match to the described death-like
    state.
- id: motif:3
  label: Ritual dog killing followed by communal feast
  taxonomy_refs:
  - sacrifice
  basis: White dogs tied to ritual poles are strangled out of the white observer's
    sight, after which all present take part in a dog feast; the same custom is reported
    at Lac Seul.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage describes killing and feasting but does not explicitly state
    that the dogs are offerings to spirits or deities.
- id: motif:4
  label: Animal intermediary for spirit contact
  taxonomy_refs: []
  basis: Certain shamans are said to procure intercourse with spirits through the
    turtle as an intermediary.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No further narrative or doctrinal explanation of the turtle is provided
