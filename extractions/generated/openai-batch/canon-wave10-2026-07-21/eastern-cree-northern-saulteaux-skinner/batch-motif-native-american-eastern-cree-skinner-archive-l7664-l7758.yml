  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 7729-7736
  quote_or_summary: In tending the sick, four or five mide may attend a bedside and
    use ornamented ermine, mink, otter, and young bearskins, which are considered
    embodied with power, called spirits, and sometimes related to a shaman's guardian
    and dream spirit.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 7736-7742
  quote_or_summary: Actual medicines are administered by society members, and when
    a shaman converts to Christianity he often destroys or caches herbs because he
    considers them connected with evil spirits formerly associated with him.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 7742-7750
  quote_or_summary: Mide rites are not practiced north of Lac Seul, though some Saulteaux
    there were once members. At northern posts there were four degrees; the head conjuror
    or mideo at Lac Seul appointed men of each degree, and succession occurred when
    a degree-holder died.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 7751-7757
  quote_or_summary: A young man wishing to join the midewin must have a supernatural
    revelation in the form of a vision. Such dreams are difficult to learn because
    people fear their power may be revoked if told, especially to a white man.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 7757-7758
  quote_or_summary: A dream obtained from Wabus-inini, identified as the oldest and
