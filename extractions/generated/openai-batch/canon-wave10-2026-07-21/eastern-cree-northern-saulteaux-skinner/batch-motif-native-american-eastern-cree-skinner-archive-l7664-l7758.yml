canonical_text:
  quote: ''
  summary: The passage gives ethnographic notes on Northern Saulteaux religious practice,
    especially the medicine lodge and midewin. It describes a medicine-lodge ceremony
    with an oval willow-and-brush booth, ribboned poles, tied white dogs, dancers
    painted with bones, medicine bags, the action called shooting the migis, dog killing
    and a communal dog feast. It also reports birchbark songs and rituals, scalps
    carried in a dance, shamanic use of the turtle as spirit intermediary, a bound-conjuror
    performance in a shaking dome-shaped lodge, ritual instruments, malevolent wooden
    figures, treatment of the sick with empowered animal skins and medicines, degrees
    of the midewin, succession in rank, and the requirement of a supernatural vision
    for admission.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer states that only a few notes on shamanism and the midewin were
    collected because the expedition primarily studied material culture.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The southern bands of the Northern Saulteaux were said to maintain the medicine
    lodge, while the northern bands had given it up.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a ceremony witnessed by Jabez Williams, an oval booth of willows and brush
    was built, with poles and ribbons at each end and a white dog tied to each pole.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men sat at one end of the booth and women at the other.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dancers were led by the highest-ranking shaman, wore only clout and moccasins,
    and many were painted white with ribs and bones marked on their skin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The text suggests the bone markings may have represented jibai, glossed as
    ghosts or skeletons.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dancers held medicine bags before them and danced in a circle around the poles
    while chanting repeated syllables.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A dancer sometimes pointed his medicine bag at a bystander or novice and brought
    it upward until its head touched the person; this was called shooting the migis.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A person touched in the shooting of the migis would fall to the ground and
    lie as if dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Williams was led away before the dogs were strangled, and afterward returned
    to the lodge where everyone present took part in the dog feast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says a dog feast after or during the ceremony was also found at
    Lac Seul.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Williams reportedly saw midewin songs and rituals written on birchbark.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Thomas Lawson reported seeing five Sioux scalps carried in a midewin dance
    at Lac Seul, suspended from ribbon-ornamented poles.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Certain shamans were said to obtain intercourse with spirits through the turtle
    as an intermediary.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: A conjuror demonstrating power allowed himself to be bound hand and foot and
    placed in a small dome-shaped tent.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: In the conjuror performance, supernatural helpers were summoned, the lodge
    shook, and the shaman's clothes and binding ropes were thrown out.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: After the performance, the shaman was found naked and unbound inside the lodge.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: During the conjuror performance, bystanders moved on hands and knees in a
    circle around the lodge.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: 'The passage distinguishes instrument use: the shaman did not use the drum
    inside the lodge as far as learned, often sang and drummed at night outside the
    lodge, the rattle was secondary in mide ceremonies, and a working shaman used
    the drum only.'
  category: object
  evidence_refs:
  - ev:12
- id: obs:20
  text: Wooden figures were used by shamans in malevolent conjuring and were set in
    snow or on stumps to injure enemies.
  category: object
  evidence_refs:
  - ev:13
- id: obs:21
  text: When tending the sick, four or five mide could be present at one bedside.
  category: action
  evidence_refs:
  - ev:14
- id: obs:22
  text: The mide used ermine, mink, otter, and young bearskins ornamented with beads
    and ribbons; these skins were considered embodied with power, called spirits,
    and sometimes linked to a shaman's guardian and dream spirit.
  category: object
  evidence_refs:
  - ev:14
- id: obs:23
  text: Members of the society administered medicines, and a shaman converting to
    Christianity might destroy or cache herbs because he regarded them as connected
    with evil spirits.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:24
  text: At northern posts there were four degrees of the midewin, and a head conjuror
    or mideo at Lac Seul appointed men of each degree at Fort Hope and probably other
    posts.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:25
  text: When a man of a degree died, men of the next highest degree customarily moved
    up and took his place.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:26
  text: A young man wishing to join the midewin had to have a supernatural revelation
    in the form of a vision.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:27
  text: The nature of such dreams was said to be difficult to learn because people
    feared that telling them, especially to a white man, might revoke their power.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:28
  text: Wabus-inini is identified as the oldest and most noted conjuror of the Northern
    Saulteaux at Fort Hope, and a dream obtained from him is introduced.
  category: attribute
  evidence_refs:
  - ev:18
