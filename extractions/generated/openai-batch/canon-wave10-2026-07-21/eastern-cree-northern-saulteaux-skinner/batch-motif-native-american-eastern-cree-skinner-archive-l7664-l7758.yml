  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 7677-7683
  quote_or_summary: Jabez Williams attended a ceremony near the Lake of the Woods
    where an oval willow-and-brush booth was built, poles with ribbons stood at each
    end, a white dog was tied to each pole, and men and women sat at opposite ends.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 7684-7688
  quote_or_summary: Dancers were led by the highest-ranking shaman, wore clout and
    moccasins, and many were painted white with ribs and bones marked on the skin,
    perhaps to represent jibai, glossed as ghosts or skeletons.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 7688-7691
  quote_or_summary: Dancers held medicine bags with both hands at about waist height,
    danced in a circle around the poles, and chanted repeated syllables.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 7691-7697
  quote_or_summary: At intervals a dancer pointed his medicine bag at a bystander
    or novice and brought it upward until its head touched the person; this was called
    shooting the migis, and the person touched would fall down and lie as if dead.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 7697-7704
  quote_or_summary: Williams was told the dogs were to be killed and no white person
    might see it; he was led away while they were strangled, then returned to the
    medicine lodge where all present joined in the dog feast. A dog feast after or
    during the ceremony was also found at Lac Seul.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 7704-7705
  quote_or_summary: Williams also saw songs and rituals of the midewin written on
    birchbark.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 7706-7710
  quote_or_summary: Thomas Lawson reported that he had seen five Sioux scalps carried
    in a midewin dance at Lac Seul fifty years earlier, suspended from poles ornamented
    with ribbons.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 7711-7713
  quote_or_summary: Certain classes of shamans are said to procure intercourse with
    spirits through the turtle as an intermediary.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 7713-7719
  quote_or_summary: A conjuror demonstrating power is bound hand and foot and put
    into a small dome-shaped tent; he summons supernatural helpers, the lodge shakes,
    clothes and ropes are thrown out, and afterward he is found naked and unbound
    inside.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 7719-7724
  quote_or_summary: While the conjuror performance occurs, bystanders grovel on hands
    and knees in a circle around the lodge. The passage notes drum and rattle use
    in relation to lodge performance, mide ceremonies, and shamanic work.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/eastern-cree-northern-saulteaux-skinner.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 7724-7728
  quote_or_summary: Wooden figures were used by shamans in malevolent conjuring and
