scenes:
- id: scene:1
  label: Medicine-lodge ceremony witnessed by Williams
  summary: An oval willow-and-brush booth is built with ribboned poles and white dogs.
    Men and women sit at opposite ends. Dancers led by the highest-ranking shaman
    wear minimal clothing, some with white skeletal paint, hold medicine bags, circle
    the poles, chant, and perform shooting the migis, causing touched bystanders or
    novices to fall as if dead.
  figure_refs:
  - fig:3
  - fig:4
  - fig:5
  - fig:6
  - fig:7
  symbol_refs:
  - sym:1
  - sym:2
  - sym:3
  - sym:4
  - sym:5
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
- id: scene:2
  label: Hidden dog killing and communal feast
  summary: Williams is led away because a white person may not see the dogs killed.
    The dogs are strangled, Williams is summoned back, and all present take part in
    the dog feast. A similar dog feast custom is also reported at Lac Seul.
  figure_refs:
  - fig:3
  - fig:7
  symbol_refs:
  - sym:3
  evidence_refs:
  - ev:7
- id: scene:3
  label: Written rituals and scalps in midewin dance
  summary: The passage reports midewin songs and rituals written on birchbark and
    separately reports five Sioux scalps carried in a Lac Seul midewin dance, suspended
    from ribbon-ornamented poles.
  figure_refs:
  - fig:3
  - fig:8
  symbol_refs:
  - sym:2
  - sym:6
  - sym:7
  evidence_refs:
  - ev:8
  - ev:9
- id: scene:4
  label: Turtle-mediated spirit contact
  summary: Certain shamans are said to obtain intercourse with spirits through the
    turtle as an intermediary.
  figure_refs:
  - fig:9
  - fig:10
  - fig:11
  symbol_refs:
  - sym:8
  evidence_refs:
  - ev:10
- id: scene:5
  label: Bound conjuror in shaking dome lodge
  summary: A conjuror allows himself to be bound and placed in a small dome-shaped
    tent. He summons supernatural helpers; the lodge shakes; his clothes and ropes
    are thrown out. At the end he is found naked and unbound while bystanders move
    around the lodge on hands and knees.
  figure_refs:
  - fig:11
  - fig:12
  - fig:13
  symbol_refs:
  - sym:9
  - sym:10
  evidence_refs:
  - ev:11
  - ev:12
- id: scene:6
  label: Ritual instruments and malevolent wooden figures
  summary: The passage notes distinctions in use of drum and rattle and reports that
    wooden figures were used in malevolent conjuring by being set in snow or on stumps
    to injure enemies.
  figure_refs:
  - fig:9
  - fig:12
  - fig:14
  symbol_refs:
  - sym:11
  - sym:12
  evidence_refs:
  - ev:12
  - ev:13
- id: scene:7
  label: Mide healing with empowered skins and medicines
  summary: Four or five mide may attend a sick person, using ornamented animal skins
    considered embodied with power and administering medicines tied to supernatural
    powers; converted shamans may destroy or cache herbs viewed as connected with
    evil spirits.
  figure_refs:
  - fig:14
  - fig:15
  symbol_refs:
  - sym:13
  - sym:14
  evidence_refs:
  - ev:14
  - ev:15
- id: scene:8
  label: Midewin degrees, succession, and vision requirement
  summary: The passage describes four degrees at northern posts, a head conjuror appointing
    degree-holders, succession when a holder dies, and the requirement that a prospective
    young male member receive a supernatural vision, the details of which are kept
    secret for fear of loss of power.
  figure_refs:
