canonical_text:
  quote: ''
  summary: Ethnographic notes describe Eastern Cree folklore transmission, fixed story
    titles, seasonal storytelling practice, comparative relations with neighboring
    traditions, the role of Wisagatcak as culture hero and trickster, animal clown
    figures, water-monster associations, and characteristic tale themes. The passage
    then begins a Wisagatcak tale in which he traps mythical big beaver, breaks a
    dam, is caught in rising water, makes a log raft with pairs of animals, and sends
    Muskrat and Crow to seek mud or dry land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says influenza mortality among older people made Eastern Cree
    myths and legends difficult to collect, and that younger people often remembered
    only fragments and objected to telling them in that form.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says stories had fixed titles, usually chosen from a character
    name, and that the former custom of not telling a story until after the first
    frost had recently been discontinued.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage contrasts older Cree preference for long incident-filled stories
    with a tendency among younger Cree to break legends into short anecdotes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wisagatcak is described as prominent on the west coast of James and Hudson's
    Bays as a culture hero and trickster, while the cycle was reportedly unknown to
    the Eastmain and Labrador Cree in 1908 inquiries.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some Cree familiar with Ojibway folklore identify Wisagatcak with Nanabozo,
    and nearby Saulteaux are said to have incorporated the name in the form WisEk^tcak.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says many Wisagatcak adventures are ludicrous and often obscene,
    but are not told merely for humor, and his benefactor role is not forgotten.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Otter and Hell-diver are described as clown or buffoon figures, and a water-monster
    figure is identified by the Cree with the walrus, who fears Thunder like the Horned
    Snake of other tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage names cannibalism tales, tales of rival conjurors, and escape
    through a hole dug in the ground as characteristic Eastern Cree tale features.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: Humorous quotations from well-known legends are said to be used in everyday
    situations, including references to Shingibis walking and Wisagatcak in his conjuring
    tent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage gives comparative counts of fifty Eastern Cree incidents shared
    with neighboring or related peoples, while warning that data from northern tribes
    are less complete.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Wisagatcak tale, he blocks a creek with stakes, leaves an opening,
    and waits for mythical big beaver to swim through it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Muskrat startles Wisagatcak by scratching him from behind, causing him to
    fail to kill the beaver; after dark, Wisagatcak goes ashore, builds a fire, and
    plans to break the beaver dam.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Wisagatcak makes a pointed juniper stick or spear, breaks the dam, and the
    water rises until he can no longer stand on the ground.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Wisagatcak makes a raft of logs, gets on it, takes aboard a pair of every
    kind of animal, and drifts for two weeks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Big Beaver conjure against Wisagatcak to revenge themselves for the broken
    dam.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Wisagatcak ties a long string to Muskrat's feet and sends him under the water
