  summary: The passage lists Northern Saulteaux direction and wind terms, gives a
    legend in which four sons become the south, east, west, and north winds and bring
    different weather, describes practices for ritually calling the north wind and
    snow, notes dog-restraint customs during travel and camp life, and summarizes
    Saulteaux and Eastern Cree art objects including a drum with moose, goose, and
    Wiseketcak images used for supplication and geometric designs on bear skulls and
    bones for religious and protective purposes.
