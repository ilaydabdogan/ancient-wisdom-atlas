literal_observations:
- id: obs:1
  text: The passage states that the Ojibway were widely distributed within the Algonkin
    stock, with former territory extending from the Niagara River toward central Montana
    and from northern Wisconsin and Michigan northward toward Hudson's Bay.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ojibway are divided into several culturally and dialectically distinct
    bands, which the source says probably spring from a common base southwest of Lake
    Superior.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage enumerates five divisions: Ojibway proper, Chippewa, Southern
    Saulteaux, Northern Saulteaux, and Plains Saulteaux or Long Plains Ojibway.'
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: The Southern Saulteaux are described as inhabiting the north shore of Lake
    Superior, allied in habits with the Ojibway proper, non-agricultural, non-warlike,
    mostly conical-wigwam dwellers, nomadic, and associated with scaffold burials.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Northern Saulteaux are described as an offshoot of the Southern Saulteaux
    that lost some southern traits, acquired others from the Eastern Cree, and practiced
    subterranean burials.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Northern Saulteaux are placed north of Lake Superior and east of Lake
    Winnipeg, congregating at several Hudson's Bay Company posts and outposts.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Northern Saulteaux call themselves "Otcipweo" and are said to recognize
    no difference between their division and other Ojibway bands.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes the Northern Saulteaux as non-warlike and on intimate
    terms with Europeans and the Cree.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says the Northern Saulteaux remember raids attributed to the Sioux,
    while the author suggests they may instead be referring to Iroquois raids.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Government annuity rolls give Northern Saulteaux numbers for Lac Seul,
    Fort Hope, Martens Falls, and English River, totaling 1527.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The source contrasts Saulteaux near the Canadian Pacific Railroad and farther
    north with northern interior bands in physical appearance and living conditions,
    and states that infectious disease would be especially dangerous among the latter.
  category: attribute
  evidence_refs:
  - ev:8
