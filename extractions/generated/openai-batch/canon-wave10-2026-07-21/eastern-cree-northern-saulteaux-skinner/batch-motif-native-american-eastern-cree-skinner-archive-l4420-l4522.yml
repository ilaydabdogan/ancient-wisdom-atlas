canonical_text:
  quote: ''
  summary: 'The passage recounts several Wisagatcak episodes: he punishes his rump
    with a hot stone, is hindered by its noises, eats his own scab, marks birch trees,
    tricks and kills a bear, alters Muskrat’s tail and wake with bear grease, is squeezed
    by trees while animals eat the bear, twists trees afterward, flies south in bird
    form and falls after looking at people, then retaliates against an old woman.'
  language: English
  quote_policy: summarized
