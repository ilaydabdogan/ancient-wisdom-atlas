  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Northern Saulteaux physicians are divided into shamanistic conjurors and a
    second class of healers; the shamanistic conjurors must belong to one of the four
    degrees of the midewin and rely mainly on supernatural power.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: While doctoring a patient, the shaman remained outside the lodge and did not
    carry on incantations inside it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some herbs, barks, stones, and similar remedies are said to be obtained by
    supernatural means or gathered according to dream directions; their uses are known
    only to the shaman.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: One method of obtaining remedies involves setting out empty vessels or bark
    wrappers, retiring to a secluded place, and spending the night in song and prayer
    with tobacco incense and drum music; in the morning a second person returns with
    vessels filled with remedies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A medicine box obtained at Fort Hope was placed in the woods to rot after
    the death of its shaman owner.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Carved wooden dolls used in medicinal practices are reported to be in shamans'
    possession, but details of their appearance or use were not learned.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says the False Face society of the Iroquois and Delaware, once
    found among the Missisauga band of the Ojibway, was never known to the shamans
    of the Northern Saulteaux.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The second class of healers is described as generally old women who use no
    supernatural means and rely on physical boluses, both internal and external.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Named remedies include black willow, mint with tea, country tea, spruce cones,
