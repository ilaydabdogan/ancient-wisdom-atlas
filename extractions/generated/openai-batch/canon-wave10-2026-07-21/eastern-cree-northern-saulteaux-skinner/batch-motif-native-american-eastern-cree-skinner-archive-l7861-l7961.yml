canonical_text:
  quote: ''
  summary: 'The passage describes initiation and medicine-lodge rites involving shamans,
    candidates, medicine bags, migis beads, offerings, feasting, wooden animal images,
    and an image identified as the god of medicine. It then gives Stewart''s account
    of the origin of the rites: Geeche Manitou revealed three ceremonies soon after
    creation, and an early conflict between the rattlesnake and the natawa brought
    death to humans through snake poison, followed by the rattlesnake receiving a
    warning rattle and the bereaved father mourning his dead son.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After candidates had been admitted, individual shamans performed feats involving
    swallowing migis beads and having them magically replaced in the medicine bag.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Offerings were taken down, given to newly initiated candidates, and then distributed
    by those candidates among the medicinemen according to arrangements made before
    the ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shamans marched around the tent at a half trot and pointed medicine bags at
    each other; those pointed at fell, sometimes appeared wounded or lame, and were
    ceremonially treated by others who made a show of extracting a bead from the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women and children sat around the inside of the tent and feasted at intervals;
    women went out to tend nets, and any caught fish were brought in and cooked immediately.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dogs that entered the tent accidentally were killed and boiled; dishes of
    dog meat, dog broth, or sturgeon were placed before wooden images and later divided
    among the medicinemen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Admission to the ceremony was obtained by giving presents of tobacco, tea,
    and sugar, which were deposited before wooden images of the goose, duck, fox,
    and other animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A row of poles ran down the middle of the lodge, and offerings hung from them;
    the offerings included calico, clothing, guns, knives, ammunition, and other objects.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rough wooden images of birds and other animals stood at the foot of each pole,
    and a partly wooden, partly clothed human-form image at the head of the tent was
    identified to Stewart as the god of medicine.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Spectators sat around the sides of the tent while ritual performers moved
    around the central poles with a chant and drum accompaniment.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Stewart's origin account says Geeche Manitou, the Great Spirit, revealed three
    mysterious ceremonies to humans shortly after creation, when the first pair had
    grandchildren and before death had entered the world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The origin account says two powerful snakes, the rattlesnake and the natawa,
    existed from the beginning of the world; the rattlesnake became jealous and challenged
    the natawa to test which had the deadlier poison by biting humans.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Two neighboring chieftains each had a grown son; the sons loved each other
    and hunted together, and both were ambushed and bitten by the two snakes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The young man bitten by the natawa died immediately, while the young man bitten
    by the rattlesnake reached his father's tent and recovered after a medicine man
    applied an antidote.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The natawa reproached the rattlesnake for bringing death and misery to mankind
    and declared that the rattlesnake would have a rattle in its tail to warn humans,
    who would pursue it to death.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The chieftain whose son died brought the body home, the tribe performed burial
    rites, and the father repeatedly visited the grave and mourned.
  category: action
  evidence_refs:
  - ev:10
