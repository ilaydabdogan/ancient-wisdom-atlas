  evidence_refs:
  - ev:1
- id: obs:3
  text: The snake says that a manitou of the old man's race will teach him the Metawin
    or tent of life and rites said to come from the happy hunting grounds, the center
    of the earth, and the depths of the waters.
  category: speech
  evidence_refs:
  - ev:1
