canonical_text:
  quote: ''
  summary: An old chieftain mourning at his son's grave encounters a great serpent
    that commands a third-day rite. After the chieftain points a pipe stem toward
    spirit abodes and lifts a horned serpent three times while speaking prescribed
    words, the serpent changes into a white-haired manitou-like teacher. The teacher
    instructs him in the Metawin or long tent of life, gives him sacred objects, blesses
    him, and vanishes. The chieftain later builds the long tent, teaches the men of
    his tribe, appoints officers, and has another son resembling the one who died.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a daily visit to his son's grave, the old man sees an enormous rainbow-striped
    snake ascending out of the earth and speaking to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snake commands the old man to return to the spot on the third day, lift
    a serpent three times by the horns, and repeat prescribed words of adoration.
