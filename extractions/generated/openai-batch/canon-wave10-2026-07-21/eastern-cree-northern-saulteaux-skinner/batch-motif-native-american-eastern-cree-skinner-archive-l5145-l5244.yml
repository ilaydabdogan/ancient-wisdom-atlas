canonical_text:
  quote: ''
  summary: 'The passage first gives a brief Wolverine episode explaining the saltiness
    of the sea after skunk fluid blinds Wolverine and is washed out in sea water.
    It then recounts a Rupert''s House version of the adventures of Tcikapis: as a
    boy living with his sister, he seeks and kills the animal that killed his parents;
    later he uses size-changing and a bow-canoe to enter and escape a fish; he outwits
    giant beaver hunters and protects his lodge by turning it to stone; and he kills
    a cannibal old woman by tricking her at a boiling pot, then brings two girls home
    to his sister.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wolverene kills a skunk in the forest, and the skunk discharges fluid into
    Wolverene's face, blinding him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blinded Wolverene asks trees what kind they are, recognizes driftwood as a
    sign that he is near the sea, reaches the sea, washes the skunk fluid from his
    eyes, and the narrative says this fluid makes the sea salt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tcikapis is introduced as a young boy living alone with his sister after their
    mother and father were slain by Katci'tos; his sister tells him his father had
    dark hair and his mother light hair.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tcikapis takes his bow and arrows, sings that he wants to meet the animal
    that killed his parents, and questions animals about whether they eat people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Katci'tos admits eating people and compares his strength to a Jackpine; Tcikapis
    splits the tree with an arrow, kills Katci'tos with another shot, and finds the
    recognizable hair of his parents in the animal's belly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tcikapis tells his sister to set fish hooks, turns up his bow and gets into
    it like a canoe, and the passage states that he can make himself very small or
    as large as a normal man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A great fish swallows Tcikapis whole; from inside the fish he sees the hook
    his sister set, causes the fish to take the bait, and later steps out when his
    sister guts the fish.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Tcikapis hears people chiseling beaver on the ice; his sister warns him that
    they are Big Fellows, or giants, who will try to make him take hold of a beaver's
    tail so he will be pulled in and laughed at.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tcikapis makes himself very small, goes to the river, pulls out a beaver without
    difficulty, carries it away, and claims it as his own when the Big Fellows object.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When his sister fears the Big Fellows will kill them, Tcikapis changes his
    wigwam into stone; the Big Fellows cannot break it, and Tcikapis laughs at them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tcikapis hears two girls scraping skin, ignores his sister's warning that
    their mother eats people, courts the girls, and receives their consent to kill
    their mother because she has killed their lovers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Tcikapis uses a bladder full of grease while the old woman cooks him; after
    the girls tell her to sit closer to the pot, he leaps out, scalds her to death,
    and brings the two girls home to his sister.
  category: sequence
  evidence_refs:
  - ev:10
