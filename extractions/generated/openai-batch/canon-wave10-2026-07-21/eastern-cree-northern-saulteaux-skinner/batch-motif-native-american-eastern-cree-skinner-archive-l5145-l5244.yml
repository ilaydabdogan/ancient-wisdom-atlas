- id: motif:3
  label: Strength test with a tree before monster killing
  taxonomy_refs: []
  basis: Katci'tos compares its strength to a Jackpine, and Tcikapis shoots and shatters
    the tree before killing the animal.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The tree functions literally as a strength comparison and target; the
