  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Armor was made from skin over wood, bark, or hard leather, with an inflated
    outer layer; shields were not carried because warriors were taught to dodge arrows
    or knock them aside with a spear.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The war dance and conjuring dance were performed before battle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Feasts for success were sometimes held, and their efficacy depended on guests
    eating everything set before them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The war cry could be given at the chief's order, and war cries were also still
    used when shooting rapids.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Scalping is reported, and in old wars against the Eskimo the victor customarily
