  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Eastern Cree made war against the Eskimo and some neighboring Algonkin,
    feared the Iroquois, and were friendly with the Saulteaux Ojibway.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A man who felt he was losing power in battle would stand and pray aloud to
    the sun, addressing it as his manitou and asking if it would deceive him.
  category: speech
  evidence_refs:
  - ev:7
