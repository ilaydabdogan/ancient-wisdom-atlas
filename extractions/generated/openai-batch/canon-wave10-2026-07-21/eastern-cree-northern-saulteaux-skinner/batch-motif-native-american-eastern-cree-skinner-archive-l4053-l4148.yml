  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Famous captured persons were sometimes tied to a stake, cut while alive, boiled,
    and eaten before their own eyes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author reports no trace of Cree use of the Central tribes' sacred war
