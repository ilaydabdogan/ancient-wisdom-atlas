  summary: The passage describes Eastern Cree war clothing, weapons, armor, dances,
    feasts, war cries, treatment of enemies, prayers and songs to the sun for battle
    power, and a quoted earlier account of war council procedures involving smoking
    a sacred stem and offering tokens or sacrifices.
  language: English
