  text: Warriors had special battle garments, including buckskin skull caps or head
    bands with feathers, and war paint was not used.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: War medicine revealed in dreams was rubbed over the body before battle.
