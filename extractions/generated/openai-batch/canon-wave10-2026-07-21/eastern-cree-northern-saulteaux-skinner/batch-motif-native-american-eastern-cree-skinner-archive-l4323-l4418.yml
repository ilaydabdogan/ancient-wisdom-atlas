canonical_text:
  quote: ''
  summary: Wisagatcak uses moss and conjuring on a raft; Wolf carries the moss around
    the raft until earth appears and grows over water. Wisagatcak later provides Beaver
    with a creek and an interim food source. In a separate episode, Wisagatcak deceives
    wild fowl with a moss lodge called a singing wigwam, kills many with a noose,
    kicks Loon as he escapes, then loses the cooked birds when a thief enters after
    Wisagatcak's personified rump stops giving warning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wisagatcak takes moss from his raft and begins to conjure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wolf is instructed to hold the moss in his mouth and run around the raft;
    as he does so, earth appears and grows on it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wolf continues running while the land grows larger, and after two weeks he
    has made it so large that he does not return.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the earth is built over water and uses this to explain
    subterranean springs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Beaver asks how they will live because there are no trees yet; Wisagatcak
    says Beaver will need a creek.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wisagatcak cannot find the original raft under the enlarged earth, makes a
    creek for Beaver, and tells Beaver to eat grass roots until trees grow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Beaver digs trenches in search of roots, refuses Wisagatcak's call because
    he fears being killed, and Wisagatcak says he will never return.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wisagatcak fills a bag with moss, calls it his singing wigwam, makes a lodge
    from it, and the wild fowl enter and dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wisagatcak sings commands for the birds to close their eyes and dance with
    heads and necks inward, then throws a running noose over their necks and strangles
    many.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Loon notices the killing, cries out that Wisagatcak is killing them, flees
    toward the door, and is kicked in the rump as he escapes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wisagatcak buries the birds in hot sand for roasting, leaves one leg of each
    visible, and tells his rump to keep watch while he sleeps.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The rump twice warns Wisagatcak of an intruder by breaking wind, but after
    being scolded it fails to warn him; the thief steals the birds, leaves feet in
    the sand, and Wisagatcak wakes to find he has been robbed.
  category: sequence
  evidence_refs:
  - ev:8
