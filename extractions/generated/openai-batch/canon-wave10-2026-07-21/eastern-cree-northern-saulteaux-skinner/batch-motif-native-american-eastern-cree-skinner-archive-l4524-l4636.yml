canonical_text:
  quote: ''
  summary: The passage gives two narrative episodes. In the first, Wisagatcak tricks
    women with a beaver-head pulling game, sexually assaults one woman, is exhausted
    by the sisters' continued demands, and later builds a rock shelter while fleeing
    or avoiding the north wind. In the second, two boys survive a Cannibal/Wetigo,
    escape underground with the help of an awl and thrown objects that become obstacles,
    cross a lake on Walrus, see the Cannibal drowned, and later the older boy is abducted
    by Wemishus while the younger is raised by polar bears.
  language: English with a Latin passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wisagatcak, while traveling, met three sisters who had never seen a man and
    proposed a new game to the best-looking sister using a freshly severed beaver
    head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The proposed game required the two participants to hold opposite jaws of the
    beaver head, sit with feet braced together, and pull; Wisagatcak let go when the
    woman was pulling hardest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the woman fell, the Latin passage says Wisagatcak sexually assaulted
    her; the sisters became involved in the same 'game,' and Wisagatcak eventually
    escaped nearly dead from exhaustion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wisagatcak went north, met the north wind beyond Winisk-sibi, built a man-sized
    rock shelter said still to be visible, and his later fate is unknown.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Cannibal, identified in a note as a cannibal or Witigo, killed a whole family
    except two small boys and intended to fatten and eat them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The older boy told the younger to find their mother's awl, then used it to
    bore a hole into the ground so the two boys could flee underground.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: During the underground flight, the older brother carried the younger on his
    back, and a root projecting from the roof tore the younger child's cheek.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'As the Cannibal gained on the boys, the older brother threw away objects:
    wood became a dense forest, a rag became thick briars, and a stone became a large
    boulder that blocked the hole.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boys reached a lake and rode on Walrus's back; Walrus asked them to watch
    for Thunder, but the boys delayed warning him about the clouds until they were
    near shallow water at the far shore.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Walrus warned the boys about Wemishus and arrows falling into water; later
    Walrus carried the Cannibal, dived after the Cannibal moved and hurt his neck,
    and drowned him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wemishus lured the older boy toward an arrow in the water, hooked him into
    his canoe with a paddle, and took him away while leaving the younger brother on
    the bank.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The younger brother cried on the bank until two polar bears came, comforted
    him, and raised him until he became a man.
  category: sequence
  evidence_refs:
  - ev:10
