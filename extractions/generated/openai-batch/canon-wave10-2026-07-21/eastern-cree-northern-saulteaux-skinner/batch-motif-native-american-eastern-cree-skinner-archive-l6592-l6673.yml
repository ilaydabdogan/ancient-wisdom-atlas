canonical_text:
  quote: ''
  summary: 'The passage describes Northern Saulteaux material practices: pottery making
    by coil construction, use of stone vessels and hot-stone boiling, the absence
    of birchbark cooking vessels, methods for harvesting and preparing birchbark,
    and a detailed sequence for constructing birchbark canoes. It also notes a construction
    difference between Saulteaux and Eastern Cree canoe gunwale binding and mentions
    band-level preferences in canoe bow and stern form.'
  language: English
  quote_policy: summarized
