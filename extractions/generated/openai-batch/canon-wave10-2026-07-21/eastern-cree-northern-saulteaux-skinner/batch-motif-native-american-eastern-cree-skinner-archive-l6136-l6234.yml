canonical_text:
  quote: ''
  summary: The passage describes Saulteaux clothing by gender, age, season, region,
    materials, and later European trade goods. It also records a custom of cutting
    holes in very young children's moccasin soles, explained as preventing spirits
    from enticing a recently born child back to the spirit land, because the child
    can say its moccasins are unfit for the long road to the hereafter. The passage
    further discusses rabbitskin garment manufacture and copying among Eastern Cree,
    Ojibway/Northern Saulteaux, and Albany Cree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old-time men's clothing southward from Lac Seul is described as made from
    smoked tanned buckskin, caribou, and sometimes woven rabbitskin, with moccasins,
    leggings, breechclout, cap, and winter additions of rabbitskin coat and mittens.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women's clothing is described as a sleeveless leather dress with separate
    sleeves, belt, leggings, moccasins, and winter additions such as rabbitskin coat,
    hood, mittens, or a small rabbitskin blanket worn like a cape.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Children's clothing is said to be the same as adult clothing except for size,
    and very young children's moccasins could have holes cut in the soles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stated explanation for the holes is that a recently born child is fresh
    from the spirit land and may be enticed by spirits to return, which is equated
    with dying.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the moccasins have holes, the child is obliged to tell the spirits that
    the footwear is not fit for the long road separating the present from the hereafter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: North of Lac Seul, men's clothing is described as changing toward rabbitskin
    leggings, breechclout, coat, separate hood, and sometimes mittens and moccasins,
    with the variation attributed to colder climate and men's winter hunting outdoors.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says Eastern Cree made rabbitskin blankets, coats, and hoods;
    Ojibway learned the art from them and made additional garment types; Albany Cree
    copied some of those articles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After European contact, strouds, duffels, silks, and beads altered clothing,
    though cloth garments were initially cut after older garment forms.
  category: sequence
  evidence_refs:
  - ev:7
