canonical_text:
  quote: ''
  summary: Ethnographic notes describe Eastern Cree games and amusements, including
    cup-and-pin, bows and slings, otter hunting, war, dart, caribou hunting, and goose
    hunting games. The passage records equipment, scoring, participants, and brief
    comparisons with Ojibway, Naskapi, Cumberland House Cree, and Plains-contact contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer reports no gathered record of gambling games among the Eastern
    Cree visited, while citing Franklin for platter game, mitten game, and lacrosse
    among Cree of Cumberland House and westward.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cup and Pin Game is described as old, having two forms and several counting
    systems, and as seeming to simulate taking caribou with spears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Eastmain River and Rupert's House cup-and-pin apparatus uses worked caribou
    phalangeal bones, a buckskin thong, a wooden or bone striking pin, and a piece
    of caribou tail.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cup-and-pin scoring is assigned to individual bones and to named parts of
    the condyle, including the back of the neck, ears, and tail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Moose Factory, Ojibway-derived, and Fort Albany forms alter the number of
    bone units, point values, and the use of perforated buckskin or caribou tail.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bows, blunt arrows, bow guns, and a sling are described as projectile toys
    or implements used by boys at the posts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Otter Hunting Game is played by two men shooting pointed arrows at ten
    wooden otters, with the moving smallest otter determining win or loss.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The War Game is described as an old-time game for men and boys that teaches
    dodging missiles; one man runs before warriors who shoot blunt arrows at him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Dart Game uses a supple stick, thong, and a large notched arrow with a
    big tail, with the object of throwing the arrow up out of sight.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Caribou Hunting Game uses a carved caribou board with twig antlers as
    a target for boys flipping pebbles with a stick; bows and arrows may also be used.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Goose Hunting Game has two boys representing hunters in a blind shooting
    pebbles at goose feathers carried by two approaching boys; the hunter with the
    most game wins.
  category: action
  evidence_refs:
  - ev:10
