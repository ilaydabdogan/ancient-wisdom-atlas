canonical_text:
  quote: ''
  summary: The passage recounts Tcikapis climbing a tree that grows to the sky, encountering
    the sun's heavenly path, snaring the sun after being burned, and having a shrew
    release it. A second Albany version tells episodes in which Tcikapis and his sister
    survive bears, Tcikapis is swallowed by a fish and freed, kills bears, disguises
    himself as a Canada jay, survives boiling water, takes a giant beaver from giant
    men, protects himself under a shell, loses and rescues his sister from giants,
    and again snares the sun, causing darkness until animals release it. The passage
    ends with the beginning of a fragment titled “The Virgin Birth,” describing a
    chief’s beautiful daughter who refuses suitors.
  language: English
  quote_policy: summarized
