candidate_motifs:
- id: motif:1
  label: ascent by sky-reaching tree
  taxonomy_refs:
  - ascent
  - sacred_tree_axis
  basis: Tcikapis climbs a tree that grows until it reaches the sky and later uses
    the tree with his sister and wives.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: medium
  cautions: The passage presents the tree as a route to the sky but does not explicitly
    call it sacred or an axis.
- id: motif:2
  label: snaring the sun and restoring daylight
  taxonomy_refs: []
  basis: In two episodes, Tcikapis catches the sun in a snare, producing cosmic disorder
    or darkness, and the shrew releases it.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:19
  - ev:20
  - ev:21
  confidence: high
  cautions: No supplied taxonomy family directly names a snared-sun motif.
- id: motif:3
  label: small animal releases dangerous celestial power
  taxonomy_refs: []
  basis: Tcikapis cannot approach the hot sun, and in the Albany version one small
    animal is burned before the shrew succeeds.
  evidence_refs:
  - ev:5
  - ev:20
  - ev:21
  confidence: high
  cautions: The interpretation is limited to the release action described in the passage.
- id: motif:4
  label: survival after being swallowed
  taxonomy_refs:
  - death_rebirth
  basis: Tcikapis is swallowed by a fish and later speaks from inside it and is released
    alive.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not say Tcikapis dies inside the fish, so death-rebirth
    is only approximate.
- id: motif:5
  label: body feature established for later people
  taxonomy_refs:
  - culture_hero
  basis: Tcikapis says the fish slime should remain on his head and upper lip so that
    later people will have hair there.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage states an etiological effect for later people but does not
    explicitly label Tcikapis a culture hero.
- id: motif:6
  label: bird-skin disguise for theft
  taxonomy_refs:
  - shapeshifter
  - sacred_theft
  basis: Tcikapis dresses in a Canada jay skin, flies about, and steals grease from
    giant women.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage describes disguise rather than a full bodily transformation;
    the stolen grease is not called sacred.
- id: motif:7
  label: death-like boiling followed by return and revenge
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The giant women kill or appear to kill Tcikapis, throw him into boiling water,
    and he jumps out alive and kills them.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The text says Tcikapis was “not really dead,” so resurrection is only
    a loose candidate.
- id: motif:8
  label: stolen sister rescued from giants
  taxonomy_refs:
  - stolen_beloved
  - return
  basis: Giant men take Tcikapis’s sister, and he follows and destroys them without
    harming her.
  evidence_refs:
