literal_observations:
- id: obs:1
  text: A killed caribou’s death may be announced by bringing in a tuft of hair or
    the right foreleg cut at the knee, with no other ceremony attached to the act.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tanned caribou skins retain the tail or a tuft of tail hair and are painted
    in vermilion; caribou-skin parkas may have esoteric painting on the inside.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duck and goose heads are stuffed, preserved, decorated with beads, and kept
    as charms, trophies, and means to propitiate bird spirits.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A piece of loon neck skin may be attached to a hunter’s rifle as a luck charm.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The first fish caught in spring are burned as an offering to the sovereign
    spirit or manitou of the fish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When camping together, a band may set up a stripped pole before camp and hang
    skulls of bear, beaver, otter, and loon from it out of reach of dogs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The skull pole is described as honoring the animals and publicly declaring
    the hunters’ indebtedness to them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man seeking success in fishing or hunting water animals may build a pole
    scaffold, fast, ascend it at night, and pray and fast until receiving a dream
    about taking water animals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In hunting-medicine, an evil spirit appears and gives a hunter a magic draught
    that gives power to attract beasts to traps.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: If a hunter dreams of seeing or killing an animal, on waking he sings a luck
    song about the dream and the animal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A young man who kills a large animal for the first time stays up all night
    singing, drumming, and praying, and a feast is given in his honor; this is repeated
    for each new species of big game first killed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Franklin is cited as saying some Cree hunters prevent women from eating the
