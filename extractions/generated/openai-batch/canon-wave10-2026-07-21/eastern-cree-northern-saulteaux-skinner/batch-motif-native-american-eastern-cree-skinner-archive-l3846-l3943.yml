candidate_motifs:
- id: motif:1
  label: Propitiation of hunted animals through preserved remains and offerings
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The passage repeatedly describes animal remains, charms, skulls, and first
    fish being preserved, displayed, or burned to propitiate spirits, honor animals,
    or seek future hunting success.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:12
  confidence: high
  cautions: The passage is ethnographic description rather than a narrative myth;
    the specific meanings of some Eastern Cree ceremonies are stated to be partly
    lost.
- id: motif:2
  label: Night ascent and fasting for dream-given hunting knowledge
  taxonomy_refs:
  - ascent
  - mystical_quest
  - wisdom
  basis: A man builds a scaffold, fasts, ascends it at night, prays, and waits for
    a dream that may reveal how to take water animals.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The ascent is to a scaffold, not a cosmic mountain or other explicit cosmological
    axis.
- id: motif:3
  label: Supernatural hunting-medicine bestowed by a spirit
  taxonomy_refs:
  - sacred_exchange
  basis: An evil spirit appears and gives a hunter a magic draught that grants power
    to attract beasts to traps.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives only a brief description and does not state the full
    ritual or moral framework for the spirit’s gift.
- id: motif:4
  label: First-kill vigil and feast
  taxonomy_refs:
  - initiation
  basis: A young man’s first killing of a large animal or new big-game species triggers
    an all-night sequence of singing, drumming, and prayer followed by a feast in
    his honor.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly call this an initiation, but the observance
    marks a first achievement and is ritually repeated for new species.
- id: motif:5
  label: Animal master controlling game and rewarding proper honors
  taxonomy_refs:
  - sacred_exchange
  basis: The bear manitou controls all bears and is pleased by sacrifices and honors,
    rewarding hunters with future success.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The named master is specifically the bear manitou; the passage does not
    generalize this structure to all animal species except through broader animal-personhood
    beliefs.
- id: motif:6
  label: Animal personhood and exceptional bear power
  taxonomy_refs: []
  basis: Animals are described as speaking and thinking beings, and the bear is described
    as especially intelligent, powerful in medicine, manlike, and in some traditions
    an unfortunate man.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: Although this resembles broader animal-personhood patterns, the passage
    does not narrate transformation or shapeshifting.
- id: motif:7
  label: Hunting taboo concerning animal head and bones
  taxonomy_refs: []
  basis: The cited Franklin report says some Cree hunters prevent women from eating
    a moose-deer head and avoid having its bones given to dogs because such acts might
    spoil future hunts.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is reported from Cumberland House Cree and cited within the passage;
    its relation to the immediately described Eastern Cree customs is not fully specified.
comparison_claims:
- id: claim:1
  claim: 'The passage presents Northern Saulteaux/Ojibway bear sacrifices and Eastern
    Cree bear honors as likely sharing a function: honoring the slain bear and securing
    favor for future hunts.'
  claim_level: same_function
  target: Eastern Cree bear honors compared with Northern Saulteaux/Ojibway bear sacrifice
    explanations
  evidence_refs:
  - ev:12
  - ev:13
  counter_evidence_refs:
  - ev:17
  confidence: medium
  limitations: The author states that the original reasons for many Eastern Cree bear
    ceremonies are lost; the shared rationale is partly inferred from proximity and
    interchange.
- id: claim:2
  claim: The passage explicitly notes proximity and known interchange of ideas and
    culture between Eastern Cree and Northern Saulteaux as a basis for considering
    shared bear-ceremony explanations possible.
  claim_level: historical_contact
  target: Eastern Cree and Northern Saulteaux bear ceremonial traditions
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is limited to the author’s statement of proximity and interchange;
    it does not document a specific transmission event for the bear practices.
