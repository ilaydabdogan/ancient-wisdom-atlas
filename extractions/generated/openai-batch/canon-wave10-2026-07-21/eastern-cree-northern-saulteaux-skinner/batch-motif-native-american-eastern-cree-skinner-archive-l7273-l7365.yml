canonical_text:
  quote: ''
  summary: The passage describes Saulteaux and related Eastern Cree travel and transportation
    technologies by season, including summer canoe travel, pack straps and burden
    frames, several types of baby carriers, winter toboggans and mail-hauling sticks,
    recent dog sled adoption, snowshoe forms and materials, canoe sleds, and a lynx-jaw
    snowshoe unlacer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In summer, travel is described as mostly by canoe along rivers, with few long
    trails known except those used in winter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pack baskets of birchbark are described as occasional among southern Saulteaux
    bands and groups near the northern shore of Lake Superior, while farther north
    the pack strap replaces them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pack strap has a broad leather section across the forehead and side thongs
    for tying a burden, with weight resting more on the head and neck than the shoulders.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Former burden frames are described as horseshoe-shaped with elongated sides,
    a babiche web, and a forehead pack strap; articles and tools were hung or hooked
    on them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Saulteaux baby carriers are described in three forms: an older board-and-bag
    form, a southern form with a bow supporting a canopy and protecting the child,
    and a northern form with a simple bow.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A child on a baby board is laced into a bag softened with moss; the moss absorbs
    urine and is changed, and the arms are usually bound during travel but freed at
    rest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Baby boards are carried by a strap over the chest or forehead, and the same
    strap may be used to suspend and rock the bag from a post or tree branch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In winter, toboggans are used to draw supplies over snow; a man is said to
    pull about half as much as he can carry with a head strap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Indigenous mail toboggan pullers for the Hudson's Bay Company formerly carried
    decorated swinging sticks held by knobs and moved side to side while pulling.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Dog sleds are described as recent innovations brought from the Eskimo through
    the Eastern Cree and as rarely used by the Saulteaux.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'Two common snowshoe types are described: a long narrow form for hunting and
    walking in forests, and a short rounded form for running or following dog teams.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Snowshoes may be netted with babiche, sturgeon skin, or willow-root bark;
    bark netting is greased to prevent cracking in cold weather.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Canoe sleds are used in spring to drag canoes over snow from river to river
    when the ice is breaking up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A snowshoe unlacer is described as being made from one ramus of the inferior
    maxillary of the lynx.
  category: object
  evidence_refs:
  - ev:6
