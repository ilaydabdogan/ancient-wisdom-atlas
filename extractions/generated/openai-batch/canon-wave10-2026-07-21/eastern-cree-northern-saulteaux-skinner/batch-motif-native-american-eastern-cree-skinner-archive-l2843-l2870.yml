canonical_text:
  quote: ''
  summary: 'The passage describes markings on animal skins and skin tents: some are
    made to propitiate an animal spirit, some form decorative borders including crosses,
    and some resemble sacred crosses on shaman''s drums. Paintings on the inner skin
    surface represent the animal from which the skin came; red daubs outline the animal''s
    eyes when the head skin is used as a hood. The markings are said to symbolize
    that the skin is animate and able to imbue the owner.'
