canonical_text:
  quote: ''
  summary: 'The passage ends a tale fragment in which two brothers are recognized
    and depart after the youth dismisses two polar bears. It then begins the tale
    of Aioswe''s son: a jealous father abandons his son on a rocky island, the boy
    is carried toward shore by Walrus while lying about clouds and thunder, Walrus
    is killed by a conjured storm, and the boy continues home with help from a mother-sent
    old woman who gives him a stuffed ermine skin weapon. The excerpt ends as he reaches
    a wigwam occupied by two blind dangerous hags produced by his father''s adverse
    conjuring.'
  language: English
  quote_policy: summarized
