canonical_text:
  quote: ''
  summary: The passage narrates a conflict between Kanweo, his brother, and a Witigo/Cannibal
    group. Kanweo consults spirits, leads a surprise attack, later learns that Cannibals
    killed his brother and captured his brother's wife and children, then disguises
    himself during a beaver-hunting encounter with the old Cannibal chief who killed
    his brother. Kanweo arranges a future beaver-hunting plan with the chief and his
    sons and prepares a night feast to prosper in killing his enemy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrative begins with two brothers living near a tribe called Witigo or
    Cannibals, who hunted ordinarily but killed and ate men when they could.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two brothers encountered the Cannibals while traveling in summer and escaped;
    Kanweo then warned his people to prepare for battle or be killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kanweo conjured and asked whether he would be victorious in war; the spirits
    replied that he would be victorious if he chose to go.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kanweo's people gathered war spears and sword arrows before setting out.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kanweo planned a hidden attack and sent his men onto a hill behind the Cannibals'
    place to watch for a time when the Cannibals were unready.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Cannibals began building sweat houses; Kanweo's party attacked, spearing
    Cannibals as they ran out, and some Cannibals burned themselves on hot stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kanweo did not kill the Cannibal women and children, and the women and children
    escaped.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Cannibals are described as giants or very large people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: An old Cannibal chief and his children escaped in a canoe; Kanweo ran into
    the water and gripped the canoe's head but could not hold it because the water
    was too deep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In a later winter, Kanweo's brother was killed by Cannibals when they came
    upon him unawares, and his wife and children were taken alive.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kanweo learned what had happened to his brother and wished to take revenge,
    but did not know where the Cannibals were.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: During a winter hunt, Kanweo put on his oldest and worst clothes, made himself
    look miserable, and went looking for beaver with only an ice-boring chisel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At a creek near beaver works, Kanweo saw the old Cannibal chief who had escaped
    earlier and who had killed his brother; both men pretended not to see each other.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The old Cannibal intended to knock Kanweo down before being noticed, but Kanweo
    pushed him away and then the two began speaking as friends.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Kanweo arranged to chisel for beaver with the old Cannibal the next day; the
    old man said his three sons would come, and Kanweo gave instructions about cutting
    sticks and making a foot-beaten path without snowshoes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Kanweo returned home, brought four dry beavers into his tent, told his wife
    to cook them, and said they should finish them before daylight as a feast so he
    might prosper in killing his enemy.
  category: action
  evidence_refs:
  - ev:9
