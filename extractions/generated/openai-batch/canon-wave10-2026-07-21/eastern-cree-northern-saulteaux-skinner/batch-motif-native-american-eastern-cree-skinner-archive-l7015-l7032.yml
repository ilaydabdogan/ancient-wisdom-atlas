  quote: ''
  summary: The passage describes obtaining fire with a twirling stick fitted into
    a hole, birch punk used as touchwood, and shredded birchbark added for flame.
    It records a 1909 demonstration by Abitcininis at Wabigoon Lake near Dinorwic,
    using a self-made model with a base board held between the knees, a bow in the
    right hand, and the shaft steadied with the left palm; smoke appeared after about
    three minutes, but the demonstration stopped for lack of tinder.
