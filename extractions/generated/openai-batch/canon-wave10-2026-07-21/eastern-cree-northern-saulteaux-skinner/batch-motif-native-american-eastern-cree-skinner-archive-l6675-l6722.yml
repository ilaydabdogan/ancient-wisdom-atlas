canonical_text:
  quote: ''
  summary: 'The passage describes Northern Saulteaux material technologies: finishing
    and dyeing birchbark canoes; use and construction of stone axes, crooked knives,
    arrow points, needles, snow goggles, and birchbark torches; and some notes on
    tool materials and techniques.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rising points on canoe ends are described as preventing damage when the canoe
    is overturned on shore.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After canoe ends are fastened, false work and stones are removed, seams are
    pitched inside with plain spruce gum, and rags and flexible lathes are laid inside
    the bottom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The canoe exterior is pitched with spruce gum mixed with powdered birchbark
    charcoal to create a black appearance contrasting with light birchbark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Many Indigenous canoe makers dye canoes with black willow root bark, producing
    a reddish-brown color that can bleach out after one or two seasons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: 'The passage gives canoe lengths: average 15 to 18 feet, about 12 feet as
    shortest, and formerly up to 40 feet.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: Before European contact, the Saulteaux used stone axes probably of the celt
    type, and the grooved ax is said not to have been known to them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: A model celt-type stone ax at Lac Seul was hafted in a split stick and bound
    above and below the blade with split willow root.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: Stone axes and early European metal axes are described as so valuable that
    a family rarely had more than one ax.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:9
  text: 'Two former kinds of crooked knives are described: a sharpened caribou rib
    with a buckskin-wrapped grip, and a flint knife chipped with a hammerstone.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Arrow points were usually made of stone or bone, with bone taken from the
    shin of deer or caribou; antler and semilunar scrapers are said not to have been
    used.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: Needles were made from bone, thorns, or carved wood, and perforations in wooden
    needles and other wooden objects were made by burning.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Snow goggles are described as hollowed wooden forms, narrow at the ends, projecting
    forward from the eyes, and blackened inside with soot or gunpowder.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Small and large torches are made from rolls of birchbark, with small torches
    used in wigwams and larger ones used outdoors at night.
  category: object
  evidence_refs:
  - ev:6
