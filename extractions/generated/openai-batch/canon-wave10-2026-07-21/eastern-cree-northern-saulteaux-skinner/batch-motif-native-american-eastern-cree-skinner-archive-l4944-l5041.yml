canonical_text:
  quote: ''
  summary: The passage gives two folklore narratives. In the first, Tcigibis kills
    his brother Loon out of jealousy, stages his own bleeding with caribou blood in
    a bladder, dives away, and escapes; the narrator connects his survival with the
    continued existence of hell divers. In the second, Big Skunk pursues starving
    animals using destructive flatus, but animal helpers evade him, block his weaponized
    anus, stab him, and finish killing him.
  language: English
  quote_policy: summarized
