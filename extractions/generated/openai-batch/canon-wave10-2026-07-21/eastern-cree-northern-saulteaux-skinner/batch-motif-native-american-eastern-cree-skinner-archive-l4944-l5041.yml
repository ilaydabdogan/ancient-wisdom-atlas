candidate_motifs:
- id: motif:1
  label: Jealous fratricide followed by staged self-death
  taxonomy_refs: []
  basis: Tcigibis kills his brother Loon because of jealousy over his wife, then uses
    a hidden blood bladder to make the people think he has stabbed himself fatally.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives the sequence plainly, but does not assign a named motif
    label.
- id: motif:2
  label: Ancestor or survivor whose escape preserves an animal kind
  taxonomy_refs: []
  basis: After Tcigibis escapes, the narrator says that if the people had caught and
    killed him, there would have been no more hell divers.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The etiological link is explicit, but the exact relation between Tcigibis
    and hell divers is not further explained in this excerpt.
- id: motif:3
  label: Food offer with permanent diet consequence
  taxonomy_refs: []
  basis: The starving animals almost receive Beaver's meat, but after Beaver refuses,
    the narrator says that eating it would have forced them ever after to live on
    bark and grass like Beaver.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage frames the consequence as an explanatory aside, not as a formal
    taboo.
- id: motif:4
  label: Weaponized bodily emission and bodily aperture vulnerability
  taxonomy_refs:
  - trickster_boundary
  basis: Big Skunk's discharge destroys a stump and mountain and is aimed at Wolverene,
    but Wolverene defeats him by biting and closing his anus so he cannot fire.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is a cautious pattern match; the passage itself
    does not call Big Skunk a trickster.
- id: motif:5
  label: Feigning death to evade a dangerous pursuer
  taxonomy_refs: []
  basis: An old otter too weak to flee pretends to be dead when Big Skunk arrives,
    and Big Skunk leaves him covered with brush to pick up later.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The later fate of this specific old otter is not stated in the excerpt.
- id: motif:6
  label: Collective defeat of a dangerous animal pursuer
  taxonomy_refs: []
  basis: Wolverene disables Big Skunk's weapon, calls the animals, Otter stabs him
    through the body, and Lynx finishes him.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage identifies several animal participants but does not specify
    whether the stabbing Otter is the same as either previously mentioned otter.
