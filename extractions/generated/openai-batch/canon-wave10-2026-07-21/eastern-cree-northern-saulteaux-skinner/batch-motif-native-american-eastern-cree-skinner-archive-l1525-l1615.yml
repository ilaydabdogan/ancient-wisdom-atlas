canonical_text:
  quote: ''
  summary: Ethnographic passage describing Eastern Cree methods of roasting, boiling,
    smoking, drying, carrying, storing, and serving meat, fish, and limited vegetable
    foods, with attention to fire, water, scaffolds, bark containers, stone boiling,
    stomach kettles, soapstone vessels, and bark rolls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Meat for roasting is cut thin, placed lengthwise on a spit, spread with wooden
    skewers, and set obliquely close to the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Deer, moose, and caribou hearts may be suspended from a tripod by a string
    and skewer, swung near the fire, and kept revolving for even heating.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Meat is smoked and dried for future consumption, while fish may be boiled
    whole with scales and entrails before being cleaned after cooking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The water in which fish is boiled is described as a healthy beverage.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The nose, heart, and tongue of deer-family animals are described as delicacies;
    marrow is eaten roasted, raw, or boiled.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Animal bone joints are pounded, boiled to extract grease, poured into moulds,
    cooled, and stored in birchbark boxes, sometimes mixed with meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The writer observed moose meat being preserved by heat from a fire on August
    18, 1909, and describes the term smoked meat as less accurate than fire-cured
    meat for this process.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A moose was butchered by two Cree, and the next day its flesh was cut into
    thin strips and dried on a green-wood scaffold over a fire.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: During quick drying, one man continually went around the grill and kept the
    raw side of the meat turned toward the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The quick scaffold-drying method is associated with travel, while a three-pole
    smoking frame is described as slower and producing meat that lasts longer.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Fish intended for future use are placed on a green-wood grill over a fire
    and smoked.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Vegetable foods are described as rare; berries, especially blueberries, are
    boiled into paste and cut into loaves, and birch water molasses, roots, wild onions,
    and a rhubarb-like plant are also mentioned.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: While traveling, part of a caribou or moose stomach can serve as a kettle
    hung over the fire.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: Wooden pans and bowls are said to have been used for boiling food by dropping
    hot stones into water, but such bowls are described as obsolete.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Birchbark vessels or baskets are used for boiling water directly over the
    fire, though they do not last as long as stomach kettles.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Pottery is described as unknown to the Eastern Cree; steatite or soapstone
    vessels and animal skull caps are mentioned as culinary utensils.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Plains parfleche is described as unknown, but meat is sometimes carried
    in a bark roll made of sewn bark pieces with root thread and sticks at the ends.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: The bark roll is spread on the ground like a tablecloth; people sit around
    it, meat is placed on it, cut up, and distributed, and the roll is stored rolled
    up when not in use.
  category: action
  evidence_refs:
  - ev:10
