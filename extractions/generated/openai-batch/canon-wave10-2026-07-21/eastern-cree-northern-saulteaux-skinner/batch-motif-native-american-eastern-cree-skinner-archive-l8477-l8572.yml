canonical_text:
  quote: ''
  summary: The Northern Saulteaux tale titled “Omishus” begins with a hunter, his
    wife, and their two sons. The hunter discovers that his wife summons a man from
    a tree, kills the man, feeds the wife blood from him mixed with deer blood, then
    kills her and deserts the children. The wife’s severed head pursues the boys.
    The elder brother delays it with objects, including a comb that becomes a mountain.
    A swan ferries the boys across a river, then drops the head into the water after
    it disobeys the swan’s warning about a neck scab. The drowned head is said to
    become a sturgeon, explaining the fish’s fleshy cheeks. At the end, Omishus tricks
    the elder boy into his canoe, which moves off without paddling.
  language: English, with some Latin phrases
  quote_policy: summarized
