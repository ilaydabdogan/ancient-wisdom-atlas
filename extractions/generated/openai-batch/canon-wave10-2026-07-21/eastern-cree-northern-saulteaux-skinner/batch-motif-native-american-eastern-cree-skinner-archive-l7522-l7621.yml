  summary: The passage describes Northern Saulteaux social organization, former matriarchal
    and clan structures, animal-named clans and clan-animal food taboos, chiefship,
    exclusive hunting territories, marriage practices involving gifts and public actions,
    naming taboos, and child-rearing customs.
  language: English
