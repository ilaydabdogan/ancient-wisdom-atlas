literal_observations:
- id: obs:1
  text: The Northern Saulteaux are described as less isolated than the Eastern Cree,
    with winter camps usually containing several related families.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says a former matriarchal exogamic clan system was known, but
    traces of it were largely lost; inheritance was formerly through the mother except
    for family hunting grounds.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists multiple animal-named clans and says the clans no longer
    have importance or exogamic force.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Members are said to eat the animals of their own clan totems, while certain
    parts are tabooed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Former chiefs are described as men who gained power by ability and personal
    influence, while contemporary chiefs are appointed by the government.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Every adult male Northern Saulteaux is said to have an exclusive trapping
    and hunting range called Tzikewin, with inheritance rules for relatives and widows’
    kin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: One described marriage procedure includes asking the girl’s father, a sweat
    bath, the lover smoking a pipe, throwing one hundred small pieces of wood for
    the girl to catch in a bark bowl, gifts to the father, a feast, dancing and war
    songs, exchange of presents, and the father covering the couple with a beaver
    robe and giving a gun and canoe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Informants describe a later or simpler marriage practice in which a present
    was made to the young woman’s father and the woman was sent to live in the husband’s
    lodge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports polygamy and a preference for wives from a group of sisters
    when possible.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Children were named at birth and a feast was given; asking a man directly
    for his name was taboo.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Children are described as trained by example, rarely reproved, not struck,
