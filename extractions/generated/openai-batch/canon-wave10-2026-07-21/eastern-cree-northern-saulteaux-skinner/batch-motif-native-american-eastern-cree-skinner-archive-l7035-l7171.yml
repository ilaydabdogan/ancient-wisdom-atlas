  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wooden tops are spun with the fingers and are also used to make the wind blow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In shinny, two wooden balls are tied together and carried or thrown with a
