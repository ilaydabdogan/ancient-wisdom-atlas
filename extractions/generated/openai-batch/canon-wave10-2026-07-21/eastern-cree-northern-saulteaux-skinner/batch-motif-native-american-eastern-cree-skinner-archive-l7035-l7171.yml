canonical_text:
  quote: ''
  summary: The passage describes Northern Saulteaux amusements and toys, including
    cup-and-pin scoring, hoop-and-rings and string puzzles, hand ball and football,
    bull roarers and tops used by hunters to bring wind, shinny, fox and geese, snow
    snake, children's toy weapons and canoes, and small animals dressed as dolls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Northern Saulteaux favorite pastime is described as the cup and pin game,
    using eight deer or caribou phalangeal bone units and a buckskin tail, with points
    counted for particular catches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the cup and pin game, the required total to win is one hundred points,
    and small sticks are used as counters.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A player in the cup and pin game may continue until missing a throw, after
    which the game passes to the left-hand neighbor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hoop-and-rings puzzle requires freeing a hoop from rings while retaining
    the free ends in the hand, then returning it to its earlier position.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the hoop-and-rings puzzle was formerly known to the
    Seneca Iroquois of New York.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cat's cradle and other string puzzles are played, including a release puzzle
    involving strings tied about the wrists of two people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hand ball and football use balls made of deer, moose, or caribou skin stuffed
    with animal hair, with different restrictions on using the hands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bull roarers are amusements and are also carried by hunters, who use them
    to bring the wind.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bull roarers are described as central wooden discs, cylinders, or animal bones
