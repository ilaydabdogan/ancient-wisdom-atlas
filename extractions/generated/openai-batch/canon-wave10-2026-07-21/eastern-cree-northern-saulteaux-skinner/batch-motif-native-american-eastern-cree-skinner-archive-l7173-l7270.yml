canonical_text:
  quote: ''
  summary: The passage describes Northern Saulteaux dances, music, smoking, and pipes.
    Older religious circular dances, including seasonal ceremonies with food, shamanic
    distribution, fire, drumming, thanksgiving, and petitions, are said to be obsolete.
    The passage also lists musical instruments and describes pipe materials, forms,
    gendered use, and former ceremonial use in war and peace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Northern Saulteaux are said to have ceased old-fashioned dances and to
    dance in European fashion with drum and fiddle, like the Eastern Cree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dances of the midewin are described as the last older dances to become
    obsolete.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old dances are described as always circular, and certain holidays with
    dances were remembered as annual seasonal observances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: One ceremony occurred early in spring when leaves began to bud and grass began
    to show.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the spring dance, people gathered choice meat and other food for the
    ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The festival was held in a large tent, food was passed out by a shaman from
    a central pile, and the event lasted three days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Dancing occurred outside the tent around a fire; drummers stood or squatted
    by the fire while others danced around them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dance stopped at intervals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Prayers of thanksgiving for the past year and petitions for the coming year
    were offered.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage states that all dances were religious in significance and were
    for thanksgiving or petitions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: Other remembered dances include a shaman's dance, a bear dance, and a war
    dance preceded by a discovery dance.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Drums varied in size; the commonest type was double-headed and painted in
    blue, green, and red with usually realistic designs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Midewin rattles were formerly made from birchbark cylinders containing pebbles
    with handles running through them; later tin cans served the same purpose.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: Children used whistles, and children’s rattles at Fort Hope were formerly
    made from sturgeon skin or another unidentified fish skin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Northern Saulteaux claim they had no tobacco, smoking, or pipes before
    European contact, but the passage notes this claim seems improbable because neighboring
    Eastern Cree and Ojibway had smoking practices.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: Northern Saulteaux stone pipe bowls are described as blackish or greenish
    steatite and generally either Micmac/Eastern Cree in type or angular Siouan/Plains
    in form.
  category: object
  evidence_refs:
  - ev:6
- id: obs:17
  text: Pipe stems were made from sections of a plant called marten wood by peeling
    the bark and removing the pithy heart.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Pipes were used for ordinary purposes and formerly had ceremonial use, especially
    in war and peace ceremonies.
  category: attribute
  evidence_refs:
  - ev:7
