canonical_text:
  quote: ''
  summary: 'The passage describes Northern Saulteaux habitation forms: round or dome-shaped
    lodges, conical lodges, rectangular two-fire houses, sweating lodges, conjuring
    houses, and a former midewin ceremony booth. It gives construction details, interior
    placement of fireplaces and smoke holes, guest places of honor, family spatial
    boundaries, door materials, and brief comparisons with Eastern Cree practices
    and eastern long houses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Three general lodge types are described as used among the Saulteaux: round
    or dome-shaped, conical, and rectangular pent-roof forms.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The round or dome-shaped lodge has arched saplings or poles, a covering of
    birchbark or brush, a central stone fireplace, and a roof opening above the fire
    for smoke.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The conical lodge foundation uses four crotched poles, or lashed poles when
    crotched sticks are unavailable, with additional poles added to complete the frame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the Saulteaux conical lodge, the number of poles is not fixed and there
    is no taboo against counting them during erection.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The conical lodge could formerly be covered with skins, but the Northern Saulteaux
    are said not to have decorated these coverings with painted designs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Birchbark rolls used for lodge roofing are made from long bark strips fastened
    with willow roots, with sticks sewn across the ends to prevent splitting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The conical lodge apex is usually left bare for smoke escape, and upper-roll
    poles called the lodge's ears can be used to close the smoke hole when rain begins.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A wooden conical wigwam observed in a deserted winter camp was smaller than
    ordinary lodges and built of split poles set on end, with moss closing the chinks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: In dome-shaped and conical lodges, the guest place of honor is at the back
    opposite the door and as far from the door as possible.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The rectangular two-fire house has a door, fireplace, and smoke hole at each
    end, and four families live in it, one in each corner.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the two-fire house, members are expected to use the door belonging to their
    own end and not to step over the imaginary line dividing family spaces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Skins are used as doors and are fastened at the upper door opening and weighted
    at the bottom; woven reed or cedar-bark mats may replace them when skins are scarce.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: A sweating lodge or sudatory is said to be built like the conjuring lodge
    and made as airtight as possible.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The conjuror's house is a dome-shaped type differing from an ordinary dwelling
    by having neither a door nor a smoke hole.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: A former midewin ceremony booth is described as oval, made of willows and
    brush, and without a roof.
  category: object
  evidence_refs:
  - ev:8
