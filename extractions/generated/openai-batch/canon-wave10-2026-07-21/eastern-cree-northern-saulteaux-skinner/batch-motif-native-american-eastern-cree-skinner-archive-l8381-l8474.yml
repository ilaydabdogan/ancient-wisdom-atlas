canonical_text:
  quote: ''
  summary: 'The passage first notes a travel and war-party custom involving canoe
    movement, evening encampment, and armed night guards. It then describes Saulteaux
    and related Ojibway mortuary customs: subterranean, tree, scaffold, and occasional
    cremation burials; washing and bark-wrapping the body; placing weapons, utensils,
    and medicines at or near the grave; maintaining a grave fire and kettle for the
    departed spirit''s journey; regional variants such as side-wall corpse removal,
    winter burial under a wigwam fireplace, scaffold and tree exposure, a coffin with
    holes over the mouth for spirit escape, mourning practices, abandonment of a lodge
    after death, redistribution or destruction of belongings, and caching a shaman''s
    medicines.'
  language: English
  quote_policy: summarized
