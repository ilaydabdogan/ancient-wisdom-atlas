canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic notes on Saulteaux food preparation and
    subsistence: regular meals, cooking by roasting, boiling, smoking, drying, storage
    in birchbark and animal containers, use of bark and roots as food, reliance on
    hunting, fishing, and wild rice, and rapid butchering of moose. It also briefly
    compares Saulteaux culinary practice with that of the Eastern Cree.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old-time Indians are described as having two regular meals each day, morning
    and evening, with some food usually available between meals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Saulteaux culinary practice was less developed than
    that of their Eastern Cree neighbors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Meat was formerly usually roasted before the fire on a spit, while boiling
    became more customary later; pottery vessels and paunch kettles were used.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A paunch kettle could be suspended over a blazing fire, and hard crust snow
    was melted in winter for drinking and cooking water.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Meat was smoked or dried on scaffolds or grills over fire, with thin strips
    used to speed curing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Meat could also be smoked on a scaffold or grill over the fireplace beneath
    the smoke hole, especially in two-fire lodges.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Smoked meat was usually boiled before use and sometimes fried after parboiling;
    fish were boiled, roasted on a spit, smoked, dried, or otherwise prepared, and
    pickerel roe was baked under ground or in ashes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Meat was often stored in birchbark baskets or rogans, covered with bark tied
    with spruce-root string, and placed on scaffolds or cross poles out of reach of
    dogs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Grease was stored as cakes from birchbark molds or as liquid in black-bear
    bladder or pike-skin bags.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wooden bowls were formerly made from birch knots, and wooden spoons from roots
    of the same tree; the crooked knife was used rather than fire in making these
    utensils.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Inner bark of birch, poplar, and other non-sticky trees was scraped, boiled,
    and eaten; birch syrup was made, and some roots were eaten during starvation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Because agriculture was not known to the Northern Saulteaux, the passage says
    they depended largely on hunting, fishing, and wild rice for food.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The animals eaten included moose, caribou, deer, black bear, lynx, beaver,
    smaller mammals, snakes, turtles, game birds, raptors, owls, and fish.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Moose are described as the most important game animal, and the passage gives
    an example of one hunter killing many moose and caribou in a winter.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: A moose was butchered on the spot by drawing, skinning, quartering, severing
    the neck, cutting off the head, and separating the ribs from the spine in about
    fifteen minutes.
  category: sequence
  evidence_refs:
  - ev:11
