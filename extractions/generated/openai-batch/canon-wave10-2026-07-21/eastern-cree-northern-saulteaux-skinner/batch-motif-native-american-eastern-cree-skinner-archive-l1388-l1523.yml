literal_observations:
- id: obs:1
  text: Caribou meat is eaten fresh or smoked; blood is mixed with stomach moss and
    sometimes lichen, then boiled and eaten with a wooden ladle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Caribou legs are singed, cooked, and eaten; leg bones are pounded into powder
    for journey food and may be boiled as a tea substitute.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A bag-like part of the caribou stomach called the owao is used as a portable
    kettle while journeying in the forest.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Moose in the southern range of the Eastern Cree are said to be pursued, taken,
    and used in the same manner as caribou.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Bear is described as an important food; older hunters clubbed bears in hand-to-hand
    conflict, including in winter dens, while later methods include traps, axes, guns,
    and dogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage notes that elaborate ceremonies concerning bear hunting are described
    elsewhere, but does not describe those ceremonies here.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: Lynx are eaten and trapped; in winter they may be run down with snowshoes
    and killed with an ax, or noosed from a tree and choked.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Seals are eaten by the Winnip^go-wug and are shot, harpooned, or clubbed when
    ashore; Coast Cree also take whales with harpoons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage reports a claim that taking seals and whales with harpoons is
    of Eskimo origin and was introduced comparatively recently through European influence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ducks and geese were formerly taken with bows, arrows, and snares, and are
    now killed with guns; the Hudson's Bay Company buys large quantities of geese
    that are salted in barrels.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Loons are eaten seasonally on the coast and year-round in the interior; roasted
    duck and goose entrails are considered a delicacy, especially in fall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Partridges and ptarmigan are caught with snares, nooses in stick hedges, and
    nets baited with gravel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Pike and sturgeon are usually speared with a barbed two-bladed implement;
    gill nets use stone sinkers and wooden floats, with special apple-seed-shaped
    winter floats.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ice fishing uses a hook, bait, line, sinker, and a running-stick signal system
    that warns the fisherman when a fish takes the bait.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Meat and fish are roasted on spits or green-pole grills over fire, dried and
    pounded into pemmican with grease, or cooked in a heated sand pit covered with
    hot sand and another fire.
  category: action
  evidence_refs:
  - ev:9
