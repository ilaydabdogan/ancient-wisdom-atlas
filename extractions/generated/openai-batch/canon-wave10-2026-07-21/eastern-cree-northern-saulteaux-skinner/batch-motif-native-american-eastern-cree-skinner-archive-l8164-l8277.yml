  text: The black bear is described as the animal to whom the Saulteaux show the most
    consideration, if not veneration.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a bear is caught in a trap, words of apology and explanation are addressed
    to it before it is killed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: After being killed, the bear is dressed in obtainable finery and laid out
