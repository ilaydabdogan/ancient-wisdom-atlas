canonical_text:
  quote: ''
  summary: 'The passage describes a hot-stone sweating procedure and a series of Saulteaux
    bear-hunting customs: apologizing to and dressing a killed bear, explaining the
    custom through a bear chief, erecting bear poles with animal parts and offerings,
    marking a shoulder blade with charcoal prayers, observing regional variations
    and possible Eastern Cree influence, keeping bear bones from dogs, restricting
    bear organs, honoring a first big-game kill, leaving a bullet to guard a bear
    den, and reading hunting signs from game animals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Granite pebbles are heated, carried into a lodge with green sticks or withes,
    and placed in a circle at the center on small cold stones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The patient kneels near the hot stones, drops water on them one at a time
    until cold, and exits sweating heavily.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the sweating procedure, the patient cools by cold plunge in summer or
