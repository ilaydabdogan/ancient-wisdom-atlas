comparison_claims:
- id: claim:1
  claim: The passage explicitly states that Saulteaux bear-name multiplicity is like
    that of the Eastern Cree.
  claim_level: same_function
  target: Eastern Cree bear-name practice
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage only specifies the Saulteaux terms mukwuh and oputowan;
    it does not list Eastern Cree names or show whether the same secrecy rules apply
    in detail.
- id: claim:2
  claim: The passage states that animal-remain customs are less strongly observed
    in the northern part of the Saulteaux range than in the south.
  claim_level: same_function
  target: southern versus northern Saulteaux animal-remain observance
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives a regional contrast in strength of observance but
    does not provide separate southern examples.
