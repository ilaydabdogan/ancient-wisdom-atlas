literal_observations:
- id: obs:1
  text: The Saulteaux are said to have various names for the bear, like the Eastern
    Cree, and to refuse to tell them to white people because of feared ill success.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives mukwuh as the proper name of the bear and oputowan as another
    name whose meaning was not found.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moose beards and portions of moose skin are hung on poles or trees to mark
    where a moose has been killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At deserted camp sites, the writer saw moose skulls, bears' ears, bird wings
    and skulls, and moose bones hung on trees.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bones of beaver, mink, otter, muskrat, loon, and duck should be thrown back
    into the water or hung on poles so animals, especially dogs, cannot get them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If dogs or other animals get the bones of certain animals and birds, the Indians
    are said to become unable to catch those animals any more.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A raccoon killed at Fort Hope was regarded as an evil spirit because it was
    the only one the natives had seen, and its flesh was burned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The clan or totem animal should be tabooed by members of that clan, and guardian
    animals are protected by individuals to whom they are sacred.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Northern Saulteaux are described as having had skirmishes with the Little
    Crane, and pictographs near Sioux Lookout are said to represent battles between
    the Sioux and Saulteaux.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Northern Saulteaux war equipment is described as lacking armor and shields
    and using special war clothes, bone-headed spears, clubs, bows, and arrows.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A war dance preceded going to war and was accompanied by shamanic conjuring.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Before going to war, warriors invariably changed their names.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At a secret forest place, the head man called warriors together and the chief
    determined whom he could rely upon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The shaman filled his pipe and sent it through the air toward the enemy, while
    the enemy did the same with their war pipe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the enemy's war pipe arrived and was smoked, the shaman made it walk.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The war party heard a noise first in the east, then north, then south, and
