  summary: The passage describes Saulteaux and Eastern Cree bear-name secrecy, rules
    for handling animal remains, taboo and guardian animals, war history and equipment,
    and shamanic war practices including pipe conjuring, a bat apparition revealing
    enemy location, and smoked-glass divination.
  language: English
