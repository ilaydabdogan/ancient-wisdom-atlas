candidate_motifs:
- id: motif:1
  label: secret or withheld animal names
  taxonomy_refs:
  - forbidden_knowledge
  basis: Bear names are acknowledged but withheld from white people because disclosure
    is feared to bring ill success.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage concerns ethnographic name secrecy around an animal, not a
    narrative episode of acquiring forbidden knowledge.
- id: motif:2
  label: ritual care of game remains to preserve hunting success
  taxonomy_refs:
  - sacred_exchange
  basis: Certain animal and bird bones must be returned to water or kept from dogs
    and other animals, or future capture of those species will fail.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly frame this as exchange with animal spirits;
    the taxonomy link is based only on reciprocal handling and continued hunting success.
- id: motif:3
  label: totem or guardian animal taboo
  taxonomy_refs: []
  basis: Clan or totem animals are tabooed by clan members, and guardian animals are
    protected by the individuals to whom they are sacred.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage states this as a custom and notes that it had long fallen
    into disuse.
- id: motif:4
