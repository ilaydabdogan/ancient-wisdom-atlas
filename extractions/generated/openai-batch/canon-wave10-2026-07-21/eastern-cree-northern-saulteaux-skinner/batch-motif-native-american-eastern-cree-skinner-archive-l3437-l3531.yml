canonical_text:
  quote: ''
  summary: The passage describes an initiate’s account of entering the Great Spirit’s
    tent, being ordered back to earth, and fleeing from the Great Manitou’s dogs.
    It then describes post-initiation white dog sacrifice, blood applied to lodge
    posts, feasting, chants, dances, and repetition at the vernal and autumnal equinoxes.
    The passage also notes Cree-Ojibway relations in the mid^win, exchange of medicine
    and secrets, dream-revealed shapeshifting powers, and a shamanic divination performance
    in which a priest is wrapped in elk skin, tied, placed in a staked enclosure,
    and speaks in an agitated state.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An initiate says he saw the Great Spirit and entered his tent, described as
    a magnificent mansion with servants and excellent things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Great Spirit tells the initiate to go away and return to the earth, saying
    he left before his time and without command.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Great Manitou releases terrible dogs; the initiate flees and says this
    is how he came back to earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the initiate speaks, he returns to the old men, who congratulate him;
    after the judgment of the roots and initiation, sacrifice takes place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: White dogs are bled, skinned, cut up, roasted, quartered without breaking
    bones, and their blood is applied to the four posts and ground around the lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The assembled people eat in honor of the Great Spirit, followed by chants,
    dances, and orgies until morning; the ceremony is said to be repeated at the vernal
    and autumnal equinoxes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Cree of Fort Albany say their mid^win was closely related to the Ojibway
