    and dreaming to join the other branch.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some people are said to receive malevolent powers in dreams and to be able
    to change themselves into any animals at will.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A shamanic spiritual conference is arranged to look into the future and foretell
    the arrival of awaited traders.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Inside the tent is an oblong staked enclosure shaped like a chest or coffin,
    and the space is illuminated by many torches made from pine or birch splinters.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The priest strips down, lies on an elk skin, is folded into it with only his
    head uncovered, bound tightly with elk-hide cord, and lifted into the staked enclosure.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The priest mutters, grows louder, speaks in a mixed jargon of Chippewaw, Ottawaw,
