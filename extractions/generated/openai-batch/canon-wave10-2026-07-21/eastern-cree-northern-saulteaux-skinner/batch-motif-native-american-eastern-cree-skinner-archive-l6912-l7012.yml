  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gill nets are used for fishing, with mesh size varying according to the fish;
    some old Saulteaux say nets are a European rather than aboriginal invention.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nets are set in shallow water at stream mouths and along shores; they vary
    in length, are made from trade twine or formerly probably spruce root bark, and
    use pebble weights, bark cord, wooden floats, and sometimes a star-shaped buoy
    made from old canoe ribs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Former fish hooks are described as wood-and-bone implements with a bone barb
    set at an angle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Night fishing by jacklight uses a birchbark flame in a split stick to attract
    and illuminate fish from a canoe; one man holds the light and another spears,
    formerly with a barbed bone harpoon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fish traps are placed in slack water at the foot of rapids to catch fish coming
    downstream; the passage states that weirs were not used.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Southern Saulteaux, sturgeon are clubbed with a wooden sturgeon
    mallet resembling a ball-headed war club.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wild rice is uncommon in much of the Northern Saulteaux country because many
    lakes have stony bottoms; the rice that occurs is said to have been brought from
    elsewhere and grows after sowing without further cultivation.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: When wild rice ripens in August, canoes move through the beds while stalks
    are pulled over the canoe and beaten with a stick or paddle so the grain falls
    onto cloth or birchbark.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Harvested wild rice is dried in a frying pan held over fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rice is threshed in a round lined hole by people wearing clean moccasins and
    tramping on it, then winnowed in a birchbark dish and stored in a birchbark box.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Wild rice is boiled whole for food, and flour obtained from the Hudson's Bay
    Company has led to a decline in wild-rice harvesting.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Blueberries are dried on a reed-covered pole scaffold over fire and eaten
    dry or mixed with fat or grease and pounded caribou meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Pemmican is made by drying and pounding meat, mixing it with bear fat or other
    grease and sometimes dried blueberries, and storing it in birchbark boxes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Fire-making by striking flint and pyrites was known, but the bow drill is
    described as the favored method and still used by some older men when short of
    matches in the woods.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The bow drill consists of a cedar bow with thong or babiche string, a cedar
    base board or hearth, and a cedar shaft or twirling stick fitted into a hole in
    the hearth.
  category: object
  evidence_refs:
  - ev:8
