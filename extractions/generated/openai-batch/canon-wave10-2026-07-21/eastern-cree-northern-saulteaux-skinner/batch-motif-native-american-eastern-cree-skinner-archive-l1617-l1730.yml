canonical_text:
  quote: ''
  summary: The passage describes Eastern Cree and related field observations on wooden
    spoons, ladles, cups, trays, caching food and utensils at camps, meal timing,
    winter water preparation, and older fire-making and fire-carrying practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Three spoon types are described: a shallow rounded spoon for caribou blood
    mixed with moss, a long oval pointed spoon for ladling boiled fish, and a spoon
    called the "bear''s foot" from its shape.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some large spoons or ladles from Fort Albany have handles ornamented with
    deep scallops at the base of the bowl.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several crude spoons made at Moose Factory at the writer's request are described
    as possibly reconstructed from memory, crudely made, differently shaped from examples
    at other posts, dyed yellow with willow root dye, and accompanied by children's
    toy spoons imitating larger types.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A flat, square-bladed bread turner and stirrer with a handle over a foot long
    was observed in use among women with the Mistassini voyageurs at Rupert's House.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A child's small wooden cup with a perforated handle was collected; similar
    cups are reported among the Montagnais, Abnaki, and Passamaquoddy, worn suspended
    from the belt by thong and wooden button.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A model wooden tray was obtained at Rupert's House, and wooden bowls and trays
    are said to be common in the forests but hard to obtain because they are cached
    at camping grounds and rarely brought to posts.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a party expects to return to a camping place, food and utensils may be
    cached there, usually on high scaffolds to keep them away from lost dogs, wolves,
    and wolverenes; people do not destroy or steal caches except under starvation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that in former times there were two meals, morning and
    night, though food was probably eaten between those times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In winter, drinking water is sometimes obtained by melting a snowball over
    the fire in a stone with a panlike hollow fastened to a split stick.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A four-piece bow firedrill was used in earlier times, and a caribou leg-skin
    bag was used to carry the firedrill.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Before the bow firedrill, the Eastern Cree are reported to have struck two
    pieces of white flint or quartz over touchwood; touchwood is identified as punk
    or dry under-bark of a dead tree and was kept dry for tinder, sometimes in a birchbark
    box.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A spark was placed in touchwood between two pieces of charcoal and blown on
    until the charcoal ignited, after which shredded birchbark was added.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Fire was carried for days smouldering in birch punk, and firewood was broken
    or dragged to the wigwam, set in the hearth radiating like wheel spokes, and shoved
    inward as it burned.
  category: sequence
  evidence_refs:
  - ev:9
