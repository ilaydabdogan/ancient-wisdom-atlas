canonical_text:
  quote: Death is on you, but you will be alive again.
  summary: 'The passage describes Eastern Cree and related Cree midewin vision-seeking
    and initiation practices: a youth sleeps on a scaffold by a river after a dream,
    fasts and avoids speech to preserve spirit aid, may be transformed or die if the
    ordeal is mishandled, receives instruction from a shaman, undergoes an otterskin
    medicine-bag rite in which he falls unconscious and receives otter power, advances
    by further visions, keeps animal-skin guardians, and learns songs recorded on
    birchbark rolls.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: After an unexpected dream, a man went to a tree leaning over a river and built
    a stage over the water where he slept for seven days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man could ask his father to bring food at the end of the seven-day
    period.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the father forgot to bring food at the proper time, the young man was said
    to be turned into a sturgeon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Youths who fasted too long on the scaffold were said to die or be turned into
    various animals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Moose Cree, a youth on the scaffold could come down daily and go
    home, but fasted and did not speak so that spirits would not be driven away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fall initiation to the lowest midewin degree was private and involved
    an old shaman and possibly a few other members of the society.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The shaman used an otterskin medicine bag, with the otter described as the
    most powerful of the medicine animals.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The shaman thrust the otterskin toward the novice until its nose touched him
    and made a noise.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The novice fell unconscious, and the passage states that the medicine power
    of the otter passed into his body during this time.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the novice revived, the shaman interpreted the otter's speech as saying
    that death was on the novice but he would be alive again.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: After full recovery, the young man was said to know as much as any human being
    could teach him because of the otter power received while unconscious.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: The youth's abilities were restricted by what had been revealed in dreams
    or by midewin instructors.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Dream revelations were not told, because disclosure was believed to cause
    spirits to revoke power.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: A first-degree member called Kwosapatcikewin could procure interviews with
    spirits for himself and others.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: A person seeking the second degree lived and fasted alone, heard voices, saw
    visions, and did not tell them at home for fear of losing spirit aid.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: In asking for power, a conjuror knelt with his head bent to the ground.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: A second-degree miteo had powers of the lower degree, plus prophecy, magical
    killing of enemies, and bodily transport across rivers or streams by spirits.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:18
  text: A man kept the skins of animals that had appeared in dreams and promised to
    act as protectors.
  category: object
  evidence_refs:
  - ev:15
- id: obs:19
  text: Animal guardians named in the passage include snakes, salamanders, mink, and
    otter.
  category: object
  evidence_refs:
  - ev:15
- id: obs:20
  text: Songs used in midewin ceremonies were kept on birchbark rolls with geometric
    signs, and the novice memorized their contents.
  category: object
  evidence_refs:
  - ev:16
