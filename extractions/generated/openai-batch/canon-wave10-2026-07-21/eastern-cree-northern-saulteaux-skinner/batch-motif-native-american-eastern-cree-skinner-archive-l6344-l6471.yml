canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Northern Saulteaux manufacture practices:
    hide tanning with bone tools, brain-grease treatment, drying, soaking, stretching,
    smoke curing, preparation of sturgeon skin and furs, use of animal and plant materials
    for needles, thread, birchbark sewing, and floor mats. An editorial note links
    one flesher form to a Plains type and suggests possible cultural contact.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Saulteaux tanning with and without hair is practically
    the same at the beginning of the process.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After an animal is killed, its skin is fleshed with a bone flesher, usually
    made from caribou or moose leg bone; smooth fleshers are favored although serrated
    fleshers are said to work better.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: For leather, the skin is drawn over a smoothed oblique stick and worked with
    a leg-bone beaming tool pushed away from the body; this hair-removal work is done
    away from the wigwam because it creates litter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says both men and women participate in the hair-removal work and
    notes little or no division of work by sex among these people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The skin is rubbed with cooked animal brains mixed with grease, dried before
    fire, soaked in water, dried again while pulled by two people, sewn into a bag,
    and smoked over ignited rotten wood or punk with no flame allowed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: For tanning with the hair, the process is the same except that the beaming
    tool is not used; bear skins are stretched but not tanned, and trade furs are
    cured only by scraping and drying.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sturgeon skin is removed, dried for indefinite keeping, and later soaked in
    water to make it pliable for moccasins and other uses.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Southern Saulteaux are described as using thorns for needles with eyes pierced
    by burning, while the northern branch uses a sharpened marten penis bone with
    a natural perforation.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Thread and twine are made preferably from sinew taken from birds, beaver,
    fox, muskrat, fisher, caribou, moose, and deer; willow bark or roots are substituted
    when sinew is unavailable.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Spruce root is used for sewing birchbark vessels or canoes after being split
    and boiled until flexible.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Mats are made from cedar inner bark, bullrushes, or bundles of straw; they
    were used on lodge floors, but their manufacture had declined because trade matting
    was available at posts.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: An editor’s note says a flesher joint feature resembles a widely distributed
    Plains type and suggests cultural contact with Plains tribes.
  category: other
  evidence_refs:
  - ev:10
