  summary: The passage describes Eastern Cree medical knowledge, regular physicians
    with magic power, plant and animal remedies, Mackenzie's remarks on conjurors
    and medical secrecy, a shamanic method for obtaining medicines through overnight
    drumming and prayer, and the killing by burning of persons classified as insane
    or possessed by an evil spirit.
