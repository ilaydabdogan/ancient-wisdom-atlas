  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The magic medicines are said to be able to cure even amputations and injuries.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: The passage states that no attempt is made to cure or attend the insane; a
    person classified as an idiot is said to be popularly supposed possessed by an
    evil spirit and is usually killed, often by burning at the stake.
  category: sequence
  evidence_refs:
  - ev:5
