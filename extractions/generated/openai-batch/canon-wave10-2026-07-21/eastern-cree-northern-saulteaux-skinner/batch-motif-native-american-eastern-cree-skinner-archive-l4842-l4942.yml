canonical_text:
  quote: ''
  summary: 'The passage concludes an Aioswe''s son narrative: the son uses decoys
    to escape hostile old women and a bone-alarm guarded by people and dogs, returns
    to his parents, overpowers his father through song and fire-water magic, protects
    his mother in a drawn circle, and then he and his mother become birds. The passage
    then begins the tale of Tcigibis, in which Otter feigns death to lure crawfish,
    eats nearly all of them, and one injured crawfish survives as ancestor of present
    crawfish.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aioswe's son fixes a large parchment to the end of a pole and pokes it between
    two old women, who think it is the boy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two old women attack the skin, move close together, strike one another,
    and stab each other to death while Aioswe's son escapes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dried human bones are hung across the path so that they rattle when disturbed;
    nearby people and big dogs kill anyone who sets them off.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Following earlier advice, Aioswe's son digs under the bones, but he accidentally
    rattles them; the people search and initially cannot see him because he is underground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When dogs find the tunnel mouth, Aioswe's son raises a stuffed ermine skin;
    the people think it is Ermine and kill the dogs for lying.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aioswe's son returns to his father's wigwam; his mother recognizes him, his
    father doubts and fears him, and the son rejects caribou skins spread for him
    to walk on.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At night Aioswe's son sings about burning the world, the old man sings against
    him, and the son shoots arrows that set the woods on fire and make water boil.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Aioswe's son tells the old man to enter a basket of bear grease for safety
    and places his mother inside a drawn circle; the circle is not scorched, while
    the old man burns to death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Aioswe's son and his mother choose bird forms, robin and whisky jack, and
    fly away together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Otter lies on the bank and feigns death by putting punk or rotted wood in
    his nostrils and rectum; Tcigibis sees him and tells Crawfish that Otter is dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Otter and Crawfish are enemies; Otter had previously tried to kill and eat
    Crawfish and had pulled off the legs and claw on one side.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Crawfish and other crawfish inspect the supposed dead Otter and pull at the
    punk; Otter laughs, jumps up, and catches all the crawfish except the injured
    one.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The injured crawfish who stays back is said to be the ancestor of all crawfish
    living today.
  category: relationship
  evidence_refs:
  - ev:9
