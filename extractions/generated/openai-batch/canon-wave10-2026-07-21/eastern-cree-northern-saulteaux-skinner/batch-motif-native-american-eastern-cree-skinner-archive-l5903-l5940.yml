canonical_text:
  quote: ''
  summary: The passage first recounts two brothers cutting a man-sized hole in lake
    ice for a wrestling match, throwing a cannibal into it, killing him with an ice
    chisel, and then killing an old man addressed as the cannibal's father. It then
    recounts the Legend of Iroquois Falls, in which an Iroquois war party attacks
    Cree people, takes a woman prisoner as guide, and is led into dangerous falls
    where the party drowns.
  language: English
