canonical_text:
  quote: ''
  summary: The passage contains the conclusion of a Kanweo revenge story involving
    a planned beaver-ice ambush, the killing of an old enemy, his sons, and his wife,
    and the rejection of Kanweo's sister-in-law. It then gives an origin tale in which
    the Great Spirit makes people of different colors by baking clay figures for different
    lengths of time. It also gives an Albany Cree animal tale in which Otter taunts
    Wolf, Wolf destroys Otter's holes as the water freezes, and Wolf kills Otter after
    she asks mercy and offers marriage.
  language: English
  quote_policy: summarized
