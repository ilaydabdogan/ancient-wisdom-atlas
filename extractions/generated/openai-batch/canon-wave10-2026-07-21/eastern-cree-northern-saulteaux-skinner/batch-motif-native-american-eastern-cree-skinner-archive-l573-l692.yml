literal_observations:
- id: obs:1
  text: The Cree or Ejiiste-naux habitat is described as extending from Lake Nitchequon
    to Lake Athabaska, with additional western and southern limits marked by the Canadian
    Rockies foothills, Lake Winnipeg, and Lake Mistassini.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage divides the Cree body politic into Plains Cree and Wood, Swamp
    Cree, or Maskegon, noting differences in life and material culture while describing
    the groups as linguistically related.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the paper, “Eastern Cree” designates the part of the Wood, Swamp, or Maskegon
    division east of York Factory and Norway House.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage lists neighboring peoples of the Eastern Cree: Naskapi, Eskimo,
    Chipewyan, Plains Cree, Assiniboine, Blackfoot, Saulteaux Ojibway, and Montagnais.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Eastern Cree are described as generally not warlike and mostly at peace
    with neighbors, with former enmity toward the Eskimo and remembered Iroquois forays.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Eastern Cree are said to know themselves as Ililu, rendered “men among
    men,” and collectively as Muskeko-wug, rendered “Swamp people.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Five Eastern Cree divisions are named: Winnipego-wug, Nutcimiu-iiu, Kiwetin-iiuwug,
    Oscheiskakamikau-iiu, and Nekapi-ininuwug.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Names tied to trading rendezvous, such as Rupert’s House Indians, Albany Indians,
    and Moosonee, are said to have caused confusion about tribal distinctness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ojibway are said to call the Eastern Cree Muskeko or Muskeko-ninni, and
    the Eskimo are said to call them Allat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Eastern Cree traditions hold they have always occupied
    the current region, while also reporting Northern Saulteaux encroachment and possible
    northeastward displacement from Iroquois raids.
  category: sequence
  evidence_refs:
  - ev:6
