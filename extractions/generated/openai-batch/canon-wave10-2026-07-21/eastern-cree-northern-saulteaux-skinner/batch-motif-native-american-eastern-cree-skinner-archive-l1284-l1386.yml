canonical_text:
  quote: ''
  summary: The passage describes Eastern Cree foodways and hunting technologies for
    rabbits, beaver, and caribou. It notes scarcity of vegetable foods, reliance on
    hunting and fishing, periodic rabbit scarcity and famine, methods for snaring
    or trapping animals, a belief-related practice of returning beaver bones to water,
    and caribou driving and kill-announcement practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that agriculture is practically impossible for the Eastern
    Cree because of climate, that berries and fruits are scarce, and that subsistence
    relies primarily on hunting and secondarily on fishing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes short sinew-backed bows, twisted-bark bowstrings, special
    war bows, flint or slate arrow points, antler or bone points, and blunt arrows
    used by boys for small game.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rabbit or hare is described as the winter staff of life, supplying food and
    clothing; a reported disease every seventh year greatly reduces rabbits and can
    lead to suffering, starvation, depletion of fur-bearing carnivores, and cannibalism.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rabbits are snared with a willow-bark noose fastened to a tossing pole; their
    flesh is boiled, and their paws are dried, pounded into powder, and carried as
    winter food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Beaver are eaten and caught by blocking creeks with stakes through the ice,
    breaking into houses, catching escaping beaver in a bark bag, or blocking bank
    holes and digging them out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Beaver bones are returned to the water so that dogs do not get them; the passage
    explains that dog contact would offend the beaver spirit, which would warn living
    beavers not to be caught.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Caribou are taken in winter with bow and arrow or spear; on ice, hunters use
    rows of ragged poles arranged as a triangle or hourglass to drive caribou toward
    a concealed hunter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In forest valleys, one person may lie in wait while another person, even an
    unarmed boy or girl, imitates a wolf howl to alarm caribou and drive them toward
    the hunter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A hunter may announce a caribou kill by bringing home a tuft of hair or the
    right foreleg and giving it to the person desired to butcher the carcass; the
    passage states that no further ceremony accompanies this act.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Slip-noose snares, sometimes with heavy tossing poles, are set along snow
    trails, and driven animals are caught and choked in the snares.
  category: action
  evidence_refs:
  - ev:9
