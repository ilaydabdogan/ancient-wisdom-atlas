canonical_text:
  quote: ''
  summary: The passage describes Northern Saulteaux basketry, bark work, nets, quillwork,
    dyes, paints, and painting practices. It notes birchbark use, a rare willow-ring
    basket technique, quill and dye preparation, paintings on trees, birchbark, canvas,
    and rocks, and an interpretation that some rock paintings may depict animals seen
    in dreams during fasting for a spirit guardian.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fabrics and woven bags are described as unknown, while splint baskets were
    still occasionally made at Lac Seul by some older women, though the process was
    not recorded.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Birchbark baskets are described as more common because birchbark was abundant
    and easier to work.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Birchbark was removed from trees around the first of July when it began to
    peel properly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Decorations were scratched on utensils, and the unscratched background could
    be rubbed with boiled black willow bark to dye it dark orange.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bark bags could be woven with the fingers from strips of bark, and netted
    carrying bags were usually made from moose-hide thongs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The manufacture of rabbitskin blankets is described as identical among the
    Northern Saulteaux and Eastern Cree except for minor details.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some Saulteaux informants said nets were not aboriginal but European in origin;
    nets were woven with wooden netting needles, and snowshoe nets with bone or wooden
    needles.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Babiche was used for snowshoe webbing, with strips of sturgeon skin or bark
    used when babiche was scarce.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Woven pack straps are described as unused among these people, who preferred
    leather straps.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: A rare basket specimen is described as bushel-measure shaped, made with one-rod
    coil open texture, brown spruce-root binding, peeled willow-twig foundation, and
    circular willow bands rather than a usual spiral foundation.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The rare basket was obtained at Fort Osnaburgh on Lake St. Joseph, and its
    technique was described as practically lost locally, remembered by only one old
    Saulteaux woman.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Porcupine quills were soaked, flattened, sewn with a needle made from a marten
    penis bone, and dyed with plant and wood materials; white and black were natural
    quill colors.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Several dyes and paints are listed, including willow-root yellow or orange,
    spruce-cone dark red, tamarack-bark red, rotten-wood brown, hematite or ocher
    red, and charcoal mixed with grease black.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: Paintings were made on blazed trees, birchbark, and canvas; animal heads,
    clan animals, and personal totems were favored subjects.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Former rock paintings are reported in the Northern Saulteaux region, including
    one at Fairy Point on Missanabie Lake, and the drawings are claimed to have been
    made by ancestors of nearby Saulteaux.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:16
  text: The Fairy Point painting is said by the writer to be more likely a depiction
    of animals appearing to the painter in dreams, probably during fasting and dreaming
    for a spirit guardian, rather than a man's winter hunt.
  category: other
  evidence_refs:
  - ev:12
