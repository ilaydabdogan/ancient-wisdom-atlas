canonical_text:
  quote: ''
  summary: 'Ethnographic notes describe Eastern Cree travel and transportation: canoe
    travel on rivers in summer, canoe construction materials and regional canoe forms,
    rapid-shooting procedures, winter dog-sled and toboggan travel, snowshoe types
    and snowshoe-making tools, and child-carrying devices padded with moss.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dense northern forests make overland trails practically unknown, and most
    summer travel to and from Hudson's Bay is by canoe along rivers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Birchbark canoes are becoming rarer in some Eastern Cree areas; bark has been
    imported, and many canoes and wigwams are now covered with Hudson's Bay Company
    canvas.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eastern Cree canoes are described as having lower and less rounded bows than
    Ojibway canoes, while farther north some canoes have very high bows for use against
    open-sea waves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage describes canoe size, large Labrador voyageurs' canoes, short
    clumsy paddles, and a shorter, jerkier Eastern Cree paddling stroke compared with
    Ojibway neighbors.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the wind is favorable, a blanket or even a bush may be set up in the
    canoe bow as a sail.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In shooting rapids, the bow and stern men stand upright to inspect the stream;
    the bowsman is considered the leader and directs steering from the bow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Winter travel uses dog sleds, toboggans, and canoe sleds; the dog-sled custom
    is reported as derived from the Eskimo, from whom Eastern Cree still purchase
    dogs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coastal snowshoes are short, light, and flat-ended for running, jumping, or
    following dog sleds, while forest snowshoes are long, large, heavy, and turned
    up in front for deep snow.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Small round bear's-foot snowshoes are used to teach children to use snowshoes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Snowshoe work uses or formerly used beaver-tooth chisels, bone netting needles,
    and an unworked lynx maxilla for loosening frozen laces.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Children are carried in a laced bag or baby board stuffed with moss for comfort
    and absorption; small boys' and girls' drawers and trousers may also be stuffed
    with dry moss.
  category: object
  evidence_refs:
  - ev:11
