  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: WisEkejack goes to the water's edge and stands near a large hollow spruce;
    he climbs into the hollow before a white panther comes out of the water.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The panthers try one after another to pull WisEkejack into the water with
