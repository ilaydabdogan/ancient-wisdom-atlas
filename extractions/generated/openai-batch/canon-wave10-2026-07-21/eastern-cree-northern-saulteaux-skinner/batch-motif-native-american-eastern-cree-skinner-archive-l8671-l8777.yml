canonical_text:
  quote: ''
  summary: The supplied range contains the end of one tale in which a young man repeatedly
    survives his father-in-law's dangerous plots involving eaglets, burned moccasins,
    and a canoe. It then begins a WisEkejack tale in which Wolf drowns after ignoring
    dream-based advice about a creek crossing; WisEkejack mourns, marks Kingfisher,
    learns that water panthers took Wolf, and confronts the panthers near a hollow
    spruce and the water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man asks his father-in-law where they can get an eagle, and the old
    man leads him to a large nest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man leaves the young man at the nest, calls to the eaglets that he
    is feeding them his son-in-law, and goes away; the young man speaks with the two
    eaglets and kills them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the old man's last dream fails and later identifies
    the eaglets as the embodiment of one of his dreams.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The young man has the eaglets cooked, gives them to his children, and instructs
    the children to eat them before their grandfather when he arrives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a winter camp in a swamp named scorched-up-swamp, the old man burns what
    he thinks are the young man's moccasins and leggings, but the young man has exchanged
    them for the old man's while he slept.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young man leaves with the old man's canoe; one of his wives can make the
    canoe go as her father can, and later she releases it when the old man calls it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man tries to use a heated stone and charcoal on his legs, says his
    old caribou dream should let him walk on snow like caribou, reaches the sea, calls
    his canoe, and is not seen again after it returns to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: WisEkejack tells Wolf that he dreamed Wolf should throw a little twig ahead
    of himself rather than jump if he comes to a creek while chasing caribou.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wolf reaches a small creek while close to caribou, decides not to throw the
    stick, attempts to jump, falls into the middle of the creek, and drowns.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: WisEkejack tracks Wolf to the creek, finds tracks only on the near side, infers
    what happened, sits down, and cries.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: WisEkejack catches Kingfisher, rubs the top of his head, gives him a handkerchief
    for information, and the narration says this accounts for the belted Kingfisher's
    white band and crest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kingfisher tells WisEkejack that panther took Wolf; the passage says there
