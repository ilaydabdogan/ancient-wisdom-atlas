  summary: The passage describes Eastern Cree and regional Cree musical instruments,
    especially drums and rattles. It records uses for soothing children, dances, feasts,
    singing, and conjuring; describes the construction and vermilion decoration of
    conjuror's and social-dance drums; notes a drumstick that also functions as a
    rattle; and describes Albany Cree drum and rattle forms.
