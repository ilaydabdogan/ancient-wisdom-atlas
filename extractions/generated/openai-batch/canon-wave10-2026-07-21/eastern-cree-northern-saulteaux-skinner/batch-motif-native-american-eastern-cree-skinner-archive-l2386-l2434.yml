canonical_text:
  quote: ''
  summary: 'The passage describes Eastern Cree and Northern Saulteaux signs and signals
    used in northern forest travel: snow-and-stick time markers, twig and stick distance
    markers, trail blazes, tree-based messages for starvation, safety, welcome, and
    death, and smoke signals for gathering people or saying “come here.”'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the trackless northern forests, fellow travelers are rarely met, making
    communication among nomadic households necessary.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes earlier realistic birchbark writing, missionary-introduced
    syllabic writing, and a surviving system of physical signs along trails and camping
    grounds, especially in winter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A departing party can draw a circle in the snow, set a stick in the middle,
    and mark the stick’s sun-cast shadow to indicate the time of departure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A later person can judge elapsed time from the distance between the current
    shadow and the marked shadow, and can estimate the age of a circle or track from
    its appearance and snowfall on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The distance to a preceding party’s camp is represented by the height at which
    a perpendicular twig intersects an oblique stick.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A trail is marked by an oblique stick with its raised end pointing in the
    direction taken, together with blazed trees; path deviations are shown by sticks
    inclined in the new direction.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A signal meaning “we are starving” is made by girdling and shaving a standing
    tree, so that a passer-by might bring aid.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A signal meaning “plenty, nothing wrong” is made by blazing a tree on opposite
    sides, and visitor welcome is shown by a stick inclined toward the camp.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Death in camp is signified by a girdled and shaved tree trunk painted black
    and felled or tied down; the tree’s size represents the dead person’s age, and
    the number of marked trees represents the number of deaths.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A convocation of neighboring Indians is signaled by burning timber on a small
    island, producing smoke visible from far away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A signal meaning “come here” is made by burning birchbark on a rock, producing
    dense black smoke and, in calm weather, a high steady smoke column.
  category: speech
  evidence_refs:
  - ev:8
