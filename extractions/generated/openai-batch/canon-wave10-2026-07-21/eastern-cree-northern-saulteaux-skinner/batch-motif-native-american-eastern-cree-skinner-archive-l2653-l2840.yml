canonical_text:
  quote: ''
  summary: The passage describes Eastern Cree bags, tools, baskets, snow equipment,
    and art. It notes several objects made from animal parts, compares some artifacts
    with objects from other traditions or archaeological contexts, and states that
    older painted designs often had religious or utilitarian significance, including
    red geometric designs and an esoteric dotted rectangular cross on animal skins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women’s bags made from caribou leg skins are described as common in Cree wigwams
    and used to carry family effects; a similar small bag is said to be made from
    caribou ears.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Netted carrying bags are used to transport clothing and utensils; they are
    now made of commercial twine but were formerly made of twisted bark string.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Needle cases are made from hollow bird bones stopped at one end.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bird-bone needle cases are said to resemble prehistoric and early historic
    bone tubes from Iroquoian and Madisonville sites; those tubes are described as
    having possible uses as beads, paint pots, or needle cases.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wooden snow shovels, grooved stone axes, stone celts used as ice chisels,
    and axes made from deer shoulder blades or beaver rump bones are described.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that fire was not used by these people to aid in cutting
    wood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Crooked knives and chisels made from beaver teeth are described, along with
    later steel or iron-bladed crooked knives.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Stone or slate knife blades, semilunar slate scrapers used as fleshers, black-bear
    bladder bags for grease, and birchbark snow spectacles are described.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bark baskets are made of birchbark when available, otherwise pine bark; they
    are usually oblong, made from one piece, sewn at the corners with roots, and strengthened
    at the top with withes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Eastern Cree art is described as comparatively meager, with originally few
    purely decorative designs and many designs having religious or utilitarian significance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that old meanings have become obscured or lost through
    European influence and that many religious symbols have become decorative.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Painting is described as the Eastern Cree aboriginal form of art and as formerly
    used for religious, utilitarian, and decorative purposes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Older religious painted designs are said to occur on bear skins and skulls,
    skins of other animals, inner surfaces of skin garments, and faces.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: The older painted designs are described as generally geometric, consisting
    of red lines or bars and dots, while their symbolism is said to be difficult or
    impossible to obtain.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: A frequent motif of esoteric meaning is described as a rectangular cross whose
    two perpendicular bars are each represented by five dots; it occurs on animal
    skins.
  category: object
  evidence_refs:
  - ev:11
