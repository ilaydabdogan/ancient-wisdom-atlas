  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: Carvings of animals, fish, and birds were also made.
  category: object
  evidence_refs:
  - ev:5
- id: obs:16
  text: Children play with miniature wigwams and utensils; little girls play house
