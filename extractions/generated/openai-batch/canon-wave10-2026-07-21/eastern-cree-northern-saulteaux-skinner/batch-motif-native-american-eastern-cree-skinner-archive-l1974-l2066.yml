canonical_text:
  quote: ''
  summary: The passage describes Eastern Cree and related games, toys, children's
    play, smoking pipes, and smoking materials. It includes a square tag-like game
    with a central player called “the cannibal,” ball games, observed or imported
    European games, windmill toys, carved dolls and miniatures, obsolete and modern
    stone pipe forms, and plants smoked in pipes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Square Game, a square is drawn in the snow, one central player is “it”
    and is called “the cannibal,” and the other players stand at the four corners.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Square Game requires corner players to run from corner to corner without
    being touched by the central player.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the central player touches someone, the touched player becomes “it” and
    takes the central player's place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lacrosse is reported as formerly played at Moose Factory but obsolete at the
    time of the account.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Football is described as a game of kicking a ball from one goal to another,
    with throwing disallowed and close goals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The football is made of tanned skin, stuffed with hair, and about the size
    of a man's head.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Cat's cradle was observed, but its forms and rules were not obtained.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hand ball is common, uses a ball similar to the football but smaller, and
