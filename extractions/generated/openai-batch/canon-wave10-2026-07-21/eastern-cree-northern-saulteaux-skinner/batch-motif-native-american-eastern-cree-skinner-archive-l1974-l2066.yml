  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Fox and geese is played with a board, two foxes, and fifty geese.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: A windmill toy has six revolving blades, a long handle, and is fastened where
    wind catches and whirls it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The windmill toy is claimed by the Cree as an old native toy, while the account
