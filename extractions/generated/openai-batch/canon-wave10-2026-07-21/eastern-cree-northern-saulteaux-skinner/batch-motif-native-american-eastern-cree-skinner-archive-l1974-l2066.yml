  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: English or European games, especially cards, are said to be much in vogue,
    sometimes in modified form.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Checkers is played with a regulation board and thirty men all of the same
