canonical_text:
  quote: ''
  summary: The passage describes berdaches, a first-menstruation seclusion custom,
    and reported Saulteaux practices concerning elderly people, including care, possible
    killing by sons, possible abandonment on an island with equipment, and a ritualized
    execution involving a sudatory, dog feast, pipe, song to the Master of Life, killing
    with a tomahawk, painting and burial with weapons, and a bark hut over the grave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Berdaches are described as rare but widely known, habitually dressing and
    acting like women, and being supposed by the source to be hermaphrodites.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some berdaches are reported to take husbands and live with them as wives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A girl at her first monthly terms is confined in a small isolated lodge built
    for that purpose.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the first-period confinement, no communication is held with the girl
    and she is not allowed food; no further Northern Saulteaux customs were learned
    except for the first period.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The writer states that the aged and infirm were generally well cared for,
    while older observers reported this was not always the case.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Long reports that aged men among the Saulteaux were sometimes killed by sons,
    or alternatively put ashore on an island with a canoe, paddles, bow, arrows, and
    drinking bowl to risk starvation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before the reported execution, a sudatory was made, a dog feast was given,
    the pipe of peace was smoked, and a song was sung.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The execution song says the Master of Life gives courage, loves the people,
    and that the father is being given to him so he may become young, enter their
    country, and hunt.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After renewed songs and dances, the son kills his father with a tomahawk;
    the body is painted, buried with war weapons, and covered by a bark hut to keep
    wild animals away.
  category: sequence
  evidence_refs:
  - ev:6
