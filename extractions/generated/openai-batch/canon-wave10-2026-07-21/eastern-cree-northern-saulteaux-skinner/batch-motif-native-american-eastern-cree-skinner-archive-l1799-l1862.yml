canonical_text:
  quote: ''
  summary: 'The passage describes how rabbitskin garments are made: rabbit skins are
    cut into string, twisted into cord, and woven into blankets and other garments
    using frames, sticks, string bases, fingers, and bone needles. It contrasts Eastern
    Cree frame use with Northern Saulteaux single-stick or frameless weaving and notes
    an identification of the weave as the coil-without-foundation variety.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rabbitskin garments are described as universally worn in summer and winter,
    with the custom still surviving to a lesser extent.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fresh rabbit skin is removed through a single breast cut, turned inside
    out, and placed over a stick set up in the middle of the wigwam.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The skin is cut into string by holding a knife near the tail and revolving
    the skin around the stick as the strand unwinds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Rabbitskin string is twisted by fastening one end to a short stick while the
    other end is held with the foot, or by using a split stick rolled against the
    thigh; the finished cord is wound into a ball.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Blankets are woven on a rectangular four-stick frame or loom, with bark cord,
    a rabbitskin-string margin, and rabbitskin string carried by a bone needle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Eastern Cree are said to use frames for blanket making, while Northern Saulteaux
    often use a single stick or, more rarely, only a piece of string; the passage
    says blankets made this way are inferior to loom-made blankets.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In working the blanket, the needle is shoved down from the top over the margin
    cord.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Miss M. L. Kissell identifies the weave as the coil-without-foundation variety,
    which is said to be common among various Athapascan peoples.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A coat trunk is worked on the loom like a blanket, with sleeve holes left;
    sleeves are woven downward around a stick wrapped with cloth or skin to the proper
    size.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Leggings are made like sleeves, moccasins over a stuffed buckskin moccasin
    form, breechclouts with fingers without a loom, and hoods on a circular rabbitskin-string
    base without a needle.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
