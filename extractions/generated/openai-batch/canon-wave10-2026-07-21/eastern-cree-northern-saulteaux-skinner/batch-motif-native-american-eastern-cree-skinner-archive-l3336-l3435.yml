canonical_text:
  quote: ''
  summary: 'The passage describes the Mitâwi ceremony among the Cree: Sokaskew and
    other ritual specialists summon people with tobacco, gather them in a specially
    built lodge, display animal-skin totems and medicinal roots, assign powers to
    the roots, and initiate novices through a staged shooting, deathlike collapse,
    revival, and vision report involving the Earth of Spirits and celestial hunt.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sokaskew summon Crees to the Mitâwi ceremony near the vernal and autumnal
    equinoxes by sending tobacco through messengers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Accepting the tobacco makes the recipient liable to attend, while refusal
    is permitted but said to be rare because people fear magical retaliation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gathered people build an oblong, conical Mitâwi tent or lodge with openings
    at each end.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cree participants enter the lodge nude, painted, and prepared as if for war,
    then take places along the walls while the middle is left vacant for conjurors.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Medicine men and magicians enter led by the Sokaskew, carrying animal skins
    identified as their totems, fetishes, manitous, or guardians revealed in dreams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Medicinal roots and herbs gathered in summer are arranged in a single line
    so each conjuror can infuse them with powers associated with his totem.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each magician makes three rounds of the roots, chanting and placing the animal
    head on them; the grand priest then declares the particular powers and uses assigned
    to the roots.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: No uninitiated Cree may enter the mysteries of the Mitâwi; initiation is given
    for payment and entails obligations of fidelity to the laws of magic.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Novices are reviewed by jugglers with chants, grimaces, insufflations, passes,
    and pointed totems before the magicians jointly direct power at a selected novice.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The selected novice is said to be struck by invisible arrows of the manitous,
    falls motionless, and is declared dead or acts as if dead when told he has been
    shot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The dead initiate is revived through touching, hand and totem passes, sacred
    roots, songs, and breath directed toward the heart.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After signs of life return, medicine men draw blood, worms, pebbles, nails,
    and other objects from the body, and the revived person speaks of being called
    back from the Earth of Spirits and the celestial hunt.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: People nearby ask the revived initiate what he has seen and gather to hear
    his vision.
  category: speech
  evidence_refs:
  - ev:10
