  category: object
  evidence_refs:
  - ev:5
- id: obs:18
  text: Mackenzie says the Cree believed vapor over moist and swampy places was the
    spirit of someone recently dead.
  category: other
  evidence_refs:
  - ev:6
- id: obs:19
  text: Mackenzie says another spirit, shaped like a man and bearing a gun, appeared
