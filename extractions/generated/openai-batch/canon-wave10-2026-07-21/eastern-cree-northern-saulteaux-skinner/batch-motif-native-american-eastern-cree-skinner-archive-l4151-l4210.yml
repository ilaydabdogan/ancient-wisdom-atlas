  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Mackenzie’s cited account says all property of the departed person was destroyed,
    while relations exchanged their apparel for rags.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Mackenzie’s cited account describes a funeral feast, formerly repeated annually,
    with eulogies on the deceased.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Mackenzie’s cited account says tombs bore carved or painted symbols of the
