canonical_text:
  quote: ''
  summary: The passage describes Cree mortuary customs, including contemporary Church
    of England-style burials at posts, older bark-wrapped burials with grave-side
    offerings and taboos, measures to prevent a returning spirit, Mackenzie’s account
    of smoking, feasting, mourning self-injury, property destruction, animal tribal
    symbols on tombs, and beliefs about spirits appearing as swamp vapor or as a man-like
    figure in trees when property is withheld.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At posts, modern Cree are said to bury the dead according to Church of England
    ceremonies; in the bush they approximate the method without the burial service.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wooden coffins, fenced grave enclosures, and head-board markers are described
    for burials.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the reported older practice, the body was laid straight in the grave, wrapped
    in birch or pine bark, and not flexed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a man, skulls and bones of animals he had killed were placed nearby.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: People avoided getting into a grave while digging it because entering the
    grave was thought to cause the person to die soon afterward.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: The deceased person’s belongings were laid on the grave rather than in it;
    after a week or two most articles were generally taken away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the grave was that of a man, the bow and arrows were excepted from later
    removal and were not to be used by anyone else.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The oldest man in the band watched over the grave for two or three days to
    prevent the departed spirit from returning and taking someone else.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: For the first three nights, fish nets were sometimes stretched on poles around
    the wigwam as a barrier against the spirit’s return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Mackenzie’s cited account says funeral rites began with smoking and ended
    with a feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Mackenzie’s cited account says the body was dressed in the best available
    clothing, placed in a branch-lined grave, supplied with domestic utensils, and
    covered with a canopy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Mackenzie’s cited account describes lamentation, hair-cutting, piercing of
    thighs and arms, and blackening of faces with charcoal by near relations when
    the deceased was deeply regretted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Mackenzie’s cited account says those distinguished in war were sometimes laid
    on a scaffold.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Mackenzie reports having been informed that women had been known to sacrifice
