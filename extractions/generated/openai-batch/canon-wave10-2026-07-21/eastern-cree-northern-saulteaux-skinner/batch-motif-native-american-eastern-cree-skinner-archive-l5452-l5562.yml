canonical_text:
  quote: ''
  summary: The passage contains the end of a story about a man who lives with beavers,
    takes on beaver traits, is recovered by his brother, and must avoid eating female
    beaver flesh. It then gives a story called "The Burning of the World," in which
    a young man marks out a protected square of land before a world fire; he, his
    mother, his sister, and many animals survive, while unbelievers burn. Afterward
    he assigns animals to proper forms and habitats and gives bird names to himself
    and his female kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man swims out to a female figure, follows her through an underwater door,
    and emerges inside a dry place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man lives with beavers for years, eats willows and tree bark, learns to
    swim and act like a beaver, builds beaver houses, and uses his axe where beavers
    use teeth.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The man's brother misses him, dreams what became of him, searches for him,
    and recognizes signs including trees cut with an axe near the beavers' place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In winter the brother stakes the river near beaver houses; beavers are caught,
    and the beaver-man warns his wife and teaches beavers to make holes in the bank.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The brother kills the beaver wife in a bank hole, later finds the man almost
    changed into a beaver, gives him clothes, and takes him home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The returned man warns that eating female beaver flesh would make him turn
    into a beaver again and prevent his return to human form.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the burning-world story, all the world is burned except for a man, his
    mother, and his sister; many people had existed before.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: The young man marks out a large square refuge by shooting arrows west, east,
    south, and north; beings that want to be saved may come there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Birds and animals run to the marked refuge as the fire comes; the father and
    his family are refused entry and are burned, and the water becomes boiling hot.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the fire, the man assigns animals to forms and habitats, including placing
    the beaver in water and rejecting the rabbit's wish to be a beaver.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The squirrel wants to be a bear but is rejected; the story explains the squirrel's
    bright, swollen eyes as the result of weeping, and the bear is made as a quiet,
    wary animal.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: 'After assigning animals, the man marks and renames the surviving people:
    his mother as Robin, his sister as golden-winged woodpecker, and himself as blackbird;
    they fly away and later meet again.'
  category: sequence
  evidence_refs:
  - ev:11
