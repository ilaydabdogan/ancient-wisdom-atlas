canonical_text:
  quote: ''
  summary: A Wolverene episode explains the saltiness of James and Hudson's Bay after
    Big Skunk blinds Wolverene and Wolverene washes in the sea. The story continues
    with Wolverene's encounters with wolf in-laws, winter camping, fire-making, food-sharing
    conflict, reciprocal tricks, and the eventual killing of Wolverene, his children,
    and his wife by the wolves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Big Skunk discharges in Wolverene's face, and Wolverene cannot open his eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wolverene asks the beasts to make a hole in the ice so he can wash his eyes,
    but they tell him to go to the sea rather than the lake.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: While unable to see, Wolverene bumps into trees, a stump, and the ice, and
    they identify themselves to him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wolverene falls into the water, washes himself clean, and the narration states
    that the sea water is salty because of Big Skunk's flatus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After regaining sight, Wolverene comes ashore and sings that he closed Big
    Skunk's anus.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Three wolves, identified as Wolverene's brothers-in-law because he had married
    a wolf, hear his song and plan to hide and scare him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wolverene tells the wolves he is single, though the passage says he had married
    a wolf.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In winter, the wolves infer that Wolverene is married because he wants to
    camp in thick forest and carries flint and steel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The wolves demonstrate fire-making by piling wood and leaping over it until
    it blazes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: During marrow-bone splitting, the wolves tell Wolverene to close his eyes
    and strike him over the head with a bone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Wolverene repeats the eye-closing instruction to the wolves and kills one
    wolf by striking him with a bone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The remaining wolves send Wolverene away but give him the power of lighting
    fire by jumping over it, with the instruction to use it only after hunting.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Wolverene uses the fire-making power without first hunting, later throws away
    his flint and steel, then cannot make fire or find the tools and nearly freezes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: After returning to his family and in-laws, Wolverene kills many beavers while
    the wolves fail to kill game; he refuses to help them with a moose because he
    says he wants beaver.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Wolverene wants moose meat after being stingy with his beavers, and the wolves
    prepare a frozen moose inner stomach as a club for when he asks for meat.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: Wolverene brings beaver meat to his mother-in-law, receives fat, closes his
    eyes while eating, and the wolves kill him with the frozen inner stomach.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: After killing Wolverene, the wolves kill his two little ones and spear his
    wife to death.
  category: action
  evidence_refs:
  - ev:14
