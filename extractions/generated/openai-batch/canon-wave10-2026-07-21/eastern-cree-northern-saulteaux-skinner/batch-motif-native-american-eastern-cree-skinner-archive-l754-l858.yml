canonical_text:
  quote: ''
  summary: 'The passage describes Eastern Cree lodge types and construction: conical,
    dome-shaped, and two-fire wigwams; materials including bark, skins, brush, and
    canvas; a prohibition on counting lodge poles during construction; interior arrangements
    such as central hearths, smoke openings, seating, and storage poles; and comparisons
    with western Cree, Sioux, Plains Indian lodges, and prehistoric Algonkin hearth
    sites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage states that the Eastern Cree formerly used three general types
    of lodge: conical, dome-shaped, and large two-fire wigwam.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that these lodge types are still used, usually covered
    with canvas, while the skin lodge has become obsolete.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The conical lodge is constructed by raising two saplings tied in a V-shape
    and adding a third pole in the crotch before adding further poles for the frame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Counting the lodge poles during erection is described as exceedingly unlucky,
    while counting them after completion is permissible.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The usual number of poles for a lodge is given as twenty-five, thirty, or
    forty, depending on size.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bark coverings are described as rolls or slabs placed over the framework and
    held down with additional poles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Birchbark is preferred to pine bark for a bark wigwam, although pine bark
