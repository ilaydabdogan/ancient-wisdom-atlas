canonical_text:
  quote: ''
  summary: A young man married to Wemishus's daughter repeatedly survives Wemishus's
    attempts to defeat or kill him. Wemishus is caught in a split-rock trap, abandons
    the young man on an island, and later burns his own winter clothing after the
    young man switches garments. The young man uses a gull skin to fly home. Wemishus
    finally turns into a juniper or tamarack tree for his descendants' firewood. The
    young man then leaves to seek his younger brother and begins an uncertain recognition
    scene.
  language: English
