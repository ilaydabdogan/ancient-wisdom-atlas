canonical_text:
  quote: ''
  summary: 'The passage describes hunting and trapping practices among the Northern
    Saulteaux and related Eastern Cree comparisons: a young man''s first big-game
    kill is marked by a feast and overnight drumming and prayer-singing; bows, arrows,
    snares, nooses, deadfalls, nets, baits, and later steel traps are described; hunters
    are said to regard beaded bandolier shot and powder pouches as good-luck possessions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man who kills his first moose or other big game usually has a feast
    made in his honor and is expected to stay up all night drumming and singing prayers
    for future success.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large game were taken with a simple bow about six feet long and stone-headed
    arrows; ducks and geese with bone-headed arrows; and smaller game with blunt arrows.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bears, lynx, and other carnivores were both snared and shot, and lynx nooses
    were made of twisted willow roots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A bear snare used a noose hung over a bear path from a suspended log beside
    a living tree, with the path blocked except for one opening.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rabbits were caught with a noose and tossing pole, and many fur-bearing animals
    were caught in deadfalls set in their paths to avoid damaging the skins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A deadfall could use a log pen, bait, a treadle, a trigger, and a falling
    log that dropped and crushed the animal when the treadle was stepped on.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For otter, a similar deadfall used two choking logs at the foot of an otter
    slide, with the falling stick arranged to break the otter's back.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Deadfalls and other snares were baited with pemmican and grease flavored with
    castor, or sometimes with castor alone.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lynx were sometimes snared along a hunter's own trail because the passage
    says lynx follow travelers through the woods out of curiosity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Prairie chickens gathered at annual March mating-season dancing grounds, which
    were fenced with tamarack boughs and fitted with slip nooses and sometimes adjacent
    nets.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The pound trap for deer and caribou was unknown to the Northern Saulteaux,
    and in modern times steel traps and commercial wire had replaced many older trap
    materials.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hunters believed that possessing beaded bandolier shot and powder pouches
    brought good luck.
  category: attribute
  evidence_refs:
  - ev:7
