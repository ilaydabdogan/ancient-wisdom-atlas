canonical_text:
  quote: ''
  summary: The passage records a fasting dream in which a young man sees a small empty
    world, suffering people, animals, a caretaker for Indians, a drum, the Great Spirit,
    and a conjuring tent whose shadow reaches heaven. It then describes Stewart's
    account of the Metawin or Long Life feast, including its supernatural origin,
    lodge structure, officers, badges, ritual entry, speeches about long life and
    healing, medicine bags and migis shells, and an initiation in which candidates
    fall as if shot and are revived by medicinemen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man went away alone and fasted for ten days before having a dream.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the dream, the world first appeared very small and empty, with two Indians
    who lived there and suffered.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: People from another country came and supplied the two Indians with food and
    other things.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dreamer saw animals, fish, and birds, and an unidentified someone who
    would take care of them, help the Indians live, and give the Indians one animal
    at a time to eat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dreamer learned of a drum, how to make it, the Great Spirit, the conjuring
    tent, and that beating the drum was the same as a prayer to the Great Spirit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The shadow of the conjuring tent reached to heaven, and spirits moved within
    the shadow.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The dream ended with the dreamer knowing he was to take care of the Indians.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Stewart describes a feast at Beren's River called the Feast of the Metawain
    and later the Feast of the Long Life, apparently one of the rites of the midéwin.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The society was said to have been established in the east by supernatural
    characters, and power was given from the original lodge to shamans to found subordinate
    lodges.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Metawin tent was long and narrow, covered with woven boughs to screen
    its operations from outsiders, and had doors opening to the east and south.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Members wore or held small animal-skin badges or bags, ornamented with porcupine
    quills and containing personal charms and medicine; examples include beaver, mink,
    muskrat, owl, and snake.
  category: object
  evidence_refs:
  - ev:8
  - ev:12
- id: obs:12
  text: Invitations were sent by the chief shaman in the form of a piece of tobacco.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The chief shaman and assistants approached the tent from the east, marched
    around it three times following the course of the sun, and the Grand Master advanced
    and retreated three times before entering.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Inside the tent, members marched around three times holding skin bags and
    migis shells, while the chief shaman stood near a human image with a drum and
    stick.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The chief shaman addressed the company with blessings from the Great Spirit,
    references to long life, medicine skins, magic beads, restoring life, and ancestral
    teachings about herbs and roots.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Candidates sat with women and children along the sides of the tent before
    initiation.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:17
  text: During initiation, a medicineman threw his medicine bag toward a candidate,
    who dropped to the ground as if shot.
  category: action
  evidence_refs:
  - ev:14
- id: obs:18
  text: Medicinemen knelt around the fallen candidate, blew into his ears and mouth,
    shook medicine bags over him, and made a soft rumbling noise until he came to
    life and joined the procession.
  category: sequence
  evidence_refs:
  - ev:14
