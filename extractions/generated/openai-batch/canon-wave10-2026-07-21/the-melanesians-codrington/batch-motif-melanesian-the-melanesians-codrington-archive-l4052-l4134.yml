canonical_text:
  quote: ''
  summary: 'The passage describes Banks Islands tamate societies and related associations:
    their masked appearances, intimidation of outsiders, dances, initiation rules,
    ritual penalties, comparable New Hebrides associations, and the Qat initiation
    enclosure with a shark-mouth entrance where neophytes learn dance and song.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tamate societies make masks and dresses inside their lodge, and the sound
    called linge tamate signals that the mysteries have begun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the societies are active, the country is described as closed, paths become
    dangerous, and people risk being beaten by tamate.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Society members take goods from gardens and fruit trees for a feast and punish
    perceived disrespect toward the society.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Disguised ghosts rush into villages, chase women and children, and beat those
    they catch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some lesser societies do not terrify or beat outsiders, but come out to display
    their finery and dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A dancing scene is described in which masked figures wear pointed cowl-like
    head coverings, painted eyes, scarlet seeds, cycas fronds, and sago-leaf cloaks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Women and small children gather around the nonviolent tamate dancers with
    admiration and awe.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A footnote describes men of a tamate society pulling a house apart to compel
    a man or his son to join them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Qasa are described as young men wearing masks and dried banana-leaf dress,
    dancing with a rustling noise and speaking gibberish or a neighboring dialect.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Ureparapara, during initiation into menmendol, smoke of fire is forbidden;
    if smoke is seen, a sagilo is set up and a pig must be given.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In nearby parts of the New Hebrides, mysterious associations have unapproachable
    retreats for the uninitiated and possess masks and dress.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Qat initiation uses a reed-fenced enclosure in a retired place with overlapping
    ends called the shark's mouth, and neophytes remain there unwashed and blackened
    with ashes while learning dance and song.
  category: sequence
  evidence_refs:
  - ev:10
