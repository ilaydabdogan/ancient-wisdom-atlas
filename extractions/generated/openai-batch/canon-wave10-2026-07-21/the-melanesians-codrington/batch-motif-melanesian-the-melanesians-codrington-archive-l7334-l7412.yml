canonical_text:
  quote: ''
  summary: The passage recounts Qat making a covered canoe in Gaua, taking his wife,
    brothers, and the island's living creatures into it, and leaving during a deluge
    that forms a channel to the sea. It also reports expectations of Qat's return,
    brief comparisons with Lata and Tinota, and a Santa Cruz story in which Natei
    encounters non-ordinary inland visitors who bring him feather-money and supernatural
    favor.
  language: English
  quote_policy: summarized
