canonical_text:
  quote: "“the sea for the first time stood full around the whole world”"
  summary: The passage first completes a Tagarombiti episode in which he traces stolen
    fish to Merambuto, kills him, burns his house, and revives the fish in salt water,
    explaining soles as Tagaro's half-fish. It then gives a Lepers' Island story in
    which an unnamed old woman forbids two boys to enter a rear enclosure where a
    via leaf holds water; the boys disobey, one shoots at a lizard and strikes the
    leaf, the water bursts out, and the old woman's cry brings the sea around the
    whole world for the first time.
  language: English
  quote_policy: quoted
