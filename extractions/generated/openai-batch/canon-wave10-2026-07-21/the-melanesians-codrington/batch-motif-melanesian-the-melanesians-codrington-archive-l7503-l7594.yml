canonical_text:
  quote: ''
  summary: 'The passage defines spirits in Omba, describes named spirits and vui,
    and recounts several Tagaro-related stories: creation, sacred stones and charms,
    escape from Merambuto in a shell, a man aided by two female vui with mana stones
    for pigs, Tagaro and Suqe''s conflicting creation acts, the bringing of night
    in a shell, Tagaro-mbiti''s hidden productive gardening, and the marriage and
    return-to-heaven of a winged woman whose wings Tagaro stole.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Omba, a spirit called mi is described as immortal, bodily but invisible,
    human-like, not eating or drinking, and visible only to the dead; some other spirits
    can appear in bodily shape.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nggelevu is named as a spirit who presides over the dead; Tagaro and his brothers
    or companions are also named among remarkable spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tagaro is said to have made fruit-trees, food, pigs, and finally men, and
    is still invisibly active in human affairs and invoked in sickness and difficulties.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tagaro-lawua, the Big, is described as boastful and incapable, while Tagaro-mbiti,
    the Little, is described as very knowing and powerful; when Tagaro is spoken of,
    Tagaro-mbiti is meant.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Merambuto tried to catch and kill Tagaro's party by night, but Tagaro made
    them all sleep in a shell; after Tagaro-lawua revealed the secret, Tagaro-mbiti
    made them sleep elsewhere.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sacred stones are said to be connected with Tagaro, and charms are said to
    have power from the name of Tagaro in them.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Vui are described as spiritual beings of a different order from Tagaro; they
    are superhuman in nature and power and can be seen.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man followed his two wives to the beach, noticed stolen cocoa-nuts, followed
    footsteps, and found two hungry female vui.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The man brought the two female vui four baskets of food; one was beautiful
    and the other was full of sores, and he chose to take both when they asked which
    he would have.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Each female vui gave the man a mana-filled stone, one for ten barrow-pigs
    and one for ten sows, and promised help in obtaining pigs so he could rise in
    the Suqe; fish are still said to be found ready for his wives.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Merambuto and similar beings are represented as mischievous and unfriendly
    but also easily deceived and ignorant; Merambuto feared the conch-shell trumpet
    in a story about Tagaro-mbiti in a tree.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Suqe is represented as sharing creation work with Tagaro but repeatedly disagreeing
    with him; Tagaro's decisions about edible fruit, human posture, work, and houses
    prevail.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Tagaro went to Maewo and brought back night in a shell; when he released it,
    darkness spread over the sky and people wept and beat their houses.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Tagaro is also represented as father of ten sons, with Tagaro-mbiti as the
    last, very small, and afflicted with a sore leg; while his brothers planted less
    productive crop parts, he secretly planted better crop parts and later had abundant
    food when they had none.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Tagaro, or Qatu in a Maewo version, married a winged woman from heaven; he
    watched women remove their wings to bathe, stole one pair, hid them at the main
    pillar of his house, and took the wingless woman as his wife.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The winged wife made ripe yams come into her hand by touching the vines; after
    Tagaro's brothers scolded her, she wept by the pillar, her tears uncovered her
    hidden wings, and she flew back to heaven.
  category: sequence
  evidence_refs:
  - ev:16
