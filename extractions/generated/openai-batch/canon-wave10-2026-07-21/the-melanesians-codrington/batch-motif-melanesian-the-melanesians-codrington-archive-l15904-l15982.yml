canonical_text:
  quote: ''
  summary: 'A mother directs her son to a gaviga-tree. At night he climbs it and meets
    a ghost who identifies him as his nephew, hides him in the hollow of the tree,
    and protects him while many ghosts come to eat the fruit. At dawn the ghost uncle
    keeps back a female among the ghosts and gives her to the man as wife. The man
    returns to his village with her and tells his mother that her dead brother gave
    the woman to him. Later, while the husband is away, the wife gathers taro, hibiscus
    leaves, and firewood in an uncanny manner: the items are already in her hand when
    she reaches for them, and the garden appears untouched to the husband.'
  language: English
  quote_policy: summarized
