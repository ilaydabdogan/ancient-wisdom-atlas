canonical_text:
  quote: ''
  summary: The passage describes a child initiation at Pek in Vanua Lava for admission
    into the Salagoro, including a screened precinct, male child candidates, a masked
    tamate wasawasa figure who dances and conducts them, contact with pigs, entry
    into an enclosure, later seclusion, and payment of money and pigs. It also summarizes
    lodge arrangements, exclusion of women and uninitiated persons, badges of croton
    leaves used to mark prohibitions, daily club meals, restricted food from the salagoro
    oven, and a leaf-bunch atonement for disturbances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tall screen of coconut leaves hides the Salagoro precincts from the uninitiated.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The candidates for admission are boys, including babies carried in their fathers'
    arms.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A signal and a long loud cry precede the arrival of the tamate wasawasa, described
    as the harmless ghost who conducts the children into the Salagoro.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tamate wasawasa is a man in a mask or tamate with slits, a body covering
    of blanched coconut-leaf fringes, and two white rods in his hands.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The masked figure leaps into the tinesara, dances around the children, rushes
    among them, and beats the white wands together until they break over the group.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each child smacks pigs tied to stakes before the group enters the tall enclosure
    in single file.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: One frightened child runs away during the ceremony, is brought back, and later
    runs out through the screen toward home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The described event is called only the preliminary ceremony, and the children
    are to remain in the enclosure forty or fifty days until money and pigs are paid
    for club membership.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In one island the Great Tamate has no salagoro; a chamber for initiation is
    made in the gamal, the house of the Suqe Club, with small entrance payment and
    infants admitted.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Banks' Islands lesser societies have no salagoro; their lodge is the
    sara.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Women and uninitiated persons, described as matawonowono with their eyes closed,
    are strictly excluded from all lodges.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Croton leaves serve as badges; a member can mark fruit trees or a garden with
    such a leaf to reserve them, and the prohibition is observed.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: For much of the year the salagoro or sara is used like a club, and newly admitted
    members prepare a daily meal there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A yam from the salagoro oven may be sent as a compliment, and no one whose
    eyes are still unopened will eat it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: If someone causes a disturbance in the salagoro, a makomako bunch of leaves
    is set out and the culprit must put money on it as atonement.
  category: action
  evidence_refs:
  - ev:8
