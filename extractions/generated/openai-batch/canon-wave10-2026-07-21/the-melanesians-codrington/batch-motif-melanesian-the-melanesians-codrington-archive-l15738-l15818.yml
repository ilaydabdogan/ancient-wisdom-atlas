canonical_text:
  quote: ''
  summary: The passage concludes a story in which a boy shares roasted yams with an
    Eel who becomes a man, is attacked, restored to eel form by water, later cut into
    pieces after a rain-flood, and restored to man form by the boy's tears. The Eel
    tells the boy and his parents to move to another island; afterward the Eel's voice
    is heard and a great surf destroys the remaining islanders. The passage then begins
    the Vanua Lava story of Molgon and Molwoe, two brothers whose parents die after
    charging the elder to care for the younger; the brothers paddle upstream and encounter
    increasing numbers of floating fruits.
  language: English
  quote_policy: summarized
