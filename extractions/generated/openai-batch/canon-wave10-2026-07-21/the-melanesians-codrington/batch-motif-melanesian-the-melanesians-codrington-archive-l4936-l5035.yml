canonical_text:
  quote: ''
  summary: The passage describes procedures for entry and advancement in the Banks'
    Islands suqe, including patronage, payments of pigs and money, formal night rites
    in the gamal, ceremonial eating from a fire or oven, fasting, graded feasts, restricted
    food rules, special dress, and mana-bearing palako logs carried during high-rank
    celebrations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A candidate's introducer is normally his mother's brother, whose goodwill
    is secured beforehand by a formal gift of a pig.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The patron makes a feast and dance for the candidate, decorates the village
    square with male pandanus flowers, sets out money, receives a small money gift,
    and makes a return present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Higher grades require larger amounts of money and sometimes pigs; the candidate
    may be aided by friends, his father, or his wife's father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: For formal entrance, women leave the village before nightfall and society
    members meet in the gamal.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The candidate goes to the division containing the fire and oven to which he
    will belong; the patron breaks a money string into a basket, and other members
    put a leaf garland on the money.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The new member sits while a chosen fluent speaker tells him that he must work
    for his oven and not complain if duties are hard.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Members each hold a bit of almond to their lips and eat together at a stated
    word, accompanied by the formula that food is given from the speaker's fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'After the night ceremonial eating, the next morning includes the buying of
    the suqe: the new member breaks money strings, touches food after fasting, and
    distributes money and food to every fireplace in the gamal.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A general feast follows, and the new member must remain in the gamal and eat
    only from his suqe fire for a number of days determined by rank.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In higher-rank feasts, food cooked in the ceremonial fire is carefully distinguished
    from other food; when few qualified men are present, food from the newly reached
    oven is sent to men of the same rank elsewhere.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Pigs are not killed and consumed at the feast; they are sent away with a slap
    from the newly raised member or with a ceremonial representation of being killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: For the highest steps, a special dress called malo-saru was formerly used,
    and the candidate was kept unseen for many days in an inner chamber in the gamal
    while fasting.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Palako logs dressed in cycas leaves and flowers are brought out and are described
    as heavy with the ghostly power or mana that they contain and symbolize.
  category: object
  evidence_refs:
  - ev:7
