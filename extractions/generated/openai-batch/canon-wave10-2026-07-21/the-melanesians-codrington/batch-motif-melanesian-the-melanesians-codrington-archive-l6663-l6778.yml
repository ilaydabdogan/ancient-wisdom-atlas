canonical_text:
  quote: ''
  summary: The passage describes non-human spiritual beings in Melanesian traditions,
    especially Kahausibware of San Cristoval, a female Hi'ona/Figona in snake form
    associated with the origin of humans, animals, and food plants. A story tells
    how she strangled a child, was attacked by the child's mother, departed by sea,
    and after her departure conditions in San Cristoval deteriorated. The passage
    then describes incorporeal spirits or vui/wui in the Banks' Islands and Northern
    New Hebrides, their associations with stones, sacred places, and animals, and
    stories of named humanlike vui such as Marawa, who aided Manlepei after being
    encountered beyond an opening rock in a cave.
  language: English
  quote_policy: summarized
