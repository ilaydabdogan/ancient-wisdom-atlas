canonical_text:
  quote: ''
  summary: The passage describes a Melanesian possession performance involving leaders,
    assistants, sacred ghost-haunted places, sticks, kava, and the recovery of the
    possessed by name-calling. It then describes Banks' Islands tricks believed by
    some to be ghostly actions, including a voice from the ground and a simulated
    burning house. The passage concludes with regional beliefs about sneezing as a
    sign that a person's name is being called, that a curse may be active, or that
    a child's soul is moving away or returning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The leader and assistants enter sacred places said to be haunted by ghosts,
    including a place where mourners wash off black mourning marks; they collect ghosts
    and become so possessed that they appear senseless while still acting methodically.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Subjects lie in the gamal while the ghost-bringing performers move along the
    outside of the house and strike it along its length with sticks, causing the subjects
    inside to roll about distracted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Performers called 'ghosts' enter with sticks; each is believed in the performance
    to be a particular deceased person, with Tagilrow and Qatawala named as examples.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The subjects are given sticks to strike the performers' sticks, and as they
    strike, the ghost is said to strike and possess them one after another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The possessed subjects are drawn into the open village space, appear not to
    recognize or hear anyone except the 'ghosts,' and display violent strength and
    rage for seizing and striking objects.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a time the 'ghosts' take the subjects back into the gamal, drink kava,
    pour away dregs while calling the name of each possessed person, and the senses
    of each return as the name is called.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports that five days pass before the possessed persons can go
    about again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After a Christian teacher came to Lo, two of his scholars were allowed to
    attend in order to test whether the practice was deceptive, and they were possessed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Banks' Islands, a voice can be made to seem to come from the ground
    beneath a person's feet by speaking through an open bamboo placed in the ground
    and directing the sound.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A family working in a garden may perceive smoke, sparks, hissing flames, and
    popping bamboo rafters as signs that their house is burning, but the effect is
    produced by a hidden party using fire, green reeds, and dry coconut fronds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Florida, a sneeze is interpreted as meaning that someone is speaking of
    the sneezer, perhaps angrily or with a curse, and the sneezer calls on his tindalo
    in response.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Saa and in the Banks' Islands, sneezing is also interpreted as indicating
    that the person's name is being called for good or evil; at Saa the sneezer uses
    a formula asking who calls and invoking a lida if the call is evil.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: In Motlav and Mota, when a child sneezes, speakers cry out words urging the
    child to come back, live, or roll back to them; the passage explains this by saying
    that a ghost is thought to be drawing away the child's soul.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: In Lepers' Island, an infant's sneeze can mean that its soul has been away
    and has just returned, and those present cry out good wishes.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: 'In Lepers'' Island, the character of a sneeze is used to judge the motive
    of the person calling the sneezer''s name: a gentle sneeze means no harm, while
    a violent paroxysm warns of a curse.'
  category: attribute
  evidence_refs:
  - ev:10
