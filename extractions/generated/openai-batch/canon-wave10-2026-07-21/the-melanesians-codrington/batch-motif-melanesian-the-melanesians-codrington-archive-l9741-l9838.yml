comparison_claims:
- id: claim:1
  claim: The Florida, Saa, Banks' Islands, and New Hebrides/Lepers' Island sneeze
    beliefs share the function of treating a sneeze as evidence that the sneezer's
    name is being called or acted upon for good or evil.
  claim_level: same_function
  target: Regional Melanesian sneeze-as-name-call beliefs
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives brief locality examples and does not establish historical
    transmission or a single uniform doctrine.
- id: claim:2
  claim: Motlav, Mota, and Lepers' Island examples share a child-sneeze pattern in
    which speech by those present addresses the child's life, return, or soul movement.
  claim_level: same_function
  target: Child or infant sneeze and soul-return beliefs in Motlav, Mota, and Lepers'
    Island
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: Motlav and Mota emphasize calling the child back or preventing loss,
    while Lepers' Island says the soul has just returned; the variants are related
    in function but not identical.
- id: claim:3
  claim: The two Banks' Islands trick examples share a pattern of hidden human mechanisms
    producing effects that observers interpret as ghostly or alarming phenomena.
  claim_level: same_function
  target: Banks' Islands tricks believed to be ghost work
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to this passage and concerns function, not
    a claim about origin or diffusion.
