  summary: The passage describes beings called Tavogivogi as nonhuman spirits, likens
    them to neighboring mae snakes that take human form, and says Tavogivogi appear
    as youths or women to seduce the opposite sex. A tree-name question can reveal
    their deceit; after disappearing in bird or other creature form, the seduced person
    sickens and dies. The name is glossed as meaning “changeling,” from a word for
    changing form.
