canonical_text:
  quote: ''
  summary: 'The passage describes several Melanesian magical practices: a Savo and
    Florida method of attack called vele; related practices in Guadalcanal, Saa, and
    Lepers'' Island; gaqaleva magic involving feared shape-changing wizards; a non-malicious
    account of Molitavile sending his soul in bird form after a ship; and dream-divination
    in which a professional dreamer negotiates with a ghost for the release of a sick
    person''s soul.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A practitioner of vele carries leaves and other things believed to contain
    mana for the attack in a bag on his back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the vele attack, the assailant seizes the victim, bites his neck, stuffs
    magic leaves down his throat, strikes him with an axe without killing him immediately,
    and the victim dies after two days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A vele assailant may name himself openly, but the charm makes the victim forget
    the name while going home.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Lepers' Island vequa account, the wizard uses charms so the victim
    cannot clearly see or defend himself, then wounds him with a small charmed bow
    and arrow; the victim later falls ill and dies without remembering what happened.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gaqaleva magic is feared during sickness, and friends of a sick person guard
    him with counter-charms and drive away flies in case a wizard comes in fly form.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some wizards are said to change into sharks to eat enemies, and magicians
    are also described as turning into eagles and owls.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Molitavile undertakes to turn into an eagle and fly after a vessel that has
    carried people away from the island.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Molitavile enters a house decorated with coconut fronds, drinks prepared kava,
    lies down, and his soul is said to go out in the form of a bird to follow the
    ship.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the soul-flight, Molitavile reports that all those taken away are well
    except one who is dead; returning people later say that his report was true.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In Maewo, a professional dreaming-man may be summoned in sickness, paid with
    tobacco or formerly mats, and asked to identify an offended ghost.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the dream account, the dreamer meets a small old-man-like ghost at the
    sick man's workplace and learns the ghost's name.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ghost says the sick man encroached on his haunted ground, so the ghost
    took the man's soul and enclosed it in a magic fence in the garden.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The dreamer begs pardon and asks for the soul's return; the ghost opens the
    fence, releases the soul, and the sick man recovers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Dreamers are also said to be able to visit Malanga, an abode of the dead.
  category: attribute
  evidence_refs:
  - ev:5
