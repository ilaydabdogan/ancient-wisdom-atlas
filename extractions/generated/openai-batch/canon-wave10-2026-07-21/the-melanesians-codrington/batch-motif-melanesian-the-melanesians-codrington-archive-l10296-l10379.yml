canonical_text:
  quote: ''
  summary: The passage describes betrothal and marriage practices in several Melanesian
    island groups, including infant engagements, exchange of gifts and payments, a
    bride moving to the husband's family, shyness or reluctance of young couples,
    concern for virginity, marriage payments in money, pigs, porpoise teeth, feather-money,
    food, and mats, and a Northern New Hebrides ceremony involving a dracaena branch,
    speeches, presentation of the bride, feasting, thanks to the bride's kin, and
    a sham-fight between the two kin groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In some described families, a marriageable girl goes to live with her new
    family after arrangements are made, without reluctance or being carried by friends.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that consummation may be delayed because of the bridegroom's
    shyness, while parents encourage the young couple to be friendly and give them
    chances to talk and work together.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bride's virginity is said to concern her friends because promised payments
    may not be made if her character is questioned, and because propriety is valued.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Santa Cruz, engagements are often made in infancy; the father selects a
    suitable girl, and presents and feather-money are exchanged between both sets
    of parents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Santa Cruz, the boy is later told that a girl is engaged for him but not
    told who she is; he is warned not to go near a certain house and guesses her identity.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Banks' Islands, friends arrange the marriage and agree on payment;
    the young man or his friends give money and pigs to secure the woman, and her
    friends make an answering present.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the Banks' Islands marriage matter is settled, the bridegroom's friends
    make a feast and give the tail of the pig to the bride's father.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the Banks' Islands, after payment of money, the girl is taken as wife without
    ceremony.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A girl engaged to an old man or one she dislikes may run off into the bush
    with the youth she chooses, and a pig from his friends may settle the matter.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A girl betrothed as a child may be taken to her future home to learn the people
    and, if from another island, the local language.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the Northern New Hebrides, a girl betrothed in childhood may be brought
    up in her future father-in-law's house; the boy may think she is his sister and
    later feel ashamed on learning the relation.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: In Araga, when a girl is old enough to be married, she is sometimes tattooed
    and always assumes her petticoat.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: At an Araga marriage ceremony, people assemble in the village, an important
    speaker gives a speech, the bridegroom plants a dracaena branch in the ground,
    and he brings pigs, food, and mats given for the bride.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Araga speaker exhorts the bridegroom to feed his wife properly, treat
    her kindly, and not be sulky with her, then hands over the bride in new clothing
    and a new mat.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: After the Araga handover, there is a feast, the bridegroom strokes the bride's
    father or orator in thanks, and a sham-fight occurs between the bridegroom's and
    bride's kinsmen.
  category: sequence
  evidence_refs:
  - ev:15
