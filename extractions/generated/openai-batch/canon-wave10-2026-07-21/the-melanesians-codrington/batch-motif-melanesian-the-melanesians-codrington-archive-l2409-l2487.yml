    age and sex.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Except for the mother's brother, blood relations of the ascending generation
    are called father and mother; the generation above is generally called kukua except
    for the specified tumbu relation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man's children, his brother's children, and his cousin's children are treated
    as dale, while his sister's child is tumbu; a woman similarly treats several related
    and affinal children as her children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Husband and wife are tau; vungo is used for in-law relations across generations,
