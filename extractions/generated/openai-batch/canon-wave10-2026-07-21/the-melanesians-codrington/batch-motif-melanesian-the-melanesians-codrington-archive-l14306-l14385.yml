canonical_text:
  quote: ''
  summary: The passage catalogs Melanesian games, toys, simple acting, and whistling
    practices, including scoring with pigs, identity guessing with a door-shutter,
    cat's-cradle, projectile games, surf-boards, counting games, rainbow-cutting play,
    kites, bull-roarers, toy battles, hoops, tops, and whistled names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In waliweli tambagau, two parties sit opposite one another in moonlight while
    a man or boy holds a house door-shutter before him and the other side guesses
    his name; pigs are counted according to success or failure, and women play the
    same game among themselves.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists hunt-the-slipper-like play, hiding canarium almonds, and
    cat's-cradle with many figures as games in the islands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Projectile and target games include boys tossing a rough ball on sticks, throwing
    and dodging spears or sticks, throwing native oranges, archery practice, throwing
    at a tree or mark, and banana trunks used as archery targets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Surf-boards are used in the Banks' Islands and Torres Islands, and racing
    to reach an object first is named in the passage.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Counting is made into a game by arranging strokes on sand or a board in figures
    representing numbers and counting with a finger to a whistled tune; in Florida,
    fingers are stuck into sand according to a counting song from Alite.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Boys sitting in a narrow ring toss another boy from side to side while he
    stands stiffly like a log of wood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a rainbow is seen, Banks' Islands children play at cutting off its end,
    with the stated result that if they cut it short there will be no more rain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man may imitate another person's voice and gestures, the gait of a cripple,
    the fury of an angry man, or pretend to be a woman for the amusement of a crowd.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kites used elsewhere for fishing are used as toys in the Banks' Islands and
    New Hebrides, have a season during garden clearing for planting, and are steadied
    by a long reed tail.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bull-roarer has a superstitious character in the Mysteries at Florida,
    is used elsewhere to drive away a ghost or make a mourning sound after death,
    and is also a common plaything.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Toy battles are made by tying dry cassia seed-pods between strips of bamboo,
    and children make a broad hoop from a sago frond and set it running downhill.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Tops in the Solomon Islands are made from a palm nut and wooden pin and spun
    by pulling apart a doubled string wound around the shaft; a similar top is reported
    for Pitcairn Island children of half Tahitian descent.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Whistling is said to have been little used for producing a tune, though songs
    might be whistled without words, and in the Banks' Islands a man's name could
    be whistled to call him.
  category: speech
  evidence_refs:
  - ev:11
