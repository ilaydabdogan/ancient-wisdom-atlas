canonical_text:
  quote: ''
  summary: 'The passage first explains a belief about deadly arrows whose power is
    attributed to the dead person whose bone forms the arrow-head, contrasting native
    magical explanation with European misunderstanding as corpse poison. It then surveys
    Melanesian tools and implements: stone and shell adzes, names transferred to iron,
    shell and stone working tools, lack of pottery in the islands under discussion,
    wooden dishes and bowls, stone-boiling, decorated bowls and pestles, mat-making,
    and Santa Cruz looms compared with those in Caroline, Philippine, and Borneo contexts.'
  language: English
  quote_policy: summarized
