canonical_text:
  quote: ''
  summary: 'The passage describes sickness and healing practices in several Melanesian
    settings: Wango beliefs about ''adaro ghosts fighting over sick persons or shooting
    men with fish; Santa Cruz treatment of sickness as the work of an offended duka
    mediated by a mendeka; Banks'' Islands gismana practices involving mana, extraction,
    charm-water, and soul-recall; and a Fiji footnote describing similar expulsion
    of disease-causing spirits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Wango, ghosts called 'adaro were believed to fight one another over sick
    persons with spears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person with a grudge could pay a wizard to bring an 'adaro to harm another
    person, while the threatened person or friends could pay another wizard for a
    stronger 'adaro.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sick person's death, sickness, or continued health was said to depend
    on the outcome of the unseen ghost battle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sea-haunting ghosts were believed to shoot men on reefs or in canoes with
    fish, and a flying-fish or gar-fish striking a man was interpreted as a fatal
    'adaro shot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sick persons were treated with ginger, roots, leaves, and water over which
    a charm had been muttered to give healing power from an 'adaro.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Santa Cruz, sickness was attributed to an offended duka, and a mendeka
    doctor with malete and a duka of his own was called to the sick person.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mendeka announced the duka's arrival, gave the duka's reason for the sickness,
    directed satisfaction to be made, and received a fee.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: If a Santa Cruz patient recovered, a pig was given for the duka and a portion
    was placed before the stock representing him; if the patient died, another hostile
    duka was blamed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A mendeka could treat a duka's shot by moving an arrow-head down into the
    sick person's foot with herbs, coconut juice, singing, and muttered charms, finally
    bringing out a tree-fern splinter from the sole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Santa Cruz treatments also included bitter leaf juice and herbs applied to
    local pain, but the cure was attributed to malete rather than the natural properties
    of the medicines.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Banks' Islands, the gismana worked the cause of pain and disease downward
    and extracted it, using stroking, spitting, sucking, biting, herbs, leaves, and
    blowing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Banks' Islands treatment could include water from a hollow in a sacred stone
    or water in which mana-filled stones had been laid, with charms, songs, or muttered
    words conveying mana to remove disease.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Some Banks' Islands women knew charms to recall the soul of a sick child being
    drawn away by a ghost, blowing on the child's eyes and calling the attacking ghost's
    name.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Fiji footnote describes a native mission agent claiming power to detect
    disease-causing spirits, draw them to an extremity, pull them out, throw them
    away, and blow after them to prevent return.
  category: action
  evidence_refs:
  - ev:7
