canonical_text:
  quote: ''
  summary: The passage presents animal stories from Florida and Ureparapara. In one,
    a Heron trapped in coral is rescued by a Turtle after offering payment, later
    repays the Turtle by deceiving human guards and freeing him from captivity. In
    another, fish scratch one another and play hide-and-seek, explaining the thinness
    of the Sole and the grinning appearance of the Song fish.
  language: English
  quote_policy: summarized
