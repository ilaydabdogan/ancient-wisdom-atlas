canonical_text:
  quote: ''
  summary: The passage describes the gamal, a conspicuous non-dwelling building in
    villages of the Torres Islands, Banks' Islands, and Northern New Hebrides. It
    identifies the gamal as the clubhouse of the Suqe, describes its exterior ornaments,
    cooking areas, internal rank divisions, exclusive eating-places, degree emblems,
    and its relation to wider Melanesian men's public houses. It also notes asserted
    correspondences with New Hebridean, New Caledonian, Fijian, and Malay Archipelago
    public halls, while cautioning that the Suqe's origin and any link to the supernatural
    personage Wui Supwe are doubtful.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A conspicuous non-dwelling building is described as present in every village
    and group of houses in the Torres Islands, Banks' Islands, and Northern New Hebrides;
    in the Banks' Islands it is called a gamal.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Banks' Islands gamal is described as long and low, with side entrances,
    stone seats or platforms, low stone walls planted with dracaenas and crotons,
    pig jawbones and fish backbones under the eaves, and visible meal preparation.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some stone platforms with shrine-like small edifices, embers, and a grotesque
    human-form image are also identified as gamal; the edifice is a ranked man's eating-place,
    the fire cooked his food, and the image is the emblem of his degree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A newly built or ruined loftier end of a gamal is explained by the recent
    elevation of one or more men to a new degree, or by the death of high-degree men
    whose place lower-rank persons cannot enter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Inside long gamal buildings, divisions are made by log fences called tingtingiav,
    or fire-boundaries; each division has an oven and cooking appliances, with log
    pillows and mats as furniture.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The gamal is explicitly identified as a clubhouse, and the club is called
    the Suqe in the islands known to the author.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Across Melanesian groups, public buildings are described where men eat and
    spend time, young men sleep, strangers are entertained, canoes may be kept, images
    are seen, and women are generally excluded.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Suqe is said not to be connected with secret societies of ghosts and not
    to be a secret society of the same kind; its origin is unknown.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:9
  text: The name Suqe is said to be the same as the name of the supernatural personage
    Supwe, but the passage states that any real connection is doubtful.
  category: speech
  evidence_refs:
  - ev:9
