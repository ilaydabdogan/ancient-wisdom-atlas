  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The charms for making the arrows are described as known only to a few people
    whose business it is to make them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage cites a young man at Omba who made arrows from his brother's bones
