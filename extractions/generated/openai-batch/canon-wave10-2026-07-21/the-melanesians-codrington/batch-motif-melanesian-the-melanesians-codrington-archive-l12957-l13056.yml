  quote: ''
  summary: The passage discusses arrows called poisoned in several Melanesian island
    groups. It contrasts external reports denying toxic poison effects with reported
    native explanations that attribute the arrows' efficacy to human bone points,
    ghosts' mana, charms, and burning preparations smeared on the weapon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Medical and administrative reports cited in the passage state that recorded
    poisonous effects from the arrows were not known and that locked-jaw was not attributed
    to poison on the arrows.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that, in the native explanation reported by the author, the
    arrow point is a dead man's bone and therefore has mana.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bone point is described as tied on with powerful mana charms and smeared
    with hot or burning material prepared and applied with charms.
  category: action
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:4
  text: After the wound is made, the passage says the fatal effect is thought to be
    aided and carried on by the same magic that empowered the weapon.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:5
  text: Arrows called poisoned are reported in the Solomon Islands, Santa Cruz, the
    Banks' Islands, and the New Hebrides.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Torres Islands and Lepers' Island, arrows used for fighting are described
    as not poisoned but still belonging to the same class as poisoned arrows and as
    being valued, trusted, and feared.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The arrow structure is described as a reed shaft, a foreshaft of hard wood,
    tree-fern, or palm, and a point of human bone, with the parts fitted together
    and bound with fine string or fibre.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage contrasts Santa Cruz arrows as heavier weapons with Torres Island
    arrows as slighter weapons; one is called poisoned and the other not, but both
    are said to be equally deadly in native estimation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Human bone is said to give the arrow its efficacy in native opinion; any dead
    man's bone will do because any ghost has mana, while the bone of a powerful man
    is more valued.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The maker sings or mutters charms while tying the bone to the foreshaft, and
