canonical_text:
  quote: ''
  summary: 'The passage describes early missionary and European contact with Melanesian
    islands and reports how some islanders first interpreted white visitors: as ghosts,
    as returned brothers of Qat, or later as spirits or demons. It also describes
    a Banks'' Islands cosmography bounded by ocean and sky, fears that strange beings
    would bring harm, and the author''s comments on disease, kidnapping, and social
    disruption after contact.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bishop Selwyn began missionary voyages in 1849; Bishop Patteson became acquainted
    with Florida and Ysabel in 1861; the present writer first sailed in the Mission
    vessel in 1863.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that unknown lands and unlike peoples were expected by later
    discoverers but were strange to the natives described in the passage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Banks' Islands example, the world was believed to consist of the Banks'
    group and nearby islands, with ocean around them and the foundations of the sky
    as an outer limit.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first vessels remembered by these islanders were whalers, which they believed
    did not come from any country but were made out at sea.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The voyagers were judged not to be men because, if they were men, they would
    be black; they were identified as ghosts of men who had lived in the world.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Mota, some natives said the Mission party were the returned brothers of
    Qat, while others maintained that they were ghosts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: When Patteson entered an empty house whose owner had recently died, this was
    taken to show that he was the dead householder's ghost and knew his home.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After brief acquaintance, white visitors were no longer considered ghosts,
    but were still not thereby considered men; they were conjectured to be spirits
    or demons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says these nonhuman beings were thought powerful and mischievous,
    possessing wonderful things but probably bringing disease and disaster.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Santa Cruz people reported that elders said the strange beings would bring
    only harm and should be driven away; arrows were thought unable to do much harm
    to them because they were not men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author says European contact brought new diseases, weakened social bonds,
    and kidnapping, and links returned labourers with the spread of diseases in the
    islands.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
