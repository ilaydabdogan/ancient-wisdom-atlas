literal_observations:
- id: obs:1
  text: In Mota, a repeated tamate cry signaled that members of the Great Tamate were
    out and that ordinary movement and business stopped until the society was satisfied.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Great Tamate had forbidden use of bow and arrow in private quarrels; a
    man who took up his bow in anger atoned with a pig and quiet returned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Banks and Torres Islands, these societies are called “The Ghosts,”
    and in the Torres Islands every man is said to belong to four or five.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The tamate liwoa of Mota is described as present everywhere, while the Qat
    is found throughout the Banks Islands, has a distinctive dance, and lacks a permanent
    lodge or club-house.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tamate associations use leaves or flowers as badges, especially croton leaves
    and hibiscus flowers, and the part of the head where the flower is worn marks
    membership.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wearing a tamate badge without membership is an offence against the society
    and is punished according to that society’s power and position.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For Nipir, a hibiscus flower over the forehead is the badge; an unauthorized
    wearer is publicly signaled, forfeits a pig, is beaten, and must undergo regular
    initiation with entrance fees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An origin story says a woman received from a ghost seen in a tree an image
    with the hat and cloak of a tamate, hid it behind a partition, and admitted men
    to view it for payment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the origin story, men who learned the secret took the image, made a lodge,
    were taught by the image or ghost how to make the dress, and established the first
    tamate association with later exclusion of women.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Many minor associations are local and often named after birds; new societies
    may be founded around a chosen object or symbol, such as the “Norfolk Island Bird.”
  category: relationship
  evidence_refs:
  - ev:7
