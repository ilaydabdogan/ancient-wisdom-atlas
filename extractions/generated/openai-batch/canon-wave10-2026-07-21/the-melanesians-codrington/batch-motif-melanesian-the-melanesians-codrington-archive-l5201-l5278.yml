canonical_text:
  quote: ''
  summary: 'The passage describes ranked male societies in Omba and Whitsuntide Island:
    their clubhouses, ranks, ovens or eating divisions, rank advancement through pigs,
    mats, feasts, names, patronage, and kin-based reciprocal exchanges. It also notes
    the absence of initiation in Omba and compares local terms and practices with
    Banks'' Islands and Suqe usage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Omba, the Huqe is active, and a gamali is described as necessary for a
    man to eat in.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Omba Huqe has four ranks, corresponding to four divisions in the gamali:
    toa, moli, levusi, and vire.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members must progress through ovens within a rank before passing to the next
    division.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man who reaches vire may continue making feasts and taking new names, becoming
    a greater man each time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Higher ranks involve assumed names that show rank, though such names are not
    commonly used in ordinary address.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Age is said not to determine entrance or rank advancement; pigs and mats are
    the required payments.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage explicitly says there is no initiation in Omba Huqe, and that
    all males except very little boys are members who eat in the gamali.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A boy begins with a fowl, which buys the first toa step; through multiplication
    and exchange of fowls for a young sow, property increases for further advancement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Higher Huqe ranks confer power because those who hold them can keep back others
    who wish to rise and must have their goodwill secured.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rule keeping each man to his own oven is less strict than in the Banks'
    Islands; downward eating is allowed, while upward encroachment incurs a pig fine.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'Entrance follows a patron system like that of the Banks'' Islands: a patron
    introduces the new member, makes his hiqe, and gifts are substantially reciprocal.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The proper patron is from the same family division, such as the mother's brother
    or a brother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: In an example, a father buying a boy up to moli first gives a pig to the boy's
    waivung as acknowledgment that the father's side is intruding on the mother's-side
    division.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The boy's advancement involves a pig feast, return gifts of mats from those
    who receive pig portions, a hundred-fathom mat from the person taking the head,
    return mats to the father, mats to the moli, and additional feasts from moli and
    maternal-side friends.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: At Araga in Whitsuntide Island, Loli is said to replace the word Suqe, while
    the institution is described as the same.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: At Araga, all males are members in practice, and wherever there is a dwelling-house
    there is also a gamal.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: Araga Loli has twelve divisions with ovens called matan gabi; the passage
    lists the first five divisions.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:18
  text: The first five Araga steps include youth, the oven of ten tusks, ma votu,
    the oven of the erythrina leaf badge, and icorla, a stone-wall seat restricted
    to persons of that rank or higher.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The first five Araga steps are inferior steps that fathers try to buy for
    their boys as soon and as quickly as they can afford.
  category: action
  evidence_refs:
  - ev:8
