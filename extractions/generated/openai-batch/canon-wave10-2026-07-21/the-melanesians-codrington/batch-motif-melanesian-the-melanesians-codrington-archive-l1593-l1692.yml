canonical_text:
  quote: ''
  summary: The passage describes Melanesian kin divisions and marriage regulations
    in Mota, Aurora/Maewo, Araga/Pentecost, and Omba/Lepers' Island. It records origin
    accounts in which a cowry shell becomes the first woman who divides men into social
    categories, and in which Tagar makes two male humans before a yam tuber transforms
    one into a woman whose two daughters become ancestors of the two Omba divisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Mota, people belong to one of two veve or 'sides of the house'; marriage
    does not move either spouse to the other's side, and children belong to the mother's
    side.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Mota, a man's children are not counted as his sogoi kindred; his sister's
    children are described as his nearest relations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Adoption in the Banks' Islands is common; if an adopted child later learns
    he has been raised on the wrong 'side of the house,' he may leave his foster parents
    for his own sogoi, causing grief and bitterness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Aurora/Maewo, an origin story says the first woman was a cowry shell that
    turned into a woman and divided men into husbands, brothers, fathers, and maternal
    uncles according to current arrangements.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Aurora/Maewo, one family is named for the octopus, wirita; the passage
    says they do not claim descent from the octopus and eat it freely.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If someone from another family wanted octopus for food, he would take a member
    of the wirita family to Bugita beach to call out the request, after which many
    octopuses would be taken.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another Aurora/Maewo family, named 'At the Wotaga' from a home near a fruit
    tree, would not bring up a light-coloured child because they thought they would
    die if such a child were among them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Araga, Pentecost Island, irregular intercourse within the same kin is punished
    by destruction of the offending side's gardens by the other side; same-kin marriages
    are despised but may stand after money and pigs are exchanged.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Omba/Lepers' Island, the two divisions are called 'bunches of fruit,' as
    though members hang on the same stalk.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: An Omba story says Tagar first made two male humans; one threw a qevu yam
    tuber at the other, who immediately turned into a woman and cried that many men
    should die because of women.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The transformed woman had two daughters who quarreled; one Omba division sprang
    from one daughter and the other division from the second daughter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Omba adoption across the two 'bunches,' true kindred may be concealed until
    marriage time, when it is revealed to prevent marriage within the kin.
  category: sequence
  evidence_refs:
  - ev:9
