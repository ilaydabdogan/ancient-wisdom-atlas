canonical_text:
  quote: ''
  summary: 'The passage describes Florida Matambala secret-society proceedings: initiated
    men keep candidates near beach houses, construct and display tall bamboo and bark
    ghost images called tindalo, conceal their manufacture from women and uninitiated
    people, burn the images, teach initiates only that the apparitions are made by
    men, and mark candidates by tree-clasping and fire-stick branding as Siko''s men
    or messengers. Siko and ancestral ghosts are said to be believed to have taught
    and assisted the rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Initiated people occupy houses on the beach during the proceedings and bring
    friends who are to be admitted.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Candidates are not yet allowed into the vmutha or vunutha, described as a
    sanctuary or secret place in the bush where initiated men make bamboo structures
    called tindalo, the ghosts.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The tindalo structures include named forms: the Voi, a painted and ornamented
    bark screen, and the Koitaba-vunutha, large enough for eighty or a hundred men
    to carry it from inside.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women, children, boys, and uninitiated spectators view the displayed structures
    and are said to believe they are ghosts or ghost appearances because they do not
    know how they are made.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:5
  text: The Kuku is described as a wooden club with a bird's head, and candidates
    are frightened by bird-headed Kuku clubs as part of preparation.
  category: object
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:6
  text: The image-making process uses tall bamboos, vines, sago spathes, coleus mixed
    with wild orange juice, and turmeric, producing variegated and dazzling painted
    structures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Thirty or forty tindalo figures may be made in one place; they are conical
    and moved by men inside them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the spectacle, the men take the tindalo images back into the vunutha
    and burn all the images with fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The uninitiated are called ielegai, and the neophytes are called the new Matambala.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The knowledge communicated is described as limited to the fact that the acts
    are done by men and not by ghosts; no esoteric doctrine is taught beyond the making
    of the images.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Matambala members are said to believe that Siko, now a tindalo, taught the
    image-making and proceedings, and that Siko, his companions, and predecessor ghosts
    provide supernatural assistance and are invoked with sacrifices.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the initiation mark, the candidate clasps a tree and is touched in six
    places with a fire-stick on shoulders, loins, and buttocks; after branding, candidates
    are told they are Siko's men or messengers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'Admission has no age limit: grown men, boys, young children, and sucklings
    may be made Matambala; milk is obtained from women for infants who cannot leave
    the sacred precincts and whom women cannot visit.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: New members spend time in beach houses while figures are built in secret places
    in the wood, are threatened with death if they reveal the secrets, and remain
    away from home for three months.
  category: sequence
  evidence_refs:
  - ev:9
