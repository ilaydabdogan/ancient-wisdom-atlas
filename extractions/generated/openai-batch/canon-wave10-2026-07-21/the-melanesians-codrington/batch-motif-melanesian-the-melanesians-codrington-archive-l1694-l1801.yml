canonical_text:
  quote: ''
  summary: The passage discusses Melanesian exogamous kin divisions, the absence of
    remembered communal marriage, feast-related sexual disorder as illegitimate rather
    than customary, and kinship terminology. It cites stories in which Qat makes Iro
    Lei live as his own wife, Qat’s brothers try to carry her off, and Qat makes male
    and female humans and assigns wives. It then analyzes plural Mota terms for mother
    and spouse, compares related island terms, and explains how near-blood marriages
    may be lawful under matrilineal exogamy but are still discouraged.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes a system dividing the population into strictly exogamous
    kins, figured as one side of the house and the other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people are said to have no memory of a time when all women of one side
    were common wives to men of the other side, and no occasion on which women become
    common to men outside their kin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sexual license at a feast is described as disorderly and illegitimate; a powerful
    feast-giver may either make a festive concession against quarrels or require good
    behavior.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that stories of the creation of humankind, especially of
    woman, represent individual marriage.
  category: other
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Qat wove Iro Lei with pliant rods, made her live, and intended her to be his
    own wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Qat’s brothers tried to carry Iro Lei off for themselves; the passage says
    this was described as stealing her, not as claiming a right.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Qat made men, male and female, and assigned each man his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Mota terms for mother and for husband or wife are discussed as plural
    forms, including ra veve for mother and ra soai for husband or wife.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The mother is explained as representing the kin, as if the child were brought
    into the world for the whole kindred rather than only by an individual woman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The plural spouse term is explained as indicating a composite married body
    made up of men on one side and women on the other; Mota speakers are said to recognize
    the meaning while denying that it represents a current fact.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Strict exogamy by kin can leave marriages open between people close in blood,
    because descent is counted by the mother and a man is not of kin to his own children
    or his brother’s children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says paternal blood connection is not forgotten, and marriages
    between near blood relations are discouraged even when lawful under kin rules.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: Children of a brother and sister in Mota may belong to different veve and
    so be marriageable by kin rule, but the match will not be made and such a marriage
    would be said to go wrong.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Florida and adjacent Solomon Islands are introduced as examples of populations
    divided into more than two exogamous kindreds, with six such divisions in Florida.
  category: setting
  evidence_refs:
