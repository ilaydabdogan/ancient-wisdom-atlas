canonical_text:
  quote: ''
  summary: The passage describes omens in several Melanesian settings, including bird
    cries, unusual animals indoors, snakes, and kingfisher cries before battle. It
    then describes Banks' Islands beliefs about talamaur, a vampire-like power gained
    through corpse-eating and ghost communion, and about uqa, a mysterious personal
    force that can sicken others and be compensated for or removed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An omen is described as a spontaneous manifestation or warning by supernatural
    power, not obtained through divination.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Saa, the small bird called wisi has a cry meaning 'No' and other notes
    compared to a human voice; its sounds may be heard as warning or encouragement
    by travelers or as answers to questions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A frog or other creature not usually found indoors, when seen in a house,
    is treated as an omen; if it comes and cries, people expect crying for a death.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The rare snake called mati e sato is described as about ten inches long, glistening
    like gold, smooth, slippery, and very resplendent when grown.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the mati e sato is seen in a house it is taken as a sign of death; if running,
    violent death; if quiet, death by sickness.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the venomous snake an is seen in a house it is taken as a sign of death,
    fighting, or misfortune; coiled, it signifies quiet death; running, violence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: When beginning to build a house or canoe or clear a garden, a man may call
    aloud; if something remarkable appears, the work is expected to be interrupted
    by death or war, while no appearance means all will be well.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The kingfisher's cry is described as ominous; in Leper's Island, a cry to
    the right before battle foretells victory, while a cry to the left foretells failure.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Banks' Islands, a man or woman could obtain a vampire-like power from
    a morbid desire for communion with a ghost by stealing and eating a morsel of
    a corpse.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The ghost of the dead person would join in close friendship with the corpse-eater
    and afflict anyone toward whom the ghostly power was directed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: An afflicted person would feel that something influenced his life and would
    dread a particular neighbor suspected of being a talamaur.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: When seized and tried in smoke from strong-smelling leaves, the suspected
    talamaur would call out the name of the dead person whose ghost was familiar,
    sometimes more than one name, and then the name of the afflicted person.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The name talamaur was also given to a person whose soul was thought to go
    out and eat the soul or lingering life of a freshly dead corpse.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: A story tells of watchers by a corpse who heard scratching and rustling at
    night; after a stone was thrown at the unseen thing, the woman called talamaur
    was found with a bruise and confessed that the stone had struck her while she
    was eating the corpse.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: A mysterious power called wuqa or uqa is said to belong to a man and can strike
    a stranger sleeping in his habitual sleeping-place or an associate who leaves
    him to sleep elsewhere.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: A person struck by uqa may rise weak and languid, or become worse if already
    unwell.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:17
  text: Although not classed as witchcraft, a man is held responsible for what his
    uqa does, must pay money to the injured person, and can remove the malignant influence
    by an act of will.
  category: sequence
  evidence_refs:
  - ev:14
