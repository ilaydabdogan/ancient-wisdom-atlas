  summary: The passage introduces the study of Melanesian religion by emphasizing
    difficulties of definition, language, missionary and trader misunderstanding,
    outsider preconceptions, and unreliable questioning. It then states that Melanesian
    religion is pervaded by belief in a supernatural power or influence called mana.
  language: English
  quote_policy: summarized
literal_observations:
