    while later acknowledging that some dances and songs are innocent or not religious.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some non-Christian natives are said to speak reservedly about matters that
    still have sacred character for them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage gives examples of pigeon English labels using the word 'devil'
    for graves, dancing grounds, drums, and dancing clubs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note states that belief in a devil as an evil spirit has no place in the
