canonical_text:
  quote: ''
  summary: 'The passage describes the Qeta institution on Araga/Pentecost: boys enter
    over a stick, may have the malo girdle string broken and enter naked, are secluded,
    blackened with charcoal, fed small bites, taught a song and dance, restricted
    from washing and certain foods until yam harvest, then wash and eat at the beach,
    return to villages, and take tari-prefixed names. The passage also states that
    no esoteric knowledge or intercourse with ghosts or spirits is communicated, though
    the master may make prayers and offerings for success.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a man's social consequence depends greatly on membership
    in important clubs, and that an outsider could not be a person of consequence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of good social position is described as securing the same position for
    his son by entering him early in the clubs to which he himself belonged.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says a neophyte expected before initiation to join company with
    departed ghosts, and after being informed enjoyed deceiving later entrants and
    benefiting from their pigs and money.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Qeta rites in Araga/Pentecost are held at irregular intervals when enough
    candidates come from a group of villages, under the management of one or more
    great men who teach songs and dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The meeting place is a tapu place where small houses are built for the boys
    during the first part of seclusion.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Boys of all ages are initiated, often around the time of putting on the malo;
    putting on the malo and entering Qeta are described as necessary life steps, and
    the entrance payment is a mat from the father or guardian.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the beginning, initiated members assemble, women keep away, a stick is
    laid on the ground as the entrance mark, and two companies of initiated men sing
    within the mark.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A boy enters by stepping over the stick; if he already has a malo, the girdle
    string is unexpectedly broken so that the malo falls, while a child too young
    to walk is carried over by his father or sponsor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After entry, neophytes stay in houses except when eating, singing, and dancing;
    they receive a fresh malo, have their bodies blackened with charcoal, and wear
    no ornaments.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The initiated feed the boys by giving each a bite, eat their own food privately,
    and teach the boys a song and dance; the passage says no other secret knowledge
    is communicated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The seclusion lasts about five months, from yam planting until the harvest;
    after the first three days many initiated men leave, and boys live in small houses
    near gardens while men feed them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: During seclusion the boys are not allowed fish or shell-fish, the beach is
    made gogona and unapproachable for them, and they are not allowed to wash, so
    their bodies become very black.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When the first yams are dug, the boys assemble, go to the beach to wash and
    eat, women come to look at them, and then they return to their villages.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: After returning, the boys are said to have become tari and take names with
    the tari prefix; the passage adds that the Qeta appears to involve no intercourse
    with ghosts or spirits, though its master makes prayers and offerings for success.
  category: sequence
  evidence_refs:
  - ev:9
