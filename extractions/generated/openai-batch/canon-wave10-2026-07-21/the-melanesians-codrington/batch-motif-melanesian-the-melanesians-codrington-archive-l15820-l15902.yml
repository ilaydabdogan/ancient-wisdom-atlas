canonical_text:
  quote: ''
  summary: The passage continues a tale of two brothers following floating fruit to
    its source. The elder, Molgon, leaves the younger, Molwor, and eats with Roprialal,
    while repeatedly asking to share leftovers with his brother. Molwor dies in the
    canoe from the sun, is revived by Molgon's tears, reproaches him, turns into an
    eel, and both brothers become stones in the water-course. The passage then begins
    the Mota story titled “The Ghost-wife,” in which a hungry mother finds and eats
    gaviga fruit during a famine, leaves seeds in her basket, and is questioned by
    her son.
  language: English
  quote_policy: summarized
