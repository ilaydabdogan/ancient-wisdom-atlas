canonical_text:
  quote: ''
  summary: The passage describes Melanesian beliefs and customs concerning sacred
    stones, weather-making stones, ghost-associated stones, protective and harmful
    portable stones, stones used with Tagaro’s name, roadside heaps, path stones,
    pools inhabited by spirits, and sacred trees including banyan, casuarina, and
    cycas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Weather-doctors use stones in rites to make sunshine, including smearing a
    standing stone with red earth or preparing a round sunstone with red braid, owl
    feathers, a spell, and placement on a high tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stone representing the sun may be laid on the ground with white rods radiating
    from it as beams.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Stones called tamate gangan, glossed as “eating ghost,” are said to contain
    the presence of a ghost and to draw out a person’s soul if his shadow falls on
    them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tamate gangan stones are set in houses as guards, and a person sent to the
    house calls out the sender’s name to avoid being harmed by the ghost.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some ghost-connected stones are put under a pillow so that dreaming of another
    person is believed to cause that person’s death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Stones called tangaroa are carried in a bag or hung in a house and are credited
    with causing later accidents to people who meddle with the owner’s property.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Other named stones are swung in an invaded place to remove invaders’ courage,
    worn as neck amulets for safety, used to improve shooting, or taken to bed by
    women hoping for children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some stones connected with sacrifices are small and portable; if lost, their
    owner calls to ghosts to restore them, though the stone’s sanctity is associated
    with spirits rather than ghosts.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: On Lepers’ Island, sacred stones in or beyond the sacred spot where Tagaro
    is invoked have mana and are used for fighting, producing food, and causing crop
    failure, each with an appropriate charm using Tagaro’s name.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In garden planting on Lepers’ Island, young coconut juice is sprinkled with
    charms on the ground and coconut shells are set at the sides; the passage distinguishes
    this from the stone uses.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At Valuwa, travelling strangers cast stones on a roadside heap, explained
    locally as putting one’s day on the heap and as a count of visitors.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: At Pun, strangers add gathered fruits to a heap, also described as a local
    custom showing visitors.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Between Valuwa and Motlav, travellers kick one of two stones and recite a
    formula asking the destination to be near and the place left behind to be far.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: In the Banks’ and Solomon Islands, people throw sticks, leaves, or stones
    on heaps at steep descents or difficult paths, saying they throw away fatigue
    while denying that it is prayer or offering.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Pools in streams are sacred in the Banks’ Islands because of the presence
    of a spirit; at Valuwa, looking into one deep hole is feared because a reflected
    face would allow the spirit to take the person’s life.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:16
  text: Trees in sacred places are sacred; a banyan may harbor a sacred snake identified
    as a spirit, while casuarina and cycas are described as having inherent sacredness.
  category: relationship
  evidence_refs:
  - ev:16
