  quote: ''
  summary: The passage describes private offerings to tindalo, martial rites involving
    a keramo spirit, garden rites for vigona, ritual taboos and harmful garden magic,
    and several cases or descriptions of human sacrifice, including Dikea’s offering
    of a captive boy to Hauri and a comparison of Bugotu practices with those of Florida.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Individuals offer private sacrifices in a sacred place to a familiar tindalo,
    using leaves, bark, and vines pleasing to that tindalo and offering food in the
    fire to maintain favor or obtain something.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man may have a keramo, described as a tindalo of killing, to help him in
    fighting or slaying a private enemy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before fighting, the man pulls up a ginger-plant to judge his chance of success,
    sacrifices, carries ginger and leaves on his shield, belt, and right armlet, curses
    his enemy by the keramo, and if he kills the enemy asks the keramo for mana.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that manslaughter without help from a tindalo would endanger
    the manslayer because the slain man's ghost would have power over him unless a
    stronger keramo's mana were on his side.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A keramo relic or amulet may be a tooth or hair in a small bag, or only a
    stone; it may be hung around the neck or kept in the house and called a man's
    keramo.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vigona are said to influence weather and gardens, and a man who does not know
    one may pay a specialist to perform a rite with mashed food while calling the
    vigona to eat and give mana to the garden.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The garden rite includes digging holes at the four corners and burying leaves
    or stones to give ghostly power and protection to the garden; growing yams are
    also tied with creeper and wood loved by the vigona.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Garden tindalo are not to be offended by men entering after eating specified
    meats, fish, cuscus, or shell-fish; men training yam vines sleep near the gardens
    and avoid their wives, since violation would spoil the garden.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man with his own vigona can try to damage another man's garden by placing
    putrid things there to offend that garden's vigona; the crop outcome is treated
    as showing which vigona is stronger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the crop is dug, a portion of the fruits is burned in sacrifice to the
    relevant vigona.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Human sacrifices are described as occasional; there is no sacrificial feast
    on the flesh, but small pieces may be eaten by persons seeking fighting mana or
    by elders for a special purpose.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A crime or alleged crime may be used as an occasion to kill and offer a person
    to a tindalo; Dikea condemned Gisukokovilo for stealing tobacco, and grown lads
    of Handika ate bits of him cooked in the sacrificial fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In 1886 Dikea vowed sacrifice to Hauri after one wife proved false and after
    his son died; he dug up the son to see him again and later placed the son's skull
    in his sacred place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Savo people sold Dikea a lame and nearly blind captive boy from Guadalcanal
    for twenty coils of money; Dikea dedicated him to Hauri, followers killed him,
    the head was kept with Dikea's skulls, the legs were sent away, and none of him
    was eaten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Bugotu sacrifices in Ysabel are described as the same as those of Florida;
    coastal dwellers sacrificed human victims, said the practice came from farther
    west, burned bits from an enemy's head, and could bind a captive at a tindalo
    burial-place.
  category: sequence
  evidence_refs:
  - ev:8
