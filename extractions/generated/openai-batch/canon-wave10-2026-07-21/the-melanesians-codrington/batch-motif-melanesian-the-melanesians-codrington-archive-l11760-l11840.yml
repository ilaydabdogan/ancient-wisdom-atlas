  quote: ''
  summary: The passage describes Panoi as a ghostly village or afterlife in the Banks
    Islands tradition, including the state and activities of ghosts, distinctions
    among kinds of dead, their relation to the living, and accounts of living persons
    or souls descending to Panoi to see the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Panoi is described as having day and night and as resembling a beautiful festival
    place with flowers, coloured leaves, dancing, drumming, and singing.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A newly arrived ghost waits outside the ghostly village until strength returns,
    and the ghosts make a dance in his honour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ghosts ask a new arrival whether he has come to stay; if the arrival has
    only fainted, this is discovered and he returns.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Life in Panoi is said to resemble earthly life but to be hollow and unreal,
    consisting of talking, singing, and dancing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Panoi lacks a gamal club-house, fighting, human authority, and vui spirits
    other than ghosts of men.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: A great man descends as a great man with ornamental finery, while funeral
    pigs and grave food do not descend as he does.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage distinguishes the dead man as famate and says he has the atai
    soul he had as a living man under different conditions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dead man's ornaments are present on his ghostly person only as their shadow,
    niniai; pigs and similar things are said not to have atai.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Those who died violent deaths are said to remain in separate fenced compartments
    according to how they died.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ghosts of those shot keep rattling the reeds of the arrows with which they
    were shot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ghosts in Panoi do not have the wider knowledge attributed to vui spirits,
    yet they are invoked in distress as if able to hear and help.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ghosts may come to earth when they please to see friends and property and
    may hear news from newly arriving ghosts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Ghosts with a home in Panoi are generally kindly to living people but may
    become angry and revengeful if friends or property are harmed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Ghosts are feared as dreadful to living people and are seen indistinctly,
    especially as eyes like phosphorescent fungi or something red.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: Life in Panoi is described as eternal, though some say there are two Panois,
    and the dead may die from the upper to the lower before eventually turning into
    white ants' nests.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: A woman seeking her recently dead brother perfumed herself with water in which
    a dead rat had steeped, pulled up a bird's-nest fern, and descended through the
    opened hole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The woman found Panoi, saw friends who did not discover she was alive, and
    found her brother lying in a house because he was too weak as a recent ghost to
    move about.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The woman's dead brother warned her not to eat anything in Panoi, and she
    returned.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: Molborbor of Valuwa is said to have descended bodily and seen his wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: A Motlav man was said to descend in sleep, with his soul going down while
    his body remained as in a trance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: The Motlav man claimed to visit recently dead people for payment and to be
    able to bring them back, but he did not bring any back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:22
  text: The Motlav man prepared for soul descent by washing with water in which a
    putrid rat, snake, or lizard had steeped.
  category: action
  evidence_refs:
  - ev:8
- id: obs:23
  text: Vanvanvegirgir of Motlav is said to have gone down to Panoi in his talegi
    soul and once took another man with him bodily.
  category: action
  evidence_refs:
  - ev:9
