canonical_text:
  quote: ''
  summary: The passage surveys Melanesian practices around birth, including couvade-like
    paternal restrictions, parental food and movement taboos, a Lepers' Island practice
    using a stone to recover an infant's soul, abortion and infanticide customs, and
    attitudes toward twins, including accounts that twins may be connected with ghosts,
    sacred places, or Tagaro.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A proper couvade is reported for San Cristoval, where a young father was found
    lying in after his child's birth in a context where the child follows the father's
    kindred.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Saa, both expectant mother and father observe food restrictions, and the
    father avoids pig's flesh, hard work, lifting, sea travel, and other movements
    believed to affect the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Banks' Islands, parents take only food considered safe for the infant;
    before her first child the mother avoids fish caught by hook, net, or trap, and
    after childbirth the father avoids heavy work and sacred places dangerous to the
    child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the New Hebrides, an expectant Araga father avoids sacred places and his
    house before birth, and after birth avoids shell-fish and beach produce because
    the infant would suffer ulcers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Lepers' Island, the father avoids exertion for ten days; if he goes away,
    he brings back a small stone representing the infant's soul, calls it home, puts
    the stone in the house, and waits for the child's sneeze as confirmation that
    the soul has not been lost.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Abortion is described as common and as procured for several stated social
    reasons, using plant juice in drink or physical twisting and squeezing of the
    foetus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In some places, old women of the village determined whether a newborn should
    live, and unwanted infants could be killed by stuffing the mouth with leaves and
    placing the body in a hole covered with a stone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Banks' Islands, an infant of the wrong sex or otherwise unwelcome could
    be choked at birth; male children were killed rather than female children, and
    female children were preserved for lineage and future marriage considerations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that there is generally no practice of killing one twin
    and no dislike of twin birth beyond the trouble of caring for twins; twins are
    liked at Saa and a source of village pride at Motlav.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Motlav, twins are not adopted away because this would spoil the pleasure
    of seeing them together and deprive them of their natural right to be together.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Florida, a suspicion about two fathers for twins is explained as a woman's
    trespass on the sacred place of a ghost whose power is connected with such births.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Lepers' Island, twins may be considered a gift of Tagaro; women seeking
    a child go to a sacred place hoping the spirit will give one, and sometimes two
    are given.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Malavaiboe, called Pig-twin, is described as the survivor of twin sons of
    Arusese and is expected to become a great man because Tagaro gave the twins to
    his mother when she asked for a child.
  category: attribute
  evidence_refs:
  - ev:8
