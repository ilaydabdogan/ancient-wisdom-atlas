  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Alite islet inhabitants were described as enemies of mainland neighbors,
    without gardens there, and as buying their main subsistence from Guadalcanal with
    money and ornaments they made.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The typical Melanesian dwelling-house is described with bent bamboo roofing
    over a ridge-pole, two main posts, low side walls, bamboo screens, hearth or oven
    features, hanging hooks, food bags, bowls, water bamboos, mats, and sometimes
    an inner reed-screened chamber.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The gamal club-house is described as constructed like a dwelling-house but
    larger and stronger, with side openings as well as end doorways.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Large canoe-houses such as oha and kiala are described as places where canoes
