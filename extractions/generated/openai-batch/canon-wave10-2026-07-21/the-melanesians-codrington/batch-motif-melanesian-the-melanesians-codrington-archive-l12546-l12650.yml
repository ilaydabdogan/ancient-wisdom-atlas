canonical_text:
  quote: ''
  summary: The passage describes a custom of taking a new canoe on visits with a large
    party that receives presents, gives an example involving Dikea's new peko, a nighttime
    signal, an ambush, and a head placed at the canoe's prow, then surveys island
    commerce at Rowa and Alite and describes domestic houses, club-houses, canoe-houses,
    stored feast objects, suspended jawbones and skulls, mangiie of the dead, and
    carved posts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A custom common to the Solomon Islands and the Eastern groups involved taking
    a new canoe out with a large party and receiving presents at places visited.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dikea, chief of Eavu in Florida, bought a peko named Lake, glossed as fire,
    and the canoe was kept hidden in a kiala until a head should have been procured.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dikea joined his brothers after seeing their fire-signal at night at the mouth
    of the Vula passage, bringing the new canoe as other canoes joined the expedition.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Hagalu the party ambushed Tibona, who was alone in a canoe; he dived to
    escape, but they caught and killed him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The party set Tibona's head at the prow of the new canoe and returned to Eavu
    with shouting and conch-shell blowing, while the women and children would not
    go out to see.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rowa inhabitants obtained much of their food from Saddle Island and Vanua
    Lava by carrying fish and locally made money in exchange.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports former beliefs that growing food at Rowa would cause famine
