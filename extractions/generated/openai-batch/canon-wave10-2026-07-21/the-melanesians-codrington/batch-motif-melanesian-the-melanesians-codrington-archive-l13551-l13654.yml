canonical_text:
  quote: ''
  summary: 'The passage first notes variations in dress and mat decoration in several
    Melanesian islands. It then describes media of exchange: shell currency, ornaments
    with exchange value, mat-money, feather-money, and related exchange objects. Mat-money
    is made, stored, blackened by fire, valued by age, color, folds, and length, used
    in transactions and for Suae Club advancement, and lent at interest. Feather-money
    in Santa Cruz is made from red parrot feathers and displayed at feasts; related
    feather or fur exchange braids are noted in other islands.'
  language: English
  quote_policy: summarized
