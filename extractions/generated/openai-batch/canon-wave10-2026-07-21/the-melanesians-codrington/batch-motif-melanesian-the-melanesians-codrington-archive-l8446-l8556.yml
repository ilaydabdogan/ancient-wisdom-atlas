canonical_text:
  quote: ''
  summary: The passage describes Melanesian beliefs and practices concerning serious
    sickness as caused by ghosts or spirits, especially ghosts of the dead. It details
    Florida and Ysabel procedures in which doctors, ritual objects, prayer-like speech,
    sacrifice, offerings, divination, and medicine-like treatments are used to identify,
    appease, or drive away the supernatural cause of illness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Practitioners of the described arts are said not to form separate classes
    or orders but to be mixed among the population.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The practices are said to work through the mana of spirits and ghosts, using
    media and secret words empowered by names.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Serious sickness is commonly attributed to ghosts or spirits, while common
    complaints such as fever and ague may be treated as natural.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that ghosts of the dead are generally invoked or blamed
    for sickness in many islands, including both causing and removing it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ghosts are said to inflict sickness because of offences such as trespass,
    because someone has sought their help with sacrifice and spells, or because of
    hostility toward the living.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Florida, illness is attributed to a tindalo, a ghost of power, and people
    may conjecture which ghost is responsible.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a sick person believes a dead relative has been offended, the patient
    or family may sacrifice and ask the tindalo to remove the sickness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A mane kisu, described as a doctor, may be called when the cause of sickness
    is uncertain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The doctor may bind leaves on the patient, chew ginger, blow into the patient's
    ears or skull area, call the tindalo's name, and ask it to remove sickness.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If one treatment fails, another tindalo or another doctor may be tried.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: An ill-wisher may be suspected of setting a tindalo to afflict or 'eat' the
    patient, and another more powerful tindalo may be engaged to drive it off.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some treatment includes herbs warmed in a coconut shell over fire, steam applied
    to the patient, infusions for cough, and massage, while efficacy is still attributed
    to the tindalo.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Ysabel, a doctor may suspend a stone or heavy ornament on a string and
    call names of the recently dead; the stone's swinging identifies the disease-causing
    dead person.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Ysabel doctor uses the same divinatory method to determine what offering
    is required, and the desired item is offered on the dead person's grave.
  category: sequence
  evidence_refs:
  - ev:8
