canonical_text:
  quote: ''
  summary: The passage describes feast-based rights to wear or display ornaments and
    rare objects, public celebration with oratory, pigs, money, songs, and mana-bearing
    objects, charms for attracting or deterring attendance, the head-anointing rite
    of Qat, Vovo feasts commemorating deliverance, and beliefs about Suqe rank in
    northern Maewo, including afterlife happiness in Panoi for those with pig-killing
    status and tree-bound suspension for those without it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain feasts or named performances grant rights to wear specific decorations,
    including a weiapup necklace, a hat, or a pig's tail in the hair.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man possessing a rare or foreign object, such as a white cockatoo from the
    Solomon Islands, might dance while exhibiting it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a feast, orators praise the giver, others display baskets of his money,
    decorated palako logs are carried in, pigs are sent to distant villages, crowds
    gather, and dancers, drummers, and women singers perform or compete.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man may prepare scented leaves and twigs with song, fire, chewing, puffing,
    and a shell trumpet to attract a multitude to a feast; an adversary may use a
    counteracting charm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The head-anointing of Qat uses a mixture that can make the head brilliant
    red, and another preparation makes a yellow colour.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fui Ro Som in the Story of Ganviviris is described as appearing with ornaments
    whose wearing-rights money could procure and with this head adornment.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Vovo feast commemorates deliverance, such as recovery from famine after
    a hurricane or recovery from a wound.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In northern Maewo, Suqe membership was valued for advantages after death,
    though the institution is described as nearly extinct there.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A soul of one with the proper Suqe-related pig-killing status may remain happily
    in Panoi, while the soul of one who has not killed a pig stays on a tree hanging
    like a flying fox.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At a son's birth, a father may give a pig in the son's name to begin his Suqe
    status.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Suqe rank also carries social standing; a man who has killed pigs properly
    may wear pigs' tusks, white shell-money, and valued leaves.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage reports that some people later rejected these beliefs as untrue
    and vain.
  category: speech
  evidence_refs:
  - ev:9
