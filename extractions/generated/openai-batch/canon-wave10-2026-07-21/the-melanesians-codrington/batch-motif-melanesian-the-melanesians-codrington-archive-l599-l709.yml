literal_observations:
- id: obs:1
  text: The passage identifies four principal island groups in the Western Pacific
    region called Melanesia and states that their inhabitants are connected by race,
    language, and customs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A boundary between Melanesian and Polynesian peoples is said to fall between
    Fiji and Tonga, while no comparable western boundary is drawn before the Asiatic
    continent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Two currents of influence are described as entering Melanesia: one from Polynesian
    islands of the East Pacific and one from the Asiatic islands of the Malay Archipelago.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The kava root is associated with the Polynesian current of influence, and
    the betel-nut with the Asiatic or Malay Archipelago current.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The work excludes New Caledonia and the Loyalty Islands and the larger southern
    New Hebrides, while focusing mainly on the Solomon Islands, Santa Cruz, the Banks
    and Torres Islands, and selected northern New Hebrides islands.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some islands within the field are said to be inhabited by Polynesian colonists
    from the East who retain Polynesian speech, although physical characteristics
    may have been reduced by mixture with neighboring Melanesians.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rennell and Bellona are described as physically Polynesian, and a Bellona
    youth is compared in name, color, tattoo, and speech to a Maori.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The discovery of the islands by Europeans is described as extending over three
    centuries and involving Spanish, French, English, and Dutch voyagers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mendana reached Santa Ysabel in 1567, and the passage says he and his command
    discovered and named several islands, giving the group the name Solomon Islands
    to mark or suggest a conjecture about the source of Solomon's riches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In 1595 Mendana discovered Santa Cruz and attempted a settlement that was
    abandoned after two months because of his death and sickness among the remaining
    crews.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Quiros in 1606 is described as intending to recover and colonize the Solomon
    group, but instead discovering the New Hebrides while believing he had reached
    the great Austral Continent.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Torres is said to have seen and named the Torres Islands after parting from
    Quiros, and Bougainville later added several islands to earlier discoveries and
    named a group the Great Cyclades.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
