canonical_text:
  quote: ''
  summary: 'The passage closes one story in which two boys lure and kill Walolo, a
    devouring snake, then burn a heap of snakes beneath a banyan-tree. It then gives
    the Aurora story of Basi and Dovaowari: Basi, whose mother is a great snake with
    a human head, marries Dovaowari; the snake mother moves into a ten-chamber house;
    Dovaowari arranges for the house to be burned during a feast, and Basi runs back
    into the fire so that she and her mother are burned together. The passage ends
    with a note about bodily remains said to possess mana.'
  language: English
  quote_policy: summarized
