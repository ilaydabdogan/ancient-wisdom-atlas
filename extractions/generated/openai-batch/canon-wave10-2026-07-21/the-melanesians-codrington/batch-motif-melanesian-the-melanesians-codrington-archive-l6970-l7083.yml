canonical_text:
  quote: ''
  summary: The passage gives Lakona and Mota accounts involving Qat, Marawa, and Qat's
    brothers. In the Lakona account, Qat and Marawa make human beings from trees;
    Qat animates his by dancing and drumming, while Marawa buries his and finds them
    decayed, explaining the origin of death. In the Mota account, Qat differentiates
    men from pigs, makes man from red clay, fashions the first woman, and later contends
    with envious brothers who try to gain his wife and canoe. Marawa appears as a
    powerful vui/spider who interferes with and then helps Qat, finishing his canoe
    and saving him from murder attempts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Qat and Marawa are said to dwell at Matan near the mountain Garat, where volcanic
    fires still smoulder.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Lakona account, Qat makes men by cutting dracama-tree wood into body
    parts, fitting the parts together, and working over a six-day period.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Qat sets a six-day period for the wooden figures to come to life, hiding them
    for three days and working to give them life for three days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Qat brings the figures out, sets them before him, dances to them, beats a
    drum, and observes increasing movement until they can stand by themselves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qat pairs each male with a female and calls the pairs husband and wife; the
    passage states that he made three women and three men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Marawa makes men and women from a different tree, tavisoviso, also working
    six days and animating them with drum-beating.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After seeing his figures move, Marawa digs a pit, lines it with coconut fronds,
    and buries the men and women for six days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Marawa uncovers the buried figures, he finds them rotten and stinking;
    the passage identifies this as the origin of death among men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Mota account, Qat first makes men and pigs in the same form, then makes
    pigs go on all fours and men walk upright after his brothers object.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Mota account says man was made of red clay from a marshy riverside at
    Vanua Lava.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The first woman, Iro Vilgale, is fashioned from rods, rings of supple twigs,
    and sago-palm spathes; Qat recognizes her life when he sees a smile.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Qat has a wife named Iro Lei or Ro Lei and no children; his brothers envy
    both the wife and Qat's canoe and conspire to obtain them.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: While Qat works secretly on a canoe, the chopped-away wood is replaced each
    day until he hides under a chip and watches a little old man with long white hair
    emerge from the ground to restore the chips.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The old man is identified as Marawa, the spider and a powerful vui; after
    Qat threatens him with a shell axe, Marawa offers to repair the canoe and finishes
    it with his nails.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: When Qat's brothers launch their canoes, Qat raises his hand and their canoes
    sink one by one; later he recovers them at night.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Qat's brothers attempt to kill him by tipping a prepared stone over him while
    he digs in a land-crab hole, but Qat calls on Marawa to take him to Ro Lei.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: The brothers later cut partly through a branch so Qat will fall while gathering
    nuts; Marawa again saves him.
  category: action
  evidence_refs:
  - ev:14
