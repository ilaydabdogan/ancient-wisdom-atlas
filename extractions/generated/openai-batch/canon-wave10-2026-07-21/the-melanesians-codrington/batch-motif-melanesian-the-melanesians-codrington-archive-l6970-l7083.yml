candidate_motifs:
- id: motif:1
  label: supernatural creator fashions and animates first humans
  taxonomy_refs:
  - culture_hero
  basis: Qat shapes human bodies from dracama-tree wood, animates them through ritual-like
    actions, and establishes male-female pairs; the Mota version also gives Qat a
    human-creation role.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The supplied taxonomy does not include a specific anthropogony category;
    culture_hero is used only for Qat's broader ordering and creating role.
- id: motif:2
  label: origin of death from failed burial of made beings
  taxonomy_refs: []
  basis: Marawa buries his animated wooden people for six days and finds them rotten
    and stinking; the passage explicitly calls this the origin of death among men.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is an origin-of-death motif, not necessarily a death-and-rebirth
    pattern.
- id: motif:3
  label: human-animal differentiation by creator correction
  taxonomy_refs:
  - culture_hero
  basis: In the Mota account, Qat first makes men and pigs alike, then changes pigs
    to go on all fours and men to walk upright after his brothers remonstrate.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The episode explains bodily difference rather than a full animal-origin
    cycle.
- id: motif:4
  label: first woman fashioned from assembled vegetal materials
  taxonomy_refs:
  - sacred_birth
  basis: Iro Vilgale is named as the first woman and is constructed from rods, rings
    of twigs, and sago-palm spathes, becoming recognizably alive when she smiles.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage describes fabrication rather than birth; the sacred_birth
    taxonomy reference is approximate and needs review.
- id: motif:5
  label: jealous brothers try to kill hero to seize wife and canoe
  taxonomy_refs:
  - stolen_beloved
  basis: Qat's brothers envy his wife and canoe, then attempt to kill him with a stone
    trap and a cut branch in order to seize them.
  evidence_refs:
  - ev:9
  - ev:13
  - ev:14
  confidence: medium
  cautions: The wife is targeted but not successfully stolen in the passage; the taxonomy
    link is therefore tentative.
- id: motif:6
  label: ambivalent nonhuman helper appears in old-man form
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Marawa is identified as a spider and powerful vui, appears as a little old
    man emerging from the ground, first undoes Qat's canoe work, then completes the
    canoe and later rescues Qat.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:13
  - ev:14
  confidence: medium
  cautions: The text identifies Marawa as the old man but does not explicitly narrate
    a transformation; shapeshifter is a cautious taxonomy association.
- id: motif:7
  label: magical canoe rivalry and sinking by gesture
  taxonomy_refs:
  - trickster_boundary
  basis: Qat secretly completes a canoe with Marawa's aid, makes his brothers' canoes
    sink by lifting his hand, and later recovers them after amusing himself with their
    mortification.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage does not frame the canoe as an ark or voyage vessel; the motif
    is limited to rivalry, display, and trickery.
