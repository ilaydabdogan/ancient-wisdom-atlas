  quote: ''
  summary: The passage describes preparation and restricted use of a narcotic pepper-root
    drink, the introduction and regional spread of tobacco, a memory of first ships
    being associated with ghosts and famine, and several practical methods of counting,
    tallying, and measuring by fingers, objects, and body lengths.
