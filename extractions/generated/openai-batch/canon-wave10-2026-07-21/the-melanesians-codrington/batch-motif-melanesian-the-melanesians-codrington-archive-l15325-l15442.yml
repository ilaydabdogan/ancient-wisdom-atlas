canonical_text:
  quote: ''
  summary: The passage contains the end of the Kamakajaku story, in which Kamakajaku
    reaches the Sun's children's village above, introduces fire for cooking, opens
    a taboo stone-covered hole in the sky, and is lowered back to Gaji. It then gives
    the Samuku story, where Samuku goes alive to Tuhilagi, the ghosts' place, after
    a quarrel with his wife. It also recounts the Mim people's dragging and distributing
    of yams through islands, explaining local yam size and abundance. The supplied
    excerpt ends with the beginning of a story on the origin of poisoned arrows, where
    the blind Muesarava shoots a pigeon and is angered when young men steal it from
    his oven.
  language: English
  quote_policy: summarized
