canonical_text:
  quote: ''
  summary: 'The passage describes marriage-related customs: compensation to a bride''s
    kin, movement of a bride to the bridegroom''s house, infant betrothal rites involving
    coconut liquid or water, upbringing of betrothed children, tattooing and clothing
    changes, bride-price negotiations with pigs and mats, wedding feasts and shared
    eating as union, elopement or unwilling brides, and avoidance or compensation
    concerning a woman''s former lover after marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bride's kinsman who feels hurt is expected to be compensated by a present;
    the passage frames this as connected with the loss of the bride's services rather
    than rights of intercourse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride is taken by female friends to the bridegroom's or his father's house;
    if unwilling she may be dragged, refuse intercourse, or run away, and a pig may
    settle the matter if she stays elsewhere.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Lepers' Island among people of consequence, infant betrothal is described
    as proper; a chief may secure a newborn girl for his boy with a present and feast.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In one infant betrothal rite, the boy puts a dracama leaf into the eye of
    a young drinking coconut and gives it to the infant's mother for the child to
    drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A cited Maewo/Aurora practice says a male child brought with bamboo water
    washes a newborn female child, after which the two are recognized as betrothed
    and grow up as man and wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the betrothed girl is about ten, the boy's mother takes her to teach
    household ways, and the children are temporarily brought up together.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the girl is older, her parents take her back for tattooing in lines over
    her body; after this she is normally clothed, wearing a para indoors and mats
    outdoors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women on both sides negotiate the price paid by the bridegroom's friends;
    the price varies by status and may include tusked pigs, ordinary pigs, and mats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the wedding day the young man's friends bring pigs, mats, and uncooked
    food; the bride's friends have cooked food, and the two parties eat together,
    completing the marriage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bride is carried to her new home on someone's back, wrapped in many mats,
    with palm-fans held about her face because she is supposed to be modest and shy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Formerly a house and food were prepared for the young couple, who ate together
    as a sign of union.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A girl may run away to one she loves, and he may keep her if he can satisfy
    her friends; if not, she may have to return, with suicide mentioned as a possible
    alternative.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Marriage-related reserve and avoidance are said to begin when the engagement
    is complete.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Florida, a woman who had a lover before marriage will not name him after
    marriage and will avoid meeting him in the path; her husband may demand money
    from the former lover.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A newly married husband may beat his bride to make her confess who her paramour
    had been.
  category: action
  evidence_refs:
  - ev:9
