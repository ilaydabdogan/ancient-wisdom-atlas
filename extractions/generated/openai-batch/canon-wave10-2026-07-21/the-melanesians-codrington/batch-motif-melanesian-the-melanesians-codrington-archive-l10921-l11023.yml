canonical_text:
  quote: "“Here appears a ship of the dead, almost alone in Melanesia.”"
  summary: The passage describes Melanesian funeral customs and beliefs about ghosts
    after death, including memorial offerings and property displays, haunting when
    bodies or heads are not properly treated, a Florida account of ghosts traveling
    by path and canoe toward Guadalcanal, a returned man’s report of being refused
    entry to the ghost canoe, and a Bugotu account in which ghosts travel to Laulau,
    are examined by Bolafagina, and may be admitted or destroyed according to bodily
    marks. It also describes chiefly burial, skull preservation, head-taking in honor
    of a dead chief, and sacrifices at the grave.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In Florida, the funeral of a chief or esteemed person is delayed for two days,
    followed by a funeral feast and the hanging of the dead man’s cloth, axes, spears,
    shield, and other property on his house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the funeral feast, a portion of food is thrown into the fire for the deceased
    with the call, “This is for you.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If food sticks in a mourner’s throat during the feast, it is treated as a
    portent that the person will die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dead man’s house and displayed belongings are left untouched as a memorial,
    not as objects intended to accompany him as ghostly possessions.
  category: object
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:5
  text: A dead man’s fruit trees may be cut down as a sign of respect and affection,
    because he ate from them while alive and no one else should have them after his
    death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Unburied bodies, taken heads, and dismembered remains are associated with
    haunting ghosts; ghosts of men whose heads were taken are seen without heads.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The departed are said to have an abode called Betindalo, while ghosts also
    haunt burial places, attend sacrifices, and are heard at night playing panpipes,
    dancing, and shouting.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Gaeta account, ghosts of Florida pass along a path through gardens
    to a point of land where they assemble, and their passage is heard as a twittering
    sound rather than seen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A canoe comes from Guadalcanal to take the assembled ghosts across to Galaga,
    where they land first on a rock and become aware that they are dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Galaga, a tindalo with a rod examines the cartilage of ghosts’ noses to
    see whether they are pierced; ghosts who pass have a good path, while those who
    do not must travel painfully and with difficulty.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Living men nearing Galaga by canoe have seen and recognized forms of the dead,
    but the forms disappeared when approached.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A Gaeta man who appeared to die revived and reported that he had traveled
    with ghosts toward the canoe, but a tall black tindalo forbade him to board and
    sent him back to the world.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: At Bugotu, the spirit leaving the dead person becomes a ghost; the ghost place
    is the island of Laulau, though ghosts also haunt graves and disappear when approached.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Bugotu ghosts fly through the air toward Laulau, alight first on certain rocks,
    and become aware of their sad condition there.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Living visitors to Laulau see rocks, vanishing human-like forms, kept paths,
    cleared bathing places, fish disappearing from trees overnight, and road marks
    removed.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:16
  text: On Laulau, ghosts go to a pool called Kolapapauro and present themselves to
    Bolafagina, the lord of the ghost place.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:17
  text: Ghosts cross a narrow tree trunk over the pool; Bolafagina examines their
    hands for a conventional frigate-bird mark that admits them to his company.
  category: action
  evidence_refs:
  - ev:14
- id: obs:18
  text: Ghosts without the required hand mark are thrown from the tree into the gulf
    beneath and perish out of their ghostly life.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:19
  text: When a chief dies at Bugotu, he is buried with his head near the surface and
    a fire is kept burning over it so the skull may later be preserved in the successor’s
    house.
  category: action
  evidence_refs:
  - ev:15
- id: obs:20
  text: After a chief’s death, an expedition obtains heads in his honor; the heads
    are placed on the beach and believed to add mana to the new tindadho.
  category: action
  evidence_refs:
  - ev:16
- id: obs:21
  text: The chief’s grave is built up with stones and sacrifices are offered upon
    it.
  category: action
  evidence_refs:
  - ev:16
