candidate_motifs:
- id: motif:1
  label: afterlife journey by path, water crossing, and ghost destination
  taxonomy_refs:
  - afterlife_journey_map
  basis: Ghosts travel along defined routes, assemble, cross by canoe to Galaga or
    fly to Laulau, land on rocks, and proceed toward named ghost places or paths.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:12
  - ev:14
  confidence: high
  cautions: The passage reports several local variants rather than a single standardized
    map.
- id: motif:2
  label: ship or canoe of the dead
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage explicitly notes a ship of the dead and describes a canoe from
    Guadalcanal that carries ghosts across to Galaga.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The author says this feature is almost alone in Melanesia; the passage
    does not give wider parallels.
- id: motif:3
  label: postmortem bodily mark or piercing as admission test
  taxonomy_refs:
  - divine_judgment
  - initiation
  basis: At Galaga a tindalo tests nose piercing to determine the ease of the path;
    at Laulau Bolafagina checks a hand mark to admit ghosts or cast them into a gulf.
  evidence_refs:
  - ev:9
  - ev:14
  confidence: medium
  cautions: The tests are based on bodily signs rather than explicit moral judgment;
    the initiation reference is functional and should be reviewed.
- id: motif:4
  label: return from attempted entry into the realm of the dead
  taxonomy_refs:
  - return
  - resurrection
  basis: A man who appeared to die traveled with ghosts toward the canoe, was forbidden
    to board by a tindalo, was sent back, and revived to tell the story.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage describes apparent death and revival, not a fully developed
    resurrection narrative.
- id: motif:5
  label: funerary offering and memorial destruction or withdrawal of property
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Food is offered in fire for the deceased, the dead man’s property is displayed
    and left untouched, fruit trees are cut down, and sacrifices are offered on the
    grave.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:16
  confidence: medium
  cautions: The author explicitly denies that some memorial objects are meant to accompany
    the ghost; interpretive claims should distinguish memorial respect from provisioning
    the dead.
- id: motif:6
  label: power added to a newly worshipped chiefly ghost by heads
  taxonomy_refs:
  - sacrifice
  basis: After a chief’s death, heads are procured in his honor and believed to add
    mana to the new tindadho, with sacrifices offered at the grave.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage describes head-taking and sacrifice, but does not frame the
    heads as a formal sacrifice in all details.
comparison_claims:
- id: claim:1
  claim: The Florida account can be cautiously compared to an afterlife-journey pattern
    in which the dead travel by route and water conveyance to a ghost destination.
  claim_level: same_function
  target: afterlife_journey_map; ship or canoe of the dead pattern
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself notes the ship of the dead as almost alone in Melanesia
    and does not supply external parallels or evidence of historical contact.
- id: claim:2
  claim: The Galaga nose-piercing test and the Laulau hand-mark test share the function
    of a postmortem admission or path-selection test within the passage’s nearby Florida
    and Bugotu material.
  claim_level: same_function
  target: postmortem bodily sign as admission test in Florida/Galaga and Bugotu/Laulau
    accounts
  evidence_refs:
  - ev:9
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The two tests differ in body part, result, and local setting; the passage
    does not state that one derives from the other.
