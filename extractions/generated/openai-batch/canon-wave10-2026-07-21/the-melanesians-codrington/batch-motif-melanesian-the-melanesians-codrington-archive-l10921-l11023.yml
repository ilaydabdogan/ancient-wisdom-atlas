  quote_or_summary: The Gaeta people believed Florida ghosts passed along a path through
    gardens to a point of land, unseen except for a twittering sound, and were heard
    dancing while they waited there at night.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:8
  type: summary
  locator: 10921-11023; canoe crossing to Galaga
  quote_or_summary: From time to time a canoe came from Guadalcanal and took the ghosts
    across to Galaga; they first landed on a rock near the shore and there became
    aware that they were dead.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:9
  type: summary
  locator: 10921-11023; Galaga nose test
  quote_or_summary: At Galaga a tindalo with a rod thrust it into ghosts’ nose cartilage
    to see whether their noses were pierced; pierced ghosts had a good path, while
    others traveled with pain and difficulty.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:10
  type: summary
  locator: 10921-11023; living men see dead forms
  quote_or_summary: Living men in canoes near Galaga have seen and recognized forms
    of the dead, but the forms disappeared when approached.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:11
  type: summary
  locator: 10921-11023; revived Gaeta man
  quote_or_summary: A Gaeta man appeared to die, revived, and said he had gone with
    ghosts toward the canoe at night, but a tall black tindalo forbade him to come
    aboard and sent him back to the world.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:12
  type: summary
  locator: 10921-11023; Bugotu ghosts and Laulau
  quote_or_summary: At Bugotu, the spirit leaving the dead becomes a ghost; Laulau
    is the place of ghosts, though ghosts haunt graves, fly through the air toward
    Laulau, and first light on rocks where they become aware of their sad condition.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:13
  type: summary
  locator: 10921-11023; living visitors to Laulau
  quote_or_summary: Living visitors to Laulau see rocks, vanishing forms like men,
    neatly kept paths, cleared bathing places, fish that disappear overnight when
    hung in trees, and removed road marks.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:14
  type: summary
  locator: 10921-11023; Kolapapauro and Bolafagina’s test
  quote_or_summary: Ghosts go to the pool Kolapapauro and present themselves to Bolafagina,
    lord of the place; they advance along a narrow tree trunk, and he examines their
    hands for the frigate-bird mark that admits them, throwing the unmarked into the
    gulf beneath.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:15
  type: summary
  locator: 10921-11023; Bugotu chief burial and skull
  quote_or_summary: When a chief dies, he is buried with his head near the surface
    and a fire kept burning over it so the skull may be taken up and preserved in
    the successor’s house.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
- id: ev:16
  type: summary
  locator: 10921-11023; heads, mana, grave, sacrifices
  quote_or_summary: An expedition procures heads in honor of the deceased chief, now
    a tindadho to be worshipped; the heads are arranged on the beach and believed
    to add mana to him, the grave is built with stones, and sacrifices are offered
    upon it.
  source_text_path: texts/public-domain/melanesian/project-gutenberg/the-melanesians-codrington.md
  rights_note: Public domain source; concise summary.
