candidate_motifs:
- id: motif:1
  label: culture-making spirit or culture hero
  taxonomy_refs:
  - culture_hero
  basis: Tagaro makes things, men, food, canoe, house, gamal, and the plain country,
    and his actions leave lasting places and objects.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage presents Tagaro as a wui rather than explicitly using the
    term culture hero; the motif label is an analytic candidate based on described
    functions.
- id: motif:2
  label: opposed creator and contrary companion
  taxonomy_refs:
  - duality
  basis: Tagaro seeks good outcomes while Suqe-matua or Suqe opposes him, desires
    bad or wrong outcomes, and thwarts his actions.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The passage gives an explicit opposition but does not frame it as a cosmic
    dualist doctrine.
- id: motif:3
  label: departure of a powerful benefactor with remaining token
  taxonomy_refs:
  - departure
  basis: Tagaro departs eastward, takes the best of everything, never returns, yet
    throws back a fire-stick and leaves objects or places identified with him.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The stolen pig is given as the immediate cause; broader meaning of departure
    is not supplied in the passage.
- id: motif:4
  label: ascent to heaven by transformed plant-like line
  taxonomy_refs:
  - ascent
  - sacred_tree_axis
  basis: The boy shoots a reed arrow into the sky; it becomes like an aerial root
    of a banyan, and the boy and mother climb it to heaven.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage says the line is like a banyan aerial root, not an actual
    tree-axis; the taxonomy reference is therefore tentative.
- id: motif:5
  label: heavenly father and earthly child encounter
  taxonomy_refs:
  - divine_parent_child
  basis: Tagaro fathers a boy on earth; the boy learns his father is in heaven and
    climbs there with his mother to meet him.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: Tagaro is called a wui with superhuman power, not explicitly a god; the
    category is used cautiously.
- id: motif:6
  label: ruler of ghosts in chthonic chasm
  taxonomy_refs: []
  basis: Suqe is sent to an inland bottomless chasm where he rules over ghosts of
    the dead.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: No journey of the dead or full afterlife geography is described beyond
    the chasm and Suqe’s rule.
- id: motif:7
  label: sacred stones inhabited or associated with incorporeal beings
  taxonomy_refs: []
  basis: Many wui are said to belong to sacred stones, with sacred stones and haunts
    connected to them.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: high
  cautions: Individual names and narratives for these beings are mostly not provided.
comparison_claims:
- id: claim:1
  claim: The passage itself compares Tagaro’s Maewo narrative role to Qat’s role in
    Banks' Islands stories, stating that Tagaro takes Qat’s place and that Tagaro
    stories deal with him as Banks' Islands stories deal with Qat.
  claim_level: same_function
  target: Qat in Banks' Islands traditions
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports functional comparison within nearby Melanesian
    traditions but does not establish shared origin or historical transmission.
- id: claim:2
  claim: The passage presents a recurring local pattern of a powerful maker figure
    paired with a contrary companion, in Maewo as Tagaro and Suqe-matua and in Araga
    as Tagaro and Suqe.
  claim_level: same_motif
  target: Tagaro with Suqe-matua/Suqe across Maewo and Araga accounts
  evidence_refs:
  - ev:2
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The names Suqe-matua and Suqe may represent closely related or variant
    figures, but the passage does not explicitly analyze their identity.
