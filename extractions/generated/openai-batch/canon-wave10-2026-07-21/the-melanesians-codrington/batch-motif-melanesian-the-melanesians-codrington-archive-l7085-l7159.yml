canonical_text:
  quote: ''
  summary: The passage recounts episodes from the adventures of Qat. Qat tricks his
    brothers by appearing like a bat in a tree; Ro Lei appears in disguise as an old
    woman and is accepted by Qat after the brothers reject her. The brothers then
    trap Qat in a magically enlarged nutmeg-tree, seize Ro Lei and his canoe, and
    depart by sea. Marawa the Spider helps Qat descend by means of his long hair.
    Qat gathers objects and food into a coconut-shell bottle, makes himself small,
    and floats in the bottle until he reaches and precedes the brothers' canoe.
  language: English
  quote_policy: summarized
