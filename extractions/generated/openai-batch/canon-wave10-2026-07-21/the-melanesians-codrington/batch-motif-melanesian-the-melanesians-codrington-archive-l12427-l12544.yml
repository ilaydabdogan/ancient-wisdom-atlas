canonical_text:
  quote: ''
  summary: The passage describes Melanesian canoe forms, construction, navigation,
    trade voyages, war-canoe fittings, charms for sea conditions and expedition success,
    naming and feasting at canoe completion, and the killing of pigs and human victims
    or captives connected with launching important new canoes. It also notes regional
    variation in paddles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Canoes are used for long voyages to Vanikoro and other known islands, with
    navigation by the stars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Canoes from Saa make six-day voyages for trade and pleasure and cross between
    islands to exchange money and ornaments for food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Heavily laden returning canoes throw out floats of dry coconuts at night so
    that people can rest and sleep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Florida, the moon in her second quarter lying on her back is called a canoe
    of Mala.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A small San Cristoval catamaran is made from sago-palm frond stems, with the
    tips drawn back to form a high curved prow decorated with a crimson streamer.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A first-rate war canoe takes a long time to build and can be large enough
    to carry many men; examples include a forty-five-foot canoe carrying ninety men
    and a Florida peko sixty feet long by six feet wide.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Plank-built canoes are made with adzed planks, cleats, curved mangrove rib-pieces,
    sinnet sewing, and cemented seams.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A war canoe has a rest for spears and other weapons set up amidships, and
    tindalo charms are fixed and hung on the stem to secure quiet seas and a favorable
    expedition.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: One spear-rest includes figures of a crocodile and dog above and two men and
    two cockatoos below.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Canoe charm elements include a head representing one taken when the canoe
    was first used, a hanging board described as full of mana, and bamboo tubes stuffed
    with tindalo relics and leaves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Important canoes have names and festivities after completion; one Olevuga
    canoe was named Biku, and one hundred pigs were killed when it was cemented.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: An important canoe is said to require a life for its inauguration; if no victim
    was met on the first voyage, a chief might arrange for a man to be killed, and
    further west captives were kept so their heads could be taken when new canoes
    were launched.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Paddle forms vary regionally between the Eastern Solomon Islands, Ysabel,
    the Banks' Islands, and the New Hebrides.
  category: attribute
  evidence_refs:
  - ev:9
