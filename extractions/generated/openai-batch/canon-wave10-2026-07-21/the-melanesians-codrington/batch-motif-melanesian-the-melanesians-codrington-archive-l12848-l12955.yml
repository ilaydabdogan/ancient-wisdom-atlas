canonical_text:
  quote: ''
  summary: The passage describes Melanesian weapons and fighting practices across
    several islands, including spears, shields, clubs, bows, slings, ambushes, first-kill
    blood practice, combat display gestures, and beliefs about poisoned arrows whose
    harmful force is attributed locally to mana and magic rather than ordinary poison.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Florida, Guadalcanal, Ysabel, San Cristoval, and to a lesser degree Malanta,
    spear fighting is described as the proper mode of war, though regional defensive
    practices differ.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spears are described as made generally of palm wood, in Ysabel of ebony, and
    sometimes with human bone components, including Florida kona headed with jagged
    human leg-bones.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Open spear fighting is described as having low mortality and resembling a
    series of duels; after a man was hit, the enemy would run in with a club.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Combined attacks on villages could involve allies obtained by payment and
    promises and could become siege-like if not quickly resolved.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ambushes set around a village at night or for a single man on a path are described
    as more common and deadly than open spear fighting, with the tomahawk as the effective
    weapon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A young warrior in Florida, after killing his first man, would let blood run
    from the weapon into his mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Malanta bows are described as powerful and commonly used in war, while slings
    in the Solomon Islands are said to have been brought into use for attacking tree-houses.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Banks' Islands the spear is described as practically unknown as a weapon,
    while the spear appears with the bow in Ambrym; an Espiritu Santo spear has a
    triple point and graduated human-bone barbing.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Where bows were used in the Banks' Islands, open battle was uncommon and included
    shouting, cursing, abuse, boasting, heel-stamping, and grasping the ground with
    the toes as a sign of valour.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Banks' Islands slings were used chiefly in defense against night attack by
    slinging stones down expected approach paths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: English and French medical officers examined poisoned arrows and their effects
    and concluded that the reputed poison-stuff was not poisonous and did not cause
    fatal effects by ordinary poison.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that the local view of arrow poison attributes harmful
    power to supernatural mana in the arrow material and to qualities added by charms
    and magic.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: In Takua's account, 200 canoes came together to attack Ta-na-ihu; after an
    unsuccessful onset, the fighters used spears on a hill slope for three days and
    then withdrew with little loss.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: In a large attack on Port Patteson, women supported the attacked party by
    encouraging them with cries and beating on trees.
  category: action
  evidence_refs:
  - ev:8
