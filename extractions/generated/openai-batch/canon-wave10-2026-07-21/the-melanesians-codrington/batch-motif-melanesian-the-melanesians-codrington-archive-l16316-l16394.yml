canonical_text:
  quote: ''
  summary: The Little Orphan, Som/Ro Som, and her child prepare pig food. When the
    Little Orphan calls, many pigs come and are fed. Ro Som asks about his maternal
    uncle and sends him to ask that uncle to make payments for his steps in the suqe.
    The uncle and others doubt the orphan's ability to repay, but the uncle sees the
    orphan's pigs, garden, house, and gamal. Through successive named suqe payments,
    the uncle pays and the Little Orphan returns property in money and pigs. Food
    from one cooking does not run out as they continue through rank after rank in
    the suqe.
  language: English
  quote_policy: summarized
