  quote: ''
  summary: The passage distinguishes Melanesian ghosts, understood as disembodied
    spirits of deceased humans, from spirits that were never human. It describes rites
    to dead relatives, European and missionary terminological confusion, regional
    differences between spirit-oriented and ghost-oriented religious practices, and
    a Fijian example in which a deceased person may become a kalou invoked and worshipped
    after death.
  language: English
  quote_policy: summarized
