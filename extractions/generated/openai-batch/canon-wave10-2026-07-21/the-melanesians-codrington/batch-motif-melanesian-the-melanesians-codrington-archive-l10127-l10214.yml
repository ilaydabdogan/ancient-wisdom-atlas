literal_observations:
- id: obs:1
  text: The passage states that premarital intercourse and unchastity existed, but
    also says island communities were not generally indifferent to female virtue.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The presence or absence of a word for a harlot is presented as varying by
    island.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Florida, a rembi could be condemned to that status by a chief after misconduct,
    belonged to the chief, lived in one of his houses, and yielded most earnings to
    him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Florida rembi could later marry after accumulating porpoise teeth and money,
    and reference to her former life would then be improper.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Wango in San Cristoval and nearby, prostitution by girls and named harlots,
    repi, are described; at Saa in Malanta, a pregnant girl of chiefly family could
    be killed unless the paramour paid enough to save and marry her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Malanta and Ulawa examples, a father or chief could allow, buy, or keep
    a girl as a harlot for monetary gain, while such a repi was said to be poorly
    respected.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Banks' Islands, the passage says harlots were unknown, parents were
    expected to supervise and correct children, and girls were not allowed to go about
    alone without a mother or elder friend.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A woman with children and no husband could be locally understood as having
    been taken as a wife and then driven away by a jealous previous wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Pentecost and Lepers' Island, harlots are said to be unknown, though some
    unmarried girls and married women secretly received mats and ornaments in prostitution.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A Lepers' Island story tells of a man with two wives who hung a bag in his
    house before leaving and expected it to be filled with mats on his return.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A footnote gives a term for a bastard as a child of the thicket and says such
    a child was described as born without belongings.
  category: attribute
  evidence_refs:
  - ev:10
