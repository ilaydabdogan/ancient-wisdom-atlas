  quote: ''
  summary: The passage describes Melanesian property and inheritance rules concerning
    fruit-trees, soil, gardens, kin-group land, personal property, chiefs, tabooed
    hidden valuables, and regional variations in descent through sons or sister's
    children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Fiji, a person may have rights in fruit or a tree on land owned by another
    person, while cutting or uprooting the tree is restricted by the landowner's rights
    in the soil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Florida, matanga garden property is described as belonging ultimately to
    the kema rather than absolutely to an individual, with family portions held by
    hereditary succession.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ancient family lands in Florida ordinarily pass to members of the same kema,
    especially to sister's children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Newly cleared bush land may pass from father to son while its acquisition
    is clearly remembered, but later nephews may claim it and quarrels may result.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A chief, called vunagi, is said not to differ from other men in property rights
    in komu and matanga.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Trees planted on another person's land may pass to the planter's son if friendly
    relations with the landowner continue.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man may declare fruit-trees in his own matanga to belong to his sons, while
    the ground passes at his death to his nephews.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: After a death in Florida, members of the kema assemble and may consume the
    deceased person's pigs and food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A dying man may direct that his canoe go to his son; without such direction,
    son and nephew may both claim it, and the stronger claimant obtains it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A wife may hide part of her husband's money before his death and later bring
    it out for herself and her sons after the inheritance crowd disperses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Chiefs formerly hid money and valuable property and made the place tambu;
    after fear of the tambu declined, young people searched for and took such hoards.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'The passage reports regional variation: Saa property descends in a patriarchal
    line, Santa Cruz property regularly goes to nephews though sons may also inherit,
    and Banks Islands land succession is rightly with sister''s children.'
  category: relationship
  evidence_refs:
  - ev:7
