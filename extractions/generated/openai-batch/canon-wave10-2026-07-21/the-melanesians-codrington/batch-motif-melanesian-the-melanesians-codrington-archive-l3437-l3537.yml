canonical_text:
  quote: ''
  summary: Ethnographic discussion of property inheritance in several Melanesian settings,
    emphasizing claims by children, sons, sister's sons, brothers, and kinsmen; wills
    and compensation payments; hidden money; land, gardens, pigs, houses, and fruit-trees;
    and a stated tendency from sister's-son or kin succession toward succession by
    a man's own children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Personal property is described as including pigs, money, canoes, ornaments,
    weapons, and implements; it generally goes to children, while rights of a man's
    sister's children are still maintained.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a man dies, his brothers and kinsmen may carry off his pigs unless the
    children buy them off; a testamentary declaration can protect the children's inheritance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A great man may bury quantities of money that are never found; in Lakona a
    father may reveal a hidden hoard to a helpful son who works in his garden or gives
    him food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Lakona, a deceased man's money and pigs are distributed among his children
    and kinsmen, and the children give money and pigs to kinsmen so that they may
    keep personal belongings, land, and fruit-trees.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If a man dies while settled elsewhere as a stranger or while visiting, his
    kinsmen, especially his sister's son, have a right to take what he left behind;
    this claim is generally settled by a money payment called tulag.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A death away from home may be accompanied by suspicion or accusation of poisoning
    or witchcraft, for which compensation is demanded.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The footnote gives an example in which Wete's son dies after being charmed
    by means of a fragment of his food; Wete later shoots his sister because her husband
    is said to have caused the death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Araga, Pentecost Island, the sister's son succeeds to his uncle's house,
    garden, and pigs; the uncle's son takes only what the father gave him during life,
    and even a self-made garden goes to the sister's son.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Lepers' Island, the right of the sister's son is described as barely recognized;
    village and garden property are held by individuals, and a man's son succeeds
    to his house property.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Lepers' Island, a son does not live in the inherited house while his mother
    and sisters are there because of restrictions on intercourse.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Lepers' Island, women do not succeed to land, but they have a right to
    a share in the produce of their father's gardens, which their brothers are said
    to hold partly for them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Fruit-trees planted on another man's land remain the property of the planter
    and the planter's heirs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Lepers' Island, a deceased man's sons distribute pigs, money, and other
    possessions among the waivung, with a choice pig and larger share given to the
    sister's son.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Succession to property is described as a frequent source of quarrels, and
    acknowledged rights may be overridden when heirs are absent.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: The author states a general tendency across Melanesian islands to substitute
    a man's own children for his sister's children and other kin in succession to
    property, especially for property produced by the man's own industry with help
    from sons.
  category: relationship
  evidence_refs:
  - ev:8
