canonical_text:
  quote: ''
  summary: The passage describes several Melanesian sacrifice practices involving
    human victims, pigs, dogs, food, yams, ancestral relics, and offerings to ghosts
    or spirits. It distinguishes propitiation, gaining goodwill, substitution of victims
    for afflicted persons, cleansing rites, and first-fruits offerings in Saa near
    Cape Zelee in Malanta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A human sacrifice is described in which participants call on a tmdatho or
    similar ghost-spirit, give the victim to it, and the sacrificer burns a portion
    in the fire for the spirit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that Bera, a principal chief, cooked and ate an arm after
    first sacrificing a portion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Soga at Manggotu is said to have killed several Bogota visitors, bound one,
    taken him to a burial place, and offered him to the ghost of a man supposed to
    have been bewitched.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that these sacrifices do not commonly involve propitiation
    or substitution, but that propitiation is present when misfortune is thought to
    follow an offence or in sickness.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Saa, some sacrifices are described as involving a distinct substitution
    of the victim for the person on whose behalf the offering is made.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A ghost of a departed warrior or powerful man may become a lio'a or lida;
    a warrior ghost may be treated as a battle or killing ghost if it is found to
    act.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says there is no single Saa word for sacrificing, but seven rites
    are classed by an educated native with sacrifices of other islands.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the rite called Tau taha, food may be put to a father's relic case, or
    thrown while calling on father, grandfather, and other deceased friends during
    voyages, landings, or danger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the rite called 'unu qo, a small pig is sent to take the place of a person
    plagued by a lida, taken to the lida's sacred place, strangled, and burned whole
    with other food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In 'unu qo, the sacrificer calls loudly on the lida of the place and on family
    ghosts and ancestors, naming the giver of the pig as provider of the ghosts' food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: In toto 'akalo, a pig or dog is cooked while the lida causing trouble are
    named and asked to clear sickness, charm, or curse and make the afflicted person
    clean.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In toto 'akalo, the animal is thrown into the sea or set on a stone in the
    sacred place because it is considered holy and has taken away the mischief.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In toto efia hanua, a pig or dog is cooked in the sick person's house, cut
    up, arranged, and associated with a spoken request to help and deliver the sick
    person.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In toto efia hanua, the pig is eaten by all present except women, and nothing
    is burned.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In first-fruits rites, ripe yams from gardens are offered at a sacred place
    to lio'a, with one yam put by a skull and additional food given while ancestors
    are named.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: If someone has a relic such as a head, bones, or hair in the house, he takes
    back a yam to set beside it.
  category: action
  evidence_refs:
  - ev:9
