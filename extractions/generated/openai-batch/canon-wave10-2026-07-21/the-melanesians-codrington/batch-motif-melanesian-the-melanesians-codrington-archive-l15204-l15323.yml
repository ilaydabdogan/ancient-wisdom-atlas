canonical_text:
  quote: ''
  summary: The passage contains several Melanesian animal stories and the opening
    of a tale of origins. In one animal story, the Rat soils the Owl while grooming
    him, is exposed by the Mes parrot, hides in a hole, and is lured out with roasted
    red wasia caladium before the Owl kills and eats him. A brief Shark and Snake
    story tells of a quarrel ending with the Snake eating the Shark after the Shark
    is killed. In the Hen and Chickens story, an animate wild yam tuber eats one chicken,
    is attacked by Kites, broken, and divided, explaining why some tubers are good
    and some bad. The Kamakajaku story begins with Kamakajaku seeing a dark patch
    of ocean from a hill at Gaji, investigating the sea himself, being swallowed by
    a great King-fish, cutting his way out with obsidian, and encountering the rising
    Sun.
  language: English
  quote_policy: summarized
