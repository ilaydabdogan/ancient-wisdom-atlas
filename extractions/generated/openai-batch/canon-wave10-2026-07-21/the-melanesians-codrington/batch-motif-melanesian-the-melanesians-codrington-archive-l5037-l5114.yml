canonical_text:
  quote: ''
  summary: The passage describes a Suqe rank-advancement ceremony involving money,
    dancing, speeches, pigs, conch-shell blasts, a ritualized shooting of a named
    pig, and a fasting host. It then describes women’s analogous but distinct rank
    system and explains kolehole feasts as object-centered ceremonies that confer
    rank and ornaments, including examples involving houses, gamal structures, stones,
    platforms, and memorial images.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Money paid for the palaho is carried aloft in a dish before bearers who dance
    while a drum beats and singing continues.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The newly advanced giver of the feast dances with a palm-leaf umbrella held
    before his face, explained in the passage as modesty in his new position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A high-ranking Suqe man makes a speech stating that the new man had difficulty
    entering the position, spent much money on palakos and decorations, and gave many
    pigs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pigs are brought out one by one, smacked by the giver, and handed to another
    great man who decides where they are to go.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several large pigs have individual names, and three great men blow conch-shells
    after each pig is smacked and again when money is laid on the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another great man appears with a bow and arrows and says that the original
    introducer is dead, but that he has taken up the new member instead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The great man with the bow shoots the biggest pig, named Puss, with two light
    arrows; the passage describes this as only a form of killing the pig.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The host later makes a short speech after having been forbidden to eat for
    five days and being weak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women are excluded from the men’s Suqe but have an analogous system in which
    grades of honour are gained through payment of money and making a feast.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women who advance become tavine motar, gain money, help their husbands in
    rank advancement, plant gardens for feasts, and receive distinctions such as tattooing,
    shell bracelets, an ornamented pari, and red earth face decoration.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A kolehole is defined as a feast with dancing and singing connected with a
    certain object and giving a certain rank marked by an appropriate ornament.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: For a new house, a nule image remains as a memorial at the door; for a new
    gamal or oven compartment, a stone or stone platform is set up and danced on in
    connection with the feast.
  category: object
  evidence_refs:
  - ev:8
