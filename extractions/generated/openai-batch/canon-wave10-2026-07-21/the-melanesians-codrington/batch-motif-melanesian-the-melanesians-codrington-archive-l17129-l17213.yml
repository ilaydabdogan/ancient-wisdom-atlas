canonical_text:
  quote: ''
  summary: Two Lepers' Island stories are given. In the first, Tagaro-mbiti spends
    the night in a fruiting gaviga-tree with a conch-shell trumpet, encounters Mera-mbuto
    and his brothers, and blows the conch after Mera-mbuto returns to his cave; the
    brothers fall from the tree and die, and Mera-mbuto dies after striking his head
    on cave rock. In the second, Mera-mbuto and Tagaro exchange meals; Tagaro gives
    misleading explanations for his food, Mera-mbuto imitates them, and later Mera-mbuto
    burns Tagaro's house, but Tagaro escapes through a hole and then burns Mera-mbuto's
    house, killing him.
  language: English
  quote_policy: summarized
