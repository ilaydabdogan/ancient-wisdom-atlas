canonical_text:
  quote: ''
  summary: 'The passage describes Melanesian practices of setting aside small portions
    of food or kava for the dead, then distinguishes Solomon Island sacrifices from
    practices in the New Hebrides and Banks'' Islands. It gives a San Cristoval account
    of a war-related sacrifice to the ghost Harumae: a barrow pig is strangled, its
    blood collected, flesh and blood are taken into a shrine, a prayer is addressed
    to Harumae, and the flesh and blood are burned on a fire before the pig is eaten
    by worshippers. It also notes Florida sacrifices to tindalo and the transmission
    of sacrificial knowledge by chiefs.'
  language: English
  quote_policy: summarized
