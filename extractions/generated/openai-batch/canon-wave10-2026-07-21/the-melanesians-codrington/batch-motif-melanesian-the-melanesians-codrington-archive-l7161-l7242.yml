canonical_text:
  quote: ''
  summary: 'The passage recounts Qat’s escape after being presumed dead, his signs
    to his brothers, his arrival at Maewo, his destruction of their canoe and reconciliation
    with them. It then narrates episodes involving Qasavara, a strong cannibal vui:
    Qasavara kills Qat’s brothers, Qat kills him and revives the brothers from their
    bones, and in another episode Qat hides the group inside a rafter to evade a night
    attack.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Banana skins appear as signs from Qat; Tangaro the Wise says Qat is not dead
    but has escaped and is following them, while the others reject this explanation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bottle containing Qat floats beside the canoe; the brothers handle it one
    after another, mistake it for a coconut, reject its smell, and throw it away.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Qat floats quickly to Maewo, emerges from the bottle, adorns himself with
    red earth, shell-money, and a cock’s-tail plume, and sits on a male pandanus-tree
    on the beach.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: When the brothers come ashore they see Qat in the pandanus-tree; Tangaro the
    Wise identifies him, while the brothers argue that he cannot be Qat because Qat
    is dead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qat makes rocks rise and hold the canoe high and dry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Qat leaps down with his axe, sings about the canoe and his brothers’ trick,
    and hews the canoe to pieces before them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After destroying the canoe, Qat makes friends with his brothers and tells
    them to live together in harmony.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Qasavara is described as a vui, very strong, a great fighter, a tyrant, and
    a cannibal who lives on the same island as Qat and his brothers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A make fruit floats down a stream; Qat keeps it and has his mother cook it,
    and his brothers eat portions of it, with Tangaro the Fool finishing it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Qat sends his brothers to find more make fruit; they follow the stream to
    a tree whose branches hang over Qasavara’s house, and Tangaro the Fool drops a
    fruit onto the house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Qasavara comes out in anger, seizes and kills the brothers, and puts them
    in his food-chest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After five days Qat arms himself with bow, arrows, and shell hatchet, searches
    along the stream, drops a make fruit on Qasavara’s house, fights Qasavara, and
    kills him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Qat finds his brothers’ bones in the food-chest and revives them by blowing
    through a reed into their mouths and telling them to laugh if they are his brothers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In another episode, Qasavara invites Qat and his brothers to his village,
    makes a fire in his oven, and directs them to sleep in his gamal; they fear they
    will be killed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Qat splits one of the gamal rafters with his knuckles; the group sleeps inside
    it, and Qasavara with his men fail to find them when they come armed at night.
  category: action
  evidence_refs:
  - ev:9
