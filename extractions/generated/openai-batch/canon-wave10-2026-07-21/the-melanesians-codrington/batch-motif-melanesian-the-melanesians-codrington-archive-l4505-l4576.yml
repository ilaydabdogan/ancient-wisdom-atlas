canonical_text:
  quote: ''
  summary: 'The passage describes the Matambala rites at Belaga in Florida, Solomon
    Islands: their association with the earlier Qatu, their origin ascribed to Siko
    from Bugotu, sacrifices made to Siko, a permanent initiated body, sacred restricted
    precincts and houses with images, and the opening sequence of ceremonies involving
    first-fruits, new moons, swept paths, close tambu, and a night dance of Siko.
    A native account adds that Siko left Bugotu after rivalry with Doriki, arrived
    by canoe, settled at Materago, divided followers into twelve villages, and appointed
    chiefs.'
  language: English
  quote_policy: summarized
