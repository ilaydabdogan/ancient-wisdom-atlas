canonical_text:
  quote: ''
  summary: In the tale of the Little Orphan, the nephew repeatedly supplies money,
    pigs, and rawes to repay his uncle’s ritual expenditures. The wealth is inexhaustible
    because his mother, Ro Som or Money, multiplies it in the house. The uncle advances
    through all ranks of the suqe and completes many kolekole observances, with pig-killing
    and distribution of wealth. The uncle’s two wives wish to stay and marry the Little
    Orphan, but the uncle refuses, citing their former contempt for him. Later, the
    Little Orphan prepares pork in an oven and decides to join a voyage from Motalava
    and Losalava to Gaua despite his mother’s warning to stay.
  language: English
  quote_policy: summarized
