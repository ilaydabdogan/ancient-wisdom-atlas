canonical_text:
  quote: ''
  summary: The passage describes gender separation in Santa Cruz and Nufilole; states
    that no general initiation or making of young men is known in the islands, but
    that Saa had an initiation-like oha noviciate for some boys involving precautions,
    purification sacrifice, bonito fishing, rank-linked seclusion, feasts, and emergence
    as young men; describes circumcision as a social distinction rather than an initiation
    or religious rite; and notes girls’ advancement toward matrimony through clothing,
    tattooing, and local forms of women’s dress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Santa Cruz, men and women do not work together promiscuously or assemble
    in one group; women gather apart when a crowd assembles.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Nufilole, men and women are never out together; men go out first, women
    later fetch water, and men go out again after the women return.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that initiation or making of young men is not known generally
    in these Melanesian islands, apart from entrances into societies; Saa is named
    as the nearest approach.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: A chief’s son at Saa may go early to the oha around age twelve while common
    children still eat and sleep at home, and before that he is kept from certain
    places, speech, and older boys.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At first the boy goes only by day to the oha and returns to his mother to
    sleep; later he joins boys of his own age in a sort of noviciate that could formerly
    last for years.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: A tuto sacrifice is performed first to purify the boys.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boys go early each morning in a canoe to catch bonito-fish; men paddle
