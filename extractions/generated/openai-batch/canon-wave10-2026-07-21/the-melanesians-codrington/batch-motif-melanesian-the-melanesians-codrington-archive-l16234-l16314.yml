canonical_text:
  quote: ''
  summary: The Little Orphan is repeatedly excluded from fishing with others because
    he has no parents and no vegetable food to eat with his fish. While fishing alone,
    he catches fish and a plaited hibiscus line, then a woman and her child named
    Eo/Ro Som (Money) come up from the sea and insist on going with him. At his dwelling
    he sees a house and gamal, which Ro Som says belong to the three of them. She
    directs him to cook fish, shows that cooked food is present, and later says the
    nearby abundant gardens also belong to the three; she then plans further cooking
    and pig food preparation.
  language: English
  quote_policy: summarized
