- id: obs:4
  text: The woman instructs Ganviviris to return home, have his uncle's wives plait
    ten bags, make a separate chamber, hang the bags in the open, and not eat that
    day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ganviviris asks his uncle, called Tata, to tell the three wives to plait ten
    bags; the uncle and wives call him penniless or idle, but the bags are made.
