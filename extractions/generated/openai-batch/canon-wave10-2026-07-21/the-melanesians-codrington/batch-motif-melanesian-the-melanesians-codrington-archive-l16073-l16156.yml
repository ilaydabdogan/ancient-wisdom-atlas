canonical_text:
  quote: ''
  summary: Ganviviris shoots a sauma after hearing an unseen voice. The fish carries
    him to a dry cave, turns into a woman, and promises him help. Following instructions
    connected with Bo Som, he has ten bags made, which are filled with money at night.
    He receives his uncle's third wife and prepares to acquire suae rank with food,
    money, cords, and pigs. Bo Som warns him to take the ranks at Qakea, not at Mota,
    or he will die.
  language: English
  quote_policy: summarized
