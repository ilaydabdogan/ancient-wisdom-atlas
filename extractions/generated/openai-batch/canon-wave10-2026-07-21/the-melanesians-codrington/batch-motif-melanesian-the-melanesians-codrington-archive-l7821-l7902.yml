- id: obs:2
  text: In Bugotu, scraps of a person's food are thrown into a ghost pool by enemies
    wishing to charm that person; rapid fish consumption is associated with the person's
    death, while another result is reported as the tindalo being unwilling to harm.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Food, cooked-fish fragments, and small amounts of money are laid on stones
    in sacred places for good crops and fishing success, with an acquainted proprietor
    offering on behalf of petitioners.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Stones associated with powerful ghosts are treated with reverence, avoided
    in open places, and in secret sacred places may become altars for sacrifice.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Small sacred stones are said to gain renewed efficacy when placed among the
