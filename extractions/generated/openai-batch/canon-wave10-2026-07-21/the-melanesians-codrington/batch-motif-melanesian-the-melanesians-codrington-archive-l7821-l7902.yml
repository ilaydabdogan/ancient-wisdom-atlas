  text: Snakes that haunt sacred places are sacred as belonging to, or embodying,
    a ghost; one Savo snake is said to cause death when looked upon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In San Cristoval, snakes receive special reverence as representatives of the
    spirit-snake Kahausibware.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sharks are often treated as abodes of ghosts, especially when deceased men
