canonical_text:
  quote: Living sacred objects in the Solomon Islands are chiefly sharks, alligators,
    snakes, bonitos, and frigate-birds.
  summary: The passage describes sacred pools, streams, stones, snakes, and sharks
    in the Solomon Islands as abodes, representatives, or embodiments of ghosts. It
    describes food charms, offerings for crops and fishing, reverence and avoidance
    of sacred stones, snakes associated with ghosts and the spirit-snake Kahausibware,
    and sharks treated as ghost-abodes, fed, named, feared, and sometimes understood
    as posthumous forms of deceased persons.
  language: English
  quote_policy: quoted
