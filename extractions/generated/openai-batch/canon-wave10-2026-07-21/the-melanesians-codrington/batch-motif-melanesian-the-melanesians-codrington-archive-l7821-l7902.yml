  category: action
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
- id: obs:11
  text: At Saa, a man may speak as with the voice of a shark-lida in him and ask for
    reserved food; if recognized as possessing supernatural power, he may after death
    be counted as a shark-being.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Saa and Ulawa, if a sacred shark attacks a man and he escapes, people are
