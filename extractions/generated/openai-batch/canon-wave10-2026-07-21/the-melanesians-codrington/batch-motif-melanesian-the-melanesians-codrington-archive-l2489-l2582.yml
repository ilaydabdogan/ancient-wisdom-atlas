canonical_text:
  quote: ''
  summary: The passage describes rules of reserve and avoidance in several Melanesian
    settings, especially the Banks' Islands and Mota. It details physical avoidance
    between a man and his wife's mother, respectful bodily restrictions involving
    the head and legs, avoidance of personal names and name-parts among affinal relations,
    substitute vocabulary used when common words resemble forbidden names, native
    explanations in terms of shyness and respect, and a Mota practice of using a dual
    pronoun for a single respected person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage contrasts several regional practices: Fiji is said to show reserve
    among brothers and sisters and among mothers and sons; Florida and Saa are said
    not to require special avoidance of in-laws or their names; Santa Cruz sex separation
    is said not to depend on marriage relation; Banks'' Islands avoidance and reserve
    are described as strict and minute.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Banks' Islands a man and his wife's mother mutually avoid coming near
    one another; if they meet on a path, one may move aside and the woman may stand
    with her back turned until he passes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Vanua Lava in Port Patteson, a man and his mother-in-law would not follow
    one another along the beach until the tide had washed the first traveller's footsteps
    from the sand, though they could speak at a distance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that a man does not avoid his father-in-law, that a woman
    does not avoid hers, and that a man does not avoid his wife's brother, son's wife,
    or wife's sister, although he will not sleep with his wife's brother; engaged
    boys and girls may avoid one another through shyness rather than rule.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Where physical avoidance is not required, respect is shown by not taking anything
    from above the head or stepping over the legs of a father-in-law or wife's brother;
    the head is described as having something naturally sacred, called rongo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Avoiding mention of a name is described as a lower degree of respect than
    avoiding a person, and the passage lists several affinal relations whose names
    are not spoken, including wife's father, wife's mother, wife's brother, husband's
    father, daughter's husband, and gasala, people whose children have intermarried.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The reserve about names extends to using any part of the name in ordinary
    conversation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In one anecdote, a man referred to his house as a shed, then touched it to
    clarify his meaning, and finally whispered a respectful substitute connected with
    his son's wife rather than uttering her name, Tawurima, which contained the word
    for house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Examples from a Mota pedigree show common words becoming unusable because
    they form part of relatives' names; substitute expressions or a stock of substitute
    words called un are used instead.
  category: speech
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:10
  text: The passage says natives themselves ascribe avoidance of persons and names
    to shyness, respect, and inward trembling, and that this feeling may also prevent
    people from mentioning their own names.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: When asked another person's name, a native may turn to a bystander to answer,
    with the explanation given as qaliga.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Mota, respect may be shown by using a dual pronoun when addressing or speaking
    of a single person, as if that person's spouse were also present.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: A footnote states that un words are not invented for the purpose but are taken
    from comparatively unused words in the language, and that they may show connections
    with other languages not evident in common words.
  category: attribute
  evidence_refs:
  - ev:10
