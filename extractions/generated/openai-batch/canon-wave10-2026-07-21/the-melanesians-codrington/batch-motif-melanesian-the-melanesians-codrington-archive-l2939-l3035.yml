canonical_text:
  quote: ''
  summary: The passage describes chiefly authority and succession in parts of Melanesia,
    especially Florida and the Banks' Islands. It records attempts to pay chiefs for
    killing or attack, the role of chiefly knowledge, communal choice and property
    transfer in succession, the vulnerability of chiefless villages, the influence
    of the Suqe and Tamate secret societies, examples of chiefs being recognized or
    displaced, and the Etvusmel office with father-to-son succession supported by
    Suqe rank and the predominant side of the house.
  language: English
  quote_policy: summarized
