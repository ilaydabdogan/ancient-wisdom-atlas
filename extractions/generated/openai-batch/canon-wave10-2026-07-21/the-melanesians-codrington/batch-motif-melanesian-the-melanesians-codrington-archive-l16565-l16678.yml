canonical_text:
  quote: ''
  summary: 'The passage gives several Aurora tales: a woman’s pandanus leaves become
    an eel whose cooked flesh turns the eaters into eels; a fragment about Wetopunpun
    making gardens appear during famine and a stone used for sacrifice; two women
    find an owl that becomes their husband and later flies away when revealed by firelight;
    and Qat steals the wings of a heavenly bathing woman, marries her, loses her when
    she recovers the wings, then dies after climbing toward heaven on an arrow-and-banyan-root
    path.'
  language: English
  quote_policy: summarized
