  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman's body is not brought in for burial; while it rots, her two infants
    remain alive and become free from it.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The twins roll along the ground, drink rainwater collected in dry leaves,
    suck water from a hollow qena root, and grow strong enough to wander out of the
    thicket.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The twins find Qatu's sow with young and repeatedly drive her away in order
    to eat the cut cocoa-nuts intended for the sow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qatu notices that his sow keeps returning thin, watches secretly, and sees
    the fair-complexioned twins taking the sow's food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When questioned, the twins tell Qatu how they came from the thicket and survived
