canonical_text:
  quote: ''
  summary: A man-eater named Taso kills Qatu's pregnant sister and leaves her unburied
    in a thicket. Her twin infants survive as her body decays, drink collected water
    from leaves and a qena root, and eventually take food meant for Qatu's sow. Qatu
    discovers them, recognizes them as his sister's children, brings them into his
    household with his wife Motari, feeds them, and later trains them with progressively
    stronger bows, arrows, and clubs.
  language: English
  quote_policy: summarized
