canonical_text:
  quote: ''
  summary: Qat and his brothers evade Qasavara's repeated attempts to kill them. Qat
    hides the group inside parts of the gamal, then plants a casuarina-tree and arranges
    for his brothers to escape into it during a feast. Qat evades Qasavara's club,
    gathers food, climbs to his brothers, and commands the tree to lengthen until
    it reaches the sky and then bend down to Tatgan. When Qasavara follows, Qat releases
    the tree; Qasavara is flung, falls, turns into a stone, and the stone becomes
    a place where sacrifices are offered for fighting valour.
  language: English
  quote_policy: summarized
