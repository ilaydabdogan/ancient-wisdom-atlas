- id: obs:4
  text: Takua, described as a considerable chief, took the daughter of one of his
    wives; although she was not of his own kema, the people were outraged and his
    influence diminished.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A footnote says Alfred Lombu proposed for a daughter of Takua and maintained
