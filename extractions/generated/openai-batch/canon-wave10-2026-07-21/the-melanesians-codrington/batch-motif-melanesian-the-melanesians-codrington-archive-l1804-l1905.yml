canonical_text:
  quote: ''
  summary: The passage describes named Florida kin divisions called kema, their exogamous
    marriage rules, related Bugotu divisions, and the buto prohibitions attached to
    kema. It explains that buto may be understood as connected to ancestors or tindalo,
    and gives the example of Polika, a Nggaombata ancestral ghost associated with
    a beach, a snake, and a clam called Polika.
  language: English
  quote_policy: summarized
