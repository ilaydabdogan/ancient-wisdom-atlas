canonical_text:
  quote: ''
  summary: In the Dilingavuv tale from the Tokres Islands, Dilingavuv eats bananas
    from a garden made by others. Marawhihi organizes attempts to shoot him; after
    others fail through fear, Marawhihi shoots off Dilingavuv's ear. Dilingavuv returns
    to his mother, obtains an axe by concealing what happened, and makes a replacement
    ear from a tree root. Later, during a feast and dance, Dilingavuv sets a hidden
    pit trap covered with a leaf dancing cloak, lures the dancers with roasted chestnuts,
    and drops them into the pit. He throws heated stones into it, but Marawhihi moves
    the trapped men aside so none are killed. Marawhihi then engineers an escape by
    having arrows shot one into another toward a banyan branch, forming a climbable
    line. The passage also begins a Vanua Lava eel story with people planting gardens
    and a boy speaking to his parents.
  language: English
  quote_policy: summarized
