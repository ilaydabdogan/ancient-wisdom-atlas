  text: Principal relationship terms are described as generally similar across the
    Melanesian islands and related languages, with the term for mother noted as an
    exception.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that common words are not always used in the same application
    across languages, giving Florida tubu and Mota tupu as an example.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The term qaliga covers people on the other side of the house brought near
    by marriage, including parents-in-law, children-in-law, and their brothers and
    sisters.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man and his wife's brother call one another wulus, while a woman and her
    husband's sister call one another walu; these terms may extend to the cousins
    of the husband or wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman does not call her husband's brother her brother-in-law; the passage
    says she is nothing to him, though her children are called his.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man calls his daughter-in-law tawarig, and parents whose children have intermarried
    call one another gasala, glossed as fellow-wayfarers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Mota pedigree distinguishes two veve, or two sides of the house, with letters
    marking male and female members; members of the same side are sogoi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Relatives who are near by blood may call one another tasiu and tutuai even
    when the stricter relationship conveyed by those words is absent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that a man's sister's son, his vanangoi, takes his place
    in the family.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: An anecdote reports that a boy named Tarioda called a youth from the same
    island his father, while meaning that the youth was a cousin of his father.
  category: speech
  evidence_refs:
  - ev:5
