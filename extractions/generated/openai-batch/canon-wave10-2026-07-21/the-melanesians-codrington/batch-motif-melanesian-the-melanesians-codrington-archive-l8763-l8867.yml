canonical_text:
  quote: ''
  summary: The passage describes Melanesian charms using mana songs, stones, plants,
    water, fire, and named invocations to affect rain, wind, sun, famine, calm, animal
    fertility, first use of nets and canoes, combat, and witchcraft. It then describes
    harmful magic using fragments of food, hair, nails, or other personal remains
    to connect a victim with a ghost or spirit, and notes protective disposal practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Aurora gismana combines mana leaves, pounded kava pepper branches, and
    a rain-stone in a hollow stone while singing charms with Tagaro's name; the covered
    mass ferments and is said to send up mana-bearing steam that makes clouds and
    rain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the pepper must not be pounded too hard because the wind
    might blow too strongly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A footnote describes a shell with earth, an upright red-ochred stone, sticks,
    and a creeper fence as an object by which the wind is fenced or bound until the
    object rots.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: To make a hot sun, wizards hold mana-filled plant branches over a house fire;
    as the branches wilt, dry, and burn, the land is expected to dry similarly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: To make famine, cocoa-nut fronds, yams, other food, and pepper branches are
    hung over the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For rain, juicy plants and leaves and stalks of via are crushed with songs,
    placed in a basket, and hidden in a hollow tree where water lies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: To make calm, light reed leaves or pepper stalks are cut and hung in a tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that the charms have power because Tagaro's name is in
    them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Charms for a sow's first litter include beating her back with pepper branches,
    strewing Barringtonia blossoms, laying cocoa-nut fronds on her, breaking a bamboo
    vessel so salt-water runs over her, and hanging almonds above her head, all with
    appropriate words.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: First-use nets are charmed with leaves and a mana song; a new canoe is charmed
    with a young cocoa-nut made mana by song and placed on the outrigger.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before fighting, a man may drink an infusion of bitter herbs and bark to strengthen
    his shooting hand, and may chew leaves and puff forth their magic influence to
    dishearten an approaching enemy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Wizards who cure diseases are often also said to cause them, using mana derived
    from spirits and ghosts.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Malignant witchcraft is described as using a fragment of food, a hair, a nail,
    or something closely connected with the intended victim as a medium.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage says the aim is to bring together the person to be injured and
    the spirit or ghost that is to injure him; personal fragments or food already
    eaten can form the connecting link.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: In Florida, a food scrap thrown into a vunuha haunted by a tindalo ghost is
    said to make the man ill; in the New Hebrides, a mae snake carrying away a food
    fragment to a sacred place is said to make the eater sicken as the fragment decays.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage says people hide hair and nail-parings and carefully give food
    remains to pigs to prevent witchcraft; a note connects retiring into sea or river
    water with blocking the use of excrement in charms.
  category: action
  evidence_refs:
  - ev:9
