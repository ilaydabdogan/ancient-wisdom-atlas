  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The island of Rowa supplies common money and a finer sort used as ornament;
    very small shell-money discs and bored pearl from giant clam are mentioned as
    valuables.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Torres Islands, beads, arrows, mats, boars' tusks, and the head of
