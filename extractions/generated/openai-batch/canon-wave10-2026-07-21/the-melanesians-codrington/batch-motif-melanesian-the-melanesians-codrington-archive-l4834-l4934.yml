canonical_text:
  quote: ''
  summary: The passage describes the Suqe, or Huqa in the Torres Islands, as a male
    social society with graded ranks or ovens. Advancement requires mana, ritual practices,
    payments, pigs, food, feasts, and approval by higher-ranking men. High ranks are
    marked by titles, authority, hats, images, gamal structures, feasts, songs, dances,
    and strict boundaries between stages. The excerpt also notes a Banks' Islands
    story pattern in which a poor or orphan youth rises to greatness through the Suqe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Suqe is described as a social institution rather than a religious one,
    and women are strictly excluded.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Advancement through successive degrees is associated with mana and with seeking
    aid from unseen powers through fasting, sacrifices, and prayers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rising from step to step requires money, food, and pigs; high rank is associated
    with mana, authority, and status as a chief or king-like figure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who reaches the top has the title Wetuka, described as if he had reached
    the sky, and his consent, obtained by substantial payment, is required for others
    to advance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Suqe is said to unite the male population and give control to elder and
    richer men who may admit or reject candidates for higher ranks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Most males are brought into the society while still boys; a man who has never
    entered is nicknamed lusa, a kind of flying fox that does not gather with ordinary
    flocks.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Entrance and each successive step require payment to those already holding
    that rank and a feast scaled to the rank being attained.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Higher steps involve large public gatherings and feasts with songs and dances,
    and hats and images are assigned to the highest ranks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Mota Suqe has many steps and ovens, and some rank names are explained
    by meanings such as little fire, cycas with sanctity, face of the sun, and catches
    the clouds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The lano wears a tall conical, sometimes forked, hat; the poroporolava and
    wometeloa ranks have human images that are carried at the rank feast and later
    set up in the gamal.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Regional forms differ: Gaua has fewer ovens and raised gamal platforms for
    higher ranks, while the Torres Islands Huqa has seven ovens or ranks and the avlav,
    big fire, near the gamal threshold.'
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: In these islands the distinction between stages is strictly marked; someone
    crossing to the oven above his rank would be trampled to death by those intruded
    upon.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage says that in Banks' Islands stories a poor lad or orphan who becomes
    the fortunate Youth rises to greatness through the Suqe and takes its highest
    grade instead of marrying a king's daughter.
  category: sequence
  evidence_refs:
  - ev:3
