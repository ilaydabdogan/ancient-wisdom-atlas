canonical_text:
  quote: ''
  summary: The passage describes Melanesian secret societies, especially the Banks'
    Islands tamate, their lodges, masks, sound-making devices, exclusion of women
    and the uninitiated, probation and seclusion of neophytes, and coercive treatment
    of outsiders. It compares related institutions in Fiji, the Northern New Hebrides,
    New Caledonia, Florida, and Mota, and notes how cross-admission and Christianity
    weakened supernatural belief while the societies survived socially as clubs.
  language: English
