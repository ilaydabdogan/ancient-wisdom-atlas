canonical_text:
  quote: ''
  summary: 'The passage first continues a story in which Ganviviris buys ranks through
    repeated property distributions, feast preparations, and payments. During a feast
    at Mota, an adorned woman enters his house and disappears; afterward his money-bags
    are empty, his pigs are gone, and he sickens and dies. The passage then begins
    the Mota story of the Little Orphan: boys are sent to fish while their parents
    gather vegetables; the Little Orphan asks to accompany them, is rejected because
    he has no parents, fishes separately, and returns to his cave to roast his fish.'
  language: English
  quote_policy: summarized
