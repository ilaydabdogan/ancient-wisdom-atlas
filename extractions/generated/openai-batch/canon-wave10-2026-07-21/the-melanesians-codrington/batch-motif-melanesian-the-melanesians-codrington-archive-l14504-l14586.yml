  text: At Mota, a man buried his influenza-weakened brother with earth heaped loosely
    over the head and checked whether he was still alive.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In Pentecost, a woman buried after lingering sickness during famine was heard
    crying in her grave for three days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Lepers' Island, a patient was sometimes strangled with his own consent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Araga, Pentecost Island, a great man angry with a hostile party could burn
    a wounded enemy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After peace had been made, chiefs could order a serious peace-breaking offender
