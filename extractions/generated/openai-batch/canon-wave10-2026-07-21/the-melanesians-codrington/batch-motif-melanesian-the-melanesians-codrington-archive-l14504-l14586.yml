  summary: The passage reports beliefs and practices concerning strangers and castaways,
    non-slave captives taken in head-hunting contexts, children incorporated as seka,
    live burial or strangling of sick and aged people, and localized cases of burning
    alive or burial alive as punishment or assertion of chiefly power.
