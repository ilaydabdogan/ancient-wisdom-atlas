- id: obs:2
  text: A castaway recognized as belonging to a hostile district faced death, while
    one connected to the receiving division could probably be saved.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Castaways from known islands could be received as guests, sometimes marrying
