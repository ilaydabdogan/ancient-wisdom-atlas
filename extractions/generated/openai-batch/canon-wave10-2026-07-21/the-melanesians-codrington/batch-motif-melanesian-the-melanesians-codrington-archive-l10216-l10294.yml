canonical_text:
  quote: ''
  summary: The passage describes Melanesian marriage arrangements, especially early
    betrothal, negotiated payments, tattooing of engaged girls in Florida, ceremonial
    transfer of the bride from her natal home, reciprocal gifts and wedding feast,
    childhood visits by betrothed girls at Saa in Malanta, and a wedding-feast custom
    in which village boys shoot arrows near bride's relations until bought off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Betrothal is described as occurring very early for many Melanesian girls,
    with a man who has a son looking for a suitable newborn girl to become his son's
    wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Marriage arrangements are described as a long sequence of payments, negotiations,
    bargaining, and discussion, especially for a young man's first marriage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Florida, a girl engaged as an infant and partly paid for at engagement
    is tattooed when she reaches the appropriate age, and this indicates that the
    future husband's father should make a further payment toward the marriage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tattooing is performed by a professional man who receives money, pigs,
    and food; a feast is made for him and assembled friends and relations help bear
    the expense.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tattoo pattern is first marked in circles with bamboo, the skin is cut
    with the bone of a bat's wing, the operation causes considerable pain and swelling,
    and an untattooed girl is not considered marriageable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After further delay, the future father-in-law and his party pay the agreed
    money, and an extra payment is made that is glossed as money to break the post
    near the door, ending the bride's going in and out of her old home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women of the bride's party take the bride by the hand, give her up, lift her
    from the ground, carry her on one woman's back out of the house to the other party,
    and the bridegroom does not appear at this stage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bride stays in her father-in-law's house for two or three months while
    awaiting a present of pigs and food from her parents; when they arrive, a feast
    is held as the wedding banquet, though the parents and the young couple do not
    partake of it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The final ceremony is completed when the young man takes his wife to his father's
    house or his own; the bridegroom's party gives coils of native money, and the
    bride's party returns pigs, saying the money buys the pigs and not the damsel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young man's relations are expected to help him with marriage payments
    and are willing to do so if he has been active and willing in garden work and
    other duties.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Saa in Malanta, a young betrothed girl brings food and stays for one or
    two months in her future father-in-law's house to become acquainted with the family;
    the betrothed children converse and play, and the visit is repeated while they
    are little.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At a wedding feast in the bridegroom's village, boys shoot arrows around the
    bride's relations to alarm or annoy them until they buy immunity by paying a fish's
    tooth.
  category: action
  evidence_refs:
  - ev:7
