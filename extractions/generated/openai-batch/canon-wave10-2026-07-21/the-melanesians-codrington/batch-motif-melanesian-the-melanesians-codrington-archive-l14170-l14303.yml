  quote: ''
  summary: The passage gives an ethnographic catalogue of Melanesian musical instruments,
    dance accessories, work-song rhythm, feast sound-making, and several games. It
    describes bamboo and reed instruments, shell and seed castanets, wind-operated
    bamboo rods in trees, the reed-casting game tika/tiqa, hide-and-seek, prisoners'
    base, and football-like play.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage begins with a section labelled “Florida Galevu” and notes that
    a musical transcription was written down by Mr. G. Bailey of Norfolk Island.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bamboo pipe instruments are described for the Banks' Islands and Lepers' Island,
    including a longer Lepers' Island form with four holes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Lepers' Island wara is a double flute made from two lengths of slender
    bamboo with a knot and holes; the performer places the knot in the mouth and modulates
    sound with fingers and thumbs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bamboo jew's-harp called nene in Florida is said to be common in the Solomon
    Islands and unknown in the Eastern Islands.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The kalove is a Solomon Islands stringed instrument made from bent reed or
    bamboo, two strings, bridges, and a reed plectrum; the performer holds it in the
    mouth and stops strings by hand.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Castanets made from shells of nuts and seeds are worn on ankles and wrists
    in dancing and may be hung on dancing-clubs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In San Cristoval, men preparing for a feast scrape coconuts together, sing
    with the motion of their hands, and rattle wrist castanets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Feast sound-making in the Banks' Islands includes drums and a man shaking
    dry beach shells in a matting bag.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Aurora, pierced bamboo rods are fastened to tree tops to make an Aeolian
    flute.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The game tika, compared in name with Fiji tiqa, uses reeds dashed on the ground
    so that they rise and fly; variants use a string or the foot for impetus.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tika is played by two parties who count pigs for the farthest casts, with
    the number of pigs depending on the knots in the winning reed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The proper season for tika is when yams are dug, and the reeds used for yam
    vines are suggested as the original tika reeds.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Mota uses a decimal set of numerals in the game distinct from its ordinary
