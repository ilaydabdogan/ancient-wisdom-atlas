  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Banks' Islands boys play hide-and-seek in sides; if a hidden boy is not found,
    he jumps up and counts a pig against the seekers.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: A prisoners' base game has a cooking-place where each party is safe, and Lepers'
