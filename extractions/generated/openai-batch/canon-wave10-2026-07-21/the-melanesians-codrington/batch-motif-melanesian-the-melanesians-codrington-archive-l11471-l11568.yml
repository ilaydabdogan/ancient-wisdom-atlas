canonical_text:
  quote: ''
  summary: 'The passage describes funeral and post-funeral practices in several Melanesian
    localities: grave offerings for a dead person going to Bono or Panoi; posthumous
    accusation or cursing of oppressive dead men; concealment or protection of graves
    because bones and skulls may be used in charms; Ureparapara funeral offerings,
    messages to the dead, and a five-day ghost-expulsion rite; and a Motlav rite in
    which the ghost of a person with sores or ulcers is chased westward to the sea
    so it will not spread disease.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Killed pigs or parts of them are placed at the grave; when the dead man goes
    down to Bono or Panoi, the ghosts there are said to see him arrive with these
    and think much of him, while Gaua people deny that pigs have ghosts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note distinguishes a pig or ornament's visible shadow or echo from the
    human intelligent spiritual part; it says the atai cannot be seen, while the dead
    man or his body-outline can be seen indistinctly.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Motlav, a man wronged by the deceased followed a burial with a stone, threw
    it on the body, and accused the dead man of ill use and persecution.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Gaua, friends of a dead great man might conceal his death so people he
    had oppressed would not spit at him or curse him; at Motlav, relatives might watch
    the grave of a bad man to prevent a wronged person from beating the grave with
    a stone and cursing him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Friends may perform a sham burial and hide the real grave because the corpse
    of a man who had mam in life is thought to contain mam useful for arrows and charms;
    at Gaua, bones may be buried under stones to prevent removal for arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Ureparapara, friends bring many kinds of food to hang on white peeled palako
    sticks around the corpse laid out in the village, and an orator addresses the
    deceased with messages and news for the dead in Panoi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the same Ureparapara funeral, two small yams or caladium roots are roasted
    only in show over a coconut-frond fire, food is scraped with the left hand, water
    in a bamboo joint is put into a new basket for the ghost, a pig is killed, the
    body is tied in a mat, and food is buried on or hung above the grave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In Ureparapara, five days after death, people drive away the ghost using charmed
    bags of small stones and short bamboo pieces; two men clink white stones, women
    wail, and neighbours march through the village throwing stones and beating bamboos
    before discarding them in the bush.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Ureparapara ghost is said to have remained near the dead man's house until
    the rite; the widow stays on the dead man's bed for five days and leaves a coconut
    to represent her if she must leave.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Motlav, only the ghost of a person badly afflicted with ulcers or sores
    is driven away; people warn the next village westward, then after burial chase
    the ghost with shell-trumpets and coconut-frond stalks from village to village
    westward until the sea is reached.
  category: sequence
  evidence_refs:
  - ev:10
