canonical_text:
  quote: ''
  summary: This zoological note describes island reports about malau or maleo birds,
    native and imported fowls, crocodiles, snakes, eels, mosquitoes, and the Birgus
    latro or coconut crab. It includes local claims that crocodiles have four eyes,
    that some crabs hold with a claw until sundown, that crabs dance on moonlit beaches,
    and that natives believe in wild men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Savo, malau birds are described as private property and as laying eggs
    in divided sand patches; in the Banks' Islands and New Hebrides they lay in decayed
    tree hollows or scratched rubbish heaps.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The native breed of fowls is said still to abound in Santa Cruz, while imported
    fowls have replaced it in many more commonly visited places.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Crocodiles are reported in several island groups, and the natives of Ysabel
    maintain that they have four eyes, two for clear water and two for mud.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mota is reported to have no land snakes, while snakes among banyan root-stems
    in Vanua Lava and Saddle Island are said to grow to enormous size.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Eels in the Tas of Santa Maria are sometimes reported as more than thirty
    inches in girth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Mosquitoes are described as varying by island: in Mota one kind bites only
    in daylight, while in Vanua Lava during the rainy season people sleep buried in
    sea-sand to escape them.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Fiji account of Birgus latro says it climbs coconut trees, pierces and
    drinks young nuts, husks and breaks old nuts, and eats the meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The same crab is said to be trapped by grass tied around a tree, causing it
    to release its hold and fall when descending backwards; it is also said to throw
    earth and stones at pursuers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Banks' Islands people say that the ngair's left and smaller claw holds anything
    it seizes until sundown, and that this claw is named loaroro, 'sundown.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Banks' Islands people also say that a ngair will eat a dropped coconut only
    if it breaks smoothly, not if the fracture is jagged.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Wango people of San Cristoval relate that on moonlit nights crabs on the
    island Bin dance, with two large old crabs in the centre beating time and others
    circling and waving claws.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note states that natives believe in wild men, while Europeans have interpreted
    this belief as implying anthropoid apes.
  category: relationship
  evidence_refs:
  - ev:9
