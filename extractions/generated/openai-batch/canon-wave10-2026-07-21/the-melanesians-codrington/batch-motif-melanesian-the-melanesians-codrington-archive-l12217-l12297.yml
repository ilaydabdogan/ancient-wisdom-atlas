canonical_text:
  quote: ''
  summary: 'The passage describes beliefs and practices concerning death: the atmat
    leaves the body, lingers, and goes to Banoi; corpses are watched, wrapped, buried,
    and mourned; ghosts travel along the coast to an assembly point before descent
    into Banoi; a stream, tree, and shark mark the route; Banoi is described as a
    town of the dead; types of dead are grouped there; murderers may be refused reception;
    ghosts haunt burial places and may cause sickness; several local burial customs
    and cases of burying living women with dead husbands or children are also reported.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The atmat is described as both the dead person after death and the living
    person's soul; at death it leaves the body, lingers nearby for five days, and
    then goes to Banoi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person recovering from fainting may say that he was not allowed to enter
    the abode of the dead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The corpse is watched until burial, wrapped in mats valued as money, and may
    be taken to the gamal; a great man's wrapped corpse may be set between two stakes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A great man may be buried in the village place in a qaru, with stones, dracaenas,
    and other coloured shrubs placed around.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After burial, a fire is lit for the death-meal, and people continue “eating
    the death” for one hundred days counted on a cycas leaf.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Relatives mourn by smearing themselves with smut and ashes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ghosts travel down the coast along the beach to Vatanggele, where they are
    heard singing, shouting, and drumming.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before descent into Banoi, ghosts assemble at a point of land opposite Ambrym
    where there is a stream they cannot pass and a tree from which they leap.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A shark waiting below bites off the noses of ghosts who have not killed pigs
    according to island custom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Banoi is described as a town with houses, trees, sweet-smelling plants, and
    coloured shrubs, but no gardens because there is no work.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A new ghost in Banoi is weak at first, rests, and is then greeted by a danee
    or by an elaborate reception if connected to someone already there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ghosts of people who died violent deaths, including those shot or clubbed,
    keep together; ghosts of those who died of cough also keep together.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A ghost arriving with the instrument of death on him names the killer; when
    the murderer arrives, the ghostly people do not receive him and he stays apart
    with other murderers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Informants differ about ghost food in Banoi; some say ghosts eat nothing,
    while others say they eat excrement and rotten erythrina wood, possibly for ghosts
    rejected by the happier crowd.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Ghosts especially haunt burial places and may revenge offences; trespassing
    on the grave-place of a dead chief can result in sickness caused by the ghost.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Ghosts that are seen appear like fire.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: At Ambrym, bones may be dug up after burial and placed under a hollow tree,
    in a house, in baskets with food in a tree, or sunk at sea, depending on the bones
    and status of the dead person.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Several cases are reported in which a woman asked, insisted, consented, or
    was accused in circumstances where people intended to kill or bury her alive with
    her dead husband or child.
  category: sequence
  evidence_refs:
  - ev:11
