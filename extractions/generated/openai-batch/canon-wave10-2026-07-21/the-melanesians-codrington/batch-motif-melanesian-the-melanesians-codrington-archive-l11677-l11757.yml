canonical_text:
  quote: ''
  summary: The passage describes Banks Islands conceptions of Panoi as a differentiated
    afterlife. At Motlav, a ghost descends by the sura and is admitted to true Panoi
    or excluded according to conduct in life, especially whether the person wrongfully
    killed, used charms, stole, lied, or committed adultery. Excluded ghosts remain
    restless and harmful. A Lakona belief describes ghosts at the burning hill Garat
    dismembering and reassembling the arriving ghost, with aggrieved ghosts withholding
    pieces if wronged. The passage also describes the feared ghost of a woman who
    died in childbed, deceived at burial with a banana-trunk substitute so she will
    not return for her living child’s soul. Panoi is described as near, under the
    land of the living, and partly resembling the upper world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Panoi is presented as not a single identical receptacle for all ghosts; the
    passage distinguishes classes of ghosts and more than one place associated with
    the term.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Motlav, a ghost descending the sura is met by another ghost and, according
    to the person’s character in life, is either allowed to enter Panoi or sent back
    toward another dreaded place and the earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who killed by treachery or witchcraft, or killed a good man without
    cause, is withstood at Panoi by the ghost of the person wronged; a person who
    killed in fair fight is not withstood by the person slain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bad character is identified with killing without due cause, causing death
    by charms, stealing, lying, and adultery.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Those admitted to true Panoi live harmoniously, while those in the bad place
    quarrel, are restless and homeless, wander back to earth, harm the living, eat
    excrement, open their mouths for wind, eat men’s souls, and haunt graves and woods.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Lakona, the ghost’s path leads to volcanic vents of the burning hill Garat,
    where assembled ghosts receive him, beat him to death, cut him into pieces, each
    take a piece, and put him together again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If the arriving ghost had wrongfully shot a father, brother, sogoi relation,
    or otherwise wronged one of the ghosts, the aggrieved ghost hides the piece taken,
    leaving the arriving ghost deficient when he goes down to Panoi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The ghost of a vasisgona, a woman who died in childbed, cannot go to Panoi
    if her child lives, because she cannot leave the child.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The living deceive the vasisgona’s ghost by placing a loosely wrapped piece
    of banana trunk in leaves on her bosom at burial, so that she thinks she has the
    child with her.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The living child is taken to another house because people expect the mother’s
    ghost to return to take its soul.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The vasisgona’s ghost seeks the child in grief and rage and is especially
    dreaded.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Panoi is described as near, under the land of living people; a person nearly
    killed may say he has been close to Panoi and returned. It is said to contain
    villages, houses, and trees with red leaves.
  category: setting
  evidence_refs:
  - ev:11
