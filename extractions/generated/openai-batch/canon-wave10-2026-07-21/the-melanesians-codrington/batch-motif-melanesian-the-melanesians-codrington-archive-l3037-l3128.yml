canonical_text:
  quote: the power of a chief rests is that of belief in the mana he possesses
  summary: The passage describes chiefly authority in parts of Melanesia as grounded
    in mana, Suqe rank, war success, wealth, charms, stones, ritual knowledge, and
    recognized succession. It explains kin-based but flexible succession, the transmission
    of supernatural knowledge and objects, and a failed claim to succeed Mairuru through
    an alleged spirit-given stone and chant.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Men described as great warriors or high-ranking in the Suqe were said to be
    known as having mana; their charms, amulets, stones, and other means were linked
    to success in war and to multiplying pigs and yams.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Araga and Omba, the designation for a chief is given as Ratahigi, a word
    associated in the passage with 'mother' and with brotherhood or sisterhood, and
    the chief is described as representing the kin or brotherhood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Succession is described as often occurring from father to son or uncle to
    sister's son, but not by an absolute rule.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: 'A son does not directly inherit chieftainship; if arranged by the father,
    he inherits the things said to produce chieftainship: mana, charms, magic songs,
    stones, ritual apparatus, knowledge of approaching spiritual beings, and property.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A chief may teach his son supernatural knowledge, hand over the means to use
    it, purchase him high rank in the Suqe, and give or leave him property.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mairuru's son was sent for Christian education at Norfolk Island, and the
    passage says this education, by excluding belief and practice of mana, excluded
    him from succession as chief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Mairuru died without an apparent successor, a claimant entered Mairuru's
    sacred haunt, the tauten, where Mairuru was said to have intercourse with wui
    spirits, and reported hearing a whistle there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The claimant reported that at night something came upon his breast, that he
    took it in his hands, and that it was a stone shaped like the distinguishing part
    of a valued kind of pig.
  category: action
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:9
  text: The claimant said Mairuru appeared to him and gave him mana and a magic chant
    with which to work the stone for producing many such pigs.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The people believed the claimant's story when he showed the stone, but the
    passage says nothing came of his mana and Mairuru had no successor.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A chief's power is summarized as resting on belief in his mana, with wealth
