canonical_text:
  quote: ''
  summary: The passage describes Melanesian greeting and restraint customs, then reports
    beliefs from Florida, Saa, the New Hebrides, Mae, and Lepers' Island concerning
    hairy wild men who live in mountains, caves, forests, or volcanic places and may
    attack, seize, or eat people. It also notes regional variation, comparison with
    New Zealand wild-men stories, and the author's skeptical explanation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In small communities, the passage says there is little need for formal salutations;
    a passer through a village may be asked where he comes from, told to go on, and
    may say 'You stay' when leaving.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Banks' Islands, varpis is described as two men interlocking middle
    fingers with a friend, gripping tightly, and pulling apart with a crack as a greeting
    and mark of fellowship or approval.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kissing is described as non-indigenous; flunpun is described as nose-snuffing
    rather than nose-rubbing, proper mainly toward children, while nose-rubbing is
    assigned to Polynesian settlements only.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says it is not customary to say thanks, and that emotional display
    at gifts or reunions is considered improper; silence with downcast eyes is treated
    as the sign of inward trembling or shyness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Florida belief, Mumulou are said to live on the mountains of Laudari in
    Guadalcanal, to be men with language, straight hair reaching down their legs,
    hairy bodies, long nails, and large but human-sized bodies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Mumulou are said to live in mountain caves, plant nothing, and eat snakes
    and lizards.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Mumulou are said to eat any coast man they catch, carry bags of obsidian
    pieces for pelting men, set nets around trees to catch climbers, and use spears.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'In Saa, Mumu are said to be forest-dwelling humans, very small but very strong
    and swift, with long hair and long nails, tearing and devouring coast men and
    going about in a group of three: male, female, and child.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the New Hebrides, similar creatures are said to be seen on the rocks of
    the slopes of Ambrym volcano, and formerly on the Three Hills of Mae.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: In Lepers' Island, Mae are described as wild men with long hair and long teeth
    who dwell in caves, carry off pigs, seize and eat a man met alone, and cry in
    valleys at night, which is explained as the Mae washing her child.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The author says the wild-men belief varies but may be called general from
    Ysabel to Mae, compares it with New Zealand wild-men stories, denies a present
    factual basis in ape-like men or man-like apes, and suggests it may exaggerate
    coastal distinctions from inland people.
  category: relationship
  evidence_refs:
  - ev:11
