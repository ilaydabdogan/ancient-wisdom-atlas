canonical_text:
  quote: ''
  summary: The passage describes Melanesian accounts of changed mae or snake-women
    who appear as women and can be detected by bodily signs or tests, and then turns
    to sacred kingfisher beliefs in San Cristoval and the Banks' Islands, including
    links with souls, spirits, weather charms, and journey omens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Araga, a changed mae may be recognized because the skin under the neck
    remains unchanged.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A youth at Vathuqe was enticed by a changeling girl, saw her neck, returned
    to tell his people, and the attempted smoke remedy failed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another Araga test has the suspected temptress sit on a nettle-tree, where
    she is convicted by ignorance of its character.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Banks' Islands, a young man may see a flower-bedecked girl beckoning
    near a cliff at sunset and recognize her as a mae when her elbows and knees bend
    the wrong way.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a young man strikes the temptress with a dracaena leaf, she turns into
    her own shape and glides away as a snake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Gaua, a standing or variegated snake called mae tiratira or valeleas appeared
    on the beach at night in the form of a local woman and was recognized by reversed
    joints.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Gaua man brought money, scattered it on the being's back, and she went
    into the sea in her proper form as a mae.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Gaua, one of these beings appeared as a young married woman, turned into
    a creeper stalk, and the young man broke the vine short to get home safely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same young man later said the snake-woman came to him at night and disturbed
    people sleeping in the club-house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Young men who have been with a mae may run home at night and lose their senses,
    or sicken, confess, and die.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In San Cristoval, a kingfisher pecks the head of a newly separated soul, after
    which the soul sinks into a ghost.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: San Cristoval people kill the kingfisher, but young kingfishers spring up
    from the blood of each one killed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Banks' Islands, every kingfisher is sacred, a spirit is connected with
    it, and it is not killed or eaten.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The kingfisher's name carries magic power in a sunshine charm; the bird is
    thought to control storms and rain, and the charm calls on it to eat rising waves
    and make calm.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: If a man starting a journey hears a kingfisher cry, he may take it as angry
    and forbidding the journey, and he sings a charm for good luck.
  category: sequence
  evidence_refs:
  - ev:10
