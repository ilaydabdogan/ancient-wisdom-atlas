  quote: During life a man's tarunga goes out of him in dreams and returns; at death
    the tarunga departs finally from the body
  summary: The passage describes Melanesian beliefs and vocabulary concerning the
    soul, including the parting of soul and body at death, figurative language such
    as shadow, distinctions between spirits and ghosts, dream-departure of the soul,
    and a Florida account of a pig's tarunga retained in a leaf after sale.
  language: English
  quote_policy: quoted
