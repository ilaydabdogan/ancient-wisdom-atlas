canonical_text:
  quote: Prayers and Offerings are made everywhere to spirits, to ghosts, or to both.
  summary: 'The passage summarizes Melanesian religious observances: prayers and offerings
    are made to spirits and ghosts; offerings have several motives, including substitution,
    deprecation, gain, respect, and affection; there is no priestly order, though
    some men know how to approach particular objects of worship; women and children
    are generally excluded from rites; magic, witchcraft, healing, and weather-working
    are performed by the aid of ghosts and spirits.'
  language: English
  quote_policy: quoted
