    him in the surf.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the New Hebrides, some men are believed to have the power of changing themselves
    into sharks.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Snakes are often thought connected with a vui or spirit, especially when seen
