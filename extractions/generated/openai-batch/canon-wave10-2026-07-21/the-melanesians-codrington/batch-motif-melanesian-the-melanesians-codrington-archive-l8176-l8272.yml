literal_observations:
- id: obs:1
  text: A small heap of sticks beside a path was explained by Banks' Islands and Florida
    boys as a practice to ensure safe descent; they denied sacrifice, offering, or
    prayer, though the phrase 'There goes my fatigue' might be said.
  category: action
  evidence_refs:
  - ev:1
