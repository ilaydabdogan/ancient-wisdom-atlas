  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage names sacred or semi-sacred trees and plants, including casuarina
    places, cycas, crotons, dracaenas, and banyan trees associated with snakes.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:4
  text: In Aiaga, Pentecost Island, a cycas-tree is believed to turn into a young
    man or woman while the ear remains as a leaflet of the tree.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sharks and snakes are identified as the living creatures most commonly held
    sacred in the Banks' Islands and New Hebrides, with other creatures sometimes
    sacred because they haunt spirit-associated places.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Banks' Islands, a shark may be a tangaroa, a familiar spirit, or the
