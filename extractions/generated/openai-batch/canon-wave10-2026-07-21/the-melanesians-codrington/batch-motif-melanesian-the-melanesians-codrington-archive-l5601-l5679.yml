  quote: ''
  summary: The passage distinguishes Melanesian ghosts of the dead from spirits that
    were never human, describes the Banks' Islands vui, lists related terms and beings
    in neighboring islands, and recounts brief etiological traditions about Koevasi,
    a female superhuman being associated with creation, ancestry, death, language
    differences, and a cold river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A missionary visitor to Anaiteum called the Natmases gods; the passage identifies
    these with ghosts and with the Banks' Islands Natmat.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sacred stones, sacred places, and minor deities of sea, land, mountains, and
    valleys are presented as evidence for spirits other than ghosts of the dead.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Melanesian religion can be divided into groups where
    worship is directed chiefly to ghosts, and groups where both ghosts and spirits
    are important but spirits receive more worship.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Banks' Islands vui is described as living, thinking, more intelligent than
    a man, knowing secret things without seeing, possessing mana, having no visible
    form, and having no soul because it is itself like a soul.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Stories about named vui treat them as if they were men with supernatural power,
    despite the incorporeal conception of a vui.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The umi of the Northern New Hebrides are described as the same as the vui.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Solomon Islands, spirits are described as beings that were never men
    and do not have the bodily nature of a man.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kahausibware is described as a female being and a snake.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Malanta uremi are not living men or ghosts of dead men; they haunt big
    trees in the forest and snatch away human souls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Florida vigona are associated with power in storms, rain, drought, calms,
    and the growth of food.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Koevasi is described as female, superhuman, never merely human, not worshipped,
    and preserved in stories.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Koevasi made things of all kinds and became mother of a woman from whom the
    people of the island descend.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Koevasi is said to have authored death by resuming her cast-off skin.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Koevasi is said to have originated varying dialects because ague made her
