  quote: ''
  summary: The passage describes a Mota/Banks Islands seasonal calendar organized
    by winds, grasses, flowering trees, palolo appearances, and yam cultivation. It
    also summarizes regional use of areca/betel and kava, noting geographic differences
    and possible different introductions of kava preparation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Regular winds, calms, grass growth, flowering trees, and leafing trees are
    observed as seasonal signs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The springing of magolo grass marks the end of winter, and the flowering of
    erythrina, called rara, marks the cool season; these plant names are also used
    as season names.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The appearance of the palolo annelid is described as a conspicuous seasonal
    marker.
  category: object
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
- id: obs:4
  text: Garden clearing, tree cutting, and burning are assigned to particular named
    moons early in the cycle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Erythrina flowering and leafing coincide with yam planting, yam shoots, reed
    supports, vine training, weeding, tendril curling, and tuber formation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the calm months named from the palolo, a few annelids appear first;
    then the yams are mature enough to eat and, if weather permits, a second crop
    is planted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the full moon of the great palolo, the annelids swarm on the reefs for
    one night, and the whole population gathers them on the beach with many vessels
    and contrivances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The great palolo moon is also the moon of yam harvest, when vines are cut
    and tubers are carefully dug and stored.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the palolo period, garden clearing begins again, west and northwest
    winds return, heat increases, fish die in shallow pools, reeds flower, hurricane
    months follow, and the cycle returns toward springing grass and winter months.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Areca nut chewed with betel leaf and coral lime is described as universal
    in the Solomon Islands and Santa Cruz, extending to Tikopia, but unknown farther
    east.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Solomon islanders traveling toward Norfolk Island are said to recognize the
    absence of their familiar areca/betel practice as a sign that they have entered
    a foreign region.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Banks' Islands and New Hebrides, people drink an infusion of Piper
    methysticum root, called kava, with local names gea at Mota and malowo in Aurora.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage says kava use in the Banks' Islands is recent and that differences
    in preparation appear to point to distinct sources or times of introduction.
  category: relationship
  evidence_refs:
  - ev:10
