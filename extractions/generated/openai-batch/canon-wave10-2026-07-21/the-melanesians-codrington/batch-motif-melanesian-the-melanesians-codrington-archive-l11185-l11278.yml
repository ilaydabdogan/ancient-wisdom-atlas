- id: obs:3
  text: The skull and jawbone are called mangite, described as saka or hot with spiritual
    power, and are connected with obtaining help from the lio'a, the powerful ghost
    of the deceased man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A mangite may be enclosed in a hollow wooden bonito-fish figure and set up
    in a house or public canoe-house until the associated lio'a loses memory or credit.
  category: object
  evidence_refs:
  - ev:2
