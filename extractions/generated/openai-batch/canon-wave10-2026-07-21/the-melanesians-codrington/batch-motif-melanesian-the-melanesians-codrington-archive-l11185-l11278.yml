canonical_text:
  quote: ''
  summary: 'The passage describes several Saa and Santa Cruz treatments of the dead:
    delayed preservation in canoes or houses, burial, sea sinking, burning, staged
    exposure, water removal of flesh, preservation of skulls or other relics, memorial
    offerings, and beliefs about powerful ghosts or departed souls. It also describes
    Santa Cruz departed souls gathering at Natepapa, going to the volcano Tamami/Tinakula
    where they are burnt and renewed, and appearing as fiery presences in the bush.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Saa a corpse may be kept for years in a canoe, house, or public canoe-house
    while awaiting a large funeral feast, and later taken to a common or family burial
    place.
  category: sequence
  evidence_refs:
  - ev:1
