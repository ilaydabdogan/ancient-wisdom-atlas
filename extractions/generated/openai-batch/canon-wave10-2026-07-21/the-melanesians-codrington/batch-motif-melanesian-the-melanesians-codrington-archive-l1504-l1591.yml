canonical_text:
  quote: ''
  summary: The passage describes Melanesian kin-division rules governing marriage
    eligibility and sexual intercourse, sanctions for same-division intercourse in
    Florida, the Banks' Islands, and Lepers' Island, a hospitality custom in which
    a guest could be provided a temporary wife from a permitted division, and regional
    recognition of two kin divisions in the Banks Islands, Torres Islands, and Northern
    New Hebrides, contrasted with the Solomon Islands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited note says descent is still uterine in some parts of Fiji, while most
    tribes have moved to agnatic descent.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes women who may become a man's wives by marriage from
    women who cannot possibly do so.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that kin divisions strictly limit intercourse between men
    and women to persons of divisions other than their own.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Intercourse between two members of the same division is described as a crime
    and as incest, unlike intercourse between unmarried youths and girls of eligible
    divisions, which is treated as expected or excusable though not approved as good.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Florida, older sanctions for same-division intercourse are described as
    killing the man and making the woman a harlot; later sanctions could be satisfied
    by money and pigs, with a larger payment than for an offense involving a marriage-eligible
    woman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Banks' Islands, where there are two divisions, people of the other
    division would destroy the gardens of the offending division after a same-division
    sexual offense, and the offending division would not resist or complain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Lepers' Island, the offending man had to make a large payment to the woman's
    near relatives to appease their anger and 'fence against' the fault; the author
    says such incest cases were rare in the islands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A feature of hospitality is described in which a guest was provided with a
    temporary wife, but the woman supplied had to be one who could have been his wife
    and could not be of his own kin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author reports that current or recent performance of the temporary-wife
    hospitality custom was denied in the Solomon and Banks' Islands, not denied in
    the Northern New Hebrides, and inferred by the author to have been formerly common.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Banks' Islands and Northern New Hebrides are described as having two kins,
    while the Solomon Islands are described as having more than two divisions.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The same two divisions are said to run through the Banks' Islands, Torres
    Islands, and Northern New Hebrides, and people are said to recognize their kin
    across islands such as Aurora, Pentecost, Lepers' Island, and Espiritu Santo.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Banks' Islands and New Hebrides, the author says there is no name,
    badge, or emblem distinguishing either division, because neighbours are known
    in small communities.
  category: attribute
  evidence_refs:
  - ev:10
