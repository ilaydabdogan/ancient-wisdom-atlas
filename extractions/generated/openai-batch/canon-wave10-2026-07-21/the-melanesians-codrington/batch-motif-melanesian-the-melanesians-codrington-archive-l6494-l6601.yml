canonical_text:
  quote: ''
  summary: The passage describes Melanesian formal invocations, charms, and prayers
    addressed to powerful ghosts, ancestors, and spirits. Examples include sea-danger
    invocations to Daula, Bagea, and deceased kin; fishing aid from Daula; San Cristoval
    and Saa formulas involving ghosts; Banks Islands tataro as invocation of the dead;
    Motlav rites for sickness and return of a sick person's life or soul; animal signs
    near sacred places or stones; food and water rites at ovens used for curses or
    weather; and kava libations to a grandfather for prosperity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Melanesian person in danger, difficulty, or distress is described as calling
    on beings believed to have power to help.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes informal exclamations from songs, incantations,
    charms, and formal invocations that may be called prayers.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Solomon Islands, addresses described as prayers are made to tindalo,
    powerful ghosts of deceased people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Florida, Daula, a tindalo connected with the frigate-bird, is invoked to
    draw and lighten a canoe so it reaches land and shore.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bagea is invoked as grandfather; the word means shark and can refer to a tindalo
    that has taken up abode in or is represented by a shark.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: People in danger at sea call on immediate forefathers, fathers, grandfathers,
    or dead friends to save them from the deep and tempest and bring them to shore.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Daula is invoked to put fish into a net, praised after a good catch, and associated
    leaves are rubbed on fishing-lines.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In San Cristoval, ataro ghosts are approached for help in battle, sickness,
    and crops, while the named practice is described as closer to charm than prayer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Saa, a man in danger at sea may call on father or grandfather, or use a
    learned formula connected with a particular lio'a and then call on the dead teacher
    and kin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Banks Islands, tataro is described as properly an invocation of the
    dead, though spirits such as vui, Qat, and Marawa are addressed in the same way.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Banks Islands sea-danger tataro must be a form of words; a mere ordinary
    cry is not counted as tataro.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Motlav, sickness may be attributed to an offence against a sacred place,
    and the person who owns that place may be paid to tataro there morning and evening.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Motlav practitioner calls the sick person's name, listens for a bird cry,
    calls the life or soul to come back, returns to the house, and announces that
    the sick person will live.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: If a lizard runs onto the practitioner on the way to the sacred place, this
    is treated as enough to obtain the life and return with it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A man going to offer on a stone scatters loose money for a rat, crab, iguana,
    or lizard seen on the way and says a known tataro.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: When an oven is opened, a bit of food may be thrown against the side wall
    of the house with a tataro.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A Mota oven-opening formula offers cooked mallow to a dead person and asks
    that hostile people be dragged away to hell and die.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: When water is poured into the oven to make steam, a tataro may be used against
    an enemy or to get rain or sunshine.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: A kava libation before drinking addresses Grandfather and asks for boars,
    rawe, money spent, and food gone to come back to the speaker's house.
  category: speech
  evidence_refs:
  - ev:11
