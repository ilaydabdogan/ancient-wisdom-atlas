candidate_motifs:
- id: motif:1
  label: formal invocation of powerful dead or spirits for aid
  taxonomy_refs: []
  basis: The passage repeatedly describes formal addresses, tataro, or learned formulas
    directed to tindalo, ataro, lio'a, deceased kin, and spirits for help in danger,
    sickness, battle, crops, fishing, and other needs.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage notes difficulty translating local categories directly as
    'prayer' and sometimes frames them as charms rather than prayer.
- id: motif:2
  label: sea rescue through ancestor or ghostly helper
  taxonomy_refs: []
  basis: Sea-danger scenes involve invoking Daula, Bagea, forefathers, fathers, grandfathers,
    dead friends, or a lio'a-linked formula to save people from the deep, tempest,
    or danger and bring them to shore.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The named beings and ritual forms differ across islands.
- id: motif:3
  label: animal-associated ghost or spirit power
  taxonomy_refs: []
  basis: Daula is connected with the frigate-bird, while Bagea is a shark-associated
    tindalo dwelling in or represented by a shark.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not describe transformation; it describes connection,
    abode, or representation.
- id: motif:4
  label: efficacious formula transmitted by instruction or inheritance
  taxonomy_refs: []
  basis: San Cristoval formulas are handed down or taught for consideration, and at
    Saa a man uses a learned form of words connected with a lio'a and calls on the
    dead teacher who taught it.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not present a mythic narrative of the origin of the formulas.
- id: motif:5
  label: healing by calling back the life or soul
  taxonomy_refs: []
  basis: In Motlav sickness linked to a sacred-place offence is treated by tataro,
    bird or lizard signs, and a call for the sick person's life or soul to come back.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The sick person is not described as dead, so broader death-and-rebirth
    classification would be uncertain.
- id: motif:6
  label: offering or libation to the dead for reciprocal benefit or harm to enemies
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage describes food thrown with tataro for a dead person, water and
    oven rites directed at enemies or weather, loose money scattered in connection
    with a stone offering, and a kava libation to Grandfather asking for animals,
    money, and food to return.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage uses several distinct rite types; not every act is explicitly
    called sacrifice.
- id: motif:7
  label: curse enacted through oven food or steam-water
  taxonomy_refs: []
  basis: Mota formulas at oven-opening and water-pouring target people accused of
    hostile acts and state that they should be dragged away or die.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage reports ritual speech and expected effects but does not narrate
    a full mythic episode.
- id: motif:8
  label: weather request through oven-water tataro
  taxonomy_refs: []
  basis: Water poured into the oven to make steam is accompanied by tataro that may
