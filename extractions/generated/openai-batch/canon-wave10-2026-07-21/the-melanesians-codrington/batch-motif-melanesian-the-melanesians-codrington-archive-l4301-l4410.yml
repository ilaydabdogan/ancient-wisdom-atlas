canonical_text:
  quote: ''
  summary: 'The passage describes initiation practices connected with Qatu, Taputae,
    and Welu institutions on Aurora Island: neophytes undergo humiliating and painful
    ordeals involving spoiled food, fire, trampling, dung, and burning; they learn
    or perform dances; pigs are killed and eaten under restrictions; certain ritual
    objects are kept from outsiders; and the author remarks on dance as the chief
    content of these mysteries.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A neophyte is given underdone or spoiled food and drink, including food mixed
    with ashes or dung, and says refusal would have led to being beaten to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Neophytes are commanded to take up live embers while men stand around them
    with guns.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Neophytes lie on the ground while others run over and stamp on them; afterward
    a man pretends to shoot them with a bow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Qatu is made of tree-fern pieces and caladium, and the neophytes dance
    the Qatu dance after staying in the gamal for a set period.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a period in the gamal, a pig is killed, cooked, and eaten in connection
    with the initiation.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: In the Taputae initiation, a hole is filled with dung and water; the neophyte
    enters it, is covered with dung, then washes in clean water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women and some uninitiated men are not allowed to eat the Taputae pig, and
    the pig is eaten completely at once.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: White-beaten varu bark decorates the Qatu, and an initiated person may burn
    a piece of it while cooking fish to obtain mana for catching that kind of fish.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: If an outsider sees the Qatu bark, the initiated person may kill him or take
    a pig from him, which the members eat in exchange for letting him live.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Welu, a neophyte lies face down in a body-shaped hole while burning
    coconut fronds are cast on his back, leaving scars described as the mark of membership.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Welu trials include cutting a tied bundle of sticks and a tug-of-war; outcomes
    affect contest or the time before neophytes leave the enclosure.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author states that each mystery has its own dance and that no secret knowledge
