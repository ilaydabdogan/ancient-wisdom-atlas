canonical_text:
  quote: ''
  summary: 'The passage defines Melanesian religion in terms of mana: an impersonal
    supernatural power or influence connected with persons, spirits, ghosts, objects,
    words, and practical success. It describes how stones, bones, charms, amulets,
    leaves, teeth, water, and other media may convey mana, how success in gardening,
    fighting, leadership, canoeing, fishing, and hunting is interpreted as evidence
    of mana, and how Melanesians distinguish higher spirits from ghosts of the dead.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes mana as a non-physical, supernatural power or influence
    that can show itself through physical results and practical excellence.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Mana is described as not fixed in one thing and as capable of being conveyed
    through many media, including water, stones, and bones.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man may test an unusual stone by placing it at the root of a tree or burying
    it in a garden; abundant fruit or crops are treated as proof that the stone has
    mana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A stone with supernatural power is explained as having a spirit associated
    with it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A dead man's bone is said to have mana because the ghost is with the bone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A charm of words, often in song form, is called a mana and is powerful because
    the name of a spirit or ghost brings power into it.
  category: speech
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:7
  text: Conspicuous success and social influence are treated as proof that a man has
    mana, and a man becomes a chief by virtue of it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Success in fighting is attributed to mana from a spirit or deceased warrior,
    conveyed through objects or words rather than only through natural ability.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Fertile pigs and productive gardens are attributed to stones full of mana
    for pigs and yams.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Canoes, nets, and arrows are said to require mana for swiftness, abundant
    catches, and mortal wounds.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says Melanesians believe in personal, intelligent beings full
