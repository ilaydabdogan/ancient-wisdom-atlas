  quote: ''
  summary: 'The passage reports Melanesian accounts and practices involving ghosts
    or spirits: children frightened or transported by ghosts, ghost presence tested
    through moving bamboo or other objects, object-led movement contrary to participants''
    stated wishes, and a Torres Islands rite involving ghostly influence, sticks,
    a claimed descent to Panoi, and magical plants after a death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage introduces examples of tricks that ghosts or spirits play on humans,
    or that humans know how to make ghosts or spirits play.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Mota, Peitavunana was frightened and chased by a ghost up a mountain, was
    unsuccessfully sought, and was then located after divination by finger-cracking
    and an announcement by a man from Vanua Lava.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Peitavunana was found at the root of a tree crying for his mother, covered
    with excrement described as ghost food, bleeding from thorns, and holding an unripe
    mammy-apple fruit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Peitavunana said that his dead mother came to him and gave him the food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nungwia, a little boy sleeping on the beach at night, was conveyed by a ghost
    into a very small cavity beneath a rock that he could not have climbed into by
    himself.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Lepers' Island, people build a small decorated forest house with a partition
    and place a long bamboo across both sides of the partition.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men sit in the house at night with hands under one end of the bamboo, shut
    their eyes, and call names of the recently dead until movement of the bamboo identifies
    the present ghost.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After a man named Tanga is named in a question, the bamboo rises, strikes
    him, and sinks back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the men go outside singing with one end of the bamboo, the bamboo leads
    them according to the ghost's choice and makes them do the contrary of what they
    sing they want.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A club placed at night in a sacred cycas-tree moves when a ghost's name is
    called and can lift and drag people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Mota, a basket fastened to a bamboo and filled with food becomes heavy
    as a sign that a ghost has entered it; the bamboo then drags people and can lift
    them when set in a tree.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The author states that the Mota bamboo-and-basket practice resembles a Motlav
    divination method, while also stating that these tricks involve no divination.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Torres Islands, a similar practice is described in which ghosts influence
