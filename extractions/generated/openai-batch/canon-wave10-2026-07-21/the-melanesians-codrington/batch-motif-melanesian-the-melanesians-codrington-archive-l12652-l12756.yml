  quote: ''
  summary: The passage describes Melanesian house forms, including pile-houses, tree-houses,
    chiefs' dwellings, fortified places, and unusual stone structures. It notes traditions
    of human killing or head-taking at the completion of a chief's house or canoe-house,
    and explains tree-houses and forts as refuges from head-hunters.
