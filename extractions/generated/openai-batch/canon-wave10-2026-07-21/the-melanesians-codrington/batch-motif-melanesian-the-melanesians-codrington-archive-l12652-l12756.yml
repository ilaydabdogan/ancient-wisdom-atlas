literal_observations:
- id: obs:1
  text: A visitor from the eastward is said to find houses built on piles in Florida
    and to see tree-houses for the first time in Ysabel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pile-houses are described as dwellings with split bamboo side walls and
    floors, and with faces ornamented in black-stained interlacing bamboo patterns.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chiefs' dwelling-houses can be large, raised buildings; one new house at Honggo
    is described as twenty-four paces long, nine wide, and thirty feet high.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Inside some chiefs' houses, small houses for several wives may be arranged
    against the walls, and a small house on piles may stand in the middle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports that in former days a man's head was taken when a chief's
    dwelling-house or canoe-house was finished; a boy or woman was sometimes bought
    to be killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A tradition is reported that men were crushed under the base of the great
    pillar of such a house when the pillar was set in place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Tree-houses called vako in Ysabel are described as refuges from head-hunters;
    one reached by Bishop Patteson was ninety-four feet above the ground and approached
    by a ladder from a fortified rock.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage describes a fortified place in Bugotu, Ysabel, on a hill with
    steep coral rocks, cleared forest around it, a stone wall, one narrow entrance,
    and a slippery tree trunk laid over a hollow.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Tega, people built a toa, described as an impregnable fort on a rocky knoll
    in the middle of the village, for protection against head-hunters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Gaua, Santa Maria, there are stone platforms carrying small gamal houses,
    with large untooled stones fitted in a regular style.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Gaua stone works also include obelisks, a small dolmen of three stones,
    large wona platforms, and a pig passage with a stone lintel.
  category: object
  evidence_refs:
  - ev:7
