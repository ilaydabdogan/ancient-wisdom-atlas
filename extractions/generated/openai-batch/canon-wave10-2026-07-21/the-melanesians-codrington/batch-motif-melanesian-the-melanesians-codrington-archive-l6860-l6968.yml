canonical_text:
  quote: ''
  summary: 'The passage describes Qat as a non-divine but magically powerful story-cycle
    hero associated with seasonal and natural phenomena. It then recounts the beginning
    of the Story of Qat: Qat is born from a stone mother without a father, names himself,
    has eleven Tangaro brothers, makes things at Alo Sepere, and solves the problem
    of perpetual daylight by acquiring night from I Qong/Night, releasing it, teaching
    sleep, and restoring light by cutting night with red obsidian.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The regular courses of seasons and certain natural effects are ascribed to
    Qat, while irregular rains, winds, and calms are attributed to men influencing
    other vui spirits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The name of Qat is applied to remarkable natural objects and effects, including
    a fungus as his basket, coral as his dish, volcanic sulphur as his sauce, a beam
    of dusty light as his spear, and a solitary cloud-shadow over the sea as his shadow.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Qat should not be given divine rank or treated as lord of
    spirits, but identifies him as a hero of story-tellers who is good-natured, playfully
    mischievous, and powerful in magic.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Qat is the central figure of a varying Banks' Islands
    story cycle, that all agree he was born in Vanua Lava, and that he finally departed
    from the world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qat's mother is named Qatgoro, otherwise Iro Ul; she is described as a stone
    that burst apart and brought him forth. Qat has no father and is born on the road.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Qat grows up and talks at once, asks his mother about his name, and gives
    himself the name Qat because there is no father or maternal uncle to name him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Qat has eleven brothers, all named Tangaro. The first is Tangaro Gilagilak,
    called Tangaro the Wise, and the second is Tangaro Loloqong, called Tangaro the
    Fool.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The last nine Tangaro names are said to be formed from names of leaves of
    trees and plants, and the author states that Tangaro is the same as Tagaro of
    the New Hebrides and Tangaroa of the Polynesians.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Qat and his brothers grow up as soon as they are born and live at Alo Sepere,
    where their mother, turned into a stone, is said still to be visible.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Alo Sepere, Qat begins making things, including men, pigs, trees, and rocks,
    as his fancy takes him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Qat does not know how to make night; daytime is always light, and his brothers
    ask him to do something about the absence of night.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Qat hears that night is at Vava in the Torres Islands, takes a tied pig in
    his canoe, sails there, and buys night from I Qong, Night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A variant says Qat paddles to the foot of the sky to buy night from Night,
    who blackens his eyebrows, shows him sleep, and teaches him how to make dawn.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Qat returns to his brothers with knowledge of night and with a fowl and other
    birds to announce the return of light.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Qat tells his brothers to make bed-places; they plait coconut fronds and spread
    them in the house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: For the first time, the brothers see the sun moving and sinking westward,
    and Qat tells them that a change on the face of the earth will be night.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Qat releases night; something is described as coming out of the sea and covering
    the sky, and the brothers become afraid and ask whether they will die.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Qat instructs his brothers to shut their eyes and sleep; after night lasts
    long enough, the cock crows, birds twitter, and Qat cuts night with red obsidian
    so light shines again.
  category: sequence
  evidence_refs:
  - ev:9
