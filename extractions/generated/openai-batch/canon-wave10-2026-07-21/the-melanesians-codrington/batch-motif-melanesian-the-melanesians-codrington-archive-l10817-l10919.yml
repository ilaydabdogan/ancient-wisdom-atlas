canonical_text:
  quote: ''
  summary: The passage describes Aurora and Mota ideas of non-parental personal origin
    connections, including the Aurora nunu relation and a Mota sacred-pool rite; it
    then introduces beliefs about death, the separated soul, offerings to the dead,
    classes of ghosts in the Solomon Islands, and Florida burial customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Aurora, an unborn child may be imagined to have an original connection
    with a cocoa-nut, bread-fruit, or similar thing; after birth the child is called
    the nunu of that thing and must not eat it or will be ill.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the nunu relation is not considered real parentage;
    the child is described as a kind of echo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A child may also be described as the nunu of a deceased person, with examples
    including Arudulewari and Vilemalas; the passage says this does not mean the child
    is the same person or has the dead person's soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Mota there is no such use of nunuai, but the passage reports a notion that
    a man may be originally connected with something not exactly his atai or tamaniu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Mota man may scatter money into a deep sacred tidal pool, call on near forefathers,
    dive in, and sit on the bottom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the man sees something in the pool, such as a crab or cuttle-fish, he may
    regard it as his real origin and beginning, receive mana from it, and have pigs
    multiply to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: For Maewo and Aurora, the passage distinguishes the soul as tamaniu and reports
    that the body is thought to be the integument of the soul.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that Melanesian customs and beliefs share belief in the
    continued existence of the separated soul and commemorate the dead with feasts
    at which some food is offered to them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Solomon Islands, the passage distinguishes ghosts of power from ghosts
    of no account; the former are sought for help and propitiated, while the latter
    receive no observance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A distinguished man’s ghost is said to retain and strengthen the powers he
    had in life, and worship is offered to him as long as he is remembered.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The ghosts of insignificant persons are described as feared because all ghosts
    are awful, but they receive no worship and become part of the nameless population
    of the lower world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Florida, a dead man’s spirit, tarunga, becomes a ghost, tindalo, while
    the body is spoken of as a dead man, tinoni mate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Florida burial customs described include burial in garden ground, village,
    or house depending on status; avoidance of treading on graves; sanctuary status
    for the burial-place of a worshipped tindalo; and sometimes digging up the skull
    and hanging it in the house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Florida burial customs also include burying men and women with feet turned
    inland, returning from the funeral by a different road so the ghost will not follow,
    and burying the dead with money, porpoise teeth, and ornaments, with bracelets
    upside down.
  category: action
  evidence_refs:
  - ev:8
