  text: They cut down trees across roads and pulled down coconut palms and large trees
    at night as evidence that ghosts were abroad.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After bamboos had been cut down, a three-day period was appointed for the
    inland movement of the ghosts, explicitly identified as the Matambala.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men of the Matambala came from the beach with bull-roarers and bundles of
    coconut fronds, beat and whirled them, and made whistling and clucking sounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women in the villages shut their houses, were afraid because they believed
