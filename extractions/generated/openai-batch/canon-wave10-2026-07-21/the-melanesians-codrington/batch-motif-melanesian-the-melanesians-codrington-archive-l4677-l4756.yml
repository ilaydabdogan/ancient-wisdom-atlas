canonical_text:
  quote: ''
  summary: The passage describes the Matambala using a pretended association with
    ghosts to frighten villagers, rob, block roads, steal pigs for sacrifice to Siko,
    and conduct night visits with bull-roarers, frond bundles, whistles, and leaf
    cloaks. Women prepared and passed food to the supposed ghosts while avoiding direct
    contact. The passage then describes the collapse of the Matambala mysteries through
    exposure, admission of Florida youths into the Banks' Islands salagoro, Christian
    conversion of a ritual specialist, exploration of sacred precincts, and profanation
    of bull-roarers. It ends by noting possible functional resemblance between boy
    seclusion in Malanta and Ulawa and entrance into the salagoro.
  language: English
  quote_policy: summarized
