canonical_text:
  quote: ''
  summary: The passage describes Melanesian chiefly authority as partly hereditary
    but chiefly dependent on martial reputation, public opinion, wealth, retainers,
    and belief that chiefs communicate with powerful ghosts and possess mana. It gives
    examples involving Takua of Boli/Mboli and Dikea, explains fines and taboo-like
    prohibitions, and notes both abuse and decline of chiefly power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hereditary succession among chiefs is present but described as less operative
    than it appears.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: Takua of Boli/Mboli, though not native to Florida, gained prominence after
    taking a principal part in a victory at Ta na ihu, establishing his reputation
    for mana.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A term for chief in Malanta, Ulawa, and San Cristoval is explained as meaning
    literally great death or war, and the passage links chiefship with being a warrior.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:4
  text: A native account says chiefly power rests on belief that chiefs communicate
    with powerful ghosts, tindalo, and have mana by which they can use tindalo power.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A chief may pass knowledge of approaching and using tindalo power, along with
    possessions, to a son, nephew, grandson, or chosen relation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Obedience to a chief and payment of fines are supported by public recognition
    and fear that the chief can bring calamity and sickness through tindalo power.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A chief has retainers, mostly young men, who live in his canoe-house, do his
    bidding, fight for him, enforce punishment or rapine, share his wealth, and may
    settle around him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A chief can forbid an action under penalty of a fine, described as a form
    of taboo, and can send women or boys to dun the offender or retainers to destroy
    and carry away property.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists abuses of chiefly power, including oppression, seizure of
    land and property, increasing a stock of heads, and accepting payment to have
    an enemy killed; Dikea is given as an example.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A chief's power may decline through old age, inactivity, parsimony, loss of
