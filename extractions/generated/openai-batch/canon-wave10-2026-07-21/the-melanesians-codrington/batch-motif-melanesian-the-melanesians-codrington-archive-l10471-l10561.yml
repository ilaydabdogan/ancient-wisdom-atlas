  quote: ''
  summary: The passage describes practices concerning adultery, fines, killing, chiefly
    intervention, divorce, bridewealth, levirate succession to widows, and signs of
    widowhood mourning in several Melanesian islands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adultery is described as formerly treated strictly; the male adulterer could
    be killed, though payment of a fine often mitigated punishment, and in Florida
    a woman involved could be made a rembi for the chief's profit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Saa, adultery in a chief's family could lead to killing, exile, or a large
    fine; among lesser men, friends of the husband and adulterer might fight over
    damages.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After an adulterer was killed, a chief could make a bea stage, reward the
    killers, and at Saa perform the tofo 'akalo sacrifice to clear danger connected
    with causing death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Banks' Islands and Northern New Hebrides, the adulterous man could
    be shot or clubbed by the husband or his friends, while the woman could be beaten,
    scolded, and threatened; settlement often involved money and pigs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A jealous or incensed wife, and likewise a jealous or quarrelling husband,
    is said formerly to have used several forms of self-killing or self-harm; the
    passage adds that later it became easy to leave with another spouse on a labour
    vessel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Divorce is described as easy and common, but complicated by property given
    for the wife; amicable separation could involve return of what was received or
    settlement by pigs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that levirate practice obtains, because the wife was obtained
    through family contributions and another male relative could take the deceased
    man's place so the property would not be lost.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Lepers' Island, a more distant cousin seeking a widow could add a pig to
    a death-feast and give another pig to the widow's sisters; if two men contended,
    the widow selected one and the successful suitor gave a pig to the disappointed
    one.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that once payment has been made for a woman, she belongs
    generally to the family who paid, and gives an example of a man handing one of
    his own wives to his sister's son.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Widowhood or widowerhood includes a period and signs of mourning, including
    grey shell tassel earrings, short hair, soot and ashes, food abstinence, and a
    ganaro rope around the neck.
  category: attribute
  evidence_refs:
  - ev:7
