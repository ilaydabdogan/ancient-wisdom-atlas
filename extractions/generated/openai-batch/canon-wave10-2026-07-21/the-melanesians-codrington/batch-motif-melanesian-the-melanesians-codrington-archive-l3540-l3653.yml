canonical_text:
  quote: ''
  summary: The passage describes Melanesian secret societies that conceal mysteries
    from women and the uninitiated, use masks, disguises, cries, sounds, and claims
    of ghostly association, and are compared across named regional institutions. It
    emphasizes that the societies are not chiefly age-grade initiations like the Australian
    bora and that neophytes learn practical secrets of performance rather than secret
    doctrine or special worship.
  language: English
  quote_policy: summarized
