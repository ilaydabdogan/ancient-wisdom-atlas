  summary: The passage describes stories and beliefs about vui spirits, Nopitu or
    Dembit spirit-beings and possessed persons, manifestations involving food, money,
    singing, possession, women as familiars or mothers of spirits, and the high status
    of Qat in Banks' Islands belief as a maker or fixer of natural conditions.
  language: English
