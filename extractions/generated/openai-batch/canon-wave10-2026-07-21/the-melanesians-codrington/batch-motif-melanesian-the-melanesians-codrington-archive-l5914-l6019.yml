canonical_text:
  quote: ''
  summary: 'The passage describes Florida and Bugotu terms for sacrifice and gives
    an ethnographic account of offerings to tindalo: public shrine procedure with
    fire, food, ritual plants, petition, and shared food; an all-direction invocation
    of Manoga; division-associated and domain-specific tindalo approached by specialists
    with inherited knowledge; and annual first-fruits and harvest sacrifices involving
    canarium nuts, pig, fish, and food offerings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Florida sukagi and Bugotu liavugagi are given as words corresponding to sacrifice,
    with an offering made to a tindalo at a place of sacrifice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a public sacrifice, the people assemble near but outside the sacred place;
    boys are present, women are not, and prepared food is not eaten until the offering
    is made.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sacrificer enters the shrine with his son or an instructed person and
    makes a fire of small sticks while muttering words of mana, without blowing the
    fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some prepared food, carried in a basket lined with dracaena and other tindalo-specific
    leaves, is thrown onto the fire while the tindalo is named, invited to eat, and
    petitioned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fire blazing up is treated as a favorable sign that the tindalo are present
    and blow the fire, and the food is consumed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the offering, the sacrificer eats the remaining food, gives some to
    his assistant, and then portions are distributed to the people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a pig is killed for the occasion, the heart in Florida or the gullet in
    Bugotu is burned on the sacrificial fire.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: In sacrifices to Manoga, the offering is lifted and the tindalo is called
    from the east, west, every quarter, heaven, named star groups, below, the distant
    sea, the sun or moon, inland, and the shore.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each named family division is said to have a tindalo worshiped as its own
    and vaguely called its ancestor, with examples including Polika, Barego, Kuma,
    Sisiro, and Tindalo tarn Ln.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sacrificer is identified as the man who knows the proper leaves, creepers,
    dracaena, ginger, tree shavings, and words of mana; this knowledge is said to
    have come from predecessors.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sacrificer of the dominant family division is described as the ostensible
    chief, while sacrificers of less numerous divisions are minor chiefs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some tindalo are associated with particular spheres, such as Daula in the
    sea, Pelu in gardens, and Hauri in fighting; only people knowing the proper approach
    can sacrifice to them before a voyage, planting, or fight.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Ugo first-fruits sacrifice takes place when the canarium nut is ripe,
    and no one may eat the nuts until the first-fruits offering has been made.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: At Ugo, the knowledge-holder climbs a tree, gathers and eats some nuts, places
    some on stones for the tindalo, and thereby opens general gathering; a chief then
    offers food mixed with new nuts at the village sanctuary.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: About two months after Ugo, a general harvest sacrifice called sukagi karango
    is performed, and private harvest sacrifices may also be made; pig or fish is
    offered at the general sacrifice.
  category: sequence
  evidence_refs:
  - ev:10
