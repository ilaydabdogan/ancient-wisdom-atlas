literal_observations:
- id: obs:1
  text: The chapter presents arts of life—canoes, houses, gardens, weapons, fishing,
    food, clothing, ornaments, and money—as observable aspects of Melanesian culture.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inhabitants of island groups are described as likely to be seafaring people,
    and canoes are among the first objects noticed by visitors.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author contrasts outriggered tree-trunk canoes of the New Hebrides and
    Banks' Islands with decorated plank-built craft of the Solomon Islands.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sailing outrigger canoe is described as characteristic of Melanesia; plank-built
    canoes are said to be seen only in the Solomon Islands, where small outrigger
    canoes are also used.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Double canoes are said not to be seen in these islands, unlike Fiji; the Banks'
    Islands and New Hebrides aka, angga, or wangga is identified as related to the
    Fijian wangga.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Large New Hebrides sailing canoes can carry forty men and use a single dug-out
    trunk for the hull, with planked sides and decks tied on with sinnet.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The labour trade and recruiting are described as making natives afraid to
    move about and as involving destruction of canoes for crew capture; earlier red
    butterfly sails were common in island scenes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Mota aka sail is made of mats woven by women and sewn together by men with
    tree-fern wood needles or ray-sting bone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Mota canoe has named parts including sail, mast, yoke-pieces, outrigger,
    boom, ropes, steering paddle, and stern horn; its safety depends on the attachment
    between outrigger and hull.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Former canoe construction used shell adzes for shaping and a volute-shell
    columella for boring lashing holes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A large canoe may be owned by several men or by one important person, and
    money is paid for hire and freight.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: All canoes of any size have names, and when a new canoe first lands away from
    home its crew is pelted in a friendly way.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Santa Cruz canoes are described as better in workmanship and form but substantially
    the same as the previously described canoes; large sea-going loju carry a stage
    on either side.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Torres Islands, people in recent years had no canoes and used bamboo
    catamarans for crossings after their canoe-makers had died out.
  category: sequence
  evidence_refs:
  - ev:9
