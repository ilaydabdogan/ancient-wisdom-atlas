canonical_text:
  quote: ''
  summary: The passage describes Melanesian accounts of possession by ghosts or spirits,
    including madness, prophecy, diagnosis by calling names of the dead, cures using
    charmed water, smoke, burning objects, and strong-smelling leaves, and cases where
    the dead speak through living people to reveal hidden knowledge or complain about
    family and property matters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that people distinguish ordinary delirium in sickness from
    acts and words attributed to possession, and that lunatics are pitied and treated
    kindly though remedies may be rough.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Florida, Kandagaru of Boli lost his mind, chased people, stole and hid
    things; people did not blame him because they said he was possessed by a tindalo
    ghost, and a hired wizard removed the ghost so that he recovered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Lepers' Island, a man's loss of senses was connected by local conjecture
    with unwittingly treading on a sacred place belonging to Tagaro and with the anger
    of a recently deceased sacrificer's ghost.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Doctors in the Lepers' Island case called names of likely offended dead men,
    washed the possessed man with charmed water, and burned the vessel that had held
    the water under his nose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A similar cure involved putting bits from the fringe of a mat belonging to
    the deceased into a coconut shell and burning them under the possessed person's
    nose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In another Lepers' Island case, a man removed his malo and went naked at a
    feast, drew his bow at people, and carried things off; the people pitied him and
    tried to cure him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In that island, when a possessed man spoke, it was said to be not with his
    own voice but with the voice of the dead man possessing him, and he could find
    hidden objects such as a bow or club.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Saa, a possessed man speaks with the voice of a powerful deceased man,
    has bodily contortions, is called by the dead man's name, eats fire, lifts enormous
    weights, and foretells future things.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Banks' Islands, people distinguish between a ghost entering a man for
    a particular purpose and a homeless wandering ghost, called a tamat lelera, that
    wanders mischievously.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Under the influence of a wandering ghost, a man was said to move with supernatural
    quickness, shout from trees on opposite sides of a village, utter sounds no sane
    man could make, and possess great strength.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Friends seized a man under wandering-ghost possession, held him in smoke of
    strong-smelling leaves, and called names of dead men until the right name made
    the ghost depart; the treatment sometimes failed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A ghost from Panoi, the abode of the dead, could enter certain susceptible
    men for a purpose; the man would see a ghost, come home, lie down sick, and answer
    questions in the ghost's voice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: When asked what was wrong, the possessing voice answered, 'It is not he, it
    is I,' and when the right dead person's name was called it answered, 'It is I.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Panoi ghost wept and said it had come back because its wife and family
    were not properly cared for or its property was being wasted; it scolded relatives
    and told them unknown things such as where lost property could be found.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Strong-smelling leaves were brought to drive the Panoi ghost away; the possessed
    man detected them even when hidden, struggled and howled when they were put to
    his nose, seemed to die, and then later returned to his senses with no memory
    of what had happened.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage says that such a medium was not a wizard by profession, though
    he might find it worthwhile to receive ghostly visits.
  category: attribute
  evidence_refs:
  - ev:10
