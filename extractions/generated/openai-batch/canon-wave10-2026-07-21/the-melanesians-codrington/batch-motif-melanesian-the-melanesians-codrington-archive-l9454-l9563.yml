comparison_claims:
- id: claim:1
  claim: Within the passage, Florida, Lepers' Island, and Banks' Islands cases share
    a functional pattern in which ghost-caused affliction is addressed by a specialist
    or friends through removal, name-identification, washing, burning, smoke, or strong-smelling
    substances.
  claim_level: same_function
  target: nearby Melanesian island accounts of ghost-possession cure
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  - ev:9
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The local causes and treatments differ, and one treatment is said sometimes
    to fail.
- id: claim:2
  claim: Within the passage, Lepers' Island, Saa, and Banks' Islands accounts share
    a pattern in which a dead person is recognized through voice or name and speaks
    through a living possessed person.
  claim_level: same_function
  target: dead speaking through a living medium in the passage's Melanesian examples
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The examples range from madness to prophecy to purposeful complaint,
    so the shared comparison is functional rather than identical in narrative setting.
- id: claim:3
  claim: The Panoi ghost episode has limited functional overlap with a broad return-from-the-dead
    motif family because the dead person comes back from the abode of the dead to
    address unfinished family and property matters among the living.
  claim_level: same_function
  target: return motif family
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:9
  confidence: low
  limitations: The episode is temporary possession and expulsion, not a full afterlife
    journey or bodily return narrative.
