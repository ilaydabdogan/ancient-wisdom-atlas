canonical_text:
  quote: ''
  summary: 'The passage gives several Melanesian story excerpts: Muesarava makes deadly
    arrows from human bones and is later killed when his enemies adopt the same method;
    a preserved dead-man''s-bone arrow is believed to contain supernatural power;
    Tagaro departs after an attempted pig theft, taking good things away; Tagaro''s
    contained saltwater pool is accidentally opened by his children and becomes the
    sea; Tagaro the Little finds fish and calls them with a song, while Merambuto
    imitates the call and catches the fish.'
  language: English
  quote_policy: summarized
