canonical_text:
  quote: ''
  summary: The passage describes Melanesian death-meals or funeral feasts, food offerings
    or commemorative portions set aside for the dead, local variations in counting
    death-days and concluding rites, and beliefs about ghosts travelling to Panoi
    through entrances called sura, where other ghosts may receive and guide them.
    It also notes class-specific gathering places for ghosts, including a pleasant
    flower-filled place for youths who died young.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A series of funeral feasts or death-meals follows the funeral or may begin
    before it, and is described as a major form of commemoration of the dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The number and duration of death-meals vary by island and by the regard in
    which the deceased is held.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A morsel or bit of food is set aside for the dead with spoken words addressed
    to the deceased or dead generally.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The account reports that people deny the dead are now thought to come and
    eat the food, explaining it as friendly remembrance and association across death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The death-meal cycle called gana matea begins with burial, first with eating
    the grave and then with eating named days such as the fifth, tenth, successive
    tenth days, and sometimes up to the thousandth day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Local examples include corpses placed between fires, mashed yams brought to
    the place of the dead man, repeated ovens or fires for death-meals, cycas fronds
    used for counting appointed days, and pigs or sows killed for communal meals.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: At Lakona, a deceased person may be buried, laid out in a chest, or placed
    in a cave, with no food or water put with the body.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: For a great man at Lakona, a drum may be brought out and people dance to drive
    away grief so they can eat the death-meal cheerfully.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ghost leaves its former dwelling-place and makes its way to Panoi through
    entrances called sura, including rock, mountain, volcanic vent, and great mountain
    entrances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ghosts gather on points of land and at sura mouths, where they are heard dancing,
    singing, shouting, and whistling on moonlight nights.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some people think ghosts already descended can return to receive the freshly
    dead, show them haunts, and conduct them to the underworld.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some sura are associated with particular classes of ghosts, including simple
    harmless people and youths who die in the flower of their age.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The place for youths who die young is described as more pleasant than others,
