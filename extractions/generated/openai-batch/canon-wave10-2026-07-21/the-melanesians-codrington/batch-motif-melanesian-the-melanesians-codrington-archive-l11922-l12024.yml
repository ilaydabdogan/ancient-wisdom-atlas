canonical_text:
  quote: ''
  summary: 'The passage describes a Melanesian account of ghosts approaching Banoi,
    a lower-world place reached through a hollow near the sacred ghost hill Tawu.
    Newly arrived ghosts face attack, deprivation, or danger depending on earthly
    conduct and ritual status, while planting pandanus, piercing ears, tattooing,
    and joining the Suqe affect afterlife conditions. It then describes Aurora funeral
    practices: wrapping the corpse in mats and vines, wailing, burial near the gamal,
    prolonged mourning restrictions, grave-stone rites, pig-killing, and a liver offering
    addressed to the dead person so that the dead may have proper existence.'
  language: English
  quote_policy: summarized
