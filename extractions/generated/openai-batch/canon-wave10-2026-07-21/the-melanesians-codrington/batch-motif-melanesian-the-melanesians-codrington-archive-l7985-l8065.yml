canonical_text:
  quote: ''
  summary: The passage describes sacred stones in the Banks' Islands and New Hebrides
    as associated with spirits and mana. Such stones may bring money, success in war,
    fishing, or crops, but may also cause harm if approached improperly. Offerings,
    sacrifices, anointing, and expert mediation are used to engage the spirits connected
    with stones. Some stones are described as transformed beings or ancient growths
    from a time of darkness; portable stones may be buried in gardens or used to transfer
    mana to other stones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marks, shapes, and names of stones are used to identify a stone's character
    and its association with a spirit; some stones are connected with bringing money.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the spirit is not the body or soul of the stone, but
    is at or near the stone, and that the spirit rather than the stone acts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some stones have established sanctity; only people who know how to approach
    the spirit visit them for sacrifice, while others avoid the sacred ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person who accidentally intrudes on a sacred place seeks the services of
    a person who knows the stone, so that an offering can be made to avert accident
    or sickness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some stones are regarded as sinister or dangerous; a man's shadow falling
    on certain stones is dangerous, and offerings are made to keep the spirit in good
    humour.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A stone useful for success in fighting may harm someone if proper observance
