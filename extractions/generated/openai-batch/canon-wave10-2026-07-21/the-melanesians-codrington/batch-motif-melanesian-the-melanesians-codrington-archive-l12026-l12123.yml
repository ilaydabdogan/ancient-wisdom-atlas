canonical_text:
  quote: ''
  summary: The passage describes mortuary feasts and rites in Aurora and Lepers' Island
    contexts, including a hundredth-day feast with ritual striking, beliefs that ghosts
    take the nonmaterial essence of food offerings and go to Banoi, an origin-of-death
    narrative in which humans lose the former ability to renew themselves by changing
    skin, and Lepers' Island practices surrounding the soul's departure, burial in
    mats, and repeated death-meals for ghosts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Tanoriki in Aurora, a hundredth-day feast after a woman's death included
    killing pigs, mashing and distributing yams, and men collecting long pointed ginger
    rods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the Tanoriki practice, incoming men carried baskets on their heads
    with both hands and were struck with rods hard enough to shatter the rods and
    leave wheals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the described death-meal, people assemble to eat, remember the dead person,
    and weep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a belief that ghosts and the recently dead return for
    the feast and carry away food and pig's flesh in a figurative sense, taking the
    tamani of the food rather than the physical objects.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A small grave offering of mash, coconut, or pig is treated as food for the
    dead person, though the physical offering remains present.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ghosts are said to go down rejoicing to Banoi with shouting and songs,
    and the repeated attention to the dead continues until the hundredth day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Lepers' Island, the origin of death is connected with the loss or absence
    of a power to change skin.
  category: other
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:8
  text: In one account, a woman argues that the crab is better than humans because
    it changes its shell, becomes young again, and lives long; she wants to exchange
    bodies with the crab and blames Tagar for not making humans rightly.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: In a related story, two boys block a brook, a Tahitian chestnut comes down
    the stream, one boy gives it to his grandmother to roast, and the other boy later
    eats it without being noticed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the chestnut is missing, the first boy scolds the grandmother, and she
    angrily says the boys do not wish to live forever.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The grandmother had changed her skin in upstream water; the boys had seen
    the cast-off skin, picked it up with a stick, and thrown it out of the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The grandmother puts the cast-off skin on again, and the passage states that
    since then mankind lost the power of changing skins and all have died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: At death, the soul called tamtegi departs from the body; wailing begins when
    its departure is certain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The tamtegi is first thought not to go far away; it is not driven away except
    in the case of a person who has been eaten, whose soul is driven off with conch-blowing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage states that the soul goes when the time comes, and that this time
    is one hundred days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The corpse is buried wrapped in mats that serve as money; the example of Mairuru
    uses an unusually large number of mats because he was a great man.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: After the funeral, pigs and fowls are killed, fowls are roasted, and the chief
    mourner gives named dead persons morsels of fowl and yam before eating the remainder
    and allowing mourners to eat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: Death-meals are repeated at specified intervals, including the day of burial,
    the fifth day, the tenth day, every fifth day, the fiftieth day, and finally the
    hundredth day.
  category: sequence
  evidence_refs:
  - ev:8
