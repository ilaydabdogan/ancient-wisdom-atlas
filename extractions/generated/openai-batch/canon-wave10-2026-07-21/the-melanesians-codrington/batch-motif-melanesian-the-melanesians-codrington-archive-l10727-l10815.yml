canonical_text:
  quote: ''
  summary: The passage explains several Melanesian terms and ideas concerning life-principles,
    shadows, reflections, personal doubles, and sensory after-impressions. It describes
    talegi as necessary to life and health, vulnerable to ghosts; atai and tamaniu
    as intimate second-self relations sometimes connected to objects or animals; shadow
    and reflection as possible media of harm; and nunuai as a real but formless recurrent
    sensory impression.
  language: English
  quote_policy: summarized
