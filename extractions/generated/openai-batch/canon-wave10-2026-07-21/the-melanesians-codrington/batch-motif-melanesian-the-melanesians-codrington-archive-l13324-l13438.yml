canonical_text:
  quote: ''
  summary: An ethnographic passage describes Melanesian fishing as a major source
    of subsistence and surveys methods, implements, local variations, communal fish-driving,
    shark-catching, traps, freshwater fish, and the naming and measuring of very large
    eels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large part of Melanesian subsistence is described as generally derived from
    the sea, with shore character affecting the extent of fishing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shell-fish, octopus, and reef foods are in daily request, and fish are caught
    by angling, nets, shooting or spearing, woven pots, poison, and torches at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fish-hooks are described as formerly common and made of tortoise-shell, mother-of-pearl,
    wood backing, lashings, and sometimes beads, with small hooks praised as skilful
    handiwork.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Flying-fish are caught with a double prickle rather than a hook; canoe fishing
    for them uses a very long light line and a weighted float sometimes shaped like
    a bird.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Nets are described as fine, large, and strong; one square net uses diagonal
    elastic rods so that hauling the line closes the net into a bag around a fish.
  category: object
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: Fishing with a kite is practiced in the Solomon Islands and Santa Cruz; a
    kite flown from a canoe drags a line with spider's web or fibre so that a fish's
    teeth become entangled.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Lepers' Island small fish are caught in spider-web nets, and in the Banks'
    Islands children drive fish into barricades of dead coral.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'At San Cristoval an outrigger canoe with a bamboo stage is used for shark-catching:
    one man paddles, another shakes coconut shells, substitutes a fish, readies a
    noose, and clubs the shark after it is hauled onto the stage.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Between Ra and Motlav, a shoal of fish is driven into shallow reef by a long
    line of natives shouting and beating the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Lakona reed fences lead fish into circular enclosures as the tide retires,
    and in the New Hebrides stone walls are used to hold fish back as the tide ebbs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Santa Maria lake, large eels enter pits dug by the lake margin when the
    water rises and are left behind when it recedes, then shot and speared.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The very largest eels are given names of rank after the Suqe, and a measuring
    line for a remarkable specimen may be hung in the gamal.
  category: relationship
  evidence_refs:
  - ev:7
