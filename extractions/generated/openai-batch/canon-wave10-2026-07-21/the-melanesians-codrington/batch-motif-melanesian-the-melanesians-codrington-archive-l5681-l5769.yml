canonical_text:
  quote: At any rate the objects of religious worship are all tindalo ; and every
    tindalo was once a man.
  summary: The passage describes how a powerful dead man may become a worshipped ghost
    or tindalo, gives the case of Ganindo’s posthumous war cult in Florida, and notes
    beliefs about tindalo, keramo, relics, offerings, and regional named ghosts.
  language: English
  quote_policy: quoted
