- id: obs:3
  text: A ghost’s cult is established if its power appears; if no proof of activity
    appears, the ghost is forgotten.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ganindo was a great fighting man in a head-hunting expedition; he was shot
    near the collar-bone by Lumba of Gaeta, later died, and was buried on Bonipari
    hill.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Ganindo’s burial, his head was taken, a basket was woven for it, a house
    was built for it, and he was called a tindalo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: During an expedition, men stopped paddling in a quiet place and waited for
    the canoe to rock; after names of tindalo were called, the canoe shook again at
    Ganindo’s name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same method was used to learn which village to attack.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After returning successfully, the men threw a spear into the roof of Ganindo’s
