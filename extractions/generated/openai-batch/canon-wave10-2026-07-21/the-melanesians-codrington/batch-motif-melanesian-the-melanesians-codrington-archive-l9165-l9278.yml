canonical_text:
  quote: ''
  summary: The passage describes Melanesian divination and ordeal practices. Divination
    uses leaves, ghost-entered bamboo, bodily joint-cracking, and post-burial bamboo
    rites to diagnose illness, find culprits, locate lost persons or objects, and
    determine life or death. Ordeals use heated stones, fire, charmed food, sacred
    objects, oaths, alligators, arrows, charms, and Tagaro’s protection to clear or
    convict accused persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A practitioner takes leaves, creepers, and bark associated with tindalo, goes
    to the sacred place of his gogondo, ties the leaves to his body, and splits dracaena
    leaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A crookedly split leaf indicates the corresponding tindalo is eating the sick
    man; a clean split for the patient indicates recovery, while a crooked split indicates
    death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Motlav and other Banks' Islands, a bamboo into which a ghost had entered
    was said to point by itself to a thief or other culprit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The so ilo method uses lifted and rubbed hands, a magic song calling on a
    ghost, and cracking joints to answer questions about lost persons or things, theft,
    and whether someone is alive or dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a Motlav burial-related rite, a bag and long bamboo are placed on a grave;
    the ghost enters the bag and bamboo, names are called, and the bamboo’s movements
    identify the ghost or answer questions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says ordeals are managed by men who possess magic instruments
    and know charms, and that these ordeals are used to clear or convict an accused
    person.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Saa stone ordeal, a compurgator heats a magic stone and throws it from
    hand to hand; if his hands are not burned, the accused is declared innocent and
    pays a fee.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Other ordeals apply a lighted bundle of coconut fronds to the accused's legs,
    require swallowing a heated charmed stone, or require eating charmed coconut or
    almonds from a sacred place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A very ancient spear called usu is placed on the accused's head while he utters
    a conditional death oath; a sacred song can also be sung while the accused asks
    that he and his children suffer if guilty.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the alligator ordeal, a wizard calls alligators with charms, and the accused
    swims across; if he escapes, no one holds him guilty.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In Lepers' Island, a man may prove innocence by being shot at with arrows;
    being hit indicates guilt, while Tagaro is said to protect the innocent.
  category: action
  evidence_refs:
  - ev:10
