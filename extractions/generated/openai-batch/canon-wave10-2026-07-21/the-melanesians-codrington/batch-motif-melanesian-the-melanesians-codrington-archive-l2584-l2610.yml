canonical_text:
  quote: ''
  summary: The passage describes rules of speech, naming, bodily avoidance, and respect
    among relatives by marriage in Lepers' Island, then contrasts Araga/Pentecost,
    where restrictions between parents-in-law and a child's spouse are slight and
    speech reserve chiefly concerns engaged couples before the completion of property-giving
    for the girl, called lalag.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Lepers' Island, a man and his mother-in-law speak to one another but do
    not come near; when he speaks to her, she turns away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mother-in-law or father-in-law may use the name of a daughter's husband
    or son's wife when speaking about them to others, but cannot use the name in direct
    address.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a woman calls to her son-in-law, she addresses him with a plural second-person
    form, and a message to him may use his name in the third person.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A daughter-in-law does not avoid her husband's father, and a man may send
    his wife with messages to his father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man will not speak the name of his wife's brother; he refers to him as brother-in-law,
    addresses him with plural second-person speech, and turns aside if he meets him
    on the path.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that only in the wife's-brother case does the name appear
    never to be spoken, and that reserve among connections by marriage is much less
    marked than between brother and sister.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: No one will step across another person's legs or take anything from over another
    person's head, especially a brother's; this is regarded as serious disrespect.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In neighbouring Araga, Pentecost, intercourse between fathers- and mothers-in-law
    and a daughter's husband or son's wife is described as very little restricted.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Araga/Pentecost, the main or only speech reserve is said to be exercised
    by engaged couples before the giving of property for the girl is complete; this
    reserve is called lalag.
  category: sequence
  evidence_refs:
  - ev:6
