canonical_text:
  quote: ''
  summary: The passage describes Banks Islands practices and beliefs around dying,
    the departing soul, ghosts lingering near house and grave, burial duties and locations,
    alternative corpse treatments, the funeral display of a man of rank, an address
    to the ghost concerning Panoi, and grave provisions of food and water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People rouse a dying person and shout the person's name into the ear in hope
    that the soul will hear and return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman at Mota caught a rustling, fluttering thing she identified as the
    atai and opened her hands above a corpse's mouth to restore it, but the person
    did not recover.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ghost is said to remain near the body, house, and grave for five or ten
    days and to show presence by noises in the house and lights on the grave.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Banks Islands it is generally not desired that the ghost remain beyond
    the fifth day, and people drive it away with shouts, conch-blowing, and in some
    places bull-roarers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dead in the Banks Islands are generally buried, and members of the other
    Veve are responsible for digging the grave.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Burial time and place vary with the deceased person''s status or relation:
    ordinary burial may occur on the second day, a great man may be buried near the
    gamal, and a favourite child may be buried in the house.'
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: When a child was buried in the house, the grave could later be opened after
    fifty or a hundred days, with bones hidden in the bush or some hung in the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some bodies were not buried but placed in a chest in the bush or in a shallow
    cave under a projecting rock; in some places the body could be kept unburied and
    putrefying in the house as a sign of affection.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Gaua, women watched a corpse laid on a mat over cross sticks between two
    slow fires for ten days or more and drank the drippings of the corpse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The corpse of a man of rank at Motlav was displayed in the village open space
    with ceremonial dress, necklace, red earth on the forehead, reversed tusk ornaments,
    rank leaves, and society leaves.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Food items were heaped beside the ranked corpse together with a particular
    dracaena leaf bunch, and these items were afterwards placed on the grave.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: A speaker addressed the ghost, telling him what to say in Panoi when asked
    whether he was a great man, and could openly mention faults and doubt the ghost's
    entry if the man had a bad character.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: After burial, a bamboo water vessel with a coconut-shell cup and a dish with
    roasted yam were placed on the grave; food eaten by rats was renewed because the
    rat might be the deceased during the first five days.
  category: action
  evidence_refs:
  - ev:11
