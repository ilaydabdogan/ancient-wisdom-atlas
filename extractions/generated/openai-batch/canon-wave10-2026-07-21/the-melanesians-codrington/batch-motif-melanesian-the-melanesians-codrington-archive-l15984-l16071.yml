canonical_text:
  quote: ''
  summary: A woman and her child obtain garden food without visible harvesting. Her
    husband disbelieves her, beats her, says she belongs above the sky, and tells
    her to return to her own country. She burns banyan leaves; the smoke rises to
    the clouds and she ascends in it, leaving the child crying. An editorial note
    says Spider later makes a line from earth to heaven and carries the man and child
    upward, where the child recognizes its mother. The passage then begins the Mota
    story of Ganviviris, an orphan and idle avlava who goes to the beach to shoot
    fish, sees a sauma, and hears an unseen voice urging him to shoot.
  language: English
  quote_policy: summarized
