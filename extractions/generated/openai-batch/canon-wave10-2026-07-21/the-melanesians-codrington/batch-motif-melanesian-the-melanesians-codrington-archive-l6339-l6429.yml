  summary: The passage describes oloolo or sacrificial offerings involving stones
    connected with spirits, Qat’s tree stump, familiar creatures, and awe-inspiring
    natural places. Money and other items are deposited by or through right-holders
    to seek healing, prosperity, fighting success, canoe safety, favor, or appeasement.
    The passage emphasizes that offerings are directed to person-like spirits rather
    than to stones, streams, trees, or animals as mere objects.
