canonical_text:
  quote: ''
  summary: 'The passage describes the Great Tamate secret resort in the Banks'' Islands:
    its secluded, marked path; exclusion of women and uninitiated persons; masks or
    hats and other objects kept there; a hidden sound-making apparatus understood
    by outsiders as the voice of ghosts; an origin account in which two members kill
    an old woman and take the apparatus; and requirements for admission involving
    a valued pig, fasting, money deposits, seclusion, and service.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Tamate lodge or secret resort is called the mlagoro and is established
    in a secluded place, generally among lofty trees near a considerable village or
    group of villages.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The path to the resort is marked from the public path with orange-colored
    fruits on reeds, flowers, cycas fronds, and soloi taboo marks; the marks repeat
    until the open space of the building.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The marks prevent intrusion because they represent the force of the association;
    the place is described as tapu, set apart by sufficient authority, but not rongo,
    sacred.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women and uninitiated persons do not approach the place, while certain foreigners
    may be admitted if no initiation or special celebration is occurring.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some members use the place as a club for meals, and newly admitted members
    may prepare meals, sweep, and remain there for a fixed number of days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A coconut may be pointed out as representing someone whose personal attendance
    has been excused.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Hats and dresses from the last dance or public demonstration may be inspected;
    the hats cover the whole head and meet a cloak fringed with cycas leaves.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The hats are made of bark, painted with vegetable preparations that are a
    fraternity secret, and adorned with scarlet seeds of abrus precatorius.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: A concealed apparatus makes a peculiar impressive sound that outsiders believed
    to be the cry or voice of ghosts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The apparatus consists of a flat smooth stone on which the butt-end of the
    stalk of a palm fan is rubbed; the fan vibration produces a modulated sound.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: An origin account says two Great Tamate members in Vanua Lava heard an unearthly
    sound near a ghost-haunted point of land and found an old woman making it while
    rubbing shells for money on a stone under her palm-leaf umbrella.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The two men recognized the usefulness of the discovery for their mysteries,
    killed the old woman, and carried off the stone and umbrella.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Before admission to the Great Tamate, the candidate or his friends must perform
    an action described as 'usnr' with a valued pig called rawe, and a period of fasting
    is required.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: During admission the candidate is brought into the salagoro, deposits money
    at successive stages marked by soloi, remains secluded for a number of days, and
    afterward serves in preparing the daily oven.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The number of days of seclusion and attendance and the amount of admission
    fees vary with the dignity of the society.
  category: attribute
  evidence_refs:
  - ev:8
