  summary: The passage describes Melanesian rules of property and inheritance, especially
    land categories, family ownership, limits on alienation, chiefly misuse of power
    in land matters, true sale procedures, fruit-tree ownership, and a shift in some
    contexts from succession through a sister's children toward succession by a man's
    own children for acquired property.
