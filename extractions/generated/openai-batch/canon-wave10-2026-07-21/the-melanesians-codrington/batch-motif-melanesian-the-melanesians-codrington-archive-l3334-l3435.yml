canonical_text:
  quote: ''
  summary: The passage describes Melanesian rules and transactions concerning garden
    land, matrilineal heirs, children’s succession by consent or redemption payments,
    a funeral form of publicly relinquishing claims, distinct ownership of fruit-trees,
    and house-site rights acquired or remembered through pig payments and descent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One category of land is occupied by nephews on the mother's side of the previous
    proprietor, who take separate garden pieces while collectively holding property
    in the whole.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Land reclaimed from uncleared forest by a man passes to his children, who
    divide it into separate lots and do not hold it in common.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Woser gave a pig to his uncle, after which the uncle relinquished his claim
    to half the garden property; Woser also gave money to the sister's son who was
    heir, and Woser with his siblings entered the utag.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man's children may succeed him with the consent of the heirs at law, and
    land held by children not of their father's kin may later revert to the veve to
    which it belongs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A son who has no strict right to his father's garden may give money to the
    natural heirs, identified as his father's sister's children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: To secure such a transaction, the son may place redemption money on his father's
    corpse before burial, and the deceased's nephews and heirs take the money from
    the dead maraul before assembled people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note reports that a pig has been seen delivered from the hand of a dead
    man at his funeral, probably with the same intention.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If children cannot redeem the whole utag, they redeem part, and fruits and
    other produce are allowed for a time to the sister's children as acknowledgement
    and satisfaction of their right.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Property in trees is distinct from property in land and goes to the planter's
    children; titles, limits, and claims over parcels and fruit-trees are remembered
    in detail.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Town lots and house sites are held similarly; a young man builds on property
    of his kin, his mother, or his maternal uncle, and the youngest son may remain
    with his mother and keep the house.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Losalav in Motlav, Woser's great-uncle gave two raw pigs to the owner of
    the utag for ground and became the landlord; his daughter later received no rent
    but was respected by householders.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A footnote states that daughters inherit equally with sons in right but in
    fact tend to transmit inheritance to their children, and it cites a comparable
    statement about Fiji.
  category: relationship
  evidence_refs:
  - ev:9
