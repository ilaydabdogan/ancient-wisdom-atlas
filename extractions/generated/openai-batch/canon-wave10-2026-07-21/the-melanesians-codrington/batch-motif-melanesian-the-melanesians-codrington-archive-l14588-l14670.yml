  quote: ''
  summary: The passage surveys Melanesian beliefs and names concerning heavenly bodies,
    omens, constellations, lunar time, and seasons. It reports a Lepers' Island tale
    explaining marks on the Moon by a quarrel between Sun and Moon; beliefs about
    a human being or Ngava in the Moon; eclipse, comet, and falling-star portents;
    local star and constellation names; and lunar/agricultural reckoning of seasons,
    especially yam and palolo cycles.
  language: English
