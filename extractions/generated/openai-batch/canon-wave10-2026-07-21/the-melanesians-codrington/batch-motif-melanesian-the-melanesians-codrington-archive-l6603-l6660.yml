  summary: The passage gives examples of hostile prayer, voyage prayers, Suqe-club
    prayer over an oven or fire-hole, sea invocations to Qat and Marawa, and Northern
    New Hebrides uses of the word tataro for a storm-at-sea spell or related cry to
    dead kin or friends.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited Fiji prayer concludes with requests that enemies or people speaking
    evil perish, be clubbed, swept away, destroyed, have their teeth broken, and fall
    into a pit.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A voyage prayer addresses “Father” or “Vjicle,” names boars, rawe, money,
    kava, and lucky food for the addressee, and asks to travel on a safe sea.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A short prayer used when a canoe labours under heavy freight asks that the
    burden be taken off so the voyagers may speed on a safe sea.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A prayer over the oven or fire-hole in the gamal of the Suqe club addresses
    grandfather, father, uncle, and great-uncle, and asks for money, boars, rawe,
    food, an unbroken outrigger, favourable watching, and the advance of the suqe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that these prayers do not differ from invocations of Qat
    and Marawa except that the latter are not addressed to the dead and therefore
    are not properly tataro.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sea invocations to Qat and Marawa ask them to cover a blowhole, calm the sea,
    prepare the sea, beat down waves and tide-rip, and bring the canoe into a quiet
    landing-place.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: One sea invocation asks that the canoe shared by speaker and spirits turn
    into a whale, a flying-fish, and an eagle, leaping over the waves toward the speaker’s
    land.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says Qat and Marawa were supposed to answer such prayers by holding
    the mast and rigging of the canoe, preserving it from danger, and speeding it
    on its course.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In Aurora in the Northern New Hebrides, tataro is used for a form of words
    in a storm at sea, described as a spell working through supernatural power in
    the words and in the names of spirits.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: When in distress and danger, people may call to a dead father or friend to
    take care of the shared canoe; the passage classifies this as a cry, not a tataro.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The word tataro is also reported in Whitsuntide and Lepers’ Island, probably
    with the same limited native application.
  category: relationship
  evidence_refs:
  - ev:11
