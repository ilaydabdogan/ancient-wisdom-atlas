canonical_text:
  quote: ''
  summary: The passage introduces Melanesian social divisions and kinship rules, while
    briefly noting origin traditions. It says people are often represented in stories
    as created where they are; names Koevasi, Qat, and Tagar as figures of creation
    stories; gives a Saa origin account in which a man and woman emerge from two shoots
    of a sugar-cane and become parents of mankind; explains self-identification as
    living men rather than ghosts or spirits; describes mostly matrilineal exogamous
    divisions, a Solomon Islands patrilineal exception, and a Taso story in which
    Qatu identifies his dead sister’s twin sons as possible husbands for his wife
    under the marriage-division system.
  language: English
  quote_policy: summarized
