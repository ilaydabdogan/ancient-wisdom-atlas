canonical_text:
  quote: ''
  summary: The passage describes Melanesian healing and weather-magic practices. Named
    healing specialists use songs, charms, breath, coconut juice, water, leaves, and
    smoke to treat illness attributed to ghosts or spirits, with Tagaro named as a
    source and controller of spiritual power. It also describes weather-doctors who
    use charms, spirit familiars, leaves, water, fire, trees, bamboo, canoe-mounted
    stocks, burnt wood, and branches to obtain wind, calm, rain, or sunshine, sometimes
    for payment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Aurora, Lepers' Island, and Pentecost, named healing specialists are associated
    with knowledge of songs and charms said to have come down from Tagaro and to convey
    or apply power.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young coconut juice and water can be blown upon with a charm and then drunk
    by, rubbed on, or otherwise applied to the patient.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sickness is described as generally attributed to ghosts, while angry spirits
    connected with sacred places and objects may also inflict pain and disease.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The name of Tagaro is said to control both ghosts and spirits, and treatment
    of sickness is described as turning especially to Tagaro rather than to ghosts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Pentecost, a doctor may forbid a patient a kind of food and later give
    that food after recovery as proof that the patient is well.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women in Pentecost and Lepers' Island treat pain with leaves, rubbing, singing,
    muttering charms, and claims of drawing out or producing the cause of pain.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: In Pentecost, delirium may be explained as a mae, a snake of mysterious nature,
    being in the patient's stomach; a doctor uses charmed smoke from a burning dry
    coconut husk to drive it out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spirits and ghosts are said to have power over weather, and specialists with
    familiar intercourse with them are believed able to ask for wind, calm, sunshine,
    or rain.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Forms of words, stones, leaves, and other things are described as having power
    imparted by spirits and ghosts and as able to affect weather.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Weather-doctors or weather-mongers are said to supply wind, calm, rain, sunshine,
    famine, and abundance at a price.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Florida, a calm-making rite uses tied leaves, a hollow tree containing
    water, and a call to a vigona spirit; another sunshine rite uses leaves, vines,
    bamboo, fire, song, and placement in a tree-top.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: In Santa Cruz, mendeka wizards take a stock representing a dnka on canoe expeditions
    and set it up in the canoe cabin; other rites use burnt wood, water thrown at
    Tinota's stock, a branch, and chants.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
