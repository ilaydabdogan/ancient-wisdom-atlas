literal_observations:
- id: obs:1
  text: The author states that Banks' Islands and Santa Cruz had no cannibalism, while
    a Tongan party formerly at Qakea was remembered as having eaten people killed
    in fighting, causing horror and retaliation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elder Florida natives are reported to say that human flesh was formerly eaten
    only in sacrifice and that human sacrifice was a late introduction from farther
    west.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coast people of Bugotu deny cannibalism for themselves but accuse inland people
    of killing men to eat them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nunu, an inland chief, was believed to prefer human flesh, and sweat on a
    visitor was taken as a sign of fatness that made him desirable to eat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Ulawa, eating men is said not to occur because the ho'a, ghosts of power,
    are thought not to like it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Saa, elder men reject the practice, while younger men are said to eat bodies
    of men killed in battle after adopting the custom from people with whom they lived
    or whom they visited.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: San Cristoval natives are described as eating bodies of those slain in battle
    and selling human flesh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Pentecost, after a bitter fight, a slain enemy could be cooked in an oven
    and eaten by men, women, and children as a sign of rage and indignation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Lepers' Island, a murdered or especially detested enemy could be cooked
    like a pig and eaten; boys were made to eat though afraid, and eating human flesh
    could confer a reputation for fearlessness or valor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: East of Ysabel, the passage says head-hunting expeditions solely for heads
    are not practiced, but enemy heads and heads taken by chiefs are preserved as
    trophies and signs of power.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Heads of enemies or offenders are distinguished from heads of deceased relatives
