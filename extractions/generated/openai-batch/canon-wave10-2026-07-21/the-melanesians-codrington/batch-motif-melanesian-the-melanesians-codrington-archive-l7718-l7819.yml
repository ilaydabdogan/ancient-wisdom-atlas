canonical_text:
  quote: ''
  summary: The passage describes sacred places and objects in parts of the Solomon
    Islands, especially Florida vunuha and sanctuaries in Saa, Malanta, and San Cristoval.
    These places are associated with ghosts, burials or relics, sacrifices, taboos
    on entry and trespass, stones, shrines, images, ancestral objects, transferred
    ashes, and animal or natural signs understood as ghostly presences.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Florida, a sacred place is called a vunuha; such places may be in a village,
    garden-ground, or bush, and village examples may be fenced to prevent rash treading.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A vunuha is described as sacred to a tinclalo, a ghost of power, and sacrifices
    are offered to the tinclalo there.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some vunuha are burial-places, some contain translated relics, and some include
    a shrine or an image.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Stones are generally present in a vunuha; a natural stone may attract the
    founder of the cult, and smaller stones and peopeo shells may be added.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Once a vunuha is established, everything within it is sacred, tambu, and belongs
    to the tinclalo.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a tree growing in a vunuha fell across a path, no one would step over it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When entering a vunuha, the man who knows the tinclalo and sacrifices goes
    first, while companions tread in his footsteps.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When leaving a vunuha, no one looks back, because of the stated danger that
    the soul might stay behind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: No one would pass a vunuha when the sun was low enough to cast the person's
    shadow into it, because the ghost was said to draw the shadow from the person.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: If a shrine existed inside a vunuha, only the sacrificer would enter it, and
    it contained weapons and other properties used by the worshipped person when alive.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Schoolboys are said to have broken shrines and pelted images, while teachers
    carried off weapons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Dikea, a chief at Eavu with ten vunuha, wanted to enlarge a garden but feared
    to desecrate the sacred place himself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Dikea sent for Gura and Kerekere, two young Christian teachers, to desecrate
    the vunuha because they would not be afraid.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: In the vunuha, Gura and Kerekere found a large natural stone, smaller stones,
    peopeo shells, and ginger leaves, all of which they threw about.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The two tinclalo Koli and Kukui later appeared in dreams to heathen men and
    threatened the desecrators; after no harm occurred, Dikea enlarged his garden.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: At Saa in Malanta, ordinary burial-places are sacred enough that people do
    not go there without due cause, while places holding remains of people of rank
    and receiving sacrifices are treated as family sanctuaries.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: Some Saa family sanctuaries are ancient and are associated with a lio'a, a
    powerful ghost worshipped there as a remote ancestor.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: If a sacrificer dies without fully teaching his son the proper chant of invocation,
    the successor may be afraid to visit the old place often and may begin a new sanctuary
    with ashes from the old sacrificial fire-place.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: Shrines for relics are sometimes made in Malanta and are common in San Cristoval
    villages and sacred places where great men have been buried.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:20
  text: Trespass on these sacred places is said to risk rousing the anger of ghosts,
    including some regarded as malignant, such as Tapia near the mouth of a river
    by Ha'ani.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:21
  text: The passage states that some Solomon Islands sacred places are not sepulchral,
    but that their sacredness probably still depends on the presence of a ghost.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:22
  text: In Florida, the appearance of something wonderful can cause a place to become
    a vunuha, with the wonder treated as evidence of ghostly presence.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:23
  text: After a man planted coconut and almond trees near Olevuga and died, a rare
    white kandora, or cuscus, appeared among the trees and was assumed to be the dead
    man, now a tindalo.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:24
  text: The place with the white cuscus became a vunuha, and people did not gather
    its coconuts and almonds until two young Christian men later took the place and
    trees for a garden.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:25
  text: A stream in the same part of the forest was full of eels not eaten by the
    Olevuga people, and one very large eel was thought to be a tindalo.
  category: relationship
  evidence_refs:
  - ev:12
