canonical_text:
  quote: ''
  summary: 'The passage describes several Melanesian offering practices: first-fruits
    of flying fish, canarium almonds, and yams; a substitutionary offering to the
    ghost Tapia for recovery from sickness; Santa Cruz offerings to duka ghosts represented
    by wooden stocks; and Banks Islands/Northern New Hebrides practices of oloolo
    offerings to spirits associated with stones or unusual objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Flying fish are described as requiring supernatural power to catch, and not
    every canoe goes after them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the flying-fish season comes, men prepare floats, women dig new yams
    and make grated food, and the men obtain a few flying fish for sacrifice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some lio'a are sharks; cooked flying fish are laid before shark figures ashore,
    while offerings to ghost-sharks without shore places are taken to sea, named,
    and shredded as food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: New canarium almonds and dried almonds cannot be eaten until first-fruits
    have been offered to the lio'a; the dried-almond offering includes flying fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tapia is described as a malignant ghost believed to seize a sick man's soul
    and bind it to a banyan-tree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An intercessor with access to Tapia offers a pig or fish as food in place
    of the sick man and is then able to loose and return the man's soul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Santa Cruz, the ghost of a man of consideration becomes a duka, and a stock
    of wood is set up in his house to represent him.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the duka stock is set up or renewed, pig meat is placed before the stock
    as food for the duka and later removed and eaten.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In danger at sea, a duka may be called by name and a bit of food thrown out
    with words identifying it as food for the duka.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Other Santa Cruz offerings to duka include betel-nuts on sacred stones, feather-money
    and red native cloth around gardens, pigs after cures, meat before a stock, and
    yam first-fruits in mash or pudding form.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says Banks Islands and Northern New Hebrides offerings differ
    from Solomon Islands sacrifices because they are usually made to spirits rather
    than ghosts and do not use fire to consume the offering.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The word oloolo is explained as applying to the human participants and offering
    action rather than directly to the spirit; offerings propitiate a spirit after
    an offence or seek a desired result.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the Banks Islands, spirits approached with offerings are almost always
    connected with stones, and some stones have long-standing inherited procedures
    for approach.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A man may find an unusual stone or animal, scatter money there, sleep, dream
    of pigs or money, and thereafter treat the thing as his tano-oloolo, a place or
    object of offering.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: Neighbors may seek the man who has a tano-oloolo so that he can obtain the
    good offices of the spirit he knows; he may pass this knowledge to a son or nephew.
  category: relationship
  evidence_refs:
  - ev:10
