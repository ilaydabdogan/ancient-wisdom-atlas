  summary: 'The passage describes Melanesian and especially Mota/Banks Islands kinship
    organization: exogamous divisions with descent through the mother, paternal household
    authority, a special bond between maternal uncle and sister''s children, three
    classes of relationship terms, and generational and sex-relative kin terms.'
  language: English
  quote_policy: summarized
