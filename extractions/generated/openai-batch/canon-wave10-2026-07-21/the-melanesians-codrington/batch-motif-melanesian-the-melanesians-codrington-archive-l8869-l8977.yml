canonical_text:
  quote: ''
  summary: 'The passage describes several Melanesian harmful charms: garata made from
    a fragment connected with a person and human bone; talamatai, a bound charm planted
    in a path; and tamatetiqa, a bamboo ghost-shooter. It also gives island variants,
    payment practices around charms, protective tasting of food or medicine, and two
    narratives of ghost-shooter misfires or mistaken targets.'
  language: English
  quote_policy: summarized
