- id: obs:2
  text: 'Shell-money in the Solomon Islands and the Banks'' Islands is contrasted:
    some Solomon Islands forms are carefully made and differentiated in value, while
    Banks'' Islands shell-money is described as rougher and valued mainly by quantity,
    with more developed money-dealing.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Porpoise teeth and selected dog teeth are described as currencies in parts
    of the Solomon Islands, with values affected by type, position, whiteness, soundness,
    and quality.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Shell-money used in Florida and at Saa is made at Alite, exchanged mostly
    for pigs, formed into drilled shell discs, and used both as ornaments and as money.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Florida and Saa shell-money is described as white or red, with named denominations
    including rongo and isa.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Banks' Islands shell-money is made by breaking and grinding shells, does not
    require a drill, and is strung on a strip of hibiscus bark.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Banks' Islands shell-money is counted and arranged in coils by winding it
    around two sticks fixed in the ground, using named counts and a fathom measure
    based on outstretched arms.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Shell-money can be used for purchases, and in the Banks' Islands its major
    use is buying steps in the Suqe Club.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Rich men accumulate large quantities of shell-money; the passage says accumulation
    results from club systems and money-lending, while native ideas attribute wealth
    to mana.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Money-lending is described with a cent-per-cent rate of interest, terms for
    borrowing, lending, and debt, and the possibility of an imposed loan that must
    be repaid double.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: A creditor can pressure a debtor by having men of the creditor's place, with
