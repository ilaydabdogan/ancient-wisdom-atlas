  summary: The passage describes mortuary rites, the journey of the dead to Lolomboetogitogi
    near the crater lake of Manaro, Nggalevu as master of the dead, signs and appearances
    of ghosts, remembered descents to the realm of the dead, a parody descent to a
    pig-world ruled by a snake, and two Araga stories about the origin of death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the funeral assembly, a man from a different waivung division mounts a
    tree and calls the deceased person's names while the people listen for a sound
    taken as the dead person's answer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a sound is heard after the name-calling, the people wail because they regard
    it as the last time they will hear the dead person's voice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people call the dead person to take their food and possessions and go
    with them to Nggalevu.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man is buried with bow, arrows, and best ornaments, while his pigs'-tusk
    bracelets are placed upside down.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The deceased man's coconut trees, fruit trees, and garden things are cut down
    and destroyed so that no one else will enjoy them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dead man's soul travels along a mountain path to Manaro and to the lake
    in the island's crater.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The abode of the dead is named Lolomboetogitogi, and the descent to it is
    by a volcanic vent near the lake.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nggalevu is described as a vui, a spirit and not a ghost, who has always been
    master of the place and receives newcomers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: There is a pig by which the ghosts have to pass.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: People climb a tree overhanging the lake and call to Nggalevu for a sign;
    a column of steam rises.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The dead in Lolomboetogitogi have trees and houses, are thought to come out,
    and may be seen like fire at night or like a dead tree-fern trunk in the path.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: The dead are thought to live free from pain and sickness, though some come
    out for mischief and hunt people to add to their company.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: One descent story tells of a widower who dives through the water with a clue
