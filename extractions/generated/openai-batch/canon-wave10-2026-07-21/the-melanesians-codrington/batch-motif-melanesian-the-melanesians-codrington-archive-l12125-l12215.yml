    wife, takes herbs, and returns.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Another man is said to have descended by a banyan root to the ghosts' village
    and returned with old black bananas without eating them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A story not seriously told describes a pig-world underworld ruled by a snake
    named Tamatemboe, who has stones at its neck associated with wealth in pigs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: In one Araga origin-of-death story, a man and a rat dispute over whether the
    man or rat will die outright or live again.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: In another Araga origin-of-death story, a man changes his skin every day,
