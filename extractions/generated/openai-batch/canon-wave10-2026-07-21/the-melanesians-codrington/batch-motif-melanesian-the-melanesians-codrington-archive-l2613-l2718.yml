canonical_text:
  quote: ''
  summary: The passage describes chiefly authority in several Melanesian islands,
    emphasizing its former dependence on belief in supernatural power from spirits
    or ghosts. It then contrasts the relative absence of long native historical tradition
    in Melanesia with some local memories and monuments, including the Atabulu sacred
    stone Vingaga, a wing-shaped founder figure said to have arrived by canoe and
    returned to heaven. It also notes ancestral house-sites, grave stones, stone heaps,
    a large tree and mound, and begins an account of a migration from ancient Saa
    in Malanta.
  language: English
  quote_policy: summarized
