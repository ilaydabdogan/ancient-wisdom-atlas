canonical_text:
  quote: ''
  summary: The passage describes Melanesian beliefs and practices concerning poison,
    magical charms, food-based harm, and tapu/tambu. It emphasizes that harm from
    poison was understood as magical rather than naturally toxic, gives examples involving
    arsenic, snake liver, maomao, tindalo power, food fragments, stealth feeding,
    and arrows tipped with dead men's bones, and then explains tapu/tambu as an imposed
    prohibition backed by ghost or spirit power and accompanied by an expressed or
    implied curse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that Melanesians were not acquainted with naturally injurious
    substances in food or drink until arsenic was brought back from Queensland by
    returned labourers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Returned labourers mixed arsenic in food with fatal effect, and the author
    says its effect was probably understood as magical rather than natural.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Native poison preparations were believed to receive poisoning power from magic
    charms sung over their materials.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Florida, people believed dried black snake liver was a chief ingredient
    in poisons used there.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Certain persons were said to know the art of poisoning and could be hired
    to make maomao with the mana power of a tindalo ghost belonging to the sorcerer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The poison was mixed into the food of the person whose life was targeted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stated effect of taking the poison was sickness, vomiting, and later death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Practicing poisoning was dangerous for the poisoner; a known poisoner and
    many accused or suspected people were put to death in Florida.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Banks' Islands, poisoning was called vangan pal, glossed as feeding
    by stealth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ureparapara people were reputed to be poisoners, Mota was said to have no
    one who knew the art, and Lepers' Island poison was described as secret and charm-made.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage presents native poison and a destructive charm using a fragment
    of food as corresponding practices, with magic identified as the cause of harm
    in both.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A man eating away from his closest friends was said to fear both being charmed
    through a fragment of his food and being poisoned through food given to him.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Poisoned arrows were not found to use natural poison; their fatal power was
    believed to come from magic charms and a dead man's bone point.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage contrasts Melanesian tapu or tambu with Polynesian tapu, saying
    the Melanesian form was less conspicuous and generally imposed rather than inherently
    holy or awful.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The author notes an exception in the Solomon Islands, where things connected
    with a worshipped ghost were tambu of themselves.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: In Melanesia, a thing, action, or place could be made tambu or tapu by someone
    with standing among the people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The power behind tapu or tambu is described as the ghost or spirit in whose
