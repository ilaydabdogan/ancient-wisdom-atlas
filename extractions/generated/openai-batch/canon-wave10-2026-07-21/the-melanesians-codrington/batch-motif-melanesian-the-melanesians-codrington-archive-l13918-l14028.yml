  quote: dances have absolutely no religious or superstitious character
  summary: The passage surveys Melanesian dances, music, and songs. It describes gender-separated
    dancing, masked ghost-club performances, a death-feast drum representing the deceased,
    regional dance forms, travelling dance parties, decorated and synchronized group
    dances, and the use of special song dialects distinct from ordinary speech in
    the Banks' Islands.
  language: English
