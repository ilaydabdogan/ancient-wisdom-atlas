canonical_text:
  quote: ''
  summary: 'The passage completes a story in which twins raised by Qatu disobey his
    warning, attack the man-eater Taso in the gamal, kill him and his mother, burn
    the houses, and avenge their murdered mother. It then begins the Aurora story
    of Betawerai: a boy keeps a forbidden red snake in a hollow tree; the snake grows,
    devours him and the village, while a pregnant woman hides underground and gives
    birth to twins. The snake later dwells in a banyan with many young, including
    Betawerai and Walolo, and the hidden twins set out with bows and arrows to kill
    it.'
  language: English
  quote_policy: summarized
