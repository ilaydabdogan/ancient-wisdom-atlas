  summary: The passage reviews European voyages, island discoveries, and naming practices
    in the Solomon, Santa Cruz, Banks, New Hebrides, New Caledonia, and Loyalty island
    regions. It emphasizes the difficulty of determining native island names, gives
    examples of European or partial-place names being applied to whole islands, and
    notes native voyaging knowledge reported at Taumako.
