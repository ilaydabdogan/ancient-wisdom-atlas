canonical_text:
  quote: ''
  summary: The passage defines mana and equivalent terms as supernatural power underlying
    Melanesian religious and magical practice, explains that humans use it through
    ghosts or spirits, lists weather, healing, divination, luck, and harm as effects,
    and gives examples involving saka, healing charms, and weather charms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes an invisible power, generally called mana, believed
    to cause effects beyond the regular course of nature and to reside in spiritual
    beings, the spiritual part of living men, ghosts, names, stones, snakes, and other
    objects.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: By means of this power, men are said to control or direct nature, make rain
    or sunshine, wind or calm, cause or remove sickness, know what is distant in time
    or space, bring prosperity, or curse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that no man has this power of his own; human acts are done
    with the aid of ghosts or spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage reports regional terms: mana in several Pacific and Melanesian
    areas, malele in Santa Cruz, and saka, meaning hot, at Saa in Malanta.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Saa, a person who knows a saka charm can mutter it over water and make
    the water hot; men of Mala Paina are said to endanger others by pointing a finger
    or spitting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wizards, doctors, weather-mongers, prophets, diviners, and dreamers are described
    as working by this power, with villages commonly having specialists for weather,
    sickness, and harmful charms.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Knowledge of rites, sacrifice, prayer, weather-making, and charms is described
    as transmitted from father to son or uncle to sister's son, and sometimes purchasable
    if the possessor chooses to teach it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Banks' Islands young woman with a reputation for healing toothache used
    a rolled leaf and muttered words on the inflamed part, then displayed a small
    white maggot as the supposed cause of the trouble.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says the young woman later disclosed the secret of the toothache
    charm after Christian teaching began, and the people laughed over it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A weather-doctor is described as observing signs of weather change and using
    or withholding charms accordingly; a failed prediction at Ysabel was explained
    as the result of a stronger counter-charm.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage concludes that practitioners of the various kinds of magic believed
    strongly in their own art, despite some cases of conscious deceit.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
