canonical_text:
  quote: ''
  summary: 'The passage first notes that a high house-mound indicates high family
    rank and defines the yavu as an ancestral house-lot. It then recounts a Saa tradition:
    after younger kinsmen of Pauulo Paina caused conflict, neighbouring people surrounded
    Saa at night, but the Saa people escaped with women, children, and drums. A younger
    Ute returned through the enemy circle to recover areca-nuts that might be used
    in death charms against Pauulo Paina, deceived the enemy, climbed a palm, gathered
    the nuts, and escaped. The fugitives later divided into three kin settlements.
    At present Saa, Pauulo Paina''s male-line descendants are hereditary chiefs, though
    older inhabitants remain landowners. Chiefly authority is described as depending
    on birth and personal qualities, with ritual knowledge, sacrifices, curses, taboos,
    wealth, and supernatural connections treated as related but not sufficient to
    make a chief outside the chiefly family.'
  language: English
  quote_policy: summarized
