  - ev:9
  - ev:11
  confidence: high
  cautions: The passage concerns chiefly rank in an ethnographic setting rather than
    kingship in a courtly or state monarchy.
- id: motif:2
  label: Sacrifice with ancestral-name invocation
  taxonomy_refs:
