canonical_text:
  quote: ''
  summary: The passage contains an animal story in which Rat and Rail find a fruiting
    gaviga-tree; Rat withholds fruit and marks Rail with red fruit, and Rail retaliates
    by fixing a dracaena leaf into Rat, explaining present animal features. It then
    begins the Mota story “The Birds’ Voyage,” in which birds set out by leaf-canoe
    to Qakea for tawan fruit, reluctantly admit additional passengers including Hermit
    Crab, and the crab holes the canoe; after the passengers swim ashore, Weru dives
    repeatedly for the missing crab while her body and eyes change color, though the
    crab has already reached shore.
  language: English
  quote_policy: summarized
