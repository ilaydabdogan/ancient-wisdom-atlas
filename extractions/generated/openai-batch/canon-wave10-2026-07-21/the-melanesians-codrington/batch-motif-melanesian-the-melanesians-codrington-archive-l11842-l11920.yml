canonical_text:
  quote: ''
  summary: The passage recounts episodes concerning journeys to the dead and beliefs
    about the soul after death. A living man, aided by Vanvanvegirgir, descends to
    Panoi to seek his dead wife, passes a ghostly test, receives a shell armlet from
    her, and discovers that she cannot return bodily. A Vanua Lava woman reports following
    her dead husband to Garat and receiving a warning about unpaid debts and killing.
    A Maewo account describes the soul leaving the body, sitting in a fern in a tree,
    travelling through familiar places and along hills, facing memory and leaping
    thresholds that may allow return to life or fix death permanently, being welcomed
    by earlier ghosts, and facing revenge from those wronged in life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A living man is instructed to give himself the smell of a putrid black gecko
    liquor and is given a stick before descending to Panoi with another figure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ghosts in Panoi detect the living man's smell, challenge the pair's claim
    to be dead, and test them by having them rattle dead men's bones in the manner
    of ghosts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vanvanvegirgir finds the man's dead wife and brings her to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dead wife says she cannot return to the world and gives the man a shell
    armlet as a remembrance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the man takes the dead wife by the hand and drags her, her hand comes
    off and her body comes to pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage distinguishes between ghosts in Panoi, which have a body with
    form, colour, and some consistency, and ghosts appearing in the world, which are
    described as shadow-like outlines.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Vanua Lava woman who appeared to die and then recovered says she followed
    her dead husband to hill Garat and saw him bound hand and foot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ghosts tell the woman that her husband is bound because he has not paid his
    debts and command her to tell the Gaua people to pay debts and not kill one another.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Maewo account, the soul leaves the body at death, mounts into a tree
    containing a birdsnest fern, and laughs at mourners.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Maewo account compares the body after the soul's departure to empty clothes
    or an integument, while the soul is treated as the real person.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The soul travels through its gardens and customary paths, then runs along
    the hills to the stone of thought; remembering family or property there causes
    it to run back and live again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At two rocks separated by a deep ravine, a ghost who clears the leap is permanently
