canonical_text:
  quote: ''
  summary: The passage discusses whether Florida kema divisions and their buto food
    prohibitions should be understood as totems. It distinguishes named divisions,
    prohibited foods, and buto associated with deceased or former clan members. It
    gives examples involving crabs, pigeons, clams, bananas, sharks, and a snake,
    then describes kema exogamy, mixed villages, property intermixture, and changing
    chiefly predominance among kema.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage raises the question whether the described divisions and food restrictions
    are totems, noting that the Kakau kindred may not eat the crab kakau while the
    Manukama may eat the bird manukama.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a totem is to be found, the passage says it would be in the buto, specifically
    the pigeon of the Manukama and the giant clam of the Nggaobata, which are said
    to be ancestors.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The thing considered abominable to eat is said not to be believed to be the
    ancestor or eponymous ancestor of the clan, but to represent a famous former clan
    member, a kukua; disrespect to the thing is disrespect to him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The buto of each kema is described as probably comparatively recent in Florida
    and as introduced at Bugotu within living memory; the passage links it to a custom
    said to prevail in Ulawa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'A note connects the Nggaombata buto with a ghost and explains a prohibition
    as respect for Polika: his kema would not intrude on the haunted beach or eat
    the clam because the clam on the reef represented him; they had looked in vain
    for the snake.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Ulawa, people of a place would not eat bananas and had ceased planting
    the tree because an influential man had recently forbidden eating bananas after
    his death and said he would be in the banana.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says that in Malanta near Ulawa, and also in Florida, a man will
    often declare that after death he will be seen as a shark.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The kema divisions are explicitly described as not political divisions; wives,
    children, and village populations must belong to mixed kema, and the property
    of members of different kema is intermixed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Chiefly predominance among kema is described as impermanent because a chief's
    sons are not of his own kin; the Nggaombata were formerly dominant in Florida,
    while the Manukama are now rising into the chief place.
  category: sequence
  evidence_refs:
  - ev:7
