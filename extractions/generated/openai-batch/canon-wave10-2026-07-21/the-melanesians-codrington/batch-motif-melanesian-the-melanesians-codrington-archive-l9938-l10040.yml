canonical_text:
  quote: ''
  summary: 'The passage describes Melanesian infancy and childhood customs: newborn
    sacrifice and ten-day rites, gendered objects used as signs of future work, first-born-son
    ceremonies involving paternal and maternal kin, boys'' movement into club-houses
    with adornment and dress feasts, and avoidance rules between brothers and sisters
    and between grown sons and mothers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Saa, a sacrifice is made when a newborn infant is eight or ten days old
    to provide against misfortune.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Lepers' Island, when an infant is ten days old, the father goes to the
    beach to wash the child's belongings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Lepers' Island, the father scatters toy bows along the path for a boy,
    or bits of pandanus fibre for a girl.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a child dies after eating a food for the first time, the parents do not
    eat that food afterwards.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Araga, a first-born son remains ten days in the house where he was born,
    while the father's kinsmen bring food to the mother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the tenth day at Araga, the father's kinsmen perform Mfami by laying mats
    and pig-tying strings on the infant's head, and the father accepts this as a sign
    that they will later feed and help his son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Banks' Islands, the birth of a first-born son is followed by a noisy
    playful fight called varjalo, after which the father pays money to the child and
    mother's kinsmen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Young children remain in women's care within the house and are commonly weaned
    when they can crawl.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Banks' Islands, boys are sent to sleep in the gamal, the public club-house,
    when they grow bigger, while meals at home continue until a place is bought for
    them in the Suae Club.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Torres Islands, the nose is bored on the third day for future ornament;
    in Florida and nearby places, boys of six or seven put on the small male wrapper.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Santa Cruz, boys first go to the chief's mandai by day and later stop returning
    home at night; nose-rings, ear-boring, dress, feasts, and pig-killing mark stages
    in this process.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the New Hebrides, at Lepers' Island, and at Pentecost, a boy puts on the
    malo dress with a feast when his parents think him big enough and can afford it,
    then eats and sleeps in the gamali club-house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After clothing for a boy or tattooing for a girl, brother and sister avoid
    names, shared presence at meals, path meetings, and following one another's footsteps;
    this continues through life.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: As a boy grows up, his mother maintains reserve by setting food down rather
    than handing it to him, using plural speech to call him, sitting at a distance,
    and turning away when they talk.
  category: relationship
  evidence_refs:
  - ev:10
