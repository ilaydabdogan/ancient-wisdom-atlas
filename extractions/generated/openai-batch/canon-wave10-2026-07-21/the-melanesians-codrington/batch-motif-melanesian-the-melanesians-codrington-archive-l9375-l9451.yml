canonical_text:
  quote: "“a tambu approaches to a curse”"
  summary: The passage describes Melanesian prohibitions, especially tambu/tapu and
    soloi, as social and supernatural restrictions marked by leaves and backed by
    chiefs, spirits, ghosts, secret societies, or ordinary force. It also describes
    curses in Saa, Florida, and the Banks' Islands, including oaths by taboo food
    or ghostly beings, curse-removal through gifts or offerings, and mild curse formulas
    involving bones or sacred trees.
  language: English
  quote_policy: quoted
