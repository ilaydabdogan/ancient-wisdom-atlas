  quote: ''
  summary: The passage describes Melanesian offerings and sacrificial acts involving
    stones, graves, sacred places, intermediaries with access to spirits, ghosts of
    the deceased, Tagaro, wui or vui spirits, sea-passage offerings, whole-pig burning
    for mana, and an explanatory note on Solomon Islands and Banks Islands sacrifice
    rationales.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Northern New Hebrides, spirits are commonly approached at stones, and
    offerings are placed on stones to gain favor or reconcile offended spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Maewo, the passage says the term turegi means laying an offering upon a
    stone, and that no other word is used that can be translated as sacrifice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a man's pig is lost, he may place a qaru tuft on stones over a kinsman's
    grave and ask the ghost to get the pig back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Whitsuntide, Araga, stones connected with spirits are located in sacred
    places known to discoverers or to people introduced by predecessors.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A young man seeking advancement in the Loli Society gives a pig or mats to
    the man acquainted with the spirit; the passage states the offering is said to
    be made to the man who knows the spirit, not to the spirit, and the intermediary
    keeps the pig.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The intermediary takes the supplicant to the sacred place and mutters to Tagaro
    the spirit, asking that the man become great and full-grown.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A very young coconut may be broken and its juice poured over the supplicant's
    head as a sign of admission, and such a coconut may also be placed on the stone
    as an offering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says sacrifices are made for sunshine, rain, and abundant crops.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Offerings are made to ghosts of powerful recently deceased men at graves or
    haunts, and access-holders leave mats, food, and living or cooked pigs in sacred
    places.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Lepers' Island, people give money and pigs to men who have access to wui
    connected with stones for intercession; offerings are not commonly made directly
    to wui or ghosts.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Near dangerous rocks at sea, a tuft of pig hair, a fowl feather, or food is
    thrown into the sea for Tagaro so that he may give safe passage to the canoe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At Ambrym, great men burn an entire pig in their Suqe without accompanying
    prayer in order to obtain mana.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The note says Solomon Islands sacrifices may be traced to the desire to make
    the deceased sharers in the common meal, and that at Saa and San Cristoval an
    offended ghost may be asked to take all and spare the sick.
  category: other
  evidence_refs:
  - ev:11
- id: obs:14
  text: The note says there is no connection between these sacrifices and the huto,
    and it distinguishes Banks Islands money offerings to a spirit from meal-sharing
    with the deceased.
  category: other
  evidence_refs:
  - ev:12
