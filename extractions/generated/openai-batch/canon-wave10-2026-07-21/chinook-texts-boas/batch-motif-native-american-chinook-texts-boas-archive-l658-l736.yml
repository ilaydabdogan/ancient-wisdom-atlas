canonical_text:
  quote: ''
  summary: Crow crosses the bay looking for her nephew and niece, reaches their house,
    sees whale meat and a child identified as the son of a supernatural being, eats
    whale meat, and receives blubber. A separate tale begins in which a chief offers
    his daughter to whoever can break elk antlers. Many animals fail. A sore-covered
    person, mocked by Blue-Jay, reveals himself as Salmon, breaks the antlers into
    five pieces, and flees with the girl while creating bays to slow pursuers.
  language: English
  quote_policy: summarized
