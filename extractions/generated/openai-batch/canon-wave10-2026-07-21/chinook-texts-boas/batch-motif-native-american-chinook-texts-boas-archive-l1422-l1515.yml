canonical_text:
  quote: ''
  summary: 'The passage closes a Blue-Jay war expedition episode: Upe''qciuc is recovered,
    names people, and a canoe party goes against Entsx; on the way Blue-Jay captures
    beings who escape or reappear, and Entsx later escapes a burning house. The passage
    then begins Crow''s story: hungry Crow searches the beach, rejects several found
    animals, injures herself at a whale, finds a salmon, and refuses Eagle''s proposed
    trades for it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People wail and sing that Entsx killed their aunt; Upe'qciuc's body is carried
    to a house and she recovers after people try to cure her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After recovering, Upe'qciuc names a series of people, with Blue-Jay named
    last; Blue-Jay's canoes are launched and two canoes full of people go to make
    war on Entsx.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Blue-Jay encounters a sleeping man and woman, takes them by the hair, brings
    them to his canoe, and makes them his slaves; the two dance and sing in the canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The captured pair escape by running over a tree that hangs over the water;
    Blue-Jay pursues inland and returns with bloody legs; Robin says the captives
    were squirrel and chipmunk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Blue-Jay questions a dipnet fisherman about his canoe equipment; the man repeatedly
    says each item was borrowed, and Blue-Jay angrily seizes him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Blue-Jay ties the captured fisherman with sea-grass, throws him into the water,
    and the water boils; later a person holding arrows says he is the one thrown into
    the water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The war party surrounds Entsx's house and sets it on fire; Entsx flies out
    through a knothole, while Blue-Jay mistakes a mink's head for Entsx's head and
    Robin says Entsx has already gone out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Crow, her five children, and her cousin Raven are hungry, and Crow goes to
    the beach to look for food while repeating a song.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Crow finds several sea creatures, kicks them or leaves them, circles some
    of the larger ones, and breaks her leg when kicking a whale; she ties grass to
    the injured leg.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Crow finds a salmon, rejoices, dances, puts it into her mat, and carries it
    home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Near her house Crow meets Eagle, who offers a coat, blanket, and hat to buy
    the salmon; Crow rejects each offer.
  category: speech
  evidence_refs:
  - ev:7
