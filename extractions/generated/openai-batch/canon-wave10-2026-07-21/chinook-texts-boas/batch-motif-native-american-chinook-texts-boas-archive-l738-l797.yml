canonical_text:
  quote: ''
  summary: During a pursuit, Coyote enchants an arrow and kills a young man. Wolves
    take a woman, the people devour the salmon, and Coyote receives the salmon's bow.
    Crow mourns her killed nephew, finds a salmon egg, places it in water, and repeatedly
    enlarges the water hole as it grows through trout and salmon forms. The large
    salmon becomes a tall boy, Crow's grandnephew. She instructs him to bathe in river,
    sea, and mountain ponds to see spirits. After learning that Coyote and Badger
    killed his father and that Coyote has his father's bow, he demonstrates spirit
    power with fire-producing arrows and departs across five prairies.
  language: English
  quote_policy: summarized
