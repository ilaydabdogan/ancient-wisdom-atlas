  text: The aunt asked the young man to gather grass when he reached the top of the
    mountain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: As the young man climbed the mountain, he heard howling, became fearful, saw
    leaves fall, and thought he might meet a monster that would devour him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ut; o'naqan pursued him; when she howled near him, he became weak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the young man thought of his guardian spirits, including the wolf and
    the bitch, he recovered strength and left Ut; o'naqan behind for a time.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The young man threw away his cape, and Ut; o'naqan reached it and went around
    it many times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ut; o'naqan is described as having teats along her belly like those of a bitch,
    reaching to the middle of her legs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The young man entered a small, deep creek with water near his armpits, walked
    downstream in the water, and then went ashore.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage says Ut; o'naqan is afraid of water; at the creek she blew upon
    the water, remained there, howled, and the young man fainted and fell asleep.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: While asleep, the young man saw Ut; o'naqan as a human being who identified
    herself, said she came from the top of the mountain, and said she liked him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Ut; o'naqan's throat and body were full of arrowheads or arrows, and she said
    the young man would be as she was when he returned to the country of the Indians.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: The next day the young man woke, saw nothing, bathed in the creek, returned
    home naked, answered his aunt that he returned before reaching the top, stayed
    away three days, and did not tell his father what he had seen.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: A following episode begins with three brothers and a poor younger cousin who
    had only a grandmother; the grandmother made a willow-bark rope and told the youngest
    grandson to exchange it for ground-hog blankets at Chehalis, while elder cousins
    wanted to play at disks.
  category: sequence
  evidence_refs:
