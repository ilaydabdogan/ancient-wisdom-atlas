  text: The narrator's great-grandfather is said to have had the guardian spirit of
    the warriors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man had seen the shaman's spirit, the wolf, the bitch, and the morning
    star, and thought he had many guardian spirits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man accompanied other young men to a camp of women digging roots,
    slept there, and returned at daybreak.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When he returned home he hesitated outside his father's house; inside were
    eight fires, four on each side.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: His father stopped him near the third fire, questioned him about guardian
    spirits and taking a wife, threw a cape at him, and ordered him to climb a mountain
    and stay away for five nights.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father identified the mountain destination with the female guardian spirit
