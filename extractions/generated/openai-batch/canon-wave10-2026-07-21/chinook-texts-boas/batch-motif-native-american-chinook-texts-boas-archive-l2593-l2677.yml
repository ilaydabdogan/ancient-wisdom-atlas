canonical_text:
  quote: ''
  summary: A young man said to have many guardian spirits is sent by his father to
    climb a mountain where the female ancestral guardian spirit Ut; o'naqan dwells.
    He hears her howling, flees, calls on animal guardian spirits for strength, crosses
    a deep creek that she fears, faints, and in sleep sees her as a human being who
    identifies herself and shows a body full of arrowheads. He wakes, bathes, and
    returns home naked without telling his father. The passage then begins a following
    episode about three brothers, a poor younger cousin, their grandmother, a rope,
    blankets, and a journey to Chehalis.
  language: English
  quote_policy: summarized
literal_observations:
