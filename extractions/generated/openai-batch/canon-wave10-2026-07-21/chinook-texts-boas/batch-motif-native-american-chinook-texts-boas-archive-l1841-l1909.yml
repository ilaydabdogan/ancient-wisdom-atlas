canonical_text:
  quote: ''
  summary: A skunk chieftainess hosts a conjurer-song dance in a large house. Animal
    and other groups enter, sing, dance, and give Blue-Jay skin blankets as payment.
    Bobin repeatedly restrains Blue-Jay from interfering with the chieftainess. Dangerous
    dancers and speakers appear, including grizzly bears, small-legged birds that
    shake the house, cranes with Coyote, and rabbits. Blue-Jay finally insults the
    skunk as a wind-maker; she makes wind, the whale dies, Blue-Jay is blown into
    a knot-hole, and Bobin frees him after the whale is cut.
  language: English
  quote_policy: summarized
