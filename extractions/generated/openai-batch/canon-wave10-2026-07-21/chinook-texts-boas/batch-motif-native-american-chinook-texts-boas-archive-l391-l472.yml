canonical_text:
  quote: ''
  summary: A monster pursues a group of brothers after they escape through a hole.
    A dog misdirects the monster, but he eventually kills the four eldest brothers.
    The youngest reaches a river and is ferried by the Thunderer after addressing
    him as father-in-law. The Thunderer deceives the monster during a river crossing,
    causing him to fall into the water and become associated with the storm-surf sound
    called Okuls'm. The youngest lives with the Thunderer's daughter as wife; after
    initial rejection, she becomes beautiful and the spouses come to like one another.
    The young man violates or challenges a prohibition against watching the Thunderer
    whale with a dipnet, later raises and calms a southwest wind by blackening and
    washing his face, proves able to catch whales, and fathers two children. At the
    end, he captures two wolves for the Thunderer, but they bite and drag the old
    man.
  language: English
  quote_policy: summarized
