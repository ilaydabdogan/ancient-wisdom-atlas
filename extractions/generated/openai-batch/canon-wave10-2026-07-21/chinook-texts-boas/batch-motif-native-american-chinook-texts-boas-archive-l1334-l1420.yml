canonical_text:
  quote: ''
  summary: Entsx, urged by his grandmother Upe'qciuc to hunt elk, calls animals from
    the woods, finally kills a male elk by entering its body and cutting it internally,
    and brings the carcass home. His grandmother behaves obstructively during carrying
    and cooking, including filling buckets with urine while naming water sources and
    damaging food utensils. Entsx scalds her with boiling food, wraps her in the elk
    skin, and throws her into the river. Winter Bobin and Blue-Jay, fishing with a
    dipnet, retrieve the drifting elk skin, find their aunt inside, and sing a wail
    accusing Entsx of killing her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Upe'qciuc, Entsx's grandmother, repeatedly asks him to go elk hunting, though
    he usually kills small animals such as chipmunks, squirrels, and mice.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:2
  text: Entsx calls elk down from the woods to fight and dance; a rabbit and then
    a deer come down and are dismissed with mocking descriptions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: A female elk and then a male elk come down in response to Entsx's call.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Entsx sings about possible body openings of the male elk, enters through the
    anus, cuts the stomach to pieces, and the elk dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Entsx skins and dissects the elk, cutting off major parts including legs,
    head, neck, ribs, and rump bone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When Entsx says he killed an elk, his grandmother doubts him by suggesting
    it may have been a mouse, snail, chipmunk, or squirrel.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the carcass, Entsx offers his grandmother several elk parts to carry; she
    rejects heavy parts and chooses the rump bone after asking him to tie it up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the way home, the grandmother repeatedly runs ahead, sets down her load,
    pushes it to and fro while singing, and says it pulled her down headlong; Entsx
    overtakes her five times.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Entsx asks his grandmother to bring water for boiling the elk; she fills five
    buckets with urine and names a different river or creek as the source for each
    bucket.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: While the elk boils, the grandmother turns her back toward the fire and makes
    holes in Entsx's shell spoons, wooden spoons, horn dishes, and toy canoes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After Entsx finds that the utensils all have holes, he pours boiling food
    over his grandmother, scalding her and causing her limbs to become doubled up.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Entsx rolls the grandmother in the elk skin and throws her into the river,
    where she drifts downstream.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Winter Bobin and Blue-Jay are fishing with a dipnet when the elk skin drifts
    down to them.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:14
  text: Winter Bobin and Blue-Jay take the elk skin into their canoe, untie it, find
    their aunt inside, and Bobin sings that Entsx killed her.
  category: action
  evidence_refs:
  - ev:12
