canonical_text:
  quote: ''
  summary: 'A young son-in-law repeatedly performs dangerous tasks set by the Thunderer/father-in-law:
    bringing wild animals, surviving a split-log trap, and stealing hoops and targets
    from supernatural people. His wife and children help him escape supernatural pursuers
    by making the old man produce rain that extinguishes torches. Later the young
    man leaves his wife, reaches a large town, is drawn by Blue-Jay into a shooting
    match with a chief, loses his possessions and body parts, and is secretly fed
    by two old women identified as mice. After a year his sons set out to search for
    him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Thunderer tells his son-in-law to catch pairs of animals he says he used
    to play with; the son-in-law brings black bears, grizzly bears, and panthers,
    and the animals wound the Thunderer, who asks that they be carried back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thunderer has the young man sit inside a split log, removes the wedges,
    and leaves after the log closes on him; the young man holds it apart, breaks it,
    carries it home, and throws it before the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man goes to the country of supernatural people, takes their hoop
    at night, and flees while they pursue him with torches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the hoop pursuit, the wife tells her children to whip their grandfather;
    he urinates, rain begins, and the pursuers' torches are extinguished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man repeats the journey to the supernatural people, takes their
    targets at night, and escapes when rain again extinguishes the pursuers' torches
    after the old man is whipped and urinates.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man tells his wife he will leave, puts on dentalia, takes two quivers
    of arrows, and reaches a large town with five rows of houses and a small last
    house containing two old women identified as mice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Blue-Jay reports to his chief that a chief has arrived and wants a shooting
    match, then tells the stranger that Blue-Jay's chief wants him to come to the
    beach.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the shooting match the stranger loses his dentalia, arrows, hair, head,
    arms, and legs; he is cut and hung in the smoke, while the two mice secretly give
    him water and food at night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After one year, the sons prepare with dentalia, targets, and arrows, search
    for their father, enter the small house, and hear from the old women that Blue-Jay
    made chiefs miserable and that their father has lost his eyes.
  category: sequence
  evidence_refs:
  - ev:7
