- id: ev:5
  type: summary
  locator: lines 3136-3149
  quote_or_summary: After a killing, an old guardian-spirit person applies coal and
    grease to the murderer's face, gives cedar-bark head and limb bindings, and the
    murderer spends five days without water, sleep, lying down, or washing, while
    standing, walking at night, whistling on bone whistles, and vocalizing.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:6
  type: summary
  locator: lines 3150-3165
  quote_or_summary: The old person washes off black paint, applies red paint mixed
    with coal, replaces cedar bark with buckskin, gives water in a bucket, feeds five
    mouthfuls of burned food, later repaints the murderer, and the murderer hangs
