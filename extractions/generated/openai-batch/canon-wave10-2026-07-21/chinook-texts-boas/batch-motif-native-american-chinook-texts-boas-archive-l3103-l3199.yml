    children, and seeing people eat.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:7
  type: summary
  locator: lines 3166-3173
  quote_or_summary: A widow goes upriver, stays one or two days, bathes, avoids fresh
    food for thirty days, avoids looking at children or sick people, bathes daily,
    rubs with sweet-smelling herbs, wears a poor blanket, and must not laugh for one
    year.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
- id: ev:8
  type: summary
  locator: lines 3174-3179
  quote_or_summary: The husband's relatives may tell the widow to be glad because
    her brother-in-law will marry her; early laughter displeases them, quick remarriage
    may lead them to ask a shaman to send disease, and a widow with a small child
    may be told soon to be glad.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; source metadata permits full text use.
