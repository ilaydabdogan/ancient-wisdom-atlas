candidate_motifs:
- id: motif:1
  label: Status-marked mortuary equipment at canoe burial
  taxonomy_refs: []
  basis: The passage assigns distinct burial objects to deceased guardian-spirit holders,
    shamans, braves, and women, and connects these objects with canoe burial locations.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a passage-level customary pattern, not a named mythic episode.
- id: motif:2
  label: Burial violation punished by death or wealth compensation
  taxonomy_refs: []
  basis: Taking dentalia from a corpse is punished by killing, while mocking a canoe
    burial requires many dentalia or else killing.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents a legal or ritual sanction; no supernatural agent
    is specified.
- id: motif:3
  label: Mortuary gift exchange resolves grief and can avert feud
  taxonomy_refs:
  - sacred_exchange
  basis: A bereaved chief receives slaves, canoes, and dentalia, redistributes wealth
    to relatives, and fighting follows if dentalia are not given.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy fit is based on structured exchange in a death context; the
    passage does not itself use the term sacred.
- id: motif:4
  label: Retaliatory killing after chiefly death
  taxonomy_refs: []
  basis: When a chief dies, relatives go to war and kill the chief of another town.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a brief customary statement without narrative elaboration.
- id: motif:5
  label: Post-killing ordeal and ritual cleansing of a murderer
  taxonomy_refs: []
  basis: The murderer undergoes black coal-painting, cedar-bark binding, five days
    without water or sleep, night walking with whistles, washing, red repainting,
    controlled food and water, later repainting, tree deposition, and continued taboos.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: Although the sequence resembles a rite of transition or purification,
    the passage does not label it as initiation or purification.
- id: motif:6
  label: Widow mourning seclusion, taboos, and affinal remarriage
  taxonomy_refs: []
  basis: The widow observes bathing, food, looking, clothing, and laughter restrictions,
    then may be told to be glad and marry her brother-in-law; early remarriage may
    bring shamanic disease-sending.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The pattern is social-ritual and does not include an explicit mythic narrative
    frame.
- id: motif:7
  label: Chiefly measurement and exchange distribution of a whale
  taxonomy_refs:
  - sacred_exchange
  basis: A found whale is not cut until the chief arrives; the chief measures it,
    assigns cuts, and standardized portions are exchanged for blankets or dentalia.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The exchange is clear, but the passage does not explicitly characterize
    the distribution as sacred.
- id: motif:8
  label: Territorial ownership of a found whale
  taxonomy_refs: []
  basis: Whale claims are assigned according to whether the whale is found at, south
    of, or north of Oysterville, with Sealand and Willapa having defined claim areas.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This is a customary territorial rule rather than a mythic episode.
