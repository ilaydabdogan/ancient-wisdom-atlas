canonical_text:
  quote: ''
  summary: The passage describes status-marked canoe-burial goods, penalties for taking
    dentalia from corpses or mocking burials, mourning exchanges among chiefs, retaliatory
    war after a chief's death, ritual handling and taboos for a murderer, widow mourning
    restrictions and remarriage rules, and procedures for finding, measuring, distributing,
    exchanging, and territorially claiming whales.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Different deceased persons receive different objects at or near a canoe burial:
    a guardian-spirit man''s batou or baton, a shaman''s baton and rattles, a brave''s
    headdress and shell rattle, and a woman''s coat.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Taking dentalia from a corpse is punished by killing; mocking a canoe burial
    requires giving many dentalia or else being killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a chief's child dies, the chief visits another town, receives slaves,
    canoes, and dentalia, distributes most dentalia and canoes among relatives, and
    may fight if no dentalia are given.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a chief dies, his relatives become sad, go to war, and kill the chief
    of another town.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: An old person with a guardian spirit works over a murderer by applying coal
    mixed with grease to the face and putting cedar-bark rings or bindings on the
    head, ankles, knees, and wrists.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: For five days the murderer does not drink water, sleep, lie down, or wash
    his face; he stands, walks at night, whistles on bone whistles, and vocalizes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After five days the old person washes off the black paint, applies red paint
    mixed with a little coal, replaces cedar bark with buckskin straps, gives water
    in a bucket, and gives burned black roasted food, of which the murderer eats five
    mouthfuls while standing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After thirty days the murderer is painted with new red paint and hangs his
    head ring and bucket on a spruce tree; the passage states that the tree will dry
    up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The murderer remains under social taboos: people do not eat with him, he
    eats standing, kneels on one leg when resting, does not look at a child, and must
    not see people eating.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A widow goes upriver, bathes, avoids fresh food for thirty days, does not
    look at a child or sick person, bathes daily, uses sweet-smelling herbs, wears
    a poor blanket, and must not laugh for one year.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The dead husband's relatives may tell the widow to be glad and that her brother-in-law
    will marry her; if she laughs or remarries quickly, they may ask a shaman to send
    disease to her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Sealand people find a whale, a youth is sent to town, a taboo-observing
    person or a person who cohabited the preceding night moves by canoe below the
    whale, and the finders wait for the chief before cutting.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The chief measures the whale with a stick from head to tail, assigns where
    people cut, has pieces distributed, and standardized cuts are exchanged for blankets
    or dentalia.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: 'Whale ownership is assigned by find-location: whales at or south of Oysterville
    belong to Sealand, while whales north of Oysterville belong to Willapa; Chehalis
    travelers'' finds are taken back from them.'
  category: relationship
  evidence_refs:
  - ev:11
