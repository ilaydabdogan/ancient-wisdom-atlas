- id: obs:4
  text: One young man arranges for boys below to say "Return to the land" when he
    is thrown down, while Uqj'o'nexon tells them to say the opposite.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Flint pieces stand upright at the foot of the precipice before the young man
    is thrown.
  category: object
  evidence_refs:
