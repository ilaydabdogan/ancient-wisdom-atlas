  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the Okula'm her myth, four older brothers hunt elk daily and leave the
    youngest brother at home in a house full of meat and tallow.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The youngest brother repeatedly wishes for the Glutton to come and eat all
