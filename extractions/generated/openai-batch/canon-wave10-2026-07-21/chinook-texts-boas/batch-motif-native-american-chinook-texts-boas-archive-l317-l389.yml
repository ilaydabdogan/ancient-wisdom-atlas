canonical_text:
  quote: ''
  summary: The passage first describes an encounter with Uqj'o'nexon, a dog fight,
    a young man thrown from a precipice who returns unhurt and revives boys below
    with water, and the subsequent killing and dismemberment of Uqj'o'nexon. It then
    begins the Okula'm her myth, in which a youngest brother summons the Glutton,
    the brothers feed the monster until food is exhausted, and then prepare an escape
    through a hole with sharpened arrow-wood and a decoy at the entrance.
  language: English
  quote_policy: summarized
