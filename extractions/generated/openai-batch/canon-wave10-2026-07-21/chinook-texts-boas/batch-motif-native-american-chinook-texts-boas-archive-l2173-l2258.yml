canonical_text:
  quote: ''
  summary: A travelling woman leaves a figure named Humming-Bird, visits houses connected
    with salmon foods and Fish-hawk, becomes pregnant, and has a child. After a forbidden
    downstream wood-gathering episode reveals a bleeding stick and her wounded husband,
    she leaves with the child, later abandons him at a maple, and the child is found
    and raised through a feigned birth. The grown boy is taunted by his adoptive sister,
    kills her only after destroying a round thing from her finger, then assumes the
    form of a spotted dog, is taken by a chieftainess, and is exposed by Blue-Jay
    as a man rather than a dog.
  language: English
  quote_policy: summarized
