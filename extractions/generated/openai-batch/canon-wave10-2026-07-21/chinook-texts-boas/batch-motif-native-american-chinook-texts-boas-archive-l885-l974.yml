  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:4
  text: The salmon figure bathes, eats, goes to bed, then blows into the fire so that
    he is covered with ashes and becomes an old man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Each wolf gives five pieces of flint for arrowheads; the salmon's son finishes
