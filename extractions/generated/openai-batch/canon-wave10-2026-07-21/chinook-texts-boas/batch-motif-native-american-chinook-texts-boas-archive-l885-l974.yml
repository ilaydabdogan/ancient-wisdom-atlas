canonical_text:
  quote: Then it became hot and the wells dried up, except that of the youngest wolf.
  summary: A salmon figure disguised as an old man is abused by wolf brothers until
    a woman identifies him as her relative and distributes salmon meat. The wolves
    later ask him to make flint arrowheads; he makes them and keeps one from each
    set. He then tells the woman he will kill the wolves, points an arrow toward the
    mountains, produces heat that dries their wells, and shoots the eldest wolf when
    he comes to drink from the remaining water.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Several entrants smell salmon, see the old man, kick him violently, and later
    apologize when the woman identifies him as an in-law relative who brought salmon
    meat.
