- id: ev:4
  type: summary
  locator: lines 3049-3059
  quote_or_summary: If a child of a woman married in another village dies, her father
    gives a slave or canoe as indemnity; the wife distributes gathered roots or berries
    yearly among those who bought her; if her husband dies, she is taken to his younger
    brother, father, or another relative.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; summarized.
- id: ev:5
  type: summary
  locator: lines 3060-3074
  quote_or_summary: A youth whose attempt to buy a wife is repeatedly refused may
    hide in the woods, meet and carry away the girl, and after repeated retrievals
    she may be allowed to stay; if he lacks property, the couple lives with her father
    and he tends the house, fire, and salmon supply.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; summarized.
- id: ev:6
  type: summary
  locator: lines 3075-3081
  quote_or_summary: If a wife is carried away, many slaves are paid to the husband
    as indemnity; without payment he may kill the abductor or a relative, causing
    family feud; similar indemnity applies to taking a deceased brother’s wife.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; summarized.
- id: ev:7
  type: summary
  locator: lines 3082-3092
  quote_or_summary: When a wealthy person dies, dentalia are tied to the body, two
    young men prepare the corpse, the body may be placed in a painted canoe with two
    stern holes, people wash and comb at the beach, cut their hair, change names,
    and distribute the deceased’s dentalia, slaves, and canoes.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; summarized.
- id: ev:8
  type: summary
  locator: lines 3092-3098
  quote_or_summary: A deceased person may specify which relative should take a wife
    after death; a dying woman may tell a sister to marry her husband; young widows
    or widowers may be assigned to younger siblings of the deceased spouse.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; summarized.
- id: ev:9
  type: summary
  locator: lines 3099-3101
  quote_or_summary: A chief’s relative takes the deceased chief’s name after a long
    time; two people are paid to give a name; after a year the corpse is cleaned and
    hired young men rearrange and paint the canoe.
