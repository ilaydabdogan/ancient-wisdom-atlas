- id: scene:2
  label: Wedding ceremony with dentalia road and covered bride
  summary: The bride’s relatives wear blankets, dance, and sing; the man’s relatives
    remove blankets, strew a road with dentalia, and a woman carries the blanket-covered
    bride over it for payment.
  figure_refs:
