canonical_text:
  quote: ''
  summary: The passage describes Chinook procedures for marriage purchase, wedding
    ceremonies with dentalia, blankets, carrying the bride, food division, and partial
    return of payments; affinal obligations, indemnities, elopement after refused
    bride-price, and spouse abduction; and funerary practices involving dentalia,
    canoe placement, hair cutting, name changes, property distribution, posthumous
    spouse transfer, chief-name succession, and later corpse and canoe maintenance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man’s relatives send property and messengers to buy a girl from another
    town; dentalia are retained by the girl’s relatives and divided by her father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the initial marriage payment is small, additional dentalia and slaves are
    given to the girl’s father until the amount is sufficient.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl’s relatives stand outside, wear blankets, dance, and sing conjurer’s
    songs; the man’s relatives repeatedly run to them and remove the blankets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A road is strewn with dentalia, and a woman carries the bride over it on her
    back while a blanket covers the bride’s head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman who carries the bride receives dentalia, blankets, and other property
    for carrying her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dentalia are torn or strewn over the bride’s head and over the groom’s head
    while relatives feign lousing them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Food brought to the bride is divided among those who helped in the ceremonies,
    and marriage payments are partially or fully returned according to stated ratios
    and later exchanges.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Male and female relatives of a married couple are called La/qoqcin and transact
    the purchase.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: When a married woman from another village gives birth to a child and the child
    dies, her father gives a slave or canoe as indemnity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the young wife gathers roots or berries, she distributes them each year
    among the people who bought her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: When a husband dies, his wife is taken to his younger brother, his father,
    or another relative, depending on available kin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: A youth whose marriage payment is repeatedly refused may hide in the woods,
    wait for the girl, carry her away, and eventually marry her after she leaves her
    relatives three times.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: If a man has no property, he may live with his father-in-law and work for
    that household by looking after the house and fire and catching salmon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: If a wife is carried away, slaves may be paid as indemnity; without indemnity
    the husband may kill the abductor or one of his relatives, causing a family feud.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: When a wealthy person with many relatives, property, and slaves dies, relatives
    tie dentalia to the body and two young men prepare the corpse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: If the deceased had a good canoe, the body is placed in it, the canoe is put
    up, painted, and pierced with two holes in the stern.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: After a death, people wash and comb themselves at the beach, cut their hair,
    and men, women, and children change their names.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The deceased person’s dentalia, slaves, and canoes are distributed among relatives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: A deceased or dying spouse may direct that a particular relative or sibling
    marry the surviving spouse.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:20
  text: A chief’s relative may take the deceased chief’s name after a long interval;
    two people give the name and receive much property.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: After a year, the corpse is cleaned and two young men are hired to rearrange
    and paint the canoe.
  category: action
  evidence_refs:
  - ev:9
