candidate_motifs:
- id: motif:1
  label: Bride purchase through reciprocal valuables
  taxonomy_refs:
  - sacred_exchange
  basis: Marriage is initiated and completed through property, dentalia, and slave
    payments, with later partial refunds and additional reciprocal payments.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage describes social and ceremonial exchange; the taxonomy label
    'sacred_exchange' may overstate sacral meaning not explicitly stated in the passage.
- id: motif:2
  label: Covered bride carried over valuable-strewn road
  taxonomy_refs: []
  basis: The bride’s face is hidden by a blanket while a woman carries her over a
    road strewn with dentalia and onto blankets, receiving payment for each carrying
    action.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Recorded as a local ceremonial pattern; no broader comparative taxonomy
    is asserted.
- id: motif:3
  label: Feigned lousing with dentalia over bride and groom
  taxonomy_refs: []
  basis: Relatives bring or strew dentalia over both bride and groom and feign lousing
    them during the ceremony.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain the meaning of the feigned lousing.
- id: motif:4
  label: Affinal indemnity through slaves or canoe
  taxonomy_refs:
  - sacred_exchange
  basis: A woman’s father pays a slave or canoe when her child dies, and slaves are
    paid as indemnity when a wife is carried away to prevent or settle conflict.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The exchange is clearly compensatory; its sacred or ritual character is
    not directly explained.
- id: motif:5
  label: Repeated elopement after refused bride-price
  taxonomy_refs:
  - departure
  basis: After refused payment attempts, a youth hides in the woods, carries the girl
    away, and she is allowed to stay after leaving her relatives three times.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy reference to departure is formal and cautious; the passage
    treats the event as marriage custom, not a heroic or mythic departure.
- id: motif:6
  label: Surviving spouse transferred within kin group
  taxonomy_refs: []
  basis: A widow or widower may be taken by the deceased spouse’s younger sibling,
    father, or other relative, or assigned by the dying spouse’s instructions.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: high
  cautions: The passage gives procedural rules but does not interpret them symbolically.
- id: motif:7
  label: Funerary canoe and wealth distribution
  taxonomy_refs: []
  basis: The deceased may be placed in a painted canoe with holes in the stern; dentalia
    are tied to the body and the deceased’s dentalia, slaves, and canoes are distributed
    to relatives.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not state that the canoe is for an afterlife journey.
- id: motif:8
  label: Mourning through hair cutting and name change
  taxonomy_refs: []
  basis: After the death, people wash and comb themselves, cut their hair, and men,
    women, and children change their names.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No meaning for the hair cutting or name change is supplied in the passage.
- id: motif:9
  label: Chiefly name succession through paid naming
  taxonomy_refs:
  - royal_legitimacy
  basis: A chief’s relative takes the deceased chief’s name after a long time, and
    two paid people confer the name.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage identifies a chief and name succession but does not explicitly
    describe political legitimacy beyond the transfer of the name.
- id: motif:10
  label: Annual corpse cleaning and canoe repainting
  taxonomy_refs: []
  basis: After a year, the corpse is cleaned and hired young men rearrange and paint
    the canoe.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives the action without further explanation.
