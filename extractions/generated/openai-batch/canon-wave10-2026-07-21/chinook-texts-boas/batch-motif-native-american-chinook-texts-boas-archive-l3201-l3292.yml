literal_observations:
- id: obs:1
  text: Persons under specified taboos are not to go to the beach, because their presence
    can prevent a whale from drifting ashore or cause scarcity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The named taboo conditions include recent cohabitation, menstruation, first
    menstruation, and murder.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When people are starving, a person with a supernatural helper of the sea sings
    for five days to bring a whale.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Only old people, boys, and young girls help with the whale-bringing singing;
    women with regular menses and young men are excluded.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A youth is sent repeatedly to look seaward, and after the fifth sending he
    finds a drifting whale.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The singer is covered with down and places an upright pole on the beach to
    mark where the whale will drift ashore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sea supernatural helper is named Ike'tal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: When Clatsop people find a whale, early finders tie straps or kelp to holes
    in the skin, with each strap corresponding to relatives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: People do not cut whale meat where another person's strap has been tied; cutting
    at another's strap can lead to fighting.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Whale meat is sold or exchanged, with large pieces exchanged for a blanket
    and small pieces being inexpensive.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Strong women or youths may be paid for carrying several cuts of whale meat
    for others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'Elk retrieval depends on the sex and number of elk killed: twelve men fetch
    a male elk, eight fetch a female elk, many fetch two elk, and many elk may be
    dried in the woods.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A hunter who has dried many elk in the woods distributes the meat among all
    the people after it is dry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A menstruating woman must not take an elk head, eat certain parts, see certain
    bones, or step over an elk head; similar restrictions apply to a girl who has
    just reached maturity.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A hunter's wife and children must remain still during his hunting, and children's
    noise or a child going near water is associated with sickness or death when the
    hunter is unsuccessful.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: When a chief gives a potlatch, several men travel by canoe to invite guests,
    including one man with a guardian spirit who sings near each town.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Invited people wait for the farthest groups and travel together by river to
    the host town.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: At the host town, canoes are placed side by side, planks are laid across them,
    and people dance on the planks while guardian-spirit holders sing.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: Participants are adorned with red face paint, down in the hair, dentalia,
    ornaments, necklaces, blankets, blackened faces, head ornaments, and shamanic
    batons.
  category: object
  evidence_refs:
  - ev:11
- id: obs:20
  text: A skilled dancer, man or woman, is made head dancer; a woman who declines
    the role says she does not dare to do it.
  category: speech
  evidence_refs:
  - ev:12
