canonical_text:
  quote: ''
  summary: The passage includes two Blue-Jay episodes in which he observes or benefits
    from others' food-producing actions, invites them to his house, and fails when
    he tries to repeat their methods. It then begins a story of Ckulkulo'L, the salmon-harpoon,
    who catches steel-head salmon but withholds it from his elder sister while she
    continues to feed him roots; she discovers evidence of his concealment and tells
    him to leave the house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blue-Jay invites Magpie to come for his kettle, then prepares a kettle with
    water, a salmon egg, and hot stones, imitating Magpie's earlier action.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blue-Jay's kettle contains nothing, while Magpie repeats the procedure with
    a dry salmon egg and hot stones and fills the kettle with salmon eggs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blue-Jay and his sister visit Duck; Duck's five children wash, dive, each
    bring up trout, and after repeated dives fill a mat with trout that are roasted
    and served.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Blue-Jay invites Duck to retrieve the mat and then has his sister's children
    try to wash and dive, but they cannot dive properly, become very cold, and return
    empty-handed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ckulkulo'L's elder sister tells him to catch steel-head salmon like other
    people; he makes a harpoon, catches a salmon, roasts it, and eats it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ckulkulo'L repeatedly considers giving parts of the salmon to his sister but
    rejects each option and gives her none, while she returns from digging roots and
    feeds him roasted roots.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: People comment that Ckulkulo'L has large salmon and does not give anything
    to his sister; she initially thinks they are making fun of her brother.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The elder sister smells grease, finds grease and a salmon egg, realizes Ckulkulo'L
    has withheld food, gives the egg to him, and later tells him to leave the house.
  category: sequence
  evidence_refs:
  - ev:7
