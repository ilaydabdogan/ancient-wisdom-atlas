canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a young man reclaims a double-pointed
    arrow, becomes covered with dentalia, is pursued by a woman-shaped Chicken-hawk,
    hides under elk skins, and is transformed in connection with elk materials before
    Panther punishes and names Chicken-hawk. It then gives beliefs about seers and
    shamans pursuing sick persons' souls into the country of ghosts, where trails,
    water, food, houses, and retrieval determine recovery or death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People examine a double-pointed arrow; the young man repeatedly asks Blue-Jay
    to give it to him, and Blue-Jay eventually lets him take it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After taking the arrow, the young man shakes himself and his body becomes
    covered with dentalia.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blue-Jay tells the woman-shaped Chicken-hawk to follow the chief; the young
    man runs, the woman pursues him, and he hides in his elder brother's house.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The woman searches under elk skins for two days and finally finds the young
    man sleeping beneath them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman roasts and pounds elk hoofs, mixes them with soot, elk nose hair,
    and elk grease, and pours the mixture into the young man's nostrils.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man says his nose is becoming an elk's nose and hoofs are growing
    on his feet; his elder brother says he cannot help him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the morning, elk skins become elks; the youth becomes E'lemiX* and leaves
    with the elks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Panther carries the woman out, shakes her so that her flesh falls down, names
    her Chicken-hawk, tells her to eat snakes, and names himself Panther.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Seers are arranged by the strength of their guardian spirits when they pursue
    the soul of a sick chief.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: During the pursuit, the front and rear seers sing when danger approaches;
    at the morning star they reach the soul, take it, return, give it to the sick
    person, and the sick person recovers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a sick person's soul takes the left trail, the seers say he will die; if
    it takes the right trail, they say they will cure him.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the country of ghosts there is a hole in the ground where souls of the
    deceased drink, and a sick person's soul cannot recover if it has drunk that water.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: A soul that has drunk the water becomes too small near the country of the
    Indians and cannot fill the sick person's body, so the person dies.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: If the ghosts have not given the sick person's soul food, the seers take the
    soul back and the person revives at once.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: When ghosts carry away a soul, the person faints and trembles; seers can be
    paid to drive away the ghosts and turn the soul around, after which the person
    recovers.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: If no seer is present and a soul has been away for one or sometimes two nights,
    the person remains dead.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: If a sick person's soul has already been taken into the ghosts' house, it
    cannot be recovered, and the seers' spirits cry and return.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: A horse, person, or canoe seen or carried away in the country of ghosts dies
    or breaks if not taken back, but survives if taken back.
  category: relationship
  evidence_refs:
  - ev:15
