- id: ev:10
  type: summary
  locator: lines 2298-2397, numbered item 4
  quote_or_summary: A soul that has drunk the water is taken but grows smaller near
    the country of the Indians; when it cannot fill the body, the person dies.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; full text use allowed in supplied metadata.
- id: ev:11
  type: summary
  locator: lines 2298-2397, numbered item 5
  quote_or_summary: If the soul is still far from the ghost town and has not been
    given food, the seers say they can make the person well; they take the soul, return
    it, and the person revives at once.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; full text use allowed in supplied metadata.
- id: ev:12
  type: summary
  locator: lines 2298-2397, numbered item 6
  quote_or_summary: Ghosts carry away a soul and the person faints and trembles; paid
    seers drive away the ghosts, the carried soul sees known and unknown ghosts, and
    the seers' spirits turn the soul around so the sick one recovers.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; full text use allowed in supplied metadata.
- id: ev:13
  type: summary
  locator: lines 2298-2397, numbered item 7
  quote_or_summary: If ghosts carry a soul away and no seer is present to recover
    it, a person whose soul has been away one or sometimes two nights remains dead.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; full text use allowed in supplied metadata.
- id: ev:14
  type: summary
  locator: lines 2298-2397, numbered item 8
  quote_or_summary: When a sick person's soul goes to the ghosts, seers pursue it;
    if it has already been taken into the house, it cannot be recovered, and the seers'
    spirits cry and return.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: Public domain; full text use allowed in supplied metadata.
- id: ev:15
  type: summary
  locator: lines 2298-2397, numbered item 9
  quote_or_summary: A horse seen in the country of ghosts dies unless taken back;
    the same is said of a person, and a canoe carried away by ghosts will be broken
    unless seers bring it back.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
