canonical_text:
  quote: ''
  summary: An unnamed poor boy, identified by the passage title as Cultee's grandfather,
    obtains a sea-otter by exchange, is robbed and deserted by older kin, crosses
    water after seeing black bears emerge from it, is taken to the house of a supernatural
    being, receives a bone bird arrowhead and a prediction of wives and chiefly status,
    then returns and wins wealth, slaves, wives, canoes, and chiefly status through
    disk gambling.
  language: English
  quote_policy: summarized
