canonical_text:
  quote: ''
  summary: An old woman mourning her dead son discovers an unknown beached ship near
    Clatsop. The object is first perceived as a whale or monster, has two upright
    spruce trees, copper-covered exterior, iron, and bear-like human-faced occupants.
    The Clatsop respond, encounter two persons with copper kettles, burn the ship,
    gather metals, keep the two persons through chiefs, and become wealthy through
    regional exchange of copper, iron, brass, nails, and related goods.
  language: English
  quote_policy: summarized
