canonical_text:
  quote: ''
  summary: 'The passage lists Chinook pregnancy, birth, postpartum, and early-childhood
    taboos and rites: restrictions on a pregnant woman and her husband, sympathetic
    consequences for the child if restrictions are broken, steam-bathing after childbirth,
    offerings to the afterbirth, sex-specific periods of food taboo, attendants for
    a chieftainess, ear perforation, dancing, payments, potlatch-like distributions,
    and additional confinement rules.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman with child is instructed to rise early, leave the doorway immediately,
    jump across a creek twice, avoid lying outside the house, and avoid lingering
    in the doorway.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: Other people must not stand behind the pregnant woman or lie crosswise at
    her feet; nearby sleepers must orient their heads in the same direction as her
    feet.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: The pregnant woman must avoid necklaces, bracelets, corpses, dead or rotten
    things, raccoons, otters, inflated seal bladders, found food, trout, and steel-head
    salmon.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The husband is restricted from eating found food, killing raccoons or otters,
    singeing seals, shooting birds, and looking at corpses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that violations by the woman or husband can affect the
    child by sympathy, producing sickness, difficult birth, deformity-like marks,
    fainting, blisters, winds, or death.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: At childbirth the mother heats five stones, makes a ground hole, places two
    stones in it, ties a blanket around herself, and takes steam-baths for five days
    and nights, replacing cold stones with hot ones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the steam-bath, stones and personal items are placed inland in a hollow
    tree, and the afterbirth receives short dentalia and beads as presents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says that if presents are not given to the afterbirth, the child
    dies after a short time and the afterbirth takes it back.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: When a chieftainess gives birth, one or two women may be called to wash the
    child, cut the navel-string with a good knife, and receive payment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Food taboos after birth last five days for a boy and ten days for a girl;
    after the relevant period the parents may eat fresh food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: One month after birth the father invites people to dance, a man with a guardian
    spirit concerning children practices his art on the child, the child’s ears are
    perforated, and presents are distributed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Further dances, ear perforation, payments, and a potlatch are held when the
    child begins to stand and walk, first catches fish with a hook, and later shoots
    a first bird.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Additional rules state that outdoor birth brings lifelong reproach to the
    child, the husband may be present, the father avoids fishing, hunting, and water-going
    work for a set period, and a sick person in the house is screened from seeing
    the woman.
  category: other
  evidence_refs:
  - ev:9
