canonical_text:
  quote: ''
  summary: Several hunters approach wells with a little water, drink, and are shot
    by the salmon's son; bodies are hauled out and hidden. The youngest hunter recognizes
    that the salmon's son came in disguise, checks the wells, sees blood, repeatedly
    jumps in and out, drinks, and is killed. A man and woman burn their house, travel
    downriver by canoe, and the man tells the woman not to wake him for five days.
    Seeing flies, fly-blows, and maggots on him, she wakes him early. He reproaches
    her, throws her into the water, names her Pigeon, and says her summer cry will
    be heard. The salmon jumps into the water; the pigeon drifts ashore, where two
    ravens find her and discuss taking body parts.
  language: English
  quote_policy: summarized
