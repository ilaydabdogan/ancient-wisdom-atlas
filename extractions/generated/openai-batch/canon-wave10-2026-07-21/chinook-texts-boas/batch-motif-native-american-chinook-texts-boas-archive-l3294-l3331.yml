canonical_text:
  quote: ''
  summary: The passage describes ceremonial dancing by towns during a potlatch, the
    host’s request for relatives to bring food, formal presentation of food and gifts,
    restrictions against shooting arrows during the potlatch, graded distribution
    of dentalia, pre-war singing with an omen of blood, and the making of peace through
    exchanged presents or intertown marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from one town dance after another; when numbers are small or the house
    is large, people from multiple towns may enter together.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the host has too little food, two youths are sent to ask the host’s relatives
    to bring food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Relatives bring food, dance on canoes and land, and enter the house dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dry salmon is carried in the mouths of five men, and roots are carried on
    the backs of five men as they enter dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After five days of dancing, people receive presents; chiefs are named first,
    and men as well as women receive presents.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The person who names recipients may be given a blanket or long dentalia by
    a liberal host.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shooting arrows during the potlatch is forbidden because it could lead to
    fighting and deaths between towns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women receive a fathom of short dentalia; only men receive long dentalia;
    common men receive short dentalia.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before war, people sing; seeing blood during this singing foretells that the
    person or persons who see it will be killed in battle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During war singing, two long planks are placed parallel, and warriors kneel
    on them while singing.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: After people on both sides have been killed, the fighting stops; later the
    two parties exchange presents and make peace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: If a feud remains unsettled, a woman is married to a man of the other town
    to make peace.
  category: relationship
  evidence_refs:
  - ev:7
