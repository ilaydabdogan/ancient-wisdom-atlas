    them away, and burns their house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After traveling across a prairie toward smoke, the young man enters a house
    where a woman is crying; she sees him as resembling her killed husband, and he
    says the killed one was his father.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The woman warns that monsters will kill him, gives him food, and the young
