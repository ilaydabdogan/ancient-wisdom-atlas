canonical_text:
  quote: '"Be quiet, Coyote ! I know that you killed my father."'
  summary: The salmon's son confronts Coyote and Badger, demands his father's bow,
    tests several false bows until receiving the true one, kills and renames the two
    killers, and burns their house. He then travels to a meat-filled house where a
    crying woman lives among monsters, prepares a deception using pieces of flesh
    from his nape, alder-bark juice, ashes, and an old-man disguise, and the first
    entering monsters smell salmon, beat him, receive the meat bundles, and apologize.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A male traveler approaches a distant house, hears victory songs, and stands
    in the doorway while Coyote sings that Salmon's son has come and will kill him.
  category: sequence
  evidence_refs:
