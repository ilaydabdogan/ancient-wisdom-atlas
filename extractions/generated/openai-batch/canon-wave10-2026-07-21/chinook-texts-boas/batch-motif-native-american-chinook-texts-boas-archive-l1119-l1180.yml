canonical_text:
  quote: ''
  summary: A homesick husband is prepared by his wives and transported home inside
    a red whale/canoe, then returns with sea-otter skins and whale meat. He causes
    the eldest wife to enter the water under repeated loads of whale meat until she
    swims, flies, and receives the name Ooatch. A separate episode tells how Gull,
    angered by another person repeatedly reaching the beach before him, ambushes Raven,
    kills him, and takes fish from Raven's mat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man remains away for a long time and then says he is homesick.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: His wives prepare him for departure, each giving him five baskets and telling
    him he will be taken home the next day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the morning he sees a red whale on the beach; sea-otter skins are carried
    to the whale, which is glossed as a canoe, and he is told to lie down inside it
    and not look.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: After five nights he removes his blanket, finds the whale on the beach, cuts
    five pieces of blubber, carries the sea-otters and baskets ashore, and the whale
    returns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person on the beach relays the man's request that his wives come down; four
    wives come, while the eldest does not come at first, and two women have cut their
    hair.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The eldest wife combs herself, greases her hair, paints her face, comes to
    the beach, and lifts the whale.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man tells the eldest wife to turn toward the sea; pieces of whale meat
    are put on her back, the water rises by stages, and after five loadings she swims,
    moves her arms, and begins to fly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man names the flying woman Ooatch and says that when it is calm she will
    fly about and will no longer make chiefs miserable.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man goes home to his wives and gives them sea-otters and a piece of whale
    meat each.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gull goes to the beach every day to search for food and fills his bag with
    poggies, codfish, and flounders.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: On repeated mornings Gull finds tracks of a person who has already come and
    gone, finds no food, grows angry, and scolds; the passage says he had inherited
    the beach.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Gull sharpens his knife, says he will discover who comes earlier than he does,
    leaves while it is still dark, and meets Raven after the morning star rises.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Raven carries a large mat and repeatedly says it contains crabs' claws for
    his children while Gull goes around him five times.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Gull stabs Raven, Raven falls down and dies, and Gull pours out Raven's mat.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: Poggies, codfish, and flounders fall from Raven's mat; Gull puts them into
    his own mat, sings that he has killed the one who went out first, and goes home.
  category: sequence
  evidence_refs:
  - ev:9
