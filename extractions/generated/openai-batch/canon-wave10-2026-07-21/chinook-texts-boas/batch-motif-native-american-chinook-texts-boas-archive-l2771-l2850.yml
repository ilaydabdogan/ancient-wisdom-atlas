canonical_text:
  quote: ''
  summary: A youth pursuing fish ducks in the water faints and sees Iqamia'itx, described
    as a helper of fishermen. He later refuses food for three days and grows up. In
    a canoe, two youths identify Iqamia'itx as their guardian spirit and demonstrate
    powers to bring smelt and salmon. Another sequence tells of a bear-trapping youth
    who frees a supernatural woman from a trap, is promised hunting excellence, but
    displays her to his people and dies with them. Later an orphan boy sees the same
    woman, receives instructions involving a painted stick for elk hunting, sings
    about the earlier error, and is recognized as having seen a supernatural being.
  language: English
  quote_policy: summarized
