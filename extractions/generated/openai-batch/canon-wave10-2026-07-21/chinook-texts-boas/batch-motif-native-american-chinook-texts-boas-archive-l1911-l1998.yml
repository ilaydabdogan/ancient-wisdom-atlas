canonical_text:
  quote: ''
  summary: 'A sequence of Blue-Jay episodes: Blue-Jay and Robin obtain and eat a fish,
    quarrel and reconcile over portions, are twice summoned after Blue-Jay dreams
    of curing choking patients, receive food or territory payments, and later Blue-Jay
    misacts around his elder sister Io''i, her children, a duck, fire, and a stone
    after ambiguous food instructions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blue-Jay and Robin are hungry and travel by canoe to the sea, where a slough
    remains after the tide recedes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blue-Jay repeatedly calls a large fish called the sleeper to come ashore;
    after five calls it comes near the shore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Blue-Jay spears the sleeper fish, puts it in the canoe with Robin, and returns
    home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Robin makes a fire, Blue-Jay cuts the fish, the brothers quarrel over portions,
    Robin leaves crying, and Blue-Jay later calls him back to share the roasted fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Blue-Jay dreams that people have sent for them because he is to cure a sick
    person, and a Duck woman arrives in a canoe saying that a relative is choking.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Blue-Jay tells Robin what payment to request, removes the morsel choking the
    Duck's husband, and afterward the brothers dig roots on the place they received
    as payment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Blue-Jay dreams again, two young wolves arrive to summon him for a choking
    girl, Robin points to large baskets as connected with the disease, and Blue-Jay
    removes an elk kneepan from the girl.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Io'i, Blue-Jay's elder sister, digs roots and asks Blue-Jay to make arrows
    because ducks, geese, and tail-ducks bother her while she works.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Blue-Jay shoots Io'i in the buttocks; she takes the bow, identifies the birds,
    and kills a fat male mallard duck.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Io'i gives Blue-Jay food instructions that are later disputed; Blue-Jay plucks
    the duck, ties its fat to the noses of Io'i's children, has them look into the
    fire, sets aside a stone, and Io'i is struck on the forehead when she returns.
  category: sequence
  evidence_refs:
  - ev:6
