canonical_text:
  quote: ''
  summary: Blue-Jay and the people travel by canoe to a distant island rich in green
    abalone shells. Blue-Jay urges the people to leave their chief, Ca'xaL, behind.
    Ca'xaL remains on the island until an unnamed person and animal helpers return
    him inside a whale. At home he heals a child and two women of blindness, confronts
    Blue-Jay's abusive usurpation of the household, and distributes the abalone shells
    and other property among the people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blue-Jay proposes going the next day to see where an item from the sea was
    found, and he urges the people to arise and launch canoes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people travel far seaward, discover land, go ashore, and collect very
    green abalone shells from ground filled with shells.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief Ca'xaL separates from the group, goes around the island, and takes
    only large, very green abalone shells.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Blue-Jay repeatedly urges the people to leave the chief, and after dark the
    people follow Blue-Jay's advice and go home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ca'xaL finds that his people have left him, lies under a log, cries about
    being deserted, and remains there for a long time with the abalone shells.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: For several days Ca'xaL hears people talking on the beach below him, but when
    he looks he sees gulls or albatross; later a person stands near him and says he
    will be carried back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A whale is seen on the beach, and Ca'xaL is placed into a hole in the middle
    of the whale after being told not to open his eyes while being carried.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Animal or bird people carry Ca'xaL while paddling; albatross, pelicans, gulls,
    and snipes are addressed with paddle commands, and only gulls and snipes remain
    near landfall.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After reaching the beach, Ca'xaL carries abalone shells and sea otters inland,
    takes five cuts of the whale as instructed, and the whale returns.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At his house Ca'xaL sees a child shooting an arrow, hides the arrow, and the
    child complains as if Blue-Jay had hidden it; the child has no hair, sore eyes,
    and a deerskin blanket.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ca'xaL washes the child's face, blows on his eyes, restores his eyesight,
    identifies himself as returned, and gives him a sea-otter blanket.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The child reports that Blue-Jay made the household miserable, that two of
    Ca'xaL's wives are now Blue-Jay's wives, that Blue-Jay defecates in the house,
    and that two women who do not like Blue-Jay have lost their eyes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The child brings his mother and another woman to Ca'xaL; Ca'xaL washes their
    faces, they recover their eyesight, and they sweep the house and bring in his
    whale, sea otters, and abalone shells.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Blue-Jay defecates in the doorway and calls for the boy to wipe him; at Ca'xaL's
    instruction the boy pushes Blue-Jay with a firebrand, burning him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Blue-Jay sees the chief sitting in the house, tells the people that the chief
    has arrived, and Ca'xaL distributes all his property and abalone shells among
    the people.
  category: sequence
  evidence_refs:
  - ev:9
