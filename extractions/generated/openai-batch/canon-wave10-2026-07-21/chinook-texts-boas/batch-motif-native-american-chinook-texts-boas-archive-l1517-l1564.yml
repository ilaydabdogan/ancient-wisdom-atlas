canonical_text:
  quote: ''
  summary: An eagle deceives Crow during lousing, takes her salmon, and eats it in
    a spruce tree. Crow returns home with salmon parts; her children respond unevenly
    to her request for water, and Raven steals her roasting roe. Raven later steams
    invited crabs and feeds Crow and her children. Ca'xaL mourns his dead eldest child;
    two ravens drop an abalone shell from the air, after which Ca'xaL invites the
    people to his house.
  language: English
  quote_policy: summarized
