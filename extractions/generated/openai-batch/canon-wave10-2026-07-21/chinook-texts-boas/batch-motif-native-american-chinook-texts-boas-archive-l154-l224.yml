canonical_text:
  quote: ''
  summary: After several brothers have already died, two more brothers repeat a journey
    in which they shoot a pheasant, enter a house occupied by an old man and a boy,
    and are killed. The last remaining brother dreams instructions not to shoot the
    pheasant and not to enter the house at once. He follows the warning, finds his
    younger sister and her daughter, and joins them in killing the old man and boy
    by burning the house. The daughter finds the dead uncles, carries them to water,
    blows water on their bodies, and they arise. On the return journey the woman dives
    repeatedly in a lake, grows hair, remains in the lake, and becomes a monster.
    The brothers take only their niece home; after many people seek to marry her,
    a chief marries her.
  language: English
  quote_policy: summarized
