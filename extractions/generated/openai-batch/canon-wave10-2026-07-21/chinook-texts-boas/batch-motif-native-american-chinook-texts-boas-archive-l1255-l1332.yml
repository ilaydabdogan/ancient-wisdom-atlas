canonical_text:
  quote: ''
  summary: Coyote, Crane, and Heron dig clams together. Coyote repeatedly deceives
    Crane with false warnings about Oq'o'xoL. Oq'o'xoL captures them in a basket,
    but Heron escapes. Coyote and Crane are taken to her house, avoid being roasted,
    and later burn the house while Oq'o'xoL and her children are trapped by their
    hair. Crane's long tail is burned away. Coyote and Crane later fish at rapids;
    Crane catches good fish, while Coyote gets poor fish. Coyote tries unsuccessfully
    to kill Crane, then loses his own dried fish by trying to drive baskets instead
    of carrying them. Coyote declares that people should carry their food when moving
    rather than try to drive it.
  language: English
  quote_policy: summarized
