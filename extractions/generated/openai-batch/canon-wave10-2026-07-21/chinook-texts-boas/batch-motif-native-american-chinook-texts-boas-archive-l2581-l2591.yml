canonical_text:
  quote: ''
  summary: 'The passage describes a procedure used when a "strong man" has been shot:
    one or sometimes two children are prepared with face paint and tied hair; water
    is poured on the wounded man and the arrow removed; paired attendants, a girl
    and a boy, hold ritual objects; a man on the roof pours water so the blood comes
    out; if no "strong man" is available, a paid sucking shaman removes the blood.'
  language: English
