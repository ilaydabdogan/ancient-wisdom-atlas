  locator: lines 2471-2478; item 22
  quote_or_summary: A strong shaman may shoot or send disease; another strong shaman
    may remove five disease objects of bone with hair and one rope. The passage states
    that a person has two souls and dies if both are taken out.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: public domain; summarized from supplied passage
- id: ev:14
  type: summary
  locator: lines 2479-2484; item 23
  quote_or_summary: The shaman holds the disease-spirit in folded hands; it may escape
    when the thumb comes out. He is carried toward kettle water, where the disease-spirit
    is made soft and cold, then appears as a wolf's claw, bird's claw, human bone,
    or a person-shaped carving.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
