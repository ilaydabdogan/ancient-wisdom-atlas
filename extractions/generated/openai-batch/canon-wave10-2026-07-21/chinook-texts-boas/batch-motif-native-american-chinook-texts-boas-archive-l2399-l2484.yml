- id: ev:11
  type: summary
  locator: lines 2446-2458; item 20
  quote_or_summary: A hostile seer removes a sleeping person's soul and hides it near
    a corpse, in a canoe burial, in a thorny place, under a house, in rotten wood,
    in ghost country, or in the air; a shaman searches, and recovery depends on whether
    the soul is intact or being eaten by the shaman's spirit.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: public domain; summarized from supplied passage
- id: ev:12
  type: summary
  locator: lines 2459-2470; item 21
  quote_or_summary: A person secretly pays a shaman with long dentalia or a woman
    to remove another person's soul; the victim dies, and relatives may kill the shaman
    or forgive him after compensation in property or slaves.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/chinook-texts-boas.md
  rights_note: public domain; summarized from supplied passage
- id: ev:13
