canonical_text:
  quote: ''
  summary: A sequence of Chinook Texts items describes seers, shamans, souls, ghosts,
    disease, and prognosis. A cedar-bark manikin can carry a person to the ghosts.
    Sick persons recover or die depending on where their soul has gone, whether shamans
    or their spirits retrieve it, whether it has taken ghost property, whether it
    is carried into the ocean, and signs such as high or low water, sparks, or the
    soul's weight. Shamans can deceive ghosts with a deer decoy, steal or retrieve
    souls, send or remove disease, and process a disease-spirit in water. Some acts
    are linked to secret payment, retaliation, or compensation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A seer who wants to shake a cedar-bark manikin gives it to a person without
    a guardian spirit, and the manikin carries that person to the ghosts, where the
    person sees everything in the country of the ghosts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes soul-loss situations in which a sick person recovers
    after a soul is caught or brought back from the country of the Indians or the
    country of the ghosts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A chief's soul is said to go to the beach, and only strong shamans are said
    to know how it goes there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a soul has taken something belonging to the ghosts, the sick person cannot
    recover.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: High water is associated with a sick person's death, while low water is associated
    with recovery.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the soul of a sick person is placed in a canoe and carried out into the
    ocean, the sick person cannot recover.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When sparks fall like a firebrand during an attempt to take a sick person's
    soul, the shaman declares that he will not cure the patient.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: A soul is described as heavy when the person will die and light when the person
    will recover.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:9
  text: When ghosts watch a soul, the shaman makes a deer; the ghosts pursue the deer
    and leave the soul, allowing the shaman to take the soul back.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: A hostile seer can remove a sleeping person's soul and hide it near a corpse,
    in a canoe burial, in a thorny place, under a house, in rotten wood, or elsewhere;
    a shaman may search for it and return it if it remains hale and well.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: A person can secretly pay a shaman with long dentalia or a woman to remove
    another person's soul; the victim dies, and the shaman may be killed or forgiven
    after giving property or slaves.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: A strong shaman may send disease, and another strong shaman may remove disease
    objects described as five bone-and-hair pieces and one rope.
  category: object
  evidence_refs:
  - ev:13
- id: obs:13
  text: When both souls of a person are taken out of the body, the owner must die.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The extracted disease-spirit is held in the shaman's folded hands, may escape
    when the thumb comes out, is carried toward water, is softened and cooled in water,
    and may appear as a wolf's claw, bird's claw, human bone, or a carved human-shaped
    object.
  category: sequence
  evidence_refs:
  - ev:14
