canonical_text:
  quote: ''
  summary: A youth returning to Clatsop sees many canoes and spear-bearing people,
    escapes their attack, and warns the village. His warning is dismissed, but he
    and his grandfather hide inland. At dawn the village is attacked; many are killed
    and children are taken. A messenger brings help from Kono'pe, and the Quileute
    are driven off and pursued by canoe. During the sea pursuit, captive boys are
    thrown into the water, with some drowning and some surviving. The defeated Quileute
    reach Quenaiult with canoes full of corpses, which are set upright with hats;
    the survivors lie from shame about the deaths.
  language: English
  quote_policy: summarized
