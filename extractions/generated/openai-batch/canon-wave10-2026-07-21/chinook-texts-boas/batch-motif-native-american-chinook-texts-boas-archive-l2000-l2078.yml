canonical_text:
  quote: ''
  summary: 'The supplied passage contains several episodes involving Blue-Jay and
    Io''i: a canoe-making misunderstanding; Blue-Jay taking a dead chief''s daughter
    as a wife after misunderstanding Io''i''s instruction; a journey through towns
    of supernatural beings who refer him onward for curing the dead woman; ghosts
    purchasing and marrying Io''i, after which she disappears; Blue-Jay searching
    for his sister by asking trees and birds where the dead go; and a visit to Magpie,
    who cooks one salmon egg until a kettle is full.'
  language: English
  quote_policy: summarized
