canonical_text:
  quote: ''
  summary: 'The passage describes a guardian spirit that lets its possessor understand
    babies and reports a sunrise land of children, including possible return of a
    dead child as a newborn. It then gives rules for first and second menstruation
    rites: hiding, fasting, cedar bark bindings, dentalia and buckskin adornment,
    potlatches, old-woman attendants, bathing, food restrictions, prohibitions on
    looking, berry-picking, warming, paddling, salt-water contact, and contact with
    children or sick persons. It also describes effects attributed to menstruant women
    on weather, a spruce tree, fishing gear, food, and the distribution of presents
    or dentalia by relatives.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A certain guardian spirit enables its possessor to understand babies' cries
    and cooing, and a child may tell the possessor where it came from or when it will
    die.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit informed people that the land of the children is in sunrise.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a child dies and another is later born into the same family, the passage
    says it may be the same child returned; an ear perforation may also appear again,
    but old people cannot return as newborn infants.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A continually sick chief with a not-yet-mature daughter may hold a potlatch
    and pretend that she is menstruant for the first time; people dance five days
    and are paid.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a chief's daughter's first menstruation, she is hidden from view and cared
    for only by an old woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cedar bark is tied to the girl's arms, legs, and waist, and she fasts for
    a stated number of days.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a potlatch and five days hidden, the cedar bark is removed; dentalia
    strings and a buckskin strap are tied on her for one hundred days, and old women
    wash, paint, and comb her before being paid.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girl has a separate door, bathes in a distant creek, and avoids fresh
    food for fifty days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At her second menstruation, her father gives another potlatch, and she must
    not warm herself, look at people or the sky, or pick berries; looking at the sky
    is said to cause bad weather, and picking berries is said to cause rain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: When she hangs her cedar-bark towel on a certain spruce tree, the tree dries
    up at once.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: When people move, she is carried into the canoe, must not paddle, must not
    step in salt water, bathes at night, and must rise earlier than the birds; correct
    observance is linked to living to old age.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the second menses, the special customs are finished, but at later menstruations
    she leaves the house for four or five days, and sick persons and children are
    restricted from seeing her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A menstruant woman's eating fish caught in a net, or sturgeon caught with
    a hook, makes the net or hook unlucky; berries she picks must not be eaten by
    children or sick persons.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: If a first-menstruant girl has no father, maternal or paternal relatives may
    give the potlatch; when few dentalia are available, people may be invited to look
    at the girl, receive presents, and not dance.
  category: action
  evidence_refs:
  - ev:7
