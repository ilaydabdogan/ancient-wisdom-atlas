canonical_text:
  quote: ''
  summary: 'Blue-Jay summons two powerful strangers to a shooting match with his chief.
    The strangers win the chief’s wealth, people, father, Blue-Jay, and body parts,
    then rename and assign future conditions to the defeated figures, bless the mice,
    and restore their father’s eyesight. A second episode tells of a dead chief’s
    son and daughter: the daughter becomes pregnant after swallowing water during
    fog while hunting sea-otters; Blue-Jay’s accusation leads the people to abandon
    the siblings. The siblings recover fire hidden in a shell by their aunt Crow,
    build houses from drifted planks, and receive sea-animal food that the sister
    attributes to supernatural people across the ocean and to her boy’s father.'
  language: English
  quote_policy: summarized
