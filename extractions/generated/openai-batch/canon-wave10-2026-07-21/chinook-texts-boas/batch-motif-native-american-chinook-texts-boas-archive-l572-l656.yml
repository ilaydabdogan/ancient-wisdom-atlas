- id: motif:2
  label: Punitive animal naming after defeat
  taxonomy_refs: []
  basis: After defeat, Blue-Jay’s chief is marked with roots, flint, and green mud,
    thrown into water, and named Green Sturgeon; Blue-Jay is also renamed and assigned
    an ominous song.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives naming and future conditions, but explicit bodily transformation
    is not fully narrated.
- id: motif:3
  label: Sight restored by water and breath
  taxonomy_refs: []
  basis: The winners take their father to the water, blow on him, and he recovers
    his eyesight.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is restoration of eyesight, not a full resurrection in the passage.
- id: motif:4
  label: Pregnancy through swallowed water in mist
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: The girl swallows water dripping from her hair during fog or mist and later
    becomes pregnant; the later food episode connects the unborn boy with supernatural
