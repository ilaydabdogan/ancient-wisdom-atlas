canonical_text:
  quote: ''
  summary: Blue-Jay and the people abandon a boy at the water. The boy hunts eagles,
    wears an eagle skin, and flies back to observe the people eating sealion. He later
    reveals hidden meat to the women and children, prepares them with washing and
    grease, removes house wall planks, and sends them seaward with instructions. The
    women and children swim and circle rocks five times; red-billed birds appear and
    are identified by Raven as Blue-Jay's children. The boy makes mussels fast to
    the rocks, names the women Whale-Killer, and forbids giving food to stingy people.
    Blue-Jay and the people return to find the village changed; Raven can still find
    food, while Blue-Jay cannot gather mussels, and the passage concludes that the
    chief took revenge.
  language: English
  quote_policy: summarized
