canonical_text:
  quote: ''
  summary: The passage recounts Crow's response to Raven's death, her war with Gull
    and negotiation for early-morning low water; then Coyote transforms dangerous
    surf at Clatsop into prairie and establishes or learns rules and omens concerning
    salmon at Nia'xaqce.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People find Raven dead on the beach, and a young man is sent to inform Crow,
    who is identified as Raven's sister; he repeats that Gull killed her brother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Crow remains silent at first, then ties cedar bark around her head and waist,
    takes a rattle, sings, and shakes the rattle.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Crow calls together her land-bird people, while Gull calls together his own
    named bird people, described as flat-footed.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Crow makes war against Gull; a war song is sung, Duck-hawk kills Tail Duck,
    and part of Gull's people are killed and become afraid.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Crow asks for low water early in the morning, refuses several alternative
    tide offers, and Gull finally grants the request after his people urge him to
    concede.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Coyote meets heavy surf, retreats to spruce trees, throws sand on the surf,
    declares it will be prairie with no surf, and Clatsop becomes prairie.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Nia'xaqce a creek originates; Coyote builds a house, stays at the creek
    mouth, and spears silver-side salmon, steel-head salmon, and fall salmon.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coyote throws away the salmon and fall salmon and declares that killing such
    fish in the creek will be a bad omen, with female fish linked to a woman's death
    and male fish to a man's death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After Coyote cuts, steams, and eats silver-side salmon, the fish disappear;
    his excrements tell him that the first silver-side salmon must be split along
    the back and roasted, not cut or steamed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After Coyote roasts three salmon on three spits and the fish disappear again,
    his excrements say that separate spits must be made for the head, back, roe, and
    body, and that the gills must be burnt.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Coyote later kills three more silver-side salmon, cuts them, makes many spits,
    and roasts the parts separately; the passage ends during the listing of parts.
  category: action
  evidence_refs:
  - ev:10
