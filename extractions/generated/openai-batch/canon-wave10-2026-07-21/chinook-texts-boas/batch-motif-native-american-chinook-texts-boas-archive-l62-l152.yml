canonical_text:
  quote: ''
  summary: 'The passage first gives a first-person account of collecting Chinook and
    related dialect texts, emphasizing Charles Cultee as an important informant and
    explaining the translation approach. A translated narrative then begins: five
    brothers have a younger sister who is carried away by a grizzly bear. Two elder
    brothers, one after the other, search for her, shoot and hang a pheasant on a
    tree branch, enter a house with an old man and a boy, comply when the boy asks
    to be loused, and are killed when they squeeze a louse. Their bodies are hidden
    in the woods. The bear''s wife and daughter are away digging gamass; the daughter
    senses an arrival, later smells blood in the house, becomes angry, and strikes
    her father and brother with a firebrand.'
  language: English
  quote_policy: summarized
