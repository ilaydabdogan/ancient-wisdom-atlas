- id: motif:2
  label: Sibling pair acting together
  taxonomy_refs:
  - sibling_pair
  basis: Two boys, one elder and one brother, grow into young men and travel together
    as Cikia.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage says the mother gave birth to two boys but does not explicitly
    use the word twins.
- id: motif:3
  label: Forbidden upriver journey reveals hidden death and kin
  taxonomy_refs:
  - forbidden_knowledge
  basis: The mother forbids the sons to go upriver; they go there, find bones, and
    later discover their injured father in a basket.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The prohibition is spatial rather than an explicit ban on knowledge, though
    it conceals the father's condition and the bones.
- id: motif:4
  label: Monster-belly rescue and revival by breath
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: A brother is swallowed or contained in a lake monster; the elder brother
    cuts open monsters, recovers him, blows on him, and he arises.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly say the swallowed brother was dead, so
    resurrection is possible but not certain.
- id: motif:5
  label: Transforming dangerous beings into animals
  taxonomy_refs:
  - shapeshifter
  basis: The mother is transformed into a dog, and the knife-bearing would-be killer
    is made into or named deer so he will not kill humans.
  evidence_refs:
  - ev:7
  - ev:15
  confidence: medium
  cautions: The transformations are imposed by the brothers; the figures are not described
    as voluntary shapeshifters.
- id: motif:6
  label: Creation of people from bodily dirt and breath
  taxonomy_refs:
  - culture_hero
  basis: The brothers rub dirt from their arms, form people from it, blow on them,
    and the people arise.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: No more specific supplied taxonomy reference covers creation from dirt
