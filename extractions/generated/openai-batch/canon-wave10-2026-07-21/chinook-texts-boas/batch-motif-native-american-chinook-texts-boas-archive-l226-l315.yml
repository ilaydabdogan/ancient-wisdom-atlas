canonical_text:
  quote: ''
  summary: A woman associated with Blue-jay laughs destructively, devours her husband's
    people, and leaves her injured husband hidden in a basket. Her two sons discover
    the bones and their father, cure him, and transform their mother into a dog. The
    brothers, later called Cikia, travel on, rescue one brother from lake monsters
    after he pursues a two-headed swan, establish or correct practices involving flounder,
    rain, human creation, salmon, and transform a knife-bearing killer into a deer.
  language: English
  quote_policy: summarized
