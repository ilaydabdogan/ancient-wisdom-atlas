canonical_text:
  quote: ''
  summary: After a chief dies at Nakot !a't, the people are hungry in winter and live
    on mussels and roots. Men repeatedly canoe to a sealion island, where a hunter
    kills sealions and Blue-Jay urges the party to cook and eat the meat there, burn
    leftovers, and keep the chief's son from learning or accompanying them. Raven
    repeatedly tries to hide pieces of meat, but Blue-Jay discovers and burns them.
    The party returns with mussels, which Stikua', other women, and children carry
    home. The chief's son repeatedly tries to accompany the men, but Blue-Jay warns,
    pushes, and finally throws him into the water to prevent him.
  language: English
  quote_policy: summarized
