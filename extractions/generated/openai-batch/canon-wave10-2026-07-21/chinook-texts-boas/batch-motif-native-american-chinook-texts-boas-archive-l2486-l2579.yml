canonical_text:
  quote: ''
  summary: Numbered prose notes describe Chinook shamanic practices involving disease-spirits,
    extraction of a rope from a patient, cutting that rope to affect the disease-sender,
    the timing of sickness, paid revenge sorcery, family feuds, testing claims of
    guardian-spirit power, healing by song, shamanic power tests on tree bark and
    an eagle, weather-working through a sea guardian spirit, and treatment of a shot
    person with water and thunder as a sign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A disease-spirit is described as having cuts on its arms in numbers corresponding
    to how many people it has murdered.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a shaman takes out a disease-spirit and brings his hands near a kettle,
    the kettle bursts when the spirit sees the water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the shaman holding the disease-spirit becomes tired, another shaman strikes
    his hands with a rattle; the shaman puts his hands in water, rubs the spirit,
    and shamans help pull out a rope.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The rope is pulled from the body of the person to whom disease was sent, and
    a person without a guardian spirit cannot cut or feel it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman with a guardian spirit can cut through the rope with a small knife,
    after which blood flows out until all the blood has flowed out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the rope is cut, the person who sent the disease is struck with the
    knife, or, if an arrowhead was used on the rope, is shot and killed with an arrow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Long or short ropes of disease-spirits correspond to a longer or shorter delay
    before sickness comes on a person.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: When disease is sent to a chief's child, secret shaman payments and retaliatory
    disease-sending can lead to killings, family feud, blood fines, and peace only
    after several deaths.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A shaman may send disease against an enemy; payment in dentalia can lead to
    forgiveness rather than killing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Secret payment to a shaman is described in cases involving an eloped wife,
    a deceased relative's wife taken by a stranger, or revenge for an elder brother's
    death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Shamans test a person who claims a great guardian spirit by trying to hit
    him with a disease-spirit; a true possessor is missed, while a false claimant
    is hit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A strong man can resist disease sent by shamans, while a person falsely claiming
    to be strong dies at once when disease is sent to him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: If a guardian spirit makes a person sick, friends pay a shaman to sing; the
    sick person gets well if the singing succeeds and dies if it does not.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A shaman tests his power by sending disease to tree bark, which bursts and
    falls, and to an eagle on a spruce tree, which falls with blood in its mouth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: For bad weather, people ask a good person with a sea guardian spirit to sing
    for good weather; he predicts clearing or says the task is too difficult.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: For a shot person, a strongman is paid to lend his guardian spirit; water
    is poured on the wounded person's face, blood comes out, and thunder is predicted
    as a sign if he gets well.
  category: sequence
  evidence_refs:
  - ev:10
