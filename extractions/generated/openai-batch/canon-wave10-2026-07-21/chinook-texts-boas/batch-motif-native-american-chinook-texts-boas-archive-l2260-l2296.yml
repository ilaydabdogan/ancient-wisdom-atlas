canonical_text:
  quote: ''
  summary: A panther who hunts elk finds a spruce branch, twists it, puts it under
    his bed, and wishes it would become a man. After repeated signs of disk-playing
    in his house, he hides and sees a youth playing and singing that his brother calls
    him a spruce branch and twisted him often. The panther accepts him as a younger
    brother, gives him arrows, and warns him not to go downriver. The youth grows
    up, later goes downriver, shoots a chicken-hawk, follows it to a house, and enters
    despite fearing danger because he wants his arrow back.
  language: English
  quote_policy: summarized
