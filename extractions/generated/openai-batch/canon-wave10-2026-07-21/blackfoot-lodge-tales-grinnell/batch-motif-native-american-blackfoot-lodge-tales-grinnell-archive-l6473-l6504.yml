  quote: ''
  summary: Old Man loses his weapons while fording a river, makes replacement weapons
    from available wood, then taunts a bear on a mountain. His rotten bow, spear,
    and knife fail against the bear. Pursued and unable to find help or another weapon,
    he picks up a bull's horn, places it on his head, bellows, and frightens the bear
    away.
