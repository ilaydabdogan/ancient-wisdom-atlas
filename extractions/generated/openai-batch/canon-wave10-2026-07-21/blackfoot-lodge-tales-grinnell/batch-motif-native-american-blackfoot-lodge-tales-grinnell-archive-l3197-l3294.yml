canonical_text:
  quote: ''
  summary: A bear encourages the wounded Mik-a'pi, treats his wounds with mud while
    singing a medicine song, feeds him berries, carries him for four days to the Pikiin'i
    lodges, and then leaves up the mountain. Mik-a'pi is carried to his father's lodge,
    gives three scalps to the widows as revenge, and is honored with a scalp dance
    and Medicine Lodge recognition. The passage then begins a new tale in which Heavy
    Collar leads a war party, scouts ahead, kills a bull, roasts meat alone, wishes
    for bull hair to wipe his gun, and sees the hair arrive through the air.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bear addresses Mik-a'pi as brother, tells him not to be faint-hearted,
    and says he will help him survive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bear carries Mik-a'pi to thick mud, plasters his wounds with mud, and
    sings a medicine song while applying it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bear brings Mik-a'pi to sarvis berries, breaks off berry branches for
    him to eat, and then carries him on his back while Mik-a'pi holds his hair.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bear and Mik-a'pi travel through the night, rest and eat berries in the
    morning, and continue until the fourth day, when they come near the Pikiin'i lodges.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When they near Mik-a'pi's people, the bear tells him to get off, says he must
    leave, and goes up the mountain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people carry Mik-a'pi to his father's lodge; he unties three scalps from
    his belt, gives them to the widows, and says they are revenged and that he wipes
    away their tears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note states that the bear's paws are called by the same term used for a
    person's hands and that the bear is regarded as almost human.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the scalp dance, widows with black-painted faces carry scalps on poles,
    followed by medicine men with unwrapped medicine pipes, war-costumed bands of
    the I-kun-uh'-kah-tsi, old men, women, and children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the Medicine Lodge, Mik-a'pi is chosen to cut the rawhide binding the poles,
    counts his coups while cutting, tells of enemies he has killed, and is publicly
    praised.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The father of two young sisters gives them to Mik-a'pi, and the narration
    says Mik-a'pi lived long, was the greatest of chiefs, and was believed by old
    men to have been helped by ghosts.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Heavy Collar is the leader of a party of seven men traveling to war; on the
    return he scouts ahead on high hills while the party travels concealed in coulees
    and low places.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Heavy Collar leaves his party, kills one of three old bulls, cuts it up, goes
    into a ravine, and roasts meat alone as night comes on.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: While thinking that a young man could fetch hair from the bull's head so he
    could wipe out his gun, a bunch of hair comes through the air and falls in front
    of Heavy Collar.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
