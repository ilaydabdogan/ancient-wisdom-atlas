canonical_text:
  quote: ''
  summary: E-kus'-kini begins his last war trail with six Sarcees. After a difficult
    river crossing wets and spoils much of their powder, he reports dreams and unease
    foretelling trouble and dead bodies on the prairie. Some young men first urge
    continuing to seek horses, but after further warning and the loss of ammunition,
    the party turns back. E-kus'-kini then sends two men ahead as lookouts because
    he fears they will encounter an enemy.
  language: English
  quote_policy: summarized
