canonical_text:
  quote: ''
  summary: A lost woman is guided by a dream person who keeps his back turned and
    cannot be overtaken. The dream person instructs the medicine man to send the woman's
    husband to a specified place, where antelope will signal her approach. The husband
    follows the instructions, recognizes and recovers his wife, and brings her back
    to camp. A handsome girl is then given to the medicine man as wife.
  language: English
  quote_policy: summarized
