canonical_text:
  quote: ''
  summary: A man believed dead after going hunting is revealed to have fallen into
    a pit. Wolves and other animals rescue him and take him as a brother. An old blind
    wolf heals him and changes his head and hands to resemble a wolf's. The man-wolf
    helps the animals evade snares and steal meat from the pis'kun until people bait
    and capture him. Recognized by firelight, he says his wives tried to kill him
    by digging the hole. The people become angry; he gives the women to the I-kun-uh}-kah-tsi,
    and the women are never seen again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The women are asked why they are mourning and where their husband is; they
    answer that he is dead because he went hunting five days earlier and did not return.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man fell into a pit, was badly hurt, and could not climb out.
  category: action
  evidence_refs:
