- id: obs:3
  text: A wolf saw the man in the pit, pitied him, howled, and gathered wolves, coyotes,
    badgers, and kit-foxes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolf called the man his find, proposed that the animals dig him out, and
    said they would have him as their brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The animals dug toward the man; the finding wolf pulled him out, the animals
    gave him a kidney to eat, and the big wolves took him to their home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A very old blind wolf with powerful medicine cured the man and made his head
    and hands look like those of a wolf, while the rest of his body remained unchanged.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: People used holes in the pis'kun walls with snares to catch wolves and other
    animals that came to steal meat.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man-wolf went ahead of the animals and sprang all the snares so that wolves,
    coyotes, badgers, and foxes could enter the pis'kun, feast, and carry meat away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For many nights the people found the meat stolen and the nooses drawn out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When only meat from a scabby bull was present, the man-wolf cried out in anger,
    and the people heard him and identified the culprit as a man-wolf.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The people baited the pis'kun with pemmican and back fat, hid nearby, and
    caught the man-wolf with ropes when he began eating.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Inside a lodge, by the light of the fire, the people recognized the man-wolf
    as the man who had been lost.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The man said he had not been lost; he said his wives tried to kill him by
    digging a deep hole, and that the wolves took pity on him and helped him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the people became angry, the man gave the women to the I-kun-uh}-kah-tsi;
