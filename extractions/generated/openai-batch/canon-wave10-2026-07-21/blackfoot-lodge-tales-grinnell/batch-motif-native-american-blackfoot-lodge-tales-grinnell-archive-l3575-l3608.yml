canonical_text:
  quote: ''
  summary: 'Opening of “The Wolf-Man”: a man with two wives moves his lodge away from
    other people onto the prairie. He regularly climbs a high butte to watch for buffalo
    and enemies, sitting on a buffalo skull there. The wives complain of loneliness,
    decide to kill him, dig a covered pit under the skull while he is away hunting,
    and later cause him to fall into it. They then pack the lodge on a dog travois,
    head toward the main camp, and begin to cry and mourn when close enough to be
    heard.'
