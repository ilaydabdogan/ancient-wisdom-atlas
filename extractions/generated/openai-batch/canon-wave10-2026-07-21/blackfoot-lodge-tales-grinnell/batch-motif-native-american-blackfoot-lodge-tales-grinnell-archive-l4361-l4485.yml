canonical_text:
  quote: ''
  summary: Scarface reaches the Sun's household through Morning Star, is received
    by the Moon and the Sun, is warned about dangerous birds near a great water, kills
    the birds to save Morning Star, receives the Sun's permission to marry the girl
    he seeks, and is taught cosmological and ritual instructions concerning the Sun,
    sacred foods, the world, a vowed lodge, and a sweat house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Scarface says that he is going to the Sun.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A-pi-su'-ahts, identified in the note as Morning Star, says the Sun is his
    father and takes Scarface to the Sun's lodge.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun's lodge is described as large and handsome, with strange medicine
    animals painted on it and the Sun's weapons and clothes behind it on a tripod.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ko-ko-mik'-e-is, identified in the note as the Moon, is the Sun's wife and
    Morning Star's mother; she speaks kindly to Scarface and feeds him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Scarface says he came to ask the Sun for a beautiful girl because she belongs
    to the Sun.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before the Sun enters, the Moon hides Scarface under robes; the Sun stops
    at the doorway and says he smells a person.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Morning Star vouches for Scarface as good because Scarface found Morning Star's
    things on the trail and did not touch them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sun welcomes Scarface into the lodge and asks him to be Morning Star's
    friend.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Moon warns Scarface not to hunt near the big water because great birds
    with long sharp bills live there, kill people, and have killed many of her sons.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Morning Star wants to go toward the birds, and Scarface follows because he
    believes he must kill the birds and save the boy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Scarface kills every one of the birds with his spear; the young men cut off
    the birds' heads and carry them home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Morning Star's mother is glad, cries, and calls Scarface her son; the Sun
    also expresses gratitude and asks what he can do for Scarface.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Sun grants the girl to Scarface and says he is glad she has been wise
    and has not done wrong.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Sun says he is the only chief, that he made the earth, landforms, waters,
    forests, people, and animals, and that he grows old in winter and young again
    in summer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Sun identifies the raven as the smartest animal, the buffalo as especially
    favored, the buffalo tongue as sacred to him, and berries as sacred to him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Sun takes Scarface to the edge of the sky, where they look down and see
    the world as round and flat with a jumping-off place or walls at the edge.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Sun gives instructions for a woman's vow to build him a lodge if her husband
    recovers, and for building a round lodge and a hundred-stick sweat house painted
    half red and half black.
  category: speech
  evidence_refs:
  - ev:10
