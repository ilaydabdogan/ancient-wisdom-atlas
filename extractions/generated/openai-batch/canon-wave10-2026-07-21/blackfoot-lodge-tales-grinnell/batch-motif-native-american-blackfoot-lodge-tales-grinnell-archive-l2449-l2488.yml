canonical_text:
  quote: ''
  summary: A Piegan woman captured after a fight appeals to her people for protection,
    but young men tie her and her mother wants to kill her. After the Piegans defeat
    the camp, the woman's husband strips her, ties her dead Snake man's scalp around
    her neck, and forces her to dance or run through a fire until she dies. An old
    Snake woman and her relations, who had helped the poor man, are rewarded with
    half the captured horses and valuables, invited to go north with the Piegans,
    and eventually become incorporated among them through residence and intermarriage.
    A footnote adds a later genealogical notice involving a Snake descendant and a
    Hudson's Bay Company employee.
  language: English
  quote_policy: summarized
