canonical_text:
  quote: ''
  summary: Heavy Collar travels upstream at night and sleeps in a rye-grass patch
    without knowing a woman had been killed there. In the morning he sees her skeleton
    beside him. The next night, while camping by a fire built in the fork of a drifted
    tree on an island, he hears something dragging toward him. The bones appear as
    a skeleton or ghost wearing a lodge covering. The ghost whistles and swings its
    legs. Heavy Collar repeatedly asks it to go away; when it ignores him, he shoots
    at it, and it falls backward into the darkness screaming.
  language: English
  quote_policy: summarized
