canonical_text:
  quote: ''
  summary: Old Man rests on a rock and gives it his robe, then tries to reclaim the
    robe when rain begins. The rock keeps the robe as a gift, so Old Man angrily takes
    it back. The rock rolls after Old Man and Coyote, injuring Coyote and killing
    or cutting up several animal helpers. Bull bats finally chip and split the rock.
    Old Man then alters young bull bats' mouths and bills, and the tale explains their
    present appearance.
  language: English
  quote_policy: summarized
