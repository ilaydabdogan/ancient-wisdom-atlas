canonical_text:
  quote: ''
  summary: The passage describes an ordinary Blackfoot horse-raiding expedition, assessments
    of war leaders by luck, practices after killing enemies and losing a Blackfoot
    member, revenge mutilation and trophy dances, and the treatment, adoption, killing,
    or release of captives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A raiding party leaves food in camp but carries ropes, whips, guns, and blankets
    while running toward the enemy camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After creeping close to the lodges, the leader selects men described as having
    strong hearts to enter the camp and cut horses loose.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rest of the party remains outside the camp, watches the outskirts, and
    drives in horses found feeding loose nearby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raiders cut loose one or more tied horses, drive the horses a short distance
    slowly, then mount and ride away fast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The described horse-raiding party generally travels two nights and one day
    before sleeping.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Blackfeet believe strongly in luck and will follow
    a leader whose expeditions have been fortunate into danger.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: If a war-party leader loses young men, people in camp regard him as unlucky;
    young men stop following him as leader, and he may serve under another leader.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When a party kills several enemies but loses one of its own, it may count
    most of the enemy dead as covering or paying for the slain Blackfoot and hold
    a scalp dance over the remaining enemy dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports that Blackfeet sometimes cut a killed enemy to pieces,
    especially as revenge for a relative killed by that enemy's tribe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Enemy bodies or body parts could be brought into camp, used for counting coup,
    or danced over as trophies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women and children of hostile tribes were often captured and adopted into
    Blackfoot tribes with the rights and privileges of indigenous members.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Captured men were rare; some were killed, especially after desperate resistance,
    while others were later released with provisions, clothing, arms, and a horse.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A captive man brought into camp could be struck, pelted with dirt, and counted
    coup upon by women and children; he was rarely tied but watched, and his captor
    might have to prevent others from killing him.
  category: action
  evidence_refs:
  - ev:9
