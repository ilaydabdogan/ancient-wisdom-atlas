  summary: The antelope and the deer dispute which can run faster. The antelope wins
    a prairie race and takes the deer's gall. The deer then proposes a race in the
    timber, his home terrain. The deer wins there and takes the antelope's dew claws.
    The tale ends by explaining why deer have no gall and antelope have no dew claws.
