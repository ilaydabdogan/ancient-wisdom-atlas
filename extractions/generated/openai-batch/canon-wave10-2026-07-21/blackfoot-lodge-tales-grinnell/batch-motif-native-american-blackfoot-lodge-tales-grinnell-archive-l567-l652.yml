canonical_text:
  quote: ''
  summary: A Piegan chief named Owl Bear dreams of victory over the Snakes and leads
    a large war party. He repeatedly reports favorable dreams, while the other men
    repeatedly report bad dreams of blood and turn back in stages. The party travels
    south, shelters in concealed war lodges, and eventually only Owl Bear’s relations
    remain. Near the Elk River, they urge him to return and attempt to restrain him,
    but he refuses and threatens them with a drawn bow.
  language: English
