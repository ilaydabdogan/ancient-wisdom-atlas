canonical_text:
  quote: ''
  summary: Mik-a'pi stealthily kills and scalps Snake watchers near an enemy camp,
    escapes pursuit by falling into a river and drifting downstream on a pine log,
    then, badly wounded, prays to the Sun and the Above Medicine Person before a speaking
    grizzly bear appears and questions him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dark figure crawls through grass toward a watcher, grasps him, covers his
    mouth, stabs him repeatedly with a jagged knife, and kills him without a cry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dark figure removes the scalp and is identified as Mik-a'pi, who has another
    Snake scalp tied to his belt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mik-a'pi says he must have one more scalp before going back, then hides in
    thick pines on the mountain and sleeps.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At daylight Mik-a'pi sees smoke as women start fires and sees people rush
    to the hill where the dead watcher lies; from far away he sings a war song.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night Mik-a'pi descends the mountain, approaches the camp, and crawls around
    the outskirts slowly and like a snake while listening and looking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The moon rises high, and the Seven Persons swing around and point downward,
    marking the middle of the night.
  category: setting
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:7
  text: Mik-a'pi shoots a watcher in the bush with arrows after the watcher stands,
    stretches, and yawns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Warriors rush from the lodges and camp outskirts; Mik-a'pi tears the scalp
    from his fallen enemy and runs toward the river while arrows strike his arm and
    leg.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mik-a'pi falls at the verge of a high rock wall, rolls into the dark river
    below, and is not found by the Snakes despite their search.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Mik-a'pi surfaces far downstream, removes a lance-shaped arrow from his leg,
    rolls a dry pine log into the stream, rests partly on it, and drifts down the
    river all night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After waking, Mik-a'pi's wounds are swollen and painful; he says the signs
    were true, regrets going against them, expects to die, and worries about widows
    and his parents.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mik-a'pi prays to the Sun and the great Above Medicine Person for pity, help,
    and survival.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: A big grizzly bear appears, addresses Mik-a'pi as brother, asks why he prays
    to survive, and hears Mik-a'pi describe his wounds, weakness, distance from home,
    and lack of food.
  category: speech
  evidence_refs:
  - ev:8
