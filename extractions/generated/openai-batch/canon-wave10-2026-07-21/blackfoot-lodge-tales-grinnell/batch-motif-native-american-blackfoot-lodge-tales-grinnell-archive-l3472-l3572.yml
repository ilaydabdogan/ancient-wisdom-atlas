canonical_text:
  quote: ''
  summary: At night in camp, Heavy Collar encounters a bear that speaks to him and
    is identified as the ghost woman. The ghost threatens the camp, manipulates the
    lodge so smoke fills it, and refuses an old woman's pipe-smoke prayer. Heavy Collar's
    mother follows the ghost while holding the pipe; Heavy Collar and others try to
    hold her back in a human chain. She drops the pipe, dies, and the ghost disappears.
  language: English
