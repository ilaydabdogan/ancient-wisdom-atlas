canonical_text:
  quote: ''
  summary: A Blackfeet man, his wife, and other women leave camp so the women can
    pick berries despite the risk of Snake or Crow war parties. The man stands guard
    on a hill, sees enemy horsemen approaching, warns the women, and tries to defend
    their flight. When the pursuers overtake the slower riders, he considers abandoning
    them, but hears his wife pleading not to be left. She proposes that they ride
    together and die together if caught. He agrees, and she jumps onto his wounded
    but strong horse while enemies close in around them.
  language: English
  quote_policy: summarized
