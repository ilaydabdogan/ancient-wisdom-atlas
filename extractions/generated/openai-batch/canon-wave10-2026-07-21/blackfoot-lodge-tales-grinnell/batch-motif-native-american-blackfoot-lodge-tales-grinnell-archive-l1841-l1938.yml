canonical_text:
  quote: This was his business in the world, to kill off all the bad things.
  summary: Kut-o'-yis travels among camps asking where more people live. He kills
    a predatory snake chief, gives the snake's lodge to an old woman, enters Wind
    Sucker's body and frees living victims by killing him from within, then defeats
    a dangerous woman wrestler who kills men with hidden flints.
  language: English
  quote_policy: quoted
