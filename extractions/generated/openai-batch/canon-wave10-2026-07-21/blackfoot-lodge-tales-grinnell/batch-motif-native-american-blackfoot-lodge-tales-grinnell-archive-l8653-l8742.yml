canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot marriage arrangements: a bride and her
    mother set up a new lodge in the center of the camp circle for an important wedding;
    horses, household goods, and war equipment are exchanged between affinal families;
    the groom enters the lodge, may move it from the conspicuous center, and may transfer
    war spoils to his father-in-law. It also describes alternate proposal procedures,
    quieter marriages among poorer or less important people, and kin support for establishing
    the couple.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl, assisted by her mother, packs the new lodge and her belongings on
    horses, moves them into the middle of the camp circle, and sets up the lodge there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Horses are tied in front of the new lodge as the girl's dowry, and the girl's
    father may send war clothing and arms to be set up on a tripod before the lodge.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the gift of the war equipment shows the girl's father's
    great respect for his son-in-law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the young man sees the lodge being set up, he sends twice the number
    of horses brought by the girl to his father-in-law's lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the girl's mother leaves, the young man leaves his father's lodge, enters
    the newly erected lodge, and takes his place at the back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man may order his wife to take down the lodge and move away from
    camp or into the lodge circle because he does not wish to remain in the most conspicuous
    place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man may feast several friends, announce a war expedition, leave
    the same night, and, if successful, deposit the returned horses or scalps at his
    father-in-law's lodge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The proposal may come from the girl's father, or from the boy's father if
    the boy desires a particular girl; otherwise the procedure is the same.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ceremony of moving into the middle of the circle is said to be performed
    only for important people, while poorer or less important people marry more quietly.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: In a quieter marriage, a girl may tell her mother that she wishes to marry
    a particular young man; her parents arrange a feast and proposal, and the young
    man consults his father and relations before answering.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the quieter arrangement, horses are sent to the girl's father, the amount
    affects social regard, and the girl's relations help provide her outfit.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: When all is ready, the girl goes into the lodge where her husband lives, or
    the young man arranges space in a close male relative's lodge if his own is too
    crowded.
  category: setting
  evidence_refs:
  - ev:11
