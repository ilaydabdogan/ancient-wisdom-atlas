canonical_text:
  quote: ''
  summary: In a time of famine, the people pray to Old Man for help. Old Man and a
    young chief's son travel to find the game. They see a lone lodge, and Old Man
    says its inhabitant has hidden the buffalo and deer. Old Man becomes a little
    dog, and the young man becomes a root-digger. A child brings them into the lodge
    despite his father's warnings. At night they resume their forms and eat hidden
    buffalo meat. The next day, as the woman and child go root-digging, the dog and
    stick enter a cave where all the buffalo and other game are found and begin driving
    them out.
  language: English
  quote_policy: summarized
