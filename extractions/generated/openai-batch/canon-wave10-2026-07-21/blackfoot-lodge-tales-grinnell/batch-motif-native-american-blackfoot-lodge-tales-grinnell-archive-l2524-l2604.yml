canonical_text:
  quote: ''
  summary: After the camp moves away in haste, a group of children discover they have
    been left behind. They find abandoned household objects, grieve, and follow the
    camp trail. At night they enter a small lodge occupied by an old woman, who feeds
    them and tells them to sleep with their heads toward the fire. During the night
    she heats water in a stone kettle and begins cutting off the children's heads
    and throwing them into the pot. A little girl carrying her baby brother wakes,
    sees what is happening, and begs the old woman to spare them in exchange for labor.
  language: English
  quote_policy: summarized
