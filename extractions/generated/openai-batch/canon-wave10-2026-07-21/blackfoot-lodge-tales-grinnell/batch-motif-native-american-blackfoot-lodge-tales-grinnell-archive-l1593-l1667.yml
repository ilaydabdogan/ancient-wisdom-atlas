canonical_text:
  quote: the son-in-law kept the buffalo hidden under a big log jam in the river
  summary: An old man gives his two daughters and wealth to a brave hunter, who becomes
    his son-in-law. The son-in-law first provides for the old couple, then withholds
    food while controlling buffalo hidden under a river log jam. The younger daughter
    secretly gives meat to her starving parents. During a later hunt, the old man
    hides a blood clot from a wounded buffalo in his quiver, is questioned and insulted
    by the son-in-law, and has his bow and arrows taken away.
  language: English
  quote_policy: quoted
