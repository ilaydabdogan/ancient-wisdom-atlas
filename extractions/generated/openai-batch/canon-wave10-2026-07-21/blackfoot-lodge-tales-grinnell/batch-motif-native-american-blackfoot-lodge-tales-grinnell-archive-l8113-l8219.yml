literal_observations:
- id: obs:1
  text: The passage describes eating dishes made from buffalo and mountain sheep horn,
    and wooden bowls made from tree knots or protuberances smoothed by fire and/or
    knife.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the people were not known to make fishing spears,
    hooks, or boats, and that possessions were transported across rivers on lashed
    sticks or logs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Red, brown, yellow, and white paints were made from burned clays mixed with
    grease; black paint was made from charred wood.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Parfleche bags and sacks were ornamented with buckskin fringe and painted
    designs, especially sharp-angled figures.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sarvis berries and choke-cherries were gathered, dried, stored, and used as
