  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bull berries and red willow berries were also gathered; the passage notes
    that Blackfeet liked the bitter red willow berry despite its unpleasant taste
    to many white men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Camas roots were dug while blooming, cooked in a stone-lined pit with grass,
