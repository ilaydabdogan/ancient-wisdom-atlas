  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: When the camas pit was opened, small children gathered to suck sweet syrup
    from the twigs and grass.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bitter-root and a spring root called mats or pomme blanche were gathered and
