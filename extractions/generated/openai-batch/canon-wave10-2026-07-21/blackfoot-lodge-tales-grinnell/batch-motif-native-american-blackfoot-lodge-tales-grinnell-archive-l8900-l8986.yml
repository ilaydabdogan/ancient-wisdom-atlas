canonical_text:
  quote: ''
  summary: 'The passage describes Blackfeet social organization: gendered expectations,
    orphan boys serving wealthy patrons, nonhereditary chiefship based on bravery
    and generosity, the head chief’s authority, the All Comrades as tribal police
    and age-graded secret societies, and listed punishments for murder, theft, adultery,
    treachery, cowardice, and solitary buffalo hunting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women are described as subject throughout life to the orders of a parent,
    relative, or husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is described as free and independent from earliest childhood; he is
    taught riding and shooting, and horses are given to him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: By about age twelve, a boy had probably joined one or two war expeditions;
    young men commonly married at seventeen or eighteen and might live with their
    fathers for several years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Orphan boys served wealthy men by tending horses and hunting, receiving food
    and clothing in return.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Blackfeet, men are described as free and equal, and office was not
    hereditary.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A gens chief held office by bravery and generosity, while the head chief was
    chosen from the chiefs and usually had the strongest war record shown at the Medicine
    Lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A chief was expected to be kind-hearted and to share prosperity with the poor,
    so he was not usually wealthy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The head chief decided when and where the people should move camp, generally
    asking advice from minor chiefs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The All Comrades were under the head chief’s authority and acted as tribal
    police when punishment or related duties were ordered.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: For murder, the penalty was either life for life or a heavy payment, at the
    option of the murdered man’s relatives; theft required restoration of the property.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: For adultery, the first offense generally brought mutilation by the husband,
    while a second offense could bring death by the All Comrades or by the woman’s
    male relatives; the husband could also choose death for a first offense.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Treachery was punished by death at sight; a man who would not fight had to
    wear woman’s dress and was not allowed to marry.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: A man who left camp to hunt buffalo alone could be forcibly returned by the
    All Comrades, whipped, and have his lodge, travois, and food stores damaged or
    taken.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The All Comrades consisted of a dozen or more secret societies graded by age,
    partly benevolent and helpful, partly military, with punishment of social offenses
    as their main function.
  category: attribute
  evidence_refs:
  - ev:11
