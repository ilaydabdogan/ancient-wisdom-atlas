canonical_text:
  quote: ''
  summary: Old Man joins prairie-dogs around a fire, learns their hot-ashes game,
    then places them all in the ashes and lets them die except for a pregnant female
    who escapes. After eating the roasted prairie-dogs, Old Man sleeps while his nose
    tries to warn him of approaching animals. A bob-cat eats the food, and Old Man
    punishes it by altering its body.
