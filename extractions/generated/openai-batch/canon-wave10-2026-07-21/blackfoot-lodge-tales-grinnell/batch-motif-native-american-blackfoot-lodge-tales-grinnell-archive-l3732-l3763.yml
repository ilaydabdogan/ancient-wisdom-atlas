canonical_text:
  quote: ''
  summary: The passage opens the tale 'Two War Trails.' A solitary boy named Screech
    Owl lives in the Blood camp, prays to birds and animals for help becoming a warrior,
    and avoids cosmetic paint. At about fourteen, he asks his father to join a Blackfeet
    war party going against the Crees and Assinaboines. His father permits him, gives
    him a fast war horse, offers weapons, and gives him a war headdress made with
    thunder bird feathers associated with the father's medicine. The boy accepts only
    a small trapping axe among the weapons.
