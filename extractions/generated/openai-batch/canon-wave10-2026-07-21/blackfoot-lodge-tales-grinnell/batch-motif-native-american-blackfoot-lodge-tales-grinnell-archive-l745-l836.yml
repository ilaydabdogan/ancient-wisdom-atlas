canonical_text:
  quote: The Piegans and Snakes are going to make peace.
  summary: Owl Bear and a Snake chief arrange a peace meeting between their peoples,
    share food, exchange cut braids, clothing, and weapons, and depart. Owl Bear returns
    to the Piegan camp, where some question his displayed braids as a scalp. He orders
    the camp to move south for the peace meeting. An old medicine man counsels him
    not to remain angry with warriors who turned back because dreams, said to belong
    to the Sun, warned them.
  language: English
  quote_policy: quoted
