canonical_text:
  quote: ''
  summary: 'A prefatory prose passage explains the author''s view about Indians, cites
    old frontiersmen, army officers, and Lieutenant Casey, and then describes how
    the book came to be written: J. W. Schultz published sketches titled "Life among
    the Blackfeet" while living in a Blackfoot camp; the author later visited the
    Pi-kun-i Blackfeet repeatedly, collected information from old men and warriors
    about history, customs, and oral literature, and urged Schultz to prepare his
    observations for publication.'
