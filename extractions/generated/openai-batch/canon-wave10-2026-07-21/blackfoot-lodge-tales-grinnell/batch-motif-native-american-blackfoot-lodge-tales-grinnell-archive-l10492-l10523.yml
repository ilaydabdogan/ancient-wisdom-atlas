  quote: ''
  summary: The passage explains that the ancient Blackfoot chief god and Creator was
    Na'pi, or Old Man. It analyzes the name as combining a word for man with a color
    particle associated with the yellowish-white light of dawn, and notes that the
    name also fits the hair color of old men. It then quotes Dr. Brinton’s interpretation
    that a creator name connected with light may reflect a broader idea of light as
    a chief god, antecedent to the sun, while the narrator cautions against attributing
    such an abstract conception to contemporary Blackfoot people.
