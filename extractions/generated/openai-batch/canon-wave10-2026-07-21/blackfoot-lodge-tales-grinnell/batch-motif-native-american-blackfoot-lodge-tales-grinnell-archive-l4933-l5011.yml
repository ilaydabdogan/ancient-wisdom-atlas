canonical_text:
  quote: ''
  summary: 'The passage introduces Thunder as a powerful, dangerous being who strikes
    rocks, trees, and people and sometimes steals women. A man survives Thunder''s
    attack on his lodge, finds his wife missing, and sets out to find Thunder''s dwelling.
    Animals warn him against the quest. He reaches the stone lodge of the Raven chief,
    who tells him Thunder lives nearby in a stone lodge hung with the eyes of those
    he has killed or stolen. Raven offers protective medicine: a raven''s wing and
    an elk-horn-shaft arrow.'
  language: English
  quote_policy: summarized
