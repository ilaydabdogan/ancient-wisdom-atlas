  quote: ''
  summary: 'The passage describes Blackfoot and related hunting practices: Hugh Monroe''s
    use of a wolf-skin disguise to still-hunt buffalo, later wasteful buffalo killing
    with repeating rifles, a communal antelope drive using converging lines and hidden
    pits, and the value and sacred character attached to eagle capture and feathers.'
  language: English
