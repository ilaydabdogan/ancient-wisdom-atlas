canonical_text:
  quote: ''
  summary: 'The passage describes pis''kun buffalo drives: a fenced chute and causeway
    guide buffalo into a corral; hidden people close the entrance with poles and robes;
    people keep the animals from breaking the walls while men shoot them; butchering
    and scavenging follow. It also describes winter guidance by a raised line of buffalo
    chips in snow, cliff drives without corrals, and an incomplete example of a spring
    drive bringing buffalo close to camp to spare thin horses.'
  language: English
  quote_policy: summarized
