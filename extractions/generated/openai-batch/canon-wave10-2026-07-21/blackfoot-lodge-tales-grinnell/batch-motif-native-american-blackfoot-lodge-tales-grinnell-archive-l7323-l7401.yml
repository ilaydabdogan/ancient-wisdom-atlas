canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot camp customs: invitation feasts in lodges
    with named guests, food service, pipe smoking in sequence, formal dismissal, frequent
    daily feasting, and two gambling games involving a small rolling wheel with arrows
    and a hidden marked bone accompanied by song and bodily movements.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A host invites named guests to eat by calling each guest's name three times
    and announcing the number of pipes to be smoked, generally three.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each guest receives one dish of food; uneaten food may be carried home, and
    the host does not eat with the guests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After eating, the host prepares tobacco mixed with vherbe, fills and lights
    a pipe, and the pipe is smoked and passed in an ordered circuit around the lodge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Guests listen without interruption when one person speaks; conversation includes
    hunting, war, strange adventures, joking, and chaffing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the third and last pipeful, the host knocks out the ashes, says “Kyi,”
    and the guests rise and leave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lodge-owners commonly give one to three feasts in a day, and men in camp go
    from one gathering to another.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: A daytime gambling game uses a small five-spoked wheel called it-se'-zvah,
    decorated with colored bone or horn beads.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the wheel game, two men at each end of a course gamble against each other
    while a crowd bets on the sides.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The wheel is rolled along a course, arrows are thrown at it, and points depend
    on the arrow’s relation to spokes and beads; the first player to ten points wins.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Another game, compared in the passage to southern tribes' “hands” and to “Button,
    button, who's got the button?”, uses two small oblong bones, one marked with a
    black ring.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Players in the bone game divide into two equal parties on opposite sides of
    the lodge, wager with opposite players, and try to guess which hand holds the
    marked bone.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The bone game is scored to ten points with sticks, and the first side to reach
    the number takes the stakes.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A song accompanies the bone game, beginning softly, rising in volume and pitch,
    sinking, rising and falling, and repeating.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The person concealing the bones sways body, arms, and hands in time with the
    song and performs intricate movements to confuse the guesser.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Stakes in the bone game may include several horses, and men are said to have
    lost all their possessions and clothing.
  category: object
  evidence_refs:
  - ev:15
