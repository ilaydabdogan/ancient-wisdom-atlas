canonical_text:
  quote: ''
  summary: Mik-a'pi vows to avenge Fox-eye, prepares ritually, and departs alone against
    the Snakes. During a storm at the Great Falls, he shelters in a cave, encounters
    a Snake warrior, deceives him through signs, and kills him at daybreak. After
    taking trophies, he receives dream and natural warnings but chooses to continue.
    The passage ends by describing a large camp in a valley and a lone person seated
    on a hill overlooking it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mik-a'pi tells the mourner that he has heard the mourning, that Fox-eye was
    his near friend, and that he will avenge him by going to war and taking many scalps.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mik-a'pi says the scalps will belong to the mourner or mourners and that they
    will paint their faces black when Fox-eye is avenged.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many warriors want to join Mik-a'pi, but he refuses them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before leaving, Mik-a'pi takes a medicine sweat and arranges for a medicine-pipe
    man to make medicine for him during his absence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mik-a'pi leaves after sunset, travels in hidden places, watches from hills
    by day, and is described as brave, cautious, and possessing strong medicine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the Great Falls of the Missouri, heavy rain leads Mik-a'pi to crawl into
    a hole in the rocks or cave and sleep there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A person enters the cave in the dark; Mik-a'pi and the person communicate
    by touch and sign language.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The stranger identifies himself by a sign meaning Snake, and Mik-a'pi replies
    with a sign meaning Pend d'Oreille or River person.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mik-a'pi stays awake through the night and at daybreak kills the sleeping
    Snake with an arrow through the heart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After killing the Snake, Mik-a'pi takes the scalp, bow, arrows, and a bundle
    of moccasins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mik-a'pi sees no one outside the cave, travels a short distance, eats, drinks
    from the river, climbs a high rock wall, and sleeps.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In a dream Mik-a'pi fights strange people and is wounded; when he wakes, he
    understands this as a warning to turn back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mik-a'pi also sees an eagle rising with a snake that drops and escapes, and
    a painted setting sun; the passage identifies these as bad signs or warnings of
    danger.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Despite the warnings, Mik-a'pi chooses to continue, thinking of the mourning
    widows, public welcome, and two sisters he wants to marry.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage shifts to a valley with a large camp, many lodge smokes, and one
    person seated motionless on a hill overlooking the valley.
  category: setting
  evidence_refs:
  - ev:9
