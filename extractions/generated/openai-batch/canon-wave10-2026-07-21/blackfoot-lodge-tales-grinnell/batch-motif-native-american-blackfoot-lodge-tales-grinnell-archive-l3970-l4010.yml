canonical_text:
  quote: ''
  summary: A besieged warrior, E-kiis'-kini, remains in a brush shelter under Cree
    attack. The Cree chief K6m-in'-a-kus offers him an unguarded ravine as an escape
    route, but E-kiis'-kini refuses, sings his death song through the night, announces
    at dawn that his ammunition is gone, and challenges K6m-in'-a-kus to come take
    him as promised. The passage ends as K6m-in'-a-kus strips off his clothes and
    begins to rush alone.
  language: English
  quote_policy: summarized
