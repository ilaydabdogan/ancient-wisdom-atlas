canonical_text:
  quote: ''
  summary: In “The Ghosts' Buffalo,” four Blackfeet returning from war against the
    Crees pass through the Sand Hills and follow a fresh travois trail. E-kiis'-kini
    questions the trail, but the others continue. One man finds a stone maul and dog
    travois that he says belonged to his dead mother and were buried with her. In
    the morning the men hear ordinary camp sounds around them, see no one, become
    frightened, and cover their heads.
  language: English
