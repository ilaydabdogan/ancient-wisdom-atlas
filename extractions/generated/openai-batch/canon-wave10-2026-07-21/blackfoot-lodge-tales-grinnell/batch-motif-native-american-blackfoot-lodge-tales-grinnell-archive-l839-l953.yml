canonical_text:
  quote: So the great peace was made.
  summary: The Piegans reach an agreed camping place, and Owl Bear visits the Snake
    camp with one wife. The Snake chief protects and welcomes him, feasts him, announces
    peace, and gives him a wife, lodge, goods, and horses. Owl Bear reciprocates with
    his own wife, lodge, goods, and horses. The two tribal camps meet with singing,
    embrace, feast, exchange gifts, camp side by side, and the Snake chief later states
    that their anger has been buried so war is over.
  language: English
  quote_policy: quoted
