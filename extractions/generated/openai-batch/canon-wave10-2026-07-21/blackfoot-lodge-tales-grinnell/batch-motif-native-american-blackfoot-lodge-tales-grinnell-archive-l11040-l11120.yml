canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot tobacco planting and harvest ceremonies:
    men prepare and plant a tobacco bed with songs, prayers, sacred berries, and a
    dance; medicine men later pray over and inspect the crop; while away, men perform
    ceremonies asking the Sun and Old Man to protect the plants from insects; a skeptical
    young man visits the patch, sees small children killing worms, and returns convinced;
    at harvest, camps return, a head medicine man gathers a plant, a small boy carries
    a tobacco-bearing stick with a baby''s moccasin to the camp center, and the people
    feast, pray, sing four songs, gather the tobacco, dry it, and save seed for the
    next planting.'
  language: English
  quote_policy: summarized
