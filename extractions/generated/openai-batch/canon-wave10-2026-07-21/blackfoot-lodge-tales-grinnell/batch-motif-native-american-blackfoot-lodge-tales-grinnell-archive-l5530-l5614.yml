canonical_text:
  quote: ''
  summary: A mourning man enters the ghost country to seek his dead wife. A chief
    ghost hosts him, summons ghost relatives, and persuades them to pity him. The
    ghosts agree to return his wife and give him the Worm Pipe if he remains four
    nights and obeys strict instructions for the return journey. The man is told not
    to open his eyes for four days, to cleanse himself in a sweat house on nearing
    home, and never to mistreat his restored wife with whip, knife, or fire, or she
    will vanish back to the Sand Hills.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man says he is searching for his dead wife because he mourns her and because
    his little boy cries for his mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ghost warns the man that coming there is fearful, that no person has been
    there before, and that he may never leave.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief ghost tells the man to stay four nights, promises he will see his
    wife, and warns that carelessness will cause him to die there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief ghost calls a feast for the man's father-in-law and other relations
    in the ghost camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The invited ghosts initially avoid entering because they sense something about
    the living man; the ghost chief burns sweet pine in the fire to remove the smell.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The host asks the ghost relatives to pity the man because he has endured distance
    and fearful sights and mourns both his wife and his motherless child.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ghosts consult and say they will give the man the Worm Pipe, return his
    wife, and let him go home after four nights.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the third night, the chief ghost assembles the people, including the
    man's wife; one ghost beats a drum and another carries the Worm Pipe, which is
    given to the man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The chief ghost says the wife will carry the medicine pipe, ghost relations
    will accompany the couple for four days, and the man must not open his eyes during
    that time.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief ghost says the wife is not yet a person, but on the middle of the
    fourth day the man will be told to look and will see that she has become a person
    and that the ghost relations have disappeared.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The father-in-law instructs the man to have a sweat house built near home
    and to wash every part of his body thoroughly, or he will die.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The father-in-law warns the man not to whip his wife, strike her with a knife,
    or hit her with fire, or she will vanish and return to the Sand Hills.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The couple leaves the ghost country, and on the fourth day the wife tells
    her husband to open his eyes; he sees that their companions have vanished.
  category: sequence
  evidence_refs:
  - ev:10
