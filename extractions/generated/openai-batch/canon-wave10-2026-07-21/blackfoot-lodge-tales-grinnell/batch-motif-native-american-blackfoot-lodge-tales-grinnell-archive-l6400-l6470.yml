canonical_text:
  quote: ''
  summary: Old Man observes cottontail rabbits singing and using hot ashes in a medicine
    practice. After learning the song and briefly lying in the ashes unharmed, he
    covers the rabbits with the whole fire, spares one old pregnant rabbit, and cooks
    the others. The passage explains grease on red willow bark and the burnt mark
    on rabbits’ backs. A coyote pretending to be lame asks for food; Old Man refuses
    except as the prize of a race. The coyote deceives him, returns first, eats the
    rabbits, and leaves.
  language: English
