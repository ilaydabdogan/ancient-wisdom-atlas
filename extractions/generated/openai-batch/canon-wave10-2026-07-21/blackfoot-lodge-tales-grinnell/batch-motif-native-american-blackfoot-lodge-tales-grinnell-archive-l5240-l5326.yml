canonical_text:
  quote: ''
  summary: The beaver supplies Api-kunni with an aspen stick, a medicine sack, and
    instructions for war. Api-kunni and Wolf Tail travel beside a Blackfeet war party
    to the high Bow River. After singing a beaver-taught song and carrying the stick
    as his only weapon, Api-kunni swims across, kills a man from the camp across the
    river, and brings the body back underwater. The passage says this was the first
    man ever killed in war; the body is then scalped and coup is counted, establishing
    later war practices.
  language: English
  quote_policy: summarized
