canonical_text:
  quote: ''
  summary: In this passage, a young woman dances in a poor young man’s unusual dress
    and says she will go to war in the spring. The poor young man Api-kunni becomes
    ashamed, leaves camp, reaches a lake with a beaver dam and beaver house, and sleeps
    there. In a dream a large beaver invites him inside and promises help. Api-kunni
    awakens inside the beaver house with a large white beaver, who calls him son,
    offers to provide for him through the winter, and teaches him songs and ways.
    Api-kunni’s friend Wolf Tail later finds him at the beaver house; Api-kunni says
    he was brought in while asleep, does not know the secret of the door, and asks
    Wolf Tail to gather moccasins for a spring war party.
  language: English
  quote_policy: summarized
