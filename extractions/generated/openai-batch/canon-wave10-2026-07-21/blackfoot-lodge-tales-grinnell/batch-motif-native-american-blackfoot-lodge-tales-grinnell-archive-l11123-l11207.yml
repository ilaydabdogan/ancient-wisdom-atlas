  summary: The passage describes tobacco gathering and a fatal sanction against stealing
    tobacco; states that tobacco was given by the maker; notes uncertainty about Blackfoot
    cosmology; gives accounts of a primordial womb, Old Man as first-born and namer
    of animals, one variant in which Old Man and a female dog produce the first people,
    an earth-diver creation story from primordial water, and the beginning of an origin-of-death
    account involving a sick child and a mother asked to decide whether humans will
    die or live forever.
