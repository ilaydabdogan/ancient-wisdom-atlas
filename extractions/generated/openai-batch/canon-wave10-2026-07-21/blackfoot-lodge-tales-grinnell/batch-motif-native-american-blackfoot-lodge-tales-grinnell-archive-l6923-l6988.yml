canonical_text:
  quote: ''
  summary: Old Man and the fox hunt unsuccessfully until Old Man sees four buffalo
    bulls. Old Man proposes plucking the fox bare except for a tuft on his tail so
    that his strange appearance and antics will make the bulls laugh themselves to
    death. The fox agrees reluctantly. The plan works, and Old Man butchers the bulls.
    As cold wind and snow arrive, the plucked fox remains exposed and silent; when
    Old Man pushes him, the fox falls over dead, frozen stiff.
