canonical_text:
  quote: ''
  summary: Scarface seeks the Sun's home in order to ask for the woman he wants to
    marry. A badger directs him to a knowledgeable wolverine, who shows him a trail
    to a vast water beyond which the Sun lives. At the shore, Scarface despairs, but
    two swans carry him safely across the dangerous water to a trail near the Sun's
    lodge. On the trail he avoids touching beautiful weapons and then meets a handsome
    young man who questions him about them.
  language: English
  quote_policy: summarized
