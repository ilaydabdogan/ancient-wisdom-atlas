canonical_text:
  quote: ''
  summary: Raven questions a sad man, restores his sight with medicine so he can see
    his distant camp, and sends him with a raven wing and elk-horn arrow to recover
    his stolen wife from Thunder. In Thunder's rock lodge, the man finds his wife's
    eyes hanging among many eyes, overcomes Thunder with the wing and arrow, and restores
    his wife. Thunder then gives the man a medicine pipe and prescribes spring prayers
    to Thunder for rain and growth, explaining that he lives there in summer and goes
    south with the birds in winter. The passage ends by stating that this is how the
    people got the first medicine pipe.
  language: English
  quote_policy: summarized
