canonical_text:
  quote: ''
  summary: An old man and old woman discover a little boy in a boiling kettle after
    the old man tips his quiver over it. They conceal that the child is male from
    a dangerous son-in-law and name him Kut-o'-yis, Clot of Blood. On the fourth day
    the child speaks, is lashed successively to lodge poles, and becomes a man. He
    learns that the old people are hungry and abused, makes weapons with the old man,
    kills a buffalo at the river pis'kun, and the son-in-law approaches angrily and
    threateningly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man tells his wife to put a kettle on the fire after saying he has
    brought something from the butchering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the water boils, the old man tips his quiver over the kettle; a crying
    sound comes from the pot, and the old people find a little boy in the water and
    take him out.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old people decide to tell their daughters that the baby is a girl because
    they believe the son-in-law would kill a boy; they name the child Kut-o'-yis,
    meaning Clot of Blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son-in-law sends his youngest wife and then his oldest wife to learn the
    baby's sex; after both report that the baby is a girl, he believes them and expects
    the child to become another wife for him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The son-in-law sends a small amount of pemmican to the mother so that there
    will be milk for the child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the fourth day, the child speaks and instructs the old woman to lash him
    in turn to each lodge pole; he visibly grows and becomes a man at the last pole.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kut-o'-yis sees no food in the old people's lodge and sees food at the other
    lodge; the old woman says the son-in-law gives them nothing to eat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old man says the son-in-law has taken his weapons and dogs, and that the
    old people have had little food except occasional meat stolen for them by their
    daughter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kut-o'-yis asks about arrows, learns the old man still has four stone points,
    and tells him to get wood so they can make a bow and arrows.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: At the river pis'kun or jam, the old man pounds on it, a fat cow runs out,
    and Kut-o'-yis kills it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The son-in-law becomes angry when he learns the old man has already gone down
    to the jam, threatens the old woman, and later tells the old man to take a last
    look around.
  category: speech
  evidence_refs:
  - ev:9
