canonical_text:
  quote: ''
  summary: 'The passage describes preparations and rites for the Blackfoot Medicine
    Lodge: four east-facing sweat lodges are built and marked with red-and-black buffalo
    skulls; warriors, elders, medicine pipe men, women, and ceremonial bands prepare
    and raise the lodge; the Medicine Lodge woman and a medicine man fast and observe
    restrictions; participants are painted and prayed over; sacred dried tongues are
    offered to the Sun and partly buried with prayer to the Ground Man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four large sweat lodges are built in a line before the Medicine Lodge is erected,
    facing east or toward the rising sun, with two in front of the Medicine Lodge
    and two behind it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Renowned warriors cut the sticks for the sweat-lodge frameworks, each cutting
    one stick and counting a coup when bringing it in.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old men erect the sweat lodges and place a buffalo skull on each, with one
    half painted red and the other black to represent day and night, or the sun and
    moon.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the sweat lodges are finished and the stones heated, warriors enter to
    sweat, accompanied by medicine pipe men who offer prayers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Young men cut the centre post and other Medicine Lodge materials, and women
    pack the post and poles on horses while men follow shouting, singing, and shooting.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The medicine woman begins a four-day and four-night fast, may not go outdoors
    except between sunset and sunrise, and has her face, hands, and clothing covered
    with sacred red paint throughout the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A warrior selected for having done the most cutting and stabbing in battle
    during the previous year cuts the rawhide binding strings and counts three coups
    while cutting them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two named bands, the Braves and the All Crazy Dogs, approach the arranged
    centre post and poles; each band sings four songs and then they raise the lodge
    amid public shouting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Pairs of lodge poles are tied with rawhide to make shears for raising the
    heavy centre post; if a binding rope breaks, the men holding that pair are said
    to be unlucky and thought soon to die.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the centre post is raised, wall posts and roof poles are added, the
    structure is covered with brush, the doorway faces east or southeast, and the
    lodge is circular.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: A tightly woven brush, box-shaped house is built at the back or west side
    inside the Medicine Lodge by a medicine man described as the high priest of the
    ceremony.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The medicine man neither eats nor leaves the inner brush house during the
    daytime for the four-day ceremony; people come two at a time to be painted black
    and to receive his prayer to the Sun for health, long life, food, and shelter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The medicine man is said to have power over rain and must stop it if rain
    threatens to interfere with the ceremonies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Sacred dried tongues are placed in the Medicine Lodge; the Medicine Lodge
    woman slowly enters while praying, cuts one tongue, holds it toward heaven as
    an offering to the Sun, eats part of it, and buries the rest while praying to
    the Ground Man.
  category: sequence
  evidence_refs:
  - ev:6
