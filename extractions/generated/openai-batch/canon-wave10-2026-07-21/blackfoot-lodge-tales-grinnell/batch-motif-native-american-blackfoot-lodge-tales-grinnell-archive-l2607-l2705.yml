canonical_text:
  quote: ''
  summary: In this excerpt from “The Lost Children,” a girl protects and carries her
    little brother after being left with a hostile old woman. Sent for water, she
    meets a water bull at the river and performs the requested task of removing sticks
    from his matted head; he ferries her and her brother across. The pursuing old
    woman mistreats the bull and is drowned when he rolls over in mid-river. The girl
    then follows the camp trail, reaches her people, receives help from a compassionate
    old woman, but is rejected by her parents and condemned by the chief to be tied
    and left behind again. The compassionate old woman hides dried meat and calls
    her little curly dog.
  language: English
  quote_policy: summarized
