canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot child training and discipline in lodge
    life: elders warn noisy children with formulaic phrases and sticks, require boys
    to tend the fire, advise boys toward bravery in war, test girls for seriousness
    with a comic buffalo-foot performance, and present the Medicine Lodge woman as
    an honored model for girls.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When young people in the lodge became noisy enough to prevent elders from
    speaking, an older man might bring in a long stick.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The older man held up the stick and repeated the warning formula, "I will
    give you gum!" to make the children reduce their noise.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the boys resumed chattering, the man could rap one of them on the head
    with the stick, after which quiet returned for a time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In winter, when the lodge fire burned low, an older person called out, "Look
    out for the skunk!" as a warning for boys to add sticks to the fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: If boys did not tend the fire at once, the caller might throw a stick of wood
    across the lodge into the group of children, hitting one or more of them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Children were taught that if an older person placed the unburned stick ends
    on the fire, all children in the lodge would get scab or itch; at the call "Look
    out for the scab!" a child would tend the fire.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Men gave speeches to groups of boys in camp, telling them that success required
    bravery and endurance in war.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The speeches contrasted the hardships of old age with the desirability of
    dying bravely in battle while strong.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Girls were instructed to be sober and serious-minded rather than constantly
    giggling.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A father might ornament a buffalo's front foot with feathers, tell a daughter
    not to laugh, and then sing a funny song while shaking the foot in her face.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The father repeated the performance with his daughters and gave advice to
    those who seemed to have the steadiest characters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the Medicine Lodge, the father pointed out the Medicine Lodge woman as
    a good, honored, and respected woman, telling the daughter that a pure life might
    make her similarly great.
  category: speech
  evidence_refs:
  - ev:6
