canonical_text:
  quote: ''
  summary: A starving traveling household is visited by a strange young man whose
    footwear remains dry despite wet conditions outside. After hearing that they have
    no food and are traveling toward the mountains, he says their travels are ended,
    describes a nearby camp with abundant buffalo meat, brings meat and three unborn
    buffalo calves, tells them to move to the lodges without fear, and warns that
    no one should touch any arrow they find. The old man then smokes and prays.
  language: English
  quote_policy: summarized
