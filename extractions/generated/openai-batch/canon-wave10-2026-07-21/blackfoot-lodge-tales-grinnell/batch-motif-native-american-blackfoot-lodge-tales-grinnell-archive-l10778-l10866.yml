canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot reverence for medicine rocks and a buffalo-shaped
    boulder, daily prayers to the Sun and Old Man, the authority of dreams as foresight
    and medicine, and the Medicine Lodge ceremony: a woman vows to build a lodge for
    the Sun in exchange for a loved one''s survival or healing, publicly repeats the
    vow, prepares buffalo tongues, and sponsors a feast, prayer, and songs when the
    lodge is to be built.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage begins with a fragment listing gift objects: a ring, brass earrings,
    and a little bottle made from two copper cartridge cases.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A medicine rock on Milk River east of the Sweet Grass Hills is described as
    shaped like a man's body and as looking like a person sitting on a bluff.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the Blackfeet pass the Milk River medicine rock, they make presents to
    it; clothing may be placed on the rock.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A great gray boulder in the big bend of Milk River is described as shaped
    like a buffalo bull lying down.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The buffalo-shaped boulder is reverenced by Plains Indians, including the
    Blackfeet, and receives presents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blackfeet make daily prayers to the Sun and to Old Man, and important
    undertakings are preceded by requests for divine assistance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dreams are said to be sent by the Sun to let people look ahead and know what
    is going to happen; strong, clear dreams are usually obeyed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dreams may send people on the war path, and a threatening dream may cause
    a war party to abandon an imminent attack and return home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The animal or object appearing to a boy or man seeking a dream for power becomes
    his secret helper, medicine, and dream.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Medicine Lodge is described as the most important religious occasion of
    the year and as a sacrifice offered invariably by women among the Blackfeet.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A woman anxious for a son or husband at war, or for a dangerously sick child,
    may vow to the Sun that she will build a lodge if the person survives or recovers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The vow to build the Medicine Lodge is repeated publicly outside the woman's
    lodge so all people may hear it, and any man able to impeach her is obliged to
    speak.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Medicine Lodge is built in summer at the season when sarvis berries ripen;
    if the person for whom the vow was made dies before then, the woman is not obliged
    to fulfill the vow but is regarded with suspicion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the building time approaches, a suitable place is selected, the people
    move there, and they put their lodges in a circle around it.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: At least one hundred buffalo tongues are collected, cut, and dried by the
    Medicine Lodge woman, and no one else is allowed to take part in that work.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Before the tongues are cut and dried, they are piled in the medicine woman's
    lodge; she gives a feast to the old men, an honest and well-liked old man recites
    a long prayer, and one hundred different songs are sung over a day and a half.
  category: sequence
  evidence_refs:
  - ev:9
