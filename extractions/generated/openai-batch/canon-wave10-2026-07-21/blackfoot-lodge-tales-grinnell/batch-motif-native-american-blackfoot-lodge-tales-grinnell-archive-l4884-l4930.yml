  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The next day the man and his family take down their lodge and prepare to move
    camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Many women give the family dried meat, pemmican, and berries, more than they
    can carry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: After joining the main camp, the man calls the chiefs to feast, tells them
    what he has seen, and shows them the medicines.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The chiefs choose certain young men for the different bands, and the man teaches
