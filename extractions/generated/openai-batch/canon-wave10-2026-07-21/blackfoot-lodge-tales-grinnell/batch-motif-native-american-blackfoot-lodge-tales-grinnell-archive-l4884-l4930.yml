- id: obs:4
  text: The Seven Persons arrive at midnight and hear another feast shout from the
    far end of camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Miit'-siks lodge, the men are painted with red streaks and have their
    hair brushed to one side.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Miit'-siks chief says that his people are different, are called Miit'-siks,
    are death, know no fear, and use the knife as their weapon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Miit'-siks chief sings and dances and gives the man a long knife with
