  text: The Bear says that many animals are powerful, but that the Bear is strongest
    and bravest and fears nothing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bear puts on a necklace of bear claws, a bear-fur belt, and a band of
    fur around his head, then sings and dances.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bear gives the man a medicine and tells him to teach the people the Bear
    song and dance.
  category: action
  evidence_refs:
