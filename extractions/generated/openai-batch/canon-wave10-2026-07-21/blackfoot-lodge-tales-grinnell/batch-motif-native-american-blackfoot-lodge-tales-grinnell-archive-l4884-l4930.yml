canonical_text:
  quote: ''
  summary: The Bear declares his strength, performs with bear-claw and bear-fur regalia,
    and gives the man a medicine with instructions to teach its song and dance. Later
    the group enters the lodge of the Miit'-siks, whose chief describes their fearlessness
    and gives the man a knife medicine for the I-kun-uh'-kah-tsi. They then visit
    the Badger chief, who teaches another song and dance and gives a decorated rattle.
    After moving camp and rejoining the people, the man reports to the chiefs, shows
    the medicines, and teaches selected young men the songs and dances for their bands.
  language: English
  quote_policy: summarized
