  summary: A narrator recounts a conversation in which a Blackfoot man is led to prefer
    cattle and farming tools over a local store and blacksmith shop. The narrator
    then describes advising Blackfeet people toward work, sobriety, and material advancement.
    The passage also summarizes an 1887 treaty by which the Blackfeet sold land to
    the government in exchange for annual payments, with surplus funds intended for
    tools, seed, livestock, and other means of self-support. It closes by describing
    the Blackfeet country as cold, dry, near the Rocky Mountains, and difficult for
    crops.
