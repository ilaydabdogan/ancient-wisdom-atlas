canonical_text:
  quote: ''
  summary: The passage describes public counting of coups, pictographic records of
    war deeds, social verification of coup claims, an illustrative Cheyenne-Pawnee
    case involving Big Eagle, Blackfoot war parties originating in dreams, kin preparation
    for war, and a pre-departure sweat-lodge ceremony with pipe prayer, wolf song,
    water, self-cutting offerings to the Sun, and a river plunge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On special occasions, men publicly recounted coups, both to gratify personal
    vanity and to encourage young men to perform similar brave deeds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: War deeds were also recorded pictographically on robes, cowskins, and other
    hides; Red Crane painted his own record of coups and important life events on
    a cowskin.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A warrior who related a brave deed was generally expected to prove it with
    an enemy scalp, a captured trophy, or a witness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: During temporary peace meetings between formerly hostile tribes, past battles
    and individual deeds were discussed, making false claims detectable.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Cheyenne warrior claimed to have counted coup on Big Eagle by thrusting
    a lance through his buttocks, and on that claim was made war chief of the Cheyennes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Big Eagle denied the claimed wound in council, exposed his body for inspection,
    no lance scars were found, and the Cheyenne claimant lost status and became contemptible.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among the Blackfeet, a war party often began with a man's dream; the sample
    dream described horses given to him on a certain stream and his intention to go
    to war to get them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Men who trusted the dreamer's medicine decided to follow him; his women and
    female relations made moccasins, and older male relatives provided arrows, powder,
    and ball.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The war leader set the departure day and hour and notified the young men going
    with him, without announcing the plan to the whole camp in advance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Just before departure, the war party sang the 'peeling a stick song,' described
    as a wolf song, built a sweat lodge, and entered it with an old medicine-pipe
    man who had been a good warrior.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The war party filled the pipe and asked the medicine-pipe man to pray for
    good luck and success; he prayed, sang, and poured water on hot stones.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Warriors cut small pieces of skin and flesh from their arms, breasts, and
    sometimes tongue tip, offered them to the Sun, and after the vapor bath went to
    the river and plunged in.
  category: action
  evidence_refs:
  - ev:7
