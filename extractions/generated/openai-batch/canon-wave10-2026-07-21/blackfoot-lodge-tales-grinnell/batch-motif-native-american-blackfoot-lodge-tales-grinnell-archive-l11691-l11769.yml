canonical_text:
  quote: Listen, my dream.
  summary: The passage describes a Blackfoot healing ceremony in a lodge, including
    purification with sweet grass smoke, prayer to a dream and the Sun person, singing,
    use of an eagle wing, medicine liquid, bandage, pipe smoke, repeated treatment,
    and payment. It then explains that Blackfoot medicine practice is largely religious,
    relying on prayer to a dream or secret helper, and mentions medicine-pipe healing,
    women doctors, and animate medicine charms that cure gunshot wounds.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The doctor enters the lodge, gives the sick man a strip of buckskin to tie
    around his chest, and the patient reclines stripped to the waist while the doctor
    kneels beside him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The doctor places two coals from the fire on cleared ground, puts dried sweet
    grass on them, and uses the smoke over his drum, hands, arms, and body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The doctor taps the drum and prays to his dream and to the Sun person, asking
    for help to cure the sick man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women take up the song and beat the drum while the doctor dips an eagle wing
    in medicine liquid, places the wing tip in his mouth, spits material onto the
    patient’s breast, and brushes the breast from throat to lower ribs three times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The doctor dips the patient’s bandage in medicine liquid, rubs it on the chest,
    brushes with the eagle wing, and blows pipe smoke over the patient’s breast, shoulders,
    neck, and arms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ceremony is repeated every two or three hours; the doctor arrives about
    noon, leaves the next morning, and receives a saddle and two blankets.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The explanatory passage states that Blackfoot doctors generally expect cures
    through prayer to each one’s dream or secret helper.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a sick person asks a medicine man to unroll his pipe, the sick person
    may dance if able; otherwise the medicine man paints him with sacred symbols and
    offers prayer for recovery.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that most Blackfoot doctors are men but many women also
    belong to the guild, including Wood Chief Woman and Two Bear Woman.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: For gunshot wounds, a man’s dream or medicine, often a stuffed bird or animal
    skin, is said to become alive and cure by its power.
  category: action
  evidence_refs:
  - ev:9
