canonical_text:
  quote: ''
  summary: In the opening of “Adventures of Bull Turns Round,” Wolf Tail is told to
    care for his younger brother Bull Turns Round. After Wolf Tail’s wife falsely
    accuses Bull Turns Round, Wolf Tail pushes him from a cliff into a river. Bull
    Turns Round is carried downstream to a shoal near the lodge of Under Water People,
    where two daughters find him dead. Their father revives him through four sweat
    lodges and gives him to the daughters as husband, along with gifts. Bull Turns
    Round rejects the household’s bloodsucker food and asks for buffalo meat; the
    old man permits a buffalo kill but forbids taking or breaking bones because he
    will restore the animal to life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The main camp moved away, but Wolf Tail’s lodge stayed behind with Wolf Tail
    and his younger brother Bull Turns Round; their father instructed Wolf Tail to
    care for the younger brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bull Turns Round was making arrows when a beautiful strange bird landed before
    him, and one of Wolf Tail’s wives asked him to shoot it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Bull Turns Round shot the bird, the wife picked it up, stroked her face
    with it, and her face swelled so much that her eyes and nose could not be seen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Wolf Tail returned, the wife said Bull Turns Round had pounded her face
    and urged Wolf Tail to kill him; Wolf Tail initially refused because he loved
    his brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wolf Tail brought Bull Turns Round to a high cliff over a river, where an
    eagle nest was in a dead tree at the cliff edge.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Bull Turns Round was in the tree, Wolf Tail said he would push the tree
    over the cliff; Bull Turns Round pleaded and denied the accusation, and Wolf Tail
    pushed the tree over.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wolf Tail saw Bull Turns Round fall into the water and not come up; later
    he told their father that Bull Turns Round had gone hunting and that bears must
    have killed him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bull Turns Round was stunned in the river, carried downstream, and lodged
    on a sand shoal near the lodge of Under Water People.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Under Water People household consisted of an old man, his wife, and two
    daughters; the old man had waterfowl and tame buffalo, but the family ate bloodsuckers.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old man’s daughters found Bull Turns Round lying dead on the shoal and
    asked their father to bring him to life and give him to them as a husband.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The old man had four sweat lodges made; in them he sprinkled water on hot
    rocks, scraped sand from Bull Turns Round, and after the fourth lodge Bull Turns
    Round came to life.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The old man gave Bull Turns Round to his daughters and gave him a new lodge,
    bows and arrows, and other presents.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Bull Turns Round rejected cooked bloodsuckers, threw them into the fire, and
    said buffalo was the only meat for men; the old man allowed him to kill a buffalo
    but instructed that no bones be taken or broken because he would make it alive
    again.
  category: sequence
  evidence_refs:
  - ev:9
