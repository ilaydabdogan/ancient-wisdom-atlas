canonical_text:
  quote: ''
  summary: A group prays to the Sun, Above People, and Under Water People before going
    to a strange camp of meat-eaters. They settle near the Wolf band. A child takes
    an arrow but is spared by the Wolf chief. The Wolf chief accompanies a new friend
    to feasts where Raven and Kit-fox chiefs give decorated medicine sticks, songs,
    dances, and instructions for carrying these medicines back to the people and establishing
    the I-kun-uh-kah-tsi/Raven carriers. The passage ends as a Bear chief begins a
    similar gift scene.
  language: English
  quote_policy: summarized
