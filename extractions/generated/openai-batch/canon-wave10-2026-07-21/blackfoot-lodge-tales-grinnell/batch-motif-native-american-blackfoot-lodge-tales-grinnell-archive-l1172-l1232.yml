canonical_text:
  quote: ''
  summary: A celibate medicine man, secretly in love with a poor man’s unmarried sister,
    offers to send his secret helper to recover the poor man’s lost wife if the sister
    will be given to him. The sister outwardly agrees on the condition that the lost
    wife is restored, while intending deception. The medicine man prepares a closed
    nighttime ritual in his lodge, burns sweet herbs, sings, and a strange voice arrives
    as his dream-helper, knowing he wants the lost woman retrieved.
  language: English
  quote_policy: summarized
