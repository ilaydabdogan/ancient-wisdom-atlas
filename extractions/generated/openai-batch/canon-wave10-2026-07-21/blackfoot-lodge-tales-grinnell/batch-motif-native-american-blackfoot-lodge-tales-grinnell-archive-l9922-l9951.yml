    horses, warfare was likely limited to disputes, revenge, or glory rather than
    plunder. It states that common possessions such as arms, dogs, clothing, and dried
    meat were not worth dangerous expeditions, and that captured goods were difficult
    to transport on men's backs. The passage then begins an incomplete contrast with
    the arrival of horses.
