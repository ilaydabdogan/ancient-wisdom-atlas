canonical_text:
  quote: ''
  summary: The passage describes people killing buffalo with hide-and-stone mauls;
    Old Man traveling north, creating and teaching more people, and leaving visible
    landscape traces where he slept and slid. It then describes Na'pi marking off
    land for five tribes, commanding them to keep outsiders from crossing the boundary,
    and a later narrator saying the ancestors defended the line but descendants failed
    to obey the law after allowing white people in.
  language: English
  quote_policy: summarized
