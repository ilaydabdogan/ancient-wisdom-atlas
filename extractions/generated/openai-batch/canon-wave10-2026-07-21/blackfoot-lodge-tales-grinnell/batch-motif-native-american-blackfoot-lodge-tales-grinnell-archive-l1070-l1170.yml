canonical_text:
  quote: ''
  summary: A Blackfoot man and his wife are overtaken by enemies. The wife refuses
    to leave him, but he pushes her from the horse, escapes, and kills pursuers. He
    returns with trophies and mourns her loss. A search party finds the other women
    dead but cannot find his wife. He mourns for four days and nights with his child,
    then declares that he will go to seek his wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Enemies surround the mounted man and woman, strike at the man, and try to
    pull the woman from the horse without intending to kill her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife holds tightly to her husband, and this prevents him from using his
    arrows to defend himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband tells his wife to let the enemies take her; she replies that it
    is no harm for both of them to die together.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband shifts his position on the horse and pushes his wife off behind
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the wife falls off, the horse gains speed and the husband shoots back
    at the pursuing enemies, killing some of them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Only two enemies continue the pursuit after the rest fall behind or return
    to the place where the women were killed or captured.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Blackfoot man dismounts and faces the two pursuers on foot, moving first
    toward one and then toward the other with arrows in hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: He identifies one pursuer as cowardly because that man draws away, and the
    other as brave because that man stands still and shoots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: He kills the brave pursuer with an arrow and stone axe, then catches and kills
    the other pursuer with his axe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: After killing the pursuers, he scalps them and takes their arrows, horses,
    and stone knives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: He returns to camp crying over his wife, tells the people what happened, and
    shows the arrows, horses, and scalps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: A council sends a party to the battle place, where they find all the women
    dead except the man's wife, whom they cannot find.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The man carries his child on his back around camp, mourning and crying for
    four days and four nights until exhausted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The chief wakes the man and asks his decision; the man says the child is lonely
    for its mother and that he is going to look for his wife.
  category: speech
  evidence_refs:
  - ev:7
