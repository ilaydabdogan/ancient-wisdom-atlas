canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot medicine-pipe ceremonies: a thunder ceremony
    involving four counted coups, pipe smoking, prayer, and burial of ashes; an 1885
    medicine-pipe unwrapping by Red Eagle with prayers for a Piegan war party and
    communal welfare; and an 1879 sacred-pipe ceremony for a sick woman involving
    food, pipe smoking, sweetgrass smoke purification, root eating, buffalo and antelope
    songs and gestures, unwrapping the pipe, face painting, and prayer toward the
    sky.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pipe was handed to a man on the right of a semi-circle, and another warrior
    used a lighted brand from the fire to count four coups, touching the pipe bowl
    after each coup.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the fourth coup the pipe was lighted, smoked in turn around the circle,
    and each receiver said a short prayer before smoking.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the pipe was smoked out, the ashes were placed in a hole in the ground,
    covered carefully, and the thunder ceremony ended.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In 1885, Red Eagle unwrapped a medicine pipe while prayers were made for a
    Piegan party pursuing Crows who had taken horses, and also for general and individual
    welfare.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The general prayer asked for full life, bodily strength, growth of young people,
    increased flesh, and old people reaching great age.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In an 1879 account, a sacred pipe was unwrapped for a sick woman in a lodge
    containing invited men, an aged medicine man, his wife, and the pipe bundle on
    a folded buffalo robe.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the ceremony began, food was served and a common pipe was lit and smoked
    around the circle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman placed a coal before the sacred stem, put sweetgrass on it while
    a buffalo chant was sung, and both she and the medicine man rubbed the smoke over
    themselves for purification.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The medicine man and woman each ate a piece of root from a pouch, which the
    account says signified purification within as well as without.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man and woman sang buffalo and antelope songs while touching the pipe
    wrappings and making animal signs or sounds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman unwrapped the pipe, holding each wrapping over sweetgrass smoke,
