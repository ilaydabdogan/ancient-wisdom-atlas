- id: obs:1
  text: The buffalo stone, called I-nis'-kim by the Blackfeet, is described as a small
    stone, usually a fossil shell, and as strong medicine giving power with buffalo.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person on the prairie may hear a faint chirp attributed to a buffalo rock,
    search for it, and rejoice if it is found.
  category: sequence
  evidence_refs:
