canonical_text:
  quote: ''
  summary: 'The passage explains the Blackfoot I-nis''-kim, or buffalo stone, as a
    small fossil-like stone with strong medicine and power connected to buffalo. It
    then tells an origin story: during winter famine after the buffalo disappear,
    a young wife hears a song near a cottonwood tree, finds a buffalo rock with buffalo
    hairs, and receives instructions from the speaking rock. She brings it home, teaches
    the song to elders, and the people pray. A buffalo herd returns, and the people
    thereafter care for and pray to the rock. A note identifies such stones as ammonites,
    baculite sections, or flint nodules and reports a belief that they can have young
    stones if left wrapped and undisturbed.'
  language: English
  quote_policy: summarized
