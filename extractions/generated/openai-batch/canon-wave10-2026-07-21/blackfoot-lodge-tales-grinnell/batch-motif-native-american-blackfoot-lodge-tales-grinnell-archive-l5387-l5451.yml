    begin to starve.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A young married man kills a jack-rabbit and sends one of his wives to get
    water to cook it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: While going along the path to the river, the young woman hears a beautiful
