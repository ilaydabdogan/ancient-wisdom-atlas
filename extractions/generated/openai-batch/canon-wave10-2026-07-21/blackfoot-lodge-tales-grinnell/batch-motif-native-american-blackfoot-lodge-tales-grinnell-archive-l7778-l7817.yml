    longer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old woman is described as still mourning a son who had died more than twenty
    years earlier.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men mourn by cutting a little of their hair, going without leggings, and sometimes
