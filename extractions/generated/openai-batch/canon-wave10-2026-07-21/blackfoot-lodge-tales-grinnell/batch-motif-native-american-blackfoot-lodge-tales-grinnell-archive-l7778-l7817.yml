- id: obs:3
  text: For the loss of a husband or son, but not a daughter, women may remove one
    or more finger joints and always scarify the calves of their legs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women may go daily for a month or more to a place near camp, generally a hill
    or small rise, where they cry, lament, and repeatedly call the deceased person's
    name.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage characterizes the women's lament as a mournful song with a tune
