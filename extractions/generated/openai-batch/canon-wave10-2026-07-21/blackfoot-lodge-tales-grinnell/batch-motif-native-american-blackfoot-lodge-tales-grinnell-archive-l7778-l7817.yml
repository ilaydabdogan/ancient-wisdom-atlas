literal_observations:
- id: obs:1
  text: A man's horse may be killed at his grave so that he has a mount for the journey
    to the Sand Hills and for use after arrival; in earlier times, dogs were reportedly
    killed at the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women mourn deceased relations by cutting their hair short.
  category: action
  evidence_refs:
