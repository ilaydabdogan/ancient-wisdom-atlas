- id: obs:2
  text: The hunter sings eagle songs at night, burns sweet grass, rubs smoke over
    his body for purification, and leaves before day without eating or drinking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hunter lies in the pit, uncovers the bait, holds the rope, and ignores
