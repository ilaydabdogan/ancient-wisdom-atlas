canonical_text:
  quote: ''
  summary: An ethnographic passage describes Blackfoot methods for catching eagles
    from a concealed pit, including decoys, bait, songs, sweet-grass smoke purification,
    fasting, capture by the feet, killing, and a post-hunt rite in a special eagles'
    lodge where the dead birds are fed with pemmican. It also notes prayer to a ghost
    associated with a human skull, the value of eagles, and briefly describes methods
    for hunting other game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A concealed pit is covered with juniper twigs and grass, and a stuffed wolf,
    coyote, or fox skin is arranged with a rope tied to meat bait.
  category: object
  evidence_refs:
