canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot/Pi-kun''-i buffalo hunting methods: mounted
    men guide a herd toward camp by riding parallel to it, people charge the winded
    herd near camp, hunters sometimes surround buffalo on foot and exhaust them, lodges
    may be set up as a corral, and seasonal movements and preparations around buffalo
    and pis''kuns are described. The passage also states that one encirclement method
    closely corresponds to an early Pawnee buffalo-killing method before horses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fresh horses were supplied at intervals to men bringing the buffalo herd.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mounted men approached a buffalo herd on a flat, then rode parallel to the
    herd and matched its gait as it moved from walking to trotting, loping, and running.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The riders kept at a distance from the herd and changed sides behind the herd
    when needed to keep it moving on the desired course toward camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the herd neared camp, many buffalo were winded, and people waiting in
    the rolling hills charged them, causing the herd to break up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When buffalo were not in a favorable place for driving over a cliff or into
    a pen, hunters could surround the herd on foot on a calm day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the foot-surrounding method, the hunters startled the buffalo, kept them
    inside the circle, let them mill around until exhausted, and then shot them down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that this foot-surrounding buffalo-killing method corresponds
    almost exactly with a Pawnee method used before horses.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Pi-kun'-i sometimes surrounded buffalo and set lodges around them, making
    a practical corral of lodges.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Buffalo enclosed by lodges ran in a large circle because they were afraid
    to pass between the lodges, and people killed them after they were exhausted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In winter, large numbers of buffalo were killed and prepared as stores of
    dried meat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'The buffalo moved seasonally: in spring toward flatter prairie away from
    the pis''kuns, and as winter approached back close to the mountains; the Blackfeet
    followed them as food became scarce.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In late summer and early autumn, runners looked for buffalo and tracked their
    movements, and in early autumn the pis'kuns were repaired and strengthened for
    winter.
  category: action
  evidence_refs:
  - ev:8
