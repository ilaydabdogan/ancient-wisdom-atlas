canonical_text:
  quote: ''
  summary: 'Wolf Calf describes a Blackfoot eagle-catching practice: an eagle-catcher
    moves away from the main camp, prepares a camouflaged pit on a mound or butte,
    uses buffalo meat and sometimes a stuffed wolf skin as bait, prays and observes
    prohibitions before entering the pit with a stick, human skull, and pemmican,
    catches eagles from concealment, and follows sacred restrictions concerning rosebuds
    and awls. John Monroe is introduced as another eagle-catcher who describes a similar
    pit method.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who intends to catch eagles moves his lodge and family away from the
    main camp to a place where birds are abundant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eagle-catcher digs a body-length pit on top of a mound or butte and camouflages
    it with willow sticks, grass, earth, and stones.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bait is a bloody piece of buffalo neck tied to a rope that passes through
    the pit roof; a stuffed wolf skin may be placed near it as if eating.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before going to the pit, the man smokes and prays, tells his wives and children
    not to use an awl, and takes a slender stick, a human skull, and pemmican into
    the pit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An eagle descends to the bait, begins feeding when it cannot carry the bait
    away, and is seized by the legs, drawn into the pit, and killed by the watcher.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After killing an eagle, the watcher opens its bill and places a small piece
    of pemmican in its mouth to make other eagles hungry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: While in the pit, the watcher neither eats, drinks, nor sleeps; after dark
    he goes to a nearby sleeping-place where he eats and drinks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The account states that the human skull is taken into the pit for protection
    and because the ghost associated with it is believed to make the watcher invisible
    to the eagle.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The slender stick is used to drive away magpies, crows, ravens, and white-headed
    eagles from the bait and pit roof.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Two sacred observances are stated: the watcher must not eat rosebuds, and
    neither the man nor his wife must use an awl while he is catching eagles.'
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: John Monroe is described as a famous eagle-catcher who gives another account
    of a pit dug on the highest available knoll near a stream.
  category: speech
  evidence_refs:
  - ev:8
