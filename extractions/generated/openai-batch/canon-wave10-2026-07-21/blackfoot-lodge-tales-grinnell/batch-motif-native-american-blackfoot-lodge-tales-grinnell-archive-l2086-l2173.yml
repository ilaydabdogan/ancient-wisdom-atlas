canonical_text:
  quote: ''
  summary: A grieving husband is joined by his wife's relations in a search for her.
    A party of seven follows a war-party trail to the Big River and hides opposite
    a camp. The husband swims across at night, searches the lodges, hides in a riverbank
    hole near the water steps, and watches people come for water. At sunset he recognizes
    his wife, urges her to swim back with him, but she asks to return for goods and
    a horse, swearing she will come later. He permits her to go and moves away with
    his face hidden.
  language: English
  quote_policy: summarized
