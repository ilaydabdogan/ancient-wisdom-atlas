canonical_text:
  quote: ''
  summary: A dog and a stick, identified as not being what they seem, enter a place
    containing many buffalo and deer, escape by clinging to a bull, change into their
    true shapes, and drive buffalo toward camp. A raven repeatedly prevents the buffalo
    from going over the pis'kun, and Old Man recognizes the raven as the one who kept
    the buffalo cached. Old Man changes into a beaver, feigns death, catches the raven,
    and punishes it by tying it in a lodge smoke hole. After the raven weakens and
    begs for pity, Old Man releases it, tells it to take its right shape, declares
    his immortality and creator status, and orders it to hunt when hungry.
  language: English
  quote_policy: summarized
