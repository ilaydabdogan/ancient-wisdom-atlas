canonical_text:
  quote: ''
  summary: E-kiis'-kini, nearly out of ammunition, shoots the Cree chief Kom-in'-a-kiis,
    then fights the charging Crees with a dagger until he is killed, leaving fifteen
    dead enemies nearby. His body is cut into pieces and scattered so that he will
    not come to life again. His father later gathers only part of the remains. Afterward,
    a grizzly bear kills five of six Cree scouts, and the passage says Crees and Blackfeet
    believe the bear was E-kiis'-kini's spirit returned in another shape.
  language: English
  quote_policy: summarized
