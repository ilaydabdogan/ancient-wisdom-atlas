  quote: ''
  summary: The passage gives a historical and ethnographic account of the Blackfoot
    nation, its three tribes, an earlier northern/eastern homeland, movement toward
    the Rocky Mountains and plains, expansion after acquiring horses and guns, the
    landscape of Blackfoot country, and the disappearance of buffalo and other game
    alongside the threatened decline of the Blackfeet.
  language: English
  quote_policy: summarized
