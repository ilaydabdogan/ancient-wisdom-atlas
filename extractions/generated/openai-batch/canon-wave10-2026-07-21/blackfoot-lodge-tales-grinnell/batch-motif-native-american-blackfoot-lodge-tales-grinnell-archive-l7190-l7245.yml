  summary: The passage contrasts an earlier period in which the Blackfeet are described
    as powerful prairie buffalo hunters and warriors with a recent period after the
    disappearance of the buffalo, when a diminished remnant lives near agencies and
    attempts to adopt farming and wage-like toil. It closes by presenting ancient
    hunter-warrior burials in trees near present Blackfoot farmers as the meeting
    of past and present.
