canonical_text:
  quote: ''
  summary: 'A group of Blackfeet encounter a disappearing pis''kun, ancestral arrow
    points, an apparition of a buffalo hunt, a buffalo replaced by a dead mouse, and
    an arrow that changes to spear grass when handled. Later outcomes are reported:
    one man dies after taking property, apparently followed by the owner''s angry
    shadow; others keep ancestral objects as medicine; a buffalo rock, I-nis''-kim,
    enables its keeper to call buffalo into the pis''kun through prayer and medicine-making.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The men look around, see a pis'kun, and the pis'kun disappears before they
    reach it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One man picks up a stone pointed arrow and says it belonged to his father
    and that the place is his father's place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: One man says he sees his father running buffalo; the group sees a person on
    a white horse kill a buffalo and begin butchering it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before the group reaches the place, the person rides off; where the buffalo
    had been, they find only a dead mouse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Beside the mouse is a buffalo chip with a red-painted arrow on it; when the
    man holds it, it is a blade of spear grass, and when he lays it down, it is an
    arrow again.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another Blackfoot finds a buffalo rock called I-nis'-kim.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man who had taken the maul and dog travois returns home, smells smoke
    from the fire, and dies, as does his horse; the passage says the owner's angry
    shadow followed him home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: E-kus'-kini keeps a stone and an iron arrow point that belonged to his father
    and is said to have lived long because of them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man who took the stone arrow point near the pis'kun keeps it as medicine
    and later survives two severe war wounds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The keeper of the buffalo rock places it near the fire in his lodge, prays
    over it, makes medicine, asks for buffalo to jump into the pis'kun, and the requested
    number comes the next day.
  category: action
  evidence_refs:
  - ev:8
