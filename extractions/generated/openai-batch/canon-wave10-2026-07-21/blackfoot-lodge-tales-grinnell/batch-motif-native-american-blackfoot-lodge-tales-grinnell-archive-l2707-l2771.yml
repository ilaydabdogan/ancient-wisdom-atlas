canonical_text:
  quote: ''
  summary: An old woman instructs her dog to stay behind when the camp moves, free
    two bound children, and show them hidden food. The dog does this, then returns
    to the camp trail. The girl refuses to return to the people, travels with her
    baby brother and food, builds a small lodge, receives dream instructions from
    an old woman, ties her brother to each lodge pole in turn, and the brother rapidly
    grows into a young man.
  language: English
  quote_policy: summarized
