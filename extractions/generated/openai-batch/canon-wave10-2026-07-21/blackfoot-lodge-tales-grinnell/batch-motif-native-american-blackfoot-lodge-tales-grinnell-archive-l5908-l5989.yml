canonical_text:
  quote: ''
  summary: The passage recounts early Blackfoot Genesis episodes in which people learn
    to defend themselves against buffalo, butcher and cook buffalo meat, make stone
    dishes, seek power through dreams and animal helpers, and receive further instruction
    from Old Man, who creates additional people and buffalo from mud or clay and teaches
    a buffalo drive over a cliff.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three unarmed men go onto the plain to see buffalo; buffalo kill two of them
    and one escapes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Later, people confront buffalo with bows and arrows said to have been given
    by Na^pi; buffalo fall, and one person is killed in the fight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People have flint knives, and Old Man teaches them to make fire with fire
    sticks and to cook buffalo flesh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: People hollow a softer stone with a harder stone and make a stone kettle or
    dish.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old Man tells the people that when they are overcome they may sleep and gain
    power through dreams, and that animals appearing in sleep should be obeyed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Old Man says prayers for help may be answered by animals such as eagles, buffalo,
    or bears.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first people are said to get through the world by the power of dreams.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Old Man travels north, followed by many animals he had made; the animals understand
    his speech and serve him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the north point of the Porcupine Mountains, Old Man makes mud images of
