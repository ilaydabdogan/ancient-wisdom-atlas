canonical_text:
  quote: ''
  summary: The passage describes the Blackfeet as formerly numerous and generally
    healthy, then attributes later population loss to diseases and alcohol introduced
    after the arrival of whites. It recounts severe smallpox epidemics, including
    an 1845 outbreak said to have moved up the Missouri River through several tribes
    before reaching the Blackfeet, with mass deaths and improvised burials at Fort
    Union. It also describes later epidemics and the whiskey trade, including violence
    in trading stores and traders' use of a specially shaped tin scoop to reduce immediate
    danger while serving liquor.
