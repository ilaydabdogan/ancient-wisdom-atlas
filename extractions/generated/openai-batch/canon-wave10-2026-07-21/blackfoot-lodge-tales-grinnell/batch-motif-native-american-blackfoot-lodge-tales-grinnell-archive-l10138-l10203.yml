canonical_text:
  quote: ''
  summary: The passage recounts Pawnee pursuit of Sioux mule-takers in 1867, a contest
    over who counted coup by touching a fallen Sioux, a second Pawnee raid in which
    one youth shot, touched, and scalped a Sioux man, and a statement that among the
    Blackfeet certain captured war or medicine objects were deemed coups. It ends
    by noting the high social esteem attached to counting coups and personal bravery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1867 Pawnee scouts were sent to Ogallalla, Nebraska, to guard Union Pacific
    railroad graders.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Sioux took mules across the North Platte, and Major North took twenty
    men in pursuit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When pursued, six Sioux left the mules and fled; Pawnees chased them for several
    miles and caught up with one man identified as a brother of Spotted Tail.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Baptiste Bahele rode ahead of the other Pawnees, shooting arrows at the Sioux
    man while the Sioux man shot back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Baptiste shot the Sioux man's horse and then wounded the man with an arrow;
    the Sioux man pulled the arrow through his body and shot it back toward Baptiste.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A carbine shot then struck the Sioux man and knocked him down.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Baptiste and another Pawnee raced to count coup on the fallen man; Baptiste
    reached him first but did not touch him because his horse shied, while the other
    Pawnee touched him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Pawnees denied Baptiste's claim to the coup and credited the other Pawnee
    because he actually touched the enemy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: On another occasion, several young Pawnee men went on the warpath, stole horses
    near Spotted Tail's camp, and one youth returned to cut loose another horse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The returning Pawnee youth shot a Sioux man, counted coup on him, scalped
    him, and escaped across the river while pursued by the Sioux camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the Pawnee party returned to the village, only the youth who had shot,
    touched, and scalped the Sioux man received credit for a coup.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Among the Blackfeet, capture of a shield, bow, gun, war bonnet, war shirt,
    or medicine pipe was deemed a coup.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Counting coups gave a man high esteem among the people, and personal bravery
    is described as especially respected.
  category: attribute
  evidence_refs:
  - ev:6
