  quote: ''
  summary: 'The narrator discusses conditions among the Blackfeet in the late nineteenth
    century: corruption around agency administration, Major George Steell''s pursuit
    of whiskey sellers, changes in clothing and tribal life, the narrator''s council
    with chiefs in 1888, and a later conversation with a Piegan man about local food
    distribution, a storehouse, and a blacksmith shop on Cut Bank River.'
