canonical_text:
  quote: ''
  summary: The passage describes the structure and use of a Blackfoot pis'kun, or
    buffalo drive enclosure. It explains the V-shaped chute, ritual preparation involving
    a medicine man, pipe, buffalo rock, prayers to the Sun, sweet grass, and household
    restrictions, then describes how buffalo were lured, frightened, driven over a
    precipice into the enclosure, killed, and distributed. It also gives an alternate
    undisguised method of luring buffalo, notes the recent historical use of the pis'kun,
    and compares Siksika construction with Blood, Piegan, and Cree practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pis'kun enclosure could be made of logs or brush as a high barrier, and
    buffalo inside ran around looking for an opening rather than pushing through it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two long diverging lines of rock piles and brush extended from the bluff across
    the prairie in a V shape, with the opening over the pis'kun at the angle.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the evening before a drive, a medicine man, often one possessing a buffalo
    rock called In-is'kim, unrolled his pipe and prayed to the Sun for success.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the morning of the drive, the buffalo caller instructed his wives to remain
    in the lodge, not look out, keep sweet grass burning, and pray to the Sun for
    his success and safety.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The buffalo caller went out without eating or drinking, while the people followed
    and hid behind the rocks and bushes forming the V-shaped chute.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the standard method, the medicine man put on a buffalo-head head-dress
    and a robe before approaching the buffalo herd.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The buffalo followed the caller toward the chute; once they were inside it,
    hidden people rose behind them, shouted, and waved robes.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The herd ran toward the precipice, and the animals were pushed or plunged
    into the pis'kun, where the survivors were prevented from escaping and were killed
    by arrows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An alternate method used a skilful man without disguise who wheeled around,
    appeared and disappeared, and aroused the buffalo's curiosity to draw them toward
    the chute.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the alternate drive, the killed buffalo were divided among the people,
    with chiefs and the leading warrior receiving the best and fattest animals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The pis'kun remained in use within living memory, and witnesses associated
    successful drives with plenty for the camp.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Siksika pis'kuns are described as differing from those of the Bloods and
    Piegans and as resembling Cree construction on level ground near timber, with
    a high log corral and a bridge or causeway.
  category: relationship
  evidence_refs:
  - ev:8
