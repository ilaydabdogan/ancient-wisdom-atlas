canonical_text:
  quote: ''
  summary: The passage describes the Piegan Blackfeet reservation as unsuitable for
    agriculture but suited to stock-raising. The narrator recounts encouraging the
    Indian Bureau to use treaty money to purchase cattle, the instructions given to
    the Piegans to preserve the cattle for breeding, their subsequent care for the
    animals, and the narrator's view that cattle ownership encouraged property, work,
    self-help, and future self-support. The passage closes by challenging a stereotype
    that Indians are unwilling to work.
  language: English
