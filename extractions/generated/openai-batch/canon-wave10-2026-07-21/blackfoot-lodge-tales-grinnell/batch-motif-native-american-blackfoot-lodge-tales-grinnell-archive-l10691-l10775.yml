canonical_text:
  quote: ''
  summary: 'The passage describes Blackfeet beliefs about powers, signs, songs, weather-making,
    and sacred places or objects: ravens give far sight and warnings, wolves and coyotes
    warn or aid people, wolf songs bring food or hunting luck, bears have powerful
    medicine, songs and kit-fox skins can affect weather, and certain buttes, rivers,
    rocks, and underwater beings receive reverence or presents.'
  language: English
  quote_policy: summarized
