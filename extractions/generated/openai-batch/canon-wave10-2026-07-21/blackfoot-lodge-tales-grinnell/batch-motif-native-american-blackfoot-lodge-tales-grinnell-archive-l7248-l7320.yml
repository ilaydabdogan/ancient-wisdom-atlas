canonical_text:
  quote: ''
  summary: 'The passage describes Blackfeet daily life and customs before the disappearance
    of the buffalo: their sociability, former abundance, morning camp routines, cold-water
    bathing, meals, horse gathering, hunting, women’s labor, young men’s adornment,
    and the beginning of feasting practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says the Blackfeet were not a taciturn or gloomy people, but
    were talkative, merry, and light-hearted.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator connects the former happiness and wealth of the people with the
    abundance of buffalo, fur animals, meat, robes, and furs before the buffalo disappeared.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At sunrise, smoke rises from lodge smoke holes while women carry water and
    wood and prepare a meal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men come out of the lodges and go to the river, sometimes followed by children
    and sometimes carrying children too small to walk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men remove their blankets and plunge into icy water as a daily custom in all
    weather and seasons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports that this cold-water practice was said to make people
    tough and healthy and able to endure prairie cold while hunting.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the river bath, women have prepared an early meal; each man receives
    a large dish of boiled meat, children are served, and wives take the rest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Horses are brought into camp by boys and young men who had gone after them
    at daylight.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If nearby buffalo are to be run, each hunter catches a preferred buffalo horse
    and the hunters start out together.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women follow the hunters on travois or pack horses and do most of the butchering
    and transport the meat and hides to camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If no nearby buffalo band is present, hunters go singly or in small groups
