  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Women remaining in camp tan robes, dry meat, sew moccasins, and perform other
    tasks throughout the day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Young men who remain at home comb and braid their hair, paint their faces,
