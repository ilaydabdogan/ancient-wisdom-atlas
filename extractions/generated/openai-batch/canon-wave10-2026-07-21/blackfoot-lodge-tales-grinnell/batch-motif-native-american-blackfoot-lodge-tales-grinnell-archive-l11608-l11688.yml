  quote: ''
  summary: The passage describes Blackfoot interpretations and uses of the sweat lodge,
    post-sweat bathing, reported treatments for mad wolf bites, payment customs for
    doctors, and doctoring practices involving song, women helpers, prayers, methods
    against evil spirits, and occasional herbal or fungal medicines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ground inside the lodge is said to stand for the flat, round surface of
    the world, while the lodge framework represents the sky touching the world at
    the horizon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the sweat, men rush out and plunge into a stream to cool off, even in
    winter when ice must be broken for bathing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During a small-pox outbreak, sick people reportedly used the sweat lodge daily,
    and some drowned after the following river bath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mad wolves are said to have bitten animals and people; bitten persons could
    tremble, jerk, foam at the mouth, and try to bite others.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Relations tied an afflicted person hand and foot, wrapped him in a green buffalo
    hide, and built fire on and around him until the hide began to dry and burn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The treatment was said to cure the patient because heat caused profuse sweating,
    and the disease left the body with the water.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A doctor was customarily paid before rendering services, often with a horse
    or other goods, and the payment covered one visit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Doctors usually sang while attempting cures, with a number of women present
    as helpers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Disease is described as caused by evil spirits, requiring prayers, exhortations,
    and special methods to remove their influence.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Doctors differed in methods and songs, and generally restricted the lodge
    during rites to the immediate family of the sick man.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: One medicine was a yellow fungus from pine trees, dried and powdered, then
    administered dry or in infusion as a purgative.
  category: object
  evidence_refs:
  - ev:8
