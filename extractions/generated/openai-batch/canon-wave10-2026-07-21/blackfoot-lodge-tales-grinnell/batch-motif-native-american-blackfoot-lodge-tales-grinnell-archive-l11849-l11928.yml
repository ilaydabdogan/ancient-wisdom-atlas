canonical_text:
  quote: ''
  summary: The passage describes deadly whiskey trading affecting the Blackfeet, uneven
    enforcement against the trade, and the severe 1883-84 starvation of the Piegan
    Blackfeet after the buffalo were exterminated from Blackfoot country. It recounts
    inadequate government supplies, delayed relief, local Montana and army assistance,
    and Major Allen's arrival amid the suffering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says whiskey-trading days included deaths from killing or freezing,
    and states that the traffic was very fatal to the Indians.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: United States laws prohibited selling intoxicants to Indians under severe
    penalties, but the passage says these laws were seldom enforced.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: North of the boundary line, the Canadian Mounted Police made whiskey-trading
    perilous, and Major Steell is credited with work against whiskey traffic on the
    Blackfoot agency in Montana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the winter of 1883-84, more than a quarter of the Piegan tribe of the Blackfeet
    died from starvation, out of a population described as about twenty-five or twenty-six
    hundred.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A report to the Indian Bureau stated that the Blackfeet were practically self-supporting
    and needed few supplies; the passage calls this report misleading and says appropriations
    were small as a result.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Blackfeet had not supported themselves except by killing
    buffalo, and that in 1883 the buffalo had been exterminated from the Blackfoot
    country.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: After losing the buffalo, the people turned to smaller game and hunted river
    bottoms, brush along small streams, and mountain sides, killing deer, elk, and
    antelope.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the beginning of winter, the people lacked their usual stores of dried
    meat and had only scanty supplies in the government storehouse.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Government storehouse supplies were described as inadequate and issued in
    amounts insufficient to sustain life.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Men hunted birds, rabbits, prairie-dogs, rats, and anything alive, but the
    people still began to starve.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The very old and very young died first, followed by the weak and sickly, and
    finally some of the strong and hardy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Congress ordered appropriations after news of the suffering was sent east,
    but supplies had to be freighted by wagon for 150 to 200 miles before they could
    be used.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: People in Montana, army officers at Fort Shaw, and one or two Montana contractors
