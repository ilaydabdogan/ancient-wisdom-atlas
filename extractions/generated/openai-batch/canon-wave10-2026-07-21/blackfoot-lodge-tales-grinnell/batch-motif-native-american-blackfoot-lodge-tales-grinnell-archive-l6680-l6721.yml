canonical_text:
  quote: ''
  summary: A group gathers at a creek for a jumping ordeal intended to reveal who
    killed a child. The chief sends for Old Man, who is said by the old women to be
    sick. Frightened, Old Man goes toward the creek and trades his necklace to a chickadee
    for some of the bird's jumping power. Old Man then jumps farther than everyone
    else, while the bird falls into the creek and asks to speak before the warriors
    kill him.
  language: English
  quote_policy: summarized
