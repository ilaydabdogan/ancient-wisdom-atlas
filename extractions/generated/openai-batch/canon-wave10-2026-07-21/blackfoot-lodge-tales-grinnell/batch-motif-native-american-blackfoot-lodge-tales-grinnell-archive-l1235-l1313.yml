  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman complains that her moccasins are worn out, her feet are sore, and
    she is tired and hungry; after she falls asleep, the helper goes back to the medicine
    man's lodge.
  category: speech
  evidence_refs:
  - ev:6
