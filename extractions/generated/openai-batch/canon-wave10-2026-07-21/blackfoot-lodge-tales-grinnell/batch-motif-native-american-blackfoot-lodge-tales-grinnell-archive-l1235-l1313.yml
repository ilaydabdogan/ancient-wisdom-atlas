canonical_text:
  quote: ''
  summary: A dream person or voice promises to seek a lost woman and departs with
    a wind-like sound. The dream person reaches the enemy Snakes camp at night, wakes
    the captured woman from beside the man who captured and married her, and leads
    her away toward home. As she grows tired, hungry, and footsore, the helper returns
    to the medicine man's lodge, where the medicine man sings, opens his bundle, burns
    sweet pine and sweet grass on coals, and receives a request for moccasins and
    food to send back to the woman.
  language: English
  quote_policy: summarized
