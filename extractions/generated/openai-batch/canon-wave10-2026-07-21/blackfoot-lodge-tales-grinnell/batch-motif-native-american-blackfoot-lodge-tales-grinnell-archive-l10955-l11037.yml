canonical_text:
  quote: ''
  summary: 'The passage describes portions of the Blackfoot Medicine Lodge ceremony:
    the Medicine Lodge woman cuts sacred tongues for distribution; participants hold
    pieces to the Sun, pray to the Sun, Na''-pi, and Ground Man, and place part on
    the ground; warriors recount coups and may receive new names; men fulfill vows
    by breast-swinging from rawhide ropes attached to the center post; the ceremony
    closes on the fourth day with gifts tied to the center post and assurances of
    long life and plenty. The passage also states that the rite is a religious festival
    for bodily and spiritual welfare, not a warrior-making rite, notes the respected
    status of the Medicine Lodge woman, and introduces tobacco traditions connected
    with a medicine beaver and White Calf.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Medicine Lodge woman bears witness about sexual fidelity and cuts up the
    tongues for distribution.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each person receives a small piece of tongue, holds it up to the Sun, prays
    to the Sun, Na'-pi, and the Ground Man for long life, and deposits part of the
    morsel on the ground with an offering formula.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the four days outside the lodge, warriors count coups by recounting
    war successes and pantomiming encounters such as killing enemies, taking guns,
    or cutting loose horses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a warrior's coup recounting, an old man offers a prayer and gives him
    a new name, wishing him long and good life under it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside the lodge, rawhide ropes are suspended from the center post for men
    who are fulfilling vows made after sickness or danger in war.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: For the breast-swinging vow, slits are cut in the skin of the breast, ropes
    are passed through and held by wooden skewers, and men swing until the skin tears
    out despite severe pain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that men do not give up during the breast-swinging because
    they believe failure to fulfill the vow would lead to death soon after.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the fourth day, everyone has been prayed for, presents to the Sun are tied
    to the center post, the sacred tongues have been consumed, and the ceremony ends
    with participants assured of long life and plenty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator states that the annual ceremony was not for making warriors but
    was a religious festival for bodily and spiritual welfare; the self-torturings
    were vow fulfillments and penances, not courage tests.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Medicine Lodge woman is described as receiving high respect from tribal
    members and as expected to be virtuous, serious, clean-minded, and sober in conversation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before the coming of whites, the Blackfeet smoked leaves of a plant called
    na-wuh'-io-ski, said to have been received long ago from a medicine beaver, and
    used it unmixed with any other plant.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: White Calf, chief of the Piegans, is said to have the secrets of the tobacco
    and to be perhaps the only person in the tribe who knows them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The account of tobacco ceremonies begins in early spring, after the last snow-storm
