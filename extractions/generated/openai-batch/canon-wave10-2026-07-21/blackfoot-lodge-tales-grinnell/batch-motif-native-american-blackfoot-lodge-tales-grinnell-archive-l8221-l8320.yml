canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot food preparation and abstentions: meat
    was boiled or roasted, formerly sometimes boiled in a green hide pit with red-hot
    stones; meat was dried and made into pemmican with buffalo fat and hide containers;
    spring waterfowl eggs were steamed in a covered pit; fish, certain reptiles and
    insects, dogs, and salt are discussed as avoided or formerly unused foods, with
    a Piegan speaker explaining that dogs should not be eaten because they are faithful
    friends and night watchers.'
  language: English
  quote_policy: summarized
