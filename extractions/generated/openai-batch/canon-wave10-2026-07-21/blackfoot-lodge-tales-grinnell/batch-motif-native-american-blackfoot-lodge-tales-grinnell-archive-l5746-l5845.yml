canonical_text:
  quote: ''
  summary: English Blackfoot Genesis passage in which Old Man, also named Na'pi, travels
    north making the world, landforms, plants, animals, and a clay-formed woman and
    child. Human mortality becomes fixed after a river test involving a floating buffalo
    chip and a sinking stone, and Old Man refuses to reverse the resulting law after
    the child dies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All animals, birds, people, and things made by Old Man are said to have understood
    him when he spoke to them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Man travels from the south toward the north while making animals, birds,
    landforms, rivers, falls, red paint deposits, and the world as described in the
    passage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After making and crossing the Milk River, Old Man rests on a hill and marks
    the outline of his body with stones that are said to remain visible.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After stumbling over a knoll, Old Man raises two large buttes called the Knees
    and later builds the Sweet Grass Hills with rocks he carries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old Man covers the plains with grass, makes edible roots and berries grow,
    puts trees in the ground, and places animals on the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bighorn is awkward on the prairie, so Old Man leads it into the mountains,
    where it moves easily among rocks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The antelope is made of dirt in the mountains, falls over rocks there, and
    is then taken to the prairie, where it runs fast and gracefully.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Old Man forms a woman and her son from clay, tells the clay that it must be
    people, covers it, and leaves it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The clay forms change over successive mornings, and on the fourth morning
    Old Man tells the images to rise and walk, which they do.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman and child walk with their Maker to the river, where he tells them
    that his name is Na'pi, Old Man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the river, the woman asks whether they will always live, and Old Man proposes
    a buffalo-chip test in which floating would mean people return to life after four
    days and sinking would mean an end to them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Old Man throws the buffalo chip into the river, and it floats.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The woman throws a stone into the water with her own stated condition; the
    stone sinks, and Old Man says she has chosen that there will be an end to people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The woman's child dies not long afterward, she asks Old Man to change the
    law, and Old Man refuses, saying that what is made law must remain law.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage concludes that this is how humans came to be people and that Old
    Man made them.
  category: speech
  evidence_refs:
  - ev:11
