canonical_text:
  quote: ''
  summary: Two young men and E-kus'-kini disagree over whether a nearby camp is their
    own people or an enemy party. The young men enter the area, discover through speech
    with women at the stream that the camp is Cree, flee, and hide under a bank concealed
    by willows. E-kus'-kini approaches with Sarcees, recognizes enemies, sings his
    war song, challenges them, fights toward the Cree camp, and directs surviving
    companions toward choke-cherry brush at the camp center.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two young men report seeing a large camp at Saskatoon Creek and believe it
    is the allied Blackfoot, Piegan, Blood, and Sarcee camp.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: E-kus'-kini disputes the young men's interpretation and says the camp must
    be a war party rather than their own people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Low Horn tells the two young men they may go and asks them to tell his father
    that he will come into camp at night, because he does not want to enter by day
    without bringing anything back.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the stream edge, the two young men meet two women who have come for water;
    after the men speak in Sarcee and Blackfoot, the women call out in Cree that two
    Blackfeet are there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two young men run up the creek, push through willow bushes, hide under
    the bank, and are not found by the camp people who search for them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: E-kus'-kini comes down the valley with four other Sarcees and initially thinks
    approaching Indians are his own people until he sees that they are enemies taking
    covers off their guns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: E-kus'-kini jumps aside, stands alone, sings his war song, and challenges
    the Crees to try his manhood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: While surrounded and shot at, E-kus'-kini says the enemies cannot kill him
    there and that he will take his body to their camp; he advances toward the Cree
    camp and kills two Crees before moving.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After two Sarcees fall, E-kus'-kini tells the remaining men to take courage
    and go to a patch of choke-cherry brush in the center of the camp while he fights
    to keep the way open.
  category: speech
  evidence_refs:
  - ev:7
