canonical_text:
  quote: ''
  summary: Kut-o'-yis encounters a woman who keeps a sliding-place trap leading over
    a cliff into water where a fish eats victims. He detects and cuts the hidden rope,
    causing the woman to fall and be eaten. He then enters the lodge of a man-eater
    after instructing a little girl how to recover his bones and summon dogs. The
    man-eater kills, cooks, and eats him repeatedly, but each time the girl follows
    the instructions and Kut-o'-yis rises from his bones. After four cookings, Kut-o'-yis
    throws the man-eater and his wives and children into the boiling kettle. The passage
    states that this man-eater is the seventh and last of the bad animals and people
    destroyed by Kut-o'-yis.
  language: English
  quote_policy: summarized
