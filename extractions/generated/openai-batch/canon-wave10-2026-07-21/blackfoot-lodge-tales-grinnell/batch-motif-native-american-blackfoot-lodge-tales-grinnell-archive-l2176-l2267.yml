canonical_text:
  quote: She took up pieces of charred wood, dirt, and ashes in her hands and ate
    them
  summary: The husband rejoins his relations and says his wife will return at dark,
    but she goes back to the Snake camp, performs a strange ash-eating act, and tells
    her new husband by signs that seven people are hidden across the river. Snake
    warriors surround the timber, kill the husband's relations one by one, and capture
    the husband alive. Bound in the lodge, he asks his wife why she betrayed him;
    she falsely tells the Snake man that he asked to have pipe ashes and fire knocked
    onto his breast.
  language: English
  quote_policy: quoted
