  text: In some stories Old Man has to ask animals for aid.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old Man sometimes sympathizes with people and sometimes plays malicious tricks
    on them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Old Man is known under various names to the Crees, Chippeways, and other Algonquian
    peoples, and many Blackfoot stories about him are also told among those peoples.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among some northern Cree and Chippeway groups, Old Man is described as Creator,
    chief god, and source of powerful medicine.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old Man is said never to die.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Old Man left the Blackfeet long ago and disappeared, usually to the West in
    the mountains, though some accounts say he went to the East.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before leaving, Old Man said he would always take care of the Blackfeet and
    would return someday.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some old people believe Old Man will return bringing the buffalo, which they
