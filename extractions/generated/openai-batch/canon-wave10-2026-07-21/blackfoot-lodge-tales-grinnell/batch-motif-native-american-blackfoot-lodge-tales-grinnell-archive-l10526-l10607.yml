  text: Old Man/Na'pi is presented as a real flesh-and-blood man in Blackfoot understanding
    rather than as an abstract personification of light.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Man is described as combining opposite qualities, including power and
