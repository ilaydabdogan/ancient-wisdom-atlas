canonical_text:
  quote: ''
  summary: The passage describes Blackfoot understandings of Old Man/Na'pi as a real
    person with contradictory attributes; notes related Old Man traditions among Crees,
    Chippeways, and other Algonquian peoples; recounts his departure and expected
    return; discusses the Sun's possible replacement of or identity with Old Man;
    and describes the Sun's family, cosmic lodge, beneficent attributes, and sacrifices
    offered to him.
  language: English
  quote_policy: summarized
literal_observations:
