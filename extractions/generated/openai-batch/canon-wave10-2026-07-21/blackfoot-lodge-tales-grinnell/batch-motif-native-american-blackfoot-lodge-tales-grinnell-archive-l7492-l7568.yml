canonical_text:
  quote: ''
  summary: The passage describes ancient camp movement with large lodges, dogs carrying
    loads and hauling travois, and an incident in which stampeding buffalo caused
    loaded dogs to scatter belongings and two babies were lost. It then records pipe-passing
    rules inside a lodge, a sacred smoking oath administered by a medicine man, pipe
    materials, and child training practices among the Blackfeet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Large lodges are described as among the heaviest and bulkiest things moved
    in camp, sometimes made of thirty cow-skins and containing two or three fires
    when set up.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large lodge skins were sewn in strips and pinned together when the lodge was
    set up.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dogs carried provisions, tools, utensils, small lodge strips, and compact
    heavy loads; some dogs could carry as much as one hundred pounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dogs hauled travois carrying bundles and sometimes babies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a remembered incident, a camp on foot was crossing open prairie between
    two pieces of timber when a stampeding buffalo herd rushed through the marching
    column.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The loaded dogs rushed after the buffalo, dragging travois and scattering
    their loads over the prairie.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two babies were among the lost chattels, dropped somewhere in long grass and
    never found.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When smoking, the pipe passes from the host to the left and follows a prescribed
    route; it is not passed across the door, and a person entering must not pass between
    the smokers and the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage connects smoking with a solemn affirmation equivalent to an oath
    and states that smoking is a sacred ceremony with many tribes of Indians.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: To test an improbable story, a medicine man receives the pipe, paints the
    stem red, prays over it, and asks that truth bring long life while falsehood bring
    a shortened life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The medicine man tells the tested speaker that if he smokes, his story must
    be as sure as the hole through the pipe and as straight as the hole through the
    stem.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the tested speaker refuses to smoke, he is regarded as having lied; if
    he smokes, everyone believes him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Blackfoot pipes are usually made of black or green slate or sandstone.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Blackfeet are described as not whipping their children, while still instructing
    them in manners and other matters.
  category: action
  evidence_refs:
  - ev:8
