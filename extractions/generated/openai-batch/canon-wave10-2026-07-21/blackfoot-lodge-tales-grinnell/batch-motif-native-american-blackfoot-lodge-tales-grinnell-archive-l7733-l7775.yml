canonical_text:
  quote: ''
  summary: 'The passage describes a power seeker who may keep his undertaking secret,
    then details Blackfeet burial customs: three burial modes, fear of reusing a lodge
    where a man dies, preparation of corpses by female relatives, wrapping and scaffold
    placement, burial goods for men and women, suspended platforms in lodges, and
    a special lodge burial for a great chief or noted warrior with personal effects
    and horses killed outside.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A seeker after power did not always, and perhaps did not often, tell anyone
    what he was going to do.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Three Blackfeet burial modes are listed: platforms in trees, platforms in
    lodges, and ground burial in lodges.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A lodge in which a man dies is never used again because people fear the man's
    ghost.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After death, the body of a man, woman, or child is immediately prepared for
    burial by the nearest female relations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The corpse was wrapped in robes and sometimes a lodge covering laced with
    rawhide ropes, then placed on a platform of lodge poles arranged in tree branches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the deceased was a man, weapons and often medicine were buried with him.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: For women, cooking utensils and implements for tanning robes were placed on
    the scaffolds.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: When a man was buried on a platform in a lodge, the platform was usually suspended
    from the lodge poles.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: For a great chief or noted warrior, the lodge could be moved from camp to
    brush and secured with pegs, stones, and a rope tied to a central peg.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the special lodge burial, beds were made, the corpse was placed as if asleep,
    personal items were set nearby, the door was closed, and no one entered again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Outside the special burial lodge, a number of the deceased man's horses, often
    twenty or more, were killed.
  category: action
  evidence_refs:
  - ev:11
