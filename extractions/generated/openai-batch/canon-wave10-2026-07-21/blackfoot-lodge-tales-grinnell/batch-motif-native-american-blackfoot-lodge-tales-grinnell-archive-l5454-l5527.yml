canonical_text:
  quote: ''
  summary: A bereaved man leaves his baby with his mother and travels toward the Sand
    Hills to seek his dead wife. In dreams, old women guide him toward the ghosts'
    camp, give him instructions and a medicine bundle, warn him to keep his eyes shut
    during a possible return, and prepare him for questioning and frightening sights.
    He enters the ghosts' camp with a relation while the ghosts try to scare him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and his wife have a son; the wife becomes ill and dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After his wife's death, the man carries the baby on his back, walks over the
    hills crying, and keeps away from camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man tells the child that he must live with his grandmother while the man
    tries to find the child's mother and bring her back; he leaves the baby at his
    mother's lodge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man travels toward the Sand Hills; on the fourth night he dreams of a
    little lodge where an old woman lives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first old woman says she has seen his wife pass that way, directs him
    to another old woman by a far butte, and says the ghosts' camp is beyond the next
    butte from that lodge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the next butte, the man finds no lodge, sleeps, and dreams of a second
    little lodge where an old woman calls him inside.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The second old woman says the wife is in ghost country, says the journey is
    difficult, gives the man instructions, and gives him a medicine bundle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The second old woman says that, if he returns with relations, he must keep
    his eyes shut, and that opening them and looking around would cause his death
    and prevent his return.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The second old woman says he will pass a big lodge, be questioned, and be
    frightened by noises and strange terrible sights, but must not be afraid.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old woman returns with one of the man's relations; the man goes with this
    relation to the ghosts' camp, answers the challenge as instructed, and the ghosts
    try to scare him.
  category: sequence
  evidence_refs:
  - ev:5
