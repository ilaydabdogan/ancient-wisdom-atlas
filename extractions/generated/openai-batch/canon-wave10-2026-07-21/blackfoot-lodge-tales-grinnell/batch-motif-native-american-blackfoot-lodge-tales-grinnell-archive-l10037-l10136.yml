canonical_text:
  quote: ''
  summary: 'The passage explains the Plains practice called counting coup: a warrior
    gains honor by approaching an enemy closely enough to strike or touch that person
    with an object in hand. It distinguishes this act from killing or scalping, describes
    its danger and social prestige, notes the counting and recounting of coups in
    ceremonies, and compares differing understandings of coup among Blackfeet, Pawnees,
    Cheyennes, and other Plains tribes.'
  language: English
