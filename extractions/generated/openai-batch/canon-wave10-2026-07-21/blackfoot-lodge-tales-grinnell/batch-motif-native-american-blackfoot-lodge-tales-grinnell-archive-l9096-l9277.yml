canonical_text:
  quote: ''
  summary: 'The passage describes aspects of Blackfoot/Piegan social organization:
    rough nocturnal pranks involving a colt put into a sleeping lodge; disciplinary
    duties of the Braves society; objects and obligations associated with the Brave
    society; surviving or transferred insignia of Soldiers and Bulls societies; and
    the old circular layout and movement order of the Piegan camp and its gentes and
    societies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some young men played rough practical jokes after people were asleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One prank involved leading or pushing a young colt to a lodge door, lifting
    the door, shoving the animal inside, and closing the door again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The colt ran around inside the lodge trying to get out to its mother, trampling
    sleepers, knocking things down, and causing confusion while the mare whinnied
    outside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Braves punished young men who did such acts when they could catch them,
    including tearing blankets, taking property, and sometimes whipping them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Braves are described as peace officers of the camp and are explicitly
    compared in that function to the Pawnee iari puk'iis.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The property of the Brave society included two stone-pointed arrows, a shield
    called one that a person does not sit down with, and one rattle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man carrying the rattle was known as Brave Dog, and when the rattle passed
    to another member, the new owner became known as Brave Dog.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man receiving the shield could not sit for four days and four nights and
    had to run around the camp or prairie while whistling like a rabbit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Soldiers and Bulls societies had ceased to exist before the time of men
    then of middle age.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The pipe of the Soldier society was still in the hands of Double Runner.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bull's head war bonnet was the insignia of the Bulls society and passed
    from Young Bear Chief to White Calf, who presented it to a recent agent.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In old times until the disappearance of the buffalo, the camp was arranged
    as a circle with lodges around the circumference and an inner circle of lodges
    for chiefs of certain I-kun-uh'-kah-tsi bands.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: When all gentes were present, each had a special position in the camp circle,
    and a gens chief's lodge stood just within the circle with his people camped about
    it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The inner-circle lodges served as lounging, eating, council, or idling places
    for band members on duty as occasion required.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: When the camp moved, the Blood gens moved first, followed by the White Breast
    gens and the others in order to number 24; when camping, the Bloods camped first
    and number 24 camped last to close the circle.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The diagram identifies twenty-four gentes of the Pi-kun'-i and lists bands
    of the I-kun-uh'-kah-tsi, including Braves, Soldiers, and others.
  category: object
  evidence_refs:
  - ev:10
