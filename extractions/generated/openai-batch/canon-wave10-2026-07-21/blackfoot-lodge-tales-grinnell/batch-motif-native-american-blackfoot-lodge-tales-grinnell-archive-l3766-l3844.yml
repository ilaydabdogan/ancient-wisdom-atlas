canonical_text:
  quote: ''
  summary: A Blackfeet war party travels toward the Saskatchewan River near Fort Pitt
    and encounters three Cree riders. The young Screech Owl puts on his father's war
    plume, sings his father's war song, ignores older warriors' order to stay behind,
    leads the charge, knocks the three Crees from their horses with a small axe while
    evading gunfire, and is later renamed E-kus'-kini, Low Horn, after this first
    war path.
  language: English
  quote_policy: summarized
