canonical_text:
  quote: ''
  summary: 'The passage describes boys observing coup-counting at the Medicine Lodge
    and learning to emulate respected warriors. It then describes Blackfeet men fasting
    alone for power: they abstain from food and drink for four days and nights in
    dangerous, unfrequented places, pray and sing sacred songs, keep a filled pipe
    ready for a spirit or dream, and may receive a secret dream-helper that advises
    them and gives power; some fail or abandon the ordeal.'
  language: English
  quote_policy: summarized
