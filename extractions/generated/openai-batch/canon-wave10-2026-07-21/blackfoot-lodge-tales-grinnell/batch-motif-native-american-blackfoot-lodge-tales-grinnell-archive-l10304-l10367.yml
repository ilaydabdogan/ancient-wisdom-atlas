canonical_text:
  quote: ''
  summary: The passage describes how a Blackfoot war party travels, assigns burdens
    and leadership duties, sends scouts to elevated vantage points, camps in concealed
    places, builds temporary shelters, avoids fire near enemies, shifts to night movement
    when enemy signs appear, and prepares for attack by painting and ritually handling
    war bonnets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war party may march by day or by night and always travels on foot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older men carry arms, while boys carry moccasins, ropes, food, coats, blankets,
    war bonnets, and otter-skin medicine.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The leader does little physical labor, plans the party's movements, is treated
    with great respect, and receives repaired moccasins and the best food.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After leaving the main camp, the leader sends a strong young man to a designated
    butte to look over the country and signal if nothing is seen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The scout travels hidden in ravines and coulees before signaling the party
    to proceed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The party usually travels from early morning until sundown, kills encountered
    antelope or buffalo if possible, and tries to save pemmican.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The party tries to camp in thick timber where it cannot be seen.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: When needed, a war lodge is built from young cottonwoods or aspens with leaves
    left on and butts upward; the leaves keep off rain and hide firelight.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: On woodless prairie in stormy weather, the party may build a rock shelter.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Near the enemy or in country where enemies are likely, the party stops building
    fires and eats food uncooked.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Fresh tracks or other signs of enemies cause the party to stop daytime travel,
    move only at night, and hide and sleep during the day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a scout reports an enemy camp, the leader directs the men to paint themselves
    and prepare their war bonnets.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: War bonnets with brass bells are not actually worn in a secret attack because
    their noise would reveal the party; instead they are spread out before painting
    and tied up again afterward.
  category: action
  evidence_refs:
  - ev:8
