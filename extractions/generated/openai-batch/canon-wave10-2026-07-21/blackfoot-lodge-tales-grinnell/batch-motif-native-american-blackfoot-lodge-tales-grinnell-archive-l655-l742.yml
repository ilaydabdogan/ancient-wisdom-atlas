canonical_text:
  quote: ''
  summary: After his companions turn back, Owl Bear travels alone toward the Snake
    camp, ashamed and intending to give his body to the Snakes. At night in rain he
    enters a dark hole in the rocks for shelter and discovers by touch a living person.
    The two men identify themselves by signs as Piegan and Snake. Owl Bear gives the
    Snake a knife and signs for him to kill him; the Snake then gives Owl Bear a knife
    and motions him to cut his heart, but Owl Bear refuses. In the morning they leave
    the cave and speak by signs. Owl Bear explains his abandonment and errand; the
    Snake says he had been going to war against the Piegans but is now done. Both
    identify themselves as chiefs, and the Snake praises Owl Bear's bravery.
  language: English
  quote_policy: summarized
