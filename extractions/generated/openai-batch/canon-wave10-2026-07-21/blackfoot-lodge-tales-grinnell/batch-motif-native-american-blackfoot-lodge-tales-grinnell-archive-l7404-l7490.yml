canonical_text:
  quote: ''
  summary: 'The passage describes daily Blackfeet camp life in the buffalo days: children’s
    gendered work and play, hunters returning with game, feasting and social dances,
    nighttime telling of sacred stories under a daytime taboo enforced by Old Man,
    ceremonial society dances with animal-head masks and painted bodies, and procedures
    for moving camp before and after the use of horses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Girls begin duties early, including carrying wood and water, sewing moccasins,
    tanning robes and furs, making lodges and travois, while boys play at mimic warfare,
    hunt with bows and arrows, make mud animal images, swim, play winter games, and
    hunt rabbits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunters return after noon with game, and the camp becomes lively with feast
    invitations, singing, drumming, joking, war dances, and evening social dances.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Stories about the gods are rehearsed at night and are not to be told in daytime;
    Old Man is said to dislike daylight narration and to cause offenders to become
    blind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Storytellers use attitudes, gestures, and signs, and their audiences are described
    as spell-bound.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The stories are mostly about ancient gods and miraculous deeds, and are described
    as explanations of life phenomena with morals for youth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bands of the I-kun-iM-kah-tsi hold dances watched by the whole camp, using
    animal-head masks, brightly painted bodies, and unusual performances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When camp moves, women pack possessions, take down lodges, and load goods
    on ponies or travois; chiefs and the Brave band lead, while men ride ahead and
    to the sides to hunt or watch for enemies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before horses were obtained, dogs and men’s backs transported possessions,
    and the camp likely traveled only short distances.
  category: sequence
  evidence_refs:
  - ev:7
