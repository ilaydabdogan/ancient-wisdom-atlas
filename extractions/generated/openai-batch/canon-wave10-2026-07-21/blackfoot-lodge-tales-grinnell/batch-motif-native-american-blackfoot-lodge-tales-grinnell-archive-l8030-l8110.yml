canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of Blackfoot fire transport by
    horn and punk, the reestablishment of camp fires from carried embers, the harvesting
    of punk fungus from birch, the making and use of buffalo-paunch vessels, and reports
    concerning stone bowls and kettles, including a children’s elk song, Wolf Calf’s
    testimony, and a comparison with other regional stone vessels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A horn lined with moist rotten wood and closed with a wooden stopper was used
    to carry a live coal with punk placed on it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The punk smoldered inside the nearly air-tight horn, and the carrier checked
    it after two or three hours and added more punk if needed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a new camping ground, young men gathered wood piles; a fire-horn carrier
    put a spark on one pile, blew it into a blaze, and other fires were kindled from
    the first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After lodges were put up, women obtained coals from the camp fires to start
    fires in their lodges; the custom of borrowing coals is said to have persisted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The punk is identified as a fungus growing on birch trees; Indians gathered
    and dried it, and it was abundant at the Touchwood Hills on Beaver Creek.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Blackfeet made buckets, cups, basins, and dishes from buffalo paunch lining
    stretched over willow or cherry hoops, with seams sometimes pitched with gum or
    tallow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The buffalo-paunch buckets could hold several gallons, were flexible and flattenable
    for packing, and were often hung on a small tripod when full.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that hot contents could not be placed in the buffalo-paunch
    vessels.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says it is doubtful that the Blackfeet made pottery or basket
    ware, but says they made bowls and kettles of stone.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: An ancient children’s song is described in which a questioner asks an elk
    what its bowl or dish is, and the elk answers with a term glossed as stone bowl.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wolf Calf is cited as saying that in early days the Blackfeet sometimes boiled
    meat in a stone bowl made from hard clayey rock.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The described stone-bowl manufacture involved selecting a rock fragment, hollowing
