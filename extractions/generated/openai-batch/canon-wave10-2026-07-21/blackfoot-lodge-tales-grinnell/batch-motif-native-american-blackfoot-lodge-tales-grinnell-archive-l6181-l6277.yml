canonical_text:
  quote: ''
  summary: Old Man asks Wolf Chief to make him wolf-like, hunts with wolves, breaks
    a pemmican-making prohibition, kills a wolf, and is sent away with one companion.
    After warning the companion not to jump over water, the wolf companion violates
    the warning while chasing a moose to an island and is killed by Chief Bear and
    his brothers. A kingfisher tells Old Man what happened.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old Man sees Wolf Chief with many wolf children and asks to be made into a
    wolf so he can live and hunt as wolves do.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wolf Chief offers to rub Old Man's body so hair will cover him, but Old Man
    asks for hair only on his head, arms, and legs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wolf Chief assigns Old Man three companions distinguished by running ability
    and warns him to keep young wolves sheltered from wind; Old Man leads them to
    cold high buttes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the cold night, Old Man asks the wolves to cover him with their tails,
    angrily tells them to remove the tails, and later asks them again to cover him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A wolf making pemmican orders everyone to shut their eyes; Old Man looks and
    is struck on the nose with a round bone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Old Man then asks to make pemmican, makes the wolves shut their eyes, and
    kills the wolf who struck him by throwing the round bone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wolf Chief becomes angry about the killing and tells Old Man he cannot live
    with the wolves any longer, but may take one companion and hunt separately.
  category: speech
  evidence_refs:
  - ev:4
