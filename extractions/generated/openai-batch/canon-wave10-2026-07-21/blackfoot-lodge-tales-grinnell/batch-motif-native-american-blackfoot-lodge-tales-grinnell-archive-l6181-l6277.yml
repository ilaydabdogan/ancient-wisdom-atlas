  text: Old Man chooses the swift runner as his companion, and the two live and hunt
    together for a long time.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a bad dream, Old Man tells his wolf companion not to jump over any water
    while chasing game, even a little spring; the wolf promises.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: While chasing a moose, the wolf companion jumps a small stream onto an island
    and is caught by a bear in the brush.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The island is identified as the home of Chief Bear and his two brothers.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Old Man searches for the wolf and asks birds whether they have seen him; the
    birds say they have not.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A kingfisher tells Old Man that Chief Bear and his brothers killed and ate
