canonical_text:
  quote: ''
  summary: Old Man disguises himself first as a rotten tree and wounds Chief Bear
    and his brothers with arrows while they play. After learning from a frog that
    the arrows are near the bears' hearts and that the frog is seeking medicine, Old
    Man kills the frog, wears her hide, imitates her, returns to the island, and pushes
    the arrows into the bears' hearts. He then renders the bears' fat, calls animals
    to roll in it, and the passage explains why bears and rabbits have particular
    fatness.
  language: English
  quote_policy: summarized
