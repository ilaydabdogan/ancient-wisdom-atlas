canonical_text:
  quote: ''
  summary: After a brief Blackfoot etymological note, the passage continues the story
    of Bull Turns Round. Bull mourns for his father and tells an old man what his
    brother did to him. The old man gives Bull a piece of sinew whose use in fire
    will kill Bull's brother and his brother's wife, and also gives him buffalo, dogs,
    and lodge goods. Bull travels with his wives toward his father. They camp on a
    high butte near a starving camp, with many buffalo around them. The camp people
    fear the sight as supernatural. Armed men go up the hill; the buffalo move aside.
    Bull comes out, and the people recognize him as one they thought bears had killed.
    Wolf Tail greets him as brother and says he is not dead.
  language: English
  quote_policy: summarized
