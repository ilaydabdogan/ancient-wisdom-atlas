- id: obs:1
  text: The Snake man thinks the woman has strong medicine and Sun power, so he decides
    that her words should be obeyed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After smoking, the Snake man empties the pipe contents on the Piegan captive's
    breast, and the fire burns him badly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Piegan captive tells his wife that she cannot be a person and says he
    thinks she is a fearful animal changed to look like a woman.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman falsely reports that the captive wants boiling water poured on his
    head; heated water is poured on him, causing hair loss and peeling skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The captive asks his wife to pity him and let them kill him so he can join
    those already traveling to the Sand Hills.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman tells the Snake chief that the captive wants to be given to the
    Sun, and the Snake chief agrees this will happen before the camp moves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: An old woman living alone sees the torture, cries, feels pity for the captive,
    and prepares by tying her dog's mouth, hiding the dog, and placing food nearby.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: In the morning the people strip bark from a cottonwood tree, paint it black,
    tie the captive to it with many ropes, paint his face black, and the Snake chief
    prays and gives him to the Sun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old woman delays leaving by calling for her hidden dog; after the camp
    has gone, she frees the dog, cuts the captive's ropes, rubs his limbs, and gives
    him food.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The rescued man says he will go home and later return with the Piegans for
    revenge.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The rescued man asks the old woman to mark the trail taken by his wife if
    the camp separates and to place her lodge at the far end of the village; she agrees.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The man swims across a river, goes north, returns home, tells the whole story,
    and a large war party starts back toward the Snakes.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
