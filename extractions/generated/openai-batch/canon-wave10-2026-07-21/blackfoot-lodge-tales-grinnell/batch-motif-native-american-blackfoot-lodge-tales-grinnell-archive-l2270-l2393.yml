canonical_text:
  quote: ''
  summary: A Snake chief believes the captive Piegan man's wife has strong medicine
    or Sun power and follows her false reports of the captive's words, leading to
    torture by pipe fire and boiling water. The wife then says the captive wants to
    be given to the Sun. An old woman pities him, hides her dog and food as part of
    a delay, and after the camp moves she cuts him free. The rescued man plans revenge,
    returns north across a river to his people, tells what happened, and a large Piegan
    war party sets out.
  language: English
  quote_policy: summarized
