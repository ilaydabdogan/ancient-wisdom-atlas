canonical_text:
  quote: the whole world is the Sun's lodge
  summary: Old Man visits the Sun's lodge, sees the Sun's powerful hunting leggings,
    steals them twice, and cannot escape the Sun's lodge or sight. The Sun gives him
    the leggings, but when Old Man later uses them to hunt, their fire burns him and
    the leggings are destroyed in a river.
