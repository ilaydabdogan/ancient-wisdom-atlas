canonical_text:
  quote: ''
  summary: After the ghost woman accuses Heavy Collar of killing her and vows to find
    him anywhere, he flees through the night. He and his party separately travel toward
    the Belly River Buttes, their agreed meeting-place. The party sees Heavy Collar
    approaching with a woman, but after they descend into a ravine he emerges alone.
    Heavy Collar denies having a woman, realizes it must have been the ghost woman,
    and the young men find only his tracks in the soft dirt. The party then returns
    to the main camp.
  language: English
