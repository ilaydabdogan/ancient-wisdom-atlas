canonical_text:
  quote: ''
  summary: 'The passage concludes the Scarface story with feathers as a sign, a marriage,
    the first Medicine Lodge, long healthy life granted by the Sun, and peaceful death
    with shadows departing to the Sand Hills. It then begins the origin story of the
    Bull Band: a hungry people cannot make buffalo jump into a pis''kun; a young woman
    jokingly promises to marry a buffalo if they jump; a bull claims her; her father
    searches for her with help from a magpie; the bull discovers a nearby person,
    the buffalo kill the father, and the bull offers release if the woman can restore
    her father to life. She asks the magpie to find a remnant, and it brings back
    a joint of the backbone.'
  language: English
  quote_policy: summarized
