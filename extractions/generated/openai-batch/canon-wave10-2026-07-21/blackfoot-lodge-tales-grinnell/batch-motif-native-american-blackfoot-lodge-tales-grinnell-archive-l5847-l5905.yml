canonical_text:
  quote: ''
  summary: Old Man, also called the Maker of the people in the passage, teaches the
    first poor and naked people what plants, bark, animals, birds, and herbs can be
    used for food or medicine. Buffalo, described as armed black animals with long
    beards, kill and eat unarmed people. Seeing his created children dead, the Maker
    decides that people shall eat buffalo. He makes a bow and arrows from wood, bird
    feathers, and flint, determines that three feathers work better than four, and
    instructs the people to use the weapons rather than flee from buffalo.
  language: English
  quote_policy: summarized
