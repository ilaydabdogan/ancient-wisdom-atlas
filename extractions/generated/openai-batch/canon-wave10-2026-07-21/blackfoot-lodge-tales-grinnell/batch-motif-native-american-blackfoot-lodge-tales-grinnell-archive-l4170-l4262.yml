canonical_text:
  quote: ''
  summary: A young woman agrees to marry the poor young man Scarface but says the
    Sun has claimed her and forbidden her to marry. She tells Scarface to go to the
    Sun, ask permission, and have the scar removed from his face as a sign. Scarface
    obtains moccasins and food from a kind old woman, leaves camp alone, prays to
    the Sun, travels across prairies, rivers, and mountains, and asks a wolf and then
    a bear about the Sun's lodge; each animal directs him onward.
  language: English
  quote_policy: summarized
