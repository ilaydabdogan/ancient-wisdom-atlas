canonical_text:
  quote: ''
  summary: 'The passage closes the Lost Children narrative: the brother and sister
    recall prior mistreatment, summon the camp to a place of abundance, reward the
    old woman and dog, punish the chief and parents, and the brother is made chief.
    It then begins the Mik-a''pi narrative: Pikun''i hunters are ambushed by Snakes,
    Fox-eye is killed and scalped after refusing to flee, his widows mourn without
    kin to avenge them, and Mik-a''pi sends for them after hearing their laments.'
  language: English
  quote_policy: summarized
