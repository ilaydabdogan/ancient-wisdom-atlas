canonical_text:
  quote: ''
  summary: A boy tells his sister that he has dreamed and asks her to help build a
    pis'kun. He instructs her not to look when the buffalo come, but to keep her head
    covered and face to the ground until he throws kidney to her. She looks twice,
    first from curiosity and hunger and then from fear, but succeeds the third time.
    The siblings obtain meat from a fat cow, butcher and cook it, and are satisfied.
    The boy becomes a great hunter, the girl dresses hides and makes a lodge, and
    the boy paints it with animal and bird figures. Later a starving hunter comes
    to the lone lodge, is fed, and tells that game has left his people; the girl recognizes
    him as belonging to her camp.
  language: English
  quote_policy: summarized
