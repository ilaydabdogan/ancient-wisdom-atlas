canonical_text:
  quote: ''
  summary: A brave, wealthy man devoted to his single wife reluctantly agrees to take
    her and other women out to gather berries despite danger from enemies. He watches
    from a butte and signals when a war party appears. The older women on slow horses
    are overtaken and killed. The wife’s horse tires, and she rides behind her husband,
    slowing his horse and preventing him from using his bow. He urges her to get off,
    saying the enemies will take rather than kill her and that he will later rescue
    her; she refuses and says they should die together. He throws her off. The enemy
    takes her, while he escapes. Back at camp there is mourning, including hair-cutting,
    and the man mourns his separation from his wife and paints himself black.
  language: English
  quote_policy: summarized
