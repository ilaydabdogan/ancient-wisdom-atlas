canonical_text:
  quote: ''
  summary: Old Man sees a bird detach and restore its eyes by making different noises.
    The bird teaches him the trick but warns him not to do it more than three times
    a day. Old Man exceeds the limit, loses the ability to call his eyes back, wanders
    blind, and is mocked by a wolf using foul-smelling buffalo meat. Old Man catches
    the wolf, takes one of its eyes for himself, regains sight, finds his own eyes,
    and can never again perform the bird's trick.
