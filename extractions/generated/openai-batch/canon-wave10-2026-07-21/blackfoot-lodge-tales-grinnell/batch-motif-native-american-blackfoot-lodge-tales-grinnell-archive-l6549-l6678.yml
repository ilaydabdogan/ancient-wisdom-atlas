canonical_text:
  quote: ''
  summary: After a successful buffalo drive, Old Man enters the lodge of three poor
    widows, complains about their poor food, and promises to kill a fat cow for them.
    While the camp is away at the pis'kun, he secretly injures the chief's sleeping
    daughter with buffalo gall, demands payment as a doctor, rejects offers of weapons
    and a white buffalo robe, accepts the proposed gift of a widow woman, and then
    kills the child while pretending to cure her. He hides by feigning illness. The
    mother discovers the dead child, the people search unsuccessfully, and the father
    announces that every man must jump across a creek to identify the killer.
  language: English
  quote_policy: summarized
