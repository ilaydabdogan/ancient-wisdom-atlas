canonical_text:
  quote: ''
  summary: 'Opening of “The Lost Children”: a small camp is beside a river. Eleven
    children cross the river to play; conflict arises when the younger daughter of
    the chief wants the best stones and is teased. She and her sister return to camp,
    report the matter to their father, and the angry chief orders the camp to move
    away and leave the other children behind, threatening death for the children or
    any parents who shelter them.'
