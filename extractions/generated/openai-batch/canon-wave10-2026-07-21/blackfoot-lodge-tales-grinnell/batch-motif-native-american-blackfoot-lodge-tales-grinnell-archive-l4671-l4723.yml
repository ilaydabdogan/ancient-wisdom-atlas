canonical_text:
  quote: ''
  summary: A woman covers her father's body with a robe and sings until he breathes
    and stands. Her bull husband says the buffalo have seen strange things, acknowledges
    that the father had been trampled to death and is alive again, and teaches the
    dance, song, and medicine of the Bulls. The man and daughter return to the people,
    and selected young men are taught, marking the beginning of the I-kun-uh'-kah-tsi.
    A following section begins with famine after buffalo disappear; a man with his
    household decides to move toward the mountains for food, and the family travels
    weak and hungry in winter.
  language: English
  quote_policy: summarized
