canonical_text:
  quote: ''
  summary: 'The passage describes Blackfeet marital and household organization: reported
    changes in marriage age before and after horses, the status of the first wife,
    polygyny and wealth, divorce by return to the wife''s parents and repayment, widow
    and property succession after a man''s death, and a Cree label for Blackfeet women
    with competing explanations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wolf Calf is cited as reporting that, before horses, young men generally did
    not expect to marry until about thirty-five to forty, while young women married
    when grown; the passage contrasts this with later fathers selling daughters as
    wives while still children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first wife is called the man's "sits-beside-him wife," has authority over
    the other wives, sits on his right-hand side in the lodge, and may take a whiff
    from the pipe and join conversation at informal gatherings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other wives sit near the doorway and carry out work directed by the first
    wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that in earlier times many men had several wives, and that
    a man with many horses and wives was considered richer because young men could
    hunt for him using his mounts and wives would tan robes and furs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man could end a marriage by sending the woman back to her parents and demanding
    the price paid for her; the woman could marry again if her parents agreed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When a man died, his wives became potential wives of his oldest brother; unless
    property had been given to them outright, they did not inherit his possessions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A deceased man's property passed first to his sons, with some horses given
    to brothers; if he had no sons it passed to brothers, and if there were no brothers
    to nearest male relatives on the father's side.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the Blackfeet were not slave-holders, but reports that Crees
    call Blackfeet women "Little Slaves" and gives alternative explanations for the
    label, including origin region or treatment of women.
  category: speech
  evidence_refs:
  - ev:6
