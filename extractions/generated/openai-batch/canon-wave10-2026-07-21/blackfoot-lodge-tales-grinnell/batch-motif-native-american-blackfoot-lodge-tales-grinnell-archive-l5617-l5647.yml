canonical_text:
  quote: ''
  summary: After returning mysterious medicines to an old woman and becoming fully
    a person again, the man and his wife approach camp. The wife orders a separate
    lodge and sweat house to be built. The couple sweat, enter the lodge, burn sweet
    grass, and purify their clothing and the Worm Pipe. The man tells relatives that
    the Worm Pipe was given to him by his ghost father-in-law, explaining how the
    people came to possess it. Later, when the man makes as if to strike his wife
    with a firebrand, she vanishes forever.
  language: English
  quote_policy: summarized
