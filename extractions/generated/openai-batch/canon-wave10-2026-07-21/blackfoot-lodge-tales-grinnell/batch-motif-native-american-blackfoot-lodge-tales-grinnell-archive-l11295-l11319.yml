canonical_text:
  quote: ''
  summary: The passage states that owls are believed to be ghosts of medicine men.
    It describes the Blackfeet view of the Sand Hills afterlife as a shadowy, monotonous
    mimicry of earthly life, where the dead live in shadow lodges, hunt shadow buffalo,
    and fight shadow enemies. It also says the Blackfeet are attached to life but
    accept death calmly when it comes.
