canonical_text:
  quote: ''
  summary: The passage describes Blackfoot lodge construction, ventilation, decoration,
    interior seating and rank etiquette, materials and manufacture of bows, arrows,
    stone and bone tools, and practices for obtaining, adopting tools for, and carrying
    fire. It notes that the narrator had heard no Blackfeet explanation for the origin
    of fire.
