- id: obs:4
  text: The interior space is partitioned into couches, with willow-twig mats on tripods
    forming inverted-V storage spaces between couches.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lodge owner occupies the back couch opposite the doorway; wives and daughters
    sit on his right, while sons and visitors sit on his left.
