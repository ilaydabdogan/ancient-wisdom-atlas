literal_observations:
- id: obs:1
  text: The lodge covering is fastened near the ground, and an inner painted cowskin
    lining leaves an air space that creates a draft to help remove smoke.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The door is covered by a skin flap, and buffalo robes and firewood are described
    as making the lodge comfortable in cold weather.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The outside of the lodge could be decorated with buffalo tails and brightly
    painted animal pictures.
  category: attribute
  evidence_refs:
