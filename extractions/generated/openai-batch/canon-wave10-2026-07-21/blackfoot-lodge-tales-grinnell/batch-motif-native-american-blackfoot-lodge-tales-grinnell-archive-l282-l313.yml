  quote: ''
  summary: The passage is an editorial introduction condemning United States dealings
    with Native peoples as unjust, fraudulent, and continuing into the present. It
    describes protests against such treatment and gives an example in which government
    commissioners allegedly used threats, bribes to chiefs, and fraudulent votes to
    claim that a tribe had consented to sell its lands and relocate to arid allotments.
    It also mentions a similar recent case involving the Southern Utes.
