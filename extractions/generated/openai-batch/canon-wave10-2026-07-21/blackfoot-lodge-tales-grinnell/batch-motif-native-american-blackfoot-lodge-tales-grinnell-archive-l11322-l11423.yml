canonical_text:
  quote: ''
  summary: The passage describes Blackfoot medicine men, sacred medicine pipe stems
    said to have been given by the Sun, their storage and ritual restrictions, and
    a spring ceremony after the first thunder in which a medicine man and guests offer
    berries, pipe smoke, and prayers to Sun, Thunder, Old Man, Above Animals, and
    Above People for rain, food, health, long life, victory, and survival.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blackfoot term for the person called a medicine man by whites is given
    as Ni-tiamp'-skan or Ni-namp'-skan, with an etymological explanation proposed
    by Schultz and Thomas Bird but not known among Blackfeet generally.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicine pipes are described as long pipe stems decorated with bright-colored
    feathers and fur from weasels and other animals.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pipe stems are said to have been given to the people long ago by the Sun,
    and their owners are regarded as specially favored by him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When not in use, the stems were kept bundled in tanned fur together with tobacco,
    a sacred whistle, two sacred rattles, dried sweet grass, and sweet pine needles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sacred bundles were hung outside behind owners' lodges on tripods in daytime
    pleasant weather and suspended inside above the owners' seat at night.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage states restrictions around the lodge and bundle: walking completely
    around a medicine man''s lodge brought bad luck; no one could pass between the
    fireplace and pipe stem; only the medicine man and his head wife could move or
    unroll the bundle.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The medicine man and his wife were required to keep their faces, hands, and
    clothing painted with dull red paint made by burning a certain clay from the bad
    lands.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The medicine man is described as appearing to be a priest of the Sun, and
    prayers offered through him are considered specially favored.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sacred stem is unrolled for the sick, for people undertaking dangerous
    expeditions such as war parties, and for prayers concerning public health, prosperity,
    food supply, and healing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Thunder is believed to bring spring rain, and rain is said to make berries
    grow.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the first spring thunder, every medicine man is expected to give a feast
    and offer prayers for a large berry crop.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At one observed feast, the pipe stem had been unrolled, cooked sarvis berries
    were set before guests, and each guest rubbed some berries into the ground before
    eating while speaking a prayer to the Above People.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the meal, a black stone pipe bowl was fitted to the medicine stem, and
    the medicine man held it aloft while addressing Sun, Thunder, Old Man, Above Animals,
    and Above People.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The medicine man's prayer asks for pity, smoke of the sacred pipe, rain in
    summer, large and sweet berries, long life, complete lives, victory over enemies,
    help in battle, and survival.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: During the ceremony, a storm came up and thunder sounded overhead; the medicine
    man interpreted this as a sign that the thunder heard the ceremony.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The people responded emotionally by clasping their arms over their breasts
    and repeatedly asking for pity, good, and survival.
  category: action
  evidence_refs:
  - ev:13
