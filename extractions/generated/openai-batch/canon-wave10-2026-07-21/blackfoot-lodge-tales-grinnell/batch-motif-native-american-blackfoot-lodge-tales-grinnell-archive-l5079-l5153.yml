canonical_text:
  quote: ''
  summary: The passage introduces the story of the Beaver Medicine by describing an
    earlier peaceful time, a friendly form of counting coup, and a custom in which
    young women danced in the clothing of men they loved and claimed their deeds.
    It then introduces a chief with wives, the poor young man Api-kunni, and Api-kunni's
    secret mutual love with the chief's youngest wife. When she chooses to dance,
    she goes to Api-kunni for dress; he protests the risk of revealing their secret
    and his lack of war deeds, then reluctantly paints and outfits her and begins
    to instruct her what to say.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is set in an earlier time when tribes were at peace, did not kill
    each other, and lacked guns and horses.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When two tribes met, head chiefs took sticks, touched each other, and treated
    this as counting coup in a friendly rather than hostile ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Young men who visited strange camps returned home and told loved girls that
    they had counted coup on another tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After such returns, young women danced wearing clothing like that of the men
    they loved and verbally claimed the deeds those men had done.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A chief in the camp had three pretty wives and asked them at dance times whether
    they had lovers for whom they wished to count coup.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The wives initially answered that they did not wish to join the dance and
    had no lovers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Api-kunni is described as a poor young man with no relations, no one to tan
    robes or furs for him, and ragged clothing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Api-kunni loved the chief's youngest wife, and she loved him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The girl's parents were not rich and gave her to the chief rather than to
    Api-kunni when the chief wanted her as a wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Api-kunni and the girl sometimes met secretly; he cautioned her not to tell
    anyone, and she promised not to let it be known.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: At a later dance call, two wives declined to dance, but the third wife said
    she thought she would go and dance.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The chief told the third wife that her lover would surely dress her for the
    dance.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The girl went to Api-kunni in an old woman's poorly furnished lodge and asked
    him to dress her for the dance.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Api-kunni said she had wronged him by coming there and by going to the dance
    because he had told her to keep their relationship secret.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Api-kunni said he had never been to war and had never counted any coups, and
    warned that she would have nothing to say and would be laughed at.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: When she still wanted to go, Api-kunni painted her forehead with red clay,
    tied a goose skin around her head, lent her his badly tanned robe, and began telling
    her what to say when her turn came to speak.
  category: action
  evidence_refs:
  - ev:12
