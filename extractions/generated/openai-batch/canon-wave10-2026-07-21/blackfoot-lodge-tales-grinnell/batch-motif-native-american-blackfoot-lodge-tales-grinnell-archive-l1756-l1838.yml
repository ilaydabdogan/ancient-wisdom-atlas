canonical_text:
  quote: ''
  summary: Kut-o'-yis helps an old man confront a hostile son-in-law, kills the son-in-law
    and two women associated with him, gives the old people access to food and lodging,
    then journeys to a pis'kun camp. There he learns that a bear chief and his family
    monopolize the best meat. Kut-o'-yis helps two old women obtain and display fat
    meat, confronts the bear family when they try to take it, kills the bears, and
    spares one little female bear to breed more bears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kut-o'-yis hides behind a buffalo carcass and instructs the old man to threaten
    the son-in-law.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son-in-law shoots at the old man, the old man returns fire under Kut-o'-yis's
    direction, and they shoot at each other four times before the old man asks Kut-o'-yis
    for help.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son-in-law claims that he has always pitied and cared for the old man,
    but Kut-o'-yis calls this false and kills him with four shots.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kut-o'-yis has the old man bring down the daughter who had treated him badly,
    kills her, kills the younger woman after she says she loves her husband, and tells
    the old people to live in the lodge where there is food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kut-o'-yis says he will make a journey and asks where people are; the old
    man directs him toward Badger Creek and Two Medicine, where the pis'kun is.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the pis'kun camp, Kut-o'-yis sees many lodges, including a large central
    lodge painted with a bear figure, but enters a small lodge where two old women
    live.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The two old women give Kut-o'-yis lean dried meat and belly fat and explain
    that the big bear chief and his family take the desirable fat meat for themselves.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kut-o'-yis tells the old women to prepare a dog travois, kills a cow that
    looks scabby but is fat, helps butcher it, and tells the women to hang up the
    choice fat pieces where the bear lodge will notice them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief bear sends a young bear to find choice back fat; the young bear
    tries to take the old women's meat, and Kut-o'-yis strikes him with a stick.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bear family rushes angrily toward the old women's lodge, and Kut-o'-yis
    kills them all except one little female child bear, whom he allows to go and breed
    bears.
  category: sequence
  evidence_refs:
  - ev:7
