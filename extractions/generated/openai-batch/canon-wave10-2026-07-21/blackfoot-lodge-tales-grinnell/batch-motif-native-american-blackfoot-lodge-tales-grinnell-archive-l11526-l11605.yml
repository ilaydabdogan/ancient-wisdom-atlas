canonical_text:
  quote: ''
  summary: The passage describes a Blackfoot medicine-pipe healing ceremony for a
    sick woman, including prayers to sacred beings, pipe songs, smoke, dancing, rattles,
    and shared guest prayers. It then explains causes of disease as evil spirits or
    certain animals, describes treatments for ailments, and gives an account of the
    sweat lodge as a curative and religious practice using heat, steam, prayers, songs,
    and pipes smoked to the Sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prayer asks the Sun, Old Man, Above People, and Under Water People to pity
    the people, let them survive, and give the sick daughter a complete life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the prayer, all the people utter a loud response glossed as taking the
    words to their hearts, and they begin the pipe song.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The medicine woman passes the medicine pipe stem over different parts of the
    sick woman's body and then leaves the lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The medicine man blows four whiffs of smoke toward the sky, four toward the
    ground, and four on the medicine pipe stem, then prays for pity and long life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Drums and a war song accompany an old man with rattles who dances four times
    to the doorway and back; the passage identifies this as the medicine pipe dance,
    restricted to pipe-owners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The pipe stem is passed among guests, each of whom holds it aloft and makes
    a short prayer; examples include prayers for children's health and war success.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Disease among the Blackfeet is said to be caused by evil spirits, usually
    ghosts of enemies slain in battle, who shoot invisible arrows into people at night.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mice, frogs, snakes, and tailed batrachians are said to cause disease among
    women and are therefore to be shunned and not handled.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: External ailments are treated with lotions or poultices made from roots or
    herbs; rheumatic pains may be treated with the sweat lodge, hot rocks, or cautery
    using prickly pear thorns set on fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The sweat lodge is described as a curative and religious structure shaped
    like a rough hemisphere, framed with willow branches, covered with cow-skins and
    robes, and furnished with a central hole for red-hot stones.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the sweat lodge rite, participants enter without clothing, hot rocks are
    brought from the outside fire, coverings are lowered, prayer is made to the Sun,
    water is sprinkled on the rocks, steam rises, songs are chanted, and pipes are
    smoked to the Sun.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The supplied excerpt ends with the statement that the sweat lodge is built
    to represent the Sun's own lodge, but the sentence is truncated.
  category: relationship
  evidence_refs:
  - ev:11
