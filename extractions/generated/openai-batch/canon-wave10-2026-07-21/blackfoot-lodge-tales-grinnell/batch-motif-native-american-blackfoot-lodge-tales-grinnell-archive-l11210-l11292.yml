canonical_text:
  quote: ''
  summary: The passage first recounts Old Man setting a test at the water's edge in
    which a floating or sinking object will determine whether a woman's child and
    all people will live forever or die. After the stone is chosen and sinks, mortality
    is established. The passage then summarizes Blackfeet beliefs about the soul as
    shadow, the Sand Hills as the place of good deceased Blackfeet, wicked dead as
    harmful ghosts, fire as protection from entering ghosts, ghosts walking above
    the ground, and an anecdote in which Young Bear Chief hears an unseen guiding
    voice in fog and concludes it was a ghost. It ends by noting a belief that a dead
    person's soul may reside in an animal body.
  language: English
  quote_policy: summarized
