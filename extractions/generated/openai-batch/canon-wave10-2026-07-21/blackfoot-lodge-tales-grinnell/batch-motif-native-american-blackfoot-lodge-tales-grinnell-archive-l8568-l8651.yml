canonical_text:
  quote: ''
  summary: 'The passage describes Blackfoot social rules and practices surrounding
    marriage: exogamy within the gens, later changes in gens membership, expectations
    that a prospective husband prove bravery and acquire property, parental and kin
    negotiation of marriages, provisioning of the bride with lodge and clothing, and
    the prospective bride''s repeated preparation and delivery of choice food to the
    prospective husband before marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of a gens were treated as relatives, and a man was formerly prohibited
    from marrying within his gens.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In more recent practice, families could leave one gens or band and join another;
    outsiders and their descendants could become members and marry within that gens.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before marriage, a young man was generally expected to have completed successful
    war expeditions, proving bravery and gaining horses and other property.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The acquired horses and property were said to enable the young man to buy
    the woman of his choice and support her afterward.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Marriages usually occurred through the actions of parents, though the young
    man might prompt his parents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A girl's father could propose a particular young man as husband for his daughter
    to the young man's father.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the described arrangement, the bride's father consults close relations
    and principal men before sending a messenger to the young man's father.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young man's father consults his close relations and sends acceptance if
    the match is satisfactory.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After acceptance, the girl's relations prepare her with the best goods they
    can provide.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The girl's mother makes a new cowskin lodge with poles, lining, and back rests.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bride's clothing and goods may include an antelope-skin dress, beaded
    deer-skin leggings, an elk-skin summer blanket, and deer-skin moccasins.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Between proposal and marriage, the young woman cooks choice food and carries
    it to the young man's lodge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The young man eats some of the food; if any remains, the young woman offers
    it to his mother, then returns to her father's lodge.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The food delivery is described as occurring three times a day until the marriage
    takes place.
  category: sequence
  evidence_refs:
  - ev:7
