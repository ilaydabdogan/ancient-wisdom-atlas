canonical_text:
  quote: ''
  summary: The Sun instructs Scarface about the Medicine Lodge, heals his facial scar
    with powerful medicine, and gives him two raven feathers as a sign connected with
    the girl and the husband of the woman who builds the Medicine Lodge. Morning Star
    and the Sun give him presents; the Moon kisses him and calls him son. The Sun
    shows him the Wolf Road, identified as the Milky Way, by which he returns to the
    ground. In camp, a generous chief notices a wrapped stranger sitting all day on
    a butte and sends young men to invite him. The stranger reveals himself as Scarface,
    now richly equipped and without his scar, and gives the raven feathers to the
    young woman.
  language: English
  quote_policy: summarized
