canonical_text:
  quote: ''
  summary: A poor Piegan man guides his party back toward the camp connected with
    his earlier torture. Scouts find a forked trail marked by a willow twig. The man
    goes ahead at night to consult an old woman he trusts, learns that his wife is
    now chief and believed to have strong medicine, and tells the old woman to move
    her kin into the brush under the pretense of a dream. Late that night warriors
    surround and attack the sleeping Snake camp.
  language: English
  quote_policy: summarized
