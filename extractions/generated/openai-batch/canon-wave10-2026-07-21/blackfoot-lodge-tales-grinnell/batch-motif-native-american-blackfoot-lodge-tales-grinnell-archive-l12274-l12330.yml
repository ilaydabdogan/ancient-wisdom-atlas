canonical_text:
  quote: ''
  summary: The passage describes the contemporary Blackfeet as adapting to changed
    conditions by undertaking ranching and other forms of labor. The narrator attributes
    their recent progress partly to the hardship of the starvation winter and partly
    to encouragement from a trusted helper who advises them and seeks to aid them
    with the government. The passage concludes that with help, instruction, and encouragement,
    the Blackfoot man will become self-supporting.
