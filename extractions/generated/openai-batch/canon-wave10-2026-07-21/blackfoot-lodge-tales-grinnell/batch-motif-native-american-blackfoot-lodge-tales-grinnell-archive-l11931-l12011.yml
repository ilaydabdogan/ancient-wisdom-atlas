canonical_text:
  quote: ''
  summary: The passage describes a famine among the Blackfeet/Piegan in which Major
    Allen found almost no food in visited lodges, issued reduced rations, received
    desperate appeals from mothers, women, and chiefs, and waited for delayed supplies
    that eventually brought partial relief. It reports heavy mortality, later illness
    associated with a shift from portable lodges to permanent dwellings, and criticism
    of negligent or exploitative agents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Major Allen visited twenty-three lodges and found food in only two: a rabbit
    cooking for a starving child and a steer hoof cooking for soup.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Major Allen said he broke down emotionally because of the misery he saw and
    his inability to relieve it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Major Allen was issuing one-seventh rations while Indians crowded around agency
    buildings and begged for food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mothers held up starving babies at the windows, displaying their pallid faces,
    shrunken limbs, and visible bones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women brought young daughters to white men and offered them if the men would
    feed them enough to prevent death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A deputation of chiefs asked Major Allen to give them the food in the storehouses
    so the people could eat once, be filled, and die content.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Major Allen showed the chiefs the storehouse inventory and said immediate
