canonical_text:
  quote: ''
  summary: Rupe asks Rehua whether voices from the world below have reached him. After
    hearing of Motu-tapu, Rupe transforms into a pigeon, flies down to Tinirau’s house,
    escapes attempts to spear or snare him, and is recognized by his sister Hinauri.
    Rupe and Hinauri exchange formal greetings; he then takes her and her newborn
    child upward to Rehua, carrying the placenta, which falls into the sea and is
    eaten by a shark, explaining large eggs in sharks. At Rehua’s dwelling, Rupe cleans
    and purifies the neglected courtyard with named wooden shovels and adds a building;
    a faulty beam kills Rehua’s son Kaitangata, whose blood stains the sky red. The
    passage notes that Rupe was previously named Maui-mua. A new section begins in
    which Tinirau seeks the magician Kae to perform rites over the infant Tuburuhuru;
    Tinirau feeds Kae flesh from his tamed whale Tutunui.
  language: English
  quote_policy: summarized
