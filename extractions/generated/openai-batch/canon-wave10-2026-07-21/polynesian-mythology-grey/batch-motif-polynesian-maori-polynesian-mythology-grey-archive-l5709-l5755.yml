canonical_text:
  quote: ''
  summary: 'The passage closes the Manaia episode by describing warriors crossing
    by canoe to an island and finding Manaia’s host dead, then reflects that the curse
    was avenged and that the burning of the Arawa canoe by Raumati led to the war.
    It then begins the Hatupatu legend: leaders and followers move to named regions,
    and Ha-nui, Ha-roa, and Hatupatu go bird-snaring for months. Hatupatu, the little
    brother, feels deprived because the others give him only lean, tough birds while
    keeping the better food, and he cries while eating beside the fire.'
  language: English
  quote_policy: summarized
