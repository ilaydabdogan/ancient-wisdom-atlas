canonical_text:
  quote: ''
  summary: Maui obtains fire from an aged fire ancestress by repeatedly asking for
    new flames after extinguishing each gift. Her final toenail becomes a pursuing
    conflagration; Maui escapes by transforming into an eagle and calling ancestral
    powers for rain. Mahuika preserves remaining sparks in certain trees, explaining
    human fire-making from wood. Maui is rebuked by his parents but remains defiant.
    A new episode begins with Maui, his sister Hinauri, and her husband Irawaru; Maui
    and Irawaru fish together and dispute a catch after their lines entangle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The aged woman questions the visitor about his place of origin, recognizes
    him as her grandchild, and hears that he has come to beg fire from her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The aged woman pulls out a nail, fire flows from it, and she gives the fire
    to Maui.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maui repeatedly extinguishes each fire he receives and returns to ask for
    another until the aged woman has removed nearly all the nails of her fingers and
    feet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The aged woman concludes that Maui is playing tricks on her, pulls out the
    remaining toenail, and its fire causes the whole place to catch fire.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Maui flees the pursuing fire, changes himself into a fleet-winged eagle, plunges
    into water, and finds the water nearly boiling while forests, earth, and sea also
    catch fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maui calls on Tawhiri-ma-tea and Whatitiri-matakataka for water; squalls,
    gales, and heavy rain appear and quench the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the fire is entirely lost, Mahuika saves sparks by throwing them into
    the Kaikomako and other trees, which humans later use as fire-producing wood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Maui's mother and father rebuke him for playing tricks with his ancestress,
    and his father warns him about living or dying; Maui replies that he intends to
    continue his perverse proceedings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Maui has a beautiful young sister named Hinauri, who is married to Irawaru.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Maui and Irawaru go to the sea to fish; Maui catches no fish with his barbless
    hook while Irawaru catches many.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Their fishing lines become entangled, they argue over whose hook has the fish,
    and the fish is found to be on Irawaru's hook.
  category: sequence
  evidence_refs:
  - ev:7
