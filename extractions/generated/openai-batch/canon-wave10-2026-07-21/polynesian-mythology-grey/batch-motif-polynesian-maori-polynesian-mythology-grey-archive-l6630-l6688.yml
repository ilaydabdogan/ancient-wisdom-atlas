canonical_text:
  quote: ''
  summary: 'During Turi''s sea voyage, Tuau laments being carried away from his wife
    and children. At dawn Tapo disobeys Turi and is thrown into the sea, but his light-hearted
    appeal leads the party to recognize the protection of the god Maru, and Tapo is
    rescued. Later the canoe leaks; the voyagers bail water while Turi recites an
    anti-swamping incantation, then land on the mid-ocean island Rangitahua and repair
    the canoe. Porua and his canoe Te Ririno are present. The voyagers kill two named
    dogs: one is cooked and shared, and the other is cut raw as an offering to the
    gods, with a sacred place, pillars for spirits, and an enchanted apron used while
    they call for an omen about the future. The passage ends mid-request.'
  language: English
  quote_policy: summarized
