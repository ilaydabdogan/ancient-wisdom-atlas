canonical_text:
  quote: ''
  summary: The passage recounts Manaia returning by canoe to his village after knowing
    that his wife had been mistreated. His wife prepares fire and fern-root for him,
    makes signs about what happened, and fetches a single fish with a hook in its
    tail from the canoe; Manaia says this shows he already knew. He then plans revenge
    with his tribe, deceives the wrongdoers into making heavy spears, and lies in
    ambush. His son Tu-ure-nui is afraid to attack, while another young man kills
    the first enemy and declares himself Kahu-kaka-m^i, son of Manaia.
  language: English
  quote_policy: summarized
