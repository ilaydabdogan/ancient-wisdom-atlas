canonical_text:
  quote: ''
  summary: Hatupatu, left behind while his brothers snare birds, steals and eats stored
    preserved birds, stages signs of an attack, and deceives his brothers. After repeated
    thefts, his brothers catch and kill him, burying him in a heap of feathers. His
    parents send a flag-shaped spirit, Tamumu-ki-te-rangi, which finds him, performs
    enchantments, and restores him to life. Hatupatu then encounters a bird-like woman
    who spears birds with her lips, catches him, takes him to her cave, feeds him
    raw food, and leaves daily to catch birds while he cooks for himself and plans
    to run off with her possessions.
  language: English
  quote_policy: summarized
