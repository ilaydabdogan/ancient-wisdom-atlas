canonical_text:
  quote: ''
  summary: After a formal peace-making farewell involving reciprocal gifts of jade
    mere, Te Ponga and his followers depart from the fortress. Puhihuia follows with
    village girls, then runs away toward Te Ponga despite her father's call to return.
    The party flees to Manuka harbour, escapes by canoe, and the pursuers are unable
    to use another canoe because its lashings have been cut.
  language: English
