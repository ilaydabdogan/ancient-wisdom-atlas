canonical_text:
  quote: ''
  summary: Whakatau reviews warriors by having them attempt to cross a creek; his
    chosen band succeeds. He announces a night voyage to avoid detection and preserve
    surprise. At dark he orders his chosen men to remove plugs from all canoes except
    their own, causing the other crews' canoes to sink after launch. Whakatau's band
    proceeds alone, lands near the house called Uru-o-Manono, surrounds and guards
    it, captures Hioi outside, and questions him about the whereabouts of Whakatau's
    sister and Poporokewa.
  language: English
  quote_policy: summarized
