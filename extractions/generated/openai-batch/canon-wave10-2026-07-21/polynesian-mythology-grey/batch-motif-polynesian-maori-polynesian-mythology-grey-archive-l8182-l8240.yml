  quote: ''
  summary: Te Kahureremoa and her slave-girl travel by way of Wairoa and the mountains
    of Otawa. At Wairoa they are greeted and refreshed. In the forest at Otawa they
    encounter Takakopiri, a young chief spearing pigeons from a berry-covered tree.
    The slave-girl recognizes him as he descends, and says he is the chief who caused
    them to travel so far.
