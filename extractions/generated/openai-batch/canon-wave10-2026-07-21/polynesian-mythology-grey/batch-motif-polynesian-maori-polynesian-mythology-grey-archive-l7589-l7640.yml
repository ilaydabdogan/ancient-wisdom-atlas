canonical_text:
  quote: ''
  summary: Hotunui is accused of stealing sweet potatoes after his footprints obscure
    those of a thief. Ashamed, he leaves his pregnant wife, gives instructions for
    naming the unborn child after an unplanted cultivation, and settles in Hauraki,
    where he becomes a chief and has another child. When Maru-tuahu grows up, he asks
    his mother where his father lives, learns to look toward Hauraki, and travels
    there with a slave, hunting birds for food. Near Kohukohunui he is in a tree spearing
    Tui birds when two daughters of Te Whatu encounter his slave and cloak on the
    path.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sweet potatoes were dropped along the path taken by a thief, and Hotunui's
    large footprints erased the thief's footprints, leading others to accuse Hotunui
    of theft.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the time of the accusation, Hotunui's wife had conceived Maru-tuahu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hotunui was overcome by shame at the accusation and decided to leave his wife
    and go to Hauraki for another residence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before leaving, Hotunui told his wife to name the child Maru-tuahu if male
    or Pare-tuahu if female, connecting either name with a field prepared for planting
    but left unused.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hotunui went to Hauraki, lived at Whakatiwai, became chief of the people there,
    took another wife, and had a child named Paka.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Maru-tuahu reached adulthood, he took up his club and asked his mother
    to show him the mountain range near his father's home; she directed him toward
    the place of sunrise and identified it as Hauraki.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Maru-tuahu started toward Hauraki with his slave, carrying a bird spear for
    food on the journey through wooded mountains, and took about a month to reach
    Kohukohunui.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Near the forest outskirts, two daughters of Te Whatu came along the same path
    while Maru-tuahu was in a tree spearing Tui birds; they saw his slave sitting
    under the tree and his master's cloak on the ground.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The younger daughter of Te Whatu is described as very beautiful, while the
    elder is described as plain; the younger playfully said the man she saw would
    make a nice slave for her.
  category: speech
  evidence_refs:
  - ev:6
