canonical_text:
  quote: ''
  summary: Rata uses the incantation Titikura to restore his slain warriors, who return
    to battle and help slaughter the Ponaturi. After avenging his father, Rata’s canoe
    is hauled ashore and roofed. Rata marries Tongarautawhiri, whose son Tuwhakararo
    later marries Apakura. Whakatau comes into being in a non-mortal way when Apakura
    throws her apron into the ocean and the god Rongotakawiu shapes it and gives it
    life; Rongotakawiu teaches Whakatau magic, and young Whakatau enjoys flying kites.
  language: English
  quote_policy: summarized
