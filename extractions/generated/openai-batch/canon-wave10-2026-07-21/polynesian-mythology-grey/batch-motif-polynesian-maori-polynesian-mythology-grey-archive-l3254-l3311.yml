  quote: ''
  summary: The passage introduces Tuwhakararo through his family genealogy, relates
    his sister Mairatea's marriage into Poporokewa's people, and describes Tuwhakararo's
    visit to her household. Maurea, his brother-in-law's young sister, favors Tuwhakararo
    despite another courtship. Her sweetheart wrestles Tuwhakararo, is thrown twice
    and laughed at, then attacks Tuwhakararo by throwing sand into his eyes while
    he is putting on his cloak.
