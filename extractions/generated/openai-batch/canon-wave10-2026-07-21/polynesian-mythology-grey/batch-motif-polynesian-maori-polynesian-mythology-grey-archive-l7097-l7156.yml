canonical_text:
  quote: there they landed on this island, — on Aotea.
  summary: Manaia's party lands on Aotea after finding a dog beside a stranded whale.
    They rejoice at reaching the country they sought, plan shelter and whale division,
    begin clearing land, then wander along the shore seeking a village site. Other
    canoes arrive at the first landing place, claim the sheds, cleared ground, and
    whale, and the two parties dispute who arrived first.
