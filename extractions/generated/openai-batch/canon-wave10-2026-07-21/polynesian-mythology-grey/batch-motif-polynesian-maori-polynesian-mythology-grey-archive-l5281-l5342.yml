canonical_text:
  quote: ''
  summary: A female stranger identified as Ngatoro-i-rangi's niece enters the fortress
    by climbing over its defences, sits in Ngatoro-i-rangi's sacred seat, is led before
    an altar, and gives over gods brought from Hawaiki. She announces that Ngatoro-i-rangi's
    people have been cursed and calls for cleansing in running water through the Whangai-horo
    ceremony. The people plunge into a stream while priests chant and perform rituals,
    then priests cleanse the courtyard and dig a ritual pit of wrath intended to draw
    in and destroy enemy spirits.
  language: English
  quote_policy: summarized
