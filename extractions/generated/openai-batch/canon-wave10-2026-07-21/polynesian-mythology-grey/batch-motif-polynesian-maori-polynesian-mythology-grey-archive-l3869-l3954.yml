canonical_text:
  quote: ''
  summary: Hine-i-te-iwaiwa brings Tinirau's request for Whakatau to help avenge a
    relative. Whakatau instructs her to feast the warriors, reserve the bird-preserving
    oil for him, and remain in mourning. He has Rata's ancestral canoe prepared, travels
    with six men to Tinirau and then to the enemy house Tihi-o-Manono. Enemy champions
    challenge him from shore; one diver is killed after oil makes the sea transparent,
    and one leaper is caught in a noose. Whakatau kills ten champions, mutilates and
    releases one survivor to report the defeat, performs a prescribed sacrifice to
    the gods, eats, sends his men back, and gives rain-and-flame signs by which Hine-i-te-iwaiwa
    may know whether he has died or conquered.
  language: English
  quote_policy: summarized
