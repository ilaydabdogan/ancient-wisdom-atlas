  summary: A party lands at Kiki's place after protective preparations. Kiki, an old
    sorcerer, welcomes them and has enchanted food prepared. Tamure uses incantations
    on Kiki's threshold and door, while Kiki attempts to kill Tamure with enchanted
    food. Tamure avoids eating, has his daughter eat cautiously while using protective
    incantations, and leaves by canoe; after the party leaves, Kiki becomes unwell.
  language: English
