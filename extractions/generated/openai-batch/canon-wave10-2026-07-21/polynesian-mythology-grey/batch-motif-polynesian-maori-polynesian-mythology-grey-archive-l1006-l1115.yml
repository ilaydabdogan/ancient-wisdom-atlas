canonical_text:
  quote: ''
  summary: Taranga invites her lastborn child to sleep beside her, provoking jealousy
    among his older brothers, who question his origin and his return from the ocean.
    Some brothers counsel peace by invoking the conflict among the children of Rangi-nui
    and Papa-tu-a-nuku. Taranga repeatedly disappears at dawn and returns at night.
    The suspicious lastborn hides her clothes and blocks the house openings to keep
    out dawn light; she wakes late, finds herself uncovered, sees the sun high, takes
    a flax cloak fragment as covering, and leaves crying.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Taranga calls her lastborn child to sleep beside her so they may kiss one
    another, and he goes to sleep with her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The older brothers become jealous and say their mother does not invite them
    to sleep with her, although she bore and nursed them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers question the lastborn child's origin, call him an abortion thrown
    into the ocean, and remark that he has returned to the world as a living human
    being.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two elder brothers advise the others to treat the lastborn as a dear brother
    and to settle disputes peacefully.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The elder brothers cite the children of Rangi-nui and Papa-tu-a-nuku as an
    example of family division: most consented to slay their parents, Tawhiri-ma-tea
    loved his parents and fought his brothers after the husband was separated from
    the wife, and Tu-matauenga later waged war against his kindred and parents.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The two younger brothers agree that the murmuring should end.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Taranga rises early in the morning and suddenly leaves the house before her
    children wake; she returns at nightfall, then again disappears at dawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The lastborn child becomes suspicious of Taranga's repeated morning disappearances.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: One night the lastborn child steals and hides Taranga's apron, belt, and clothes,
    then stops up the crevices in the wooden window and doorway so dawn light will
    not enter the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Because the house openings are blocked, Taranga does not perceive that daylight
    has come and sleeps until the sun is high.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Taranga wakes, finds herself without her clothes, opens the blocked chinks,
    sees the sun high in the heavens, takes an old flax cloak fragment as covering,
    and runs away crying.
  category: action
  evidence_refs:
  - ev:6
