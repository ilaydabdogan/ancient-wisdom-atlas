canonical_text:
  quote: ''
  summary: Maui kills and carries off the daughter of Maru-te-whare-aitu and destroys
    Maru-te-whare-aitu's crops by enchantments. Visiting his parents, he learns that
    food is carried daily to his ancestress Muri-ranga-whenua. Maui takes over the
    deliveries but withholds the food. Muri-ranga-whenua detects him by scent, prepares
    to devour him, then recognizes him as her descendant and shrinks her distended
    stomach. Maui explains that he wants her jawbone for enchantments; she gives it
    to him. Returning to his brothers, Maui argues that the sun makes the days too
    short and proposes catching it in a noose so mankind may have longer days for
    work. He persuades his brothers by recalling his earlier enchantments and transformations
    into birds. They make flax ropes, travel east by night while hiding by day, reach
    the place where the sun rises, build clay walls and tree-bough huts, prepare the
    noose loops, and lie in wait.
  language: English
  quote_policy: summarized
