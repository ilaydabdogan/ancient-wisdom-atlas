canonical_text:
  quote: ''
  summary: Hotunui tells his son Maru-tuahu that he was insulted when a servant requested
    fish from a net-owner. Hotunui interprets the insult as an attack on chiefly authority.
    Maru-tuahu reacts sadly, says the offenders will learn the result of their conduct,
    then prepares dried fish and many fishing-nets and sends a messenger inviting
    the offending tribe to a feast and net-stretching.
  language: English
