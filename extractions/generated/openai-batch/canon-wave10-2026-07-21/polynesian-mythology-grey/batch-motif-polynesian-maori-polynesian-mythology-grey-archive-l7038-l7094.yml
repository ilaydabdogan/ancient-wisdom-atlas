canonical_text:
  quote: ''
  summary: Manaia orders that his brother-in-law be killed as an offering to the gods
    for the canoe. He deceives the brother-in-law into wading into deep water, then
    kills him with a stone battle-axe. Manaia lifts the man’s dog into the canoe and
    sails away in search of a new country. Far from the former land, the dog scents
    land, howls, jumps overboard, swims ahead of the canoe, and eventually reaches
    land while the canoe follows its track and sound.
  language: English
  quote_policy: summarized
