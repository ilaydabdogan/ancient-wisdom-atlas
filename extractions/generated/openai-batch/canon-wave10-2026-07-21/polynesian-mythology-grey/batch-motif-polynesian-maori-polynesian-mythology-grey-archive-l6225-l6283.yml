canonical_text:
  quote: ''
  summary: Warriors preserve enemy heads and boast of their deeds after battle. On
    returning by canoe toward Mokoia and Roto-rua, Hatupatu’s brothers claim to have
    Raumati’s head, but their father rejects the claims. Hatupatu then performs a
    war prayer, reveals Raumati’s head hidden under his cloak, and is honored above
    his elder brothers. The passage then summarizes revenge, migration, genealogy,
    later vengeance for a death, the killing of Uenukukopako’s dog, renewed war, and
    the storming of Mokoia.
  language: English
  quote_policy: summarized
