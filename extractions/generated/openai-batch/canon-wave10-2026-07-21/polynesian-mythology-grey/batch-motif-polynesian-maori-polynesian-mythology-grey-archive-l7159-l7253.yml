canonical_text:
  quote: ''
  summary: Manaia disputes with another canoe party over signs of prior arrival, including
    a whale, sheds, cleared land, and a sacred place. After accepting that the other
    party arrived first, he leaves the first landing area and seeks another country
    by canoe and coastal travel. His party lands near Tongaporutu, leaves the god
    Rakeiora there, travels around Mokau and other places, leaves a stone anchor,
    renames a river after Manaia's son Tu-ure-nui, and at Waitara destroys earlier
    inhabitants to take possession. The passage closes by identifying Manaia as ancestor
    of Ngati-Awa and recalling battles, weapons, and a son in Hawaiki.
  language: English
  quote_policy: summarized
