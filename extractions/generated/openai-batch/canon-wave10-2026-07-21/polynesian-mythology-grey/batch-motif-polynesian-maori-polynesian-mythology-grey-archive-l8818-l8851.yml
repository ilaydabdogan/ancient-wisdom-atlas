  summary: The passage closes a tale in which net-making is presented as an art acquired
    from fairies and then taught through a family line to the Māori race. It then
    begins the adventure of Te Kanawa, a Waikato chief, who camps at night on Pukemore
    with his party, makes a fire near a large rooted tree, hears invisible voices
    of men, women, and children, and identifies the noise as coming from fairies.
