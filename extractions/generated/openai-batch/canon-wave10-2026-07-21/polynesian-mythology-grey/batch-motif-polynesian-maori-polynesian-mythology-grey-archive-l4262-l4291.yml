canonical_text:
  quote: ''
  summary: Uenuku's force breaks through fences and obstructions. Houmaitawhiti repeatedly
    tells his people to let the enemy in until they reach the threshold of his house.
    Houmaitawhiti then rises with his sons; the ensuing struggle kills many enemies,
    while others escape. The slain bodies are cut up, baked, and eaten. The passage
    condemns this as a great crime because the dead were near relations descended
    from Tamatea-kai-ariki. Afterward, cowardice and fear seize Houmaitawhiti's tribe;
    Houmaitawhiti and Whakaturia die, while Tama-te-kapua and some descendants and
    relations live and seek a lasting peace to preserve a remnant.
  language: English
  quote_policy: summarized
