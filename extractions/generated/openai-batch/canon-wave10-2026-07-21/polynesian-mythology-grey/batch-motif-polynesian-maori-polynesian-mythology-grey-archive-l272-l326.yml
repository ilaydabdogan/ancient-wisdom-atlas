canonical_text:
  quote: ''
  summary: In this preface passage, the translator explains that he has published
    a native-language collection of Maori poems, chants, and songs, and now presents
    translated portions of Maori mythology and legends. He gives reasons for preserving
    material received from priests and other informants, discusses the limitations
    and intended fidelity of his translation, and frames the European reader as hearing
    a high-priest explain traditions and religious opinions. The passage contains
    colonial-era evaluative language about Maori traditions and religion.
  language: English
  quote_policy: summarized
