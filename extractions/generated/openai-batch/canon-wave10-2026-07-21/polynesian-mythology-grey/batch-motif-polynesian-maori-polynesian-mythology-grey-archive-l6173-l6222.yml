canonical_text:
  quote: "“it was only formed of clumps of grass dressed up.”"
  summary: In a battle episode, Hatupatu’s one division appears to the enemy like
    a force commanded by many well-dressed chiefs, but it is actually made of dressed
    clumps of grass. The enemy attacks with spears; the divisions associated with
    Ha-nui, Ha-roa, and Karika collapse and retreat. Hatupatu rallies them, confronts
    an enemy chief also named Karika, kills and beheads him, causing the enemy to
    rout. Hatupatu then seeks Raumati, who is caught and beheaded. The victors return
    to camp and cook and devour enemy bodies.
  language: English
  quote_policy: quoted
