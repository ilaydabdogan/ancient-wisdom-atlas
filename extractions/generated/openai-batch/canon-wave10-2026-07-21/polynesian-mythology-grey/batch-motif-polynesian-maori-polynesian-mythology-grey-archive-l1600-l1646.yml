  summary: Maui and his brothers reach the open sea. The brothers quickly fill the
    canoe with fish and want to return, but Maui insists on casting his own ornamented
    hook. When they refuse him bait, he strikes his nose and uses his own blood. The
    hook descends to a house at the bottom of the sea and catches in its doorway.
    Maui hauls upward, bringing up the house of Tonganui with foam and bubbles, described
    as like an island emerging from the water, while his brothers cry and Maui chants
    incantations.
