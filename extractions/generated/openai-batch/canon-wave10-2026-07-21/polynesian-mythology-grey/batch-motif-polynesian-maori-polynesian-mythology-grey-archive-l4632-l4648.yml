  quote: ''
  summary: The passage traces the route of the Tainui after leaving Whanga-Paraoa
    shortly after the Arawa. It follows coastal places, reaches the northern end of
    the land, returns to Tamaki, moves to the Tau-oma portage, observes seabirds coming
    from the west, and then sets out to explore. A footnote explains Whanga-Paraoa
    as the bay of the sperm whale, named from a whale found there.
