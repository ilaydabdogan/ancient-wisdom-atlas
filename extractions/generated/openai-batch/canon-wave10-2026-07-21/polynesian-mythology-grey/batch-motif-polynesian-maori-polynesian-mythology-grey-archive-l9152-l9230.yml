canonical_text:
  quote: ''
  summary: 'During a public dance, Puhihuia and Te Ponga admire one another. Afterward
    Te Ponga cannot sleep because of his love for her, and his private slave proposes
    a ruse: Te Ponga should feign thirst so that Puhihuia will be sent to fetch water,
    allowing him to follow her to the spring and speak with her privately. The passage
    ends as Te Ponga begins carrying out the plan and the village chief tells his
    daughter to fetch water.'
  language: English
  quote_policy: summarized
