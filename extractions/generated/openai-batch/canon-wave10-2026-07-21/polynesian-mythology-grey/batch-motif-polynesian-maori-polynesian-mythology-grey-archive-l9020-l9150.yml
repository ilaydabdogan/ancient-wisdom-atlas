canonical_text:
  quote: ''
  summary: Takarangi gives water to Rau-mahora’s aged father and to Rau-mahora; mutual
    gazing follows, the father asks whether Rau-mahora wants Takarangi as husband,
    she agrees, and the marriage ends the war. A genealogy then links their descendants
    to Te Puni in Wellington. A new narrative begins with a fortified town at Mount
    Eden/Maunga-whau, warfare and peace between Waikato/Awhitu and the town’s people,
    Te Ponga’s ceremonial welcome, a feast, and preparations for a night dance watched
    by Puhihuia.
  language: English
  quote_policy: summarized
