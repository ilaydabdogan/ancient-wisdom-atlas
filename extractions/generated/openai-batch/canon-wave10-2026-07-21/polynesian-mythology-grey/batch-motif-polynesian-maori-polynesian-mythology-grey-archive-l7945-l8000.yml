canonical_text:
  quote: ''
  summary: Maru-tuahu has one hundred and forty armed men lift and drop a net over
    a large group of guests, trapping and killing them all. The event is remembered
    by a proverb and a place-name, and the dead people's country becomes Maru-tuahu's
    property. The passage then shifts to Te Paka, whose daughter Te Kahureremoa is
    arranged in marriage to the son of the principal chief of Aotea after a gift-bearing
    visit; Te Paka intends the marriage to help his family gain Aotea through her
    future children.
  language: English
  quote_policy: summarized
