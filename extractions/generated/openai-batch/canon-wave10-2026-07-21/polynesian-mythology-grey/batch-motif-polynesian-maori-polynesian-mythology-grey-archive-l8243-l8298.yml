canonical_text:
  quote: ''
  summary: After a nose-pressing greeting, Takakopiri urges Te Kahureremoa and her
    attendant to go to his village beyond the forest. Te Kahureremoa delays so he
    can ask the attendant her identity. The attendant names her as Te Kahureremoa,
    daughter of Paka. The young chief is surprised that she has come from so far away,
    then runs ahead to his fortress announcing her arrival. His people first doubt
    the announcement and then question how a young woman could have travelled so far
    into a strange place.
  language: English
  quote_policy: summarized
