canonical_text:
  quote: ''
  summary: A young girl identified by the story title as Kahureremoa approaches and
    is welcomed by a crowd with waving garments and songs. Takakopiri leads her past
    people who ask her to stop, brings her to his dwelling, and a feast is held with
    food and mountain birds. The crowd admires her, while youths do not speak love
    because they fear Takakopiri. Within a month she marries the young chief and bears
    Tuparahaki, from whom the principal chiefs of the Ngatipaoa tribe are said to
    descend.
  language: English
