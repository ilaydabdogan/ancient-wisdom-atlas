canonical_text:
  quote: ''
  summary: Tawhaki sends Karihi home, climbs the ascent to heaven with Matakerepo’s
    warning and an incantation, disguises himself by enchantment as an ugly old man,
    and reaches a forest where his brothers-in-law and their people are making canoes.
    Mistaken for a slave, he carries axes and firewood, secretly completes canoe work
    with supernatural speed, and goes to Tangotango’s fire, where she does not recognize
    him as her husband.
  language: English
  quote_policy: summarized
