canonical_text:
  quote: ''
  summary: Rongo-rongo overhears Uenuku chanting in Wharekura about summoning warriors
    to destroy foes. She reports the chant to Turi, who interprets it as a secret
    revenge plot against him because he killed Uenuku's child. Turi goes to his father-in-law
    Toto for a canoe to escape. Toto gives Aotea, one of two canoes made from a split
    tree from Lake Waiharakeke; the other canoe, Matahorua, is given to Kuramarotini
    and is associated with exploration under Reti. The passage then begins a separate
    fishing episode involving Kupe and Hoturapa.
  language: English
  quote_policy: summarized
