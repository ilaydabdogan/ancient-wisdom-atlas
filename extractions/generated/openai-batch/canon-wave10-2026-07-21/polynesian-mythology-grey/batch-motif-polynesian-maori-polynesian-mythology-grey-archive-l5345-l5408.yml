canonical_text:
  quote: ''
  summary: After ceremonies and a gathering in Ngatoro-i-rangi's house, Kuiwai's daughter
    explains that Manaia has cursed Kuiwai and Ngatoro-i-rangi with cooking imagery.
    Ngatoro-i-rangi responds with a reciprocal curse, orders a Totara-tree canoe to
    be made because the Arawa had been burned, and travels by sea to Hawaiki, where
    the canoe is hidden after a night landing. He then goes to Kuiwai's house at Whaitiri-ka-papa.
  language: English
  quote_policy: summarized
