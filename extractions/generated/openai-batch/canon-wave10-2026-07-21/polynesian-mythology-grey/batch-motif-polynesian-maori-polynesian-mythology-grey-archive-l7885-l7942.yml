canonical_text:
  quote: ''
  summary: Maru-tuahu orders a feast to be laid out for expected guests. The displayed
    food is arranged attractively with fish on the outside, but rotten wood and filth
    underneath; the feast is intended as a setting for slaughtering the guests in
    revenge for a curse against Hotunui. The guests arrive and rejoice at the provisions.
    They prepare and stretch a great net made from smaller nets, after soaking the
    nets and ropes in water. Maru-tuahu confirms that the lower end has been stretched,
    then goes with one hundred and forty armed men whose weapons are hidden under
    their garments. A priest of Maru-tuahu instructs that the upper end of the net
    be raised for consecration or proper stretching.
  language: English
  quote_policy: summarized
