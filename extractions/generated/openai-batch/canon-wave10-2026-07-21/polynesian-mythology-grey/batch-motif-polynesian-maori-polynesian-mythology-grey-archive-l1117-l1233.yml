canonical_text:
  quote: discovered a beautiful open cave running quite deep into the earth
  summary: Maui observes his mother vanish through a hidden hole under rushes and
    discovers a deep cave. He wakes his brothers and asks where their parents dwell.
    The brothers speak of Rangi and Papa-tua-nuku as providers, while Maui explains
    his desire to find his parents because of his love for his mother. His brothers
    encourage him. Maui takes a pigeon form, marked by his mother's stolen belt and
    apron, and prepares for a magical journey to seek his parents.
