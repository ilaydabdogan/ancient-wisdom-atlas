canonical_text:
  quote: calling to their aid the storms of heaven
  summary: After earlier vengeance and settlement at Maketu, Manaia refits canoes
    and later arrives at Motiti with a fleet and warriors to challenge Ngatoro-i-rangi.
    Ngatoro, nearly alone with his wife in his fortified village, delays battle until
    morning. During the night he and his wife perform incantations and rites, calling
    on heavenly storms, while Manaia's host amuses itself with songs and Hakas, unaware
    of impending destruction.
  language: English
  quote_policy: quoted
