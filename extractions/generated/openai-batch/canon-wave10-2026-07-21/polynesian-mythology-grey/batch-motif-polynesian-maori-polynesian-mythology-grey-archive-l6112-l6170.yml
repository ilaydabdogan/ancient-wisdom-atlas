  summary: Hatupatu makes a mock war band by dressing bushes in cloaks. At dawn the
    inhabitants of the place to be attacked see the supposed enemy and send messengers
    to summon warriors. Hatupatu and the columns connected with his brothers give
    war speeches; Hatupatu repeatedly changes his hair, clothing, ornaments, and weapons
    while appearing in different positions, causing the defenders to dread his division
    more than those of his brothers.
