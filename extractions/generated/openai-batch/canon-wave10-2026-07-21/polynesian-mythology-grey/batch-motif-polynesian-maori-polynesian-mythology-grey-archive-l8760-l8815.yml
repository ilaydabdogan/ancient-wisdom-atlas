canonical_text:
  quote: ''
  summary: Kahukura mingles unnoticed with fairies as they haul a fishing net to shore
    before dawn. While the fairies hurry to land and string fish before sunrise, he
    repeatedly uses a slip-knot so his fish fall and the fairies stop to help him.
    Full daylight reveals that he is a man, and the fairies flee, leaving fish, flax-stem
    canoes, and a rush net; from the net left with Kahukura the stitch for netting
    is first discovered.
  language: English
