canonical_text:
  quote: ''
  summary: Ngatoro shapes and marks the landscape, climbs snow-covered Tongariro,
    is endangered after companions eat despite his command, prays to the gods of Hawaiki
    for fire, and is revived when volcanic fire reaches him. The passage then recounts
    the Arawa canoe at Maketu, its destruction by Raumati using a burning dart, the
    absence of its people, their discovery of the ashes, and the children of Hou recalling
    their father's farewell proverb.
  language: English
  quote_policy: summarized
