canonical_text:
  quote: ''
  summary: 'The passage recounts part of Turi''s emigration in the Aotea canoe: Tuanui-a-te-ra
    is thrown overboard, the voyagers discard red head ornaments near shore, the canoe
    lands, and footprints matching Tuanui-a-te-ra''s deformed foot are found on the
    beach. Turi then travels from Aotea toward Patea, following a river described
    by Kupe, leaves the canoe in a harbour named for it, sends Pungarehu''s party
    to plant Karaka berry stones along the route, and names many places from incidents,
    bodily actions, and the enchanted garment or cloak Hunokiko.'
  language: English
