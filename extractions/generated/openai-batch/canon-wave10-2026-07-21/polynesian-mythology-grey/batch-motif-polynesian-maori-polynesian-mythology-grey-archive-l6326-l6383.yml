canonical_text:
  quote: ''
  summary: Turi seeks revenge for Potikiroroa by targeting Hawepotiki, the little
    son of Uenuku. After a failed attempt to entice the boy with children’s games,
    Turi uses river bathing to draw him out, kills him, and removes his heart. Turi
    and his friends eat some of the heart, and the friends place baked pieces in a
    basket of food sent to Uenuku, who unknowingly eats it. After being told what
    happened, Uenuku speaks a proverb implying future revenge while concealing his
    emotion. The passage ends by noting Turi’s household at Rangiatea and naming his
    wife and children.
  language: English
  quote_policy: summarized
