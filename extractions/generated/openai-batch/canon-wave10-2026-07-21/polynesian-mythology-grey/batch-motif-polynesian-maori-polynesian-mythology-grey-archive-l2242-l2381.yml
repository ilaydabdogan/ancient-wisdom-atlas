canonical_text:
  quote: ''
  summary: Tawhaki, Karihi, and their mother Tatau hide from the Ponaturi and use
    blocked openings and delayed dawn-light to destroy them. The brothers then handle
    their father's bones and return with their mother. A heavenly maiden, Tango-tango,
    descends at night to Tawhaki, conceives a child, remains with him, and later gives
    instructions for the child's washing before baptism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tawhaki remains silent while Karihi proposes that they hide because they know
    incantations that can render them invisible.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their mother consents to their remaining to avenge their father, and the brothers
    hide in the reed thatch of the roof.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Their mother instructs them to come down near dawn and stop every chink in
    the house so that no light can enter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sunset the strange tribe leaves the water in a body and ascends to dry
    land, sending a scout ahead to inspect the road and house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The scout smells Tawhaki and Karihi, but the crowd of Ponaturi entering the
    house causes the strangers' scent to be lost; the house fills and the Ponaturi
    sleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At midnight Tawhaki and Karihi come down from the roof and ask Tatau how to
    destroy the sleeping people; she says the sun's rays will destroy them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tatau repeatedly tells the Ponaturi that it is still night and tells them
    to sleep on.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After dawn, Tatau tells her children to remove the coverings from the window
    and door, and the sunlight enters the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Ponaturi in the house perish before the light and wither before the sun's
    rays.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tawhaki and Karihi take down their father's bones, burn them with fire together
    with the bodies in the house, and return to their country with their mother while
    carrying their father's bones.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Reports of Tawhaki's courage and beauty reach a young maiden of the heavenly
    race living above in the skies.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The heavenly maiden descends at night, finds Tawhaki asleep, lies down beside
    him, and leaves before dawn to ascend again to the heavens.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tango-tango visits Tawhaki every night until she conceives a child later named
    Arahuta; she then reveals herself and lives with him in this world.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tango-tango tells Tawhaki that the parent who washes the baby before baptism
    will depend on the child's sex; after a girl is born, Tawhaki takes her to a spring
    to wash her.
  category: sequence
  evidence_refs:
  - ev:10
