canonical_text:
  quote: ''
  summary: Tawhaki, appearing as an ugly old man, is made to carry axes while his
    brothers-in-law work on canoes. They discover the canoes have been altered, hide
    to watch, and see Tawhaki remove his old-man disguise with incantations and resume
    a noble, handsome form. They identify him through Tangotango, his wife. Tawhaki
    returns to the village, takes up his daughter, makes the place tapu, and arranges
    noble ceremonies for the child. At sunrise the child is carried through a special
    opening in the house wall with prayers, lightning flashes from Tawhaki, and the
    child is immersed in water with an incantation. A note says Tawhaki dwells in
    the skies and is connected with thunder and lightning.
  language: English
  quote_policy: summarized
