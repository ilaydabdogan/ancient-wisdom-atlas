canonical_text:
  quote: Depart, and dwell in peace with all, leave war and strife behind you here.
  summary: Houmai-ta-whiti gives final advice to his children to depart peacefully,
    avoid the deeds of Tu the war god, and build up a people without quarrelling.
    The narrator contrasts this with Uenuku's children, who are said to have brought
    war to New Zealand. After Raumati burns the Arawa canoe, Houmai-ta-whiti's descendants
    deliberate between patience and revenge, then decide to declare war; a great war
    follows between those who arrived in the Arawa and those who arrived in the Tainui.
  language: English
  quote_policy: quoted
