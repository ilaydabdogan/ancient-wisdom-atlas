canonical_text:
  quote: ''
  summary: Hatupatu takes Kurangaituku's cloaks and two-handed sword, kills her animals
    and most of her pet birds, and is reported by the one bird that escapes. Kurangaituku
    returns rapidly and pursues him. Hatupatu uses a charm to make a rock open and
    hide him. The pursuit continues to the Rotorua sulphur springs, where Hatupatu
    jumps over and Kurangaituku attempts to wade through, sinks through the crust,
    and is burned to death. Hatupatu then dives into the lake and rises at an island,
    with the passage ending mid-sentence.
