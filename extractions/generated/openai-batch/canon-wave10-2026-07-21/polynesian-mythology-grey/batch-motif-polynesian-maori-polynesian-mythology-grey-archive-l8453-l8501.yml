canonical_text:
  quote: Kiki died from the incantations of Tamure.
  summary: Tamui-e instructs villagers on the river to tell any pursuers that a canoe
    has gone far upriver, then departs in haste. After Tamure's party leaves Kiki's
    village, Kiki becomes gravely ill; his people attribute this to Tamure's magic,
    pursue by canoe, receive the instructed answer from the villagers, and return.
    Kiki dies from Tamure's incantations. The passage then recounts descendants of
    Kiki and Tamure and states that magical incantations pass from skilled fathers
    to their children.
  language: English
