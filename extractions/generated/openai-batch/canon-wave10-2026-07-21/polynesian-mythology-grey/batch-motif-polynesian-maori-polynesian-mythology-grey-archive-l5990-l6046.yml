  summary: Hatupatu emerges from a storehouse after incantations, appearing transformed
    and noble before his brothers and tribe. His three brothers attack him with wooden
    swords, but he fells them twice and they yield. Their father rebukes them for
    attacking their younger brother while failing to avenge the ancestral canoe Te
    Arawa against the chief Raumati. The brothers and followers prepare a war expedition
    to Maketu while the father secretly teaches Hatupatu how to recognize Raumati.
