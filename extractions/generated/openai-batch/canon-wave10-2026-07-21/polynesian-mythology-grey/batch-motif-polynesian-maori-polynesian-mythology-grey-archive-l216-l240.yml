  summary: In the preface, the narrator describes the inadequacy of interpreters,
    his need as Governor to communicate directly with influential chiefs, and his
    efforts over more than eight years to learn the ancient language, collect traditional
    poems and legends, obtain mythology from priests, and study proverbs. He reports
    that a fire destroyed Government House and burned the collected materials, forcing
    him to begin the task again.
