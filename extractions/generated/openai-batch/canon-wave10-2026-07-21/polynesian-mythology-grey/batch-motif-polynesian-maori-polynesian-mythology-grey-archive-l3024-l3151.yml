- id: obs:1
  text: Kae refuses to return by canoe; the passage says this is a trick intended
    to make Tinirau let him ride Tutunui the whale because Kae knows the whale's flesh
    is savory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tinirau lends Tutunui to Kae and instructs him to jump off on the right side
    when the whale touches bottom and shakes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Kae's village shore, Tutunui shakes as a signal, but Kae holds on and presses
    the whale against the bottom until sand stops its blow-holes and it dies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kae and his people drag Tutunui ashore, cut up the body, and cook it in ovens
    with fragrant Koromiko leaves; the fat clings to the leaves and is connected with
    a proverb.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
