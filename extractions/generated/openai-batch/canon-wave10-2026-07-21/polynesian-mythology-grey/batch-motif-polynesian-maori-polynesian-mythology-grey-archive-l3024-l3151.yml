canonical_text:
  quote: ''
  summary: Kae tricks Tinirau into letting him ride Tutunui the whale home, refuses
    to dismount when the whale signals at the shore, and causes its death. Kae and
    his people cook and eat the whale. Tinirau detects the act through the scent crossing
    the sea and sends forty women to Kae's village; by making Kae laugh, they identify
    him from his uneven teeth and whale flesh between them. The passage also explains
    sayings about Tutunui and Kae's laughter.
  language: English
  quote_policy: summarized
