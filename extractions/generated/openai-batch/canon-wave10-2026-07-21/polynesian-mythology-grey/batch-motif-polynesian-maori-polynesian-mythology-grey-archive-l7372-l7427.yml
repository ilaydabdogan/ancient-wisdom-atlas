canonical_text:
  quote: ''
  summary: At night Tutanekai and Tiki play instruments from a balcony, and Hine-Moa
    hears the music and longs to go to Tutanekai. Her friends, suspecting her intentions,
    keep the canoes hauled ashore. Hine-Moa decides to swim across Lake Rotorua to
    Mokoia, using six dry gourds as floats. She rests at a sunken tree stump, continues
    through darkness guided by Tutanekai's music, reaches Waikimihia on Mokoia, and
    warms herself in a hot spring. Tutanekai then asks his servant to bring water.
  language: English
