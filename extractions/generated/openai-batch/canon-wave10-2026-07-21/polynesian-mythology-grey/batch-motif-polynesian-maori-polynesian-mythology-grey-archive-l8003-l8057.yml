canonical_text:
  quote: ''
  summary: Te Kahureremoa refuses to go with a canoe party. After the party returns
    with thirty baskets of mackerel, her father Paka rebukes her for taking a basket,
    saying she refused to become wife of the young chief from the place where such
    fish abound. Ashamed, she resolves to leave home and seek Takakopiri as lord.
    At night she flees with her female slave; the next morning searchers find their
    footprints but cannot tell how long before they passed. Waipuna and Pukorokoro
    are named in the route.
  language: English
  quote_policy: summarized
