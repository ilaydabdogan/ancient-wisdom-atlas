canonical_text:
  quote: ''
  summary: Hine-Moa identifies herself to Tutanekai at the bath, rises from the water,
    and goes with him to his house, where they become man and wife according to ancient
    Maori law. At dawn, a messenger sent by Whakaue discovers her in Tutanekai's house,
    and the village and Tutanekai's elder brothers acknowledge the marriage. Tiki
    grieves because Tutanekai has married while he has no wife, so Tutanekai asks
    that his young sister Tupa be given to Tiki; Whakaue consents and Tupa becomes
    Tiki's wife.
  language: English
  quote_policy: summarized
