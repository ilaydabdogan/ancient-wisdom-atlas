canonical_text:
  quote: ''
  summary: At Hauraki, Hotunui welcomes Maru-tuahu as his child, and Maru-tuahu replies
    deferentially. A feast of ten dogs follows while two sisters secretly contend
    over which of them should have Maru-tuahu as husband. After the feast, the group
    moves to sacred precincts; in the evening a fire is kindled, and the elder sister
    learns that the younger sister has been given to Maru-tuahu. The elder sister
    is later given to Te Paka. The passage then names children and descendant tribes
    from these marriages.
  language: English
  quote_policy: summarized
