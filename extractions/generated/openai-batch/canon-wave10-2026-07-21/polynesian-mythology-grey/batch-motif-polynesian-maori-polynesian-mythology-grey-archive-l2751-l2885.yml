canonical_text:
  quote: ''
  summary: Hinauri, after drifting at sea, is found and restored by two brothers,
    becomes connected first with them and then with Tinirau, and kills Tinirau's two
    hostile wives by incantation. Her younger brother Mauimua, later called Rupe,
    searches for her, ascends through successive heavens despite warnings about boundaries
    fixed by Tane, reaches Rehua in the tenth heaven, and refuses food made from birds
    shaken from Rehua's sacred hair.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hinauri floated for many months through the sea and was thrown by surf onto
    the beach at Wairarawa, lying as if dead and partly overgrown with seaweed and
    barnacles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ihuatamai and Ihuwareware found Hinauri, carried her to their house, placed
    her beside a fire, removed seaweed and barnacles from her body, and restored her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After recovering, Hinauri became the wife of both brothers and changed her
    name to Ihungarupaea, glossed as Stranded-log-of-timber.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ihuwareware reported the events to Tinirau; Tinirau came for Hinauri as a
    wife, and she was given to him while already pregnant by Ihuatamai.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tinirau took Hinauri to Motu-tapu, where his two wives Harataunga and Horotata
    abused, cursed, and attempted to strike or kill her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hinauri uttered an incantation against Harataunga and Horotata, after which
    they fell down dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mauimua, later called Rupe, grieved for his lost sister Hinauri and set out
    to seek her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After failing to find Hinauri in earthly places, Rupe decided to ascend to
    the heavens to consult his ancestor Rehua at Te Putahi-nui-o-Rehua.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At inhabited heavens Rupe asked whether higher heavens were inhabited and
    whether he could reach them; inhabitants replied that higher heavens were inhabited
    but unreachable because their boundaries were fixed by Tane.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Rupe forced his way through successive heavens until he reached the tenth
    heaven and found Rehua's abode.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Rehua welcomed the stranger with a lament, and Rupe's own lament and prayers
    enabled Rehua to recognize him.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Rehua ordered his servants to light a fire and prepare for cooking; the servants
    made the fire burn and brought hollow calabashes.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Rehua loosened the bands around his hair, shook his loose locks, and flocks
    of Tui birds flew out; servants caught, killed, cooked, and served them to Rupe.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Rupe refused to eat the birds because he had seen them come from Rehua's locks
    and said they had fed on insects in Rehua's sacred head.
  category: speech
  evidence_refs:
  - ev:14
