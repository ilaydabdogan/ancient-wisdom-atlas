canonical_text:
  quote: ''
  summary: 'The passage describes preparations for Turi’s voyage: advice about recognizing
    a place by answering cries, replacement paddles and bailers supplied by Tuau,
    loading of seed, food plants, animals, and valuables onto the canoe, and the night
    departure. Tuau initially intends to accompany the canoe only a short distance,
    but Turi moves him amidships, paddles hard out to sea, and refuses to turn back
    when Tuau asks to be landed.'
