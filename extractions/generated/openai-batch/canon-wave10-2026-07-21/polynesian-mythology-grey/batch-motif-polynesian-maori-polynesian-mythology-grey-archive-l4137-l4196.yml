canonical_text:
  quote: ''
  summary: Tama-te-kapua advises his brother Whakaturia, who is hanging in a smoky
    house, to provoke Uenuku's assembled people about their dancing and singing, to
    demand grooming items and Uenuku's red apron and carved two-handed sword before
    performing, and then to rush out while Tama-te-kapua bolts the door and window
    so they can escape. Whakaturia calls down to Uenuku and the people, challenges
    their performances, is let down at Uenuku's order, follows the plan, and asks
    them to make a bright fire without smoke.
  language: English
