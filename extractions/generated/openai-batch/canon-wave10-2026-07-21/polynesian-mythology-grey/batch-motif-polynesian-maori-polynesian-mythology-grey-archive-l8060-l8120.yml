canonical_text:
  quote: ''
  summary: Te Kahureremoa and companions move rapidly through named places until the
    pursuit is stopped by the tide. Up-river canoe crews recognize her as Paka's daughter,
    take her aboard, and row with anxious deference. She stops overnight at Raupa,
    continues over the range toward Katikati, views Otawa from Hikurangi, asks local
    people about the mountain, its food, and its owner, and then says that she and
    her female slave are going to Otawa.
  language: English
  quote_policy: summarized
