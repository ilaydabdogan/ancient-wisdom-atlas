canonical_text:
  quote: ''
  summary: After a victorious group ritually sets apart enemy bodies for the gods
    and consumes them, Ngatoro-i-rangi and his warriors retreat toward their canoe
    while Manaia's warriors pursue. A lack of water sends Rangitu back to a stream
    with a calabash, where he is ambushed and uses the calabash as a shield. He reaches
    his companions, turns back with support, and the pursuing force is routed, though
    Manaia escapes.
  language: English
  quote_policy: summarized
