canonical_text:
  quote: ''
  summary: Hine-Moa sits near the lake bath while Tutanekai's servant draws water
    in calabashes for him. Speaking in a gruff voice like a man, she asks for the
    water, drinks it, and repeatedly breaks the calabashes. The servant reports this
    to Tutanekai, who becomes angry, arms himself with a club, and goes to the bath.
    Hine-Moa recognizes Tutanekai's voice as that of her beloved, hides under the
    overhanging rocks of the hot-spring, and is found when he catches hold of a hand.
