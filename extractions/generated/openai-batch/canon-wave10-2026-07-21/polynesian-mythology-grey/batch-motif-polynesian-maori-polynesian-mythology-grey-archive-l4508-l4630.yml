canonical_text:
  quote: ''
  summary: A priest uses ritual power over the heavens and winds to drive the canoe
    toward the whirlpool called the throat of Te Parata. As the canoe sinks and the
    crew cry out, Ngatoro uses incantations to calm the storm and lift the canoe out,
    though much cargo and food is lost. The voyagers land at Whanga-Paraoa in Aotea,
    mistake red pohutukawa flowers for head ornaments, plant sweet potatoes, dispute
    a stranded whale with the people of the Tainui, and then separate to explore the
    coast under Taikehu.
  language: English
  quote_policy: summarized
