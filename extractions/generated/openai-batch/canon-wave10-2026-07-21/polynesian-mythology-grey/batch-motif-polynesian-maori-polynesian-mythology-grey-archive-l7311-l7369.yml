canonical_text:
  quote: ''
  summary: Hine-Moa hears the nightly music of Tutanekai and Tiki. Though her family
    will not betroth her to any chief, she and Tutanekai meet at Rotorua gatherings
    and develop a mutual secret love. Tutanekai sends a messenger, and Hine-Moa recognizes
    that they love alike. Later, Tutanekai tells his reputed father Whakaue that he
    and Hine-Moa have arranged for her to run away to him, using his nightly trumpet
    as the sign and paddling a canoe to his place.
  language: English
