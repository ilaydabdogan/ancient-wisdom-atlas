canonical_text:
  quote: ''
  summary: A man is killed, his body is cut up and eaten by the Ati-Hapai, and his
    bones are hung in the roof of their house. His sister hears the bones rattle and
    speaks of the lack of lamentation or vengeance. News reaches his brother Whakatau-potiki
    and other brothers, who grieve and prepare a revenge expedition by building and
    naming canoes. Their mother Apakura and female attendants prepare fern-root provisions
    and repeat a lament to stir the warriors. Whakatau-potiki's army embarks in a
    thousand canoes, lands en route, and performs a martial review with columns, war
    dance, and mock charges against an imaginary enemy.
  language: English
  quote_policy: summarized
