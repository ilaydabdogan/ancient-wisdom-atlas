canonical_text:
  quote: ''
  summary: After Rata leaves the forest at night, multitudes of insects, birds, and
    spirits restore the felled tree with incantations. Rata returns, fells it again,
    hides, and confronts the beings, who rebuke him for felling the forest god without
    authority. Ashamed, he obeys their order to return home, and they quickly make
    him a canoe, later named Riwaru. Rata, his tribe, and 140 warriors launch the
    canoe and go to seek the Ponaturi. At nightfall Rata lands alone near their fortress
    and approaches a fire burning at their sacred place.
  language: English
  quote_policy: summarized
