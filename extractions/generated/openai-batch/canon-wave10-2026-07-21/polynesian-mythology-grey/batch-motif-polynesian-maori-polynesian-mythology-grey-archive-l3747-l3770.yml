canonical_text:
  quote: ''
  summary: Rata hides near a sacred place and observes priests using the bones of
    his father Wahieroa while reciting the incantation Titikura. After learning the
    incantation by listening, Rata attacks and kills the priests, retrieves the bones,
    and returns by canoe toward his fortified village. The Ponaturi later find the
    dead priests, pursue him with a large force, and defeat Rata's tribe in battle,
    killing sixty warriors.
  language: English
