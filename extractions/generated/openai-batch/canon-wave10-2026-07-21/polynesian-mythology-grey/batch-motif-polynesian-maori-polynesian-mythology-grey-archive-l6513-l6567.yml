  summary: Kupe defeats a water monster by throwing a hollow calabash overboard as
    a decoy, then strikes and kills it with an axe. The passage then describes Kupe
    as discoverer of the islands, examiner of waterways or openings, namer of two
    bird inhabitants, and returner to his own country. Turi, fleeing the vengeance
    of Uenuku, prepares the canoe Aotea at night to travel to the islands. Kupe advises
    him to steer eastward toward the sunrise and to examine a river Kupe had discovered.
