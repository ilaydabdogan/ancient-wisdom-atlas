canonical_text:
  quote: ''
  summary: Maui speaks with his father about whether human beings must die or may
    live forever. His father warns of an ill omen from omitted prayers at Maui's baptism
    and describes Hine-nui-te-po, the great ancestress associated with death. Maui
    recalls having overcome the sun and drawn land from the sea, then goes with bird
    companions to Hine-nui-te-po's dwelling. He instructs the birds not to laugh while
    he enters her body, but Tiwakawaka laughs too soon; Hine-nui-te-po wakes and kills
    Maui. The narrator explains this as the introduction of death into the world and
    connects the tradition to genealogy and ritual remembrance.
  language: English
  quote_policy: summarized
