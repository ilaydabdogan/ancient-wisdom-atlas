canonical_text:
  quote: ''
  summary: Voyagers pray for safe ocean passage, sacrifice a dog to appease offended
    spirits, set up posts, and recite prayers to remove ill-luck from the canoes.
    Turi and Potoru dispute whether to sail east toward the sunrise, as Turi says
    Kupe instructed, or west toward the sunset; Potoru's westward course is followed,
    and the Ririno is wrecked on a reef. Turi then continues east in the Aotea; Tutawa
    is born to him in mid-ocean, and Turi offers one of the remaining sweet potatoes
    to the spirits while touching the child's palate and reciting prayers. As shore
    nears, Tuanui-a-te-ra is described as disobedient and insolent to Turi.
  language: English
  quote_policy: summarized
