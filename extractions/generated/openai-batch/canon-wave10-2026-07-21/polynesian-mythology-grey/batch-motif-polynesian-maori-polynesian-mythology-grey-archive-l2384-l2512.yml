canonical_text:
  quote: ''
  summary: Tango-tango, Tawhaki's young wife, leaves with their child for the sky
    after an insult to the baby, refusing to return but giving instructions about
    choosing the safe rooted creeper rather than a loose one. Tawhaki grieves and
    sets out with his brother Karihi and two slaves to seek his little girl. One slave
    ignores a warning not to look at Tongameha's enchanted fortress and dies. Tawhaki
    and Karihi reach the tendrils hanging from heaven to earth, where their blind
    ancestress Matakerepo keeps watch. Tawhaki tricks her by stealing taro roots;
    after Karihi strikes her, Tawhaki touches her eyes and restores her sight. Matakerepo
    recognizes her grandchildren, directs them to climb the tendrils in the morning,
    receives Tawhaki's surviving slave as acknowledgment, and repeats warnings not
    to look down midway or grasp a loose tendril.
  language: English
  quote_policy: summarized
