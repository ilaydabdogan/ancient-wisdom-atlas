canonical_text:
  quote: ''
  summary: Maui directs his brothers to help snare the sun, strikes the captured sun
    with an enchanted jaw-bone weapon, and releases it wounded so that it travels
    slowly. Later, after hearing household complaints about food, Maui prepares an
    enchanted fish-hook using the same ancestral jaw-bone, hides in his brothers'
    fishing canoe, uses enchantment to make the shore recede, and urges them toward
    the open sea beyond familiar fishing grounds.
  language: English
  quote_policy: summarized
