canonical_text:
  quote: This head bewitched all persons who approached the hill where the fortress
    in which it was kept was situated
  summary: A magical wooden or carved head kept by Puarata and Tautohito on a fortified
    hill kills or bewitches those who approach. Many warriors, armies, and travellers
    perish near the place. A powerful sorcerer, Hakawau, hears of it, uses subservient
    genii to enter an enchanted sleep, dreams that his genius will triumph, and begins
    a journey toward the site.
  language: English
  quote_policy: quoted
