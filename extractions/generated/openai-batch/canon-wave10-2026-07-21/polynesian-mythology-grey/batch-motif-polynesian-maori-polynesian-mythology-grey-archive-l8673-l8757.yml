canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which Hakawau climbs over a forbidden
    gateway into sacred areas of a fortress, refuses food, strikes the threshold as
    he departs, and all inhabitants of the fortress die. It then begins an episode
    in which Kahukura travels to Rangiaowhia, notices signs of nocturnal fish-cleaning,
    concludes that spirits or fairies have been fishing there, returns at night, observes
    fairies hauling a mackerel net with work calls, and joins them at the rope.
  language: English
  quote_policy: summarized
