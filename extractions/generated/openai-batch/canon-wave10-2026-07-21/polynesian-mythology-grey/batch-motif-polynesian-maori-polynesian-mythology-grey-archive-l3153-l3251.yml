canonical_text:
  quote: ''
  summary: Women from Tinirau's party detect Tutunui's flesh in Kae's teeth, put the
    household into enchanted sleep, and carry Kae away by canoe to Tinirau's house.
    Tinirau stages the setting and speech so Kae initially thinks he is at home, then
    exposes the deception; Kae is seized and killed. Kae's tribe later attacks Tinirau's
    fortress and kills Tinirau's son in revenge.
  language: English
