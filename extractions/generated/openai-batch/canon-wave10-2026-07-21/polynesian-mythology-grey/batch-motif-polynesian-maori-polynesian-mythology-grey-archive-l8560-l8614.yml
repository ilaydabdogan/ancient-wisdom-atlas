  summary: Hakawau travels with one friend along the coast toward the Sacred Mount
    to challenge the magic head and Puarata. They pass named places, refuse rest and
    food, fear fatal places marked by stench and corpses, use incantations for protection
    from hostile spirits, survive to a vantage point overlooking the fortress, and
    Hakawau sends genii to attack.
