canonical_text:
  quote: ''
  summary: Whakatau approaches the great house Tihi-o-Manono, infiltrates the people
    collecting firewood, and secretly passes a rope around the house posts. After
    the inhabitants gather inside and Mango-Pare recognizes him, Whakatau pulls the
    rope from outside, collapses the house, burns it, and Hine-i-te-iwaiwa sees the
    flames. The passage ends by stating that Whakatau has avenged Tuwhakararo and
    returned to his own village.
  language: English
  quote_policy: summarized
