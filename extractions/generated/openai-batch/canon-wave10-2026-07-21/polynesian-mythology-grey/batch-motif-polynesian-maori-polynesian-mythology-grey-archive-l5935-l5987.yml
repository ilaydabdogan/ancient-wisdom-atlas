canonical_text:
  quote: ''
  summary: Hatupatu is found alive at night by an old slave who has been sent to fetch
    water for Hatupatu's parents. Hatupatu secretly reunites with his parents, asks
    them to keep quiet so his brothers who slew him will not hear, and hides in a
    cave used for storing sweet potatoes while his mother feeds him the best food.
    His brothers notice the change in food and beat their mother and slaves. Later
    people announce Hatupatu's presence; his brothers, believing him dead, arm themselves,
    and Hatupatu also arms and adorns himself as he is challenged to come out and
    fight.
  language: English
  quote_policy: summarized
