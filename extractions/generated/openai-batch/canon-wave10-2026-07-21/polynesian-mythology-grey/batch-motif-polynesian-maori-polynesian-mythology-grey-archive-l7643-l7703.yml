canonical_text:
  quote: ''
  summary: In this passage from the story of Maru-tuahu, two young girls encounter
    a slave at the root of a tree while Maru-tuahu watches from the top. Maru-tuahu
    is revealed when he spears a Tui, after which the girls compete over him as a
    husband. He descends, presses noses with them, agrees to come to their village,
    sends them preserved pigeons as a present, and then washes and adorns himself
    before meeting them again.
  language: English
  quote_policy: summarized
