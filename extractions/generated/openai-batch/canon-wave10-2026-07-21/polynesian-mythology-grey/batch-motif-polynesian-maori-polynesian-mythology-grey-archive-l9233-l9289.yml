canonical_text:
  quote: '"You are the water that I thirsted for."'
  summary: Te Ponga secretly follows the maiden, later named Puhihuia, to a fountain
    after she goes to draw water. At the fountain he declares his desire through a
    water image, they converse, and they arrange a time to escape together. At the
    appointed time, Te Ponga sends chosen followers to prepare one canoe for departure
    and to disable the other canoes so that pursuers will be delayed and confused.
