canonical_text:
  quote: ''
  summary: The offspring of Heaven and Earth deliberate over separating or slaying
    their parents so human beings may live. Several gods try and fail to rend heaven
    and earth apart. Tane-mahuta succeeds by bracing himself between Earth and Sky,
    despite the parents' cries, and the separation manifests darkness and light and
    reveals human beings hidden between Rangi and Papa.
  language: English
  quote_policy: summarized
