canonical_text:
  quote: ''
  summary: Manaia’s curse over underdone ritual food is reported. The wife weeps,
    performs incantations before named gods with her daughter and sister, receives
    a favorable sign for the daughter’s journey, and sends the daughter to report
    the curse to Ngatoro and relatives. The women then secretly take named gods; lacking
    a canoe, the gods serve as a canoe for crossing the sea. The passage adds that
    the first canoes from Hawaiki to New Zealand carried gods of sweet potatoes and
    fish but not gods for human beings, while prayers, incantations, and knowledge
    of enchantments were preserved in memory.
  language: English
  quote_policy: summarized
