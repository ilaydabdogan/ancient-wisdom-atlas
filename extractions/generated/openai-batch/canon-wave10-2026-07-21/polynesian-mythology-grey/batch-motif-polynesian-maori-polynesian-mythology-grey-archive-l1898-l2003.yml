canonical_text:
  quote: ''
  summary: Maui quarrels with his brother-in-law Irawaru, attacks him at a canoe,
    and by enchantment transforms him into a dog. A variant account says Maui lengthens
    a road, withholds food, puts Irawaru into enchanted sleep, and changes him into
    a dog. Hinauri searches for her husband, calls as Maui instructs, recognizes Irawaru
    in dog form, and Irawaru is described as the progenitor of all dogs. Grieving,
    Hinauri goes to the sea with an enchanted girdle, laments, recites an incantation,
    and throws herself into the ocean. Maui leaves the village and later his father
    warns that he may be overcome by the ancestress Hine-nui-te-po.
  language: English
  quote_policy: summarized
