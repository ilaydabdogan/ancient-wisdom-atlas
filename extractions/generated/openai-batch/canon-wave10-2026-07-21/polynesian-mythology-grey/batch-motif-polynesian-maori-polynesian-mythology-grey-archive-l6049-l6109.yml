  summary: Hatupatu travels to war by diving through the lake rather than using the
    canoes, arrives ahead of his brothers, and discards leaf wreaths that take root
    as trees. Later, when the war party is organized, his three brothers receive commands
    but he receives none. He asks for warriors, is mocked and dismissed, then leaves
    to prepare in a rough thicket by bundling creeping-plant roots.
