canonical_text:
  quote: he laid hold of the little fellow, and ate him up
  summary: The passage closes a genealogical notice, then introduces the legend of
    Turi's emigration. Hoiraatua's son Potikiroroa is sent to tell Uenuku, an ariki
    or chief high-priest, about a burnt-offering to the gods. The boy accidentally
    falls in the doorway of Uenuku's house, Wharekura, which is treated as an unlucky
    omen. Uenuku kills and eats him uncooked. Turi then resolves to avenge Potikiroroa
    by killing someone as payment.
  language: English
  quote_policy: quoted
