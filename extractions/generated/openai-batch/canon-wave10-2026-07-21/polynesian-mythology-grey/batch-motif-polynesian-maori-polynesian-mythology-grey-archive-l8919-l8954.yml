    Zealand. It then begins the story of Takarangi and Eau-mahora: Rangirarunga, a
    Taranaki chief, has a strongly fortified pa and a daughter famed for beauty; Te
    Eangi-apitirua, a Ngati-Awa chief, and his son Takarangi hear of her; war arises
    between their tribes.'
