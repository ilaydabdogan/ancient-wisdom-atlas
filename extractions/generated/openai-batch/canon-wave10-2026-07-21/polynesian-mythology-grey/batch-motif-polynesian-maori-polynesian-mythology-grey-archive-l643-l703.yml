canonical_text:
  quote: ''
  summary: The passage recounts how Ika-tere, father of fish or aquatic beings, and
    Tu-te-wehiwehi, also called Tu-te-wanawana, father of reptiles, divide over whether
    to flee to the sea or inland after Tangaroa flees to the ocean. Their two races
    separate into sea and forest habitats and exchange warnings about their future
    fate as food. Tangaroa then wages war against Tane because some of his children
    have been sheltered on land by the forest god; Tane provides plant-derived tools
    to Tu-matauenga's offspring for taking Tangaroa's offspring, while Tangaroa attacks
    Tane's offspring through sea, floods, waves, and erosion.
  language: English
  quote_policy: summarized
