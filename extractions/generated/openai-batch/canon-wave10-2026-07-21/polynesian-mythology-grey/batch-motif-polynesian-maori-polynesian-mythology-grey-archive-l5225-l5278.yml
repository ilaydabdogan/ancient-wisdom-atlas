canonical_text:
  quote: by her enchantments she changed them into Ti trees
  summary: Five women, borne by gods, travel across the ocean toward New Zealand,
    stop at named places, and continue inland. Haungaroa is teased for eating a long
    time, strikes and pursues two women, and changes them into Ti trees. The remaining
    women continue, rest on hills, name places, see Roto-rua and a boiling geyser,
    reach Maketu near Tuhoro, and ask for the residence of Ngatoro-i-rangi.
  language: English
  quote_policy: quoted
