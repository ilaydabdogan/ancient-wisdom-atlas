canonical_text:
  quote: ''
  summary: Whakatau cuts Hioi's tongue so that he can only mumble, then sends him
    into the Uru-o-Manono house to call out Whakatau's sister. The sister recognizes
    the act as her brother's device, meets him outside, and mourns with him over their
    dead brother. She tells Whakatau where Poporokewa sleeps, advises him to disguise
    himself, cuts his hair short, and blackens his face with charcoal. Whakatau enters
    the house as a stranger, is inspected by firelight, and recognizes Poporokewa
    by a broken tooth. The excerpt ends with Whakatau holding a coiled rope with a
    noose.
  language: English
  quote_policy: summarized
