canonical_text:
  quote: ''
  summary: Manaia's host seeks to destroy Ngatoro-i-rangi. At night, Ngatoro's aged
    wife hears the host taunting them with war-songs. Ngatoro performs incantations
    calling on winds, storms, thunder, and lightning; Tawhiri-matea responds by releasing
    destructive weather. A storm and sea waves overwhelm Manaia's sleeping host. In
    the morning, the wife finds the host dead on the beach. Ngatoro names the slaughter
    and the storm; the bodies are largely eaten by fish, and Manaia is identified
    by tattoo marks before Ngatoro lights a signal fire.
  language: English
  quote_policy: summarized
