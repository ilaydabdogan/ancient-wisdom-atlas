canonical_text:
  quote: ''
  summary: Maui undertakes a journey, takes on the appearance of a pigeon, descends
    through a hidden cave, and finds his parents among people seated beneath manapau
    trees. After provoking them by dropping berries, he allows his father to strike
    him with a stone, falls, and is revealed as a man. Taranga recognizes him as her
    child, recounts his premature sea-cast birth, and foretells his future encounter
    with Hine-nui-te-po. His father baptizes and purifies him but omits part of the
    prayers, fearing divine punishment and Maui's death. Maui then returns to his
    brothers to report that he has found his parents.
  language: English
  quote_policy: summarized
