canonical_text:
  quote: ''
  summary: Hakawau sends good genii by an incantation called a Whangai to attack the
    spirits guarding Puarata's fortress and magic head. The attacking spirits draw
    the defenders away by feigning retreat, while other good genii storm the undefended
    fortress and destroy Puarata's spirits. Puarata then calls on his magic head,
    whose powerful voice formerly killed strangers, but after the destruction of his
    spirits it can only wail. Hakawau and his friend approach the fortress, with the
    friend directed toward the gateway while Hakawau plans to climb over the parapet
    and palisades.
  language: English
