canonical_text:
  quote: ''
  summary: The passage closes a reference to Hine-Moa being remembered by her descendants
    and in song for her beauty and swim. It then introduces the story of Maru-tuahu,
    son of Hotunui, and Kahurare-moa, daughter of Paka. Hotunui is described as a
    chief who came to New Zealand from beyond the ocean in the Tainui canoe, moved
    from Kawhia to Hauraki and Whakatiwai, and left Kawhia because of a false accusation
    involving a sweet-potato storehouse, a thief, and coincidental nighttime movements.
  language: English
