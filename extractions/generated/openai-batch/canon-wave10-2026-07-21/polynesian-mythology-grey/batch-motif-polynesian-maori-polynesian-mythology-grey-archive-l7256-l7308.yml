  quote: ''
  summary: A speaker introduces the place where Hine-Moa sat after swimming from the
    mainland, then recounts the genealogy and household background of Tutanekai, Hine-Moa's
    rank and beauty, the desire of Tutanekai and his elder brothers to marry her,
    and the night music played by Tutanekai and Tiki from an elevated balcony across
    the lake toward Owhata, where Hine-Moa lived.
  language: English
