  quote: ''
  summary: The passage presents Rangi/Heaven and Papa/Earth as the primitive ancestral
    pair and source of all things. While heaven and earth still cling together in
    darkness, their children deliberate whether to kill or separate them. Tumatauenga
    proposes killing them; Tane-mahuta proposes separating sky and earth while keeping
    earth near as a nursing mother. The brothers consent except Tawhiri-ma-tea, who
    grieves and fears his realm will be overthrown.
