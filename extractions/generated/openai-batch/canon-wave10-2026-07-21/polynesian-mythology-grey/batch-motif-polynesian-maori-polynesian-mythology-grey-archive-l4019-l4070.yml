canonical_text:
  quote: ''
  summary: The passage explains ancestral separations and canoe movement from Hawaiki,
    then traces quarrels and wars to earlier events. A dog belonging to Houmai-tawhiti
    and his sons desecrates Uenuku by eating matter from his ulcer; Toi-te-huatahi
    and Uenuku kill the dog. Tama-te-kapua and Whakaturia search for it and hear it
    howl from inside Toi. After a threatening exchange, the brothers make stilts,
    go by night to the village of Toi and Uenuku, and eat fruit from Uenuku's poporo
    tree.
  language: English
  quote_policy: summarized
