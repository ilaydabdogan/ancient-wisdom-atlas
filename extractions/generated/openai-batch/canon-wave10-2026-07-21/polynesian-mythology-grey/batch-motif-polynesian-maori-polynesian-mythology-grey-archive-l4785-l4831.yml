canonical_text:
  quote: ''
  summary: After a dispute, Rua declares victory over Tama, leaves with one hundred
    and forty men to seek another dwelling, and the passage describes Tama, Rua, and
    Tu-hou-rangi as exceptionally tall figures. Tu-hou-rangi's bones are described
    as being ritually displayed by priests at sacred places and later disappearing
    after Mokoia is taken. The passage then recounts Tama's party dwelling at Maketu,
    Ngatoro-i-rangi bringing forth springs from dry valleys and placing Patupaiarehe
    on mountains, and a later removal to Tauranga where Taikehu is found fishing for
    food.
  language: English
