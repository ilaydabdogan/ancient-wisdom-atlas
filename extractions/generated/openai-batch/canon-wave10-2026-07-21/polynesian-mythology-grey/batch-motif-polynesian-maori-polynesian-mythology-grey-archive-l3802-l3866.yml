    and is alluded to in ancient poems.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tinirau resolves to avenge the death of his descendant Tuwhakararo and directs
    his wife Hine-i-te-iwaiwa to find Whakatau, whom he considers skilled in war and
    enchantments.
  category: action
  evidence_refs:
  - ev:6
