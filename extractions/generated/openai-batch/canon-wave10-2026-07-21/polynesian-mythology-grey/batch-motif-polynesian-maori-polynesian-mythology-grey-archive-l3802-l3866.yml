canonical_text:
  quote: ''
  summary: Whakatau is seen flying a kite from beneath the water, comes ashore, evades
    capture, and says only Apakura can catch him. Apakura catches and questions him;
    he says he is her child, formed by the god Rongotakawiu from her apron cast on
    the sea sands. Whakatau leaves the water, grows into a magic-knowing hero, and
    is later sought by Hine-i-te-iwaiwa at Tinirau's direction to avenge Tuwhakararo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People see kites flying in the air while Whakatau is at the bottom of the
    waters holding a kite string.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Whakatau comes onto the shore, people try to catch him, and he slips back
    into the water before continuing to fly his kite.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When people pursue him again, Whakatau says they should bring Apakura because
    she is the only person who can catch and hold him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Apakura comes, identifies herself, catches Whakatau with her hands, and asks
    whom he belongs to.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Whakatau says he is Apakura's child and that the god Rongotakawiu formed him
    from an apron Apakura had thrown on the sea sands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After this, Whakatau leaves the water and lives on shore; as a lad he flies
    kites, knows magic, has nothing concealed from him, and grows into a renowned
    hero.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator states that this second legend of Whakatau-potiki's destruction
