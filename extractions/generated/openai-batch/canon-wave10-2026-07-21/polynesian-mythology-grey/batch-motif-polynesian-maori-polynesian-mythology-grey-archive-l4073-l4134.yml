canonical_text:
  quote: ''
  summary: Uenuku and his people discover that fruit is disappearing from his poporo
    tree and find traces of Tama's stilts. They keep watch, catch Tama' and his brother
    Whakaturia while they are eating the fruit, and seize Whakaturia at the tree.
    Tama' escapes briefly, is caught at the sea-shore, tricks his captors into cutting
    down his stilts on shore rather than into the water, lands heavily, rises, and
    escapes. The village gathers to decide Whakaturia's death and hangs him in the
    roof of Uenuku's house to be stifled by smoke while they kindle a fire and perform
    dancing and singing. News reaches Tama' and their father. Tama' goes by night
    to the roof, makes a hole in the thatch, asks whether Whakaturia is dead, and
    receives a whispered answer that he is still alive.
  language: English
  quote_policy: summarized
