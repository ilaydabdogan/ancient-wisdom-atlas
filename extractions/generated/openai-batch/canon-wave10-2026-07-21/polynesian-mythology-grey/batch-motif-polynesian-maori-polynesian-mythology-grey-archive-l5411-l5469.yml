  summary: 'Ngatoro-i-rangi learns from his sister that Manaia''s tribe prays at a
    sacred place for his tribe to be brought there dead. After hearing rival attack
    plans from two chiefs, Ngatoro proposes a ruse: his men will bloody themselves,
    lie like corpses with hidden weapons, and exploit the priests'' expectation that
    their enchantments have worked. At the sacred place, prepared ovens and cooking
    materials are found, and one hundred and forty men lie in the ovens covered with
    blood.'
