canonical_text:
  quote: ''
  summary: 'The passage recounts Turi naming places, reaching the river described
    by Kupe, building and naming settlement features, cultivating sweet potatoes with
    a chant to earth, making the crop sacred by incantation, and producing an abundant
    harvest. It identifies Turi, Rongo-rongo, and their children as ancestral to named
    tribes. It then begins the legend of Manaia: Manaia summons neighbors to make
    spears; while he is away fishing, the workmen assault his wife Rongotiki. At sea,
    Manaia catches a fish hooked in the tail, understood as a sign that his wife is
    being insulted, and returns to shore, leaving the fish for Rongotiki to see.'
  language: English
  quote_policy: summarized
