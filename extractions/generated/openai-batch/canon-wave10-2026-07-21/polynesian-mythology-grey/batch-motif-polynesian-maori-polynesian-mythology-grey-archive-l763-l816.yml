canonical_text:
  quote: ''
  summary: Tu-matauenga retaliates against brothers who deserted him by trapping Tane-mahuta's
    children with tree-leaf snares, netting Tangaroa's offspring from water, and digging
    up food plants linked to Rongo-ma-tane and Haumia-tikitiki. The passage says the
    brothers are devoured or made food, while Tawhiri-ma-tea remains unconquered and
    hostile to man through storms and hurricanes. It glosses the brothers' names as
    domains of fish, cultivated foods, wild foods, and forests, birds, and insects.
  language: English
