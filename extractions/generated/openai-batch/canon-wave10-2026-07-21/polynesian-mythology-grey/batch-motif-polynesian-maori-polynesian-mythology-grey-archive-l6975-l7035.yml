  summary: The passage recounts the recognition of a young man as a son, an ambush
    and pursuit, Rongotiki’s use of the Tapuwae incantation to weaken Tupenu so Manaia
    can kill him, retaliatory attacks by Tupenu’s tribe, and Manaia’s decision to
    abandon the country, prepare the canoe Tokomaru, seek a new distant land, and
    embark with his wife and children.
