  summary: The passage explains a proposed musical notation for microtonal sharps
    and flats, including enharmonic and Arab ternal divisions. It states that accidentals
    apply only to the note to which they are attached. The commentator then remarks
    that the airs are given as well as possible, but that no clear metre or rhythm
    was discernible, and that line divisions follow those in the book. The passage
    is signed by James A. Davies and ends with a note referring to Mr. McGregor’s
    specimens of Arabian music.
