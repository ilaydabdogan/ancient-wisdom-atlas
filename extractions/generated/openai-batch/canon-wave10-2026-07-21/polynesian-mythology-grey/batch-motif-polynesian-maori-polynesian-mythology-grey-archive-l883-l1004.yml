canonical_text:
  quote: ''
  summary: The descendants of Tu-mataueno-a multiply until the generation of Maui
    and his brothers. Heaven and Earth remain separated spouses whose continuing love
    appears as mists and dew. Maui asks his brothers where their parents dwell, and
    the passage recalls how infant Maui entered an assembly, claimed Taranga as his
    mother, recounted his exposure at the sea wrapped in her hair, described his protection
    and rescue, proved his identity by naming his brothers from womb-memory, and was
    recognized and named Maui-tikitiki-a-Taranga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The children of Tu-mataueno-a are said to have multiplied on earth until the
    generation of Maui-taha, Maui-roto, Maui-waho, Maui-pae, and Maui-tikitiki-o-Taranga.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heaven remains separated from his spouse Earth; Earth's warm sighs are identified
    as mists, and Heaven's tears are identified as dew-drops.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maui asks his brothers to tell him where their father and mother dwell.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The brothers say they do not know whether the parents dwell above the earth,
    under the earth, or far away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers report that their mother used to sleep with them each night and
    disappear by daybreak.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maui says he thinks he will find the parents and tells his brothers to remain
    and listen for news of him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: During dancing in the great House of Assembly, little Maui enters, hides behind
