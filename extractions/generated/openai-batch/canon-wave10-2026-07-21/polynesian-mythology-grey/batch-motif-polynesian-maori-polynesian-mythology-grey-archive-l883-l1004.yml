  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Maui claims to be Taranga's child, while Taranga first denies the claim and
    orders him out of the house.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Maui says he was born at the side of the sea, wrapped in a tuft of Taranga's
    cut hair, and thrown into the foam of the surf.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maui says seaweed formed and fashioned him, the sea rolled him, winds drove
    him ashore, and jelly-fish protected him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Maui says flies, maggots, and birds threatened his body before Tama-nui-ki-te-Rangi
