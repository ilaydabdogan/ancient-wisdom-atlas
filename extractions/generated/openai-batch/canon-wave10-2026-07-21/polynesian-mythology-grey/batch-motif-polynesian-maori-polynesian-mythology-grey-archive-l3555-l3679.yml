canonical_text:
  quote: ''
  summary: Rata learns from a keeper that Matukutakotako lives beneath the earth,
    emerges at the new moon, and devours men. The keeper shows Rata two fountains
    and explains where Matukutakotako can be attacked without seeing Rata's shadow.
    At the new moon Rata hides by the hair-washing fountain and kills Matukutakotako,
    avenging his father Wahieroa. Rata then learns that Wahieroa's bones have been
    carried away by a distant people. He plans to recover them by making a canoe from
    a tall forest tree, but insects, birds, and forest spirits called the offspring
    of Hakuturi restore the felled tree during the night by incantation. Rata returns
    the next morning, finds the tree standing again, fells it again, and resumes shaping
    the canoe.
  language: English
  quote_policy: summarized
