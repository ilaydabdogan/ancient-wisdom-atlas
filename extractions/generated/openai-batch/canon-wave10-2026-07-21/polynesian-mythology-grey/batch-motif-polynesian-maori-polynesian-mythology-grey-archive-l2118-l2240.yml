canonical_text:
  quote: ''
  summary: Tawhaki is attacked and buried by brothers-in-law, rescued alive by his
    wife Hinepiripiri, names a son Wahieroa in connection with future vengeance, builds
    a mountain fortress, and calls on ancestral gods who send overwhelming floods.
    Tawhaki and his brother Karihi then seek revenge on the Ponaturi for killing their
    father Hema and holding Urutonga captive; they approach the dry-land night house
    Manawa-Tane of the underwater Ponaturi, where Hema's bones hang and Urutonga serves
    as dawn watcher at the door.
  language: English
  quote_policy: summarized
