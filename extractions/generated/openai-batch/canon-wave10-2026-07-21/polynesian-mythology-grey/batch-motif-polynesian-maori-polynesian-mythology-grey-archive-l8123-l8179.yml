canonical_text:
  quote: ''
  summary: Kahureremoa deceives people so they will not stop her journey, reaches
    the Waitaha village at Katikati, is welcomed as Paka’s daughter, eats there, and
    is entertained with firelight and dancing. She dances with exceptional grace,
    charming the young men. Later, when the village chief seeks her as a wife, she
    leaves at once with her female slave, crosses the river in the dark, and continues
    her journey.
  language: English
  quote_policy: summarized
