canonical_text:
  quote: "“Then arose the one hundred and forty men from the ovens, and rushed upon
    their enemies.”"
  summary: A war party associated with Ngatoro-i-rangi hides in an enemy sacred place
    and in ovens. Enemy priests arrive at dawn to make offerings, mistake the hidden
    warriors for divinely delivered corpses, and call the village to view them. After
    the rites, hidden priests from the war party kill the enemy priests as offerings,
    and the one hundred and forty men rise from the ovens and attack. Manaia escapes
    while the town is taken; the battle is named for bruised noses, and a proverb
    about storming a defeated enemy’s town is given.
  language: English
  quote_policy: quoted
