canonical_text:
  quote: ''
  summary: Maui brings up a great fish identified with a portion of the earth. He
    instructs his brothers to wait for offerings, prayers, sacrifices, and purification
    before cutting it, but they eat and cut the fish too soon. The gods become angry,
    the fish moves violently, and the island becomes rough with mountains, plains,
    valleys, and cliffs. The passage then explains that Maui used an enchanted hook
    tipped with the jawbone of Muri-ranga-whenua, and shifts to Maui extinguishing
    village fires so that fire must be sought from Mahu-ika, the goddess and ancestress
    of fire. Maui volunteers to go, is warned by his parents not to deceive her, reaches
    her dwelling, and asks for fire.
  language: English
  quote_policy: summarized
