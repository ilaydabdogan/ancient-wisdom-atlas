canonical_text:
  quote: "“they took the shadows of the ear-rings”"
  summary: At night in a forest on a lonely mountain, Te Kanawa and his companions
    are approached by fairies. The fairies watch Te Kanawa, retreat when the fire
    burns brightly, return when it burns low, and sing. Te Kanawa offers his ornaments
    on a stick to keep them from touching him. The fairies take only the shadows of
    the ornaments, pass them around, disappear, and leave the physical jewels behind.
  language: English
