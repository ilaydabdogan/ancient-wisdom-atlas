canonical_text:
  quote: ''
  summary: Kupe persuades Hoturapa to dive for a line, cuts the anchor rope after
    Hoturapa dives, leaves him in the water, and carries off Kuramarotini. Kupe then
    flees by ocean in the canoe Matahorua, discovers and circles the islands of New
    Zealand, explores Cook's Strait and Tory Channel, names an entrance, and encounters
    the great cuttle-fish or dragon Te Wheke-a-Muturangi, which attempts to seize
    and devour the canoe.
