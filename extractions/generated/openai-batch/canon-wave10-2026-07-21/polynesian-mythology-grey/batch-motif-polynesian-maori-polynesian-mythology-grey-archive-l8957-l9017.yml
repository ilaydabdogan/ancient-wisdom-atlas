canonical_text:
  quote: ''
  summary: The Ngati-A-wa besiege Rangirarunga's pa until the inhabitants suffer from
    lack of provisions and water. The aged chief Rangirarunga asks the attackers for
    water; some pity him, but others break the calabash before water reaches him.
    Rangirarunga then addresses Takarangi, the young chiefly leader marked by rank
    emblems, asking whether he can calm his fierce men. Takarangi asserts his authority,
    thinks of Rangirarunga's daughter Rau-mahora, and goes to fetch water from Fount
    Oringi while the army watches silently.
  language: English
  quote_policy: summarized
