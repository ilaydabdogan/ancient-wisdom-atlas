  summary: In this preface passage, the narrator explains that his official duties
    required direct understanding of Māori complaints, language, customs, and prejudices.
    He describes the limitations of interpreters, the emotional and practical problems
    of mediated communication, his effort to learn the language despite few resources
    and political unrest, and the need to communicate with influential rebel-party
    chiefs on questions involving peace or war.
