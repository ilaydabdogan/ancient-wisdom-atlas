canonical_text:
  quote: ''
  summary: Whakaturia performs a dance in a house, asks for the door to be opened
    for cool air, and springs outside while his brother Tama-te-kapua bolts the door
    and window, trapping those inside. A passerby later releases the trapped crowd.
    The next morning Toi and Uenuku regret that they did not kill the escapees, anticipate
    revenge for having hung one of them in the roof, and later make war against Tama-te-kapua
    and his people.
  language: English
  quote_policy: summarized
