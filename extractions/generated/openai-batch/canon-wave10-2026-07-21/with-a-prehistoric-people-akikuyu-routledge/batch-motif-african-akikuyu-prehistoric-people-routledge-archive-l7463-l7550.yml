canonical_text:
  quote: ''
  summary: The passage describes Akikuyu iron-working techniques for producing even
    iron wire. A rod is hammered, welded as needed, secured in a wooden handle, pointed
    by rubbing, passed through a selected hole in a draw-plate, and gripped with a
    hand-vice. The draw-plate and hand-vice are described in detail, including their
    parts, dimensions, local names, and the sequence by which the vice clamps the
    wire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rod of iron is produced by hammering, with additional material welded on
    as needed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After hammering, the rod in its wooden handle is held vertically and the handle
    butt is bumped on the anvil to drive the rod tightly into the handle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The craftsman reduces rod-iron into wire of an even gauge by sizing a rough
    coil according to its intended purpose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One end of the wire is sharpened by rubbing it between a maize cob and the
    surface of a stone anvil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sharpened point is passed through the selected hole in the draw-plate
    or sizing-iron called u-ta.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The u-ta is described as a flattened spindle-shaped iron bar with seven depressed
    conical cups on one face and small holes at the cone apices on the opposite face.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before use, the selected hole in the u-ta is nearly closed by tapping and
    then opened to the required size with the tapered point of an iron needle called
    mu-ku-ha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The pointed wire is passed into the base of a conical cavity in the u-ta and
    outward through the defined-size hole at its apex.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The projecting end of the wire is seized with a clamp or hand-vice called
    ru-ga.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The hand-vice is described as consisting of a split iron bar, a cold chisel
    or wedge, and a ring or collar.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The narrator says the hand-vice is cleverly designed and reports failing to
    find evidence that its design was introduced from outside.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: To use the clamp, the wedge is inserted into the split bar and tapped with
    a wooden mallet to separate the jaws enough to admit the wire and threaded draw-plate.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: When the wedge is removed, the jaws of the split bar close on and pinch the
    inserted wire.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A collar is passed over the split rod and the wedge is hammered home inside
    it, bringing the jaws together so that the wire is held immovably.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The draw-plate threaded on the wire is then placed with its extremities resting
    in notches cut at the same level in two posts, though the sentence continues beyond
    the supplied passage.
  category: action
  evidence_refs:
  - ev:12
