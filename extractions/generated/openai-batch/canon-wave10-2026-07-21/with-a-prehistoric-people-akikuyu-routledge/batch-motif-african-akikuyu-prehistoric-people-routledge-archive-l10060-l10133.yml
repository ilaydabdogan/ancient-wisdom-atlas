canonical_text:
  quote: ''
  summary: 'The passage describes plate material for Kikuyu implements: a chisel or
    axe-blade called i-than''-da, a Kikuyu axe with a rhinoceros-hide collar, and
    an agricultural digging-knife called ka''-hi-vu. It explains their construction
    and uses, including hollowing tree trunks to make mortars and bee-boxes and cultivating
    soil. It also includes plate captions for a family group showing infant-carrying
    and an acting nursemaid.'
