canonical_text:
  quote: ''
  summary: 'The passage reports Akikuyu statements and authorial analysis about N''gai:
    the deity is said to live on Mount Kenya, to be solitary, invisible, ageless,
    non-eating, without kin or messengers, and responsive to prayer. The deity is
    associated with whiteness, with Mount Kenya, with other sacred places including
    Kinangop and sacred trees, and with natural manifestations such as sun, moon,
    lightning, and rain. The passage also describes worship without handmade temples,
    directed toward nearby objects of reverence.'
  language: English
  quote_policy: summarized
