canonical_text:
  quote: ''
  summary: The passage describes several Kikuyu trial-by-ordeal procedures, including
    medicine placed on eyelids, a red-hot knife applied to tongue and foot, removal
    of hot ash from boiling water, animal-bite testing after a suspected poisoning,
    sheep killing and eating with expected divine death for the guilty, mixed urine
    drinking, and a witnessed 1908 witchcraft accusation followed by a sheep-flesh
    ordeal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ordeal procedures are described as supervised by elders and used to decide
    guilt or innocence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicine is placed on the eyelids of both plaintiff and defendant; remaining
    painful medicine indicates guilt, while falling medicine indicates innocence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Medicine-Man heats a knife red hot in fire and touches the tongue and foot
    of both parties; not being burned indicates innocence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A suspected person must remove hot ash from boiling water; in the reported
    instance, flesh came off the arm and the man was judged guilty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a suspected poisoning case, possible guilty persons are lined up, their
    nostrils are anointed with medicine, and a small animal is held to each person's
    nostrils; three people are bitten and sent to a second ordeal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the second ordeal for the three bitten suspects, a sheep is killed and
    eaten; if the suspects are guilty, God is expected to kill them within a month.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Another forced ordeal mixes the urine of the two parties, both of whom drink
    it; the guilty one is expected to die within a month, while survival of both means
    both lied.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the April 1908 witnessed case, a father accuses an old man of killing his
    son by witchcraft through sticks placed in the son's path and of causing other
    deaths in the village.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The accused asks why he had not been seized if he was believed responsible,
    and the father argues from the accused man's earlier threatening speech about
    the village.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Friends of the accused say they do not know the truth of the affair and express
    hope that the case will go to ordeal.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: A local onlooker reports that an accomplice confessed to helping buy medicine,
    store it in a tree, and place it in the deceased person's path.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The afternoon ordeal takes place on sloping ground described as a natural
    amphitheatre, with the accused crouching in the middle wearing a rough grass or
    stick collar and bearing a small female sheep across his shoulders.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: The sheep's neck has sticks through it and exposed flesh; the accused bites
    and eats some of the raw flesh, spits some on the grass, and protests his innocence
    aloud.
  category: action
  evidence_refs:
  - ev:12
