canonical_text:
  quote: ''
  summary: The passage contains an animal tale in which elephants entrust a sick female
    elephant to a hyena, the hyena eats her newborn, and the elephants later invite
    the hyenas to a dance before fighting and killing them except for one survivor.
    The survivor blames and beats his wife for advising him to attend. The passage
    then introduces Kikuyu rainbow stories, describing the rainbow as a water-dwelling
    predatory monster, glossed as Snake-Rain, associated with pools, falls, lakes,
    reflections, a tail remaining in water, and the eating of people and livestock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elephants went to take salt, and one female elephant became ill and could
    not return with the others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elephants saw a hyena's hole and entrusted the sick elephant to the hyena's
    care until she recovered.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a baby elephant was born, the hyena ate it because he thought it looked
    good.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother elephant reported the hyena's act to her returning friends, who
    were angry but invited the hyenas to a big dance instead of openly announcing
    retaliation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: One hyena consulted his wife about whether to attend the dance, and she advised
    him to go because there would be much food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the dance, a baby elephant asked a baby hyena whether it could root up
    a tree; the baby hyena said the tree was too large, and the baby elephant uprooted
    it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The elephants retrieved bones that the hyenas had gathered in a hole, made
    the bones into clubs, and fought the hyenas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The battle ended with the hyenas dead except for one later-named survivor,
    and the elephants lay down exhausted and slept.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The surviving hyena returned home, beat his wife for advising him to attend,
    and she unsuccessfully sought refuge with the elephants before returning and being
    beaten again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The printed moral says that it never pays to give advice, but adds that this
    moral is English and not Kikuyu.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The rainbow section glosses the rainbow term as Snake-Rain and introduces
    the rainbow as a predatory monster living in water.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Local narrators described a bad beast in a pool below Sagana falls that came
    out at night, climbed a tree, ate people, traveled by water to Lake Naivasha,
    and returned to its home in the falls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The observers saw a clear rainbow in the spray; the passage says its color
    or reflection could resemble a snake-like body in the water, while cautioning
    that this resemblance need not be the origin of the legends.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Additional information states that the rainbow in water and sky is the animal's
    picture or reflection rather than the animal itself; when it comes out at night
    its tail remains in the water, and it eats goats and cattle.
  category: attribute
  evidence_refs:
  - ev:9
