canonical_text:
  quote: The centre of the ceremony then becomes a special tree.
  summary: 'The passage describes parts of an Akikuyu initiation ceremony: dancing
    in an arena, ritual actions around a special tree, preparation and distribution
    of leaves and string, presentation of staves and head-dresses, procession toward
    homesteads, and marking or anointing candidates with chalk, oil, and beer.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Adult women with shaved heads take part by assuming a semi-squatting posture,
    flexing and extending the trunk, and sounding notes on bamboo tubes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaved adult women are described as becoming acknowledged as “mothers
    in Israel.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Girl relations or friends appear adorned with wreaths, while the candidates
    dance and sing down the arena, with each sex keeping together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When interest in the main entertainment wanes, men and girls form a circle
    and dance, and unmarried girls also hold dances among themselves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ceremony’s center becomes a special tree.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Boys hurl long staves over the tree; in one observed dance boys rushed singly
    from the crowd, beat the trunk, and were dragged away by an older man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Three or four men climb the tree, break off boughs, gather leaves, and hand
    leaves and bark for string to feminine relations waiting at the foot; these relations
    finish preparing the string by mastication.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Leaves and string are said to be an integral part of the ceremony, with no
    practical purpose found by the observers; they are held by the sponsor during
    the rite and later placed on the bed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the tree-material preparation ends, candidates form a semicircle at
    the tree’s foot, boys receive feather head-dresses and staves, boys and girls
    receive sticks, and each neophyte receives prepared leaves and string.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: On one occasion the candidates formed in column before the tree, two by two
    with boys first, and processed while singing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The company leaves the original dancing site and goes toward homesteads where
    the children are to reside after the initiation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At a homestead, an old man and old woman stand by a hut while candidates form
    a semicircle in front of them.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old man marks boys with chalk between the eyes, down the nose ridge, at
    the suprasternal notch, navel, big toes, and palm; girls are touched on the cheek
    by the ear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The old woman anoints each candidate on the forehead, crown of head, and throat;
    the old man and old woman blow native beer over each candidate.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The account says details vary slightly, but some form of chalk anointing by
    the man and oil anointing by the woman occurred on each occasion observed.
  category: attribute
  evidence_refs:
  - ev:8
