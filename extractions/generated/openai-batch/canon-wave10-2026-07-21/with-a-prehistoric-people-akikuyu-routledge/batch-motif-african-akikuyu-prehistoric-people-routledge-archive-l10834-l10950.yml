  evidence_refs:
  - ev:2
- id: obs:4
  text: One chief asked the narrator to camp nearer his homestead so that a visiting
    white woman would not be eaten by a lion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Small girls are described as always wearing a leather apron, while little
