canonical_text:
  quote: ''
  summary: The passage describes social respect for very old Kikuyu women, including
    an association with intelligence and burial after death; a narrator's account
    of protection by Kikuyu chiefs; and women's dress, hair shaving, ornaments linked
    to life stages, bead girdles and ear ornaments, and a razor used for shaving and
    for women's circumcision.
  language: English
  quote_policy: summarized
