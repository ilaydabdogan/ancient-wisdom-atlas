canonical_text:
  quote: ''
  summary: 'The passage describes part of an Akikuyu initiation festival: boys sing
    about not crying when cut, a boy dances on a hut roof and retrieves hidden objects
    from the thatch, gifts and manhood-associated items are displayed or distributed,
    the performance ends with piled staves and crowns and a mock beating of a younger
    boy, and the night and pre-dawn actions before cutting are described.'
  language: English
  quote_policy: summarized
