canonical_text:
  quote: ''
  summary: 'The passage describes several Akikuyu ornaments: bead necklaces and pendants
    with specified color rows, a worn bead-and-cowrie collarette made in identical
    form in two specimens, a valued milk-white pierced sea-shell disc called i-ken-i''-a
    obtained by trade with the Akam''ba, and a valuable necklace called ma-li-li-chu-a
    made by the Akikuyu from scented plant leaves said to come from near Lake Naivasha
    and formerly obtained through the Masai by trade.'
