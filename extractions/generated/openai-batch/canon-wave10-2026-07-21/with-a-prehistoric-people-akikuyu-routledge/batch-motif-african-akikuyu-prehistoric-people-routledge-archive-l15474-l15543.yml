canonical_text:
  quote: ''
  summary: The passage describes the close of a sacrifice to N'gai, including an officiant
    listening at a tree-trunk for divine instructions, communal eating of the sacrificial
    flesh, and a death penalty for unauthorized witnesses. It then describes a religious
    n'johi beer-drinking rite two days after the sacrifice, with prayers, congregational
    responses, drink sharing, an outdoor libation, and petitions for rain, fertility,
    health, livestock, goods, and blessings connected to the earlier sheep offering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man prays to N'gai for direction and places his ear against a tree-trunk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: N'gai is said to have partaken of the offering and to reply from high in the
    branches, with the words conducted through the tree-trunk to the old man's ear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man returns to the fire and his assistants, reports that N'gai accepted
    the sacrifice and gave instructions, and the assembled party eats the flesh on
    the gridiron.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that a woman, child, or anyone other than the elect who
    witnesses the ceremony is subject to death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two days after the sacrifice, those concerned gather for the drinking of n'johi,
    described as a religious rite, while the intervening day is used to prepare the
    drink.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside a dim hut, a circle of worshippers keeps silence and order while one
    voice after another prays.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The company responds with words glossed as 'Amen' and 'Hear, hear,' and n'johi
    in a metal cup is passed to the narrator, a Kikuyu attendant, and women outside.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The participants move outside, where the stated gathering includes six N'jama,
    two Kiama, one Moran'ja, Munge, and the narrator.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The leader of the N'jama pours out a drink offering while praying and lets
    a little liquor fall on the ground at the end of each sentence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: More n'johi is drunk; the wives are called up; the narrator is asked to pass
    it to them; the liquor vessel is first a horn and then a gourd.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The prayers ask for much rain, fruitful wives, protection of children from
    sickness, increase of herds, many goods, similar blessings for the white man and
    his wife, and intelligence for their servants.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: God is reminded that a sheep was given two days earlier and is asked to grant
    the requests.
  category: speech
  evidence_refs:
  - ev:7
