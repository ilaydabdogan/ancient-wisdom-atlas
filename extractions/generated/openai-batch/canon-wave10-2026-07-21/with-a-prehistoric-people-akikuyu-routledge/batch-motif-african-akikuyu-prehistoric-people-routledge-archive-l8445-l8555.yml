canonical_text:
  quote: ''
  summary: The passage describes Akikuyu methods of carrying loads with a sling from
    the forehead and the load resting on the upper back, explains the bodily posture
    and strap mechanics, contrasts this with head-loading in overhung forest paths,
    gives reported load weights for men and women, and adds a footnote comparison
    to Mic-Mac carrying practice in Newfoundland.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Akikuyu loads are placed between the shoulders rather
    than carried on top of the head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bags, baskets, firewood, baths, and sheets of galvanized iron are described
    as being corded so they can be slung from the forehead while resting on the upper
    back.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sling is usually a strong leather strap adjusted so the load rests on
    the shoulders and loins when the head and body are bent forward.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The carrier raises the arms, bends the elbows, grasps the strap near ear level,
    and may sometimes interlock the fingers over the nape of the neck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The forehead sling is said to stop the load from slipping down, keep it tilted
    forward, and ease movement shocks.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: For a temporary change, the sling may be shortened and carried across the
    chest; the passage says men do this more commonly than women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The described carrying method is linked by the author to an earlier Kikuyu
    landscape of dense forest, steep narrow winding tracks, bad surfaces, and overhanging
    vegetation resembling low tunnels.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage contrasts Akikuyu back-and-forehead carrying with the difficulty
    of foreign porters carrying heavy loads on their heads along steep, slippery,
    overhung trails.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The passage gives reported load weights: about 40 pounds for a man carrying
    for himself, 65 pounds when acting as a porter, and about 100 pounds for a woman
    carrying firewood home.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author states that Kikuyu men are unequal to loads that Kikuyu women carry
    as ordinary firewood loads.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A footnote says the author carried heavy loads in the Kikuyu way while travelling
    with Mic-Macs in densely forested Central Newfoundland, and calls it also the
