canonical_text:
  quote: ''
  summary: A woman named Kacham'bi injures a small bird after it eats her grain. The
    bird later distracts the household at a stream, kills Kacham'bi's newborn child,
    explains that the act repays her refusal of grain and the broken leg, then restores
    the child after Kacham'bi spreads out plentiful corn for it.
  language: English
  quote_policy: summarized
