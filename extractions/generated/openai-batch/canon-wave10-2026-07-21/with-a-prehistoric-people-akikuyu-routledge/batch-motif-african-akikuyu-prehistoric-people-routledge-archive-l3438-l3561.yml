canonical_text:
  quote: ''
  summary: The passage describes Kikuyu ear ornaments, distinguishing ornaments attached
    to the ear cartilage from those supported by the lobe. It details holes made in
    the cartilage for quills and other ornaments, the piercing and gradual dilation
    of boys' ear lobes before circumcision, the maintenance of dilated lobes, several
    men's cartilage and lobe ornaments, and a portrait note for Kar-ur'-i showing
    a typical Kikuyu ear with ornaments.
  language: English
  quote_policy: summarized
