canonical_text:
  quote: ''
  summary: 'A ritual at a sacred tree is described: Munge and others offer a prayer
    and pour n''johi on the tree, ask God to protect the visiting white man and his
    wife, dedicate a sheep, kill and prepare it with care around blood, fat, organs,
    and branches, cook the meat, exclude the wife from viewing men eating meat, and
    carry the meat back to the sacred tree precincts for group participation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Munge, his assistant, the N'jama, and others gather around a tree; Munge faces
    west and the assistant faces east.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Munge recites a prayer verse by verse and pours small quantities of n'johi
    over the top and trunk of the tree; others give responses, and the assistant repeats
    the procedure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the prayer, participants stand with hands held aloft.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The translated prayer asks God to accept n'johi and not let the white man
    or his wife become very ill.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prayer states that the white man came from his home through the waters
    and that Munge and the white man unite in a sacrifice to God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The prayer says an excellent fat ram or valuable sheep has been dedicated
    and will be sacrificed at the foot of a tree.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Branches are brought, the sheep is laid on its back and suffocated, and the
    carcass is placed over sacred branches so that blood should not drop to the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Munge drives a knife into the sheep's heart, and its blood is collected in
    a calabash.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The animal is flayed and eviscerated; organs are retained, fat is prepared,
    and a strip of fat is made to wrap around the tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Portions of fat, kidneys, and heart are mixed with blood in the calabash,
    and some of the mixture is placed into the stomach and ileum.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A large fire and grid are used to cook the meat, with the head roasted first
    and the lower jaw removed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The white man's wife is asked to retire because custom does not permit women
    to see men eat meat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: When ready, the meat is carried to the precincts of the sacred tree and laid
    on boughs; participants arrange themselves in three groups, and those next to
    the tree partake of the meat except one person.
  category: sequence
  evidence_refs:
  - ev:6
