canonical_text:
  quote: ''
  summary: Wam'wea is poorly received in Wachera's hut, then repeatedly speaks Wachera's
    name while driving birds from crops. Wachera hears him, recognizes him as her
    brother, and tries to summon him. He refuses because of the earlier poor treatment
    until she sends many animals. After reconciliation she adorns him with goat fat.
    He then obtains eight wives, and huts are built for them near Wachera's homestead.
  language: English
