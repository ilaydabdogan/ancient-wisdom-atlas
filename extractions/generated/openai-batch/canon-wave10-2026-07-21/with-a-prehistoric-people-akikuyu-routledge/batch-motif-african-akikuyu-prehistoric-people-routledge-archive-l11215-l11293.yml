canonical_text:
  quote: The whole of the estate—women, shambas, and goats—passes by custom to the
    custody of the heir-at-law.
  summary: 'The passage describes customary inheritance practices: a dying man divides
    goods before family and elders; estate custody passes to an adult heir, usually
    the eldest son; widows, land plots, and goats are allocated under custom, often
    with trust-like responsibilities for minors and family members.'
  language: English
  quote_policy: quoted
