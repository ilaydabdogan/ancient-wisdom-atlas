canonical_text:
  quote: ''
  summary: The passage describes decorative patterns used in connection with dancing
    before initiation, including an indented line said to have been commanded by God
    when meeting the first M'kikuyu on Kenya. It also describes colors and decorated
    objects, a floral design on a boundary tree, and boys who sing and dance while
    shaking scored gourd rattles that record their travels. The passage notes instruction
    in this singing and picture-writing, translation attempts, and the belief that
    such gourds are the only form of drawing or picture writing, with some shells
    forming part of the story and others serving as decoration.
  language: English
  quote_policy: summarized
