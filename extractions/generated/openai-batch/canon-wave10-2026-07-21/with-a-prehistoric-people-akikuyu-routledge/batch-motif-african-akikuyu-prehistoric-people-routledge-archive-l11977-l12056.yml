canonical_text:
  quote: ''
  summary: 'The passage describes preparations for Akikuyu initiation: ear-lobe piercing
    and dilation, seasonal timing after sowing and before harvest, a father''s formal
    notice that his son will be admitted to the tribe, protective measures by the
    mother against witchcraft, use of a potion and a sugar-cane arch by a medicine-man,
    and the beginning of the Great Dance near a sacred tree with candidates, mothers,
    spectators, and a chief present.'
