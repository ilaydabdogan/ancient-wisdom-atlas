  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kikuyu country is described as having many streams from nearby mountains,
    with rocky channels, steep gradients, and sudden changes in water level.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small rise in water can make a ford dangerous or impassable because of the
