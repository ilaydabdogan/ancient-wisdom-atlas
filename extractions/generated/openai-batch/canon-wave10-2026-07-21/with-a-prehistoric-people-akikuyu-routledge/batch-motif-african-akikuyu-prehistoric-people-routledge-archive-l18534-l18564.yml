canonical_text:
  quote: THE SNAKE FROM THE GREAT WATER
  summary: The passage opens a tale titled “The Snake from the Great Water,” attributed
    to Mo-s6-Ni. Two warriors travel to find wives. Wa-m'wer'i chooses a one-eyed
    girl he meets on the road, while Wa-du-a continues onward and repeatedly asks
    people about maidens. Several informants mention Wa-shu-ma, a maiden who will
    not speak to or be wooed by men. On the eighth day, Wa-du-a learns the direction
    of her home, identified by smoke rising on an opposite hillside, and sleeps on
    the road that night.
  language: English
