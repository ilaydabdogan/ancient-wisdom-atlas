canonical_text:
  quote: ''
  summary: 'The passage first describes a tunnel fall or similar accident being attributed
    to an offended spirit living in the earth; the response is a goat sacrifice, abandonment
    of rescue, and diversion of the tunnel. It then describes Kikuyu pottery practice:
    winnowing sand, moistening clay, kneading sand and clay, storing materials, and
    forming the upper half of a pot by hand, with the woman working near the homestead
    and carrying a sleeping baby on her back.'
  language: English
  quote_policy: summarized
