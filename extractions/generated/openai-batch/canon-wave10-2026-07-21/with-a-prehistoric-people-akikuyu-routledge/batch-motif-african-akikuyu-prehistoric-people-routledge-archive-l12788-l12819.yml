canonical_text:
  quote: All round are called to see that the blood is mingled, and hear the proclamation
    that the two are now of one blood.
  summary: The passage describes a public ceremony for receiving a stranger into a
    district. Each party brings an animal, the animals are killed, blood and parts
    of the animals are prepared, wristlets are exchanged and worn, blood is mingled
    in the participants' palms, and the participants are proclaimed to be of one blood.
    The district representative's mother then shaves the newcomer’s head as if he
    were her own child, and a drinking festival is held on the third day.
  language: English
  quote_policy: quoted
