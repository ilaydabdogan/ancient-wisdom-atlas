  summary: The passage describes a smith seated on the ground making chain links with
    an anvil, roller, and chisel. A single blow changes a rounded link into an oblong
    form and brings its ends into opposition. The chain is burnished with sand and
    polished by wear. The passage also gives details about uncommon fine copper chain
    and everyday steel chain, including link counts, lengths, and weights.
