  quote: ''
  summary: The passage describes Kikuyu clan marks on bee boxes, provides a list of
    clan names, and states that clan traditions are hereditary and differ especially
    in food rules. It describes a dying father transmitting instructions to his sons
    and invoking a dying curse on those who depart from them. It also notes uncertain
    reports of land entailed by parental direction and names several clans said to
    be permitted to eat wild game, with a footnote caveat for one Anjiru member.
