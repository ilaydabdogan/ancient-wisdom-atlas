canonical_text:
  quote: ''
  summary: A Medicine-Man conducts a purification service using medicines mixed in
    water, brush-handles placed in the mouth and on the body, repeated commands and
    formulas about spitting out sin, applications of medicine and white powder, ingestion
    of medicinal substances, and disposal of the used water and materials away from
    camp. The passage also begins a second observed purification near Ny'eri involving
    a man, his wife, and a Medicine-Man outside a hut.
  language: English
  quote_policy: summarized
