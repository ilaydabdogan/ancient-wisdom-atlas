  quote: ''
  summary: 'Plate captions describe stages in hand-building Kikuyu pottery: shaping
    the upper half of a pot with hands and gourd-shell tools, adding decoration and
    handles, inverting the completed upper half, adding clay rolls to complete the
    base, and noting a women''s grooming and ear-adornment custom shown in one plate.'
