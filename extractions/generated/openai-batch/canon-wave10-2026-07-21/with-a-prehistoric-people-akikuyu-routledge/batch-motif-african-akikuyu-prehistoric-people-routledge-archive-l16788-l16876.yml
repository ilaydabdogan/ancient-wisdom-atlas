canonical_text:
  quote: ''
  summary: 'The passage gives examples of divination and ritual response among the
    Akikuyu: an oracle by lot diagnoses illness in relation to a dead brother''s spirit
    and a disputed shamba; a Kikuyu Medicine-Man prescribes a sheep sacrifice for
    a pregnant Masai woman; beer is made and poured out as a drink offering for a
    recently dead spirit after livestock mortality; and an observed future-divination
    session uses a fee, a calabash of white chalk, invocations, chalk marks on the
    diviner and lot-gourd, directional invocation, and counted counters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the shamba case, one brother became ill and died after the shamba fell
    ill, another brother took possession and then also became ill, and the father
    sought advice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The oracle, by lot, stated that the young man was ill because he had eaten
    food from the shamba which the brother's spirit did not wish him to have, and
    that he should give it up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A later report of the same sitting stated that the patient would recover if
    he consumed the soothsayer's medicine, without surrendering the disputed plot.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A pregnant Masai woman with unusual severe pains was attended by a Kikuyu
    Medicine-Man, who cast the numbers and said sacrifice was necessary.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sacrificial sheep had a white face and was held on its hind legs facing
    the hut door; Lou-be-a said a prayer asking God to accept the fat and let no one
    present be ill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Medicine-Man specified that the sacrifice must be made and paid for by
    the eldest son at home, not by the husband; the passage gives the costs of sheep,
    fee, drink, and honey.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A family was making beer because of high flock mortality; after consultation,
    the Medicine-Man ascertained that a recently dead man's spirit desired a drink
    offering, and n'johi was poured out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: For an observed future-divination session, a shady spot under large trees
    was chosen, a mat was placed on the ground, the Medicine-Man sat on a stool, others
    squatted, and an advance fee was given.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Medicine-Man took a calabash containing white chalk from his medicine
    bag, held it aloft, invoked the god of Kenya and Kinangop, asked for intelligence
    and instruction, and marked the outer angle of his right eye with the chalk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The gourd containing the lots was dedicated with chalk marks, then held aloft
    toward each of the four quarters while God was invoked for truthful and clear
    instruction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Counters were thrown out and counted into heaps; a remainder of three was
    taken to mean that proceeding with lot-casting was permitted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator explicitly compares the foretelling of future events by lot with
    Bond Street fortune-telling, while noting that Bond Street uses cards or palmistry
    rather than lots.
  category: other
  evidence_refs:
  - ev:4
