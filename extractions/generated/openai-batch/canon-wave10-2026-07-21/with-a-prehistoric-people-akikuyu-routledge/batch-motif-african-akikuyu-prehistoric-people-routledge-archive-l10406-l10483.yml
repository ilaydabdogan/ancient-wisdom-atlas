canonical_text:
  quote: ''
  summary: The passage describes Kikuyu marriage procedures involving the bride's
    visit to her mother's house, escort by girls connected with the bridegroom, later
    payment of goats to the bride's father, preparation and inspection of the bride's
    ground, gifts of arum lily roots and an iron collar, provision of hearth-stones
    by the bride's mother, and an observed return visit of a recently captured bride
    to her natal home. The author interprets the bride's seizure by the bridegroom's
    friends as a survival of marriage by capture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride puts fat on her head and is accompanied by two girl friends of the
    bridegroom to her mother's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride stays at her mother's house for three hours, makes noise there,
    and is then taken back by the two friends; the bridegroom later comes and sleeps
    in the hut.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Afterward, the bridegroom gives the bride's father the remaining ten goats
    and one additional goat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ground prepared for the bride is inspected by her father, and productivity
    rather than size is stated to be the criterion.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: If other wives already live in the homestead, the shambas are readjusted so
    that each wife has a share in the new ground.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The bride's father gives two hundred roots of the arum lily plant and an iron
    collar as wedding presents.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The bride's mother is responsible for providing hearth-stones and goes with
    the bride to the riverside to select them; if the mother is dead, the daughter
    provides them herself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bride is described as being seized by the bridegroom's friends, and the
    author says her captors may appear at any moment to bear her off.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the witnessed return visit, the bride arrives at her old home sobbing,
    adorned with fat and red ochre, and is held by her mother and another mother of
    the homestead.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Two gala-dressed girls follow the bride into the hut; later information says
    such girls each hold one of the bride's hands on the return journey.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator is told that the bride had been carried off four days before
    the witnessed return visit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A footnote states that a Kikuyu girl's tears can sometimes be genuine and
    that she can explain them as such.
  category: speech
  evidence_refs:
  - ev:8
