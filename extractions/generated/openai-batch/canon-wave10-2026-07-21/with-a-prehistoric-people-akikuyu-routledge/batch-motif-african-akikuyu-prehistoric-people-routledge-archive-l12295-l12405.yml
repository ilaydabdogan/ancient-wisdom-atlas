canonical_text:
  quote: "“You have now finished being a boy, and are become a man.”"
  summary: 'The passage describes the Akikuyu day of initiation and subsequent ceremonies:
    boys bathe before sunrise, are supervised and accompanied by ritual attendants,
    undergo circumcision with sponsors supporting and then covering them, and retire
    for convalescence. Girls undergo a similar bathing and operation, supported by
    women. Later proceedings include inspection, encouragement, and a ceremony called
    Ku-to-ni-a in which old men and women tie named plant materials into one ear lobe
    and mark the transition into manhood or womanhood.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Boys are divided into parties for the rite, which is performed near the homesteads
    where they will later reside; a specialist circumcisor travels from group to group.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before sunrise, boys bathe in a brook, dip themselves to the waist, raise
    their arms, shake their wrists with fingers extended, and continue the circumcision
    song.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Warriors supervise the bathing; mothers are present; officials with banana-stalk
    batons hold spectators back from the bank; the boys are stripped, without ornaments,
    and shaven.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A procession reforms to a selected site described as a steep hillside facing
    east, where the boys sit in a row supported by sponsors holding tied leaves.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the operation on the boys, the sponsor throws a cloak completely over
    the boy, initially concealing even his features.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Girls bathe in a similar manner, are arranged in a row, and are held by two
    sponsors; an old woman performs the operation with a razor used for shaving the
    head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Silence is maintained, and neither boys nor girls make any audible sign of
    emotion.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the ordeal, children return to villages for convalescence; boys are
    housed in a temporary hut called the ki-kan'-da and cared for by two young men,
    while girls gather in a mother's hut and are cared for by women.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The concluding proceedings are reported from four Kikuyu followers rather
    than from direct observation by the authors.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: A ceremony called Ku-to-ni-a is described as ushering in manhood and womanhood
    and as completing the ear-lobe custom by tying plants into the lobe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Three old men and three old women are celebrants outside the mother's hut;
    named plant materials are placed or tied in one ear lobe, and the youth is admonished
    that he has finished being a boy and become a man.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Only one ear is treated; the same process is used for girls; remaining leaves
    are put above the door of the mother's hut.
  category: action
  evidence_refs:
  - ev:10
