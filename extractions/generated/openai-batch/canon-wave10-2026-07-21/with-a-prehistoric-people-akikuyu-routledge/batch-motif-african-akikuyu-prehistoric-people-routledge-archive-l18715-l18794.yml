canonical_text:
  quote: ''
  summary: M'wambia identifies himself, and N'jenge beings remove spikes from around
    him; the N'jenge whom he had previously set free removes the remaining spikes
    and enables him to descend from a tree or bush stem. This N'jenge opens a hole
    in his side and produces animals for food, after which M'wambia regains strength.
    The N'jenge then grants M'wambia large herds and livestock for acquiring wives.
    M'wambia builds a village by the Gura river. A young daughter sent to gather vegetables
    recognizes the lost M'wambia herding goats, receives goat meat from him, and returns
    home asking for a large cooking pot.
  language: English
  quote_policy: summarized
