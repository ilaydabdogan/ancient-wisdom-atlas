  quote: ''
  summary: 'The passage describes Kikuyu official ranks and institutions: a restricted
    herbage bunch associated with authority and curse, the N''jama as a young men''s
    executive or policing body with roots in war leadership, admission by consent
    and goat payment, the asikari retainers of a chief, and the ranked arrangement
    at a drinking party hosted by Chief Munge.'
  language: English
  quote_policy: summarized
