canonical_text:
  quote: ''
  summary: 'The passage describes two Akikuyu hair-dressing methods: one using bark
    fibres twisted into small hair tufts to form cord-like locks with front pendants,
    rear fringe, and pigtail, then anointed with red ochreous clay and sheep-tail
    oil; another using stripped vulture wing plumes attached to hair tufts on the
    crown and arranged by curl. A Plate X caption inventories the ordinary dress of
    a Kikuyu warrior, including feather hair-dressing, shaved forehead, bead fillet,
    earrings, collars, necklaces, red ochre and fat on the body, shell strap, garment,
    arm ornaments, sword, spear, and bracelets.'
  language: English
  quote_policy: summarized
