canonical_text:
  quote: ''
  summary: A hyena befriends Sungura and demands food. Sungura eventually brings honey,
    which the hyena overeats and tries to keep from escaping by sealing his mouth
    with sticks. Kihuru later removes the skewers and becomes trapped in the honey
    until rain frees him. Kihuru then tricks assembled hyenas with a gourd of white
    juice described as fat from the stars, carries them high into the air, shakes
    them off, and nearly all die. One female hyena survives with a broken leg and
    becomes the ancestress of later hyenas, explaining why hyenas limp.
  language: English
  quote_policy: summarized
