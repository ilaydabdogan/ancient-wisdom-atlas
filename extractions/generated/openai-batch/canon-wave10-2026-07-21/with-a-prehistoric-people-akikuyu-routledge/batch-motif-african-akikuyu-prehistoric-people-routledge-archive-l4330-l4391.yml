canonical_text:
  quote: ''
  summary: Plate XXVII describes armlets, bracelets, and an ankle charm. The arm ornaments
    include ivory, wood, buffalo horn, and iron wire forms, some decorated or fitted
    with copper and brass wire. A market specialist fits certain wire ornaments to
    the limb so that they cannot be slipped on or off. The ankle charm is worn to
    prevent fatigue while travelling and consists of three solid wooden cylinders
    on a leather thong; it is said not to contain medicines and was obtained from
    a Meru person near Mt. Kenya.
  language: English
  quote_policy: summarized
