canonical_text:
  quote: ''
  summary: 'The passage describes Kikuyu customs surrounding birth: sheep-killing
    when an infant will not take milk, reluctance to allow a stranger into a birth
    hut, immediate naming by kin names, practices concerning births considered unlucky,
    substitutional offerings or anointing in some cases, a ceremony in which a small
    child receives wristlets and is acknowledged as M''kikuyu, and a later childhood
    stage when a boy begins minding goats and receives a sheep.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If an infant does not take its mother's milk satisfactorily, a sheep is killed
    at once rather than waiting for the later purification feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dangerously ill woman in confinement was reportedly brought outside the
    hut and placed on a skin on the ground, because of reluctance to let a stranger
    enter the hut at that time.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A child is named immediately at birth according to custom, first after the
    father's parents and then after the mother's parents according to sex.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a homestead with several wives, multiple boys may share the paternal grandfather's
    name, with distinctions made by prefixes or nicknames.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: First-born twins are described as unlucky and may both be killed, or sometimes
    only the last one; the stated reason is that they are thought to prevent later
    childbearing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Triplets, feet-first births, and children who cut upper teeth first are listed
    among births or infants treated as unlucky, with killing or substitutional offering
    mentioned for some cases.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: When a child touches the ground at birth, the father kills a sheep and the
    midwife anoints the infant with contents from the sheep's stomach before washing
    and returning the infant to the mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An ill-omened child is described as either suffocated by the mother or put
    out in fallow land with grass placed in its mouth and nostrils.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A ceremony for a very small child is connected with acknowledgment of nationality
    and the parents' resumption of matrimonial life.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In that ceremony, the father kills a sheep, later puts wristlets on the child,
    and the child is said to become M'kikuyu.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Two children about six years old fetch water in upright gourds, receive sheep
    legs as rewards, and remain in the village that day to avoid bad luck from possible
    bleeding if they walk abroad.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: When a boy becomes old enough to mind goats, he receives a sheep from his
    father and distributes specified portions to his mother and father while he and
    his friends eat the rest.
  category: sequence
  evidence_refs:
  - ev:11
