canonical_text:
  quote: ''
  summary: 'The passage describes Kikuyu pottery manufacture: porous pots made from
    blue clay and soft sand, the geography and scarcity of deposits, women specialists
    who produce and market pots, clay drying and preparation, destruction of the deceased''s
    pots at death, risks of sand mining, and a plate note on a winnowing tray and
    household stool.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that porous pottery is similar in form, character, and
    ornamentation to prehistoric pottery of Britain, and is made from blue clay mixed
    with soft sand.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soft sand is identified as li-um'-ba, described as disintegrated granite
    rock with quartz grains, felspar, and mica flakes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The clay and sand deposits are ten miles apart, and pottery is made near the
    sand deposit, which is mined in a hillside on the bank of the Gu-ra River.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage describes sharp sand as scarce in Kikuyu and explains that streams
    run in basalt channels with boulders and alluvial mud under deep red volcanic
    soil.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pottery making is described as exclusively the work of women of a few families
    near the sand deposit; they fetch materials, make, dry, burn, and carry pots to
    markets.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Every death is said to require the destruction of all pots belonging to the
    deceased.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Clay for pottery is carried from a marsh in wicker panniers and spread in
    the sun to dry as small rough pieces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The stated explanation for drying the collected clay is that the water in
    it is "bad"; the passage says no further explanation is given.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After drying, the clay is placed in a banana-leaf-lined elliptical hole in
    the ground, moistened into a plastic mass, and then called n'daka.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sand is brought from the mine in woven bags; miners tunnel into the hillside
    without support, and the passage says the miner is eventually overwhelmed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A ki-ta-ru'-ru tray is described as used for winnowing grain and also sand
    in pottery-making.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: A stool is described as the universal form found in every Kikuyu home and
    carved from a solid piece.
  category: object
  evidence_refs:
  - ev:9
