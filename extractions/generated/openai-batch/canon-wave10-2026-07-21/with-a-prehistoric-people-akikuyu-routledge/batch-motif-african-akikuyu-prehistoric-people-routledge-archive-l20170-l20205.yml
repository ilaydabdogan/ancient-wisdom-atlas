canonical_text:
  quote: ''
  summary: 'Professor Gowland comments on Akikuyu iron-ore smelting: ore is washed
    to concentrate iron-bearing material, then smelted in alternating layers with
    charcoal using bellows in a shallow furnace or hearth, producing wrought-iron
    blooms. He compares the preparation and smelting methods with practices or remains
    from Mexico, early Europe, India, Japan, Kordofan, and the Catalan furnace.'
  language: English
  quote_policy: summarized
