canonical_text:
  quote: ''
  summary: 'The preface passage describes the author''s methods for collecting information
    among the Akikuyu: travel, photography, note-taking, friendships with influential
    men, help from a chief''s younger brother, evening conversations around a fire,
    later participation by the author''s wife, use of Swahili and interpreters, and
    safeguards against misunderstanding or leading questions.'
