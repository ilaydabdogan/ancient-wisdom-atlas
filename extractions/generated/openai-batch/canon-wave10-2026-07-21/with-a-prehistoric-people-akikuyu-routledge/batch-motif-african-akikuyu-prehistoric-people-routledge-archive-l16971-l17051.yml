canonical_text:
  quote: ''
  summary: 'The passage describes the importance of charms among the Akikuyu and gives
    two observed examples of charm manufacture by medicine-men: one for protecting
    a white man from lions or bad beasts, and one for defending a white woman from
    evil. The rites use medicines in bottles, powders, water in a calabash, circular
    motions around the head, bodily touching or anointing, tasting, spitting, formulae,
    and a wearable package.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Charms or medicines are described as common among Akikuyu men and women, attached
    to the lower border of a broad waist-band and sealed in small sheep's horns; they
    are also used for protection and usually made by Medicine-Men.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first example, an old male practitioner arrives with an assistant,
    a small son, a bag of medicines, bottles, and a calabash, after a charm is requested
    for protection from lion attacks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first practitioner initially proposes that the lion should run away when
    seeing the applicant, but the applicant asks that the charm be adjusted so he
    can first obtain a shot.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The practitioner fills the calabash halfway with water, mixes powders in his
    palm, draws the mixture across his tongue in the form of a cross, puts mixture
    into the water and into four divisions made by the supporting thongs, and utters
    formulae.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The practitioner whirls the calabash around his head and addresses each of
    the four quarters of heaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Red powder and black powder are applied to multiple parts of the applicant's
    body, including crown, ears, elbows, knees, feet, shoulders, hair, and head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A quill is used with powder and the brew; the practitioner stirs, tastes,
    puts the quill in his mouth, places it in the brew, and also puts it in the assistant's
    mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The quill is waved five times around the patient's head and touches his tongue
    five times; the brew is sipped, spat, stirred, tasted, swung around the head,
    tasted by the patient, and accompanied by spitting to right, left, and front.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The patient repeats the formula, “Bad beasts, do not harm me,” swallows a
    little of the brew, and receives powder tied in a little package to be worn.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the second example, another practitioner works a charm to defend a white
    woman from evil, passing a medicine bag nine times around her head with an invocation
    and then passing bottles six times around in alternating directions.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The second charm-making account begins to describe two powders, red and black,
    being mixed in the palm, but the supplied excerpt ends before the action is completed.
  category: sequence
  evidence_refs:
  - ev:9
