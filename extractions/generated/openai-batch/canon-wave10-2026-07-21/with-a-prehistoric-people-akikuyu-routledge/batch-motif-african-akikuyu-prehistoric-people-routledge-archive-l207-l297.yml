canonical_text:
  quote: ''
  summary: 'The passage describes colonial administrative expansion in Kikuyu territory:
    establishment of a station at Nyeri, an episode in which elders seeking to accept
    government authority are killed by opponents, official demands for surrender and
    fines, threatened punitive expeditions, road-making as indemnity and access, and
    the narrator''s camp near wilderness with wildlife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Junior officers were assigned to the sub-commissioner, enabling the establishment
    of a station at Nyeri under Mr. C. W. Neligan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three elders came to the sub-commissioner and said people of their district
    were prepared to accept the White Man's Government and would not resist its orders
    by arms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elders said they had begun as a group of five, but two members had been
    killed on the road by fellow-tribesmen from a district opposed to submission to
    the white man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mr. Hinde received the three surviving elders, explained the advent of the
    white man, gave them presents, dismissed them, and none of the three reached home
    alive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Leading men of the guilty district were summoned to the Fort and came without
    hesitation or mistrust.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sub-commissioner demanded that the murderers be surrendered and a heavy
    cattle fine paid, or else war would follow after a fixed date.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator states that, in such cases of noncompliance, Masai, native troops,
    and police would scour the country; men would be killed, and women, children,
    and herds taken captive until submission was secured.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The indemnity exacted from local people often included road-making, described
    as a government means of making newly acquired territory accessible for troop
    movement.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A road is described as a cleared track about twelve feet wide; the Akikuyu
    are said to dislike roads and to avoid making visible tracks when possible.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The narrator was present at the selection of the Nyeri station site and obtained
    and entrenched a small nearby plot with a stone room and bandas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: From the narrator's door northward there was wilderness toward Abyssinia,
    with lions as visitors and rhinoceros abundant.
  category: setting
  evidence_refs:
  - ev:7
