canonical_text:
  quote: ''
  summary: The passage describes Masai settlement organization, cattle-centered livelihood
    and raiding, the return of a raiding party with song and spear display, warrior
    frenzy restrained by an elder, warpath camp practices around fires, bodily adornment,
    endurance, diet, and limitations in cover or at water crossings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A manyatta is described as containing children, married and marriageable women,
    married men who have finished military service, and youths not yet admitted as
    warriors; a nearby manyatta contains warriors and girls not yet marriageable under
    a legooran or colonel.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Masai do no work beyond tending cattle and raiding, and
    that they do not hunt, eat wild animals or birds, cultivate, trade, or manufacture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cattle raid is reported in which thirty men were killed during the raid
    and sixty more were killed afterward in a quarrel over distribution of loot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The return of a raiding party is introduced by the Blood Song, public excitement,
    captured cattle coming into view, and warriors moving in compact formation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Returning warriors mark the rhythm of the song by tossing and catching spinning
    spears whose bright blades reflect sunlight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The warriors' song recounts what they have done and will do; under its influence
    an individual may enter a frenzy, lose self-control, and require disarming and
    restraint.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: An old man heads the returning procession as it approaches the crowd so that
    he can order any overly excited warrior to be disarmed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Warriors are described as lean, gaunt, tall, taciturn, tireless in movement,
    capable of unusual endurance, able to eat very large quantities of meat or go
    without food, and receiving a ration of sheep and milk in the manyatta.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the warpath the warriors are said to march and fight all day, eat and sing
    around fires all night, and post no sentries or watch.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The warpath camp arrangement places men in small circles around fires, with
    each shield behind its owner and held by a spear driven into the ground.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The warriors are described as unclothed but groomed, rubbed with mutton fat
    and red ochre, with dressed hair and burnished arms and ornaments.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage describes the Masai as effective fighters in the open plains but
    ineffective against an enemy in cover, and says they will not cross an unwadeable
    stream or learn to swim.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage characterizes the Masai as brave and willing to risk their lives
    in war for distinction and plunder.
  category: attribute
  evidence_refs:
  - ev:10
