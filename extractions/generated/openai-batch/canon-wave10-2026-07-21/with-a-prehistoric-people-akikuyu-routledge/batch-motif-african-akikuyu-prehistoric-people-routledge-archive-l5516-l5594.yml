canonical_text:
  quote: ''
  summary: The passage describes Akikuyu bee-box construction, placement, marking,
    honey gathering, and the seriousness of honey theft, then turns to salt scarcity
    and the use of papyrus ash as a substitute for salt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bee-boxes are placed for wild bees to build comb in and to protect the comb
    from honey-eating birds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bee-boxes are made from short tree-trunk lengths hollowed with a long-shafted
    axe-like tool; the passage states that making bee-boxes is always men's work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The finished bee-box resembles a headed barrel, and no deliberate bee-entry
    holes are made; bees enter through gaps in the end-pieces.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bee-boxes are laid on forked branches in isolated trees and fastened with
    tough creepers.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sweet-smelling flowers are tied to one end of a new bee-box to attract bees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Akikuyu are said not to suspend bee-boxes beneath branches with a span
    and bridle, unlike the Akam'ba; the author notes this in relation to a claimed
    Akam'ba descent connection.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In some parts of Kikuyu near the Akam'ba border, bee-boxes are ornamented
    with simple poker-work designs, while in the described area this is not done.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: It is usual for a man to brand his bee-box with a clan design.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Theft of honey from bee-boxes, even when the boxes are miles from the owner's
    home, is described as a serious recognized offence.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Honey is gathered at night; bees are driven from hives by smoked torches,
    and honey is collected into leather bags.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The honey is eaten without separation or purification and is also used to
    prepare a drink.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: No saline deposits are known in Kikuyu, and coarse salt has been obtained
    through caravans or possibly trade through the Akam'ba.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The people generally used ash from burning papyrus rush as a salt substitute,
    though trade salt is described as rapidly displacing it.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The Akikuyu are said not to show a special craving for salt, though they appreciate
    it as a gift.
  category: attribute
  evidence_refs:
  - ev:11
