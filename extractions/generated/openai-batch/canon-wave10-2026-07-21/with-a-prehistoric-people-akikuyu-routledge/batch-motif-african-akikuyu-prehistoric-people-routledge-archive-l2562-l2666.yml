  quote: ''
  summary: The passage describes Akikuyu contact with Masai, Somalis, N'dorobo, Akam'ba,
    coastal caravans, and Arab or slave raiders. It emphasizes Akikuyu imitation of
    Masai martial appearance and weapons, a reported Somali incursion, limited trade
    with the coast, absence of slavery as an institution, and details of Kikuyu weapons,
    defenses, and sword terminology.
