canonical_text:
  quote: ''
  summary: After Wagacharaibu dismisses his sister M'wer'u's warning, three armed
    men abduct her. He hears her distant voice, pursues for a long time, survives
    by eating his goatskin hat and skin garment, and reaches a homestead. There, a
    bird-scaring refrain about the lost M'wer'u leads the woman of the homestead to
    recognize him as her brother. She then obtains animals from her husband, who had
    carried her away, and begins restoring Wagacharaibu with food and hair dressing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: M'wer'u says three men had come while she was alone, each with a club and
    a spear, and warns that they will return and carry her off if Wagacharaibu leaves
    her alone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wagacharaibu dismisses M'wer'u's warning as nonsense and leaves again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Three men return with three clubs and three spears, seize the girl by the
    neck and legs, lift her, and carry her away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wagacharaibu finds the house empty and hears his sister's voice from the opposite
    hillside saying that men have carried her away and that gruel is on the stool
    in the hut.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wagacharaibu cries that there are no neighbours and asks who will shave the
    front of his head now that M'wer'u is gone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wagacharaibu follows into the grass; he and M'wer'u can hear one another's
    voices but cannot see one another, and the farther he goes the farther she is
    carried from him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the long pursuit, Wagacharaibu becomes hungry and eats pieces of his
    goatskin hat and then his skin garment or cape while continuing to travel.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: At a large homestead, Wagacharaibu sees a woman cooking, begs for food, receives
    some in a broken piece of an old pot, and sleeps there that night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: While scaring birds from the crops with the woman's little son, Wagacharaibu
    throws stones and repeats a refrain comparing the birds' flight to M'wer'u's disappearance.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The little boy reports Wagacharaibu's words to his mother; on the third day
    she goes to the fields herself and hears the refrain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman is named M'wer'u; after Wagacharaibu explains that he had a lost
    sister named M'wer'u, she weeps and asks whether he is truly her brother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: M'wer'u says she did not recognize Wagacharaibu because his hair is unkempt
    and his clothes are changed by long travel, and she proposes to dress him as in
    former times to see whether he is truly her brother.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: M'wer'u goes to her husband, who had carried her away in the old days, obtains
    four sheep and three goats, has the sheep killed, gives Wagacharaibu flesh to
    eat, and uses fat to dress his hair and shoulders.
  category: action
  evidence_refs:
  - ev:8
