canonical_text:
  quote: ''
  summary: The passage describes Kikuyu accounts of a dwelling-place of the dead,
    Mi-i-ri-niya Mi-kon-go-i, including a dark abode from which spirits cannot emerge
    and a camp-fire account of a cold underworld inhabited by many bad spirits. A
    narrated tale tells of a living man who follows a speared porcupine through a
    burrow into this underworld, is captured for many years, escapes through a hole
    by a large tree and a long passage, reaches a fire that prevents pursuit, returns
    home, recounts his experience, and dies three days later.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some departed spirits are said to move freely, while others have passed into
    animals or possibly elsewhere, and there is also a dwelling-place of the dead
    called Mi-i-ri-niya Mi-kon-go-i.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mi-i-ri-niya Mi-kon-go-i is described as an abode of the departed, especially
    the dead of bygone generations, where spirits cannot emerge and where it is dark.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: One informant says there is no God of evil, but there is a dwelling-place
    where many bad spirits, including men, women, and children, live.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bad spirits are said to possess many cattle, sheep, and goats, to live
    in terrible cold, to have only a small scrap of skin for covering, and to be unable
    to approach fire.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man keeping night guard over ripening maize is armed with a spear and sword.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man spears a damaging porcupine, follows it into high grass, then down
    a large burrow that extends a long distance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The burrow opens out, and the man finds himself among the bad people, who
    are numerous and accompanied by cattle, goats, and sheep in a very cold place.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bad people ask why the man has come, then seize him, bind his arms, and
    keep him for many years.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The man sees a great hole at the foot of a big tree, makes an excuse to retire,
    enters the hole, and runs through a long passage that goes first up and then down.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bad people pursue him, but when he reaches a fire they cannot seize him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man returns to the place where the speaker’s brother lives, tells the
    gathered people what happened, and dies three days after speaking.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage notes that in the first of the recorded folktales, a heroine also
