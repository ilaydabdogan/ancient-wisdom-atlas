canonical_text:
  quote: ''
  summary: 'The passage introduces Appendix V on the place of Kikuyu thought in comparative
    religion. It says the Routledges'' statements on Akikuyu religious thought and
    ceremonies are field observations, submitted to R. R. Marett for assessment. Marett
    praises their methods of distinguishing direct observation from hearsay, preserving
    variant performances or tellings, and identifying informants. He then identifies
    two broad comparative questions: whether Tylor''s animism accounts for primitive
    religion, and whether primitive religion and magic share something in common.'
  language: English
  quote_policy: summarized
