  summary: The passage describes difficulties in documenting Akikuyu political organisation
    after British conquest. It presents the homestead as the basic social unit, describes
    small military groupings under headmen, notes weak obedience and district variation,
    and describes neighbouring headmen consulting a Medicine-Man before attack through
    a council, sheep killing, lot-casting, and a charm worn by a headman.
  language: English
