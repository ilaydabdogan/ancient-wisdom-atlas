  summary: The passage describes Kikuyu clan distinctions, including food taboos explained
    by an origin tradition of two brothers, prohibitions on iron working and circumcision
    duties, special powers and obligations attributed to the M'wesaga/M'wizaga clan,
    medicine-man countermeasures, and footnoted notes on totemic clans, clan medicine
