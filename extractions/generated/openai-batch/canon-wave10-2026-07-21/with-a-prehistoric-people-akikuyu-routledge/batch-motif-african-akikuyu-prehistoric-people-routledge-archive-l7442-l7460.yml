  summary: The passage describes a smith preparing a stone anvil, a bellows boy starting
    the blast, and a piece of iron being heated in coals, removed with tongs, hammered
    on the anvil, fitted with a wooden handle, and worked into a long rod whose section
    is first square and then partly rounded.
