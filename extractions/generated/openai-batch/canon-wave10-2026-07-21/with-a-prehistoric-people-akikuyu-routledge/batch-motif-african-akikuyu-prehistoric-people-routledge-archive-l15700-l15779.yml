canonical_text:
  quote: ''
  summary: The passage describes N'goma spirits as able to possess, torment, receive
    offerings, be invoked for harm, inhabit animals, reside in a sacred tree and household
    fire, and punish wrongdoing. It also describes drink-offerings to N'goma and N'gai,
    rites involving animal omens, offerings at a sacred tree near a ford, and sacrificial
    acts used to appease or avert spiritual retribution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spirits are described as acting from outside a person but also as able to
    possess a person.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A departed father's spirit is said to be able to enter a child in another
    place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Medicine-Man is called to interpret a spirit's desires, commonly identifying
    a need for an offering of fat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: If the departed spirit is not satisfied, it may torment at night with strange
    noises and eventually drive the responsible sacrificer mad.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Drink-offerings are made to N'goma and to N'gai, and a well-brought-up M'kikuyu
    spills a little drink before drinking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage explicitly compares the spilling of drink with a custom mentioned
    by Omar Khayyam involving drops thrown from a cup to the earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: N'goma may be invoked to work mischief; one father planned to sacrifice to
    a spirit so that his Christian son would die after refusing circumcision.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some spirits are said to pass into particular animal forms, including the
    ta-tu caterpillar.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hyenas are said to contain N'goma, and a hyena entering a homestead and dropping
    excrement requires a ritual response by members of the Kiama.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hun-gu, or kite, is said to contain a spirit in each bird, with confidence
    that a spirit could move into another bird if one were killed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Accounts differ about the mongoose: some say it contains a spirit, while
    others say it indicates good luck and future food for a traveller.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: A snake appearing in fields is unlucky, and a sizeable snake crossing a traveller's
    path causes him to turn back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: N'goma are said to reside in the sacred Mu-gti-mu tree, often located at a
    ford, where grass, food, and drink are offered before crossing.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: When passing an elephant's skull, a handful of leaves should be pushed into
    it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A house spirit may dwell in the fire, have an all-seeing eye, and observe
    good and bad acts.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: If a thief enters an empty hut, the fire-dwelling N'goma may spring from the
    fire and suffocate him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Retribution may be avoided by seizing a sheep, splitting its chest, and pouring
    out its blood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Spirits are also said to administer justice for another crime, causing an
    offender to become sick and die.
  category: action
  evidence_refs:
  - ev:7
