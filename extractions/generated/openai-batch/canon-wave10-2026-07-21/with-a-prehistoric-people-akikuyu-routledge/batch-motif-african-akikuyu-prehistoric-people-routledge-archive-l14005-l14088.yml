canonical_text:
  quote: ''
  summary: The passage describes Akikuyu administrative bodies, especially Moran'ja,
    Kiama, and N'jama, and outlines their overlapping judicial, civil, fee-distribution,
    and religious duties. It includes references to livestock payments, sacrifice
    to God, ceremonial uncleanness, a charm bracelet in wounding cases, and the beginning
    of a judicial example involving a seduction complaint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that administrative functions are difficult to divide sharply
    and that Moran'ja, Kiama, and N'jama may all take part in judicial councils.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Court fees are described as goats paid into court by suitors, and the distribution
    of these goats is presented as a guide to the body primarily concerned.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moran'ja are present with Kiama and N'jama on theft inquests, but they listen
    and do not take part.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the described division of goats paid by plaintiff and defendant, Moran'ja
    take one leg, Kiama take one leg, and N'jama take the remainder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In emergencies such as drought, Moran'ja call together the N'jama and see
    that the sacrificial goat is offered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kiama civil duties include cases of murder, seduction, wounding, and theft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In seduction cases, Kiama see that the right number of goats is paid to the
    father of the wronged girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In wounding cases, Kiama affix a bracelet of skin worn as a charm.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kiama take part in sacrifice to God, eat the sacrificial sheep, and perform
    duties connected with ceremonial uncleanness except those requiring a Medicine-Man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: N'jama civil duties include looking after roads, bridges, and markets; deciding
    boundary disputes; intervening in riots at dances; dealing with breach of promise
    of marriage; catching and judging thieves; catching murderers if necessary; and
    other customary and colonial-era duties.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The N'jama religious duty is stated as killing God's goat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The judicial-procedure example begins with an old man who is a Kiama describing
    cases, including a father's complaint about the seduction of his daughter and
    an interview with the accused man's father.
  category: sequence
  evidence_refs:
  - ev:8
