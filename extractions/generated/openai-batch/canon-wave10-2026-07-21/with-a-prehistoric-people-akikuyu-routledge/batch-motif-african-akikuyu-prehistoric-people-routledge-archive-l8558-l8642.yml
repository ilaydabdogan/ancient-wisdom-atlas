canonical_text:
  quote: ''
  summary: The passage describes Kikuyu markets as periodic economic and social gatherings
    held on hilltop rallying points. People from different districts converge with
    goods such as firewood, grain, stock, iron goods, charcoal, beer, salt, and implements.
    Goods move between districts through barter or payment, market order is kept by
    the N'jama, arms are restricted, and the passage notes changes from barter and
    bead payment toward coinage.
  language: English
  quote_policy: summarized
