- id: obs:1
  text: Markets for exchanging produce are described as important to native life economically
    and socially.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A market site is described as an open, convenient space on a hilltop that
    serves as a rallying point for several districts rather than belonging to one
    hamlet.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Markets are usually held every fourth day, with dates arranged to avoid clashing
    with nearby markets.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On market day, men, women, and children travel along paths toward one point
    carrying produce from their neighborhoods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women from the western or wooded district carry bundles of firewood, while
    people from the opposite direction bring grain or other exchange goods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'By evening the loads are reversed: firewood has gone to food-growing districts
    and grain to the newly settled country.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The market includes varied participants, including a herdsman selling stock,
    a young man buying adornments and accoutrements, and an old man buying beer and
    gossiping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In iron districts, market goods include iron ore, small iron pigs from smelters,
    and charcoal from the woodland wrapped in banana leaf petioles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A large market reaches its height between eleven and one o'clock and may include
    about 4000 or 5000 people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The N'jama or native police keep order at markets, and no one except them
    may carry arms in or near a market.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: By four o'clock the crowd begins to disperse, leaving litter and rubbish,
    and buyers and sellers return toward their firesides before sunset.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In 1903 barter was the sole means of exchange and beads were the only accepted
    payment medium; later money became understood, though some markets still refused
    coin and accepted only certain commodities.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Government changed the lowest coin denomination from pice to cent, but
    some people preferred the older coin and might refuse its substitute.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A list from the Wa-wer'-u market on February 16, 1908 includes firewood, salt
