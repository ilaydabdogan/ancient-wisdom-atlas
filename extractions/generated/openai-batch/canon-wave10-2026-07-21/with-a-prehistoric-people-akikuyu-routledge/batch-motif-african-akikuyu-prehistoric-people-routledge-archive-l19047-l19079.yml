canonical_text:
  quote: ''
  summary: A young man named Ilimu travels in search of a wife, chooses Wanjiru, and
    pays three oxen for her after she goes home with him. After three days he leaves
    for the wilds, stays away many months, and lives like a hyena on dead men. When
    he returns, Wanjiru has borne a child and is poor and neglected. While Wanjiru
    works in her shamba, Ilimu remains in the house with the child, seizes and devours
    the child, and Wanjiru flees in fear into the woods.
  language: English
  quote_policy: summarized
