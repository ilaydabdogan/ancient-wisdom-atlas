canonical_text:
  quote: ''
  summary: The passage describes Kikuyu country as fertile, well supplied with wood
    and water, and agriculturally productive. It classifies land as virgin, wooded,
    fallow, or cultivated, and notes that remaining uncultivated or communal spaces
    include sacred groves and dancing-greens. It states that sacred groves are often
    on hilltops and that a giant ficus tree called mu-ti mu-gu is considered sacred,
    preserved, and never intentionally cut down.
