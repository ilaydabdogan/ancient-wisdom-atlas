canonical_text:
  quote: '"In old days," we were told, "there were many big trees and few people and
    much rain."'
  summary: The passage describes extensive Kikuyu cultivation, inherited land boundaries,
    rapid expansion of cultivated land, and methods for reconstructing earlier forest
    boundaries from old men's memories. It links remaining woodland, especially on
    the Aberdare Range slopes, with rainfall and water supply, reports an ancestral
    saying about big trees and rain, and condemns continued forest clearance, erosion,
    and damage to streams while noting possible government forest intervention.
