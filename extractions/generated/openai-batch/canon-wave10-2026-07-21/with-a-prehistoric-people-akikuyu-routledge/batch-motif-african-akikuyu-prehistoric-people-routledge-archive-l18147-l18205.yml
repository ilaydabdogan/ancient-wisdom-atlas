canonical_text:
  quote: ''
  summary: A girl named Wanjiru is beaten to death by her mother. Doves gather and
    rejoin her bones with small chains, restore her to life, and house her in a cave
    by a river. Wanjiru secretly helps her younger sister lift a water gourd until
    the sister tells their mother. The parents seize Wanjiru. The doves demand the
    mother's ornamental chains; when she refuses, they remove the chains that hold
    Wanjiru together, and her bones fall apart. After the mother returns the bones
    to the cave, the doves assemble Wanjiru again but forbid her to continue helping
    her sister.
  language: English
  quote_policy: summarized
