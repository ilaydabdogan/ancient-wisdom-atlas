canonical_text:
  quote: Dancing enters largely into the life of the Akikuyu.
  summary: The passage describes dancing as an important part of Akikuyu life. It
    outlines elementary male dance movements practiced from approaching maturity until
    early manhood, including leaping, head and neck flexion, prolonged bent-leg dancing,
    and shoulder muscle tremors used to move shields. It also notes that a tentative
    table of dances was compiled from observation and local informants, and cites
    named dance festivals associated with enemy death, cattle capture, circumcision,
    love dances, erotic dances, and warriors before war.
  language: English
  quote_policy: quoted
