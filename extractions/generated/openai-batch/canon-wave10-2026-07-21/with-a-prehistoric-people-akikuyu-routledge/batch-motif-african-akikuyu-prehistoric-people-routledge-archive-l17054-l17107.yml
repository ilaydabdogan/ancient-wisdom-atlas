canonical_text:
  quote: ''
  summary: The passage describes a charm procedure for a female patient using bodily
    touching, black paste and powder, medicated water, repeated circling of the head
    with bottles and a bag, and a wearable medicine packet. It then describes protection
    from the Mwe-sa-ga of Evil Eye, a wild-vine boundary charm, a skull on a stick
    in a crop field, a goat-material path charm intended to prevent a European-dressed
    stranger from returning, and a blacksmith’s property curse using bellows nozzles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A practitioner touches the patient’s eyes, ears, forehead, and neck, and applies
    black paste or powder to several body parts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Powder from bottles is placed in a cup of water, and the patient is given
    it to drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bag and bottles are passed around the patient’s head; medicine is sewn into
    a small bag rubbed with white powder, passed around her head, and given to her
    to wear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the procedure, the narrator is told that no harm can result from an
    encounter with the Mwe-sa-ga of Evil Eye.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A length of wild vine is stretched on high sticks along a boundary to indicate
    that protective medicine has been made there.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boundary cord is said to afflict anyone walking underneath it with back
    pains.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A skull may be set on a stick in the middle of a field of ripening crops,
    with the only given explanation that God likes it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the reported old-days example, an M'kikuyu who saw a man in European dress
    would kill a goat, put raw fat on his eyes, and place undigested contents from
    the goat on the path the stranger had taken so that he would not return along
    it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same example says the M'kikuyu would also obtain medicine from the Medicine-Man
    so that the stranger might return by another road.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A blacksmith can attach a special curse to a violator of his property by putting
    up the nozzles of his bellows on the land in question.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage identifies the goat-path charm as made by laity but strengthened
    and enforced by the profession.
  category: relationship
  evidence_refs:
  - ev:8
