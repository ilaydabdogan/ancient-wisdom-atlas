canonical_text:
  quote: ''
  summary: 'The passage gives Akikuyu origin legends: one traces the people to an
    old man and wife connected with Mount Kenya, where the old man receives animals
    and divine commands from N''gai; another tells of a man and woman emerging from
    water in a great hole. It also explains the moon''s changes through conflict with
    the sun and notes practices associated with the moon''s death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The legend is introduced as explaining Akikuyu origin and the reason for their
    agriculture, in distinction from Masai and N'dorobo pursuits.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one version, the Akikuyu are described as descendants of an old man and
    his wife who came from beyond the great mountain of Kenya, called the White Mountain.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: While on the mountain slopes, the couple was near starvation, and the old
    man went to the summit to see God, who dwells there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: God gave the old man sheep and goats, from which the passage says present
    Kikuyu flocks descend.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: God told the old man that his descendants should occupy the present Kikuyu
    country and live by tillage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: God assigned the Masai to the plains with flocks and herds, and assigned the
    N'dorobo to wild game in the wilderness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: As a memorial of the interview with God and in obedience to God's command,
    Akikuyu ceremonial dancers paint their bodies with patterns resembling forked
    lightning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Another origin version describes a great hole containing water, deep in the
    center and shallow at the sides.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the water-origin version, a man and woman lived in the shallow water, came
    out to dry land, went to forested Kikuyu country, and had many children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The collector reports that no account was obtained about the man and woman's
    dwellings in the water, and that no deluge legend was discovered.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sun is described as the husband of the moon.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the moon reaches maturity, the sun fights and kills her, after which
    she rises again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The stars that attend the moon are described as the moon's children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the moon is dead, journeys, sacrifices, and sheep-killing are avoided;
    the day after the moon's death is named, and goats and sheep are believed not
    to bear then.
  category: action
  evidence_refs:
  - ev:8
