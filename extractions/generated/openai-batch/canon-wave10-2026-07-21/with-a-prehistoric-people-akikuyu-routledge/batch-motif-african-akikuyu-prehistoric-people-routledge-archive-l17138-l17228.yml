literal_observations:
- id: obs:1
  text: The passage says rival practitioners used antidotes and harmful medicine,
    and that people who defied such medicine were said to sicken and die.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says a M'kikuyu person may publicly state an intention to die,
    then mope, weaken, lie down, and die within days or weeks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Near Tu-su, De-gua wa Ki-ma-ni is said to possess the Ki-tha-si, an object
    no living man has seen because looking upon it is said to cause death.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ki-tha-si is said to have been passed down from father to son for six
    generations, from the Ma-tha-thi age.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Report describes the Ki-tha-si as a stone with fourteen holes, seven on each
    side; the passage states that Akikuyu number divination treats seven as especially
    unlucky.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man seeking another person's complete ruin is described as giving the holder
    seven goats and arranging for the Ki-tha-si to be invoked.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The holder and the postulant are described as exhuming the object, going to
    a solitary place, making medicine for six days, and on the seventh day taking
    the object toward a vantage point over the victim's homestead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage describes Kikuyu as a landscape of hills and valleys where homesteads
    are built high on slopes, allowing a watcher to observe occupants at dawn without
    being seen.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the selected place, the two men set up seven sticks pointing toward the
    victim's home while the wrapped Ki-tha-si is placed behind their backs and unwrapped
    unseen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The postulant inclines one stick toward the direction of the curse, touches
    two holes of the unseen object with his other hand, and states one of seven permitted
    curses in exact, specific words.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says general curses are void and that, after the specific curse
    is spoken, virtue leaves the Ki-tha-si.
  category: action
  evidence_refs:
  - ev:6
