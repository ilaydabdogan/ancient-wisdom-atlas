canonical_text:
  quote: ''
  summary: Wanjiru remains in a tree, lamenting and fearing death. Ilimu waits below;
    her four brothers arrive after hearing her wailing. They kill Ilimu by striking
    a vulnerable flesh part beneath his arm, despite other iron-like parts of his
    body. Wanjiru is taken home, restored, and later remarried. After a child is born,
    the second husband becomes a hyena and devours the child and Wanjiru. A narrator
    explains that these events belonged to the very distant past and were the work
    of God, not Wanjiru’s fault.
  language: English
  quote_policy: summarized
