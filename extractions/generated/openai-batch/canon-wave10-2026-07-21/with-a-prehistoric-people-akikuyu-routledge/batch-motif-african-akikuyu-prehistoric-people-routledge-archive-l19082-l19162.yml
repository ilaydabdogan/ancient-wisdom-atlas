- id: obs:1
  text: Wanjiru stays at the top of a tree, thinks the child is dead and that she
    will die, and wails like the spirits of the dead for three days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilimu comes to the foot of the tree; Wanjiru cries out about a black ox, a
    white ox, and a dun ox, described as the oxen for which she had been sold to Ilimu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ilimu looks up into the tree and says he sees a kisambo among the branches;
    a note describes kisambo as a small long-tailed tree-dwelling beast, possibly
    a squirrel.
  category: speech
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:4
  text: Wanjiru and Ilimu remain in their positions for seven days until Wanjiru’s
    four brothers hear her wailing and find her above in the tree and Ilimu below.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ilimu looks like other men, but his body has alternating parts like iron and
    parts like ordinary flesh; spears cannot harm the iron-like parts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brothers surround Ilimu; one spear strike hits an iron-like part and fails,
    but another strike below the arm hits a flesh part and kills him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Ilimu dies, Wanjiru comes down from the tree; her brothers see that
    she is thin, miserable, and unclothed, and they ask how a wooing warrior became
    changed into a beast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wanjiru goes home with her brothers; they kill a sheep, put clothes and ornaments
    on her, and later another young warrior buys and marries her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After a child is born, the father changes from a man into a hyena and devours
