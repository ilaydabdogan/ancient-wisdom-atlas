canonical_text:
  quote: "“spilt or spat out a little of the liquor as a religious offering”"
  summary: The passage describes an official Akikuyu drinking party arranged by rank.
    Beer is distributed in gourds and horns, circulated through circles of participants,
    and a small amount may be spilt or spat out as a religious offering. The event
    includes special draughts, presents to white visitors, songs, speeches, a prayer
    for rain and harvest, and a list of ox-part rights by social group.
  language: English
  quote_policy: quoted
