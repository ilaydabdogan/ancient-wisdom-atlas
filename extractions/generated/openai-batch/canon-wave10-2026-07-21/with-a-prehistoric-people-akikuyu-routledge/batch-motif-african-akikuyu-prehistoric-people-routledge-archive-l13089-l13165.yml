canonical_text:
  quote: ''
  summary: The narrator describes a pre-performance peace greeting involving spitting
    into hands, making smoke from greenery, and eating banana from ashes, followed
    by a spectacular warrior dance. The performance stages alarm over a Masai raid,
    a scout report, the arrival of warriors singing in single file, reassurance by
    a commander, martial maneuvers, dramatic individual warrior entries with shield
    and spear, and applause and cries from women spectators. The passage ends by noting
    a similar spectacular dance called ki-ba-ta at Mun-ge's.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator and elders exchange hand greetings with spitting into the hand
    and repeated words of peace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator is given greenery, told to make smoke, and eats a morsel of banana
    drawn from ashes; the smoke-making is later said to be associated with peace or
    the maintenance of peace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The performance begins at 2:30 p.m. with a lad running through the crowd and
    announcing that a Masai raiding party is taking cattle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A young warrior, described as exhausted and sweating, reports what he saw
    while scouting.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A war song is heard from the valley and increases in volume as warriors ascend
    the winding path.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The warriors appear from the trees in a long single file, well accoutred,
    moving stealthily, keeping distance and step, and making matching gestures.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The commander-in-chief speaks first to Wombugu and the narrator, then to the
    spectators, saying there is no real need for anxiety and directing marchings and
    counter-marchings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The commander and other warriors enter the arena dramatically, carrying shield
    and spear, yelling, and jumping vertically upward from one apparently stiffened
    leg.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women applaud individual warriors with rhythmic bodily gestures, leaf bouquets,
    compliments, and a descending lu-lu-lu cry.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The dance lasts about an hour and a half.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator states that a very similar spectacular dance, called ki-ba-ta,
    was held at Mun-ge's in October 1907.
  category: relationship
  evidence_refs:
  - ev:7
