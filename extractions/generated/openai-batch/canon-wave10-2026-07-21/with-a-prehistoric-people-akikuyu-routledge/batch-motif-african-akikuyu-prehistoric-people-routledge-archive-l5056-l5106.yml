canonical_text:
  quote: ''
  summary: 'The passage describes Kikuyu household management of sheep and goats:
    young animals are released to rejoin their mothers, flocks spend the night inside
    owners'' huts, goats are associated with wives'' houses and children''s claims,
    goat milk is used by women for young children, and goats require saline earth
    to produce thick milk and remain healthy.'
  language: English
  quote_policy: summarized
