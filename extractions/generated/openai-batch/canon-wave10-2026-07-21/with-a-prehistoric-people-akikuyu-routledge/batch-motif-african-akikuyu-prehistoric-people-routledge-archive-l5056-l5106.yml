  text: Mother animals climb the hillside toward the village and call to their young.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman releases many kids from a common pound, and they run through the greenery
    archway into the homestead area toward their mothers.
  category: sequence
  evidence_refs:
