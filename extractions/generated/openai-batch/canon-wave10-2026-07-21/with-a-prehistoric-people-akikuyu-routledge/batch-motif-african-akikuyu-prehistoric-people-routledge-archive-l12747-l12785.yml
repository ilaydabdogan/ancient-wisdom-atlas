canonical_text:
  quote: enter into the bond of Blood Brotherhood
  summary: 'The passage reports Mun-ge''s description of a Blood Brotherhood ceremony:
    a sheep is provided, killed, and eaten; blood from ritual cuts on the two persons
    to be united is placed in the sheep''s roasted heart, which is divided and consumed
    by them. The passage then introduces a separate ceremony for receiving an M''kikuyu
    into a new district, beginning with a dissatisfied man asking a leading man to
    become a member of his people.'
  language: English
  quote_policy: quoted
