canonical_text:
  quote: ''
  summary: 'The passage reports Akikuyu accounts that their ancestors entered the
    country gradually and peacefully, finding earlier inhabitants: hunter people called
    A''si or A-ki-e-ki, and a diminutive people called Agum''ba. It describes traditions
    about the Agum''ba living in forest pit-houses, making pottery, and using weapons,
    and records excavation of saucer-shaped depressions where worked obsidian, pottery,
    charcoal from fire, and banana seeds were found.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Akikuyu accounts describe obtaining the country by peaceful penetration by
    individuals or small family-linked bands, not by military conquest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Akikuyu ancestors first came, the country is said to have been held by
    hunters called A'si or A-ki-e-ki and partly occupied by a diminutive group called
    the Agum'ba.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The A'si are identified in the passage with the people known as N'dorobo,
    described as living on elephant, other wild game, and wild honey, without cultivation,
    permanent huts, goats, or cattle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Agum'ba are described as about 4 ft. 6 in. tall, with names translated
    as 'the enemies of the children,' 'the fierce little people,' 'children's eyes,'
    or 'the people that look at you as a child would.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tradition says the Agum'ba lived in forests and dug pits in which large communal
    huts were built, roofed with poles, banana leaves, and earth.
