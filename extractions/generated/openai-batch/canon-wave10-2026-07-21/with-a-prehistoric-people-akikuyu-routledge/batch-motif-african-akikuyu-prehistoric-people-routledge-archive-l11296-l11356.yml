canonical_text:
  quote: ''
  summary: The passage describes Kikuyu inheritance rules involving a testator's dying
    curse over livestock, allocation of bride-price for a fatherless girl, transfer
    of wives and property to younger brothers when children are infants, widow options,
    sacrifice for an independently residing widow, conditional control of shambas
    and goats until children mature, and practical recognition of women's claims to
    shambas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A testator may forbid the killing of a specified female animal on pain of
    his dying curse; the animal remains alive as capital and only its descendants
    may be used.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The price for a girl whose father is dead goes to her brother by the same
    mother, and appropriation by an eldest son of another wife is described as robbery.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports that a Kikuyu folk tale seems to imply that the mother
    or the girl could choose which of her own brothers should receive the marli.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a man dies leaving only infant children, his wives and property pass to
    his younger brother or brothers, as determined by the deceased man's will.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated purpose of the arrangement is that no woman should be left without
    a legitimate protector, and refusal by the man is said not to occur.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A widow is not compelled to continue matrimonial life under the arrangement;
    she may return home or live with another man, but a child born to her belongs
    to the late husband's family.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: One statement says that, if a widow lives independently, the elder brother
    of her late husband offers sacrifice for her in illness and shares the marh for
    any girl child with the younger brother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When children are minors, a younger brother takes possession of wives, cultivated
    shambas, and goats conditionally; the deceased's family claims the property when
    the children mature.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mothers watch over their children's heritage, and disputes can arise over
    the number of goats to surrender when children come of age.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women are said theoretically to lack property rights, but practical claims
    are acknowledged; a mother and wives may claim shambas when a man has no children
    or relations.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: In a trespass case, a shamba could be described as belonging to a boy, to
    his mother, or to the mother's legitimate protector.
  category: relationship
  evidence_refs:
  - ev:8
