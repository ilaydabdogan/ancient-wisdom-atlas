canonical_text:
  quote: ''
  summary: A Kikuyu medicine-man initiation segment describes the neophyte emerging
    from a river, using a goat hoof at a m'li-ge-ri tree, receiving medicine gourds
    and a lot-gourd from his tutor, being instructed before other practitioners, participating
    in a goat-killing and cooking rite, receiving divinatory lots into his lot-gourd,
    replacing gourd stoppers, and paying practitioners. The passage also notes abandoned
    equipment of a deceased medicine-man and a rule against irregular practitioners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After emerging from the river, the neophyte passes a m'li-ge-ri tree, scrapes
    its trunk with the hoof of a goat's right leg, and the assembled doctors cut the
    tree down and put a small piece into his m'wa-no.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the tutor's homestead, the future doctor receives five narrow gourds, each
    containing a different drug and temporarily stoppered with banana leaves.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The five gourds contain named medicines: ru-s''Cc-ku for ceremonial purification
    after defilement from curses and for favorable reception; gon''-du for sterility;
    u''-mu as an antidote for poison; u-then''-gi with uncertain function; and i''-ra,
    a white powder used to mark specific points on the body in ceremonies.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The tutor gives the neophyte the m'wa-no, described as a lot-gourd with a
    narrow neck.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the presence of the Faculty, the neophyte is formally instructed while
    the populace and friends watch from a respectful distance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A he-goat is suffocated, its throat is cut, its blood is collected into a
    calabash and poured into the stomach, and the flesh is partially cooked on green
    sticks over glowing embers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Medicine-Men eat the half-cooked meat, and collars made from the skin of the
    goat's right leg are placed around the five medicine gourds and the lot-gourd.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The narrator reports seeing the deserted former home of a deceased Medicine-Man,
    where medicine gourds and a lot-gourd remained, each with a goat-skin collar.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Medicine-Men empty their lot-gourds separately; the neophyte and then his
    wife each take a handful from one pile, and these handfuls are used to cast lots
    to foretell his professional career.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The handfuls of counters obtained from the lot casting are added to the contents
    already in the neophyte's m'wa-no.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The new Medicine-Man's medicine gourds and lot-gourd are first stoppered with
    banana leaves and later with tips of cows' tails, whose long hairs can serve as
    brushes for applying medicines; the passage says a curse has to be brushed off.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: The tutor receives nine goat or sheep skins and one female sheep for his services,
    and each other practitioner present receives one skin.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage states that irregular practitioners are poisoned.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The account is attributed to a Medicine-Man near chief Wombugu on the Gour'-ra
    River in 1908 and is said to have been confirmed from other sources.
  category: speech
  evidence_refs:
  - ev:13
