canonical_text:
  quote: ''
  summary: 'The passage describes Akikuyu wire-drawing: a smith demonstrates a draw-plate
    by bracing it with toes or posts, passing wire through it, and pulling the wire
    with a clamp or vice. The narrator reports seeing copper and fine iron wire drawn,
    records workmen''s statement that rough rod is drawn cold, and notes the draw-plate
    is not tempered. The passage then states that a common marriage gift from a father
    to his daughter is an iron-wire collar, and that a well-off man prefers such wire
    to be handmade by a native smith rather than trade wire.'
  language: English
  quote_policy: summarized
