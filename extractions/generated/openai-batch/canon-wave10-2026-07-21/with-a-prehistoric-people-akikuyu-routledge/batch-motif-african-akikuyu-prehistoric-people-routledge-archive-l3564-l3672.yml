canonical_text:
  quote: ''
  summary: The passage catalogs Akikuyu ear ornaments shown in Plates XIII and XIV,
    describing their materials, manufacture, measurements, placement in the ear lobe
    or cartilage, and restrictions by age, sex, warrior status, elder status, and
    preparation for initiation. It also notes one chain ornament obtained from Meru
    and tentatively describes its pattern as Kamba.
  language: English
  quote_policy: summarized
