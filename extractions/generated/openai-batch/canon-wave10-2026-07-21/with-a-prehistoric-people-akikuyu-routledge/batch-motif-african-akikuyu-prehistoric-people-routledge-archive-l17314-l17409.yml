canonical_text:
  quote: ''
  summary: The passage reports a corpse-revival account involving a wizard who cuts
    flesh from a corpse to make medicine and a friend who may rescue or revive the
    victim. It then reprints a list of Kikuyu medicines with ingredients and claimed
    uses, including healing, reviving faint or dying patients, protecting cattle,
    compelling persons to come, aiding hunting, and treating named ailments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person described as having died from poison or from medicine in the path
    has the corpse put out in the wilds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wizard is said to come to the corpse, cut off pieces of flesh to make medicine,
    and the victim then comes to life; if no friend is present, the wizard will kill
    the victim again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a friend is present, the friend can seize the murderer and bring the revived
    victim home; a friend can also apply good medicine to such a corpse and the person
    will come to life.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Ghemhe is described as made from castor oil, sheep fat, honey, goat milk,
    water from various streams, urine of male and female goats and sheep, magumo wood,
    and the milky sap of wild fig.
  category: object
  evidence_refs:
  - ev:5
- id: obs:5
  text: Ghemhe is said to treat hsematuria and cough, prevent thieves from entering
    a cattle boma when placed on the gate, and restore a person sick unto death when
    applied to specified body points and passed five times around the head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: Kagumo is made from ashes of the roots of a milky-sap tree, and is said to
    revive a fainted person when placed on the tongue, forehead, and navel.
  category: object
  evidence_refs:
  - ev:7
- id: obs:7
  text: Kihoho is made from ashes of Kihinga tree roots and is used to protect cattle;
    if rubbed on the boma gate or tied to an animal's tail, a thief will be caught
    or a lion will be shot.
  category: action
  evidence_refs:
  - ev:9
- id: obs:8
  text: 'Lusuko is described as medicine to call a person: A eats it and calls B,
    and B is obliged to come even from a distance of three days'' journey.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:9
  text: Mukuruka is bark medicine mixed with water in a half gourd and swung around
    the head by a string; warriors take it during periodic dances to induce a particular
    girl to come.
  category: action
  evidence_refs:
  - ev:12
- id: obs:10
  text: Mukosho is root medicine eaten and rubbed on each eyelid by a hunter to quickly
    find elephants or other desired game, and it may also be put on weapons.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: Kanugu, Kinoria, Muchanja Muka, and Mukuyu are listed respectively for a cold
    in the head, making a thin man put on flesh, curing Ngoma described as temporary
    madness, and gonorrhea.
  category: object
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  - ev:13
