canonical_text:
  quote: ''
  summary: A warrior and his allies go to Mukun'ga M'Bura's home to kill him because
    he has killed and eaten many people. They slay and dismember him, but a large
    piece of his body escapes back into the water. The warrior later plans to retrieve
    and burn the remaining leg despite his mother's warning. When he returns, the
    water is gone; the remnant of Mukun'ga M'Bura has taken his children and all the
    water far away, leaving cattle and goats behind, which the warrior's people gather
    and take home.
  language: English
  quote_policy: summarized
