canonical_text:
  quote: ''
  summary: Wadua comes to Washuma's home, accepts milk after refusing other foods,
    is warned about a water-dwelling snake-like beast that kills cattle at night,
    and kills it with a spear. Washuma's father identifies Wadua as the slayer through
    a race among the young men. Wadua asks for Washuma as wife, is told to fetch the
    nyoya, enters the great water, disappears overnight, and returns with many others
    and innumerable sheep and goats after the water has disappeared. He divides the
    livestock and gives half to Washuma's father so that he may marry her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After three days Wadua came to Washuma's house and waited outside while Washuma
    was in the shamba.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Washuma offered the stranger several foods, which he refused, and he drank
    milk when she brought it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Washuma warned Wadua not to go out if he heard a great noise at night because
    a great animal like a snake came every night to kill and eat the oxen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The snake-like animal was called Mukun'ga M'bura, and its home was said to
    be in the water.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night Wadua heard a great noise, took his spear, went out despite Washuma's
    attempt to stop him, and killed the snake by stabbing it in the back of the neck.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the morning Washuma's father found the dead beast and asked who had done
    it; Washuma told him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Washuma's father gathered the young men on the dancing green and set a running
    test to identify the slayer of Mukun'ga M'bura.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wadua ran the appointed distance and returned faster than the other youths.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When asked what reward he wanted, Wadua said he sought a wife and asked for
    Washuma.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Washuma's father said suitors for his daughter had been told to fetch the
    nyoya.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Wadua went into the big water while Washuma stayed on the bank; the water
    rose over him until he went completely under and remained there without dying.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After waiting overnight, Washuma thought Wadua was dead, but then heard a
    great noise in the water and saw Wadua, many others, and innumerable sheep and
    goats coming out of it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The water had all disappeared when Wadua returned with Washuma to her home.
  category: setting
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:14
  text: Wadua divided the sheep and goats into two halves, kept one half, and gave
