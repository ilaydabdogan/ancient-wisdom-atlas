canonical_text:
  quote: ''
  summary: The passage opens with an editorial frame imagining Kikuyu tale-telling
    under a sacred tree, near snowy Kenya, in a homestead, or around a camp fire.
    The tale that follows concerns Wanjiru, named by a Medicine-Man as the maiden
    who must be bought so rain will fall after a long drought. The community brings
    goats, Wanjiru sinks into the ground while rain begins and then becomes a deluge,
    and her kin accept goats instead of saving her. A young warrior who loves Wanjiru
    arms himself, goes to the same place, sinks into the earth, travels below, finds
    her, and begins carrying her back.
  language: English
  quote_policy: summarized
