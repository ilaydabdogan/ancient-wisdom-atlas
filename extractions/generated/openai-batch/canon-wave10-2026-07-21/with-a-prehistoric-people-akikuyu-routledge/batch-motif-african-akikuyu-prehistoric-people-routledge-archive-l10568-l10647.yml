canonical_text:
  quote: ''
  summary: 'The passage describes Akikuyu children and family size: children are valued,
    childlessness is socially unfortunate, a medicine-man and gon''-du medicine are
    associated with sterility cures, and giving direct numerical counts of children
    is considered unlucky. The authors describe indirect methods of gathering family
    statistics and note their limitations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the suppression of tribal war under British conquest, the authors state
    that available investigations suggest births in each sex are fairly equal.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Akikuyu are described as prolific, and children are described as much
    valued.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A childless woman is described as pitied and as losing favor with her husband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: For sterility, recourse is made to a Medicine-man; a goat is killed, native
    beer is drunk, and gon'-du medicine is said to cure sterility and to be given
    to the Medicine-man at initiation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Asking mothers directly for the number of their children is described as tactless
    because giving such figures is considered unlucky.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The inquiry about child numbers is politely avoided with a request to come
    and see, but children are rarely assembled at one time because girls may be in
    the fields and boys herding goats.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The observer visited huts and counted beds, but judged this method unreliable
    for family statistics.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kikuyu boys in contact with the observers answered questions about their fathers'
    and grandfathers' wives and their respective children.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The authors state that the informants' family statements were probably incomplete,
    especially for less familiar relations and children who died in infancy, and that
    the figures likely understate rather than overstate.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The reported statistics include forty-nine families with 156 children, and
    a reduced set of thirty-five families with 132 children, slightly under four children
    per family.
  category: other
  evidence_refs:
  - ev:9
