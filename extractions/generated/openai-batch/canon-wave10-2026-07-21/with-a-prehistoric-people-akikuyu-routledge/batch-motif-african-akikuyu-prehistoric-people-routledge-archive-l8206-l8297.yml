canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic description of Akikuyu pottery production:
    a woman potter shapes a clay vessel by hand, smooths it with a gourd tool and
    water, adds grooves and lugs, hardens and completes the pot, dries it near a hearth,
    fires batches with wood and brushwood, and notes the kinds of pottery articles
    observed.'
  language: English
  quote_policy: summarized
