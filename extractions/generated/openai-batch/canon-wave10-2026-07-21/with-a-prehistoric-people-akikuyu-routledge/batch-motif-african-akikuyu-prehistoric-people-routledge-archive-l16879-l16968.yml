canonical_text:
  quote: ''
  summary: A Medicine-Man conducts a divination séance by shaking a gourd, pouring
    out dice or counters, dividing them for a white man and his wife, counting them,
    and interpreting the results. The passage then lists objects included among the
    counters, giving their histories and stated meanings, including martial signs,
    travel danger, cowries connected with longevity and twins, and a twig knot connected
    with a fertility-binding procedure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Medicine-Man shook a gourd, poured dice into his palm, divided them into
    two piles for the white man and his wife, and counted one heap while assistants
    counted the other.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lot was consulted a second time in order to avoid a mistake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Medicine-Man interpreted the result as showing that the white man was
    going somewhere and wanted to go home, though the reason was uncertain to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The white woman's dice were interpreted as saying that someone had died in
    her village in the past.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Questions about whether the white man and the white woman would live to grow
    old received affirmative answers; in the white man's case, this was partly connected
    to the presence of a cowrie shell among the dice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Further volunteered statements said that the white man might commit suicide
    but God would not kill him, and that the white woman would not have bad luck on
    the journey but would find important business on arrival.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the end of the séance the Medicine-Man refused to empty the bottle so the
    counters could be examined unless a definite question justified it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The dice were mostly beans or stones, but also included objects described
    as having history and significance; some were described as mementoes or thankofferings
    of important events in individuals' lives.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Several counters were assigned martial or travel meanings, including a razor
    or scraper for fighting, a lion tooth for meeting a lion on a journey, trophies
    indicating Masai proximity and hostilities, a cartridge case indicating white
    men near and hostilities, and a dead man's earring indicating fighting and prospering.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
- id: obs:10
  text: Two cowrie shells united by gum indicated that a woman would bear twins, while
    an overhand knot of twig could indicate that a woman would not bear children to
    any husband after a binding procedure involving garment nap placed in the Medicine-Man's
    gourd.
  category: object
  evidence_refs:
  - ev:11
  - ev:12
