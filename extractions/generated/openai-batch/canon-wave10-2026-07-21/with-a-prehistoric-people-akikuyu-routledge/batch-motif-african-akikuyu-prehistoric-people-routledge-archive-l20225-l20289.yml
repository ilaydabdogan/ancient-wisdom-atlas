  quote: ''
  summary: The passage reproduces a note and a letter by J. A. Grant about iron making
    observed in the countries of the Unyaniezi and Bagweh in 1861, including work
    locations outside villages or in forests, an estimate of daily output by four
    men, claims that Central African iron ore was gathered from the surface rather
    than mined, and references to native-made tools, spears, knives, and possible
    iron telegraph posts.
