canonical_text:
  quote: ''
  summary: The passage describes Akikuyu initiation timing, annual initiation cohorts,
    and the period of boys' dancing before initiation. It records formal decision-making
    for girls' initiation age, usual initiation ages, annual naming and seniority
    by initiation cohort, pre-initiation dancing and training by boys, the suspension
    of the festival after major crop failure, required body painting, an etiological
    tradition that the body pattern was divinely commanded to the great M'kikuyu on
    Kenya, and the costume and objects carried by male candidates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl's initiation age is settled in a formal interview involving her father,
    mother, and local elders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A girl whose health is considered abnormal may keep her natural-length hair,
    cannot come up for the rite under those circumstances, and cannot be given in
    marriage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage gives ordinary initiation ages as fifteen to eighteen for boys
    and ten or twelve to fifteen for girls.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The initiation ceremony is held annually; men's seniority is decided by initiation
    date, and each successive celebration receives a name identifying those initiated
    that year.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Three or four months before the appointed ceremony, a boy begins 'to dance'
    by obtaining accoutrements, dressing and adorning himself, travelling to public
    places, singing, rehearsing steps and figures, and building strength for the festival
    ordeal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boys first practice stereotyped movements in small groups and later gather
    into larger bodies; the passage reports that in 1903 as many as seventy young
    men could be met travelling together.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The festival is not held if crops fail very considerably, because such failure
    is considered an indication of Divine displeasure.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boy who dances should be painted in a particular way, wear a particular
    dress, and carry certain articles.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:9
  text: The passage states that ornamentation of the limbs and abdomen with an indented
    white-pigment pattern is never absent from the painting.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tradition says the painting pattern is used according to a Divine command
    given to the great M'kikuyu when he stood in God's presence on Kenya.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The neophyte's costume generally includes Colobus monkey fur items, a Serval-cat
    skin, cowrie-shell straps, a knee bell, and a dried-grass dancing belt with banana
    seeds attached by dried gum.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The neophyte's head is shaved except for one tuft at the centre of the crown,
    and he carries a staff and a small wooden shield adorned with devices.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The plate caption lists full dancing costume features including shaven head,
    expanded ear-lobes, dancing shields, cowrie-shell strap, monkey tail, serval-cat
    garment, wooden sword, dancing rattle, monkey-fur ornaments, zigzag body ornamentation,
    and long staves.
  category: object
  evidence_refs:
