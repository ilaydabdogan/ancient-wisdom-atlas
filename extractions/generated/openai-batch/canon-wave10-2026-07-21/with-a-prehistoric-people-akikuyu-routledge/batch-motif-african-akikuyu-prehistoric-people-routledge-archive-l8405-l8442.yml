  quote: ''
  summary: Plate captions and notes describe a pottery-burning scene in which pots
    are arranged in concentric circles outdoors with brushwood between and above them,
    then set alight. A following plate describes bringing water from a river at the
    foot of a hill to the hill-top, showing a load-carrying method, a narrow-necked
    earthenware jar stopped with leaves, ear ornaments, and a skirt border tied around
    the neck for walking.
