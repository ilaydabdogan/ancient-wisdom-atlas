canonical_text:
  quote: ''
  summary: Wanjiru emerges with her lover, who refuses to return her to her people
    because they treated her shamefully. He hides her in his mother's house, where
    she is fed, strengthened, and clothed. At a public dance, her relations recognize
    her, but the lover drives them away and accuses them of having sold her. Later
    he relents, pays her family the purchase price, and marries Wanjiru, who had been
    lost.
  language: English
