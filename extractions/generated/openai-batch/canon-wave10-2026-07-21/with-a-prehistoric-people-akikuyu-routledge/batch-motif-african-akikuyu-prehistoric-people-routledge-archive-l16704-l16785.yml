canonical_text:
  quote: ''
  summary: The passage describes a purification for illness attributed to parents
    eating a goat contrary to a dying father's instructions, then describes divination
    by a Medicine-Man using a gourd and counters to seek the will of God or identify
    spirit-caused illness and prescribe cures, including goat-killing practices. It
    includes an example from Wombugu's homestead concerning whether a sick man would
    recover or die.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child is said to be ill because the parents ate a goat contrary to instructions
    given by the father on his deathbed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states a custom in which a dying parent may direct that a female
    animal be regarded as sacred and only its descendants be killed.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Medicine-Man sprinkles the patients with water from a half calabash, using
    a brush on leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Medicine-Man dips a goat forefoot in the gourd, puts it into the mouths
    of the man and woman, says a formula meaning 'expel what is bad,' and the patients
    spit and repeat the formula.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Medicine-Man applies i-ra to parts of the man's and woman's bodies, sweeps
    the house, touches the roof with the brush, and the man, woman, and baby wash
    with water from the gourd.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Medicine-Man's initiation includes the bestowal of the
    gourd and instruction in obtaining knowledge of the will of the Deity by casting
    lots.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lot-casting procedure is especially used in misfortune or illness to find
    a cause, usually described as the work of a spirit, and to prescribe a cure.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In divination, people sit around while the Medicine-Man pours counters from
    a gourd onto a skin; all present help count them into heaps and the odd remainder
    is considered by the practitioner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that five is a good number and seven is a bad number in
    the divination procedure.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: For illness, a very bad number may require a goat to be killed but not eaten;
    in very severe illness a second goat is killed and eaten by two old men and two
    old women so that the spirit will partake of the first goat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Wombugu's homestead, a leading man is said to have a particular soothsayer,
    and Wombugu asks through the procedure whether a sick man will recover or die.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: In Wombugu's case, the Medicine-Man's result is that a goat must be killed
    and then the patient will recover.
  category: speech
  evidence_refs:
  - ev:8
