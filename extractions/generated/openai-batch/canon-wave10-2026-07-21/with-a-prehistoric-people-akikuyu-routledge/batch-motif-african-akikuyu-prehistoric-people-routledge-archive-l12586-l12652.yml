canonical_text:
  quote: ''
  summary: 'The passage describes Kikuyu burial eligibility and procedure: certain
    men and very old women are buried; old men choose a grave outside the hut; sons
    dig the grave; the body is wrapped, positioned, and oriented with the head to
    the west; the hut is pulled down over the grave. A multi-day funeral sequence
    follows, including head-shaving, goat and sheep killings, washing with stream
    water, medicine-man purification, beer, fat distributions, offerings to the dead,
    Kiama prayers for village protection, and taboos on touching the dead person''s
    possessions.'
  language: English
  quote_policy: summarized
