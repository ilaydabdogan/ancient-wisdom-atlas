- id: obs:10
  text: The hut is pulled down and piled on top of the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the interment, the sons take a goat to a poor old man's hut, shave their
    heads, the goat is killed and eaten by the old man, and the sons sleep in his
    hut.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The day after death is described as unlucky; people avoid travel, goats and
    sheep will not bear, villagers shave their heads, and women remain indoors for
    four days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: On the third day, sons shave their heads again, friends fetch stream water,
    the sons wash outside the homestead, and the Medicine-Man performs purification.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Subsequent days include killing another goat, making beer, holding a drinking
    festival, killing a large sheep, and distributing fat.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After five more days a male goat is killed for the departed father, fat is
    poured out as an offering to the dead, and later another male goat is partly eaten
