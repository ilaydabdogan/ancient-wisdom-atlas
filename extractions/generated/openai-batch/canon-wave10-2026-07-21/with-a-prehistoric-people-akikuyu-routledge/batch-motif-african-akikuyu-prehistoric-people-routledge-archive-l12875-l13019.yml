canonical_text:
  quote: ''
  summary: The passage catalogues Kikuyu dances by participant group, including dances
    of uncircumcised boys, men only, men and women together, and women only. It then
    describes boys' dances, the initiated young men's N'dorosi festival, and an observed
    warrior dance or review on a hill saddle. At the observed gathering, elders sit
    around a central fire beside a planted young tree, maintain smoke with foliage,
    invite the narrator into the circle, and a senior man begins a palm-spitting hand
    gesture.
  language: English
