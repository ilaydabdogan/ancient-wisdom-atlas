canonical_text:
  quote: ''
  summary: The passage records several Kikuyu court cases concerning inheritance of
    cultivated land, unpaid land purchase, detained goats, trespass, and breach of
    marriage promise. Judgments return land or goats, impose goat payment, or order
    marriage when marriage-related goats cannot be returned. It ends by introducing
    trial by ordeal, called Mu-ma, as generally connected with the Medicine-Man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In an inheritance case, young men had cultivated a shamba and died; an elder
    annexed the shamba, the deceased man's brother claimed it, no payment was found,
    and Wombugu judged that the brother should take possession.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'In an unpaid shamba purchase case, the court divided into three circles:
    the plaintiff with his relations, the defendant with his relations, and the judges
    apart while taking refreshment.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The defendant in the shamba purchase case confessed nonpayment to friends
    and then to the court, and the judgment allowed the plaintiff to resume possession
    in four days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the goat detention case, a plaintiff had left a goat with the defendant;
    it bore three kids, the plaintiff had recovered two goats, and the defendant later
    confessed he still had two, which he was ordered to pay.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the trespass case, a boy said a young man entered his shamba for firewood;
    the young man accused the boy of insulting him, and the boy was condemned to pay
    a goat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states in answer to a question that the boy's shamba and his mother's
    shamba were treated as the same thing.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Chief Munge's, a small court ratified the return of goats by a girl's father
    to a young man after the girl declined to fulfil an engagement of marriage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before Chief Kariri, a girl had refused to fulfil her marriage contract; the
    goats could not be returned because they had been eaten and her father was dead,
    so the judgment required her to marry the suitor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage introduces trial by ordeal, called Mu-ma, and says it occurs among
    the Kikuyu and is generally the affair of the Medicine-Man.
  category: other
  evidence_refs:
  - ev:7
