canonical_text:
  quote: ''
  summary: The passage describes localized Akikuyu political organization, occasional
    military union under a Medicine-Man, civil authority vested in homestead heads
    and councils of old men, and the sequence of official ranks by which men enter
    elder/governing status. Rank transitions are tied to fatherhood and the formal
    admission of a child, accompanied by goat-giving, bodily changes such as head-shaving,
    and insignia such as a wand or staff of office, a particular earring, and leaves
    carried on a journey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Political hostilities are described as highly localized: one valley could
    fight another, hillside people could fight valley people, and a small stream could
    separate friends from enemies.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several districts might occasionally unite under one Medicine-Man against
    an enemy such as the Masai.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For civil purposes, the head of a homestead is described as a ruler; there
    is no national council, and government is said to be patriarchal or in the hands
    of councils of old men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Official dignity in old age is said to depend on a man's relation to the rising
    generation rather than on a recorded count of his years.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The first official rank is reached when a man becomes father of a second child;
    he enters the Mo-ran'ja class and gives a goat to members of the grade, at least
    in some districts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the Mo-ran'ja stage, a man is supposed to shave his head, abandon the young-warrior
    lock, cease attending dances, and become an established head of a family.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first-rank name and conditions vary by locality, with equivalent offices
    named N'dun'-du in Karuri's district and Ke-thi-ga in the Nairobi district.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The second official rank, Ki-a-ma, is attained when a man's first child is
    old enough for formal admission into the tribe; the man gives one goat to the
    N'ja-ma.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the child has completed the rites, the man gives two more goats for
    other Kiama to eat and becomes a fully initiated member of the old men or governing
    class; a poor man may defer part of this payment and hold a somewhat inferior
    rank meanwhile.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Kiama has a wand of office, wears a particular type of earring called ki-chan'go,
    and has sentiment attached to a bunch of leaves often carried on a journey.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'The wand of office may be made from the wood of one of three named trees:
    Mu-ti''-gi, Mun''-deren''-du, or Mu-ta-zi.'
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A plate caption identifies a Kikuyu elder as Kiama bearing a staff of office,
    and describes a veteran's spear with blade, wooden shaft, and iron butt or spike.
  category: object
  evidence_refs:
  - ev:9
