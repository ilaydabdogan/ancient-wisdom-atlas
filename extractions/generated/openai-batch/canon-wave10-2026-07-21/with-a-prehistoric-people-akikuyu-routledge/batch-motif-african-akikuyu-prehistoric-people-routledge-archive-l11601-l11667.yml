canonical_text:
  quote: "“not yet been born again”"
  summary: The passage describes a Kikuyu “second birth” ceremony for a child old
    enough to herd goats, including a killed goat, a mother-child seating arrangement,
    cutting of a goat string, female-only indoor participation, stripping and washing
    the child, subsequent preparation of goat skin, sugar-cane, arum roots, shaving,
    and beer drinking. It then introduces circumcision initiation as the rite by which
    boys and girls become adult members of the Kikuyu nation, with associated payments
    and obligations.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: When a child is old enough to mind goats, a goat is killed and the child sits
    on the ground in front of the mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old woman ties the string of the goat behind the mother, cuts it in front
    of the child, folds it in grass, and places it outside the hut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women go inside the hut, while no man, including the father, is admitted.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother remains clothed, but the child is stripped naked, including removal
    of ornaments; afterward both mother and child are washed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those considered old enough to have intelligence eat the goat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the second day the goat skin is prepared and sugar-cane is brought into
    the house; on the third day the mother shaves and mother and child gather only
    arum roots; on the fourth day native beer is drunk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A boy of about seven said he had not yet been born again and expected the
    ceremony in about two years.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy said his father gave him a bangle when he began to herd goats, while
    before that he had only a necklace and beads from his mother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that circumcision is the rite by which a boy becomes a
    man and a girl becomes a woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Through circumcision initiation, an individual moves from being described
    as the property of Kikuyu parents to being a member of the Kikuyu nation with
    rights, privileges, and obligations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Admission may be delayed when the father cannot make required payments and
    gifts connected with the ceremony.
  category: relationship
  evidence_refs:
  - ev:6
