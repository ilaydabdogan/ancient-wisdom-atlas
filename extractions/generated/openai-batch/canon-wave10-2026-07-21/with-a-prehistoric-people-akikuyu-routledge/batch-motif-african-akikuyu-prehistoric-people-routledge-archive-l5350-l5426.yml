  text: The worker throws her weight forward and downward, moving the upper stone
    over the lower stone so the material between them becomes fine meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage gives a market value for 60 pounds of meal and states that forty
    such loads were once prepared at three days' notice without being considered unusual.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: A stated daily ration of maize or meal, varied periodically with beans, is
    described as enough to keep a man in good condition while carrying a load over
    repeated daily travel.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: A traveller or resident in Kikuyu is advised to learn the different seeds,
    their dietary qualities, required cooking vessels, preparation methods, and cooking
    times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The leader of a safari is respectfully addressed as "my father," but porters
