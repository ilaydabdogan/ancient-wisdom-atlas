- id: obs:3
  text: One reported great medicine-man near Munge's was said to be taken up by God,
    to see God, and to return after a few days; people were afraid to ask what God
    had said to him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another account says that God came down like a wind to a man on his bed, took
    him up, and enabled him to see and hear God.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the same account, God gave the man corn in a gourd and told him to plant
    it; the man told the Akikuyu not to fight the Masai and to live in peace.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same account says that the man predicted a plague of insects, and that
