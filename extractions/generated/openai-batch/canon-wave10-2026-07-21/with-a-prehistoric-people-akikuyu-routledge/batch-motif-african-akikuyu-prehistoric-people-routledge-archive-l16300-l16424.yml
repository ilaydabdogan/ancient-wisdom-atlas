canonical_text:
  quote: ''
  summary: 'The passage describes exceptional Akikuyu medicine-men or prophetic figures
    said to be bodily translated to God and to return, including accounts of divine
    speech, a gift of corn in a gourd, a peace injunction, prophecy, thunderous return,
    bodily marks, and short-lived cults. It then summarizes the ordinary functions
    of medicine-men: purification from ceremonial uncleanness, divination by lots,
    charm-making for protection or harm, and medical practice. It defines tha-hu as
    ceremonial uncleanness and notes examples involving corpses, witchcraft, and disobedience
    to dying parental instructions. A plate caption describes medicine gourds, a lot
    gourd, counters, and a leather carrying bag.'
  language: English
  quote_policy: summarized
