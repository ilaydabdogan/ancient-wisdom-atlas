canonical_text:
  quote: ''
  summary: An informant reports a legend, described as not a rogano but as something
    said to have happened, about a rainbow living in Lake Naivasha that emerges at
    night and steals Masai cattle. Young warriors heat spears in fire, strike the
    rainbow at its vulnerable neck, and kill it. The passage also records beliefs
    that walking under a rainbow causes death, that the rainbow stops rain, that God
    placed it to prevent deadly excess rain, and that the monster may appear as a
    man or as a snake.
  language: English
  quote_policy: summarized
