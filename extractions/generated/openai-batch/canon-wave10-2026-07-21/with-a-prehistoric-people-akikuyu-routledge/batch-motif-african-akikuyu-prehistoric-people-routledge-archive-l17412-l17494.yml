canonical_text:
  quote: ''
  summary: The passage lists named Akikuyu medicines or charms, their materials, modes
    of application, and expected effects; identifies Kahiga as the medicine-man source;
    and adds commentary distinguishing charms and drugs from surgery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One medicine is not eaten but is applied to several body sites, including
    the throat, toes, navel, buttocks, fingers, loins, and forehead, and is said to
    cure the patient in two days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mururi is described as coming from a Kikuyu tree of the same name, and a small
    amount placed in a camp fire is said to keep lions and other wild beasts away
    from a traveller.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mwitia is made from roots of a tree of the same name, and rubbing it on something
    for sale is said to bring a buyer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ngondii consists of ashes of bark from a named tree; a diarrhoea sufferer
    is told to swallow a little and rub some in a line around the abdomen, and it
    is also said to help sickness during pregnancy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Omu is made from roots of a tree called Mtanda Mbogo and is given to youths
    during circumcision so that they do not feel pain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Siari is made from ashes of feathers of the rhinoceros bird and is used for
    male impotency or female sterility by rubbing a little on the genital area; it
    cannot be dispensed without payment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ira is a white earth from Mount Kenia, River Muimbi, applied when a patient
    is recovering after other medicines and said to complete the cure; men and women
    apply it to different body sites.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The listed medicines were obtained from Kahiga, identified as a Medicine-Man
    or Mundu Mugo, with clan and district affiliations given.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The commentary says the Akikuyu give names and qualities to many wild plants
    and recognize emetics, purgatives, astringents, irritants, poisons, and medicines
    used in charms.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The commentary says charm manufacture is closely associated with the medicine-man’s
    use of drugs, making the two difficult to distinguish.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Surgery is described as separate from medicine and practiced by naturally
    neat-handed individuals rather than by medicine-men as a category.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The surgical commentary says treatment is not attempted for depressed skull
    fractures, bone-setting or reduction of dislocation has not been observed, and
    surgery is confined to flesh wounds.
  category: action
  evidence_refs:
  - ev:11
