  summary: 'The passage describes plate captions and object notes for pre-circumcision
    or pre-initiation practices: two special wooden weapons carried by candidates
    while dancing before the ceremony; a waist fringe made of grass stems and wild
    banana seeds as part of ceremonial dress; and figures of neophytes dancing with
    song before initiation as men. The fringe is said by the Akikuyu to have been
    worn by the extinct A-gum''-ba predecessors.'
