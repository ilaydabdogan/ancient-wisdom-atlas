canonical_text:
  quote: ''
  summary: Forty girls go for firewood and meet Ilimu, a hard-bodied being who takes
    a finger from each girl and eats the last one. The girls later have their teeth
    adorned and repeatedly ask others whose teeth are most beautiful; Wa-shi-shi and
    Moire-wa-nyi-na, two sisters by the same mother, are named each time, grieving
    the other girls. On the third day the girls again go for firewood, make a big
    hole by a sacred tree, and enter it in turn; Moirewanyina comes out safely before
    the excerpt breaks off mid-action.
