canonical_text:
  quote: ''
  summary: The passage describes changes in Akikuyu judicial administration under
    chiefs, the continued theoretical equality of chiefs with common people, a note
    that Chief Munge led a sacrifice to N'gai, two reported accounts of lawsuit procedure,
    and a caption for an ornamental n'ju-ou'-ma stick carried at visits or public
    meetings and passed between speakers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Difficult cases increasingly tend to be referred from old men to a chief,
    or judged at the chief's residence by the chief and elders together.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The N'jama are described as tending toward a personal relationship with the
    chief and as acting as a Council of State, while the body's membership remains
    primarily co-optive because it can veto a chief's appointment.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A chief is said not to be theoretically distinguished from other people in
    bridewealth for his daughter, compensation for his death, or entitlement to funeral
    rites.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A principal chief who was still considered a young man was said not to receive
    old men's burial honors and would be put out for hyenas like others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chief Munge took the lead in offering a sacrifice to N'gai, but the passage
    says it was not clear whether this was always his right or whether it was connected
    to his official position.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one reported theft procedure, a witness tells the owner of a theft and
    claims the reward due to an informer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The owner, witness, and young men go to the thief to demand the property;
    if the thief restores it, he also gives a sheep to the young men for their trouble.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a theft matter cannot be settled locally because judges do not agree, the
    plaintiff, defendant, and old men go to the big chief, where the big chief's elders
    join and each side gives a present to the elders.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In a second reported lawsuit procedure, plaintiff and defendant each come
    with friends from their districts and assemble at the chief's quarters with other
    old men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The plaintiff and defendant each speak; the old men may tell a defendant with
    few words to go and talk with his friends.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The defendant may confess guilt privately to his friends, who return to report
    the confession; if he does not confess and his words remain very few, the court
    declares him guilty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'Two sheep are given in the second lawsuit account: one to the elders and
    one to the chief.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: An ornamental n'ju-ou'-ma or life-preserver is carried by a warrior or elder
    when visiting or attending a public meeting and is passed from speaker to speaker.
  category: object
  evidence_refs:
  - ev:6
