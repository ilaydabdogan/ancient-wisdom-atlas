canonical_text:
  quote: ''
  summary: 'The passage presents an ethnographic account of Kikuyu betrothal and marriage
    procedure: an initial case concerning payment for a child and later marriage offer,
    followed by a narrated sequence in which a young man proposes, the girl and her
    parents confirm consent, beer is poured and drunk, goats and a sheep are delivered
    as payment, relatives and friends visit the bride''s home with beer and bananas,
    gruel is served, and women dance the Ge-ti-ro.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unmarried girl bore a female child; the child's father paid ten goats,
    later offered six extra sheep to marry the woman, and the passage says the child
    remained with the woman's father because the additional consideration was small.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The marriage account is attributed to a Kikuyu servant who had recently completed
    payment for his bride and illustrated the dramatis personae with small objects.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man tells the girl that he has goods at his father's home, praises
    her work, and says he would like to buy her; she agrees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The girl's father asks whether she likes the man, and her mother asks whether
    she likes anyone else; the girl answers affirmatively to the father and negatively
    to the mother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man has made two gourds of native beer, one big and one small, which
    are brought by two friends.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girl pours beer into an ox horn; her father says he will not drink if
    she does not like the man, then drinks, after which the mother and gathered friends
    drink.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man tells his father he wants to buy the girl; his father asks how
    many goats are wanted, accepts the answer of twenty, and the young man's mother
    is told.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the goats return home in the evening, the young man's father selects
    twenty, friends take them to the girl's home, and the young man follows behind
    and delivers them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If only ten goats are delivered at first, the young man does not go to the
    girl's home the next day because the full number has not been paid.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the remaining goats are delivered, two friends travel one before and
    one behind, with the young man last; the girl stays in the house while her father
    inspects and approves the goats.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The next day the young man and his friends take a sheep to the girl's home,
    after which he cuts sugar-cane in the shamba and makes more beer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the following day, the bridegroom's party, including parents and friends,
    goes to the bride's home carrying beer gourds and bananas; the bride's parents
    have gathered friends, while the girl works in her mother's shamba and does not
    appear.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Women associated with the bride's mother receive the gourds and bananas and
    go into the house; the girl's mother produces two gourds of gruel, serves the
    young man's father and the young man with their friends, and the two mothers and
    their friends dance the Ge-ti-ro.
  category: action
  evidence_refs:
  - ev:8
