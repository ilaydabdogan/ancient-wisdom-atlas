canonical_text:
  quote: The saline clay is broken up in this with a little water, when the flocks
    greedily lick it up.
  summary: The passage describes Akikuyu use of saline clay from marshes and river
    banks for livestock. Flocks are driven to clay sources or given clay prepared
    in tree-trunk troughs with water. The clay is considered essential for animal
    health and is not used as human food.
