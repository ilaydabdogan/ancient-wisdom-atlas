  quote: ''
  summary: 'The passage describes effects attributed to Akikuyu initiation ceremonies:
    the author says the cause should be sought in prolonged strain and excitement,
    especially for boys, rather than in a physical operation. It also reports that
    young Kikuyu servants who leave for the ceremonies may return changed and unable
    to resume European household routine.'
