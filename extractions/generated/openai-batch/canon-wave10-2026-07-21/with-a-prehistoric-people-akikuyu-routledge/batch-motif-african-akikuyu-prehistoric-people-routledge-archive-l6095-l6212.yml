canonical_text:
  quote: ''
  summary: 'The passage describes stages of Akikuyu hut construction: supporting deep
    eaves with forked posts, adding transverse roof ties and roof bands, preparing
    and applying thatch in overlapping circles, making and securing a woven door,
    arranging a fireplace of three stones beneath a ceiling-platform, and two plate
    captions showing a hut door being transported and a warrior on a tree-trunk bridge.'
  language: English
  quote_policy: summarized
