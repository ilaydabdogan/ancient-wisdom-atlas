  quote: ''
  summary: The passage describes Akikuyu women's dress for ordinary and major dances,
    including an optional very short banana-leaf skirt for a big dance, abdominal
    raised-scar adornment, and the absence of head or foot gear. It then lists terms
    for female life stages, including small girl, uninitiated big girl, post-initiation
    girl, betrothed or married woman not yet a mother, mother of young children, mother
    of initiated children, and toothless old woman.
