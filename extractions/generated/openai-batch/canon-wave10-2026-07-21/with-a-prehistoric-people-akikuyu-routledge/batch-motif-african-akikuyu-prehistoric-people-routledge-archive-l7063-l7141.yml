canonical_text:
  quote: ''
  summary: 'The passage describes the construction and use of Kikuyu smiths'' bellows
    and the associated iron-smelting process: a clay hearth or furnace under a roof,
    goatskin bellows with wooden and pottery pipes, operation by a blower, use of
    iron sand and charcoal, a dawn-to-sundown firing, overnight cooling, and next-morning
    removal of the hot mass with water and a banana-leaf rope.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hearth or furnace is described as a laterally flattened truncated cone
    with a thick clay lip and a permanent roof like a circular hut without sides.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bellows consist of sewn goatskin cones with a carved wooden pipe at the
    apex and a long pottery nozzle resting on the lip of the hearth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The distal part of the pottery nozzle lies beneath black charcoal, while the
    nose is exposed to great heat and becomes fused.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bellows worker uses finger and thumb loops on two sewn wooden strips to
    open the bag into a V shape, admit air, close it, and squeeze out a blast through
    the nozzle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two bellows are used simultaneously, one on each side of the blower, who sits
    between them and works them alternately.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same form of bellows is said to be used by all Kikuyu smiths; the listed
    tools are an anvil, hammer, and tongs, and the listed smelting materials are clean-washed
    iron sand and charcoal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The smelting operation begins at dawn; ore and charcoal are added as the mass
    subsides, and the blast is maintained until sundown before the mass is left overnight
    to cool.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the next morning loose charcoal is scraped away, water is sprinkled on
    the mass, a rope of green banana-leaf midribs is slipped beneath it, and the mass
    is capsized and rolled clear.
  category: sequence
  evidence_refs:
  - ev:6
