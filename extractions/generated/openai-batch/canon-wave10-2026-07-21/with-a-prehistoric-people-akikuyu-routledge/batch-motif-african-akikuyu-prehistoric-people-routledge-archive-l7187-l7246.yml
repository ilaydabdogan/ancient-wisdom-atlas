canonical_text:
  quote: ''
  summary: The passage describes the Akikuyu blacksmith as a highly skilled craftsman,
    outlines the customary procedure for commissioning a spear or other iron article,
    lists the materials and drink supplied by the customer, describes the smithing
    work party and the customer's required presence, explains the fixed goat fee for
    a spear, and lists blacksmith tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The blacksmith is described as making all articles formed of iron and as the
    most highly skilled workman among the Akikuyu.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A customer does not simply order and pay for a metal article; the passage
    says there is a customary routine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For a spear, the customer first visits the smith early in the morning and
    gives a small present of about a quart of n'j6-hi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The customer and smith discuss the spear, including the number of iron blooms
    or blocks and the loads of charcoal to be provided by the customer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The customer obtains the iron and charcoal by barter, either from the producer's
    home or in the market.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The customer's women arrange to brew n'j6-hi, which takes two days, and later
    carry a large calabash of it along with iron pieces and charcoal loads to the
    smith's home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The usual working party consists of the smith, his partner, and a lad who
    works the bellows.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The article is roughed out in the customer's presence, while all except the
    boy refresh themselves with drink from time to time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The customer's presence is said to be essential so he can see the lumps of
    iron beaten out and prevent a claim that apparent iron proved to be slag.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: There is a fixed scale of remuneration for the smith; the fee for making a
    spear is a good goat.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage compares the value of one good goat with the customary thirty-goat
    present connected with acquiring a wife and with about three months of unskilled
    labor.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: The tools listed for the blacksmith are anvils, hammers, tongs, and bellows.
  category: object
  evidence_refs:
  - ev:7
