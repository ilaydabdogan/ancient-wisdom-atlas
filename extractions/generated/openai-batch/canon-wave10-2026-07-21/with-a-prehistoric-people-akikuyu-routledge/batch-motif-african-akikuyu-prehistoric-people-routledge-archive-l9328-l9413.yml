canonical_text:
  quote: ''
  summary: The passage describes Akikuyu music as largely improvised solo song with
    chorus, collective singing by large groups, dance as emotional expression, and
    several sound-producing instruments including animal horns, bamboo horns, iron
    rattles, ankle bells, gourd rattles, and goat or cow bells. It notes gendered
    use of horns, women blowing bamboo horns before dancers at circumcision festivals,
    and boys using gourd rattles inscribed with stories of their journeys.
  language: English
  quote_policy: summarized
