  summary: The passage describes rinderpest, famine, inter-clan fighting over surviving
    cattle, Masai raiding tactics, abandonment of wounded fighters to nocturnal predation,
    and the author’s colonial-era prediction that environmental and colonial change
    will lead to Masai decline while Akikuyu and Akamba reoccupy territory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rinderpest is said to have nearly exterminated the herds, after which famine
    and disease affected the herdsmen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eastern and western clans fought over surviving cattle, and more than a thousand
    dead are said to have lain on the Arthi plain after a pitched battle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Masai battle is described as many simultaneous duels using shield and spear,
    with time and place specified and no quarter given.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When fighting other nations, the passage says that old men, women, children,
    the sick, and the wounded are speared.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Masai raiding is described as a sudden rush from a distant base; raiders advance
    together but each man fights independently.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After resistance breaks, the raiders are said to kill fugitives, round up
    concealed cattle, and drive captured cattle away over long distances.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The passage says there are no enemy prisoners or wounded, and that Masai wounded
    are left where they fall until sundown.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At night a hitti, described as a form of hyena, comes to the wounded man,
    cries out, circles him, and attacks.
  category: action
  evidence_refs:
  - ev:5
