canonical_text:
  quote: ''
  summary: 'The passage describes portions of Akikuyu purification rites: an officiant
    drives uncleanness from a homestead, marks patients with i-ra, gives medicines
    to swallow, and manages a sacrificial meal from which the patient is excluded.
    It then recounts a specific cleansing rite in Tti-so in which a Mun''-du Mu-gu
    and assistants prepare a leaf-lined basin, fresh river water, plant brushes, gourd
    medicines, spoken formulae, and repeated licking and swallowing of medicines.'
  language: English
  quote_policy: summarized
