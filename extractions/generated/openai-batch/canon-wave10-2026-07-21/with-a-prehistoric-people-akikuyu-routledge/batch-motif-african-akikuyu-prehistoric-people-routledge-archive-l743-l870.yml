canonical_text:
  quote: ''
  summary: 'A prefatory source-list explains the authors'' sources of information:
    named Akikuyu employees, non-Kikuyu employees long resident in Kikuyu country,
    other Akikuyu chiefs and assistants, elders, medicine-men, and artisans. It also
    notes British Museum acceptance of illustrated artifacts, including a pottery-making
    series, and defines several Swahili terms used in the book.'
