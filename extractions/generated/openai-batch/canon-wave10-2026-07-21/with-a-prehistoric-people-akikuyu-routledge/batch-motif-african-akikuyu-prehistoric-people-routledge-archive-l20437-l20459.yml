canonical_text:
  quote: ''
  summary: The passage discusses N'gai or Eng-A'i as a Kikuyu Supreme Being whose
    name is said to be borrowed from Masai usage and to mean rain. It reports that
    the Kikuyu form is said to be invisible, that rain, sun, moon, and lightning may
    be worshipped in some sense, and that a Medicine-Man prays to N'gai, the sun,
    or Mount Kenya as equivalent. It also states that N'gai is localized on mountains
    and in sacred trees, and frames this as a possible henotheistic absorption of
    traits from other beings into a rain-god.
  language: English
