canonical_text:
  quote: ''
  summary: The passage describes wealth as highly respected among the Akikuyu. European
    prestige is said to rise with additional tents and mounts, while Akikuyu men who
    accumulate goats and wives are regarded as fortunate and the poor are pitied.
    The passage adds that a wealthy man is thought to be somehow better off after
    death. It then reflects that wealth does not greatly alter ordinary living conditions,
    travel, or tastes, and suggests that wealth may matter because it brings influence.
    The death of a rich relation is described as not wholly sorrowful because of interest
    in the testament, and the passage begins a discussion of difficulties in will-making.
  language: English
  quote_policy: summarized
