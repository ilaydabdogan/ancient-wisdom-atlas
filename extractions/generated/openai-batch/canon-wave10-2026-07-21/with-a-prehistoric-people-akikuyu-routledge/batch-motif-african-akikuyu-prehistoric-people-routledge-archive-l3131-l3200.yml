  quote: ''
  summary: The passage describes preparing snuff by greasing a leaf with rendered
    sheep-tail fat, grinding it on a flat rubbing stone with a stone ball, adding
    grease drop by drop until it becomes damp powder, and selling it in packet form
    in the market. It also notes the packet’s cost and duration for a man, and gives
    a glossary of terms used for male age and status categories.
