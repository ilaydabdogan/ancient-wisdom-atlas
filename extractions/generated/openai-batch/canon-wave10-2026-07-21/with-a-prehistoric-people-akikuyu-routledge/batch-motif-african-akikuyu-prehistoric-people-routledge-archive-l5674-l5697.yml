canonical_text:
  quote: The first mouthful taken must be spat out on to the ground.
  summary: 'The passage describes Kikuyu meal practice: the formal meal occurs at
    sundown, men and women do not eat together, women are restricted from seeing or
    cooking men''s meat, utensils are not used, meat may be divided with a sword point,
    a principal man distributes portions by precedence, diners eat slowly, the first
    mouthful is spat onto the ground, and equals in rank generally eat together.'
