  quote: ''
  summary: 'The passage describes Akikuyu drinking customs: water is drunk when thirsty
    rather than with meals; water sources may become contaminated after rains; cold
    gruel is a common daily drink carried in calabashes; fermented sugar-cane juice
    is the chief alcoholic drink and is restricted to elders; and an illustrated beer-making
    scene shows women pounding cane and men wringing out the juice.'
