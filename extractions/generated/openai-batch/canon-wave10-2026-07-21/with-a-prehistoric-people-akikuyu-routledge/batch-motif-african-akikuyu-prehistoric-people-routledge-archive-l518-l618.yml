  summary: The preface explains reasons for publishing the collected Kikuyu material,
    its intended British and practical administrative audiences, and its scientific
    value as an anthropological record. It emphasizes urgency because customs are
    changing, gives a passing example of boys preparing for tribal initiation with
    decorated shields, describes the author's independent method, and explains nomenclature
    choices for Kikuyu, English, and Swahili terms.
