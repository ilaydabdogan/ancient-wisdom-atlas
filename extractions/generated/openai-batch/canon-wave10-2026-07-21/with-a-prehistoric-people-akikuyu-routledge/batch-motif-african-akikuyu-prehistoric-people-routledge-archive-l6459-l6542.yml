canonical_text:
  quote: ''
  summary: The passage describes Akikuyu fire-making with a hand drill, fire stick,
    sword blade, dry grass, and selected woods. Two participants position the fire
    stick over the sword, rotate the drill by hand, collect wood dust on the blade,
    transfer it to grass, and blow it into flame. It also notes measured timing, carrying
    fire as a smouldering brand, scarcity of fuel in settled Kikuyu areas, isolated
    sacred trees, and a dance in which a small central fire is made with branches
    of a special tree.
  language: English
  quote_policy: summarized
