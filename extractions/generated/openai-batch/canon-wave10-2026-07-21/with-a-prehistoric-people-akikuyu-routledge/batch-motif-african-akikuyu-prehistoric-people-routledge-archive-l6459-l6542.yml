- id: obs:4
  text: The fire-maker rubs his hands and the drill tip on dry ground, places a minute
    quantity of earth into the fire-stick cavity, and rotates the drill by moving
    his palms while pressing downward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: As the drill rotates, smoke appears and powdered wood travels down a gutter
    from the cavity to form a mound on the sword blade.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The coherent dust mound is transferred from the sword blade into dry grass
    and blown several times until the grass bursts into flame.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author reports that producing a mass ready to be blown into flame usually
