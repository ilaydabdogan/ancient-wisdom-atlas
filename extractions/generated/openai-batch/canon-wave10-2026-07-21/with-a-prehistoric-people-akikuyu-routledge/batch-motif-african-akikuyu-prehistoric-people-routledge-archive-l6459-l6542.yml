- id: obs:2
  text: Two participants sit opposite one another; one has the drill and fire stick,
    and a sword is placed on the ground between them with its point toward the drill
    user.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The assistant holds the fire stick across and above the sword tip and keeps
    dry crumpled grass nearby.
  category: action
  evidence_refs:
