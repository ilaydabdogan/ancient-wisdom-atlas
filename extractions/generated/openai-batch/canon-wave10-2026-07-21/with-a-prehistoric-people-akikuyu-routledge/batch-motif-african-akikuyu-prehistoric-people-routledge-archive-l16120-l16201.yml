canonical_text:
  quote: ''
  summary: The passage describes Akikuyu accounts of how a Man of God or Medicine-Man
    is called by God through dreams, visions, illness, and fulfilled premonitions;
    how refusal brings misfortune; and how the candidate begins initiation through
    solitary night seclusion, presentation of a flawless he-goat to an older prophet,
    receipt of a special bush fragment, a public festival, and a water rite in which
    stones are gathered to become divination counters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Akikuyu are reported as saying that the Man of God becomes such in obedience
    to a direct call.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: One Man of God said that, as a young man, he fell ill and a Medicine-Man treating
    him saw something indicating that he too was destined to become a Medicine-Man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that usually there is no previous training or outside prompting;
    God makes the called man dream repeatedly that he is a Medicine-Man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The called man has visions of people bringing him a goat for sacrifice and
    receives sleep-revelations of events that later occur.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: An old man says that a father may teach, but God chooses the Medicine-Man
    and talks to him in the night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The called man tells his wife and friends about his premonitions, and people
    recognize that God has marked him out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'If the called man resists, God is said to become angry and send misfortunes:
    children and goats die, and village inhabitants become ill.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The candidate’s first step is to spend a night alone in the woods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The candidate brings a he-goat to the old prophet whose guidance he has chosen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The he-goat must be entirely black or entirely white, without a hair of the
    other color, and must not come from the candidate’s own flock.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The old prophet goes to fallow land, selects and cuts a special bush, and
    takes a small piece of root or trunk to be given later to the neophyte.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The special bush piece is said to be found, after the neophyte’s death, on
    the site of his down-thrown hut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: On the appointed day the future Medicine-Man goes to the mentor’s home, where
    friends, relations, the general population, and the Medicine-Men of the district
    assemble.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The candidate’s wife prepares drink; close friends bring sheep and goat skins;
    others bring food and drink; the occasion is described as a popular festival.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The initiation into medicines and divination by numbers is described as a
    public ceremony.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: Early in the rite, the candidate takes the flawless goat into his bosom and
    wades into shallow water with a small boy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Resting on the goat with his head entirely under water, the candidate grasps
    two handfuls of stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The stones become the nucleus of counters, literally called “seeds,” kept
    in the candidate’s lot-gourd.
  category: object
  evidence_refs:
  - ev:7
