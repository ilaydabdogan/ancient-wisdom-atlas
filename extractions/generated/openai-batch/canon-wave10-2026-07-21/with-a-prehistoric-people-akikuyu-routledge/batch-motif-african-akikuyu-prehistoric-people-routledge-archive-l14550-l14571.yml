  summary: A man accused in a poisoning-related matter undergoes a severe ordeal involving
    a sheep, protruding intestines, and a collar. Spectators comment on the accusation
    and one declares that he should no longer be called a poisoner after enduring
    the ordeal. Three men are assigned to prevent him from seeking purification from
    a Medicine-Man, and the narrator states that the final outcome is unknown.
