canonical_text:
  quote: The customs connected with childbirth are those rather of use than ritual.
  summary: The passage describes Akikuyu customs surrounding childbirth, including
    maternal diet, washing and seclusion, purification and shaving, a feast, placenta
    disposal, an observed birth case, midwives’ washing and payment, hut cleansing,
    and rules around admiring the infant.
  language: English
  quote_policy: quoted
literal_observations:
