  text: The passage characterizes childbirth customs as matters of use rather than
    ritual.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six days before confinement, the mother is said to eat only flour and milk
    and to avoid meat and vegetables.
  category: action
  evidence_refs:
