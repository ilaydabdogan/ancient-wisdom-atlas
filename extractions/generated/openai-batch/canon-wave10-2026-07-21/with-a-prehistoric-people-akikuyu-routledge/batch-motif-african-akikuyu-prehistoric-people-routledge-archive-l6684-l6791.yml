canonical_text:
  quote: ''
  summary: The passage describes Kikuyu string bags and string-making techniques,
    including the twisting of fibre into two-strand cord, the use of wild vines for
    heavier binding, and the price of twine. It then introduces iron-working, describing
    iron smelting in Kikuyu hill country, the narrator's difficulty obtaining truthful
    information about the ore source, the eventual identification of an open quarry
    nearby, and the widespread possession and remembered antiquity of iron among the
    Akikuyu.
  language: English
  quote_policy: summarized
