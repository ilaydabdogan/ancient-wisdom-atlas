canonical_text:
  quote: ''
  summary: 'The passage describes Kikuyu land and agricultural practices: trees used
    for bee-boxes, hut-building, and timber; rules of permission and payment for woodland
    and fallow land; cultivated plots and crops; gendered agricultural labor; tools
    used for breaking and hoeing soil; and an agricultural year organized around two
    rainy seasons, two seed times, and two harvests.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some trees are used for bee-boxes and become conspicuous objects in the landscape;
    a traveler seeking shade may find bees already occupying them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pollarded trees among cultivated land are spared because their shoots are
    useful for hut-building.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Small copses are preserved for timber, and using them requires leave and payment;
    they are described as belonging to the chief or to the elders.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The clan M'we-sa-ga is said to have an obligation to keep certain lands under
    woodland.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fallow land is privately owned, and another person may not cultivate it without
    the owner's permission; payment is often expected in goats.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cultivated land is arranged in lots or fields, with arable ground assigned
    to the care of each wife of the homestead head, and includes plantations of bananas,
    manioc, and sugar-cane.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The whole people are described as cultivators of the soil; men clear forest
    or fallow brushwood, break the surface, scare birds, and may also plant, hoe,
    and harvest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'Two agricultural instruments are named: the wooden crow-bar mu-ga-rti-ru
    for breaking ground and the iron ka-hi-yu for prizing up soil.'
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The equatorial year is described as having two wet seasons; planting begins
    with the rains, harvesting follows crop ripening, and there are two seed times
    and two harvests in twelve months.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The authors used paper moon phases and counters for rain, hoeing, birds, and
    other items to elicit what informants considered a typical Kikuyu agricultural
    year; the result is described as an ideal rather than an absolute statement.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A plate caption describes women hoeing and shows their method of holding the
    ka-hi-yu during field-work.
  category: action
  evidence_refs:
  - ev:11
