canonical_text:
  quote: ''
  summary: The passage introduces N'jenge and Ilimu as legendary beasts or monsters,
    describes their attributes, and begins the story of M'wambia and the N'jenge.
    In the story, two half-brothers set snares for N'jenge; the younger kills and
    eats one, while the elder releases one. After the younger reports this, the father
    punishes the elder by leaving him in a tree surrounded by sharpened stakes. After
    twenty days, an N'jenge comes to him and speaks.
  language: English
