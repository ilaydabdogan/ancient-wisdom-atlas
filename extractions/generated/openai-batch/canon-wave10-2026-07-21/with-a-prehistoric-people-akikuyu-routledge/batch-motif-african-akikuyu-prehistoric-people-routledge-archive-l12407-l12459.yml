canonical_text:
  quote: ''
  summary: 'The excerpt describes post-circumcision initiation procedures: a fourth-day
    head-shaving and bead adornment for boys, beer-drinking and parental participation,
    caregiving during convalescence, sheep and goat killing, dismantling and burning
    of the kikan''da, return home, ceremonial presents, and a three-month holiday
    before work resumes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fourth day is devoted to shaving heads, and each boy is treated in this
    way.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A little girl begins the shaving, and an older female relation who is not
    the boy's mother finishes it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy is adorned with beads given by a young girl; the beads are worn over
    one shoulder and under the other arm, more are added when he shakes his head,
    and they are later slept in for one night by the mother of the homestead before
    being returned.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman described as the lady barber is entitled to a present.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women caring for girls and young men caring for boys consult; when the children
    are free from pain they request n'johi, sugar cane is cut, drink is made, and
    fathers and mothers partake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: While children are in neighbours' care, their mothers bring food; two sheep
    are killed, and convalescence lasts eight to ten days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the end of the period the kikan'da is taken down and burnt, and the inhabitants
    return to their homes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A goat is killed by the boy's family to welcome the returning child, and presents
    of goat meat, beer, and other items are given to the homestead head, the shaving
    woman, and the young male caregivers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Boys and girls have a further three-month holiday before returning to work.
  category: sequence
  evidence_refs:
  - ev:6
