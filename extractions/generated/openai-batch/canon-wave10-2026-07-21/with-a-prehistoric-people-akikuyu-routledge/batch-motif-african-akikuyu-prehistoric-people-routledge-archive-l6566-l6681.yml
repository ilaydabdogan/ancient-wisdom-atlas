canonical_text:
  quote: ''
  summary: The passage describes Akikuyu string-making from tree bark and animal tendons,
    including plant names, manufacturing steps, uses of cord, gendered customs governing
    who makes certain kinds of string, a circumcision-related cord made by a mother,
    tendon sourcing, and a plate caption explaining string-bag weaving.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: String is used for various purposes, sold in native markets, and made from
    certain tree barks and from animal tendons.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vegetable string is called mu-gi-o, and the passage lists several plants or
    trees whose bark may be used for it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The manufacturing sequence for vegetable string is to peel rods, chew stripped
    bark, roll the masticated fibre into yarn, then roll two yarns in reverse direction
    into a two-stranded cord.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cord is woven with the fingers into bags and is also used for snares, repairing
    calabashes, stringing beads, tying sweet-potato tops, and binding sugar-cane pulp
    for juice extraction in fermented-drink making.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Custom assigns some string-making tasks to women and others to men; a mother
    must make a small cord for a leaf bundle used in her son's circumcision ceremony.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tendon string comes chiefly from domestic goats, sheep, and oxen, with a small
    amount from wild game obtained by barter with N'dorobo hunters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: After an animal is skinned, tendons are placed singly in a cleft stick, which
    is worked backwards to separate flesh from ligament; the tendons are then dried.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A string bag being woven is supported by a cord around the maker's neck so
    that its weight is held and her hands remain free.
  category: action
  evidence_refs:
  - ev:7
