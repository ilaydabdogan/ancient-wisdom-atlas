canonical_text:
  quote: ''
  summary: A scholarly appendix discusses theories of religion and applies them to
    Akikuyu beliefs about N'gSma or N''g6-ma spirits, possession, disease, offerings,
    and animal or object powers, including a caterpillar, hyena, kite, mongoose, sacred
    Mu-gu-mu tree, elephant skull, and snake omen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage contrasts animism or ghost-theory with anthropomorphic theism
    and dynamism, also called the pre-animistic theory.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pre-animistic hypothesis is described as treating religious and magico-religious
    objects primarily as powers.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Examples of such powers include an uncanny animal, a lucky stone, and a thunderstorm
    that makes things grow.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Akikuyu N''g6-ma or N'gSma is described as a typical anima, like the wind,
    invisible, and making a whirring sound.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A dead man's Wgdma is said to be able to enter a living man temporarily, by
    analogy with breath passing out of one body and into another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage uses possession by a father's spirit needing an offering of fat
    as an explanation for a bad night or disease.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The possession theory is said to be extended to the Ta-tu caterpillar because
    it comes into the house like a deceased relation might wish to do.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hyena, kite, mongoose, sacred Mu-gu-mu tree, and elephant's skull are
    listed as cases that place strain on the ghost-theory.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The mongoose is reported to have two native explanations: some say it contains
    a spirit, while others say it means good luck.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The snake is described as simply unlucky, with N'gSma no longer in question,
    and as able to spoil a projected journey.
  category: attribute
  evidence_refs:
  - ev:7
