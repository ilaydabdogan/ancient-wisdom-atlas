canonical_text:
  quote: ''
  summary: 'The passage describes daily safari camp logistics in Kikuyu: load distribution,
    breaking camp before dawn, order of march, travel pace, landscape between Nairobi,
    Fort Hall, and Nyeri, and welcomes with gifts from local people connected to chief
    Wombugu. It also includes captions for images of porters, donkeys carrying loads,
    and a homestead at Nyeri.'
  language: English
  quote_policy: summarized
