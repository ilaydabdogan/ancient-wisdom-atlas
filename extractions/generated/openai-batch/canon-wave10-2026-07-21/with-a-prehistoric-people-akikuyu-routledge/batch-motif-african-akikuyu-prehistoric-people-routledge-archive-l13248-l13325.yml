canonical_text:
  quote: ''
  summary: An ethnographic description of a Kikuyu mixed dance held at night under
    a full moon. Men and girls form a ring around a central fire, sing call-and-response
    verses, sway rhythmically, are supervised by a master of the dance and assistants,
    and later shift into a separated men-and-girls ring with crouching movements.
    Chaperons and children watch and eventually join the excitement, while favoured
    warriors are led around the fire and out of the ring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mixed dances of men and women are described as constantly held and popular.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dances described as most picturesque are held every night when the moon
    is full.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The observers approach through the shadow of a sacred grove and arrive at
    an open space lit by moonlight.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Small fires are set around the green for older people and children, and a
    blazing bonfire is placed in the centre.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A dance director with a torch marshals the dancers; he is described as a leading
    warrior with vulture plumes and a sword in a scarlet goatskin scabbard.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dancers form a complete ring around the fire, with men standing with their
    backs to the fire and girls facing them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each girl places her hands on a man's shoulders, while the man puts his arms
    around her waist and holds a wooden dancing spear behind her with its butt driven
    into the ground at her heels.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The group stands in silence before a warrior begins a verse to a known tune.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The quoted song names Wa-ma-hu and contrasts once being a boy who tended goats
    with now being a man who eats bananas.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The dancers reply in chorus and rhythmically clasp one another while the circle
    sways in time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Talking during the dance is forbidden, and transgressing couples are struck
    over the head with a burning torch by deputy masters of ceremony.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The master and assistants give pantomimic expression to the statements sung
    by the performers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Chaperons watch their daughters outside the ring, with children who are too
    young to participate.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The form of the dance changes so that men and girls occupy separate parts
    of the ring, all facing inward toward the fire.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The later movement includes a semi-squatting posture, head movement, bent-arm
    jerking, and body swaying.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The chaperons and youngsters rise from their small fires, join the song, and
    imitate the crouching movements.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: The master of the dance and assistants lead selected favoured warriors by
    the hand around the fire and out of the ring, while the group applauds and women
    utter a treble lu-lu-lu.
  category: sequence
  evidence_refs:
  - ev:13
