canonical_text:
  quote: ''
  summary: 'The passage describes Akikuyu food habits: they are characterized as largely
    vegetarian; meat is eaten as a luxury in small quantities on sacrificial or festival
    occasions; unfamiliar cereals and vegetables are resisted; European bread and
    biscuits are unattractive, while sugar and salt are liked. Refined white European
    salt is refused as suspected poison, while crude yellow-brown salt crystals with
    coral grit are accepted eagerly.'
