canonical_text:
  quote: ''
  summary: The passage describes Ai-twi-ka, a semi-secret snake cult in Karuri's country,
    its sanctions against disrespect, a large festival prepared over two years, instruction
    of neophytes by seniors, ritual horns and sacred hut areas, offerings to the river-dwelling
    snake N'da-ma-thi-a under the custodianship of Mu-tha-ka, sacrifice-day avoidance
    rules, a procession to the snake's abode, offerings floated in a goat trough,
    horn-blowing during the snake's feeding, extraction of the intoxicated snake's
    hairs for charms, secrecy, and associations with rain, the rainy season, the rainbow,
    and protection from ills.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says local semi-secret societies in many parts of German and British
    East Africa share snake worship as a common point.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Karuri's country there are two such societies, and the cult known as Ai-twi-ka
    is estimated to include about half the population.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: An outsider who treats the subject disrespectfully must forfeit a sheep or,
    failing that, is severely beaten and has his house burnt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The snake worship festival was celebrated twice during the M'wan'-gi generation;
    the first festival was in 1891 and preparation for the second began in September
    1903.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ordinary houses were built around the homestead of chieftainess Wan'-go for
    instructing neophytes, and preparations took two years.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each hut was in charge of a senior who instructed neophytes in mysteries.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Each temple contained two horns said to be from the animal N'don-go-ru; one
    horn was used daily during instruction and one reserved for the final festival.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: Some portion of every hut was sacred, the sacred part changed from time to
    time, and anyone inadvertently touching it was fined.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:9
  text: The snake, called N'da-ma-thi-a, lives in the Ma-thi-oy-a River and is described
    as very big and long.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The snake is in the charge of a man named Mu-tha-ka.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: At festival time oxen, sheep, and honey are brought to Mu-tha-ka, with each
    little district providing a share; a portion is dedicated to the snake and the
    rest is kept by the custodian.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: The honey is made into beer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: On the day of sacrifice, the Mu-i-run'-gu generation stays in its houses and
    must not look at the M'wan'-gi generation; if a Mu-i-run'gu meets a M'wan'gi,
    he must flee and hide.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: A procession goes to the abode of the snake, and a sacrifice of meat, bananas,
    beer, and other items is placed in a goat trough and sent out onto the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: Horns are blown when the snake is visible and again when it has finished feeding.
  category: action
  evidence_refs:
  - ev:4
- id: obs:16
  text: The people who blow the horns and feed the snake are held from behind to prevent
    them from running away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:17
  text: After the snake becomes intoxicated, one man pulls out its hairs, which are
    used as charms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: The ceremony concludes with singing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:19
  text: Secrecy is maintained because participants say that if they tell any man one
    word about the affair, they will surely die.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:20
  text: The festival is said to be associated with the rainy season and the rainbow,
    to ensure plentiful rain, and to protect from various ills.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:21
  text: The passage states that a connection in the native mind between the rainbow
    and a snake is shown in various folk tales.
  category: relationship
  evidence_refs:
  - ev:6
