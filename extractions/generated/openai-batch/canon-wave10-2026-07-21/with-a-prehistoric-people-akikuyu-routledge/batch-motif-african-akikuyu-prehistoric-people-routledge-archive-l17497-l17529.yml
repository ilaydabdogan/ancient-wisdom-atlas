canonical_text:
  quote: ''
  summary: The passage describes treatment of sword and spear wounds by closing them
    with thorns, an iron awl, vegetable-fibre stitching, figure-of-eight binding,
    and reef knots. It attributes success partly to delaying closure until bleeding
    has nearly stopped, and comments on rapid wound healing, septic absorption, pain
    sensitivity, shock, and limitations of observations on dental, circumcision, and
    obstetric practices.
  language: English
