  summary: The passage is a concluding ethnographic discussion of Kikuyu under English
    rule. It describes fears over land loss, the declaration of Kikuyu as a native
    reserve without guaranteed individual tenure, the abolition of tribal war, changes
    in men’s and women’s work and protection, and debates over labor compulsion, taxation,
    and adoption of white customs.
