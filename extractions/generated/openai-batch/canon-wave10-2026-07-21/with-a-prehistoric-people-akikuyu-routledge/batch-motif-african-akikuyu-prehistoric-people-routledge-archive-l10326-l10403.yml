  quote: ''
  summary: 'The passage describes part of an Akikuyu betrothal and marriage sequence:
    drinking and food sharing, livestock exchange, mothers'' gourd-and-grass custom,
    gender etiquette at the feast, preparation of a shamba and a house, permission
    to take the girl, and her seizure and carriage to the new hut where she weeps
    for four days.'
