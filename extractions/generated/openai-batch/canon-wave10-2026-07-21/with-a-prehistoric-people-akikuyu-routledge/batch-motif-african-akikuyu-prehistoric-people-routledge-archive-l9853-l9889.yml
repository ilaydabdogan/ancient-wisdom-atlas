canonical_text:
  quote: ''
  summary: The passage contrasts an outsider's impression of Kikuyu women doing fieldwork
    and carrying firewood with the author's description of women's home life. It recounts
    a visit with an older widow to her homestead, passing a sacred grove and cultivated
    land, and describes female kin receiving the visitor and discussing weather, crops,
    and a grandchild. It ends by beginning a statement about women's lack of legal
    status.
