canonical_text:
  quote: ''
  summary: 'The passage describes a Kikuyu sacrificial feast under sacred trees: selected
    groups participate, Munge and others dedicate meat and fat to God at the tree,
    body parts are arranged by direction, and a concluding prayer with fat poured
    over the tree is followed by song and rain. A second, reported account describes
    a midnight sacrifice in which an old man places black pudding and gruel at a sacred
    tree, after which N''gai descends from heaven into the tree, eats the offering,
    and returns into the branches.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Different groups sit beneath different trees: some Kiama partake of the sacred
    feast, while the Moran''ja consume n''johi but no meat.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Munge wraps a preserved strip of fat around the root of the tree, tears pieces
    from a joint with his teeth, spits pieces on the ground, and also spits into his
    left bosom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Munge and the narrator place meat at the foot of the tree, and this is described
    as an offering made to God.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: During the feast, each man periodically places selected morsels on a pile
    beneath the tree as offerings to God; remaining portions and rendered fat are
    later added.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Specific parts of the ram are placed in cardinal directions around the tree:
    pudding to the south, penis to the north, tail tip to the west, and head to the
    east.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the head is first placed to the west, Munge corrects the placement and
    reprimands those responsible.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the concluding prayer, all rise and hold both hands aloft while Munge faces
    west and pours liquid fat over and down the tree between prayers; the assistant
    and narrator then do the same.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the fat is finished, participants lower their arms, sing, and recess
    in a storm while leaving their gifts at the altar.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that clouds gathered during the ceremony and broke in lightning,
    thunder, and rain at its conclusion, described as God's answer to the prayers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A second account, said to differ from the witnessed ceremony, describes a
    midnight sacrifice in which an old man takes black pudding and gruel to the sacred
    tree, places the meat offering on the ground, pours gruel around it, and retires
    into darkness.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: In the second account, N'gai sees the fire in his grove and the preparation
    of the sheep, descends from heaven into his tree, swings down, eats the food,
    and climbs back into the tree.
  category: action
  evidence_refs:
  - ev:8
