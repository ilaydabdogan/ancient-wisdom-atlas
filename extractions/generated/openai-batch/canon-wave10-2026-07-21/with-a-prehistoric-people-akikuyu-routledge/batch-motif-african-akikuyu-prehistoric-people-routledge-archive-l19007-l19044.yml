  quote: ''
  summary: Washishi is buried alive by the other girls near a sacred tree. Her younger
    brother hears her voice while tending cows, and her family digs her out. After
    recovering, she prepares three gourds of milk, sprinkles the girls with milk using
    animal tails so they sleep, demands goats from their fathers as compensation,
    and then wakes the girls by sprinkling them with cow's milk.
