  quote: ''
  summary: The passage describes Akikuyu suspension-bridge construction using Y-shaped
    uprights, crossbars, posts, ropes, tree trunks, and tough creepers. It praises
    the engineering principle, compares the design with a Staff College demonstration
    bridge, recounts a risky mass crossing, and notes that bridges between leafy riverside
    trees can be concealed and defended by cutting approaches or using war-pits.
