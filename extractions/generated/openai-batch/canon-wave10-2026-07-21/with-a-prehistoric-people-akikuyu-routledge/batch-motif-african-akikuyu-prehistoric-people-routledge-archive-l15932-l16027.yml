canonical_text:
  quote: ''
  summary: The passage describes Akikuyu customs and authorial claims about hospitality,
    reciprocity, gifts accompanying requests, limits of obligation toward strangers,
    cases of refused aid to vulnerable strangers, fear of death-related defilement,
    and reported attitudes and incidents concerning suicide. It also briefly alludes
    to a folk tale in which a hero kills himself after his supernatural benefactor
    is slain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a person who has received hospitality is customarily
    expected to be no less generous when the former host later comes to his dwelling.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage recommends that a European head residence or camp keep a guest
    hut, firewood, and cooking pots ready for an important native visitor.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that travellers or officials who receive native hospitality
    and cannot return it should discharge the obligation immediately with money or
    goods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that a small present is sent when asking a favor and that
    a message may be accompanied by a little gift.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage claims that, except in previously noted circumstances, the Akikuyu
    acknowledge no moral or customary obligation to befriend the poor or stranger
    or to protect a guest’s life and property.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage claims that a host may still murder a stranger who has eaten his
    food and slept in his hut, and that a guest likewise feels no moral obligation
    not to kill his host.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: One anecdote describes an old, poor, ill man in the wilds near a small fire,
    badly burned while trying to keep warm.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The same old man is described with his back placed in a hollow tree against
    hyenas, with a calabash of water nearby but no food.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: When remonstrated with, the local people are reported as replying that the
    man was a stranger and could do nothing for them, either good or harmful.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A similar case is reported at Nyeri, where an old woman was allowed to starve
    because she was old, friendless, and a stranger.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says that a fear of defilement from death in a hut and fear of
    being accused of poison partly explain such refusals of aid.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says suicide occurs but not frequently, and that the Medicine-Man
    is the usual refuge in distress.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage alludes to a folk tale in which the hero kills himself when his
    supernatural benefactor is slain.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage lists poverty and desertion by friends as usual causes of suicide,
    and hanging, drowning, and stabbing as methods.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says suicide is regarded as reprehensible or very bad, and that
    a man who saw his friend hanging would cut him down.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage says that in some cases friends might poison a wrongdoer without
    his consent rather than let him be punished by others.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A cited missionary report says both parents attempted suicide when their eldest
    son refused to conform to tribal practices; the father tried stabbing and the
    mother twice tried hanging.
  category: sequence
  evidence_refs:
  - ev:10
