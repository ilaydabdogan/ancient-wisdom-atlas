canonical_text:
  quote: ''
  summary: 'The passage describes reported Akikuyu witchcraft and counter-witchcraft
    practices: a Ki-tha-si ritual sends curses by sticks, followed by goat sacrifice,
    shaving, and concealment of the object; other revenge methods include medicine
    placed in food, use of an offender''s hair, and curse-bearing objects laid in
    a path; counteraction involves a Medicine-Man, animal killing, cleansing, and
    ingestion of a goat-derived mixture.'
  language: English
  quote_policy: summarized
