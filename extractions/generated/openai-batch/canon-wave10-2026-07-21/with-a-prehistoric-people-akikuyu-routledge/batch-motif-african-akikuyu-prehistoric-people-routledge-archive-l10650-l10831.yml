canonical_text:
  quote: ''
  summary: 'The passage gives family-size and child-mortality examples, then describes
    the social authority and ritual standing of older Kikuyu women. A woman whose
    first-born is initiated shaves her head permanently, receives the title Mu-te-mi-a,
    and wears copper earrings. Older women are described as respected and feared for
    possible medicine-making. Women do not sit in judicial councils, but some exercise
    political or domestic authority. In hut-site selection, old women on a committee
    are said to prevail because childbearing is a great work. Mothers also participate
    in initiation observances: a man anoints candidates with ira, and an old woman
    follows with oil. One woman is mentioned as calling herself the wife of God and
    apparently forming a cult.'
  language: English
  quote_policy: summarized
