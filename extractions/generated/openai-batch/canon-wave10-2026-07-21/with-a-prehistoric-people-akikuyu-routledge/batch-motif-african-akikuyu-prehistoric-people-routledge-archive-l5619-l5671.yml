canonical_text:
  quote: ''
  summary: 'The passage describes Kikuyu kitchen practices: women perform most non-meat
    cooking and related provisioning; cooking is done on small fires without rites;
    pots, calabashes, gourds, stirring implements, and serving practices are described;
    a cracked pot is ritually prohibited for cooking or eating; and kitchen middens
    are said not to exist.'
  language: English
  quote_policy: summarized
