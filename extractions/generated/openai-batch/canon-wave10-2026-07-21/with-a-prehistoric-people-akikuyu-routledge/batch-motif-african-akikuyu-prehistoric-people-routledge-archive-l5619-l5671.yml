  text: Roasting and frying are not practiced, baking is unknown, while cooking among
    hot embers, grilling, boiling, and stewing are recognized food-preparation methods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cooking pots vary in size, have only two shapes, have no lids or stoppers,
