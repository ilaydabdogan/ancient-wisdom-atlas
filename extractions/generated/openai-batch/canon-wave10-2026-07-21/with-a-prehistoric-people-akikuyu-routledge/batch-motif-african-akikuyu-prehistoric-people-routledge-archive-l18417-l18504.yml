canonical_text:
  quote: ''
  summary: A prefatory note says similar stories about the devouring rainbow and its
    occasional snake connection are found in several distant traditions. In the tale,
    a boy herds goats onto protected pasture at his father's direction. The pasture
    owner, Mukun'ga M'Bura, a very large and tall man who lives in the great water,
    confronts the family and devours the father, people, livestock, houses, and stores;
    only the boy escapes. The boy grows strong, returns as a warrior, confronts Mukun'ga
    M'Bura, opens the giant's middle finger at his request, and the swallowed people
    and goods come out restored. The warrior spares him after he promises not to eat
    them again, but later fears he may return.
  language: English
  quote_policy: summarized
