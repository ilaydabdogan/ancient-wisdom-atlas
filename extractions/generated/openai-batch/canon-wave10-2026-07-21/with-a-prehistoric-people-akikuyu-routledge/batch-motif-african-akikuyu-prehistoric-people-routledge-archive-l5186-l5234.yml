canonical_text:
  quote: Broiling on a wooden grid is the customary way of cooking flesh.
  summary: 'The passage describes practical distinctions in slaughter acceptability
    for Swahili Muslim cooks and Kikuyu recipients, then gives an ethnographic account
    of Akikuyu methods for cooking flesh: broiling meat on a green-stick grid over
    embers, occasional roasting on a spit, women making a meat-and-vegetable stew
    after childbirth, and cracking long bones for marrow.'
