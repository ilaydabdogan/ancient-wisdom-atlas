canonical_text:
  quote: ''
  summary: An editorial note introduces two following tales as variant versions of
    the same story, gathered from different informants. The first version begins with
    an orphaned young warrior and his sister living alone in an isolated hut. The
    brother is admired for his long hair and often travels away, leaving his sister
    by herself. When he returns from one absence, she says that three men came the
    previous night.
  language: English
