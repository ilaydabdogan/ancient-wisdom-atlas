canonical_text:
  quote: ''
  summary: 'The passage describes Kikuyu gendered and age-marked divisions of labor:
    women cultivate fields, cook, bring firewood and water, store grain, and help
    with household tasks, while men protect the home and may fight or raid. It also
    describes women''s ownership-like relation to cultivated plots and granaries,
    long-distance burden carrying, forest wood gathering, and water transport from
    valleys to hill settlements.'
  language: English
  quote_policy: summarized
