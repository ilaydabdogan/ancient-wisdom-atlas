canonical_text:
  quote: ''
  summary: 'A girl reports that M''wambia is alive and wealthy. His family visits
    him across a river; his father drowns during the crossing because he had been
    cruel, while the others settle with M''wambia. After M''wambia''s relations kill
    his friend the N''jenge, whom he describes as being of one heart with him, he
    kills the household, livestock, and himself. A reported variant from another district
    gives different details: M''wambia is staked out, animals and the N''jenge free
    him, the father again drowns at a stream crossing, and the ending is prosperous.'
  language: English
  quote_policy: summarized
