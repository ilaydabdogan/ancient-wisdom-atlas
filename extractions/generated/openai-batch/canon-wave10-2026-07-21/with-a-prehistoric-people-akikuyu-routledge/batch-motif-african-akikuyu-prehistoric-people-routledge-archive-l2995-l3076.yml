  summary: A colonial ethnographic passage describes Akikuyu character and manners,
    including path precedence, courteous conduct, spitting on objects for luck, spitting
    on persons or things as goodwill, examples involving a blacksmith, greeting hand,
    visitors and a youngster, an anecdote of an old man extending a spat-in palm to
    a dog, and snuff as a courtesy item.
