canonical_text:
  quote: ''
  summary: 'The passage opens the section on Kikuyu social and political life with
    an epigraph about archaic society as an aggregation of families, then describes
    Kikuyu family life through the homestead: its hillside placement, enclosure, huts,
    compounds, wife-specific houses and food stores, young men''s hut, continuity
    between parental and married sons'' dwellings, interior hearth and furnishings,
    and regular cleanliness related partly to goats being housed at night.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the family and the family homestead are the basic
    unit of Kikuyu life, and that villages strictly speaking are absent, though homesteads
    may cluster near a chief.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:2
  text: Homesteads are described as scattered or clustered across the country and
    almost always built on hillsides because these positions are warmer than damp,
    low-lying valleys.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:3
  text: Each homestead has an enclosure; in former times each was surrounded by a
    high green hedge or stockade with a low arched entry of greenery.
  category: object
  evidence_refs:
  - ev:4
- id: obs:4
  text: The hedge or stockade enclosure is said to serve for cattle, defence, and
    concealment.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Very wealthy men's homesteads, including chiefs' homesteads, generally have
    an outer and an inner compound.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Homestead size varies with the wealth of its owner: a poor man may have one
    hut, a rich man eight or ten, and a chief more.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Each wife is entitled to her own house, and where there are several wives
    the owner also has a hut for his own accommodation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The thingira is a hut for young men that functions as a guest-house and may
    also serve as bachelor lodging for young men from several homesteads.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A young man marrying generally builds just outside and near the parental homestead,
    though sometimes within the same enclosure.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the head of the establishment dies, a grown-up son may become guardian
    of his father's wives.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The homestead contains small barns or large baskets on legs for storing food;
    each wife has her own, and their number indicates the household's inmates.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The hut interior is dark, has a fireplace in the centre, wall compartments
    used as beds, a cupboard space, storage vessels, and wooden stools.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The narrator says huts and homestead grounds are usually clean and orderly,
    and that goats are taken into the huts at night, requiring regular sweeping.
  category: action
  evidence_refs:
  - ev:11
