canonical_text:
  quote: ''
  summary: 'The passage records Akikuyu legal penalties and procedures: livestock
    payments for killing, injuries, theft, honey theft, and marital disputes; fees
    and meals for elders; severe penalties for persistent theft and child abuse; a
    statement that N''goma may see an abusive deed and bring sickness and death; and
    comments on informers, elders'' public opinion, and confession.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Personal injury penalties are listed by district and are paid mainly in goats,
    cows, sheep, or milk goats; murder penalties differ for a man and a woman, while
    other injuries are said to carry the same penalty regardless of sex.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Where two forfeits are mentioned, the added animals are described as fees
    paid to the elders.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Theft penalties are expressed as multiplied repayment in livestock, with separate
    entries for stolen goats, oxen, and honey from a bee box.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Persistent theft is said to lead, depending on district and circumstances,
    to a sheep fine eaten by elders, banishment, burning alive with grass around the
    neck, confiscation of possessions, or killing at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For abuse of a child, the culprit is described as beaten with a club, fined
    twenty goats, sent out of the country, and potentially made sick and dead if the
    deed is seen by N'goma.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Divorce and adultery procedures depend on whether the woman has borne or is
    about to bear a child; elders may receive sheep and n'johi, and livestock payments
    pass among the co-respondent, father, husband, and wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says informers are encouraged by a substantial present from the
    injured party, elders express public opinion about guilt, and guilty persons are
    described as having an impulse to confess.
  category: relationship
  evidence_refs:
  - ev:7
