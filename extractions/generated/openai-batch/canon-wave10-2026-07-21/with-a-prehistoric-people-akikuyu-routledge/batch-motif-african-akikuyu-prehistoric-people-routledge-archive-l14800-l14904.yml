canonical_text:
  quote: ''
  summary: The passage describes forces enforcing Kikuyu elder decisions, including
    public opinion, custom, family responsibility, and occasional mob violence; notes
    the burden of court fees; recounts a reported conspiracy by old men to murder
    rich neighbours and take their goods; discusses preference for wergild and legal
    discussion over revenge; gives a native assessment of inequality in older justice;
    and contrasts local Kiama and chief-based justice with English colonial courts
    and the British judiciary's stated aim of suppressing native justice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Decisions of elders are said to be upheld by public opinion, custom, family
    responsibility, and, in the last resort, lynch law by an aggrieved populace.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Court fees are described as burdensome; plaintiff and defendant each pay one
    sheep to the elders and may have to repeat the donation during a prolonged case.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Munge's son recounts that old men conspired to kill rich neighbours without
    grievance, killed the victims with a spear, and took their goats.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that obtaining the dead man's wergild was usually more
    important than taking bodily revenge on the murderer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: When asked about relations of a murdered man wishing to fight, the old men
    are reported to say not to fight but to make a shauri; if a son killed his father's
    slayer, they would say two men are dead and the affair is ended.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: One native commentator says that in earlier times the strong righted themselves,
    the rich paid for justice, and the weak and poor had no redress.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Since British occupation, justice for natives is also administered in English
    courts, which the passage says tends to destroy local administration.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ka-ran-ja's three sheep were stolen after being entrusted to a friend; the
    account says that formerly he would have gone to the Kiama, while under the newer
    system he might ask for a letter to a Government official, and in the event three
    Kiama and chief Karuri were involved and the sheep were recovered.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The East African Judiciary is said to have an avowed object of suppressing
    native justice as derogatory to the dignity of British courts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author argues that English courts should have access, appeal, and final
    authority in grave cases, but questions whether white magistrates should handle
    small local disputes and whether English officials can understand native custom.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
