canonical_text:
  quote: ''
  summary: 'The passage describes several Akikuyu procedures and restrictions surrounding
    disposal of the dead: a reported but uncertain practice involving a small door
    for a hyena; removal of a corpse from a hut to uncultivated land; purification
    requirements for corpse-handlers; avoidance of touching corpses by spouses and
    most women; removal of a fatally ill person to the wilds before death; abandonment,
    demolition, or burning of a hut associated with death; and the beginning of a
    note that burial is reserved as an honor for an old, rich man.'
  language: English
  quote_policy: summarized
