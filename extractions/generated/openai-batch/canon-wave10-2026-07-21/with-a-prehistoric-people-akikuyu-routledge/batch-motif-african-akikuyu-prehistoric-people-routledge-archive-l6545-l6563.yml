canonical_text:
  quote: ''
  summary: The passage states that in one proceeding the smoke from special herbage,
    not the fire itself, is significant. In sacrifice, fire is used only to cook the
    meat and is said to have no sanctity. A living man escaping the "Bad People" could
    evade them by putting a fire between himself and the ghostly pack. The passage
    also says that a spirit seems to be associated with the fire in a hut. When a
    new hut is built, the three fireplace stones must be new and uncontaminated, but
    no special attention is given to the first fire made within them.
  language: English
  quote_policy: summarized
