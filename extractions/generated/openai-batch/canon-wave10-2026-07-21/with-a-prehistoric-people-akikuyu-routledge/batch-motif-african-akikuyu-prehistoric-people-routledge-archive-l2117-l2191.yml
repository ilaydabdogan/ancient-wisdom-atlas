canonical_text:
  quote: ''
  summary: The passage describes traditions about A'si and Agum'ba preceding or living
    near early Akikuyu migrants, an M'kikuyu obtaining forest land from the A'si by
    goat payment, the practical process of clearing forest by fire and tools, the
    formation of homesteads and bounded estates, and the gradual withdrawal or disappearance
    of earlier inhabitants as the Akikuyu expanded and cleared forest, leaving only
    occasional sacred groves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The country is described as having labyrinthine hills and dense vegetation
    where men and flocks seeking concealment could disappear from sight.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Information reported in the passage says the A'si preceded the Agum'ba and
    later lived side by side with them in different villages.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The A'si are said to have wandered widely, while the Agum'ba took charge of
    herds, and the two peoples were said to intermarry.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When an M'kikuyu set out independently, he asked the A'si for leave to make
    a clearing in their forest and paid goats for the land taken.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The A'si are described as having no goats of their own but valuing goats for
    food and sacrifice; the stated payment was thirty goats.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A tree was felled by placing fire at its foot, scraping away charred wood,
    heaping brushwood along it, and reducing it to ash.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Undergrowth and tangled roots were cleared with a sword, crowbar, short stick,
    hand-beating of clods, and burning of roots.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the plot was cleared, a fence was made; future cultivation was assigned
    to the man's women, and the clearing process was repeated each year.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: As cultivated soil became exhausted, more forest was cleared; exhausted clearings
    became pasture, called the inheritance of the goats.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The completed estate is described as half cultivation and half fallow or pasturage,
    with a central homestead of beehive huts inside a strong stockade.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Estate boundaries were marked by planted trees in line, hedges, and buried
    boundary stones, and possession was maintained by the power of the sword.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Agum'ba, called harmless little neighbours and the children's eyes, gradually
    disappeared; one tradition says they went west to a big forest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A very old man reported knowing a now-vanished track attributed to the Agum'ba,
    though his father had never seen them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The A'si gradually fell back as their numbers were limited, the Akikuyu were
    numerous, and game was no longer found near inhabited districts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Akikuyu advance is compared to locusts, and the passage states that in central
    Kikuyu scarcely a tree remains except for occasional sacred groves.
  category: other
  evidence_refs:
  - ev:9
