canonical_text:
  quote: ''
  summary: 'The passage describes Akikuyu rules and items of raiment: a prohibition
    on being unclothed, elder enforcement, the mu-ni-or''-a as sufficient male dress,
    cape and robe variations, artificial scars and ornaments on arms, fingers, waist,
    calves, and ankles, sandals for travellers, and a plate description of the N''gi5-o
    or ii''gu-o garment for men and boys.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Being unclothed, even while working alone, is described as a transgression
    that may be reported and brought before village elders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is considered fully dressed if he wears the mu-ni-or'-a, a one-inch-wide
    strap with a three-inch-deep fringe of fine chain.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In colder and wetter areas, the short cape may be lengthened to the knee and
    widened, and made from grey monkey or hyrax pelts; these long robes are not worn
    by younger men.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shoulder curve and outer upper arm are often decorated with small lenticular
