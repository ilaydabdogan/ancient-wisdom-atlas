  summary: The passage describes a procedure in which blood is drawn from a living
    beast by piercing a vein with an arrow, collected in a half calabash, and drunk
    hot by warriors. Dust is rubbed on the wound and the animal is released. The narrator
    states that the arrow method is considered essential and that a knife is rejected,
    interpreting the practice as a surviving custom rather than practical utility.
