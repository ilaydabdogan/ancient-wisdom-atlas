canonical_text:
  quote: ''
  summary: 'The passage describes the narrator''s camp arrangements in Kikuyu: camp
    staff and servants, limited tent accommodation, fires at dusk, night anxieties
    about nearby wild animals, an incursion of processional ants that forces flight
    and relocation, and the arrival of Akikuyu porters who prepare loads.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The camp staff includes a headman, four askaris or camp policemen, a gunbearer,
    two stable boys, a cook, a cook's boy, an ayah for the narrator, and Dosa as groom.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The askaris keep watch by day and night, pitch the tent, and look after the
    porters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dosa is described as S.'s old servant, brought up in an Arab slave household,
    and expected to obey orders emphatically.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator identifies the Swahili as the best servants, describes them as
    Mohammedans from the coast, and notes that Swahili is the language one has to
    learn.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Tent accommodation is limited because transport is by porters, and the two
    small tents can be connected by an awning.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The camp grows to include stable tents and servants' tents, and the narrator
    counts twelve or thirteen fires at dusk.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: At night the camp is described as weird, with open tent doors, hyena cries
    around it, and lions and other beasts nearby.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: After a leopard is killed a quarter of a mile from camp, the narrator has
    a barricade erected outside the door, and S. jokes about its excessive strength.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the second night under canvas, S. wakes at 1 a.m. and warns that ants are
    present.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The narrator and S. are bitten by many processional ants because the tent
    lies in their line of march.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The narrator and S. flee to the boys' tent until morning and then move camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Seventy Akikuyu porters arrive from Fort Hall wearing skins over one shoulder
    and red mutton fat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Loads are made up to about fifty pounds and then placed in a row.
  category: action
  evidence_refs:
  - ev:5
