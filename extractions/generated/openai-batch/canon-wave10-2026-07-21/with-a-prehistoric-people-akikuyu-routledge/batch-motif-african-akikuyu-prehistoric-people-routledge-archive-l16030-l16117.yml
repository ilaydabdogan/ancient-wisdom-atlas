canonical_text:
  quote: ''
  summary: The passage describes the Kikuyu Medicine-Man as a local ritual and medical
    specialist with divinatory powers, dream warnings, and knowledge of rites and
    medicines. It explains his social position, use in public deliberation, relationship
    to spirits and misfortune, costs of treatment, transmission of medicinal knowledge,
    heirloom charms, and a specific protective medicine held by Ra-zi-mi's clan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Medicine-Man is described as combining the functions of magician, medical
    practitioner, prophet, and in some sense priest.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Medicine-Man is said to ascertain decrees of destiny, advise how they
    may be deflected, possess second sight, and receive dream warnings of coming events.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Medicine-Man explains causes of misfortune, especially matters connected
    with angered spirits, and prescribes rites to appease that anger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The M'kikuyu is said to seek the Medicine-Man's help voluntarily and not to
    regard him as an essential intermediary for happiness after death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Medicine-Man is not a public officer; at public ceremonies he appears as
    a qualified elder, and he may act prophetically when divine direction is sought.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says every valley or petty district has its Medicine-Man and estimates
    such doctors at about five per thousand of the population.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The calling is said not to be necessarily hereditary or necessarily associated
    with great wealth, though it can bring influence and competency.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Medical treatment is described as costly partly because goats must be slain;
    in one case three goats were ordered and no fee was taken because the patient
    would not recover.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Medicine-Man is described as a specialist in a medicine for a disease, and
    knowledge of rites and materials for a charm may be purchased from another practitioner.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some medicines are heirlooms; Ra-zi-mi stated that his clan possessed a medicine
    known only to himself and one old male relation.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ra-zi-mi's clan medicine is said to protect from lions and from harm in war.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note connects the term Mugu with a sacred tree called Muti Mugu, while also
    discussing translations such as clever, skilful, or wise man.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: The author reports the impression that the soothsayers act in good faith and
    believe in the efficacy of their rites and medicines.
  category: other
  evidence_refs:
  - ev:9
