canonical_text:
  quote: ''
  summary: The passage describes a Kikuyu rite called the ceremony of the second birth,
    or being born again / born of a goat. The rite is presented as old, widespread
    among Kikuyu clans, difficult for outsiders to witness, and socially necessary
    for later religious, inheritance, circumcision, and death-related duties. A reported
    account describes parents appointing a day, possible parental proxies, killing
    a goat or sheep, using the animal’s skin, stomach, and gut, a women-only hut scene
    in which the mother imitates labor and the candidate imitates a newborn cry, followed
    by washing, sleeping arrangements, a feast, and sweeping the hut.
  language: English
  quote_policy: summarized
