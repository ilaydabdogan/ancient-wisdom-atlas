canonical_text:
  quote: ''
  summary: 'The passage describes Akikuyu rules and customs concerning animal foods:
    avoidance of wild game, birds, reptiles, insects, grubs, fish, and eggs; the ceremonial
    uncleanness attributed to eating fish; the eating of domestic cattle, sheep, and
    goats; the fattening of a castrated ram for slaughter; restrictions on slaughtering
    immature or female animals; and a described method for slaughtering sheep or goats
    and collecting their blood.'
  language: English
  quote_policy: summarized
