canonical_text:
  quote: ''
  summary: The passage describes a formal public dance by Kikuyu warriors before a
    large audience. Women, children, girls, warriors, a trainer or master of ceremonies,
    a war-horn player, a chief, and an individual with a white wand are mentioned.
    The dancers are adorned with paint, iron-chain fringes, weapons, and rattles,
    and perform ordered martial movements, leaps, processions, and drill-like evolutions.
    The narrator states that the dance has no pantomimed story.
  language: English
