canonical_text:
  quote: ''
  summary: 'The passage introduces the author''s notes from Kikuyu trials and records
    several cases at Chief Wombugu''s: cattle stealing, goat stealing, a murder compensation
    case, and an accidental goat-killing case. The notes describe court participants,
    presiding elders or chiefs, private consultation, confession, debate, and compensation
    in livestock or blood-money.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author presents the passage as notes from trials attended in person, based
    on observed actions and information from participants or retainers, while acknowledging
    the notes are incomplete.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the cattle-stealing case, the court circle contained elders, witnesses,
    plaintiff, and defendant, while young men sat outside the circle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cattle-stealing court was first presided over by an N'jama described as
    skilled in speech and intelligent, and later by Wombugu himself.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the cattle-stealing case, the accused old man went aside with his party,
    confessed first to his friends and afterward to the court, and was sentenced to
    pay fifteen goats in six days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the goat-stealing case, an old man was accused of stealing a young man's
    goats; an elder presided, everyone talked together, and the matter was decided
    to have been an affair of the market.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the murder case, about thirty Kiama were present, roughly half from the
    deceased person's neighborhood, and the alleged murderer was not present at the
    trial.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the murder case, a son of the deceased said that if the guilty man did
    not pay blood-money, he would kill him; another son also spoke.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the murder case, elders retired for private consultation twice; discussion
    included the informer reward and the victim's symptoms before death, and the court
    was adjourned before the narrator later learned that compensation had been ordered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the accidental goat-killing case, Wombugu presided without elders; a boy
    goat-herd had struck his master's female goat with kid so that it died and had
    run away; the father offered compensation if Wombugu awarded it, and the master
    claimed three goats. The preserved passage ends before the full sentence is given.
  category: sequence
  evidence_refs:
  - ev:7
