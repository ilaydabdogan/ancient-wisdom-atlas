canonical_text:
  quote: ''
  summary: The passage describes Akikuyu ideas about the soul, the living ego called
    N'gor'o, and the post-death spirit called N'goma. It reports that N'gor'o is associated
    with individuality, breath, heart, and will, but ceases with bodily death and
    does not leave during sleep, trance, or illness. N'goma is described as coming
    into being at death, wandering near the place of death, sometimes making sounds,
    causing illness or possession, and requiring sacrifices or offerings. The passage
    also notes a lack of necessary moral reward or punishment after death.
  language: English
  quote_policy: summarized
