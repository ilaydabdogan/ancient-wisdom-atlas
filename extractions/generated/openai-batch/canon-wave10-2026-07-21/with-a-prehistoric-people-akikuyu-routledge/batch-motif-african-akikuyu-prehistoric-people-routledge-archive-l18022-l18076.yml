canonical_text:
  quote: ''
  summary: Four young warriors live together in a thingira hut. One reports a dangerous
    hyena on the road and wagers livestock that another warrior will not sleep there.
    The challenged warrior sharpens his sword and spear and sleeps on the road while
    two companions watch from a tree. Hyenas come; he kills two, the others flee.
    In the morning the witnesses report what happened, and the wagered ox and goats
    are paid.
