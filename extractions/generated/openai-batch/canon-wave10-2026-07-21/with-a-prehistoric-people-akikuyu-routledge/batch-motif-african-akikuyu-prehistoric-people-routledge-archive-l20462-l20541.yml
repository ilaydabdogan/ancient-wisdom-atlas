canonical_text:
  quote: ''
  summary: The passage discusses N'gai as a possibly anthropomorphic deity or a more
    generic term for sacred or mystical potency, compares Akikuyu evidence with reports
    about Masai usage, and then analyzes the relation of Kikuyu medicine-men, magic,
    sacrifice, charms, blessing, cursing, and witchcraft to N'gai.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: N'gai or N'qai is described as possibly having lost personal, anthropomorphic
    character and becoming a vague term for mystical potency, including the sacredness
    of a sacred tree.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Joseph Thomson is cited as reporting that Masai speakers could apply the name
    N'gai to Thomson himself and to his lamp because of their strangeness and incomprehensibility.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author notes that Mr. Hollis had not found the same Masai usage, but says
    the Akikuyu evidence makes a generic sense of N'gai seem possible.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mr. H. R. Tate is cited as reporting three Akikuyu gods named N'gai, two good
    and one bad, with specialized functions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The medicine-man is described as not cut off from dealings with N'gai and
    as essentially a 'Man of God'; the term mu-gu is glossed as supernatural power
    or virtue.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Magic, represented by the art of the Medicine-Man, is described as gaining
    ground at the expense of the state religion associated with sacrifice to N'gai.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The nominal Supreme Being is said to send the Medicine-Man his call, give
    him powers, and assist him in exercising them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Medicine-Man is reported as speaking in the first person when driving
    uncleanness from a homestead or purging sin, while N'gai remains theoretically
    behind the act.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Power derived from N'gai is said to enable the Medicine-Man to manufacture
    charms that protect from evil and also bring evil about.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Power to curse as well as to bless may be entrusted by N'gai to human vice-gerents
    for socially approved purposes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Genuine black magic, called o-ra-gi, is characterized as witchcraft outside
    the social pale; irregular practitioners are said to be poisoned.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the Medicine-Man uses power for social good, that power is said to be
    of N'gai and to have religious significance despite being autonomously exerted.
  category: relationship
  evidence_refs:
  - ev:9
