canonical_text:
  quote: ''
  summary: The passage lists actions, contacts, accidents, animals, foods, and social
    offenses that incur ceremonial uncleanness, then describes a purification rite
    in which a Medicine-Man invokes divine assistance toward Mt. Kenya and Mt. Kinangop,
    sacrifices a goat, prepares offal and medicines, paints the patient's tongue,
    commands him to vomit the sin, requires repeated spitting, rubs him with shrub
    bundles, declares the sin purged, and sweeps the patient's hut and family houses.
  language: English
