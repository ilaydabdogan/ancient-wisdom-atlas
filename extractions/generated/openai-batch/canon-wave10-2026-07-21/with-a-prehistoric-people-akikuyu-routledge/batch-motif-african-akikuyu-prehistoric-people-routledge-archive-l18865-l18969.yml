canonical_text:
  quote: ''
  summary: A girl breaks a water gourd while fetching river water, and her angry elder
    brother sends her to bring back the hair of a N'jenge. She meets the long-haired
    N'jenge Ilimu, is fed at his house from livestock that emerge from a ground-opening,
    and is marked for eating. Ilimu's son removes her ornaments, covers her with a
    strong-smelling substance, and tells her to flee. She passes Ilimu's N'jenge companions
    and Ilimu himself unrecognized, cuts Ilimu's beard and hair at his request, and
    returns home with the hair. Later she marries a young warrior and directs that
    her bridewealth goats not go to her cruel elder brother. When Ilimu and his companions
    find the girl gone, Ilimu hides, but the companions discover him, roast him, and
    eat him.
  language: English
  quote_policy: summarized
