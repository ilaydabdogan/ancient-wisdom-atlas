canonical_text:
  quote: ''
  summary: 'The passage describes Akikuyu herding practices: limited cattle holdings,
    use of dry-season fire to create and maintain pasture, guarded enclosures against
    lions and raiders, cattle marks sometimes treated as protective medicine, male
    responsibility for cattle care and cow-milk restrictions, milking practices involving
    calves and vessels, and sheep and goat pasturing, marking, and counting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Individual Akikuyu cattle herds are described as relatively small, ranging
    from about ten to one hundred animals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because grazing ground is scarce in central Kikuyu, herds are sent to the
    edges of cultivated land where forest growth has been denuded by fire.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the dry season the Akikuyu set fire to dense grassland so that the area
    is gradually made and kept suitable for cattle pasture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Herds are kept at night in strong enclosures and guarded both at pasture and
    in the stockade by an armed escort against lions and raiders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cattle marks are said to be chiefly for owner identification, though some
    particular marking may occasionally be considered medicine with protective power.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Custom assigns cattle care to men and boys, who are not supposed to drink
    milk other than cow's milk.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Calves are separated from their mothers at night, cows are milked in the morning
    before calves suck, and a dead calf may be skinned and stuffed with grass so the
    cow will permit milk to flow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Milk is taken into a half calabash and poured into a long narrow gourd that
    has been rinsed with cow urine and filled with smoke; the passage says this affects
    fermentation and souring, and that curds, whey, cream, butter, and cheese are
    not prepared.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sheep and goats are pastured together on fallow land, are marked by ear mutilation
    rather than branding, and are counted every morning and evening.
  category: action
  evidence_refs:
  - ev:8
