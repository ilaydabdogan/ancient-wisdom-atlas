canonical_text:
  quote: ''
  summary: The passage describes Kikuyu girls’ maidenhood/adornment markers and social
    rules around betrothal, bridewealth in goats and sheep, breach-of-promise cases,
    restitution, betrothal gifts, dancing restrictions, clandestine appointment marks,
    and responses to pregnancy before marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate caption identifies three Kikuyu girls and lists a brow-band indicating
    maidenhood, an upper garment style, bead necklaces, an ear-lobe ring, cowrie-shell
    chest straps, copper-wire bracelets, and anklets.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a girl promised to an older and wealthy man would
    not be obliged to marry him on reaching discretion unless she desired it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A girl is described as free to break off an engagement after goats have been
    paid to her father, provided restitution is made.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One breach-of-promise case was heard outside Munge’s homestead by an elder,
    young men who knew the case, and an official, to arrange the return of goats by
    the girl’s father.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another case brought to Karuri, goats paid for the engagement had been
    eaten and could not be replaced; the suitor sought enforcement, and judgment was
    given in his favor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The customary value of a girl is described as thirty goats and five or six
    sheep, with possible payment in installments and marriage sometimes occurring
    after twenty goats have been received.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A South African example is reported in which, after livestock destruction,
    girls were given in marriage without immediate payment on the understanding that
    the first-born daughter would belong to the wife’s parents.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The first betrothal present is described as a copper-wire collarette with
    a long pendant iron chain, called mu-hu-ni-o, and compared by the author to an
    engagement ring.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: After marriage has been arranged, both fiancés may attend dances, but it is
    no longer considered correct for them to dance with each other; visiting and talking
    are permitted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Three patches made of honey or adhesive matter and aromatic seed, placed on
    both cheeks and the forehead of an unmarried girl, indicate a clandestine appointment
    and safeguard her from interference.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: An unmarried girl about to become a mother is said to meet grave parental
    disapproval; the man may buy the girl and take the child, or pay compensation
    while the girl and child remain at home.
  category: relationship
  evidence_refs:
  - ev:9
