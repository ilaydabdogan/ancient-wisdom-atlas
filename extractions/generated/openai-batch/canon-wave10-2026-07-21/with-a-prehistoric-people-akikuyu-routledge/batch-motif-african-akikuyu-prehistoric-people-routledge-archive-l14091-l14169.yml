canonical_text:
  quote: ''
  summary: The passage describes Akikuyu judicial cases, dispute settlement by Kiama
    or N'jama, procedures for public discussion in a shauri, the use of a speaker's
    club to regulate speaking turns, a secret beetle-and-banana practice said to give
    persuasive speech, and the social bases of local judicial leadership.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man said he wished to marry a girl; his father paid a marriage portion
    of thirty goats, while refusal would have resulted in a fine of ten goats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two girls quarrelled while cutting wood; one cut the other with a knife, and
    two Kiamas, identified as the respective fathers, judged the matter with a fine
    paid in sheep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two young men disputed the boundaries of their shambas, and two Kiama settled
    the dispute.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: N'jarge entrusted eighteen rupees to a friend who later died; N'jarge went
    with two N'jama to claim the money, while a neighbouring chief and the N'jama
    demanded collection costs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: More complicated or denied cases are described as occasions for lengthy debate,
    with a shauri held in an open space where entitled speakers take part and others
    watch.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the shauri, the first speaker's club is passed among those wishing to speak,
    and no man may address the assembly until he holds it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that all old men are theoretically eligible for judicial
    function, but in practice the function falls to those considered qualified; intelligence
    and eloquence are valued.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A particular beetle is said to carry the power of conviction; an old man puts
    it in a banana, dries it in the sun, and secretly eats it before a shauri to gain
    effective speech.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that a man of forceful character may gain eminence in an
    assembly, and that intelligence, military talent, wealth, wives, sons-in-law,
    and dependents may contribute to power.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Munge claimed four generations of leading ancestors, but the passage states
    that this did not imply primogeniture and notes an elder brother living privately
    because of lack of mental acumen.
  category: relationship
  evidence_refs:
  - ev:9
