canonical_text:
  quote: ''
  summary: 'The passage describes formal drinking parties summoned by a chief for
    important public announcements, then gives a procedural account of making n''j6-hi
    from sugar-cane: women strip, carry, pound, and sing while crushing the cane;
    men bind and wring the pulp over calabashes; the juice is stored in gourds and
    fermented with dried alofa pods. A second alcoholic drink is described as honey
    mixed with water.'
  language: English
  quote_policy: summarized
