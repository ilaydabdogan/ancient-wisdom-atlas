canonical_text:
  quote: God lives on Kenya.
  summary: The passage reports Kikuyu statements about moral prohibitions attributed
    variously to God, fathers, and old men, and then describes social standards concerning
    stealing, respect for seniors, truth-telling, hospitality, guest protection, and
    reciprocal etiquette involving food, sheep, meat, and skins.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The narrator states that, although post-mortem existence is not always described
    as affected by conduct in this life, the Akikuyu are said to have a definite traditional
    moral code inculcated by authority.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One testimony says God lives on Kenya and gave prohibitions against striking
    one's father or mother; the same testimony says teaching against stealing was
    transmitted by fathers across generations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A second testimony attributes prohibitions against killing with a spear, disobeying
    one's mother, stealing, and desiring another person's goods or wife to God, while
    also saying the speaker learned these words from his father.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A third code prohibits killing, stealing, and taking food from other people's
    fields, and attributes these words to old men rather than to God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The prohibition on killing is described as qualified: murdering a guest of
    one''s own tribe is judged wrong by the quoted M''kikuyu, while murdering a stranger
    is not judged the same way; however, a stranger attacked in one''s house brings
    the quarrel upon the host.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the injunction not to steal is obeyed, the Akikuyu are particularly
    honest, and respect for seniors is fully regarded; it also says truth-telling
    is not necessarily treated as an obligation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Hospitality is described as a duty or custom for immediate relatives and clansmen,
    while hospitality beyond that is described as expedient.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Food brought to travellers' camps is described as creating an expected reciprocal
    obligation when the giver later visits the recipient's country.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the described hospitality etiquette, a wealthy host gives lodging, sheep,
    gruel, and vegetable foods; failure to send a sheep to an important passing stranger
    signals hostility; the visitor returns meat to the donor, sends the sheep skin
    to the host's mother, and gives meat to the messenger.
  category: sequence
  evidence_refs:
  - ev:8
