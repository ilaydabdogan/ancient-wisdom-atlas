canonical_text:
  quote: ''
  summary: 'The passage describes the standardized manufacture of fine iron-wire chain
    used by the Akikuyu as ornament: wire is wound into a spiral on a rod, cut into
    circlets, flattened into links, hooked together, wound on a roller, and prepared
    for further closing on a stone anvil.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fine iron-wire chain is described as widely used in Kikuyu and employed solely
    as ornament.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the chain has no variation in pattern or method of
    manufacture, and that no other form of chain is made or employed by the Akikuyu.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A sized hank of wire is placed over a jaw of a forked stick set upright in
    the ground while the maker sits close to it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maker uses a metal rod set into a wooden handle, lapping wire around the
    rod and rotating it with the hand and thigh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The rotating rod becomes covered with an even spiral winding of wire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The rod with its wire spiral is placed on a flat-topped stone and cut lengthwise
    with a short chisel or punch struck by a wooden mallet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After cutting, the wire spiral slips from the central rod and separates into
    a series of fine wire links or circlets called ga-zi-ka.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Loose links are placed on a stone and flattened one by one by blows from the
    butt of a vertically held chisel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The gap left between the ends of each flattened link allows it to be hooked
    onto the preceding link to form a chain.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: As the chain is formed, it is wound under slight strain around the middle
    of a stick to keep it from falling apart, and its end is temporarily secured.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The roller carrying the unriveted chain is placed near a rounded stone and
    held by pegs; a short length of unclosed chain is drawn off and stretched across
    the anvil.
  category: action
  evidence_refs:
  - ev:6
