canonical_text:
  quote: ''
  summary: The passage first concludes a lost-sister tale in which a sister equips
    Wagacharaibu with a cape, spear, and ornaments, recognizes him as her brother,
    and her husband incorporates him into the homestead through livestock gifts, a
    hut, and support for marriage. A second version begins with Wachera and her brother
    Wam'wea living together after their mother dies. Wachera warns that two men may
    carry her off and says she will leave a trail of gourd sap. After she is abducted,
    Wam'wea follows the drops, hears her voice, but returns home; the sap grows into
    plants and later trees. After consuming the inherited livestock over time, he
    resumes the journey along the tree-marked route, reaches a stream, meets two children
    drawing water, and is led toward Wachera, who does not recognize him though he
    recognizes her.
  language: English
  quote_policy: summarized
