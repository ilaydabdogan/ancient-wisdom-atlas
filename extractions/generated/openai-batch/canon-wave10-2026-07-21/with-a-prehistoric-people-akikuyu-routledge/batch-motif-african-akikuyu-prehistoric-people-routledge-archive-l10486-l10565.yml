  quote: ''
  summary: The passage describes post-marriage visits and hospitality, a childbirth-linked
    feast, and an ethnographic discussion of Kikuyu polygamy as social organization,
    including first-wife precedence, separate households for wives, wealth associations,
    and conflict with missionary monogamy teaching.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bride returns for a few hours to her mother, attended by girl friends, after
    having cried on the bed in the proper manner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband's mother gives the bride fat for adornment on the third day and
    is expected to continue similar gifts for about two months.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bride is described as pleased because she is first wife, has a new house,
    there are many goats, and the bridegroom is charming.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Conventional howling continues inside the hut despite the bride's favorable
    prospects.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: After marriage, the two families continue social intercourse; in one instance
    a son-in-law brings native beer to the house of his mother-in-law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A party at the new home of a woman married to another district is connected
    with the birth of her child, and younger men go to eat sheep there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Polygamy is described as an integral part of the tribal system and as social
    organization rather than merely domestic arrangement.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Munge reports that a first wife may ask why she must do all the work and why
    another wife is not bought; another woman says preparing much food or drink is
    hard for one and easy for many.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The first wife retains pre-eminence, and her child is regarded as eldest even
    if born after the child of a later wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Having only one wife is described as a sign of poverty, two or three wives
    as ordinary, and six or seven as characteristic of a rich man; chief Karuri is
    reported to have as many as sixty wives.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Each wife has her own hut, shamba, and independent establishment, making the
    household resemble a village under one head man.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Kikuyu informant says missionary teaching that a man should have only one
    wife is nonsense and a reason for missionaries to go away.
  category: speech
  evidence_refs:
  - ev:9
