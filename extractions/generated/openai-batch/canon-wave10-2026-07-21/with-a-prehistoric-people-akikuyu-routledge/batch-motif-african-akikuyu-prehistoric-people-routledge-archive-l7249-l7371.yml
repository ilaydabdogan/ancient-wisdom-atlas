canonical_text:
  quote: ''
  summary: 'The passage describes Kikuyu blacksmith equipment: granite anvils made
    by specialists near the Sagana River, their shape, value, use, durability, and
    inheritance; a distinctive hammer called ke-li''-ha, including its form and method
    of use; and plate-caption material showing a hammer made by a Kikuyu smith and
    bellows nozzles with a knocked-out cooking pot labeled a blacksmith''s "medicine."'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Granite anvil blocks are said to be made by people near the Sagana River who
    specialize in making them; the anvils are oblong, partly set into the ground,
    smooth and convex on top, and valued at one big goat for a pair.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A single V-shaped groove is incised across the top of the anvil and is used
    to raise the two lateral stiffening combs of weapons.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Different anvil curvatures and groove depths are required for different work;
    a spear is not made on the same anvil as a sword.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that only a skilled spearsman can appreciate the special
    quality or balance that makes one finished spear preferable to another apparently
    identical one.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The anvil stones do not appear to break under use; the writer had not seen
    broken stones in a smithy, and the stones pass from father to son.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A smith known to the writer said that, of his four anvils, he had inherited
    one pair and bought the other; one of the four anvils had no groove.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hammer, called ke-li'-ha, is described as a long heavy iron bar with a
    wooden peg fixed into its side as a handle; the blow is produced when the bar
    falls from vertical to horizontal after the hand grip is released.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hammer-head is a round soft-steel bar with a pierced handle hole, a short
    arm tapering to a sharp point, and a longer arm ending in a slightly convex striking
    face.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In use, the smith rests the convex face on the work, raises and rotates his
    hand and wrist, then relaxes his grip so that the hammer-head falls and strikes
    the appointed spot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A plate caption states that the hammer shown was made from native iron by
    a Kikuyu smith in the author's presence at the Gura River in 1908.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A plate caption titled a blacksmith's "medicine" shows five earthenware bellows
    nozzles and one cooking pot with its bottom knocked out.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The blacksmith's nozzles are described as short, while iron-smelter nozzles
    are said to be four times as long though identical in pattern.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Wooden nozzles attached permanently to leather bellows are laid into the bulbous
    ends of the pottery nozzles when in use.
  category: action
  evidence_refs:
  - ev:8
