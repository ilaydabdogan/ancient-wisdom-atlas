canonical_text:
  quote: ''
  summary: The passage discusses dual moieties in the Banks Islands and the Bismarck
    Archipelago. It reports contrasting characterizations of moieties, linguistic
    and social differences, and myths centered on paired figures such as To Kambinana
    and To Karvuvu, or Soi and Tamono. The author interprets these contrasts as possible
    traditions of two peoples, one aboriginal or bush-associated and one immigrant
    or sea-associated, whose fusion may underlie dual organization.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Takwong, described as people of the night, are reported as ignorant, unimportant,
    quarrelsome, and unable to manage their affairs properly.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tatalai, described as people of the giant clam, are reported as capable
    of governing themselves and others, versed in social lore, and peaceful with one
    another.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that the Banks Islands evidence suggests the dual system
    arose by fusion rather than fission, with moieties descended from two peoples,
    one aboriginal and one immigrant.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: For New Ireland, the passage reports hostility between moieties and believed
    physical and mental differences among their members.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The passage notes one known Namatanai moiety vocabulary difference: the father''s
    sister is called rahat by one moiety and tent by the other.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mythology of the dual region includes tales centered on two personages
    called To Kambinana and To Kovuvuru or To Karvuvu in the Gazelle Peninsula.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: To Kambinana is characterized as wise, clever, and somewhat unscrupulous,
    while To Karvuvu is characterized as ignorant and foolish and as undertaking ridiculous
    or dangerous tasks suggested by the other.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The two Gazelle Peninsula personages give their names to the two moieties
    in one part of the district, and their association with the moieties is said probably
    to exist elsewhere in the district.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In New Ireland, the Maramara moiety has the taragau bird as its totem and
    Soi as its head; the Pikalaba moiety has the Malabo or minigulai as its totem
    and Tamono as its head.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Soi is said to act wisely though unscrupulously, while Tamono is described
    as a fool who is easily victimized by Soi's deceptions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The taragau is described as a clever and capable fisher; the minigulai is
    said to obtain food by stealing from the taragau and is classed as one who does
    not go to sea.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author suggests that the narratives reveal a tradition of physical and
    mental differences between two peoples, with one bird representing sea-arriving
    immigrants and the other representing bush-people.
  category: other
  evidence_refs:
  - ev:7
