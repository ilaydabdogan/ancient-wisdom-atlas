canonical_text:
  quote: ''
  summary: The passage presents an ethnographic hypothesis that settlement of immigrant
    kava-people among communistic indigenous or dual people created needs for exchange,
    including compensation for women as wives, and helped produce the use of money
    in Melanesia. It lists useful, aesthetic, ornamental, and possibly religious objects
    used as money, especially shell-money called rongo and associated with sacredness,
    secret societies, and the kava cult.
  language: English
