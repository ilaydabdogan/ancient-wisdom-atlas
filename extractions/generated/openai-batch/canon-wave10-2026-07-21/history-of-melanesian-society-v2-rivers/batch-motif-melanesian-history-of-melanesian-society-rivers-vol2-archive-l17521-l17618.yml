canonical_text:
  quote: ''
  summary: The passage contrasts Tamate society rules about eating society-associated
    animals or plants with totemic clan practice, proposes that a secret ceremonial
    eating rite may have become ordinary, reinterprets several mortuary practices
    as different expressions of sending the dead away for incarnation, and compares
    Banks Islands prenatal animal/plant influence beliefs with a Fijian totem-animal
    visitation belief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of a Tamate society are allowed to eat the animal or plant connected
    with their society, while non-members are forbidden to do so.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Tamate society attitude toward eponymous animals or plants
    is directly opposed to that of totemic clans, and notes that the non-member prohibition
    does not apply to adult women.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author suggests that founders of a Tamate society may have secretly performed
    ceremonial eating of a revered animal or plant, and that the rite later lost its
    sacred character and became ordinary practice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage discusses throwing the dead into the sea alongside the use of
    a canoe to convey the dead to their future home.
  category: action
  evidence_refs:
