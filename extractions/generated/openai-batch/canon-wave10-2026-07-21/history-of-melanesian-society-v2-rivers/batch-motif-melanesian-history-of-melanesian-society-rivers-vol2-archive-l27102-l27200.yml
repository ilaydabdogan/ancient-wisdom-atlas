canonical_text:
  quote: ''
  summary: The passage presents Rivers' hypothesis that travel and migration could
    weaken adherence to home conventions among immigrants; that fusion with an aboriginal
    population could produce a dual organisation with communistic sexual relations
    limited by kinship; that gerontocratic monopoly of young women and youth practices
    would reinforce this system; that clan or family organisation among the aborigines
    would shape the resulting kinship restrictions; that the Baining may represent
    an earlier Melanesian stage; and that common property may have followed from organized
    sexual communism.
  language: English
  quote_policy: summarized
