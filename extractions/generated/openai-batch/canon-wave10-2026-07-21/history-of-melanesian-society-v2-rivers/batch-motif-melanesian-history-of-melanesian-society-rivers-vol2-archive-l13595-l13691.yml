canonical_text:
  quote: ''
  summary: The passage presents Rivers's cultural-historical argument that Polynesian
    culture has a double composition and that some elements common to Melanesia and
    Polynesia may derive from immigrant groups associated with kava, betel, sitting-position
    burial, preservation of the dead, chiefly rank, Areois, and secret societies.
    It closes by introducing extended interment in Tikopia, Tonga, and Samoa as a
    further topic connected with death.
  language: English
  quote_policy: summarized
