literal_observations:
- id: obs:1
  text: The author says communism of goods in Melanesia may have been assisted by
    communistic practices among aboriginal populations, while noting that property
    institutions among the Baining and similar peoples are not yet known.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author argues that matrilineal descent among the dual people would follow
    from sexual communism when the individual family is absent and group membership
    is based on known motherhood rather than unknown fatherhood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that patrilineal descent would require recognition of fatherhood,
    and suggests that such recognition may have been gradually lost after two peoples
    fused into a dual system.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author connects fear of the dead among the dual people with influence
    from the people who interred their dead in a sitting position, while stating that
    the Baining are said to lack such fear.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage proposes that fusion between two peoples could produce linguistic
    diversity through modification of Austronesian speech and persistence of aboriginal
    forms of speech.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author states that the non-Melanesian character of the Sulka language
    suggests that failure to introduce the sitting-interment people's speech may have
    been frequent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that, if the sitting-position burial people were the first
    settlers in Polynesia and found no earlier inhabitants to fuse with, the absence
    of dual organisation in Polynesia becomes understandable.
  category: relationship
  evidence_refs:
  - ev:5
