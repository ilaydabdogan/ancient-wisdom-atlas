canonical_text:
  quote: ''
  summary: The passage discusses the functions of the mother’s brother and sister’s
    son in Melanesian kinship. It describes compensation owed to a mother’s brother
    when a child is injured, the increasing definiteness of such rules as an example
    of the growth of law, the intensified privileges of the Fijian vasu in chiefly
    contexts, possible wife-giving and wife-sharing between a man and his sister’s
    son, and reciprocal kin terms in several island groups.
