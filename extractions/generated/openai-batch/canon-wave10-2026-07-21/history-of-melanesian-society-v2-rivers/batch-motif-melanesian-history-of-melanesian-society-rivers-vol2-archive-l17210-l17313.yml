canonical_text:
  quote: ''
  summary: The passage argues that Melanesian totemism may have arisen not from an
    original belief by the kava-people in identity with animals or plants, but from
    beliefs and rites concerning the incarnation or embodiment of the dead in animals
    or plants. It surveys examples from Melanesia, the Solomon Islands, the Shortland
    Islands, Fiji, Tikopia, and the Society Islands, including sacred animal or plant
    embodiments of ghosts, clan mortuary rites involving bones and water, ancestral
    ghosts embodied in animals or plants, and relatives caring for animals believed
    to embody dead persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that if the kava-people did not hold a belief in human-animal
    identity, the inquiry must seek beliefs and practices that could have given rise
    to such an idea through interaction with indigenous inhabitants.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In several parts of Melanesia, the passage reports a belief that after death
    a man becomes an animal, becomes part of one, or is embodied in one.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Solomon Islands examples, ghosts are said to abide in sharks, eels, crocodiles,
    lizards, and the frigate bird; in Ulawa, a man is reported to have announced before
    death that he would be in the banana.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Animals or plants into which the dead are believed to have entered are described
    as sacred and are not killed or eaten, while the exact connection with social
    groups is said to be unknown.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Shortland Islands, bones of the dead obtained after cremation are thrown
    into rivers or the sea at clan-appointed places.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Shortland Islands rite is described as involving fish, lizard, shark,
    or another animal that is the clan totem, with the practice interpreted in the
    passage as incorporation of the dead into totem-animals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Fiji, a village or district ancestral ghost is often believed to have been
    embodied or envesselled in an animal or plant.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Tikopia, members of a social group believe they descend from ancestors
    who after death turned into animals still associated with those groups.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Society Islands, the soul of a dead man is believed to return to earth
    as an animal he revered during life; relatives treat such an animal tenderly,
    feed it, invite it to return, and part from it with tears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage also says gods are believed to appear in animal form in the Society
    Islands.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author concludes that the collected facts suggest a belief in ancestor
    incarnation in animal or plant form as a possible starting-point for Melanesian
    totemism.
  category: other
  evidence_refs:
  - ev:8
