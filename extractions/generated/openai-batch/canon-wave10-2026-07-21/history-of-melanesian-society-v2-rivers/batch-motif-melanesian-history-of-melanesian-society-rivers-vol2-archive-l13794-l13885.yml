canonical_text:
  quote: ''
  summary: The passage discusses Melanesian mortuary practices, especially cremation,
    interment, and throwing bodies, bones, or ashes into water. It argues that in
    the Bougainville Straits and Shortland Islands, cremation may be a relatively
    late introduced rite, especially associated with chiefs, while older practices
    of burial or water disposal persisted for remaining bones or ashes. It also notes
    possible links between water disposal and canoe sea-burial, totemism, and wider
    Oceanic or Polynesian cremation practices, while treating these broader explanations
    as tentative.
  language: English
  quote_policy: summarized
