canonical_text:
  quote: ''
  summary: The passage surveys inheritance and succession in parts of Melanesia. It
    describes payments connected with succession to paternal land, special inheritance
    of trees located on another person's land, regional variations between matrilineal
    and patrilineal inheritance, and Pentecost and Lepers' Island succession associated
    with mana and magical knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who succeeded to their father's land had to make payments to their father's
    brothers; if those brothers were dead, payment still had to be made to the father's
    sister's son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, by the second generation after a plot of land has
    been cleared, the rights of the sister's son begin to reassert themselves.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Banks Islands, ownership of trees on another person's land is described
    as frequent; the son of the tree owner inherits the tree and pays money to the
    land owner.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that inheritance of such trees by the son does not appear
    to be a recent modification and may have been an exception even when inheritance
    was generally matrilineal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: For Santa Cruz, the author reports Codrington's statement that sisters' children
    usually inherit, with occasional exceptions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Florida, garden-ground called matanga that is reclaimed from bush by a
    man is transmitted to his children, but if the history of the plot is forgotten,
    the sisters' children of his sons will claim it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Florida, trees planted on land pass to the children even when the land
    itself goes to the sister's children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Saa in Malaita is presented as an exception where property passes exclusively
    in the male line; in the Western Solomons, land inheritance is complicated by
    communal ownership, while personal possessions pass to the children.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author summarizes that descent is almost always matrilineal where descent
    is applicable, while inheritance is largely patrilineal at the present time; Pentecost
    is identified as the island with the strictest matrilineal inheritance.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author interprets the evidence as pointing to a gradual process by which
    matrilineal inheritance is passing into patrilineal inheritance, a process said
    to predate European influence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Pentecost, men regarded by Europeans as chiefs are said to have power depending
    largely on reputation for mana, especially mana connected with magic.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Succession to a Pentecost chief is described as depending largely on transmission
    of the knowledge on which the chief's reputation rests, and the chosen successor
    is usually the chief's own child rather than his sister's child.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The author states that the transference of rank in Pentecost is probably not
    definite social regulation but an undeveloped stage of succession; insofar as
    succession can be spoken of there, it is patrilineal.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Lepers' Island is said to have the same condition of succession as Pentecost,
    although the two islands differ in inheritance.
  category: relationship
  evidence_refs:
  - ev:9
