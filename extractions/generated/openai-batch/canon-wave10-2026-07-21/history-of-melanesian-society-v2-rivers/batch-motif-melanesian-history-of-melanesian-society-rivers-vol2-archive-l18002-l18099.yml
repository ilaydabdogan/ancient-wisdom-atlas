canonical_text:
  quote: ''
  summary: The passage analyzes Banks Islands decorative art, proposing that anthropomorphic
    representations may have been introduced by the kava-people and later transformed
    into geometric designs. It discusses the geometrically patterned malo-saru mantle,
    its use by high-ranking Sukwe members, evidence for loom weaving, possible links
    with Santa Cruz art and migration, and upright burial in Ureparapara as possible
    evidence of settlement by introducers of the loom and malo-saru.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Human figures are discussed on Banks Islands knives and on stone figures adorning
    the gamal of Santa Maria.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The represented faces are described as elongated, with a pointed chin and
    a long narrow nose, unlike the face of the modern Banks Islands inhabitant or
    modern Melanesian.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the tapered chin may partly result from conventionalisation
    into a lozenge, but does not treat this as sufficient to explain the overall face
    form, especially the narrow elongated nose.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author proposes that the kava-people introduced human-figure representation
    with features resembling their own.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The proposed human-figure representation is said to have become transformed
    into rectilinear geometrical forms.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The transformation is attributed partly to earlier artistic forms reappearing
    as immigrants died out and partly to prohibition of pure immigrant art by uninitiated
    persons or low-degree members of secret organisations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A note compares the Banks Islands carved face with a human face carved on
    Ambrym drums, describing both as elongated/angular with a narrow nose.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The malo-saru mantle is described as a pure example of geometrical art, no
    longer made, and worn only by high-ranking people in the Sukwe.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The malo-saru is said to have been made with some kind of loom and to show
    the former existence of true weaving in the Banks Islands.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage treats attribution of the malo-saru and loom to the kava-people
    as possible, but says other facts suggest a later influence and make the malo-saru
    an exception to the general rule about Sukwe objects.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Santa Cruz is identified as the only place in Melanesia where the loom was
    then known to exist, and the passage raises the possibility of a movement of people
    from Santa Cruz to the Banks Islands.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The malo-saru pattern is described as closely resembling characteristic Santa
    Cruz art patterns, and the garment is said to have been made only in Ureparapara
    and Rowa, the Banks Islands nearest Santa Cruz.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The introduced art is said to have been taken up by members of the more important
    Sukwe ranks and kept for their special decoration.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that such an introduction need not have involved permanent
    settlement from Santa Cruz, but notes that upright interment of the dead in Ureparapara
    may suggest such settlement.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: A note leaves open whether the migration involved natives of Santa Cruz or
    Micronesians who probably introduced the loom into Santa Cruz.
  category: other
  evidence_refs:
  - ev:8
