canonical_text:
  quote: ''
  summary: The passage analyzes descriptive kinship terms in Fijian, Santa Cruz, Solomon
    Islands, Tongan, and Tikopian systems. It discusses terms for the father's sister,
    mother's brother, grandparents, grandchildren, and grandson, and introduces generalisation
    as the extension of a classificatory kinship term to additional relatives, especially
    in connection with cross-cousin marriage.
  language: English
  quote_policy: summarized
