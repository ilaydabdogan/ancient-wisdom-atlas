canonical_text:
  quote: ''
  summary: The passage presents an ethnographic reconstruction of how two peoples
    might have fused into a dual social organisation. It contrasts a prior model involving
    kava-people with few or no women, wife purchase, and property development, with
    a model in which immigrants arrived with women, avoided near-relative marriage,
    exchanged women with aboriginal people, and eventually formed one people divided
    into two exogamous moieties. It also describes the dual organisation as a regional
    mechanism regulating marriage and sexual conduct across several Melanesian island
    groups.
  language: English
  quote_policy: summarized
