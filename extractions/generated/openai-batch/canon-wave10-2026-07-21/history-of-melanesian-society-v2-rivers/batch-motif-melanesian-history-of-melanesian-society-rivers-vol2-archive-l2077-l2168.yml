canonical_text:
  quote: ''
  summary: The passage argues that Oceanic systems of relationship are shaped by social
    organization, especially marriage rules. It discusses Merlav kinship-term generalization,
    cross-cousin marriage, the classification of the wife of the mother's brother,
    regional comparisons among Banks Islands, Guadalcanar, Florida, San Cristoval/Rafurafu,
    and the relation of dual social organization to kinship classification.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A process of generalization is said to have produced an anomalous condition
    in which a term properly denoting men is applied to women.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Merlav, cross-cousins call one another natui, glossed as child; the term
    is usual in the Banks Islands for the child of the mother's brother and is said
    to have been extended to the child of the father's sister.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author suggests that use of one term between two cross-cousins may have
    been motivated by both being children of one called moruk.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Merlav practice is described as a modification of a nomenclature with
    definite social meaning, but generalization has obscured that meaning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that other Banks Islands systems provide the clue for connecting
    Merlav cross-cousin nomenclature with marriage to the wife of the mother's brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chapter's general conclusion is that Oceanic systems of relationship depend
    directly on social organization, especially forms of marriage.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The evidence is described as abundant for cross-cousin marriage, with relationship-system
    correspondences presented as natural consequences of that marriage where it is
    practiced.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'In the Florida, Ysabel, Guadalcanar, and Savo region, the passage presents
    a transition: Guadalcanar retains cross-cousin marriage with related kinship features,
    while Florida has a classificatory correspondence without direct evidence of the
    marriage.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Florida classification of the wife of the mother's brother with the mother-in-law
    is interpreted in the passage as a likely survival of cross-cousin marriage because
    Florida and Guadalcanar cultures are closely allied.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Similar correspondences in the Rafurafu system are said to be connected with
    cross-cousin marriage because San Cristoval culture is close to that of Florida
    or Guadalcanar.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Banks Islands and New Hebrides, certain correspondences are said to
    follow naturally from marriage between a man and the wife of his mother's brother,
    a practice certainly found in one and possibly both groups.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The author considers but limits an alternative explanation involving levirate
