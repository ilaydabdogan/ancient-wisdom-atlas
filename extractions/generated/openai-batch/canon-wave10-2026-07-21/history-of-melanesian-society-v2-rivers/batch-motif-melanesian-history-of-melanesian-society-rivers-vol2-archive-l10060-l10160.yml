  summary: The passage offers a reconstruction of how immigrant and aboriginal populations
    in the Banks Islands may have become connected through the gamal, Sukwe ranks,
    and Tamate secret societies. It describes staged admission, rank divisions, restrictions
    around Tavatsukwe and Tamate liwoa, kava privileges, ritual beating before initiation
    for lower ranks, and the role of an introducer who vouches for a candidate.
