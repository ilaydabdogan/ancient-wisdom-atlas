canonical_text:
  quote: ''
  summary: The passage discusses Melanesian mortuary beliefs and practices, especially
    belief in an underworld of the dead, burial posture, preservation of bodies and
    skulls, and differences between chiefs and commoners. It compares practices in
    Espiritu Santo, Malikolo, the Solomons, Ysabel, Savo, and the Banks and Torres
    Islands, and advances the author's historical scheme connecting chiefly preservation
    rites with immigrant groups and sitting interment with earlier inhabitants.
  language: English
  quote_policy: summarized
