canonical_text:
  quote: ''
  summary: The passage opens a chapter on totemism by restating the author's argument
    that Melanesian totemism is later than dual organisation, that some Tamate ritual
    features are survivals of totemism, and that the kava-people are hypothesized
    as introducers of totemism into Melanesia. It then discusses a difficulty in transferring
    totems through migration, because totems bind clans and Melanesian totem-animals
    appear indigenous. The passage concludes by distinguishing Oceanic cases with
    multiple totems, including linked totemism with classes and associated totems
    without classes.
  language: English
  quote_policy: summarized
