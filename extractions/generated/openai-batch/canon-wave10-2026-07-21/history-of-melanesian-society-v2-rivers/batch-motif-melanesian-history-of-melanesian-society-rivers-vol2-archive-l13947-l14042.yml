  summary: The passage opens a chapter on migrations. The author argues that Melanesian
    society resulted from the fusion of successive migrant peoples with an indigenous
    population, then outlines an inquiry into how customs and institutions may derive
    from component peoples or their interactions. The chapter focuses on consequences
    of migration and classifies conditions of interaction by the nature of peoples,
    the route taken, and the environment, with special attention to disposition, numbers,
    endowment, sex ratio, adaptability, and conservatism.
