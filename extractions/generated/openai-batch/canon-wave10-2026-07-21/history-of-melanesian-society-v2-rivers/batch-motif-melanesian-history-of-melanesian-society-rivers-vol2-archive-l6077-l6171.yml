canonical_text:
  quote: ''
  summary: The passage opens a chapter on communism by defining sexual communism and
    property communism, distinguishing tribe-wide forms from forms limited by social
    groupings. It evaluates whether classificatory relationship terms, especially
    terms that class a wife’s sisters or a brother’s wife with the wife and reciprocal
    male relatives with the husband, support a hypothesis of former sexual communism.
    The author concludes that the regional distribution of these terms in Melanesia
    gives no support to that hypothesis and is better explained by the status of certain
    relatives as potential spouses.
  language: English
  quote_policy: summarized
