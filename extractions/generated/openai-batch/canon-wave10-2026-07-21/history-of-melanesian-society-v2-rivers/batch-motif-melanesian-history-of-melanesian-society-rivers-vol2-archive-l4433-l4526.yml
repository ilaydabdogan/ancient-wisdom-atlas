- id: obs:3
  text: 'The passage lists three indications for a possible earlier condition in which
    the father was treated as a stranger to his offspring: father and child may not
    eat together, father and son are believed to have different mental dispositions,
    and a father who injures his child is responsible to the child’s maternal uncle.'
  category: relationship
