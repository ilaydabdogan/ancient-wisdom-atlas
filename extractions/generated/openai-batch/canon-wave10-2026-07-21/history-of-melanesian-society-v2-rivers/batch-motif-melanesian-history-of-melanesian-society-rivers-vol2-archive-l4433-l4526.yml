canonical_text:
  quote: ''
  summary: The passage argues that translating Banks Islands sogoi as English “related”
    or “kin” is misleading because sogoi refers to people of one’s own veve or moiety.
    It discusses evidence that father and child may once have been treated as non-kin
    in some respects, but also notes present domestic closeness, high honor paid to
    the father’s sister, and classificatory systems in which paternal and maternal
    cousins are placed in the same categories and subject to the same marriage restrictions.
  language: English
  quote_policy: summarized
