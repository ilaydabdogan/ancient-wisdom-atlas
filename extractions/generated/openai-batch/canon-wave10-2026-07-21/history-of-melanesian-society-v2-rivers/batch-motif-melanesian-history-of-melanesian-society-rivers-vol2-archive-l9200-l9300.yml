canonical_text:
  quote: ''
  summary: The passage argues that the regional distribution of Melanesian kinship
    terms for grandparents and elder/younger siblings is closely connected, especially
    where older systems show effects of marriage between persons two generations apart.
    It then compares several Melanesian regions, describing how introduced or widely
    diffused kinship terms correspond, imperfectly, with different stages of marriage-system
    change. Pentecost is presented as an anomalous or unresolved case, while parent
    and child terms are said to show greater diversity.
  language: English
  quote_policy: summarized
