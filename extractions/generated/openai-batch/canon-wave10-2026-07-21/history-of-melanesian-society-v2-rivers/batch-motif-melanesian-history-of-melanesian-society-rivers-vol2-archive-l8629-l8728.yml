canonical_text:
  quote: ''
  summary: The passage analyzes Melanesian and Polynesian kinship terminology, especially
    the term tumbu, arguing that its primary meaning was grandparent and its use for
    mother’s brother was a secondary development connected with changes in cross-cousin
    marriage. It then compares terms for parents-in-law and siblings-in-law across
    Polynesia, Fiji, the Solomons, Santa Cruz, the Torres and Banks groups, Pentecost,
    Tanna, and Aniwa.
  language: English
  quote_policy: summarized
