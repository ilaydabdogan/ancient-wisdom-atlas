canonical_text:
  quote: ''
  summary: The passage presents Rivers's hypothesis that adoption and community of
    children in Melanesia and Polynesia are related to earlier forms of sexual communism
    and to interactions between indigenous populations, immigrant men, chiefs, and
    the kava-people. It discusses payment-based acquisition of paternal rights, Polynesian
    chiefly succession, royal blood, and alternative explanations involving the dominance
    of old men.
