canonical_text:
  quote: ''
  summary: The passage evaluates possible origins of a Melanesian belief that animals
    or plants influence expectant mothers. It considers whether such beings embodied
    dead ancestors and whether animal or plant incarnation was linked to later human
    reincarnation. It then weighs kava-people, dual people, and interaction hypotheses,
    ending with an explanation in which mixed-parentage children’s varied appearance
    encouraged a belief connecting them with animal or plant nature.
  language: English
  quote_policy: summarized
