canonical_text:
  quote: ''
  summary: The passage summarizes the distribution of totemism in Melanesia, then
    discusses non-totemic and local exogamy in Merlav and Lau. It compares these with
    local groupings in Mota, including their relation to dual organization, Tamate
    societies, and Sukwe organizations. The author cautiously reconstructs an earlier
    coexistence of dual and local groupings in the Banks Islands, with possible totemic
    and marriage-regulating functions, and notes a tradition that Merlav was populated
    by small bands from other islands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The survey identifies genuine totemism in the Santa Cruz groups, the Buin
    and Shortlands region, and probably Sandwich Island, while also noting modified
    or less typical forms in the matrilineal district of the Solomons and Fiji.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Merlav is described as having ten or eleven exogamous clans apparently unconnected
    with objects regarded as totems; the author says they may each occupy a district,
    which would make them an example of local exogamy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Lau district of Malaita, a man was said not to be allowed to marry
    a woman of his own village, and collected pedigrees are said to confirm this statement.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mota is described as having a local grouping alongside a dual organization,
    with information drawn from references to Sukwe and Tamate societies.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that if Mota districts have their own Tamate societies
    and Sukwe organizations, their inhabitants probably form local groups with definite
    social functions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A correspondence between some Mota districts and moiety subdivisions raises
    the possibility of a formerly localized totemic grouping coexisting with dual
    organization.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes a suggestive resemblance between possibly localized
    Merlav clans and localized Mota moiety subdivisions, but says more exact knowledge
    is needed.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author states that in Mota the local grouping appears to have lost any
    former social functions related to marriage and preserves only faint indications
    of totemic character.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says Merlav lacks the dual system and has a less definite totemic
    character than Mota, and that tradition points to Merlav being populated by small
    bands from other islands.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author presents Merlav exogamy as more naturally understood as survival
    of an exogamous mechanism once universal in the Banks Islands than as a transfer
    of exogamy from the dual system to a previously non-marriage-regulating system.
  category: speech
  evidence_refs:
  - ev:8
