canonical_text:
  quote: ''
  summary: The passage argues that certain Pentecost marriage customs, including infant
    betrothal and ceremonial bride-capture to the house of the man’s mother, can be
    explained by the dominance of old men and their monopoly over young women. It
    interprets mock conflict in marriage ceremonies as a survival of resistance to
    internal marriage regulations rather than capture from hostile tribes, compares
    this explanation with Malabar marriage ceremonies, and discusses how several anomalous
    marriage forms may form a coherent system under the same theory.
  language: English
  quote_policy: summarized
