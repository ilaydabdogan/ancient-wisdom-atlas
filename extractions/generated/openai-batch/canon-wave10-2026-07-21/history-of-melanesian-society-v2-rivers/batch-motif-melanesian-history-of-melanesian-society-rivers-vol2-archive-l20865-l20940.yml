canonical_text:
  quote: ''
  summary: The passage analyzes tattooing in Oceania, weighing whether it belongs
    to kava-people culture, earlier Oceanic culture, or later diffusion through transient
    island contacts. It compares Polynesian male tattooing, Tahitian Areoi associations,
    the non-tattooed Tongan tuitonga, female-only Banks Islands practice, and Fijian
    tradition linking the custom to recent Polynesian intercourse.
  language: English
  quote_policy: summarized
