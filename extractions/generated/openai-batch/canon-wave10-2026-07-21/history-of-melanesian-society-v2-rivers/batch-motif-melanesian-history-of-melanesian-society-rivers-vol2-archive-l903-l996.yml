canonical_text:
  quote: ''
  summary: The passage analyzes how the terminology for the wife of the mother's brother,
    cross-cousins, and related relatives varies across Banks, Torres, Loh, and Pentecost
    Island societies. It links address by personal name and certain kin terms with
    marriage eligibility, especially marriage to the wife of the mother's brother,
    and argues that such marriage can explain why some cross-cousins are classed as
    parent and child. The author also notes unresolved classificatory details and
    the possibility that the marriage rule may result from, rather than cause, the
    relationship terminology.
  language: English
  quote_policy: summarized
