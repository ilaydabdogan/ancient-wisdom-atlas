- id: obs:3
  text: The passage lists Tikopian features including kinship regulation of marriage,
    sacred chiefs, tapu, ancestral and animal atua, occupational groups, kava drinking,
    tattooing, incision, sea-canoe punishment, and wearing hair of the dead.
  category: attribute
  evidence_refs:
  - ev:1
