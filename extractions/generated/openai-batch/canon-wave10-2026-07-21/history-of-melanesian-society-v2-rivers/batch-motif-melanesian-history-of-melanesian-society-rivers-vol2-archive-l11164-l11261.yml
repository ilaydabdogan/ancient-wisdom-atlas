  text: Tikopian and Tongan systems of relationship are described as almost exactly
    alike in structure and in the linguistic character of their terms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Both Tikopia and Tonga are said to have a connection between animals and social
