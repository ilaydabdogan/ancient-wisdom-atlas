canonical_text:
  quote: ''
  summary: The passage argues that Tikopian culture is essentially Polynesian and
    more specifically closely related to Tonga. It compares Tikopia and Tonga through
    kinship terminology, social ranks, sacred beings, animal-linked social groups,
    tattooing and incision, punishment by sending offenders to sea in canoes, turtle
    food restrictions and offerings, weapons, and material culture. It considers but
    rejects a recent Tongan invasion as a sufficient explanation for the fundamental
    similarities.
  language: English
  quote_policy: summarized
literal_observations:
