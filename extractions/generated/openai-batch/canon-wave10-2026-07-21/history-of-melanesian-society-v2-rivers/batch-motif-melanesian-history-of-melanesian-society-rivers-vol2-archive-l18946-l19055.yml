- id: obs:3
  text: 'The author frames a difficulty: if kava-people promoted individual marriage,
    the presence of much sexual communism in Polynesia, where kava-people influence
    was great, appears problematic.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author proposes that Polynesian culture was complex and that kava-people
    were later settlers among an established Pacific island population whose property
    and sexual communism were not greatly affected.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For Hawaii, the author reports evidence that individual marriage among chiefs
    was temporary and aimed at producing a proper succession line, after which the
    parties re-entered communistic practices of their class.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: For Hawaiian commoners, the author says individual marriage existed but was
    associated with considerable communism and the institution of punalua.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: For the Society Islands, the author says chiefs rarely had more than one wife
    and that jealousy among chiefs and higher members of the Ai'eoi society suggested
    strictness of the marriage tie.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author says licentiousness was more pronounced among lower strata of the
    Society Islands population than among chiefs, and links those strata in his scheme
    to earlier inhabitants.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author says communism and licentiousness were less evident in the Samoan
    and Tongan Islands, where he believes kava-people influence was greater, and cites
    Tikopia's strict individual marriage as relevant to kava-people culture.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author says there is no evidence of sitting-position interment in Tonga
    and Samoa, while Tikopia shows only bent legs in an otherwise extended burial,
    and he compares this burial distribution with the distribution of pronounced communism.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author introduces adoption as a practice to be reconsidered as evidence
    for former sexual communism in Melanesia.
  category: sequence
  evidence_refs:
