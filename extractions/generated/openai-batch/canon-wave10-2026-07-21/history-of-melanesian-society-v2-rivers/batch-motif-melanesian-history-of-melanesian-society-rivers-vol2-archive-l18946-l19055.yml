canonical_text:
  quote: ''
  summary: The passage presents an ethnological argument linking communism in goods
    with sexual communism, associating those traits with the author's proposed dual
    or earlier population, while associating individual property and individual marriage
    with the kava-people. It reviews evidence from Hawaii, the Society Islands, Samoa,
    Tonga, and Tikopia, and compares the distribution of social communism with the
    distribution of sitting-position burial. It ends by introducing adoption as a
    practice to be reconsidered in light of the argument.
  language: English
  quote_policy: summarized
