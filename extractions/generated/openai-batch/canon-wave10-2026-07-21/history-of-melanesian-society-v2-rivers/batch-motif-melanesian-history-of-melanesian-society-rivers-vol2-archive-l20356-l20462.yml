canonical_text:
  quote: ''
  summary: The passage surveys Melanesian stone-work, especially in Santa Maria, and
    describes walls, platforms, gamal decoration, hollows, mounds, tables, altars,
    grave rings, monoliths, and forts. It reports traditions attributing Santa Maria
    walls and mounds to Mala-vui or Mala-tuniun working at the bidding of a few “normal
    human beings,” and presents the author’s hypotheses connecting stone-work with
    kava-people, dead cults, secret organizations, and the vui or dual people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Santa Maria is described as the Banks Islands location where stone-work is
    most abundant, including stone-buildings, a miniature trilithon, and a gamal decorated
    with stone figures in human form.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Santa Maria is described as covered with stone-walls several hundred kilometres
    long in total, as high as a man, partly built of basalt blocks, with round or
    oval hollows in many blocks and earth mounds as high as a man’s shoulder.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Worked stone is also reported in Mota and Loh in the Torres Islands.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Malo in the northern New Hebrides is reported to have stone walls and high
    platforms, sometimes finely worked, closely resembling those of Santa Maria.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Several northern New Hebrides stone structures are reported with functions
    relating to the dead: skulls on stone tables in Ambrym, a stone altar in an ancestor-cult
    hut in Vao, an offering table in south Malikolo, and grave rings with monoliths
    in Aurora.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Ysabel, stone-work is said to take the form of stone forts erected as defence
    against head-hunters.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some stone-work described by Codrington and some stone structures of Loh are
    stated to be recent, while the author says the greater part of the stone-work
    in this area is very ancient.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Santa Maria stone-walls and earth-mounds are ascribed to a people called
    Mala-vui or Mala-tuniun.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Mala-vui or Mala-tuniun are said to have had no houses, slept in the bush
    like animals, had little or no sense, and built walls, heaped mounds, and made
    stone hollows at the bidding of a few “normal human beings.”
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author states that Banks Islands stone-work was used as part of club-houses
    and that northern New Hebrides stone-work is connected with the cult of the dead.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author suggests that the stone-work may be ascribed to the kava-people
    or to a special migration that may have brought the cult of the sun.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author says the distribution of stone-work fits the idea that it was made
    by founders of secret organizations, and notes a tradition that the Matambata
    of Florida came from Ysabel, where stone-work is also found.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author interprets the Santa Maria tradition as consistent with an indigenous
    people working under the direction of a few immigrants, such as the kava-people,
    and suggests that the vui may be ghosts of the dual people.
  category: speech
  evidence_refs:
  - ev:7
