  summary: The passage reports a Fijian tradition that the Nanga cult was introduced
    from the west or north-west by two little old dark men who founded separate institutions.
    It discusses the cult's limited distribution in Viti Levu, possible relation to
    immigrant and aboriginal interaction, initiation into communion with the dead,
    uncertainty in the records, and linguistic comparison of club-house terms across
    southern Melanesia.
