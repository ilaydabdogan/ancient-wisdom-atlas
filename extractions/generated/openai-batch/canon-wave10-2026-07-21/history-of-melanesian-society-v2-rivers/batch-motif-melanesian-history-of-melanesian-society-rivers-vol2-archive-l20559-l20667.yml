canonical_text:
  quote: ''
  summary: Rivers discusses alternative interpretations of bowls associated with Tongan
    monuments, relating them either to kava use or to the preservation of skulls and
    bones. He then links extended burial, stone vaults for chiefs, megalithic monuments,
    secret societies, sun cult, and stone-working to a possible special migration
    of the kava-people. The passage turns to incision in Melanesia and Polynesia,
    emphasizing its association with clothing or ligatures that conceal the exposed
    body part and proposing cultural fusion as a way to explain apparently contradictory
    practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author suggests, as an alternative hypothesis, that bowl-like monument
    features may have been intended to receive skulls and other bones of the dead,
    while noting that this practice is not recorded in Tonga and appears incompatible
    with the local burial mode.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that interpreting the bowls as kava bowls is more probable,
    but says that even a mortuary-bone interpretation would still connect them to
    the kava-people in his scheme.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Extended-position interment in the Tongan and Samoan Islands is presented
    as a problem that may indicate a special group of the kava-people combining interment
    with preservation of the dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chiefly interment is described as involving bodies placed in vaults constructed
    of large stones, a feature the author says is unknown elsewhere in Oceania.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The combination of stone-vault interment with Tongan megalithic monuments
    is said to support the idea of a special migration.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author states as a possibility that megalithic monuments, the Areoi societies
    of Polynesia, and the Tamate hwoa were built or founded by a special migration
    of the kava-people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author says incision in the Melanesian area where he worked occurs only
    in the northern New Hebrides and Fiji, while the Santa Cruz evidence is disputed
    in the passage.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Northern New Hebrides incision is said to have come from the south and to
    be associated with dress that hides the exposed body part; dread of exposure is
    connected with the magic called narak.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Polynesia, incision is described as widespread or formerly widespread,
    and in the Marquesas and Gambier Islands it is associated with a ligature used
    to hide the glans and with dread that the body part be seen by others.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author proposes that contradictory beliefs and practices may result from
    fusion or interaction between immigrant and indigenous cultural elements.
  category: speech
  evidence_refs:
  - ev:6
