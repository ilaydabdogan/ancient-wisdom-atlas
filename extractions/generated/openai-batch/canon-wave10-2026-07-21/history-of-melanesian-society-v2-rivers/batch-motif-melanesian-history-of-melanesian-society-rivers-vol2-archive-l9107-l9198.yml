  quote: ''
  summary: The passage argues that several Melanesian kinship terms, especially terms
    for siblings, grandparents, grandchildren, affinal relatives, and relationships
    affected by marriage rules, belong to an introduced linguistic group. It links
    these terms to hypothesized changes in marriage regulations, possible external
    influence, regional variation among island systems, and an unresolved problem
    about why brother and sister terms appear widely distributed.
  language: English
  quote_policy: summarized
