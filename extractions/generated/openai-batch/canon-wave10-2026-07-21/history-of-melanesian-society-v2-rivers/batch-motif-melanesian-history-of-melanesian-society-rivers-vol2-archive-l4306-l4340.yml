  summary: The passage argues that Melanesian kinship nomenclature underwent processes
    of term reduction, increasing complexity, and later simplification. It presents
    the Pentecost system as an especially complex recorded stage, speculates that
    earlier stages may be found in Ambrym, Malikolo, or elsewhere, and links some
    kinship correspondences to specific marriage forms.
