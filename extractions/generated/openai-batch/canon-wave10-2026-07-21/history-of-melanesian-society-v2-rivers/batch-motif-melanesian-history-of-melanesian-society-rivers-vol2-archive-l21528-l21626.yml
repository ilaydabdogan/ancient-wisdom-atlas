  quote: ''
  summary: The passage discusses Oceanic canoe construction and navigation. It compares
    a Malikolo war-canoe with Solomon Islands plank-built canoes, cites Polynesian
    plank-built examples, and proposes cultural attributions of canoe technologies
    to kava-people, betel-people, and earlier inhabitants who interred the dead in
    a sitting position. It also links Solomon Islands canoe use with paddling, coastal
    navigation, sleeping ashore, and head-hunting expeditions.
