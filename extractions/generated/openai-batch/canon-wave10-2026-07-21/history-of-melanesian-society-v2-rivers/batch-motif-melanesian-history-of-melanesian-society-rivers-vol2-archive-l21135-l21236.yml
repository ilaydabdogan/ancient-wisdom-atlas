canonical_text:
  quote: ''
  summary: The passage discusses the distribution and possible origins of mats used
    as clothing and money in parts of Melanesia, especially Santa Cruz, Lepers' Island,
    Pentecost, the northern New Hebrides, and the Banks Islands. It argues that mat
    clothing may reflect Polynesian influence or an older form that disappeared elsewhere,
    while mat-money may go back to the kava-people. It also cites the disappeared
    malo-saru garment, cloth-related words in Banks Islands languages, and the distribution
    of bark-cloth as evidence for historical changes in material culture.
  language: English
  quote_policy: summarized
