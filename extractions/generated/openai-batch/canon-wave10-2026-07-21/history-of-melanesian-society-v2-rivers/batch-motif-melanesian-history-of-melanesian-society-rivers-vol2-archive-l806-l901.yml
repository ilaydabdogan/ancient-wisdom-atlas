canonical_text:
  quote: ''
  summary: The passage analyzes the nomenclature and social functions of the mother's
    brother, father's sister, sister's child, and wife of the mother's brother in
    Melanesian and Polynesian kinship systems, emphasizing correlations between special
    kin terms, exogamous group distinctions, social privileges, and potential marriage
    relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother's brother, father's sister, their consorts, and their children
    are presented as a theoretically important class of relatives for understanding
    social position and function.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Where exogamy exists, the mother's brother and father's sister are said always
    to belong to different social groups, regardless of whether descent is patrilineal
    or matrilineal; their children are also said to belong to different social groups.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In most recorded systems the mother's brother is denoted by a special term,
    while in some Polynesian communities and the Western British Solomons he is classed
    with the father; elsewhere he may be identified in nomenclature with the father-in-law.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In many cases the term for a sister's son is the same as that for the mother's
    brother, while in Tonga, Tikopia, Samoa, some parts of Fiji, and Vella Lavella
    a special term denotes a man's sister's son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Eddystone Island, the mother's brother and father are classed together
    as tamay, while a special term exists for a man's sister's son.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that the mother's brother relationship clearly shows a connection
    between absence of a special term and absence of function.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Across Polynesia, as described in the passage, the mother's brother has no
    special duties or privileges except where he has a special designation; Tonga
    and Tikopia are named as places where the maternal uncle has a social position
    like that found in many parts of Melanesia.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that in the Hawaiian Islands and among the Maoris the uncle
    is classed with the father and has no special social functions; in Samoa the sister's
    child has a special term and special powers and privileges; in Eddystone the mother's
    brother is classed with the father and father's brother and has no discovered
    special functions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Polynesia and in some parts of Melanesia, including Eddystone, Saa, and
    Ulawa, the wife of the mother's brother is classed in nomenclature with the mother
    and the wife of the father's brother, and is said to have no special functions;
    elsewhere in Melanesia she may receive the same name as the father's sister or
    be classed with the mother-in-law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Mota and Pentecost, the wife of the mother's brother is named by terms
    applied to other potential wives, and the passage states that this nomenclature
    is accompanied by evidence of marriage with this relative.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that under former polygyny a man customarily gave one or
    more wives to his sister's son, and that it remained proper for a man to take
    the widow of his mother's brother.
  category: action
  evidence_refs:
  - ev:6
