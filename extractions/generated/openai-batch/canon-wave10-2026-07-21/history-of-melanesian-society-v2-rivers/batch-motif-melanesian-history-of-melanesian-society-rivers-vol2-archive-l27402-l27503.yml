canonical_text:
  quote: ''
  summary: The passage summarizes Rivers's argument that Melanesian social organization,
    kinship terminology, secret societies, plant-use distributions, and mortuary practices
    indicate an earlier dual matrilineal system later modified by external or immigrant
    peoples. It distinguishes kava- and betel-associated migrations, compares Melanesian
    and Polynesian cultural elements, and treats death practices as evidence for multiple
    cultural strata.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that a dual organization with matrilineal descent once had
    a wider distribution in Melanesia and was associated with communism and dominance
    by old men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The author states that Melanesian relationship terms fall into two groups:
    one widely diffused and shared with Polynesia, and another limited to Melanesia
    and diverse within it.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author concludes that an external people supplied terms for relatives
    whose status and functions had been affected by social change.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says secret societies are present where dual organization still
    flourishes, and that their essential character resembles open religious practices
    elsewhere in Melanesia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author concludes that an immigrant religion became an open cult where
    immigrants were dominant and was embodied in secret-society ritual where they
    could not alter the older social organization.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage compares Tikopia with Polynesia generally and Tonga in particular,
