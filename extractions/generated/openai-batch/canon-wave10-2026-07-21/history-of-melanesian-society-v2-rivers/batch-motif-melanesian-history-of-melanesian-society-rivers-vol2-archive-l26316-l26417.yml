canonical_text:
  quote: ''
  summary: The passage discusses Melanesian mortuary practices, especially cremation,
    upright body disposal, sea burial, and preservation of the head or skull. It proposes
    that forms of body disposal may correspond to beliefs about the dead reaching
    homes beneath the ground, by water, or in the sky. The author treats the sky-home
    explanation for Melanesian cremation and upright disposal as a hypothesis with
    scant evidence, while noting stronger evidence for sky destinations of the dead
    in eastern Polynesia and New Zealand. The passage then begins a section on the
    Admiralty Islands and their differentiated population elements and customs.
  language: English
  quote_policy: summarized
