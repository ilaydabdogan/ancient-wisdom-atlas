canonical_text:
  quote: ''
  summary: The passage evaluates bride-price as a marriage transaction, noting that
    it goes to the bride's immediate relatives and social group rather than to those
    deprived of a potential wife. It then defines patrilocal and matrilocal residence
    and states that postmarital residence with the husband's people is usual in Melanesia,
    including Pentecost, where a bride is taken to the husband's village. The passage
    concludes that even in areas with archaic social institutions there is no association
    between matrilocal marriage and matrilineal descent.
