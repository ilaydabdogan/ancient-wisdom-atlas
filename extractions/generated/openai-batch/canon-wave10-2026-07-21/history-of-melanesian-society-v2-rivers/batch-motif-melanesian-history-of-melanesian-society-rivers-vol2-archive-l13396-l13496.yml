canonical_text:
  quote: ''
  summary: The passage reassesses the apparent uniformity of Polynesian culture, argues
    that published records may overemphasize chiefly customs, and proposes that Polynesian
    society may have a two-fold structure comparable to Melanesia. It then surveys
    mortuary evidence across Polynesia, contrasting preservation, exposure, embalming,
    disinterment, or deification of chiefly remains with interment of commoners, and
    states that the correspondence with Melanesian practices is close.
  language: English
  quote_policy: summarized
