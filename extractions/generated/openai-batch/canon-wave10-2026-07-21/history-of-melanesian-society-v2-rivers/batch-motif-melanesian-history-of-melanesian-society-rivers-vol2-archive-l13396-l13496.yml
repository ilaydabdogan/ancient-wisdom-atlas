- id: obs:5
  text: The passage states that available evidence points to a two-fold nature of
    Polynesian culture and compares the Polynesian distinction between chiefs and
    commoners with a Melanesian distinction interpreted as the fusion of two peoples.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that, throughout Polynesia, preservation of the dead is
    evidenced as a chiefly practice, while interment in the sitting position is evidenced
    as a practice of common people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Examples given include Tahiti, where chiefs' bodies were preserved and skulls
    removed while commoners were interred sitting, and the Marquesas, where bodies
    of the rich and influential were preserved.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Examples given include Paumotu Islands and Manahiki, where chiefs' bodies
    were set out on platforms, while commoners were interred in Manahiki and probably
    in the Paumotus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Examples given include Rarotonga, where chiefs were interred only after exposure
    in a canoe, and southern New Zealand, where disinterment and deposition of bones
    in a miniature canoe or house were required for chiefs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Examples given include Samoa, where a chief's body could remain unburied for
    days and certain chiefly families embalmed the dead, and the Hawaiian Islands,
    where a king's bones were disinterred, preserved, and deified.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author states that the evidence for preserving chiefs and interring commoners
    is more definite in Polynesia than in Melanesia and that the practices of the
    two areas correspond closely.
  category: relationship
  evidence_refs:
  - ev:8
