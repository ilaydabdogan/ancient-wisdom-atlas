  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Polynesian culture is described as showing broad uniformity in social structure,
    systems of relationship, language, religious belief, and some elements of material
    culture.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Polynesian religious uniformity includes a recurring type
