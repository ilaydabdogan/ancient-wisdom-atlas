  quote: ''
  summary: 'The passage states two anthropological generalisations: special kinship
    terms correspond to relatives'' duties, privileges, or restrictions, and special
    features of relationship systems result from social conditions, especially marriage
    forms. It notes an exception in the father''s sister, who may be classed terminologically
    with the mother despite different rights and restrictions, and argues that kinship
    systems are important for studying human society.'
