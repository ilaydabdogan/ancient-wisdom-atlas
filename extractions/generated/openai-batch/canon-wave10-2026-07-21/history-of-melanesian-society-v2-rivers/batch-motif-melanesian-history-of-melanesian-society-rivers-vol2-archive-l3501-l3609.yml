canonical_text:
  quote: ''
  summary: The passage argues that a dual social organisation once existed widely
    in Melanesia and explains certain kinship terms as consequences of two exogamous
    groups. It also describes subsidiary groupings within moieties in the Banks, Torres,
    and Pentecost Islands, including local district divisions, Tamate societies, property-holding
    vevana or verana, and reported Pentecost marriage restrictions among subdivisions
    of the two moieties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that evidence indicates a dual organisation once existed
    across a wide Melanesian area from the Solomon Islands to the northern New Hebrides
    and eastward to Fiji, and that it still exists in some parts of that area.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that evidence is too limited for a positive opinion about
    southern New Hebrides, the Loyalty group, and New Caledonia, though cross-cousin
    marriage could provide indirect evidence if it arose as the author supposes.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author explains shared designation for the children of a father’s brother
    and a mother’s sister as a natural result of a dual organisation with two exogamous
    social groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the author’s model, two sisters in a society with only two exogamous groups
    must marry men of the same group, and their children must belong to the same group
    whether descent is paternal or maternal.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Banks Islands, divisions within moieties are said to appear not to
    regulate marriage, though some correspond with island districts.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says each district of Mota has its own Tamate hwoa, and corresponding
    societies in different districts are apparently largely independent.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Similar subgroups are reported for the Torres Islands, but the author says
    he lacks information about their history or their current role in social life.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author characterizes the Pentecost information as scanty and untrustworthy,
    while also saying it suggests important complications of the dual organisation.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Within the two moieties of Pentecost, groups called vevana or verana are described
    as socially important, especially in relation to property.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Certain objects, including canoes, are said to have once been common possessions
    of the vevana or verana.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: A report attributed to John Pantutun says Pentecost moieties had subdivisions
    that regulated marriage, so that a person of one moiety could marry only members
    of one subdivision of the other moiety.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: 'The reported Pentecost scheme assigns three subdivisions to each moiety and
    gives an asymmetric example: a man of group A marries a woman of group D, but
    a man of D does not marry a woman of A.'
  category: sequence
  evidence_refs:
  - ev:11
