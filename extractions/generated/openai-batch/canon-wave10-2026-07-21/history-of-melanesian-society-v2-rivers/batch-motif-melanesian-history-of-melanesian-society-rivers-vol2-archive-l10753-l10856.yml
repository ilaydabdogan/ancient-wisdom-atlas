  summary: The passage reviews an explanatory scheme for the Sukwe and Tamate societies
    of the Banks Islands, especially the gamal or men's club-house, ranks, secrecy,
    and connections between ranked men's-house organization and secret societies.
    The author weighs whether these features arose through interaction between immigrant
    and aboriginal populations or were brought by immigrants from an earlier home,
    then compares the Banks organizations with those of the Torres Islands.
  language: English
