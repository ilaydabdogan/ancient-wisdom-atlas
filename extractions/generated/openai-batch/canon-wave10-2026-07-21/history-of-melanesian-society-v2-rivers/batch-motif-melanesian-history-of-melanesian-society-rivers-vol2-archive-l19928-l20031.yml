canonical_text:
  quote: ''
  summary: The passage distinguishes named and unnamed vui, describes unnamed vui
    as localized spirits tied to definite places, and connects their rites, offerings,
    and possession cures to local ownership and specialist knowledge. It contrasts
    spirit and ghost cults in southern Melanesia, the Solomons, and proposed Polynesian
    evidence, assigning ghost/dead-focused religion to the kava-people and locality-spirit
    belief to an earlier dual people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage distinguishes two classes of vui/vuz: unnamed beings associated
    with magical and other rites, and named beings such as Kwat, Marawa, and Tagaro.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Unnamed vui are described as localized spirits with definite haunts or abiding
    places; rites connected with them are performed in definite places.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the northern New Hebrides, offerings connected with vui are described as
    being made to the man who owns the place connected with the vui, not directly
    to the vui themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man may be possessed by either a tamate or a vui; when a vui is involved,
    the gismaua/gzsmaua must discover the place of the vui.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the vui has been localized, the gismaua/gzsmaua must seek help from
    another man with special powers connected with that vui, probably the owner of
    the vui's place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says there is no corresponding need to discover the place of a
    tamate that has possessed a sick person.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author argues that vui are local spirits belonging to indigenous owners
    of the soil, while the gismana represents an immigrant culture.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author describes southern Melanesia as a case where a ghost cult is embedded
    in secret ritual, while the cult of spirits remains a prominent and obvious part
    of magical and religious rites.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Solomons, the passage says both ghosts and spirits are believed in,
    but offerings and prayers are especially directed to ghosts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage assigns religious beliefs based on the influence of the dead to
    the kava-people and beliefs in locality-connected spirits to the earlier dual
    people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author proposes a Polynesian comparison but states that the details of
