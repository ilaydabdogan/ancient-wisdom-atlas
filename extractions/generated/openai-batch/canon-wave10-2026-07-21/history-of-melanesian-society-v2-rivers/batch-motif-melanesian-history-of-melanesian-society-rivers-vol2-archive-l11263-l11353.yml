  quote: ''
  summary: The passage compares Tikopian culture with Tongan and Melanesian cultures.
    It argues that Tikopia may preserve archaic features, including stronger totemic
    animal relations, earlier forms of chieftainship, taboo, ancestor cult, and ritual
    details resembling Melanesian secret societies, such as cycas use and hanging
    or strangling as death punishment.
  language: English
