canonical_text:
  quote: ''
  summary: 'The passage surveys funerary treatments in parts of Melanesia and Polynesia:
    cremation, water disposal of bones at clan keno, interment, skull removal, preservation
    or mummification, cave or chasm deposition, and the use of canoes or canoe-representations
    as containers or conveyances for the dead. It notes rank distinctions and a totemic
    relationship between bones, keno animals or beings, and the dead person''s soul.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the described opening case, the bones of chiefs or women of chiefs' rank
    are collected after burning and then thrown into the sea or rivers, or interred.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When bones are thrown into water, the action is usually performed at places
    called keno, with each Icitu or clan having its own keno.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the keno, bones are believed to be swallowed by fishes, other animals,
    or mysterious beings; one example is said to resemble a hand-net.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some animals that receive the bones are included among totems, and the dead
    person is described as the fabiu of the animal or being.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The keno is also described as the bathing-place of the nunu or soul of the
    dead man; in rarer interments of chiefs, a special equivalent locality may be
    used.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Choiseul, bodies are either burnt or placed in a sitting position until
    the skull can be removed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Buin district of Bougainville, cremation is practiced; a dead man's
    body is burnt on a platform about a man's height, and the bones from the ashes
    are interred.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Polynesia, interment is practiced in Tonga, Samoa, and Tikopia, while in
    many other islands interment is used for those not of high rank, often with a
    contracted or sitting body position.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Interment may take place in a house or house-like structure; chiefs in Tonga
    and Samoa are interred in stone vaults, and bodies are often buried in a canoe
    or hollowed log representing a canoe.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A second mode is preservation of the body in a house or on a roofed stage,
    often involving rubbing with oil, drying by fire, and puncturing the body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In parts of Samoa, embalming includes removal and burial of the viscera; a
    treated body lies on a platform resting on a double canoe, and canoes elsewhere
    serve as receptacles during mummification.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After above-ground preservation, bones may be interred, preserved in the house,
    or moved to a secret hollow or cavern, often high on an island; sometimes only
    the skull is preserved.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: For chiefs in Samoa and Rarotonga, interment may be delayed while the body
    is exposed; in Samoa, a dead chief may be carried to places connected with his
    life.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Another disposal method is placing the body in a cave or chasm, which the
    passage says appears associated with mummification.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: For commoners, the body may be thrown into the sea or, in Niue, sent adrift
    in a canoe; the dead were also formerly sent out to sea in canoes in Samoa.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The author identifies as widespread the placement of dead bodies in canoes
    or in representatives of canoes.
  category: other
  evidence_refs:
  - ev:11
