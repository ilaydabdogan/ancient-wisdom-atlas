canonical_text:
  quote: ''
  summary: The passage discusses the Baining as a possible example of a social condition
    earlier than dual organization, then describes Sulka social organization, food
    restrictions, a men’s house with masks, puberty rites, and mortuary rites involving
    seated house burial, protection from earth, a tower-like structure, stones, fire,
    and later preservation of bones. The author also makes cautious comparisons to
    New Ireland, New Britain, Melanesian secret societies, kava- and betel-associated
    cultural influences, and the Ingiet kinao ceremony.
  language: English
  quote_policy: summarized
