canonical_text:
  quote: ''
  summary: The passage surveys Oceanic totemism by the kinds of objects used as totems
    in several Melanesian regions. It notes regional predominance of aquatic or marine
    animals, birds, plants or trees, and other objects. It also suggests that the
    Kwat society in the Banks Islands came from elsewhere and may have been initiated
    by immigrants whose totems were marine animals, and it treats many Tamate society
    names as possibly derived from ancient totems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage classifies varieties of Oceanic totemism by the character of the
    objects that serve as totems.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Santa Cruz group, fishes or other aquatic animals are described as
    strongly predominant among totems and prohibition-connected objects, with smaller
    numbers of birds, plants, a mammal, and fruits in the cited lists.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Vanikolo and the Reef Islands, totems are described as largely aquatic
    animals; the Reef Islands exception named in the passage is the flying fox.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In parts of the Solomon Islands, birds are especially prominent among sacred
    clan objects, while other objects include crab, shark, snake, lizard, sun, moon,
    plants, trees, fishes, and mammals.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Shortland Islands, the tua totems are mostly birds, while the identified
    tete totems include fewer birds and more fishes, lizards, crocodile, ant, and
    centipedes; in Buin the totems are said to be exclusively birds.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: On Sandwich Island or Efate, nearly all the clan totems are plants, while
    the other two named totems are the octopus and a shell.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Kwat society of the Banks Islands, the animals connected with divisions
    of the society are described as almost exclusively marine, with the wumeto or
    bowl as the only exception.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that evidence indicates the Kwat society came to the Banks
    Islands from elsewhere and that its sacred animals suggest initiation by immigrants
    whose totems were marine animals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Many Tamate society names are presented as probably deriving from ancient
    totems, with birds and fishes by far the most frequent sources.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The Tamate salagoro societies include eponymous animals and objects such as
    the owl, pepe fish, other fishes, birds, plants, a shell, rat, fly, and ant's
    nest.
  category: object
  evidence_refs:
  - ev:8
