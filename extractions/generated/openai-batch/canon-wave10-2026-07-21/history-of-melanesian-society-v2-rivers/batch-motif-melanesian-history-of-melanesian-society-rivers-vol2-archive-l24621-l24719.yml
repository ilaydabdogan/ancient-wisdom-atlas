canonical_text:
  quote: ''
  summary: The passage compares the Ingiet organization of the Bismarck Archipelago
    with Tamate societies of the Banks Islands, emphasizing initiation secrecy, stone
    images representing dead members, animal and object forms associated with ghosts,
    links to Melanesian totemism, and the circulation of sacred images with shell-money
    from Nakanai to the Gazelle Peninsula.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that apparent differences between the Ingiet and Tamate
    societies can be reduced by examining Ingiet procedures in detail.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says no mysterious sound is reported for the Ingiet; a conch-shell
    may warn the uninitiated, but the source of the sound is not said to be secret.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The special secret revealed to newly initiated members is that they are shown
    certain stone images.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stone images are described as primarily representations of dead Ingiet
    members, whether in human, animal, or inanimate-object form.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Animals represented by the images are said to be animals in which New Britain
    people recognize the power of a personal spirit or ghost.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Images of wooden gongs and water-vessels are described as sacred because the
    ghosts of their makers are believed to remain present in them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author contrasts Banks Islands animal representations as masks and society
    names with Bismarck Archipelago animal representations that remain closely associated
    with dead human beings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage lists many animals represented by Ingiet stone images, including
    birds, dog, pig, kangaroo, flying fox, crocodile, snake, lizards, shark, and another
    fish.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author says these represented animals have become totems elsewhere in
    Melanesia and connects them with a hypothesis that ancestors were embodied after
    death in animals.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The most important sacred images used in the Gazelle Peninsula are said to
    come from Nakanai, where shells for shell-money are also obtained.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says stone images and shell-money travelled together, and that
    Ingiet celebrations travel west to east, opposite to the Dukduk movement from
    east to west.
  category: sequence
  evidence_refs:
  - ev:8
