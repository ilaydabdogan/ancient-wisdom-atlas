canonical_text:
  quote: ''
  summary: 'The passage presents a hypothetical reconstruction of Melanesian marriage
    history: recognition of generations and kinship is suggested to derive from an
    earlier family-based society; sexual communism is treated as a later development;
    latent desire for individual relations is proposed as re-emerging when elders
    gained dominance through belief in their magical power; the passage then frames
    the transition toward individual marriage and raises the question of whether the
    prior condition should be called group-marriage.'
