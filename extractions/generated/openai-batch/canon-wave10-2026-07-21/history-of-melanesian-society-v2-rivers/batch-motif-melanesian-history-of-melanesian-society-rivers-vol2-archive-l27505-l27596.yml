  quote: ''
  summary: The passage summarizes the author's conclusions about Melanesian and Oceanic
    cultural history. It reviews a proposed scheme of immigrant settlement and cultural
    interaction, tested against social organization, totemism, art, money, religion,
    magic, sun-cult, stone-work, incision, and language. It discusses kava-people,
    extended interment, cremation, sun-cult, Bismarck Archipelago secret societies,
    the Admiralty Islands, and the hypothesis that dual social organization arose
    from fusion between peoples, possibly including an aboriginal population represented
    by the Baining of New Britain.
  language: English
  quote_policy: summarized
