canonical_text:
  quote: ''
  summary: The passage discusses round houses as possible cultural markers in Polynesia
    and Melanesia, weighing links to sitting-burial peoples, kava-people, Fiji's Nanga,
    chiefs in New Caledonia, and possible additional immigrant influence. It then
    discusses ritual sound-producing instruments in Sukwe and Tamate societies, including
    a tradition that the werewere sound was appropriated from an old woman making
    shell money, and compares the werewere, bullroarer, meretang, conch-shell, and
    wooden gong or drum.
  language: English
  quote_policy: summarized
