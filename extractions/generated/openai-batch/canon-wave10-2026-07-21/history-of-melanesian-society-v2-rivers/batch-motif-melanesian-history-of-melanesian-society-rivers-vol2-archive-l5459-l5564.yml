  summary: The passage discusses Santa Cruz and Solomon Islands marriage regulations.
    It infers former marriages with certain relatives from kinship terminology and
    restrictions, describes the term kandongi as linked with avoidance and prohibition
    of marriage, and relates payment or purchase of wives to the disappearance or
    cessation of relative and cross-cousin marriage practices.
