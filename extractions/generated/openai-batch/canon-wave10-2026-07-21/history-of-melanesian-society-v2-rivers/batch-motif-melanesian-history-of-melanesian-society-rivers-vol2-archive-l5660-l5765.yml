  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author summarizes previous analysis as finding possible traces of marriage
    with the wife of the father’s brother and a wider distribution of marriage with
    the brother’s daughter.
  category: sequence
  evidence_refs:
  - ev:4
