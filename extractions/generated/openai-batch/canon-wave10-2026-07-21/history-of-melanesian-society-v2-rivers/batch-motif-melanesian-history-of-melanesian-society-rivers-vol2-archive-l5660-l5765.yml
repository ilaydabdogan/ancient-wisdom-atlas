  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marriage with the brother’s daughter is instead described as probably a late
    feature connected with the decay of old men’s dominance, in which a younger man
    could obtain a wife through his elder brother giving him a daughter.
  category: sequence
  evidence_refs:
  - ev:7
