canonical_text:
  quote: ''
  summary: The passage analyzes Melanesian kinship terminology and marriage forms
    in Eddystone Island, Vella Lavella, the Shortland Islands, Buin, and related cases.
    It argues that some kinship terms may preserve traces of marriages with the wife
    of the father’s brother or with the brother’s daughter, compares these with cross-cousin
    marriage and other forms, and frames several marriage patterns as connected to
    the dominance and later decline of old men in social organization.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that Eddystone Island and Vella Lavella relationship terminology
    has features that would follow from marriage with the wife of the father’s brother,
    but also states that there is no direct evidence for this form of marriage there.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Shortland Islands system, a woman calls her husband’s father by a term
    also used for grandfathers, and calls her husband’s mother by a term used for
    grandmother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Shortland Islands terminology is explained by the hypothetical case in
    which a woman marries her father’s brother, making her husband’s father the same
    person as her father’s father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author says the Shortland Islands correspondences suggest former marriage
    with the brother’s daughter, a practice described as still occasional among the
    Torres islanders.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Buin system is described as combining features attributed to cross-cousin
