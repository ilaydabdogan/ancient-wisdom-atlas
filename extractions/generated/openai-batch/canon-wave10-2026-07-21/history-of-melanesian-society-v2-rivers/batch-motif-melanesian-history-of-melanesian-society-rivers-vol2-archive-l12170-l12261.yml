  summary: The passage argues that betel-chewing displaced ordinary kava use in some
    islands, leaving kava chiefly in religious ceremony or offering contexts. It proposes
    that kava-drinking originated within Oceania as a development from betel-chewing
    practices carried or remembered by migrants, with experimentation on leaves and
    roots of related plants leading to different preparation methods. The passage
    cites plant names and plant substitutions as supporting evidence for the proposed
    relationship.
