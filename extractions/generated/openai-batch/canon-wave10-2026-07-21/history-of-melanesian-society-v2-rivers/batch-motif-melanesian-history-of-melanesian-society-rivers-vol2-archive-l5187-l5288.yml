canonical_text:
  quote: ''
  summary: Rivers discusses marriage customs in Pentecost, the Banks Islands, and
    the Torres Islands. He interprets Pentecost ceremonial capture as a sham procedure
    involving relatives’ connivance, records Banks Islands customs of marrying the
    mother’s brother’s widow, giving pigs and money for some wives, and father’s-sister
    control over marriage choice, and then discusses Torres/Hiw marriage with the
    father’s sister in relation to dual social organization and kinship-status distinctions.
  language: English
  quote_policy: summarized
