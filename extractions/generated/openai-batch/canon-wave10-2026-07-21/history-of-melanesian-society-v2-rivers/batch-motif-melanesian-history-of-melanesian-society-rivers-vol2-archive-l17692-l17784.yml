canonical_text:
  quote: ''
  summary: The passage argues that Melanesian totemism can be explained through the
    kava-people's belief that the dead become incarnate as animals or plants. It connects
    this belief with Tamate society ritual, ancestor cults, animal and plant names,
    masks, and restrictions. It then compares the relative weakness of animal cults
    in Polynesia with evidence from Tikopia, Samoa, Tonga, and Tahiti, and argues
    that the betel-people are unlikely to have contributed to Melanesian totemism
    because totemism is absent in areas associated with their influence.
  language: English
  quote_policy: summarized
