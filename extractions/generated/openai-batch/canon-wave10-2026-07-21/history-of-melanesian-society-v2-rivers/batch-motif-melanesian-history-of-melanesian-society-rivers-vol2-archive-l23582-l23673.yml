  summary: The author argues that, if Melanesian possessive nouns originated in a
    lingua franca, then Polynesian languages likely developed from a pidgin form.
    He uses this linguistic hypothesis to explain Polynesian linguistic uniformity,
    to support a migration route through Indonesia and Melanesia, and to advocate
    combined study of language, social structure, and social function in Oceanic ethnology.
  language: English
  quote_policy: summarized
