canonical_text:
  quote: ''
  summary: 'The passage discusses proposed cultural associations in Melanesia: sun
    cult rites with upright disposal of the dead; Gazelle Peninsula beliefs locating
    the home of the dead at Nakanai, also a place associated with shell-money and
    Ingiet stone images; incision customs and regional resemblances; and material
    objects attributed by the author to the ''kava-people'' in relation to Dukduk
    and Ingiet secret organisations, ancestral cult, and ghost societies.'
  language: English
  quote_policy: summarized
