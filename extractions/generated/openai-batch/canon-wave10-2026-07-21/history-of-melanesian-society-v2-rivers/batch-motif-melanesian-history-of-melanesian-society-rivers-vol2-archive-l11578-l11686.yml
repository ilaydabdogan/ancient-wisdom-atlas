  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: In New Zealand and Easter Island, related forms of the word are said to occur
    with meanings such as bitter; in New Zealand kawa and kawakawa are also applied
    to a pepper used in religious ceremonies and to ceremonies themselves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage reports the generally accepted view that kava was introduced into
    Melanesia from Polynesia, while allowing that in some places Polynesian influence
    may have modified an earlier use.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'Several Melanesian kava names are compared: some are the same as in Polynesia,
    some resemble the Polynesian word, and others are described as unrelated.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The author states that linguistic evidence is confirmed by preparation methods,
    since differing names usually correlate with differing methods, except in Fiji.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: In Pentecost, kava root is grated rather than chewed, and drinkers usually
    arrange in pairs, with one man preparing kava for the other.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Torres Islands, each man makes kava for himself using special small
    cups in a custom-regulated manner.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: In the Banks Islands, small cups are used, and one man chews kava root for
    several others, though the ritual differs from Polynesian practice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: In Tanna, each man chews a piece of kava root, and a boy prepares the liquid
    in a wooden trough; enough is prepared first for three men and then for another
    three using the same root.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: In Eromanga, boys chew the kava root, place the chewed mass in a wooden vessel,
    add water, strain the mixture through coconut fibre, and serve it in coconut shells.
  category: sequence
