  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tikopia is described as using kava ceremonially while betel prevails in everyday
    life.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says there is no evidence at present for the use of kava in the
