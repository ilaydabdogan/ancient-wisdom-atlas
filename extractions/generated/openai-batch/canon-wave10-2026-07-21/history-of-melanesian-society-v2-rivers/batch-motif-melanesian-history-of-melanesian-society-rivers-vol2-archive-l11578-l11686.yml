  quote: ''
  summary: The passage discusses the distribution of kava and betel in Melanesia and
    Polynesia, the uncertainty of a sharp boundary between their regions, linguistic
    evidence for different names of kava, and varied methods of preparing kava in
    several island groups.
  language: English
  quote_policy: summarized
