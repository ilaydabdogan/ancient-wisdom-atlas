canonical_text:
  quote: ''
  summary: The passage analyzes words and artifact distributions for the bow, arrow,
    and canoe in Oceania. It argues that two bow terms, busur and pana, may indicate
    separate bow-bearing migrations, discusses alternative explanations, links the
    bow's non-survival as a Polynesian weapon to sea warfare, and begins an analysis
    of canoe types as markers of different cultural streams.
  language: English
  quote_policy: summarized
