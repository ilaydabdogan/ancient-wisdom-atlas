canonical_text:
  quote: ''
  summary: The passage discusses Santa Cruz, the Reef Islands, Ambrym, and other Melanesian
    places in relation to language history, volcanic geography, and population strata.
    It proposes that aberrant or archaic languages are often found near volcanoes,
    connects volcanoes with beliefs about the home of the dead or an underground Hades,
    contrasts this with the kava-people's supposed afterlife location on earth or
    in the sky, and summarizes a scheme of Austronesian-speaking migration groups.
  language: English
  quote_policy: summarized
