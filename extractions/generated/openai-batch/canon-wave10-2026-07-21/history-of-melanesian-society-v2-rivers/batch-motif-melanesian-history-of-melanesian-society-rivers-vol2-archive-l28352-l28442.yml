canonical_text:
  quote: ''
  summary: The author concludes that Melanesian secret societies may preserve features
    of earlier immigrant culture and that secret cults can serve as records of the
    past. He emphasizes language as important for cultural history while rejecting
    its simple use as a test of physical race. He explains mismatches between language
    and physical character through cultural contact, including a proposed immigrant
    influence on Melanesian language, and argues that cultural elements such as social
    organization, religion, language, technology, art, and material culture must be
    studied together because they develop through mutual influence.
  language: English
  quote_policy: summarized
