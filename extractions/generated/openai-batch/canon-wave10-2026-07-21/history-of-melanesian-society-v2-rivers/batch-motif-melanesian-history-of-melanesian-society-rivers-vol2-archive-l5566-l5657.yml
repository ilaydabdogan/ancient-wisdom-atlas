  quote: ''
  summary: The passage analyzes Melanesian kinship terminology in Eddystone and Vella
    Lavella, arguing that the classification of brothers’ wives and wives’ sisters
    with mothers may reflect an earlier marriage practice involving a man marrying
    his father’s brother’s wife. It compares this with other regional forms and notes
    uncertainty in the exact extension of kinship terms.
