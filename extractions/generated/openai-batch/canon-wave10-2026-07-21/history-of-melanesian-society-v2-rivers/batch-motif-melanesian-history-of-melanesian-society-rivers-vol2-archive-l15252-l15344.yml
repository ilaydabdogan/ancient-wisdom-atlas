canonical_text:
  quote: ''
  summary: The passage argues that immigrant influence, especially that of the kava-people,
    may explain patrilineal succession and inheritance in parts of Melanesia. It focuses
    on trees planted on others’ land passing to children, proposes that introduced
    plants created paternal inheritance claims, and compares death payments to landowners
    with rent-like legal practices. It then discusses Tikopia and Polynesia as comparative
    evidence, while noting uncertainty and possible matrilineal survivals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage proposes that the mixture of two matrilineal peoples could produce
    patrilineal transmission if immigrant men sought recognition of fatherhood and
    distinguished their children from those of the local population.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kava-people are described as possibly derived from a society practising
    mother-right, though the author considers it more probable that they were already
    familiar with patrilineal institutions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Banks and Solomon Islands, trees planted on the land of others pass
    to children even when land passes to sisters’ children.
  category: relationship
  evidence_refs:
