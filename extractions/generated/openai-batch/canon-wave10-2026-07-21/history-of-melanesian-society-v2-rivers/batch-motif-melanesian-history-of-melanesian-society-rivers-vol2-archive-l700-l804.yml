canonical_text:
  quote: ''
  summary: The passage analyzes Melanesian and Polynesian kinship nomenclature. It
    discusses brother-sister terms, especially distinctions by same or different sex;
    the naming of a father's brother, mother's sister, their spouses, and their children;
    and an argument that Melanesian relationship systems may point to an earlier dual
    social organization.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that tasi is used as a collective term for the relationship
    between brothers and sisters, and that a group using brother and sister terms
    for one another is called tamatasi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Saa system of Malaita is described as having only one term for all varieties
    of brother and sister, with Ulawa described as almost equally simple.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Rafurafu system in San Cristoval is said to make distinctions corresponding
    to Polynesian distinctions by using masculine and feminine prefixes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Banks and Torres Islands, the sex-based distinction in sibling terms
    is said to exist, but with a tendency to ignore it; Pentecost is described as
    more constant in the distinction, and Anaiteum as using it little if the author's
    information is correct.
  category: relationship
  evidence_refs:
  - ev:4
