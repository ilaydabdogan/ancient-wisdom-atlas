  quote: ''
  summary: The passage introduces a chapter on sun and moon cults, stone-work, incision,
    and tattooing, then discusses evidence for a sun cult in Melanesian and Polynesian
    contexts. It cites stone representations of the sun, a Tamate Liwoa origin legend
    involving Wetmatliwo, east-west initiation stakes, ray-marked figures and cicatrisation
    designs, sun images in sacred houses, seasonal death-and-rebirth language in Areoi
    and related ceremonies, offerings to sun and moon, and sun motifs in decorative
    art.
  language: English
