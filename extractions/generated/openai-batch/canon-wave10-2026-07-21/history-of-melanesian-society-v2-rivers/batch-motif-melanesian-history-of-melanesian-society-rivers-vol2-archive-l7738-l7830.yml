canonical_text:
  quote: ''
  summary: The passage surveys and theorizes the social functions of the father’s
    sister in several Melanesian island contexts. It describes her possible marriage
    to a nephew, veto or choice of his marriage, respect and obedience owed to her,
    contributions to wife-payment and life events, and removal of a newborn child
    from its mother. It then offers an explanation linking these functions to her
    former status as a potential wife, increasing recognition of father-child relations,
    and obligations between moieties at birth, initiation, and death.
  language: English
  quote_policy: summarized
