  summary: The author argues that features of Melanesian languages, especially vocabulary,
    may have arisen through interaction among peoples and through the development
    of a lingua franca. He proposes that relationship terms, social terminology, and
    magical vocabulary can reflect different immigrant and indigenous linguistic strata,
    depending on cultural influence, interest, and secrecy.
