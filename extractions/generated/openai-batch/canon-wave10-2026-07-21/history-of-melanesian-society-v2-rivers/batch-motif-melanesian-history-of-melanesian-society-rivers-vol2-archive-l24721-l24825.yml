canonical_text:
  quote: ''
  summary: The passage describes Ingiet ritual use of ancestor images and animal representations,
    animal food prohibitions, the division of Ingiet groups into beneficent and malignant
    practices, and the restricted practice of e magit, in which a projected part of
    a man assumes animal or human forms to cause misfortune.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Images of ancestors are said to occur in many Ingiet rites.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one observed ceremony, representations of animals including shark, snake,
    sting-ray, and lizard were cut into the bark of trees around the ceremonial place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The flesh of several animals is temporarily prohibited to initiates, and pig
    flesh is permanently forbidden to all members.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ingiet societies are described as falling into two main groups, one devoted
    to beneficent magic and another producing illness and death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The illness- and death-producing group is said to act on hair, food, excrement,
    or earth from a victim's footsteps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Beneficent ritual is described as counteracting evil ghosts or spirits, while
    malignant practice works through such beings.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The term magit is described as a part of a man that can be projected or ejected
    from himself and assume other forms.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Practice of e magit requires Ingiet membership and a special initiation not
    available to all members.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: During the special initiation, initiates are shown two human-form images in
    a secret hut in the bush.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: One name for the human-form images is mmigulai, a term also used for a bird
    sacred to one of the moieties.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A practitioner projects his magit into another form with the aid of the initiation
    images and names the being into which it is to go.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The magit may enter one of a number of animals or take a new male or female
    human form.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The animal or human form taken by the magit produces misfortune for others;
    entered animals become noxious and human forms are injurious.
  category: action
  evidence_refs:
  - ev:8
