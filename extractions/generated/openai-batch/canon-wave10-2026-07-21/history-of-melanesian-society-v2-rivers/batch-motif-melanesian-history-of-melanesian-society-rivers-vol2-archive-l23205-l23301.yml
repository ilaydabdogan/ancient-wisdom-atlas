  quote: ''
  summary: The passage presents a hypothesis about the origin and persistence of inclusive
    and exclusive first-person plural forms in Melanesian languages. It argues that
    such grammatical distinctions may have arisen, or been socially preserved, through
    contact between indigenous and immigrant peoples, possibly also through rank distinctions
    such as chiefs and commoners. The author compares the presence of the feature
    in Polynesia and southern Melanesia and cautions that it may have been inherited
    from Austronesian rather than independently created in Oceania.
