canonical_text:
  quote: ''
  summary: The passage analyzes how the proportion of women in migrant groups, distance
    traveled, and sea-route conditions affect intermarriage, population fusion or
    separation, and cultural transmission in Melanesian and Oceanic migrations. It
    argues that the kava-people and betelpeople likely arrived with few or no women,
    leading to rapid fusion with indigenous peoples, while long sea journeys and island-to-island
    routes could alter migrant culture and language over generations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When immigrant men bring no women, the passage says they would be forced to
    mate with indigenous women; when they bring few women, some would likely do the
    same unless polyandry allowed separation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If some immigrants marry women from their own group and others marry indigenous
    women, two descendant classes may form; if enough migrant women accompany them,
    two peoples may live side by side with more persistent differences.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states an assumption that the kava-people and betelpeople were
    accompanied by few or none of their own women, which is used to explain rapid
    fusion with indigenous peoples.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies distance from the former home and the geographical
    character of the route as important migration conditions.
  category: setting
  evidence_refs:
