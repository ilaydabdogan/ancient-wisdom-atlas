  summary: The passage argues that increasing recognition of the father-child relationship
    affected Melanesian descent, inheritance, and succession. It presents matrilineal
    descent or mother-right as formerly socially significant, but increasingly reduced
    as inheritance and succession move toward patrilineal forms, while marriage regulation
    remains partly associated with kinship and descent groups.
