  quote: ''
  summary: Rivers proposes an explanatory hypothesis for the origin of the Sukwe and
    Tamate secret societies in Melanesia. He argues that their secrecy may have arisen
    from rites brought by an immigrant male group, performed apart from an aboriginal
    population in a separate house and in secluded bush locations, with awe, possible
    magical fear, and strange noises helping preserve privacy.
