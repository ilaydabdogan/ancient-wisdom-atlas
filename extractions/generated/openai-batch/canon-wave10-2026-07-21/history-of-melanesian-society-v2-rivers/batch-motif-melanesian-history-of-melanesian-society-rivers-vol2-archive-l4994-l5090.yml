  summary: The passage opens a chapter on marriage and discusses Pentecost Island.
    It identifies particular marriage forms, exogamous moiety regulation, infant betrothal,
    ceremonial simulated capture, marriage exchanges involving pigs and property,
    and a conjectural historical scenario in which younger men sought wives despite
    elder male dominance.
