  summary: The passage compares sibling kinship terms across Oceania, especially Polynesia,
    Fiji, the Solomons, Santa Cruz, Banks, Torres, and Pentecost. It argues that terms
    used between same-sex siblings, especially with age distinctions, show wide resemblance
    and distribution, while brother-sister terms are much more diverse. It also notes
    that aberrant elder-sibling terms occur in places where older languages persist
    or might be expected to persist.
