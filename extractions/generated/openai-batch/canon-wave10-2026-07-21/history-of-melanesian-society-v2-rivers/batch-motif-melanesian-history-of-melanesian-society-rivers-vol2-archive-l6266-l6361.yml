canonical_text:
  quote: ''
  summary: The passage compares Melanesian kinship terms and address restrictions
    as evidence for communal or plural implications in marriage-related relationships.
    It discusses Banks Islands, Mota, Pentecost, Rowa, and Torres Islands terminology,
    then describes Torres Islands rules forbidding familiar speech or name-use toward
    a wife’s relatives and treating such speech as evidence of sexual relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Banks Islands term lalagi is described as closely corresponding in connotation
    to Mota mateima and as being used for both the wife of the sister’s son and the
    wife of the mother’s brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that comparison of lalagi and mateima suggests that inferences
    drawn from the Banksian word may probably also hold for Pentecost, while noting
    the need for more comparable systems from the northern New Hebrides.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'In Mota, terms for mother and for husband or wife are described as using
    plural forms: ra is identified as a plural prefix, raveve as mother, and rasoai
    as husband or wife.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Codrington is cited as arguing that the plural prefix ra is more than a dignity
    marker and that its plurality was recognized by the people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rasoai is described as a reciprocal term whose plurality is said by Codrington
    to rest on husband and wife belonging to a composite body of married persons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Pentecost, the word for mother, ratahi, has the same plural prefix and
    is said to mean sisters; Codrington supposes it originally referred to sister
    members of the moiety who are mothers of the children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that the Rowa expression wunu mumdal points strongly to
    a communistic condition, while other nomenclature suggests the probability of
    origin in an ancient condition of sexual communism.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author says that duties and restrictions associated with Melanesian relationship
    terms provide definite evidence for sexual communism, not only in the past but
    at the present time.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Torres Islands, a man must not address any of his wife’s relatives
    by name, must not use cha or ja when speaking to them, and must not talk to them
    familiarly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: If a man is heard addressing his wife’s sister by name or saying cha to her,
    it is concluded that sexual relations have taken place between them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If sexual relations have occurred, the man may no longer use the proper relationship
    term for the woman involved.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The example is given that a man who has had sexual relations with his wife’s
    mother, normally called kwiliga in Loh, must thereafter address and speak of her
    by her personal name until death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author states that the connection between personal-name avoidance and
    potential sexual relations is known to the people who avoid the terms, not merely
    an anthropological hypothesis.
  category: other
  evidence_refs:
  - ev:6
