canonical_text:
  quote: ''
  summary: The passage argues that kava is associated with immigrant-founded secret
    organisations, ancestor-ghost offerings, rank and male restrictions, and Tikopia
    religious ceremonial. It contrasts kava with betel-chewing, proposes hypothetical
    kava-people and betel-people as immigrant groups linked to two substance-use cultures,
    and names a hypothetical indigenous dual people characterized by dual social organization
    and matrilineal descent.
  language: English
  quote_policy: summarized
