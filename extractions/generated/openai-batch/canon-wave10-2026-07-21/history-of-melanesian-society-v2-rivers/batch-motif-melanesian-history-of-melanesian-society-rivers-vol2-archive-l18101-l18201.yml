  summary: The passage argues that naturalistic human and animal designs associated
    with the kava-people were transformed into rectilinear geometric forms through
    contact with earlier populations. It compares Banks Islands art with Polynesian
    and Cook Islands examples, notes fish-derived designs and back-to-back doubled
    human figures, and states that the cultural attribution of the doubled figures
    remains uncertain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author proposes that the art of the kava-people was especially devoted
    to the human figure and other naturalistic motives, while rectilinear forms were
    proper to the art of the dual people, described as an earlier population of Melanesia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Tamate societies, the author reports abundant examples of naturalistic
    representation, especially animals, and notes two Ureparapara pudding-knives decorated
    with designs derived from a fish.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage attributes the prominence of the human figure in Banks Islands
    art to the importance acquired by an immigrant cult of the dead, and connects
    the smaller popularity of animal representations with limited persistence of totemic
    ideas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Polynesian decorative art is usually geometrical and
    rectilinear, while human and animal motives are present in some places but generally
    modified into rectilinear patterns.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mangaia and other Cook Islands are presented as evidence for the conventionalisation
    of the human motive into rectilinear forms, comparable with the process proposed
    for the Banks Islands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author ascribes the conventionalized human design in Polynesia to the
