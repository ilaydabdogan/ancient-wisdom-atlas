canonical_text:
  quote: ''
  summary: The passage discusses the soloi of the Tamate societies in the Banks Islands
    as a prohibition whose consequences depend on human discovery or confession rather
    than direct supernatural action. It contrasts the view of initiated members with
    that of women, children, uninitiated men, and other non-members, who experience
    the societies and their prohibitions as mysterious and connected with ghosts of
    the dead. It argues that the religious character of the societies depends on belief
    in the ghosts' influence or presence, and notes that initiation reveals the supposedly
    mysterious cry of the dead to be mechanically produced, after which the religious
    aspect may decline.
  language: English
  quote_policy: summarized
