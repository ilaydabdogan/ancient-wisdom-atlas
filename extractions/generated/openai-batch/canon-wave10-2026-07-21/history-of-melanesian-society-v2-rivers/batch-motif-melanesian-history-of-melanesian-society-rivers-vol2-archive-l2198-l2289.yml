canonical_text:
  quote: ''
  summary: The passage introduces a chapter on Melanesian gerontocracy and argues
    that anomalous kinship terms and relationship systems in Pentecost, Viti Levu,
    Buin/Bougainville, and other Oceanic cases can be explained through social institutions,
    especially marriage forms. It further compares the reported or traditional Pentecost
    practice of marriage with a brother’s granddaughter to Dieri practices and kinship
    terminology cited from Howitt.
  language: English
  quote_policy: summarized
