canonical_text:
  quote: ''
  summary: The passage surveys Melanesian money forms, including Santa Cruz feather-money,
    shell-money, dog and porpoise teeth, arm-rings, turtle-shell plates, and mats.
    It compares degrees of monetary definiteness, notes possible historical changes
    and substitutions, and relates shell-money to Sukwe and Tamate ritual and to the
    author's kava-people/betel-people population scheme.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Santa Cruz money is described as small red parrot feathers gummed on pigeons'
    feathers, bound together, and kept in coils about fifteen feet long.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Santa Cruz feather-money is said to have no known purpose except representing
    value and serving as a medium of exchange.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Eastern Solomons, shell-money similar to that of the Banks Islands
    is reported, along with dog teeth and porpoise teeth used with variable scales
    of value.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the western Solomon Islands, money is said to consist of arm-rings, including
    large poata made from giant clam shell and valued against smaller rings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage arranges Melanesian money objects along a series from turtle-shell
    raw material with no known units to shell-money and mat-money with numerical scales
    of value.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports evidence of change in the distribution of money varieties,
    including Santa Cruz claims of former shell-money and a suggested former mat-money
    in the Banks Islands.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In two Banks Islands where the sow shell is absent, crude feather-money is
    reported as being used in place of shell-money.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author states that Santa Cruz feather-money may be a substitute for an
    older form, while also noting that several Melanesian areas possess more than
    one kind of money.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shell-money is described as prominent in the ritual of the Sukwe and Tamate
    societies and is assigned by the author to association with the kava-people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Arm-rings and porpoise teeth in the Solomons, together with their absence
