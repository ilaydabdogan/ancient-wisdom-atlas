canonical_text:
  quote: ''
  summary: Rivers introduces a chapter on communism and money in Melanesia. He frames
    property and sexual communism as possibly earlier social conditions, contrasts
    them with individualism, taboo, and money, and surveys regional currency objects
    including mats, shell-disc strings, crimson feather strings, arrows, pigs' jawbones,
    and turtle-shell pieces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that if Melanesia was communistic during the dominance of
    the old men, communism would have to be assigned to the dual people, while movement
    toward individualism would be attributed to immigrant influence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says sexual communism and communism in property were probably closely
    associated and proposes to begin with property communism before reconsidering
    sexual communism.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author presents a scheme in which the kava-people introduced taboo into
    Melanesia, and taboo is described as a means of protecting property, usually individual
    property.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that a thoroughly communistic people would have no internal
    use for money, and that money should be associated with the disappearance of communism.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the northern New Hebrides, currency is described as mats used for no other
    purpose, with value estimated by folds counted in tens; Pentecost has mar aha
    mats and more valuable red bwana mats.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Banks Islands, money is described as strings of shell-discs with definite
    units of value, including the double fathom, and with importance attached to ten
    and multiples of ten.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Santa Maria and Merlav, where the som shells are not found, crimson-dyed
    feathers near fowls' eyes are bound on strings and used as a medium of exchange;
    they are also used as ornaments called wetapup associated with a Sukwe rank.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the Torres Islands, arrows, mats, and pigs' jawbones are used as money,
    though their value scale is not known and arrows also serve as weapons.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: In Vanikolo, pieces of turtle-shell are the only objects identified in the
    passage as money, and they also serve as raw material for ornaments and other
    objects.
  category: object
  evidence_refs:
  - ev:8
