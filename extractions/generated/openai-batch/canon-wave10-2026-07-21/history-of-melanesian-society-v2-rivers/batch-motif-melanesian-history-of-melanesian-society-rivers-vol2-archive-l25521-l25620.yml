canonical_text:
  quote: ''
  summary: 'The passage discusses ritual objects associated with Dukduk and Ingiet
    secret organizations in the Bismarck Archipelago: the wooden slit gong, stone
    representations, conch, masks or head-dresses, fillet, and cycas. It describes
    the gong’s roles in dances, death rites, ghost passage, ancestral imagery, and
    message transmission; the conch’s use in heralding sacred images and excluding
    the uninitiated; possible parallels with other secret ritual objects; and the
    author''s conclusion that these objects indicate a common source for related secret
    organizations.'
  language: English
  quote_policy: summarized
