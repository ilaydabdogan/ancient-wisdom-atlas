canonical_text:
  quote: members of alternate generations are classed together
  summary: The passage compares Pentecost, Dieri, Banks Islands, Viti Levu, and Buin
    kinship systems. It argues that Pentecost classifications of alternate generations
    may reflect an earlier marriage form in which a man married the granddaughter
    of his brother, while another set of anomalies involving contiguous generations
    is linked to marriage with the wife of the mother's brother. The author treats
    Dieri terminology as a close parallel and suggests that kinship terms can preserve
    traces of extinct social institutions. He then extends the comparison to Fijian
    and Buin systems, noting analogous classifications of generations once removed.
  language: English
  quote_policy: quoted
