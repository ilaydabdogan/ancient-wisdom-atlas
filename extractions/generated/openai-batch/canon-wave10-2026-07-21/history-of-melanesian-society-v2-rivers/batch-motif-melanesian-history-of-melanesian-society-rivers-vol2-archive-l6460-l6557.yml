canonical_text:
  quote: ''
  summary: The passage discusses kinship avoidance, the classification of a wife's
    sister as a sister, possible links between avoidance customs and sexual relations,
    and the author's caution that not all avoidance has that origin. It then argues
    that sexual communism in the Torres and Banks Islands may imply or be related
    to community of children, and treats widespread adoption in the Banks Islands
    as a possible relic of such communal child-rights, while noting current explanations
    for adoption and doubting their sufficiency.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Torres Islands, the author describes a transition from addressing a
    wife's sister by personal name to classing her with the sister after sexual relations
    are forbidden.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author cautions that not all avoidance customs should be interpreted as
    originating in sexual communism, since similar avoidance also occurs between persons
    of the same sex.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that avoidance customs involving definite groups of men
    and women imply the possibility of sexual relations between those groups.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the Banks Islands, the author notes a probable connection between avoidance
    customs and hostility between the two moieties of the community.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that customs in the Torres and Banks Islands point to sexual
    communism in the recent past and in some cases at the present time, while leaving
    uncertain whether it was occasional or an ancient organized system.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author says that if sexual communism had been an organized system, community
    of children would also be expected.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Widespread adoption in the Banks Islands is presented as a possible relic
    of community of children, and adoption in Torres Straits is mentioned as an earlier
    comparable suggestion.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Banks Islands, parents are said to have little more right to their
    children than others; the father can secure the child by payment, planting a bough
    of cycas, or arranging first food, but another person may take the child if he
    fails to do so.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The real parents' rights are theoretically recognized through possible recovery
    by payments, but the author says recovery is rarely realized and the advantage
    lies with adopting parents.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Current motives for adoption, such as keeping property in the family or the
    lack of honor for a childless couple, are reported but treated by the author as
    insufficient or possibly recent explanations.
  category: speech
  evidence_refs:
  - ev:8
