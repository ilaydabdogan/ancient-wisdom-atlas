canonical_text:
  quote: ''
  summary: The passage presents an ethnological argument linking mortuary practices
    with population strata in Polynesia and Melanesia. It contrasts preservation of
    the dead, associated in the working hypothesis with later chiefly groups, with
    interment in a sitting position, associated with an earlier stratum and with the
    Melanesian 'dual people.' It considers and qualifies alternative explanations
    involving rank, conservatism, immigration, cultural fusion, and physical differences
    between populations.
  language: English
  quote_policy: summarized
