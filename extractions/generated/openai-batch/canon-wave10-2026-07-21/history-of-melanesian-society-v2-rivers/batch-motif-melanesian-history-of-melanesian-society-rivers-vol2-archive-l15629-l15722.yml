canonical_text:
  quote: ''
  summary: The passage argues that several Melanesian marriage institutions were shaped
    by immigrant influence. It distinguishes marriage forms attributed to the dual
    culture from cross-cousin marriage and marriage with a brother's daughter, explains
    the wider persistence of cross-cousin marriage, suggests a late immigrant-linked
    origin for marriage with the wife of the father's brother, and proposes that payment
    for a wife began as contributions by male immigrants in exchange for indigenous
    women. It further proposes that the prominence of wife payment after community
    fusion depended on whether immigrant groups were absorbed or became socially dominant.
  language: English
  quote_policy: summarized
