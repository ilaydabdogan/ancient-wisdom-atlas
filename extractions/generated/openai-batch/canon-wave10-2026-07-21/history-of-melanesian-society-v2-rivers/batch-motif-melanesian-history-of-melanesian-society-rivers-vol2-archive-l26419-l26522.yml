canonical_text:
  quote: ''
  summary: The passage contrasts the Moanus, Matankor, and Usiai of the Admiralty
    Islands by settlement zone, subsistence, technologies, ritual or practical knowledge,
    social cohesion, and inferred migration history. It links the Moanus with recent
    migration, conquest, head-hunting, and betel-related magic; the Matankor with
    canoe-making, house-building, wooden animal-form vessels, possible earlier migration,
    kava use, and shell-money manufacture; and the Usiai with bush agriculture, small
    independent bands, linguistic diversity, fighting, and subservience to the Moanus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage names three peoples: Moanus, Matankor, and Usiai; it says they
    intermarry and are all described as having totemic social organization, matrilineal
    descent, and exogamy.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Moanus are described as living in houses on the sea and understanding
    canoe navigation, the great fish-net, the moon and stars, and magic involving
    betel and lime.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Matankor are described as understanding the canoe and fish-net, not knowing
    the moon and stars or betel-and-lime magic, and having houses on the shore.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Usiai are described as living in the bush, growing taro and sago, being
    cannibals and snake-eaters, lacking knowledge of canoe, fish-net, moon and stars,
    and having a great variety of speech.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other records are said to describe the Usiai as bush-agriculturalists divided
    into small independent bands, speaking different languages, fighting with one
    another, lacking social cohesion, and being subservient to the Moanus despite
    greater numbers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Moanus are described as relatively recent immigrants who are still conquering
    and displacing other peoples, and as head-hunters.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that the Moanus' association with betel-and-lime magic suggests
    responsibility for introducing betel-chewing, and that their presence probably
    reflects secondary migration from New Guinea influenced by betel-people.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Matankor are described as the most expert canoe-makers, expert house-builders,
    and chief or only makers of wooden vessels in animal form and other objects used
    by the Moanus and themselves.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author says Matankor ignorance of the stars suggests an earlier immigrant
    population that has lost the art of navigation from a great distance.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kava-drinking is said to occur in the Admiralty Islands; the root juice is
    expressed between stones and drunk by men, and Lou, a Matankor seat, is the only
    place where the author says its use is definitely known.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Shell-money is used by all three peoples and is made by women in Sori, another
    Matankor seat.
  category: object
  evidence_refs:
  - ev:7
