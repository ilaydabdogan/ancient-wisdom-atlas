canonical_text:
  quote: ''
  summary: 'The passage discusses Melanesian marriage customs and inferred kinship
    patterns: giving a daughter to a younger brother or sister’s son, a possible marriage
    with the wife of the father’s brother, constraints from descent and moiety systems,
    regional divergence in the western British Solomons, and the relation between
    cross-cousin marriage and dual social organization.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author concludes that in some parts of Melanesia it became customary for
    a man to give his daughter to his younger brother, either instead of or together
    with giving her to his sister’s son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes variation in the Torres Islands, Loh, Hiw, and possibly
    the Shortlands concerning whether daughters were given to the younger brother
    or to the sister’s son.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The systems of Eddystone Island and Vella Lavella are said to show correspondences
    that would follow from marriage with the wife of the father’s brother, although
    the passage says there is no evidence for this marriage elsewhere in Melanesia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: To connect marriage with the wife of the father’s brother to gerontocracy,
    the author says one would have to suppose that wives were given to brothers’ sons
    rather than to sisters’ sons or sons’ sons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a dual system with matrilineal descent, a man and the wife of his father’s
    brother would be in the same moiety, making such a marriage impossible according
    to the passage.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says such a marriage could only have arisen under clan-exogamy
    with patrilineal descent in the dual system, or where there were more than two
    social groups.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the proposed marriage is fitted into the author’s general scheme of Melanesian
    social development, it must be treated as relatively late; alternatively, it may
    come from a different line of social development.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The western islands of the British Solomons are described as peculiar, especially
    because the mother’s brother is said to have no special functions in relation
    to his nephew there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Most anomalous marriage forms described in the book are said to have been
    recorded for the first time and to be unknown or not yet discovered elsewhere
    in the world.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Cross-cousin marriage is described as already well known both in Melanesia
    and elsewhere, while the author’s conclusions about its origin differ from earlier
    views.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The most generally accepted explanation makes cross-cousin marriage a direct
