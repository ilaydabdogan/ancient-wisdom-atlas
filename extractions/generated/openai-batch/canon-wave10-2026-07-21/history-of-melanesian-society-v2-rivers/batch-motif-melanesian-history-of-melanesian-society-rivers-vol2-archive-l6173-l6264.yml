canonical_text:
  quote: the wife of all of us.
  summary: The passage argues from Melanesian kinship nomenclature that certain categories
    of women may have been recognized as potential wives or legitimate sexual partners
    beyond a man's wife or wives. It compares terminology and practices in the Banks
    Islands, Torres Islands, Mota, Pentecost, Merlav, and Rowa, and cautiously interprets
    the cumulative evidence as pointing to limited sexual communism or spouse-sharing
    among particular groups of men and women, especially in the relation between mother's
    brother and sister's son.
  language: English
  quote_policy: quoted
