canonical_text:
  quote: ''
  summary: The passage argues that Melanesian customs of avoidance between relatives
    by marriage may have arisen from marriage between immigrant men and indigenous
    women. It emphasizes the pairing of avoidance with mutual helpfulness, discusses
    special taboos on speech, names, the head, and the back, gives a Pentecost example
    involving brothers-in-law, and connects respect for the head with immigrant ideas
    and with Polynesian chiefly sanctity.
  language: English
  quote_policy: summarized
