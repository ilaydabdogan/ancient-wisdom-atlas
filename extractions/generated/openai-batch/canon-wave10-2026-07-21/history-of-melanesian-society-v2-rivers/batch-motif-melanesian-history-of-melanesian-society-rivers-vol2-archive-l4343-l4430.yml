canonical_text:
  quote: ''
  summary: The passage opens a chapter by defining descent as social-group membership,
    inheritance as property transmission, and succession as transmission of rank or
    office. It limits the discussion of descent chiefly to exogamous social groups
    within tribes or similar communities. It states that, in the surveyed Melanesian
    area, descent is almost universally matrilineal where definite exogamy is organized
    through clans or moieties, while noting patrilineal examples or possible exceptions
    in Santa Cruz, the Lau district of Malaita, and Fiji under an expanded use of
    the term. It then raises the problem of how social-group membership relates to
    kinship, including claims about a man's relation to his father in matrilineal
    areas.
  language: English
  quote_policy: summarized
