  summary: The passage argues that Melanesian customs of avoidance are connected with
    possible sexual relations and social efforts to limit them. It then discusses
    a Lepers’ Island custom in which a man stops laughing when his brother arrives,
    interpreting it cautiously as respect or restraint between brothers. The passage
    also describes the important position of the mother’s brother in several Melanesian
    regions, including respect, privileges, compensation rights, and guardianship.
