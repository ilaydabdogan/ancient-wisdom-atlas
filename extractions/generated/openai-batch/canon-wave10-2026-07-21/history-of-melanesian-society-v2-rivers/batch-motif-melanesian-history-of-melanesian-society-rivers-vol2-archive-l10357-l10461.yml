canonical_text:
  quote: ''
  summary: Rivers argues that an immigrant religious cult was public in the Solomon
    Islands and secret in the Banks Islands. He identifies the Solomon religion chiefly
    as a cult of the dead centered on ghosts, compares this with Banks secret societies,
    and then discusses taboo as a ghost-sanctioned institution used to protect individual
    property, especially through signs or taboo-marks.
  language: English
