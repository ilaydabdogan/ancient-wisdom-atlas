  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Polynesia, two brothers address one another by terms differing according
    to age, and two sisters usually use the same age-based pattern.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Polynesia, a brother and sister use a different mode of address from same-sex
    siblings, either one reciprocal term or two different terms, without an age distinction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says similar sibling distinctions occur among Fiji coastal people,
