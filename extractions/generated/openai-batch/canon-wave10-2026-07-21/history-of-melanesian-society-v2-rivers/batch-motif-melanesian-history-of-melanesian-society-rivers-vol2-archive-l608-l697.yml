canonical_text:
  quote: ''
  summary: The passage compares Oceanic kinship terminology for parents, children,
    brothers, and sisters. It notes differences between Melanesia and Polynesia in
    distinguishing father and mother, son and daughter, and sibling address terms,
    then compares Polynesian sibling terms with usage in Fiji and the Solomons. The
    author states that some features, especially Samoa and Tonga's different terms
    for son depending on whether the father or mother is speaking, cannot yet be assigned
    to a social cause.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that throughout Melanesia father and mother are denoted
    by distinct terms, while some Polynesian systems use a common term for parent
    and add sex-marking words when needed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Melanesia generally has one common term for child,
    with possible subsidiary terms used when sex must be specified.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pentecost is given as an example where the usual term for child is nitu, with
    mala and met used for son and daughter respectively.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Samoa is described as having separate words for son and daughter, including
    two terms for son depending on whether the speaker is the father or mother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tonga is described as using different terms for a son depending on whether
    the speaker is the father or mother, while both parents use the same term for
