canonical_text:
  quote: ''
  summary: The author contrasts his method with Graebner's, arguing that social organization,
    language, and religion cannot be treated like easily introduced material objects.
    He says language and religion can change by known mechanisms, but social structure
    is more deeply seated and changes only with difficulty. He rejects conquest and
    population replacement as the Melanesian case, instead proposing gradual influence
    by small immigrant groups. He characterizes his method as a middle course between
    evolutionary and historical schools, with cultural contact and blending as stimuli
    to human progress.
  language: English
  quote_policy: summarized
