  summary: The passage presents an ethnological argument that Melanesian dual organisation
    may have arisen from interaction between immigrant and aboriginal peoples. It
    proposes mechanisms by which such interaction could have produced gerontocracy,
    monopoly of young women by old men, marriage exchange involving daughters, polyandrous
    unions, and tendencies toward sexual communism.
