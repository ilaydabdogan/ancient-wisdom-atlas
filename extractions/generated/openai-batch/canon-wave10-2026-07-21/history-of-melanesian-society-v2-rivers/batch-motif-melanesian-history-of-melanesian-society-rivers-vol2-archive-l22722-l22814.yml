canonical_text:
  quote: ''
  summary: The passage argues that social and ethnic blending, rather than physical
    isolation alone, explains major linguistic differences in parts of Melanesia.
    It proposes that an earlier Austronesian-speaking immigrant group, identified
    by sitting-position burial, preceded the kava-people and may account for aberrant
    languages such as those of Ambrym and Santa Cruz. Ambrym burial evidence is used
    to support this hypothesis, while Santa Cruz evidence is incomplete. The passage
    also considers why ancient language forms might persist in certain island settings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the greatest linguistic differences among culturally
    similar peoples are not necessarily found where wide seas create physical isolation,
    but can occur where social and ethnic factors create separation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author concludes that the people who interred their dead in a sitting
    position spoke an Austronesian language and entered Melanesia before the kava-people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the kava-people were not the first introducers of
    Austronesian languages into Melanesia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
