canonical_text:
  quote: ''
  summary: 'The passage presents a hypothesis about Pentecost marriage customs: matrilineal
    descent coexists with recognition of father-child ties; a father may have mediated
    between his moiety’s opposition and his son’s marriage by capture or elopement;
    simulated bride capture may have persisted as ceremonial deception or dramatic
    representation; and property given to the bride is interpreted as a possible early
    dowry or reciprocal gift.'
  language: English
  quote_policy: summarized
