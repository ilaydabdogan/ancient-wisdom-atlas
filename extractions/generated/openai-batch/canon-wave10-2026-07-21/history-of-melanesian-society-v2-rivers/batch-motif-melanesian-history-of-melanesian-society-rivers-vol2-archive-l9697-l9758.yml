  summary: 'The passage reviews possible explanations for shared relationship terms
    in Melanesian and Polynesian systems. It presents three alternatives: Polynesian
    influence on Melanesia, Polynesian acquisition from Melanesia during a sojourn,
    or derivation from a third people entering both regions. The author then adopts
    a working assumption that Melanesian society resulted from interaction between
    aboriginal groups and immigrant people, producing social and linguistic changes.'
