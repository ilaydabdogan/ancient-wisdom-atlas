canonical_text:
  quote: ''
  summary: The author argues that several material objects and practices in the Admiralty
    Islands, including a mourning head-fillet, slit-drum, bow, incision, and a subsequent
    seclusion rite, connect the Matankor with the author's proposed kava-people complex.
    The passage then discusses settlement differences among the Matankor, Moanus,
    and Usiai and the difficulty posed by the diffusion of totemism among all three
    peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Matankor are described as the only one of the three peoples who wear a
    shining black head-fillet as a sign of mourning; the author compares it with Banks
    Islands, Tikopia, and Bougainville head-covering practices.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wooden gong or slit-drum is said to be used by all three peoples; the
    author says it is probable, but not expressly stated, that the Matankor make it
    because they make most other wooden objects.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bow and arrow occur in the islands and are now used only in hunting, while
    an old war bow was observed; spears and lances with obsidian points are described
    as the main current weapons.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Incision is identified as a Matankor-associated custom; Parkinson reports
    boys as “beschnitten” in Loniu, Pak, and Tong, and Friederici interprets this
    as incision rather than circumcision.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The incision rite is followed by another rite called kalou, in which boys
    are secluded for nine days after receiving coconuts to eat; the author says it
    is not known whether this is also confined to Matankor places.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author states that several objects and practices he connects with the
    kava-people are either exclusive to the Matankor or occur in Matankor-inhabited
    places, suggesting a distinctive settlement history in the Admiralty Islands.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Totemism is described as diffused through all three peoples; the author expects
    the Matankor to be totemic and treats Moanus and Usiai totemism as problems for
    his general scheme.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The Moanus are said to observe totemic exogamy more strictly than the Matankor,
    and the author considers it more probable that they brought their totemism from
    New Guinea than that they took it from the Matankor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The people of Pak, one of the seats of the Matankor, are reported to claim
    to be originators of the totemic institution.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author says the nature of Usiai totemism is practically unknown and suggests
    it may be a modified form associated with dual organization elsewhere in Melanesia.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author explicitly says that definite conclusions are impossible with present
    knowledge.
  category: other
  evidence_refs:
  - ev:6
