canonical_text:
  quote: ''
  summary: Rivers argues for an ancient Melanesian gerontocracy in which old men formed
    a ruling class, monopolized young women, and directed community conduct. He speculates
    that elder rank may have been marked by initiation into old age, distinguishes
    this model from theories of a primitive single male leader monopolizing women,
    and argues that the assumed society already had elaborate kinship organization.
  language: English
  quote_policy: summarized
