canonical_text:
  quote: ''
  summary: The passage argues that Melanesian totemism is better explained as a product
    of interaction between the immigrant kava-people and indigenous populations than
    as a fully developed institution brought by the kava-people. It compares Melanesia
    with Tikopia, Polynesia proper, Samoa, and Tonga, and introduces the question
    of beliefs and practices that led people or their children to be identified with
    animals or plants.
  language: English
  quote_policy: summarized
