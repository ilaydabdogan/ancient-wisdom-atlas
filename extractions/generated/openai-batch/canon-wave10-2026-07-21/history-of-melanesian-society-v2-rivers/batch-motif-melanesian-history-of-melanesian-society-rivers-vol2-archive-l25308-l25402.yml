  text: In New Britain and Duke of York Island, preservation on platforms is described
    as practiced only for chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A deceased prominent member of the Dukduk society was placed in the sacred
    canoe of the Dukduk, which was hoisted into the air between poles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fights are reported during the funeral procedure, including one in which one
    party tried to prevent another from placing the body on the platform.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After decay, a skull could be preserved for later ceremonial placement on
    a platform, while the remaining bones were buried in the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Gazelle Peninsula, skulls of the dead are often preserved and may be
