canonical_text:
  quote: ''
  summary: 'The passage describes several mortuary practices in New Britain, Duke
    of York Island, the Gazelle Peninsula, and New Ireland: preservation of chiefs
    on raised platforms or in canoes, fights over placing bodies on platforms, later
    preservation of skulls and burial of bones in houses, skulls used for masks, water-associated
    ghost places called paga, and upright burial or sea disposal connected by the
    author with sun-cult societies and a proposed later migration.'
  language: English
  quote_policy: summarized
