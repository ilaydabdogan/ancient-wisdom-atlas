canonical_text:
  quote: ''
  summary: 'The passage discusses co-existing Melanesian beliefs about generation:
    recognition of physiological procreation alongside beliefs that conception can
    occur by other means, including a Solomon Islands belief that a virgin can become
    pregnant through breaking a taboo. It then argues that hereditary chieftainship
    and father-to-son succession in northern Melanesia likely reflect immigrant influence,
    contrasting this with earlier gerontocratic forms of authority and considering
    possible origins of chiefs in immigrant groups, with examples from Fiji.'
  language: English
  quote_policy: summarized
