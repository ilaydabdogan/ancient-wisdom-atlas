canonical_text:
  quote: ''
  summary: The passage argues that present Melanesian social relations with a father
    and paternal relatives are nearly as close as those with maternal or same-group
    relatives, and that this is not merely a recent effect of European influence.
    It uses relationship classifications and preserved pedigrees as evidence for the
    older social significance of paternal ties. It also describes traditions of former
    hostility between Banks Islands moieties, including danger in entering the house
    section of the other veve, and interprets this as evidence that father-child relations
    were once more restricted because father and child belonged to different moieties.
    The passage concludes that cross-group social freedom and recognition of paternal
    kin have increased, while descent still retains importance, especially in relation
    to marriage regulation.
  language: English
  quote_policy: summarized
