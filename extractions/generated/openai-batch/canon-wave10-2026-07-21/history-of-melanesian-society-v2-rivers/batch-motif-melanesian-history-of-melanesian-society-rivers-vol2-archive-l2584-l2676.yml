canonical_text:
  quote: ''
  summary: 'The passage compares Fijian and Buin kinship terminologies, arguing that
    several relationship-name correspondences follow from specific marriage patterns:
    marriage with the wife of the father’s father, cross-cousin marriage, and permitted
    sexual relations with certain affinal relatives. It discusses age-ranked sibling
    terms in Buin and their extension to the father’s mother, wife’s sister, sister’s
    husband, husband’s brother, and brother’s wife.'
  language: English
  quote_policy: summarized
