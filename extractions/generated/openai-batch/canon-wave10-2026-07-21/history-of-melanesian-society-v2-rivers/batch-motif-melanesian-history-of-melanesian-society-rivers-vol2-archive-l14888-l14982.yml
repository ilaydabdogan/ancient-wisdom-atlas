  summary: The passage argues that diversity in Melanesian relationship terms may
    reflect multiple immigrant influences, but that betel-people probably caused only
    limited or simplifying changes. It discusses kinship terms possibly shared by
    kava- and betel-peoples, then argues that dominance by old men preceded the arrival
    of the kava-people and that several unusual marriage forms were indigenous survivals
    rather than immigrant introductions.
