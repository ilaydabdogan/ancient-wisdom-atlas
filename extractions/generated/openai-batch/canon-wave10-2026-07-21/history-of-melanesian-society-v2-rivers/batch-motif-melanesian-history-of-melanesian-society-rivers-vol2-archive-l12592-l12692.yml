- id: obs:3
  text: The author states that Melanesian modes of disposal of the dead are numerous
    and diverse, despite an expectation that they might reduce to a limited number
    of cultural forms.
  category: other
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: In the Banks Islands, inhumation is described as the most general method,
    with other methods including cave burial, preservation in chests or houses, and
    drying a body on a mat between two fires.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Vanua Lava, a dead man's body is laid in his canoe on trestles in the house
    with a fire beneath; later observances include a fifth-day head rite and eventual
    wrapping and interment of bones.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In Ureparapara, a dead man's body is tied upright beside a path.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the Torres Islands, interment is now frequent, but bodies were formerly
    laid on stages near houses, and the head is temporarily removed on the tenth day
    after death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In northern New Hebrides, inhumation is practiced, and in Pentecost the body
    may be placed in a sitting posture during funeral ceremonies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In Malikolo and Espiritu Santo, the passage describes interment, platform
