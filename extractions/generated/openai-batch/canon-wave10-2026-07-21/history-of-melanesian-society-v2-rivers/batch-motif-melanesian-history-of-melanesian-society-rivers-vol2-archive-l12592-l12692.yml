canonical_text:
  quote: ''
  summary: The passage defines mortuary terminology and introduces a comparative survey
    of disposal of the dead in Melanesia and Polynesia. It links mortuary treatment
    with beliefs about death and afterlife, notes the diversity of practices, and
    describes examples including inhumation, cave burial, preservation in chests or
    houses, drying by fire or sun, canoe placement, timed head or bone treatment,
    upright pathside placement, stage or platform exposure, and chiefly skull preservation.
  language: English
  quote_policy: summarized
