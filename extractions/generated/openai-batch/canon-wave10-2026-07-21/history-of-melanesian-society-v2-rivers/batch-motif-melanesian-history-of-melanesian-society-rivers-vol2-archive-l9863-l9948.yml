  summary: The passage analyzes the relation between the Sukwe and Tamate institutions
    in Mota and the Banks Islands, emphasizing rank, initiation, secrecy, gender exclusion,
    hidden bush lodges, society sounds, death symbolism in Tamate initiation, and
    the role of Tamate membership in protecting property.
