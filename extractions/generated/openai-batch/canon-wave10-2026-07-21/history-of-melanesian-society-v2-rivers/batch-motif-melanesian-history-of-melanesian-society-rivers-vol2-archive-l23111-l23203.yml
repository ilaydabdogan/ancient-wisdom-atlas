canonical_text:
  quote: ''
  summary: The passage argues that vocabulary can sometimes help analyze Melanesian
    culture-mixture, but only cautiously and in combination with other evidence. It
    discusses how immigrant groups may name unfamiliar animals or plants through resemblance,
    substitution, or onomatopoeia; proposes criteria for assigning words to betel-people,
    kava-people, or earlier Austronesian immigrants; and compares widely distributed
    Oceanic terms such as mana and tapu with less clearly related or more semantically
    variable words such as oloolo, vui, and rongo.
  language: English
  quote_policy: summarized
