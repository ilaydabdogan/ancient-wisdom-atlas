canonical_text:
  quote: ''
  summary: The passage argues that a central feature of Melanesian totemism is an
    identification of humans with animals or plants, especially in accounts of totemic
    ancestors who are spoken of as both human and animal without a definite moment
    of transformation. It considers whether this idea belonged to the immigrant kava-people
    or arose through interaction with indigenous populations, and contrasts Melanesian
    identity beliefs with Tikopia accounts in which totemic ancestors are said to
    have changed into animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Melanesian speaker may refer to a totemic ancestor at one moment as human
    and at another moment as animal.
  category: speech
  evidence_refs:
