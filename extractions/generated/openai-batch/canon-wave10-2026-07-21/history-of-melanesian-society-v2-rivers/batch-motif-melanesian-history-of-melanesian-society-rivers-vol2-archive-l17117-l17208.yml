- id: obs:2
  text: The passage states that attempts to identify a moment or process of change
    in such narratives fail because the figure is treated throughout as both human
    and animal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists current examples of relations between human beings and animals
    or plants, including the Banks Islands tamaniu, an animal influencing a person's
    mother, and the shark-man in Pentecost.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the proposed starting-point of Melanesian totemism is an
    idea of identity with animals or plants associated with the kava-people and their
    descendants.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage argues that if immigrant kava-people held such identity beliefs,
    the animals or plants would have belonged to their ancient home, creating difficulties
    for explaining Melanesian totemism.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage proposes that either kava-people practices impressed the idea
