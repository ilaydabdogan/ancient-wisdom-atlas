  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage contrasts Tikopia beliefs, saying Tikopia totemic ancestors are
    described as changing into animals rather than as being both human and animal
    at the same time.
  category: relationship
  evidence_refs:
  - ev:7
