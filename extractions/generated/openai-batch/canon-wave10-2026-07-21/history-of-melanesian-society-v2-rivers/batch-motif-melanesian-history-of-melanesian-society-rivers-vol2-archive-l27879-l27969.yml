canonical_text:
  quote: ''
  summary: The passage discusses the physical character of a hypothesized dual people
    in Melanesia, possible pre-dual populations, and the need to coordinate the author's
    historical scheme with somatological evidence. It then compares the author's scheme
    with linguistic and migration schemes by Friederici and Churchill, especially
    possible two-part correspondences among migration currents, sitting-interment
    people, kava-people, Proto-Samoans, and Tonga-fiti. The passage ends by proposing
    that a pidgin Indonesian origin for Polynesian language might explain differences
    between Polynesian and Indonesian languages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the physical character of the dual people is a difficult
