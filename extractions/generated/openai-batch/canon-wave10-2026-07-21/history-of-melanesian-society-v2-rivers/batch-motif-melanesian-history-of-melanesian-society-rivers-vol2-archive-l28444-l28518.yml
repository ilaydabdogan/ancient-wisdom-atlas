  summary: The author concludes that contact and interaction among peoples have been
    central to the formation of Melanesian social institutions and wider human culture,
    while also acknowledging psychological motives and possible universal human ideas.
    A Tongan example concerns the tuitonga, whose exemption from incision, tattooing,
    and blood-shedding mourning practices may be related to sacred status and/or cultural
    influence.
