canonical_text:
  quote: ''
  summary: The passage discusses kinship nomenclature in Melanesia and Polynesia,
    especially Buin usage of sibling terms for affinal relatives, Melanesian avoidance
    of personal names for close relatives, contrasting Samoan use of personal names,
    and descriptive relationship terms in Samoa and Fiji.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that classing brothers- and sisters-in-law with brothers
    and sisters may arise in a way that does not necessarily imply prohibition of
    sexual relations.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: In the Buin system of Bougainville, terms regularly used between people of
    the same sex, when applied to a brother or sister, are also regularly used between
    people of opposite sex when applied to a brother-in-law or sister-in-law.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Buin men call their wives’ sisters or brothers’ wives by terms such as mamai
    and rorokei, which are otherwise used by women for their sisters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Buin women apply tditanu and roromoru to their sisters’ husbands or husbands’
    brothers; these terms are otherwise used between brothers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that there is no objection to sexual relations with a woman
    called rorokei or mamai.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author proposes that these affinal usages may have developed by substituting
    spouse-familiar sibling terms for personal names or for terms used for a consort.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says that in Melanesia, when a suitable relationship term exists,
    it is probably wrong to use the personal name, especially for father, mother,
    son, daughter, brother, and sister.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that use of a personal name in Melanesia either has definite
    social meaning or implies the absence or distant character of relationship.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The author reports hearing a little girl in Samoa address her father by his
    personal name, a practice described as especially strange after experience on
    a Melanesian island.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage links the freer use of personal names in Polynesia with a paucity
    of relationship nomenclature, but interprets this as an effect of the relative
    unimportance of relationship due to absent social functions rather than as the
    primary cause.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Descriptive terms of relationship are defined as terms in which relationship
    is expressed through combinations of certain primary terms; the passage says they
    occur in Samoa, Fiji, Santa Cruz, and occasionally elsewhere.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Samoa, the passage says people may denote relationship either by terms
    of a much simplified classificatory system or by descriptive terms, often elaborate.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: The Samoan classificatory system is described as poor in terms and of little
    practical use outside brothers, sisters, parents, and children.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: In Fiji, ngandinanggu is described as a term for the mother’s brother and
    sometimes the father of the consort; it is interpreted as a descriptive term derived
    from nganeitinanggu, with related abbreviations in Narambula and Tavua.
  category: speech
  evidence_refs:
  - ev:7
