canonical_text:
  quote: ''
  summary: The passage summarizes Gazelle Peninsula traditions in which dual moieties
    are linked to light and dark coconuts transformed into differently colored women,
    whose descendants form opposed moieties. It reports an exogamous light-dark marriage
    pattern, a variant with crushed-nosed women from the dark coconut, and Rivers's
    interpretation that such myths preserve memories of fusion between light-colored
    immigrants and darker aboriginal populations.
  language: English
  quote_policy: summarized
