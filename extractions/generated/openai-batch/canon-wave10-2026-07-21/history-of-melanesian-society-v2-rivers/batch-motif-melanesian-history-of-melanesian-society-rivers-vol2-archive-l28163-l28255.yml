canonical_text:
  quote: ''
  summary: Rivers concludes by identifying predicted future evidence and varying degrees
    of certainty within his reconstruction of Melanesian cultural history. He discusses
    kinship patterns, sitting interment, patrilineal and matrilineal institutions,
    immigrant secret cults, chieftainship, dual organisation, uncertain elements such
    as the round house and tattooing, curvilinear art, and a possible cult of trees
    connected with tree-totemism and wider regional cultural influence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author predicts that marriage with the granddaughter of a brother, or
    traces of it in relationship systems, may be found in the central New Hebrides
    and northern Bougainville.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author expects future excavations to show that interment in a sitting
    position was once widely diffused in Melanesia, including possibly at localities
    connected with the Banks Islands vui.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that his scheme is provisional and may require major alteration
    or detailed modification as more facts are collected.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author identifies as essential to his scheme the substitution of patrilineal
    for matrilineal institutions, the immigrant character of secret cults, and the
    relative lateness of chieftainship.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author treats the communism of earlier inhabitants and the priority of
    sitting interment over preservation and extended-position interment as less essential
    but still important to his scheme.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author presents the exclusive assignment of totemism to the kava-people,
    the withholding of the men's house from the dual people, and the origin of incision
    through interaction between the kava-people and earlier inhabitants as less secure
    features.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author says that the dual organisation may have originated through fusion
    of two peoples, but his broader scheme could still stand if the dual system resulted
    from fission instead.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author leaves the cultural connections of the round house and tattooing
    in almost complete uncertainty, while noting a possible connection between the
    round house and people who interred their dead sitting.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The author notes that the connection of the round house with chiefs in New
    Caledonia could indicate a different culture that left few traces in the Melanesian
    region chiefly discussed in the book.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author says curvilinear art suggests the presence of another culture in
    the Bismarck Archipelago and tentatively attributes it to influence from New Guinea.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The author has not assigned the cult of trees to any of the peoples he supposes
    entered Melanesia, citing little evidence in the Oceania regions chiefly considered
    in the volume.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: The author states that there is definite evidence for ancient sanctity of
    trees in the Western Solomon Islands.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The author suggests that people connected with the tree cult may have been
    responsible for tree-totemism occurring in parts of Melanesia.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The author suggests that the cult of trees, the round house, and curvilinear
    art may be parts of a culture with pronounced effects in New Guinea, New Caledonia,
