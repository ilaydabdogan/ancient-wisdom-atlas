canonical_text:
  quote: ''
  summary: The passage introduces decorative art in the Banks Islands, especially
    art connected with secret organisations and the author’s kava-people scheme. It
    discusses the conventionalisation of naturalistic human designs into geometrical,
    largely rectilinear patterns, focusing on the lozenge form representing the face
    of a tamate and the figure of Tamate Viov. It contrasts angular Banks Islands
    forms with curvilinear developments elsewhere and proposes that interaction between
    peoples and artistic traditions may explain the change from human figure to rectilinear
    pattern.
  language: English
  quote_policy: summarized
