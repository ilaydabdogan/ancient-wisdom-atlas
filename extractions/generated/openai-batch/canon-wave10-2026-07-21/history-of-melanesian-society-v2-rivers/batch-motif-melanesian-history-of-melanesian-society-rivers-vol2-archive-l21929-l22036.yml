canonical_text:
  quote: ''
  summary: The passage surveys Melanesian conch-shells, gongs or slit-drums, and domestic
    animals as elements of material and ritual culture. It compares their distribution
    and ritual uses across Melanesia and Polynesia, notes stories in which vui fear
    the sounds of gong and conch, and discusses pigs, pig jawbones, dog teeth, and
    dogs in initiation, currency, and totemic contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The conch-shell is described as existing in two forms in Melanesia: one blown
    through a circular side-hole and one blown at the end.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The side-blown conch is said to be used in the Sukwe, in most parts of Melanesia,
    and generally in Polynesia; the passage also associates it with chiefs and with
    chiefs' funerals in Malikolo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Solomons, the conch is described as important in connection with head-hunting
    and as a signal in ceremonies accompanying return from a successful expedition.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The end-blown conch-shell is said to be known in Melanesia only at Efate,
    where it is associated with a special form of totemism.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gong or slit-drum is described as an instrument of bamboo or hollowed
    wood sounded by beating against a slit, distinct from a membrane-drum.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The gong is described as widely distributed in Polynesia and southern Melanesia,
    present in the matrilineal region of the Solomons, and absent from the more western
    Solomon Islands.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The upright human figures called demit in Malikolo and other islands are described
    as having a longitudinal slit in the body and being used in the same way as gongs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Motlav story is reported in which a vui is afraid of the sound of a gong,
    and Merambuto, a vui of Lepers' Island, is reported as not knowing and dreading
    the sound of a conch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The pig is described as prominent in the ritual of secret organisations; a
    pig's jawbone is said to be used as money in the Torres Islands and to be prominent
    in a dance connected with initiation into a higher Sukwe rank.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The pig is also said to have an important place in the ritual of initiation
    into the Areoi societies of Polynesia.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dog's teeth are described as used as money in Florida and Ysabel; the dog
    is also described as a totem in Santa Cruz and Fiji and as present in Polynesia.
  category: relationship
  evidence_refs:
  - ev:9
