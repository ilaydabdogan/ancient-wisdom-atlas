canonical_text:
  quote: ''
  summary: Rivers argues that dominance by old men could have produced and sustained
    anomalous marriage systems, especially marriage with a brother’s granddaughter
    and other marriages between persons separated by two generations. He uses this
    to explain large age disparities in kinship address terms. He then compares evidence
    from Santa Cruz, Ysabel, Nggao, Bugotu, Tikopia, the Reef Islands, and Buin, focusing
    on descriptive kin terms and the term kave as possible traces of earlier alternate-generation
    marriage practices.
  language: English
  quote_policy: summarized
