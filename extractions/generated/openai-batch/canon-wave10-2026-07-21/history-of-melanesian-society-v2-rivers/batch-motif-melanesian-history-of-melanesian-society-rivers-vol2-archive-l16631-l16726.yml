canonical_text:
  quote: ''
  summary: The passage discusses possible totemic features in Melanesian social groupings
    and relates them to immigrant settlements, dual organization, and descent systems.
    It compares several group-origin accounts, including accounts involving a grass-clan
    and a bird giving birth to a girl, then surveys totemism and matrilineal or patrilineal
    descent in the Banks Islands, New Hebrides, Santa Cruz, Vanikolo, Reef Islands,
    and the Solomon Islands.
  language: English
  quote_policy: summarized
