canonical_text:
  quote: ''
  summary: The author presents a historical-linguistic scheme for Melanesian and Polynesian
    languages. He attributes Melanesian linguistic diversity to admixture with aboriginal
    tongues and later isolation, and attributes much linguistic uniformity to the
    kava-people, aided by secret organisations. He contrasts this with Polynesia,
    where existing uniformity and distance between islands made the kava-people less
    influential. He then frames Oceanic language history as mixture among peoples
    with different speech and proposes methods for assigning shared or diverse features
    to different population sources.
  language: English
  quote_policy: summarized
