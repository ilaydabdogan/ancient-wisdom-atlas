canonical_text:
  quote: ''
  summary: The passage describes avoidance and naming restrictions around Tamate society
    namesakes and objects, compares animal masks, plant badges, and use restrictions
    with totemism, proposes that secret societies may have developed from immigrant
    totemic clans, acknowledges the gap between these customs and full totemism, and
    gives a Kwat example in which a wumeto bowl was replaced by a model boat.
  language: English
  quote_policy: summarized
