  quote: kava is offered to the dead with the accompaniment of prayer
  summary: The passage compares kava preparation in Polynesia, Fiji, and parts of
    Melanesia. It describes communal preparation and distribution in Polynesia and
    Fiji, more individual methods in Torres, Pentecost, Banks, and related islands,
