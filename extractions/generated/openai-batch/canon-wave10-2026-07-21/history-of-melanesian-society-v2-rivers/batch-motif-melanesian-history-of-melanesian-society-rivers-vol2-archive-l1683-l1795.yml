canonical_text:
  quote: ''
  summary: The passage surveys special Oceanic and Melanesian kinship terms used between
    affinal relatives, especially parents or grandparents of a married couple, and
    discusses their association with mutual help, avoidance, personal-name restrictions,
    sexual implications, and marriage eligibility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'In Anaiteum and Tanna, the systems are described as exactly comparable with
    Tonga: one term is used between brothers-in-law, another between sisters-in-law,
    and different-sex affines address one another as husband and wife.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Hawaiian Islands, puluna is used between the parents of a man and the
    parents of the man’s wife; the author reports no corresponding term elsewhere
    in Polynesia from his inquiries.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Mota, the parents of a husband and wife call one another gasala; Codrington
    records that those who call one another gasala may not name one another.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Mota term gasala is presented as perhaps derived from sala, meaning a
    path, and Codrington suggests the translation “fellow-wayfarers.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Loh in the Torres Islands, tukwutog is used between the grandfathers and
    retukwu between the grandmothers of a married couple; the users must help one
    another.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: For the Loh terms, the author states that he did not learn of avoidance customs,
    but considers them probable and also considers it probable that the relatives
    may not use one another’s personal names.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Santa Cruz, malaki denotes the father of a son’s wife and songe denotes
    the mother of a son’s wife; the author thinks the terms are probably reciprocal.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Saa in Malaita, parents of a married couple are aharo to one another, but
    aharo is also applied generally to relatives by marriage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that, in Mota and the Torres Islands, terms in this category
    are associated with mutual helpfulness or restrictions on the use of the personal
    name.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that special relationship terms are often used where the
    personal name is prohibited, and suggests a causal connection between special
    designations and personal-name prohibitions.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: In parts of Melanesia, especially the Torres Islands, using personal names
    between certain men and women has definite social significance; a Torres Islander
    addressing certain female relatives by name is said to be known to have had sexual
    relations with them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Torres Islands, a woman calls her husband’s elder brother by his personal
    name while her husband is alive; after the husband dies, the elder brother becomes
    eligible as a husband and must be addressed by a relationship term instead.
  category: sequence
  evidence_refs:
  - ev:10
