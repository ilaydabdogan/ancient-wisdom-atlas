canonical_text:
  quote: ''
  summary: The passage classifies mortuary practices in Oceania, especially Melanesia
    and Polynesia, contrasting preservation of bodies or skulls above ground with
    inhumation. It argues that keeping bodies in houses, on platforms, in house-like
    structures, or preserving skulls in shrines expresses a belief that the dead should
    remain among the living. It also discusses inhumation by body position, noting
    contracted or sitting postures in several areas.
