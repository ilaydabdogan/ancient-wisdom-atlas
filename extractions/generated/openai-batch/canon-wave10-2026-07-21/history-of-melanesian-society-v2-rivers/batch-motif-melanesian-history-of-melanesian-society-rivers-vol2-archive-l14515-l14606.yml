canonical_text:
  quote: ''
  summary: The passage argues that Melanesian secret societies are associated with
    small islands because small-island conditions encouraged secluded ritual practice
    by immigrant kava-people. It then extends the island-size analysis to the distinction
    between coast-people and interior or bush-people, which is described as strongest
    in larger islands, especially parts of the Solomons, Malaita, San Cristoval, and
    Viti Levu in Fiji.
  language: English
  quote_policy: summarized
