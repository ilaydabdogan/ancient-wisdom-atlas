  summary: The passage introduces a chapter on religion and magic, defines religion
    as practices believed to relate humans to higher powers through appeal and propitiation,
    contrasts this with magic as rites believed effective without appeal, and compares
    Tikopia rites involving direct appeal to atua with Banks Islands rites described
    as complicated practices carried out to produce effects without evidence of appeal
    to higher powers.
