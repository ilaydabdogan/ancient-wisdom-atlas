canonical_text:
  quote: ''
  summary: The passage interprets the Ingiet and Dukduk secret organizations of the
    Bismarck Archipelago in relation to southern Melanesian societies. It discusses
    Ingiet magic as a social and political instrument, animal-associated ritual forms,
    protective counter-magic, the annual Kinao tower ceremony involving boys' initiation
    and wooden sea-eagle images, possible parallels with Polynesian and Fijian ceremonial
    structures, and the gendered relation of tubuan and dukduk in which tubuan is
    believed to give birth annually to dukduk.
  language: English
  quote_policy: summarized
