canonical_text:
  quote: ''
  summary: The passage compares Melanesian and Polynesian systems of terminology for
    brothers- and sisters-in-law and related affinal categories. It discusses Fiji,
    the Solomon Islands, southern Melanesia including the Banks group and Vanua Lava,
    and the Torres Islands, emphasizing links between naming, cross-cousin marriage,
    potential marital or sexual relations, and rules of avoidance or conduct.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mbau and Rewa systems of Fiji distinguish terms according to whether the
    pair are two men, two women, or a man and a woman; Mbau aligns these with cross-cousin
    categories, and Rewa uses for different-sex persons a term otherwise used between
    husband and wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Interior Fijian systems include special terms such as ndaku or vitambui for
    the reciprocal relationship of husband's brother and brother's wife, with some
    complexities left unresolved by the author.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the western Solomon Islands, Eddystone and Vella Lavella have terms used
    between same-sex in-laws, while different-sex usage includes calling an elder
    brother's wife by the same name as mother and the husband's younger brother by
    the same term as child.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports additional Eddystone and Vella Lavella usages in which
    certain brothers' wives, wives' sisters, and wife's elder or younger sisters are
    classified with parent-in-law, mother, or child categories.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Most fully recorded Eastern Solomon systems class all kinds of brother- and
    sister-in-law together, with Savo noted as an exception using separate terms for
    most affines and for husband's brother/brother's wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author states that in the preceding cases there are few special conduct
    regulations, while Polynesia had permitted marital relations between persons using
    husband-and-wife terms until comparatively recent times.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The author states that Fijian naming of brothers- and sisters-in-law is the
    direct outcome of cross-cousin marriage and that Eddystone's lack of distinctions
    is associated with lack of special conduct regulations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In southern Melanesia, especially the Banks group, elaborate rules of avoidance
    are associated with complex designation; Mota examples distinguish same-sex terms
    and different-sex terms.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: For Mota, the passage says mateima denotes a potential wife and welag a potential
    husband; for Rowa and Merlav, address by personal name is said to imply possible
    sexual or marital relations.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the Pek system of Vanua Lava, a man calls his wife's sister and brother's
    wife by the term used for his wife, and these women call him husband, which the
    author compares to Polynesia.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author concludes that the variety of these modes of address suggests actual
    or recently existing relations rather than barren survivals.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: 'In the Torres Islands, conditions are described as much like those in the
    Banks group: same-sex affines use certain terms, different-sex affines use personal
    names or brother/sister terms, and conduct regulations are well defined.'
  category: relationship
  evidence_refs:
  - ev:10
