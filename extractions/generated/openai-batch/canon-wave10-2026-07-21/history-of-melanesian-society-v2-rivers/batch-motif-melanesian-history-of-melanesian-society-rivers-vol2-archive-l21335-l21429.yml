  quote: ''
  summary: The passage discusses the bow and arrow in Polynesia and Melanesia as weapon,
    sacred sport, ritual object, and possible cultural survival. It describes Tahitian
    sacred archery restricted to chiefs, the bow's weapon use in Samoa, Tonga, and
    Tikopia, variant bow forms in the northern New Hebrides, and a Mota ceremony in
    which maternal uncles shoot at a newborn child.
  language: English
