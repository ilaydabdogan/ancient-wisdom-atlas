  quote: chiefs of the Nandrau are descended from four brothers who landed in Viti
    Levu Bay
  summary: The passage reports a Nandrau tradition in which four brothers landed at
    Viti Levu Bay, went to Nandrau, and became chiefs. Rivers uses this as evidence
    for a proposed immigrant origin of chieftainship in part of Fiji, while warning
    against overgeneralizing. The passage then discusses Melanesian marriage institutions,
    including sexual communism, dominance by old men, indigenous forms of marriage
    with relatives, cross-cousin marriage, recognition of father-child relations,
    and possible immigrant influence on certain marriage forms.
