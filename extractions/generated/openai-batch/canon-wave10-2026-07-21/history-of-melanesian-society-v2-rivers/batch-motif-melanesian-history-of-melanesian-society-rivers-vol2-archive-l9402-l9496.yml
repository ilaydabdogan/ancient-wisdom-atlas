  summary: The passage compares Fijian and Malaitan kinship terminology. It argues
    that widely distributed Melanesian relationship terms tend to use one grammatical
    possessive or pronoun form, while locally restricted terms use another. The author
    treats this alignment between vocabulary distribution and grammar as evidence
    for two cultural strata, later-comer groups, and progressive cultural influence.
    The passage ends by introducing collective forms of relationship terms in Fiji.
  language: English
