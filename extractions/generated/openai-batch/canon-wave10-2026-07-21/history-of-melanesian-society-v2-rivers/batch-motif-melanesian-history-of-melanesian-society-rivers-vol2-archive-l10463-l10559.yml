canonical_text:
  quote: ''
  summary: The passage argues that Tamate secret societies in the Banks Islands may
    have embodied taboo, a cult of the dead, and elements of totemism that are public
    social or religious institutions elsewhere in Melanesia. It connects secret-society
    power with enforcement of individual property and notes animal masks, animal-named
    sub-societies, and a Tamate pepe fish custom as possible traces of totemic organization.
  language: English
  quote_policy: summarized
