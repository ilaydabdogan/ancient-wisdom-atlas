canonical_text:
  quote: "“true possessive pronouns of Melanesia were introduced by the kava-people”"
  summary: The passage argues that Melanesian possessive forms reflect successive
    migrations. It attributes possessive nouns to an earlier Austronesian or sitting-interment
    stratum and true or suffixed possessive pronouns to the kava-people. It then explains
    the use of these pronouns with relationship terms, close possession, and body-part
    terms through hypothesized shifts toward individual relations, individual ownership,
    and increased social interest in body parts, especially the head and human bodily
    forms in art.
  language: English
  quote_policy: quoted
