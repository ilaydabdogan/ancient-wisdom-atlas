canonical_text:
  quote: ''
  summary: The passage describes Baining ceremonies, death rites, beliefs about the
    dead and a snake-like spirit, and the author's comparative uncertainty about the
    origin of Baining dances. It then describes Siara totemic clans, marriage restrictions,
    bodily marks attributed to totems, chieftainship, mortuary treatment of bodies,
    skulls and arm-bones, ghostly aid through a spear, and mask ceremonies whose former
    connection with the dead is conjectured.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ceremony uses enormous objects, possibly up to 45 metres long, held over
    the heads of chief actors; participants fast for several days beforehand; a wooden
    gong is prominent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Father Rascher is reported as believing that the ceremony's object was to
    commemorate the dead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Baining death-rites, a body is laid in the ground; it may be covered with
    earth or the grave may be left open, and the passage says the people are indifferent
    if dogs or swine devour the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Baining are described as having no belief in a special place to which
    the dead go after death; the dead are believed to be among the living and are
    not feared.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The only being feared by the Baining is described as a snake-like spirit whose
    children live in gnarled trees and are harmful to people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author states that Baining dances resemble those connected with Melanesian
    secret organisations, but also states that knowledge is too imperfect to decide
    their exact route of transmission.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Siara people are described as forming exogamous totemic clans with matrilineal
    descent; listed totems include several birds, dog, and pig; these animals are
    not especially honoured and may be eaten.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Siara marriage is regulated by clan rules that restrict a man of a given clan
    to one or more specific clans, and payment for a wife accompanies this regulation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Members of different Siara totems are believed to be distinguishable by physical
    characteristics or movement patterns, such as which foot begins walking or particular
    leg features.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The chieftainship of the Siara region is described as more definite than in
    the dual region.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: After death in Siara, the body is first placed on a platform in the house,
    then buried without earth covering and with a wooden roof over the grave; later
    the skull is removed, used in a ceremony, and buried again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The arm-bones of a deceased Siara person are removed and kept to form part
    of a special spear used only by relatives, who believe it brings the deceased
    ghost's help in battle.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Siara people perform ceremonies using masks; these are said not to be connected
    with a cult of the dead, though the author thinks such a connection probably once
    existed and disappeared.
  category: action
  evidence_refs:
  - ev:10
