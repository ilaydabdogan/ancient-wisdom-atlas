  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Fiji, the coastal people, associated with cross-cousin marriage, are contrasted
    with interior people who preserve traces of an older form of marriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage concludes that general culture corresponds with the order of development
    derived from relationship systems and that complexity and richness of relationship
    nomenclature correspond to the assigned regional order.
  category: relationship
  evidence_refs:
  - ev:6
