canonical_text:
  quote: ''
  summary: The passage proposes a chronological order for Melanesian social organization
    based on marriage and relationship systems, then checks that order against chieftainship,
    material culture, regional examples, and the complexity of relationship nomenclature.
    The author presents dual organization with matrilineal descent as earliest, totemic
    organization as intermediate, and absence of clan organization as latest, while
    treating non-totemic clan exogamy as uncertain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that, if his scheme is accepted, the earliest social structure
    is dual organization with matrilineal descent, the latest lacks clan organization,
    and the totemic system is intermediate.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says too little is known about non-totemic clan exogamy to assign
    it a definite chronological place, but notes Malaita as an example of local exogamy
    where clan organization generally appears absent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chronological arrangement is said to be derived from a scheme of marriage
    development in Melanesia, itself based on systems of relationship.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author introduces chieftainship as a possible index of social advance,
    while adding a caveat that this argument uses a standard derived from European
    civilization.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage contrasts the New Hebrides and Banks Islands, where dual organization
    still flourishes and chieftainship is uncertain, with the Solomons and Fiji, where
    definite hereditary chieftainship is said to exist.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that material culture is more developed in the Solomons
    and Fiji than in the New Hebrides.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author broadly describes Solomon Islanders as superior in physical and
    mental development to people of southern Melanesia, while qualifying that some
    southern islands do not fall short in intelligence.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Within Melanesia, the Banks Islands are described as more advanced than the
    northern New Hebrides because Pentecost retains traces of marriage with the granddaughter
    while the Banks Islands do not.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author says Ysabel, a region with matrilineal clans, was decimated by
