canonical_text:
  quote: ''
  summary: The passage discusses bark-cloth, loom-woven cloth, the malo-saru garment,
    ceremonial fillets, and the bow and arrow in Melanesian and Polynesian material
    culture. It emphasizes ritual or magical knowledge in manufacture, especially
    songs and mana needed for weaving the malo-saru, and presents cautious distributional
    arguments about cultural survivals, secret-society ritual, megalithic representations,
    and weapon use.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bark-cloth is described as almost universal in Polynesia and present in a
    special kind in the New Hebrides; the author treats it as connected with an immigration
    earlier than that of the betel-people and as probably common to kava- and betel-people
    cultures.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author defines woven cloth as cloth made with a loom and states that Santa
    Cruz is the only present Melanesian place where the loom is known, while the Banks
    Islands malo-saru was certainly woven in the past.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The art of making the malo-saru had disappeared shortly before Codrington
    wrote, after last being practiced by two men on Rowa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The malo-saru garment is said to have been widely used in the ritual of the
    Sukwe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The maker of the malo-saru had to sing while weaving, and the mana thereby
    brought into action was considered essential to successful manufacture.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author explains the disappearance of the malo-saru not as a loss of practical
    knowledge of looms or fibres, but as a failure to transmit the songs required
    for proper manufacture.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In several Sukwe and Tamate ceremonies of the Banks Islands a fillet is worn
    around the head; in Tikopia a fillet is worn in dances and by a man sent adrift
    in a canoe to die.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A stone figure in Plate III is described as wearing a cylindrical hat, and
    similar head-coverings are said to occur in Melanesian and Polynesian representations,
    with high cylindrical head-coverings on Easter Island stone figures.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author states that the bow and arrow is prominent in Sukwe ritual and
    therefore assigns it an important place in the culture from which he derives the
    Sukwe.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Arrows are described as used as money in the Torres Islands, and the author
    connects this with a hypothesis that immigrants used such money in barter to obtain
    wives.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The bow and arrow is described as a weapon in parts of western Polynesia,
    while elsewhere in Polynesia it is used for sport or for shooting fish, birds,
    or rats.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author raises the possibility that non-warfare uses of the bow and arrow
    in Polynesia may survive from an earlier warfare use.
  category: sequence
  evidence_refs:
  - ev:8
