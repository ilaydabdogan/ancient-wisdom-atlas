canonical_text:
  quote: ''
  summary: The passage surveys Oceanic totemism by classifying totems chiefly as birds,
    aquatic animals, and plants, with local distributions in Fiji, Tikopia, Buin,
    the Shortland Islands, Santa Cruz, Reef Islands, Efate, and other places. It discusses
    insects and inanimate objects as marginal cases, describes linked totemism in
    the Shortlands through the tua and tete classes, and presents an inference that
    the bird-associated tua totems are more recent than the aquatic-associated tete
    totems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'In Fiji, the passage reports two broad groups of totems: trees and animals;
    listed animal totems include birds, aquatic animals, snake, flying fox, lizard,
    frog, and dog depending on district or coast.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Tikopia, aquatic animals are said to outnumber other kinds of totems in
    both John Maresere's list and Mr Durrad's list.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage identifies three chief varieties of Oceanic totemism by the nature
    of the totems: bird, aquatic animal, and plant varieties.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bird variety is associated with Buin, the tua class in the Shortland Islands,
    and prominently with San Cristoval; the aquatic variety is associated with the
    Santa Cruz group, Reef Islands, and Tikopia; the plant variety is associated with
    Efate and one Fijian class.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Insects are reported as occasional totems, but the passage argues that their
    frequency and classification do not justify treating them as a fourth chief variety.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Inanimate objects are said to occur rarely as totems in Oceania, and Vanikolo
    stories are said to suggest they are relatively late additions.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that totem varieties may occur together either while maintaining
    independence as linked totemism or after losing independence so the classes are
    no longer distinguishable.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Shortlands, the tua totem class consists chiefly of birds and uses
    the word for grandfather, while the tete class has predominantly aquatic animals
    and uses the word for grandmother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the Shortlands tua bird totems correspond with Buin bird-totems
    and uses this to suggest two totemic settlements, one common to Buin and the Shortlands
    and another especially influential in smaller islands.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage argues that the tete totems are more ancient and the tua or bird
    totems more recent, based on linguistic strata and the better-known status of
    the tua totems.
  category: sequence
  evidence_refs:
  - ev:8
