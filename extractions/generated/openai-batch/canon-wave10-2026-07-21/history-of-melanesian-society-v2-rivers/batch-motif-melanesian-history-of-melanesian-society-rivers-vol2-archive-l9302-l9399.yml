  summary: The passage argues that Melanesian kinship terminology for father, child,
    and mother reflects differing degrees of continuity, transition, and external
    influence. It discusses uniformity in father terms, distribution of child terms
    such as natu/netu, the mother term tina, possible parent-specific child nomenclature,
    and then opens a section on possessive, collective, and vocative grammatical forms
    of relationship terms.
  language: English
