  summary: The passage discusses collective and reciprocal kinship terms in Fiji,
    the Solomons, Eddystone Island, and Ulawa. It argues that certain widely diffused
    terms belong to an introduced linguistic stratum, suggests how settlers’ collective
    terms could have been adopted by earlier inhabitants, and considers whether reciprocal
    kinship usages in Melanesia derive wholly or partly from this introduced practice.
  language: English
