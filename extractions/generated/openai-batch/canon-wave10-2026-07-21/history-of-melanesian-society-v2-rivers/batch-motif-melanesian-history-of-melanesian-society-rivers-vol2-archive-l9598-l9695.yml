  summary: The passage distinguishes kinship terms used in ordinary reference from
    terms used in address. It argues that divergent address terms in Melanesia often
    preserve older linguistic strata, using examples from the Solomon Islands and
    Fiji, and then compares widely distributed Melanesian kinship terms with Polynesian
    equivalents.
