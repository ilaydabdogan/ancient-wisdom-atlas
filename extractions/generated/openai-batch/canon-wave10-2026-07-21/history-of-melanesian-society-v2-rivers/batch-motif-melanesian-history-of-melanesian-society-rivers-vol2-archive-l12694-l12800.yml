canonical_text:
  quote: ''
  summary: Ethnographic survey of mortuary disposal in Ambrym, Anaiteum, Santa Cruz,
    and several Solomon Islands settings. The passage describes interment, sea disposal,
    exposure on platforms, burning, drying or mummification, later removal of skulls
    and bones, preservation of relics in houses, trees, caves, shrines, chests, boxes,
    and fish-shaped forms, and differences between treatment of chiefs or important
    persons and common or ordinary persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Ambrym, interment in the house is reported as a rule, followed months later
    by removal of skull, jawbone, ribs, and long bones, with some bones placed under
    a hollow tree root or in a tree.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Ambrym, the body of an important man or chief may be kept in the house
    in a canoe, drum, or on a framework with a slow fire, or exposed on a high platform.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Anaiteum, bodies of the dead are usually thrown into the sea, while the
    highest chiefs are interred with the head exposed so that the skull can later
    be taken and kept in a cave or on a tree in a sacred grove.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Santa Cruz and Vanikolo, house interment is described as usual; in the
    interior of Santa Cruz, bones may be dug up for arrowheads and the skull kept
    in a chest in the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Santa Cruz, people may keep the body above ground until flesh can be removed
    and bones extracted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Saa and neighboring places in Malaita, commoners are interred, while an
    important man's body is hung in the house in a canoe or sword-fish figure; later
    the bones are buried except for the skull, which is placed in a bonito-fish figure
    and kept in the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Saa and nearby Malaita, bodies may also be thrown into the sea, rarely
    burnt, or dried on a platform, sometimes in a canoe; pouring water on the body
    may hasten mummification, and the skull or part of it is preserved.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: In San Cristoval, common people are cast into the sea, while chiefs are interred
    and a relic such as skull, tooth, or finger-bone is later preserved in a shrine.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In San Cristoval, important persons may be placed on wooden platforms surrounded
    by palisades until only bones remain; less important dead may be placed in the
    open within palisades in a sitting posture with hands on knees.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Florida, skulls may be dug up and kept in the house; some men are thrown
    into the sea after death by special wish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Savo, common people are usually thrown into the sea while chiefs are interred.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Ysabel, a chief may be interred with the head near the surface and a fire
    kept burning over it so the skull can later be removed and kept in the house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Eddystone Island, a body may be exposed in a squatting position, after
    which the head is removed and placed in a shrine usually shaped like a house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Elsewhere in this part of the Solomons, the skull may be kept in a box shaped
    like a fish or human figure.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: In Eddystone, the body may less frequently be thrown into the sea, usually
    at the special wish of the deceased, including the most important chiefs if they
    wished it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: In the Shortland Islands, the passage begins to report that ordinary people
    are either interred or thrown into the sea.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Across the described islands, the skull or head is repeatedly singled out
    for later removal, keeping, shrine placement, or special storage.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
- id: obs:18
  text: The passage repeatedly distinguishes mortuary treatment by social status,
    especially chiefs or important persons contrasted with commoners or ordinary people.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  - ev:9
- id: obs:19
  text: 'Fire and water are both described as practical elements in mortuary processing:
    fire beneath or above a body or head, and water poured on a body to hasten mummification.'
  category: action
  evidence_refs:
