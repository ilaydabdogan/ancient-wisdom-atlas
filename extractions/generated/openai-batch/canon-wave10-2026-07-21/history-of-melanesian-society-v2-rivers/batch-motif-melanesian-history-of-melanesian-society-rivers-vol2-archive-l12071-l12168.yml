canonical_text:
  quote: ''
  summary: The passage argues that Fiji lacks direct betel-people influence but shares
    strong kinship, linguistic, and institutional affinities with the matrilineal
    Solomons. It discusses secret societies as possible kava-people institutions,
    proposes that kava may once have existed in the Solomons but disappeared or survived
    only obscurely in ritual contexts, and explains how betel-mixture could displace
    kava in daily use because it is more available, portable, abundant, and open to
    all ages and sexes.
  language: English
  quote_policy: summarized
