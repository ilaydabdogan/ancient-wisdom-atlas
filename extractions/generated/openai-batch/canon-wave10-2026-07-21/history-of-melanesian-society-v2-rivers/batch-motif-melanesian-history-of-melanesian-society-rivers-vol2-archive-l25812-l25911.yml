canonical_text:
  quote: ''
  summary: The passage discusses Sulka towers, stones, fire, protected burial, bone
    preservation, circumcision, and sitting-position burial as possible evidence for
    historical cultural transmissions. It then introduces the Baining of the Gazelle
    Peninsula, describing their language, agriculture, marriage customs, absence of
    chiefs, and dances involving women, a large structure, male performers adorned
    as cockatoos or birds, and conical masks or hats.
  language: English
  quote_policy: summarized
