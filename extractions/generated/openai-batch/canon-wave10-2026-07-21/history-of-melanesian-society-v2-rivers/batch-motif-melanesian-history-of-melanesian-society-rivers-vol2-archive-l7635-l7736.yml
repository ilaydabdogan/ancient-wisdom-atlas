canonical_text:
  quote: ''
  summary: 'The passage discusses reciprocal or asymmetric functions attached to kin
    relations in Oceania: property-taking between a man and his mother''s brother
    or sister''s son; authority and avoidance between a father''s sister and her brother''s
    son in Tonga, Pentecost, and the Banks Islands; and ritual roles of the father''s
    sister involving marriage choice, sexual consent, child-related bodily objects,
    feasts, birth rites, and initiation into an Avtagataga rank of the Sukwe.'
  language: English
  quote_policy: summarized
