canonical_text:
  quote: ''
  summary: Rivers compares his reconstruction of Melanesian cultural history with
    Graebner’s scheme, especially the relation between Graebner’s Bogen-kultur and
    Rivers’s betel-culture. He contrasts a model of cultural blending as an integrated
    compound with Graebner’s more mechanical model, discusses Graebner’s attribution
    of secret societies, masks, and canoes to a dual-organisation people, and defends
    his own hypothetical method against the charge of circular reasoning through the
    example of communism, money, and the kava people.
  language: English
  quote_policy: summarized
