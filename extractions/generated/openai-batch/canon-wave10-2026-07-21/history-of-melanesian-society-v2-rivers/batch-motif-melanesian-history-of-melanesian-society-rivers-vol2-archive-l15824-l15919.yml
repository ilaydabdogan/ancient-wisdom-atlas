canonical_text:
  quote: ''
  summary: The passage discusses proposed historical causes for Melanesian kinship
    customs, including the special status of the mother’s brother, customs involving
    the father’s sister, and avoidance between relatives by marriage. It explains
    these customs through interactions among dual people, kava-people, betel-people,
    immigrant men, indigenous women, and regional influences such as Tonga and Polynesia.
  language: English
  quote_policy: summarized
