  summary: The passage discusses Banks Islands adoption customs as possible evidence
    for an earlier community of children, considers the role of fathers and mothers
    in different islands, describes a Torres Islands case in which intervention prevents
    possible infanticide and creates an adoptive parent, and argues that social custom
    may override individual parental feeling.
