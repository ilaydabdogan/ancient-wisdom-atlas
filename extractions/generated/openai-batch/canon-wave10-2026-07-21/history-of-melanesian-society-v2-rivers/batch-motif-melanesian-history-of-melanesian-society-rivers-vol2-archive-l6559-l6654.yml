- id: obs:2
  text: The passage states that the Banks Islands have matrilineal descent, but in
    Mota and Merlav the special relation between parents and children is attributed
    to an act of the father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author notes that in adoption the mother loses her child just as much
    as the father, so recognition of the father-child relation is not treated as a
    complete explanation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Motlav, the would-be mother performs the special act of adoption, the real
    mother is deprived of the child at once, and the real mother is not allowed to
    suckle the child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Torres Islands example, a woman who gives birth to a child of an undesired
