canonical_text:
  quote: ''
  summary: The passage compares the New Britain magit with the Banks Islands atai
    and with animal-transformation beliefs elsewhere in Melanesia. It describes magit
    as a principle projected into animals, links its animal vehicles to stone images,
    totems, guardian animals, and death-announcing birds, and contrasts the feared
    destructive character of Ingiet beliefs with the more reverential Tamate/Sukwe
    pattern in the Banks Islands. The author further speculates that island size and
    immigrant minority status may have shaped the use of e magit as a means of influence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes a general idea of a principle leaving a man's body and
    entering an animal body, and says this is allied to animal-form change beliefs
    elsewhere in Melanesia and to projection of the atai by the Banks Islands gismana.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The magit of New Britain is presented as a representative of the Banks Islands
    atai, with a stated difference that the principle's activities are directed to
    good ends in one place and evil ends in the other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says it is probable that the Banks Islands gismana and the New
    Britain magit derive from the kava-people and became connected with secret organization.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Animals listed as vehicles of magit include birds, including the minigtilai,
    as well as kangaroo, pig, dog, shark, stingray, crocodile, crab, and two lizards;
    the taragau is specifically excluded.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says these magit animal vehicles correspond closely with animals
    represented in stone images and are like animals that are totems elsewhere.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Birds are said to announce death in the Bismarck Archipelago belief, and the
    bird announcing death is described as inspired by the magit through whose agency
    the death is produced.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A footnote says that projection of magit into female forms accounts for female
    human figures among the images of the Ingiet.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author treats animal masks, society names, stone images, e magit, and
    totemism as different manifestations of ideas and practices attributed to the
    kava-people, surviving in beliefs in guardian animals and incarnation of the dead
    in animal form.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: For the Banks Islands Tamate/Sukwe societies, the passage says there is no
    evidence that initiated members believe ghosts and animals have noxious influence;
    uninitiated people dread them, while members' attitude toward tamate is described
    as reverence with little fear.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: For the Ingiet, the passage says fear is obvious, the principle of the Ingiet
    is injurious, its stone images and other objects have destructive effects, and
    magit is regarded as destructive and classed with magic.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author speculates that in the larger islands of the Bismarck Archipelago,
    immigrant numerical inferiority may have encouraged recourse to e magit as a way
    to enhance influence, unlike in the smaller Banks Islands.
  category: setting
  evidence_refs:
  - ev:8
