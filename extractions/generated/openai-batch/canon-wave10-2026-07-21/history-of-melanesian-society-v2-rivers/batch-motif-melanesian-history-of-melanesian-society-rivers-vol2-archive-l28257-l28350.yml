canonical_text:
  quote: ''
  summary: 'The author closes a discussion of Melanesian social organization by noting
    uncertainties about the betel-people and betel-culture, then draws methodological
    conclusions about ethnological inquiry: social structure and relationship systems
    are durable guides to cultural history; morphological and linguistic comparison
    can reveal external influence; small immigrant groups, lack of women among immigrants,
    and island environments can shape cultural interaction; geographical factors act
    indirectly; and secret societies and cults may preserve ancient cultures.'
