  quote: ''
  summary: Rivers argues from a working hypothesis of dual organisation with matrilineal
    descent to explain several Melanesian marriage forms. He supposes a former gerontocratic
    social condition in which elder men monopolised young women, giving rise to marriage
    with women of the daughter’s-daughter generation and later to the transfer of
    elder men’s wives to sister’s sons and son’s sons.
