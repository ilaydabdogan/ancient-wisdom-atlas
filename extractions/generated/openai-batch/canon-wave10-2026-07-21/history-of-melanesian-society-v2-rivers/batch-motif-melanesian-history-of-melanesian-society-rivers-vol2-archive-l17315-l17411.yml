canonical_text:
  quote: ''
  summary: The passage presents an ethnographic hypothesis that Melanesian totemism
    developed from immigrant beliefs in post-death incarnation in animals or plants.
    It describes taboos on killing, injuring, or eating such animals or plants, environmental
    variation in chosen incarnation vehicles, descent beliefs from animal-associated
    ancestors in Tikopia and Fiji, and guardian-animal beliefs such as the Banks Islands
    tamaniu and a Pentecost narrative of a father who is both man and shark.
  language: English
  quote_policy: summarized
