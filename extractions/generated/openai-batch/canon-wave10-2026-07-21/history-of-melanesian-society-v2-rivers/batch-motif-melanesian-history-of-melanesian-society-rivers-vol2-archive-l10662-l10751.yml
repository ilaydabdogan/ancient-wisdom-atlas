canonical_text:
  quote: ''
  summary: The passage discusses whether Banks Islands chieftainship is represented
    in the Sukwe or Tamate societies, argues that chieftainship is difficult to separate
    from high Sukwe rank, and proposes that Sukwe, Tamate, and associated chieftainship
    were immigrant institutions. It further hypothesizes that immigrant men married
    aboriginal women, that their children formed a distinct body imbued with immigrant
    ideas, and that membership in secret organizations was first limited mainly to
    these descendants before broader aboriginal admission.
