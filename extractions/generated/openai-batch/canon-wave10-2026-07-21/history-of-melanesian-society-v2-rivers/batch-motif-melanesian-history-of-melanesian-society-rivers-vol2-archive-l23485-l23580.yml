  summary: 'The passage presents an argument that Oceanic possessive forms, articles,
    and related grammatical features reflect different cultural and linguistic strata:
    the author associates singular possessive pronouns and the article na with the
    kava-people and individual possession, while associating Polynesian possessive
    structure, sitting-position interment, and the article te with earlier settlers.
    The passage also argues that language and social organization are interdependent.'
  language: English
