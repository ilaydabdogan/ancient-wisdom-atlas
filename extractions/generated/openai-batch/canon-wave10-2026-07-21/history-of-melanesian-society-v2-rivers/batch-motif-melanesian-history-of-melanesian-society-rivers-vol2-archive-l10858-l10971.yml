canonical_text:
  quote: ''
  summary: The passage compares secret or ranked societies in several Melanesian islands
    with the Banks Islands Sukwe and Tamate societies. It describes ranks, initiation,
    seclusion, ordeals, masks, ghost beliefs, pig-giving or pig-killing, taboo signs,
    new names, and visual or ritual equivalents such as demit designs and tindalo
    figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The loll of Pentecost, the Sukwe of Aurora, and the Hukwe of Lepers’ Island
    are described as much like the Banks Islands Sukwe, with fewer ranks than Mota
    and similar initiation and rank-raising processes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: New Hebrides societies called Bweta, Bwatu, or Welu are described as generally
    resembling the Banks Islands Tamate, while being less numerous and less ritually
    elaborate than in Mota.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Pentecost every male becomes a member; initiations occur every six to ten
    years, large groups enter together, and initiates remain secluded for several
    months at an initiation place or in small houses near gardens.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports that the connection with death is less obvious in Pentecost,
    that Codrington stated there was no thought of intercourse with ghosts or spirits,
    and that in Aurora public manifestations of members are believed to be the work
    of ghosts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author states that the nature of seclusion suggests a ritual representation
    of death, and also notes formidable ordeals, animal-representing masks, and no
    known soloi-like taboo.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ambrym has an organization resembling the Banks Islands Sukwe, with ten ranks
    and a highest rank called mal, a word also used for men regarded as chiefs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Ambrym, members of each rank cook and eat at the same fire, and lower-grade
    members live before marriage in bachelor’s halls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some Ambrym ranks have plants and flowers as taboo-signs, the cycas is prominent,
    and giving pigs is essential in initiation or rank-raising ceremonies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ambrym ceremonies include masked dancers called rom who are believed to be
    ghosts, and women of Ambrym have ranks similar to men’s ranks.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Malikolo and adjacent islands, men are divided into ranks corresponding
    to Sukwe grades, and rank members may eat together or separately from other ranks.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Associated beings and objects called demit, temes, or natemate are said to
    represent the Banks tamate, and on Uripiv a diamond-shaped design called demit
    is treated as equivalent to the face of the Banks tamate.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Malikolo-related rank advancement, a man receives a new name at each rise
    in rank; each occasion includes killing pigs and is followed by seclusion, during
    which the secluded person called suli may not wash or see a woman’s face.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the Maskelyne Islands there are ten ranks, the highest is called amat,
    and the author suggests that full ghostly dignity is attained after a long series
    of initiations.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The author says the northern New Hebrides accounts are too fragmentary for
    exact comparison but show institutions closely allied to the Banks Islands Sukwe
    and Tamate societies.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Matambala societies of Florida are described as very similar to the Banks
    Islands Tamate societies; tindalo figures are said to be equivalent to tamate
    hats or masks, and pigment preparation is described as similar, especially for
    red pigment.
  category: relationship
  evidence_refs:
  - ev:10
