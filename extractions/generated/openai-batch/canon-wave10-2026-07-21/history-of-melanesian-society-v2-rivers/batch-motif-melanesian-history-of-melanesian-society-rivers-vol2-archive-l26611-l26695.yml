  summary: The passage reviews Rivers's argument that Melanesian dual organisation
    may not be the earliest social form but may have arisen through fusion between
    an aboriginal population and earlier Austronesian-speaking immigrants associated
    with sitting burial, spirits, circumcision, and certain material culture. It contrasts
    this fusion hypothesis with the common sociological explanation of fission and
    notes hostility between Banks Islands moieties.
