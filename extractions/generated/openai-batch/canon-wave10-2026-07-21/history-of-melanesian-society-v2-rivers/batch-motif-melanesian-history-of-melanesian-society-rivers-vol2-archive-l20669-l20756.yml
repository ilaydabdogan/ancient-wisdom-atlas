canonical_text:
  quote: ''
  summary: The passage presents an ethnological explanation for Polynesian incision
    practices. It says incision was broadly practiced, not especially chiefly or priestly,
    and assigns it to an earlier Polynesian population rather than to the kava-people.
    It then argues that kava immigrants adopted the practice because indigenous women
    would not marry or have sexual relations with unincised men, while later concealment
    practices such as ligature are explained as attempts to neutralize exposure caused
    by the operation.
  language: English
