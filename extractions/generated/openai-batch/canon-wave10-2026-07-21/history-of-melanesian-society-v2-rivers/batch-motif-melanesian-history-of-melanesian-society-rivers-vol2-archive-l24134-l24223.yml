canonical_text:
  quote: ''
  summary: The passage discusses whether Bismarck Archipelago moiety totems came from
    totemic settlers or belonged originally to a dual culture, then summarizes limited
    evidence on Namatanai relationship terminology, moiety-specific terms for the
    father’s sister, avoidance and joking relations, and several affinal or cross-relative
    terms compared with Melanesian, Oceanic, and Shortlands patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that it is doubtful whether the moiety totems of the Bismarck
    Archipelago came from totemic settlers or were an original feature of the dual
    culture.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One proposed case is that the dual people took over certain totems from visitors
    and treated them with unusual respect, while immigrant-founded groups lost or
    obscured their totemic character.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says that more relationship systems and other facts are needed
    before the different peoples can be arranged in order of social development.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Only one relationship system is said to be known for the region, recorded
    by Peekel from Namatanai on the east coast of New Ireland.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Namatanai system is described as a fairly simple classificatory system
    with rich terminology and few complexities.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father uses the term nati for both son and daughter, while the mother
    does not use nati; the author identifies nati as a term of immigrant origin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Brother and sister terminology uses one term between brothers and another
    between sisters, without age distinction; brother and sister use one reciprocal
    term and have definite avoidance customs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father’s sister is called tama, the father term, and may be distinguished
    with a feminine prefix as hintama.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Terms used for the father’s sister differ by moiety: a Tarago child uses
    rahat, while a Pakilaba child uses tau, and the terms are reciprocal.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man may not marry his father’s sister, and the two do not use each other’s
    personal names; otherwise they may embrace and joke.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A nephew may ask his father’s sister for her possessions, which she frequently
    gives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The mother’s brother and the father’s sister’s husband are both called matua,
    which the author says suggests either cross-cousin marriage or exchange of brothers
    and sisters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Kamala is given as a special term for the mother’s brother of the wife, and
    hihi is used for the wife of the mother’s brother and the mother’s brother of
    the husband.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: A woman calls her husband’s father tubu, a term otherwise used for the grandfather;
    the term is also used reciprocally for the daughter-in-law and grandchild.
  category: relationship
  evidence_refs:
  - ev:7
