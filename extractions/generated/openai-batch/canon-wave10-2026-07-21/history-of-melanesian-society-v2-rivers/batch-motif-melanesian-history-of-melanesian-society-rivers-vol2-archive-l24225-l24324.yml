canonical_text:
  quote: ''
  summary: 'The passage describes Namatanai and New Ireland kinship terminology and
    practices: terms for cross-cousins, prohibitions on cross-cousin marriage and
    name utterance, avoidance and insulting relations, in-law greeting formulas in
    dual and plural forms, and Rivers''s cautious linguistic comparisons with wider
    Melanesian and Polynesian kinship terminology.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says lapu is a special term for same-sex cross-cousins, while
    cross-cousins of different sex call one another hine or hinekokup; hine is identified
    as the term for the brother-sister relationship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cross-cousins described as hine-kokup may not marry, may not utter one another's
    names, and avoid one another in the same way as brother and sister.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that Peekel's account closely links the prohibition on using
    the personal name with the prohibition of marriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lapu is also reported as used between persons of different moieties, apparently
    regardless of generation or closeness of relationship; those who call one another
    lapu habitually insult one another, though the scope of the custom is said to
    be unknown.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several terms for brothers- and sisters-in-law are described, with different
    terms for two men, two women, and mixed-sex relationships.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In New Ireland, ordinary greeting and leave-taking expressions used between
    men are said to be in the dual form and called di uauas makus, glossed as 'one
    counts the brother-in-law.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Corresponding expressions between a man and a woman are said to be in the
    plural form and called di uauas mahat; the meaning of this name is said to be
    no longer known.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Namatanai terms tama, nati, tasi, tubu, and pupu are said to belong to
    a kinship-term group widely distributed throughout Melanesia.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The terms matua and a brother-sister term printed as June are described as
    Polynesian in character.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author says interpretation of an isolated system is hazardous, but suggests
    that introduced terms may indicate ancient alternate-generation marriage and former
    cross-cousin marriage or marriage with the daughter of the elder brother.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Cross-cousin marriage is described as now strictly forbidden, while the name
    prohibition is presented by the author as suggesting that the idea of such marriage
    remains present and may once have been orthodox.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author suggests that relatively recent Polynesian influence may have created
    a need for new terms for the mother's brother and brother-sister relationships,
    but says the kind of process is unknown.
  category: other
  evidence_refs:
  - ev:8
