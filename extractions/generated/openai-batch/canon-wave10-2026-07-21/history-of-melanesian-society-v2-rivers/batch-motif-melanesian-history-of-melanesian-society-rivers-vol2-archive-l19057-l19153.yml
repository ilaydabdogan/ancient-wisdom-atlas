canonical_text:
  quote: ''
  summary: The passage presents Rivers's hypothesis that Banks Islands adoption customs
    developed through interaction between matrilineal dual people and immigrant kava-people.
    It discusses payments connected with children, the position of the father and
    mother's brother, the Mota birth-helper payment, Motlav first-food acquisition,
    Merlav cycas-leaf planting, and a proposed transformation from paternal rights
    over one's own child to general adoption rights.
  language: English
  quote_policy: summarized
