canonical_text:
  quote: ''
  summary: The passage describes shell-money in New Britain and the Bismarck Archipelago,
    comparing its collection, manufacture, use, sacred name, transactional reckoning,
    and association with secret organizations to practices in the Banks Islands. It
    then summarizes several mortuary practices in the Bismarck Archipelago, including
    interment in houses, canoe coffins, binding parts of the body, throwing bodies
    into the sea with weighted feet, and occasional upright burial of chiefs.
  language: English
  quote_policy: summarized
