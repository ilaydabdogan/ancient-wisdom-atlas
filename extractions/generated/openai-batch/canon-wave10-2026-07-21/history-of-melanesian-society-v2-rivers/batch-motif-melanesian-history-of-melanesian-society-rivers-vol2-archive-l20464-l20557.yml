canonical_text:
  quote: ''
  summary: The passage argues that stone-work and megalithic structures in parts of
    Oceania may be linked with kava-people, secret societies, sacred rites, and in
    some cases a possible cult of the sun. It compares Tahitian/Polynesian marae with
    the Fijian nanga on the basis of orientation, pyramidal structures, and association
    with secret organisations, and discusses Tongan trilithons with stone bowls or
    cavities interpreted as possibly connected with kava.
  language: English
  quote_policy: summarized
