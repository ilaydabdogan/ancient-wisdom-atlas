  summary: The passage argues that Melanesian linguistic diversity reflects earlier
    inhabitants, later kava- and betel-associated immigrant groups, maternal language
    transmission, renewed isolation after the decline of seaworthy canoes, and possible
    vocabulary effects from name-avoidance rules.
