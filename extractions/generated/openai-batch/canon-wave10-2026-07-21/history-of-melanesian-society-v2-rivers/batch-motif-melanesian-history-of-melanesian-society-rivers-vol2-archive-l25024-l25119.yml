canonical_text:
  quote: ''
  summary: The passage presents an ethnographic-historical argument about secret organisations
    in Melanesia and the Bismarck Archipelago. It links Tamate societies, Dukduk,
    and Ingiet to a supposed common source, discusses the Dukduk as a relatively recent
    sun-cult element with an annual birth-life-death cycle, contrasts Dukduk with
    Tubuan and Ingiet, proposes influence from eastern or Polynesian settlements,
    compares an Ingiet ritual tower with pyramids of marae and nanga, and notes that
    secret organisations appear especially developed on small islands.
  language: English
  quote_policy: summarized
