canonical_text:
  quote: ''
  summary: The passage evaluates hypotheses about population mixture and social organisation
    in the Solomon Islands. It rejects a simple coastal-settlement model for the kava-people,
    argues instead for intimate blending with earlier inhabitants, considers whether
    the betel-people lacked totemism and clan-exogamy, and notes kema attributed to
    stranger settlement, including Simbo or Himbo as a probable secondary migration
    from the Western Solomons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The matrilineal region of the eastern Solomons is described as resulting mainly
    from mixture of the kava-people with the dual people, with relatively little influence
    from the betel-people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One rejected possibility is that coastal people descend from kava-people who
    married indigenous women while the earlier inhabitants remained in the island
    interior as bush-people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The coastal-settlement hypothesis is said not to explain the varying coast-bush
    distinction or the presence of dual organisation in the matrilineal Solomon region.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that it is highly improbable that indigenous women taken
    as wives would make their husbands and children adopt their social system.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The alternative view is that the kava-people blended intimately with earlier
    inhabitants and that the existing social system resulted from interaction between
    the two peoples' ideas and practices.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The extent of the fusion, whether limited to the coast or spread across the
    islands, is left unresolved pending more knowledge of Solomon bush-people culture.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Islands on each side of the matrilineal region are described as apparently
    lacking totemism, with clan-exogamy absent or locally present only.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The absence of totemism and clan-exogamy is attributed as a natural conclusion
    to betel-people influence, while the passage allows that exogamy may have disappeared
    in a new environment and may formerly have existed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Certain kema of Florida and Guadalcanar are said not to derive from original
    moieties by fission but from settlement of strangers.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: One kema called Simbo or Himbo is reputed to have come from the west and is
    inferred to result from secondary migration from the Western Solomons.
  category: relationship
  evidence_refs:
  - ev:10
