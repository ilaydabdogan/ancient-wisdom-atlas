canonical_text:
  quote: ''
  summary: The passage argues that Oceania, especially Melanesia, preserves cultural
    samples useful for analyzing earlier cultural strata in Indonesia and wider Asia.
    It presents a west-to-east working hypothesis for cultural movement into Melanesia,
    notes a limited possible American influence on Polynesia, and then turns to physical
    variation among Melanesians as evidence of mixture among immigrant culture-bearing
    peoples.
  language: English
  quote_policy: summarized
