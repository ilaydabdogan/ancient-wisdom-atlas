canonical_text:
  quote: ''
  summary: The passage discusses Melanesian social organization through exogamous
    totemic clans. It defines totemism as the association of an animal, plant, or
    object with a social group, a believed relationship or descent connection between
    group and totem, and respect or restrictions concerning the totem. It identifies
    Santa Cruz and Vanikolo as especially clear cases, gives examples of grass and
    bowl clan prohibitions and bowl-clan descent from a woman arriving in a bowl,
    and contrasts these with matrilineal Solomon Islands clans whose sacred forbidden
    animals are called tindalo.
  language: English
  quote_policy: summarized
