  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage turns to marriage with the father's mother, more precisely the
    wife of the father's father, as producing the chief correspondences under discussion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the main scenario, if the eldest son marries the wife of his father's father,
    he occupies the positions of both father's father and elder brother to the rest
    of the family.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage compares this status change to a Banks Islands case in which a
    man who marries the wife of the mother's brother obtains the status of father
    to his uncle's children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: For Nandrau and Dhawanisa Fijian cases, the passage lists additional correspondences
