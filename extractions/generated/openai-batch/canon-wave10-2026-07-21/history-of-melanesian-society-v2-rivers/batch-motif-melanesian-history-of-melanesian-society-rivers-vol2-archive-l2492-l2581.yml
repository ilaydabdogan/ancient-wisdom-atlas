canonical_text:
  quote: ''
  summary: The passage analyzes kinship-term correspondences in Melanesian and comparative
    systems. It considers and then temporarily rejects marriage with a woman two generations
    younger as the explanation, turns to marriage with a woman two generations older,
    and argues that marriage with the father's mother or, more precisely, the wife
    of the father's father, can explain correspondences between father's father and
    elder brother and between son's wife and mother. It also treats some Fijian correspondences
    as probable later modifications rather than direct results of such marriages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a dual organization with either matrilineal or patrilineal descent, the
    brother of the mother's mother is said to be in the same moiety as the father's
    father and may be the same person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Dieri evidence makes it possible that classing the father's
    father with the elder brother may be an indirect consequence of marriage with
    a daughter's daughter or of the social condition associated with such marriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the father's father is also treated as the elder brother, the wife of his
    son is said to follow as the speaker's mother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage temporarily excludes marriage with a woman two generations younger
