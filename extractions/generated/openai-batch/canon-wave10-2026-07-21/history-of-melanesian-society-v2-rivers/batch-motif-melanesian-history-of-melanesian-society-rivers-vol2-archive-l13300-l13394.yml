canonical_text:
  quote: ''
  summary: 'The passage argues that Melanesian mortuary practices differed among proposed
    cultural groups: earlier dual people interred the dead in a contracted sitting
    position, while immigrant kava- and betel-peoples preserved the dead above ground,
    either as whole bodies or skulls. The author links preservation to a cult of dead
    ancestors, offerings and prayers, material signs of ghostly influence, and possible
    secret communion with the dead in Tamate societies through representations, masks,
    or skulls.'
  language: English
  quote_policy: summarized
