canonical_text:
  quote: ''
  summary: Ethnographic discussion of Bismarck Archipelago moieties, including reported
    bird or insect descent and kinship, bodily signs associated with moieties, gendered
    sun/moon and butterfly associations, links to opposed legendary personages, exogamy
    rules, and a noted linguistic resemblance between terms from New Ireland/Bismarck
    and the Solomons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people of Laur are said to believe that each moiety is descended from
    its bird; the bird term is explained as combining elements meaning female and
    grandparent, so the bird is regarded as a female ancestor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Duke of York Island each moiety regards its insect as a relative; one cited
    authority reports belief in descent from the insect, while another doubts that
    belief.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members of the moieties are said to be distinguishable by physical characters,
    including different ways of walking, though accounts disagree on the exact foot
    pattern.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Moiety membership is also said to be distinguishable by the folds or lines
    on the palms, with conflicting reports about which moiety has three, four, or
    five lines.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Malaba are reported to have projecting eyebrows like the malaba bird.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Kokole in New Ireland the Malam is said to be the more powerful moiety,
    linked to the stronger nature of its bird, which can deprive the targo of prey.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Laur district, Taragau is connected with the sun and male butterfly,
    while Pakilaba or Malaba is connected with the moon and female butterfly; the
    passage states that the sun is regarded as male and the moon as female there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Some moieties are connected with legendary personages: To Kambinana is associated
    with ability and guile, To Kovuvuru with stupidity and ignorance; in New Ireland
    Soi is intelligent but unscrupulous, while Tamono is a fool deceived by Soi.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Two persons of the same moiety should not marry; this exogamy rule is said
    to be breaking down in many places.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Breaking the exogamy rule, called budo, was formerly punished by death through
    hanging or strangling, to be carried out by the culprits themselves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage notes that budo resembles the Florida/Solomons term buto, which
    applies to an animal from which clan members must abstain.
  category: speech
  evidence_refs:
  - ev:8
