canonical_text:
  quote: ''
  summary: Ethnographic discussion of Bismarck Archipelago exogamous moieties, their
    names in different districts, their associations with legendary persons, birds,
    insects, and coconuts, and the respect, prohibitions, quarrels, and mortuary treatment
    connected with moiety animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies a north-coast New Britain district toward the west
    as inhabited by the Barriai, Kilenge, and Kobe peoples.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people in the discussed districts are divided into two exogamous moieties,
    and a person moving to another place is assigned to the local moiety corresponding
    to his own.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In New Ireland, certain members of the two moieties are described as having
    a feeling of hostility and as customarily using insulting expressions toward one
    another.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the north-eastern Gazelle Peninsula, the moieties are said to lack definite
    names and to be spoken of as “we” and “they,” or “our stock” and “their stock.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Danks is reported as saying that the Gazelle Peninsula moieties are called
    after To Kambinana and To Kovuvuru or Karvuvu, described here as two legendary
    persons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Duke of York Island moieties are named Pikalaba and Maramara; these names
    are also used in Laur, while farther south in New Ireland the moieties are called
    Baumbaum and Marrmarr.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: In other areas the moieties are named after two birds, taragau and malaba,
    identified as Pandion leucocephalus and Haliaetus leucogaster respectively.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The taragau is described as a marine fish-hawk feeding on fish caught in shallow
    reef water, while the malaba is described as a large powerful hawk or eagle that
    usually lives on high trees and may chase the taragau to obtain dropped food.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Duke of York Island the moieties are associated with the praying mantis
    called kam and a leaf-mimicking insect called ko gile le, though authorities disagree
    about which insect belongs to which moiety.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Between Kininigunan and Birar, unnamed moieties are associated with Pandion
    and Haliaetus, while elsewhere on the coast moieties are associated with light
    and dark coconut.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Birds or insects connected with moieties are treated with great respect; members
    may not kill, injure, eat, or destroy the being connected with their own moiety,
    and killing by others may lead to fighting.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: People of Duke of York Island may secretly destroy the insect of the other
    moiety, but a quarrel follows if the act becomes known.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: If one of the birds connected with a moiety is killed by mischance, it is
    buried like a human being and a feast is held in its honour.
  category: sequence
  evidence_refs:
  - ev:12
