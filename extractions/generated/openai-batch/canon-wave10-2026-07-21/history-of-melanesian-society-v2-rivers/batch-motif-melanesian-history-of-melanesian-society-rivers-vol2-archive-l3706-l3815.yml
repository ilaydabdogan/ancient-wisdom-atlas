  summary: The passage surveys reported forms of totemism or possible totemic survivals
    in parts of the Solomons, Fiji, the New Hebrides, Banks and Torres Islands, and
    Aurora, focusing on social groups associated with animals, plants, sacred objects,
    exogamy, matrilineal descent, food prohibitions, ancestor terminology, and power
    over an associated animal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that an institution in a matrilineal region of the Solomons
    closely resembles totemism but is modified, while noting Codrington's caution
    that some food prohibitions may have non-totemic origins.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the Manukama kema of Florida are described as permitted to eat
    the bird from which they take their name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ruviana, Eddystone, and Vella Lavella region is described as lacking totemism,
    while certain districts of San Cristoval are said to have totemism.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Shortland Islands, exogamous matrilineal clans called latu are associated
    with two totems, tua and tete.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Shortland terms tua and tete are glossed as grandfather or male ancestor
    and grandmother or female ancestor respectively.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Only some Shortland totem animals are forbidden as food, and these forbidden
    animals are called tabu or tabutabu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Buin district of Bougainville, exogamous clans are associated with
    birds that clan members may not kill or eat.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'In Buin, descent is matrilineal: a man has the same totem as his mother and
    also respects his father''s totem.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Fiji, especially inland Viti Levu, certain animals or plants may not be
    used and are associated with a tribe or with divisions called matanggali.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Fiji shows belief in descent from the animals not
    eaten by members of the tribe or matanggali.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Efate, exogamous groups called naftak are associated with plants or animals,
    and most of the ten groups mentioned take their names from plants.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says there is no definite evidence of totemism elsewhere in the
    New Hebrides and in the Banks and Torres Islands, though some moieties are named
    after animals.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: Pentecost and Mota moiety names include animals such as the bush-turkey and
    the giant clam.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Certain Mota moiety subdivisions are connected with objects regarded as sacred.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: A family in Aurora is connected with the octopus; members are believed to
