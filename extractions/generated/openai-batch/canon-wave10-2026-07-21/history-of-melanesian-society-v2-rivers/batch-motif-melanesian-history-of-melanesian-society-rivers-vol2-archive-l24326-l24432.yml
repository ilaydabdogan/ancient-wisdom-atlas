canonical_text:
  quote: ''
  summary: The passage compares chieftainship and succession in the Gazelle Peninsula
    and other parts of the Bismarck Archipelago with nearby Melanesian examples, then
    describes secret societies, especially the Dukduk. It notes male initiation in
    a cleared bush space, two masks called dukduk and tubuan, the tubuan as female
    mother of the annually born dukduk, the dukduk's death at the next monsoon while
    the tubuan persists, possible associations with the dead and skulls, and the status,
    wealth, and property-protection powers connected with owning a tubuan mask.
  language: English
  quote_policy: summarized
