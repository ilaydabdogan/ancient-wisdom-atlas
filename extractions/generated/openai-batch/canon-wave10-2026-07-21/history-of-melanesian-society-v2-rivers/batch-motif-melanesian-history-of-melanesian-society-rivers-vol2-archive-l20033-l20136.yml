canonical_text:
  quote: ''
  summary: Rivers compares magic and sacred-being categories in Tikopia, Tahiti, Polynesia,
    and Melanesia. He describes Tahitian manatiaa who use obtained personal materials
    in rites, discusses Tikopian atua as ancestral ghosts and animals, compares Tahitian
    tii with Melanesian vui, and considers named beings such as Kwat, Marawa, Tagaro,
    Subwe, and Tangaroa in relation to Melanesian and Polynesian mythologies.
  language: English
  quote_policy: summarized
