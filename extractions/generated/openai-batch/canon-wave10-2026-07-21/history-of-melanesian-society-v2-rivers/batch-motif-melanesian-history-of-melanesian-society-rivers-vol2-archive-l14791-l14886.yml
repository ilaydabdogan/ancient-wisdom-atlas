canonical_text:
  quote: ''
  summary: The passage reassesses a proposed development of Melanesian social organization.
    It contrasts an earlier internal-development model, based on dual organization,
    matrilineal descent, elder male dominance, individual marriage, and recognition
    of father-child relations, with a later model in which Melanesian society is treated
    as a composite of indigenous and immigrant cultural elements. It identifies immigrant
    streams associated with kava and later betel-mixture, and argues that immigrant
    influence contributed to simplification of systems of relationship.
