canonical_text:
  quote: ''
  summary: The passage discusses changing importance of descent in Melanesian social
    organization, especially marriage regulation and inheritance. It describes matrilineal
    inheritance in Pentecost, exceptions and intermediate forms in Lepers’ Island
    and the Banks Islands, and distinctions between inheritance of ancient cultivated
    land and newly reclaimed land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that present-day marriage in Melanesia is not regulated
    solely by exogamous moieties or clans, because some persons outside one’s group
    may still be forbidden marriage partners.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that kinship regulates marriage in some parts of Melanesia
    and may be becoming more important even where clan-exogamy exists.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author concludes that matrilineal communities in the area show a change
    in the social importance of descent, especially in the altered status of the father.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Pentecost, inheritance is described as properly matrilineal, with a man’s
    land and personal possessions passing at death to members of his own moiety, especially
    his sister’s children, rather than to his own children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that inheritance by children in Pentecost is said to be
    modern and possibly connected with European-era influence or increased inter-island
    intercourse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Codrington’s earlier account is cited as reporting that a son received nothing
    from his father except what the father gave him during life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lepers’ Island is described as an exception where house and land pass to the
    children, while sister’s children receive personal possessions and share them
    with members of the dead man’s moiety or waivung.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'In the Banks Islands, inheritance is described as intermediate between matrilineal
    and patrilineal modes: property often passes to children, but matrilineal inheritance
    is said to have formerly been the rule.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that in the Banks Islands some forms of property still
    pass to sister’s children, and the sister’s son may take anything he chooses or,
    if his right is denied, everything.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ancient cultivated ground is said to pass to the sister’s children, while
    newly reclaimed land is taken by the children of the man who cleared it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: An example is mentioned in which an original reclaimer gave much recently
    cleared land to his children during his lifetime, and that land was then passed
