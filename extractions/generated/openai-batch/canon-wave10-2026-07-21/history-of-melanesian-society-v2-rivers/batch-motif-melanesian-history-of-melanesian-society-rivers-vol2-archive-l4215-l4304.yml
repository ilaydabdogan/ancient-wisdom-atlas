canonical_text:
  quote: ''
  summary: The passage presents Rivers's comparative argument that Melanesian systems
    of relationship vary in richness and complexity, with Pentecost treated as especially
    archaic and complex, while Ulawa, Saa, Eddystone, and Polynesian systems are described
    as simpler. It proposes a developmental movement from dual organisation with matrilineal
    descent toward systems lacking clan organisation and regulating marriage by genealogically
    traceable relationships. It also notes the unresolved intermediate presence of
    totemism, current examples of kin-term simplification in Florida and Eddystone,
    and a suggested role for old men's monopoly of young women in producing forms
    of marriage and merged kin relationships.
  language: English
  quote_policy: summarized
