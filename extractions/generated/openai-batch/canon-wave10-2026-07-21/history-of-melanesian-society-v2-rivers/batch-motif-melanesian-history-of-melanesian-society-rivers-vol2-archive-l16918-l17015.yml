canonical_text:
  quote: ''
  summary: The passage offers an explanatory hypothesis for the association of totemism
    with matrilineal descent in Melanesia. It argues that immigrant descendants retained
    ancestral totems but, through intermarriage with indigenous people and the residence
    of daughters in immigrant settlements, came to transmit totems through mothers.
    It further considers whether local totemic groups began from one totemic immigrant,
    several differently totemed immigrants, or one ancestor whose descendants became
    linked with several animals, while noting limited evidence for a link between
    localized totemism and patrilineal descent.
  language: English
  quote_policy: summarized
