canonical_text:
  quote: ''
  summary: The passage presents Rivers's comparative hypothesis that cremation, bird-totemism,
    and certain sun-cult rituals may have been introduced into parts of Melanesia
    by a migrant group, while also noting difficulties from Polynesian and megalithic
    evidence. It discusses the burning of Dukduk masks, the New Ireland oara sun-object
    burned with a skull, and a Florida Manukama clan offering oriented to sunrise
    and sunset.
  language: English
  quote_policy: summarized
