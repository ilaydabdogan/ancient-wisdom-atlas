canonical_text:
  quote: ''
  summary: The passage contrasts Banks and Torres Islands magic with Tikopian religious
    institutions. It describes Banks Islands rites using mana-bearing stones or objects
    associated with a vui or spirit, discusses malignant magic and protective associations,
    presents John Maresere’s testimony that such magic is absent in Tikopia, and develops
    Rivers’s historical argument that Melanesian magic may be indigenous while kava-people
    rites were religious, producing a conflict between religion and magic.
  language: English
  quote_policy: summarized
