canonical_text:
  quote: ''
  summary: Rivers discusses beliefs and ceremonies connected with death in Melanesia.
    He argues that cults of the dead were common to both the hypothesized kava-people
    and betel-people, while a developed skull-cult and head-hunting in the Solomon
    Islands are especially associated with the betel-people. He describes ancestor
    and relative skulls preserved in shrines, enemy heads taken in warfare, heads
    offered to ghosts or ancestors on occasions such as building houses or launching
    canoes, and the idea that the head or skull can represent the person or body.
  language: English
  quote_policy: summarized
