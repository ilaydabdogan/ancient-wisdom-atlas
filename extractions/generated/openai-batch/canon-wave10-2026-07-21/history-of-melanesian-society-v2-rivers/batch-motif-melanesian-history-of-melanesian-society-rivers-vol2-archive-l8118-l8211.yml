canonical_text:
  quote: ''
  summary: The passage describes how invoking the head of a walui or kwiliga can stop
    quarrelling, relates avoidance between relatives by marriage to older social conditions
    and moiety hostility, describes duties of mutual help among affinal relatives,
    and argues that kinship terminology simplifies when social functions attached
    to kinship ties disappear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An object can become taboo, and a quarrel between two men can be stopped by
    a spoken formula referring to the head of a walui or kwiliga.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If fighting continues after the formula, the combatants may face fines or
    destruction of their property by the rest of the community.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author explains the practice as a way to prevent fighting from spreading
    and reawakening old hostility between two social divisions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author speculates that the special reference to the head may preserve
    a memory of fights ending in the taking of heads.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author concludes that avoidance rules between relatives by marriage are
