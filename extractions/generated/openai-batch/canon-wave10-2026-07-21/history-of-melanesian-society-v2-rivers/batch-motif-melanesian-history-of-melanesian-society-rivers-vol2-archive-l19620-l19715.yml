canonical_text:
  quote: ''
  summary: Rivers discusses the religious character of secret-society ritual in the
    Banks and Torres region, including Tamate regalia, initiation, relations with
    ghosts of the dead, and the social power maintained by uninitiated belief. He
    then turns to religion outside secret organizations, identifying prayers and offerings
    as evidence, and cites Banks Islands tataro formulas as prayers to dead ancestors,
    with efficacy tied to fixed wording.
