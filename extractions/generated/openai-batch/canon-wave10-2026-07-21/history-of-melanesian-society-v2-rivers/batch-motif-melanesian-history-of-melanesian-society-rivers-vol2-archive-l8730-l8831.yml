  summary: The passage summarizes regional distributions of Oceanic kinship terms,
    especially terms for affinal relatives, father, mother, child, siblings, mother's
    brother, grandparents, and grandchildren. It contrasts areas of wide linguistic
    uniformity with areas of great diversity and argues that Melanesian kinship terminology
    fits a history of an external language spreading over peoples who originally had
    diverse tongues.
  language: English
