canonical_text:
  quote: ''
  summary: The passage argues that an earlier sitting-interment population stratum
    preceded the kava-people in Polynesia and was probably Austronesian-speaking.
    It adopts Schmidt's term Austronesian for related Melanesian, Polynesian, and
    Indonesian language families, considers whether the kava-people's language became
    a lingua franca in Polynesia as proposed for Melanesia, and concludes that Polynesian
    linguistic uniformity is better explained if both the earlier sitting-interment
    settlers and later kava-associated immigrants spoke Austronesian languages. It
    also questions the explanatory force of isolation as a cause of linguistic diversity.
  language: English
  quote_policy: summarized
