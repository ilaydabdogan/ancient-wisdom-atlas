  summary: The passage argues that in several Melanesian kinship systems, use or avoidance
    of personal names is connected with marriage eligibility and with the emergence
    of relationship terms that classify certain affinal or cross-relatives with mothers,
    fathers, brothers, or sisters in order to mark them as non-marriageable.
