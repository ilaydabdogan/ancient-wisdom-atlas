    systems of relationship. It distinguishes structural/classificatory comparison
    from linguistic comparison, stresses the diversity of Oceanic kinship terminologies,
    observes that distant communities may have more similar systems than neighboring
    ones, and proposes that relationship nomenclature depends chiefly on social institutions,
    especially forms of marriage, while acknowledging limits of evidence.
