canonical_text:
  quote: ''
  summary: The passage analyzes Melanesian kinship terminology. It links a special
    term for the husband of the father’s sister in Mota to a joking relationship and
    special social functions, cautiously infers a similar possibility for Pentecost,
    and then examines a wider pattern in which the father’s sister is named with the
    mother’s brother’s wife while the mother’s brother is classed with the father’s
    sister’s husband. Rivers proposes possible causes—reciprocal sibling-pair marriage,
    cross-cousin marriage, or dual organization—and argues that in recorded Melanesian
    cases cross-cousin marriage best explains the co-designation, including extensions
    to mother-in-law and father-in-law terms.
  language: English
  quote_policy: summarized
