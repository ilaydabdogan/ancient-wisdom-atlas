canonical_text:
  quote: ''
  summary: The passage describes ethnographic regulations governing conduct among
    relatives by marriage in several Melanesian and neighboring island groups. It
    distinguishes avoidance rules from mutual helpfulness, lists prohibitions involving
    names, conversation, passing, touching the head or back, and approaching or handling
    objects when a person is sitting or burdened, and discusses possible links to
    sexual potential, asymmetrical brother-in-law relations, and hostility between
    social moieties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Special regulations concerning relatives by marriage are divided into rules
    of avoidance and rules of mutual helpfulness.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Avoidance rules include prohibitions on using a personal name, on conversation,
    and on passing one another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'In the Banks Islands, the head is given unusual importance: nothing is to
    be taken from above the head, and references to the head of a relative by marriage
    are said to have far-reaching significance.'
  category: object
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:4
  text: The passage states that, for relatives by marriage of different sex, avoidance
    rules carry implications of potential sexual intercourse, especially in the Torres
    Islands and to a lesser extent in the Banks Islands.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Avoidance also occurs among relatives by marriage of the same sex, including
    a Pentecost rule concerning brothers-in-law.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Pentecost, a man may not touch the head or go behind the back of his sister’s
    husband, but the restriction is not reciprocally applied to the man’s own head
    and back in relation to his wife’s brother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Banks Islands, a man must not address his wife’s father familiarly,
    take anything from above his head, or pass him when he is sitting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Torres Islands, a man and his daughter’s husband reciprocally avoid
    approach when one is sitting, and neither takes a load directly from the other’s
    shoulder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author states a common principle that relatives by marriage must not approach
    or touch one another when one is at a disadvantage, such as sitting or carrying
    a load.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that the avoidance rules imply hostility and connects this
    with a reported tradition of hostility between two veve or moieties in the Banks
    Islands.
  category: relationship
  evidence_refs:
  - ev:6
