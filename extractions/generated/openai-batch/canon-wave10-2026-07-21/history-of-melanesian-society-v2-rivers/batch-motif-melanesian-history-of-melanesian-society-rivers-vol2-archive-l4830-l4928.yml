canonical_text:
  quote: ''
  summary: The passage surveys chieftainship, inheritance, and succession in parts
    of Melanesia. It describes chiefly status in the Banks Islands as closely connected
    with rank in the Sukwe, notes patrilineal or son-preferential succession in several
    islands, describes mana from communication with ghosts as a basis of chiefly position
    in parts of the Eastern Solomons, and argues that succession in the region under
    discussion is patrilineal even where descent is matrilineal. It also proposes
    a movement from matrilineal to patrilineal inheritance and succession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Banks Islands, the exact status of a chief is described as uncertain,
    but high rank in the Sukwe is presented as the preeminent factor in the social
    position Europeans regarded as chieftainship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Motlav terms for chiefs, etvusmel or tavusmel, are glossed by derivation
    as connected with killing for the cycas, which the author says indicates a connection
    with the Sukwe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Banks Islands passage, the chief's position is said to be transmitted
    to the holder's son rather than to his sister's son, but not as a definite social
    regulation; the son's own rise in the Sukwe is said to be necessary.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Saa in Malaita, the passage states that there is true hereditary chieftainship
    and that succession is definitely patrilineal.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Elsewhere in the Eastern Solomons, chiefly position is described as depending
    on belief in the chief's possession of mana derived from communication with the
    tindalo or ghosts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Eastern Solomons examples, a man with chiefly standing could nominate
    his successor or be succeeded by someone chosen by the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: One prominent chief of Florida is described as a Malaita man, not native to
    Florida, who had taken a prominent part in a successful battle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Eddystone, hereditary chieftainship is described as usually patrilineal;
    cases of succession by a sister's son are attributed to failure of more direct
    heirs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Vella Lavella, succession is described as depending largely on nomination
    by the chief, and many cases are reported in which a captive taken during a head-hunting
    expedition succeeded a chief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that where hereditary chieftainship exists in Melanesia,
    succession is always in the male line and that no instance is known in which a
    chief is naturally succeeded by his sister's son.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author distinguishes matrilineal descent from succession, stating that
    succession in the part of Melanesia under discussion is patrilineal throughout.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage argues that inheritance in Melanesia shows stages of progression
    from the maternal to the paternal line and that a chief's habitual preference
    for his own child could explain the emergence of patrilineal succession.
  category: sequence
  evidence_refs:
  - ev:7
