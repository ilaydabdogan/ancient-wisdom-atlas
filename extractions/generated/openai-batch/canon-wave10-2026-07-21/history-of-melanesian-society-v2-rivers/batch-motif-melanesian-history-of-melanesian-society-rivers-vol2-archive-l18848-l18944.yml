  summary: The passage argues that canoe ownership, the Sukwe gamal or club-house,
    money distribution, and marriage forms support an ethnographic-historical scheme
    in which the dual people are associated with communism in property and sexual
    relations, while the kava-people or immigrants are associated with individual
    property and influence toward individual marriage.
