canonical_text:
  quote: ''
  summary: 'The passage evaluates and rejects difficulties in the hypothesis that
    Melanesian sexual communism arose secondarily from old men''s monopoly of women.
    It then proposes an alternative reconstruction: an older communal condition, in
    a dual matrilineal society with recognized generations and status but no individual
    marriage, was gradually transformed when powerful old men kept younger women as
    individual wives. Younger men remained unable to obtain wives, communal relations
    persisted, and later transfers of wives to sisters'' sons or sons'' sons narrowed
    communal relations to same-generation/status kin categories such as brother''s
    wives and wife''s sisters.'
  language: English
  quote_policy: summarized
