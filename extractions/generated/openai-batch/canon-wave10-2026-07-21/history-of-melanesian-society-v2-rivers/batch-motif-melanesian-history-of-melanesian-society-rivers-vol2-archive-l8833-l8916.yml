  quote: ''
  summary: The passage presents a linguistic argument about Melanesian kinship terminology.
    It treats diversity of relationship terms as evidence of older linguistic strata
    and uniformity as evidence of later introduced language. On this basis, it identifies
    terms for mother, child, mother's brother, and brother-sister relations as ancient
    and connected with mother-right and matrilineal dual organization. It then argues
    that major changes in marriage and social structure could create the social need
    for changes in relationship nomenclature.
