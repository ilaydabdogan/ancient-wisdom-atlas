  summary: The passage surveys Oceanic funerary treatments, distinguishing contracted
    or sitting burials that may prevent the dead from returning, possible grave-underworld
    passage beliefs, extended chiefly vault burials linked with preservation, and
    combined practices such as skull removal after burial and canoe-related burial
    for passage to a future home.
  language: English
  quote_policy: summarized
