canonical_text:
  quote: ''
  summary: Rivers revises an explanation of Fijian and Buin kinship correspondences,
    arguing that they should be sought in a matrilineal dual organization rather than
    in a change of descent. He enumerates correspondences in which relatives of alternate
    generations or affinal positions receive the same terms, compares Fiji and Buin
    with Pentecost and Dieri cases, and examines whether marriage with a classificatory
    granddaughter, especially a daughter's daughter, could explain the terminology.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that attempts to explain the Fijian system by a change in
    mode of descent were unsuccessful, and that Thurnwald's publication of the Buin
    system led him to seek the explanation in a matrilineal society.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author assumes that the Fiji and Buin correspondences arose in a society
    with dual organization and matrilineal descent, related to the form that produced
    similar Pentecost correspondences.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief correspondence common to Fiji and Buin is that the father's father
    receives the same designation as the elder brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Buin, a man uses for his father's father the term a man uses for an elder
    brother and is addressed reciprocally as younger brother; between a woman and
    her father's father, the term is the one normally used between brother and sister.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Buin, the father's mother is addressed by the term mdmai, otherwise used
    by a woman for her elder sister; when applied to the grandparent it is used by
    both men and women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Buin relatives of alternate generations are classed
    together, and that Viti Levu tribes show additional examples.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The Nandrau apply to the son's wife the same term used for the mother, a feature
    the author says resembles Pentecost use of one term for the wife's mother and
    the daughter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Other Fijian correspondences are presented as less certain: among Nandrau
    and Navatusila, the wife of the sister''s son is classed with the mother, and
    one informant says the son of the sister''s son is classed with the younger brother.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Among the Dhawanisa, the husband of the father's sister, the husband of the
    sister's daughter, and the wife of the sister's son are reportedly all called
    dhawai, though the author warns that the information may be incorrect.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author examines whether the correspondence between father's father and
    elder brother, and between son's son and younger brother, could be derived from
    marriage with a classificatory granddaughter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Marriage with the son's daughter is described as excluded in a dual organization
    because she would be in the same social group as the grandfather, regardless of
    matrilineal or patrilineal descent.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: If a marriage two generations below is to explain the correspondence in a
    dual organization, the author says it must be marriage with the daughter's daughter,
    of the kind found in Pentecost and among the Dieri.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Dieri are said to sometimes call the brother of the mother's mother kanini-neyi
    or kanini-elder brother.
  category: speech
  evidence_refs:
  - ev:7
