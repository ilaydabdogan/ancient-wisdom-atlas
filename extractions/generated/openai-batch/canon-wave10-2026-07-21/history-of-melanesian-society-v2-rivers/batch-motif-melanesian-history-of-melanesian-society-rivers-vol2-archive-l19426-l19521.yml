canonical_text:
  quote: ''
  summary: The passage contrasts religion and magic in southern Melanesian societies,
    attributing a broad religious tendency to immigrant kava-people and a magical
    tendency to dual or indigenous groups, while noting qualifications. It then considers
    whether Tamate and related ghost societies retained a religious character, especially
    through secret rites and taboo. A taboo breach, such as taking a coconut protected
    by a taboo-sign, is described as resulting in illness or other infliction attributed
    to a higher ghostly agency.
  language: English
  quote_policy: summarized
