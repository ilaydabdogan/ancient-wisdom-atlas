  summary: The passage argues that material objects and useful arts may survive in
    altered forms but tend to disappear more readily than social or religious elements.
    It states that the chapter will examine material culture, immigrant arts, money,
    secret-society ritual objects, and clothing. It then surveys clothing across several
    Melanesian island groups and highlights mats, the Pentecost men's malo, and Bweta
    initiation in relation to a hypothesis about the kava-people.
