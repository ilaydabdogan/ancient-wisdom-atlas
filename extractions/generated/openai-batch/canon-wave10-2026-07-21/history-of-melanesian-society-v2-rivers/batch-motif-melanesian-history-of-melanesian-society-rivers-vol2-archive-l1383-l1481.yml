canonical_text:
  quote: ''
  summary: The passage compares Melanesian and Polynesian kinship terminologies for
    grandparents, grandchildren, parents-in-law, and children-in-law. It notes varying
    degrees of terminological complexity, reciprocal terms, classing of affinal relatives
    with other kin categories, and the presence or absence of avoidance customs, especially
    in relation to parents by marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some inland tribes are described as having four distinct terms for kinds of
    grandparent, each with a reciprocal term for the corresponding kind of grandchild.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the inland terminology gives an example of reciprocity
    and notes a correspondence between the father’s father and the elder brother,
    deferred to the next chapter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eddystone is said to make no distinction between parents and grandparents
    or between children and grandchildren, a feature said otherwise to occur only
    in Samoa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vella Lavella has one term for grandparent and one for grandchild; many Eastern
    Solomons systems use one reciprocal term for grandparent and grandchild, though
    some islands distinguish grandfather and grandmother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Santa Cruz is described as using descriptive terms for different categories
    of grandparent and grandchild.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Torres and Banks groups are described as having simple terms for grandparents
    and grandchildren, while Pentecost is described as having a high degree of complexity
    connected with a special form of marriage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Anaiteum and Tanna are described as having only comprehensive terms for grandparent
    and grandchild.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In several Polynesian systems, parents by marriage have special terms, are
    classed with father and mother, or are distinguished by additions to parent terms.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among coastal peoples of Fiji, parents-in-law are classed with the mother’s
    brother and father’s sister; most interior groups are said to use different terms.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Western British Solomons are described as having distinctive reciprocal
    terms for the relationship between persons and the parents of their consorts.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Most Eastern Solomons systems are said to have special reciprocal terms for
    parents by marriage, with Guadalcanar and possibly Bugotu noted as exceptions
    or partial exceptions.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage reports no definite conduct rules for many parent-in-law relationships;
    avoidance is absent in Polynesia and the Western British Solomons, restricted
    in Ysabel and Guadalcanar, and absent in Florida and Savo.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In Santa Cruz, three terms are used for parents by marriage, with reciprocal
    use for corresponding children-in-law categories, and definite avoidance is associated
    with a man and his wife’s mother.
  category: relationship
