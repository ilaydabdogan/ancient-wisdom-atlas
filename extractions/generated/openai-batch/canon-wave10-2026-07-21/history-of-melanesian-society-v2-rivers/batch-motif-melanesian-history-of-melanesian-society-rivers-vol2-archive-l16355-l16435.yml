  - ev:3
- id: obs:8
  text: 'As a working hypothesis, the passage distinguishes three Shortland Islands
    population elements: an earliest group interring the dead sitting, a second group
    throwing the dead into rivers or the sea with aquatic animal totems, and a third
    group with bird-totemism and cremation.'
  category: sequence
