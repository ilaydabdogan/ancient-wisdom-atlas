canonical_text:
  quote: ''
  summary: 'The passage argues that Shortland Islands funeral rites and linked totems
    point to successive totemic immigrations: an earlier aquatic-totem group whose
    totems received bodies or ashes in rivers or the sea, and a later bird- or tua-totem
    group associated with cremation. It extends this as a cautious working hypothesis
    to Bougainville, Buin, and broader linked or fused totemic associations, while
    repeatedly noting scanty evidence.'
  language: English
  quote_policy: summarized
