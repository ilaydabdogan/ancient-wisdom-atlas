canonical_text:
  quote: ''
  summary: The passage argues that certain Melanesian marriage forms are best explained
    by the dominance of old men arising within a dual, matrilineal social organization.
    It tests possible derivation from Australian matrimonial-class systems, noting
    some parallels and compatibilities but concluding that Australian fourfold or
    eightfold class systems cannot directly account for marriage with the wife of
    the mother's brother. The author therefore accepts gerontocratic dominance as
    the working foundation for further study.
