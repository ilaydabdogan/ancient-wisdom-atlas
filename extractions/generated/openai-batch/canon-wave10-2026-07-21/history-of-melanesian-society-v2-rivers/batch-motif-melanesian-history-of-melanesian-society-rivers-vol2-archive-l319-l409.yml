  quote: ''
  summary: Methodological prose in which the author discusses whether historical anthropology
    may assume that remote peoples acted from motives comparable to those known in
    historical and contemporary settings. The passage argues for concurrent study
    of social psychology and historical culture, treats cultural change through the
    blending of peoples as a safer field for such assumptions than the study of institutional
    origins, and explains the book title's preference for history over evolution and
    society over culture.
  language: English
  quote_policy: summarized
