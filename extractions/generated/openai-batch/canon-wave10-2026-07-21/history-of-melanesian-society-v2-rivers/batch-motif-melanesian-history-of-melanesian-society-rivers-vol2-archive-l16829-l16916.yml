canonical_text:
  quote: ''
  summary: The passage argues that although patrilineal totemism appears only exceptionally
    in the surveyed Melanesian cases, immigrant totemic groups could have adopted
    matrilineal descent because immigrant men took wives from indigenous dual-organized
    groups. Their children, having indigenous mothers, would be classified by the
    mother's moiety for marriage purposes, while the father's totem would matter little
    in mixed marriages. The passage presents this as a mechanism by which indigenous
    matrilineal rules could regulate marriage and persist within communities influenced
    by immigrant totemism.
  language: English
  quote_policy: summarized
