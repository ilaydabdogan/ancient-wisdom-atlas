canonical_text:
  quote: ''
  summary: The passage argues that cremation is a later funerary practice associated
    with bird-totemism in several Melanesian regions. It compares Bougainville and
    the Shortland Islands with other regions, discusses burnt offerings in San Cristoval
    and the Solomons, and treats the burning of masks, ceremonial objects, and burial
    property as possible survivals or relics of cremation.
  language: English
  quote_policy: summarized
