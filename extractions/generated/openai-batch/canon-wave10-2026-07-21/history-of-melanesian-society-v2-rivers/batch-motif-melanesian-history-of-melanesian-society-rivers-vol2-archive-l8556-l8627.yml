  quote: ''
  summary: Expository linguistic and kinship comparison surveying terms for grandparent,
    grandchild, and related kin across the Eastern Solomons, Banks Islands, Torres
    Islands, Pentecost, Anaiteum, and Polynesia. The passage emphasizes recurring
    forms such as tupu, tumbu, pupua, and related variants, and notes a Solomon Islands
    use of tumbu for the mother’s brother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Eastern Solomons, kukua is described as a frequent reciprocal term
    for grandparent and grandchild, with related forms kite in Ysabel, ko in Malaita,
    and koo in the Fiu district.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage connects the Tongan form kui with a similar process of abbreviation
    from the same term family.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Ulawa, Saa, and San Cristoval, the passage identifies different grandparent
    words whose essential parts are probably uwa and pwa.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Rafurafu, the grandmother term kaka is analyzed with ka as a female prefix,
    and the second ka is questioned as possibly a variant of pwa.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage notes a frequent Melanesian interchange of p and k in relation
    to the proposed pwa and ka forms.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Banks Islands, cited grandparent terms include Mota tupu or pupua,
    Merlav tumbu, and a Vanua Lava dialect form popo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Merlav word imbua is used for certain classes of grandchild, and rombu
    is described as the term for the mother of husband or wife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Torres Islands, terms listed include pupil, tukwu, and repu; repu is
    described as formed with the feminine prefix re.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Pentecost, the passage states that the widespread Oceanic grandparent term
    does not occur in any of its forms, because grandparent terms correspond with
    terms for other relatives under local marriage regulations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In Anaiteum, the grandparent term is etpo and the grandchild term is mapo,
    with mapo described as closer to the Polynesian form.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage concludes that closely related terms for the grandparent-grandchild
    relationship are widely distributed in both Polynesia and Melanesia, especially
    forms tupu and tumbu.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: The reduplicated form pupua is described as apparently formed from the second
    syllable of the usual word and as used especially in address in the Banks Islands.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: In Florida and the Bugotu district of Ysabel, tumbu is used for the mother’s
    brother, although elsewhere in Oceania it is a grandparent term.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Bugotu, and an older recorded Florida usage, apply tumbu to the mother’s brother
    of the father, a kin category the passage says would generally be classed with
    the grandfather in Melanesia.
  category: relationship
  evidence_refs:
  - ev:6
