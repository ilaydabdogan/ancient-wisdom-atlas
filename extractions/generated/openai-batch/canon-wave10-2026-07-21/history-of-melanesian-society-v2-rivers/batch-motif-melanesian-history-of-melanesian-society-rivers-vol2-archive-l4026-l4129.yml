canonical_text:
  quote: ''
  summary: 'The passage argues for a chronological ordering of Melanesian social forms:
    dual organisation with matrilineal descent is treated as the earliest recoverable
    form; totemic clan organisation is generally presented as later, with Santa Cruz
    discussed as a doubtful case; and non-exogamous forms, including those with or
    without cross-cousin marriage, are treated as still later. A belief that palm-fold
    patterns distinguish totemic clan membership is compared across Santa Cruz, Buin,
    and a matrilineal region of the Solomons.'
  language: English
  quote_policy: summarized
