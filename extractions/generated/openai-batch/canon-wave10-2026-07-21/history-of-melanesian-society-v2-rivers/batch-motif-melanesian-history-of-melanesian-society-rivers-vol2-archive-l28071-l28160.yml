  quote: ''
  summary: The passage presents the author's concluding defense of a historical scheme
    linking the kava-people with secret societies, animal totemism, money, dog and
    fowl, bow and arrow, sacred archery, dual social organisation, descent from male
    ancestors, circumcision, sitting burial, and later-confirmed evidence from the
    Bismarck Archipelago, New Ireland, the Sulka, Fiji, the Solomon Islands, and Vanua
    Levu.
  language: English
