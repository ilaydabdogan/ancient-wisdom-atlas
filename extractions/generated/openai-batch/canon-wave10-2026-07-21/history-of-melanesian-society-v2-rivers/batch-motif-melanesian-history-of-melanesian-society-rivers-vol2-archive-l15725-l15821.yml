  quote: ''
  summary: The passage discusses Rivers's reconstruction of immigrant influence on
    Melanesian social organization. It treats wife payment, regional distributions
    of that custom, functions of relatives, brother-sister avoidance, the status of
    the mother's brother, the increasing recognition of the father-child relationship,
    the Fijian vasu, and possible rights of indigenous dual groups over children of
    immigrant men and indigenous women.
  language: English
  quote_policy: summarized
