canonical_text:
  quote: ''
  summary: 'The passage compares house-building forms and distributions in Melanesia:
    roof-thatching methods in the British Solomons and southern Melanesia; the sacred
    status of the Solomons roof-ridge; long club-houses associated with kava-people,
    Sukwe ranks, and gamal length; the Ysabel tree-house as a refuge from head-hunters;
    the Santa Cruz round house and related forms in New Caledonia and Fiji; and possible
    fusion between round, square, oblong, and apse-ended house forms.'
  language: English
  quote_policy: summarized
