canonical_text:
  quote: ''
  summary: The passage argues that traces of mother-right in Tonga and Tikopia are
    unlikely to be due merely to external influence and may reflect former matrilineal
    descent and, in Tikopia, matrilocal marriage. It weighs explanations involving
    fusion with aboriginal populations or prolonged migration with cultural borrowing.
    It compares Tongan and Tikopian relationship terminology with Melanesian patterns,
    cautiously compares hostile Tikopian districts with Banks Islands moieties, and
    then turns to whether Polynesian institutions such as the Areois, with ranks and
    initiation, are comparable to Melanesian secret societies such as the Sukwe.
  language: English
  quote_policy: summarized
