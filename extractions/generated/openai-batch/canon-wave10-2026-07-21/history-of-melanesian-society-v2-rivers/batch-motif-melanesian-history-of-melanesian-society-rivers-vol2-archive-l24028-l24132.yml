literal_observations:
- id: obs:1
  text: The passage states that descent is generally matrilineal, with a person belonging
    to the mother's moiety, while Barriai practice is presented as a possible exception.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Friederici is reported as describing patrilineal succession among the Barriai
    but not definitely stating father-moiety membership; the mother's brothers are
    still said to have a large role in a nephew's life.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage describes a practice of killing women when a foreign village is
    conquered, with the stated motive that a captive woman's son might later return
    to his own people and avenge his mother and people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Laur, each moiety is said to have numerous sub-groups called hun, named
    after men of influence who died long ago.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Each sub-group is said to be connected with a paga, a place that is tambu
    to group members and usually has rivers or ponds believed to be earthly dwelling
    places of taboron or ghosts.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that these sub-groups bring the local social organization
