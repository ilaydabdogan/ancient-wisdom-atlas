  summary: The passage describes matrilineal and possibly changing descent rules,
    moiety sub-groups in New Ireland/Laur, sacred or tabu places with water believed
    to house ghosts, and the author's comparison of Bismarck Archipelago dual moieties
    with totemic and southern Melanesian social structures.
