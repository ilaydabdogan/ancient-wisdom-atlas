canonical_text:
  quote: ''
  summary: The passage compares kinship classifications for the father’s sister and
    the husband of the father’s sister across Polynesia, Fiji, the Solomons, the Banks
    Islands, the Torres group, and the New Hebrides. It notes regional variation in
    special terms, classing with other relatives, and an authorial hypothesis that
    the father’s sister’s former or current status as a potential wife helps explain
    why she may lack a special relationship term or be classed with the mother after
    becoming non-marriageable.
  language: English
  quote_policy: summarized
