canonical_text:
  quote: ''
  summary: The passage argues that marriage primarily regulates social status, descent,
    inheritance, and succession, distinguishes hypothetical group sexual relations
    from marriage by calling them sexual communism, and surveys evidence for communal
    property in Melanesia, especially in Pentecost and the Banks Islands. It notes
    communal ownership by the verana in Pentecost, possible former common landholding
    in the Banks Islands, and ceremonies in which a canoe or baby is passed among
    members of a group as possible survivals of communal ownership or community of
    children.
  language: English
  quote_policy: summarized
