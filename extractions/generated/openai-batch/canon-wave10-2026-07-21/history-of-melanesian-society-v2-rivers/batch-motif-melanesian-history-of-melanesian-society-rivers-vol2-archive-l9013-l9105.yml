canonical_text:
  quote: ''
  summary: The passage compares kinship terminology and marriage practices in the
    Banks Islands, Pentecost, Torres Islands, Solomons, and Viti Levu. It argues that
    the Banks Islands lost the granddaughter marriage while retaining marriage with
    the mother's brother's wife, considers and rejects cross-cousin marriage as the
    likely cause of this change in most Banks Islands, and suggests foreign influence
    and the scorn of strangers as a possible cause. It also traces regional distributions,
    absences, and resemblances of terms for grandparents and relatives by marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the chief linguistic forms of certain kin terms occur
    in the Banks Islands, while terms for relatives by marriage are attributed to
    an older stratum found only in the Banks Islands, the Torres group, and Pentecost,
    not elsewhere in Melanesia so far as known.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes the Banks system from the Pentecost system by saying
    that all trace of granddaughter marriage has disappeared in the Banks Islands.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pentecost system is said to depend on both granddaughter marriage and
    marriage with the wife of the mother's brother, while the Banks system is said
    to depend only on the latter form of marriage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The comparison of the Pentecost and Banks systems is said to suggest that
    marriage with the uncle's wife had been added before foreign influence, and that
    the Banks change under that influence was the disappearance of the older form
    of marriage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author says the comparison suggests that old men were already handing
    over wives to their sisters' sons as an organized system independent of external
    influence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Events especially attributed to foreign influence include the disappearance
    of granddaughter marriage, the introduction of a new comprehensive term for grandparents,
    and simplification of nomenclature for those relatives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage considers a mechanism in which old men give daughters rather than
    wives to sisters' sons; this would make marriage with brothers' granddaughters
    disappear because those women would already have been given in marriage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: For most of the Banks Islands, the passage states that there is no evidence
    of cross-cousin marriage in the present or past, except in Merlav, and adds that
    the method of denoting cross-cousins is incompatible with such a marriage form.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The author supposes that the disappearance of marriage with the brother's
    granddaughter was due directly or indirectly to foreign influence, perhaps to
    the scorn of strangers who would regard the marriage as ridiculous or immoral.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Torres Islands, grandparents are denoted by terms related to those
    found throughout Melanesia, while relatives by marriage are denoted by terms closely
    related to Banks Islands terms and not found elsewhere in Melanesia.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Eastern Solomons, marriages with kin are said to have disappeared or
    to exist only as cross-cousin marriage, and both grandparents and relatives by
    marriage are widely, though not universally, denoted by terms thought to have
    been introduced.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the Western Solomons, Eddystone is said to provide little evidence because
    of simplification, while Vella Lavella and Buin appear to lack traces of the widely
    distributed terms.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: The mountain systems of Viti Levu are said to preserve traces of marriage
    between persons of alternate generations and to have special grandparent terms
    different from the supposed introduced terms, with a resemblance to terms in Vella
    Lavella and Buin.
  category: relationship
  evidence_refs:
  - ev:9
