canonical_text:
  quote: ''
  summary: The passage analyzes decorative art associated with the Sukwe and Tamate
    societies. It discusses the human motive, its attribution to kava-people, possible
    modification by indigenous rectilinear art, and an alternative explanation in
    which sacred emblems were deliberately conventionalized or disguised for lower
    ranks and uninitiated viewers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Examples of the human motive, whether naturalistic or conventionalized, are
    described as decoration on objects connected with the Sukwe or Tamate societies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author assigns the human motive to the kava-people and considers whether
    its conventionalization could be explained by indigenous influence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The kava-people are described as arriving in relatively small numbers, marrying
    indigenous women, and having descendants of mixed parentage and culture.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage proposes that if earlier decoration used rectilinear designs,
    transmission across generations could turn the human motive into rectilinear patterns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some Banks Islands knives retain the human figure almost unchanged, while
    the face of a Tamate is described as extremely conventionalized.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Pudding-knives of Ureparapara are associated with different Sukwe ranks:
    unchanged human forms with Kworokwovoiava and higher ranks, and conventionalized
    knives with lower grades.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author supposes that dual people were introduced slowly into the Sukwe,
    first into lower ranks, and were obliged by superiors to modify the human figure
    when decorating knives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The change may have resulted from kava-people prohibiting faithful imitation
    of emblems they regarded as sacred and as their own possession.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A diamond figure representing Tamate Viov appears in ordinary art and in masks
    that may be seen by the people at large.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage suggests that some extremely conventionalized figures may be sacred
    emblems modified so that uninitiated persons would not recognize the human motive.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The passage states that conventionalization may depend on representing sacred
    objects in disguised and conventional form for low-ranking members and uninitiated
    viewers.
  category: other
  evidence_refs:
  - ev:7
