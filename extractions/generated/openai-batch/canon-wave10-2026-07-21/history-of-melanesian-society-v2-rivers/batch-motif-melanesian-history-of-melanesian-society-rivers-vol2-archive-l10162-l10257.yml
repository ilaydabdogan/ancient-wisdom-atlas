canonical_text:
  quote: ''
  summary: The passage presents a working hypothesis that Melanesian secret-society
    rituals derive from immigrant founders, while noting that culture contact may
    create new customs through interaction. It uses the Tamate societies as an example,
    suggesting that death symbolism in their ritual may have arisen if aboriginal
    people interpreted immigrant strangers as returned dead or ghosts. This would
    explain the name Tamate, the treatment of members as ghosts, admission rites represented
    as death, awe toward the societies, respect for taboo marks, avoidance by uninitiated
    people, and preliminary admission to the gamal before Tamate rites.
  language: English
  quote_policy: summarized
