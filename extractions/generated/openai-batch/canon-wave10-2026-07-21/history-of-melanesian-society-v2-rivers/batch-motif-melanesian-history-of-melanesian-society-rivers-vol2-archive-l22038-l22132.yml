canonical_text:
  quote: ''
  summary: The passage argues that several animals, currencies, technologies, ornaments,
    and secret-society ritual objects in Melanesia can be attributed to immigrant
    kava- or betel-peoples. It discusses fowl feathers, the bush-turkey, animal-part
    currencies, turtle-shell, porpoise teeth, arm-rings, drills, and the objects used
    in Sukwe and Tamate initiation or admission rituals, while noting limits to the
    evidence for some attributions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that fowl feathers are used as a badge for one Sukwe rank
    and as money material in the Banks Islands, and also notes fowl totems in Santa
    Cruz and Fiji and the fowl's presence in Polynesia.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bush-turkey is treated as relevant to domestic animals; the passage reports
    an argument that the Niuafou bird was introduced by human agency and that its
    native name is shared with the New Hebrides.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage connects the bush-turkey's presence with volcanic activity because
    heated soil contributes to egg incubation, and it notes that Niuafou is volcanic.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists multiple Melanesian money forms, including shell-money,
    feather-money, mat-money, arrows, fowls' feathers, pigs' jawbones, and dogs' teeth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage discusses turtle-shell ornaments and currency, porpoise-teeth,
    arm-rings, and the drill as items or technologies linked to immigrant arts or
    non-indigenous implements.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: In initiation into the Sukwe, the pig, conch-shell, and cycas tree are used.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In dances following initiation into Wometeloa, the passage lists the wooden
    gong, bow and arrow, money-measuring rods, pig's jawbone, head fillet, and armlets
    with scented leaves.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the ceremony accompanying admission into Avtagataga, mats and a wooden
