canonical_text:
  quote: ''
  summary: The passage compares Melanesian and Polynesian beliefs in guardian animals,
    life-tokens, totems, and postmortem incarnation in animal or plant form. It discusses
    British Solomon Islands animals understood as embodiments or abodes of the dead,
    Buin bird-souls that cause death by plucking a leaf from a netherworld tree, Tahitian
    reverence for an animal intended as a postmortem body, and a hypothesis that animal-form
    masks in Melanesian secret societies relate to rites concerning death and incarnation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the British Solomon Islands, humans are described as having special relations
    with sharks, crocodiles, and lizards; these animals are called by name, fed, and
    said to help connected humans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the British Solomon Islands human-animal relation
    is due to belief that the animals are embodiments or abodes of the dead.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author suggests that Banks Islands tamanm or tamaniu beliefs may derive
    from an idea of incarnation after death in animal form, while also noting that
    this relation may have become separated from its original ancestor-cult context.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tamaniu is described as having the character of a guardian animal, but
    the passage says it is not known whether British Solomon Islands ghost-animals
    act as life-tokens.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Buin, the sua or soul is said to take the form of a bird and to bring about
    the death of its earthly counterpart by plucking a leaf from a tree in the nether
    world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage connects some Eastern Solomon guardian animals with clan totems
    and states that Buin birds forming the sua are probably also totems of that district.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Tahiti, a man reveres during life the animal into which he intends to enter
    after death, and the approach of that animal during illness is regarded as a sign
    of his coming death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The passage presents two alternatives: kava-people may have had personal
    relations during life with animals of postmortem embodiment, or guardian-animal
    belief may have developed later from an incarnation belief after settlement in
    Oceania.'
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that Melanesian and Polynesian guardian-animal and life-token
    beliefs are related both to totemism and to belief in ancestor incarnation in
    animals.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Melanesian secret societies are described as closely associated with death,
    secret rites, animal-form masks, and ritual features that suggest a relation to
    totemism.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author proposes that some animal-form masks may originally have represented
    animals of an ancient home and only later been identified with Melanesian animals.
  category: other
  evidence_refs:
  - ev:8
