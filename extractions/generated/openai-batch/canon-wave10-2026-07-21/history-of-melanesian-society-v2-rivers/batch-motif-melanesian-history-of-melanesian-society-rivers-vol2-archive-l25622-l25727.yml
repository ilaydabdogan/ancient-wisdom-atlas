canonical_text:
  quote: ''
  summary: The passage discusses canoe types, decorative art, and linguistic and social
    groupings in the Bismarck Archipelago. It identifies dug-out outrigger canoes
    and a plank-built canoe called mon, notes spiral and curvilinear designs on Dukduk
    masks and wooden gongs, proposes possible cultural influences from betel-people,
    sun-cult introducers, or New Guinea/Massim peoples, and describes the Sulka, Mengen,
    Tumuip, and Gaktai in terms of social organisation, language, location, and relations.
  language: English
  quote_policy: summarized
