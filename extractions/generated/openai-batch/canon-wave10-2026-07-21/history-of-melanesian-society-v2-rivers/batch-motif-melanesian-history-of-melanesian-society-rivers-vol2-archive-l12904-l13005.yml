canonical_text:
  quote: the function of the canoe is to convey the dead to their future home
  summary: The passage discusses Oceanic funeral practices involving canoes, disposal
    of bodies at sea, and cave or mountain burial. It presents sea passage to a future
    home or underworld access point as a belief connected with migration by sea, describes
    Anaiteum belief about a ghost swimming to Umatmas, notes rank distinctions in
    sea disposal, and interprets cave burial as a protective response against theft
    or desecration of bones.
  language: English
  quote_policy: quoted
