canonical_text:
  quote: ''
  summary: 'The author argues that small male immigrant groups called the kava-people
    could have imposed their language on indigenous Melanesian populations despite
    marrying indigenous women. He proposes a mechanism by analogy with contemporary
    pidgin English in the Pacific: a common language used by settlers can become a
    lingua franca between otherwise linguistically diverse island populations, eventually
    becoming widely known and used.'
  language: English
  quote_policy: summarized
