canonical_text:
  quote: ''
  summary: The passage analyzes the prominence of death in Melanesian secret societies
    and initiation ritual. It considers, but qualifies, the idea that aboriginal populations
    may have understood immigrant strangers as the dead or as ghosts. It argues that
    the representation of death in Tamate initiation was fundamental and likely derived
    chiefly from immigrant beliefs. It then explains the distribution of secret societies
    by suggesting that secrecy was needed where immigrant groups were weak or surrounded,
    while open cult practice would be possible where immigrants were stronger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the secret organizations may be easier to understand if the
    prominence of death resulted from an aboriginal belief that strangers were actually
    the dead.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage cautions that it should not be assumed that aboriginal people
    necessarily felt awe or mystery toward the dead; it says intercourse with the
    dead may have seemed ordinary and could have encouraged participation in secret
    rites.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that there is definite evidence of fear of the dead in
    Melanesia, though the extent of that fear among the aboriginal population remains
    a question for later inquiry.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The representation of death is described as the leading motive of initiation
    and as a fundamental feature of Tamate ritual.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the candidate’s mouth would be shut to the uninitiated, so
    the initiation ceremony would not directly strengthen general belief in the ghostly
    character of the rites.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage argues that the death feature of Tamate ritual was not produced
    de novo by aboriginal-immigrant interaction but was based on beliefs brought by
    immigrants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says the belief that strangers were ghosts was not necessary to
    explain the rites but may have helped give prominence to death and to the societies’
    general name.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Secret societies are described as strongest in regions nearest to the archaic
    condition of Melanesian society, and weaker or fewer in the Solomon Islands.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The passage presents an apparent paradox: societies attributed to immigrant
    arrival were most developed where immigrant influence was weak and least important
    where immigrant influence was strong.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage resolves the paradox by saying secrecy would be needed when immigrants
    were surrounded by aboriginal populations, but not when immigrants were ascendant
    in power or number, where the cult could be practiced openly.
  category: sequence
  evidence_refs:
  - ev:5
