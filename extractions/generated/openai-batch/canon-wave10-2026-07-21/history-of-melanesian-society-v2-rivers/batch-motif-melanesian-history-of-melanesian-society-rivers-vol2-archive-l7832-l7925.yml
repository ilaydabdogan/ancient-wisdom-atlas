canonical_text:
  quote: ''
  summary: The passage discusses proposed explanations for the special position of
    the father’s sister in Melanesian kinship. It emphasizes her custody of a nephew’s
    umbilical cord and nail-parings, her close tie to her brother’s child, her position
    in an opposite and potentially hostile moiety, the possible influence of brother-sister
    avoidance on respect toward her, Banks Islands distinctions between limited and
    classificatory father’s sisters, and Mota/Pentecost customs concerning the father’s
    sister’s husband, including sanctioned insult in Mota.
  language: English
  quote_policy: summarized
