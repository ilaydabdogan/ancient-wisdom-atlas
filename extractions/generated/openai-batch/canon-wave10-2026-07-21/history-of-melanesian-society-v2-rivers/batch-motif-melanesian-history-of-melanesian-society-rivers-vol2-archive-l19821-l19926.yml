canonical_text:
  quote: ''
  summary: The passage distinguishes offerings and prayers directed to ghosts from
    offerings connected with vui or spirits in the Banks Islands and northern New
    Hebrides. Offerings connected with vui are described as payments or offerings
    to human owners of powerful objects or places rather than direct worship of the
    spirit. Ghosts, by contrast, receive direct prayers and offerings, including burnt
    offerings in northern Melanesia, and the ghost cult is linked with kava and tataro
    prayers. The author proposes cultural-historical assignments of ghost worship
    to the kava-people and the magic/vui complex possibly to the dual people or to
    interaction between groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man seeking a benefit goes to someone known to possess a stone or other
    object by which that benefit may be obtained, and gives money or another offering
    to that person.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The act of giving in that context is said to be oloolo to the man, and the
    passage states that it does not seem to be an offering to a non-human being.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that no definite formulas are recorded for these offerings
    connected with vui, and that when prayer occurs at a stone or abiding place of
    a vui it is directed to ghosts of predecessors rather than to the vui.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the northern New Hebrides, offerings are made in connection with both ghosts
    and spirits; in the spirit case, the offering is made to the owner of the object
    or place connected with the vui.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The only two recorded formulas mentioned by the author concern one offering
    to ghosts and one offering to a personal variety of vui called Tagctro.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author states that northern Melanesian offerings to ghosts are burnt,
    while this practice is unknown in the south.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prayers and offerings to the dead are described as addressed or offered directly
    to ghosts, while the passage says there is no evidence for prayer in the cult
    of vui.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The procedure involving a vui is compared in the passage to paying the owner
    of a spell or other magical instrument.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The author states that prayers called tataro are closely connected with kava,
    and that in the Banks Islands and Torres Islands prayers are offered when kava
    is used, to ghosts of the dead.
  category: relationship
  evidence_refs:
