canonical_text:
  quote: ''
  summary: The passage discusses incision, circumcision, and tattooing in Polynesia
    and Melanesia. It attributes incision and related practices to interactions among
    earlier populations, kava-people, and indigenous women; links concealment after
    incision with fear of narak or magic; notes circumcision/seclusion in certain
    men's rites; contrasts male-focused Polynesian tattooing with female-focused Melanesian
    tattooing; and summarizes a Fijian myth explaining female tattooing as the result
    of an accidental reversal of a phrase learned in Samoa.
  language: English
  quote_policy: summarized
