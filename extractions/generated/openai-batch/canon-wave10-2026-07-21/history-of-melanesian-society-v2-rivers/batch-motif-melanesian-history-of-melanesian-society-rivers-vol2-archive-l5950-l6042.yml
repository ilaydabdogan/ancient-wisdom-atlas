canonical_text:
  quote: ''
  summary: The passage discusses reciprocal exchange marriages, bride-price, and a
    proposed historical development of Melanesian marriage rules. It argues that exchange
    marriage is not a regular institution in the Melanesian region under discussion
    and is probably better explained as a way to avoid bride-price than as a direct
    consequence of cross-cousin marriage. It then outlines a scheme in which marriage
    shifted from prescribed unions with certain relatives toward prohibition of kin
    marriage and increasing regularity of wife purchase or bride-price, possibly as
    compensation to those who would otherwise have had claims on a woman as a potential
    wife.
  language: English
  quote_policy: summarized
