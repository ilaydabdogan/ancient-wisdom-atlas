canonical_text:
  quote: ''
  summary: The passage compares kinship nomenclature in Melanesian and Polynesian
    communities, especially terms for cross-cousins, in-laws, spouses, grandparents,
    and grandchildren. It argues that several systems reflect or preserve traces of
    cross-cousin marriage, marriage with the mother's brother's wife, or broader classificatory
    grouping of kin terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the inland people of Viti Levu, both cross-cousins and the wife's brothers
    and sisters are called tavale, while other terms also exist for relationships
    by marriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Guadalcanar, all varieties of brother-in-law and sister-in-law are called
    iva, and cross-cousins also use iva for one another.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Ysabel and Florida, special terms for cross-cousins are reported, with
    the passage treating them as possibly modern innovations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Anaiteum, the daughter of the mother's brother or father's sister is called
    engak whether or not she is married to the speaker, and engak is also the term
    for wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Anaiteum, cross-cousins of different sex address and speak of one another
    as if they were man and wife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Buin, the mother's brother is classed with the father-in-law, the father's
    sister with the spouse's mother, the father's sister's son with the wife's brother,
    and certain women related through brother-sister descent use a term also used
    by husband's sister and brother's wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports that recorded Buin pedigrees show occasional cross-cousin
    marriage, although the source cited did not state directly whether the practice
    was current.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Banks Islands and Pentecost, cross-cousin terms are described as unrelated
    to cross-cousin marriage and instead explained through marriage with the wife
    of the mother's brother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Torres Islands, especially Hiw, marriage with both the uncle's wife
    and the cross-cousin is said to be current or formerly practiced, and terms for
    cross-cousins are described as confused.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Loh, cross-cousins are not distinguished terminologically from other cousins
    or from brothers and sisters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that throughout Polynesia there is only one term for grandparent
    and only one for grandchild, with local variations in Samoa, Niue, Peleni, and
    coastal Viti Levu.
  category: relationship
  evidence_refs:
  - ev:7
