canonical_text:
  quote: ''
  summary: The passage presents an ethnographic argument about the distinction between
    coastal and interior or bush populations in Melanesia. It links coast peoples
    with seafaring, fishing, swimming, canoe-making, and immigrant ancestry, while
    linking bush peoples with agriculture, interior residence, and possible earlier
    or mixed population strata. It then compares the Solomons, Malaita, southern Melanesia,
    Fiji, the matrilineal Solomon region, and Viti Levu in terms of hypothesized dual,
    kava, and betel population elements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Native accounts distinguish bush-people and coast-people chiefly by occupation:
    coast-people are associated with the sea, fishing, and seafaring, while bush-people
    are associated with agriculture and lack of navigation knowledge.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that if Melanesia contained both an indigenous element and
    an immigrant element arriving by sea, the observed coast/interior cultural differences
    would be expected.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A simple explanation is described in which bush-people represent the earliest
    population stratum and coast-people descend from immigrants who married indigenous
    women; the author immediately says this explanation is not fully adequate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The differentiation between bush- and coast-peoples is said to be especially
    prominent in the Solomons and particularly pronounced in Malaita.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Under the author's scheme, southern Melanesia is described as a blend of dual
    people and kava-people, while the Solomons also include an element furnished by
    betel-people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author suggests that kava-people may have influenced dual people widely,
    while the stricter limitation of sea-going people to the coast in some Solomon
    Islands may have followed the arrival of betel-people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author proposes that present Solomon bush-people may represent fusion
    between dual people and kava-people, while coastal people may descend from betel-people
    through marriages with women of a mixed population.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author suggests that bush-people in islands such as Malaita may share
    the same racial and cultural elements as the matrilineal region of the Solomons.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author states that little is known about the culture of Solomon bush-people
    and turns to Viti Levu as a possible test case for the hypothesis.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that coast/bush differentiation also occurs without betel-people
    in southern Melanesia and Fiji, where it is attributed to a stronger immigrant
    element and stronger kava influence on the coast.
  category: relationship
  evidence_refs:
  - ev:7
