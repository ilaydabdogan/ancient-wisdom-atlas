canonical_text:
  quote: ''
  summary: The passage compares Dukduk societies with related secret or ritual societies
    in the Bismarck Archipelago, Bougainville, the Banks Islands, and eastern Polynesia.
    It describes masks, bullroarers, initiation restrictions, pig payments, ghost
    representation, taboo protection of property, gendered masks, and a proposed link
    between Tamate birth-and-death ritual and annual solar changes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says there is little to connect the Dukduk societies with animals;
    a tubuan mask may be called or said to represent a bird, but this naming is especially
    used before the uninitiated and is not treated as highly significant.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Barriai and Kilenge have an aulu or bokumu dance using a cylindrical mask;
    the dance is restricted to initiated persons, while others are warned away by
    the bullroarer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A new member may see the bullroarer after paying one pig and gains admission
    to the dance through payment of a second pig.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The use of the bullroarer in the Barriai and Kilenge case is presented as
    suggesting a possible source for mysterious sounds in the Dukduk society.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the southern end of New Ireland the Dukduk is described as extinct, formerly
    important, and probably a source from which the organization reached districts
    where it then flourished.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Rukruk of northern Bougainville is compared with Dukduk through similar
    names and meeting-place terms.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rukruk initiates wear cylindrical or globular head-coverings and are believed
    to be ghosts.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The special sound of the Rukruk is produced by the bullroarer; the passage
    also notes bullroarer use in the Matambala of the British Solomons and says the
    Dukduk sound was probably produced this way.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dukduk and Tamate societies are both described as composed of initiated men
    who meet secretly in the bush and wear masks, especially in dealings with the
    uninitiated.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that belief in members representing ghosts of the dead
    is almost certainly common to Dukduk and Tamate, and that both can protect private
    property by taboo.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Banks ritual includes male and female masks occurring in pairs as possessions
    of allied societies; the different sex of tubuan and dukduk is connected with
    a belief that one is mother of the other, and male masks in Tamate and Dukduk
    are distinguished by length.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage describes the Dukduk society as an intermediate link between the
    Tamate liwoa society of southern Melanesia and the Areoi societies of eastern
    Polynesia.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The author reports a suggestion that the birth and death of the Tamate in
    the Banks Islands may survive a celebration of annual changes of the sun, which
    are said to be the special object of Areoi ritual in the Marquesas.
  category: relationship
  evidence_refs:
  - ev:8
