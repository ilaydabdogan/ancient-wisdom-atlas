canonical_text:
  quote: ''
  summary: The passage discusses seasonal and solar interpretations of ritual societies
    in Melanesia and Polynesia. It states that the Dukduk of the Bismarck Archipelago
    is born and dies at points in the monsoon cycle, and connects Bismarck practice
    with a Vuatom ceremony at the southern solstice celebrating the sun’s change from
    southward to northward movement. The author compares this with Areoi ritual in
    the Marquesas, especially first-fruits offerings, and proposes a common origin
    for Areoi, Dukduk, Matambala, and Tamate liwoa/Tamate hwoa rituals in a solar
    cult. The passage then turns to the Ingiet organization, comparing it with the
    Tamate societies, noting multiple societies, shell-money in initiation, seclusion,
    and a restoration of initiates described as return from death to life.
  language: English
  quote_policy: summarized
