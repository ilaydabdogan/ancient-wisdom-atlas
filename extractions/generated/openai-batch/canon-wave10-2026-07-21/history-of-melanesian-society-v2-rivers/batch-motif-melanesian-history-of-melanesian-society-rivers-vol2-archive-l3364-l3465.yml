  summary: The passage introduces a chapter on Melanesian social organisation. Rivers
    classifies Melanesian social systems into four types and argues that dual organisation
    with matrilineal descent was formerly more widespread than its current distribution.
    He treats anomalous marriage forms as evidence for an earlier dual organisation
    combined with dominance by old men, and compares evidence from Fiji, Bougainville,
    the Torres Islands, the Banks Islands, Santa Cruz, and Pentecost Island.
  language: English
