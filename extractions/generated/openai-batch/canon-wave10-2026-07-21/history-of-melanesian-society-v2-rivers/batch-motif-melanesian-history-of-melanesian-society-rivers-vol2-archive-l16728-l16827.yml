canonical_text:
  quote: ''
  summary: The passage presents an ethnological reconstruction of Melanesian totemic
    and descent systems. It discusses possible local totemic sub-groups at Kia, sacred
    objects and ghostly ancestors associated with totems, possible influence of betel-people,
    and comparisons among the Solomons, Shortland Islands, Buin, Santa Cruz, and Viti
    Levu regarding totemism, dual organization, matrilineal or patrilineal transmission,
    and exogamy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that, if Kia sub-groups are localized, they would form local
    totemic groups within three main groups derived from moieties of a dual system.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author contrasts the supposed Kia condition with the Banks Islands by
    saying the totemic character of immigrant-derived grouping would have remained
    part of the public social structure rather than being hidden in a secret organization.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sacred objects named tindalo, tindao, tindadlio, or manjali are said to include
    animals, the sun, and the moon, and the sun is identified as the totem of one
    Kia sub-group.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ghostly ancestors and images are said to be associated with the sacred objects.
  category: relationship
  evidence_refs:
  - ev:2
