  evidence_refs:
  - ev:2
- id: obs:5
  text: Cross-cousins are described as actual or potential man and wife under a special
    form of marriage regulation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Tikopia, cross-cousins must avoid speaking evil of or injuring one another;
