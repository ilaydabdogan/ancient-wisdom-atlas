  quote: ''
  summary: Rivers discusses Melanesian kinship customs involving the father's sister
    and her husband, cross-cousins, and grandparents. The passage treats these as
    marriage, avoidance, insult, inheritance, ceremonial distribution, mutual-help,
    naming, and descent-related functions across Mota, Tikopia, Vanikolo, Rowa, Motlav,
    the Torres Islands, and Eromanga.
  language: English
  quote_policy: summarized
