  summary: The passage proposes that old men’s dominance over young women and the
    transfer of wives or daughters to younger male kin can explain several Melanesian
    marriage forms, including marriages involving a mother’s brother’s wife, a grandfather’s
    wife, a granddaughter, and cross-cousins. It also notes resulting social paternity
    and age disparities among those classed as siblings.
