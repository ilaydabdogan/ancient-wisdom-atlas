canonical_text:
  quote: ''
  summary: 'The passage proposes that descendants of immigrant kava-people fused with
    the dual people and that a widespread immigrant language displaced many small
    local languages. It argues that Melanesian secret societies, especially Sukwe
    and Tamate, and the common life of the gamal and salagoro helped spread the founders''
    language, particularly through the early admission or initiation of children into
    male communal life. It then lists causes for present diversity in Melanesian languages:
    influence from earlier inhabitants, later immigrants such as the betel-people,
    and isolation, with vocabulary and phonetics highlighted as especially variable.'
  language: English
  quote_policy: summarized
