  summary: The passage compares Melanesian and Australian kinship systems and argues
    that certain relationship-term correspondences are best explained as survivals
    or traces of former marriage institutions involving partners separated by one
    or two classificatory generations, especially marriage with the wife of the father's
    father or with the wife of the mother's brother.
