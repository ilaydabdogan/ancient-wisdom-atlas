canonical_text:
  quote: ''
  summary: Rivers compares Melanesian, Fijian, and Polynesian kinship terminologies
    to infer patterns of cross-cousin marriage. He then discusses the Santa Cruz term
    kandongi as likely marking avoidance and marriage prohibition rather than direct
    cross-cousin marriage, and outlines cross-cousin terminology in Polynesia, Tikopia,
    Fiji, and Mbau.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Guadalcanar, the mother’s brother and father-in-law share the term nia,
    while the father’s sister, wife of the mother’s brother, and mother-in-law share
    the term tarungo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Anaiteum, the father’s sister, wife of the mother’s brother, and mother-in-law
    are grouped with the mother as resik, while the mother’s brother, father’s sister’s
    husband, and father-in-law are called matak; Tanna and Aniwa are said to show
    similar correspondences.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In parts of the Solomons, including Rafurafu, Florida, and Bugotu, the passage
    describes less complete correspondences between terms for in-laws and terms for
    the consorts of the mother’s brother or father’s sister.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Hiw, the wife of the mother’s brother may be called kwiiga, a term otherwise
    used for the wife’s mother, and the passage says cross-cousins often marry there.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author states that systems with common designations for the mother’s brother,
    father’s sister’s husband, and father-in-law, and another common designation for
    the father’s sister, mother’s brother’s wife, and mother-in-law, occur where cross-cousin
    marriage is or has been practised, or in closely allied cultures.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: In Santa Cruz, the wife of the mother’s brother is called kandongi; the same
    term is also used for the wife’s mother and by a woman for her husband’s elder
    brother.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that a wife of the mother’s brother may not be married
    or even seen by her husband’s nephew.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author suggests that kandongi connotes avoidance and prohibition of marriage
    rather than direct connection with cross-cousin marriage.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: The term kandongi is also applied by a man to his wife’s father and to his
    younger brother’s wife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says Polynesia generally does not distinguish different kinds
    of cousin, except Tikopia, where cross-cousins and other cousins have distinct
    terms.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: In Fiji, special terms for cross-cousins are described by sex category, and
    these terms are also used for brothers- and sisters-in-law; in Mbau, the wife’s
    brother is tavale.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
