canonical_text:
  quote: ''
  summary: The passage argues from the distribution of kava and betel that different
    cultural groups influenced regions of Melanesia, Fiji, and Polynesia. It treats
    Santa Cruz, Tikopia, and the Solomon Islands as cases of possible cultural mixture,
    and proposes that features such as ghost cult, totemism, taboo, and secret societies
    in the Solomon Islands' matrilineal region may preserve elements associated with
    the kava-people and Tamate societies.
  language: English
  quote_policy: summarized
