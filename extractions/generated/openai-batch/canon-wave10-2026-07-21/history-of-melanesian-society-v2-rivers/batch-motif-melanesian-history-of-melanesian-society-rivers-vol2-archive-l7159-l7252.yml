  summary: The passage introduces a discussion of privileges, duties, and restrictions
    associated with kinship. It summarizes an ethnographic argument that abundant
    functions of relatives correlate with richer relationship terminology, while simpler
    systems have fewer such functions. The author notes limits in fieldwork coverage,
    compares regional distributions, then begins the section on parents and children
    by emphasizing the recognized importance of the father in matrilineal communities,
    while also noting customs such as Banks Islands adoption and a Mota rule forbidding
    a man and his father to eat together.
