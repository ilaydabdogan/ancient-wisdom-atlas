canonical_text:
  quote: ''
  summary: The passage introduces a chapter on Melanesian material culture, emphasizing
    the loss of manufacturing processes and rites, the need to relate collected objects
    to social and religious institutions, and a contrast between the plastic persistence
    of social-religious forms and the more rigid survival, replacement, or disappearance
    of material objects. It notes that obsolete objects may survive in sport or religious
    rites, and that object features such as canoe protuberances may preserve traces
    of former functions.
  language: English
