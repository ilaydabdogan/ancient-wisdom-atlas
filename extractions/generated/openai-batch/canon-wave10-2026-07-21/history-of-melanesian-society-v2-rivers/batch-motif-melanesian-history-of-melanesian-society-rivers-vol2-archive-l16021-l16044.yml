canonical_text:
  quote: ''
  summary: The passage explains teknonymy, the custom of calling people by the names
    of their children, as occurring in Fiji, the Banks Islands, and elsewhere in Melanesia.
    It proposes that intermarriage between peoples of different race and language
    could make children an intermediate link whose familiar names were used to identify
    parents. It also connects the practice with avoidance of relatives' names, notes
    that in Fiji calling a man the father of his child is honorific, and allows an
    alternative possibility that relations between peoples helped preserve a custom
    already known to immigrants.
  language: English
  quote_policy: summarized
