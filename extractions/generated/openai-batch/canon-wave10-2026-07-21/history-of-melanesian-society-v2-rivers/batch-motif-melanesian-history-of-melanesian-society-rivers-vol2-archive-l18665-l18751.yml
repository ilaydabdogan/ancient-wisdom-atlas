canonical_text:
  quote: ''
  summary: The passage argues that differences between Melanesian and Polynesian property
    systems may be explained by different modes of settlement by the kava-people.
    In Melanesia, independent settlements and reciprocal needs between immigrant and
    indigenous communities are said to have led to money and stimulated individual
    property. In Polynesia, the kava-people are hypothesized to have been accepted
    as chiefs with divine attributes among earlier communistic settlers, so they did
    not need money and did not greatly disturb communal property tendencies.
  language: English
  quote_policy: summarized
