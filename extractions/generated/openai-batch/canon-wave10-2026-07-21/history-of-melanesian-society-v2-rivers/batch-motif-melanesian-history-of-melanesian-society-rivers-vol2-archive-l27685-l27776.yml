canonical_text:
  quote: ''
  summary: 'The passage argues that kava- and betel-culture labels should be used
    cautiously for Oceania, then discusses Oceanic megaliths as a case where comparison
    with other world regions is tempting. It presents a tentative two-stream model
    for Oceanic megalithic culture: one stream linked with extended interment in a
    stone house-like structure, and another, probably later, linked with cremation
    and a developed sun cult. The author emphasizes caution in linking Oceanic component
    cultures to other parts of the world.'
