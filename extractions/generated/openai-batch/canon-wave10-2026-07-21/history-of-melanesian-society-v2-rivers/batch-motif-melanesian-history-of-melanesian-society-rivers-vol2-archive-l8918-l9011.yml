canonical_text:
  quote: ''
  summary: Rivers argues that changes from earlier marriage arrangements to cross-cousin
    marriage would create serious confusion in Pentecost kinship terminology. He considers
    whether external influence from alien peoples may have contributed to social evolution
    in Melanesia, citing a Torres Islands man settled in Pentecost who could not understand
    the local relationship system. He then turns to linguistic comparison, noting
    that some relationship terms are widely diffused across Melanesia while the archaic
    Pentecost system lacks these widespread terms for grandparents, grandchildren,
    and relatives by marriage; Banks Islands systems use forms of the terms tupu or
    tumbu for grandparents and grandchildren.
  language: English
