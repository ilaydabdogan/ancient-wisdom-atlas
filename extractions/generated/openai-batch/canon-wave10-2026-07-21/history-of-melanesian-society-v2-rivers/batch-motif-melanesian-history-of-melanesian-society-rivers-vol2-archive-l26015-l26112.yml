  quote: ''
  summary: The passage discusses totemism, bird-associated clans and moieties, ancestor
    masks and carvings, tales in which birds protect humans from malignant animal
    beings, and regional mortuary practices in Siara, Northern New Ireland, New Hanover,
    and nearby islands.
