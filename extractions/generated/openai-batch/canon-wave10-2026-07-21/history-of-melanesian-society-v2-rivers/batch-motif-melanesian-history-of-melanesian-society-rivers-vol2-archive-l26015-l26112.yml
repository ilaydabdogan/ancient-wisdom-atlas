literal_observations:
- id: obs:1
  text: The Siara social organization is described as an anomalous form of totemism
    in which totems may be eaten, and two totems are birds connected with moieties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Northern New Ireland, New Hanover, and adjacent islands are described as having
    no evidence of a dual system but having totemic clans whose totems are exclusively
    birds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:3
  text: Complicated masks and carvings from this part of the Bismarck Archipelago
    are said to be connected with a cult of dead ancestors.
  category: object
  evidence_refs:
  - ev:4
- id: obs:4
  text: The rites involving the masks are described as public ceremonies in which
    the whole people take part, unlike the secret cult of the dead in the dual region.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Many carvings represent incidents from tales about birds and other animals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the carvings and associated tales, birds represent beneficent ancestral
    ghosts, while animals such as the snake, lizard, shark, dolphin, and pig represent
    malignant beings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The general motive of the tales is described as the guardianship of humans
    by birds.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The birds protect their human adherents from misfortunes threatened by the
    evil beings represented by the other animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tales portray a struggle between two kinds of animals in which the birds
    obtain mastery.
  category: sequence
  evidence_refs:
