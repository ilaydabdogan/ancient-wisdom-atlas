canonical_text:
  quote: ''
  summary: The passage discusses whether Melanesian social subdivisions and totemic
    groups have a local character, noting limited and mixed evidence from the Torres
    Islands, Pentecost, the Banks Islands, Santa Cruz, Temotu, the Eastern Solomons,
    Kia, Buin, and the Shortlands. It then describes a form of social organisation
    without exogamous clans, where marriage is regulated by genealogically traceable
    kinship, especially the Eddystone taviti, which includes relatives on both paternal
    and maternal sides.
  language: English
  quote_policy: summarized
