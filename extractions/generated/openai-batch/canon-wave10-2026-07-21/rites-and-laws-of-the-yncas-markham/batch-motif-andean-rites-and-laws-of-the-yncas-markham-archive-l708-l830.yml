candidate_motifs:
- id: motif:1
  label: Punishment by petrification and fire from heaven
  taxonomy_refs:
  - divine_judgment
  - world_destroying_fire
  basis: People are said to be turned to stone for disobedience by command of the
    Creator, and fire from heaven destroys many people at Pucara.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The heavenly fire destroys a great part of the people in one locale, not
    the entire world; the stone transformation is reported as a fable and also rationalized
    by the narrator as ancient stonework.
- id: motif:2
  label: World-ordering naming journey
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: The Creator’s sons traverse complementary regions, name plants, rivers, and
    trees, and teach people food, medicine, poison, and other qualities.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage frames the figures as sons of the Creator rather than using
    the term culture hero.
- id: motif:3
  label: Ascent to heaven after completing earthly mission
  taxonomy_refs:
  - ascent
  basis: Ymaymana Viracocha and Tocapo Viracocha ascend to heaven after accomplishing
    their work in the world.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives no further details about the ascent route or ritual
    meaning.
- id: motif:4
  label: Creation place where beings receive names and qualities
  taxonomy_refs:
  - world_center
  - duality
  basis: Tiahuanaco is described as the place where all mankind was created and where
    birds, beasts, serpents, and lizards are made; birds are created male and female
    and assigned songs and places.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The text calls Tiahuanaco the creation place but does not explicitly call
    it a world center; duality is limited to the male/female pairing.
- id: motif:5
  label: Deluge survivor pair on a rising mountain
  taxonomy_refs:
  - flood_and_renewal
  - survivor_pair
  - cosmic_mountain
  basis: Two brothers survive the deluge on Huaca-ynan, and the mountain rises as
    the flood waters rise.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The story is specifically associated with the Cañaris rather than all
    humanity in the passage.
- id: motif:6
  label: Supernatural provisioning after catastrophe
  taxonomy_refs:
  - sacred_exchange
  basis: After the flood, the brothers suffer hunger and repeatedly find food and
    chicha in their house, later discovering guacamayo bird-women preparing it.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: There is no explicit exchange; the taxonomy reference is approximate because
    the passage describes provisioning rather than reciprocal trade.
- id: motif:7
  label: Bird-woman ancestral mother
  taxonomy_refs:
  - shapeshifter
  - sacred_birth
  basis: The guacamayos appear as birds dressed like Cañaris with women’s faces; the
    smaller one bears six sons and daughters from whom the Cañaris are said to descend.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The text does not state that the birds transform, only that they appear
    as bird-women; the sexual encounter is coercive and is not described as marriage.
- id: motif:8
  label: Ancestral huaca and venerated bird
  taxonomy_refs: []
  basis: The Cañaris regard Huaca-ynan as a huaca, venerate guacamayos, and value
