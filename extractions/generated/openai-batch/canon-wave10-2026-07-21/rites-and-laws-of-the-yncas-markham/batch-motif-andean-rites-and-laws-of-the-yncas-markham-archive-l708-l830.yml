    sent to their respective places.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people described in the passage believe the Creator and his sons were
    not born of woman and were unchangeable and eternal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Cañari fable, two brothers survive the deluge on a high mountain called
