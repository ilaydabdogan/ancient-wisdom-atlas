  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the flood subsides, the brothers run out of provisions, build a small
    house, live on herbs and roots, and repeatedly find food and chicha prepared there
    without knowing who brought it.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The elder brother hides and sees two guacamayo birds dressed as Cañaris, with
    women’s faces, preparing food; when he appears, they become angry and fly away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The younger brother later hides; the two birds return, and the brothers shut
    the door, capture the smaller bird while the larger escapes, and have carnal knowledge
    of the smaller bird, who bears six sons and daughters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The smaller guacamayo lives with the brothers on the hill for a long time;
