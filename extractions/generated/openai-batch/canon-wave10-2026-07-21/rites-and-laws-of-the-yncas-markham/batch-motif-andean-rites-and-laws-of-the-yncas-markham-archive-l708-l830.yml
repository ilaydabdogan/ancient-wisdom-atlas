canonical_text:
  quote: ''
  summary: 'The passage recounts several Andean fables: people are turned into stones
    and fire from heaven destroys people at Pucara; the Creator sends Ymaymana Viracocha
    and Tocapo Viracocha across mountains, forests, and plains to name plants, rivers,
    and other things and instruct people in their uses before they ascend to heaven;
    at Tiahuanaco birds, beasts, serpents, and lizards are created in male and female
    forms and assigned qualities. It then gives a Cañari flood origin story in which
    two brothers survive on a mountain that rises with the waters, are secretly fed
    by guacamayo bird-women, capture one, and become ancestors of the Cañaris through
    her children. A following Ancasmarca flood fable begins with sheep watching the
    stars and warning a shepherd, but the supplied passage cuts off before the warning
    is completed.'
  language: English
  quote_policy: summarized
