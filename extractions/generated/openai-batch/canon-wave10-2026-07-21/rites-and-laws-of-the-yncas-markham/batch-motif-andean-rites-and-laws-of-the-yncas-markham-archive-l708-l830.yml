comparison_claims:
- id: claim:1
  claim: The Cañari flood account and the opening of the Ancasmarca account share
    a flood-frame pattern, but the supplied passage preserves only the beginning of
    the Ancasmarca version.
  claim_level: same_motif
  target: Local Andean flood fables within the supplied passage
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: Only one full flood-survival episode is supplied; the Ancasmarca account
    is truncated.
- id: claim:2
  claim: 'The journeys of Ymaymana Viracocha and Tocapo Viracocha have the same function
    as a culture-hero or wisdom-giver motif: they organize the landscape by naming
    and teach practical knowledge to people.'
  claim_level: same_function
  target: culture_hero and wisdom motif families
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is a functional classification using the supplied taxonomy, not
    a claim of historical contact with other traditions.
- id: claim:3
  claim: The Pucara episode partially matches a divine judgment or heavenly-fire pattern
    because destruction and petrification are linked to disobedience and command of
    the Creator.
  claim_level: same_function
  target: divine_judgment and world_destroying_fire motif families
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The fire is local rather than world-destroying, and the narrator explicitly
    treats some stone-transformation stories as invented explanations for ancient
    stone blocks.
