canonical_text:
  quote: Thus he rewarded and granted privileges to all the animals that gave him
    news that accorded with his wishes, and cursed all those whose tidings were not
    agreeable to him.
  summary: Coniraya grants privileges or curses to animals according to the news they
    give him. At the sea-shore he finds Cavillaca and her child turned to stone, encounters
    daughters of Pachacamac who guard a serpent, and causes the younger daughter to
    flee in bird form. Angered at Urpi-huachac, he empties her pond fish into the
    sea, explaining the presence of fishes there. Urpi-huachac pursues him and attempts
    a rock trap, which he avoids through wisdom, then he returns to Huarochiri and
    plays tricks. The narrator connects the traditions to continuing local animal
    taboos and ceremonial practices involving condors, a fox, a lion skin, and llama
    killing.
  language: English
  quote_policy: quoted
