canonical_text:
  quote: ''
  summary: The passage rejects Montesinos as an authority, introduces Francisco de
    Avila's Huarochiri account as a rare source on pre-Inca Peruvian coast religion,
    describes Inca conquest and Quechua linguistic influence, explains the mixed divine
    name Coniraya Uiracocha, locates Huarochiri in the Andes, reports a tradition
    that in Coniraya's days the land was yunca and crops ripened in five days, and
    lists material and linguistic evidence for the coast people.
  language: English
