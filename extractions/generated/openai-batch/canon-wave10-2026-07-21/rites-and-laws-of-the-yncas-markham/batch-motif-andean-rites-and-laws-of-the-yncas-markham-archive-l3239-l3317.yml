canonical_text:
  quote: ''
  summary: The passage describes Tonapa or Tarapaca as a wandering teacher who heals,
    speaks many languages, gives a staff-fragment bearing precepts, curses communities
    that reject him, destroys an idol on a hill, carries a cross to a mountain, and
    sprinkles a chief's daughter with water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tonapa/Tarapaca is described as a lean, grey-haired wanderer with long hair,
    a long shirt, a staff, a mantle, and a book.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:2
  text: He teaches the natives lovingly, calls them sons and daughters, heals the
    sick by touch, and speaks all languages better than the natives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage gives several names and titles for him, including Tonapa, Tarapaca,
    Thonapa, and Tonapa Uiracocha, and it asks whether he was St. Thomas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Paccari-tampu, Apo-tampu receives Tonapa as a guest during a marriage feast
    and listens to his doctrines, while the vassals hear unwillingly.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tonapa gives Apo-tampu a stick from his own staff, and people mark and score
    precepts on it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports that old men identified the marked precepts as commandments
    of God, especially seven precepts, while also saying they lacked Christian names.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Yamqaesupa, Tonapa is treated with contempt, driven away, and then curses
    the village, which becomes covered with water and is identified as a lake.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the high hill Gacha-pucara there is an idol in the form of a woman; Tonapa
    hates it, burns it, and destroys it with the hill.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A footnote says human sacrifices were offered to the female-form idol.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: In another town holding a wedding festival and banquet, people refuse to hear
    Tonapa's preaching and are cursed and turned into stones.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Tonapa erects a large cross in the mountains of Caravaya, carries it to the
    mountain of Garapucu, preaches loudly, and weeps.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A chief's daughter is sprinkled on the head with water while Indians observe.
  category: action
  evidence_refs:
  - ev:11
