canonical_text:
  quote: ''
  summary: The passage describes Ccapacocha sacrifices and the reverence shown to
    those carrying them; the sacrifice of selected conquered people to the Sun after
    victories; the making sacred of especially beautiful things; worship and offerings
    at mountain summits and passes; and an account attributed to Luis de Olivera concerning
    Taqui Uncu, apostasy, fear of Spaniards extracting ointment from Indian bodies,
    and beliefs that destroyed huacas had revived, joined Pachacama and Titicaca,
    fought God, and that Spaniards and their cities would be destroyed by the sea.
  language: English
  quote_policy: summarized
