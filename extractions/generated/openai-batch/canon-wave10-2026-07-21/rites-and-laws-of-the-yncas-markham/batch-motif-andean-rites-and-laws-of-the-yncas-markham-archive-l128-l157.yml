  summary: The introductory passage presents Molina as an important authority and
    Balboa's work as a valuable version of early Yncarial traditions. It describes
    a report on fables and rites containing month-by-month ceremonies of the Ynca
    year, including priestly prayers, sacrifices, and festivities. It then introduces
    the question of the Ynca Supreme Being or Creator, citing Garcilasso's account
    that the Yncas worshipped the Sun and a higher creator called Pachacamac, understood
    as the animator of the universe, venerated inwardly but without temples.
