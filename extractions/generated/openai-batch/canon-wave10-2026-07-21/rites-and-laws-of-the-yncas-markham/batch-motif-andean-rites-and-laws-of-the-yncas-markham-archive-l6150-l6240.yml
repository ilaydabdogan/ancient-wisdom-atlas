canonical_text:
  quote: ''
  summary: The passage opens a report attributed to Polo de Ondegardo on the Ynca
    lineage and expansion. It states that the Ynca lineage was divided into Hanan
    Cuzco and Hurin Cuzco, rejects a claim that the Yncas came from elsewhere before
    the flood, describes memory preserved by quipus and registers, recounts the Chanca
    conflict under Pachacutec Yupanqui, notes huacas associated with that battle,
    describes expansion toward the worshipped lake of Villca-nota with two rivers
    flowing from it, and characterizes early Ynca expansion as conquest by violence
    and war.
  language: English
  quote_policy: summarized
