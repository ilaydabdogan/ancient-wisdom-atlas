  summary: The chapter opening reports traditions about ancient huacas who appeared
    in human form; Huallallo Caruincho conquers earlier huacas and imposes a rule
    requiring one child in each pair to be sacrificed to him. The passage also describes
    fifth-day revivification of the dead, fifth-day crop growth, a formerly hot Andean
    landscape, Pariacaca driving away Huallallo and the inhabitants, and later worship
    of Coniraya/TJiracocha with coca-leaf oblations before difficult tasks.
