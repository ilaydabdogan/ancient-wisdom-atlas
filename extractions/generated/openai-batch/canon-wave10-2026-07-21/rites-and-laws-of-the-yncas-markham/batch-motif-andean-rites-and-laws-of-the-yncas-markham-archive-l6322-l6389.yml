canonical_text:
  quote: ''
  summary: The passage describes Inca provincial administration, annual reporting
    and tribute to Cuzco, a burden-bearing ceremony by governors, division of settlement
    lands and harvests for deities, huacas, sacrifices, and the Ynca, and the storage
    and redistribution of produce for religious and state needs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After taking control of a province, the Yncas caused scattered inhabitants
    to live in organized communities under officers at graded levels and an Ynca governor
    who reported annually on population, flocks, crops, and other details.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Governors returned to Cuzco each year in February before Raymi, bringing tribute
    from the empire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Every governor entered Cuzco with a burden on his back, and the passage says
    this ceremony was never dispensed with and gave authority to the Yncas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In each settlement, a portion of land was set apart for religion and divided
    among the Sun, Pachayachachic, Chuquilla or thunder, Pacha-mama, ministers, and
    other huacas and places of worship.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says notable features such as springs, fountains, streams, stones,
    valleys, and hill summits called apachetas were made objects of worship.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each worship object had assigned people whose duty was to perform sacrifices
    and who were taught when to sacrifice and what offerings to make.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that village worship followed the same order and manner
    as Cuzco, although Cuzco had more objects of worship.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A large portion of harvests was set aside and stored for religious service;
    part was used in village sacrifices and a larger share was taken to Cuzco.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another share of produce was reserved for the Ynca, stored or sent to Cuzco,
    and used to supply garrisons, servants, relatives, chiefs, and wartime needs.
  category: action
  evidence_refs:
  - ev:7
