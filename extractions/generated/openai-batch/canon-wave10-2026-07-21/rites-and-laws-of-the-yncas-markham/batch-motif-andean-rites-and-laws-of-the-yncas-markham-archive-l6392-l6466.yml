canonical_text:
  quote: ''
  summary: The passage describes Inca tribute administration. Store-houses for the
    Ynca are said to be large and well managed. Lands assigned for tribute to the
    Ynca and to religion were cultivated by inhabitants in ceremonial dress and song,
    while workers ate and drank at the cost of the Ynca and the Sun; aged, infirm
    people, and widows did not join. The report stresses that the produce was tribute
    but the land belonged to the people, so colonial seizure of such land would create
    unjust double tribute. It also explains that coca produce and male animals from
    flocks were taken or counted for the Ynca and religion, while females were excluded
    and local limits were demarcated.
  language: English
  quote_policy: summarized
