canonical_text:
  quote: No living things survived except a man and a woman who remained in a box
  summary: Molina introduces his account of Inca rites as based on elders, leaders,
    and priests who had witnessed or participated in them. He reports that, because
    the people lacked writing, histories and origins were painted on boards in the
    Sun’s house at Poquen Cancha. One painted fable, associated with Manco Ccapac,
    recounts a deluge that destroyed living things, the survival of a man and woman
    in a box, their arrival at Huanaco or Tiahuanaco, and the Creator’s making of
    peoples from clay, assigning them dress, hair, language, songs, seeds, and food,
    giving them life, and sending them underground to emerge from caves, hills, fountains,
    and tree trunks.
  language: English
  quote_policy: quoted
