canonical_text:
  quote: ''
  summary: 'The passage recounts stages of the conflict between Atahuallpa and Huascar:
    Atahuallpa receives news, takes up arms, assumes the title of Ynca, uses a litter,
    and gathers warriors; commanders on both sides fight several battles; Atahuallpa’s
    captains Quis-quis and Challcuchima win major victories; Huanca Auqui and others
    seek oracular help from the huaca at Pachacamac; Huascar consults huacas and ritual
    specialists, who promise victory and foretell a limit at Ancoyacu, after which
    a Cuzco captain is defeated at the river.'
  language: English
  quote_policy: summarized
