canonical_text:
  quote: ''
  summary: The passage recounts the birth of Ynca Ruca, a Tonapa-associated water
    rite performed for him and later Yncas, provincial accounts of Tonapa as a wise
    old man who banished huacas, idols, and hapi-nunu demons to snowy mountains, the
    preservation of Tonapa's house near Xauxa, a female huaca turned into stone, Ccapac
    Yupanqui's encounters with many huacas, and the succession and ritual practices
    of Ynca Ruca.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ccapac Yupanqui had a son named Ynca Ruca by Mama Corillpaycahua, and there
    was much festivity at the child's birth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ccapac Yupanqui allowed the huacas of each village to be worshipped.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men were sent to Titicaca, where Tonapa had arrived, and water from there
    was brought to pour over the infant Ynca Ruca while Tonapa was praised.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The water was described as being in a basin at a spring on top of rocks, with
    the basin named ccapacchama quispisutuc unu.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Future Yncas had this water brought in a bowl called curi-ccacca and placed
    before them in the Cuzco square Huacay-pata or Cusi-pata, where they honored the
    water touched by Tonapa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Curacas of Asillu and Hucuru described Tonapa Vihinquira as a poor, thin,
    old man with a beard, long hair, and a long shirt, and as a wise councillor in
    state affairs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Curacas and chroniclers said Tonapa banished idols, huacas, and hapi-nunu
    demons to named snowy mountains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Huancas said Tonapa Varivillca had been in their land, made a house to
    live in, and banished local huacas and hapi-nunus to Pariacaca and Vallollo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before their banishment, the idols had harmed people and menaced Curacas so
    that they would offer human sacrifices.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Ynca ordered that Tonapa's house near Xauxa be preserved.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Two stones near Tonapa's house were explained as the place where Tonapa turned
    a female huaca into stone after she fornicated with a man of the Huancas.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ccapac Yupanqui began building Sacsahuaman, extended his territory to Vilcanota,
