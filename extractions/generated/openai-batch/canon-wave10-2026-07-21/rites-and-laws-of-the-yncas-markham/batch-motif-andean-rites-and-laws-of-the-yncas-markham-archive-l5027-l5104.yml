  summary: The passage describes a battle in which fire is used against troops on
    a hill, the night retreat of Quisquis and Chalcuchima, a midnight grease-fire
    omen comparing the camps of Huascar and Atahuallpa, the capture and humiliation
    of Huascar Ynca, the killing of members of his household, and the concealment
    of riches after news of the Spaniards’ arrival.
  language: English
