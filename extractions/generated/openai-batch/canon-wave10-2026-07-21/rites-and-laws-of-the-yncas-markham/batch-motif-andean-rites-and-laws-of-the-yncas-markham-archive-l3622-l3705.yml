canonical_text:
  quote: ''
  summary: The passage reports that chosen men held priestly office during Manco Ccapac's
    life, then describes the succession of Sinchi Rocca Ynca, an episode of lovers,
    love stones, a shepherd, a virgin, huacanqui charms, and a pact with a demon in
    a cave. It says huacas appeared on hills and in streams and that village sacrifices
    began with human blood and other offerings. It then describes Sinchi Rocca's sensuality
    and love charms, the succession and reforms of Ynca Lloque Yupanqui, including
    prohibitions, bodily alterations, houses for classes of virgins, celibate youths
    later made soldiers, and finally the birth of Mayta Ccapac to Mama Tancarayacchi
    Chimpu Cuca, daughter of a huaca of Tancar.
  language: English, with Quechua terms and a Quechua fragment
  quote_policy: summarized
