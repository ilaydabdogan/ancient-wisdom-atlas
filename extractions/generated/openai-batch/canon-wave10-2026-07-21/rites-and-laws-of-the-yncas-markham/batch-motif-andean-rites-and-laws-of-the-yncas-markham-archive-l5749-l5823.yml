canonical_text:
  quote: ''
  summary: 'Huathiacuri appears as a poor, ragged stranger and offers to cure a sick
    father if he receives the man''s young daughter. He diagnoses the sickness as
    connected with the wife''s adultery and with hidden animals: two serpents above
    the house and a two-headed toad under a grindstone. The serpents are killed, the
    adultery is confessed, the toad goes to a spring, and the sick man recovers. Huathiacuri
    then goes to Condor-coto, where five eggs and wind are located; when challenged
    by his rich brother-in-law, he consults his father Pariacaca/Parracaca, who is
    in one of the eggs.'
  language: English
  quote_policy: summarized
