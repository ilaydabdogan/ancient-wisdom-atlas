  text: January, February, and March are named, but the passage says they had no special
    festival and the people attended to work or farms.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In April, called Ayrihuay, the crops were reaped and the harvests gathered;
    youths who had received arms as knights went to Sausiru to fetch maize.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says Mama-huaca, sister of Manco Ccapac, sowed the first maize
