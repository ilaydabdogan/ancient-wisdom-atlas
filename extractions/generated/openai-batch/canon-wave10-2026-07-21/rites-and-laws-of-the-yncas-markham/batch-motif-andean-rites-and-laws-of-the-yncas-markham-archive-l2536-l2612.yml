canonical_text:
  quote: ''
  summary: The passage describes a river procession of sacrifices ordered by the Lord
    Ynca, coca offerings thrown from a bridge at Ollantay-tampu, dancing and thanksgiving
    to the Creator for a good year, and salt objects marking participants' speed.
    It then summarizes months with little or no festival activity and describes April
    harvest rites involving maize from Sausiru, Mama-huaca and her embalmed body,
    maize offerings for sacred and royal figures, and a lamb sacrifice by priests
    for future harvests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord Ynca, being present, commanded Indians on both sides of the river
    to go with the sacrifices to Ollantay-tampu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Villagers along the route were stationed with torches to give light at night,
    and no part of the sacrifices was allowed to remain in the river.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the bridge of Ollantay-tampu, over a great river flowing toward the North
    Sea, two bags of coca were thrown from the bridge as the sacrifices flowed past;
    afterward the sacrifices were allowed to pass on by themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During that day and the next, those who had passed on the sacrifices danced,
    rejoiced, and performed the taqui chupay huayllu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated reason for the river offerings was that the Creator had granted
    a good year, and the people offered from what he had given so that they would
    not appear ungrateful, asking him to receive the sacrifices wherever he might
    be.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After two days the participants returned to Cuzco; those who had gone furthest
