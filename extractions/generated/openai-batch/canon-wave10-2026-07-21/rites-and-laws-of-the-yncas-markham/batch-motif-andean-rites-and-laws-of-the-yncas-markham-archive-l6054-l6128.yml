canonical_text:
  quote: ''
  summary: Pariacaca finds Choque-suso distressed because her maize crop lacks water.
    He restores water from a dam and promises to bring a larger irrigation channel
    in return for her yielding to his love. He summons birds, snakes, lizards, bears,
    lions, and other animals to remove an obstruction and widen channels. A fox first
    acts as canal engineer, but a partridge distracts him, the water runs down the
    hill, and a snake replaces him; the present broken course of the channel is explained
    by this event. After the water reaches the farms, Choque-suso consents, goes with
    Pariacaca to the rocks called Yanacaca, later wishes to remain at the headworks,
    and is transformed into a stone at Cocochalla while Pariacaca goes up the mountains.
  language: English
  quote_policy: summarized
