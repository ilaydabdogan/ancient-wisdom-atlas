canonical_text:
  quote: ''
  summary: The passage describes the Situa festival at the onset of the rains, when
    sickness was expected. The Ynca, nobles, priests, armed men, huaca figures, and
    lineage groups participate in a rite to drive sickness, disasters, misfortunes,
    dangers, and evils out of Cuzco and the wider land. The rite includes exclusion
    of certain people and dogs, armed shouting in the square, four directional groups,
    relay of cries outward, and bathing at a river in one direction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Situa feast is said to be celebrated in this month because the rains began
    and the first rains were generally accompanied by much sickness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people besought the Creator to shield Cuzco and the Yncaconquered territory
    from sickness during the year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the day of the moon's conjunction at noon, the Ynca, his council chiefs,
    and principal lords in Cuzco went to the Ccuricancha, the house and temple of
    the Sun, to arrange how the festival would be celebrated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The High Priest stated that the Situa ceremonies should be performed so the
    Creator might drive diseases and evils from the land.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Armed men equipped for war, including lances, came to the square in front
    of the temple.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Figures called GJniquilla and TJiracocha were brought from their special temples
    to the temple of the Sun, and the priests of these huacas joined the assembly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The priest of the Sun proclaimed the feast with the concurrence of those present.
  category: action
  evidence_refs:
  - ev:4
