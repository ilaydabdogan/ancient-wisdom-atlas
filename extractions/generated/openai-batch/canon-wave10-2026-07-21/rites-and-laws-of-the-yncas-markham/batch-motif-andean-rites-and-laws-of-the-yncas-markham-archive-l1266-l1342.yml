  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Armed people went to the square of Cuzco crying for sicknesses, disasters,
    misfortunes, and dangers to go forth from the land.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the middle of the square stood a gold urn like a fountain, used at the
    sacrifice of chicha.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Four hundred men of war assembled in four groups of one hundred, each facing
