  quote: ''
  summary: Don Juan de Santa Cruz Pachacuti-yahqui Salcamayhua introduces himself
    as a Christian native and descendant of chiefly ancestors. He states that his
    ancestors became Christians at Caxamarca, renounced former rites identified with
    the Devil, were instructed and baptized by Apostolic Priests, destroyed huacas
    and idols, and that God preserved and blessed their descendants. He affirms his
    own continuing Catholic faith and obedience to the Church of Rome.
