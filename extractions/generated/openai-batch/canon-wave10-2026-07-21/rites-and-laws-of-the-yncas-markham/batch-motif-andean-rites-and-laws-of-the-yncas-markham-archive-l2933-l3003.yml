candidate_motifs:
- id: motif:1
  label: Resurrection of sacred powers
  taxonomy_refs:
  - resurrection
  basis: The passage explicitly says preachers declared the resurrection of the huacas.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The resurrected agents are huacas in a colonial report, not a human hero
    or singular deity.
- id: motif:2
  label: Offerings and libations sustaining sacred beings
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Huacas are described as hungry and thirsty because sacrifices and chicha
    ceased; later they receive offerings and sacrifices and are presented as giving
    health, children, and food.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage is mediated through a Christian colonial narrator who characterizes
    the movement negatively.
- id: motif:3
  label: Divine possession as speech and embodiment
  taxonomy_refs: []
  basis: The passage says huacas would be incorporated in men and cause them to speak;
    people then claim huacas entered their bodies and act as ritual representatives.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: No available taxonomy reference directly names possession or oracle embodiment.
- id: motif:4
  label: Restoration of the times of the Yncas
  taxonomy_refs:
  - return
  basis: The preachers announce that the times of the Yncas would be restored, and
    the relic-fragment address tells people to place the support where it was in the
    days of the Yncas.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: This is a restoration or return motif; the passage does not give a full
    narrative of the restored order.
- id: motif:5
  label: Ritual renunciation through fasting and taboo
  taxonomy_refs:
  - initiation
  basis: Returners to huaca love are told to fast and avoid certain foods, Spanish
    things, churches, priests, and Christian names.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The abstinence requirements are explicit, but classification as initiation
    is interpretive and should be reviewed.
- id: motif:6
  label: Divine punishment for religious defection
  taxonomy_refs:
  - divine_judgment
  basis: The huacas are said to be enraged with baptized people and to threaten death
    unless they return to the old belief.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The threat is reported speech in a polemical colonial account.
- id: motif:7
  label: Ritual re-enthronement of sacred relic fragments
  taxonomy_refs:
  - return
  - sacrifice
  basis: Stone fragments of burnt huacas are ritually treated with chicha and maize
    flour and told to be put back in their place from the days of the Yncas, with
    many sacrifices.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage treats the relics as fragments of burnt huacas but does not
    give their earlier destruction context here.
- id: motif:8
  label: Hostile worms placed in enemy hearts
  taxonomy_refs: []
  basis: The preachers announce worms sown in fields to be planted in the hearts of
    Spaniards, Spanish animals, horses, and Christian Indians.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives the image but does not explain its ritual mechanism
    or outcome.
comparison_claims:
- id: claim:1
  claim: The explicit proclamation of the resurrection of the huacas supports a cautious
    same-motif comparison to the resurrection motif family.
  claim_level: same_motif
  target: resurrection motif family
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage applies resurrection to plural huacas in a colonial missionary
    account; it should not be generalized beyond this passage without corroboration.
- id: claim:2
  claim: The reciprocal pattern of offerings and libations to huacas in exchange for
    health, children, food, prosperity, and continued sacred favor supports a same-function
    comparison to sacrifice and sacred exchange motifs.
  claim_level: same_function
  target: sacrifice and sacred_exchange motif families
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The account is not a native-authored ritual manual, and the narrator
    frames the practice as apostasy.
- id: claim:3
  claim: The announcement that the times of the Yncas would be restored and that relic
    fragments should be put back where they were in the days of the Yncas supports
    a cautious comparison to return/restoration motifs.
  claim_level: same_motif
  target: return motif family
  evidence_refs:
  - ev:4
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage describes restoration claims within a colonial religious
    movement but does not provide a full mythic narrative of return.
