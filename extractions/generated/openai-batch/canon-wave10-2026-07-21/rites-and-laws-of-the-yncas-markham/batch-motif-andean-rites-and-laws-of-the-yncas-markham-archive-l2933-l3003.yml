canonical_text:
  quote: ''
  summary: The passage describes Indian preachers proclaiming that the huacas made
    the Indians and their land, had resurrected, and were hungry and thirsty because
    offerings had ceased. The preachers threaten baptized Indians and Spaniards, prescribe
    fasting and rejection of Christian and Spanish practices, announce the restoration
    of the times of the Yncas, and say huacas will now enter human bodies to speak.
    Possessed persons are installed and worshipped with offerings, festivals, sacrifices,
    and rites over stone relic fragments of burnt huacas. The narrator reports that
    the movement spread widely, was punished and reported by Luis de Olivera, lasted
    seven years, and was followed by rising in 1565 as some Indians believed God and
    the Spaniards had been conquered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Indian preachers said the huacas had made the Indians, the land, and pre-Spanish
    possessions, and proclaimed the resurrection of the huacas.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The preachers said the resurrected huacas wandered in the air thirsty and
    hungry because Indians no longer sacrificed or poured out chicha to them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The preachers announced that fields were sown with worms to be planted in
    the hearts of Spaniards, Spanish sheep, horses, and Indians who remained Christians.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: They said the huacas were enraged with baptized people and that such people
    would be killed unless they returned to the old belief and renounced the Christian
    faith.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: People seeking the friendship and grace of the huacas were promised prosperity
    and health and were told to fast and avoid salt, aji, coloured maize, Spanish
    things, churches, priests, and Christian names.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The preachers announced that the times of the Yncas would be restored and
    that huacas would speak by being incorporated in people rather than entering stones
    or fountains.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: People were told to keep houses prepared in case a huaca wished to lodge in
    one of them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Many Indians trembled, fell to the ground, tore themselves, and made faces;
    after becoming quiet, they said that a named huaca had entered their bodies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: People carried a possessed person to a chosen spot, made a lodging with straw
    and cloaks, worshipped the huaca, and offered sheep, colla-chicha, llipta, and
    other things.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A festival lasting two or three days followed, with dancing, drinking, and
    invocation of the huaca represented by the possessed man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Possessed persons preached threats and told people not to serve God but the
    huacas, and to renounce Christianity, Christian names, shirts, hats, and shoes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: When people brought stone relic fragments of burnt huacas, the possessed person
    covered his head with a mantle, poured chicha and white maize flour on the fragment,
    invoked the huaca, and displayed the fragment as a source of health, children,
    and food.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Wizards performed their offices among Indians possessed by huacas and received
    sheep and coys offered as sacrifices.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The narrator says the belief spread to Indians in repartimientos and cities;
    Luis de Olivera punished people and reported the matter to colonial and church
    authorities; the apostasy lasted seven years.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage closes by saying that, as they believed God and the Spaniards
    were conquered, Indians began to rise in 1565.
  category: sequence
  evidence_refs:
  - ev:12
