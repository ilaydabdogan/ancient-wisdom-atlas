  quote: ''
  summary: The passage discusses conflicting claims about Pachacamac, Ticci-Uira-ccocha,
    and related divine names. It reports a cited claim that subjugated tribes were
    ordered to worship Ticci-Uira-ccocha, otherwise called Pachacamac, and that the
    coastal temple of Pachacamac was the only temple to the Supreme Being in Peru.
    The author rejects that temple identification for the Yncas, contrasts Garcilasso
    de la Vega with Molina as sources, and lists divine names or attributes found
    in Molina's prayers, including Pachacamac, Pachayachachic as 'teacher of the universe,'
    and Tecsi-viracocha as 'the incomprehensible God.'
