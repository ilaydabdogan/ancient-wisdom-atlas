  quote: ''
  summary: The passage describes an unnamed Ynca instituting or enforcing veneration
    of huacas, sacrifices, worship of thunder, and a golden human statue in Cuzco.
    It then lists several classes of ritual specialists or sorcerers and their methods
    of divination, including animal lungs, fire with sheep parts and coca, maize and
    sheep dung, thunder-derived healing knowledge, and fire-oracles used by the Yacarcaes
    to inquire about distant persons and crimes.
