canonical_text:
  quote: ''
  summary: 'The passage describes preparations and rites around the huarachicu and
    Ccapac Raymi: families sew and prepare clothing, chicha, shoes, slings, and ornaments
    for youths; youths go to the Huanacauri huaca, sacrifice and request permission
    to receive knighthood, fast, spend the night on the hill, and later receive arms,
    pierced ears, and huara breeches. It also describes daily sacrifices to the Creator,
    Sun, Thunder, and Huanacauri, and offerings of food and chicha to embalmed bodies
    based on belief in the soul''s continuing ability to receive food.'
  language: English
  quote_policy: summarized
