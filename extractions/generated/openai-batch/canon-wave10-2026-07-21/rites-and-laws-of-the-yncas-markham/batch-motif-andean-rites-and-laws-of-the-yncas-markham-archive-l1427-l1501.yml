canonical_text:
  quote: ''
  summary: The passage describes a Cuzco feast in which embalmed noble bodies and
    sacred images are washed, warmed, adorned, brought into the great square, seated
    on gold benches, reverenced by ranked lineages, accompanied by eating, dancing,
    music, prayer for health through another year, and a chicha offering poured through
    a gold-plated stone urn into an underground conduit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Embalmed bodies of dead lords and ladies were brought out by persons of the
    same lineage who had charge of them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the night the embalmed bodies were washed in baths that had belonged
    to them in life, returned to their houses, warmed with cancu, and presented with
    favored food that was later consumed by their custodians.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The huaca called Guanacaucique or Huanacauri, described as a great figure
    of a man, was washed and warmed with sancu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The principal Ynca lord and his wife bathed, put sancu in their house and
    on their hands, and placed changing-color pialco plumes on their heads; the same
    was done with the figure of the Creator in a ceremony called Pilcoyacu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The principal Ynca lord, his wife, and council lords came richly dressed into
    the great square of Cuzco in the morning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The image of the Sun called Apupunchau, the image of the Creator, the image
    of the Thunder called Chuqui-ylla, and the Huanacauri figure were brought into
    the square and placed in their assigned places.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Priests of the Sun brought two gold figures and their women called Ynca-Ocllo
    and Palla-Ocllo; Coya-facssa, dedicated to the Sun and described as the ruler's
    sister or daughter, also came forth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each sacred image had a gold bench, and yauris shaped like gold sceptres were
    borne before them.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that no woman was assigned to the huaca of the Creator,
    because the Creator was believed not to need women, and that the first sacrifice
    was offered to the Creator.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: All embalmed bodies of lords and ladies were brought out richly adorned, carried
    by descendants, and seated on gold seats according to the order in which they
    had lived.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The people of Cuzco came out by tribes and lineages, made reverences to the
    Creator, the Sun, and the lord Ynca, and sat by rank with Hanan-Cuzcos on one
    side and Hurin-Cuzcos on the other.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The people spent the day eating, drinking, and performing the tauqi called
    alancitua saqui while wearing red shirts and garlands and accompanied by cane-tube
    music called tica-tica.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The participants thanked the Creator for sparing them to see the day, prayed
    to pass another year without sickness, and made the same prayer to the Sun and
    the Thunder.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Ynca came with the Sun before him and carried a great gold vase of chicha,
    which a priest poured into a gold-plated stone urn connected to an underground
    pipe or sewer.
  category: sequence
  evidence_refs:
  - ev:8
