canonical_text:
  quote: ''
  summary: Huathiacuri accepts a sequence of challenges from his brother-in-law. With
    advice and material help from his father Pariacaca, he uses a ruse involving foxes
    and a dead huanacu form to obtain chicha and instruments, defeats his rival in
    dancing and drinking, wins further contests with a snow shirt and a red lion-skin
    marked by a rainbow, and begins a house-building contest in which birds, snakes,
    and lizards silently complete his work at night.
  language: English
  quote_policy: summarized
