canonical_text:
  quote: ''
  summary: The passage recounts an aged Ynca/Pachacuti returning to Cuzco, receiving
    a mysterious book from a disappearing youth, fasting, transferring succession
    from Amaru Tupac to Tupac Ynca Yupanqui, campaigns and resettlements around Quito,
    a seven-year famine relieved by Amaru Tupac's protected harvests and granaries,
    the birth of Huayna Ccapac with clemency for condemned sorcerers, and later imperial
    ordering of laborers, chosen maidens, wealth, farms, granaries, roads, bridges,
    and inns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old Ynca returned to Cuzco, heard that a ship had been seen at sea, received
    a great book from a youth who then disappeared, and fasted for six months in Tococachi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pachacuti resigned the kingdom to Amaru Tupac Ynca, but Amaru Tupac refused
    and devoted himself to farming and building.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pachacuti transferred the succession to Tupac Ynca Yupanqui, who was acknowledged
    by the tribes, crowned, and given the sceptre called Tupac-yauri.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tupac Ynca Yupanqui assembled soldiers, marched against a rebellion in Quito,
    punished rebels, relocated people, distributed spoils, left colonists, and pardoned
    some natives after humble excuses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A famine lasted seven years; during it the seed produced no fruit, many died
    of hunger, and some were said to have eaten their own children.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the seven-year famine, Amaru Tupac Ynca obtained large harvests from
    his farms, where dews descended at night and frost did not visit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: People would have worshipped Amaru Tupac because of the miracle, but he refused,
    treating it as an insult to the Creator.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Amaru Tupac humbled himself, fed the poor during the seven years of famine,
    and had filled the granaries with food many months before.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Huayna Ccapac Ynca was born at Tumipampa to Tupac Ynca Yupanqui and Coya Mama
    Anahuarqui; a great palace was built, and condemned sorcerers were pardoned at
    the intercession of the prince's mother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tupac Ynca Yupanqui is described as an executor of justice upon llaycas and
    umus and a destroyer of huacas, although they continued to increase.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the Ynca returned to Cuzco, he sent Arequi Ruca ahead with twelve thousand
    men to visit provinces and punish rebels, while taking Cayambis, Canaris, and
    Chachapuyas as laborers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Ynca took girls from several groups as chosen maidens for Tied Ccapac
    Uiracoclian PachacyachacJii, brought wealth, and ordered provinces to make farms,
    granaries, roads, bridges, and inns, with acllas in all provinces.
  category: action
  evidence_refs:
  - ev:8
