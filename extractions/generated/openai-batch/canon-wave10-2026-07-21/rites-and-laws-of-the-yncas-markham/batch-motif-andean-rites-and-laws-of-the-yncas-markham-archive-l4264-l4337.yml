candidate_motifs:
- id: motif:1
  label: Mysterious book-bearing visitor
  taxonomy_refs: []
  basis: A youth appears with a great book, gives it to the old Ynca, and disappears;
    the old Ynca then fasts for six months.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives no origin for the youth and no content for the book.
- id: motif:2
  label: Royal succession validated by acclaim, crown, and sceptre
  taxonomy_refs:
  - royal_legitimacy
  basis: After Amaru Tupac refuses kingship, Tupac Ynca Yupanqui is acknowledged by
    the tribes, crowned, and given the Tupac-yauri sceptre.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage is dynastic-historical in tone; its ritual detail is limited
    to crowning, acclaim, and sceptre delivery.
- id: motif:3
  label: Renouncing heir chooses humble productivity
  taxonomy_refs: []
  basis: Amaru Tupac refuses the kingdom, devotes himself to farming and building,
    later humbles himself, and feeds the poor.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage frames this as personal disposition and conduct rather than
    as a formal initiation or quest.
- id: motif:4
  label: Seven-year famine with protected harvests
  taxonomy_refs: []
  basis: A seven-year famine makes seed fruitless and causes deaths, while Amaru Tupac's
    farms produce large harvests because dews descend and frost is absent.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: No explicit cycle of death and rebirth or seasonal restoration is narrated
    beyond the famine and harvest contrast.
- id: motif:5
  label: Refusal of worship in deference to the Creator
  taxonomy_refs:
  - wisdom
  basis: People would have worshipped Amaru Tupac because of the miracle, but he refuses,
    calling such worship an insult to the Creator.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The available taxonomy label 'wisdom' is broad; the passage specifically
    emphasizes humility and proper worship.
- id: motif:6
  label: Royal birth accompanied by clemency
  taxonomy_refs:
  - sacred_birth
  basis: At Huayna Ccapac's birth, a palace is built and condemned sorcerers are pardoned
    in the prince's honor through his mother's intercession.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The birth is royal and consequential, but the passage does not describe
    a miraculous conception or birth.
- id: motif:7
  label: Imperial integration through resettlement, dedication, and infrastructure
  taxonomy_refs:
  - royal_legitimacy
  basis: The Ynca relocates laborers, takes chosen maidens for a deity, brings wealth,
