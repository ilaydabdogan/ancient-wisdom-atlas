  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: This is primarily administrative and imperial rather than explicitly mythic.
- id: motif:8
  label: Sacred dedication of chosen maidens to a deity
  taxonomy_refs:
