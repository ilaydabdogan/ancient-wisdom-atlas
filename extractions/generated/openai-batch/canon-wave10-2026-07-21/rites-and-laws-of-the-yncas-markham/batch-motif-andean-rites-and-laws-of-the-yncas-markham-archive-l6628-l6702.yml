canonical_text:
  quote: ''
  summary: The passage describes communal land and harvest rights, continued post-conquest
    cultivation of lands assigned to the Ynca and to religion, storage and sacrificial
    burning of part of the harvest, reserved lands called suyus worked outside a community’s
    district, jurisdiction over workers, colonial conversion record-keeping, Mendoza’s
    advice to understand local customs, and an Inca rule restricting hunting to one’s
    province.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each descendant had a right to a share, but a person who did not work at the
    sowing had no share in the harvest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lands were described as belonging to the whole village, and disputes were
    said to arise more often between villages than between people of the same village.
  category: relationship
  evidence_refs:
