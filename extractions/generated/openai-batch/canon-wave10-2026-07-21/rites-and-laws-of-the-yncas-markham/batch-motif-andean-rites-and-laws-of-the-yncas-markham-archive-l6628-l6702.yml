- id: obs:3
  text: After the Spaniards arrived, Indians continued for a time to till the lands
    of the Ynca and of religion, store harvests according to old custom, burn a portion
    in sacrifice, and believe they would later account to the Ynca.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When President Gasca stayed in the valley of Xauxa, stores of maize sufficient
    for several years were found near the road.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: After people understood that reserved lands might be sown for their own profit,
    people from different villages began sowing them, leading to lawsuits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Land outside a person’s district, worked for the Ynca and religion, was called
    suyus.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some Indians were left to irrigate and guard the suyus, while remaining subject
