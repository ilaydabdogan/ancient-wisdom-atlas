canonical_text:
  quote: ''
  summary: Manco Ccapac finds a brother and sister detained near death at the huaca
    of Sanuc, strikes the speaking stone with his staff, and hears that the siblings
    have sinned. After grieving, he is strengthened by the rainbow, travels with siblings
    to Coricancha, establishes the Cuzco settlement, marries his sister Mama Ocllo,
    enacts laws, conquers provinces, receives presents, and orders a gold plate symbolizing
    the Creator to be fixed in Ccuricancha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When Manco Ccapac's brother did not return, Manco sent a sister to call him,
    but both brother and sister remained kept at the huaca of Sanuc.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Manco Ccapac went himself in wrath and found the brother and sister nearly
    dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brother and sister complained of a stone between them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Apu Manco Ccapac struck the stone or huaca with his tupac-yauri, and words
    came from the stone as if it were alive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaking stone said Manco's staff protected him, told him to go on because
    he had attained great honour, and said the brother and sister had sinned and should
    be where the stone was, glossed as the infernal regions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The condition is called pitusiray sanasiray, glossed in the passage as one
    person fastened on top of another.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Manco Ccapac grieved for the brother and sister, went to the place where he
    had first seen the rainbow, and the rainbow strengthened him and removed his sorrows;
    the place was afterward called Huaynacaptiy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Manco Ccapac went to Collcapampa with the tupac-yauri in his hand, a sister
    named Ypa Mama Huaco, another sister, and a brother; they later went to Huamantiana
    and then to Coricancha, where they found a suitable settlement place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the settlement place there was good water from two springs, Hurinchacan
    and Hananchacan; the passage links these names to Hurin-Cuzco and Hanan-Cuzco
    and links a rock called Cuzco-cara-urumi to Cuzco-pampa, Cuzco-llacta, Cuzco-Ccapac,
    and Cuzco-Ynca.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Apu Manco Ccapac married one of his own sisters, Mama Ocllo, and the passage
    says this marriage was celebrated so that they might have no equal and might not
    lose the caste.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: They began to enact laws for their people, conquered disobedient provinces
    and nations, and the Ttahuantinsuyus came with rich presents as news of a new
    Ynca spread.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Manco Ccapac ordered smiths to make a flat plate of fine gold and had it fixed
    in a great house called Ccuricancha; the passage says the plate signified that
    there was a Creator of heaven and earth and also describes Manco Ccapac as an
    enemy to the huacas.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: A note reports that later Yncas placed a well-carved stone in the form of
    a vulture, interpreted there as a good omen, and that people began to worship
    it.
  category: object
  evidence_refs:
  - ev:10
