canonical_text:
  quote: ''
  summary: The passage describes Mayta Ccapac as a precocious Ynca ruler who cried
    in the womb, spoke soon after birth, defeated enemies as a child, made moral laws,
    opposed huacas and idols, burned cult objects brought to Cuzco, honored the Creator
    above sun and moon, renewed a gold plate and rebuilt Ccuricancha, instituted ritual
    songs and drums for Ccapac Raymi, and is later contrasted with Huascar Ynca’s
    substitution of a sun image for the Creator’s plate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mayta Ccapac is said to have cried many times while still in his mother’s
    womb, begun to talk a few months after birth, and fought valiantly at ten years
    of age, defeating his enemies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mayta Ccapac is described as governing well, making moral laws, forbidding
    evil customs, and foretelling the coming of the holy gospel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While still a boy, Mayta Ccapac ordered huacas and idols to be brought to
    Cuzco for a promised festival, then set them on fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many of the huacas are said to have escaped in the form of fire, wind, and
    birds; the passage gives several names associated with these huacas or their worship
    places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mayta Ccapac ordered his people to pay no honors to the sun and moon, saying
    that the sun, moon, and elements were made for the service of human beings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mayta Ccapac judged and punished people described as practitioners of forbidden
    things, people working on the chief day of Ccapac Raymi, and various moral offenders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the chief day of Ccapac Raymi, Mayta Ccapac gave thanks to the Creator
    Tica-ccapac, also called Caprichay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mayta Ccapac commanded that there be no unjust wars, directed people to tilling
    and building, set up landmarks in villages, punished those who moved them, and
    is said to have had universal peace in his reign.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Mayta Ccapac was more noble in appearance than the others,
    renewed a plate set up by his great-grandfather, and rebuilt the house of Ccuricancha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mayta Ccapac instituted new songs and very large drums for Ccapac Raymi, holding
    the feast only in honor of the Lord and Creator while despising created things
    such as men, the sun, and the moon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage reports that Huascar Ynca removed the earlier plate and substituted
    a round plate like the sun with rays; it also says some placed sun and moon images
    on either side of Mayta Ccapac’s plate.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The plate is described as a fine gold image of the Creator and of the true
    Sun of the sun, called Uiiacocha-pachayachachic; a Spaniard is said to have gambled
    for this gold plate in Cuzco.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
