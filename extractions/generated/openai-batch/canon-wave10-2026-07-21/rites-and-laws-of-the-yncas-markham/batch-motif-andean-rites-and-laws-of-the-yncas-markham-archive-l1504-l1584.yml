canonical_text:
  quote: ''
  summary: 'The passage describes an Inca public rite in Cuzco: priests, families,
    huacas, and embalmed ancestors assemble; unblemished unshorn sheep from the four
    quarters are brought; four perfect animals are sacrificed to the Creator, Thunder,
    Sun, and Huanacauri; blood is mixed with sancu and eaten after warnings and vows;
    participants promise loyalty to the sacred powers and the Ynca; portions are distributed
    to all, including absent and sick persons; lungs are inspected for signs about
    the coming year, then burnt; meat and wool are also ritually distributed and offered;
    a prayer to the Creator begins.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Priests came in procession with the families of Hurin and Hanan Cuzco, each
    family bringing the embalmed bodies of its ancestors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun and other huacas were returned to their temples in the evening, while
    the embalmed bodies were returned to their houses.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the next day the huacas were placed on benches in the great square, and
    the Ynca and people brought a very large number of flocks from the four quarters.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The animals for the rite had to be without spot or blemish and with fleeces
    that had never been shorn.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priest of the Sun selected four of the most perfect animals and sacrificed
    one each to the Creator, the Thunder, the Sun, and Huanacauri.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sancu was placed on large gold plates, sprinkled with sheep blood, and set
    before the bench of the Sun.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The high priest publicly warned that the Sun would see and punish anyone who
    ate the sancu in sin or with a divided heart, while sincere participants would
    receive favor, children, happy years, and abundance from the Sun and Thunder.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before eating the yahuar-sancu, participants vowed not to murmur against the
    Creator, the Sun, or the Thunder and not to be traitors to their lord the Ynca.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The priest of the Sun ate a small amount first, and then all the tribes partook,
    including little children; portions were kept or sent for those absent or sick.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Participants treated it as a great sin for any particle of yahuar-sancu to
    fall to the ground.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The lungs of the sacrificial sheep were removed and inflated, and priests
    judged signs on them concerning whether the coming year would prosper.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The lungs were afterwards burnt before the Creator, the Sun, and the Thunder.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The bodies of the sheep were divided as sacred things, small portions were
    distributed, and wool was pulled off and sacrificed to the Sun.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The prayer to the Creator addresses Uiracocha as a creator who gives life
    and strength to mankind and makes man and woman.
  category: speech
  evidence_refs:
  - ev:11
