canonical_text:
  quote: ''
  summary: The passage recounts Pachacuti Ynca Yupanqui’s travels, the births of royal
    sons, prodigious creatures and fiery comets reported near Cuzco, his return celebrations,
    the death and mourning of his father, later campaigns and an assassination attempt,
    and a miracle in which an eagle destroys a serpent sent by the huaca Canacuay,
    afterward commemorated by a stone carving.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pachacuti came to Huamanin and Puma-cancha, where his eldest legitimate son,
    Amaru Yupanqui, was born.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: News arrived of a miracle at Cuzco involving a yauirca or amaru, described
    as a huge ferocious creature with ears, eye-teeth, and a beard, coming from the
    mountain of Pachatusan and entering the lake of Quichuipay.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fiery sacacas, glossed as comets, came from Ausancata and moved toward Arequipa
    and snowy mountains near Huamanca; they were described as animal-like and appearing
    from a distance to be made of fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pachacuti returned to Cuzco, found his father Uiraccocha-Ynca Yupanqui old
    and infirm, and celebrated return festivals and the Ccapac Raymi of Pachayachachi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Curacas and Mitmays of Caravaya brought a chuquichinchay, described as
    a many-coloured animal said to be chief of the uturuncus.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Uiraccocha-Ynca Yupanqui died, soldiers carried his body with arms and
    insignia through the city while singing a war-song and bearing shields, clubs,
    and lances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Women processed separately with shorn hair, black clothing, and blackened
    faces, flogging themselves; the passage says they mourned for a week and sought
    the dead Ynca’s body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pachacuti undertook conquests in several regions and encountered the Collas
    and Camanchacas, who are described as great sorcerers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A poor man carrying hidtis struck Pachacuti on the head with intent to kill
    him and confessed under torture that he had come at the request of the Capacuyos.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Ynca ordered the province of the Caviñas laid waste, while the passage
    says the Capacuyos were accused and all put to death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The attempted murder is said to have been advised by the huaca Canacuay.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Ynca’s second son, Tupac Ynca Yupanqui, was born before Pachacuti undertook
    the conquest of the Antisuyus with 100,000 men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The huaca Canacuay sent forth fire and stopped the passage with a fierce serpent
    that destroyed many people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Ynca raised his eyes to heaven and prayed for help; a furious eagle descended,
    seized the serpent’s head, lifted it, and hurled it to the ground.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In memory of this miracle, the Ynca ordered a snake carved in stone on a terrace
    wall in the province called Ancaçirca.
  category: action
  evidence_refs:
  - ev:9
