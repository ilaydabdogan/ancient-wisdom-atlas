canonical_text:
  quote: ''
  summary: The passage describes Mayta Ccapac Ynca as wise, skilled in medicines,
    and able to foresee events. During the month-long Ccapac Raymi for Uiracocha Pachayachachi,
    he reflects on death and an eternal feast, then fasts in mourning at Toco-cachi.
    The passage then gives his sons and succession, saying Ccapac Yupanqui became
    heir and received submission from chiefs after Mayta Ccapac's death. It reports
    the invention of sacrifices involving buried virgin boys with silver and gold
    and other offerings. Ccapac Yupanqui enters a dark ritual space in Capacuyo where
    a huaca is summoned, orders light admitted, questions the being, calls it a false
    deceiver, and asserts a Creator of all things. The being, named Oana-chuap yauirca,
    is described as ugly and foul-smelling and flees with thunder-like shouts. Thereafter
    the huacas are said to fear the Yncas, who use a yacarcay formula in the Creator's
    name, while still continuing capacochacocuy.
  language: English
  quote_policy: summarized
