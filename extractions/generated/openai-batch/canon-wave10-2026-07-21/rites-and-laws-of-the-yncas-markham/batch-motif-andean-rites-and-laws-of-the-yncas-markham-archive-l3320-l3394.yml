canonical_text:
  quote: ''
  summary: 'Tunapa is imprisoned, bound, and condemned, but a beautiful youth frees
    him at dawn and crosses the lake with him while Tunapa''s mantle serves as a boat.
    A local idol or huaca is described as destroyed, exiled to a desert place, and
    mourning. Tonapa travels through Titicaca, Chacamarca, and Tiyahuanacu; when people
    drinking and dancing refuse to hear his preaching, he denounces them and they
    are turned to stone. The passage then shifts to Manco Ccapac: Tonapa''s staff,
    given to Apu-tampu, turns to gold at Manco''s birth. Manco, orphaned and accompanied
    by his siblings, sets out seeking new lands with the staff, cups, clothes, and
    arms. At the highest hill toward sunrise, two rainbows appear over him, which
    he interprets as an omen of prosperity and victories. The passage ends with the
    youngest brother approaching a fierce man-like figure.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tunapa is taken prisoner, shorn near the great lake of Garapucu, tied hand
    and foot, guarded, and condemned to a cruel death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At daybreak a beautiful youth comes to Tunapa, says he calls him in the name
    of a matron who watches over him, and touches the cords binding him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dawn Tunapa enters the lake with the youth, and his mantle supports him
    on the water in place of a boat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chiefs and principal men are disturbed after seeing their idol thrown down
    and destroyed; the idol flies to a desert place, mourns with head down, and is
    found there by an Indian.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After being freed, Tonapa stays for a long time on a rock called Titicaca
    and then passes by Tiquina and Chacamarca to Tiyahuanacu.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people of Tiyahuanacu are drinking and dancing when Tonapa comes to preach;
    they do not listen, and after he denounces them the dancing people are turned
    into stones.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tonapa follows the course of the Chacamarca river until he reaches the sea;
    the account is attributed to the most ancient Yncas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The staff delivered by Tonapa into Apu-tampu's hands turns into fine gold
    at the birth of Manco Ccapac Ynca.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Manco Ccapac has seven brothers and sisters, including named siblings such
    as Ayar-cachi, Ayaruchu, and Aya-raeca, and becomes an orphan after the death
    of his father and mother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Manco Ccapac assembles his people to consider his power for new conquests,
    then agrees with his brothers to seek new lands while taking rich clothes, arms,
    Tonapa's staff, and two golden cups.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Manco Ccapac and his brothers set out toward the hill over which the sun rose
    and arrive at the highest point in that land.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A beautiful rainbow rises over Manco Ccapac, with another rainbow above it;
    Manco interprets this as a good sign of prosperity, victories, and obtaining what
    they desire.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Manco Ccapac advances joyfully singing, descends to Collcapampa, sees a distant
    man-like form from Saiiuc, and the youngest brother approaches a fierce Indian-like
    figure with bloodshot eyes who then speaks.
  category: sequence
  evidence_refs:
  - ev:9
