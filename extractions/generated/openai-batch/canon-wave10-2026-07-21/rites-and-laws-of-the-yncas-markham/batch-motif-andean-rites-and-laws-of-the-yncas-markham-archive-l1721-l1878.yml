canonical_text:
  quote: ''
  summary: The passage gives Quechua prayers with English translations for the Ynca,
    all Yncas, and huacas, then narrates a multi-day festival with flock sacrifice,
    chicha, sancu or yahuar-sancu, visits by subject nations' huacas, reverences in
    the Cuzco square, blood-sprinkled sancu, a prayer to the Creator, and a sacrificial
    meal.
  language: English with Quechua prayer texts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prayer addresses the Creator and asks that the Lord Ynca be kept in peace,
    conquer enemies, and have his days and his children's days preserved.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another prayer calls the Ynca the Creator's son or child and asks for peace,
    multiplication of subjects, prosperous days, increased farm yields, and continued
    keeping of the Lord Ynca.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A prayer to the Sun says the Sun ordained Cuzcos and Tampus and asks that
    the Yncas, called the Sun's children, be conquerors.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A prayer to the huacas addresses them as sacred ancestors, grandsires, and
    parents and asks them to bring the speakers and their children near the Creator.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After flocks were distributed, many sheep were killed for eating, and chicha
    made from boiled white maize in the valley of Cuzco was brought from storehouses
    into the square.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The flocks used at the festival are described as property of the Creator,
    the Sun, and the Thunder from estates set apart throughout the provinces.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The festival continued for four days, with taquis and drinking; its days included
    Citua with yahuar-sancu, a day for the Creator, Sun, and Thunder, and a day for
    the Moon and Earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: People from nations subdued by the Yncas came with their huacas and rich regional
    costumes, and priests carried the huacas on litters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The processions entered the square from the four Suyus and made reverences
    to the Creator, the Sun, the Thunder, Huanacauri, and then the Ynca.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The High Priest of the Sun sprinkled a large quantity of sancu with blood,
    and the Caciques rose in order and repeated a prayer to the Creator.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the prayer, the Priest of the Sun distributed the sancu, and the people
    ate flesh of sheep sacrificed to the Creator, the Sun, and the Thunder.
  category: sequence
  evidence_refs:
  - ev:8
