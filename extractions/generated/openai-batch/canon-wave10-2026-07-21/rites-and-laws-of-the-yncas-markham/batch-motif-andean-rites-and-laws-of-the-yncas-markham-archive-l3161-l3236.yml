canonical_text:
  quote: ''
  summary: 'The speaker professes Christian beliefs concerning God as creator, Adam
    as ancestor of all peoples, Christ''s incarnation, crucifixion, descent to the
    infernal regions, resurrection, ascension, and divine rule. The speaker then introduces
    ancient traditions of Ttahuantin-suyu: peoples came from beyond Potosi in warlike
    armies, settled the land, entered a period of crowding and warfare, and lived
    amid nightly danger from Hapi-nunos. The Hapi-nunos are said to have disappeared
    at midnight, lamenting defeat, which the narrator interprets as the devils'' defeat
    by Jesus Christ on Mount Calvary. The passage ends with the arrival of a bearded
    man after the Hapi-nunus Achacallas had been driven out.'
  language: English
  quote_policy: summarized
