canonical_text:
  quote: ''
  summary: Cavillaca goes to the sea coast of Pachacamac with her child, enters the
    sea, and is transformed into rock. Coniraya pursues her and repeatedly asks animals
    whether they have seen her. Animals that say she is near receive blessings and
    privileges; animals that say pursuit is useless receive curses explaining disliked
    or vulnerable traits. The lion is also assigned a punitive role and future ritual
    honor through its skin and head at festivals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cavillaca expresses unwillingness to see anyone after becoming pregnant by
    a being she calls vile and filthy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cavillaca disappears, reaches the sea coast of Pachacamac with her child,
    enters the sea, and is turned into a rock; the passage says two rocks, mother
    and child, can still be seen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coniraya continues pursuing Cavillaca, calls for her to stop and look back,
    and asks animals whether they encountered a woman with specified marks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The condor reports that the woman was seen nearby and that Coniraya can overtake
    her if he goes faster.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coniraya blesses the condor with enduring life, freedom of movement, undisturbed
    nesting, the right to eat dead or neglected animals, and retaliation against anyone
    who kills it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A small odorous fox says Coniraya cannot overtake Cavillaca because she is
    far away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Coniraya curses the small odorous fox to go abroad only at night, to smell
    bad, and to be persecuted and hated by people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A lion tells Coniraya that Cavillaca is very near and that he can overtake
    her if he hurries.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coniraya blesses the lion with respect and fear, assigns it the office of
    punisher and executioner of evildoers, and permits it to eat the llamas of sinners.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Coniraya declares that after the lion's death its head, skin, feet, and tail
    will be preserved and worn at major festivals, with a llama killed and dancing
    and singing performed by the wearer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Another fox says Coniraya's running is useless because Cavillaca is far away
    and impossible to overtake.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Coniraya curses this fox to be hunted from afar and to be disregarded after
    death, with no one using its skin or lifting its body from the ground.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: A falcon says Cavillaca is very near, and Coniraya declares the falcon highly
