canonical_text:
  quote: Aclla-huasi, which means " the house of the chosen ones,"
  summary: 'The passage describes Inca regulations for hunts, forests, and common
    resources, then details the Aclla-huasi system: provincial governors selected
    young girls, who were housed with Mama-cunas, trained in women’s work, guarded
    for virginity, and later distributed for service to the Sun, Pacha-mama, sacrifices,
    the Ynca, or people favored by the Ynca.'
  language: English
