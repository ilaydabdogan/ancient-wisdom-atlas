canonical_text:
  quote: ''
  summary: Pariacaca enters a festival village dressed as a poor man and is ignored
    by the drinkers. A girl gives him chicha in a white calabash, and he warns her
    to flee with her children because the village will be destroyed in five days for
    its neglect. She leaves with her kin; Pariacaca ascends a nearby mountain, and
    rain, hail, and stones flood the village away into the sea. The flood remains
    a local tradition.
  language: English
  quote_policy: summarized
