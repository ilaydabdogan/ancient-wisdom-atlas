canonical_text:
  quote: ''
  summary: On the ninth and tenth days of a knighthood rite, youths are shorn and
    clothed, attend huaca images in the square, receive permission from the Ynca to
    sacrifice, fast and ascend to the huaca Huanacauri, where priests sacrifice lambs.
    Wool from the sacrificial animals is distributed and blown into the air during
    prayer, and the youths receive huaracas and chuspas as signs of valor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Parents and relations of the youths come to the square wearing festival dress,
    including yellow mantles and black plumes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youths who are to receive knighthood are shorn and then clothed in the
    specified festival dress.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Selected maidens from high-status families, aged about eleven to fourteen,
    attend the feast and carry small vases of chicha.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The participants bring images of the Sun and Thunder from their house to the
    square, and the Ynca takes his place near the statue of the Sun.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youths make mucha, described as their manner of worshipping the huacas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A female-shaped huaca of the Moon, called Passu-mama, is carried from the
    house of the Sun and is in the charge of women.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: At noon the youths again reverence the huacas and seek permission from the
    Ynca to make sacrifices.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each youth has a sheep prepared for sacrifice; the youths and their relations
    go to Huanacauri, sleep at Matahua, fast, and ascend to the huaca at sunrise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Tarpuntays pull a small handful of wool from each sacrificial sheep and
    later sacrifice five lambs before the huaca at the top of the hill.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Wool is divided among the youths and chiefs, who blow it into the air while
    the sacrifices are being consumed and a prayer is addressed to Huanacauri.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Huaracas and chuspas are put into the youths' hands, and the High Priest says
    the huaracas are given by Huanacauri as a sign of valor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The huaracas are described as made from aloe fibre and sheep sinews.
  category: attribute
  evidence_refs:
  - ev:8
