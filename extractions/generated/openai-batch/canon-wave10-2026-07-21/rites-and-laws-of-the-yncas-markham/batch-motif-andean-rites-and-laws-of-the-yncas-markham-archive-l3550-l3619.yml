canonical_text:
  quote: ''
  summary: The passage describes an order to deposit coca and stones, then recounts
    Manco Ccapac praying for his son, remembering Tonapa, seeking a sign from the
    Creator, and offering first a white lamb and then one of his young sons without
    receiving an answer. It then describes rites in which adolescent boys run toward
    animals placed on Huanacauri and receive clothing and adult male status, girls
    of sixteen plait their hair and receive shoes as markers of womanhood, men of
    thirty are ordered to take wives with gendered equipment distributed, and holy
    men are selected as priests to invoke the Creator.
  language: English
  quote_policy: summarized
