canonical_text:
  quote: ''
  summary: The passage describes Inca-era rules for flocks associated with religion,
    the Ynca, chiefs, districts, and communities. It explains categories of rich and
    poor beasts, communal enjoyment of some flocks, preservation rules, use of flocks
    in highland subsistence and exchange, prohibitions on killing females, sacrificial
    exceptions, burial of diseased animals, seasonal shearing, distribution of wool
    and cloth, weaving by specialized workers, storage in magazines, and issues of
    colonial tribute from religious, royal, and communal estates.
  language: English
  quote_policy: summarized
