  summary: The passage reports Inca and related traditions about lineage origins from
    sacred places, ancestors transformed into stones, birds, or animals, deluge survivors
    commemorated as huacas, a Creator at Tiahuanaco who makes celestial bodies and
    punishes disobedience by petrification, the Sun granting royal status and insignia
    to Manco Ccapac and his descendants, Manco Ccapac and siblings emerging from the
    cave of Paccaritambo, and another account in which the Creator has two sons, assigns
    dress and languages to nations, travels by the mountains, and turns rebellious
    peoples into stone.
