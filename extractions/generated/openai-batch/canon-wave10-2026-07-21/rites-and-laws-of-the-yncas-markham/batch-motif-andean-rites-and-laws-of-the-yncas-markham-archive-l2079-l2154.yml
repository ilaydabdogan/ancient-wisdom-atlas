canonical_text:
  quote: ''
  summary: The passage describes stages of an Inca ceremony in which eligible royal-line
    youths are whipped and exhorted by kin, participate in songs and processions,
    carry straw and huaracas, worship huacas, exchange drinks with those who flogged
    them, and eat a sacrificial sheep. On the fourteenth day, huacas of the Creator,
    Sun, Moon, and Thunder are brought to the Cuzco square near the Ynca; the youths
    receive special garments, footwear, staves with knives, and breeches, worship
    the images, bow to the Ynca, and depart by family and tribe. The passage also
    states that only direct descendants and relations of the Lord Yncas are admitted,
    and that provincial Ynca governors perform analogous ceremonies for eligible sons.
  language: English
  quote_policy: summarized
