canonical_text:
  quote: ''
  summary: 'The passage describes rites connected with youths who had been armed as
    knights: a lion-skin taqui, repeated sacrifices, ritual bathing and clothing changes,
    presentation of weapons, kin offerings and admonitions, burning of dressed fuel
    bundles with animal and bird offerings, ear piercing as the final ceremony, and
    rites for counting and multiplying sacred and royal flocks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some ritual participants wore prepared lion skins with heads, gold ear-pieces,
    golden teeth, and gold paw ornaments; taqui participants also wore long red shirts
    with red and white fringes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The taqui called coyo was said to have been introduced by Ynca Pachacutec
    Yupanqui and was performed with four drums, two from Hanan Cuzco and two from
    Hurin Cuzco, twice daily for six days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the six days, each person offered sacrifices of sheep, cloth, gold,
    silver, and other items to the Creator, Sun, Moon, and Thunder, and for the Ynca
    and the youths armed as knights, asking that the youths be fortunate in war and
    undertakings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the twenty-first day, the youths who had been armed as knights bathed in
    the fountain Calli-puquio, removed the clothes used in the arming ceremony, and
    put on black and yellow garments with a red cross in the center.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After bathing, the youths returned to the square, made obeisances before the
    huacas, were arranged by family, and received a shield, sling, and metal-knobbed
    club from the principal uncle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Relations and chiefs offered cloth, sheep, gold, silver, and other goods,
    prayed that the youths would be rich and fortunate, flogged a youth, and exhorted
    him to be valiant, loyal to the Sun and the Ynca, devoted to the huacas, and like
    his ancestors in bravery.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the principal Lord Ynca was armed as a knight, chiefs and great lords
    from throughout the land made additional offerings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Priests of the Sun and the Creator brought bundles of fuel dressed as a man
    and a woman, offered them to the Creator, the Sun, and the Ynca, and burned them
    with a sheep and certain birds for the youths' fortune in war.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the twenty-second day, the knights were taken to relatives' houses and
    their ears were pierced; this was described as the last ceremony in arming the
    knights.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A broken ear orifice was regarded as unfortunate, and cotton was inserted
    daily to enlarge the opening.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Priests and shepherds counted the flocks of the huacas and the Ynca, and feasts
    and sacrifices were begun so that the flocks might multiply; shepherds were rewarded
    or punished according to flock increase.
  category: action
  evidence_refs:
  - ev:6
