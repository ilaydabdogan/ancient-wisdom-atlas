canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of Inca monthly rites: a festival with
    ritual images and gold and silver sheep figures; June irrigation work; July sowing
    rites with fasting, song, dance, and sacrifices to the Creator, Sun, and Thunder
    for harvest, warmth, rain, and protection from hail; and the opening of the August
    Bitua, when huaca figures from across the land are brought to Cuzco.'
  language: English
  quote_policy: summarized
