  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the nineteenth day, the Ynca and people went to Huacaypata with the huacas
    and embalmed bodies of the dead, made obeisances, and began the sacrifice called
    mojocati.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A small river through Cuzco, called Capi-mayu and Huaca-puncu-mayu, was dammed
