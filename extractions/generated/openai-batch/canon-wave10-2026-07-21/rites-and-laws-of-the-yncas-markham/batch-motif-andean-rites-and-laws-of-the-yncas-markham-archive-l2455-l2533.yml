canonical_text:
  quote: "“left it coiled up like a snake.”"
  summary: 'The passage describes Inca festival rites in Cuzco: participants coil
    a ritual cable called Moro-urco, make reverences to huacas and the Ynca, sacrifice
    lambs for the cable, rain, and winter, drink with huacas and dead bodies, preserve
    sacrificial ashes for river disposal, attribute annual ceremonies to Inca rulers,
    and perform the mojocati offering by throwing many goods and ashes into a dam-released
    river.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Participants entered the square, made reverences to the huacas and the Ynca,
    moved round until forming a spiral shape, and left the huascar coiled on the ground
    like a snake.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cable was called Moro-urco and was taken back to its house by those charged
    with it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: During this feast participants wore named garments, including black shirts
    with white bands and fringes, and white plumes from a bird called tocto.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A lamb was brought to be sacrificed for the cable, for rain, and for winter;
    the text reports speech addressed to winter asking why it had rained.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: From noon to sunset, rejoicing and drinking occurred with the huacas and dead
    bodies; the passage relates this to chicha poured through pipes in festivals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before sunset, the huacas were taken back to their temples and the Ynca returned
    to his house; the taquiy with sacrifices and drinking lasted two days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the eighteenth day, participants came to the square in named festive garments
    and feather headgear; a priest burned a lamb and prayed to winter to send waters
    so people could eat and drink.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cinders and ashes from this and other sacrifices throughout the year were
    preserved so they could be thrown into the river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The taqui chapay quenalo and most other annual ceremonies are attributed to
