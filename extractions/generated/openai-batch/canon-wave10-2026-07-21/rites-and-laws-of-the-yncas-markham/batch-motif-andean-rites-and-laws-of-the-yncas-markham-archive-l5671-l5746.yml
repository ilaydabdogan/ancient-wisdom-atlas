canonical_text:
  quote: ''
  summary: The passage introduces the post-deluge period called Purunpacha, the appearance
    of five eggs on Condorcoto as the origin of Pariacaca, Huathiacuri as Pariacaca's
    poor son, and a wealthy lord at Anchicocha who claims divinity but becomes gravely
    ill. Huathiacuri travels toward the sea and overhears two foxes discussing the
    hidden cause of the lord's illness, the wife's adultery, and supernatural threats
    to the lord's house.
  language: English
  quote_policy: summarized
