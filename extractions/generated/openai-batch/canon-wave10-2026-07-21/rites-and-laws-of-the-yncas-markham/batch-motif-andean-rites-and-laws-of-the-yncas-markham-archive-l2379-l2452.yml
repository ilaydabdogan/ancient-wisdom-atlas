canonical_text:
  quote: ''
  summary: 'The passage describes rites at the end of Ccapac-raymi and the beginning
    of Camay-quilla: a procession of the Sun statue to Puquinque for sacrifices, contests
    between Hanan Cuzco and Hurin Cuzco youths, post-fast eating by newly armed knights,
    offerings of food and drink to huacas and dead Yncas, beliefs about good and bad
    souls after death, agricultural ploughing, all-night dancing at the full moon,
    and a ritual involving a long four-coloured cable held by men and women.'
  language: English
  quote_policy: summarized
