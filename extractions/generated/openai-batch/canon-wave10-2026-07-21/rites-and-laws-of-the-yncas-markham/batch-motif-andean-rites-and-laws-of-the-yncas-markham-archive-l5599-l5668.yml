canonical_text:
  quote: ''
  summary: 'A Huarochiri flood narrative is reported: a man goes to the mountain Villca-coto
    with five days of food and a llama, reaches a summit crowded with animals, survives
    rising sea water that covers the land except the mountaintop, and becomes the
    ancestor of later people after the waters recede. The passage also reports an
    explanation for black-tipped fox tails and includes a Christian authorial critique
    connecting the story polemically to the universal deluge, demons, and the Devil.'
  language: English
  quote_policy: summarized
