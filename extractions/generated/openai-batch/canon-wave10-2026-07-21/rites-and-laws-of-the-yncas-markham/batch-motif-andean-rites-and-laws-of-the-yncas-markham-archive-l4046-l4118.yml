canonical_text:
  quote: ''
  summary: The passage recounts Ynca Urcu's failed campaign and death, the siege of
    Cuzco by the Hanco-allos and Chancas, and the defence of Cuzco by the legitimate
    son Ynca Yupanqui. Ynca Yupanqui receives encouragement from a youth who promises
    victory in the Creator's name, retrieves sacred regalia after a heavenly warning,
    and wins after stones arranged by a priest become fighting men. The passage also
    notes trophy heads, a widow who fought in the battle, pursuit to the Apurimac,
    and the death of an Inca captain.
  language: English
  quote_policy: summarized
