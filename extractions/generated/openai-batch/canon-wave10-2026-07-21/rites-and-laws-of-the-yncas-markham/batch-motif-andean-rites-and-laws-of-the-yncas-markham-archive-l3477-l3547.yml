canonical_text:
  quote: ''
  summary: 'The passage describes acts attributed to Manco Ccapac: conquest, construction
    at his birthplace of a wall with three named windows, installation of two ancestral
    trees decorated with precious metals, village dress differentiation, selection
    of lineage origin places called pacariscas, and head-pressing of infants. It then
    describes Sinchi Ruca Ynca’s succession, his patronage of agriculture, weaving,
    and mining, and a ritual involving stone heaps called usnus or apachitas, instituted
    after a wizard’s instruction that passersby should add stones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Manco Ccapac is described as conquering Tocay Ccapac, who is called a great
    idolater.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the place of his birth, Manco Ccapac ordered a masonry wall with three
    named windows, described as emblems of the house of his fathers and of descent
    from paternal and maternal kin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two trees were said to typify Manco Ccapac’s father and mother and were ordered
    to be adorned with roots of gold and silver and golden fruit.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explains that the two trees represented the parents as roots and
    stems of the Yncas, and the Yncas as proceeding from them like fruit from trees.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Manco Ccapac ordered different villages to have different dress so that people
    could be recognized by village or tribe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tribes were ordered to choose an origin or descent source, and lineages selected
