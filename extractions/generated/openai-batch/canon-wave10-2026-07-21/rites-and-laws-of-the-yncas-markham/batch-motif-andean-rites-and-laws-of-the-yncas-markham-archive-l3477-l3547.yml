  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: When Sinchi Ruca Ynca desired conquests, he sent captains and men rather than
    going himself.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In ravines, captains and their men had to take stones to make heaps called
