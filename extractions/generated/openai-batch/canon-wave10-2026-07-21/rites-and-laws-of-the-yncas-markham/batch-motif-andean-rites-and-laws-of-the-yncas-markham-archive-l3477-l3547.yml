  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The passage says hapi-iiunus, translated as devils, entered false pacariscas
    and uttered deceitful promises from them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that Pacari-tampu was treated as the origin or pacarimun
    connected with the increase of pacariscas.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:9
  text: The stated reason for inventing pacarimun was that Manco Ccapac was often
    unable to tell which village an Indian belonged to.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Manco Ccapac ordered infants’ heads to be pressed so they would grow up foolish
    and without energy, because he feared large round-headed Indians might become
    audacious and disobedient.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sinchi Ruca Ynca, described as Manco Ccapac’s legitimate son, inherited his
    father’s dominions; other younger sons were called Chimapanaca-ayllu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sinchi Ruca Ynca is described as a patron of agriculture, cloth weaving, and
