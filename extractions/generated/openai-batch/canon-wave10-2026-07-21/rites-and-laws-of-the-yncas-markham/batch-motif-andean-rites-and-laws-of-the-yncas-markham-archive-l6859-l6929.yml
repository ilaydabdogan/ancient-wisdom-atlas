  summary: The passage describes Inca chasqui relay posts on coastal and mountain
    roads, their regular staffing, rapid relay of messages and perishable goods, and
    provisioning from the Ynca storehouses. It then describes heavy labor tribute
    for building Cuzco edifices and fortresses with fitted masonry, stone tools, transported
    stones, and many workers.
