canonical_text:
  quote: ''
  summary: 'The passage describes part of an Ynca youth-investiture rite: rites in
    the Cuzco square, ascent to the hill Raurana, offerings at a falcon huaca, distribution
    of garments and insignia, admonitory flogging, an origin account for the taqui
    huari connected with Manco Ccapac and the Creator, a return procession, and obeisance
    to huacas and embalmed ancestors.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The rite begins in the Huacay-pata square in Cuzco, where statues of the Creator,
    the Sun, the Thunder, and the Moon are present and the Ynca sits near the statue
    of the Sun with courtiers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Participants perform mucha to the huacas and the Ynca; Hanan Cuzco and Hurin
    Cuzco sit in assigned places while the youths stand, perform the taqui called
    huari, and are flogged again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the Ynca and court go to his house, the youths go with fathers and relations
    to the hill Raurana, spend the night at Huamancancha, and ascend Raurana at dawn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lord Ynca grants favors to the youths who had been armed as knights, including
    gold ear-pieces, red mantles with blue tassels, and other marks of distinction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The huaca of Raurana is described as two stone falcons on an altar at the
    summit of the hill; it is said to have been instituted by Pachacutec Ynca Yupanqui,
    formerly to have belonged to the Indians of Maras, and to have been beautified
    when Huascar Ynca brought the falcons there.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Raurana, five lambs are burned and chicha is poured out while the Creator,
    Sun, Moon, Thunder, and the huaca are petitioned for the youths’ valor, enterprise,
    prosperity, fortune, and freedom from defeat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Priest of Raurana, also called the Huaca-camayoc, performs the sacrifice
    and gives each youth huarayarus breeches and a red shirt with blue binding.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The youths receive gold ear-pieces fastened in their ears, diadems with plumes
    called pilcocassa, and small gold and silver neck ornaments.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: After breakfast and another performance of the taqui huari, fathers and parents
    flog the youths again, remind them of the prayers, and urge them to imitate their
    ancestors and never turn their backs on an enemy.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The passage reports that the taqui huari was given by the Creator to Manco
    Ccapac when he came forth from the Cave of Tampu, with the command that it be
    sung only at this festival.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the taqui, the party drinks in order and marches back to Cuzco with
    the sicntur-paucar borne before them as a banner and with sheep dressed as on
    former occasions.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Manco Ccapac is said to have instituted this feast and caused the ceremonies
    to be observed for his son Sinchi Rocca.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: On reaching the Cuzco square, the participants perform adoration before the
    huacas and make obeisance to embalmed bodies of dead Lords and Ladies, drinking
    with them as if they were alive and asking that descendants become fortunate and
    brave.
  category: action
  evidence_refs:
  - ev:9
