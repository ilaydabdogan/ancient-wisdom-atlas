- id: obs:1
  text: Each nation spends the rest of the day performing the taqui and singing and
    dancing according to the customs of their respective countries before they were
    subdued by the Yncas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Persons described as deformed, who had previously been expelled from Cuzco,
    are allowed to join the feast on this day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: This part of the feast lasts two days and ends in the evening with the burning
    in sacrifice of a sheep and many-colored clothes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Those who must return home seek and receive permission from the Creator, the
    Sun, the Thunder, and the Ynca.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The returning participants leave at Cuzco the huacas they brought that year
    and return home with the huacas brought for the previous year’s festival.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chiefs receive gold, silver, clothes, servants, and permission to travel
    in litters as recompense for coming from great distances.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The huacas are granted estates and attendants to wait on them.
  category: action
  evidence_refs:
  - ev:2
