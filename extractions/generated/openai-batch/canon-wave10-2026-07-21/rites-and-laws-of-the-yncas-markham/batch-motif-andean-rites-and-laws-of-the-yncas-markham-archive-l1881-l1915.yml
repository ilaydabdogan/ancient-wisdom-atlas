  text: Ynca Yupanqui is identified as the inventor or organizer of this feast’s ceremonies,
    though the feast itself is said to have existed from the beginning of the Yncas.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The same feast, called Situa, is celebrated at chief places in all provinces
