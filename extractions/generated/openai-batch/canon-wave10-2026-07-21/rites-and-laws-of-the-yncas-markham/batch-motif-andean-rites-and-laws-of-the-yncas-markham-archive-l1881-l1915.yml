canonical_text:
  quote: ''
  summary: 'The passage describes the closing portion of a feast: nations perform
    taqui, sing, and dance according to their local customs; previously expelled deformed
    persons are admitted; a sheep and many-colored clothes are burnt in sacrifice.
    Returning groups seek permission from the Creator, the Sun, the Thunder, and the
    Ynca, leave current-year huacas at Cuzco, take back previous-year huacas, and
    receive recompense. Their huacas are also endowed. Ynca Yupanqui is said to have
    established the order of the ceremonies, and the Situa feast is repeated in provincial
    centers by Ynca governors. A September month-name is linked to the Indians of
    Uma and the feast of Hurachillo/Huarachicu.'
  language: English
  quote_policy: summarized
