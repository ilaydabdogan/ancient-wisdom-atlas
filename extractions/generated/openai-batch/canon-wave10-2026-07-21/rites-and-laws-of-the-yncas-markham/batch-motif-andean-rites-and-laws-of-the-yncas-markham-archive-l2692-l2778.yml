canonical_text:
  quote: ''
  summary: The passage describes accession sacrifices ordered from Cuzco for all huacas
    and sacred places, with portions assigned and accounted for. The sacrifices are
    offered for the Ynca’s health, victory, peace, and prosperity. The rites include
    offerings to the Creator, Sun, Thunder, Moon, Heaven, and Earth; child sacrifice,
    removal of hearts, blood anointing of huacas, burial at Chuquicancha, and prayers
    addressing the Sun as the Creator’s child and Mother Earth as mother of the Ynca.
  language: English with Quechua prayer text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacrifices were passed on through provinces to the places where they were
    to be offered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord Ynca offered these sacrifices when he began to reign so that the
    huacas might give him health and preserve his dominions in peace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: No huaca or place of worship was to be left out; sacred trees, fountains,
    hills, and lakes all received portions, because omission was feared as an evil
    omen and as cause for punishment of the Ynca.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: If a hill was too steep to ascend, sacrifices were hurled to its summit with
    slings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Quipucamayu in Cuzco kept account of each sacrificial portion and the province
    to which it was sent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The first sacrifice in Cuzco was offered to the Creator by the priest in charge
    of the Creator’s image, with prayers for long life, health, victory, peace, and
    prosperity.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Children were given food and drink before being strangled so that they would
    not enter the Creator’s presence discontented and hungry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: From some victims the hearts were removed while they were still alive and
    offered to the huacas while palpitating; the huaca was anointed with blood from
    ear to ear in a rite called pirac.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bodies and other sacrifices were interred at Chuquicancha, described as a
    small hill above San Sebastian.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Priests of the Sun received the portion assigned to their deity and performed
    a sacrifice with a prayer asking that the Sun rise in peace, give light, and keep
    the people in health and peace.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Priests of Thunder, called Chuqui-ylla, received children and other assigned
    sacrifices, and the same order was observed for sacrifices to the Moon, with prayers
    for the Ynca’s health, prosperity, and victory.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The priests together offered sacrifices to Heaven and Earth, and the prayer
    to Mother Earth asked her to preserve the Lord Ynca, called her son, in peace
    and safety.
  category: speech
  evidence_refs:
  - ev:7
