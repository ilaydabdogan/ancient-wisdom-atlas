canonical_text:
  quote: ''
  summary: The passage describes confession practices before sorcerers associated
    with huacas, the testing of confessions by signs, secret confession for grave
    crimes and for the Yncas and people of Cuzco, the kinds of offenses confessed,
    a brief statement that pre-flood people were made by the Creator, and May Yutip-Raymi
    rites involving colored sheep sacrifices to the Sun and ritual actions before
    huacas at Curicancha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sorcerers associated with huacas are described as receiving replies and reporting
    them to people, though the narrator says the replies were seldom correct.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People of the land confessed publicly to sorcerers who had charge of huacas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sorcerers tested the truth of confessions by consulting signs, identified
    false confession, and inflicted severe punishments.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Grave crimes meriting death were confessed privately to a sorcerer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Yncas and the people of Cuzco made confessions secretly, generally to
    Indian sorcerers of Huaro.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Confessed religious failures included not reverencing the Sun, Moon, and huacas,
    and not celebrating the monthly Raymi feasts with full devotion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Other confessed offenses included fornication against the Ynca law, murder,
    theft, and murmurs, especially murmurs against the Ynca or the Sun.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage reports a belief that people before the flood, together with all
    other things, were made by the Creator, while the order and manner of creation
    were said to be unknown beyond prior information about Tiahuanaco.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The year was counted from around mid-May on the first day of the moon; the
    first month was called Hauca and Llusque, and its ceremonies were called Yutip-Raymi,
    festivals of the Sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the first month, a large quantity of sheep of many named colors and types,
    along with lambs of the same colors, were sacrificed to the Sun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Curicancha, in the morning, at noon, and at night, sheep for the day were
    brought and carried around idols and huacas.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The huacas named in the ritual include Punchao Ynca, meaning the Sun; Pachayachachi,
    a man-shaped Creator idol; and Chuqui yllayllapa, a thunder, lightning, and thunderbolt
    huaca in person-like form with gold ornaments.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The huacas were placed on a bench, live sheep were taken around them, and
    priests invoked the Creator, Sun, and Thunder to remain young, not grow old, and
    let things be at peace.
  category: speech
  evidence_refs:
  - ev:10
