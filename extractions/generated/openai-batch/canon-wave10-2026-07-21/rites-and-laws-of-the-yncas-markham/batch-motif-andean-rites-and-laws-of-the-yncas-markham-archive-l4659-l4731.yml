canonical_text:
  quote: ''
  summary: The passage describes Huayna Ccapac’s accession rites, prayer to the Creator,
    acclamations, and obedience oaths by chiefs and captains. It then recounts his
    family relations, his attempted forced marriage to his sister Mama Cuca, an unanswered
    appeal to his father’s dead body, ominous heavenly signs, Mama Cuca’s withdrawal
    into the house of the Acllas, later marriage arrangements, mobilization for a
    Quito campaign, Ccapac Raymi at Villcas, an oracle of Pachacamac commanding the
    Ynca to bring riches to Chimu and honor the huaca, and an order at Tumipampa to
    bring river water through a mountain into the city.
  language: English
  quote_policy: summarized
