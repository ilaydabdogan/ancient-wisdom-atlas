  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Huayna Ccapac set out toward Colla-suyu to assemble an army for Quito; chiefs
    and an army gathered at Puma-cancha because Quito and the Cayambis were reported
    to have rebelled.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Ynca distributed clothes, arms, and provisions to soldiers; chiefs took
