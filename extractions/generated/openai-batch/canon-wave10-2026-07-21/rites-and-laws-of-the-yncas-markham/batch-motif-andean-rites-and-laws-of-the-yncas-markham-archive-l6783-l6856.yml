canonical_text:
  quote: ''
  summary: The passage describes beliefs about sacrificed persons attaining rest;
    tribute in cloth, animals, food, labor, military service, and provincial products;
    ritual supplies for named deities, huacas, and embalmed Ynca rulers; the sending
    of conquered provinces' principal idols to Cuzco; and sacrificial burning of carved
    wood in the great square before the Ynca and embalmed dead lords.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons who were sacrificed were said to go to infinite rest, and some reportedly
    offered themselves voluntarily for sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cloth was a major tribute item for the service of the Ynca and of religion;
    some was distributed and the rest stored in store-houses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Different textures of cloth were made, including rich cumbi and more common
    cloth used for sacrifices; much cloth was offered in festivals.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Ynca's animals were shorn, their wool was worked up, and the resulting
    tribute was sent to Cuzco in February.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Animals required for Cuzco were male; females were not used for sacrifices
    or food.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The PachayachacJiic, the Sun, Chuquilla, Pachamama, and many other objects
    of worship had flocks set apart, and their wool was used for sacrifices and for
    clothing people serving huacas.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cloth and various foods were taken to the houses where the embalmed bodies
    of the Lords Yncas were kept.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Every conquered province had to send its principal idol to Cuzco and continue
    providing for that idol's service and sacrifices.
  category: action
  evidence_refs:
  - ev:6
