  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some provinces supplied specialized services or products, including litter-carrying,
    dancing, and red carved wood brought to Cuzco.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Red carved and painted wood from Chilcas was burned for sacrifices in fires
