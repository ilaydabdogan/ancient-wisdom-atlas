canonical_text:
  quote: ''
  summary: A shepherd and his six children prepare for destruction by water by taking
    food and sheep to the top of the high mountain Ancasmarca. As the flood rises,
    the mountain rises and remains uncovered; when the waters subside, the mountain
    becomes smaller, and the six children return to repopulate the province. The narrator
    then describes quipus as colored knotted wool strings used to preserve records
    across generations, and states that Ynca Yupanqui expanded the system, ordered
    ceremonies and religions, and established twelve named months with ceremonies.
  language: English
