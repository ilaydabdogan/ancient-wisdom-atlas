canonical_text:
  quote: ''
  summary: The passage describes prayers to the Creator, the Sun, and thunder/lightning;
    sheep sacrifices and other offerings at Huanacauri, Coricancha, Achpiran, and
    other named places; a ritual route associated with the Sun’s birth; and a Mantucalla
    feast involving the Ynca, lords, mama-cunas, dance, drink, and gold utensils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prayers ask the Creator, the Sun, and Thunder to remain young, increase the
    people, maintain peace, and provide conditions for food.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:2
  text: The passage states that the Sun was not known as the Creator, but as created
    by the Creator.
  category: relationship
  evidence_refs:
