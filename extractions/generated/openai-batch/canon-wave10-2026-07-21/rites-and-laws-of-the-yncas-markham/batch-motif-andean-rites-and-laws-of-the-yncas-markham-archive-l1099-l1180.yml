- id: obs:3
  text: Thunder and lightning are prayed to for rain, and the passage states that
    rain comes with thunder and lightning by command of the Creator.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the morning a sheep is sent to Huanacauri, killed and burnt by the tarpuntaes,
    while Yncas and Caciques circle with wool from the sacrifice and cry out a prayer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At noon another sacrifice is burnt in the court of the Coricancha, and in
    the evening another is taken to Achpiran, where the Sun sets, and sacrificed with
    the same ceremonies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Other offerings include baskets of coca, toasted maize, and red and yellow
    sea shells shaped like maize.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: On other days of the month, sheep and offerings are burnt at a series of named
    hills and plains along a route.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The stated reason for taking this direction is that the Sun was said to have
    been born in that part.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The tarpuntaes go by one road and return by another.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Ynca and his lords go to Mantucalla, where they drink, revel, and perform
    a dance with singing called Huallina four times in the day.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The mama-cunas, women of the Sun, give drink to those performing the feast;
    the wives of the Yncas remain outside in a court.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The vases and utensils used for eating, drinking, and cooking are described
    as gold.
  category: object
  evidence_refs:
