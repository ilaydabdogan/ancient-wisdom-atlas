canonical_text:
  quote: ''
  summary: Coniraya is described as causing irrigation channels to flow and practicing
    deceits among huacas. Cavillaca, a beautiful virgin huaca, becomes pregnant after
    eating a lucma fruit-like object made from Coniraya's generative seed while he
    is in bird form. She bears and nurses a son while remaining a virgin and later
    summons the huacas to identify the child's father. The child crawls to Coniraya,
    who is seated in beggar's rags. Cavillaca is ashamed and flees toward the seashore;
    Coniraya dons golden robes and pursues her, but she refuses to turn back in the
    supplied excerpt.
  language: English
  quote_policy: summarized
