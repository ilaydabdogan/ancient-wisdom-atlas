canonical_text:
  quote: ''
  summary: 'The passage explains Inca military expansion and then describes religious
    and mythic titles used to justify conquest: a post-deluge emergence from the cave
    of Paccari-tampu, analogous provincial emergence shrines, Pachacuti Inca Yupanqui’s
    promised victory after his mother’s dream concerning proper veneration of Pachayachachic,
    heavenly reinforcements associated with the Pururaucas, and the teaching that
    Cuzco was the abode of the gods with many huacas and sacred places.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Yncas are described as extending their dominion after neighboring peoples
    were reduced and joined them, giving them superior forces and military organization.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes Inca security partly to the rugged region around Cuzco,
    rivers crossing the four roads from Cuzco, discipline, knowledge, and constructed
    works.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Yncas put forward a story that after the deluge seven men and women came
    out of the cave called Paccari-tampu, then multiplied and spread over the world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Every province is said to have had a similar place of worship where people
    came forth after universal destruction, with old men and wizards explaining these
    places and the Inca veneration of Paccari-tampu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pachacuti Ynca Yupanqui’s father had been defeated by the Chancas and retreated
    to Cuzco, while Pachacuti formed an army from fugitives, the Cuzco garrison, and
    men of Canes and Canches.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before Pachacuti set out, his mother had a dream that Chanca victory occurred
    because more veneration was shown to the Sun than to Pachayachachic, the universal
    Creator.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A promise was made that more sacrifices and prayers would be offered to that
    statue; Pachacuti was promised victory over the Chancas and men sent from Heaven
    to reinforce him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Pachacuti went forth and conquered, the idea of the Pururaucas arose
    and became important as a title for Inca conquest expansion.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Those subjugated were taught that Cuzco was the abode and home of the gods,
    and fountains, wells, and walls in the city were said to contain mysteries.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says more than four hundred places of worship in Cuzco were enumerated
