- id: obs:3
  text: Huathiacuri challenges the rich man to see who dances best while wearing a
    blue shirt and a white cotton haara around the loins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Huathiacuri shouts and rushes into the place where the rich man is dancing,
    the rich man runs and is turned into a deer.
