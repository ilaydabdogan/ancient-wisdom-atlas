canonical_text:
  quote: ''
  summary: Huathiacuri defeats a rich challenger through contests advised by Pariacaca,
    transforms the rich man into a deer, turns the wife into a stone, and the stone
    becomes an object of local worship. The narrative then recounts five eggs at Condorcoto
    from which five falcons emerge and become five men, including Pariacaca, who cause
    a storm and flood that carries away the rich man, his house, family, and a tree
    bridge between mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Huanacus and vicunas bring straw for Huathiacuri's roof, while llamas bring
    similar loads for the rich man's roof.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Huathiacuri orders an oscollo to scream, frightening the llamas so that they
    shake off their loads and lose the straw.
  category: action
  evidence_refs:
