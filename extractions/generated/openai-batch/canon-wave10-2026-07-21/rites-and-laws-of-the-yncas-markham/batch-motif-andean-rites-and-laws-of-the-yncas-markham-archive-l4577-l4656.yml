canonical_text:
  quote: ''
  summary: A dream prompts warning to royal councillors, who discover and suppress
    a planned rebellion by Apu Hualpaya against the royal house. After three years
    of councillor rule, Huayna Ccapac is married to his sister Ccoya Mama Cusirimay
    during his coronation. The city is richly decorated, nobles process with the royal
    couple, the pair enter the temple of the Creator Pachayachachi, and Huayna Ccapac
    receives royal regalia, prays, takes an oath, touches the ground, and promises
    to follow his forefathers and serve Pachayachachi.
  language: English
  quote_policy: summarized
