canonical_text:
  quote: ''
  summary: The passage describes a burial in a hollowed tree whose fruit yields villca
    medicine, then recounts Pachacuti Ynca Yupanqui’s campaigns, adoption of a name
    from Yamqui-Pachacuti, destruction or capture of idols and huacas, submission
    of local rulers, weather that terrifies the Yuncas at Pachacamac, and the finding
    of two springs flowing with chicha when the Inca’s soldiers are thirsty.
  language: English
  quote_policy: summarized
