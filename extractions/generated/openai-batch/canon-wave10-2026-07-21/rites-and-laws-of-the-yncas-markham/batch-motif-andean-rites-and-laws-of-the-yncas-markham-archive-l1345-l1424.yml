canonical_text:
  quote: ''
  summary: The passage describes a ceremony for driving sicknesses and evils out of
    Cuzco. Cries are relayed from Cuzco through named lineages and mitimaes toward
    rivers, where participants bathe and wash arms or clothing. The people of Cuzco
    cry out for evils to depart, petition the Creator to allow another year, dance,
    bathe, play with lit straw torches, and use a maize pudding called sancu on faces,
    thresholds, storage places, fountains, kin, friends, and the dead. The festival
    day includes eating, drinking, and avoidance of anger or debt claims. At night
    statues of the Sun, Creator, and Thunder are brought out and ritually warmed with
    sancu, followed by food offerings at temples.
  language: English
  quote_policy: summarized
