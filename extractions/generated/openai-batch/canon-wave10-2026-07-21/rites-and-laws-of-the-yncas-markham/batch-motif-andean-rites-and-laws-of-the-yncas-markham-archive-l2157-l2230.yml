canonical_text:
  quote: ''
  summary: 'The passage describes part of an Inca knighting rite: newly armed youths,
    their relations, maidens with chicha, a dressed sacrificial sheep, and royal insignia
    proceed from near Cuzco to sacred places. At the huaca of Anahuarqui, wool is
    offered, lambs are burned in sacrifice to named sacred powers, the youths are
    flogged and exhorted to endurance, dances are performed, and the youths run a
    severe race in which some fall or die. The goal is to prove the best among the
    new knights, who later return toward Cuzco with royal insignia and the ceremonial
    sheep.'
  language: English
  quote_policy: summarized
