canonical_text:
  quote: ''
  summary: The passage describes reported forms of apostasy involving huacas; healing
    rites led by Indian sorcerers or witches for sick people; offerings of maize,
    shells, coca, metals, food, and chicha to huacas, vilcas, celestial bodies, the
    Creator, and the dead; washing at a river junction to leave illness behind; confession
    called hichoco; local opposition to such practices; and the statement that conquered
    provinces had their own rites, some later abolished or replaced by the Yncas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Several actions are described as forms of apostasy: dancing, trembling, shutting
    oneself in a house and shouting, with the claim that a huaca is in the body; other
    people fling themselves from rocks or jump into rivers as offerings to huacas.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indian sorcerers and witches are said to be called when an Indian is sick,
    both to cure the sick person and to say whether the person will live or die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wizard orders the sick person to collect named kinds of maize and colored
    sea shells, grinds the maize with the shell, and gives the mixture to the sick
    person to breathe on and offer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The offering formula addresses huacas and vilcas of the four provinces as
    grandfathers and ancestors, asks them to receive the sacrifice, and asks for health.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sick person breathes on a little coca and offers it to the Sun, and then
    similarly to the Moon and Stars, while praying for health.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sick person holds a little gold and silver of small value and offers sacrifice
    to the Creator.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wizard commands the sick person to give food and poured chicha to the
    dead on their tombs, or in a corner of the house if tomb placement is not possible,
    because the sickness is explained as caused by the dead starving.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: If able to walk to a junction of two rivers, the sick person washes the body
    there with water and flour of white maize, with the statement that the illness
    will be left there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the end of the ceremony, the wizard tells the sick person that freedom
    from sickness requires confessing all sins without concealing any; the practice
    is called hichoco.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some Indian men and women are described as refusing to allow these acts and
    as accusing practitioners before the Cura so that they may be punished.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that different nations and provinces had their own rites
    before conquest by the Yncas, and that the Yncas abolished some rites and introduced
    others.
  category: sequence
  evidence_refs:
  - ev:9
