canonical_text:
  quote: ''
  summary: The passage describes an Inca lord reasoning that the Sun cannot be the
    ultimate creator because it is obscured and constantly moves, concluding that
    Pacha-Yachachi must direct it. He orders temples, endowments, sacrifices, and
    statues for the creator and for the Sun. A fable then recounts Ynca Yupanqui approaching
    the fountain Susur-puquio, where a crystal reveals an apparition with solar rays,
    serpents, Inca regalia, and lions. The apparition calls him son, identifies itself
    as the Sun his father, foretells conquests, commands reverence and sacrifices,
    and leaves the crystal, which becomes a means of vision. After becoming lord,
    Ynca Yupanqui makes a Sun statue based on the apparition and commands temple-building
    and worship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Inca lord argues that the Sun cannot be the creator of all things because
    it can be obscured by a small cloud, travels daily, and does not rest or illuminate
    the world from one place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same reasoning leads him to identify Pacha-Yachachi as the one who directs
    the Sun and as creator.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: He orders houses and a temple at Quisuar-cancha and raises a gold statue of
    the creator shaped like a standing boy-sized man with a raised right arm and order-giving
    hand gesture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: He commands provincial heads to erect temples to the creator and to provide
    flocks, servants, farms, and estates for sacrifices.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before succeeding, Ynca Yupanqui travels to visit his father Viracocha Ynca
    at Sacsahuana and comes to the fountain called Susur-puquio.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A piece of crystal falls into the fountain, and within it he sees a figure
    described as an Indian with brilliant rays from the back of the head, serpents
    around the arms, Inca headgear and ornaments, Inca dress, lions, and another serpent
    over the shoulders.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ynca Yupanqui flees, but the apparition calls him by name from within the
    fountain, tells him not to fear, calls him son, identifies itself as the Sun his
    father, foretells that he will conquer many nations, and commands reverence and
    sacrifices.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The apparition vanishes, while the crystal remains; Ynca Yupanqui preserves
    it and is said later to see everything he wants in it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After becoming lord, Ynca Yupanqui orders a statue of the Sun resembling the
    crystal vision and commands conquered provincial heads to build richly endowed
    temples and all subjects to adore the new deity.
  category: action
  evidence_refs:
  - ev:7
