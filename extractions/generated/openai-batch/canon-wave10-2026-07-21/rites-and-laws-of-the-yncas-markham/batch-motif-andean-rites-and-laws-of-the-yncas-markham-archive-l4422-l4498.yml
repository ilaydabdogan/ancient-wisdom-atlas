canonical_text:
  quote: ''
  summary: 'The passage narrates military episodes under Tupac Ynca Yupanqui: a Quichua
    army carrying an idol is defeated; Tupac besieges the Collas, who sacrifice to
    the sun and receive an encouraging answer; captured chiefs and huacas are humiliated
    and thrown into Lake Urcos. The narrative then describes a new Andean conquest
    involving a women-only province, monkeys securing ropes across an uncrossable
    river, and battles with a warlike people said to be cannibals and poison-makers.'
  language: English
  quote_policy: summarized
