canonical_text:
  quote: ''
  summary: The passage narrates an Ynca campaign against the Cayambis and allies,
    a bloody slaughter at a lake named Yahuar-ccocha, the arrival of a black-mantled
    messenger whose covered parcel releases pestilence, the death and embalming of
    Huayna Ccapac, and Huascar's succession rituals, including a corpse-marriage for
    legitimacy, coronation regalia, sibling marriage, and a footnoted tradition about
    a golden serpent-chain hidden in a lake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ynca departs from Ccuricancha with a very large army, and the Cayambis,
    Quillisencas, and Quillacus flee to fortresses to defend themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Colla-suyu troops are ordered to attack from the rear, but the Cayambis attack
    them and cause heavy losses; the narrator says the Ynca was to blame for trusting
    promises of the huaca at Pachacamac and other idols.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ynca sends for reinforcements, hears that the Chirihuanus have invaded
    his territory, and sends experienced captains with Chinchay-suyu troops against
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The imperial forces attack the Cayambi fortresses on steep rocks, and the
    Colla-suyus are described as sparing neither age nor sex.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Cayambis flee toward a lake, are surrounded, and are slaughtered; warriors
    wash their weapons in the lake, and blood gathers in the center, giving the lake
    the name Yahuar-ccocha.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Quito during Ccapac-Raymi, a messenger in a black mantle reverently greets
    the Ynca and gives him a covered pputi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The messenger says the Creator commanded that only the Ynca should open the
    covered pputi; when opened, things like butterflies or bits of paper fly out and
    disappear.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A pestilence follows, killing Mihcnaca Mayta and many captains with scabbed
    faces; the Ynca hides in a stone house and dies there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After eight days the Ynca's body is removed dried up, embalmed, carried to
    Cuzco on a litter, and dressed and armed as if alive.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The people make obeisances to Huayna Ccapac's body, the body is deposited
    with other Ynca bodies, and general mourning follows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A son named Tupac Atahualpa is left in Quito with named chiefs and captains.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Yuti Tupac Cusi Huallpa Huascar Ynca makes his mother Rava Ocllo marry the
    dead body so that he can become legitimate; temple ministers perform the ceremony
    out of fear.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Huascar takes the title of legitimate son of Huayna Ccapac and calls chiefs
    of Ttahuantin-sayu to swear obedience to him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: For coronation, great Curacas ask Ccuricancha ministers to deliver royal regalia,
    and rich dresses, plumes, and arms are distributed to gain over chiefs.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: Huascar receives the ccapac-llautu and takes the name Yuti Cusi Huallpa Huascar
    Ynca, then marries his sisters.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: A footnote says Huascar made a garden at Sappi with gold and silver animals
    among trees and made a long gold chain whose links were shaped as serpents with
    tails in their mouths.
  category: object
  evidence_refs:
  - ev:11
- id: obs:17
  text: The same footnote reports a tradition that the golden chain was thrown into
    the lake of Molina when the Spaniards came, while also saying Huascar's name came
    from his birthplace rather than the chain.
  category: other
  evidence_refs:
  - ev:12
