candidate_motifs:
- id: motif:1
  label: Eponymic blood lake after battle
  taxonomy_refs: []
  basis: The passage explains the lake name Yahuar-ccocha through slaughter, washing
    weapons, and blood gathered in the water.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage supplies an etiological naming episode; no external comparison
    is asserted.
- id: motif:2
  label: Disease released from a covered container
  taxonomy_refs: []
  basis: The Ynca opens the covered pputi, flying paper- or butterfly-like things
    emerge, and the text immediately identifies the result as pestilence.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage gives a narrative sequence but does not explain the mechanism
    beyond identifying the pestilence.
- id: motif:3
  label: Pestilence under reported divine command
  taxonomy_refs:
  - divine_judgment
  basis: The messenger says the Creator commanded that only the Ynca should open the
    pputi, after which pestilence kills captains and the Ynca.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly say the pestilence is punishment or judgment,
    so the taxonomy reference is provisional.
- id: motif:4
  label: Royal corpse treated as living royal presence
  taxonomy_refs:
  - royal_legitimacy
  basis: Huayna Ccapac's body is embalmed, richly dressed and armed as if alive, receives
    obeisance, and later becomes central to Huascar's legitimacy ceremony.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage emphasizes ceremony and succession; it does not provide a
    doctrinal explanation of ancestor status.
- id: motif:5
  label: Corpse-marriage to establish royal legitimacy
  taxonomy_refs:
  - royal_legitimacy
  - sacred_marriage
  basis: Huascar makes Rava Ocllo marry the dead body specifically so that he can
    become legitimate, and temple ministers perform the ceremony.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The political purpose is explicit; the sacred-marriage taxonomy is based
    on the formal marriage ceremony and temple ministers, not on an explicit theological
    explanation.
- id: motif:6
  label: Coronation by regalia, oath, and gift distribution
  taxonomy_refs:
  - royal_legitimacy
  basis: Huascar obtains oaths from chiefs, receives named royal regalia, and distributes
    rich goods to gain over chiefs during coronation preparations.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage frames the distribution politically, not as a sacred exchange.
- id: motif:7
  label: Royal sibling marriage
  taxonomy_refs:
  - sacred_marriage
  basis: After receiving the ccapac-llautu and name, Huascar marries his named sisters.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage states the marriages but does not explain their religious
    or dynastic rationale.
- id: motif:8
  label: Serpent-shaped golden chain hidden in a lake
  taxonomy_refs: []
  basis: The footnote describes a long golden chain with serpent-shaped links and
    reports a tradition that it was thrown into the lake of Molina when the Spaniards
    came.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: This material appears in a footnote and is presented partly as a tradition,
    with a correction about the origin of Huascar's name.
