candidate_motifs:
- id: motif:1
  label: Killing and burial of gold-bearing visitors at a high hill
  taxonomy_refs:
  - sacrifice
  basis: The passage places the three hundred Antis’ arrival with gold in sequence
    with a crop-freezing event; after counsel, the Ynca sends them to Pachatusun with
    the gold and they are killed and buried there as a welcome.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage explicitly reports killing and burial but does not use the
    word sacrifice; the motive is stated only as a welcome and follows a frost event.
- id: motif:2
  label: Buried attendants for a deceased ruler’s next-world service
  taxonomy_refs: []
  basis: During mourning for the Ynca, attendants and servants beloved by him are
    buried, and the captains are said to believe he would need them to serve him in
    the next world.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage says they were buried but does not explicitly state the manner
    or timing of death for all those attendants.
- id: motif:3
  label: Young royal heir under a regent who seeks rule
  taxonomy_refs:
  - royal_legitimacy
  basis: Huayna Ccapac is left as heir while young, Apu Hualpaya is made governor,
    and Hualpaya is said to intend to raise himself to rule Ttahuantin-suyu by secretly
    assembling troops.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage reports this with the formula “they say,” so the political
    claim is presented as reported tradition within the source.
- id: motif:4
  label: Endowment of worshipped celestial powers
  taxonomy_refs: []
  basis: Apu Hualpaya and the child Huayna Ccapac are described as worshipping the
    sun, moon, and thunder, and Hualpaya assigns estates to these powers.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The narrator’s Christian polemical language calls these powers false gods;
    extraction retains only the reported acts of worship and endowment.
