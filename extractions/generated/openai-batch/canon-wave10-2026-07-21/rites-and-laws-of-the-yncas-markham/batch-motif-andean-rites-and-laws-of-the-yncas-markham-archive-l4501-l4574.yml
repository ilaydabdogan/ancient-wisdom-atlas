canonical_text:
  quote: ''
  summary: The passage recounts the Ynca’s return to Cuzco after reduced forces, administrative
    missions, military response to Chilli mobilization, gold brought to Cuzco and
    used on the Ccuricancha, ritual drinking at Ccapac-Raymi, the arrival of three
    hundred Antis with gold followed by frost and their killing and burial at Pachatusun,
    the deaths of the Ynca and Amaru Tupac Ynca, the succession of the young Huayna
    Ccapac under Apu Hualpaya, burial of attendants for service in the next world,
    and Hualpaya’s attempted rebellion and worship of celestial powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ynca returned to Cuzco after the forces of Uturuncu Achachi were reduced,
    abandoning conquests made by three armies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ynca sent Cacir Ccapac as visitor-general with a commission represented
    by lines on a painted stick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Colla-chahuay, Curaca of Tarma in Chinchaysuyu, was sent through the country
    to eat and drink with the Curacas and is described as an exceptional eater and
    drinker.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Apu-Quillacta and twelve thousand men of Colla-suyu returned to Sacsahuaman
    and complained of ill-treatment of exiles; the Ynca said he knew nothing of it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After news that the Chillis were assembling warriors, the Ynca sent a captain
    with twenty thousand men and twenty thousand Huarmi-aucas; the Coquimpus, Chillis,
    and Tucumans were subdued and fine gold was brought to Cuzco.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Ynca received the gold, he ordered plates of it to be made to cover
    the walls of the Ccuricancha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Ccapac-Raymi the Ynca customarily invited the people of Ttahuantin-suyu
    to drink in order; after complaints of insufficient liquor, he ordered enormous
    bowls for the following year, when large vessels were given three times daily.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Three hundred Antis arrived from the Andes of Upatari laden with gold in dust
    and tubes, and at their arrival freezing began and the crops froze to the roots.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the advice of old councillors, the Ynca ordered the Antis to carry their
    gold loads to Pachatusun, described as a very high hill, and to have the gold
    buried there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The three hundred Antis were killed and buried as a welcome.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Ynca and his brother Amaru Tupac Ynca died in the same year, leaving Huayna
    Ccapac Ynca as heir and Apu Hualpaya as governor because the heir was young.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mourning for the Ynca included forming two armies, one of men and one of women,
    and burying many yanas, pachacas, women, and servants beloved by the Ynca.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The captains believed the Ynca would require the buried people to serve him
    in the next world.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Apu Hualpaya is said to have intended to make himself ruler of Ttahuantin-suyu
    and to have secretly assembled troops from all parts for a given day.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Apu Hualpaya began to worship the sun, moon, and thunder; the child Huayna
    Ccapac also adored them and the things placed in the Ccuricancha by his ancestors.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Apu Hualpaya assigned estates to the worshipped powers, and some Curacas carried
    out his orders.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: When Hualpaya was ready to rebel, a bastard uncle of Huayna Ccapac, lying
    half awake and half asleep early in the morning, saw troops led by Hualpaya surrounding
    the city and pointing arrows.
  category: sequence
  evidence_refs:
  - ev:11
