canonical_text:
  quote: ''
  summary: The passage narrates Huascar Ynca punishing captains, installing and worshipping
    a golden image of the sun at Titicaca, mocking the litter privilege of Apu Curacas
    at Pocana-cancha, ordering Acllas to be publicly seized and violated during dances,
    and later granting Tupac Atahuallpa the Quito governorship title before reacting
    to Urco-calla's false report by burning Atahuallpa's presents, making drums from
    messengers' skins, and sending some messengers back in humiliating dress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Huascar Ynca begins punishing his father's captains with death because they
    had left Tupac Atahuallpa and other captains in Quito.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Huascar marches to Colla-suyu and Titicaca, orders a golden image of the sun
    to be set up, and worships it as Uiracocha Ynti, adding the name Ynti.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Pocana-cancha, Huascar finds Apu Curacas coming in litters under a privilege
    granted by former Yncas; he laughs at the practice but does not remove the privilege.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Huascar orders Acllas of all four classes to be brought into an open square
    before the Apu Curacas and the whole army.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Huascar tells a hundred Llamallamas and Hayacuchos, while they are performing
    dances, to seize and ravish the damsels in public.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The damsels cry out and raise their eyes to heaven when treated in this way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The great men of the kingdom resent Huascar's conduct, regard him as half
    a fool, and show reverence to him from fear.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tupac Atahuallpa asks Huascar for the title and nomination of Governor of
    the Provinces of Quito; Huascar grants the request and names him Ynca-ranti.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:9
  text: Urco-calla, chief of the Cañaris, brings false news to Huascar and asks why
    he allowed Tupac Atahuallpa to have the title of Ynca.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After becoming enraged, Huascar burns the rich presents sent by Tupac Atahuallpa,
    has drums made from the skins of the messengers who brought them, and sends a
    few messengers back to Quito dressed as women with shameful messages to Auqui
    Atahuallpa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The returned messengers are followed by a chief named Huaminca-atoc.
  category: sequence
  evidence_refs:
  - ev:6
