canonical_text:
  quote: ''
  summary: The passage describes sacrificial rites connected with huacas in and beyond
    Cuzco. Priests sacrifice offerings and children to the huaca Yanacauri on Huanacauri,
    pray for the Ynca's youth, victory, health, and peace, and send Ccapac-cocha offerings
    across the empire. It also describes processional routes, cries to the Creator,
    the reception and sacrifice of offerings by Huacacamayoc, and the accounting duties
    of Vilcacamayoc or Quipucamayoc.
  language: English
  quote_policy: summarized
