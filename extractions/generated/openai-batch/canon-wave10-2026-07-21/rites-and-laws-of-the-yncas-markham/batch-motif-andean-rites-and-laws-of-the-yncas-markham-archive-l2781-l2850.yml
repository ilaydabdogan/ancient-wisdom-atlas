  text: The passage says the preceding sacrifices were placed in the Clniqui-cancha
    before priests connected with the huaca Yanacauri offered their sacrifice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The huaca Yanacauri is described as belonging to Ayar-cachi, one of four brothers
    said to have come out of the cave at Tampu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The priest in charge of the principal huaca, with his companions, received
    children and other dedicated things and sacrificed them on the hill Huanacauri
    near Cuzco.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the sacrifice, a prayer was made to the huaca asking that the Ynca, described
    as its descendant, remain youthful and victorious, and that the country remain
    at peace during the reigning Ynca's life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the Huanacauri rite, sacrifices were made at sacred fountains, hills,
    and other sacred places in Cuzco, but no child was killed for those sacrifices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the Cuzco rites, priests brought out sacrifices to be sent elsewhere;
    people traveling with the Ccapac-cocha or Cachahuaca took separate routes rather
    than the royal road, crossing ravines and hills directly toward their destinations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The traveling parties ran and raised cries and shouts begun by a deputed Indian;
    the cries beseeched the Creator for the Ynca's victory, health, and peace.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The parties carried sacrifices, lumps of gold and silver, and other offerings
    on their shoulders; children able to walk went on foot, while others were carried
    in their mothers' arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At destinations, the Huacacamayoc received offerings for their huacas; the
    children were strangled and then burnt in sacrifice with sheep, lambs, and cloth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Children were not sacrificed at every huaca, but only at the chief huaca of
    each lineage or province.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The sacrificial journeys covered all the Ynca dominions until each traveler
