canonical_text:
  quote: ''
  summary: 'The passage describes several Inca life-cycle and state rites: a cradle
    presentation after conception or birth, a one-year naming and hair-cutting ceremony,
    a girls'' puberty rite involving fasting, seclusion, washing, clothing, naming,
    instruction, and gifts, a marriage arrangement commanded by the Ynca and made
    permanent through consent and service, and the Ccapac-cocha rite in which provinces
    bring children and valuables to Cuzco for circumambulation, division into four
    parts, offering to huacas, strangling, burial with metal figures, burning of cloth
    and coca, and transport from Cuzco.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ayuscay is described as occurring when a woman conceived; on the fourth
    day babies were placed in a cradle called quirau and uncles and other relations
    were invited, with no other ceremony performed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rutuchico occurs when a child reaches one year of age, and the child receives
    a name to be used until coming of age.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A boy later receives another name when armed as a knight and given the huaraca;
    a girl later receives another name at puberty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the rutuchico, the child is shorn; the eldest uncle cuts the first hair,
    other relations and the parents' friends also cut hair, all drink, and the principal
    uncle gives the child's temporary name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the quicuchica, girls at puberty fast for the first two days, receive a
    little raw maize on the third day, and are confined within the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the fourth day of quicuchica the girl is washed, dressed in clothes called
    ancalluasu with white wool shoes, has her hair plaited, and has a sort of bag
    placed on her head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The girl comes out to set food and drink before principal relations for two
    days; a principal relation gives her her future name and instructs her in behavior
    and obedience to parents, after which gifts are offered.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that the quicuchica custom was ordained by Ynca Yupanqui
    and involved no idolatrous practice.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the Ynca gave women as wives, the women were received because it was
    the command of the Ynca; the man went to the girl's father and presented himself
    as wishing to serve, and the girl's relations were assembled for consent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The youth stayed four or five days in the house of his father- and mother-in-law,
    carried fuel and straw for them, and then took the girl as wife under an understanding
    of permanence until death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Ccapac-cocha is said to have been instituted by Pachacutec Ynca Yupanqui;
    provinces of the four suyus brought male and female children about ten years old,
    along with cloth, flocks, gold, and silver, to Cuzco.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Ynca seated himself in the Huacay-pata, and the children and other sacrifices
    walked twice around statues of the Creator, the Sun, the Thunder, and the Moon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Ynca commanded provincial priests to divide the sacrifices into four parts
    corresponding to the four provinces or divisions of the land and to offer them
    to their principal huacas.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The children were strangled and buried with silver figures of sheep and gold
    and silver figures of men and sheep; cloth and bags of coca were burned, and people
    of Cuzco carried the sacrifices as far as Sacalpirla.
  category: action
  evidence_refs:
  - ev:5
