canonical_text:
  quote: ''
  summary: The passage gives Quechua prayers with English translations addressed chiefly
    to Uiracocha as Creator, asking for protection, eternal life, health, fruitful
    flocks, crops, and peace. It lists several Uiracocha-associated huacas and describes
    stone bird carvings and a white-robed human image at one huaca. It also includes
    prayers concerning the Sun, day and night, light, and protection from sickness.
  language: English with Quechua prayer text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prayer addresses Uiracocha or the Creator as dwelling in the heights of
    heaven, in thunder, and in storm clouds, and asks to be heard, kept, granted eternal
    life, and have an offering received.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prayer for fruitful flocks asks the Creator to multiply flocks, make them
    bring forth young, keep the land in peace and free from danger, and hold created
    beings in his hand.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage names Uiracocha-associated huacas at Chuqui-chaca, Urcos, Amaybamba,
    and Huaypau, and states that Chanca-Uiracocha was a huaca in Chuqui-chaca where
    Manco Ynca was.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the huaca of Urcos, the passage describes an eagle and a falcon carved
    in stone at the entrance and an image of a man wearing a white robe reaching to
    his feet and coming down to his waist.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A prayer asks the Creator for pity and mercy upon all people made by him,
    for health for poor servants and their children, for walking in a straight road,
    for long life, and for peaceful feeding.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A prayer calls the Creator lord of the ends of the earth and giver of life,
