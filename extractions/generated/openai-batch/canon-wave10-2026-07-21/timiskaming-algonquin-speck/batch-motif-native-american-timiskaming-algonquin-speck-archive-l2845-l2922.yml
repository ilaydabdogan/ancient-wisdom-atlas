canonical_text:
  quote: ''
  summary: The passage closes an episode in which giant women threaten to eat Tcaka'bjs
    and his grandmother; Tcaka'bjs uses a witch stone to turn the wigwam into stone
    and later survives being boiled by the giant women. A new episode begins with
    Aniwo'ye, the Monster Skunk, who hunts Ojibwa, sometimes in human form, killing
    with his odor. Hunters flee after seeing his tracks, leave behind an old woman
    unable to travel, and Aniwo'ye destroys her and the wigwam before following the
    people to Big Fisher lake.
  language: English
  quote_policy: summarized
