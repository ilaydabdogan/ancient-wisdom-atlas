canonical_text:
  quote: ''
  summary: The passage closes an account in which Gitcikwe'we uses a seven-pole mi'te'
    conjuring wigwam to seize Windigo, carry him west, and return. It then gives a
    local belief about a Manitu dwelling at Obabika Lake, an explanation of Iroquois
    pictographs as journey records, and the opening setup of an Iroquois winter-camp
    legend.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gitcikwe'we makes a bark-covered mi'te'o wigwam with seven poles.
  category: action
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:2
  text: When Gitcikwe'we enters the wigwam, it begins to work and move, and a band
    of spirits is heard singing inside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Windigo comes to the place, and Gitcikwe'we tells his wife that they will
    clinch him and take him west, where he came from.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Gitcikwe'we clinches Windigo, the conjuring wigwam shakes and makes a
    thunderlike noise, and the children faint from fright.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gitcikwe'we goes west with Windigo as captive and later returns, saying Windigo
    is sick from fright and will stay there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Another mi'te' Indian, one day's journey away, hears Windigo passing overhead
    with a painful moaning noise; other people do not hear it because they are not
    mi'te'.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The next morning Gitcikwe'we hears shouting near the portage, loads his flintlock
    gun, and goes by canoe with his wife because he thinks Windigo has returned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The person at the portage is a young man, Gitcikwe'we's wife's nephew, who
    had left his canoe at the far end and expected his aunt to take him across.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Obabika Lake is called Ma'nitu Pi-pa'gi, translated as Spirit Echo, and a
    Manitu is believed to live in a great rock on its eastern shore.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Noise near the Obabika Lake rock is said to anger the Manitu, whose growls
    or plaints can be heard when he is offended.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Ojibwa avoid the place when possible and avoid throwing stones, splashing
    paddles, or shooting guns near the lake shore.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The quoted account says Iroquois cut and painted pictures in rocks on river
