canonical_text:
  quote: ''
  summary: 'Nenebuc redirects a Bear who is now a Squirrel away from eating people
    and toward black-spruce cone seed, explaining the squirrel''s present food. The
    passage then begins the Wemicus episode: hungry Wemicus visits his son-in-law
    Ninicip, Black Duck, receives rice soup, tries to imitate Ninicip''s cooking procedure
    at home, and causes a disastrous mess in his wigwam.'
  language: English
  quote_policy: summarized
