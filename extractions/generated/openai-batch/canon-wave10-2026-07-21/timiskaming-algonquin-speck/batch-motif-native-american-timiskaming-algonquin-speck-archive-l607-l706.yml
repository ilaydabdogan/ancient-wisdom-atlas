canonical_text:
  quote: ''
  summary: Wiske'djak makes his head small enough to eat from inside a bear skull,
    but his head returns to its former size and becomes trapped. Blinded by the skull,
    he asks trees and plants their names to find low ground, a lake, and an Indian
    camp. Indians recognize him, pretend to hunt him as a bear, and chase him until
    he falls on a rock and the skull breaks off. In the next episode, Wiske'djak sees
    fat ducks migrating south in autumn, builds a dance wigwam with a fire and birch-bark
    door, asks a Duck to invite the migrating birds, and begins an invitation song
    with drum and rattle.
  language: English
  quote_policy: summarized
