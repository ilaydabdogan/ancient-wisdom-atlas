canonical_text:
  quote: ''
  summary: 'The passage contains the close of a tale in which two brothers play near
    a lake, the younger ignores his grandmother''s warning about a large pike, is
    swallowed, and is later recovered alive when the pike is caught after three days.
    It then begins and completes the tale of Lynx and his two wives, Rabbit and Marten:
    Lynx threatens them during hunger, spoils their beaver catch, finds Marten by
    making her laugh while she hides, eats her, fails to catch Rabbit, then dies after
    eating his own roasted intestines.'
  language: English
  quote_policy: summarized
