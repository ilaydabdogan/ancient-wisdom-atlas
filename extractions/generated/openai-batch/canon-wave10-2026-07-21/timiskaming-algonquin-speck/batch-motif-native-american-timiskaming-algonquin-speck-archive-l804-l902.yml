  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wiske'djak becomes angry, builds a large fire with red coals, sits over it,
    and burns himself in order to punish his anus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wiske'djak walks away suffering from burns and wanders across swamps, mountains,
    and around lakes.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: He finds newly hatched partridges while their mother is away hunting and questions
