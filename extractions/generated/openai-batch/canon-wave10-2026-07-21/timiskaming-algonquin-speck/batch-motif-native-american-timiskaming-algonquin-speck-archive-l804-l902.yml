canonical_text:
  quote: ''
  summary: Indians in a canoe find Wiske'djak asleep beside a fire where ducks and
    geese are buried in sand. They remove the birds, replace only the legs, and leave.
    Wiske'djak wakes, eats the legs, discovers the theft, argues with his personified
    anus, and burns himself over coals to punish it. Still suffering, he wanders,
    mocks and muddies newly hatched partridges, then climbs a mountain to cool his
    burns in the breeze and falls asleep on the edge of a cliff.
  language: English
  quote_policy: summarized
