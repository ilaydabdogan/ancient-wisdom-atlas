  text: A group of Indians approach by canoe after seeing smoke from Wiske'djak's
    fire on a lake shore and a strange-looking figure near it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One man goes ashore, identifies the sleeping figure as Wiske'djak, and sees
    fowl legs sticking out of sand around the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men decide to take Wiske'djak's ducks and geese from the sand and play
    a trick on him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: They dig up the fowl with paddles, twist off the legs, put the legs back into
