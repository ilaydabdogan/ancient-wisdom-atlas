canonical_text:
  quote: ''
  summary: The passage records a brief belief about left-handed cleverness, describes
    the ceremonial preparation and eating of a killed bear, including distribution
    of grease, decoration and display of the bear head and skull, and then gives a
    legend in which a captured old woman guides an Iroquois war party over concealed
    falls, dying with them while saving her people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A left-handed person is described as clever because he fools people by the
    way he does things.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a bear is killed, neighborhood families assemble at a nearby camp, and
    the hunter who killed the bear becomes host of the feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birch bark slabs are spread on clear ground as a table, and the bear carcass
    is butchered with the head, first vertebra, and breast fat kept together in a
    separate cooking vessel.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Meat portions, birch bark dishes, gravy dishes, and cooled bear grease are
    arranged for the participants.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before eating, guests sit around the bark spread, sometimes dance around it,
    and the chief gives each guest a spoonful of grease.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Halfway through the feast, the chief decorates the bear's head with bright
    ribbons attached to split cedar sticks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The chief impales the decorated bear head on a stick, dances twice around
    the company while singing, and plants the head in the middle of the spread before
    the guests.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the feast, the oldest and most venerable man receives the bear head
    and attached breast fat, and the chief consumes any remaining grease to demonstrate
    his capacity as a man and hearty eater.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The bear's lower jaw is tied to the skull, black stripes are painted on it,
    and the skull is placed on a tree branch near the water facing a river or lake
    where passers-by can see it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ceremony is explained by the people recorded in the passage as showing
