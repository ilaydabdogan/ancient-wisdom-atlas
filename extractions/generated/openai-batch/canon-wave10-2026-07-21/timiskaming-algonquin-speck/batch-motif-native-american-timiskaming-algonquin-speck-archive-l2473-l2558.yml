canonical_text:
  quote: ''
  summary: 'The passage first recounts Wemicus trying to cause his son-in-law''s death
    during bark gathering, surviving a falling tree because he is manitu, then racing
    canoes until his canoe upsets and he is transformed into a pike, which is given
    as the pike''s origin. It then begins the tale of Citjigibis: two foolish girls
    sleep outdoors under winter stars, choose red and white stars as desired companions,
    awaken in the star world with star-men, see the earth through a hole guarded by
    an old woman connected with the mite''win, and are lowered toward earth in a basket
    by a root rope but are left stranded in an Eagle''s nest.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wemicus tells his son-in-law that they should make two birch-bark canoes and
    go to get bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During bark gathering they cut a tree almost through, and Wemicus arranges
    a spoken contest while intending the tree to fall on his son-in-law and kill him.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Wemicus makes the first mistake, the tree falls on him and crushes him, but
    he is not hurt because he is described as a manitu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the two canoes are made, Wemicus proposes a sailing race, makes a large
    bark sail, while the man makes no sail because he fears upsetting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the race the man calls after Wemicus and keeps fooling and encouraging
    him until the wind upsets Wemicus' canoe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the place where Wemicus' canoe upset, the man sees a big pike into which
    Wemicus had been transformed; the passage states this is the origin of the pike.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the time of the second story, people camp in winter birch-bark wigwams,
    and animals can talk together.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two girls described as foolish make their bed outdoors and sleep under the
    stars in winter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The girls discuss which star they would like to sleep with: one chooses the
    red star, and the other chooses the white star while saying the white star is
    younger and the red star older.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the girls awake, they are in the star world with two stars who have become
    men; the white star is very old and grey-headed, while the red star is younger
    and red-headed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: An old woman in the star world sits over a hole in the sky and sometimes reveals
    it, telling the girls that it is where they came from.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The girls look down through the hole, see their people below, and become homesick.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the old woman moves from the hole, the younger girl hears the noise of
    mite'win below; when the old woman sits over the hole again near daylight, the
    noise stops, and the passage says her spirit made the noise and she is the guardian
    of the mite'win.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A note identifies the hole as a circle of seven stars, the Pleiades, and as
    the first mite'win or conjuring lodge; it also says seven poles are needed for
    this lodge.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: The old woman tells the girls to gather roots and make twisted rope coils;
    they make the rope, tie it to a big basket, get into the basket, and are lowered
    by the people of the star world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The basket descends into an Eagle's nest; the people above think the girls
    have reached the ground and stop lowering them, leaving the girls unable to help
    themselves in the nest.
  category: sequence
  evidence_refs:
  - ev:9
