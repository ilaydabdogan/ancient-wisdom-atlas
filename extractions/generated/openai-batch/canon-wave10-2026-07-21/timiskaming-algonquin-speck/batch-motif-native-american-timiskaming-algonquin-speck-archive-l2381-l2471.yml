  - ev:4
- id: obs:3
  text: Wemicus proposes sliding near poisonous snakes; the wife gives her husband
    magic tobacco in a split stick, and the snakes do not bite him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife warns that Wemicus has poisonous lizards in his head instead of lice
    and tells her husband to crack low-bush cranberries instead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a ravine, the son-in-law commands the ravine to narrow for his own jump
    and to widen when Wemicus tries; Wemicus falls in, survives, and says he has been
    beaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At hot sand, the son-in-law pretends to pick lice from Wemicus's head by cracking
    hidden cranberries and throwing them down, fooling Wemicus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wemicus takes the son-in-law by canoe to a rocky island for gull eggs, leaves
    him ashore, and tells the gulls to eat him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wemicus points to bones on the island and identifies them as belonging to
    former husbands who got eggs there.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The son-in-law kills one gull with a paddle, fastens the gull's wings on himself,
    fills his shirt with eggs, and flies over the lake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wemicus mistakes the flying son-in-law for a gull; the son-in-law defecates
    in Wemicus's face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The son-in-law returns to camp with eggs, his children play with the wings,
    and Wemicus finds him alive and plans another scheme.
  category: sequence
  evidence_refs:
  - ev:7
