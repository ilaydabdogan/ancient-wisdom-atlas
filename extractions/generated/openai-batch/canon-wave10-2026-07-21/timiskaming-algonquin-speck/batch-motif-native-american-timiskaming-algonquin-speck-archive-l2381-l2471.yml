canonical_text:
  quote: ''
  summary: 'Wemicus survives after being left shoeless by heating a boulder and using
    spruce boughs to walk over snow. He then repeatedly leads his son-in-law into
    dangers: a snake-infested sliding hill, a ravine, a lice-picking ordeal involving
    poisonous lizards in his head, and a gull island where previous husbands'' bones
    are present. The wife warns and equips her husband, who avoids the dangers through
    magic tobacco, spoken commands to the ravine, cranberries substituted for lice,
    and gull wings used for escape. Wemicus discovers the son-in-law alive and resolves
    to try another scheme.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man leaves Wemicus without shoes; Wemicus heats a boulder in a fire, wraps
    his feet with spruce boughs, pushes the boulder to melt snow, and returns singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wemicus is described as the head man, so others prepare his meal and his son-in-law
    later has to obey him.
  category: relationship
  evidence_refs:
