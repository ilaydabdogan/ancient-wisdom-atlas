canonical_text:
  quote: ''
  summary: The passage introduces Timagami Ojibwa myths and begins a Nenebuc cycle.
    In the first episode, a girl secluded at puberty dreams of the sun and is forbidden
    to look at it. After looking at the sun while getting water, she must leave to
    live with the sun. She instructs her father to place an overturned wooden dish
    before the fire; under it Nenebuc and four brothers appear on successive mornings.
    The brothers are sent to the four directions, while Nenebuc remains to attend
    to the world and the winds. Nenebuc later asks about his mother, and a speaking
    whetstone tells him his origin story.
  language: English
  quote_policy: summarized
