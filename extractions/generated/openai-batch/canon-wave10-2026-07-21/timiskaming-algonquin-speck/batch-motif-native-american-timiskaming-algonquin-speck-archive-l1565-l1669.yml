- id: obs:2
  text: An only daughter, at twelve years old and at the age of puberty, is taken
    over a hill and kept alone in a camp for twelve days without eating or drinking
    so that she might have a dream.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl dreams of the sun and is told that she must not look at the sun again,
    because doing so would require her to leave her parents and live with the sun.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: While getting water in March, the girl breaks the ice at a water hole, looks
