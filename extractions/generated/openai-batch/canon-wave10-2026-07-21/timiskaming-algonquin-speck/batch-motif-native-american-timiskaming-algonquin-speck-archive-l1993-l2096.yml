canonical_text:
  quote: ''
  summary: The passage recounts Muskrat diving beneath the water to bring up mud,
    which Nenebuc dries so that the world is made again. Nenebuc then sends Crow,
    Gull, and Owl around the world with prohibitions against eating; their disobedience
    explains Crow's black color, Gull's black wing markings, and Owl's failure to
    return. Nenebuc releases the animals, goes west, and is said to return before
    the world's end. A fragment tells how Goose gives Nenebuc wings with a warning
    not to look down; he disobeys, falls into a hollow stump, and is found by two
    girls. A final episode tells how Nenebuc transforms a man-eating Bear into a Squirrel
    and the Squirrel into a Bear, explaining squirrels' grey eyelids.
  language: English
  quote_policy: summarized
