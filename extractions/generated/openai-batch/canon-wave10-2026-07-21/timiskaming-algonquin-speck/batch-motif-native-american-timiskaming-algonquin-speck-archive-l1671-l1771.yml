canonical_text:
  quote: ''
  summary: Nenebuc responds to famine caused by excessive wind, punishes but does
    not kill the West Wind, and later arranges for wind to blow intermittently. After
    his grandparents die, he begins traveling, crosses three mountains, kills and
    cooks geese, is deceived by his personified anus, punishes it with fire, mistakes
    his own scabs for meat until corrected by a tom-tit, and changes the Partridge
    family from white to brown.
  language: English with Latin phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: High winds prevent Nenebuc from getting fish for the summer, and the people
    almost starve.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nenebuc tells his grandfather he will kill the West Wind, but the grandfather
    tells him not to kill the wind and instead make it blow for a while and then stop.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nenebuc meets his brother in the west, described as having two horns, beats
    him with a club, and breaks one horn without killing him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nenebuc tells the West Wind not to blow so hard because he fears the grandfather
    and people will starve.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the West Wind warns his three brothers not to blow, the winds stop entirely;
    the water becomes thick and stagnant, and Nenebuc cannot fish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nenebuc returns to the West Wind and asks for a little wind once in a while,
    but not too much; the arrangement is described as satisfactory.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nenebuc's grandparents die, and Nenebuc is described as grown, alone, and
    knowledgeable about trees, the world, and other things taught by his grandfather.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: On his first journey, Nenebuc walks toward the mountains, climbs three great
    mountains in one day, and kills a goose on each mountain top.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nenebuc makes a fire with a bow-drill, heats sand, buries the geese in it
    with their legs sticking out, and tells his anus to watch the geese while he sleeps.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The personified anus repeatedly warns that someone is coming for the geese,
    but the narration says it is deceiving Nenebuc.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Nenebuc strikes the personified anus and sleeps, unnamed people steal
    the geese but leave the legs in place.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nenebuc finds only the goose legs and punishes the personified anus by holding
    it over a fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The next day Nenebuc feels sick, has scabs, mistakes his own tracks and scab-like
    material for signs of another person and meat, and tastes the material.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: A little bird, identified as Gitcif'gi'*tci'gane'cicl or Tom-tit, cries out
    that Nenebuc is eating his own scabs; Nenebuc eventually discovers this.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Nenebuc encounters young partridges, asks where their mother is and what their
    names are, and they answer that their name is Kotckuijge's-i, glossed as 'Jump
    out and frighten.'
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: After hearing the partridges' answer, Nenebuc defecates over the whole family;
    the passage states that partridges had formerly been white and have since been
    brown.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The section heading states that the episode includes Nenebuc changing the
    color of the Partridge family and originating rock tripe from his scabs for the
    benefit of the people.
  category: other
  evidence_refs:
  - ev:5
