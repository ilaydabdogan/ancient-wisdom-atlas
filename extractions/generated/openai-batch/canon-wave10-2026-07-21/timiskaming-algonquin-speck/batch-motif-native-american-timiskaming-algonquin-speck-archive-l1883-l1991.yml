canonical_text:
  quote: ''
  summary: The passage is set at Smoothwater Lake, described as the scene of a world
    transformation. A big snake is associated with a rocky ridge, and the Lions send
    a snake against Nenebuc. Nenebuc wounds the Lion queen, then kills an old healer
    revealed as a toad, wears her skin, enters the Lions' cave as a supposed doctor,
    and kills the queen by pushing the arrow point deeper. At the queen's death, a
    stream pours from the cave and a world flood begins. Nenebuc builds a raft, brings
    animals aboard, and sends Beaver to dive toward the submerged land. The section
    heading also names Giant Lynx, Muskrat, earth-diving, and Nenebuc's transformation
    of earth into a new world.
  language: English
  quote_policy: summarized
