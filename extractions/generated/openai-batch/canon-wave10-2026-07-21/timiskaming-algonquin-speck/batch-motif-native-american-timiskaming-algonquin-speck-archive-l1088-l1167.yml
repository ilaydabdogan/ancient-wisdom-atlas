canonical_text:
  quote: ''
  summary: Cirjgabis travels to another village, seeks to marry a girl, and gains
    her family’s consent by promising to show how he can remain underwater. He demonstrates
    diving, hiding under rushes, and breathing through nostrils at the end of his
    bill, then explains how he can live under ice using air holes, rush stalks, and
    bottom food. Later, conflict arises with his first wife’s family and with the
    new wife’s family, who plan a dance to get the new wife away from his jealous
    watch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cirjgabis travels to another village after hearing that a beautiful girl lives
    there, sees her dressed in new beaded clothing, and wants to marry her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl’s parents question Cirjgabis’s identity, say they had heard he drowned,
    and object that he already has another wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cirjgabis stays in the camp and does not leave; at night one of the girl’s
    brothers is placed to sleep beside him so he cannot secretly go to the girls’
    wigwam.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cirjgabis tells the brother that he will show the family how he can stay underwater
    if they give him the girl; the family considers this useful for their boys and
    consents.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The family goes by canoe to the middle of the lake to watch Cirjgabis dive;
    he slides into the water, stiffens his body, sinks slowly, and disappears from
    sight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After diving, Cirjgabis reaches shore underwater and hides under rushes with
    only his bill above the water; his nostrils are at the end of his bill, allowing
    him to breathe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The family waits half the day without seeing Cirjgabis, gives him up, and
    returns home; he comes back that night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: On a second outing, Cirjgabis hides among reeds by pushing a reed just above
    the water so his nostrils remain out of water but covered, then calls out while
    the family cannot see him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cirjgabis explains that in winter he can enter through an air hole in the
    ice, reach rushes growing through the ice, put his bill into an opening for air,
    eat small mussels and bottom food, and remain under the ice for long periods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Cirjgabis’s first wife’s family hears he is alive and living with another
    woman, becomes angry, and begins conjuring to bring sickness on the new wife and
    her family.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The new wife’s family becomes angry with Cirjgabis and wants him to go away;
    he says he will give up the new wife and her family if they can get her away from
    him without his knowing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old mother-in-law plans a large dance and sends a special invitation to
    Cirjgabis and his wife, knowing he is jealous and keeps his wife apart; Cirjgabis
    suspects a trick and tells his wife not to go or leave the wigwam.
  category: sequence
  evidence_refs:
  - ev:7
