    until his relatives give him up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Months later, his wife's brothers in a canoe see a little duck far off, recognize
    it as CiTjgabis/Chjgabis, ask whether he will return, and hear him say no; he
    sinks with only his bill above water, stays under all day, and leaves the country.
  category: sequence
