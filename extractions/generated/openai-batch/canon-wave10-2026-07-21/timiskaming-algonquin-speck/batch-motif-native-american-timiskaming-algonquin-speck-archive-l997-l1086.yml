- id: obs:3
  text: Wiske'djak observes that his broad paws spread out like snowshoes and allow
    him to walk over snow without snowshoes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A note says red willow bark is mixed with tobacco and that yellow spots on
    the bark are attributed to matter Wiske-djak left in blood from scabs while walking
    over the bark.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The same note describes rock weed or rock tripe as a food eaten in the bush
    when other foods fail; it is scraped from rocks, washed, boiled, and eaten as
    soup.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wiske'djak sits on a log near a hunter's path to watch the Indians; some Indians
    later visit their rabbit snares and find rabbits stolen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A child sees Wiske'djak as a big wildcat with bulging eyes sitting on a stump
    and reports this to his parents.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The child's father takes an arrow-head club and clubs Wiske'djak; Wiske'djak
