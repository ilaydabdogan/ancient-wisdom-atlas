canonical_text:
  quote: ''
  summary: 'The selected passage continues Wiske''djak episodes: after taking Lynx''s
    eyes and skin, he can see well only at night, steals rabbits from Indian snares,
    discovers broad snowshoe-like paws, is mistaken for a wildcat or lynx, beaten,
    reveals himself, removes the lynx skin, and flees. A note explains red willow
    bark markings and rock tripe use. Another episode says Wiske''djak dresses as
    a woman and deceives young men as though he were a wife. The passage then introduces
    CiTjgabis/Chjgabis, a remarkable diver who disappears through a winter lake water-hole
    after a dispute, later appears as a little duck to his wife''s brothers, refuses
    to return, sinks, and leaves the country.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wiske'djak travels after acquiring Lynx's eyes, but discovers that they let
    him see well only at night; because he has thrown away his own eyes, he must travel
    at night.
  category: sequence
  evidence_refs:
  - ev:1
