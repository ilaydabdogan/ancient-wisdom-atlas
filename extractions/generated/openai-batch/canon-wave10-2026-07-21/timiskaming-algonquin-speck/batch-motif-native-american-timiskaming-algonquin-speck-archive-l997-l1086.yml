    it away, and runs into the bush.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Wiske'djak is said never to have married a woman, but he dresses like a woman
    with skirts and tries to deceive a young man into thinking he is his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Other people know the disguised figure is Wiske'djak and laugh; the young
    man eventually leaves, and several other young men who live with Wiske'djak as
    their wife also leave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: CiTjgabis/Chjgabis is described as a remarkable diver who can stay under water
