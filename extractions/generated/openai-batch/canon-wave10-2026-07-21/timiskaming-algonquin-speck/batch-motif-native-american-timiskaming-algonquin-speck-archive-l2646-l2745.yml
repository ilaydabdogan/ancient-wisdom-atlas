canonical_text:
  quote: ''
  summary: Cirjgibis takes two girls as wives and travels with them by canoe. After
    feeding them by diving for a beaver, he brings them to a village ruled by Chief
    Loon. The wives are attracted to Loon at a dance, deceive Cirjgibis with stumps
    under blankets, and sleep with Loon. Cirjgibis discovers this, obtains a chisel,
    flint, and feathers from his grandmother, heats the chisel, and kills Loon by
    putting it into Loon's open mouth while he sleeps. The passage explains this as
    the origin of Loon's black mouth. Cirjgibis then uses rabbit blood hidden in hay
    to make the people think he has killed himself and disappeared into the water.
    Believing both Loon and Cirjgibis dead, the people make Goose chief.
  language: English
  quote_policy: summarized
