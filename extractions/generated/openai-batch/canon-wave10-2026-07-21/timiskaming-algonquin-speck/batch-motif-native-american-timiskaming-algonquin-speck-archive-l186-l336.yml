literal_observations:
- id: obs:1
  text: The passage is a contents list for Chapter II, headed as myths and folk-lore
    of the Timagami Ojibwa.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The contents identify Nenebuc as a transformer and list an episode about the
    magic birth of Nenebuc and his four brothers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The contents list Nenebuc episodes involving tempering the wind, travelling,
    punishing his anus for deceiving him, changing the colour of the Partridge family,
    and originating rock tripe from his scabs for the benefit of people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The contents list Nenebuc episodes in which he prepares a feast, is caught
    between two trees, animals receive fat, and he is caught in the Bear's skull.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The contents list an episode in which Nenebuc wounds the Giant Lynx, disguises
    himself in a Toad's skin, and finally slays her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The contents state that the Giant Lynx causes the World Flood, gathers animals
    on a raft, Muskrat dives for earth, and Nenebuc transforms that earth into a new
    world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The contents state that Nenebuc sends Crow out, changes Crow black and Gull
    partly black for disobedience, and retires to the west until he will return again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Additional tale titles name Wemicus, Ciijgabis, Beaver, Tcaka-bis, Aniwo'ye
    the Giant Skunk, and the origin of Skunks.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Additional titles include a man who transformed a doll into a woman and followed
    her into the world above, Ayas-e and the origin of Bats, the origin of the Constellation
    Fisher, the young Loon, and the Giant Pike.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: Additional titles include Lynx and his two wives, Seal Rock in Lake Timagami,
    Rabbit, Lynx, and Fisher, Snaring the Sun, Homo Excrementi, the origin of Snakes,
    and Muskrat warning the Beaver.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: The folklore contents list practices and omens including telling stories in
    summer, foretelling the sex of a child, bringing rain, Northern Lights, Milky
    Way, Rainbow, rain omens, snowstorm-making, infant hand-warming, red sunset, a
    whirling buzzer, and divining game to be killed.
  category: other
  evidence_refs:
  - ev:12
- id: obs:12
  text: The contents list supernatural creatures named Pa-g-ak and Me'megwe'S'i and
    appendix topics about Whisky Jack, birch-bark markings, two girls, Hell-diver,
    and Loon.
  category: other
  evidence_refs:
  - ev:13
