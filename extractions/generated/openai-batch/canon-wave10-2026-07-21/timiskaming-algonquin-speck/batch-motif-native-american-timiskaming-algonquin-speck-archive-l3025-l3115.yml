- id: obs:8
  text: At a hole in the sky around the tree, the traveler jumps to the edge; his
    upper body becomes human while his lower body remains squirrel-shaped.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The wife comes across the upper world, pulls the traveler up, and warns him
    that a ball game with his brothers-in-law will determine whether he dies or survives.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In a village of great White Bears, an old Bear arranges a ball race around
