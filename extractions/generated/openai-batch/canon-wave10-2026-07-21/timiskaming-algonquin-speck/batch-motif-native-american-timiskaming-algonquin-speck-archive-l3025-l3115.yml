  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The traveler wins the race by jumping on the Bear’s back, shaking its ears
    so it drops the ball, and throwing the ball ahead; the Bears then say more tricks
    remain.
  category: action
  evidence_refs:
