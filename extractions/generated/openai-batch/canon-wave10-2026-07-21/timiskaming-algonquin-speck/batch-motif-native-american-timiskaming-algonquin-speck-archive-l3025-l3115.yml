canonical_text:
  quote: ''
  summary: A man following his wife receives food, warnings, lynx bones, and a squirrel
    tail from old women at camps. He reaches a skyward tree marked by the bones of
    failed climbers, climbs with the bones as picks, hears a spirit voice about hidden
    steps, transforms into a squirrel, and reaches a hole in the sky. His wife pulls
    him into the upper world and warns that he must survive a deadly ball game with
    her brothers-in-law. In a village of great White Bears, an old Bear arranges a
    race around the edge of the world; the man wins by tricking the Bear runner into
    dropping the ball.
  language: English
  quote_policy: summarized
