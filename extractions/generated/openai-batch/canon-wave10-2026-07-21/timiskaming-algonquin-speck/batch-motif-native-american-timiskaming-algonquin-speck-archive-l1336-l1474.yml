canonical_text:
  quote: ''
  summary: A set of Timiskaming folklore notes identifies forest beings, star and
    sky explanations, hunting omens, divination practices, hunting-luck customs, weather-producing
    acts, and a saying about fish bones resembling tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wi'ndigo is described as a man-eating creature roaming the woods and devouring
    victims.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wi'ndigo is said to have begun as a hunter who became lost in the bush, lost
    provisions and clothing, and preyed on whatever he could find like an animal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pcf'guk is described as a skeleton-like creature of bones that clatters through
    the forest and whose sound is understood as an omen that a friend will be lost.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pcf'guk is explained as a starving hunter who wished his life and flesh-strength
    transferred to his bones; after the flesh fell away, he could fly through the
    air when he wished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ursa Major is called a fisher or black cat; four main stars form the body
    and the trailing stars form the tail.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A story says animals tried to reach the North Star and froze to death, while
    the fisher remains nearest and circles it without arriving.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Northern Lights are said to be caused by waves splashing against rocky
    northern sea shores and by reflected glow; associated sounds are attributed to
    rocks and gravel grinding along the shore.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Northern Lights are treated as a sign that a heavy wind storm will occur
    within two days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The rainbow is said to form from water, especially mist from breakers, sea
    spray, or waterfall mist.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Milky Way is called bird's path because birds follow it during northward
    and southward migrations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Milky Way is less frequently called spirit path, over which spirits of
    the dead are thought to journey.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Seeing a white or albino animal is described as bad luck for a hunter, who
    must stop hunting or harm may come to the hunter or family.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Finding a dwarfed animal is described as an omen of misfortune; in the example,
    hunters return home after finding a dwarfed beaver and find a son dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A partridge breast bone is burned or scorched before the fire to foretell
    what animals hunters will kill the next day, based on the shape of the scorched
    portion.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Hunters preserve wing tips of food birds and sometimes game skulls for good
    luck and to help find game later.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Killing blue bottle flies is said to bring rain.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Throwing rabbit hair into fire smoke in winter is said to cause snow the next
    day.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: Fish bones are likened to tools and utensils in a hunter's outfit, such as
    gun, spear, bow and arrow, knife, paddle, sled, snowshoe, and awl.
  category: object
  evidence_refs:
  - ev:13
