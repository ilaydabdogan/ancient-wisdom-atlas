canonical_text:
  quote: ''
  summary: Two girls seek rescue and marriage from several animal-person passersby.
    Bear and Lynx refuse; Wolverine rescues them and takes them as wives, but they
    deceive him with hair ribbons and whistling trees and escape. The girls later
    enter Woodpecker’s very clean birch-bark house, learn that he uses smokeless beaver
    hay for fire, receive food and lodging, and are directed to a river where people
    pass in canoes. Several good-looking duck figures refuse to take them, saying
    their canoes are too small, and Chigibis arrives at the end of the excerpt.
  language: English
  quote_policy: summarized
