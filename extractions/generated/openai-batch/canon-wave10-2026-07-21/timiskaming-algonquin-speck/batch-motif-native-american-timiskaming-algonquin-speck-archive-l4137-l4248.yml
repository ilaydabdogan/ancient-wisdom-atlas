canonical_text:
  quote: ''
  summary: Two girls are rescued from a tree by Wolverine, abandon him by trickery,
    and continue through animal-person settlements. Bird hosts them, Beaver and Loon
    refuse them transport, and Hell-diver ferries and shelters them. The girls leave
    Hell-diver's bed for a dance, using logs as a decoy. Hell-diver discovers the
    trick, kills the sleeping Loon with heated iron, fakes a grief-suicide with blood,
    confesses from the lake, escapes pursuit, breaks a dam, and the returning waters
    transform the people into water animals who become friends.
  language: English
  quote_policy: summarized
