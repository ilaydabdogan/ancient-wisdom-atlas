canonical_text:
  quote: ''
  summary: Wiske'djak invites migrating birds to a farewell dance, places them inside
    with dim firelight, commands them to dance with closed eyes, and kills many by
    wringing their necks. Ciijgabis, identified in a note as the grebe, secretly looks,
    warns the birds, and is kicked by Wiske'djak; the passage explains this as the
    origin of the grebe's awkward body and far-back feet. Wiske'djak then prepares
    the killed birds for roasting in fire-heated sand, worries that someone may steal
    them, commands his own anus to act as a lookout toward the lake, and scolds it
    after it gives false alarms.
  language: English
  quote_policy: summarized
