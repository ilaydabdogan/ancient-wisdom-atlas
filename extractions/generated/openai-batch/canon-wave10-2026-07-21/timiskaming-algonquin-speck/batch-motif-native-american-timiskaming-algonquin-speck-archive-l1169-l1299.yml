canonical_text:
  quote: ''
  summary: A night dance with intoxicating drink is used to distract a jealous husband
    while an old woman removes her daughter from his wigwam and replaces her under
    a blanket with an ant-filled spruce stump. The husband returns, mistakes the stump
    for his wife, sleeps beside it, and is bitten by ants until morning. A following
    Timiskaming Algonquin text and free translation describes Wiske-djak as a mischievous
    wanderer among Indians whose speech is answered by trees, water, animals, and
    other small creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from every camp gather for a night dance with drum and rattles, and
    a boiled bark, herb, and tobacco drink that makes drinkers dizzy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cirjgabis is coaxed into attending the dance after initially not wanting to
    go, and he tells his wife to stay home and not leave.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The old woman relies on Cirjgabis' jealousy and tells her sons to keep him
    supplied with the drink until late.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman leaves the dance, cuts a dead spruce stump full of ants to about
    the length of a person, and carries it to Cirjgabis' wigwam.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old woman calls her daughter out, tells her she has come to take her home
    away from Cirjgabis, and the daughter leaves with some belongings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old woman places the ant-filled stump under the rabbitskin blanket so
    that it looks like the girl's sleeping figure, and mother and daughter flee to
    the mother's camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cirjgabis returns dizzy from the dance, feels the covered form under the rabbitskin,
    assumes it is his sleeping wife, and lies beside it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ants warm up from Cirjgabis' body, crawl over and sting him through the night,
    and in the morning he finds a rotten spruce stump swarming with ants instead of
    his wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The following remarks describe Wiske-djak as always doing mischief while living
    among Indians and teasing his countrymen wherever Indians were found.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wiske-djak is described as having no canoe, walking long distances over land,
    and travelling over almost the whole world.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Trees, water, animals, and other small creatures are said to reply to Wiske-djak
    when he speaks to them.
  category: relationship
