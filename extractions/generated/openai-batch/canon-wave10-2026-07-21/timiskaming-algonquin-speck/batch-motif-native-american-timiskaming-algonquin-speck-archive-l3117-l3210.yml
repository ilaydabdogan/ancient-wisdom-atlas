canonical_text:
  quote: ''
  summary: The passage first describes a man tested by White Bears at a great rock,
    accepted after breaking it with an arrow, and then forgiven after unknowingly
    killing their tame otters while hunting in a strange new world. It then begins
    the tale titled “Ayas'e and the Origin of Bats,” in which Ayas'e enters a skull-guarded
    rock house occupied by two blind old women, steals their cooking grease, evades
    a search, and tricks them with a fisher-skin coat so that they stab each other
    to death.
  language: English
  quote_policy: summarized
