  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man hunted and lived in his own wigwam with an old man and old woman who
    called him grandchild, and he did not know his father or mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man, unable to find a wife, carved a large female doll from a piece of
    wood; it became nearly perfect and could speak a little, though it was not yet
    complete.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The doll instructed the man to put her in the wigwam, cover her, and not look
