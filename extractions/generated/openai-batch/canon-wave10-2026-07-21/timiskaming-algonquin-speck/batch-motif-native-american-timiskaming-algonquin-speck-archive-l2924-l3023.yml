canonical_text:
  quote: ''
  summary: 'The passage first concludes the Aniwo''ye episode: people fleeing to Big
    Fisher''s camp are pursued by Aniwo''ye, Big Fisher uses an ambush based on Aniwo''ye
    turning his back, kills him by preventing his discharge, and the cut-up pieces
    become small skunks. It then begins a tale of an isolated hunter who carves a
    wooden female doll, receives from her a three-day prohibition against looking,
    breaks the rule, finds she has become a woman and departed, and sets out after
    her. He crosses frozen lakes with extraordinary speed and receives food, warning,
    and a lynx leg-bone from an old woman helper.'
  language: English
  quote_policy: summarized
