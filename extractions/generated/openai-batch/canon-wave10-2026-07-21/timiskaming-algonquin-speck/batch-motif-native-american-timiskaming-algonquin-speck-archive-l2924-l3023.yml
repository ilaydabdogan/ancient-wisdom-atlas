  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man looked before the three days were complete, saw a young girl in the
    wigwam, later found a woman's track at the water-hole, and then found the woman
    gone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After deciding to follow the woman, the man cut cedar and made himself a bow
    and many arrows.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At frozen lakes, the man shot an arrow across and ran so fast that he reached
