  summary: 'A source informant reports incidents about Whisky Jack, including a rock
    outline along the Ottawa river and birch-bark markings attributed to his actions
    with a balsam bough and a bird. The next tale begins: two girls climb a tall spruce
    in the woods, cannot descend, and a Moose passes near the tree. A footnote gives
    source-transmission information and identifies the tale as a close variant of
    part of Speck''s Timagami series.'
