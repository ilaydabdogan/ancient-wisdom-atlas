canonical_text:
  quote: ''
  summary: 'The passage closes an Ayas''e episode in which cannibal monster-bat women
    are cut up and become small bats. It then gives an origin story for the Fisher
    constellation: summer is withheld because a captor keeps Summer-birds bundled;
    Fisher frees them, flees pursuit, ascends into the sky, and is marked as Ursa
    Major/Great Dipper with a wounded tail. A short Young Loon episode explains spring
    mist and ice breakup through the return of the loon. The passage begins a Giant
    Pike story by introducing two boys orphaned and left with their grandmother in
    a fishing household.'
  language: English
  quote_policy: summarized
