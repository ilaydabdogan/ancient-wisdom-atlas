canonical_text:
  quote: ''
  summary: 'The passage records Timagami Algonquin/Ojibwa folk-lore items about weather
    and death omens, weather-making acts, a feet-first child’s curing power, a pre-hunt
    divination device, and two supernatural creatures: Pa^''gctk, a fleshless human
    skeleton whose sound foretells death, and Me''''megwe''*sfi, small hairy rock-dwelling
    beings encountered in a narrative about stolen fish, a log canoe, and a knife
    returned through a rock wall.'
  language: English
  quote_policy: summarized
