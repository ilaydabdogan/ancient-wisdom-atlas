canonical_text:
  quote: ''
  summary: A mother brings home partridges without a bow and denies that Iroquois
    are involved, though her sons notice arrow wounds. Suspecting danger, the sons
    flee at night with their baby brother to a snow-covered windfall tunnel, leaving
    false branch trails. Iroquois pursuers look into the tunnel through a hole and
    are shot by the sons. The survivors return to find the wigwam destroyed and their
    mother killed after an agreement with the Iroquois is revealed. The passage then
    lists Timagami folklore notes on summer storytelling taboo, birth-sex divination
    with a vertebra, a rain-making leaf device, names and explanations for Northern
    Lights, Milky Way, rainbow, and whippoorwill cries as omens or enemy signals.
  language: English
  quote_policy: summarized
