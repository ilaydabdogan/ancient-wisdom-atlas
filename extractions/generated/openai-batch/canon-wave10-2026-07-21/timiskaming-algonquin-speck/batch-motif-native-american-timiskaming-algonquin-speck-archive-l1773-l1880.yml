canonical_text:
  quote: ''
  summary: Nenebuc is startled by Partridge and falls from a bluff, after which he
    names rock-tripe as famine food. He prepares a bear feast but is trapped between
    two trees while animal guests take the bear grease and thereby receive their fat.
    Later he changes into an ant to enter a bear skull for food, returns to human
    form with his head stuck in the skull, navigates blind by questioning trees and
    by hearing Ojibwa cries on a lake, breaks the skull on a smooth rock, and runs
    away. The passage then begins an episode in which he shoots a great snake and
    prepares a birch-bark hiding place to ambush giant lynx at a lake shore.
  language: English with some Latin and Algonquin/Ojibwa terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nenebuc lies tired, sick, and hungry on a high bluff after young Partridges
    report his conduct and location to their father.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old Partridge follows Nenebuc's tracks, startles him by buzzing his wings,
    and Nenebuc falls over the cliff, scraping off his scabs as he slides down.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nenebuc identifies the fallen scabs as wa-'kwani, explained in the note as
    rock-tripe, an edible fungus used for soup in famine, and he is cured.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nenebuc kills a large fat bear, makes a fire with his bow-drill, cooks it,
    and prepares a feast for animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Trying to stop the noise of two wind-swayed trees scraping together, Nenebuc
    climbs one tree and gets his foot caught in a crack between the trees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Beaver sees Nenebuc caught in the tree and calls the other animals to the
    feast because Nenebuc cannot stop them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Beaver, Otter, and small animals eat or smear themselves with grease and become
    fat; Rabbit arrives last and receives only a little fat on the nape and groin.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After freeing himself, Nenebuc finds a cleaned bear skull with a little brain
    left and wishes to become an ant so he can enter the skull and eat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Nenebuc becomes an ant, enters the skull, eats enough, and returns to human
    form with his head still inside the skull, allowing him to walk but not see.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Unable to see, Nenebuc asks trees what they are; they answer with names such
    as Cedar and black spruce, helping him judge his course and ground conditions.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Nenebuc swims across a lake while blind inside the skull; an Ojibwa paddler
    with his family mistakes him for a bear, and Nenebuc uses their cries to guide
    himself.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Nenebuc lands on a smooth rock, slips, breaks the bear skull off his head,
    is recognized by the Ojibwa as Nenebuc rather than a bear, and runs away.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Nenebuc carries his bow and arrow, sees a great snake, and shoots it with
    an arrow.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: At a big lake with a sandy shore, Nenebuc sees giant lynx called Lions, finds
    them too distant to shoot directly, and builds a hollow birch-bark cylinder like
    a wigwam to hide in and shoot through a small hole.
  category: action
  evidence_refs:
  - ev:14
