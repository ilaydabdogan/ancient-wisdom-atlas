canonical_text:
  quote: ''
  summary: The old Partridge finds his young covered in black mud after Wiske'djak
    questioned them and became angry at the youngest one's name. The old Partridge
    cleans and feeds them, follows Wiske'djak, and frightens him off a cliff. Injured
    from the fall, Wiske'djak assigns names and uses to blood-marked willows and scab-covered
    rocks, explaining red willow bark for smoking and rock weed for food. The passage
    then begins a winter episode in which Wiske'djak follows an Indian's trail, finds
    a lynx caught in a snare, admires its bulging eyes, roasts it, removes his own
    eyes, and pulls the lynx skin over his head.
  language: English
  quote_policy: summarized
