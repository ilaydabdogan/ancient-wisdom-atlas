canonical_text:
  quote: ''
  summary: The passage contains the end of a comic didactic tale about an excrement-made
    visitor who melts, an etiological tale explaining the origin of small snakes from
    a lightning-struck great Snake, and a hunting-etiquette tale in which Muskrat
    warns Beaver, beavers are hunted and feast-bones thrown into water allow their
    return to life, while a lost hind-foot bone causes injury.
  language: English
