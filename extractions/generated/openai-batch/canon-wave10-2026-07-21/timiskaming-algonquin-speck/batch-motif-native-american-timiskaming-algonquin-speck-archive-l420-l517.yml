canonical_text:
  quote: ''
  summary: The passage contains two Wiske'djak episodes. In the first, Wiske'djak
    travels hungry, mistakes a mountain and island at Turn-back Lake for a great beaver's
    lodge and food supply, drains the lake, loses the beaver, chases it to Calumet
    portage, follows his own tracks, and leaves tracks said to remain in stone. In
    the second, hungry Wiske'djak gathers cranberries, encounters a bear with sore
    eyes, pretends to treat him with cranberry juice, blinds him with pain, kills
    him with stones, and begins preparing the meat for cooking.
  language: English
