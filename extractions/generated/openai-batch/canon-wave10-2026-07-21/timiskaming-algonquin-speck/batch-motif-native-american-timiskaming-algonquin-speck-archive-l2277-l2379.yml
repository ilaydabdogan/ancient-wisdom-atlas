canonical_text:
  quote: ''
  summary: In a time of hunger, Wemicus visits his son-in-law Skunk, who uses a birch-bark
    horn, a fenced enclosure, and bodily emissions to summon and kill game. Skunk
    gives Wemicus a horn and three shots, but Wemicus wastes the shots on stumps and
    a tree. At home Wemicus summons game with the horn, kills one caribou, and tries
    to deceive Skunk by putting grease in his water hole. Skunk recognizes what happened
    and kills game for Wemicus's family. A following episode describes another son-in-law
    whom Wemicus has tried to destroy like earlier husbands of his daughter; warned
    by his wife, the man swaps moccasins with Wemicus, causing Wemicus to burn his
    own moccasins instead.
  language: English
  quote_policy: summarized
