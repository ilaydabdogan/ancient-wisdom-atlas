canonical_text:
  quote: ''
  summary: Wiske-djak prepares roasted bear meat and grease. A wind-moved tree makes
    a noise; when he tries to stop it, the tree pins his hands and keeps him from
    his food. While he is trapped, animals carry away the meat. He later tries to
    cool bear grease in a bladder in the river by tying it to Muskrat, but Muskrat
    breaks the bladder and the grease spreads over the water. Wolverine eats what
    remains, and Wiske-djak finds ants eating the bear's skull and brains under a
    log.
  language: English
  quote_policy: summarized
