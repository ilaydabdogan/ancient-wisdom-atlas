canonical_text:
  quote: ''
  summary: Mem Loimis addresses Wokwuk and Kut as her children, then sends Kut west
    with water for the thirsty Mem Hui and gives him gambling sticks. Sanihas Yupchi
    dances and obtains a small basket in the Olelpanti sweat-house. As Kut travels
    over the sky with a leaking basket of water, one drop falls into Sanihas Yupchi's
    small basket and fills it. Olelbis directs thirsty persons to drink from it; many
    drink without diminishing the water. The basket is placed near Toko, water becomes
    abundant in Olelpanti, and Sanihas Yupchi departs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mem Loimis tells Wokwuk and Kut that they are her children and sons of Mem
    Loimis, and says Kahit could come and take her away if trouble arose.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wokwuk and Kut stay with their mother for five days, then one day, and then
    one day more.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sanihas Yupchi is dancing and chanting continually in Olelpanti and asks Olelbis
    to get him a suhi kilo, a small striped basket, which is put in the middle of
    the sweat-house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mem Loimis tells Kut to take water west to his uncle Mem Hui, who is dry and
    thirsting for water, while Kut's elder brother stays with her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Sanihas Yupchi has danced fifty-nine days, Mem Loimis gives Kut a basketful
    of water on the sixtieth evening.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mem Loimis gives Kut ten gambling sticks cut from grapevine in a net bag and
    says he will be a bola heris, a great gambler.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kut travels quickly over the sky above Olelpanti Hlut with a basket that has
    holes in its bottom, and water drops through the holes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: One falling drop enters the small basket in the sweat-house; in the morning
    the little basket is full, and the single drop has filled it.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Sanihas Yupchi says that he has worked as Hlahi and that the drop of water
    is all he can get.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Olelbis says the people in the sweat-house are dry and thirsty and calls Hubit,
    an old man on the west side of the sweat-house who cries for water, to look at
    the basket.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hubit says the drop is too little to help him, but after being urged to drink
    he drinks from morning until midday and must be carried away.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Though Hubit drinks for half a day, the water in the basket is no less; later
    drinkers also do not lower it.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Many named persons drink in sequence, including Kiriu Herit, Sutunut, Moihas,
    Tsararok, Kuntihle, Hus, Tsurat, Pakchuso Pokaila, Toko, Kopus, the Tsudi girls,
    Lutchi, Sanihas Yupchi, and Olelbis.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: After all are satisfied, the basket is put near Toko; afterward Toko and everyone
    have water in abundance, and the passage states that all might have perished without
    the water brought by Sanihas Yupchi.
  category: sequence
  evidence_refs:
  - ev:10
