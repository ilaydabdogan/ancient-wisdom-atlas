canonical_text:
  quote: ''
  summary: Tsawandi Kamshupa comes to the Tennas saying Tsawandi Kamshu sent him to
    invite them to a feast and hunt. He gives them deer hearts and flint bread; after
    the bread is eaten, the Tennas in the sweat-house die except for four who refuse
    it. He escapes through the guarded opening, kills three of the four with arrows,
    and the fourth becomes the source of later Tennas. Tsuwalkai Marimi later finds
    a baby in the ground with a shitpayu stalk growing from his navel. The child grows
    quickly, is named Ilhataina by Dari Jowa, and his voice shakes the sweat-house
    and earth.
  language: English
  quote_policy: summarized
