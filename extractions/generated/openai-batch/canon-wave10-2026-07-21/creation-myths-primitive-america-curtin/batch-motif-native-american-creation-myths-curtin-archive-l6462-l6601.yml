canonical_text:
  quote: ''
  summary: Winishuyat warns Tulchuherris about a rock trap set by an old man sent
    by Sas. Tulchuherris kicks down the rock with a green water-stone shoe, sends
    the old man into a dark place, and declares that he will become a ground squirrel.
    Tulchuherris then reaches a broad river where another old man offers to carry
    him across but attempts to drown him; Tulchuherris wounds him with a pointed bone,
    escapes to the far bank, and declares that he will become an eel. Near Sas's house,
    Tulchuherris reaches an impassable ridge with a cleft sugar pine that crushes
    passers; an old man beyond the wall invites him through while bones are visible
    inside.
  language: English
  quote_policy: summarized
