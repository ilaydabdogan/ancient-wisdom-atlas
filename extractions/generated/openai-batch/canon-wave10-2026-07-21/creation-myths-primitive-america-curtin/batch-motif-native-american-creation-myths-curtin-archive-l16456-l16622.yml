canonical_text:
  quote: '"Now, be no smaller, my venison, stay as you are..."'
  summary: Titindi Maupa meets his sister, who smokes, tests his arrows against a
    quartz rock, shatters the rock with her own arrow, and warns him of enemies at
    Wakara's house. Titindi travels toward Wakaruwa, asks smoke to make friends for
    him, hides his sister in otter form, encounters Paiowa while she gathers materials
    for acorn bread, and later enters the sweat-house beside her by sinking through
    the ground. Paiowa feeds him, and he produces a saddle of venison that remains
    undiminished after the household eats.
  language: English
  quote_policy: quoted
