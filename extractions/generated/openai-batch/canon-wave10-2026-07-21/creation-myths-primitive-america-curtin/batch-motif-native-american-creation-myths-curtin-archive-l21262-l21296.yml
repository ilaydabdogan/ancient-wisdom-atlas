canonical_text:
  quote: ''
  summary: 'A section titled “Songs of Spirits” gives four short first-person songs:
    Lightning carries a sucker-torch to a western tree-ridge and claims to be first
    born and greatest; Olelbis speaks of being great above and tanning a black cloud;
    Hau, red fox, travels and whistles on roads including a road of stars; Waida Werris,
    the Polar Star, says the earth’s circuit and the scattered stars are the place
    for his hair. A note explains hair as equivalent to rays of light when connected
    with luminaries.'
