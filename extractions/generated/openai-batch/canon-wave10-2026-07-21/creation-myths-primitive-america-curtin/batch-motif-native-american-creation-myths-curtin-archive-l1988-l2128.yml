canonical_text:
  quote: ''
  summary: On the day of a great fire, Olelbis stations several named beings at and
    around a completed sweat-house, sends Lutchi to raise and prop the northern sky,
    and sends Sutunut to summon Kahit and Mem Loimis. Sotchet drinks his mother Mem
    Loimis’s milk to bring great water. When Mem Loimis and Kahit start southward,
    water rushes through the sky opening, covers the earth, and puts out the fire.
    Olelbis watches the approaching swimmers and prepares a sling with a white stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says the old man can be asked to turn his face toward the hearers
    and bring Mem Loimis; the old man sits with his head between his hands, facing
    north, at Waiken Pom Pui Humok Pom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kiriu Herit is the first person to come to Olelbis on the day of the fire,
    and Olelbis sends him to the west side of the sweat-house to look around and report
    what he sees.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lutchi Herit is sent to the east side of the sweat-house to call to Kahit,
    and he darts around while calling that Kahit cannot take or catch him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two Tilichi brothers are sent into the sweat-house; Kuntihle arrives fifth,
    and Sutunut arrives sixth and is called a great person.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Olelbis tells Lutchi to go north, pry up the sky, and prop it with a sky pole
    and sky prop; he tells Sutunut to summon Kahit and Mem Loimis and to put two feathers
    on Kahit’s cheeks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lutchi reaches the northern sky and raises and props it; Sutunut delivers
    the message to Kahit, who raises his head, turns south, and receives the feathers
    on his cheeks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sotchet, whose mother is Mem Loimis, says he will follow Kahit and is drinking
    his mother’s milk; the passage states that he is doing this to bring great water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kahit tells Mem Loimis to come with him and to go a little ahead when he starts.
  category: speech
  evidence_refs:
