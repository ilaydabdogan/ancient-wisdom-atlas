  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yoholmit Pokaila makes a white willow basket, and Sosini Herit prepares to
    move while holding a bow and arrows in one hand and using the other hand to swim.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Olelbis sees and knows that Mem Loimis, Kahit, and the people around them
