  summary: The passage is an editorial/historical note about violence against the
    Yanas in Northern California in 1864. It states that Mill Creek outlaws, not the
    Yanas, killed Mrs. Allen and Mrs. Jones; that the Yanas were nevertheless slaughtered
    and plundered by hostile white killing parties; that a few settlers rescued some
    Yanas; and that the remaining Yanas should be given land and means to restart
    life.
