canonical_text:
  quote: ''
  summary: The passage contrasts two groups of ten brothers, describes Kele arming
    them and instructing them in deer snaring, shows household routines of hunting
    and root gathering, gives names to two sisters, and narrates the sisters' mountain-top
    sighting of Sedit and their learning of a song from Kele that reaches him while
    he gathers red earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first ten smooth men are described as having good sense, while the second
    ten are inferior, with the ninth and tenth of the second ten described as very
    bad.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first ten take only one mouthful each, while the second ten take increasing
    numbers of mouthfuls from one to ten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first ten ask what they are to do because they have nothing with which
    to hunt.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kele gives bows, quivers with arrows, and five grass-fibre ropes, and shows
    the brothers where to set snares for deer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brothers set snares at the foot of the mountain; the smooth ten stand
    on the mountain top, while the rough ten drive the deer and are told to shout
    so they can be heard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When deer are caught, the smooth ten take the bodies and best meat, while
    the rough ten receive legs, ears, horns, and other poor parts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two sisters cook roots and venison for all.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kele makes a big fire of manzanita wood and tells the boys to get up and swim.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The sisters wish to see people other than their brothers and father.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elder sister asks Kele to tell her name, and Kele names her Klereu Lulimet
    and names her sister Pili Lulimet.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The men repeatedly sweat, swim, kill deer, and snare deer, while the sisters
    dig and cook lily roots.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The sisters sit high on the mountain side looking westward and can see far
    across the country toward the great western water.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The sisters see a man going northward; he stops, seems to sit down, and disappears
    through the earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The sisters say they would like to see and talk to the man, and they forget
    to dig roots until shortly before sunset.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The younger sister asks Kele to teach them how to sing, and Kele teaches a
    short song.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The rough ten come in with great noise, smeared with deer blood and wearing
    deer entrails around their necks.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The sisters later sing together from the mountain top, and their song goes
    straight to the distant man.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:18
  text: The distant man is identified as Sedit; he is getting red earth for acorn
    bread, is covered with shells, and hears something while digging.
  category: action
  evidence_refs:
  - ev:12
