canonical_text:
  quote: ''
  summary: Kaltsauna teaches the Mapchemaina to make arrow-points from flint. Jupka
    orders ritual preparation for a hunt, directs hunting routes, presides over the
    return and distribution of food, and later appoints Ahalamila to dream, sing,
    and dance for deer. During the hunt Chichepa is chased by a grizzly bear and hides
    in a hole in a rock. Ahalamila performs a fire, smoke, fir-leaf, quartz-rock,
    and four-direction twig ritual.
  language: English
  quote_policy: summarized
