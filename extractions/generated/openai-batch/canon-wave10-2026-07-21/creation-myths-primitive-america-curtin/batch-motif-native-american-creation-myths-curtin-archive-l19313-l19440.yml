- id: obs:1
  text: Kaltsauna gives flint to the Mapchemaina and shows them how to make arrow-points.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jupka commands the Mapchemaina to prepare arrow-points, sweat at night, swim
    early, and go on a great hunt the next day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hunting group travels west along Jidjilpa toward Tahaujwakaina, beyond
    Hakamatu, and passes a rock.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A grizzly bear runs out of live-oak brush and rushes at Chichepa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chichepa had dreamed the night before that the rock in the canyon jumped up
    from the ground and frightened him.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chichepa flees to Tahaujwakaina and jumps into a hole in the top of the rock;
