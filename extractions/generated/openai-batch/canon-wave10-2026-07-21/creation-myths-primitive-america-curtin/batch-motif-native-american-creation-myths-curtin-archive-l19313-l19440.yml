  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bear is described as so angry that it tears up large oak-trees while running.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Members of the hunting party kill deer; the first group with deer turns home
    toward Jigulmatu in the order in which they killed them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A second party also kills deer, including a very ugly large deer described
    as swollen in flesh and body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The women prepare acorns and mice to eat when the hunters return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Jupka does not go hunting; he remains at Jigulmatu, tells others what to do,
    and shows them how to do what is needed.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Hunters place their venison before Jupka, who cuts it with a flint knife and
    roasts it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Mapchemaina eat meat together, while Jupka places three large baskets
    of mice in three places for distribution.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Jupka asks everyone to come into the sweat-house at night so he can tell them
    where to hunt the next day.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Jupka is said never to eat anything and to take only tobacco smoke into his
