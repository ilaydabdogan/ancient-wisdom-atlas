  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Jupka instructs old men, young people, and women to sleep until morning, when
    he will call them to the hunt.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: Ahalamila makes a fire, takes his pipe, and blows smoke in every direction.
