canonical_text:
  quote: ''
  summary: Olelbis builds a great sweat-house using six oak trees, with help from
    two old women who provide flowering plant bindings, mats, and other coverings.
    The house grows large and splendid, is named and praised, and is said to last
    forever. On the next morning a world fire begins below, and the old women tell
    Olelbis about Kahit Kiemila, a very old man outside the first sky, in relation
    to putting it out.
  language: English
  quote_policy: summarized
