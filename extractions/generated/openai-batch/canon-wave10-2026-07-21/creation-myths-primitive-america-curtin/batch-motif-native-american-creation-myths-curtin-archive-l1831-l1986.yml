- id: obs:3
  text: One old woman obtains humus koriluli from the south and makes a long narrow
    mat with roots, stems, and blossoms to bind the treetops.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two old women make and provide four large mats for the north, east, south,
    and west sides of the house, using flowering plants with blossoms turned outward.
  category: action
  evidence_refs:
  - ev:3
