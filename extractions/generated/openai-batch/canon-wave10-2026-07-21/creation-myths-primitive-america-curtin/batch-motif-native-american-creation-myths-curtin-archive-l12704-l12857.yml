canonical_text:
  quote: ''
  summary: Igupa Topa refuses food by day but secretly eats all non-venison food at
    night. After hearing complaints, he raises a cold rainstorm that floods Tuina's
    sweat-house. Igupa protects Pun Miaupa and Halai Auna while the others drown,
    then later calls the dead to rise. Wakara's household dances upward through the
    smoke-hole and returns home. Igupa enters his nephew's heart again, and Wakara
    introduces a dangerous deer-sinew pole sport.
  language: English
  quote_policy: summarized
