canonical_text:
  quote: ''
  summary: Tsore Jowa survives a burning by catching the sun, while others burn. Haka
    Lasi catches hearts from the burning bodies, strings the captured hearts around
    her neck, and goes to deep water at Crater Lake. Juka's heart and his eldest son's
    heart escape, become themselves again at separate places, and remain sunk in the
    earth. Tsore Jowa mourns, searches for Haka Lasi, tells the Tsanunewa household
    what happened, and bargains with two brothers to catch Haka Lasi using red and
    green deer-bones made into spear-points.
  language: English
  quote_policy: summarized
