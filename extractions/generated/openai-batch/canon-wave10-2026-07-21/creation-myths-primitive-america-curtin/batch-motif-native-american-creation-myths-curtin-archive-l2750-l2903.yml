canonical_text:
  quote: ''
  summary: Katkatchila explains to Olelbis how a great world fire, made after Torihas
    and his people stole Katkatchila's flint, produced smoke and steam that became
    cloud people. Olelbis directs the Katkatchila brothers to build fences and a snare
    to stop or catch the clouds. They catch one black cloud, skin it, give the skin
    to Olelbis, and Olelbis tans and gives it to a cold grandmother or old woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Katkatchila asks why Olelbis does not know the cloud people and says Olelbis
    ought to know every place, person, and thing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Katkatchila says he and his sister made the great world fire and the wakpohas
    because Torihas and his people stole Katkatchila's flint.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Katkatchila says his sister's baby was put outside the house with pitch-pine
    around it, and fire blazed up from the baby.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the fire burned over the earth, a big water and a strong wind came, making
    steam and smoke that were carried south and became cloud people.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The cloud people are described as red, white, or black, as always going north,
    and as having good heads and long necks.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
