canonical_text:
  quote: ''
  summary: Titindi Maupa prepares to leave secretly, sets beads on a staff as a death
    sign, commands household objects not to reveal his route, and enters the ground
    beneath the central house post. Titildi Marimi returns, questions the silent sister
    and household objects, learns the route from the forgotten acorn flour, arms herself,
    follows him underground and over Backbone Mountain, asks the Sun to slow, and
    gains on him. Titindi Maupa travels west singing of Paiowa, Wakara's youngest
    daughter, whom he hopes to marry, while Titildi Marimi catches sight of him near
    a mountain spring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The brother bathes in the river, returns to the sweat-house, eats, and tells
    his younger sister that he is going away and must leave her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He dresses in rich clothes, ties a string of beads to a staff, and says the
    beads will fall if he dies; he instructs that the beads not be touched while hanging.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: He tells the younger sister not to reveal that he has gone or show their sister
    his route.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: He addresses household things, including poking-stick, baskets, fire, basket
    of water, and roots, ordering them not to tell his sister; he forgets to give
    this order to the acorn flour.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: He pushes up the central house post, enters the ground, reaches a spring,
    makes misleading movements in several directions and in circles, then emerges
    west of the house onto a trail.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Titildi Marimi thinks her brother will go away that day, hurries home from
    the mountain flat, finds him absent, and sees her sister crying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sister at home refuses to answer Titildi Marimi's questions and continues
    crying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Titildi Marimi says that if she cannot catch her brother he will die or his
    enemies will kill him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Titildi Marimi asks rocks, household items, the post, and finally acorn flour
    where her brother went; the acorn flour answers that he is gone, angry because
    Topuna was injured, and says he went under the post.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Titildi Marimi puts on new things, takes a bow and otter-skin quiver filled
    with arrows, puts on leggings like a man, and says she will follow and help her
    brother.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Titildi Marimi follows the same route under the post to the spring, tracks
