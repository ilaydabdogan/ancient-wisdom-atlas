canonical_text:
  quote: Putokya looks around, finds tracks, follows the people southward...
  summary: Putokya follows the villagers to Wamarawi, tries repeatedly to break into
    the mountain cave where they are hiding, fails, and leaves after nearly breaching
    the cave from above. He travels north destructively. Metsi, who had been away,
    hears Putokya approaching, plans to meet and cure him, removes his fine clothing,
    wishes for an old basket and strap, and transforms himself into a bent old woman.
  language: English
  quote_policy: quoted
