    puts it down, and it becomes quartz again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jupka calls his people to rise, start out, and hunt, and says Howichinaipa
    will go ahead and make a fire.
  category: speech
  evidence_refs:
  - ev:3
