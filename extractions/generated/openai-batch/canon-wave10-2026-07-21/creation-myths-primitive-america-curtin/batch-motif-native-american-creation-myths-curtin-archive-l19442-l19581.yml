canonical_text:
  quote: ''
  summary: Ahalamila sings while twigs grow into trees and a stone becomes a white
    fawn, then uses smoke before the fawn returns to quartz. Jupka sends the people
    to hunt and Howichinaipa makes a fire, but the hunters find no deer because Howichinaipa,
    angry and jealous, has sent the deer underground. A quarrel between Ahalamila
    and Howichinaipa becomes a battle in which Ahalamila and others are killed; rocks
    at Hwitalmauna are identified as fallen Mapchemaina from that first battle. Jihkulu
    and Jewina are associated with protective animal skins, and Jupka rushes from
    the sweat-house to stop the fighting.
  language: English
  quote_policy: summarized
literal_observations:
