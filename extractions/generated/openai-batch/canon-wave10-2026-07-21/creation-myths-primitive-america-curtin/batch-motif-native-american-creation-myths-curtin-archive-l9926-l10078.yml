canonical_text:
  quote: ''
  summary: An alarm announces that Puriwa and Sanihas have been stolen, and dancers
    pursue three men carrying bags westward. Pawnit releases darkness from a bag to
    stop the pursuers, and Patkilis later releases daylight so he and Pawnit can continue
    to Norwinte's. Keriha and Norwanchakus later travel and fish along rivers; Keriha
    names places still used by the Wintus. The brothers visit the powerful woman Pom
    Norwanen Pitchen/Norwan, where Norwanchakus warns Keriha not to take food except
    what is given. Keriha nevertheless seizes acorns; the earth opens and sinks until
    he drops them. The brothers then settle near a salmon eddy, and a very small stranger
    arrives at their house.
  language: English
  quote_policy: summarized
