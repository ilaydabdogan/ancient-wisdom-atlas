- id: motif:2
  label: Darkness and daylight stored in portable containers
  taxonomy_refs:
  - duality
  basis: Pawnit releases thick darkness from a bag to stop pursuers, while Patkilis
    later releases daylight from another bag to continue the journey.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The dark-light opposition is explicit, but the passage does not explain
    the origin or cosmological status of the bags.
- id: motif:3
  label: Place naming during a culture-heroic journey
  taxonomy_refs:
