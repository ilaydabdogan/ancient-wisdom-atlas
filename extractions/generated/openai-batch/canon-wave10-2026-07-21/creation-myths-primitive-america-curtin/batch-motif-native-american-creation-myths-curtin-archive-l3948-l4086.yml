canonical_text:
  quote: ''
  summary: 'The passage gives a catalogue of personages and later transformations,
    then begins the Norwan narrative: Norwan emerges from the earth before the present
    Wintu people, lives and dances alone in a sweat-house, is identified by Olelbis
    as his sister, and receives from him a blossoming staff, singing feathers, red
    face-coloring blossoms, and acorns with instructions for producing acorns on trees.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening catalogue states that each listed personage is followed by the
    beast, bird, or thing into which that personage was later changed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman named Hluyuk Tikimit, Pom Norwanen Pitchen, and Norwan came up out
    of the earth east of Pas Puisono.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Norwan appeared before the present Wintu people came out of the ground at
    Tsarau Heril.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Norwan says to herself that she is now in the world and will look around to
    see from what places people are coming.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Norwan lives alone in her sweat-house, called Norwan Buli Hlut, and dances
    there during daylight.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Olelbis looks down at Norwan, calls her his sister, and says she has come
    up before the new people on earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: While building his sweat-house in Olelpanti, Olelbis cut a piece from a white-oak
    tree; the piece rolled outside the sky to the lower world and became a people
    in Nor Puiken in the southeast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Olelbis says Norwan has come before the Wintus, will be with them hereafter,
    and has not yet been made ready for her work.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Olelbis gives Norwan a yosoü plant to use as a dancing staff, saying its blossom
    will always bloom on top.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Olelbis gives Norwan two wing feathers from a small bird and tells her to
    place them in her hair; the feathers will sing early in the morning and tell her
    when to begin dancing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Olelbis gives Norwan buri luli blossoms and tells her to crush them and put
    their juice on her face to make her cheeks red.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Olelbis asks his grandmothers for acorns, receives some, gives them to Norwan,
    and instructs her to rub shelled acorns, blow the dust upward, and cause acorns
    to come on trees.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The staff, feathers, blossoms, and acorns are given to Norwan on the first
    morning after she comes to Norwan Buli.
  category: sequence
  evidence_refs:
  - ev:11
