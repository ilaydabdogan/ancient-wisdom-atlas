canonical_text:
  quote: ''
  summary: Two old maids wearing the skins of Sukonia's wives impersonate them while
    making acorn porridge. Sukonia tests them by asking for water. Chikpitpa arranges
    a staged whipping and crying fit, then kicks the impostors into boiling porridge
    and fire, killing them. Sukonia follows his wives' trail, finds their dead bodies,
    strikes and calls them with a deersinew bowstring, raises them to life, brings
    them home, and sends them to visit their father with presents and venison; they
    return safely.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two old maids wearing the skins of Sukonia's wives are making acorn porridge
    and appear enough like his wives to make him doubt their identity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sukonia decides to ask the women to bring water from the spring as a test
    of whether they are truly his wives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: One woman takes a water basket and asks Chikpitpa to come with her; Sukonia
    stops her and concludes the women are strange women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chikpitpa tells Sukonia to whip him so that he can cry, roll, kick the women
    he calls nasty frogs, and kill them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the acorn porridge is boiling hard, Sukonia strikes Chikpitpa with a
    switch and scolds him while Chikpitpa cries and rolls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chikpitpa kicks one false sister into the boiling porridge and the other into
