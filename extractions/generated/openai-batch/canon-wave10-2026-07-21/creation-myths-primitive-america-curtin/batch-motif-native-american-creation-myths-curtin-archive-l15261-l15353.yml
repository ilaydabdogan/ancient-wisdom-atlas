  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the false sisters are killed, Sukonia throws them outside, mourns for
    his wives through the night, and leaves the next morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sukonia follows his wives' trail, finds their dead bodies, strikes them with
    a deer-sinew bowstring, calls them, and raises them to life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The revived wives say the Ichpul sisters stopped them on the road, asked them
    to sit and talk, and killed them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sukonia brings his wives home; Chikpitpa sees them from the roof and runs
    to meet them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sukonia sends the two wives to their father with presents and venison and
    tells them to return by sunset.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The wives visit Old Jahtaneno, return with many presents from him, and meet
