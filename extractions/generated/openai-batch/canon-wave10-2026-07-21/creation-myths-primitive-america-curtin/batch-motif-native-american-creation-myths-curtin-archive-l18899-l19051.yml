canonical_text:
  quote: ''
  summary: Hehku travels with her sister Miniau Marimi to a hollow mountain, then
    returns to Jupka's sweat-house to gamble. She transforms her appearance, refuses
    food, challenges Kaitsiki, and uses a finger-bone gambling object moved by song
    so that Kaitsiki repeatedly loses. After Kaitsiki wagers and loses himself, Hehku
    throws the finger-bone; it shakes the earth, kills him, and Miniau throws him
    out through the roof.
  language: English
  quote_policy: summarized
