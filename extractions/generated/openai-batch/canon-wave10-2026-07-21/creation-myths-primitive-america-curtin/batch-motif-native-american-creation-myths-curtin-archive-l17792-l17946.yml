canonical_text:
  quote: ''
  summary: Juiwaiyu encounters two sisters near a mountain after they and he have
    dreamed of one another. The sisters return to Damhauja's household, where Juiwaiyu
    appears between them by passing through the house's central pillar and the ground.
    Damhauja tests the new son-in-law with a pipe containing crushed bones of Mapchemaina;
    the sisters avert the first attempt, and Jupka secretly smokes the second pipe
    without harm. Jupka then supplies a small piece of venison that Juiwaiyu makes
    remain undiminished while sliced, leading Damhauja to call his sons and sons-in-law.
    Observers from the west dispute whether they have seen the strange new man.
  language: English
  quote_policy: summarized
