canonical_text:
  quote: ''
  summary: The passage describes ritual dancing in a dark hot sweat-house, spirit
    possession and spirit-specific food or clothing restrictions, dangerous bad spirits
    including Kele the mountain wolf and the sucker, causes of sickness by spirit
    points or missiles, and curing practices in which doctors aided by spirits locate
    and extract a dokos missile from a patient. It also emphasizes the dangers and
    restrictions of being a doctor with many spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People dance all night in a sweat-house described as dark and very hot, although
    no fire is present.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: People to whom spirits have come tell the doctors and chief which spirits
    are with them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A chief may give food offensive to a spirit if the spirit is not identified,
    and the spirit may kill the person if that food is eaten.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Old doctors ask a possessing spirit what it wants and make it go away temporarily
    so that the possessed person may eat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each spirit has its own food preferences; examples include the salmon spirit
    liking leaves or water, mountain sucker taking mountain pine nuts, and valley
    sucker needing digger pine nuts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some spirits dislike buckskin, so the person to whom they have come must not
    wear it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Bad spirits are said to be numerous, and the sucker and Kele, the mountain
    wolf, are named among them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kele may appear as a good-looking man or woman in the mountains or woods,
    approach or speak, and then turn into a wolf and run away if the human agrees
    with it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After Kele's transformation, the affected person's mind is said to be gone
    because the wolf has taken it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The sucker is said to act similarly, but it disappears before the person's
    eyes or turns into something ugly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: 'Three causes of sickness are given: an angry good yapaitu spirit striking
    with a spirit point, a bad spirit putting its missile into a person, and an evil
    spirit sending a missile at a doctor''s request or prayer.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: When a dokos missile is drawn out by the curing doctor's assisting spirit,
    the doctor forces it to say which yapaitu and which doctor sent it, though it
    may lie or accuse the wrong person.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: A doctor with a spirit in him can look through the patient's body and see
    where the dokos lies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A stronger assisting spirit can draw out the dokos and cure the patient.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:15
  text: Drawing out a powerful dokos by sucking is dangerous because the owning spirit
    may send it through the doctor's mouth into his body and kill him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: A doctor may have many spirits but usually calls on only a few, and not all
    spirits are suited to work together in a given case.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: A doctor must please each helper spirit according to its particular food preferences
