canonical_text:
  quote: ''
  summary: Patkilis reports visiting a hill beyond the eastern sky where villages
    lie on the northern and southern slopes, a river flows westward, and people dance
    on the south side. In a northern house he finds a blind boy guarding stores of
    acorns and two full bags containing Puriwa and Sanihas. Keriha identifies the
    bags as sources of darkness and daylight and says they should be brought back.
    Pawnit, Tsaik, and later Patkilis go to the eastern hill; Tsaik takes acorns while
    Patkilis and Pawnit take the bags of daylight and darkness. The blind boy discovers
    that something has been stolen.
  language: English
  quote_policy: summarized
