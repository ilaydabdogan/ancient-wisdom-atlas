canonical_text:
  quote: ''
  summary: Tulchuherris brings dead snakes to Sas's house; Sas mourns them as his
    children. Sas then sends Tulchuherris to a supposed hunting place, but Winishuyat
    warns that Sas has killed people there and will drive grizzly bears against him.
    Tulchuherris instructs his panther dog, dodges the attacking bears, and the dog
    kills them. Tulchuherris brings the ten dead bears home; Sas again mourns them
    as his children. Sas next directs Tulchuherris toward a brush house supposedly
    near a spring, while Winishuyat warns that the place, Wintubos, has no water and
    is full of snakes, poisonous things, and bears.
  language: English
  quote_policy: summarized
