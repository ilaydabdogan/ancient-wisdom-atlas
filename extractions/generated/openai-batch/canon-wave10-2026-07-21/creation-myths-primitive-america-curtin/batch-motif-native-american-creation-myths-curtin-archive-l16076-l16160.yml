canonical_text:
  quote: ''
  summary: Swift runners tell the women at Wahkalu that Haka Kaina and his army have
    been killed and burned at Wamarawi. The women travel with gifts to the two brothers,
    begging them to restore their husbands. The brothers agree, direct the women and
    their sisters to place the bones in a great spring, and set a nighttime restriction.
    At daylight the dead emerge alive from the spring, including Haka Kaina's army
    and Wipajusi's three daughters. Haka Kaina thanks the brothers with gifts, returns
    to Wahkalu, and the community celebrates, lays aside war gear, eats, and rests.
  language: English
  quote_policy: summarized
