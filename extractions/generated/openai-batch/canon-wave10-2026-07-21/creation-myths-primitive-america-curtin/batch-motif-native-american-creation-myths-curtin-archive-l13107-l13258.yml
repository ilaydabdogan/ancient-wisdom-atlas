canonical_text:
  quote: "“a baby would come from the ground, would rise from his spittle”"
  summary: After Tsawandi Kamshu has gone out and his bow and quiver fall at dusk,
    Tsuwalkai Marimi mourns the dead Haka people while the Tennas watch outside, wanting
    to kill her. On the fourth night she hears a baby crying near Tsawandi Kamshu’s
    sleeping-place, finds him covered with dirt, mud, and ashes, recalls that Tsawandi
    Kamshu had said a baby would rise from his spittle, names the child Tsawandi Kamshupa,
    and washes him. The child grows rapidly without food and becomes a full-grown
    man in ten days. He asks about the house and its people, learns that the Tennas
    killed the Hakas, asks for a bow, breaks many bows, but cannot break the old bow
    associated with the best Haka man.
  language: English
  quote_policy: quoted
