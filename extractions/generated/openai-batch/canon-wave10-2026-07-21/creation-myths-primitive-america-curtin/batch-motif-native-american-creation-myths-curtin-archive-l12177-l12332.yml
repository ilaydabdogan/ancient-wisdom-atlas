  - ev:5
  confidence: high
  cautions: The term yapaitu is not defined in the passage, so its nature should not
    be specified beyond the text.
- id: motif:3
  label: Ritual power contest with serpent and fire from the mouth
  taxonomy_refs:
  - serpent
  basis: Tulitot displays a rattlesnake from his mouth during a Hlahi dance; Kol Tibichi
    responds by emitting burning flames from both sides of his mouth, causing fear.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The fire is a display of power, not a world-destroying fire; the serpent
    is Tulitot's child, not otherwise explained.
- id: motif:4
  label: Healer's remains become curative natural substances
  taxonomy_refs:
  - death_rebirth
  basis: Kol Tibichi says his body can become a rock whose pieces, earth, or moss
    cure the sick, or produce curative water in a black-oak hollow.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: There is no explicit resurrection or return of Kol Tibichi; the passage
    emphasizes postmortem transformation and healing efficacy.
- id: motif:5
  label: Rainbow emerging from grave after burial
  taxonomy_refs: []
  basis: Kol Tibichi instructs that after his burial a rainbow will come out of the
    grave the next morning.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage does not explain the rainbow's function beyond its appearance
    from the grave.
