candidate_motifs:
- id: motif:1
  label: Child healer saves a dying chief
  taxonomy_refs:
  - miraculous_child
  basis: Kol Tibichi is a boy requested for his reputed Hlahi power; he performs a
    healing gesture on Notisa, who is well the next morning.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not include a miraculous birth; the motif assignment
    is based on the boy's unusual healing power.
- id: motif:2
  label: Protecting spirit-helper defeats a hidden attacker before healing
  taxonomy_refs: []
  basis: Kol Tibichi detects the threatening yapaitu and calls his own yapaitu, which
    kills and buries the attacker before the healing scene.
  evidence_refs:
  - ev:3
