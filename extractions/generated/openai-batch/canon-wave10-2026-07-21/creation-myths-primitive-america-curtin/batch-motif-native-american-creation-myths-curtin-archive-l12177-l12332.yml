canonical_text:
  quote: ''
  summary: Two messengers bring a marten skin and ask Kol Tibichi's family to let
    the boy heal the chief Notisa. Near the chief's house Kol Tibichi detects a hostile
    yapaitu, sends his own yapaitu to kill it, then cures Notisa by passing spat-on
    hands over him. Kol Tibichi grows into a great Hlahi, outdoes Tulitot at a Hlahi
    dance by producing flames from his mouth, and in old age gives instructions that
    his unburied or specially placed body would become healing rock, tree-water, or
    a grave-born rainbow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two men display a marten skin and say they brought it because they heard Kol
    Tibichi is a powerful Hlahi and want him to see the sick Notisa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The marten skin is given to Kol Tibichi and is described as the best skin
    in the chief's house.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kol Tibichi's father agrees to go, while saying he does not claim his son
    is a Hlahi but that the boy can do something.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kol Tibichi's mother carries him toward the chief's house, and he asks to
    be put down near it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After being put down, Kol Tibichi sees a yapaitu lurking in the dark around
    Notisa's house with arrows, ready to shoot and kill Notisa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kol Tibichi calls his own yapaitu, who confronts the lurking yapaitu and accuses
    it of intending to kill Notisa.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kol Tibichi's yapaitu takes hold of the strange yapaitu, twists it, kills
    it, and buries it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kol Tibichi knows what his yapaitu has done; the yapaitu tells him and enters
    the chief's house with him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: People think Notisa is close to death and ask that the boy put his hand on
    the sick man.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kol Tibichi spits on his hands and passes them over Notisa's breast and face,
    then says he is sleepy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The next morning Notisa enters the sweat-house saying he is well, and the
    people say Kol Tibichi has saved him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kol Tibichi grows up and is described as the greatest Hlahi on Wini Mem when
    he is twenty years old.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: At a Hlahi dance in El Hakam, Tulitot takes a large rattlesnake from his mouth
    and holds it while dancing; the snake is called his own child.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Kol Tibichi dances forward, blows, and throws long burning flames from both
    sides of his mouth, frightening those present and Tulitot.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In old age Kol Tibichi says his yapaitu tells him he must leave Norpat Kodiheril
    and gives instructions about leaving his body unburied so a rock will appear in
    its place and cure the sick.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Kol Tibichi says that if his body is placed in a black-oak tree overnight,
    water in a hollow of the oak will cure people who rub it on their bodies and drink
    some.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: After refusal of the earlier body-placement instructions, Kol Tibichi instructs
