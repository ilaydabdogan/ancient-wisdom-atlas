canonical_text:
  quote: ''
  summary: The passage identifies several transformed personages, then begins the
    Haka Kaina narrative. Haka Kaina, chief of Wahkalu, has stolen the three daughters
    of Hwipajusi from the south and assigns Hohwitina, a night-whistling guard, to
    watch them while they are tied to him at the central pillar of the sweat-house.
    Hwipajusi first sends ten brave men to recover his daughters; they paint themselves
    black, arm themselves, attack Wahkalu, and are killed by flint fragments struck
    from a block with a hammer. Hwipajusi then sends ten wise and cunning men. They
    hide near the sweat-house at evening, discuss the guard’s habit of whistling while
    asleep, watch Haka Kaina’s people dance, and wait until everyone sleeps except
    the whistling Hohwitina.
  language: English
  quote_policy: summarized
