canonical_text:
  quote: ''
  summary: After warnings that earlier killing may bring retaliation, Sehinom Chabatu
    sleeps in a sweat-house. At dawn, strangers attack, kill people around and in
    the sweat-house, and burn it. Sehinom hides underground beneath a log until the
    attackers leave. He emerges, mourns the dead, discovers two hidden Tsudi boys
    under yellow pine bark, cares for them, buries the dead, makes weapons, and sends
    one boy to summon relatives and allies with food and forces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tede Wiu brothers say they will go home and add that something may happen
    later.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dokos and Wai Dokos warn Wik Kiemila that further fighting or attack may follow
    because Chulup Win Herit, described as a great man and chief of many people, has
    been killed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the warning conversation, people live in peace for two years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sehinom Chabatu goes to sleep in the sweat-house; many people are in the sweat-house
    and more are outside.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chir Pokaila is described as usually knowing everything, but she is asleep
    in her own house and does not know trouble is coming that night.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Just before daylight, people hear shouting; people near the sweat-house take
    arms, and those inside rush to the door, where strange people kill them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sehinom Chabatu remains inside the sweat-house while Chir Pokaila is killed
    at the door while bringing bow and arrows to her grandson.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Chir Chuma comes when he hears the uproar, is carried by the Siriwits, fights
    in multiple places, and kills many.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Voices outside ask for Sehinom Chabatu and identify themselves as Sutunut,
    Hus, Chutuhl, and Koip.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the people outside are killed except Chir Chuma, the strangers set fire
    to the sweat-house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sehinom goes into the ground and comes out beneath the log on the left side
    of the sweat-house door, moving forward under it as the fire advances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sutunut's people search the burned sweat-house and cinders for Sehinom but
    find no bones and leave about dark.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the attackers leave, Sehinom comes out, sees his friends dead and the
    houses destroyed, and mourns through the night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Near sunrise, Sehinom hears a dog-like cry from under a piece of yellow pine
    bark.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Under the bark Sehinom finds two little boys lying in each other's arms and
    crying.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: One boy calls the other brother and says they had luck because they hid there
    and escaped; the boys are identified as Tsudi boys.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Sehinom cares for the two boys, buries the dead he can find, obtains kopus
