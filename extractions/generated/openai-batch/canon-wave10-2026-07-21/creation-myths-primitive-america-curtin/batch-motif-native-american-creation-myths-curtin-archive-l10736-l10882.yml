  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: There is still plenty of rope on the ground after the boy reaches the sky.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Sas has passed the middle of the sky, Tsiwihl sees the boy coming down,
    and soon the boy is standing on the ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Norwanchakus asks the returning boy what he saw, what he heard, and what he
    thinks of the country above.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy says the upper country is good and describes a road running east to
    west with a tobacco tree south of the road.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the upper country, an old man comes with a pack, sits beside the boy, examines
