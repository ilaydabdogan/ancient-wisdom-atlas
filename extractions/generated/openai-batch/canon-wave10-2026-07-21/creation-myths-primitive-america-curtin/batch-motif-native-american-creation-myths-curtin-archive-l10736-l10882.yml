  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy tells Sas that Norwanchakus sent him because Norwanchakus has lost
    his brother Keriha and wants Sas's knowledge about him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy gives Sas a headband, a fire-drill, and a straightener as payment
    for telling about Keriha.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Sas says he knows all that is passing in the world and knows where Keriha
    is.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Sas says the Supchit woman took Keriha under the ground, came out on Bohem
    Puyuk, traveled by crooked roads westward, crossed a bridge made of one hair,
    went under the sky to the other side, and put Keriha in a little room in the middle
    house of a large village.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Sas says Keriha is very weak and will die the next day unless someone saves
