canonical_text:
  quote: ''
  summary: An unnamed boy agrees to try reaching the sky with his rope after others
    have failed. Tsiwihl watches the ascent and reports that the boy reaches the sky.
    The boy later returns and tells Norwanchakus that in the upper country he met
    Sas, who accepted gifts and revealed that the Supchit woman had taken Keriha through
    underground and western routes to a village house, where Keriha is weak and must
    be rescued quickly. Sas sends a sky cap and a piece of sky for Tsiwihl; Norwanchakus
    gives them to Tsiwihl, makes him an oak-leaf blanket, verifies the boy's report,
    and summons kuruti silkweed from the northeast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy bows his head, says yes, notes that other men's ropes were too short,
    and says he will try with his own rope even if it may not reach the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsiwihl watches the boy's ascent so intently that his breast and stomach are
    blue as the sky and blood trickles from his eyes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people below cannot see the boy after he is some distance up and ask Tsiwihl
    to tell them what the boy is doing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy's rope appears to have more length than when he began and seems to
    grow as he ascends.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tsiwihl reports that the boy goes higher than the previous climbers and reaches
