canonical_text:
  quote: ''
  summary: A large flint block is enlarged, judged dangerous to keep, and sent north
    with Tichelis after others refuse or fail to carry it. Katkatchila learns that
    his flint has been stolen. His relatives prepare pitch-pine around a smooth swept
    place, place the fire child Pohila there, ignite fire, and carry burning brands
    toward the southeast and southwest world edges, leaving lines of flame. Torihas's
    people dance and then see fire on both sides and feel heat.
  language: English
  quote_policy: summarized
