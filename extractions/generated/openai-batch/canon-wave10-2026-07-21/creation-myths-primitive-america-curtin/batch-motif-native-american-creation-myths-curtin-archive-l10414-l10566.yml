canonical_text:
  quote: ''
  summary: Keriha sees Hubit enter his house at Bohem Buli and, with Norwanchakus's
    advice, kills Hubit by lowering a burning bundle into the house. Keriha takes
    honeycombs from the house for many days. Later the brothers encounter a Supchit
    at Puri Buli; Keriha kills and skins her despite Norwanchakus's warning. A severe
    snow follows, and the killed Supchit woman steals Keriha away. Norwanchakus searches
    for him for years, follows underground tracks and passages, and finally turns
    toward his Lasaswa cousins for information.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hubit turns west, descends to the north side of Bohem Buli, and enters it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Keriha rejoices that he knows where Hubit's house is and urges his brother
    to go with him, but leaves ahead when he cannot wait.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Bohem Buli, Keriha dodges while Hubit enlarges his house by hurling out
    large rocks and then showers of earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Norwanchakus tells Keriha to get sakkus tops and then long vines from Halat
    Pom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Keriha makes a rope from ten long vines, ties it around sakkus tops, sets
    the bundle on fire, lowers it into Hubit's house, and blocks the door with grass
    and sticks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After rumbling, struggling, and roaring stop in Hubit's house, Keriha says
    Hubit is dead and says he will have Hubit's honeycombs.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Keriha draws a large circle around the entrance to Hubit's house and speaks
    to Hubit's honeycomb, commanding it to be as large as the circle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Keriha digs and eats honey in Hubit's house for twenty-five days and returns
    to Norwanchakus on the twenty-sixth night after Hubit's death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the foot of Puri Buli, the brothers see someone half sitting and half lying
    near an opening; Keriha says he wants that being.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Norwanchakus tells Keriha that nothing can pass him and that he wants everything,
    and advises him to let this being go.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Keriha ignores Norwanchakus, splits the earth with his little finger, kills
    the Supchit, skins the body, and says the skin will be warm to sleep on.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Norwanchakus says Keriha is the only person who has ever killed a Supchit
    and says Keriha may be sorry.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: A terrible snow lasts five days and nights, and Keriha and Norwanchakus lie
    under the snow for twenty-one days without food.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: On the twenty-first night, the Supchit woman whom Keriha killed comes and
    steals Keriha away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Norwanchakus searches for Keriha across mountains, rivers, and the four directions
    for many years, asking everyone in the world without finding him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Norwanchakus later finds a large stone behind Keriha's sleeping-place, raises
    it, discovers an opening with tracks, and follows underground passages and trails
    until the trail is lost.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: After further inquiry in the west, Norwanchakus says the only ones he has
    not asked are his two cousins Lasaswa at Lasan Holok, and he turns east toward
    them.
  category: sequence
  evidence_refs:
  - ev:12
