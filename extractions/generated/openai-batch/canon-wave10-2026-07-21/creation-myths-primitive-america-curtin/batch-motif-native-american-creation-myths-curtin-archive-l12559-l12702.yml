canonical_text:
  quote: ''
  summary: Halai Auna reports seeing a man on the mountain. Pun Miaupa comes to Wakara’s
    sweat-house, is treated as Halai Auna’s new husband, and is taken by Wakara’s
    family in a nocturnal airborne dance to Tuina’s house. Tuina tests him with five
    lethal pipes of tobacco made from parts of Tuina’s own body. Pun Miaupa survives
    because an uncle within his heart smokes for him. Tuina acknowledges defeat; Halai
    Auna is glad; Pun Miaupa hunts deer; and Igupa Topa later emerges from Pun Miaupa’s
    heart.
  language: English
  quote_policy: summarized
