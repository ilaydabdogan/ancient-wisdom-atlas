canonical_text:
  quote: ''
  summary: The passage opens with a personages list naming later transformations.
    Juiwaiyu, living in the far eastern south with his aged beautiful parents, dreams
    of two beautiful sisters beyond Wahkalu and insists on seeking them despite parental
    warnings that he will not return. His mother sends him to his wise uncle Jupka
    and names a thunder-and-rain sign of his safe arrival. Juiwaiyu travels through
    the air to Jupka's house, is nearly attacked at the smoke-hole, then tells his
    uncle his purpose. Jupka warns that Damhauja's country kills strangers and that
    previous seekers never returned, but Juiwaiyu insists. Jupka makes himself small,
    hides in Juiwaiyu's hair as a helper, and Juiwaiyu asks the Sun to move slowly
    so the day will be long.
  language: English
  quote_policy: summarized
