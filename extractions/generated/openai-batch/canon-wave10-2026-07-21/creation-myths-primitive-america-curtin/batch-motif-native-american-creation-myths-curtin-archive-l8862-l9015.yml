canonical_text:
  quote: ''
  summary: Lutchi demonstrates new aerial travel, visits Waida Werris and Waiti, invites
    Waida Werris to Waida Dikit's flute-playing, then travels east to the edge of
    the sky. Using a sky stick, he passes under the sky into another world to invite
    Patkilis and Sedit. The sky's closing shakes the world. Sedit shortens the road
    by a wish, and the travelers return through the sky boundary. Lutchi reports back
    to Waida Dikit. Patkilis advises Sedit to be silent and wise. A bright arrow later
    appears by the sweat-house door as Patkilis's sign that he is coming, and two
    men enter, visible only by legs and shadows.
  language: English
  quote_policy: summarized
