canonical_text:
  quote: ''
  summary: Olelbis directs Klabus and Yilahl to obtain earth from the west. Olelbis
    spreads a great sky net under his sweat-house, and Klabus carries earth in baskets
    and throws it into the net so that it falls onto the rocky world below. Klabus
    and Yilahl then shape mountains, hills, and level country. Since a flood has quenched
    all visible fire, Olelbis sends others to obtain fire from a closed house where
    Yonot has fire in a basket. After failed attempts, Tede Wiu catches a fallen spark
    and brings it to Olelpanti. With fire available, Kuntihle and Tilitchi catch,
    cook, and eat fish; Olelbis then asks about the pond and fish, and the old women
    advise making a pointed pole from a strip of sky.
  language: English
  quote_policy: summarized
