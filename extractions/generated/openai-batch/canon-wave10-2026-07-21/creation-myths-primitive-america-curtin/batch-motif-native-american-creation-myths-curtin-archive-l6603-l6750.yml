canonical_text:
  quote: ''
  summary: Tulchuherris is warned by Winishuyat about Sas, passes through a closing
    tree, reaches Sas's deadly house, and survives attacks by guardian animals, poisonous
    creatures, and a pipe-smoking exchange. His dogs clear bears and snakes, his thorn
    shirt kills venomous spiders, and his heavy green water-stone pipe pins Sas down.
  language: English
  quote_policy: summarized
