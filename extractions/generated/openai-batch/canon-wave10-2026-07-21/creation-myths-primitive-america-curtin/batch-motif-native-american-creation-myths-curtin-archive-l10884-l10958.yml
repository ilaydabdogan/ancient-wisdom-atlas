canonical_text:
  quote: '"Leave that place, Norwanchakus and Keriha. The world will change soon."'
  summary: 'Norwanchakus travels west to a village beyond the sky, crosses a one-hair
    bridge over a rushing river, retrieves his brother Keriha from a chief house,
    and returns. A voice from above tells the brothers to leave because the world
    will change. Before departure, Keriha''s discarded duck-skin becomes the source
    of ducks, and Norwanchakus plants an ash stick that remains as ash for future
    pipe-making. At the other side of the sky the brothers part: Norwanchakus goes
    upward and Keriha goes east.'
  language: English
  quote_policy: quoted
