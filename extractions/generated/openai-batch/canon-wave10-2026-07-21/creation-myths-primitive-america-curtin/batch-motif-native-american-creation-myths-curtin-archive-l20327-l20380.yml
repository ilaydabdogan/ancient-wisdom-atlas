canonical_text:
  quote: ''
  summary: The passage describes a Wintu and Yana assembly around Wokwuk, the killing
    of Wokwuk, the distribution and concealment of Wokwuk quills and bones as powerful
    relics, taboos and inheritance rules for relic owners, the relics' dangerous exposure,
    their use with water for health or harm, and their disposal in a sacred spring
    if no heir exists.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For two months no one hunted or ate venison or sucker fish, and then Wintus
    and Yanas assembled while chiefs addressed Wokwuk.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Topitot, a chief from Wini Mem, led a decorated black bear that walked erect
    and bowed to Wokwuk; after Topitot spoke, Wokwuk raised his head and made a loud,
    long sound.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The village chief hung Wokwuk to a tree, killed him, plucked him, distributed
    quills, kept the head, placed the body on an ant-hill, and distributed the separated
    bones to chiefs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chiefs spoke to the quills and bones as if praying, first daily, then weekly,
    then monthly, and later put each bone or quill away in layered wrappings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Wokwuk bone or quill was concealed from others, inherited by a son or daughter,
    associated with luck, and bound to a rule against eating venison or sucker.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Quills became reduced to stems after five years and were fresh again five
    years later; exposing them to people was said to cause death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The relic owner occasionally unwrapped the relic, placed water near it, and
    spoke to it for luck, health, and strength.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The relic could be pointed while naming a person and asking that person to
    become sick, after which the person was said to die.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a relic owner died without heirs, the bone or quill was sunk in a sacred
    spring rather than buried with the owner.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Feathers and bones were said to grow old in appearance and later become fresh-looking
    and perfect again.
  category: attribute
  evidence_refs:
  - ev:8
