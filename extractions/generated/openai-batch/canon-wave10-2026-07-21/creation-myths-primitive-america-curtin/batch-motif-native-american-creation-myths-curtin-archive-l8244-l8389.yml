canonical_text:
  quote: ''
  summary: The passage lists named personages with the beings or things into which
    they are later changed, then begins the Hawt narrative. Waida Dikit Kiemila lives
    alone near Tede Puyuk, builds a sweat-house, paints its east half red and west
    half green, and bushes grow from the green-painted side. He invites Tsaroki Sakahl
    to live with him, marks him with yellow paint and a grass-fibre net, instructs
    him about the red eastern and green western sides of the sweat-house, and gives
    him access to a pipe. Tsaroki’s smoke fills the house and the outside so completely
    that Waida Dikit fears the world may be covered with smoke. Waida Dikit then says
    he wants to see people, have fun, and see games.
  language: English
  quote_policy: summarized
