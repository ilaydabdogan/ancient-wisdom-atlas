canonical_text:
  quote: ''
  summary: After a battle, Jupka leads the group to Jigulmatu and orders a hunt. Popila
    changes into a bear to kill Howichinaipa, but Howichinaipa escapes into an opening
    rock, and the closing rock kills the bear. Howichinaipa skins the bear and displays
    the skin. Popila's mother grieves, then sweeps out a little red-eared boy, Pakalai
    Jawichi, whom she wraps, washes, strengthens with flint dust, and teaches. The
    boy matures rapidly, undergoes sweat-house fire and finger-separation episodes,
    and the passage explains this as the first counting and as the model for Yana
    hands. Pakalai then takes a bow, lures Howichinaipa with a bird call, wounds him
    in the toe, pins him to the earth with arrows, and runs home.
  language: English
  quote_policy: summarized
