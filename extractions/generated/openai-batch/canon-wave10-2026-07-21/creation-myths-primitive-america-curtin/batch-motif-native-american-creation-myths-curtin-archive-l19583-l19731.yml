- id: ev:9
  type: summary
  locator: lines 19693-19706
  quote_or_summary: The old woman helps Pakalai Jawichi free the fingers of his right
    hand. Once all fingers are free, he can shoot and wants a bow and arrows. She
    brings the bows of dead kindred, and he keeps one with a string made from deer
    shoulder sinews.
  source_text_path: texts/public-domain/native-american-california/project-gutenberg/creation-myths-primitive-america-curtin.md
  rights_note: Public domain source; summary used.
- id: ev:10
  type: summary
  locator: lines 19707-19721
  quote_or_summary: Howichinaipa hides in a cedar-tree watching a bird. Pakalai Jawichi
    knows where he is, hides in a tree opposite, calls with the bird's voice, and
    lures Howichinaipa lower and lower.
  source_text_path: texts/public-domain/native-american-california/project-gutenberg/creation-myths-primitive-america-curtin.md
  rights_note: Public domain source; summary used.
