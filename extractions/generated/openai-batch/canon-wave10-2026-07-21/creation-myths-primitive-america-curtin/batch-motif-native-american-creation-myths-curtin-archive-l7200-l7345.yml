canonical_text:
  quote: ''
  summary: Tulchuherris reaches a house where his dogs kill snakes and bears; he sees
    bones and a spring reduced to flesh-mixed mud. Two thirsty survivors arrive, and
    he makes clear water rise by striking the ground. After returning with the killed
    creatures, Sas mourns them as his children. Sas then sends Tulchuherris to fish
    at a river crossed by a one-hair bridge. Tulchuherris encounters Supchit in the
    water, spears him, uses a gopher helper to block Supchit's exits, and finally
    kills and carries him home as a small trout.
  language: English
  quote_policy: summarized
