canonical_text:
  quote: ''
  summary: The introduction describes an external, non-believing analysis of American
    Indian myth systems. It says myths arose from questions about the origins and
    qualities of animals, plants, landscapes, foods, poisons, and world order. It
    characterizes myth-makers as projecting observed desires and qualities into a
    remote past to explain the present world, and it states that the American myth
    system was widespread and isolated from foreign influence before European arrival.
  language: English
  quote_policy: summarized
