  summary: The passage introduces personages and their later creature or object forms,
    then narrates the beginning of a deadly quarrel between the Hakas and the Tennas.
    A hunting invitation leads to a fire-side contest over arrow-points, the death
    of a Tenna, retaliation against Haka hunters, repeated deceptive ambushes, and
    wider killing until only Tsuwalkai Marimi and her grandson Tsawandi Kamshu remain.
    Tsawandi leaves a bow and quiver as a death sign and says that a little boy will
    rise from his spittle near the bed.
