  summary: Introductory prose describing an American Indigenous mythic-philosophical
    system, divine powers supervising game and fish, and a seer or doctor preparation
    pattern involving a sacred mountain pond or spring, water, bathing, prayer, fasting,
    visions, spirit patrons, promises of power, prohibitions, and an attendant spirit
    called “medicine.”
