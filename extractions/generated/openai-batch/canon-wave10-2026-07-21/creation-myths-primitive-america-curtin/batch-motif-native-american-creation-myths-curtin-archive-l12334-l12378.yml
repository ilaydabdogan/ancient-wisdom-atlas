canonical_text:
  quote: ''
  summary: Kol Tibichi dies. After others follow his instructions, a rainbow identified
    as his yapaitu appears at his grave, is described as mourning, and gradually moves
    from the grave through familiar landscape places toward the mountain. People hear
    knocking in the grave-mound and see an immense bird, later identified as Komus
    Kulit, rise from the grave. The bird perches briefly on a sugar-pine connected
    with Kol Tibichi's childhood, then flies to the mountain, enters the rainbow,
    and disappears with it. The passage then transitions to a new Yana myth section.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kol Tibichi died, and others did everything as he had told them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Observers saw a rainbow and said they should have left Kol Tibichi's body
    above ground and done what he first asked; they said the yapaitu was mourning
    for him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rainbow stood at the grave for two days and two nights, then moved eastward
    and farther away day by day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rainbow stopped at the salmon-house associated with Kol Tibichi's childhood,
    then at the north bank of the river, hillside, hilltop, mountain-slope, and mountain-top.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: People in Norpat Kodiheril heard noise and knocking in the grave-mound one
    night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Early the next morning they saw an immense bird rising out of Kol Tibichi's
    grave; by sunrise it had emerged completely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bird flew to a sugar-pine from which Kol Tibichi had hung head downward
    in childhood, perched there briefly, and then flew away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The bird flew to the mountain and into the rainbow; the bird and rainbow went
    away and disappeared together.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bird is identified as Komus Kulit, and the rainbow is identified as Kol
