canonical_text:
  quote: ''
  summary: 'A notes section discusses several Yana and related mythic patterns: Haka
    Kaina as a flint-people myth involving spring, lightning, swan-maidens, Mount
    Shasta, death by fire, resurrection, and return; Paiowa and Halaia as star daughters
    of Wakara; transformations into shell, loon, and wildcat forms; recurring Yana
    motifs of food, weapons, jealous husbands, and revivification; and comparative
    references to European, Keltic, and Seneca revivification patterns.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Haka Kaina myth represents the advance of spring
    to colder regions and associates the swan-maidens with early lightning going north.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haka Kaina is identified as war chief of Wahkalu, the great residence of Jupka,
    and is said to steal the swan-maidens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A related fragment is described in which Haka Kaina carries the swan-maidens
    north with an immense springtime escort.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The escort includes a poplar-tree figure whose leaves tremble like an aspen
    and who dances from the south to Mount Shasta.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Haka Kaina marshals forces around the base of Mount Shasta; they raise dust
    to the sun, die by fire at the hands of the Mini Aunas, are resurrected, and return
    home with the swan-maidens and spoils from Hwipajusi's people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Paiowa is identified as the evening star, and Halaia or Halai Auna as the
