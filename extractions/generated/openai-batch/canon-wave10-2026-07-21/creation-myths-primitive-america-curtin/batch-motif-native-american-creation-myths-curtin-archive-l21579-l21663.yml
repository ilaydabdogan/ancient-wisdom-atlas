comparison_claims:
- id: claim:1
  claim: The passage compares sister-for-brother love in the Yana myth to occasional
    examples in European lore.
  claim_level: same_motif
  target: European lore involving sister-brother love
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The passage gives only a general assertion and no specific European
    parallel or narrative details.
- id: claim:2
  claim: The passage compares Yana revivification by red rosebush twig with Keltic
    revivification by Druidic or magic switch as resembling methods.
  claim_level: same_function
  target: Keltic revivification by Druidic or magic switch
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The similarity is limited to the functional use of a plant or switch
    implement to restore life; the passage notes uncertainty about the wood used in
    Keltic examples.
- id: claim:3
  claim: The passage places Yana, American, and Keltic traditions together as traditions
    in which bringing the dead to life is a familiar mythic performance.
  claim_level: same_function
  target: American and Keltic revivification traditions
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is a broad comparative statement by the author and does not
    establish historical contact or common origin.
- id: claim:4
  claim: The Seneca dry-bones episode is presented as another Native American example
    of raising the dead, comparable in function to the Yana bringing-to-life methods.
  claim_level: same_function
  target: Seneca myths of raising dry bones from the dead
  evidence_refs:
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The Seneca example differs in mechanism, using a hickory-tree threat
    and spoken command rather than Yana foot, boiling, or rose-twig methods.
