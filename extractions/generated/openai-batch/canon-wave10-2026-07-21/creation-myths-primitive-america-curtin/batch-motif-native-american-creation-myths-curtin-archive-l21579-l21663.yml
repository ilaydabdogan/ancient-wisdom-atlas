  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage lists increase and decrease of food, magic weapons, and jealousy
    or hostility from other sisters' husbands as usual features in Yana myths of this
    kind.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: A myth under discussion involves a female first person, later turned into
    a loon, loving her brother, later turned into a wildcat.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says revivification in Yana may be performed by kicking or turning
    a corpse with the foot, boiling a hair or heart in water, or striking the corpse
