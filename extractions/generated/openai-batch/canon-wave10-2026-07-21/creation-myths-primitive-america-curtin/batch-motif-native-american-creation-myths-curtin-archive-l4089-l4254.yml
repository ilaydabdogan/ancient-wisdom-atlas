canonical_text:
  quote: ''
  summary: Norwan dances on earth before the Wintu people and receives sky-borne instruction
    about the direction she must face. Olelbis sends Hessiha to live with her and
    identifies her as Bastepomas, the food-giving woman. Hessiha reports arrivals
    and suitor-news to Norwan. Nomdal Lenas Loimis moves from east to west and identifies
    herself with evening colored light. Kukupiwit Pokte goes to Bohem Buli as a mountain
    woman. Norwan continues her daylight dance while several male figures are announced
    as potential visitors or husbands, and she rejects several of them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Feathers begin to sing in the early morning, and flocks of birds fly toward
    the sweat-house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A voice from high in the sky tells Norwan that, while dancing, she must not
    look west, north, or south, but must face southeast toward Hlihli Pui Hlutton,
    the place from which her staff and paint came.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Norwan looks up and sees Kar Kiemila seated over the door of the sweat-house
    in Olelpanti, holding white-oak acorns.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Olelbis tells Hessiha to go down to live permanently with Norwan and says
    Hessiha's fallen or pulled-off feathers will become hessihas on earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Olelbis says the people will call Norwan Bastepomas because she is the food-giving
    woman, and Hessiha must report what he sees or hears and ask her leave before
    acting.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hessiha sees a woman coming from the east and going west, reports this to
    Norwan, and the woman comes directly to Norwan Buli.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nomdal Lenas Loimis says she will live in the west and be seen after sunset
    as red, yellow, and white streaks of colored light, facing east on pleasant evenings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nomdal Lenas is described as an immensely large woman with a large face, hair
    cut across the forehead, and red, yellow, and white painted streaks on her face.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kukupiwit Pokte says she came upon earth at the same time as Norwan, before
    the Wintu people, and will live on the north side of Bohem Buli as a mountain
    woman.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Norwan dances throughout daylight and rests only in the evening.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Norbis Kiemila, identified as the white oak that rolled to the southeast,
    sees Norwan and calls her his wife.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Hessiha tells Norwan that Norbis Kiemila says she is to be his wife, and then
    reports that Sedit of Sonomyai is coming to see her; Norwan rejects Sedit because
    of his breath.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Hessiha reports that Kaukau Herit and Kobalus Herit are coming to see Norwan;
    Norwan rejects them because of bodily features she dislikes.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Hessiha reports that Tsanteris Herit, Keli Herit, and Bisus Herit are coming
    to see Norwan; Norwan rejects them because of a hollow breast, bad odor, short
    legs, and diet.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: Hessiha begins to report that Tede Wiu Herit, a man living a short distance
