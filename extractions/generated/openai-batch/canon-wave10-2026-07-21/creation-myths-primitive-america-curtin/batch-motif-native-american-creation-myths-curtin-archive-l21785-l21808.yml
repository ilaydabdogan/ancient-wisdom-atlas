canonical_text:
  quote: ''
  summary: 'The passage comments on Yana mythic material: first-people hunts are described
    as prototypes for hunting; game remains under first-people spirits; Howichinaipa''s
    forced change into a little bird is connected with vengeance; Machperkami, a tiny
    dog in the hair of Tuina the sun, is compared with Wintu Winishuyat; Tuina descends
    to the lower side of the earth and travels by night on Jupka''s road; water grizzlies
    move from ocean to mountains; and the creation of the Yanas is briefly noted.'
