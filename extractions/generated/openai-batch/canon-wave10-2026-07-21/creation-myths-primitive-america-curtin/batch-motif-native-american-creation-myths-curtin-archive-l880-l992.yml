canonical_text:
  quote: ''
  summary: The passage first summarizes a Modoc myth in which the morning star must
    call the sun back from daily destruction into ashes because the sun’s immortal
    golden disk remains in the ash heap and renews him. It then describes the Wintu
    and Yana mythic system, especially the Wintu chief divinity Olelbis/Nomhliestawa,
    his high-sky dwelling and governing role, the two grandmother counsellors and
    rainmakers transformed into stone, and the central importance of metamorphosis
    in explaining how beings and things became what they are.
  language: English
  quote_policy: summarized
