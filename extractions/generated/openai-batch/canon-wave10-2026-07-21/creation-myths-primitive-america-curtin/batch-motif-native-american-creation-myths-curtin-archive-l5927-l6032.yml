canonical_text:
  quote: ''
  summary: Sehinom Chabatu sends two Tsudi brothers to enter the enemy camp at night
    and cut bow-strings in the houses. At dawn his large force attacks; the defenders
    find their weapons disabled, Sutunut is killed, and the southern camp is destroyed.
    A rearguard under Kot and Ho Herit burns the houses but is surprised by a new
    southern force; Ho Herit, Kot Herit, and many Tidoks are killed. Sehinom returns
    to Dau Paki Olel, the war ends, and Olelbis later turns the first people into
    birds, beasts, and other things.
  language: English
  quote_policy: summarized
