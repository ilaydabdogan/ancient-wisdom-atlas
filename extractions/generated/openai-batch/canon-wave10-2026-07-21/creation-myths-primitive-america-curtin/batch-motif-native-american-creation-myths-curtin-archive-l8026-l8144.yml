canonical_text:
  quote: ''
  summary: Sedit addresses the two brothers as grandsons and argues that the future
    world should include climbable trees, acorns with husks, marriage, childbirth,
    aging, death, mourning customs, burial equipment, dangerous animals, weapons,
    fighting, and punishment for killing. The brothers are silent at first, and the
    elder eventually agrees that Sedit's proposal is better and right.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sedit addresses the brothers as his grandsons and says he will tell them something
    wiser and better than what Olelbis has told them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sedit proposes that trees should have limbs to the ground and that acorns
    should have husks and shells so people can climb, knock down, gather, and husk
    acorns while laughing and playing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sedit says that if nothing dies, deer and fish will not die and the coming
    people will not be able to kill them for food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sedit says men and women should marry, live together, work for one another,
    and share food that the man catches and the woman cooks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sedit says children will grow up, marry, have children of their own, and thereby
    keep many new young people present.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sedit says old men and old women will die, neighbors will announce the deaths,
    and people will bury the dead, cry, and mourn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sedit says the closest relatives of a dead person will cut their hair very
    close and paint their faces black.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sedit says old people will leave descendants, young people will take the places
    of the old, and all living things, including trees, should grow old and die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sedit says a dead man will be furnished with mempak, an otter-skin headband,
    a quiver, and clothing before being put in the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sedit says people may die by grizzly bear, rattlesnake bite, flint weapons,
    anger, and fighting, and that killers will be punished.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The two brothers sit without answering at first; after thinking, the elder
    brother says Sedit's statement is better and right.
  category: sequence
  evidence_refs:
  - ev:7
