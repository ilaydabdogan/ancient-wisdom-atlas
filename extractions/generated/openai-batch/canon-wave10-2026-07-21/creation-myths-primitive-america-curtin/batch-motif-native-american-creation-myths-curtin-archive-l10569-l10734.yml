canonical_text:
  quote: ''
  summary: Norwanchakus reaches a house of rope-makers who have been preparing ropes
    since hearing that he lost his brother Keriha. He asks that someone climb by rope
    to the top of the sky to question Sas. Two old men and then their sons fail because
    their ropes are too short. A small boy who has been making rope from discarded
    shreds is then asked to try and is given gifts for Sas.
  language: English
  quote_policy: summarized
