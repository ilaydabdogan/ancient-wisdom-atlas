canonical_text:
  quote: ''
  summary: Tsawandi Kamshupa leaves his frightened grandmother to hunt, sees groups
    of Tenna women gathering food near fires, and recalls that the Tennas killed his
    people except for himself and his grandmother. He kills a lone Tenna woman, takes
    her heart, then approaches other Tenna women while their removable teeth hang
    on a tree near the fire. Keeping them from their teeth, he gives them roasted
    heart and magically produced red flint meal bread; the women eat and die. He repeats
    this with other groups, killing all Tenna women who are out, then goes to the
    Tenna sweat-house where the Tenna men are gathered and plans a deceptive invitation.
  language: English
  quote_policy: summarized
