canonical_text:
  quote: ''
  summary: Introductory prose defines “ethnic religion” as the religion of a people
    of one blood and language, including knowledge, custom, institutions, and art.
    It states that such peoples believe their gods supervise them, communicate with
    them, and provide what they know and practise. The passage then discusses conquest
    and loss of religious systems in the Eastern hemisphere, cites Lithuanian sacred
    serpents and priestesses guarding an unquenchable holy fire, describes Egyptian
    animal worship and the loss of its earliest mythological explanation, compares
    Egyptian chief gods with American Indian action-myth divinities, and says Greek
    early creation myths were obscured and reshaped.
  language: English
  quote_policy: summarized
