canonical_text:
  quote: ''
  summary: Kele's twenty sons return, with the rough ten smelling and attacking Sedit
    despite Kele's warning that he is their uncle. During the assault a root carried
    by Sedit falls into the fire and produces smoke pleasing to Kele's sons. Kele
    explains that future hunters will burn this root, tsarauhosi, and petition him
    for deer; he then heals and places Sedit in the sweat-house. Sedit asks how Kele
    obtained house and children. Kele creates a mountain-sweat-house for him by wishing,
    later teaches him how to obtain daughters, and Sedit successfully obtains two
    daughters. When Sedit tries to obtain sons through a stick rite, he repeatedly
    looks up and the sticks fall.
  language: English
  quote_policy: summarized
