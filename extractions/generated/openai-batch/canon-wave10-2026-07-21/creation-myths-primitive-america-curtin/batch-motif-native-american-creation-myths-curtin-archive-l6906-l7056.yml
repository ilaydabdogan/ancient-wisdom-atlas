canonical_text:
  quote: ''
  summary: Sas taunts Tulchuherris as defeated and of low origin, then denies the
    taunt when Tulchuherris is found inside with Sas's daughters. Sas buries his wife
    with bears and snakes, mourns and dances, then sends Tulchuherris to climb a very
    high smooth tree for supposed red-headed woodpecker pets. Using a rope made from
    his daughters' hair, Sas lets Tulchuherris climb, pulls the rope away, strands
    him, and taunts him again. Winishuyat advises Tulchuherris; the nest contains
    rattlesnakes, which Tulchuherris removes with a lengthened pointed bone. Winishuyat
    then tells him to stretch his right hand westward, and a blue sky-strap arrives
    and is tied to the limb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sas verbally taunts Tulchuherris, saying he has beaten him, that Tulchuherris
    is nobody, and that Tulchuherris was dug from the ground and raised by his grandmother.
  category: speech
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:2
  text: When Sas enters the house and sees Tulchuherris sitting with his two daughters,
    Tulchuherris asks whether Sas was talking about him, and Sas claims he had been
    lamenting his own age, weakness, blindness, and possible wrongdoing toward his
    son-in-law.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sas digs a grave near the door, buries his wife with bears and snakes, calls
    the bears and snakes his children, and sings a mourning song glossed as creeping
    west.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: While mourning, Sas has beaver teeth hanging on strings at the back of his
    head and beside his face; the teeth rattle as he dances and sings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sas tells Tulchuherris that his daughters want red-headed woodpeckers as pets
    from a nest, and that he is too old and blind to climb for them himself.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tree shown by Sas is about a mile away, very straight, very high, and
    has a trunk described as smooth as ice.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sas uses a rope made from many single hairs from his daughters' heads, throws
    it over a limb near the nest, and tells Tulchuherris to climb while he holds it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Tulchuherris climbs to the limb and lets go, Sas pulls the rope down,
    leaves him high in the tree, goes away, and taunts him again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Winishuyat addresses Tulchuherris as brother and instructs him to lengthen
    a pointed bone and go higher.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The nest contains many rattlesnake heads rather than the expected woodpeckers;
    Tulchuherris uses the lengthened bone to gather the snakes and drop them to the
    earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Winishuyat tells Tulchuherris to stretch his right hand toward the west; Tulchuherris
    does so toward the place where his grandmother is, and a blue, narrow, strong
    sky-strap arrives like a bird and is tied to the limb.
  category: sequence
  evidence_refs:
  - ev:8
