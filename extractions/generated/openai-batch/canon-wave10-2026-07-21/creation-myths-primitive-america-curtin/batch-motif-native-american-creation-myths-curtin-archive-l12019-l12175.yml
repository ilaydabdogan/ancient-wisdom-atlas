canonical_text:
  quote: ''
  summary: A boy obtains bird and flicker feathers through killing, ritual handling,
    and the aid of a yapaitu spirit. The spirit names him Kol Tibichi and foretells
    that he will be the greatest Hlahi on Wini Mem if he obeys. Kol Tibichi blesses
    and names a black-oak place for his mother's acorn gathering. During a doctor's
    dance the spirit comes to him; doctors identify him as a Hlahi whose yapaitu is
    the rainbow. After six days fasting in the sweat-house and after many failed headbands,
    a red maple-bark apron headband is accepted by the yapaitu, which then leaves
    him. Kol Tibichi eats and drinks and is thereafter a Hlahi. The passage ends as
    Notisa, chief of Norpat Kodiheril, falls sick and messengers come with a light
    to Kol Tibichi's house.
  language: English
  quote_policy: summarized
