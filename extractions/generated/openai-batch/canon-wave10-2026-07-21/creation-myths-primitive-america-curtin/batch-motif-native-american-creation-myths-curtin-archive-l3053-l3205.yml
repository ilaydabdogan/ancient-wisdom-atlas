canonical_text:
  quote: ''
  summary: Olelbis assigns feathers from Kau and the elder Hus brother to become a
    white crane and a buzzard. Tilitchi brings Dokos, Wima Loimis, and Klak Loimis,
    whom the old women identify as bad. Olelbis offers to put something on their teeth
    to make them harmless, but they refuse. Dokos threatens his sisters and declares
    hostility toward living things. Olelbis sends Dokos to become flint, Klak Loimis
    to become a rattlesnake, and Wima Loimis to become a grizzly bear, predicting
    their spread, their danger to people, and the future use and destruction of Dokos
    as flint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Olelbis pulls a feather from Kau, throws it down, and says it will fly along
    rivers as a white crane; Kau remains in Olelpanti with Olelbis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Olelbis plucks a feather from the elder Hus brother and sends it down to be
    a buzzard that eats dead salmon, other fish, snakes, and other dead things.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The future Wintu are said to feed the buzzard with what is dead.
  category: relationship
  evidence_refs:
  - ev:2
