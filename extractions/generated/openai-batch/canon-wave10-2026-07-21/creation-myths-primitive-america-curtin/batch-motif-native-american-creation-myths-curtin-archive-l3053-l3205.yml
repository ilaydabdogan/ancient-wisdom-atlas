  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old women identify Dokos, Wima Loimis, and Klak Loimis as bad people.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Olelbis has put something on the teeth of the people he is sending away so
    that they may be harmless.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wima Loimis and Klak Loimis refuse to have anything put on their teeth because
    they fear they could not eat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dokos refuses the tooth treatment and says he is angry at his sisters, hates
    them, and will be wicked as well as they are.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dokos says people will employ him against Wima Loimis and Klak Loimis, and
    that he will go into their bodies and kill them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dokos declares that he will hate all living things, kill everyone, and have
    no friend anywhere.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Olelbis sends Dokos to Koiham Nomdaltopi to be flint, Klak Loimis to Klak
    Kewilton to be a rattlesnake, and Wima Loimis to Wima Wai Tsarauton to be a grizzly
    bear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Olelbis says the rattlesnake and grizzly bear will be bad and will increase
    and spread, while Dokos will be worst, always ready to hurt and kill.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Olelbis predicts that Klak Loimis and Wima Loimis will bite people, people
