canonical_text:
  quote: every drop that fell made a spring
  summary: 'A brief narrative note says Kut carried a basket westward and that drops
    falling from it made springs. The following commentary discusses the Norwan myth:
    Norwan is identified with quivering porcupine, daylight, food-giving, and the
    cause of the first war; Sanihas is described as daylight; Chulup Win Herit is
    described as a stone chief and husband of Sanihas; and Tede Wiu is described as
    preferred by Norwan and later changed into a red Wiu bird.'
  language: English
  quote_policy: quoted
