canonical_text:
  quote: ''
  summary: The passage identifies Old Kele, the mountain wolf, as an early person
    sent down from the sky by Olelbis. It says Kele made his sons and daughters from
    sticks rather than begetting them as children, and compares this to Jupka's making
    of the Yanas. The passage then describes Kele's sons and daughters as wolf-like
    beings who appear human when traveling, harm Indians, become wolves when discovered
    and rebuked, are wolves at home in a great sweat-house, and resemble Wintus except
    for a hairy foot.
