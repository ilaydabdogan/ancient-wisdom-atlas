canonical_text:
  quote: ''
  summary: Wakara's star children gather in his sweat-house, see Titindi Maupa with
    their sister, and feast on venison. Titindi Maupa later hunts at a mountain using
    a deer head, kills one hundred deer, carries them inside the smallest deer, and
    returns with abundant game for a village feast. A western village led by Lawalila
    learns that Paiowa is married to Titindi Maupa; angered rivals challenge him at
    arrow-shooting. Titindi wins the wagers, Lawalila attacks, and a battle follows.
    Wakara's sons and Paiowa aid Titindi; when Titindi is exhausted, his sister carries
    him and gives him her bow and arrows, after which the western opponents, including
    Lawalila, are killed.
  language: English
  quote_policy: summarized
