canonical_text:
  quote: ''
  summary: Olelbis shapes waterways with a sky pole and roots supplied by his grandmothers;
    water, rivers, creeks, and fish spread. He then brings or has brought several
    beings from an acorn tree outside the sky and places them in the sweat-house,
    where Min Taitai and Hessiha dispute the sun's movement and fight with red mud.
    Finally, Olelbis seeks to cover the bare lower world with plants; Tsurat brings
    and carries Hlihli Kiemila over the world, causing oak bushes to spring up from
    his dust, while clover and flower seeds from Olelpanti are scattered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Olelbis points one end of the sky pole and uses it to draw deep furrows, but
    at first no water is in the furrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandmothers instruct Olelbis to throw a grapevine root to the place at
    the foot of Bohem Puyuk; one end enters the mountain and water flows from the
    other end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandmothers name the water Wini Mem and say the surrounding country will
    be good and inhabited in the future.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A second root, a tule root, is thrown north and produces Pui Mem, with tule
    at its head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Olelbis makes additional large and small furrows for rivers and creeks; water
    fills them and fish spread from a small pond into the rivers and creeks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Olelbis sees a hammering person on the north side of an acorn tree outside
    the sky, stuns him with a sling stone, and has Tilitchi bring him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The grandmothers identify the stunned person as Tsurat and tell Olelbis to
    put him on the central pillar of the sweat-house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tsurat climbs the central pillar, stops repeatedly to hammer, and makes a
    sound heard outside the sweat-house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Min Taitai is brought from the same tree and placed on the ground east of
    the fire, which is in the middle of the sweat-house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hessiha is brought and placed with Min Taitai near a basket of red earth and
    water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Min Taitai says Sas is coming back, while Hessiha says Sas is going on; the
    passage explains this as a misunderstanding involving the sun's seasonal and daily
    movement.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Min Taitai and Hessiha fight and throw red mud from the basket until both
    are covered with mud and water.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Olelpanti around the sweat-house contains clover, grasses, plants, and blossoms,
    while the ground below is bare.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: The grandmothers direct Olelbis to send Tsurat to bring Hlihli Kiemila from
    Hlihli Pui Hlutton, and Olelbis orders Tsurat to carry Hlihli over the world below.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Hlihli Kiemila is described as like a worm-eaten acorn outside and like meal
