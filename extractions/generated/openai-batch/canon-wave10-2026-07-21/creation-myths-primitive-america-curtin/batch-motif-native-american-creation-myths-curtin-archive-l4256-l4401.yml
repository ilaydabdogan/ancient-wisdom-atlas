canonical_text:
  quote: ''
  summary: Norwan rejects or resists several male visitors, disposes of objects placed
    near her door, receives night visitors, and then receives an invitation from Serin
    Dolite on behalf of Kopus Kiemila to attend a feast and dance at Hlihli Pui Hlutton.
    She prepares by obtaining flower adornments from the southeast, takes her staff,
    and departs while Hessiha remains at home. The passage also describes the orientation
    and relative status of houses in Olelpanti and Hlihli Pui Hlutton.
  language: English
  quote_policy: summarized
