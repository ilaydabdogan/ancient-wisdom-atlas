canonical_text:
  quote: ''
  summary: Hehku is killed by upward-pointing spears in a sweat-house but revives,
    fights Mipka, and swallows him. Tsanunewa flees westward from Hehku, seeking protection
    first from Matauwila, then from the Chichi brothers, and then from Jupka. Helpers
    set traps or use slippery crystal stones, but Hehku overcomes them, kills Matauwila
    with fire from her body, swallows the Chichi brothers, and uses a stretching house
    to continue the pursuit. Jupka shelters Tsanunewa and offers Demauna as a husband
    if Hehku will let the boy go; Hehku refuses by shaking her head.
  language: English
  quote_policy: summarized
