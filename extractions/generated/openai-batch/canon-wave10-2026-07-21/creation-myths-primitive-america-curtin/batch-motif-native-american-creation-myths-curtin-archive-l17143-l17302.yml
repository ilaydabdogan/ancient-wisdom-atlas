canonical_text:
  quote: ''
  summary: Two Tsanunewa brothers hide in opened tule stems on a lake and shoot Haka
    Lasi when she rises from the water. Her dead body is found wearing a string of
    many hearts. Tsore Jowa counts the hearts, notices that her father’s and eldest
    brother’s hearts are missing, and follows a northern cry to find her father Juka
    partly buried in the ground. She digs him out, wraps him, and carries him with
    Haka Lasi’s body to a burned sweat-house. In a later episode, Jamuka’s two daughters
    hear singing while gathering wood, find a head sticking from the ground, and dig
    out an emaciated man.
  language: English
  quote_policy: summarized
