canonical_text:
  quote: ''
  summary: 'Curtin summarizes a Wintu and broader North American creation-theory:
    before humans, first people or gods lived in harmony; individuality brought conflict;
    after conflicts many were transformed into animals, plants, celestial bodies,
    stones, and other existences, while a minority departed westward or above the
    sky. Olelbis is described as a high, all-seeing being who disposes of the first
    people and rules through the knowledge and service of others.'
  language: English
  quote_policy: summarized
