canonical_text:
  quote: ''
  summary: Curtin's notes compare an Algonkin light-benefactor associated with Hiawatha
    to the California figure Norwan, a daughter of earth who dances, produces food,
    and departs with a partner. The passage also discusses porcupine-light symbolism,
    Norbis Kiemila as a rival, the partner's later transformation into the red wiu
    bird, the first war, and a speculative comparison with the Iliad and Helen.
  language: English
  quote_policy: summarized
