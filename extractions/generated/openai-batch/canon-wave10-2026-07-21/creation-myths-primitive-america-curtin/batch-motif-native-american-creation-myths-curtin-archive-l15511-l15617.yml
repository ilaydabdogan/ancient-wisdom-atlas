canonical_text:
  quote: '"Fire has been stolen! Fire has been stolen!"'
  summary: Ahalamila, Metsi, and old Shushu take fire from a sweat-house and carry
    pieces in their ears. Au Mujaupa discovers the loss and sends wind and weather
    people after them. Ahalamila and Metsi lose their fire, but Shushu preserves a
    piece in one ear, returns home, warms the sweat-house, and enables cooking and
    the spread of fire to all people.
  language: English
  quote_policy: quoted
