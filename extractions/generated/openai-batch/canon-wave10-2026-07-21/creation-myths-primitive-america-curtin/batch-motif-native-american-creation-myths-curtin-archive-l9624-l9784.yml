canonical_text:
  quote: ''
  summary: The passage lists personages and later creature or thing transformations,
    then narrates how the brothers Norwanchakus and Keriha move through a dim, pre-solar
    world. After a river exists from Olelbis's furrow, the brothers seek fish, gather
    plant fiber and ash wood from places at or beyond the sky to make a net, travel
    north, find a sweat-house with other people, name a place and people, and summon
    further help, including Patkilis, who hears distant shouting, dancing, and singing
    in the east.
  language: English
  quote_policy: summarized
