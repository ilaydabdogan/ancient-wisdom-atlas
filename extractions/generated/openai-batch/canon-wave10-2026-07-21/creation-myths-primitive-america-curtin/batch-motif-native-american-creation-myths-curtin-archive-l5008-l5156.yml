canonical_text:
  quote: there will never be an end to fighting in this world now.
  summary: A first-person speaker regrets choosing Tede Wiu at a dance instead of
    Norbis, saying this choice led to fighting. After an earlier battle, Sehinom Chabatu
    is blamed for the deaths of Saias Saias and Chuchu, though the narrator says Chir
    Chuma actually killed them. Their chief, Chulup Win Herit, resolves to fight and
    sends a challenge. Sehinom’s grandmother, Chir Pokaila/Kahi Buli Pokaila, foreknows
    events in the east, warns him to avoid that direction, explains that warfare has
    entered the world through a woman at Norwan Buli, names kin he should visit, describes
    Chulup’s eastern dwelling beneath the great water, and says her anger will be
    felt as a cold north wind.
  language: English
  quote_policy: quoted
