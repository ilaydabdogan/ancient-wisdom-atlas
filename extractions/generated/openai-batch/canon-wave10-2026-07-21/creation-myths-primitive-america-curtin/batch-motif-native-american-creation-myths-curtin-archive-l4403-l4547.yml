canonical_text:
  quote: ''
  summary: Norwan receives a message to hurry to a sweat-house where many people have
    gathered for dancing. On the way she finds Tsudi girls and Patkilis boys who want
    to attend but lack clothing; she equips them with fog, feathers, catkins, acorn
    mould, and leaves, making the groups match dressed models. They arrive at an acorn-filled
    sweat-house where Kopus Kiemila hosts the gathering, Hlihli figures welcome entrants,
    Kaukau Herit shines and dances with northern people, and western dancers shed
    shells like snow before southern people are called to dance.
  language: English
  quote_policy: summarized
