canonical_text:
  quote: ''
  summary: Sas is equipped with head ornaments and facial/forehead signs. Tulchuherris
    gives him red berries, white roots, and shells and sends him to Olelpanti, where
    Olelbis, his father, instructs him to travel continually from east to west. Olelbis
    describes a hot eastern place, a midpoint tobacco tree, hostile grizzly-bear children
    in roadside brush, a western great water, and staffs whose ends are made glowing
    in fire for the journey. Sas is told he will travel alone.
  language: English
  quote_policy: summarized
