canonical_text:
  quote: ''
  summary: A personage list introduces names and later transformations. In the narrative,
    an old woman named Nomhawena Pokaila, also Pom Pokaila, lives alone on a western
    root flat and digs roots. She hears a childlike cry underground, digs out a little
    boy from the central earth, and hears thunderlike sounds from the eastern place
    of Sas. She cares for the boy as her grandson, washes him, and urges him to grow.
    He matures rapidly. She repeatedly forbids him to go east toward Saskewil, where
    Sas lives. A voice from the sky names him Tulchuherris, calls him the first and
    greatest person there, and tells him to do his best to live and conquer. The boy
    keeps this from his grandmother, who later promises to explain why she forbade
    the east.
  language: English
  quote_policy: summarized
