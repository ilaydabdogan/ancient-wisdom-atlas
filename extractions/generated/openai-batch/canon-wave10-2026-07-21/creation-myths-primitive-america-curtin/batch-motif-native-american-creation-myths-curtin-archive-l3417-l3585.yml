canonical_text:
  quote: ''
  summary: In a sweat-house setting, Olelbis seeks ritual help to find Mem Loimis
    and relieve severe thirst among his children and others. Kopus, a Hlahi, performs
    spirit dancing with two Tsudi girls singing but cannot discover where Mem Loimis
    went. Advisers say a water-knowing Hlahi is needed, so Olelbis sends Lutchi east
    with arrow gifts to summon Sanihas Yupchi, the archer of daylight. Sanihas Yupchi
    arrives, smokes many pipefuls of tobacco before a yapaitu comes to him, and performs
    a prolonged spirit dance, but by the end of the passage he has not yet revealed
    Mem Loimis’s location.
  language: English
  quote_policy: summarized
