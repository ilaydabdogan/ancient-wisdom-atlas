canonical_text:
  quote: ''
  summary: In Damhauja's country, Juiwaiyu is identified as a new son-in-law and warned
    that other sons-in-law may try to kill him. At night Juiwaiyu releases Jupka from
    his hair and moves to mountain heights. Jupka, angry over Damhauja's earlier attempt
    to kill Juiwaiyu, creates a storm and flood inside the sweat-house, drowning Damhauja
    and Pahnino Marimi while protecting the two sisters. Juiwaiyu plays a flute from
    the mountain, kills and magically transports many deer, then asks Jupka to revive
    the drowned pair. Jupka restores them with a rose-twig. Venison is distributed,
    and Kechowala and other western sons-in-law prepare a hostile challenge.
  language: English
  quote_policy: summarized
