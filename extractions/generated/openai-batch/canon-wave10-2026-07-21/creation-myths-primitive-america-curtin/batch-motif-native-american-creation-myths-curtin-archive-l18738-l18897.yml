canonical_text:
  quote: ''
  summary: Hehku Marimi demands Tsanunewa as husband and refuses substitutes. Jupka
    conceals Tsanunewa, questions him, then presents him after magically making him
    full-grown. Hehku enters the sweat-house with fire flashing from her body and
    a skull cap at her side. Jupka uses tobacco smoke to darken the sweat-house, extinguish
    her fire, and force her to sleep, then prevents her dreams. She later leaves angrily
    for the east and a rocky mountain; the others sweat and bathe, and Hehku becomes
    a skull person and dreams of gambling.
  language: English
  quote_policy: summarized
