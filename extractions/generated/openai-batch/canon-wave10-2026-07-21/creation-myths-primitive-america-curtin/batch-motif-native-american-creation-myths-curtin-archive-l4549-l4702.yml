canonical_text:
  quote: ''
  summary: During a dance led by the two Tede Wiu brothers, they stretch colorful
    mempak through the sweat-house and place ornaments and knives before Kopus. Norwan
    begins dancing involuntarily with them and leaves with them. Norbis arrives, asks
    for his wife, learns she has gone with the brothers, and pursues. At the brothers'
    house, messengers report Norbis's anger and demand that the woman be returned.
    The elder Tede Wiu refuses, saying she came of her own will. The brothers arm
    their people, enclose Norwan in a house bound with mempak, cross Bohema Mem, and
    see Norbis and his people approaching on the western bank.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two Tede Wiu brothers from Koi Nomsono were to lead the southern people
    in the dance; after Kopus called five times, the elder brother stepped and all
    began to dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brothers carried mempak on their arms and each had a flint knife; while
    dancing they stretched strings of mempak across the house above the dancers' heads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers danced to Kopus, placed shell and mempak strings and two knives
    before him, and danced away and back again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Norwan rose and began to dance without knowing it; she could not help dancing
    and danced with the two brothers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the two brothers sat down and Norwan sat with them, all three stood
