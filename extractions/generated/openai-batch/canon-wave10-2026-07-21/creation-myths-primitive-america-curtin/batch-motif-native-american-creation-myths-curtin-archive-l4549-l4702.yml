  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brothers kept Norwan at their own house until morning and told their people
    to be ready for a great hunt at daybreak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Wul Wuhl brothers came as messengers and said Norbis was very angry, had
