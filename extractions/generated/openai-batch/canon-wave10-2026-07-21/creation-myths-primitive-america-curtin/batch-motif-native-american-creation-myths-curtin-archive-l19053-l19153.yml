canonical_text:
  quote: ''
  summary: In a sweat-house game, multiple players lose their possessions and then
    their lives. Jupka remains for the final play against Hehku, uses an ambiguous
    directional utterance linked with the appearance of Wahkalu/Mount Shasta, and
    the bone used in the game kills Hehku. Miniau Marimi also loses her life. Jupka
    washes in a creek, becomes beautiful and large, and revives the dead Mapchemainas
    with a wild rose-bush stem. At dawn Hehku revives and brings Miniau back to life;
    in anger Hehku turns into a great head and bounds east while Miniau keeps pace.
    Haka Kaina hears the noise and speaks about Putokya.
  language: English
  quote_policy: summarized
