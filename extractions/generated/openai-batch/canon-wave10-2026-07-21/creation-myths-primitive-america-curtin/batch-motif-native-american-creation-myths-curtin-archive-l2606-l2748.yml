canonical_text:
  quote: ''
  summary: 'The passage recounts events after a world fire and great water: Sedit
    reaches Olelpanti, Wokwuk loses body parts that become animals and valuables,
    Chuluhl is assigned to guard clover with a dew headband, Sedit casts off his skin
    to produce Sedits below, Olelbis gathers people and investigates cloud people
    traveling along a western ridge, and Katkatchila watches and drives them back.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sedit lived east of Olelbis's sweat-house, ran under the sky during the fire,
    went up on the sky to Olelpanti, and stayed there until the fire and water stopped.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the great water, Sedit made a house for himself and built a nearby house
    for Wokwuk, whom he had caught during the great water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Olelbis saw Chuluhl on a rock east of Sedit's house and told him to go down
    to Tokuston on Pui Mem to stay with the clover.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Olelbis gave Chuluhl a dew headband, instructed him to guard the clover and
    keep the grass and clover wet and green, and said he would place the rock on the
    earth for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wokwuk lost a finger, feathers, spittle, intestine, and backbone pieces; these
    traveled in different directions on or after the water and became deer, shells,
    a bird, blue beads, water bone, and elk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sedit said he would take off his skin and let it go to the world below; with
    Olelbis's permission he removed it like a coat and threw it down, saying there
    would be Sedits all over below.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Olelbis gathered people from every side into Olelpanti until they were present
    in great numbers at his house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Min Taitai and Hessiha disputed and threw red mud at each other while Olelbis
    was gathering people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Olelbis asked old women about unknown people who traveled swiftly north along
    a far western ridge every day after Klabus and Yilahl finished the level ground,
    hills, and mountains below.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old women identified the ridge travelers as Kahsuku, cloud dogs or cloud
    people, and directed Olelbis to ask the elder Katkatchila about them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Olelbis found the elder Katkatchila watching toward the south before sunrise;
    one cloud person appeared, saw Olelbis, and ran away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Katkatchila said that he and his younger brother watched night and day to
    drive back the cloud people; Olelbis asked them to catch one if they could.
  category: speech
  evidence_refs:
  - ev:7
