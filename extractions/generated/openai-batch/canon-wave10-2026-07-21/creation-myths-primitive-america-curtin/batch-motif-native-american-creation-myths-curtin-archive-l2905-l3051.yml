canonical_text:
  quote: ''
  summary: Olelbis and the Katkatchila brothers deal with captured and escaped cloud
    people. White and black cloud skins become sources of rain, escaped northern cloud
    people become sources of snow, and a red cloud skin is kept by the brothers. In
    Olelpanti, gathered beings await placement. The grandmothers advise Olelbis to
    send those not needed to the lower world as useful forms for future people while
    retaining the greatest beings above. Olelbis assigns several named beings to animal
    forms and habitats, including migratory birds, river birds and fish, and species
    generated from feathers of upper-world beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Olelbis says he must go see his brothers drive in more cloud people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The older brother says many clouds escaped through the fence to the north
    and will become Yola Ka, snow clouds; only one white cloud was caught.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Katkatchilas strip the skin from the white cloud and give it to Olelbis,
    who tans it by going north, south, east, and west before giving it to the other
    grandmother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two old women possess a white skin and a black skin and say these will
    make them warm at night.
  category: object
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: The two brothers catch a third, red cloud and keep its skin; the passage says
    they hang it in the west and sometimes in the east.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old women say the white skin sends out white clouds and the black skin
    sends out black rain clouds, producing rain for the world below.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old women regularly hang out the white skin first and then the black skin,
    then bring the skins back into the sweat-house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that all rain for people in this world comes from the two
    skins, and Olelbis says snow will come from cloud people who stay in the northwest.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: People gather in Olelpanti and around the sweat-house, singing, talking, arriving,
    and asking where they shall live and what Olelbis will do with them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Toko and Sula say Olelbis will put the gathered people in their places and
    that he is chief over all.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The grandmothers advise Olelbis to send those not needed in Olelpanti to the
    lower world and turn them into useful things for future people, while keeping
    the best beings above and sending only a small part of each below.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Olelbis assigns Kar to become a gray heron, Toko to become a sunfish, and
    Sula to become a trout in named waters or places.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Olelbis assigns Torihas as a blue crane and Chalilak as a goose, with northward
    spring travel and southward fall travel every year.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Olelbis assigns Kiriu to be a loon along waters and great rivers, and Katsi
