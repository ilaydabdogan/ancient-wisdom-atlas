canonical_text:
  quote: ''
  summary: Hwipajusi warns his people that Haka Kaina will attack to take his daughters.
    Haka Kaina, believing two men dead and claiming that Hwipajusi stole three girls
    from him, prepares an army, sends scouts, and attacks. Two Tsoplaina brothers
    secretly destroy many bowstrings before the battle. Haka Kaina's forces defeat
    Hwipajusi, kill him, take the three girls and plunder, and return by a trail near
    Wamarawi. There, two Mini Auna brothers hurl fire around the returning army from
    the top of their sweat-house; the army and the three daughters are burned, while
    two swift runners witness the destruction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hwipajusi summons his people and tells them to ready bows, arrows, and arms
    because Haka Kaina will send men to steal or take his daughters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haka Kaina says Bohkwi and Simu Nupchowa are probably dead, calls his people
    together, and says they must make war on Hwipajusi because Hwipajusi stole three
    girls from him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Haka Kaina's men dress for war with feathers, blackened faces, arms, and elkskin
    armor, and stand in a circle around the sweat-house for inspection.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At departure, women paint their faces, put on feathers and beads, dance behind
