canonical_text:
  quote: ''
  summary: Three reconnaissance episodes occur before an impending fight. Bulibok
    observes people from a tree limb and remains motionless while stones are thrown
    near him. Sehinom Chabatu goes alone underground into the enemy chief house, is
    noticed and tested with a stone, then returns to report and plan an attack. Hau
    Herit conceals himself in a hollow oak trunk or stump to observe the enemy camp;
    stones strike the stump, and the watchers dismiss it as only a stump before Hau
    returns with information.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bulibok went to the end of a ridge, climbed or went onto a tree with one eastward
    limb, sat on the limb, looked down, and saw people moving, playing, and dancing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People below noticed something on the tree limb and debated whether it was
    a person or only part of the limb.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Notudui Ulumus removed a sling from around his head and threw stones near
    Bulibok; Bulibok did not move, and the people eventually stopped watching and
    went away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bulibok returned home and said he had seen everything, knew the best way to
    go, and had not stirred when stones came near him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sehinom Chabatu told his people the war was not made by him, said he would
    go first and alone to inspect the place, mounted the ridge, went underground,
    and emerged in the enemy chief house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: People in the enemy place discussed whether Sehinom Chabatu might come, while
    others insisted that he had already been killed and burned in a sweat-house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Sehinom showed his head again, a stone grazed his nose, he dropped into
    the ground, and some people identified the sight as only a squirrel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sehinom returned to his army, reported many enemies, said they had killed
    his friends, ordered a daybreak fight, and named Sutunut and Koip Herit as targets
    to find.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hau Herit went to look at the enemy camp before dark and found a hollow oak-tree
    trunk as long as a man's height; he moved within it with his head just above it
    and of the same color.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: People below the hill saw something on the hill and debated whether it was
    a stump or a person.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Notudui hurled stones at the suspected stump; Hau lowered his head, the stones
    struck the stump with loud noise, and the people stopped throwing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hau waited until dark, returned, and told Sehinom everything.
  category: sequence
  evidence_refs:
  - ev:8
