canonical_text:
  quote: ''
  summary: Tulchuherris prepares for departure by repeatedly going west to obtain
    flint nails, marrow, thorn-bush clothing, green stone shoes, two animal dogs,
    and sky-spear equipment. His grandmother gives him Winishuyat, a thumb-sized hidden
    helper who can warn him. Before leaving, Tulchuherris must solve his grandmother's
    need for fire; after whole trees burn too quickly, Winishuyat tells him to use
    wild sunflower roots. Tulchuherris then travels until he reaches a high rock blocking
    the road, where an old man calls him upward; Winishuyat warns that the old man
    means to kill him, and Tulchuherris stops.
  language: English
  quote_policy: summarized
