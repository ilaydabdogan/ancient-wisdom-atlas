canonical_text:
  quote: ''
  summary: After Supchit is mourned and buried, Sas takes his son-in-law Tulchuherris
    to a plain with a great leaning pine tree, a place where Winishuyat says Sas has
    killed others. Sas and Tulchuherris take turns climbing and springing the tree.
    Tulchuherris survives, shortens the day by spoken command, evades Sas's final
    attempt to kill him, recognizes that prior warnings about Sas were true, and at
    night commands Sas to sleep soundly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sas and two sisters identify Supchit as kin, with Sas calling him his son
    and the sisters calling him their brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old man buries Supchit with his head north and looking southward, sings
    a song previously used for other burials, and Sas with his daughters cut their
    hair in grief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Early the next morning Sas asks Tulchuherris to get up and come to a place
    where Sas says he used to play when young.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Winishuyat warns Tulchuherris that Sas is taking him to a place where Sas
    has killed everyone who baffled him, using a tree-climbing and tree-bending danger.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The place is described as a very wide, level plain with a tremendous big pine
    tree in its middle, leaning somewhat to one side.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Winishuyat advises Tulchuherris not to kill Sas that day, but to lead Sas
    higher and higher on the tree and wait until the next day.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sas and Tulchuherris take turns climbing the pine tree while the other pulls
    its top down and lets it spring back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When Sas pulls the tree to earth and releases it, it springs back into the
    sky with a noise compared to thunder, while Tulchuherris holds on and descends
    unhurt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tulchuherris says a formula asking that the day be made short, and evening
    comes soon.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before the final turn of the day, Winishuyat warns that Sas will try hard
    to kill Tulchuherris and tells him to jump off before the tree is released.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sas pulls the tree to the ground, but Tulchuherris slips off behind him and
    rushes away before the release; the tree flies up with heavy thunder-like noise.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sas thinks Tulchuherris is dead, but Tulchuherris speaks from nearby; Sas
