canonical_text:
  quote: ''
  summary: The passage introduces named personages and the creatures or things into
    which they were later changed. In the narrative, Juka's younger daughter Haka
    Lasi dreams of marrying her brother Hitchinna and demands him as her husband.
    Hitchinna goes away with her but escapes at night by putting rotten wood in his
    place. Chuhna, Juka's sister, gathers the household into a house-sized basket
    attached to a rope reaching the sky and lifts them upward to save them from Haka
    Lasi. Haka Lasi burns the empty sweat-house. While the basket is near the sky,
    Metsi makes a hole to look down; the basket bursts, and all fall into the fire.
  language: English
  quote_policy: summarized
