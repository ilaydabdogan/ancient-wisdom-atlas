canonical_text:
  quote: ''
  summary: In a sweat-house gathering called to determine the best flute-player, many
    named people play in turn until their breath fails and they take on new colors
    or markings. Waida Werris is present unseen while his brother Waiti is told to
    watch him from home. Tsaroki plays first and his brother Hawt plays last. Hawt
    goes underground, emerges near the fireplace, lies on his back, and makes extraordinary
    music by using holes in his own body as the instrument. Tsudi Herit wakes the
    others, who marvel because Hawt had brought no flute and want light to see him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waida Dikit gives Patkilis and Sedit places on the east side, and Waida Werris
    is in the house although no one has seen him arrive.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before leaving home, Waida Werris tells his brother Waiti to keep house and
    says Waiti will see him night and day and should watch him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Patkilis and Sedit ask whether Waida Werris has come; others say he will not
    come and disparage him, while he is sitting there listening.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Waida Dikit announces that the gathering is to find the best flute-player
    and says each person should play alone.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tsaroki begins the trial and Hawt agrees to play last.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Several players perform for long periods; Tsileu Herit's playing makes himself
    and the sweat-house red, and Tsaik's playing later makes the sweat-house blue.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: When players lose breath, they stop and receive new colors or markings, including
    spotted, striped, roan, red, and black.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: After all others have played and fallen asleep, Tsaroki tells Hawt to go underground
    and come out near the fire before playing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hawt lies on his back and plays music through holes in his own body, drawing
    air through his nostrils and sending it out through holes in both sides.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Tsudi Herit hears Hawt's unusual music, thinks at first it may be a dream,
    and then wakes others to listen.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The awakened people wonder who is playing, note that Hawt brought no flute,
    and want light in order to see the player.
  category: speech
  evidence_refs:
