canonical_text:
  quote: ''
  summary: Sanihas Yupchi explains that Mem Loimis, while pregnant, was taken by Kahit
    to a distant place beyond horizons. She later moves farther east, bears two sons
    by Kahit, and lives beyond the third horizon. Sanihas sends Wokwuk and Kut, sons
    of Olelbis and Mem Loimis, eastward to find their mother and brothers. An invisible
    yapaitu guides them partway. Wokwuk uses a bone given by Olelbis to raise the
    sky so the brothers can pass through. They meet Kahit's two sons, reach Mem Loimis's
    house, and receive water and food from her after reporting the long waterlessness
    of Olelpanti.
  language: English
  quote_policy: summarized
