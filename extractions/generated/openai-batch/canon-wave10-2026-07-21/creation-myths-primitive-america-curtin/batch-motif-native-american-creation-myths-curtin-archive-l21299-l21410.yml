canonical_text:
  quote: ''
  summary: Curtin introduces the Yanas before presenting their surviving myths, then
    gives a historical account of their population, labor relations with settlers,
    the killings attributed to Mill Creek Indians, the retaliatory massacre of Yanas
    by white parties in August 1864, several named and localized killings, a rescue
    at Little Cow Creek, the slaughter of a religious dance gathering near Oak Run,
    and the small number of survivors.
