canonical_text:
  quote: ''
  summary: The passage opens the Olelbis narrative with a roster explaining that named
    personages later become animals, birds, or things. Olelbis is located in Olelpanti,
    the highest upper place, with two old women whom he calls grandmothers. The narrative
    states that an earlier world existed before the present one. People in that first
    world discuss Katkatchila, a southwestern hunter whose method of killing game
    with a hollow stick is unknown. Torihas Kiemila, their chief, sends the swift
    traveler Tsaroki Sakahl to invite Katkatchila to a dance and planned hunt. Katkatchila
    leaves his sister Yonot, her husband Tilikus, and her unseen child at home, comes
    to the dancing place, and is welcomed by Torihas while Olelbis looks down from
    above.
  language: English
  quote_policy: summarized
