canonical_text:
  quote: ''
  summary: Sedit waits to kill the silent man who passed him before, shoots forty
    arrows at him without effect, and realizes the man is Sas Kiemila, who has been
    fooling him. Sedit then follows a recurring song through several places and among
    several groups of beings, including Hinwa dancers, bird people drinking water,
    and Tsurats arguing about acorns. He meets Pom Piweki lying across a trail near
    a mountain. The song repeatedly starts and stops, circling higher around the mountain
    until Sedit reaches the top, which is the roof of Kele's sweat-house. Kele directs
    him to the western door; Pom opens the concealed entrance. Inside, Kele feeds
    Sedit, warns him about his rough sons, and hides him in a basket in the ground.
    Kele's daughters return with roots, and Sedit pinches the younger daughter while
    hidden; the elder tells her to be quiet.
  language: English
  quote_policy: summarized
