canonical_text:
  quote: ''
  summary: After a battle leaves only Chichepa and Wirula alive, Chichepa kills Wirula,
    mourns, and performs a rite using hairs from the dead, otter-skins, fire, hot
    rocks, and water-baskets. At daylight the dead return alive. The passage also
    describes sons born from Jewinpa's eye-gaze, Burnt Face's rebirth through spittle
    as a rapidly growing boy who revives Kedila's dead, and two boys placed in bearskins
    to be Weanmauna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fight kills both chiefs and several named or related fighters, leaving
    Chichepa as the last of Jewinna's men and Wirula as the last on Kedila's side.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wirula first says that the fighting is enough and that each survivor should
    go home to report that all their people are dead, but later decides to kill Chichepa.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Wirula shoots an arrow at Chichepa and misses; Chichepa then follows Wirula,
    strikes him on the skull, and Wirula dies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chichepa returns home crying, falls into the sweat-house, eats nothing that
    night, and wakes crying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The next morning Chichepa takes ten otter-skins, pulls one hair from each
    dead person's head, and fills the otter-skins with the hairs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chichepa asks the women to build a fire and give him four large water-baskets;
    he fills them with water, puts hot rocks in them, and empties the hairs into the
    water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Chichepa tells the women to stay all night in their houses and not put out
    a head while he stays in the sweat-house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The four baskets boil hard and fall over at daylight; afterward many voices
    around the sweat-house cry that they are cold and ask for the door to be opened.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At full daylight Chichepa opens the door, and Jewinna, Jewinna's son, and
    all the others enter alive, well, strong, and healthy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kedila's two daughters bear two sons of Jewinpa the day after Jewinpa looked
    at them through his fingers; the passage says the boys came from their father's
    eyes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After being killed and brought back to life by Chichepa, Jewinna's son goes
    east to Kedila's great sweat-house, stays five days and nights, and returns with
    his two wives and two sons.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kedila's youngest son, called Burnt Face, sits by the central pillar near
    ashes and fire, is mocked, spits in one place, and says he will live again through
    his own power if killed.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: After Burnt Face is killed, a baby boy comes up from his spittle, is washed
    by the women, grows quickly within hours, and reaches full growth the next day.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The young man who rose from the spittle finds Kedila's dead people, strikes
    each with his foot, turns each over, and all come back to life.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Old Jewinna takes two bearskins, catches the two young boys on top of the
    sweat-house, puts them into the bearskins, rolls them up, and puts them away to
    be Weanmauna.
  category: action
  evidence_refs:
  - ev:11
