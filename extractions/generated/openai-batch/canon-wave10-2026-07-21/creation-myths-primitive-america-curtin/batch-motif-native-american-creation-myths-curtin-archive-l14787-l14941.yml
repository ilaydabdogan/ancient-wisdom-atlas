candidate_motifs:
- id: motif:1
  label: Collective resurrection through hair, water, fire, and seclusion
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Chichepa gathers hairs from the dead, boils them in heated water-baskets
    during an overnight seclusion, and the dead return alive at daylight.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives the sequence but does not explicitly label it as a ritual
    or explain the mechanism beyond the described actions.
- id: motif:2
  label: Miraculous children from a father's eye-gaze
  taxonomy_refs:
  - miraculous_child
  basis: Two sons are born the day after Jewinpa looks through his fingers at Kedila's
    daughters, and the text says they came from their father's eyes.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not describe pregnancy or birth beyond the eye-gaze statement.
- id: motif:3
  label: Self-renewal through spittle-born child
  taxonomy_refs:
  - resurrection
  - death_rebirth
  - miraculous_child
  basis: Burnt Face claims he will live again by his own power; after his death, a
    baby comes from his spittle and reaches full growth by the next day.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not explicitly say the spittle-born young man is Burnt
    Face himself, only that he rises from Burnt Face's spittle after Burnt Face's
    claim.
- id: motif:4
  label: Revival by foot contact and turning the dead
  taxonomy_refs:
  - resurrection
  basis: The spittle-born young man strikes each of Kedila's dead people with his
    foot, turns each over, and all rise alive.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No wider explanation of the gesture is provided.
- id: motif:5
  label: Children enclosed in animal skins to become Weanmauna
  taxonomy_refs: []
  basis: Old Jewinna puts the two boys into bearskins, rolls them up, and puts them
    away to be Weanmauna.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage does not define Weanmauna or state exactly what change results
    from being rolled in bearskins.
- id: motif:6
  label: Prohibition on looking out during a restoration rite
  taxonomy_refs: []
  basis: Chichepa orders the women to remain in their houses all night and not put
    a head out while he stays in the sweat-house and the baskets boil.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states the prohibition but does not explain its purpose.
