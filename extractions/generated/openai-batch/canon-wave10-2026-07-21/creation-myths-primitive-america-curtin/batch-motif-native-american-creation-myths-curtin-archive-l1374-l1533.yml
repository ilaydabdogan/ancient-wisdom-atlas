canonical_text:
  quote: '"You have taken my flint!"'
  summary: A hunting party tries to obtain Katkatchila's deer-killing weapon. Kaisus
    fails to outrun him, but Hau later reaches a deer first, takes the flint, hides
    it in his ear, and denies having it. Katkatchila leaves angry and warns of consequences.
    Hau shows the flint in the sweat-house; Patsotchet warns that Katkatchila has
    great power and will take vengeance. Hilit Kiemila is left alone with the flint
    and begins rubbing and rolling it, with a parenthetical note connecting him to
    the later house-fly.
  language: English
  quote_policy: quoted
