canonical_text:
  quote: ''
  summary: Jewinna, a western figure with a large sweat-house, keeps his youngest
    and only living son Jewinpa hidden in a bearskin. Two daughters of Kedila arrive;
    Jewinpa later follows them east to Kedila's house. Jewinna gathers his people,
    valuables, and weapons and follows. Kedila hosts the visitors, magically enlarges
    his sweat-house by blowing toward the four sides, feeds them, and exchanges valuables
    with Jewinna. The groups hunt squirrels, feast, gamble with sticks, quarrel over
    winnings, and fight until only four people remain alive on each side.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jewinna lives in the west, has a large sweat-house and many people, and keeps
    his youngest and only living son wrapped and hidden in a bearskin.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two girls arrive at Jewinna's house at sunset with a basket of roots; Jewinna's
    wife brings them in, and Jewinna seats them on a bearskin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jewinna calls to his hidden son to come out and sit with the two girls, but
    the youth only looks through a hole in the bearskin and does not come out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The next morning the two girls wash, dress, comb themselves, and go eastward
    toward their father's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jewinpa comes out after the girls leave, swims, dresses, eats, follows them,
    catches up, and goes with them to Kedila's house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kedila is pleased with Jewinpa and treats his own daughters well.
  category: relationship
