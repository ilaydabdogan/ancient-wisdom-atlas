  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kedila's sons-in-law bring food for Jewinna and his people; Jewinna's people
    give beads, otter-skins, and red-headed woodpecker scalps to Kedila, and Kedila
    gives wolf-skins and deerskins to Jewinna.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ten hunters from Jewinna's people find squirrels in trees, kill many, and
