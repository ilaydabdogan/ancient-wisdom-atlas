canonical_text:
  quote: ''
  summary: Sedit summons the two Hus brothers, who are making a road at Olelbis's
    command. The elder brother explains that future people will grow old, ascend the
    road to Olelpanti, drink and bathe in spring water, and return young. He also
    describes Olelbis's desired social order and future trees with shell-less acorns
    providing food without labor. Sedit challenges belief in Olelbis and argues that
    solitary repeated rejuvenation would leave people without companionship, children,
    or enjoyment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sedit calls the two brothers his grandsons, asks them to stop and talk, says
    he may know something wiser, and threatens to spoil or destroy their work if they
    do not come.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two brothers are frightened by Sedit's threat, come to the ground, walk
    up to him, and ask where he came from and where he lives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sedit says he heard people talking about the brothers making a road and came
    to look at their work and talk to them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The brothers say their work is not for themselves but for others, is done
    at another's command, and that Olelbis sent them down to make the great road.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sedit questions whether the brothers believe and obey Olelbis and says he
    does not believe in or care for what Olelbis says.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The elder Hus brother objects to Sedit's words and says he will explain why
    the road is being made.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The elder brother says Olelbis has said that a new people will come on the
    earth, grow old, and use the road to go to Olelpanti and become young again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The elder brother describes travelers stopping halfway up the road at evening,
    drinking from a spring, spending the night, and reaching Olelpanti the next evening.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Olelpanti, where Olelbis lives, the travelers will drink from one spring,
    bathe in the water of another, come out young, descend the road, and return to
    earth young and fresh.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The elder brother says Olelbis wishes that no man have a wife and no woman
    a husband, and that people be to one another as brothers and sisters.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The elder brother says small trees will become tall, have branches near the
    top, bear shell-less acorns ready to eat, and drop them so the future people can
    have food without work or trouble.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Sedit listens, looks at the elder Hus brother, turns to the younger Hus, and
    speaks sneeringly while questioning whether Olelbis's words are true, wise, or
    good.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Sedit says an old man could go up the road alone, drink from one spring, bathe
    in the other, return young, and still be alone.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Sedit says an old woman and an old man could go up separately and return young
    but remain alone, age again, repeat the journey, and have no friends, children,
    fun, or other activity besides going up old and coming down young.
  category: speech
  evidence_refs:
  - ev:13
