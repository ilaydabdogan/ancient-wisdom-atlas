- id: obs:2
  text: Before daybreak Titindi Maupa took his fire-drill, turned the faces of his
    brothers-in-law toward the earth, struck them with the fire-drill, and they came
    to life and returned to Wakaruwa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lawalila's people lay dead for two nights and a day; Titindi Maupa struck
    each with his fire-drill, they came to life, went home, later came to Wakaruwa
    for games and feasting, and did not become angry a second time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Titindi Maupa brought in deer every morning, his brothers-in-law ate with
    him, and they were friendly and happy during his twenty-day stay at Wakaruwa.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wakara told his daughter that he thought her husband would like to go home.
