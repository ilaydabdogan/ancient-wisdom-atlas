canonical_text:
  quote: ''
  summary: After a battle, Titindi Maupa revives fallen brothers-in-law and Lawalila's
    people by striking them with a fire-drill; reconciliation follows through games,
    feasting, and friendly relations. He hunts deer at Wakaruwa, then returns to Kurulsa
    Mauna with his wife and sister. Topuna later visits Titildi Marimi, is accepted,
    and they all live together at Kurulsa Mauna.
  language: English
  quote_policy: summarized
