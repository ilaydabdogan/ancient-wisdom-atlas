canonical_text:
  quote: ''
  summary: 'Norwanchakus tells Keriha to treat a small stranger as an uncle and feed
    him. The stranger, Nodal Monoko, proves enormously strong and capacious despite
    his small size: Keriha cannot lift his small root bag, Nodal carries it easily,
    eats great quantities of fish, uproots trees for firewood, and uses a bag and
    quiver that hold far more than their apparent size. After Nodal departs across
    a river, Norwanchakus and Keriha use a salmon hung on a tree to lure Hubit, and
    Norwanchakus instructs Keriha to mark the fish with pawit so Hubit can be followed.'
  language: English
  quote_policy: summarized
