  summary: The passage introduces a fire-bringing myth pattern in which fire is obtained
    by theft and followed by strenuous pursuit. In one example, relays carry the fire
    rapidly along a road; when pursuers nearly catch up, the fire is handed to a being
    who later becomes the turtle, who hides it in his mouth and rolls into a deep
    river until the masters of fire give up and return home sorrowing.
