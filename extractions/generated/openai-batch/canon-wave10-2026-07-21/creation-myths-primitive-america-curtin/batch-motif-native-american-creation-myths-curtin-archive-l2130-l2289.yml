canonical_text:
  quote: ''
  summary: In this Olelbis passage, Mem Loimis advances as mountain-high water rises,
    and Kahit follows blowing a whistle. Yoholmit floats on the waves in a basket
    and calls for the water to grow. Olelbis shelters others, uses his sling to divert
    Yoholmit’s basket and a hollow log carrying peoples, and asks Kahit to stop the
    wind and water. Kahit sends Mem Loimis back, the water disappears, and the world
    below is left as washed-clean rock with only one remaining basin of water. Olelbis
    seeks knowledge of remaining earth, and Yilahl Herit recounts surviving an earlier
    world fire by passing beyond the western edge of the sky.
  language: English
  quote_policy: summarized
