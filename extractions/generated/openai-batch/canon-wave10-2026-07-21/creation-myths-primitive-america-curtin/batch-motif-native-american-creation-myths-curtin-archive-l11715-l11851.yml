canonical_text:
  quote: ''
  summary: Sedit repeatedly attempts to make children from sticks under Kele's instructions,
    loses daughters when he cannot endure the ordeal, succeeds in making twenty sons,
    and sends them to hunt. The sons paint themselves yellow, explaining coyotes'
    yellow color, later hunt smaller animals, avoid a dangerous old woman who becomes
    a swamp and spring, and finally scatter across the landscape. Kele's people remain
    in a mountain sweat-house and appear as wolves outside but as people inside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sedit reports to Kele that his sticks were falling all night, and Kele reminds
    him that he had been told not to look.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the next attempt, Sedit endures blows until near daylight, then screams;
    the twenty sons drop down and become sticks again, and the girls are also sticks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sedit places the two sticks with the twenty others, names them as his son
    and daughter, and asks Kele whether he can make more.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kele says Sedit may try for sons, but that the girls will not come back.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sedit succeeds on a third attempt and has twenty sons, but no daughters; the
    sticks do not turn to girls again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sedit sends his sons to hunt and instructs them to go along a western ridge
    in one line.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kele's boys see Sedit's sons in a long line and identify them as cousins and
    as Sedit's sons.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sedit's sons dance and play on a flat, make yellow clay paste, paint themselves
    yellow, and the passage states this is why coyotes are yellow to this day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Sedit asks why they returned without deer, the sons say they danced and
    painted.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Kele advises Sedit to let the sons hunt birds, gophers, and grasshoppers in
    the meadows, saying gophers are as good as deer.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The sons later bring grasshoppers and gophers from the hunt, and Sedit is
    satisfied.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: One son reports that the brothers sought water, met an old woman who offered
    water, were warned not to drink, and saw her turn into a swamp with a spring in
    the middle after she was frightened.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Sedit identifies the old woman as Tunhlucha Pokaila, says she often drowns
    people, and warns the sons not to go near her again.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Sedit tells his sons to scatter through the country and to come to his sweat-house
