  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports that two obsidian knives are in Sas's house.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tichelis and Hawt are described as transformed after personal collision; Tichelis
