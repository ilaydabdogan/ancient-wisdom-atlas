canonical_text:
  quote: ''
  summary: Notes on the Tulchuherris and Sedit/Hus tales discuss Tulchuherris's earth-related
    birth, Nomhawena as earthworm and midwife, transformations into vulture feathers
    and animals, sunflower roots resisting magical fire, obsidian knives in Sas's
    house, and Sedit's argument for death contrasted with the Hus brothers and buzzard
    purification.
  language: English
  quote_policy: summarized
