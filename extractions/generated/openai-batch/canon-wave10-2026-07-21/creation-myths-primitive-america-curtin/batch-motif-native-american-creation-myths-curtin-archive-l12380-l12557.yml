canonical_text:
  quote: ''
  summary: The passage opens with a personage list linking named beings to later creature,
    celestial, or natural forms. In the narrative, Pun Miaupa quarrels with his father,
    leaves home, visits his maternal uncle Igupa Topa, and declares a long journey
    north. Igupa knows Pun intends to seek Wakara's youngest daughter, Halai Auna,
    and warns by action of the danger posed to suitors. Igupa accompanies him, first
    appearing old and weak, then revealing extraordinary leaping power across mountains.
    At Wajami Mountain, Pun mentally desires Wakara to send Halai out for wood; Wakara
    does so, and Ochul Marimi also sends her for leaves. Igupa enters Pun's heart
    to strengthen and protect him. Halai sees Pun and is frightened.
  language: English
  quote_policy: summarized
