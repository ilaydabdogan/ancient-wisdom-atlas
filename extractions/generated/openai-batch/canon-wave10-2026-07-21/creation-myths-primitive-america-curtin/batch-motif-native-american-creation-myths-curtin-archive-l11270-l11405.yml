canonical_text:
  quote: ''
  summary: Sedit, while digging red earth for Satok Pokaila, repeatedly hears the
    songs of Kele's daughters. The sisters make their singing seem to move away, and
    Sedit follows it. Before leaving, he instructs his basket and rootstick to show
    Satok the direction he has gone; when Satok asks them, the basket moves east and
    the stick falls east. Sedit follows the song through named places and over mountains,
    ignores questions from people, meets old Pokok, and then becomes distracted and
    frightened by a silent very large man passing westward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When Sedit stopped digging, the sisters stopped singing; when he dug, they
    began singing again, keeping him occupied while he accomplished little.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sedit lived at Satok Pokaila's house and worked for her by bringing wood and
    digging red earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the first day of hearing the song, Sedit said he had a headache, ate
    little, did not sleep, and thought about the song on the mountain.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the next day, the sisters went to the mountain top; Sedit came to the same
    place, heard singing plainly, saw no one, and eventually caught the music by singing
    himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sisters sang in response to Sedit and made their singing seem farther
    away, although they themselves remained in one place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sedit placed his basket and rootstick east of the pit and told them to show
    Satok Pokaila which way he had gone if she asked.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: When Satok asked where Sedit was, the basket moved eastward to the stick and
    the stick fell toward the east.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sedit followed the song southward to Tayam Norel, where people asked him questions;
    he did not answer and thought only of the song of Kele's daughters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sedit followed the song eastward to a mountain, met old Pokok setting a trap,
    and told Pokok that he was going east and would not be seen passing that way again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After crossing a creek and climbing another mountain, Sedit saw a very large
    silent man coming toward him; Sedit was afraid, and the man continued westward
    without speaking.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sedit spent the rest of the day thinking about the large man and did not follow
    the song, although he continued to hear it.
  category: attribute
  evidence_refs:
  - ev:10
