canonical_text:
  quote: ''
  summary: Metsi recognizes Putokya as dangerous, disguises himself as a decrepit
    old woman, and pretends concern for Putokya’s sickness. He claims he can restore
    Putokya by placing him in a heated, pitch-filled, rock-lined hole. Putokya believes
    him. Metsi places Putokya in the pit, covers him with stones, and the burning
    pitch kills him. Metsi then discards the disguise and continues his journey; the
    narrator describes him as a great cheat who can change himself, but says he did
    a good thing by burning Putokya.
  language: English
  quote_policy: summarized
