canonical_text:
  quote: ''
  summary: Keriha attaches a tuft to a salmon and tries for many days to make Hubit
    take it. Hubit remains silent and refuses, while Keriha watches him and threatens
    to kill him. Norwanchakus, addressed as Keriha's brother, counsels patience and
    says Hubit may have a reason. Hubit eventually bites, eats, and flies with the
    salmon. Keriha pursues him to the north, south, east, and west edges where the
    sky comes down, blocking each way. Hubit returns to the tree at Bohem Tehil, rises
    straight upward carrying the salmon and tuft, and Keriha watches until his eyes
    bleed.
  language: English
  quote_policy: summarized
