  text: The old woman brought out a quiver of arrows, hung it on a tree, put on a
    tuichu kilis net faced with white down, took the quiver, and behaved as if preparing
    to fight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tsotso Tokos told Sehinom Chabatu that Chulup was angry, had gathered many
    people, and wanted Sehinom to go to Miol Tapa the next day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman addressed Sehinom as her grandson, said the trouble she had
