canonical_text:
  quote: ''
  summary: Sehinom Chabatu gathers his people. His grandmother foresees trouble, performs
    warlike preparations, and receives the arrival of Tsotso Tokos, who brings Chulup's
    challenge to meet at Miol Tapa. Sehinom summons allies from several directions.
    Many allied figures and groups arrive, some demonstrating martial power or declaring
    willingness to fight. A messenger reports additional enemies. A second Chir Pokaila
    arrives to help. The armies form and approach each other in great numbers. Sehinom's
    grandmother, her sister, and Chir Chuma fight at the front with special arrows
    and secure victory for the left wing of the northern army.
  language: English
  quote_policy: summarized
