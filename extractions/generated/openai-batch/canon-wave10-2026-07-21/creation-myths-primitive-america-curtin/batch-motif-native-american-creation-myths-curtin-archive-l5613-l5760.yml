canonical_text:
  quote: ''
  summary: Sehinom Chabatu’s messengers summon allied groups. The Kawas sisters arrive
    with goods and inexhaustible food. Large allied forces, especially the Tidok people,
    gather. Sehinom denies causing the war, blames the Tede Wiu brothers and Norbis,
    and leads the assembled army southeast along the southern enemy’s trail while
    scouts locate camps and sight the enemy from a hill.
  language: English
  quote_policy: summarized
