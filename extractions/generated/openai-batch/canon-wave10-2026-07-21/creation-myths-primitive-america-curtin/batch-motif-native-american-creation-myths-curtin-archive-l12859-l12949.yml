canonical_text:
  quote: Wakara's daughters, the stars, are there on the sky yet.
  summary: Pun Miaupa and Wakara take turns testing each other on a bent pole. Wakara
    tries and fails to hurl Pun Miaupa away, while Pun Miaupa, aided by his uncle's
    power, throws Wakara into the sky. Pun Miaupa declares that Wakara will remain
    there forever, cycling through becoming small, dying, coming to life, and growing
    large again. Wakara's daughters grieve and wish to live near him. Chuhna, a spinner
    with a rope fastened to the sky, places the daughters and their husbands in a
    large basket and draws them up to the sky, where the daughters are identified
    as stars.
  language: English
  quote_policy: quoted
