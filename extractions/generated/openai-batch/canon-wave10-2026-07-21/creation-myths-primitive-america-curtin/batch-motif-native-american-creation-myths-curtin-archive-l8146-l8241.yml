canonical_text:
  quote: ''
  summary: The younger Hus brother accuses Sedit of wanting death in the world against
    Olelbis's purpose. The brothers leave, destroy their road by removing stones,
    and fly upward to Olelpanti. Sedit regrets his speech, tries to fly upward by
    attaching wild sunflower leaves to his body and making a leaf tail, but the leaves
    dry and break; he falls and is crushed. Olelbis assigns the Hus brothers a place
    near rocks by the sweat-house and says Sedit is the first to die, killed by his
    own words, and that his people will later be found dead by roadsides. The ruined
    road is named Sonomyai, and Wintu people say later settlers removed its stones
    for chimneys.
  language: English
  quote_policy: summarized
