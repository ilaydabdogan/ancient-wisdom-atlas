  summary: The passage comments on figures associated with the myth. It identifies
    the Hlahi as a doctor or sorcerer of importance in actual Indian belief. It also
    identifies Sanihas Yupchi, the archer of Daylight, with Tsaroki Sakahl, a messenger
    sent by Torihas to invite Katkatchila to hunt; the same figure also appears as
    the friend and messenger of Waida Dikit, who assembled a world concert in which
    Hawt was judged the greatest musician.
