literal_observations:
- id: obs:1
  text: The myth titled “Mem Loimis” is described as having wind and water as its
    moving characters.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Hlahi is described as a favorite and friend of one or more spirits, rather
    than exactly a master of spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The spirits associated with a Hlahi are said to have promised cooperation
    when the person became a Hlahi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hlahi must observe life rules, especially rules concerning food agreeable
    to the spirit, and must smoke, dance, and chant the spirit’s song when invoking
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sanihas Yupchi smokes and dances, while the Tsudi girls sing or chant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sanihas Yupchi means the archer of Sanihas; Sanihas is glossed as daylight
    and is represented as a person.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sanihas Yupchi is identified as Tsaroki Sakahl, who has a white stripe on
    his back and serves as a messenger or envoy in other episodes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wokwuk is described as the son of Olelbis and Mem Loimis and as, in Wintu
    belief, the greatest source of power and wealth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bits of Wokwuk are said to have come down to earth and become elk and other
    valuable creatures; the tip of his little finger became the earthly Wokwuk.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Seeing the earthly Wokwuk is said to bring great wealth through good luck.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: An old woman from Tsarken went for wood, saw something wonderful on a hill,
    and returned home frightened without her basket.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chief prepared a fir-tree shed with fir branches and fragrant herbs, summoned
    neighboring chiefs, and the group went to the Wokwuk in their best array with
    water, an oak slab, and a rope.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Wokwuk was found facing north.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The chief lit his pipe, blew smoke in every direction, and addressed the Wokwuk
    respectfully as a great person who had come to be seen.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The chief blew water around in every direction and then smoked a fragrant
    root toward the Wokwuk while speaking respectfully.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The group pushed the Wokwuk onto an oak slab, tied one leg to it, carried
    him home, placed him in the shed, and untied him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: The Wokwuk remained in the shed for two months, did not eat, and did not try
    to escape.
  category: sequence
  evidence_refs:
  - ev:11
