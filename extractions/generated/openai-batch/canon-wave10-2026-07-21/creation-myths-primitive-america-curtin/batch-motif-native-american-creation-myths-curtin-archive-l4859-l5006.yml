canonical_text:
  quote: ''
  summary: Norwan escapes from the mempak and returns home. Two armies assemble for
    battle. Nor Patsas repeatedly summons warriors by striking the ground with his
    brand and fights Chir Chuma, who is aided by the invisible Siriwit brothers and
    armed with red flint. Yipokus arrives at midday with weapons of ice and snow;
    water flowing from them kills Nor Patsas. Nom Toposloni Pokaila disrupts the southern
    army with crushed fir-bark thrown into eyes. Norhara Chepmis and Wainom Yola lead
    wind-associated forces that devastate each other. The battle ends with no gain,
    many dead, and is identified as the first battle on earth.
  language: English
  quote_policy: summarized
