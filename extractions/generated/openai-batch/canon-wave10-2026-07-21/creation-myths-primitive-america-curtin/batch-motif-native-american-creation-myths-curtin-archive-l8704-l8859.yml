canonical_text:
  quote: ''
  summary: Tsaroki, Waida Dikit, and then Kinus invite people from across the world
    to Waida Dikit's flute playing. Kinus reports that he has gone very far but cannot
    reach all places. Waida Dikit seeks three distant figures, including Patkilis
    and Sedit beyond the place where the sky touches the earth. As crowds arrive,
    the sweat-house expands. The small Lutchi Herit is asked to undertake the difficult
    errand, accepts silently, receives a blue flower, makes blue paint from it, colors
    himself blue, and announces his departure at daybreak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsaroki is sent northwest to invite people and reaches a place near where
    the sky touches the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Nop Kiemila's sweat-house, many people sit around the wall while Nop Pokte
    and Nop Loimis dance in the middle.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nop Loimis is described as very small and as having fawn's feet tied behind
    her head, which rattle sharply.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tsaroki touches Nop Kiemila on the shoulder, says he has come for him, explains
    that his grandfather is holding a flute playing, and Nop Kiemila agrees to go.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Waida Dikit goes south to invite people living in the water, while Tsaroki
    is sent to invite land people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After becoming tired, Waida Dikit and Tsaroki choose Kinus as someone suited
    for heat and cold, light and darkness, and hire him to carry invitations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kinus travels around the world to near where the sky comes down, invites the
    people he sees, and reports that the world extends farther than he went.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kinus says that during whole days he could get no water and no food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Waida Dikit says that Waida Werris, Patkilis, and Sedit are still wanted;
    Patkilis lives far in the East behind the sky beyond the place where the sky touches
    the earth, and Sedit lives with him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Those present discuss the distant invitees and say that Kinus and the others
    cannot go to them.
  category: speech
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:11
  text: The sweat-house grows wider, longer, and higher as more people arrive, and
    Waida Dikit blows and wishes it larger when new people come.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Several people suggest asking the small Lutchi Herit whether he can go, and
    Waida Dikit asks him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Lutchi answers without speaking by raising his brows, which is said to mean
    yes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Waida Dikit gives Lutchi a kunluli, a delicate blue flower that grows near
    the water.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: Lutchi rubs the flower between his hands, spits on it, makes blue paint, and
    rubs it over his face, arms, and breast until he is blue all over.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: At daybreak, Lutchi says he will return by sunrise or, if the places are very
