canonical_text:
  quote: ''
  summary: The passage lists personages and then narrates how Hitchinna, after a bad
    dream involving a pine tree and his own arms, goes with his wife and infant son
    to gather pine nuts. His body falls apart in the tree, his wife flees and warns
    the people, and the community hides in a sealed cave within Wamarawi mountain.
    Hitchinna becomes a Putokya, a skull being, eats his own infant son, and violently
    destroys trees, houses, and the abandoned village while the people remain hidden.
  language: English
  quote_policy: summarized
