canonical_text:
  quote: ''
  summary: Sukonia’s household welcomes two Jahtaneno sisters, whose baskets become
    large and full of food after they address them. Sukonia marries the sisters. Later,
    when the wives travel to visit their father with gifts, two Ichpul frog sisters
    stop them, kill and flay them, put on their skins, and impersonate them in Sukonia’s
    house. Chikpitpa recognizes the impostors by their frog smell and tells Sukonia
    that the Ichpul women killed his wives.
  language: English
  quote_policy: summarized
