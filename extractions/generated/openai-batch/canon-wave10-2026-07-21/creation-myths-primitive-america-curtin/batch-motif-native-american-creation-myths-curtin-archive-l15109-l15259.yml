- id: obs:4
  text: Food from the sisters’ baskets is eaten by the men present, and Sukonia marries
    the sisters that evening.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sukonia’s sisters show the wives household places for venison, roots, acorns,
    and water; the spring is inside the house in a covered corner.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sukonia tells his wives to visit their father and gives them venison, beads,
