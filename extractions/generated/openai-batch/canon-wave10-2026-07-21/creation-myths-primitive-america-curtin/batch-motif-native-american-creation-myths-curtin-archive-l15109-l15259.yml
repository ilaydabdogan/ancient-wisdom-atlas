  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the road near the Ichpul house, the two frog sisters ask Sukonia’s wives
    to put down their baskets and sit with them; the wives are frightened and fear
    refusing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Ichpul sisters ask to inspect the wives’ hair and heads, have the wives
    put their heads on their laps, then kill them, flay their bodies, and put the
    skins on themselves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The two frog women go to Sukonia’s house the next day, sit in the wives’ usual
