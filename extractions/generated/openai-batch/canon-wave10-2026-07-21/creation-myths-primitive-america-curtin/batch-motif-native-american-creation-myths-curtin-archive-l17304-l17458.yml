canonical_text:
  quote: ''
  summary: A skeletal, grieving man is found and nursed by Jamuka's daughters. Water
    runs from his eyes and attracts deer, which he later kills after receiving a bow
    and arrows. Jamuka recognizes him as Juka's son; he recovers, and a salt spring
    remains where he cried. Tsore Jowa finds her brother, then uses a sweat-house,
    boiling water, and preserved hearts to restore relatives and people, including
    Haka Lasi. Later Juka hides his son and makes him a Weanmauna, while the son's
    wives are taken by other brothers.
  language: English
  quote_policy: summarized
