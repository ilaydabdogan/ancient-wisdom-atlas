canonical_text:
  quote: ''
  summary: A world-fire advances across the earth while people flee north. Tichelis
    carries and drops a hot block of flint, then is consumed. Tilikus and Poharamas
    carry fire around the world and meet in the north, while Klabus and Tsaroki narrowly
    escape. Several figures go beyond or outside the sky. Olelbis observes the burning
    world; sparks become stars, and fire enters rocks. Before the fire, Olelbis has
    two old women prepare a sweat-house foundation and gathers rooted oak trees from
    several directions to build it.
  language: English
  quote_policy: summarized
