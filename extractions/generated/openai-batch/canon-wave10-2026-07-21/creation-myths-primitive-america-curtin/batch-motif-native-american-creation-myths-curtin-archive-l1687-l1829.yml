  text: The fire comes from east and west like waves of high water, moves northward,
    and roars while everything burns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People try to escape by rushing north; some fall down from heat and cry out
    that they are hot.
  category: action
  evidence_refs:
