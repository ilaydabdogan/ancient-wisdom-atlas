  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Katkatchila carries his little brother beyond the sky in the south; Yonot
    takes Pohila behind the sky with Tilikus; Poharamas goes to Olelpanti.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Olelbis looks down on the burning world; sparks from the fire become sky eyes
