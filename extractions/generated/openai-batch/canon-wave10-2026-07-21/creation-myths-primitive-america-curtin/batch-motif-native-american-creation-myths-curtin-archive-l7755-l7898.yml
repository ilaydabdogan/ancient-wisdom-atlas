canonical_text:
  quote: make a stone road from the earth up here to Olelpanti
  summary: In Olelpanti, Olelbis gathers the people for counsel, then commissions
    the two Hus brothers to build a stepped stone road from earth to Olelpanti near
    the first tree. The road is to allow future people to come up when old, drink
    and bathe in waters, become young again, and return to earth, so that no one dies.
    The brothers begin building rapidly. Sedit arrives in ornate dress, watches them,
    and asks them to stop and talk, but they ignore him.
  language: English
  quote_policy: quoted
