canonical_text:
  quote: ''
  summary: The passage is a note on the Wintu/Yana myth of Norwan. It presents Norwan
    as a central woman associated with a great war, lists her names and mountain residence,
    and identifies her also as a food-producing woman. The note then compares this
    producer role with an Algonkin sun-and-earth myth involving an earth maiden, the
    sun, Fox Woman, and a food-giving benefactor identified with warm air. It also
    distinguishes creation myths from action myths and comments on Schoolcraft, Longfellow,
    and Hiawatha.
  language: English
  quote_policy: summarized
