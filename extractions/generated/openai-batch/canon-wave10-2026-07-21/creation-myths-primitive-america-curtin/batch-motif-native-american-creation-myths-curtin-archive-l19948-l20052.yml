canonical_text:
  quote: ''
  summary: Ethnographic and historical notes describe the Wintus' former territory
    in northern California, estimated population decline, suffering from violence,
    disease, and land loss, an 1889 petition effort with the Yanas for land assistance,
    federal advocacy involving Governor Greenhalge and President Harrison, unresolved
    land-boundary issues, and a closing publication note about the myth 'Olelbis.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the Wintus as a nation or stock who formerly occupied
    land on the right bank of the Sacramento from near Mount Shasta to the northern
    shore of San Francisco Bay.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Wintus extended into Trinity County and that most
    lived on the eastern slope of the Coast Range and in the Sacramento Valley, with
    notable traditions connected to the upper Sacramento and MacCloud River.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator estimates a former Wintu population of at least 10,000 and possibly
    twice that number, while stating that not more than 500 remained at the time of
    writing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that many Wintus were killed by white men and others died
    from diseases brought by strangers, while the remaining Wintus are described as
    strong and adaptable.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In 1889, Wintus came to the narrator in Redding and complained that they had
    no safe place to build a hut, saying their former country had been taken by the
    white man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator told the Wintus to assemble their people and invite the Yanas;
    the two peoples met near Redding and discussed their needs over two days.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The stated request of the two peoples was that the United States give each
    man land and help to begin life on it; a petition to President Harrison was prepared,
    signed before a notary, and given to the narrator.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Washington, Governor Greenhalge cooperated with the narrator, President
    Harrison promised support, and an agent was appointed to find land for the Indians.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says land was found within the range of former possessions, but
    boundaries were mostly not materially marked, white men were trespassing, and
    the Wintus awaited surveys and a small appropriation.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: When the narrator met the Wintus in 1895, they expressed gratitude for assistance
    in settling them, and the narrator acknowledged Governor Greenhalge's aid.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage ends with a note that 'Olelbis,' described as the first myth published
    in The Sun, was preceded by a brief introduction.
  category: other
  evidence_refs:
  - ev:8
