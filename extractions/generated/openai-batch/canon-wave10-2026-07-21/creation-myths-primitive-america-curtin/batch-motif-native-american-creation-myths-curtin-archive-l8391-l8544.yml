canonical_text:
  quote: ''
  summary: Tsaroki receives a flute from Waida Dikit, plays it for three days and
    nights, and learns that its alder wood grew from people's bones. Waida Dikit then
    sends him west at night along a narrow bright sand trail to Nomhawena Pokaila,
    who tells him where his brother is. Tsaroki finds a broad dark place with many
    working people, approaches his brother secretly from underground, and whispers
    that Waida Dikit has sent for him; the brother agrees to go.
  language: English
