canonical_text:
  quote: ''
  summary: 'Jupka instructs Juiwaiyu about three roads near a small mountain: a barely
    visible right-hand road that must be found, a clover-scattered middle road that
    kills by lice and wind, and a left road that leads nowhere. Juiwaiyu travels through
    the air by singing, mistakenly takes the dangerous way, is attacked by wind and
    lice, loses flesh and beads, and is restored by Jupka through pipe smoke and a
    rose-twig. He then returns to find the narrow path, approaches Damhauja''s place,
    receives warning about a deadly pipe filled with crushed human bones, recovers
    his beads by wishing, and addresses Pahnino Marimi for kindness and assistance.'
  language: English
  quote_policy: summarized
