canonical_text:
  quote: The first arrow-points on earth were those which Kaltsauna made.
  summary: The passage lists Yana mythic personages and their later creature or thing
    forms, then narrates how, after Hehku's return from death, Jupka sends for the
    southern old man Kaltsauna because the Mapchemaina cannot kill deer with common
    stone arrow-points. Kaltsauna arrives with flints, distributes different kinds
    of flint to named places, and teaches the Mapchemaina to dress flint and make
    arrow-points.
  language: English
  quote_policy: quoted
