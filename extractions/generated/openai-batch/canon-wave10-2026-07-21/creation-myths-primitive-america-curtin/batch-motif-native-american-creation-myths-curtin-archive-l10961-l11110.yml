canonical_text:
  quote: ''
  summary: The passage opens with a personages list naming later creature or thing
    transformations. In the narrative, Olelbis places old, solitary Kele in a sweat-house
    at Puidal Winnem. Kele prepares sticks from trees; two girls arise from a split
    stick, and later twenty sons arise from smooth and rough sticks. The new children
    warm, sweat, bathe in a creek, and become good-looking. Kele instructs the daughters
    to gather roots and cook, and tells the sons to hunt and bring game.
  language: English
  quote_policy: summarized
