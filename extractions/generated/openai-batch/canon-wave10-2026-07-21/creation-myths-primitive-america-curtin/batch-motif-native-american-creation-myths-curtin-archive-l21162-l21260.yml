canonical_text:
  quote: ''
  summary: The passage describes Wintu doctor-helper spirits and dangerous spirits,
    especially Suku, Chir, and Kele. Suku and Chir cause severe illness and death;
    Kele uses a poison song and Kele's children lure people away, sometimes by shapeshifting.
    Keles are identified by a tuft of hair on the foot and live on Wenempuidal/Kele's
    Mountain. Closing notes mention Wintu spirit songs involving lightning and the
    sucker, Olelbis, Hau on the Milky Way, the Polar Star, and authorial comparisons
    to classic mythology and the Rig Veda.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doctors are said to have the spirits of the sun, stars, and clouds as good
    helpers; Sedit's spirit may be called but has little power.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Suku, identified as dog, is powerful and bad; it can kill quickly and can
    make a sick person vomit blood or bleed from the nostrils.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chir, identified as the sucker fish, is an evil spirit that causes dizziness,
    craziness, senselessness, and usually death; the sickness is called chiruntowi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kele is an evil spirit with a poison song that travels directly to a distant
    person, draws the person along, and causes lubeluntowi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The spirits of Kele's girls drew Sedit to them; he could not stop, did not
    return home, and remained at Kele's place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kele's sons are said to kill many Wintu women, and Kele's daughters are said
    to cause many Wintu men to be lost.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Kele woman in the woods can be recognized by a bunch of hair on the tip
    of her foot; when named as Kele, she leaves, turns into a mountain wolf, and runs
    away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Kele son can appear in the form of a man a woman is thinking of, carry her
    to the mountain, and make her disappear from her friends and others.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Kele son can also be exposed by the foot-hair sign; when commanded to go
    away, he turns into a wolf and runs to the mountain.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Keles live on Wenempuidal, a high mountain near the Little Sacramento;
    the whole mountain is described as their sweat-house, and they may be heard howling
    at night.
  category: setting
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: The notes identify four Wintu spirit songs and summarize themes involving
    lightning and the sucker, Olelbis as cloud-compeller, Hau travelling the Milky
    Way, and the Polar Star.
  category: speech
  evidence_refs:
  - ev:12
  - ev:13
