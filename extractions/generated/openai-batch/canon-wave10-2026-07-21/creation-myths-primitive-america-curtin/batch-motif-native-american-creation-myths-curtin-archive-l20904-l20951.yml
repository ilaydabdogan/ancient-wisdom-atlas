canonical_text:
  quote: ''
  summary: 'Editorial notes on the tale identify several epithet-named figures and
    actions: Keriha wears a duck-skin that produces ducks when removed; Norwanchakus
    names the southern end of a staff or stick attached to a net used by two brothers
    in place-naming; Nodal Monoko eats and carries fish, has a large bag, and later
    marries a grizzly bear; Norwan is described as a dancing porcupine and food-producing
    woman; daylight and darkness are independent personages before the sun; the sun
    is old Sas, who travels east to west carrying a glowing torch; Keriha and Hubit
    struggle in a comic episode for Wintu audiences.'
  language: English
  quote_policy: summarized
