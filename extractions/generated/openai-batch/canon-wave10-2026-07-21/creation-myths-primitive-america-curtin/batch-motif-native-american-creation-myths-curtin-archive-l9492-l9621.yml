canonical_text:
  quote: These different kinds of food were given to the world for the first time
    then, and this is why we have them now.
  summary: In a sweat-house gathering, several named beings produce new foods from
    bodily acts or worn objects. The foods are eaten from baskets or a stone cup that
    do not diminish. Waida Dikit tastes and distributes the foods, but manzanita berries
    cause spots on his body. Sedit objects to food being put away, and Patkilis says
    future people will eat what they want and store the rest. The assembly parts,
    Waida Dikit states where he will remain and how far salmon will come, and later
    animal peoples are associated with Tede Puyuk.
  language: English
  quote_policy: quoted
