canonical_text:
  quote: ''
  summary: 'The passage explains a mythic pattern in which a hero uses a special wish
    indirectly to transform enemies: he traps a company of first people in a flint
    house, makes it red-hot, and their heads burst open, releasing birds and other
    forms that reveal their true natures. The passage then generalizes that internally
    changed first people must become externally transformed, describes Wintu creation
    myths as metamorphoses of first people or gods into the present world, and distinguishes
    a later cycle of myths about recurring natural conflicts and phenomena.'
  language: English
  quote_policy: summarized
