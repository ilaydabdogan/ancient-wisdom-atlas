canonical_text:
  quote: ''
  summary: The passage introduces named personages and their later creature identities,
    then begins a narrative in which Old Jahtaneno sends two unmarried daughters toward
    the wealthy chief Sukonia. The daughters are prepared with bathing, red paint,
    baskets, beads, and food. Jahtaneno warns them not to look at Metsi, a richly
    adorned man on the road, and not to enter the dangerous house of two women near
    Sukonia. Metsi adorns himself and falsely claims to be chief; the younger sister
    rejects him while the elder is tempted. The sisters pass the dangerous house and
    arrive near Sukonia's sweat-house, marked by two black bearskins, where Chikpitpa
    announces their arrival.
  language: English
  quote_policy: summarized
