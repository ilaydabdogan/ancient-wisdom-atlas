canonical_text:
  quote: ''
  summary: The passage opens a fire-finding narrative. It lists the personages and
    their later creature or thing forms, states that Au Mujaupa possesses true cooking
    fire far to the south beyond a river while other people lack it, and follows Ahalamila
    as he searches for the fire, confirms it with the sharp-sighted Siwegi, leads
    an expedition, and reaches Au Mujaupa's guarded fire-house with Metsi and Shushu
    Marimi.
  language: English
  quote_policy: summarized
