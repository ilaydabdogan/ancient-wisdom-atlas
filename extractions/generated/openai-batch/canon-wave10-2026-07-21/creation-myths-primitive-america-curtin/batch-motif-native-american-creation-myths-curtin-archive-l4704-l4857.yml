canonical_text:
  quote: ''
  summary: Two opposing forces led by Norbis and the Tede Wiu brothers fight near
    a river without a decisive victory. The Tede Wiu brothers return to Norwan, who
    is confined with mempak, summon allies, and bind the house again before the next
    battle. Both sides gather many named helpers. Norbis asks the brothers to give
    up Norwan; they refuse, and a second battle begins with more fighters arriving.
  language: English
  quote_policy: summarized
