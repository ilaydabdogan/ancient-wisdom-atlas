canonical_text:
  quote: ''
  summary: The passage introduces named personages with later animal or plant forms.
    Tirukala lives near Jamahdi on Juka Mapti Mountain and resolves to improve the
    world. He separates crowded mountains, makes waterways, springs, and swamps, and
    puts fish in the waters, aided by Pakalai Jawichi and Hapawila. Hapawila’s singing
    and salmon traps draw Kedila’s two daughters. After an encounter involving a smooth
    tree and wished-for branches, Kedila burns his elder daughter. The younger daughter
    washes the body in a spring, and the elder daughter returns alive and healed the
    next morning. The sisters then travel west, and a wished-for basket of food appears.
  language: English
  quote_policy: summarized
