canonical_text:
  quote: ''
  summary: 'A gathered people see Waida Werris appear as a light rising to a pointed
    mountain and are told he will be seen in the north. In the sweat-house, Waida
    Dikit hosts the people: Tunhlucha Pokaila brings two water baskets that do not
    diminish, and Waida Dikit sets out venison, acorn porridge, and later fish for
    those who cannot eat venison. Food remains undiminished. Sedit objects to leaving
    food and proposes more talk, while Patkilis rebukes him and explains that Waida
    Dikit means the gathering has lasted long enough.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people see a pointed mountain and a small light rising to its top; the
    light settles there and is identified as Waida Werris.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Waida Dikit tells the people that future people will see Waida Werris in the
    north and calls everyone back to the sweat-house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tunhlucha Pokaila stands at the door with two baskets of water, sets them
    down, and leaves; Waida Dikit places them north of the fire and invites the people
    to wash.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tunhlucha Pokaila is described as Waida Dikit's sister, living in a rock house
    with a spring; her smaller basket holds drinking water and her larger basket holds
    washing water, and the water does not grow less when used by crowds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Waida Dikit sets out baskets of cooked venison and acorn porridge and invites
    all people to eat; after many eat, the baskets remain full.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Karkit, Hus, and Yipokos eat venison, and the passage says that since that
    time they eat deer meat and find meat by smell.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Memtulit, Kiriu, and Tsararok say they cannot eat venison and eat what lives
    in water; Waida Dikit provides dried fish and little fish, and Tsararok's liking
    for small fish is explained by what he eats there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sedit is angry that food is put outside and says people should leave nothing;
