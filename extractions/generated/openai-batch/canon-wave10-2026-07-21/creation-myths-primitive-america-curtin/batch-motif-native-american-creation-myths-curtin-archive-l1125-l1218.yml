canonical_text:
  quote: ''
  summary: The passage is an introductory discussion of creation myths, primitive
    thought, and comparative mythology. It describes Greek and Roman mythology as
    affected by literary treatment; states that in Indian belief all objects except
    man are divine; gives examples of first people becoming plants or creatures, maize
    as a transformed god eaten to save humans, and a destructive old personage transformed
    into wild parsnip; and argues that American Indigenous mythic thought can illuminate
    older systems of religion.
  language: English
  quote_policy: summarized
