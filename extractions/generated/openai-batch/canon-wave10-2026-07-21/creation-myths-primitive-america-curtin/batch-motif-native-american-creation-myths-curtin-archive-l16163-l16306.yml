canonical_text:
  quote: ''
  summary: The passage introduces personages and states that names are followed by
    the creatures or things into which they were later changed. Titindi Maupa lives
    at Kurulsa Mauna with two sisters and wants his elder sister, Titildi Marimi,
    to marry his friend Topuna, a successful hunter. Titindi Maupa visits Topuna’s
    household with food and otter-skins, receives venison, deer fat, and a buckskin
    dress, and returns home with a magically light pack that enlarges after arrival.
    Titildi Marimi rejects Topuna, favors Hitchinna, and magically covers the outside
    of the house with sharp rocks and thorny brush so Topuna cannot enter at night.
    Topuna wears out his clothing trying to find the door, returns home angry before
    daylight, and Titildi Marimi later goes out to dig roots and meet Hitchinna.
  language: English
  quote_policy: summarized
