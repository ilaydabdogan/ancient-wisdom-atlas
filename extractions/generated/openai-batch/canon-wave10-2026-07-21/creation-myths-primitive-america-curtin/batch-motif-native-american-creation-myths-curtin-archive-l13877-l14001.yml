canonical_text:
  quote: ''
  summary: A house is burned with people inside. Ilhataina carries bound legs home,
    places them in the river, and has his grandmother hide him. People rise from the
    river alive and enter the sweat-house. Ilhataina is revealed and called brother.
    He shows overwhelming strength by bringing great trees, then says he will not
    stay. Jupka offers gifts; Ilhataina refuses valuables but accepts an old rabbit-skin
    robe. He says future rain will be water falling from that robe, travels in a flash
    to a black cloud, and remains there.
  language: English
  quote_policy: summarized
