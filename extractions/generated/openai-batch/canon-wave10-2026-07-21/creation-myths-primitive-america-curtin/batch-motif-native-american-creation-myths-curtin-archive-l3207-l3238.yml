canonical_text:
  quote: ''
  summary: Olelbis assigns uses and forms for beings in relation to the new people.
    Tsurat plucks a feather, which Olelbis throws to earth, naming the place where
    it falls and declaring that it will become woodpeckers whose red feathers will
    be used for headbands. Olelbis sends earth-useful people down as creatures, while
    powerful people useful in Olelpanti remain above with him and send only a feather
    or part downward.
  language: English
