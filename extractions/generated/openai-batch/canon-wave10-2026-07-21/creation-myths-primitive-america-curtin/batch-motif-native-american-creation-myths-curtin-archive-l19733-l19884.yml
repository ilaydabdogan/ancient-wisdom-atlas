canonical_text:
  quote: ''
  summary: Pakalai Jawichi shows an old woman the person who killed her son, pinned
    to the earth, and names or transforms that person as Howichinaipa, a little bird.
    Jupka then orders and names a light-bearing eastern person, Tuina, with his dog
    Machperkami, assigning him a daily westward sky-road and a nightly underground
    return-road. Tuina's arrival affects the ocean and water grizzlies. Jupka then
    begins making the Yana from buckeye-sticks on Jigulmatu, creating a chief, a woman,
    an orphan boy, and common people, and assigning social obedience and food.
  language: English
  quote_policy: summarized
