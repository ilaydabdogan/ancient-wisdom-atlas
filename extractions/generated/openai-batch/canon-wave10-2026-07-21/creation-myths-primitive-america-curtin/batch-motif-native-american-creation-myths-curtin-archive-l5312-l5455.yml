canonical_text:
  quote: ''
  summary: The passage recounts a large battle between opposed forces, including flank
    and center engagements. During the center fighting, Sehinom Chabatu takes Chulup's
    wife Sanihas to his camp, and Chulup later recovers her. Wai Karili leaves the
    battle, sets a net-trap at the edge-of-earth opening used by Chulup to return
    to his home in the great eastern water, captures Chulup, kills him, and pounds
    his body fine. Sehinom's grandmother counsels him afterward, and Sehinom brings
    a painted yellow pine pole around which the people dance for two days.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens with opposed battle lines on the northern and southern flanks,
    naming Wai Karili, Hokohas, Kaisus, Tichelis, Kichuna, Hamam, Sedit of Sonomyai,
    and an unknown chief.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wai Karili's side has nets, Hokohas's people wear elkskin armor, Hawt's people
    throw solid blue rocks, and Tsuini's people throw smaller stones from slings.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The flank battle lasts until evening; many are killed on both sides, Hamam
    and Sedit fall, and neither side has the victory by nightfall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the center, Chulup is supported by Saiai Not, Tenek Not, and Tubuk against
    Sehinom Chabatu and the Tede Wiu brothers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chulup and Sehinom Chabatu alternately push into and force back the opposing
    center during the day's fighting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At sundown, Sehinom Chabatu sees Sanihas, Chulup's wife, behind Chulup and
    leads her to his own camp while Chulup is fighting the Tede Wiu brothers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After nightfall, Chulup has lost his wife; both sides leave the battlefield
    and make camp-fires in two long lines.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Before sunrise the next morning, Chulup rushes to Sehinom's camp, fights briefly,
    and takes Sanihas back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sehinom's grandmother, aunt, and uncle Chir Chuma, carried on two sticks by
    the Siriwit brothers, help Sehinom's side when his forces are hard pressed.
  category: action
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:10
  text: Wai Karili leaves the battle angrily, travels to the southeast edge of the
    earth, finds the opening used by Chulup to pass between land and the bed of the
    great eastern water, lays a net across it, and waits hidden.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the battle, Chulup sends Sanihas home by another way and enters the
    passage where Wai Karili is hiding.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Wai Karili closes the net around Chulup, carries him to Tehi Buli, taunts
    him, kills him, and pounds his body fine.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:13
  text: Sehinom's grandmother tells him he is becoming strong and knows how to fight,
    but warns that fighters do not live long and that he must stay awake and rise
    early.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Afterward Sehinom brings the tallest yellow pine from beyond Dau Paki Olel,
    strips the bark, paints it white, black, and red, and the people dance around
    the pole for two days.
  category: action
  evidence_refs:
  - ev:14
