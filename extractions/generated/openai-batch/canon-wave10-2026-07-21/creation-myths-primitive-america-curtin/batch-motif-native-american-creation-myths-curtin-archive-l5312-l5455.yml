candidate_motifs:
- id: motif:1
  label: Champion battle with alternating advantage
  taxonomy_refs: []
  basis: The passage arrays named leaders and forces, describes specialized weapons,
    and recounts repeated advances and reversals before neither side clearly wins.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:10
  confidence: high
  cautions: This is a narrative battle pattern; no supplied taxonomy family is assigned.
- id: motif:2
  label: Stolen beloved taken during battle and recovered
  taxonomy_refs:
  - stolen_beloved
  basis: Sehinom takes Sanihas, Chulup's wife, to his camp while Chulup is fighting;
    Chulup then attacks Sehinom's camp and recovers her before sunrise.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:11
  confidence: high
  cautions: The passage describes taking and recovery, but does not elaborate Sanihas's
    own speech or agency.
- id: motif:3
  label: Boundary ambush using a net
  taxonomy_refs:
  - trickster_boundary
  basis: Wai Karili leaves open battle, waits hidden at the edge-of-earth passage
    used by Chulup, and captures him with a concealed net.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The boundary and ambush are explicit, but the passage does not explicitly
    call Wai Karili a trickster.
- id: motif:4
  label: Passage between land and underwater eastern home
  taxonomy_refs: []
  basis: The opening at the edge of the earth is described as the route by which Chulup
    comes onto land and returns to his home on the bed of the great eastern water.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage gives the route and home location, but not a broader cosmological
    explanation.
- id: motif:5
  label: Captured enemy taunted and annihilated
  taxonomy_refs: []
  basis: After catching Chulup, Wai Karili taunts him, kills him, and pounds his body
    fine.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: No rebirth or sacrificial function is stated in this passage.
- id: motif:6
  label: Elder warning about the peril of fighting
  taxonomy_refs:
  - wisdom
  basis: Sehinom's grandmother tells him that men who fight do not live long and instructs
    him to keep awake and rise early.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The taxonomy label is broad; the passage presents practical counsel rather
    than a formal wisdom teaching.
- id: motif:7
  label: Painted pine pole with communal dance
  taxonomy_refs: []
  basis: Sehinom brings the tallest yellow pine, strips and paints it white, black,
    and red, and the people dance around the pole for two days.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The passage does not explicitly state that the pole is a world-axis or
    sacred tree.
