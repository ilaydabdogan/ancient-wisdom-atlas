canonical_text:
  quote: ''
  summary: The passage closes a feast episode involving Juiwaiyu and Damhauja, then
    begins the story of Tsanunewa. It lists personages and their later transformations,
    describes Jupka calling and naming the Mapchemaina, and narrates how the orphan
    Tsanunewa, reared by Tsuwalkai Marimi, disobeys a warning not to go to a dangerous
    rocky mountain where Hehku Marimi lives. Tsanunewa sets traps there and later
    finds Hehku Marimi in the last trap, then flees home frightened.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Juiwaiyu brings deer; Damhauja makes his house stretch and grow to fit the
