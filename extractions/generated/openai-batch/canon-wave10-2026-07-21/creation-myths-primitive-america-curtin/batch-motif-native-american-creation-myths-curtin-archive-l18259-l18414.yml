  text: Jupka and Bohkuina sit in the sweat-house Jigulmatu; Jupka calls Mapchemaina
    from different parts of the earth, does not make them, and gives them names.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Jupka says future world-dwellers will use the names he gives; he calls Jigulmatu
