canonical_text:
  quote: ''
  summary: Itchi Watibila and companions quietly remove three girls from Hohwitina
    while he sleeps and whistles in the sweat-house. Haka Kaina discovers the loss,
    reads tracks, and sends Bohkwi and Simu Nupchowa to retrieve the girls. Hwipajusi,
    anticipating this, has Matsklila guard the sweat-house; when the two men look
    in through the top opening, Matsklila cuts off their heads. In the morning Hwipajusi
    identifies the dead men as important members of Haka Kaina's forces.
  language: English
  quote_policy: summarized
