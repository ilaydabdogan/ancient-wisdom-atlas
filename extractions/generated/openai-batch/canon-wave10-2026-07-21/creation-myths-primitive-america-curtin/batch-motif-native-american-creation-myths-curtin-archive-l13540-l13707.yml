  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The boy breaks many bows around the sweat-house, but cannot break the last
    old bow, which is made of deer sinew.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tsore Jowa says Gowila killed the man who used the old deer-sinew bow and
    also those who owned the other bows.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy runs east, tears up a large pine tree with one pull, carries it home
    in one hand, makes a fire, heats stones, and has Tsore Jowa bring water that boils
    when the hot stones are dropped into it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boy tells Tsore Jowa to put him into boiling water and cover him; after
    a time the cover flies off, he is thrown through the sweat-house roof opening,
    drops outside, runs down, swims in the river, and returns.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the first boiling-water ordeal, Tsore Jowa says he will be very strong
    and will be called Ilhataina.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Ilhataina repeats the heating and boiling process with sugar-pines, a larger
