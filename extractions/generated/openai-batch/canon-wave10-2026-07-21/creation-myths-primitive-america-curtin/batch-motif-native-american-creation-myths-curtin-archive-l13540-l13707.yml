canonical_text:
  quote: Grandmother, put me into the boiling water.
  summary: The passage lists mythic personages and their later changed forms, then
    narrates how Tsore Jowa finds a small boy attached to roots, raises and washes
    him, and watches him grow rapidly. The boy asks for weapons, learns that Gowila
    killed their people, tests bows, undergoes two boiling-water ordeals in a sweat-house,
    is named Ilhataina, and prepares a deceptive lure to draw Gowila, who arrives
    with a dog and a deer head with horns.
  language: English
  quote_policy: quoted
