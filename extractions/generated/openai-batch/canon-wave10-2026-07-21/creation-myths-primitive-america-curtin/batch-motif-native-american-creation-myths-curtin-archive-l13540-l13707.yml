- id: obs:2
  text: Tsore Jowa is described as a very old woman living near Jigulmatu who goes
    west in spring to dig roots.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tsore Jowa digs up a clump of roots and finds a little boy on the roots, with
    his eyes staring out of his head; she pushes the eyes back, cures him, wraps him,
    takes him home, and washes him continually.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The boy grows quickly: by five days old he has grown considerably, by six
    days he creeps, by nine days he walks, and by fifteen days he is strong though
    very small.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy asks for a bow and arrows, while Tsore Jowa repeatedly tells him not
    to go out or leave her sight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A bird perches on a treetop and asks why the boy's mother does not nurse him;
