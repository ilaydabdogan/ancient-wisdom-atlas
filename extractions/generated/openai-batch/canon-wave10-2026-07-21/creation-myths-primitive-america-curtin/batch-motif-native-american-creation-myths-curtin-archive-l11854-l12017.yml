canonical_text:
  quote: ''
  summary: Kol Tibichi is born at Norpat Kodiheril on Wini Mem before daylight. As
    a small boy he repeatedly disappears from companions and from his bed, then is
    found at home, far away, under water, or hanging from a sugar-pine limb while
    singing. His mother, father, children, and villagers witness or report these events
    and fear that a yapaitu spirit may kill him. Later he sees a great bird, wishes
    for its wing feathers, blows upward, and Komos Kulit falls before him. A high
    voice in the sky tells him to call himself Kol Tibichi and says he will be the
    greatest Hlahi doctor on Wini Mem.
  language: English
  quote_policy: summarized
