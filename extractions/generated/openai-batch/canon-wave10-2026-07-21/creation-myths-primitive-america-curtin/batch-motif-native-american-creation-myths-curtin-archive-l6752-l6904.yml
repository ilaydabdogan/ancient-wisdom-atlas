canonical_text:
  quote: ''
  summary: Tulchuherris survives a sequence of lethal encounters in Sas's house and
    sweat-house. Sas is injured while smoking a pipe Tulchuherris holds. Winishuyat
    warns Tulchuherris about an old woman, whom Tulchuherris blinds with flint fingernails
    before she can look into his eyes. At night, Winishuyat warns him that two obsidian
    knives suspended over the bed are about to fall; Tulchuherris turns aside and
    the knives break. The next morning Sas leads him to a sweat-house made and fueled
    with human bones, blocks the door, and tries to smoke him to death. At Winishuyat's
    instruction, Tulchuherris cuts a hole with a Chirchihas bone, commands his spittle
    to groan in his place, escapes to the river, washes, and returns to Sas's house
    while Sas believes he is dying or dead.
  language: English
  quote_policy: summarized
