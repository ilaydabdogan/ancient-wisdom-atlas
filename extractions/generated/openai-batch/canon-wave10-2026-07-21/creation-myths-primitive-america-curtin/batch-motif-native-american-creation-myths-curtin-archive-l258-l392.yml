canonical_text:
  quote: ''
  summary: The introduction summarizes an American creation myth system in which an
    earlier world of numerous first people or self-existent divinities passes from
    harmony into conflict. Most of the first people become animals, plants, rocks,
    mountains, and other present forms, while a harmonious remnant leaves the earth
    westward beyond the sky-earth boundary or into upper regions. Some variants describe
    a powerful god overcoming opponents and reciprocal declarations that immediately
    fix transformed forms. Man is described as separate from the non-human creation
    process.
  language: English
  quote_policy: summarized
