canonical_text:
  quote: ''
  summary: Tsaroki and Hawt undertake a secret night journey to their grandmother
    and then to Waida Dikit's sweat-house, where they play and share a flute for many
    days. Waida Dikit sends Tsaroki to bring the old musician Kanhlalas Kiemila, who
    travels underground, illuminates the dark house, and plays continuously until
    his breath is nearly spent. Waida Dikit then proposes inviting all people in the
    world who can play music.
  language: English
  quote_policy: summarized
