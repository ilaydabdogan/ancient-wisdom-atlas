canonical_text:
  quote: ''
  summary: The passage summarizes a sacred myth group in which earth, sky, and sun
    are personified, and an earth maiden conceives a benefactor hero through the sun's
    gaze. It then describes the first people as divine models for Indian customs and
    institutions, and gives examples of mythic revelation through an Iroquois stone,
    a Lower Klamath sacred tree, and an Upper Columbia rock oracle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sacred group of myths associates earth with sky and sun, either as one person
    or as distinct persons, and adds one or sometimes two personages born of earth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the simplest version described, an earth maiden becomes a mother by being
    looked at by the sun and gives birth to a great hero.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hero gives people gifts that support existence and is identified with
    warm light seen above the earth in fine weather.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lives of the first people are described in creation myths and presented
    as models for faithful Indians.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that customs, observances, and institutions were understood
    as god-given because the gods of the preceding world had acted similarly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage identifies myths and explanations by wise men or sorcerers as
    the source of this religious direction.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among the Iroquois, myths are said to have been told to an ancient chief and
    assembly in a circular forest clearing with a large wheel-shaped stone; a voice
    from beneath the stone narrated the former world.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: On the Lower Klamath, an old immense tree is described as one of the first
    people metamorphosed, and sorcerers converse with it yearly.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Each year a small stone is added to a sacred pile near the Lower Klamath tree,
    and the pile must not be counted or disturbed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the Upper Columbia, a great elk-like rock is described as an oracle and
    one of the first people that told of the first world.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage frames these narratives as revelations that connect believers
    with the world that preceded the present one.
  category: relationship
  evidence_refs:
  - ev:9
