- id: obs:2
  text: The passage describes coyote as prominent in regional mythology and lists
    traits including gluttony, boastfulness, talkativeness, cunning, curiosity, lying,
    trickery, and being both deceiver and sometimes deceived.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Modoc chief coyote is said to possess the indestructible disk of the sun
    and to be immortal, or renewed daily, through it while carrying the sun.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Modoc religion, sacred mountain springs and small lakes are places where
    an aspiring magician or doctor fasts and watches until nearly exhausted, hoping
    spirits will appear.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Modoc coyote seeking magic power ate food hateful to the spring spirits,
    who punished him with mange, hunger, foulness, expulsion, and lasting wretchedness;
    his descendants are said to share this condition.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In a Shasta tale, a grandmother sends coyote to the sacred mountain with instructions
    not to stop, eat, drink, or speak on the road.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Shasta coyote stops at a frog woman's food-filled house, eats and drinks
