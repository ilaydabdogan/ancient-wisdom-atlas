canonical_text:
  quote: ''
  summary: Editorial notes discuss the tale of Sedit and the Hus brothers as treating
    life and death; describe coyote figures as gluttonous, boastful, cunning tricksters
    who often come to grief; summarize Modoc and Shasta coyote tales involving sacred
    mountains or springs, failed pursuit of magical power, taboo-breaking, punishment,
    and conditional rescue; and identify Hawt as a water-associated musician or lamprey-eel
    figure whose body functions like a flute.
  language: English
  quote_policy: summarized
