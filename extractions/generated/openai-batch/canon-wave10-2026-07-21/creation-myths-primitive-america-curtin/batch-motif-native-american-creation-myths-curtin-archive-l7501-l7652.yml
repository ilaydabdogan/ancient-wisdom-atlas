canonical_text:
  quote: ''
  summary: Tulchuherris prepares a fire-drill, a mokos, a fox-skin headband, and other
    objects, then summons Daylight and goes with Sas to a great pine. Sas first tries
    to kill Tulchuherris by bending and releasing the tree, but Tulchuherris escapes.
    After warnings that Sas will kill him, Tulchuherris bends the tree with Sas at
    the top and releases it, causing a cosmic crash that splits Sas. The larger part
    becomes Sas, the sun, and the smaller part becomes Chanahl, the moon. Tulchuherris
    gives them objects and assigns the sun daily westward travel and the moon a cycle
    of aging, death, renewal, and night visibility.
  language: English
  quote_policy: summarized
