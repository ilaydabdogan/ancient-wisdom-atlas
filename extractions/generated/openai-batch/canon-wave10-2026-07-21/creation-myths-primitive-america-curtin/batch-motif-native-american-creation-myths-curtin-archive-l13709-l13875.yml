canonical_text:
  quote: ''
  summary: Gowila invites Ilhataina to the fire, eats the roots Ilhataina has gathered,
    and sees illusory signs of many people and possessions. After Gowila throws Ilhataina's
    bow into the fire, Ilhataina breaks Gowila's bow and battles Gowila's dog and
    then Gowila. A Pleiades star twice reveals that the little toe is the fatal point.
    Ilhataina kills the dog and Gowila, wears Gowila's skin, revives the dog, tells
    his grandmother what happened, and then infiltrates Gowila's sweat-house of snake
    people by appearing as Gowila. He has Gowila's liver and lights cooked and eaten,
    discovers many discarded legs of Gowila's victims, makes the household sleepy,
    fastens the door, and calls for the walls to be covered with pitch.
  language: English
  quote_policy: summarized
