canonical_text:
  quote: ''
  summary: 'An old woman tells Tulchuherris that her kin went east to the great house
    Saskewil and were killed there by Sas''s household: Sas''s wife kills visitors
    with her eyes, and Sas kills people unseen with something from his nose. She names
    Kulitek Herit, Tulchuherris''s brother, as one of the dead. Tulchuherris grieves,
    makes a painted bow and arrow from western wood, and shoots the arrow east before
    dawn. The arrow becomes a hummingbird in flight and then an arrow again, lodging
    near Sas''s sweat-house. Sas and his daughters cannot remove it. Tulchuherris
    then tells his grandmother he must go east to Saskewil despite her warning that
    he will be killed.'
  language: English
  quote_policy: summarized
