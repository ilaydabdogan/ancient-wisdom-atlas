canonical_text:
  quote: ''
  summary: 'Curtin’s note compares Helen of Troy, Norwan, and an Algonkin hero whose
    place is taken by Hiawatha as different representatives of the same phenomenon:
    warm air above the earth in fine weather. The note says this phenomenon is imagined
    in one case as a major benefactor and gift-giver, and in two other cases as a
    priceless woman to be fought for. It then discusses a comparative method for distinguishing
    constants from variables in mythology.'
