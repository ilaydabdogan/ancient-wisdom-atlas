canonical_text:
  quote: ''
  summary: The passage gives explanatory notes on Kol Tibichi, yapaītu spirits, spirit
    songs, and a Wintu ceremony for making doctors. Chiefs and doctors prepare a sweat-house
    ritual; candidates are purified by sweating, swimming, sucking out impurities,
    receiving yellowhammer feathers, dancing, and then being entered by summoned yapaītu
    spirits that arrive with a whistling sound and select whom they enter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each individual existence in the mythology is said to have its own song, and
    a doctor sings that song immediately after the spirit of that existence has entered
    him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kol Tibichi's yapaītu is identified as the rainbow, which would not leave
    him until he used a woman's red apron as a headband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rainbow is described as connected with the catamenial periods of Sanihas,
    identified parenthetically as daylight.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The yapaītu dokos is described as a projection of the spirit itself of the
    yapaītu; it may flee from a patient, and the doctor's duty is to find it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A doctor can be made only in a sweat-house, and the chief assists because
    he owns the sweat-house.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Chiefs and old doctors agree on a time and announce that doctors will be created
    on a certain night; young persons who wish to be doctors go to the sweat-house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men heat the sweat-house, sit in it until sweat pours from them, and then
    go to the river and swim.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Doctors sing and suck the forehead, breast, back, and arms of candidates to
    remove what is bad, impure, unclean, or evil.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sucking may draw out blood or something sharp like a fine bone.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: After sucking, the doctor sings again and places a yellowhammer's feather
    into each ear of the candidate, or on the candidate's head, where it may disappear
    into the ear or sink through the skull.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The people dance, especially the candidates for the dignity of doctor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chief stands on the housetop and calls yapaītu in rocks, water, Olelpanti,
    trees, and bathing springs to come and help make doctors.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the chief returns inside, every hole and chink in the sweat-house is
    closed; there is no fire and no light inside.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: A doctor calls the spirits of yapaītu in the east, west, north, and south
    to come.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: When a spirit arrives, it may be heard on the housetop making a whistling
    noise; a man or woman falls down, and the spirit is understood to have entered
    that person's head.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Persons into whom spirits have entered know nothing, become as if crazy or
    as if they have lost their wits, and may try to go to the housetop, climb the
    central pole, or leave the sweat-house.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:17
  text: Spirits come one at a time; many doctors, few doctors, or none may be made
    in one night.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: The spirits do not enter people unless they like them, and the spirit is said
    to look straight through a man and know him immediately.
  category: relationship
  evidence_refs:
  - ev:12
