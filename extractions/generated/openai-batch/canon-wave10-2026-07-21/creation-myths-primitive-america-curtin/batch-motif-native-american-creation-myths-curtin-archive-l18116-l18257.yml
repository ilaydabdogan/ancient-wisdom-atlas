canonical_text:
  quote: ''
  summary: At Damhauja’s place, Juiwaiyu is taunted by western brothers-in-law led
    by Kechowala. He defeats them in bone games and a race, survives hidden spider
    and flint traps and animal attacks with Jupka’s help, and kills attackers using
    a staff. The surviving western men kill women and children; Darijua escapes. Jupka
    drowns the remaining western men in a storm and restores the women and children
    with a rose-twig.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A crowd comes from the west, and Kechowala calls for the new man, Juiwaiyu,
    to come out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two sisters try to stop Juiwaiyu, and he says he does not want to be called
    a coward.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Juiwaiyu says his father and mother told him about this place and that he
    knows what it is.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kechowala’s people think that they will kill Juiwaiyu if he comes out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Juiwaiyu has one unpointed arrow described as a staff given to him by his
    uncle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the bone game, Juiwaiyu catches, hurls, and carries the bones beyond the
    barrier, winning games that no one else can win.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a race to a mountain, opponents plan to strike Juiwaiyu from behind, but
    he reaches the mountain before they come near him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A poison spider is put on Juiwaiyu’s path; Jupka points it out, and Juiwaiyu
    crushes it before it can poison him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Flint knives and spear-points are placed on Juiwaiyu’s path; Jupka tells him
    where they are, and Juiwaiyu avoids them and wins again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kechowala sends a rattlesnake and a grizzly bear to meet Juiwaiyu; Juiwaiyu
    kills both, skins them, and hangs the skins before the sweat-house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The staff given by Jupka kills when Juiwaiyu points it at someone and says
    that he wishes the person dead.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: After Juiwaiyu kills half of Damhauja’s sons-in-law, the others run home and
    kill their wives, the wives of dead men, and the children.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Darijua escapes the killing, runs to the sweat-house, and tells what happened.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Jupka makes a storm that drowns the remaining western men, then strikes the
    dead women and children with a rose-twig and brings them back to life, except
    for the men.
  category: sequence
  evidence_refs:
  - ev:10
