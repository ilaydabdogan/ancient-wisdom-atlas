canonical_text:
  quote: ''
  summary: In a sweat-house gathering, Tsudi uses a single hair from Waida Werris
    to fill the house with light so the people can observe Hawt making flute-like
    music from his body. The assembly praises Hawt as unmatched. After Tsudi returns
    the hair and darkness returns, the people debate seeing Waida Werris. Waida Dikit,
    advised by Patkilis and Sedit, sends everyone outside and tells them to look north
    to see him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waida Werris lies in the east half of the sweat-house, hears what is happening,
    pulls one hair from his beard, gives it to Tsudi, and instructs him to hold it
    near the player.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsudi silently carries the hair and holds it over Hawt's head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The single hair produces a light that fills the whole house and makes it as
    bright as day.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the light, the people are seen sitting up, each holding his own flute and
    looking toward the source of the music.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hawt is lying on his back with arms across his breast; he has no flute and
    makes no visible mouth motion.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hawt makes music by fingering his sides as if they were a flute, drawing air
    in through his nostrils, and sending it out through holes in his sides.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hawt performs the music of songs associated with Tsaik, Waida Werris, Tsaroki,
    Patkilis, Sedit, and all the people in the sweat-house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The assembly declares that Hawt has beaten the world, that they yield and
    are silent, and that he is the best player in the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hawt next plays his own music, described as known and playable only by him,
    with both loud and strong and soft and low qualities.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Tsudi puts the hair down and returns it to Waida Werris, the house becomes
    dark again and the people begin asking where the light came from.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: People speculate that only Waida Werris could make such a light and express
    a wish to see him; Patkilis says he has heard Waida Werris is good-looking and
    can be seen from afar.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Karkit Kiemila asks Waida Dikit whether Waida Werris is present and whether
    everyone will be allowed to see him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'The group is divided: one old man says Waida Werris is bad and does not want
    to see him, while others say they have heard he is good and want to see him.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Waida Dikit consults Patkilis and Sedit, who advise that if the people wish
    to see Waida Werris, they should be allowed to see him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Patkilis proposes that the people go outside, stand in two rows on either
    side of the door, and let Waida Werris go out between them so everyone can look
    at him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Tsaroki opens the door and goes out first; the others follow, saying it is
    dark and they will not see Waida Werris.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Waida Dikit says they can see Waida Werris in the dark, tells them to join
    hands, and directs them to the north side of the sweat-house.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Tsudi searches inside, reports that all have gone out, and Waida Dikit closes
    the door.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: Waida Dikit tells the people to wake up, open their eyes, be ready to see,
    and look north.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:20
  text: Chirchihas questions why they came outside in the dark and asks Lutchi about
