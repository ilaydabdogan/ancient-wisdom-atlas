canonical_text:
  quote: ''
  summary: The passage first lists personages with the beast, bird, thing, or element
    into which each was later changed. Mem Loimis, associated with water, comes from
    her home in the earth and from the north to live with Olelbis at Olelpanti; she
    becomes his wife and bears two sons, Wokwuk and Kut. When Kut is still small,
    Kahit takes Mem Loimis north to his house, Kahi Hlut. Olelbis cannot find her,
    and for five years the people of Olelpanti have no water because Mem Loimis had
    supplied it. Thirsting people discuss what to do. Hubit suggests summoning Kopus,
    a Hlahi who sings and dances nightly and may bring back water. Lutchi volunteers
    as messenger, fetches Kopus, and offers five sacks of acorns as payment for five
    nights of singing. Kopus returns, adorned with oak and acorn regalia. Olelbis
    asks him to hlaha, find Mem Loimis, and restore water; Kopus smokes tobacco, becomes
    possessed, and a Tsudi yapaitu comes to him as the excerpt breaks off.
  language: English
  quote_policy: summarized
