canonical_text:
  quote: ''
  summary: The note presents Olelbis as central to Wintu creation belief, describes
    Wintu awe toward their religion, locates Olelbis in the Central Blue in the Panti
    Hlut, and explains Winishuyat as a thumb-sized hidden attendant who embodies foresight
    of danger. It then compares Winishuyat's office with Yana maternal-uncle helpers
    and with European folk-tale helper figures such as a wise magic steed and Tom
    Thumb.
  language: English
  quote_policy: summarized
