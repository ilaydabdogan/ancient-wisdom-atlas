canonical_text:
  quote: ''
  summary: The passage recounts how Tiaio, a Mangaian sovereign and warlike chief,
    defeated Atiu invaders, later violated a sacred prohibition in Keia by wearing
    red hibiscus flowers, and was killed by Mouna, priest of Tane-the-man-eater. Tiaio's
    blood flowed into a brook and the ocean; his spirit entered a freshwater eel and
    then a large white shark, after which he was worshiped as a new divinity or shark-god.
    The Mautara priestly tribe adopted him over Tane, his worship was tied to a marae
    and feasting oracles, and later memory of the event appears in an image and a
    mourning song.
  language: English
  quote_policy: summarized
