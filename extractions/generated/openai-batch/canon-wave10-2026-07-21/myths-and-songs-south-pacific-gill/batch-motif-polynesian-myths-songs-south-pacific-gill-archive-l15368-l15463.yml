candidate_motifs:
- id: motif:1
  label: Rejected animal offering replaced by required human sacrifice
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  - divine_judgment
  basis: Rongo rejects or shows displeasure at Rangi's rat offering, and Rangi learns
    that only a human sacrifice will satisfy the deity.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states the requirement directly, but the wording is mediated
    by the prose narrator.
- id: motif:2
  label: Descent to the shades and return with ritual knowledge
  taxonomy_refs:
  - afterlife_journey_map
  basis: Rangi descends to the shades to visit Rongo and returns to the upper world
    with knowledge of the required sacrifice.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The descent is briefly summarized and is not elaborated as a full journey
    itinerary.
- id: motif:3
  label: First battle produces first human sacrifice
  taxonomy_refs:
  - sacrifice
  basis: After Rangi's return, his first battle leads to the killing of Vaioeve expressly
    as a sacrifice, identified as the first human sacrifice on Mangaia.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents this as an origin explanation for practice rather
    than a fully narrated battle episode.
- id: motif:4
  label: Outsider or settler groups designated as sacrificial supply
  taxonomy_refs:
  - sacrifice
  basis: The passage describes the tribe of Tane, Tongan-related families, the Amai
    tribe, and many new settler bands as devoted to supplying human sacrifices, while
    the original Rongo and Motoro worshippers are exempt.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: This is a social-ritual pattern in the prose account, not a single mythic
    episode.
- id: motif:5
  label: Preserving victims for future sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Some members of sacrificial families are said to have been reserved and even
    cherished so they could provide future sacrifices.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives this as a historical or ethnographic statement, not
    as an individual narrative scene.
- id: motif:6
  label: Sacred theft from a deity's altar
  taxonomy_refs:
  - sacred_theft
  basis: The myth introduces Matarau stealing a sword-fish from Rongo's altar, with
    Rongo sending messengers to recover it.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage excerpt ends before the myth's resolution.
- id: motif:7
  label: Messengers devoured by a many-eyed guardian
  taxonomy_refs: []
  basis: Rongo's birds, additional bird messengers, purple butterflies, and red butterflies
    are sent to recover the stolen fish and are eaten by the many-eyed, many-headed
    Lizard-god.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: No available taxonomy reference exactly covers this monster-guardian and
    failed-messenger pattern; the narrative is also truncated at the end of the provided
    passage.
- id: motif:8
  label: Human victims figured as a deity's fish
  taxonomy_refs:
  - sacrifice
  basis: The passage states that fish were not offered to Rongo and that his fish
