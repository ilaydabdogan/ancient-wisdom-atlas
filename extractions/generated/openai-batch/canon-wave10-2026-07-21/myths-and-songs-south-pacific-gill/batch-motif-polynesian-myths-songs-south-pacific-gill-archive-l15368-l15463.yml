canonical_text:
  quote: ''
  summary: The passage explains Rangi's rejected rat offering to Rongo, Rangi's descent
    to the shades and return with knowledge that only a human sacrifice would satisfy
    Rongo, the first battle and first human sacrifice on Mangaia, later practices
    of devoting particular groups to sacrifice, a later plot to sacrifice the Christian
    teacher Davida, and the beginning of a myth in which the Lizard-god Matarau steals
    a sword-fish from Rongo's altar and devours Rongo's bird and butterfly messengers.
  language: English
