canonical_text:
  quote: ''
  summary: Maui approaches the house of Mauike, the fire-god, asks repeatedly for
    fire, and extinguishes each fire-gift in a stream. Maui intends to force Mauike
    to reveal the secret of producing fire. After a contest of strength in which Mauike
    throws Maui without harming him and Maui then overpowers Mauike, the fire-god
    begs for his life and agrees to disclose the secret. Mauike leads Maui inside
    and shows him coconut fibre and fire-producing sticks, then begins to demonstrate
    their use.
  language: English
  quote_policy: summarized
