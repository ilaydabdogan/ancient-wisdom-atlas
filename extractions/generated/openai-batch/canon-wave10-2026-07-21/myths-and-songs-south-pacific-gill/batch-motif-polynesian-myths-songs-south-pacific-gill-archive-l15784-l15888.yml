canonical_text:
  quote: ''
  summary: A Mangaian peace prayer is led by a praying king and joined by drums and
    voices. The prayer speaks of a bleeding victim at an altar weeding out evils from
    the land and asks for peace and a cloudless sky. The passage then describes the
    repeated performance of the prayer around the island, the spear-thrust completion
    rite at the drum of peace, the hiding of the drum in a cave, the social effects
    of peace for vanquished people, offerings and tribute from defeated survivors,
    a feast recognizing their safety, tree plantings as tokens of peace, remembered
    chiefs under whom peace lasted, a tradition of an earlier time without war, and
    prohibitions on weapons during peace.
  language: English with Mangaian prayer lines
  quote_policy: summarized
