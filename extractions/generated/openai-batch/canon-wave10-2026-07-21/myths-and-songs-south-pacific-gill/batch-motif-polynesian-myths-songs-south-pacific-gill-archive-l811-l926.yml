canonical_text:
  quote: ''
  summary: The passage describes a Mangaian cosmology in which the universe is imagined
    as the hollow of a vast coconut shell called Avaiki, connected to the upper world
    by an aperture. At the bottom is a tapering stem and root-point identified with
    primal spirits. In the lowest Avaiki lives Vari-ma-te-takere, who creates Avatea/Vatea
    from a piece of her right side. Vatea is described both as the first man and father
    of gods and men, half human and half fish, and in another account as a noon figure
    whose two eyes are the sun and moon.
  language: English
  quote_policy: summarized
