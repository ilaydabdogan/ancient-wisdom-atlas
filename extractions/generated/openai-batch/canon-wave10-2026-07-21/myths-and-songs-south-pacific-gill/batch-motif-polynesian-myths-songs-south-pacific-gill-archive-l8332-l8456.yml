canonical_text:
  quote: ''
  summary: The passage explains sneezing as the return of a travelling spirit to the
    body and records island-specific sayings addressed to that spirit. It then gives
    song and lament excerpts naming Poepoe, Rangikapua, Puara-moamoa, Tiairi, a warriors’
    resting-place or heaven, Mini as devourer of those who die naturally, a bua tree
    in the shades, and Avaiki as destinations or features of the unseen world.
  language: English with Cook Islands Māori terms and translated song lines
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sneezing is explained as occurring when a person’s spirit, after travelling
    away from the body, returns with difficulty and excitement, producing bodily tingling
    and enlivening sensation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Rarotonga, Manihiki, Rakaanga, and Mangaia, bystanders make customary remarks
    addressed as if to the sneezer’s spirit, with different formulas in each place
    or group of places.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A set of lines refers to Poepoe, or Speck-land, as a place to which the speaker
    goes alone while Mangaia fades from sight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Koroa’s lament describes spirits wandering toward the sea, a divine host gathered
    at Rangikapua, and movement from a leaping-place to dance at Tiairi while clothed
    in fragrant flowers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A lament for the sons of Rori describes three sons with noble head-dresses
    dancing the war-dance of brave spirits in Tiairi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ikoke says he will meet his murdered younger brother Takurua in the warriors’
    resting-place; the passage explains that this requires Ikoke also to die violently,
    because those who die naturally are devoured by Mini.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A saying about the unseen world speaks of going to a place of safety, Tiairi,
    to dance the warriors’ dance.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A funeral-game chant addresses Vara, says night is at hand and he must descend,
    describes Kovirua watching his wasting frame, and says Motoro pitilessly adzes
    away the body until only a living skeleton is left.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The same chant tells the addressed figure to take his place on the bua tree
    in the shades and says the parent has gone to Avaiki.
  category: setting
  evidence_refs:
  - ev:8
