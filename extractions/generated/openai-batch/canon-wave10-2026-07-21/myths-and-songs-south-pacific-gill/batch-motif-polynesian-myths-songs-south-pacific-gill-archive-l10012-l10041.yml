canonical_text:
  quote: ''
  summary: The introduction to Koroa's lament says Koroa commanded a coconut feast
    for his dead son Kourapapa, endearingly called Ura, in his grave. Notes compare
    the feast to older feasts associated with Tueva and Tiki, relatives of the mythical
    Veetini. The feast was dry and ill prepared, left all day at the entrance of the
    gloomy cave Auraka, then wrapped in native cloth at nightfall and thrown down
    to the corpse. The chorus calls it a dry feast for ghosts like Tiki's.
  language: English with Mangaian song lines
  quote_policy: summarized
