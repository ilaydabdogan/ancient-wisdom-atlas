canonical_text:
  quote: ''
  summary: Tutavake locates Tukaitaua practicing warfare near a chasm connected with
    the nether-world. Following Rongo’s instructions, he avoids Tukaitaua’s circuits
    until the warrior tires, then kills him. The killing avenges Matoetoea and his
    friends, but the passage states that bloodshed permanently introduces warfare,
    disease, lingering death, hurricanes, and famines. It further explains that humans
    learned weapons and fighting by secretly watching Tukaitaua, and recounts a later
    arrival of sky-sailing Tongans guided by a long string over a formerly smooth
    ocean.
  language: English
  quote_policy: summarized
