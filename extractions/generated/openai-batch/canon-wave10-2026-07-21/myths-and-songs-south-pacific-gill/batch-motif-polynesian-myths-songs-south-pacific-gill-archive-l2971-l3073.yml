canonical_text:
  quote: ''
  summary: Fire is initially unknown in the upper world, where people eat raw food.
    Maui discovers cooked food in his mother Buataranga’s basket and infers that the
    secret of fire lies in Avaiki, the nether-world. He secretly learns the words
    that open the chasm-road, borrows Tane’s red pigeon, descends despite guardian
    demons, reaches his mother’s house, reveals himself, and asks where to find Mauike,
    the fire-god.
  language: English
  quote_policy: summarized
