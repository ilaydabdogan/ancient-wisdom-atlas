canonical_text:
  quote: ''
  summary: The passage describes Mangaian ideas about disembodied spirits who gather
    at solstice-associated coastal rendezvous, wait under a leader, follow the sun
    around the island, assemble at Vairorongo, and at sunset depart over the ocean
    in the train of the Sun-god Ra into Avaiki. It also describes spirits lingering
    near former homes, the Red-cave and grassy place above it, kin attempting to detain
    the dead, and the fate of a late-arriving ghost who misses the annual train.
  language: English
  quote_policy: summarized
