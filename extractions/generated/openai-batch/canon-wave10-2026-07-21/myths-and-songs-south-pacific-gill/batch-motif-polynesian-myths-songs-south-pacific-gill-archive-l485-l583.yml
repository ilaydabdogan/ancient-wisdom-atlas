  summary: The preface discusses cross-cultural mythological coincidences and warns
    against assuming common origin or historical contact from resemblance alone. It
    gives examples involving Avaiki as the Mangaian netherworld, a Mangaian sun-god
    and a captive solar story, Ina the moon and her mortal lover, storm-gods associated
    with war and destruction, deluge traditions with numerical durations, creation
    in epochs, and Manu's flood.
