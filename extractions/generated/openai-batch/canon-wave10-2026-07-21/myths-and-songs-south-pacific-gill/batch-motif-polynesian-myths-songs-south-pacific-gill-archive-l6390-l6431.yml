canonical_text:
  quote: ''
  summary: The passage catalogs Mangaian explanations for human arts and inventions,
    saying mortal employments and skills derive from Avaiki, the shades, nether-world,
    spirit-land, or the dead. It lists origins for the axe, fire, cloth-beating, torch-light
    fishing, stealing, ovens, war, intoxicating drink, ball-throwing, and mourning
    rites, then adds an editorial note connecting Avaiki with Savai'i, Hawai'i, and
    Po/Night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mortal employments are described as transcripts of activities in Avaiki, with
    knowledge and skill derived from the invisible world.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first axe seen on earth in Mangaia is said to have been made entirely
    of stone and to have come from the shades.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maui is said to have introduced the secret of fire from nether-world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cloth-beating is said to derive from Mueu, a she-demon in the shades who beats
    the flail of death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Torch-light fishing is said to have been gained from the goddess Uti, who
    comes up from Avaiki on damp nights with a lighted torch and wanders over the
    island.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Iro is said to come from spirit-land on moonless nights to help mortals with
    stealing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Daily ovens, especially large ovens for ti roots, are said to derive from
    Miru's blazing oven in Hades.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The art of war is said to have been learned from Tukaitaua and Tutavake, denizens
    of nether-land.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: An intoxicating draught is said to be copied from a drink presented by the
    mistress of the invisible world to her victims.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ball-throwing is said to have been taught to Ngaru by fairy-women and then
    introduced by him to this world.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Veetini is said to have come from the dead to instruct mankind in mourning
    deceased relatives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The editorial note states that Po, Hawai'i, Avaiki, and Savai'i are convertible
