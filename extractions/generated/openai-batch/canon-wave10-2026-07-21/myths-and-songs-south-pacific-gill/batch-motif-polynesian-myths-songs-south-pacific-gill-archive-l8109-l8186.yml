canonical_text:
  quote: ''
  summary: The passage describes an Aitutakian account in which dead spirits descend
    to Miru's domain. Tekauae prepares a concealed coconut kernel before death, encounters
    Miru in the spirit-world, avoids eating a bowl of living centipedes by secretly
    eating the coconut, escapes the usual drowning and cannibal fate of Miru's victims,
    returns to life, and reveals what he saw despite Miru's warning.
