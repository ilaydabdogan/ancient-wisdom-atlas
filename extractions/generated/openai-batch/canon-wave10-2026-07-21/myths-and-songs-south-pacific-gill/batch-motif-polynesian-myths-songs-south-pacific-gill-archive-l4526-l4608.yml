canonical_text:
  quote: ''
  summary: Ina seeks transport across the ocean to the Sacred Isle and to her royal
    husband Tinirau. Several fish carry or attempt to carry her and receive lasting
    bodily marks after mishaps. A shark then bears her partway but dives away after
    Ina cracks a coconut on its forehead. Tekea the Great, king of sharks, carries
    Ina onward and protects her from attacking shark groups until she reaches the
    Sacred Isle.
  language: English with Mangaian song and formula fragments
  quote_policy: summarized
