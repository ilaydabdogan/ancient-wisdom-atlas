  quote: ''
  summary: Kationgia follows the dying instructions of his parent Maaru concerning
    the corpse. After two four-day intervals at the grave, worms and then a heaving
    mass with grunts lead to the first brood of pigs on Rarotonga. The young pigs
    follow Kationgia, multiply, bring him fame, marriage, peace, and eventual election
    as king. The passage explains the Rarotongan expression calling pigs the “worms
    of Maaru.”
