canonical_text:
  quote: ''
  summary: The passage first describes a coconut-drinking practice in which priests,
    unlike the mass of people and chiefs, strike off the coconut top as a sign of
    life-and-death power. In the Tahitian myth, King Tai sends his wife Uta with a
    calabash containing a severed eel head, meant as a wondrous gift that will become
    a coconut tree. Uta is forbidden to turn aside, bathe, sit, sleep, or put down
    the calabash, but she sets it down and bathes in a stream. The eel head sprouts
    into a young tree whose roots cannot be pulled up. A messenger-bird calls her
    back; Tai then sends her to kill the living eel tail, and he dies in expiation
    when she returns.
  language: English
  quote_policy: summarized
