canonical_text:
  quote: ''
  summary: Maui addresses the problem that the Sun-god Ra sets too quickly for food
    to cook. After ordinary coconut-fibre ropes fail, Maui uses hair from his sister
    Inaika to make a rope, hides by the Sun's aperture from the nether-world, catches
    Ra by the throat with a slip-knot, and releases him only after Ra promises to
    travel more slowly, giving people enough daylight for daily tasks.
