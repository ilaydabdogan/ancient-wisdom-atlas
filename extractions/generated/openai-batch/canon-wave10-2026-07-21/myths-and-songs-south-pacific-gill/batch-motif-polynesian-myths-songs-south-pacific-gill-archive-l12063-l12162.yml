canonical_text:
  quote: ''
  summary: 'Ngaru is saved from Miru''s flaming oven when a deluge extinguishes it
    and sweeps away Miru and her accomplices. He escapes by holding the stem of a
    nono plant while the Tapairu girls hold his legs. After the waters abate he passes
    through a dark winding way to Taumareva, marries there, and later returns to the
    upper world by cords dropped from two Karakerake birds sent by Moko. The passage
    then introduces a final heavenly foe: Amai-te-rangi, a sky-demon who lowers a
    basket or fish-hook to carry people upward and eat them. Moko sends lizard scouts
    to inspect the sky before Ngaru ascends in the basket.'
  language: English
  quote_policy: summarized
