- id: obs:1
  text: A giant taro leaf is cut, gathered into a container, filled with pure water,
    and used to hold the newborn child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The navel string is secured with tapa and divided lengthwise with a bamboo
