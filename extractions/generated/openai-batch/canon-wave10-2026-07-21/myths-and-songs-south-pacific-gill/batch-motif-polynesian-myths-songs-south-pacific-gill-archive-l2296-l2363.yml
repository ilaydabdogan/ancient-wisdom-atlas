- id: obs:3
  text: Coagulated blood is washed out with water, and the name of the child’s god
    is declared after the parents have settled whether the child belongs to the mother’s
    or father’s tribe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the father’s family was devoted to furnishing sacrifices, the mother
    could try to have the child adopted into her own tribe by having her tribal divinity
    named over the babe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The father might pronounce the name of his own god, such as Utakea, Teipe,
