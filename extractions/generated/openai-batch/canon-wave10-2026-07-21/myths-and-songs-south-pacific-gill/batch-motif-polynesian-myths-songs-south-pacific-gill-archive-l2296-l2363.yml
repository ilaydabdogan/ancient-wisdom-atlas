canonical_text:
  quote: ''
  summary: 'The passage describes rites performed at birth: a newborn is placed in
    water held by a taro leaf, the navel cord is cut with a bamboo knife and washed,
    and a god’s name is pronounced to mark the child’s divine and tribal affiliation.
    It also describes variants involving future sacrifice, a Rarotongan warrior-birth
    rite, the royal birth of Makea’s first-born son with a human victim, and a later
    idiom about a divine or devilish name spoken over the severed navel string.'
  language: English
  quote_policy: summarized
