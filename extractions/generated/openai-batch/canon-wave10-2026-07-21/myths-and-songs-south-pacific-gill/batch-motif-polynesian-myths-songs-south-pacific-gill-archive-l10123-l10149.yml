  quote: ''
  summary: A solo and chorus address someone at the entrance to a sad home, beat the
    breast in despair, say that the father Koroa is seeking the addressee, and state
    that the addressee must now eat black beetles, the food of disembodied spirits.
    The song also refers to a feast borne for Ura in his grave, described as dry like
    Tiki's.
