canonical_text:
  quote: ''
  summary: The final stanza presents Ina as a fairy voyager. Stars set behind western
    hills; Ina commits herself to the winds, invokes fish, is borne by fish and a
    lordly shark toward royal Tinirau over the sea, opens a coconut on the way to
    the Sacred Isle, beats a drum, and Tinirau is enchanted by her music. The stanza
    closes by saying the sport and Tautiti's visit are ended and spirit-world guests
    have gone.
  language: Mangaian with English translation
  quote_policy: summarized
