canonical_text:
  quote: ''
  summary: Moko suspects the purpose of the fairy women’s visit and sends little lizard
    servants to Miru’s underworld domain to gather information. The scouts report
    that Miru keeps kava to stupefy victims who are then cooked in her oven and eaten.
    Moko warns Ngaru before Kumutonga-of-the-night and Karaia-the-shadowy bind Ngaru
    in tapa, carry him toward Miru’s land, and threaten that he will be devoured.
    In Miru’s domain, the kava fails to stupefy Ngaru; Miru calls for him to be brought
    to her oven, and Ngaru confronts her, contrasting Moko’s hospitality with her
    practice of cooking visitors.
  language: English with Mangaian verse excerpts
  quote_policy: summarized
