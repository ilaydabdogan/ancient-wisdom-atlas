canonical_text:
  quote: ''
  summary: The passage narrates that the sky was once a low solid blue stone resting
    on plant leaves, confining humans. Ru from Avaiki raises it with tree stakes at
    Rangimotia, the center of the island and world, but his son Maui later transforms,
    grows gigantic, and hurls Ru and the sky upward to their present height. Ru dies
    suspended among the stars, and his falling bones are said to be the pumice stones
    found on Mangaia. The passage then adds explanatory and ethnographic notes about
    pumice, including a Pukapuka light-stone god of wind and waves.
  language: English
  quote_policy: summarized
