canonical_text:
  quote: ''
  summary: 'The passage describes several spirit-world beliefs and practices: ghosts
    journey by mountain road to a tree whose green or dead branches determine revival
    or capture; warrior spirits join Tiki in Avaiki if they bring offerings; ungifted
    ghosts remain outside in darkness; a red stone is linked to a sky oven for spirits;
    corpse objects serve as safe-conduct; Pukapuka priests use soul-snares; spirits
    may follow the setting sun to Reva’s house; and at Uea a soul-doctor uses music,
    whistling, procession, and gestures to restore a sick person’s spirit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ghosts from Ngatangiia ascend a mountain range on a road described as inaccessible
    to mortals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a ghost rendezvous there is a large iron-wood tree with both green and
    dead branches; spirits on green branches return to life, while those on dead branches
    are caught in the net of Muru or Akaanga.
  category: sequence
  evidence_refs:
  - ev:1
