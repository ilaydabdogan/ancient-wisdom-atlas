comparison_claims:
- id: claim:1
  claim: Within the passage, Rarotongan, Aitutaki, and Mangaian mortuary objects share
    the function of helping the dead enter or be received in the invisible world.
  claim_level: same_function
  target: mortuary provisions and safe-conduct objects in Rarotonga, Aitutaki, and
    Mangaia
  evidence_refs:
  - ev:3
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The objects and named recipients differ, and the passage does not claim
    a single origin for these practices.
- id: claim:2
  claim: The net of Muru or Akaanga and the Pukapuka soul-snares are functionally
    and visually similar as devices for catching ghosts or souls.
  claim_level: visual_similarity
  target: ghost-catching net and Pukapuka ere vaerua soul-snares
  evidence_refs:
  - ev:1
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage places them in different episodes and does not assert direct
    historical contact or common inheritance.
- id: claim:3
  claim: The Pukapuka soul-snare account and the Uea soul-doctor account both treat
    severe illness as involving a separable spirit whose movement affects recovery
    or death, though one practice traps the soul and the other restores it.
  claim_level: same_function
  target: detached-soul illness pattern in Pukapuka and Uea accounts
  evidence_refs:
  - ev:7
  - ev:9
  counter_evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  limitations: 'The ritual aims are opposed: Pukapuka priests are described as trapping
    souls, while the Uea specialist restores them.'
- id: claim:4
  claim: Tiki’s Avaiki house and Reva’s spacious house both function as afterlife
