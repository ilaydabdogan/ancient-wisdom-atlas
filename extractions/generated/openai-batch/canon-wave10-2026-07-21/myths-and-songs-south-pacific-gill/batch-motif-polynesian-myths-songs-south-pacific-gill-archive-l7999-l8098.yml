  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tiki sits at the threshold of a long reed-sided house in Avaiki, surrounded
    by shrubs and flowers, awaiting arrivals from the upper world.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rarotongan burial offerings of hog parts, split coconut, and kava enable a
