canonical_text:
  quote: ''
  summary: The passage recounts Veetini as the first person to die a natural death
    in Mangaia. His parents Tueva and Manga, his sister Tiki, and other relatives
    institute mourning signs, dirges, funeral games, and mourning dances. The passage
    also describes a mourning-period prohibition connected with the female demon Mueu.
    After Veetini's burial, the mourners search along the island shores and sleep
    in sea caves. At dawn near the Ruddy Cave, Tueva sees Veetini returning over the
    ocean in the bright trail of the sun. Veetini says he has been allowed to revisit
    the upper world to comfort his parents and to teach food offerings for the dead,
    but must depart again as a denizen of spirit-land.
  language: English
  quote_policy: summarized
