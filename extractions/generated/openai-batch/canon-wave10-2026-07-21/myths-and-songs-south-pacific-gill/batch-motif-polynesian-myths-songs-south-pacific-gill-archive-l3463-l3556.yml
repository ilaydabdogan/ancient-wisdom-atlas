canonical_text:
  quote: ''
  summary: Maui the Third first displays unusual power during a game of hide-and-seek.
    He later discovers that his father Manuahifare descends daily through a pillar
    to Avaiki, repeats the words that open the post, and enters the subterranean regions
    himself. There he meets Inaporari, his blind grandmother, identifies his own nono
    tree among four trees associated with named siblings, restores her sight with
    pieces of its fruit, and receives from her a statement that all above and below
    are subject to him alone.
  language: English
  quote_policy: summarized
