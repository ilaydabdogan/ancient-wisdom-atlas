canonical_text:
  quote: ''
  summary: The passage is an explanatory discussion of Polynesian divine terminology.
    It argues that Atua is the Eastern Polynesian word for God, rejects some proposed
    etymologies, links Atua with terms meaning pith, core, kernel, lord, or life,
    and explains related expressions for courage, eternity, beginnings, the heavenly
    family of divinities, animal abodes of divinities, and God as a strengthening
    girdle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the great word for God throughout Eastern Polynesia
    is “Atua” or “Akua.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a proposed derivation from “ata” meaning shadow, but says
    this is unsupported by dialect analogy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports another derivation from “tua” meaning back and says divinity
    as essential support is expressed by “ivi-mokotua,” meaning backbone or vertebral
    column, not by “tua” alone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the initial “a” in “Atua” is essential and points to related
    expressions “atu,” Tahitian and Samoan “fatu,” and “aitu.”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says “io,” a constant equivalent of “atua,” means the pith of
    a tree.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states the analogy that God is the pith, core, or life of man.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says “atu” means lord or master, but primarily means core or kernel,
    such as the core of a boil or kernel of a fruit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage explains that a master or lord is called “atu” because his favour
    and protection are essential to the serf’s life and prosperity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the welfare of mankind is derived from the divine “Atu” or
    “Lord,” described as the Core and Kernel of humanity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person who loses courage at a critical moment is said to be “topa i te io,”
    interpreted as being forsaken by his god, the divine something that gives courage
    to fight or endure.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says the thirteenth phase of each moon is called “Maitu” at Rarotonga
    and “Atua” at Mangaia.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage explains “rimua” as moss-grown and says eternity is expressed
    through the image of a lofty tree covered with moss from untold ages.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage explains a phrase for “from the very beginning” through “tupua,”
