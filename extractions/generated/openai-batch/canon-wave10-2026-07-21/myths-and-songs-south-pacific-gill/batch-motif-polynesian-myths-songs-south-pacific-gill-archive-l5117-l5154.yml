canonical_text:
  quote: He instructed the inhabitants in the mysteries of dancing.
  summary: Tinirau performs a moonlit sea-summoning rite with scraped coconut and
    an invocation, bringing fish and the Sacred Isle to him for dancing. Koro repeats
    the rite after learning the magic words, joins Tinirau and the finny dancers,
    is acknowledged by his father, and later gives Mangaia the first pandanus tree
    near the calling place and teaches dancing.
