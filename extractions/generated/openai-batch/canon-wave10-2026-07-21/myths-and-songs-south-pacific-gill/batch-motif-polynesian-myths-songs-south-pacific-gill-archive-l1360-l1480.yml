  summary: The passage explains how the twin gods Tangaroa and Rongo divide foods,
    plants, sea-creatures, and later human traits according to a red or fair versus
    non-red or dark principle. It narrates their competitive feast before Vatea and
    Papa, Tangaroa’s displeasure and food-bearing voyage to other islands, a seasonal
    explanation for fruits passing through Rongo’s land to Tangaroa’s realm, and regional
    notes on Rongo/Oro worship and related names in other Polynesian islands.
