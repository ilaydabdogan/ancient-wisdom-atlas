canonical_text:
  quote: ''
  summary: A fete song calls for opening fish-preserves, forming a porpoise from part
    of Vatea's half-fish body, pouring kava for divine favor, and driving fish to
    the reef. The prose explanation says Vatea made a great net, Raka roughened the
    ocean to hide it, Tane held the filled net while the fish dragged it for eight
    days and nights, and Vatea then named the fish kinds, thereby beginning counting,
    before the tide returned the fish to the sea.
  language: Mangaian with English translation and English prose
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The song calls for fish-ponds or fish-preserves at Aitutaki to be opened,
    where the fish of Tinirau and Koro sport.
