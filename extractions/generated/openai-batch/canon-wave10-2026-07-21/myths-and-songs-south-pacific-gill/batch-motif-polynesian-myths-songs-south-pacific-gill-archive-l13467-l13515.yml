canonical_text:
  quote: ''
  summary: The passage describes Miru, a nether-world spirit-eater, her son Tautiti,
    and her four beautiful daughters called Tapairu. The Tapairu appear in the upper
    world at sunset when dances honor Tautiti, bathe at streams, arrange themselves
    on hills in moonlight, may join dances connected with Tane if banana leaves cover
    part of the dancing ground, and return to Avaiki when the morning star rises.
    The passage also lists the names of the four Tapairu and notes a wider eastern
    Pacific use of the name.
  language: English
