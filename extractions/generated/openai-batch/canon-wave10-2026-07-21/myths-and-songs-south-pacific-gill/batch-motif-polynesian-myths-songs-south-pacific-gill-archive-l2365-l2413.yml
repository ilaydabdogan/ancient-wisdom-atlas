canonical_text:
  quote: ''
  summary: The passage describes a Mangaian public naming ceremony in which the principal
    king, acting as high-priest and assisted by the priest of Motoro, summons young
    people to family maraes. Participants are sprinkled with sacred stream water using
    myrtle leaves while a prayer or song is recited to the relevant god. The king
    taps each child or young person and pronounces the name. The stated purpose is
    to publicly identify each person’s god and clan, to prevent errors such as harming
    a fellow worshipper, and to guide priests and chiefs in later ritual and political
    decisions. A feast follows the ceremony.
  language: English
  quote_policy: summarized
