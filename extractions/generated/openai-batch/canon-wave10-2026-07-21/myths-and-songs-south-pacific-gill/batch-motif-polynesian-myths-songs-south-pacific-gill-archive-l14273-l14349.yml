canonical_text:
  quote: ''
  summary: 'The passage describes Mangaian eva, funeral games and dirge performances
    held after the death of a person of note. It gives an origin notice about Ve''eteni
    returning to life for one day to teach mourning, then outlines four varieties:
    a funeral dirge with blackened and bloody mourning bodies, a war-dirge with staged
    armed companies and chanted heroic history, an axe-dirge in which performers try
    symbolically to cut open the earth so the departed spirit might return from Avaiki
    beneath Mangaia, and a crashing-dirge with wooden weapons and explanations of
    divine anger. It also notes that several performance types were grouped under
    eva, or amusements, and gives a heading for Karaponga''s dirge in honour of Ruru.'
  language: English
  quote_policy: summarized
