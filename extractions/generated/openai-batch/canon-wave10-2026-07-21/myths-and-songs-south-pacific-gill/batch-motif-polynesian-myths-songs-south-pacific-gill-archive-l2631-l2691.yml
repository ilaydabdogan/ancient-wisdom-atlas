canonical_text:
  quote: ''
  summary: The passage explains Ina, eldest daughter of Kui-the-Blind, as a goddess
    associated with the moon. Marama, the Moon, descends from heaven to fetch her
    as wife. Ina’s visible domestic and cloth-making activities in the heavens explain
    moonlight, clouds, thunder, and lightning. A linguistic note links Ina with Hervey
    Group moon terms and with Samoan Sina and Tahitian Hina. An Atiu variant says
    Ina took a mortal husband to her celestial abode, then sent him back to earth
    to die by means of a rainbow.
  language: English
