canonical_text:
  quote: ''
  summary: An iron-wood tree introduced by Tongans grows in a secluded valley and
    becomes renowned. Oarangi and four companions seek to cut it for superior weapons
    despite warnings that it embodies the evil spirit Vaotere. Their night felling
    partly succeeds, but the tree repeatedly restores its roots, later rises whole
    again, turns bright red, and appears to bleed. The woodmen sicken, vomit blood,
    and die. A later daylight attempt by Oarangi and other companions fails when they
    are blinded and cannot find the tree.
  language: English
  quote_policy: summarized
