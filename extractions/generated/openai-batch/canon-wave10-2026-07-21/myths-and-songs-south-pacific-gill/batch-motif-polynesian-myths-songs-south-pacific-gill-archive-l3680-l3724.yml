canonical_text:
  quote: ''
  summary: Maui delays his parents while planning to return from Avaiki to the upper
    world. His parents visit Tangaroa and learn that Maui killed Tangaroa, handled
    his bones, and restored him to life weakened and scarred. Maui reaches the upper
    world, where his siblings mourn him, and announces that he has obtained the secret
    of fire and found a new land. He reveals a secret opening in the house pillar,
    descends with his brothers and sister to the nether/spirit world, shows them its
    wonders, and leads them back to the upper world of light.
  language: English
  quote_policy: summarized
