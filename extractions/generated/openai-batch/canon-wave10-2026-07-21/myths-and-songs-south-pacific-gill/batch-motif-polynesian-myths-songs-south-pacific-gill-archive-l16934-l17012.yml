  summary: The passage lists winter and late-year moons or months with associated
    weather, animal behavior, crop conditions, scarcity, floods, plant renewal, and
    year-end signs. It identifies the rising of Matariki/Pleiades as the new-year
    marker, describes regional worship or celebration of the Pleiades, and states
    that calendar knowledge belonged to kings and was ritually restricted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paroro, or winter, is introduced as a time of drought, cold, scarcity, and
    cold south winds that wither wild vines.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Manu, birds incubate or make nests; a woodpecker bores a dead coconut,
    the titi bores the mountain side, coral-tree blossoms, and warrior-spirits depart
    from earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During Pipiri, people are described as staying inside the house because of
    the cold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A note says the two months before the arrival of sprats are called the time
    of exhausted crabs, and that people are thought empty and weak until sprats arrive
    and give new life.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kautua is called the trail of the eel; the soil is said to be furrowed with
    water as though crossed by eels, and it is a time of floods.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: During Kaumumu, the land-crab comes out of hiding to feed and is easily caught;
    this is also called crab season.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: During Akamākuru, some breadfruit and chestnuts fall unripe and worm-eaten,
    brave men are expected to die prematurely, and hurricane winds are noted near
    the end of March.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: During Muriaa, reed blossoms are shed on the hills by a late blow; during
    Uringa, leaves of yam, arrow-root, and other plants fall; during Miringa, summer-season
    food is finishing up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: During Mā‘u, tuberous roots spring into life and plants are in leaf.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: During Vaetā, trees, stones, and bush are covered with wild yam and other
    vines, roots are luxuriant, and the year ends about mid-December.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The appearance of Matariki, or Pleiades, on the eastern horizon just after
    sunset indicates the arrival of the new year.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that the Pleiades were worshipped in many South Sea islands,
    including Danger Island and the Penrhyns, and that joy is shown in many islands
    at the constellation’s rising from the ocean.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The knowledge of the calendar belonged to kings, who fixed feasts in honour
    of the gods and public spectacles.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: For anyone else to keep the calendar is described as a sin against the gods
    and as punishable with hydrocele.
  category: relationship
  evidence_refs:
  - ev:10
