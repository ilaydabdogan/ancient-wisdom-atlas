canonical_text:
  quote: Pets of Raka, god of winds.
  summary: A kite song for Tenio's fete, attributed to Koroa circa 1814, calls dancers
    as the hill-top Atiu is covered with kites. The kites are called birds or pets
    of Raka, god of winds. The song invokes kite ascent through clouds, warns of Tautiti,
    and recounts a divine kite contest in spirit-land between Tane and Kongo, in which
    Tane is beaten because his string falls short while Kongo's kite reaches the edge
    of the sky.
  language: English with Mangaian song text
  quote_policy: quoted
