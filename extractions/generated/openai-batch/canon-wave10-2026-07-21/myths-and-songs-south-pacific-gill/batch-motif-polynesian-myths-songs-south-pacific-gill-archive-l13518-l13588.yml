canonical_text:
  quote: "“fairies avail themselves of these narrow passages to climb up from time
    to time, in order to be present at the dances of mortals.”"
  summary: A song honoring Mauapa is followed by explanatory prose about fairy women
    and men. The prose describes crevices, chasms, gorges, and holes as routes by
    which fairies climb from spirit-land or nether-world to attend mortal dances and
    fetes, especially Terangai's fete at Butoa. At dawn the fairy visitors return
    through crevices into Avaiki. The passage also says Potiki's fete-song prologue
    alludes to this myth in connection with a peace-inaugurating fete.
  language: English with Mangaian song text
  quote_policy: quoted
