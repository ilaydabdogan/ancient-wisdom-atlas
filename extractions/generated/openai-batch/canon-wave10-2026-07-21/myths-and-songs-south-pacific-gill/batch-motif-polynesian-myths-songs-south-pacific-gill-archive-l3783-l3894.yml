canonical_text:
  quote: ''
  summary: Iku, a Rarotongan fisherman and star navigator, discovers a submerged island
    later identified as Manihiki. The three Maui brothers secretly seek it. Maui the
    Younger catches and raises the island with a hook baited with coconut bud, while
    his brothers drown when the canoe breaks. Maui makes a canoe passage, fights Iku,
    stamps the land so that Manihiki and Rakaanga are divided, then ascends to the
    heavens. Local landmarks are identified as Maui’s footprint and hook-hole, and
    the tail of Scorpio is named Maui’s fish-hook. Iku later plants the first coconut
    tree and brings Tapairu and Toa to settle; the inhabitants are said to descend
    from Toa and Tapairu.
  language: English
  quote_policy: summarized
