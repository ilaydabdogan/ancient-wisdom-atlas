canonical_text:
  quote: ''
  summary: A song attributed in the heading to Tuka and recited at a reed-throwing
    match laments a planted tree, the former tree of peace at Tamarua, and Mangaia
    being snatched away. An embedded prose note describes sacrifice bearers telling
    weeping children that their father is being borne to the altar, and says Muare,
    son of the victim, survived and later induced Reinga to compose a commemorative
    song. The chanted verses name Makitaka as a former supreme chief dispossessed
    by Ngakiau, say Ngakiau directed the sacrifice of Teata and that the victim was
    laid on the altar, and close by lamenting that Mangaia is transferred or lost
    after chiefs acted treacherously despite solemn troth.
  language: Mangaian and English
  quote_policy: summarized
