canonical_text:
  quote: ''
  summary: The passage recounts the attempted human sacrifice of Reonatia for the
    public acknowledgment of Pangemiro's second election as supreme temporal chief.
    Reonatia is ambushed, pierced with a spear, carried to Rongo's altar, revives,
    is killed again with a stone adze, and is replaced on the altar. The account links
    the event with dissensions over divine anger and says it was the last human sacrifice
    laid on Rongo's altar. It then describes Rouvi, the betrayer, later rejecting
    the old cult, and describes post-peace handling of the corpse, Papa's supposed
    nocturnal feeding, the wrapping of Rongo's stone image, a smaller Rongo figure,
    and a note that Rimatara offered sacrifices to Rono but lacked the drum of peace.
  language: English
  quote_policy: summarized
