canonical_text:
  quote: ''
  summary: The passage explains a Mangaian association between peace, rule, and the
    beating of a peace-drum. It describes the last reported peace-drum ceremony, in
    which Teata was selected as a human victim, betrayed by his nephew Rakoia, killed
    by Arokapiti, and laid on an altar so that peace and Pangemiro's temporal sovereignty
    could be established. It later reports that land held by Rakoia's family was understood
    as the price of Teata's blood.
  language: English
  quote_policy: summarized
