canonical_text:
  quote: "“Halt, Vera, on thy journey ... Turn thine eyes to Mangaia ... Resting in
    the Red-Cave by the way.”"
  summary: A dirge stanza addresses Vera on his journey, asking him to look back toward
    Mangaia and his tearful parents. The chorus places a rest at the Red-Cave by the
    way. Editorial notes state that the dirge alludes to the myth of Veetini, that
    the native text uses the name Manga, mother of Veetini, and that Rarotongans speak
    of the dying as passing over the sea. A following heading refers to ghosts led
    by Vera preparing for final departure.
  language: Mangaian with English translation and English editorial notes
