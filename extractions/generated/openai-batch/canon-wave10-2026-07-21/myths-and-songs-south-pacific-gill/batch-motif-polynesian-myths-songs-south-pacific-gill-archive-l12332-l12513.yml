canonical_text:
  quote: ''
  summary: A Mangaian song/dramatic offshoot presents alternating parts for two women
    and a chorus. It praises Ngaru’s lightning-like power from Avaiki and Vari, introduces
    Miru with a stupefying draught and a threat to devour mankind, recalls a kava-stupefaction
    attempt, names Ngaru’s descent from Moko and Vari, describes a sky trap during
    Ngaru’s ascent and his rescue by golden lizards, and closes with references to
    diving in billows, Itikau, Shady-Land, and celestial ball-throwing.
  language: Mangaian with English translation
  quote_policy: summarized
