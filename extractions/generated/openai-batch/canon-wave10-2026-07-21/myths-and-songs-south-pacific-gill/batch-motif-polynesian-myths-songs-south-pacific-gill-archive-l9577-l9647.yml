canonical_text:
  quote: ''
  summary: A soloist and chorus describe a difficult journey through named places.
    The travelers press forward, try not to miss the way, identify a landing-place
    and difficult entrance, see a father watching, rest when the sun is low, pass
    stones and the gloomy cave Raupa, identify themselves as friendless ghosts at
    Auneke, look toward the setting sun, are followed and beckoned back by Mitimiti,
    halt, depart, and wear mourning weeds and flowers.
