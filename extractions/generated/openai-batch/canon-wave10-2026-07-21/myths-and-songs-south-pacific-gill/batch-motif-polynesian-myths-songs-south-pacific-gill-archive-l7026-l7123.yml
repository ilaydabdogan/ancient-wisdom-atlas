canonical_text:
  quote: ''
  summary: During Rata's canoe voyage, the party escapes a bivalve/fish, an octopus,
    and a whale. Nganaoa kills or disables the monsters, finds his parents alive inside
    the whale, makes fire within its stomach, and escapes with them after the whale
    strands. The party rests at Iti-te-marama and later returns to Avaiki. The passage
    then gives authorial comparisons to Rarotongan, Biblical, Samoan, and Mangaian
    materials involving Rata or the whale episode.
  language: English
