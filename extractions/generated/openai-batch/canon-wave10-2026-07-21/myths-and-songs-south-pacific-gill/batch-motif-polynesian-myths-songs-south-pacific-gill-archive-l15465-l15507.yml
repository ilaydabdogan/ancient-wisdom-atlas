canonical_text:
  quote: ''
  summary: Rongo devises a way to recover a stolen sacrifice called a “fish.” He sends
    two yellow butterflies, hidden among yellow leaves on a banyan tree above the
    cave watched by the Lizard-god. Rongo raises the moio wind, leaves fall and distract
    the Lizard-god, and butterflies and moths carry the swordfish through the air
    to Rongo’s altar while singing. An editorial note interprets the account as an
    allegory for the loss and recovery of Vaioeve or another early victim, with “fish”
    used for a sacrifice.
  language: English with brief Mangaian song text
  quote_policy: summarized
