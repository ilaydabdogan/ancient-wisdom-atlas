  summary: Introductory remarks describe Gill's missionary setting, his aim to reproduce
    Polynesian traditional beliefs, priestly transmission through songs, selected
    belief themes such as after-death spirit, sacrifice, divine ancestry, and the
    sources from whom the material was collected.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer states that he had been a missionary for twenty-two years in the
    Hervey Group in the South Pacific.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writer says he sought to reproduce the traditionary beliefs of a small
    section of the Polynesian family; he contrasts calling the system mythology with
    the adherents' view of it as theology concerning the visible and invisible world.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Correct knowledge of the mysteries is described as being possessed by priests
    and wise men, who embodied past teachings in songs chanted at national festivals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The continued existence of the human spirit after death is said to be implied
    in laments and in the allegory of Veetini.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Human sacrifice is described as a cruel system and as a perversion of ancient
    truth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that a common origin of mankind is taught through a contrast
    between the fair-haired and fair-skinned children of Tangaroa and the dark-haired
    and dark-skinned children of Rongo, both said to be offspring of Great Vatea.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A song attributed to Koroa asks for another Helper or new divinity to listen
    to the story of a wasting disease.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A large portion of the volume is said to derive from Tereavai, the last priest
    of the shark-god Tiaio; some links were lost when Tereavai's father Tuka was killed
    at Araeva.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that ancient Polynesian song language differed from the spoken
    language, and that myths and prayers were believed to be very old while dirges
    and clan-songs were more modern echoes of older compositions.
  category: other
  evidence_refs:
  - ev:6
