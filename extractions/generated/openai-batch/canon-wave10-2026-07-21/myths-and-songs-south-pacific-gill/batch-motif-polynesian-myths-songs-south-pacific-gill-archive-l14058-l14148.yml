canonical_text:
  quote: ''
  summary: At the Vaitipi fountain in Rarotonga, a white-complexioned fairy woman
    and man rise from the water from the shades to steal cultivated foods. Mortals
    set a net; the woman is caught while the man escapes. The captive woman becomes
    the wife of the chief Ati, who blocks the fountain. She bears a son after Ati
    refuses her request for Caesarean death and burial. Later she asks to return to
    the shades to end a custom that destroys mothers at first childbirth. Ati attempts
    to accompany her through the fountain, but cannot enter the lower world; she returns
    alone to teach what she has learned and is never seen again. Their son is named
    Ati-ve'e, and the story explains the name Tapairu as a memory of the fairy ancestress.
  language: English
  quote_policy: summarized
