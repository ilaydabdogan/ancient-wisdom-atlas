canonical_text:
  quote: ''
  summary: 'The passage describes Mangaian post-victory authority and peace-making
    rites: hereditary kings act as priests or mouthpieces of Rongo, temporal warrior
    chiefs require sacred consent, processions circle the island, war is symbolically
    ended by spear-breaking and peace objects at maraes, and the final drum of peace
    requires a human offering to Rongo accompanied by a prayer.'
  language: English; includes Mangaian prayer lines with English translation.
  quote_policy: summarized
