canonical_text:
  quote: ''
  summary: The passage discusses western island names preserved in eastern Polynesian
    song and place-names, identifies Avaiki/Savai'i as an ancestral homeland, and
    describes Avaiki as a netherworld or destination of the dead. It also compares
    Samoan Pulotu/Purotu with eastern island usage, gives Samoan death euphemisms,
    and recounts a Rarotongan route for ghosts to Tuoro, where trees, rock hollows,
    nets, and demons mark the passage to the shades.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ancient songs and traditions are said to preserve names of western islands,
    including Samoan islands and Tonga; a double canoe called “Tongans-sailing-through-the-skies”
    is said to have landed on southern Mangaia and founded a Tongan tribe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Places on Mangaia are called Niue, Rotuma, and Papua.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage presents Savai'i, identified as the original Avaiki, as the center
    from which the race emigrated, while noting another suggestion that northern Avaiki,
    Hawai'i, was the original home.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Named descendants or brothers from Avaiki include Papa-rangi, Vaerua-rangi,
    and Te-akataaira, with meanings connected in the passage to sky or voyaging from
    the setting sun.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Priests of the dominant tribe are said to have asserted that Avaiki was the
    hollow of a vast coconut shell, with Mangaia placed over its aperture; later,
    distant islands were believed to be in nether-land, and spirits of those dying
    naturally went to Avaiki.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that Avaiki and Po are interchangeable and connects Avaiki
    with night, avenging gods, depth, craft, knowledge, and a phrase used of approaching
    death.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Samoan Pulotu or Purotu is described as a heaven supposed to be under the
    sea, while in eastern islands the same word is said to mean the perfection of
    beauty.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: In Samoan death language, men are said to “finish,” spirits of the dead are
    said to go on a journey, great men are said to go to a meeting of chiefs, and
    the heavens or clouds are described as opening to admit such spirits.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Rarotonga, ghosts are said to travel toward Tuoro, a rocky point facing
    the setting sun, halt at a weeping laurel near Nikao, and then climb a branch
    of an ancient hua tree.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Under the hua tree is a circular hollow where Muru spreads a net; if a ghost
    breaks the branch or falls, it is caught, and any ghost escaping Muru is caught
    by Akaanga's concealed net near the reef.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Demons take captive ghosts from the nets, dash out their brains on sharp coral,
    and carry the victims to the shades to eat.
  category: action
  evidence_refs:
  - ev:11
