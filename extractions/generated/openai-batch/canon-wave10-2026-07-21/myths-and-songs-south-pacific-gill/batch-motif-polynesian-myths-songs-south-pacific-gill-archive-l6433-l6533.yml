canonical_text:
  quote: ''
  summary: Ngaroariki, wife of King Ngata of Rarotonga, is repeatedly endangered because
    of her beauty. Four men throw her into a thorn thicket, but Tangaroa sends helpers
    to release her. A sea-borne voice lures her along a dangerous branch path, and
    demons trap her in a net, but Tangaroa tears the net. Later she goes bathing despite
    Ngata's warning about the jealous Moto. Tangaroa sends a bird messenger to warn
    her, but she ignores it; Moto assaults and disfigures her, steals her ornaments
    and clothing, and leaves her in black tapa. Ngaroariki hides in the forest, later
    breaks Ngata's reeds during a contest, is beaten by the unrecognizing king, and
    laments that he has trampled his own wife.
  language: English with Mangaian song/phrases
  quote_policy: summarized
