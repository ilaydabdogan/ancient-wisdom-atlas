canonical_text:
  quote: ''
  summary: A prologue song for Potiki's assumption of temporal sovereignty opens and
    later closes access to Avaiki or spirit-world. Named beings, ghosts, fairies,
    dancers, torch-bearers, and spectators are summoned into a dramatic dance. The
    passage emphasizes drums, cloth-beating, burdens identified as bamboo fishing
    rods, a rope for pulling Tautiti and a drum from Great Spirit-Land, older fêtes
    associated with Terangai, gods descended from Vatea, and Mautara's conquest of
    the island for his descendants.
  language: Mangaian with English translation
  quote_policy: summarized
