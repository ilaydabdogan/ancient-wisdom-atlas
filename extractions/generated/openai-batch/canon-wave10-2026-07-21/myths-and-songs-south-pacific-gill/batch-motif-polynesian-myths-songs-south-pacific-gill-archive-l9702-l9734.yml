canonical_text:
  quote: ''
  summary: A solo and chorus song identifies Buapua-ariki as a descendant of the kings
    of Mauke and a favored one led by a prosperous wind. The song names a movement
    from the root of the skies to these shores, asks the addressed one to turn back
    before a long farewell, calls Mokoaeiau Vaio an idol of the dwelling and asks
    him to remain awhile. The solo describes adornment with scented flower buds and
    leaves from Tutuila, then announces departure; the chorus says the garments are
    mourning weeds and flowers.
  language: Mangaian with English translation
  quote_policy: summarized
