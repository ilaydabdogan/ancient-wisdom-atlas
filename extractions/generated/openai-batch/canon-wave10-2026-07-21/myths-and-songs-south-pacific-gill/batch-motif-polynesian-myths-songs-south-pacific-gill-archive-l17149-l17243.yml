  summary: The passage describes a Hervey Group system of named winds and horizon
    wind-holes used for fishing and sea voyages. Raka, god of winds, and his children
    are said to blow through these holes. The sky is modeled as a calabash with plugged
    apertures, which a chief priest ritually manipulates to alter the wind. The passage
    also describes a twisted banana core as a warning sign of an approaching cyclone.
