canonical_text:
  quote: ''
  summary: Maui remedies the problem of the sun setting too quickly by plaiting six
    coconut-fibre ropes, placing nooses along the Sun-god Ra’s path from Avaiki into
    the heavens, catching him, and forcing him to travel more slowly so human work
    can be completed. The passage also explains the visible ropes as an interpretation
    of sun rays and comments on the name Ra and solar royal language.
  language: English
