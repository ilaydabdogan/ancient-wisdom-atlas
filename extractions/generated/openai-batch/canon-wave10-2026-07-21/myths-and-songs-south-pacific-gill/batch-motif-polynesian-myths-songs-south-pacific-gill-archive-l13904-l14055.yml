canonical_text:
  quote: ''
  summary: The passage includes a note on Mautara's name, a dance-song concerning
    sacred kava associated with Miru, Tane, priests, and the destruction of souls,
    prose notes on Tapairu fairies and their protection of a seaside king, and an
    account of Ngaru learning ball-throwing from nether-world fairies, discovering
    sky fairies, defeating both groups, and introducing the game to this world. A
    closing song fragment mentions a person bound to a land of darkness, devoured
    by assembled gods, and saved by friendly Tapairu on the road.
