canonical_text:
  quote: ''
  summary: Ina, daughter of wealthy parents in Nukutere, is left to air family treasures
    under conditions meant to prevent the thief Ngana from stealing them. Ngana obscures
    the sun by incantation, deceives Ina into letting him wear the ornaments, and
    escapes with them. Ina is punished by her parents until a divine spirit speaks
    through her, declaring her person sacred and announcing departure to the Sacred
    Isle for Tinirau. Ina flees, silences her elder brother by cutting his tongue
    tip, reaches the shore, looks toward the Sacred Isle near the setting sun, and
    addresses a small fish subject to Tinirau.
  language: English with Mangaian verse fragments
  quote_policy: summarized
