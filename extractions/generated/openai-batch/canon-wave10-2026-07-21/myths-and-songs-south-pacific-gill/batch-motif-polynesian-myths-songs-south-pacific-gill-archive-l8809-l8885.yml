canonical_text:
  quote: ''
  summary: A closing day-song for Tenio's fete calls the dance as day breaks and Tautiti's
    visit ends. The song describes Veetini as death-marked, with broken teeth and
    ashamed to remain in the light, and invokes the opening eye of day, Vatea's burning-torch
    eye, and the rising Sun. Explanatory notes link the song to Tiki's journey with
    her parents in search of Veetini, to Tautiti's return to the shades after the
    dance, and to Veetini's spirit revisiting this world to institute food offerings
    for the dead.
  language: Mangaian with English translation and English explanatory prose
  quote_policy: summarized
