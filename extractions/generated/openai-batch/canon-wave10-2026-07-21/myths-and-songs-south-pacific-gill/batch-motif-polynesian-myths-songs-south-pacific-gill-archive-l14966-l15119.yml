canonical_text:
  quote: ''
  summary: A dirge attributed to the father Koroneu laments a dead child, later identified
    in the prose note as Atiroa. The dirge declares the child dead through the image
    of a lost canoe, rebukes and curses gods and the priest Pangeivi, mourns the beloved
    first-born with the parents and mother, invokes the Fairy of the Axe to open the
    secret road to spirit-land, asks that Vatea be compelled to give up the dead,
    and calls on Tiki for ghost-like puffs accompanied by pretended explosions.
  language: Mangaian with English translation
  quote_policy: summarized
