canonical_text:
  quote: ''
  summary: A ball-throwing song opens with a request for balls. The chorus says the
    art was taught by the gods Teiiri and Teraranga, describes laurel chaplets and
    scarlet fruits used as balls, and names fairy women from spirit-world and sky
    who come to dance and play at Kaputai. Ina is singled out as a skilled player,
    a sky-dweller, and wife of Full-Moon. The game ends with Ina keeping seven or
    eight balls in motion and Matonga being beaten after a ball falls.
  language: English with Mangaian verse
