canonical_text:
  quote: ''
  summary: 'An expository linguistic passage explains several Hervey Group and Mangaian
    plural forms derived from nouns meaning house, canoe, enclosure, shelf, leaf,
    and shadow. The passage develops religious imagery for the leaf and shadow plurals:
    worshippers are likened to leaves on a vast divine tree, and people of God are
    described as sitting under divine shade, with older associations to trees overshadowing
    a marae and idol groves.'
  language: English with Polynesian lexical examples
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that nearly all plurals in use in the Hervey Group have
    definite meanings as nouns.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The plural form "are" is explained as meaning "house" and as functioning like
    "a-house-full-of" in examples for gods and valuable things.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The plural form "vaka" is explained as meaning "canoe" and as functioning
    like "a-canoe-full-of" in examples for angels and warriors.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The plural form "pa" is explained as meaning "enclosure" or "door" and is
    used for a pig enclosure, a range of mountains enclosing a valley, and a group
    of islands marking off part of the ocean.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The plural form "ata" is explained as a shelf for food and is used in examples
    meaning a number of doors and a number of food-baskets.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: The plural form "rau" is explained as meaning "leaf"; the passage maps a vast
    tree to a god as trunk, lesser divinities as branches, and worshippers as leaves.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The leaves that represent worshippers are described as dropping off by death
    and being renewed by fresh births.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The plural form "maru" is explained as meaning shadow or shade; the phrase
    for people of God is glossed as people sitting under God's shadow, with an older
    image of an ancient tree overshadowing a marae filled with worshippers.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says noble shade trees were planted in idol groves and that not
    a twig of such trees might be plucked.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage compares Mangaian "maru" with Tahitian or Eastern island plural
    forms where the "r" is dropped, and says the full form "maru" is dignified when
    gods and chiefs are spoken of.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note compares Aitutakian "te taru ariki" with Mangaian "te rau ariki" for
    chiefs or kings, and the passage separately discusses "anau" as family rather
    than a plural and notes polite third-person address in Mangaian.
  category: speech
  evidence_refs:
  - ev:7
