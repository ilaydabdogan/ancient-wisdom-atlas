canonical_text:
  quote: ''
  summary: A crashing-dirge for Ruru presents his spirit as fetched by lightning and
    saluted by thunder, invokes Rongo to open the horizon toward spirit-land, surrounds
    the dead with warlike divine imagery and devouring insects, and contrasts Miru's
    cruel domain with the warrior paradise Tiairi. The passage also recalls named
    warriors, a sacred place associated with Rongo and fairies, and ends with a fragment
    involving Ina the moon-goddess, stolen fruits, and a Robber-crab.
  language: Mangaian text with English translation
  quote_policy: summarized
