canonical_text:
  quote: ''
  summary: 'Ngaru returns home after his wife Tongatea has fled because of his appearance.
    Moko prescribes a blanching treatment: Ngaru is buried in a fern-lined hole and
    emerges on the eighth day with dazzling fair skin but bald, after which Tangaroa
    supplies suitable hair. Tongatea later sees the transformed Ngaru at a reed-throwing
    match, repents, is rejected by him, and dies by poison. In Avaiki, the she-demon
    Miru plots to destroy Ngaru in her ever-blazing oven and sends her two daughters
    to lure him to the netherworld by marriage.'
  language: English
  quote_policy: summarized
