  summary: The preface argues that many Mangaian legends show the influence of language,
    but warns against reducing the whole of Mangaian mythology and theology to linguistic
    decay or to any single systematic theory. It presents Gill's book as a useful
    challenge to broad theories of religion and mythology and as a work of interest
    to readers concerned with early human religion, metaphysical ideas, and divine
    witness.
