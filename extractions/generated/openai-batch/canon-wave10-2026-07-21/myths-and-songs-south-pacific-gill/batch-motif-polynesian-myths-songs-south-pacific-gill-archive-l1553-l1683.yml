canonical_text:
  quote: ''
  summary: The passage gives paired “body” and “spirit” island names, then describes
    Mangaia’s emergence into daylight as the center of the universe, with its central
    hill as the center of the heavens. It identifies Vatea/Avatea as father of gods
    and men, contrasts noon daylight with the darkness of Avaiki, names the ocean,
    describes a stone sky-vault raised by Maui after being propped by Ru, and presents
    ten heavens. It also describes Tiki’s hole as a chasm-road to Avaiki used by three
    brother-kings, Rangi, Mokoiro, and Akatauira, and recounts divine offices, offerings,
    and rulership over living and dead.
  language: English
  quote_policy: summarized
