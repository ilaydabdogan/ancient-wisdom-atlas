candidate_motifs:
- id: motif:1
  label: Island and central hill as world center
  taxonomy_refs:
  - world_center
  - cosmic_mountain
  basis: Mangaia becomes the center of the universe, and its central hill Rangimotia
    is glossed as the center of the heavens.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage says hill rather than mountain; the cosmic_mountain reference
    is a close but cautious fit.
- id: motif:2
  label: Divine parent-child lineage
  taxonomy_refs:
  - divine_parent_child
  basis: Vatea is called father of gods and men, the gods are called children of Vatea,
    and the three original tribes are treated as offspring of Rongo.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage mixes divine and genealogical language with ethnographic commentary.
- id: motif:3
  label: Passage between upper world and Nether-world
  taxonomy_refs:
  - afterlife_journey_map
  - ascent
  basis: Tiki’s hole is a named chasm-road to Avaiki through which the three brothers
    descend and ascend at will.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage describes travel by the three brothers, not a complete itinerary
    for souls after death.
- id: motif:4
  label: Raising of the sky-vault
  taxonomy_refs:
  - culture_hero
  - ascent
  basis: The sky-vault is first sustained by Ru’s props and then permanently raised
    by Maui through tremendous exertions.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The available taxonomy has no exact sky-raising category; culture_hero
    is inferred from the cosmic-ordering act.
- id: motif:5
  label: Dual organization of living/dead and upper/lower worlds
  taxonomy_refs:
  - duality
  basis: The passage contrasts Avatea’s daylight with Avaiki’s darkness and later
    says Rongo rules the dead while Motoro rules the living.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: medium
  cautions: The opening BODY/SPIRIT name table may reinforce duality, but its function
    in the surrounding text is not fully explained in this passage.
- id: motif:6
  label: Sacred offices and chiefly legitimacy from divine allocation
  taxonomy_refs:
  - royal_legitimacy
  basis: 'The three brothers are joint kings, and Rongo grants each distinctive authority
    or a sacred object: peace-drum, food authority, and prayers with sway.'
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage also presents the brothers as probable historical chiefs,
    so the mythic and historical registers overlap.
- id: motif:7
  label: First-fruits offering to divine primogeniture
  taxonomy_refs:
  - sacred_exchange
  basis: Tangaroa receives first-fruits from newly planted coconut groves as recognition
