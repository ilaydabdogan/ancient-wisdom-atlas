canonical_text:
  quote: ''
  summary: Ngata recognizes the altered Ngaroariki by her teeth, confronts the sorceress
    Moto, and obtains the return of Ngaroariki's ornaments, clothing, hair, and eyebrows.
    Ngata then attempts to kill Moto by stoning, but she revives and returns to beating
    cloth. He finally stones her, severs her limbs, and buries them in different parts
    of the island, after which Ngaroariki lives peacefully with him.
  language: English
