canonical_text:
  quote: ''
  summary: Vatea sees a beautiful woman in dreams. One account says he clutches and
    detains her as wife; another says he wakes, cannot find her, and searches. He
    infers she may live in a cavern connected to a lower land and may ascend to The-thin-land
    at night. He scatters scraped coconuts into chasms, observes food disappear from
    the cave Taeva-rangi, descends by a wind current, catches the woman, and learns
    she has repeatedly ascended to win him as husband. She identifies herself as Papa,
    daughter of Timatekore and Tamaiti-ngava-ringavari. Papa becomes Vatea’s wife,
    and both ascend through the chasm by an eddy of wind to The-bright-land-of-Vatea.
  language: English
  quote_policy: summarized
