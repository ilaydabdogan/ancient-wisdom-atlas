canonical_text:
  quote: ''
  summary: A grateful white heron summons the birds of Kupolu to build and carry Rata’s
    canoe to his dwelling overnight. Rata names it Taraipo and prepares for a voyage.
    Nganaoa, refused passage, hides in a floating calabash and repeatedly asks to
    come aboard, saying an oracle has warned him to seek his parents in the land of
    Moonlight. Rata finally admits him when he promises to destroy ocean monsters.
    During the voyage Nganaoa spots a huge open clam threatening the canoe.
  language: English with Polynesian song lines and English glosses
  quote_policy: summarized
