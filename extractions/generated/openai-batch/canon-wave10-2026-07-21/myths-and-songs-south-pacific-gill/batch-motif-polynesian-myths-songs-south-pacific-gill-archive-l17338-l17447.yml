canonical_text:
  quote: ''
  summary: The passage describes systems of counting and measuring in Papuan and Eastern
    Polynesian contexts, including finger-and-toe numeration, Hervey Group counting
    by bases four and ten, coconut tallies, measures of length based on the body,
    similarities among numeral terms, the number rau as a frequent number in stories
    and historical battle narration, and phrases for eternity or immeasurable time.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Papuan population described counts by fingers up to five as one hand,
    ten as two hands, twenty as an entire man of fingers and toes, and one hundred
    as five men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Missionaries in the named islands are said to have replaced the local counting
    plan with English multiplication tables and English figures for school, chapter,
    and hymn numbers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hervey Group is described as retaining an original numeration system with
    two bases, four and ten.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Base four is specifically associated with counting cocoa-nuts tied into bunches
    of four called kaviri.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: For numbers beyond the named high units, the passage says speakers heap up
    the highest figures, such as repeated mano and tini, to mean an innumerable quantity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Measures of length include the fathom, half-fathom, span, and finger's length,
    with ten fathoms making one kume.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that primary numerals closely resemble one another across
    Eastern dialects.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The term for five is explained as e rima, or a hand; ten in the Ellice Group
    is said to be katoa, meaning all, referring to all fingers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The number rau, equal to 200 in this passage, is described as a favorite number
    that often occurs in stories of the past.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A battle example is given in which Potai is said to have had a rau, or 200
    warriors, while Potiki, the winner, had 120 warriors.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Eternity is expressed by phrases translated as 200 ages, until covered with
    the moss of unknown ages, and time on and still on.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The word rau is also said to mean leaf or pandanus thatch, and may refer to
    about 200 reeds of thatch needed for one side of a native house.
  category: relationship
  evidence_refs:
  - ev:9
