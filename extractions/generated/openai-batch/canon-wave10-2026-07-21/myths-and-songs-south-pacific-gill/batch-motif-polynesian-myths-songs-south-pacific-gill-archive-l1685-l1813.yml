comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Mangaian Vari as 'Beginning' and Mangaian
    vari vari as muddy with Rarotongan vari meaning mud.
  claim_level: linguistic_similarity
  target: Rarotongan and Mangaian vari-related terms
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is a lexical comparison reported by the source; the excerpt does
    not independently demonstrate historical derivation.
- id: claim:2
  claim: The passage supports comparison with a pre-existent-matter or chaos-ordering
    creation pattern rather than creation from nothing.
  claim_level: same_motif
  target: chaos / pre-existing material creation pattern
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The classification depends partly on the author's interpretive language,
    including the phrase 'chaos of mud.'
- id: claim:3
  claim: The passage contrasts an earlier, more widely diffused worship of named gods
    with later local deification of Tangiia's children.
  claim_level: same_function
  target: earlier wider Polynesian worship system versus local deified-ancestor worship
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the contrast but gives limited evidence for geographic
    spread or historical transmission within this excerpt.
