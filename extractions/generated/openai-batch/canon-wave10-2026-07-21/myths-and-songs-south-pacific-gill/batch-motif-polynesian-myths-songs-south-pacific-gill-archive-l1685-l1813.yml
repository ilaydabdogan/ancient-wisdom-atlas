candidate_motifs:
- id: motif:1
  label: Creation or ordering from pre-existing material
  taxonomy_refs:
  - chaos
  basis: The passage repeatedly says the gods do not create from nothing, raw material
    is presupposed, and the world is imagined as ordered from a prior muddy chaos
    or pre-existing substances.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  confidence: high
  cautions: The word creation is framed through Gill's missionary commentary; the
    passage itself presents both indigenous terms and the author's interpretation.
