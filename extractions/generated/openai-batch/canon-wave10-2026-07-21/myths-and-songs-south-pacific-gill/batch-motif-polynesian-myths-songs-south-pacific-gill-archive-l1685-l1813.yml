canonical_text:
  quote: ''
  summary: 'The passage presents Gill''s account of Mangaian ideas about divine origins
    and creation: gods do not create from nothing but work from pre-existing material;
    Vari, the Great Mother and Beginning, is the originator of gods and remotely of
    humans; Vatea is her self-made son, associated with the sun and ocean; the earth
    is drawn up from the shades and the heavens are built from pre-existing azure
    stone. The passage also includes lexical notes on Vari, mud, budding, and making,
    and begins a narrative of the Tahitian brothers Tangiia and Tutapu quarrelling
    over a sister''s bread-fruit tree.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the worship of Tangaroa, Rongo, Tane, and possibly the Lizard
    god of Tongaiti represented an earlier and more widely diffused system than the
    later deification of the children of Tangiia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, in the described Mangaian system, divine making presupposes
    raw material and is not creation of a universe out of nothing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage gives a sequence for spiritual existence: first a point, then
    something pulsating, then something greater and everlasting.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vari is described as the Great Mother, Beginning, and Originator of all things;
    she is female, the original of all gods, and remotely the original of mankind.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Vari is said to arrange lands in Avaiki and apportion functions of air, earth,
    and sea; the ninth night of every moon is sacred to her; she is unable to speak,
    lives in darkness, and has the society of an affectionate daughter.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vatea, also called Avatea or Bright Noon, is described as Vari's self-made
    rather than born son; one of his eyes is the sun, and the ocean is his.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Vatea's children are described as great gods who direct the universe and receive
    maraes, idols, offerings of food, and prayers from mortals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says deified heroes of antiquity are associated with the original
    gods and are not inferior to them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Birds, fish, reptiles, insects, and specially inspired priests are described
    as incarnations, mouth-pieces, or messengers of the gods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The gods are said to have distinct functions, and their quarrels are said
    to be reflected in human wars.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says none of the gods create in the proper sense; Vari comes nearest
    to a creator but makes a child from a bit of her own body and is dependent on
    three prior formless existences.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The earth is described as not made but dragged up from the shades, and as
    the outward form of an invisible essence still there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At least ten heavens are described as built one above another from pre-existing
    azure stone, with apertures for communication and correspondence to different
