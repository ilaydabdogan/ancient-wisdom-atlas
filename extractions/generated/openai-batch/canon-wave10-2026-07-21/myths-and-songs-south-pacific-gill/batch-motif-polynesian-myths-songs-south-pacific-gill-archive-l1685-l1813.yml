  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage explains Vari as meaning Beginning in Mangaian; it notes a Rarotongan
    meaning of mud and a Mangaian reduplicate meaning muddy, and reports an inference
    of a world once conceived as a chaos of mud from which Vari evolved order.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The expression pua ua mai is glossed as budding forth or blossoming like a
