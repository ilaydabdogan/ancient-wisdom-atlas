canonical_text:
  quote: ''
  summary: Tinirau, king of fish, repeatedly leaves at night and returns with fragrant
    pandanus necklaces. His son Koro secretly observes him prepare grated coconut,
    travel to the sea, scatter the food on the waters, and chant an incantation that
    summons fish and the Sacred Isle. The fish subjects partially take human form
    and dance the Tautiti with Tinirau, who is half man and half fish. Koro memorizes
    the invocation and later continues watching to perfect it.
  language: English
  quote_policy: summarized
