canonical_text:
  quote: ''
  summary: A soloist and chorus address Vera, whose feet are caught in vines, and
    ask whether Vera is bound for Vavau, described as the home of ghosts. The song
    traces a route over foaming billows, through pandanus groves and thickets, to
    shore and beach places associated with disembodied spirits, royal Utakea's landing,
    and wandering spirits of the dead. A cricket-god directs the path. Vera is told
    to bathe, a new life is requested from the Light of the morning, and friends prepare
    to depart wearing mourning weeds and flowers.
  language: Mangaian with English translation
  quote_policy: summarized
