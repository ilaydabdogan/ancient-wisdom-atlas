canonical_text:
  quote: ''
  summary: Kui-the-Blind discovers missing yams and water, tries to catch the unseen
    taker with a great fish-hook, and recognizes him as her grandson Tane after he
    allows himself to be caught. Later Tane asks for water, is warned that the only
    water is in nuts on a guarded sky-reaching coconut tree, climbs the tree, kills
    its lizard, centipede, beetle, and mantis guardians, and plucks coconut nuts.
  language: English with a short Mangaian chant
