canonical_text:
  quote: ''
  summary: The passage presents an elegiac song composed in memory of Vaiana by her
    husband Naupata. The song asks where she has gone and answers that she has sped
    to Avaiki, beyond the horizon where the sun drops. The speaker and chorus weep
    for the lost wife, say she will not return, plead for her to come back to this
    world and to the speaker's embrace, and compare her to a bough wrenched off by
    a blast. A second quoted chant by Rakoia mourns his first-born Enuataurere, accidentally
    drowned at Tamarua, and imagines Enuataurere moving over the ruddy ocean and the
    foaming crest of the billow.
  language: Mangaian with English translation and English prose note
  quote_policy: summarized
