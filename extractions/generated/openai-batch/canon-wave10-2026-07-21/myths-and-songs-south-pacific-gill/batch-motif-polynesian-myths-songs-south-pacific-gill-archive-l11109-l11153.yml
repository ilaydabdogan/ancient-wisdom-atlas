canonical_text:
  quote: ''
  summary: A lament describes Pukukare suffering a wasting sickness, sleepless nights,
    coughing, pain, and breathlessness. Pukukare tells his mother that he is leaving
    her and will rest in the spirit-world. The speaker condemns the god Turanga as
    bad and as devouring the child, expresses disgust with the mother's god, and wishes
    for another divine helper to hear the story of the disease.
