canonical_text:
  quote: ''
  summary: 'The passage describes Mangaian ideas about postmortem fates: fortunate
    warrior spirits enjoy dances above, less fortunate spirits suffer in Avaiki, some
    warrior ghosts await ascent, natural-death spirits are linked with darkness and
    Miru, and Motoro-associated whirlpools contain deceptive spirit-trap houses. It
    also records sayings about the bua tree and linguistic remarks connecting Avaiki,
    Savaiki, Hawai''i, and Savai''i.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fortunate spirits are described as laughing, dancing old war-dances, enjoying
    themselves, and looking down on less fortunate spirits in Avaiki.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Unhappy spirits in Avaiki are described as covered with dung and vainly flapping
    wings while trying to escape Akaanga's net.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator says this belief bred contempt for violent death, and that aged
    warriors sought the battlefield in hope of a soldier's paradise.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: A song is said to place ghosts of warriors of Tane at Maungaroa and Maputu,
    awaiting the appointed period to ascend to Speck-land.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person recovering from severe illness may say that they set foot on a branch
    of the bua tree and were sent back to life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Those dying a natural death are said to go to night or darkness and to be
