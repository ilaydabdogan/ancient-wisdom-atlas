    eddy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The whirlpool place is described as an entrance to the shades, chiefly for
    worshippers of Motoro.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: A destined traveller sees in sleep a pole-raised house above restless waters,
