canonical_text:
  quote: ''
  summary: The passage first closes a prior Aitutakian item by referring to first
    settlers from Avaiki/Savai'i moving from the sun-setting direction to a land of
    light and by reporting priests' statement to Papehia that Te-erui was the first
    man. It then begins the Aitutakian legend of Rata, a chief in Kupolu who seeks
    timber for a double canoe. Near a mountain stream and pandanus tree, a white heron
    and a spotted sea-serpent fight after the serpent pursues the bird in revenge.
    Rata ignores the heron's pleas and its warning that his canoe cannot be finished
    without its aid. The felled timber is twice mysteriously restored to standing
    trees. Rata then understands the warning, kills the sea-serpent with his axe,
    saves the exhausted heron, and fells timber again.
  language: English
  quote_policy: summarized
