canonical_text:
  quote: ''
  summary: A prose note and translated song recount the night killing of Mourua, also
    called Kavoro, at a beach fishing hut; his wife Turuare tries to shield him and
    is injured. Wife, son, and helpers hide the body at Imogo under a stone, later
    disinter it, re-anoint and rewrap it, and finally deposit it in the chasm Raupa
    to keep it from enemies. A son dreams that Mourua reproaches his relatives because
    former victims at Raupa beat his bones.
  language: English with Mangaian song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mourua, also called Kavoro, was slain at night while Turuare and her little
    son Taingarue were with him in a fishing hut on the beach.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turuare stripped off her own clothing to break the force of blows aimed at
    Mourua; Mourua fell and Turuare's arm was broken.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Taingarue was feared to be in danger of being struck but escaped unhurt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After Potai's party withdrew, Mourua's elder son came to Turuare and helped
    carry Mourua's body by a circuitous route to the gorge Imogo; friends later arrived
    from the interior.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A grave was dug with iron-wood spades; Mourua's body was wrapped in native
    cloth, laid in the grave, and covered with a large stone rather than filled in
