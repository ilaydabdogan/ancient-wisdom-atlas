  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mourua's family disinterred the decayed body, re-anointed it with fragrant
    oil, and re-clothed it in fine white cloth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The body was carried across the island to Tamarua and thrown down the deep
    gloomy chasm called Raupa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: One of Mourua's sons dreamed that Mourua reproached his relatives for bad
