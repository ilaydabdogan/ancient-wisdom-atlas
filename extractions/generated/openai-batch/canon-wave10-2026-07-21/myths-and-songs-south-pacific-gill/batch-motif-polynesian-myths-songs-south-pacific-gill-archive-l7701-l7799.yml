canonical_text:
  quote: ''
  summary: 'The passage describes Mangaian accounts of postmortem fates. Spirits of
    those who die naturally are caught, stupefied with kava, cooked, eaten by Miru
    and her household, and annihilated. Warriors slain in battle follow different
    routes: they linger near the death site, may be heard as crickets, may be gathered
    by the first slain and swallowed by Rongo before rising to the sky, or may ascend
    a suddenly appearing mountain over the weapons that killed them and leap into
    the expanse, becoming clouds and immortal sky-dwellers adorned with flower garlands.'
  language: English
  quote_policy: summarized
