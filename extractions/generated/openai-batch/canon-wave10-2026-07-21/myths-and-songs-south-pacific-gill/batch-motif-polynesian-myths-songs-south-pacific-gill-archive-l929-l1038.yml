canonical_text:
  quote: ''
  summary: The passage describes Vari-ma-te-takere, the Great Mother, producing several
    divine children from pieces of her own sides, assigning them domains, and later
    rearranging the cosmic order so Vatea's land stands above those of his younger
    brothers. It details Tinirau's fish form and sea domain, Raka's wind basket and
    storm-children, Tu-metua's residence with Vari in the mute land at the bottom
    of Avaiki, regional references to Tu, and explicit editorial comparisons to a
    fish-god image and to Aeolus.
  language: English with Mangaian and other Polynesian names
  quote_policy: summarized
