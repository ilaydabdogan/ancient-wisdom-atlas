canonical_text:
  quote: ''
  summary: Maui learns from Ina that his grandfather Tangaroa-of-the-tattooed-face
    is lord of fire. Warned of a death-road and a safe road, Maui chooses the dangerous
    path, confronts Tangaroa, repeatedly extinguishes firebrands, forces the disclosure
    of fire-making by friction, injures a tern helper, tricks Tangaroa into flight
    with a rainbow girdle, kills him by pulling him down, later conceals the killing
    from his parents, and finally revives Tangaroa from his bones inside a cocoa-nut
    shell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ina, once called the-Blind, instructs Maui about things in her territory,
    including four kinds of nono, cocoa-nuts, and taro in Avaiki.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maui asks who is lord of fire, and Ina identifies Tangaroa-tui-mata, or Tangaroa-of-the-tattooed-face,
    as Maui's grandfather.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Ina warns Maui that Tangaroa is irritable and describes two roads to his
    dwelling: a path of death and a common or safe road; Maui chooses the path of
    death.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tangaroa raises his right hand and then his right foot to kill Maui, while
    Maui raises his own right hand and right foot in response.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Maui names himself as Maui the Younger and says he came for fire, Tangaroa
    recognizes him as his grandson and gives him a lighted stick.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maui repeatedly extinguishes the lighted stick in water; after the fourth
    repetition the firebrands are gone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tangaroa uses two dry sticks to produce fire by rubbing them together; Maui
    first holds the lower stick and then blows away the igniting dust.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tangaroa summons a kakaia, or tern, to hold the lower fire-stick; fire is
    obtained, and Maui snatches the burning upper stick from Tangaroa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Maui burns either side of the tern's eye, and the passage explains the bird's
    black eye-marks as the result of this act.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maui proposes that he and Tangaroa fly up to daylight through the hole by
    which the bird escaped, and Maui demonstrates flight like a bird.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tangaroa puts on his glorious girdle, called the rainbow by mortals, rises
    above the loftiest cocoa-nut tree, and falls to his death when Maui pulls one
    end of the girdle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Maui returns to his parents in nether-land, reports that he has obtained the
    secret of fire, conceals that he killed Tangaroa, and delays their planned visit.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Maui later finds Tangaroa's decomposed body, collects the bones into a cocoa-nut
    shell, shakes the shell, finds Tangaroa alive again, and washes, anoints, and
    feeds him.
  category: sequence
  evidence_refs:
  - ev:8
