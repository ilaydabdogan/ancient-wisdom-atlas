canonical_text:
  quote: "“Thus death entered into the world (Mangaia).”"
  summary: The passage describes an early age under Rangi when death and suffering
    were absent, then tells how the spirit-land warrior Tukaitaua killed Matoetoea,
    Ngake, and Akuru in one night. Rangi descends to Avaiki to consult Rongo, who
    identifies the murderer and later sends Tutavake to punish him, giving instructions
    to attack when Tukaitaua’s strength is lowest at midday.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: During the earlier part of Rangi’s reign, people grew old, but death, war,
    famine, sickness, and pain had not appeared.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Matoetoea is described as a famous man whom many tried unsuccessfully to kill;
    attackers would tremble and drop their weapons when they raised their arms against
    him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tukaitaua lived in Avaiki, was ready to perform Rongo’s commands, and came
    up to the upper world to seek Matoetoea after hearing of his power.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tukaitaua killed Matoetoea, Ngake, and Akuru successively on one night, one
    from each of the three primitive tribes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that death entered Mangaia through these killings and identifies
    Matoetoea as the first to die a violent death, while Veetini is named as a later
    first natural death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rangi grieved over the violent breach in his peaceful domain, searched unsuccessfully
    for the murderer, and descended to Avaiki to visit his grandfather Rongo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Rongo’s presence, Rangi saw Matoetoea with head and face covered in blood
    and asked who had murdered him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rongo identified the murderer by asking whether Rangi had seen a new face
    in the upper world and then saying that this new face was the murderer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rongo told Rangi that he could not conquer Tukaitaua and promised to send
    someone to punish him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rongo summoned Tutavake, another brave in spirit-land and cousin to Tukaitaua,
    and ordered him to go to daylight and slay Tukaitaua.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Rongo instructed Tutavake to search Mangaia, climb the hills if necessary,
    and attack at midday, because Tukaitaua’s strength was lowest when the sun’s rays
    were vertical and highest or increasing when shadows were long.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Tutavake obeyed and came up to daylight.
  category: action
  evidence_refs:
  - ev:9
