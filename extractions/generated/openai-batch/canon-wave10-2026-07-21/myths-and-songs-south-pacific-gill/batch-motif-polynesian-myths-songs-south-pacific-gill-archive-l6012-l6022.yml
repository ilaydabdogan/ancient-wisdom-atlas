  quote: THE    ORIGIN    OF    KITE-FLYING.
  summary: Tane challenges Rongo to kite-flying in the shades. Rongo, Tane's elder
    brother, defeats him after secretly preparing abundant string. From this first
    kite-flying, mortals acquire the pastime, with the condition that the first kite
    to rise in each game is sacred to and named for Rongo, patron of the art.
