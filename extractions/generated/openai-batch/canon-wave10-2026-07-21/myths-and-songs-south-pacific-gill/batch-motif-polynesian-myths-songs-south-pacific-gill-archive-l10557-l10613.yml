canonical_text:
  quote: ''
  summary: The passage addresses a deceased figure buried at an ancestral marae on
    steep Maungaroa, hidden by tall fern. The speaker imagines the spirit revisiting
    the spot and hovering among wild rocks, and says the figure is wooed by a Shadow
    in a mountain dream. A following section says the figure's western house at Kauava
    has decayed. Footnotes explain hopes that the figure's beauty may cause dread
    Miru to adopt her as a daughter-in-law rather than consume her, and describe Kauava
    as a sea-side cave where ghosts gathered and where a house had been made for this
    distinguished spirit.
  language: English with Mangaian verse excerpt
