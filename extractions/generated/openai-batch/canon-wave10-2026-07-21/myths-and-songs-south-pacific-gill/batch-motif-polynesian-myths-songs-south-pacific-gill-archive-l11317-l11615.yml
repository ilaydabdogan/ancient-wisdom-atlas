canonical_text:
  quote: ''
  summary: A bilingual song introduction for Riuvaka's fete invokes Tane of Avaiki/the
    shades, explains offerings to the dead through a returned boy, names Papa as Tane's
    mother, describes Tane as connected with soul-devouring, and calls for drum, dance,
    fragrant flowers, and mythic visitors from the shades for the fete nights of Tane
    and Rongo.
  language: Mangaian with English translation
  quote_policy: summarized
