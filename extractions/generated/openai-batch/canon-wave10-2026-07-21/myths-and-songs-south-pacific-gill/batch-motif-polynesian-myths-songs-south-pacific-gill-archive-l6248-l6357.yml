  label: origin of mosquitoes through an introduced remnant
  taxonomy_refs: []
  basis: The passage explains that mosquitoes were unknown in Mangaia until Veve brought
    them from Aitutaki and that current mosquitoes descend from the few that escaped
    her fire.
  evidence_refs:
