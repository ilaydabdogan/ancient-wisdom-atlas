canonical_text:
  quote: ''
  summary: The passage gives a Mangaian explanation for the arrival of mosquitoes
    through Veve of Aitutaki, recounts local practices for repelling them, and then
    explains the sacred central hill Rangimotia through the buried god Te-manava-roa,
    whose body is mapped onto Mangaia's hills and districts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mosquitoes are said to have been unknown in Mangaia until Veve landed from
    Aitutaki with her children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large ear-ornaments were worn in enlarged ear openings, and the ornaments
    could contain fragrant leaves or flowers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Veve filled the hollow of her ear-ornaments with mosquitoes before leaving
    her native island.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Veve left her ear-ornaments on a grassy bank while bathing at a stream and
    later remembered the missing ear-plugs while torch-fishing on the reef.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mosquitoes burst from their confinement, stung two of Veve's children to death,
    and two other children survived by immersing themselves in the nearby stream with
    only mouth and nostrils above water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Veve set fire to her dwelling to exterminate the mosquitoes; most died, but
    a few escaped to nearby rocks, and the present mosquitoes are said to descend
    from that remnant.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A fete song attributed to Tenio refers to lost ear-ornaments at Vaikaute,
    humming mosquitoes bursting them open, and children being stung to death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage describes keeping a smouldering dry iron-wood log outside houses
    so smoke will drive away mosquitoes, and wrapping the head and face while sleeping.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A person troubled by mosquitoes may light a torch, wait for mosquitoes to
    gather around it, carry it outside, quench it, and return indoors while closing
    the door.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Rangimotia is described as a central hill in Mangaia called Centre-of-the-heavens,
    from which lesser hills branch out.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Rangimotia was considered very sacred, and kings formerly adjusted a sacred
    girdle there on warriors sent on secret murdering expeditions in the name of Rongo
    under the condition 'succeed or die.'
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Uarau resolved to hold a feast on Rangimotia; leading men believed this impiety
    would anger the gods and deprived him of his chieftainship.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The god Te-manava-roa, or The-long-lived, is said to lie buried face down
    at Rangimotia, with parts of the hill and hill-ranges identified as his back,
    head, neck, arms, and legs.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The body-part hills of Te-manava-roa mark districts, and Mangaia's southern
    half is called the right side, the northern half the left side, and the eastern
    part the head.
  category: relationship
  evidence_refs:
  - ev:14
