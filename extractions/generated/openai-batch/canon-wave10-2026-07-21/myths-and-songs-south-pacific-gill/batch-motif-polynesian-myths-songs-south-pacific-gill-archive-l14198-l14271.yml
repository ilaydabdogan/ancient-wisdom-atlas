canonical_text:
  quote: '"he was eaten-up by the gods."'
  summary: 'The passage describes Mangaian death-talks: formal night gatherings of
    songs and weeping held in honor of the dead, especially distinguished persons.
    It explains the order of tangi and tiau songs, the roles of relatives, soloist
    and chorus, the use of instruments, preparations, repetitions, and named examples
    of death-talk song cycles.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Ghost-fighting occurred immediately after death, while the dirge-proper occurred
    months later; death-talks could be grand tribal gatherings for songs in honor
    of the illustrious dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A death-talk was called e tara kakai, glossed as a talk about devouring, and
    the passage says that when someone died it was customary to say the person was
    eaten up by the gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A death-talk took place at night in large houses built for the purpose and
    lighted with torches; the passage contrasts this with the festive kapa dance performed
    under long booths.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: As many as thirty tangi, or weeping songs, could be prepared, each supplemented
    by a tiau or pe'e proper, for a total of up to sixty songs chanted in honor of
    the dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each adult male relative had to recite a song, either composing it himself
    or paying someone else to provide an appropriate song.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A near relative of the deceased was appointed to start the first tangi, and
    the chorus continued the song at proper pauses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the tangi, weeping was reserved for the close, when the whole assembly
    gave passionate cries and tears; such a song began with the words translated as
    'Sing we.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the tiau or pe'e proper, the chief mourner was the soloist; when the assembly
    took up the strain, the soloist wept loudly until resuming his part softly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The performance used the great wooden drum called the awakener, the harmonicon,
    and sometimes the pau; instruments were used between songs, and the great drum
    accompanied the grand chorus in showery songs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: For crying songs, the passage identifies the passionate weeping of all present
    as the true accompaniment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Several months of preparation could be required, including songs, dresses,
    complexions, and food for guests.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: If another person of consequence in the same clan died or was slain within
    a year or two, the earlier performance might be repeated with some new songs and
    called e veru, or second-hand.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage names death-talk song groupings associated with Vera, Puvai, Mourua,
    Vaepae, and Arokapiti, and says Christianity put an end to this form of poetry.
  category: other
  evidence_refs:
  - ev:8
