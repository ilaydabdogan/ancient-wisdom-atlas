  summary: The passage describes Iva as a pleasant afterlife land guarded by a benevolent
    being, where fortunate spirits eat abundant food and chew sugar-cane. Tekauae
    warns living people to avoid Miru by placing coconut kernel and sugar-cane near
    the stomach at death, so departing spirits may go to Iva instead. A following
    heading identifies Miru as mistress of the spirit-world.
