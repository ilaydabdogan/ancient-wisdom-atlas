canonical_text:
  quote: ''
  summary: The passage recounts events after the battle at Teopu during Kirikovi’s
    chieftainship. Arauru is lured from the cave Erue by his cousin Toe and killed
    for an offering to Rongo connected with the drum and prayers of peace, but Uanuku
    protests and Arauru’s body is thrown into a chasm. Maruata is then enticed from
    the same cave and killed as an acceptable victim; the ceremonies are completed
    and Kirikovi is installed paramount chief. The passage adds later notes about
    Maruata’s wife, Toe’s later sacrifice, the worship of the lizard-god Teipe by
    Arauru, Maruata, and Toe, and a heading for a crying song for Maruata by Koroa.
  language: English
  quote_policy: summarized
