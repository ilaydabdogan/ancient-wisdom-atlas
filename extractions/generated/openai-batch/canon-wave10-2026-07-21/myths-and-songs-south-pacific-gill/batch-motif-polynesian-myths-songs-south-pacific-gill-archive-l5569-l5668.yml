canonical_text:
  quote: ''
  summary: Tane uses a lofty coconut tree to send nuts toward his home, then uses
    two remaining small nuts to strike Kui's eyes, painfully restoring her sight.
    Kui offers her four daughters as possible wives; Tane rejects three and marries
    Ina-who-rivals-the-dawn. After jealousy and quarrelling, Tane makes two closed
    baskets from coconut fronds, fastens them to his arms as wings, and flies back
    to Avaiki. Editorial notes place the story in nether-land and connect some place
    names with Samoa. The next section begins with Rangi, the first man, exploring
    land he had drawn up from the shades, approaching rocks, a gorge, waters, caves,
    and boulders.
  language: English
  quote_policy: summarized
