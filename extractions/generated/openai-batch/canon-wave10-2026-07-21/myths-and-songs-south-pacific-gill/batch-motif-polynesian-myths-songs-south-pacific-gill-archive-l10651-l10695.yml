  summary: The passage places Kavoro's burial at a spirit-dwelling at Imogo, in a
    shaded grove where his grave was dug and the widow grieves. A following section
    states that Kavoro was disinterred from the grave. The prose then describes ghosts
    from a cave departing when the coral tree blossoms, moving from rocks to the reef,
    across the ocean, and disappearing with the sun in the nether-world. The spirits
    avoid a fatal fragrant bua tree but cannot escape Miru, mistress of the shades.
