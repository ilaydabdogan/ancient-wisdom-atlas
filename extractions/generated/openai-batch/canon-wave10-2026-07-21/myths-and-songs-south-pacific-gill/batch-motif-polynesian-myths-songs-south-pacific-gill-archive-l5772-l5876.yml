canonical_text:
  quote: ''
  summary: Tangaroa sees Ina bathing at a stream, descends to earth by means of his
    rainbow girdle, and fathers Tarauri and Turi-the-Bald. The brothers’ divine origin
    is initially hidden. Turi is defeated at reed-throwing by Pinga’s seven dwarf
    sons, while Tarauri is known for wrestling and for a fishing method said to be
    his invention. Pinga recognizes the boys as his grandchildren. In a reed-throwing
    contest, Tarauri invokes Ruanuku and Tangaroa for a reed and victory; a decorated
    reed falls from the sky, revealing Tarauri’s divine parentage, and he invokes
    Tangaroa again before throwing.
  language: English
  quote_policy: summarized
