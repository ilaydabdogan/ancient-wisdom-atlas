canonical_text:
  quote: ''
  summary: A dirge passage presents antiphonal calls in which one half refuses to
    climb and the other invokes named crabs and a mouse to climb and catch. A prose
    note describes two men impersonating mice who climb a fruit-laden pandanus tree,
    squeak, and scatter nuts. Further notes identify the crabs, describe performance
    timing and sponsorship, and state that thunder and lightning accompanied the death
    of the chief Ruru, whose ghost entered the shades after minor gods resolved to
    kill him and major gods did not pity him.
  language: Mangaian with English translation and English prose commentary
  quote_policy: summarized
