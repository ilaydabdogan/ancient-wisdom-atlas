canonical_text:
  quote: ''
  summary: 'The passage explains Matariki, or the Pleiades, as once being a single
    bright star pursued by Tane with Aldebaran and Sirius; after Sirius drains a stream
    that sheltered the fugitive, Tane hurls Aldebaran at it and shatters it into six
    visible bright fragments. A song by Reinga recalls wars of the star-gods. The
    passage also describes Matariki as a seasonal and new-year marker, and gives other
    celestial identifications: sun and moon as the eyes of Vatea, Venus as the eye
    of Tane, rainbow as Tangaroa''s girdle for descent to earth, and the Magellan
    clouds as upper and lower mists.'
  language: English
  quote_policy: summarized
