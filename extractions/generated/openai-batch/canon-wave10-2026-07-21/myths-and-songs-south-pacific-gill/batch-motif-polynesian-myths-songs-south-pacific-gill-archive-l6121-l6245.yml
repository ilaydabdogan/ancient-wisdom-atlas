canonical_text:
  quote: ''
  summary: The passage explains a wandering nocturnal light as Uti's torch. Uti is
    described as a female fairy ruling Manomano in nether-land who climbs up at night
    with a torch in search of food, travels along shore, reef, valleys, ridges, and
    especially a lake, sometimes with daughters, and taught women torch-light fishing
    and related food gathering. Songs invoke Uti's torch against theft by Iro and
    recall torch-fishing taught by Uti.
  language: English with Mangaian song excerpts and English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lone rider on a dark rainy night sees a light like a man carrying a torch,
    chases it, and sees it leave the track and hover over the waters of a nearby lake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the rider returns home, local people jest that Uti had been lighting
    his path with her torch.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Manomano is described as a district in the depths of nether-land and as being
    ruled by the female fairy Uti.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Uti climbs up at night to the upper world carrying a torch and searching for
    food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Uti's torch is said to appear along the reef, rocky shore, damp valleys, mountain
    ridges, and especially near the lake already mentioned.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Uti sometimes moves alone and sometimes with one or more daughters, each daughter
    taking a different route.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Uti first taught women of the upper world to catch sleeping fish by torch-light,
    waylay crabs ashore, and catch shrimps in the lake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A song asks Uti to light her torch, says that taro has been robbed and lands
    are bare, and calls on the children of Vatea to keep watch at night.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The same song says Iro creeps up from below to play pranks from the depths
    inhabited by Tu.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The explanatory prose says the first night of the native calendar was sacred
    to Iro, names him as patron of thieves, and explains that Uti is invoked to light
    taro patches so that thieves would be frightened away.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Vaangaru is said to sing a lament for his dead mother-in-law Anau; the translated
