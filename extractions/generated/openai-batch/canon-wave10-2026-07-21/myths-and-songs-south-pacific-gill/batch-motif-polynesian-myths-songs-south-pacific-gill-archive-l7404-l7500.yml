canonical_text:
  quote: ''
  summary: 'The passage describes Mangaian ideas of Avaiki or spirit-world: its inhabitants
    and contents, roads between worlds, Maui’s descent for fire, Ra’s daily movement
    through the nether-world, Tiki’s closure of a dangerous chasm, and the wandering
    and clothing of dead spirits near the sea.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Avaiki is described as inhabited by major and lesser divinities and their
    dependants, who marry, multiply, quarrel, work, cook, fish, build, and live in
    dwellings like those on earth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some districts of spirit-land are said to be inhabited by cannibals who entrap
    unwary mortals.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birds, fish, rats, insects, trees, and cultivated plants are said to abound
    in Hades for the support or adornment of immortals.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The arts of the visible world are described as copies of what first belonged
    to nether-land and as taught to mankind by the gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fire burns because latent flame was hidden in wood by Mauike in Hades; an
    axe cleaves because its fairy is present; an ironwood club kills because a demon
    from Tonga is enshrined in it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Aremauku, on a cliff over the western ocean, a direct road to spirit-land
    was said to exist, through which communication with Hades was formerly maintained.
  category: setting
  evidence_refs:
  - ev:4
