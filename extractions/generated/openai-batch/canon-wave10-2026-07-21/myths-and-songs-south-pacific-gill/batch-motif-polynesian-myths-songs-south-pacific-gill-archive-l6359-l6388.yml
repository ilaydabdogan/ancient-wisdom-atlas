- id: obs:3
  text: The central part of the fish went to two chiefs of the central portion of
    Mangaia, and the fish was divided along the backbone so the shares would be equal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tail was divided between two remaining chiefs whose homes were at “the
    sun-setting.”
  category: action
  evidence_refs:
