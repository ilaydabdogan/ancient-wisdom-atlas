  quote: ''
  summary: The passage describes an older Mangaian protocol for cutting and presenting
    a large stranded fish to chiefs according to east, center, and west locations,
    followed by subdivision among individuals. It also describes a continuing feast
    etiquette in which the king and six chiefs are named in prescribed island order,
    partly to prevent jealousy.
