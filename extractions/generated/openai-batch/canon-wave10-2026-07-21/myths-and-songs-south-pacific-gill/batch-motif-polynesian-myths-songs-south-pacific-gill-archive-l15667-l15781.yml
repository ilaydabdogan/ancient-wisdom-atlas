canonical_text:
  quote: ''
  summary: 'The passage presents an incantatory song about iron-wood spears, victory,
    former hiding, and expected plenty, followed by a prose account of Mangaian rites
    after battle: a human sacrifice is moved from a wooden altar to Rongo''s shore
    altar, body parts are cut and distributed to authorize chiefs, landholding, and
    offices, and a sacred drum of peace is sounded in procession with royal prayer.'
  language: English
  quote_policy: summarized
