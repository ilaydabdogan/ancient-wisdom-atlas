  text: The opening song directs that an iron-wood tree be felled, divided, and split
    to make spears, and says iron-wood has long supplied death-dealing spears for
    warriors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The song contrasts recent hiding in rocks as conquered people with present
    rejoicing and expected plenty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that lost stanzas related to division of lands, when the
    victim's nose and ears were cut off and formally presented to chiefs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After several days, armed warriors stood before the wooden altar, and the
    praying king used a coconut-fibre scoop-net reserved for such occasions to carry
    the decayed sacrifice to the pebbly beach.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sacrifice was placed on a sandstone block before the national stone idol
