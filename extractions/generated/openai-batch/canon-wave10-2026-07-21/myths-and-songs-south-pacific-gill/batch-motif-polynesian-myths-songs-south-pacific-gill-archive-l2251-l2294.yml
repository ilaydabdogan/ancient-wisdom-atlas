canonical_text:
  quote: ''
  summary: The passage explains that the gods first communicated with humans through
    small land birds, but because those utterances were unclear, a human priesthood
    was established. Priests were treated as temporary embodiments or containers of
    the gods, consulted with offerings of choice food and intoxicating drink, and
    delivered frenzied oracles intelligible only to initiates. Birds nevertheless
    remained divine messengers and tribal guardians. The passage also describes priestly
    power to declare divine will concerning illness, punishment, or altar offering,
    and identifies Motoro's priestly mouthpieces, the Amama, as politically dominant.
  language: English
  quote_policy: summarized
