  quote: ''
  summary: A choral finale describes light rising from the spirit-world where Rongo
    reigns, a night sky with stars and full moon, appeals for sleepers to awaken,
    Tane opening his brilliant right eye, divine offspring of Vatea laughing, dawn
    arriving, and Tiki's fete ending. Editorial notes explain masked warning birds
    as incarnations of Tane, identify Tane's right eye as Venus, and identify Tavare
    as a legendary winter sleeper.
