canonical_text:
  quote: ''
  summary: The passage introduces Tane as a principal Mangaian god and recounts the
    beginning of a myth in which Ako fetches Tane from Avaiki to help court Tekura-i-Tanoa.
    Ako and Tane become rival suitors; Tane outwits a garland deception but Tekura
    accepts Ako. Tane then finds his canoe sabotaged, laments his inability to return
    to Avaiki, climbs a giant hua tree, swings into Enuakura, and secretly eats yams
    and drinks water while Kui-the-Blind cooks and eats.
  language: English with Mangaian names and phrases
  quote_policy: summarized
