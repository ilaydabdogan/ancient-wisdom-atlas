  quote: ''
  summary: A dance song for Tenio's fete calls the dance to begin. The singer identifies
    as Tautiti, addresses Tane, claims a fragrant pandanus on the beach, and says
    the tree was first planted by the divine Koro. Tautiti's wreaths and red pandanus
    berries grow in gullies and adorn the dance. A note explains an annual March visit
    of bream called ature to Atua-Koro and connects the fish-name with Ature, Tinirau's
    daughter, as if she and attendants visit her brother Koro.
