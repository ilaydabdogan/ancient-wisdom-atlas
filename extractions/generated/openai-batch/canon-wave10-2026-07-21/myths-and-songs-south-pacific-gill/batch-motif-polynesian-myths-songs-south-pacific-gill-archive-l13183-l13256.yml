canonical_text:
  quote: ''
  summary: A concluding call invokes a ball-throwing game with Kumutonga and Karaia-the-shadow
    from the nether-world. The chorus refers to play in the shades, a brightly plumaged
    bird watching, and invisible quick finger movements. Editorial prose explains
    that Ina and Matonga are sky-fairies skilled at the game but are defeated by Ngaru,
    and that in the conclusion Ngaru succeeds against infernal sirens. The dance imitates
    ball-throwers without balls and includes satirical personification of fairy women.
  language: Mangaian song text with English translation and commentary
  quote_policy: summarized
