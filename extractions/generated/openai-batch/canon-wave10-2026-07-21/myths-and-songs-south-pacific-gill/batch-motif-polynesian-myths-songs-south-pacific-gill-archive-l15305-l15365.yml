canonical_text:
  quote: ''
  summary: The passage describes a battle on Mangaia between Tongan driftaways and
    the earlier inhabitants, who are said to have come from the nether-world. Rangi's
    side defeats the invaders after its fallen ranks are said to be refilled by warriors
    from the shades. The passage then states a doctrine that victory and chieftainship
    require the shedding of blood from the victorious party to secure Rongo's favour,
    notes the union of secular and spiritual sovereignties in Rangi and Tiaio, and
    says peace was secured by the human sacrifice of Vaioeve before the Tongans were
    allowed to settle.
  language: English
  quote_policy: summarized
