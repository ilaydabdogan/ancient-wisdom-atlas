  summary: A song asks why the children of Tarakorekore fled, gives anger over Potiki's
    cooked fish as the cause, and describes the children fleeing forever amid maternal
    mistreatment and threats. Commentary says the lines were composed by Reinga for
    a fête circa 1815, explains a wordplay on Tarakorekore's name, and identifies
    Inseparable and her brother with a double star in Scorpii and the irate parents
    with two bright Scorpii stars.
