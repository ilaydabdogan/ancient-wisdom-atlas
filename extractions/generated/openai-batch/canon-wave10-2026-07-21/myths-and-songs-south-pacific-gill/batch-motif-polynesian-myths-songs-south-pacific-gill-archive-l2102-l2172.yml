canonical_text:
  quote: ''
  summary: A song invokes the sanctity of Motoro and Rongo, sacred water and shore
    places, a landed spirit, sandstone sacred to kings, and Tamatapu in a flooded
    valley. The prose commentary states that many gods were once men whose spirits
    entered animals, insects, and objects; distinguishes greater and lesser gods;
    divides gods into dwellers in day and dwellers in night or Avaiki; describes unseen
    movement, caves, and possession; and adds a note on phallic stones and a grotto
    temple in Tinian.
  language: Mangaian with English translation and English prose commentary
  quote_policy: summarized
