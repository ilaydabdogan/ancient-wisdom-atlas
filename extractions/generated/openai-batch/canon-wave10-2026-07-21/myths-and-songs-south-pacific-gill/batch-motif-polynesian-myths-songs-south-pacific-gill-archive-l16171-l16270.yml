canonical_text:
  quote: ''
  summary: A song section called “First Offshoot” laments Maruata, who is described
    as slain for an altar. The chorus says Ngariki smiled, that many others of Maruata’s
    tribe had similar fates, and that few survived. The text describes slices of Maruata’s
    ears wrapped in green ti leaves as announcing new possessions. Another stanza
    says Maruata’s head or skull, sacred to Rongo, was struck and split in Rongo’s
    name, despite promises made to Maruata/Mai, which were then broken by deceitful
    Ngariki. A following “Second Offshoot” begins with untranslated lines naming Paeru
    and Uarau and again repeats the image of Maruata’s cut ears.
  language: Mangaian and English
  quote_policy: summarized
