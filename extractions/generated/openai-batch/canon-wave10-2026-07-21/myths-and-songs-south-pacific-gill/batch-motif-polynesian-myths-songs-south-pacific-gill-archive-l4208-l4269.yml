canonical_text:
  quote: ''
  summary: Ono, armed with the named iron-wood spade Rua-i-paku given by his father
    Ruatea, goes to fight Vaotere, the demon associated with a dangerous iron-wood
    tree. In the valley of Angaruaau he digs around and cuts the roots until the tap-root
    is reached; Vaotere appears, and Ono splits his skull with the spade-club. Ono
    then removes the roots, described as Vaotere's arms, and cuts the bleeding trunk/body
    into wood for weapons. Chips from the smaller roots become the iron-wood trees
    covering the island, and Vaotere can no longer harm mankind.
  language: English
  quote_policy: summarized
