canonical_text:
  quote: |-
    We are all chosen birds,
    Messengers of Tane, to save you.
  summary: A day song for Maaki's fête presents warning birds with spread wings and
    long dangerous bills. The birds are described as divine or as messengers of Tane
    who come to warn and save. The song addresses the full moon, seeks light for Mangaia
    through a torch and morning star, asks the divine birds where they came from,
    and states that they came from the sunrising through the expanse of heaven. Tangaroa
    is said to listen in the heavens to the whispers of Vatea, while winds and birds
    move across the skies.
  language: Mangaian and English
  quote_policy: quoted
