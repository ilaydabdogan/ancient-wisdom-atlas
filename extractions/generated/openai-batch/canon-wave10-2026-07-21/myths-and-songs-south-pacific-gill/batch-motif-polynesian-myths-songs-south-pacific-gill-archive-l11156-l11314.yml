canonical_text:
  quote: ''
  summary: A bilingual song passage describes Pukukare's worsening illness, attempted
    relief in sacred streams, bodily wasting, and anticipated death. The deceased
    child-spirit is imagined as taking a long flight to Mount Ikurangi, entering the
    presence of Vatea, crossing expanses and ocean-edge places, encountering darkness,
    ghosts, dismal shades, and a great spirit-land where a dreadful oven awaits those
    who pass over the ocean.
  language: Mangaian and English
  quote_policy: summarized
