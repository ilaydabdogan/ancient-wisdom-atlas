canonical_text:
  quote: ''
  summary: The passage explains the origin and classification of the taairangi, or
    porpoise. Vatea, elder brother of Tinirau and lord of the ocean, creates the porpoise
    from a portion of his own body, imitating their great mother Vari-ma-te-takere.
    Tinirau, king of fish on the Sacred Isle, seeks permission to release some fish
    into Vatea’s ocean. Vatea consents only after Tinirau adds part of the Sacred
    Isle to Vatea’s land; the brother gods break off part of the island, and Tinirau
    releases fish into the sea.
  language: English
