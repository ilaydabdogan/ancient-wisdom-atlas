canonical_text:
  quote: ''
  summary: Rangi encounters an unseen voice in the rocks that repeats and mocks his
    words. He enters a narrowing cave or gorge, sees stalactites and stalagmites like
    jaws, and discovers a laughing female fairy who identifies herself as Echo, the
    cave-speaking sprite who inhabited Mangaia's rocks before him. Echo names her
    offspring as earth-diggers found on mountains, later identified with rats, and
    as other beings in valleys, streams, lake waters, gorges, and chasms. Former sages
    distinguish Rangi as first man and king from Echo as first and parent fairy. A
    note adds that Echo receives divine honors in the Marquesas and speaks from rocks
    there.
  language: English
  quote_policy: summarized
