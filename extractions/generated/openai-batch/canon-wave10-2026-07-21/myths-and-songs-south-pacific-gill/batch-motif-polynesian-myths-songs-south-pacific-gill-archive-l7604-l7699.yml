canonical_text:
  quote: ''
  summary: The passage describes Mangaian places where spirits depart for spirit-land,
    especially west-facing reinga vaerua, and gives related routes involving rocks,
    reef edges, the setting sun, a giant bua tree rising from Avaiki, capture in a
    net and freshwater lake, and encounter with Miru. It also notes related westward
    spirit routes in Rarotonga, other islands of the group, and Samoa, and explains
    a doctrine in which a friendly spirit may send a departing soul back to its body.
  language: English
  quote_policy: summarized
