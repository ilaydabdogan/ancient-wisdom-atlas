canonical_text:
  quote: ''
  summary: Ina, daughter of Kui-the-Blind, encounters an enormous eel that changes
    into Tuna, a divine protector of freshwater eels and her lover. Tuna later instructs
    Ina to cut off and bury his head during a flood. From the buried head grow twin
    coconut trees, red and green, associated with Tangaroa and Rongo. The passage
    further describes coconut features and ritual uses of coconut leaves, eel food
    restrictions, priestly associations, and a war idiom comparing human heads to
    Rongo's coconuts.
  language: English
  quote_policy: summarized
