canonical_text:
  quote: ''
  summary: A song section announces a feast for Ura at the entrance to a sad home
    or deep cave. Koroa is said to have commanded and to have heard his boy lament
    that ghosts fought over his food, evil spirits stole it, and Nau-the-Bad blocked
    his approach. The feast is said to be for Ura in his grave, dry like Tiki's. An
    editorial note explains that the translated 'evil spirits' are literally 'bright
    evil spirits,' luminous at night, and contrasts them with human spirits associated
    with descent, caves where bodies were thrown, and eventual departure to the shades.
  language: Mangaian with English translation and English editorial note
  quote_policy: summarized
