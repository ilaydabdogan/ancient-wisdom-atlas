canonical_text:
  quote: it rose and rose in the air until lost in the azure skies
  summary: Tarauri invokes Tangaroa before a reed-throwing trial. The seven dwarf
    sons of Pinga encircle him and obstruct him, but he sends the heaven-sent reed
    through a gap. The reed rises into the sky, remains there eight days, and falls
    at Areuna marae. The passage presents the feat as Tangaroa's aid and as proof
    that Tarauri is patron and chief of reed-players. Editorial notes mention an Ukupolu/Upolu
    placement of the myth, archaic invocations, Areuna as a priestly site, and reed-match
    songs that refer to Tarauri.
  language: English
  quote_policy: quoted
