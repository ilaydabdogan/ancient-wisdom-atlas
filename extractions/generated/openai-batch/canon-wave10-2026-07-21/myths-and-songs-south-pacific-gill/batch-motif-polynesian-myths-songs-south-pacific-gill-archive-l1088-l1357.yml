canonical_text:
  quote: ''
  summary: A dramatic creation song and accompanying prose describe Vari’s narrow
    abode, Kongo’s ascent from the shades, Vatea’s encounter with his wife, Papa’s
    parentage, Vari as originator, wind-borne movement toward the shades, the twin
    sons Rongo and Tangaroa, Tangaroa’s unusual birth variants, other sons of Vatea,
    the island Auau/Mangaia as body and spirit, Tangaroa’s instruction of Rongo in
    agriculture, Rongo’s acquisition of authority, and sacrificial practice.
  language: English with Mangaian song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vari’s home is described as the narrowest of spaces, with knees and chin meeting.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kongo is said to ascend from the shades to the upper world, while Vari is
    noted as never doing so.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vatea first sees his wife in the shades and embraces her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Papa, when asked for her father, names Timatekore; the children of Vari are
    said to have no father, because Vari alone made them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note states that Vari’s children were moulded from bits of Vari’s own body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vari is called the originator of all things and is described as sheltering
    Papa under her wing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The song invokes restrained winds, a gentle breeze associated with Ina, and
    winds to carry Vatea down to the shades.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rongo and Tangaroa are twin children of Vatea and Papa and are described as
    the first beings of perfect human form with no second shape.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tangaroa yields birth precedence to Rongo; one account has Tangaroa emerge
    from a boil on Papa’s arm, while another has him come up through Papa’s head at
    the crown.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tonga-iti’s visible form is identified as white and black spotted lizards,
    and he is worshipped as Mata-rau.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The island Auau, later Mangaia, is described as having an earthly body and
    an ethereal spirit named Akatautika, with the body brought to light and the spirit
    remaining in nether-world obscurity.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Tangaroa teaches Rongo agriculture; Papa’s objection prevents Tangaroa from
    becoming lord of all possessions, and Rongo receives government, feast arrangement,
    the drum of peace, honour, and power.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A human sacrifice is offered to Rongo, and the decayed body is thrown to Papa
    in the shades; a note contrasts Mangaian and Rarotongan sacrificial handling.
  category: action
  evidence_refs:
  - ev:11
