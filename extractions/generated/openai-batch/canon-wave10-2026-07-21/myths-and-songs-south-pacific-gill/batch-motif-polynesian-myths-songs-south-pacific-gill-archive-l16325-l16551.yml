canonical_text:
  quote: Ngutuku is destined for the altar, / As a peace-offering to Kongo.
  summary: A chanted performance describes Ngutuku, also called Vaarire, as doomed,
    attacked at or near a cave stronghold, slain, fastened to a litter, carried in
    procession with dancing, and offered at an altar to Kongo/Rongo. The song also
    recalls his former fishing life and names kin who follow as his body is borne
    to the altar.
  language: English with Mangaian text
  quote_policy: quoted
