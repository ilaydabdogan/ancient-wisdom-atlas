canonical_text:
  quote: ''
  summary: Ngaru is repeatedly drawn in a basket to the paved vault of heaven where
    the sky-demon Amai-te-rangi waits with a chisel and mallet. With Moko’s help,
    lizards distract Amai-te-rangi, allowing Ngaru to seize the weapons, kill him,
    return to earth, and defeat Ina and Matonga at ball-throwing. The passage then
    gives editorial commentary connecting the tale with Miru, the cavernous realm
    of the dead, return to life by cords, the death-oven, heavenly Tapairu ball-players,
    and possible Samoan/Avaiki origins.
  language: English
  quote_policy: summarized
