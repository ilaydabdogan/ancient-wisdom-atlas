canonical_text:
  quote: ''
  summary: Ngaru of Shady-Land, grandson of Moko the Great Lizard, seeks distinction
    by challenging two ocean monsters or sea-gods, Tikokura the storm-wave and Tumuitearetoka
    the shark. With a named surf-board and Moko's warnings from a rock, he evades
    attacks through a tempest for eight days and nights, then throws the board to
    the monsters, who retire. He returns battered; after bathing at a fountain, his
    wife Tongatea sees his darkened skin, reviles him, and leaves.
  language: English
  quote_policy: summarized
