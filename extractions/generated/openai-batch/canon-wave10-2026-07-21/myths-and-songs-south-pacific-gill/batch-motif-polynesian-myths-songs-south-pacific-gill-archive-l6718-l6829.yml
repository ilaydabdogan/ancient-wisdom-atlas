canonical_text:
  quote: ''
  summary: Te-erui, living in darkness in Avaiki, desires to reach a land of light.
    He and his brother Matareka repeatedly build canoes and attempt the voyage, failing
    three times at a region called Glimmering of Light. After a priest-carpenter advises
    changing the mast name to Erect in the Light of Heaven, they succeed, reach the
    land of light, find a half-sunken island, overcome the surrounding sea, elevate
    the island, take possession, and name it Aitu-taki, God-led.
  language: English
  quote_policy: summarized
