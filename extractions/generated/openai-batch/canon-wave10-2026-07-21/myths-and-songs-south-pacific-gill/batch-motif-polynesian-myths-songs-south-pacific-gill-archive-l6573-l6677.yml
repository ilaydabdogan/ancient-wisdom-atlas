canonical_text:
  quote: ''
  summary: The passage gives background on pigs and rats in the Hervey Group, then
    introduces a Rarotongan legend explaining the origin of pigs. In the excerpt,
    the blind father Maaru and his son Kationgia endure famine at Kupolu. Kationgia
    feeds his father the best available food while starving himself. Maaru discovers
    this, reveals food he had hidden under the house posts, shares a feast, and gives
    instructions for how his body should be dragged to Nikao and concealed after his
    death, with return visits after four-day intervals.
  language: English
  quote_policy: summarized
