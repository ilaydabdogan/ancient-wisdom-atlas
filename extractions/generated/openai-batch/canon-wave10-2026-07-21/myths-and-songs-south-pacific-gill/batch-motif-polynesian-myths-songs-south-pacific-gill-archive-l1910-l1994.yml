canonical_text:
  quote: ''
  summary: The passage describes the later worship of Utakea, Kereteki, and Motoro
    as gods on Mangaia; the sacred marae associated with Motoro; Motoro's spirit voyage
    over the sea on hibiscus and possession of Papaaunuku as an oracle; the royal
    and priestly establishment of Motoro's cult alongside Rongo; distinctions between
    Motoro as a living god and other dead gods in relation to sacrifice; a tree-core
    analogy for divinity; and the placement of several national gods as idols in the
    king's god-house.
  language: English
  quote_policy: summarized
