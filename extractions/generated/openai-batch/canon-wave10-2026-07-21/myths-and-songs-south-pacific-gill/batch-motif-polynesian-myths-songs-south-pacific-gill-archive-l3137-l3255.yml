canonical_text:
  quote: ''
  summary: A fire-god song invokes hidden fire in sacred woods, especially the banyan.
    Maui witnesses fire produced by friction, secures the secret, burns Mauike's underworld
    abode, escapes with fire-sticks through a chasm in the red pigeon, and returns
    to the upper world. Flames threaten Mangaia until kings extinguish them. Maui
    later teaches people that fire is hidden in specific woods and can be obtained
    with fire-sticks and the fire-god's song.
  language: English with Mangaian terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The song asks for hidden fire and addresses the banyan tree while calling
    for incantation and prayer to the tree.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fire is produced from fine dust made by rubbing one stick on another; smoke
    appears, then a flame is caught and increased with coconut fibre and bundles of
    sticks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maui secures the fire secret and then sets fire to his fallen adversary's
    abode in the nether-world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fire consumes Mauike and his possessions, and the rocks crack and split
    with the heat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before leaving the land of ghosts, Maui takes two fire-sticks that had belonged
    to Mauike.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The red pigeon called Fearless waits at the bread-fruit tree; Maui restores
    its tail, re-enters it, and the pigeon carries one fire-stick in each claw.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Words learned from Buataranga make the rocks part, allowing Maui to return
    from the shades to the upper world; his mother helps prevent opposition from the
    guardians of the road to the shades.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Flames reach Mangaia through an aperture at Teaoa, and the kings Rangi and
    Mokoiro put out the fire to save the land.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The inhabitants use the conflagration to obtain fire and cook food, but after
    the fire goes out they cannot make new fire because they do not possess the secret.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Maui tells the inhabitants that fire lies hidden in hibiscus, urtica argentea,
    tauinu, and banyan, and that it can be elicited with fire-sticks aided by the
    fire-god's song.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Maui's instruction, dwellers in the upper world use fire-sticks successfully
    and enjoy light and cooked food.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that the primitive fire-making method remains in use, with
    cotton replacing fine coconut fibre, and that the banyan was sacred to the fire-god.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: The place Te-aoa, where the flames are said to have burst through, was formerly
