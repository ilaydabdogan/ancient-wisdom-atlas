canonical_text:
  quote: ''
  summary: Ouri and Oema have two sons, Arii and Tavai. After Oema descends to Hawaii,
    Tavai and Arii seek him. Their mother reveals the secret road to spirit-land and
    a formula; the brothers descend through the opened earth. In the land of Kui-the-Blind
    they steal part of her oven food, evade her fish-hook, rescue Arii when he is
    caught, kill Kui with her own stone axe, destroy her house by fire, and continue
    across the ocean, where a red shark threatens them and Tavai answers by invoking
    kinship.
  language: English
  quote_policy: summarized
