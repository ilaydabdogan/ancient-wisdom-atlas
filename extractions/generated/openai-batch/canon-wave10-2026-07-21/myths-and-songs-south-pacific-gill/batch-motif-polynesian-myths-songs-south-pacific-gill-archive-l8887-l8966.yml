canonical_text:
  quote: "“Why didst thou return to this world?”"
  summary: A song fragment presents Veetini returning to this world and saying he
    came to instruct his father about food offerings for the dead. The prose explanation
    describes funerary offerings of coconuts, water, pudding, and cooked food at graves
    or chasms, including later examples involving Arikikaka's son and Vera. Vera's
    death is also explained as caused by the anger of Motoro after a forest fire affected
    plants described as Motoro's hair.
  language: English with Mangaian lines
