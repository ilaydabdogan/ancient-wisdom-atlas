canonical_text:
  quote: ''
  summary: 'A solo-and-chorus song section recounts violent political transfer: the
    priest of Tane planned an action, Vaekura willed the splitting of Makitaka, bloodshed
    is said to win Mangaia for a new dynasty, an altar-victim is struck with an axe,
    the wounded die, Tane gains victory, chiefs are accused of treachery, Makitaka
    is dispossessed by Ngakiau/Ngaki, Teata is sacrificed on an altar, and Mangaia
    is transferred.'
  language: Mangaian with English translation
  quote_policy: summarized
