  quote: ''
  summary: A solo-and-chorus song addresses a beloved child of Motuone. Motuone is
    described as a weeping mother who asks the child to look back toward the hills
    and mountains of the interior and to come back to the fair vale of Tamarua, the
    place of birth. The figure is said to be about to depart and to skim over the
    crest of the billows. A note states that network was said to be part of the clothing
    of departed spirits.
