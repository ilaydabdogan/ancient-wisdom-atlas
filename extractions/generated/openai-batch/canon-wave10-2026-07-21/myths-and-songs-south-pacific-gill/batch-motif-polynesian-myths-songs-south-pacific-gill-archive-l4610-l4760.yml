canonical_text:
  quote: ''
  summary: Ina arrives at Tinirau’s Sacred Isle, finds fish-filled waters and a great
    drum, and becomes Tinirau’s wife after the drum draws him back. She gives birth
    to Koro and Ature. Her brother Rupe reaches her by entering a linnet, then returns
    with news to their parents; Ina’s mother and Rupe later visit by entering linnets
    and bring gifts. Editorial notes connect the legend with shark-worship and the
    origin of tattooing, while the song says Ina invented tattooing and links tattoo
    lines to fish that bore her to Tinirau.
  language: English with Mangaian song text and English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ina goes ashore at the Sacred Isle, sees salt-water ponds full of fish, enters
    Tinirau’s dwelling, and finds a fish-preserve inside.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ina finds a great wooden drum with beating sticks and beats it; its notes
    fill the land and reach Tinirau at Pa-enua-kore.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tinirau returns to discover who is beating the drum; Ina hides, then beats
    the drum again, after which Tinirau finds her and she becomes his wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Tinirau’s might inspired Ina with a “manu” or strange
    spirit and provided for her safety in voyaging to his home.
  category: attribute
  evidence_refs:
  - ev:2
