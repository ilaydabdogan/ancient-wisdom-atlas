  text: Ina gives birth to a son, Koromau-ariki or Koro, and a daughter, Ature.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rupe, Ina’s younger brother, asks a karau-rau bird to convey him to Ina; he
