canonical_text:
  quote: ''
  summary: A myth attributed to a nearly extinct Tongan tribe explains the origin
    of the sun and moon. Vatea and Tonga-iti dispute the parentage of Papa's first-born
    child; the infant is cut in two. Vatea shapes the upper half into the sun, while
    Tonga-iti later shapes the lower half into the moon, whose paleness is explained
    by drained blood and decomposition. The passage also notes that rival tribes rejected
    the myth because of its genealogy, and gives an explanatory gloss in which Day
    and Night alternately embrace Earth and produce the sun and moon.
  language: English
  quote_policy: summarized
