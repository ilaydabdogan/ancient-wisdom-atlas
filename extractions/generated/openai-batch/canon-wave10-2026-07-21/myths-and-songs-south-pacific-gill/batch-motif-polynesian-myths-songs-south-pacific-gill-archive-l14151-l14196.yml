canonical_text:
  quote: ''
  summary: The passage describes a Mangaian death custom called “ta i te mauri,” or
    ghost-killing. After a death, a swift messenger announces it around the island.
    Relatives bring native cloth to the deceased’s house. The next day young men conduct
    successive mock battles between groups named as ghosts and friends, clashing weapons
    in bloodless combat to drive off malignant spirits. A leader carries a sacred
    coconut leaf like the dead. The combatants return to the corpse, receive a feast,
    and the rite is compared to warfare as “a younger brother of war.”
  language: English
  quote_policy: summarized
