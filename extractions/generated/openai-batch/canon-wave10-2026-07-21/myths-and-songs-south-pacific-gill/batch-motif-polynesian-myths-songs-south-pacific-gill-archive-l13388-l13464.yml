canonical_text:
  quote: ''
  summary: Arii and Tavai are carried by a great red shark to an island and then toward
    spirit-land. Tavai refuses the shark’s repeated request to eat Arii and later
    ransoms Arii with a thousand coconuts. The brothers continue across the ocean,
    reach the farthest limit of spirit-land, seek their dead father Oema, consult
    an old man and a priest, recover Oema’s bones from a foul pit under the charge
    of an old woman, kill several spirit-land figures and burn their dwellings, and
    return to the upper world through a chasm opened by words taught by their mother
    Ouri. An editorial note compares this myth with two other named myths and says
    Kui-the-Blind appears in all three versions.
  language: English
  quote_policy: summarized
