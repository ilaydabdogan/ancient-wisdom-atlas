  summary: A song and accompanying explanatory notes describe Miru of Avaiki, her
    oven in spirit-land, the devouring of those who go down to her, an intoxicating
    draught prepared for victims, and her maternal care for her son Tautiti, including
    journeys to fairy streams for water.
