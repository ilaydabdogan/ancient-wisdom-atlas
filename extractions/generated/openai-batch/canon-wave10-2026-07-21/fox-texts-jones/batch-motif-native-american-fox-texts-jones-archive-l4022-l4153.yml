canonical_text:
  quote: ''
  summary: The excerpt begins with a group asking an old man to restore their dead
    younger brother; when he says the death is too old for him to reverse, they seize
    him, remove and burn his medicine, burn him alive, rebury the younger brother,
    and spare their grandmother after her explanation. The next tale tells of a wife
    who secretly takes the red cloth from her husband's mystic bundle, wears it to
    visit a bear for sexual union, is exposed by her children, and is forced by her
    husband to process and eat the bear after he kills it; she is then clubbed to
    death. The excerpt ends with the opening of a war tale about Apaiyasa and painted
    men carrying medicine in sacred bundles.
  language: English
  quote_policy: summarized
