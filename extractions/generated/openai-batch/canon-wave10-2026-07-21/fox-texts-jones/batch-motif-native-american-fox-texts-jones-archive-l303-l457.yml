canonical_text:
  quote: ''
  summary: The passage first gives pronunciation notes for vowels, diphthongs, final-vowel
    quantity, stress, and acknowledgments. It then begins a historical tale explaining
    how the Red-Earths were besieged because White-Robe continually killed strangers
    and passersby. He is asked to become chief to stop the violence, but continues
    killing and mutilating spared survivors. The violence draws French and Indian
    enemies around the Red-Earths. A remembered child hides in a hollow log while
    enemies pass. The passage also mentions ritual singing and drumming that put foes
    to sleep, a clan-feast action involving an animal skin dipped in water four times,
    the Red-Earths’ name as tied to creation from red earth by the manitou, and a
    note about White-Robe later being burned at the stake and foretelling doom.
  language: English
  quote_policy: summarized
