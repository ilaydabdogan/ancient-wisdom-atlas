canonical_text:
  quote: ''
  summary: An old woman who lives with her daughter, son-in-law, son, and grandchild
    sees her son-in-law naked and decides to kill her daughter. She prepares a grapevine
    swing over the sea, lures the daughter to it, and snaps the vine so the daughter
    falls. A Great Lynx catches the daughter in the sea and claims her as his bride
    despite his kin urging him to release her. The old woman alters her appearance
    to resemble the daughter and returns home, but the child refuses her substitute
    suckling device and the husband discovers a stick at the back of her neck. The
    daughter’s brother kills the old woman, searches the shore, laments for his sister,
    and the waves respond; the Great Lynx agrees only to let the baby suckle.
  language: English
  quote_policy: summarized
