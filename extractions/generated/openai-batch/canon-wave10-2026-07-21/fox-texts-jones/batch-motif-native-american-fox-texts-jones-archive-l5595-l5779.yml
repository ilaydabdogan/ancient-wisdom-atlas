canonical_text:
  quote: ''
  summary: A passage presents paired Beaver and Wisa'ka host-guest episodes. The Beaver
    feeds Wisa'ka the cooked flesh of a child and restores the child when the bones
    are put into water, while Wisa'ka's concealed end claw explains a peculiar beaver
    claw. Wisa'ka then tries to host the Beaver by killing and cooking one of his
    own children, but the child does not return until the Beaver has the bones handled
    again. A second version begins with Wisa'ka traveling upriver to the Beaver's
    home, where the Beaver again prepares a child as food for his guest.
  language: English
