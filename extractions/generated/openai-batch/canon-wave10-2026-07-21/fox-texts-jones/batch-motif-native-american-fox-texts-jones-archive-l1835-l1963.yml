  quote: ''
  summary: The passage concludes an account in which a bear is chased into the sky,
    slain in autumn, and associated with stars and the reddening leaves of oak and
    sumach. It then begins a tale of Red-Earth visiting a distant tiny people, teaching
    them a different way of childbirth, being imitated in bodily acts, and helping
    them against bird enemies.
