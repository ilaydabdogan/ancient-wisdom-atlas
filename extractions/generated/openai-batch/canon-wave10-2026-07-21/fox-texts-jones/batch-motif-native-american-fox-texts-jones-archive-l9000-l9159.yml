canonical_text:
  quote: ''
  summary: The Great Manitou is described as fearing Wlsa‘ka and welcoming a plan
    to pacify him. The manitous gather food and medicine, and servants cook meat in
    four kettles over four fires with one, two, three, and four portions. A fearful
    servant repeatedly invites Wlsa‘ka to the Great Manitou’s dwelling. After several
    non-responses, Wlsa‘ka agrees, comes to the lodge, and sits by the doorway rather
    than at the far end. The manitous avoid disturbing him because they fear he might
    leave. Servants examine the kettles and serve the first cooked portion in a vessel
    placed between the fires.
  language: English
