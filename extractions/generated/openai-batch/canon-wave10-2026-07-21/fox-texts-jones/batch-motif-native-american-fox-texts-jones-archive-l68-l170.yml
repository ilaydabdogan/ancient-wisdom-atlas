canonical_text:
  quote: the fire of the lodge is then the centre of a circle of men and women
  summary: The introduction describes the collection as a non-exhaustive body of Algonkin
    lore belonging especially to the Foxes of Iowa, gathered in 1901-1902 under difficult
    conditions. It emphasizes that the lore was treated as sacred, transmitted as
    a gift rather than purchased, and often recorded from rapid one-time tellings.
    It also comments on Fox preference for short narratives, compares this with Ojibwa
    long narrative style, notes wider North American parallels and variants, and describes
    winter lodge storytelling around a central fire.
  language: English
  quote_policy: quoted
