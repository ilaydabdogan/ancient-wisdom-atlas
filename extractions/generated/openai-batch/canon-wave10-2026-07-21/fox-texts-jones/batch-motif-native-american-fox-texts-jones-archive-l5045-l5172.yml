canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a man shoots a Thunderer,
    a water-dwelling manitou takes the Thunderer under water, and the captive Thunderer
    links the act to ill fortune for those bearing the same name. It then begins “Painter’s
    Dream”: Painter falls from a tree and, while unconscious, seems to travel by a
    road to a river, bridge, and town associated with the spirit world, where he sees
    dwellings, games, dances, dead relatives who tell him to go back, and a dead woman
    who comments on his shabby clothing.'
  language: English
  quote_policy: summarized
