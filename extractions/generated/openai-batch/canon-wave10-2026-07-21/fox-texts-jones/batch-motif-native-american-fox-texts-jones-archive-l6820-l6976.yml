canonical_text:
  quote: ''
  summary: Wisa'ka comes to a pond full of ducks while hungry, devises a plan, and
    deceives them by carrying a grass bundle that he calls songs. He has them gather
    with their necks together and dance without peeping while he sings a warning.
    A diver suspects him, sees him preparing a bow cord or noose, escapes, and receives
    bloodshot eyes and a ruffled head. Wisa'ka then cooks the captured ducks at a
    river-bottom camp, orders his rump to guard them while he sleeps, and foxes smell
    the cooking food and decide to investigate.
  language: English
  quote_policy: summarized
