canonical_text:
  quote: ''
  summary: The passage combines the end of a Turtle and Wisa'ka episode with the beginning
    of a Red-Earths episode. Turtle visits Wisa'ka after a woman has taken his sacred
    bundle; Wisa'ka's Little-Fawns have trampled it to pieces. Wisa'ka recalls an
    insult, throws Turtle into pond water, and declares that Turtle will be eaten
    by some people and loathed by others. An editorial note then identifies the following
    Red-Earths narrative as a version of an Algonkin story about men visiting the
    culture-hero at a distant northern home. Six Red-Earth men travel toward Wisa'ka;
    two die at cosmic or earth hazards, and four arrive. Wisa'ka grants requests for
    everlasting life, martial success, hunting success, and wife-getting power; the
    immortality seeker is made into granite rock. Wisa'ka then uses a moccasin cord
    and fire to shorten the return journey.
  language: English
  quote_policy: summarized
