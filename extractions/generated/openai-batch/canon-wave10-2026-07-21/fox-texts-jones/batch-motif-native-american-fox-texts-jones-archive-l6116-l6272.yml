canonical_text:
  quote: ''
  summary: The passage begins mid-episode with Wisa'ka using big berries to call deer,
    but his explosive fails. Skunk repeats the call and obtains many deer. Wisa'ka
    asks Skunk for more powder, tests it on a rock, and later lures deer into the
    lodge with a trail of berries, but again cannot make the shot work. The old woman/grandmother
    struggles with a deer and kills it with an awl. The passage then begins a new
    account in which Wisa'ka sets out to visit his little brother the Duck; an editorial
    note previews Duck's miraculous rice hospitality.
