canonical_text:
  quote: ''
  summary: 'The passage recounts negotiations after Kansas land was sold, including
    William''s advice that chiefs ask the Commissioner for repayment for poorly managed
    house-building funds. The Commissioner offers repayment through land rather than
    cash. The narrative then explains why the Red-Earths went away to Iowa: after
    Pecicimon died, Sweep-with-the-Foot became chief; later MAmInwanigaa refused enrollment
    for lands in severalty by not touching the quill, was removed by the Agent, and
    went to the Single-Backbone-Country with nearly all the Red-Earths. Footnotes
    give lexical and historical notes, including an origin allusion to coming from
    under water.'
  language: English
  quote_policy: summarized
