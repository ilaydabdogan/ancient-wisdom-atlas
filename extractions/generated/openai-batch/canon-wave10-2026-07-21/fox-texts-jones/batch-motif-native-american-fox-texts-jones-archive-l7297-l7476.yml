canonical_text:
  quote: ''
  summary: The passage contains the end of one Wlsa'ka episode and the beginning of
    a Turtle episode. In the first, Wlsa'ka wagers that he can name all of a trader's
    pets, with the trader's death at stake. The trader disguises his wife with tar
    and brant feathers as an unknown food-folk creature, and Wlsa'ka, though the text
    says he knows the trick and is pretending, lets the trader win and rewards him.
    In the second, Turtle seeks Wlsa'ka's medicine so he can win a foot-race whose
    prize is the chief's daughter; Wlsa'ka lends him a buffalo-robe and rattle with
    instructions to return them.
  language: English
  quote_policy: summarized
