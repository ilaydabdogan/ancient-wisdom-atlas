  summary: The supplied passage contains a war-party episode in which Apaiyasa goes
    without a sacred bundle or medicine, is later nearly overtaken in battle, and
    survives after a comrade applies medicine to a quirt and lashes his horse. The
    episode ends with Apaiyasa honoring holy bundles. The excerpt then begins a second
    story in which an aged man sends two youths to war, despite their mother’s reluctance,
    and equips them with snake-tails from a magic roll.
