canonical_text:
  quote: ''
  summary: A group of foxes find Wisa'ka asleep beside a fire where ducks are roasting.
    Although Wisa'ka's rump gives a warning sound, the foxes steal and eat the ducks,
    leaving only the feet. Wisa'ka wakes, discovers the loss, suspects the foxes,
    blames his rump for failing to keep watch, and burns it with a firebrand. In the
    next episode, Wisa'ka sees turkeys, wants to get hold of them, climbs a hill,
    stitches himself into a linden-bark bag, and rolls downhill repeatedly until the
    turkeys ask to do the same.
  language: English
  quote_policy: summarized
