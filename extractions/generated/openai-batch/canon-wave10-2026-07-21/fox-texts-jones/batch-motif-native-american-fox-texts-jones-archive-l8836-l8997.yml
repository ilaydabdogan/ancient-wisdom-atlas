canonical_text:
  quote: ''
  summary: Wlsa‘ka sends a Garter-Snake back to the manitous with fat as evidence
    of its visit. The manitous suspect Wlsa‘ka and pursue him. Water chases him; he
    first receives help from Bittern, who sucks in the pursuing water, but Wlsa‘ka
    later pierces Bittern’s swollen belly and the water pursues again. Wlsa‘ka climbs
    a mountain and pine while the water rises. Muskrat and Pigeon arrive, die from
    exhaustion, and are revived by Wlsa‘ka’s caresses. At Wlsa‘ka’s request, Muskrat
    brings mud from under the water and Pigeon brings grasses and twigs. Wlsa‘ka combines
    these materials and throws them into the water, causing the water to fall away
    and the earth to appear cracked. The manitous then assemble before the Great Manitou
    to ask how to pacify Wlsa‘ka, fearing he will kill all living people.
  language: English
  quote_policy: summarized
