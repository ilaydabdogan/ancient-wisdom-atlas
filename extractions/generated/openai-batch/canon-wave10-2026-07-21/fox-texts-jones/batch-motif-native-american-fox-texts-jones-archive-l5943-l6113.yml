canonical_text:
  quote: ''
  summary: The passage includes the close of one Wlsa'ka-Skunk hunting episode and
    the start of another. Wlsa'ka fails to use a deer-killing powder and is mocked
    by deer, while Skunk successfully calls and kills deer. In the next story, Wlsa'ka
    visits his younger brother Skunk, observes his prosperous household near a brook,
    sees Skunk use “big berries” and an explosive to kill deer, asks for four charges
    of powder, receives it through a bodily transfer, and then tests it on a tree,
    rock, lake, and mountain before deciding to save the remaining powder. Skunk suspects
    Wlsa'ka is wasting it and goes to visit him.
  language: English
  quote_policy: summarized
