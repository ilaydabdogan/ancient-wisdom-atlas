canonical_text:
  quote: "“if ever in the course of your life you meet with adversity, think of me
    then.”"
  summary: A youth blackens his face and fasts, says the manitous have pitied him,
    but is told by his father to wait before eating. He affectionately instructs his
    little sister to think of him if she ever faces adversity, then goes hunting,
    crosses a frozen lake, is pursued and killed by Sioux. Later, when the sister
    is grown and fleeing Sioux with her husband, she hears her dead elder brother’s
    voice from on high directing their escape. They ride through the night and eventually
    meet their own friends.
  language: English
  quote_policy: quoted
