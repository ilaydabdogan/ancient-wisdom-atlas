canonical_text:
  quote: "“Shoot him for me, oh, my dear grandson!”"
  summary: 'The passage first recounts a night transformation, a summons to Mesoswa,
    and a revelation that disguised old men and a messenger are the summoned man’s
    brothers-in-law and that his wives are his sisters; when he returns, the dwelling
    and garden have vanished. A second tale begins with a Red-Earth man blackening
    his face and fasting on a cliff by a lake, seeking a manitou’s blessing. A water-dwelling
    manitou appears on a rock, a Thunderer attacks it, and both beings seek to influence
    the fasting man: the manitou asks him to shoot the Thunderer, while the Thunderer
    silently offers him a warlike blessing.'
  language: English
  quote_policy: quoted
