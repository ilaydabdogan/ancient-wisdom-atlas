canonical_text:
  quote: ''
  summary: 'The passage closes a prior tale with Grizzly saying he fears Skunk and
    will obey Skunk''s commands. It then begins the tale of Raccoon and Wolf: Wolf
    meets Raccoon on the road, asks for food because he is starving, and is fed Raccoon''s
    dung. Raccoon repeatedly tells Wolf what he has eaten, escapes into a tree when
    Wolf threatens him, drops bark as decoys while Wolf waits by a fire, descends
    after Wolf sleeps, defecates on Wolf''s eyes, and leaves. Wolf wakes with his
    eyes caked shut, wanders blind, bumps into trees, and asks them how far it is
    to the river.'
  language: English
