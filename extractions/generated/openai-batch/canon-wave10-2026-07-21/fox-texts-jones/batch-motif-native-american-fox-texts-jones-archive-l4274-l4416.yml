canonical_text:
  quote: ''
  summary: The passage contains the end of one narrative in which two captured sons
    return home through their father's holy-bundle rite, and the beginning of another
    narrative in which a Thunderer or thunder manitou arrives as a naked war-club-bearing
    visitor at the lodge of a man and wife during an autumn hunt. The woman feeds
    the visitor, who speaks about humans being of the nature of manitous because they
    break open the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A war party reaches many Sioux lodges, fights through the day, and two young
    men are captured by the Sioux and held under close watch in the Sioux chief's
    lodge far from home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Others return home with many scalps and report that the two young men were
    captured.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother of the captured sons wails, takes an axe, and feels strongly inclined
    to beat her husband to death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband tells the woman to wait, asks her to fetch a pumpkin, has it boiled
    in a kettle of water, lays out buckskins, places his sacred bundle on them, and
    asks for three rattles.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man opens the holy bundle, drops tobacco into the fire, speaks at length,
    takes a rattle, sings, and one son enters the lodge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each returned son unties a snake-tail from his belt, places it on the holy
    bundle, sits near the old man, takes a rattle, and sings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The woman becomes proud and relieved that her sons have returned, learns that
    holy bundles carry manitou power, and afterward regards her husband as like a
    manitou.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note states that the following story concerns a man and woman who entertained
    a thunder manitou and only understood the guest's identity after departure.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: The note states that thunder is understood as noise made by manitou beings
    of the air, lightning as fire issuing from their mouths, and that such beings
    may assume various forms, including birds; in this story the thunder being is
    represented as a warrior.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: During an autumn hunt, while the husband is away, a naked man with a knob-headed
    war-club enters the lodge, leans the club against the rear wall, and sits on the
    other side of the fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Because the visitor is unknown to them, the woman and later her husband do
    not converse with him at first.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The woman roasts a deer backbone carefully on a spit and gives it to the visitor
    to eat; on another occasion she again prepares meat while the visitor watches.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The visitor tells the woman that she and her husband are of the nature of
    manitous because they break open the earth; she denies this.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The woman gives the visitor a deer backbone to roast; he gets a spit and a
    stone, places the stone beside the fire, pierces the backbone, and fixes the spit
    into the stone.
  category: sequence
  evidence_refs:
  - ev:11
