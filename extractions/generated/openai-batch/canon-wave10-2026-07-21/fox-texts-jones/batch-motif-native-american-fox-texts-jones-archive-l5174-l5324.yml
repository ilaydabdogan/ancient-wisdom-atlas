canonical_text:
  quote: ''
  summary: 'The passage opens with the end of an account in which a man is found parched
    and immobilized after a fall from a tree; the narrator says he had really been
    dead and later told of a dream-visit to the place of the dead. Section 7 tells
    of three hunters crossing the Missouri River in winter: one dreams that ice covers
    them underneath, warns against crossing while ice is running, is mocked, and drowns
    when the canoe tips among the ice; one companion also drowns and one survives
    to report the warning. Section 8 begins with a note and an account of a mother’s
    dream that Runner is searching angrily for his deserted wife, followed by the
    narrator’s encounter with Comanche at Salt Creek.'
  language: English
  quote_policy: summarized
