canonical_text:
  quote: ''
  summary: Turtle claims a woman as wife after a footrace, brings her to his lodge,
    then repeatedly tries to steal an unspecified shared thing or medicine from his
    friend Wlsa‘ka. After each theft he flees and sleeps away from the lodge, but
    is found again near Wlsa‘ka’s lodge or doorway. Turtle offers explanations involving
    ghost influence, the medicine, craziness, or his speed, while internally resolving
    to steal the object again.
