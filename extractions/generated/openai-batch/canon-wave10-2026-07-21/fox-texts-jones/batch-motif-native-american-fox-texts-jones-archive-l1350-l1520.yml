canonical_text:
  quote: ''
  summary: A youth repeatedly enters lodges and takes groups of maidens away, eventually
    declaring some of them his wives. Most parents do not resist, but one old man
    refuses until the youth conjures manitou power and his fingernails become long;
    the daughters then plead for the father to stop speaking against him. The women
    gather at a large lodge, where fifty-three women and one man live as husband and
    wives. He commands them, favors one woman, sends others to work, and the women
    hunt, keep watch, and mistreat people. A separate married youth living far away
    kills a deer; watching women report it to their husband, who orders them to take
    it away.
  language: English with brief Meskwaki passages
  quote_policy: summarized
