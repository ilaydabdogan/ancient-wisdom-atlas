canonical_text:
  quote: ''
  summary: The passage introduces a sacred Fox myth of Wisa'ka as a culture-hero who
    struggles with manitous before the world is ordered for later people. In the narrated
    episode, Wisa'ka, his younger brother Kiyapata, and their grandmother Mother-of-All-the-Earth
    are at home while the brothers kill manitous. The frightened manitous hold a sky
    council, ask Mother-of-All-the-Earth to give up one grandson, and are told the
    elder brother is too powerful but the younger may be vulnerable. The brothers
    are then separated into eastward and westward journeys; Wisa'ka's companions disappear,
    and he hears his younger brother say he is dying.
  language: English
  quote_policy: summarized
