  summary: The supplied passage contains overlapping Duck-visit material and the opening
    of a Kingfisher visit. Duck hosts Wisa'ka by preparing rice through a distinctive
    action involving water, a kettle, movement, the cry “Kwan,” and muting into the
    kettle; Wisa'ka eats and returns to his grandmother. In a reciprocal visit, Duck
    comes to Wisa'ka; Wisa'ka tries to imitate Duck's method but drops dung into the
    water, after which Duck has the water discarded and prepares the food himself.
    A numbered version repeats Wisa'ka's visit to Duck and adds that Wisa'ka learned
    the method by observing. The passage ends as Wisa'ka asks to visit Kingfisher
    and arrives at Kingfisher's dwelling.
