canonical_text:
  quote: ''
  summary: 'The passage closes a prior fragment in which an unnamed speaker prepares
    killed beings as food. It then presents an episode in which the Little-Creatures-of-Caprice
    set a bowstring noose over a gleaming hole, catch a large bright being, learn
    it is the Sun, and release it after it warns that its death would bring perpetual
    night. The passage then begins the tale of ten brothers: the youngest wounds a
    red swan at a lake, follows it because it carries away his arrow, and is repeatedly
    hosted at towns where men feed him and offer their sisters as wives. Editorial
    notes identify the Little-Creatures-of-Caprice as belonging to a story class of
    their own and describe elements in the red swan tale, including trials of the
    youngest-born, a rolling skull, and a magic flight.'
  language: English
  quote_policy: summarized
