canonical_text:
  quote: ''
  summary: The manitous explain to Wisa'ka that they summoned him to learn how peace
    might come over the land of the Great Manitou and to give him food, herbs, and
    roots. The herbs are to be used as poultices for wounds, and the roots boiled
    and drunk for disease. Wisa'ka thanks them and says these gifts will sustain and
    heal his future uncles and aunts as long as people live on earth. The manitous
    summon flying creatures, who bring down Wisa'ka's food and medicine from the sky.
    Wisa'ka then tells his grandmother, the Mother-of-All-the-Earth, of the blessing
    and has her walk in a circle inside the dwelling four times, each circuit changing
    her age from youth to maturity to gray-haired age to extreme old age. He says
    this is the form his future relatives will have if they remain faithful to the
    things given by the manitous.
  language: English
  quote_policy: summarized
