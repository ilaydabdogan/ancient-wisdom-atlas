canonical_text:
  quote: ''
  summary: A youth defies an old woman and takes her daughter as a wife. He then repeatedly
    enters lodges, tells young women he has come to take them away, and leads or carries
    them off. Some women become wives who cook, build a long flag-reed lodge, gather
    food, and point out where other young women live. The community becomes alarmed
    by the continuing removal of maidens but is unable to stop it.
  language: English
  quote_policy: summarized
