canonical_text:
  quote: ''
  summary: A woman later identified as Woman-of-the-Sea flees Sioux captivity, hides
    by day, reaches a white man’s barn, receives aid, is concealed in a nailed dry-goods
    box on a steamboat, and returns to the Red-Earths. The passage then shifts to
    an editorial introduction to culture-hero stories and begins a Wisa'ka tale in
    which Wisa'ka visits Beaver, who kills and cooks a willing child for the guest.
