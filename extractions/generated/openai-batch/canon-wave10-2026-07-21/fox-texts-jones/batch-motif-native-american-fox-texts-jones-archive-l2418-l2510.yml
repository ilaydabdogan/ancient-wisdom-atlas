canonical_text:
  quote: ''
  summary: A Little-Skull-Being or head eats his elder brothers and sisters-in-law
    but spares his wife, who carries him in a linden-bark bag. After raccoons are
    obtained from a scratched tree and their oil stored in bladders, a chickadee warns
    the wife that her husband will eat her and instructs her to flee to a mountain
    brother while scattering oil to delay pursuit. She reaches the mountain, which
    opens and closes behind her. The head pursues, is delayed by the oil, demands
    entry at the mountain, and is finally destroyed when one of the manitou's pets
    crunches and swallows it.
  language: English
  quote_policy: summarized
