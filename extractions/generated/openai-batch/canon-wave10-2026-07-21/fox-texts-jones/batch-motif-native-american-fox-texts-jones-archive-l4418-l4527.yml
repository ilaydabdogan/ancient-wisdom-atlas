canonical_text:
  quote: ''
  summary: A woman and her husband host a man described in dialogue as manitou-like.
    The man instructs that the husband's pet dog be killed, dressed, washed, and placed
    on the lodge roof at night with a cleaned bowl and white-eyed beans for sky-traveling
    beings. The husband and woman are told that two utterances can come true, but
    they fail to use the gift fully. The visitor thanks them for feeding him, instructs
    them to burn tobacco offerings to the sky travelers, grants the married couple
    long life, and disappears when thunderers pass overhead. In the morning the dog
    and beans are gone, while the bowl remains.
  language: English
  quote_policy: summarized
