canonical_text:
  quote: ''
  summary: 'The passage contains the end of a Turtle and Wlsa''ka episode, an editorial
    note on Turtle''s fall, and the beginning of another Turtle story. Turtle repeatedly
    takes a mysterious thing and tries to get far away, but is found back at the lodge
    fire; on one attempt he ties himself by the neck with bark and runs in a circle
    until Wlsa''ka unties him. An editorial note states that the story concerns Turtle''s
    fall from being a prominent manitou after angering a culture-hero and desecrating
    a sacred bundle. A new story then begins: Turtle gambles with manitous, Wlsa''ka
    substitutes for him and loses his winnings, Turtle taunts Wlsa''ka about Iyapata,
    and Wlsa''ka becomes angry and seeks revenge.'
  language: English
  quote_policy: summarized
