canonical_text:
  quote: ''
  summary: The passage contains three adjacent Meskwaki/Fox narratives, with editorial
    notes and page artifacts. In the first, a warrior husband attempts to stop his
    wife's repeated sexual desertions and uses fire to draw two flat-headed creatures
    from her body, after which her sexual desire diminishes; the narrator gives an
    etiological explanation for lust in harlots. In the second, a husband traps his
    wife and her lover in a hollow log, burns them despite their pleas, then leads
    boys on a war raid after which they become warriors. In the third, a wife has
    sexual intercourse through a hidden bark opening in a lodge wall; the husband
    changes places with her, cuts off the intruding man's penis, and ties it to his
    wife's belt. The third narrative is incomplete in the supplied passage.
  language: English
  quote_policy: summarized
