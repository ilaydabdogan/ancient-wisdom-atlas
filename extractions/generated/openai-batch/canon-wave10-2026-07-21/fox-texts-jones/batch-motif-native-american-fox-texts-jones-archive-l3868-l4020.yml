canonical_text:
  quote: ''
  summary: The passage contains the end of one episode in which maidens plead secrecy,
    attribute their conduct to an unknown being, and one later gives birth to a child
    like a soft-shell turtle; a complete tale in which an abusive stepmother meets
    the dead mother of the children and is burned in the lodge fire; and the opening
    and middle of a tale in which a grandson’s ritual-food choices anger his grandfather,
    the youth dies, his brothers keep watch in transformed forms, and a bear-form
    grandfather raises and then cuts up the youth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maidens plead with the youths not to tell and say their action was done
    under the influence of an unknown being rather than by their own free desire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the maidens later becomes pregnant and gives birth to a child described
    as like a soft-shell turtle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man remarries after his first wife dies, and the second wife ill-uses the
    first wife’s two children and does not feed them when the husband is away.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In winter the stepmother goes to dig wild potatoes, becomes lost, makes camp,
    cooks the potatoes, and is visited by a woman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: During the meal the visitor asks about the children, and the stepmother says
    they are only her stepchildren; the visitor reports hearing that she abuses them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The visitor is revealed to be the children’s dead mother or phantom, and the
    stepmother flees toward home while being followed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the lodge the phantom pushes the stepmother into the center of the fire,
    where she is burned, and rebukes her for abusing the children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An editorial note states that the later tale is understood as illustrating
    the evil effect of improperly preparing holy food, and identifies the old man
    as a witch who takes bear form and raises the dead.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The youngest grandson returns from hunting with a bear and a raccoon, giving
    the bear to his grandfather for a midewiwin feast and reserving the raccoon for
    a clan feast.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The grandfather is displeased with the youth’s handling of the fresh meat,
    but the youth says the others will also eat and then holds the clan feast.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the feast the youth goes hunting with his elder brothers, becomes sick
    through the night, dies, and is buried by them.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: While keeping watch, the elder brothers have visions and take on forms associated
    with the Man-of-the-Night, a dog, and a ghost, so that an approaching being will
    not see them.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: A bear approaches the grave, circles it four times, stamps at the morning
    side near the head, and utters an exclamation.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The dead youth’s body rises to the top of the grave; the bear touches him,
    he comes back to life, and the bear strikes him on the mouth.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The revived youth addresses the being as his grandfather and asks why he killed
    him; the old man says he killed him because he was grieved that the raccoon had
    been cooked together with pumpkin.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: The old man begins cutting up the youth alive, and the brothers in their transformed
    forms approach him.
  category: action
  evidence_refs:
  - ev:16
