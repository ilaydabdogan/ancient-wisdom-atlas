canonical_text:
  quote: ''
  summary: The passage contains two related accounts of youths who fast too long.
    In the first, a fasting youth blessed by manitous asks his father for food, is
    told to continue fasting, disappears, is found drinking at a spring, partly changes
    into a fish, escapes, and is later associated with catfish seen in a lake. In
    the second, a fasting youth blessed by manitous is denied food, utters a prophecy
    concerning future White-Skins, food, red liquid, forced movement, and a muddy
    river, then departs; people hear his singing in the air for many winters until
    his voice is no longer heard.
  language: English
  quote_policy: summarized
