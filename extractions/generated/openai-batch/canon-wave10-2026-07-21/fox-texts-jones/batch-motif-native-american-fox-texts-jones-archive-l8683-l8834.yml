canonical_text:
  quote: ''
  summary: Wisa'ka uses a windborne spider-web to approach manitous, wounds them,
    and later takes the form of an old woman who pretends to be blind and to offer
    healing. After ordering kettles, water, fires, and a heated iron rod, he sends
    the attendants away, kills and cooks the wounded manitous, eats, and is discovered
    by Garter-Snake.
  language: English
  quote_policy: summarized
