canonical_text:
  quote: ''
  summary: A male figure continues walking, repeatedly bumping into trees and asking
    each tree, addressed as grandfather, what kind it is and how far it is to the
    river. The trees identify themselves as elm, hard maple, cottonwood, sycamore,
    and willow, and their answers place the traveler progressively nearer to the river.
    After the willow says that another step will put him into the water, he repeatedly
    asks how deep he is, calling himself Wolf, while replies mark the water rising
    from his ankles to his mouth. A mink then goes down into the water with him, and
    the story ends.
  language: English
