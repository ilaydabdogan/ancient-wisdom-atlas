canonical_text:
  quote: "“O Masenapina, my elder brother, now am I dying!”"
  summary: An elder brother hears his younger brother Klyapa‘ta calling that he is
    dying, but cannot locate the voice as it recedes and falls silent. He returns
    home, questions others without success, concludes that his brother has likely
    died, and wanders in grief. His repeated lament invokes death by club for someone
    on the forest trail; when he sobs, the earth quakes. The manitous fear Wisa'ka’s
    mysterious power and say they killed his younger brother.
  language: English with Meskwaki names and quoted terms
  quote_policy: quoted
