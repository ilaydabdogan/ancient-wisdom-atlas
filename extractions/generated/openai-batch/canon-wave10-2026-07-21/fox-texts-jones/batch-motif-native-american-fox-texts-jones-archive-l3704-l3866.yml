canonical_text:
  quote: ''
  summary: The passage contains the end of one tale in which a woman is exposed after
    a man has been sexually mutilated and killed, is herself killed by her brother,
    and is replaced in marriage by her younger sister. It then gives the tale of a
    youth who forsakes a manitou woman for her younger sister; the betrayed manitou
    woman kills him, his broken body becomes white winter birds, and manitou women
    at the setting sun are said to redden the sky. The passage also begins a tale
    in which two young women are secretly observed by two youths while engaging in
    sexual intercourse during a summer bark-peeling trip.
  language: English
  quote_policy: summarized
