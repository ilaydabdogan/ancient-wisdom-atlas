    a way of saying 'you are menstruating.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Outside, the grandmother kindles a fire and makes a linden-bark wallet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After eating the turkey, Wisa'ka asks how many strands the grandmother has
    woven; when she answers six, he declares that this will be the number of days
    his aunts stay outdoors when their 'crawling weak' time comes.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Wisa'ka then lets the grandmother come back inside and gives her a little
    soup he saved for her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the next tale, Wisa'ka travels across the country with wolves, who direct
    youths to seek game and kill deer.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:11
  text: The wolves eat the deer completely, crunching even the bones, then vomit;
    thin cooked slices of meat and grease appear, and Wisa'ka eats with them.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:12
  text: At a windy camp, wolves ease themselves on the side from which the wind comes;
