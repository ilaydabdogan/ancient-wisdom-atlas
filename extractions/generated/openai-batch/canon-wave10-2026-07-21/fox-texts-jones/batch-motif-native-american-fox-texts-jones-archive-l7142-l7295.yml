canonical_text:
  quote: ''
  summary: The passage contains the end of a Wisa'ka episode in which Wisa'ka captures
    turkeys, his grandmother frees them after their persuasion, one turkey is retained
    and cooked, and Wisa'ka uses a blood-clot incident and the grandmother's six woven
    strands to declare a six-day outdoor period connected with menstruation. It then
    gives the tale 'Wisa'ka and the Wolves,' in which Wisa'ka travels with wolves
    who hunt deer, crunch bones, vomit up cooked meat and grease, and produce hides
    or robes in comic windward-camp episodes involving bodily functions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wisa'ka selects fat turkeys, fills a bag with them, stitches it shut with
    cord, and carries it toward home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The turkeys speak and urge the grandmother to open the bag and free them,
    suggesting she hide one for herself to eat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandmother loosens the bag; the turkeys fly away together, while she
    holds one by the leg.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wisa'ka suspects and then confirms that his grandmother has untied the bag
    and set the turkeys free.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wisa'ka tells his grandmother to hold the remaining turkey while he makes
    arrows; after finishing the arrows, he shoots the turkey, and the grandmother
    cuts it up and boils it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wisa'ka throws a clot of blood at his grandmother's buttocks, says she is
