canonical_text:
  quote: ''
  summary: A woman called Doe-Fawn verifies Turtle's sacred bundle, lies with him
    using the bundle as a pillow, exhausts him, replaces herself with a decayed ant-filled
    log while he sleeps, and leaves with the bundle. Turtle wakes, discovers the substitution
    and theft, returns home, then searches among manitous, including a great manitou
    said to know everything; none knows Doe-Fawn.
  language: English
