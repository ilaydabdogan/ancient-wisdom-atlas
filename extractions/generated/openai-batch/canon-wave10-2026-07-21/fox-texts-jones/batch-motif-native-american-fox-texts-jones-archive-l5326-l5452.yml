canonical_text:
  quote: "“I have had a foreboding that something we shall see,” he said to his wife
    Woman-of-the-Sea."
  summary: The supplied passage first preserves a fragment in which a speaker refuses
    a proposed marital-friendship custom involving Comanche, and the speaker’s mother
    later connects Comanche’s marriage to Runner’s wife with a dream. The main narrative
    tells of Blue-Chief, who foresees danger, gives Woman-of-the-Sea a paper to preserve,
    is shot and scalped by Sioux, and whose wife is captured. She is taken to a Sioux
    winter camp, assigned as a sister, threatened by one assigned man, then cared
    for by another Sioux who eventually releases her at night with provisions and
    directions to travel by the unmoving star toward a great river and a trader.
  language: English
  quote_policy: quoted
