canonical_text:
  quote: ''
  summary: A Raccoon at a lake shore sees Crawfish holes and decides to obtain Crawfishes
    by pretending to be dead, stuffing punk into his body openings and lying down.
    A Crawfish reports the supposed death to the town and chief, receives honors and
    companions, and the Crawfish community dances in celebration before the Raccoon
    wakes and eats the dancers. The passage then begins an incomplete parable about
    two youths, one preferring summer and one winter, who challenge each other through
    walks in seasonal conditions.
  language: English
  quote_policy: summarized
