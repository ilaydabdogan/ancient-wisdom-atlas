  summary: Skunk and Grizzly hold a contest over supernatural power. Grizzly fails
    to demonstrate power through his claws, while Skunk uses an explosive from his
    buttocks to kill Grizzly, then revives him with water and treatment. Skunk then
    demonstrates the force again by shooting at a lake, which is emptied dry, and
    at a great tree, which disappears. Manitous warn that Skunk is out shooting.
