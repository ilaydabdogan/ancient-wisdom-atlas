  - ev:3
  - ev:4
  confidence: high
  cautions: No broader comparative linkage is asserted.
- id: motif:4
  label: Desired captivity through destruction of weapons
  taxonomy_refs: []
  basis: White-Robe says he wants to be taken captive and breaks his friends' bows
