canonical_text:
  quote: ''
  summary: The passage continues a war narrative in which a conjurer induces sleep
    among enemies, fleeing people are pursued, age groups fight and die, a wounded
    uncle rescues captives, and White-Robe is captured, tortured by being fed his
    own flesh, burned, and prophesies the destruction of his captors. A note summarizes
    the broader White-Robe variant, and the next section begins with White-Robe as
    a supernatural child instructed by his high-dwelling father to secure a town.
  language: English with Fox names and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man beats a drum and conjures for power to put enemies to sleep; snowfall
    and the enemies' sleep allow people to flee from their camps.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One fleeing group stops on a hill, sets up a stockade fort, and is overtaken
    there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old men tell youths not to go out, then the old men repeatedly fight until
    all are slain; afterward the youths fight until all are slain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: An injured man named He-who-makes-the-Earth-rise-at-his-Call hears his captive
    niece lament that he is not alive to help her, and an enemy pushes her while pointing
    him out.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: He-who-makes-the-Earth-rise-at-his-Call declares himself, uses a club to kill
    many enemies alone, causes the rest to flee, and recovers the captives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: White-Robe says he wants to be captured and breaks the bows of his comrades
    with his foot despite their objections.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: White-Robe is captured by a member of the Fire-Nation, bound with cords, questioned,
    and fed roasted slices of his own flesh.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: After White-Robe's flesh is carved away, his bones are set on fire; words
    from the bones answer an old Fire-Nation man's taunt by saying he will burn with
    the Fire-Nation town.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrative states that within two years the Fire-Nation people were all
    slain by the Red-Earths.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: An editorial note says this White-Robe version includes supernatural origin,
    rebirth, continued wilfulness, killing visiting strangers, an attack on the Foxes
    aided by the French, magical snow and sleep, Peoria capture, eating his own flesh,
    burning at the stake, and a prophecy of Peoria doom.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The next White-Robe section says that, as a small boy, he made other boys
    cry and was a supernatural child named TcaginAtowa, reared near where the Mississippi
    joins another stream.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: A manitou lodge or council house stands near his place of rearing, and supernatural
    beings hold council there.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: When grown, White-Robe returns to his father, who lives on high, and is instructed
    to fetch other people four times and sit on high to secure the town from plague
    or misfortune.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:12
- id: obs:14
  text: A note explains that Wapasaiya, translated White-Robe, refers to the fur or
    robe of the white fox and is a name peculiar to the Fox clan.
  category: attribute
  evidence_refs:
  - ev:11
