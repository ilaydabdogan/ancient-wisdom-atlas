canonical_text:
  quote: ''
  summary: 'The passage ends a Beaver episode in which Wlsa''ka eats a beaver child,
    the bones are put into water, and the child returns with a missing claw that Wlsa''ka
    had concealed. It then begins a Skunk episode: Wlsa''ka visits Skunk, observes
    Skunk''s plentiful animal materials, is fed by Skunk''s method of luring and shooting
    food-animals, receives powder, uses it to dry a lake and destroy a mountain, and
    later begins to host Skunk in a similar manner.'
  language: English
  quote_policy: summarized
