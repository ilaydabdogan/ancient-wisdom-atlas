canonical_text:
  quote: ''
  summary: An unnamed male traveler pursues a red swan that is carrying away his arrow.
    At successive towns and lodges, he asks whether the swan has been seen, is fed
    by the inhabitants, and is offered a host's sister in marriage. He says he will
    collect each woman on his return. After overtaking the swan, he turns back, gathers
    the women as wives, brings them to his elder brothers, gives them away in the
    order received, and keeps the last for himself.
  language: English with brief Fox/Meskwaki transcription and footnote
  quote_policy: summarized
