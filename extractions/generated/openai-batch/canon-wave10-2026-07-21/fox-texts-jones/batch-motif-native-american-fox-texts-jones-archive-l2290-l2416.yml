canonical_text:
  quote: ''
  summary: A youngest-born brother is lured into a hunt by jealous elder brothers,
    made to climb a raccoon tree, shot, killed, dismembered, roasted, and partly burned.
    His wife searches for him and is warned by her husband not to eat from the remains.
    Later the first-born tries to take the wife, but a whirling head enters, recounts
    the history of the red swan pursuit, the women given to the youngest-born, the
    brothers’ jealousy and murder, and then chews up the first-born.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youngest-born goes hunting; after he leaves, the eldest-born proposes
    that the brothers kill him, citing the wives he brought back as the reason.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: All the brothers agree to the killing except the brother next in age to the
    youngest-born, who does not speak.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first-born proposes an overnight hunt, finds a tree where raccoons live,
    and inwardly marks that place as where they will kill the youngest-born.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the raccoon tree, the brothers each say they are not good at climbing,
    so the youngest-born climbs and drives out the raccoons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: While the youngest-born is in the tree, the brothers shoot at the raccoons;
    he warns them not to hit him, they dismiss the warning, and he is hit and falls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After killing the youngest-born, the brothers cut off his head, cut up his
    body, roast flesh on spits, burn the rest in the fire, and then lie to his wife
    that he is returning from hunting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife searches for her husband, finds the camp and the standing spits,
    and is warned by her husband not to eat of him when she is about to eat from one
    of the spits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the wife returns weeping, the first-born says he will wed the sister-in-law.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the first-born is about to lie in bed with the sister-in-law, a head
    whirls into the lodge and offers to recite a tale to him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The head’s tale says that the youngest-born once wounded a red swan at a lake,
    followed it through towns, received women at the towns, overtook the swan, returned
    with the women, and gave them one by one to his elder brothers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The head’s tale repeats the murder, the wife’s discovery, and the first-born’s
    plan to wed the wife; after finishing the story, the head crunches and chews up
    the first-born.
  category: sequence
  evidence_refs:
  - ev:8
