canonical_text:
  quote: ''
  summary: A narrative fragment recounts the capture of White-Robe by Peorias, the
    rescue and elevation of his companion after recognition by an old Peoria, White-Robe’s
    torture in which he eats his own flesh while bound to a hickory tree, his speaking
    skeleton and reciprocal burning threat, and his final burning. A following brief
    tale explains the name Bear-Foot-Sulkers from youths who separated after others
    ate a cooked bear foot before their return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A picture of White-Robe is drawn on a drum, and the drum is struck repeatedly
    to see whether it will burst; it does not burst.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old man says his son is telling the truth and becomes proud; in the morning
    they go to capture White-Robe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: White-Robe becomes weary of fighting and breaks bow after bow, despite rebuke
    from his allies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Peoria young man who had fasted captures White-Robe and one of White-Robe’s
    friends; the captives are bound with cords and taken to the Peoria town.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: White-Robe is offered food, asks for meat from the rump, and eats roasted
    game-food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When questioned about the killing of a Peoria chief, White-Robe says his friend
    killed the chief.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Peorias attack White-Robe’s friend with axe-bladed pipes, but the pipes crumble
    at the blows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An old Peoria recognizes the captive friend as his son, stops the beating,
    and has him untied and taken home.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The rescued captive is seated between two women, has two wives, resembles
    the Peoria chief, and becomes a chief.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: White-Robe is tied fast to a hickory tree.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Pieces of White-Robe’s flesh and organs are cut from him, roasted or given
    to him, and he eats them until only bones remain bound to the tree.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Peorias assemble and look at White-Robe’s skeleton.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The old man addresses White-Robe’s skeleton; it answers, and White-Robe says
    that he will burn with the Peorias and their towns one after another.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The tree wheels round, someone pushes the old man until he is nearly killed,
    and White-Robe is burned up.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: A note states that the White-Robe episode is a fragment of a well-known story
    prevalent among Southern Algonkins.
  category: other
  evidence_refs:
  - ev:15
- id: obs:16
  text: In a separate brief tale, Red-Earth youths on a hunt kill a bear, some cook
    and eat the bear’s foot before absent companions return, and the late-returning
    youths sulk and separate.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Those who separated are said to be called Those-that-sulked-on-Account-of-the-Bear’s-Foot
    or Bear-Foot-Sulkers and are located beyond the divide forming the source of the
    Big River.
  category: relationship
  evidence_refs:
  - ev:17
