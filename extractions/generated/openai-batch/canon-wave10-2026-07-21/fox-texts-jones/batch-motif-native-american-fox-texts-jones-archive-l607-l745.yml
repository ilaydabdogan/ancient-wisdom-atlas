canonical_text:
  quote: ''
  summary: The passage narrates a male figure who returns to a lodge, enters a woman's
    womb, is born again conscious and with teeth, receives names, becomes a supernatural
    warrior called White-Robe, is rebuked by his father the great manitou, repeatedly
    kills enemies, fights French and other attacking peoples with the Red-Earths,
    and is later the object of a Peoria youth's fasting dream to capture him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A male figure comes back home to a flag-reed lodge with a bearskin curtain
    and seats himself at the rear of the lodge.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The figure passes into a woman's womb, is born again, remains conscious, looks
    around, and already has teeth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: He is named Tcagacti; while a boy he does not blacken his face and fast and
    is described as very wicked.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Later he joins a war party, slays an enemy, and receives the name White-Robe
    after the return dance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: That night his father, described as the great manitou dwelling afar on high,
    bitterly rebukes him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the rebuke he stops heeding his father's teaching, repeatedly joins
    war parties, and kills enemies many times.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: He is urged to become chief, says 'Not yet,' becomes widely talked about because
    he is supernatural, and is continually urged by eight friends.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: When travellers come, he kills them and says he will be chief and do this
    also; the Red-Earths become afraid because they cannot make him peaceful.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Frenchman asks White-Robe how many osier stems he will set up; after an
    exchange, the Frenchman proposes four, White-Robe sets up eight, and they agree
    to begin shooting the next day at noon.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the shooting contest or battle, the French fire their guns once and are
    slain, with one Frenchman taken captive and sent to tell more people to come.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The captive Frenchman delivers the message, says he will die as soon as it
    is finished, and then dies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: When the French come again, the Red-Earths ambush them, kill them all without
    any Red-Earths being wounded, and White-Robe says he has erred and the fight is
    ended.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The French do not return directly, but go among other peoples, inciting them
    and furnishing firearms; people of every language then come against the Red-Earths
    during the ripening season.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A Red-Earth marksman kills someone with every shot and shoots enemy command
    whoopers in the center of the forehead with arrows, making the enemy afraid to
    whoop commands.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: White-Robe and his comrades repeatedly sally out from the stronghold, and
    bodies of the other side lie scattered along their path.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: A young Peoria blackens his face and fasts, dreams that he can capture White-Robe,
    tells his father, and the old man has others prepare a drum.
  category: sequence
  evidence_refs:
  - ev:14
