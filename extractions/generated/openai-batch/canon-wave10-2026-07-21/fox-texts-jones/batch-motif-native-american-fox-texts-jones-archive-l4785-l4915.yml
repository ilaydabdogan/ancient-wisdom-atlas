canonical_text:
  quote: ''
  summary: Two youths fast through the winter after blackening their faces. Sent to
    seek wives, they come to maidens whose visitors are killed with clubs. Other youths
    die after touching the maidens’ booth. One of the two fasting youths evades pursuit
    by uttering a cry and squatting, causing the pursuing maidens to appear seated
    and suckling babes. The maidens’ mother offers human remains as food, but after
    one youth spills the vessel, cooked sweet corn with beans is provided instead.
    The two youths marry the maidens and depart. On the way they transform themselves
    into old men and make their wives appear as their daughters. When the maidens’
    brother follows them, the disguised youths deny seeing the abductors, send him
    to be fed by their “daughters,” and then permit him to marry the women.
  language: English
  quote_policy: summarized
