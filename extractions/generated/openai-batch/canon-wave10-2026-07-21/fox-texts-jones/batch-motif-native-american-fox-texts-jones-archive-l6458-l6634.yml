canonical_text:
  quote: ''
  summary: The passage contains the end of a Wisa'ka and Kingfisher episode and the
    beginning of a Wisa'ka and Woodpecker episode. Wisa'ka visits Kingfisher and is
    fed fish caught by Kingfisher with his beak from a log over the water. When Kingfisher
    later visits Wisa'ka, Wisa'ka attempts to imitate the method by putting sharp
    sticks in his nose, mistakes a submerged log for a fish, injures himself, and
    is rescued by Kingfisher, who then catches fish for the meal. In the next episode,
    Wisa'ka asks his grandmother where Woodpecker lives, goes to a riverside grove
    dwelling, and Woodpecker gathers honey from a great tree onto a skin.
  language: English
