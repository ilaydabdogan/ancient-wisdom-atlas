canonical_text:
  quote: ''
  summary: 'A dispute over deer meat escalates when repeated emissaries are refused
    and threatened. A manitou challenges a small youth to a fight at midday. After
    a communal meal and a night of fear, the two face each other in a meadow, take
    east and west sides, and display supernatural power: the earth is torn and blown
    upward, trees are uprooted, and both rise into the air, with the youth rising
    higher and frightening the manitou. Afterward, the youth says he still intends
    to kill the manitou and has his wife collect lice from his head onto a leaf, then
    flings them while naming the manitou''s navel.'
  language: English
  quote_policy: summarized
