canonical_text:
  quote: ''
  summary: At night the deceased younger brother comes to the elder brother's doorway
    and asks to enter. The elder refuses, directs him toward the place of the setting
    sun, and gives him fire, a drum, a rattle, and a bone fife. The younger brother
    departs westward with followers and relatives. The elder brother then seeks revenge
    on manitous connected with the brother's death. A Chickadee bargains for coloring
    in exchange for information and identifies two water-emerging manitous as leading
    plotters; the elder brother lies in wait for them by the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At night, the elder brother sits alone without food and hears someone approach
    and tap at the doorway.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The approaching figure calls the elder brother by the name Masenapina and
    asks to be let in; the narrative identifies the speaker as the younger brother
    Kiyapa‘taa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder brother says he must not open the entry-way and tells the younger
    brother to go to the place of the going-down of the sun and live there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brother says uncles and aunts will come to the younger brother in
    that place and bring garments and food of the kind eaten by souls of the dead.
  category: speech
  evidence_refs:
  - ev:2
  - ev:10
- id: obs:5
  text: The elder brother hands out a burning billet, a drum, a rattle, and a bone
    fife to the younger brother outside.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Klyapa‘taa receives the objects, walks away, blows the bone fife, and taps
    the drum.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the drum is tapped, a company of followers rises whooping and goes singing
    toward the falling-down or setting of the sun.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A small number of uncles and aunts appear to journey with Klyapa‘taa, and
    the sounds of voices and drum gradually fade into the distance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wlsa‘ka seeks the manitous who took part in causing the death of Klyapa‘taa;
    wherever he finds them, he fights them with a club and slays them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The manitous become afraid and say that Wlsa‘ka will surely slay them all
    because they brought death on his younger brother.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: By the shore of the sea, a Chickadee flits close to Wlsa‘ka, sings, annoys
    him, and says it had meant to tell him about those who planned his younger brother's
    death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wlsa‘ka promises to color the Chickadee so it will be more beautiful if it
    tells him the information.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Wlsa‘ka blackens the Chickadee across the eyes with charcoal, and the Chickadee
    is pleased with the coloring.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Chickadee says two creatures on a sandbar in the sea led the plan that
