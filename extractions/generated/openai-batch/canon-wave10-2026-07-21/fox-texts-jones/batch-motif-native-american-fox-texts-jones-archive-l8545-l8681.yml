  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The next morning Wlsa‘ka goes to a mountain by the shore of the sea, lies
    in wait, and sees two manitous creeping out of the water.
  category: action
  evidence_refs:
  - ev:9
