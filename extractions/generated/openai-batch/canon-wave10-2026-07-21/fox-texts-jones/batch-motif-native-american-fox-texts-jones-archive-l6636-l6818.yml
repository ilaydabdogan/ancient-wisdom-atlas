canonical_text:
  quote: ''
  summary: The passage includes the end of a visit in which Woodpecker feeds Wisa'ka
    honey and Wisa'ka reports this to his grandmother. It then narrates Wisa'ka setting
    out in fine clothes, encountering a singing Artichoke or creature that repeatedly
    says anyone who eats it will keep easing himself, eating it despite this, suffering
    escalating bodily consequences, climbing a pine-tree, seeing his dung become mountain-like,
    bathing in a river, returning nearly naked, and telling his grandmother that his
    uncles and aunts took his clothes.
