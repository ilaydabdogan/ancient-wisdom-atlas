canonical_text:
  quote: ''
  summary: A blind father promises a costly rice offering to the temple Buddha after
    a priest says it will restore his sight and elevate his family. The debt troubles
    the daughter, who prays for her father and dreams of her mother descending from
    heaven to comfort her. The daughter then hears that a merchant seeks a young maiden
    as a sacrifice to appease an evil water spirit blocking his boats.
  language: English
