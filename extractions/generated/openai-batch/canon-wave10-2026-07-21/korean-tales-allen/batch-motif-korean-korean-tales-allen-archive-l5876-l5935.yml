canonical_text:
  quote: ''
  summary: Kil Tong recognizes the maiden he had rescued from robbers. She recounts
    her capture and rescue, then learns Kil Tong’s role. Kil Tong returns her and
    her companion to her parents. Her father, an island ruler under Korea’s king,
    publicly honors Kil Tong, betroths his daughter to him, and gives him official
    position. The people celebrate the lost daughter’s return, Kil Tong’s bravery,
    and his arrival as ruler. After marriage and prosperity, Kil Tong becomes sad
    from a presentiment that his father is dead or dying and prepares to go mourn
    at the grave.
  language: English
  quote_policy: summarized
