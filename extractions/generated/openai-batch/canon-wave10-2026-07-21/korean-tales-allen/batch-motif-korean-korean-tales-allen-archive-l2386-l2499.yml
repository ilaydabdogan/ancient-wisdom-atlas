canonical_text:
  quote: ''
  summary: 'Uhn Hah, traveling in male disguise with a servant while seeking You Pang
    Noo, receives successive signs and reports: a mysterious old man recognizes her
    true name, gives her a pill granting strength and courage, and vanishes with his
    hut by morning; a blind prophet identifies her mission and foretells that she
    will rescue her nearly dead husband; she reaches the war area, sees Pang Noo’s
    inscription on rocks, learns he has been taken captive by rebels, and sends a
    letter about the military corruption and false accusations surrounding him.'
  language: English
  quote_policy: summarized
