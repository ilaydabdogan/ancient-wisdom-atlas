  quote: ''
  summary: 'The passage catalogs Korean beliefs about birds and animals: a fragment
    about a sad lover, the cuckoo as a sad bird, a mountain bird as a warning of robbers
    and crop failure, the crow as disfavored and fever-bringing, the magpie as favored
    protector and time-dependent omen, the domestic goose as house-guard, and the
    wild goose as a wedding token commending constancy.'
