canonical_text:
  quote: ''
  summary: The passage recounts Pang Noo's gifted childhood, his departure to study
    under Nam Juh Oon while carrying a family feather fan believed to be a talisman,
    and a parallel episode in which Cho Sung Noo's wife, after praying for a child,
    dreams of a heavenly girl brought by winds on clouds. The dream girl says she
    was an attendant of the Queen of Heaven, banished to earth for disrupting the
    annual meeting of Ching Yuli and Kyain Oo by driving away the crows from their
    bridge across heaven's river, causing drought and mortal suffering. After the
    dream, Cho's wife gives birth to a beautiful daughter, Uhn Hah, popularly called
    the divine maiden before age ten.
  language: English
  quote_policy: summarized
