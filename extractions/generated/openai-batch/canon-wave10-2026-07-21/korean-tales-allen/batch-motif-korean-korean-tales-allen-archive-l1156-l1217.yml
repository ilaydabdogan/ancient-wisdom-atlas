  summary: An old wine-seller appears to draw his wine continually from a single old
    bottle, though he is not seen replenishing it. He has no children, but keeps an
    old dog and a cat as close companions. The dog is good-natured, while the cat,
    called Thomas, is playful and mischievous. The cat sometimes helps the dog against
    fleas but also plays pranks on him. The cat, dog, and old man live together contentedly.
