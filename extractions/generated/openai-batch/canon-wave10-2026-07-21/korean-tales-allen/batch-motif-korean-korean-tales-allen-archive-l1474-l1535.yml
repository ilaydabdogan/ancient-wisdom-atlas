canonical_text:
  quote: ''
  summary: After recovering a precious gem, the dog and cat set out to return good
    news to their mourning master. The dog plans a river crossing in which the cat
    carries the gem in his mouth while riding on the dog's back. Children laugh at
    the sight; the cat laughs too and drops the gem into the water. The dog dives
    for it, but the cat is dragged under, claws him, and the gem is not recovered.
    The dog turns against the cat, who climbs a tree while the dog barks below.
