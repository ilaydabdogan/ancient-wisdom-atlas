canonical_text:
  quote: ''
  summary: Uhn Hah is sheltered by a benefactor, petitions the king for troops to
    rescue her husband and defeat rebels, proves her prowess before the court, receives
    command, and leads an expedition. Rain stops the army until spirits of dead soldiers
    demand vengeance for deaths caused by the wicked General. After an execution,
    blood-scattering, and a feast for the spirits, the storm ends, the rebels are
    defeated, You Pang Noo is rescued, and the offending General is punished.
  language: English
  quote_policy: summarized
