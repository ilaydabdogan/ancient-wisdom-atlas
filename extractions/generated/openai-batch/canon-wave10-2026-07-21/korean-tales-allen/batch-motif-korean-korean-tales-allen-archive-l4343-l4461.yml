canonical_text:
  quote: ''
  summary: Ye Toh Ryung, troubled by reports about his imprisoned wife Chun Yang Ye
    and the conduct of an official, moves among common people, hears a song about
    unequal fate, questions an aged man, and learns that Chun Yang is said to be dying
    in prison. He enters the city, goes to her diminished household, is mistaken for
    a beggar by her mother, and is taken to the prison. Chun Yang recognizes his voice
    but cannot rise because of restraints. She reproaches his delay, rejoices at his
    return, then despairs at his poor appearance. He asks her to trust him. She tells
    her mother to sell concealed jewels to feed and clothe him and to treat him kindly.
  language: English
  quote_policy: summarized
