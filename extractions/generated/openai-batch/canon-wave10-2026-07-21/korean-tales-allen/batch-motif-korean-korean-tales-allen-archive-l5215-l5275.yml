canonical_text:
  quote: ''
  summary: The passage introduces Hong Kil Tong as the beautiful and unusually capable
    son of a concubine. Because of his birth status he is denied full legitimacy,
    mocked, and placed with slaves. He rebels against this treatment, turns toward
    soldierly training, and declares resistance to unjust human laws. Hong Pansa admires
    him but fears the consequences of his illegitimacy. Hong Pansa's wife and another
    concubine hate Kil Tong and consult sorceresses, who advise bringing in an old
    woman from the east gate to influence the father against him.
  language: English
  quote_policy: summarized
