canonical_text:
  quote: ''
  summary: Chun Yang and a young man share an elegant meal with wine and songs about
    youth, mortality, flowers, seed, and the moon. They renew their pledge and imagine
    a post-death union as flower and butterfly. The young man removes Chun Yang from
    the district geesang list because she is now married. His father is promoted to
    Secretary of Finance, requiring preparations to leave; the young man and Chun
    Yang despair over the impending separation, and he tries to console her with seasonal
    imagery and a promise of reunion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman leads the man to another room where a low table is laid with fruits,
    candied nuts, pickles, confections, preserved pears and grapes, and medicated
    wines in old bottles.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman pours wine and sings that it is the elixir of youth, wishing the
    man not to grow old and to stand like an unchanging mountain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A second song urges drinking while alive and mentions the grave, flowers dying
    so seed may be born, and the full moon waning so a young moon may rise.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The pair eat, drink, hear more song, discuss their contract, pledge themselves
    again, and extend the pledge into a future after death in which she would enter
    a flower and he would become a butterfly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father does not know of his son's alliance, while the young man removes
    Chun Yang's name from the district geesang list because she is now a married woman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The young man continues morning duties toward his father but spends each night
    at his wife's house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Reports of the father's honest administration reach the King, and the father
    is raised to Secretary of Finance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The father tells his son of the promotion and directs him to inform his mother
    so packing can begin; the young man is struck speechless and distressed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young man goes to Chun Yang; when she understands the news, despair seizes
    her, and the two look at each other helplessly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chun Yang says that if they separate it will be forever, that the order is
    like murder, and that if he goes to Seoul and leaves her she must die.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young man holds Chun Yang and compares the separation to cruel winter
    driving out spring and killing blossoms, while saying their hundred-year contract
    will make reunion more blissful.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Chun Yang asks how she can live alone with him in Seoul, describing long summer
    days, lonely winter nights, and lack of news about him.
  category: speech
  evidence_refs:
  - ev:9
