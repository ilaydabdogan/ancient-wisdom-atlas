canonical_text:
  quote: ''
  summary: After a young man’s excellent composition wins royal admiration, the King
    honors him with wine, flowers, official dress, and appointment. Ye Toh Ryung requests
    the private post of Ussa, partly to serve the King and partly to search for his
    wife. He disguises himself as a beggar, travels toward his former home, questions
    villagers, and learns from an old man that the local Magistrate is oppressive
    and has imprisoned and beaten Chun Yang Ye because she rejected him and remained
    faithful to her husband.
  language: English
  quote_policy: summarized
