    his wife while also doing good.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The King privately appoints him Ussa and gives him the seal of that office.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The new Ussa disguises himself as a beggar with straw sandals, a broken hat,
    uncombed hair, shabby clothing, and a dirty face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: He shows his seal at the stables, obtains attendants, and begins traveling
    toward his former home in the southern province.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At his destination he stays outside the city in a miserable hamlet while his
    servants go into the city to investigate the people and news.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: In spring, farmers plow with bulls and sing in praise of the just King, the
    peaceful prosperous country, and full stomachs.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The disguised Ussa jests with the farmers, who respond rudely, until an old
