- id: obs:2
  text: The King hears the composition read, admires its writing, composition, and
    sentiment, and learns the writer is the son of his favorite officer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King gives the young man three glasses of wine, a wreath of flowers, a
    court hat with lateral wings, and embroidered breast-plates.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man rides on a decorated horse with palace musicians and attendants
    and spends three days in public display.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the public display, the young man visits the graves of his ancestors,
    prostrates himself, and makes offerings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The King tells the young man to imitate his honest father and asks what position
    he wants.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ye Toh Ryung asks to undertake the duties of Ussa, saying prosperous harvests
    may tempt corrupt men to oppress the people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
