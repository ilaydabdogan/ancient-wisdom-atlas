canonical_text:
  quote: ''
  summary: Hong Kil Tong induces the Pochang to seek the feared thief in the mountains.
    The party enters a stronghold through a stone door; the guide disappears, the
    officer is surrounded and bound, and the guide is revealed seated in royal style.
    The officer is drugged, put in a bag, transported to a high mountain near the
    capital, and after recovering casts himself down and dies.
  language: English
