canonical_text:
  quote: ''
  summary: After a royal wedding, the King is so absorbed in Sim Chung that he neglects
    affairs of state. Sim Chung advises him to attend to rule by day and visit her
    by night, and he accepts her wisdom. Later she grieves for her blind father, tells
    the King she wishes to relieve blind men, and together they arrange a feast for
    all blind men in the country. Hidden in a pavilion, she watches the guests for
    three days. Near the end, a ragged old blind man arrives and is nearly turned
    away, but she orders that he be fed and clothed and then brought to her pavilion.
  language: English
  quote_policy: summarized
