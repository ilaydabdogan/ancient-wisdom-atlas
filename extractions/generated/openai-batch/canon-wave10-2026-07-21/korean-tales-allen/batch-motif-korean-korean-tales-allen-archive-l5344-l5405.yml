canonical_text:
  quote: ''
  summary: Kil Tong evades assassins, disarms them, and spares them under a promise
    not to kill. He then visits and heals his father, says farewell to his mother,
    departs southward, ascends remote mountains, and enters a hidden mountain plain
    through a movable stone door, where local men seize and question him.
  language: English
  quote_policy: summarized
