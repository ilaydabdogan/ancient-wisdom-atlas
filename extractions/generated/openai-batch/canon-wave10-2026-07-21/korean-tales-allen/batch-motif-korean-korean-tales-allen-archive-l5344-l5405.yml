  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Inside the stone door, Kil Tong finds an open plain surrounded by high inaccessible
    mountains, with over two hundred houses and many men.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The men in the hidden plain seize Kil Tong and ask who he is and why he is
