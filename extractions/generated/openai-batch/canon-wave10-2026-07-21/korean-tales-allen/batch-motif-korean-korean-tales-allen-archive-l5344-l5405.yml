- id: obs:4
  text: Music is heard, and a boy rides by on a donkey playing a flute; he takes away
    the assassins' weapons and reveals himself as Kil Tong.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kil Tong agrees not to kill the assassins only if they promise never to try
    to kill another man, and he warns that he will know if they break the promise.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kil Tong visits his father by night, and his father thinks he is a spirit
    and is afraid.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kil Tong gives his father medicine that instantly cures him, calls for his
    mother, says goodbye, and leaves for an unknown country.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father is glad Kil Tong escaped and loses affection for his wicked concubine;
    the concubine and her mistress are angry and try in vain to devise evil plans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kil Tong travels south and ascends lonely mountains; tigers are abundant,
    but he does not fear them and they do not molest him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On a barren peak covered by clouds, Kil Tong enjoys remoteness from people
    and laws, feels free and equal, and believes heaven is giving him powers not given
    to other men.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kil Tong sees a huge stone door in a bare rock wall, finds it movable, opens
