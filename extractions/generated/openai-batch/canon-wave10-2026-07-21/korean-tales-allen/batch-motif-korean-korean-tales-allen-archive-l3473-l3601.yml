canonical_text:
  quote: ''
  summary: 'The passage closes one tale by saying that a seed that enriched an honest
    brother ruined the cruel Nahl Bo, who must now live on his brother''s charity.
    It then opens another tale in Nam Won: Prefect Ye Tung Uhi has a dutiful young
    son, Ye Toh Ryung. In spring, Toh Ryung asks his valet about scenic places and
    goes to Kang Hal Loo, a mountain temple praised for its view and said to be frequented
    by spirits. There he sees a beautiful girl rising and falling in the air, first
    taking her for a spirit before realizing she is swinging in a courtyard. Her hairpin
    breaks during the play. The valet identifies her as Chun Yang Ye, Uhl Malls''
    daughter and a public dancing girl, and Toh Ryung orders her called.'
  language: English
  quote_policy: summarized
