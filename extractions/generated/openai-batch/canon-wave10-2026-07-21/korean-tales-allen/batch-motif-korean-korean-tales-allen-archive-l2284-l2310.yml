  quote: ''
  summary: An uncle explains the cause of a young man’s trouble to the father. The
    father realizes that a maiden of good parentage may have been selected by heaven
    for his son, regrets nearly punishing her over the fan and sending her away, questions
    attendants about the couple’s custody and departure, rewards a steward for kindness,
    and learns that the couple headed toward a district in civil war. He reproaches
    his son.
