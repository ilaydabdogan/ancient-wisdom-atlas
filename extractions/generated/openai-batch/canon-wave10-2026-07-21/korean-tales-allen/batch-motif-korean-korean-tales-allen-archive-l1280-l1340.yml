canonical_text:
  quote: ''
  summary: 'After the old man''s wine-jug is exhausted, neighbors gather and regret
    the loss of cheap good wine. The old man suspects he may have accidentally poured
    the secret bit of amber into a customer''s jug. His dog and cat listen, discuss
    how to help him, and adopt a plan to search every house: the cat will use smell
    indoors while the dog converses with dogs outside. They continue searching night
    after night despite failures and occasional fights.'
