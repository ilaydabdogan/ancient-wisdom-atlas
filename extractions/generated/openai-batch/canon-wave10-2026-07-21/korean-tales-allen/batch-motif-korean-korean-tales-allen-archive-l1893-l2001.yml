canonical_text:
  quote: ''
  summary: Uhn Hah, traveling with her nurse, rests by the roadside and encounters
    Pang Noo on his way to school. Mutual attraction leads to an exchange of oranges
    and an inscribed fan on which Pang Noo writes a betrothal vow. Uhn Hah stores
    the fan without reading it closely. Pang Noo excels at school, returns home, conceals
    the fan's absence from his father, remains preoccupied with Uhn Hah, refuses a
    proposed marriage alliance, and prepares to compete in a civil-service examination
    at the capital.
  language: English
  quote_policy: summarized
