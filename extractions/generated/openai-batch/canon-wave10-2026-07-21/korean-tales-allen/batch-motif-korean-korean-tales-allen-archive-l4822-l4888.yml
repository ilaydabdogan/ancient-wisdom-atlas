canonical_text:
  quote: ''
  summary: Sim Chung decides to offer herself in fulfillment of a dream, disguises
    her condition, secures three hundred bags of rice, delivers them to a priest,
    grieves for her father, prays to heaven for him, and finally tells him the truth,
    causing shared mourning with him and the neighbors.
  language: English
  quote_policy: summarized
