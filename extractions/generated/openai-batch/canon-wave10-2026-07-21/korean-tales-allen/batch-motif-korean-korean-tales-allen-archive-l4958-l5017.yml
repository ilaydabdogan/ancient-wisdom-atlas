canonical_text:
  quote: ''
  summary: Sim Chung is honored in the Sea King's palace. She protests that she is
    only a beggar's daughter who thought she was giving her life for her father. The
    Sea King reveals that she was formerly a star and cup-bearer in Heaven, punished
    by banishment to earth after favoring a lover with the King of Heaven's wines;
    that lover became the man she calls father. Heaven now rewards her filial piety.
    She rests and is restored in the Sea King's realm, then is prepared for return
    to earth inside a large nourishing flower.
  language: English
  quote_policy: summarized
