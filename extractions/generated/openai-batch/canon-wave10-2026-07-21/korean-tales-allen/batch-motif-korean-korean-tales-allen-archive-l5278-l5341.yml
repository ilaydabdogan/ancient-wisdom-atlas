canonical_text:
  quote: ''
  summary: A hag foretells Hong Kil Tong's future greatness and vengeance. His father
    imprisons him, while Kil Tong studies astronomy and resolves to leave for a distant
    country. A concubine urges the father to have him killed; assassins are summoned,
    but a spirit afflicts the father with disease. Shamans fail to expel the spirit
    and blame Kil Tong. Assassins return with swords and the hag. At night Kil Tong
    hears a crow caw three times.
  language: English
  quote_policy: summarized
