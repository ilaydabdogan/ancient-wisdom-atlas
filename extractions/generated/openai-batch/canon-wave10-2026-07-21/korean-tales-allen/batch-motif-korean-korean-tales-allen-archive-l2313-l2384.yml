- id: obs:1
  text: The father accuses his son of secretly pledging himself to a noble girl, letting
    her escape twice through silence, and nearly causing her death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father tells his son to stop idling, ask the king for military duty, go
    to the seat of war, and find his wife or his honor there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son arms himself with desperate resolve to save his sweetheart, whom he
    imagines endangered by rebels, and hurries to Seoul to request military service.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sovereign grants the request for service; the general in command is an
