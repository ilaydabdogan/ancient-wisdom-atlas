    Cho Gah’s face.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: He places the inscription conspicuously in the hope that Cho Gah will see
    it, know he is true to her, learn where he is, and come to him.
  category: action
  evidence_refs:
