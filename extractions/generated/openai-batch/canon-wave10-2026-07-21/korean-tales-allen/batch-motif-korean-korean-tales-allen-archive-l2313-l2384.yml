canonical_text:
  quote: ''
  summary: A father rebukes his son for failing to protect the noble woman to whom
    he pledged himself, and urges him to seek military duty so he can recover either
    his wife or his honor. You Pang Noo obtains royal permission for service, marches
    toward war, carves a message for Cho Gah on a mountain rock, wins a battle, suffers
    deprivation with his troops, and is finally defeated and captured by rebels who
    spare him for ransom.
  language: English
  quote_policy: summarized
