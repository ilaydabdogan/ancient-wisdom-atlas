canonical_text:
  quote: ''
  summary: Kil Tong travels to the capital with grave materials, statues, and rice.
    At his former home he is mistaken for a priest, selects a burial site for his
    dead father, reveals himself after the burial, mourns, repays the King’s loan
    by sending rice to the granaries, and returns home with his true mother and his
    father’s legal wife. The legal wife dies soon after, while Kil Tong’s slave-mother
    lives many peaceful years in his household among his children and descendants.
  language: English
