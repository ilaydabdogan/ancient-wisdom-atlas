canonical_text:
  quote: ''
  summary: An ill sovereign with an unremoved hook summons the officials of his kingdom.
    The turtle proposes that a poultice made from the fresh eye of a rabbit will cure
    the sovereign, then offers to bring the rabbit to the palace while doctors handle
    the bloody work. The turtle climbs to a hillside, meets the rabbit, and praises
    the underwater realm so attractively that the rabbit follows as the turtle turns
    to go.
  language: English
  quote_policy: summarized
