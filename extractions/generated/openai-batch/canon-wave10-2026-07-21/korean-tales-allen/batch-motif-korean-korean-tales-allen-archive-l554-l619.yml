canonical_text:
  quote: ''
  summary: 'A descriptive account of evening and night in Seoul: households cook,
    heat stone sleeping floors, and smoke; a central bell and gate music mark the
    closing of the city gates; men leave the streets while women move about veiled
    with paper lanterns; night sounds include dogs and rhythmic laundry beating by
    women.'
