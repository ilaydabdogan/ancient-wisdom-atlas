canonical_text:
  quote: "“The wicked Governor that robs the people is relieved of his ill-gotten
    gains by Kil Tong—the people’s avenger.”"
  summary: Kil Tong plans and carries out a raid against a hated, wealthy governor
    by using a fire as a diversion, taking valuables from the governor’s yamen, and
    leaving a written claim that he has avenged the people. After his escape, rewards
    are offered for his capture. The prison officer Pochang searches for him in disguise
    and unknowingly meets Kil Tong, also disguised, at an inn.
