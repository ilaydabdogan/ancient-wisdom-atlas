canonical_text:
  quote: ''
  summary: A band of dancing girls emerges and performs songs about deities, ritual
    offerings, an ancient tree, seasonal time, and New Year renewal before demanding
    payment. Nahl Bo is urged to stop opening more objects, but another is opened
    after a yellow substance is mistaken for gold. An acrobatic pair emerges and performs
    a song about an ancient king's hidden cavernous palace, which is exposed to daylight
    by an enemy, causing the beautiful women inside to disappear. Nahl Bo pays them
    and opens another object, from which a jester begins to emerge as the passage
    breaks off.
  language: English
  quote_policy: summarized
