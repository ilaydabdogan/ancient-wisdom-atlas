canonical_text:
  quote: ''
  summary: A long-awaited daughter, Sim Chung, grows with unusual beauty, health,
    and wisdom, and guides her visually impaired father. After her mother dies, the
    father becomes totally blind and the household falls into poverty. When he is
    forced to beg, he falls into a ditch and meets an old mountain-temple priest who
    says his blindness is not incurable and refers to a vision and an offering.
  language: English
  quote_policy: summarized
