canonical_text:
  quote: ''
  summary: A suffering daughter and wife is criticized by her mother but supported
    by neighbors and a jailer. She prays, asks to be buried near the route of her
    husband Toh Ryung if she dies, and later dreams that a mirror he gave her breaks.
    A blind man interprets the dream, including a bird entering the room, as good
    news rather than death, casts sticks, and says Toh Ryung has passed his examinations,
    been promoted, and will come to her. The passage then turns to Toh Ryung’s intense
    study, a royal guaga examination, and his inspired composition before the king
    and officers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Neighbors rebuke the old woman’s criticism of the daughter, reassure the daughter,
    and bring food to ease her miserable condition.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daughter spends a night bowing before Heaven and calling on the gods and
    her husband to release her.
  category: action
  evidence_refs:
