- id: obs:3
  text: She tells her mother she is still alive but dying and asks that, after death,
    her body be taken to Seoul and buried near the road most used by Toh Ryung.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Her mother scolds her for her devotion, and the daughter defends her own choice
    while asking her mother not to add unkindness to her grief.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Months pass while she remains ill and seemingly indifferent to time; the jailer’s
    kindness helps keep her alive.
  category: sequence
