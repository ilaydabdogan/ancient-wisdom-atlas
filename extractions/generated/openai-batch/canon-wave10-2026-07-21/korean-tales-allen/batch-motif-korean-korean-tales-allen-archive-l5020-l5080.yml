canonical_text:
  quote: ''
  summary: A strange flower containing Sim Chung rises to the sea surface where she
    had plunged in. A merchant retrieves it and presents it to the King, who houses
    it in a glass house. Sim Chung comes out at night; the King sees her, and the
    flower vanishes. She says she is human, not a spirit. Court officials report an
    auspicious star descending onto the palace, and the King is advised to marry the
    remarkable maiden.
