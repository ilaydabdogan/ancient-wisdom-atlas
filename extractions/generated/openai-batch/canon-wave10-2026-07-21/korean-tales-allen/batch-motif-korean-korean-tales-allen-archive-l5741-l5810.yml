canonical_text:
  quote: ''
  summary: In a passage from the Hong Kil Tong tale, an opening sentence reports a
    cloud-borne removal amid music. Later, the King and attendants sit in the moonlit
    royal gardens when a flute is heard above and a man descends on a stork. The man
    identifies himself as Hong Pansa, Kil Tong's new title, makes obeisance, and seeks
    confirmation of rank. The King acknowledges that Kil Tong is difficult to destroy
    because he can read unspoken thoughts and notes that the stigma of Kil Tong's
    birth has been removed. Kil Tong asks for three thousand bags of rice so that
    he may leave for a distant land and trouble the country no more. The King grants
    the order; junks take the rice from the royal granaries at daybreak. Kil Tong
    then sails to an uninhabited island, stores wealth there, and teaches his people
    to till the soil.
  language: English
  quote_policy: summarized
