  quote: ''
  summary: After failing to find the missing object in their neighborhood, the cat
    and dog search across the frozen river for their poor old master. The cat detects
    the odor of the coveted gem in a house across the river and traces it to a sealed
    soapstone tobacco box on top of a clothes-press. Unable to open or move the box,
    the cat consults the dog, who proposes asking the chief of the local rat guild
    for help in exchange for ten years of protection from the cat and dog.
