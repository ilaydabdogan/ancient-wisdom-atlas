canonical_text:
  quote: ''
  summary: A departing lover gives Chun Yang Ye a crystal mirror as a pledge of return,
    and she gives him a jade ring as a keepsake while urging him to study in Seoul
    and return with rank. After he leaves and devotes himself to study, a new magistrate
    in Nam Won hears of Chun Yang Ye’s beauty, rejects the claim that she is no longer
    a dancing girl because of her marriage, and orders her brought to court. She refuses
    to appear as a gee sang, insists that she is a married lady, and is chained and
    imprisoned by the angry official.
  language: English
  quote_policy: summarized
