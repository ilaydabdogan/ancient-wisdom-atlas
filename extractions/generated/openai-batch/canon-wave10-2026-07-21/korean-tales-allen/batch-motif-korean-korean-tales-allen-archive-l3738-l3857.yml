canonical_text:
  quote: ''
  summary: A young man gives Chun Yang Ye a written pledge of lifelong faithfulness
    and says their marriage cannot be undone by his father. She directs him to her
    mother's house near bamboos. After parting at sunset, he returns home but is overcome
    with longing, waits until his father sleeps, scales the back wall with a servant,
    and goes to Chun Yang Ye's house. He is admitted by her mother and enters a richly
    described house and secluded garden before Chun Yang Ye welcomes him into her
    parlor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young woman asks the young man to put his promises in writing because
    spoken words may be forgotten or spread.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man writes a memorandum saying he met his heaven-sent bride at Kang
    Hal Loo, pledges himself for one hundred years as a faithful husband, and says
    the paper may be shown to the magistrate if he changes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man says that he and the young woman are now married, that his father
    cannot change it, and that he will remain hers even if disowned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young woman points to a clump of bamboos as the location of her house
    and tells him to come to her mother's house as much as filial duty allows.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At sunset the pair part and return home with their respective attendants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At home, Ye Toh Ryung cannot read properly, thinks of Chun Yang Ye, sings
    of wanting to see her, and loses patience while waiting for evening.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After his father sleeps, Ye Toh Ryung takes a trusted servant, climbs over
    the back wall, and hurries to Chun Yang Ye's house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: As they approach, they hear harp music and a song about the slow passage of
    hours when a lover is away; the mother admits him with some distrust and sends
    him to her daughter's apartments.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The house includes a blue lantern, poetry banners, a door banner with blessings
    for long life and descendants, a moonlit garden, a miniature lake with lotus plants,
    swans, fish, blossoms, bamboo, and willows.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Chun Yang Ye comes out, invites him into her parlor, and takes both his hands.
  category: action
  evidence_refs:
  - ev:10
