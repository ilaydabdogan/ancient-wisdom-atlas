canonical_text:
  quote: "“this fan shall be my husband till death liberates my spirit”"
  summary: Pang Noo, acting in disguise to expose corrupt officials, also hopes to
    discover his absent beloved. Uhh Hah dreams of him, discovers a hidden message
    on a fan, and vows fidelity to him as her heaven-arranged spouse. A powerful general
    seeks to betroth his son to her, but she refuses and reveals her prior pledge.
    Her parents decline the match; the angered general orders Mr. Cho imprisoned until
    he consents. An honest magistrate believes the family and helps them flee to another
    province while reporting that they escaped.
  language: English
