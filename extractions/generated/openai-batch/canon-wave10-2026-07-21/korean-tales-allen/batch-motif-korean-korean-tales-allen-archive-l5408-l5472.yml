canonical_text:
  quote: ''
  summary: Kil Tong meets a band called thieves who despoil officials and help the
    poor, accepts their life-or-death entry conditions, proves his strength by hurling
    a huge rock, and joins through a blood-mingling contract and feast. He then proposes
    a plan to despoil a wealthy mountain Buddhist temple guarded by priests, disguising
    himself as a betrothed youth and presenting himself to the head priest as the
    son of Hong Pansa sent for education with offerings.
  language: English
  quote_policy: summarized
