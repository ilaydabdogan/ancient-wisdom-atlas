canonical_text:
  quote: ''
  summary: Nahl Bo hears a familiar bird-song and receives a seed from a crooked-legged
    bird. He plants it, and luxuriant vines cover his property and produce twelve
    enormous gourds. He guards the gourds and conceals the secret while Hyung Bo is
    said to conceal it for fear that others will harm birds. The vines and rainy season
    damage Nahl Bo's house. After frost, the gourds are lowered into the court, and
    Nahl Bo hires a carpenter to open them at a high price, expecting great wealth.
  language: English
  quote_policy: summarized
