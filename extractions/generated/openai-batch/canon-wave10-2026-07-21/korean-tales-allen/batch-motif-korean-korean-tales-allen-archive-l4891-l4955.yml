canonical_text:
  quote: ''
  summary: A stranger provides rice support for Sim Chung's father before she departs
    for the sea. Sim Chung is taken by boat to the place of an evil spirit, where
    a food offering fails; she prays, bids farewell, and leaps into the sea, after
    which the waters calm and the boats pass safely. She awakens in a fish-drawn boat
    attended by maidens who say they serve the King of the Sea and are taking her
    to his palace. She sees an opulent underwater palace and a royal procession of
    the Sea King.
  language: English
  quote_policy: summarized
