  quote: ''
  summary: A poor household waits for food after a boy returns empty-handed from seeking
    help. The mother sells her straw shoes to buy a little food. Hyung Bo returns
    with firewood, then seeks work, helping a burdened boy and carrying a letter for
    payment. He later agrees to take a rich prisoner's public beating in exchange
    for cash, and returns home injured.
