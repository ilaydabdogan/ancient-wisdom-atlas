canonical_text:
  quote: ''
  summary: Kil Tong travels to obtain deadly mineral poison used on arrows, notices
    a reward proclamation for a stolen young lady, enters mountain regions, finds
    a rocky lair where a chief torments the young lady, wounds the chief with a poisoned
    arrow, then is captured. He claims to be a physician, poisons the chief under
    the guise of treatment, summons spirits to destroy the band, and then opens a
    door to find two covered-faced women before the passage breaks off.
  language: English
  quote_policy: summarized
