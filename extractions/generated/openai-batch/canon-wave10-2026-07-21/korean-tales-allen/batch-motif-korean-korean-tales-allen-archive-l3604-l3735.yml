canonical_text:
  quote: "“Heaven must have intended us to be man and wife”"
  summary: A servant summons Chun Yang Ye, a gee sang known as Fragrant Spring, to
    meet Ye Toh Ryung, the Governor’s son, after he sees her swinging. The young nobleman
    praises her beauty, discovers that they are the same age and share nearly the
    same birthday during the lantern festival, interprets this as divine intention
    for marriage, and pleads for her to marry him. She objects because of class, parental
    consent, and fear of abandonment; he promises never to forsake her or marry another.
  language: English
  quote_policy: quoted
