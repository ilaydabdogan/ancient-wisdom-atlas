canonical_text:
  quote: ''
  summary: In this Hong Kil Tong episode, trouble is attributed to Kil Tong in all
    eight provinces, and eight identical Kil Tongs are brought before the king. An
    attempted identification by a scar fails because all eight display the mark; when
    they are to be killed, they are found to be straw and wax figures. A palace-gate
    letter then demands the rank of Pansa to remove the stigma of slave birth, the
    court plans an ambush under cover of granting the rank, and Kil Tong arrives knowing
    of the plan.
  language: English
  quote_policy: summarized
