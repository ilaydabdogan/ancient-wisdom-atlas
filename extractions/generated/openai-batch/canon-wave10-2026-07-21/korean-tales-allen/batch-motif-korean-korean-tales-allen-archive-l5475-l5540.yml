canonical_text:
  quote: ''
  summary: Hong Kil Tong uses a staged visit, false rice tribute, and disguised robbers
    to deceive priests during a feast. He creates a pretext with a hidden pebble,
    signals his accomplices to bind the priests and servants, plunders valuables,
    and then misleads soldiers by disguising himself as a priest while the robbers
    escape by another road. The episode ends with Kil Tong gaining a wider reputation
    as leader of a band able to perform marvelous feats.
  language: English
  quote_policy: summarized
