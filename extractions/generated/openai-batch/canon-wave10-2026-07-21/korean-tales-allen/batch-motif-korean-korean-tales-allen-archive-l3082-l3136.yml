canonical_text:
  quote: ''
  summary: Nahl Bo visits after hearing of Hyung Bo’s sudden prosperity. Hyung Bo
    explains that he rescued and healed a bird, received a gold-inscribed seed in
    return, planted it, and gained gifts from four gourds. Nahl Bo demands goods and
    then the maiden; Hyung Bo gives some gifts but refuses the maiden. Nahl Bo leaves
    angry and tries to reproduce the event by harming birds, breaking one bird’s legs
    and binding them. The injured bird reports Nahl Bo’s cruelty to the bird king,
    who gives it a seed for the wicked man.
  language: English
  quote_policy: summarized
