canonical_text:
  quote: ''
  summary: A disguised Ussa uses the Magistrate's drunken birthday feast to enter
    the yamen as a supposed beggar. After being mocked, fed, and insulted, he writes
    accusatory verses about official oppression, reveals the King's seal, summons
    followers, has the Magistrate bound and sent to the capital, and then reveals
    himself to the imprisoned Chun Yang Ye, who faints on recognizing her lover. Her
    mother hears the news and rejoices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ussa's attendants tell him that the next day is the Magistrate's birthday
    and that a large feast with wine, music, and gee sang performances is being prepared.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disguised Ussa presents himself at the yamen gate, is jeered at as a beggar,
    is driven away, and later enters through the inner gate and then by a break in
    the outside wall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The host, described as red with wine, orders the intruder ejected, but later
    allows him food and wine in a corner after the guests urge him to humor the man.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The disguised Ussa asks to be treated like the other guests by having a gee
    sang sing while he drinks; the girl insults his appearance and sings a song wishing
    him speedy death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After enduring taunts, the Ussa says he will amuse the guests with verses
    and writes that the oil enriching official food is the lifeblood of downtrodden
    people and that their tears are treated like candle drippings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the verses are read, the guests become troubled, say the words mean ill
    for the host, and begin making excuses to leave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The host orders attendants to seize the intruder and cast him into prison,
    but the Ussa reveals his official seal and gives a prearranged signal that summons
    his followers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the sight of the King's seal, the half-drunken men become terrified; the
    host tries to crawl under the house, is caught, and is bound with chains.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: One fleeing guest gets the topknot of his hair caught in a rat-hole and yells
    for mercy, thinking captors have seized him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Ussa changes into decent clothes, gives orders calmly, sends the Magistrate
    to the capital, and begins looking into the affairs of the office.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Ussa sends a chair for Chun Yang Ye and orders his servants not to explain
    what has happened; she thinks the drunken Magistrate has sent for her to kill
    her and asks for Toh Ryung.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Chun Yang Ye's shackles are removed and she is brought to the yamen; after
    the Ussa addresses her first in a changed voice and then in his own voice, she
    looks up, recognizes her lover in proper guise, tries to run to him, and faints.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The old woman brings food as a last service to her daughter, hears the good
    news outside, throws down the dishes, and cries out joyfully about the cruel magistrate's
    birthday surprise.
  category: action
  evidence_refs:
  - ev:9
