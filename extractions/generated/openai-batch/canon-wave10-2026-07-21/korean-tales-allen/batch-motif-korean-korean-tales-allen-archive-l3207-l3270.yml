canonical_text:
  quote: ''
  summary: In this excerpt, Nahl Bo has gourds opened while expecting riches. The
    first gourd releases rope-dancers who perform and demand payment. The second releases
    Buddhist priests asking offerings for a temple and promising many sons. The third
    releases paid mourners with a corpse and bearers, who demand payment for mourning
    and burial. Nahl Bo repeatedly pays 5,000 cash, blames the hare-lipped carpenter,
    and then anxiously watches as work begins on a fourth gourd.
