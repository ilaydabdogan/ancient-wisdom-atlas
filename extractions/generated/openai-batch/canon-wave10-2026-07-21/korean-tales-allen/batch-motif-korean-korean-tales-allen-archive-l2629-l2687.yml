canonical_text:
  quote: ''
  summary: 'The opening of the tale introduces two married brothers in Chullado, southern
    Korea: Nahl Bo, the elder, is rich and keeps the inheritance, while Hyung Bo,
    the younger, is poor, has several children, and lives with his wife in severe
    hardship. The passage contrasts their households and describes Hyung Bo’s family
    reaching a state of hunger so extreme that no rice remains.'
