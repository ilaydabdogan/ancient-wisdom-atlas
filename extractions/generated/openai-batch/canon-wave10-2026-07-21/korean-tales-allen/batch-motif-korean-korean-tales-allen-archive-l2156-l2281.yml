canonical_text:
  quote: ''
  summary: Pang Noo searches unsuccessfully for Uhn Hah and becomes ill with longing.
    Uhn Hah’s banished parents die in a distant hamlet, leaving her with her old nurse.
    The two women disguise themselves as unmarried men and travel. They are seized
    by Pang Noo’s father, the Governor, because of Uhn Hah’s distinctive feather fan.
    Uhn Hah refuses to sell the fan, saying it represents her husband, and is imprisoned.
    In sleep she dreams of women in a palace above who show her blood-red reeds dyed
    by tears shed during searches for lovers; one woman foretells that Uhn Hah will
    receive superhuman powers and soon find her faithful lover, now a high official.
    She is released with provisions and money. Pang Noo returns home weary, refuses
    court service, and avoids marriage proposals.
  language: English
  quote_policy: summarized
