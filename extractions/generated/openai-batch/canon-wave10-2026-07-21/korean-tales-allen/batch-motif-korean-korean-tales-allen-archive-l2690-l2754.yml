  summary: A starving household sends a boy to ask his wealthy uncle for a loan of
    rice. The boy passes abundant animals and a servant at the uncle's house, states
    that the family has had no food for three days, and the uncle refuses, citing
    locked stores and animals before throwing him into the outer court.
