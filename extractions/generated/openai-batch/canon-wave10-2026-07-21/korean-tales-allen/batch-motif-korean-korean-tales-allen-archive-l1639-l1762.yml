canonical_text:
  quote: ''
  summary: The passage introduces two star attendants of the Sun who marry, neglect
    their duties through mutual devotion, and are banished to opposite sides of the
    Milky Way, meeting only briefly once a year when crows build a bridge; their tears
    explain seasonal rain. It then begins the tale of a wise retired official and
    his gifted wife, who are childless, pray for a son, and receive a dream in which
    a boy attendant of the North Star descends on a white feather fan and announces
    his banishment to earth before a beautiful son is born to them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ching Yuh and Kyain Oo are described as stars attendant upon the Sun who fall
    in love, receive royal permission, and marry.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their constant embrace and exclusive devotion to each other make them unfit
    for their duties, leading their master to punish them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The master banishes the pair to opposite sides of the heavenly plains, divided
    by the great river identified parenthetically as the Milky Way.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The journey between their posts requires six months each way, so they can
    spend only one short night together in a year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: They can cross the broad river only when crows complete a great bridge, carrying
    construction materials on their heads during the seventh moon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage explains the bald and worn heads of crows during the seventh moon
    as the result of carrying bridge materials.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The couple’s grief after their brief meeting is said to produce tears so copious
    that the earth is deluged with rain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The meeting is said to occur on the night of the seventh day of the seventh
    moon, unless an untoward circumstance prevents it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: If the meeting is prevented, the usual rainy season is withheld and the parched
    earth joins the lovers’ lamentation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: You Tah Ju no, later printed as You Tah Jung, is described as a wise and good
    official who retires from court because he cannot endure corrupt official practices.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: You Tah Ju no and his gifted wife have a happy, sympathetic marriage but no
    children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: You Tah Ju no grieves that, as the last of an illustrious family, his line
    may cease and no descendant will make offerings at his grave.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: His wife asks him to take another wife to remove their reproach, and he refuses
    because he does not want to disturb their home.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The couple pray continually to heaven for a son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: While praying, the wife dreams of a commotion near the North Star and a beautiful
    boy descending to her on a white feather fan.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The dream boy says he is the attendant of the great North Star, has been banished
    to earth for a term of years, and has been sent with a fan that will save both
    his life and the woman’s life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: In the following spring, a beautiful boy is born to the couple, and his mental
    graces later prove even more remarkable than his physical beauty.
  category: sequence
  evidence_refs:
  - ev:8
