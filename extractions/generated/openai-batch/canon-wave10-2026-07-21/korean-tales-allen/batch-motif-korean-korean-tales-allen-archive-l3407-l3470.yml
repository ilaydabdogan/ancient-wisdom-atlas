canonical_text:
  quote: ''
  summary: In this passage, a paid practitioner is dismissed after harshly treating
    the wife's husband. The tenth gourd releases blind fortune-tellers who chant to
    world-bearing spirits and cast dice before being paid off. Another gourd releases
    a thunder-voiced giant who seizes Nahl Bo until his wife promises ransom. The
    carpenter then opens the last gourd because the household is out of food and money;
    it releases a stench, a severe gale, and a fire that destroys the remaining property.
  language: English
  quote_policy: summarized
