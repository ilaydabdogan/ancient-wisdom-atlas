canonical_text:
  quote: ''
  summary: A cat and dog try to recover a gem from a box by arranging for rats to
    gnaw a hole. The dog gives plans, the cat negotiates with the rat, and a contract
    protects the rat. After months, the hole is made but too small; the cat cannot
    reach the gem, and a mouse is sent in, though the mouse and gem cannot pass back
    through the opening.
