  quote: ''
  summary: After a quarrel involving a dog and a cat, the cat avoids dogs and shows
    fear responses that the narrator presents as explaining cat behavior and the relative
    rarity of cats. The dog continues searching for a lost gem in the river. In winter,
    he sees a man spearing fish through the ice, steals a caught fish, and brings
    it to his impoverished master. When the master cuts open the fish, the lost gem
    falls out. The old man stores the gem and prepares to resume his former fortune.
