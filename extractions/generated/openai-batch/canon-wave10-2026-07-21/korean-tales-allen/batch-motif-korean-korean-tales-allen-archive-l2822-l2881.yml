canonical_text:
  quote: ''
  summary: After an unpaid and unjust whipping, Hyung Bo consoles his wife by saying
    that doing right will lead to success. In spring the poor household cleans and
    decorates its door with legends asking the fates for prosperity. Swallows nest
    under the weak eaves; Hyung Bo worries for them, and the family later feeds the
    hatchlings despite having little food. A roof-snake devours several young birds,
    and one injured bird falls into a reed blind. Hyung Bo and his wife rescue it,
    bind its broken legs with dried fish-skin splints, keep it warm, and it begins
    to recover.
  language: English
  quote_policy: summarized
