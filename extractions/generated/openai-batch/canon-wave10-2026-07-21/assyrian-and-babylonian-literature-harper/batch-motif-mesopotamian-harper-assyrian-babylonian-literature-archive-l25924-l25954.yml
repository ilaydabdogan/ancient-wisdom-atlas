  quote: Accept from me the upuntu plant and receive my supplication.
  summary: A first-person supplicant addresses a divine mistress identified as Bau,
    offers an upuntu plant and a supplication, asks that angry personal and city deities
    return and be pacified, and appeals to Marduk for protection, compassion, favor,
    life, and accepts a posture of humility.
