- id: obs:3
  text: Before sunset, an offering for Gula is prepared with pure water, unleavened
    wheat bread in counted amounts, salt, a young ram, and a censer strewn with cypress
    twigs and fine flour and poured over with sesame wine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A seer is instructed to arise and go before a broken object or figure; the
