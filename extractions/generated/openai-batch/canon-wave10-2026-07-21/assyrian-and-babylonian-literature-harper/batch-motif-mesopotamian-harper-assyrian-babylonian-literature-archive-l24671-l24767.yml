  quote: ''
  summary: A fragmentary ritual instruction passage directs an addressed ritual agent
    to consecrate himself, wear a clean garment, prepare offerings for named and titled
    recipients, arrange tables and censers with bread, wine, water, animal portions,
    and aromatic plant materials, prostrate himself, and take the sacrificer's hand
    while reciting a formula.
  language: English
  quote_policy: summarized
