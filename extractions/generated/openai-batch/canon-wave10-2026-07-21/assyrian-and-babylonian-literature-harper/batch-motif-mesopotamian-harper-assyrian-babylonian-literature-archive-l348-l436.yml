canonical_text:
  quote: ''
  summary: 'The passage recounts nineteenth-century Assyrian and Babylonian excavations:
    Layard''s work at Nimrud and Nineveh, Canning''s funding and gift of finds to
    the British Museum, Rassam''s discovery of Ashurbanipal''s North Palace and library,
    other French and British excavations, and the loss of some excavation results
    in a Tigris shipwreck.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sir Stratford Canning provided money that enabled Layard to begin excavations
    at the ruins of Nimrud, where the work was described as successful from the beginning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During two years of work Layard laid bare three large Assyrian palaces, including
    the Northwest palace of Ashurnagirpal, the Central palace probably built by Shalmaneser
    II, and a palace of Esarhaddon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Central palace yielded the Black Obelisk of Shalmaneser, and the Northwest
    palace produced especially rich returns with better-preserved inscriptions than
    those found by Botta at Khorsabad.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Canning presented the results of Layard's expedition to the British Museum,
    and Layard shipped them there himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Layard's published account created public interest in England, after which
    the English Government supported his return to Assyria with Hormuzd Rassam ordered
    to join him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the second expedition Layard worked at Kouyunjik, the site of Nineveh;
    the passage contrasts his approach with Botta's earlier unsuccessful shaft-sinking
    at the mound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Layard's second trip fully brought to light the Southwest palace of Sennacherib
    as restored by Ashurbanipal; the building is described as the largest yet found
    and as containing seventy-three rooms.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Excavations at Nebbi Yunus and Qal'at Sherkat produced royal palaces, inscriptions,
    palace foundations, and a large eight-hundred-line cylinder belonging to Tiglath-pileser
    I.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Hormuzd Rassam's expedition discovered and laid bare the North palace of Ashurbanipal,
    where the Library of Ashurbanipal with thousands of clay tablets inscribed on
    both sides was found.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Victor Place continued work at Khorsabad, while Loftus, Fresnel, Oppert, and
    Taylor began or described excavations and ruins in Babylonia.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A boat carrying results of the French excavations was wrecked in the Tigris,
    so the inscriptions being shipped to Paris were lost.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that these expeditions mark the end of the first period
    of Assyro-Babylonian excavations.
  category: sequence
  evidence_refs:
  - ev:6
