canonical_text:
  quote: ''
  summary: The passage closes Tablet VI with Ishtar gathering attendants and lamenting
    over the heaven-bull, while Gilgamesh displays and dedicates the bull's horns,
    washes in the Euphrates, returns through Erech, receives acclamation, and holds
    a feast. Eabani then dreams and asks Gilgamesh why the great gods have taken counsel.
    The following editorial and fragmentary material links Tablets VII and VIII with
    Eabani's dream, his death brought about by Ishtar, a forest gate and exceptional
    tree, and Eabani's sickness over twelve days.
  language: English
  quote_policy: summarized
