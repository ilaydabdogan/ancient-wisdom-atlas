canonical_text:
  quote: Ishtar has gone down into the earth, and has not yet come forth
  summary: 'The passage describes the effects of Ishtar''s descent to the land of
    No-Return: sexual union among animals and humans ceases, Pap-sukal and Shamash
    mourn, and Shamash reports the situation to Sin and Ea. Ea creates Uddushunamir
    and sends him to Allatu. Allatu curses Uddushunamir, then orders Namtar to summon
    the Anunnaki, sprinkle Ishtar with the water of life, bring her forth, and restore
    her garments and ornaments as she is led through the gates.'
  language: English
  quote_policy: quoted
