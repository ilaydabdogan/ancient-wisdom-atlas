canonical_text:
  quote: ''
  summary: 'The passage presents editorial notes and excerpts from Assyrian and Babylonian
    royal correspondence: astrological and divinatory letters by Balasi, Nabu-akhe-erba,
    and Arad-Ea invoking deities and evaluating auspicious conditions for a journey
    or praying for the king’s life; and medical letters by Arad-Nana reporting treatment
    of eye disease and opening a report on nosebleed.'
  language: English
