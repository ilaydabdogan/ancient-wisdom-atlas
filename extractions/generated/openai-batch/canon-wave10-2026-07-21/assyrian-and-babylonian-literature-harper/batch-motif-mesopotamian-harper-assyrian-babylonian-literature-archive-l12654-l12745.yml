  text: Vahyazdata, who called himself Bardiya, came with an army against Artavardiya
    near Rakha in Persia, and Darius says his army defeated Vahyazdata's army under
    the protection of Ahura-mazda.
  category: sequence
  evidence_refs:
  - ev:1
