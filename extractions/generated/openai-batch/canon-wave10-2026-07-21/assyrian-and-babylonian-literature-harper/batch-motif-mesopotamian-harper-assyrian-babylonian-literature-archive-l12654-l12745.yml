  summary: Darius recounts campaigns against Vahyazdata, rebel forces in Arachosia,
    and Arahu in Babylon. The passage repeatedly attributes Darius's victories to
    Ahura-mazda, describes rebels claiming royal identities, records defeats and captures,
    and reports crucifixions of leading rebels.
