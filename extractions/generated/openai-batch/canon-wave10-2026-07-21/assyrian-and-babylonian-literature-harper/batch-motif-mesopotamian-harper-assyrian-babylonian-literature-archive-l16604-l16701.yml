  summary: A sequence of translated Assyrian and Babylonian letters includes medical
    advice about nasal hemorrhage, Ishtar-duri sending physicians to the king and
    requesting temple inscriptions, a petition about storing bottled wine, and Tab-gil-Eshara
    reporting ships, ferry use, and transport of supplies. Several letters address
    the king and include formulaic blessings by named deities.
  language: English
