canonical_text:
  quote: ''
  summary: Gilgamesh, reassured by the scorpion-man's friendly gaze, says he intends
    to reach Per-napishtim, his ancestor, who has been taken into the gods' assembly
    and is associated with power over life and death. The scorpion-man warns of the
    dangerous passage through the mountain of Mashu and its twelve miles of darkness,
    but opens the mountain gate for him. Gilgamesh proceeds through the darkness,
    leaves the mountain, reaches the shore of the sea, and sees a dazzling precious
    tree with jewel-like fruit and branches.
  language: English
