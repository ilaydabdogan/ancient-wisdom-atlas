canonical_text:
  quote: ''
  summary: Darius states that Ahura-mazda gave him sovereignty, says he restored kingship,
    temples, sustenance, and peoples after Gaumata, and recounts rebellions by claimants
    in Elam, Babylon, and Media, including battles at the Tigris and Euphrates and
    the capture or killing of rebel leaders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Darius says that by the will of Ahura-mazda he became king and that Ahura-mazda
    gave him sovereignty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Darius says he restored sovereignty that had been taken away from his family
    and established it again in its original place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Darius says he restored temples of the gods, sustenance for people and flocks,
    habitation of houses, and peoples to their places under Ahura-mazda's protection.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gaumata the Magian is described as having destroyed temples and taken away
    sustenance, habitation, and the royal house's place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Atrina, son of Upadarma, rose up in Susa and declared himself King of Elam;
    the Elamites became hostile to Darius and went over to Atrina.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nidintu-Bel, a Babylonian son of Aniri, rose up in Babylon, deceived the people
    by claiming to be Nebuchadrezzar son of Nabonidus, and seized the sovereignty
    of Babylon after the Babylonian people went over to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Darius says Atrina was brought bound to him from Susa and that he slew him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Darius marched toward Babylon against Nidintu-Bel; the hostile force was positioned
    on ships or river banks at the Tigris, and Darius crossed the Tigris under Ahura-mazda's
    protection after dividing and mounting his army.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Darius says he smote the army of Nidintu-Bel in a battle fought on the twenty-sixth
    of Kislev.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Zazanu on the Euphrates, Nidintu-Bel came out with his host to battle;
    Darius says Ahura-mazda supported him, the enemy was driven into the water, and
    the water carried the enemy away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Nidintu-Bel retreated to Babylon with a few soldiers; Darius entered Babylon,
    seized Nidintu-Bel, and slew him there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: While Darius was in Babylon, the passage lists several provinces that revolted
    against him, including Persia, Elam, Media, Assyria, Egypt, Parthia, Margiana,
    Satagu, and Nammiri.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Martiya, son of Shinshahrish, lived in Kugunaka, rose up in Elam, and claimed
    to be Imanisi, King of Elam; the Elamites, fearing Darius, seized and slew him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Parumartish or Fravartish, a Median, rose up in Media and claimed to be Hashatriti;
    the account is incomplete at the end of the passage.
  category: sequence
  evidence_refs:
  - ev:10
