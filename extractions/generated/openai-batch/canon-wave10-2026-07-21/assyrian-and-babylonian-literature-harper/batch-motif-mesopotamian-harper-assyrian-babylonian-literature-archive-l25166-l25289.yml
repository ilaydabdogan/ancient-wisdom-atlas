canonical_text:
  quote: ''
  summary: The porter announces Ishtar's arrival to Queen Allatu, saying Ishtar has
    crossed waters. Allatu orders the gate opened according to ancient custom. The
    porter admits Ishtar into Kutu, the under-world and land of No-Return. At seven
    gates he removes her crown, ornaments, chains, girdle, bracelets, anklets, and
    garment, answering each protest by citing Allatu's custom. After Ishtar descends,
    Allatu angrily confronts her, and then commands Namtar to afflict Ishtar's body
    with diseases.
  language: English
  quote_policy: summarized
