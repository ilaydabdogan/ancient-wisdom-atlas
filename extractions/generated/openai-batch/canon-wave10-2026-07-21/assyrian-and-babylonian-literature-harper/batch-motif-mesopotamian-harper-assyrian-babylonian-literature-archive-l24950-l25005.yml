canonical_text:
  quote: ''
  summary: Procedural ritual instructions describe arranging tables and censers before
    divine figures, reciting a petition over an unblemished sheep at sunrise, offering
    the sacrifice with sprinklings, repeating censer actions before several deities,
    and washing and presenting selected flesh portions before Shamash.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tables are to be placed behind censers before Kettu, Mesharu, and the protecting
    god.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The censer before Shamash is strewed before the officiant takes the hand of
    the sacrificer and recites a speech.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speech asks that a named servant offer a sacrifice at the rising of the
    sun, raise a cedar staff, stand in the presence of the deity, and have the deity
    be pleased concerning an unblemished and auspicious sheep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the speech, the sacrifice is offered; the sacrificer holds the sheep
    while sprinklings are performed and a step is made toward the slaughtered animal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The strew-and-repeat instruction is applied to censers before Ramman, Marduk,
    A-a, Bu-ne-ne, Kettu, Mesharu, and the protecting god.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The right thigh, hinga flesh, and shume flesh are washed in a bason, laid
    before Shamash, followed by lighting the censer and stepping toward it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The sheep is described as having unblemished flesh and auspicious appearances.
  category: attribute
  evidence_refs:
  - ev:3
