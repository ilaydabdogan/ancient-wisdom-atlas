canonical_text:
  quote: ''
  summary: The passage introduces Sabitu at a sea-throne or ocean-palace. Gilgamesh
    arrives skin-clad and lamenting the distant roads. Sabitu sees him, closes her
    gate, and is addressed by Gilgamesh. After a damaged section, Gilgamesh asks the
    way to Per-napishtim and says he will cross the sea if possible. Sabitu answers
    that no one has crossed the sea except Shamash and that the crossing is extremely
    dangerous.
