canonical_text:
  quote: ''
  summary: The passage narrates Shalmaneser II departing from Nineveh, crossing rivers,
    entering and plundering cities, receiving tribute from named rulers, offering
    sacrifices, burning palaces and cities, defeating a coalition near Qarqara with
    divinely given forces and weapons, and beginning an account of a later western
    campaign against Hazael of Damascus at Saniru.
  language: English
  quote_policy: summarized
