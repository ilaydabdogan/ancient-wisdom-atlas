canonical_text:
  quote: ''
  summary: In a letter, Rib-Addi addresses the king of Egypt with royal titles, invokes
    Ba'alat of Gebal to bestow power on him, and prostrates himself. He reports that
    confederates, prompted by Abd-Ashirta, have turned against him, that Gebal, Beyrut,
    and remaining royal cities are threatened, and asks for a garrison, home guards,
    rations, and drink. The preserved passage ends with Rib-Addi comparing himself
    to a bird caught in a net.
  language: English
