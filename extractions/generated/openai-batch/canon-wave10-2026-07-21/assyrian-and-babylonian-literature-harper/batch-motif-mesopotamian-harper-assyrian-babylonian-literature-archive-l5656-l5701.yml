canonical_text:
  quote: ''
  summary: The passage first gives a curse against any future ruler who alters King
    Nabupaliddin's protected gift or destroys the tablet. It then begins the Monolith
    Inscription of Shalmaneser II with a divine invocation, statements that the gods
    established the king's sovereignty, royal titles for Shalmaneser, and claims about
    road-opening, mountain-treading, tribute, and military terror.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A future ruler entering the palace is warned not to nullify King Nabupaliddin's
    gift, present it to another, reduce the allowance, count it as belonging to the
    prefect, appropriate it, or destroy the tablet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The curse invokes Shamash, A, and Bunene as lords of fates and great gods,
    asking that the violator's name pass away, his seed perish, his life end in distress
    and want, his corpse be cast out, and burial be denied.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The monolith inscription opens by naming Ashur, Anu, Bel, Ea, Nanir, Shamash,
    Ishtar, and the great gods with divine epithets and functions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The great gods are said to love the speaker's sovereignty and to have enlarged
    his lordship, might, rule, name, and fame.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Shalmaneser is identified with royal and cultic titles including king of all
    people, priest of Ashur, King of Assyria, king of the four quarters, chosen of
    the gods, beloved of Bel, and viceroy of Ashur.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Shalmaneser is described as discovering roads and difficult ways, treading
    mountain tops and mountain forests, receiving tribute and presents from all regions,
    opening roads above and below, and alarming regions by battle attack.
  category: action
  evidence_refs:
  - ev:6
