canonical_text:
  quote: ''
  summary: 'The passage preserves legal records from Sippar and Babylonian court practice:
    a complaint that named men broke into a house and took money; a subsequent tablet
    describing inspection of the damaged door, assembly of city elders, bonds, and
    examination; and a contract executing a debt claim by transferring rights over
    pledged property and sealing a tablet to prevent renewed appeal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A deponent before Bel-uballit, identified as the notary of Sippar, says he
    took Nana-iddin into his house and challenged him for raising his hand against
    him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deponent alleges that a named group broke open his door, forced entry
    into his house, and took one mana of his money.
