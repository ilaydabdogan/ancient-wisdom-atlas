canonical_text:
  quote: ''
  summary: The passage presents two Mesopotamian adoption contracts. The first records
    Arad-Iskhara adopting Ibni-Shamash and sets penalties if either denies the father-son
    relationship. The second records Bel-kagir’s request to adopt his wife’s son Bel-ukin
    because his wife has borne him no child, and Nadinu’s prior restriction that property
    must pass either to a future biological son of Bel-kagir or to Bel-kagir’s brother
    and fellow-heir.
  language: English
  quote_policy: summarized
