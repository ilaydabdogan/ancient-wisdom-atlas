canonical_text:
  quote: ''
  summary: 'The passage presents rental-related contracts: an Old Babylonian one-year
    house lease; a later contract linking house rent to repair work, staged payment,
    a religiously named payment day, and a penalty; and a long-term lease offer and
    acceptance for cultivated fields, uncultivated land, houses, canal-bounded property,
    and rent in dates.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is under the heading “Rentals” and includes contract examples
    from Old Babylonian and later Achaemenid-period dates.
  category: setting
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
- id: obs:2
  text: Akhibte leases the house of Mashqu from Mashqu, the owner, for one year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first lease sets the annual rent at one shekel of silver and states that
    possession begins on the fifth of Tammuz.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The first contract is followed by four witnesses and a date in the year of
    the wall of Kar-Shamash.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the Darius-year contract, Iskhuya is to receive fifteen shekels in addition
    to the annual rent of Shamash-iddin’s house because he must repair the house and
    close a wall crack.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Darius-year contract divides payment into an initial part and a completion
    part, with payment due on the day of Bel, described as a day of wailing and weeping.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If Iskhuya has not finished the house after the first day of Tebet, Shamash-iddin
    is to receive four shekels from him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Darius-year contract is followed by three witnesses, a scribe, and a date
    at Shibtu on the twenty-first of Kislimu in Darius’s thirty-fifth year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Baga'miri voluntarily offers to lease cultivated field, uncultivated land,
    and dwelling houses to Belshum-iddin.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Artaxerxes-year lease describes the property by canals, the town of Galiya,
    and neighboring fields to the north, south, east, and west.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Belshum-iddin accepts the lease for sixty years, with annual rent for the
    cultivated field set at twenty talents of dates, while uncultivated land is for
    planting.
  category: action
  evidence_refs:
  - ev:5
