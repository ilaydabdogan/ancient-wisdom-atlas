canonical_text:
  quote: ''
  summary: Historical prose describing Assyrian campaigns and imperial administration
    from Tiglath-pileser through Shalmaneser IV and Sargon, including western coalitions,
    tribute, sieges, Egyptian influence, revolts, Urartu and Babylonia campaigns,
    Sargon's rule from Babylon, homage from subject rulers, deportation policy, and
    building activity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rezon and Pekah are described as forming a coalition and making war on Joram
    and Ahaz of Judah because those kings were thought not to have joined the anti-Assyrian
    movement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahaz, despite Isaiah's admonition, offered tribute to Tiglath-pileser; the
    Assyrian then campaigned in the west, Israel was overthrown, Pekah was dethroned
    and killed, Damascus was captured, Rezon was killed, and much of the land was
    made an Assyrian province.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shalmaneser IV succeeded to the Assyrian throne; Hoshea first paid tribute,
    then revolted, after which Shalmaneser invaded Israel, imprisoned Hoshea, attacked
    Samaria, and died during the siege.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sargon succeeded Shalmaneser and brought the siege of Samaria to a successful
    conclusion in 722 b.c.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage attributes troubles in the western provinces to Egyptian attempts
    to gain influence; Sabako is said to have intrigued in Assyrian provinces, and
    a king of Hamath organized other cities and regions against Assyria with Egyptian
    promises of assistance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sargon defeated the Egyptian-backed western coalition at Raphia in 720 b.c.;
    later, in 711 b.c., a revolt centered on Ashdod, and Sargon sent his Turtan to
    suppress it.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The passage says Sargon gave Urartu a death-blow, defeated its king Ursa,
    after which Ursa killed himself, and Urartu became an Assyrian province.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Marduk-bal-iddin of Bit Jakin formed a coalition, proclaimed himself king
    of Babylonia, was later routed by Sargon, and Sargon was crowned king of Babylon
    in 709 b.c.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sargon spent his last years at Babylon receiving homage and tribute, including
    from thirty princes of the Medes; the passage also credits him with developing
    deportation and Assyrian provincial government and praises his building activity.
  category: attribute
  evidence_refs:
  - ev:8
