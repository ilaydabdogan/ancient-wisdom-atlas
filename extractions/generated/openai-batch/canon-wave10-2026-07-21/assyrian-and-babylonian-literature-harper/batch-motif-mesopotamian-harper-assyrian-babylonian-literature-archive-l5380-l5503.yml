canonical_text:
  quote: ''
  summary: The passage closes an inscription of Tiglath-pileser I with ritual care
    for a predecessor's memorial slab, instructions for a future restorer, and curses
    against anyone who damages or replaces the king's inscriptional objects. It then
    begins an introduction to the annals of Ashurnasirpal, praising Ninib with cosmic
    and martial epithets and presenting Ashurnasirpal as a divinely favored conquering
    king. A heading then introduces a votive inscription from the Temple of Balawat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The royal speaker says he cleansed Shamshi-Adad's memorial slab with oil,
    offered a sacrifice, and restored it to its former resting-place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A future prince who rebuilds the ruined Temple of Anu and Adad and its towers
    is instructed to cleanse the speaker's memorial slab and foundation cylinder with
    oil, offer sacrifice, restore them, and write his name with the speaker's name.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A harmful future person is described as breaking, discarding, casting into
    water, burning in fire, covering with dust, hiding in a dark place, blotting out
    the speaker's signature, or substituting another name on the memorial objects.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Anu and Adad are invoked to look with wrath on the violator and to impose
    curses affecting his kingdom, throne, offspring, weapons, army, and captivity
    before enemies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Adad is invoked to strike the violator's country with lightning, bring need,
    famine, and pestilence, shorten his life, and blot out his name and family from
    the land.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The inscription is dated to the month Siwan, called the month of Gemini, on
    the twenty-ninth day, in the eponymy of Ina-iliia-allak, chief of the musicians.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ninib is addressed with epithets including powerful, strong, exalted, chief
    of the gods, unmatched in battle, first-born of Nudimmud, hero of the Igigi, and
    holder of the reins of heaven and earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ninib is described as opening the depths, treading the earth, giving sceptre
    and decision, controlling the ends of heaven and earth, acting like storm and
    cyclone, giving light, destroying the wicked, giving life, showing mercy, and
    dwelling in Calah.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Ashurnasirpal is called powerful king, king of the world, king of the four
    quarters, beloved of Bel, Ninib, Anu, and Dagan, and a ruler whose reign Ninib
    established and whose campaigns occur under Ashur's protection.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ashurnasirpal is described as a shepherd, a massive flood without opponent,
    subduer of hosts, trampler of foes, conqueror of countries and mountains, receiver
    of tribute, taker of hostages, and establisher of power over lands.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: A subsequent heading introduces a votive inscription of Ashurnasirpal from
    the Temple of Balawat.
  category: setting
  evidence_refs:
  - ev:11
