canonical_text:
  quote: ''
  summary: The passage describes the Mesopotamian conjurer-priest or ashipu as a ritual
    mediator serving Ea and Marduk through incantation. It contrasts exorcisers with
    sorcerers and witches, outlines counter-magic based on like-for-like reversal,
    identifies protective deities including the Fire-god, and notes the close relation
    between hymns, prayers, and incantations.
  language: English
  quote_policy: summarized
