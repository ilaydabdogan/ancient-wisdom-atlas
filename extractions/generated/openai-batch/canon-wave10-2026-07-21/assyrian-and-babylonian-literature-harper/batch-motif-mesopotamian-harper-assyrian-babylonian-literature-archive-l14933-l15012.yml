canonical_text:
  quote: ''
  summary: A translated Tel-el-Amarna diplomatic letter from Amenophis III of Egypt
    to Kadashman-Bel of Karduniash. The Egyptian king replies to concerns about a
    royal sister already married into Egypt, a proposed marriage involving Kadashman-Bel's
    daughter, the need for a wise envoy to identify the sister, questions about her
    origin and status, greetings as proof of her presence, gifts, and the establishment
    of genuine brotherhood between the kings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a letter from Nibmuaria, identified as Amenophis, great
    king and King of Egypt, to Kadashman-Bel, King of Karduniash, addressed as his
    brother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sender opens with wishes of well-being for the addressee, his house, wives,
    children, nobles, horses, chariots, and lands, and reports similar well-being
    in Egypt.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kadashman-Bel's reported message says that Amenophis desires his daughter
    as a wife and that the sister previously given to Egypt has not been seen, so
    her life or death is unknown to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Amenophis answers that Kadashman-Bel has not sent a wise man acquainted with
    the sister who could converse with her or recognize her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kadashman-Bel's messengers reportedly assembled before the Egyptian king and
    his wives but did not identify the woman shown to them as the sister.
