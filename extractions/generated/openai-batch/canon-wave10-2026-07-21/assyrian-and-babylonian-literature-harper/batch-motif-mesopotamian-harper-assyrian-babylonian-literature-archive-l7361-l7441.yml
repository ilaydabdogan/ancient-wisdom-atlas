canonical_text:
  quote: ''
  summary: A first-person royal campaign account describes destruction of cities,
    deportation of people and animals, annexation and renaming of territory, receipt
    of tribute, campaigns in the west, installation and restoration of client kings,
    divine support from Ashur, defeat of Egyptian and Meluhha forces, punishment of
    rebels, and the beginning of a siege account against Hezekiah of Judah.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed opponent fled, and the narrator swept over that opponent's land
    like a wind storm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Marubishti, Akkuddu, and thirty-four smaller cities were besieged, captured,
    destroyed, devastated, burned with fire, and their people and animals were carried
    away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator cut away territory, added it to Assyria, made Elenzash a royal
    city and fortress, renamed it Kar-Sennacherib, settled captured peoples there,
    and placed them under a military officer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The far-off Medes brought heavy tribute and were made to submit to the narrator's
    yoke of lordship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the third campaign, Luli, king of Sidon, fled to the sea, and the narrator
    subdued his land.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The walled cities and garrisons of Sidon submitted after the passage attributes
    their defeat to the weapons of Ashur; Tubalu was placed on the royal throne and
    assigned yearly tribute and taxes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Several kings of the West Land brought rich presents and merchandise before
    the narrator and kissed his feet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Qidqa of Askelon had not submitted to the narrator's yoke; the narrator took
    his ancestral gods and household to Assyria and placed Sharruludari over Askelon
    as a tributary ruler.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The governors, chiefs, and people of Ekron had put Padi, their treaty-bound
    king, in iron chains and handed him to Hezekiah of Judah, who shut him in a dungeon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ekron's side summoned forces from Egypt and Meluhha; at Eltekeh they arranged
    battle against the narrator, who says he defeated them under Ashur's protection
    and captured charioteers and royal sons alive.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Ekron, the narrator killed rebel governors and chiefs, hung their corpses
    on poles around the city, counted opposing inhabitants as spoil, released those
    described as not guilty, restored Padi to the throne, and imposed tribute.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hezekiah of Judah is described as not submitting to the narrator's yoke, and
    the passage begins an account of attacking forty-six walled cities of Judah with
    rams, war engines, breaches, cutting through, and axes.
  category: action
  evidence_refs:
  - ev:8
