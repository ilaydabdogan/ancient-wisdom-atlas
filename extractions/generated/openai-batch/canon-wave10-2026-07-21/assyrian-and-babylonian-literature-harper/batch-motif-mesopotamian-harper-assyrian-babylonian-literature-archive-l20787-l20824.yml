canonical_text:
  quote: ''
  summary: 'Tablet III is introduced as important because Eabani becomes Gilgamesh''s
    friend and companion. The passage summarizes two fragmentary sections: one apparently
    addressed to a woman, possibly Uchat, and including a dream of heavenly stars
    falling to earth; the other a dialogue in which Shamash quiets Eabani''s anger
    and persuades him not to return to his mountain home, with promises of royal honors
    and Gilgamesh''s friendship and brotherly love.'
