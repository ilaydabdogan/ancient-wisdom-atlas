  quote: ''
  summary: A scholarly introduction surveys the publication, cataloguing, and study
    of Assyrian and Babylonian letter tablets, including Sargonide, pre-Sargonide,
    Hammurabi-period, and Tel-el-Amarna correspondence. The passage describes modern
    scholars, museum collections, temple and private archives, and categories of official
    letters.
  language: English
  quote_policy: summarized
