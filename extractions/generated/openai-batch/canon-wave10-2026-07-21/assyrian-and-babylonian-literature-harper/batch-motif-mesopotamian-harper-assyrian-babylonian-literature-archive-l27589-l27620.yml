canonical_text:
  quote: ''
  summary: The passage lists lunar-halo and planetary omens. A halo around the Moon
    with Jupiter, Scorpio, Regulus, or a planet inside it is associated with predicted
    outcomes for kings, livestock, women bearing male children, robbers, and the movement
    or fortune of the land. Additional omens concern Jupiter near Taurus and Mars
    reaching the path of the Sun or Saturn. Named sources include Nabu-musheqi and
    Nergal-etir.
  language: English
  quote_policy: summarized
