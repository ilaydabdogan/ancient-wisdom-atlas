canonical_text:
  quote: ''
  summary: Ashurbanipal describes temple offerings, oaths, the subjection of enemies
    by the gods, Sar-duri of Urarti's submissive greeting and tribute, and the rebuilding
    of the aging Nineveh harem-palace. He attributes his upbringing, protection, victories,
    and favorable fate to major deities; rebuilds the palace with auspicious foundation
    rites, libations, forced labor, spoil materials, cedar, copper, a grove, sacrifices,
    dedication, and entry under a canopy; and asks a future royal son chosen by Ashur
    and Ishtar to repair it when it decays.
  language: English
  quote_policy: summarized
