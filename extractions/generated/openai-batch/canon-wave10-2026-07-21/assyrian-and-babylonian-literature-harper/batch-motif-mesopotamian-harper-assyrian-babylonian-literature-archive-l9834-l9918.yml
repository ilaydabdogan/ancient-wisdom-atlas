  evidence_refs:
  - ev:1
- id: obs:2
  text: Unspecified persons in the opening fragment are made to take the yoke of Ashurbanipal's
    state carriage and draw it beneath him to the temple gate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ashurbanipal prostrates himself, praises the deities, and says the named gods
    have subjected unsubmissive enemies to his yoke and placed him over his enemies.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sar-duri, king of Urarti, hears of the deeds decreed for Ashurbanipal by the
    great gods, sends a submissive greeting, and has a heavy present brought to Ashurbanipal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The harem or palace resting-place in Nineveh, built by Sennacherib for his
    royal dwelling, has grown old and its walls have fallen.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ashurbanipal says he grew up in the harem and that the named gods preserved
    him there as crown-prince, protected him, and sent him joyful tidings of victories
    after he took his father's throne.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ashurbanipal says his night dreams were pleasant, his morning fancies bright,
    the dwelling brings prosperity to its lord, and the great gods decreed a favorable
    fate for it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ashurbanipal tears down the ruined harem, expands its area, raises a terrace,
    and lays the foundation and brickwork in a good month on a favorable day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ashurbanipal pours sesame-wine and wine upon the cellar and earthen wall as
    part of the building work.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The people of Ashurbanipal's land haul bricks in wagons of Elam that he had
    carried away as spoil by the command of the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Captured kings of Arabia are made to carry baskets, wear workmen's caps, mould
    bricks, and perform forced service for the harem while music plays.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ashurbanipal rebuilds the harem from foundation to roof, enlarges it, adds
    cedar beams, copper-covered woodwork and doors, fills it with splendor, and plants
    a grove of trees and fruits around it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After finishing construction, Ashurbanipal offers sacrifices to the gods,
