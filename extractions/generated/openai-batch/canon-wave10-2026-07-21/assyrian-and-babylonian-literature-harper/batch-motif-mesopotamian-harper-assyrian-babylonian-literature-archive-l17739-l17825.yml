canonical_text:
  quote: ''
  summary: 'The passage preserves Babylonian legal material: a note on false suits
    being penalized by an equal payment to the defendant, followed by Bunanit''s deposition
    and judicial decision over dowry-derived property, an adopted son, a daughter,
    a purchased person, and claims made after her husband''s death. The judges examine
    tablets and documents, deny Iqbi-ilu''s claims, and allocate rights according
    to the documents and will.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prior legal decision and commentary describe a false suit as producing a
    fine equal to the sum unjustly claimed, paid to the defendant rather than ending
    in simple dismissal.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The prior decision is described as signed by six judges and the clerk of the
    court and dated at Babylon in the accession year of Nabonidus.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bunanit states that Ben-Hadad-natan took her as wife, received three manas
    of money as her dowry, and that she bore him one daughter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bunanit states that she and her husband traded with her dowry money and bought
    an estate near or in Borsippa, partly using money borrowed from Iddin-Marduk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bunanit states that Ben-Hadad-natan sealed and devised the Borsippa estate
    to her, recorded the transaction on a tablet, and wrote the curse of the great
    gods on it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bunanit and Ben-Hadad-natan adopted Ben-Hadad-amara and recorded the adoption
    on a tablet; they also announced Nubta's dowry as money and household furniture.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After Ben-Hadad-natan died, Iqbi-ilu claimed the estate, the property devised
    to Bunanit, and Nabu-nur-ilani, whom the couple had purchased through Nabu-akhi-iddin's
    agency.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The judges heard the complaint, discussed Bunanit's tablets and documents,
    and denied Iqbi-ilu power over the Borsippa house, Nabu-nur-ilani, or anything
    belonging to Ben-Hadad-natan.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The decision establishes Bunanit and Ben-Hadad-amara according to their tablets,
    states that Iddin-Marduk is paid, and assigns Bunanit's dowry and Nubta's receipt
    of Nabu-nur-ilani according to the father's will.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The record of Bunanit's suit is dated to the ninth year of Nabonidus and bears
