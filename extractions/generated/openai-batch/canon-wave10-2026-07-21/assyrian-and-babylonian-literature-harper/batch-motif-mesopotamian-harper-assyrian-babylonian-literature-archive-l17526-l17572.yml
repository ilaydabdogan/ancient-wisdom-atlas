canonical_text:
  quote: ''
  summary: A thirteenth-year Nabonidus contract from Babylon records an adoption/service
    arrangement involving Iqisha-apla and his slave Rimanni-Bel/Ramut. After the adopted
    man failed to provide companionship, nourishment, and clothing, Esaggil-ramat
    sheltered and maintained him. Iqisha-apla then broke the earlier adoption tablet
    and delivered him under a new bond to Esaggil-ramat and Nubtai, with a divine
    curse against anyone annulling the bond. A bracketed editorial note interprets
    the document as evidence that adoption could function as emancipation and that
    the failed arrangement resulted in renewed bondage.
  language: English
  quote_policy: summarized
