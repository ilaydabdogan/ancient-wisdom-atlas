  quote: ''
  summary: The passage first closes a fragmentary deluge-related section that alludes
    to a divine benefactor and a formula involving Adram-chasis. It then begins the
    First Tablet of the Maqlu Series with an incantation in which an afflicted speaker
    invokes nocturnal powers and great gods, complains of sorcery and bodily obstruction,
    presents images of hostile practitioners, and asks that the witchcraft be loosened,
    the enemies die, and the speaker be purified and live.
