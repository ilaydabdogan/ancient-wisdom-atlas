  summary: A royal inscription presents Nabopolassar with royal titles and divine
    favor, describes Shamash walking at his side during victory over foes, records
    his rebuilding of E-edin-na for the mistress of Sippar, and petitions her to establish
    him and extend his sovereignty far into the future.
