canonical_text:
  quote: ''
  summary: The passage presents royal inscription material for Esarhaddon. A deity
    is addressed as protector and grantor of Assyrian rule. Esarhaddon describes favourable
    signs at the beginning of his reign, consultation of Shamash, Ramman, and Marduk,
    seer-mediated oracles to rebuild Babylon and renew Esagila, ritual foundation
    offerings, compulsory labour, the king’s own participation in labour, rebuilding
    of Esagila, Babylon, and city walls, restoration of divine images and offerings,
    and renewed protection for Babylonians. A Berlin monolith inscription then invokes
    many gods as sources of fate, reign, signs, dominion, battle aid, and royal power,
    followed by titles and martial attributes of Esarhaddon.
  language: English
  quote_policy: summarized
