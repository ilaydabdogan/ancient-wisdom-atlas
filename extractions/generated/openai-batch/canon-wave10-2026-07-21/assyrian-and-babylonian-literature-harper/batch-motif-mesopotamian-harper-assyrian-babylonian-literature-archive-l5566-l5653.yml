canonical_text:
  quote: ''
  summary: The passage records the interruption and restoration of Shamash's regular
    offerings, royal endowments of food, drink, a garden, garments, and gifts, the
    discovery and replacement of Shamash's cult image, the mouth-washing purification
    rite, abundant offerings, and the sealing of a royal tablet in Nabupaliddin's
    thirty-first year.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An image and insignia were set before Shamash with an enclosure and regular
    offering, and Ekurshumushabshi, priest of Sippar and seer, was placed in charge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During distress and famine in the time of King Kasshunadinahi, the regular
    offering was stopped and the drink offering fell into disuse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ekurshumushabshi came before King Eulburshakinshum and reported that the dues
    of Shamash had ceased.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Eulburshakinshum provided food and date wine for Shamash and dedicated a garden
    in the new city within Babylon, entrusting it to Ekurshumushabshi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nabupaliddin is described as King of Babylon, elect of Marduk, beloved of
    Anu and Ea, pleasing to Carpanit, a warrior, and a ruler invested by Marduk with
    a righteous sceptre.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The text says Shamash had long been incensed against Akkad and had turned
    away in anger, but in Nabupaliddin's reign relented and showed favor.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A relief of Shamash's image cut in clay, together with a statue and insignia,
    was found west of the Euphrates, and Nabunadinshum showed the relief to Nabupaliddin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nabupaliddin commanded the image to be replaced, rejoiced on seeing it, and
    prepared the image of Shamash with pure gold and brilliant lapis lazuli using
    the wisdom of Ea and the cooperation of named craft divinities.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nabupaliddin washed the mouth according to the purification rite of Ea and
    Marduk before Shamash at Ekarsaginna on the Euphrates bank, after which Shamash
    took up residence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nabupaliddin made abundant offerings, including oxen, sheep, honey, wine,
    and upuntu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nabupaliddin granted ancient dues, the garden, garments, and royal gifts connected
    with Shamash, A, and Bunene to Nabunadinshum, sealed the disposition for all time,
    and had named officials present at the sealing.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
