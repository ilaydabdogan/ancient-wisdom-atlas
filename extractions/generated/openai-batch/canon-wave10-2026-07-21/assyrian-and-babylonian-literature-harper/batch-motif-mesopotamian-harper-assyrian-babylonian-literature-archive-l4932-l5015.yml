    and burns Murattash.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The speaker presents bronze articles taken in the campaign to Adad, described
    as a great lord who loves him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The speaker marches against the Sugi in the land of Kilhi under the lofty
    power of Ashur and fights a large allied force on Mount Hiriha.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mount Hiriha is described as difficult territory, with peaks as sharp as the
