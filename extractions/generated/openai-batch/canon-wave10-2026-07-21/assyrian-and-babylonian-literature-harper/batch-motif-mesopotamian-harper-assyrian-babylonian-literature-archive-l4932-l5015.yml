canonical_text:
  quote: ''
  summary: A first-person royal speaker narrates successive campaigns through difficult
    mountain regions, defeats multiple peoples and cities, burns and devastates settlements,
    takes booty and idols, imposes taxes and tribute, makes defeated groups subject
    to Ashur, and dedicates captured objects and idols to major deities and temples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker assembles war chariots and troops, marches between the mountains
    of Idni and Aia, leaves the chariots in the plain, and ascends difficult mountains
    on foot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kurteans fortify themselves on Mount Azutabgis, where the speaker fights
    them and claims victory despite an unfavorable battlefield.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the mountain battle, the speaker piles corpses on the mountain heights
    and describes blood flowing over ravines and high places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker conquers twenty-five cities of Haria, carries off property, and
    burns, destroys, and devastates the cities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The people of Adaush flee to lofty mountain peaks, then leave the mountains,
    embrace the speaker's feet, and receive taxes and tribute imposed on them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage attributes the submission of Adaush to the overwhelming splendor
    of Ashur, called the speaker's lord.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker defeats Sharaush and Ammaush, conquers their cities, takes their
    idols and goods, burns the cities, and makes the people subjects and vassals of
    Ashur.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker conquers Isua and Daria after their disobedience, imposes taxes
    and tribute, and makes them subject to Ashur.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker crosses the Lower Zab, conquers Murattash and Saradaush in mountain
