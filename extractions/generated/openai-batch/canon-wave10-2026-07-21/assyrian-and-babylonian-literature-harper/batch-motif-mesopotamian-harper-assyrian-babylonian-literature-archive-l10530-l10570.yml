canonical_text:
  quote: ''
  summary: In this inscriptional passage, Nebuchadrezzar describes fortifying Babylon
    and Borsippa with gates, water barriers, levees, walls, a watchtower, and a moat.
    He identifies his kingship as called or created by Marduk and rule as granted
    by Nabu, recalls earlier kings and the Zagmuku procession of Marduk into Babylon,
    and describes Babylon’s palace and sacred buildings in terms of brilliance, royal
    residence, and civic gathering. The passage ends by noting that flood waters had
    weakened the foundation of a palace site constructed by Nabopolassar.
  language: English
  quote_policy: summarized
