canonical_text:
  quote: ''
  summary: The passage closes Tablet XII with a statement about an uncared-for spirit
    eating refuse, then reports scholarly discussion of Gilgamesh fragments in which
    Eabani curses Uchat and describes a descent to the dark netherworld and its inhabitants.
    It then introduces other Mesopotamian references to the deluge, including pre-deluge
    tablets, a flood map with Babylon, ocean, islands, mountain, and serpent-year,
    and a fragmentary Babylonian deluge account involving destructive rain, inundation,
    Adad, and Ea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spirit with no one to care for it consumes dregs of a bowl and broken food
    remnants cast into the street.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the colophon of Tablet XII and of the whole poem follows,
    bringing the poem to an end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The editorial discussion reports disagreement over whether certain fragments
    belong to Tablet XII or to another recension of the same poem, and notes several
    recensions of the deluge account.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fragments are said to mention the hunter, Uchat, and the address 'my friend,'
    which the editor takes as showing that Eabani is the speaker.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eabani curses Uchat and is said to curse her charms, sisters, and maidens
    because Uchat, with the crafty hunter, had brought a curse upon him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Eabani has gone down into the netherworld, and his friend, with witchcraft,
    has succeeded in bringing him up again so that he can tell what he saw there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eabani describes a descent to the house of darkness, the dwelling of the goddess
    Irkalla or Allatu, a place from which the entrant does not go out and whose road
    does not turn back.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The inhabitants of the house of darkness are deprived of light, eat dust and
    clay, are clothed like birds in feathered raiment, and sit in darkness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the house Eabani entered, crowns are cast down on the ground, and former
    rulers who had worn crowns dwell there.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Former rulers who had received roasted meat from Anu and Belit now have cold
    meals prepared and water from leather bottles poured out for them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Priests, ministers, soothsayers, enchanters, temple-anointers, Etana, Ner,
    the queen Ereshkigal or Allatu, and the scribe of the earth are listed as dwelling
    in the underworld house.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ereshkigal lifts her head and sees Eabani after the scribe of the earth is
    described as bowed before her and reading before her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A cited text says Ashurbanipal read many tablets, including a tablet from
    the time before the deluge, and another cited text probably contains an account
    of the deluge.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: A mythological text with a map gives a primitive picture of Babylon at the
    time of the deluge and names Per-napishtim as one of the kings before the flood.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the flood-map description, the Persian Gulf is conceived as an ocean encompassing
    Babylon, seven islands lie around the ocean, the mountain of the deluge lies due
    north of Babylon within the ocean-bound space, and the deluge time is called the
    year of the great serpent.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: A Babylonian deluge fragment found by Father Scheil is described as dated
    to the year in which Ammizaduga built a fortress at the mouth of the Euphrates
    and as part of a story titled 'While the Man rested,' distinct from Tablet XI
    of the Nimrod-epic.
  category: other
  evidence_refs:
  - ev:10
- id: obs:17
  text: The preserved remnants of the deluge fragment mention killing, destroying,
    raining down extermination, prolonging something during the night, raining down
    inundation, Adad's action in the city, overturning the land, and Ea speaking a
    word.
  category: sequence
  evidence_refs:
  - ev:11
