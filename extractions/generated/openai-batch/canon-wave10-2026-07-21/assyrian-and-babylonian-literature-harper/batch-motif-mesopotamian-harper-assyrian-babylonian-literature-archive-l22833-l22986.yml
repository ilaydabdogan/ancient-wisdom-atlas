    deluge witnesses because it explicitly mentions several recensions, probable deluge
    accounts, and a distinct Babylonian deluge story.
  claim_level: same_motif
  target: Mesopotamian deluge accounts and recensions mentioned in the passage
  evidence_refs:
  - ev:2
  - ev:8
  - ev:10
  - ev:11
  counter_evidence_refs: []
