    from Tablet XI of the Nimrod-epic, supporting comparison as a related deluge motif
    but not identity of text.
  claim_level: same_motif
  target: Scheil's 'While the Man rested' fragment and Tablet XI of the Nimrod-epic
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states distinctness from Tablet XI and preserves only fragmentary
