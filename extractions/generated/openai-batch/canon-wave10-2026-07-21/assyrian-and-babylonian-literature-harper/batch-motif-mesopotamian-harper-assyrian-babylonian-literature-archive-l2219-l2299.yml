canonical_text:
  quote: ''
  summary: 'The passage summarizes legal and economic features of Babylonian life
    reflected in tablets: women’s marital and contractual status, the role of the
    Egibi and Murashu financial families, systems of judgment by elders and by a formal
    bench under Nabonidus, and examples of legal matters such as bail and creditor
    execution.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that tablets mirror the position of women in ancient Babylonia.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women could divorce their husbands, but the penalty for doing so was heavier
    than the penalty for men in similar cases.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some enslaved women submitted to unequal marriage contracts in order to secure
    emancipation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women were sometimes purchased by their husbands, but more often received
    dowries upon marriage from fathers or relatives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Dowries are described as placing women in practical independence and making
    them almost coequal with husbands in the home.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: Women appear with husbands as joint partners in buying, selling, borrowing,
    and loaning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:7
  text: Married women appear alone in contracts concerning money, real estate, slaves,
    merchandise with men other than husbands, and lawsuits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:8
  text: The passage states that Babylon had no modern bank, and that a powerful money-lending
    family called Egibi or the Sons of Egibi supplied that function for many years.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The Egibi loaned money at interest according to the quality of security and
    sometimes took pledged securities when borrowers could not pay.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: The Egibi dealt in real estate, formed partnerships, furnished capital while
    partners conducted active business, and passed leadership from father to son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:11
  text: Tablets from Nippur are said to reveal a similar firm called Murashu Sons
    in the reigns of Artaxerxes I and Darius II.
  category: other
  evidence_refs:
  - ev:2
- id: obs:12
  text: In most towns, judgment by the Elders prevailed and is described as a common
    Semitic system familiar from the Old Testament.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:13
  text: During Nabonidus’s reign, a bench of eight judges was organized at Babylon
    for administering justice, and usually six judges sat at one time.
  category: other
  evidence_refs:
  - ev:3
- id: obs:14
  text: Parties to a suit appeared in person and seem to have conducted their own
    cases without counsel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:15
  text: Judges considered cases in a body, with no jury, and rendered decisions signed
    by all judges and the clerk of the court.
  category: action
  evidence_refs:
  - ev:3
- id: obs:16
  text: By the middle of Nabonidus’s reign, court business had increased so that two
    clerks were necessary.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:17
  text: Because judges usually signed decisions in seniority order, the records allow
    the tracking of judges over years and suggest a civil-service-like promotion system.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:18
  text: One man who was clerk of the court in Nabonidus’s accession year became a
    judge two years later and later became chief justice after his seniors disappeared.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:19
  text: The passage says that many legal matters have a modern air, including one
    man going bail for another and a creditor obtaining execution against another.
  category: other
  evidence_refs:
