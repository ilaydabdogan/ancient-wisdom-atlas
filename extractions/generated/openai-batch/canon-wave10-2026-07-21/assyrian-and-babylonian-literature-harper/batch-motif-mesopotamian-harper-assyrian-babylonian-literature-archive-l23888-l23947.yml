  quote: "“May they blot out, and loose, / May they drive away his ban!”"
  summary: An incantation asks the assembled gods and goddesses to remove an unnamed
    person’s sins, transgressions, and bans. The colophon identifies the text as the
    second tablet of the Shurpu Series, says Marduk loosens any ban, describes Ashurbanipal’s
    divinely granted understanding and tablet-writing, and ends with a curse against
    anyone who removes the tablet or adds their name to it.
