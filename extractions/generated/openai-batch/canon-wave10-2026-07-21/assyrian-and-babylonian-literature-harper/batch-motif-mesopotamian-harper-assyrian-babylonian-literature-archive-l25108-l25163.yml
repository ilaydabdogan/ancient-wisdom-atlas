canonical_text:
  quote: ''
  summary: 'The passage first gives ritual instructions involving a censer, prostration,
    prayer, a table before Shamash, and four jugs of sesame wine. It then begins ''Ishtar''s
    Descent to Hades'': Ishtar, daughter of the Moon-god, turns toward the land of
    No-Return, a dark house and road from which entrants do not return. The place
    is described as lightless, dusty, and inhabited by those who eat dust and clay.
    At its gate Ishtar demands entry from the porter and threatens to break the doors
    and bring up the dead to join the living; the porter urges her not to destroy
    the door.'
  language: English
  quote_policy: summarized
