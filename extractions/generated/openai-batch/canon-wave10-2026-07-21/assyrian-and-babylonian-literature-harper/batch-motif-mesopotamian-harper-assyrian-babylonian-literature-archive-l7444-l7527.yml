canonical_text:
  quote: ''
  summary: 'A first-person royal inscription passage reports Sennacherib''s campaigns:
    Hezekiah is confined in Jerusalem and made tributary; Ashur supports a fourth
    campaign in which Shuzub and Merodachbaladan flee; Merodachbaladan transports
    the gods of his land by ship; people and cities are taken as spoil; Ashurnadinshum
    is enthroned over Sumer and Akkad; a fifth campaign describes difficult mountain
    ascents against peoples of Mount Nipur and Maniae of Ukku, whose cities and treasures
    are captured.'
  language: English
  quote_policy: summarized
