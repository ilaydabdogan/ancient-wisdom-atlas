- id: obs:3
  text: Cities taken from Hezekiah are assigned to Mitinti of Ashdod, Padi of Ekron,
    and Ql-Bel of Gaza, reducing Hezekiah's territory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hezekiah's tribute includes gold, silver, precious stones, ivory objects,
    woods, women of the palace, singers, and an ambassador sent to pay homage.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the fourth campaign, Ashur is said to give the narrator support before
    the march to Bit-Yakin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Shuzub the Chaldean, dwelling in the swamps of Bittutu, is defeated and flees
    alone like a bird.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Merodachbaladan collects all the gods of his land into their shrines, embarks
    them on ships, and flees like a bird to Nagite-raqqi in the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Merodachbaladan's brothers and the rest of his people are brought from Bit-Yakin,
    the swamps, and marshes, and counted as spoil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator destroys and devastates Merodachbaladan's cities, reduces them
    to plough-land, and directs fury toward the King of Elam.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ashurnadinshum, the narrator's first-born son, is placed on the throne, and
    Sumer and Akkad are made subject to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The men of Tumurri, Sharum, Egama, Kibshu, Halbuda, Qua, and Qana are described
