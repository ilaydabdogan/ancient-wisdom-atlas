canonical_text:
  quote: ''
  summary: A first-person petitioner describes being harmed by sorcery, images, bodily
    afflictions, pollution, and death-like treatment. The petitioner invokes the Fire-god,
    Shamash, and Nusku for judgment and counter-action, raises a torch, asks that
    the attackers' own magic be turned back on them, and burns images of demonic and
    ghostly beings so that they melt and vanish.
  language: English
  quote_policy: summarized
