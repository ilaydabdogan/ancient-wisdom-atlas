canonical_text:
  quote: ''
  summary: The passage describes Nebuchadrezzar II fortifying Babylon with brickwork,
    gate figures, a citadel, waterside foundations, and high turrets; praying to Marduk
    for favor, long life, offspring, and freedom from enemies; identifying himself
    as king, restorer, pious worshipper, and son of Nabopolassar; recounting Marduk's
    appointment and command to rebuild the ruined E-babbara temple of Shamash at Larsa;
    praying to Shamash for favor, a long life, firm throne, and enduring reign; and
    beginning a canal inscription about the ruined eastern canal Libil-hegalla.
  language: English
  quote_policy: summarized
