canonical_text:
  quote: ''
  summary: 'A first-person royal annal passage recounts Sennacherib’s sixth, seventh,
    and eighth campaigns: flight and pursuit across the Great Sea, conquest and burning
    of cities, deportation of people and gods, capture or defeat of rebel and Elamite
    rulers, divine support from Ashur, weather that halts an advance into the mountains,
    the sudden death of Kudur-Nahundu by Ashur’s command, and a later Babylonian rebellion
    involving Shuzub the Chaldean and temple treasure used as a bribe.'
  language: English
  quote_policy: summarized
