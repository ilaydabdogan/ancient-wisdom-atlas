candidate_motifs:
- id: motif:1
  label: Divinely supported royal campaign
  taxonomy_refs:
  - royal_legitimacy
  basis: The royal speaker’s campaign is explicitly said to receive support from Ashur,
    his lord.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage is a royal inscriptional narrative; the motif is extracted
    from the speaker’s own claim rather than from an independent narrative voice.
- id: motif:2
  label: Divine command causing enemy ruler’s sudden death
  taxonomy_refs:
  - divine_judgment
  basis: Kudur-Nahundu is said not to live three months and to die suddenly by the
    command of Ashur.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage does not describe the mechanism of death beyond attributing
    it to Ashur’s command.
- id: motif:3
  label: Flight across water with gods followed by forced return
  taxonomy_refs: []
  basis: The people of Bit-Yakin flee across the Great Sea with their gods, but the
    speaker crosses the sea, captures them with their gods, and ships them toward
    Assyria.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a military pursuit and deportation scene, not necessarily a mythic
    journey in the strict sense.
- id: motif:4
  label: Conquered cities burned into waste land
  taxonomy_refs: []
  basis: The speaker repeatedly says conquered cities are destroyed, devastated, burned
    with fire, and converted into mounds and plough-land.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:10
  confidence: high
  cautions: The destruction is regional and military; available taxonomy term world_destroying_fire
    would overstate the scope, so no taxonomy reference is assigned.
- id: motif:5
  label: Illegitimate enthronement of rebel claimant
  taxonomy_refs:
  - royal_legitimacy
  basis: The Babylonians are said to place Shuzub the Chaldean on the throne illegitimately
    and entrust him with rule over Sumer and Akkad.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The judgment of illegitimacy comes from the royal speaker’s hostile account.
- id: motif:6
  label: Sacred wealth diverted as political bribe
  taxonomy_refs: []
  basis: The Babylonians open the treasure house of Esagila and give the gold and
    silver of Bel and Qarpanit as a bribe.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage reports temple wealth used as a bribe but does not fully state
    the bribe’s recipient within the provided excerpt.
- id: motif:7
  label: Mountain refuge and weather-imposed withdrawal
  taxonomy_refs: []
  basis: Kudur-Nahundu flees to a far-distant mountain location, while rain, snow,
