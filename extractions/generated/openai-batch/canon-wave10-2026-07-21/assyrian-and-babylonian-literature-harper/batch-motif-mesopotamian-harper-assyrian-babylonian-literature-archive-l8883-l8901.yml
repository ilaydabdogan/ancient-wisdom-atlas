  summary: The royal narrator reports conquering districts and towns, burning cities,
    carrying off spoil, returning safely to Assyria, reclaiming towns taken by the
    Mannai, and adding them to Assyrian territory. The passage also says Ishtar delivered
    Ahsheri into the hands of his subjects, whose people revolted against him. A note
    introduces another account that adds a narrative about conquering seventy-five
    strong cities connected with Median city rulers.
