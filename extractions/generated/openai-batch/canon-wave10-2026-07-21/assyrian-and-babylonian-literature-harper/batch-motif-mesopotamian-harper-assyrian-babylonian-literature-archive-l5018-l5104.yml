canonical_text:
  quote: ''
  summary: A royal inscription of Tiglath-pileser I describes a divinely supported
    campaign through difficult mountains to the Upper Sea, battles against the kings
    of Nairi, conquest and burning of cities, capture and pardon of kings, imposition
    of oaths, hostages, tribute, and further actions against Sieni, Milidia, and Achlamean/Aramean
    enemies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tiglath-pileser is introduced as a mighty king, conqueror of enemy lands,
    and rival of all kings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The campaign is described as undertaken under Ashur's power, Shamash's protection,
    and the assistance of the great gods; Ashur is said to have sent the king to far-off
    countries near the Upper Sea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king travels rough roads and difficult mountain passes whose interiors
    no earlier king had penetrated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king opens unbeaten paths, crosses sixteen large mountains, advances by
    chariot where possible, uses bronze pickaxes in rough terrain, cuts forest trees,
    builds bridges, and crosses the Euphrates.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Twenty-three kings of the countries of Nairi assemble war chariots and troops
    and advance to fight the king.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king defeats the opposing armies, compares his destructive force to Adad's
    flood, scatters corpses on mountain heights and beside cities, and captures war
    chariots and horses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king pursues kings as far as the Upper Sea, conquers cities, takes booty,
    burns cities with fire, destroys and devastates them, and carries away animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king captures all the kings of Nairi alive, grants them mercy and pardon,
    and spares their lives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The captured kings are set free in the presence of Shamash and compelled to
    swear an oath of future fealty and allegiance by the king's great gods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The king takes royal offspring as hostages, imposes tribute of horses and
    cattle, and sends the kings back to their countries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sieni, king of Daiaeni, is said not to have submitted to Ashur; he is brought
    bound to Asshur, pardoned, and dismissed as a servant, vassal, and slave under
    the great gods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The people of Milidia fear the king's battle array, embrace his feet, receive
    pardon, avoid a storming of the city, and provide hostages and yearly tribute
    for sacrificial purposes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Tiglath-pileser is called a fiery, fierce flame and a mighty battle-storm,
    then marches in Ashur's strength into the desert against Achlamean/Aramean enemies
    and destroys their army.
  category: sequence
  evidence_refs:
  - ev:8
