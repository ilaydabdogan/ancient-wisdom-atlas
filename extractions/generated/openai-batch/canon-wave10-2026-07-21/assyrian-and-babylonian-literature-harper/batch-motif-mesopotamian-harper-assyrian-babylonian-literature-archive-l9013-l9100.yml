    woods, and inhabitants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shamash-shum-ukin is described as forgetting Ashurbanipal’s favor, speaking
    friendly words outwardly while plotting murder inwardly, and sending Babylonians
    to Nineveh with a cunning message.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ashurbanipal says he hosted the Babylonians at a dainty table, clothed them
