canonical_text:
  quote: ''
  summary: Ashurbanipal recounts destroying Shapibel, describes his brother Shamash-shum-ukin’s
    ingratitude and rebellion, reports a nocturnal vision of writing on Sin’s disk
    promising death to plotters, then narrates his sixth campaign against the rebels
    and related Elamite events.
  language: English
  quote_policy: summarized
