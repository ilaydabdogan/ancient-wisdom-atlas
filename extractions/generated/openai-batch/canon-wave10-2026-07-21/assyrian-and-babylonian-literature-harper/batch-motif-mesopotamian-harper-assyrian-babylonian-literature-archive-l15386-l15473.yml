canonical_text:
  quote: ''
  summary: The passage contains the end of one Amarna letter, a letter from the inhabitants
    of Dunip to the King of Egypt, and portions of letters from Aziri to Dudu. Dunip
    petitions the Egyptian king, recalls former protection, requests Jadi-Addu, warns
    of Azira’s force, laments abandonment, and says no reply has come for twenty years.
    Aziri addresses Dudu as father and lord, promises to satisfy his and the king’s
    wishes, asks him to prevent slander, declares obedience, and rejoices at favorable
    royal words brought by Hatib.
  language: English
  quote_policy: summarized
