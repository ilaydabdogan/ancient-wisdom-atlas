  evidence_refs:
  - ev:1
- id: obs:2
  text: Ashurbanipal identifies himself with royal titles including great king, mighty
    king, king of the universe, king of Assyria, king of the four quarters of the
    world, and king of kings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ashurbanipal states that the gods supported him and that, by their command,
    he ruled from the Upper Sea to the Lower Sea and brought princes to his feet.
  category: relationship
  evidence_refs:
