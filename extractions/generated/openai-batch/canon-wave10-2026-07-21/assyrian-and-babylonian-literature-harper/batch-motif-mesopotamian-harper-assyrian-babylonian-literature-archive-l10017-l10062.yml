canonical_text:
  quote: ''
  summary: The passage closes one inscription with a curse against a royal target,
    then begins an inscription of Ashurbanipal from a barrel cylinder. Ashurbanipal
    presents his titles, divine support, royal genealogy, restoration of Babylonian
    cults and temples, Marduk's dwelling in Esagila, legal order in Babylon, appointment
    of his twin brother Shamash-shum-ukin as king of Babylon, adornment and repair
    of sanctuaries, and attention to E-babbara, the house of Shamash in Sippara.
  language: English
  quote_policy: summarized
