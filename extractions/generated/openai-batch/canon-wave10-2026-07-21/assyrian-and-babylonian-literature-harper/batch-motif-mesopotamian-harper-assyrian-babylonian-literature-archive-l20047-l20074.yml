  quote: ''
  summary: A fragment from the Story of Etana describes an eagle considering eating
    the serpent's young. The eagle tells its young that it will ascend, watch from
    the height of heaven, swoop to the tree-top, and eat the brood. A wise young bird
    warns the eagle not to do this and invokes the net, snare, and ban of Shamash
    as a danger.
