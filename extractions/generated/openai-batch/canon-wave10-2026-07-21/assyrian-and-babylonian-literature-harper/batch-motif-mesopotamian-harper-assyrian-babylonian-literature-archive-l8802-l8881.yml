canonical_text:
  quote: ''
  summary: 'The passage recounts Ashurbanipal''s fourth campaign against Ahsheri,
    king of Mannai: a prior suppliant promises tribute; Ashurbanipal marches by command
    of named gods, destroys and burns cities, takes spoil, and pursues Ahsheri. Ishtar
    of Arbela is said to have foretold Ahsheri''s death and to deliver him to his
    servants; his people revolt and leave his corpse in the street. Ashurbanipal kills
    members of Ahsheri''s house, installs Ualli on the throne, and receives submission,
    a son, a daughter, tribute, and horses.'
  language: English
  quote_policy: summarized
