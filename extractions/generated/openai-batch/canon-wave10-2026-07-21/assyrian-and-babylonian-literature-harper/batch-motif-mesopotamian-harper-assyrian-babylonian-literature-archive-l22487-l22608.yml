canonical_text:
  quote: ''
  summary: Gilgamesh and Arad-Ea return by boat from the place of purification. Per-napishtim,
    prompted by his wife, reveals to Gilgamesh a secret plant that can restore youth.
    Gilgamesh obtains it by descending into the sea with stones tied to his feet,
    but later, while he is at a well, a serpent takes the plant away. Gilgamesh weeps,
    interprets the loss as an omen, and returns with Arad-Ea to strong-walled Erech.
  language: English
  quote_policy: summarized
