canonical_text:
  quote: ''
  summary: Nebuchadrezzar II recounts finding the ancient platform foundation and
    name of Nin-karrak at E-ul-la, rebuilding her temple at Sippar, increasing its
    revenues and offerings, and praying that she grant favor, long life, offspring,
    health, and happiness. A following inscription identifies Nebuchadrezzar as a
    just king and temple maintainer, states that Marduk raised him to rule and entrusted
    peoples to him, and describes his bowing to Marduk, accepting his yoke, increasing
    temple dues and offerings, and providing daily sacrifices to the gods of Esagila
    and Babylon.
  language: English
  quote_policy: summarized
