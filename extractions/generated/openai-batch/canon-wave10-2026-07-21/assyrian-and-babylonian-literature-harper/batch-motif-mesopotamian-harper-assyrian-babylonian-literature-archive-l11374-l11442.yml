canonical_text:
  quote: ''
  summary: The passage contains a brief martial petition, then a clay-cylinder inscription
    of Nabonidus. Nabonidus identifies himself as king and patron of temples, recounts
    earlier construction and completion of a temple tower at Ur by Ur-uk and Dun-gi,
    says he rebuilt the old structure for Sin on its earlier foundation, and petitions
    Sin to accept the work, establish piety among the people, keep Nabonidus and Belshazzar
    from sin, and grant long life.
  language: English
  quote_policy: summarized
