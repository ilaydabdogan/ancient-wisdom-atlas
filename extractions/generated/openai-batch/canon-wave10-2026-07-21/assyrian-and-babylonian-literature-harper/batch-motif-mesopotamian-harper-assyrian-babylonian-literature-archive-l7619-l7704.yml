canonical_text:
  quote: ''
  summary: The passage describes an Elamite-led coalition assembling with Babylonian
    and Chaldean allies, advancing to battle at Halule by the Tigris, and being defeated
    by the royal narrator after he prays to major Mesopotamian deities and fights
    with weapons associated with Ashur. The account emphasizes overwhelming battle
    imagery, slaughter, captured enemies, spoils, flight, and pursuit.
  language: English
  quote_policy: summarized
