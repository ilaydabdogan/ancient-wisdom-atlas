  text: A request is addressed to Ummanmenanu, King of Elam, to assemble his army,
    go to Babylon, and stand by the speakers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ummanmenanu accepts a bribe, assembles soldiers, camp, chariots, freight wagons,
    horses, and mules, and gathers a large confederation of named lands and peoples.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The confederation travels to Akkad and Babylon and unites its forces with
    Shuzub.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The allied forces are compared to spring locust swarms, and the dust of their
    feet is compared to a heavy cloud covering the heavens.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The battle line is formed at Halule on the bank of the Tigris, where the coalition
    attacks and battle is joined.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The royal narrator prays to Ashur, Sin, Shamash, Bel, Nabû, Nergal, Ishtar
