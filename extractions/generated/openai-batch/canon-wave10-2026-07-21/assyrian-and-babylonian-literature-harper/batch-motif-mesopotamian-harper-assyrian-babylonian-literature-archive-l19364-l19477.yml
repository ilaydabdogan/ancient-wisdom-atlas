canonical_text:
  quote: ''
  summary: Anu commands Bara to kill Zu and promises divine honor, but Bara refuses,
    citing Zu's seizure of the Tablets of Destiny and Bel's command-power and his
    retreat to an inaccessible mountain. A fragmentary section then describes Lugal-banda
    going to a distant mountain, thinking about Zu and Zu's household, bringing figures
    back from the mountain, and rising from Zu's nest after references to Siris, vessels,
    and mead. The passage then shifts to Dibbara, to whom Anu gives seven fated beings
    or weapons for destructive action.
  language: English
  quote_policy: summarized
