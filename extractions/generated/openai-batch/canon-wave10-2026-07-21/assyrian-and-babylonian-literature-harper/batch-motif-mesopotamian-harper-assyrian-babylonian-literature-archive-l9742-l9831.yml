canonical_text:
  quote: ''
  summary: Ashurbanipal’s annals describe divine punishment of Uaite and Arabia for
    breaking treaty oaths, famine and calamity, divine warriors aiding the Assyrian
    king, Uaite’s capture and public confinement at Nineveh, further conquests of
    Ushu and Akko, the flaying of Ayamu, and the seizure of Ummanaldash from a mountain
    refuge.
  language: English
  quote_policy: summarized
