  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Under the protection of named gods, the narrator captures Uaite and brings
    him to Assyria.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The narrator pierces Uaite’s jaw, puts a rope through his cheek, places a
