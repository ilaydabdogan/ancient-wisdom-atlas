canonical_text:
  quote: ''
  summary: The passage reports the rebuilding of a ruined work and a prayer that Shamash
    bless Ashurbanipal and his twin brother Shamash-shum-ukin. It instructs a future
    prince to repair and ritually honor the inscription, and curses anyone who destroys
    the written names. The next inscription presents Shamash-shum-ukin as a divinely
    favored king, named by Erua for dominion and selected by the great gods to gather
    scattered people and restore neglected laws.
  language: English
