canonical_text:
  quote: ''
  summary: The passage closes an inscription of Ramman-Nirari I by recounting royal
    ancestry, temple restoration, deposition of a tablet, instructions for a future
    restorer, and curses against anyone who damages or removes the tablet. It then
    begins an inscription of Nebuchadrezzar I with royal titles, Marduk's commission
    to avenge Akkad, and the hardships of a campaign through heat and lack of water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ramman-Nirari I is presented through conquest, enlarged boundaries, descent
    from Ashur-uballit, temple power, and royal prosperity compared to a mountain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A structure described as the mug-la-la of the Temple of Ashur had decayed,
    collapsed, and become ruinous.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he strengthened the place, reached its base, rebuilt it with
    granite and earth from Ubase, restored it, and set up his tablet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A future prince is instructed to repair the place when it decays and to restore
    the speaker's tablet to its place.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists prohibited acts against the tablet or name record, including
    erasure, replacing the name, concealment, destruction, casting into stream or
    water, burning in fire, covering with earth, or placing in a dark house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gods are invoked to look angrily on the violator, curse him, and destroy
    his name, seed, relatives, family, land, people, and territory.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ramman is invoked to overwhelm the violator with rainstorm, flood, wind, rebellion,
    famine, drought, and a destructive bolt, turning the land into mounds and ruins.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nebuchadrezzar I is introduced with royal, judicial, military, and boundary-preserving
    titles and is called beloved of Marduk.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Marduk commissions Nebuchadrezzar I, who advances his weapons to avenge Akkad.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: On campaign, the route is marked by burning heat, scorched road, lack of water,
