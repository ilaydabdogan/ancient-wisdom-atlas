canonical_text:
  quote: ''
  summary: Chronicle-style annals report Nabonidus' continued stay in Tema while his
    son and troops are in Akkad, repeated non-celebration of the Nisan akitu-festival,
    sacrifices in major temples, the death and mourning of the king's mother, campaigns
    by Cyrus, a later return of cultic processions and gods to Babylon, the capture
    of Sippar and Babylon without battle, Nabonidus' flight and capture, and Cyrus'
    proclamation of peace in Babylon.
  language: English
  quote_policy: summarized
