canonical_text:
  quote: ''
  summary: A fragment from the Legend of Dibbara describes martial taunts, the destruction
    of Babylon’s people, a lion-like destructive figure entering a palace, an army
    attacking a city, indiscriminate killing, blood flowing through the city, Marduk’s
    distressed reaction and curse, and a later account of Erech, where Ishtar becomes
    angry and sends an enemy who sweeps the city away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage opens with a fragmentary speech asking whether the speakers should
    be held back from the field or become like an asinnu-priest rather than knowing
    battle or beheading.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed addressee is said to have made the children of Babylon like birds,
    trapped them in a net, seized them, and destroyed them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same addressee leaves the city, goes into the country, becomes lion-like
    in appearance, and enters the palace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the army sees the addressee, weapons are made ready; the governor of
    Babylon becomes wrathful and sends out warriors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A speech instructs a man sent into a city not to fear warriors or men, but
    to kill both small and great, including a suckling babe, and to plunder Babylon’s
    wealth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The king’s army assembles, enters the city, draws bows, unsheathes daggers,
    and unsheathes weapons associated with temple servants or caretakers of Anu and
    Dagan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Blood is made to flow over the city square like torrent water, entrails are
    cut open, and the river carries them away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Marduk sees the events, cries out in woe, is seized in heart, and receives
    a curse in his mouth concerning the river’s water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A fragment says that walls were destroyed against the will of Shamash and
    that Bedouins and their wives threw firebrands into Erech, described as the seat
    of Anu and Ishtar.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Erech is described as containing hierodules, prostitutes, eunuchs, and isinnu-priests
    gathered in E-anna, with Ishtar associated with their condition and worship.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: A governor is appointed over the people of Erech, oppresses them, and changes
    their laws.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Ishtar becomes angry with Erech, sends an enemy against it, and the enemy
    sweeps it away like water sweeping grain.
  category: action
  evidence_refs:
  - ev:12
