canonical_text:
  quote: the hand of Nergal, my lord, has slain all the people of my land
  summary: A fragment urges the addressee to consult Ti, his mother, about earlier
    cordial relations with the speaker. A following letter from the king of Alashiya
    to the king of Egypt uses brotherly diplomatic address, reports a bronze present,
    explains reduced bronze production through the hand of Nergal, requests silver
    and other goods, discusses messengers, timber, a deceased Alashiyan's property,
    a child death, relations with Hittite and Shanhar kings, and authorized envoy
    exchange.
  language: English
  quote_policy: quoted
