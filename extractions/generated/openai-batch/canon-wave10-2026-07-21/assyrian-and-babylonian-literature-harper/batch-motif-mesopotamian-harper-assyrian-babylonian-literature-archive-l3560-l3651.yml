  summary: 'The passage recounts Ashurbanipal''s reign: Assyrian military dominance
    in Egypt, Judah''s vassal status, the spread of Assyrian culture and religion
    into western states, a reported scholarly view that Babylonian mythology may have
    influenced Genesis traditions, Shamashshumukin''s revolt, Gyges''s submission,
    and the rapid decline and fall of Assyria to Median and Kaldean forces after Ashurbanipal.'
