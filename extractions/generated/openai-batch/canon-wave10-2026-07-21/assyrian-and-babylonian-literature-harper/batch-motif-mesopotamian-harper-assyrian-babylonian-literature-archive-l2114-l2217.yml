  summary: The passage describes Assyrian letters as colloquial contemporary documents
    from varied writers across the empire, then introduces Babylonian legal and contract
    tablets as records of everyday economic, legal, household, and slavery-related
    life. It notes museum collections, publication and interpretation of tablets,
    types of transactions recorded, use of agents and powers of attorney, and several
    routes by which enslaved persons could gain freedom.
  language: English
