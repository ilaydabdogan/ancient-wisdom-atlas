canonical_text:
  quote: ''
  summary: A sequence of Shurpu incantations compares the removal of oath, ban, misery,
    disease, trespass, misdeed, crime, and sin from the speaker’s body to the cutting,
    tearing, or pulling away of ritual materials such as a date, husk, animal skins,
    and wool. These materials are thrown into fire or associated with the devouring
    Flame that consumes the afflictions. The passage ends with the speaker declaring
    that the hands are filled with upuntu seed and with many named ills, including
    heat, fever, chills, oath, ban, disease, enchantment, apparition, bewitchment,
    and evil witchcraft.
  language: English
  quote_policy: summarized
