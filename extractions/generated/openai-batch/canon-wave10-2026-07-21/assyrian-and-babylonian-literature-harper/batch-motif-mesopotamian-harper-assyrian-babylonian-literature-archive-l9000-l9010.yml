  quote: ''
  summary: Teumman, king of Elam, wounded in battle, flees with his oldest son Tamritu
    and hides in a forest. The royal narrator says that, under the protection of Ashur
    and Ishtar, he bound them and cut off their heads in each other's presence. A
    caption describes a man in a chariot holding a man's head, identified as Teumman's
    head, cut off in battle and brought to Assyria as joyful news.
