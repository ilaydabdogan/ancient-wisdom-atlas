canonical_text:
  quote: ''
  summary: A fragmentary annalistic passage reports conflict involving Cyrus, King
    of Anshan, the rebellion and surrender of Astyages by his own troops, Cyrus's
    movement to Ecbatana and the transfer of spoil to Anshan. A seventh-year entry
    places the king in Tema and the royal son, nobles, and soldiers in Akkad; the
    king does not come to Babylon for Nisan, Nabu does not come, Bel is not brought
    forth, and the akitu-festival is not celebrated. Sacrifices, libations, and guarding
    of the house continue at Esagila and Ezida for the gods of Babylon and Borsippa.
  language: English
  quote_policy: summarized
