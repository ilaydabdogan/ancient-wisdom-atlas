canonical_text:
  quote: ''
  summary: The passage contains a prayer to Marduk for the endurance of a temple,
    royal prosperity, tribute, peace, and dynastic rule, followed by Nebuchadrezzar
    II's titulary and account of divine commissioning, temple restoration, temple
    ornamentation, and fortification of Babylon with walls and gate images.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses merciful Marduk and prays that the temple he has built
    endure forever, that he attain old age, have offspring, receive tribute, have
    no enemies, and that his descendants rule.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nebuchadrezzar identifies himself as King of Babylon, exalted prince, favorite
    of Marduk, beloved of Nabu, servant of the gods, restorer of Esagila and Ezida,
    and son of Nabopolassar.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Marduk is said to have created Nebuchadrezzar and commanded him to lead the
    land, shepherd the people, restore cities, and renew shrines; Nebuchadrezzar says
    he obeyed Marduk.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nebuchadrezzar says he decorated E-kua and related shrines within Esagila
    with shining gold and made them shine like day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nebuchadrezzar says he rebuilt E-temen-an-ki, the temple-tower of Babylon,
    and rebuilt Ezida in Borsippa, making Ezida bright as the starry heavens with
    gold and precious stones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mighty cedar trees were decorated with gold and laid in rows for roofing over
    a shrine of Nabu.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Multiple named temples in Babylon and elsewhere were rebuilt, their turrets
    raised high, and the great gods were given residence within them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: For Babylon, the city of Marduk, Nebuchadrezzar completed the walls Imgur-Bel
    and Nimitti-Bel and stationed bronze wild-bulls and erect serpents at the entrances
    of the city-gates.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says Nabopolassar, Nebuchadrezzar's father, had earlier thrown
    a moat wall around the city, and that Nebuchadrezzar built the mighty walls again
    with bitumen and burned brick; the passage ends mid-sentence.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
