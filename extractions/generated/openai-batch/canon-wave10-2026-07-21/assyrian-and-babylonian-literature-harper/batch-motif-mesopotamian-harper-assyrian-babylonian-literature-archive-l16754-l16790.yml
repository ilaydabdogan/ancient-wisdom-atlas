canonical_text:
  quote: ''
  summary: A Babylonian sales contract records that Shamash-uballit and Ubartum sell
    Nanakirat and her unweaned son to Kagir and Nadin-Marduk for nineteen shekels
    of money, with guarantees against insubordination, royal-service claim, and emancipation.
    Witnesses, a scribe, the place, and the date in the eighth year of Nebuchadnezzar
    are given. An editorial note explains the contract as an example of a slave sale
    and comments on emancipation by adoption and earlier comparable contracts.
  language: English
  quote_policy: summarized
