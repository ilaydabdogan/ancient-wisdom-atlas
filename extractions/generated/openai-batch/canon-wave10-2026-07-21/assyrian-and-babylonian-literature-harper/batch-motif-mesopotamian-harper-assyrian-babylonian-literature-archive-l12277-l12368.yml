canonical_text:
  quote: ''
  summary: Darius states his Achaemenian lineage, claims kingship and sovereignty
    under Ahura-mazda, lists subject countries, describes obedience, tribute, lawgiving,
    reward, and punishment, then recounts Cambyses' killing of Bardiya, Gaumata's
    impersonation of Bardiya and seizure of sovereignty, and Darius' prayer to Ahura-mazda
    before killing Gaumata and taking back sovereignty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Darius says that members of his family have been kings from old, that eight
    family members ruled before him, and that he is the ninth king.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Darius says he is king under the protection of Ahura-mazda and that Ahura-mazda
    gave him sovereignty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Darius lists twenty-three countries that came to him and says he became their
    king by the will of Ahura-mazda.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Darius says the countries obey him, became subject to him, brought tribute,
    and performed what he commanded by night or day.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Darius says he rewarded prudent men, severely punished hostile men, and established
    ordinances as laws under the protection of Ahura-mazda.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cambyses, son of Cyrus, was king before Darius; Bardiya was Cambyses' brother
    with the same father and mother; Cambyses slew Bardiya, and the people did not
    know Bardiya had been slain.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Cambyses went to Egypt, the people became hostile in heart and treachery
    became rife in the provinces, including Persia and Media.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gaumata the Magian raised a rebellion from Pishihumadu, where the mountain
    Arakatri is located, and deceived the people by saying he was Bardiya, son of
    Cyrus and brother of Cambyses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The people went over to Gaumata; he seized the sovereignty, and afterward
    Cambyses committed suicide.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Darius says the sovereignty seized by Gaumata had belonged to Darius' family
    from old.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Darius says no Persian, Median, or member of his family could take the sovereignty
    from Gaumata, and that the people greatly feared Gaumata.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Darius says Gaumata killed many people who had known the former Bardiya so
    that they would not discover he was not Bardiya.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Darius says he prayed to Ahura-mazda, received Ahura-mazda as strong support,
