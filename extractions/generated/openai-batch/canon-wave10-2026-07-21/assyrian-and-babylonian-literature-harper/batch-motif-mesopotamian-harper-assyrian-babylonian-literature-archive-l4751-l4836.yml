canonical_text:
  quote: ''
  summary: A royal inscription of Tiglath-pileser I describes divine authorization
    by Ashur and the great gods, expansion of Assyria, campaigns against the Moschi,
    Qummuh, Seresse, Kurteans, and Urartinash, the crossing of mountains and rivers,
    the taking of booty, idols, captives, and hostages, and the burning and devastation
    of cities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashur and the great gods are said to have enlarged the narrator's kingdom,
    given him strength and power, commanded him to extend divine territory, and put
    powerful weapons in his hand.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says he subjugated lands, mountains, cities, and rulers described
    as enemies of Ashur, fought sixty kings, and added land and people to Assyria.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Five kings of the Moschi with twenty thousand men are described as having
    conquered Qummuh after relying on their strength.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: With the help of Ashur, the narrator assembled chariots and warriors, crossed
    the difficult region of Kashiari, fought the five kings in Qummuh, and defeated
    them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Moschi defeat is described with images of crushed corpses, blood flowing
    over ravines and mountain heights, severed heads piled at city walls, booty carried
    away, and six thousand prisoners taken into Assyria.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The people of Qummuh are said to have withheld tax and tribute due to Ashur;
    the narrator conquered Qummuh, took goods, burned its cities, and pursued fugitives
    who crossed the Tigris to Seresse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator says he crossed steep mountains, cut difficult paths with bronze
    pickaxes, built a road for chariots and troops, crossed the Tigris, and conquered
    Seresse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Seresse, soldiers are described as scattered in mountain forests, blood
    flowing into the Tigris and over mountain heights, Kurtean helpers being overthrown,
    and the river Name carrying corpses into the Tigris.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kilianteru, also called Sarupi, his wives, children, and relatives were captured;
    vessels, idols of gold and silver, booty, and goods were taken; the city and palace
    were burned, destroyed, and devastated.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Urartinash is described as a stronghold on Mount Panari; fear of the awful
    splendour of Ashur overwhelmed its inhabitants, who carried away idols and goods
    and fled to high mountain peaks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Shadianteru, king of Urartinash, did not fight but embraced the narrator's
    feet; his sons and relatives were taken as hostages, and a tribute presentation
    begins before the passage breaks off.
  category: sequence
  evidence_refs:
  - ev:8
