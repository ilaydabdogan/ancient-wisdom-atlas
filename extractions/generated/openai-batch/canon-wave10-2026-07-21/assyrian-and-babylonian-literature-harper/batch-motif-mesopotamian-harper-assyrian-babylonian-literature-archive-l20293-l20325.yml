canonical_text:
  quote: ''
  summary: The eagle carries Etana upward for several hours and comments on the shrinking
    appearance of the land and sea below. The eagle and Etana reach the heaven of
    Anu, pass through the gate of Anu, Bel, and Ea, and worship. A mutilated column
    is noted as repeating the flight. Etana later says he will not continue rising
    to heaven and asks to return to earth; he and the eagle fall downward together
    for three double hours, strike the ground, and the eagle bursts apart. Etana's
    final condition is bracketed as uncertain in the passage.
  language: English
