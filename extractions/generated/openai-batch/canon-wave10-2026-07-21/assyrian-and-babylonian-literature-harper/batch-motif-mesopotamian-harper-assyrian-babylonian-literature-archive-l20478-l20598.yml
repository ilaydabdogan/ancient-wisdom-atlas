canonical_text:
  quote: ''
  summary: The people complain that Gilgamesh oppresses families in Erech. The gods
    hear the cry and ask Aruru to create a rival for him. Aruru creates Eabani from
    clay. Eabani is hairy, lives among animals, drinks and feeds with them, and frustrates
    a hunter’s traps. The frightened hunter reports Eabani’s strength and obstruction
    of hunting, and his father advises him to go to Erech to find Uchat, a tempter,
    to entice Eabani.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people complain that Gilgamesh, ruler of strong-walled Erech, does not
    leave children, daughters, maidens, or wives to their families or partners.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods of heaven hear the cry and address Aruru, asking her to create a
    rival to Gilgamesh so that the two may fight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aruru creates a man in her heart after the likeness of Anu, washes her hands,
    takes clay, casts it on the ground, and creates Eabani.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Eabani is described as a hero with a body covered in hair and long luxuriant
    hair on his head.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Eabani eats herbs with gazelles, quenches thirst with beasts, and sports with
    creatures of the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hunter Sa-a-a-du lies in wait for Eabani at the entrance to the well for
    three days, but becomes troubled and fearful when he sees him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hunter reports that Eabani has great strength, roams the mountains, feeds
    with the beasts of the field, and regularly comes to the entrance of the well.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The hunter says Eabani fills up his pit, destroys his nets, releases cattle
    and beasts from his hands, and prevents him from hunting.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The hunter’s father tells him to go to Erech, and the fragmentary continuation
