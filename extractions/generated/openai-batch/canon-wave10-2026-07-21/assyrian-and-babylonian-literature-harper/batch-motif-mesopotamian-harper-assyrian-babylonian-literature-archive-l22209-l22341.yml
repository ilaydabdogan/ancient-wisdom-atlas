canonical_text:
  quote: ''
  summary: After the flood, an offering is made and the gods gather to its scent.
    Ishtar remembers the destruction and bars Bel from the offering because he caused
    the flood. Bel is angry that survivors remain in the ship. Ninib identifies Ea
    as the one who could have planned the escape, and Ea rebukes Bel for indiscriminate
    destruction, proposing lesser judgments and explaining that the divine mystery
    reached Per-napishtim through a dream involving Atrachasis. Bel then brings Per-napishtim
    and his wife out of the ship, blesses them, makes them godlike, and settles them
    far away at the mouth of the rivers. Per-napishtim then asks Gilgamesh what god
    will grant him the life he seeks.
  language: English
  quote_policy: summarized
