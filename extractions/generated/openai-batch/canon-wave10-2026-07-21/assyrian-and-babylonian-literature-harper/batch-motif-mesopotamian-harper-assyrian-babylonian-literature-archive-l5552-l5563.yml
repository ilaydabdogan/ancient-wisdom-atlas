canonical_text:
  quote: ''
  summary: The passage introduces an inscription of Nabupaliddin. It describes Shamash
    as the great lord dwelling in Ebabbara in Sippar. During uprisings in Akkad, the
    Sutu, identified as a hostile foe, overturned the sanctuary and destroyed its
    reliefs. Shamash’s law was forgotten, his image and insignia disappeared, and
    their location was unknown. Simmasshihu, king of Babylon, searched for the statue,
    but Shamash did not reveal himself and the king did not find it in the surviving
    excerpt.
