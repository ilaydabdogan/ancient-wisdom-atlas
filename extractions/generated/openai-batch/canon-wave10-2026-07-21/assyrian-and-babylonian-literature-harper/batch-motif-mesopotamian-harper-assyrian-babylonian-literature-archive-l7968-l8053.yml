canonical_text:
  quote: ''
  summary: Esarhaddon narrates the submission of distant Median city-officers, the
    imposition of treaty obligations, tribute, and taxes, divine empowerment by major
    gods, temple enrichment with booty, demolition and expansion of a palace at Nineveh,
    compulsory labor and material deliveries from twenty-two kings, and the installation
    of protective palace colossi.
  language: English
  quote_policy: summarized
