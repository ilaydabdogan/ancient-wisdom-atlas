canonical_text:
  quote: ''
  summary: A second Babylonian creation account describes an initial state in which
    sacred houses, cities, reeds, trees, bricks, temples, and dwellings had not yet
    been made and the world was a single sea. A movement in the sea precedes the building
    of Eridu, E-sagila, and Babylon. Marduk creates the Anunnaki, constructs an enclosure
    around the waters, forms dust as a divine dwelling, creates mankind with Aruru,
    and creates animals, rivers, plants, bricks, houses, cities, and temples. The
    passage then turns to the heading and opening summary of another account of the
    fight between Marduk and Tiamat, where Tiamat's approach terrifies mankind.
  language: English
  quote_policy: summarized
