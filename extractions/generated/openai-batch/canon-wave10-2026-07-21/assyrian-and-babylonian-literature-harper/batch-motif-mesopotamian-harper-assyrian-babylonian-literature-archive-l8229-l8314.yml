canonical_text:
  quote: ''
  summary: A royal inscription passage presents Esarhaddon as divinely favored king
    and conqueror, recounts the defeat of Tarqu of Egypt and Cush and the capture
    of Memphis, describes administration and offerings imposed in Egypt, records the
    setting up of a commemorative tablet, and ends with a curse against anyone who
    damages, removes, hides, burns, or submerges the tablet.
  language: English
  quote_policy: summarized
