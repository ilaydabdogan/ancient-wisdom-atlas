- id: obs:3
  text: The passage says the king prostrated himself before Ashur, Shamash, Nabu,
    and Marduk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king is described as favored or beloved by several deities, including
    Ashur, Nabu, Marduk, Sin, Anu, and Ishtar.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ashur, Shamash, Nabu, and Marduk are said to have decreed for the king a kingdom
