  evidence_refs:
  - ev:7
- id: obs:10
  text: Memphis is said to have been besieged, conquered, torn down, destroyed, and
    burned with fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The king says he carried away Tarqu's palace women, Ushanahuru, other children,
    property, horses, oxen, and sheep as spoil to Assyria.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The king says he appointed officials over Egypt, instituted regular offerings
    to Ashur and the great gods, and imposed tribute and taxes.
  category: action
  evidence_refs:
  - ev:9
