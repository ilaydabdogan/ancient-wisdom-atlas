canonical_text:
  quote: ''
  summary: Adapa is described as a wise human associated with Ea and Eridu, granted
    wisdom but not eternal life. He serves Eridu by preparing bread, water, and tables
    and by managing boating, fishing, and hunting. While steering a boat, the south-wind
    drives him into the ocean and sinks him; Adapa declares he will break the south-wind's
    wing, and the wind ceases for seven days. Anu hears from Ilabrat that Adapa broke
    the wind's wing and summons him. Ea clothes Adapa as a mourner and instructs him
    how to answer the gate guardians Tamuz and Gishzida, refuse death-labeled food
    and water, and accept garment and oil. Adapa is then brought on the road to heaven
    and reaches Anu's gate, where Tamuz and Gishzida question his mourning appearance.
  language: English
  quote_policy: summarized
