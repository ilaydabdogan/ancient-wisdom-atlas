canonical_text:
  quote: ''
  summary: 'The passage gives an Ashurbanipal inscription formula blessing a future
    preserver of a royal inscription and invoking gods against a destroyer. It then
    presents Ashurbanipal’s Babylon building inscription: his royal titles and divine
    authorization, restoration of temples and offerings, Marduk’s rejoicing entry
    into Babylon, establishment of law and order, appointment of his twin brother
    Shamash-shum-ukin as king of Babylon, repair of Ezida’s wall, prayers to Nabu
    for favor and enduring rule, and instructions and sanctions for future handling
    of the royal image and inscription.'
  language: English
  quote_policy: summarized
