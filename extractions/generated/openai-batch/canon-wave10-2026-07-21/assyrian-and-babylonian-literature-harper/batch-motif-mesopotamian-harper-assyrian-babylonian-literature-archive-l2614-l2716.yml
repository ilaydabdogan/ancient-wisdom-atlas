canonical_text:
  quote: ''
  summary: 'The passage describes Babylonian incantation religion through three elements:
    demons, witches, and exorcisers. It lists kinds and behaviors of demons, their
    omnipresence and monstrous representation, explains the blurred distinction between
    demons and gods, describes witches and sorcerers as possessed or abnormal persons
    with powers like or over demons, details magical controls such as evil words,
    evil eye, potions, knots, and effigies, and concludes with protective amulets,
    talismans, and the rise of priests as specialists against demoniacal powers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage names demons, witches, and exorcisers as the three chief elements
    of this phase of Babylonian religion discussed after the incantation texts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Demons are described with numerous names that may indicate timing, attack
    method, or attribute, including night-spirit, one who lies in wait, seizer, and
    strong one.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Evil spirits are said to penetrate every corner of the universe and to cause
    evils ranging from disease and desert wind to quarrels, headaches, broken dishes,
    and bad dreams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Evil spirits are described as entering ordinary human spaces, including streets,
    doors, and food, while also having favorite haunts in lonely desert, silent grove,
    and shadowed mountain wady.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: On monuments, evil spirits are represented in ugly and monstrous animal or
    human forms; palace entrances were protected by huge bull and lion representations,
    some called shedu.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the dividing line between demons and gods is often difficult
    to trace and that some gods can be traced back to demons while some old local
    gods persisted as evil spirits.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Most spirits are described as hostile to humans and animals, while gods are
    usually favorable and can be appeased when angry.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage connects widespread belief in demons with belief in witchcraft
    and says demons could take possession of human beings.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Witches are described mostly as persons of abnormal appearance, such as dwarfs,
    giants, deformed or insane persons, and persons possessing the evil eye.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Possessed persons are said to have the same power as demons and to be capable
    of getting inside a man to cause mischief.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Witches are described as eventually conceived as superior to evil spirits
    and able to control them.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Methods of witch or sorcerer control include the evil word or magical formula,
    the glance of an evil eye, and potions made from noxious herbs.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: A sorcerer might tie knots in a rope while repeating formulae, symbolically
