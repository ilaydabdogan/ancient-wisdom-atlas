canonical_text:
  quote: ''
  summary: 'The passage summarizes Ishtar''s wrath after Gilgamesh rejects or offends
    her: Anu, her father, is compelled to create the heaven-bull. The fight against
    the bull is mostly lost, but fragments and a described cylinder show Eabani and
    Gilgamesh attacking it. After the bull is killed, the heroes make a thank offering
    to Shamash. Ishtar curses Gilgamesh from the wall of Erech, and Eabani tears out
    the bull''s right side and throws it in her face.'
  language: English
  quote_policy: summarized
