canonical_text:
  quote: ''
  summary: The passage begins with Sin's expected return to his seat and a note about
    a damaged royal stone on Sin's statue. The clay-cylinder inscription introduces
    Nabonidus with royal titles and divine prenatal destiny, recounts the destruction
    of E-hul-hul at Harran by Scythians after Sin became angry, narrates a vision
    in which Marduk commands Nabonidus to rebuild the temple and restore Sin's residence,
    reports the defeat of the Scythians by Cyrus and the capture of Astyages, and
    describes Nabonidus mobilizing troops and carrying out foundation rituals with
    divine guidance and precious materials.
  language: English
  quote_policy: summarized
