canonical_text:
  quote: ''
  summary: A violent flood-storm darkens and overwhelms the land, terrifying the gods.
    Ishtar laments that she assented to the destruction of her own people. After six
    days and nights the storm moderates; the narrator sees that mankind has become
    clay and that all is sea. The ship comes to rest on Mount Nisir. The narrator
    releases a dove, a swallow, and a raven to test the waters, then releases everything
    to the four winds and offers sacrifice and libation on the mountain peak.
  language: English
  quote_policy: summarized
