canonical_text:
  quote: ''
  summary: 'The passage gives Ottoman regulations for excavating antiquities: applicants
    must submit plans and requests, permits require ministerial and museum approval,
    excavations are subject to limits, fees, official oversight, reporting duties,
    and rules about discoveries, proceeds, and duties on antiquities.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person wishing to excavate antiquities must prepare a topographical plan
    showing the boundaries of the proposed site and submit it with a written request
    to the specified authorities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ministry of Public Instruction issues excavation permits only after agreement
    with the Imperial Museum direction and after the required consent of the Sublime
    Porte is obtained.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A permit can be granted only if the excavation does not obstruct forts, fortifications,
    public buildings, or public utility, if any private owner is satisfied, and if
    agreed pecuniary security is deposited.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: No excavation permit may be granted for more than two years, though an additional
    period of no more than one year may be granted if there is no objection and the
    museum director agrees.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Ministry of Public Instruction collects excavation permit fees for the
    museum according to permit duration.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A permit is annulled if excavations are not begun within three months of its
    date or if commenced work is discontinued for two months.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: An excavation permit may not cover more than ten square kilometres, and the
    government may order a temporary stoppage without owing expenses or damages to
    the explorer.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The government keeps an official at the excavation site, and the excavators
    pay the official's travel expenses and salary, with surplus salary money returned
    if the work ends early.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Officials of the Ottoman or a foreign government may not receive permits for
    excavations within their official district; permits may not be transferred; and
    a person may not hold excavation permits for more than one place.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Persons who accidentally discover antiquities must inform the Ministry of
    Public Instruction in Constantinople within five days or local authorities in
    the provinces within ten days.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: At permit expiration or excavation termination, the security deposit is returned
    if the excavator has fulfilled the regulations.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Proceeds from seizures, auctions, divisions with owners, fines, permit fees,
    and confiscations belong to the museum treasury; imported antiquities and internal
    transport of antiquities are exempt from specified duties.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
