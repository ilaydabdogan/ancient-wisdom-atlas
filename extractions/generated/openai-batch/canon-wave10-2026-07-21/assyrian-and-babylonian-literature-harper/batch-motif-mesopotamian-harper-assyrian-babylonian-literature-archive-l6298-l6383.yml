  - ev:6
  - ev:7
- id: obs:10
  text: At Urash, the speaker says he dyed the chief street with the blood of warriors,
    killed six thousand fighting men, and captured Pirishati alive.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker had a life-size image of his royal person made, inscribed it with
    deeds of Ashur, his bravery, and his accomplishments in Nairi, and set it up in
    Qbara.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The people of Mata abandoned their cities and ascended snow-capped mountains
    after fearing Ashur’s weapons and the speaker’s battle attack.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: On return, the speaker crossed mountains, defeated Munsuarta’s warriors, and
