canonical_text:
  quote: ''
  summary: A royal Assyrian inscription recounts Shamshi-Ramman’s campaigns against
    Nairi, Misa, Gizilbunda, Mata, and other groups. The king receives tribute, sends
    a commander, crosses rivers and mountains, pursues enemies into mountain strongholds,
    kills warriors, takes spoils and captives, burns cities, invokes major gods as
    helpers, and sets up an inscribed life-size royal image recording his deeds.
  language: English
  quote_policy: summarized
