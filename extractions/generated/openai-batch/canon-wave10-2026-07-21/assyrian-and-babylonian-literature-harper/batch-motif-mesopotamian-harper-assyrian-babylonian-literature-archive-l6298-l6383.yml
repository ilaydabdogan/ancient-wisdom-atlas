  text: The speaker says he received tribute in the form of horses yoked for harness
    from kings of Nairi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that, by command of Ashur, Shamash, Ramman, Ishtar, and other
    gods, territory became submissive to him.
  category: relationship
  evidence_refs:
