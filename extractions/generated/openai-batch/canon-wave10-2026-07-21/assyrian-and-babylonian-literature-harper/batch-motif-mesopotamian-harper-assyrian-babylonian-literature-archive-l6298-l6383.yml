  text: In a second campaign, Mutarrig-Ashur was sent with army and camp-baggage to
    Nairi and marched to the Western Sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mutarrig-Ashur conquered cities, killed fighting men, carried away spoil,
    possessions, gods, sons, and daughters, and destroyed, devastated, and burned
    cities.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a third campaign, the speaker crossed the river Zaban, passed over Mount
    Qilar, and went up to Nairi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Misa abandoned their cities and made three inaccessible mountain peaks
    their strongholds.
