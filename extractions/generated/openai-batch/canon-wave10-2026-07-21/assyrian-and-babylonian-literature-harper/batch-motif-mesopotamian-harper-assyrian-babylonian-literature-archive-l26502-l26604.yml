canonical_text:
  quote: "“Absolve my sins, lift up my face!”"
  summary: A penitential prayer alternates between a suppliant and priest. The sufferer
    cries to a merciful divine mistress, asks that her face be turned toward him and
    that she take his hand, laments divine anger, misfortune, tears, and many transgressions,
    praises Mother Ishtar as creator and guide, and closes with invocations to several
    deities.
  language: English
  quote_policy: quoted
