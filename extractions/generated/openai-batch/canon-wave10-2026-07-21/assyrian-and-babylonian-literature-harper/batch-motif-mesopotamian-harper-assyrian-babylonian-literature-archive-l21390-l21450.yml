canonical_text:
  quote: ''
  summary: The passage introduces Tablet IX as beginning with Gilgamesh mourning the
    death of Eabani, fearing death, and resolving to seek his ancestor Per-napishtim
    to learn the mystery of apotheosis and obtain recovery from a disease inflicted
    by Ishtar. Gilgamesh says he will set out at once. He then narrates reaching a
    mountain ravine by night, seeing lions, becoming afraid, and praying to the god
    Sin. Editorial footnotes discuss variant readings of Per-napishtim's name and
    a phrase compared with Homeric expressions.
  language: English
