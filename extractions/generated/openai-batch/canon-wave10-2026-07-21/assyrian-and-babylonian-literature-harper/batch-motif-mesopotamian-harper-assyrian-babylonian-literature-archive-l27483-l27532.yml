canonical_text:
  quote: ''
  summary: 'The passage lists lunar and planetary omens: configurations of the Moon''s
    horns, size, brightness, date of appearance, eclipses, and Mercury''s appearance
    are connected with predictions about security for the land, royal conquest or
    rule, crop prosperity, long reign, regional fortune or misfortune, and military
    or political outcomes. Several notices are attributed to named officials or servants.'
  language: English
  quote_policy: summarized
