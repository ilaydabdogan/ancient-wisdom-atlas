canonical_text:
  quote: ''
  summary: Nabonidus reports preserving an earlier inscription of Naram-Sin with ritual
    treatment, prays to Shamash for signs, favor, and enduring legitimate rule, describes
    rebuilding Anunit's long-neglected temple E-ul-bar at Sippara, installs Anunit
    there with increased offerings, and asks future rulers to preserve his inscription
    in the same manner if they rebuild the temple.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nabonidus says he found an inscription written in the name of Naram-Sin, did
    not alter it, anointed it with oil, offered sacrifices, placed it with his own
    inscription, and restored it to its place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nabonidus addresses Shamash upon the god's entry into E-babbara and asks Shamash
    to look joyfully on him and his works.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shamash is described as great lord of heaven and earth, light of the gods,
    and offspring of Sin and Ningal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nabonidus asks for favorable signs at the rising and setting of the sun, for
    acceptance of supplications, and for continued possession of the legitimate sceptre
    and staff entrusted to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Anunit is described as mistress of battle, bearer of bow and quiver, executor
    of Bel's commands, destroyer of enemies and the wicked, marcher before the gods,
    and giver of favorable signs at sunrise and sunset.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old platform-foundation of Anunit's temple E-ul-bar in Sippara is said
    not to have been rebuilt for eight hundred years since Shagashaltiburiash.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nabonidus says he excavated, discovered, laid the foundation, raised the brickwork,
    rebuilt the temple, completed it, made Anunit reside there, and enlarged the offerings
    set before her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nabonidus asks Anunit to enter the temple joyfully, look on his works, and
    every month at sunrise and sunset bring his loyal homage to Sin.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nabonidus addresses a future ruler whom Sin and Shamash may name to kingship
    and asks that ruler, if rebuilding the decayed temple, to preserve Nabonidus's
    inscription without alteration and treat it with oil and sacrifices.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The closing blessing asks Shamash and Anunit to hear the future restorer's
    prayer, favor his commands, march at his side, overthrow his foes, and mention
    him daily before Sin.
  category: speech
  evidence_refs:
  - ev:8
