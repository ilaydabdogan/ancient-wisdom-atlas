canonical_text:
  quote: ''
  summary: A Maqlu incantation passage invokes Nusku and the Fire-god against a sorcerer
    and sorceress. The petitioner asks for the destruction of hostile practitioners
    and for personal life, security, prosperity, and strength. Ritual directions call
    for whispered incantations before wax and bronze images, including bronze images
    made of the sorcerer and sorceress and placed before the Fire-god.
  language: English
  quote_policy: summarized
