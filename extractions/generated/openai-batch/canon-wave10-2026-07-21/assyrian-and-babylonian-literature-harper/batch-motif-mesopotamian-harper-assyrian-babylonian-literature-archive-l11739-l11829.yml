canonical_text:
  quote: ''
  summary: Nabonidus recounts rebuilding and adorning temples, installing guardian
    objects, returning deities to their dwellings, offering sacrifices, praying for
    divine favor, preserving an older royal inscription, and rebuilding Shamash's
    temple at Sippara after a divinely revealed discovery of Naram-Sin's ancient foundation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nabonidus says he rebuilt the temple anew from platform-foundation to roof,
    strengthened its parts, used cedar, and overlaid brickwork with silver and gold.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bright metal wild bull and two Lahmus are placed in relation to the temple,
    with stated functions of forcing back or overthrowing enemies.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nabonidus takes the hands of Sin, Ningal, Nusku, and Sadarnunna from Babylon
    and makes them reside in the restored temple with joy and rejoicing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nabonidus offers clean sacrifices and presents before the deities and says
    he brought E-hul-hul and Harran to perfection.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker prays that Sin look favorably on him, give monthly favorable signs,
    lengthen his days, establish his reign, and defeat his enemies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ningal, Shamash, Ishtar, and Nusku are invoked to mention or intercede for
    Nabonidus before Sin.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nabonidus finds an inscription in the name of Ashurbanipal, does not alter
    it, anoints it, offers sacrifices, places it with his own inscription, and restores
    it to its place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At E-babbara in Sippara, Nabonidus reports that an earlier rebuilding by Nebuchadrezzar
    had failed and that he became anxious when the walls had fallen in.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After removing Shamash to another house, Nabonidus pulls down E-babbara, searches
    for the old platform-foundation, and digs eighteen cubits deep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Shamash permits Nabonidus to behold the platform-foundation of Naram-Sin,
    son of Sargon, unseen by previous kings for thirty-two hundred years.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A favorable month and auspicious day are said to have been revealed to Nabonidus
    by Shamash and Ramman in a vision.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: Nabonidus rebuilds E-babbara and its temple-tower on Naram-Sin's foundation
    without moving inward or outward, using precious materials and cedar.
  category: action
  evidence_refs:
  - ev:10
