canonical_text:
  quote: the king, the sun in the heavens
  summary: A royal letter commands the addressee to visit the king, not to delay again
    or send his son as substitute, and to hand over named enemies through the king's
    messenger Hanni. The enemies are to be prevented from escaping and shackled in
    bronze. The letter closes by declaring the king well, numerous in warriors and
    chariots, and prosperous across all lands from sunrise to sunset.
  language: English
  quote_policy: quoted
