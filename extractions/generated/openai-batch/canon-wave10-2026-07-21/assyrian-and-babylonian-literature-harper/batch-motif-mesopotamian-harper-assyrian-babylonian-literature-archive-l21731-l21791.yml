  quote: ''
  summary: In this excerpt from Tablet X, Gilgamesh recounts earlier exploits, the
    death of his friend Eabani, and his long journey over lands, mountains, and seas
    to seek Per-napishtim, called the distant. Per-napishtim is summarized as replying
    that he cannot help Gilgamesh escape death, because death comes to all, its timing
    is unknowable, and divine powers determine death and life.
