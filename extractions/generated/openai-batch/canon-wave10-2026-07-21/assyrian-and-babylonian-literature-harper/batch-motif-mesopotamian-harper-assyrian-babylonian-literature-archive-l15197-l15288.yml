  quote: ''
  summary: The excerpt preserves portions of Tel-El-Amarna correspondence. In one
    letter, an unnamed royal sender asks his “brother” for abundant gold for munitions
    and a wife, requests the prompt return of the messenger Gilia, invokes Tishub
    and Amanum over the messages and friendship, and lists presents. A following letter
    from Tushratta of Mitani to Amenophis IV/Naphuria of Egypt opens with royal kinship
    greetings and discusses detained messengers.
