canonical_text:
  quote: The kings of the earth shall kiss thy feet.
  summary: A promise says Eabani will recline on a fine couch and receive a seat at
    the left while rulers, the people of Erech, and nations are subordinated to him.
    Eabani listens to Shamash and his anger is quieted. An editorial note states that
    a continuation has Gilgamesh make the same promise, that the gods intend friendship
    between Eabani and Gilgamesh, and that later fragments describe a divine-involved
    battle of Erech against Humbaba, ending in Humbaba's death and Gilgamesh's enthronement
    as king of Erech. The editor further interprets the poetic narrative as a mythical
    representation of a political upheaval.
  language: English
  quote_policy: quoted
