canonical_text:
  quote: ''
  summary: The passage contains portions of Tel-el-Amarna correspondence. An opening
    sender pledges obedience to the king and Dudu, mentions Hatib, Hittite movement
    in Nuhashshe, and possible snares for Aziri. Aziri writes to Hai declaring loyalty
    and explaining delay because of the Hittite king. The Egyptian king then writes
    to Aziri, rebuking him over the Prince of Gebal and peace with Kadesh, and warning
    of danger, burning, and death if he remains hostile.
  language: English
  quote_policy: summarized
