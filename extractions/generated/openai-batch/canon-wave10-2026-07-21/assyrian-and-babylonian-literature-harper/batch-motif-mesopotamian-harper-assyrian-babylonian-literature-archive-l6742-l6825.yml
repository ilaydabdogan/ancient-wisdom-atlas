canonical_text:
  quote: ''
  summary: The inscription recounts tribute brought to Tiglath-pileser III, the establishment
    of Assyrian authority, the installation of Hulli on the throne of Tabal after
    Uassurme failed to appear, and the construction and naming of royal palaces and
    gates at Kalhi. The king attributes his understanding and skill to the divine
    messenger Nugimmut, describes foundations, imported materials, cedar beams, decorated
    gates, guardian lions and bull-colossi, a protective statue, and names for the
    palaces and gates that invoke joy, abundance, blessing, righteousness, judgment,
    and continuing tribute from mountains and seas.
  language: English
  quote_policy: summarized
