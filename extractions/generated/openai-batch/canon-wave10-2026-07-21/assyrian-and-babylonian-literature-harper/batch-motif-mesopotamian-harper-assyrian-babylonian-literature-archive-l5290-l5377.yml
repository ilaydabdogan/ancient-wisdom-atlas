canonical_text:
  quote: ''
  summary: A royal first-person speaker recounts rebuilding the Temple of Anu and
    Adad after long decay, installing the gods in the restored dwelling, rebuilding
    Adad's treasure-house, offering sacrifice and precious stones, praying for rain,
    prosperity, victory, dynastic blessing, and priestly stability, and depositing
    inscribed records in the temple corner stones.
  language: English
  quote_policy: summarized
