  text: The Temple of Anu and Adad is said to have been built earlier by Shamshi-Adad,
    to have decayed for 641 years, to have been pulled down by Ashur-dan, and then
    to have lacked a foundation for 60 years.
  category: sequence
  evidence_refs:
