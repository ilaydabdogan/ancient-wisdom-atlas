canonical_text:
  quote: ''
  summary: The passage contains portions of several Tel-el-Amarna letters to the king
    of Egypt. Zimrida of Sidon prostrates himself, praises the king, reports enemy
    pressure and lost cities, and asks for military assistance to restore them. Abi-milki
    of Tyre prostrates himself, calls himself dust under the king's sandals, and says
    the Prince of Sidon has denied him access to wood and drinking water after the
    king's troops forsook him. Shuwardata prostrates himself, reports a royal commission
    to war against Keila and a victory, then accuses Abd-hiba and Lapaja of taking
    or plundering cities. Abd-hiba prostrates himself, denies rebellion, says the
    king appointed him, and complains that a royal officer favors invaders over princes.
  language: English
  quote_policy: summarized
