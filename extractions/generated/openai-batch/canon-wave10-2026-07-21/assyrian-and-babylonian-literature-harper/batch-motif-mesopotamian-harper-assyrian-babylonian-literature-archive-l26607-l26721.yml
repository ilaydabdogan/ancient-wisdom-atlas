canonical_text:
  quote: '"May the wrath of the heart of my god be pacified!"'
  summary: A penitential hymn addresses divine mistresses, especially goddess Nana
    and later goddess Anunit. The speaker asks that divine eye and face turn favorably,
    that heart and liver be pacified, and that forgiveness, respite, mercy, and long
    life be granted. The suppliant is described as tearful, fettered, weak, and bound,
    while other deities and divine spouses are also invoked.
  language: English
  quote_policy: quoted
