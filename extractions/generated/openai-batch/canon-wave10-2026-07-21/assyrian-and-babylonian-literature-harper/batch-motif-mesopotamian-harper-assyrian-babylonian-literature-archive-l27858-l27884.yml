canonical_text:
  quote: ''
  summary: 'Two royal omen reports concern eclipses: one predicts an eclipse on the
    fourteenth as harmful for Elam and Aharru but favorable for the king, and another
    says an eclipse occurred but was not visible in Asshur because of clouds, recommends
    checking other cities, and calls for a nambulbi-ceremony. The second report says
    the great gods obscured the heavens so the eclipse was not directed against the
    king or his country. A final omen states that thunder in Nisan predicts diminished
    corn.'
  language: English
  quote_policy: summarized
