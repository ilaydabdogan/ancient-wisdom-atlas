canonical_text:
  quote: ''
  summary: The passage lists Mesopotamian omen reports in which appearances or relations
    of the Moon, Sun, Jupiter, Venus, Mercury, Mars, a great star, and storms are
    interpreted as predictions about kings, warfare, famine, markets, rain, floods,
    crops, healing, childbirth, divine favor, sanctuaries, and eclipses. Several reports
    are signed by named senders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moon-Jupiter configurations are presented as omens for royal death, eclipses,
    want in Aharru, the slaying of the King of Elam, revolt, low markets, and hostility
    in the land.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A great star shining from north to south after two hours of night is interpreted
    as propitious for the king's desire and the King of Akkad's mission.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Venus appearing at sunset in the Tropic of Cancer is interpreted through omens
    involving slaughter of the enemy, the King of Akkad having no rival, obedience,
    welfare, divine mercy, full stores, prosperous crops, recovery of the sick, successful
    pregnancies, and renewed sanctuaries.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Venus disappearing at sunrise throughout Kislev is interpreted as famine of
    corn and straw in the land.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A speaker called the lord of kings asks why the month was not observed and
    the lucky and unlucky were not sent; the reporting speaker asks for favor to make
    decisions and tell the king.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mercury seen in Iyyar is interpreted as a flood that benefits fields and meadow
    lands, and Jupiter reaching Mars is interpreted as rain.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Moon and Sun not being seen together on the fourteenth, followed by god
    seen with god on the fifteenth, is associated with the King of Subarti having
    no rival.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mercury visible with Mars at sunset and ascending to Shugi is interpreted
    as rains and floods; Jupiter appearing at the beginning of the year is interpreted
    as crop prosperity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Storm omens are interpreted as increased crops, a steady market, the land's
    reign ruling great power, and an eclipse of Kasshi when a storm bursts in Sebat.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage presents multiple reports signed by named senders, including Asharidu,
    Shumai, Bel-ahi-eriba, and Nadinu.
  category: other
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
