canonical_text:
  quote: ''
  summary: A hymnic closing passage of the Babylonian creation account lists and explains
    divine names and powers of Marduk. He is praised as lord of incantation, giver
    of life, creator of mankind, destroyer of wicked beings, sender of storm and winds,
    defeater of Tiamat, director of stars, creator of heaven and earth, and Lord of
    the Universe. Ea rejoices that such names are given to his son, and the passage
    commands leaders, the wise, and fathers to transmit the account.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A god named Mir-azag is praised as lord of pure incantation, restorer of dead
    to life, merciful to vanquished gods, remover of a yoke from adversary gods, creator
    of mankind in their place, and one with power to grant life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A god named Tu-azag is associated with an enchanting word and with destroying
    the wicked by pure incantation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A god named Sha-zu is described as knowing the heart of the gods, searching
    the innermost, preventing the wicked from escaping, summoning the council of the
    gods, rejoicing their hearts, subduing rebels, and causing justice to prevail.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A god named Zi-si sends forth the hurricane and lets loose storm and winds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A god named Shug-kur destroys enemies, those who broke compacts and agreements,
    and the wicked.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After a broken section, the text says the deity split Tiamat without resting
    and is to be named Nibiru, who defeated Kirbish-Tiamat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The deity is asked to direct the course of the stars of heaven and to pasture
    all the gods like sheep.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The deity is said to have created heaven and fashioned earth, after which
    Father Bel calls him Lord of the Universe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ea rejoices that lofty names have been given to his son and says that the
    name Ea shall be his name too, with authority to deliver Ea's binding commands
    and transmit his commandments.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Fifty names are given to the deity according to the great gods, and this enhances
    his power.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage instructs the leader or king to hear and proclaim the account,
    the wise and prudent to take it to heart, and fathers to relate it to sons.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage promises that if the shepherd and leader attends to Marduk, his
    land may prosper, he may remain sound, his word and order be obeyed, and even
    a god will not change his command.
  category: sequence
  evidence_refs:
  - ev:5
