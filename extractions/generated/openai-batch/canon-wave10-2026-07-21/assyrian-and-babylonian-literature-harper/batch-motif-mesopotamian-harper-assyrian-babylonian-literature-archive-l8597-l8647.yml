canonical_text:
  quote: ''
  summary: The passage begins mid-sentence with the first-person Assyrian king investing
    an unnamed ruler with garments, gold regalia, a named dagger, conveyances, and
    restoring him to Sais while appointing his son over Athribis. It then reports
    Tirhaka's death, Urdamani's accession and military action against Assyrian troops
    at Memphis, the king's second campaign to Egypt and Ethiopia, Urdamani's flight
    from Memphis to Thebes and then Kipkip, the submission of established Egyptian
    officials, the capture of Thebes under Ashur and Ishtar's protection, and the
    seizure of palace goods. A note gives a parallel account of Urdamani's flight
    and the overthrow of Thebes.
  language: English
  quote_policy: summarized
