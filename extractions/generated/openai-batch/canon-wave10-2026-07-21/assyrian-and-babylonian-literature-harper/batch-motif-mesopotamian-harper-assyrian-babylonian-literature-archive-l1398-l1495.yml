  quote: ''
  summary: 'The passage surveys nineteenth-century Assyriology and decipherment: Rawlinson''s
    early role, Hincks''s work on Assyro-Babylonian signs, the discovery and classification
    of phonetic and syllabic values, Hommel''s periodization of the field, Schrader''s
    historical contribution, and Delitzsch''s later philological method based primarily
    on Assyrian textual usage with cognate languages used cautiously.'
