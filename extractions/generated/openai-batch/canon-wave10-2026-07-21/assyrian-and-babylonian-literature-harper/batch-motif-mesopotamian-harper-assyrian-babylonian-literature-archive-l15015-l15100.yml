canonical_text:
  quote: ''
  summary: The passage contains parts of several Tel-el-Amarna diplomatic letters.
    An initial fragment disputes hostile messenger reports, accusations about a damsel,
    and confusion over chariots and horses. A letter from Kadashman-Bel of Karduniash
    to Nimmuria of Egypt discusses a marriageable daughter, envoy treatment, insufficient
    gold, and a feast. A following letter from Burraburiash of Karduniash to Niphuriria
    of Egypt invokes earlier friendship between their fathers, complains of a small
    gold gift, and requests more gold for temple repair.
  language: English
  quote_policy: summarized
