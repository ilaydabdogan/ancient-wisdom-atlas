  quote: ''
  summary: The passage presents Assyria as an early world empire that organized subject
    peoples, spread civilization through trade routes, and prepared the way for later
    empires. It then describes Nabopolassar and Nebuchadrezzar II, Egyptian-Babylonian
    conflict, the defeat of Egypt, the punishment of Judah and Tyre, and Nebuchadrezzar's
    restoration of Babylon through fortifications, canals, commerce, temple rebuilding,
    worship of Marduk and Nebo, and attempted religious-political unification.
  language: English
  quote_policy: summarized
