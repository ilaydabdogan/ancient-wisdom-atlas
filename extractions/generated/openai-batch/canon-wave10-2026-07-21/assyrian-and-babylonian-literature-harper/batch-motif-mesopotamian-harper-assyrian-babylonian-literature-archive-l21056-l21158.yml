canonical_text:
  quote: ''
  summary: Tablet VI opens with Gilgamesh cleaning his weapons, changing into clean
    royal attire, and putting on crown or diadem. Ishtar desires Gilgamesh and offers
    marriage, wealth, royal honor, tribute, abundance, and a splendid chariot. Gilgamesh
    answers by refusing her love, citing the grief and harm brought upon her previous
    beloveds, including Tammuz, a bird, a lion, a horse, a shepherd transformed into
    a tiger, and a farmer or gardener.
  language: English
  quote_policy: summarized
