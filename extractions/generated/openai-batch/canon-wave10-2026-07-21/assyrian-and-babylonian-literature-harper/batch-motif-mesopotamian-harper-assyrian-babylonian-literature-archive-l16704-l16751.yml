  quote: ''
  summary: The passage contains the end of a logistical letter about ferry service
    and transport of fodder; a letter in which Sara'a invokes deities and asks the
    palace secretary to intervene for seven slaves sold to Marduk-erba; and the beginning
    of a letter in which Bel-upaq greets his father Kuna, prays for his life, reveres
    Ezida, and reports consulting a temple god who fixed a propitious date.
