canonical_text:
  quote: ''
  summary: The excerpt presents royal inscription material for Ramman-Nirari III and
    the opening of a Nimrud inscription of Tiglath-pileser III. Ramman-Nirari is described
    as a king chosen by Ashur from childhood, given an unrivaled kingdom, supported
    on his throne, restoring cultic institutions, conquering wide territories, subduing
    Damascus and other rulers, receiving tribute, and placing future taxes. The Tiglath-pileser
    opening titles him king of the world and four quarters, a warrior protected and
    called by major gods, ruling over lands described by seas, mountains, Egypt, horizon,
    and zenith.
  language: English
