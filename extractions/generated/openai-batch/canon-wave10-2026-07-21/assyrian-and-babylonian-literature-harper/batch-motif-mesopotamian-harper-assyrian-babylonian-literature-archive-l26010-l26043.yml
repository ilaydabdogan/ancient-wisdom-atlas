canonical_text:
  quote: ''
  summary: A prayer addresses Ninib as the mighty first-born son of Bel, powerful
    offspring of Esharra, terrifying and storm-like. It describes his exalted place
    in Ekur, Bel's entrusting of divine commands to him, and his functions as judge
    of mankind, guide and helper of the weak, restorer from the Lower World, absolver
    of sin, restorer of divine favor, chief of the gods, and warrior.
