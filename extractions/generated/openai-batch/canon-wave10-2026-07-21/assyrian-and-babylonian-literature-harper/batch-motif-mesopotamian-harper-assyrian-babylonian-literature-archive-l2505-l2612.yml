  quote: ''
  summary: The passage describes Babylonian magical literature as a corpus of incantations,
    exorcisms, and rituals used to control spirits, cure spirit-caused disease, and
    counter witchcraft through formulas and symbolic acts such as burning images and
    loosening knots. It also summarizes the preservation, organization, temple transmission,
    dating, and editing of these ritual texts, including named series such as Head-sickness,
    Evil-Demon, Shurpu, and Maqlu.
