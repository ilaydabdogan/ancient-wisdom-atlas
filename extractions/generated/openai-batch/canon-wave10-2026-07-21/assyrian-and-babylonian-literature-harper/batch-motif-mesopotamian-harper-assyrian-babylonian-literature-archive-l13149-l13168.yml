  quote: ''
  summary: The inscription praises Ahura-mazda as creator of heaven, earth, mankind,
    and Xerxes; Xerxes identifies himself with royal titles and lineage; he says Darius
    built many structures and ordered a mountain built but left it unwritten, after
    which Xerxes ordered writing there and prays for divine protection over himself,
    his sovereignty, and his deeds.
