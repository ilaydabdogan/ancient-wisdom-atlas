canonical_text:
  quote: ''
  summary: A sequence of Maqlu incantations asks herbs, earth, night powers, gods,
    and named divine figures to cleanse the speaker, undo harmful sorcery, return
    or dissolve a sorceress's words, block enchantment, gag hostile practitioners,
    and address images of many male and female adversaries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks the mashtakal herb to make him clean and compares his desired
    purity to the lardu herb.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage calls the sorceress's incantation evil and says her words shall
    return to her mouth and her tongue shall be cut out.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gods of the night are asked to smite the sorceress, and the three night-watches
    are asked to loose her evil witchcraft.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sorceress's mouth and tongue are associated with wax and honey; the harmful
    word and sorcery are to melt or dissolve, and her knots are cut in two.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Earth is addressed repeatedly, and Gilgamesh is named as lord of earth's ban.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker says he knows what the addressees do, while they do not know what
    he does, and says the evil done by his sorceresses is broken, loosed, and no longer
    exists.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker names Qappan as his city and describes two city doors, one toward
    the rising sun and one toward the setting sun.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker carries a box, a jar, and mashtakal herb, brings water to the
    gods of the heavens, and asks them to cleanse him as he performs cleansing for
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker says he has cut off the ford, blocked up the wall, and prevented
    the enchantment of the whole world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The god and the goddess are said to have commissioned the speaker, and Belit
    of the field is named in the commission and command.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A gag and the incantation of Marduk are to be thrust into the mouths of the
    speaker's sorcerer and sorceress; the addressed figure is told not to answer them
    but to answer the speaker.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Images of the speaker's enchanter, witch, sorcerer, sorceress, deceivers,
    and masters and mistresses of various harms are listed, and the speaker says he
    does not know how many there are.
  category: object
  evidence_refs:
  - ev:7
