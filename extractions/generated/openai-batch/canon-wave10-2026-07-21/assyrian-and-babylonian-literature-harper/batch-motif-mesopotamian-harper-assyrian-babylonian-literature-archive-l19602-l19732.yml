canonical_text:
  quote: ''
  summary: Fragmentary passage from the Legend of Dibbara in which Durilu lies ruined,
    Dibbara is addressed as having killed just and wicked alike, threats are made
    against a tree, wall, and the dwelling of the king of the gods, Dibbara commands
    Ishum to act, Ishum and seven powerful beings go to Mount Sharshar, the mountain
    is made like lowland, and Dibbara later says he destroyed mankind after devising
    evil on account of former sins.
  language: English
  quote_policy: summarized
