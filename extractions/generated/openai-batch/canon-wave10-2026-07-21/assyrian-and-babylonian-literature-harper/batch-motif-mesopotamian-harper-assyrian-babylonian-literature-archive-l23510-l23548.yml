  quote: ''
  summary: A colophon identifies the second tablet of the Maqlu Series as a revised
    copy associated with Ashurbanipal's palace. It describes Ashurbanipal as divinely
    favored with understanding and tablet-writing skill, says he inscribed and placed
    Nabu's wisdom on tablets for reading, and invokes Ashur and Belit to punish anyone
    who removes the tablet or substitutes his own name.
