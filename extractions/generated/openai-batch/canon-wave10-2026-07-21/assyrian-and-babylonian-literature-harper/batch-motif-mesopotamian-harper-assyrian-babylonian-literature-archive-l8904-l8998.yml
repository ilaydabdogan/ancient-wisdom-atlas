canonical_text:
  quote: ''
  summary: The first-person Assyrian ruler recounts campaigns against Elam and its
    allies. He invokes named gods, defeats rebels and hostile kings, describes covenant-breaking
    and divine anger, reports the flight of Elamite royal refugees to his feet, kills
    Teumman, dyes the Eulaus with blood, installs replacement kings, and conquers
    Gambulu with slaughter, bonds, and deportation of booty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator directs a campaign to Elam by the command of named gods and reports
    seizing alive people who had cast off his lordship, taking their spoil to Nineveh.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Andaria advances by night to capture Ubbume and Kullimeri; the inhabitants
    of Kullimeri slaughter his force, prevent escape, cut off his head, and bring
    it to Nineveh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator goes against Urtaku, king of Elam, stating that Urtaku did not
    remember former aid or keep friendship after receiving famine relief and support.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A messenger reports that the Elamite covers Akkad like a swarm of grasshoppers
    and lays siege against Babylon; the narrator musters troops for the help of Bel
    and Nabu.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator pursues Urtaku, brings about his defeat, drives him to the border
    of Elam, and reports Urtaku's death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bel-iqisha dies through the bite of a wild boar; Nabu-shum-eresh is described
    as bearing dropsy and full waters; Marduk lays great sins upon Marduk-shum-ibni;
    the anger of Ashur and passion of Ishtar remain unrested toward them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Teumman takes Urtaku's throne like a demon and devises evil in order to kill
    the sons of Urtaku and the sons of Ummanaldash.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ummanigash, Ummanappa, Tammaritu, Kudurru, Paru, sixty royal descendants,
    and Elamite nobles flee from Teumman's murder and seize the narrator's royal feet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator covers Elam like the onset of a mighty storm, cuts off Teumman's
    head, slays many warriors, fills the plain around Susa with bodies, and makes
    blood flow down the Eulaus, dyeing its water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrator brings Ummanigash to Elam and sets him on Teumman's throne, and
    establishes Tammaritu as king in Hidalu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After making the weapons of Ashur and Ishtar rage over Elam, the narrator
    turns against Dunanu of Gambulu, conquers Shapibel, slaughters inhabitants, binds
    Dunanu and Samgunu with iron restraints, and leads away members of Beliqisha's
    family as booty.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'A note describes an inscription over figures: one man wounded by an arrow,
    another standing with a stretched bow, Teumman telling his son to shoot, and another
    inscription over two beheaded figures.'
  category: other
  evidence_refs:
  - ev:9
