canonical_text:
  quote: ''
  summary: The passage describes a battle in which Ritti-Marduk advances his chariot
    for Nebuchadrezzar, divine powers of battle are invoked, Elam is defeated, and
    Nebuchadrezzar grants freedom and protections to the cities of the house of Karziyabku.
    Witnesses and the tablet scribe are named. The passage then threatens anyone who
    alters or destroys the tablet with curses from the great gods, including disgrace,
    destruction of boundaries and seed, blocked rivers, hunger, want, distress, and
    frailty.
  language: English
