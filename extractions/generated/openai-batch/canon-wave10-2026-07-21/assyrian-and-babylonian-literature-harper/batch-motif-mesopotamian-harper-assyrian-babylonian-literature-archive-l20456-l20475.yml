canonical_text:
  quote: Not does Gilgamesh leave the son to his father, nor the maiden to the warrior,
    nor the wife to her husband.
  summary: Tablet II introduces Gilgamesh as ruler of Erech. His rule becomes unpopular
    because he compels the city's young men into service and takes maidens to his
    court. Parents lament and appeal to the gods of heaven and Bel of Erech, saying
    Gilgamesh leaves neither sons, maidens, nor wives with their proper households
    and has no rival in the land.
