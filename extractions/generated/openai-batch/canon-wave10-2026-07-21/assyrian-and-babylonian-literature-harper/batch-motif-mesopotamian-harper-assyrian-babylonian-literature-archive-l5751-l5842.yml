canonical_text:
  quote: ''
  summary: A first-person royal inscription of Shalmaneser II recounts campaigns through
    mountains, cities, rivers, and the sea of Nairi; the narrator defeats enemies,
    imposes tribute, burns cities, erects head-pyramids, performs sacrifices, sets
    up an inscribed life-size image, and attributes success to Ashur, the great gods,
    Nergal, Shamash, and a comparison with Ramman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is headed as an inscription of Shalmaneser II.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person narrator fights a battle in the mountains, overthrows opponents,
    and brings back chariots, forces, and horses trained to the yoke.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator says the fear of Ashur's splendour overwhelms the opponents,
    who seize his feet, after which taxes and tribute are imposed on them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Sugunia, the stronghold of Aramu of Urartu, the narrator besieges and captures
    the city, kills warriors, carries off spoil, erects a pyramid of heads, and burns
    fourteen neighboring cities.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the sea of Nairi, the narrator washes his weapons in the sea, offers sacrifices
    to his gods, makes a life-size image of himself, writes Ashur's glory and his
    own might on it, and sets it above the sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: On returning from the sea, the narrator receives tribute from Asu of Guzana,
    including horses, oxen, sheep, wine, and two double-humped dromedaries, and brings
    it to Ashur.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator leaves Nineveh, crosses the Tigris, passes over mountains, advances
    to Lalate, and destroys, devastates, and burns the city after its people go up
    to the mountains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ahuni son of Adini advances to battle; the narrator says he fights under the
    protection of Ashur and the great gods, defeats Ahuni, and shuts him up in his
    city.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Burmarana, the narrator besieges and captures the city, kills three hundred
    fighting men, erects a pyramid of heads, and receives tribute from named local
    figures.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrator crosses the Euphrates in ships of lamb-skins and receives tribute
    from Katazilu of Qummuhu.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the land of Paqarruhbuni, the narrator destroys cities, says he fills the
    broad plain with the overthrow of warriors, and kills one thousand three hundred
    fighting men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mutalli of Gamgumu gives tribute that includes silver, gold, oxen, sheep,
    wine, and his daughter with her large dowry.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Hanu of Samala, Sapalulme the Patinian, Ahuni son of Adini, and Sangara of
    Carchemish trust in one another's help, join forces, and attack the narrator.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: The narrator says he fights the coalition with the forces of Nergal, who goes
    before him, and with weapons presented by Ashur.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The narrator says he rains destruction like Ramman, casts enemies into ditches,
    fills the broad plain with corpses, dyes the mountain with blood, erects a pyramid
    of heads, and burns cities with fire.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The narrator states that he was obedient to the greatness of the great gods
    and celebrates the bravery of Ashur and Shamash; the passage breaks off after
    this statement begins.
  category: speech
  evidence_refs:
  - ev:12
