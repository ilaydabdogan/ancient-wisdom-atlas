  - royal_legitimacy
  basis: The narrator's victories are repeatedly framed through Ashur's splendour,
    protection by Ashur and the great gods, weapons presented by Ashur, and obedience
    to divine greatness.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:11
  - ev:12
  confidence: high
