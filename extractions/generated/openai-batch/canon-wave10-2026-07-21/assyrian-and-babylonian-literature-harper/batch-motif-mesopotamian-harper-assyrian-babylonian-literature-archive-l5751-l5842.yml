- id: motif:2
  label: Ritual offering and victory monument at boundary water
  taxonomy_refs:
  - sacrifice
  basis: At the sea of Nairi, the narrator washes his weapons, offers sacrifices to
    his gods, creates a life-size image, inscribes it with divine glory and royal
    might, and sets it above the sea.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The text reports the ritual acts but does not explain their intended meaning
    beyond the inscriptional context.
- id: motif:3
  label: Submission and tribute after conquest
  taxonomy_refs: []
  basis: Taxes and tribute follow submission, and multiple rulers or regions provide
    goods, animals, wine, and in one case a daughter with dowry after campaign movements
    or victories.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The tribute is political and military in the passage; no sacred-exchange
    taxonomy is assigned because the text does not frame the tribute itself as sacred.
- id: motif:4
  label: Trophy display of defeated enemies
  taxonomy_refs: []
  basis: The narrator repeatedly erects pyramids of heads and describes enemy corpses
    and blood as filling or marking the landscape after battle.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:11
  confidence: high
  cautions: This is a literal royal victory trope in the passage; broader comparative
    interpretation requires review.
- id: motif:5
  label: City destruction by fire
  taxonomy_refs: []
  basis: The narrator repeatedly reports destroying, devastating, and burning cities
    with fire after conquest.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:11
  confidence: high
  cautions: The scope is local city destruction, not a world-destroying fire motif.
- id: motif:6
  label: Storm-god simile for royal destruction
  taxonomy_refs: []
  basis: The narrator explicitly says he rained destruction on enemies like the god
    Ramman during the coalition battle.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage gives a simile, not an identification of the king with Ramman.
