canonical_text:
  quote: ''
  summary: 'The passage gives astrological and lunar omen reports: halos around the
    Moon, the Moon and Sun seen together on specific days, planets or stars standing
    within a lunar halo, and associated predictions for the king, Akkad, markets,
    enemies, weather, truth, robbery, and prayer. It also includes a petitionary administrative
    message to the king concerning people, a son, officials, and tablets.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A greater halo around the Moon is linked in the report to enlargement of a
    land and destructions around men; specific bodies inside the halo, including Cancer
    and Regulus, are linked to royal life and male births, and a thin halo is linked
    to years given to the king.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The report states that a great halo had surrounded the Moon for many nights
    and remained uninterrupted; the notice is attributed to Shapiku of Borsippa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the Moon appears out of its expected time or is seen with the Sun on
    the twelfth day, the report links the phenomenon to a low market, a strong enemy
    overcoming the land, and the King of Akkad defeating his foe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the fourteenth day, the report links Moon-Sun visibility and the Moon
    fading with dim horns to truth in the land, truth between son and father, increased
    royal wisdom, security of the throne, silence, satisfaction, divine happiness
    for Akkad, secure cattle, rain, and flood.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A petitionary message says the king ordered certain people to be brought,
    and the sender asks that royal authority be sent to Ahisha, that a messenger bring
    the people, that the governor of Babylon cause release, and that Nabu-etir-napshati
    come to visit the king with the sender.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sender states that he prays to Shamash for the life of the king.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports that on the fourteenth the Moon and Sun were seen together,
    and that on the previous night a halo surrounded the Moon with Saturn standing
    within it near the Moon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage gives instructions about bringing in a tablet of the Day of Bel,
    giving an Akkadian tablet of the king, enclosing three “stars” on the front, and
    ensuring that whoever opens the document closes it in an officer’s presence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: For the fifteenth day, the report says the Moon was seen with the Sun; it
    also reports a halo around the Moon with Virgo and Spica inside it, links Spica
    in the halo to brigands and robbery, links a “river” around the Moon to rains
    and showers, and says A-edin stood within the Moon’s halo.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that when Jupiter goes with Venus, the prayer of the land
    will reach the heart of the gods.
  category: speech
  evidence_refs:
  - ev:8
