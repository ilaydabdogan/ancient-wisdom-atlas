canonical_text:
  quote: ''
  summary: 'The passage presents a first-person royal campaign account: the king departs
    through multiple lands, destroys cities, receives tribute, performs ritual acts
    at the sea of Nairi, erects inscribed royal images, besieges strongholds, defeats
    Ahuni at the mountain Shitamrat, deports people and goods to Asshur, and defeats
    maritime opponents at Mazamua.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says some people were walled in among pyramids and others impaled
    around them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After going from Arzashku to the mountains of Eritia, the speaker made a large
    image of his royalty and inscribed it with the excellence of Ashur and his own
    power in Urartu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker advanced to Aramale and says he destroyed, devastated, and burned
    its cities with fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Zanziuna, an opponent avoided battle, seized the speaker's feet, and gave
    horses, oxen, and sheep; the speaker granted him favor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the sea of Nairi, the speaker washed the powerful weapons of Ashur in the
    sea, offered sacrifices, and made another inscribed image of his royalty.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Asau, king of Gilzani, came forth with his brothers and sons, and the speaker
    received horses, livestock, wine, and seven two-humped dromedaries from him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker made a large image of his royalty in Gilzani and set it up within
    Asau's city temple after inscribing it with Ashur's excellence and his own power
    in Nairi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Shilaya, the stronghold of Kaki, the speaker besieged and captured the
    city, killed many fighting men, and carried prisoners, livestock, and horses to
    Asshur.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ahuni, son of Adini, deserted Til-bursip after the speaker surrounded it,
    cut down its parks, and attacked it; Ahuni crossed the Euphrates to save his life.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ahuni made the peak of Mount Shitamrat, described as hanging from the skies
    like a cloud, into his stronghold.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The speaker says he advanced to Shitamrat by the command of Ashur and Nergal,
    where no earlier kings, his fathers, had approached.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At Shitamrat, the speaker climbed the mountain on foot, defeated Ahuni's forces,
    cut off heads, dyed the mountain with blood, and received submission from people
    who came down and seized his feet.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The speaker brought Ahuni, his forces, chariots, horses, and palace property
    across the Tigris to Asshur and reckoned them with the people of his land.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: In Mazamua, the people of Nikdime and Nikdera fled to sea in wickerwork ships;
    the speaker followed in lamb-skin rafts, forced a sea battle, defeated them, and
    dyed the sea with their blood.
  category: sequence
  evidence_refs:
  - ev:12
