  summary: The passage surveys Mesopotamian and related royal-historical inscriptions
    and chronological sources, including the Cylinder of Cyrus, Achaemenian inscriptions,
    Assyrian and Babylonian inscription formulas, Babylonian king lists, the Assyrian
    Eponym Canon, Synchronous Tablets, and the Babylonian Chronicle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Cylinder of Cyrus is said to relate the capture of Babylon, restoration
    of the shrines and city, and the captor's pacific policy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The trilingual inscriptions of the Achaemenian kings are described as historical
    data that recount Persian royal deeds, building enterprises, genealogical references,
    and lists.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The great Inscription of Darius is said to depict uprisings during the early
    part of Darius's reign.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Most Assyrian historical inscriptions are described as beginning with an invocation
    to the gods followed by a long list of the king's titles and attributes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Assyrian inscriptions close with a request that the gods bless those who look
    after the inscriptions and curse those who do not.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Babylonian inscriptions introduce the king, recite his buildings and pious
    works, and close with prayer for offspring, power, and a long reign.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Babylonian king lists are fragmentary but preserve names of kings in dynastic
    order with a few general remarks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A tablet from Babylon is described as once containing three hundred to three
    hundred and fifty royal names, though only about thirty were legible; Hammurabi
    appears among them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Assyrian documents were commonly dated by names of limmu or eponyms rather
    than by regnal years.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each eponym held office for one year, gave a name to that year, and served
    according to a general rotation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some Eponym Canon documents contain chronological lists of eponyms; others
    add titles and short notices of principal events during the terms of office.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Synchronous Tablets give a short account of relations between Babylonia
    and Assyria and are described as written from an Assyrian perspective.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Babylonian Chronicle provides similar historical information for approximately
    775 to 669 BCE.
  category: object
  evidence_refs:
  - ev:9
