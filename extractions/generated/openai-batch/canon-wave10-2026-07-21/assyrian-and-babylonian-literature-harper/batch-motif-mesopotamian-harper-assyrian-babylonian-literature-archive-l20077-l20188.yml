canonical_text:
  quote: ''
  summary: In this fragment from the story of Etana, an eagle ignores a warning and
    eats the serpent's young. The serpent appeals to Shamash, who instructs it to
    hide inside a dead wild ox on a mountain and seize the eagle when it comes to
    feed. The eagle again ignores a wise young bird's warning, enters the carcass,
    is seized by the serpent, and pleads for mercy with an offer of a gift.
  language: English
  quote_policy: summarized
