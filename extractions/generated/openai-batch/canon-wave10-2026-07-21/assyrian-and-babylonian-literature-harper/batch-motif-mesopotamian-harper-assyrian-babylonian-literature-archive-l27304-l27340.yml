canonical_text:
  quote: ''
  summary: A short set of Babylonian legal clauses addresses field or pasture compensation,
    the contested sale of a slave-girl, dowry promises after loss of property, dowry
    reversion after a daughter's childless death, and a childless widow's rights to
    dowry or an estate share.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A field owner is to receive a daily amount of sixty KA when a flock is treated
    as pasture on the field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a slave-girl sold for money is taken away by another party with just
    claims, the seller must return the sale money to the buyer in the exact amount
    stated by the receipt.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the slave-girl has borne children in the meantime, the seller must also
    pay one half shekel for each child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who promised a dowry to his daughter may give a dowry according to his
    reduced property if he later loses part of his property.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the reduced-property dowry case, neither the father-in-law nor the son-in-law
    may bring a lawsuit on that account.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a daughter who has received a dowry dies without issue, the dowry returns
    to her father's house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A childless woman whose husband held her dowry receives the dowry back in
    full from the late husband's estate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the husband gave the woman part of his property during his lifetime, she
    keeps that gift and still receives her dowry in full.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the childless woman had no dowry, the probate judge examines the late husband's
    estate and gives her a proper share according to the estate.
  category: sequence
  evidence_refs:
  - ev:5
