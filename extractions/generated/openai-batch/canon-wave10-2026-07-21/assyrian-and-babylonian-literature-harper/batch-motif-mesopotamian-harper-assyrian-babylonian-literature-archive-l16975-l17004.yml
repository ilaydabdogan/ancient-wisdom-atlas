canonical_text:
  quote: ''
  summary: A legal rental contract records a long-term field lease between Baga'miri
    and Bel-shum-iddin, specifying rent in dates, possession for planting, compensation
    if the field is reclaimed early, settlement of claims, witnesses and authentication
    marks on the tablet, the presence of Baga'miri's mother, and the date at Nippur.
    An editorial note identifies the contract as unusual because of its long lease,
    advance rent, and guarantees.
  language: English
  quote_policy: summarized
