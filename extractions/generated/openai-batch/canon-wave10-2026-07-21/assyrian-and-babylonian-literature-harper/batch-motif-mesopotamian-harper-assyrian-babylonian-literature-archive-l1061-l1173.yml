canonical_text:
  quote: ''
  summary: The passage gives Ottoman regulations on reporting, transporting, re-exporting,
    exporting, confiscating, and penalizing the handling of antiquities; then comments
    on obstacles to excavation, Arab excavators and antiquities dealers, purchases
    of tablet collections, and the beginning of European accounts of cuneiform inscriptions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Owners or shippers seeking re-exportation or internal transportation of antiquities
    must draw up and transmit a list through designated educational or local authorities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Re-exportation or internal transportation of antiquities requires official
    authorization from the Ministry of Public Instruction with agreement of the museum
    director.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Antiquities exported without a special permit, if captured, are to be seized
    or confiscated in the name of the museum.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Official permission to export antiquities is conditioned on the museum already
    possessing a duplicate and on the objects being established as imports from a
    foreign country.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: People who appropriate found or exhumed antiquities, fail to report accidental
    discoveries, or violate transportation rules are subject to fines, damages, loss
    of share, imprisonment, or payment of value.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lawsuits arising from the regulations are assigned to ordinary courts, and
    the Ministry of Public Instruction is charged with enforcement.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator characterizes the conditions as not generous and says diplomatic
    jealousy, Turkish greed, and difficult political control discourage further excavation
    work.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ur, Senkereh, Warka, and Niffer are named among important ruins in dangerous
    districts, with some sites described as lying in Bedawin territory outside Turkish
    Government control.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Native Arabs are described as having excavated for many years, and Arabs in
    London are said to represent dealers in Baghdad and Hilleh.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Joseph Shemtob is identified as a well-known dealer, and the University of
    Pennsylvania is said to have purchased large collections from Shemtob and from
    his chief in Baghdad.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Dealers are described as possessing many tablets, knowing nothing about them,
    asking high prices, and eventually accepting much less after bargaining.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The decipherment section opens by saying that seventeenth-century travellers
    brought accounts of Persepolis inscriptions to Europe, naming Pietro della Valle
    and Chardin.
  category: sequence
  evidence_refs:
  - ev:6
