candidate_motifs:
- id: motif:1
  label: Descent to the nether-world through gates
  taxonomy_refs:
  - hero_descent
  - afterlife_journey_map
  basis: Ishtar travels to the land of No-Return, passes through gates, and reaches
    the queen of the nether-world.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage calls the story a descent into Hades, but it summarizes rather
    than quotes the full myth.
- id: motif:2
  label: Return from the nether-world by life-giving water
  taxonomy_refs:
  - resurrection
  - return
  basis: Uddushu-namir demands the waters of life; Ishtar is sprinkled, led forth,
    and described in the interpretive frame as one who returned from the nether-world.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage does not explicitly say Ishtar died; the resurrection label
    is therefore functional rather than literal.
- id: motif:3
  label: Fertility cessation during goddess's absence
  taxonomy_refs:
  - seasonal_cycle
  basis: The absence of Ishtar causes sexual intercourse to cease upon the earth,
    and her story is linked with lamentation for Tammuz.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly interpret the event as a seasonal cycle,
    though it connects Ishtar's absence with sexual cessation and Tammuz lamentation.
- id: motif:4
  label: Ritual lamentation for departed figures
  taxonomy_refs: []
  basis: The brother is commanded to gain the favor of Ishtar and Tammuz through formal
    lamentation, and the departed sister asks not to be forgotten in that lamentation.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents this as an interpretive reconstruction and notes
    some obscurity around Belili.
- id: motif:5
  label: Amuletic myth text against plague
  taxonomy_refs: []
  basis: The passage says tablets containing accounts were hung at house entrances
    and served as amulets to keep off plague.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The wording says this may be safely assumed from similar circumstances,
    so the claim is not presented as direct evidence from a tablet in the passage.
- id: motif:6
  label: Divine explanation of plague and storm phenomena
  taxonomy_refs:
  - chaos
  basis: The Dibbara plague-god legend is connected with plagues and disease, and
    the Zu legend is connected with storms and clouds.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy reference is broad; the passage speaks of natural phenomena
    rather than a full chaos-combat pattern.
- id: motif:7
  label: Oracular legitimation and encouragement of threatened kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: The oracles are in favor of Esarhaddon, acknowledge his kingship, and encourage
    him while his throne is threatened by rival brothers.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage introduces the oracles rather than giving the oracle texts
    themselves.
comparison_claims:
- id: claim:1
  claim: The passage cautiously groups the Dibbara and Zu legends as Babylonian legends
    prompted by striking natural phenomena, with plague and storm as different examples
    of that explanatory pattern.
  claim_level: same_function
  target: Dibbara plague-god legend and Zu storm/cloud legend within Babylonian legendary
    material
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents this as introductory interpretation; it does not
    provide the full legends or detailed parallel structure.
- id: claim:2
  claim: The passage explicitly distinguishes the Ishtar descent legend from the Gilgamesh
    epic rather than treating it as part of that nearby corpus.
  claim_level: same_motif
  target: Gilgamesh epic
  evidence_refs:
  - ev:6
  counter_evidence_refs:
  - ev:6
  confidence: high
  limitations: This is a negative corpus-placement claim, not evidence of shared motif
    structure; the schema has no separate negative-comparison level.
