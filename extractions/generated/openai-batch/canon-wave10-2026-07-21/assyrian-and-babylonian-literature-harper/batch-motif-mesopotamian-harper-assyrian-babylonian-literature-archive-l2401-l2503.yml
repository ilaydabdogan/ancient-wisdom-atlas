canonical_text:
  quote: ''
  summary: The passage summarizes Ishtar's descent to the land of No-Return, her subjection
    before Allatu, the resulting cessation of sexual intercourse on earth, and her
    release after Ea creates Uddushu-namir to obtain the waters of life. It then gives
    an interpretive frame involving a brother seeking news of a dead sister, formal
    lamentation for Ishtar and Tammuz, and remembrance of the departed sister. The
    passage also comments on Babylonian legends as religiously meaningful, sometimes
    connected with plague, storm, or other natural phenomena, and introduces oracles
    in favor of Esarhaddon during a succession crisis.
  language: English
  quote_policy: summarized
