canonical_text:
  quote: ''
  summary: A penitential prayer asks a deity to remove illness, jaundice, bands, fetters,
    and divine scorn from a downcast servant; to accept offerings and redemption-money;
    and to grant life and favor. A following first-person prayer asks an angry god
    and goddess to accept supplication, forgive sin, loosen chains, carry away wickedness
    and misery through winds, birds, fish, beasts, and river waters, grant purification,
    favorable dreams, access to Esagila, and the favor of merciful Marduk.
  language: English
  quote_policy: summarized
