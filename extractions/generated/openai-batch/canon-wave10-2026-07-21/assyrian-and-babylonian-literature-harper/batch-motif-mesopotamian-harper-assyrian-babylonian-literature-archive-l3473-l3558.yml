canonical_text:
  quote: ''
  summary: 'The passage gives a historical narrative of Assyrian and Babylonian events:
    Sargon’s murder and Sennacherib’s succession; Sennacherib’s campaigns against
    Babylon, the west, Judah, and Babylon again; the destruction of Babylon; Sennacherib’s
    murder by two sons; Esarhaddon’s vengeance, succession, rebuilding of Babylon,
    western campaigns, Egyptian campaigns, and campaigns against mountain tribes.'
  language: English
  quote_policy: summarized
