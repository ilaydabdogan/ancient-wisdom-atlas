  text: Ummanigash, King of Elam, fought Sargon, King of Assyria, at Durilu, invaded
    Assyria, and routed the Assyrian side; Merodachbaladan arrived too late for the
    battle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Ummanigash died, Kudur, described as the son of his sister, took the
    throne in Elam.
  category: sequence
  evidence_refs:
