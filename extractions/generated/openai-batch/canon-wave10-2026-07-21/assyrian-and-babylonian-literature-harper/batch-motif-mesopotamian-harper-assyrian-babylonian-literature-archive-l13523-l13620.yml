- id: obs:3
  text: Sargon marched to Akkad, fought against Merodachbaladan, and Merodachbaladan
    fled to Elam; Sargon then took the throne in Babylon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sargon took the hand of Bel, captured Duriaku, and later the gods of the Sea
    Land were restored and feasts were instituted in a broken passage.
  category: action
