canonical_text:
  quote: ''
  summary: A chronicle sequence records conflicts among Assyria, Babylonia, and Elam
    during the reigns of Merodachbaladan, Sargon, Sennacherib, Belibni, Ashurnadinshum,
    Nergalushezib, and others. It lists battles, city destructions, plundering, royal
    captivity, revolts, deaths, the restoration or removal of gods, and repeated transfers
    of the thrones of Babylon and Elam.
  language: English
  quote_policy: summarized
