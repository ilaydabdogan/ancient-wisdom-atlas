canonical_text:
  quote: ''
  summary: Nebuchadrezzar II describes extending and strengthening walls, embankments,
    dikes, moats, and temple precincts at Babylon, Borsippa, Kutha, Sippar, and other
    cities. He presents the works as protective measures for cities and shrines, as
    restorations surpassing earlier kings, as undertakings charged to him by Marduk,
    and as deeds recorded on a tablet for future consideration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he joined new works to a wall constructed by his father,
    laid foundations in the earth, and raised battlements described as mountain-high.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says his father had begun an embankment of the Arahtu and that
    he, the father's eldest son and beloved of his heart, completed and strengthened
    it with bitumen and burned brick.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he made a mighty dike in the river to protect Esagila and
    Babylon from a breach in the Euphrates bank.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says he dug a moat, reached the bottom of the water, and built
    a mighty eastern wall around Babylon with bitumen and burned brick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says he remade the wall of Borsippa and built or renewed temples
    for Tur-e and Gula in Borsippa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Gula is described in several epithets as rich in life, preserving the speaker's
    life, extending the fame of his kingdom, and giving life to his soul.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker says he renewed protective walls at E-shid-lam and Kutha and rebuilt
    a list of shrines of great gods in several cities.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker says he gave the great gods residence within their restored shrines
    with joy and rejoicing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The speaker says he inscribed his extensive undertakings on a tablet and put
    it away for all time to come.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The speaker says Marduk charged him with building cities for gods and goddesses
    and incited his heart to the work.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: E-ul-la, the temple of Nin-karrak in Sippar, is described as long neglected,
    decayed, unrecognizable under earth, deprived of revenues, and lacking offerings.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The speaker says that because he seized the garment of Marduk, Marduk loved
