canonical_text:
  quote: ''
  summary: 'Darius narrates successive rebellions and their suppression: Fravartish
    and Citrantakhma are captured and publicly punished; Parthia, Hyrcania, and Margiana
    rebel and are defeated by royal commanders with Ahura-mazda''s aid; Vahyazdata
    claims to be Bardiya, son of Cyrus, and gains Persian allegiance before Darius
    sends an army against him.'
  language: English
  quote_policy: summarized
