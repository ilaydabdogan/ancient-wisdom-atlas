  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker tore down the old palace, took ground from the swamp and city
    vicinity, reclaimed ground from the river bed, and built a terrace raised to two
    hundred tibki.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Construction occurred in a favourable month and on an auspicious day with
    the cooperation of clever architects.
  category: setting
  evidence_refs:
