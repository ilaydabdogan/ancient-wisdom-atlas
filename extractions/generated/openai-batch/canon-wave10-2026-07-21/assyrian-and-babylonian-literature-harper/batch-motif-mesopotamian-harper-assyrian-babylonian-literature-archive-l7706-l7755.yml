canonical_text:
  quote: ''
  summary: The royal speaker describes replacing a ruined predecessor side-palace
    at Nineveh with an enlarged palace on reclaimed ground, adorning it with stone,
    cedar, copper-bound doors, and lamasse and shede. He installs a name-record tablet,
    instructs future kings to repair and ritually tend it, promises that Ashur and
    Ishtar will hear their prayer, and curses anyone who alters his writing or name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person royal speaker says he completed a palace in Nineveh as a
    royal dwelling and adorned it to impress all people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An earlier side-palace built by predecessor kings was used for camp baggage,
    horses, and storage, but is described as foundationless, too small, unartistic,
