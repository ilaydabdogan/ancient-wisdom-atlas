  summary: The passage describes the physical media and processes used for Babylonian
    and Assyrian writing, especially prepared clay tablets and stylus writing. It
    then classifies historical and royal inscriptions, contrasting Assyrian campaign
    records with Babylonian building and pious inscriptions, and gives an example
    of Assyrian laudatory royal titulary in which Sargon is linked to divine favor,
    universal kingship, and a kingdom granted by Ashur and Marduk.
