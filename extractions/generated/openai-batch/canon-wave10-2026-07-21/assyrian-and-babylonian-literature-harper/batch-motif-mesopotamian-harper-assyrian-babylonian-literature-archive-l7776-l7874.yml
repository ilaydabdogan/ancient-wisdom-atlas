- id: motif:2
  label: Gods fight beside the king
  taxonomy_refs:
  - royal_legitimacy
  basis: The oracle promises that the gods will march at Esarhaddon's side, and Ishtar
    is described as standing beside him and breaking the enemies' bows and battle
    line.
  evidence_refs:
  - ev:2
