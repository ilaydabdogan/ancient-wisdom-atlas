canonical_text:
  quote: ''
  summary: Esarhaddon petitions major deities for sovereignty and priestly office,
    receives an encouraging oracle, advances rapidly despite cold, and defeats opponents
    at Hanigalbat with divine aid. The following inscriptional section identifies
    him by royal lineage and divine protection, recounts his conquests of Sidon and
    other enemies, executions of rival kings, deportations, city rebuilding, public
    display of severed heads, chained captives, and destruction or subjugation of
    additional territories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker raises his hands to Ashur, Sin, Shamash, Bel, Nabu, Nergal, Ishtar
    of Nineveh, and Ishtar of Arbela while seeking sovereignty over his father's house
    and priestly office.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deities respond with an oracle telling him not to delay and promising
    to march at his side and subjugate his enemies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker begins the expedition without waiting, inspecting troops, weapons,
    horses, or provisions, and does not fear the severe cold of Shebat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Hanigalbat, opposing warriors meet the front of the expedition and force
    a battle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fear of the great gods overwhelms the enemies, and they are described
    as becoming insane when they see the approaching battle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ishtar stands at the speaker's side, breaks the enemies' bows, disrupts their
    line of battle, and they proclaim him king.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The inscription identifies Esarhaddon as king of Assyria, king of Sumer and
    Akkad, son of Sennacherib and descendant of Sargon, acting under the protection
    of major gods.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Esarhaddon conquers Sidon, tears down its wall and dwellings, throws them
    into the sea, destroys the site, captures Abdimilkuti from the sea, and cuts off
    his head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Esarhaddon carries away palace treasure, people, and animals from Sidon, assembles
    regional kings, rebuilds a city in another place, names it Kar-Ashurahiddin, settles
    deported people there, and appoints a governor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sanduarri and Abdimilkuti swear to each other by the names of the great gods
    and trust in their own forces.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Esarhaddon trusts in Ashur, draws Sanduarri from the mountains like a bird,
    cuts off his head, and hangs the heads of Sanduarri and Abdimilkuti on the necks
    of their great men to show Ashur's power.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Esarhaddon marches into the streets of Nineveh with male singers and music.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Captives near the eastern gate of Nineveh are made to sit in chains with wild
    beasts, wild boars, and dogs.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:14
  text: Teushpa of Gimir and his whole army are run through with the sword.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: Twenty-one cities of mountain inhabitants are besieged, captured, spoiled,
    destroyed, torn down, and burned with fire, while others receive the heavy yoke
    of Esarhaddon's lordship.
  category: sequence
  evidence_refs:
  - ev:13
