canonical_text:
  quote: ''
  summary: A first-person royal speaker says Marduk created him and formed his embryo,
    that he followed divine shrines and paths, and that Marduk and Nabu granted him
    rule and a righteous sceptre. He prays to Marduk for guidance and devotion; Marduk
    hears him and establishes divine fear and service in his heart. Under Marduk's
    protection the speaker traverses distant lands, defeats enemies, orders the land,
    brings wealth to Babylon, restores Esagila, adorns shrines and gates with precious
    materials, and describes a New Year divine assembly where gods bow and fates are
    determined.
  language: English
  quote_policy: summarized
