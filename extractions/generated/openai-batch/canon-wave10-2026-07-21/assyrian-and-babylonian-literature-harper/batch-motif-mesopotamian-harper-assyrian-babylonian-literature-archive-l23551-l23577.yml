  quote: ''
  summary: An incantation addresses a sorceress whose words, tongue, lips, and footsteps
    are associated with hostile enchantment, bewitchment, and death. The speaker places
    bans on her mouth, tongue, eyes, feet, knees, and hands, binds her hands, invokes
    Sin to destroy part of her body and cast her into an abyss of water and fire,
    and compares her pallor to the circle of a seal.
