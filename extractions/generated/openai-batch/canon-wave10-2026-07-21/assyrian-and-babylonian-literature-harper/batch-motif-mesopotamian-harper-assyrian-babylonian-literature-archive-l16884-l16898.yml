canonical_text:
  quote: ''
  summary: A contract records that Itti-Marduk-balatu, son of Egibi, purchased the
    crop of a field for the seventh year of Cyrus from Tashmitum-damqat and Nadin-aplu,
    paid the money into their hands, and had the tablet witnessed, written, and dated
    at Babylon on Ululu thirteenth. An editorial note classifies the document as intermediate
    between rental and land sale because the standing crop, rather than the land,
    is sold.
