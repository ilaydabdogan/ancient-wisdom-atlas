canonical_text:
  quote: ''
  summary: A Shurpu colophon and seventh-tablet incantation describe Dimetu arising
    from the sea, a ban descending from heaven, evil spirits afflicting people and
    especially a man abandoned by his god, Marduk consulting his father Ea, and healing
    invocations to several deities for transfer of suffering, revival, purification,
    and restoration to the man's god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The colophon identifies the sixth tablet of the Shurpu Series and associates
    the copy with the palace of Ashurbanipal, king of Assyria.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The incantation states that Dimetu has arisen from the depths of the sea.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A ban is said to have come down from the heavens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Evil spirits are described as covering the earth, spreading to the four winds,
    shining like fire, and sending out flames.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The evil spirits torment people in dwellings, afflict bodies, cause lamentation
    in city and country, and bind men and women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The spirits pursue places associated with divine anger and fall upon a man
    from whom his god has departed.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The afflicted man is covered like a garment, filled with poison, bound hand
    and foot, crushed, sprinkled with gall, and affected by bodily symptoms including
    weakened breath or coughing, froth, foam, pain, and sleeplessness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Marduk looks with favor on the afflicted man and enters the house of Ea, his
    father, to speak with him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Marduk says he does not know what the man has done or how he can be cured.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ea answers Marduk as his son and says that what Ea knows, Marduk also knows,
    then tells him to go.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage notes that the next twenty lines are missing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The surviving invocation asks Nikilite to transfer the man's severe suffering
    to the swarming life of the earth, Damu to make him of good spirits, and Gula
    to heal him by the caress of her hand.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The invocation asks Marduk to loose the man's ban by conjuring, purify and
    brighten him, and have him washed and cleansed like a vessel.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The invocation asks that the man be commended to Shamash and that Shamash
    commend him safe and sound into the kindly hands of his god.
  category: speech
  evidence_refs:
  - ev:7
