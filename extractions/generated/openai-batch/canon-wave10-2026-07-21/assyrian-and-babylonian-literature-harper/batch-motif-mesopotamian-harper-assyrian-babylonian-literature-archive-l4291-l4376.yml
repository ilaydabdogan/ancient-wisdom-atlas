canonical_text:
  quote: ''
  summary: Agumkakrime presents himself as a divinely favored king and descendant
    of royal and divine figures. He says the great gods ordered the return of Marduk,
    and he brought Marduk and Qarpanit back to Esagila and Babylon, placed them securely,
    adorned them with golden robes, stones, and horn-shaped turbans, decorated their
    dragon mount and cultic setting, made cedar gates with images of mythic creatures,
    and had Esagila purified.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker identifies himself as Agumkakrime, son of Tasshigurumash, descendant
    of the god Shukamuna, called by several named gods, and a powerful hero of Ishtar.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker describes himself as a king of wisdom and prudence who grants
    hearing and pardon, a descendant of Abirumash, first son in the family of great
    Agum, and a mighty shepherd holding the reins of the nation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker claims kingship over Kasshu, the Akkadians, Babylon, Padan, Alman,
    and Gutium, and says he makes the four regions obedient to him and has been favored
    by the great gods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The great gods issue a command concerning the return of Marduk, lord of Esagila
    and Ezida, and the speaker induces Marduk to turn toward Babylon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says he went beside Marduk and Qarpanit, consulted Shamash by
    means of a lamb used by a haruspex, and sent someone to the far-off country of
    Hani.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Marduk and Qarpanit are brought back to Esagila and Babylon, placed in the
    rear shrine of the house of Shamash, and secured there by ordered workmen.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The speaker commands a goldsmith, gives four talents of fine gold for robes
    of Marduk and Qarpanit, clothes the gods in fine gold garments, and decorates
    their shrines and robes with precious stones.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: High horn-shaped turbans indicating royal rule are placed on the heads of
    the deities and decorated with crystal, gold, and stones.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A dragon ridden by the divine majesties is decked with gold; its stall is
    ornamented, a sea is constructed for it, and its breast and gill area are decorated
    with stones, gold, and crystal.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Men are sent to cedar and cypress districts and to a splendid fragrant mountain,
    from which cedars and cypresses are brought for large cedar gates and swinging
    doors in the chambers of Marduk and Qarpanit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Images or inlays of a serpent, dragon, ram, storm-goat, mad hound, fish-man,
    and goatfish are made from precious materials and set with the fine gates in the
    chambers of Marduk and Qarpanit.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: A priest, glossed as a snake-charmer, is made to purify Esagila, and the habitations
    are purified and dedicated.
  category: action
  evidence_refs:
  - ev:10
