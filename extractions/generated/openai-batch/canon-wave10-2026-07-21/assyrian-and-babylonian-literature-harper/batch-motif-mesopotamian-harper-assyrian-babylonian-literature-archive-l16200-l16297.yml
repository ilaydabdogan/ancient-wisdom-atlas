    win back the country, and give it to the king.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Pir'i-Bel, son of Bel-eter, is reported to have gone to Elam with his father,
    returned to Babylonia, acted against Assyria in Erech, and later retired again
    to Elam; Bel-eter died in Elam.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nabu-ushabshi warns the king not to believe Pir'i-Bel if he claims to have
    come from Elam, and asks that witnesses and Daru-sharru be questioned about treasonable
