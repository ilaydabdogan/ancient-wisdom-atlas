canonical_text:
  quote: ''
  summary: The passage contains translated Assyrian and Babylonian letters. Nabu-ushabshi
    addresses the king, invokes Erech, E-anna, Ishtar of Erech, and Nana for the king’s
    life, reports royal orders against Gambulu, recounts injuries caused by Bel-iqisha’s
    revolt, and gives strategic advice. A second letter reports movements and alleged
    treasonable conduct of Pir'i-Bel and related letters. A royal message to Sin-tabni-uqur
    reassures him against slander and attributes an accuser’s distorted understanding
    to Shamash.
  language: English
  quote_policy: summarized
