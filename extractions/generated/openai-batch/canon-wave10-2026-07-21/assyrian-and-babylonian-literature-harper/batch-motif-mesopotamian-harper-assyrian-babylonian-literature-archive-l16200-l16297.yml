- id: obs:1
  text: The editorial introduction identifies Nabu-ushabshi as an Assyrian official
    of Erech in southern Babylonia who suffered from Bel-iqisha’s revolt and advised
    on the reduction of Gambulu.
  category: relationship
  evidence_refs:
  - ev:1
