canonical_text:
  quote: ''
  summary: The passage gives brief astrological report material. A message attributed
    to Nergal-etir asks for an ass. Lunar and solar visibility on specified days is
    interpreted as predicting royal hostility, siege, enemy movement, and regional
    fortune or misfortune. Solar positions relative to the Moon are interpreted as
    signs of a secure throne and royal justice. The invisibility of Sun and Moon and
    Saturn drawing near the Moon are interpreted as favorable for the king or as increasing
    royal wisdom.
  language: English
  quote_policy: summarized
