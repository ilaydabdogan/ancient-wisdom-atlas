  summary: The passage introduces the Tel-el-Amarna letters as tablets found in Egypt
    but written in languages associated with Mesopotamia and Babylonia. It identifies
    major Egyptian and Asiatic correspondents, describes the letters as evidence for
    Egypt’s relations with western Asia, notes appeals for help from Egyptian subjects,
    and connects royal marriage contracts with Amenophis IV’s preference for Asiatic
    worship and his move to Tel-el-Amarna.
  language: English
