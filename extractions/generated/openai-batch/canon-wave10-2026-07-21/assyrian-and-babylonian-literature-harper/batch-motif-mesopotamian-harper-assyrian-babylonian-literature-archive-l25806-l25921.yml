canonical_text:
  quote: ''
  summary: A sequence of translated Mesopotamian prayers invokes Bel, Ea, Marduk,
    Nabu, and Bau. Marduk is praised as lord of natural domains, creator, ruler of
    divine collectives, and a deity who judges, determines fate, heals sickness, and
    wards off sorcery. Nabu is praised as Marduk’s first-born, bearer of the tablet
    of divine fate, protector of sacred cities, granter of life, and source of truth.
    Bau is addressed as a mighty merciful mother in heaven who judges, determines
    destinies, raises to life, grants prosperity, protects, benefits, and saves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening blessing asks Bel to be the addressee’s light and Ea to make the
    addressee rejoice; it also asks that the gods be tributary and pleasing to the
    addressee.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Marduk is addressed with exalted titles including lord of countries, powerful,
    independent, perfect, exalted, and lofty, though some surrounding lines are broken.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Marduk is described as lord of fountains, mountains, and seas; overseer of
    mountains; director of rivers; and provider of grain, wheat, barley, and green
    herb.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Marduk is described as creating what gods and goddesses create, ruling the
    Anunnaki, leading the Igigi, being first-born of Ea, creating all mankind, acting
    like father and mother, and lighting darkness like the Sun-god.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker asks Marduk to stand by, hear the cry, pronounce judgment, determine
    fate, destroy sickness, and remove bodily disease.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker asks that, by command of the deity’s mouth, no evil or magic of
    sorcerer and sorceress approach.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nabu is addressed as prince, first-born of Marduk, offspring of Jarpanit as
    printed, bearer of the tablet of the fate of the gods, director of Esagila, lord
    of Ezida, protection of Borsippa, beloved of Ea, granter of life, patron of Babylon,
    and protector of the living.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Nabu prayer identifies the speaker as a grievously ill servant afflicted
    by the hand of a demon and by poison from a broken phrase.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker petitions Nabu to grant life and prosperity, establish truth in
    the speaker’s mouth, put kindness in the speaker’s heart, and proclaim favors.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker asks that a personal god stand at the right hand, a personal goddess
    at the left hand, and favorable Shedu and Lamassu be with the speaker.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Bau is addressed as mighty mistress and merciful mother dwelling in the brilliant
    heavens; the speaker asks her to stand and listen.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speaker says he has sought Bau, turned to her, and seized her garment
    in a phrase marked uncertain by the translator.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Bau is said to pronounce judgments, determine destinies, raise to life, grant
    prosperity, protect, benefit, and save.
  category: attribute
  evidence_refs:
  - ev:13
