candidate_motifs:
- id: motif:1
  label: divine judgment and fate determination
  taxonomy_refs:
  - divine_judgment
  basis: Marduk is asked to pronounce judgment and determine fate; Nabu bears the
    tablet of the fate of the gods; Bau pronounces judgments and determines destinies.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:13
  confidence: high
  cautions: The passage is liturgical praise and petition, not a narrative episode
    of trial or judgment.
- id: motif:2
  label: divine parent-child lineage among gods
  taxonomy_refs:
  - divine_parent_child
  basis: Marduk is called first-born of Ea, and Nabu is called first-born of Marduk
    and offspring of Jarpanit as printed.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage gives epithets and lineage statements only; it does not narrate
    a birth.
- id: motif:3
  label: healing and restoration of life through divine petition
  taxonomy_refs:
  - resurrection
  basis: The speaker asks Marduk to remove sickness and disease, asks Nabu for life
    and prosperity, and states that Bau raises to life and grants prosperity.
  evidence_refs:
  - ev:5
  - ev:9
  - ev:13
  confidence: medium
  cautions: The term 'raise to life' may refer broadly to recovery or life-restoration;
    the passage does not describe a death-and-return narrative.
- id: motif:4
  label: merciful mother goddess as protector and savior
  taxonomy_refs:
  - mother_goddess
  basis: Bau is addressed as a merciful mother dwelling in the heavens and is credited
    with protection, benefit, saving, judgment, destiny determination, and life-restoration.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: high
  cautions: Only Bau receives explicit mother-language in this passage.
- id: motif:5
  label: wisdom, truth, and authoritative speech
  taxonomy_refs:
  - wisdom
  basis: Nabu is called prudent, truth is said to be in his mouth, the speaker asks
    truth to be established in his own mouth, and divine command through the mouth
    prevents evil.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage emphasizes truth and divine command more than a developed
    wisdom narrative.
- id: motif:6
  label: apotropaic protection from demons and sorcery
  taxonomy_refs: []
  basis: The prayers ask that no evil or magic of sorcerer and sorceress approach,
    identify affliction by the hand of a demon, and request protective divine and
    spirit companions.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:10
  confidence: high
  cautions: No available taxonomy reference directly matches this protective-prayer
    pattern.
- id: motif:7
  label: deity governing waters, mountains, rivers, and agricultural growth
  taxonomy_refs: []
  basis: Marduk is praised as lord of fountains, mountains, and seas, director of
    rivers, and provider of grain and vegetation.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is an epithet cluster rather than a narrative mythic action.
comparison_claims:
- id: claim:1
  claim: The passage can be compared with the divine_judgment motif family because
    several deities are linked to judgment, destiny, fate, or the tablet of fate.
  claim_level: same_motif
  target: divine_judgment
  evidence_refs:
  - ev:5
  - ev:7
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The evidence is from prayer formulae and divine titles, not from a
    narrated judgment scene.
- id: claim:2
  claim: The Bau prayer fits the mother_goddess motif family in function and wording,
    since Bau is explicitly addressed as a merciful mother and credited with saving
    and life-restoring powers.
  claim_level: same_motif
  target: mother_goddess
  evidence_refs:
  - ev:11
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not include a birth myth, maternal genealogy, or extended
    mother-goddess narrative.
- id: claim:3
  claim: The healing and 'raise to life' language is comparable only in a broad functional
    sense to a resurrection or life-restoration pattern.
  claim_level: same_function
  target: resurrection
  evidence_refs:
  - ev:5
  - ev:9
  - ev:13
  counter_evidence_refs: []
  confidence: low
  limitations: The speaker is ill, and the passage does not explicitly narrate death,
    burial, return from death, or resurrection.
- id: claim:4
  claim: The divine child and first-born epithets support comparison with a divine_parent_child
    motif pattern involving lineage among gods.
  claim_level: same_motif
  target: divine_parent_child
  evidence_refs:
  - ev:4
