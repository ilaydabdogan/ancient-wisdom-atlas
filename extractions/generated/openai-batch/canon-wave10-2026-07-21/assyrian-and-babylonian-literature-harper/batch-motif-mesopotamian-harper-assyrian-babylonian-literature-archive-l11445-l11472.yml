canonical_text:
  quote: ''
  summary: A damaged stele passage describes a ruler who attacks Babylon, ruins temples
    and shrines, and brings Prince Marduk to Asshur. Marduk remains angry and dwells
    there for twenty-one years until the appointed time when wrath is appeased. The
    King of Assyria is said to be killed by his own son because of Marduk’s wrath.
    An unnamed beneficiary receives a helper and ally; the king of the Umman-manda
    is made obedient to his command, helps him, lays waste widely, and avenges Babylon.
