canonical_text:
  quote: '"Mountain, bring a dream unto Eabani! Let him see dream-visions, O Shamash."'
  summary: Humbaba and the cedar forest are described as terrifying and dangerous.
    Gilgamesh tells Eabani of a favorable dream in which he saw Humbaba’s corpse,
    and the two set out, stopping at measured intervals. Before Shamash, Gilgamesh
    digs a hole, pours in a sacrificial meal, and asks Mountain and Shamash to bring
    dream-visions to Eabani. At midnight Gilgamesh wakes and reports a third, terrible
    dream of thunder, earthquake, darkness, lightning, fire, destruction, death, and
    smoke. Eabani hears the dream; the tablet then breaks off.
  language: English
  quote_policy: quoted
