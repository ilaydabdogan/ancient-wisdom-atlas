canonical_text:
  quote: their waters were mingled together
  summary: 'The passage first records a Nippur legal bond in which Bel-akhi-iddin
    becomes surety for the release of Nidintum-Bel from prison, with a monetary penalty
    if Nidintum-Bel leaves Nippur without a judge''s permit. It then begins a Babylonian
    creation account: before heaven and earth were named, Apsu and Tiamat are present
    as primeval sources, their waters are mingled, fields and reeds are absent, no
    gods or fates have yet been established, and early divine beings are created in
    sequence.'
  language: English
