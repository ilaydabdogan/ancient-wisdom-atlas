canonical_text:
  quote: ''
  summary: Gilgamesh instructs the hunter to take Uchat to the well where the animals
    come to drink, expose herself to Eabani, and cause the cattle around him to forsake
    him. The hunter and Uchat travel to the appointed field, wait by the well, and
    see Eabani arrive from the mountains among gazelles, cattle, and water creatures.
    The hunter urges Uchat to uncover herself before Eabani. An editorial note identifies
    Uchat as a sacred woman associated with Ishtar's temple at Erech.
  language: English
  quote_policy: summarized
