canonical_text:
  quote: ''
  summary: Bel-Marduk confronts Tiamat, accusing her of fomenting battle, elevating
    Kingu, and opposing the gods. Tiamat responds with fury and incantation. Marduk
    traps and kills her with his net, winds, and lance; her allied host, eleven creatures,
    and Kingu are captured. Marduk takes the Tablets of Destiny from Kingu, returns
    to Tiamat's body, divides it, and makes one half into the heavenly dome with bars
    and watchmen.
  language: English
  quote_policy: summarized
