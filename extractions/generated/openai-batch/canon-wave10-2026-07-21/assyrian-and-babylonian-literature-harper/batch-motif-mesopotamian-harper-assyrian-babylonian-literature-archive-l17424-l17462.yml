canonical_text:
  quote: ''
  summary: A Babylonian divorce contract dated to the third year of Nabonidus states
    that Na'id-Marduk will provide specified daily food and drink and annual goods
    to his wife Ramua and his son Arad-Bunini. A fragmentary clause says that if she
    flees to Nergal, the flight will not annul the arrangement. An editorial note
    interprets the document as a legal divorce granting alimony and compares it with
    other marriage contracts involving slave brides, free brides, and dowry arrangements.
  language: English
  quote_policy: summarized
