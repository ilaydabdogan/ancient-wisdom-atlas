canonical_text:
  quote: ''
  summary: In this excerpt from the Babylonian creation account, Tiamat creates and
    arms terrifying beings. She elevates Kingu, gives him command of the host, places
    him on a throne, and gives him the Tablets of Destiny. A divine report says Anu
    and Nudimmud failed to face Tiamat, while Marduk is willing to oppose her if the
    gods proclaim his supreme authority. Gaga then travels to Luchmu and Lachamu and
    conveys An-shar's message about Tiamat's revolt and monster host.
  language: English
  quote_policy: summarized
