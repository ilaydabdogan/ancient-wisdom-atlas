canonical_text:
  quote: ''
  summary: A colophon identifies a penitential psalm/tablet for Bel. In the psalm,
    a priest describes a distressed suppliant who weeps, moans, prostrates himself,
    suffers affliction and bondage, confesses many sins, asks that a curse depart
    into the desert, and pleads for divine mercy and forgiveness, with Ea's command
    invoked to pacify the deity's heart.
  language: English
