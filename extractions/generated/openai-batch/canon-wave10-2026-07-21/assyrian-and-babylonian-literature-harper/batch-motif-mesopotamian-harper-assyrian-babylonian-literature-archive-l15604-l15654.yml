  quote: "“To the great king, my lord, my god, my sun”"
  summary: Aziri writes to the king of Egypt in a formula of submission, denies slanders,
    explains his dealings with Hani, reports obstacles to rebuilding Simyra because
    of hostile powers and Hatib’s seizures, and responds to an accusation about caring
    for Hittite messengers while promising goods if the king’s messenger comes.
