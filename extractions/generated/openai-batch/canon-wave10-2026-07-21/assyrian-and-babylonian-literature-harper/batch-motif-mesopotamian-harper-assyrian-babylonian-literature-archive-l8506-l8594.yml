canonical_text:
  quote: ''
  summary: The Assyrian royal narrator receives tribute from subordinate kings, mobilizes
    their troops and ships, and marches to support subject rulers in Egypt. Tirhaka
    of Egypt and Ethiopia prepares for battle but his forces are defeated under the
    protection of named great gods. Tirhaka flees from Memphis to Thebes, and the
    narrator captures the city, restores appointed Egyptian rulers, strengthens garrisons,
    and returns to Nineveh with plunder. Later the appointed kings violate covenants
    and divine oaths, seek a league with Tirhaka, and plot against Assyrian troops.
    Assyrian military governors intercept the messengers, bind the kings in iron,
    punish allied cities severely, bring the rebel kings to Nineveh, spare Necho alone,
    and tighten the covenant.
  language: English
  quote_policy: summarized
