canonical_text:
  quote: ''
  summary: The passage describes royal foundation rites, brickmaking, offerings to
    a brick deity, construction of shrines, palace, walls, and directional gates named
    for gods; the settlement and instruction of conquered peoples; a curse against
    anyone who damages the royal works; and the opening of a separate inscription
    in which Marduk restores favor to Akkad and guides Merodachbaladan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A month is said to have received the name "Month of the Brick-God" by decree
    of Anu, Bel, and Ea because bricks are made and cities and houses are built in
    it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the festival day of Nabu, the royal speaker ordered bricks to be made.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The royal speaker offered sacrifice, poured libations, and lifted his hands
    in prayer to the brick-god before founding the work and laying its brick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The month Ab is described as the month of the servant of the fire-god, who
    destroys fresh vegetation and lays platform foundations of city and house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The royal speaker built shrines for Ea, Sin, Ningal, Ramman, Shamash, and
    Ninib.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The royal speaker built a palace from ivory and several woods, constructed
    a colonnade in the style of a Hittite palace, measured the wall by the numerical
    value of his name, and laid the platform foundation on stones from high mountains.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Eight city-gates were opened in the direction of the eight winds and named
    with divine name-formulas for gates on the east, north, west, and south sides.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The inner wall was named for Ashur and the outer wall for Ninib.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Subjects from the four quarters of the world, speaking strange languages and
    varied dialects, were carried into captivity, made of one speech, and settled
    in the city.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Assyrian men of knowledge, learned men, and scribes were sent to teach the
    settlers the fear of God and king.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Gods dwelling in heaven, on earth, and in the city looked favorably on the
    royal command and granted the speaker lasting privilege to build and make the
    city permanent.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A curse is pronounced against anyone who alters the royal work, tears down
    images, covers bas-reliefs, or destroys insignia; named gods are asked to remove
    that person's name and seed from the land and bind him at an enemy's feet.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the opening of the Merodachbaladan inscription, Marduk is described as
    a supreme wise lord who had turned from Akkad in wrath but then granted favor,
    searched among humankind, and guided Merodachbaladan.
  category: sequence
  evidence_refs:
  - ev:10
