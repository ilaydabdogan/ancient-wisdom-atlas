  quote: ''
  summary: The passage opens with a prayer for conquest, long days, offspring, and
    divine favor, using the image of an eternal tablet that defines the boundaries
    of heaven and earth. It then presents Nebuchadrezzar II as king of Babylon, chosen
    by Marduk, patron of Nabu's shrines, priest-king, and son of Nabopolassar. Nebuchadrezzar
    says Marduk created him and entrusted him with Babylon's shrines; he describes
    continual faithfulness, adornment of Esagila and Ezida with precious materials,
    and work on Babylon's walls.
