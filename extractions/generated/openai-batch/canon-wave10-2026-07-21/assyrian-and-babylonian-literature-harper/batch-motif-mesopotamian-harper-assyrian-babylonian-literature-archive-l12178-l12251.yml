canonical_text:
  quote: ''
  summary: Cyrus presents himself as a royal descendant favored by Bel, Nabu, and
    Marduk. He describes his peaceful entrance into Babylon, care for Marduk's worship,
    protection and relief of the Babylonians, homage from other kings, and restoration
    of displaced gods and peoples to their cities and shrines. He asks that the restored
    gods pray for his long life and reports that all lands dwell in quiet.
  language: English
  quote_policy: summarized
