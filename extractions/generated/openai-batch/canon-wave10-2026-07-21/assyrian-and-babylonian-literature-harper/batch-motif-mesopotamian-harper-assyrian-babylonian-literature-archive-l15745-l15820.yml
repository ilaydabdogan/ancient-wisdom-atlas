canonical_text:
  quote: ''
  summary: The passage contains the close of one appeal from Gebal and a letter from
    Rib-Addi to the king of Egypt. Rib-Addi complains that previous messages were
    ignored and that his messenger returned without troops. He warns that his brother
    and the sons of Abd-Ashirta may seize or receive Gebal, reports that age and disease
    prevent him from going to Egypt, says the gods of Gebal are troubled because of
    his sins, sends his son to the king, and repeatedly asks for troops to hold Gebal
    and prevent the loss of the city, its temples, and the king's property.
  language: English
  quote_policy: summarized
