canonical_text:
  quote: ''
  summary: Adapa explains his mourner's garment by naming Tamuz and Gishzida as vanished
    gods, enters Anu's presence, and is questioned about breaking the south-wind's
    wing. He says the south-wind submerged him while he was fishing for his lord.
    Tamuz and Gishzida intercede with Anu, who then questions why Ea revealed heavenly
    and earthly mysteries to a man. Adapa refuses the offered Meat of Life and Water
    of Life, accepts a garment and oil, and says Ea commanded him not to eat or drink.
    Anu says this means he will not live forever and orders him returned to his land.
    The end is mutilated.
  language: English
  quote_policy: summarized
