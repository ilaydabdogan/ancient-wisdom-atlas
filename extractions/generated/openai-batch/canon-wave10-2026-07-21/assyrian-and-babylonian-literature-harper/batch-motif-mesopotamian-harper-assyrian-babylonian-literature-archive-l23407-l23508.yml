canonical_text:
  quote: Burn the sorcerer and the sorceress, / Devour my enemies, destroy my foes
  summary: A sequence of Maqlu incantations invokes the Fire-god against sorcerers
    and sorceresses. The speaker is instructed to whisper incantations before ritual
    images of honey, clay, and bitumen, including a bitumen image with gypsum poured
    over it. The Fire-god is asked to judge, burn, overpower, and make the sorcerers
    disappear as the images do; the speaker also reverses binding charms upon the
    enchanter and witch by command of Marduk.
  language: English
  quote_policy: quoted
