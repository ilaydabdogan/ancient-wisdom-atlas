  summary: A Shurpu incantation passage describes an unnamed male subject searching
    across objects, animal areas, water places, ships, solar directions, divine and
    earthly shrines, city and house thresholds, streets, temples, and roads. The speaker
    petitions Shamash and then a long sequence of gods, goddesses, temples, cities,
    stars, winds, and fire-associated powers to loosen or release the subject and
    his ban.
