canonical_text:
  quote: ''
  summary: A royal inscription of Tiglath-pileser I recounts tribute from Qummuh,
    votive gifts to Ashur and Adad, campaigns against Mildish and other unsubmissive
    peoples, mountain marches and pursuits, burning of enemy cities, forced tribute,
    submission gestures, and divine authorization from Ashur for weapons, conquest,
    boundary expansion, and mountain ascent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator accepts taxes and tribute from Qummuh, including vessels, slaves,
    and livestock, and says he conquered and subjugated Qummuh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: From Qummuh's spoil and tribute, the narrator gives a copper sacrificial dish
    and bowl to Ashur as a votive offering and gives bronze unguentaries with idols
    to Adad.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator says Ashur gave power and supremacy to his mighty weapons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator marches with thirty war chariots and veterans against Mildish,
    crosses mountains and difficult territory, leaves chariots on Mount Aruma, and
    goes at the head of his soldiers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator describes moving through the rough mountain terrain with a lizard-like
    comparison and advancing to mountain peaks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mildish is reduced, its soldiers are defeated, booty is taken, its cities
    are burned, and hostages, taxes, and tribute are imposed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A royal epithet calls Tiglath-pileser a valiant hero who opens mountain paths,
    subdues the unsubmissive, and sweeps away the haughty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator subjugates Shubari and imposes the heavy yoke of lordship on
    Alzi and Purukuzzu, ordering yearly taxes and tribute to Asshur.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator says Ashur entrusted him with mighty weapons and commanded him
    to extend the boundaries of his country.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kaskeans and Urumeans who had captured cities of Sumashtu fear battle, embrace
    the narrator's feet, and are taken with belongings, chariots, and teams into the
    narrator's country.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In a second campaign against Qummuh, the narrator conquers cities, takes goods,
    burns cities, and destroys and devastates them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Survivors from Qummuh flee to inaccessible mountain peaks; the narrator ascends
    in pursuit, fights them, and defeats them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The narrator says corpses are heaped on mountain peaks, blood flows over ravines
    and mountain high places, booty is brought down, and Qummuh is incorporated into
    his country.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A royal epithet calls Tiglath-pileser a powerful king and a snare for the
    unsubmissive.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: With forces given by Ashur, the narrator marches against Haria and the Kurteans;
    Ashur commands him to ascend lofty mountains that no king had ascended before
    in the passage's wording.
  category: sequence
  evidence_refs:
  - ev:8
