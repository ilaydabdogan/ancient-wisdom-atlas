canonical_text:
  quote: ''
  summary: Tiglath-pileser I narrates campaigns against enemies across the Euphrates,
    Musri, and the Qumaneans. He attributes his victories to Ashur, destroys cities
    with fire, defeats troops in mountain battles, takes booty, idols, hostages, taxes,
    and tribute, erects a copper memorial slab, and summarizes the subjection of forty-two
    countries during the first five years of his reign.
  language: English
  quote_policy: summarized
