canonical_text:
  quote: ''
  summary: The passage describes Nebuchadrezzar II rebuilding Babylonian walls and
    a bridge on the procession street of Marduk, then praying to Marduk for favor,
    offspring, a firm throne, and enduring reign. A following inscription presents
    Nebuchadrezzar as a righteous and pious king, son of Nabopolassar, raised by Marduk
    to rule and restore shrines. It recounts the decay and rebuilding of E-babbara,
    the temple of Shamash at Sippar, after prayer and oracle consultation with Shamash,
    Ramman, and Marduk. The king prays to Shamash for divine favor, offspring, long
    life, stable rule, justice, and protection of his people.
  language: English
  quote_policy: summarized
