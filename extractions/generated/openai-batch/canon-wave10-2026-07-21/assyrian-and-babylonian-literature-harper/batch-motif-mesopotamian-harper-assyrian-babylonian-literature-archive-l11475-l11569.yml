canonical_text:
  quote: ''
  summary: The passage reports the ruin of hostile cities and the restoration of divine
    sanctuaries; the displacement and return of Nana/Ishtar and other goddesses to
    their proper residences; the enthronement of the first-person royal speaker by
    Marduk’s command after Labashi-Marduk’s improper rule; and dream, omen, prayer,
    and divine favor scenes involving celestial bodies, Bau/Gula, Nabu, Tashmet/Gula,
    and royal insignia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hostile cities on the border of Akkad are said to have been ruined, their
    sanctuaries not left, and their cities laid waste like a cyclone; the same section
    also describes ruined mounds and temples of the gods being established again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nana of Uruk is described as a lofty princess dwelling in a house of gold
    and harnessing seven lions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Urukkaeans are said to have crushed Nana’s power, torn down her house,
    and turned loose her lions; Nana went forth from E-an-na in wrath and resided
    elsewhere.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A deity who did not belong in E-an-na was permitted to reside in Nana’s shrine,
    and the passage says the proper goddess was restored to her house and shrine with
    the seven lions harnessed again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ishtar, mistress of Elam, has her residence restored; Anunit’s residence and
    shrine had been changed or ruined, and Neriglassar renewed her, furnished her
    with a divinity-gown, permitted her residence in Sippar of Am-na-nu, and re-established
    her offerings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a ruler went the way of fate, Labashi-Marduk, described as not knowing
    how to rule, sat on the royal throne against the will of the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first-person speaker says he was brought to the palace, received homage
    at his feet, and was raised to rule the land by command of Marduk while people
    acclaimed him as father of the land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker claims connection with Nebuchadrezzar and Neriglassar, says their
    troops were entrusted to him, and contrasts his obedience with the broken commands
    of Evil-Merodach and Labashi-Marduk.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker prays concerning the approach of a great star and Sin; a noble
    lord states that the approach betokens no evil, and in a dream Nebuchadrezzar
    and a minister stand on a chariot while the speaker reports seeing a great star,
    Sin, and Marduk in the high heavens auspiciously.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker prays to celestial bodies and deities for long life, a firm throne,
    an enduring reign, and favor before Marduk.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The speaker sees Bau/Gula, described as making the dead live and giving long
    life, prays for eternal life for his soul, and says she turns her face in favor,
    looks on him with a shining countenance, and grants mercy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In E-sha-pa-kalama-shum-ma, the speaker approaches Nabu, who makes his reign
    long and entrusts him with a righteous sceptre and firm staff; he also seeks the
    seat of Tashmet/Gula, who grants life, and receives favor before Marduk.
  category: sequence
  evidence_refs:
  - ev:6
