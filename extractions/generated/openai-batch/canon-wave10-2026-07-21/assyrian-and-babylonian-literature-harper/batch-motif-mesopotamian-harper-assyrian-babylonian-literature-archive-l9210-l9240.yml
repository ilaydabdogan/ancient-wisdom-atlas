canonical_text:
  quote: ''
  summary: 'A parallel inscription recounts events in Elam before Ashurbanipal''s
    campaign: Indabigash takes the Elamite throne, tries to return Assyrian captives
    and seek covenant and peace, receives a threatened demand from Ashurbanipal that
    does not reach him, and is overthrown and killed after divine-backed fear of Ashurbanipal
    overwhelms Elam. Ashurbanipal then installs Ummanaldash on the throne.'
  language: English
  quote_policy: summarized
