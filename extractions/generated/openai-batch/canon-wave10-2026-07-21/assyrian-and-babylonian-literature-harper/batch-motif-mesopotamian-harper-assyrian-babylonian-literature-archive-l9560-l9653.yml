canonical_text:
  quote: ''
  summary: Ashurbanipal recounts treaty-breaking and rebellion by Arabian and allied
    rulers, military defeats imposed under divine command and protection, captured
    enemies displayed in cages or chains, famine in Babylon, mercy followed by an
    oath and installation of a new Arabian king, and a renewed alliance with Nabataea
    that provokes fear of Ashur's power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ruler named Uaite is described as breaking Ashurbanipal's treaty, rejecting
    the yoke of his lordship, withholding tribute, and sending forces to Abiyate and
    Ayamu to aid Shamash-shum-ukin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shamash-shum-ukin is called the hostile brother and is said to have stirred
    up Arabians to revolt and to plunder people placed under Ashurbanipal's dominion.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Ashurbanipal says he summoned troops at the command of Ashur and Ishtar and
    defeated enemies across named western regions including Edom, Beth-Ammon, Hauran,
    Moab, Sa'arri, Harge, and Cubitu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Arabians who went with the rebel are said to have been run through with
    the sword; the rebel fled, tents were burned, and Uaite fled alone to Nabataea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Uaite son of Hazael, cousin of Uaite son of Birdadda and self-made King of
    Arabia, came before Ashurbanipal after Ashur changed his purpose.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ashurbanipal says he punished Uaite son of Hazael by putting him in a cage,
    binding him with wild beasts or dogs, and setting him to watch the city gate of
    Nineveh called the Entrance to Temple-street.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ammuladi, King of Kedar, advanced to make war upon western kings whom Ashur,
    Ishtar, and the great gods had entrusted to Ashurbanipal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ashurbanipal says he defeated Ammuladi under the protection of a list of gods;
    Ammuladi and Adiya, wife of Uaite, were captured alive and brought before him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ammuladi was put in a dog-chain and set to watch in a cage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: An ally of Abiyate and Ayamu who had come to aid Shamash-shum-ukin was defeated;
    people inside Babylon, under famine, ate one another's flesh.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After a second defeat, the enemy fled alone, threw himself at Ashurbanipal's
    feet, received mercy, swore by the great gods, and was made King of Arabia instead
    of Uaite son of Hazael.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The newly installed king later made common cause with the Nabataeans, did
    not fear the oath by the great gods, and plundered Ashurbanipal's border.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Natnu, King of Nabataea, heard of the power of Ashur that emboldened Ashurbanipal
    and was overcome by fear of the victorious weapons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A footnote reports that another inscription says Adiya's warriors were slain,
    their tents were burned with fire, and Adiya herself was seized alive and taken
    to Assyria with plunder.
  category: other
  evidence_refs:
  - ev:8
