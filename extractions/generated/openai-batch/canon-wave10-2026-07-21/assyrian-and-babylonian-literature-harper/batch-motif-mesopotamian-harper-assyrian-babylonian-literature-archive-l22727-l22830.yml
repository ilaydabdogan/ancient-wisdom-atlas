canonical_text:
  quote: ''
  summary: Gilgamesh laments Eabani's descent to the shades and appeals to deities.
    Bel and Sin cannot help; Ea petitions Nergal, who opens the grave and causes Eabani's
    spirit to rise like wind. Gilgamesh asks Eabani to describe the netherworld, but
    Eabani warns that the description would cause grief. The closing portion contrasts
    the restful condition of the properly buried or battle-slain dead with the unrest
    of the unburied dead.
  language: English
  quote_policy: summarized
