  summary: The passage opens the Third Tablet by stating that Marduk, described as
    the conjurer among the gods, will loose any ban that befalls a person. It then
    lists many possible sources or occasions of a ban, including kinship relations,
    social relations, oaths, fire-related acts, domestic objects, water in an unclean
    cup, debt, bribery in judgment, plants, reeds, weapons, wild animals, offerings
    or alms, and an unclear final item.
