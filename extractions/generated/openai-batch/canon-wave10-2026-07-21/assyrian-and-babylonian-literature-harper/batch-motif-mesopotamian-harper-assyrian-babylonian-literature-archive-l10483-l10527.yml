  quote: ''
  summary: 'A first-person royal inscription describes construction and restoration
    works in Babylon: processional streets for Marduk, the walls Imgur-Bel and Nimitti-Bel,
    gates rebuilt with elaborate materials, bronze wild-bulls and upright serpents
    at thresholds, and added walls and a moat for protection.'
