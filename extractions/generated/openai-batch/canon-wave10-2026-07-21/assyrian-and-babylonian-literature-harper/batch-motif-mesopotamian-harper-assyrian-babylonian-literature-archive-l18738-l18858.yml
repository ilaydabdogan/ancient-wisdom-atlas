canonical_text:
  quote: ''
  summary: A section of the Babylonian creation account describes the restraint and
    measuring of apsu, the fashioning of Esharra as heaven and divine city, a scribal
    colophon, and the ordering of celestial stations, stars, calendar divisions, Nibir,
    heavenly gates, zenith, and the moon-god Nannar. Fragmentary later lines preserve
    divine names and praise connected with purification, mercy, abundance, and blessing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An actor commands that the waters not be let out, passes through the heavens,
    inspects their regions, and establishes Nudimmud's home in front of apsu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bel measures the structure of apsu and fashions Esharra corresponding to it.
  category: action
  evidence_refs:
