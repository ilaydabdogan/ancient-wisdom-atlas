- id: obs:3
  text: Esharra is described as a great structure built as heaven and made into a
    city for Anu, Bel, and Ea to inhabit.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A colophon says that the fourth tablet contains one hundred and forty-six
    lines and that Na'id-Marduk wrote and placed the tablet in E-zida, the Temple
    of Nebo in Borsippa, in honor of Nebo and for preservation of his own life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Marduk is identified in a note as the actor who establishes stations for the
    great gods, fixes stars and constellations, ordains the year, and divides twelve
    months by stars.
  category: action
  evidence_refs:
  - ev:4
  - ev:11
- id: obs:6
  text: The station of Nibir is established to mark bounds so that days will not deviate
    or be lacking; notes identify Nibir as Jupiter, the planet of Marduk.
  category: object
  evidence_refs:
  - ev:5
  - ev:11
- id: obs:7
  text: Great gates are opened on both sides of the firmament, bolts are strengthened
    on left and right, and the zenith is placed in the midst of heaven.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nannar, the moon-god, is brought forth, entrusted with night, and placed as
    the luminary of night to mark off days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A speech instructs the moon concerning shining horns, half disk, and positions
    or approaches on specified days of the month.
  category: speech
  evidence_refs:
  - ev:8
