canonical_text:
  quote: He has seized with his hand the Tablets of Destiny
  summary: Zu has taken Bel's supremacy and the power of command and has fled toward
    an inaccessible mountain. The divine palace reacts with grief and Bel with rage.
    Anu asks which god will defeat Zu, first commissioning Adad and then Ishtar with
    promises of fame, shrines, and habitation; both decline because Zu holds the Tablets
    of Destiny and even the gods bow to his command. Bara, child of Ishtar, is then
    called and begins to receive the same command.
  language: English
  quote_policy: quoted
