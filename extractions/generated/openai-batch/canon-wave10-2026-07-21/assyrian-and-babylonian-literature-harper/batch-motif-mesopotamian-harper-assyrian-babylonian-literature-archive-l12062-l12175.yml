canonical_text:
  quote: ''
  summary: A fragmentary chronicle notice reports return to cities, the killing of
    a king's son, public lamentation, and cultic actions involving Nabu and Bel. The
    Cyrus Cylinder section condemns a prior ruler's cultic failures and harsh rule,
    describes Marduk's anger and the departure of gods from their abodes, then presents
    Marduk as mercifully choosing Cyrus, guiding him to Babylon, allowing a battleless
    entry, delivering Nabonidus into his hand, and receiving public homage for Cyrus's
    rule. Cyrus then declares his royal titles over Babylon, Sumer and Akkad, and
    the four quarters of the world.
  language: English
  quote_policy: summarized
