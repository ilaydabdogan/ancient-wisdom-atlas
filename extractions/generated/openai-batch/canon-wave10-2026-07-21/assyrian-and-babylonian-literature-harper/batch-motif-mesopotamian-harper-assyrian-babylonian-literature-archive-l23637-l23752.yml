  quote: May he be loosed from whatever bans him!
  summary: The passage lists possible social, legal, familial, military, ritual, and
    divine offenses committed by an unnamed male subject, then asks that he be released
    from any ban affecting him. It catalogs possible sources of ban, including acts,
    gifts, living beings, forms of relatives and authorities, destruction against
    a city, contact with a banned person, and shared use of bed, seat, table, cup,
    fire-pan, and torch.
