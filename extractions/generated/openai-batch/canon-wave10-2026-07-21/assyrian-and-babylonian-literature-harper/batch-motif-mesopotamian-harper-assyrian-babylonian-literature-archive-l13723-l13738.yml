canonical_text:
  quote: ''
  summary: The passage records Shamashshumukin on the throne in Babylon and Ashurbanipal
    in Assyria. In Shamashshumukin's first year, Bel and the gods of Akkad leave Asshur
    and reach Babylon; the King of Kirbitu is captured; and Beleter is captured and
    killed in Babylon. A colophon notes revision from an original, identifies named
    persons connected with the table or tablet, and dates it at Babylon in the twenty-second
    year of Darius.
