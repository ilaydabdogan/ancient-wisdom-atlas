canonical_text:
  quote: ''
  summary: 'Tablet XII fragment: after returning from a long journey, Gilgamesh laments
    the loss of his friend Eabani. The lament lists actions Eabani no longer performs,
    says death powers and the netherworld have overtaken him, and repeats in the temple
    of Ningul that earth, rather than disease, demon, or battle, has snatched him
    away. Ningul weeps, and Gilgamesh then goes to E-kur, the temple of Bel/Marduk,
    and prays.'
  language: English
  quote_policy: summarized
