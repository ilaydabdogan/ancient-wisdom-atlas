canonical_text:
  quote: ''
  summary: A first-person royal inscription recounts tribute imposed on Nairi, a fourth
    campaign to Karduniash, crossings of rivers and mountains, city sieges, killings,
    deportations, seizure of possessions and gods, destruction by fire, the capture
    of Dur-Papsukal, and victory over Marduk-balatsu-iqbi and his allies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says troops of his land plundered sheep as tribute and that cities
    were destroyed, devastated, and burned with fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kings of Nairi are said to have had taxes and tribute imposed on them,
    including horses spanned to the yoke, by command of Ashur, Shamash, Ramman, and
    the gods called the narrator's protectors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator compares his action over the region from Qilar the great mountain
    to the Western Sea to Ramman the thunderer and says he poured out fear of his
    brilliancy over them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the fourth campaign, in the month Siwan on the fifteenth day, the narrator
    ordered a march to Karduniash, crossed the river Zaban, and passed over mountain
    slopes between Zaddi and Zaban.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator says he killed three fierce lions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After passing over Ebih, the narrator besieged Me-Turnat; the people are said
    to have been overwhelmed by the brilliancy of Ashur and Marduk, to have embraced
    his feet, and to have been brought forth with their possessions and gods and settled
    in his country.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The narrator crossed the river Turnat at high water and says he destroyed,
    devastated, and burned Karne, the royal city, with two hundred surrounding cities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator besieged Dibina; the terror of Ashur is said to have overwhelmed
    its people, and the narrator says he took people, possessions, and property away
    from the city.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Datebir and Izduia, beside Gananati, with two hundred surrounding cities,
    are said to have been captured; the narrator killed three hundred and thirty fighting
    men, carried away spoil, possessions, property, and gods, cut down parks, and
    burned cities with fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Those who had fled before the narrator's weapons entered Kiribti-alani; the
    narrator stormed and captured it, killed five hundred fighting men, carried away
    spoil, gods, oxen, and sheep, and burned the city.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: All Akkad, afraid of the narrator's weapons and attack, fled to Dur-Papsukal,
    a royal city of Bau-ahiddin described as situated in the river and in a mass of
    water; people from four hundred and forty-seven other cities entered it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The narrator captured Dur-Papsukal during the campaign, brought low thirteen
    thousand soldiers, made their blood flow along the chief street like water, piled
    corpses in heaps, and captured three thousand alive with his own hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The narrator carried away the royal couch and seat, palace treasure, palace
    women, possessions, property, gods, and palace necessities from Dur-Papsukal,
    distributed warrior booty to his troops, and destroyed and burned the city.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Marduk-balatsu-iqbi trusted in his troops, summoned Kaldu, Elam, Namri, and
    Arumu, and came against the narrator for war and battle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Marduk-balatsu-iqbi drew up his troops above the river Daban opposite Dur-Papsukal;
    the narrator fought him, brought about his overthrow, slaughtered five thousand
    people, took two thousand alive, and seized chariots, riding-horses, a royal tent,
    a bed, and camp baggage.
  category: action
  evidence_refs:
  - ev:7
