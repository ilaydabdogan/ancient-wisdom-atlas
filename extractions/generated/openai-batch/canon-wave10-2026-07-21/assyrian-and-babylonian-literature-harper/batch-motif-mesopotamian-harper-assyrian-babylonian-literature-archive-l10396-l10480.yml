canonical_text:
  quote: ''
  summary: The royal speaker describes rebuilding, raising, decorating, and furnishing
    temples, shrines, processional structures, and city works in Babylon and Borsippa.
    The passage names major temples and deities, including Marduk, Nabu, Nana, Sin,
    Shamash, Ramman, Gula, Nin-lil-an-na, Tur-e, and the Lady of the Mountain. It
    also describes a ship or ark used in a Zagmuku procession, a mountain-high festival-place,
    and defensive walls and waterworks begun by Nabopolassar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he rebuilt and restored the temples of Babylon and raised
    the turrets of E-temen-an-ki with burned brick and bright ugnu-stone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he selected cedar trees brought from Mount Lebanon for the
    roof of E-kua and decorated cedar roofing with gold and precious stones.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says he prayed every morning concerning the rebuilding of Esagila
    to the king of the gods, the lord of lords.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker says he beautified Borsippa, built Ezida, and completed it with
    silver, gold, precious stones, bronze, palm-wood, and cedar-wood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage describes decorated roofs, gates, wild-bulls, doors, lintels,
    bars, locks, paths, and shrine rooms associated with Nabu and Nana.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker says he rebuilt the shrines of Borsippa and raised the turrets
    of E-ur-VII-an-ki, described as the house of the seven spheres of heaven and earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The speaker decorated the ship or ark of the river Gan-ul, identified as a
    conveyance and as the ship of the Zagmuku procession.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: The speaker constructed E-sigisshe, an exalted festival-place of Marduk, mountain-high
    on the walls of Babylon, and the passage links it with merriment among the Igigi
    and Anunnaki.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The speaker built temples in Babylon and Borsippa for multiple named deities,
    with attributes such as giving the righteous sceptre, favoring forces, judging,
    granting abundance, protecting life, loving the speaker, and breaking enemy weapons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says Nabopolassar, identified as the speaker’s father and begetter,
    had begun large walls, a moat, banks, a canal wall, and a dike, but had not completed
    the works.
  category: sequence
  evidence_refs:
  - ev:5
