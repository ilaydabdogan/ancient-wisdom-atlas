  summary: The passage is a fragmentary English translation of oracles in favor of
    Esarhaddon. Named mouths from Arbela and Darahuia transmit assurances that the
    king should not fear, that enemies will be defeated, that deities will support
    and protect him, and that Ishtar of Arbela will grant him long days, enduring
    years, and a throne supported under the heavens.
