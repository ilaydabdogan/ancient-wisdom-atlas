canonical_text:
  quote: ''
  summary: Eabani asks Uchat to lead him to Erech, the sacred seat of Anu and Ishtar
    and the palace of Gilgamesh. In a broken portion, Eabani is said to intend to
    test Gilgamesh's strength while desiring his friendship. Uchat leads Eabani to
    Erech during a festival. A dream warning says Gilgamesh is stronger, divinely
    loved, and given wisdom. Gilgamesh also dreams, tells his mother of a vision of
    falling stars, and later fragments say his mother advises friendship with Eabani.
  language: English
  quote_policy: summarized
