canonical_text:
  quote: Father Nannar, lord of the moon-disk, brilliant one, chief of the gods!
  summary: A hymn addresses Father Nannar as lord of the moon-disk and chief of the
    gods. It praises him with images of a strong bull, a self-growing fruit, a merciful
    father and begetter, a founder of shrines and offerings, a bestower of sovereignty
    and sceptre, and a determiner of destinies. The hymn says he holds fire and water,
    rules all creatures, is exalted in heaven and earth, and that his command brings
    abundance, vegetation, herd increase, truth, and righteousness. Several lines
    are broken.
  language: English
  quote_policy: quoted
