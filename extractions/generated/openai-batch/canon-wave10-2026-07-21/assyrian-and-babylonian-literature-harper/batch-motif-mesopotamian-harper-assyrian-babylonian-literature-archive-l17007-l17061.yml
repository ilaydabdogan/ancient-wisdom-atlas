  quote: ''
  summary: 'The passage presents three translated Mesopotamian legal contracts concerning
    labor or craft obligations: a one-year labor hire with silver wages, a commission
    for a protective coat of mail, and a jewellers’ guarantee that an emerald will
    remain set in a gold ring for twenty years, with a silver penalty if it fails.'
  language: English
  quote_policy: summarized
