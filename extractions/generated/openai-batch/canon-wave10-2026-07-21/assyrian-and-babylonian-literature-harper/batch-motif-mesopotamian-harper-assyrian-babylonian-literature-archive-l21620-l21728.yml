canonical_text:
  quote: ''
  summary: Gilgamesh reaches the closed Waters of Death and is told that only Arad-Ea,
    the sailor of Per-napishtim, may help him cross. After Gilgamesh damages the objects
    called “those with stones,” Arad-Ea instructs him to make one hundred and twenty
    long oars or poles from wood. Gilgamesh prepares them, embarks with Arad-Ea, and
    they travel rapidly toward and upon the Waters of Death. Per-napishtim sees the
    approaching ship from afar and wonders about the smashed objects and the identity
    of the man arriving. Gilgamesh reaches the shore safely and begins to tell Per-napishtim
    his grief and previous adventures.
  language: English
  quote_policy: summarized
