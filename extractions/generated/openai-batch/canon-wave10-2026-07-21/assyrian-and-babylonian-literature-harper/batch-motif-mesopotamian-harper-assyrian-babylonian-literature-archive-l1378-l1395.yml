canonical_text:
  quote: ''
  summary: 'The passage describes an 1857 Royal Asiatic Society test of Assyriological
    translation: scholars were invited to independently translate cuneiform lines
    found by Layard on clay cylinders near Nineveh, submit sealed results, and have
    a commission compare the translations. Four submitted translations were opened
    on May 25, and their similarity was taken as confirmation of the translations''
    genuineness.'
