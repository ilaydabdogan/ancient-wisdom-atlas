  summary: A royal speaker describes plans and actions to restore ruined and barren
    lands, irrigate the country, regulate food supplies and prices, rebuild a neglected
    city with shrines and palaces, compensate landowners, pray and sacrifice to divine
    judges, receive divine orders, and mobilize workers for canal and city construction.
