canonical_text:
  quote: ''
  summary: Ashurbanipal recounts the downfall and submission of Tammaritu of Elam,
    famine among Akkadian rebels, the fiery destruction of Shamash-shum-ukin by the
    gods, the capture and punishment of fugitives, the removal of corpses and ritual
    restoration of Babylonian cities, renewed imposition of Assyrian rule and tribute,
    and the beginning of a campaign against Ummanaldash of Elam.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tammaritu of Elam is described as having spoken insolently about the beheading
    of Teumman and about Ummanigash kissing the ground before Ashurbanipal's messenger.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indabigash, identified as Tammaritu's servant, rebelled against him and brought
    about his defeat in battle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ashur and Ishtar are said to have punished Tammaritu for his reckless words,
    and Tammaritu, his family, and eighty-five princes fled before Indabigash to Nineveh.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tammaritu submitted to Ashurbanipal through gestures including kissing the
    royal feet, sweeping the ground with his beard, and throwing himself beneath the
    king's wheels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ashurbanipal states that he showed mercy to Tammaritu and placed him and the
    children of his father's house within the palace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Famine seized the people of Akkad who had sided with Shamash-shum-ukin, and
    the passage says they ate the flesh of their sons and daughters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Named deities who went before Ashurbanipal are said to have thrown Shamash-shum-ukin,
    called the hostile brother, into an abyss of burning fire and destroyed his life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Men associated with Shamash-shum-ukin fled from dagger, hunger, famine, and
    burning fire, seized refuge, and were overthrown by the net of the great gods
    so that none escaped.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ashurbanipal says that chariots, a state carriage, a canopy, wives, and palace
    property were brought before him.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ashurbanipal says he cut out the tongues of soldiers who had spoken insolence
    against Ashur and plotted evil against him, and that he killed them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ashurbanipal slew remaining living men by the bull-colossi where his grandfather
    Sennacherib had made a slaughter, presenting the act as a lamentation for him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Dogs, swine, vultures, eagles, birds of the heavens, and fish of the ocean
    are said to have eaten the cut-off flesh of the slain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ashurbanipal brought out and heaped bones and bodily remains from Babylon,
    Kutha, and Sippar, and the passage says streets and broad spaces had been choked
    or filled by remains.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: By priestly work Ashurbanipal purified shrines, cleansed defiled streets,
    pacified gods and goddesses with dirge and penitential prayers, and restored cultic
    observances.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ashurbanipal showed favor to surviving inhabitants of Babylon, Kutha, and
    Sippar, commanded that they should live, and made them dwell in Babylon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The men of Akkad, Kaldu, Aramu, and the sea-coast who had allied with Shamash-shum-ukin
    were subdued by command of the gods, placed under the yoke of Ashur, assigned
    governors, required to provide sacrifices, and taxed yearly.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: In the seventh campaign, in the month of Siwan, Ashurbanipal mustered troops
    against Ummanaldash of Elam and took Tammaritu with him.
  category: sequence
  evidence_refs:
  - ev:9
