canonical_text:
  quote: ''
  summary: A prayer asks Shamash for an oracle concerning whether enemy forces will
    capture Kishassu and whether Esarhaddon's forces will retake Dur-Bel from the
    Manni. The petitioner invokes a lamb used for vision, asks for favorable divine
    response, and requests that possible ritual impurities or blemishes not invalidate
    the divination.
  language: English
  quote_policy: summarized
