canonical_text:
  quote: ''
  summary: A sequence of Shurpu incantations uses the burning of an upuntu seed, the
    spinning and cutting of a ban-breaking thread, the extinguishing of fire and grain,
    and an address to the Fire-god to remove ban, sin, disease, and divine anger from
    a ritual subject.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An upuntu seed is burned in fire and described as not being sown, cultivated,
    rooted, grown, or exposed to the sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks that the ban not grow in the heart, take root on the back,
    or bear down on the breast.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Oath, ban, pain, misery, disease, sickness, trespass, misdeed, crime, sin,
    and disease in the body, flesh, and joints are requested to be burned like the
    seed and consumed by Flame.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker asks that the ban depart and that the speaker see the light.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Ishtar directs her temple-women, and a clever woman is set upon a couch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: White wool and black wool are spun into a double, beautiful, strong, many-colored
    thread that is said to break the ban in two.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The head, hands, and feet of the man are bound with the thread.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Marduk, called the princely son of Eridu, cuts the thread with his holy hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The thread of the ban is to be brought into the field to the holy place; the
    evil ban is to stand aside, and the man is to be pure and clean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: A high priest kindles fire and coals, casts in the lot, and identifies himself
    as the holy priest of Ea and the messenger of Marduk.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The priest puts out the coals, smothers the fire, and stamps out the heaped
    grain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Siris is asked to loose a knot that has been tied, and the knot of the heart
    of the man’s god and goddess is to be unloosed for him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The man’s sin is requested to be forgiven, destroyed from him, and loosed
    from him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Fire-god is addressed as warlike, and mountains, streams, the Tigris,
    the Euphrates, the broad sea, the street, a plant, and angry deities are asked
    to be at rest with him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The speaker asks that the heart-knot of the personal god and goddess be loosed,
    that the ban go forth from the body, and that the Fire-god pronounce judgment
    and determine the speaker’s career.
  category: speech
  evidence_refs:
  - ev:7
