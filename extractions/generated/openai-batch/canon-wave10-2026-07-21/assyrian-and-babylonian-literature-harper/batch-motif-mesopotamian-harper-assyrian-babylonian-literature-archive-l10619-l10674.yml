  summary: A royal speaker describes adorning and fortifying Babylon with precious
    materials, high walls, and battlements, then prays to Marduk as creator, divine
    patron of his sovereignty, and lord of Babylon. The speaker asks Marduk to favor
    his raised hands and prayers and identifies himself as the king and restorer of
    Marduk's cities.
