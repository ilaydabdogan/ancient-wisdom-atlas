  quote: ''
  summary: A ritual prescription directs the raising of a cedar staff before Shamash,
    the offering of an unblemished sheep, sprinklings and steps toward the slaughtered
    animal, preparation of meat with washing and salt, placement of portions on tables
    before Marduk and protecting deities, lighting or strewing of censers, prayer,
    prostration, clearing of tables, and pouring out of sesame wine.
  language: English
