  quote: ''
  summary: The fragment introduces the Legend of Zu, the Storm-Bird, under the heading
    of the theft of the Tablets of Destiny. Zu approaches Bel, sees Bel's divine insignia
    and the Tablets of Destiny, desires supremacy, declares that he will take the
    tablet and rule divine decrees, waits at the palace entrance at dawn, and seizes
    the Tablets after Bel washes, ascends his throne, and crowns himself.
