canonical_text:
  quote: ''
  summary: Artaxerxes identifies himself with royal titles and a genealogy tracing
    his descent through earlier kings to Achaemenian seed. He says that Darius, his
    great-great-grandfather, erected the Appadan building on a mountain, that fire
    destroyed it during his grandfather Artaxerxes' time, and that he rebuilt it under
    the protection of Ahura-mazda, Anahitu, and Mitri. He asks these deities to protect
    him from evil and preserve what he has done. A following fragment repeats partial
    royal and divine-protection formulas.
  language: English
  quote_policy: summarized
