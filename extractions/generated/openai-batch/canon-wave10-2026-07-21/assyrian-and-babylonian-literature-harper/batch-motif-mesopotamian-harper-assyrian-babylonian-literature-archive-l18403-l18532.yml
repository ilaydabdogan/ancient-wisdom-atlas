  quote: ''
  summary: The passage describes an armed divine opposition associated with Tiamat,
    Kingu’s elevation with command and the Tablets of Destiny, the failure of Anu
    and Nudimmud to face Tiamat, Marduk’s demand for supreme authority before serving
    as avenger, and the divine assembly’s banquet, transfer of rule, enthronement,
    and proclamation of Marduk’s absolute command.
  language: English
