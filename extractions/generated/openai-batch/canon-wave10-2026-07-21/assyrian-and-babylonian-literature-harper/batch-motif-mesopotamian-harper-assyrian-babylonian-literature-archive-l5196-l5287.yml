canonical_text:
  quote: ''
  summary: A royal inscriptional passage presents Tiglath-pileser I as a victorious
    Assyrian king aided by gods, armed with divine weapons, successful in campaigns
    and hunts, builder and restorer of temples and infrastructure, provider of abundance,
    planter of foreign trees and fruits, and legitimate descendant of named royal
    ancestors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he conducted many campaigns against enemies, used a war chariot
    on good terrain, pursued enemies on foot on bad roads, and prevented enemy inroads
    into his country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tiglath-pileser is described as a valiant hero holding an unrivaled sceptre
    and as perfect in battlefield deeds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ninib and Nergal are said to have presented the king with mighty weapons and
    a lofty bow.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Ninib's bidding, the king killed four powerful male wild oxen with bow,
    iron lance, and arrow, and brought their hides and horns to Asshur.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king killed ten male elephants, captured four elephants alive, and brought
    hides, tusks, and live elephants to Asshur.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Ninib's bidding, the king killed one hundred twenty lions on foot, slew
    eight hundred lions from his chariot, and laid low other beasts and birds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After overcoming enemies of Ashur, the king erected a temple to Ishtar of
    Asshur, temples to Martu and Bel-Dibbarra, renovated temples in Asshur, built
    their gateways, and led the great gods into them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king rebuilt royal palaces, city walls, storehouses, and granaries, filled
    granaries with grain, collected captured herds and wild animals, and sacrificed
    offspring yearly to Ashur.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king brought cedars, oaks, other foreign woods, and rare fruits from conquered
    lands and planted them in Assyrian parks and orchards.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The king increased chariots and yoked horses, enlarged Assyria, increased
    its people, enhanced national welfare, and made the people dwell in peaceful homes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage identifies Tiglath-pileser as son of Ashur-resh-ishi, grandson
    of Mutakkil-Nusku, and legitimate scion of Ashur-dan; Ashur is said to have called
    Mutakkil-Nusku to legitimate dominion over Assyria.
  category: relationship
  evidence_refs:
  - ev:10
