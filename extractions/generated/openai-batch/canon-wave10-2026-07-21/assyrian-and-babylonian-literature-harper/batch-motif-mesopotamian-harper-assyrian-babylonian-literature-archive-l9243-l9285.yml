canonical_text:
  quote: ''
  summary: A first-person Assyrian royal narrator describes divine radiance and royal
    fear overwhelming people near Elam, their submission to Assyria, the conquest
    and punitive treatment of Bit-Imbi, the capture and spoiling of Elamite persons,
    the flight of Elamite rulers to a mountain and distant waters, and the installation
    of Tammaritu in Susa before his later plotting against Assyrian troops.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: As the narrator approaches the land of Elam, the brilliancy of Ashur and Ishtar
    and fear of the narrator's majesty are said to overwhelm a group.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The overwhelmed group goes to Assyria with people, cattle, and sheep in order
    to become the narrator's servants and lays hold of his royal feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator conquers ancient Bit-Imbi, described as a royal city and fortress
    of Elam that blocked the way to Elam like a great wall and had been conquered
    earlier by Sennacherib.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator kills inhabitants of Bit-Imbi who do not come out to greet his
    majesty, beheads them, cuts off their lips, and takes them to Assyria as a spectacle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Imbappi, prefect of Bit-Imbi and son-in-law of Ummanaldash, is brought out
    alive, bound with iron fetters on hands and feet, and carried to Assyria.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The royal wife and son of Teumman and the remaining inhabitants of Bit-Imbi
    are brought forth and treated as spoil; Teumman is said to have been beheaded
    in a former campaign by the command of Ashur.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ummanaldash hears that the narrator's troops have entered Elam, abandons Madaktu,
    flees, and ascends his mountain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Umbahabua, who had taken the throne of Elam instead of Ummanaldash, abandons
    Bubilu and is compared to a fish taking to the bottom of distant waters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrator leads Tammaritu, who had fled and laid hold of his feet, into
    Susa and makes him king.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Tammaritu forgets the favor done to him, forms an evil plot to conquer the
    narrator's troops, and speaks in his heart about the people of Elam being subject
    to Assyria; the excerpt ends mid-sentence.
  category: speech
  evidence_refs:
  - ev:8
