canonical_text:
  quote: ''
  summary: A first-person speaker describes designing, building, waterproofing, provisioning,
    and boarding a large multi-level ship. He performs sacrifices and libations to
    the gods and Shamash. The ship is filled with possessions, precious metals, living
    creatures, family, relatives, animals, and people. Shamash appoints a time when
    destructive rain will come, instructing entry into the ship and shutting its door.
    The storm arrives with divine agents, black cloud, thunder, overflowing waters,
    and cosmic illumination by torches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person speaker collects what is necessary and draws the ship's design
    on the fifth day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ship is described as having sides ten gar high, a deck ten gar in extent,
    a front-roof, six stories making seven floors, and nine partitions in each interior
    division.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker cuts out water-beaks, selects a pole, smears pitch outside, uses
    asphalt inside to make the ship water-tight, and stores or uses oil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker slaughters oxen and lambs, pours libations of cider, oil, and
    sweet wine, makes a feast like New-Year's Day, and brings oil to Shamash.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After completion, the ship is set in water to two thirds of its height and
    filled with the speaker's possessions, silver, gold, and living creatures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker embarks family, relatives, cattle, beasts of the field, and the
    people described in the passage as upright.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Shamash appoints a time or sign: when rulers of darkness send destructive
    rain at eventide, the speaker is to enter the ship and shut its door.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the destructive rain comes, the speaker sees the storm, is afraid to
    witness it, enters the ship, shuts the door, and entrusts guidance of the ship
    to Purur-bel the boatman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At dawn a black cloud rises; Adad thunders within it; Nabu and Marduk go before;
    destroyers cross the land; Dibbara tears loose an anchor-cable; Ninib causes banks
    to overflow; the Anunnaki lift torches; and Adad's storm reaches toward the heavens.
  category: sequence
  evidence_refs:
  - ev:5
