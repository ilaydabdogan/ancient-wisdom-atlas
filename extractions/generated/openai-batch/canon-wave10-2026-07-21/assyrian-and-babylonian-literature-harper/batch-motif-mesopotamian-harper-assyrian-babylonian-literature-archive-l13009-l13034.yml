canonical_text:
  quote: ''
  summary: The inscription praises Ahura-mazda as chief over the gods and creator
    of heaven, earth, mankind, and Darius. It says Ahura-mazda granted Darius sovereignty
    over a broad earth of many countries, lands, tongues, mountains, plains, seas,
    and deserts. Darius states that under Ahura-mazda's protection the countries obey
    his commands and muster, and he asks Ahura-mazda together with all the gods to
    protect him and his rule.
  language: English
