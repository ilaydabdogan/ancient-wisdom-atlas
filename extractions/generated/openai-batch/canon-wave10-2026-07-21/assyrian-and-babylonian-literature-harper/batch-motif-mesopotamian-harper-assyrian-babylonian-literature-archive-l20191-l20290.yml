canonical_text:
  quote: ''
  summary: A serpent refuses to release a punished eagle, mutilates it, and casts
    it into a pit. Etana, whose wife cannot bear a son, petitions Shamash for revelation
    and the Plant of Birth. Shamash directs him across a mountain to the eagle. Etana
    brings a young bird to the eagle and asks for the Plant of Birth. The eagle later
    carries Etana upward toward heaven; they worship at divine gates, encounter a
    throne with lions, and continue ascending until the land and sea appear diminished
    below.
  language: English
  quote_policy: summarized
