canonical_text:
  quote: ''
  summary: The passage first records tribute from Jehu to the Black Obelisk inscription
    of Shalmaneser II. It then begins an inscription of Shamshi-Ramman addressed to
    Ninib, praising Ninib with cosmic, martial, luminous, and genealogical epithets.
    Shamshi-Ramman presents himself with royal, priestly, temple-restoring, and dynastic
    titles. The passage recounts Ashurdaninpal's rebellion, the alienation of twenty-seven
    fortified cities from Shalmaneser, and Shamshi-Ramman's subjugation of them by
    command of the great gods, before beginning the account of a first campaign to
    Nairi.
  language: English
  quote_policy: summarized
