canonical_text:
  quote: "“a far road he travels unto Humbaba.”"
  summary: A fragmentary and partly reconstructed section of Tablet IV describes preparations
    for Gilgamesh and Eabani’s expedition against Humbaba. Eabani petitions a high
    god, Gilgamesh directs Eabani to an all-knowing queen or prophetess, offerings
    and prayer are made before Shamash, forces arm themselves, the two friends depart,
    and the cedar wood is said to have been made terrifying so that it remains intact.
