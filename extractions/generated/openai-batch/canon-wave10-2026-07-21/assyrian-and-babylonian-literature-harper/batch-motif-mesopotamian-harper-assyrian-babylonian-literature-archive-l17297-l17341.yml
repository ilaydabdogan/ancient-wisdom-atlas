canonical_text:
  quote: ''
  summary: The passage gives two Babylonian legal contract translations concerning
    power of attorney. In the first, Itti-Nabu-balatu acts in business for his brother
    Bel-kishir and must deliver Bel-kishir’s share and profits to him. In the second,
    an empowered attorney is involved in payment of eighteen shekels of rent, which
    Bel-akhi-iddin is to deposit in the treasury of the Temple of Sharru, where temple
    personnel receive it for the divinity. The passage also includes editorial and
    footnote material explaining legal wording related to acting “by the hand of”
    another.
  language: English
  quote_policy: summarized
