canonical_text:
  quote: ''
  summary: The passage is a prayer to Nergal. It praises Nergal's lineage, rank among
    the gods, martial role, status in the heavens and the Under World, associations
    with Ea, Sin, and Bel, and dominion over peoples and living creatures. A placeholder
    supplicant identifies as Nergal's servant, describes affliction and destruction
    in his house, and asks for favor, mercy, calming of divine anger, absolution from
    sin and iniquity, and permission to proclaim Nergal's greatness.
  language: English
  quote_policy: summarized
