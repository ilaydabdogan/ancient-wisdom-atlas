canonical_text:
  quote: ''
  summary: The passage presents a royal speaker protected by Ashur and Shamash, descended
    from earlier rulers, and called by Ashur to rule Assyria. Ashur gives him a weapon,
    a crown, and orders to subdue enemies. In the first year of rule the speaker campaigns
    through Simesi and Aridi, captures Aridi, kills warriors, takes spoil, erects
    a pyramid of heads, burns captives, receives tribute, cuts through difficult mountain
    roads, burns Hupushkia and neighboring cities, and causes Kakia of Nairi to flee
    into mountains.
  language: English
  quote_policy: summarized
