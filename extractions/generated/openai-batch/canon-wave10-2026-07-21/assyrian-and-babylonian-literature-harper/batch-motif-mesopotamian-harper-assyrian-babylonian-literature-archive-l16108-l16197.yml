canonical_text:
  quote: ''
  summary: 'Two Assyrian and Babylonian letters report political and military affairs
    involving Elam: a proposed secret use of a royal signet to secure Nabu-bel-shumate’s
    capture, disputes over tax corn and provisions, Bel-ibni’s invocation of deities
    for the king, raids into Elam, local submission to Assyria, and an Elamite revolt
    with opposing forces camped by a river.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker reports that a person entered Madaktu, gathered partisans, and reminded
    them that he had wanted to seize Nabu-bel-shumate and hand him over to the King
    of Assyria to avoid Assyrian troops being sent against them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sender asks to convey the royal signet secretly to Ummakhaldash in connection
    with the capture of Nabu-bel-shumate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sender warns that an openly arriving royal messenger with a troop escort
    would alert Nabu-bel-shumate, allowing him to pay a ransom to nobles and buy himself
    off.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sender says that, if the king’s gods bestirred themselves, Nabu-bel-shumate
    could be caught with his bow unstrung and sent to the king.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tax corn in Elam is described as being collected, placed in the charge of
    the sharnuppu, and used for sustenance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nabu-bel-shumate and Nishkur-bel seize sharnuppu officials and accuse them
    of having caused famine in their household by withholding provisions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bel-ibni addresses the king as his lord and invokes Ashur, Shamash, and Marduk
    to grant the king health, length of days, and a long reign.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bel-ibni sent five hundred soldiers to Sabdanu with orders to establish a
    post, raid into Elam, kill, and take prisoners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Irgidu, the soldiers killed named elites and citizens and took one hundred
    and fifty prisoners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The authorities of Lakhiru and the people of Nugu, alarmed by the troops behind
    them, negotiated with Mushezib-Marduk and pledged to become subjects of the King
    of Assyria.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A report from Elam says Ummanigash revolted against Ummakhaldash, people from
    the river Khudkhud to Kha'adanu sided with him, and opposing forces camped on
    opposite river banks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Iqisha-aplu is described as well informed about the Elamite situation and
    available to be questioned at the palace.
  category: attribute
  evidence_refs:
  - ev:7
