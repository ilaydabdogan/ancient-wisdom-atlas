canonical_text:
  quote: ''
  summary: Gilgamesh sleeps for six days and seven nights. Per-napishtim and his wife
    discuss restoring him through charm-root or magic food, which is prepared in seven
    stages and leads to a sudden transformation. Gilgamesh then laments the presence
    of death and a demon who has seized his friend. Per-napishtim orders Arad-Ea the
    ferryman to take Gilgamesh to a place of purification, where his sores are washed
    in water, his diseased skin is cast off and carried away by the sea, and his healthy
    appearance and headgear are restored.
  language: English
  quote_policy: summarized
