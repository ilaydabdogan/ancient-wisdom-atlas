canonical_text:
  quote: ''
  summary: The passage contains several Assyrian and Babylonian letters with editorial
    notes. Nabu-shum-iddina writes to a prince about rites at Calah for Nabu, including
    consecration of Nabu's couch, the god's entry into a bedchamber, a return, a procession
    to a grove, sacrifices, and offerings that permit entry to Nabu's house. Other
    letters invoke deities for blessing, prosperity, and health. A final letter from
    the astrologer Nabu'a reports that a fox entered the city, fell into a well in
    the grove of Ashur, was removed, and was killed, within an editorial context about
    omen interpretation.
  language: English
  quote_policy: summarized
