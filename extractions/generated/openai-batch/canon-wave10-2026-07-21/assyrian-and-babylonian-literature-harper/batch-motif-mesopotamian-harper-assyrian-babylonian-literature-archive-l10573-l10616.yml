canonical_text:
  quote: with bitumen and burned brick I raised it mountain-high
  summary: 'A first-person royal speaker describes rebuilding and enlarging a palace
    and protective works in Babylon: laying foundations at water and earth-depth,
    raising walls and turrets, installing cedar and metal fittings, storing royal
    treasure and insignia, respecting Marduk''s sacred urban features, and completing
    construction on an auspicious date.'
