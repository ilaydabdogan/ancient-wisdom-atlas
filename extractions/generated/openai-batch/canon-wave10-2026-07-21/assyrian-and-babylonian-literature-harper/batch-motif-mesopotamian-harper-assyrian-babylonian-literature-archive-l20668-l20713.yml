canonical_text:
  quote: For six days and seven nights Eabani enjoyed the love of Uchat.
  summary: Uchat sexually approaches Eabani as instructed. After their prolonged encounter,
    the gazelles and cattle of the field turn away from him, and his body becomes
    weaker and less agile. Uchat then addresses him, says he shall be like a god,
    urges him to leave the beasts, and offers to take him to strong-walled Erech,
    the dwelling of Anu and Ishtar and palace of Gilgamesh. Eabani listens and desires
    a friend. An editorial footnote notes a parallel to Genesis 3:5.
  language: English
  quote_policy: quoted
