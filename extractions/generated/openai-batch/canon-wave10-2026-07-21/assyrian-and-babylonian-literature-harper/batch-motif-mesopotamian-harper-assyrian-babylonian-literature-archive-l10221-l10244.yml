canonical_text:
  quote: ''
  summary: Nabopolassar, king of Babylon, states that he acts under the guidance of
    Nabu and Marduk. Marduk commissions him to restore cities and repair temples.
    Because the Euphrates had receded from Sippar and its waters were distant, Nabopolassar
    digs the river back to Sippar, provides abundant pure water for Shamash, and builds
    riverbank and protective walls.
