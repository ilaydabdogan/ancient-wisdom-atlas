canonical_text:
  quote: ''
  summary: The passage gives a Babylonian legal instrument under the heading “Bankruptcy.”
    It records a loan of money, property connected with the debt, payment through
    an agent, transfer or custody of receipts and certificates, and the anticipated
    receipt of a seal of possession from the royal scribal process. It is dated at
    Babylon in the second year of Evil-Merodach, with an editorial note explaining
    it as a case in which creditor interests were protected in the sale of mortgaged
    property.
  language: English
  quote_policy: summarized
