canonical_text:
  quote: ''
  summary: The passage contains legal material on inheritance. One portion refers
    to duplicate tablets and a diagram clarifying division of an estate, including
    houses, streets, and an inalienable right of exit. A second contract, dated to
    the second year of Nabonidus, records Gugua assigning money, loans, a field, and
    dowry property chiefly to her eldest son Ea-zir-ibni, while apportioning money
    to younger sons. The eldest son is obligated to support his mother during her
    lifetime, and she guarantees not to alienate his inheritance or create debt against
    him.
  language: English
  quote_policy: summarized
