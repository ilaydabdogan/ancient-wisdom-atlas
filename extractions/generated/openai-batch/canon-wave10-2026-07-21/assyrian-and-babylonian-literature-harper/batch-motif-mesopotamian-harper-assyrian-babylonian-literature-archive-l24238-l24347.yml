canonical_text:
  quote: ''
  summary: The passage lists possible sources of a ban, including living and dead
    persons and named divine pairs. It then gives incantations in which an evil curse,
    ban, and disease afflict a man. Marduk consults his father Ea, who instructs him
    to bring the man to a house of pure libations and release the ban. The ban and
    diseases are to be removed by analogy with an onion, a date, and a husk, with
    the onion and date thrown into fire and consumed.
  language: English
  quote_policy: summarized
