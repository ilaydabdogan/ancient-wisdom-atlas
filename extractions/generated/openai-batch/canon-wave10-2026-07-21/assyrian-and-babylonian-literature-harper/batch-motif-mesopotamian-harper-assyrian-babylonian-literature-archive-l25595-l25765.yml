  summary: A sequence of damaged oracles addresses Esarhaddon, king of Assyria, promising
    support, protection, safe passage, defeat of enemies, long rule, dominion, and
    dynastic continuity. Several oracle units name Ishtar of Arbela or the lady of
    Arbela, address the king and his mother, and identify named human transmitters
    from whose mouths the oracles are delivered.
