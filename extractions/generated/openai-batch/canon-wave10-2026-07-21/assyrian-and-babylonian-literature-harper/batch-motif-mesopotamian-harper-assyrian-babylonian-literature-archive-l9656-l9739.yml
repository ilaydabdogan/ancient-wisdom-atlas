canonical_text:
  quote: ''
  summary: The first-person royal speaker recounts Abiyate's revolt with Natnu, invokes
    the command and protection of major gods, and describes a military march through
    rivers, mountains, forests, and arid wilderness. The campaign defeats and plunders
    tent-dwelling groups, captures Abiyate and Ayamu alive, chains them, cuts off
    fugitives from water sources, and carries people and animals to Assyria as spoil.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Abiyate, son of Teri, is described as disregarding kindness and the oath of
    the great gods, forming revolt plans against the royal speaker, and joining Natnu,
    King of Nabataea, for an attack on the border.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The royal speaker says he mustered his troops and directed a march against
    Abiyate by command of a list of deities including Ashur, Sin, Shamash, Ramman,
    Bel, Nabu, Ishtar, Ninib, Nergal, and Nusku.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The troops crossed the Tigris and Euphrates in flood, marched on distant paths,
    climbed high mountains, passed through dense forests and brambles, and remained
    uninjured.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The land of Mash is described as a region of thirst and starvation where birds
    do not fly and wild asses and gazelles do not pasture.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near Laribda, by water cisterns, the royal speaker pitched camp, the troops
    provisioned themselves with water, and they continued through a thirsty region
    toward Hurarina.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Between Yarku and Azalla, the royal speaker says he defeated the Isami, tent-dwellers
    of Atarsamain and Nabataea, and carried off men, asses, camels, and sheep as plunder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The royal speaker surrounded tent-dwellers of Atarsamain and Kedarenes of
    Uaite, captured their gods, kin, population, and animals, and set them on the
    road to Damascus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Hukkurina, an impassable mountain, the royal speaker defeated the tent-dwellers
    of Abiyate; Abiyate and Ayamu were captured alive in battle and placed in iron
    chains on hands and feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fugitives fled to an impassable mountain for refuge; the royal speaker set
    watches over cisterns and springs and cut off the water necessary to their lives,
    allowing only occasional drinking.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some fugitives died of thirst, others drank camel blood and entrail water,
    and the remaining people and livestock in the refuge were captured and carried
    to Assyria.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The royal speaker says the land had been given to him by Ashur, and he distributed
    captured camels among the people of Assyria.
  category: speech
  evidence_refs:
  - ev:7
