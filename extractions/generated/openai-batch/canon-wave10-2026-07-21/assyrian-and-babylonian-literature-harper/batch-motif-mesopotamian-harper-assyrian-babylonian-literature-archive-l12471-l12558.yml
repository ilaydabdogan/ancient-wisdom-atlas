  summary: The passage from the Large Inscription of Darius recounts Median and Armenian
    rebellions, Darius sending servant-commanders to suppress them, repeated battles
    at named places, claims of Ahura-mazda's aid and protection, casualty and captive
    counts, and Darius's own advance toward Media against Fravartish.
