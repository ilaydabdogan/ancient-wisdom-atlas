canonical_text:
  quote: ''
  summary: A lunar omen passage states that disappearance of the Moon portends evil
    for the land, that disappearance outside its reckoning indicates an eclipse, and
    that a solar halo on the day of lunar disappearance predicts an eclipse of the
    Moon's left side. A watch for the eclipse is reported in Kislev, and Irasshi-ilu
    addresses the king as his servant.
