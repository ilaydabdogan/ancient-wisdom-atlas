canonical_text:
  quote: ''
  summary: A fragmentary historical inscription recounts Assyrian victories over Karduniash,
    capture of cities, deportation of persons and treasures, removal of gods as spoil,
    offerings at Kutha, Babylon, and Borsippa, receipt of tribute, boundary settlement,
    return of captives, temple tribute, and instructions for a later prince to add
    royal deeds to an eternal tablet.
  language: English
  quote_policy: summarized
