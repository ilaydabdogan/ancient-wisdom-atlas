canonical_text:
  quote: ''
  summary: The king addresses Marduk in prayer, presents himself as a favored ruler,
    asks for prolonged life and the ability to complete restorations, and describes
    making divine garments, a golden chair, temple doors, gates, and other cultic
    fittings. He recounts annual festival offerings, gifts of precious metals and
    soldiers to major gods, travel to several cities with offerings for other deities,
    and a divine commission from Marduk to repair shrines, reconcile enraged gods,
    and restore their residences, including a ruined temple in Harran.
  language: English
  quote_policy: summarized
