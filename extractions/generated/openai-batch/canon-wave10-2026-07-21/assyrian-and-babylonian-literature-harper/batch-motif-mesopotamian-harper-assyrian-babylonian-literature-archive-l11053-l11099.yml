canonical_text:
  quote: ''
  summary: Nebuchadrezzar II identifies himself as king, son of Nabopolassar, and
    restorer of Esagila and Ezida. He says Marduk created and commissioned him for
    restorations, Nabu gave him a righteous sceptre, and he rebuilt or adorned major
    temples and temple-towers. He then prays to Nabu for favor, long life, offspring,
    a firm throne, an enduring reign, and victory over foes.
  language: English
  quote_policy: summarized
