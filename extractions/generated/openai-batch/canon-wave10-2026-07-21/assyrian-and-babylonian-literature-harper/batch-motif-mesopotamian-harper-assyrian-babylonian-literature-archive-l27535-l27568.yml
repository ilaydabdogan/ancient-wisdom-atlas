  text: The passage is framed as reports of magicians and astrologers concerning the
    Moon appearing on the thirtieth day.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Moon appears on the thirtieth of Nisan, the report says Subartu Ahlamu
    will devour, a foreign tongue will gain ascendancy in Aharru, and there will be
    cold in the land.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Moon is said to have appeared without the Sun on the fourteenth of Tebet,
    with similar statements about the fourteenth and the Moon completing the day in
    Shebat, Adar, and Nisan.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the Moon appears on the thirtieth of Sivan, the report links it with
    devouring associated with Aharru Ahlamu, cold, or the clamour of the enemy in
    the land.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the Moon appears low, the report gives outcomes of enemy seizure of the
    land, or submission of a far country to the king, or a messenger coming.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the Moon appears on the thirtieth of Ab, the report says there will be
    a devastation of Akkad.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tabia asks the king not to leave him, says he begs daily because of hunger,
