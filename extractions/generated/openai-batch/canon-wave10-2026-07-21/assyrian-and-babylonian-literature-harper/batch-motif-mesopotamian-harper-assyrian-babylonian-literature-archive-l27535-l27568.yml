  summary: A section of omen reports states conditions under which the Moon appears
    on named calendar days or without the Sun, and connects those observations with
    forecasts of foreign ascendancy, cold, enemy action, submission or a messenger
    to the king, devastation of Akkad, and a petition from Tabia to the king.
  language: English
  quote_policy: summarized
