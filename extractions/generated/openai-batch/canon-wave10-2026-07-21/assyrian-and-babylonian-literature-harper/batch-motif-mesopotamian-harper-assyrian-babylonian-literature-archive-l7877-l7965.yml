canonical_text:
  quote: ''
  summary: A royal speaker in Cylinder A of Esarhaddon recounts defeating enemies,
    receiving submission from rulers, returning captured gods after inscribing them
    with Ashur’s power and his own name, installing or confirming client rulers, imposing
    tribute, and marching through distant hostile landscapes where earlier kings had
    not gone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker claims to have trodden down Barnaki, scattered the inhabitants
    of Minni and the qutu, and subdued the armies of Ishpaka of Ashguza with the sword.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker drove away Nabu-zer-napishti-lishir; Naid-Marduk fled from Elam
    to Nineveh, kissed the speaker’s feet, and received the Sea-land dominion of his
    brother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker bound Shamash-ibni of Bit-Dakkuri and returned fields to the Babylonians
    and Borsippans because he knew the fear of Bel and Nabu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker placed Nabu-shallim, son of Balasu, on a throne and made him tributary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sennacherib had captured Adumu and carried away its gods; Haza’ilu, King of
    Aribi, came to Nineveh with a heavy present, kissed the speaker’s feet, and asked
    for the return of his gods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker repaired the injuries of the gods of Aribi, caused the power of
    Ashur and the writing of his own name to be written upon them, and gave them back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker appointed Tabua, who had been reared in his palace, to sovereignty
    and returned her to her land with her gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After fate carried Haza’ilu away, the speaker placed Yailu, Haza’ilu’s son,
    on his throne and imposed additional tribute.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bazu is described as distant, low, desert, and barren, with swampy land, thorns,
    stones, snakes, scorpions, and a mountain of stone; the speaker marched there
    by Ashur’s command where no earlier king had gone.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Bazu the speaker killed eight kings and carried away their gods, property,
    possessions, and people into Assyria.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Lale, King of Yadi, came to Nineveh, kissed the speaker’s feet, received back
    gods inscribed with Ashur’s power, was entrusted with Bazi, and was assigned taxes
    and tribute.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Beliqisha of Gambul is described as dwelling like a fish in water and marshes;
    terror struck him by Ashur’s command, and he brought tribute and kissed the speaker’s
    feet.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Patusharra is described as lying among the far-off Medes near Bikni, a mountain
    of alabaster stone, in territory no earlier royal ancestors had trodden; Shidirparna
    and Eparna with people, animals, and spoil were carried to Assyria.
  category: sequence
  evidence_refs:
  - ev:9
