canonical_text:
  quote: ''
  summary: The passage first presents a prayer in which a named petitioner offers
    ritual items, fragrance, and mead, asks the addressed deity for favor, acceptance,
    prosperity, absolution, and good fortune. It then presents a prayer-oracle to
    Shamash, asking whether named enemies will capture the city Kishassu during a
    specified one-hundred-day-and-night ritual period, and instructing the god not
    to consider various irrelevant or contaminating conditions in the divination procedure.
  language: English
  quote_policy: summarized
