canonical_text:
  quote: ''
  summary: The passage describes Esarhaddon completing and dedicating a palace with
    protective materials, engravings, a park, a watering place, divine invitations,
    sacrifices, feasting, prayers for prosperity, storage of tribute and military
    goods, and guardian colossi. It then instructs future kings to repair the palace
    and preserve the inscription with offerings. A following inscription presents
    Esarhaddon's titles and recounts Babylonian insurrection, Marduk's anger, a flood-like
    destruction of Babylon, divine ascent to heaven, enslavement of the people, Marduk's
    appeasement, and Esarhaddon's command to reinhabit and restore the city.
  language: English
  quote_policy: summarized
