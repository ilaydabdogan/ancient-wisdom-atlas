canonical_text:
  quote: And give a true and righteous judgment.
  summary: A ritual instruction directs water to be shaken upon oil and notes the
    condition of three gab, probably liver parts. The seer is to set himself before
    Shamash and Ramman on the judgment seat and render true judgment. Shamash and
    Ramman, as lords of oracle and decision, stand for him, make a decision, and answer.
    Before sunrise, censers and tables with offerings are arranged before named deities.
  language: English
  quote_policy: quoted
