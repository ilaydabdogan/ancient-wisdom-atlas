  quote: ''
  summary: The passage introduces fragments and translated lines from the Babylonian
    creation account. Apsu, Tiamat, and Mummu oppose the creation of light and plan
    darkness; Tiamat leads a revolt, creates terrifying monster beings including serpents
    and a dragon, elevates Kingu as war leader and ruler, gives him the Tablets of
    Destiny, and the situation is then reported to An-shar.
  language: English
  quote_policy: summarized
