  quote: ''
  summary: A broken opening fragment mentions a cry to a god, a night vision or dream
    involving lions, and an armed attack with axe and sword. The following column
    is summarized and excerpted as Gilgamesh’s arrival at Mount Mashu, whose gate
    is guarded by scorpion-men. The mountain reaches toward heaven and down to Aralu.
    The scorpion-men guard the gate and the sun; Gilgamesh is terrified, and the scorpion-man
    and his wife identify him as partly divine and partly human, noting a divine order
    and his long journey.
