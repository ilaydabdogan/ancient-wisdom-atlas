canonical_text:
  quote: ''
  summary: 'Tablet XI continues the dialogue between Gilgamesh and Per-napishtim.
    Gilgamesh asks how Per-napishtim obtained eternal life among the gods. Per-napishtim
    begins revealing the secret story of the gods: Shurippak on the Euphrates was
    corrupt, the great gods decided to bring a deluge, and Ea disclosed the plan through
    a reed-hut, instructing the man of Shurippak to build a ship and preserve living
    seed of every kind.'
  language: English
  quote_policy: summarized
