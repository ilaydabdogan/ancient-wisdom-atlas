canonical_text:
  quote: ''
  summary: 'The passage contains portions of penitential psalms: an appeal that a
    divine heart become glad like a parent’s heart, a colophon identifying the tablet,
    a lament to a mistress over enemy devastation of her land and the speaker’s suffering,
    a prayer to a restless lord for pacification, a priestly intercession invoking
    earth spirits and a personal god, and a concluding litany addressed to several
    deities.'
  language: English
  quote_policy: summarized
