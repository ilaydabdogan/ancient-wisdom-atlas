  summary: The passage closes a curse invoking several gods to bring ruin, violent
    death, sorrow, and extinction of descendants upon an unnamed male target. It then
    begins the inscription of Tiglath-pileser I, invoking major gods, describing their
    powers, and presenting Tiglath-pileser as divinely crowned, granted dominion,
    and armed for conquest.
  language: English
