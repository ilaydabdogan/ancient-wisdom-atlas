literal_observations:
- id: obs:1
  text: Shumalia is described as mistress of snow-capped mountains who dwells on summits
    and traverses peaks; other named gods are invoked with her to meditate evil against
    an unnamed male target.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A curse asks that another person acquire the house the target has built.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The target is described with a dagger in his neck and an unclear object or
    injury in his eyes, prostrating himself before a captor who cuts off his life
    despite pleading.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Further curses describe the target's house being overturned, his hands rolling
    in mire, sorrow following him through life, and his seed being blotted out as
    long as heaven and earth stand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tiglath-pileser inscription invokes Ashur, Bel, Sin, Shamash, Adad, Ninib,
    Ishtar, and the great gods with stated qualities or powers.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: The great gods are said to have enlarged Tiglath-pileser's dominion, called
    him, crowned his head, appointed him over the country of Bel, and granted him
    supremacy, majesty, and valour.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: Tiglath-pileser is styled as a powerful king, king of the four quarters of
    the world, legitimate shepherd, lofty judge, conqueror of distant lands, brilliant
    day, and destroying flame.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:8
  text: A pure sceptre is said to have been given to Tiglath-pileser in the name of
    Shamash, and Ashur is said to have sharpened his weapons and proclaimed his name
    forever.
  category: relationship
  evidence_refs:
  - ev:8
