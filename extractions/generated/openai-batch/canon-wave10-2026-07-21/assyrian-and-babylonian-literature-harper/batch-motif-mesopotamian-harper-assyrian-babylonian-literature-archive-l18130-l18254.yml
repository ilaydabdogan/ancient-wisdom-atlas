canonical_text:
  quote: ''
  summary: An-shar sends Anu against Tiamat, but Anu flees when he sees her. After
    another unsuccessful appeal, Marduk volunteers to conquer Tiamat if the gods assemble
    and grant him supreme, irrevocable authority. An-shar sends Gaga to summon Luchmu,
    Lachamu, and the gods to feast and decree fate. Gaga's message describes Tiamat
    as a hostile mother of the deep who gathers gods to her side and creates monster-serpents
    and vipers as weapons.
  language: English
  quote_policy: summarized
