  quote: ''
  summary: A royal inscription passage narrates Tiglath-Pileser III’s conquests, annexations,
    city foundation, ritual sacrifices, divine favor toward his priesthood, deportations,
    sieges, punishment of oath breakers, destruction by fire and flood/cyclone imagery,
    and receipt of tribute. The range ends with a caption for a sculptured slab depicting
    an assault of a city.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person ruler says he conquered many named peoples and Arameans in
    the valleys of the Tigris, Euphrates, and Surappi, killed their warriors, carried
    away spoil, added the Arameans to Assyria, and set a military governor over them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On Tel-Kamri, also called Humut, the ruler says he built a city named Kar-Ashur
    and placed inhabitants from conquered lands in it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In several major cities the ruler says he offered pure sacrifices to Bel,
    Jarpanit, Nabu, Tashmetu, Nergal, and Laz, and that the great gods looked with
    love upon his priesthood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ruler says he took possession of Karduniash throughout its extent and
    exercised kingship over it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ruler says he overthrew the Puqudu as with a net, killed their warriors,
    carried away spoil, added their lands and border cities to Assyria, and placed
    them under administration from Arrapha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ruler says he carried away the Kaldudu and settled them in Assyria, and
    overthrew Chaldea as with a bird-net.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ruler says he killed Nabushabshi’s warriors near Sarrabanu, impaled Nabushabshi
    before the city gate, captured Sarrabanu by earthworks and battering-engines,
    deported inhabitants with possessions and gods, and destroyed and burned the city.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ruler says he captured Tarbagu and Yaballu, carried away thirty thousand
    inhabitants with possessions and gods, and destroyed the cities so that they were
    like a ruin of the flood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Zaqiru son of Sha'alli is said to have violated compacts sworn by the great
    gods, allied with the ruler’s enemies, and then been captured with his great men,
    put in iron chains, and taken to Assyria.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The inhabitants of Bit-Sha'alli are said to have occupied Dur-ilu Illat-ai
    as a fortress; the ruler says he captured that city by mines and battering-engines,
    razed it, and deported inhabitants with goods, family members, and gods.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The ruler says he swept over Bit-Sha'alli like a cyclone, laid waste its dwellings,
    and added those lands to Assyria.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The ruler says he shut up Ukin-zir in Sapia, killed warriors before its gate,
    cut down nearby palm-groves, left no tree standing, destroyed date-palms and fruit,
    burned cities with fire, devastated three lands like a ruin of the flood, reduced
    them to mounds and plough-land, and received tribute from Balasu and Nadin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A caption identifies an assault of a city by Tiglath-Pileser II (III) as depicted
    on a sculptured slab from the ruins of his palace at Nimrud, ancient Calah.
  category: other
  evidence_refs:
  - ev:9
