literal_observations:
- id: obs:1
  text: Smith died at Aleppo on his homeward journey after contracting a fever in
    Baghdad, and his chief work involved examining palaces in Kouyunjik, especially
    the Northwest palace discovered by Rassam.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rassam continued Smith's work and made three expeditions between 1877 and
    1881.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rassam's first expedition uncovered another palace of Ashurnagirpal at Nimrud
    and found the Bronze Gates of Shalmaneser II.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Rassam visited the palaces of Sennacherib and Ashurbanipal at Kouyunjik and
    brought back about fourteen hundred tablets and the ten-column cylinder of Ashurbanipal
    known as the Rassam cylinder.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: On Rassam's second expedition to Babylon, he brought back Egibi tablets, contracts,
    and inscriptions of Nebuchadrezzar, Nabonidus, and Cyrus.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: During Rassam's last trip, the most important discovery was the Temple of
    the Sun at Abu-Habba, identified with Sephervaim and Sippara; the site was found
    accidentally while he was seeking another mound.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: Ernest de Sarzec excavated at Tello, identified as Shirpurla or Lagash, and
    the finds were mostly described as non-Semitic and placed in the Louvre.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Catherine Wolfe expedition to Babylonia, directed by Dr. William Hayes
    Ward, aimed to explore and describe sites rather than excavate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ward identified Anbar with several ancient and later names, recommended several
