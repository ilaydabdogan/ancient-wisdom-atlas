  summary: The passage is an introductory historical account of late nineteenth-century
    archaeological exploration connected with Assyrian, Babylonian, Elamite, and Egyptian
    sites. It describes expeditions and finds by Smith, Rassam, de Sarzec, Ward, Dieulafoy,
    and others, including palaces, gates, tablets, cylinders, inscriptions, temple
    sites, museum collections, and the Tel-el-Amarna tablet discovery.
  language: English
