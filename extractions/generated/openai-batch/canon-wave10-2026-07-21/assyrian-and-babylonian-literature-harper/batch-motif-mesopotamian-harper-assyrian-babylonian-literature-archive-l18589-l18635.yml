canonical_text:
  quote: ''
  summary: Bel/Marduk gathers winds, including seven destructive winds, using a net
    given by Anu. He arms himself with the storm, mounts a terrifying chariot drawn
    by four fiery steeds, and advances toward Tiamat. The gods admire him. He approaches
    to fight Tiamat and capture Kingu, Tiamat's spouse. Kingu and his helpers become
    frightened, while Tiamat stands her ground and taunts Bel.
