canonical_text:
  quote: ''
  summary: The passage closes an inscription of Agumkakrime with temple dedication,
    offerings to Marduk and gods in Esagila, assignment or release of temple personnel
    and estates, and a series of divine blessing petitions for Agum. It then gives
    an Ashurbanipal library colophon with a curse against tablet removal or name substitution,
    followed by the opening titulary of Ramman-Nirari I emphasizing divine support,
    conquest, and royal lineage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unspecified persons or objects are brought through the Kasushi-gate into a
    chamber dedicated to Marduk; festivals are arranged and a splendid house of joy
    is presented to the speaker's lord and lady.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person speaker sacrifices precious offerings to Marduk and gives
    silver and gold presents to the gods residing in Esagila.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text notes a lacuna of sixteen lines after the account of appointing good
    and splendid things to Esagila.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nur-ilu, Ikisha-ilu the priest, and Mardukmuballit the metal-worker are listed
    with houses, fields, and forests and are made servants of the temple.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Agum is described as building Marduk's shrine, renovating Esagila, leading
    Marduk into his abode, and releasing workmen and their properties from obligations
    so that they might serve Marduk and Qarpanit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Blessing petitions ask that Agum's days and years be long, his rule be good,
    heavenly brightness shine on him, clouds grant rain, and orchards bear good fruit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Named deities are invoked to grant Agum blessing, life, a perfected lot, royal
    seed, firm throne foundations, wisdom, and complete rich blessings.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: A tablet colophon identifies the tablet as from Ashurbanipal's library and
    states Ashurbanipal's royal titles and trust in divine powers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A curse threatens anyone who removes the tablet or substitutes another name
    for Ashurbanipal's; Ashur and Belit are asked to overthrow such a person and erase
    his name and family from the land.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The next inscription begins with Ramman-Nirari I's titulary, describing him
    as an illustrious prince, viceroy of the gods, founder of cities, destroyer and
    conqueror of enemies, and a king for whom named gods brought rulers and princes
    into submission.
  category: speech
  evidence_refs:
  - ev:9
