canonical_text:
  quote: ''
  summary: A royal inscription names Ashurnagirpal with titles and ancestry, describes
    conquests under Ashur's protection, recounts the rebuilding and dedication of
    a temple for Mahir with cedar materials and an inscribed tablet, and addresses
    future royal successors with instructions to repair and restore the tablet and
    temple. The passage gives blessings for proper restoration and ritual offerings,
    and curses anyone who speaks evil against the tablet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashurnagirpal is identified as a great and powerful king of Assyria, son of
    Tukulti-Ninib and descendant of Ramman-nirari.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is described as a brave hero who marches under the protection of
    Ashur and finds no rival among princes of the four quarters of the world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king reports bringing lands to submission, conquering Nairi, restoring
    territory, taking a city anew, and naming it Imgur-Bel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king builds a temple with palace brick, installs an image of Mahir, brings
    cedar, cypress, and juniper from Lebanon, makes cedar beams and doors, and adorns
    the temple.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king seats Mahir in the temple and places an inscribed tablet there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A later royal successor is instructed that, if the temple decays and he sees
    and reads the tablet, he should repair damage, write his name with the earlier
    king's name, and restore the tablet to its place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ashur and Mahir are invoked to look with love on the restorer and to establish
    his name and seed in their land.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Anyone who sees the tablet and speaks evil is threatened with Ishtar breaking
    his weapons and depriving him of his throne.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Anyone who reads the tablet, cleanses it with oil, offers sacrifices, and
    restores it to its place is promised that Ashur will hear his prayers and grant
    his desire in royal battle and war.
  category: sequence
  evidence_refs:
  - ev:7
