canonical_text:
  quote: ''
  summary: The passage recounts early copying, publication, and decipherment of Achaemenian
    cuneiform inscriptions. It describes work by Kampfer, de Bruin, Caylus, Niebuhr,
    Tychsen, Münter, de Sacy, and especially Grotefend, whose method used repeated
    signs for “king,” comparison of two inscriptions, genealogical inference, and
    known royal names to identify Darius, Xerxes, and Hystaspes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kampfer copied inscriptions, discussed whether the writing was alphabetic,
    syllabic, or ideographic, decided in favor of ideographic, and first used the
    term “cuneiform” for wedge-shaped writing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: De Bruin traveled to Persepolis and published additional trilingual, Old Persian,
    and Babylonian inscriptions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Count Caylus found the vase of Xerxes, whose quadrilingual inscription contained
    the words “Xerxes, the Great King.”
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Carsten Niebuhr copied Achaemenian inscriptions at Persepolis and distinguished
    forty-two signs, calling them letters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tychsen and Münter continued Niebuhr’s work, and Grotefend later presented
    discoveries to the Society of Sciences in Göttingen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Grotefend is described as the first to decipher a complete inscription and
    as publishing the first translation of a cuneiform text.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Grotefend used information about Persepolis palaces, Pehlevi inscriptions
    from the same ruins, the left-to-right reading direction, and two small inscriptions
    from palace terraces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Münter had identified a repeated word as meaning “king,” and Grotefend found
    this word in two similar inscriptions arranged with sign groups labeled A, B,
    and C.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Grotefend inferred that the sign groups contained proper names in genealogical
    relation: A was father of B, C was father of A, A and B were kings, and C lacked
    the title of king.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Grotefend identified A as Darius, B as Xerxes, and C as Hystaspes, then translated
    the inscriptions as royal formulas naming kings and their fathers.
  category: action
  evidence_refs:
  - ev:8
