  summary: The passage presents Achaemenian royal inscriptions in which Ahura-mazda
    is praised as creator of heaven, earth, mankind, and Xerxes as king. Xerxes identifies
    himself with expansive royal titles and as son of Darius. The inscriptions state
    that Darius built a house under Ahura-mazda's protection and ask Ahura-mazda,
    together with other or all gods, to protect Xerxes, his sovereignty, and the works
    built by Xerxes and Darius.
