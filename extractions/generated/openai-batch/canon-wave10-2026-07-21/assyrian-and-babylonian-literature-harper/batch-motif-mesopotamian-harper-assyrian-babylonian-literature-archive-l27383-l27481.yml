  category: relationship
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:3
  text: A drunken man is compared to a worm in strength, and daily life is described
    as the same as yesterday.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: An insulting saying states that an offensive person fouls river water and
    makes garden fruit bitter by entering those places.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Agricultural sayings state that bad seed corn does not sprout or grow, and
    that heavy ears of corn sink while meagre ears stand upright.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A riddle turns on the Assyrian word shebu, explained as meaning both an elder
    or head of family and a brick or stone-like object to be polished.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'A maxim pairs mortality with eating and life with work: because one must
    die one eats, and because one must live one works.'
