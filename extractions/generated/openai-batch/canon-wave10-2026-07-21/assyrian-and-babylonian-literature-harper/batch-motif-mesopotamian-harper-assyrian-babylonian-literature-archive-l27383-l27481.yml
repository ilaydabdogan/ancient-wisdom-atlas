literal_observations:
- id: obs:1
  text: A proverb says that consuming all one’s garlic or vegetables when the wind
    blows may lead to distress or want before rainy-season produce has grown.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several sayings describe enemies, including an enemy becoming unable to harm,
    property-taking being reversed by an enemy, and an enemy’s ox receiving weeds
