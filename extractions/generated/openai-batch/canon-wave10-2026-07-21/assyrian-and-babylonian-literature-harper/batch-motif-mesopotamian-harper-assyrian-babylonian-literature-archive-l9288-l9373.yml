canonical_text:
  quote: ''
  summary: The passage narrates Ashurbanipal's campaigns in Elam. Ashur and Ishtar
    are said to support him, depose Tammaritu, command and protect the eighth campaign
    against Ummanaldash, and provide a dream through Ishtar that enables the army
    to cross the Idide safely. The king conquers and burns cities, carries off gods,
    people, property, and animals as spoil, pursues Ummanaldash, and returns to conquer
    Susa and open its palaces and treasure-houses.
  language: English
  quote_policy: summarized
