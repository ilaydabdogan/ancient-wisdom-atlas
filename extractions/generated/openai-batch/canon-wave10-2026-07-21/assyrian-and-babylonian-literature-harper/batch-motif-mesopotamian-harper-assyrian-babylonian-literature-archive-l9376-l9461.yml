canonical_text:
  quote: ''
  summary: Ashurbanipal narrates the seizure of stored wealth, cult objects, statues,
    people, animals, and city dust from Elam; the destruction of Susa’s temple tower,
    temples, guardian figures, secret forests, and royal mausoleums; the removal of
    bones and denial of offerings to the dead; the devastation and salting of the
    land; and a note about Nanna’s long anger and a divine mission to avenge earlier
    Elamite devastation of Akkad.
  language: English
  quote_policy: summarized
