canonical_text:
  quote: ''
  summary: A distant ruler reports a vision instructing him to submit to Ashurbanipal
    and gain victory through Ashurbanipal’s name. After submitting, he defeats the
    Cimmerians and sends captive governors and tribute, but later ceases contact,
    trusts his own strength, and allies with Psammetichus of Egypt. Ashurbanipal prays
    to Ashur and Ishtar for his corpse and bones to be given to enemies; the annal
    says this is fulfilled, and the Cimmerians raid his land. A parallel note describes
    Kirbit’s people trusting inaccessible mountains, plundering Yamutbala, and being
    conquered and deported after Dur-ilu appeals to Ashurbanipal.
  language: English
  quote_policy: summarized
