canonical_text:
  quote: ''
  summary: Ashurbanipal reports taking obelisks and spoils from Thebes, returning
    to Nineveh, besieging Ba'al of Tyre, receiving royal daughters, hostages, dowries,
    tribute, and submission from Tyre, Arwad, Tabal, Cilicia, and other rulers, appointing
    Aziba'al over Arwad, and receiving divine dream-related recognition through Ashur's
    revelation of his name to Gyges of Lydia. Translator notes quote parallel passages
    that expand the siege, tribute, and submission formulas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator removed two tall obelisks from before a temple gate, carried
    off spoils from Thebes, made his weapons rage over Egypt and Ethiopia, and returned
    safely to Nineveh.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ba'al, king of Tyre, is described as dwelling in the midst of the sea and
    as having ignored the narrator's command.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator built siege-works against Ba'al, seized approaches by sea and
    land, put the inhabitants in distress, and made them submit to his yoke.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ba'al brought his daughter, his brother's daughters, and his son Yahimilki
    to the narrator; the daughters were received with dowry, while the son was returned
    after mercy was shown.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yakinlu of Arwad submitted, brought his daughter with dowry to Nineveh as
    a concubine, and kissed the narrator's feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mukallu of Tabal and Sandasarme the Cilician each brought a daughter with
    dowry to Nineveh as a concubine and kissed the narrator's feet; Mukallu was also
    assigned annual horse tribute.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The sons of Yakinlu came from the sea with presents and kissed the narrator's
    feet; Aziba'al was established as king over Arwad, while the others were clothed
    in raiment, given gold rings, and made to stand before the narrator.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ashur, called the narrator's creator, revealed the narrator's name in a dream
    to Gyges, king of Lydia.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A parallel passage says the way of Ba'al was hemmed in, food and drink became
    scarce, and a strong enclosure left no escape; another parallel says the siege-works
    were later broken through, approaches reopened, heavy tribute received, and the
    narrator returned safely to Nineveh.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A parallel passage describes Mukallu as a mountain ruler overcome by terror,
    and describes an Arwad ruler as sea-dwelling, fish-like in immeasurable waters,
    trusting in the raging sea before submitting and paying tribute.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: A parallel passage connected with Gyges describes a stranger brought to Nineveh
