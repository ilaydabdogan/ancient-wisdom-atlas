canonical_text:
  quote: ''
  summary: A ritual prescription directs the washing of specified meat portions in
    a basin, their placement before a series of named deities, the lighting of a censer,
    and a step toward it. It then directs the sacrificer to raise his hand, pray,
    prostrate himself, remove a table before each deity, pour out four jugs of sesame
    wine before the censer, remove the censer, prostrate himself, and kneel.
  language: English
