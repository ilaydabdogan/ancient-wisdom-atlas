canonical_text:
  quote: ''
  summary: The passage contains a letter fragment with a formula of prostration and
    obedience to a king, followed by editorial background on Bel-ibni and two letters
    from Bel-ibni to the king. Bel-ibni invokes Ashur, Shamash, and Marduk for the
    king’s welfare, reports taking a fugitive from Elam under protection, reports
    an oath and bargain between Nadan, Pukudeans, and Nabu-bel-shumate, advises royal
    warning against dealings with Elam, and reports panic, flight, and disorder among
    Elamite leaders and peoples.
  language: English
  quote_policy: summarized
