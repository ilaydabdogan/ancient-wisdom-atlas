canonical_text:
  quote: ''
  summary: The passage presents a first-person royal inscription of Tiglath-Pileser
    III. The royal speaker says that the brilliance and majesty of Ashur caused rulers
    to submit, kiss his feet, and bring tribute. He recounts campaigns against many
    named lands, mass deportation and seizure of goods, destruction and burning of
    cities, annexation to Assyria, rebuilding and settlement, establishment of Ashur's
    authority, appointment of governors, erection of royal images, founding of a city
    and palace, and defeat of a coalition of rulers. The closing section is fragmentary
    and mentions tribute, subdual, and distant peoples near the setting sun hearing
    of his majesty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Merodach-baladan of Yakin, king of the sea-land, came to Sapia into the royal
    speaker's presence, kissed his feet, and brought tribute including gold, gold
    vessels, precious stones, wood, clothing, spices, cattle, and sheep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The royal speaker says he covered many named eastern lands and districts as
    with a bird-net, slew warriors, carried away sixty-five thousand people with possessions
    and animals, and laid waste, destroyed, and burned their cities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The royal speaker says he added conquered lands and cities to Assyria, rebuilt
    cities, established Ashur's authority there, placed conquered people in them,
    and appointed a military governor as provincial ruler.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The royal speaker says he erected an image of his lordship in several named
    lands and cities, including Bit-Ishtar, Qipur, Ariarmi, Tarsharranihu, and Silhazi.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tribute is reported from Media, Ellip, and rulers of cities of the mountains
    as far as Bikni, consisting of animals and other goods in a damaged section.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A damaged passage says another ruler heard of the might and majesty of Ashur
    exercised in the mountains, was overwhelmed by fear of Ashur's brilliance, came
    to Dur-Tiglath-pileser into the royal speaker's presence, kissed his feet, and
    brought tribute.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The royal speaker sent the military governor Ashurdaninani to the land of
    the mighty Medes, conquered Ulluba and Kilhu, added them to Assyria, built a city
    called Ashur-iqi-sha, founded a palace, established Ashur's authority, settled
    conquered people there, and set a governor over them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sardurri of Urartu, Sulumal of Milid, Tarhulara of Gurgum, Kushtashpi of Kummuh,
    and others are described in a damaged passage as making common cause for conquest
    and plunder; the royal speaker says he brought about their defeat and colored
    the Sinzi canal with the blood of their slain like dyed wool.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After a lacuna, a fragmentary section mentions heavy tribute from a feminine
    referent, subdual of the people of Birai, and distant peoples near the border
    of the setting sun hearing of the royal speaker's majesty.
  category: other
  evidence_refs:
  - ev:8
