canonical_text:
  quote: ''
  summary: 'The passage recounts stages in the nineteenth-century decipherment of
    cuneiform inscriptions: confirmation of Grotefend''s readings by a quadrilingual
    vase, further work by Burnouf and Lassen, later grammatical and lexical advances,
    and Henry Rawlinson''s copying, translation, and publication of Persian, Babylonian,
    and Assyrian inscriptions, including the Behistun inscription and the Black Obelisk
    of Shalmaneser.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Later investigations confirmed that Grotefend had read the signs correctly,
    with one noted correction in the reading of a letter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A vase with a quadrilingual inscription confirmed the method of decipherment:
    one inscription was Egyptian hieroglyphic and three were in cuneiform characters;
    the Old Persian cuneiform corresponded to the Persepolis group read as Xerxes.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Burnouf and Lassen resumed the work around 1836; Lassen's discovery of a list
    of peoples in a Darius inscription helped identify new sign values and enabled
    philological explanation of Persian cuneiform inscriptions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Grotefend's theory that the inscription language was exactly similar to the
    Avesta was later proved wrong; Beer, Holtzmann, Westergaard, and others made additional
    discoveries, though the available material remained limited.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Henry Rawlinson began studying cuneiform inscriptions in 1835, initially independently
    of Grotefend, and found the names Hystaspes, Darius, and Cyrus in inscriptions
    from Elvend near Hamadan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rawlinson copied substantial parts of the Persian text of the Behistun inscription
    in 1837 and sent early translations with notes to London in 1838, where Sir Gore
    Ouseley brought them to the Asiatic Society's attention.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: After interruption by war service, Rawlinson completed copying the Old Persian
    text in 1844 and the Babylonian text in 1847, later presenting and publishing
    translations and related materials.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Rawlinson's memoir included the cuneiform text, transliteration, and translation
    of the Babylonian Behistun version, whose middle portions were partly unreadable
    because of long-continued trickling water.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: In 1852 Rawlinson was sent to Baghdad as consul-general and was authorized
    by the British Museum authorities to conduct excavations at favorable sites.
  category: action
  evidence_refs:
  - ev:8
