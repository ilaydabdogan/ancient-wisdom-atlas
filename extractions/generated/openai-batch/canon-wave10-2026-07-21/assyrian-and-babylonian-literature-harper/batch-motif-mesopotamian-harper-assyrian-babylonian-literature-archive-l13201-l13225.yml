  quote: ''
  summary: The passage presents fragments of royal inscriptions. Artaxerxes I identifies
    himself with royal titles, descent from Xerxes and Darius, and Achaemenian lineage.
    He states that under Ahura-mazda's protection he has established a house built
    by himself and his father, and asks Ahura-mazda to protect him, his deeds, sovereignty,
    and countries. A brief Venice inscription names Artaxerxes as great king. The
    beginning of an inscription of Antiochus-Soter gives royal titles, rulership over
    Babylon and lands, patronage of Esagila and Ezida, and descent from Seleucus.
  language: English
