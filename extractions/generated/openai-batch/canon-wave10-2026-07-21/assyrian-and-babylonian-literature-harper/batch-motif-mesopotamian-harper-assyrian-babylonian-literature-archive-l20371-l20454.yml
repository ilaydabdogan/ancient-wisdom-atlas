canonical_text:
  quote: ''
  summary: 'The passage contains introductory notes and fragmentary material from
    Tablet I of the Gilgamesh narrative. The opening describes a figure connected
    with Gilgamesh who knows wisdom, mysteries, and hidden things, has traveled far,
    grown weary, and written matters on a memorial tablet. A later fragment presents
    a crisis around Erech/Gan-gan-na: an unnamed figure goes to the river with a boat
    and weeps, a city has been destroyed by an enemy, animals and people are distressed,
    city deities take the forms of flies and mice, Erech is besieged for three years,
    Ishtar cannot overcome the enemy, and Bel addresses Ishtar. A bracketed editorial
    note says the preserved text breaks off and reconstructs Gilgamesh as the city''s
    later saviour and king.'
  language: English
  quote_policy: summarized
