canonical_text:
  quote: ''
  summary: The passage contains an editorial note about a payment arrangement involving
    rent directed to the Temple of Sharru, followed by three Babylonian marriage contracts.
    The first contract states that Rimum takes Bashtum as wife, that a bridal present
    will free her, that unequal penalties apply if either spouse denies the marriage,
    and that the oath is sworn by Shamash, Marduk, the king Shamshu-ilu-na, and Sippar.
    The second contract records Dagil-ili asking Khamma for Latubashinni as wife,
    giving a slave and money in exchange, and owing money if he takes another wife;
    the editor identifies it as marriage by purchase. The third contract records a
    father arranging marriage for his son with Ina-Esaggil-banat and describes a dowry
    including money, named persons/items, a house outfit, and a slave credited toward
    the dowry; the editor identifies it as marriage with dowry.
  language: English
  quote_policy: summarized
