canonical_text:
  quote: ''
  summary: The passage contains diplomatic correspondence from the Tel-el-Amarna letters.
    In the first segment, a royal speaker recounts Kurigalzu's refusal to ally with
    Canaanites against Egypt, complains about Assyrian envoys, and sends lapis lazuli,
    horses, and chariots. The main letter is from Tushratta of Mitani to Amenophis
    III of Egypt, affirming inherited friendship, invoking deities to preserve it,
    discussing the dispatch of Tushratta's daughter as wife to the Egyptian king,
    and requesting large quantities of gold.
