canonical_text:
  quote: ''
  summary: A first-person royal inscription recounts tribute received, Shalmaneser’s
    departure from Nineveh, river and mountain crossings, seizure and renaming of
    cities, settlement of Assyrians, restoration of previously held cities, further
    tribute, difficult mountain passage, destruction and burning of multiple lands
    and cities, erection of a royal image inscribed with Ashur’s majesty, and pursuit
    and defeat of Arramu of Urartu in the mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker receives quantities of sheep, gold, silver, purple cloth, and
    cedar as tribute, including yearly tribute from Katazilu of Qummuhu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker departs from Nineveh, crosses the Tigris, passes over the mountains
    Hasamu and Dihnunu, and arrives at Til-barsip.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ahuni, son of Adini, crosses the Euphrates during high water and goes to other
    lands in order to save his life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: By the command of Ashur, the speaker seizes Til-barsip and associated places,
    settles Assyrians there, builds palaces, and gives new names to cities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker restores Ashurutiracbat, called Pitru by the Hatti, and Mutkinu
    to their place and settles Assyrians in them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: While quartered in Kar-Shalmaneser, the speaker receives tribute from kings
    of the sea-coast and kings along the Euphrates.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker departs from Kar-Shalmaneser, crosses Mount Sumu, descends to
    Bit-zamani, and then crosses the mountains Namdanu and Meirsu.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Steep and difficult mountains, whose peaks are compared to dagger points raised
    to the skies, are broken down with bronze axes so that chariots and forces can
    pass through.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker captures Enzite, destroys, devastates, and burns its cities, carries
    off spoil, and makes a large image of his royalty.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The royal image is inscribed with the majesty of Ashur and the might of the
    speaker’s power and is set up at Saluria at the foot of Mount Kirequ.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker crosses the river Arzania, captures Uashtal, destroys and burns
    Suhme, and takes Sua with his hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The speaker captures Dayaeni, destroys, devastates, and burns its cities,
    and takes spoil and property.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Arramu of Urartu becomes afraid, abandons Arzashku, and goes up to the mountains
    of Adduri.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The speaker climbs the mountains after Arramu, fights there, kills 3,400 fighting
    men, compares his destruction to Ramman’s rain, and says the mountain is dyed
    with their blood like wool.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The speaker takes Arramu’s camp equipment, chariots, riding horses, horses,
    bulls, calves, property, spoil, and possessions from the mountain.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Arramu climbs difficult mountains to save his life; the speaker compares himself
    to a wild bull, tramples Arramu’s land, ruins his cities, destroys and burns Arzashku,
    and begins to describe pyramids of heads at the city gate.
  category: action
  evidence_refs:
  - ev:10
