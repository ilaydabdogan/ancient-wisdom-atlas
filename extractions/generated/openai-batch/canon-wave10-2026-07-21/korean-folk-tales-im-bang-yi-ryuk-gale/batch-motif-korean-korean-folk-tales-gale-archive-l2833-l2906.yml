canonical_text:
  quote: ''
  summary: A woman repeatedly comes to the gateway to call for the Governor's boy.
    The boy identifies her as his sister, whose peddler husband has not returned.
    Later, while the boy is away and the Governor is alone, the Governor invites the
    woman in, asks her to bring a light for his pipe, tells her to smoke, praises
    her beauty, proposes that she live with him secretly, and swears that he is serious.
    She protests the difference in status, then accepts, and asks about a rule forbidding
    women in the sacred place where he is staying.
  language: English
  quote_policy: summarized
