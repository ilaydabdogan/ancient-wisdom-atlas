canonical_text:
  quote: ''
  summary: A man recounts that he has been to the home of the genii and married there.
    His friend notices his strange, unworn clothing. Years later, a servant from the
    master of the genii arrives with the man's two sons and letters warning that the
    place where he lives will be destroyed the next year. The man tells his friend,
    shows the sons, and the matter is told to the mother. They sell their property,
    feast with the townspeople, bid farewell, and leave in 1635. The following year,
    during the Manchu invasion, the village is destroyed, and the story remains known
    in Ka-pyong.
  language: English
  quote_policy: summarized
