canonical_text:
  quote: ''
  summary: The excerpt opens with remarks on practical work and a judgment by Yul-gok
    that To-jong was a dreamer, followed by To-jong's reply that he was not wholly
    useless. In the story, Teacher To-jong, formerly a merchant and something of an
    astrologer, stays overnight in a fishing village by the East Sea. A stranger called
    an i-in or holy man joins To-jong and the house master. On a clear, calm night
    the holy man looks over the water, becomes terrified, and warns that a tidal wave
    will soon engulf and destroy the village. The house owner first refuses to believe
    him, but the holy man urges everyone to go up the rear mountain, leaving goods
    behind if necessary. The owner takes his family and a few light things and follows
    him to the top. To-jong sits halfway up and asks whether he will be safe there;
    the holy man says others would not escape there, but To-jong will only be frightened
    and live through it.
  language: English
  quote_policy: summarized
