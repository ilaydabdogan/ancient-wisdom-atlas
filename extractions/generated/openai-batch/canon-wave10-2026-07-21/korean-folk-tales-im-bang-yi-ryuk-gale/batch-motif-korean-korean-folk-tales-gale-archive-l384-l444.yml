canonical_text:
  quote: ''
  summary: Charan and her chosen companion leave the sleeping city with clothing,
    treasures, and jewels, travel toward the mountains, and settle in a village where
    she supports them through sewing and selling valuables. Keydong is discovered
    missing from a temple; his parents search unsuccessfully, hear rumors of fox transformation
    or tiger attack, assume him dead, mourn, and burn his clothing in a sacrificial
    fire. In Pyong-an, a Governor's son imprisons Charan's mother and relatives during
    a failed search. Charan later urges her companion to consider filial duty and
    proposes a plan for a new start.
  language: English
  quote_policy: summarized
