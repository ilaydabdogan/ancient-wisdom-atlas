canonical_text:
  quote: '"The ways differ of we genii and you men of the world."'
  summary: A mortal master is received in a beautiful supernatural palace by a kingly
    host who reveals himself as Chang To-ryong. Chang explains that he had been exiled
    to earth for a fault, that his apparent death marked the end of exile and return
    home, and that he summoned the master to thank him for past kindness. The guest
    is feasted, lodged in a luminous pavilion, and then told he cannot remain among
    the genii and must depart with a guide.
  language: English
  quote_policy: quoted
