canonical_text:
  quote: ''
  summary: A man suspects his son, catches the child attempting to stab him, and kills
    him. The mother covers the body, but under the quilt the child is gone and a huge
    snake appears. The husband recognizes the snake by an arrow scar and says it became
    his son in order to take revenge. After the man proposes ending the hostility,
    the snake listens and leaves through the Water Gate. A note explains the event
    as the snake's revenge through transmigration of its soul.
