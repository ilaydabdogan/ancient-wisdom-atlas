canonical_text:
  quote: ''
  summary: After a man offers food, sacrifice, and prayer, an old white-haired scholar
    appears to him in a dream. The scholar explains that he died prematurely, that
    only his skull remained beneath a creeper, and that the man had relieved him by
    burying him in a clean place and giving him food. To repay the kindness, the ghost
    reveals the upcoming official examination topic and supplies a poem. The man later
    finds the subject exactly as foretold, uses the poem, and wins first honors.
  language: English
  quote_policy: summarized
