canonical_text:
  quote: ''
  summary: A Man of God announces destructive punishment against inhabitants of the
    earth. A priest pleads that the wrath fall on him instead and continues praying
    until the punishment is reduced but not canceled. The two depart through the upper
    air into heaven. A woodman, who heard only indistinctly from a distance, returns
    home and escapes with his wife and family. Rain begins; Mount Otai collapses,
    the ground sinks into a vast lake, the inhabitants are destroyed, and the woodcutter
    is said to escape alone.
  language: English
