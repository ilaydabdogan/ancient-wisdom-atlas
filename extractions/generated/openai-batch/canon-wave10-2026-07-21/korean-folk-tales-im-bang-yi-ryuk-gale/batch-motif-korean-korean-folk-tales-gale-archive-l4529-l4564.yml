canonical_text:
  quote: ''
  summary: 'The passage closes with a reflection on stories of a snake and the unknown
    law governing such events. A new tale begins: in an old county of North Ham-kyong
    Province, an evil-smelling goblin destroys life and successive magistrates die
    soon after arriving. Many refuse the post until a brave, socially uninfluential
    soldier accepts it. He enters the deserted yamen, carries a long knife, and notices
    a fishy, stinking odour growing stronger.'
