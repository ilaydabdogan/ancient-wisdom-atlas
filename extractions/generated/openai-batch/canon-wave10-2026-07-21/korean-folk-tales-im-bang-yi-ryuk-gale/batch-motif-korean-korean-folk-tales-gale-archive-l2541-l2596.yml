canonical_text:
  quote: ''
  summary: The passage introduces Han Myong-hoi, first as a boy accompanied by a loyal
    tiger, then as a powerful and feared minister and governor under King Se-jo. As
    governor of Pyong-an, Han is described as lawless and violent. Hearing that the
    Deputy Prefect of Son-chon has a beautiful daughter, Han orders the Deputy to
    prepare for him to take her as a concubine. The Deputy outwardly submits but returns
    home anxious; his daughter notices and asks why.
