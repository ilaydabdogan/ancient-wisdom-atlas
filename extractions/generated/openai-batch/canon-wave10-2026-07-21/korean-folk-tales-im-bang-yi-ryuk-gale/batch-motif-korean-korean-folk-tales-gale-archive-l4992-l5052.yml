canonical_text:
  quote: ''
  summary: An unnamed literary graduate in Yon-nan County falls ill and is taken by
    spirit soldiers to the lower hell. He is brought through a walled enclosure into
    a great court, laid face down, and questioned by a terrifying enthroned king about
    his identity and life. The scholar describes his identity, residence, Buddhist
    recitation, and almsgiving. A secretary later reports that he was wrongly arrested
    because he shares the intended person's name, and he is told he may go.
  language: English
  quote_policy: summarized
