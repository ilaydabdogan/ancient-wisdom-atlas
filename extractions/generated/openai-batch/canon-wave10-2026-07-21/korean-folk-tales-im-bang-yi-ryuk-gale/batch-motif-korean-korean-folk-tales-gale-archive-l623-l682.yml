canonical_text:
  quote: ''
  summary: Chang To-ryong wanders Seoul as a beggar, sleeping by gates and mixing
    with servants. The proud magician Chon U-chi repeatedly dismounts and prostrates
    himself before Chang, explaining that Chang is the greatest of three spirit-men
    in Chosen, though ordinary people do not know it. Later, a literary undergraduate
    asks Chang about his poverty; Chang says he is an orphan from a cultured Chulla
    family, and the undergraduate gives him food, drink, and future hospitality.
  language: English
  quote_policy: summarized
