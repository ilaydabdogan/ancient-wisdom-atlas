canonical_text:
  quote: ''
  summary: A woman tells the Governor to come secretly at night wearing a commoner's
    felt hat as a disguise. She receives him, lights a lamp, and serves refreshments
    and drink. A disturbance outside is identified by her as the voice of her estranged
    husband ChoUlo, called Brass Tiger, who pounds open the door. The woman tells
    the Governor he must escape and hides him in an empty rice-box inside a small
    thatched hut.
  language: English
  quote_policy: summarized
