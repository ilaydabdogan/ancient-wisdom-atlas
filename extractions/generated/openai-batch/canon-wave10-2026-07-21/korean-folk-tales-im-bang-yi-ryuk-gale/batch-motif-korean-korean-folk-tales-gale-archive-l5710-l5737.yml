canonical_text:
  quote: ''
  summary: A Seoul gentleman crossing the Han River falls asleep and dreams of a majestic
    armed stranger on a red horse. The stranger marks the gentleman's open hand with
    a pen-mark identified as the sign of the God of War and instructs him to wait
    at the landing after crossing. Seven horses loaded with network hampers will come
    toward the capital; the gentleman is to call the horsemen, show the sign, witness
    their suicides, and then take and pile up the loads.
