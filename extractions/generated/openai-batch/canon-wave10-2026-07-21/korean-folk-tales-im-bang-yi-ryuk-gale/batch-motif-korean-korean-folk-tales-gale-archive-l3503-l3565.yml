canonical_text:
  quote: ''
  summary: A hungry young man eats strange food in the house of an old master. The
    old man says he has a marriageable daughter and chooses the young man as his son-in-law.
    Two sons select the day after tomorrow as a lucky wedding day. An official of
    the genii escorts the young man to another palace, where he bathes, changes from
    worn clothing into genii vestments, and waits. On the appointed day he bathes
    and changes again, rides by palanquin with officials, and is guided to the Palace
    Beautiful.
  language: English
  quote_policy: summarized
