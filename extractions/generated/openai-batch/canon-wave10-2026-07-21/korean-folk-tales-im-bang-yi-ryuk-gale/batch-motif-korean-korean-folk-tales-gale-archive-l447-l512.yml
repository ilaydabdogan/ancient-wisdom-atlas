canonical_text:
  quote: ''
  summary: Charan proposes that Keydong recover his standing through the Official
    Examination. She secures a rare examination book from a passing peddler, supports
    Keydong's two years of study by candle-light, and prepares him for a special examination
    before the King in Seoul. Keydong writes the winning composition; when the sealed
    name is opened, he is identified as first-place winner while his father, the Prime
    Minister, is in attendance.
  language: English
  quote_policy: summarized
