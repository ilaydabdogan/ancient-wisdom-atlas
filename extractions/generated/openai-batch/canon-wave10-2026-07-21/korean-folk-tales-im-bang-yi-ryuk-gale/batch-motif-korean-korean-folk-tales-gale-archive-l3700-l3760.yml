canonical_text:
  quote: ''
  summary: A young man leaves the abode of immortals with a genie servant and returns
    to the ordinary world. The servant explains that he has not attained immortality
    because he has not abandoned earthly emotions. He reaches home during an exorcising
    ceremony held for the anniversary of his supposed death, is first mistaken for
    a ghost, and later conceals the truth from his mother. He opens a bundle from
    his wife containing seasonal clothes, is later married by his mother’s arrangement
    without joy, and begins to tell a childhood friend what happened to him.
  language: English
  quote_policy: summarized
