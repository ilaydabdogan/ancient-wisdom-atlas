canonical_text:
  quote: ''
  summary: A scholar in the realm of Yom-na receives a message from the King of Hades,
    who identifies his former Seoul household and asks that a new outer coat be sent
    to him. The scholar requests proof for the living; the King provides the secret
    location of a damaged head button hidden in a history book and explains that the
    coat should be offered by fire. Guards escort the scholar away, identify the King
    as Pak Oo, and push the scholar into river water. He awakens after having been
    dead three days, recovers, goes to Seoul, verifies the house and name, and seeks
    admission to the household.
  language: English
  quote_policy: summarized
