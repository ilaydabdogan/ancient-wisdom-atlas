canonical_text:
  quote: ''
  summary: A group lands and enters a house occupied by a huge, frightening man. He
    locks the gate, cooks and eats a young member of the company, drinks from a jar,
    and falls asleep. The trapped group blinds him with a knife, hides among pigs
    and sheep, and escapes through the gate by carrying animals on their backs during
    his tactile inspection. They reach their boat, but the monster calls other giants
    who pursue and catch the boat as the passage ends.
  language: English
  quote_policy: summarized
