canonical_text:
  quote: ''
  summary: A man humbly invites the scholar back to his house and explains that his
    daughter died, revived, and reported that a devil had carried her soul away until
    a man drove the spirit off. The daughter recognizes the scholar as that rescuer.
    The host asks whether he is a supernatural being or a Buddhist and offers refreshment.
    The scholar dismisses the claim and later dies after seven or eight more years.
