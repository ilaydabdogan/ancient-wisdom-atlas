  summary: The passage introduces Yee Man-ji of Yong-nam, a physically strong and
    fearless soldier. During a sudden storm, a great ball of fire rolls through his
    house and household spaces. Yee remains undisturbed, thinking that because he
    has done no wrong he need not fear lightning. Lightning then strikes and destroys
    a large elm tree in front of the house, after which the storm stops; he turns
    to check on his family.
