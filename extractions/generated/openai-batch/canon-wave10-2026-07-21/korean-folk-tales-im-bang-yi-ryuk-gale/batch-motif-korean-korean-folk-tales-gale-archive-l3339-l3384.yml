canonical_text:
  quote: ''
  summary: An unnamed man recounts receiving a book and command authority, returning
    to a temple with an old priest, and finding the priest gone the next morning.
    He says this brought him into possession of a secret magic art. Han asks to obtain
    the gift, but the man says the craft is only for someone poor and despised, not
    for a minister. The man later withdraws to an isolated mountain hut and then disappears
    without trace. The writer states that Prince Han’s children transmitted the story.
