canonical_text:
  quote: ''
  summary: An old man explains that Ta-hong hid under the nominal status of his concubine
    while waiting for the narrator’s examination success. She remained confident,
    watched for him during the public celebrations, and called him in when he passed.
    The old man praises her faithfulness, clarifies that she is not his, arranges
    a decorated room as for a bridegroom, and the next morning the narrator reports
    the matter to his parents, who give consent.
  language: English
  quote_policy: summarized
