canonical_text:
  quote: ''
  summary: A scribe named Kim Kyong-jin says that in 1640, while traveling past Big
    Horn Bridge in Ta-in County, he found a scholar and several servants unconscious
    by the riverside. They explained that a proud Buddhist priest had refused to acknowledge
    them, beaten a servant with his stick after being shouted at, beaten others who
    tried to help, and then threatened to punish the scholar for failing to reprimand
    his servants.
