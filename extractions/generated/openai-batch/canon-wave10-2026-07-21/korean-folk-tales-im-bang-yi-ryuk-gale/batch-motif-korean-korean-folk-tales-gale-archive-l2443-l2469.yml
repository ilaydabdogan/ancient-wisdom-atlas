  summary: A Koryo-period scholar traveling to an examination hears unexplained sneezing
    near roadside creepers in the mountains. His servant digs near the roots and finds
    a dead man's skull, whose nostrils are obstructed by roots. The narration explains
    the sneezing as the annoyed spirit's reaction. The candidate washes, wraps, and
    reburies the skull.
