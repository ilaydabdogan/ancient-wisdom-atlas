canonical_text:
  quote: ''
  summary: A gentleman follows a dream warning, verifies it by a strange mark on his
    hand, intercepts seven loads carried by horses, and reports the matter to authorities.
    The loads are burned, revealing countless tiny men and horses said to have been
    made by a magician for an invasion of Seoul. The city is credited as saved by
    Kwan, the God of War, who thereafter receives offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prior warning instructs that the contents are not to be looked into, that
    the matter should be reported to the Palace, and that the loads should be burned.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gentleman wakes in terror and sees the strange mark on his hand, with
    ink not yet dry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gentleman waits on the river bank, where seven loads on seven horses arrive
    from the far South.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Attendants accompany the loads, and a man wearing an official coat comes behind
    them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the gentleman shows the hand mark, the official-coated man jumps over
    the cliff into the river, and the attendants rush after him into the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The scholar tells boatmen that the hampers contain dangerous things and orders
    them not to touch or look at the hampers while they guard them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The scholar reports to the Board of War, which sends an official, brings the
    loads into Seoul, piles wood around them, and sets them on fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the baskets break open in the fire, countless inch-long figures of men
    and horses tumble out.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The officials who see the contents are described as frozen with fear.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hampers are all burned up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrative explains that the figures were made by a magician for a monster
    invasion of Seoul, which was prevented after a warning by Kwan.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Afterward, the people of Seoul begin faithful offerings to the God of War
    because he is credited with saving the city.
  category: action
  evidence_refs:
  - ev:7
