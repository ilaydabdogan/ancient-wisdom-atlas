canonical_text:
  quote: ''
  summary: At a birthday gathering, Charan dances and is honored by the Governor,
    who appoints her as a special dancing maiden to attend his son. Charan and the
    son become deeply attached during the Governor's extended northern term. When
    the family must return to Seoul, the parents worry over separating the pair and
    consult the son. He claims Charan can be set aside when he goes home, but after
    the parting and return to Seoul, thoughts of Charan possess him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Charan is part of a dance performance that charms the spectators; the Governor
    seats her on the dais, shares the banquet with her, gives her silk, and appoints
    her special dancing maiden to attend his son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: From that birthday onward, Charan and the Governor's son become close friends
    and are described as loving each other intensely.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the time of return approaches, the Governor and his wife worry that separating
    their son from Charan may cause him to die of a broken heart, while taking her
    with them unmarried may damage his reputation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The parents tell their son that keeping a dancing-girl before marriage is
    not good form and may interfere with marriage prospects and promotion, while also
    noting that a second wife is a recognized custom in Korea.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The son replies that when Charan is before his eyes she is everything, but
    when he starts for home she will be like worn shoes set aside.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the parting, Charan cries bitterly, while the son shows no visible emotion
    and bystanders wonder at his fortitude.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narration states that the son had loved Charan for six years and had not
    been separated from her for a single day, so he did not know what goodbye meant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Governor returns to Seoul to become Chief Justice, the son comes also,
    and after the return Keydong is inwardly occupied by thoughts of love for Charan
    as an examination approaches.
  category: sequence
  evidence_refs:
  - ev:6
