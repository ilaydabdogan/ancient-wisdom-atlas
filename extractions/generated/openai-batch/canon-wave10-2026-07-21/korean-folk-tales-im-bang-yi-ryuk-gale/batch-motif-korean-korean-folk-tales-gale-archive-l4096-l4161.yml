canonical_text:
  quote: ''
  summary: Yoo wanders into the royal quarters at night through a broken wall and
    unknowingly meets King Se-jong in a moonlit garden. The king questions him, invites
    him to sit, learns that he is an overlooked classics scholar, and has a eunuch
    bring the Book of Changes. Yoo explains a difficult passage clearly, and the king
    marvels that such knowledge has not been used in service of the country. Yoo asks
    to leave, but the king says it is too early and he might be arrested by guards.
  language: English
  quote_policy: summarized
