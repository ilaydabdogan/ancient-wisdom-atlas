  summary: Maing Sa-song, a Minister of State traveling south in plain clothes, takes
    shelter from rain in a side pavilion. A young scholar, Whang Eui-hon, is there
    reading an inscription board of verses. Whang addresses Maing as an old man and
    asks whether he understands the verses. Maing pretends ignorance and asks for
    an explanation. Whang says the verses were written by great men of the past from
    their experiences to inspire later people. The passage ends mid-sentence.
