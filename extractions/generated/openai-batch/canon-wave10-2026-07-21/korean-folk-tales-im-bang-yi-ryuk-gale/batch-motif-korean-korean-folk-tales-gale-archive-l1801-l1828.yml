  summary: An editorial note explains that invisible constituents in the air can be
    controlled to take living forms, and identifies the Kang-wha soldier's butterfly-making
    art as Taoist magic called son-sul. The story introduces a low-class village chief
    from Kang-wha whose jealous wife sits sewing in winter. To cheer her, he asks
    whether she would like to see him make butterflies. She scolds him, and he begins
    by taking colored silk bits from her workbasket.
