  quote: ''
  summary: The passage introduces Yi Eui-sin as a Korean geomancer whose craft is
    described through Taoist and ancient Chinese philosophical ideas, including paired
    principles and the Five Elements. It then tells how Yi traces a mountain vein
    to an ideal burial site, receives food from a bereaved mourner, learns that the
    funeral has not yet been arranged, and offers to show the mourner an auspicious
    grave location with proper compass orientation, predicting future wealth and later
    need for another site.
