canonical_text:
  quote: ''
  summary: The passage describes Yi Chi-Ham, Master Tojong, as a compassionate, prophetic,
    magical, ascetic, and charitable holy man. He tears his ceremonial coat into bandages
    for a sick child, foresees a disaster affecting his father-in-law's household,
    calms sea travel through magical practice, fasts and endures hardship, follows
    the Taoist So Wha-dam, lives humbly, distributes wealth to the poor, and builds
    a house for the needy while serving as magistrate.
  language: English
  quote_policy: summarized
