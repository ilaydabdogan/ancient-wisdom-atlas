canonical_text:
  quote: ''
  summary: 'The passage closes a preceding tale by saying that a person who had beaten
    his mother was killed, and by drawing the moral that God observes and punishes
    evildoers. It then begins “The Old Man in the Dream”: Kwon Jai, an elderly high-ranking
    man fond of pleasure, dreams of an old man who begs him not to assist Minister
    Hong, who wishes to kill the old man and his posterity. Kwon wakes to find Hong
    at the door inviting him on a turtle-fishing excursion to Lotus Lake.'
