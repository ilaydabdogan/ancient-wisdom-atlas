  summary: A fierce man beats his mother. After being beaten, she cries to God asking
    why the wicked man is not struck dead. The son then takes a sickle to a buckwheat
    field. A sudden storm arises with thunder, rain, and lightning; villagers see
    a man in the field lifting a sickle as if to ward off the flashes. The supplied
    passage breaks off as villagers go to inspect after the storm.
