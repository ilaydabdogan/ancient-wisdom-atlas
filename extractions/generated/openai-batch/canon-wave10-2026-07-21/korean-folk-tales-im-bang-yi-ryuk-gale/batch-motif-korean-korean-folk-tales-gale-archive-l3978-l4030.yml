canonical_text:
  quote: ''
  summary: The King finds a student alone at a sacred temple after others have left
    for a picnic. The student explains that he stayed so the temple would not be deserted;
    the King tests him with a poetic line, praises his answer, makes him a special
    graduate, publicly honors him, and the student later becomes a noted man through
    royal favor.
  language: English
