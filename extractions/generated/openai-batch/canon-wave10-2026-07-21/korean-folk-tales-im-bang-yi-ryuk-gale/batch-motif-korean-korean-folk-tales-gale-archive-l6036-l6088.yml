canonical_text:
  quote: ''
  summary: 'A narrator recounts repeated magpie nests placed or built to the south,
    followed by promotions for his father and himself, and concludes that magpies
    have spiritual power. The passage then begins another tale: Prime Minister Choi
    Yun-tok, in mourning, travels south with a horse and servant; district magistrates
    think he has failed to show proper manners, question his servant, hear the epithet
    "Old Buddha," and beat the servant for concealing the master''s name.'
  language: English
  quote_policy: summarized
