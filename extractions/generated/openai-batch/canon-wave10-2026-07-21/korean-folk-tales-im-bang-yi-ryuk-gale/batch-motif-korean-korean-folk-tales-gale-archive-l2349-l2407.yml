canonical_text:
  quote: ''
  summary: 'Prince Kim advises that a metamorphosed being, no longer human and not
    yet dead, should not receive burial but should be released into a remote mountainous
    place. The son obeys, then performs mourning rites by burying his father’s clothes
    and marking the day of metamorphosis with sacrificial ceremony. A new tale begins:
    a Confucian scholar’s wife takes in an old begging woman who resembles a Buddhist
    priestess, hires her for food, and finds that she performs far more textile work
    than ordinary women.'
