canonical_text:
  quote: ''
  summary: Prince Pa-song’s house stands just inside the great East Gate, with a large
    Hoi tree before it. At night the prince’s son-in-law passes an archers’ pavilion
    and sees a vast company of bowmen practicing. They accuse him of passing without
    dismounting, bind and beat him. A tall man from their ranks intervenes, calls
    the son-in-law his master, frees him, and leads him home. At the gate, the son-in-law
    sees the tall man go under the Hoi tree and disappear, and learns that the archers
    and the tall rescuer were spirits, with the rescuer coming from the Hoi tree.
  language: English
  quote_policy: summarized
