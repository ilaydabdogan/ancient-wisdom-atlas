canonical_text:
  quote: ''
  summary: In a prison-frame conversation, Captain Choi Won-so recounts a youthful
    experience in a vacant house in Belt Town. A silent woman entered his room at
    night, stood before the lamp, withdrew backward when he tried to grasp her, led
    him through the gate, and vanished. The same event occurred again the next night.
    A few nights later, he heard crackling overhead, saw a curtain lowered to divide
    the room, and saw a large fire of coals descend before him with intense heat.
  language: English
  quote_policy: summarized
