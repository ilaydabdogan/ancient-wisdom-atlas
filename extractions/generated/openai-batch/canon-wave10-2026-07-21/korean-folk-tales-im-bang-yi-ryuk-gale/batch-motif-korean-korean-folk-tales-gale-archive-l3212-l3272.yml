canonical_text:
  quote: ''
  summary: Prince Han persuades a poor relation to remain at his house rather than
    travel. On New Year's Eve the relation says he controls evil genii and must call,
    name, and inspect them. In Han's central guest hall he conducts a roll-call of
    demons with a book and demon guards. Late-arriving demons are arrested and interrogated;
    one says he injected smallpox into a scholar's home, and another begins to explain
    inserting typhus into a gentleman's family.
  language: English
  quote_policy: summarized
