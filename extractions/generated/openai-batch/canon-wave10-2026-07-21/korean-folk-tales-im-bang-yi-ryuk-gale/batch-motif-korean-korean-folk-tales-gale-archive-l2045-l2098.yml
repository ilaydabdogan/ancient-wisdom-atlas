canonical_text:
  quote: ''
  summary: A sick elderly father asks his children to carry him to the river because
    the sight of flowing water refreshes him. After sending them away, he removes
    his clothes, enters the water, changes into a skate and then a great flatfish,
    and departs into the deep sea. The family finds and buries his fingernails and
    a tooth, and thereafter abstains from eating skate.
  language: English
  quote_policy: summarized
