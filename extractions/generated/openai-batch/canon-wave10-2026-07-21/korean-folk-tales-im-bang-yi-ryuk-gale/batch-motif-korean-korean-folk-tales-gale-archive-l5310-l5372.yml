canonical_text:
  quote: ''
  summary: Hong is guided through an afterlife setting, sees a house called the Home
    of the Blessed with Buddhist priests and signs of glory, hears explanations about
    reward and punishment, is sent back by an afterlife scribe, awakens after being
    dead four days, and the narrator closes with moral commentary about learning the
    story's lesson.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed group is described as having appeared holy and beneficent while
    actually living as thieves, deceivers, and robbers, and they are said to be punished.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The guides tell Hong that he need not see all the hells and take him some
    distance to the south-east.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hong sees a great house with a sign identifying it as the Home of the Blessed.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The house is described as encircled by beautiful haloes and clouds of glory.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hundreds of priests are present in cassock and surplice; some carry fresh-blown
    lotus flowers, some sit like the Buddha, and some read prayers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The guides explain that these priests kept the faith, served the Buddha with
    undivided hearts, escaped the Eight Sorrows and Ten Punishments, and now dwell
    in the happy home called heaven.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The golden-faced Buddha tells Hong that few people on earth believe in the
    Buddha or know of heaven and hell, and asks what Hong thinks of it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hong bows low and thanks the golden-faced Buddha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The black-coated scribe orders that Hong be sent away safely, and spirit soldiers
    escort him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the way, Hong awakens with a start and finds that he had been dead for
    four days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Afterward Hong becomes proud and frequently boasts; his age and Second Degree
    of rank occur as the Buddha had predicted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator says Hong's experience looked like a deceptive yarn but was really
    a story to arouse right action, and says not to find fault with the story but
    to learn its lesson.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Yi Tan is quoted as saying that if heaven exists, the Superior Man alone can
    attain it, and if hell exists, the bad man must inherit it.
  category: speech
  evidence_refs:
  - ev:8
