  quote: ''
  summary: A young woman is ordered into the Palace and shows no fear. When King Yon-san
    calls her close, a terrible odor makes him reject her and order her taken away,
    so she escapes undefiled. The passage explains that she had prepared decayed,
    foul-smelling meat and placed it under her arms as a ruse. Those who knew of it
    praised her bravery and sagacity.
