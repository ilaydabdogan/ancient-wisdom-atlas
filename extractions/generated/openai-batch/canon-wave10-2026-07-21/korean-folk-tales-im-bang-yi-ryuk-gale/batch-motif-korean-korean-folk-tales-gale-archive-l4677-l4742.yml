canonical_text:
  quote: ''
  summary: The passage opens with a poem in which a lonely exile at Iron Peak asks
    a passing cloud to carry tears as rain to the palace. The main story says that
    during the Japanese War in Son-jo's reign, Ming forces restored peace, and a Ming
    general attributed victory to Kwan, the God of War. Temples and sacrifices were
    established for Kwan, but the southern temple site was disputed. Yi Hang-bok received
    a private visit from a military-looking stranger whom Yi later identified as a
    messenger of the God of War; the messenger indicated the proper site and warned
    of lasting consequences. Yi secured the approved location for the temple.
  language: English
