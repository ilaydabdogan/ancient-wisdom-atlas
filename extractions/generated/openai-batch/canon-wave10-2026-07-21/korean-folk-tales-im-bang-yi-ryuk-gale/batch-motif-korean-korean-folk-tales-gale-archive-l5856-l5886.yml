canonical_text:
  quote: It was commonly held that the boy was the Too-uk Spirit, but we cannot definitely
    say.
  summary: A boy gives a sarcastic smile, leaves through the gate, and disappears.
    The frightened feast company cancels the feast; people of the house, including
    host and guests, fall ill and many die, especially those who had scolded, tied,
    or beaten him. The narrator reports that people commonly identified the boy as
    the Too-uk Spirit, while withholding certainty. A note generalizes that calamity
    comes when a clan is fated to disappear, and says respectful distance toward a
    great spirit at a feast would have spared the guests; humans and devils are not
    meant to dwell together.
  language: English
  quote_policy: quoted
