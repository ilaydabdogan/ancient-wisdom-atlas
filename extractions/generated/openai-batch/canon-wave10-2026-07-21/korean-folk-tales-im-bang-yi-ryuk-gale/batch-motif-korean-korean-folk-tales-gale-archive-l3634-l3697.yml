  quote: ''
  summary: The passage describes a beautiful supernatural realm, an ascent to a high
    peak overlooking blessed islands and happy souls, the birth of two sons to the
    man and his wife, the man's longing to visit his mother, permission from his wife
    and father-in-law, and the appearance of a restored dead horse and servant at
    the gateway.
