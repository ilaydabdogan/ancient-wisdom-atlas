  text: The man weeps while seated with his wife and explains that he longs to see
    his poor old mother, whom he has not seen for years.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man says he had been a poor countryman and had become the son-in-law of
