canonical_text:
  quote: ''
  summary: A former general named Kim Tok-saing has been dead for more than ten years.
    One night his old friend awakens in fear and reports seeing Kim riding a white
    horse with bow and arrows. Kim says a thief has entered his home and that he has
    come to shoot him; he later returns with a blood-marked arrow and says the man
    is dead. In the morning the friend learns that Kim’s young widow had decided to
    remarry, and that the chosen fiancé entered her home that night, was struck by
    terrible pain, and died before morning.
