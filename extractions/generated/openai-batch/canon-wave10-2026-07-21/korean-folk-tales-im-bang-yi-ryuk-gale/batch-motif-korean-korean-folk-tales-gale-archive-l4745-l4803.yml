canonical_text:
  quote: ''
  summary: The passage introduces Choi Yu-won, whose story is reported to involve
    meeting his mother's ghost. It recounts predictions of his future greatness, his
    inquiry into a transformative law affecting body and soul, his courageous memorial
    concerning diplomatic protocol, his tearful opposition to King Kwang-hai's degradation
    of the Queen Dowager, his sayings about righteous death and moral study, and the
    beginning of an account invoking an old Korean belief that a faithful son's blood
    could serve as an elixir of life for the dying.
  language: English
  quote_policy: summarized
