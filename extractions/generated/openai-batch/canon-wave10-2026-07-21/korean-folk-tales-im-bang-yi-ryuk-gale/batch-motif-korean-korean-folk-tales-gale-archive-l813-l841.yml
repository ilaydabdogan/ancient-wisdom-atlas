canonical_text:
  quote: ''
  summary: After returning to the old world by a path different from the one by which
    he entered, the master marks the entrance with a stake while the servant withdraws
    and disappears. The following year the master cannot find the citadel of the genii,
    encountering only mountain peaks and impassable ravines. In old age he grows younger
    in spirit and dies peacefully at ninety. He recalls that Chang's face never aged
    and his dirty clothing never wore out during fifteen years, signs that should
    have marked him as a strange being.
