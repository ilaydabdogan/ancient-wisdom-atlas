canonical_text:
  quote: ''
  summary: A foul mist repeatedly enters the magistrate's compound. When the expected
    fatal time comes, servants flee, while the magistrate drinks whisky and waits.
    A huge fog-wrapped form with only two visible eyes enters through the gate. The
    magistrate shouts and strikes it with his sword; a thunder-like sound follows,
    the form and smell disappear, and the magistrate later revives or wakes when retainers
    prepare him for burial.
  language: English
  quote_policy: summarized
