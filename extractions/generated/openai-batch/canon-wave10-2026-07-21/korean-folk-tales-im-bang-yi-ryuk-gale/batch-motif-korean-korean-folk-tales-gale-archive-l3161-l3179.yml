  summary: A first-person speaker recounts escaping by striking at grasping hands
    with axes, then being driven by wind onto rocks at sea. Everyone else drowns,
    while he survives by holding boat-timber. A horrible fish bites off his legs before
    he drifts home. He recalls the terror and attributes the disaster to his bad Eight
    Lucky Stars.
