canonical_text:
  quote: ''
  summary: The narrator is kindly entertained by an old man, who asks whether he wishes
    to meet the person most beautiful to him and has her called. The woman is the
    narrator's lost Ta-hong, who says their meeting falls within the three days of
    public celebration and according to their parting agreement. The old man then
    recounts that Ta-hong came voluntarily to his childless household asking to serve,
    faithfully cared for him and his wife, was loved like a daughter, and explained
    that she was an orphan raised by a village woman who had pledged lifelong troth
    to a young master and sought safety until he won honors.
  language: English
  quote_policy: summarized
