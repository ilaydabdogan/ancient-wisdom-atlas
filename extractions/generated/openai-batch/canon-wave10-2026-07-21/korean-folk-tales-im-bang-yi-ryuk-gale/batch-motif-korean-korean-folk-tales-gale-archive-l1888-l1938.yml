canonical_text:
  quote: ''
  summary: 'The passage opens with a fragment about an unnamed man devoted to truth
    and sacred books who rises to be Prime Minister. The main story concerns Prince
    Ha Yun’s old family seat in Keum-chon: a servant opens a flour jar and finds a
    huge snake; the master’s servants break open the jar, kill the snake with clubs,
    and burn it. Fumes from the burning snake fill the house and kill the household
    and later entrants. The family line is left without a representative, the place
    becomes cursed and desolate, a mysterious fire burns the remaining buildings,
    and the vacant site remains known as haunted and avoided.'
  language: English
