  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ta-hong says she knows her coming death with certainty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Four or five days later Ta-hong falls ill, and a day or two after that she
    dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On her deathbed Ta-hong says life is ordered and God decides it, expresses
    no regrets, and asks that her body be buried by her master's side so they may
    be together again in the regions beyond.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: After death, Ta-hong's face is described as beautiful and like the face of
