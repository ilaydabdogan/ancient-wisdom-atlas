canonical_text:
  quote: ''
  summary: Ta-hong, the narrator's beloved wife, foretells her own death, asks to
    be buried near her master so they may reunite beyond death, dies soon afterward,
    and later appears after death to warn him of serious events and finally of his
    own coming departure.
  language: English
  quote_policy: summarized
