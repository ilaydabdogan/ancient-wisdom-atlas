    found and cared for the speaker, after which the group left the haunted house
    permanently. A note explains that a house may be called haunted because hobgoblins
    are in it; goblins withdraw from a good or superior man; Choi saw a goblin and
    was badly injured; and the goblins troubled Choi because he feared them.
