canonical_text:
  quote: ''
  summary: A man rebukes and punishes devils for disobedience, disease-spreading,
    and entering a high official's house, then orders the remaining devils not to
    spread disease. After the devils leave and morning comes, Prince Han asks how
    such authority works. The poor relation explains that as a youth in a mountain
    monastery he treated a mocked old priest kindly; the priest led him by night toward
    a cave, gave him a secret book about devils and spirit-world laws, and demonstrated
    a magic recipe that summoned countless devils.
  language: English
  quote_policy: summarized
