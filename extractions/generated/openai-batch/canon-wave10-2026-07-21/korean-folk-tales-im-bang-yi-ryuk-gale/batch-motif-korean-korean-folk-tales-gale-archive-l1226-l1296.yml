canonical_text:
  quote: ''
  summary: A beautiful woman comes to Chon's house and claims familiarity with him;
    Chon's wife, angered, breaks a crock, revealing a beetle. The visitor becomes
    a bee, stings the beetle, and Chon returns to human form and dies. Yun Se-pyong
    then knows at a distance that his sister in Chulla Province has died, sends funeral
    supplies and a letter by a Konyun-no, and receives an answer within hours despite
    the great distance.
  language: English
  quote_policy: summarized
