canonical_text:
  quote: ''
  summary: Yee Man-ji becomes a captain and settles in North Hamkyong, where former
    officials had died from goblin influences in the official quarters. He chooses
    to repair and occupy the old quarters. At night, three shapeless, black, tree-stump-like
    beings enter and press toward him. The middle one says it is hungry. Yee offers
    food, uses a magic formula and finger-snap, attempts to strike one, and the beings
    depart. The next day he has oxen killed and a sacrifice offered, after which they
    do not return. A note states that men die from goblins chiefly through fear, while
    brave men who strike them survive.
  language: English
  quote_policy: summarized
