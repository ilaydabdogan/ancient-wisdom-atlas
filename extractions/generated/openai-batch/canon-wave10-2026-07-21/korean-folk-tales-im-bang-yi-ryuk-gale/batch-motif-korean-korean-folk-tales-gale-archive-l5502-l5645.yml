canonical_text:
  quote: ''
  summary: The line range contains a short haunted-house vignette in which woodmen
    encounter and wound an uncanny old woman under a tree, followed by the opening
    of “Im, the Hunter.” Young General Im pursues deer into mountain darkness, meets
    a woodman who directs him to an isolated mansion, is fed, led through many gates
    to a lake pavilion, hidden in a tree, and made witness to an aerial sword fight.
    After the woodman’s victory, Im is brought to a grieving beautiful woman, whom
    the woodman rebukes before offering Im the woman and house as a retreat from the
    ordinary world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In South Kettle Town, woodmen passing behind a haunted house in the early
    morning find an old woman sitting and weeping under a tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One man, thinking the old woman an evil bogey, strikes her with a sickle;
    the narrator then calls her a witch, and she rushes into the house appearing only
    about one cubit and a span tall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage note identifies Im Kyong-up as a famous Korean general who fought
    on China’s behalf against the Manchus in 1628 and is worshipped in many parts
    of Korea.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: When young, General Im Kyongwup lives in Tallai, loves hunting, and pursues
    deer on foot with only a sword from Wol-lak Mountains as far as Tai-paik Mountain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Night overtakes Im among chasms, horns, and cliffs, and he asks a woodman
    for the road.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woodman directs Im to a house on a cliff; Im finds an isolated tiled mansion
    that is dark, quiet, apparently deserted, and viewed by him with mistrust.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The same woodman appears at the mansion, asks whether Im has eaten or will
    sleep there, provides wine and meat, then takes a great sword from a wall box.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The woodman denies intending to kill Im and invites him to come see something
    that night if he is not afraid.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: About midnight, the woodman leads Im through a succession of gates to a place
    with water, reflected lights, a high pavilion, and sounds of laughter and talking.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woodman tells Im to climb a large tree near another pavilion, tie himself
    to the trunk with his belt, and remain still.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: From the tree, Im sees the woodman leap across the lake into the pavilion,
    join two seated people, speak of a wager, and vault into mid-air with another
    person.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Im cannot see the combatants, but hears clashing steel and sees flashes of
    fire; later something falls with a thud and the woodman’s voice cries victory.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: While watching from the tree, Im becomes intensely frightened, with his bones
    cold, hair standing on end, chills, and goose-flesh.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: After Im comes down, the woodman takes him under his arm and vaults with him
    into the pavilion.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the pavilion, Im meets a beautiful woman with hair like fleecy clouds;
    her earlier hilarity has changed to grief and tears.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: The woodman rebukes the woman as wicked and says she has caused the death
    of a great man.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: The woodman tells Im that his courage and valour are not sufficient for this
    world, then offers him the woman and the house so he can leave the dusty world
    and live there quietly.
  category: speech
  evidence_refs:
  - ev:10
