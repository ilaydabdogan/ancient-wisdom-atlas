canonical_text:
  quote: ''
  summary: 'The passage first explains how Kim Yu traced a picture back through Prince
    Yi Hang-bok to King Son-jo and understood its willow-tree-and-horse image as a
    sign that Yi Hang-bok should support In-jo''s succession. A new story then begins:
    Kim Yu, a Minister of State, receives a private visit from the son of a nearly
    hundred-year-old relative. The son reports that his father ordered the children
    to close the door while he slept and not enter until called; when no call came,
    they looked in and found him changed into a huge pig. The animal tried to rush
    out, and the family debated whether to keep and care for it or perform a funeral
    and bury it, then sought Kim Yu''s counsel.'
  language: English
  quote_policy: summarized
