canonical_text:
  quote: ''
  summary: Ta-hong and the narrator make a compact to meet again when he has won his
    honours. They part, and he returns home to anxious parents. He studies intensely
    for years in order to meet her again, accepts an arranged marriage without joy,
    wins honours five years after the farewell, and waits anxiously through the three
    days of celebration without seeing her. On the last evening his father sends him
    to call on an old friend; while returning in the dark, he hears the Sillai call
    at the gateway of an old Minister and enters, where the old gentleman puts him
    through exercises and seats him beside him.
  language: English
  quote_policy: summarized
