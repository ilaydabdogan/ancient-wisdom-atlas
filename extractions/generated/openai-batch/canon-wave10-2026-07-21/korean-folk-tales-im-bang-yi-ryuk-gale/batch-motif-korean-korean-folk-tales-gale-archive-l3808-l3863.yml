canonical_text:
  quote: ''
  summary: The passage introduces Song Sang-in as a just Korean official. In the story,
    Song condemns witches or mutang as deceivers and, after becoming magistrate of
    Nam Won County, orders that any witch found there be beaten to death. The witches
    flee to other prefectures. Later, at Kwang-han Pavilion, he sees a woman on horseback
    carrying a witch's drum, has her arrested, and questions her. She admits she is
    a mutang, says she knows of the order, and asks to present a complaint, beginning
    by saying there are true mutangs.
