canonical_text:
  quote: ''
  summary: 'In a haunted house, two dogs become active at midnight, bay at the sky,
    greet a man in ceremonial robes, and accompany him with several multi-coloured
    demons around the house before the demons vanish into a hole beneath the floor.
    By day, witnesses find old household objects and order them burned; the phenomenon
    repeats the next night and the witnesses leave. Two further haunted-house anecdotes
    follow: in one, objects from an Ink Town dwelling are burned and a servant dies,
    causing the graduate to restore the objects and leave; in another, a homeless
    man sees a woman in a blue skirt descend from the loft and departs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two dogs are initially inactive when shouted at, but at midnight they go into
    the court, bay at the sky, and move back and forth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man dressed in ceremonial robes comes round the corner of the house, is
    greeted joyfully by the dogs, ascends to the verandah, and sits down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Five or six multi-coloured demons appear, bow before the robed man, and are
    led by him with the dogs around the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After moving between verandah and court, the apparitional group disappears;
    the devils enter a hole underneath the floor and the dogs return to their quarters.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At daylight the witnesses inspect the floor chinks and find an old worn-out
    sieve and discarded brooms; another broom is found behind the house in the chimney.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A servant is ordered to gather the old sieve and brooms and have them burned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dogs remain lying all day, neither eating nor moving; some witnesses wish
    to kill them but are afraid of their appearance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The same midnight appearance of the dogs, robed man, and devils occurs again
    on the following night, after which the company leaves the next morning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A friend later asks Hugh and Haw about the account connected with Chang, and
    they confirm the story.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a separate Ink Town haunted-dwelling report, people remove an old harp,
    a spirit chair, shoes, and sticks and burn them; before the fire is finished,
    one servant falls down and dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the servant dies, the graduate extinguishes the fire, restores the objects,
    and leaves the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In another report, a homeless man sees a woman in a blue skirt come down from
    the loft and act in an uncanny way; he takes his belongings and leaves.
  category: sequence
  evidence_refs:
  - ev:7
