canonical_text:
  quote: ''
  summary: A folk belief says that a magpie nest built directly south of a home foretells
    promotion for the householder. A poor friend of King T'ai-jong arranges for a
    servant to make an imitation magpie nest before the king; the servant explains
    the device, and the king appoints the poor man. The narrator recalls as a child
    cutting down a branch with a magpie nest, causing the nest and young birds to
    fall, and feeling sorry and afraid.
