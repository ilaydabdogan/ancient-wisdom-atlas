canonical_text:
  quote: ''
  summary: At cock-crow the sea rises, overflows, climbs the mountainsides, and engulfs
    the seashore town before receding at daylight. To-jong bows to the holy man and
    asks to become his disciple, but the holy man says he has no knowledge and only
    knew by accident. The holy man indicates a nearby residence and leaves; when To-jong
    searches the next day, the house is vacant.
