  summary: 'The excerpt presents anecdotes about Yi Hang-bok: a blind fortune-teller
    foretells his greatness; as a child he composes verses on assigned themes and
    a picture; he gives his coat and shoes to an envious poorer boy; his mother redirects
    him from athletic amusements to literary study; and during the Japanese War he
    accompanies the king in flight, impresses a Ming representative, and is consulted
    by General Yang Ho. The excerpt ends mid-account as he goes into exile under Kwang-hai.'
