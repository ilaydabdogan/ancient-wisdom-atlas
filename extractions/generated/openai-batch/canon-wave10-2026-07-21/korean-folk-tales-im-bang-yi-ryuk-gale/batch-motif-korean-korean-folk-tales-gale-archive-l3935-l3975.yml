canonical_text:
  quote: ''
  summary: 'The magistrate concludes that some mutangs are truthful, rewards the woman,
    rescinds his order against witches, and avoids further involvement with them.
    A new tale begins: during King Se-jong’s reign, Confucian College students leave
    for a Spring Festival picnic near a spring. One disregarded country student stays
    behind to guard the sacred precincts. The king sends a eunuch to inspect who remained
    on duty; after hearing that only the country student stayed, the king summons
    him in his ordinary clothes.'
