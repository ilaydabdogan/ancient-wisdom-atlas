canonical_text:
  quote: ''
  summary: A woman who calls herself an honest mutang challenges the magistrate to
    test her. The magistrate asks whether she can summon the spirit of a deceased
    intimate friend. After food, wine, clothing, a mat, magic utterances, and a bell
    are prepared, she speaks as though the friend has come and recounts private memories
    and secrets without error. The magistrate accepts that his friend's soul is present,
    orders a sacrifice, and the friend departs.
  language: English
  quote_policy: summarized
