canonical_text:
  quote: ''
  summary: Im asks the woodman to explain the events before agreeing to his request.
    The woodman identifies himself as an outlaw robber with many houses and women,
    explains that one woman and her lover tried to kill him, says he killed the lover,
    and asks Im to take over the house and woman. He describes the slain lover as
    a gifted cut-tobacco seller from inside Seoul's South Gate, predicts that Im will
    fail in worldly ambition because the Fates have decided it, and again urges him
    to accept the woman and home. Im refuses. The woodman kills the woman with his
    sword. The next day he offers to teach Im sword use before Im goes forth; Im stays
    six days and learns.
  language: English
  quote_policy: summarized
