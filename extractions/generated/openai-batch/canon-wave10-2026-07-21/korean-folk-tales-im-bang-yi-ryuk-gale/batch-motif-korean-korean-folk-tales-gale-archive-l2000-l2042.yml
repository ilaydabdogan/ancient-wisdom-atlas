  summary: 'The passage closes a preceding tale by stating that a few yards of cotton
    cloth appeared metamorphosed before passers-by. It then begins the tale titled
    “The Old Man Who Became a Fish”: a Ko-song magistrate serves skate soup to a guest,
    who refuses it, claims to be fasting from meat, becomes pale and tearful, and,
    when questioned, begins recounting a hidden unhappy experience about his nearly
    hundred-year-old father falling ill with a fever like a fiery furnace.'
