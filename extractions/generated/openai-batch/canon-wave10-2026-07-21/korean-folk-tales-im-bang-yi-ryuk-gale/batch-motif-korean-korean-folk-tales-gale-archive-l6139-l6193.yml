canonical_text:
  quote: Together they took an oath to die rather than to be parted.
  summary: Mo, the daughter of a slave of Prince Ha, marries the scholar An Yun. Prince
    Ha angrily separates her from An and tries to force another marriage. Mo escapes
    back to An, and the couple swear not to be parted. After Prince Ha has her seized
    again, Mo is later found dead by hanging. Months afterward An sees Mo's spirit
    at night near Camel Mountain; she disappears when he takes her hand. An falls
    ill from grief and dies. Later informants recount the story and describe Mo as
    faithful unto death.
  language: English
  quote_policy: quoted
