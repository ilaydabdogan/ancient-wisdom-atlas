canonical_text:
  quote: ''
  summary: A minister recognizes an examination paper as the writing of his son, who
    had vanished three years earlier and had been mourned as dead. The King summons
    the son, hears his confession and story, confirms his examination victory, urges
    the father to forgive him, and orders that Charan be recognized as his lawful
    wife and raised to equal rank. The son receives the winner's crown, and the minister
    receives him back with joy; a palanquin is sent to bring Charan.
  language: English
  quote_policy: summarized
