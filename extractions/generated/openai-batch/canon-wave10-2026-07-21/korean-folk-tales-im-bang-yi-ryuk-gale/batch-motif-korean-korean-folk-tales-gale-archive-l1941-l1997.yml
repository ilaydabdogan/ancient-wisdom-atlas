canonical_text:
  quote: ''
  summary: During the Manchu War of 1636, a group fleeing Seoul encounters mounted
    enemy forces. A calm stranger seated in the road under a pine tree tells them
    to sit beside him. Enemy cavalry pass by killing others but apparently do not
    see the stranger or the people with him. Afterward the stranger refuses to give
    his name or residence and rides away. A later escaped captive reports that the
    army, at that point, skirted great walls and precipitous terrain, though the passage
    breaks off at that phrase.
  language: English
  quote_policy: summarized
