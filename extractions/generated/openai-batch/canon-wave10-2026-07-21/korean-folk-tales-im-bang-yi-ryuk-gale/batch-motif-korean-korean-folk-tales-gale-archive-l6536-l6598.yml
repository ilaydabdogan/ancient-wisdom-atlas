  quote: ''
  summary: Sim, formerly a prodigious boy nicknamed Soondong, rises to become First
    Minister. At age seventy he announces that his final day has come, exhorts his
    associates to serve the king, and withdraws. Later, when a young secretary visits
    him during his reported illness, Sim privately says he is about to die and begins
    explaining a youthful encounter in Seoul with a beautiful dancing-girl named Ta-hong.
  language: English
