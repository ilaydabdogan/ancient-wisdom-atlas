  summary: The passage closes the preceding tale with marriage, long life, and successful
    sons. It then introduces “The Story of Chang To-ryong” with an editorial note
    contrasting Taoist and Buddhist aims and describing three classes of Taoist genii,
    especially lower genii ruling sacred places among hills. The narrative begins
    in King Chung-jong’s reign with an unattractive, dirty beggar in Seoul who is
    about forty and wears his hair like an unmarried boy.
