canonical_text:
  quote: ''
  summary: Yoo, a low-ranking countryman official in Seoul with no prospect of advancement,
    decides to return home. Before he leaves, he asks a palace secretary acquaintance
    to let him see the royal office of the secretaries. The secretary arranges for
    him to enter the palace in the evening, but the secretary is absent, the gates
    close, and Yoo cannot leave. A body-servant hides him overnight. Yoo remains awake,
    considers exploring, and climbs over a broken palace wall caused by the rainy
    season as the supplied excerpt ends.
  language: English
  quote_policy: summarized
