canonical_text:
  quote: ''
  summary: A maiden refuses to be taken as a concubine and threatens to die by her
    sword unless the Governor makes her his real wife. The Governor agrees, performs
    the required marriage rites, and later loves her above his other women. She reproves
    his wrongdoing and gains public praise. Because the first wife and relatives still
    treat her as a concubine, she petitions King Se-jo, who has been visiting the
    household in commoner dress and calls her his little sister. The passage ends
    as the king begins writing a document to decide her case.
