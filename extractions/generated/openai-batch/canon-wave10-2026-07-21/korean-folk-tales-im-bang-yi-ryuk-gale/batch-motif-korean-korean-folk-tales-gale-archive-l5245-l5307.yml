  text: The guides explain that these offenders used their tongues on earth to tell
    lies and separate friends.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:13
  text: The next hell is labelled for deceivers and contains many scores of people.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:14
  text: Ogres cut flesh from the deceivers' bodies and feed it to starving demons
