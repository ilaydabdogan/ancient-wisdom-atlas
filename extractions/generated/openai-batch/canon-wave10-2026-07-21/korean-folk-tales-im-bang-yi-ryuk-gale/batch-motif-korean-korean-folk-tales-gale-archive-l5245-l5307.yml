  summary: A first-person visitor in Hades is told he has been brought there by mistake
    and should inspect the place before returning to tell the world. Guards guide
    him through labelled hells for stirrers of strife, liars, and deceivers, where
    offenders undergo punishments explained as consequences of their earthly actions.
