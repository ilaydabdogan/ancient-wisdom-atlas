canonical_text:
  quote: ''
  summary: The narrator Sim Heui-su recalls Ta-hong after seeing her. About ten days
    later she meets him in the street, identifies him, and arranges a private conversation.
    She says she had seen him previously, admired him, learned his name and reputation,
    and regarded their meeting as divinely appointed. They go to her aunt's quiet
    home, pledge themselves to one another, and agree to postpone their union because
    of family, social, and future-career considerations.
