  summary: A servant identifies a person called Choi the Buddha as Yun-tok, who is
    traveling to his country home in Changwon. The listeners recognize him as the
    Prime Minister, become afraid, dismantle their tent and food arrangements, and
    hurry to make a deep salaam while asking pardon. A narrator note explains that
    the old Buddha was a special name for this famous minister.
