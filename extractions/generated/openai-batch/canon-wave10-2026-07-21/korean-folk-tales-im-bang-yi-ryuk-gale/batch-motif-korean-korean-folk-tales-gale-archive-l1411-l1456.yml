canonical_text:
  quote: ''
  summary: In this excerpt from “The Ill-Fated Priest,” a weak-looking military stranger
    arrives at a stream, hears an officer accuse a powerful priest of attacking him
    and his people, declares that he has long intended to rid the earth of the priest,
    pursues him, shoots him in the chest, pierces and binds his hands, and brings
    him back to the scholar. The archer gives only his residence, not his name. The
    disabled priest is described as a powerful giant, and the scholar’s party kills
    him and leaves rejoicing.
  language: English
