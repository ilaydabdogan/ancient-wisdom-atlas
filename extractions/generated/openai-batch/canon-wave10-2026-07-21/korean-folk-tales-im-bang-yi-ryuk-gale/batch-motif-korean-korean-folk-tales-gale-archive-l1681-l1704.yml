  summary: A prefatory explanation says that highly attained Taoists may call spirits
    and gain spiritual vision when fleshly obstructions, selfish desire, and injurious
    thoughts are removed. It gives sayings about seeing divine or immortal beings,
    night shining with golden light, and wild deer coming down from the mountain.
    The narrative then introduces Ha Sa-gong, an old Taoist of high attainment, whose
    head and shoulders are covered by pigeons while fishing. His wife suggests catching
    one to eat.
