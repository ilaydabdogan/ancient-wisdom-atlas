canonical_text:
  quote: ''
  summary: The passage describes Cheung Puk-chang as a seer of exceptional innate
    learning and perception. He travels to Peking, speaks with foreign peoples without
    preparation, understands animal sounds, perceives events in a distant valley from
    the mountains, and receives revelations as a Taoist. Prophetic envoys from Loochoo,
    guided by a horoscope and an inscribed book, identify him as a foretold Holy Man,
    prostrate themselves, and ask him to teach the Book of Changes in their own language.
    Other envoys also seek him out and hear him speak in their own tongues. The passage
    ends during a question about how he can speak foreign languages without study.
  language: English
  quote_policy: summarized
