canonical_text:
  quote: ''
  summary: The passage first closes a tale in which Kwon realizes that a turtle had
    appeared to him in a dream as an old man and therefore declines to go somewhere,
    saying he is ill; Hong also does not go. A new tale introduces Namnu, a Buddhist
    priest known as Softy, who gives clothing to the cold, is gentle, and asks to
    take the place of people sentenced to flogging. At a function in Pagoda Temple,
    Softy addresses Prince Hong of Yon-san as a great man; Hong strikes him, and Softy
    responds with laughter and a mild complaint that it hurts.
