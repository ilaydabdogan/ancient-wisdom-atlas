canonical_text:
  quote: ''
  summary: A bracketed opening fragment describes Yu-won cutting flesh from his thigh
    and using the blood to prepare a magic dose. The main story describes a Palace
    Secretary who falls asleep while preparing for office and dreams of meeting his
    dead mother on a road near East Palace Street. She says she is going to Yongsan
    for a witches' prayer service and sacrifice, because spirits are satisfied by
    rites with a medium rather than by his household sacrifices. After waking, the
    secretary sends a servant to Yongsan. The servant returns and reports that a mutang
    performing there was possessed by a spirit identified as the secretary's mother
    and recognized him as a servant from her house.
  language: English
  quote_policy: summarized
