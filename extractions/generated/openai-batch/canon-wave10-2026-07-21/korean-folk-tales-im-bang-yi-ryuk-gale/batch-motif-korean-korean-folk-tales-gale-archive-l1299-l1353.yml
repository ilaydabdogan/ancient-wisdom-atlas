  summary: A framed note tells of Tong Chung-so recognizing a weather-predicting visitor
    as a fox or wild cat. In the story, Kim Su-ik studies late at night, asks his
    wife for food, receives roasted chestnuts from her, and then sees another person
    enter who is an exact duplicate of his wife and also carries roasted chestnuts.
    The two women are alarmed and question each other.
