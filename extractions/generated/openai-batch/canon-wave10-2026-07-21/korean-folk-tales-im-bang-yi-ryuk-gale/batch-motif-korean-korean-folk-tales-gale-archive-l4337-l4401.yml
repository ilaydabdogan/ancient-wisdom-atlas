canonical_text:
  quote: ''
  summary: The narrator describes a nocturnal fire-like disturbance that vanishes
    at first cock-crow. On the following night, while alone, he is seized by a stout
    military-clad man, dragged outside, thrown down, and then repeatedly hurled through
    the air between his home and Chulla. A group of military-clad people in the garden
    repeatedly warns the assailant not to hurt him, and one member eventually leads
    the tormentor away.
  language: English
  quote_policy: summarized
