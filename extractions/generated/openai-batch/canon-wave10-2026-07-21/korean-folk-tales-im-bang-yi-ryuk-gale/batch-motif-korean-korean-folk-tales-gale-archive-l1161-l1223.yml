canonical_text:
  quote: ''
  summary: 'The passage closes a prior account with a father saying he unknowingly
    gave a book to a dead man''s ghost, followed by a cited historical notice about
    an unnamed magic practitioner who died in prison and whose coffin was later found
    empty. Editorial notes mention disagreement between accounts and compare transformations
    into beasts or bugs with Buddhism rather than Taoism. The passage then begins
    the story of Yun Se-Pyong: he was a military minister who learned magic from a
    stranger, lived apart from his family, and was associated with secret red-hot
    iron practices. A rival magician, Chon U-chi, could assume another man''s form
    and later changes into a beetle to hide from Yun.'
