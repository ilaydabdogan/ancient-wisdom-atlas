canonical_text:
  quote: '"I want your husband for my partner."'
  summary: An old woman goblin demands the scholar's husband as a partner. After being
    refused, she returns with a decrepit old man. The two enter the house, occupy
    an ancient tablet-box, become unseen but audible, demand food and other things,
    and afflict the scholar's wife and visitors with plague. The wife's children and
    visiting relatives die. The wife is understood to be held prisoner, and when chimney
    smoke ceases after several days, the townspeople infer that she has died.
  language: English
  quote_policy: quoted
