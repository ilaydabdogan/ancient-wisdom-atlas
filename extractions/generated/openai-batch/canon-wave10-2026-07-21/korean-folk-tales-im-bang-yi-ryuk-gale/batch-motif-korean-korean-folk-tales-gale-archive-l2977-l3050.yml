  summary: A half-dressed Governor is hidden in a box. A woman and a separated man
    quarrel over ownership of the box and bring the dispute to the Mayor. The Mayor
    orders the box divided with a saw; the hidden Governor cries out and is exposed,
    causing laughter and shame.
