canonical_text:
  quote: ''
  summary: A grave owner prospers after following the geomancer Yi So-pang's direction.
    Ten years later a visiting stranger warns that the grave site has lost its luck
    and should be changed. The owner consults Yi, who examines the hill with the guest
    and explains that the guest has seen only the Kneeling Pheasant formation, while
    other surrounding features—Dog Hill, Falcon Hill, and Cat River—prevent the pheasant
    from flying away. The guest praises Yi's enlightened sight, and the Yis of Pine
    Hill become a great and noted family.
  language: English
  quote_policy: summarized
