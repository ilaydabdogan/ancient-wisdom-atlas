  quote: ''
  summary: Two eunuchs debate whether wealth and promotion are determined by the king
    or by God. King Tai-jong overhears and sends A with a sealed order to promote
    the bearer, but A is suddenly afflicted by stomach pain and asks B to carry the
    letter. B is promoted, and the king, learning the circumstances, is left in wonder
    and thought.
