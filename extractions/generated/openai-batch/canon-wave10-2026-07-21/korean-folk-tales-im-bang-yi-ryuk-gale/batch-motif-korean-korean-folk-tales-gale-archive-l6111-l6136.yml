canonical_text:
  quote: ''
  summary: Prince Cheung, an aged and respected First Minister, has his home attacked
    by goblins and devils. The beings snatch and crumple a visiting official's hat
    and throw stones, causing confusion at court. Prince Cheung escapes to another
    house, prepares a medicine called salkwi-whan, glossed as kill-devil-pills, and
    offers it in prayer. The goblins depart and do not reappear for several years;
    Prince Cheung remains healthy.
  language: English
