canonical_text:
  quote: ''
  summary: A historical frame introduces Kim Yu and Prince In-jo. King Son-jo has
    his grandchildren write and draw; young In-jo draws a horse, and the picture eventually
    comes into Kim Yu’s possession. Later Prince In-jo, caught in rain, is invited
    into Kim Yu’s house, recognizes the horse picture as his own childhood drawing,
    and meets Kim Yu. Kim Yu’s wife sends unusually fine food because she had dreamed
    that the King stood before their house and recognizes the visitor as the man from
    the dream.
  language: English
  quote_policy: summarized
