canonical_text:
  quote: ''
  summary: A scholar says that he died, went to the other world, and received a commission
    from the listeners' father. After initial rejection, he proves the message by
    accurately describing a missing head button found in a volume of the Book of History.
    The family accepts the message, enters mourning, makes an outer coat, and offers
    it by fire before the ancestral altar. Three days later the scholar and the Pak
    family dream that the King of Hades thanks them for the coat. The passage ends
    with biographical and transmission notes about Pak Oo and Choi Yu-chom.
  language: English
  quote_policy: summarized
