canonical_text:
  quote: ''
  summary: The supplied range begins with a fragment in which birds avoid an unnamed
    person. The main story introduces a man of letters in Imsil who claims control
    over spirits and two demon guards. He enforces a chess-drink wager by calling
    a formula into the air, after which an unseen hand beats the loser. In another
    episode, during a nearby koot exorcising ceremony, he rushes to a bamboo grove
    and says devils from the rite have gathered there and must be driven off. On a
    journey he commands unseen beings in mid-air to release an unidentified female.
    The range ends during a village lodging episode involving sickness, refusal, a
    servant, and women watching through window chinks.
  language: English
