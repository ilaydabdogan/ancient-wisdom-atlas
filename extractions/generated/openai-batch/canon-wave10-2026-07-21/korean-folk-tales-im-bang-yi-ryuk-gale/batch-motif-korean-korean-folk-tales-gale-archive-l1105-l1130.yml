canonical_text:
  quote: ''
  summary: Puk-chang has predicted that the aunt's man will be arrested, pulled from
    his horse, and beaten. The aunt doubts him but writes the day on the wall. When
    the servant returns, she asks about his crossing of Bird Pass and about trouble
    with a yangban; the servant confirms that the event occurred on the recorded day
    and matched Puk-chang's account in detail.
