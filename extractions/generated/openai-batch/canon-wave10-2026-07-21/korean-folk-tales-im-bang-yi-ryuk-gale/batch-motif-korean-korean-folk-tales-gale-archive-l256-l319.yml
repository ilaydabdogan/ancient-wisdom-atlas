canonical_text:
  quote: ''
  summary: Key dong seeks help from a scribe he once saved. The scribe hosts him and
    arranges for him to enter the Governor's inner court as a snow sweeper so he may
    see Charan in the Hill Kiosk. Key dong handles the broom badly, attracting the
    Governor's son's laughter; Charan is called out, sees Key dong briefly, recognizes
    him, withdraws, and later cries. When questioned, she speaks of her low status,
    her long absence from home, her poor mother, and the customary death-anniversary
    offering to her father's spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The scribe first fails to recognize Key dong, then recognizes him, bows at
    his feet, gives him an inner room, food, and respectful treatment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Key dong discusses the possibility of meeting Charan; the scribe says he knows
    no way for Key dong to meet her alone but may be able to let him see her face.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Because snow is being swept daily from the Governor's inner court, the scribe
    proposes that Key dong join the sweepers with a broom to enter the enclosure near
    the Hill Kiosk.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Key dong joins the sweepers early in the morning, enters the inner enclosure
    with a broom, and sweeps badly compared with the practiced workers.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The Governor's son, seated by an open window with Charan near him, notices
    the bad sweeper, laughs, and calls Charan to look.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Charan steps into the open hall, glances once at Key dong, quickly returns
    into the room, and shuts the door; Key dong goes back to the scribe's house in
    despair.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator states that Charan is wise and highly gifted, and that one look
    tells her who the sweeper is.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Charan cries after recognizing Key dong, and the Governor's son asks why she
    is crying.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Charan says she is a low-class woman, has not been home for more than two
    months, thinks of her poor home and mother, and refers to the custom of preparing
    food for a sacrifice to her father's spirit on the anniversary of his death.
  category: speech
  evidence_refs:
  - ev:6
