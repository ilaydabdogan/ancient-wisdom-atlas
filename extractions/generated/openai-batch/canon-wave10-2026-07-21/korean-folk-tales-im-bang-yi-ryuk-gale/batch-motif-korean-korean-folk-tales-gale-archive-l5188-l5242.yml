canonical_text:
  quote: ''
  summary: The passage introduces Hong Nai-pom, his official rank, and a later prediction
    of death. It then recounts an earlier illness in 1594 in which Hong died, was
    prepared for burial, placed in a coffin, and then revived after his body moved.
    Hong reports that in a dream he went to a fearful region with ogres, a black-robed
    scribe, and armed constables. The scribe frames heaven and hell in Buddhist terms
    as places that decide good and evil deeds, accuses Hong of blaspheming Buddha
    and denying a future life, and says he will be sent to hell for ten thousand kalpas.
    Hong protests, and a Buddha appears as the supplied passage breaks off.
  language: English
  quote_policy: summarized
