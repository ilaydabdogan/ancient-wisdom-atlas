canonical_text:
  quote: ''
  summary: A young man enters the inner quarters of a fairy or genii palace for his
    wedding, sees the master's beautiful daughter, completes wedding forms with assistance,
    and enters a richly furnished bridegroom's chamber. The next day his mother-in-law
    hosts a feast with music, dancing, and singing. The young man, formerly from a
    country hut, is overwhelmed by sharing the glory and joys of the fairies. After
    about a year, his wife asks whether he wishes to enter the inner enclosure and
    see as fairies see; he agrees, and she leads him into a special park with green
    hills, springs, and cascades.
  language: English
  quote_policy: summarized
