canonical_text:
  quote: "“By this he knew that she was the fox.”"
  summary: Kwai studies at a public hall late at night after his yamen-boy companion
    has left. An unfamiliar pretty young woman enters, remains silent, and responds
    to his question only by laughing. Kwai suspects she is not a real woman but a
    goblin or fox, carries her on his back into the yamen quarters, and calls for
    help. No one answers; she bites him at the nape of the neck, he identifies her
    as the fox, releases her, and she escapes.
  language: English
  quote_policy: quoted
