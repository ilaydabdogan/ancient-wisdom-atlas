  quote: ''
  summary: Yi Chang, a poor man in Seoul, seeks lodging in reputed haunted houses.
    In one vacant house in Ink Town, he and relatives inspect a locked upper room
    containing old objects, keep watch overnight, hear unseen music and voices, and
    retreat after a blue blade is thrust through a partition. In another haunted house
    in South Ward, the party finds two dogs with fiery red eyes.
