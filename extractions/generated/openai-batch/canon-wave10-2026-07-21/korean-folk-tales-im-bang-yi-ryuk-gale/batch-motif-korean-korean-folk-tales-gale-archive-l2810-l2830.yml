canonical_text:
  quote: ''
  summary: A literary official serving as Governor of Kyong-ju habitually insults
    dancing-girls and taps them with his pipe. The Mayor dislikes his conduct and
    secretly promises a reward to any dancing-girl who can deceive and shame him.
    One young dancing-girl volunteers. The Governor lives near the Confucian Temple
    with one young servant, and the girl begins passing the Temple gateway disguised
    as a common townswoman.
