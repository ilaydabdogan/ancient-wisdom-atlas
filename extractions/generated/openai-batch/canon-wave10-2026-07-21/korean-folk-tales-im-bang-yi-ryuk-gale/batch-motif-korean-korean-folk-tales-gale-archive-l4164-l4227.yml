canonical_text:
  quote: ''
  summary: Yoo returns from the palace precinct to his home. The King has Yoo appointed
    to literary office, but officials repeatedly protest that an unknown or obscure
    person is receiving high rank. Each protest is followed by a still higher appointment,
    culminating in Vice-President of all the Literati. At a royal banquet, ministers
    ask the King why he has acted so. The King orders the Book of Changes brought,
    asks the ministers to explain a difficult passage, receives no answer, and says
    that anyone who understands the book of the sages ought to be promoted.
  language: English
