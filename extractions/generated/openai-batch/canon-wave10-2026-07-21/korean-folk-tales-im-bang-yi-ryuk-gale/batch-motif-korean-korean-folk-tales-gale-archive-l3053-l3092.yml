canonical_text:
  quote: ''
  summary: 'The passage closes the tale of the Boxed-up Governor: a man flees to his
    quarters in the Confucian Temple, leaves the place permanently, and the story
    is still told in Kyongju. It then opens ''The Man Who Lost His Legs'': a Chong-ju
    merchant who travels to Quelpart for seaweed meets an old legless man boarding
    his boat. The old man says he lost his legs after a shipwreck when a great fish
    bit them off, and begins recounting how a gale drove about twenty people to an
    island shore with a high castle and great gateway, where they were exhausted by
    cold and hunger.'
  language: English
  quote_policy: summarized
