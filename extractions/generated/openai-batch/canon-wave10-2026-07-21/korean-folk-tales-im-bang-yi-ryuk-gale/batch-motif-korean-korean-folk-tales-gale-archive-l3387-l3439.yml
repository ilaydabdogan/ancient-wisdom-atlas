canonical_text:
  quote: ''
  summary: The passage opens “The Home of the Fairies.” A young unmarried Confucian
    student from Ka-pyong leaves home for Kang-won Province with a servant and horse.
    In rainy mountain terrain the servant dies suddenly, then the horse dies, leaving
    the traveler lost and weeping. A white-haired old man with striking eyes directs
    him toward a house beyond pines and tells him to follow a stream. After the traveler
    thanks him, the old man disappears. The traveler then approaches a grove of pines
    and bamboo, a wide shallow stream with a white marble-like bed, and a decorated
    house with marble paving.
