canonical_text:
  quote: ''
  summary: A panic-stricken minister runs into King Vikramâditja and reports what
    he learned from two stone he-goats about Naran-Dâkinî. The king goes to the cave
    with Schalû and three ministers, silences the stone he-goats, transforms his companions
    into ritual objects, and plans to tell an old saga while the transformed assistants
    misinterpret it so that the silent Dâkinî may be provoked to correct them. He
    enters in the guise of a traveling king, addresses the contemplative Dâkinî, receives
    no spoken response, and one transformed minister speaks as the altar before the
    king begins his saga.
  language: English
  quote_policy: summarized
