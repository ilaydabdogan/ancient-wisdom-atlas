canonical_text:
  quote: ''
  summary: A minister uses an invisibility cap to follow the Khan's wife to a private
    palace, where she prepares a perfumed fire ritual and meets Cuklaketu, a divine
    being who arrives as a many-coloured bird and becomes human. Cuklaketu later comes
    to the Khan's court disguised as a swallow, but the minister traps him in fire
    and the Khan nearly kills him. The Princess saves the swallow, but Cuklaketu is
    injured and later tells her he can no longer visit; afterward she becomes more
    attached to her husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Minister put on a cap that made him invisible and followed the Khan's
    wife into a richly furnished apartment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Khan's wife changed into more splendid apparel, including silk, jewels,
    and pearls, and prepared for an expected event.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Khan's wife lit a sandalwood fire on a porphyry circle, scattered odoriferous
    powders over it, and uttered words the Minister could not understand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A beautiful many-coloured bird entered through the window, circled three times
    in the scented vapour, and changed into Cuklaketu, described as a beautiful son
    of the gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cuklaketu and the Princess embraced and feasted together on the prepared banquet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cuklaketu asked the Princess about the husband heaven had appointed her, and
    she answered that her husband was still young and she did not yet know his merits
    or defects.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a later meeting, Cuklaketu said he would visit in the form of a swallow
    and perch on the Khan's throne; the Minister reported this to the Khan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Minister instructed the Khan to keep a great fire before the throne while
    the Minister, invisible, watched for the swallow and seized it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In court, a swallow perched on the Khan's throne; the Minister seized it by
    the tail feathers and flung it into the fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Khan drew his sword to kill the swallow, but the Princess held his arm,
    allowing the swallow to escape with singed wings; she then fainted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: On a later visit, Cuklaketu arrived painfully and feebly, changed from bird
    disguise to human form, and showed blisters and scars.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Cuklaketu told the Princess that his injured human body and bird feathers
    made further visits impossible, and that the Khan had won her from him by superior
    might.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: After Cuklaketu departed, the Princess became more attached to her husband,
    and the Khan rejoiced in the Minister's sagacity and faithfulness.
  category: sequence
  evidence_refs:
  - ev:10
