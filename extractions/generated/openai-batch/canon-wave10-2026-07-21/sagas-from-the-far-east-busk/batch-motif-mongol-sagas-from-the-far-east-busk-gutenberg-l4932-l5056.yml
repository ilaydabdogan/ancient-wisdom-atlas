canonical_text:
  quote: ''
  summary: Shanggasba gains an audience with the King by sounding a royal trumpet
    and asks to marry the Princess. The King spares and lodges him despite objections
    from ministers, Queen, and Princess. A token in Shanggasba's boots meets the Princess's
    stated standard and makes the King regard him as uncommon. The Queen sets him
    a martial task against an invading enemy. His appointed army abandons him, and
    while trapped in a forest by an uncontrollable horse, he accidentally uproots
    a tree whose roots strike down many enemy riders.
  language: English
  quote_policy: summarized
