canonical_text:
  quote: ''
  summary: A turbulent man remains in the upper storey of a fortress with his mother
    and son while the Khan's fire rises below. He uses a goat-leather bag from the
    highest turret to produce rain, first extinguishing the fire and then causing
    an inundation that washes away the fire and bellows and endangers the Khan and
    people. The water forms a deep moat around the fortress, making the man secure.
    In the frame narrative, the Khan remarks that magic has prevailed over sovereign
    power, and the Siddhi-kur announces that the Khan has spoken and flies away.
  language: English
