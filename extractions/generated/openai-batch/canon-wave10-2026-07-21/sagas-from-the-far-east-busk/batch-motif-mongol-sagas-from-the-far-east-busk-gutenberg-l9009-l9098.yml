canonical_text:
  quote: ''
  summary: Editorial notes discuss alleged identifications between Hindu Trimurti
    and Krishna worship and Christian doctrines, then identify the tale collector
    as Madhyamika through an invocation of Nâgârg'una and summarize traditions about
    Nâgârg'una, including his Buddhist patriarchal status and a posthumous serpent-Paradise
    tradition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports Lassen dating the introduction of Trimurti worship to
    1420-1445 and describing it as an attempt to assert the equality and unity of
    Brahma, Vishnu, and Shiva.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Ganesha, described as god of wisdom and knowledge, appeared
    to Laxmana and instructed him to build a temple on the banks of the Penar to Hiranjagarbha,
    identified with Brahma, Vishnu, and Shiva.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Crishna's name, attributes, and substitution for Vishnu
    present many analogies with Christian teaching concerning the author's Divine
    Lord.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage summarizes Weber's claim that travelling Brahmans encountered
    early Christianity and brought back teaching about a Supreme God and Christ, identifying
    it with Crishna Devakiputra.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the prominence of Devaki and passages in a late Purana recall
    Christian traditions of the Virgin and Child and lack counterparts in earlier
    Indian writings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says later schools emphasized Nanda the herdsman as Crishna's
    father, while earlier Crishna legends emphasized his warrior and heroic character.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists several dates and cultic references for Crishna worship,
    including a temple destroyed in 1017, a silver statue with gold armour in Lalitâditja's
    temple, a twelfth-century Gitagovinda, a 1288 inscription, and later diffusion
    to Orissa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage infers that the original collector of the tales was a Madhjamika
    because he begins with an invocation of Nâgârg'una, called the second teacher
    in relation to Shâkjamuni.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage presents Nâgârg'una as a Buddhist patriarch, born in South India,
    educated as a Brahman, and associated with a treatise on Buddhist theology, while
    also noting conflicting dates for his life.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A cited Cashmere chronicle describes Nâgârg'una as a Bodhisattva, supreme
    head of the earth, possessing the power of six Archats, and protecting Buddhists.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says Chinese Buddhists called Nâgârg'una Lung-shu because after
    death he was taken up into serpent-Paradise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage introduces a legend about Nâgârg'una's conversion from Brahmanism
    but does not narrate it in this excerpt.
  category: sequence
  evidence_refs:
  - ev:7
