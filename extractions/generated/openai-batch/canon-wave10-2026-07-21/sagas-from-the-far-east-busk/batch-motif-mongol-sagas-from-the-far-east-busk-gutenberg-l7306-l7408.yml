canonical_text:
  quote: ''
  summary: Prince Vikramâditja, intending to rob a merchant caravan, overhears Schalû
    interpret wolves' speech and concludes the youth has supernatural knowledge. The
    merchants follow the warning and avoid a flood. Later the wolves identify themselves
    as Schalû's protectors from birth, warn of the lurking robber, and reveal a corpse
    containing the Tschin-tâmani jewel in its right thigh. Vikramâditja steals the
    jewel first, then disguises himself as a merchant, plants marked goods in the
    merchants' tents, and accuses them before the king. Royal envoys search the tents
    and find the planted goods, causing the merchants to despair.
  language: English
  quote_policy: summarized
