canonical_text:
  quote: ''
  summary: The preface discusses tracing the migration of household tales, citing
    Benfey’s view that many tales came from the East and spread through Europe by
    Turkish and Mongolian routes. It advises comparing resembling tales for both analogy
    and local difference, characterizes tales as life-pictures mixed with fantastic
    or supernatural elements, and gives Vikramaditja as an example of a hero whose
    education includes both admired and morally disapproved skills. The passage closes
    with an authorial apology for possible inaccuracies.
