canonical_text:
  quote: ''
  summary: In the frame narrative, the Well-and-wise-walking Khan again captures the
    Siddhî-kür, who begins a tale. In the embedded tale, a jealous painter named Ânanda/Kun-dgah
    forges a message from a dead Khan supposedly reborn in the gods' kingdom, claiming
    that the gods' temple needs Ânanda the wood-carver. The reigning Khan orders the
    wood-carver to go. The painter prescribes a public fire-and-smoke ascent, but
    the wood-carver's wife prepares an underground escape passage beneath a flat stone.
    During the rite, dense smoke hides the wood-carver's escape, while the painter
    and the crowd believe his spirit has ascended.
  language: English
  quote_policy: summarized
