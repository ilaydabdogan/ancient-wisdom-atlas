canonical_text:
  quote: ''
  summary: An escaped junior student shelters beneath a tree and overhears birds explain
    that the Khan plans to execute a thousand wise men because they cannot interpret
    the word Abaraschika. The birds give the word’s meaning as an accusation of murder
    by a bosom friend. The student brings this knowledge to the confined scholars,
    interprets the word for the Khan, and the scholars are released with gifts under
    an order of secrecy. The Khan then has the minister’s son reveal the bones of
    the Khan’s son, builds a tomb, and orders the minister and his son executed. When
    the Khan speaks a lament, Siddhî-kür remarks that the Khan has opened his lips
    and flies away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A student of inferior status had escaped because he was under less strict
    guard than the more important students.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night the student took shelter under a leafy tree where a bird and its
    young roosted above him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: One young bird complained of hunger, and a parent bird said there would be
    plenty of food the next day because the Khan had prepared to put a thousand men
    to death.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The father bird said the men were to die because, although wise, none could
    tell the Khan the meaning of the word Abaraschika.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old bird gave Abaraschika’s meaning as a statement that a bosom friend
    had enticed the speaker into a thick grove, wounded him with a sharp knife, taken
    his life, and was preparing to cut off his head.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After hearing the meaning, the young student ran to the tower where his companions
    were confined and told them he had discovered the meaning of the word.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Khan’s guard came to conduct the confined men to the Khan for examination
    before execution.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The young student declared the meaning of Abaraschika to the Khan, who dismissed
    all the men with rich presents and privately ordered them not to tell anyone the
    meaning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Khan sent for the minister’s son, made him show where the bones of the
    Khan’s son lay, built a tomb over them, and ordered the minister and his son to
    be put to death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Khan lamented that his son, versed in the five kinds of knowledge, would
    have honored the kingdom if he had not been cut off early.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the Khan spoke, Siddhî-kür said the Khan had opened his lips, cried
    that escape from this world was good, and sped through the air out of sight.
  category: sequence
  evidence_refs:
  - ev:8
