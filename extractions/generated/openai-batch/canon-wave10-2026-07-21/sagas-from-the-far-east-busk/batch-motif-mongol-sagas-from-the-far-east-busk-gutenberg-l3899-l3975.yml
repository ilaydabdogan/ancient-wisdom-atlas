canonical_text:
  quote: ''
  summary: Three animal companions pursue travelling merchants to recover their master's
    talisman. The mouse scouts the caravan leader's room, where the talisman is tied
    to an arrow in a heap of rice and guarded by cats. The ape devises plans that
    enable the mouse to distract the guards, free the talisman, and be pulled back
    through the keyhole with it. On the return journey, the bear boasts while crossing
    a stream and threatens the others; the ape speaks and drops the talisman into
    the water. On shore, after a quarrel, the mouse says she knows another means to
    act.
  language: English
  quote_policy: summarized
