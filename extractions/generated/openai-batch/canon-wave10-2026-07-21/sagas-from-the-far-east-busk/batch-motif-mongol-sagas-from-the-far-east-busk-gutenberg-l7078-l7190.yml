canonical_text:
  quote: ''
  summary: 'A young child’s message compares the maturation of royal sons to peacocks
    and parrots and states that a universal ruler should host a great sacred banquet.
    Gandharva hears the message, recognizes the child as a Bodhisattva, repents, and
    searches for him. In a grotto in a grove he finds eight serpent-god princes caring
    for the child with lotus blossoms, honey, and reverence. Gandharva brings the
    child home and proclaims him Prince Vikramaditya. The Suta then uses the tale
    to test Ardschi-Bordschi’s worthiness to mount the throne; sculptured figures
    block him and demand that he hear more. The next tale begins: Gandharva leaves
    his body beneath a Buddha image while going to fight a prince of the Schimnus,
    and his younger wife, attracted to his radiant bodyless appearance, considers
    burning the abandoned body.'
  language: English
  quote_policy: summarized
