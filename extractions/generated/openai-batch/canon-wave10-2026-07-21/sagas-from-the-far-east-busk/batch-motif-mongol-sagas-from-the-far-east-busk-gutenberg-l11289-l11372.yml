canonical_text:
  quote: ''
  summary: 'Editorial note identifying Ardschi-Bordschi with King Bhoga and summarizing
    Bhoga-related dynastic and legendary material: Prāmāra fire-born genealogy, legendary
    accession and throne traditions, inscriptional praise and reversal, and a tale
    in which a punished hermit transfers Bhoga''s soul into a parrot, usurps the king''s
    body, and is killed through a princess''s intrigue so Bhoga regains his form and
    kingdom.'
