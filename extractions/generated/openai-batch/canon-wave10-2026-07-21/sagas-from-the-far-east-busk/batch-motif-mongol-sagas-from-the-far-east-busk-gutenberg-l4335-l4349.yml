  summary: The Well-and-wise-walking Khan, having failed again in his mission, returns
    to the shady grove, captures the Siddhî-kür in a sack, and carries him through
    a desert. The Siddhî-kür asks for a tale to pass the journey and instructs the
    silent Khan to nod backward if he wants one told. The Khan nods, and the Siddhî-kür
    begins a tale.
