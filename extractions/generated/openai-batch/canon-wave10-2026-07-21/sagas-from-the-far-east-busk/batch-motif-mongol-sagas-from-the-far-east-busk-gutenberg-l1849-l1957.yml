canonical_text:
  quote: "“I am a soothsayer come to divine the place where lies the Khan's talisman.”"
  summary: A lazy husband is urged by his industrious wife to seek employment. After
    accidentally finding butter at an abandoned herdsmen's camp, he sets out with
    hunting gear, loses all his possessions while chasing a fox, and hides naked under
    straw in a Khan's stable. He witnesses the Khan's daughter drop a life-preserving
    talisman and sees it swept onto a dung-heap. When a public search and divination
    summons is announced and stable workers find him, he claims to be a soothsayer
    able to locate the talisman.
  language: English
  quote_policy: quoted
