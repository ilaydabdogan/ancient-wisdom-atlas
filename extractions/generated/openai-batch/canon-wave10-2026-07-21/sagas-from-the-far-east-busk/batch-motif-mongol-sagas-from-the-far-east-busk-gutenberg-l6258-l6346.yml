  summary: The passage is an expository discussion of Indian mythic and historical
    writing. It says divine stories were often treated as more important than records
    of earthly kings; Brahmans are described as largely temple-, family-, or disciple-focused;
    regional chronicles such as the Kashmir Chronicle and the Karnâtaka Râgakula are
    evaluated; Buddhist Sûtra literature is described as historically important but
    not free from inaccuracy, fabulous incidents, transmigrations, and interpolations;
    and the Purâna and Mahâ Bhârata are said to deserve comparatively greater reliance.
  language: English
  quote_policy: summarized
