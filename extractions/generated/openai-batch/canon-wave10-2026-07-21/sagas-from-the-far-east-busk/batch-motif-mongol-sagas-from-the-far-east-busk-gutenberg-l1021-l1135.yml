canonical_text:
  quote: ''
  summary: The Prince obtains an invisibility cap from boys and wish-transporting
    boots from dæmons by offering to judge races while holding the disputed objects.
    He and his follower use the boots to reach a land without a Khan, wake inside
    a hollow ancient tree at the site of a royal election, and are discovered when
    a divinatory Baling-cake falls into the tree. The Prince spits gold coins and
    his follower spits emeralds; amid the people's gathering of these treasures, they
    install themselves as Khan and Chief Minister. The new Khan marries the daughter
    of the last Khan, but she appears emotionally attached elsewhere and secretly
    visits an unused palace every third day, which the Minister resolves to investigate.
  language: English
  quote_policy: summarized
