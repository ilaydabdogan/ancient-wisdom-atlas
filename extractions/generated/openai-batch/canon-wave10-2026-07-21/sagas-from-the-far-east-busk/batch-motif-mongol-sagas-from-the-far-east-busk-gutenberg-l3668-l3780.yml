canonical_text:
  quote: ''
  summary: 'A frame episode closes when the Well-and-wise-walking Khan speaks and
    the Siddhî-kür escapes through the air. The Khan fetches him again, and the Siddhî-kür
    tells a tale about a ruler, Küwôn-ojôtu, who tests Gegên-uchâtu by ordering him
    to steal the royal talisman. Gegên-uchâtu intoxicates and confuses the guards
    and servants, steals the talisman, returns it, is unjustly condemned anyway, and
    then breaks the talisman, causing the Khan to bleed and die. The frame repeats:
    the Well-and-wise-walking Khan comments, and the Siddhî-kür escapes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the Well-and-wise-walking Khan speaks at the end of the preceding tale,
    the Siddhî-kür says he has opened his lips and flies away through the air.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Well-and-wise-walking Khan goes out again, fetches the Siddhî-kür, and
    the Siddhî-kür begins another tale.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The inner tale is set long ago in a fruitful country called Flower-clad, ruled
    by Khan Küwôn-ojôtu, with trees, crops, streams, a river called The Golden, and
    cities along its banks.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Khan Küwôn-ojôtu summons Gegên-uchâtu, who is renowned for understanding,
    and challenges him to steal the Khan's talisman under threat of punishment if
    he fails.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: On the fifteenth night of the month, the Khan binds the talisman to a marble
    pillar in his bedchamber, leaves the door open, and surrounds the area with guards.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Gegên-uchâtu gives rice-brandy to the Khan's guards and servants until it
    takes effect.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the guards are asleep, Gegên-uchâtu places gate guards astride a ruined
    wall and prepares tricks involving a grass cap and three stones in the kitchen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gegên-uchâtu enters the Khan's apartment, places a dried bladder over the
    Khan's head and face, ties sleeping guards' hair together, removes the talisman,
    and leaves with it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Khan's attempts to stop the thief are frustrated by the tied hair of the
    guards, the confusion in the kitchen, and the outer guards spurring the ruined
    wall on which they have been placed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The next day Gegên-uchâtu returns before the Khan with the talisman and says
    he took it only according to the Khan's command.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Khan refuses to take back the talisman but condemns Gegên-uchâtu to be
    beheaded because the bladder trick frightened him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gegên-uchâtu judges the sentence unjust, dashes the talisman against a stone,
    and the Khan bleeds from the nose until he dies.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Well-and-wise-walking Khan says that the dead Khan was not fit to reign;
    the Siddhî-kür again says he has opened his lips and flies away.
  category: sequence
  evidence_refs:
  - ev:11
