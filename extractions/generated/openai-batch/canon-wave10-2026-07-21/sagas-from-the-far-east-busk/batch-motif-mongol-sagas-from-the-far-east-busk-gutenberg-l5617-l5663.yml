canonical_text:
  quote: ''
  summary: A youth explains that illness forced him to release a royal secret into
    a marmot hole without betraying the Khan directly. The Khan spares him and asks
    how to hide his ass-like ears. The youth advises a high cap with lappets; the
    Khan adopts it, others imitate it, and the secret remains hidden. The Khan stops
    killing hair-combing youths, appoints the widow's son steward, and the son acts
    prudently with his mother's advice. In the frame, the listening Khan speaks; Siddhî-kür
    declares that he has opened his lips and escapes through the air.
  language: English
  quote_policy: summarized
