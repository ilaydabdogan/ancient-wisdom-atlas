    fire-burnt pile.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After seven days, the people, Khan, officers, and ministers assemble; Kun-dgah
    is placed in the middle of a spirit-soaked wooden pile, solemn instruments sound,
    and the pile is set on fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kun-dgah expects to rise on clouds of smoke, but instead suffers pain, cries
    for release, is not heard because of the instruments, and dies in the flames.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Prince says the bad man was rewarded according to his deserts; the Siddhî-kür
