- id: obs:3
  text: The Khan asks how the Wood-carver has returned from the gods' kingdom and
    asks about his father All-knowing the Khan.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The forged letter claims that Ânanda has completed work on a temple above
    and asks that Kun-dgah the painter be sent by the same way to adorn it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Khan accepts the letter as his father's words, rewards Ânanda, and summons
    Kun-dgah the painter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kun-dgah is afraid, but after seeing Ânanda white from milk-washing and dressed
