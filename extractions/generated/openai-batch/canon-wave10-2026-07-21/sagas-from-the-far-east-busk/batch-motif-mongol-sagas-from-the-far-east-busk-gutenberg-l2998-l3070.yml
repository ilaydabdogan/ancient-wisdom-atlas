canonical_text:
  quote: ''
  summary: Ânanda the wood-carver prepares the appearance of having returned from
    the gods' kingdom, delivers a forged letter to the Khan, and causes Kun-dgah the
    painter to be summoned for the same supposed journey. Kun-dgah, persuaded by Ânanda's
    appearance, accepts. He is placed on a pyre amid loud instruments and dies when
    his cries are not heard. In the frame narrative, the Prince comments on the justice
    of the death, whereupon the Siddhî-kür notes that the Prince has spoken and flies
    away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Wood-carver stays at home for a month, is seen only by his wife, washes
    himself with milk, avoids the colored light of the sun, and later covers himself
    with white gauze.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Wood-carver writes a feigned letter and brings it to All-protecting the
    Khan.
  category: action
  evidence_refs:
