canonical_text:
  quote: ''
  summary: 'The Minister uses an invisibility cap to observe hidden wrongdoing and
    learn arts. In a closed temple he sees a servant use a painted donkey roll and
    a fivefold dance to become a donkey and then return to human form. The Minister
    takes the roll and deceives a woman and her daughter, who sell strong drink, by
    claiming it produces gold. They intoxicate him, steal the roll, and transform
    themselves into asses. The Minister brings them to the Khan, who orders them to
    carry heavy burdens as punishment. After five years the Khan stops the punishment,
    and the Minister restores their human form, though they remain withered. A framing
    interruption follows: the Khan speaks, the Siddhî-kür says he has opened his lips,
    and escapes through the air.'
  language: English
  quote_policy: summarized
