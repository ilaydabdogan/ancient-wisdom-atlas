canonical_text:
  quote: ''
  summary: The Well-and-wise-walking Khan resumes his journey after missing its goal,
    reaches the cool grove of the child-dead where the Siddhî-kür is found, compels
    him down from a mango-tree by threatening the tree, binds him in a many-coloured
    bag, and carries him toward Nâgârg'una. During the journey the Siddhî-kür tries
    to induce conversation; the Khan remains silent because of his teacher's command,
    but nods permission for the Siddhî-kür to tell a tale.
  language: English
  quote_policy: summarized
