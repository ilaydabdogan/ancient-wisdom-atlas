canonical_text:
  quote: ''
  summary: The Well-and-wise-walking Khan recaptures the Siddhî-kür, who tells of
    Shanggasba, a poor son instructed by his father to bury the father's bones in
    an ancestral forest clearing to restore family fortune. After the burial brings
    no wealth, the son becomes a weaver, kills and eats a lark at the burial place,
    burns his loom, sets out to seek the Indian princess as bride, eats ritual offerings
    before a Garuda image, steals its silk adornments, and demands entry at the king's
    palace but is rebuked by the porter.
  language: English
  quote_policy: summarized
