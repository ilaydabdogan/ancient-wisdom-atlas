canonical_text:
  quote: ''
  summary: Editorial notes explain several objects, names, cosmological ideas, ritual
    settings, and animal images associated with tales of the pretended son, Ardschi-Bordschi
    discovering Vikramâditja's throne, and Vikramâditja's birth. The notes identify
    the diamond or vajra as a royal and priestly emblem, interpret Vikramâditja's
    throne as a sign of ancient wisdom for kings, describe conch trumpets, bardic
    transmission, Buddhist classes of beings, sacred grottos and relic shrines, Mongolian
    tea, sacred birds, Indian cosmogony, religious festivals, parrots in Indian fable,
    and the term Bodhisattva.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The diamond, identified with Sanskrit vadschra/vajra, is described as originally
    the thunderbolt and Indra's sceptre, later the priests' praying-sceptre, and a
    symbol of durability, immovability, and indestructibility; its possession is said
    to be permitted only to kings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A silver statue in a temple founded by Lalitâditja, King of Cashmere, is described
    as wearing a bright golden cuirass that gave forth light like a river of milk.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The editor states that the story of Vikramâditja's throne presents the wisdom
    of the ancient hero as a model and guide for later kings and dynasties.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The shankha or conch is described as an early trumpet used in war, mentioned
    in heroic poems, associated with Crishna and Vishnu, and still used to announce
    festivals in Mongolia.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Sûta is identified as a bard responsible for preserving myths and heroic
    tales, and also as a charioteer of kings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Six classes or stages of living beings are listed as states through which
    Buddhahood is to be attained: devas, asuras, men, beasts, pretas, and hell-gods.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A kaitja or chaitga is described as a sacred grotto where relics were preserved,
    or as a marker for a place where an ancient remarkable event occurred.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:8
  text: King Ashokja is said to have caused kaitjas to be built or hewn at places
    made sacred by acts of Shâkjamuni and over relics of early teachers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ashokja is said to have opened seven shrines containing Shâkjamuni's relics,
    divided the relics into precious caskets, endowed towns with them, and built kaitjas
    over them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mongolian tea is described as made from pressed tea bricks, boiled with salt,
    and mixed with milk.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Kalavinka is identified with a sacred order of birds and, in this note,
    with the Kokila or Indian cuckoo.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:12
  text: The note explains that the four parts of the universe belong to Indian cosmogony
    and concern distribution among gods of various orders and humans, with humans
    assigned Gambudvîpa.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:13
  text: A religious festival held by Aravâla, King of Cashmere, is described as celebrating
    acceptance of Shâkjamuni's teaching as the religion of his dominion, with large
    numbers of demigods, priests, and people present.
  category: action
  evidence_refs:
  - ev:14
- id: obs:14
  text: The parrot is said to have a prominent place in Indian fable because of sagacity,
    companionable nature, and long life; Brahmans are said to esteem parrots highly,
    and princes to keep them.
  category: attribute
  evidence_refs:
  - ev:15
