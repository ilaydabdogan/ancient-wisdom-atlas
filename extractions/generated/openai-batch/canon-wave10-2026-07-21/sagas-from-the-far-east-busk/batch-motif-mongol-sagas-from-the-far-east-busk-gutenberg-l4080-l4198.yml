canonical_text:
  quote: ''
  summary: A poor elder brother, excluded by his wealthy younger brother, leaves intending
    to die. In a forest by a stream and rock cleft, he sees Dakinis use a sack and
    hammer to produce food, drink, and ornaments. After they leave, he takes the sack
    and hammer, uses them to gain food and household wealth, and returns home. The
    younger brother forces him to reveal the source, goes to the same place, and is
    seized by angry spirits/Dakinis who accuse him of stealing their bag and hammer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two brothers live in a city of Western India; the elder has no inheritance
    and lives poorly by selling herbs and wood, while the younger is wealthy and gives
    him none of his riches.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger brother gives a great entertainment for rich neighbours and acquaintances
    but does not invite his elder brother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder brother's wife says it would be better for him to die than live
    dishonoured; he agrees, takes a hatchet and cord, and goes out toward the forest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder brother passes over mountains, comes near a forest stream with savage
    beasts by the water, avoids the water, and reaches the stream's head by a huge
    rock where Dakinis are dancing.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: One Dakini retrieves a large sack from a cleft in the rock, takes a hammer
    from it, strikes the bag, and desired food and drink appear at the mouth of the
    sack.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the Dakinis eat and drink, hammering the bag produces gold and silver
    trinkets, diadems, arm-bands, nûpuras, ornaments, pearls, precious stones, and
    gems; the bag and hammer are then hidden again in the rock cleft before the Dakinis
    fly away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the Dakinis are far away, the elder brother ties felled trees together
    with his cord, climbs to the rock cleft, and brings away the hammer and bag.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The elder brother tests the bag by striking it with the hammer and wishing
    for food; he later returns home and uses it to obtain clothes, household furniture,
    food, and other desired things.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The younger brother and his wife suspect that the elder brother's new wealth
    has been stolen; the younger brother threatens him with punishment before the
    Khan until the elder reveals the story and the location.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The younger brother takes a cord and axe to the place, sees deformed ugly
    spirits in eight rows by the rock, is detected, is accused of being the one who
    stole the bag and hammer, and is seized by the Dakinis.
  category: sequence
  evidence_refs:
  - ev:9
