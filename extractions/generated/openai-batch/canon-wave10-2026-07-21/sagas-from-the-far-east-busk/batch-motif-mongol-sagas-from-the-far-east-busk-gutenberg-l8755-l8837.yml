  summary: The passage is an explanatory note on the compilation and transmission
    of Buddhist scriptures. It describes a seven-month synod compiling the Tripitaka,
    later oral preservation and writing of sacred books in the cave Aloka in Lanka,
    evidence concerning memory and writing in ancient India, Shakyamuni’s social and
    ethical teaching against caste exclusiveness, and the later relation of Buddhist
    texts to Brahmanical gods and mythology.
  language: English
