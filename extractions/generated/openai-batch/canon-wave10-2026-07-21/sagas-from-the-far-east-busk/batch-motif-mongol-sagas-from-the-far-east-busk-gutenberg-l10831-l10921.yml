  summary: Editorial notes to Tales XXI and XXII compare Tale XXI with Kletke's Wunderharfe
    and King Midas, explain several Mongolian or Chinese terms, discuss pearls and
    Crishna, and give an extended comparative note on serpent-gods, the White Serpent-king,
    reptile and amphibian forms, European dragons, Tirol white-serpent legends, dragon
    combats, blocked water supplies, and differing Indian and Christian treatments
    of serpent figures.
