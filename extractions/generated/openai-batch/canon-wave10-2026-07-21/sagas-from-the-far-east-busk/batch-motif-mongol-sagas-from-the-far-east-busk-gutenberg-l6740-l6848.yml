canonical_text:
  quote: ''
  summary: A minister’s son returns from war, but an identical second claimant appears
    and asserts the same family ties. King Ardschi-Bordschi tests the claimants by
    ancestral knowledge and wrongly accepts the demonic impostor. The Boy-king overturns
    the judgment by setting a test that requires entering a small water-jug; the Schimnu
    transforms, enters the jug, and is sealed inside with a diamond-seal. The Boy-king
    sends the captive impostor and a written rebuke back to Ardschi-Bordschi.
  language: English
  quote_policy: summarized
