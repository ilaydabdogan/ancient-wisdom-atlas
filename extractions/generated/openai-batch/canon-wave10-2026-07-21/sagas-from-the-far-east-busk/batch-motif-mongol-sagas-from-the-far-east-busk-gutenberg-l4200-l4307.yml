canonical_text:
  quote: ''
  summary: Dakinis choose to punish an avaricious brother by lengthening his nose
    and tying nine knots in it. Ashamed, he hides, seeks help from a Lama, and learns
    that only his elder brother's hammer and bag can undo the knots. The elder brother
    agrees to help in return for half the man's wealth, but the man's wife tries to
    stop the cure after the eighth knot to avoid paying the full reward.
  language: English
  quote_policy: summarized
