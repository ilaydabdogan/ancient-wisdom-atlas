canonical_text:
  quote: ''
  summary: A Khan instructs his wife to go south by full moon, propitiate a sequence
    of guardians with appointed offerings, enter a black building associated with
    Erlik Khan, and take a ninth heart from a mandala of sorcerers without looking
    back. She obeys, carries off the heart, and the propitiated guardians refuse to
    arrest her when the sorcerers pursue. She returns to the palace and is reunited
    with her husband. In the frame narrative, the Well-and-wise-walking Khan speaks
    in praise of her bravery, and the Siddhî-kür escapes through the air.
  language: English
  quote_policy: summarized
