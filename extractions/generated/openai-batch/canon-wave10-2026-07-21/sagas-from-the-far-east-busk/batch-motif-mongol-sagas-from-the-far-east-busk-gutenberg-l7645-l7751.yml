  text: He finds that former kings made nightly secret offerings to devas, genii of
    earth and water, and eight kinds of spirits, but later kings neglected the sacrifice
    and were slain by the spirits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Vikramâditja appoints treasury funds for the accustomed offering, calls on
    the spirits, and offers the sacrifice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The spirits are pleased by the renewed honor, give the king a handsome Mongolian
    tent, and go up again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The people arrive with wood for funeral obsequies, find the spell broken,
