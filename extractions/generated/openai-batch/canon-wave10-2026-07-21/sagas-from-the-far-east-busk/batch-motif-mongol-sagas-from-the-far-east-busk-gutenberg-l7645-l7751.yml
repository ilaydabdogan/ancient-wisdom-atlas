canonical_text:
  quote: ''
  summary: Vikramâditja and Schalû disguise themselves as beggars and take the place
    of a youth chosen by lot to become a king doomed to die that night. Vikramâditja
    discovers that former kings had neglected nightly offerings to supernatural beings;
    he restores the sacrifice, receives a tent from the spirits, and is accepted by
    the people as the fated king. In a following episode, a corrupt minister is exiled,
    becomes hungry after a fast, follows animated offering-tapers to a rock cave,
    and is warned by speaking stone he-goats that the silent Dâkinî Tegrijin Nâran
    sits within, while five hundred failed royal suitors are imprisoned at her feet.
  language: English
  quote_policy: summarized
