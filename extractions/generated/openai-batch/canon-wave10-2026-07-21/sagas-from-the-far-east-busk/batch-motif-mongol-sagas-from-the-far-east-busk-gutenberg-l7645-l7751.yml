  basis: The former nightly offering had been neglected; spirits slew kings until
    Vikramâditja restored the sacrifice, after which they gave a tent and the spell
    was broken.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage names devas, genii, and spirits collectively; it does not
    give a single unified theology for them.
