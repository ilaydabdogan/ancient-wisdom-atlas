- id: motif:2
  label: voluntary substitution for a doomed youth
  taxonomy_refs:
  - sacrifice
  basis: Vikramâditja offers that he and Schalû will take the youth’s place on the
    throne and die in his stead.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The proposed death is avoided after the curse is broken, so the substitution
    remains an offered rather than completed sacrifice.
- id: motif:3
  label: restored sacrifice appeases supernatural powers and breaks a death curse
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
