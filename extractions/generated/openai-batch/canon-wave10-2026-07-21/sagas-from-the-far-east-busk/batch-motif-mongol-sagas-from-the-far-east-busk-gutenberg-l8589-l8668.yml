canonical_text:
  quote: ''
  summary: A note recounts Shâkjamuni/Buddha's lineage, royal upbringing, marriage
    and palace life, encounters with old age, sickness, death, priesthood, and suffering
    people, his withdrawal from family and luxury into solitude and study, his disciples
    and austerities, and his eventual enlightenment through meditation associated
    with the ashvattha or bodhi tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shâkjamuni is identified as the family name of Buddha, the originator of Buddhism,
    and is glossed as “Hermit of the tribe of Shâkja.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives a Shâkja genealogy in which Shuddhodana married Mahâpragâpatî,
    later called Mâja, and became the father of Buddha.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mahavansha is cited for Gajasena’s descent from Ixvâku through an enormous
    number of ancestors; Shâkjamuni is also given priestly and warrior-caste titles.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buddha was brought up as heir to the crown, trained in arms and rulership,
    married at sixteen, and lived among three palaces until about age twenty-eight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A meeting with an old man, a sick man, a corpse, and a priest led him to reflect
    on the evils and evanescence of life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: He rested under a gambu-tree and saw the miserable condition of nearby country
    people.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The legend says the Devatâ, or gods, appeared in the shape of suffering people
    in order to instruct him in his new views of existence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: His deliberations resulted in a resolve to withdraw into solitude to consider
    how human beings could be relieved from misery.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: He forsook his family and palatial residences, laid aside rich clothing, wandered
    unknown, begged for food, and reached Brahman hermitages at Gajâshira.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: He studied under Arâda Kâlâma and Rudraka, and five named disciples became
    attached to him and later became first followers of his separate teaching.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: After years of study he undertook a new search after happiness, retired with
    the five disciples into deeper solitude, and spent six years in contemplation
    and austerities.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: His companions later left him after he relaxed his severe way of life.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: His meditations were believed to have illumined his understanding, and he
    received the name Buddha, meaning “the enlightened one.”
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: His habitual meditation under the ashvattha fig-tree led that tree to be called
    bodhiruma, “tree of knowledge,” and the tree became an inseparable adjunct of
    Buddhism.
  category: relationship
  evidence_refs:
  - ev:10
