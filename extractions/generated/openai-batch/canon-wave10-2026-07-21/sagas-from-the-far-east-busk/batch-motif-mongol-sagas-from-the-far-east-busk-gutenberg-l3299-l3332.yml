canonical_text:
  quote: ''
  summary: 'Several helpers dispute who deserves the rescued wife: the doctor''s son
    claims his potion restored her to life, the wood-carver''s son claims his wooden
    garuda-bird enabled rescue from the Khan''s palace, and the painter''s son claims
    his art made the stratagem succeed. The woman wants only her husband, the rich
    youth, but the disputants seize her and tear her apart. In the frame narrative,
    the Prince comments on the judgment, and Siddhî-kür says the Well-and-wise-walking
    Khan has spoken, then escapes through the air.'
  language: English
