canonical_text:
  quote: ''
  summary: A jewel-merchant entrusts a jewel to Dsük for delivery to his wife, but
    Dsük sells it and bribes two court men to testify falsely. King Ardschi-Bordschi
    first accepts the false testimony. The Boy-king summons the parties, exposes the
    witnesses by making each man model the jewel in clay, sends a formal rebuke to
    Ardschi-Bordschi, and Ardschi-Bordschi then punishes the false witnesses and orders
    Dsük to repay double value.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A subject of Ardschi-Bordschi goes overseas for precious stones and entrusts
    a jewel to a returning companion for delivery to his wife, so that his family
    may be provided for.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The entrusted bearer, later named Dsük, sells the jewel and spends the proceeds
    for his own purposes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the jewel-merchant returns and learns from his wife that no jewel was
    delivered, he brings the matter before the King.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dsük, expecting to be judged, gives presents to two chief men of the court
    and arranges for them to testify that they witnessed the delivery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the King, Dsük and the two court men state that the jewel was delivered;
    the King accepts the witnesses' words and releases Dsük.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: As the four men pass the hill where the Boy-king sits enthroned, the Boy-king
    summons them, declares the King's decision hasty, and says he will judge the case.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Boy-king separates the four men and gives each a lump of clay to fashion
    into the form of the sent jewel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sender and the bearer make matching clay models, while the two court witnesses
    make models unlike those and unlike each other.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Boy-king states that the two witnesses had not seen the jewel and had
    given false testimony; Dsük and the witnesses are secured and sent to the King,
    confessing their crime.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Boy-king sends a formal declaration telling Ardschi-Bordschi that a ruler
    should investigate matters and discern truth from falsehood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After reading the letter, Ardschi-Bordschi wonders whether the Boy-king is
    a Bodhisattva or Buddha, or whether a stupa or wisdom-giving jewel lies hidden
    in the hill or mound.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ardschi-Bordschi concludes the jewel case according to the Boy-king's judgment,
