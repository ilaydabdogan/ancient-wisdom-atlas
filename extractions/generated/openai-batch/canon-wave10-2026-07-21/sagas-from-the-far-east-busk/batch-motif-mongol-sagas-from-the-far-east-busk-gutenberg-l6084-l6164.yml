canonical_text:
  quote: ''
  summary: The Well-and-wise-walking Khan remains silent after the Siddhî-kür's speech,
    keeping the sack bound and carrying him to Nâgârg'una. Nâgârg'una places the mighty
    dead in a grove on a shining mountain in Southern India, after which prosperity,
    knowledge, long life, law, religion, and happiness flourish in Gambudvîpa. The
    passage then turns to a historical notice on Vikramâditja, describing the uncertainty
    around his name, the popular notion of one prolonged or recurring heroic existence,
    transferable heroic titles, an exploit aided by the serpent-god Shêsa, and the
    migration and transformation of heroic myths across Indian regions.
  language: English
  quote_policy: summarized
