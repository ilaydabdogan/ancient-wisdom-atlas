canonical_text:
  quote: ''
  summary: An unnamed king's envoys threaten to kill a company of merchants, but Vikramâditja
    secures their lives by taking Schalû in exchange. Vikramâditja's mother recognizes
    that Schalû may correspond to a newborn once left in a wolves' den, and Schalû
    is accepted as her son and Vikramâditja's brother. Vikramâditja and Schalû set
    out toward the capital of Gandharva to learn the kingdom's condition and recover
    the inheritance. They learn that King Galischa governs under a compact requiring
    a daily tribute of one hundred men and a nobleman to the Schimnus. Vikramâditja
    encounters a grieving woman whose son has been taken for tribute, promises to
    go in his stead, and then declares his identity as Gandharva's son before Galischa.
  language: English
  quote_policy: summarized
