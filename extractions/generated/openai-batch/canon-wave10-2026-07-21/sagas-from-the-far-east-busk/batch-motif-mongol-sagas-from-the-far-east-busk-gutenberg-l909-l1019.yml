canonical_text:
  quote: ''
  summary: A Khan's country is threatened by two water-controlling Serpent-gods who
    demand an annual human tribute. When the lot falls on the Khan, his son goes in
    his place, accompanied by a loyal poor man's son. Near the pool, the prince overhears
    the serpents reveal that they can be killed only by stout staves and that eating
    their heads grants the power to spit gold or precious stones. Because his mother
    taught him the speech of creatures, the prince understands this, and he and his
    companion kill the serpents, eat the heads, and gain wealth-producing powers.
    They do not return home, journey through a mountain pass, are exploited by women
    selling strong drink, and then reach a riverbank with a palm grove and quarrelling
    boys.
  language: English
  quote_policy: summarized
