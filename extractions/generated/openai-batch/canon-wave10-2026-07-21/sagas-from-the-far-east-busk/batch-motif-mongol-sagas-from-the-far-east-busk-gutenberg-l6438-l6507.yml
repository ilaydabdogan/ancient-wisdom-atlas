  quote: ''
  summary: 'The passage recounts variant legends surrounding Vikramâditja: his supernatural
    parentage through King Gandharva in ass form, the burning of the discarded animal
    form that ends a curse, danger to the infant prince and his flight with a foster
    guardian, and several accounts of Vikramâditja’s later accession and dominion,
    including a Vetâla occupying the throne.'
  language: English
  quote_policy: summarized
