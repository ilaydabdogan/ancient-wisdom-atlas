canonical_text:
  quote: ''
  summary: A childless poor man’s cow gives birth to a bull-headed, human-bodied being
    named Massang. After being spared from death, Massang leaves and gathers three
    colour-marked companions born from woods, meadows, and crystal rock. The group
    settles in a provisioned hill dwelling. While the others hunt, the black-coloured
    companion is overmatched by a tiny uncanny old woman who demands a taste of food
    and then disappears with the whole meal; he fabricates signs of a mounted attack,
    and the companions believe him. The next day the old woman repeats the incident
    when the green-coloured companion is left at home.
  language: English
  quote_policy: summarized
