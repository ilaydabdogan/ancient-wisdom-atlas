canonical_text:
  quote: ''
  summary: 'A framed tale asks who invented woman: four shepherd youths successively
    fashion a wooden form, paint it, give it wit and understanding, and breathe life
    or soul into it. The four then dispute possession by right of invention and bring
    the matter to the King. Naran-Dâkinî remains silent while transformed object-ministers
    begin to answer in favor of different youths.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four youths from four tribes go daily to one place to mind their flocks and
    pass leisure together.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first youth, alone and bored, takes wood and sculpts a form like his own
    yet different.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second youth finds the fashioned form and paints it with five colours.
  category: action
  evidence_refs:
