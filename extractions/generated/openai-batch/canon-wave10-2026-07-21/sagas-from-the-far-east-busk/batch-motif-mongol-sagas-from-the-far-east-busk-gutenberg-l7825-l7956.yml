- id: obs:4
  text: The third youth finds the fashioned and painted form, says it lacks wit and
    understanding, and infuses these into it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fourth youth finds the figure, says it lacks life, breathes into its lips,
    and the figure receives a soul and is woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fourth youth loves the woman and leaves the other youths in order to be
