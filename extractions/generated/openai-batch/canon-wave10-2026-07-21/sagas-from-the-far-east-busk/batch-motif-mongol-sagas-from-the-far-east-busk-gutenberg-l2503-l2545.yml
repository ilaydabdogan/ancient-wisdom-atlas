canonical_text:
  quote: ''
  summary: Sunshine explains that he is a Khan's son who fled with his brother Moonshine
    after his stepmother tried to kill him. A grateful Khan rewards the brothers with
    marriages, wealth, and an escort. The brothers return to their father's capital;
    their bereaved parents are restored by the news, and the Khanin dies from remorse.
    In the frame narrative, the Well-and-wise-walking Khan speaks, and the Siddhî-kür
    escapes through the air. The chapter closes by identifying the tale as showing
    how the Serpent-gods were appeased.
  language: English
  quote_policy: summarized
