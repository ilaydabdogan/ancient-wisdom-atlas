canonical_text:
  quote: ''
  summary: In a frame episode, the Well-and-wise-walking Khan carries the bound Siddhî-kür,
    who tells a tale. In the tale, an aged couple in Nepal marry their only daughter
    to the poor son of another aged couple. The husband and wife move toward a wandering
    life on alms. After a son is born, the wife seeks help from her parents, but finds
    them dead and their property gone. She imagines turning wool scraps into wealth
    enough to buy an ass and perhaps a foal. When the child says he will ride the
    foal and beg alms too, she angrily tries to strike him with a stick; the blow
    kills him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The frame narrative has the Well-and-wise-walking Khan bringing the Siddhî-kür
    bound in a bag from the cool grove, eating a cake that never diminishes, and hearing
    a tale from the Siddhî-kür during the journey.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The embedded tale is set long ago in Nepal on the banks of the Hiranjâvati,
    where an old man and old wife have no sons and only one daughter.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old parents want to establish their daughter safely because no one has
    offered to marry her despite her beauty, prudence, and dowry.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The daughter is married to the only son of a poor aged couple, and the husband
    lives in the house of the wife's parents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The husband wishes to visit his parents, but they are absent because they
    live a Bhixu life and have gone begging through the tribes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A mighty Khan orders a large distribution of alms in which requested goods
    are given, with only rice-brandy limited by measure.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The husband argues that going from tribe to tribe on alms will provide what
    they need, avoid fear of thieves, labor, anxiety, drought, herd losses, and tribute,
    and keep their store from diminishing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After many months of begging, a son is born; the wife says rice-brandy is
    no food for her and that she lacks strength to carry the child as he grows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The wife proposes visiting her parents to ask for an ass on which the infant
    can ride when they beg among the tribes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the couple reaches the wife's parental home, her parents are dead, their
    herds and flocks are gone, and only tufts of wool remain caught on ant-heaps.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wife imagines collecting the wool, weaving cloth, selling and exchanging
    it until they can buy an ass, and later perhaps having two asses if the ass has
    a foal.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The child says he will take the foal, ride it, and beg alms among the tribes
    as his parents do.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The mother becomes angry, tries to strike the child with a stick, and the
    blow falls on his head and kills him.
  category: action
  evidence_refs:
  - ev:11
