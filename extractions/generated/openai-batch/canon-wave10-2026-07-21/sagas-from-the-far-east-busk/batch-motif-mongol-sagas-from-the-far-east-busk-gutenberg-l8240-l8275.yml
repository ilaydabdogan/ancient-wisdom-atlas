canonical_text:
  quote: ''
  summary: A merchant who has bought a wise parrot entrusts him with watching his
    merchandise and, during a seventy-one-day journey, his young wife. After the merchant
    leaves, the wife prepares to go out visiting. The parrot stops her, reminds her
    of household duties and of the husband's charge, admits he cannot compel her by
    force, and asks her to sit first and hear a story. Because she loves the parrot's
    stories, she sits down and the parrot begins to tell one.
