canonical_text:
  quote: ''
  summary: The Well-and-wise-walking Khan carries the bound Siddhî-kür, who tells
    a tale about a foolish wealthy husband and a prudent wife. The wife equips the
    husband for trade; by accident his snoring sounds a bugle near a cave, frightening
    merchants into abandoning their goods, which he takes home. Proud afterward, he
    goes hunting; the wife, suspecting chance rather than skill, disguises herself
    as a male rider identified with Surja-Bagatur, frightens him into surrendering
    his horse and arms, and later hears him falsely claim victory. She laughs privately
    and does not expose him. The Khan praises her prudence, whereupon the Siddhî-kür
    observes that the Khan has spoken and escapes through the air.
  language: English
  quote_policy: summarized
