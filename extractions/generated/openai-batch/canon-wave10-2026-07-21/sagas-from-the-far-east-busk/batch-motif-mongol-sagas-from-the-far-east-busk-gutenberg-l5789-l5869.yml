canonical_text:
  quote: ''
  summary: A tamer rescues a white serpent-prince from a bird, hides him under a cap,
    and returns him to the White Serpent-king, an under-water ruler. The Serpent-king
    rewards the tamer for rescuing both his son and, earlier, Princess Goldfrog, prophesying
    four royal sons and giving a food-producing Mirjalaktschi, a mother-of-pearl wand,
    and a red dog. In the frame, the Khan speaks and the Siddhî-kür escapes through
    the air.
