canonical_text:
  quote: ''
  summary: A governor hires a birdcatcher to obtain the brains of seventy-one parrots.
    A wise parrot detects the danger and advises changes of roost, but the other parrots
    eventually ignore him and are netted. The wise parrot devises a plan for all to
    feign death and fly away when the birdcatcher counts to seventy-one. The other
    parrots escape, but the wise parrot remains in the birdcatcher’s grasp, then persuades
    him to sell him for profit instead of killing him.
  language: English
  quote_policy: summarized
