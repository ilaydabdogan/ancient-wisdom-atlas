- id: obs:3
  text: The white-coloured man makes a mule trot around the dwelling so that he can
    claim merchants with packed mules bound him and ate the provisions; the companions
    believe him when they see the hoof marks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Massang remains at home to cook while the others go out, and the little old
    woman arrives and asks to taste milk and meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Massang reasons that the little old woman may be the one who appeared to the
    other three and that her bundle may contain the means of her witcheries.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Massang gives the old woman a pail with a hole in it; she goes up to the clouds,
    squeezes one into the pail, and the water runs out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: While the old woman is absent, Massang opens her small bundle and exchanges
    catgut for hempen cord, an iron hammer for a wooden mallet, and iron pincers for
    wooden ones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the old woman returns, she angrily says a holed pail cannot bring water,
    threatens that all Massang has will become hers if he refuses food, and challenges
    him to fight.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The old woman proposes three trials: the cord proof, the hammer proof, and
    the pincers proof.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the cord proof, the old woman binds Massang with the substituted hempen
