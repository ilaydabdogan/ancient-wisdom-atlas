canonical_text:
  quote: ''
  summary: 'After earlier companions lose the food and fabricate explanations involving
    cattle or merchants, Massang stays home to cook. A little old woman arrives and
    demands milk and meat. Suspecting her of causing the earlier losses through witchcraft,
    Massang sends her away with a leaking pail to fetch water, observes her going
    to the clouds, and swaps the contents of her small bundle: catgut, an iron hammer,
    and iron pincers are replaced or retained to his advantage. When she returns,
    she threatens him and proposes three strength trials. In the cord trial he breaks
    the substituted hempen cord and binds her with catgut; in the pincers trial her
    wooden pincers do not hurt him, while his iron pincers wound her.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One companion makes oxen trample the ground so that he can claim cattlemen
    overpowered him and carried off the food; the returning companions accept the
    tracks as proof.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The white-coloured man is left at the homestead to prepare dinner, and the
    same little old woman appears and consumes all the provisions.
  category: sequence
  evidence_refs:
