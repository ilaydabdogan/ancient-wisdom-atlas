canonical_text:
  quote: ''
  summary: The passage contains notes to Tale XVI. It explains the name Tabun Minggan,
    discusses Indian esteem for cows and oxen, cow and ox symbolism, Surabhi the cow-divinity,
    sacred and sacrificial treatment of cattle and butter, ox racing and the Tibetan
    yak, the Buddhist Three Precious Treasures, and Tibetan and Mongolian dwellings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tabun Minggan is glossed as meaning “containing five thousand,” and the tale-repeater
    is said to apply a name from his own language to a town placed in India.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cows and oxen are described as having been held in high estimation by ancient
    Indians.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note says the same word stood for “cow” and “the earth,” and that both
    were Vedic symbols of fruitfulness and patient labour for others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ox is said to stand in the Manu for uprightness and obedience to the laws.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Surabhi, the cow-divinity, is described as lamenting that her children labour
    all day at the plough under the burning sun.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cows were frequently devoted to the gods, left free even in towns, and treated
    as sacred in life; cow sacrifices are described as rare.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ox is described as especially sacred to Shiva, with images set up in temples;
    butter is described as a frequent sacrificial object and as part of a daily Homa
    offering.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Several cow names are glossed with meanings related to warm milk, inviolability,
    wish fulfilment, and rejoicing; Sabala is mentioned as a heavenly cow.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Oxen are described as used for ploughing, charioteering, riding, and racing;
    the Kâmara is identified as a long-haired ox or yak received by Indians from Tibet.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Three Precious Treasures of Buddhism are identified as Adi-buddha, Dharma,
    and Sangha, later treated as a triratna triad of supreme divinities, with earlier
    meanings also supplied.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tibetan herdsmen’s huts are described as having a hole in the roof for smoke,
    while Mongolians are described as living entirely in tents.
  category: setting
  evidence_refs:
  - ev:9
