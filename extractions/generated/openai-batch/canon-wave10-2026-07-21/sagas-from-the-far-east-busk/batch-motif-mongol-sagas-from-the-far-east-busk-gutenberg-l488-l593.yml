canonical_text:
  quote: ''
  summary: The passage opens with a dedication to Nâgârg'una as a master and teacher,
    then introduces a tale in Magadha. Seven magician brothers withhold their true
    art from an elder Khan's son, while his younger brother learns it secretly by
    looking through a door crack. The younger brother transforms into a horse to be
    sold, but the elder disobeys instructions and brings the horse to the magicians,
    who recognize and intend to destroy it. The transformed Khan's son escapes by
    successive transformations into a fish and a dove, pursued by the magicians as
    larger fish and hawks, and finally takes refuge in Nâgârg'una's cave. He plans
    another transformation into a bead of the master's chaplet.
  language: English
  quote_policy: summarized
