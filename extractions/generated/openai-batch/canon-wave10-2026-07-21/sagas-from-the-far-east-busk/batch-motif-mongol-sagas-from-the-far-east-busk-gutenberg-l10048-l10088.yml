canonical_text:
  quote: ''
  summary: The passage gives explanatory notes on heaven-gods or devas and on Garuda.
    It describes devas as liminal beings between humans and gods, able to resist aging,
    change form, and become invisible while remaining subject to illusion, sin, and
    rebirth. It then explains Garuda’s name, genealogy, relation to Suparna divine
    birds, hostility to serpent-gods, Vedic golden-winged description, association
    with rain and heavenly imagery, role as Vishnu’s bearer, and a Mahabharata legend
    in which Vishnu humbles Garuda after Garuda objects to Indra’s promise of long
    life to the serpent-descendant Sumukha. It ends by describing Garuda as not entirely
    birdlike but a human-bird combination resembling eagle, vulture, and crane.
  language: English
  quote_policy: summarized
