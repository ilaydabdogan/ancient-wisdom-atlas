canonical_text:
  quote: '"Halt! O Ardschi-Bordschi!"'
  summary: The king recognizes extraordinary wisdom in the Boy-king, settles the case
    of the two sons according to the Boy-king's judgment, and seeks the source of
    the wisdom. Ardschi-Bordschi visits the mound where calf-herd boys play at kingship,
    has the mound excavated, and uncovers a radiant golden throne. After ceremonially
    bringing it to his residence, he attempts to mount it, but animate sculptured
    figures stop him and declare that the sacred throne once belonged to Churmusta
    and then to Vikramâditja, and may be approached only by a king devoted to the
    service of living beings.
  language: English
  quote_policy: quoted
