canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic notes attributed to Abbé Huc. It describes
    Mongolian Lama healing in which illness is attributed to a demon, treated by medical
    and exorcistic means, including a fever-demon puppet that is burned and carried
    away. It also describes gendered occupations: women perform household, dairy,
    fuel, water, textile, and sewing work, while men mainly herd animals, hunt, ride,
    drink tea, smoke, and visit others.'
  language: English
  quote_policy: summarized
