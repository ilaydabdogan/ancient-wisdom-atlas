  summary: Editorial notes explain the customary use describion and value of wooden
    cups carried in Tibet and Mongolia, identify Tai-tsing with the Manchu/Mantchou
    dynasty and its seizure of the Chinese throne, describe the Mantchous as Eastern
    Tartars, state that identifying a Mantchou king with Vikramaditya is an example
    of hero confusion in myth migration, and gloss Tsetsen Budschiktschi as “the clever
    dancer.”
