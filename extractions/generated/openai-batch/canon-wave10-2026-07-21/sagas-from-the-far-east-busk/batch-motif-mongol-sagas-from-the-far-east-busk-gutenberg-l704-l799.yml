canonical_text:
  quote: ''
  summary: The Siddhî-kür prompts the Well-and-wise-walking Khan to listen to a tale.
    In the tale, a young Khan dies and appears at night to his beloved second wife,
    leading her toward the palace and explaining that he is dead and going to the
    deva's kingdom. He instructs her about a hidden jewel, the birth of their son
    in an elephant-stable, and the future succession. The son is born, the jewel proves
    her account, the chief wife is dismissed, and the lowly wife and the Khan's mother
    rule until the boy matures. The dead Khan later visits monthly, visible only to
    the wife; when asked about permanent return, he says it would require a difficult
    and terrible ordeal, which she says she is willing to endure.
  language: English
  quote_policy: summarized
