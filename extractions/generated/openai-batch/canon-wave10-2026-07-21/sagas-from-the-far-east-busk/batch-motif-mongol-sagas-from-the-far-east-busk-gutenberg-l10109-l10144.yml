canonical_text:
  quote: ''
  summary: Explanatory notes identify Chongschim Bôdhisattva with a Chinese-derived
    name and with the protector role associated with Shâkjamuni and Dalai Lama incarnation.
    The passage defines Bôdhisattva through wisdom, future Buddhahood, rebirth, and
    possible residence in Tushita-heaven. It glosses Suvarnadharî and Chutuktu, then
    comments on an Indian-tale-like plot device involving a poor man, a girl, a stream,
    and leaving the girl buried in a box.
