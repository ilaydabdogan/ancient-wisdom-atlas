canonical_text:
  quote: ''
  summary: A man intending to kill a woman opens a box and is killed by a tiger inside
    it. Later, the maiden who became the Khanin faces gossip about her obscure origin
    and lack of kin. She leaves with her three sons to seek her parents, encounters
    an apparent brother, and sees her parents living amid great palaces and a splendid
    temple. The Khan and ministers visit and are satisfied, but the next morning the
    splendor vanishes; she understands that devas sent the transformation. She returns
    home vindicated, and her sons are raised to reign.
  language: English
  quote_policy: summarized
