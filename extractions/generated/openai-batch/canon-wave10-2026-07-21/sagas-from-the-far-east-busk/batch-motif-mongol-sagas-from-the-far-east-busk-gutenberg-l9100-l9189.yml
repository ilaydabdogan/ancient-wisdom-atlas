canonical_text:
  quote: '"It is useless for you to go on knocking. In this house is nothing."'
  summary: A wandering Samanaer seeks admission to Nâgârg'una's residence, is refused
    because he is a Buddhist teacher, and gains entry after responding philosophically
    to Nâgârg'una's statement that the house contains nothing. The Samanaer teaches
    him Buddhist doctrine and reports a prophecy that a great teacher from Southern
    India will renew the earth; Nâgârg'una believes and later fulfills it. The notes
    explain the Mâdhjamika school as a middle course between extremes, mention his
    treatise and disciples, describe Buddhist literature as three vessels or baskets,
    and add geographic and linguistic notes on Magadha, Tibet, and related terms.
  language: English
  quote_policy: quoted
