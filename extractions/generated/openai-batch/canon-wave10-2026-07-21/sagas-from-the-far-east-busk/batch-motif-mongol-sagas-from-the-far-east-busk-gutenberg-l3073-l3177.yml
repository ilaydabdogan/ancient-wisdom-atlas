canonical_text:
  quote: ''
  summary: In the frame narrative, the Well-and-wise-walking Khan again captures the
    Siddhî-kür, who tells the tale called “Five to One.” Six companion youths set
    out to seek their fortunes. At a meeting of six streams, they separate, each planting
    a tree as a sign that will wither if evil befalls him. The rich man’s son follows
    his stream to its source, meets an aged couple, marries their beautiful daughter,
    and lives happily. While bathing, the wife loses a jeweled ring, which the river
    carries to a Khan’s servants. The Khan uses the ring to locate her, has her brought
    to his palace, and later orders the rich youth removed; courtiers lure him to
    a lonely riverbank, put him into a hole, seal it with a rock, and kill him.
  language: English
  quote_policy: summarized
