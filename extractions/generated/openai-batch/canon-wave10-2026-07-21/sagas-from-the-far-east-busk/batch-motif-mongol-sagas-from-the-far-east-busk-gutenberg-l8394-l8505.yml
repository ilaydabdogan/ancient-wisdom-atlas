canonical_text:
  quote: ''
  summary: The minister’s wife uses a token and a pretext to enter the prison, exchanges
    clothing with Naran Gerel, and enables her escape. Before the king, the captain
    of the guard seeks to prove his accusation through a barley-corn ordeal, but Naran
    Gerel refuses it on grounds of royal status and asks for a public oath. The minister’s
    wife disguises the minister as a loathsome crippled beggar, and Naran Gerel swears
    by him; because he is not truly a cripple, she treats the oath as invalid while
    the king and assembly accept it. The captain is spared, and the minister and Naran
    Gerel are declared innocent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A guard takes a jewel and knocks three times at the minister Ssaran’s door;
    the minister’s wife recognizes the token as meaning that her husband and Naran
    Gerel have been imprisoned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The minister’s wife dresses finely, fills a basket with fruits, goes to the
    prison gate, and says a physician has ordered fruit for her fever-stricken husband.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The captain of the guard permits the minister’s wife to enter the prison but
    tells her to return quickly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside the prison, the minister’s wife changes dresses with Naran Gerel, tells
    Naran Gerel to escape privately to her own apartment, and remains beside her husband.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king orders Naran Gerel and the minister brought before him, and the captain
    of the guard brings the minister and the minister’s wife without looking closely
    at them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When questioned, the minister’s wife and the minister say they do not know
