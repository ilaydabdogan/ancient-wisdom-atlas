  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The minister’s wife stains the minister black and instructs him to appear
    in the assembly as a crippled beggar making grimaces and carrying an empty water-pitcher.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the assembly, the king sits on the throne, Naran Gerel stands at its foot,
    and the minister appears in the form of a black, loathsome crippled beggar.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The king first orders the apparent cripple removed, but the minister, acting
