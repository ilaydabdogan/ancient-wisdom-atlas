    he had spent the day in the king’s garden with his wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The captain of the guard asks that Naran Gerel be summoned and that she answer
    through the trial of barley-corns whether he arrested her in the king’s garden.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage explains that in the barley-corn trial, false speech makes the
    barley-corns spring into the air and burst loudly, while truthful speech leaves
    them quiet.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Naran Gerel refuses to make the barley-corn trial on the grounds that she
