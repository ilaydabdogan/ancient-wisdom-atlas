canonical_text:
  quote: ''
  summary: Editorial notes to Tale I describe funeral songs that memorialize the dead,
    Indian and Buddhist-associated elephant lore including cosmic support, divine
    or sacred elephants, elephant warfare and worship legends, and the role of Erlik-Khan’s
    servants in bringing souls before a judge for rebirth according to merit or demerit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Songs commemorating the deeds of departed persons were sung at funeral rites,
    often instead of stone monuments, to keep their acts in the memory of the living.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The name Gâthâ is given to songs praising ancestry, especially the ancestors
    of kings, usually accompanied by the lute.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elephant is described as an old and frequent subject in Indian writings,
    a useful and companionable beast, and an ordinary mount of warriors in epic poems.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elephant appears in architectural and mythological imagery as a karyatyd,
    as one of four huge elephants supporting the world, and as the mount of the king
    of gods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ganesha is described as the god who personifies the sense of touch and is
    represented with an elephant trunk.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The white elephant is described as a divine incarnation in Ceylon, as linked
    to a Burmese imperial title, and as sacred in Siam.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: In war the elephant is called the Eightfold-armed one because four feet, two
    tusks, frontal bone, and tusk supply eight weapons; a king’s number of elephants
    is treated as an element of military power.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Aelianus is cited for the notion that wild elephants encounter larger serpents
    that climb trees and dart upon them to throttle them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Elephants are reported to possess a kind of religion, to look up to heaven
    when injured, to pay divine honours to the sun and moon, and in one fable to be
    led by a hare to worship the moon’s reflection in a lake.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The erliks, servants of Erlik-Khan, bring every soul before Erlik-Khan for
    a sentence determining the soul’s next rebirth according to the merits or demerits
    of its last existence.
  category: sequence
  evidence_refs:
  - ev:9
