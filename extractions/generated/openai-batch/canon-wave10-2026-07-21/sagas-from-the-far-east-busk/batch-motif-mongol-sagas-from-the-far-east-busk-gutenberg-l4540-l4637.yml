canonical_text:
  quote: ''
  summary: A meat-loving husband kills the household's calves and cows, while his
    wife, who loves butter, tries to preserve their last cow. After he kills it, she
    leaves, prays in a mountain cave, and a severed cow teat becomes a milk source.
    She repeatedly feeds her hungry husband with butter, but he follows her and destroys
    or disperses each source of sustenance, first the cave teat and then a herd of
    milkable hinds.
  language: English
  quote_policy: summarized
