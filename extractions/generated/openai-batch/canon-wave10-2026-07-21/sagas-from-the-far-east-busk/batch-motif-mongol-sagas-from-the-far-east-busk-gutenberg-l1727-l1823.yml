canonical_text:
  quote: ''
  summary: Massang, guided by Churmusta, wounds and later kills the Schimnu-Khan,
    reaches the Schimnu palace under the claim of being a physician, casts seven barley-corns
    toward heaven, and escapes upward by an iron chain. A female Schimnu tries to
    sever the chain; seven sparks rise and become the Pleiades. In the frame narrative,
    the Khan speaks and the Siddhî-kür escapes.
  language: English
  quote_policy: summarized
