canonical_text:
  quote: ''
  summary: The Master Nâgârg'una protects the Khan's son during a magical transformation
    episode, rebukes him for killing seven men, and sends him on a difficult atoning
    mission to fetch the Siddhî-kür from a mango-tree. The Master gives route instructions
    through places where different dead rise up, supplies formulas, barley-corns,
    an axe, sack, cord, and inexhaustible cake, renames the hero the Well-and-wise-walking
    Khan, and warns him not to speak on the return. The Khan captures the Siddhî-kür
    by threatening the mango-tree and remains silent when the captive asks for a story.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Falling beads turn into little worms, and seven cotton-clothed men transform
    into seven fowls that peck up the worms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large bead dropped from the Master's mouth becomes the form of a man holding
    a staff; the Khan's son uses the staff to kill the seven fowls, which then appear
    as men's corpses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master says the Khan's son has done evil because the Master protected
    his one life while the Khan's son took seven lives.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Khan's son says the seven had vowed to kill him and offers to undertake
    any painful and difficult enterprise to thank the Master and remove the sin from
    himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Master sends him to the cool grove, or cîtavana, where the Siddhî-kür
    is at a mango-tree, and describes the Siddhî-kür as gold above the waist, emerald
    below, with a mother-of-pearl head and shining crown.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Master says that bringing the Siddhî-kür will testify gratitude, remove
    the sin, and allow the Master to produce abundant gold, give thousand-year lives
    to the people of Gambudvîpa, and perform wonders.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Master instructs the traveler to pass three places where the giant-dead,
    pigmy-dead, and child-dead will rise and surround him; in each case he is to use
    a spoken formula and scatter consecrated barley-corns.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Master says the Siddhî-kür will flee to the summit of his mango-tree and
    will come down if the traveler threatens to fell it with the axe White Moon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Master instructs him to seize the Siddhî-kür, bind him in a many-colored
    sack with a hundred-thread multicolored cord, eat from an inexhaustible cake,
    carry the sack back, and avoid speaking on the way.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Because the Khan's son has found his way to the cave called Giver of Rest,
    the Master renames him the Well-and-wise-walking Khan and provides the promised
    supplies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After overcoming the dangers of the road, the Well-and-wise-walking Khan pursues
    the Siddhî-kür to the mango-tree and threatens to fell it with the axe White Moon
    unless the Siddhî-kür descends.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Siddhî-kür asks that the mango-tree not be felled, descends, and is placed
    in the many-colored sack, which the Khan fastens with the multicolored cord before
    beginning the return journey.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the return journey the Siddhî-kür asks the weary Khan to tell a story,
    but the Khan remembers the Master's prohibition against speaking and gives no
    answer.
  category: sequence
  evidence_refs:
  - ev:8
