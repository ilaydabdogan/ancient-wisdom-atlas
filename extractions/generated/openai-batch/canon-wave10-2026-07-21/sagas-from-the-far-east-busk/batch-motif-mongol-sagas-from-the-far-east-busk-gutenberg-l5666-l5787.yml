canonical_text:
  quote: "“I am the daughter of the Serpent-king”"
  summary: A frame narrator, the Siddhî-kür, tells of an eastern Indian Khan whose
    gold dancing frog and wise parrot are displaced by a foreign minstrel. Their keeper
    releases the parrot and throws away the frog. A crow catches the frog, but she
    tricks it into bringing her to water and escapes into a rock cleft. She tells
    the keeper not to dig up the spring because she guards it, identifies herself
    as the daughter of the Serpent-king, and recounts being captured while watching
    a king’s daughter bathe. The keeper is spared death, banished with stone shoes,
    and returns after wearing them through by soaking and rubbing them.
  language: English
  quote_policy: quoted
