canonical_text:
  quote: ''
  summary: After the woman burns her husband's perch and cage, he reveals that the
    cage held his feathers and soul. He sets a seven-day and seven-night rescue task
    at a mother-of-pearl door, but a momentary lapse lets gods and demons carry him
    off. The woman searches for him, finds him in bondage as their water-carrier,
    rebuilds a cage, woos his soul back into it, and he returns to live with her.
    The frame closes when the Khan speaks and Siddhî-kür escapes through the air.
  language: English
  quote_policy: summarized
