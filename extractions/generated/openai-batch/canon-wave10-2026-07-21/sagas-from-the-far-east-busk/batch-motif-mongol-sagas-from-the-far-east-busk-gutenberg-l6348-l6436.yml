canonical_text:
  quote: ''
  summary: 'The passage describes the Puranas, the Mahabharata, and the Ramayana as
    collections or compilations of stories about gods and heroes. It recounts a mythic
    genealogy around Vasu: the mountain-god Kolahola blocks the stream-goddess Shirktimati,
    Vasu frees her by striking the mountain, and she gives her twin children into
    his service. The passage then traces descendants including Girika, Satyavati,
    Vyasa, and Parashara, and notes Satyavati''s sweet scent and concealment by mist.
    It closes by comparing the Ramayana to other Indian saga collections and noting
    the frequent Avatara or incorporation of Vishnu or Rama in heroes.'
  language: English
  quote_policy: summarized
