canonical_text:
  quote: ''
  summary: The tale opens with Khan Kun-snang, his two sons Sunshine and Moonshine,
    and the second wife’s plot to remove Sunshine so Moonshine may inherit. She feigns
    illness and asks for a prince’s heart stewed in sesame oil. The Khan outwardly
    agrees while planning to substitute a goat’s heart and exile Sunshine. Moonshine
    overhears, warns Sunshine, and insists on fleeing with him. The brothers obtain
    travel cakes from a priest, depart by night toward the east, and cross mountains
    and plains. In a waterless land Moonshine dies; Sunshine buries him beneath stones
    and prays that they may live together in Moonshine’s next rebirth. Sunshine later
    reaches a pass with a red door in a rock and meets an ancient hermit in a cave.
    The hermit takes a life-restoring cordial to Moonshine’s burial place, restores
    him to life, and invites the two princes to live with him as sons.
  language: English
  quote_policy: summarized
