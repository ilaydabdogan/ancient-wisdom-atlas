canonical_text:
  quote: ''
  summary: Biographical note narrating Shâkjamuni’s post-illumination journey to Vâranasî,
    the growth and mission of his disciples, royal and family conversions, his final
    illness and death at Kushinagara, preservation and division of his ashes, and
    an assembly of followers to codify his laws.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shâkjamuni resolves to travel to Vâranasî to seek his former companions after
    solitude becomes oppressive.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The former companions first refuse him respect because he appears well rather
    than emaciated, but accept his teaching after he shows that he has attained the
    illumination of a Buddha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: His disciples increase in number, live by alms, receive the name Bhixu, and
    sixty are invested with Arhat dignity and sent out to spread his teaching.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shâkjamuni wanders for nineteen years in central and eastern districts, teaching
    and gaining converts; during rainy seasons the community seeks shelter for Varshavasana.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several kings are said to be won over; Shuddodana sends repeated messengers,
    Karka carries back Shâkjamuni’s agreement to come, and a vihâra is built under
    a Njagrodha sacred fig-tree grove.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the twelfth year after his departure, Shâkjamuni returns home, teaches
    among his kindred, resumes traveling, and family members including Râhula and
    Ânanda join him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the twentieth year of his Buddhahood and the fifty-sixth year of his age,
    Shâkjamuni becomes seriously ill and announces that his nirvâna is near and will
    take place at Kushinagara.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: He travels toward Kushinagara, visits establishments of disciples, makes more
    converts, gives himself to contemplation, and dies under a Shala grove of sal-trees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: His body is treated with honors reserved for a Kakravartin, burned, and the
    ashes are preserved in a gold urn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Claimants demand his ashes; by Drona’s advice they are divided among eight
    cities, each of which erects a kaitja or shrine for them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A gathering of followers is held at Kushinagara with Kâshjapa as president
    and designated successor; five hundred followers are chosen to draw up the Sanghiti.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
