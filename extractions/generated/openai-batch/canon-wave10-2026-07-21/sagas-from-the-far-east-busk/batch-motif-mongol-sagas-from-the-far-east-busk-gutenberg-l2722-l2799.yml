canonical_text:
  quote: ''
  summary: A man’s three daughters tend goats in turn. The elder two each lose a goat,
    reach a jeweled palace with a caged white bird, and refuse the bird’s marriage
    bargain. The youngest accepts and becomes his wife. At a thirteen-day temple gathering,
    she is judged the most comely woman, while an admired rider on a dappled grey
    horse excels among the men. An ancient woman later tells the wife that the White
    Bird assumes a man’s form to ride to the festival, and instructs her to hide and
    burn his perch, cage, and feathers so he must remain in his natural form.
  language: English
  quote_policy: summarized
