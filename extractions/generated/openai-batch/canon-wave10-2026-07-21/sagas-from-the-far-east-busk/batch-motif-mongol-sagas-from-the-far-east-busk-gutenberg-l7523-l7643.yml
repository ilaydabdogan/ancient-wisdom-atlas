canonical_text:
  quote: ''
  summary: Vikramâditja volunteers to replace a doomed youth sent as blood tribute
    to the Schimnus. He enters Gandharva's palace, ascends the dazzling Sinhâsana,
    sends the victims home, and defeats the Schimnus by means of brandy and combat.
    Their king multiplies when cut apart, and Vikramâditja transforms into eight lions
    to destroy the multiplied forms. The combat is accompanied by upheavals of mountains,
    plains, and waters; after an incense offering, stability and life return, and
    the people acknowledge Vikramâditja as lawful sovereign. In the frame narrative,
    Sûta narrators and sculptured figures warn Ardschi-Bordschi away from the throne
    unless he can equal Vikramâditja. A new episode begins with an heirless king's
    death and the deaths of successive elected youths after enthronement.
  language: English
  quote_policy: summarized
