canonical_text:
  quote: ''
  summary: In a framed tale, the Siddhî-kür tells how a poor fruit seller overhears
    an aged couple planning to ask the Chongschim Bodhisattva what to do with their
    daughter and jewels. He hides inside the clay image, speaks as if divine, causes
    them to marry the daughter Suvarnadharî to him, and receives their treasure. He
    then hides the maiden and treasure in a buried wooden box and claims to be performing
    a prayer that will make him rich. A Khan's son hunting on the steppe discovers
    the box, takes out the maiden and jewels, and puts a tiger in the box. The poor
    man later retrieves the box, unaware of the substitution, and plans to kill the
    maiden to conceal his treachery.
  language: English
  quote_policy: summarized
