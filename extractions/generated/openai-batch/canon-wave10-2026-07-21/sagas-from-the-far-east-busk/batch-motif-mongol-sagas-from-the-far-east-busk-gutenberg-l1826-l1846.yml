  summary: The Well-and-wise-walking Khan resumes his journey after another failure,
    reaches the grove of the dead, compels the Siddhî-kür down from a mango-tree by
    threatening to fell it, binds him in a bag, and carries him toward Nâgârg'una.
    On the long journey the Siddhî-kür asks for a tale or a token permitting him to
    tell one; the silent Khan nods, and the Siddhî-kür begins a tale.
