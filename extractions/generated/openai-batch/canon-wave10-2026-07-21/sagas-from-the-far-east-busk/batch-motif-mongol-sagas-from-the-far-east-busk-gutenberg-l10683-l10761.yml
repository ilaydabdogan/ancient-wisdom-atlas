    the lion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The lion attacks the ox and tears him to pieces; the foxes then feast on the
    ox and regain influence over the lion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In another fable, an old he-goat left behind on the mountains meets a lion,
    walks boldly toward him, and claims to be a servant of Shiva seeking lions for
    sacrifice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The lion flees from the goat, meets a fox, and the fox recognizes the animal
