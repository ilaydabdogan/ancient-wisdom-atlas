- id: obs:2
  text: A lion-king has two fox ministers and becomes alarmed when he hears the roaring
    of an ox for the first time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fox ministers inspect the ox, find him infirm and harmless, and tell the
    lion that the ox is a terrible Ox-king associated with Shiva and sent to devour
    the animals of the forest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The foxes present themselves as intermediaries between the lion and the ox,
    bring the ox to the lion, and the lion and ox become fast friends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The foxes fear losing influence over the lion, decide the ox must be killed
    by the lion, and tell the lion that the ox is plotting to kill him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During a storm the ox runs back toward the forest, shaking off rain and tearing
