canonical_text:
  quote: ''
  summary: Notes to Tale XIX refer back to Tale XVII, summarize Eastern fables in
    which foxes act as mischief-makers, give a Panchatantra Mitrabheda example where
    fox ministers manipulate a lion-king into killing an ox, summarize another fable
    where a bearded goat frightens a lion with a false sacrificial boast, and state
    that this has similarity with a hare-and-wolf episode in the next tale.
  language: English
  quote_policy: summarized
