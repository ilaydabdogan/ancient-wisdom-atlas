  summary: The passage is a scholarly note on Vikramâditja traditions, dating evidence
    from inscriptions and coins, the limited historical status of popular fables,
    a reported genealogy and royal marriage, a tale in which the celebrated Vikramâditja
    seeks supernatural aid from Kali, receives a conditional invulnerability and long-reign
    promise, and extends that promise through Bhatti’s counsel. It concludes with
    reflections on religion, myth, rebirth, caste, and the weakness of historical
    record-keeping.
