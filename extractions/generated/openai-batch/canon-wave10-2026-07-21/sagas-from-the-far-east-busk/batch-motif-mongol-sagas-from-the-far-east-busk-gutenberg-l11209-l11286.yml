  summary: Editorial notes discuss how traditional legends attach to different named
    persons over time. Examples include anecdotes in which Dante rebukes tradesmen
    for distorting his poem, alternate legends explaining a mountain pass as connected
    either with Julius Caesar or St. Magnus, and a quoted Mongol bardic invocation
    of divine Timour with offerings and a call for his return.
