canonical_text:
  quote: ''
  summary: Ministers summon the Pig's head soothsayer to heal the Khan after others
    have died. The soothsayer, anxious but maintaining his role, arrives in ritual
    dress with a pig's head and performs an apparent incantation. The two Manggus
    fear him and withdraw, which eases the Khan's pain. The soothsayer panics, tries
    to flee, encounters a he-goat, strikes it, and follows it to the Khanin's apartment,
    where he overhears the he-goat and Khanin, identified as the two Manggus, deciding
    to flee because they believe he has discovered their assumed forms and will prevent
    them from devouring the Khan's life. The soothsayer returns to the Khan's side,
    and the Khan wakes improved.
  language: English
  quote_policy: summarized
