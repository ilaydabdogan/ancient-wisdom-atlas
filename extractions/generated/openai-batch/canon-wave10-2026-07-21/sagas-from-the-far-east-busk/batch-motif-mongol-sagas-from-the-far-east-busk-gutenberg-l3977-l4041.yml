canonical_text:
  quote: ''
  summary: A mouse deceives water-dwellers into handing up pebbles so that a hidden
    talisman is recovered. The animal companions return the talisman to Shrikantha,
    whose prosperity is restored; he then asks the talisman for a deva maiden as wife,
    and she descends with attendants and bears him sons. In the frame narrative, the
    Well-and-wise-walking Khan comments on the tale, the Siddhî-kür escapes, and Nâgârg'una
    declares that the Khan has failed his enterprise but is purified and rewarded
    for courage and perseverance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mouse goes to the edge of the stream, paces, and cries out as if afraid,
    causing the inhabitants of the water to come up and ask what is wrong.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mouse tells the water inhabitants that an army is approaching to destroy
    them and can live both on land and in water.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mouse proposes that the water inhabitants build a pier at the water's
    edge for refuge and asks them to hand up the biggest pebbles they can find.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The water inhabitants hand up pebbles, and a frog eventually brings the talisman,
    saying there is no bigger pebble there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mouse takes the talisman to the ape; the ape puts the talisman in his
    mouth and the mouse in his ear, then rides on the bear's back as they return the
    talisman to Shrikantha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Shrikantha has become nearly dead after many days without his three attendants
    providing fruit, but revives when he sees the talisman again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Shrikantha has the talisman in his hand, his former magnificence returns
    at a word, including a flourishing city, shining palace, fruit-heavy trees, and
    singing birds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Shrikantha asks the talisman to make a daughter of the devas come down and
    live with him as his wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A deva maiden descends with a hundred maiden companions, becomes Shrikantha's
    wife, and a hundred sons are born to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Well-and-wise-walking Khan praises Shrikantha as a Brahman's son honoured
    by fortune, after which the Siddhî-kür exclaims and escapes from sight.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Nâgârg'una tells the Khan that he has not succeeded in his enterprise, but
    that his courage and perseverance in fetching the Siddhî-kür thirteen times remove
    the stain of blood from him and will bring him exceptional good fortune and happiness.
  category: speech
  evidence_refs:
  - ev:6
