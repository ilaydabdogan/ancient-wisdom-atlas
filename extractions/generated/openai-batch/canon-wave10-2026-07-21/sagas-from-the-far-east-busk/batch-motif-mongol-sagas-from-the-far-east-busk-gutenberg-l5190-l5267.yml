canonical_text:
  quote: ''
  summary: In the frame narrative, the Well-and-wise-walking Khan carries the bound
    Siddhî-kür, eats from an undiminishing cake, and hears a tale. In the tale, a
    starving lioness kills a cow who stays behind with her calf, the orphaned calf
    later suckles alongside the lioness's cub, and the lioness charges the two milk-siblings
    to remain at peace before dying from a bone in her throat. The cub and calf continue
    to meet at a stream, but a fox who resents their bond deceives the cub by claiming
    the calf plans to kill him and by inventing signs that will prove the accusation.
  language: English
  quote_policy: summarized
