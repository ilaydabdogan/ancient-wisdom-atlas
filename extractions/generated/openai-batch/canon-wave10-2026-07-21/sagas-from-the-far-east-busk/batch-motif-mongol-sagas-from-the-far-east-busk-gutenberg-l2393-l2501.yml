- id: obs:2
  text: Before the annual water-flowing, the custom is to sacrifice a youth of a certain
    age to the Serpent-gods living at the water-head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On this occasion the required youth is one born in the Tiger-year, and herdsmen
    report such a youth among the Hermit's two sons in a cave near a rocky pass.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Khan sends three envoys to fetch the Hermit's son for the sacrifice.
  category: action
