canonical_text:
  quote: ''
  summary: A Khan's kingdom annually prepares irrigation by propitiating Serpent-gods
    at the water source with a youth sacrifice. A Tiger-year youth named Sunshine
    is found with a Hermit, hidden in a pottery vessel, discovered, and taken. The
    Khan's daughter pities him and insists on sharing his fate; the Khan orders both
    sewn into a bullock hide and cast into the water. Their mutual laments for one
    another move the Serpent-gods, who free them and release water for irrigation.
    Sunshine returns first to console his grieving adoptive father, then the Khan
    invites and honors him.
  language: English
  quote_policy: summarized
