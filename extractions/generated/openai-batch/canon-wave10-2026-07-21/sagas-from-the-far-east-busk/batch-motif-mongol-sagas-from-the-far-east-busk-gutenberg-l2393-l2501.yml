  text: The Khan's daughter sees Sunshine, feels compassion, asks that he not be thrown
    into the water, and says that if he is thrown in she should be thrown in with
    him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Khan orders Sunshine and his daughter sewn together into one bullock's
    skin and cast into the water to the Serpent-gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sunshine and the Khan's daughter each says that their own sacrifice is less
