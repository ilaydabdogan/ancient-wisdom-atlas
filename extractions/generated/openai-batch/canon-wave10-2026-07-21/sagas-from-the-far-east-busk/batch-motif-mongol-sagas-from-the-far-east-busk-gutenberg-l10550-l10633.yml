canonical_text:
  quote: ''
  summary: The passage consists of editorial notes and a quoted Spanish fable with
    English translation. It says that a version of a story may have travelled to Spain
    and suggested Yriarte's fable about a donkey that accidentally makes a flute sound
    and then boasts of musical skill. Further notes mention a woman inventing a frightening
    name as a trap for her husband, explain Sûrja/Sura and Bagatur as hero terms with
    associations of heaven, the sun, and warrior afterlife, describe Tibetan women's
    horsemanship, and cite a similar story in Barbazan's Fabliaux.
  language: English with embedded Spanish
  quote_policy: summarized
