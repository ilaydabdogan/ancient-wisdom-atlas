canonical_text:
  quote: ''
  summary: A widowed mother saves her son from a ruler who kills youths after they
    comb his hair and discover his ass-like ears. She sends cakes made with her breast
    milk; after the ruler eats one, he spares the youth because they have shared one
    mother's milk, but binds him by oath to silence. The kept secret makes the youth
    ill. His mother advises him to speak it into an uninhabited natural hollow. He
    cries the secret into a marmot hole and recovers, but the marmot, echo, and wind
    transmit the words back to the ruler, who summons and questions him.
  language: English
  quote_policy: summarized
