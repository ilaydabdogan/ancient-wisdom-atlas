canonical_text:
  quote: ''
  summary: A king keeps his only daughter Naran Gerel secluded under harsh penalties.
    After she obtains permission for a controlled outing, she sees the minister Ssaran
    at a window and signals a secret invitation. Ssaran's wife interprets the signs,
    encourages him, and gives him a jewel. Ssaran meets Naran Gerel in her garden,
    but they are captured and imprisoned. In prison, Naran Gerel uses the jewel to
    induce a guard to go knock three times at Ssaran's house.
  language: English
  quote_policy: summarized
