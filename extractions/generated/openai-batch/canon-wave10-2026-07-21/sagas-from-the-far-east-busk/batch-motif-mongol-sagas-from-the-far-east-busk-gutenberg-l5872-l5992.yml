canonical_text:
  quote: ''
  summary: In a framed tale told by the Siddhî-kür, a tamer travels with a red-colored
    dog who becomes a beautiful woman and says the Serpent-king gave her to him as
    wife. The husband burns her dog form while she bathes, removing her means of refuge.
    Her wondrous hairs drift downstream and lead a Khan to send armed men to seize
    her. She plans a later escape involving a mountain visit, a magpie-feather garment,
    and her husband's comic dance. During the intervening year the husband falls into
    poverty but uses a magical object and wand to obtain food, then prepares the feather
    disguise. At the mountain he dances before the Khan and the woman, now called
    Khanin, laughs for the first time in a year.
  language: English
  quote_policy: summarized
