  quote: ''
  summary: Editorial notes to Tale XIII gloss the name Shrikantha, discuss Indian
    merchant and caste terminology, cite Indian and classical accounts involving apes,
    summarize several fable episodes involving animals, and note a similar jewel-recovery
    episode in an Italian Tirol legend.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shrikantha is glossed as meaning one whose cup contains good fortune and is
    compared to being born with a silver spoon in his mouth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Manu assigns trading, cattle-care, sacrifice, Veda-reading,
    lending, and agriculture to the Vaishja caste, and it cites a legend in which
    the Lord of Creation assigns occupations to castes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes Banig as a typical merchant in legendary tales and explains
    the term as literally meaning merchant's son.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cited Vedic hymn praises Asvin for protecting Bhugju's hundred-oared ship
    through the immeasurable, fathomless ocean and bringing it safely back to land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says apes occur frequently in Indian fables and epic poetry, and
    it notes that Rama took apes as allies and re-established an ape-king.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kleitarchos is cited for an account in which Alexander encountered apes arranged
    in battle array and was dissuaded from attacking them by Taxiles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In one cited Pantcha-Tantra fable, the King of Kamanapura appoints an ape
    as bodyguard; when a thief brings in a serpent, the ape flees at the sight of
    its natural enemy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In another cited fable, apes repeatedly evade traps set by a Brahman whose
    melons they eat; one ape notices that the apparently dead Brahman is holding a
    stick and warns the others.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says Indian story tradition contains many tales in which advantage
    in this life is presented as the object and reward of good actions.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: A cited Pantcha-Tantra story has an elephant trapped in a deep dyke and advised
    by a Brahman to recall any good deed it has done and call on the beneficiary for
    help.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The elephant remembers freeing rats from earthen jars; the rats repay the
    aid by gnawing the dyke earth until the elephant can walk out.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: The passage notes a precisely similar episode involving recovery of a jewel
    by ancillary beasts in a legend of another ruin of the Italian Tirol.
  category: relationship
  evidence_refs:
  - ev:12
