canonical_text:
  quote: ''
  summary: Editorial and explanatory notes recount a legend in which Hercules gives
    Southern India and pearls to his daughter Pandaia, from whom the Pândava dynasty
    is said to spring; note a structural comparison with the Spanish colonial tale
    "Matanzas"; gloss "Lama" as Buddhist priest; and explain tîrthas as sacred river-edge
    pilgrimage places whose visits and offerings confer merit equivalent to sacrifices.
    The passage also names tîrthas associated with Rishis, Brahma, Vishnu in boar
    form, princes, Brahmans, and horse-sacrifice traditions in Vedic, epic, Gupta,
    and Turanian contexts.
  language: English
  quote_policy: summarized
