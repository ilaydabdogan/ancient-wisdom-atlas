canonical_text:
  quote: ''
  summary: After a broken contract, the elder brother leaves carrying a sack and a
    hammer. The younger brother's wife secretly follows him, steals the hammer, shuts
    herself inside her house, and tries to loosen the ninth knot by imitating his
    action. Because she does not know how to control the force, the blow kills the
    man. His possessions pass to the elder brother. The Khan comments that excessive
    avarice caused the loss, and the Siddhî-kür escapes again after the Khan speaks.
  language: English
  quote_policy: summarized
