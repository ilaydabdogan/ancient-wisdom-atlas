canonical_text:
  quote: ''
  summary: King Gandharva, lacking an heir by his senior queen Udsesskülengtu-Gôa-Chatun,
    takes a lower-status wife who bears him a son. The senior queen, grieving, visits
    a powerful lama beyond the mountain, receives a ritual prescription involving
    earth boiled in sesame oil, and later bears a son amid auspicious signs. A later
    prophecy about the child's need for immense quantities of salt is misunderstood
    by the king, who orders the child killed; ministers instead abandon him in a thick
    wood, where the child speaks to a minister.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gandharva is introduced as a king married to Udsesskülengtu-Gôa-Chatun, the
    daughter of King Galindari.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gandharva has no heir, prays continually to Buddha for a son, and accepts
    the senior queen's suggestion to marry a lower-status wife, who bears him a son.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Udsesskülengtu-Gôa grieves when the king's heart turns toward the lower-status
    wife and recalls that her father helped Gandharva attain the throne and that she
    advised the second marriage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A maiden tells the queen of a lama with prodigious powers living by the kaitja
    on the other side of the mountain; the queen prepares to visit him with four maidens
    and provisions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the kaitja, the queen makes obeisance while the hermit is in meditation
    and receives his attention only after changing her kneeling place three times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hermit blesses the queen with succession and many children, gives her
    a handful of earth, and tells her to boil it in sesame oil in a porcelain vessel
    and eat all of it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The queen boils the earth as instructed; it changes into barley porridge,
    but she leaves some uneaten, and the maiden who suggested the visit later eats
    the remainder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Before the queen gives birth, propitious tokens appear: blossoms fall instead
    of rain, the kalavinka''s voice is heard, and perfumes fill the air.'
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The queen bears a son, and the king rejoices that he now has an heir born
    of a princess rather than of the lower-status wife.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The king sends an expedition led by the younger wife and accompanied by great
    men of state to ask the lama what the child's fate will be.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The lama says that fifteen thousand wagon-loads of salt should be prepared
    for the child when he grows up, because this will be small compared with what
    his kitchen will require.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Gandharva misunderstands the prophecy, calls the child a hundredfold schimnu,
