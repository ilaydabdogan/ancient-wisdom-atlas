canonical_text:
  quote: ''
  summary: A man presented as a soothsayer performs a public divination with a pig's
    head and then finds the Khan's hidden talisman in a dung-heap. After receiving
    modest requested goods and additional provisions, his wife writes to the Khan
    in his name, claiming the life-talisman revealed the Khan's infirmity and that
    the dog and fox were needed to conjure it away; the Khan rewards her with treasure.
    The passage then recounts how the Khan and his six brothers brought home a beautiful
    maiden and a he-goat, later identified as evil Râkshasas or Manggus in deceptive
    forms, who devoured the brothers' lives year by year.
  language: English
  quote_policy: summarized
