candidate_motifs:
- id: motif:1
  label: fatal attraction to an unseen beautiful voice
  taxonomy_refs: []
  basis: The wife is drawn by a melodious voice, kills her husband to find its owner,
    and discovers the singer is physically repulsive and sick.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage condemns the wife’s action; it does not explicitly identify
    the singer as a supernatural tempter.
- id: motif:2
  label: appearance contradicted by voice
  taxonomy_refs: []
  basis: The wife assumes that a melodious voice belongs to a handsome man, but the
    singer is described as deformed, sore-covered, and sick.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: This is a local narrative contrast rather than an explicit symbolic doctrine.
- id: motif:3
  label: moral riddle provoking speech
  taxonomy_refs:
  - wisdom
  basis: The King’s tale ends with a question about whether the woman is good or bad;
    the wrong answer of the lamp-minister provokes Naran-Dâkinî to speak and give
    judgment.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The taxonomy reference is limited to the riddle/judgment function in the
    passage.
- id: motif:4
  label: bride won by making the silent woman speak
  taxonomy_refs:
  - sacred_exchange
  basis: Vikramâditja says that inducing Naran-Dâkinî to speak twice entitles him
    to his guerdon, namely that she accompany him home as wife.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage frames this as a reward condition; broader marriage-test interpretation
