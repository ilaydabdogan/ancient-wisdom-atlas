canonical_text:
  quote: ''
  summary: A man and wife travelling in mountains hear a beautiful voice. The wife
    wishes to find the singer; after the husband resists, she asks him to fetch water,
    pushes him over a precipice, and kills him. She discovers that the singer is not
    handsome but a deformed sick man, carries him, and dies from exhaustion. The tale
    becomes a moral question posed by the King to Naran-Dâkinî; a transformed minister,
    as a lamp, suggests the wife may be good, but Naran-Dâkinî condemns her. Vikramâditja
    claims his reward because he has made Naran-Dâkinî speak, she becomes his wife,
    he restores transformed companions, and returns to rule. The Sûta then challenges
    Ardschi-Bordschi’s fitness to ascend the throne with his chief wife, citing Vikramâditja
    and Tsetsen Budschiktschi as standards. A new framed tale begins with a king’s
    sick wife cured by eating parrot brains, leading the king to demand a tribute
    of seventy-one parrots’ brains from a provincial governor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and his wife travel through a mountainous country and hear a voice of
    surpassing sweetness from the other side of a rock; even their beasts react to
    the sound.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife says that a man with such a melodious voice must be goodly to see
    and asks whether they should stop and find him; the husband objects, saying that
    hearing the voice is enough.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a mountain-rill, the wife says she is faint with thirst and asks her husband
    to fetch her cool water using her cup.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: While the husband fetches water, the wife silently comes behind him, pushes
    him over a precipice, and kills him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wife follows the sound and finds a deformed, sore-covered, sickly man
    rather than a handsome singer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The wife carries the sick man on her back, but the steep way and his weight
    exhaust her, and she dies soon afterward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The King asks whether the woman should be counted good or bad, and Naran-Dâkinî
    initially remains silent.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The minister transformed into a lamp proposes that the woman may be counted
    good because carrying the sick man atoned for killing her husband.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Naran-Dâkinî rejects the lamp’s answer, saying there is no good in a woman
    who killed her lawful husband because of an artful melodious voice, and she calls
    the woman a schimnu.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Vikramâditja states that because he has induced Naran-Dâkinî to speak twice
    to a man, she must give him his guerdon by accompanying him home as his wife.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Naran-Dâkinî descends from her altar and gives herself to Vikramâditja to
    accompany him home as his wife.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Vikramâditja restores Schalû, his three ministers, and five hundred sons of
    kings to their natural shapes, returns to his capital with Naran-Dâkinî, convenes
    an assembly, promulgates religious rules, and rules happily with Tegrijin Naran.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Sûta tells Ardschi-Bordschi that if he can boast of being such a king
