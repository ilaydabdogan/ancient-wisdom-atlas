canonical_text:
  quote: '"But he who gave a soul that could be loved, was it not he alone who made
    woman?"'
  summary: 'Naran-Dâkinî indignantly rejects the judgment of speaking unsouled objects
    and interprets a parable about contributors to a created woman: the wood-shaper
    as father, the painter as mother, the giver of wit as Lama, and the giver of soul
    as the one who made her and should be her husband. The King has made her speak
    once, but she must speak twice; he asks her to tell a tale, she remains silent,
    and the minister transformed into an altar asks the King to continue storytelling.'
  language: English
