- id: obs:1
  text: After the death of the woman's parents and the destruction of the herds and
    flocks, one lamb escaped and hid in a hole in the ground, coming out at night
    to graze.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lamb told the hare that she alone had escaped the wolves and jackals and
    asked the hare to be her protector.
  category: speech
  evidence_refs:
