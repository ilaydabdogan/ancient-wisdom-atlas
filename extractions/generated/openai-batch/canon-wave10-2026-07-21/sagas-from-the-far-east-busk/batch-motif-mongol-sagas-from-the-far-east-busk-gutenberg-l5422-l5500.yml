  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lamb feared meeting the wolf in the open country, but the hare told her
    he would provide for that danger.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the journey, the hare instructed the lamb to pick up a hand-loom, a piece
