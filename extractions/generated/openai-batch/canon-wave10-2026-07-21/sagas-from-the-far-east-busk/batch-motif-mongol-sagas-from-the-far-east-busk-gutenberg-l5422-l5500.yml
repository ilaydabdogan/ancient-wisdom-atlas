canonical_text:
  quote: ''
  summary: A lone lamb, survivor of a destroyed flock, meets a hare and asks for protection.
    The hare leads the lamb toward other flocks, has her collect a hand-loom, yellow
    cloth, and written paper, then uses these objects as throne, royal mantle, and
    divine document when a wolf approaches. The wolf is frightened by the hare's display
    and the supposed command from Churmusta demanding wolf skins, and flees. The hare
    and lamb reach fertile pasture. In the frame, the Khan praises the hare, and the
    Siddhî-kür escapes because the Khan has spoken.
  language: English
  quote_policy: summarized
