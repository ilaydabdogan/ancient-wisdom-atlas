canonical_text:
  quote: ''
  summary: At the start of Tale V, the Well-and-wise-walking Khan realizes he has
    again failed to reach the end and object of his journey. He returns to the cool
    grove, summons the Siddhî-kür, threatens the mango-tree, and carries the Siddhî-kür
    bound in a many-coloured bag. The Siddhî-kür asks for a tale to ease the journey;
    when the Khan stays silent, the Siddhî-kür asks for a token permitting him to
    tell one. The Khan nods, and the Siddhî-kür begins the tale.
  language: English
