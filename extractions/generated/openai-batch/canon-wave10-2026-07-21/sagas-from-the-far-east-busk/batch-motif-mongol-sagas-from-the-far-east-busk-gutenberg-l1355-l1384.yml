canonical_text:
  quote: ''
  summary: The Well-and-wise-walking Khan resumes his failed labor, travels to a grove
    where dead bodies rest, and captures the Siddhî-kür after threatening the mango-tree
    into which it has climbed. He carries the Siddhî-kür in a bag toward Master and
    Teacher Nâgârg'una. During many days of silent travel, the Siddhî-kür asks for
    conversation and then for a wordless nod permitting it to tell a tale; the Khan,
    obeying Nâgârg'una's command not to speak, nods, and the Siddhî-kür begins.
  language: English
  quote_policy: summarized
