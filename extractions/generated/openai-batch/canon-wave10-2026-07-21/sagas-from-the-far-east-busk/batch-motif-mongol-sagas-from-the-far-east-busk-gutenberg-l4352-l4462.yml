canonical_text:
  quote: ''
  summary: A clever prince and a minister's son study for twelve years in the Diamond-kingdom.
    On their return, the prince understands a crow's cry as directions to water. The
    minister's son becomes jealous, leads him into a mountain forest, kills him, and
    reports his death to the king. The prince's last word, Abaraschika, cannot be
    interpreted by the kingdom's specialists, whom the king confines and threatens
    with death.
  language: English
  quote_policy: summarized
