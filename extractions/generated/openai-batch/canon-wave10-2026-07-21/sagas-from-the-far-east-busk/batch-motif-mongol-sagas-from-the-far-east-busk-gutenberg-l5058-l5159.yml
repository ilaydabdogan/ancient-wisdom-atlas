canonical_text:
  quote: ''
  summary: 'A prince and his troops mistake Shanggasba for an extraordinary hero and
    flee, allowing him to collect spoils as proof of victory. The King promises him
    the Princess, but the Queen imposes further tests: killing an enormous striped
    fox and then slaying seven mounted demons in the North. The fox accidentally strangles
    itself in Shanggasba''s lost bowstring, and the demons die after eating poisoned
    white bread that the Queen had prepared for Shanggasba.'
  language: English
  quote_policy: summarized
