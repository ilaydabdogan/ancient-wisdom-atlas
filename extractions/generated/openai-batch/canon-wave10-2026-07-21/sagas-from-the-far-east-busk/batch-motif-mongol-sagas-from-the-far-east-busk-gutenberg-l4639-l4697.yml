canonical_text:
  quote: Women are faithful and vigilant animals
  summary: A woman shelters in a rock hole that is a wild beasts' den. A hare watchman
    persuades the beasts to spare her and makes her guard the cave. She later feeds
    her hungry husband, who follows her to the den despite her warning. The beasts
    discover him and kill both husband and wife. The Khan comments on the wife's devotion,
    and Siddhî-kür escapes after the Khan speaks.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A storm begins, and the woman takes shelter in a straw-littered hole in a
    rock.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hole is the den of lions, tigers, bears, and other wild beasts, with a
    hare stationed as watchman at the opening.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: At night the beasts return and do not notice the woman until a straw, moved
    by her, tickles the hare's nose.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the morning the beasts uncover the woman in the straw and are angry, but
    the hare asks that she be given to him to help watch the cave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hare orders the woman to keep strict watch over the cave and not let anyone
    enter; he treats her well and feeds her game brought by the beasts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Remembering her husband, the woman takes game from the den and secretly throws
    it down through the smoke-hole to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The husband infers that his wife is feeding him and follows her tracks in
    the snow to the wild beasts' den.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wife warns her husband that the den is a wild beasts' lair, but he refuses
    to leave, and she hides him in the straw.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hare detects the scent of a new creature, and in the morning the beasts
    find the woman's husband hidden in the straw.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The beasts decide that if one person becomes two and then more, they may be
    outnumbered and lose their place; they tear the woman and her husband in pieces.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Khan says the woman fell as a sacrifice to devotion to a husband who did
    not deserve it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the Khan speaks, Siddhî-kür says the Khan has opened his lips and then
    speeds away through the air.
  category: sequence
  evidence_refs:
  - ev:10
