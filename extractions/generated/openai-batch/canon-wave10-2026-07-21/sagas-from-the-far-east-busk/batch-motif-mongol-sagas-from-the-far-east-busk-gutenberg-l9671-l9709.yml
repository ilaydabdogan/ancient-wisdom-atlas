canonical_text:
  quote: ''
  summary: Commentary notes to Tale III identify milk-broth as a staple food in Mongolia;
    explain Schimnu or Schumnu as a Buddhist devil, personified evil, and lower-world
    prince whose Schumnus tempt mortals and change forms; cite a Spanish ballad and
    another tale as comparative parallels; describe an early Indian belief in gods
    dwelling among inaccessible heights and the sacred mountain Meru; and identify
    Churmusta with Indra, who calls the earthly hero Massang to fight Schimnu-Khan
    because demons seek entrance into his paradise.
  language: English
  quote_policy: summarized
