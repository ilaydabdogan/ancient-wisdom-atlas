canonical_text:
  quote: '"Lay aside thine assumed form!"'
  summary: A pretended soothsayer using a pig's head exposes a he-goat and the Khanin
    as Manggus beings, after which the people kill them. He is honored and rewarded,
    his wife secures greater reward by a disguised letter, and the Khan grants them
    shared rule. In the frame ending, the Well-and-wise-walking Khan speaks, and the
    Siddhî-kür escapes through the air.
  language: English
  quote_policy: quoted
