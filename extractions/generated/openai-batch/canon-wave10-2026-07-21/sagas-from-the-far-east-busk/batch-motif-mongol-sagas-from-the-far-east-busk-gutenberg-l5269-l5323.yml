canonical_text:
  quote: ''
  summary: A fox approaches a grazing calf and claims that a lion-cub intends to kill
    him. The calf initially says the cub is his brother, but the fox gives supposed
    signs by which the cub's hostile intent may be known. The next morning the calf
    and cub observe each other, mistake ordinary animal habits for threatening signs,
    fight at a stream, and both die before the fox. A voice from svarga gives a moral
    warning against trusting a false friend; the frame narrative then has the Khan
    speak and the Siddhî-kür escape through the air.
  language: English
  quote_policy: summarized
