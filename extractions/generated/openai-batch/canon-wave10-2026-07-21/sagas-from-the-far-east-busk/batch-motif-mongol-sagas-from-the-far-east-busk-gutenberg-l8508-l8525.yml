canonical_text:
  quote: ''
  summary: A wise parrot concludes a tale by holding up the wife of minister Ssaran
    as a model of devotion and bravery, warning the merchant's wife not to leave the
    house unless she is like that model. The merchant's wife abandons her plan to
    go out, and the parrot continues this conduct throughout the merchant's seventy-one-day
    absence. The Sûta then tells Ardschi-Bordschi that only if his wife is comparable
    to Ssaran's wife, or to Tsetsen Büdschiktschi, wife of King Vikramâditja, may
    she prostrate herself at the foot of the throne; otherwise she must not approach
    it.
  language: English
