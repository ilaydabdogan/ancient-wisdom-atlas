canonical_text:
  quote: ''
  summary: After Gandharva's body is burned, he appears in the heavens, warns Udsessküleng-Chatun
    that the Schimnus will attack within seven days, and tells her to flee with their
    son Vikramâditja before he enters Nirvâna. The Khanin departs with her attendants.
    A maiden who had eaten blessed leftover porridge also bears a child; the attendants
    refuse to carry him and the Khanin has him left alive in a cave. The Khanin and
    Vikramâditja reach another king's capital and receive shelter. Vikramâditja is
    raised and trained in many arts. Later merchants find a boy in a wolf's den, take
    him away, and name him Schalû. At night Schalû translates the wolves' howls as
    the speech of his wolf-parents, who say he was abandoned by women at birth, warn
    of flooding rain, and mention a prowling robber.
  language: English
  quote_policy: summarized
