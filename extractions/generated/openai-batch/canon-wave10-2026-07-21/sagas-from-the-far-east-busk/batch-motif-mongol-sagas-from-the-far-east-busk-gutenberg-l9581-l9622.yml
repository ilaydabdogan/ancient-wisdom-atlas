canonical_text:
  quote: ''
  summary: An editorial note identifies Erlik-Khan with Sanskrit Jama, describes Jama
    as judge and ruler of the dead, gives his genealogy from Vivasvat, notes associations
    with conscience, reports animal offerings to Jama as god of death, describes a
    bottomless pit or cave of Pluto connected with sacrifice, mentions expressions
    and geography associated with death and Jama, and glosses Mandala as a magic circle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Erlik-Khan is identified as the Tibetan name of Jama, who is described as
    Judge of the Dead and ruler over the abode of the departed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jama is described as a son of Vivasvat, the Sun; Vivasvat is also described
    as having another son, Manu, founder of social life and source of kingly dynasties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Jama's characteristics have varied, and that some Indian
    writings speak of him as if he were a personification of conscience.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cited passage from Manu says Jama dwells within the heart and connects having
    no variance with him to having no need for pilgrimage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Muni is described as one who keeps watch over virtue and sin and as more properly
    representing conscience.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A people on the westernmost borders of the Indus valley are reported to have
    honored Jama as god of death and to have deprecated his wrath with offerings of
    beasts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A passage attributed to Ælianus mentions a bottomless pit or cave of Pluto
    in the land of the Aryan Indians, into which people who heard a divine voice or
    met an evil omen threw beasts according to their possessions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The beasts sacrificed in this way are listed as sheep, goats, oxen, and horses;
    the passage says a supernatural power constrained them to go without binding or
    driving.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports a belief that the thrown animals continued a mysterious
    existence in the regions beneath.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The expression “to walk the path of Jama” is reported as an expression for
    dying; a battlefield is called the camp of Jama, and the South is described in
    the Veda as the kingdom of Jama and the place of infernal regions.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mandala is glossed as a magic circle.
  category: object
  evidence_refs:
  - ev:8
