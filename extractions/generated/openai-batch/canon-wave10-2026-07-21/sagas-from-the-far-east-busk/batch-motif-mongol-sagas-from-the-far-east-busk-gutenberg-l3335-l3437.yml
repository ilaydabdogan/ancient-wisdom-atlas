canonical_text:
  quote: ''
  summary: 'Frame episode: the Well-and-wise-walking Khan again seeks the escaped
    Siddhî-kür, consents to hear a tale, and later speaks at the tale''s conclusion,
    enabling Siddhî-kür to escape. Embedded tale: an excluded younger brother follows
    his elder brother''s wife to a burial-place, sees her try to feed the dried corpse
    of her former husband, and witnesses the corpse biting off the tip of her nose.
    She falsely accuses her living husband, but the younger brother proves the truth
    when the severed nose-tip is found in the corpse''s mouth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Well-and-wise-walking Khan finds that Siddhî-kür has escaped again, goes
    to the cool grove, seeks him out, and gives consent for a tale to be told.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two brothers are married to two sisters, but the brothers are estranged; the
    elder brother is rich, miserly, and gives no portion of his riches to the younger
    brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elder brother prepares a great feast and invites the neighbourhood, but
    does not invite the younger brother on any of the three days expected by the younger
    brother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After being excluded from the feast, the younger brother decides to steal
    his portion of the feast and hides in the elder brother's store-chamber at night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder brother, drunk and asleep, is put to bed in the store-chamber by
    his wife; later the wife rises, prepares choice meat and dainties, and leaves
    with them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The younger brother follows the woman behind the house, past a steep rock,
    to a dreary burying-place.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the burying-place, the woman comes to a paved floor where the dried body
    of her former husband lies, kisses and hugs the body, calls it by name, and tries
    to feed it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dead man's mouth snaps shut, first breaking a copper spoon and then biting
    off the tip of the woman's nose when she tries again to feed him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman returns home, pretends to wake with a cry, and accuses her living
    husband of biting off her nose in his sleep.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Neighbours testify that the woman's nose was whole the previous night and
    is now bitten; the Khan rules for the woman and condemns the husband to the stake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The younger brother, despite prior ill-treatment by the elder brother, tells
    the Khan that the corpse caused the injury and that the elder brother is innocent.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Khan initially rejects the younger brother's claim as unbelievable, asks
    whether dead men bite the living, and sentences the younger brother to confiscation,
    beggary, and shorn-headed disgrace.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The younger brother asks to prove his claim; the Khan sends to the burying-place,
    the nose-tip is found in the corpse's mouth, the two brothers are freed, and the
    woman is tied to the stake.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the end, the Well-and-wise-walking Khan speaks about the value of proof
    in judgment; Siddhî-kür says the Khan has opened his lips and escapes through
    the air.
  category: sequence
  evidence_refs:
  - ev:8
