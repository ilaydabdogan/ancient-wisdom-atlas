canonical_text:
  quote: ''
  summary: 'A Brahman''s son named Shrikantha spends his trading goods to free a mouse,
    an ape, and a bear from boys who are tormenting them. Having no merchandise left,
    he steals silk from the Khan''s palace, is caught, sealed in a coffer, and cast
    into the water. The rescued animals save him: the mouse opens an air-hole, the
    ape tears a larger opening, and the bear drags the coffer ashore on an island.
    Shrikantha finds a jewel, treats it as a talisman, wishes himself to dry land,
    then wishes a city and palace into being. He later exchanges the talisman with
    merchants and wakes back on the water-bound island.'
  language: English
  quote_policy: summarized
