canonical_text:
  quote: ''
  summary: A lawless subject is banished, travels to a feather-grass plain, witnesses
    daemons feasting beneath a palm-tree, and obtains an inexhaustible goblet. He
    then deceives three travelers to gain a self-acting stick, an iron tower-making
    hammer, and a rain-making bag. Returning despite the Khan's ban, he raises a nine-storey
    iron fortress behind the palace, and the Khan surrounds it with fire and smiths'
    bellows until it becomes a furnace.
  language: English
  quote_policy: summarized
