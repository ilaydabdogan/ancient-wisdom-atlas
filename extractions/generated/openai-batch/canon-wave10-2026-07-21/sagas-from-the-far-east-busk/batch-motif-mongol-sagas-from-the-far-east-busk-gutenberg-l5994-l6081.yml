canonical_text:
  quote: ''
  summary: The Khanin tricks the Khan into wearing a magpie-feather costume while
    her husband wears the Khan's royal clothing. She orders the guards to treat the
    magpie-dressed dancer as an impostor; the Khan is barred, chased by dogs, and
    devoured. The Khanin's husband is installed in the Khan's possessions. Four sons
    are then born, fulfilling the White Serpent-king's prediction; each son becomes
    a powerful ruler with extraordinary abilities or accomplishments.
  language: English
  quote_policy: summarized
