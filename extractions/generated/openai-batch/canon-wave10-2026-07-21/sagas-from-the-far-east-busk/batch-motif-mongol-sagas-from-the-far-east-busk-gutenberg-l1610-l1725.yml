canonical_text:
  quote: ''
  summary: Massang withstands and defeats a witch-woman, follows her blood trail with
    his companions to a rock cleft containing her corpse and treasure, descends by
    rope, and is abandoned below when his companions seize the spoil. In the cave
    he plants three cherry-stones, sleeps for many years beside the corpse, wakes
    to find three trees reaching the top of the rock, and climbs out. He later confronts
    and spares the companions, then leaves to fulfill a promise to seek his master.
    At a well he sees a beautiful maiden whose footsteps produce flowers, follows
    her across extreme landscapes to the dwelling of the gods, and hears Churmusta
    announce an impending battle with the black Schimnu.
  language: English
  quote_policy: summarized
