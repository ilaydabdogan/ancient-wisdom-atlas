canonical_text:
  quote: ''
  summary: 'The passage contains several Nix''a"t episodes: he taunts a bird with
    an immense arrow and is trapped under a rock until Night-hawk breaks it; he obtains
    and misuses a power of sending out his eyes, then recovers them with Mouse''s
    help and water; he receives a wife duplicated by a stranger''s fourfold striking
    gesture, imitates the act for other mourners, and finally kills his wife; and
    a summarized Bear-Women episode describes berries, reflected fruit in water, cannibal
    Bear-Women, wood for the fire, and Nix''a"t blocking the tent door before fleeing.
    The passage also includes explicit editorial comparisons to Arapaho versions and
    ends with the heading of the next tale.'
  language: English
  quote_policy: summarized
