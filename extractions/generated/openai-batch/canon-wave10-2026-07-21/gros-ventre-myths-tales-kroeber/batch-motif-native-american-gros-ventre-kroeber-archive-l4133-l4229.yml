canonical_text:
  quote: ''
  summary: A sequence of Gros Ventre tale abstracts describes White-Stone’s stone
    birth and avenging acts; women who marry or are taken by celestial and buffalo
    husbands; abandoned children who survive an old woman, receive fire, and gain
    lethal powers; a girl transformed into a bear and a star-ascent ending; an impostor
    Loon who poses as Shell-Spitter; Yellow-Plume and Blue-Plume defeating an old
    woman with water; and swallows whose young are killed by a snake or water-monster
    until thunder kills it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seven brothers go out and are killed one after another; their sister swallows
    a stone and gives birth to a boy called White-Stone, who grows after being swung
    on four sides of the tent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: White-Stone kills a buffalo, forces the old woman who killed his uncles to
    carry it, kills her with her iron cane, and causes his uncles to emerge alive
    from a tent after he shoots upward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: White-Stone travels to a camp with a powerful jealous invulnerable bull, approaches
    the bull’s wife, and kills and burns the bull after the bull breaks his horns
    attacking him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two women lying outdoors wish for the moon and a star as husbands; one follows
    a porcupine up a stretching tree to the sky and marries the Moon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Moon’s wife is told not to dig certain roots, does so, sees the earth
    below, becomes sad, and is lowered to earth by a sinew rope.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Another woman is taken by a bull who says he is the star she wished for; Gopher
    rescues her through a long hole, and buffalo pursue her and her parents after
    finding her empty robe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In a related abstract, one woman marries a star while another is taken by
    a buffalo-bull; Gopher, Badger, and Bald Eagle each recover or carry away the
    buffalo-taken woman, while the invulnerable Bull pursues.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A camp abandons little children, and an old woman kills them at night except
    for a girl and her little brother; the girl survives by bringing the wood and
    water the old woman wants.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The surviving girl leaves an awl in her place, flees with her brother, crosses
    a river on a water-monster, and the old woman is drowned by the water-monster.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the children are tied to a tree, a dog frees them and gives them fire;
    the boy kills buffalo by looking at them, and the siblings later kill most of
    the starving people by looking at them after selecting spouses.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A playing child becomes a bear, kills the children and the camp except her
    little sister, and later pursues the little sister and six brothers.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Bear is first killed by an arrow of tendon shot into her little finger;
    after her body is burned, an overlooked spark becomes the Bear again, and the
    pursued siblings create obstacles before rising to the sky as stars when the little
    girl kicks a ball.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Loon pretends to be Shell-Spitter and marries two girls; the girls later see
    the real Shell-Spitter in the dance-lodge, after which Loon kills Shell-Spitter
    and escapes with Badger-Woman.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: A boy follows his gaming-wheel to an old woman’s tent, survives her smothering
    attempt and water-fetching test through supernatural instruction, leaves an awl
    for her to step on, and with his brother raises water to drown her.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: A snake or water-monster kills young swallows and destroys birds brought to
    help them; thunder finally kills the snake.
  category: sequence
  evidence_refs:
  - ev:15
