canonical_text:
  quote: ''
  summary: 'The passage begins with an editorial note comparing motifs in a preceding
    item with Arapaho parallels. It then gives a brief tale in which a bald eagle
    carries off and drops a man who is catching eagles from a covered pit. A longer
    tale follows: a younger wife tempts her husband’s younger brother into becoming
    her lover and eloping with stolen horses. At an abandoned camp, the young man
    finds war gear, plans to ambush the returning owner under cover of peace-smoking,
    wrestles with the stranger, is betrayed by the woman, then kills the stranger
    with a knife. He returns the woman to his older brother, who judges her wrongdoing
    and she is killed by mutilation at the river.'
  language: English
  quote_policy: summarized
