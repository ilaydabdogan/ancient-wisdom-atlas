canonical_text:
  quote: ''
  summary: A man rescues a captive boy from a Cheyenne sun-dance lodge, escapes by
    a skull-jumping test and rabbit transformation, returns with the boy, marries
    the promised girl, and is made chief under the name Hat'uxu, Star. In a later
    episode, enemies capture his wife and horses during a buffalo hunt; Hat'uxu tracks
    them, kills the man who has taken her, uses the captors' arrows against them,
    and returns with his wife, horses, arrows, and the slain man's head.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker promises that the man may have his daughter if he brings back the
    boy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man sets out with a party, the party kills two persons and captures horses,
    and the man sends the others back while he goes alone to the Cheyenne camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the Cheyenne camp, a sun-dance is taking place, and the boy is tied to
    the centre pole or tree of the lodge, painted black, with his arms drawn back
    and his body hanging at the fork.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man climbs along lodge poles to the central tree, cuts the boy loose,
    wraps him in an offering cloth, and carries him down as a woman carries a child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a Cheyenne sees him, the man asks not to be killed until the next day,
    asks for the chief and largest tent, and stays there overnight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man tells the Cheyenne to place seven buffalo skulls in a row and says
    they may kill him if he misses or stumbles while jumping across them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: He jumps from skull to skull like a rabbit, continues leaping while carrying
    the boy, and turns into a rabbit as he goes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: He wishes for holes, hides the boy in one covered with a buffalo-chip, hides
    himself in another covered with grass, and the Cheyenne search unsuccessfully.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man washes a buffalo horn in the river to bring the boy a drink, then
    takes two spotted horses, meat, robes, and a shield from the Cheyenne camp.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: He ties the boy on a horse, travels with him, rests and cooks when the boy
    needs it, and returns to camp.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the return, a tent and many horses are prepared for him; he marries
    the girl, and the people take him as their chief, naming him Hat'uxu, Star.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: During a later buffalo hunt, Hat'uxu tells his wife to tie the horses abreast
    and give away none of what he kills; while he cuts up buffalo, enemies capture
    his wife and her horses.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Hat'uxu follows the tracks of his wife and her captors with only his knife,
    reaches mountains, ties his horses, and climbs a tree to watch the enemy riding
    in file.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: His wife is among the enemy and carries their quiver of large arrows on her
    back.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: At night Hat'uxu enters the captors' brush hut, sees his wife sitting beside
    a man who has taken her for his wife, kills the man, and uses the arrows against
    the others.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Hat'uxu cuts off the dead man's head, tells his wife to carry the captured
    arrows and gather the enemy's horses, returns by morning, and the people celebrate
