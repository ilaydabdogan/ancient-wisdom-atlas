canonical_text:
  quote: Whenever he spit, he spit shells.
  summary: Two sisters search for Shell-Spitter. Loon, a poor man living with his
    mother Badger-Woman, takes shells from children and pretends to be Shell-Spitter
    by spitting shells from his mouth. The sisters discover the true Shell-Spitter
    seated in the center of a dance-lodge, while people dance on Loon. Loon kills
    Shell-Spitter and hides with his mother in a hole she digs inside their tent.
    A new tale begins with two brothers, Yellow-Plume and Blue-Plume; a yellow wheel
    rolls into an old woman's tent, where she traps Blue-Plume and tries to smother
    him with smoke from rotten wood.
  language: English
  quote_policy: quoted
