canonical_text:
  quote: There was water everywhere.
  summary: The passage contains an earth-making account in which animals are sent
    to dive through universal water, Turtle brings up mud, and an unnamed person forms
    earth, mountains, streams, and trees. It also begins an origin myth in which Nix'a"t,
    dissatisfied with earlier people, prepares a chief pipe, sings and shouts, kicks
    the ground to release water and rain, and floats with the pipe while Crow flies
    above and other birds and animals drown. The excerpt also includes editorial notes
    on informants and an Arapaho comparison.
  language: English
  quote_policy: quoted
