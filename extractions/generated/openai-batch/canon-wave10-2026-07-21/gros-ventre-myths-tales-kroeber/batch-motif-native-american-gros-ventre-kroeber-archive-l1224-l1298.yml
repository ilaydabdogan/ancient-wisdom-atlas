canonical_text:
  quote: ''
  summary: The passage continues a Nix'a'H trickster sequence. After an initial exchange
    with his wife, Nix'a'H pretends to be sick, gives burial and marriage instructions,
    is placed in a crooked tree, stages evidence that wolves have eaten him, then
    returns disguised as the man One-eyed Owl and sleeps with his two daughters until
    his wife recognizes him and drives him off. In the next episode he disguises himself
    as a woman traveling away from a violent husband, crosses a river with another
    woman, explains away signs of male anatomy, then frightens and sexually exploits
    her before continuing on.
  language: English with Latin insertions
  quote_policy: summarized
