  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After four more days outside, Nix'a'H makes himself a pointed tomahawk, paints
    his robe white, puts white clay over his right eye, covers a scar, and sits on
    a hill near the tent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife and daughters identify the disguised man as the one described earlier,
    bring him into the tent, and set up a tent for him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The two daughters sit and lie on either side of the disguised man, and the
    passage says he sleeps with both over many nights.
  category: action
  evidence_refs:
