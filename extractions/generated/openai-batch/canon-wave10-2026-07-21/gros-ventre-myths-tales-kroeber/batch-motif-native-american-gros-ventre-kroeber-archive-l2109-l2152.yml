canonical_text:
  quote: That is why there is black on the moon.
  summary: Moon insults Frog; Sun throws Frog onto Moon's face and takes Moon's wife.
    The woman, now in the sky with her son by Moon, tries to return to earth through
    a hole using a rope made from buffalo sinew. The rope leaves her hanging short
    of the ground, and Sun kills her with a stone while sparing the boy. The boy remains
    by his mother's body, later steals from an old woman's field, is received as Moon-child,
    and lives with her while speaking to his father in the sky.
  language: English
  quote_policy: quoted
