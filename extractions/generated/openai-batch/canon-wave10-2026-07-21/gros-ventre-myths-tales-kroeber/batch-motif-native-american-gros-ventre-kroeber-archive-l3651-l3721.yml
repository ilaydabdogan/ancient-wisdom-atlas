canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a man recovers his wife
    after enemy capture by using information from a returned captive, feeding hostile
    dogs, killing a sleeping rival husband, and escaping with kin. It then begins
    a tale in which a brother takes his unmarried sister and wife toward the mountains;
    a Snake Indian enters the sister’s tent at night, is detected through a string
    signal, is treated as a brother-in-law with smoke, food, and gifts, and is later
    protected from the camp’s hostility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An enemy captured a man’s wife while he was away, and he learned of her location
    from another woman who had also been captured and had returned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The returned woman says the captured wife lives with two husbands who dress
    alike and have fine pipes, tobacco-bags with bells, and pipe-stokers; she warns
    that fierce dogs are among the people and advises carrying buffalo meat for them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband gathers brothers and brothers-in-law, leaves them at the river,
    enters the village alone, and quiets attacking dogs by throwing pieces of meat
    to them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the wife’s lodge, the husband identifies himself, learns one man is sleeping
    inside, has his wife lie on the sleeper, enters, and cuts the sleeper’s throat.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After the killing, the man takes the dead man’s clothes and a bell-covered
    dress; the woman carries the bundle and the dead person’s head while they leave,
    feed the dogs again, rejoin kin, and flee home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the next tale, many young men want to buy a man’s sister, but she does
    not wish to marry and her brother does not wish to sell her.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brother leaves camp with his sister and wife, camps toward the mountains,
    and a Snake in the mountains observes that one woman sleeps alone in a separate
    tent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At night the Snake enters the lone woman’s tent and leaves before morning;
    the girl refuses food and speech because she thinks her brother slept with her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After learning that her brother had not gone out, the girl instructs her brother’s
    wife to tie a string from inside the girl’s tent to the wife’s wrist.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the Snake returns and lies with the girl, she pulls the string; the brother’s
    wife gets up, makes fire, and tells her husband he has a brother-in-law.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The brother gives the Snake a filled pipe, food, arrows, a gun, horses, and
    skins; after some time the Snake no longer fears them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When they return to camp, the people try to kill the Snake, but the brother-in-law
    prevents them from approaching; the girl’s parents give the Snake horses and clothing.
  category: sequence
  evidence_refs:
  - ev:8
