canonical_text:
  quote: ''
  summary: An old woman kills sleeping children with her fire-heated foot, but spares
    a little girl and her little brother after the girl offers to work for her. The
    girl is sent repeatedly for the correct wood and water. A bird tells her that
    the old woman is a ghost and instructs her to bring ghost-ropes and foul stagnant
    worm-filled water, which please the old woman. Later the girl uses an awl and
    robe as a decoy while fleeing outside with her brother.
  language: English with brief Latin passages
  quote_policy: summarized
