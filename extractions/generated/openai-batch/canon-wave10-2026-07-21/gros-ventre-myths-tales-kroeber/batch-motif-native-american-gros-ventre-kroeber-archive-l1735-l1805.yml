canonical_text:
  quote: ''
  summary: Clotted-Blood kills a threatening son-in-law figure, burns his body, judges
    the old man's daughters according to whether they helped their father, and then
    travels to dangerous places described by the old man. He overcomes a hollow killing
    tree, a sinking bridge supported by a buffalo-head, and a great wolf that draws
    people into its mouth. He rescues people trapped inside the tree and wolf, revives
    some who are not dead, and destroys the lethal beings or obstacles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dead or dying man continues to threaten Clotted-Blood, and a severed arm
    also speaks threats after being thrown into the fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Clotted-Blood directs the old man to build a large fire and burns the dead
    man's body and limbs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man says only his youngest daughter loved and helped him, while the
    others did not help him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clotted-Blood kills three women and their children, spares the youngest woman
    and her child, burns the bodies, and takes property from the man's tent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man warns Clotted-Blood that dangerous places kill travelers and identifies
    the first danger as a tree on the trail.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tree sways and makes it impossible for Clotted-Blood to go around it;
    when he runs under it, it falls and breaks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the tree falls, Clotted-Blood becomes a down feather floating in the
    air and then becomes a man again after landing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hollow tree contains people it had killed or trapped; Clotted-Blood removes
    them, causes the living ones to live, and burns the tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A bridge supported in the middle by a buffalo-head repeatedly sinks when Clotted-Blood
    tries to step on it, but on the fourth attempt he jumps to the other side of the
    water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A great wolf draws people toward him by sucking; Clotted-Blood pretends to
    be drawn in and jumps down the wolf's throat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Inside the wolf, Clotted-Blood finds living, dying, dead, and skeletal people,
