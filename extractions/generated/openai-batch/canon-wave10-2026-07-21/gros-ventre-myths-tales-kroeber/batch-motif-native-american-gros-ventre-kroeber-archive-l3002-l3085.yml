canonical_text:
  quote: ''
  summary: 'The passage contains several Gros Ventre narratives and notes: a left-behind
    shaggy dog follows the camp trail, is pitied by an old man, and gives him a dance
    and ritual objects in a dream; a poisoned young man dies, is left undisturbed
    for four days, and after a thunderstorm and descending cloud is found alive beneath
    a newly given chief pipe; a water-crossing episode explains a separation of the
    people after a horn is chopped from ice and the ice breaks; and a cave in a hill
    is described as a place into which buffalo run and may have disappeared.'
  language: English
  quote_policy: summarized
