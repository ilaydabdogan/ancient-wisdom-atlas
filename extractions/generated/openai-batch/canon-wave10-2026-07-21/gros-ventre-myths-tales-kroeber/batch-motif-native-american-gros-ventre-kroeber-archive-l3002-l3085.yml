candidate_motifs:
- id: motif:1
  label: dream-bestowed origin of a dance
  taxonomy_refs:
  - sacred_exchange
  basis: The dog responds to the old man's pity by appearing in sleep, giving a named
    dance, teaching its performance, and giving associated objects.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage describes reciprocal
    pity and ritual transmission but does not explicitly label the exchange as sacred.
- id: motif:2
  label: ritual objects transmitted through successive keepers
  taxonomy_refs:
  - sacred_exchange
  basis: The dog's dance objects are passed down, and the chief pipe is handed from
    one keeper to another with an accompanying transfer rule.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: Two separate narratives show transmission; their relationship is thematic
    within the passage rather than explicitly connected by the text.
- id: motif:3
  label: dead young man restored with sacred pipe after storm
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The young man dies, is left undisturbed for four days, and after thunder,
    lightning, and a descending cloud is found alive under the pipe.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage states he died and was alive later, but does not elaborate
    on the mechanism beyond thunder pity and the cloud event.
- id: motif:4
  label: supernatural removal and replacement of property
  taxonomy_refs:
  - sacred_exchange
  basis: The cloud takes the tent and property and leaves a pipe and ritual materials;
    later new keepers have everything taken away in memory of this event.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The text describes a rule of taking property from new keepers, but does
    not give a full ritual explanation beyond analogy to thunder's action.
- id: motif:5
  label: water-crossing disaster causing permanent tribal separation
  taxonomy_refs: []
  basis: The people are divided across a body of water; the ice breaks after a horn
    is removed, drowning those on the ice, and the groups on opposite shores never
    reunite.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: No available taxonomy reference exactly matches this separation episode.
- id: motif:6
  label: dangerous horn of an underwater animal
  taxonomy_refs: []
  basis: A horn sticking out of the ice is chopped out, blood flows, and an animal
    under the water begins to move before the ice breaks.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The text qualifies the animal connection with 'must have belonged,' so
    the identification is presented as inferred within the narrative.
- id: motif:7
  label: animals entering or disappearing into a cave
  taxonomy_refs: []
  basis: Buffalo run into the hill when hunted, are heard inside, and the passage
    says it is thought all buffalo have disappeared there.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage describes disappearance rather than an explicit origin or
    return of buffalo.
- id: motif:8
  label: perilous cave exploration and retreat
  taxonomy_refs: []
  basis: Two men enter the cave with long sticks, find it widening beyond measurement,
    fear they will not find their way back, and return.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage does not mark the cave entry as an initiation or quest.
