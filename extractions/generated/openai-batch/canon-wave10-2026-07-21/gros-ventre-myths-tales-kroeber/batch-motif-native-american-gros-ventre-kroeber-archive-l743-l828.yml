    to delay Tebiaa'ta.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tebiaa'ta states that the sky is the one place where he cannot reach and kill
    the women.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sisters create a river with thick thorny brush and later dense cactus
    behind them; Tebiaa'ta is scratched, filled with spines, and bleeding after passing
    through.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After saying they can do nothing more supernatural, the sisters run and ask
    a seated man to pity them because they are being pursued to be killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man tells the women to run around him four times, loosens his hair, hides
