canonical_text:
  quote: ''
  summary: Two sisters flee from Tebiaa'ta, repeatedly creating supernatural barriers
    behind them. After their powers are exhausted, a man with long uncombed hair hides
    them and misdirects the pursuer. The women then seek help from Bald Eagle, who
    carries them on his wings through water and air while Tebiaa'ta pursues. Nix'a't's
    sons see the aerial struggle, and Nix'a't prepares to help.
  language: English
  quote_policy: summarized
