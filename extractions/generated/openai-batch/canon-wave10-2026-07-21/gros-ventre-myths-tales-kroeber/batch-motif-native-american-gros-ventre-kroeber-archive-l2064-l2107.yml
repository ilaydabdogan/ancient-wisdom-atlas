canonical_text:
  quote: ''
  summary: The Sun and Moon compete over obtaining wives from earth. The Sun brings
    Frog up to his mother's tent. The Moon selects an earthly woman, who is troubled,
    goes to gather wood, follows a porcupine up a tree that reaches a hole in the
    sky, and is received at the mother's tent as a daughter-in-law. Frog sits beside
    the Sun and the woman beside the Moon. Their mother-in-law compares the daughters-in-law
    by work and by a chewing test with paunch; the woman succeeds while Frog chews
    charcoal.
  language: English
  quote_policy: summarized
