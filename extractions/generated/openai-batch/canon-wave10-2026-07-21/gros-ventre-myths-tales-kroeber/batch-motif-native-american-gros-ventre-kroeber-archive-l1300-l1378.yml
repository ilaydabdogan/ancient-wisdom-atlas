canonical_text:
  quote: ''
  summary: The passage continues a Nix'a't episode in which he deceives a sleeping
    woman, then narrates his acquisition and misuse of buffalo-calling power, his
    burial under buffalo carcasses, his release through Coyote and other canids, and
    a scatological rabbit-and-robe deception against the camp. It then begins the
    tale of One-eyed Owl and his Daughter, in which a father feigns death, disguises
    himself as a one-eyed suitor, marries his daughter, and is exposed by his wife
    and daughter.
  language: English with Latin phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nix'a't enters a tent, finds a woman asleep, places excrement on her dress,
    wakes her, and threatens to announce that she has soiled the bed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman tells Nix'a't not to call out and offers herself to him if he remains
    silent; she warns that her brothers are sleeping nearby.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man sitting on a high bank uses two round rattles and a song to call buffalo,
    which come in lines on both sides and fall over the bank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Nix'a't cries and asks for pity, the buffalo-calling man gives him the
    power, warning him to use the song only when the camp is very hungry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nix'a't tries the buffalo-calling power for himself; on the fourth use, buffalo
    push him over the bank and fall on top of him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: While Nix'a't lies trapped under the buffalo, a rabbit approaches and sexually
