canonical_text:
  quote: ''
  summary: The supplied passage contains the end of one Gros Ventre tale and the opening
    of tale 46, titled “The Bad Wife.” In the first, a married woman pursues her husband’s
    younger brother after he refuses her; she later stabs him during a fight with
    a Ute. He kills the Ute after pledging a sun-dance, returns, publicly accuses
    her, and she is shot by her husband and the younger brother. In the second, a
    woman captured by Crows betrays her husband and his six companions when he tries
    to recover her, telling the Crow camp that the sun has given her seven people
    hidden in the brush.
  language: English
  quote_policy: summarized
