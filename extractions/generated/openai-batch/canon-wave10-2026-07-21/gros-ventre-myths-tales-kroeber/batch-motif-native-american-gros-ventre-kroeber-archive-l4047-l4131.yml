canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Gros Ventre tales: Clotted-Blood
    is born from a clot of blood, grows rapidly, avenges an abused old man, and overcomes
    many lethal beings and ordeals; Moon-Child recounts celestial marriages of Sun
    and Moon, a woman’s sky ascent and fatal descent, and her son’s struggles with
    serpent and old-woman antagonists followed by revival; another tale describes
    an abandoned boy raised by Seven Bulls, his conflict with a powerful Bull, and
    reunion with his human parents.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man is mistreated and nearly starved by his son-in-law; he hides a
    clot of blood that becomes a child in a kettle, and the child is swung on four
    sides of a tent and becomes a young man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Clotted-Blood kills the threatening son-in-law, burns his body, and kills
    all his wives except one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Clotted-Blood travels and survives or destroys a falling tree, a sinking bridge,
    a people-sucking wolf, and a woman’s consuming dish, at times by becoming a feather.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clotted-Blood defeats a gambling Bull, a man who drops people from a swing
    into water, a river water-monster, and a man with a sharp kicking leg.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Clotted-Blood is accepted as a son-in-law and is sent on dangerous tasks:
    getting the morning star, killing bears, getting thunder-bird feathers, killing
    bulls for sinews, getting flint from a falling cliff, and getting water from a
    water-monster.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the dangerous tasks, Clotted-Blood’s father-in-law attacks him, fails
    to hit him, and is killed and burned by Clotted-Blood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sun and Moon dispute about women’s beauty; the Sun marries Frog, while
    the Moon becomes a porcupine and induces a woman to climb a tree that stretches
    to the sky, where he marries her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Frog is exposed after chewing charcoal instead of paunch; the Sun throws her
    onto the Moon’s face, where she remains, and takes the Moon’s wife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Moon’s wife has a boy, looks down through a hole in the sky, makes a sinew
    rope, and lowers herself toward earth; the rope is too short, and the Sun kills
    her by dropping a stone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman’s boy stays near her until an old woman finds him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Moon-Child goes to a tent of pretty girls; one becomes a snake and tries to
    enter his body, but is killed against a rock; he kills the sleeping girls, while
    one escapes as a snake and threatens revenge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Moon-Child wrestles an old woman who nearly pushes him into the fire, but
    he kills her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A revengeful snake later enters Moon-Child’s body; he becomes only a skeleton,
    asks the Moon for cold rain, the snake crawls out, and he rises alive and kills
    it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Moon-Child’s mother comes back to life at the same time that Moon-Child revives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: A girl abandons her child; Seven Bulls find the child, pity him, raise him,
    kill buffalo for him, and instruct him to make a bow and arrows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: When the abandoned boy becomes a young man, cows make love to him, a powerful
    Bull attacks him, and his seven bull fathers try to protect him but are disabled.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The young man turns into a feather so that the powerful Bull cannot hurt him,
    shoots the Bull, cures his seven fathers, and is sent to the camp of his human
    parents, where he recognizes his mother and finds his father.
  category: sequence
  evidence_refs:
  - ev:7
