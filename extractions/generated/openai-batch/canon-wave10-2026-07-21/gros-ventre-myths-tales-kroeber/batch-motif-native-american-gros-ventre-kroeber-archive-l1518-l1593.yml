canonical_text:
  quote: ''
  summary: A father warns two sons not to pick up arrows after shooting them. The
    younger son disobeys while trying to shoot a bird, and a wind blows him away to
    a dry lake near another camp. An old woman finds him while cutting grass, names
    him Found-in-the-Grass, and raises him. Later, a man promises his daughters to
    whoever catches porcupines. Found-in-the-Grass catches one, but the Crow steals
    it and leaves a quill. The quill is used to show the theft, and both Crow and
    Found-in-the-Grass marry the two daughters according to the daughters' choices.
    During a later famine, Crow announces that he will go after buffalo and tells
    the people to build an enclosure.
  language: English
  quote_policy: summarized
