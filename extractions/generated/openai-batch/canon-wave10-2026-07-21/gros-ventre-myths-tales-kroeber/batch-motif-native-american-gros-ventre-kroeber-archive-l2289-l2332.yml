canonical_text:
  quote: ''
  summary: A young man is found with a Cow who is one of a powerful Bull's young wives.
    A servant reports this, and the powerful Bull attacks. The Seven Bulls, called
    the young man's fathers, try to protect him but are disabled. The young man survives
    the powerful Bull's tossing attack, marked by a white plume flying up instead
    of his body being harmed, then shoots and kills the powerful Bull. He heals the
    Seven Bulls by feigning shots with his bow and seven arrows, using four motions
    for each. The Seven Bulls tell him he is now a man and should return to his own
    people and human parents, since they cannot change him into a buffalo. They escort
    him near the camp; he thanks them and expresses grief and uncertainty about leaving
    them.
  language: English
  quote_policy: summarized
