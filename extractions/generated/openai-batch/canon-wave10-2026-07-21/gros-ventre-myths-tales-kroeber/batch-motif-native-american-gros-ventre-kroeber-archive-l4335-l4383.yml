canonical_text:
  quote: ''
  summary: 'The passage gives abstracts of several Gros Ventre tales: a man gains
    invulnerability and wealth by sacrificing his flesh to nonhuman beings, repeatedly
    survives being cut apart, rescues a boy, marries the boy''s sister, and later
    recovers his captured wife; another man recaptures his wife from captors; a Snake
    Indian marries a Gros Ventre woman and peace is made between the Gros Ventre and
    Snakes; and a woman fasts on a mountain, receives power from thunder, and avenges
    her brothers.'
  language: English
  quote_policy: summarized
