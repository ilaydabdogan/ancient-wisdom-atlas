canonical_text:
  quote: ''
  summary: Nix'a't is described after making land in a world without water, accompanied
    by his pipe and the Crow. His tears create a spring, stream, and river. He forms
    humans and animals from earth, animates them after naming, singing, shouting,
    and kicking the ground, names the world Turtle after the helper Turtle, gives
    bows and arrows to men and the pipe to the Gros Ventre, and shows the rainbow
    as a sign that the earth will not again be covered with water. The passage also
    begins the next tale, naming Tebiaa'ta, two women, the Bald Eagle, and Nix'a't,
    and describing two sisters in a lone tent, one of whom finds a freshly killed
    deer. A footnote cites Arapaho comparisons.
  language: English
  quote_policy: summarized
