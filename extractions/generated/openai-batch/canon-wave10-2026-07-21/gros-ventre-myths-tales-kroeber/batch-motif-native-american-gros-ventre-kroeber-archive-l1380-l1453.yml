canonical_text:
  quote: ''
  summary: The passage contains the close of one tale in which a man takes his mother-in-law
    to brush shelters, stages disturbances attributed to a ghost, and has intercourse
    with her before she bears a son; a complete tale titled “The Kit-fox and the Ghost,”
    in which Kit-fox insults a dead person or ghost in a tree and escapes into a hole
    while losing his tail; and the beginning of “Found-in-the-Grass,” in which a husband
    warns his wife not to invite a visitor, but she eventually admits him and struggles
    to find the kind of plate he demands.
  language: English with a short Latin segment
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man leaves a camp-circle, builds two brush shelters at a distance, returns,
    sits in his lodge, and does not speak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After repeated questioning by his wife, the man says he saw many men going
    to war with their mothers-in-law in order to steal horses for them; his wife asks
    her mother to go with him, and the mother consents.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man and his mother-in-law travel together to the place he had visited;
    each sleeps in a shelter, and he later says he cannot find the tracks of the people
    he reported seeing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man places stones near his bed and throws them at his mother-in-law’s
    shelter; she says someone is troubling her and that a ghost is about, then asks
    to enter his shelter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After she enters, the man throws stones again near where she is lying; she
    again says she is disturbed and asks that they sleep together.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Latin segment, the man complains of cold, induces the mother-in-law
    to touch him, asks to insert his penis to become warm, has intercourse with her,
    lives there until she bears a son, and then returns home with her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kit-fox walks along a path in the woods, smells a bad odor, and the odor comes
    from a dead person buried in a tree.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The dead person comes down from the tree and questions Kit-fox; Kit-fox changes
    his statement from an insult about the smell to claims that it smelled good or
    like sweet-grass.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After being allowed to go, Kit-fox calls back that he had said something smelled
    bad; the ghost pursues him, and as Kit-fox enters a hole the ghost catches and
    pulls off the end of his tail.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the “Found-in-the-Grass” excerpt, a man camping alone tells his wife not
    to ask an arriving person to come in while he is away.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A person comes while the husband is away, walks around the tent, and appears
    as if he might enter; the wife says nothing and the person does not enter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: On a later visit, the person opens and shuts the door several times; the wife
    can no longer restrain herself and tells him to come in.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The wife cooks for the visitor, but he repeatedly says that each plate or
    dish she offers is not the kind of plate he uses.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: After using all plates and dishes, the wife offers a moccasin and then a legging
    as plates; the visitor says these are nearly or very nearly right, and she begins
    to try her dress as a plate before the excerpt breaks off.
  category: object
  evidence_refs:
  - ev:10
