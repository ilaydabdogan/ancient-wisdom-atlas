canonical_text:
  quote: ''
  summary: Two women discover that Tebiaa"ta" has been bringing dead deer at night.
    They flee after setting an awl and a quill-flattener as deceptive substitutes
    near their beds. Tebiaa"ta" returns, finds the women gone, is misdirected by the
    objects, injures his face on the awl, and pursues the women by scent and trail.
    The older sister uses a supernatural fog to delay him, but he later finds the
    trail again.
  language: English
  quote_policy: summarized
