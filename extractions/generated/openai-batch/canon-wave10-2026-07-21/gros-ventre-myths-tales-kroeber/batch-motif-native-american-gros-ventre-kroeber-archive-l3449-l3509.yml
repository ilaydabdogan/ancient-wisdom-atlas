canonical_text:
  quote: ''
  summary: A man enters the Crow camp and asks his wife for smoke and drink, but she
    tells the Crows he has ordered them to hang him from a two-tree frame. The Crows
    hang him and leave. An old Crow woman rescues, feeds, hides, and adopts him. The
    man returns to his people, summons allied groups through tobacco pieces, and leads
    a war-party back to the Crows. His younger brother identifies and captures the
    wife by her distinctive black-painted short-tailed horse. After the capture, fighting
    stops; the old Crow woman mutilates and burns the wife, and the people return
    home rejoicing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man enters the largest tent in the middle of the Crow camp-circle, where
    his wife is, and says that he wants to smoke and drink.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife tells the Crows that the man wants them to dig two holes, set up
    two trees connected by a top pole, hang him by the neck, stretch and tie his arms,
    and move camp leaving him there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the wife repeats her statement until they believe her, the Crows set
    up the poles, hang the man naked, and leave him when the camp moves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old Crow woman waits until the camp, including the dogs, has gone, then
    cuts the man down, washes his face, feeds him dried sliced meat, and hides him
    on her travois.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the new Crow camp, the old Crow woman sets her tent outside the circle,
    brings water, starts a fire, calls her sons to smoke with the man, and calls him
    her son.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man says he will go back and return with all his people to get his wife;
    he instructs his new brothers where to camp and how to mark the trail with rocks
    if the tribe divides.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man learns that the woman rides a fast black-painted short-tailed horse,
    and then runs back to his own people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man cuts tobacco into little pieces, and young men carry these pieces
    to the Piegans, Blackfeet, Bloods, and North Piegans or Sarcees; the tribes gather
    and join the Gros Ventre.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The war-party approaches the Crows, stops behind a hill, and the man goes
    alone to his Crow mother to tell her sons to secure their property, hobble their
    horses nearby, and stay indoors.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the Crows begin to move camp, the war-party attacks, while the man's
    younger brother, riding the swiftest horse, looks specifically for the woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The younger brother sees the black-painted short-tailed horse with the woman
    on it, catches up, takes her bridle, turns her back, and refuses or postpones
    her request to kiss him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the woman is captured, the fighting stops; the old Crow woman has a
    large fire built, uses a knife to mutilate the woman, throws body parts and her
    dress into the fire, and the woman herself is burned while a crowd prevents her
    escape.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: After the woman is burned, the people go home rejoicing.
  category: action
  evidence_refs:
  - ev:8
