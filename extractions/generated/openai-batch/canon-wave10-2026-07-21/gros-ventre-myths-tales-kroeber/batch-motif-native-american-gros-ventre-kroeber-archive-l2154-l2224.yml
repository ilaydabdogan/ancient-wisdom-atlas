canonical_text:
  quote: ''
  summary: Moon-Child ignores his grandmother’s warning and visits a tent of beautiful
    girls who invite him to play and choose a wife. He uses a hidden flat stone and
    a myth-telling ruse against girls who are revealed as snakes, kills most of them,
    and is threatened by the last snake. He later defeats an old woman thief by throwing
    her into her own fire. Despite using an arrow as a warning device, he is eventually
    entered by the snake, dies, and becomes bones. After he appeals to his father,
    the Moon makes cold rain; the snake leaves, Moon-Child rises alive and cuts it
    apart, and his mother also rises alive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy remembers that his grandmother told him not to go to the tent, but
    he decides to go look at it anyway.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pretty girls outside the tent recognize him as Moon-Child, invite him to play,
    call him handsome, and say he may choose one of them as wife.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Before approaching the girls, the boy hides a flat rock on his body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girls embrace and kiss him, ask him to tell myths, and lie down with their
    heads toward the fire according to his stated rule for myth-telling.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The boy sits on the flat rock while telling myths; one girl turns into a snake,
    goes underground, tries to dash into his body, and smashes its head on the stone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the girls fall asleep, the boy cuts off their heads; the last one turns
    into a large snake, goes underground, and says he will be caught someday when
    he lacks a stone seat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy answers that the snake will live underground, then returns to his
    grandmother, who tells him to watch the field closely.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: While guarding the field, the boy enters another tent where an old woman feeds
    him, builds a large fire, and proposes to play by wrestling after he eats.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old woman pushes him toward the fire during wrestling, but he eventually
    throws her into the fire and holds her there until she is consumed; the passage
    says she had always stolen from his grandmother’s field.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Remembering the snake’s threat, the boy normally sets an arrow near his head
    and tells it to fall on his face if the snake comes; the device wakes him when
    the snake comes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: One night the boy sticks the arrow tightly into the ground, so it cannot fall;
    the snake comes close and shoots into the boy’s anus.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The snake says it has caught him and will remain in him until he dies; the
    boy replies that it will become hungry or out of breath and leave before he dies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The boy lives for some time with the snake in him, then dies and becomes bones
    while the snake remains inside.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The boy asks his father to do something for him; the Moon makes a cold rain,
    and the snake leaves the bones to seek shelter.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: As soon as the snake leaves, the boy stands up alive as before, catches and
    cuts the snake to pieces, and says the snake was deceived; at the same time his
    mother also gets up alive.
  category: sequence
  evidence_refs:
  - ev:9
