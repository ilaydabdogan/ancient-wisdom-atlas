canonical_text:
  quote: Thus they restored their mother to life.
  summary: A pregnant woman is cut open by a man, who removes and names her twin sons.
    Her husband later finds her dead and mourns. The hidden children repeatedly disturb
    his arrows; he catches them one by one and gives them bows and arrows. The sons
    then direct him to make a sweat-house for their mother, and after each twin shoots
    upward four times, she comes out alive.
  language: English
  quote_policy: quoted
