canonical_text:
  quote: ''
  summary: A woman returns toward an enemy camp with her husband, enters during a
    dance, identifies a man who killed one of her brothers, lures him into the brush,
    kills and decapitates him, and brings the head back as a war trophy. Her community
    strikes and paints with the head skin. Later, when enemies attack for revenge,
    she repeatedly drives them off in battle, then ceases fighting after four fights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman and her husband follow a river toward a camp near sunset.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before entering the camp, the woman bathes, paints herself, perfumes herself,
    and tells her husband to hold the horses ready in the brush.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the way, she finds pieces of her brothers' bones and learns their bodies
    had been burned.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the camp, people are dancing because of her slain brothers, and women dance
    in a row in the moonlight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman joins the dancing and sees a man filling and extending a pipe to
    other men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: She knows the man killed one of her brothers, touches him on the back, and
    he follows her into the brush after desiring her.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: In the brush, she pushes the man to the ground, lies on him, cuts his throat
    with a knife, cuts off his head, removes his clothes, and wraps the head and clothes
    in his robe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: She brings the head to her husband, who strikes it and counts coup; they flee
    by another route and hide the next day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: They skin the head, keep the scalp, and return home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At home, the woman's mother kisses her, and the woman announces that she has
    brought a head.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The people use charcoal and grease, strike the head skin, and paint themselves
    as each one strikes it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage states that the woman avenged the death of her brothers.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Enemies come to obtain revenge and attack the camp.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The woman mounts a swift horse, takes a short spear, charges the enemy, puts
    them to flight, and kills many.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The camp is attacked four times, and each time she drives off the enemy.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: After two men are later killed, the people think she will avenge them, but
    she fights no more after four fights.
  category: sequence
  evidence_refs:
  - ev:14
