canonical_text:
  quote: ''
  summary: The passage ends one tale in which a woman is repeatedly taken into a buffalo
    herd and repeatedly rescued by animal helpers and her people, culminating in an
    aerial rescue by Bald Eagle. It then begins the tale “The Deserted Children,”
    in which children are abandoned by their camp, find the camp gone, cross toward
    a river, and come to the tent of an old woman in the timber.
  language: English
  quote_policy: summarized
