candidate_motifs:
- id: motif:1
  label: self-wounding offering exchanged for power
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The man repeatedly cuts off his own flesh or finger and gives it to snakes,
    bears, and water; helpers respond by granting power, invulnerability, tokens,
    horses, and property.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives actions and results but does not explicitly define the
    act as ritual sacrifice.
- id: motif:2
  label: animal indwelling confers invulnerability
  taxonomy_refs:
  - serpent
  basis: A young snake and a young bear enter the man's mouth/body; the snake parents
    say this will make him unkillable, and the bear parents say he will be invulnerable.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The available taxonomy directly covers the snake element but not the bear
    element.
- id: motif:3
  label: dismembered man returns alive
  taxonomy_refs:
  - resurrection
  - death_rebirth
  - dying_and_returning
  - return
  basis: The man is cut to pieces and scattered, then rises alive after the camp moves;
    the pattern repeats as he follows the camp and returns to life.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes repeated return to life, but does not provide an
    explicit cosmological explanation beyond prior animal-given invulnerability.
- id: motif:4
  label: horned water being produces wealth
  taxonomy_refs:
  - sacred_exchange
  basis: After the man throws flesh and a finger into the river, the bax'aa rises
    and hooks horses and property out of the water, promising him extreme horse wealth.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The being named bax'aa is not explained in the supplied passage, and no
    broader classification is provided.
