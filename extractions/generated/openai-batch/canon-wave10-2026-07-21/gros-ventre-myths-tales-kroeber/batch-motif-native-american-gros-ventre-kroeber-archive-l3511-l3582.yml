canonical_text:
  quote: ''
  summary: A poor wandering man repeatedly cuts off his own flesh and body parts to
    feed animals or water beings. Snakes and bears pity him, enter his body, and give
    him tokens and invulnerability. A horned being rising from the river draws horses
    and property out of the water for him. After he and six poor companions lie in
    a lake, a camp kills the companions but cannot permanently kill him; although
    cut to pieces, he rises alive and repeatedly takes revenge. He returns home with
    horses, scalps, and wealth, later vows to recover a boy captured by the Cheyenne
    and marry the boy's sister.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor man wanders, finds snakes in a hole, cuts flesh from his body, gives
    it and body parts to the snakes, and jumps into the hole before bleeding to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snakes draw back from the man, but a young snake says it pities him and
    will give him power and make him strong.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young snake's father and mother approve the pitying action and say the
    young snake should enter the man and stay in his body so that he will be unkillable.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young snake enters the man's mouth and goes into his body; the two old
    snakes give him rattles from their tails, and he leaves without scars.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man repeats the cutting and feeding of his flesh in a bear den; a young
    bear pities him, and the parent bears give him bodily strength, invulnerability,
    and long claws, while the young bear enters his mouth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At a river the man cries, cuts off flesh and a little finger, and throws them
    into the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A bax'aa rises halfway out of the water, uses its horns to hook water, and
    produces a white horse, a painted horse, many horses of different colors, and
    much property.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bax'aa tells the man that he will not be poor and will be the richest
    man in horses on earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Afterward the man feeds his flesh to eagles, jack-rabbits, buffalo, horned
    toads, and many kinds of animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The snakes tell him to take six poor people with him; the seven reach a lake
    and lie down in the water as many people travel toward it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: An old woman sees a mouth or persons in the water and tells the people; the
    people kill the man's six companions, but spears, stones, and arrows cannot hit
    or hurt the man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The people cut the man to pieces and scatter the pieces, but after the camp
    moves he rises alive.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The man repeatedly follows the camp, kills a woman gathering wood or others,
    is cut to pieces by the people, and rises alive again after they move camp.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that he kills many because he feels bad that the tribe
    killed his six companions.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: When his feet become too sore to walk, he steals horses, a shield, and robes,
    returns home with horses and a bundle of scalps, and later continues raiding until
    he becomes very rich.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: While he is away, the Cheyenne attack his people during a buffalo hunt and
