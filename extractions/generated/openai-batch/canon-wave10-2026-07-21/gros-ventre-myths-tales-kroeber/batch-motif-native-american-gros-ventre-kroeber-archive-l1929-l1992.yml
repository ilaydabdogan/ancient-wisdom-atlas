canonical_text:
  quote: That is why there still are thunder and lightning.
  summary: Clotted-Blood reaches a camp where a chief gives visitors his daughter
    and then sets fatal tasks. As son-in-law, he obtains a shining morning star as
    a burning coal, kills four bears to gather cherry wood for arrows, and goes to
    a rocky precipice for feathers. He encounters young Thunder birds whose eyes and
    movements make lightning and thunder, defeats their adult parents with an arrow
    fixed in rock, kills the adults for feathers, leaves the young, and the tale explains
    that thunder and lightning remain.
  language: English
  quote_policy: quoted
