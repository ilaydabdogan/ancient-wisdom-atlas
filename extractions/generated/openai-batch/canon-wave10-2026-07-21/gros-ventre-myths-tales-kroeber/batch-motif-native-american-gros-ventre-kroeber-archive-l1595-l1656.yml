canonical_text:
  quote: ''
  summary: Crow fails to find buffalo after the people prepare an enclosure. Found-in-the-Grass
    announces that he will get buffalo, sends for his father-in-law, and is mocked
    through his wife by her older sister. He places buffalo-chips in pairs, disappears,
    reappears with buffalo around him, burns a chip so the buffalo smell it, and leads
    them into the enclosure, satisfying the people's hunger. His wife kills the enclosed
    buffalo. He reserves the fattest scabby buffalo for his grandmother to skin. A
    blood-filled gut cut on his wife's back becomes red clothing; when his sister-in-law
    asks for the same treatment, the cut gut only spills blood over her, and he ridicules
    her.
  language: English
  quote_policy: summarized
