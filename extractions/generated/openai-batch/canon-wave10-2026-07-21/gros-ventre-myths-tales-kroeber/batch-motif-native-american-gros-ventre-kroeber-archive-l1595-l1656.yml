  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage presents the feeding of the people clearly, but the broader
    culture-hero status depends on the surrounding tale cycle.
- id: motif:2
  label: despised husband with hidden nightly transformation
  taxonomy_refs:
  - shapeshifter
  basis: The older sister mocks Found-in-the-Grass as an unattractive child, while
    his wife says he goes out in the evening and returns after dark as a handsome,
    perfumed young man.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This passage reports the transformation through dialogue rather than narrating
    the transformation directly.
- id: motif:3
  label: buffalo produced or summoned through arranged buffalo-chips
  taxonomy_refs: []
  basis: Found-in-the-Grass places buffalo-chips in pairs, disappears from sight,
