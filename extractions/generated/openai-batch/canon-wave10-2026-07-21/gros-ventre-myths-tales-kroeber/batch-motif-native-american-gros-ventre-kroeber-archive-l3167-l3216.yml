canonical_text:
  quote: ''
  summary: A woman who has become a horse identifies a black horse as her husband
    and seven young horses as her children; she asks to be released with the horses,
    promising horse-getting luck and enemy kills if freed, and deaths if not. The
    people free her and the horses. In the next tale, a little girl left behind by
    a moving camp is addressed by a bear, who turns into a man and marries her; when
    her people later return starving, she allows them to camp near her and gives them
    dried meat. In the beginning of the following tale, two young male friends follow
    a trail into a hill and through the earth, become hungry, and meet a giant-like
    person who takes them to the camp of his people.
  language: English
  quote_policy: summarized
