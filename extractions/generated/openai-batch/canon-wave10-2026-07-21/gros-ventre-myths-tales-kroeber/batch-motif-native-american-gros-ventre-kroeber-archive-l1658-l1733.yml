canonical_text:
  quote: ''
  summary: An old man is mistreated by a son-in-law who has married all four of his
    daughters and withholds meat from him. During a buffalo hunt the old man secretly
    keeps clotted blood from a wounded buffalo. When the blood is boiled in a kettle,
    a boy emerges. The hostile son-in-law wants a male child killed, but the youngest
    daughter reports that the child is a girl. The old woman swings the child successively
    around the tent, and he rapidly matures into a young man named Clotted-Blood.
    Clotted-Blood has the old man make a buffalo-rib bow and four buffalo-tendon arrows,
    kills a buffalo, confronts the abusive son-in-law, and shoots him with arrows
    whose effect cannot be easily removed.
  language: English
  quote_policy: summarized
