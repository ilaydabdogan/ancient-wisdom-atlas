canonical_text:
  quote: ''
  summary: A girl gives birth secretly and her mother buries the newborn boy in a
    buffalo-wallow. Seven old Buffalo-bulls find him, pity him, adopt him, lick him
    until he is no longer a baby, feed him buffalo meat, teach him to make hunting
    equipment, carry him into herds to hunt, and raise him to young manhood. They
    then bring him near a herd ruled by a jealous powerful Bull and warn him not to
    approach the young Cows, but he escapes their watch and is approached by a young
    Cow who praises his appearance.
  language: English
  quote_policy: summarized
