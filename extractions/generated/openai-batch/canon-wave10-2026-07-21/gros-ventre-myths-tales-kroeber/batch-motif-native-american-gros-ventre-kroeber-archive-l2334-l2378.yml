canonical_text:
  quote: ''
  summary: A young man raised by seven old bulls is sent back to the human camp. The
    bulls tell him how a ball game will reveal his mother. He follows their instructions,
    confronts his mother and maternal grandparents, recounts his abandonment in a
    buffalo-wallow and upbringing by the bulls, and is accepted by his grandmother.
    At night he goes with his mother to a gambling tent, where hiding-buttons identify
    his father, and the three return home. The next tale, titled “White-Stone,” begins
    with seven brothers and one sister; the brothers go out hunting or searching one
    by one and do not return.
  language: English
  quote_policy: summarized
