canonical_text:
  quote: ''
  summary: A crow repeatedly asks Nix'a"t for rest. Nix'a"t opens the chief pipe,
    which contains animals, and sends long-breathed animals to dive through the water
    for mud. The loons fail, but Turtle reaches the bottom and returns with a little
    earth left in its feet and side cracks. Nix'a"t scrapes up this earth, sings and
    shouts three times, drops the dust into the water, and makes a small piece of
    land for himself and the Crow. He then uses two wing-feathers from the pipe, sings
    and shouts again, and causes land to extend as far as he can see.
  language: English
  quote_policy: summarized
