canonical_text:
  quote: ''
  summary: Nix'a't promises a crying boy buffalo food and bare ground, then changes
    into a scabby dog after the people move camp. A girl brings the dog to the tent
    of her grandmother, an old woman who keeps buffalo, despite the grandmother's
    warnings. Nix'a't observes a hidden buffalo source and a greasy skin sack whose
    contents remove snow. After revealing himself and assaulting the girl, he steals
    the sack, releases the buffalo, scatters the sack's contents so that snow disappears
    and summer comes, and returns to the people with buffalo meat. The passage closes
    with an explanation for Chinook winds and the people's sight of bare land and
    buffalo herds.
  language: English with brief Latin insertions
  quote_policy: summarized
