canonical_text:
  quote: ''
  summary: 'The passage ends one tale in which a boy survives an old woman''s attempt
    to smother him, obtains the specific dirty spring water she demands after help
    from a voice above him, wounds her with a hidden awl, and with his brother floods
    her house so that she drowns. It then gives the tale of the swallows and the snake:
    a snake eats young swallows and kills many bird helpers with yellow breath, until
    Thunder resists the snake''s colored breaths and cuts it in two.'
  language: English
  quote_policy: summarized
