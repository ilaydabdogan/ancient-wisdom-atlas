canonical_text:
  quote: ''
  summary: Clotted-Blood encounters and defeats an old woman whose wooden dish draws
    people in and burns them. He then reaches a camp ruled by a powerful Bull, gambles
    with him, survives the Bull's attacks by turning into down or a plume, and kills
    him through a vulnerable opening. A crier announces that the people are free.
    Clotted-Blood then proceeds to another camp, where an old woman warns him about
    a man at the river who kills people with a swing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman holds up a large wooden dish toward people; the dish draws them
    toward it and burns them when they strike it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Clotted-Blood asks the old woman to bring out the dish and point it at him;
    she addresses him as her grandson.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: As Clotted-Blood is drawn toward the dish, he makes himself go faster, changes
    into a down feather, passes over the old woman's head, and lands behind her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clotted-Blood changes back into himself, seizes the old woman from behind,
    turns the dish toward her, and she is drawn into it and consumed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Clotted-Blood places the dish on a large flat rock, pounds it with mauls,
    breaks it up, and burns it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Clotted-Blood comes to a large camp whose chief is a large Bull; in an old
    tent outside the camp-circle, an old woman warns him that the place is dangerous.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bull is accustomed to gamble with anyone who comes, and he has a wheel
    and sticks prepared for play.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Clotted-Blood first lets the Bull win everything except his bow and four arrows,
    then begins to win and wins everything the Bull has.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the Bull becomes angry and tosses Clotted-Blood, Clotted-Blood turns
    into down or a plume and becomes a man again when he reaches the ground.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The Bull's horns are broken during the attacks, and the passage describes
    the Bull as altogether of bone and impenetrable.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: Clotted-Blood shoots the Bull in the anus; the arrow disappears into him,
    the Bull falls, and Clotted-Blood cuts him to pieces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A crier announces that Clotted-Blood has killed the powerful Bull, killed
    the dangers on the way, and that the people are free again.
  category: speech
  evidence_refs:
  - ev:6
