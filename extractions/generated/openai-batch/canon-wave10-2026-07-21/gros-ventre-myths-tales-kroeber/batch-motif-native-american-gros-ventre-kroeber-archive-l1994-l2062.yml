canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which Clotted-Blood survives and completes
    dangerous tasks imposed by his father-in-law: killing buffalo bulls for sinew,
    obtaining flint after a cliff collapses, fetching water from a river guarded by
    a water-monster, and finally killing the father-in-law after being attacked. The
    passage then begins the tale “Moon-Child,” where Sun and Moon disagree about the
    beauty of human women and water women, with Sun favoring Frog.'
  language: English
  quote_policy: summarized
