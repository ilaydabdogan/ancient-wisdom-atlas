canonical_text:
  quote: ''
  summary: The passage concludes one tale in which a girl and her brother, with a
    dog described as an old man, obtain a tent, property, food, clothing, bear guards,
    and horses after abandonment. The camp returns because it lacks food; bears prevent
    women from taking meat; the girl selects marriage partners; after the boy looks
    at the camp, the people die. The passage then begins tale 27, titled “The Girl
    who became a Bear,” in which girls play near a river, bring buffalo ribs, cook
    and eat them, and the oldest girl proposes playing bear with eight ribs. A note
    says to compare the tale with another number and Arapaho tales.
  language: English
  quote_policy: summarized
