canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a Snake man and his Gros Ventre
    wife travel between her relatives and his people, repeatedly disguising their
    wealth as poverty before revealing fine clothes, horses, and gifts; the exchange
    leads the Gros Ventre and Snakes to make friendship and stop fighting. A source
    note says the tale is from informant N, not Arapaho, and compares it to Grinnell''s
    Pawnee Hero Stories. The passage then begins a tale about a woman whose two brothers
    have been killed in war: after silent mourning and a mountain fast, thunder gives
    her a short spear and ritual instructions; she undergoes a sweat-house rite, drinks
    from a stream, vows to kill an enemy, and sets out with her husband.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man learned to speak Gros Ventre and asked his Gros Ventre wife to accompany
    him to the Snakes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife's relatives consented to the journey and gave the couple painted
    horses and other property; the couple left with a tent and gifts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before reaching the Snake camp, the couple stopped in the woods, put on old
    dirty clothes, and mounted poorly saddled, miserable horses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Snakes tried to kill the woman because they said the man who married her
    appeared poor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At night the couple returned to the woods, put on their best clothes, and
    appeared with fine clothing and beautifully saddled painted horses.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the couple returned in the morning, a man cried that the husband had
    become a chief; the woman set up a large tent, helped by her husband's female
    relatives, and the couple was brought food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Snakes later gave the couple fine clothing, horses, and many other things
    before they went back to the Gros Ventre.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: On returning to the Gros Ventre, the couple again hid their property and fine
    clothing and appeared in dirty clothing; the Gros Ventre people tried to kill
    the man because he appeared poor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the couple again revealed fine clothing, the Snake man gave presents
    to his wife's relatives, and the Gros Ventre and Snakes made friendship and no
    longer fought each other.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the next tale, three men went to war, two were killed, their parents mourned
    by cutting their hair and gashing themselves, and the sister of the dead men remained
    silent.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The family hid knives and ropes because they thought the bereaved sister might
    kill herself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The bereaved sister asked for a horse, went to a high mountain, left her moccasins
    at the foot, climbed to the top, and slept there four nights while fasting.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the fourth night, thunder gave the woman a short spear and instructed her
    to return home, have her husband make a sweat-house, enter it alone, and then
    drink at the creek.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Young men built the sweat-house; the woman entered, sweated, went to the stream,
    drank, and told her relatives she would kill an enemy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: After some days, the woman and her husband set out alone with four good horses
    to look for the one who killed her brothers, and on the third day they saw tents
    by a river.
  category: sequence
  evidence_refs:
  - ev:9
