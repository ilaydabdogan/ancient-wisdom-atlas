canonical_text:
  quote: ''
  summary: 'The passage presents several Nix''a^t episodes: he deceives dancing animals
    and loses his cooked prey to wolves and coyotes; he observes mice holding a sun-dance
    inside a skull and becomes trapped; he is rescued near the river by bathing women,
    escapes, disguises himself, and kills the women by fire and smoke; later two women
    trick him while lousing him by filling his hair with burrs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nix'a^t travels along a river through thick timber to an opening and summons
    ducks, prairie-chickens, and cottontail-rabbits to come for a dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He arranges the animals in a circle, tells them to keep their eyes shut while
    dancing, sings, and begins breaking the birds' necks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A little prairie-chicken opens its eyes, sees the killing, warns the others,
    and the remaining birds and rabbits flee.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nix'a^t makes a fire, puts the killed animals in ashes under coals, says he
    is sleepy, tells his anus to wake him if anyone comes, and sleeps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wolves and coyotes come while he sleeps, eat the meat, leave bones, and after
    waking Nix'a^t finds the loss and painfully rubs his anus with a firebrand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the prairie Nix'a^t hears a noise, stands on a skull to look around, then
    discovers that the noise and dancers are inside the skull.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: The dancers inside the skull are mice, described as men, women, and children
    making the sun-dance.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nix'a^t repeatedly tells the skull opening to stretch wider so he can see
    and reach the women inside; the opening stretches over his head, contracts around
    his neck, and the mice run out.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: With the skull stuck on his head, Nix'a^t wanders among named bushes and trees,
    falls from the riverbank into the river, and floats down to women and girls bathing.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: He promises beads to whoever pulls him ashore; after the skull is split from
    his head, he runs from the pursuing women, wishes for a hole, enters it, comes
    out elsewhere, and disguises himself with white clay and a peeled stick.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In disguise, Nix'a^t returns to the women, speaks against Nix'a^t, urges them
    to dig him out, then blocks the hole entrance with wood, sets it on fire, and
    smothers them.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: Later he sees two pretty young women lousing one another, pretends to have
    too many lice, asks them to louse him, rests his head on their laps, and falls
    asleep.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The two women fill his hair with burrs and leave; the burrs pull up his forehead
    skin, he cuts off his hair, covers himself with mud, goes home crying, and his
    wife says he has been doing something again.
  category: sequence
  evidence_refs:
  - ev:13
