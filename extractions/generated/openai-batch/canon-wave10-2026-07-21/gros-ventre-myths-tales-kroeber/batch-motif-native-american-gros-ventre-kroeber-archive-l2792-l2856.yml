canonical_text:
  quote: ''
  summary: A Bear pursues a little girl and her brothers. The youngest brother kills
    the Bear with a tendon bow and arrow, and the group burns her, but one spark escapes
    notice and the Bear returns. As the group flees, successive brothers call into
    being a swamp, timber, a canyon, a river, fire, and cactus thickets to delay the
    Bear. When these fail, the little girl leads them to a flat place, arranges the
    brothers facing east, kicks a ball she carries, and sends each brother and then
    herself upward. They become stars identified as Ursa Major while the Bear looks
    up unable to catch them.
  language: English
  quote_policy: summarized
