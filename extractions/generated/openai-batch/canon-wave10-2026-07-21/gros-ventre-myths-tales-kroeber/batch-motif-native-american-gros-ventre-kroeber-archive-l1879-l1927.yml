canonical_text:
  quote: ''
  summary: Clotted-Blood encounters a man who swings people over deep water and cuts
    the rope so that a water-monster, described as the man's guardian spirit, can
    eat them. Clotted-Blood survives by turning into a down feather, later lets himself
    fall into the water-animal's mouth, finds eaten people inside, cuts up the animal,
    kills the swing-man with arrows, and frees the camp. He then travels to another
    camp where a sharp-legged man makes visitors play kicking; Clotted-Blood protects
    himself with a cottonwood limb, causes the man to pierce it and become stuck in
    a cottonwood-tree, and leaves him to starve. A crier announces that the camp is
    free.
  language: English
  quote_policy: summarized
