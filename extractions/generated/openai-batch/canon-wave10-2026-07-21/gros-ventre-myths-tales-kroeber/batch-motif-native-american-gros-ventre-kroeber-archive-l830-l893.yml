canonical_text:
  quote: ''
  summary: 'Nix''a''t constructs a sweat-house with heated stones and stations two
    boys to close its openings. He calls Bald Eagle to enter and pass through; when
    Eagle passes, Tebiaa''ta'' is trapped inside and killed by steam and blows from
    the boys. A new tale begins: Nix''a''t visits a starving winter camp where an
    old woman is said to keep the buffalo. He instructs a hungry chief''s son to cry
    until asked by Nix''a''t, and then to say he wants buffalo and bare ground instead
    of snow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nix'a't cuts or gathers willows, bends them round, covers them with robes,
    gathers stones, lights wood, and heats stones in the fire to make a sweat-house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nix'a't gives each of two boys a club and stations one at the door and one
    at the back to hold up the robes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nix'a't calls Bald Eagle four times to come down and sweat in the sweat-house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bald Eagle flies down, is told to enter at one end and fly out the other,
    and passes through the sweat-house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Eagle passes through, the boy at the back lowers the robes and the other
    boy closes the door, trapping Tebiaa'ta' in the sweat-house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hot stones lie in a small pit in the center of the sweat-house; Nix'a't pours
    water through a small hole in the top onto the stones, producing steam inside.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the trapped head presses against the robes, the boys strike him with
    clubs until he is killed; Eagle remains outside breathing hard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the next tale, Nix'a't arrives at a camp with deep snow where people have
    nothing to eat and say there are no buffalo.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The starving people say that one old woman has food, is stingy, and keeps
    the buffalo.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Nix'a't says he will try to make the old woman give up her food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Nix'a't finds a young chief's son, asks if he is hungry and wants buffalo
    and bare ground, and instructs him to run home crying and not answer anyone until
    Nix'a't asks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boy cries day and night, does not answer the other men, and answers only
    after his father summons Nix'a't, who is described by the father as wise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The boy says he cries because he is hungry, wants large herds of buffalo,
    wants to eat back-fat and unborn calves, and wants bare ground because he is tired
    of playing on snow.
  category: speech
  evidence_refs:
  - ev:6
