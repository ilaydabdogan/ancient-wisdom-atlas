canonical_text:
  quote: ''
  summary: A girl suddenly turns into a bear, kills nearly everyone in camp, spares
    her little sister, and forces the sister to prepare a large juniper-covered tent.
    The little sister meets her six brothers while going for water. Following their
    instructions, she asks the Bear how she can be killed, learns of a vulnerable
    left little finger and a tendon arrow, throws hot buffalo-fat on the Bear, and
    flees with her brothers through the river while the Bear follows their tracks.
  language: English
  quote_policy: summarized
