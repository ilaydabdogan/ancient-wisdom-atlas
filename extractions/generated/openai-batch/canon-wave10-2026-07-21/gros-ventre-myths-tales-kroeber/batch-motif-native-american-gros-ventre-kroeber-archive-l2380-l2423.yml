canonical_text:
  quote: ''
  summary: A bereaved woman swallows a white stone and gives birth to a son named
    White-Stone. The child rapidly matures through repeated fourfold swinging around
    the tent, asks where his uncles went, kills a buffalo bull, and confronts an old
    woman whose iron cane trap had killed his uncles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After her brothers had been killed, the woman went into the hills crying,
    thought of killing herself, and swallowed a nearby white stone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After swallowing the white stone, her abdomen grew larger day by day; she
    gave birth to a boy and named him White-Stone.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The mother placed the baby in a swing at four tent positions and swung him
    four times at each position; after these stages he smiled, talked, nearly jumped
    off, and then jumped off as a boy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman made the boy a bow from a short rib and an arrow from neck tendons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boy asked which direction his uncles had gone; his mother warned him not
    to seek them but eventually told him they had gone over a nearby hill.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The boy went over the hill, saw a buffalo bull, identified it as the buffalo
    connected with his uncles' deaths, shot it, killed it, and began to flay it.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: An old woman approached, said the boy had drawn blood from her buffalo, imitated
    his reply, and ordered him to carry the whole bull to her tent using his bowstring.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narration states that the old woman had an iron cane and had killed the
    boy's uncles by striking them in the back of the head when they stooped under
    the meat load at her tent.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The boy became angry, recognized the old woman as the killer of his uncles,
    ordered her to carry the bull, and told her that this was her last day.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The old woman then spoke kindly to the boy and addressed him as her grandson
    White-Stone.
  category: speech
  evidence_refs:
  - ev:10
