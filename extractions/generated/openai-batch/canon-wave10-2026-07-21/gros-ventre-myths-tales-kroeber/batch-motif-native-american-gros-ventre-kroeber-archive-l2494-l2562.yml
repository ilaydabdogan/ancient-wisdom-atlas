canonical_text:
  quote: ''
  summary: Two women wish for celestial husbands. One wishes for the Moon, climbs
    a tree after a porcupine-form Moon, rises to the sky, marries the Moon, bears
    a child, violates a prohibition about digging a blue-flowered plant, sees earth
    through a hole in the sky, and returns by a sinew rope and skin bag. The other
    wishes for the faintest star; a buffalo-bull claims to be that star and takes
    her into a buffalo herd. Gopher rescues her through an underground passage; she
    flees with her parents, climbs trees to escape pursuing buffalo, and the buffalo
    break their horns against the final tree. The passage then begins a related tale
    about two girls wishing for stars, one taken up by a star and the other wishing
    for a buffalo-bull husband.
  language: English
  quote_policy: summarized
