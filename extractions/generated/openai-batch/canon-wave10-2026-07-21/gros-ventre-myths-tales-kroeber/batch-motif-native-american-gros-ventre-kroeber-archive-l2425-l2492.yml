  summary: White-Stone compels an old woman connected with his uncles' deaths to carry
    a bull, kills her at her tent, revives his dead uncles by shooting arrows upward
    and calling warnings, then visits a camp where he provokes and kills Bone-Bull,
    freeing people who had feared him.
