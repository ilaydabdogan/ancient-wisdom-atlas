canonical_text:
  quote: ''
  summary: 'The passage includes the end of one tale in which two young men help giants
    against spear-footed birds, return through a cave, roast a blocking animal, and
    one companion becomes a water-animal who grants fortune to his friend. It then
    gives a tale of a wife taken by a bax''aa water-monster, partly transformed into
    snake form, and restored after the monster is killed and she is sweated four times.
    Two brief tales follow: a man kills hawks by pointing a hatchet at them, and a
    man taking young bullet-hawks is killed by an old bird.'
  language: English
  quote_policy: summarized
