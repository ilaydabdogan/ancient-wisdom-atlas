canonical_text:
  quote: ''
  summary: A girl and her brother flee an old woman and cross a large river with the
    help of a horned Water-monster after satisfying its lousing test through the girl's
    deception. The pursuing old woman refuses the same test and is drowned and eaten.
    The children return to the camp that had deserted them, but their relatives deny
    the boy and the people hang the children in a tree and leave after extinguishing
    the fires. A sore-covered dog, who has hidden fire and a knife, rescues them.
    The boy's gaze kills buffalo and prepares the meat, while the girl transforms
    buffalo skins into dressed skins and a tent.
  language: English
  quote_policy: summarized
