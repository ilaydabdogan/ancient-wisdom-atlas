canonical_text:
  quote: ''
  summary: The passage contains a short Springbok/Gazelle verse, followed by the opening
    of “The Elephant and the Tortoise.” Elephant disputes with Rain about whether
    Rain nourishes him; Rain departs. Elephant asks Vulture and then Crow to cast
    lots to make rain. Crow casts lots, rain falls, the lagoons dry until only one
    lagoon remains, and Elephant leaves Tortoise at the water while he goes hunting.
    Giraffe, Zebra, Gemsbok, Wildebeest, and Roodebok each ask Tortoise for water,
    and Tortoise replies that the water belongs to Elephant.
