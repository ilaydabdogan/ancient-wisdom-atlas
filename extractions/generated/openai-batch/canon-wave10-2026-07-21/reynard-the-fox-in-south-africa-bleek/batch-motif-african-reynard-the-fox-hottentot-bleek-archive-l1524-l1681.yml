canonical_text:
  quote: ''
  summary: The passage contains several Jackal fables. Jackal steals fish from a wagon
    and induces Hyena to imitate him, causing her to be beaten. Jackal steals fat,
    smears Hyena's tail with it, and has her punished as thief. In a tale of Lion's
    illness, Jackal avoids a dangerous visit by reading the tracks, then persuades
    Lion that warm Hyena skin is the cure. In another tale, Jackal extorts Dove's
    young by falsely threatening to fly up to her rock nest; Heron exposes the lie,
    and Jackal breaks Heron's neck, explaining its bent form.
  language: English
  quote_policy: summarized
