canonical_text:
  quote: ''
  summary: The excerpt continues a Jackal fable in which Jackal wounds his own face,
    tells Lion that Lion's wife scratched him, has a stone tower built, and repeatedly
    pulls Lion upward by a thong only to cut it. Jackal then has a hot stone covered
    with fat prepared, throws it into Lion's mouth, and tells him to run to water.
    The passage then begins another fable, in which Jackal marries Hyena, steals and
    slaughters a cow belonging to ants for the wedding, covers the bride with the
    cow-skin, sets up an elevated cooking place, and again pulls Lion up by a thong
    before cutting it near the cooking pot.
  language: English
  quote_policy: summarized
