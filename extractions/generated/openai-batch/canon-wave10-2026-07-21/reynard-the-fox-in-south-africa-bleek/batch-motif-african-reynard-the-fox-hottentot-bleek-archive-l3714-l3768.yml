  quote: ''
  summary: A little girl seeks restitution through a sequence of exchanges. After
    pheasants have eaten her food, they give her feathers. She gives the feathers
    to children watching sheep, but the feathers break, and they give her milk. She
    then gives the milk to the household dog, who drinks it, flees up a tree, jumps
    down, and leaves her stranded there.
