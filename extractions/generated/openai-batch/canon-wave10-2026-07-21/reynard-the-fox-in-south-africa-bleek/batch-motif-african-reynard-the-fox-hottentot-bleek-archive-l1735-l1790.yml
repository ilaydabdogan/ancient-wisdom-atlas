canonical_text:
  quote: ''
  summary: In the tale of the Leopard and the Ram, Jackal and Leopard go to the Ram's
    kraal intending to eat him. The Ram sees them and fears for his family. His wife
    tells him to carry and pinch their child so it cries as if hungry. When Jackal
    and Leopard approach, Jackal has tied Leopard to himself with a leathern thong.
    The Ram loudly says that Jackal has done well to bring Leopard as food for the
    crying child. Leopard panics and runs away, dragging Jackal over rough ground
    until Jackal is half-dead, and the Ram escapes.
  language: English
  quote_policy: summarized
