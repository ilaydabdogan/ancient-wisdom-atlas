  quote: "“since then the animals drink water”"
  summary: Springbok and Jackal ask Tortoise for water and are told that it belongs
    to Elephant. Lion asks, beats Tortoise, drinks, and the narrative says that since
    then the animals drink water. When Elephant returns from hunting, Tortoise reports
    that the animals have drunk the water. Elephant swallows Tortoise whole; inside
    Elephant’s body, Tortoise tears out vital organs. Elephant dies, and Tortoise
    exits the body and goes away.
