canonical_text:
  quote: ''
  summary: Two sisters escape from a dance after the younger sister understands a
    reed tune as a warning of bloodshed. The younger sister disguises their tracks,
    hides with her elder sister in an ant-eater's hole, prevents discovery, and conjures
    One-eye away. Pursued across a plain, the sisters transform into thorn trees whose
    gum causes the men to sleep; they smear gum over the men's eyes and return safely
    home.
  language: English
  quote_policy: summarized
