canonical_text:
  quote: ''
  summary: A Lioness warns her Lion son to beware of a man with pinching weapons,
    white dogs, and a tiger-tail tuft. The Lion rejects the warning, goes in the dark
    to ^aroxaams, and lies in ambush. iGurikhoisip arrives with his dogs; after the
    dogs and the man drink, the Lion comes out of the bush. The dogs surround and
    pull down the Lion while iGurikhoisip spears him. iGurikhoisip orders the dogs
    to release the Lion so he may be taught by his mother. The Lion tries to go home
    at night, but his strength fails and he laments.
  language: English
