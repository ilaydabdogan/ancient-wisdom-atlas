  summary: In a lion fable, a Lion and a Woman alternate falling and releasing one
    another after kinship-addressed speeches. When the Woman falls again, the Lion
    refuses the formula, eats her, keeps her skin whole, wears her skin, dress, and
    ornaments, goes to her kraal looking like a woman, and refuses a little sister's
    request for milk.
