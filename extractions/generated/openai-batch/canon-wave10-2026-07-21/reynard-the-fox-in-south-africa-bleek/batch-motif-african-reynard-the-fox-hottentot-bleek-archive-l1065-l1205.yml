canonical_text:
  quote: ''
  summary: The passage contains the end of a Lion and little Fox episode, followed
    by two closely related Jackal-Lion hunting narratives. In the first full narrative,
    Lion and Jackal hunt elands; Jackal hits the prey but lets Lion claim it, then
    makes a false blood trail, enters the carcass, takes the fat, deceives Lion about
    the portions, gives the better food to his own family, insults Lion's children,
    and leaves with his household. In the second, titled 'The Lion's Share,' Jackal
    again hits game while Lion misses, hides the evidence, misdirects Lion at a cross-way
    with a false blood trail, eats the best part from inside the carcass, and later
    gives the worse portion to Lion's household while moving his own family away.
  language: English
  quote_policy: summarized
