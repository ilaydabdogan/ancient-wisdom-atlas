canonical_text:
  quote: ''
  summary: 'The passage contains the close of a tale in which a mother hears her son
    wailing and admonishes him with the warning she had given. It then begins the
    tale titled “The Lion Who Took a Woman''s Shape”: women gather wild food; one
    woman is separated after being told to throw away her sweet herbs; she asks Hare
    for water at a river; Hare refuses because the cup is reserved for himself and
    his uncle, the Lion; she takes the cup and drinks; Hare reports this to Lion;
    Lion pursues her; she sings, and the two later chase each other around a shrub.
    The Lion borrows her beads and arm-rings and refuses to return them. After more
    chasing, the Lion falls, the Woman pins him down, and he uses a formula asking
    her to rise; she releases him and the chase resumes before the excerpt cuts off.'
  language: English
  quote_policy: summarized
