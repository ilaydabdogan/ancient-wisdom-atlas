canonical_text:
  quote: ''
  summary: The passage contains the end of one Jackal fable, in which Lion dies after
    swallowing a hot stone and Hyena flees after discovering that ants are not Jackal,
    followed by two versions of a fable in which a man frees a Snake from under a
    large stone, the Snake threatens him, other animals judge the threat acceptable,
    and Jackal resolves the case by having the Snake reenact the situation and leaving
    her trapped under the stone.
