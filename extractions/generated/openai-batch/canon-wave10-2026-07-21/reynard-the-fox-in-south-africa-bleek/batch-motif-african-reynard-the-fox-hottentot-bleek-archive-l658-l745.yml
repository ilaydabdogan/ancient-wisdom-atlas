canonical_text:
  quote: ''
  summary: 'A preface passage argues that grammatical gender in Hottentot and other
    sex-denoting languages encourages personification of impersonal or irrational
    beings. It presents fables and myths as arising from personification: fables give
    speech and reason to lower animals, while myths explain celestial and elemental
    phenomena through human-like agencies. It describes fables as moral teachers,
    contrasts their durability with myths, and notes that the offered Hottentot fables
    are translated faithfully though with slight omissions and alterations for English
    readers.'
  language: English
  quote_policy: summarized
