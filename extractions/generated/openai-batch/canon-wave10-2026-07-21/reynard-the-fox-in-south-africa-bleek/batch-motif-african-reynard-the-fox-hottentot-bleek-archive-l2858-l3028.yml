canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which a woman flees from an
    Elephant husband with her brothers and cattle, deceives him with left-behind livestock,
    and escapes through an ancestral rock that later closes on and kills him. It then
    gives a tale of a bad sister who kills her brothers despite a Guinea-fowl''s warning;
    the parents transform into storm, wind, fire, and fiery rain to burn the kraal.
    Two Sun fables follow: Jackal carries the Sun and receives a black stripe from
    being burned, and Horse is cursed by the Sun after failing to carry him while
    Ox succeeds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman rises while others sleep, tells her two brothers that the sleepers
    are in a death-like sleep, packs up necessary things, and requires complete quiet
    because noise would bring her death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman leaves one cow, one ewe, and one goat behind and instructs them
    not to make lonely-sounding noises; during the night their calls make the Elephant
    think all the cattle remain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Elephant discovers in the morning that his wife and the cattle are gone,
    takes his stick, tells his mother that the earth will tremble if he falls, and
    pursues them.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: At a narrow rocky place, the woman addresses the ancestral stone, asking it
    to divide; the rock opens for her party and closes behind them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Elephant asks the same rock to divide for him; it opens, then closes on
    him, killing him, and the earth trembles.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Copper and Weather are described as husband and wife with a daughter who married
    among other people; when her three brothers visit, she does not recognize them
    as brothers and plans to kill them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Guinea-fowl watches over the three brothers and makes noise to warn them
    when the Copper-Weather relative approaches; after breaking its rope and fleeing,
    the sister kills the brothers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Guinea-fowl weeps that the Copper-Weather relative has killed her brothers,
    and the parents respond by transforming into thunderstorm and wind, then combining
    as fire and fiery rain that burns the kraal and its inhabitants.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The Sun is on earth by the wayside; travelling men pass him, while Jackal
    treats him as a small child and places him in a back skin.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Sun burns Jackal, sticks fast to his back, and blackens Jackal's back
    from that day.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Sun catches Horse to ride him; Horse cannot bear the Sun's weight, Ox
