  summary: 'The passage includes a note defining a hut fixture called a stage, followed
    by two lion tales: in one, a Bushwoman transforms into a lion to catch a wild
    horse and then returns to woman shape; in the other, a Bushman threatened by a
    lion survives after falling from a tree onto the lion and frightening it away.'
