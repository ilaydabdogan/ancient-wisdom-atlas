canonical_text:
  quote: Since that day the Baboon has a bald place on his back.
  summary: A Zebra Stallion, raised and suckled by the Zebra Mares after Baboons repeatedly
    obstruct them at the water, confronts a Baboon. After the Baboon licks milk from
    the Stallion's tongue, the Stallion presses him onto a hot flat rock, explaining
    the Baboon's bald back.
