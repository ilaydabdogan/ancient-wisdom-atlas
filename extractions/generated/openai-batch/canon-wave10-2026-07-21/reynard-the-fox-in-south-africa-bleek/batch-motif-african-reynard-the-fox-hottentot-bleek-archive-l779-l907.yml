canonical_text:
  quote: ''
  summary: The preface argues that grammatical personification in sex-denoting languages
    stimulates imaginative myth and fable, contrasts this with literature attributed
    to Kafir and other black South African groups, and catalogs o Tji-herero/Damara
    manuscript pieces copied and translated by Rev. J. Rath. The listed corpus is
    classified as ghost stories, transformations of men or animals, household tales,
    a legend, and a fable, with several tale titles naming spectres, animal figures,
    a shape-changing lion, a child left in a well, and post-death spirits.
  language: English
  quote_policy: summarized
