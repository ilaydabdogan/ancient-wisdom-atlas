canonical_text:
  quote: ''
  summary: 'The passage first presents a praise-like address to the zebra or zebra
    stallion, describing its smell, rolling in soft ground, dusty body, neighing that
    drives away a hunter, and crossing rivers. It then begins the tale of a lost child:
    children from a kraal play with bows and arrows; one young boy stays behind, is
    surrounded by baboons, and is carried up a mountain. The people search for days
    without finding him. A year later a mounted hunter reports baboon tracks together
    with a child''s footprints, and the people find the boy sitting on a pinnacle
    of rock with a large baboon.'
