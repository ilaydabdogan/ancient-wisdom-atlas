canonical_text:
  quote: "“I, who had to eat these raisins, and died, / And dying live.”"
  summary: 'The passage contains the end of a Heitsi Eibip tale in which he falls
    ill in a valley of ripe raisin-trees, orders burial under soft stones, forbids
    his family to eat the raisins, dies, is buried, is later heard eating and singing
    near the grave, and is caught and brought home hale. It then gives an origin tale
    explaining different lifeways of Hottentots and Bushmen through two figures, one
    blind and one a hunter: cattle come from a hole in the earth, the formerly blind
    figure encloses them and anoints himself, while the hunter is burned by following
    advice about ointment and fire and is sent to the hills with a knobstick to hunt
    honey. The passage ends with the opening of “The Little Wise Woman,” in which
    girls go to dig onions and a little girl follows them despite objections.'
  language: English
  quote_policy: quoted
