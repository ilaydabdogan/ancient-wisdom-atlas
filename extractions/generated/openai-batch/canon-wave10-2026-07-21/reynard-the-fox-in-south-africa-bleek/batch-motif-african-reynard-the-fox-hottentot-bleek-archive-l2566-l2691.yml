canonical_text:
  quote: ''
  summary: A Lion has taken the shape of a woman after eating a daughter. Suspicious
    behavior, blood-sucking, and the cows' refusal to be milked reveal the imposture.
    The people of the kraal silently dismantle the hut and burn the sleeping Lion.
    The woman's heart is recovered from the fire, placed in a calabash, and nourished
    with first milk until the girl grows again and returns to her mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mother of the kraal says she had refused to let the elder sister seek
    herbs in the field and directs the little child to ask the Hare to pour out milk
    for her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hare gives the little child milk, and the elder sister asks to share it
    from the child's bamboo cup.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the sisters share the milk, spilled milk on the little child's hand
    is licked up by the elder sister; the rough tongue draws blood, which is also
    licked up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The little child complains that her sister pricks holes in her and sucks blood;
    the Mother says she does not know with what lion's nature the sister went and
    returned on the forbidden way.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the elder sister prepares to milk the cows, the cows all refuse to be
    milked by her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The husband and the Mother both note that these are the same cows the woman
    usually milks and wonder what has affected her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The elder daughter refuses to milk the cows, so the Mother has bamboos brought
    and milks the cows herself.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At night, when the wife sleeps, others see Lion's hair hanging out where he
    has slipped on the woman's skin, and they identify her as another being.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The people of the kraal begin to break up the hut in which the Lion lies asleep,
    addressing mats, poles, bamboos, and bed-skins so the removal remains noiseless.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: After removing the hut and contents, they put bunches of grass over the Lion,
    light them, and address the fire to flare up before reaching the heart.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: The fire flares up near the heart; the woman's heart jumps onto the ground,
    and the Mother picks it up and puts it into a calabash.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: From the fire, the Lion tells the Mother that he has eaten her daughter; the
    Mother answers that he now has a comfortable place.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:13
  text: The Mother puts the first milk of calving cows into the calabash where her
    daughter's heart is, and the calabash increases in size as the girl grows again
    inside it.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:14
  text: During the Mother's absence, the girl creeps out of the calabash, orders the
    hut, tells the Hare to claim the work, and hides on the stage.
  category: action
  evidence_refs:
  - ev:15
- id: obs:15
  text: The Mother does not believe the Hare's claim, finds the calabash empty, searches
    the stage, and finds and embraces her daughter, who then stays with her mother
    and remains unmarried.
  category: sequence
  evidence_refs:
  - ev:16
