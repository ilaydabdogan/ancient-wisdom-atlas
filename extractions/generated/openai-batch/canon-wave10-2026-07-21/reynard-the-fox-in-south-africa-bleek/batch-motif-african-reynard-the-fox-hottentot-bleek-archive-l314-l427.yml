  quote: ''
  summary: The preface dedicates the book to Sir George, explains that South African
    missionaries were asked to collect Native Literature, identifies Rev. G. Kronlein's
    manuscripts as the source for most translated fables, lists the manuscript contents,
    and discusses the extent, possible originality, and possible external influence
    of Hottentot/Namaqua fable traditions in comparison with European and other traditions.
  language: English
  quote_policy: summarized
