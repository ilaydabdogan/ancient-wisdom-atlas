canonical_text:
  quote: ''
  summary: The passage presents several versions of a tale in which the Moon intends
    humans to receive a message of dying and returning to life, but the Hare delivers
    a contrary message of final death and is punished, explaining the hare's split
    nose or lip and, in one version, marks on the Moon. Footnotes report Namaqua avoidance
    of hare flesh because of the bad message. A Zulu version follows in which God
    sends the Chameleon to tell humans they shall not die, but the Chameleon delays;
    the Salamander later arrives first with the message that humans must die.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first version, the Moon sends an Insect to Men with a message that
    as the Moon dies and lives, Men also shall die and live.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hare overtakes the Insect, offers to carry the message because the Insect
    is an awkward runner, and tells Men instead that they will die and wholly come
    to an end.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Moon reproaches the Hare, strikes him on the nose with a piece of wood,
    and the tale says the Hare's nose has been slit since that day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Knudsen's version, the Moon tells the Hare to say that Men shall die and
    rise again, but the Hare says they shall die and not rise again; the Moon beats
    the Hare's mouth, and it is slit by the blow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Footnotes report that old Namaquas are angry with the Hare for bringing a
    bad message and avoid or dislike eating hare flesh, while young men may eat it
    before a stated man-making ceremony.
  category: other
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: In Priestley's version, the Hare delivers the altered message either from
    forgetfulness or malice; the Moon's hatchet cuts the Hare's upper lip, and the
    Hare scratches the Moon's face, producing dark marks described as scars.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Alexander's version, the Moon says Men should be renewed as she dies and
    is renewed, but the Hare deceives Men by saying that they will die and perish.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Zulu version, God, named Unkulunkulu, creates men, animals, and all
    things, then sends the Chameleon to tell Men that they shall not die; the Chameleon
    walks slowly, loiters, and eats a shrub.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Zulu version, God sends the Salamander with a contrary message that
    Men should die; the Salamander outruns the Chameleon and tells Men they must die.
  category: sequence
  evidence_refs:
  - ev:7
