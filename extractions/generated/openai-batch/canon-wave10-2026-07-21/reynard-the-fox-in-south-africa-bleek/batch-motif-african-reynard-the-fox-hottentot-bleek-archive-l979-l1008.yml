  summary: The preface explains that some material was taken from Sir James Alexander's
    "Expedition" with minor verbal changes. It describes "Songs of Praise" as notes
    to some fables and specimens of Hottentot poetry, comments on how a poet such
    as Longfellow might render them attractively, and compares the possible literary
    working-up of Hottentot fable materials to Goethe's "Reinecke Fuchs," Longfellow's
    "Hiawatha," and an addressee's work on "Polynesian Mythology."
