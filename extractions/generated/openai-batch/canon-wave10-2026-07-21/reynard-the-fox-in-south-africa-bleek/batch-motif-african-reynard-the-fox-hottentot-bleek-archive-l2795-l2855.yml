canonical_text:
  quote: ''
  summary: A fable section headed “The Elephant” and “How a Nama Woman Outwitted the
    Elephants” begins with tree imagery. In the narrative, an Elephant is married
    to a Nama Hottentot woman. Her two brothers secretly come to her because they
    fear her husband. She conceals them in wood/on a stage, demands that a wether
    be slaughtered for her, and later asks her blind mother-in-law how they breathe
    in light and deep sleep. After learning the sounds, she listens to the household
    snoring.
