canonical_text:
  quote: ''
  summary: 'The passage first gives an etiological note in which Baboon rejects the
    name Jan and thereafter walks on all fours, apparently after losing the privilege
    of walking erect through a foolish judgment. It then introduces a Baboon fable:
    Baboon works bamboos at the edge of a precipice with eye-like plates fixed to
    the back of his head. Lion stalks him but is confused about whether Baboon sees
    him. When Lion leaps, Baboon lies flat, and Lion jumps over him, falls down the
    precipice, and is killed.'
