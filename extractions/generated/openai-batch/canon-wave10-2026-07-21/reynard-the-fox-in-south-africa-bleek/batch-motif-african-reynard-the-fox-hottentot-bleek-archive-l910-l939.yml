canonical_text:
  quote: ''
  summary: In a preface, the editor discusses relationships among Hottentot, Damara,
    oTyi-herero, and Zulu tales. He suggests that the beginning of the Hottentot fable
    of The Giraffe and the Tortoise may be missing and may have resembled a corresponding
    Damara opening, while judging the Hottentot fable more original than the oTyi-herero
    text. He also notes inclusion of an oTyi-herero household tale about an unreasonable
    child and a dog, and a Zulu Origin of Death legend that he says is analogous to
    Hottentot treatments of the same subject.
