canonical_text:
  quote: ''
  summary: A girl notices many footprints and doubts the explanation that they came
    from one person walking around. Uneasy because she is described as wise, she repeatedly
    looks about, finds an ant-eater's hole, and sees men who do not see her. She returns
    silently to digging with the other girls, continues watching, and later sees the
    men approach. A One-eyed figure blows a reed pipe with words announcing that blood
    will flow. The little girl understands the tune and asks the elder girls, who
    are dancing, whether they understand it.
