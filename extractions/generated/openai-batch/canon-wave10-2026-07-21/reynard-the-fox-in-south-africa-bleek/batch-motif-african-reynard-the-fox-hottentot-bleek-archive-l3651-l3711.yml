  quote: ''
  summary: 'A first-born child passes through a sequence of exchanges: her Father
    breaks her needle and gives an axe; cattle-herding lads break the axe and give
    honey; a little old woman eats the honey and gives food; the child then gives
    food to pheasants. The child''s complaints repeat an accumulating account of earlier
    losses and replacements.'
