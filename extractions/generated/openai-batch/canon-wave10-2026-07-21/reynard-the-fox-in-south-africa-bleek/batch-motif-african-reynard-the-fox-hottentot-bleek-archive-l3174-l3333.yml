canonical_text:
  quote: ''
  summary: 'The passage presents short legends of Heitsi Eibip/Kabip/Heigeip: he is
    described as a Namaqua sorcerer who knows secrets and prophesies; he opens water
    for his people and closes it on pursuing enemies; he dies and returns to life,
    has graves marked by stones, and changes form. Two related versions tell how he
    defeats a hole-associated killer, either an unnamed man whose forehead rebounds
    stones or ±Ga ±gorip, the pusher into the hole, after which people have peace
    or rest.'
  language: English
  quote_policy: summarized
