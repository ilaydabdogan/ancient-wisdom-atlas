canonical_text:
  quote: ''
  summary: The passage recounts a boy recovered from baboons who had fed and cared
    for him; a young baboon raised by a man and used as a shepherd until killed by
    a leopard; an etiological tale in which a formerly flying lion loses flight after
    a great frog breaks guarded bones and evades him in a pool, while white crows
    become dumb; and the opening of another lion tale in which Lion and the Only man
    quarrel over going to a rain-field.
  language: English
  quote_policy: summarized
