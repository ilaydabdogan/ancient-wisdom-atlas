canonical_text:
  quote: ''
  summary: The passage reports Semang and Pangan beliefs about souls, birth, death,
    Paradise, animal afterworlds, burial customs, and early human reproduction. New
    souls sit in a tree behind Kari before being sent forth, pregnancy is described
    through eating a soul-bird, twins arise through eating the soul-bird with an egg,
    and the dead must present a burial bamboo before Kari. Souls cross to Paradise
    by a tree-bridge, with wicked souls falling into a boiling lake. Eastern Semang
    death is described as authorized through a chain of spirits ending with Kari and
    carried out by Death-spirits through a Death-wind, while Kari may kill by lightning
    when angry. Paradise, animal afterlife locations, tree burial for tiger-transforming
    chiefs, and stories of the first woman receiving reproductive advice from a coconut
    monkey and incest/exogamy warning from a ring-dove are also described.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: New souls sit in a great tree behind Kari's seat until Kari sends them forth,
    and after becoming human they do not return to him after death.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pregnant woman is described by Kelantan Semang with the expression that
    she has eaten the bird; the soul-bird may be kept for a time in a bamboo called
    tahong.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The small Argus-pheasant named Til-til-tapa conveys men's souls, while a bird
    named Chim iui conveys women's souls.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Twins are said to result from eating the soul-bird with an egg, and twins
    have the same birth-tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A burial bamboo called penitah was interred with the dead and had to be produced
    by the soul before Kari, with condemnation as the stated penalty for failure.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Semang and Pangan souls cross into Paradise by a tree-bridge, and the souls
    of the wicked fall from it into a boiling lake after being frightened by a monstrous
    guard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Eastern Semang belief names two invisible Death-spirits: Sentiu for men and
    Chin-ni for women, each with a servant.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Death-spirits are said not to be able to take life unaided; they seek
    authorization through a chain of intermediaries leading to Kari.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If Kari decides a person should die, the Death-spirits send a Death-wind over
    the doomed person, causing death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When Kari is angry with someone, he kills the person by lightning rather than
    through the Death-spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In Paradise, souls eat only fruits, are visible to one another but invisible
    to mortal eyes, do not change or marry, remain there forever, and do not return
    to earth; bodies of the dead do not rise again.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: One account sends innocuous beast souls to Kena-luong and tigers, snakes,
    and scorpions to Belet, where they torture and feed on damned souls; another account
    sends tiger souls with other beasts to an immense cavern called Kena-luong, near
    an opening called Belet.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Common people were buried in the ground, but Belians, described as great chiefs
    believed able to turn into tigers, were deposited in trees.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The first woman and her husband imitated child-carrying by carrying two fire-logs
    under their armpits; after advice from the coconut monkey, they obtained two boys
    and two girls.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The four children later had children, and the ring-dove warned them that they
    had married within prohibited degrees of consanguinity and advised separation
    and marriage to other people.
  category: speech
  evidence_refs:
  - ev:9
