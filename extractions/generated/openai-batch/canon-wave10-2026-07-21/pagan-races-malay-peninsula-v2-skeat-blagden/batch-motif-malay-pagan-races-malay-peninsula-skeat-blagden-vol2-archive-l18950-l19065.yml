canonical_text:
  quote: ''
  summary: 'The passage describes Orang Laut avoidance of small-pox as a malignant
    spirit blocked by thorny path barriers. It then gives Benua-Jakun traditions:
    the earth is a skin that Pirman once broke, destroying the world with water; mountains
    later rose from the waters and now steady the earth, with some summits near or
    touching the sky. After Lulumut emerged, a covered pulai-wood prahu floated on
    the waters containing a man and woman created by Pirman; when it stopped moving,
    they gnawed through it, stood on dry ground, and saw the world. Embedded footnote
    material describes forest or mountain beings and a variant origin account in which
    a white Ungka and white Siamang on a lofty mountain have four children who descend
    and become mankind and the ancestors of four tribes.'
  language: English
  quote_policy: summarized
