- id: obs:4
  text: The author picked up a large wooden figure representing a coconut-monkey on
    the Kuala Langat coast near the haunts of Orang Laut or Besisi, and later inferred
    that it should be explained in the same way as Abbott's specimens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At a shrine on the Bird's Nest Islands, a wooden human image occupied a central
    position between rhinoceros and crocodile skulls, with offerings of edible bird's-nests
    and broken clay animal images placed before it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Near Jambu in Jering, the author picked up a large wooden elephant with a
    mahout that had been used instead of the usual lanchang or spirit-boat during
    a ceremony for casting evil spirits out of a village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The summary states that the religions of these native tribes combine predominantly
    native notions with additional details from Indian and Mohammedan sources, some
    possibly through an Indo-Chinese channel.
  category: relationship
  evidence_refs:
  - ev:7
