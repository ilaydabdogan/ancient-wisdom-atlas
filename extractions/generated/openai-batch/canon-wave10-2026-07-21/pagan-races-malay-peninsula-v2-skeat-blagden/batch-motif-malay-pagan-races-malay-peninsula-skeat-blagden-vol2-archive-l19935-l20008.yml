canonical_text:
  quote: ''
  summary: 'The passage discusses wooden human and animal images among Malayan Sea-Gypsy-related
    groups. Dr. Abbott interprets them not as idols but as probable sickness scapegoats:
    a medicine-man transfers a demon from a sick person into a wooden animal figure,
    which is then taken to sea and thrown overboard. The author compares other collected
    wooden figures and shrine images, including a coconut-monkey figure, a central
    human image at a shrine with skulls and offerings, and a wooden elephant used
    instead of a spirit-boat in expelling evil spirits from a village. The passage
    ends by summarizing the religions of these tribes as mixed systems with native
    bases and added Indian and Mohammedan elements.'
  language: English
  quote_policy: summarized
