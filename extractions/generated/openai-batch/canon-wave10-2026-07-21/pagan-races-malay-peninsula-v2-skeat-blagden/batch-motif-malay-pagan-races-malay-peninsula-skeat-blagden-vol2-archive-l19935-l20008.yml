- id: obs:2
  text: When an Orang Laut is ill, a wooden animal figure may be made, the medicine-man
    exorcises the demon from the sick man and drives it into the figure, and the figure
    is carried out to sea and thrown overboard.
  category: sequence
  evidence_refs:
