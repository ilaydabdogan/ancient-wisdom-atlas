canonical_text:
  quote: ''
  summary: 'The passage describes Benua-Jakun and Jakun burial customs in Johor: wrapping
    or washing the body, burial near a hut or in a deep grave, inclusion of clothing,
    tools, weapons, rice, water, and tobacco, and a wooden grave framework sometimes
    roofed. Footnotes quote a comparable account with variants including sitting burial
    posture, goods to serve a westward journey, a seventh-day fire over the grave
    to drive away evil spirits, gendered corpse orientation, and desertion and burning
    of the death house.'
  language: English
  quote_policy: summarized
