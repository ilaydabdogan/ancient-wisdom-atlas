canonical_text:
  quote: ''
  summary: The passage describes drawings of Sakai and Semang face decoration, then
    discusses tattooing, scarification, face-paint, and body-paint among Sakai, Senoi,
    and related groups. It records methods of skin puncturation with charcoal, designs
    on the forehead and fingers, uncertainty over whether reported tattooing is true
    tattooing or paint/scarification, and materials for white, black, and red pigments
    used in body-paint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plate is described as showing types of face decoration among Sakai and “Semang”
    individuals from named localities.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: One described method of skin marking involves pricking the skin with a thorn
    and rubbing powdered charcoal into it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Malay informant reported that a tribe at Sungei Raya in Kinta used red lines
    as well as bluish charcoal lines, though the red pigment was not identified by
    that informant.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lines are said to appear mostly on the face; sometimes rings are tattooed
    around the fingers, and the marks are usually limited to a few lines on the forehead.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A favored design is described as a diamond-shaped central pattern with one
    or two vertical lines on each side, while another form is a single line from the
    hair roots to the tip of the nose.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The marks are said not to appear tribal, because members of the same family
    have different designs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author warns that some reports called tattooing may actually refer to
    scarification or mere face-paint, although some true skin-puncturation is acknowledged
    for the Peninsula.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Body-paint is reported among the Sakai of Perak and the Senoi of Pahang, with
    colors said to agree fairly well with those used by the Semang, though made from
    varying materials.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: White pigment is reported as made from lime obtained from Melania shells and
    applied as a circular stripe on the right cheek; black pigment is from charcoal;
    red pigment is from anatto fruit.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage argues that before anatto, red pigment may have come from red
    earth, hematite, or red ochre derived from iron-ore.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A cited note states that charcoal, a vegetable red, and white china clay are
    mixed with oil, and that faces, sometimes women’s breasts, and occasionally men
    are painted with line and dot patterns on occasions when people wish to add to
    their charms.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: An image caption identifies a Sakai child having face-paint applied.
  category: action
  evidence_refs:
  - ev:9
