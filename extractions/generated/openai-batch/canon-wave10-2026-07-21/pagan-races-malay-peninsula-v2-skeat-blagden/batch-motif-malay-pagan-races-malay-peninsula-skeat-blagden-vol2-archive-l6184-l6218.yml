canonical_text:
  quote: ''
  summary: The passage contrasts Negrito use of natural leaves and flowers with Sakai
    and Jakun artificial palm-leaf dance decorations. These decorations are described
    as plaited forms representing flowers, fruit, krisses, and nooses, and Vaughan-Stevens
    reports that they were meant to trap demons attacking the dancer. The passage
    then argues that Semang and Jakun songs and mimetic dances generally have definite
    meanings, despite some writers treating them as idle or random performances.
  language: English
  quote_policy: summarized
