canonical_text:
  quote: ''
  summary: The passage recounts a tradition in which Dato' Klambu burns a palace during
    a feast for the Jakun, leaving only a man and a woman who become ancestors of
    the Rayat Laut. It also records Orang Laut beliefs about animal first parents,
    flying lizards that bring souls to newborns, the Stone of Life, crocodiles and
    sharks as related death-enforcers, birth-period spirit protection, shark kinship,
    and two wooden female images found in a cave near the seashore.
  language: English
  quote_policy: summarized
