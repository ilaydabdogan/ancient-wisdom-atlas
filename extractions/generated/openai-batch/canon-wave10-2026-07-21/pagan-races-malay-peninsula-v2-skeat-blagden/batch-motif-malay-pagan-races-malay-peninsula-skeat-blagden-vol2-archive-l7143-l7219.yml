  summary: The passage describes Sakai song fragments and musical style, Sakai wind-organs
    made from slit bamboo lashed in trees, Blandas musical instruments including a
    screw-pine and mouse-deer-skin drum and a tiger dance-mask, and Besisi wooden-stick
    and bamboo percussion instruments.
