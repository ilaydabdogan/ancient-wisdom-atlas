  quote: ''
  summary: The passage describes leaf and fungus ornaments worn by Semang and Pangan
    men and women, including head fillets, ear scrolls, breast festoons, tassels,
    girdles, and wreaths, some explicitly said to serve as charms against disease
    or pain. It then describes Semang choral dances called Siwang, with female dancers,
    male instrumental accompaniment, chanting, an old male conductor, and characteristic
    dance posture.
