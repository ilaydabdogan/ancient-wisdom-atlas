canonical_text:
  quote: ''
  summary: The passage surveys animal-related traditions among Aboriginal Malayan
    groups. It reports traditions about Belo's dog as the source or prototype of the
    tiger; a mouse-deer rewarded after rescuing To' Entah from a giant turtle; Mantra
    descent from two white apes whose offspring became human in the plains while others
    remained apes in the mountains; the white siamang as refuge of a deceased Sakai
    chieftain's soul; baboons and wild dogs as guardians or advisers connected with
    first parents and Paradise; and monitor or small lizards connected with proverbs,
    sacred books, Belo's return to life, and soul beliefs.
  language: English
  quote_policy: summarized
