comparison_claims:
- id: claim:1
  claim: The white-ape human-descent story reported from the Mantra is said in the
    note to have an identical version in Newbold, with a variant that the children
    were four in number.
  claim_level: same_motif
  target: Newbold's account of the white-ape descent story among the Benuas or related
    groups
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage provides a note on identity and a numerical variant but
    does not reproduce Newbold's full account.
- id: claim:2
  claim: The passage places the gigantic baboon and the reddish-furred wild dog in
    the same functional pattern as animal guardians of the bridge to Paradise.
  claim_level: same_function
  target: Animal guardian of Paradise-bridge pattern in Negrito and Jakun traditions
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The animal species and tribal attributions differ, and the passage
    does not establish historical relationship between the variants.
- id: claim:3
  claim: A proverb-origin role is assigned to the Semang monitor lizard Bagenn, while
    the same proverb is assigned among the Jakun to Belo.
  claim_level: same_function
  target: Shared proverb-attribution pattern between Semang Bagenn and Jakun Belo
    traditions
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not give the proverb text or explain whether this
    reflects borrowing, common inheritance, or independent reassignment.
- id: claim:4
  claim: The note cautiously suggests that the lizard-soul belief may be Malay or
