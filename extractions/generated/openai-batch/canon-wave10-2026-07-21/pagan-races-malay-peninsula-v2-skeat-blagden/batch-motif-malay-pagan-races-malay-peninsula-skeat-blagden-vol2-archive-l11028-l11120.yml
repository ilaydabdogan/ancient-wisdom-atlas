    to have been promised sweet-potato leaves as a reward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mantra informants reportedly said they descended from two white apes whose
    offspring went into the plains, perfected themselves, and became humans, while
    others returned to the mountains and remained apes.
  category: sequence
  evidence_refs:
  - ev:3
