canonical_text:
  quote: ''
  summary: 'The passage first gives the end of an account of a person in tiger-shape
    whose continued existence depends on a fire and incense being kept at home, and
    who returns sick to human form after swallowing bones. It then describes Semang
    medicine and exorcism: diseases are regarded as demons. In an observed case at
    Siong, a woman with severe limb pains runs into the jungle; the chief Pelima uproots
    a sapling stump and a creeper root interpreted as demon embodiments or habitations,
    rubs soil from their holes on the woman, and explains that he has exorcised two
    evil spirits from a former bathing place associated with her illness.'
  language: English
  quote_policy: summarized
