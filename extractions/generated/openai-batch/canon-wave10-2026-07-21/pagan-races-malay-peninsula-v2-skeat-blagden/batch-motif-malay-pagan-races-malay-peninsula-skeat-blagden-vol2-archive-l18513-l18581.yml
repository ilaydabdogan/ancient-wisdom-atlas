canonical_text:
  quote: ''
  summary: 'The passage first reports a lost written record on lizard skin: remembered
    but unreadable, destroyed either by Batin Changgei Besi or later by a dog. It
    then presents a Mantra doom myth in which, after humans cease to live, storms,
    descending waters, lightning, sinking mountains, heat, and divine fire end the
    world; God burns and weighs sinners'' souls up to seven times, sends purified
    souls to heaven and unpurified sinners to hell with tormentors, and finally sets
    the earth on fire.'
  language: English
  quote_policy: summarized
