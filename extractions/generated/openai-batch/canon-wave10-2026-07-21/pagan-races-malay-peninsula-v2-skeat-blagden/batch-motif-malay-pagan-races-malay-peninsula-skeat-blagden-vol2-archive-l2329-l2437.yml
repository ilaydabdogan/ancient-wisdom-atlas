canonical_text:
  quote: ''
  summary: The passage describes Sakai/Sen-oi and related groups’ red body-paint,
    tattoo and face-paint designs, a tradition of common descent and migration from
    islands to the Peninsula under a named chief, and rules assigning special paint
    patterns to tribes, magicians, midwives, young mothers, and newborn children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Red pigment is described as obtainable by treating wild turmeric with lime,
    and red body-paint is associated with a Malay name, Batu Kawi.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Changkat Riam, some Sakai women were sometimes covered with indelible black
    tattoo marks and red paint; the red paint dissolved in water and was applied on
    feast days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some women painted concentric red circles on their bosoms, while others painted
    their bosoms fully and applied straight or broken-line designs to cheeks, arms,
    and thighs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Sakai, Besisi, Kenaboi, and Tembeh are reported to declare common descent
    from one stock, with separate tribes formerly inhabiting islands before migration
    to the Peninsula under a chief called the Chief with the Iron Finger-nails; the
    Tembeh are excepted as earlier separate migrants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tradition is described as vague; during a period of separation, the people
    are said to have learned tattooing from another race and later substituted face-paint
    for tattooing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: For the Sen-oi, Besisi, and Kenaboi there was a particular pattern for each
    tribe; the designs and materials were identical but the forms varied, and one
    tribe-sign served all members from chief downward.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Among the Sen-oi there was a special breast-pattern for men and women, and
    magicians, midwives, and their patients were exceptions to the ordinary tribal
    pattern rule.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A magician or medicine-man wore paint suitable for an exorcism while officiating
    and wore ordinary tribal paint at other times.
  category: action
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:9
  text: Midwives wore special face-paint while discharging their office, and midwives
    of all three tribes used one and the same office pattern.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A young mother and her newborn child each wore a series of face-paints according
    to the day and their health condition; this series was the same for all three
    groups.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The three curves on Besisi cheeks are described as variants of an ancient
    Besisi and Sen-oi tribal mark consisting of three stripes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Magicians made variants of older patterns; the Sen-oi magicians added a stripe
    from under the lip to the chin, the Besisi chose a tiger pattern, and the Kenaboi
    rearranged three curves.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Medicine-men’s patterns were used only when they were in office; on other
    occasions they wore lay-member painting.
  category: action
  evidence_refs:
  - ev:9
