canonical_text:
  quote: ''
  summary: 'The passage describes a Sakai marriage pronouncement by parents, including
    advice and a fertility wish, then reports accounts of occasional plural marriage.
    It then summarizes Vaughan-Stevens''s account of alleged totemic clan organization
    among Sakai/Senoi, Besisi, and Kenaboi: clans are distinguished by face-paint
    patterns, primary totem names and local variants are listed, intermarriage rules
    and expulsion are described, and clan status may transfer through marriage. Editorial
    notes caution that the account is confused.'
  language: English
  quote_policy: summarized
