canonical_text:
  quote: ''
  summary: The passage describes religious specialists, sacred localities, medicine-houses,
    and categories of magico-religious rites among Peninsular groups. It contrasts
    the lack of recorded high places among nomadic Negritos with Sakai and Jakun sacred
    spots, describes exorcism shelters and charm storage, and summarizes prayers,
    invocations, sacrifice, possession, divination, and self-transformation as rite
    categories. It also describes invocations addressed to spirits, ancestors, demons,
    animals, insects, and inert objects believed to embody spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual specialist is described as able to know the future as it affects
    acts, avert the wrath of heaven, and after death be re-embodied as a wild beast
    that protects descendants.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Sakai and Jakun, the specialist has distinctive dress and body-painting
    and carries an emblematic wand or staff.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that there is no recorded use of high places or shrines
    among the pure Negritos, and relates this to their highly nomadic pattern of staying
    only four or five nights in one place.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Sakai and Jakun are said to set apart sacred spots where incense is burnt
    and vows are registered in hope of material advantage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Medicine-houses are described as solitary cells in the forest where a magician
    keeps charms and spells, or as small dempong palm-leaf shelters.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The small dempong shelters screen the medicine-man and patient from view during
    exorcism.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The main divisions of ceremonies are listed as prayers and invocations, sacrifice,
    abstinence, possession, divination, and self-transformation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Prayers and invocations among the Peninsular tribes are described as seeking
    material rather than moral advantages.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among the Semang, fixed prayer forms are said to be rare; a petitioner usually
    expresses a wish in a quasi-conversational phrase to great spirits or deities.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Among the Sakai, spirits of deceased ancestors and demons are conjured more
    freely; among the Jakun, especially the Besisi, invocations are addressed to animals,
    insects, and inert objects believed to embody spirits.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Immigrating Malays are said to credit all branches of these tribes with knowledge
    of very potent charms.
  category: relationship
  evidence_refs:
  - ev:9
