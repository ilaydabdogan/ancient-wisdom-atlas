canonical_text:
  quote: ''
  summary: The passage describes Tembeh infant care using floor placement or a sarong
    hammock under leaves, with stated practical protections from insects and animals.
    It then describes Sakai birth customs centered on a sage-femme's ground-level
    medicine-hut, restrictions on male and child access, use of the hut as a childbirth
    and postpartum retreat for fourteen days, and footnoted explanations involving
    hantu, trespass prevention, and visual privacy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tembeh children may be left by themselves on the floor between feeding times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tembeh children are often placed in a hammock made from a stretched-out sarong
    and hung under a leaf screen.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated reasons for the hammock and leaf-screen arrangement include freeing
    the mother for cooking, improving the child's comfort, and protecting the child
    from land-leeches, ants, centipedes, and scorpions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At night the child's swinging cradle is not suspended from a tree, including
    among the Orang Laut, because of fear of leopards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that the average number of children born to a Tembeh is
    not higher than two per man, according to Vaughan-Stevens.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sakai sage-femme is described as more reluctant to give information about
    her art than the magician, who is himself described as secretive.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sage-femme's house is recognizable because it is built level with the
    ground, while the other tribal houses are raised four to six feet above the soil.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: If the sage-femme has a living husband, she has an ordinary hut for shared
    residence and a separate ground-level medicine-hut.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men may not enter the medicine-hut or approach it too closely, while women
    may enter when invited and children are forbidden to enter for fear of mischief.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The medicine-huts also serve as special retreats for women at childbirth,
    and women may remain there for fourteen days after delivery.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Footnoted explanations for the ground-level hut include the sage-femme being
    old and weak, the belief that hantu cannot insinuate themselves under the floor,
    and the more probable explanation that the design distinguished the hut and protected
    it from trespass.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The footnote also states that the medicine-hut's door is lower than an adult's
    head and that the walls and roof are contracted and thick to prevent men from
    seeing into it.
  category: object
  evidence_refs:
