canonical_text:
  quote: ''
  summary: The passage describes a Sakai ritual in which a magician, pupil, men, women,
    and children use decorated or smooth bamboos, headbands, face-painting, and ordered
    seating to invoke and control demons before activities such as hunting or fishing.
    It then explains charm-patterns for rendering demons powerless and gives a separate
    Sawai exorcism for an invalid, in which a Pawang uses a palm-leaf enclosure, censer,
    beating with a palm leaf, loopwork or a cage, dancing, shouting, and magic words
    to trap a possessing demon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The magician continues a bamboo-sounding ceremony, the pupil accompanies him
    with decorated bamboos, and the men join until the magician stops; afterwards
    they put the bamboos behind them and go to the intended activity such as hunting
    or fishing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the ceremony no words are spoken and little or no gesticulation is
    used; in some cases two bamboo sticks called sok-yet are struck together in the
    air.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that formerly women could use only smooth, undecorated bamboos,
    unlike the men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and children are required to attend because the invocation of many demons
    makes distance from the men unsafe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women sit behind their husbands, children behind the women, and a broad vacant
    space remains between the men's and women's circles for the demons' passage.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women's hair is not allowed to hang over their faces, leaving black face-painting
    stripes visible; this is said to prevent demons from breaking through between
    women and attacking unprotected children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The demons enter from above into the space between men and women, and after
    the bamboo beating ends they go down through the earth in obedience to the magician's
    will.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women are said to have no designs on their headbands but to be recognized
    by demons from their association with their husbands and protected by charms on
    the husbands' headgear.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The pupil's painted bamboos are said to call demons to see the magician, while
    the other men's decorated bamboos use their patterns to render demons powerless
    for the following day.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that if Allah, identified parenthetically as Tuhan or Peng,
    intends a man to be injured, there is no remedy against it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man may cut an individual charm-pattern for his own case, but using the
    general charm-pattern alone would summon all demons against him without protection;
    tiger or snake charms work only if the relevant demons hear them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the Sawai exorcism, an invalid is placed with the head toward the west
    under a fresh dampong palm-leaf roof or screen, and the Pawang enters with a coconut-shell
    censer containing burnt resin.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Pawang swings the censer seven times over the patient's couch, beats the
    invalid or possessing demon with a dampong palm leaf, and tries to drive the demon
    into loopwork or a cage over the patient's head.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The loopwork varies in form and material, probably according to the demon
    it is meant to catch; the magician stamps, dances, shrieks, and shouts until the
    demon enters the cage, then murmurs magic words to prevent escape.
  category: sequence
  evidence_refs:
  - ev:11
