canonical_text:
  quote: ''
  summary: The passage summarizes reported beliefs about souls among Sakai, Jakun,
    Orang Laut, Besisi, Semang, and Malay groups. It describes soul conveyance through
    eating certain plants, the immortality of the soul likened to air, Sakai belief
    in dreams and metempsychosis, an after-death purification and ordeal involving
    Granny Longbreasts, boiling water, and a chopper bridge, Besisi ideas of seven
    souls and a soul-shadow relation, grave-side hutches for the soul, and the role
    of medicine-men or sorcerers as intermediaries, chiefs, teachers, healers, and
    ritual mediums.
  language: English
  quote_policy: summarized
