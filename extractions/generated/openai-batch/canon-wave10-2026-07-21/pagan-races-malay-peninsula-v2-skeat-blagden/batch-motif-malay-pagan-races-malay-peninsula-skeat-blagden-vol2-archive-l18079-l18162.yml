canonical_text:
  quote: ''
  summary: 'The passage recounts several Mantra traditions: the appearance of dogs
    and the tiger, the departures of Mertang and B''lo to Rising Land, B''lo''s raising
    of the low sky, marriages that explain Mantra descent, population control by the
    Lord of the Underworld, the institution of human death, an earlier time with three
    Suns and no night, and To'' Entah''s deception of the Moon and Female Sun, explaining
    the present Sun-Moon opposition at eclipses.'
  language: English
  quote_policy: summarized
