canonical_text:
  quote: ''
  summary: 'The passage describes Sakai of Perak birth-related customs and observations:
    a decorated receptacle; burial of a mother and newborn together if both die during
    confinement; postpartum food restrictions and maternal recovery; infants given
    hornbill quill-ends to suck for quieting and good luck; child carrying, hammock
    or basket suspension, and sleeping positions; remarks on fertility and infant
    mortality; and notes on child fumigation through smoke from a large fire and on
    hammock-cradle construction.'
  language: English
  quote_policy: summarized
