canonical_text:
  quote: ''
  summary: The passage contains a fragment about watching over Naing around the mountain
    or earth; an ethnographic classification of Sakai and Tembeh magicians; Tembeh
    origin and migration traditions involving islands, attack by cannibals, flight
    to Borneo, departure from Borneo, a dream of a white bird, movement to Perak,
    and retreat into mountains; and a description and diagram notes for a Tembeh ceremony
    exorcising the Cholera Demon Rak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment says that someone or something goes round the mountain, glossed
    as the earth, to keep watch over Naing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Sakai, each magician could perform any charm he wished.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Tembeh, magicians were divided into seven classes, and members of
    each class learned and practised only one particular form of magic.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The seven Tembeh magician classes are Demon-charmers or Head Magicians, Disease-charmers
    or medicine-men, Field and Forest-charmers with Weather-charmers, Dream-diviners,
    Omen-diviners, Crime-diviners, and Assistant Magicians or pupils.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Tembeh tradition says the Tembeh were of the same stock as the Sakai when
    the Sakai dwelt in Pulau Guntong Penyaring and the Tembeh dwelt on a distant island
    called Tembeh or Tumior.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Tembeh tradition says the Tembeh were attacked by inhabitants of another
    island described as cannibals, and that survivors fled to Borneo.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Several reasons are given for the Tembeh departure from Borneo, including
    a quarrel, hostility from the Dayaks, and a dream of a white bird that they were
    to follow; they reached Perak, wandered inland, and a foreign conquest drove them
    permanently into the mountains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Tembeh alleged that the cholera charm described was identical with one
    formerly practised by all Sakai tribes, while Sakai informants asserted knowledge
    of a special cholera charm but could not state for certain whether it was identical
    with the Tembeh ceremony.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The cholera ceremony began with a magician giving a signal, after which everyone
    except the magician withdrew into small tree-huts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The magician enclosed a cleared and levelled open space by drawing four shallow
    furrows at right angles with a pointed staff; the described space measured about
    30 meters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The expulsion of the Cholera Demon, called Rak, takes place in the enclosed
    space, and the passage says he is apparently exorcised like the Smallpox Demon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The diagram explanation identifies compass points, an entry corner for spear-bearers,
