canonical_text:
  quote: ''
  summary: The passage describes a black-furred mountain being that accompanies climbers
    of its tribe and is said to foretell the death of the current Batin. It then records
    Jelebu regalia said by Malay tradition to be of Jakun origin, followed by an origin
    tradition in which Batin Salengkur 'Alam descends from heaven, encounters a giant
    bamboo on Gunong Hijau, causes Princess Lindong Awan to emerge from it, and has
    her married to Raja Ma'atham by heaven-descended ritual officials and witnesses
    before the couple ascend the throne of Johor.
  language: English
  quote_policy: summarized
