  quote: ''
  summary: The passage discusses Sabimba/Orang Laut religion, fear of dreams, dream
    warnings about tiger death and bathing, water-related punishment, and Sabimba
    traditions of origin from Celebes through a shipwreck near Battam followed by
    settlement there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer rejects as not final the claim that the Sabimba have no religion
    and reports demons, charms, and a probable older pagan Malay demonology or shamanism
    with slight Hindu influence.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bad dreams are described as greatly dreaded and able to keep the dreamer uneasy
    for several days.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Sabimba man of old is said to have dreamed that a tiger would kill him,
    and the dream is said to have been fulfilled within two days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sabimba say their ancestors were warned in dreams that if the race bathed
    they would be visited by tempests.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Because of the ancestral dream warning, the Sabimba are said to abstain from
    bathing, and the passage also notes an abstention from eating fowl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Malays are said to threaten or punish them by ducking them in water, which
    the Sabimba are described as fearing more than immediate death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before being transported to Johor by the Temenggong of that state, the Sabimba
    inhabited part of Battam traversed by the Sabimba stream and its tributaries.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Sabimba are described as forest people with no clearings, no cultivation,
    and no boats, though their own traditions say they had not always lived in that
    condition.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Their traditions say their forefathers lived in the land of the Bugis, identified
    as Celebes, and were agricultural and maritime like the Malays.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: While voyaging westward from Celebes, a vessel containing a party of their
    forefathers and a Bugis Raja was lost off the coast of Battam.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some of the voyagers reached shore, could not return to their native country,
    remained on Battam, increased over generations, and made forest clearings.
  category: sequence
  evidence_refs:
  - ev:7
