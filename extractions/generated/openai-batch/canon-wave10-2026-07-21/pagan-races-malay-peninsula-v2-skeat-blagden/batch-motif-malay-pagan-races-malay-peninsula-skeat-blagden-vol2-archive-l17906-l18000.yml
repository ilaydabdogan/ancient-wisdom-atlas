canonical_text:
  quote: ''
  summary: 'The passage gives several Mantra-related charms: a demon-quelling charm
    to divert enemies, a charm against the Hantu Saburu or Demon Huntsman, and charms
    against fever demons. It then describes a rule for killing a dangerously mad Mantra
    with a wooden sword. The passage also records Mantra traditions of original occupation,
    the Great Island, ancestral circumambulation, and the origin of Batins from Batin
    Changgei Besi, Iron-nails, whose son is Batin Krat Tiga, Chief Cut-in-Three-Pieces.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A demon-quelling charm tells enemies, opponents, and assailants to swerve
    left and right, asks that their gaze be thrust away, and asks that the speaker
    walk alone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A protection charm is specified for the Hantu Saburu, also called the Demon
    Huntsman or Wild Huntsman.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Wild Huntsman spell addresses a black dog, gives its name as Sokom, and
    says its master's name is Water, Redang, and Forest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Wild Huntsman spell commands the addressee to depart with the dog and
    says there are no hogs or deer to hunt there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Wild Huntsman spell says the dog's nostrils are shut, the smell of its
    nose has been charmed, and the speaker's smell is carried away by the wind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Kapialu Demon and Kembong Demon are said to be exorcised by fever charms
    involving a beluntok shrub and a charm cast or thrown upon the head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another fever charm says that devil's life, lodging life, affected life, and
    hard-souled evil life have been counteracted, and calls for the spirit or life
    to rise, be lifted up, and be drawn out.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: When a Mantra becomes mad, his parents are said to be obliged to kill him
    to prevent him from killing others, using a sharp wooden sword.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Mantra are said to believe that they are the original occupants of the
    country, and the passage compares this with a Besisi statement that the Great
    Island belongs to them and not to the Malays.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some Mantra say the Great Island is so vast that their ancestors tried for
    many generations to circumambulate it; each new generation encountered new country,
    and the last nomadic forefathers settled where the race now lives.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The first Batin and first ruler is named Batin Changgei Besi, or Batin Iron-nails,
    whose nails were of iron and who lived at Guntong Penyarong or Penyaring in the
    Menangkabau district of Sumatra.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Batin Iron-nails is said to have placed a Raja over Menangkabau, a Bendahara
    over Pahang, and later a Penghulu over Ulu Pahang.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After Batin Iron-nails died, his son Batin Krat Tiga, or Chief Cut-in-Three-Pieces,
    succeeded him; the passage begins to explain that name through the Bendahara of
    Pahang's resentment about the Penghulu appointment.
  category: sequence
  evidence_refs:
  - ev:9
