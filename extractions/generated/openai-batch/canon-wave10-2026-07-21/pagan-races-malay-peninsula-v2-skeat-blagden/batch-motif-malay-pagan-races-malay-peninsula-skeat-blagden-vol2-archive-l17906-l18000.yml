candidate_motifs:
- id: motif:1
  label: spoken charm that diverts enemies and hostile gaze
  taxonomy_refs: []
  basis: The demon-quelling charm orders enemies to swerve aside, asks their gaze
    to be thrust away, and asks that the speaker walk alone.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a charm text but no narrative setting beyond its protective
    function.
- id: motif:2
  label: banishing a wild huntsman by naming dog, denying prey, and concealing scent
  taxonomy_refs: []
  basis: The Wild Huntsman charm names the black dog, names the master, orders departure,
    says there are no hogs or deer, shuts the dog's nostrils, and sends away the speaker's
    smell.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not narrate an encounter with the Huntsman; it preserves
    a ritual speech formula.
- id: motif:3
  label: fever treated as demon or removable spirit-life
  taxonomy_refs: []
  basis: Kapialu and Kembong are called demons exorcised by fever spells, and the
    charms cast away fever or draw out harmful life or spirit.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The wording of one charm is noted in the passage's footnote as textually
    doubtful, so precise interpretation of 'life' or 'spirit' is uncertain.
- id: motif:4
  label: dangerous madness answered by kin killing with wooden sword
  taxonomy_refs: []
  basis: The passage states that parents of a mad Mantra must kill him with a sharp
    wooden sword to prevent him killing other people.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is reported as a custom or rule, not as a mythic episode; no sacrificial
    or ritual rationale is supplied.
- id: motif:5
  label: original occupants of a vast island homeland
  taxonomy_refs: []
  basis: The Mantra are said to believe they are original occupants, and the Great
    Island is described as their country rather than the Malays' in a related Besisi
    statement.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage reports beliefs and sayings, not a full origin myth.
- id: motif:6
  label: multi-generational circumambulation before settlement
  taxonomy_refs: []
  basis: Some Mantra say their ancestors spent many generations attempting to circumambulate
    the Great Island, with each generation advancing, resting, and the next resuming
    the journey until settlement.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage presents this as an added Mantra notion; no named ancestor
    or episode sequence beyond the journey pattern is given.
- id: motif:7
  label: primordial iron-nailed chief establishes political offices
  taxonomy_refs:
  - royal_legitimacy
  basis: Batin Iron-nails is called the first of all Batins and rulers and is credited
    with placing regional rulers over Menangkabau, Pahang, and Ulu Pahang.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The royal-legitimacy classification is supported by the founding appointments,
    but the passage does not explicitly claim divine sanction or legal legitimacy.
- id: motif:8
  label: successor named Chief Cut-in-Three-Pieces
  taxonomy_refs: []
  basis: Batin Krat Tiga succeeds Batin Iron-nails and is translated as Chief Cut-in-Three-Pieces;
