canonical_text:
  quote: ''
  summary: 'The passage describes Besisi musical instruments and performance: bamboo
    percussion tubes used in the Rentak Balei ceremony, a bamboo guitar associated
    by tradition with the stick insect, the social importance of drums in chiefs''
    houses, and similarities between Besisi instruments and those of neighboring Semang,
    Sakai, and Peninsular Malay traditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bamboo tubes are called "ding tengkhing" or "quarrelling bamboos," and
    the ceremony is called "Rentak Balei," translated as stamping on the floor of
    the tribal hall.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a Besisi feast, two performers sat in the middle of the chief's room with
    six bamboo tubes arranged as two sets of three.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The largest tubes are described as producing the deepest notes and are called
    male or father; intermediate tubes are called female or mother; the smallest are
    called child or grandchild.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The performers held a tube in each hand and struck them rapidly on the central
    floor-beam of the house to produce a simple harmonious rhythm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One Besisi tune is described as one high note struck by the right hand followed
    by three low notes struck by the left hand in common time, with the first note
    loudest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Besisi tradition says the bamboo guitar was imitated from the stick insect
    and given the same name, "keranting."
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author treats the stick-insect explanation as doubtful and says the instrument
    name is probably onomatopoeic, suggesting a twanging sound.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The drum is described as the most important musical instrument, usually found
    only in tribal chiefs' houses, and possibly an insignia of office.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Besisi drum is compared with sacred drums and gongs used by Malay Rajas
    for calling retainers, and is also said to have close affinities with the ordinary
    drum of Peninsular Malays.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Besisi flutes are made of bamboo and are said to differ little from those
    used by the Semang and Sakai.
  category: object
  evidence_refs:
  - ev:9
