  summary: The passage opens a chapter on maturity customs and beliefs by distinguishing
    tattooing from scarification, raised cicatrices, and face-painting. It states
    that evidence for tattooing proper among Malay Peninsula tribes is uncertain,
    while evidence for scarification and face-painting is abundant. It notes reports
    concerning Semang and Sakai groups of Perak, including a needle operation described
    by Miklucho-Maclay and a later statement by Leonard Wray about Perak Sakai tattooing,
    but emphasizes that details remain lacking.
